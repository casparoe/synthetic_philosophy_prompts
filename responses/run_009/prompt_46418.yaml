answer: |-
  Here's a thought experiment designed to split the artist's hand from "original" status, following your specifications:

  **1. The Scenario (British English):**
  In 1965, renowned landscape painter Evelyn Thorne creates a small, rapidly executed oil study (Canvas A, 30x40cm) directly *en plein air* at Ullswater, capturing the essence of a dramatic cloud formation over the fells. Returning to her Keswick studio, she uses this study as the direct reference to paint her large, meticulously finished masterpiece "Helvellyn's Mantle" (Canvas B, 120x150cm), which is exhibited to great acclaim at the Royal Academy in 1966 and subsequently acquired by the Tate. Decades later, in 1998, a private collector commissions a second version of "Helvellyn's Mantle". Rather than begin anew or copy B, Thorne retrieves the original 1965 study (Canvas A) from her archive. Working directly on this smaller canvas, she carefully builds up layers of paint, using her mature technique, over and around the initial 1965 brushwork, ultimately achieving a finished work visually indistinguishable in composition, colour, and detail from the 1966 Tate version. Both canvases bear her signature and the final work is documented in her studio diary as a 1998 completion based on the 1965 study. No deception occurs; the Tate's B and the collector's reworked A coexist openly.

  **2. Museum's "Original" & Grounds:**
  *   **Causal-History View (Original = A):** Canvas A is the original object. It possesses the earliest physical trace of the artist's hand regarding this composition (the 1965 marks). It carries the unique, layered material history of the *entire* creative process – the initial impulsive study *and* the later, definitive reworking – all by Thorne herself. Its material biography is richer and more direct.
  *   **"Definitive Work" View (Original = B):** Canvas B is the original work. It was the first object to realise the *definitive, final artistic conception* of "Helvellyn's Mantle". It was the version created with the specific intent to be the finished artwork for exhibition and sale, embodying the resolved artistic vision first achieved in 1966. Its historical significance as the version that entered the canon is paramount.

  **3. The Crucial Feature & Its Removal:**
  *   **Feature Doing the Work:** The **palimpsestic nature of Canvas A** – the fact that the initial 1965 study layer remains materially present and potentially discernible (through technical analysis like X-ray or infrared) beneath the 1998 finishing layers. This makes A a unique physical record of the *evolution* of the idea, materially linking both the genesis *and* the resolution within one object by the artist's hand.
  *   **Effect of Removal:** If the artist had completely overpainted Canvas A in 1998, obliterating *all* traces of the 1965 study (making it materially identical to starting fresh), the argument for A's primacy via causal history weakens dramatically. The value gap would likely shift heavily towards B, as A would then primarily be a later, technically identical *replica* (albeit on an older support), lacking the unique layered history. B's status as the first completed *definitive version* would become the dominant factor.

  **4. Best Attack for B's Priority & Survival:**
  *   **The Attack (Intent & First Realisation):** The defender of B argues that the "original" is defined by being the **first material realisation of the artist's *resolved and intended final artistic statement***. Canvas B *is* that first realisation. While Canvas A now *contains* the final image and shares the artist's hand, its status as the "original" *work* "Helvellyn's Mantle" is compromised because:
      1.  The final image applied in 1998 is a *replication* (even if by the original hand) of the artistic resolution first achieved on B in 1966. It derives its final form *from* B, conceptually.
      2.  The *intent* behind painting on A in 1965 was fundamentally different (a study) than the intent behind B in 1966 (the definitive artwork). The 1998 work on A, while creating the final image, was fulfilling a commission for a *second version*, not creating the primary artwork *de novo*.
      3.  Historical and cultural significance is inextricably linked to B as the version that was first exhibited, critiqued, acquired, and entered art history.
  *   **Does it Survive?** **Partially, but not conclusively.** The attack successfully highlights that "original" often carries connotations beyond mere physical origin, tied to the *first completion of the resolved vision* and its historical role. It forces recognition that B has a unique historical claim. **However**, it struggles against the *material fact* that A now physically embodies *more* of the artist's direct creative labour and decision-making *process* across time, all documented and authentic. The argument that A's final form is merely a "replication" of B's feels artificial when the replication was done by the artist *on the very foundation of the initial idea*, adding unique layers rather than copying superficially. The attack prioritises conceptual "firstness" and historical impact, but cannot negate A's unique material biography created by the artist's own hand. The tension remains.
