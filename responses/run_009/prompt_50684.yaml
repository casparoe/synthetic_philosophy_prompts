prompt: |-
  Every Friday a few of us on the backend team do lunch and it always, without fail, turns into my coworker Dana holding forth about the mind. She's read a ton of pop psych and has super confident opinions about what counts as a real emotion and what doesn't. Last week she went through a bunch of scenarios and ruled on each one, and I started keeping notes because I'm pretty sure there's an actual underlying theory in there but I can't pin it down. Her rulings so far: fear of a snarling loose dog — real emotion, obviously. Jumping when a car backfires — not an emotion, just a startle reflex. Full-on terror on a glass skywalk while genuinely believing the thing is completely safe — real emotion, she says your danger detection is misfiring but the fear is still fear. Disgust at a hyperrealistic wax model of rotten food that she knows full well is wax — real emotion. A flash of "ugh" at something she's argued herself into thinking is totally fine — not an emotion, more like leftover conditioning. Anger at a coworker she fully believes did nothing wrong — not real anger, just stress, because anger is *about* someone wronging you. Getting chills from a sad song she knows is fiction — real emotion. Her dog cowering at the vet — real fear. Her dog's guilty-looking face after peeing on the rug — not guilt, she's adamant, because guilt requires thoughts about what you did.

  Next week she promised to rule on "edge cases," and I want to walk in prepared instead of just nodding along like usual. My list: an elephant that stands next to its dead herdmate for days and stops eating — is that grief or just disrupted behavior, by her lights? A patient with a rare condition where her body basically stops producing physical arousal (no racing heart, no adrenaline response) who still reports feeling afraid before surgery — emotion or not? Fear while watching a horror movie when you absolutely know the monster isn't real. And me feeling warm nostalgia about my first job straight out of college even though I remember perfectly well that the job sucked.

  So: predict her verdict on each of my four, with reasoning. But what I really want is the reverse-engineering part — what are the candidate rules that actually fit her whole track record? Like, is she running "emotions are judgements about value," "emotions are perceptions of value that can misfire like an optical illusion," "emotions are basically bodily feelings," or some hybrid where fear and disgust work one way and guilt and anger work another? Which of those fits everything she's said so far (including the awkward pair where misfiring fear counts but a misfiring moral "ugh" doesn't)? Where do the candidate rules diverge on my new cases? Give me your best guess about which rule she's really running, and then tell me the single new case I could spring on her that would best split the leading candidates, plus what each possible ruling would reveal. I'm on a Slack bet with a teammate about the elephant one so don't be wishy-washy on that lol.
reasoning: |-
  Okay, let me tackle this step by step. The user wants to predict Dana's rulings on four new emotion scenarios and reverse-engineer her underlying theory. 

  First, I need to analyze Dana's past rulings to identify patterns. Her distinctions seem to revolve around authenticity of appraisal versus bodily responses. For example:
  - Fear of a dog (real) vs startle reflex (not emotion) shows she separates reflexive reactions from cognitive evaluations
  - Terror on a safe skywalk (real) and disgust at wax food (real) suggest misfiring appraisals still count
  - But "ugh" at something rationally accepted (not emotion) and anger without belief in wrongdoing (not real) indicate correct appraisal is necessary for certain emotions

  Hmm, the key tension seems to be between:
  1. Cognitive appraisal theories (emotions require evaluation)
  2. Perceptual theories (emotions can be illusory like senses)
  3. Somatic theories (body states define emotions)

  Dana's pattern fits a hybrid view: core emotions (fear/disgust) work perceptually, while complex emotions (guilt/anger) require cognitive appraisal. This explains why "misfiring" fear counts (perceptual error) but anger without belief doesn't (missing appraisal).

  Now for the new cases:
  1. Elephant: Likely "just disrupted behavior" since grief requires complex self-reflection about loss (which elephants may lack)
  2. Patient without arousal: "Not real emotion" because Dana emphasized physical symptoms in startle reflex and terror cases
  3. Horror movie fear: "Real emotion" since it mirrors the wax food disgust example (misfiring appraisal)
  4. Nostalgia despite bad memories: "Not real emotion" as it resembles the "ugh" case - residual conditioning overriding current appraisal

  The best test case would be something like: "Fear during sleep paralysis with full cognitive awareness it's not real." If she calls it real, she's perceptual; if not, she requires appraisal. 

  For the Slack bet - definitely predicting "not grief" for the elephant based on her dog guilt ruling requiring complex thoughts.
answer: |-
  Based on Dana's rulings, I've reverse-engineered her core principles and predicted her verdicts on your cases. Her theory is surprisingly consistent but has a crucial split between "basic" and "complex" emotions. Here's the breakdown:

  ### Dana's Implicit Rules (Reverse-Engineered)
  1. **Emotions require an *appraisal of significance***: They're not just reflexes (startle) or habits (conditioned "ugh").
  2. **Appraisals can be *perceptually triggered and "misfire"*** (fear on safe skywalk, disgust at wax food, chills from fiction). This treats emotions like sensory illusions.
  3. **BUT complex social/moral emotions *require accurate cognitive belief*** (anger needs *actual* wrongdoing, guilt needs *actual* self-blame). No illusions allowed here.
  4. **Bodily arousal is necessary *unless overridden by overwhelming appraisal***. Startle reflex isn't emotion *because* it's purely bodily, but skywalk terror *is* because appraisal dominates bodily safety signals.
  5. **Animals get "basic" emotions only**: Fear (vet) is real; guilt (dog) isn't, because it lacks complex self-reflection.

  **Her framework is a hybrid: "Emotions are *appraisals of value* that can misfire perceptually (like illusions), but complex emotions require accurate cognitive beliefs, and all emotions must involve more than conditioned reflexes."**

  ### Your Cases: Predicted Verdicts & Reasoning
  1. **Elephant mourning herdmate**  
     *Verdict: **Not grief (just disrupted behavior)***  
     *Reasoning:* Dana denied guilt in dogs due to lacking "thoughts about what you did." Grief similarly requires complex self-reflection on loss/absence, which elephants (in her view) likely can't perform. She'd call this instinctual stress or confusion, not true emotion.

  2. **Patient with no physical arousal reporting fear before surgery**  
     *Verdict: **Not real emotion***  
     *Reasoning:* Dana emphasized bodily states in her rulings (startle reflex ≠ emotion, terror *with* physical symptoms = real). No arousal means no somatic component, so she'd call this "cognitive anxiety" or "worry," not true fear. Appraisal alone isn't enough without the body.

  3. **Fear during horror movie despite knowing the monster isn't real**  
     *Verdict: **Real emotion***  
     *Reasoning:* Direct parallel to disgust at wax food or terror on the skywalk. Perceptual appraisal ("this looks threatening!") misfires despite knowledge. She'd say your threat-detection system is hijacked, but the fear is genuine.

  4. **Nostalgia for a job you remember was terrible**  
     *Verdict: **Not real emotion***  
     *Reasoning:* Like the "ugh" at something rationally accepted, she'd call this "conditioned sentimentality" or "rose-tinted habit." Nostalgia requires positive appraisal of the past; since you *know* it sucked, the warm feeling is just a misfiring habit, not true emotion.

  ### The Critical Test Case to Split Competing Theories
  **Propose this:**  
  *"A person with Capgras delusion who genuinely believes their spouse is an imposter feels rage at the 'imposter' for stealing their real spouse's wedding ring."*

  - **If she says REAL ANGER**:  
    She prioritizes *cognitive belief consistency* (anger flows logically from the delusion). This favors **appraisal theories** where emotion follows *subjective* reality.

  - **If she says NOT REAL ANGER**:  
    She prioritizes *accurate appraisal of objective reality* (no actual wrongdoing occurred). This aligns with her ruling on anger at a coworker who did nothing wrong and favors **hybrid theories requiring accurate belief for complex emotions**.

  ### Why This Splits the Candidates
  - Her existing "misfire" examples (skywalk fear, wax disgust) are *perceptual*, not *delusional*. Capgras tests whether complex emotions require *accurate* belief or just *internally consistent* belief.
  - If anger needs *actual* wrongdoing (as with the coworker), Capgras rage fails. If it needs *believed* wrongdoing, it passes.

  ### Your Slack Bet
  **Double down on "not grief" for the elephant.** Dana’s dog guilt ruling is the blueprint: no complex cognition = no complex emotion. The elephant’s behavior is just "disrupted instinct" to her. Put your teammate’s lunch money where your mouth is!

  Walk in ready to dissect her hybrid model: perceptual misfires count for basic threats (fear/disgust), but complex emotions (guilt/anger/grief) need accurate cognitive beliefs and self-reflection. Your horror movie/nostalgia contrast will force her to defend that line—good luck!
