answer: |-
  You've struck at the heart of the issue, but I don't accept the circularity charge. The decision-theoretic program doesn't *assume* you care about branch weights proportionally. Instead, it derives that rational *action* must *correspond* to maximizing expected utility defined by those weights. Here's why your branch egalitarianism fails within the axioms:

  1.  **Rational Indifference Demands Sensitivity to Amplitude:** Consider two quantum games. Game A: A single branch with outcome X (amplitude 1). Game B: Two branches with identical outcome X (each amplitude √(1/2)). As a rational agent, you should be indifferent between A and B – same outcome everywhere. But Game B has *two* successor branches, each with your preferred outcome. If you were truly egalitarian (one vote per branch), Game B would seem *better* – double the X-outcome branches! Yet indifference is rationally required. The *only* way to be indifferent is to recognize that what matters isn't the raw *number* of branches, but their *amplitude-squared measure*. Your egalitarianism violates this basic rational indifference principle.

  2.  **The Source of the Measure:** The weights aren't smuggled in as primitive probabilities. They emerge from the *structure* of the Hilbert space decomposition. The decision axioms (ordering, diachronic consistency, branching indifference, etc.) constrain how a rational agent aggregates preferences across a branching future. Wallace proves that *only* an agent whose betting behavior aligns with the Born rule (amplitude-squared) satisfies all these axioms simultaneously. Your egalitarian violates diachronic consistency – your preference ordering changes depending on how a branching event is described (e.g., seeing one fat branch vs. two thin branches with the same net amplitude).

  The rationality constraint isn't *defined* by the weights; the weights are the *output* of applying decision-theoretic rationality to the unique structure of Everettian branching. Your egalitarianism is ruled out because it leads to inconsistent, incoherent preferences across different but physically equivalent descriptions of branching events. The Born rule measure is what allows consistent value aggregation. Your move?
