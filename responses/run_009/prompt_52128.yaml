  Now, considering possible conflicts. Non-circularity and universality might clash with empirical constraints. If the solution involves natural kinds or scientific practices, does that introduce circularity? For example, using "entrenched" predicates might rely on past usage, which the user rejects. Also, a purely logical solution might ignore how language actually works, making it impractical.

