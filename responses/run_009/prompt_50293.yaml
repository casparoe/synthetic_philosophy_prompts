prompt: |-
  i'm a cog sci phd student working on human-robot teaming, and i've been reading the joint action literature on and off for a year now (searle, bratman, gilbert, tuomela, some tomasello) and honestly the field feels like it's arguing over cases without ever saying what the theory is even FOR. before I read any more of it I want the actual spec: what would an adequate theory of joint action / shared intention have to get right? write me the desiderata, with the motivating case behind each one. but don't just list options — I want definite calls on which requirements are non-negotiable and which are just one camp's taste. some things I specifically want you to take a stance on:

  - implementability: does the theory have to state its conditions precisely enough that I could, in principle, program them? my stake here is that I need to know when my robot teammate is a participant in a joint action and when it's a fancy tool, and talk of interlocking intentions and meshing subplans doesn't compile. if the honest answer is that the theory is only meant to describe adult humans, say so and say exactly what breaks when you try to port it.
  - the theory has to distinguish genuine joint action from mere coincidence (two strangers coincidentally painting the same house) and from strategic interdependence without shared intention (drivers in rush hour traffic). which of these case-pairs actually carve the distinction at its joints and which trade on irrelevant details?
  - scale: does an adequate account have to cover temporally stretched, institution-mediated stuff — a firm shipping a product, generations of builders on one cathedral — or is it fine for the theory to cover only small-scale real-time interaction and declare the big stuff a different phenomenon? this is where I suspect people smuggle in their reductionist or anti-reductionist priors, so be explicit about yours.
  - asymmetric and degraded cases: joint attention in preverbal infants, cooperation under coercion, one party mistaken about what the other is up to, one party only pretending to cooperate. does the theory owe us a unified verdict on these, or can it legitimately treat them as borderline by design? commit.
  - is irreducibility of the collective attitude (the whole "we-mode" thing) a genuine requirement or a metaphysical preference? I want an actual answer, not both-sides.

  also, and this is the part I care about most: flag any pair of desiderata you think can't be jointly satisfied. my worry is that implementability and whatever the anti-reductionists demand are going to collide, and I need to know whether that's a real tension or me misreading the literature. then a quick scorecard at the end — how searle's we-intentions, bratman's shared intentions, and gilbert's plural subjects do against your list. keep it brief, i've read them, i just want them located on your map.

  dont hedge — i'd rather you make definite, possibly wrong calls than give me the balanced tour. and if one of your requirements quietly rules out the robot cases entirely, say that explicitly rather than leaving me to discover it in code review.
reasoning: |-
  Okay, the user is a Cog Sci PhD student working on human-robot teaming, frustrated with the joint action literature's lack of clear purpose. They want a no-nonsense specification of what a theory of joint action must achieve, with definite calls on key debates. Let me unpack their demands.

  First, their core request: desiderata for an adequate theory, with motivating cases and hard stances. But their sub-questions reveal deeper stakes. They're building robots that need to be recognized as teammates, not tools. So implementability isn't academic—it's make-or-break. They're also clearly tired of philosophical hand-waving; when they ask "what is the theory FOR?", they're really asking "can this help me code?".

  The asymmetric/degraded cases point is critical too. Their robots won't start as perfect partners—they'll have misunderstandings, partial commitments, maybe even deceptive modes. A theory that only handles idealized human teams is useless to them. And the scale question? They're probably eyeing applications like warehouse robots in supply chains (institution-mediated) versus dyadic cooperation.

  Ah—the irreducibility debate. They smell metaphysics. Rightly so. Tuomela's we-mode might feel like a solution until you try programming it. "Irrationalist residue" is exactly right; collective intentionality either emerges from individual states or it's magic. For robots, it must be reducible.

  Biggest tension flagged: implementability vs anti-reductionism. Absolutely correct. Gilbert's joint commitments require a "we" that can't be observed or computed—it's a human phenomenological artifact. Bratman gets closer but still relies on mutual responsiveness that's hell to formalize. Searle's we-intentions? Unpackable without circularity.

  Robots-as-teammates test: Any theory requiring prelinguistic sharedness (Gilbert) or irreducible we-intentions (Searle) fails immediately. Bratman survives if you accept degraded "as if" mutual belief—but even that needs operationalizing. The winning move? Bite the bullet: joint action is about functional equivalence, not replicating human phenomenology. Robots won't have "real" shared intention, but they can satisfy the minimal conditions that make cooperation work.

  Final note to self: When scoring theories, avoid academic niceties. User wants blood: "Searle fails implementability" not "Searle presents challenges for computational approaches". They’d appreciate "this is why your robot can't use Gilbert" more than "Gilbert has limitations in HRI contexts".
answer: |-
  Here's the hard-nosed specification you need. Desiderata ranked by non-negotiability, with explicit calls on your sticking points. The core purpose of a joint action theory is to **explain the distinctive stability, robustness, and accountability of cooperative behavior that isn't reducible to individual instrumental action or mere strategic coordination.**

  ### Non-Negotiable Desiderata (The Core "What It's For")
  1.  **Coordination Robustness Under Perturbation:**
      *   *What it must get right:* Explains why participants *persist* and *adjust* their actions when minor obstacles, errors, or suboptimalities arise, even when individual rationality might dictate defection. Distinguishes genuine teamwork from coincidence/parallel action.
      *   *Motivating Case:* Two strangers painting the same house (coincidence) stop if it starts raining. Two painters *jointly* repainting the house discuss adjusting schedules or techniques to cover for the rain delay. Drivers in traffic (strategic interdependence) brake to avoid collision but don't coordinate to clear a blockage ahead; a team clearing the blockage *does*.
      *   *Stance:* **Non-negotiable.** This is the core functional difference the theory must capture. If it can't explain persistence and mutual adjustability beyond individual payoff maximization, it fails.

  2.  **Mutual Obligation & Accountability:**
      *   *What it must get right:* Explains the distinctive normative "glue" – why participants feel *entitled* to rely on each other, can *reproach* for failures, and feel *obligated* to do their part *because* of the joint activity. Distinguishes joint action from mutually beneficial but purely strategic coordination.
      *   *Motivating Case:* Rush hour drivers feel no obligation to help others merge; they only avoid collisions for self-interest. Teammates building a shed feel entitled to expect the other to hand tools when asked and reproachable if they wander off without notice. A coerced laborer feels no genuine obligation to their overseer.
      *   *Stance:* **Non-negotiable.** This normative dimension is central to the phenomenology and stability of joint action. A theory ignoring it misses a defining feature.

  3.  **Cognitive Grounding in Individuals:** *(Your Implementability Demand)*
      *   *What it must get right:* States conditions in terms of individual cognitive/functional states (intentions, beliefs, commitments, expectations) and their interrelations. Must be *in principle* implementable in a non-human agent (e.g., a robot) without requiring magic "group minds."
      *   *Motivating Case:* You *need* to know if your robot has "S" (sufficient for joint action participation) or is just a tool. If the theory relies on unanalyzable "we-feelings" or irreducible group subjects, it fails the robot test. Coincidence lacks the cognitive glue; traffic lacks mutual obligation grounded in recognition of jointness.
      *   *Stance:* **Non-negotiable for your purpose.** A theory that isn't individualistically implementable is scientifically useless for HRI. It *must* compile into agent architectures. **This explicitly rules out theories requiring irreducible group minds or human-only phenomenology.**

  ### Contingent Desiderata (Scope Choices - Pick Your Battles)
  4.  **Scale & Institutional Mediation:**
      *   *What it might get right:* Explains large-scale, long-duration, role-governed cooperation (e.g., a corporation, cathedral builders).
      *   *Stance:* **Not core, and potentially detrimental.** Insisting small-scale "face-to-face" is the *only* genuine case is overly restrictive. However, demanding a *unified* account covering both dyadic lifting and multinational corporations is likely impossible and obscures core mechanisms. **Accept reductionism:** Large-scale cases are built on layered structures of smaller-scale joint commitments (e.g., manager-team commitments, inter-departmental agreements). The core theory needs to cover the minimal unit (small-scale, interdependent commitment), which scales *structurally*, not phenomenologically. Don't demand a unified account of the phenomenology across scales.

  5.  **Degraded & Asymmetric Cases:**
      *   *What it might get right:* Provides clear verdicts on cases like infant joint attention, coercion, deception, or unilateral mistake.
      *   *Stance:* **Borderline by design is legitimate.** A core theory defines the *paradigm case*. Degraded cases test its boundaries. *Requiring* unified verdicts often forces contortions. Pre-verbal joint attention might be a *precursor* lacking full normative obligation. Coercion lacks the *voluntary* commitment core to obligation. Deception/mistake often *break* the jointness. **The core theory owes clarity on *why* these cases are borderline or fail, not necessarily a forced "joint/not-joint" verdict.** It should explain what key element is missing or distorted.

  ### Rejected as Core Requirement (Your Irreducibility Question)
  6.  **Irreducibility of the Collective Attitude ("We-Mode"):**
      *   *What it claims:* That "we-intend" or "plural subject" cannot be analyzed without circularity into individual "I-intend" + beliefs.
      *   *Stance:* **Metaphysical preference, not requirement.** While *phenomenologically* distinct, the *functional role* of "we-intending" (robustness, obligation) *must* be explainable by the structure of interrelated individual states for implementability (Desideratum 3). Insisting on ontological irreducibility makes the theory empirically inert and unimplementable. It's a description of the human *experience*, not a prerequisite for the *function*.

  ### Key Tensions (Your Worry Confirmed)
  *   **Implementability (3) vs. Anti-Reductionism (6):** **Collision is inevitable and irreconcilable.** Anti-reductionism (Searle, Gilbert) demands a primitive "we" that cannot be computed from individual states. Implementability *requires* reducibility to individual cognitive architectures. **You must choose: Pick Implementability.** Anti-reductionist theories are non-starters for HRI.
  *   **Robustness (1) & Obligation (2) vs. Precise Verdicts on Degraded Cases (5):** Demanding clear "joint/not-joint" for *all* degraded cases often forces weakening the core definitions (e.g., watering down obligation to mere expectation), undermining the explanation of robustness and normativity in the core cases. **Accept that the core defines the target phenomenon; degraded cases are illuminating failures or precursors.**

  ### Theory Scorecard (Against Non-Negotiables 1,2,3)
  *   **Searle (We-Intentions):**
      *   Robustness (1): Weak. Primitive "we-intend" doesn't inherently explain mutual adjustment.
      *   Obligation (2): Very weak. No inherent normative component.
      *   Implementability (3): **Fails.** "We-intend" is explicitly irreducible and non-individualistic. Uncompilable.
      *   *Verdict:* Useful for phenomenology, useless for HRI.
  *   **Bratman (Shared Cooperative Activity - Interlocking/Meshing):**
      *   Robustness (1): **Strong.** Mutual responsiveness & commitment to mutual support explain adjustment.
      *   Obligation (2): Moderate/Weak. Normativity emerges weakly from commitments and expectations, but not core. Reproach is more about broken expectations than deep obligation.
      *   Implementability (3): **Strongest contender.** Individual intentions + mutual beliefs + meshing subplans are *in principle* computable/implementable (though mutual belief is challenging). Focuses on functional interrelations.
      *   *Verdict:* Best fit for HRI. Needs bolstering on normativity (Desideratum 2).
  *   **Gilbert (Plural Subjects / Joint Commitment):**
      *   Robustness (1): **Strong.** Joint commitment explains persistence and mutual support.
      *   Obligation (2): **Strongest.** Joint commitment *is* the source of obligation and entitlements.
      *   Implementability (3): **Fails catastrophically.** "Plural subject" and "joint commitment" are fundamentally irreducible collective concepts. Requires a pre-existing "we" that cannot be built from individual states. Impossible to implement in distinct artificial agents.
      *   *Verdict:* Best account of normativity, utterly unusable for your purpose. Rules out robots as genuine participants.

  **Your Takeaway:** You need a **functional, individualistic, reductionist** account focused on **robust coordination** and **emergent normativity**. Bratman provides the best foundation. Ditch Searle and Gilbert as unimplementable. Strengthen Bratman by explicitly incorporating a *functional equivalent of mutual obligation* (e.g., explicit commitment protocols generating entitlements/reproach in the robot architecture). Accept that large-scale is built from small-scale units, and degraded cases will be imperfect approximations. **The robot *can* be a participant if its cognitive architecture instantiates the right interlocking commitments and mutual responsiveness, generating the functional outputs of robustness and accountability – even if its "experience" isn't human.**
