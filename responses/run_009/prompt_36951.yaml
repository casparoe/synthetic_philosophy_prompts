  ### St. Petersburg Paradox: Decision Tree Quiz  
  **Starting point:** Someone offers you a single play of the St. Petersburg lottery for $100. The game: A fair coin is tossed until it lands heads. If heads first appears on the *n*-th toss, you win $2<sup>n</sup> (e.g., $2 for n=1, $4 for n=2, $8 for n=3, etc.). *Re-run this tree for $10,000 and $1,000,000 to test price sensitivity.*

  ---

  #### 1. **Does the game’s infinite expected monetary value settle the issue?**  
     - **Yes, I should pay any finite price.**  
       → **Leaf 1: Unbounded Expected Value Maximizer**  
       *Rationale: Infinite expectation implies paying any finite cost is rational. (Holds for $100, $10k, $1M.)*  
       *Unoccupied? Rare in practice; most find this absurd.*  

     - **No, something’s wrong.**  
       → Go to 2.  

  #### 2. **Is your refusal mainly because the casino can’t cover unbounded payouts?**  
     - **Yes, payouts are physically/financially impossible.**  
       → Go to 3.  
     - **No, I’d refuse even with infinite resources.**  
       → Go to 4.  

  #### 3. **If the casino caps payouts at $1 trillion (≈$10<sup>12</sup>), would you pay up to the *capped* EV (≈$40) for one play?**  
     - **Yes, $40 is fair for the capped game.**  
       → **Leaf 2: Capped-Game EV Maximizer**  
       *Rationale: Finite cap makes the game tractable (EV ≈ sum to n=40).*  
       *Changes verdict? Yes—caps resolve your objection.*  
     - **No, I still wouldn’t pay $40.**  
       → Go to 4. (Your objection runs deeper.)  

  #### 4. **Is your utility for money bounded?**  
  *(i.e., does each extra dollar give less happiness than the last?)*  
     - **Yes, utility diminishes.**  
       → Go to 5.  
     - **No, money has linear utility for me.**  
       → Go to 6.  

  #### 5. **What if payouts are scaled to give *unbounded utility* (e.g., win $u^{-1}(2^n)$)?**  
  *(This "Petrograd lottery" forces infinite expected utility.)*  
     - **I’d pay any finite price for this version.**  
       → **Leaf 3: Bounded Utility but Petrograd-Vulnerable**  
       *Vulnerability: Your fix fails if payouts evade diminishing returns. Unoccupied? Incoherent in most theories.*  
     - **I still wouldn’t pay much (or it’s impossible).**  
       → **Leaf 4: Bounded Utility Theorist**  
       *Rationale: Diminishing returns cap what you’ll pay (e.g., $4 for log-utility). Unchanged by caps? Yes—bounded utility protects you.*  

  #### 6. **Should probabilities below a threshold (e.g., 1 in 10<sup>15</sup>) be ignored?**  
     - **Yes, treat tiny probabilities as zero.**  
       → **Leaf 5: Probability Truncator**  
       *Rationale: Negligible chances don’t justify cost (e.g., truncate after n=50). Unchanged by caps? Often—you ignore low probabilities regardless of bankroll.*  
       *Indistinguishable from Leaf 4? Use test case: A lottery has a 1-in-10<sup>15</sup> chance to win $10<sup>15</sup> (EV=$1,000). Bounded utility (Leaf 4) rejects due to flat returns; truncators (Leaf 5) reject due to "impossible" odds.*  
     - **No, take all probabilities seriously.**  
       → Go to 7.  

  #### 7. **Does the answer change if you get 1,000 independent plays?**  
     - **Yes, I’d pay more per play for 1,000 plays.**  
       → **Leaf 6: Repeated-Play Converger (Easwaran-style)**  
       *Rationale: Many plays make average payout converge to a finite value (though one play doesn’t).*  
     - **No, my refusal stands even for 1,000 plays.**  
       → Go to 8.  

  #### 8. **Is the problem that infinite expectations can’t guide one-shot choices?**  
     - **Yes, infinite expectations are pathological here.**  
       → **Leaf 7: One-Shot Rejectionist**  
       *Rationale: Expectation fails for fat-tailed distributions. (May accept capped/repeated versions.)*  
     - **No, I reject the setup entirely (e.g., only finite coin flips exist).**  
       → **Leaf 8: Physical Finitist**  
       *Rationale: The universe limits flips (e.g., n≤100), so EV is finite ($100). Unchanged by caps? Redundant—you assume natural caps.*  
     - **I see it as a math puzzle, not decision advice.**  
       → **Leaf 9: Deflationary View**  
       *Rationale: The paradox exposes a quirk of expectation, not real-world rationality.*  

  ---

  ### Key Gaps & Notes  
  - **Unoccupied combinations:**  
    - *Leaf 3 (Petrograd-vulnerable):* Unattractive—bounded utility shouldn’t allow infinite utility payouts.  
    - *Rejecting bounded utility + truncation?* Possible but rare; tree forces a primary reason.  
  - **Indistinguishable leaves?**  
    - *Leaf 4 (bounded utility) vs. Leaf 5 (truncation):* Use the $10<sup>15</sup> test case (above) to split them.  
    - *Leaf 7 (one-shot) vs. Leaf 9 (deflationary):* One-shot focuses on distribution; deflationary rejects applicability.  
  - **Price sensitivity?**  
    - *Leaf 4/5:* Pay little ($10–$100), regardless of ask price ($100 to $1M).  
    - *Leaf 6:* Pays more per play for 1,000 plays (e.g., $100/play at $100k total).  
    - *Leaf 1:* Pays any price (even $1M).  
  - **Bankroll cap ($10<sup>12</sup>) effects:**  
    - Changes verdicts: *Leaf 2* (starts paying), *Leaf 8* (uses natural cap).  
    - Unchanged: *Leaf 4* (bounded utility), *Leaf 5* (truncation), *Leaf 7/9* (reject expectation).  

  **Instructions:** Re-run for $10,000 and $1,000,000. Do your answers change? Discuss where you land and why!
