prompt: |-
  I'm trying to sort out what I actually believe about supererogation — acts that are praiseworthy to do but not wrong to omit — and I'd like you to act as a moral philosopher doing reflective equilibrium with me. Here are my verdicts on a set of cases. Donating a kidney to an anonymous stranger: clearly above and beyond the call; heroic, but nobody is blameworthy for keeping both kidneys. Pulling a drowning child out of a shallow pond at the cost of ruining an expensive coat: obligatory, full stop — I'd blame someone who walked past. A firefighter who, after completing the assigned rescue, goes back into the collapsing building for one more occupant: supererogatory, and I'd hate a department that required it of her. A person who gives away 40% of her income to effective charities for thirty years: praiseworthy, but my intuitions here are murkier — it feels less like an optional heroism and more like something closer to a duty that most of us fail, even though the lifetime cost surely exceeds that of a single kidney. And here is the pair I can't reconcile: I think refusing to donate a kidney to a stranger is fine, but refusing to be the sole bone marrow match for your sibling feels at least pro tanto wrong — even though the marrow case involves someone with a special relationship and the kidney case doesn't, and I can't see why the relationship should raise the bar rather than just adding a reason. I keep flip-flopping on monthly blood donation too: individually painless and minor, yet I don't think most people who never donate are doing anything wrong.

  Before you answer, please brainstorm on paper: sketch the candidate principles that occur to you (cost-threshold views, where duty runs out at some level of sacrifice; agreement-based views, where supererogation requires an actual promise or role; effort- vs. outcome-based views; whatever else you can generate), and then test each against my cases. Then commit: I want you to either defend one principle that captures all or nearly all of my verdicts — stating exactly which verdicts it forces me to drop and why those are the right ones to drop — or else defend the claim that supererogation is not a single phenomenon and say what the small set of principles is. Whichever way you go, take a definite position and argue for it rather than cataloguing the options for me to choose among. Please also tell me what your chosen account predicts about two cases I haven't mentioned: a billionaire asked to give a billion dollars to save a thousand lives, and someone who could undergo a risky, permanently debilitating procedure to save a stranger's leg rather than their life. And since I'd rather have your honest view than a confident-sounding one, flag explicitly any point where your principle is only barely saving a verdict, or where you're riding a contested assumption — I'd rather know where the stitching shows.
reasoning: |-
  Okay, the user is really diving deep into supererogation and has given me a lot to work with. They've laid out several specific cases where their intuitions about what's obligatory versus supererogatory conflict. The kidney donation to a stranger feels supererogatory, but refusing bone marrow to a sibling feels wrong. The drowning child is obligatory, but donating 40% of income to charity feels murky - praiseworthy but maybe closer to duty. And monthly blood donation is confusing too - minor cost but not obligatory.

  I need to help them find a consistent principle. Let me brainstorm possible approaches. First, cost-threshold views: maybe duty stops when sacrifice exceeds a certain level. But their cases complicate this. The pond case has low cost (ruined coat) and is obligatory, while kidney donation has high cost and is supererogatory. That makes sense for cost-threshold. But then the 40% income donation - lifetime cost is high like a kidney, yet feels more dutiful. Hmm, problem. And bone marrow to sibling - cost similar to kidney but feels obligatory? Another problem. Cost alone isn't enough.

  What about special relationships? That explains why bone marrow to sibling feels wrong to refuse while kidney to stranger doesn't. But then why does the firefighter going back into the building feel supererogatory? They have a professional role, which is a kind of relationship, but they've fulfilled their duty already. Maybe roles create duties only up to a point. For charity, no special relationship, so donating 40% might be supererogatory despite high cost. But the user feels it's closer to duty - that doesn't fit.

  Another idea: actual agreements or promises. The firefighter agreed to do rescues but not beyond. No agreement for kidney donation. But for the sibling, family might imply an implicit agreement. However, the drowning child case has no agreement and is obligatory, so agreements can't be the whole story.

  Effort versus outcome? The pond case is low effort, high outcome, so obligatory. Kidney is high effort, high outcome, supererogatory. But blood donation is low effort, high outcome, yet not obligatory. And the 40% donation involves sustained effort over time, which might make it feel more demanding even if annual cost is low. That could explain the murkiness.

  Putting this together, I'm leaning toward a hybrid view: baseline cost-threshold plus special relationships plus sustained effort. Duty requires action when: 1) cost is below a context-sensitive threshold, 2) or special relationships create stronger obligations, and 3) sustained efforts feel more obligatory than one-off sacrifices even at similar total cost. 

  Testing this: Pond case - low cost, so obligatory. Kidney - high cost, no relationship, so supererogatory. Firefighter - already fulfilled duty, extra is high cost, so supererogatory. Bone marrow to sibling - special relationship raises obligation despite high cost. Charity - high total cost but no relationship, should be supererogatory, but the sustained effort makes it feel more pressing. Blood donation - low per-instance cost, but the user's intuition that not donating isn't wrong fits because no sustained commitment is required.

  For the unresolved cases: Billionaire giving a billion to save thousands - cost is low relative to wealth, so likely obligatory. Risky procedure to save a stranger's leg - high cost (permanent debilitation) for lesser good, so supererogatory.

  I should acknowledge where this is messy. The charity case is the hardest - why does sustained effort make it feel more dutiful? Maybe because repeated refusal feels like a character flaw, whereas one-off sacrifices are easier to excuse. But that's a bit fuzzy. Also, the cost-threshold is context-dependent, which some might find unsatisfying.

  The user seems to want coherence and is comfortable with nuance. They'd appreciate honesty about where the theory strains. I'll present this hybrid view, flag the charity case as the toughest fit, and suggest that sustained efforts create a different kind of moral pressure. They might be open to adjusting their intuition there - seeing charity as truly supererogatory despite the nagging feeling it shouldn't be.
answer: |-
  Your intuitions reveal a coherent but complex moral landscape. After testing candidate principles against your cases, I defend a **Hybrid Cost-Relationship Account with a Sustained Effort Modifier** – though it requires revising one intuition. Here's the rationale, tested against your cases, with explicit flags where the stitching shows.

  **Core Principle:**  
  1.  **Cost Threshold:** An act is obligatory *only if* the net cost to the agent (physical/psychological/financial/lifestyle) falls below a contextually determined threshold of "significant sacrifice" for that agent in that situation.  
  2.  **Relationship Amplifier:** Special relationships (family, close friends, specific professional roles *during duty*) significantly *lower* the cost threshold for obligation towards the related person. They don't "add a reason"; they fundamentally alter the baseline demand level.  
  3.  **Sustained Effort Modifier:** Acts requiring repeated, sustained effort over time feel *more* obligatory than one-off acts with similar *total* cost, due to the psychological burden of ongoing commitment and the cumulative impact of repeated refusals.

  **Testing Against Your Verdicts:**

  1.  **Kidney to Stranger:**  
      *High cost* (major surgery, permanent impact, health risk) exceeds the baseline threshold for a stranger (*no relationship amplifier*). → **Supererogatory (Matches)**.

  2.  **Drowning Child (Pond):**  
      *Very low cost* (ruined coat, minor inconvenience) falls *far below* the baseline threshold (*no relationship needed*). → **Obligatory (Matches)**.

  3.  **Firefighter Going Back In:**  
      *High cost* (extreme risk, likely death) exceeds the threshold. *Professional role* created an obligation *for the assigned rescue*, fulfilling it satisfies the role's core demands. Going *beyond* this core isn't part of the role's obligatory structure ("assigned rescue" implies a limit). → **Supererogatory (Matches)**.  
      *Flag:* This leans on interpreting the "assigned rescue" as defining the role's obligatory scope. If the role were defined as "save everyone possible," it might shift.

  4.  **Giving 40% Income for 30 Years:**  
      *High lifetime cost* (comparable to kidney). *No special relationship* to beneficiaries. *Pure cost-threshold* suggests **supererogatory**.  
      *BUT* your intuition finds it murky, closer to a failed duty. **Sustained Effort Modifier explains this:** The *ongoing nature* of the sacrifice (monthly budgeting, constant awareness of need, cumulative lifetime impact of *choosing not to give* each year) creates a stronger sense of obligation than a single high-cost act. The modifier *partially bridges* the gap towards duty, making the failure feel blameworthy *in aggregate*, even if each individual decision to not donate *this month* might not be. → **Principle predicts Supererogatory, but Modifier explains murky intuition.** *You may need to revise this intuition slightly towards supererogation, accepting the sustained effort makes the failure feel worse without making the act itself obligatory.*

  5.  **Bone Marrow to Sibling vs. Kidney to Stranger:**  
      *Similar cost* (medical procedure, discomfort, some risk). Key difference: **Special Relationship (Sibling)**. This *amplifies* the obligation, *lowering* the cost threshold significantly. Refusal now likely falls *below* the *amplified* threshold, making it **pro tanto wrong (Matches)**. The relationship fundamentally changes the baseline demand, it doesn't just add a reason weighed against the cost.

  6.  **Monthly Blood Donation:**  
      *Low per-instance cost* (minor time, brief discomfort). *However, no special relationship*. Pure cost-threshold suggests *each individual donation* is supererogatory, but obligation might arise if *refusing causes immediate, specific harm to an identifiable person you encounter* (like the pond – but blood donation isn't like that). **Sustained Effort Modifier is weak here:** While sustained, the *per-instance* cost is *so* low that the cumulative burden isn't heavy enough to trigger a strong sense of general obligation. Most people's refusal isn't a *sustained* refusal of a *high-burden* commitment. → **Not obligatory (Matches your intuition).**

  **Predictions for New Cases:**

  1.  **Billionaire Donating $1B to Save 1000 Lives:**  
      *Cost:* Extreme financial loss, but proportional to vast wealth. Context matters: Does it impoverish them? Ruin their life's work? Likely, the *relative cost* (even $1B) for a billionaire falls *below* the threshold of "significant sacrifice" – they retain immense wealth and lifestyle. *No special relationship*. → **Obligatory.**  
      *Flag:* This assumes a non-absolute, proportional view of cost. An absolute cost-threshold view (e.g., "costs over $X are always supererogatory") would say supererogatory, but clashes with your pond case intuition (cost matters relatively).

  2.  **Risky, Debilitating Procedure to Save a Stranger's Leg (Not Life):**  
      *Cost:* Extremely high (permanent debilitation, significant life impact). *Benefit:* Significant but non-life-saving. *No special relationship*. The high cost *exceeds* the baseline threshold for this level of benefit to a stranger. → **Supererogatory.**  
      *Flag:* If the benefit were saving a life, the cost/benefit ratio *might* nudge closer to the threshold, but permanent debilitation likely still exceeds it for a stranger. If it were for a child or family member, the relationship amplifier could make it obligatory.

  **Where the Stitching Shows & Commitments:**

  1.  **The 40% Charity Case is the Biggest Stretch:** My principle firmly places it as supererogatory. The *Sustained Effort Modifier* is crucial to explain your murky intuition, but it's an *explanatory device*, not a core obligation-generator. **I argue this is the intuition to revise.** Seeing charity as supererogatory aligns it with kidney donation (similar cost, no relationship). The feeling that it's a "failed duty" stems from the *collective impact* of widespread omission and the *psychological salience* of sustained commitment, not individual obligation. This preserves coherence elsewhere.

  2.  **Cost Threshold is Contextual & Subjective:** "Significant sacrifice" isn't a fixed dollar amount or pain level. It depends on the agent's resources, obligations, and the situation. This is messy but necessary (ruining a coat isn't significant for a billionaire, but is for a student). It relies on intuitive judgment.

  3.  **Relationships Change the Demand Floor:** This is key. It's not "more reasons," it's a different *level of expected sacrifice*. We hold family to a higher minimum standard of aid than strangers. This explains the sibling marrow case cleanly.

  4.  **Sustained Effort is Descriptive, Not Perfectly Normative:** It explains *why* ongoing acts feel more pressing, but doesn't perfectly justify turning supererogation into obligation. It bridges the psychological gap in the charity case.

  **Conclusion:** Supererogation *is* largely a single phenomenon: acts where the cost exceeds the contextually and relationally determined threshold of obligatory sacrifice. Your intuitions are mostly captured by this Hybrid Cost-Relationship Account. The significant revision required is accepting that substantial, sustained charitable giving, while immensely praiseworthy and perhaps *collectively* imperative, remains supererogatory for the individual, aligning it with heroic one-off sacrifices like kidney donation. The discomfort arises from the unique psychological weight of sustained commitment and societal failure, not individual duty. This preserves the clear lines in your other cases, especially the crucial distinction between sibling marrow (obligatory due to relationship) and stranger kidney (supererogatory due to cost).
