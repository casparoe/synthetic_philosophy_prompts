  Hmm, the user wants me to analyze the Han van Meegeren Vermeer forgeries through the lens of Nelson Goodman's and Denis Dutton's theories about what makes forgeries bad. This is a sophisticated philosophical and art historical inquiry that requires careful mapping between theory and case in both directions.

  Looking at the facts provided: Van Meegeren forged Vermeers between 1936-1945, with "The Supper at Emmaus" being authenticated by leading expert Bredius in 1937 and celebrated as a masterpiece. Another fake "Christ and the Adulteress" was sold to Göring. After the war, Van Meegeren confessed to forgery and demonstrated his skill by painting a new "Vermeer" before witnesses. Once exposed, critical praise evaporated and the works were dismissed as kitsch.

  For Goodman's autographic/allographic distinction: Painting is autographic - the work's identity depends on its history of production. Even a perfect forgery is a different work because it lacks the right causal origin (Vermeer's hand). This explains why revelation matters - we're valuing the historical object, not just the appearance. Goodman would say undetectable forgery remains relevant for painting but not for allographic arts like music (where notation defines the work regardless of who performs it). Goodman's theory is silent on the Göring sale, Van Meegeren's motives, or the critics' embarrassment - these are extraneous to the ontological distinction he's making.

  For Dutton's performance theory: Artworks record achievements. When we appreciate "Emmaus" as a Vermeer, we're responding to the achievement of 17th-century genius overcoming technical limitations. The forgery records Van Meegeren's different achievement (deception and pastiche). Revelation shows we were appreciating the wrong performance. Dutton explains the devaluation better than Goodman because it addresses why the aesthetic experience collapses - we're not just mistaken about origin, but about what kind of achievement we're confronting. Like Goodman, Dutton doesn't speak to the Göring transaction or Van Meegeren's motives.

  Now case to theory: The critical reversal seems to support both theories in showing we value historical provenance. But the key test is how someone unaware of the forgery would respond. Goodman would say they're appreciating a different work (a Van Meegeren) while mistakenly calling it Vermeer - the experience is ontologically misdirected but possibly valid on its own terms. Dutton would say they're fundamentally misreading the achievement - praising 17th-century innovation when they're actually seeing 20th-century imitation. The fact that critics retrospectively described it as "kitsch" suggests Dutton's performance theory better captures the experiential shift - the same visual properties feel different when understood as pastiche rather than innovation.

  Verdict: Dutton's theory survives better because it accounts for the dramatic collapse in aesthetic appreciation, not just the categorical misidentification. Both theories are tested by the speed and totality of the devaluation - neither fully anticipates how social factors (embarrassment of experts) amplified the rejection, though Goodman's strict ontology might better explain why the work remains permanently reclassified as inauthentic.

