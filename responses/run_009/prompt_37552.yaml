answer: |-
  ### Theory to Case
  **Goodman (Autographic/Allographic):**  
  Goodman defines painting as *autographic*: a work’s identity depends on its history of production. *The Supper at Emmaus* is a Vermeer only if Vermeer created it. When van Meegeren’s forgery is revealed, the painting loses its status as a Vermeer because its causal history (Van Meegeren’s hand, not Vermeer’s) is falsified. For Goodman, an undetectable forgery remains problematic because authenticity hinges on origin, not appearance. This *only* applies to autographic arts (e.g., painting), where the physical object’s genesis is constitutive. In allographic arts (e.g., music), a score defines the work; any correct performance is authentic, regardless of history.  
  *Silences*: Goodman’s theory does not address the Göring sale (a moral/political issue), van Meegeren’s motives, or the *content* of critical reversal (e.g., "kitsch" labels). It only states the ontological error: misattribution of genesis.  

  **Dutton (Art as Performance):**  
  Dutton views artworks as "performances" that record an artist’s achievement. Valuing *Emmaus* as a Vermeer meant celebrating Vermeer’s unique 17th-century mastery—his innovative technique, cultural context, and artistic struggle. The forgery records van Meegeren’s different "performance": deliberate imitation and deception. Revelation exposes this mismatch; the achievement appreciated (Vermeer’s genius) was never there. The painting’s value collapses because its perceived significance—rooted in a specific historical feat—is void.  
  *Silences*: Like Goodman, Dutton ignores the Göring sale or van Meegeren’s greed. His focus is on the *collapse of perceived achievement*, not the critics’ psychology or market dynamics.  

  ---

  ### Case to Theory  
  The **critical reversal**—praise evaporating upon exposure, with *Emmaus* deemed "kitsch"—tests both theories:  
  - **Goodman** explains the *reclassification*: the painting was never a Vermeer, so its prior valuation was categorically mistaken. Yet it cannot fully explain the aesthetic denigration ("kitsch"). Goodman allows that a forgery might *look* identical and thus be perceptually admirable—if one never learns the truth, it could retain subjective value.  
  - **Dutton** better explains the **devaluation**: critics weren’t just wrong about origin; they misread the *achievement*. What seemed profound (Vermeer’s innovation) was instead a derivative, deceptive act. The "kitsch" label reflects this: without the context of Vermeer’s struggle, the work appears hollow.  

  **Crucial Test: An Uninformed Viewer**  
  - If someone never learns of the forgery, Goodman predicts they *could* validly admire the work *as if* it were a Vermeer (since visual properties are unchanged).  
  - Dutton predicts their appreciation is *always misguided*: they attribute the wrong achievement (Vermeer’s brilliance, not van Meegeren’s deceit).  
  The case supports **Dutton**: critics retroactively dismissed *Emmaus* as aesthetically inferior ("kitsch"), implying the performance (achievement) is inseparable from appreciation. Goodman’s theory is embarrassed by this aesthetic collapse; his strict ontology permits formal admiration regardless of history.  

  ---

  ### Verdict  
  **Dutton’s theory survives better**. It explains the total devaluation (aesthetic and historical) by linking artistic value to the *correct interpretation* of achievement. Goodman’s autographic distinction clarifies the *ontological* error but cannot account for the shift in aesthetic judgment.  

  **Both theories are tested beyond their scope**:  
  - Goodman’s rigid history-dependence struggles with the *intensity* of critical shame—social factors amplify the rejection.  
  - Dutton’s "performance" falters in explaining why *Emmaus* remains a *physical* curiosity (unlike a musical performance, it persists as an object).  
  Yet Dutton’s framework better captures the holistic collapse of value when van Meegeren’s forgery reframed the achievement recorded.  

