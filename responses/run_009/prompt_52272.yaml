  My ethics professor used "it's the thought that counts" in a discussion of Kantian moral worth -- we were talking about whether someone who does the right thing but for self-interested reasons gets any credit for it, and she sort of waved at that proverb like it settled the question. But I've only ever heard that phrase said about presents, where it's basically just an apology for a bad gift. So I'm suspicious that two totally different claims are being run together. Can you lay out the distinct precise theses "it's the thought that counts" could be expressing -- from the trivial social-lubricant reading about gifts, to something about motives mattering to how much moral credit you get, to the strong claim that motives are ALL that matters for moral worth and consequences are irrelevant -- and say for each whether its plausible, and whether it would actually support using the phrase in a debate about moral worth? A menu I can bring to class would be great. Also, if it helps, I specifically want to know whether any reading of it would let you say the well-meaning-but-selfish actor is morally better than the person who accidentally does right, because that seemed to be what my professor needed it to do.
