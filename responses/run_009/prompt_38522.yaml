  - **No, if principled:** Self-reference *does* create unavoidable blind spots (e.g., Gödelian incompleteness). The knower paradox and Moorean assertions are genuine phenomena, and your resolution aligns with them.  

  **To avoid unfalsifiability:**  
  - Specify **independent criteria** for when students fall into the Moorean trap (e.g., if they explicitly accept the announcement) versus when they avoid it (e.g., if they withhold belief).  
