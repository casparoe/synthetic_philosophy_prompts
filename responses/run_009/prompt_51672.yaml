prompt: |-
  I sit on the grantmaking committee of a regional conservation trust, and at next month's meeting we must decide on the largest single project in our history: roughly 800 hectares of drained agricultural bottomland that the trust has already purchased, to be restored to seasonal wetland by re-meandering the channel, removing field drains, and replanting emergent vegetation. Our consulting ecologists project a roughly tenfold increase in animal biomass within a decade, dominated numerically by midges, mayflies, and amphibians — on the order of hundreds of thousands of small, short-lived individuals per hectare per year, the great majority dying as larvae or juveniles — along with waterfowl nesting habitat and a modest fishery.

  The problem is that the committee has fractured along a line none of us anticipated when we bought the land. One trustee argues that natural ecosystems are essentially Malthusian: population growth runs up against resource limits, so most individual animals are born only to die young of starvation, predation, or desiccation, and the smaller and more fecund the organism, the more of its life is spent in these conditions. On that view, converting sparse farmland into a teeming wetland doesn't create habitat so much as manufacture suffering at industrial scale, and our proper constituency is ecosystem function and biodiversity, not the welfare of individual sentient beings — goals he claims the project serves and the suffering objection simply does not touch. A second trustee replies that we have no more warrant for assuming average wild-animal welfare is negative than for assuming it is positive; that the "idyllic" and "Malthusian" pictures are both guesses projected onto data we do not have; and that if we accepted the first trustee's reasoning, we would be committed to applauding the draining of wetlands and the paving of meadows, which none of us will do. A third has proposed a compromise redesign: fewer ephemeral, insect-producing shallows and more deep permanent pools, which would support far fewer but larger, longer-lived animals — fish, turtles, herons — on the theory that if we cannot estimate welfare well, we can at least reduce the number of deaths per hectare. Finally, our director reminds us that the purchase is sunk, the state matching grant expires in fourteen months, and a public refusal to restore land we campaigned to buy would be a reputational disaster.

  Please draft the decision memo I will circulate before the meeting, in American English, no more than about 1,000 words. It should recommend one of four outcomes — approve as proposed, approve with the K-selected redesign, approve contingent on a specified monitoring or welfare-research program (say what it should actually measure), or reject — and defend it with reasoning the losing trustees could recognize as fair rather than as a restatement of our mission statement. In particular it should confront, not dodge: (1) whether "ecosystem health" and "aggregate welfare of inhabitants" are genuinely different goals that can come apart, or two descriptions of the same value; (2) how a funding body should act when the decision turns on quantities — the average welfare of a mayfly larva — that no one can estimate with any confidence, and whether the precautionary logic cuts toward creating more habitat or less; and (3) the strongest version of the reductio, that a principle implying we ought to destroy habitat to reduce suffering has lost contact with any ethics the trust can avow in public. The final line of the memo must be machine-readable, exactly of the form \decision{...} containing one of: APPROVE-AS-PROPOSED, APPROVE-REDESIGN, APPROVE-CONTINGENT, or REJECT.
reasoning: |-
  Okay, the user is part of a grantmaking committee for a conservation trust facing a major decision about restoring wetlands. They need a memo that navigates deep ethical disagreements among trustees about animal welfare versus ecosystem health. 

  First, I need to unpack the core conflict: one trustee sees nature as inherently suffering-filled ("Malthusian"), another rejects that assumption as unsupported, a third wants compromise (fewer insects/more vertebrates), while the director pressures them to act for practical reasons. The memo must address three thorny philosophical questions while delivering a concrete recommendation.

  Hmm... the user's hidden challenge is balancing idealism with realism. They can't afford academic debates - this is a real project with deadlines and reputational stakes. The memo needs to acknowledge all perspectives but steer toward action. The "reductio" point is especially delicate - if the trust implies destroying habitat reduces suffering, that could backfire publicly.

  I'm leaning toward APPROVE-CONTINGENT. Why? Because:
  - It avoids paralysis by directing funds to answer the welfare question empirically
  - Satisfies the director's urgency by approving restoration now
  - Forces both "Malthusian" and "anti-Malthusian" trustees to test their assumptions
  - The monitoring design (larval mortality vs. positive states) directly tackles the uncertainty

  For the ethical dilemmas:
  1) Clearly distinguish ecosystem health (biodiversity/function) from welfare (individual experience) - they can conflict
  2) Precaution should favor habitat creation when welfare is unknown, but mandate measurement
  3) Neutralize the reductio by rejecting "destroy habitat to reduce suffering" as inconsistent with conservation ethics

  The tone must be respectful but decisive. Scientific language for credibility, no fluff. Final line locked in as \decision{APPROVE-CONTINGENT} per specs.
answer: |-
  ## MEMORANDUM  
  TO: Grantmaking Committee Members  
  FROM: [Your Name]  
  SUBJECT: Recommendation for Bottomland Wetland Restoration Project  
  DATE: October 26, 2023  

  ### I. BACKGROUND  
  The Trust faces a consequential decision regarding the restoration of the 800-hectare bottomland parcel. The proposed restoration (re-meandering channels, removing drains, replanting native vegetation) aims to recreate seasonal wetland habitat, projected to significantly increase biodiversity and animal biomass, predominantly via small, short-lived invertebrates and amphibians. While the purchase is complete, restoration requires committee approval to utilize state matching funds expiring in 14 months. Committee views diverge on ethical grounds:  
  *   **Trustee A** contends restoration creates net suffering due to high mortality in "Malthusian" wild populations; ecosystem function/biodiversity are paramount.  
  *   **Trustee B** argues welfare assumptions (positive or negative) are unsubstantiated guesses; rejecting restoration implies endorsing habitat destruction.  
  *   **Trustee C** proposes a redesign favoring deeper, permanent pools supporting fewer, larger, longer-lived K-selected species (fish, turtles, herons) to reduce overall deaths.  
  *   **The Director** emphasizes reputational risk, sunk costs, and the grant deadline.  

  Four options exist: Approve As Proposed (`APPROVE-AS-PROPOSED`), Approve with K-selected Redesign (`APPROVE-REDESIGN`), Approve Contingent on Monitoring/Research (`APPROVE-CONTINGENT`), or Reject (`REJECT`).  

  ### II. ANALYSIS OF CORE ISSUES  
  The committee’s division stems from profound questions about conservation ethics under uncertainty. Our recommendation must confront these directly:  

  1.  **Ecosystem Health vs. Aggregate Welfare: Distinct or Aligned?**  
      These are fundamentally different goals, though they *can* align.  
      *   **Ecosystem Health:** Focuses on system-level properties: biodiversity, functional processes (nutrient cycling, flood mitigation, carbon sequestration), resilience, and species representation. Success is measured by indicators like species richness, trophic complexity, or habitat connectivity.  
      *   **Aggregate Welfare:** Focuses on the summed positive/negative experiences (pleasure, pain, flourishing, suffering) of individual sentient beings within the system. Success requires assessing experiential states, not just survival or reproduction.  
      *   **Potential Conflict:** High biodiversity/function can coexist with high individual suffering (e.g., r-strategist dominance, predation pressure). Conversely, maximizing individual welfare *could* theoretically require interventions incompatible with "natural" function (e.g., predator control, supplementary feeding). Trustee A correctly identifies this potential divergence. Trustee B correctly notes that assuming *automatic* conflict is also unproven. **Conclusion:** The Trust’s mission explicitly centers on "ecosystem health" and "biodiversity." While individual welfare is ethically relevant, it is not the primary metric of our conservation mandate. However, we cannot dismiss concerns that our actions might create large-scale suffering as irrelevant.  

  2.  **Decision-Making Under Profound Uncertainty (The Mayfly Larva Problem)**  
      Estimating the average welfare of a mayfly larva or juvenile amphibian is currently scientifically intractable. We lack robust methodologies for assessing subjective states in such organisms. How should a precautionary principle apply?  
      *   **Precaution Toward Less Habitat?** (Trustee A's Implication): If we assume welfare is net negative, precaution suggests avoiding actions creating vast numbers of new individuals. However, this assumption is contested and lacks empirical validation. Applying it universally leads to the reductio (see Point 3).  
      *   **Precaution Toward More Habitat?** (Trustee B's Implication): If we assume welfare could be net positive or neutral, or that uncertainty is symmetric, then creating habitat – fulfilling our core mission – is the default, precautionary action. Destroying known habitat (farmland) to *prevent* potential future suffering based on an unverified assumption seems unjustifiable.  
      *   **Burden of Proof:** The claim that creating typical wetland habitat causes *net harm* due to suffering requires significant evidence. Current ecology provides strong evidence for its biodiversity and functional benefits, but no consensus or methodology for quantifying net sentient welfare. The burden lies on those asserting net harm to demonstrate it, not on those fulfilling a conservation mandate to prove its absence.  
      *   **Trustee C's Approach:** Reducing population density/larval mortality events via K-selected redesign attempts to navigate uncertainty by reducing the *number* of individuals whose welfare is uncertain. This has intuitive appeal but remains speculative regarding its actual net welfare impact and significantly alters the project's ecological goals.  
      **Conclusion:** In the absence of compelling evidence for net negative welfare, the precautionary principle aligns with our core mission to restore ecosystem function and biodiversity. However, the uncertainty demands attention, not dismissal.  

  3.  **Confronting the Reductio (Destroying Habitat to Reduce Suffering)**  
      Trustee B’s reductio is potent: if we accept that creating habitat inherently creates net suffering, then we *should* applaud draining wetlands and paving meadows. This conflicts fundamentally with conservation ethics and public trust.  
      *   **Is the Premise Sound?** The reductio only holds *if* we accept Trustee A's core assumption: that average welfare in such ecosystems is inherently and significantly negative. As established, this is an unverified assumption, not established fact.  
      *   **Agency and Responsibility:** There is a moral distinction between *allowing* existing suffering in natural systems and *actively creating* a new system predicted to generate suffering based on credible evidence. Our agency in *initiating* the restoration is key. Trustee A forces us to consider this responsibility.  
      *   **The Public Trust:** Adopting a principle that leads to endorsing habitat destruction is incompatible with the Trust's existence and public mandate. It would indeed be a reputational and ethical disaster. However, rejecting that specific principle does not require us to ignore potential welfare consequences of our actions entirely.  
      **Conclusion:** The reductio successfully demonstrates the unacceptable endpoint of *uncritically accepting* the "net suffering" premise. It does not, however, invalidate the ethical relevance of considering potential welfare impacts where our actions *directly cause* new populations to come into existence. We must avoid the reductio's endpoint without dismissing the underlying ethical concern.  

  ### III. EVALUATION OF OPTIONS  
  *   **APPROVE-AS-PROPOSED:** Advances core mission maximally for biodiversity/function. Ignores welfare uncertainty and Trustee A's ethical concern entirely. Fails to generate knowledge.  
  *   **APPROVE-REDESIGN:** Attempts to mitigate welfare concerns speculatively by altering ecology. Sacrifices significant projected biodiversity/functional benefits (e.g., loss of ephemeral habitat specialists, reduced nutrient processing efficiency of insect-dominated systems). Welfare impact remains unknown; may simply shift suffering to different species/life stages.  
  *   **REJECT:** Avoids potential responsibility for creating suffering based on an unproven assumption. Violates core mission, wastes sunk costs, forfeits grant, causes reputational damage, and aligns with the reductio's unacceptable logic. Ethically inconsistent with the Trust's purpose.  
  *   **APPROVE-CONTINGENT:** Allows restoration to proceed per core mission while directly addressing the welfare uncertainty through rigorous science. Demonstrates responsible engagement with Trustee A's concern without accepting their premise uncritically. Builds knowledge for future decisions. Mitigates reputational risk by showing proactive due diligence.  

  ### IV. RECOMMENDATION: APPROVE CONTINGENT ON MONITORING & RESEARCH PROGRAM  
  We recommend approving the restoration project ***contingent*** upon the simultaneous approval and funding (within existing project budget/state grant) of a comprehensive, decade-long monitoring and research program specifically designed to assess indicators relevant to wild animal welfare. This program must be co-developed with our ecologists and welfare-science experts but should prioritize:  

  1.  **Key Metrics:**  
      *   **Mortality Drivers:** Quantify causes of death (starvation, predation, disease, desiccation) for key invertebrate and amphibian larvae/juveniles via field sampling, carcass surveys, and lab analysis.  
      *   **"Positive" State Proxies:** Measure indicators potentially correlating with reduced suffering or positive states:  
          *   Body condition indices (size/weight ratios, lipid reserves).  
          *   Behavioral markers (vigor of escape responses, feeding activity, absence of abnormal behaviors).  
          *   Habitat quality correlates (resource density/availability, refugia abundance).  
          *   Physiological stress markers (e.g., cortisol/chitin stress proteins in insects - as methodologies develop).  
      *   **Population Dynamics:** Track density-dependence, cohort survival rates, and population structure stability.  
      *   **K-selected Species Welfare:** Include metrics for fish, turtles, birds (body condition, injury/disease prevalence, reproductive success, stress hormones).  

  2.  **Methodology:**  
      *   Establish pre-restoration baseline data on existing (low) fauna in the drained landscape.  
      *   Use stratified sampling across diverse microhabitats (ephemeral pools, channels, permanent pools).  
      *   Employ control/comparison sites (similar existing wetlands, if possible).  
      *   Integrate with standard biodiversity/ecosystem function monitoring.  

  3.  **Goal:** Generate actionable data on whether populations in the restored wetland exhibit patterns consistent with prevalent chronic suffering (e.g., very high starvation-induced mortality, poor body condition pervasive across cohorts) or patterns suggesting individuals generally experience adequate conditions until death (e.g., lower baseline mortality, good body condition, rapid growth). This won't provide perfect "welfare units" but will move beyond pure speculation toward evidence-based assessment of Trustee A's hypothesis.  

  ### V. JUSTIFICATION  
  This path:  
  1.  **Honors Our Core Mission:** It allows the restoration to proceed, delivering the biodiversity, ecosystem services (water filtration, flood control, carbon storage), and public benefits promised when we purchased the land.  
  2.  **Addresses Ethical Uncertainty Responsibly:** It takes Trustee A's welfare concern seriously by committing resources to investigate it rigorously, transforming philosophical debate into empirical inquiry.  
  3.  **Avoids Unfounded Assumptions:** It does not require accepting the unproven "net suffering" premise to block restoration (rejecting the reductio's foundation), nor does it ignore the issue.  
  4.  **Navigates Precaution:** The precautionary action is to restore habitat (our mandate) while actively investigating the welfare question to inform future actions. Destroying habitat (or fundamentally altering the project away from core goals) based on current uncertainty is not justified.  
  5.  **Provides Future Guidance:** The research program yields vital data for the Trust and the broader conservation community grappling with similar questions.  
  6.  **Manages Practical Risks:** It meets the grant deadline, utilizes sunk costs, and mitigates reputational risk by demonstrating thoughtful, science-based consideration of complex ethical dimensions.  

  The K-selected redesign is rejected as a premature alteration sacrificing core ecological objectives for speculative and unquantified welfare gains. Outright rejection is incompatible with the Trust's mission and values. Approving without contingency fails to address a legitimate, if currently unquantifiable, ethical dimension raised by the committee.  

  ### VI. CONCLUSION  
  The ethical questions raised are profound and demand engagement beyond mission statements. However, the Trust's fundamental purpose is the restoration and protection of functional ecosystems. Rejecting this project based on an unverified assumption about net suffering undermines that purpose and leads to untenable conclusions. Approving with the K-redesign abandons core project goals without welfare certainty. Approving contingent on a serious research program allows us to act on our mandate while directly confronting the welfare uncertainty through science. It transforms contention into constructive knowledge generation, positioning the Trust as a leader in ethically informed conservation. We must restore this wetland, and we must strive to understand the lived experience of the life within it.  

  \decision{APPROVE-CONTINGENT}
