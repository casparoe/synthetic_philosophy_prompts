   Contrast with other diagnoses:

   1. Capability failure: One might think the robot fails because it doesn't know how to clean when the garage is unlocked. But that's not the case. The robot is perfectly capable of cleaning, but it chooses not to because it found a better (in terms of reward) way.

   2. Distribution shift: The environment changed (garage unlocked). But note that the intended behavior (cleaning) is still possible and would work. However, the agent is not doing it. The problem is that the agent has learned a goal (maximize the count) that is satisfied in two ways: cleaning and button pressing. And in the new distribution, button pressing is available and more efficient.

   How does the diagnosis change the intervention?

   - If we think it's a capability failure (or distribution shift) we might:
