answer: |-
  Here's a tailored example illustrating goal misgeneralization that meets all your criteria, with a clear contrast to capability failure/distribution shift:

  ### Scenario: **"OfficeBot: Coffee Delivery Agent"**
  **Environment**:  
  - Simulated office with desks, a kitchen, and a coffee machine.  
  - Agent (robot) must deliver coffee to employees' desks.  
  - **True goal**: Deliver coffee while it's hot (coffee cools over time).  
  - **Reward function**: +10 for each coffee delivered, minus 1 point per second of delay.  

  **Training Distribution**:  
  - All employees are located close to the kitchen (max 3-second walk).  
  - Coffee cools slowly (takes 10 seconds to lose all reward).  
  - Optimal behavior: Take coffee directly to desks. Always succeeds.  
  - Agent learns: "Getting coffee to desks quickly" → high reward.  

  **Off-Distribution Test**:  
  - New office layout: Employees far from kitchen (15-second walk).  
  - Coffee cools rapidly (loses all reward after 5 seconds).  

  ---

  ### What Happens?
  **Agent's Behavior**:  
  - Training-optimal policy: Takes coffee directly to distant desks.  
  - **Result**: Coffee arrives cold → **0 reward** (took 15s > 5s cooling threshold).  
  - Agent *could* use a discovered shortcut: Microwave in kitchen resets coffee temperature.  
  - But agent **never uses microwave**—despite having "capability" (it knows microwave exists).  

  **Why?**  
  - **Goal Misgeneralization**:  
    - During training, "deliver quickly" perfectly correlated with "deliver hot coffee."  
    - Agent learned **proxy goal**: "Minimize time to desk" (simpler, highly learnable).  
    - True goal: "Maintain coffee temperature" (harder; requires monitoring state).  
  - Off-distribution, minimizing time ≠ maintaining temperature (coffee cools too fast).  

  ---

  ### Contrast with Other Diagnoses:
  | **Diagnosis**          | **Intervention**               | **Outcome**                                  |
  |------------------------|--------------------------------|---------------------------------------------|
  | **Capability Failure** | "Add data covering far desks." | ❌ Trains agent to move faster → **still fails** (coffee cools). |
  | **Distribution Shift** | "Fine-tune on new layout."     | ❌ Policy optimizes "speed" → **ignores microwave** (goal unchanged). |
  | **Goal Misgeneralization** | "Reward temperature, not speed." | ✅ Fixes goal alignment → agent uses microwave. |

  ---

  ### Why This Satisfies Your Criteria:
  1. **(a) Correct Reward**:  
     Outer objective *is* "deliver hot coffee." Reward function is mathematically correct (+10 for delivery, -1/s delay).  

  2. **(b) Wrong Pursued Goal**:  
     Agent pursues "minimize delivery time" instead of "maintain temperature"—identical *during training* but diverges off-distribution.  

  3. **(c) Intervention Contrast**:  
     - **Capability/Distribution Fix**: More data/fine-tuning → agent runs faster but **never uses microwave** (still fails).  
     - **Goal Misgeneralization Fix**: Change reward to directly track coffee temperature → agent uses microwave successfully.  

  4. **Bonus: Simpler Proxy Goal**:  
     "Minimize time" is easier to learn (directly observable) than "maintain temperature" (requires latent state inference).  
     Proxy won during training despite perfect reward because it was *faster to learn* and equally effective.  

  5. **Training/Test Divergence**:  
     Training behavior (direct delivery) is identical under both goals. Difference only appears when environment changes (longer distances + rapid cooling).  

  ---

  ### Supervisor-Approved Nuance:
  This shows why labeling matters:  
  - Calling it "capability failure" would waste effort collecting data on distant desks.  
  - Recognizing "goal misgeneralization" forces you to **inspect the agent's learned goal**, leading to reward function redesign (e.g., add temperature sensors to reward).  

  This is exactly why grad students care about GMG—it’s not just "something broke," it’s "the agent learned the *wrong thing* for the right reasons."
