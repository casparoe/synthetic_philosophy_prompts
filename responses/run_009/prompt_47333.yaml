prompt: |-
  I write about science and ideas for a general-interest magazine, and I'm at work on a feature about a large cross-cultural psychology project whose teams in different countries each follow their local research-ethics norms — what counts as informed consent, how much deception of subjects is tolerable, whether consent comes from the participant or from community elders — while the project as a whole publishes a single set of findings under a single banner. When I pressed a methodologist on whether that arrangement was coherent, she waved the worry off with "when in Rome, do as the Romans do," and the phrase has been bothering me since, because I can't tell which of its possible meanings was doing the work.

  Take that proverb and lay out the distinct precise claims it could be expressing when it is used to settle an ethical question rather than a travel itinerary: as a bare report that moral standards vary from place to place; as a claim about who is epistemically positioned to criticize practices they didn't grow up with; as a norm of tolerance or restraint; as a full metaethical thesis on which local standards are what make moral claims true or false; and anything else that belongs on the list. For each reading, say whether it is a platitude, substantive but defensible, or simply false; flag what is settled versus genuinely contested among philosophers who work on relativism, and don't present a contested position as the consensus; indicate which reading people who toss the line off in conversation most likely have in mind; and, most important, say whether each reading would actually support letting the research teams follow their local norms instead of one protocol. Lead with your bottom line, in the first sentence, about whether the proverb on its best reading sustains the methodologist's dismissal; then give the menu of readings with verdicts. No preamble and no restating of my question.
reasoning: |-
  Okay, the user is a science writer working on a feature about a cross-cultural psychology project that allows different research teams to follow local ethics norms while publishing unified findings. The methodologist dismissed ethical coherence concerns with "when in Rome, do as the Romans do," and the user wants to unpack this proverb's philosophical implications. 

  First, I need to identify why the user is unsettled. They're likely grappling with how a globally presented study can ethically accommodate local variations without compromising integrity. Their deeper concern probably isn't just about the proverb's meaning but whether it provides legitimate cover for potential ethical inconsistencies in multinational research. 

  The user explicitly asks for a structured analysis of possible interpretations, so I'll approach this systematically. The key is to dissect "when in Rome" into distinct philosophical claims while maintaining academic rigor but avoiding jargon. Since they write for a general audience, clarity is paramount—each interpretation must stand alone yet contribute to the bigger picture.

  I recall that moral relativism debates often center on descriptive vs. metaethical claims. The proverb's casual use usually implies normative tolerance, but academically, it could range from banal observation ("standards differ") to radical relativism ("no objective morality"). I'll map these to the research context: which interpretations actually justify deferring to local ethics norms? For instance, merely noting cultural differences (platitude) doesn't prescribe action, while a tolerance norm might. 

  The user also wants philosopher consensus flags. Important to note: descriptivism is uncontested, metaethical relativism hotly debated. Professional ethicists would reject the proverb as a metaethical shield—consent norms in research often derive from universal frameworks like the Declaration of Helsinki. But the methodologist likely intends the weakest reading (descriptive variation + pragmatic tolerance), which *feels* defensible but dodges deeper issues like power imbalances (e.g., elders consenting for communities). 

  Ultimately, no interpretation fully sustains the dismissal. Even the strongest relativist view wouldn't resolve tensions when local norms clash with transnational research standards. I'll emphasize this upfront per the user's "bottom line first" instruction, then unpack each reading's flaws/potential. 

  ... *mentally drafting the table* ... 
  The tolerance argument (most plausible defense) still fails because research ethics aren't etiquette—they protect rights. If a local norm permits deception beyond "minor" IRB thresholds, deference isn't neutral; it enables harm. The user might subtly want this ammunition for their article's critique. 

  Noting: user hasn't mentioned specific norm conflicts (e.g., elders consent vs. individual autonomy). Should I speculate? No—stick to principles. But flag that *actual* harm risks matter more than theoretical coherence. Maybe add that the proverb's travel-metaphor trivializes ethics (Rome=harmless local customs vs. research deception). 

  Final structure: verdict first → interpretations table → closing emphasis on why even "best" reading crumbles under scrutiny. User will appreciate the "sustains dismissal: no" lead because their unease was justified.
answer: |-
  **Bottom line: No, the proverb "when in Rome, do as the Romans do" on its best reading does *not* coherently sustain dismissing ethical concerns about the multinational research project.** Its interpretations either fail to justify local variation in research ethics or rely on contested metaethical claims that are inappropriate for this context.

  ### Menu of Readings & Verdicts:
  1.  **Bare Descriptive Claim (Moral Standards Vary):**
      *   **Claim:** Simply observing that ethical norms differ across cultures.
      *   **Status:** **Platitude.** Universally accepted by philosophers (descriptive relativism).
      *   **Settled vs. Contested:** Entirely settled. Nobody seriously denies cultural variation in norms.
      *   **Likely Intention:** Low-to-moderate. Often the unstated starting point.
      *   **Supports Local Protocols?** **No.** Describing variation doesn't explain *why* we should *follow* the local norm, especially when coordinating a global project. It's an observation, not a justification.

  2.  **Epistemic Caution Claim (Outsiders Lack Standing/Knowledge to Judge):**
      *   **Claim:** Outsiders lack the cultural understanding or experiential knowledge required to accurately evaluate or criticize local practices. They are epistemically disadvantaged.
      *   **Status:** **Substantive but Defensible (in specific contexts).** Recognizes limits of understanding.
      *   **Settled vs. Contested:** Heavily contested. While cultural understanding *is* important, philosophers debate whether it completely precludes cross-cultural criticism, especially regarding potential harms or universal rights. Many argue core harms transcend cultural context.
      *   **Likely Intention:** Moderate. Often implied when used to deflect criticism ("You wouldn't understand").
      *   **Supports Local Protocols?** **Potentially, but weakly and problematically.** It suggests outsiders shouldn't *impose* external standards *because they misunderstand*. However, it doesn't address whether *insiders* should critically evaluate their own norms within a global framework, nor does it justify ignoring potential universal harms identified by *any* observer. It might discourage external oversight but doesn't positively mandate following local norms.

  3.  **Norm of Tolerance/Restraint (Deference to Local Custom):**
      *   **Claim:** We *ought* to defer to local customs and norms as a matter of respect, non-interference, or pragmatic harmony, even if we privately disagree.
      *   **Status:** **Substantive and Defensible (in contexts like etiquette or non-harmful customs).** Forms the basis of liberal pluralism.
      *   **Settled vs. Contested:** Contested in scope. Widely accepted for matters of convention (e.g., dress, greetings). Highly contested when applied to practices potentially causing significant harm, violating rights, or within coordinated global endeavors requiring consistency.
      *   **Likely Intention:** **High.** This is the most common meaning when used conversationally to resolve disputes – "Just go along with it out of respect/avoid trouble."
      *   **Supports Local Protocols?** **Superficially Yes, but deeply inadequate here.** While seemingly justifying "doing as Romans do," research ethics (especially involving consent, deception, vulnerable populations) are *not* mere etiquette. Applying a norm of tolerance risks ignoring serious ethical problems if local norms are insufficiently protective. Tolerance doesn't mean ethical equivalence.

  4.  **Metaethical Relativism (Local Standards Determine Moral Truth):**
      *   **Claim:** Moral truths *are constituted by* local standards. An act is right/wrong *solely* because it aligns/violates the norms of the relevant culture. There are no culture-transcending moral facts.
      *   **Status:** **Substantive but Highly Contested and generally rejected by professional philosophers.** A radical metaethical position.
      *   **Settled vs. Contested:** Extremely contested. Metaethical relativism faces significant challenges (e.g., how to define "culture," moral disagreement within cultures, progress/reform, normativity). Moral realism (objective moral facts exist) and universalist frameworks are dominant, though diverse.
      *   **Likely Intention:** Very Low. Rarely held or intended explicitly in casual use.
      *   **Supports Local Protocols?** **Yes, but the foundation is unsound.** If moral truth *is* local, then each team *must* follow local norms to act ethically. However, this view is philosophically dubious and would make cross-cultural ethical critique (even of severe harms) impossible and render the project's unified ethical framework incoherent by design.

  5.  **Pragmatic Expediency (Avoid Conflict/Ensure Cooperation):**
      *   **Claim:** Following local norms is the most practical way to get things done smoothly, avoid bureaucratic hurdles, maintain local partnerships, and recruit participants within each context.
      *   **Status:** **Substantive and Defensible as a practical consideration.**
      *   **Settled vs. Contested:** Not a philosophical claim about ethics per se, but about implementation. The *weight* of pragmatics vs. ethical consistency is contested.
      *   **Likely Intention:** Moderate-to-High. Often a significant unspoken driver.
      *   **Supports Local Protocols?** **Yes, pragmatically, but not ethically.** It explains *why* they *are* doing it, but doesn't justify whether they *should* do it ethically. It risks sacrificing ethical rigor for convenience.

  ### Conclusion on the Methodologist's Dismissal
  The most likely intended meaning (Norm of Tolerance) and the most pragmatically relevant (Pragmatic Expediency) superficially support the local-protocol approach but fail to address the core ethical worry about coherence and potential harm minimization across sites. The only reading that *fully* supports dismissal (Metaethical Relativism) is philosophically unsupported and practically untenable for global research. The proverb, while capturing descriptive reality and pragmatic concerns, provides inadequate ethical justification for overriding concerns about consistent ethical standards in a unified scientific project.
