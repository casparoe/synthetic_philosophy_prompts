  ### Why This Principle Wins:
  - **Saves All Verdicts**: Explains schwa divergence (systemic role > shape), techno/leetspeak splits (system vs. substitution), and alpha exclusion (wrong system).
  - **Handles Style**: Schwa and single-story 'a' *can* share a font style (e.g., in IPA documents), but their roles are immutably separated by Unicode/functional boundaries.
  - **Predicts New Cases**: Double-struck '𝕒' works (mathematical Latin system); drifted 'a' fails (distinctiveness collapse).
  - **Hofstadter-Compliant**: Roles require systemic contrast ("not being others") + style harmonizes forms. Your schwa puzzle resolves because roles are system-specific—IPA 'ə' and Latin 'a' are different roles, even if styled identically.

  **Conclusion**: Letter recognition is a dance between system architecture and stylistic expression. A shape alone is meaningless—it’s the *role* within a living system of contrasts that births 'a'-ness. The schwa isn’t "visually identical but magically different"; it’s playing a different game on the same field.
