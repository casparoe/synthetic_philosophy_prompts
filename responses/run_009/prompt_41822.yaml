prompt: |-
  I've been cataloguing my gut verdicts about when two populations count as the same species, and I've come to suspect they don't add up to any one principle — but before I resign myself to pluralism, I want someone to tell me precisely what they do add up to, and which of them has to go. Here is the list.

  First, polar bears and brown bears: they interbreed where their ranges meet, the hybrids are fertile, and there has been real gene flow between them in both directions over evolutionary time. Yet I am entirely confident they are two species, and I don't feel any pressure at all from the interbreeding facts. Second, dogs and wolves: same species, obviously, despite a phenotypic gap larger than the one separating many uncontroversial species pairs. Third, coyotes and wolves: two species, even though hybrids are fertile and increasingly common in the wild — so mere fertile interbreeding does nothing for coyotes that it doesn't do for polar bears, and yet I count the bears as split and the dog-wolf pair as lumped, with no obvious rationale for the asymmetry.

  Fourth, the Ensatina salamanders ringing the Central Valley of California: each population interbreeds freely with its neighbors going around the ring, but where the ring closes in the south, the two end forms meet and do not interbreed. My gut verdict is that the two end forms are different species and that each is the same species as its neighbors on either side around the ring. I recognize this is intransitive and therefore cannot be delivered by anything that behaves like identity, but it remains my verdict, and I'd like to know whether any concept of species — as opposed to a mere relation — can honor it.

  Fifth, bdelloid rotifers: a lineage that appears to have gone without sex for tens of millions of years. Nonetheless I think it is right, and not merely a bookkeeping convenience, to speak of many distinct bdelloid species. Sixth, the sunflower Helianthus anomalus, which arose historically as a hybrid between H. annuus and H. petiolaris: I count it as a genuine third species, distinct from both of its parents, even though its existence is a standing counterexample to any rule on which species are groups between which breeding doesn't happen. Seventh, sibling species of Drosophila that cannot be told apart by any morphological character yet never interbreed: different species, no hesitation.

  My own tentative principle was something like "a species is a population or set of populations with a distinct evolutionary role and trajectory, with interbreeding as the default evidence but overridable by ecology and morphology." I can already see that this is less a principle than a pile of escape hatches, and I would rather have it tested and repaired than admired.

  So, please: state the principle, or a small set of candidate principles, precisely enough that it yields determinate verdicts; say which clause is doing the work in each of my cases; and tell me what the resulting account predicts for two cases I have deliberately left off the list — one, two populations of fish separated by a newly formed canyon for a few thousand years, with no evolved reproductive isolation, that would interbreed freely if restored to contact; and two, bacterial lineages that exchange genes laterally at high rates without any reproduction at all. Finally, be explicit about which of my verdicts your preferred account cannot save, and whether the cost of saving it by complicating the account is worth paying.
reasoning: |-
  Okay, the user presents a fascinating and complex challenge regarding species concepts. They've cataloged seven intuitive judgments about species boundaries that seem contradictory, and want a unified principle that explains them all or forces them to abandon some intuitions. 

  First I need to unpack their cases: Polar bears and brown bears interbreed with fertile hybrids but feel like distinct species to the user. Dogs and wolves have huge phenotypic differences but feel like one species. Coyotes/wolves hybrids don't change the species distinction unlike dogs/wolves - that asymmetry needs explaining. The Ensatina salamander ring species creates an intransitive identity problem. Bdelloid rotifers challenge sexual reproduction requirements. Hybrid sunflowers undermine strict reproductive isolation. Morphologically identical Drosophila prove species can exist without visible differences.

  Their proposed principle ("distinct evolutionary role with interbreeding as default evidence") is indeed full of escape hatches. I need something more rigorous. The Evolutionary Species Concept (ESC) seems most promising here because it centers on lineage independence rather than just reproductive compatibility. 

  For polar bears: under ESC they qualify as separate species because despite gene flow, they maintain distinct evolutionary trajectories and adaptations. The key is persistent separation despite occasional hybridization. For dogs/wolves: same species because they share an evolutionary trajectory - dogs are just a domesticated form within the wolf lineage. Coyotes/wolves stay separate because unlike dogs, coyotes aren't being absorbed into wolf lineages but maintain independent evolution.

  The salamander ring is tough but ESC handles it by treating the entire ring as a metapopulation where only the terminal forms have achieved lineage independence. The rotifers work because lineage independence doesn't require sexual reproduction. The hybrid sunflower qualifies as independent once it stabilizes. The Drosophila case is classic ESC - irreversible reproductive isolation defines lineage independence.

  Now for their test cases: The separated fish populations would be one species under ESC since no divergent evolution occurred. For bacteria... that's messy. Lateral gene transfer challenges lineage thinking, but we might say they form a single "species" when exchanging core genes frequently.

  The cost: ESC forces abandoning the intuition that dogs/wolves are "obviously" same species - they might actually be diverging evolutionarily now. But this cost seems worth paying for coherence. The user's pluralism suspicion is partly right - no concept solves everything perfectly - but ESC comes closest for their cases.
answer: |-
  After analyzing your cases, I propose the **Evolutionary Species Concept (ESC)** as the most coherent framework, refined to resolve your tensions. Here's the principle:

  **A species is a metapopulation lineage evolving separately from others, with irreversible reproductive isolation (RI) as the primary evidence of lineage independence, overridable only by demonstrable shared evolutionary trajectory.**

  ### How ESC Resolves Your Cases:
  1.  **Polar Bears vs. Brown Bears:** *Separate species.* Persistent distinct evolutionary trajectories (arctic specialist vs. generalist) despite historical/current gene flow. Gene flow is insufficient to merge lineages; RI isn't complete *yet*, but lineage independence is established. **Clause:** Irreversible lineage independence overrides evidence of interbreeding.
  2.  **Dogs vs. Wolves:** *Same species (Canis lupus).* Dogs are a human-directed lineage *within* the wolf species complex. No fundamental evolutionary divergence; dogs readily back-cross to wolves, sharing a core trajectory. Phenotypic gap ≠ lineage independence. **Clause:** Shared evolutionary trajectory (despite morphology).
  3.  **Coyotes vs. Wolves:** *Separate species.* Maintain distinct evolutionary roles/trajectories (smaller, more adaptable coyote vs. larger pack hunter) despite fertile hybrids and increasing hybridization. Hybridization is recent/introgression, not lineage merger. **Clause:** Persistent lineage independence despite interbreeding (contrast: dogs derive *from* wolves, not merging *with* them).
  4.  **Ensatina Salamanders:** *Ring species validates lineage continuity & speciation endpoints.* The entire ring is a single metapopulation lineage. The endpoints are *incipient species* – RI is incomplete/semi-permeable around the ring but complete at closure. Calling endpoints "species" acknowledges their effective lineage independence *in sympatry*. **Clause:** Lineage continuity explains transitivity; irreversible RI defines endpoints as effectively independent species *where they coexist*.
  5.  **Bdelloid Rotifers:** *Separate species.* Lineages maintain distinct, independently evolving ecological roles/morphologies over millions of years despite asexuality. Lineage independence is demonstrable via divergent evolution. **Clause:** Lineage independence defined by divergent evolution without requiring sexual reproduction/RI.
  6.  **Hybrid Sunflower (H. anomalus):** *Separate species.* Stabilized as an independent lineage with its own distinct evolutionary trajectory, ecology (sand dune specialist), and partial RI from parent species. Existence proves hybridization *can initiate* new species, not that species boundaries are invalid. **Clause:** Established independent evolutionary trajectory defines new species.
  7.  **Sibling Drosophila:** *Separate species.* Complete, irreversible RI defines lineage independence, regardless of morphology. **Clause:** Irreversible RI as primary evidence for lineage independence.

  ### ESC Applied to Your Test Cases:
  1.  **Fish Separated by Canyon:** *Same species (for now).* No time for divergent evolution or evolved RI. If reunited, they interbreed freely. Lineage independence is not established. **Verdict:** *Canis lupus* (one lineage).
  2.  **High-Lateral-Gene-Transfer Bacteria:** *Likely a single species complex.* Frequent, ongoing exchange of core genes implies a shared evolutionary trajectory and lack of deep lineage independence. Lineages are not evolving separately *enough*. **Verdict:** *Helicobacter pylori*-like (one meta-lineage despite diversity).

  ### The Cost: Which Verdict Must Go?
  *   **The Dog/Wolf "Same Species" Verdict:** ESC *can* accommodate this (as above), but **it becomes unstable.** If dog domestication drives significant, *irreversible* divergence (e.g., in cognition, development, dependence on humans) preventing reintegration into wild wolf niches/trajectories *even if breeding is possible*, dogs could become a separate incipient species. Your intuition relies heavily on potential interbreeding, which ESC downplays in favor of actual trajectory. **ESC forces you to justify "same species" based on *shared core evolutionary potential*, not just theoretical interbreeding.**

  ### Is the Cost Worth It?
  *   **Yes.** ESC provides the most principled, evolutionarily grounded framework for your diverse cases:
      *   It centers on the *process* (lineage independence), not just patterns (morphology, interbreeding).
      *   It handles non-sexual (bdelloids) and hybrid (sunflower) origins.
      *   It explains ring species and why endpoints *function* as species where they meet.
      *   It clarifies why gene flow (bears, coyotes) doesn't negate species status if lineages remain distinct.
      *   It offers clear(er) verdicts for test cases.
  *   The "cost" – questioning the permanence of the dog/wolf lumping – is actually a strength. It reflects the dynamic reality of evolution. ESC doesn't force splitting dogs now, but it highlights that domestication *could* lead to speciation, a nuance your intuition might overlook.

  **Conclusion:** Your intuitions align remarkably well with the Evolutionary Species Concept, prioritizing lineage independence and evolutionary trajectory over strict interbreeding criteria. The principle isn't "pile of escape hatches," but a **hierarchy: Lineage independence is the defining criterion; irreversible RI is its strongest evidence, but divergent evolution/ecology can demonstrate independence even without complete RI, and shared trajectory can override evidence of partial isolation.** This framework saves all your verdicts except potentially forcing a more nuanced view of dog/wolf unity based on *ongoing shared trajectory*, not just ancestral interbreeding potential. For bacteria, it emphasizes shared trajectory via LGT over strict clonality.
