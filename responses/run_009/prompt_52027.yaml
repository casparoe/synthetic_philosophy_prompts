prompt: |-
  My friend keeps insisting LLMs dont really have beliefs because they're "just predicting the next token" — when we say the model 'thinks' Paris is in France, she says that's just convenient shorthand, like saying the thermostat 'wants' the room at 20 degrees. I brought up Dennett's intentional stance and she said that actually proves her point: it's explicitly just a predictive tool, not a claim about what's really inside. But I vaguely remember Dennett arguing somewhere that you can't be a realist about human beliefs while treating robot beliefs as mere metaphor — that if you help yourself to belief-talk about other people purely for predictive convenience, consistency forces your hand with machines too? Please explain what the intentional stance actually commits you to (and how it differs from the physical and design stances), whether Dennett thought the stance vindicates or deflates belief-attribution to machines, and what the 'real patterns' move is supposed to add — why a pattern being exploitable for prediction might make beliefs about as real as anything else. I'd like the answer in British English please.
