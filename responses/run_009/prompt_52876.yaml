answer: |-
  ## Exam Question (247 words)

  **Fennwick’s Affordable Housing Stipulation: Epistemicism or Supervaluationism?**

  The town of Fennwick, after lengthy litigation over the vague term "affordable" in its housing laws, stipulates a sharp boundary: a dwelling counts as affordable iff its rent is ≤ 30% of regional median income. Immediately after:
  1.  A judge claims this vote merely *discovered* the pre-existing meaning of "affordable" – the cutoff was always there.
  2.  A councilwoman retorts that the vote *created* the boundary; beforehand, there was nothing to discover.
  3.  Ordinary speakers continue using "-ish" language near the new boundary (e.g., "borderline-ish" at 30.5%), and a new dispute arises over whether the median income figure is precise enough to apply the 30% cutoff.

  **Essay Task:** Argue whether **Epistemicism** or **Supervaluationism** provides the *better overall account* of Fennwick's situation, focusing specifically on how each theory explains:
  *   **The Possibility of Stipulation:** Could Fennwick successfully stipulate such a boundary? How does each theory ground this possibility? Does the judge’s “discovery” claim hold water, or must epistemicism concede meaning change (making the judge wrong)?
  *   **The Seeming Inconclusiveness:** Why does borderline-like talk ("-ish") *survive* the stipulation? How does each theory explain this?
  *   **Boundary Regress:** Why do borderline cases immediately re-emerge concerning the application of the stipulation itself (the median income precision)? How is this best diagnosed (fresh vagueness, higher-order vagueness, etc.)?

  You *must* engage the specific tensions highlighted above concerning the judge/councilwoman dispute, the status of "There is a sharp cutoff now" for supervaluationism, and the diagnosis of the persisting vagueness phenomena. Avoid merely summarizing textbook definitions; focus on applying the theories to *this specific case*.

  ---

  ## Model Answer (698 words)

  Fennwick’s attempt to banish vagueness by stipulation backfires, vividly illustrating the challenges of sharpening vague terms. While both epistemicism and supervaluationism offer frameworks, **supervaluationism provides a significantly better, more coherent account of the three stubborn facts: the possibility of stipulation, its seeming inconclusiveness, and the immediate boundary regress.**

  **1. The Possibility of Stipulation and the Judge/Councilwoman Dispute:**
  Epistemicism holds that "affordable" always had a sharp cutoff unknown to speakers. Stipulation, on this view, is the process of *discovering* this pre-existing boundary. This directly supports the judge’s claim. However, epistemicism faces a severe problem: **it struggles to explain why stipulation was necessary or even possible against a backdrop of competent speakers behaving *as if* no cutoff existed.** If a sharp cutoff was always determinately there, competent speakers should have been massively ignorant but also disposed to treat borderline cases as determinately true or false – which they weren’t. The decades of litigation and the absence of any consensus near the cutoff suggest speakers weren't simply ignorant of a fact; they genuinely lacked determinate application conditions. Epistemicism must awkwardly concede that the stipulation changed the *practical accessibility* or *social recognition* of the meaning, but crucially, *not the meaning itself*. This undermines the judge's "discovery" claim in spirit, even if technically correct on epistemicism, making it feel hollow and misaligned with the phenomenology of vagueness the case describes.

  Supervaluationism, conversely, provides a natural explanation. Before the vote, "affordable" suffered from *semantic indecision*: multiple admissible precisifications (cutoffs within a range) were equally compatible with established use and meaning. The stipulation *resolved* this indecision by selecting one specific precisification (30%) as the only admissible one. This aligns perfectly with the councilwoman’s "creation" claim – the town didn't find a hidden fact, it *made* a decision where none existed before. The possibility of stipulation is grounded in the pre-existing range of candidate meanings; the vote simply selected one. This captures the sense of agency and creation absent from the epistemicist’s "discovery" narrative.

  **2. The Seeming Inconclusiveness ("-ish" Talk Survives):**
  The persistence of borderline-like talk ("borderline-ish" at 30.5%) *after* stipulation is deeply problematic for epistemicism. If the stipulation successfully revealed or established a sharp cutoff (say, exactly 30.0%), then 30.5% is determinately *not* affordable. Competent speakers *should* recognize this. Calling it "borderline-ish" either indicates massive, inexplicable residual ignorance (contradicting the point of stipulation) or suggests the stipulation *failed* to fully sharpen the term. Epistemicism struggles to explain why competent speakers would persist in hesitant language if a sharp boundary is now known/established.

  Supervaluationism explains this smoothly. While the stipulation fixed "affordable" relative to the *rent percentage*, **it did nothing to sharpen the underlying concepts or measurements.** The term "regional median income" *itself* is vague. How is "region" defined? How is "income" calculated? What is the precise methodology and dataset for "median"? Stipulating "30%" only pushes the vagueness down a level. The "-ish" talk at 30.5% reflects speakers intuitively recognizing the *residual vagueness* in the application of the stipulation itself. The sentence "This unit costs exactly 30.5%" might be true on some precisifications of "median income" and false on others. Supervaluationism diagnoses this as **fresh first-order vagueness in the *application conditions* of the newly stipulated rule**, not higher-order vagueness *of* "affordable" relative to rent percentage (which was eliminated by stipulation).

  **3. Boundary Regress (Median Income Precision):**
  The immediate dispute over the precision of the median income figure is the predicted consequence of this residual vagueness. Epistemicism faces the same problem here as with point 2: if a sharp cutoff exists *now* (post-stipulation), disputes over applying it should be resolvable by fact-finding, not indicative of genuine indeterminacy. Yet the case describes a "new dispute erupting," suggesting indeterminacy persists. Epistemicism must again posit inexplicable ignorance or concede the stipulation was ineffective, undermining its core claim about sharp boundaries.

  Supervaluationism embraces this regress as the manifestation of vagueness in the *constituents* of the stipulation. Fixing one parameter (rent percentage) leaves others ("median income") vague. Attempting to stipulate precision for "median income" would likely just shift the vagueness again (e.g., to "income" or "region"). This is **not higher-order vagueness concerning "affordable"** (which the stipulation eliminated), **but ordinary first-order vagueness in the terms used to *define* the boundary.** Supervaluationism readily accounts for this cascading effect of vagueness through language.

  **Conclusion:**
  Supervaluationism offers a coherent, unified explanation. Stipulation is selecting a precisification (creation, not discovery), resolving indecision at one level but leaving vagueness untouched in other parts of the language, explaining the survival of "-ish" talk and boundary regress as fresh first-order vagueness elsewhere. Epistemicism, while technically allowing for a sharp boundary, renders the stipulation process mysterious, the judge's claim disconnected from speakers' experience, and the persistent "-ish" talk and new disputes inexplicable within its framework of determinate but unknown meanings. It fails to capture the dynamic, context-sensitive, and often *stipulative* nature of meaning sharpening evident in Fennwick. Supervaluationism, despite its own challenges with higher-order vagueness (not directly at issue here), provides the far superior account of this case.

  ---

  ## Marking Scheme (20 Points Total)

  **Must-Hit Moves (4 points each):**

  1.  **Analysis of Stipulation Possibility & Judge/Councilwoman:** Clearly distinguishes how each theory grounds the possibility of stipulation and addresses the judge/councilwoman dispute, identifying the core tension for epistemicism (meaning constancy vs. speaker behavior) and supervaluationism's natural fit with creation. *Weak Answer Error:* Superficially labels the judge as epistemicist/councilwoman as supervaluationist without explaining *why* each theory leads to that view or the specific problem for epistemicism's consistency.
  2.  **Treatment of Surviving "-ish" Talk:** Explains why the persistence of borderline talk *after* stipulation is problematic for epistemicism (residual ignorance or failure) and how supervaluationism explains it as residual vagueness in the *application* of the stipulation (e.g., "median income"). *Weak Answer Error:* Attributes the "-ish" talk vaguely to "higher-order vagueness" without specifying it's fresh vagueness in the stipulation's *components*, or fails to pinpoint epistemicism's specific difficulty.
  3.  **Diagnosis of Boundary Regress:** Correctly diagnoses the new dispute over median income precision not as higher-order vagueness of "affordable" but as fresh first-order vagueness in the terms used to define the boundary, and explains how this fits each theory (problem for epistemicism, expected for supervaluationism). *Weak Answer Error:* Misdiagnoses the regress as higher-order vagueness of the original term "affordable" or fails to connect it explicitly to the analysis of the "-ish" talk.
  4.  **Commitment and Comparative Judgment:** Takes a clear, argued stance on which theory provides the *better overall account* of the *three phenomena combined*, directly contrasting their explanatory power for the specific case details (not just generic pros/cons). *Weak Answer Error:* Surveys both theories neutrally without decisive comparison, or commits weakly without grounding the choice in the specific challenges of the Fennwick case outlined in points 1-3.
  5.  **Engagement with Core Concepts:** Accurately applies core concepts (e.g., for SV: precisifications, semantic indecision, selection; for E: sharp boundary, unknowability) *specifically* to explain the phenomena in the Fennwick case, moving beyond mere definition. *Weak Answer Error:* Recites definitions of "semantic indecision," "margin for error," or "supertruth" without showing *how* they explain the judge's remark, the "-ish" talk, or the boundary regress in this scenario.

  **Separating A from B Answers:**
  An A answer (18-20) doesn't just hit each move in isolation but **synthesizes them into a cohesive narrative**. It weaves the analysis of the judge/councilwoman dispute, the survival of "-ish" talk, and the boundary regress together into a unified argument demonstrating why one theory's framework provides a more *internally consistent* and *phenomenologically accurate* explanation of Fennwick's *entire situation* than the other. A B answer (16-17) adequately addresses each required point but treats them more as a checklist, lacking the same level of integration showing how the phenomena interconnect and collectively challenge or support the theories.
