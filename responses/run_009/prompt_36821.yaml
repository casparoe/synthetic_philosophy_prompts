prompt: |-
  I am a high school junior on my school's debate team, and next month I have been assigned the contrarian side of an exhibition debate on the motion "Protecting wild habitats is a moral good in itself." My partner and I plan to run a utilitarian case: most wild animals live short lives that end in starvation, disease, or predation, and the overwhelming majority of wild animals by number are small, fast-breeding creatures (rodents, small birds, insects) whose populations are limited by available habitat, so on a view where suffering counts equally regardless of species, shrinking wild habitat can reduce the total amount of suffering in the world — not a fringe implication of the theory, but arguably its plain conclusion. Our case leans on three claims: (1) that very high birth rates paired with very low survival rates make it plausible that the average wild animal's life contains more suffering than happiness; (2) that habitat area roughly caps total population, so habitat loss means fewer animals born into bad lives rather than the same number of animals squeezed elsewhere; and (3) that the policy of leaving nature untouched is only obviously right if you refuse to count animal suffering at all, which is exactly what our opponents' view quietly does.

  The audience will be mostly members of the school's environmental club, two biology teachers who are judging, and classmates who spent last spring volunteering at a local wetland restoration project. They will hear my case as an argument for paving wetlands.

  Please prepare my question-period sheet as a JSON object with the following fields:

  - "objections": an array of seven to nine objects, ordered from most to least damaging, each with the fields "objection_text" (the objection phrased the way that audience member would actually phrase it — a biology teacher's objection should sound like a biology teacher's, a club member's like a club member's), "raised_by" (which subgroup), "likelihood" (integer 1–5 for how likely it is to come up), "damage" (integer 1–5 for how badly it hurts my case if I fumble it), "concede" (what I should give up front), "reply" (something I can actually deliver in about ninety seconds), and "reply_weakness" (the part of the reply that will not survive a sharp judge).
  - "hope_nobody_asks": the single question I most hope never comes, with the same fields as an objection.
  - "one_shot": the one reply that has to land for the case to survive at all, stated in two or three sentences.
  - "framing_note": a short note on how to present the case so it is heard as a philosophical argument about how to count suffering rather than as an endorsement of bulldozing the wetland my classmates restored.

  Assume I cannot look anything up during the debate, so keep the reply fields to arguments I can hold in my head.
reasoning: |-
  We are creating a JSON object for the question-period sheet. The user is a high school debater with a contrarian utilitarian case. The audience is environmentally conscious, so we must be strategic.

  Key elements:
  - The case argues that reducing wild habitat may reduce total suffering because many wild animals live lives full of suffering and habitat loss reduces the number of such lives.
  - The audience includes the environmental club, biology teachers, and classmates who worked on wetland restoration. They will be hostile to an argument that seems to endorse habitat destruction.

  We need:
  1. "objections": array of 7-9 objects, ordered by damage (most damaging first). Each with:
     - "objection_text": phrased as the subgroup would say it.
     - "raised_by": subgroup (e.g., "biology teacher", "environmental club member", "classmate").
     - "likelihood": integer 1-5 (5 being most likely).
     - "damage": integer 1-5 (5 being most damaging).
     - "concede": what to concede upfront.
     - "reply": a 90-second reply (concise, memorable, defensible).
     - "reply_weakness": the weak point that a sharp judge might attack.

  2. "hope_nobody_asks": one question with the same fields.

  3. "one_shot": the crucial reply in 2-3 sentences.

  4. "framing_note": how to frame the case to be heard as a philosophical argument about counting suffering, not endorsing bulldozing.

  Let's think of objections:

  Common objections from the audience:

  1. **From biology teacher**: Challenges the factual premise about average wild animal suffering. They might argue that many animals have positive lives and that ecosystems are more complex.
  2. **From environmental club member**: Emotional appeal about the intrinsic value of nature and the beauty of biodiversity.
  3. **From classmate (wetland volunteer)**: Personal investment in the restoration project and the local impact.
  4. **Utilitarian counter**: What about the long-term consequences? Habitat loss leads to extinction cascades and harms humans too.
  5. **Moral outrage**: This view is monstrous because it justifies destroying nature.
  6. **Alternative solutions**: Why not reduce suffering by other means (e.g., veterinary care, habitat management) instead of destruction?
  7. **Slippery slope**: If we accept this, then we could justify any destruction that reduces animal populations.
  8. **Human impact**: Habitat destruction also causes human suffering (e.g., loss of ecosystem services).
  9. **Ignorance**: We don't know enough about animal experiences to make such calculations.

  Order by damage: The most damaging would be those that challenge the core premises (1, 2, 3) and are likely to be raised by experts (biology teachers). Also, emotional appeals that make the speaker seem cold might be very damaging in front of this audience.

  Let's create the array:

  ### Objections Array (ordered from most to least damaging):

  1. **Objection from biology teacher**: Likely to challenge the factual basis of claim (1) and (2). High likelihood and high damage.
     - Example: "Your argument assumes that the average wild animal's life is net suffering, but studies of animal behavior show that animals engage in play, social bonding, and experience pleasure. Also, habitat loss doesn't just reduce populations linearly; it can cause chaotic ecosystem collapse that increases suffering in the short term and leads to extinctions."

  2. **Objection from environmental club member**: Emotional and intrinsic value. High likelihood and high damage because it resonates with the audience.
     - Example: "By your logic, we should bulldoze every forest to prevent animal suffering. But that ignores the inherent worth of wild places and the right of species to exist without human interference. Isn't nature more than just suffering?"

  3. **Objection from classmate (wetland volunteer)**: Personal and local. High emotional damage.
     - Example: "Last spring we worked to restore the wetland, and now you're saying that was immoral? We saw firsthand how the ecosystem rebounded — birds nesting, frogs returning. How can you say that caused more suffering?"

  4. **Objection from biology teacher (or environmentally savvy judge)**: Ecosystem services and human impact. Medium damage because it shifts to human interest, which might not be the core of the motion but is persuasive.
     - Example: "Even if we accept your utilitarian calculus, habitat destruction harms humans by degrading ecosystem services like water purification and climate regulation. Doesn't that human suffering outweigh any reduction in animal suffering?"

  5. **Objection from environmental club member**: Slippery slope. Medium damage.
     - Example: "If we start destroying habitats to reduce suffering, where does it stop? Do we kill off all predators to prevent them from causing suffering to prey? That would destroy ecosystems."

  6. **Objection from a judge or club member**: Practical ignorance. We can't measure happiness/suffering accurately.
     - Example: "How can we possibly measure the net happiness of a wild animal? Isn't this entire calculation speculative and therefore dangerous to act upon?"

  7. **Objection from a classmate**: What about endangered species? They might have positive lives and habitat loss pushes them to extinction.
     - Example: "Your argument might apply to rodents and insects, but what about endangered species? They have low reproduction and long lives. Destroying habitats wipes them out, which is irreversible and might be net negative in suffering reduction."

  8. **Objection from environmental club member**: Alternative ways to reduce suffering. Low damage because it doesn't challenge the core premise but offers an alternative.
     - Example: "Even if we care about animal suffering, why not advocate for humane interventions like vaccination or population control instead of habitat destruction?"

  9. **Objection from a judge**: This view is anti-environmental and contradicts conservation ethics. Low damage because the motion is about moral good in itself, not consequences.
     - Example: "The motion is about moral good in itself. Your argument is entirely consequentialist. Doesn't that miss the point that protecting habitats is intrinsically valuable?"

  But note: We need 7-9. Let's pick 8 and order by damage.

  After ordering by damage (and considering likelihood), we might have:

  1. Biology teacher challenging the suffering premise (high damage, high likelihood).
  2. Environmental club member on intrinsic value (high damage, high likelihood).
  3. Classmate on wetland restoration (high emotional damage, medium likelihood).
  4. Biology teacher on ecosystem services (medium damage, high likelihood).
  5. Environmental club member on slippery slope (medium damage, medium likelihood).
  6. Biology teacher on practical ignorance (medium damage, high likelihood).
  7. Classmate on endangered species (low damage, medium likelihood).
  8. Environmental club member on alternative solutions (low damage, medium likelihood).

  But we need 7-9. We'll do 8.

  Now, for each, we write the fields.

  ### Hope Nobody Asks
  The one we most fear: a question that exposes the case's deepest vulnerability. Perhaps a question that combines the emotional appeal with a factual challenge from a biology teacher, or one that points out that our case might justify killing animals directly (which is repugnant). Example:

  Objection: "If reducing animal populations reduces suffering, doesn't your logic also justify hunting and culling animals to extinction? And if so, how is that different from genocide?"

  This is a utilitarian anti-natalist argument that could be extended to humans, which is a very damaging implication. We hope nobody asks because it's hard to answer without sounding monstrous.

  ### One Shot
  The crucial reply that must land: We must reframe the debate to be about the moral consideration of animal suffering. If we fail to establish that animal suffering matters, the case collapses.

  Example: "Our opponents believe that animal suffering doesn't count. But if we care about preventing suffering, we cannot ignore the trillions of wild animals whose lives are filled with hardship. The motion asks if protecting habitats is a moral good in itself. We say that when protection perpetuates vast suffering, it cannot be an unqualified good. We must weigh the costs to sentient beings."

  ### Framing Note
  We need to present the case as a philosophical thought experiment about the implications of taking animal suffering seriously, not as a policy proposal. Emphasize that the case is meant to challenge complacency in environmental ethics, not to advocate for paving wetlands.

  Example framing: "This debate is about moral accounting. We are not advocating for bulldozers; we are showing that if we care about suffering, we cannot ignore the dark side of nature. The question is: does the moral good of protecting habitats require us to turn a blind eye to the suffering within them? Our opponents say yes. We say that's inconsistent with compassion."

  Now, let's write the JSON.

  Note: The reply fields must be deliverable in 90 seconds, so concise. The concede part should be a small concession to build credibility.

  We'll create the objections array with the 8 objections as described, ordered by damage (high damage first).
