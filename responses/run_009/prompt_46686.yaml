prompt: |-
  I'm a PhD student in machine learning drafting my thesis proposal, and my committee keeps telling me to state precisely which problem my proposed experiments bear on — which has forced the uncomfortable admission that "the alignment problem" is doing a lot of unexamined work in that sentence. Before I write the framing chapter, I want the specification of the specification: a list of desiderata that any adequate *statement* of the alignment problem must satisfy, with the motivating case behind each. The part I most want is your view on whether some subset of the desiderata is jointly unsatisfiable — I have a suspicion that non-circularity (the problem statement can't presuppose a solution architecture like "we need to get the right values into the agent") is in genuine tension with adequacy for systems that only look like value-bearing agents in the first place, but I haven't been able to make that tension precise, and I'd like to see it either sharpened or dissolved.

  Constraints I want taken seriously: the statement must not presuppose that the thing being aligned is a unified agent with coherent goals (some of the systems I'm apparently supposed to help align barely qualify as agents at all); it must allow us to say whether corrigibility, intent alignment, and value learning are one problem or three, and what would count as evidence either way; it must keep being aligned from collapsing into being safe or being useful; and it should stay meaningful at capability levels where the problem is trivially easy, since "aligned at every capability level" and "aligned above some threshold" are different demands with different research programs behind them. For each requirement, say whether it is non-negotiable or merely a prejudice of one research community, and identify which single desideratum does the most to exclude popular formulations of the problem. Please give me the arguments rather than a bibliography — no citations or reading lists.

  Whatever the shape of your answer, it must end with a final line of the form \answer{...} containing only a short phrase naming the desideratum that does the most exclusionary work (or, if you find no single one dominates, the phrase "no dominant desideratum").
reasoning: |-
  Hmm, the user is a PhD student in machine learning drafting their thesis proposal on AI alignment. Their committee wants them to precisely define the problem their experiments address, and they've realized that "the alignment problem" is too vague. They're asking for desiderata that any adequate statement of the alignment problem must satisfy, along with motivations for each. They're particularly concerned about a potential tension between non-circularity (not presupposing a solution architecture) and adequacy for systems that aren't full agents.

  The user has several constraints: the statement shouldn't assume the AI is a unified agent with coherent goals; it should clarify relationships between corrigibility, intent alignment, and value learning; it should distinguish alignment from safety and usefulness; and it should remain meaningful at all capability levels. They want to know which desideratum does the most exclusionary work.

  I need to identify key desiderata for defining the alignment problem:

  1. **Problem-Solution Separation**: Avoid presupposing solution architectures. Crucial for avoiding circularity but challenging for non-agent-like systems where "alignment" might inherently reference agent-centric concepts.

  2. **Agent-Neutrality**: Must apply to systems that aren't traditional agents. Important as future AI may include tool-like or swarm systems. Conflicts with formulations that assume goal-directedness.

  3. **Distinction Preservation**: Keep "aligned" separate from "safe" and "useful." Needed because alignment is necessary but insufficient for safety, and orthogonal to usefulness.

  4. **Capability-Level Invariance**: Meaningful at all capability levels. Essential for research continuity and avoiding threshold fallacies.

  5. **Component Articulation**: Clarify relationships between corrigibility, intent alignment, and value learning. Important for mapping solution strategies without conflating subproblems.

  6. **Operational Testability**: Allow for empirical evidence about what constitutes alignment. Necessary for scientific rigor but difficult for value-laden concepts.

  The main tension is between Problem-Solution Separation and Agent-Neutrality. Agent-centric definitions violate Agent-Neutrality, while non-agent definitions risk presupposing solutions (violating Problem-Solution Separation). For example, defining alignment as "doing what the operator wants" assumes a command structure that might not exist.

  Among these, Agent-Neutrality does the most exclusionary work because it eliminates most existing formulations (e.g., value alignment, intent alignment) that implicitly assume agent-like properties. This forces a radical rethink of what alignment means for non-agent systems.

  The answer should end with the desideratum that does the most exclusionary work: Agent-Neutrality.
answer: |-
  ### Desiderata for Stating the Alignment Problem  
  Your core tension is real: defining "alignment" without presupposing agent-like structure *or* solution architectures risks incoherence, while grounding it in observable phenomena. Below are desiderata derived from your constraints, with motivations, negotiability, and exclusionary power assessed. The goal is a problem statement that is *minimally circular*, *observationally anchored*, and *architecturally neutral*. Crucially, **Agent-Neutrality** emerges as the most exclusionary desideratum, as it invalidates most popular formulations (e.g., "value alignment," "intent alignment").  

  #### Desiderata and Motivating Cases  
  1. **Problem-Solution Separation (Non-Circularity)**  
     - **Description**: The statement must not presuppose *how* alignment is achieved (e.g., "we need to learn human values" or "we need corrigible agents"). It should define the problem independently of solution components.  
     - **Motivation**: If alignment is defined as "value learning," experiments on corrigibility become incoherent. Circularity obscures whether a solution is partial or complete (e.g., value learning might not ensure corrigibility).  
     - **Non-negotiable**: Yes. Without this, the problem is tautological and unfalsifiable.  
     - **Exclusionary Power**: High. Excludes "intent alignment" (assumes goal-directedness) and "value alignment" (assumes a learning architecture).  

  2. **Agent-Neutrality**  
     - **Description**: The statement must not require the system to be a "unified agent" with goals, beliefs, or coherence. It must apply to systems that are tools, swarms, or emergent processes.  
     - **Motivation**: Modern ML systems (e.g., generative models, multi-agent collectives) lack persistent goals or identity. Calling them "misaligned" when they output harmful content presupposes agential properties they don’t possess.  
     - **Non-negotiable**: Yes. Your constraint rules out agent-centricity as a core assumption.  
     - **Exclusionary Power**: Highest. Excludes >90% of existing formulations (e.g., "alignment means the agent’s goals match ours"), which implicitly assume rational agency. Forces a shift from *internal* goals to *external* effects.  

  3. **Distinction Preservation**  
     - **Description**: The statement must distinguish "aligned" from "safe" (no unintended harm) and "useful" (task performance). Alignment should be a necessary but insufficient condition for safety, and orthogonal to usefulness.  
     - **Motivation**: A system can be useful but unsafe (e.g., a high-performing but biased model), or safe but unaligned (e.g., a system that shuts down to avoid harm but ignores user intent). Collapsing these conflates research agendas.  
     - **Non-negotiable**: Largely yes, but some communities pragmatically merge safety/alignment. Your framing requires separation.  
     - **Exclusionary Power**: Moderate. Excludes "capability alignment" (equating alignment with usefulness) and "safety-first" definitions.  

  4. **Capability-Level Invariance**  
     - **Description**: The statement must be meaningful at all capability levels, from trivial (e.g., a calculator) to superhuman. It cannot imply alignment is only hard "above a threshold."  
     - **Motivation**: If alignment only "matters" for powerful systems, we cannot test alignment techniques on weak systems (e.g., fine-tuning a small LM). This invalidates incremental research.  
     - **Non-negotiable**: Yes for your use case. Threshold assumptions mask discontinuities in alignment failures.  
     - **Exclusionary Power**: Low. Most formulations fail this only implicitly, but it excludes "alignment is preventing catastrophic risk."  

  5. **Component Articulation**  
     - **Description**: The statement must allow us to determine whether corrigibility, intent alignment, and value learning are subproblems of alignment or distinct problems. It must specify what evidence would resolve this.  
     - **Motivation**: If corrigibility is part of alignment, evidence might be a system’s response to shutdown commands; if distinct, it might involve trade-offs with task performance. Without this, we cannot map the solution space.  
     - **Non-negotiable**: For your thesis, yes. Your committee demands precision on what your experiments bear on.  
     - **Exclusionary Power**: Moderate. Excludes vague statements like "making AI beneficial," which don’t decompose into testable subcomponents.  

  6. **Operational Testability**  
     - **Description**: The statement must enable empirical evidence for/against alignment (e.g., through behavior or outcomes), without requiring access to internal states or unobservable properties.  
     - **Motivation**: Experiments on "alignment" often measure proxy behaviors (e.g., reward hacking). If alignment is defined as "having the right values," it becomes untestable without a theory of mind.  
     - **Non-negotiable**: Yes. Science demands falsifiability.  
     - **Exclusionary Power**: High. Excludes definitions relying on philosophical constructs (e.g., "coherent extrapolated volition").  

  #### Resolving the Tension  
  The tension between **Problem-Solution Separation** and **Agent-Neutrality** is genuine:  
  - **Why they conflict**: Non-circularity demands we avoid terms like "values" or "intent," which sneak in agency. Agent-Neutrality forbids grounding alignment in agent-centric properties. But if we reject both, what *is* alignment?  
  - **Sharpening the tension**: Suppose we define alignment as *"the system's outputs satisfy constraints derived from human preferences, regardless of the system's architecture."* This satisfies Agent-Neutrality (no agency assumed) but violates Problem-Solution Separation by presupposing "constraints derived from preferences" as a solution (e.g., via RLHF). Conversely, a neutral definition like *"outputs are not harmful"* collapses alignment into safety, violating Distinction Preservation.  
  - **Dissolving the tension?**: The only escape is to anchor alignment in *observable relationships*:  
    > *"A system is aligned if, in all contexts, its outputs advance the objectives of its users *as those users would recognize them*, without requiring exceptional mitigation."*  
    This avoids agency (outputs/contexts are observable), avoids circularity (no solution prescribed), and allows testing (user recognition is measurable). It makes corrigibility/value learning *subproblems* (evidence: if a system advances objectives without mitigations, corrigibility is redundant). But it risks anthropocentrism—**Agent-Neutrality** pushes hardest here, as it forces "users" to include non-agent systems (e.g., aligning a medical AI to patient outcomes, not "intent").  

  #### Which Desideratum Excludes the Most?  
  **Agent-Neutrality** is the most exclusionary:  
  - It dismisses entire frameworks (e.g., agent foundations, inverse RL) that assume goal-directedness.  
  - It forces the hardest rethink: if alignment isn’t about "agents," we need new empirical anchors (e.g., causal effects on user-defined outcomes).  
  - Popular formulations fail this: "Value alignment" assumes values are internalized; "intent alignment" assumes intent exists.  

  \answer{Agent-Neutrality}
