prompt: |-
  I teach modern European history at a big public high school, and every unit ends with a "why did X happen" essay where I get ninety-odd answers arguing things like "the printing press caused the Reformation" or "the Depression caused the rise of the Nazis." When I grade these I find myself making the same calls over and over by gut: is a trigger a cause? Does it count if the student names something that was necessary but obviously not enough on its own (Luther without printing, printing without Luther)? What about kids who argue some version of "someone else would've done it anyway" -- which I think is the overdetermination thing from philosophy of causation, or maybe it's the preempting thing, honestly I get those confused. I've read a bit about this stuff (INUS conditions, but-for tests, necessary vs sufficient) but never enough to turn it into anything I actually use on a Sunday night with a stack of essays.

  What I want is a grading procedure I can run on a single causal claim in about three minutes, on paper, no philosophy training required -- me and the other teacher on the course both have to be able to apply it the same way, since we split the sections and the students compare grades. So it has to say: what questions to ask about a claim in order, what counts as an adequate answer at each step, at what point a claim gets full credit even if it's framed in naive language ("Princip shot the archduke so the war started" -- a 16-year-old isn't going to say 'but-for condition'), and where the procedure has to give up and just flag it as my judgment call, because I suspect a lot of causal-historiography grading is values dressed up as rubric. It should also tell me what to do with the "it would've happened anyway" move, both when the student uses it to knock down someone else's cause and when they use it to excuse one (the south would've seceded eventually, so was Lincoln's election really the cause?).

  Then run it on three real claims from last year's stack: "the assassination of Franz Ferdinand caused WWI," "the invention of the printing press caused the Reformation," and "the humiliation at Versailles caused WWII." Include at least one case where the procedure gives full or near-full credit to an answer I instinctively want to mark down (I'm pretty sure Princip as cause is one of these), and one where it marks down an answer I like -- and be honest about where the three-minute limit makes the procedure dumber than the philosophy it's based on.
reasoning: |-
  Okay, let me tackle this history teacher's problem. They need a quick, consistent way to grade causal claims in essays without getting bogged down in philosophical complexity. 

  First, I recognize their core frustrations: students oversimplify causes (single triggers as sufficient), confuse necessary vs sufficient conditions, and use "it would've happened anyway" arguments inconsistently. The teacher wants a practical tool that two educators can apply uniformly in under three minutes per claim.

  Hmm... the solution needs to balance academic rigor with classroom reality. I recall their references to INUS conditions and but-for tests - useful frameworks but too jargon-heavy. Maybe I can distill them into a flowchart-like questioning sequence. The key is making implicit expert judgment explicit through standardized steps.

  For structure, I consider a three-phase approach: 
  1) Immediate trigger check (is this just the spark?) 
  2) Contributing factor analysis (is it part of the causal web?) 
  3) Overdetermination handling (the "anyway" argument). 

  Each phase needs clear pass/fail thresholds. Like for Phase 1, if a student claims Princip caused WWI, they'd fail the "sufficient cause" test but pass to Phase 2 as a contributing factor. 

  Important to build in off-ramps where the rubric admits uncertainty - say when counterfactuals get too speculative. That's where teacher judgment legitimately kicks in. For the "anyway" scenarios, I'll need distinct rules for when students use it to dismiss a cause (must show alternatives) versus excuse one (must prove inevitability).

  Now testing against their examples: 
  - Franz Ferdinand assassination: Under this system, it'd get partial credit as necessary-but-insufficient, which feels right despite the teacher's instinct to downgrade simplistic triggers. 
  - Printing press: Would require showing how it enabled Reformation beyond just correlation - pushes student to nuance. 
  - Versailles: Tricky because resentment was necessary but Hitler's rise wasn't inevitable. The rubric would flag this for teacher judgment on overdetermination.

  The time limit means skipping nuanced probability assessments - a deliberate tradeoff. And yes, sometimes the rubric will approve claims the teacher dislikes (like crediting Princip) or reject favored arguments that lack evidence. That's by design to reduce bias.

  Finally, I should emphasize this isn't philosophy-lite but pedagogy-first: translating complex concepts into actionable questions like "Could this have happened without X?" and "Was X enough on its own?" The real win is consistency - students won't see grade variations between teachers arguing about preemption versus overdetermination.
answer: |-
  Here's a practical **Causal Claim Grading Procedure (CCGP)** designed for speed, consistency, and pedagogical clarity, based on distilled causation concepts. It treats causation as a spectrum from "trigger" to "necessary/sufficient condition" and explicitly handles "it would've happened anyway" arguments.

  ---

  ### **Causal Claim Grading Procedure (CCGP)**  
  *(Apply to each distinct causal claim in an essay. 3-minute max per claim.)*

  1.  **PHASE 1: IS THIS A *SUFFICIENT* CAUSE? (The "Alone Enough" Test)**
      *   **Question:** Could this event/condition **by itself** have caused the outcome, even if other factors changed? (e.g., Could the assassination *alone* cause WWI if alliances, militarism, imperialism didn't exist?)
      *   **Adequate Answer:** Student must provide **evidence or logic** showing the cause could plausibly produce the outcome *independently*.
      *   **Scoring:**
          *   **YES (Rare):** Full credit for causal claim. *(Example: "A direct nuclear strike on Moscow caused the collapse of the Soviet government.")*
          *   **NO (Almost Always):** Proceed to Phase 2.

  2.  **PHASE 2: IS THIS A *NECESSARY* OR *SIGNIFICANT CONTRIBUTING* CONDITION? (The "Essential Ingredient" Test)**
      *   **Question A (Necessary):** Could the outcome have happened **without** this event/condition? (But-For Test: But for X, would Y still have occurred?)
      *   **Question B (Contributing):** Even if not *strictly* necessary, did this event/condition **significantly alter the likelihood, speed, scale, or form** of the outcome? Did it make the outcome *much more probable or feasible*?
      *   **Adequate Answer:** Student must **engage with counterfactuals or context**. For B, they must explain *how* it altered the outcome.
      *   **Scoring:**
          *   **A: YES (Necessary):** Strong claim. Partial or Full Credit (see Phase 3). *(Example: Argues WWI couldn't have started in July 1914 without the assassination.)*
          *   **A: NO, but B: YES (Significant Contributor):** Strong claim. Partial or Full Credit (see Phase 3). *(Example: Argues printing press massively accelerated and spread Reformation ideas.)*
          *   **A: NO & B: NO:** Weak claim. Minimal or No Credit. *(Example: Argues "The full moon caused WWI.")*

  3.  **PHASE 3: HANDLING "IT WOULD'VE HAPPENED ANYWAY" (Overdetermination/Preemption)**
      *   **Situation 1: Student USES this argument to *dismiss* a cause (e.g., "War would've happened anyway, so assassination wasn't the cause").**
          *   **Question:** Does the student provide **plausible alternative triggers/scenarios** demonstrating the outcome was highly likely/imminent *without* the cited cause? Do they explain *why* the cited cause wasn't necessary or uniquely significant?
          *   **Adequate Answer:** Not just assertion. Requires **specific historical evidence** of mounting tensions/alternative catalysts.
          *   **Scoring:**
              *   **YES (Convincing Alternatives):** Weakens the original claim being dismissed. Dismissal gets credit.
              *   **NO (Just Assertion):** Dismissal argument weak; doesn't negate Phase 2 assessment of the original cause.
      *   **Situation 2: Student USES this argument to *excuse* a cause (e.g., "South would've seceded anyway, so Lincoln's election wasn't *really* the cause").**
          *   **Question:** Does the student **prove inevitability**? Can they show the outcome *would definitely* have happened very soon, in the same way, *regardless* of the cited cause? Is the cited cause just one of many *interchangeable* triggers?
          *   **Adequate Answer:** Requires **strong evidence of structural inevitability**, not just likelihood. Must address *timing* and *form*.
          *   **Scoring:**
              *   **YES (Proven Inevitability - Rare):** Downgrades the cited cause to "trigger" status; claim gets reduced credit.
              *   **NO (Inevitability Not Proven):** "Anyway" argument fails; Phase 2 assessment of the cause stands.
      *   **Situation 3: Student MAKES a claim that *others* might say "would've happened anyway".**
          *   **Question:** Did the student **preemptively address** likelihood/inevitability? Did they acknowledge context or competing factors?
          *   **Adequate Answer:** No requirement to address it unless inherent to the claim. Credit based on Phases 1 & 2.
          *   **Scoring:** N/A. Use Phases 1 & 2.

  **FINAL SCORING PER CLAIM:**
  *   **Full Credit (A):** Claim passes Phase 2 (Necessary or Significant Contributor) AND is well-supported with evidence. (Or passes Phase 1 - Rare).
  *   **Partial Credit (B):** Claim passes Phase 2 but support is weak/vague. OR Claim is correctly dismissed via "Anyway" argument (Sit 1).
  *   **Minimal/No Credit (C/D):** Claim fails Phase 2. OR "Anyway" excuse used unsuccessfully (Sit 2). OR Claim dismissed without evidence (Sit 1).

  **JUDGMENT CALL FLAGS (When the procedure gives up):**
  1.  **Proving Inevitability (Sit 2):** Historians rarely agree on true inevitability. If evidence is strong but debatable, use judgment.
  2.  **Significance Threshold (Phase 2B):** How much did it "significantly alter"? If it's borderline, use judgment.
  3.  **Complex Multi-Causality:** When a claim is deeply embedded in a web the student *doesn't* acknowledge, but the specific factor *is* valid. (Use Phase 2; if it passes, credit the factor, mark down for oversimplification elsewhere if needed).
  4.  **"Values Dressed as Rubric":** The rubric minimizes this by focusing on evidence for necessity/contribution and counterfactuals. Judgment is mainly for borderline cases flagged above.

  ---

  **Running the CCGP on Your Examples:**

  **1. Claim: "The assassination of Franz Ferdinand caused WWI."**
  *   **Phase 1 (Sufficient?):** NO. The assassination alone couldn't cause a world war without alliances, militarism, etc. → Proceed.
  *   **Phase 2 (Necessary/Contributing?):**
      *   A (Necessary?): **DEBATABLE, but often judged YES.** But for the assassination *in that context*, war likely wouldn't have erupted *in July 1914*. Other crises (Morocco, Balkans) had been resolved. Strong argument it was the necessary spark *for that moment*.
      *   B (Contributing?): **Overwhelmingly YES.** It was the immediate trigger that mobilized the alliance system and war plans. Made war *happen then*.
  *   **Phase 3:** N/A (Claim isn't using "anyway").
  *   **Scoring:** Passes Phase 2 (A&B). **Full Credit (A)** if supported (e.g., mentions the ultimatum, mobilization). *This is the case where the procedure gives full credit contrary to your instinct.* The rubric values it as the necessary trigger/significant catalyst, even if naive language is used. The "gut" instinct to mark it down is often about *oversimplifying total causality*, not the validity of the assassination *as a necessary link*.

  **2. Claim: "The invention of the printing press caused the Reformation."**
  *   **Phase 1 (Sufficient?):** NO. Printing alone doesn't cause a religious revolt without Luther, grievances, politics, etc. → Proceed.
  *   **Phase 2 (Necessary/Contributing?):**
      *   A (Necessary?): **NO.** Religious revolts/reforms predate printing (e.g., Hus, Waldensians). Could have happened slower/differently via manuscripts, preaching.
      *   B (Contributing?): **YES, BUT...** Student must **explain *how***. Did they just state it, or show it *significantly altered* the Reformation (speed, scale, dissemination of ideas, pamphleteering, enabling lay access to Bible/Luther)? If they explain the impact, YES.
  *   **Phase 3:** N/A.
  *   **Scoring:** **Partial Credit (B)** if they just state it. **Full Credit (A)** if they *explain the significant contribution* (e.g., "allowed Luther's ideas to spread rapidly across Germany, bypassing Church control, fueling popular support"). *Procedure forces them beyond simple correlation.*

  **3. Claim: "The humiliation at Versailles caused WWII."**
  *   **Phase 1 (Sufficient?):** NO. Versailles alone didn't cause WWII without the Depression, Hitler, Nazi ideology, appeasement, etc. → Proceed.
  *   **Phase 2 (Necessary/Contributing?):**
      *   A (Necessary?): **NO.** German resentment existed pre-Versailles (e.g., war aims, "stab-in-the-back"). Other paths to revanchism/dictatorship conceivable (though unlikely).
      *   B (Contributing?): **YES.** Versailles was a *major* source of nationalist resentment, economic instability, and a potent tool for Nazi propaganda. It *significantly increased the likelihood* of revanchist aggression.
  *   **Phase 3:** **Student likely implying "anyway" to *excuse* Versailles?** (Sit 2: "Germans would have been resentful anyway, so Versailles wasn't *the* cause"). Apply Sit 2:
      *   **Question:** Does the student **prove inevitability** of WWII/Nazism *without* Versailles? Can they show *the same outcome* (Hitler's rise, aggressive expansionism) would have happened *regardless* of the treaty terms? **NO.** Versailles was a *defining* context. Resentment without the specific harshness/legitimacy of Versailles might have taken a different form/timing. Inevitability not proven.
  *   **Scoring:** Claim passes Phase 2B (Significant Contributor). The "anyway" excuse (if used) fails Phase 3 Sit 2. **Full Credit (A)** for identifying Versailles as a major contributing cause. *This might be an answer you like, and the rubric supports it, while correctly rejecting the weak "anyway" excuse.*

  ---

  **Where the 3-Minute Limit Makes it Dumber (Honest Assessment):**

  1.  **Necessary vs. Necessary-in-Context:** The procedure flattens "necessary *for the specific historical occurrence*" (like Franz Ferdinand in July 1914) with abstract necessity. Philosophy distinguishes this nuance better. The rubric pragmatically accepts the former as "necessary" for Phase 2A.
  2.  **Degree of Contribution (Phase 2B):** Judging "significantly" altered is inherently fuzzy. Philosophy might use probability weights; the rubric relies on the teacher's reasonable historical understanding within the 3 mins. Borderline cases are the Judgment Flags.
  3.  **Overdetermination Nuance:** Philosophy distinguishes preemption (one cause acts first) from symmetric overdetermination (multiple sufficient causes). The rubric's "Anyway" section (especially Sit 2) tries to capture the *inevitability* aspect common to both, sacrificing precision for speed. It focuses on "interchangeable triggers" vs. "unique necessity."
  4.  **Complex Counterfactuals:** Deeply exploring alternative worlds (e.g., *exactly* how a Reformation without printing might look) is impossible in 3 mins. The rubric relies on plausible, evidence-based "what-ifs" from the student, judged quickly for reasonableness.
  5.  **"Caused" vs. "Enabled":** While Phase 2B covers enabling factors, the language distinction ("caused" is strong) is blurred. The rubric accepts "X caused Y" if X is a necessary or significant contributing condition, even if it's primarily an enabler (like printing press). This prioritizes student communication over semantic precision.

  **Conclusion:** This CCGP provides a consistent, evidence-focused framework for grading causal claims quickly. It rewards students for identifying necessary triggers or significant contributing factors, even with simple language, while pushing them to justify necessity/contribution and handle "anyway" arguments with evidence. It flags the inherently subjective aspects (significance thresholds, inevitability) for teacher judgment. It *will* sometimes give high marks to claims framed as "X caused Y" when X is "only" a necessary trigger (Franz Ferdinand) and mark down claims that don't move beyond simple correlation (printing press without explanation), but this reflects a pedagogical choice to value identifying key historical links over mastering causal metaphysics.
