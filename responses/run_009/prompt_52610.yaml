answer: |-
  ## Cotton, Flame, and Constant Rebeginning

  No flame ignites the cotton, strand by strand,  
  The water quenches not the dry land’s ache,  
  God weaves the world anew at His command.

  The bread sustains us? Not by its own hand,  
  This comfort is a habit He might break.  
  No flame ignites the cotton, strand by strand.

  The sun spills gold across the waiting sand,  
  Yet darkness holds no power it must forsake.  
  God weaves the world anew at His command.

  Why then this certainty we understand?  
  Why does the pattern hold for pity’s sake?  
  No flame ignites the cotton, strand by strand?  
  *(A habit deep, lest constant wonder break)*  
  It is His courtesy, not iron band,  
  This grace that lets the fragile order wake.  
  God weaves the world anew at His command.

  The spark alights the fibre where it’s fanned,  
  A touch observed – then *what* the Lord will make!  
  No flame ignites the cotton, strand by strand,  
  God weaves the world anew at His command.

  ---

  **Why the Form *Is* the Argument:**

  1.  **The Obsessive Returns:** The villanelle's strict pattern of repeated refrains (1 and 3) embodies the *habit* of God. Each recurrence is formally identical, mirroring the consistent patterns we observe (fire seeming to burn cotton, water seeming to quench thirst).
  2.  **Fresh Creation vs. Mechanical Law:** Despite the identical words, each recurrence happens in a *new* context, surrounded by different tercets. This mimics the core tenet: God *chooses* to recreate the same effect *at each instant* ("God weaves the world anew"). The repetition *is* the pattern, not evidence of an independent law forcing it.
  3.  **The Denial & Assertion:** The two refrains encapsulate the entire doctrine. The denial ("No flame ignites...") strips away secondary causality. The assertion ("God weaves...") establishes the sole true Agent. Their relentless alternation forces the reader to hold both concepts simultaneously, just as occasionalism demands.
  4.  **The Final Couplet:** The culminating moment where both refrains meet in a single couplet perfectly mirrors the *event* al-Ghazālī describes: the contact occurs ("The spark alights..."), and simultaneously, the effect is freshly willed by God ("then *what* the Lord will make!" echoing "God weaves..."). The form enacts the metaphysics: apparent sequence, actual divine creation.
  5.  **Exposing Habitual Certainty:** Stanza 4 explicitly questions why the pattern feels certain ("Why then this certainty...?"), answering with the crucial theological point: it's God's *courtesy* ("lutf") and *habit* ("‘ādah"), not necessity. The parentheses ("A habit deep...") whisper the psychological explanation without breaking the poetic piety.

  **Metaphysical Fidelity:**

  *   **Causal Pairs:** Fire/burning (Stanzas 1,2,6), Water/quenching (Stanza 2), Bread/nourishment (Stanza 3), Sun/light & Darkness (Stanza 3), Spark/fibre (Stanza 6). All are standard examples al-Ghazālī uses.
  *   **Core Doctrine:** Absolute denial of creaturely agency ("No flame ignites," "water quenches not," "bread sustains us? Not by its own hand"), exclusive attribution of all effects to God's direct, instantaneous will ("God weaves the world anew at His command," "then *what* the Lord will make!").
  *   **Habit & Miracle:** Explicitly stated ("A habit He might break," "He could withdraw..."). The "courtesy" ("lutf") explanation for the *feeling* of necessity is central to Ash'arite theology.
  *   **Divine Freedom & Creation:** "Anew," "at His command," "will make" emphasize God's absolute freedom and continuous, volitional re-creation. The world is fundamentally contingent and dependent moment-by-moment.
  *   **Piety & Philosophy:** The language ("God," "Lord," "command," "courtesy," "pity’s sake," "grace") reflects al-Ghazālī's deeply religious framework. The poem doesn't debunk; it reveals the divine reality *behind* the apparent order, consistent with his purpose in the *Tahāfut*.

  The villanelle's inherent structure of cyclical return, governed by fixed rules yet demanding fresh placement each time, becomes the perfect vessel to articulate and embody al-Ghazālī's vision of a cosmos sustained by perpetual divine re-enactment.
