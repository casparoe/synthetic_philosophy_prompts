  Notably, their supervisor's phenomenology critique needs careful handling - it's not empirically fatal but exposes explanatory gaps. The insulation concern is valid: some eternalist responses risk unfalsifiability through indexical accounts of passage. I should acknowledge this as a dialectical weakness even if not metaphysical.

