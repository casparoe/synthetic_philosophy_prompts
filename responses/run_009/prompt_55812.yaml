prompt: |-
  A friend and I spent the better part of an evening arguing about what economists mean when they talk about "utility," and I left without a clear sense of who was right. Near the end, she condensed her position into a summary that I want checked. As best I can reconstruct it, she said the following:

  Samuelson invented revealed preference theory to rid economics of unverifiable psychology: preferences are nothing over and above the choices a person makes. The theory says that if someone's choices are consistent — they never pick option A over B in one situation and B over A in another when both are affordable — then their behavior is exactly what you'd see from someone maximizing a utility function. But that means utility theory is empty: it just relabels consistent behavior as "maximization" and so cannot be wrong under any circumstances. It follows that the model has no empirical content whatsoever, and that the only scientifically respectable way to find out what a person wants is to watch what they buy. Since utility is merely a bookkeeping device for choices, comparing one person's utility to another's is a category error, and any ethical theory that needs such comparisons — utilitarianism, for instance — is thereby shown to be nonsense.

  She is an economics student and I am not, so I can't easily tell which of these claims is standard doctrine and which is her own extrapolation. Some of it sounded right in the moment, but a few steps felt like they moved too fast: the jump from "choices reveal preferences" to "preferences are nothing but choices," and the move from unfalsifiability to the conclusion about ethics, in particular. Please audit her summary part by part. Tell me which claims a careful economist would endorse as stated, which are defensible only with qualifications she omitted, and which are genuine misrepresentations or non sequiturs. For each part you correct, explain what the corrected version would say. Finally, address her two headline conclusions directly: is revealed preference theory really empirically empty, and does the theory, properly understood, actually have any bearing on whether utilitarianism is coherent? Please keep your answer under 700 words, and lead with a short statement of your overall verdict before the part-by-part analysis.
reasoning: |-
  Okay, the user and their friend had a deep discussion about "utility" in economics, specifically focusing on revealed preference theory. The friend made several strong claims, and the user is unsure which parts are accurate. Let me start by recalling the key points the friend presented.

  First, she mentioned Samuelson invented revealed preference to eliminate unverifiable psychology. That's correct—Samuelson did want to base preferences on observable choices. Then she argued that preferences are nothing beyond choices. But is that entirely accurate? While revealed preference uses choices to infer preferences, it doesn't necessarily mean preferences are reducible to choices. There might be internal states influencing decisions, even if unobservable.

  Next, she claimed that consistent choices imply utility maximization, making the theory unfalsifiable. This is a common critique. If any consistent behavior can be modeled as maximizing a utility function, then the theory can't be proven wrong. But economists would counter that the theory has content when tested against new choice sets. For example, predicting future choices based on past behavior adds empirical substance.

  Her conclusion that utility theory is empty is a point of debate. While the weak form (rationalizing past choices) might be tautological, the strong form (predicting future choices) is testable. So her claim oversimplifies by ignoring predictive power.

  On the ethical implications, she stated that interpersonal utility comparisons are a category error, rendering utilitarianism nonsense. Here, she's mixing positive economics with normative ethics. Economics avoids interpersonal comparisons because they can't be observed, but that doesn't invalidate ethical theories. Utilitarianism can still be a moral framework, even if utility isn't cardinally measurable. Philosophers like Harsanyi have addressed this, so her leap seems unfounded.

  The user's underlying concerns might be about understanding economic methodology and its limits. They might also be seeking clarity on how economic theories interact with philosophical ideas like utilitarianism. Recognizing these nuances is key to addressing their confusion and correcting the friend's overstatements.
answer: |-
  ### Overall Verdict
  Your friend captures key insights of revealed preference theory but overstates its implications. While the core logic about consistency and utility representation is standard, claims about empirical emptiness and the death of utilitarianism are significant misrepresentations or non sequiturs.

  ### Part-by-Part Audit

  1.  **"Samuelson invented revealed preference theory to rid economics of unverifiable psychology: preferences are nothing over and above the choices a person makes."**
      *   **Verdict: Defensible with qualifications.**
      *   **Correction:** Samuelson *did* aim to ground preferences in observable choices, avoiding introspective psychology. However, most economists see revealed preference as a *methodology* for inferring underlying preferences *from* choices, not a claim that preferences *are identical to* choices. Preferences are still understood as mental states *revealed by* choices under constraints. The phrase "nothing over and above" is overly reductionist; choices are the *evidence*, not the *entirety*.

  2.  **"If someone's choices are consistent... then their behavior is exactly what you'd see from someone maximizing a utility function."**
      *   **Verdict: Standard doctrine.**
      *   **Explanation:** This is the fundamental **Representation Theorem** of revealed preference theory. If choices satisfy consistency axioms (like the Weak Axiom or Strong Axiom of Revealed Preference), we can construct a utility function such that the observed choices are precisely the ones that maximize that function. This is a core mathematical result.

  3.  **"Utility theory is empty: it just relabels consistent behavior as 'maximization' and so cannot be wrong under any circumstances."**
      *   **Verdict: Misrepresentation / Overstatement.**
      *   **Correction:** While the theory *can* rationalize *past* consistent choices tautologically, its **predictive power** gives it empirical content. The test is: Given a history of consistent choices, can the model (based on revealed preferences) *correctly predict* choices in *new* budget situations? If predictions fail, the consistency axiom is violated, and the model is falsified. It's not empty because it imposes the testable restriction of *future* consistency based on *past* choices.

  4.  **"The only scientifically respectable way to find out what a person wants is to watch what they buy."**
      *   **Verdict: Defensible as methodology, overstated as exclusive truth.**
      *   **Correction:** Revealed preference *is* the dominant *positive* (descriptive) methodology in microeconomics for inferring preferences from behavior. However, economists recognize its limitations (e.g., choices made under imperfect information, impulse, or changing tastes). Surveys, experiments, and neuroscience provide supplementary data. "Scientifically respectable" is strong, but "primary method based on observable data" is accurate.

  5.  **"Utility is merely a bookkeeping device for choices."**
      *   **Verdict: Standard doctrine within ordinal utility theory.**
      *   **Explanation:** In the context of revealed preference and ordinal utility, the utility function is indeed a convenient numerical representation of the underlying preference *ordering*. Its specific values and differences between them are meaningless; only the ranking it represents matters. It *is* a bookkeeping device for the preference relation revealed by choices.

  6.  **"Comparing one person's utility to another's is a category error."**
      *   **Verdict: Standard doctrine within positive economics.**
      *   **Explanation:** Since revealed preference only identifies an *ordinal* ranking unique up to monotonic transformations, the *level* and *differences* in utility numbers assigned to different individuals have no basis in observable choice behavior. Comparing them involves making interpersonal comparisons of subjective well-being, which lack a scientific (positive) foundation within this framework. Calling it a "category error" is a bit strong philosophically, but it's certainly seen as **unscientific and inadmissible in positive economics**.

  7.  **"Any ethical theory that needs such comparisons — utilitarianism, for instance — is thereby shown to be nonsense."**
      *   **Verdict: Non sequitur / Genuine misrepresentation.**
      *   **Correction:** This is a massive leap. Revealed preference theory is a *positive* theory about describing behavior. It shows that *within its own framework*, interpersonal utility comparisons lack a scientific basis derived from choice data. **It says absolutely nothing about the normative validity or coherence of ethical theories like utilitarianism.** Utilitarianism is a *normative* (prescriptive) ethical framework. Philosophers and welfare economists debate its foundations, justifications, and alternatives. Some utilitarians argue for making interpersonal comparisons based on ethical principles, empathy, or other grounds *despite* the lack of a positive scientific measure. Concluding that utilitarianism is "nonsense" based solely on revealed preference theory's limitations is illogical. Revealed preference theory simply doesn't engage with the core justifications of normative ethics.

  ### Addressing Headline Conclusions

  1.  **Is revealed preference theory empirically empty?**
      *   **No.** While it can rationalize *past* consistent choices tautologically, its core empirical content lies in its **predictive power**. The theory implies that observed consistency (satisfying the axioms) should allow accurate prediction of choices in *novel* budget situations. If predictions fail systematically, the model (that the agent has stable, consistent preferences) is falsified. This testability gives it empirical content, albeit within its specific domain and assumptions.

  2.  **Does revealed preference theory show utilitarianism is incoherent?**
      *   **Absolutely not.** Revealed preference theory demonstrates the **difficulty of making scientifically grounded interpersonal utility comparisons based solely on observed choice behavior.** This poses a *practical challenge* for implementing utilitarianism if one insists on basing it solely on such comparisons derived from choice data. However, it **does not** demonstrate that utilitarianism itself is logically incoherent or normatively invalid. Utilitarianism is an ethical theory whose coherence and justification rest on philosophical arguments about morality, well-being, and aggregation – arguments entirely separate from the positive, descriptive project of revealed preference theory. The theory's silence on interpersonal comparability within its domain does not equate to proving the concept nonsensical in ethics.
