answer: |-
  **QUESTION (25 marks)**  

  **(i) (12 marks)** For each statement below, state whether it is provable in ZFC (true) or false. If false, provide an explicit counterexample.  

  (a) If in a partially ordered set, every nonempty chain has an upper bound, then the set has a maximal element.  
  (b) If in a nonempty partially ordered set, every finite chain has an upper bound, then the set has a maximal element.  
  (c) If in a nonempty partially ordered set, every chain has an upper bound, then the set has a greatest element.  
  (d) If in a nonempty partially ordered set, every chain (including the empty chain) has an upper bound, and we explicitly require an upper bound for the empty chain, then the set has a maximal element.  

  **(ii) (8 marks)** Prove using Zorn’s lemma that every proper ideal in a commutative ring with identity is contained in a maximal ideal. Define the partially ordered set explicitly, verify that every chain has an upper bound, and explain why this upper bound is a proper ideal.  

  **(iii) (5 marks)** Explain why a naive proof of Zorn’s lemma by transfinite recursion—building a chain by repeatedly appending elements strictly above the current chain—fails without the axiom of choice. Specify where the axiom of choice is used in the standard proof.  

