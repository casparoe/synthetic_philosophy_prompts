  **MODEL ANSWER**  

  **(i)**  
  (a) **False.** Counterexample: The empty partially ordered set. There are no nonempty chains, so the hypothesis is vacuously true. But the empty set has no maximal element.  
  (b) **False.** Counterexample: The natural numbers \(\mathbb{N}\) with the usual order \(\leq\). It is nonempty. Every finite chain (e.g., \(\{3, 5\}\)) has an upper bound (e.g., 5). But \(\mathbb{N}\) has no maximal element.  
  (c) **False.** Counterexample: Let \(X\) be an infinite set. Let \(P\) be the set of all *finite* subsets of \(X\), ordered by inclusion. \(P\) is nonempty (e.g., \(\emptyset \in P\)). Every chain \(\mathcal{C}\) in \(P\) has an upper bound: \(\bigcup \mathcal{C}\). Since \(\mathcal{C}\) is a chain of finite sets, \(\bigcup \mathcal{C}\) is finite (if \(\mathcal{C}\) is finite) or infinite (if \(\mathcal{C}\) is infinite). But if \(\mathcal{C}\) is infinite, \(\bigcup \mathcal{C}\) is infinite and not in \(P\), so it is not an upper bound in \(P\). Correction: Use the set of *proper* ideals in a non-Noetherian ring? Better: Let \(P\) be \(\mathbb{N}\) with the *divisibility* order (\(a \leq b\) if \(a \mid b\)). Chains are sequences like \(1 \mid 2 \mid 4 \mid \cdots\). This chain has no upper bound in \(\mathbb{N}\) (no number is divisible by all powers of 2). Revised counterexample: Let \(A = B = \mathbb{N}\). Let \(P\) be the set of all injective functions from a subset of \(A\) to \(B\), ordered by extension (i.e., \(f \leq g\) if \(g\) extends \(f\)). \(P\) is nonempty (e.g., the empty function). Every chain \(\mathcal{C}\) has an upper bound: the union of functions in \(\mathcal{C}\), which is injective. But there is no greatest element: e.g., the function \(\{(1,2)\}\) and \(\{(1,3)\}\) are incomparable.  
  (d) **True.** This is equivalent to the standard Zorn’s lemma, as the explicit requirement for the empty chain is redundant (the standard statement already requires it). Provable in ZFC.  

  **(ii)**  
  Let \(R\) be a commutative ring with identity and \(I\) a proper ideal. Define a poset \((P, \subseteq)\) where:  
  \[
  P = \{ J \subseteq R \mid J \text{ is a proper ideal and } I \subseteq J \}.
  \]  
  - \(P\) is nonempty: \(I \in P\).  
  - \(P\) is partially ordered by inclusion.  

  Let \(\mathcal{C}\) be a chain in \(P\). Define \(J^* = \bigcup_{J \in \mathcal{C}} J\).  
  - \(J^*\) is an ideal: If \(a, b \in J^*\), then \(a \in J_1\), \(b \in J_2\) for some \(J_1, J_2 \in \mathcal{C}\). Since \(\mathcal{C}\) is a chain, \(J_1 \subseteq J_2\) or \(J_2 \subseteq J_1\); w.l.o.g., \(J_1 \subseteq J_2\). Then \(a, b \in J_2\), so \(a - b \in J_2 \subseteq J^*\). For \(r \in R\), \(ra \in J_1 \subseteq J^*\).  
  - \(J^*\) contains \(I\): Since \(I \subseteq J\) for all \(J \in \mathcal{C}\), \(I \subseteq J^*\).  
  - \(J^*\) is proper: If \(1 \in J^*\), then \(1 \in J\) for some \(J \in \mathcal{C}\). But \(J\) is proper, contradiction. Thus, \(J^* \in P\) and is an upper bound for \(\mathcal{C}\).  

  By Zorn’s lemma, \(P\) has a maximal element, which is a maximal ideal containing \(I\).  

  **(iii)**  
  The naive transfinite recursion fails because, at each step, one must choose an upper bound for the current chain. However, a chain may have multiple upper bounds, and there is no canonical way to select one. Without the axiom of choice, there is no mechanism to make these arbitrary choices coherently across infinitely many steps. In the standard proof, the axiom of choice is used to define a choice function on the family of nonempty sets of upper bounds for chains, ensuring that such choices exist uniformly.  

