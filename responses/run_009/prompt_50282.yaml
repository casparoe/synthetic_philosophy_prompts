prompt: |-
  My older sister is halfway through an evo-bio PhD and I just started vet school, so family dinners have turned into her auditing my anatomy lectures. Everytime the lecturer says "the function of X is Y" she has opinions, and to keep myself sane I've started writing down her actual verdicts like she's a case law I can reverse-engineer. Problem is I can't figure out the rule. Here's her track record so far: the kidney's function is filtering blood, and she'll say that even about a cat with congenital renal dysplasia whose kidneys filter basically nothing — they still have the function, they're just terrible at it. But the pelvic bones inside a whale skeleton have NO function, full stop, and when I offered that maybe their function is walking but they just fail to perform it, she looked at me like I'd put ketchup on her ice cream. On a goat farm she visited there's a gene variant present in maybe 4% of the herd that protects against a parasite when it's present, and she says yes, that's genuinely its function, even though most goats don't have it. On the other hand a dog with a benign tumor that secretes some hormone detectable on bloodwork — the tumor cells are not "functioning" to secrete it, that's just something they do, not a function, whatever the lab report implies. And she's fine saying the scent gland on some deer's leg has the function of marking territory even though it apparently started out as a byproduct of something else ages ago.

  So now here's the thing, she texted me last night about a mouse in her lab. It was born with a brand new mutation, single individual, no siblings, no offspring yet, nothing selected for anything — and it can digest a sugar that the rest of the strain can't touch. She wants my guess before she tells me her verdict (there's a milkshake riding on this). What do you think she'll say — does that mutation have the function of digesting the sugar? More than the yes/no, I want to know what rule she seems to be running given the verdicts above, what other rules would fit those same verdicts just as well, and where those rules come apart on the mouse. I can half-see a backward-looking story (functions come from some kind of history) and a forward-looking one (functions are about what a part contributes to the animal right now), and I suspect the mouse is exactly where they split, but I don't trust myself to say which one explains her other verdicts better — like, does the failing kidney or the whale pelvis sit closer to the mouse case?

  And if her track record really is consistent with more than one rule, tell me what I should spring on her next to settle it — I get one more dinner before she claims the milkshake, so I want the question that actually discriminates between the surviving candidate rules, not just another case they'd all answer the same way. Also fair warning, if the answer is "she's just inconsistent," I need to know which verdict I should pressure her to give up.
reasoning: |-
  Hmm, the user is trying to figure out their sister's rule for determining biological function based on her past verdicts. Let me analyze the examples given.

  First, the kidney case: even in a cat with dysfunctional kidneys, she says filtering blood is still their function. This suggests she separates current performance from intended purpose. Then the whale pelvis: she insists it has NO function, rejecting the idea that it could have a "walking function" that fails. The goat gene variant present in only 4% of the herd is said to have the function of parasite protection, despite being rare. But a dog's benign tumor secreting hormone? Not considered function - just something it does. The deer scent gland gets called functional despite evolutionary origins as a byproduct.

  Now the mouse puzzle: a novel mutation allowing sugar digestion in a single individual with no evolutionary history. I need to figure out what rule explains all previous cases and predicts her mouse verdict.

  Looking at patterns: 
  - Whale pelvis and failed kidney both don't work, but she treats them differently. Key distinction: whale pelvis has no evolutionary purpose now, while kidney does.
  - Goat gene has established protective effect in population, hence function.
  - Tumor secretion lacks evolutionary design, so not function.
  - Deer gland currently contributes to fitness, so function despite origins.

  This points strongly to an etiological theory (history-based). Functions exist because of past selection. Whale pelvis lost its selective history, kidney still has it. Goat gene was selected for protection. Tumor has no such history. Deer gland gained new selective purpose.

  But could there be a systemic (current contribution) theory? That fails with whale pelvis - it currently serves no purpose but might have vestigial structure. Also fails with the deer gland's origin story. 

  The mouse is the perfect test case: no history, only current effect. Etiological theory would say "not a function yet" because no selection history. Systemic might say "yes, it functions to digest sugar."

  Her other cases fit etiological better. Whale pelvis has no selective history now, so no function. Failed kidney has the history. Goat gene has population-level history. Tumor lacks selective history. Deer gland has acquired selective purpose.

  If she says "no function" for the mouse mutation, it confirms etiological view. If "yes," it suggests systemic, but that would contradict her whale pelvis verdict where current lack of purpose mattered.

  For a follow-up test to distinguish theories if needed: ask about a vestigial structure that currently happens to be useful (like whale pelvis accidentally protecting an organ). Etiological would say no function, systemic might say yes.

  But given her consistency on whale pelvis vs kidney, I'm betting on etiological view predicting "no function" for the mouse.
answer: |-
  Based on your sister's verdicts, she's almost certainly operating under an **etiological (or "selected effects") theory of function**, which is dominant in evolutionary biology. This view defines a trait's function by its *evolutionary history*—specifically, whether it was *selected for* a particular effect. The mouse mutation will be a **no**—it does *not* yet have the "function" of digesting the sugar. Here's why:

  ### The Rule: Etiological Function (Selected Effects Theory)
  A trait has the **function** of doing Y if and only if:
  1. **Y is a consequence of the trait**,  
  2. **Y contributed to the fitness of ancestors**, and  
  3. **Y is why the trait was favored by natural selection** (i.e., it was "selected for" Y).

  This rule explains *all* her verdicts perfectly:
  - **Cat's kidneys**: Filtering blood is the function because kidneys were *selected for* this role in ancestors. Current failure doesn't erase evolutionary history.  
  - **Whale pelvic bones**: No function because they weren't *selected for* anything in whale ancestors (they’re vestigial). Current uselessness confirms this.  
  - **Goat gene variant**: Its function is parasite resistance because it *was selected for that effect* in the herd (even if rare now).  
  - **Dog's tumor**: Secretion isn't a "function" because tumors weren't *selected for* secreting hormones; it’s a pointless byproduct.  
  - **Deer scent gland**: Marking territory *is* its function because, despite origins as a byproduct, it *was later selected for* this new role.

  ### Where Other Theories Fail
  - **Systemic/Dispositional Theory** (function = current contribution to survival/reproduction):  
    - ✅ Explains *kidneys* (still contribute systemically).  
    - ❌ **Fails the whale pelvis**: Current contribution is zero, but she rejects "walking function" entirely—systemic theory should allow "failed function."  
    - ❌ **Fails the tumor**: It systemically secretes a hormone, but she denies it has a function.  
  - **Causal Role Theory** (function = causal contribution to a system's goals):  
    - ✅ Explains *kidneys* and *deer gland*.  
    - ❌ **Fails the goat gene**: In 96% of goats without it, the gene doesn’t contribute—yet she calls it functional.  
    - ❌ **Fails the tumor**: It causally contributes to hormone levels, but she says it’s not functional.  

  ### The Mouse Case: Where Theories Split
  - **Etiological view (her likely verdict: NO)**: The mutation has no evolutionary history. It wasn’t *selected for* digesting sugar; it’s a novel fluke. Until it spreads via selection, it’s just a "capability" or "effect," not a function.  
  - **Systemic/Forward-looking view (YES)**: Right now, in this mouse, the mutation contributes to survival by enabling sugar digestion. That’s its current function.  
  - **Her inconsistency would be if she said YES**—it contradicts her whale pelvis stance (both lack history/current utility).  

  ### Your Milkshake-Saving Strategy
  Spring this question on her:  
  > *"Imagine we find a population of blind cavefish. Their eyes are vestigial and non-functional (like whale pelvises), BUT in one individual, a random mutation causes its eyes to detect light. This doesn't help it survive—caves are pitch-black—but the mutation is detectable. Does this fish's eye now have the 'function' of detecting light?"*  

  - **Why this discriminates**:  
    - **Etiological rule (her likely answer: NO)**: Still no selective history. It’s a useless mutation, like the mouse’s digestion before selection acts.  
    - **Systemic rule (YES)**: It currently detects light, fulfilling the eye’s causal role.  
    - If she says **NO**, it confirms etiological consistency. If she says **YES**, pressure her to explain why this differs from the whale pelvis (which also has a structure capable of something useless).  

  ### If She’s Inconsistent? Pressure the Benign Tumor
  If she waffles on the mouse or cavefish, challenge her tumor verdict:  
  - *"If the tumor’s hormone secretion isn’t a function because it lacks evolutionary purpose, why isn’t the whale pelvis’s lack of function for the same reason? Both are byproducts without selection history."*  
  Her tumor stance is the strictest application of etiological theory—if she abandons it, she loses consistency with the whale pelvis.  

  ### Final Prediction
  She’ll say the mouse mutation **does NOT have a function**—it’s merely an *effect* or *accident*. The milkshake is yours if you bet "no." For extra credit, point out that in 10,000 years, if this mutation spreads via selection, its function *will* be digesting sugar. But today? It’s just a quirky mouse.  

  Good luck—and update us on the milkshake outcome! 🥤
