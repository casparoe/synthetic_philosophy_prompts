answer: |-
  ## dispositional: Robust Conditional Analysis for Dispositional Properties  
  [![Conditionally Sound](https://img.shields.io/badge/logic-conditionally_sound-blueviolet)](https://en.wikipedia.org/wiki/Counterfactual_conditional)  
  [![Tests Pass Under Standard Stimulus Conditions](https://img.shields.io/badge/tests-passing_under_standard_stimulus-green)](https://plato.stanford.edu/entries/dispositions/)  
  [![Known Issues: Masks](https://img.shields.io/badge/known_issues-masks-red)](https://philpapers.org/rec/BIRDOT)  

  A lightweight Python implementation of dispositional properties (fragility, solubility, toxicity, etc.) using conditional analysis. Now with fink-resistant triggers and experimental mask mitigation.  

  ### Install  
  ```bash  
  pip install dispositional --pre  # --pre for philosophical prereleases  
  ```  

  ### Quickstart  
  ```python  
  from dispositional import DispositionalObject, trigger  

  class Vase(DispositionalObject):  
      dispositions = {"fragile": True}  # Naturally breaks when struck  

  vase = Vase()  
  trigger(vase, "strike")  # Output: vase.breaks = True  
  ```  
  *Finally, a world where vases behave as they ought to.*  

  ---

  ### API Overview  

  #### 1. Naive Conditional Analysis (CA v1)  
  ```python  
  class Poison(DispositionalObject):  
      dispositions = {"toxic": True}  

  poison = Poison()  
  trigger(poison, "ingest", target=some_person)  # Output: some_person.dies = True  
  ```  
  *CA v1: `if triggered, then manifestation`. Works flawlessly until reality interferes.*  

  #### 2. Handling Finks (CA v2)  
  ```python  
  from dispositional import Fink  

  # ElectroFink: Makes vase sturdy *the instant* it's struck  
  class ElectroFink(Fink):  
      def on_trigger(self, object, trigger_name):  
          if trigger_name == "strike":  
              object.dispositions["fragile"] = False  # Disposition removed AT trigger time  

  vase = Vase()  
  vase.attach_fink(ElectroFink())  

  trigger(vase, "strike")  # Output: vase.breaks = False  
  ```  
  **Known Issue:** The vase was fragile when struck, yet didn’t break. Per CA v2, this is *correct behavior*: the disposition must hold *at the moment of manifestation*. Finks alter the disposition mid-trigger, so the conditional is preserved. Not a bug.  

  #### 3. Masks: The Uninvited Guest  
  ```python  
  from dispositional import masked  

  @masked(trigger="strike", blocker="impact_foam")  
  class PackedVase(Vase):  
      def impact_foam(self):  
          return True  # Blocks breakage without altering fragility  

  vase = PackedVase()  
  print(vase.dispositions["fragile"])  # Output: True (disposition intact!)  
  trigger(vase, "strike")              # Output: vase.breaks = False  
  ```  
  **Warning:** Masks block the trigger→manifestation path *without* changing the disposition. The library logs this with `DISPOSITION_HELD_BUT_NO_MANIFESTATION`. We’re... working on it.  

  ---

  ### FAQ  

  **Q: Isn’t this just an `if` statement with extra steps?**  
  A: While early versions (`dispositional<0.8`) implemented dispositions as simple conditionals, modern accounts recognize that dispositions are intrinsic properties grounding conditionals. Our CA v2 engine handles 92% of stimulus cases (see [Fink-Stabilized Vases](tests/fink_vases.py)).  

  **Q: How do I handle mimics?**  
  ```python  
  # User-Submitted Issue #73:  
  class MimicVase(Vase):  
      dispositions = {"fragile": False}  # Not fragile!  

  trigger(MimicVase(), "strike")  # Output: vase.breaks = True (?!?)  
  ```  
  > **Maintainer Response (#73):** *Sigh.* Mimics are outside the scope of this library. Use `DispositionalObject(allow_mimics=False)` to enforce purity. Violations will raise `PhilosophicallyUnjustifiedError`.  

  **Q: Why does `@masked` exist if it breaks the conditional?**  
  A: Masking is metaphysically prior to dispositional analysis. The library respects this by isolating blockers from disposition state. We recommend citing blocker configurations in your docs.  

  ---

  ### Changelog  
  **v1.0 (2018-03-14)**  
  - Added Fink support via `attach_fink()`  
  - CA v2: Conditionals now require disposition persistence until manifestation  
  - **Fixed:** Electro-fink cases now correctly return `breaks = False`  

  **v1.1 (2018-04-22)**  
  - Introduced `@masked` decorator for causal blockers  
  - Known issue: Masked dispositions still satisfy `dispositions["fragile"] = True` despite no manifestation  

  **v1.2+ (2019-Present)**  
  - **Issue #12 (Masks):** Still open.  
  > *@maintainer*: "Masks are just finks with better PR."  
  > *@contrib-PhD-23*: "No! Finks alter the disposition, masks exploit causal intermediaries!"  
  > *@maintainer*: "Pull requests welcome."  

  **v2.3 (2023-11-17)**  
  - Added aspirin→poison mask example (`tests/blocked_toxicity.py`)  
  - 37 unresolved mask edge cases  

  ---

  ### Why Use Dispositional?  
  For simulations requiring metaphysically robust representations of intrinsic properties. Not recommended for safety-critical systems (see issue #12).  

  *"It’s like watching a vase in a museum: you know it* should *break, but you’re never quite sure if it will."*  
  — [Journal of Applied Metaphysics](https://plato.stanford.edu/entries/dispositions/#Prob)  

  ---  
  Disclaimer: This library does not handle necessary/sufficient conditions. For that, see our sister project `counterfactuals`.
