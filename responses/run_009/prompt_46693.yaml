  We are facing the reference class problem: the choice of which past projects to compare to affects the estimate. The goal is to create a procedure that:
    1. Asks a series of questions to narrow down the reference class.
    2. Provides a defensible way to choose a reference class.
    3. Indicates when the data is insufficient and a judgment call is needed.
    4. Outputs an estimate (or range) and a confidence level.

  The procedure will be broken down into steps. At each step, we try to narrow the reference class by a factor that is expected to be relevant. We will use statistical methods (like bootstrapping or confidence intervals) to quantify uncertainty, and we will stop when the data becomes too thin.

  Key principles from statistics and philosophy:
    - We want a reference class that is both relevant (similar to the current project) and large enough for reliable statistics.
    - There is a trade-off: narrowing too much yields few data points, broadening too much loses relevance.
    - We can use a stepwise approach, starting with the most relevant factors and stopping when we have at least a minimum sample size (say 5-10) or when we run out of factors.

  Steps:

  1. **Initial Pool**: Start with all completed projects that are at least somewhat similar (e.g., in the same domain, like payments, if available). If the domain is too narrow, then start with all projects. Let the initial pool be P0.

  2. **Filter by Project Type**: 
     - Question: What is the project type? (e.g., new development, rewrite, migration, feature addition, CRUD app, etc.)
     - Defensible answer: The project type should be defined by the main activity. We have a taxonomy of project types from past projects. If the current project is a "rewrite", then we filter to past rewrites. If we have at least 5 projects in this filtered set (call it P1), proceed. Otherwise, we skip this step and keep the previous pool.

  3. **Filter by Domain**:
     - Question: What is the domain? (e.g., payments, user management, reporting, etc.)
     - Defensible answer: Use the same domain if available. If we have at least 5 projects in the domain (call it P2), then use P2. Otherwise, skip and keep the previous pool.

  4. **Filter by Team Lead** (if applicable):
     - Question: Who is the team lead? And do we have enough projects by that lead?
     - Defensible answer: If the lead has led at least 3 projects, then filter by lead (call it P3). Otherwise, skip.

  5. **Filter by Team Size**:
     - Question: What is the expected team size (headcount)?
     - Defensible answer: We group projects by team size (e.g., small: 1-3, medium: 4-7, large: 8+). We then filter by the same group. If we have at least 5 projects in the group, use it (call it P4). Otherwise, skip.

  6. **Filter by Technology**:
     - Question: What is the primary technology? (e.g., Java, .NET, etc.) and is it known to the team?
     - Defensible answer: If the project uses a technology that is either new or known, and we have a classification of past projects by technology familiarity (e.g., "known" if the team had at least 6 months experience at project start, "new" otherwise), then filter by that. But note: we might not have enough data. If we have at least 5 projects in the same category, use it (call it P5). Otherwise, skip.

  7. **Stopping Condition**: We stop when we have at least 5 projects in the current pool and we have run out of relevant factors, OR when we have considered all the factors and the pool is still too small (then we use the last pool with at least 5 projects, but with a note of caution). If we never had 5 projects, then we must rely on the broader pool and note the high uncertainty.

  8. **Estimation**: 
     - Compute the median and the interquartile range (IQR) of project durations in the final pool.
     - Also, compute the mean and standard deviation if the distribution is roughly symmetric, but median is robust to outliers.
     - We report the median as the point estimate and the IQR as the range.

  9. **Confidence in the Estimate**:
     - We compute a confidence interval for the median using bootstrapping (if possible, but for simplicity we can use the range of the middle 50% and note the sample size). Alternatively, we can use the formula for the confidence interval of the median: approximately ± 1.58 * (IQR) / sqrt(n) for a 95% interval? Actually, that's for the mean. For the median, we can use order statistics. But for practical purposes, we can note:
          Low confidence: n < 10
          Medium confidence: 10 <= n < 20
          High confidence: n >= 20
     - Also, the width of the IQR relative to the median: a large relative IQR indicates high variability.

  10. **When Data is Insufficient**: If at the end of the steps we have less than 5 projects in the pool, we must:
        - Use the median of the current pool but with a warning that the sample is small.
        - Consider using a broader pool (from a previous step) and note that the estimate is based on a less specific reference class.

  11. **Value Judgments**: Steps where we have to choose between factors (e.g., if we have to choose between filtering by lead or by team size because we don't have enough for both) are value judgments. We might prioritize factors that are believed to have the most impact (e.g., team lead might be more important than team size). We can have a pre-defined order of priority (e.g., project type > domain > team lead > team size > technology). But this order is a value judgment.

  The procedure:

  Step 0: Start with all projects (or if the domain is known, start with projects in the same domain). Let P = P0.

  Step 1: Filter by project type. Let P1 = projects in P of the same type. If |P1| >= 5, then set P = P1. Else, leave P unchanged.

  Step 2: Filter by domain (if we didn't start with domain). Let P2 = projects in P of the same domain. If |P2| >= 5, then set P = P2. Else, leave P unchanged.

  Step 3: Filter by team lead. Let P3 = projects in P led by the same lead. If |P3| >= 3 (a lower threshold because leads are important and we might have less data), then set P = P3. Else, leave P unchanged.

