  First, I need to unpack the core proposition: whether testimonial knowledge can ever be non-inferential and warrant-basic. The user's framing ("not exhausted by") is crucial - it avoids triviality by requiring testimony to contribute unique epistemic weight. I'll consider four key dimensions:

