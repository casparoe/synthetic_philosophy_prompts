  Full design based on this:

  Title: "Trait-Group Selection Simulation"

  Materials:
  - 16 students.
  - Strategy cards: 8 Cooperate (C) and 8 Defect (D) cards. Each student gets one and keeps it for the game.
  - Score sheets for each student (or use tokens).
  - Whiteboard to record group compositions and points.

  Setup:
  - Divide into 4 groups of 4 students each.
  - Assign strategies: each group has 2C and 2D (randomly within the group).

  Game rounds (3 generations, each with 3 within-group rounds and one between-group event):

  For each generation:
  1. Within-group rounds (3 rounds of the public goods game within their own group):
     - In each round, each student plays their strategy card (C or D) simultaneously.
     - Calculate payoffs:
          - If a player plays C, they contribute 2 points to the group pot at a cost of 1 to themselves.
          - If a player plays D, they contribute 0 points and have no cost.
     - The group pot = (sum of contributions) * 2.
     - Each player in the group gets an equal share of the group pot.
     - Individual score for the round = (share of the pot) - (cost if they played C) [or +0 if D].

     Example: in a group with 2C and 2D.
     - Contributions: 2 from each C -> 4.
     - Group pot = 4 * 2 = 8.
     - Share = 8/4 = 2.
     - C: 2 - 1 = 1 point.
     - D: 2 - 0 = 2 points.

     Each student records their point for the round.

     We do this for 3 rounds, and each student accumulates their points.

  2. Between-group event:
     - Calculate the average points per player for each group (across the 3 rounds).
     - Rank the groups from highest to lowest average.
     - The group with the highest average gets to "reproduce": they get to convert one player in the group with the lowest average to one of their own (in terms of strategy).
     - How: 
          - The highest group selects (randomly) one of their own strategies (say they randomly pick a student from their group and see their strategy).
          - The lowest group has one player (randomly selected) changed to that strategy. The changed player discards their old strategy card and takes a new one (C or D) to match the selected strategy from the high group.
     - If there is a tie for highest or lowest, break randomly.
     - Note: if the highest group has only one type, then they will spread that type. If mixed, then the type that is copied depends on which player is selected.

     - We then recompose the groups: the groups stay the same, but the strategy of one player in the lowest group has changed.

     - The changed player will play with the new strategy in the next generation.

  Then we start the next generation (within-group rounds) again.

  We do 3 generations.

  This way, the number of C and D changes over time.

   This design has within-group selection (defectors do better within a group) and between-group selection (groups with more cooperators may have higher averages and then spread their strategies to other groups).

  Moreover, at the end, we can do the two-ledger accounting.

  Now, to keep individuals motivated: we tell them that the goal is to accumulate as many points as possible for themselves. They are to try to be the highest scoring individual in the class. This will make defectors within a group do well, but they also have an incentive to have their group do well so that in the between-group event, their group is not the lowest and they might be spread.

   However, the between-group event does not directly give points to individuals, so individuals might not care. But we can say that the between-group event is part of the rules and will affect future rounds.

   Also, to avoid students not playing their card: we tell them they must play their card because it is their fixed strategy. They are role-playing.

   The two-ledger accounting at the end:

  1. Group-level ledger:
     - Show the history: in each generation, which groups had high averages and reproduced.
     - Emphasize that the group with more cooperators tended to have higher averages and therefore spread their composition to other groups.
     - Calculate the number of groups that were "cooperator-rich" over time.

  2. Gene's-eye view ledger:
     - Treat the strategies as alleles.
     - Track the frequency of C and D in the whole population over the generations.
     - Show that the gene for cooperation increased (or decreased) because of the between-group event.

   We will use the data from the game to fill in both ledgers.

   Example: 
     - Start: 8C, 8D.
     - After first between-group event: if a D in the lowest group was replaced by a C from the highest group, then now 9C, 7D.
     - etc.

   Then, we can argue that the same events can be described as:
     - Group-level: groups with more cooperators were more successful and therefore their group composition spread.
     - Gene's-eye: the cooperation allele increased in frequency because it was associated with groups that had higher productivity, and thus the allele was passed on more.

   What will go wrong:
     - Students might not take the strategy seriously and might want to change.
     - In the between-group event, the randomness in selecting which player to copy might not reflect the intended selection.
     - Students in the group that is about to lose a player to strategy change might object.

   How to handle:
     - Emphasize that they are role-playing their strategy.
     - For the between-group event, do the selection of which player in the high group and which in the low group randomly in front of everyone.

   What the game cannot reproduce:
     - In real evolution, genes don't choose. Here, the students are choosing to defect or cooperate? No, in this design, they have fixed strategies and are role-playing. They are not choosing their actions based on rational choice; they are simply playing their card. So that's fixed. The only choice is in the between-group event, but that's done by the rules.
     - The game does not have the within-group advantage of defectors as clearly as it could because we have only 3 rounds within a group before the between-group event. In reality, the within-group selection might happen faster.
     - The analogy is load-bearing in the between-group event: we are having a form of cultural transmission ( imitation of successful groups) rather than differential group reproduction. But it is a common proxy.

   Detailed Facilitator's Plan:

   Materials:
     - Index cards for strategies: 8 C and 8 D. On one side, it says "Cooperator" and on the other side, it says "Defector" (so students can see their own).
     - Score sheets for each student (or use a shared google sheet or whiteboard for scores).
     - Whiteboard to record group compositions and between-group events.

   Setup (5 minutes):
     - Move desks into 4 clusters for 4 groups.
     - Randomly assign students to groups.
     - Within each group, randomly distribute the strategy cards: 2 C and 2 D. Students keep their card secret? Or public? We can let them public within the group to enhance within-group tension. Or keep secret? I think public within the group is fine because in biology, the strategies might be observable. So allow them to reveal within the group if they want, or not. It doesn't matter for the payoff calculation.

   Rules explanation (10 minutes):
     - Explain the within-group round: 
          - Each round, every student simultaneously plays their strategy card.
          - The facilitator will then ask each group to report the number of C and D played.
          - Then, calculate the group pot = (2 * number of C) * 2  [because each C contributes 2, and then we multiply the whole pot by 2].
          - Actually, let's simplify: let the contribution per C be 2, so total contributions = 2 * (# of C).
          - Group pot = 2 * (total contributions) = 2 * (2 * (# of C)) = 4 * (# of C).
          - Share per player = group pot / 4 = (4 * # of C) / 4 = # of C.
          - Then, individual score for the round = share - cost.
               - If you played C, cost=1, so score = (# of C) - 1.
               - If you played D, cost=0, so score = (# of C).

     - So in a group with k cooperators, a cooperator gets k - 1, a defector gets k.

     - We will play 3 within-group rounds in each generation.

     - After 3 rounds, we average the scores of the players in each group to rank the groups.

     - Then, the group with the highest average gets to convert one player in the group with the lowest average to their own kind. How? 
          - The highest group randomly selects one of their own players (by drawing lots). That player's strategy is noted.
          - The lowest group randomly selects one of their own players. That player changes their strategy to match the selected player from the high group. They take a new strategy card of that type.

     - Then, we start the next generation (3 within-group rounds) with the new composition.

     - We do 3 generations.

     - Emphasize to students: their goal is to maximize their own total points. They are not to throw the game for the sake of the group. 

   Play (45 minutes):

     - Generation 1:
          - Round 1, 2, 3: within-group play. Facilitator circles to help with score calculation. After each round, record scores.
          - After round 3, in each group, compute the average score per player for the 3 rounds.
          - Write on the whiteboard the groups and their averages.
          - Identify the highest and lowest group.
          - Do the between-group event: 
               - Draw a student's name from the highest group. Note their strategy.
               - Draw a student's name from the lowest group. Change their strategy to match. Give them a new card.
          - Record the new composition of the lowest group and of the whole population (number of C and D).

     - Generation 2: 
          - Play another 3 within-group rounds.

     - Generation 3: similarly.

     - Total time: 3 gens * (3 rounds * 3 minutes per round + 5 minutes for between-event) = 3*(9 + 5) = 42 minutes.

   Debrief (20 minutes):

     - First, ask the students: what did you experience? Within your group, who did better? (Defectors should have done better within the group.)

     - Then, ask: did any group do particularly well? (Groups with more cooperators should have had higher average scores.)

     - Then, ask: over the generations, did the number of cooperators change? (Hopefully, it increased.)

     - Then, we do the two-ledger accounting on the whiteboard.

     - Group-level ledger:
          - In each generation, which group had the highest average? What was its composition? 
          - How many cooperators were in the population? Show that the between-group event (imitation) spread the cooperators from successful groups to less successful groups.
          - Thus, we can say that the group with more cooperators out-competed other groups by having a higher average, and thus their composition spread.

     - Gene's-eye view ledger:
          - Track the frequency of the cooperation allele (C) over time.
               - Gen0: 8/16 = 50%
               - Gen1: after one between-group event, it might be 9/16 = 56.25%
               - Gen2: ?
               - Gen3: ?
          - Then, calculate the change in frequency. We can also calculate the fitness of the C and D alleles. For example, in each generation, the fitness of C is the average score of C players in the whole population divided by the average score of the population (or something). But we can keep it simple: the allele frequency change.

     - Point out that the same events are described in two ways.

     - Address the averaging fallacy: 
          - Some student might say: "But within each group, defectors always do better than cooperators, so how can cooperators increase?"
          - We then show them the data: in the group-level ledger, the groups with more cooperators have a higher average, and that advantage can outweigh the within-group advantage of defectors if the between-group event is strong enough.

     - In the game, the between-group event (imitation) is how we operationalized group selection. In nature, it might be differential group reproduction or dissolution.

     - What the game cannot reproduce:
          - The game uses cultural imitation as a proxy for differential group reproduction. In biology, groups don't imitate each other; they reproduce or go extinct.
          - Also, in the gene's-eye view, the allele is not choosing. Here, the students are not evolving their strategy by differential reproduction of the alleles but by a rule that changes one allele in the population. This is not the same as natural selection at the individual level. So the analogy is load-bearing in that we are simulating the spread of a trait by a different mechanism.

     - Also, the within-group advantage of defectors is immediate and clear, but the between-group advantage is only realized in the between-group event. In nature, the between-group advantage might take many generations.

     - Therefore, the game shows the logic but not the exact mechanism.

     - Conclude by saying that the units of selection debate is about whether the group-level ledger or the gene's-eye ledger is more fundamental or explanatory, but both can be valid descriptions.

     - Ask: did the cooperators increase because of group selection or because of the gene's-eye view of selection on the allele? The point is that both are descriptions of the same process.

   What might go wrong the first time:
     - Time: might run over. Solution: keep a strict timer for each within-group round (2 minutes per round including calculation).
     - Calculation errors: have a cheat-sheet for the payoff calculation.
     - In the between-group event, if the highest group is not clear-cut. Solution: if very close, still choose one randomly or by a tie-breaker.
     - Students might not take the role-playing seriously and might want to change strategies. Solution: explain that this is a simulation and they are to follow their assigned strategy.
     - If the number of cooperators does not increase (if the between-group event is not strong enough or if the within-group advantage is too great), then the lesson might not be clear. To mitigate, we can start with more cooperators or adjust the payoff. But let it be. You can then discuss why it didn't increase.

     - If it doesn't increase, then in the debrief, you can discuss the conditions for group selection to work (high between-group variance, low within-group variance, etc.).

     - To increase the chance of cooperators increasing, we can start with more variance between groups. In the initial setup, we have each group 2C and 2D. We could start with different compositions? The prompt doesn't say, but we can. For example, have one group with 4C, one with 4D, and two with 2C2D. This will create more variance and likely show the group selection effect more clearly.

     - I recommend starting with: 
          - Group A: 4C
          - Group B: 4D
          - Group C: 2C, 2D
          - Group D: 2C, 2D

     - This will make Group A have high average (each C gets 4-1=3, so average 3), Group B have low average (each D gets 0, so average 0), and Groups C and D have average ( (1+2)/2 for C and D combined? In group C: two C and two D. 
          - C: gets (# of C) - 1 = 2 - 1 = 1.
          - D: gets (# of C) = 2.
          - Average = (1+1+2+2)/4 = 6/4 = 1.5.

     - So Group A: 3, Group B: 0, Group C and D: 1.5.
     - Then, Group A is highest, Group B is lowest.
     - In the between-group event, Group A will convert one player in Group B to C. So Group B becomes 1C and 3D.
     - In the next generation, Group A still has 4C (average: each C gets 4-1=3).
     - Group B: in a within-group round with 1C and 3D:
          - The one C: contributes, so total # of C =1. 
          - C gets 1 - 1 = 0.
          - D gets 1.
          - Average = (0+1+1+1)/4 = 3/4 = 0.75.
     - Group C and D unchanged: 1.5.
     - Then, the highest is Group A (3), lowest is Group B (0.75).
     - Again, convert one player in Group B to C (from Group A). Then Group B becomes 2C and 2D.
     - Now, in the third generation, Group B is 2C2D (average 1.5), and so on.
     - The number of C increases from 8 to 9 to 10.

     - This is more likely to show the increase.

   Therefore, in the setup, we will create groups with different compositions.

   Final setup: 
     - Group A: 4 C
     - Group B: 4 D
     - Group C: 2 C and 2 D
     - Group D: 2 C and 2 D

   This will give us the variance we need.

   The facilitator's plan is now complete.
answer: |-
  ### **Facilitator's Plan: "The Evolutionary Ledger Game"**  
  **Objective:** Simulate the tension between within-group and between-group selection, then demonstrate that the same events can be accounted for at both group and gene levels.  

  ---

  ### **Brainstormed Mechanics & Final Choice**  
  1. **Candidate 1: Resource-Harvesting Groups**  
     Players in groups harvest tokens; cooperators replenish shared resources at a personal cost, defectors over-harvest.  
     *Why discard?* Resource dynamics might overshadow core selection pressures.  

  2. **Candidate 2: Public Goods with Migration**  
     Players contribute points to a group pot (multiplied and shared), followed by migration between groups based on fitness.  
     *Why discard?* Migration blurs group boundaries, muddying the "units" debate.  

  3. **Candidate 3: Fixed-Strategy Group Reproduction (Chosen)**  
     Players are assigned fixed strategies (cooperator/defector) and grouped. Groups reproduce based on collective success.  
     *Why chosen?*  
     - Clear within-group conflict (defectors outscore cooperators).  
     - Group reproduction creates between-group variance.  
     - Fixed strategies enable gene’s-eye accounting.  

  ---

  ### **Game Design: "The Survival Ledger"**  
  **Materials**  
  - 16 strategy cards: 8 ♣️ (cooperator), 8 ♠️ (defector).  
  - Point tokens (or paper scorecards).  
  - Whiteboard with tables for group scores and strategy frequencies.  
  - 4 colored markers (for group tracking).  

  **Setup (10 min)**  
  - Move desks into 4 clusters (groups of 4).  
  - Assign each student a secret strategy card (♣️ or ♠️) and a group.  
    - *Initial distribution:* 2 ♣️ + 2 ♠️ per group.  
  - Explain rules:  
    > "Your goal is to maximize personal points. ♣️ pay a cost to help their group; ♠️ free-ride. Groups with high average points reproduce; low-scoring groups dissolve. Points determine your grade/bragging rights!"  

  **Rules**  
  1. **Contribution Phase (Per Round, 5 min):**  
     - Players simultaneously reveal strategy cards.  
     - **Payoffs:**  
       - ♣️ (cooperator): Pay 1 token, add 3 tokens to *group pot*.  
       - ♠️ (defector): Pay 0 tokens, add 0 to group pot.  
     - **Group pot distribution:** Pot is doubled, split equally among *all* group members.  
     - **Individual score** = Share of pot − cost paid.  
       *Example (2 ♣️ + 2 ♠️):*  
       - Pot = (2 ♣️ × 3) = 6 tokens → doubled to 12.  
       - Each member gets 12 ÷ 4 = 3 tokens.  
       - ♣️: 3 − 1 = **2 tokens**; ♠️: 3 − 0 = **3 tokens**.  

  2. **Reproduction Phase (5 min, after 2–3 contribution rounds):**  
     - Calculate average points per player in each group.  
     - **Top 2 groups:** Reproduce (split into two identical groups).  
     - **Bottom 2 groups:** Dissolve (players reassigned to new groups).  
     - *Reassignment:*  
       - New groups inherit compositions of reproducing groups (e.g., a group with 3 ♣️ + 1 ♠️ splits into two 3♣️+1♠️ groups).  
       - Players from dissolved groups fill new groups, preserving the inherited compositions.  
     - Update whiteboard: Track group sizes, compositions, and ♣️/♠️ frequencies.  

  **Rounds (55 min total)**  
  1. **Practice Round (5 min):** One contribution phase to clarify payoffs.  
  2. **Full Rounds (3–4 cycles, 15 min/cycle):**  
     - Contribution phase (5 min).  
     - Reproduction/reassignment (5 min).  
     - Update ledger on whiteboard (5 min).  
  3. **Total:** 3–4 reproduction events.  

  **Motivating Self-Interest**  
  - Emphasize: "Your grade depends on *personal points*—being a ♠️ may help you beat peers in your group."  
  - Award bonus points (e.g., top 4 individual scorers "win").  

  ---

  ### **Debrief (20 min)**  
  **Step 1: Tension of Pressures (10 min)**  
  - *Within-group selection:* Ask ♠️ and ♣️ from the same group to share scores.  
    > "♠️ *always outscored ♣️ in their group, right? Why?*"  
    → Highlight: ♠️ exploit ♣️’s contributions (within-group advantage).  
  - *Between-group selection:* Compare average scores of ♣️-rich vs. ♠️-rich groups.  
    > "Group A (3♣️+1♠️) averaged 4.2 points; Group D (1♣️+3♠️) averaged 1.5. Why?"  
    → Highlight: ♣️-rich groups generate bigger pots (between-group advantage).  
  - *Averaging fallacy:*  
    > "Someone might say: ‘♠️ always win within groups, so groups can’t matter.’ But look—did ♣️ increase overall? Why?"  
    → Use whiteboard data: Show ♣️ frequency rose because high-scoring groups (with more ♣️) reproduced more.  

  **Step 2: Dual Ledger Demo (10 min)**  
  *Use the same game data on the whiteboard.*  

  - **Group-Level Accounting:**  
    - *Headline:* "Groups with more cooperators out-reproduced others."  
    - *Data:*  
      | Generation | Group A (3♣️1♠️) | Group B (2♣️2♠️) | Outcome           |  
      |------------|-------------------|-------------------|-------------------|  
      | 1          | Avg: 4.2          | Avg: 2.5          | A reproduced      |  
      | 2          | Now 2 groups      | Dissolved         | B’s traits lost   |  

  - **Gene’s-Eye Accounting:**  
    - *Headline:* "Cooperator ‘alleles’ increased in frequency."  
    - *Data:*  
      | Generation | % ♣️ in population | Fitness (♣️ vs. ♠️) |  
      |------------|---------------------|-----------------------|  
      | 1          | 50% (8/16)          | ♣️=2.1, ♠️=3.3        |  
      | 2          | 62% (10/16)         | ♣️=3.0, ♠️=2.5        |  
    - *Calculation:*  
      - Fitness = Average ♣️ or ♠️ score per generation.  
      - ♣️ frequency rose despite lower *within-group* fitness because they were in *groups* with higher reproductive output.  

  - **Key Insight:**  
    > "Same events, two ledgers. Group selection explains via group reproduction; the gene’s eye explains via strategy frequency. The math is interchangeable—it’s about where we draw boundaries."  

  ---

  ### **Predictable Challenges & Mitigations**  
  1. **Problem:** Students "cheat" by swapping strategies to "help" cooperators.  
     - *Fix:* Restate: "You are a gene—you don’t choose your strategy. Play your card as assigned."  

  2. **Problem:** Reassignment confusion (e.g., miscounting ♣️/♠️ during group splits).  
     - *Fix:* Use tokens to represent strategies during reassignment; appoint a "strategy auditor."  

  3. **Problem:** Dominant defectors cause cooperation to collapse.  
     - *Fix:* Start with a ♣️-rich group (e.g., 3♣️1♠️) to ensure between-group variance. Adjust payoffs in later runs if needed (e.g., increase pot multiplier).  

  ---

  ### **What the Game Cannot Simulate (Verbal Clarification)**  
  - **Genes Don’t Choose:**  
    > "In this game, you *held* a strategy card like a gene. But in nature, genes don’t ‘choose’—mutations and drift create variation. We’re simplifying to show how selection *acts* on variation."  

  - **Limits of the Analogy:**  
    > "The dual-ledger rescoring shows *mathematical equivalence* in this model. In reality, group selection requires specific conditions (high between-group variance, low migration). The debate is whether this accounting works for all cases—or if genes are the only ‘true’ unit."  

  ---

  ### **Theoretical Notes**  
  - **Within-group selection:** Favors traits advantageous to individuals (♠️’s short-term gain).  
  - **Between-group selection:** Favors traits benefiting group survival (♣️’s group productivity).  
  - **Price equation:** Implicit in the rescoring (Δstrategy frequency = variance between groups + selection within groups).  

  ---

  **Final Prep Checklist**  
  - [ ] Print ♣️/♠️ cards (8 each).  
  - [ ] Prepare tokens/scorecards.  
  - [ ] Whiteboard tables: Group scores + strategy frequencies.  
  - [ ] Assign initial groups (2♣️+2♠️ per group).  
  - [ ] Script key debrief points.  

  This design forces students into the "averaging fallacy" trap, then uses their own data to resolve it—making the units debate visceral before it’s theoretical. Run tight rounds, and the ledger demo will stick.
