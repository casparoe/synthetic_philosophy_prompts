  For the envoi, circling back to the first line ("First, the choosing:") but now framing it as "fixed" rather than active choice will show how arbitrariness fades. The last stanza should demonstrate stability—maybe drivers no longer questioning why they drive on that side, just like the repeating words feel inevitable by the poem's end. 

  Worrying slightly about making the reciprocity explicit without being didactic. Maybe stanza two's "each expects the other's wheel to turn" and stanza four's "knowing others know the same" can convey mutual expectations organically. 

