answer: |-
  Here is a sestina enacting Lewis's theory of convention through the arbitrary yet binding power of its repeating end-words, set in the context of driving rules:

  **Sestina: The Rule of the Road**

  First, the choosing: no reason, no design,
  Just hazard’s whisper, pointing **left** or **right**.
  No sign decreed it, no committee’s vote,
  Just someone steered their **wheel** toward the verge,
  And others, seeing, copied the **same** way,
  Avoiding the **other**, chaos held at bay.

  Then came the **other**, mirroring the choice,
  Veering instinctively away from **left**,
  Finding the clear path always to the **right**.
  Their own **wheel** turned by habit, not by force,
  A silent pact to keep the **same** sure track,
  This shared **road** held them steady, front and back.

  Each trusts the surface of the stretching **road**,
  Predicts the motion of the **other** car,
  Assumes the driver knows the **same** as they.
  No need for flags to signal “Keep to **left**!”
  Or guards to shout which way to turn the **wheel**.
  It works because we all agree: the **right**.

  It wasn’t always settled on the **right**.
  Recall the jolts that jarred the nascent **road**,
  The near collisions when one spun the **wheel**
  Too late, misjudging where the **other** stood.
  Now, smooth as stone, the custom flows **left**
  Unquestioned, binding – everyone the **same**.

  And what preserves this order? Just the **same**
  Reciprocal belief. I choose the **right**
  Because I know you’ll choose the **right**, not **left**.
  You trust my trust extends down every **road**.
  We both rely upon the **other**’s trust,
  No contract binds the turning of the **wheel**.

  It needs no king to mandate how the **wheel**
  Should point. The expectation’s just the **same**
  For you, for him, for her, for every **other**.
  Conformity feels easy, feels just **right**,
  The friction gone along the humming **road**.
  The cost of breaking? Choosing now the **left**!

  (Imagine chaos if one chose the **left**!
  The sudden wrench required of every **wheel**,
  The shattering of trust along the **road**,
  The urgent need to somehow be the **same**
  Again. Too costly! Better stick to **right**,
  Avoiding the bewildered **other**’s stare.)

  **Envoy:**

  So fixed, the **wheel** obeys the unseen **right**.
  No **other** way seems possible on this **road**.
  The **same** as always. Who recalls the **left**?

  ---

  **How it enacts Lewis's theory:**

  1.  **Arbitrariness:** The end-words (`left`, `right`, `wheel`, `same`, `other`, `road`) are thematically relevant but fundamentally arbitrary choices for the form. No inherent reason links *these specific words* to the sestina structure or the driving convention – they could be six others.
  2.  **Coordination Problem:** The poem explicitly sets up the problem: drivers need to avoid collisions ("chaos held at bay"). They need a coordinated solution – choosing one side.
  3.  **Repetition & Common Knowledge:** The sestina form *forces* the repetition of the end-words in a fixed, rotating pattern. This mirrors the repetition of the driving behavior. Lines like "each expects the other's wheel to turn," "everyone the same," and "I know you’ll choose the right... You trust my trust" explicitly build the layers of reciprocal expectation ("I expect you to conform, you expect me to conform, I expect you to expect me to conform...") that constitute common knowledge.
  4.  **Preference for Conformity:** Stanza 5 ("It needs no king...") and the hypothetical in Stanza 6 ("Imagine chaos...") clearly state the preference: conforming is easy and beneficial ("feels just right"), deviating is costly and disruptive ("Too costly!"). Conformity is conditional on others conforming.
  5.  **Stability without Enforcement:** The poem argues this directly: "No sign decreed it," "no committee’s vote," "No contract binds," "needs no king." Stability arises solely from the web of reciprocal expectations and the self-interest in avoiding the coordination failure.
  6.  **Arbitrariness Fades (Envoi):** The envoi explicitly states the convention is now "fixed," "unseen," and the only way "possible." The question "Who recalls the left?" highlights how the initial arbitrariness and choice have vanished from active awareness; the convention feels natural and necessary.
  7.  **Formal Lock-In (Bonus):** By the final stanza and envoi, the end-words appear in their prescribed positions with a sense of inevitability. Changing them *now* would disrupt the established pattern of the poem, just as deviating from the driving convention disrupts traffic flow. Their stability within the poem's structure mirrors the stability of the convention – it's maintained simply by adherence to the established pattern, reinforced by the expectation of that adherence.

  The poem uses the driving scenario as a clear instance of a coordination problem solved by convention, but the language and the form itself serve as the primary enactment of Lewis's abstract concepts. The reader experiences the "binding by repetition" through the relentless return of the end-words.
