  Below is a decision tree designed to help students identify their position on aggregation in moral dilemmas. Each question uses concrete, self-contained cases to avoid theoretical jargon, forcing students to confront intuitions before labels. Positions are separated at points where major theories genuinely diverge. The tree fits on one page and includes all requested positions, with notes on overlaps.

  ---

  ### **Moral Aggregation Decision Tree**  
  *Answer each question based on your intuition. Follow the arrows to your position.*

  **1. Five vs. One (Lifeboat):**  
  You can save one stranger from death, or save five strangers from death (same cause, no special relationships). You *cannot* save all.  
  → **Save the five without a lottery** ➔ Go to 2  
  → **Flip a coin (giving each group a 50% chance)** ➔ Go to 3  

  ---

  **2. Headaches vs. Death:**  
  You can prevent one person from dying *or* prevent one billion people from each suffering a mild, temporary headache (harmless, forgettable). You *cannot* do both.  
  → **Prevent the one death** ➔ Go to 4  
  → **Prevent the billion headaches** ➔ Go to 5  

  ---

  **3. Life vs. Candy:**  
  You can save one stranger from death, or give a piece of candy to each of five strangers (who will die regardless).  
  → **Save the one** ➔ **Taurek’s View**  
  *Numbers never matter. Claims don’t "add up." Fairness requires equal concern (e.g., lotteries), not counting lives.*  
  → **Give candy to the five** ➔ **Unnamed Position**  
  *No major defender. Inconsistent? You aggregate trivial benefits but not lives—why?*  

  ---

  **4. World Cup Broadcast:**  
  As a broadcast engineer, you can:  
  - Fix the main transmitter, letting 100 million people watch the World Cup final.  
  - Fix a single TV, letting one sick child (who loves soccer) watch the final.  
  You *cannot* do both.  
  → **Fix the main transmitter** ➔ **Scanlon-Style Contractualism**  
  *Aggregation allowed for comparable claims (e.g., watching the game), but only if no individual can reasonably reject the principle. Numbers matter, but weak claims (e.g., headaches) don’t override strong ones.*  
  → **Fix the child’s TV** ➔ **"Life-Only Aggregation" (Limited Aggregation Representative)**  
  *Aggregation only applies to identical, high-stakes claims (like lives). Tied goods (e.g., broadcasts) can’t be summed across people. Defended by some as a middle ground.*  

  ---

  **5. Life Extension vs. Cure:**  
  A single dose of medicine can:  
  - Give Patient A (very ill, in constant pain) 1 extra month of life.  
  - Cure Patient B (mildly ill) of a non-fatal condition, giving them 40 healthy years.  
  You *cannot* help both.  
  → **Help Patient A (worse off)** ➔ **Prioritarianism or Egalitarianism**  
  - *Prioritarianism*: Weight benefits to the worse off more heavily. Patient A’s greater need outweighs total benefit.  
  - *Egalitarianism*: Reduce inequality; Patient A is much worse off. (Note: Often overlaps with prioritarianism in practice.)  
  → **Help Patient B (greater total benefit)** ➔ **Utilitarianism**  
  *Always sum well-being. More total good (40 years >> 1 month), even if unequal. Diminishing marginal utility may apply, but outcome trumps distribution.*  

  ---

  ### **Key Overlaps & Distinctions**  
  - **Utilitarianism vs. Prioritarianism**: Often agree (e.g., both save the five in Q1), but diverge when helping the worse off reduces total well-being (Q5). Utilitarianism focuses on *sum*, prioritarianism on *priority to the worst off*.  
  - **Taurek vs. Contractualism**: Both may use lotteries in small-number cases (e.g., 1 vs. 2), but Taurek rejects aggregation entirely, while Scanlon allows it for comparable claims (e.g., 100 vs. 1 in Q4).  
  - **"Life-Only Aggregation" vs. Scanlon**: Both limit aggregation, but Scanlon aggregates tied goods (Q4), while Life-Only does not.  
  - **Egalitarianism**: Hard to distinguish from prioritarianism here (both pick Patient A in Q5). Egalitarians focus on *relative status*; prioritarians on *absolute need*.  

  ### **Hardest Branch to Answer Honestly**  
  **Question 2 (Headaches vs. Death)**. Why?  
  - Intuition screams "save a life!" but the scale of suffering (a billion headaches) nags at utilitarian leanings.  
  - Forces confrontation: Can *any* number of trivial harms override a mortal harm? If no, where’s the line?  
  - *Discussion starter: "If you chose ‘prevent death’ here but saved the five in Q1, what makes lives summable to you *only* when stakes are identical?"*  

  ---

  This tree isolates core disagreements: when numbers matter (Q1), how claim-strength interacts with numbers (Q2), and whether goods must be tied to individuals (Q4). By starting with extreme cases, it circumvents slogans and reveals fault lines. Students can complete it pre-class using only their intuitions, then revisit their answers after reading.
