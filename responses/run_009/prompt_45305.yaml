  - Patient B: Less sick, will gain many years of life.
  The drug works equally well for both. What do you do?
  - **Treat Patient A** → **Prioritarianism or Egalitarianism**: You give priority to the worse off. (Note: Prioritarianism weights benefits to the worse off more heavily; egalitarianism focuses on reducing inequality. They often agree in cases like this.)
  - **Treat Patient B** → **Utilitarianism**: Always maximize total well-being, regardless of distribution.

  **Note on Overlaps and Distinctions**:
  - **Prioritarianism vs. Utilitarianism**: They differ when benefits to the worse off matter more than total benefit. In Question 5, utilitarianism chooses B; prioritarianism chooses A.
  - **Taurek vs. Contractualism**: Both might use lotteries in some cases, but Taurek never aggregates, while contractualism does when claims are comparable and numbers large.
  - **The Hardest Question**: Question 2 (Headaches vs. Death) is often the toughest. If you prevent the death, you reject full aggregation, but if you prevent the headaches, you accept that any harm can be outweighed by enough small benefits. Be honest about your intuition!

  This tree simplifies a complex debate. In class, we will discuss why positions hold what they do and where the tree might not capture nuances.
