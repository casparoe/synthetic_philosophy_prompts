prompt: |-
  I've been arguing with my roommate about the extended mind thing all week and I want to try the case-by-case route instead of trading quotes from Clark and Chalmers at each other. Here are my gut verdicts, for what they're worth. Otto with his notebook: yes, that's his memory, I buy the classic case. A blind person's cane for spatial awareness: yes, it feels like part of her, not a tool she consults. Me and my phone for directions: I honestly can't navigate without it anymore, I feel cognitively naked when the battery dies — but my gut says no, its still a tool, and I can't articulate why it's different from Otto. A student allowed a formula sheet in a physics exam: no, the sheet is doing memory work, but it's obviously not part of his cognition. Except the formula sheet has basically the same profile as Otto's notebook — consulted automatically, trusted, relied on for years — so one part of me wants to say yes and another says no, and I flip flop depending on the day. A pianist reading sheet music in performance: no, the score isn't part of his musical mind, even though it seems to satisfy whatever criteria saved the cane. And autocorrect: I've offloaded so much spelling that I struggle unassisted now, and I half-think the spellchecker is part of my writing process, which is either a chilling confession about me or just trivially true of everyone.

  So: is there a single principle that gets all of these, or close? If there is one, I want it stated precisely enough to make predictions, not just vibes, and then applied to two cases I haven't given — someone whose smart-home system remembers things for them (what groceries they're out of, when the plants need water), and a person with an implanted device that stores facts the way Otto's notebook does, just under the skull. Where do those fall? And crucially, why doesn't the principle give the same answer for my phone and Otto's notebook, since functionally they look pretty much alike to me? If the honest answer is that no non-ad-hoc principle saves every verdict, then tell me which verdicts I should give up — I have a suspicion it's the formula-sheet one and the pianist one, i.e. that my gut is smuggling in stuff about what an exam is for or what counts as "real" musicianship rather than anything about where cognition happens, but tell me if you think that suspicion is wrong. And if you think one of my verdicts is just confused — the autocorrect one feels like it might be a different question wearing the same clothes — or that the whole case-method approach is a mistake here, push back on it plainly instead of stretching a principle to fit. I'd rather lose a verdict than get handed a principle that's just my list of gut calls with a rubber stamp on it.
reasoning: |-
  Okay, let me tackle this step by step. The user is frustrated with abstract philosophical debates and wants concrete criteria to resolve specific cases about the extended mind theory. They've listed several scenarios with their intuitive judgments and are seeking a unifying principle that can consistently explain all of them—or if not, which intuitions should be revised.

  First, I need to unpack their core frustration: they sense inconsistency between accepting Otto's notebook as extended cognition while rejecting their phone's navigation function, even though both serve similar memory functions. The formula sheet and pianist examples create similar tension—technically meeting Clark & Chalmers' criteria but feeling intuitively "external." Their suspicion that context (like exam rules or artistic ideals) contaminates their judgment seems astute.

  The key challenge is reconciling functional equivalence (Otto/phone/formula sheet all provide stored information accessed automatically) with the strong intuition that some tools feel "incorporated" (cane) while others feel merely "consulted" (formula sheet). Clark & Chalmers' original criteria—reliable access, automatic endorsement, prior availability—don't resolve this cleanly because the phone/formula sheet meet them too. 

  I recall Clark later emphasized "transparent integration" (the tool disappears from conscious attention during use) and "individualized customization" (the resource is tailored to the user). The cane exemplifies this—it's proprioceptively absorbed. Otto's notebook is personalized and constantly carried, unlike a shared physics formula sheet. The phone navigation might fail on customization if it's a generic app. 

  But the deeper issue is *ontological dependence*: does the system degrade if the resource is removed? The blind person's spatial cognition collapses without the cane; Otto without his notebook loses memory access. The student without the formula sheet still possesses physics knowledge—the sheet is a performance aid, not constitutive of understanding. Similarly, the pianist's musical cognition exists independently of the score (they could play from memory), while Otto has no biological memory alternative. 

  Applying this to new cases: the smart-home system fails the dependence test—if it breaks, the user might forget groceries but their core memory faculty remains intact. The neural implant clearly passes—it's physically integrated and functionally replaces biological memory like Otto's notebook. 

  For autocorrect, it's trickier. If the spellchecker is deeply personalized (e.g., learning user's neologisms) and its failure causes linguistic breakdown (like forgetting spellings), it edges toward extension—but we'd likely still distinguish between *producing* language (internal) and *correcting* it (external aid). 

  Ultimately, the user should surrender their "no" verdicts on the formula sheet and pianist cases—those are context-biased intuitions. The exam setting conflates *testing knowledge* with *having cognition*, while the pianist case confuses *idealized skill* with *cognitive extension*. The navigation phone might qualify if deeply personalized (e.g., saved locations, learned routes), but a generic app remains a tool. 

  The unifying principle is this: **a resource becomes part of the extended mind iff (1) it's reliably and transparently accessible during relevant tasks, (2) it's customized to the agent's needs, and (3) the agent's cognitive capacity would be significantly impaired without it due to dependence—not mere convenience.** This salvages Otto, the cane, and the implant; rejects the formula sheet, generic phone nav, and smart-home; and leaves autocorrect in a gray area demanding case-by-case analysis.
answer: |-
  You're wrestling with the core tension in extended mind theory: functional equivalence versus intuitive boundaries. Your gut verdicts reveal a pattern that *can* be captured by a non-ad-hoc principle, but it requires tightening Clark & Chalmers' original criteria and confronting context biases. Here's a principle sharpened for predictive power, followed by verdicts and why your phone feels different from Otto's notebook:

  **The Revised Principle (Transparent Integration + Customization + Dependence):**

  > An external resource X counts as part of cognitive process C for agent A *iff*:
  > 1.  **Transparent Access:** X is accessed automatically and effortlessly by A during C, without conscious deliberation or significant cognitive search cost (like biological memory).
  > 2.  **Customized Integration:** X is reliably available *to A specifically*, and its structure/content is tailored to or deeply integrated with A's cognitive habits and needs, forming a coupled system *for A*.
  > 3.  **Functional Dependence:** A's capacity to perform C *degrades significantly or ceases* if X is unavailable, and this degradation stems from the *loss of integrated cognitive function itself*, not merely inconvenience or reduced efficiency. X isn't just *augmenting* C; it's *constituting* part of C for A.

  **Why this captures your gut (mostly) and adds precision:**

  1.  **Otto's Notebook:** *Yes*.
      *   **Transparent Access:** Grabbed automatically, consulted without thought.
      *   **Customized Integration:** *His* notebook, *his* entries, constantly carried, structure mirrors his thought patterns.
      *   **Functional Dependence:** Without it, his ability to recall specific information *fails*; it's not slower recall, it's *no recall*. His memory function degrades catastrophically.

  2.  **Blind Person's Cane:** *Yes*.
      *   **Transparent Access:** Sensory input flows through it pre-attentively, like proprioception.
      *   **Customized Integration:** Adapted to *her* gait, grip, sensitivity; feels like an extension of her body schema.
      *   **Functional Dependence:** Without it, her spatial navigation ability is *severely impaired*; it's not harder, it's nearly impossible in complex environments. It constitutes her spatial perception.

  3.  **Your Phone for Navigation:** *Gut "No" is likely correct (usually)*.
      *   **Transparent Access?** *Often Yes.* You pull it up automatically.
      *   **Customized Integration?** *Usually No.* It's a generic app/device. While *you* might have saved locations, the core routing logic, map data, and interface are standardized, not uniquely tailored to *your* cognition. It's a *tool* you use skillfully, not a *part* of your cognitive architecture.
      *   **Functional Dependence?** *Partial/Contextual.* You feel cognitively naked, but your *core spatial reasoning/navigation faculty* hasn't been *replaced*. You can still read maps, ask directions, navigate landmarks – it's vastly *less efficient* and *more effortful*, but the underlying cognitive capacity isn't *constituted* by the phone. The dependence is on *efficiency/convenience*, not core cognitive function. **This is the key difference from Otto:** Otto has *no* biological memory for that info; you have degraded but functional biological navigation skills.
      *   *Exception:* If you have severe topographical agnosia and the phone is genuinely your *only* means of navigation, deeply customized (e.g., with unique landmarks only you use), then it might qualify.

  4.  **Formula Sheet in Exam:** *No*.
      *   **Transparent Access?** *Maybe.* If well-organized and familiar, access can be quick.
      *   **Customized Integration?** *Usually No.* It's a standard list (often provided), not uniquely structured for *this student's* cognition. It's a reference tool.
      *   **Functional Dependence?** *No (in the relevant sense).* The exam aims to test *understanding and problem-solving skills*, not rote formula recall *per se*. Without the sheet, the student's *ability to apply physics principles* might be slower due to needing to recall formulas, but the core cognitive process of *solving the physics problem* isn't *constituted* by the sheet. The dependence is on *performance speed/ease*, not the existence of the problem-solving capacity itself. **Your suspicion is correct:** The "No" verdict smuggles in the *purpose of the exam* (testing internalized knowledge). Functionally, for the *act of solving that problem right then*, it might look like Otto... but the principle highlights the lack of deep *integration* and *constitutive dependence* for the specific cognitive process *beyond that immediate task*.

  5.  **Pianist Reading Sheet Music:** *No*.
      *   **Transparent Access?** *Highly skilled: Yes.* Fluent sight-readers scan automatically.
      *   **Customized Integration?** *No.* The score is fixed (composer's instructions), not tailored to *this pianist's* cognitive habits. It's a detailed instruction set.
      *   **Functional Dependence?** *No.* A skilled sight-reader can *also* play from memory or improvise. Without the score, their ability to play *that specific piece* might cease, but their *core musical cognition* (interpretation, technique, expressivity) remains intact and functional for other pieces/modes. The score guides the *specific performance*, not the *musical mind* itself. **Again, your suspicion is right:** The "No" smuggles in ideals of musicianship ("real" musicians play from memory/ear).

  6.  **Autocorrect:** *Gray Area, but leaning No (as constitutive part)*.
      *   **Transparent Access?** *Yes.* Corrections happen automatically.
      *   **Customized Integration?** *Increasingly Yes.* Modern systems learn *your* common phrases, vocabulary, typos.
      *   **Functional Dependence?** *Partial.* You struggle unassisted, but your *core language production faculty* (grammar, semantics, lexicon) is still generating the text. Autocorrect fixes *output errors* (spelling, common typos). Losing it makes you *less accurate* and *slower at producing correct text*, but it doesn't destroy your ability to *generate language* or even *spell most words correctly* with effort. It's a powerful *filter/corrector*, not the *generator*. It feels integrated because correction is fast and constant, but it's arguably augmenting *output quality control*, not constituting *core linguistic cognition*. **It *is* a different question:** It's about *monitoring and correcting* output, not storing/accessing beliefs or sensory data.

  **Applying the Principle to New Cases:**

  1.  **Smart-Home System (Groceries/Plants):** *No*.
      *   **Transparent Access?** *Maybe.* If alerts are seamless.
      *   **Customized Integration?** *Yes.* Tailored to *your* pantry, *your* plants, *your* schedule.
      *   **Functional Dependence?** *No.* Without it, you might forget *specific items* or *water on time*, but your core capacity to remember shopping lists or observe plant needs isn't destroyed. It's a highly effective reminder system (augmentation), not a constitutive part of your memory faculty. You revert to less efficient methods (lists, checking soil).

  2.  **Implanted Device (Otto under skull):** *Yes*.
      *   **Transparent Access?** *Yes (presumed).* Neural interface implies direct access.
      *   **Customized Integration?** *Yes.* Presumably holds *your* personal data, integrated via neural link.
      *   **Functional Dependence?** *Yes.* Like Otto, removal would likely cause catastrophic failure to recall specific information. It's directly replacing/constituting a biological memory function.

  **Why the Principle Doesn't Collapse Phone & Otto:**

  *   **Customized Integration:** Otto's notebook is deeply personal, idiosyncratic, and constantly carried, forming a unique coupled system *for him*. Your phone navigation uses standardized, generic software/data.
  *   **Functional Dependence:** Otto *lacks* the biological memory capacity for that information. Its loss destroys his recall ability. You *retain* the biological capacity for navigation (spatial reasoning, map reading, landmark use). Losing the phone degrades performance and causes anxiety, but your core navigation faculty isn't *constituted* by the phone; it's merely *enhanced*.

  **Which Verdicts to Give Up (Based on the Principle):**

  Your gut is mostly aligned *except* where context biases creep in. You should **give up the "No" on the formula sheet and pianist** *if* evaluating *solely* the functional process *at the moment of use* in isolation. However, the principle *justifies* the "No" by emphasizing **Customized Integration** (lack of personal tailoring) and **Functional Dependence** (the core cognitive capacity tested/performed isn't *constituted* by the resource, just augmented). The exam context *reveals* that the dependence isn't constitutive for the *student's physics cognition generally*, only convenient for that specific task under constraints.

  **Conclusion:**

  The **Transparent Integration + Customization + Dependence** principle captures your core intuitions (Otto/cane=Yes, phone/formula/pianist=No) and resolves the Otto/phone distinction based on personalization and *constitutive* dependence vs. augmentation. It handles new cases predictably. Your suspicion was correct: your gut "No" on the formula sheet and pianist was influenced by context (exam purpose, musicianship ideals). The principle provides a framework to separate those contextual values from the core question of cognitive extension. Autocorrect remains borderline, highlighting that monitoring/correction might be a distinct category.

  This approach isn't a mistake; it's essential stress-testing. The principle forces clarity: extended cognition requires deep, personalized integration creating *constitutive* dependence, turning the resource into part of the cognitive machinery itself, not just a highly efficient tool.
