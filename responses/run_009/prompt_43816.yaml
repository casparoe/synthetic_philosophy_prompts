prompt: |-
  You are a behavioural decision theorist with a solid grounding in expected utility theory and the arguments for and against its independence axiom, and I'd like you to reason carefully and systematically here rather than jumping to an answer. My sister, who is a veterinary nurse with no training in economics or statistics, took part in a decision-making study at her university. The smaller choices were paid out for real; the very large ones were framed as serious hypotheticals, which she tells me she answered as if the money were real. She was re-tested eight weeks later with the same pattern of answers, and she passed the experimenters' comprehension checks on the probabilities, so I'm confident these are stable preferences rather than noise. Her record, in the order she faced them:

  - £1,000,000 for certain, versus a ticket paying £5,000,000 with probability 10%, £1,000,000 with probability 89%, and nothing with probability 1%: she took the certain million.
  - A ticket paying £1,000,000 with probability 11% and nothing otherwise, versus a ticket paying £5,000,000 with probability 10% and nothing otherwise: she took the 10% shot at the £5,000,000.
  - £3,000 for certain versus an 80% shot at £4,000, nothing otherwise: she took the certain £3,000.
  - A 25% shot at £3,000 versus a 20% shot at £4,000, nothing otherwise in each case: she took the 20% shot at £4,000.
  - £10,000 for certain versus a 95% shot at £12,000, nothing otherwise: she took the gamble.
  - Between two non-certain options she seems roughly to track expected value — for instance she took a 70% shot at £2,000 over a 90% shot at £1,400.

  Someone has told me the first pair is the famous Allais pair and that the first four choices together violate the independence axiom, and I gather the standard explanations run along the lines of a probability-weighting story of the prospect-theory kind, a regret story, a disappointment story, and various cruder heuristics. I'm less interested in the label, though, than in her. The experimenters are running a follow-up next month, she's asked me what she'll probably choose, and the new cases are these:

  (a) the same first choice as before, except the draw will be conducted privately, she will never be told what the unchosen ticket would have paid, and any payment arrives years later through a solicitor — so there is no moment at which she will ever see the two outcomes side by side;
  (b) the first choice again, except that the certain option is replaced by a ticket paying £1,000,000 with probability 99.9% and nothing with probability 0.1%, the 10%/89%/1% ticket being unchanged;
  (c) a penalty version: a certain loss of £3,000 versus an 80% chance of losing £4,000 and a 20% chance of losing nothing.

  Please predict her choice in each of the three, but I care more about the rule she seems to be running than about the three answers themselves. Set out the candidate rules that fit her record equally well, including any simple rules of thumb; say what each rule predicts for (a), (b) and (c); give your best guess for each case with your reasons for preferring the rule behind it; and tell me which single further case, of your own invention, would do the most to tell the surviving rules apart. Don't just tell me what most people do — tell me what she will do, and start by laying her record against each candidate rule before committing to anything.
