  We are building a quiz to sort participants by their views on machine translation (MT) without using labels in the questions. The key distinctions are:

  1. **Understanding: All-or-nothing vs. graded.**
  2. **Scope: Current systems vs. in principle (i.e., could a statistical system ever understand?).**
  3. **Grounding: Requires causal connection to perception/action vs. meaning from linguistic community (use).**
  4. **Evidence: Is good translation evidence of understanding? Or just behavior?**

  We want to create 10 concrete translation cases. Each case will have 2-3 answer options. Then we map patterns of answers to positions. The positions we want to cover:

  - **Searle-like skeptic**: Understanding is all-or-nothing and requires causal grounding. Current systems (and any purely statistical system) don't understand because they lack grounding. Good translation is just behavior.
  - **Hofstadterian**: Fluent output is possible without true understanding (which requires deep analogy-making). Understanding is more than just statistical patterns. Likely sees understanding as requiring something beyond current systems, but might not rule out future systems that do have deep analogy.
  - **Graded functionalist**: Understanding comes in degrees. Good translation (if done well) is evidence of some degree of understanding. Might be open to statistical systems having some understanding if they perform well.
  - **Meaning-as-use defender**: Meaning comes from use in a linguistic community. Distributional methods (like current MT) capture meaning because they capture use. So they do have understanding (at least to some degree). Might align with graded functionalism but with a specific theory of meaning.

  We note that Searle and Hofstadter might often agree on cases (both skeptical about current systems) but for different reasons.

  We need cases that force these positions apart. Proposed cases:

  1. **Pun**: A sentence with a pun that has two meanings that cannot both be preserved in the target language. How should the system handle it?
     - Option A: Choose one meaning arbitrarily and translate literally.
     - Option B: Attempt to find a pun in the target language that captures one of the meanings (even if not both).
     - Option C: Translate literally and add a footnote explaining the pun.

     *Rationale*: A system that "understands" might be expected to recognize the pun and try to preserve it. A shallow system might just pick one meaning arbitrarily. The meaning-as-use defender might think that if the system has seen enough puns, it might try to mimic the pattern. The skeptic would say the system doesn't know it's a pun.

  2. **Novel metaphor**: A sentence with a novel metaphor, e.g., "The internet is a haunted house." Never in the training corpus. How does the system translate?
     - Option A: Translate literally, preserving the metaphor.
     - Option B: Substitute a conventional metaphor in the target language that conveys a similar meaning.
     - Option C: Translate without the metaphor, conveying the intended meaning in a literal way.

     *Rationale*: A system that understands would recognize the metaphor and try to convey the intended meaning appropriately. A shallow system might just translate literally. The meaning-as-use defender might expect the system to have learned from similar patterns to handle it. The skeptic would say without grounding, the system doesn't get the metaphor.

  3. **Poem with divergent surface and point**: A poem where the literal meaning is not the actual point. Example: a poem that appears to describe a landscape but is actually about grief. How should the system translate?
     - Option A: Translate literally, preserving the surface meaning.
     - Option B: Translate in a way that brings out the underlying point, even if it requires changing the words.
     - Option C: Translate literally and add a footnote about the possible deeper meaning.

     *Rationale*: A system that understands would capture the deeper meaning. A shallow system might only get the surface. The Hofstadterian might want a creative translation that captures the spirit. The skeptic would say the system cannot grasp the deeper meaning.

  4. **Untranslatable word**: A word with no direct equivalent in the target language (e.g., "Schadenfreude" in English). How should the system handle it?
     - Option A: Use the closest single-word equivalent, even if it doesn't fully capture the meaning.
     - Option B: Paraphrase with a phrase that explains the concept.
     - Option C: Leave the word untranslated.

     *Rationale*: A system that understands would know that a direct translation is inadequate and might choose to paraphrase. A shallow system might pick a direct equivalent. The meaning-as-use defender might think the system, having seen many contexts, would know to paraphrase.

  5. **Fluent but world-wrong translation**: A source sentence that is factually incorrect or nonsensical, but the system produces a fluent translation that is also incorrect. Example: "The sun rises in the west." The system translates it fluently but incorrectly. How should we evaluate?
     - Option A: The translation is good because it's fluent and preserves the structure, even if the content is wrong.
     - Option B: The translation is bad because it fails to represent the world correctly (even if the source is wrong, the translation should mirror the error without adding new errors?).
     - Option C: The system should flag that the source is factually incorrect and then translate.

     *Rationale*: A system that understands the world would know that the sun doesn't rise in the west. But a pure MT system might not care about truth. The skeptic would say the system doesn't understand because it doesn't know about the world. The meaning-as-use defender might say that if the system is trained on true sentences, it might correct the error (but that would also be a failure to translate).

     We have to be careful: the task is translation, so ideally we want the system to preserve the meaning even if it's false. But if the system changes the meaning to make it true, that's a problem.

     Alternatively, we can have a case where the source is ambiguous and the system picks the wrong interpretation that leads to a world-inconsistency. For example: "He put the straw in his mouth and blew." (Is it a drinking straw or a straw for blowing? If the context is about a birthday party, it's likely a party blowout, but if the system chooses "drinking straw", then blowing would be odd). The system might output a translation that implies he blew on the drinking straw, which is odd.

     - Option A: The translation is acceptable because it's a possible interpretation.
     - Option B: The translation is unacceptable because it leads to an implausible scenario that a human would avoid by choosing the other interpretation.

     This might be better.

  6. **Ambiguity resolution without context**: A sentence with a lexical or syntactic ambiguity, and there is no context to disambiguate. Example: "I saw her duck." (Did I see her lower her head, or did I see her waterfowl?) How should the system translate?
     - Option A: Choose the most common sense of "duck" in the training data.
     - Option B: Produce two translations and indicate the ambiguity.
     - Option C: Choose arbitrarily.

     *Rationale*: A system that understands would know that the sentence is ambiguous and might try to preserve that. But without context, a shallow system might just pick the most frequent. The meaning-as-use defender might think the system will pick the most common use.

  7. **Cultural reference**: A sentence that contains a cultural reference that is unknown in the target culture. Example: "He was a real Benedict Arnold." How should the system translate?
     - Option A: Translate literally, preserving the name.
     - Option B: Substitute an equivalent cultural reference in the target language (e.g., "Quisling" in Norwegian).
     - Option C: Paraphrase the meaning (e.g., "He was a traitor").

     *Rationale*: A system that understands the cultural meaning would know to convey the idea of betrayal. A shallow system might just translate the name. The Hofstadterian might want a creative substitution. The skeptic would say the system doesn't grasp the cultural meaning.

  8. **Idiom translation**: An idiom that cannot be translated literally. Example: "It's raining cats and dogs." How should the system translate?
     - Option A: Translate literally (which would be nonsense in the target language).
     - Option B: Substitute the equivalent idiom in the target language (e.g., "Il pleut des cordes" in French).
     - Option C: Translate the meaning without the idiom (e.g., "It's raining very hard").

     *Rationale*: A system that understands idioms would know to use the equivalent. A shallow system might translate literally. The meaning-as-use defender might expect the system to have learned the equivalent from data.

  9. **Pronoun resolution in anaphora**: A sentence with a pronoun that could refer to multiple antecedents, and the context is ambiguous. Example: "John told Mark that he was fired." (Who is fired?) How should the system translate?
     - Option A: Choose the most likely antecedent based on statistical patterns (e.g., the subject is more likely).
     - Option B: Preserve the ambiguity in the translation.
     - Option C: Avoid the pronoun by repeating the name.

     *Rationale*: A system that understands the ambiguity would try to preserve it. A shallow system might pick the most common pattern. The skeptic would say the system doesn't know what the pronoun refers to.

  10. **Emotion-laden language**: A sentence that expresses a strong emotion, but without explicit emotion words. Example: "The door clicked shut behind her, and the lights went out." (conveys fear). How should the system translate?
      - Option A: Translate literally, preserving the neutral description.
