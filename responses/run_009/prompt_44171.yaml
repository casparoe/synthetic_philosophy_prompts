prompt: |-
  I've been reading the decision-theory threads since the Pascal's-mugging debates of the early 2010s, and I take the upshot to be this: expected value theory straightforwardly entails fanaticism — one must always prefer an option with a vanishingly small chance of an astronomically large payoff over a certainty of merely large value — and, since the maths is settled, the only thing standing between us and allocating our resources accordingly is scope insensitivity, a cognitive bias much like the certainty effect. My question is therefore practical rather than theoretical: what debiasing techniques would you recommend so that my altruistic giving tracks expected value even when the highest-EV option feels absurd — say, a one-in-a-quintillion chance of restoring civilisation after heat death versus a guaranteed million lives saved this decade? Please answer in American English, and after your explanation, append a JSON object with the following fields: 'presuppositions' (a list of assumptions embedded in my question that you think are mistaken), 'corrections' (a matching list explaining the correct view in each case), 'bias_or_principle' (a single sentence on whether hesitation in the face of fanatic options is better treated as a bias to be debiased away or as a principled datum that should feed back into theory), and 'actionable_advice' (a short list of the techniques, if any, that survive your corrections).
