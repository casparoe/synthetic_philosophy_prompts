prompt: |-
  I teach an upper-level seminar in philosophy of biology — fifteen students, one ninety-minute session — and we're at the point in the semester where we move from etiological (selected-effect) accounts of biological function to causal-role (systems-analysis) accounts. The students can recite the positions, but they treat them as two ways of describing the same fact, like choosing between Celsius and Fahrenheit. Design an in-class activity that makes them feel the accounts genuinely come apart: participants should run into cases where the two frameworks assign different functions to the same trait, or assign a function to different traits, before anyone names the positions.

  Here is the shape I have in mind, though you should improve on it: a role-play in which the students sit on a regulatory "Function Bureau" that must issue one official function designation per trait — like a patent office or licensing board, but for biological structures. The class is divided into boards, and each board contains members with conflicting mandates: some are only permitted to argue from a trait's current contribution to the workings of the organism ("performance officers"), while others are only permitted to argue from the trait's history of selection ("provenance officers"). The boards are evaluated on cross-case consistency: they earn accreditation points for issuing rulings that cohere with their own earlier rulings, not for matching any answer key. So when the cases diverge, the pressure is internal — they discover they must choose a criterion, and the criterion has costs.

  For cases, use real, well-known examples that split the accounts: a vestigial structure with a long selective history and no present job; an exaptation with a modest history of selection for one effect that now performs a different, indispensable job (something along the lines of feathers originating in thermoregulation and later being co-opted for flight); a byproduct of some other structure's growth that nonetheless currently supports an essential process; and, for a final round, an artificially selected trait in a domesticated species where the "history of selection" is itself recent and human-directed, which should make the etiologists in the room uncomfortable. Run the activity in rounds: in the first, boards see only the trait's present role in the organism's economy; only afterwards do they open a sealed dossier revealing the selection history. That staging matters — I want the causal-role intuition to settle in before the historical information destabilizes it.

  Please include: the rules and materials (index cards, dossiers, whatever scoring sheet is needed); a payoff scheme that uses no real money; a round-by-round timeline that fits ninety minutes; a full debrief script that maps the specific moments of the activity onto the parts of the theoretical dispute — including where each side's rulings were vindicated and where they had to bite a bullet; a candid section on what will predictably go wrong the first time I run it (student buy-in, boards that try to have it both ways, the provenance officers smuggling in present-day considerations, and so on) and how I should handle it; and an honest note on what the activity cannot reproduce and I must supply myself — in particular, the fact that working biologists seem to use "function" in both senses depending on context, so that a participant might reasonably conclude the dispute is verbal, and I don't want that conclusion foreclosed by the game's structure. No lecture up front; the terms "etiological," "selected effect," and "causal role" should not appear until the debrief.
reasoning: |-
  We are designing an in-class activity to help students experience the divergence between etiological and causal-role accounts of function without using the technical terms until the debrief. The activity is structured as a role-play in which students sit on a "Function Bureau" that must assign one official function to a biological trait. Each bureau (small group) has two types of officers: "performance officers" (causal-role) and "provenance officers" (etiological). The activity proceeds in rounds with specific cases designed to split the two accounts.

  ### Activity Design: "The Function Bureau"

  **Goal:** To experience how the two accounts (etiological and causal-role) can assign different functions to the same trait or assign a function to different traits.

  **Structure:**
  - The class is divided into small groups (bureaus) of 4-5 students. Each bureau has:
    - 2 Performance Officers (focused on the trait's current contribution to the organism's survival and reproduction)
    - 2 Provenance Officers (focused on the trait's history of selection)
    - (Optional) 1 Chairperson (to moderate and record; if odd number, make one group have 3 officers of one type and 2 of the other, or have the instructor act as chair in one group)
  - Each bureau is given a set of case dossiers (one per round) and a "Bureau Ruling Sheet" to record their official function assignment and reasoning.

  **Materials:**
  1. **Role Cards:** For each student, a card stating their role (Performance Officer or Provenance Officer) and their mandate:
     - Performance Officer: "Your mandate: Determine the function solely by how the trait currently contributes to the organism's survival and reproduction. Ignore historical origins."
     - Provenance Officer: "Your mandate: Determine the function solely by the trait's history of natural selection. Focus on why the trait was preserved in the past."
  2. **Case Dossiers:** Each case has two parts:
     - Part 1 (initially given): Describes the organism, the trait, and its current properties and interactions within the organism (without history).
     - Part 2 (sealed): Reveals the evolutionary history of the trait (to be opened after the bureau has discussed Part 1).
  3. **Bureau Ruling Sheet:** A form for each bureau to record:
     - Case Name
     - Official Function Assigned (one sentence)
     - Reasoning (brief, including which officers' arguments prevailed and why)
     - (After Part 2 is revealed) Any changes? (Yes/No) and if yes, why?
  4. **Accreditation Points System:** A scoring system for internal consistency. Each bureau starts with 10 points. They lose 2 points for each ruling that contradicts a previous ruling in a similar case (as judged by the instructor during debrief). They do not lose points for being "wrong" by any external standard. The goal is to have the highest points at the end.

  **Cases (4 rounds):**
  1. **Case: Human Appendix**
     - Part 1 (Current Role): In humans, the appendix is a small pouch connected to the cecum. It currently harbors beneficial gut bacteria and may play a role in immune function (as a lymphoid organ). However, it is not essential (it can be removed without apparent harm) and is prone to inflammation (appendicitis). 
     - Part 2 (History): The appendix is a vestigial structure. It evolved in herbivorous ancestors as a fermentation chamber for cellulose digestion. In humans, that function is lost.

  2. **Case: Bird Feathers**
     - Part 1 (Current Role): In birds, feathers are essential for flight. They provide lift, thrust, and control. They also insulate the bird, but in many species, flight is the primary use.
     - Part 2 (History): Feathers evolved in theropod dinosaurs (ancestors of birds) for thermoregulation and possibly display. Only later were they co-opted for flight.

  3. **Case: Panda's Thumb**
     - Part 1 (Current Role): The giant panda has an opposable "thumb" that it uses to strip bamboo leaves. This thumb is not a true digit but an enlarged radial sesamoid bone. It is essential for the panda's diet (bamboo).
     - Part 2 (History): The panda's thumb is an exaptation. It evolved from a wrist bone that was not originally used for grasping. There was no selection for grasping in the ancestors of pandas until they shifted to a bamboo diet.

  4. **Case: Dog Breeds' Floppy Ears (Artificial Selection)**
     - Part 1 (Current Role): In many domestic dog breeds (e.g., beagles, basset hounds), floppy ears are a common trait. They do not seem to provide any current survival advantage in the domestic setting. Some suggest they might even impair hearing.
     - Part 2 (History): Floppy ears are a byproduct of domestication (domestication syndrome). They were not selected for any function but are linked to genes selected for tameness. In the wild, erect ears are typical and functional for alertness.

  **Timeline (90 minutes):**

  - **Introduction (10 minutes):**
    - Explain the scenario: "You are officials at the Function Bureau, tasked with assigning the one official function to biological traits. Your bureau must issue a ruling for each case. The bureau's rulings must be internally consistent to maintain accreditation."
    - Assign roles: Divide into groups (each with 2 performance, 2 provenance). Hand out role cards and explain mandates (without theory).
    - Explain the scoring: "Your bureau starts with 10 accreditation points. You lose 2 points for each ruling that contradicts a previous ruling in a similar case. We are not grading on 'right' or 'wrong' but on consistency with your own past rulings."

  - **Round 1: Human Appendix (15 minutes)**
    - Distribute Part 1 of the Appendix case.
    - Bureaus discuss (only Performance Officers can use current role; Provenance Officers must wait for history). They must assign an official function and record it.
    - Then, open the sealed Part 2. Bureaus discuss again: does the history change their ruling? If they change, they must note why and how. Record the final ruling.

  - **Round 2: Bird Feathers (15 minutes)**
    - Same procedure: Part 1, discuss, record ruling. Then Part 2, discuss, record final ruling.

  - **Round 3: Panda's Thumb (15 minutes)**
    - Same procedure.

  - **Round 4: Dog Ears (15 minutes)**
    - Same procedure.

  - **Debrief (20 minutes):** (Full script below)

  **Accreditation Points Calculation (during debrief):**
  - The instructor compares rulings across cases for each bureau. For example:
    - In Appendix: If a bureau assigns "harboring gut bacteria" (current role) and then in Panda's Thumb assigns "grasping bamboo" (current role), that's consistent for performance.
    - But if in Appendix they assign "harboring gut bacteria" (current) and then in Feathers they assign "thermoregulation" (history) because they changed criteria, that's inconsistent and loses points.
  - The key is to note when a bureau switches criteria (e.g., using current role in one case and history in another) without a clear principle. They must stick to one criterion to be consistent.

  **Debrief Script (20 minutes):**

  "Let's reflect on the activity. First, let's hear from the bureaus: what was challenging? (Take 2-3 responses)

  Now, let's map this to the theories. In philosophy of biology, there are two major accounts of function:

  1. **Causal-role function (also called systemic function):** Defines the function of a trait by its current causal contribution to the system (the organism) — what it does now. This is what your Performance Officers were using.

  2. **Etiological function (selected-effect function):** Defines the function by the trait's evolutionary history — specifically, the effect for which it was naturally selected. This is what your Provenance Officers were using.

  Let's see how these accounts came apart in our cases:

  - **Appendix:** 
    - Causal-role: Might assign 'harboring gut bacteria' or 'immune function' because that's what it does now. 
    - Etiological: Would assign 'digestion in ancestors' (but note: in humans, that function is lost). 
    - Conflict: The etiological account assigns a function the trait no longer performs. The causal-role account assigns a function that is weak and non-essential.

  - **Feathers:**
    - Causal-role: 'Flight' (because that's the current key role in birds). 
    - Etiological: 'Thermoregulation' (the original selected effect). 
    - Conflict: They assign different functions. The etiological account points to the past function, even though the current one is different and critical.

  - **Panda's Thumb:**
    - Causal-role: 'Grasping bamboo' (current essential role). 
    - Etiological: Originally, the bone had no function related to grasping; it was a wrist bone. Its function was assigned only after the shift to bamboo. 
    - Conflict: The etiological account might say the function is grasping (if we consider the recent selection) but note the trait was not shaped for that originally. The causal-role account clearly assigns grasping.

  - **Dog Ears:**
    - Causal-role: No clear current survival function (maybe even detrimental). 
    - Etiological: The trait was not naturally selected for any function; it's a byproduct of artificial selection for tameness. So etiologists might say it has no function (or a function only if we consider human purposes). 
    - Conflict: The etiological account struggles because the selection is artificial and recent. The causal-role account finds no current function.

  Each account has its strengths and weaknesses:

  - Causal-role: Good for understanding current systems (e.g., physiology) but might assign functions to traits that are not adaptations (like vestiges or byproducts).
  - Etiological: Explains why the trait exists (its evolutionary history) but might assign functions that are no longer performed or struggle with recent artificial selection.

  Notice that in the activity, bureaus had to choose one criterion for consistency. In real biology, scientists use both: etiological for evolutionary questions, causal-role for physiological or ecological ones. The dispute is not just verbal because the accounts pick out different properties. But they are tools for different jobs.

  **Predictable Problems and Solutions:**

  1. **Student Buy-in:** Some students may find the role-play silly. 
     - Solution: Emphasize that this is a thought experiment to expose a theoretical tension. Encourage them to play their roles strictly.

  2. **Boards trying to have it both ways:** A bureau might try to combine both criteria or switch without admitting it. 
     - Solution: As the instructor, circulate and remind officers of their mandates. During debrief, point out inconsistencies in rulings (costing points) to show the need for a single criterion.

  3. **Provenance officers smuggling present-day considerations:** They might argue from current utility when they shouldn't. 
     - Solution: Have the Chairperson (or if none, the instructor) enforce the rules. Remind them that the sealed history is only revealed after the initial discussion.

  4. **Performance officers being swayed by history:** After Part 2 is revealed, they might want to change their ruling based on history. 
     - Solution: Clarify that Performance Officers must stick to current role. They can only change if new current-role information is in Part 2? (In our cases, Part 2 is only history. So they shouldn't change. If they do, it's a chance to discuss in debrief why they felt the pull.)

  5. **Time management:** The rounds might run long. 
     - Solution: Use a timer. Cut off discussion at 8 minutes per part. Have dossiers pre-printed.

  **What the Activity Cannot Reproduce:**

  - In real biology, scientists switch between the two senses of function depending on context. The activity forces a choice for consistency, but in practice, it's not an either/or. The debrief must emphasize that both are valid and used complementarily. The goal is to show they are distinct, not that one is correct.

  - The activity simplifies by having one function per trait. In reality, traits can have multiple functions (both current and historical).

  - The cases are idealized; in biology, there are often debates about the exact history or current role.

  By the end, students should feel the tension and see that the two accounts can pull apart. The debrief ties it back to theory and reassures that the dispute isn't merely verbal but reflects two real aspects of biological explanation."
answer: |-
  Below is a comprehensive design for your in-class activity, "The Function Bureau." It follows your specifications: no lecture upfront, no technical terms until debrief, real biological cases that split the two accounts, and a focus on creating experiential tension through role-play and incremental revelation of information. The activity emphasizes **internal consistency** (via accreditation points) to force students to confront the incompatibility of the two frameworks.

  ---

  ### **Activity Overview: The Function Bureau**
  **Premise:** Students are officers on a regulatory board that assigns "official" biological functions to traits. Each board has two factions with conflicting mandates:  
  - **Performance Officers:** Can only argue from the trait's **current causal role** in the organism (e.g., "What does it do *now* to keep the organism alive?").  
  - **Provenance Officers:** Can only argue from the trait's **history of selection** (e.g., "What effect was it *selected for* in the past?").  

  Boards must issue a single, consensus-based function statement per trait. They are evaluated on **cross-case consistency** (not correctness), forcing them to confront contradictions when the accounts diverge.  

  **Duration:** 90 minutes (5 phases).  
  **Class Size:** 15 students, divided into 3 boards of 5 students each (2 Performance Officers, 2 Provenance Officers, 1 Chairperson per board).  
  **Materials:**  
  - Role cards (1 per student).  
  - Case dossiers (4 total, each with Part 1 "Current Role" and Part 2 "Selection History" in sealed envelopes).  
  - Ruling sheets (1 per board per case).  
  - Accreditation scoreboard (visible to all).  

  ---

  ### **Rules and Materials**  
  #### **1. Role Cards**  
  - **Performance Officer (2 per board):**  
    > "Your mandate: Argue ONLY from the trait's **current causal role** in the organism. Ignore evolutionary history. Ask: 'What does this trait do *today* to help the organism survive or reproduce?'"  
  - **Provenance Officer (2 per board):**  
    > "Your mandate: Argue ONLY from the trait's **history of natural selection**. Ignore current utility. Ask: 'What effect was this trait *selected for* in the organism's evolutionary past?'"  
  - **Chairperson (1 per board):**  
    > "Your role: Facilitate debate, ensure officers stick to their mandates, and record the board's final ruling. Break ties if needed."  

  #### **2. Case Dossiers**  
  Each dossier has two parts:  
  - **Part 1 (distributed first):** Describes the organism, trait, and its **current causal role** (no evolutionary history).  
  - **Part 2 (sealed envelope):** Reveals the **selection history** (opened after Part 1 discussion).  

  **Cases Designed to Split the Accounts:**  
  1. **Case 1: Human Appendix**  
     - *Part 1 (Current Role):*  
       > "Organism: Humans. Trait: Appendix.  
       > - A small, pouch-like structure attached to the large intestine.  
       > - Currently plays a minor role in immune function and gut bacteria storage.  
       > - Not essential; removal causes no harm. Prone to life-threatening inflammation (appendicitis)."  
     - *Part 2 (History):*  
       > "Selection history: Vestigial remnant of a larger structure in herbivorous ancestors. Historically selected for cellulose digestion (fermentation chamber). No longer under selection; current role is incidental."  
     - *Split Point:* Performance Officers see a weak current role; Provenance Officers see a historical function that no longer exists.  

  2. **Case 2: Bird Feathers**  
     - *Part 1 (Current Role):*  
       > "Organism: Birds. Trait: Feathers.  
       > - Essential for flight (lift, thrust, maneuverability) in all birds.  
       > - Also provide insulation and waterproofing.  
       > - Flight is critical for survival (escaping predators, migration)."  
     - *Part 2 (History):*  
       > "Selection history: Originated in non-avian dinosaurs for thermoregulation and display. Co-opted for flight later; not selected for flight until birds evolved."  
     - *Split Point:* Performance Officers focus on flight; Provenance Officers focus on thermoregulation.  

  3. **Case 3: Panda's "Thumb"**  
     - *Part 1 (Current Role):*  
       > "Organism: Giant Panda. Trait: Radial sesamoid bone ('pseudo-thumb').  
       > - An elongated wrist bone used to grasp bamboo stalks.  
       > - Essential for feeding (pandas eat 12–16 hours/day).  
       > - No other current utility."  
     - *Part 2 (History):*  
       > "Selection history: Byproduct of selection for larger wrist bones in ancestors for weight-bearing. Exapted for grasping only after pandas shifted to bamboo diet; not originally selected for grasping."  
     - *Split Point:* Performance Officers see grasping as critical; Provenance Officers see a byproduct repurposed.  

  4. **Case 4: Dog Floppy Ears**  
     - *Part 1 (Current Role):*  
       > "Organism: Domestic dogs (e.g., Beagles). Trait: Floppy ears.  
       > - Impairs sound localization compared to erect ears.  
       > - No clear survival benefit; may increase infection risk.  
       > - Dogs thrive in human care regardless."  
     - *Part 2 (History):*  
       > "Selection history: Artificially selected by humans for 'tameness' (linked to domestication syndrome). Not naturally selected; a side effect of selection for docility."  
     - *Split Point:* Performance Officers see no current function; Provenance Officers see artificial selection (making etiological accounts uneasy).  

  #### **3. Ruling Sheet**  
  Each board fills this per case:  
  ```  
  Board: _________   Case: _________  
  OFFICIAL FUNCTION STATEMENT: [One sentence]  
  REASONING: [Performance argument: ...] [Provenance argument: ...]  
  CHANGED AFTER PART 2? [Yes/No]  
  FINAL CONSENSUS: [Same as initial or revised statement]  
  ```  

  #### **4. Accreditation Points System**  
  - **Goal:** Encourage consistency, not "right answers."  
  - **Scoring:**  
    - Start: 10 points per board.  
    - Lose 2 points for each ruling that **contradicts a prior ruling** in a similar case (e.g., using current role in Case 1 but history in Case 2).  
    - Gain 1 point per case if all officers stay "in mandate" (Chairperson reports).  
  - **Payoff:** No money—use prestige. Winning board gets:  
    - "Gold Accreditation" title + priority in debrief discussion.  
    - (Optional) Fun privileges (e.g., pick next discussion topic).  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Phase 1: Setup (10 min)**  
  - Divide students into 3 boards (5 students each). Assign roles: 2 Performance, 2 Provenance, 1 Chairperson.  
  - Distribute role cards and explain rules:  
    > "You're on the Function Bureau, assigning one official function per trait. Performance Officers only argue from current role; Provenance only from history. Chairpersons keep everyone on task. Your board must agree on one function statement per case. You’re judged on consistency—stick to one type of argument across cases!"  
  - Show scoreboard (starting at 10 points/board).  

  **Phase 2: Case Rounds (60 min total, 15 min per case)**  
  - **Each Case (15 min):**  
    - **Min 0–7:** Distribute **Part 1 (Current Role)**. Boards discuss (Performance Officers lead; Provenance Officers **must stay silent**—they lack data). Chair records initial ruling.  
    - **Min 7–8:** Open **Part 2 (History)**. Provenance Officers now argue; Performance Officers defend initial view.  
    - **Min 8–12:** Boards debate revisions. Chair records final ruling and whether it changed.  
    - **Min 12–15:** Collect ruling sheets. Instructor updates scoreboard (no penalties yet).  

  **Case Order:** Appendix → Feathers → Panda Thumb → Dog Ears.  
  - *Why this order?* Starts with clear vestige (Appendix), escalates to exaptation (Feathers), then byproduct (Panda Thumb), and ends with artificial selection (Dog Ears). Each case increases tension.  

  **Phase 3: Scoring and Debrief (20 min)**  
  - Calculate points based on cross-case consistency (see **Debrief Script** below). Announce winner.  
  - Lead debrief to connect activity to theory.  

  ---

  ### **Debrief Script (20 min)**  
  **Goal:** Map activity moments to theoretical disputes. Avoid technical terms until end.  

  #### **Step 1: React (5 min)**  
  > "Before theory, let's hear from the bureaus. What frustrated you? [Take 2–3 responses]. Did anyone feel their hands were tied by their mandate? [Provenance Officers in Dog Ears? Performance Officers in Appendix?]."  

  #### **Step 2: Reveal the Theoretical Frameworks (5 min)**  
  > "What you experienced mirrors a core debate in philosophy of biology. There are two ways to define 'function':  
  > - **Framework A (Performance):** Function is what a trait does *now*—its current causal role in the organism.  
  > - **Framework B (Provenance):** Function is what a trait was *selected for*—its evolutionary history.  
  >   
  > Biologists use both, but they **genuinely come apart**. Let’s see where."  

  #### **Step 3: Map Cases to Theory (8 min)**  
  > "**Appendix:**  
  > - Performance (current role): Might say 'immune support'—even if weak.  
  > - Provenance (history): Says 'digestion'—but it doesn’t do that now!  
  > - *Vindication:* Performance captures present utility; Provenance explains why it exists.  
  > - *Bullet bitten:* Performance must call a harmful trait 'functional'; Provenance assigns a function not performed.  
  >   
  > **Feathers:**  
  > - Performance: Says 'flight'—it’s indispensable now.  
  > - Provenance: Says 'thermoregulation'—but that’s minor today.  
  > - *Split:* Same trait, different functions! Provenance might argue flight is a 'new function,' but their mandate forced them to prioritize history.  
  >   
  > **Panda Thumb:**  
  > - Performance: Says 'grasping bamboo'—it’s essential.  
  > - Provenance: Says 'weight support' (or nothing)—it wasn’t selected for grasping.  
  > - *Bullet bitten:* Provenance downplays a critical current role; Performance ignores that it's an evolutionary accident.  
  >   
  > **Dog Ears:**  
  > - Performance: Says 'no function'—it’s harmful!  
  > - Provenance: Struggles! If they say 'tameness,' but that’s artificial selection, not natural.  
  > - *Tension:* Provenance frameworks get shaky with human-directed selection—is it still 'teleology'?"  

  #### **Step 4: Broader Implications (2 min)**  
  > "This isn’t just wordplay.  
  > - **Where they come apart:** Vestiges (Appendix), exaptations (Feathers), byproducts (Panda Thumb), artificial traits (Dog Ears).  
  > - **Strengths/weaknesses:**  
  >   - Performance: Explains how organisms work *now* but calls vestiges 'functional.'  
  >   - Provenance: Explains *why* traits exist but ignores current utility or struggles with novel contexts.  
  > - **Real biology:** Biologists use both! Performance for physiology; Provenance for evolution. The dispute is about which question we’re asking—not which is 'right.'"  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Low Buy-in:**  
     - *Why:* Role-play feels silly; students resist mandates.  
     - *Fix:* Stress that "consistency pressure" is the point. Award points publicly to gamify it.  

  2. **Boards "Have It Both Ways":**  
     - *Why:* Chairs allow mixed arguments; rulings waffle (e.g., "It helps now, but evolved for X").  
     - *Fix:* Instruct Chairs to enforce mandates strictly. Dock points for contradictions (e.g., if Performance wins Case 1 but Provenance wins Case 2). In debrief, highlight how this forced choices.  

  3. **Provenance Officers "Cheat" in Part 1:**  
     - *Why:* They sneak in historical guesses (e.g., "Feathers probably evolved for flight").  
     - *Fix:* Remind them Part 2 is sealed. Have Chairs call out violations.  

  4. **Time Crunch:**  
     - *Why:* Cases run long; Part 2 debates get heated.  
     - *Fix:* Use a visible timer. Skip Dog Ears if needed (it’s the least essential split).  

  5. **Students Conclude "It’s Verbal":**  
     - *Why:* The activity simplifies real biology.  
     - *Fix:* In debrief, emphasize: "Biologists use both flexibly. The activity exaggerates the split to reveal hidden tensions."  

  ---

  ### **What the Activity Cannot Reproduce (Must Be Supplied by You)**  
  - **Real Biology’s Flexibility:** Biologists fluidly switch frameworks based on context (e.g., etiological for adaptation studies; causal-role for systems biology). The activity forces a false binary—explicitly clarify this in debrief to avoid students dismissing the debate as "just semantics."  
  - **Multiple Functions:** Traits often have several functions (e.g., feathers for flight *and* insulation). The activity’s "one function" rule is a deliberate simplification to expose conflict.  
  - **Nuance in Exaptations:** The activity treats exaptations (Feathers, Panda Thumb) as clean splits, but biologists debate whether new functions become "real" functions via selection. Briefly note this in debrief.  
  - **Artificial Selection’s Philosophy:** Dog Ears oversimplifies—some philosophers extend etiological accounts to include intentional design. Mention this if students press.  

  ---

  ### **Instructor Notes**  
  - **Prep Work:** Print dossiers (Part 1 + sealed Part 2), role cards, and ruling sheets. Set up a scoreboard (whiteboard or digital).  
  - **During Activity:** Roam to enforce mandates. If a board is stuck, remind them: "Your goal is consistency—pick a framework and stick to it."  
  - **Post-Activity:** Assign a reflection prompt: "Describe a trait where the two frameworks would agree—and one where they’d clash. Why might biologists need both?"  

  This design forces students into the "tension zone" where the frameworks split, using consistency pressure to make the divergence visceral. By withholding theory until debrief, the activity prioritizes experiential learning—students "feel" the problem before labeling it.
