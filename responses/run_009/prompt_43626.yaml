          - Did the complaint rule block the majority vote allocation?

     - Then discuss the difference: why did they have to change the allocation? Because in the complaint rule, the patient with the biggest loss could block.

     - Then pose the aggregation problem: what if we have one patient with a very big loss and many patients with very small losses? Should we ever allow the many small losses to outweigh the one big one? At what point?

     - Discuss: in the complaint rule, we didn't aggregate at all — one veto. But in real life, we might allow aggregation when the small harms add up.

     - Ask the students: in your group, was there a patient whose complaint was so big that it had to be addressed? Did anyone feel that the complaint rule was unfair to the others? How did you draw the line?

     - Then connect to Scanlon: the idea of principles that no one could reasonably reject. But then the aggregation problem: when is it reasonable to reject a principle that asks you to bear a small burden for the sake of preventing a very large burden to someone else? And when do many small burdens add up to a reasonable rejection?

     - Finally, note what the game couldn't capture: we only had a few patients. In reality, with many people, the small burdens might add up to a lot.

  Predictable problems and handling:

  - If a student rates dishonestly in the second rule (gives 5 even with small loss), then an allocation that should pass might be blocked. If this happens, in debrief discuss: why did you rate that way? Was it strategic? How does that relate to the real-world application of such a rule? (People might exaggerate their claims.)

  - If students refuse to engage with the second rule: in the debrief, ask them why. Then discuss: "It might feel rigged because it gives too much weight to the worst off. But in ethics, we often debate how much weight to give to the worst off. This rule represents one extreme: absolute priority to the worst off. We will discuss aggregation as a way to moderate that."

