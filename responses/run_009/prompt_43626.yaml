  This should fit in 90 minutes.
answer: |-
  Below is a comprehensive in-class decision game designed to meet your specifications. It fits within 90 minutes, uses only paper and pens, and targets the core tension between aggregative (majority vote) and complaint-based (Scanlonian) reasoning. The game highlights the aggregation problem by forcing students to confront when (and why) a collection of small complaints might outweigh one severe complaint. The debrief connects the experience directly to Scanlon and prepares for deeper aggregation discussions.

  ---

  ### **Game Title:** The Lifeboat Dilemma  
  **Scenario:** A sinking ship has 5 passengers (in groups of 5) or 4 passengers (in groups of 4) and only 3 spots in a lifeboat. Passengers have varying severities of injury, affecting their survival chances if left behind. This mirrors medical triage without real-world stakes.  

  **Objective:** Allocate lifeboat spots under two rules. Rule 1 (majority vote) emphasizes preference aggregation. Rule 2 (complaint-based) prioritizes the worst-off individual, illustrating Scanlon’s "no reasonable rejection" principle. The debrief explores when aggregated small complaints might override one severe complaint.  

  **Materials (per group):**  
  - **Role cards:** One per student, describing passenger injuries and "Well-Being Points" (WBPs). WBPs quantify survival chances (non-monetary scoring).  
  - **Voting ballots:** Blank paper for secret votes (Rule 1).  
  - **Complaint sheets:** Small papers for secret severity ratings (Rule 2).  
  - **Group summary sheet:** To record allocations and ratings.  

  **Passenger Profiles (WBPs):**  
  *WBPs represent 10-year life quality (0 = death, 50 = full health). Loss = WBP without rescue. Design ensures one high-loss passenger and others with smaller losses. Profiles are identical across groups for consistency.*  
  - **Group of 5:**  
    - Passenger 1: Critical head injury. **Rescued: 50 WBPs** | **Not rescued: 5 WBPs** (Loss = 45).  
    - Passenger 2: Severe internal bleeding. **Rescued: 50** | **Not: 10** (Loss = 40).  
    - Passenger 3: Broken spine. **Rescued: 50** | **Not: 25** (Loss = 25).  
    - Passenger 4: Concussion. **Rescued: 50** | **Not: 30** (Loss = 20).  
    - Passenger 5: Minor fractures. **Rescued: 50** | **Not: 35** (Loss = 15).  
  - **Group of 4 (for uneven groups):**  
    - Same as above, but omit Passenger 5 (losses: 45, 40, 25, 20).  

  **Key Tension:**  
  Passenger 1 (loss=45) has the most severe complaint if left behind. Rule 2 may force their rescue, but students must weigh if, e.g., Passengers 3+4+5’s combined losses (25+20+15=60) outweigh Passenger 1’s loss (45).  

  ---

  ### **Game Structure (Total: 90 minutes)**  
  **Setup (5 min):**  
  - Divide class into 3 groups (two groups of 5, one group of 4).  
  - Assign roles randomly (one passenger per student).  
  - Distribute role cards. Clarify WBPs: "This is a proxy for survival—no real money or stakes. Base decisions on your assigned loss."  

  **Rule 1: Majority Vote (25 min)**  
  *Goal: Experience aggregative reasoning. Students vote to maximize preferences, ignoring severity.*  
  1. **Instructions (5 min):**  
     - Groups must choose 3 passengers to save.  
     - Discuss proposals openly (10 min). Encourage self-interest: "Argue for your survival!"  
     - Vote by secret ballot: Each student votes for one allocation (e.g., "Save 1,2,3"). Majority wins (≥3 votes in 5-student groups; ≥3 in 4-student groups).  
     - Record the winning allocation on the group sheet.  
  2. **Predicted Dynamics:**  
     - Passengers 1 and 2 (high loss) lobby hard. Passengers 3-5 (lower loss) may form coalitions (e.g., "Save 3,4,5 to maximize total WBPs").  
     - Likely outcome: Groups save mid-loss passengers (e.g., 2,3,4) because Passenger 1 is "too costly" to include in coalitions. High-loss Passenger 1 or 2 often excluded.  
  3. **Facilitation Tips:**  
     - If deadlock, force a vote between two proposals (e.g., "Save 1,2,3" vs. "Save 3,4,5").  
     - Keep time strict.  

  **Rule 2: Complaint-Based Rule (25 min)**  
  *Goal: Experience Scanlon’s "reasonable rejection." The worst-off individual can veto proposals.*  
  1. **Instructions (5 min):**  
     - New rule: An allocation passes only if **no passenger rates their outcome as "severe" (5/5)**.  
     - Secret rating: After a proposal, each student writes:  
       - **If rescued:** Rating = 1 (no complaint).  
       - **If not rescued:** Rate severity 1–5 (1 = mild, 5 = severe) based on personal loss.  
       - Guide: "Be honest—use your WBP loss. 5/5 = ‘unreasonably bad’ (e.g., loss ≥40)."  
     - **Veto condition:** If any rating is 5/5, the proposal is blocked.  
     - Groups must find a passing allocation (10 min discussion + voting).  
  2. **Predicted Dynamics:**  
     - Passenger 1 (loss=45) will rate 5/5 if not rescued—blocking any allocation excluding them.  
     - Groups must include Passenger 1 (and often Passenger 2) to pass, then debate the 3rd spot.  
     - Some students (e.g., Passenger 3-5) may resist: "Why does one person override the group?"  
  3. **Handling Resistance (without lecturing):**  
     - If students disengage: Ask, "What makes this rule feel unfair? Could it ever be reasonable?" Redirect to the group: "How can you persuade the ‘veto player’?"  
     - If strategic ratings (e.g., low-loss passenger rates 5/5): Remind, "Use your role’s WBPs honestly to explore the ethics." Discuss post-game.  
     - If no allocation passes: Use it in debrief—"Why did this happen? What does it reveal?"  

  **Debrief (35 min)**  
  *Goal: Connect gameplay to Scanlon, aggregation, and line-drawing.*  
  1. **Report Back (10 min):**  
     - Each group shares:  
       - Rule 1 allocation and why it won (e.g., "Passenger 1 excluded; majority preferred saving mid-loss passengers").  
       - Rule 2 allocation and ratings (e.g., "We saved Passenger 1; no one rated 5/5").  
       - Did Rule 2 block the Rule 1 outcome? (Usually yes.)  
     - Highlight differences: "Rule 1 ignored severity; Rule 2 prioritized the worst-off."  

  2. **Map to Ethics Concepts (15 min):**  
     - **Aggregation (Rule 1):** "This is utilitarian—adding up preferences. You maximized total WBPs or built coalitions, but Passenger 1’s severe complaint was drowned out."  
     - **Complaint-Based Reasoning (Rule 2):** "This mirrors Scanlon. A ‘reasonable rejection’ (rating 5/5) blocked proposals, protecting the worst-off. But is it fair that one person overrides majority preferences?"  
     - **Line-Drawing Exercise (10 min):**  
       - Pose: "When do enough small complaints outweigh one big one? In your game: Passenger 1’s loss=45. Passengers 3+4+5’s losses=25+20+15=60. Is 60 > 45? Should that matter?"  
       - Student responses vary: Some say "yes, aggregate small harms." Others say "no, severity matters more."  
       - Push further: "What if 100 passengers lose 1 WBP each (total=100) vs. one loses 45? Does your answer change?"  
       - Connect: "This is the aggregation problem—Scanlon struggles with it. We’ll tackle it next class."  

  3. **Limitations and Predictable Issues (5 min):**  
     - **Predictable Problems:**  
       - Resistance to Rule 2: Some see it as "rigged" for the worst-off. Handle by validating frustration ("Why did it feel unfair?") and teasing out intuitions.  
       - Strategic dishonesty: A few may rate incorrectly. Use it to discuss real-world incentives (e.g., exaggerating claims).  
       - Time pressure: Groups may rush. Keep phases strict.  
     - **What the Game Can’t Reproduce:**  
       - **Scale of aggregation:** With only 4–5 passengers, students won’t experience true "many small harms vs. one large harm." You’ll need to supply this next class (e.g., 1 death vs. 1000 minor injuries).  
       - **Moral weight:** WBPs simplify complex ethics. Next class, add depth (e.g., non-quantifiable harms, rights).  

  ---

  ### **Why This Works**  
  - **Time-Efficient:** Phases fit 90 min. Setup is minimal (paper/pen).  
  - **Ethics Focus:** Rule 1 forces aggregative thinking; Rule 2 makes Scanlon visceral. The debrief’s line-drawing primes aggregation discussions.  
  - **Flexible:** Works for 14 students (groups of 4–5). Profiles ensure consistent tensions.  
  - **Predictions Addressed:** Handling Rule 2 resistance via Socratic questioning avoids lecturing and surfaces student intuitions.  

  **Next Step:** After the game, introduce the aggregation problem formally with a case (e.g., "Should a town build a hospital that saves one life but causes 1000 residents minor noise distress?") to build on the game’s unresolved tension.
