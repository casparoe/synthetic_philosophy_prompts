  ### Voting Ethics Quiz: "What Do Your Choices Reveal?"

  #### Questions  
  1. **Safe Seat**: You live in a constituency where one party has won by landslides for 30 years. Polls show they’ll win again by a huge margin. Your preferred candidate has no chance.  
     - A. Skip voting—your ballot won’t change anything.  
     - B. Vote for your preferred candidate to support their ideas.  
     - C. Vote anyway—it’s part of being a citizen, even if it won’t affect the outcome.  

  2. **Lesser of Two Evils**: In a national election, the two leading candidates are both bad. Candidate A is corrupt; Candidate B is honest but holds abhorrent views. You think A is slightly less harmful.  
     - A. Stay home—you refuse to endorse either.  
     - B. Vote for A to block B from winning.  
     - C. Vote for a minor candidate you truly believe in, though they can’t win.  

  3. **Illegitimate Referendum**: Your country holds a referendum you view as rigged (e.g., biased wording, unfair rules).  
     - A. Boycott voting to protest the unfairness.  
     - B. Vote "no" to try stopping the change.  
     - C. Vote anyway—it’s important to participate, even in flawed processes.  

  4. **Pivotal Committee Vote**: You’re on a 5-person panel deciding whether to fund a project. Your vote will likely break a 2-2 tie. You dislike the project, but colleagues support it.  
     - A. Vote against—your vote could stop it.  
     - B. Abstain to avoid responsibility for the outcome.  
     - C. Vote in favor to support group cohesion.  

  5. **Spoiling a Ballot**: None of the candidates deserve your support. You worry not voting looks like apathy, but you want to protest.  
     - A. Stay home.  
     - B. Spoil your ballot (e.g., write "none of the above").  
     - C. Vote for a fringe protest party you don’t fully back.  

  6. **Compulsory Voting**: A law requires voting, with a $20 fine for skipping. You have no preference among candidates.  
     - A. Pay the fine and skip voting.  
     - B. Vote to avoid the fine but cast a blank ballot.  
     - C. Vote and pick a candidate randomly.  

  7. **Uninformed Vote**: An election is held for a local office. You know nothing about the candidates.  
     - A. Skip this race—voting blindly is irresponsible.  
     - B. Vote based on party affiliation or a candidate’s photo.  
     - C. Vote in other races but leave this part blank.  

  8. **Tactical Voting**: Your preferred minor candidate can’t win. The race is tight between Party X (which you dislike) and Party Y (which you find dangerous).  
     - A. Vote for your preferred minor candidate.  
     - B. Vote for X to block Y.  
     - C. Abstain—you won’t endorse X or Y.  

  ---

  ### Scoring Key  
  Match your answers to the patterns below. Mixtures are common—not all views fit neatly into one category.  

  1. **Civic-Duty View** (e.g., 1C, 2B/C, 3C, 4A/C, 5B/C, 6B/C, 7B/C, 8A/B):  
     You think voting is a core civic duty, like jury service. Turning out matters most—what you *do* with your ballot is secondary. You vote even in safe seats or flawed elections to uphold participation.  

  2. **Instrumentalist View** (e.g., 1A, 2B, 3B, 4A, 5A, 6A, 7A, 8B):  
     Voting is only worthwhile if it affects outcomes. You skip voting when your ballot won’t change things (safe seats, uninformed races) but vote tactically in pivotal moments (like the committee vote) to block harms.  

  3. **Expressive View** (e.g., 1B, 2C, 3A/B, 4A, 5B/C, 6B, 7B, 8A):  
     Voting is about expressing your values, not changing results. You vote for your true beliefs (even hopeless candidates), spoil ballots to protest, or boycott illegitimate votes to "speak" your conscience.  

  4. **Clean-Hands View** (e.g., 1B, 2C, 3A/B, 4A, 5A/B, 6A/B, 7A, 8A/C):  
     You may only vote for options you genuinely endorse. "Lesser evil" voting (Q2B, Q8B) is unethical—it compromises your integrity. If no candidate deserves support, abstaining or spoiling is better.  

  5. **Protest Abstentionism** (e.g., 1A, 2A, 3A, 4B, 5A, 6A, 7A, 8C):  
     Refusing to vote can be the most ethical choice. You boycott to protest injustice (illegitimate referendums), avoid complicity in bad outcomes, or reject "harm reduction" arguments.  

  6. **Informed-Voter Requirement** (e.g., Q7A dominant, other answers vary):  
     You strongly oppose uninformed voting (Q7A). If you lack knowledge, staying home is obligatory—voting blindly harms democracy. Other choices depend on context (e.g., voting informed in pivotal races).  

  **Unnamed/Thinly Occupied Combinations**:  
  - **"Cohesion Prioritizer"** (e.g., 4C, 6C, 8B): Votes to maintain group harmony or minimize conflict. Rare—philosophers rarely defend prioritizing harmony over principle.  
  - **"Randomizer"** (e.g., 6C, 7B): Votes arbitrarily under compulsion or when uninformed. Unstable—it ignores ethics of endorsement or consequences.  

  **Mixture Diagnosis**:  
  If your answers span multiple views (e.g., instrumentalist in safe seats but expressive in protests), your ethics may be context-dependent or in tension (e.g., valuing both outcomes *and* expression).  

  ---

  ### Separation Analysis  
  **Indistinguishable Pairs**:  
  - **Civic Duty vs. Expressive** (Q6): Both vote under compulsion (B/C).  
  - **Clean Hands vs. Expressive** (Q5): Both may spoil ballots (B).  
  - **Protest Abstentionism vs. Informed-Voter Requirement** (Q7): Both skip uninformed votes (A).  

  **Most Diagnostic Question**:  
  **Q1 (Safe Seat)** splits:  
  - Instrumentalists (A: skip—no effect)  
  - Expressivists (B: vote for expression)  
  - Civic-duty advocates (C: vote for participation).  
  This reveals core differences in *why* people vote.  

  ---

  ### Design Notes  
  Each question splits key positions:  
  1. **Safe Seat**: Instrumentalists (A) vs. Civic-duty (C) vs. Expressivists (B).  
  2. **Lesser Evil**: Protest abstentionists (A) vs. Instrumentalists (B) vs. Clean-hands (C).  
  3. **Illegitimate Referendum**: Protest abstentionists (A) vs. Instrumentalists (B) vs. Civic-duty (C).  
  4. **Pivotal Committee**: Instrumentalists (A) vs. Protest abstentionists (B) [Civic-duty/Expressive choose A—no split].  
  5. **Spoiling Ballot**: Protest abstentionists (A) vs. Clean-hands/Expressive (B) vs. Expressive (C).  
  6. **Compulsory Voting**: Protest abstentionists/Informed-stay-home (A) vs. Civic-duty/Expressive (B) [C: no target].  
  7. **Uninformed Vote**: Informed-stay-home/Protest abstentionists (A) vs. Civic-duty (B/C).  
  8. **Tactical Voting**: Clean-hands (A) vs. Instrumentalists (B) vs. Protest abstentionists (C).  

  Wasted questions avoided: Each forces a choice between distinct ethical logics (e.g., Q4’s abstention option targets protest views; Q7’s "skip" option tests information ethics).
