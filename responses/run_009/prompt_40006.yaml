prompt: |-
  Long-time reader, first asker: I run a small leftish politics blog with a mostly non-academic audience, and every few months the comment section erupts into a fight about whether "real equality" means equal money, equal happiness, or equal chances to live the life you want. People talk past each other for 200 comments, and I suspect half of them are defending views they'd actually hate if they saw the concrete cases. So I want to build a "which egalitarian are you, actually?" quiz for the blog, and I need help designing it.

  The quiz should be 8–10 questions, each one a concrete case with two or three answer options, and then a scoring key mapping answer patterns onto positions. The cases I definitely want in, because they seem to do the real sorting work: (1) someone born with a condition who needs way more money than average just to leave the house and get around town — does fairness mean covering that, or giving everyone the same amount and calling it even; (2) a guy who trained himself into a taste for obscenely expensive wine and now claims he's worse off than the rest of us on the same income; (3) a devout person whose religion imposes real costs — special food, no working certain days, all embraced willingly — is that a need like the disability case or a choice like the wine guy; (4) a survey where an oppressed group reports the same life satisfaction as everyone else, and a commenter says "see, no inequality here" — what should the reader say back. Feel free to swap or add cases if you think some do more sorting work than mine, but I want the quiz to be cases all the way down.

  The leaves of the scoring key should be named positions: hedonic welfare, preference-satisfaction, resource egalitarianism (with the envy-test flavor flagged if it comes apart from plain resource-splitting), capabilities, a sufficientarian "equality is the wrong currency, what matters is a floor" leaf, and a prioritarian one if it fits naturally. Hard rule: no question may just ask "do you believe in equality of resources?" — people need to be sorted by what they say about cases, not by which label they like the sound of. And at the end, flag honestly which pairs of positions the quiz can't separate no matter what (I have a suspicion the wine case doesn't split preference people from resource people the way everyone assumes), and note any answer combination that turns out coherent but unoccupied — with a sentence on whether thats because the view is incoherent, unattractive, or just unexplored. Aim it at smart readers with zero philosophy background, so every question needs to be answerable without knowing any of the terminology.
reasoning: |-
  Okay, the user runs a small left-leaning politics blog and wants to create a quiz to help their audience understand different types of egalitarianism through concrete cases. They're frustrated with comment sections where people argue past each other about equality without realizing their positions might contradict when applied to real scenarios.

  Hmm, the user wants 8-10 case-based questions that reveal underlying philosophical positions without using academic jargon. They've provided four key scenarios they know generate productive debate: disability accommodations, expensive preferences (like the wine connoisseur), religious practices, and life satisfaction surveys. 

  I notice they're particularly insightful about potential blind spots - like how the wine case might not cleanly separate preference satisfaction from resource egalitarianism as people assume. That's sharp. They also want the results to honestly acknowledge where the quiz can't distinguish between positions and if any coherent combinations are unexplored.

  The challenge is designing cases that:
  - Cover all target positions (hedonic welfare, preference satisfaction, resource egalitarianism etc.)
  - Avoid triggering partisan reflexes (e.g. framing religion in a way that doesn't automatically align with US political divides)
  - Make abstract theories tangible (e.g. "capabilities" through daily activity examples)
  - Include some "trap questions" where intuitive answers might conflict (like the life satisfaction survey)

  For scoring, I'll need to map answer patterns to positions while flagging:
  - Which views the quiz can't distinguish (e.g. sufficientarianism vs prioritarianism might collapse in some cases)
  - Any logically consistent but unattractive/unexplored combinations (e.g. someone who supports disability accommodations but rejects religious accommodations might be theoretically coherent but practically rare)

  The religious case feels especially delicate - need to present it neutrally enough that readers don't just answer based on sympathy for specific faiths. Maybe frame it as "someone who freely chooses costly practices" without specifying the religion.

  Also worth adding cases about systemic inequality (the "same opportunities" case) and brute luck (the inheritance scenario) since those test resource vs capability approaches. The lottery winner case could reveal if people distinguish between choice and luck-based inequality.

  For the results page, I'll include short explanations like: "If you picked Option A here and Option B there, that mirrors capability theorists who care about what people can do, not what they have." Naming the positions comes last - exactly as requested.
answer: |-
  Here’s a streamlined 8-question quiz with concrete cases, answer patterns mapped to philosophical positions, and transparent limitations. Designed for clarity without academic jargon.

  ---

  ### **The "What Kind of Equalizer Are You?" Quiz**
  **Instructions:** Pick the answer that *feels* fairest in each scenario. Don’t overthink—go with your gut.

  1. **Sam’s Wheelchair**  
     Sam was born with a disability requiring a $20k wheelchair to leave home. Without it, Sam is housebound.  
     - **A)** Fairness means Sam gets extra funds for the chair so they can live like others.  
     - **B)** Everyone should get the same cash amount; Sam can save up or fundraise for the chair.  

  2. **Maya’s Expensive Taste**  
     Maya trained herself to love rare $500/bottle wines. She claims her "need" for luxury wine makes her worse off than others on the same income.  
     - **A)** Her suffering is real—fairness means helping her afford the wine she craves.  
     - **B)** Tough luck—fairness isn’t subsidizing expensive hobbies.  

  3. **Riley’s Religious Practice**  
     Riley’s faith requires costly special foods and unpaid holy days off work. Riley chose this faith and finds it deeply fulfilling.  
     - **A)** Riley’s costs should be covered like Sam’s wheelchair—it’s a need for their way of life.  
     - **B)** Riley’s costs are self-chosen, like Maya’s wine—no extra support needed.  

  4. **The "Happy Slave" Survey**  
     A study shows Group X (historically oppressed) reports *equal* life satisfaction as Group Y (privileged group). A commenter says: "See? No inequality exists!"  
     - **A)** "Satisfaction ≠ fairness! Group X might be adapting to injustice."  
     - **B)** "If they’re equally happy, that *is* equality."  

  5. **Lucky Lottery vs. Hard Worker**  
     Alex wins $1M in the lottery. Taylor earns $1M through 80-hour workweeks. Both are now rich.  
     - **A)** Alex’s windfall is unearned—tax it heavily to level the field.  
     - **B)** Both played by the rules—no penalty for luck.  

  6. **The Inherited Apartment**  
     Kim inherits a rent-free apartment in a pricey city. Lee, with identical income, pays $2k/month in rent.  
     - **A)** Kim’s hidden advantage is unfair—tax the apartment’s rental value.  
     - **B)** Kim’s luck doesn’t hurt Lee—no need to "correct" it.  

  7. **The Burnout Artist**  
     Jesse quits a high-paying job to pursue art, earning little. Jesse says: "I’m poor but freer than before!"  
     - **A)** Jesse chose this path—no extra help needed.  
     - **B)** Society should support Jesse’s freedom to create, even if it’s a choice.  

  8. **The 10-Hour Commute**  
     Two workers earn identical wages: one walks 10 minutes to work, the other spends 10 hours/day commuting.  
     - **A)** The commuter deserves extra pay or housing aid to offset their burden.  
     - **B)** Same pay for same work—commute time is their personal choice.  

  ---

  ### **Scoring Key**  
  Tally your **A**/**B** answers and match to positions:  

  | **Position**               | **Core Idea**                                     | **Your Pattern**                     |  
  |----------------------------|--------------------------------------------------|---------------------------------------|  
  | **Capabilities Approach**  | "Equality in *what you can do/be*." (e.g., leave home, practice faith) | Mostly **A** on 1,3,6,8 |  
  | **Resource Egalitarianism** | "Equal resources, period." (Ignores luck/taste) | Mostly **B** on 1,2,3,5,6 |  
  | **Hedonic Welfare**        | "Equal happiness/satisfaction."                  | **B** on Q4; **A** on Q2 if sympathetic |  
  | **Preference Satisfaction**| "Equal chance to fulfill desires."               | **A** on Q2 *and* Q3; **A/B** on Q7 |  
  | **Sufficientarianism**     | "Ensure everyone has *enough*; equality beyond that is irrelevant." | **A** on Q1, *then* **B** on 2,3,5,6 |  
  | **Prioritarianism**        | "Help the worst off first, even if inequality remains." | **A** on Q1,3,8; **A** on Q5 (tax lottery) |  

  ---

  ### **Key Limitations & Quirks**  
  1. **The Wine Trap (Q2):**  
     - Picking **A** *could* signal **Hedonic Welfare** (if focused on suffering) *or* **Preference Satisfaction** (if focused on desires).  
     - *Why?* Real-world views often blend these. The quiz uses Q4 (Happy Slave) to split them: Hedonic Welfare takes **B**, Preference Satisfaction takes **A**.  

  2. **Unoccupied Combinations:**  
     - **"B on Sam’s Wheelchair (Q1) + A on Riley’s Religion (Q3)"** is coherent ("choices matter, needs don’t") but rare. Why? Most see disability as non-negotiable need, religion as choice—even if both impose costs.  

  3. **Indistinguishable Pairs:**  
     - **Sufficientarianism vs. Prioritarianism** often align (both help Sam in Q1) *unless* Q5/Q6 force a choice: Sufficientarians say "once everyone has enough, stop," Prioritarians say "keep helping the worst off."  
     - **Resource + Preference Satisfaction** blur if you pick **B** on Q2 *but* **A** on Q7 (supporting chosen lifestyles).  

  ---

  ### **How to Use This**  
  - **Blog Integration:** Add a results script (e.g., "7+ As = Capabilities Advocate") or let readers self-score.  
  - **Spark Discussion:** End with: *"Disagree with your result? That’s the point! Real debates hinge on these tensions."*  
  - **Avoid Oversimplifying:** Note that these are "ideal types"—most people hold hybrid views.  

  This forces readers to confront *applied* ethics, not labels. The wine/religion/disability trio reliably exposes contradictions in intuitive egalitarianism, while Q4 (Happy Slave) and Q5/Q6 (luck) reveal hidden assumptions about justice.
