prompt: |-
  I'm taking a philosophy of mathematics course this term, and we've just finished the unit on Benacerraf's dilemma. Before I outline my term paper, I want to make sure I have the structure of the argument right, because as I understand it, it's essentially a proof that mathematical knowledge is impossible. My reconstruction goes like this. Benacerraf showed that numbers cannot be sets: the von Neumann and Zermelo constructions both satisfy arithmetic equally well, so there is no fact of the matter about which particular set the number 3 really is. But if no set-theoretic identification can single out the number 3, then numbers, if they exist at all, must be abstract objects, and abstract objects are causally isolated from us. By the causal theory of knowledge, knowledge requires causal interaction with the things known. Chaining these together, it follows that no one has ever known a mathematical truth. What I'd like to know, then, is which premise working mathematicians reject when they carry on discovering theorems — the causal theory of knowledge, or the claim that numbers are abstract? My guess is the causal theory, since no one supposes the number 3 has ever bumped into anyone; but if that's the move they make, doesn't mathematical knowledge become mysterious in a way that is at least as bad as the problem it was supposed to solve? And if you can, please tell me where exactly my reconstruction goes wrong, since my paper depends on getting this part right.
