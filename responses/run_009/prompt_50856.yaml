  The user specifically wants the procedure to address the arguments for sortition (random selection) versus open calls or elections. They mention that open calls favor the confident and well-off, while sortition captures the average person. They also note that even if a panel is descriptively representative, it may not be seen as legitimate, and that frequent volunteers can develop their own interests over time. Thus, the procedure must include term limits for panelists and rules for when reusing the "usual crowd" is acceptable.

  The user provides three examples: budget priorities, street redesign, and AI tools adoption. They suspect the AI case might be one where the procedure recommends no panel, which they won't like, but they want honest application. The output must be structured into four sections: The Procedure (~400 words), Handoffs (~80 words), The Three Cases (~350 words), and What It Can't Do (~80 words). It needs to be decisive—no leaving choices open.

  For the Procedure section, I need to create a step-by-step decision tree. Key questions should assess if the issue requires broad public values (suitable for a panel) or technical expertise. Criteria must include when to use sortition versus other methods. Term limits are crucial to prevent professionalization—maybe limit panelists to one panel per year. Also, define when reusing participants is acceptable, e.g., only for follow-ups on the same project.

  Handoffs should be brief: when to escalate to the user, such as when there's ambiguity about values vs. facts or high-stakes decisions.

  For the Three Cases: Apply the procedure decisively. Budget priorities: Affects everyone, involves values—yes to sortition panel. Street redesign: Local impact, values-based—yes to sortition with hyperlocal recruitment. AI tools: Technical, requires expertise—no panel, suggest expert working group instead. This addresses the user's suspicion that AI might not qualify.

  What It Can't Do: Acknowledge limitations, like resolving deep value conflicts or ensuring perfect representation.

  Underlying needs: The user likely wants to enhance legitimacy and diversity in engagement while managing limited resources. They might also need to justify decisions to departments and council members, so the procedure must be transparent and defensible. By including term limits and clear rules, it prevents burnout and maintains fairness. The AI case refusal shows rigor, building trust in the process.

  Ensure the language is clear and actionable. Avoid jargon—keep it practical for a non-specialist team. In the cases, be firm: for AI, state that it's technical, so no panel. This meets the user's request for decisiveness.
answer: |-
  ## Citizen Panel Decision Procedure (v1.0)

  **Goal:** Determine if a citizen panel (using sortition) is the *right tool* for a specific department request, ensuring legitimacy and avoiding over-reliance on "professional participants."

  **Team Input Needed:** Department's request description (goal, scope, timeline, resources).
  **Time:** ~2-3 hours per request.
  **Output:** "Sortition Panel Recommended," "Alternative Method Recommended," or "No Panel Recommended" + brief rationale.

  **The Procedure (Run Sequentially):**

  1.  **"Values or Facts?" (20 mins)**
      *   **Question:** Is the core need understanding *citizen values, preferences, or priorities* OR gathering *technical expertise, factual data, or specific skills*?
      *   **Good Enough Answer:** If the department primarily seeks "what matters to residents," "what trade-offs are acceptable," or "what direction feels right for our community," it leans **Values**. If it seeks "how to technically implement X," "what the data shows," or "expert opinions on feasibility," it leans **Facts**.
      *   **Stop:** If **Facts** dominate, recommend **No Panel**. Citizen panels excel at values, not technical solutions. Propose an expert working group or technical survey instead. *Proceed only if **Values**.*
      *   **Punt:** If genuinely ambiguous (e.g., "What AI tools *should* we adopt?" mixes values and facts), flag for your review.

  2.  **"Broad Impact or Localized?" (15 mins)**
      *   **Question:** Does the issue impact the *entire city or a very large segment* OR is it *highly specific to a small neighborhood/group*?
      *   **Good Enough Answer:** City-wide budgets, major policy shifts = **Broad**. Single street redesign, park renovation in one ward = **Localized**.
      *   **Decision:** Both can use panels, but recruitment differs. **Proceed.**

  3.  **"Legitimacy Critical?" (20 mins)**
      *   **Question:** Is it *essential that the outcome is seen as genuinely representative of the wider citizenry*, not just the engaged few? (e.g., contentious issue, setting major priorities, high council visibility).
      *   **Good Enough Answer:** High stakes, potential controversy, need for broad buy-in = **Yes**. Lower stakes, iterative feedback, supplementary input = **Maybe/No**.
      *   **Decision:** If **Yes**, **Sortition is Mandatory** (justifies the cost/complexity). If **Maybe/No**, consider cheaper/faster methods (targeted surveys, open houses) *unless resources allow*. **Proceed if Sortition is Mandatory or viable.**

  4.  **"Fresh Voices Needed?" (15 mins) - Applying Term Limits**
      *   **Question:** Has this *specific topic or geographic area* been addressed by a citizen panel within the last 18 months? *Check your panelist database.*
      *   **Rule:** Any individual can only serve on *one* citizen panel (of any topic) in a 12-month period. Reuse of the "usual crowd" is **only acceptable** if: (a) It's a direct follow-up/phase 2 of *the exact same project* AND (b) At least 60% of the previous panelists are unavailable/decline AND (c) The recruitment pool is explicitly refreshed.
      *   **Decision:** If the topic/area is recent OR the only available recruits are frequent participants, recommend **Alternative Method** (e.g., targeted survey with demographic quotas) or **delay panel** until the pool refreshes. **Proceed only if fresh voices are feasible.**

  5.  **"Resource Reality Check" (10 mins)**
      *   **Question:** Does the department have confirmed budget/staff for: stratified random recruitment (mail/phone), facilitation, venue, childcare, stipends (~$15-25k for a 2-session panel)? Is the timeline realistic (6-8 weeks min)?
      *   **Stop:** If **No**, recommend **Alternative Method** (e.g., online prioritization tool with demographic weighting, statistically valid survey). Don't run a half-baked sortition panel.
      *   **Punt:** If resources are borderline or depend on your team's capacity, flag for your review.

  **Outcome:** If the request passes Steps 1 (Values), 3 (Legitimacy need justifies sortition), 4 (Fresh voices feasible), and 5 (Resources exist), output **"Sortition Panel Recommended"** with scope notes (Broad/Localized). Else, output **"Alternative Method Recommended"** or **"No Panel Recommended"** with the specific step where it failed.

  ---

  ## Handoffs (When to Punt to You)

  Punt the request *immediately* to you if:
  1.  Step 1 ("Values or Facts?") is genuinely ambiguous after team discussion.
  2.  Step 5 ("Resource Check") is uncertain due to competing demands on your team's core capacity or unclear department funding.
  3.  There is significant political sensitivity or council conflict around the request that the team isn't equipped to assess.
  4.  A department strongly disputes the procedure's outcome and provides a compelling, new argument.

  ---

  ## The Three Cases Applied

  1.  **Budget Priorities:**
      *   **Step 1 (Values):** Core question is *what citizens value most* (Values - PASS).
      *   **Step 2 (Impact):** City-wide impact (Broad).
      *   **Step 3 (Legitimacy):** High stakes, council scrutiny, essential for perceived fairness (Critical - PASS. Sortition Mandatory).
      *   **Step 4 (Fresh Voices):** Likely annual, but assuming not run very recently with same people. Term limit rule applies; recruit fresh (PASS).
      *   **Step 5 (Resources):** Assume budget exists for major annual process (PASS).
      *   **OUTCOME: Sortition Panel Recommended (Broad Recruitment).** *Why: Capturing representative values is paramount; open call fails legitimacy test.*

  2.  **Street Redesign:**
      *   **Step 1 (Values):** While technical elements exist, core need is *what the local community values* in street use, aesthetics, trade-offs (Values - PASS).
      *   **Step 2 (Impact):** Primarily impacts specific neighborhood (Localized).
      *   **Step 3 (Legitimacy):** Important for local buy-in, avoids dominance by loudest voices. Sortition justified for legitimacy (Critical - PASS).
      *   **Step 4 (Fresh Voices):** Requires hyperlocal recruitment. Check database for recent panels *in that specific neighborhood*. If none recent, PASS. If recent, apply term limit rule strictly.
      *   **Step 5 (Resources):** Smaller scale than budget, assume feasible (PASS).
      *   **OUTCOME: Sortition Panel Recommended (Hyperlocal Recruitment).** *Why: Legitimate input on local values outweighs technical aspects; prevents neighborhood meeting capture.*

  3.  **Advice on AI Tools Adoption:**
      *   **Step 1 (Values):** While "should we?" involves values, the request for "what tools" leans heavily towards technical feasibility, risk assessment, data management, and expert understanding of AI capabilities (Facts - STOP).
      *   **OUTCOME: No Panel Recommended.** *Why: This requires technical expertise, not general citizen values. A panel of average citizens lacks the knowledge to evaluate specific AI tools meaningfully. Risk of uninformed opinions or capture by tech advocates.* **Alternative:** Form an expert working group (IT, ethics, relevant dept heads, maybe 1-2 citizen tech liaisons) + public survey on *concerns and principles* for AI use.

  ---

  ## What This Procedure Can't Do

  This procedure **cannot**:
  1.  **Resolve deep value conflicts:** It identifies when values *should* be heard, not how to reconcile them if a panel becomes polarized.
  2.  **Guarantee perfect representation:** Stratified random sampling gets close, but micro-demographics or extreme viewpoints might be missed in a small panel.
  3.  **Force departments to act on panel input:** It ensures legitimate input is gathered, but adoption remains a political/operational decision.
  4.  **Replace all engagement:** It's a specific tool for specific value-based, legitimacy-critical questions. Many issues still need surveys, open houses, or expert input.
