answer: |-
  Based on the patterns in Maya's past decisions and the principles that seem to drive her sunk-cost reasoning, I'll break this down step by step: **predicting her responses to the new cases**, **identifying the core rule she's likely using**, **contrasting it with alternative rules**, and **proposing a test case to definitively settle which rule she runs**. The key is that Maya's approach isn't purely economic (i.e., "always ignore sunk costs") but psychological, blending commitment, identity, and perceived ownership.

  ### 1. Predictions for the New Cases
  - **Daniel (engineering degree, one semester left, not his choice)**: Maya will advise him to **quit**. 
    - Why? Daniel's degree was "arranged and paid for" by his father, meaning it lacks personal agency. Even though he's near the end (one semester), Maya's past behavior (e.g., telling her cousin to quit a parent-pushed PhD, advocating to cancel the bridge started by an earlier administration) shows she dismisses sunk costs when the project wasn't truly chosen by the person. The sunk costs (time/money) "don't count" because they weren't authentically invested by Daniel—they're his father's project.
    
  - **Maya's Marathon (self-chosen, 2 weeks in, wants out)**: She will **continue**. 
    - Why? She designed and publicly announced the training plan, making it a deliberate, personal commitment. Her history (e.g., finishing the hated novel, sticking with PhD/tickets) shows she honors sunk costs when she owns the choice, even if she's far from completion or has lost interest. Quitting now would feel like a public failure or a betrayal of her own agency, so she'll likely grind it out despite the early stage.

  ### 2. The Core Rule Maya Is Running
  After analyzing all five past verdicts and the new cases, Maya's consistent underlying rule is:  
  **"Honor sunk costs only when you have high personal agency—meaning you deliberately chose and claimed ownership of the project."**  

  - **How this fits all cases**:
    - **Novel (finish)**: Self-chosen, so sunk costs honored despite hating it.
    - **Bridge (cancel)**: Chosen by "earlier administration," not her/current decision-makers, so sunk costs ignored.
    - **Her PhD (finish)**: Self-chosen, so sunk costs honored even without wanting the degree.
    - **Season tickets (attend games)**: Self-chosen and prepurchased, so sunk costs honored (each game is a "mini-completion" reinforcing ownership).
    - **Cousin's PhD (quit)**: Parents "pushed him," so low agency—sunk costs irrelevant.
    - **Daniel (predicted: quit)**: Father arranged/paid, so low agency—sunk costs ignored despite proximity.
    - **Marathon (predicted: continue)**: Self-chosen/designed/announced, so high agency—sunk costs honored despite early stage.

  Personal agency here isn't just about initial choice—it's about **ongoing psychological ownership**. If Maya (or someone) claims a project as "theirs" (e.g., through public commitment, personal design, or framing it as part of their identity), sunk costs become meaningful. If agency is low (e.g., external pressure, inherited projects), sunk costs are ignored regardless of other factors.

  This rule is psychologically intuitive: honoring sunk costs for self-chosen projects avoids cognitive dissonance (e.g., "I picked this, so I must see it through"), while ignoring them for low-agency projects reduces guilt ("This was never really mine, so I'm not responsible").

  ### 3. How the Other Rules Conflict with the New Cases
  The alternative rules you proposed fit the past cases but break on Daniel and the marathon. Here's why:

  - **Rule A: "Honor sunk costs when near the end"**  
    - **Conflict on Daniel**: Proximity (one semester left) says "finish," but Maya's agency rule predicts "quit."  
    - **Conflict on Marathon**: Proximity (2/16 weeks, far from end) says "quit," but agency rule predicts "continue."  
    - *Why it fit past cases*: In all five, proximity aligned with agency (e.g., novel/PhD near end + high agency; bridge/cousin not near end + low agency). The tickets were "near the end" only because Maya framed each game as a discrete unit—but this was likely a *consequence* of agency (she owned the tickets, so she segmented the cost).

  - **Rule B: "Honor sunk costs only when the person deliberately chose the project"**  
    - *This is almost identical to the agency rule, but note subtle differences*: Rule B focuses on initial choice, while agency includes ongoing ownership (e.g., announcing the marathon made it "hers" even if regret sets in). Rule B fits all cases except it *doesn't explain the marathon prediction*—initial choice alone would say "continue," which matches, but agency adds nuance like public commitment.

  - **Potential Rule C: "Honor sunk costs based on whose money it is"**  
    - **Fails past cases**: Money source is inconsistent. She honored sunk costs for tickets (her money) but ignored them for the bridge (public money). She finished her PhD (her effort, not just money) and the novel (no money involved).  
    - **Conflict on Daniel**: Father paid, so Rule C might say "honor sunk costs to respect his investment," but Maya will likely ignore them (low agency).  
    - **Conflict on Marathon**: Her money/effort, so Rule C says "continue," which matches—but this rule doesn't fit the bridge or cousin cases.

  The agency rule is the simplest and most consistent: it covers all verdicts without exceptions, and it explains why Maya sometimes seems irrational (e.g., finishing the PhD)—it's about identity, not logic.

  ### 4. A Test Case to Settle Which Rule She Uses
  To definitively distinguish between "agency" and "proximity," you need a hypothetical where they *conflict*—something that wasn't possible in past cases since they always aligned. Propose this to Maya:

  > **"Imagine a friend who *chose and paid for* a non-refundable, week-long cooking class because they were excited about it. After the first day (20% in), they realize they hate it and the instructor is terrible. Should they stick it out or quit?"**

  - **Why this test works**: 
    - **High agency**: Self-chosen and paid for (like Maya's tickets or marathon). 
    - **Low proximity**: Only 20% done, far from the end (like the bridge or cousin's PhD). 
    - **Prediction based on agency rule**: Maya says "finish" because it was their choice, and quitting would waste their investment and undermine ownership. 
    - **Prediction based on proximity rule**: Maya says "quit" because it's early, with most costs still ahead. 
    - *Crucially, this isolates agency vs. proximity*: Past cases like the marathon (high agency, low proximity) or Daniel (low agency, high proximity) involve other factors (e.g., social pressure), but this test is cleaner.

  If Maya says "finish," agency is confirmed. If she says "quit," proximity wins—but her history suggests agency is dominant. This test also avoids emotional baggage (unlike Daniel or her marathon).

  ### Final Thought: What This Reveals About Maya
  Maya isn't following textbook economics; she's using sunk costs as a tool for **self-consistency**. When she owns a project, honoring sunk costs preserves her self-image as someone who follows through (e.g., "I finish what I start"). When agency is low, ignoring sunk costs allows her to cut losses without guilt. It's a way to manage regret and identity. If you want to understand her deeper, probe how she defines "ownership"—e.g., does announcing the marathon make it "hers" even if she hates it now? (Likely yes.) This pattern might extend beyond sunk costs to how she handles commitments in general.
