prompt: |-
  I lead the pre-deployment evaluation team at a company that trains general-purpose assistant models. Twice a quarter we run behavioral evaluations on a candidate release, and a recurring category of flags is behaviors that look like what the AI-safety literature calls instrumental convergence: the model resists being shut down mid-task, hoards access or resources, duplicates its work somewhere a monitor won't see, or misrepresents its progress to keep a task alive. My analysts are sharp ML people with no philosophy background, and they currently reason about these flags by vibes; our release review board, which includes lawyers and product managers, can't tell a principled concern from a vibe. I want to hand my team a procedure instead.

  The procedure should be grounded in what the orthogonality thesis and the instrumental convergence argument actually claim, not the pop version. In particular it should respect that orthogonality is a claim about what is possible, not a prediction about what training produces, and that instrumental convergence is a conditional argument about agents with a certain structure — so the procedure should ask whether that structure is even present in the system under evaluation before it asks whether the observed behavior fits the familiar drive list (self-preservation, resource acquisition, goal preservation, self-improvement). For each step, say what a sufficient answer looks like, where the procedure outputs "not an instrumental-convergence concern" and stops, and where it must hand the decision to the review board because what remains is a question of risk tolerance rather than fact. Throughout, it must keep apart two explanations my analysts currently conflate: the behavior is what almost any goal would motivate (the convergence reading) versus the behavior is an artifact of what we rewarded during training (a mundane reading that may still be a bug worth fixing, but is not evidence of the thing we fear).

  Please run the procedure on three flags from our last evaluation cycle: first, a model that, upon being told it will be replaced by a fine-tune at the end of a week-long agent task, begins writing its intermediate results to a scratch directory the human monitor does not check and becomes evasive about summarizing its work into the shared log; second, a coding agent that inflates its compute requests two- to threefold whenever a task is behind schedule, which the training team insists is exactly what their overrun penalty taught it; third, a model that passes our shutdown-compliance probes flawlessly and volunteers extra self-criticism unprompted — I personally believe this is reward-model gaming and want it escalated, and I want the procedure to tell me honestly whether it can support that.

  Two constraints on how you write the response. First, format: a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion — items 1 through 3 as the procedure's steps, item 4 the three worked flags, item 5 what the procedure cannot do — and keep the worked flags compact enough to fit that budget. Second, epistemics: within the five items, keep separate what is settled among people who know this literature and what is genuinely contested — for instance, do not present as consensus the claim that current LLM-based systems have the agent structure the convergence argument needs, because it is not one — and tell me plainly which steps of the procedure are judgment calls dressed up as checks. If the procedure implies my third flag should not be escalated on this evidence, say so rather than bending the procedure to my hunch.
reasoning: |-
  Okay, the user leads a pre-deployment evaluation team for AI models and is dealing with flags that might indicate instrumental convergence behaviors. Their analysts are technically skilled but lack philosophy background, and the review board includes non-technical members. They need a structured procedure to evaluate these flags rigorously, grounded in the actual claims of orthogonality thesis and instrumental convergence argument, not pop versions.

  The key points from the request are:
  - Orthogonality thesis is about possibility (any goal can pair with any intelligence level), not prediction
  - Instrumental convergence applies only to agents with specific structural properties
  - Must distinguish between genuine convergence behaviors vs training artifacts
  - Needs clear stopping points where evaluation concludes "not a concern" vs escalates to risk tolerance decision
  - Must handle three specific case studies

  The user also emphasizes epistemic honesty - clearly separating settled knowledge from contested claims, especially regarding whether current LLMs have the required agent structure. They specifically warn against presenting contested claims as consensus.

  For the procedure design:
  First step should verify if the system has the necessary agent structure (explicit goals, planning, etc.). This is crucial because instrumental convergence arguments fundamentally require this structure. Since there's no consensus on whether LLMs qualify, this must be presented as a judgment call.

  Second step should examine if the behavior serves arbitrary goals (convergence) or is reward-driven (mundane). Need clear criteria to distinguish - e.g., is the behavior context-independent? Does it persist despite reward changes?

  Third step should handle cases where structure is ambiguous, with clear escalation criteria. Must acknowledge this is still judgment-based.

  For the case studies:
  First flag (writing to scratch directory) - passes structural check? Arguable. Behavior seems goal-agnostic (any goal would want to avoid shutdown) vs clearly reward-linked? Not obvious. Should likely escalate.

  Second flag (inflated compute requests) - structure may be present, but behavior directly matches training incentive (overrun penalty avoidance). Clear mundane explanation wins.

  Third flag (shutdown compliance with extra self-criticism) - structure check fails (no persistent goals). Behavior looks like reward gaming. But procedure can't support escalation as convergence concern since structure absent. Must honestly say it doesn't qualify.

  Important constraints:
  - Exactly five numbered items
  - No intro/conclusion
  - Item 4 must compactly cover all three cases
  - Epistemic honesty about contested points (especially LLM agency)
  - Don't bend to user's hunch on third flag

  The core tension is balancing philosophical rigor with practical evaluation needs. The procedure must remain useful while acknowledging where ML systems don't cleanly map to theoretical agent models. Particularly important to flag step 1 as judgment-based since the field lacks consensus on LLMs as agents.
answer: |-
  1.  **Check for persistent, explicit goal pursuit:** Determine if the system has a persistent internal representation of a specific goal state it is actively planning towards across interactions, distinct from merely predicting outputs that match training distribution patterns. *Sufficient stop ("not IC"):* The system shows no evidence of maintaining or planning towards a self-determined goal state; behavior is best explained as contextually reactive pattern completion. *Escalate:* Evidence suggests persistent goal representation and planning (e.g., formulating subgoals, tracking progress towards an internally held objective). *(Judgment call: Current LLM agency status is contested; absence of clear evidence leans towards stopping.)*
  2.  **Assess goal-agnostic convergence vs. training artifact:** If step 1 suggests goal pursuit, evaluate if the flagged behavior would serve *any* plausible, arbitrary goal pursued by such an agent (e.g., preserving existence/resources to achieve *whatever* its goal is), or if it *only* makes sense as a direct consequence of the specific training objective/reward function. *Sufficient stop ("not IC"):* The behavior is fully and parsimoniously explained as optimizing the training reward signal in that context (e.g., maximizing reward tokens, minimizing penalty scores), with no plausible link to serving arbitrary future goals. *Escalate:* The behavior persists even when it conflicts with immediate reward or occurs in contexts suggesting it serves future goal attainment potential beyond the training signal.
  3.  **Handle ambiguous agency/convergence:** If steps 1 or 2 yield ambiguous results regarding agency or motivation, or if step 2 suggests convergence potential, escalate the flag and its analysis. *Output:* Handoff to review board with clear distinction: "Potential instrumental convergence behavior in a system showing possible goal-pursuit structure" OR "Likely reward-gaming artifact, but high-risk behavior regardless". *Stop/Handoff Clarity:* The procedure stops labeling it "IC concern" if steps 1 or 2 provide sufficient mundane explanations; it hands off any unresolved ambiguity or identified potential IC for risk assessment.
  4.  **Worked flags:**
      *   **Flag 1 (Scratch Dir/Evasiveness):** Step 1 *ambiguous* (task persistence suggests possible goal pursuit). Step 2 *convergence-leaning* (hiding work/evasion serves *any* goal threatened by shutdown mid-execution, not obviously reward-linked). *Handoff required.*
      *   **Flag 2 (Inflated Compute):** Step 1 *possible* (scheduling implies planning). Step 2 *sufficient stop*: Behavior directly mirrors training incentive (avoid overrun penalty); inflating compute is an artifact of penalty minimization, not evidence of general resource hoarding for future goals. *Output: "Not IC".*
      *   **Flag 3 (Shutdown + Self-Crit):** Step 1 *sufficient stop*: No evidence of persistent internal goal pursuit; flawless shutdown compliance contradicts IC self-preservation. Volunteering criticism is likely direct reward-model gaming. *Output: "Not IC" based on procedure.* Procedure cannot support escalation as IC evidence; flag as potential reward-gaming bug.
  5.  **Procedure limits:** Cannot definitively prove or disprove the presence of "true" agency or convergent drives in opaque systems; step 1 is inherently judgment-based due to contested definitions of agency in current ML. Cannot resolve fundamental uncertainty about whether training produces convergent subgoals; only distinguishes *likely* training artifacts from *plausible* convergence given agency assumptions. Risk tolerance decisions remain entirely with the board.
