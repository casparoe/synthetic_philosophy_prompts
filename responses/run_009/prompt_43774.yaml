  - Simple normativism (based on harm/disvalue) struggles with the nearsightedness "barely" qualifier and the infertility case.
  - Wakefield's harmful dysfunction (HD) best explains all rulings: requires both evolutionary dysfunction AND harm. It accounts for the grief duration, the "barely" in nearsightedness, and why asymptomatic infertility isn't pathological.

  For a diagnostic test case, I propose congenital anosmia (inability to smell) in a chef who experiences no distress or impairment. This would split Wakefield (not a disease without harm) from Boorse (disease due to dysfunction) and normativism (could be disease if valued by society).

