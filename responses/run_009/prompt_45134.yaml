prompt: |-
  I'm a third-year philosophy student currently taking a seminar on classical Indian epistemology, where we've spent several weeks on the Nyāya school's theory of the pramāṇas — perception, inference, comparison, and testimony as the four accepted sources of knowledge — along with their account of doubt (saṃśaya), the requirement of a provable universal concomitance (vyāpti) between a sign and what it's supposed to establish, the reliability conditions on testimony from an āpta, and tarka's status as a supporting form of reasoning rather than an independent source of knowledge. I also have a practical role that this material keeps making me think about: I'm the head verifier for our university's student-run science and policy magazine, which publishes short explainers and news summaries. Each week my team of six volunteer editors — none of whom have any philosophy background, and most of whom are first- or second-year students in the sciences — has to decide which claims in submitted articles we can publish as established, which we have to hedge, and which we have to send back, with roughly half an hour of checking time per claim and no access to most paywalled literature.

  I'd like you to turn the Nyāya framework into a decision procedure my editors could actually run on a claim before publication. The procedure should tell them what to ask, in what order, and what counts as a sufficient answer at each step: for instance, how to determine whether a claim rests on our own perception (almost never, in journalism), on an inference whose sign-to-conclusion concomitance we can actually check, on a comparison or analogy, or on testimony — and if on testimony, whether the speaker is reliable enough in the relevant way that we can treat it as knowledge rather than as something merely reported. It should handle the hard cases: claims that stack layers of testimony (a scientist summarizing a study for a journalist who summarizes it for us), inferences where the vyāpti can't be verified in half an hour, arguments that look like inference but are really analogy dressed up, and places where tarka-style "if the opposite were true, things we already know would break" reasoning can legitimately support a claim without establishing it. And it should be explicit about where the procedure stops with a rejection, where it stops with a hedge, and where it hands the decision to me because the question is one of credibility judgment or editorial values rather than something a checklist can settle.

  Then run the procedure on three claims so we can see it work: first, an article citing a single peer-reviewed study, behind a paywall we can't get through, finding that a popular study-habit app improves exam performance in a forty-student trial; second, an opinion piece arguing that a congestion-charge policy that succeeded in one European capital will work in our mid-sized city, on the grounds that the cities are "basically the same kind of place"; third, a claim from a well-known and liked professor on our own campus, told to one of our writers at a departmental event, that a widely reported archaeological discovery is probably a mislabeled forgery — a claim our editors would love to publish and that may well be true. For the last one especially, I want to see whether the procedure gives the answer we want or the answer the framework actually supports. Finally, be honest about where the procedure will misfire: which parts of the Nyāya theory had to be distorted beyond recognition to make it usable at this speed, which steps are judgment calls dressed up as procedure, and which of the school's live disputes with its rivals — the Buddhist reduction of the pramāṇas to two, the Mīmāṃsā insistence that testimony is self-validating, the Cārvāka acceptance of perception alone — the procedure quietly takes a side on without telling the user.
reasoning: |-
  We are going to create a decision procedure based on the Nyāya framework for verifying claims in a journalism context. The procedure will have a series of steps that editors can follow to determine whether to accept a claim as established, require hedging, or reject it. The steps will correspond to the four pramāṇas (perception, inference, comparison, testimony) and also account for doubt, vyāpti (universal concomitance for inference), and tarka (supplementary reasoning). We'll also incorporate the reliability of testimony (āpta).

  The procedure steps:

  1. **Perception (Pratyakṣa)**: Can the claim be verified by direct perception (by the editors or via direct evidence they can access)? 
     - If yes, then the claim is established (provided the perception is not erroneous).
     - If not, move to step 2.

  2. **Inference (Anumāna)**: Is the claim based on an inference? 
     - Check if the inference has a valid sign (hetu) and whether the universal concomitance (vyāpti) between the hetu and the sādhya (what is to be proved) can be verified within the time constraints (half an hour). 
     - If the vyāpti is well-established (e.g., by prior knowledge, a known scientific law, or a quick check of reliable sources) and the hetu is present, then the claim is established. 
     - If the vyāpti cannot be verified in time, move to step 3 (comparison) or step 4 (testimony) if the inference is based on one of these, or if the inference is too complex, then hedge or reject.

  3. **Comparison (Upamāna)**: Is the claim based on an analogy or comparison? 
     - Check if the analogy is valid: are the two things being compared similar in the relevant aspects? 
     - If the similarity is strong and the relevant properties are shared, then the claim might be established, but often in journalism, analogies are weak and require hedging. 
     - If the analogy is weak, move to step 4 or consider hedging.

  4. **Testimony (Śabda)**: Is the claim based on testimony? 
     - Determine the source: is it an āpta (reliable speaker) in the relevant domain? 
     - Check the reliability of the speaker: 
          - Are they knowledgeable in the domain? 
          - Are they truthful? 
          - Are they speaking without deception? 
     - If the source is reliable, then the claim can be established. 
     - If the source is not clearly reliable, then hedge or reject.

  5. **Tarka (Suppositional Reasoning)**: If the claim is not established by the above, can it be supported by tarka? 
     - Consider: if the opposite of the claim were true, would it lead to an absurdity or contradiction with established knowledge? 
     - If yes, then the claim can be supported (but not established) and might be published with a hedge. 
     - Tarka alone cannot establish a claim, so it is only a supporting tool.

  6. **Doubt (Saṃśaya)**: If at any step there is significant doubt (e.g., conflicting evidence, lack of clarity, or the possibility of error), then the claim must be hedged or rejected.

  Additionally, we have to consider:
  - **Time constraint**: 30 minutes per claim.
  - **Access**: No paywalled literature.

  We'll design the procedure as a flowchart of questions:

  **Start:**
    - Claim: [Input the claim]

  **Step 1: Perception**
    - Can we directly perceive (or access direct evidence for) the claim? (e.g., via our own senses, public data, or open-access primary sources)
      - **Yes**: Establish the claim. (But note: in journalism, this is rare for most claims.)
      - **No**: Go to Step 2.

  **Step 2: Inference**
    - Is the claim presented as an inference? (Look for words like "because", "since", "therefore", or indicators of a sign leading to a conclusion.)
      - **No**: Go to Step 3 or Step 4 (depending on the nature of the claim).
      - **Yes**: 
          - Identify the hetu (the reason) and the sādhya (the conclusion).
          - Can we verify the vyāpti (the universal relationship between hetu and sādhya) within 30 minutes? 
            - **Yes**: 
                - Is the vyāpti well-established? (Check via open sources, known facts, or expert consensus that we can access quickly.)
                    - **Yes**: Establish the claim.
                    - **No**: Hedge (due to doubt about the vyāpti) or reject.
            - **No**: 
                - Can we treat the inference as based on testimony (if the inference is from a source)? Then go to Step 4 to check the testimony.
                - Or, is the inference actually based on an analogy? Then go to Step 3.
                - Otherwise, hedge or reject.

  **Step 3: Comparison (Analogy)**
    - Is the claim based on a comparison (e.g., "like X, so Y", "similar to X, therefore Y")?
      - **No**: Go to Step 4.
      - **Yes**:
          - Identify the two things being compared and the property in question.
          - Can we verify that the two things are similar in the relevant aspects? (Check: are there known similarities? Are there critical differences? Use open sources.)
            - **Yes, and the similarity is strong and relevant**: 
                - Establish the claim, but note that analogical reasoning is weaker and might require a hedge (e.g., "based on similar cases").
            - **No, or the similarity is weak or irrelevant**: 
                - Hedge or reject.

  **Step 4: Testimony**
    - Is the claim based on someone else's word? (e.g., a study, an expert, a report)
      - **No**: Then we have no pramāṇa to support the claim. Reject or send to Step 5 (tarka) if applicable.
      - **Yes**:
          - Trace the testimony chain: who is the original source? (e.g., the scientist, the study, the professor)
          - Can we access the original source? (If behind paywall and we can't get it, then we are relying on secondary testimony.)
          - Check the reliability of the source (āpta criteria):
              - Is the source an expert in the relevant domain? (Check credentials, domain relevance)
              - Is the source known for truthfulness? (Check reputation, any history of deception)
              - Is there a possibility of deception or error? (Check for conflicts of interest, methodological flaws if known)
          - If the source is reliable (āpta) and the testimony is about their domain of expertise, then we can establish the claim.
          - If the source is not reliable or we cannot verify reliability, then:
              - If the claim is from a chain (e.g., journalist reporting a study), we must check the reliability of each link? (Not feasible in 30 minutes) -> Then we hedge or reject.
          - Also, note: if the testimony is about something that could be known by perception or inference, then we must have a reason why we are using testimony (e.g., we don't have access to the direct evidence).

  **Step 5: Tarka (if not established by above)**
    - Can we support the claim with tarka? (i.e., if the opposite were true, would it lead to an absurdity or contradiction with established facts?)
      - **Yes**: Then we can note that the claim is supported by reasoning but not proven. Hedge the claim (e.g., "it is reasonable to conclude that...").
      - **No**: Then we have no support. Reject the claim.

  **Step 6: Doubt and Final Decision**
    - At any step, if there is significant doubt (saṃśaya) due to:
        - Conflicting evidence
        - Lack of clarity
        - Possibility of error
        - Complexity beyond time constraints
      then we must hedge or reject.
    - Also, if the claim is about values or policy and not just facts, then it might require editorial judgment (send to head verifier).

  **Hedging**: Use words like "according to", "reports suggest", "may", "might", "some evidence indicates", etc.

  **Rejection**: The claim is not supported by any pramāṇa we can verify in time.

  **Head Verifier Cases**: 
    - When the reliability of a source is borderline and the claim is important, we might need a judgment call.
    - When the claim involves values or policy implications that go beyond epistemology.

  Now, let's run the three test cases:

  ### Case 1: Claim from a peer-reviewed study (paywalled) that a study-habit app improves exam performance in a forty-student trial.

  - Step 1: Perception? We cannot directly perceive the results (no access to the study). -> Step 2.
  - Step 2: Inference? The claim is not presented as an inference (it's a report of a study). -> Step 4 (testimony).
  - Step 4: Testimony? 
      - The claim is based on a peer-reviewed study (original source) but we cannot access it (paywalled). We are relying on secondary testimony (the article citing it).
      - We must check the reliability of the original source (the study) and the secondary source (the article).
          - Original source: peer-reviewed study. Peer review is a mark of reliability, but we cannot verify the study's methods or data because of the paywall. 
          - Secondary source: the article. Is the article accurately reporting the study? We cannot check without the study.
      - Also, the study sample is small (40 students) which might raise doubt.
      - Conclusion: We cannot verify the original testimony. We can try to check the secondary source (the article) for how it reports the study, but without the study, we are uncertain.
      - We must hedge: "A peer-reviewed study reported that ..." or "According to a study, ...". Also, note the small sample size if possible.

  ### Case 2: Opinion piece arguing that a congestion-charge policy that succeeded in one European capital will work in our mid-sized city, on the grounds that the cities are "basically the same kind of place".

  - Step 1: Perception? We cannot directly perceive the outcome of the policy in our city. -> Step 2.
  - Step 2: Inference? The claim is presented as an inference: because the cities are similar, the policy will work. But note: the inference is based on an analogy. So we go to Step 3.
  - Step 3: Comparison (Analogy):
      - The two cities: European capital vs. our mid-sized city.
      - What are the relevant similarities? (e.g., traffic patterns, public transport, population density, culture, etc.)
      - We must check: are the cities similar in the relevant aspects? 
          - We can quickly check open sources for data on population, traffic, etc.
          - But note: the European capital is likely much larger and has different infrastructure. Also, the claim says "basically the same kind of place" without specifics.
      - We find: there are significant differences (size, public transport, culture). The analogy is weak.
      - Conclusion: The analogy is not strong enough to establish the claim. We must hedge: "Drawing an analogy to [European capital], the piece argues that ... but the applicability to our city is uncertain." or reject the claim as stated.

  ### Case 3: Claim from a well-known and liked professor that a widely reported archaeological discovery is probably a mislabeled forgery.

  - Step 1: Perception? We cannot directly perceive the artifact. -> Step 2.
  - Step 2: Inference? The professor might have inferred this, but we don't have his reasoning. The claim is presented as his testimony. -> Step 4.
  - Step 4: Testimony:
      - Source: a well-known and liked professor on our campus.
      - Reliability (āpta criteria):
          - Domain expertise: Is the professor an expert in archaeology? (We must check: if he is in the art history or archaeology department, then yes. If not, then no.)
          - Truthfulness: Well-known and liked, but that doesn't guarantee truthfulness. We must check if he has a reputation for accuracy and honesty.
          - Possibility of error: Without knowing his evidence, there is a chance of error. Also, the claim is about a forgery, which might be controversial.
      - We can quickly check: 
          - His department and expertise (if he is not in a relevant field, then not reliable).
          - Any known controversies about him? (Probably not in 30 minutes, but we can check his profile on the university website.)
      - Also, note: the claim is about a widely reported discovery. There might be other experts who disagree. 
      - If the professor is an expert in the relevant domain and has no conflict of interest, then we can treat his testimony as reliable? 
          - But note: Nyāya requires that the testimony be about something that is within the speaker's knowledge (by perception or inference). We don't know how the professor knows.
      - However, in journalism, we often report expert opinions. But we must be cautious: the professor says "probably", so it's not certain.
      - Also, the claim is that it is "probably" a forgery, so it's already hedged. But the editor must decide if we can attribute it without verification.
      - Given the time, we can only rely on the professor's reliability. If he is an expert and we have no reason to doubt, then we can publish as his opinion. 
      - We must hedge: "Professor X stated that ..." and not present it as fact.

  But note: the editors would love to publish because the professor is well-liked. The procedure might lead to publishing with attribution (hedging) if the professor is an expert. If not, then we might reject or send to head verifier.

  However, if the professor is not an expert in archaeology, then we cannot rely on his testimony for this claim. We must reject or hedge heavily.

  **Honesty about misfires and distortions:**

  1. **Distortions**:
     - **Testimony**: The Nyāya school requires that the speaker be an āpta (reliable) and that the testimony be about something that is within the speaker's direct knowledge (by perception or inference). In journalism, we often have chains of testimony and we don't check the original source's knowledge. We rely on institutional credibility (e.g., peer review) but cannot verify the original perception/inference. We've reduced this to checking the speaker's credentials and reputation quickly, which is a simplification.
     - **Inference**: Checking vyāpti in 30 minutes is often impossible for complex scientific or social claims. We've allowed moving to testimony if the inference is based on a source, but that's not pure inference. Also, we've collapsed the steps of inference (hetu, sādhya, vyāpti) into a quick check.
     - **Comparison**: Nyāya's upamāna is about learning from similarity (e.g., a cow is like a gavaya). We've turned it into analogical reasoning, which is a broader use. Also, we require a quick check of relevant similarities, which might be superficial.
     - **Tarka**: We use it as a last resort and only for support, which is in line with Nyāya, but we don't require a full logical analysis.

  2. **Judgment calls dressed as procedure**:
     - Deciding if a source is an āpta: This requires judgment about expertise and truthfulness, which we try to make by checking credentials and reputation, but it's subjective.
     - Determining the strength of an analogy: What counts as "relevant similarities"? This is a judgment call.
     - When to hedge vs. reject: The procedure doesn't give strict rules, so it's a judgment.

  3. **Taking sides in disputes**:
     - **Number of pramāṇas**: We accept the Nyāya four, but in practice we use testimony as the most common, which goes against the Cārvāka (perception only) and the Buddhist (perception and inference only). We also accept testimony from non-āpta if we can't verify (with hedging), which might go against strict Nyāya.
     - **Testimony**: We do not treat testimony as self-validating (against Mīmāṃsā) but require reliability checks.
     - **Inference**: We require vyāpti to be verified, which is strict Nyāya, but we allow that sometimes we rely on testimony for the vyāpti.

  The procedure will misfire in cases where:
     - The vyāpti is complex and cannot be checked in time (so we might reject a valid inference).
     - Testimony chains are long and we cannot verify the original source (so we hedge even when the claim is true).
     - Analogies are weak but we don't have time to research the differences (so we might reject a good analogy or accept a bad one).

  Overall, the procedure is a practical adaptation that prioritizes speed and feasibility, but it sacrifices some of the rigor of the Nyāya framework.
answer: |-
  ### Nyāya-Inspired Verification Procedure for Journalism
  Here's a streamlined decision procedure based on Nyāya epistemology, designed for non-philosopher editors working under time constraints. The process prioritizes **actionable checks** over theoretical perfection, with explicit exit points for rejection/hedging and flags for head-verifier escalation.

  ---

  ### **The Procedure: 6-Step Checklist**
  *(Run sequentially; stop when a decision is reached)*

  1. **PERCEPTION CHECK**  
     *Ask: "Can we directly observe this claim with minimal interpretation?"*  
     - **✓ Establish** if: Verifiable through public data, video, or replicable experiment *we can access* (e.g., "City Hall announced X on its website").  
     - **✗ Reject** if: Requires lab equipment, confidential data, or privileged access.  
     - **→ Next**: If no, proceed to Step 2.  
     *Journalism reality: This rarely passes.*

  2. **INFERENCE DECONSTRUCTION**  
     *Ask: "Is this claim based on a stated reason (hetu) connecting A to B?"*  
     - **✓ Establish** if:  
       - The hetu (e.g., "smoke") and sādhya (e.g., "fire") are clearly stated.  
       - Vyāpti (universal link) is verifiable via **open-access sources** (e.g., "medical guidelines confirm smoking causes lung cancer").  
     - **⚠ Hedge** if: Vyāpti is plausible but unverifiable in 30 mins (e.g., "some studies link aluminum to dementia" – cite the study but note controversy).  
     - **✗ Reject** if: No vyāpti or hetu is provided.  
     - **→ Next**: If inference fails or relies on analogy/testimony, go to Step 3 or 4.

  3. **ANALOGY AUDIT**  
     *Ask: "Is this claim based on similarity (e.g., 'like X, therefore Y')?"*  
     - **✓ Establish** if:  
       - Objects share **essential properties** (e.g., "both cities have >1M residents, similar GDP/capita, and identical transit systems").  
       - Differences are irrelevant (e.g., "language differences don't affect traffic policy").  
     - **⚠ Hedge** if: Similarities are superficial (e.g., "both are European capitals" – add "though population size differs").  
     - **✗ Reject** if: Critical dissimilarities found (e.g., "rural vs. urban context").  
     - **→ Next**: If analogy fails, proceed to Step 4.

  4. **TESTIMONY TRIAGE**  
     *Ask: "Is this claim sourced from a person/text?"*  
     - **✓ Establish** if *all* apply:  
       - Source is an **āpta** (reliable): Domain expert *and* trustworthy (e.g., "Nobel laureate in physics discussing quantum mechanics").  
       - No conflicts of interest (e.g., "study author discloses funding").  
       - **Primary source accessible** (e.g., preprint, interview recording, open-access paper).  
     - **⚠ Hedge** if:  
       - Secondary testimony (e.g., "journalist summarizing a paper") *and* source is credible (add "according to...").  
       - Source is credible but makes an extraordinary claim (e.g., "established professor claims forgery" – attribute explicitly).  
     - **✗ Reject** if:  
       - Source lacks expertise (e.g., "economist discussing virology").  
       - Paywalled/private primary source + no independent verification.  
     - **→ Next**: If testimony fails, proceed to Step 5.

  5. **TARKA SANITY TEST**  
     *Ask: "If this claim were false, would it contradict established facts?"*  
     - **⚠ Hedge** if: Contradiction is clear (e.g., "if this artifact were real, carbon dating would show Y, but it shows Z").  
     - **✗ Reject** if: No contradiction found (e.g., "policy failure in one city doesn’t disprove success in another").  
     - *Note: Tarka never establishes claims alone – it only supports/rejects coherence.*

  6. **DOUBT ASSESSMENT**  
     *Ask: "After Steps 1–5, does unresolved doubt (saṃśaya) remain?"*  
     - **⚠ Hedge** if: Minor doubt (e.g., small sample size, plausible counterarguments).  
     - **✗ Reject** if: Major doubt (e.g., methodological flaws, competing evidence).  
     - **ESCALATE** to Head Verifier if:  
       - Credibility judgment needed (e.g., "is this fringe source reliable?").  
       - Values-based call (e.g., "should we platform this controversial view?").  

  ---

  ### **Test Case Applications**
  **Claim 1**: *"Study-habit app improves exam performance (40-student trial, paywalled study)."*  
  - **Step 1**: No direct perception.  
  - **Step 2**: Inference claimed (app use → better grades), but **vyāpti unverifiable** (paywall blocks methods/sample checks).  
  - **Step 4**: Testimony from study authors. **Not āpta without context** (funding? methodology? conflicts?).  
  - **Step 5**: Tarka fails (app failure wouldn’t contradict known facts).  
  - **Step 6**: Unresolved doubt (small sample, paywall).  
  - **Decision**: **⚠ Hedge** – e.g., "A study claims X, but independent verification was unavailable."

  **Claim 2**: *"Congestion charge worked in City A, so it will work in City B (they're 'basically the same')."*  
  - **Step 1**: No perception of future policy outcomes.  
  - **Step 2**: Inference implied, but **hetu is analogy** ("same kind of place"). → **Step 3**.  
  - **Step 3**: Analogy audit: "Same kind" is vague. Check public data – **dissimilarities found** (e.g., City A has metro; City B relies on cars).  
  - **Decision**: **✗ Reject** (or **⚠ Hedge** with "despite structural differences" if policy argument is central).

  **Claim 3**: *"Professor claims archaeological find is a forgery."*  
  - **Step 1**: No perception (artifact inaccessible).  
  - **Step 2**: No inference provided. → **Step 4**.  
  - **Step 4**: Testimony from professor.  
    - **Āpta?** Domain expert (archaeology chair)? Likely yes. Trustworthy? Reputation good, but **conflict check**: Rivalry with discovery team? Funding?  
    - **Primary source**: Verbal claim at event → inaccessible for verification.  
    - **Extraordinary claim**: Contradicts peer-reviewed studies.  
  - **Step 6**: **Unresolved doubt** (motive? evidence?).  
  - **Decision**: **ESCALATE** to Head Verifier. *The framework resists "publishing because we like them" – it demands scrutiny. If published, **⚠ Hedge** heavily: "Prof. X alleges forgery, but provides no evidence; discovery team maintains authenticity."*

  ---

  ### **Where the Procedure "Misfires" (Adaptations & Biases)**
  1. **Distortions for Speed**:  
     - **Vyāpti Check**: Reduced to "quick open-source search." Nyāya demands rigorous universal proof – here, we accept Wikipedia-level consensus.  
     - **Āpta Reliability**: Nyāya's moral/intellectual criteria ("truthful, competent") become "credentials + no scandals" via Google.  
     - **Tarka Demotion**: Turned into a coherence check; Nyāya uses it to *refute* doubt, not weakly support claims.

  2. **Judgment Calls as "Procedure"**:  
     - Analogy "relevance" is subjective (Step 3).  
     - "Extraordinary claim" thresholds (Step 4) rely on editorial intuition.  
     - Doubt assessment (Step 6) is inherently qualitative.

  3. **Quietly Taking Sides in Classical Debates**:  
     - **Pramāṇa Reduction**: Rejects Buddhist (perception/inference only) by keeping comparison/testimony. Uses testimony *more* than Nyāya (due to journalism's constraints).  
     - **Testimony Validation**: Opposes Mīmāṃsā (self-validating testimony) by requiring āpta checks.  
     - **Materialism**: Sidesteps Cārvāka (perception-only) by accepting inference/testimony.  

  ### **When to Override the Procedure**
  - **High-impact claims**: Escalate even if rejected (e.g., "Professor's forgery claim" – worth deeper investigation).  
  - **Public interest**: Publish hedged testimony if benefits outweigh risks.  
  - **Emergent consensus**: Vyāpti may exist in expert communities even if editors can't verify it.  

  This adapts Nyāya into a "quick and dirty" tool favoring caution. It won't catch all errors but reduces recklessness – exactly as a verifier should.
