prompt: |-
  Quick context: I help run a casual philosophy meetup at a pub, about a dozen people, and for the past few months we've been doing one classic thought experiment per session — trolleys, teleporters, the color scientist locked in her room, that kind of thing. Over that time I've noticed a pattern in how these things actually persuade us, and I can't find a word for it anywhere. Some thought experiments seem to get nearly all of their force from the way they're told rather than from any argument. If I retell Thomson's violinist case in flat language — you wake up and someone has surgically hooked a dying stranger to your circulatory system, unplugging him kills him, it takes nine months — half my group starts hedging and saying it's complicated. But told the way she tells it, with the kidnappers being devoted fans of a famous performer who chose you specifically, people are immediate and confident about their right to unplug. Same with other cases: we once swapped out purely decorative details in a trolley variant (the person on the side track described as a beloved local figure vs. a passing stranger) and the room's confidence measurably shifted, even though nothing morally relevant had changed. It's not that people end up disagreeing about the conclusion, it's that the vividness is doing the persuading, and if you strip it the intuition weakens or evaporates.

  A second thing we stumbled onto: sometimes someone in the group retells a case with deliberately neutral wording, or even words chosen to tilt the other way, and the intuition flips or dissapears — and then other members complain this is cheating, that you're not allowed to bias the scenario. But of course the original telling was itself a choice of wording, so what counts as the neutral telling? I know the term "framing effect" from psychology stuff, but that seems to be about gains-vs-losses wording in numbers problems, not about whole fictional scenarios where the decorative detail carries the moral weight. And a friend just says it's "rhetoric," which feels way too broad — there's no orator persuading us, it's the structure of the example itself. So, does this pattern have an established name in philosophy? And does the retelling/tilting counter-move have one? If nothing fits exactly, I'd like you to coin a term — with a real definition and at least a couple of boundary cases showing where the phenomenon stops (e.g., is it still the same thing when the detail that flips the intuition is arguably morally relevant after all?).

  Please structure your answer in four named sections, in this order: (1) "Nearest existing concepts," roughly a hundred words, listing the closest things that actually have names and one line each on how well they fit; (2) "What this pattern is — and isn't," around 150 words, carving it out from the near misses; (3) "The counter-move," a short paragraph on whether deliberately retelling scenarios flat or reverse-tilted is a recognized method and whether the cheating complaint has any footing; (4) "A label, if we need one," a short section where you either commit to the best existing term or coin one, with the definition and the boundary cases. I'm not after just a name-drop — I want to know where the edges of this thing are.
reasoning: |-
  Okay, let me approach this step by step. The user runs a philosophy meetup where they've noticed how the presentation of thought experiments significantly affects people's intuitive responses - something beyond standard framing effects. 

  First, I need to identify existing concepts that come close to describing this phenomenon. Framing effects in psychology are relevant but too narrow, focusing mainly on gain/loss wording in decision-making. Affective framing in ethics captures emotional valence but doesn't fully account for how decorative details shape moral intuitions. Narrative persuasion shows how stories influence beliefs, but thought experiments are more structured. Rhetorical devices like pathos are broad tools, while the vividness effect explains memorability but not persuasion. These all touch aspects but miss the core issue of morally irrelevant details driving moral certainty.

  The key distinction seems to be how purely decorative elements - like whether the violinist is famous or the trolley victim is beloved - create persuasive force without changing the scenario's moral structure. When stripped of these details, the intuition weakens, revealing that the effect comes from narrative texture rather than logical argument. This differs from framing effects because it's not about alternative descriptions of the same facts, but about adding circumstantial details that shouldn't matter morally yet do.

  For the retelling counter-move, this appears to be an informal method of philosophical analysis. When someone neutralizes the language, they're essentially performing an intuition pump calibration - testing whether the intuition holds without rhetorical enhancement. The "cheating" complaint misunderstands that original thought experiments always involve authorial choices; there's no truly neutral version, only versions that make their constructed nature more visible.

  Given that no existing term perfectly captures this phenomenon, coining a new one seems warranted. "Affective Scaffolding" emphasizes how emotional details support moral intuitions that would otherwise collapse. Boundary cases help define it: if a detail is actually morally relevant (like intention in the trolley problem), it's not this effect; similarly, when intuitions persist even with stripped-down versions, the scaffolding isn't carrying the weight. The term highlights how philosophers sometimes build persuasive examples that rely on emotional crutches rather than pure reasoning.
answer: |-
  Here’s a structured analysis of the phenomenon you’re observing, following your requested format:

  ---

  ### (1) Nearest existing concepts
  *   **Framing Effect (Psychology/Behavioral Econ):** Close, but typically applies to equivalent descriptions emphasizing gains/losses (e.g., "95% survival" vs. "5% mortality"). Your case involves *adding* non-equivalent, morally irrelevant details, not reframing core facts. Partial fit.
  *   **Affective Framing (Ethics/Psych):** Focuses on emotional valence (positive/negative) influencing judgment. Relevant to your violinist/trolley details, but doesn’t fully capture how *specific narrative embellishments* (fame, local status) scaffold the intuition itself. Strong partial fit.
  *   **Narrative Persuasion (Comm/Lit Theory):** Broadly covers how story structure influences belief. Fits the mechanism but is too general—not specific to *philosophical thought experiments* leveraging decorative details for moral intuitions.
  *   **Rhetorical Devices (e.g., Pathos):** "Rhetoric" is indeed too broad. Specific devices (vividness *[enargeia]*, loaded language) are tools used *within* your phenomenon but don’t name the *effect* on philosophical intuition-pumping.
  *   **Vividness Effect (Psych):** Explains how vivid info is more memorable/persuasive than abstract info. Captures part of the mechanism but not its specific role in *undermining or supporting moral intuitions* in argumentative contexts.

  ---

  ### (2) What this pattern is — and isn’t
  This pattern is the **reliance of a philosophical thought experiment's persuasive power on affectively charged, morally irrelevant narrative details.** The core intuition (e.g., "unplugging is permissible") weakens or collapses when these details are neutralized, revealing that the intuition was scaffolded by *rhetorical embellishment*, not pure logical structure. It *is* a specific subtype of framing, where the "frame" is an immersive, emotionally textured narrative context. Crucially, it *isn't*:
  *   **A framing effect** in the classic sense, as the core scenario isn't being logically re-described; it’s being *elaborated* with details orthogonal to the moral principle being tested.
  *   **Mere cognitive bias**, as it exploits narrative immersion to generate *felt certainty* in a moral conclusion, which is then mistaken for logical necessity.
  *   **Cheap rhetoric**, because the details aren't just ornamental; they actively construct the phenomenology of the intuition. The "force" feels intrinsic to the case, not imposed by an orator.
  The phenomenon occurs when details bypass rational assessment and directly trigger emotional/instinctive responses (empathy, disgust, tribal affinity) that masquerade as moral insight.

  ---

  ### (3) The counter-move
  Deliberately retelling the scenario with neutral or reverse-tilted details is a legitimate (though often informal) critical method in philosophical practice. It tests the **robustness** of the intuition. If the intuition evaporates with neutral wording or reverses with opposite details, it exposes the original intuition's dependence on affective scaffolding rather than core moral reasoning. The "cheating" complaint usually stems from a misunderstanding: participants mistake the *rhetorically enhanced version* for the *essential case*. They implicitly believe the vivid details *are* part of the philosophical "data," not realizing those details were chosen precisely *because* they trigger the desired intuition. The complaint has no valid footing; it highlights the phenomenon's effectiveness, not the counter-move's illegitimacy. The real challenge is defining "neutral"—often, it means stripping details to the logically necessary minimum, acknowledging true neutrality may be impossible.

  ---

  ### (4) A label, if we need one
  **Affective Scaffolding**

  *   **Definition:** The dependence of a philosophical thought experiment's intuitive moral force on emotionally resonant but logically irrelevant narrative details, such that the intuition weakens or dissolves when those details are neutralized or altered, revealing that the persuasive work is done by affective response rather than pure conceptual analysis.
  *   **Boundary Cases:**
      *   **Not Affective Scaffolding:** Changing a detail that *is* morally relevant (e.g., in the trolley problem, changing the person on the side track from a stranger to *someone who planted the bomb threatening the five*). This alters the core moral calculus; the shifting intuition is rational.
      *   **Not Affective Scaffolding:** If an intuition remains strong even when all vivid details are stripped down to a schematic description (e.g., "Unplugging the violinist in Thomson's minimally described case still feels clearly permissible to most"). The scaffolding isn't bearing the load.
      *   **Edge Case/Blurry Boundary:** Details that *might* be argued as indirectly relevant (e.g., describing the violinist as "innocent" vs. "criminal"). Does "innocence" change the moral status, or just trigger stronger empathy? If the intuition flips *only* due to the affective charge of "criminal," it's scaffolding. If "criminal" introduces a *new moral reason* (desert), it's not *purely* scaffolding.

  This term emphasizes the *supportive structure* built from affective details and how the intuition it holds up collapses when that structure is removed, distinguishing it from broader framing or narrative effects.
