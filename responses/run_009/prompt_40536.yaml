  This needs to work on two levels: philosophers should recognize the competing theories through the refrains’ behavior, while general readers feel the tension when "remains" shrinks against the stubborn second line. Rhymes must stay consistent (-ains: grains, chains, etc.), and the tone should be darkly humorous, not academic. 

