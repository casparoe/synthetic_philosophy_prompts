       - Case 4: Harm + indifference (amoral) → intentional (matches case 1).  
       - Case 5: Harm + indifference (shrug) + no avoidance → intentional.

  2. **Rule 2: Blame-Credit Rule (Folk-Normative)**  
     - **Harm**: The agent intentionally brings about a harmful side effect if the agent is blameworthy for it, where blameworthiness depends on (i) foreseeability, (ii) lack of justification, and (iii) the agent's indifference or failure to avoid when possible.  
