  - **Asymmetry**: Harm is treated differently from help—indifference suffices for intentional harm but not for intentional help. This suggests a normative dimension where harm requires justification or avoidance to avoid intentionality, while benefit requires endorsement to achieve it.

  ### Candidate Rules
  Based on the patterns, I propose two candidate rules. Each rule specifies what makes a side effect intentional, relative to the agent's own perspective ("the agent's lights"), as Dara's verdicts track the agent's stated attitudes (e.g., indifference in cases 1, 2, 4, 5) rather than community standards or objective morality.

  1. **Rule 1: Indifference and Avoidance Rule (Harm-Benefit Asymmetric)**  
     - **Harm**: The agent intentionally brings about a harmful side effect if (i) it is foreseen, (ii) the agent is indifferent (lacks a con-attitude toward the harm, such as opposition or regret), and (iii) the agent does not take feasible steps to avoid or minimize the harm.  
     - **Benefit**: The agent intentionally brings about a beneficial side effect only if (i) it is foreseen, (ii) the agent has a pro-attitude toward the benefit (e.g., endorsement, desire), and (iii) the agent takes steps to promote or secure the benefit.  
     - **Relative to**: The agent's own lights (attitudes and reasons as expressed).  
     - **Why it fits**:  
       - Case 1: Harm + indifference + no avoidance → intentional.  
       - Case 2: Benefit + indifference → no pro-attitude → not intentional.  
