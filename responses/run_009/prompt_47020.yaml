prompt: |-
  I'm taking a seminar on social ontology this semester and we just finished Lewis's Convention plus some of the follow-up literature on how norms evolve (signaling games, replicator dynamics, that whole world). For my term paper I basically get to pick ONE open question in this space and go deep on it for ~15 pages, and I'm paralyzed. Here's my shortlist, roughly:

  1. The common knowledge problem -- Lewis builds conventions on infinitely nested mutual expectations ("I know that you know that I know..."), which nobody thinks real agents actually have. Is the infinite hierarchy an idealization that's harmless in practice, or does something important break when you truncate it? And can the evolutionary stuff (agents with no theory of mind at all) really be seen as an approximation of the same phenomenon, or is it a different thing entirely?

  2. Salience and focal points -- Lewis needs salience to solve the equilibrium selection problem, but salience itself looks culture-dependent and maybe itself conventional, so there's a whiff of circularity. How bad is the circle actually?

  3. Whether punishment/convention-enforcement can itself be conventional -- punishing defectors is costly, so who punishes the non-punishers? People like Skyrms and Binmore have ways of attacking this but it feels to me like the deepest hole in the whole program: conventions for cooperation exist everywhere, and the account of how they stabilize themselves seems hand-wavy.

  4. The convention/norm boundary -- a lot of what we call norms (fairness norms, taboo norms) don't look like arbitrary solutions to coordination problems, since they'd be the same even if history had gone differently. Is the Lewisian framework just not built for those, and does that matter?

  I'm not asking you to write my paper lol. What I want is a prioritization with actual reasoning behind it: which of these is most worth ~15 pages of a grad student's effort, judged by (a) how much the rest of the field implicitly depends on it, (b) whether someone with a semester of game theory and no coding skills can make real progress on it, and (c) whether the answer would actually change anything versus just being a refinement. Like, I suspect #1 is "important" in some abstract sense but that any answer I could give would just be a footnote, whereas #3 maybe changes how the whole framework applies to real norm formation? But I'm not sure.

  Also happy to hear if there's a question I'm not listing that you'd rank above all four -- my professor keeps hinting that the conventionalism-about-language stuff (does Lewis's account actually explain linguistic meaning or just presuppose it) is underrated, so tell me if she's right.

  One more constraint: please don't give me a reading list, I have the syllabus already and can't fit more books in. I want your actual prioritized judgment and the reasoning, not a survey.
