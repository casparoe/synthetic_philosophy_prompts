answer: |-
  Here is a set of desiderata for an adequate theory of interpersonal aggregation of small harms, structured to meet your specifications. Each desideratum is motivated by a specific case, flagged for consensus status, and tensions are explicitly identified.

  ---

  **Desiderata for a Theory of Interpersonal Aggregation of Small Harms**

  1.  **Distinguish Sub-Experiential from Merely Small Harms** (Motivation: *Refined Dust-Specks Case*)
      *   *Case:* Compare a dust speck causing a fleeting itch below the threshold of conscious notice or later recall (Sub-Experiential Harm) to a small papercut causing a brief, noticeable sting (Merely Small Harm). Scatter each harm across distinct individuals.
      *   *Requirement:* The theory must explicitly state whether sub-experiential harms are morally considerable and whether their aggregation differs fundamentally from the aggregation of merely small harms. It must provide a principled basis for any distinction (e.g., phenomenological absence, lack of impact on agency/welfare).
      *   *Status:* **Contested.** Uncontested that a theory *must address* the distinction. Heavily contested *whether* sub-experiential harms count and *how* they aggregate relative to small harms. Some view sub-experiential harms as non-events; others see them as tiny welfare decrements.

  2.  **Account for Intra-/Interpersonal Asymmetry** (Motivation: *Concentrated vs. Scattered Pinpricks*)
      *   *Case:* Compare enduring 1000 pinpricks concentrated in one hour (causing significant pain, distress, and potential injury) to 1000 individuals each enduring one pinprick (a momentary minor annoyance).
      *   *Requirement:* The theory must explain the intuitive moral difference between these scenarios (if it affirms one exists) or justify its absence. It must specify the relevant unit of aggregation (person-life, person-moment, experiential episode) and explain why this unit is morally significant (e.g., personal identity, phenomenological unity, adaptive capacity, fatigue).
      *   *Status:* **Contested.** Uncontested that a theory *must explain* the moral relationship between concentrated and scattered harms. Heavily contested whether an asymmetry *exists* and, if so, its nature and strength. Views range from strict person-based asymmetry to near-continuity.

  3.  **Clarify Continuity vs. Thresholds** (Motivation: *The Sorites Problem for Harm*)
      *   *Case:* Can a sufficient number of sub-experiential dust specks (or sufficiently small registered harms) aggregately constitute a harm equivalent to torture? If not, why not? Where is the cutoff?
      *   *Requirement:* The theory must state whether there exists a threshold of harm size (absolute or contextual) below which harms cannot sum to a significant harm *regardless of population size*. If it posits such a threshold, it must provide a non-arbitrary justification for its location and explain why harms just above/below the threshold differ categorically in their aggregative potential.
      *   *Status:* **Contested.** Uncontested that a theory *must take a stance* on the possibility of summation from tiny harms to large harms. Heavily contested whether thresholds exist and, if so, how they work. Denying thresholds often raises Sorites concerns; affirming them raises justification challenges.

  4.  **Separate Aggregation Facts from Practical Action-Guidance** (Motivation: *The Untraceable Micro-Harms Case*)
      *   *Case:* Imagine an action (e.g., a policy change) that predictably inflicts a vast number of sub-experiential or very small harms on different individuals, aggregating to a massive moral disvalue, but where tracing the harm to specific individuals or moments is practically impossible.
      *   *Requirement:* The theory must clearly distinguish:
          *   *Aggregation Fact:* Whether the scattered harms *metaphysically* aggregate into a significant total disvalue.
          *   *Practical Guidance:* Whether, and under what conditions (e.g., certainty, traceability, risk of misuse, rule-consequentialist concerns), an agent can or should act based on that aggregated disvalue.
      *   *Status:* **Widely (but not universally) Accepted.** There's strong consensus that a *complete account* must address both aspects. There's significant consensus that the *metaphysical aggregation fact* is conceptually prior and distinct from *practical permissibility*. Denying this often conflates distinct moral questions.

  5.  **Avoid Repugnant Conclusions** (Motivation: *The Reverse Repugnant Conclusion*)
      *   *Case:* A theory should not imply that inflicting a vast number of tiny harms (e.g., billions of sub-experiential itches) is morally *required* or even *permissible* if it avoids causing a smaller number of moderate harms (e.g., one person's broken leg), *if* the aggregated tiny harms are deemed worse than the moderate harm.
      *   *Requirement:* The theory must not entail that aggregating tiny harms *easily* outweighs significant harms to a few, leading to counterintuitive obligations or permissions to inflict massive distributed suffering to avoid minor concentrated suffering. It should respect the moral significance of non-minimal harm.
      *   *Status:* **Near Consensus.** Avoiding such repugnant conclusions is a widely shared constraint, though interpretations of what constitutes "repugnance" and the *degree* of summation allowed vary significantly.

  6.  **Respect the Moral Considerability of Individuals** (Motivation: *The Neglected Victim*)
      *   *Case:* An action benefits a vast number immensely but inflicts a severe, life-wrecking harm on one identifiable individual.
      *   *Requirement:* The theory must not treat individuals merely as containers for utility or disutility. It must incorporate constraints (e.g., rights, inviolability, priority to the worst-off) that prevent the complete moral override of one individual's serious interests simply by aggregating sufficiently many tiny benefits or harms elsewhere. It must explain the moral status of the individual within aggregation.
      *   *Status:* **Widely Accepted (in Principle).** Uncontested that a theory must *account for the moral status of individuals*. Contested *how strong* the constraints are and *how* they interact with aggregation (e.g., absolute vs. lexical thresholds vs. weighted aggregation). Strict totalism rejects strong constraints.

  **Key Tensions:**

  *   **Desiderata 2 (Asymmetry) & 3 (Thresholds) vs. Additive Continuity:** Strong forms of asymmetry (person as fundamental unit) and lexical thresholds inherently conflict with strict additive continuity where units are fungible. A theory satisfying 2 & 3 robustly cannot be strictly additive across persons/moments.
  *   **Desideratum 3 (Thresholds) & Desideratum 5 (Avoid Repugnance):** A lexical threshold below which harms cannot sum avoids repugnant conclusions easily. However, Desideratum 3 demands a *justification* for the threshold's location that avoids arbitrariness, which is notoriously difficult. Theories often sacrifice one desideratum's strength to satisfy the other.
  *   **Desideratum 4 (Separation) & Practical Implementation:** While the separation of facts from guidance is widely endorsed, theories that make aggregation facts practically inaccessible or irrelevant (e.g., due to extreme uncertainty or untraceability) risk making the aggregation claim morally inert, which some argue undermines its significance.
  *   **Desideratum 1 (Sub-Experiential) & Desideratum 6 (Individual Considerability):** If sub-experiential harms are deemed non-considerable (satisfying some intuitions behind 1), this potentially conflicts with the idea that *every* individual's welfare matters (part of 6) if even their unfelt negative welfare changes are ignored. If they are considerable, aggregating them can threaten 6.

  **Brief Assessment of Theories:**

  *   **Lexical-Threshold Views:** Excel at avoiding repugnant conclusions (5) and can ground intra/interpersonal asymmetry (2) via the threshold. Struggle mightily with justifying the threshold location non-arbitrarily (3) and often face Sorites problems. Typically disregard sub-experiential harms (contested aspect of 1). Uphold separation (4) but risk practical irrelevance. Can violate 6 if the threshold is set too high.
  *   **Rough Unit-Comparability Views:** Handle asymmetry (2) by acknowledging rough comparability without strict fungibility. Avoid the starkness of lexical thresholds (mitigating 3's justification problem) but may struggle to definitively block very repugnant conclusions (5). Can incorporate distinctions between harm types (1) via rough weights. Generally uphold separation (4) and respect individuals (6) through weighting/prioritization, though details vary.
  *   **Plain Additive Totalism:** Easily explains aggregation facts and continuity (3 core, but struggles with 3's threshold demand). Rejects significant asymmetry (2) and typically considers sub-experiential harms (if any) as aggregable (1). Clearly separates facts from guidance (4) but notoriously leads to repugnant conclusions (5 violation). Treats individuals primarily as value-bearers, risking violation of 6 in extreme cases.

  ---

  **Closing Note: The Most Powerful Filter**

  The most potent desideratum for excluding theories is **Desideratum 1: Distinguishing Sub-Experiential from Merely Small Harms, particularly the moral considerability of sub-experiential harms.** This is profoundly **contested**.

  *   **Why Powerful:** A "No" answer immediately eliminates all forms of unrestricted totalism and most rough comparability views regarding sub-experiential harms, forcing lexical thresholds or non-aggregative views. A "Yes" answer creates immense pressure towards totalism or sophisticated aggregation, raising the specter of repugnant conclusions and demanding robust accounts of asymmetry and thresholds to contain it. Much of the theoretical landscape is defined by the stance taken here.
  *   **Why Contested:** There is no settled intuition or empirical fact resolving whether an unfelt welfare decrement is morally relevant. It hinges on deep, unresolved questions about the nature of welfare, moral status, and the relationship between experience and value. Theorists bring fundamentally different foundational commitments to this question.
  *   **Deserved Attention:** Precisely because it's both highly contested and a major fork in the theoretical road, the debate over sub-experiential harms deserves far more explicit focus than it often receives. Clarifying one's stance here is often the first, decisive step in theory-building, making it the crucial filter. Your seminar is wise to foreground this distinction.
