  - B: Augustinian, Kantian
  - C: Casuist

  Q7 (secret lie):
  - A: Augustinian, Kantian, Casuist
  - B: Consequentialist
  - C: Pro tanto

  Q8 (haircut):
  - A: Consequentialist, Pro tanto
  - B: Augustinian, Kantian
  - C: Casuist

  Now, the quiz may not distinguish Augustinian and Kantian because they always choose the same answers. We can note that in the scoring key.

  Also, for someone who is all over the place, we can have a catch-all category.

  Let's write the scoring key:

  Scoring:
  - Count how many times you chose the answer corresponding to each position.

  But note, a person might not fit perfectly.

  We can do:

  - If you chose mostly B in Q1-Q4 and Q6, and A in Q5 and Q7, and B in Q8, then you are Augustinian or Kantian. We can't distinguish, but you are an absolutist who never lies.

  - If you chose mostly C in Q1-Q4, Q6, Q8, and A in Q5 and Q7, then you are Casuist.

  - If you chose mostly A in Q1-Q4, B in Q5, A in Q6 and Q8, and B or C in Q7, then you are Pro tanto.

  - If you chose mostly A in Q1-Q4, B in Q5, A in Q6, B in Q7, A in Q8, then you are Consequentialist.

  But this is approximate.

  Alternatively, we can have a points system:

  For each position, assign a point when the answer matches:

  - Augustinian: Q1B, Q2B, Q3B, Q4B, Q5A, Q6B, Q7A, Q8B
  - Kantian: same as Augustinian
  - Casuist: Q1C, Q2C, Q3C, Q4C, Q5A, Q6C, Q7A, Q8C
  - Pro tanto: Q1A, Q2A, Q3A, Q4A, Q5B, Q6A, Q7C, Q8A
  - Consequentialist: Q1A, Q2A, Q3A, Q4A, Q5B, Q6A, Q7B, Q8A

  Then, for each position, count the number of matches. The position with the highest score wins.

  If there's a tie, or if the highest score is low, then it's inconsistent.

  We can also note that Augustinian and Kantian will have the same score, so we can output "Absolutist (Augustinian or Kantian)".

