prompt: |-
  I would like your help identifying a concept, and I would rather have careful carving than a quick label. Please take on the role of an expert working at the intersection of formal epistemology, decision theory, and the economics of collective belief formation, and think the question through before answering: lay out the candidate concepts you considered, argue for the best fit, and only then draw the boundaries.

  Here is the pattern I keep running into.

  Two restaurants sit across the street from one another. One has a queue. I join the queue, and so, as far as I can tell, did everyone ahead of me — not because we each independently investigated both kitchens, but because each of us took the crowd's choice as evidence about which one is good. The queue is thus largely evidence about queues. The same shape shows up at work: my team adopted a tool because another team did, and they are sharp; that team adopted it because a well-known engineer wrote it up after trying it once. Nobody in the chain has more than a single direct encounter with the thing, but by the time the decision reaches me it arrives as three independent endorsements. The same two or three early experiences get re-counted at every stage as though they were fresh evidence, and the crowd's confidence compounds while the underlying evidence stays the same size.

  Three features of this bother me. First, each individual step seems defensible: audit any one person's reasoning in isolation and it holds up — nobody made an arithmetic error, and nobody caved under social pressure. The failure exists only at the level of the whole chain. It is a mistake with no author. Second, every so often the whole thing runs backwards: one respected figure visibly defies the crowd, and within months everyone's reasons point the new way, with the same confidence they had in the old way. Confidence appears to be conserved while direction flips — the building is slow and the collapse is instant. Third, and this may be the heart of it, everyone in the chain treats correlated evidence as if it were independent: a single piece of information, passed along hand to hand, gets counted once per hand it passes through.

  The nearest things I know of are groupthink and the bandwagon effect, but both seem to name a psychological failure — people caving to pressure or lazily copying. In what I am seeing, the individuals appear to be reasoning correctly: given what each can observe, following the crowd is the smart move. I have also heard the phrase "wisdom of crowds," but that seems to be about averaging independent guesses, and my phenomenon is precisely one where the guesses are not independent. So my questions are these:

  1. Does the core configuration — locally rational at every step, collectively bad at the level of the whole, with no individual error to point to — have an established name?
  2. Is there a name for the version where the conformity is produced by the arrangement of who can observe whom, rather than by anyone's psychology? That distinction matters to me, and I suspect the field has a way of marking it.
  3. Does the reversal part — the fragility, the flip on a dime with confidence intact — have its own name, or is it treated as a footnote to the main phenomenon?
  4. If any part of this is unnamed, coin a term for it, define it, and give a couple of boundary cases. In particular: does it still count when people go along to be safe — reputationally — rather than because they have inferred anything? I suspect that is a different animal with the same footprint, and I would like to know whether you agree and on what grounds.

  I am not looking for a reading list or a bibliography. If the configuration has a standard name, give me the name, but what I actually want is the account underneath it: what the phenomenon is, what it is not, and where its edges are.
reasoning: |-
  We are dealing with a phenomenon where individuals make locally rational decisions based on observed actions of others, leading to a collective outcome that is suboptimal due to the compounding of correlated evidence. The key features are:

  1. **Locally rational decisions**: Each individual, given their information (which includes the actions of others), is making a rational inference. There is no psychological weakness (like groupthink) or error in reasoning at the individual level.

  2. **Collective irrationality**: The group as a whole ends up with a belief that is overconfident because the same underlying evidence is counted multiple times as it passes through the chain.

  3. **Evidence correlation**: The evidence is not independent; it is derived from a cascade where early signals are amplified.

  4. **Fragility and reversal**: The collective belief can flip rapidly when a respected individual (or a small group) defies the crowd, because the entire edifice is built on a chain of dependent evidence.

  Let me break this down step by step.

  ### Candidate Concepts

  #### 1. **Informational Cascades**
  The primary candidate is **informational cascades**. This concept comes from the economics of information and decision theory. 

  - **Definition**: An informational cascade occurs when individuals, observing the actions of others, ignore their own private signals and follow the crowd, even if their private signal contradicts the public action. This happens because the weight of public information (from prior actions) overwhelms private information.
    
  - **Fit**:
    - In the restaurant example, each person sees the queue and infers that previous people must have had good reasons to choose that restaurant. They then join without investigating, and their action reinforces the signal for the next person.
    - In the tool adoption example, each team adopts because they see another team (whom they respect) has adopted. The early adopter's experience (which might be limited) is passed along and counted as multiple endorsements.
    - The key point: individuals are rational Bayesians updating their beliefs based on the actions of others, but the cascade builds on very little independent evidence.

  - **Why it matches**:
    - Locally rational: Each person is making a rational inference given the public information (the actions of others).
    - Collective failure: The cascade can lead to the whole group being wrong if the initial signals were misleading (e.g., the first few people in the restaurant queue happened to choose randomly or based on a whim).
    - Evidence correlation: Actions are based on the same initial evidence, which gets reused.

  - **Reversal**: Informational cascades are fragile. A small piece of new, contradictory public information (like a respected figure defecting) can break the cascade because it provides a strong signal that the previous cascade might have been based on error. This can cause a rapid reversal.

  - **Boundary**: Informational cascades are driven by rational inference from observed actions, not by social pressure or desire to conform for non-informational reasons. This matches your requirement that the conformity is due to the arrangement of observability, not psychology.

  #### 2. **Herd Behavior**
  Sometimes used interchangeably with cascades, but in technical terms, herd behavior is broader and can include non-informational reasons (like network effects or coordination games). 

  - **Definition**: Herd behavior occurs when individuals act in a way that mimics the actions of others, regardless of their own information. It can be informational (as in cascades) or non-informational (e.g., wanting to be part of a popular movement).

  - **Fit**: 
    - If we restrict to the informational kind, it overlaps with cascades. However, herd behavior can also include cases where people follow the crowd for non-informational reasons (e.g., fear of being left out, network effects). 

  - **Why it might not be the best fit**: Your case emphasizes that individuals are rationally updating beliefs based on others' actions as evidence, so the informational cascade is a more precise fit. Herd behavior is often used more loosely and might include psychological or social pressure elements.

  #### 3. **Pluralistic Ignorance**
  This is a social psychological concept where individuals privately reject a norm but assume others accept it, and thus they go along with it. 

  - **Mismatch**: This does not fit because in your case, individuals are not privately disagreeing; they are updating their beliefs to agree with the crowd based on evidence. Also, pluralistic ignorance is about norms, not about factual beliefs or decisions like restaurant choice.

  #### 4. **Echo Chambers and Epistemic Bubbles**
  These are more about information flow in networks, where people are only exposed to a subset of information, reinforcing existing beliefs.

  - **Mismatch**: While related, these concepts are typically about selective exposure and reinforcement in media or social networks, not about sequential decision-making with rational updating. The cascade model is more specific to sequential actions.

  #### 5. **The Availability Cascade**
  Coined by Kuran and Sunstein, an availability cascade is a self-reinforcing process of collective belief formation whereby an expressed perception triggers a chain reaction that makes the perception more plausible through its increasing availability in public discourse.

  - **Fit**: 
    - This is a specific type of informational cascade that focuses on how media and public discourse amplify the availability of a certain idea, making it seem more credible because it is frequently discussed.
    - However, the core mechanism is similar: initial reports are amplified by repetition, leading to overconfidence.

  - **Boundary**: Your examples (restaurant queues, tool adoption) are not necessarily media-driven; they are about direct observation of actions. So while related, the classic informational cascade model (as in Bikhchandani, Hirshleifer, and Welch, 1992) is more direct.

  ### Best Fit: Informational Cascades

  After considering the candidates, **informational cascade** is the established term that best captures the core configuration. 

  #### Why it fits:

  1. **Locally rational, collectively suboptimal**: The model of informational cascades is built on Bayesian rationality at the individual level. Each person updates their belief based on the actions of predecessors, but the cascade can lead to a state where the group converges on a choice that is not supported by the totality of private information (which is often ignored once the cascade starts).

  2. **Arrangement of observability**: Cascades occur because of the sequential structure of decisions and the observability of actions. It's about the information structure, not psychology. In fact, the original papers emphasize that cascades can occur even with fully rational agents.

  3. **Fragility and reversal**: Cascades are known to be fragile. A single piece of public information that contradicts the cascade can break it. For example, if a respected individual (who is known to have good information) chooses the other restaurant, it can trigger a reverse cascade. The confidence flips because the entire cascade was built on a few early signals; once those are undermined, the structure collapses.

  #### Addressing Your Questions:

  1. **Name for the core configuration**: **Informational cascade**. It is well-established in economics and decision theory.

  2. **Name for the conformity due to observability arrangement**: This is precisely the domain of **informational cascades** (as opposed to reputational cascades, which we will discuss below). In the cascade literature, the key distinction is between:
     - **Informational cascades**: Following others because their actions are seen as providing information about the true state of the world.
     - **Reputational cascades**: Following others to avoid social sanctions or to gain approval (a psychological/social pressure mechanism).

     Your description matches the informational cascade.

  3. **Name for the reversal part**: The fragility and reversal are inherent properties of informational cascades. There isn't a separate term for the reversal, but it is a well-known feature. Sometimes it is discussed as the **fragility of cascades** or **cascade reversal**. 

  4. **Unnamed parts and boundary cases**:
     - **Reputational vs. Informational**: You ask about cases where people go along for reputational safety (to avoid standing out). This is a **reputational cascade** (or sometimes called a **social cascade**). 
       - **Distinction**: In a reputational cascade, individuals might publicly conform while privately disagreeing, to avoid punishment or gain rewards. This is different from an informational cascade where individuals update their actual beliefs. 
       - **Boundary**: In your examples, if people are joining the queue because they fear looking foolish if they don't (even if they suspect the restaurant is bad), that would be reputational. But if they are joining because they infer the restaurant is good, it's informational. 
       - **Same footprint?**: Both can lead to similar herd behavior, but the mechanisms are different. The literature often distinguishes them, though they can coexist. In your description, you emphasize that individuals are making inferences, so it's informational. However, in real life, there might be a mix.

     - **Coining a term for the compounding of evidence**: The core issue in the cascade is that the same evidence is treated as independent. This is sometimes called **evidence double-counting** or **correlation neglect** (a term used in finance for when investors fail to account for correlation in signals). However, within cascade theory, this is inherent and doesn't need a new term. 

     - **A new term for the whole phenomenon?** I don't think so; "informational cascade" is the standard term. But if we want to emphasize the evidence reuse, we might call it **evidence cascade** or **cascading evidence amplification**. However, I recommend sticking with the established term.

  ### Boundary Cases

  1. **Pure Informational Cascade (fits)**:
     - **Restaurant**: Each person sees the queue, infers that previous people had positive signals, and joins without investigating. They genuinely believe the restaurant is good. If the first two people chose randomly (e.g., by coin flip), a cascade can start even if the restaurant is bad.

  2. **Reputational Cascade (does not fit your description, but boundary)**:
     - **Restaurant**: A person joins the queue because they don't want to be seen as an outsider or because they fear ridicule if they go to the empty restaurant. They privately think the queued restaurant might be overrated. This is reputational.

  3. **Mixed Case**:
     - **Tool adoption**: A team adopts a tool partly because they believe the other team's endorsement (informational) and partly because they don't want to be seen as behind the times (reputational). This is common in practice.

  4. **Non-Cascade (independent decisions)**:
     - **Wisdom of crowds**: If each person in the restaurant example independently sampled both restaurants and then chose, the crowd's choice would aggregate independent signals. This is not a cascade.

  ### Conclusion

  - **Core name**: **Informational cascade**.
  - **Conformity due to observability**: This is the defining feature of informational cascades, as opposed to reputational cascades or groupthink.
  - **Reversal**: This is a known property of informational cascades and is often discussed as their fragility. No separate name is needed.
  - **Reputational vs. Informational**: They are distinct. Your phenomenon, as described, is informational. If reputational concerns dominate, it's a different mechanism.

  In summary, you are describing a classic informational cascade. The individuals are rational, the problem arises from the structure of information flow, and the system is fragile to new public information. The field marks the distinction between informational and reputational cascades, and your case falls squarely in the informational category.
answer: |-
  ### Step-by-Step Reasoning and Concept Identification

  I'll address your query methodically, drawing from formal epistemology, decision theory, and collective belief economics. The pattern you describe—locally rational individual decisions leading to collectively irrational outcomes, with evidence compounding through social observation—is a well-studied phenomenon. I'll evaluate candidate concepts, argue for the best fit, define boundaries, and address your specific questions. Crucially, I'll distinguish between psychological mechanisms (e.g., social pressure) and informational structures (e.g., who observes whom), as this distinction is central to your concern.

  ---

  ### 1. **Candidate Concepts Considered**
  I evaluated several established concepts for fit, focusing on three criteria:  
  - **Locally rational decisions**: Individuals act on defensible inferences, not errors or pressure.  
  - **Collective irrationality**: The group outcome is suboptimal due to evidence reuse.  
  - **Observational structure**: Conformity stems from information flow, not psychology.  

  Here are the candidates, with reasons for/against fit:

  #### **A. Informational Cascades**  
  - **Definition**: Individuals ignore private signals and follow predecessors' actions, believing those actions reveal superior information.  
  - **Fit**: Matches locally rational decisions (Bayesian updating based on observed actions) and evidence compounding. Explains queues, tool adoption, and reversal fragility.  
  - **Misfit**: Not all cases involve ignoring private signals (e.g., your tool example lacks explicit private signals).  

  #### **B. Herd Behavior**  
  - **Definition**: Individuals mimic others' actions, often due to network effects or shared goals.  
  - **Fit**: Captures collective outcomes from sequential following.  
  - **Misfit**: Typically includes psychological/social motives (e.g., fear of exclusion). Your cases lack this—actions are evidence-based, not social.  

  #### **C. Echo Chambers/Epistemic Bubbles**  
  - **Definition**: Networks amplify beliefs by restricting exposure to dissenting views.  
  - **Fit**: Explains confidence compounding and reversals when "bubbles" burst.  
  - **Misfit**: Focuses on information silos, not sequential evidence reuse. Your examples lack isolation—information flows linearly.  

  #### **D. Correlation Neglect**  
  - **Definition**: Agents treat correlated information (e.g., overlapping sources) as independent.  
  - **Fit**: Directly addresses evidence double-counting (e.g., one engineer's experience treated as three endorsements).  
  - **Misfit**: A cognitive bias; your cases involve rational inference, not neglect.  

  #### **E. Pluralistic Ignorance**  
  - **Definition**: Privately, individuals reject a norm but publicly conform, assuming others accept it.  
  - **Fit**: Explains sudden reversals when dissent emerges.  
  - **Misfit**: Requires private disagreement; your cases involve genuine belief updates.  

  #### **F. Wisdom of Crowds (Failures)**  
  - **Definition**: Crowd accuracy relies on independent judgments; dependence causes failure.  
  - **Fit**: Highlights non-independence as the flaw.  
  - **Misfit**: Describes a failure mode, not a named phenomenon.  

  ---

  ### 2. **Best Fit: Informational Cascades with Correlation Discounting**
  The core phenomenon is **informational cascades**, specifically a subtype incorporating **correlation discounting** (explained below). This fits because:  
  - **Locally rational**: Each agent updates beliefs via Bayes' rule. Seeing a queue or endorsement is valid evidence about quality, assuming predecessors acted rationally.  
  - **Collectively irrational**: Cascades amplify early, weak signals. The same evidence (e.g., one engineer's trial) is reused, creating false confidence.  
  - **Reversal fragility**: Cascades are equilibria built on few early signals. A credible dissenter (e.g., a respected defector) breaks the cascade by exposing dependence, causing rapid collapse. Confidence "flips" because the cascade was never evidence-rich.  
  - **Observational structure**: Conformity arises from information access (who observes whom), not psychology. In queues or org charts, visibility dictates evidence flow.  

  **Why not groupthink/bandwagon?**  
  Groupthink involves psychological pressure (suppressing dissent for harmony), and bandwagon effects emphasize irrational copying. Your cases lack both—individuals infer rationally from observations.  

  **Refined concept**: Standard cascades assume agents disregard private signals. Your examples (e.g., tool adoption) may involve no private signals, so we extend to **observational cascades**: cascades where actions are treated as evidence, regardless of signal origin. The key is **evidence correlation**—agents fail to discount for dependence.  

  ---

  ### 3. **Answers to Your Questions**  
  #### **1. Core configuration name**  
  **Established name**: **Informational cascade** (Bikhchandani, Hirshleifer & Welch, 1992).  
  - **What it is**: A sequence of rational choices where agents infer from predecessors' actions, causing a "cascade" that overweights early evidence.  
  - **What it is not**: Not psychological (e.g., groupthink) or error-driven (e.g., correlation neglect). Agents correctly update beliefs—the flaw is in the evidence structure.  
  - **Edges**:  
    - Fits if agents act on observed actions as evidence (e.g., queue = quality signal).  
    - Excludes cases with strong private signals (e.g., if you investigate the kitchen despite the queue).  

  #### **2. Name for conformity via observation structure**  
  **Established name**: **Observational cascade** (a subtype of informational cascades).  
  - **Distinction**:  
    - **Observational**: Conformity from visible actions in a network (e.g., seeing a queue).  
    - **Psychological**: Conformity from social pressure (e.g., fear of ridicule).  
  - **Why it matters**: Your cases are observational—no one is "caving"; they are inferring. The field marks this via **Bayesian networks** or **information economics**, where beliefs derive from position in the observation chain.  

  #### **3. Name for reversal fragility**  
  **Established term**: **Cascade fragility** (or **criticality**).  
  - **What it is**: Cascades collapse when new evidence reveals correlation (e.g., a dissenter exposes the evidence chain). Confidence persists because agents update correctly—they now see the cascade was built on thin evidence.  
  - **What it is not**: Not mere "fads" (which are slow to reverse) or "panic" (which is emotional).  
  - **Treatment**: Studied as a core property of cascades, not a footnote. Reversals demonstrate the phenomenon's instability.  

  #### **4. Unnamed elements: Coined term and boundaries**  
  - **Coined term for evidence reuse**: **Correlation inflation**.  
    - **Definition**: The compounding of confidence when correlated evidence (e.g., a single event reported through a chain) is treated as independent at each step.  
    - **Boundaries**:  
      - **Fits**: Rational agents miscount evidence due to structural dependence (e.g., three teams endorsing a tool based on one review).  
      - **Excludes**: Deliberate deception (e.g., marketing hype) or cognitive biases (e.g., ignoring correlation).  
  - **Reputational vs. inferential conformity**:  
    - **Reputational safety**: If agents conform to avoid social risk (e.g., "I’ll use the tool to fit in"), it is **reputational cascade** (Kuran, 1998). This is a different mechanism:  
      - **Inferential** (your case): Belief update from evidence (e.g., "the queue suggests good food").  
      - **Reputational**: Action without belief update (e.g., "I’ll join the queue to avoid looking dumb").  
    - **Same footprint?**: Yes, both produce conformity and reversals, but the mechanisms differ. Reputational cascades are psychological/social; inferential cascades are epistemic. I agree they are distinct because:  
      - **Evidence**: Inferential cascades involve belief change (e.g., you trust the crowd’s judgment); reputational cascades involve preference falsification (e.g., you comply publicly but privately disagree).  
      - **Reversal speed**: Inferential cascades reverse faster—beliefs update with new evidence. Reputational cascades require social tipping points (e.g., enough dissenters to reduce risk).  
    - **Boundary case**:  
      - **Inferential cascade (fits)**: Joining a restaurant queue because you infer quality from its length.  
      - **Reputational cascade (excluded)**: Joining a queue to impress a date, despite suspecting the food is bad.  

  ---

  ### 4. **Synthesis and Boundaries**  
  - **Core phenomenon**: Informational cascades with correlation inflation.  
  - **Key features**:  
    - No author of error: Individuals act rationally; failure emerges from evidence chains.  
    - Reversal fragility: Built-in instability due to evidence dependence.  
    - Observational structure: Conformity from who observes whom, not psychology.  
  - **Boundaries**:  
    - **In**: Rational agents, sequential decisions, visible actions, thin evidence compounding.  
    - **Out**: Psychological pressure, independent judgments, thick evidence (e.g., many direct experiences), or reputational motives.  
  - **Why this fits you**: You emphasize non-psychological, structure-driven conformity with rational actors—this is the heart of observational cascades.  

  ### Final Summary  
  - **Named elements**:  
    - Core: **Informational cascade** (observational subtype).  
    - Evidence reuse: **Correlation inflation** (coined term).  
    - Reversal: **Cascade fragility**.  
  - **Unnamed distinction**: Reputational conformity is a separate phenomenon (**reputational cascade**), though outcomes overlap.  
  - **Key insight**: Your pattern is a "rational folly"—no one errs, but the system fails due to evidence structure. This is why collapses feel sudden: the edifice was always fragile.  

  If you explore interventions (e.g., breaking observation chains), I recommend cascade literature in economics (e.g., Bikhchandani et al.) or network epistemology (e.g., Zollman graphs). But as requested, I omit bibliographies.
