  For the "thin slices" section, the weight/amplitude issue is crucial. Ray could argue that consciousness follows survivable branches by necessity, so probability doesn't feel relevant to the observer. D would counter that most branches lead to deterioration, not immortality. This tension should highlight the theory's paradoxes without resolution.

