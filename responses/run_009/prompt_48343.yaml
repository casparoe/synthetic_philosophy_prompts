  Okay, the user is on a committee for a PhD political philosophy comp exam and wants to create a utilitarianism question centered on Harsanyi's aggregation theorem. They're frustrated with students just memorizing the theorem without understanding its nuances. The key issues they want to test are interpersonal comparability and the ex ante vs ex post distinction, particularly through Diamond's critique.

  I need to design an essay question that forces students to critically engage with these two "soft spots." The user specifically wants a "candidate X claims..." framing where X argues the theorem plus impartiality leads directly to utilitarianism. The question should make students assess: 1) what the theorem actually proves vs what interpretation adds, 2) where interpersonal comparability enters (whether through equal weights or elsewhere), and 3) whether egalitarians can reject premises rather than conclusions.

  For the model answer, I'll structure it around three core challenges to X's position. First, the affine rescaling problem - showing how utility scales aren't fixed. Second, demonstrating that comparability enters through the impartiality assumption, not the theorem itself. Third, explaining how Diamond's ex ante Pareto critique allows rejecting the premise. Each point should directly counter X's oversimplified view.

  The marking scheme out of 20 should have five must-hit points: 
  1) Correct theorem statement (3 marks) - catching misstatements
  2) Affine rescaling explanation (4 marks) - catching "weighted sum is well-defined" error
  3) Comparability entry point analysis (5 marks) - catching "theorem gives comparability" mistake
  4) Ex ante Pareto critique (5 marks) - catching "Pareto is unobjectionable" assumption
  5) Egalitarian premise rejection (3 marks) - catching "must accept conclusion" fallacy

  I'll keep the impartial observer reference brief as requested. The model answer should demonstrate how a strong candidate would dismantle X's argument by showing where the reasoning jumps from formal result to philosophical conclusion. The tone should be rigorous but accessible, modeling the depth expected from PhD candidates.
answer: |-
  Here is the exam question and assessment materials designed to meet your specifications:

  **Exam Question:**

  > Candidate X argues: "Harsanyi's Aggregation Theorem definitively resolves the debate over utilitarianism. It proves that if individuals are expected utility (EU) maximizers, the social planner is an EU maximizer, and the Pareto principle holds (if every individual is indifferent between two social lotteries, so is the planner), then social welfare *must* be a weighted sum of individual utilities. Adding impartiality – requiring that individuals are treated symmetrically – forces equal weights, yielding classical utilitarianism. Crucially, the theorem *derives* the need for interpersonally comparable cardinal utility from these uncontroversial rationality axioms; there's no extra 'assumption' of comparability. This means that any demand for egalitarian redistribution beyond what maximizes the sum of utilities is irrational sentiment, violating either EU rationality or Pareto efficiency. Diamond's 'ex post' critique is irrelevant because the theorem operates squarely within the ex ante, lottery-based framework defining rationality itself."
  >
  > Critically assess Candidate X's argument. Your assessment must address:  
  > (1) What the Aggregation Theorem strictly establishes and what interpretive steps are added to reach X's conclusion of classical utilitarianism.  
  > (2) Where and how the assumption (or derivation) of *interpersonally comparable* cardinal utility enters the argument, specifically examining whether it is truly derived solely from the theorem's axioms or introduced subsequently.  
  > (3) Whether an egalitarian critic, concerned about ex post outcomes, can coherently reject X's conclusion by challenging one of the theorem's premises rather than simply denying its conclusion, and if so, how.

  **Model Answer (Approx. 650 words):**

  Candidate X presents a common but critically flawed interpretation of Harsanyi's Aggregation Theorem. While the theorem is a significant result, X overstates its implications for utilitarianism by misrepresenting its scope, overlooking a crucial technical gap concerning interpersonal comparability, and dismissing the substantive force of egalitarian critiques like Diamond's.

  **(1) Theorem vs. Interpretation:** Harsanyi's theorem strictly establishes that if: (i) each individual's preferences satisfy the EU axioms (hence representable by a cardinal utility function unique up to positive affine transformations: U_i' = a_i + b_i*U_i, b_i > 0); (ii) the social planner's preferences over social lotteries satisfy the EU axioms; and (iii) the Social Lotteries Pareto Principle holds (if every individual is indifferent between two social lotteries L1 and L2, then the planner is indifferent), then the planner's utility function W can be written as a *weighted sum* of *some* cardinal representation of individual utilities: W = Σ λ_i U_i, with λ_i > 0.

  X correctly notes adding impartiality/symmetry (λ_i = λ_j for all i,j) yields W = Σ U_i. **However, this is *not* yet classical utilitarianism.** Classical utilitarianism requires maximizing the sum of *interpersonally comparable* and *cardinally significant* utilities. The theorem only guarantees that W is *a* weighted sum of *some arbitrarily scaled* individual EU functions. The critical interpretive leap is assuming that the specific utility functions summed are interpersonally comparable. The theorem provides a mathematical form but not the necessary interpersonal meaning for the sum to represent utilitarian social welfare.

  **(2) The Entry Point of Interpersonal Comparability:** X is fundamentally mistaken in claiming the theorem "derives" interpersonal comparability from the axioms. **Comparability is not derived; it is presupposed in the interpretation of the sum as utilitarian social welfare.** The theorem itself operates entirely within a framework where individual utilities are *not* interpersonally comparable. Each U_i is unique only up to its *own* affine transformation. Crucially, applying a different affine transformation to each individual's utility (changing scales and zero points arbitrarily per person) will change the weighted sum W' = Σ λ_i (a_i + b_i U_i) = Σ λ_i a_i + Σ λ_i b_i U_i. This is a *different* function than the original W = Σ λ_i U_i, yet it represents the *same* social preferences under the theorem's conditions! The "weighted sum" form is preserved, but the specific numerical values and interpersonal relationships change dramatically based on scaling choices. Therefore, the theorem establishes that social welfare is *a* weighted sum of *some* representation of individual utilities, but it says nothing about *which* representation possesses interpersonal meaning. **The assumption of interpersonal comparability enters when we insist that the specific U_i functions being summed (with their implicit scales) are the ones that can meaningfully be compared and added across persons.** This assumption is *external* to the theorem. Impartiality (equal weights) does not resolve this; it merely averages whatever scales happen to be chosen. X conflates the mathematical form of the social welfare function with its substantive interpretation as utilitarianism, overlooking the affine rescaling freedom that severs the link between the theorem and interpersonal comparisons.

  **(3) Rejecting the Premise: The Egalitarian Escape:** An egalitarian critic can coherently reject X's conclusion not by denying EU rationality for individuals or the planner *per se*, nor by denying Pareto over *sure outcomes*, but by **rejecting the Social Lotteries Pareto Principle** *as applied to risky choices*. This is Diamond's core insight. Consider a simple case: giving a lifesaving drug to either Adam or Betty, who are otherwise identical and equally deserving. Lottery A: Flip a fair coin; Adam gets it on heads, Betty on tails. Lottery B: Give it to Adam outright. Assume Adam and Betty are EU maximizers and, being identical, indifferent between A and B (each has 50% chance). The Social Lotteries Pareto Principle *requires* the planner to be indifferent between A and B. The weighted sum (including equal weights) also implies indifference. However, an egalitarian might value the *ex post* fairness guaranteed by Lottery A (each has an equal chance) compared to the *ex post* inequality of Lottery B (Adam definitely saved, Betty definitely not), even though *ex ante* opportunities are equal. They might strictly prefer A to B. This preference violates the Social Lotteries Pareto Principle (since individuals are indifferent) but *not* the Pareto principle over sure outcomes. It also violates the implication of the Aggregation Theorem. By rejecting the *ex ante* Pareto principle for lotteries, the egalitarian avoids being forced into the weighted sum framework and its indifference between A and B. They accept that individuals and the planner might be EU maximizers but argue that the social evaluation of *risk* incorporates concerns about the final distribution of benefits that go beyond respecting individual *ex ante* indifference. This provides a rational basis for redistribution (or fair procedures like lotteries) that is not merely sentiment but stems from a different, arguably consistent, social rationality. X dismisses this critique by assuming the *ex ante* Pareto principle is part of the definition of rationality, but this premise itself is the locus of the egalitarian challenge.

  **Conclusion:** X's argument fails on three counts. The theorem establishes only a mathematical representation, not interpersonal comparability. Comparability is an additional, substantive assumption smuggled into the interpretation. Egalitarians can rationally reject the *ex ante* Pareto premise, avoiding the utilitarian conclusion without abandoning core rationality axioms for individuals or the planner under certainty. Harsanyi's theorem is significant but does not deliver the decisive, assumption-free victory for utilitarianism that X claims.

  ---

  **Marking Scheme (Out of 20):**

  1.  **Accurate Statement of Strict Implications (3 marks):** Clearly distinguishes what the theorem proves (weighted sum of *some* affine representations) from X's conclusion (classical utilitarianism). *Catches:* Conflating the mathematical form with substantive interpersonal utilitarianism; failing to mention affine uniqueness.
  2.  **Affine Rescaling & Comparability Gap (4 marks):** Explains how applying different affine transformations per person changes the weighted sum while preserving social preferences under the theorem, proving interpersonal comparability is not derived but assumed. *Catches:* Claiming the theorem "derives" comparability; treating "the weighted sum" as uniquely defined without scaling choices.
  3.  **Locus of Comparability Assumption (5 marks):** Argues persuasively where comparability enters (interpretation/scaling choice, not the axioms or equal weights step), acknowledging potential nuances (e.g., discussing if planner's EU *implies* a common scale, but noting this would *be* the comparability assumption). *Catches:* Asserting comparability comes *only* from impartiality; failing to engage with the core scaling problem; accepting X's claim it's derived.
  4.  **Ex Ante Pareto Critique & Egalitarian Rejection (5 marks):** Clearly reconstructs Diamond's point (indifference to fair procedure vs. unequal outcome); explains how rejecting the Social Lotteries Pareto Principle provides an escape route; distinguishes this from rejecting Pareto over sure outcomes or individual EU rationality. *Catches:* Dismissing Diamond as irrelevant; claiming rejecting ex ante Pareto is irrational per se; conflating with rejecting all Pareto principles.
  5.  **Coherent Egalitarian Position (3 marks):** Articulates how the egalitarian position (valuing ex post fairness/procedure) is consistent *if* the ex ante Pareto premise is rejected, without necessarily abandoning other rationality axioms. *Catches:* Claiming egalitarians must reject EU or planner rationality; stating egalitarianism is only "sentiment" without addressing the premise rejection strategy.
