answer: |-
  Here’s your Q&A preparation sheet, structured by anticipated objection order, with committed replies, concessions, vulnerabilities, and the "sinking" objection flagged. Each objection is phrased in the speaker’s voice, and replies are optimized for 2-minute responses.

  ---

  ### **1. Formal Epistemologist #1 (Counterexamples: Competence as Relabeling?)**
  *Objection:*  
  "You claim competence conditions handle counterexamples. But doesn’t this just *relabel* the problem? When I take a drug that makes me believe 2+2=5, I know my future self is *unreliable*—but van Fraassen already captures this by saying Reflection doesn’t apply to irrational future states. Your ‘competence’ adds nothing new; it’s a restatement of the original restriction."

  *Your Reply:*  
  "No, van Fraassen’s restriction is *temporal*: he exempts cases where you know your future self is irrational *at t*. But my competence condition is *synchronic* and *content-specific*. It’s not about global irrationality; it’s about whether your future self is reliable *on A specifically* at t. Crucially, you can judge your future self globally rational but incompetent on A (e.g., forgetting evidence *for this proposition*), or globally compromised (e.g., drugged) but competent on A (if the drug doesn’t affect math). The normative work is in the *local competence judgment*, not a blanket temporal rule."  

  *Concession:*  
  I’ll grant that if competence just means "rational at t," we’ve relabeled. But it’s a substantive evaluation of reliability *on the question at hand*.  

  *Vulnerability:*  
  If pressed: "What operationalizes competence beyond reliability?" A sharper critic might argue competence collapses into "future credence aligns with truth," making deference circular. *Hope they don’t ask:* **"Isn’t your competence condition just a proxy for expected accuracy, reducing your principle to 'defer when your future self is probably right'?"**  

  ---

  ### **2. Formal Epistemologist #2 (Moorean Absurdity)**
  *Objection:*  
  "Reflection avoids Moore-paradoxical states: asserting 'A, but I’ll believe ~A at t'. Your view permits this whenever competence fails (e.g., 'A is true, but after the drug I’ll believe ~A'). But isn’t this *still* pragmatically incoherent? How can you rationally assert A while broadcasting that your future self will deny it?"  

  *Your Reply:*  
  "The incoherence isn’t in the *credence state* but in *asserting* it. Moorean absurdity arises from *speech acts*, not credences. Rationally, I can *assign high credence now* to [A & my future self believes ~A] if I know my future self is incompetent. What I shouldn’t do is *assert A* while *also asserting* I’ll disbelieve it later—but that’s a norm of assertion, not credence. Reflection misdiagnoses this as a credal requirement."  

  *Must Hold:*  
  The coherence of synchronic credences in [A & future self believes ~A] under known incompetence.  

  *Vulnerability:*  
  If the Kantian links this to self-trust: "Doesn’t this credence imply a fractured agency?" (See #5).  

  ---

  ### **3. Formal Epistemologist #1 (Dutch Books)**
  *Objection:*  
  "Dutch book arguments for diachronic Reflection show that violating it makes you exploitable. You reject Reflection—so how do you explain the Dutch book? Is your synchronic principle immune? If so, why isn’t *it* Dutch-bookable?"  

  *Your Reply:*  
  "Dutch books against Reflection fail because they *assume you must accept bets based on future credences*. But if I know my future self is incompetent, I *rationally refuse* bets tied to their credences. The ‘diachronic’ book only works if you ignore your own knowledge of future irrationality. My synchronic principle *is* Dutch-bookable if violated, but that’s fine—it’s a synchronic norm! The book would exploit a *current* inconsistency in your conditional credences."  

  *Concession:*  
  I concede Dutch books *threaten* synchronic violations. But for diachronic Reflection, the books are unsound when future incompetence is known.  

  *Vulnerability:*  
  A sharper critic: "But if you violate synchronic Reflection *now* (e.g., Cr(A | FutCr(A)=0.9) = 0.5), and FutCr=0.9 is *possible*, a bookie can exploit you *today* without waiting. Doesn’t this force your synchronic principle?" *→ Reply: "Yes, and I endorse that synchronic principle—it’s my core thesis!"*  

  ---

  ### **4. Bayesian Statistician (Triviality/Emptiness Charge)**
  *Objection:*  
  "This is either trivial or empty. If ‘competence’ means your future credence is *probabilistically independent* of A given your current knowledge, then by the tower property, Cr(A | FutCr(A)=r) = r. It’s a theorem, not a norm. If competence means anything else, your principle just says ‘defer when you should defer’—which is circular and useless."  

  *Your Reply:*  
  "Competence isn’t probabilistic independence—it’s an *epistemic judgment* that your future self is reliable on A. The tower property requires Cr(FutCr(A)=r) > 0 and FutCr(A) to be a random variable, but my principle applies even when competence is uncertain! It says: *if* you take your future self as competent, *then* your conditional credence should be r. This isn’t a theorem; it’s a normative constraint on expert deference, akin to Gaifman’s ‘expert principle’. Empty? No: it forces consistency between your deference rule and your competence assessment."  

  *Must Hold:*  
  Competence is not reducible to a probabilistic condition.  

  *Vulnerability:*  
  If pressed: "How do you formalize competence without circularity?" *Weakest reply:* **"It’s a primitive normative stance, like trusting a scientist’s expertise on climate data."** *Risk:* Statistician dismisses it as "non-Bayesian."  

  ---

  ### **5. Kantian (Alienation/Agency Charge)**
  *Objection:*  
  "Treating your future self as an ‘external source’ denies the continuity of rational agency. My future credence isn’t a *report* by an expert—it’s *my own* future judgment. If I see it as merely ‘deference-worthy when competent,’ I alienate myself from my future rational activity. Reflection’s value is in binding my future self to my current one as a single agent. Your view reduces self-trust to trust in a stranger."  

  *Your Reply (Critical Hold):*  
  "The continuity of agency doesn’t require diachronic self-deference. Synchronic Reflection *already* binds me to my future self when I judge it *me*—i.e., competent. But if I know I’ll be wishful or forgetful, that future self *isn’t fully me* epistemically. Forcing deference then isn’t self-trust—it’s self-betrayal. The ‘single agent’ must be responsive to reasons over time; blind deference ignores that."  

  *Concession:*  
  I concede that *when competent*, deferring to your future self expresses agential unity. But this is a *consequence* of competence, not what makes it rational.  

  *Vulnerability:*  
  This is the **weakest reply**. If pressed: **"Isn’t your ‘incompetent future self’ still *you*, and doesn’t disowning it undermine responsibility?"** → *I’m buying time by separating epistemic from moral agency*.  

  ---

  ### **The Sinking Objection**
  **If the Kantian lands this unrebutted, you sink:**  
  *"If your future self’s credence is just ‘one more source,’ why should I ever privilege it over other experts? When I defer to a weather service, I don’t *become* the weather service. But when I defer to my future self, I *am* that future self. Your view severs the identity that makes deference to *this particular source* constitutive of my agency. Without diachronic Reflection, epistemic self-constitution collapses."*  

  *Why it sinks:*  
  It forces you to either (a) concede that future selves *are* special (undermining your "no different" slogan), or (b) defend a fragmented self-view alien to epistemic rationality. The audience’s Kantian and formalists could unite here.  

  *Best Reply (If Sunk):*  
  "Deferring to a *competent* future self *is* privileging it—because competence includes the judgment that *I will have integrated my reasons correctly*. But if I know I won’t (e.g., forgetting evidence), it’s not *my* rational self. The privilege is earned by competence, not identity. Self-constitution requires *good* self-relations, not sheer continuity."  

  ---

  ### **What to Concede Up Front**
  - "Reflection *seems* intuitive when we imagine our future selves as improved versions of us."  
  - "Dutch books against synchronic Reflection are valid; mine is a synchronic norm."  
  - "Competence can’t be reduced to a formula—it’s a substantive evaluation."  

  ### **What to Hold No Matter What**  
  1. **Diachronic Reflection is not a general requirement of rationality.**  
  2. **All normative force resides in the synchronic competence-conditional principle.**  
  3. **Future selves are epistemically on par with other experts.**  

  ### **Hoping Nobody Asks**  
  **"When you judge your future self incompetent, is that judgment itself subject to a future competence assessment? Doesn’t this regress undermine the stability of your synchronic principle?"**  
  *(Reply: "No—the current judgment is based on *current* evidence. It may be wrong, but rationality doesn’t require infallibility.")*  

  ---  
  **Final Tip:** Anchor all replies in concrete cases (e.g., the drug example). The formalists respect cases; the Kantian needs phenomenology. Keep your slogan visible: **"Your future self is just one more source."**
