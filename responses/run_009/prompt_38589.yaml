  Okay, the user is a science writer focusing on neuroscience and AI, specifically dealing with claims about consciousness. They need a clear set of criteria to evaluate whether headlines like "scientists detect consciousness" are justified. Their editors are pushing for rigor, and they've been relying on instinct so far. They want a specification—desiderata that any theory of consciousness must meet to address the hard problem properly.

  First, I need to understand what the hard problem entails. It's not just about functions like attention or reporting but why there's subjective experience at all. The user listed specific points they want covered: explaining why experience accompanies physical processes, a discriminator for detecting consciousness, handling first-person vs. third-person asymmetry, addressing boundary cases, avoiding circularity, and marking which requirements are non-negotiable versus contentious.

  The user also wants to know if some desiderata conflict, like having a measurable signature while respecting first-person authority. They mentioned IIT, GWT, HOT, and illusionism as examples to briefly assess against the criteria, but the focus should be on the framework itself.

  Breaking down the desiderata: The hard problem distinction is crucial. Chalmers' hard problem is about why processing feels like something, not just how it works. So non-negotiable: any theory must tackle this explanatory gap. Without that, it's changing the subject.

  A discriminator is tricky. We need a way to detect consciousness in others, but current methods (like verbal reports) can fail in edge cases. The theory must provide a criterion or honestly admit if it's impossible. This might conflict with first-person authority since my own consciousness is directly known, while others' is inferred. So, the theory must reconcile these perspectives without reducing one to the other.

  Boundary cases are key for testing theories. Split-brain patients, locked-in syndrome, organoids—each presents unique challenges. A theory must consistently apply to these without special pleading. Avoiding circularity is vital too; defining consciousness by reports and then explaining reports as caused by consciousness fails when reports and experience dissociate, as in locked-in patients.

  Now, which desiderata are non-negotiable? Addressing the hard problem, avoiding circularity, and handling epistemic asymmetry seem essential. Demands like causal efficacy or computability might be camp-specific. For example, illusionists deny phenomenal consciousness, which some see as avoiding the hard problem, while others argue it's a valid approach.

  Conflicts: A third-person discriminator and first-person authority might clash. If consciousness is private, how can we measure it objectively? Theories like IIT claim a measure (Φ), but it's controversial. If they can't be reconciled, journalists should note that detecting consciousness might always involve inference, not direct measurement.

  Assessing theories briefly: IIT directly tackles the hard problem with its axioms but faces practical and conceptual issues with Φ. GWT focuses on access consciousness, which might sidestep the hard problem. HOT explains meta-awareness but not raw experience. Illusionism denies phenomenal consciousness, which many see as changing the subject.

  The user's deeper need is a reliable framework to evaluate claims without hype. They want to inform readers accurately, avoiding sensationalism. Highlighting conflicts and non-negotiable criteria helps them scrutinize studies and headlines critically. Emphasizing that no theory fully satisfies all criteria can temper overconfident claims in their reporting.
answer: |-
  Here is a specification of desiderata for an adequate scientific theory of consciousness addressing the "hard problem," along with analysis of their status and brief theory evaluations. These criteria are designed to help you judge whether a claim genuinely licenses a headline like "Scientists Detect Consciousness" or merely reports a correlate.

  ### Core Desiderata: Non-Negotiable (Addressing the Hard Problem)

  1.  **The Phenomenal Explanation Requirement:**
      *   **What it must deliver:** Explain *why* certain physical processes give rise to *subjective experience* (qualia, "what it is like"-ness), not merely *how* they enable cognitive functions (attention, discrimination, report, integration).
      *   **Motivation:** The core of the hard problem (Chalmers). We can fully understand the information processing of vision (wavelength discrimination, object recognition, behavioral response) without understanding why it is accompanied by the *experience* of red or the *feeling* of depth. Any theory that only explains functions changes the subject to "easy problems."
      *   **Non-negotiable:** Yes. Failure here means the theory isn't about phenomenal consciousness as commonly understood.

  2.  **The Anti-Circularity Requirement:**
      *   **What it must deliver:** Define consciousness independently of its *reportability* or *behavioral expression*. It must explain how reports/behaviors *arise from* consciousness (or vice versa, or in parallel) without defining consciousness *as* the capacity for report/behavior.
      *   **Motivation:** Cases where consciousness and report dissociate are crucial: locked-in syndrome (consciousness without report), blindsight (report/discrimination without acknowledged visual consciousness), advanced anesthesia (potential unconscious processing). A theory defining consciousness as report fails utterly here and begs the question.
      *   **Non-negotiable:** Yes. Circularity renders the theory empirically vacuous and unable to address the core dissociations.

  3.  **The Epistemic Asymmetry Requirement:**
      *   **What it must deliver:** Account for the fundamental difference between first-person knowledge ("I know I am conscious directly") and third-person knowledge ("I infer you are conscious based on evidence"). It must explain why my own consciousness seems so indubitable and immediate while yours is inferred.
      *   **Motivation:** The foundational puzzle of consciousness studies. Any adequate theory must make sense of this asymmetry without denying its existence or reducing first-person authority to an illusion *in a way that begs the question*.
      *   **Non-negotiable:** Yes. Ignoring this asymmetry fails to capture the very phenomenon under study. It must be addressed, even if the explanation is that the asymmetry is an epistemic artifact of the system's structure.

  ### Important Desiderata: Highly Desirable But Potentially Contentious

  4.  **The Discriminator Requirement:**
      *   **What it must deliver:** Provide (a) a principled, measurable signature or criterion (neural, computational, informational, etc.) that reliably indicates the *presence* and *level/type* of consciousness in *novel* systems, *or* (b) a rigorous, honest explanation for why such a discriminator is impossible in principle or in practice, and what that implies for detection.
      *   **Motivation:** Essential for practical application (clinical diagnosis, ethics of AI/organoids) and scientific testing. Without it, claims of "detection" are merely assertions about correlates. The hard cases (boundary systems) test its robustness.
      *   **Status:** Highly desirable, but potentially contentious. Some argue a perfect objective measure is impossible (due to the Hard Problem/Epi Asymmetry). However, a theory gains immense credibility if it offers a falsifiable discriminator. *Demanding absolute certainty might be unreasonable; demanding a principled, testable proposal based on the theory is crucial.*

  5.  **The Boundary Cases Requirement:**
      *   **What it must deliver:** Offer consistent, principled explanations (or predictions) for the presence/absence/quality of consciousness in ambiguous or dissociated systems: cortex vs. cerebellum, split-brain patients, dreamless sleep vs. REM vs. wakefulness, anesthesia depth, locked-in syndrome, minimally conscious state, brain organoids, current/future AI systems.
      *   **Motivation:** These are the crucial test cases that differentiate theories and reveal the scope of the proposed mechanism. A theory must not just handle "normal" cases but explain the gradients and dissociations at the edges.
      *   **Status:** Highly desirable and a strong test of a theory's coherence and explanatory power. However, precise predictions might be limited by current empirical data on these cases. The *demand* for principled handling is non-negotiable; the *specific predictions* are testable consequences.

  ### Contentious Requirements (Often Camp-Specific Prejudices)

  *   **Causal Efficacy:** *Is consciousness causally potent?* Some (e.g., many GWT proponents) argue consciousness *is* a specific form of information processing with causal power. Others (e.g., epiphenomenalists, some illusionists) argue it's a causally inert byproduct. **Status:** A metaphysical wager, not a core desideratum. A theory can be adequate while taking either stance.
  *   **Computability / Realizability in Silicon:** *Must consciousness be substrate-independent?* Computationalists (IIT, GWT, HOT proponents) generally say yes. Biological naturalists might argue biological specifics are crucial. **Status:** A philosophical assumption influencing theory building, not a requirement for addressing the hard problem itself. A theory could adequately explain biological consciousness while being silent on silicon.
  *   **Illusionism is Valid:** *Is phenomenal consciousness ultimately an illusion?* Illusionists say yes. Most others vehemently disagree, arguing it denies the explanandum. **Status:** This *is* a core dividing line. Accepting illusionism as "addressing the hard problem" is highly contentious; critics argue it *is* changing the subject by denying the phenomenon exists.

  ### Critical Conflict: Can Desiderata Be Jointly Satisfied?

  *   **The Core Tension:** The **Discriminator Requirement** (objective, third-person measurement) directly clashes with the **Epistemic Asymmetry Requirement** (first-person privacy/authority) and the **Hard Problem** (why experience arises). *Can a purely physical signature ever fully capture or prove the existence of private, subjective experience?*
  *   **Implications for Reporting:**
      *   **Honesty:** Headlines like "Scientists Detect Consciousness" are *always* shorthand for "Scientists Detect [Specific Proposed Neural/Computational Signature] Strongly Correlated With/Postulated To Be Consciousness." Be explicit about the theory and its limitations.
      *   **Humility:** Emphasize that detection relies on *inference* based on a theory's discriminator. No test provides absolute, first-person proof of another's consciousness. The gap between third-person measure and first-person reality remains philosophically open.
      *   **Context:** Assess claims relative to the theory's handling of boundary cases and dissociations. A "detection" claim is strongest if the discriminator successfully handles cases like locked-in or anesthesia.

  ### Brief Theory Scorecard Against Desiderata

  *   **Integrated Information Theory (IIT):**
      *   **Phenomenal Explanation:** Explicitly targets the hard problem (axioms based on phenomenology). **Strength.**
      *   **Anti-Circularity:** Defines consciousness (Φ) independently of report. **Strength.**
      *   **Epistemic Asymmetry:** Less directly addressed; high Φ implies intrinsic existence, but doesn't fully explain asymmetry.
      *   **Discriminator:** Offers Φ (and related measures). Highly specific but controversial, computationally intractable for brains, gives counter-intuitive results (high Φ in grids, low in cerebellum plausible). **Attempted, Contentious.**
      *   **Boundary Cases:** Makes specific predictions (e.g., cerebellum unconscious, cortex conscious; split-brain = two consciousnesses; organoids/AI could be conscious if high Φ). **Strength in theory, weakness in practical verification.**
      *   **Overall:** Directly tackles hard problem, strong on anti-circularity and boundaries, discriminator is its boldest/fraughtest claim.

  *   **Global Workspace Theory (GWT):**
      *   **Phenomenal Explanation:** Focuses on "access consciousness" (reportable information). Often sidesteps or reduces the hard problem of "phenomenal consciousness." **Major Weakness** for hard problem purists.
      *   **Anti-Circularity:** Risk of circularity: consciousness *is* global broadcast (which enables report), report is evidence *of* global broadcast. Struggles with report/experience dissociations. **Weakness.**
      *   **Epistemic Asymmetry:** Not a primary focus.
      *   **Discriminator:** Proposes neural signatures of global broadcast (e.g., widespread, sustained, coherent activation, P3b EEG wave). Empirically supported correlate, but is it consciousness or just access? **Correlate, not necessarily essence.**
      *   **Boundary Cases:** Explains loss in anesthesia/deep sleep, access in locked-in if broadcast possible. Less clear on split-brain, cerebellum, organoids. **Moderate.**
      *   **Overall:** Strong on neural correlates and cognitive function, weak on hard problem and anti-circularity. Often seen as addressing "access" not "phenomenal" consciousness.

  *   **Higher-Order Theories (HOT):**
      *   **Phenomenal Explanation:** Consciousness arises when a mental state is the target of a higher-order thought/representation. Explains *awareness of* states, less clearly the raw qualitative feel (hard problem). **Contentious.**
      *   **Anti-Circularity:** Consciousness defined by meta-representation, not report per se. Can handle some dissociations (e.g., unaware processing lacks HOT). **Moderate.**
      *   **Epistemic Asymmetry:** First-person authority comes from direct access to one's own HOTs. **Attempts explanation.**
      *   **Discriminator:** Neural signatures of meta-representational circuits (prefrontal cortex heavy). Correlates exist, but isolating specific HOTs is hard. **Challenging.**
      *   **Boundary Cases:** Explains loss in dreamless sleep/anesthesia (no HOT), potential issues in split-brain (one HOT system?). Less clear on organoids/AI. **Moderate.**
      *   **Overall:** Focuses on cognitive architecture of awareness. Tackles epistemic asymmetry, but hard problem explanation is debated.

  *   **Illusionism:**
      *   **Phenomenal Explanation:** Denies the existence of phenomenal properties (qualia) as commonly conceived; they are introspective illusions. **Radically changes the subject** for critics; dissolves the hard problem by denying its object for proponents.
      *   **Anti-Circularity:** Not applicable in the same way, as the target is the illusion of qualia. Focuses on explaining why we *think* we have qualia.
      *   **Epistemic Asymmetry:** Explains the *feeling* of direct access as part of the illusion.
      *   **Discriminator:** Focuses on detecting the cognitive mechanisms that generate the illusion. Not a discriminator for "real" qualia (which it denies).
      *   **Boundary Cases:** Explained by the presence/absence/functioning of the illusion-generating mechanisms.
      *   **Overall:** Avoids the hard problem by eliminativism/reductionism. For most non-illusionists, it fails the **Phenomenal Explanation Requirement** by definition. Its adequacy hinges entirely on accepting its core metaphysical claim.

  ### Conclusion for Your Reporting

  Your specification is the set of **Non-Negotiable Desiderata (1, 2, 3)**. A claim to "detect consciousness" based on a theory that fails these is likely overreaching or changing the subject. The **Discriminator (4)** and **Boundary Case Handling (5)** are crucial for evaluating the *scientific robustness and practical utility* of a claim and the theory behind it. Always highlight the **Core Tension** between objective detection and subjective reality.

  When evaluating a claim:
  1.  **What theory underpins the detection method?** (Explicit or implicit?)
  2.  **Does this theory genuinely tackle the hard problem (Desideratum 1)?** Or is it focused on function/correlation?
  3.  **Is the discriminator (e.g., the "signature" found) defined independently of report (Desideratum 2)?**
  4.  **How does the theory handle key boundary cases (Desideratum 5)?** Does the new finding fit consistently?
  5.  **Acknowledge the gap:** Emphasize that "detection" means "inferred based on theoretical criteria X in system Y," not direct proof of subjective experience. Avoid overly definitive headlines unless the evidence and theory are exceptionally strong across these criteria. The search for consciousness is fundamentally a search for the best *explanation* of subjective experience, not just a physical signature.
