prompt: |-
  I've been reading about how my country's regulators weigh costs and benefits, and I gather that a death prevented in 2100 counts, in their arithmetic, for only a small fraction of a death prevented today. Part of that is supposed to cover uncertainty and the fact that people will probably be richer then, but apparently there is also a component that discounts purely for lateness: the very same benefit is worth less simply because it arrives later. That sits oddly next to two other things the same governments do. Their climate rhetoric says future generations have exactly as strong a claim on us as people alive now, and their consumer-finance campaigns treat my own preference for enjoyment today over enjoyment in thirty years as a bias to be trained out of me. So what does the practice of applying a positive discount rate in official cost-benefit analysis actually presuppose? Give me exactly five assumptions it rests on — about time, value, persons, or what consistency requires — numbered, each in a sentence or two, no introduction or conclusion. Where the practice could survive dropping an assumption, or where two of the assumptions pull against each other, say so within that item.
reasoning: |-
  Okay, the user is asking about the assumptions behind using a positive discount rate in cost-benefit analysis. They noticed a contradiction between how governments discount future lives in policy calculations versus their rhetoric on climate change and personal finance advice. 

  First, I need to unpack why this seems inconsistent to them. The regulators treat future lives as less valuable purely because they're in the future, but then tell us to care equally about future generations and to value our own future equally via savings. That cognitive dissonance is what's bothering them.

  The core task is to identify exactly five foundational assumptions behind discounting future benefits. Let me mentally walk through the economic theory. Pure time preference is key - that we intrinsically value present over future. Then there's opportunity cost of capital, since money now could be invested. Expected wealth growth matters too, as richer future populations might need less marginal utility. 

  I should also consider how we view persons - discounting treats generations as fungible economic units rather than distinct moral entities. And finally there's the consistency requirement: that economic logic demands uniform application of discount rates across contexts, even if it creates surface-level contradictions with ethical positions.

  For each assumption, I'll note where it could be relaxed. Like how some models use declining discount rates, or how climate economists might drop the wealth growth assumption for catastrophic risks. The tension between ethical universalism and economic pragmatism should be highlighted too - that's where the user's discomfort originates.

  The response must stay tightly structured: exactly five numbered points, no fluff. I'll keep the language precise but accessible since they're clearly well-read but not necessarily an economist. The challenge is making technical assumptions clear while honoring their philosophical concern about intergenerational justice.
answer: |-
  Here are five assumptions underlying the practice of applying a positive discount rate in official cost-benefit analysis:

  1.  **Pure Time Preference:** It assumes individuals and society intrinsically value present well-being more than identical future well-being, even accounting for uncertainty or changing circumstances. This presupposes an inherent preference for earlier consumption or benefit, independent of risk or wealth changes. The practice could survive dropping this assumption if discounting relied solely on other factors like opportunity cost or expected growth.

  2.  **Opportunity Cost of Capital:** It assumes resources not used for a present benefit can be invested productively elsewhere, generating returns over time. Therefore, a future benefit must exceed the present benefit by the potential return rate to be equally valuable. This assumption is often central and the practice would fundamentally change without it, though alternative discount rates reflecting social rather than private returns could be used.

  3.  **Expected Growth and Declining Marginal Utility:** It assumes that future generations will, on average, be wealthier than the current generation, and that an additional unit of consumption (or benefit like a life saved) provides less utility (value) to a wealthier person. Thus, the same physical benefit is valued less in a richer future. This assumption can be dropped specifically for benefits where marginal utility doesn't decline (e.g., catastrophic risks) or where growth is highly uncertain.

  4.  **Fungibility of Persons Across Time:** It presupposes that future individuals are essentially substitutable economic units in a continuous societal stream, where value aggregates across time. The distinct moral claims of specific future persons are subordinated to the overall maximization of discounted net benefits. This contrasts with ethical views prioritising the rights or claims of identifiable future persons. Dropping this assumption would challenge the core aggregation logic of standard CBA.

  5.  **Consistency of Valuation Across Contexts:** It requires applying the same discounting logic uniformly across *all* government policies and investments to ensure efficient allocation of societal resources over time. This presupposes that economic efficiency, defined by this consistent metric, outweighs potential inconsistencies with ethical rhetoric or paternalistic financial advice aimed at correcting individual biases. The tension arises because this consistency clashes with the different normative demands of intergenerational ethics and individual financial education.
