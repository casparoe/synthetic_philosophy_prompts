  ---

  ### **Credence Decomposition**
  1.  **Vagueness is semantic (not metaphysical/epistemic)**  
      *Credence: 0.90*  
      Justification: Linguistic usage and conceptual boundaries (e.g., "heap," "bald") vary across contexts and communities without corresponding metaphysical joints in reality; vagueness persists under ideal epistemic conditions.

  2.  **Classical logic/bivalence is non-negotiable**  
      *Credence: 0.40*  
      Justification: Non-classical systems (e.g., fuzzy logic) introduce new complexities (e.g., truth-value gaps, degree functions) that often replicate epistemicism’s problems (e.g., higher-order vagueness) or violate semantic intuitions more severely than epistemicism’s mysterianism.

  3.  **Semantic indecision precludes determinate boundaries**  
      *Credence: 0.70*  
      Justification: If meaning is fixed solely by communal use, and use underdetermines a precise cutoff, no "fact of the matter" exists—only a range of candidate boundaries, none uniquely determined.

  4.  **Supervaluationism handles higher-order vagueness adequately**  
      *Credence: 0.20*  
      Justification: Higher-order vagueness (vagueness in "admissible precisification") forces either infinite regress of precisifications or arbitrary sharpening of admissibility—reintroducing epistemicism at the meta-level.

  5.  **Supervaluationism's artifact problem is a serious cost**  
      *Credence: 0.65*  
      Justification: The supertrue claim "∃n (n grains make a heap ∧ n−1 do not)" contradicts the core supervaluationist thesis that no *determinate* boundary exists. Blocking this requires ad hoc truth-principles (e.g., restricting existential quantification), undermining classical logic.

  ---

  ### **Overall Credence Calculation**  
  Combining factors multiplicatively (assuming interdependence):  
  \[ \text{Credence in C} = (1 - \text{Factor 1}) \times \text{Factor 2} \times (1 - \text{Factor 3}) \times (1 - \text{Factor 4}) \times (1 - \text{Factor 5}) \]  
  \[ = (0.10) \times (0.40) \times (0.30) \times (0.80) \times (0.35) \approx \mathbf{0.15} \]  

  **Key sensitivity**: The credence is most sensitive to **Factor 4 (higher-order vagueness)**. If supervaluationism resolves this (credence → 0.80), my overall credence in C drops to **0.03**. If it fails entirely (credence → 0), C’s credence rises to **0.60**—making epistemicism viable.

