prompt: |-
  I teach political philosophy, with a long-standing side interest in famine and social choice theory, and for the past three years I have served on the ethics and advocacy advisory panel of a large European humanitarian organization. The panel has been asked for something we are not trained to produce, and I would like your help producing it.

  Twice a year, sometimes more often, the organization faces what its advocacy director calls the "man-made question." A food crisis is underway; the press wants to know whether to call it a natural disaster or something with authors; and the language we choose affects fundraising, government access, and, occasionally, whether our country teams are expelled. The decision is currently made ad hoc by whoever is senior in the room, under a 48-hour news deadline, by people with no training in the relevant analysis — desk officers who know the logistics of food aid but not the difference between a famine of food-availability decline and a famine of entitlement collapse. The panel was asked to give them something better. The conceptual resources are ones I know well from the literature — Amartya Sen's entitlement approach, his argument that famines are about people losing their command over food rather than food vanishing, his observation that no substantial famine has occurred in a functioning democracy with a free press, and the further body of work arguing that certain famines are better described as crimes than as disasters, turning on whether deaths were foreseen, intended, or exploited. But knowing the literature does not tell a desk officer what to do by Thursday, and that is the gap I need you to fill.

  What I want is a written procedure the desk can actually run: an ordered sequence of questions, what counts as a sufficient answer to each, where the procedure terminates with a firm classification, where it terminates with an explicit "cannot classify on available evidence," and where it must hand the decision back to a human because the remaining question is one of values or organizational strategy rather than fact. One structural requirement, which I suspect is where most attempts go wrong: the procedure must keep the classificatory verdict (is this famine a natural disaster, an institutional failure, or a political crime?) strictly separate from the tactical one (given the verdict, should we say so publicly?), and must make clear that the second is never settled by the first. It should also be robust to disputed death tolls and contested causation — it should classify under uncertainty rather than demand numbers nobody has.

  Then run the procedure on three historical cases as worked examples: Bengal in 1943, the Irish famine of the 1840s, and the Great Leap Forward. These are cases where the categories have been contested — including whether what distinguishes a crime from a failure is intent, recklessness, foreseeability-ignored, or exploitation after the fact — and where the procedure's treatment of that distinction will determine the verdicts. I will tell you honestly: I expect the procedure, if it is any good, to classify at least one of these cases in a way I am uncomfortable with, probably by treating Bengal as less than a crime on an intent-based test, and I would rather see that worked through than smoothed over. Please include one worked case where the procedure defers to human judgment, and say explicitly where you think the procedure will misfire in live crises.

  Finally, a request about your own epistemic posture: wherever the procedure issues a verdict on one of the three cases, say what argument or consideration, if it held up, would reverse that verdict, and identify the single step in the procedure where you think the reasoning is most likely to fail. I would rather know where the machine breaks than be told it works.
reasoning: |-
  We are designing a decision procedure for classifying famines as:
    A. Natural disaster
    B. Institutional failure
    C. Political crime

  The procedure must be step-by-step, with clear termination points and handling of uncertainty. It should separate the classification (fact-based) from the tactical decision (values/strategy).

  Key conceptual resources:
  - Amartya Sen's entitlement approach: famines are about loss of command over food (entitlement collapse) rather than food availability decline.
  - Sen's observation: no substantial famine in a functioning democracy with a free press.
  - Further work: some famines are crimes (if deaths were foreseen, intended, or exploited).

  The procedure must work under uncertainty and disputed data.

  We structure the procedure as a flowchart of questions. Each question must be answerable with available evidence (which may be incomplete or contested). The procedure must allow for "cannot classify" and hand off to human when the question is about values/strategy.

  We break down the classification into three mutually exclusive categories:

  1. **Natural disaster**: The famine is primarily caused by natural events (e.g., drought, flood, crop failure due to natural causes) and the institutional response was adequate (or at least not grossly negligent) to prevent famine under the circumstances.

  2. **Institutional failure**: The famine is caused by a failure of institutions (government or other) to respond adequately to a crisis (which may have natural triggers) OR by policies that unintentionally led to entitlement collapse (e.g., mismanagement, lack of preparedness, or policies that were not malicious but had disastrous consequences).

  3. **Political crime**: The famine is the result of deliberate actions (or inactions) by those in power, where:
     - The deaths were intended, OR
     - The deaths were foreseeable and the authorities recklessly disregarded the risk, OR
     - The authorities exploited the famine to achieve political goals (e.g., targeting a particular group).

  The procedure must avoid conflation with the tactical decision (whether to publicly assign blame).

  We design the steps as follows:

  ### Step 0: Famine Confirmation
     - **Question**: Is there a famine? (Using standard definitions, e.g., IPC Phase 5 or similar, but note that in historical cases we may have to rely on evidence of mass starvation and excess mortality.)
     - **Sufficient answer**: Evidence of widespread acute malnutrition and excess mortality due to starvation or related diseases.
     - **If no**: Stop. Not a famine.
     - **If yes**: Proceed to Step 1.

  ### Step 1: Food Availability Decline (FAD) vs. Entitlement Collapse (EC)
     - **Question**: Was there a significant decline in aggregate food availability? (e.g., due to natural disaster, war destruction, export, etc.)
     - **Sub-questions**:
        a. Was there a major natural event (drought, flood, etc.) that caused a sharp drop in food production?
        b. Was there a significant reduction in food imports or aid?
        c. Was there a significant diversion of food (e.g., to armies, exports, or other regions) that reduced local availability?
     - **Sufficient answer**: If the answer to any of (a, b, c) is yes and the decline is substantial (say, >20% of normal), then FAD is present. Otherwise, EC is the primary driver.
     - **Note**: Even in the presence of FAD, we must also look at entitlement collapse. But the next step will address the institutional response.

  ### Step 2: Institutional Response
     - **Question**: Did the government (or other responsible institutions) take adequate steps to prevent the famine or mitigate the crisis?
     - **Criteria for adequacy** (must be context-specific, but consider):
        - Early warning systems and response plans in place and activated?
        - Did the government attempt to provide relief (food, cash, employment programs) to those affected?
        - Were there efforts to maintain food distribution and prevent hoarding/speculation?
        - Was the response proportional to the severity of the crisis?
     - **Sufficient answer**: 
        - If the response was timely, adequate, and in line with best practices (for the time and resources), then mark as adequate.
        - If the response was absent, grossly inadequate, or worsened the situation, then mark as inadequate.

  ### Step 3: Distinguishing Institutional Failure from Political Crime
     - **Question**: Was the inadequate response (if found in Step 2) due to incompetence, lack of capacity, or unintentional policy mistakes? Or was it due to deliberate actions/inactions with foresight of the consequences?
     - **Sub-questions**:
        a. **Foreseeability**: Was the famine or the risk of famine foreseeable? (e.g., were there warnings from experts, officials, or the press? Was the risk obvious?)
        b. **Intent**: Is there evidence that the authorities intended to cause starvation? (This is rare; more often it's about recklessness or exploitation.)
        c. **Recklessness**: Did the authorities disregard known risks? (e.g., persisted with policies despite warnings)
        d. **Exploitation**: Did the authorities exploit the famine to achieve political goals? (e.g., targeting a specific group, using food as a weapon, refusing aid to rebel areas)
     - **Sufficient answer**:
        - If the inadequate response was due to incompetence, lack of capacity, or honest mistakes, then classify as **Institutional Failure**.
        - If there is evidence of foreseeability plus either recklessness or exploitation (without needing intent), then classify as **Political Crime**.
        - If there is evidence of intent, then definitely **Political Crime**.

  ### Step 4: Handling Uncertainty
     - At any step, if the evidence is insufficient to answer the question, the procedure terminates with "cannot classify on available evidence".
     - If the evidence is contested, the procedure should use the best available and note the contestation. The classification is then conditional on that evidence.

  ### Step 5: Separation of Classification and Tactical Decision
     - The procedure ends with a classification (Natural disaster, Institutional failure, Political crime, or Cannot classify). 
     - The tactical decision (what to say publicly) is not part of this procedure. The procedure must clearly state that the classification is a factual assessment and that the organization must separately consider strategic factors (e.g., access, safety of staff, impact on victims) when deciding on public messaging.

  ### Worked Examples

  We apply the procedure to three historical famines:

  1. **Bengal Famine (1943)**
  2. **Irish Famine (1840s)**
  3. **Great Leap Forward Famine (1958-1962)**

  We also need one case where the procedure defers to human judgment (due to insufficient evidence or a values question) and one where it might misfire.

  ### Epistemic Posture
  For each verdict, we will state what evidence or argument would reverse it and identify the step most likely to fail.

  ---

  ## Application to Historical Cases

  ### 1. Bengal Famine (1943)
  - **Step 0**: Famine confirmed (excess deaths estimated 2-3 million).
  - **Step 1**: FAD vs. EC.
     - There was a cyclone and crop disease in 1942, but the overall food availability in Bengal in 1943 was only about 5% lower than the average of the previous five years. However, there was significant hoarding and panic buying. Also, the British colonial government diverted food to the war effort and prioritized supplies for the military and urban areas. 
     - **Verdict**: Primarily entitlement collapse (EC) due to failed distribution and market failures, not major FAD.
  - **Step 2**: Institutional Response.
     - The colonial government was slow to recognize the famine. Relief efforts were inadequate and mismanaged. The government continued to export rice from Bengal. Warnings from local officials and the press were ignored.
     - **Verdict**: Inadequate response.
  - **Step 3**: Distinguishing Failure from Crime.
     - **Foreseeability**: Warnings were given by multiple sources (including the Famine Inquiry Commission) but ignored.
     - **Recklessness**: Policies (like export bans that were lifted too late, prioritization of military supplies) were continued despite known risks.
     - **Exploitation**: There is evidence that the colonial government prioritized the war effort over the lives of Bengalis. Some argue that the famine was exacerbated by racist attitudes.
     - **Intent**: No evidence of intent to kill Bengalis, but recklessness and exploitation are present.
     - **Verdict**: Political Crime (due to recklessness and exploitation).

  *Reversal Argument*: If it could be shown that the British government had no reasonable alternative due to war constraints and that they made every effort within their means (which is contested), then it might be downgraded to Institutional Failure. The step most likely to fail is Step 3 (interpretation of recklessness vs. incapacity).

  ### 2. Irish Famine (1840s)
  - **Step 0**: Famine confirmed (about 1 million deaths).
  - **Step 1**: FAD vs. EC.
     - Trigger: Potato blight (natural cause) led to the loss of the staple crop. However, Ireland was producing enough grain to feed the population, but it was being exported under armed guard to England.
     - **Verdict**: FAD (from blight) and EC (due to exports and lack of access).
  - **Step 2**: Institutional Response.
     - The British government's response was inadequate. Relief efforts were delayed and insufficient. The government continued to enforce exports and did not ban them. The laissez-faire ideology led to minimal intervention.
     - **Verdict**: Inadequate response.
  - **Step 3**: Distinguishing Failure from Crime.
     - **Foreseeability**: The blight was known, and the vulnerability of the Irish population (due to dependence on potatoes) was understood. Warnings were issued.
     - **Recklessness**: The government persisted with policies that worsened the situation (e.g., requiring the Irish to pay for relief through public works, which were often too late and insufficient). Exports continued.
     - **Exploitation**: Some argue that the famine was used to achieve political goals (e.g., weakening Irish resistance to British rule, or promoting economic restructuring). However, intent to kill is debated.
     - **Verdict**: Political Crime (due to recklessness and exploitation).

  *Reversal Argument*: If it were shown that the British government genuinely believed in laissez-faire as the best policy and that they provided relief to the extent they thought appropriate (even if inadequate), then it might be considered Institutional Failure (ideological failure). The step most likely to fail is Step 3 (interpreting the motivations behind the policies).

  ### 3. Great Leap Forward Famine (China, 1958-1962)
  - **Step 0**: Famine confirmed (deaths estimated 15-45 million).
  - **Step 1**: FAD vs. EC.
     - There were some natural disasters (droughts, floods), but the main cause was the policies of the Great Leap Forward: forced collectivization, diversion of labor to industry, and exaggerated reporting of grain yields leading to excessive state procurement. This caused a collapse in food production and distribution.
     - **Verdict**: Primarily entitlement collapse (EC) due to policy, though natural factors played a role.
  - **Step 2**: Institutional Response.
     - The government initially denied the famine and continued grain exports. Relief efforts were minimal and late. Information was suppressed.
     - **Verdict**: Inadequate response.
  - **Step 3**: Distinguishing Failure from Crime.
     - **Foreseeability**: The risks of the policies were foreseeable (there were warnings from some officials, but they were purged). However, the central government (Mao) ignored the warnings.
     - **Recklessness**: Policies were pursued despite clear signs of failure and starvation.
     - **Exploitation**: The state used food as a tool to enforce compliance and targeted certain groups (e.g., during the purges). However, the primary goal was industrialization, not killing.
     - **Intent**: There is no evidence of intent to cause famine, but the scale of the disaster and the suppression of dissent suggest recklessness rising to the level of criminal negligence.
     - **Verdict**: Political Crime (due to recklessness).

  *Reversal Argument*: If it were shown that the Chinese government was unaware of the extent of the famine due to systemic reporting failures (not suppression) and that they acted as soon as they knew, then it might be downgraded to Institutional Failure. The step most likely to fail is Step 3 (distinguishing between incompetence and recklessness).

  ### Case Requiring Human Judgment: Somalia Famine (2011)
  (Note: This is an example where the procedure might defer due to contested evidence and complexity.)

  - **Step 0**: Famine confirmed (IPC Phase 5 declared in parts of Somalia).
  - **Step 1**: FAD vs. EC.
     - Drought (natural) caused crop failure, but conflict and blockades by Al-Shabaab and other groups prevented food distribution. Also, international aid was restricted.
     - **Verdict**: Both FAD (drought) and EC (due to conflict and blockades).
  - **Step 2**: Institutional Response.
     - The Somali government was weak. Al-Shabaab denied access to aid agencies. The international community was slow to respond due to security concerns and restrictions by Al-Shabaab.
     - **Verdict**: Response inadequate, but who is responsible? The non-state actor (Al-Shabaab) or the state? 
  - **Step 3**: Distinguishing Failure from Crime.
     - **Foreseeability**: The drought was forecasted. Warnings were issued.
     - **Recklessness/Exploitation**: Al-Shabaab blocked aid and taxed food, which could be seen as exploitation. The government's capacity was limited.
     - **Verdict**: This is complex. The procedure would note that multiple actors are involved. The state's failure might be due to incapacity (Institutional Failure), but Al-Shabaab's actions are Political Crime. The procedure would terminate with "cannot classify on available evidence" because the responsibility is shared and the state's role is unclear. It requires human judgment to weigh the roles of different actors and the organization's strategic position.

  ### Where the Procedure Might Misfire
  The procedure may misfire in live crises when:
  - There is active disinformation, making it hard to assess foreseeability or intent.
  - The famine is caused by multiple interacting factors (natural, institutional, criminal) and the procedure's linear structure may oversimplify.
  - The step on institutional response (Step 2) may be too binary (adequate/inadequate) when responses are partial.

  The step most likely to fail is Step 3, because it requires interpreting the motivations and mental states of actors, which is often opaque and contested.

  ---

  ## Final Procedure Document

  **Title: Famine Classification Procedure for Humanitarian Organizations**

  **Purpose**: To provide a systematic, evidence-based method for classifying famines as (a) Natural disaster, (b) Institutional failure, or (c) Political crime. This classification is factual and separate from the tactical decision on public messaging.

  **Procedure**:

  0. **Confirm Famine**  
     - Gather evidence: reports of widespread acute malnutrition and excess mortality due to starvation or related diseases.  
     - **If no**: Conclude "not a famine".  
     - **If yes**: Proceed to Step 1.  
     - **If uncertain**: Terminate with "cannot classify on available evidence".

  1. **Assess Food Availability Decline (FAD) vs. Entitlement Collapse (EC)**  
     - Investigate:  
       a. Was there a major natural event (e.g., drought, flood) causing a sharp drop in food production?  
       b. Was there a significant reduction in food imports or aid?  
       c. Was there significant diversion of food (e.g., to military, exports, other regions)?  
     - **If (a, b, or c) is true and the decline is substantial (e.g., >20% of normal)**: FAD is present.  
     - **Otherwise**: EC is the primary driver.  
     - **Proceed to Step 2 regardless** (since even with FAD, institutional response matters).

  2. **Evaluate Institutional Response**  
     - Assess the response of the government and relevant institutions:  
       - Were early warnings heeded?  
       - Were relief efforts (food, cash, employment) timely and adequate?  
       - Were measures taken to maintain distribution and prevent hoarding/speculation?  
       - Was the response proportional to the crisis?  
     - **If the response was timely and adequate**: Classify as **Natural disaster** (if FAD was the trigger) or **Institutional failure** (if EC was primary and the response fixed it? But note: if EC was primary and the response was adequate, then it wouldn't be a famine. So if famine occurred, response was inadequate by definition).  
       - **Clarification**: Since we have a famine, the response must have been inadequate. So:  
          - **If FAD was the primary trigger and the response was adequate**: Then it should not have become a famine. Therefore, if there is a famine, the response was inadequate.  
       - **Revised Logic**:  
          - **If the response was timely and adequate, but the famine still occurred**: This is contradictory. Therefore, if a famine occurs, the response was inadequate. So Step 2 is only about the degree of inadequacy?  
          - Instead, we need to ask: Could the famine have been prevented by a reasonable institutional response?  
     - **Therefore, restructure Step 2**:  
       - **Question**: Could the famine have been prevented by a reasonable institutional response given the circumstances?  
          - **If yes** (meaning the institutions failed to act adequately): Then the famine is at least Institutional failure. Proceed to Step 3.  
          - **If no** (meaning the natural shock was so severe that even the best response could not have prevented it): Then classify as **Natural disaster**.  
          - **If uncertain**: Terminate with "cannot classify".

  3. **Distinguish Institutional Failure from Political Crime**  
     - Assess:  
       a. **Foreseeability**: Was the famine or the risk of famine foreseeable? (e.g., warnings from experts, officials, press?)  
       b. **Recklessness**: Did the authorities disregard foreseeable risks? (e.g., persisted with harmful policies despite warnings)  
       c. **Exploitation**: Did the authorities exploit the famine to achieve political goals? (e.g., targeting a group, using food as a weapon)  
       d. **Intent**: Is there evidence the authorities intended to cause starvation?  
     - **If (a) is true and (b) or (c) is true**: Classify as **Political crime**.  
     - **If (d) is true**: Classify as **Political crime**.  
     - **Otherwise**: Classify as **Institutional failure**.  
     - **If evidence on (a, b, c, d) is insufficient**: Terminate with "cannot classify".

  **Handling Uncertainty**:  
  - At any step, if the evidence is insufficient or highly contested, terminate with "cannot classify on available evidence".  
  - The procedure may also note key uncertainties and how they affect the classification.

  **Separation of Classification and Tactical Decision**:  
  - This procedure ends with a classification (or non-classification). The decision on public messaging (tactical) must consider additional factors:  
     - Potential impact on humanitarian access and staff safety.  
     - Potential to mobilize aid or provoke backlash.  
     - Ethical obligations to victims.  
  - The tactical decision is made by senior management and advocacy, not by this procedure.

  ---

  This procedure provides a structured, evidence-based approach. It is designed to be robust but acknowledges that in complex crises, judgment calls are sometimes necessary.
answer: |-
  Below is a structured, step-by-step classification procedure designed for desk officers to determine whether a famine is a **natural disaster**, **institutional failure**, or **political crime**. It prioritizes feasibility under time constraints (48 hours), tolerates uncertainty, and strictly separates factual classification from tactical advocacy decisions. The procedure is grounded in Sen's entitlement approach and the "famine as crime" literature but operationalizes them into actionable questions with clear exit points.

  ---

  ### **Famine Classification Procedure**  
  **Purpose**: To classify famines based on causation (fact-based) for internal use, distinct from advocacy strategy.  
  **Inputs**: Standard field reports, early-warning systems (e.g., IPC), UN/OCHA alerts, academic literature, local media.  
  **Outputs**: One of:  
  - `Natural disaster`  
  - `Institutional failure`  
  - `Political crime`  
  - `Cannot classify (insufficient evidence)`  
  - `Escalate to human judgment (values/strategy)`  

  ---

  #### **Step 0: Confirm Famine Conditions**  
  **Question**: Is there evidence of mass starvation death or IPC Phase 5 (Catastrophe/Famine) conditions?  
  - **Sufficient evidence**:  
    - Mortality data showing starvation/death rates doubling baseline, OR  
    - IPC Phase 5 declaration, OR  
    - Consensus from ≥3 independent sources (e.g., UN, NGOs, academics).  
  - **If NO**: Exit—not a famine.  
  - **If INSUFFICIENT DATA**: Exit—`Cannot classify`.  
  - **If YES**: Proceed to Step 1.  

  ---

  #### **Step 1: Assess Food Availability Decline (FAD) vs. Entitlement Collapse (EC)**  
  **Question**: Was aggregate food supply severely reduced?  
  - **Indicators**:  
    - Crop failure >30% due to natural causes (drought/flood/pestilence), OR  
    - Food imports/aid dropped >50% due to non-human causes (e.g., global shortage).  
  - **Sufficient evidence**:  
    - Remote sensing/FAO data confirms natural shock, OR  
    - No evidence of major exports/diversions during crisis.  
  - **Decision**:  
    - If **FAD dominates** (natural shock explains >75% of shortage): Proceed to Step 2.  
    - If **EC dominates** (food existed but access collapsed due to prices, unemployment, or discrimination): Proceed to Step 3.  
    - If **unclear** (mixed causes): Proceed to Step 2.  
  - **Exit if uncertain**: `Cannot classify`.  

  ---

  #### **Step 2: Evaluate Institutional Response**  
  **Question**: Could a reasonable institutional response have averted mass death?  
  - **Indicators**:  
    - Early warnings existed and were ignored (e.g., alerts suppressed, experts dismissed).  
    - Relief efforts were absent/sabotaged (e.g., aid blocked, markets restricted).  
    - Policy exacerbated starvation (e.g., forced exports, asset seizures).  
  - **Thresholds**:  
    - **Adequate response**: Relief scaled to need (≥60% of affected population reached), no harmful policies.  
    - **Inadequate response**: <30% coverage OR harmful policies in place.  
  - **Decision**:  
    - If FAD-dominated + **response adequate**: Classify as `Natural disaster`.  
    - If FAD-dominated + **response inadequate**: Proceed to Step 3.  
    - If EC-dominated: Proceed to Step 3.  
  - **Exit if uncertain**: `Cannot classify`.  

  ---

  #### **Step 3: Distinguish Failure from Crime**  
  **Question**: Was death foreseeable and disregarded, exploited, or intended?  
  - **Key tests (any one suffices)**:  
    - **Foreseeability + Recklessness**: Authorities knew risks (via warnings) but persisted with harmful policies.  
    - **Exploitation**: Crisis used to target groups (e.g., sieges, discriminatory aid).  
    - **Intent**: Direct evidence of purposefully causing starvation (rare; e.g., orders/documentation).  
  - **Evidence standards**:  
    - **High confidence**: Internal memos, whistleblower accounts, policy documents.  
    - **Medium confidence**: Patterns of discrimination, aid obstruction, press censorship.  
  - **Decision**:  
    - If **any test met**: Classify as `Political crime`.  
    - If **tests not met but EC/inadequate response**: Classify as `Institutional failure`.  
    - If **tests unclear but EC confirmed**: Escalate to human judgment.  
  - **Exit if uncertain**: `Cannot classify` OR `Escalate to human judgment` if values-laden (e.g., "reasonable response" contested).  

  ---

  #### **Step 4: Final Checks**  
  - **Separation of classification/tactics**: Append disclaimer:  
    > *"Classification is factual. Public advocacy must consider: (1) Risks to operations/staff, (2) Potential to worsen victim suffering, (3) Strategic goals. Escalate to advocacy director."*  
  - **Documentation**: Record evidence used and uncertainties.  
  - **Time limit**: If any step exceeds 48-hour deadline, exit with current best classification + uncertainty flag.  

  ---

  ### **Worked Historical Examples**  
  #### **1. Bengal Famine (1943)**  
  - **Step 0**: Famine confirmed (3M deaths).  
  - **Step 1**: EC dominates. Food availability fell only 5% (Sen); hoarding/price gouging triggered collapse.  
  - **Step 2**: Inadequate response. UK exported rice; Churchill dismissed warnings.  
  - **Step 3**: **Foreseeability + Recklessness** met (warnings from officials/press ignored; policies prioritized war). **Verdict**: `Political crime`.  
  - **Reversal argument**: If new evidence showed UK lacked capacity to redirect ships (disputing recklessness), verdict could revert to `Institutional failure`.  
  - **Weakest step**: Step 3 (interpreting "recklessness" vs. wartime constraints).  

  #### **2. Irish Famine (1840s)**  
  - **Step 0**: Famine confirmed (1M deaths).  
  - **Step 1**: FAD + EC. Blight (natural) triggered FAD, but exports continued → EC.  
  - **Step 2**: Inadequate response. Relief lagged; exports enforced; laissez-faire policies.  
  - **Step 3**: **Exploitation** met (exports continued; relief tied to land clearance policies). **Verdict**: `Political crime`.  
  - **Reversal argument**: If evidence showed exports were <5% of supply (negligible), EC claim fails → `Natural disaster`.  
  - **Weakest step**: Step 1 (quantifying export impact amid disputed data).  

  #### **3. Great Leap Forward (China, 1958–1962)**  
  - **Step 0**: Famine confirmed (15–55M deaths).  
  - **Step 1**: EC dominates. Policies (collectivization, grain seizures) caused collapse; natural factors minor.  
  - **Step 2**: Inadequate response. Denialism; grain exported amid starvation.  
  - **Step 3**: **Foreseeability + Recklessness + Exploitation** met (local officials warned; policies targeted "class enemies"; used to break resistance). **Verdict**: `Political crime`.  
  - **Reversal argument**: If evidence showed Mao was misled by false reports (negating foreseeability), verdict could be `Institutional failure`.  
  - **Weakest step**: Step 3 (inferring intent in opaque regimes).  

  ---

  #### **Case Requiring Human Judgment: Somalia (2011)**  
  - **Step 0**: Famine confirmed (260K deaths).  
  - **Step 1**: Mixed FAD (drought) + EC (al-Shabaab blockades).  
  - **Step 2**: Inadequate response (aid restricted; warnings ignored).  
  - **Step 3**: **Exploitation** (al-Shabaab weaponized aid) but state capacity minimal.  
  - **Outcome**: `Escalate to human judgment`. Why? Requires valuing non-state actor intent vs. state incapacity—a strategic decision.  

  ---

  ### **Where the Procedure Misfires**  
  1. **Intent ambiguity**: In live crises (e.g., Yemen), authoritarian regimes obscure intent. Step 3 may over-rely on circumstantial evidence.  
  2. **Complex crises**: When FAD/EC are inseparable (e.g., climate conflict in Sahel), Step 1 may force arbitrary thresholds.  
  3. **Colonial/archival cases**: Historical famines (e.g., India 1876–78) risk misclassification if modern evidence standards are rigidly applied.  
  **Most fragile step**: **Step 3**. It assumes discernible foresight/exploitation, but in crises (e.g., Gaza 2024), blockades may be framed as "security" (ambiguous intent) or evidence suppressed.  

  ---

  ### **Epistemic Posture**  
  - **Verdict reversibility**: Each verdict hinges on the weakest evidence in its critical step (noted above). For Bengal, if Churchill's actions were proven unavoidable (not reckless), the crime verdict collapses.  
  - **Likeliest failure point**: **Step 3** due to inferring mental states (intent/exploitation) from incomplete data. This step should be audited most rigorously.  
  - **Design trade-off**: This procedure prioritizes false negatives over false positives (e.g., "crime" requires strong evidence) to avoid misattribution in volatile contexts.  

  This procedure provides a replicable, evidence-based framework but will not eliminate judgment—especially in distinguishing recklessness from incapacity. I recommend field-testing it in simulations with country teams to refine thresholds.
