prompt: |-
  I'm taking a philosophy of mind class this semester and we just wrapped up Descartes on animals (the beast-machine doctrine, the language test from the Discourse). For my final paper I want to write a "what would Descartes say now" section and I'm honestly stuck on which way to argue it. Basically: if you showed him the stuff from modern animal cognition research — corvids that re-hide their cached food when a rival bird who watched them caching is still hanging around, an octopus unscrewing a jar from the inside, parrots like Alex who could label colors and ask for specific objects by name, apes that pass the mirror test — would he actually update, or does he have a principled way to absorb all of it?

  Here's why I can see it going both ways. On one hand his real criterion (as opposed to just "animals are basically robots") was that no animal uses signs to communicate thoughts appropriate to the occasion, the way humans do — parrots produce words but, as he saw it, can't show they mean anything by them, and animals never signal anything about absent things. Alex the parrot looks like a direct hit on that. But on the other hand he was never bothered by animals doing complex perception-action stuff, that was all mechanism to him, so maybe he'd just shrug and say the clever corvid is a fancier clock and the language stuff is conditioning. A friend in my class says he'd definately just move the goalposts, and would have to admit the test was really "whatever humans do that animals don't," which makes it empty as a criterion. I kind of suspect that's too uncharitable to him but I can't articulate why yet.

  So what's your read — would Descartes treat the modern evidence as a serious threat he'd have to engage with, or does the automaton view have the resources to survive it intact? If he'd double down, sketch what his strongest response looks like, and tell me which of the examples above would be hardest for him to explain away and why. Also, separately: do you think the language test was doing genuine work in his system, or was it kind of rigged from the start? One thing to keep in mind — the paper is supposed to be about his views, not about whether animals are actually conscious, so I mostly care what follows from his own commitments rather than from ours.
