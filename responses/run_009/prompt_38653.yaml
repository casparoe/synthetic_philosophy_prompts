prompt: |-
  For my philosophy of mind seminar (third year, ~15 students) I have to present and defend Dennett's quining qualia line next week -- the claim that qualia as standardly conceived (intrinsic, ineffable, private, and somehow just given to you) are an incoherent posit, and that once you spell out what the concept is supposed to do, nothing in the world answers to it. My plan is to walk through the Chase and Sanborn coffee-taster case, where one guy concludes the coffee tastes the same but he's outgrown the taste, and the other concludes his tastes have stayed put but the coffee changed on him, and Dennett's point that they cannot in principle tell which of these happened -- so the idea of a quale as a fixed, directly comparable item dissolves.

  Here's my problem, and it's two-fold. First, the seminar skews realist: most of my classmates were visibly moved by Mary's room when we did it, and the professor wrote her dissertation on the knowledge argument, so I'm walking into a room full of people who think the phenomenal residue is exactly what needs explaining. Second, I'm not planning to just do straight Dennett -- I want to argue that the Chase and Sanborn structure generalizes way beyond coffee, to any case where you can't factor an apparent change into a change in the experience itself versus a change in your reaction or your memory of earlier experiences. My flagship example is acquired tastes and nostalgia: when you hear a song that wrecked you at sixteen and it doesn't wreck you now, I want to say the question of whether the phenomenal character stayed identical while your response shifted is not a deep mystery, it's a badly posed question -- there's just no fact of the matter to recover. I suspect my extension is also where I'm most likely to get taken apart.

  So prepare me for the Q&A. Give me the objections in roughly the order they'll actually come, phrased the way this specific audience would phrase them (the classmates who liked Mary, the professor who knows the literature cold). For each one: a short reply I can actually deliver in a seminar, and an honest note on where the reply is soft. Tell me which objections I should concede something on up front, and which ones I have to hold the line on or the whole presentation collapses. And include the question I'm privately hoping nobody asks -- you know the type -- with at least a gesture at an answer.

  Keep the whole prep sheet under 900 words. No reading lists or citations, just the prep itself.
