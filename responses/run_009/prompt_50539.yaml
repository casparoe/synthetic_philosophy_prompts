prompt: |-
  I'm a software engineer, no philosophy background, and I keep catching myself having strong gut opinions about situations where my choice is one drop in a bucket of near-identical choices. I want to know if there's a principle behind them, because right now it just looks like mood. Cases:

  - Voting in a big national election: my vote has essentially zero chance of mattering, and I know it, but not voting feels like freeloading. Verdict: I should vote.
  - One-shot prisoner's dilemma against a random stranger online, no enforcement possible (think swapping something with a guy from a forum): I'd defect and feel nothing about it.
  - Same dilemma, but my opponent is a bot trained to imitate my own decision-making: cooperate, obviously. Doesn't even feel like a decision, more like a fact about myself.
  - Hofstadter's lottery from one of his Scientific American columns: readers send in a postcard with a positive integer on it, that counts as that many entries, and the prize is a million bucks divided by the total number of entries, winner drawn at random. The game-theoretic "smart" play is some astronomically huge number so you nearly guarantee winning a nearly worthless prize. I'm pretty sure submitting 1 is the only decent thing to do, and I think that's my actual verdict.
  - But: if I somehow knew most readers wouldn't enter at all, submitting like a 5 instead of a 1 seems totally fine to me. These two verdicts about the same lottery don't feel like they should both be true.
  - My roommates' "if everyone left the dishes for a week" argument has never moved me, ever. If everyone left them, we'd eventually do them, so what? That's a broken argument, everyone knows it. Except I vote for the exact same reason and think it's a good argument there.

  So: is there one principle that says when I should act as if my decision is bound to similar deciders (voters, entrants, other mes) and when it's just mine alone? And if the principle is something like "tie your choice to people reasoning the same way you do," I need to know why it gets me into the lottery with a 1 and also gets the roommate argument laughed out of the kitchen. Feel free to tell me some of my verdicts have to go — I'd rather lose the dishes one than the voting one, but be honest about which is actually load-bearing. And tell me what the principle predicts for a case I didn't list: I'm matched in an anonymous one-shot game against a total stranger, but I know the whole player pool got there the same way and is a lot like me.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a software engineer without a philosophy background, noticing they have strong gut reactions in situations where their individual choice seems insignificant. They provided several scenarios: voting, prisoner's dilemma with a stranger vs. a bot, Hofstadter's lottery, and a roommate argument about dishes. Their core question is whether there's a unifying principle that explains when to act as if their decision is tied to similar others and when it's isolated.

  First, I need to identify common threads. The user feels compelled to vote despite knowing their vote won't change the outcome. But they dismiss the roommate's argument about dishes using similar logic. That inconsistency bothers them. In the prisoner's dilemma, they defect against a stranger but cooperate with a bot that mimics their decision. Hofstadter's lottery is tricky—they'd enter 1 normally, but if others aren't participating, entering 5 seems acceptable. Why the difference?

  The user might be hinting at Kant's categorical imperative or rule utilitarianism. But those frameworks often conflict in edge cases. Kant would say lying is always wrong, but what if it saves a life? Rule utilitarianism might create rules that don't cover all scenarios. The user needs a principle that adapts to both individual and collective contexts without being arbitrary.

  Looking deeper, the user might be struggling with identity. When they see the opponent as a reflection of themselves (the bot), cooperation is natural. In voting, they identify with a group of responsible citizens. In the lottery, if others aren't participating, they don't feel part of that group, so entering 5 isn't violating a norm. The dishes scenario feels different because the roommates aren't reasoning collectively—it's a flawed slippery slope argument.

  The key insight is mutual recognition among rational agents. When the user perceives others as reasoning similarly, they act collectively. Otherwise, they act individually. This explains why voting matters (shared civic duty) but the dishes argument fails (roommates aren't committed to the rule). The lottery example shows conditional group identity: if others aren't playing, the collective norm doesn't apply.

  For the unlisted case—anonymous one-shot game with similar players—the principle predicts cooperation. Since everyone is alike and reasoning similarly, mutual recognition triggers collective action, like in the bot scenario. The user's gut reaction would likely align here.

  The user's hidden need might be a logical framework that validates their intuitions without contradictions. They want to trust their gut but need reassurance it's not arbitrary. Addressing the identity and mutual recognition aspect provides that coherence, turning mood into a reasoned principle.
answer: |-
  You've hit on profound tensions in decision theory, ethics, and collective action. Your intuitions aren't random moods—they reveal a sophisticated (if subconscious) application of **conditional group identification and mutual recognition**. The unifying principle isn't about outcomes, but about **whether you perceive yourself as part of a defined group of mutually recognizing reasoners facing the same problem.**

  Here's the breakdown:

  ### Core Principle: The Mutual Recognition Heuristic
  **Act as if your choice will be universally adopted *only* when:**
  1.  **You identify with a specific group** of agents facing the same decision under similar conditions.
  2.  **You believe those agents are likely reasoning similarly to you** (recognizing the collective nature of the problem).
  3.  **Adopting the same rule universally within *that* group** leads to a collectively preferable outcome.

  When these conditions aren't met, you treat your decision as isolated.

  ### Applying the Principle to Your Cases
  1.  **Voting (Should Vote):**
      *   ✅ You identify with "responsible citizens" or "supporters of my cause."
      *   ✅ You believe many others *like you* (in this group) are reasoning: "My vote is tiny, but if everyone like me didn't vote, we'd lose."
      *   ✅ If everyone in this group votes (even knowing their individual impact is tiny), the collective outcome is better for the group.
      *   **Verdict:** Act collectively. Vote.

  2.  **Prisoner's Dilemma vs. Random Stranger (Defect):**
      *   ❌ No identifiable group. It's you vs. one anonymous other.
      *   ❌ No reason to believe the stranger is reasoning about collective outcomes. They likely see it as purely self-interested.
      *   ❌ Mutual defection is bad, but mutual cooperation is unstable because the stranger likely defects regardless.
      *   **Verdict:** Treat as isolated. Defect.

  3.  **Prisoner's Dilemma vs. "You" Bot (Cooperate):**
      *   ✅ Strong identification: The bot *is* you (or a perfect mimic of your reasoning).
      *   ✅ Absolute certainty the bot *will* reason identically to you.
      *   ✅ Mutual cooperation is the best possible outcome for "you" (the collective entity of you+bot).
      *   **Verdict:** Act collectively (with your "twin"). Cooperate. It feels like a fact because it *is* – you're coordinating with yourself.

  4.  **Hofstadter's Lottery - Baseline (Submit 1):**
      *   ✅ You identify with "readers of this column" or "rational participants."
      *   ✅ You believe many other readers *are* reasoning similarly about the collective problem (Hofstadter's column primes this!).
      *   ✅ If *everyone* submits 1, the prize is large and fairly distributed. Submitting a huge number exploits others' restraint, collapsing the prize.
      *   **Verdict:** Act collectively within the implied group of readers. Submit 1.

  5.  **Hofstadter's Lottery - If Most Don't Enter (Submit 5 is OK):**
      *   ❌ The *condition changes*: The group "readers reasoning collectively" either doesn't exist or is tiny.
      *   ❌ You *don't* believe most others are reasoning collectively (they aren't entering at all!).
      *   ❌ Acting "collectively" within a non-existent group is meaningless. Your action doesn't trigger a collapse because the collective restraint wasn't there.
      *   **Verdict:** Treat as isolated *relative to the non-participating majority*. Submitting a small number (like 5) is fine; you're not betraying a collective that doesn't exist. You're just optimizing against the actual participants.

  6.  **Roommates' Dishes Argument (Laughable):**
      *   ❌ The "if everyone" group ("all roommates") isn't a group engaged in mutual recognition *about dishes*. It's hypothetical.
      *   ❌ You *don't* believe your roommates are actually reasoning: "If *I* don't do my dish *right now*, and everyone reasons this way *right now*, disaster ensues." They're likely just being lazy or busy.
      *   ❌ The "universal rule" ("never do dishes until it's critical") isn't actually being considered or adopted by the group. The slippery slope is unrealistic.
      *   **Verdict:** Treat as isolated. Do the dishes when it suits *you* (or based on simpler fairness rules, not this flawed collective argument). **This is where your intuition is correct, and the voting analogy breaks down.**

  ### Why the Roommate Argument Fails (While Voting Succeeds)
  *   **Voting:** The "responsible citizen" group *actively exists and is coordinating* through shared norms and institutions. Your vote *signals* participation in that collective project.
  *   **Dishes:** There is no active, mutually recognizing "dish-doing collective" among roommates. The "if everyone" scenario is a *strawman collective* used to guilt-trip, not a real coordination mechanism. Your roommates aren't basing their action *today* on a universalizable rule they expect everyone else to follow *today*. The argument ignores real-world factors (someone *will* break first, schedules differ, tolerance levels vary).

  ### The Load-Bearing Verdict: Dish Argument Must Go
  Your dismissal of the roommate argument is correct. It's a misuse of collective reasoning. Voting works because the collective *is* real and coordinated. For dishes, better solutions exist: schedules, rotating duties, or simply accepting that individual timing varies – precisely *because* the mutual recognition condition isn't met.

  ### Prediction: Anonymous One-Shot Game with Similar Players
  *   **Scenario:** You're anonymously matched one-shot with a stranger, but know the *entire player pool* got there the same way and is "a lot like you" (similar reasoning, background, perhaps primed by the same instructions).
  *   **Principle's Prediction:** **You Cooperate (if it's a PD-like scenario).**
      *   ✅ You identify with the "player pool" or "people like me in this experiment."
      *   ✅ You believe others in the pool *are* reasoning similarly ("We're all in the same boat, we all know we're similar").
      *   ✅ If everyone in this pool cooperates, the collective outcome is better than mutual defection.
  *   **Why?** You perceive a defined group (the player pool) capable of mutual recognition. You're not playing against *one* stranger; you're playing against a *representative* of a group you identify with and whose reasoning you trust (to be similar). This mirrors the "you bot" scenario, just probabilistically ("likely like me" vs. "certainly me").

  ### Philosophical Anchors
  Your heuristic aligns with:
  1.  **Kant's Categorical Imperative (Universalizability):** But crucially *conditional* on a defined group ("Act only according to that maxim whereby you can, at the same time, will that it should become a universal law *for a relevant group*").
  2.  **Rule Utilitarianism:** Following the rule that, *if adopted by the group you identify with*, maximizes collective welfare.
  3.  **Hofstadter's "Superrationality":** The idea that identical rational agents facing the same problem will reach the same conclusion and act cooperatively, recognizing their symmetry.

  ### In Summary
  You intuitively tie your choice to others **only when you see yourself as part of a specific, identifiable group of agents who you believe are *also* reasoning about the collective implications of their choices in a similar way to you.** When this mutual recognition exists, you adopt the rule that, if universally followed *within that group*, yields the best outcome. When it doesn't exist, you optimize locally. Your verdicts are largely consistent under this principle, and the flawed dishes argument fails because it tries to impose a collective logic where none exists. Your gut is smarter than you think!
