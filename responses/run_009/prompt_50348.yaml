prompt: |-
  I lead the policy-pilot team at a mid-sized city government; we run eight to twelve pilots a year, on everything from participatory budgeting to changes in waste collection, and every one requires an eventual recommendation to scale, continue, or stop. I've come to suspect we do this without any principled account of what makes a pilot a genuine experiment rather than theater — or of who the experiment is supposed to inform. A colleague with a philosophy background keeps telling me that John Dewey spent decades arguing that democracy and inquiry share a single structure: problems arise when the indirect consequences of some activity escape the institutions that produce them; publics form around those consequences; and democratic life consists in organizing inquiry so that the people affected can recognize their own problems and test responses to them, with the results feeding back into the situation rather than ending in a verdict handed down from outside. I would like this operationalized for my team.

  Please write a procedure we could actually run on a proposed pilot, from the moment a department brings us an idea to the final scale-or-stop decision. It should tell us, in order: what makes something a problem worth experimenting on rather than one to decide directly; how to identify the relevant public, including what to do when the people affected are diffuse, future, or hard to reach, and how to tell when the public we convene is not the public that bears the consequences; what counts as a genuine test, including how to resist the standing temptation to design pilots that cannot fail; how to handle ambiguous results, and results that conflict with what the affected public itself wants; and where the procedure stops and hands the decision to elected officials because the question is one of values rather than facts. Mark plainly which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases: (1) a proposal to pilot four-day intervals for street-bin collection, with strong internal sponsorship and easy measurement; (2) a proposed participatory budgeting exercise in a district where turnout is expected to be low and skewed toward the already organized; and (3) a pilot of an enforcement policy the affected residents oppose but whose measured effects look good. In at least one case the procedure should deliver an answer my team will not like; say so and explain whether that is a defect of the procedure or a cost of taking Dewey seriously.

  Constraints: the procedure must be executable by policy officers with no philosophical training in a workshop of two or three hours per pilot; elected sign-off is required for anything touching budgets or enforcement; and we can almost never sustain a pilot beyond eighteen months. Please say explicitly what the procedure cannot do within those constraints.
reasoning: |-
  We are designing a procedure based on John Dewey's ideas that democracy and inquiry share a structure. The goal is to create a pilot process that is a genuine experiment in service of the public, not theater. The procedure must be operational and executable by policy officers in a 2-3 hour workshop per pilot.

  The procedure will have the following steps, each addressing a key aspect of Dewey's framework:

  1. **Problem Definition and Justification for Experimentation**: Determine if the problem is one that requires experimentation because of uncertainty and because the consequences are indirect and affect a public that needs to be engaged in the inquiry.
  2. **Public Identification**: Identify the public(s) affected by the problem and the proposed pilot. This includes strategies for when the public is diffuse, future, or hard to reach, and a check to ensure the convened public matches the affected public.
  3. **Designing a Genuine Test**: Create a pilot design that can fail and that tests the core hypotheses about the problem and the solution. This step must resist the temptation to design pilots that cannot fail.
  4. **Handling Ambiguous Results and Conflicts**: Set up methods to interpret results, especially when they are ambiguous or when they conflict with the affected public's expressed desires.
  5. **Decision Point: Values vs. Facts**: Determine when the decision must be handed over to elected officials because it involves value judgments beyond the facts gathered.

  The procedure must also mark which steps are judgment calls dressed as procedure.

  Additionally, we run the procedure on three cases.

  **Constraints**:
  - Workshop: 2-3 hours per pilot.
  - Elected sign-off required for budgets or enforcement.
  - Pilots cannot typically extend beyond 18 months.

  **What the procedure cannot do**:
  - It cannot eliminate the need for judgment, especially in identifying the public and interpreting ambiguous results.
  - It cannot extend the pilot beyond 18 months, so the design must fit within that timeframe.
  - It cannot bypass elected officials on value-laden decisions or when budgets/enforcement are involved.

  ---

  **Procedure: Dewey-Inspired Pilot Assessment Framework**

  **Step 0: Pre-Workshop Preparation** (done by the policy-pilot team before the workshop)
  - The proposing department submits a brief (1-2 pages) outlining: 
    - The problem they are trying to solve, including evidence of its existence and impact.
    - The proposed pilot intervention.
    - The intended outcomes and how they will be measured.
    - Any known concerns or opposition.

  **Step 1: Problem Definition and Justification for Experimentation** (Workshop - 30 minutes)
     - **Question**: Is this a problem that requires an experiment? Why not decide directly?
     - **Criteria**:
       - There must be significant uncertainty about the effects of the proposed intervention (i.e., we don't know if it will work, or how it will work, or what side effects it might have).
       - The problem must involve indirect consequences that have escaped existing institutional control, leading to the formation of a public (or publics) that are affected but not adequately represented in the current decision-making.
       - If the problem is well-understood and the solution is clear, then an experiment is not necessary — but note that overconfidence in a solution is a common pitfall.
     - **Judgment Call**: Deciding whether there is "significant uncertainty" and whether a public has formed (or needs to form) around the problem. This is a judgment call, but it can be informed by evidence of past failures, complexity of the issue, or conflicting stakeholder views.
     - **Output**: A yes/no on whether an experiment is justified. If no, the team recommends either direct implementation (if the solution is clear and low-risk) or abandonment. If yes, proceed.

  **Step 2: Public Identification** (Workshop - 45 minutes)
     - **Question**: Who is the public that bears the consequences of this problem and the pilot? How do we engage them in the inquiry?
     - **Process**:
       - Map the consequences: List all the groups that might be affected (positively and negatively) by the problem and the pilot. Consider:
         - Directly affected groups (e.g., residents in a neighborhood for a waste collection pilot).
         - Indirectly affected groups (e.g., city-wide taxpayers, future generations for environmental impact).
         - Groups that might be disproportionately affected (e.g., low-income residents, elderly).
       - Identify challenges: Are any of these groups diffuse (e.g., city residents at large), future (e.g., future generations regarding environmental policies), or hard to reach (e.g., homeless populations)? 
         - For diffuse groups: Use representative sampling (e.g., surveys, town halls in multiple areas) or leverage existing community structures (e.g., neighborhood associations, online platforms).
         - For future groups: Use proxies (e.g., environmental advocates, youth councils) and consider long-term indicators.
         - For hard-to-reach groups: Partner with trusted community organizations, use targeted outreach (e.g., door-to-door, community events), and provide incentives.
       - Check for mismatch: Ask, "If we convene a group, will it include representatives of all the affected groups, especially the most vulnerable?" If not, adjust the engagement plan.
     - **Judgment Call**: Deciding who counts as "affected" and how to weigh the interests of different groups (e.g., present vs. future). Also, determining what constitutes adequate representation is a judgment call.
     - **Output**: A public engagement plan that specifies:
       - The groups to be engaged and how they will be reached.
       - Methods for engagement throughout the pilot (not just at the beginning and end).
       - A plan for ongoing feedback loops.

  **Step 3: Designing a Genuine Test** (Workshop - 45 minutes)
     - **Question**: How do we design this pilot so that it can genuinely fail and test our core assumptions?
     - **Process**:
       - State the core hypothesis: "We believe that [intervention] will lead to [outcome] by [mechanism]."
       - Identify the key assumptions that must hold for the hypothesis to be true (e.g., residents will separate waste properly; they won't produce more waste because of the longer interval).
       - Design the pilot to test the riskiest assumptions. This might mean:
         - Using a control group or comparison group.
         - Measuring not just the intended outcomes but also potential negative side effects.
         - Setting clear failure criteria (e.g., if resident satisfaction drops below X, if costs exceed Y, if participation is below Z).
       - Ensure the pilot is feasible within 18 months. This may require focusing on a critical subset of the problem.
       - Resist the temptation to avoid failure by:
         - Not setting up a control group because it's "too hard".
         - Defining success too vaguely.
         - Ignoring potential negative effects.
     - **Judgment Call**: Deciding which assumptions are the riskiest and what failure criteria are appropriate. This is a judgment call because it depends on the context and the values at stake.
     - **Output**: A pilot design that includes:
       - Clear, measurable outcomes (both primary and secondary).
       - A comparison strategy (e.g., control group, before-and-after in the same area, comparison to a similar area).
       - Specific failure criteria.

  **Step 4: Handling Ambiguous Results and Conflicts** (Workshop - 30 minutes, but note: this step also occurs after the pilot when results are in)
     - **Question**: How will we interpret ambiguous results? And what if the results conflict with what the public wants?
     - **Process** (during design phase):
       - Plan for multiple data sources (quantitative and qualitative) to triangulate results.
       - Plan to engage the public in interpreting the results (e.g., through community meetings, deliberative forums). This is crucial for Dewey: the public must be part of the inquiry, not just subjects.
       - If the data is ambiguous, consider extending the pilot (if time allows) or scaling with close monitoring and adjustments (if the public supports it).
       - If the measured effects are positive but the public opposes the policy, do not ignore the opposition. Treat this as a critical piece of data: the pilot may have missed important consequences or the public may have values that are not captured by the metrics. This must be discussed with the public and elected officials.
     - **Judgment Call**: Deciding when results are too ambiguous to act upon and how to weigh public opposition against positive metrics. This is a judgment call that must be made in consultation with the public and elected officials.
     - **Output**: A plan for interpreting and responding to ambiguous results and conflicts, including a commitment to public deliberation on the results.

  **Step 5: Decision Point: Values vs. Facts** (Workshop - 30 minutes, and then at the end of the pilot)
     - **Question**: When does this decision become one of values rather than facts, requiring elected official input?
     - **Process**:
       - Throughout the pilot, separate questions of fact (e.g., did the intervention reduce costs? did it increase resident satisfaction?) from questions of value (e.g., is it acceptable to have a 10% decrease in satisfaction for a 15% cost savings?).
       - At the end of the pilot, the team compiles:
         - The facts: what happened, including both intended and unintended consequences.
         - The public's interpretation of those facts and their expressed desires.
         - Any value conflicts (e.g., efficiency vs. equity).
       - The team then makes a recommendation that is fact-based but flags value questions. The final decision on scaling, continuing, or stopping must go to elected officials if:
         - The decision involves a trade-off between competing values (e.g., cost savings vs. service quality).
         - The public is deeply divided and the conflict cannot be resolved through further inquiry.
         - The decision requires a budgetary allocation or enforcement power (per constraint).
     - **Judgment Call**: Deciding when a value conflict is present and when to hand over to elected officials. This is a judgment call, but the team should err on the side of involving elected officials when in doubt.
     - **Output**: A recommendation that clearly separates facts from values and a plan for engaging elected officials in the final decision.

  ---

  **Running the Procedure on Three Cases**

  **Case 1: Four-day intervals for street-bin collection**

  - **Step 1: Problem Definition**: The problem is waste collection costs and efficiency. There is uncertainty: will residents adapt without causing overflow or health issues? A public has formed (residents complaining about costs or service). Justified for experimentation.
  - **Step 2: Public Identification**: Directly affected: residents on the route. Also, city-wide taxpayers (who benefit from cost savings). Hard-to-reach: renters, non-English speakers? Plan: survey residents on the route, including targeted outreach to vulnerable groups (e.g., through landlords, community centers). Check: If the pilot area is not representative (e.g., only single-family homes), we might miss impacts on apartment dwellers.
  - **Step 3: Genuine Test**: Hypothesis: Extending collection intervals will reduce costs without increasing complaints or health issues. Risky assumption: residents won't produce more waste or fail to manage bins. Design: control group (same-sized area with current schedule), measure waste volume, complaints, and cost. Failure criteria: if complaints increase by more than 20%, or if overflow incidents occur in more than 5% of collections.
  - **Step 4: Handling Ambiguity/Conflict**: If results show cost savings but some residents are unhappy, we must engage them to understand why. Maybe the savings aren't worth the inconvenience? Plan: public meeting to discuss results and trade-offs.
  - **Step 5: Values vs. Facts**: If the data shows savings and no significant increase in complaints, then scaling might be a fact-based decision. But if there's a trade-off (e.g., savings vs. resident satisfaction), that's a value decision for elected officials.

  **Outcome**: Likely a recommendation to scale if the test succeeds without significant issues. The team would like this because it's straightforward.

  **Case 2: Participatory budgeting in a district with low and skewed turnout**

  - **Step 1: Problem Definition**: The problem is lack of democratic engagement and misalignment of spending with community needs. Uncertainty: will participatory budgeting (PB) engage a broad public and lead to better decisions? A public has formed (residents who feel unheard) but may not be well-organized. Justified for experimentation.
  - **Step 2: Public Identification**: Affected: all district residents (present and future), especially historically marginalized groups. Challenge: low and skewed turnout (toward the already organized) means the convened public may not be the affected public. Plan: proactive outreach to underrepresented groups (e.g., door-knocking, childcare at meetings, multiple meeting times, translation). Must also measure representativeness of participants (e.g., demographics vs. district).
  - **Step 3: Genuine Test**: Hypothesis: PB will increase civic engagement and produce spending decisions that better reflect community needs. Risky assumption: marginalized groups will participate and their voices will be heard. Design: measure turnout (especially from underrepresented groups), survey participants and non-participants on satisfaction, and track how projects are selected. Failure criteria: if underrepresented groups make up less than X% of participants (where X is their proportion in the district) or if non-participants express dissatisfaction with the process.
  - **Step 4: Handling Ambiguity/Conflict**: If turnout is low and skewed, but the participants are happy, we must confront the mismatch: the pilot may have failed to engage the broader public. This is a failure even if the participants are happy. The team must report this and not scale without redesign.
  - **Step 5: Values vs. Facts**: The question of whether PB is a good approach for the district involves values (e.g., is it more important to have efficient spending or democratic engagement?). Even if the pilot "fails" by our criteria, elected officials might still value the engagement that occurred and want to continue.

  **Outcome**: The procedure might recommend stopping or redesigning the pilot if it fails to engage the broader public. This may not be liked by the team because the pilot might have been internally seen as successful with the participants. However, this is not a defect of the procedure but a cost of taking Dewey seriously: the public must include all affected, and the pilot must not reinforce existing power imbalances.

  **Case 3: Enforcement policy opposed by residents but with good measured effects**

  - **Step 1: Problem Definition**: The problem is, say, illegal parking in a neighborhood causing safety issues. Uncertainty: will increased enforcement reduce violations without causing resentment? A public has formed (residents who want safer streets, but also those who park illegally and others who might be affected by enforcement). Justified for experimentation.
  - **Step 2: Public Identification**: Affected: residents (both those who want enforcement and those who oppose), visitors, business owners. Plan: engage all groups, including opponents. If opponents are organized, include them in the design phase. If they are diffuse (e.g., occasional parkers), use surveys and public meetings.
  - **Step 3: Genuine Test**: Hypothesis: Increased enforcement will reduce violations and improve safety without causing undue hardship. Risky assumption: the community will accept the enforcement. Design: measure violation rates, safety incidents, and resident satisfaction (including opposition). Failure criteria: if opposition increases beyond a threshold (e.g., 40% of residents strongly oppose) or if there are unintended consequences (e.g., businesses lose customers).
  - **Step 4: Handling Ambiguity/Conflict**: If measured effects are good (e.g., violations down) but residents oppose it, this conflict must be addressed. The opposition might reveal that the metrics are incomplete (e.g., the enforcement is perceived as unfair, or it creates new problems). The team must engage the public to understand the opposition and adjust the policy accordingly.
  - **Step 5: Values vs. Facts**: The decision involves values: how much weight to give to resident autonomy vs. safety and rule of law? Even if the data shows improved safety, the opposition signals a value conflict. This must go to elected officials.

  **Outcome**: The procedure might recommend stopping the policy despite good measured effects because of public opposition. This will not be liked by the team or the sponsoring department because the data supports the policy. But according to Dewey, the public's experience of the policy is part of the facts. Ignoring it would turn the pilot into theater. This is a cost of taking Dewey seriously: the public's judgment is integral to the inquiry.

  ---

  **What the Procedure Cannot Do Within Constraints**:
  - It cannot create perfect representation of diffuse or future publics; it relies on proxies and sampling that may be imperfect.
  - It cannot resolve deep value conflicts; it can only surface them for elected officials.
  - It cannot extend the pilot beyond 18 months, so some long-term effects may be missed.
  - It cannot eliminate the resource constraints of the workshop (2-3 hours), so some steps might be done superficially. However, the workshop is a starting point and the team can do more work outside if needed.

  This procedure provides a structured way to embed Dewey's principles of democratic inquiry into the pilot process, making it more than theater.
answer: |-
  ### **Dewey-Inspired Pilot Assessment Procedure**  
  Based on John Dewey's framework, this procedure treats pilots as democratic inquiries where affected publics co-create knowledge. It requires **one 2–3 hour workshop** per pilot, led by your policy-pilot team. Elected officials must sign off on budget/enforcement decisions, and pilots are capped at 18 months.  

  ---

  #### **Procedure Steps**  
  **Step 1: Is This a Problem for Experimentation?** (20 mins)  
  **Purpose**: Filter out non-experiments (solutions with known outcomes) and justify inquiry.  
  - **Criteria for Experimentation**:  
    - **Uncertainty**: The problem’s root causes or solution impacts are unknown or contested.  
    - **Public consequence**: Indirect effects (e.g., environmental spillovers, equity impacts) escape existing decision-making structures.  
    - **Iterative need**: Solutions require adaptation, not top-down imposition.  
  - **If NO** (certain outcomes, no public consequence): Recommend direct implementation/abandonment.  
  - **If YES**: Proceed.  
  - **Judgment Call**: Deciding "uncertainty" and "public consequence" (e.g., is a 5% cost-saving pilot uncertain if similar cities succeeded?).  

  **Step 2: Identify the Affected Public** (40 mins)  
  **Purpose**: Map who bears consequences and ensure their inclusion.  
  - **Process**:  
    1. **Consequence mapping**: Brainstorm all affected groups (direct/indirect, present/future).  
    2. **Gaps check**: Label groups as:  
       - **Diffuse** (e.g., taxpayers): Use statistical sampling (e.g., city-wide surveys).  
       - **Future** (e.g., climate impacts): Invite proxies (e.g., youth councils, sustainability NGOs).  
       - **Hard-to-reach** (e.g., non-English speakers): Partner with trusted intermediaries (e.g., community leaders, advocacy groups).  
    3. **Mismatch test**: Ask, *"Could this convened group ignore a key consequence (e.g., gentrification, racial bias)?"* If yes, revisit gaps.  
  - **Output**: Public engagement plan (e.g., "For pilot X, sample 100 residents via stratified surveys + 2 focus groups with immigrant NGOs").  
  - **Judgment Call**: Defining "adequate representation" of diffuse/future groups and selecting proxies.  

  **Step 3: Design a Genuine Test** (45 mins)  
  **Purpose**: Ensure the pilot can fail and challenge assumptions.  
  - **Process**:  
    1. **State core hypotheses**: *"We believe [intervention] will cause [change] for [public] because [mechanism]."*  
    2. **Identify failure conditions**:  
       - Define quantitative thresholds (e.g., "If resident complaints rise >15%, the pilot fails").  
       - Define qualitative red flags (e.g., "If marginalized groups report feeling excluded").  
    3. **Resist "cannot fail" designs**:  
       - Ban cherry-picking (e.g., no piloting in "easy" neighborhoods only).  
       - Require a control/comparison group (e.g., parallel area with status quo).  
       - Measure unintended consequences (e.g., equity, behavior changes).  
  - **Constraints accommodation**: For 18-month limit, focus on leading indicators (e.g., resident trust surveys vs. long-term economic effects).  
  - **Judgment Call**: Setting failure thresholds and prioritizing which consequences to measure.  

  **Step 4: Handle Ambiguity & Public Conflict** (30 mins)  
  **Purpose**: Address inconclusive results or public opposition.  
  - **Process**:  
    - **Ambiguous results**: Reconvene the public to interpret data (e.g., "Residents say cost savings feel unfair—why?").  
    - **Results vs. public desire**: If data conflicts with public sentiment:  
      - Treat public opposition as data (e.g., "Metrics show safety improved, but residents feel targeted—investigate why").  
      - Distinguish facts ("enforcement reduced violations") from values ("fairness matters more than efficiency").  
    - **Output**: Revised hypotheses or a redesign proposal (e.g., "Pilot modified with community oversight").  
  - **Judgment Call**: Deciding when opposition reflects flawed metrics vs. irreconcilable values.  

  **Step 5: Values vs. Facts Handoff** (15 mins)  
  **Purpose**: Flag when elected officials must decide.  
  - **Handoff triggers**:  
    - The pilot reveals a values conflict (e.g., "Should we prioritize cost savings over resident comfort?").  
    - Trade-offs require legitimation beyond data (e.g., "Enforcement reduces crime but targets minorities").  
    - Budgets/enforcement are involved (per constraints).  
  - **Output**: Report separating:  
    - **Facts** (e.g., "Bin complaints rose 10%").  
    - **Public input** (e.g., "70% of residents oppose the policy despite results").  
    - **Values questions** (e.g., "Is cost efficiency worth reduced satisfaction?").  

  ---

  ### **What the Procedure Cannot Do**  
  - **Eliminate judgment calls**: Steps 1–4 rely on subjective team decisions (noted above).  
  - **Override elected authority**: Budgets/enforcement always require sign-off; values conflicts are deferred.  
  - **Fully capture long-term/diffuse effects**: 18-month limit may miss future consequences (e.g., generational equity).  
  - **Guarantee perfect representation**: Hard-to-reach groups may still be underrepresented due to resource limits.  

  ---

  ### **Case Applications**  

  #### **Case 1: Four-Day Bin Collection Intervals**  
  - **Step 1**: **Experiment-worthy**—Uncertainty about resident adaptation (overflow? compliance?) and public consequences (health, equity for dense housing).  
  - **Step 2**: **Public** = Residents + businesses on routes (+ diffuse: city-wide sanitation costs). **Gaps**: Renters (hard-to-reach) → partner with landlords for surveys.  
  - **Step 3**: **Genuine test**—Control: Keep 3-day intervals in similar area. Failure: >15% overflow complaints or >10% cost increase from cleanup.  
  - **Step 4**: If results show cost savings but high complaints, engage residents to co-design adjustments (e.g., larger bins).  
  - **Step 5**: **Values handoff** if savings-comfort trade-off emerges → elected officials decide.  
  - **Outcome**: Likely proceed to scale if data/public align. **Team likes this**—clear metrics, low conflict.  

  #### **Case 2: Participatory Budgeting in Low-Turnout District**  
  - **Step 1**: **Experiment-worthy**—Uncertainty about engaging marginalized groups; public consequences (reinforcing inequity).  
  - **Step 2**: **Public** = All district residents (+ future: fund allocation impacts). **Gaps**: Unorganized youth/immigrants (hard-to-reach) → partner with schools, cultural centers. **Mismatch test**: If only "already organized" attend, consequences (e.g., park funds steered to wealthy areas) escape inquiry.  
  - **Step 3**: **Genuine test**—Failure: <30% turnout from marginalized ZIP codes OR funds allocated disproportionally to organized groups. Measure project proposals' equity (e.g., by neighborhood need).  
  - **Step 4**: **Ambiguity**—If turnout is low but participants are happy, reconvene non-participants to diagnose barriers.  
  - **Step 5**: **Values handoff** if equity-fairness conflict arises (e.g., "Should we override skewed votes for equity?").  
  - **Outcome**: **Team will not like this**—Procedure may recommend "stop" if marginalized groups are excluded, even if organized groups are satisfied. *Not a defect*: Dewey demands the affected public (all residents) co-define the problem. Scaling without inclusion turns inquiry into theater.  

  #### **Case 3: Opposed Enforcement Policy with Good Metrics**  
  - **Step 1**: **Experiment-worthy**—Uncertainty about public acceptance; consequences for trust in government.  
  - **Step 2**: **Public** = Targeted residents (+ diffuse: city-wide safety). **Gaps**: Skeptical residents (hard-to-reach) → deliberate forums with neutral facilitators.  
  - **Step 3**: **Genuine test**—Measure both outcomes (e.g., violation rates) and trust (e.g., surveys on fairness). Failure: >40% opposition persists post-pilot OR trust declines.  
  - **Step 4**: **Conflict**—If metrics improve but opposition remains, treat opposition as data: "Residents feel targeted due to racial bias? Adjust metrics to track disparities."  
  - **Step 5**: **Values handoff**—Electeds decide trade-off between efficiency and legitimacy.  
  - **Outcome**: Likely recommend "stop" if opposition persists, despite metrics. **Team may not like this**—but Dewey insists publics test responses *with* inquiry, not endure verdicts. Opposition reveals flawed problem definition (e.g., ignored dignity concerns).  

  ---

  ### **Summary**  
  This procedure operationalizes Dewey by forcing pilots to: (1) start with public consequences, not institutional convenience; (2) include affected voices in design/interpretation; and (3) separate technical facts from democratic values. It accepts that some judgments are unavoidable and that constraints limit long-term/diffuse impact analysis. Cases 2 and 3 may yield unpopular outcomes, but this reflects Dewey’s core tenet: **democratic inquiry fails when the public’s problem is divorced from the institution’s solution**.
