answer: |-
  Here is a translation of archival silences into novelistic craft vocabulary, claim by claim, followed by the residue report. I'll maintain high compression and flag confidence levels throughout.

  **Translation:**

  1.  **Claim: Archives are constructed artifacts, not neutral repositories.**
      *   **Translation:** The storyworld itself, including its history, societal structures, and available knowledge, is an artifact constructed by the *implied author*. Just as an archive reflects the power and priorities of its creators, the novel's setting and backstory reflect the implied author's conscious design and inherent biases. What exists "off-stage" or in the past is curated. *(Confidence: High - Direct mapping to worldbuilding and implied authorial intent.)*

  2.  **Claim: Acquisition, appraisal, and cataloguing decisions are interpretive acts; the finding aid is an argument.**
      *   **Translation:** This maps to *focalization* and the *implied author's selection*. What the focalizing character/narrator perceives, deems important, chooses to describe (or omit), and how they arrange the narrative (scene order, summary, ellipsis) constitutes the interpretive act. The narrative structure itself (chapter breaks, section headings, even the sequence of scenes) functions as the "finding aid," arguing for a specific understanding of events and what merits attention. *(Confidence: Medium-High - Focalization handles perception/selection, narrative structure handles arrangement. "Argument" is inherent in POV and structure.)*

  3.  **Claim: Silences are multi-faceted: unrecorded, destroyed, unfindable.**
      *   **Translation:**
          *   **Unrecorded:** *Prospective omission* (the scene/event/fact the implied author never conceived of or deemed irrelevant to the designed storyworld/plot). Also, worldbuilding elements deliberately excluded to shape societal perception (e.g., a marginalized group whose perspective is structurally absent).
          *   **Destroyed:** *Retrospective omission* (scenes/facts drafted and deliberately cut in revision) or deliberate *ellipsis* within the narrative (e.g., "They never spoke of that night again").
          *   **Unfindable:** *Buried backstory/lore* existing in notes but never reaching the page, or information present *within the text* but obscured by *unreliable narration*, misleading focalization, complex structure (non-linear timelines, fragmented perspectives), or deliberate *obfuscation* by the implied author. *(Confidence: High - Your omission taxonomy and existing craft terms map cleanly.)*

  4.  **Claim: The researcher's questions manufacture additional silences (what isn't asked remains hidden).**
      *   **Translation:** This maps most closely to the *reader's experience* and the *gaps inherent in focalization*. The narrative presents a specific path (the focalizer's journey/questions). What the focalizer *doesn't* pursue, the questions they *don't* ask (due to character, circumstance, or implied authorial design limiting their purview), creates gaps the reader *might* perceive but which remain unexplored *within the text*. This is a silence manufactured by the constrained path of the narrative itself, relative to the potential totality of the storyworld. *(Confidence: Medium - It's about the *reader's* potential awareness of paths not taken, constrained by the narrative's chosen focus. Less about authorial omission, more about readerly inference constrained by POV.)*

  **Residue Report:**

  *   **Clean Mappings (High Confidence):** The constructed nature of the archive/storyworld (Implied Author), the interpretive act of selection/arrangement (Focalization/Narrative Structure), and the taxonomy of silences (Prospective/Retrospective Omission, Ellipsis, Buried Lore) translate remarkably well. Archival processes map directly to authorial and narrative craft decisions.
  *   **Mappings with Distortion (Medium Confidence):** The "researcher's questions creating silence" translates, but with a shift. In archives, the researcher is an *external agent* whose actions create *their own* unique silence. In the novel, the "researcher" is the *reader*, and the "silence" is a *potential path within the storyworld* made invisible by the *narrative's chosen focalization and structure*, designed by the implied author. The agency differs. The archival silence is actively created *by the user*; the novelistic silence is a *consequence of the narrative design* perceived *by the user*.
  *   **No Direct Expression:**
      *   **Distributed, Non-Authored Silence:** This is the core asymmetry. Novelistic silence is *always* traceable to the implied author (consciously or unconsciously). Archival silence arises from countless distributed decisions (appraisal committees, bureaucratic inertia, colonial systems, cataloguing rules) across time, lacking a single authorial intent. The novelist can *represent* this (e.g., a character frustrated by systemic gaps), but cannot truly *replicate* it within their craft, as every representation is *their* choice. *(This is the fundamental difference.)*
      *   **Unfindability as Truly Emergent:** While you can have buried lore or obscured info, its "unfindability" is still authored. True archival unfindability can be an accidental byproduct of complex systems, not deliberate hiding.

  **Verdict & Asymmetry:**

  The novelist's vantage point is **genuine and revealing**, particularly in exposing the *myth of neutrality* in both archives and narratives. Your craft vocabulary powerfully dissects the *interpretive acts* inherent in constructing any representation of reality. However, the **asymmetry of agency in silence is real and profound.** While archives *result* from human actions, their silences are *structural and emergent*, lacking the unified intentionality of the implied author. Theorists sometimes underplay this distributed agency, making their silences *sound* more authored than they are. Conversely, novelists might over-ascribe intention to every gap.

  **The residue points to a genuine gap in the craft vocabulary:** the ability to represent *truly emergent, non-authored, system-generated silence* within the narrative itself. You can describe it, thematize it, have characters encounter it, but the silence in *your text* about that systemic silence is still *your* authorial choice. Theorists' claims about structural silence are valid, but their language can sometimes *feel* authorial, creating a false equivalency your craft lens usefully exposes. Your vocabulary isn't missing a term; it's constrained by the inherent authored nature of the form.

  **Least Confident Mapping:** The translation of "researcher's questions creating silence" to the reader's constrained path (Confidence: Medium). What would change my mind? Stronger evidence from archival theory that this type of silence is fundamentally *about interpretation* (aligning with reader experience) rather than being a concrete *absence created in that specific instance by the physical act of searching* (e.g., a query syntax flaw missing records that *were* findable). If it's more about the *lens* brought than the *mechanics* of the search, the mapping holds. If it's more about the mechanics, the distortion is greater.
