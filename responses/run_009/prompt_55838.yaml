answer: |-
  ## The Case Against the Ordinalist Objection: Proving Too Much and Collapsing into Skepticism

  The classic ordinalist objection – that interpersonal utility comparisons are meaningless because utility functions are defined only up to positive monotonic transformations, rendering units and origins arbitrary – is a powerful critique. However, when pressed rigorously, this objection proves too much. It not only undermines interpersonal comparisons but also destabilizes the foundations of *intrapersonal* comparisons across time and even within a single agent. Its most defensible form ultimately collapses into a general skepticism about utility comparisons, rendering the ordinalist's own analytical tools incoherent.

  **1. The Myth of Privileged "Internal Access" for Intrapersonal Comparisons:**
     The common defense – that a person "just knows" their own past utility states "from the inside" – crumbles under scrutiny. How does my present self access the utility state of my past self?
      *   **Memory is Fallible Evidence:** I rely on the *memory* of how I felt yesterday or last year. Memory is reconstructive, prone to bias, distortion, and decay. It is fundamentally an *evidential process*, no different in kind (though perhaps in degree of access) from a third party relying on my self-report ("I was miserable") or physiological observations (tears, lethargy). There is no direct, infallible conduit to past utility states. If the ordinalist rejects interpersonal comparisons because we lack direct access to another's internal state, they must also reject intrapersonal comparisons because my *present* self lacks direct access to my *past* self's internal state – only mediated evidence remains. The "arbitrary origin/unit" problem persists: How can I meaningfully say, "I am twice as happy today as I was last Tuesday," if the scale anchoring last Tuesday's "5" could have been rescaled without changing the underlying preferences?

  **2. The Sorites Paradox of Personal Identity and Continuity:**
     If the ordinalist grounds intrapersonal comparability in the "continuity of one underlying physical and psychological system," this principle is fatally vulnerable to borderline cases:
      *   **The Spectrum of Continuity:** Personal identity is not a binary switch. Consider gradual neural replacement (a thought experiment where neurons are slowly replaced with artificial duplicates), split-brain patients (where hemispheres exhibit distinct preferences), conjoined twins sharing neural pathways and affective states, or the gradual cognitive decline in dementia. Where exactly does "one system" end? At what precise point does the continuity break such that utility comparisons between temporal stages become "meaningless" due to scaling arbitrariness? A defender might claim "sufficient continuity" licenses comparison, but this immediately abandons the strict ordinalist dogma demanding *precise* identification of origin and unit. It smuggles in a pragmatic convention about what counts as "the same system," undermining the claim that interpersonal comparisons are *in principle* impossible while intrapersonal ones are unproblematic.

  **3. The Ordinalist's Practical Dilemma:**
     Welfare economists who wield this objection against interpersonal comparisons routinely rely on and model intrapersonal comparisons:
      *   **Essential Modeling Practices:** Lifecycle consumption/saving models (comparing utility of spending now vs. saving for future consumption), models of addiction (comparing the craving-induced utility of immediate use vs. the long-term utility of sobriety), habit formation, time-inconsistent preferences, and discounting all inherently involve comparing the utility of different outcomes (or states) for the *same person* at *different times*. This practice is foundational.
      *   **The Unavoidable Dilemma:**
          1.  **Option 1 (Concede Convention):** Acknowledge that the meaningfulness of *both* intra- and interpersonal utility comparisons rests not on a metaphysical guarantee of scale identity, but on pragmatic conventions grounded in degrees of psychological/physical continuity or shared frameworks (like neurobiology). This collapses the objection into a skepticism about *all* cardinal utility claims, forcing a reevaluation based on empirical plausibility and theoretical usefulness (e.g., neuroeconomics, behavioral welfare), not a priori impossibility. It renders the special prohibition against interpersonal comparisons arbitrary.
          2.  **Option 2 (Accept Self-Defeating Skepticism):** Insist that strict ordinalism forbids *all* cardinal utility comparisons, including intrapersonal ones. This condemns vast swathes of standard economic modeling as literally meaningless. Models involving saving, addiction, or lifecycle planning become incoherent exercises. This position is theoretically pure but practically sterile and self-refuting, as it invalidates the very models economists use daily.

  **Where the Argument is Most Vulnerable: The "Shared System" Counterattack**

  The most potent counterargument claims: *Intrapersonal comparisons require only a shared underlying preference system (one brain/mind evolving over time), whereas interpersonal comparisons demand something strictly stronger – the impossible alignment of two distinct, arbitrary scales. The analogy breaks down because continuity provides a natural anchor missing between persons.*

  **Rebuttal to the Vulnerability:**

  1.  **"Shared System" Degrades Over Time:** The "shared system" argument relies on a *persisting* anchor. But the preferences, values, and neural substrates constituting the system *change*. The 80-year-old may share continuity with their 20-year-old self, but their preferences and utility function (even ordinally) might be radically different. Why does physical continuity magically solve the scaling problem when the psychological content shifts? If the origin/unit was arbitrary at t=20, and the system changes, what guarantees the scale remains comparable at t=80? Continuity doesn't fix the scale; it just provides a narrative thread connecting *different* scales.
  2.  **Edge Cases Dissolve the Distinction:** Cases like profound dementia or dissociative identity disorder (DID) strain the "shared system" concept. If a DID alter has distinct preferences, is comparing its utility to the host's utility *inter*personal or *intra*personal? The physical system is shared, but the psychological systems are separate. The ordinalist needs a sharp distinction where biology offers a blur. If the distinction isn't sharp, then the meaningfulness of comparison becomes a matter of degree, not kind.
  3.  **Why Not Extend "Shared Framework"?** If a sufficiently integrated psychological/physical system licenses comparisons *within* it, why can't sufficiently similar neurobiological frameworks (e.g., shared pain/pleasure pathways, dopamine reward systems) or deeply empathetic understanding provide a *pragmatic*, convention-based justification for *some* interpersonal comparisons? The ordinalist dismisses this as impossible, but the foundation they offer for intrapersonal comparisons (continuity of a changing system) is itself vulnerable and looks suspiciously like a weaker form of the same convention they reject interpersonally. The demand for "something strictly stronger" between persons seems arbitrary if the basis for intrapersonal comparison is already a convention about sufficient connection.

  **Conclusion:**

  The ordinalist objection, pursued with logical consistency, becomes a universal acid. It dissolves not only interpersonal utility comparisons but also the intrapersonal comparisons indispensable to economics itself. The attempt to salvage intrapersonal comparisons via "internal access" fails, as access is evidential and fallible. Grounding them in "continuity" fails because continuity is a matter of degree, vulnerable to borderline cases that expose the reliance on convention. The practicing economist who rejects interpersonal comparisons while relying on intrapersonal ones faces an untenable dilemma: either admit that the meaningfulness of utility comparisons rests on pragmatic conventions applicable (in principle) to both domains, or embrace a radical skepticism that invalidates their core models.

  The strongest counterargument – the "shared system" defense – ultimately falters. It cannot adequately explain how continuity resolves the scaling problem for a *changing* system without smuggling in convention, and it struggles to handle cases where the boundaries of "one system" blur. The ordinalist objection, in its zeal to purge welfare economics of unverifiable claims, proves too much and collapses into a skepticism that undermines the very possibility of utility-based welfare analysis altogether. The choice becomes not between meaningful intrapersonal and meaningless interpersonal comparisons, but between embracing utility comparisons as useful, empirically constrained conventions grounded in degrees of connection and similarity, or abandoning cardinal utility concepts entirely. The ordinalist objection, taken seriously, points towards the latter conclusion.
