prompt: |-
  I'm an undergraduate taking a seminar on democratic theory, and we've spent two weeks on populism and the concept of "the will of the people." For my term paper I want to work through something concrete, and I'd like your help developing the analysis before I write it up. Please act as an expert political philosopher with a specialism in democratic institutions and the theory of popular sovereignty, and think carefully and systematically before answering — start by brainstorming what a good answer would need to cover, then organize your response around your strongest reconstruction rather than listing everything.

  Here's the puzzle. Referendums are often defended as the most direct way of consulting the people's will, and populist movements in particular invoke referendum results as an unmediated expression of what "the people" want. But when you look at how referendums are actually designed and administered, the practices are strange and, on the face of it, inconsistent with each other. Constitutional referendums typically require supermajorities or high turnout thresholds, while others — including ones with sweeping consequences — pass by bare majority. Some referendum outcomes are treated as final and sacred, while others get effectively re-run or renegotiated until the "right" answer arrives (as happened when EU member states whose voters initially rejected treaty ratification were asked to vote again, sometimes after the treaty was cosmetically adjusted — whereas the Brexit result was treated as irreversible and its re-running widely condemned as anti-democratic). Governments sometimes hold referendums intending to ignore a losing result they don't like, and courts sometimes annul results on procedural or substantive grounds while insisting this doesn't touch popular sovereignty. Even the sequencing is curious: the same question framed differently, or asked in a different order after other votes, seems to yield different "wills."

  So my question: what theory of "the will of the people" does the actual practice of holding referendums presuppose? Does the machinery only make sense if there is a pre-political, unified, discoverable popular will — roughly the populist or Rousseauian picture — or is it equally (or better) explained on a constructivist or pluralist view, where the counting procedure partly creates the will it claims to record, and where "the people" is really many partially overlapping publics whose preferences don't aggregate into a single coherent thing? Does a supermajority requirement, for instance, presuppose that simple majorities can fail to express the real will — and if so, what expresses it better, given that the supermajority threshold is itself set by ordinary institutions? And is the practice of re-running "wrong" answers consistent with the practice of sacralizing other answers, or do both follow from one coherent (perhaps paternalistic or trustee-style) view of what referendums are for?

  I'd like you to reconstruct the implicit theory or theories embedded in referendum practice, say clearly which parts of the practice strictly presuppose a populism-friendly metaphysics of the will and which parts are compatible with several rival theories, and identify where the practice is philosophically underdetermined — that is, where no settled view of the popular will is actually required, just as a matter of what makes the machinery work. Then close by telling me what a referendum regime would have to look like if it were deliberately designed around a pluralist, constructivist view of the popular will instead — what would change about thresholds, finality, re-runs, and who interprets the result — and whether such a regime could still be honestly marketed as "letting the people decide." Please note where you think my framing is off, if it is.
reasoning: |-
  Okay, this is a sophisticated undergraduate paper query about referendums and theories of popular will. The student clearly has a strong grasp of democratic theory concepts and has identified fascinating contradictions in real-world referendum practices. They're asking me to reconstruct the implicit theories of "the people's will" embedded in these practices.

  First, I need to unpack the core tensions they've observed: the variable thresholds (supermajority vs simple majority), selective finality (sacred vs re-runnable results), and framing effects. Their central question is whether these practices presuppose a unified populist/Rousseauian will or align better with pluralist/constructivist views.

  Hmm... the student's framing is actually quite sharp, but I should note where it might need refinement. They contrast "pre-political unified will" versus "constructivist/pluralist" views as binaries, but in practice there might be hybrid positions. Also, their Brexit vs EU treaty examples are excellent, but I should be careful not to overgeneralize from those cases.

  The key philosophical puzzle they're circling is this: if the will is pre-existing, why do procedural choices so dramatically affect outcomes? But if it's constructed, how can we call referendums "expressions" of popular will? This goes to the heart of democratic legitimacy.

  For my reconstruction, I'll need to:
  First show how different referendum designs reveal conflicting assumptions about the popular will. Supermajorities imply that simple majorities can be "false" expressions, while re-runs suggest the will is revisable - both undermining the populist ideal of a unified, discoverable will.

  Then analyze where practices strictly require populist premises (like treating results as sacred) versus where they're compatible with pluralism (like procedural annulments). The sequencing effects are particularly damaging to the populist view since they show the "will" is frame-dependent.

  Interesting that the threshold-setting paradox exposes a circularity: ordinary institutions define what counts as the "real" will, suggesting the will isn't pre-political after all. And the selective finality - Brexit irreversible vs EU treaties re-voted - reveals that "sacredness" is often political, not philosophical.

  For the pluralist redesign, I'm imagining: mandatory deliberation phases, probabilistic voting options, sunset clauses instead of re-runs, and independent interpretive bodies. The marketing challenge is real - "letting the people decide" would need redefinition as an ongoing conversation rather than one-off revelation.

  The student might be underestimating how much all referendums, even pluralist-designed ones, inevitably construct the will through their design. But their core insight is correct: current practices are philosophically incoherent, mixing populist rhetoric with institutional choices that undermine it.
answer: |-
  Your framing is exceptionally sharp—you've identified precisely the tensions that reveal the philosophical contradictions in referendum practices. I'll reconstruct the implicit theories embedded in these practices, identify where they presuppose specific conceptions of "the will," and propose how a pluralist-constructivist referendum regime would function. 

  ### Core Philosophical Tensions in Referendum Practices
  Your observations expose three contradictions demanding explanation:  
  1. **Threshold Variability**: Why supermajorities for constitutional changes but simple majorities for equally consequential policies?  
  2. **Selective Finality**: Why are some results "sacred" (Brexit) while others are re-run (EU treaties)?  
  3. **Procedural Constructivism**: Why do sequencing/framing effects alter outcomes if the will is pre-existing?  

  These practices aren't random; they reveal competing implicit theories of popular sovereignty.  

  ---

  ### Reconstructing the Implicit Theories  
  **1. The Populist/Rousseauian Premise (and Its Inconsistencies)**  
  - **Supposed Presupposition**: A unified, pre-political popular will exists and can be "discovered" through direct voting.  
  - **Where Practice *Appears* to Assume This**:  
    - *Sacralization of Results*: Treating outcomes as irreversible (e.g., Brexit) mirrors Rousseau's "general will" as infallible.  
    - *Anti-Rerun Rhetoric*: Claims that second votes "betray the people" imply the will is fixed and already expressed.  
  - **Where Practice *Undermines* This Premise**:  
    - *Supermajority Requirements*: Imply simple majorities may reflect "temporary passions" (Madison) or factional interests, not the "real" will.  
    - *Re-Runs/Re-Negotiations*: The EU treaty adjustments (e.g., Ireland's Lisbon II) assume the will is malleable and context-dependent.  
    - *Framing/Sequencing Effects*: Different outcomes based on question-wording (e.g., "independence" vs. "devolution") prove the "will" is constructed by institutional choices.  

  **→ Philosophical Paradox**: Thresholds and re-runs reveal an *elite trusteeship* disguised as populism. Supermajorities are set by ordinary legislatures, implying elites define what counts as the "authentic" will. This is paternalism in populist clothing.  

  **2. The Pluralist-Constructivist Alternative**  
  - **Core Insight**: "The people" is not a unitary agent but multiple publics with incommensurable preferences. The "will" is constituted *through* the aggregation process itself (per Arrow’s impossibility theorem).  
  - **Where Practice *Accidentally* Embraces This**:  
    - *Procedural Annulments*: Courts overturning results (e.g., Colombia’s 2016 peace plebiscite) acknowledge that flawed processes construct flawed "wills."  
    - *Re-Runs*: Implicitly accept that preferences are revisable and context-sensitive (constructivism).  
    - *Variable Thresholds*: Recognize that some decisions require broader consensus across plural groups (pluralism).  

  **→ Key Realization**: Referendum mechanics *always* construct the will; the question is whether this is done transparently.  

  ---

  ### Where the Practice is Philosophically Underdetermined  
  1. **Threshold Settings**: No theory dictates whether constitutions need 50%+1 or 67%. This is a contingent elite choice.  
  2. **Finality vs. Revisability**: Neither populism nor pluralism logically *requires* irreversibility. Brexit’s sacralization served political strategy, not democratic theory.  
  3. **Question Framing**: All theories must confront framing effects, but only constructivists openly admit this shapes the "will."  

  ---

  ### A Pluralist-Constructivist Referendum Regime: Key Features  
  If designed deliberately around pluralism/constructivism, referendums would:  

  | **Feature**         | **Current Practice**                | **Pluralist-Constructivist Redesign**                |  
  |----------------------|-------------------------------------|------------------------------------------------------|  
  | **Thresholds**       | Ad hoc (supermajority for constitutions) | *Tiered thresholds*: Higher for rights-restrictions (e.g., 60%), lower for policy. Thresholds vary by impact on minority groups. |  
  | **Finality**         | Selectively "sacred"                | *Sunset clauses*: Binding results expire after 5-10 years unless re-confirmed. No result is eternally sacred. |  
  | **Re-Runs**          | Ad hoc (often elite-driven)         | *Mandatory deliberation*: If initial margin <55%, trigger citizen assemblies to refine options before re-vote. |  
  | **Result Interpretation** | Government claims monopoly   | *Independent Review Panel* (judges + sortition citizens) interprets ambiguities, assessing trade-offs between revealed preferences. |  
  | **Question Design**  | Government-controlled               | *Citizen Jury Drafting*: Randomly selected panel frames questions via deliberative process. Multiple measures on overlapping issues allowed. |  

  **Could it be marketed as "letting the people decide"?**  
  Yes, but with radically different meaning:  
  - **Populist View**: "The people decide" = *revealing a pre-formed, unitary will*.  
  - **Pluralist View**: "The people decide" = *structuring an ongoing process where diverse preferences are weighed iteratively*.  
  Marketing would emphasize *inclusive deliberation over revelation*—e.g., "The People's Process," not "The People's Verdict."  

  ---

  ### Critique of Your Framing (Minor Adjustments)  
  You slightly overstate the "pre-political will" assumption. Practices like procedural annulments and re-runs suggest elites *know* the will is constructed but leverage populist *rhetoric* for legitimacy. The core inconsistency isn’t just philosophical—it’s *strategic hypocrisy*.  

  ### Key Conclusion for Your Paper  
  Referendum practices reveal a **schizophrenic theory of popular sovereignty**: invoking Rousseauian unmediated will *symbolically* while relying on Burkean trusteeship *operationally*. A coherent pluralist-constructivist regime wouldn’t eliminate contradictions (preference aggregation is inherently messy) but would make the construction of the "will" transparent, deliberative, and revisable—treating democracy as a dynamic system of preference *formation*, not a one-off revelation.  

  This shift from **epistemology of discovery** to **ethics of democratic process** is where your paper can make its strongest contribution. I recommend closing by arguing that referendums expose democracy’s central tension: between the *myth* of popular unity and the *reality* of pluralist construction.
