  ### Principle for Updating Credences on Reliable Indicative Conditionals

  Upon learning an indicative conditional "If \(A\), then \(C\)" from an impeccably reliable source, update your credence function as follows:  
  - Set \(P_{\text{new}}(A \land \neg C) = 0\).  
  - Set \(P_{\text{new}}(A \land C) = P(A)\) (which scales the probabilities of \(A \land C\) worlds proportionally if \(P(A \land C) < P(A)\)).  
  - Keep \(P_{\text{new}}(\neg A)\) and the probabilities within \(\neg A\) unchanged.  

  This minimizes Kullback-Leibler divergence while respecting the source's reliability, driving \(P(C|A)\) to 1 and preserving the probability of \(A\) and \(\neg A\). It redistributes probability mass among \(A\)-worlds to satisfy \(P(C|A) = 1\), leaving \(\neg A\)-worlds unaffected.

