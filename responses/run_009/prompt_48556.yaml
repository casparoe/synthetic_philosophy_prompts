prompt: |-
  Analyze the collapse of footbinding in China as a test case for competing explanations of how immoral practices end. The salient facts: footbinding persisted for roughly a millennium despite periodic imperial prohibition attempts and centuries of moral criticism within China itself; yet in the 1890s, reformers founded anti-footbinding societies whose members made a double pledge — not to bind their own daughters' feet, and not to allow their sons to marry women with bound feet — and the practice largely died out within a generation, amid reformist anxiety about China's standing among industrialized powers. Run this episode through both Kwame Anthony Appiah's honor thesis from The Honor Code (2010), on which practices end when they come to seem degrading by the participants' own internalized honor code, and Gerry Mackie's convention account (American Sociological Review, 1996), on which footbinding was a self-enforcing marriage-market equilibrium that fell only once coordinated pledges dissolved the interdependent expectations holding it in place. Map the episode carefully onto each: who the relevant "players" were, what changed their incentives or their self-conception, and which explanation covers the double pledge, the timing of the collapse after the failure of bans and arguments, and the role of national humiliation versus domestic marriage prospects. Then say where each account is silent — what neither honor-shift nor coordination can explain — and, running in the other direction, what the case shows about whether moral revolutions are ever driven by moral argument as such. If you think the two accounts are ultimately competing descriptions of one mechanism rather than rival explanations, defend that; if not, tell me which one the footbinding case favors and what evidence from the episode would have come out differently under the other.
reasoning: |-
  Alright, the user wants me to analyze the collapse of footbinding in China through two theoretical frameworks: Appiah's honor thesis and Mackie's convention account. Let me start by recalling the key points of each theory. Appiah focuses on how practices end when they become seen as dishonorable within a community's own value system. Mackie, on the other hand, argues that such practices are coordination problems that require collective action to dissolve.

  First, I need to map the historical facts onto both theories. Footbinding lasted a millennium despite bans and criticism, but collapsed quickly in the 1890s with anti-footbinding societies. The double pledge is crucial here—families pledged not to bind daughters' feet nor marry sons to bound-foot women. Also, the timing coincides with China's national humiliation by foreign powers and industrialization concerns.

  For Appiah's honor theory, the relevant players would be the elites and reformers. Their honor code shifted due to external comparisons with "civilized" nations. Being mocked by Western powers and Japan made footbinding a symbol of backwardness, thus degrading. This explains the emotional drive and the role of national shame. The double pledge could be seen as a public commitment to this new honor code. However, why did it take so long? Previous moral critiques didn't change the honor perception. The key change was the external humiliation altering internal honor standards.

  Mackie's convention theory views footbinding as a marriage market equilibrium. Families bound feet to ensure good marriages since bound feet were a norm for desirable brides. The double pledge breaks this by coordinating expectations: if everyone stops binding, unbound feet won't harm marriage prospects. The societies provided the needed coordination. This explains the rapid collapse post-pledge and why earlier bans failed—they lacked coordination. The national context might have spurred mobilization but isn't central to Mackie's mechanism.

  Now, where do the theories fall short? Appiah can't fully explain the double pledge's structure or how collective action was achieved. Mackie doesn't address the emotional shift or why coordination happened when it did. The national humiliation acted as a catalyst but isn't part of Mackie's core explanation.

  The user might be interested in whether moral arguments alone drive change. The case shows that arguments only work when tied to honor shifts or coordination. Also, the theories might complement each other: honor shift motivated the coordination. The evidence favoring Mackie is the effectiveness of the pledge system itself, which directly addressed the coordination problem. Under Appiah alone, without the pledge, change might have been slower or less uniform.

  I should also consider deeper needs. The user might be exploring how social change happens, especially for immoral practices. They might want insights into effective activism or the interplay between morality and practicality. Highlighting the combination of honor shift for motivation and coordination for mechanism could provide a nuanced answer.
answer: |-
  The collapse of footbinding offers a fascinating test case for Appiah's honor-based and Mackie's convention-based theories of ending immoral practices. Here's how the episode maps onto each, highlighting strengths, weaknesses, and their interplay:

  **1. Gerry Mackie's Convention Account (Self-Enforcing Equilibrium & Coordinated Pledge)**

  *   **Core Mechanism:** Footbinding was a self-enforcing convention essential for marriageability. Parents bound daughters' feet because they believed unbound feet would make them unmarriageable (a belief held by potential husbands/in-laws). This belief was only true *because* everyone else held it. The practice persisted due to interdependent expectations – no individual family could defect without harming their daughter's prospects.
  *   **Mapping the Episode:**
      *   **Players:** Families (parents of daughters and sons) as rational actors in the marriage market.
      *   **What Changed Incentives:** The anti-footbinding societies provided the crucial mechanism for **coordination**. The *double pledge* was the masterstroke. By pledging *simultaneously* not to bind daughters *and* not to require bound feet for daughters-in-law, the societies dissolved the interdependent expectations. Once a critical mass pledged, the belief that unbound feet meant unmarriageability collapsed. Families could defect safely, knowing a pool of acceptable grooms existed for their unbound daughters and acceptable brides existed for their sons.
      *   **Double Pledge:** This is the *core* of Mackie's explanation. It directly addresses the coordination problem by simultaneously altering the supply (unbound brides) and demand (husbands willing to marry them).
      *   **Timing of Collapse:** Perfectly explained. Centuries of bans and moral arguments failed because they didn't solve the coordination problem. The pledge societies *did* provide the necessary coordination mechanism, leading to rapid collapse within a generation once critical mass was achieved.
      *   **Role of National Humiliation:** Secondary catalyst. Mackie might argue the humiliation provided motivation for reformers to organize the societies *and* made families more receptive to joining (lowering the perceived cost of defection). However, the *mechanism* of collapse remains the coordinated pledge dissolving the marriage convention.
      *   **Role of Marriage Prospects:** Central. The entire convention was built upon marriage market expectations. The pledge directly targeted this.

  **2. Kwame Anthony Appiah's Honor Thesis (Internalized Honor Shift)**

  *   **Core Mechanism:** Practices end when they become seen as *dishonorable* or *degrading* according to the *internalized* honor code of the practitioners themselves, often triggered by contact with an external reference group whose scorn matters. Moral arguments alone fail; the practice must become incompatible with self-respect and social standing.
  *   **Mapping the Episode:**
      *   **Players:** Elite reformers, intellectuals, and eventually broader society (especially urban/educated classes). The key players are those whose sense of honor is recalibrated.
      *   **What Changed Self-Conception:** "Reformist anxiety about China's standing among industrialized powers" is crucial. Contact with Western powers and Japan, military defeats (Opium Wars, Sino-Japanese War), and the resulting national humiliation led reformers to internalize the *external* critique that footbinding was a "barbaric," "uncivilized," and *shameful* practice that marked China as backward. It became incompatible with national pride and a modern Chinese identity. The practice transformed from a sign of beauty and status to a sign of national degradation and personal dishonor.
      *   **Double Pledge:** Seen as a public *manifestation* and *enforcement* of the new honor code. Making the pledge was an honorable act of patriotism and modernization. Breaking it would bring dishonor within the reformist community. The pledge societies created a new honor group.
      *   **Timing of Collapse:** Explained by the *trigger* of intense national humiliation in the late 19th century. Previous imperial bans and moral critiques were internal and didn't successfully reframe the practice as fundamentally dishonorable to China *in the world*. The encounter with industrialized powers provided the potent external reference group whose scorn mattered deeply at a time of crisis.
      *   **Role of National Humiliation:** Absolutely central. It was the catalyst for the honor shift. The dishonor stemmed from China's perceived low status *because* of practices like footbinding.
      *   **Role of Marriage Prospects:** Downplayed. While practical concerns existed, the driving force was the *shame* associated with the practice in the new national context. Choosing not to bind became an act of reclaiming honor for the family and nation.

  **Where Each Account is Silent:**

  *   **Appiah's Silence on Coordination:** While explaining the *motivation* for change (honor/shame), Appiah doesn't fully explain the *mechanism* for overcoming the collective action problem inherent in the marriage convention. Why didn't the honor shift alone lead to individual defections that failed? How was the transition managed? The pledge system provided the practical coordination Appiah's model lacks.
  *   **Mackie's Silence on Motivation & Meaning:** Mackie explains *how* the convention broke (coordination) but is weaker on *why* the coordination mechanism emerged *when* it did and *why* people joined. What motivated the reformers to organize and families to sign the pledge? The national humiliation and resulting honor shift provided the powerful *reason* for mobilization that Mackie's model treats as exogenous or secondary. Mackie also downplays the profound shift in the *meaning* of the practice (from beauty to degradation), focusing instead on the strategic equilibrium.

  **Moral Argument as a Driver:**

  The footbinding case strongly suggests that **moral argument alone is insufficient to drive moral revolution.** Centuries of internal moral criticism (Confucian arguments about bodily integrity, Buddhist concerns, practical health arguments) failed to end the practice. What made the *late 19th-century* arguments effective was their **fusion with honor and coordination**:
  1.  **Argument + Honor:** The critique became powerful because it was tied to China's national honor and standing vis-à-vis the industrialized world. The argument gained traction because it resonated with a newly salient sense of shame and desire for respect.
  2.  **Argument + Coordination:** Reformers didn't just argue; they organized. The pledge societies translated the moral/honor-based argument into a concrete coordination mechanism that solved the practical marriage market problem.

  **Are the Accounts Competing or Complementary?**

  They are **largely complementary descriptions of different levels or aspects of the same revolutionary process,** rather than strict rivals. Footbinding's collapse likely required **both**:

  1.  **Honor Shift (Appiah) provided the *motivation* and *legitimization* for change:** It made ending footbinding a matter of national pride and individual dignity, creating the will to act and the social pressure against the practice.
  2.  **Coordination Mechanism (Mackie) provided the *practical solution* to the collective action problem:** It dissolved the specific marriage market convention that had trapped individuals, making defection safe and feasible.

  **Which Account Does the Case Favor? Evidence Differently Explained:**

  While complementary, the **footbinding case provides stronger, more direct evidence for Mackie's convention account.**

  *   **Why Mackie is Favored:**
      *   **The Double Pledge:** This is the smoking gun. Its structure (simultaneously altering supply and demand in the marriage market) and effectiveness are perfectly predicted by Mackie's theory. It's the core mechanism Appiah's model lacks. The rapid collapse *after* the pledge societies took hold, following millennia of failure, strongly points to coordination as the key.
      *   **Failure of Bans/Arguments:** Mackie explicitly explains why top-down bans and moral arguments failed (they didn't alter the interdependent expectations), while Appiah attributes failure to the lack of an effective honor shift trigger (which is plausible but less specific about the mechanism blocking change).
      *   **Marriage Prospects:** The centrality of the marriage market logic and the design of the pledge align perfectly with Mackie. Appiah struggles to explain why the double pledge was necessary or structured that way beyond being a symbol of commitment.

  *   **Evidence Explained Differently Under Appiah Alone:**
      *   **The Double Pledge:** Under a pure Appiah/honor model, why wasn't a simple pledge *not to bind* sufficient? Why the need for the "won't marry bound feet" component? Appiah might frame it as reinforcing the new honor norm, but it doesn't inherently explain its necessity to overcome the strategic marriage trap. Mackie's theory directly predicts this specific structure.
      *   **Persistence Despite Early Criticism:** Appiah would say early criticism didn't trigger a relevant honor shift. This is reasonable. However, Mackie offers a more concrete explanation: absent coordination, defection was individually irrational regardless of moral views.
      *   **Speed of Collapse:** Appiah attributes speed to the power of the honor shift. Mackie attributes it to the effectiveness of the coordination mechanism dissolving the equilibrium. The pledge societies provide strong evidence for Mackie's mechanism driving the speed.

  **Conclusion:**

  The collapse of footbinding is best understood through the **integration of Appiah and Mackie.** The intense national humiliation of the late 19th century triggered a profound **honor shift (Appiah)**, making footbinding a symbol of national degradation and motivating reformers. However, this motivation alone couldn't overcome the self-enforcing **marriage convention (Mackie)**. The anti-footbinding societies, particularly their ingenious **double pledge**, provided the necessary **coordination mechanism (Mackie)** to dissolve the interdependent expectations holding the practice in place, leading to its rapid demise. While Mackie's convention account provides the most direct explanation for the *mechanism* of collapse (especially the double pledge and its efficacy after failed bans), Appiah's honor thesis is essential for understanding the *motivation* and *cultural meaning* behind the mobilization that made the coordination possible. The case strongly indicates that moral revolutions require more than argument; they require shifts in honor or status that motivate collective action and mechanisms (like coordinated pledges) to overcome strategic interdependencies.
