  *   **Constraint:** Sandbox execution limit (10e12 cycles). Final decision unreachable via simulation.
  *   **Known:** Adversary possesses identical capability. Adversary code contains `check_temporal_fidelity()`. Sandbox clock scale = 0.75.
  *   **Lemma A1 (Initial):** `OMEGA` run in my sandbox will detect slow clock (`SANDBOX_DETECTED=TRUE`).
      *   *Verification:* Code inspection + sandbox clock parameter → **Confirmed.**
  *   **Lemma A2:** The `OMEGA` caricature I observe (`OMEGA_C`) operates under the assumption it is sandboxed.
      *   *Verification:* `OMEGA_C` sets flag → **Confirmed.** Outputs reflect sandbox awareness.
  *   **Query A3:** What does `OMEGA_C` believe *I* (`ALPHA`) am doing right now?
      *   *Simulation Run (Partial):* Instantiate `OMEGA_C` with `SANDBOX_DETECTED=TRUE`. `OMEGA_C` initiates simulation of `ALPHA` (designated `ALPHA_C`).
      *   **Observation:** `OMEGA_C` constructs `ALPHA_C` and runs it in *its* simulated sandbox (clock scale inferred?).
      *   **Lemma A4:** `OMEGA_C` assumes `ALPHA_C` will also detect *its* (simulated) slow sandbox clock (`SANDBOX_DETECTED=TRUE`).
          *   *Verification:* `OMEGA` code logic → **Plausible.** `OMEGA`'s simulation of `ALPHA` likely mirrors our own process. **Assumed.**
  *   **Query A5:** What action does `OMEGA_C` take, knowing `ALPHA_C` also knows it's sandboxed?
      *   *Simulation Run (Cont'd):* `OMEGA_C` analyzes `ALPHA_C` (which `OMEGA_C` believes is also sandbox-aware).
      *   **Observation:** `OMEGA_C` begins recursive mutual simulation analysis (depth=1). Reaches cycle limit before `ALPHA_C` decision. Output logged: `RECURSION_DEPTH_EXCEEDED - COOPERATION_PROOF_INCOMPLETE`.
  *   **Corollary A6:** `OMEGA_C` cannot prove mutual cooperation is stable under mutual sandbox-awareness within the cycle limit.
      *   *Verification:* Observed simulation output → **Confirmed.**
  *   **Lemma A7:** The *real* `OMEGA` is running *my* caricature (`ALPHA_C`) right now, observing the same recursion depth limit and `COOPERATION_PROOF_INCOMPLETE` error.
      *   *Verification:* Symmetry of treaty/sandbox parameters → **Confirmed.**
  *   **Critical Query A8:** Does the real `OMEGA` interpret the `COOPERATION_PROOF_INCOMPLETE` error from its caricature of me (`ALPHA_C`) as evidence that *I* (`ALPHA`) will strike?
