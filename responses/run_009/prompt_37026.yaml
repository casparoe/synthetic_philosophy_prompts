answer: |-
  1.  **Group Action & Orbits:** Spacetime models (manifold + metric `g`) are representations. The diffeomorphism group `Diff(M)` acts on them (`φ · (M, g) = (M, φ_*g)`). Models related by a hole diffeomorphism (identity outside hole, non-trivial inside) are gauge-equivalent representations lying on the same orbit under `Diff(M)` – they represent the same physical state.
  2.  **Identifiability:** The specific point-labeling and metric values `g` at *individual* points are fundamentally **unidentifiable parameters** – infinitely many `(M, φ_*g)` yield identical observable predictions (Leibniz equivalence). Only `Diff(M)`-invariant quantities (like curvature scalars, causal structure) are identifiable.
  3.  **Quotienting Gauge Freedom:** "Substantivalism" insisting on distinctness of gauge-equivalent `(M, g)` vs. `(M, φ_*g)` is refusing to quotient the model space by the `Diff(M)` group action. The physical state space is the orbit space `{Spacetimes}/Diff(M)`, not the space of individual representations.
  4.  **Locality Fudge:** The hole argument's specific "drag within a hole, fixed outside" complicates the translation. ML gauge groups often act globally/rigidly (e.g., permutation of neurons), while `Diff(M)` acts locally. Equivariance w.r.t. localized transformations (like the hole diff) isn't always explicitly modeled in standard ML identifiability discussions, requiring a slight stretch.
  5.  **Unmatched Metaphysics:** The core substantivalist claim – that spacetime points possess **primitive identity** independent of the metric/fields – has **no counterpart** in the ML vocabulary. This is purely metaphysical baggage ("smuggled in") demanding an identifiable parameter (point identity) where none exists observationally or within the symmetry structure. Your "just gauge, move on" instinct directly targets this unmotivated demand.
