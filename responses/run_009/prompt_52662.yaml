prompt: |-
  you're a professional philosopher of mind, the kind who has actual opinions about where cognition stops and the world starts. I want you to think carefully with me here — brainstorm a bit before settling on anything, and feel free to tell me my intuitions are dumb where they're dumb.

  so I've been going through cases about extended cognition / the extended mind thing and I want to know what principle (if any!) captures my gut verdicts. here they are:

  - Otto, the Alzheimer's patient who writes everything in a notebook and consults it constantly, works just like memory for him: the notebook counts as part of his mind. This one feels basically fixed for me.
  - Inga, who just biologically remembers: trivially counts, not interesting.
  - My own shopping list, which I also consult constantly while shopping and would be lost without: does NOT count. And I honestly can't say why it feels so different from Otto's notebook.
  - A Tetris player rotating a piece with the rotate key instead of imagining the rotation first: that keystroke is part of the cognition. Counts.
  - A blind person's cane: I actually think this counts as part of their perceptual system. Something about how it becomes transparent in use.
  - My phone's GPS when I navigate: does not count, even though it's always with me, I trust it completely, and I consult it the way Otto consults the notebook. Rationally I can't defend this verdict but I can't shake it either.
  - A mathematician actively scribbling through a derivation: the paper-hand-brain loop counts as cognitive. The same paper sitting in a drawer at home: obviously not. So it's not the artifact, it's the moment of use? But then what about Otto's notebook between consultations...
  - An old married couple where the husband handles all the social calendar remembering and the wife handles the finances, each treating the other as a reliable external store: I think this counts as a distributed cognitive system, and this verdict feels *easier* than the shopping list one, which is wierd given a spouse is further away than a notebook.

  My tentative principle is something like: it counts when the resource is deeply integrated — trusted, reliably available, deployed automatically without conscious effort. But my shopping list and my GPS meet all of that, and I don't think they count. So either the principle is wrong, or the verdicts are.

  So here's what I want:

  1. Brainstorm out loud for a bit first, then give me at most 2 candidate principles, stated precisely. If the only way to save my Otto-counts-but-shopping-list-doesn't verdict is to gerrymander the principle around exactly those two cases, say so plainly — I'd rather know that than be flattered. Ad hoc clauses are cheating and you should call them out.
  2. Tell me honestly which of my verdicts each candidate principle overturns, and why it's that verdict rather than a different one.
  3. Apply your favored principle to two cases I haven't mentioned: (a) someone with health anxiety who keeps a meticulous symptom diary and genuinely can't interpret their own bodily states without checking it — they say the diary has become how they feel; (b) a writer who says her word processor's autocomplete is now part of how she composes sentences, and she experiences a thought as incomplete until she sees the suggestions.
  4. If you think the whole question is confused at a deeper level — like the objection that something being causally relied on isn't the same as it being part of the cognitive system — then say so, but then tell me what the question I *should* be asking is, and answer that one instead.

  Don't be wishy-washy and don't just list every position ever taken. Pick something and defend it. Thanks in advance, this has been bugging me for weeks.
reasoning: |-
  Okay, let me start by really digging into this user's problem. They're wrestling with the extended mind hypothesis, specifically why some external tools feel like part of cognition while others don't. Their examples are interesting: Otto's notebook counts, but their shopping list doesn't, even though both seem functionally similar. 

  Hmm, the user mentions gut verdicts that conflict with rational justifications. That's a red flag—their intuition might be tracking something deeper than functional parity. Maybe it's about identity or self-constitution rather than just reliability and access. 

  First, I need to unpack why Otto feels different from the shopping list. The Alzheimer's patient relies on the notebook for cognitive continuity—it's literally replacing biological memory. But the shopping list? It's disposable, replaceable. That suggests integration depth matters, but their GPS example contradicts that since it's deeply integrated yet doesn't count for them. 

  Then there's the Tetris player: the keystroke is transparently part of the action-perception loop. Same with the blind person's cane—it's assimilated into sensory apparatus. But the GPS isn't, despite constant use. Why? Maybe because the GPS isn't modifying their perceptual boundaries; it's just giving instructions. 

  The mathematician example is telling—the paper only counts during active use. So temporal coupling is key? But Otto's notebook between consultations still feels cognitive to them. That breaks the "moment of use" idea. 

  The couple case is fascinating. Two people as a distributed system feels right to them, even though spouses are "further away" than a notebook. This hints at shared agency or interdependence beyond mere tool use. 

  Their rejected principle (trust, availability, automatic deployment) fails because the shopping list/GPS meet those criteria. So what's missing? Perhaps normative entrenchment—how failure would feel. Losing Otto's notebook feels like losing memory; losing a shopping list is just inconvenient. 

  Ah, and the health diary case—if it's constitutive of self-perception, that might qualify. The autocomplete example feels iffier; it's augmenting but maybe not fundamentally reconfiguring cognition. 

  User's deeper need seems to be reconciling philosophical rigor with stubborn intuitions. They want principles that don't cheat but might accept overturning some verdicts. I should prioritize Otto/Inga as fixed points and challenge GPS/shopping list. 

  Possible principles: 
  1. Self-constitutive integration (tools that become necessary for maintaining cognitive identity). 
  2. Transparency-as-sensorimotor-extension (only when the tool is perceptually integrated). 

  The first saves Otto, cane, couple, diary; overturns GPS/shopping list verdicts by saying they SHOULD count (but user hates that). The second saves cane, Tetris, math; but wrecks Otto (notebook isn't sensorimotor). 

  Hybrid? Maybe: "Persistent, personalized tools that compensate for cognitive deficits and generate a new mode of access." Still messy. 

  Ultimately, the user might need to bite the bullet: if Otto counts, so does GPS. Or admit that Alzheimer's creates a special case where externalization = self-preservation. But that feels ad hoc. 

  Alternative: distinguish between incorporation (cane) vs. delegation (GPS). Incorporation changes what you can do; delegation just helps. But where's the line? 

  Gah. Philosophy is hard. User's frustration is valid—no principle perfectly captures all intuitions. I'll propose two candidates, be honest about casualties, and suggest the deeper issue is about cognitive ownership versus mere causation.
answer: |-
  Alright, let's dig in. I appreciate the rigor and the willingness to have intuitions challenged. Your case judgments are actually quite common touchstones in the literature, and the tension between Otto and your shopping list is notorious. The fact that you *feel* the difference strongly, even if you can't yet articulate a principle, suggests your intuition might be tracking something real but subtle. Let's brainstorm before landing on principles.

  **Brainstorming:**

  1.  **The "Trust & Reliability" Problem:** Your tentative principle (trusted, reliable, deployed automatically) is a good start – it's essentially Clark & Chalmers' original "trust and glue" criteria (constancy, accessibility, endorsement, past endorsement). But as you note, your shopping list and GPS meet this, yet you reject them. *Why?* Perhaps because they feel like *tools* you *use*, not *parts* of *you*. Otto's notebook feels like it *is* his memory. The difference might lie in **necessity for core cognitive function** or **integration into self-conception**.

  2.  **The Otto/Shopping List Discrepancy:** Why does Otto feel different? Key factors:
      *   **Pathology/Compensation:** Otto *needs* the notebook to function cognitively at a basic level due to a deficit. Your shopping list is a convenience. It compensates for a biological *failure*, not just biological *limits*. This feels like it changes the status.
      *   **Self-Constitution:** For Otto, the notebook isn't just storing information; it's constitutive of his *ability to have beliefs and intentions* at all in a domain. Losing it isn't like forgetting; it's like losing part of his mind. Losing your shopping list is an annoyance. The notebook is woven into his cognitive identity.
      *   **The "Biological Chauvinism" Shadow:** Maybe there's a lurking intuition that cognition *just is* biological, and Otto gets a pass because he *has* to use the notebook. Your shopping list feels optional, hence "less cognitive". But this undermines the whole extended mind project. Is it inconsistent? Possibly.

  3.  **The GPS Problem:** This is fascinating. It meets all the "glue" criteria. Yet you reject it. Why? Perhaps:
      *   **Lack of Transparency/Embodiment:** Unlike the cane (which becomes a sensory extension you *feel through*), the GPS gives you symbolic instructions you *interpret*. It feels more like consulting an oracle than extending your perception. The cane alters your perceptual input; the GPS gives you propositions to believe.
      *   **Cognitive Labor:** The GPS does the *core* computational work (route planning). You just follow instructions. Otto's notebook stores data *he* generated/endorsed; he still does the recall/application. The GPS feels like cognitive *offloading*, not extension.

  4.  **The Tetris Player & Mathematician:** These support the "moment of use"/"looping" idea. The action (key press, scribble) is part of an online sensorimotor or problem-solving loop tightly coupled with perception and action. It's not stored *belief*; it's *process*. The paper in the drawer is inert data, not process.

  5.  **The Couple:** This feels easier because it's *socially distributed cognition*. The reliability and trust are deeply embedded in a shared life and mutual interdependence. It's not just an artifact; it's a *relationship* constituting a shared cognitive system ("the couple knows X"). The shopping list is solitary.

  **The Deeper Hurdle:** You're right to sense the "causal reliance vs. constitutive part" objection. Clark & Chalmers argue that if the external resource plays the *same functional role* as an uncontroversially internal process (like biological memory for Otto), it should count. Critics (e.g., Adams & Aizawa) argue there's an intrinsic "mark of the cognitive" (like intrinsic content or non-derived representation) that external items lack. Your intuitions might be implicitly siding with the critics in some cases (GPS, shopping list) while accepting functional parity in others (Otto, Tetris). **The question you might *really* be asking is: "When does an external resource become *constitutive* of my cognitive processes and my *self* rather than merely being a highly reliable tool I use?"**

  ---

  **Candidate Principles (Stated Precisely):**

  Based on your intuitions and trying to minimize ad-hoc-ness, here are two candidates. I'll favor the first as more defensible, but both overturn some of your verdicts (as any coherent principle likely will).

  1.  **The Compensatory Integration Principle:** An external resource E counts as part of a cognitive system S for agent A *if and only if*:
      *   E is reliably available and automatically deployed by A in relevant contexts (Clark & Chalmers' "glue" conditions), *and*
      *   E's function is to *compensate for a specific, significant impairment or limitation* in A's *biological* cognitive capacity that E replaces or restores, *and*
      *   E's reliable use by A has become *constitutive* of A's ability to perform core cognitive tasks (e.g., forming beliefs, making decisions) in the relevant domain, such that E's failure would result in a *functional cognitive deficit* akin to an internal failure.

  2.  **The Transparency & Process Looping Principle:** An external resource E counts as part of a cognitive system S for agent A *if and only if*:
      *   E is reliably available and automatically deployed by A in relevant contexts, *and*
      *   During active use, E is phenomenologically *transparent* to A (A "sees through" E to the task, like the cane), *and*
      *   E is dynamically coupled with A's internal processes in a tight *feedback loop* that is *necessary for the online completion* of the cognitive task (e.g., perception-action loops in Tetris, real-time derivation in math), rather than merely storing or providing pre-computed results.

  **Analysis Against Your Verdicts:**

  *   **Principle 1 (Compensatory Integration):**
      *   **Saves:** Otto (compensates for memory impairment, constitutive of belief), Blind Person's Cane (compensates for sensory impairment, constitutive of perception), Couple (each compensates for the other's limitations within the coupled system, constitutive of their joint cognitive capacity).
      *   **Overturns:** Your Shopping List (no *impairment* compensated, just convenience), Tetris Player (no impairment compensated, just efficient process), Mathematician's Active Paper (no impairment compensated, just efficient process), GPS (no impairment compensated). *This is a major overturn – Tetris and Math feel like strong cases for extension to many.*
      *   **Why *these* verdicts?** This principle prioritizes *restoring impaired function* as the key to constitutive integration. Convenience tools or process enhancers, no matter how reliable or transparent, don't cross the threshold. The Otto/Shopping List discrepancy is explained by the presence/absence of compensated impairment. The Couple works because each partner compensates for the other's limitations within the system. The GPS fails due to lack of compensated impairment.

  *   **Principle 2 (Transparency & Process Looping):**
      *   **Saves:** Tetris Player (transparent key press in action-perception loop), Blind Person's Cane (transparent sensory extension), Mathematician's Active Paper (transparent scribbling in problem-solving loop), *maybe* GPS if you argue driving with GPS is a perception-action loop (but you intuit not).
      *   **Overturns:** Otto (Notebook isn't "transparent" in the sensorimotor sense; it's consulted, interpreted. No tight *online* feedback loop *during* the cognitive act of recall itself – the recall *is* the consultation. Notebook between consultations clearly not coupled), Your Shopping List (similar lack of tight online looping/transparency), Couple (social distribution doesn't fit the sensorimotor transparency/looping model neatly). *This wrecks Otto, which is your fixed point!*
      *   **Why *these* verdicts?** This principle prioritizes *real-time, embodied engagement* where the tool disappears into the task. Otto's notebook involves deliberate access to stored symbols – it feels more like cognition *using* a resource than the resource *being* the cognition. The Couple involves memory storage/retrieval, not online sensorimotor loops. The GPS involves interpreting instructions, not transparently perceiving space through it. The Shopping List is simple retrieval. This explains why Tetris and Math feel extended – the action *is* the cognition.

  **Honest Assessment:** Neither principle perfectly saves *all* your intuitions without ad-hoc tweaks. Principle 1 saves Otto/Cane/Couple but sacrifices Tetris/Math, which feel like strong cases. Principle 2 saves Tetris/Math/Cane but sacrifices Otto, your fixed point. **Gerrymandering Alarm:** Saving Otto+Inga+Tetris+Cane+Couple+Math while excluding Shopping+GPS *is* extremely hard without being ad-hoc. The most honest path is to either:
  1.  **Accept Principle 1 and overturn your Tetris/Math verdicts** (arguing they are *augmentations* but not *constitutive extensions* of the cognitive system proper), or
  2.  **Modify your Otto intuition slightly** and accept Principle 2 (arguing Otto's notebook is a *cognitive prosthesis* he uses expertly, but not literally *part* of his mind in the same way as transparent sensorimotor extensions), or
  3.  **Seek a hybrid** (see below).

  **Applying Principle 1 (My Favored, Though Imperfect, Choice) to New Cases:**

  *   **(a) Health Anxiety Diary:** **Counts.** *Why?* It compensates for a specific, significant impairment in interoception/bodily awareness (the anxiety disrupts normal feeling). The diary is reliably consulted and endorsed. Crucially, the agent reports it is *constitutive* of how they "feel" – its failure would create a functional deficit in understanding their own state akin to an internal failure. It restores a core cognitive capacity (self-monitoring).
  *   **(b) Writer & Autocomplete:** **Does Not Count (likely).** *Why?* While reliably available and perhaps automatically deployed, it's not compensating for a *specific impairment* (barring something like aphasia). It's augmenting/enhancing a normal capacity (word retrieval/composition). The writer still *initiates* the thought; autocomplete offers suggestions she *evaluates*. Its failure wouldn't create a *deficit* in her core ability to think or form sentences; it would just make composition slower/less fluent. It feels more like a powerful tool than a constitutive part.

  **The Deeper Level & The Better Question:**

  You're right to be suspicious. The core objection is valid: **causal reliance does not equal constitution.** A hammer is causally crucial for driving a nail, but not *part* of my arm. The Extended Mind thesis relies heavily on *functional isomorphism* (if it quacks like a cognitive process...). But your intuitions (Shopping List vs. Otto, GPS) suggest functional parity isn't *sufficient* for something to *be* part of *your mind*.

  **The question you *should* be asking is: "Under what conditions does an external resource become integrated into an agent's cognitive system such that it is *constitutive* of the agent's cognitive capacities and potentially their *self*, rather than merely being a causally crucial tool?"**

  This shifts focus from "is it cognitive?" (which can be interpreted narrowly as "does it process information?") to "is it *part of me as a cognitive agent*?". This incorporates notions of **personal identity, ownership, and the boundaries of the cognitive self.** Otto's notebook is constitutive of *his* beliefs and thus *him* as a cognitive agent. Your shopping list isn't *you*. The GPS tells *you* where to go; it's not *your* sense of direction. The cane becomes *part of* the blind person's perceptual apparatus – their sensory *self* extends to its tip. The Tetris key press is *your* action in the loop of *your* problem-solving. The math scribbles are *your* thoughts made concrete in a looping process.

  **Answering the Better Question (using a Constitutive Integration view):** An external resource becomes constitutively integrated when:
  1.  **Reliable Dependency:** It's a persistent, reliably available resource automatically deployed in relevant contexts.
  2.  **Functional Incorporation:** It plays a role functionally analogous to an uncontroversially internal cognitive process *for that specific agent*.
  3.  **Self-Constitutive Role:** Its reliable use is necessary for the agent to maintain or exercise core cognitive capacities (belief, intention, perception, etc.) in a way that shapes their cognitive identity. Failure causes a *loss of cognitive function* specific to that agent, not just inconvenience.
  4.  **(Optional but common) Personalized Entrenchment:** The resource is individualized or tailored to the agent (Otto's specific notebook, the blind person's specific cane, the couple's specific partner).

  This view saves Otto, Inga, Cane, Couple, and Health Diary. It *might* save Tetris/Math if argued the *action* is constitutive of the online process (though 'self-constitutive' is weaker here). It consistently excludes Shopping List and GPS as conveniences not constitutive of the agent's core cognitive self. It's less about *cognition* being extended and more about the *cognitive agent* being constituted by integrated resources. This, I think, best captures the root of your intuitions.
