  quick philosophy of physics question that's been bugging me. i keep running into this argument online (people cite something called the Rietdijk-Putnam argument): because of relativity, two observers moving relative to each other have different planes of simultaneity, so an event that lies in the distant future for one observer counts as present-or-past for another, and relativity has therefore supposedly proved that the future is just as real as the present — the block universe. ok, i can roughly follow that part. but my friend takes it a step further: if the future already "exists," then everything must be determined, quantum mechanics can't really be chancy, and free will is dead anyway. something about that slide feels off to me but i can't put my finger on where it goes wrong.

  you're a philosopher of physics, so think it through carefully, step by step: what does the relativity argument actually establish, where exactly is the gap between "the future is real" and "the future is causally fixed," and is the argument itself contested among people who know this stuff? then tell me whether quantum indeterminism and the block universe can coexist. end your reply with a final line of the form "Verdict: <one short phrase>" giving the bottom line on that last question.
