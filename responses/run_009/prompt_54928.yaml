  But here's where the user's friend goes wrong. The block universe doesn't imply determinism. Determinism means that the state of the universe at one time fixes its state at all other times. But relativity itself doesn't dictate the dynamics—it's a framework for spacetime structure. The laws of physics operating within that spacetime could be deterministic or indeterministic. 

