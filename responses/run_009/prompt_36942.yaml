prompt: |-
  I'm the chair of the design review board at a mid-size company that makes both consumer electronics and implantable medical devices -- same engineers, same test labs, very different consequences if something fails inside a person versus inside a kitchen. Our gate reviews are 30 minutes, weekly, and the recurring fight is always about the word "know." An engineer presents the test data and says we know the part meets spec; someone from risk management says no, we don't know, we have to re-run the fatigue tests on another batch and add an inspection step; and half the time the only difference between the two statements is what the part is going INTO -- the evidence is identical. Meanwhile we can't use "know" loosely in the submission documents to the regulator but can use it freely in the internal engineering report, and a junior engineer recently asked, seemingly naively, whether the word means something different in the two documents, which honestly stopped the meeting for a good five minutes.

  I've been reading a bit about epistemology on the side -- something about how whether you count as knowing something can depend on what's at stake, and about how the meaning or standards of "knows" can shift with the conversational setting -- and it struck me that our board is implicitly operating on some theory here without ever writing it down, and probably not a consistent one. So I'd like you to act as a professional epistemologist who consults on practical decision procedures. First brainstorm a little: lay out what the philosophy actually says that's usable here -- does it license demanding more evidence when stakes go up even though evidence is unchanged, or does it only license being more careful about when you SAY "know," or does it conflate knowledge with being justified in acting? Then turn whatever survives into an actual procedure the board can run inside a review: an ordered checklist of questions, what counts as a sufficient answer at each step, where the procedure terminates in a "yes, approved," where it forces more evidence, and where it must stop and hand the call to a human because the remaining question is one of values or risk appetite rather than facts -- mark those points explicitly, I don't want false precision.

  Then run the procedure on three concrete cases so we can see it work and see it break: (1) a battery seal that passed all standard tests, going into a consumer speaker; (2) the exact same seal and same data, but going into an implantable pump where a leak means surgery to replace it; (3) a firmware fix that fixed a known crash bug in a home device, where demanding more evidence is cheap but adds weeks, and a marketing person insists the fix is "known safe" because nothing like it has ever failed before -- that third one I expect the procedure to answer in a way marketing won't like, and I want to see that. Also please be upfront about where the procedure will misfire: for instance where our stakes classifications will turn out to have been wrong in hindsight, or where someone could game the checklist to manufacture a "known." And tell me honestly whether the philosophy itself is actually settled enough that the procedure follows from it, or whether the procedure is just one reasonable operationalization among several -- if a colleague insists that knowledge can't literally depend on stakes and that we're just sneaking decision theory in the back door, I want to know if the procedure survives that objection or has to be rebuilt on different ground. Think carefully and don't just give me textbook definitions -- I need the thing my board can actually print out and use next Tuesday.
reasoning: |-
  Okay, let me unpack this request. The user chairs a design review board at a company making both consumer electronics and medical implants, and their core problem revolves around the epistemic weight of the word "know" in different contexts. The stakes dramatically change how evidence is treated despite identical test data, causing recurring conflicts. 

  Hmm, the user has clearly done their homework - they're referencing contextual epistemology (DeRose, Fantl & McGrath) and pragmatic encroachment, recognizing that their board is implicitly applying philosophical concepts without formal structure. Their frustration is palpable: they need an operational solution by next Tuesday, not theory. Three pain points stand out: regulatory language constraints, junior staff confusion about contextual meaning shifts, and the marketing pressure in case (3).

  The key insight here is that the board isn't really debating knowledge - they're negotiating action thresholds under uncertainty. So the solution must decouple three layers: (1) evidence quality assessment (objective), (2) knowledge attribution (contextual speech act), and (3) approval decisions (risk-managed action). 

  For the procedure design, I'm considering a triage approach: first screen evidence sufficiency separately from stakes, then combine them only at the approval stage. That prevents conflation. The checklist should force explicit declarations of "what failure looks like" and "who bleeds if it fails" - medical device people always think in failure modes, so this language will resonate. 

  Anticipating pushback: the hardline objector who says "knowledge is stakes-invariant" has a point philosophically, but practically speaking, the procedure can reframe "know" as "sufficiently warranted for purpose X" without ontological claims. The real vulnerability is gaming - like defining "minor inconvenience" as the worst outcome for a medical device to lower evidence bars. Safeguard: make severity classification a pre-approved matrix locked before evidence review.

  For the test cases: Case (1) is straightforward - consumer device, standard evidence clears bar. Case (2) identical evidence but implantable device triggers the "severity override" path to demand more testing. The friction point is case (3): marketing's "known safe" based on no prior failures. Here the procedure should flag absence of negative evidence ≠ positive evidence, especially when failure consequences include lawsuits. Marketing won't like requiring stress testing, but that's the point - the procedure must bite sometimes.

  Final note: I'll position this as one defensible operationalization (not the only one), citing Hawthorne's bank cases to show contextualism has traction. But the disclaimer box will warn that if regulators audit, they'll want fixed evidence thresholds for medical submissions regardless of this internal tool. Practical philosophy means knowing when to stop being philosophical.
answer: |-
  Here's an actionable epistemology-based review procedure designed for your Tuesday meeting, followed by concrete test cases and philosophical transparency:

  **Core Philosophical Principles Applied:**
  1.  **Pragmatic Encroachment (Hawthorne, Stanley, Fantl & McGrath):** Whether an agent *counts as knowing P* can depend on the *practical stakes* of being wrong. Higher stakes raise the evidential threshold for knowledge attribution.
  2.  **Contextualism (DeRose, Lewis):** The meaning (standards) of "knows" shifts with the *conversational context*. "Know" in a regulatory submission ≠ "know" in an internal engineering chat.
  3.  **Action-Justification Link (Williamson, Rysiew):** Saying "we know P" often functions as asserting that P is *sufficiently justified to act upon* given the context. Knowledge claims are often performative.
  4.  **Distinction:** This *does not* mean the *truth* of P or the *raw evidence* changes with stakes. It means the *warrant required* to *reasonably claim knowledge* or *act decisively* does. We demand more evidence when stakes are high because the *cost of being wrong* is higher.

  **The Design Review Epistemic Procedure (DREP) Checklist:**
  *(Run sequentially for each design element under review)*

  1.  **Define P:** What specific claim is being made? (e.g., "The battery seal meets spec XYZ under operating conditions ABC")
      *   *Sufficient Answer:* Clear, testable, single-sentence proposition. *If unclear, stop and refine.*
  2.  **Assess Raw Evidence:** What objective data supports P? (Test reports, simulations, calculations, prior art)
      *   *Sufficient Answer:* Documented, relevant data meeting predefined *minimum* test protocols for the *object type* (e.g., seal, firmware, circuit). *If insufficient min evidence, loop back for more.*
  3.  **Classify Failure Consequence (Stakes):** What is the *severity* and *probability* of harm if P is false?
      *   *Use Predefined Matrix:*
          *   **Class 1 (Low):** Minor inconvenience, property damage < $X, no injury (e.g., speaker stops working).
          *   **Class 2 (Medium):** Significant property damage, minor reversible injury, regulatory fines (e.g., kitchen fire risk).
          *   **Class 3 (High):** Severe injury, irreversible harm, death, major regulatory action, existential company risk (e.g., implanted device failure).
      *   *Sufficient Answer:* Consensus classification using matrix. *No consensus? Escalate immediately to designated exec (values/risk appetite decision).*
  4.  **Context Check:** Where will the claim "We know P" be used?
      *   A) Internal Engineering Report / Discussion
      *   B) Regulatory Submission / Legal Documentation
      *   *Sufficient Answer:* Select context A or B. *If B, automatically proceed to Step 5b.*
  5.  **Determine Warrant Sufficiency:**
      *   **5a. If Context A (Internal) & Stakes Class 1/2:** Is the evidence from Step 2 *objectively sufficient* for internal confidence and action *given the stakes*? (Does it meet standard practice?)
          *   *Sufficient Answer:* "Yes" by majority vote. *Yes -> Approved. No -> More Evidence.*
      *   **5b. If Context B (Regulatory) OR Stakes Class 3 (Regardless of Context):** Does the evidence from Step 2 meet the *elevated warrant threshold*? (e.g., extra test batches, longer durations, specific inspections, FMEA coverage, independent review)?
          *   *Sufficient Answer:* "Yes" by majority vote *and* verification against a pre-agreed checklist of elevated requirements for Class 3/Regulatory. *Yes -> Approved. No -> More Evidence.*
  6.  **Approve Claim & Action:**
      *   If Approved at Step 5: Document the claim ("P is supported for [Context] at [Stakes Class]") and approve the design element for the next phase.
      *   *Terminate Procedure for this element.*

  **Key Features:**
  *   **Decouples Evidence Assessment (Step 2)** from **Stakes Classification (Step 3)** and **Context/Use (Step 4)**.
  *   **Explicit Stakes Matrix:** Removes subjectivity from consequence assessment (pre-defined externally).
  *   **Forces Context Declaration:** Acknowledges "know" means different things internally vs. regulatorily.
  *   **Elevated Thresholds Triggered:** By High Stakes (Class 3) *or* Regulatory Context – *not* by the raw evidence itself.
  *   **Human Values Gate:** Only at Stakes Classification (Step 3) if consensus fails.
  *   **Clear Exit Points:** "More Evidence," "Approved," "Escalate."
  *   **Avoids Absolute "KNOW":** Focuses on "supported for context/stakes" and actionability.

  **Test Cases Run Through DREP:**

  1.  **Battery Seal for Consumer Speaker:**
      *   P: "Seal meets IP67 spec after thermal cycling."
      *   Evidence: Passed standard 3-batch thermal cycle test. (Sufficient Min Evidence)
      *   Stakes: **Class 1** (Speaker fails - minor inconvenience).
      *   Context: **A (Internal)**. Engineer wants to say "we know it meets spec."
      *   Warrant Sufficiency (5a): Evidence meets standard practice for Class 1/2 & Internal context? **YES**.
      *   **Result: APPROVED.** "Know" acceptable internally.

  2.  **Same Seal/Data for Implantable Pump:**
      *   P: Identical.
      *   Evidence: Identical (Passed standard test).
      *   Stakes: **Class 3** (Leak requires surgery - severe harm).
      *   Context: **A (Internal)** or potentially B later.
      *   Warrant Sufficiency (5b - triggered by Class 3): Does standard test meet *elevated* threshold for Class 3? (e.g., requires 5 batches, 2x cycles, specific microscopy? Likely **NO**).
      *   **Result: MORE EVIDENCE.** Elevated tests required *even for internal discussion* because stakes are high. Claiming "know" internally *without* elevated evidence is unjustified pragmatically. Risk Management wins.

  3.  **Firmware Fix for Home Device (Marketing: "Known Safe"):**
      *   P: "Firmware fix resolves crash bug without introducing new critical failures."
      *   Evidence: Fix tested on dev unit; bug is gone; no *obvious* new issues; "Nothing like it ever failed before."
      *   Stakes: **Class 2** (Device crash could cause frustration, potential data loss, minor safety issue if device controls something critical? *Needs classification!* Assume Class 2).
      *   Context: **A (Internal)** for now (marketing claim).
      *   Warrant Sufficiency (5a): Is "bug gone on dev unit + no prior failures *of this type*" sufficient for Class 2 Internal? **Likely NO.**
          *   *Why?* Absence of prior failures ≠ evidence *this* fix is robust. Standard software practice for a crash bug fix requires regression testing, stress testing on multiple hardware lots, potentially boundary testing - *especially* if marketing wants to claim "known safe," implying higher confidence. The low cost of more testing (weeks) is outweighed by the risk of a new bug in a field update (support costs, reputation). Marketing's argument confuses lack of negative evidence with positive evidence of safety.
      *   **Result: MORE EVIDENCE.** (Regression/stress testing required). Marketing won't like the delay, but DREP shows their claim lacks sufficient warrant for the stakes/context. "Known safe" requires more proof than "seems to work."

  **Where It Can Misfire & Limitations:**

  1.  **Stakes Misclassification:** If Class 3 is misclassified as Class 2 (or vice versa), the procedure applies the wrong warrant threshold. *Mitigation:* Rigorous, pre-defined stakes matrix; periodic review of matrix with real-world failure data.
  2.  **Gaming the System:**
      *   *Downplaying Stakes:* Arguing a medical device failure is only "medium" risk. *Mitigation:* Independent review/audit of stakes classifications; clear definitions linking harm types to classes.
      *   *Overloading "P":* Making P overly vague ("It's safe") to avoid scrutiny. *Mitigation:* Strict enforcement of Step 1 (Define P precisely).
      *   *Lowering "Min Evidence":* Setting base protocols too low. *Mitigation:* Base protocols set by independent standards bodies or senior technical consensus.
  3.  **Cost-Benefit Blind Spot:** DREP focuses on warrant, not resource optimization. Demanding extreme evidence for a trivial low-stakes claim might pass DREP but be wasteful. *Mitigation:* Stakes matrix should implicitly reflect reasonable cost/benefit; "More Evidence" decision should consider practicality *if* min evidence is met (Step 5a allows this discretion).
  4.  **Novel Risks:** May fail to trigger elevated warrants for unprecedented failure modes not captured in the stakes matrix. *Mitigation:* FMEA process feeding into stakes definitions; "precautionary principle" escalation path.

  **Philosophical Grounding & The Objection:**

  *   **Is it "Real" Knowledge?** Your colleague is partially right. Traditional invariantism says knowledge *itself* doesn't change with stakes – only our *attribution* or *required justification for action* does. DREP **sidesteps this debate entirely** by being operational.
  *   **What DREP Actually Does:** It's a **pragmatic decision procedure** for when it is *warranted to act as if P is true* and *warranted to claim "we know P" in a specific context*. It *uses* insights from contextualism and pragmatic encroachment to set *procedural thresholds* for action and speech, without making metaphysical claims about the nature of knowledge.
  *   **Surviving the Objection:** DREP survives because it doesn't claim that the *factual proposition P* becomes less true in the kitchen vs. the body. It claims that the *level of evidence required to justify a high-consequence action or a strong assertion to a regulator* is higher. This is uncontroversially sound decision theory/risk management *inspired* by epistemology, not a literal redefinition of knowledge. If your colleague insists "knowledge is stakes-invariant," reply: "This isn't about ontology, it's about warranted assertability and action under risk. We call that 'knowing' *for our purposes* internally, but we need stricter rules when lives are on the line or regulators are listening."
  *   **Settled Philosophy?** No. Contextualism vs. Invariantism vs. Pragmatic Encroachment is actively debated. DREP is a **reasonable operationalization** of the *pragmatic insights* from this debate, tailored for engineering risk management. It's one defensible approach, not the only one.

  **Recommendation for Tuesday:**
  1.  **Adopt the Stakes Matrix (Class 1/2/3)** - Define it rigorously *before* implementing DREP.
  2.  **Define "Min Evidence" Protocols** for key component types.
  3.  **Define "Elevated Evidence" Protocols** for Class 3/Regulatory contexts.
  4.  **Pilot DREP** on the next 2-3 reviews. Focus on the structure: Define P -> Evidence Check -> Stakes Class -> Context -> Apply Threshold.
  5.  **Ban Unqualified "Know":** Mandate phrases like "Supported for [Stakes Class] in [Context]" or "Meets warrant for action in Class X" in meeting minutes/reports. Reserve "known to meet spec" only for *after* DREP approval for the relevant context/stakes.

  This turns the philosophical insight into a concrete, defensible, and auditable process that directly addresses the "know" fights by making the implicit standards explicit and stakes-dependent.
