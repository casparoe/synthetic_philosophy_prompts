prompt: |-
  In a philosophy of mathematics course I'm taking, the instructor keeps reaching for the same analogy to motivate nominalist fictionalism: mathematical discourse is supposed to be like literary fiction. On this picture, saying that there are infinitely many primes is like saying that Sherlock Holmes solves crimes in London — true in an important and perfectly respectable sense, but true *within the story*, not true in the sense that commits you to anything existing. My housemate, who absorbed this with enthusiasm, is now using the analogy to argue a specific point against our professor's platonism: since nobody thinks we must posit a population of fictional Victorian detectives in order to explain why it is useful or enjoyable to speak as if Holmes existed, we equally have no need to posit abstract objects — numbers, sets, functions — to explain the success of mathematics, including its applications in physics and engineering. On his view, the platonist is just someone who has mistaken a magnificent, indispensable fiction for an inventory of what there is, and we can keep doing all the arithmetic and Fourier analysis we like while declining the ontological bill.

  I'm suspicious that the analogy is doing more work than it can carry, but I can't quite pin down where. Please audit it properly. First, give me the explicit correspondence table: in the comparison between mathematics and fiction, what is supposed to play the role of the author, the canon or text, the reader, and truth-in-the-story as opposed to plain truth — and, crucially, what is the analogue of the utility we get from fiction, given that mathematics is allegedly indispensable to our best scientific theories in a way that stories about detectives are not? Second, lay out where the mapping breaks: fictions are authored, dated, and revisable, while mathematical truths seem to be discovered, necessary, and not up for retconning; Doyle can contradict himself without catastrophe, while an inconsistent axiom system trivializes everything provable in it; fictional claims are ingested under an explicit pretense, while mathematicians and physicists seem to assert their claims flat out. Third, tell me which of these disanalogies actually matter for my housemate's conclusion and which are merely colorful. Does the claim that we can use mathematics without believing in numbers survive once the differences between the two halves of the analogy are on the table, or was the analogy carrying the conclusion the whole time? And if the fiction analogy fails, is there a better one available to the nominalist — the rules of a game, a measurement convention, a useful myth — that does the job my housemate needs done?
reasoning: |-
  Hmm, the user is taking a philosophy of mathematics course and their instructor keeps using the literary fiction analogy to motivate nominalist fictionalism. Their housemate has enthusiastically adopted this analogy to argue against platonism, claiming that just as we don't need to believe in Sherlock Holmes to enjoy detective stories, we don't need to believe in abstract mathematical objects to use mathematics effectively. The user is skeptical about whether this analogy actually holds up and wants me to properly audit it.

  This is an interesting philosophical challenge. The user wants me to systematically examine this analogy between mathematics and fiction. Specifically, they want me to: 1) create an explicit correspondence table showing what elements in mathematics correspond to the author, canon/text, reader, truth-in-story, and utility in fiction; 2) identify where the analogy breaks down (like how fiction is authored and revisable while math seems discovered and necessary); and 3) determine which disanalogies actually threaten their housemate's argument against platonism.

  I need to carefully unpack this analogy. For the correspondence: in mathematics, the "authors" would be mathematicians collectively over time; the "canon" would be axiomatic systems and established theorems; the "readers" would be mathematicians, scientists, and engineers who use math; "truth-in-story" would be derivability from axioms; and the "utility" would be predictive power and modeling efficiency in science.

  But the disanalogies are significant. Fiction is subjective and revisable - Doyle can change Holmes's backstory without consequence. Math is different; contradictions collapse entire systems. People approach fiction with conscious pretense, while mathematicians genuinely believe their claims. Mathematical truths seem necessary and discovered, not invented.

  For the housemate's argument, the crucial question is whether these differences undermine the core claim that we can use math without ontological commitment. The utility disanalogy matters most - math's indispensability in science seems different from fiction's entertainment value. The necessity and discovery aspects might be problematic but don't directly affect the "use without belief" position.

  The fiction analogy might be doing too much heavy lifting here. Better nominalist analogies might include formal games (like chess rules), measurement conventions, or useful myths - though each has limitations. The game analogy captures rule-based necessity but misses applied utility. Measurement conventions handle applied math but struggle with pure mathematics.

  Ultimately, while the fiction analogy is evocative, its breakdowns in necessity, revisability, and especially in utility and indispensability weaken it significantly. The housemate might retain the core nominalist position without this specific analogy, but they'd need to address why math works so well if it's "just fiction" - perhaps through modal or pragmatic accounts. The analogy isn't entirely carrying the conclusion, but it obscures important challenges that nominalists must confront head-on.
answer: |-
  Here's a thorough audit of the literary fiction analogy for mathematical fictionalism, addressing your queries step-by-step:

  ### 1. Explicit Correspondence Table
  | **Literary Fiction Component** | **Mathematical Analog (Fictionalist View)** | **Key Notes** |
  |-------------------------------|--------------------------------------------|---------------|
  | **Author**                    | Mathematicians (collectively/historically) | Not a single creator, but a community establishing axioms/rules over time. |
  | **Canon/Text**                | Axiomatic systems, theorems, proofs       | E.g., Peano Arithmetic, ZFC set theory. Defines the "world" of the fiction. |
  | **Reader**                    | Mathematicians, scientists, engineers     | Users who engage with the mathematical "story" for understanding or application. |
  | **Truth-in-the-Story**        | Derivation/provability within the system | "There are infinitely many primes" is true *if* we accept PA axioms, just as "Holmes lives on Baker St." is true *if* we accept Doyle's narrative. |
  | **Plain Truth (Ontology)**    | Concrete, physical reality               | What exists *independently* of human constructs. Neither Holmes nor numbers inhabit this realm. |
  | **Utility of Fiction**        | **Modeling, prediction, conceptual organization** | Fiction: Emotional insight, social critique, entertainment. Mathematics: **Enabling scientific theories, engineering design, data compression.** This is the *indispensability* claim. |

  ### 2. Where the Analogy Breaks Down (Disanalogies)
  - **Authorship & Discovery**:  
    Fiction is consciously invented (Doyle *created* Holmes). Mathematics feels *discovered* (primes' infinitude seems inevitable, not arbitrary). Fictionalists must argue mathematical "authors" are *stipulating rules*, not describing realities.  
    **→ Threat to Analogy:** High. Challenges the "felt objectivity" of math.  

  - **Revisability & Necessity**:  
    Doyle can retcon Holmes (e.g., change his backstory) without logical collapse. Math axioms can't be freely revised without catastrophic consequences (e.g., rejecting induction makes PA useless). Mathematical truths appear *necessary* (2+2=4 couldn't be otherwise); Holmes could have lived elsewhere.  
    **→ Threat:** High for revisability (math's interconnectedness resists "retcons"). Moderate for necessity (fictionalists may deny modal realism).  

  - **Consistency Sensitivity**:  
    Fiction tolerates contradictions (e.g., Doyle misremembering a character's eye color). Math explodes under inconsistency (an inconsistent system proves *every* statement).  
    **→ Threat:** Critical. Math's utility *depends* on consistency; fiction's does not.  

  - **Assertoric Force & Pretense**:  
    Fiction is consumed under explicit pretense ("let's imagine..."). Mathematicians/physicists assert "There are prime numbers > 10^100" as flat-out true. Scientists embed math in theories describing reality (e.g., "The electron has spin 1/2").  
    **→ Threat:** High. Challenges whether fictionalism captures actual practice.  

  - **Utility & Indispensability**:  
    Fiction's utility is psychological/cultural; it's replaceable (other stories could fill similar roles). Math is claimed *indispensable* to our *best* scientific explanations (e.g., quantum mechanics requires Hilbert spaces). Engineering relies on math for *accurate prediction*.  
    **→ Threat:** Highest. This is the core of the platonist's "indispensability argument" (Quine-Putnam).  

  ### 3. Which Disanalogies Matter for Your Housemate's Conclusion?
  - **Critical Threats**:  
    - **Indispensability & Utility**: If math is *instrumentally indispensable* to science in a way fiction isn't (e.g., predicting Higgs boson mass), platonists argue this *requires* positing abstract objects. Fictionalists must explain utility without ontology (e.g., via conservative extension or pragmatic pretense).  
    - **Consistency Sensitivity**: Math's fragility under inconsistency suggests it's tracking *structural constraints* beyond mere storytelling.  
    - **Assertoric Practice**: If scientists are *literally asserting* mathematical claims, fictionalism may misdescribe their commitments.  

  - **Less Critical Threats**:  
    - **Authorship/Discovery**: Fictionalists can bite the bullet ("discovery" is just exploring consequences of rules).  
    - **Necessity**: Nominalists often reject modal realism anyway.  

  **Does the conclusion survive?**  
  The analogy *alone* cannot carry the conclusion. While fictionalism remains a coherent position, the disanalogies—**especially regarding indispensability and consistency**—force the nominalist to provide *additional* arguments to rebut platonism. Your housemate's core claim ("we can use math without believing in numbers") *can* survive, but **only if** they address:  
  1. **The Quine-Putnam Indispensability Argument**: E.g., via Field's program (show math is *conservative* over nominalist physics) or Yablo's figuralist pretense.  
  2. **Assertoric Practice**: Explain why scientists *seem* to assert mathematical truths (e.g., as useful metaphorical language).  

  The fiction analogy is evocative but risks obscuring these harder challenges.

  ### 4. Better Analogies for Nominalism?
  - **Formal Games (Chess)**:  
    - *Pros:* Rules are arbitrary but necessary for play; "The king moves one square" is "true-in-chess" without ontologically committing to kings. Math as rule-governed symbol manipulation.  
    - *Cons:* Misses math's *representational* role in science (chess doesn't describe electrons).  

  - **Measurement Conventions (e.g., Celsius)**:  
    - *Pros:* "Water boils at 100°C" is true by stipulation, useful for science, but doesn't commit to Celsius as a "real" property. Math as a universal calibration tool.  
    - *Cons:* Fails for pure math (e.g., large cardinal axioms with no physical application).  

  - **Useful Myths (e.g., Newtonian gravity)**:  
    - *Pros:* "Force = mass × acceleration" was empirically successful yet false (in light of GR). Math could be a "false but useful" model.  
    - *Cons:* Platonists argue math *isn't* falsified like empirical theories—it's *preserved* in theory change (e.g., calculus in relativity).  

  **Strongest Alternative: Modal Structuralism (Hellman)**  
    - *Analogy:* "There are infinitely many primes" means "**If** there were any ω-sequence satisfying PA, **then** primes would be infinite in it."  
    - *Pros:* Avoids abstract objects; captures necessity & consistency-sensitivity.  
    - *Cons:* Commits to modal logic (possibly equally problematic).  

  ### Conclusion
  The fiction analogy is **pedagogically useful but philosophically fragile**. It highlights how discourse can be "truth-apt" without ontology, but its breakdowns—especially regarding indispensability, consistency, and scientific practice—mean it cannot *alone* defeat platonism. Your housemate needs supplementary arguments (e.g., from parsimony, epistemology, or nominalist reconstructions of science). Better nominalist analogies exist (e.g., games or modal conditionals), but all face challenges. The analogy doesn't *carry* the conclusion; it dramatizes it, leaving the heavy lifting to deeper metaphysical work.
