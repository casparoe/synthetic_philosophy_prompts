  2) Stress-test experiments (e.g., craft inputs that trigger same features but different circuits)  
  3) A tiered detection framework (features for screening, interventions for confirmation)  

  *winces* The hardest part will be getting the camps to collaborate instead of fighting. The interventionists might dismiss circuit theorists as "playing with graphs," while circuit folks see ablation as crude. They'll need leadership to frame this as integration, not competition.  

