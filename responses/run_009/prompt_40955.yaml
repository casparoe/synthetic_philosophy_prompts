prompt: |-
  At my lab we do mechanistic anomaly detection — roughly, trying to flag when a model does something via a mechanism we haven't vetted, instead of one we've already checked is fine. The team has been stuck for months on what counts as the "same mechanism," and I mean really stuck, whiteboard-fight stuck. One camp says it's about features: if the same set of features fires on the new behavior as on the vetted one, same mechanism, full stop. Second camp says features are too shallow — two behaviors could use the same features in different causal arrangements, so what really matters is the curcuit: same abstract causal graph, even if exact weights and token positions differ. Third camp says both are missing it and the only criterion that matters is interventional: ablate the pathway you validated and check whether the new behavior degrades the same way; if yes, same mechanism. I honestly can't tell anymore whether we're disagreeing about the world or just about how to use the word "mechanism." You're a philosopher of science who works closely with ML researchers — think carefully about this, maybe brainstorm for a moment before answering. Diagnose the disagreement for me: is it verbal, or is there a hidden empirical question lurking (e.g., whether feature-level and circuit-level descriptions of these models ever actually come apart), or are the camps implicitly answering different questions because they each care about catching different kinds of anomalies? And given your diagnosis, tell me what would count as progress — a distinction, an experiment, whatever — or whether we should just expect this to stay stuck, and why.
reasoning: |-
