  Ah, here's the crux: each camp is optimizing for different failure modes. The user hasn't considered that yet. Maybe they're all "right" for specific anomalies:  
  - Feature drift → catches hacked inputs  
  - Circuit divergence → catches internal rewiring  
  - Intervention mismatch → catches pathway hijacking  

  *scribbles mentally* The verbal dispute is real—they're using "mechanism" ambiguously—but beneath it lies empirical questions like: Do features and circuits ever decouple in practice? Could a model reuse features for malicious purposes without changing circuits? 

  For progress, they need:  
