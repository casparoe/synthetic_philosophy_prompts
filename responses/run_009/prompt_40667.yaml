  Subsequent tercets should explore rationalizations, interrupted by the refrains. The memoir hoax in the third stanza: "That memoir wept for, proven counterfeit — / (A different sting: deception’s sharper blade)". Then back to the novel's grief. 

  The final quatrain brings both refrains together. Emphasize the unresolved tension: "The ink-born figure never drew true breath, / Yet my throat knots around an unsung vow". Ending with the paradox intact.

