answer: |-
  Below is a decision tree designed to resolve disagreements about historical periodization (e.g., Middle Ages, Renaissance, Scientific Revolution) by forcing clarity on underlying commitments. It starts from the agreed-upon fact of significant intellectual changes in Europe (1300–1700) and walks through **6 branch questions** addressing core tensions (e.g., non-European applicability, continuity, teleology). Each question is phrased neutrally, requiring no prior knowledge of historiographical "isms."  

  The tree outputs **5 coherent leaves**, including the 4 requested positions and 1 rare hybrid. Crucially, it flags where positions *cannot* be distinguished observationally (boundary-revisionist vs. pragmatist). Answers to the cases you debated with M. (Song China, scholasticism, etc.) are embedded in the branch nodes.  

  ---

  ### **Decision Tree: Are "Middle Ages/Renaissance/Scientific Revolution" Real Divisions?**  
  *Start here: "I accept major intellectual changes occurred in Europe between ~1300–1700."*  

  #### **Branch 1: What best describes a historical period?**  
  - **A** → A *biological species*: Real joints in nature, discoverable even if mislabeled.  
  - **B** → A *county line*: Conventional, useful for maps but not inferred from terrain.  
  - *Why?* Tests if periods are ontological realities or human tools.  

  #### **Branch 2 (if A): Do significant continuities (e.g., scholastic universities) across conventional boundaries embarrass your view?**  
  - **A** → Yes: Continuities undermine the break → **Proceed to Branch 3**.  
  - **B** → No: Continuities are exceptions or shrink the period but don't refute it → **Proceed to Branch 4**.  
  - *Why?* Addresses whether "Renaissance" is invalidated by unbroken medieval traditions.  

  #### **Branch 3 (if 2A): Should we redraw boundaries or abandon the label?**  
  - **A** → Redraw: The clustering is real, but lines are wrong → **Leaf: Boundary-Revisionist**.  
  - **B** → Abandon: Continuities prove no meaningful break exists → **Proceed to Branch 6**.  
  - *Why?* Forces a choice: fix the model or scrap it.  

  #### **Branch 4 (if 2B): Does "medieval vs. Renaissance" apply meaningfully to Song China/Islamic Golden Age?**  
  - **A** → Yes: It reveals a universal pattern → **Leaf: Hard Discontinuist** (breaks are real and roughly conventional).  
  - **B** → No: It’s Eurocentric like time zones → **Proceed to Branch 5**.  
  - *Why?* Tests if periodization is exportable or parochial.  

  #### **Branch 5 (if 4B): Should outcomes we care about now (e.g., science "winning") determine boundaries?**  
  - **A** → Yes: History is a path to the present; teleology is unavoidable → **Leaf: Hard Discontinuist** (boundaries match "what mattered").  
  - **B** → No: That’s presentist distortion; use contemporary significance → **Leaf: Boundary-Revisionist** (redraw to avoid teleology).  
  - *Why?* Forces engagement with presentism. If boundaries are real but Eurocentric, they may still be valid *for Europe* (A) or need revision (B).  

  #### **Branch 6 (if 1B OR 3B): Are these labels useful despite being constructs?**  
  - **A** → Yes: They organize ideas, even if arbitrary → **Proceed to Branch 7**.  
  - **B** → No: They distort more than clarify → **Leaf: Eliminativist** (retire the terms).  
  - *Why?* Separates pragmatists (tools can be useful) from eliminativists.  

  #### **Branch 7 (if 6A): If historians retired these labels, would it be...**  
  - **A** → ...a discovered fact? → **Leaf: Boundary-Revisionist** (labels mislead about reality).  
  - **B** → ...a changed convention? → **Leaf: Pragmatist/Toolbox** (instruments updated).  
  - **C** → ...changed priorities? → **Leaf: Pragmatist/Toolbox** (tools reflect our interests).  
  - *Why?* Reveals if you see labels as answerable to reality (A) or as conventions/values (B/C).  

  ---

  ### **Leaves (Final Positions)**  
  1. **Hard Discontinuist**:  
     - Breaks are real, boundaries ~correct. Ignores non-Europe? Valid if teleological (Branch 5A).  
     - *Path:* 1A → 2B → 4A *or* 1A → 2B → 4B → 5A.  

  2. **Boundary-Revisionist**:  
     - Clustering is real, but conventional boundaries are wrong. Redraw to fit continuity (2A→3A) or avoid Eurocentrism/teleology (4B→5B).  
     - *Path:* 1A → 2A → 3A *or* 1A → 2B → 4B → 5B *or* 1B → 6A → 7A.  

  3. **Pragmatist/Toolbox**:  
     - Periods are useful conventions, not "real." "Misleading" = poor tool (B/C), not false (A).  
     - *Path:* 1B → 6A → 7B or 7C.  

  4. **Eliminativist**:  
     - Terms distort reality (e.g., hide continuities, impose Eurocentrism). Retire them.  
     - *Path:* 1A → 2A → 3B → 6B *or* 1B → 6B.  

  5. **Hybrid: Revisionist-Pragmatist** (rare):  
     - Boundaries are both wrong *and* arbitrary. Labels are salvageable only if radically redrawn.  
     - *Path:* 1A → 2A → 3A → [Later reject "real breaks" via Branch 7B/C]. Coherent but unstable.  

  ---

  ### **Key Observations**  
  - **Boundary-Revisionist vs. Pragmatist cannot be separated observationally** (as you suspected). Both may redraw periods, but the *why* differs:  
    - Revisionist believes a real cluster was mislabeled.  
    - Pragmatist updates a tool for better utility.  
    *The tree exposes this via Branch 7: only Revisionists treat labels as falsifiable (7A).*  

  - **Unattractive/Unheld Position**: A "Hard Discontinuist" who admits periodization fails for non-Europe (Branch 4B) *and* rejects teleology (Branch 5B) is incoherent. If breaks are real but only visible in Europe *and* boundaries shouldn't align with modern outcomes, the position collapses.  

  - **Rare Hybrid**: The Revisionist-Pragmatist (Leaf 5) is coherent but rare; it requires believing periods are real *until* redrawn, then arbitrary. Most settle into Revisionism *or* Pragmatism.  

  This tree forces disagreements about "what kind of thing" a period is (ontology) before debating boundaries. By embedding your cases (e.g., Branch 4 = Song China, Branch 2 = scholasticism), it prevents talking past "what changed" and instead targets *why we label*.
