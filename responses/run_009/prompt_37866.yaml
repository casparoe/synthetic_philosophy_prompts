   1. Knowledge account (KA): assert only what you know.
   2. Truth account (TA): assert only what is true.
   3. Reasonable/justified belief account (RBA): assert only what you have a justified/reasonable belief in.
   4. Belief/sincerity account (BA): assert only what you believe (regardless of truth or justification).

   We also note that some cases might not cleanly discriminate (e.g., KA and RBA agree except in Gettier cases). We have to be honest about where the quiz can't discriminate and leave some as "unclassified".

   Cases to cover:
   - Lottery: very probably true, no knowledge (e.g., "Your ticket is a loser" in a fair lottery with one winner and a million tickets).
   - Gettier: justified true belief without knowledge (e.g., looking at a stopped clock that happens to show the right time).
   - Selfless assertions: asserting what you don't believe because the evidence points that way (e.g., a detective who doesn't believe the suspect is innocent but the evidence clearly shows it).
   - Chaste/therapeutic assertions: asserting something you don't believe for a good reason (e.g., a doctor telling a scared patient that they will be fine, even though the doctor believes otherwise).
   - Retraction: whether you should retract an assertion that was false even if you were justified at the time.

   Also, one question to probe the distinction between proper assertion and blameworthiness: e.g., the nervous swimmer who truthfully yells "shark!" without knowing (so the assertion is true, but does the speaker need to know?).

   We want 8-10 questions. Each question is a case with 2-3 answer options. We also want one question where one answer is obviously bad (to catch inattention).

   Let's design the questions:

   Question 1: Lottery Proposition
   Case: It's a fair lottery with 1 million tickets, and only one winner. You hold one ticket. I look at your ticket and say, "Your ticket is a loser." I don't have any insider information, I just know the odds. In fact, your ticket is a loser.
