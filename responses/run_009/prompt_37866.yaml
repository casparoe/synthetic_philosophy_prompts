  ### Which Norm of Assertion Do You *Actually* Hold?  
  A Case-Based Sorting Quiz  

  **Instructions:** For each scenario, select the answer that best reflects your judgment. There are no trick questions—except maybe one. Answer honestly!  

  ---

  #### Question 1: Lottery Loser  
  A fair lottery has 1 million tickets, and only one winner. You hold a ticket. I say, "Your ticket is a loser," based solely on the odds (I have no insider info). *Your ticket is indeed a loser*.  
  - A) My assertion was **proper**.  
  - B) My assertion was **improper**.  

  #### Question 2: Stopped Clock  
  I glance at a clock that stopped 12 hours ago. It shows 3:00 PM, and I assert, "It’s 3:00 PM." *By sheer luck, it is exactly 3:00 PM*.  
  - A) My assertion was **proper**.  
  - B) My assertion was **improper**.  

  #### Question 3: Selfless Detective  
  A detective has overwhelming evidence that a suspect is innocent (e.g., alibis, DNA). Despite her personal gut feeling the suspect is guilty, she asserts, "The suspect is innocent" to her team. *The suspect is innocent*.  
  - A) The assertion was **proper**.  
  - B) The assertion was **improper**.  

  #### Question 4: Therapeutic Lie  
  A patient panics before a minor, low-risk procedure. To calm them, a doctor says, "This won’t hurt at all," *though she believes it might*. Unexpectedly, the patient feels no pain.  
  - A) The doctor’s assertion was **proper**.  
  - B) The doctor’s assertion was **improper**.  

  #### Question 5: Nervous Swimmer  
  I’m swimming when I see a dark shape. Panicked, I yell, "Shark!" without good reason (it could be a dolphin). *It turns out to be a shark*.  
  - A) My assertion was **improper and I’m blameworthy**.  
  - B) My assertion was **improper, but I’m not blameworthy** (due to panic).  
  - C) My assertion was **proper because it was true**.  
  - D) My assertion was **proper because I believed it**.  

  #### Question 6: False Weather Report  
  Yesterday, I saw dark clouds and said, "It will rain today," based on solid meteorological evidence. *It didn’t rain*. Today, you ask if I stand by my claim.  
  - A) I **should retract** because my assertion was false/incorrect.  
  - B) I **should not retract** because I was justified when I spoke.  

  #### Question 7: Delusional Math  
  I firmly believe 2 + 2 = 5 (I ignore all evidence to the contrary). I assert, "2 + 2 = 5."  
  - A) My assertion was **proper because I believe it**.  
  - B) My assertion was **improper because it’s false**.  
  - C) My assertion was **improper because I lack justification/knowledge**.  

  #### Question 8: Broken Clock, Wrong Time  
  I check a normally reliable clock. It shows 3:00 PM, so I assert, "It’s 3:00 PM." *Unbeknownst to me, the clock is broken—it’s actually 4:00 PM*.  
  - A) My assertion was **proper**.  
  - B) My assertion was **improper**.  

  ---

  ### Scoring Key  
  Follow these steps to find your norm:  

  1. **Check Question 7 (Delusional Math):**  
     - If you chose **A**, skip to Step 4 (you’re likely a **Belief Theorist**).  
     - If you chose **B**, skip to Step 5 (you’re likely a **Truth Theorist**).  
     - If you chose **C**, proceed to Step 2.  

  2. **Check Questions 1, 2, and 8:**  
     - If you answered **B, B, B** → You’re a **Knowledge Theorist** (assert only what you *know*).  
     - If you answered **A, A, A** → You’re a **Justified Belief Theorist** (assert only what you *reasonably believe*).  
     - If mixed → Proceed to Step 3.  

  3. **Check Question 6 (False Weather Report):**  
     - If you answered **A** → Leans **Knowledge or Truth**.  
     - If you answered **B** → Leans **Justified Belief or Belief**.  
     - **Still mixed?** Your answers are **unclassified**—you might align with Jennifer Lackey’s "selfless assertion" view or a hybrid position.  

  4. **Belief Account (Assert what you *believe*):**  
     - Likely if you chose **A in Q7** + **D in Q5** + **A in Q8**.  
     - If not fully consistent: You lean Belief but might have quirks (e.g., you separate propriety from blame in Q5).  

  5. **Truth Account (Assert only *truths*):**  
     - Likely if you chose **B in Q7** + **C in Q5** + **A in Q3 and Q4**.  
     - If not fully consistent: You lean Truth but might excuse assertions in high-stakes scenarios (e.g., Q5).  

  ### Why This Sorting Works  
  - **Knowledge vs. Justified Belief:** They agree except in Gettier cases (Q2) and lottery cases (Q1). Knowledge forbids both; justified belief allows them.  
  - **Truth vs. Others:** Truth is the only norm that approves of "selfless" (Q3) and "therapeutic" (Q4) assertions *when true*.  
  - **Belief vs. Justified Belief:** They agree on most cases but clash in Q7 (delusional assertion) and Q5 (panic assertion).  
  - **Blame vs. Propriety (Q5):** Only this question probes whether you separate moral blameworthiness (e.g., panic) from whether the assertion violated a norm.  
  - **The "Trap" (Q7):** Option A is the Belief Theorist’s answer—*no one else* would pick it. If someone does, they’re either a true believer or not paying attention!  

  ### References to Test  
  - **Knowledge Account:** Williamson (2000), DeRose (2002)  
  - **Truth Account:** Weiner (2005)  
  - **Justified Belief Account:** Lackey (2007), Kvanvig (2009)  
  - **Belief Account:** Bach (2008)  
  - **Edge Cases:** "Selfless assertion" (Lackey), "Shark!" excusability (Williamson), retraction debates (Turri 2016).  

  Good luck with the talk! Your linguist flatmate’s annoyance is a small price for philosophical clarity. 😉
