prompt: |-
  A friend of mine got really into ethics this year and I've been keeping a running list of her verdicts on cases, mostly ones where you can add up welfare across different people. Her track record so far:

  - Surgeon secretly kills one healthy patient to harvest organs and save five: totally wrong, even though five-for-one is a big net gain in welfare
  - Diverting a runaway trolley from five people onto a side track where it kills one: fine, she'd pull the lever
  - Forcing one person to undergo a painful bone marrow extraction to save a stranger with leukemia, no consent: wrong, even though the donor fully recovers and the recipient lives
  - Mandatory vaccination that gives everyone a day of flu-like symptoms but prevents a deadly outbreak among the elderly: fine, obviously
  - A small tax on everyone in a rich country to pay for life-saving treatment for a few who can't afford it: fine
  - Using a lottery to decide which of two equally deserving patients gets the single ICU bed: fine, better than deciding by which doctor happens to be on shift
  - The state making you save for your own retirement instead of spending it all now: fine, since its the same person's welfare being traded off across their own life
  - Handing over basically all resources to a "utility monster" who gets astronomically more pleasure from everything than anyone else does: no, you shouldn't give the monster everything

  Next week we're arguing about a new case from her actual town: the city wants to put a slightly polluting, noisy waste facility in one particular neighborhood — its the only geologically suitable spot — which would give a million residents marginally cheaper and cleaner waste disposal while imposing a small but real health burden on the five thousand people who live there. Compensation is being offered but the neighborhood itself voted against it. Predict her verdict. Honestly I care less about the answer than the reasoning: I can see at least two or three rules that fit everything on her list (something about never intending harm to a particular individual, something about whether burdens are fairly shared or consented to, maybe something about whether the benefits and burdens land on the same people or different ones). Lay out those candidate rules, say what each predicts about the facility case, give me your best guess with the reason for preferring it, and tell me what further case would best split the rules apart.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've provided a list of ethical verdicts from their friend and want to predict her stance on a new case involving a waste facility. The user is more interested in the reasoning behind the prediction than the answer itself. They mention possible rules like not intending harm, fair sharing of burdens, consent, and whether benefits and burdens affect the same people.

  First, I need to analyze each of the friend's past verdicts to identify patterns. The surgeon case involves intentionally killing one to save five, which she deems wrong. The trolley problem allows diverting harm, which she accepts. The bone marrow extraction without consent is wrong, while mandatory vaccination is fine. Taxes for healthcare are acceptable, as is a lottery for ICU beds. Forced retirement savings is okay since it's the same person. The utility monster is rejected despite net gains.

  Looking for common threads, consent seems crucial in cases like bone marrow and the surgeon. But in vaccination and taxes, consent isn't individual, yet she approves. That suggests implied consent or societal benefit might play a role. Fair distribution is another angle—lottery and taxes spread burdens, while the utility monster doesn't. The retirement case is intrapersonal, which she accepts, contrasting with interpersonal harm.

  For the waste facility, the neighborhood voted against it, so consent is missing. But compensation is offered, and it benefits many. Comparing to past cases, the lack of consent might be decisive, similar to the bone marrow case. However, mandatory vaccination had no consent but was okay. The key difference might be direct harm to a specific group versus general societal rules. The facility targets a specific neighborhood without their agreement, which might align more with the bone marrow scenario than vaccination.

  Possible rules could be: 1) No intentional harm without consent. 2) Burdens must be fairly distributed. 3) Intrapersonal vs. interpersonal trade-offs. Rule 1 fits surgeon, bone marrow, and possibly the facility. Rule 2 fits vaccination, taxes, lottery. Rule 3 explains retirement savings. 

  The waste facility involves intentional harm to a specific group without consent, so Rule 1 predicts opposition. Rule 2 might support it if burdens are shared, but the neighborhood is singled out, so maybe not. Rule 3 doesn't apply since it's interpersonal. 

  A test case could be seizing a car from one person to save multiple lives via organ transport. Rule 1 would oppose it (no consent, intentional harm), while Rule 2 might allow it if fair, but since it targets one person unfairly, probably not. This could help distinguish between Rules 1 and 2.
answer: |-
  Based on your friend's pattern of verdicts, her ethical framework likely prioritizes **consent, avoiding targeted harm to specific individuals, and fairness in distribution** over pure welfare maximization. Here's the breakdown of candidate rules, their predictions for the waste facility, my best guess, and a test case:

  **Candidate Rules & Their Fit:**

  1.  **"No Intended Harm to Identifiable Individuals Without Consent":**
      *   **Fits:** Surgeon (intentional killing), Bone Marrow (intentional infliction of pain without consent). Explains *why* Trolley is different (harm is redirected, not *intended* for the one; the lever-puller's primary intent is to save the five).
      *   **Predicts for Facility:** **Opposition.** The harm (health burden) is intentionally imposed on the *specific, identifiable* 5,000 residents of this neighborhood without their consent (they voted against it). Compensation doesn't negate the intended imposition of harm.
      *   **Weakness:** Doesn't cleanly explain why Mandatory Vaccination is fine (harm *is* intentionally imposed on identifiable individuals without specific consent; it's a societal mandate). Also, the Trolley case involves *foreseen* harm to an identifiable individual.

  2.  **"No Non-Consensual, Targeted Bodily Invasion/Severe Harm":**
      *   **Fits:** Surgeon (bodily invasion/killing), Bone Marrow (bodily invasion/pain). Explains why Vaccination is fine (bodily invasion is minimal, temporary, and widely shared; harm is very low severity). Explains why Trolley is fine (no direct bodily invasion by the actor; harm is external/accidental).
      *   **Predicts for Facility:** **Likely Opposition.** While not a direct bodily invasion like surgery or extraction, the health burden is a direct, targeted imposition of physical harm onto the *bodies* of a specific group without their consent. It's closer to Bone Marrow than Vaccination in terms of targeting and consent.
      *   **Weakness:** The line between "severe harm" (Bone Marrow) and "imposition of lesser burden" (Vaccination, Taxes) is fuzzy. The facility's health burden likely falls between these.

  3.  **"Fair Distribution of Burdens/Benefits & Procedural Justice":**
      *   **Fits:** Vaccination (burden shared by all for collective benefit), Tax (burden shared progressively - likely - for benefit of vulnerable), Lottery (fair procedure for scarce resource), Rejecting Utility Monster (grossly unfair distribution, violates equality). Explains why Surgeon/Bone Marrow are wrong (unfairly target one person as a *mere means*).
      *   **Predicts for Facility:** **Opposition.** The burden is concentrated unfairly on one specific neighborhood (5,000 people) while the benefits (cheaper, cleaner disposal) are diffused across a much larger group (1 million). The procedural injustice of overriding their vote despite compensation compounds the unfairness.
      *   **Weakness:** Doesn't inherently explain the Trolley case's permissibility (burden is *very* unfairly concentrated on the one). Also, the Retirement case fits here (forced saving is arguably fair to one's future self), but it's intrapersonal.

  4.  **"Intrapersonal vs. Interpersonal Trade-Offs":**
      *   **Fits:** Retirement Savings is explicitly fine *because* it's trading off within one life. Surgeon/Bone Marrow/Trolley/Utility Monster involve sacrificing one *person* for others.
      *   **Predicts for Facility:** **Opposition.** This is clearly an interpersonal trade-off: sacrificing the welfare of the 5,000 for the benefit of the 1,000,000.
      *   **Weakness:** Too simplistic. Doesn't explain *why* some interpersonal trades are acceptable (Trolley, Vaccination, Tax) while others are not (Surgeon, Bone Marrow, Utility Monster). Needs another rule layered on top.

  **Synthesis & Best Guess Prediction:**

  Your friend likely uses a **combination of Rules 1, 2, and 3.** Her framework emphasizes:
  *   **Strong protection against using specific individuals as mere means without consent,** especially involving bodily harm or severe imposition (Rules 1 & 2).
  *   **Acceptance of policies imposing diffuse burdens for collective good if procedurally fair and avoiding severe/targeted harm** (Rule 3).
  *   **Rejection of pure aggregation when it violates fairness or individual rights** (Utility Monster, Surgeon).

  **Prediction for Waste Facility: She will say it's WRONG.**

  *   **Reasoning:** The case has strong parallels to the *Bone Marrow* scenario: a specific, identifiable group (the neighborhood) is *targeted* to bear a significant health burden without their consent (they voted no) for the diffuse benefit of a much larger group. While the harm might be less severe than bone marrow extraction, it's a real, imposed health cost on their bodies/lives. Compensation doesn't erase the lack of consent or the unfair concentration of the burden. Overriding their vote adds procedural injustice. This violates the core principle of not sacrificing identifiable individuals/communities as mere means. The *Vaccination* case differs because the burden is (1) very minor/temporary, (2) *universally* shared (not targeted), and (3) often involves implicit societal consent/paternalism for public health.

  **Best Test Case to Split the Rules:**

  **The "Transplant Car" Case:** A brilliant surgeon needs a specific, rare car part *immediately* to reach the airport and fly to save 5 dying patients across the country. The *only* compatible part is in your friend's beloved, irreplaceable vintage car parked outside. Taking the part destroys the car's value. The surgeon offers compensation, but your friend refuses. Authorities seize the part anyway, destroying the car. The surgeon saves the 5 patients. Net welfare gain is huge (5 lives vs. one destroyed car + emotional distress). Compensation is paid.

  *   **How it Splits the Rules:**
      *   **Rule 1 (Intended Harm w/o Consent):** Predicts **WRONG.** Specific, identifiable harm (car destruction/distress) intended and imposed without consent.
      *   **Rule 2 (Bodily Invasion/Severe Harm):** Predicts **???** Less clear. It's property/emotional, not direct bodily harm. Might lean WRONG if "severe harm" includes major property loss/distress, or OK if strictly bodily.
      *   **Rule 3 (Fair Distribution/Procedure):** Predicts **WRONG.** Highly unfair burden concentrated on one person as a mere means, overriding their refusal. Similar to Bone Marrow/Surgeon in targeting.
      *   **Rule 4 (Interpersonal):** Predicts **WRONG** (sacrificing one for many).
      *   **Your Friend's Likely Verdict (based on pattern):** **WRONG.** It perfectly mirrors the core objection: using a specific, non-consenting individual as a mere resource (their property) for the greater good, despite compensation and net gain. It's essentially the Surgeon/Bone Marrow logic applied to property. This distinguishes it from Vaccination/Taxes (diffuse burdens) and Trolley (redirecting existing threat). **If she surprisingly said OK,** it would strongly favor Rule 3 with a very low threshold for "severe harm" or Rule 2 excluding property, making her framework much more consequentialist than her other verdicts suggest.
