prompt: |-
  I'm on the governance committee of a community land trust — we own about 60 homes plus some shared land in a mid-sized city, roughly 400 resident-member households, and around 150 "legacy" members who inherited or kept shares after moving away, some of whom now live in other states. We have to decide by next month who gets to vote in a referendum: a developer has offered to buy air rights over part of our land and put up a six-story building, and the money would fund repairs we otherwise can't afford, but the building will shadow a bunch of our units and change the neighborhood.

  The problem is the membership list wasn't drawn up with this in mind. The residents obviously think they vote. The legacy members say they're the legal members and their grandkids are on the waitlist for these homes, so their stake is generational. The tenants renting trust units (not members, just leases) say they'll live in the shadow of the thing. A few waitlist families want in. The neighbors across the street, who aren't members of anything, have shown up to two meetings angry. And a local environmental group has formally petitioned for either a vote or a designated proxy seat "on behalf of future generations."

  One guy on our committee is pushing the view that the demos is everyone affected by the decision — which, he admits with a shrug, seems to include the future residents of the new building itself, and he can't tell if that's a reductivo of his view or just the obvious conclusion. The rest of us lean toward "whoever's actually governed by the trust's rules," which conveniently means members only, maybe too conveniently.

  Draft the memo I'll circulate before our Thursday meeting: recommend a concrete rule for this referendum — who votes, with what weight if any — and if you can, a standing rule for future ones. Engage the boundary question honestly rather than just citing our bylaws at people, and make sure the strongest version of the losing side gets a fair shake, not a strawman. No citations or reading lists, we need something the committee can actually vote on. Also bear in mind whatever we decide here becomes precedent when someone eventually proposes dissolving the trust entirely and cashing out everyone's shares — that fight is coming in a few years whether we like it or not. (sorry for the typos btw, typing this on my phone in the parking lot before work)
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on the governance committee of a community land trust (CLT) facing a referendum on selling air rights. The immediate issue is deciding who gets to vote, but there are deeper layers here.

  First, the stakeholders: resident-members, legacy members (some out-of-state), tenants, waitlisted families, neighbors, and an environmental group claiming future generations. The committee is torn between "affected parties" and "governed members." Plus, there's a looming precedent for future dissolution votes.

  Hmm... the user's memo needs to balance practicality with philosophical fairness. They explicitly want no strawman arguments, so I must represent the "affected parties" view robustly. The legacy members' generational stake is valid, but residents' daily lives are directly impacted. Tenants are affected physically but have no ownership. 

  Wait—the key tension is between legal boundaries (bylaws) and moral boundaries (impact). The user hinted that hiding behind bylaws feels "too convenient." So the memo can't just default to membership; it must acknowledge the moral weight of impact while proposing a workable solution. 

  Also, the dissolution precedent is critical. If they include non-members now, it sets a risky precedent for cash-out votes later. But excluding everyone outside membership might seem unjust when shadows affect tenants and neighbors. 

  I recall CLT principles emphasize preserving community control for residents. Legacy members have financial stakes, but residents are the CLT's purpose. Tenants—while affected—don't share the same long-term stakes. The environmental group's "future generations" angle feels noble but legally nebulous. 

  Practical constraints: The referendum is next month. They can't overhaul bylaws now. So the memo must offer a bylaw-compliant approach that still feels ethically considered. Weighted voting? Too messy. Splitting votes? Unprecedented. 

  Ah—here’s the core: prioritize resident voices while respecting legacy members' formal role. Residents get full votes; legacy members get reduced but meaningful weight (e.g., 1/2 vote). This addresses both impact and ownership. Tenants/waitlist/neighbors get consultation but not votes. Future dissolution would follow the same logic, preventing outsider sway. 

  ...And I should flag that dissolution would require supermajority approval. That protects against cash-out risks later. 

  *Pauses* Did I capture the "strongest version" of the opposing view? Yes—by admitting non-voters' moral claims and offering formal input channels. The memo avoids citations but roots the logic in CLT ethos: resident well-being as paramount. 

  Final check: The user’s stressed ("parking lot typing"). The memo must be clear, decisive, and action-oriented. No jargon. Just: "Here’s why, here’s how, vote Thursday."
answer: |-
  **MEMORANDUM**  
  **TO:** Governance Committee Members  
  **FROM:** [Your Name], Governance Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Proposed Voting Rule for Air Rights Referendum & Standing Procedure  

  ### I. Context  
  The developer’s air rights proposal presents significant trade-offs: critical funding vs. quality-of-life impacts. Given the diversity of claims (residents, legacy members, tenants, waitlist families, neighbors, environmental groups), we must define voting boundaries that are **principled, practical, and precedential**. Our bylaws grant voting rights to members only, but legitimacy requires engaging the ethical question: *Whose interests must this decision balance?*  

  ### II. Recommended Rule for This Referendum  
  **1. Voting Eligibility:**  
     - **Resident-Members (400 households):** Full voting rights.  
       *Rationale:* Directly governed by CLT rules, bear daily impacts (shadow, neighborhood change), and align with the CLT’s mission of resident-controlled stewardship.  
     - **Legacy Members (150 households):** Half-weight votes (e.g., 1 vote = 0.5).  
       *Rationale:* They hold legal shares and generational stakes (e.g., waitlisted grandchildren), but lack direct, current exposure to impacts. Half-weight respects their formal role while centering affected residents.  

  **2. Non-Voting Stakeholders:**  
     - **Tenants:** No vote, but guaranteed formal consultation.  
       *Rationale:* While directly affected, they lack ownership stakes or governance roles under our bylaws. Their input must inform the committee’s final recommendation to voters.  
     - **Waitlist Families/Neighbors/Environmental Groups:** No vote.  
       *Rationale:* Future residents’ interests are mediated through legacy members; external groups lack contractual or legal standing. Environmental "future generations" claims are addressed via legacy members’ intergenerational stake.  

  **3. Process Safeguards:**  
     - Host a **pre-referendum town hall** where all stakeholders (tenants, neighbors, environmental reps) present testimony documented for voters.  
     - Distribute **impact summaries** (shadow maps, financial projections) to all voters 10 days pre-vote.  

  ### III. Standing Rule for Future Referendums  
  - **Default Voting Eligibility:**  
    - Resident-members: Full vote.  
    - Legacy members: Half-weight vote.  
  - **Exceptions:**  
    - For votes on **dissolution or asset liquidation**, require **supermajority approval (67%)** of *both* resident and legacy members, treating legacy votes as full weight.  
      *Why?* Dissolution risks mission drift; this ensures broad consensus while acknowledging legacy members’ financial stakes.  
    - For votes with **direct, material impacts beyond the CLT footprint** (e.g., rezoning adjacent land), expand town hall input but *do not* expand voting.  

  ### IV. Engaging the Boundary Question  
  - **The "Affected Parties" Argument (Strong Version):**  
    If democracy demands that all impacted voices shape decisions, why exclude tenants who’ll live in the shadow, or neighbors facing traffic changes? The developer’s future residents also endure construction and define the area’s character. This view challenges us to ask: *Is our CLT a private corporation or a community institution?*  
    - **Counterpoint:** While morally compelling, this approach is operationally unworkable. "Affected" is infinitely expandable (e.g., future generations citywide). It risks diluting member sovereignty and could invalidate our legal structure. Our bylaws exist to bind the decision community to enforceable standards.  

  - **The "Governed Parties" Argument (Strong Version):**  
    Voting must align with accountability. Only members face the CLT’s binding rules, financial liabilities, and long-term consequences. Legacy members’ shares represent deferred residency rights—their voice isn’t abstract.  
    - **Counterpoint:** Strict membership voting may feel exclusionary when non-members (e.g., tenants) experience tangible harms. Ignoring them risks reputational damage and alienating partners.  

  ### V. Why This Approach?  
  1. **Balances Principles:** Centers resident well-being (core to CLTs) without disenfranchising legacy investments.  
  2. **Manages Precedent:** For future dissolution votes, the supermajority+full-weight rule prevents legacy members from overpowering residents.  
  3. **Practical:** Uses existing membership lists; avoids legal challenges to voter eligibility.  
  4. **Honest Engagement:** Acknowledges non-voters’ moral claims via mandated consultation, separating input from decision rights.  

  ### VI. Motion for Thursday’s Vote  
  > *"Resolved: For the air rights referendum, voting will be limited to current resident-members (1 vote/household) and legacy members (0.5 votes/household). A standing rule will adopt this eligibility for future referendums, with dissolution votes requiring a 67% supermajority of both groups (legacy votes at full weight). Non-member stakeholders will receive formal consultation rights."*  

  Let’s debate this Thursday with the goal of a clear, defensible standard. We cannot please everyone—but we can ensure the process is ethically grounded and sustainable.  

  ---  
  **Approach Rationale:** This framework prioritizes resident voices while honoring legacy stakes, avoids overcomplication, and preempts dissolution risks. The half-vote compromise acknowledges legitimacy concerns without enabling minority control. Consultation mechanisms address inclusion without undermining governance.
