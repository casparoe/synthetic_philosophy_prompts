prompt: |-
  Something I've never gotten a straight answer on: what does discounting in government cost-benefit analysis actually presuppose about the value of future people's lives?

  So the practice, as I understand it: when an agency appraises a project with long-run effects — a flood barrier, a nuclear waste facility, climate policy — it discounts future costs and benefits. A benefit arriving in 2100 gets multiplied down by some rate per year, so a death prevented in 2100 counts for a fraction of a death prevented today. The stated justification for the rate is usually a mix of things: money now can be invested, so a dollar today is worth more than a dollar later; future people will be richer, so an extra dollar means less to them; and then usually a leftover chunk called something like the "pure" rate of time preference, which is just... future welfare counts less because it's later. The famous fight a while back over climate economics was basically about whether that pure chunk should be zero or a few percent per year, and the choice swung the whole appraisal of climate policy.

  What I find puzzling is that the practice seems internally messy in ways nobody acknowledges. Some guidance uses a rate that declines over the horizon — high for the next few decades, then stepping down — which is hard to square with any single story about why we discount at all. Health effects are sometimes discounted at a different rate than the money costs of producing them. And the same governments publish sustainability language saying we owe future generations consideration, while the arithmetic of appraisal steadily shrinks whatever they'd get out of our projects.

  So here's my question: if you take the practice seriously as a philosophical object rather than a technical convention, what theory of value does it presuppose? Is the discount meant to operate on welfare itself — later people just matter less — or only on units like money and health-years, via their wealth, in which case anything whose value doesn't track wealth (species survival? avoiding extinction?) arguably shouldn't be discounted at all, or maybe should be discounted negatively since future people will be richer but not more numerous? Can the declining-rate schedules be derived from any coherent view, or are they best read as a political compromise between an ethical camp (pure preference is indefensible) and an economic one (opportunity cost is real), stitched together so nobody has to win the argument? And the part I most want: if a government genuinely adopted a zero pure time preference, how would appraisal actually change — would far-century benefits just dominate everything, and would that be a reductio of the ethics or of the method? Please distinguish what the practice strictly needs from what it merely happens to fit with; I suspect alot of the discounting machinery is held together by ambiguity between "money is worth less to the rich" and "later lives are worth less, period," and I want to know whether that ambiguity is load-bearing.
reasoning: |-
  Okay, let me try to unpack this user's question. They're really digging into the philosophical underpinnings of discounting in government cost-benefit analysis (CBA). The core of their confusion seems to be about what discounting implies for the value of future lives. They mention practices like declining discount rates and different rates for health effects, which they see as internally inconsistent. 

  First, I need to recall the standard justifications for discounting: opportunity cost of capital, diminishing marginal utility of consumption, and pure time preference. The user is particularly troubled by pure time preference—the idea that future welfare counts less just because it's in the future. They point out the tension between sustainability rhetoric and discounting practices that diminish future benefits.

  The user's deeper question is about the theory of value behind discounting. Do we discount welfare itself, or just monetary units? If it's the latter, then things like species survival shouldn't be discounted. They also wonder if declining rates are a political compromise rather than a coherent approach. And they're curious about what zero pure time preference would do to CBAs—would future benefits overwhelm present costs?

  I should start by addressing the ambiguity between discounting money versus welfare. The standard Ramsey formula combines both elements, but in practice, governments often don't separate them clearly. This blurring allows different interpretations, which might be why the inconsistency isn't widely acknowledged. 

  For non-market goods like species survival, the issue is tricky. If we discount only because future people are richer, then such goods might not need discounting. But in practice, they're often discounted anyway. Declining discount rates can be framed as hedging against uncertainty, but as the user suspects, they might also be a compromise between ethical and economic views.

  Zero pure time preference would indeed make long-term benefits like climate policies more valuable in CBAs. But it wouldn't necessarily lead to absurd outcomes if combined with other discounting components. Still, the user's point about discounting implying future lives matter less is valid—it's an uncomfortable ethical implication that practitioners might avoid confronting directly.

  The user seems well-versed in the topic, possibly an academic or policy analyst frustrated by the lack of philosophical clarity. They want to know if the ambiguity is load-bearing, meaning if resolving it would break current practices. The answer is probably yes—the ambiguity allows different stakeholders to accept CBAs without agreeing on first principles. Clarifying it might force uncomfortable ethical choices.
answer: |-
  That's an exceptionally sharp dissection of a deeply fraught issue. You've pinpointed why discounting feels philosophically "messy" – because it *is*, often masking fundamental ethical choices beneath technical jargon. Let's unpack the presuppositions, tensions, and implications:

  1.  **The Core Ambiguity (and What It Presupposes):**
      *   **Discounting Money vs. Discounting Welfare:** This is the central tension. The practice *formally* discounts monetary values or quantifiable units (like QALYs - Quality-Adjusted Life Years). The *stated justification* often blends:
          *   **Opportunity Cost of Capital (OCC):** Money invested today grows. This discounts *money*, not welfare itself. A $1B project today *could* have become $1.5B in 20 years if invested elsewhere. The discount rate reflects this forgone return.
          *   **Diminishing Marginal Utility of Consumption (DUC):** Future people are expected to be richer. An extra dollar (or unit of consumption) yields less welfare (utility) to them than the same dollar would yield to a poorer person today. This discounts the *welfare value* of monetary/consumption units *because* of rising wealth. It does *not* inherently devalue future lives *per se*.
          *   **Pure Time Preference (PTP):** Welfare experienced in the future is valued less *simply because it occurs later*. This *directly* discounts *welfare itself*, implying future lives/well-being matter less *intrinsically*.
      *   **What It Presupposes:** Standard practice **presupposes that welfare is primarily derived from consumption/wealth**, and that the discount rate applied to monetary flows implicitly captures the discounting of the *welfare* those flows generate. However, it **blurs the line between discounting money (OCC) and discounting welfare (DUC + PTP)**. This ambiguity *is* load-bearing. It allows practitioners to avoid explicitly stating that PTP devalues future lives, hiding behind the "objective" OCC and the seemingly less controversial DUC.

  2.  **The Problem of Non-Market Goods (Species, Existence Value):**
      *   This exposes the ambiguity. If the *only* reason for discounting is OCC and DUC (future wealth), then goods whose value **doesn't depend on the recipient's wealth** arguably *shouldn't be discounted*, or even discounted *negatively*.
          *   **Species Survival/Existence Value:** My welfare from knowing tigers exist doesn't depend much on my income. Future generations might value it similarly or more (due to scarcity/awareness). Discounting it at a positive rate based on OCC/DUC makes little sense. A case could be made for *no discounting* or even *negative discounting* (if we believe future generations will value biodiversity *more*).
          *   **Avoiding Extinction:** The value of human survival is arguably infinite or at least not tied to per-capita wealth in a discountable way. Discounting the cost of extinction would be ethically monstrous. Standard CBA struggles profoundly here.
      *   **Practice vs. Theory:** In practice, agencies often *do* discount these impacts at the standard rate, revealing the underlying PTP assumption or simply applying a mechanical rule. This inconsistency highlights the failure to grapple with different *types* of value.

  3.  **Declining Discount Rates: Compromise or Coherence?**
      *   **Not Easily Coherent:** Deriving declining rates from a single, consistent ethical position (e.g., strict utilitarianism) is extremely difficult. A constant PTP logically implies exponential discounting forever. A constant elasticity of marginal utility combined with uncertain growth *might* justify a *slightly* declining rate under uncertainty, but not the steep step-downs often used.
      *   **Primarily a Political/Technical Compromise:** You nailed it. Declining rates are largely a pragmatic fudge:
          *   **Near Term:** High rates reflect perceived high OCC and political impatience (effectively embedding PTP).
          *   **Long Term:** Lower rates acknowledge ethical concerns about distant generations (reducing the implicit PTP) and the sheer implausibility of compounding at 3-7% for centuries (which makes *any* distant cost/benefit near-zero). It's a way to say "we care *a bit* more about the far future" without adopting zero PTP.
          *   **Hedging Uncertainty:** It can be framed as hedging against uncertainty about the *correct* long-term discount rate, placing more weight on lower possible rates for the distant future.

  4.  **Zero Pure Time Preference (PTP = 0): The Radical Shift**
      *   **What Changes:** Eliminating PTP means welfare in 2100 is valued *equally* to welfare today, *ceteris paribus*. The discount rate would then consist *only* of OCC and DUC: `r = η * g` (where `η` is the elasticity of marginal utility, `g` is growth in per-capita consumption).
      *   **Impact on Appraisal:**
          *   **Massive Boost to Long-Term Benefits:** Benefits centuries away (like avoided climate damages or deaths) would be valued much, much higher. A death prevented in 2200 discounted at (say) `r = 1%` (η=1, g=1%) is worth ~13% of a death today. With even 1% PTP, it would be worth ~0.3%. With PTP=0, that jumps to ~13%. The difference is enormous.
          *   **Long-Term Projects Dominate:** Projects with very long-lived benefits (climate mitigation, nuclear safety, biodiversity conservation) would become vastly more attractive relative to short-term projects. Infrastructure with multi-century lifespans would look better.
          *   **Is it a *Reductio*?** It depends on your ethics:
              *   **Utilitarian View (Sidgwick, Ramsey, Stern):** PTP=0 is ethically required. Failing projects crucial to the long-term survival/happiness of humanity because we heavily discount the future *is* the *reductio* of *not* using PTP=0. Stern's climate review argued this forcefully.
              *   **Practical Politics/Financing View:** Critics argue PTP=0 ignores the reality of political time horizons, capital market rates, and the difficulty of sacrificing significant resources today for distant gains. They see projects becoming "too expensive" or crowding out urgent near-term needs as the *reductio*. It highlights the tension between ethical ideals and practical implementation/opportunity cost.
          *   **Not Quite Infinite:** Even with PTP=0, DUC (`η * g`) still discounts future *consumption-based welfare*. If `g` is positive, future welfare increments are still discounted. Only if `g` were zero (or negative) and PTP=0 would there be no discounting of welfare. The benefits would still be finite but vastly larger.

  5.  **Distinguishing Needs vs. Fits:**
      *   **What Practice Strictly Needs:** CBA *strictly needs* a discount rate to make costs and benefits occurring at different times comparable on a present value basis. It *needs* some way to reflect that resources have alternative uses (OCC). It does *not* strictly *need* PTP or DUC, though they are deeply embedded in the standard justification.
      *   **What It Happens to Fit With:** Current practice *fits comfortably* with:
          *   A worldview prioritizing near-term economic efficiency and observable market returns (OCC).
          *   An implicit acceptance of *some* PTP, reflecting societal myopia or political reality.
          *   The assumption that consumption/wealth is the primary (or only) source of welfare (enabling the blurring of money/welfare discounting).
          *   A desire to avoid explicit, controversial ethical declarations about intergenerational equity.
      *   **The Load-Bearing Ambiguity:** The ambiguity between discounting money (OCC) and discounting welfare (DUC/PTP) is absolutely load-bearing. Resolving it cleanly would force:
          *   Explicitly defending PTP (ethically fraught).
          *   Developing separate, defensible methods for valuing non-market, non-consumption goods across time.
          *   Potentially using different discount rates for different *types* of impacts (money, health, environment, extinction risk) based on how their value relates to future wealth. This is complex and politically difficult.

  **Conclusion:**

  Discounting in CBA, as practiced, presupposes a **utilitarian framework where welfare is primarily derived from consumption/wealth**, and **blurs the distinction between discounting money and discounting welfare**. This blurring allows the ethically controversial Pure Time Preference (devaluing future lives/welfare *because* they are future) to be smuggled in alongside the more defensible Opportunity Cost of Capital and Diminishing Marginal Utility arguments. Declining discount rates are primarily a political compromise acknowledging ethical concerns about the far future without abandoning near-term market logic. Adopting zero PTP would dramatically increase the weight given to long-term benefits, aligning CBA with a strong intergenerational equity ethic but straining practical politics and financing – highlighting the fundamental tension between ethical ideals and the constraints of the present. The ambiguity is indeed load-bearing; removing it would expose deep, unresolved ethical conflicts about our obligations to the future.
