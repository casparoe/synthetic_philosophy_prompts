prompt: |-
  I run a fortnightly reading group for psychology PhD students who work on judgment and forecasting, and in two weeks I have a single ninety-minute session on accuracy-first epistemology — the program of grounding norms for credences in the idea that a credence is better or worse depending on how accurate it would turn out to be, rather than in how well it would serve your betting book. The group already knows Dutch book arguments from an earlier session and, predictably, came away thinking the whole of Bayesianism is about not being exploitable by a bookie, so my worry is that if I'm not careful they'll hear the accuracy program as merely a second, fancier way of saying "don't take sure losses" and miss what's genuinely new: the attempt to make epistemic value its own thing, vindicating probabilism and conditionalization without any appeal to money, bets, or preferences at all.

  Plan the session for me rather than explaining the material. I want the dependency structure spelled out: what has to be established before what (e.g., must they grasp the notion of a scoring rule and its propriety before seeing the dominance-style argument for probabilism, or does the argument motivate the formalism better than the other way round?), and whether the carrying example should be the weather forecaster scored over a season of issued forecasts — and if so, what that example must have (repeated forecasts, a public metric, a forecaster who could try to game the metric) and what it lacks that I'll need to flag. Include the misconceptions I should expect and exactly where in the sequence each should be headed off; my guesses are at least these: that accuracy means calibration (a forecaster who says 70% and is right 70% of the time is doing everything there is to do), that the choice of scoring rule is an arbitrary convention on a par with Celsius versus Fahrenheit, that properness just encodes honesty norms that could have been otherwise, and that the whole program covertly re-imports decision theory through the back door — the epistemic-consequentialism worry that if we vindicate credence norms by pointing at something they maximize, we've smuggled pragmatism in and the "epistemic" label is a courtesy title. There's also a trap specific to this audience: because they score forecasters professionally, they'll assume Brier score is the accuracy measure, full stop, and I need to know where to loosen that grip without a digression into logarithmic scoring they don't need.

  Also tell me what to refuse to cover in ninety minutes and say so openly to them — my candidates are the theorems for updating norms, immodesty and its connection to uniqueness vs. permissiveness, and the question of what happens to agents with extreme (0 or 1) credences — with a one-sentence deferred-questions script for each. End with one comprehension check I can pose in the last five minutes whose answer would distinguish someone who has the actual idea from someone who's merely pattern-matched it to the Dutch book session.

  Please deliver the plan as a JSON object with the following fields: "sequence", an array of objects each with "step" (a short name), "minutes" (a number summing to at most 85), "prerequisite" (what must already be in place and why), and "misconception_handled" (the misconception defused at this step, or null); "carrying_example", an object with "setup", "what_it_must_have", and "what_it_lacks_and_how_to_flag_it"; "residual_misconceptions", an array of objects with "misconception", "why_it_arises", and "one_line_response" for those that can't be given a dedicated step; "omissions", an array of objects with "topic", "why_omitted", and "deferred_script"; and "comprehension_check", an object with "question" and "what_a_good_answer_shows" versus "what_a_pattern_matched_answer_looks_like". After the JSON, add a short prose paragraph flagging anything in the plan you'd expect to divide informed opinion — places where a serious person teaching the same session would sequence it differently, and what turns on the disagreement.
