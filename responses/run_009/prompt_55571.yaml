  We are planning a 90-minute session on accuracy-first epistemology for a group of psychology PhD students who work on judgment and forecasting. The key goal is to distinguish this program from Dutch book arguments and to emphasize that it grounds norms in epistemic value (accuracy) without appeal to betting or preferences.

  Key challenges:
  - They know Dutch book arguments and might see this as just another way to avoid sure losses.
  - They are forecasters and might assume the Brier score is the only accuracy measure.
  - Potential misconceptions: accuracy = calibration; choice of scoring rule is arbitrary; properness is about honesty and could be otherwise; the program covertly re-imports decision theory.

  Plan must:
  - Sequence steps with prerequisites and time allocation.
  - Use a carrying example (likely the weather forecaster over a season) and specify what it must have and what it lacks.
  - Address misconceptions at appropriate steps.
  - Note residual misconceptions that won't be fully addressed and provide one-line responses.
  - Specify omissions with a one-sentence deferred script.
  - End with a comprehension check.

  Carrying example: Weather forecaster scored over a season. It must have:
  - Repeated forecasts: to show aggregation of accuracy.
  - A public metric (like Brier score) to evaluate performance.
  - A forecaster who could try to game the metric (to illustrate propriety).

  What it lacks and must flag:
  - It doesn't cover the single-case evaluation (which is a common critique) - flag that the program aims to evaluate credences in single cases too, but we focus on long-run properties for simplicity and because they connect to forecasting practice.
  - It might suggest that the scoring rule is chosen arbitrarily - we must emphasize that the choice of scoring rule is constrained by epistemic considerations (propriety) and that the Brier score is just one example.

  Sequence Outline:

  1. Motivate the program: Why seek an epistemic foundation beyond Dutch books? (5 min)
     - Prerequisite: They know Dutch books are about avoiding sure losses in betting.
     - Highlight: We want to ground norms in what makes a credence epistemically good, not in avoiding monetary loss.

  2. Introduce the concept of accuracy as the key epistemic good. (10 min)
     - Prerequisite: The idea that we want our beliefs to be close to the truth.
     - Define accuracy for a credence: e.g., how close the credence is to 1 when the proposition is true and to 0 when false.
     - Introduce scoring rules as a way to measure inaccuracy (without going into details of specific rules yet).

  3. Present the weather forecaster example. (10 min)
     - Setup: A forecaster issues probabilities for rain over a season. We score each forecast and average to get an overall score (e.g., Brier score).
     - What it must show: Repeated forecasts, a metric that penalizes both overconfidence and underconfidence, and the idea that the forecaster might be tempted to game the system if the scoring rule is not proper.
     - What it lacks: We'll note that we are using a long-run example for concreteness, but the accuracy norms are meant to apply to single beliefs as well. Also, we are using Brier for now but there are other scoring rules.

  4. Define scoring rules and properness. (15 min)
     - Prerequisite: They understand the idea of measuring accuracy with a score.
     - Define: A scoring rule assigns a penalty (or negative score) for a credence when the truth is revealed. Lower penalty = more accurate.
     - Properness: A scoring rule is proper if the forecaster minimizes expected penalty by reporting their true credence. (Honesty is the best policy if you want to minimize expected penalty.)
     - Why propriety matters: Without it, the forecaster might be tempted to lie to get a better score.

  5. Dominance argument for probabilism. (15 min)
     - Prerequisite: They understand scoring rules and propriety.
     - Show that non-probabilistic credences are dominated by probabilistic ones: there exists a probabilistic set of credences that is guaranteed to be more accurate (or at least as accurate) no matter what the truth is.
     - Use a simple example (e.g., two propositions) to illustrate dominance. This step does not require the scoring rule to be proper, but we'll note that the dominance holds for a wide class of scoring rules (strictly proper ones give strict dominance for non-probability functions).

  6. Address the misconceptions explicitly. (15 min)
     - Weave in the misconceptions at the appropriate steps, but also have a dedicated moment to contrast:
       - Accuracy vs. Calibration: A well-calibrated forecaster might not be the most accurate (e.g., always saying 50% when it rains 50% of the time is calibrated but not as accurate as someone who says 0% or 100% when appropriate). Use an example to show that accuracy (as measured by a proper scoring rule) rewards both calibration and refinement.
       - Choice of scoring rule: It's not arbitrary because propriety is a key constraint. Also, different scoring rules emphasize different aspects (e.g., logarithmic score is more sensitive to extreme events). But we are not getting into log vs Brier. We'll note that the program works for a large class of proper scoring rules and that the choice among them is not arbitrary but based on epistemic considerations (like which aspects of accuracy we care about).
       - Properness and honesty: It's not just a norm that could have been otherwise. It is a mathematical property that ensures that the scoring rule is eliciting the true credence. Without it, the scoring rule wouldn't be measuring what we want (true credences).
       - Epistemic consequentialism: We are not smuggling in pragmatism because we are not tying accuracy to any practical goal. Accuracy is an epistemic good in itself. We are not saying that we should care about accuracy for the sake of something else, but that accuracy is the fundamental epistemic virtue.

  7. Wrap up and comprehension check. (5 min)

  Residual misconceptions: Some might still worry about the choice of scoring rule or the epistemic consequentialism. We'll have one-line responses.

  Omissions:
  - Theorems for updating: We are not covering how accuracy arguments can be used to justify conditionalization due to time. Script: "We focus on the synchronic case today; accuracy arguments also extend to updating rules, but that's for another time."
  - Immodesty and uniqueness: We skip the discussion of whether there is a unique best scoring rule and the immodesty property. Script: "The program also addresses how agents should plan to update, but we omit that for today."
  - Extreme credences (0 and 1): We don't cover the problem of what happens when we assign 0 or 1 and turn out wrong (infinite penalty for log score). Script: "Extreme credences raise interesting issues about the possibility of being infinitely wrong, but we set that aside."

  Comprehension check: Ask a question that distinguishes understanding the epistemic foundation from pattern-matching to Dutch books.

  Question: "Why is the accuracy argument for probabilism different from the Dutch book argument? What does it show that the Dutch book argument doesn't?"

