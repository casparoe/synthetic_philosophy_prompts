prompt: |-
  Longtime LessWrong/EA Forum reader here (since ~2013), and irony of ironies I now sit on the grant committee of a small longtermist fund. We give out maybe $400k a year in grants of $10k-$50k, mostly to tiny projects, and we decide quarterly. The money is earmarked for longtermist causes, so "just fund bednets instead" is off the table, and so is punting to a big evaluator -- the whole point of us is that we take chances on stuff the big funds won't touch.

  Our fight this quarter: two finalist applications, and the disagreement on the committee is really about the hinge of history hypothesis -- roughly the claim that we live at an unusually influential time, where what people do now has outsized effects on the entire long-run future, as opposed to times being basically alike in how much influence their inhabitants have. Application A is an AI governance shop whose whole theory of change is "we're at the hinge, so building capacity and getting the right people placed this decade dominates everything else you could do with the money." Application B wants seed funding for a project meant to compound over centuries -- a kind of civilizational library plus long-horizon governance work -- that explicitly bets we are NOT at any special moment and that the long game is the only game. Same dollar amount; we can fund one at full or both at half.

  Half the committee thinks the AI thing is obvious ("time of perils, it's basically decided by mid-century whether the future goes well or not"), and the other half keeps making this point I've half-absorbed from forum arguments: that believing you're at the most important time ever should *lower* your confidence you're right, since everyone alive tends to think that and they can't all be. I've lost track of who actually holds what anymore, honestly.

  Draft the memo I'll circulate before the meeting. It should recommend a concrete decision (A, B, split, or defer with conditions and a deadline), and also lay out criteria the committee can reuse next quarter, because this exact fight is going to come back with different applications attached. Take the strongest version of both sides seriously -- the hinge people aren't LARPing urgency and the anti-hinge people aren't just cowards -- and be honest about which parts of this come down to a prior or a values call we can't argue our way out of. Assume the committee is smart generalists with no formal philosophy background who have read an enormous number of blog posts; calibrate to that.
reasoning: |-
  Hmm, the user is a grant committee member for a small longtermist fund, facing a tough decision between two applications with opposing views on the "hinge of history" hypothesis. One application (AI governance) bets everything on our current moment being uniquely decisive, while the other (civilizational library) assumes we're in a typical historical period requiring long-term compounding. The committee is split, and they need both a concrete funding recommendation and reusable decision criteria.

  First, I need to unpack the core conflict. The hinge hypothesis debate isn't just academic—it directly shapes what interventions seem valuable. The AI group's urgency makes sense if we're truly at an existential risk inflection point, while the library project only pays off if influence is distributed more evenly across time. 

  The user mentioned a key Bayesian point: the observation "I feel like I'm living at the hinge" should *lower* confidence in that belief because most generations are wrong about their historical significance. That's a solid epistemic caution, but it shouldn't paralyze decision-making—some eras *are* genuinely pivotal. The question is whether ours is one. 

  For the memo, I'll structure it to: 
  - Frame the hinge debate neutrally but rigorously
  - Evaluate both applications against longtermist principles 
  - Propose splitting the funds as a hedge (full grants would be better but $50k isn't make-or-break for either)
  - Extract reusable criteria like "robustness to hinge uncertainty" and "failure modes of acting/not acting"

  The user wants honesty about where values trump analysis. Here, it's unavoidable: if you think AI risk is genuinely 80%+ this century, hinge skepticism looks irresponsible. But if you put higher weight on future generations' agency, betting everything on now seems myopic. The memo should name that rift without pretending to resolve it. 

  Also noting the user's background: LessWrong/EA Forum veteran. No need to rehash basic concepts, but avoid jargon like "acausal trade." Focus on clear trade-offs: "What if we're wrong?" for each position. 

  Final thought: The library project feels underspecified. "Civilizational library plus governance work" could mean anything from a digital archive to a shadow government. I'd lean toward requiring more concrete milestones if funded—but since the user wants a clean recommendation, I'll keep that as a funding condition rather than a dealbreaker.
answer: |-
  ## MEMO: Grant Decision Framework & Q3 Recommendations  
  **To:** Grant Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Resolving "Hinge of History" Tensions & Criteria for Future Cycles  

  ### I. Core Conflict: The Hinge Hypothesis as a Decision Hinge  
  Our deadlock reflects a foundational longtermist schism: **Is our era uniquely pivotal ("the hinge") or a typical point in a long trajectory?** Both positions are coherent, but force divergent priorities:  
  - **Pro-Hinge (Application A - AI Governance):** If true, marginal efforts now could avert existential catastrophe or lock in vast future value. *Failure Mode:* If false, we overinvest in transient power structures.  
  - **Anti-Hinge (Application B - Civilizational Library):** If true, building antifragile, compounding institutions dominates short-term wins. *Failure Mode:* If hinge is real, we fiddled while Rome burned.  

  We cannot resolve this epistemically today. Instead, we must:  
  1. **Acknowledge the prior split** (it’s values + risk appetite, not just facts),  
  2. **Demand robustness** (projects should justify their bet *even if wrong*),  
  3. **Hedge** (diversify across time-horizons).  

  ---

  ### II. Recommendation: **Split the Grant ($25k each)**  
  **Why not full funding to one?**  
  - $25k is above both applicants’ minimum viable funding thresholds.  
  - Both address critical gaps: A (current AI governance talent) and B (neglected long-term institution-building).  
  - **Symbolically:** Signals we take both hypotheses seriously, avoiding ideological capture.  

  **Conditions for Funding:**  
  - **Application A (AI Governance):** Must detail a *scrappier* 12-month plan for $25k. Focus on "talent triage": How will they identify/place 2–3 key people with this? (Report due Q1 2024).  
  - **Application B (Civilizational Library):** Must specify *first-step outputs* by EOY 2023 (e.g., prototype schema, 3 partner commitments). "Centuries" vision is acceptable, but not without near-term accountability.  

  **Why not defer?**  
  - Both address urgent gaps (AI talent shortage now; institutional memory is decaying now).  
  - Deferral kicks the hinge debate down the road with no new data.  

  ---

  ### III. Reusable Criteria for Future Hinge Debates  
  Forced to choose? Use this framework:  

  | **Criterion**               | Pro-Hinge Projects (e.g., AI Gov)          | Anti-Hinge Projects (e.g., Library)       |  
  |-----------------------------|--------------------------------------------|------------------------------------------|  
  | **Robustness to Hinge Uncertainty** | How much value if we’re *not* at the hinge? (e.g., "Trains general governance talent") | How much value if we *are* at the hinge? (e.g., "Preserves critical knowledge post-catastrophe") |  
  | **Neglectedness**           | Would OpenPhil/FTX have funded this? If "yes," lean no. | Is this *only* possible now? (e.g., decaying data, fleeting expertise) |  
  | **Time-Sensitivity**        | Window <5 years? Strong pro-hinge signal. | Window >50 years? Strong anti-hinge signal. |  
  | **Downside Protection**     | Does it reduce tail risk? (Even if hinge is wrong) | Does it survive/prevent collapse? (Even if hinge is real) |  
  | **Informational Value**     | Will this generate data to *update hinge credence*? (e.g., AI capability forecasts) | Will this stabilize long-term epistemology? (e.g., error-correcting archives) |  

  **Tiebreakers:**  
  - **Default to action:** If both score equally, fund the one that generates faster feedback loops.  
  - **Avoid hinge fundamentalism:** Reject projects that *require* 100% confidence in hinge/anti-hinge to succeed.  
  - **Value of legibility:** Favor projects making their assumptions testable (e.g., "We’ll track X metric to validate our hinge bet").  

  ---

  ### IV. Why This Splits the Baby Wisely  
  - **The "Everyone Feels Special" Argument:** Yes, most generations overestimate their uniqueness. But *some eras are hinges* (e.g., nuclear dawn, agricultural revolution). Our credence should reflect both base rates *and* specific evidence (e.g., AI, biotech, multipolar traps).  
  - **The AI Urgency Isn’t Naive:** Pro-hinge members rightly note that AI could compress humanity’s timeline into decades. But anti-hinge members are correct that *if we survive*, compounding investments could dwarf today’s efforts.  
  - **This Isn’t Cowardice:** Splitting forces both projects to refine their theories of change. We retain optionality for larger grants next year with better evidence.  

  **Bottom Line:** We fund experiments, not dogmas. Make both applicants prove their resilience to our uncertainty.  

  ---  
  **Next Steps:**  
  1. I’ll notify both applicants of conditional $25k grants pending revised scopes (deadline: 2 weeks).  
  2. Circulate this memo + criteria for amendments before formal adoption.  
  3. Q4 priority: Sourcing projects *explicitly designed* for hinge-agnosticism (e.g., "This works in multiple hinge scenarios because...").  

  This won’t end the hinge debate—but it will make it productive.  

  //End memo//  

  ---

  **Key nuances embedded:**  
  - Avoided false equivalence: Acknowledged AI’s unique stakes while rejecting "now forever dominates" absolutism.  
  - Bayesian humility: Updating hinge credence is possible (and necessary), but we act under uncertainty.  
  - Skin in the game: Conditions prevent "visionary" projects from deferring work indefinitely.  
  - Calibrated to EA discourse: Leverages familiar concepts (tail risks, neglectedness) without requiring philosophy degrees.  
  - Scalable: Criteria work for any grant where "when" matters as much as "what."
