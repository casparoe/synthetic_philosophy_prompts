  The user also hints at political evasion tactics—passive voice, adding "buts," or hiding behind collective nouns. They want concrete filters to separate real apologies from PR spin. Smart. They even ask which requirement, if missing, lets apologies off the hook. That’s the knife-edge question. 

  For the framework, I'll start with non-negotiables: specificity, acknowledgment of harm, acceptance of responsibility. Without these, it’s not an apology—just regret theater. Then the contested zones: material reparations (essential to some, separate to others) and continuity (how tightly must the modern state be linked to the perpetrator?). 

  I should flag irreconcilable tensions too. E.g., "no buts" clashes with historical nuance; reparations can be logistically impossible yet morally necessary. And if I had to pick one make-or-break element? Specificity. Vague language is the ultimate escape hatch for unaccountability. 

