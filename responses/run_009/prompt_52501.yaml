   2. **No confirmation from spent evidence** (non-negotiable): If the evidence was already fully accounted for (like the horse injury that was already baked into the odds), then it should not confirm any new hypothesis. Motivated by the racetrack example.

   3. **Explanatory connection matters** (non-negotiable? or camp preference?): The solution should respect that what is new is not the evidence per se but the explanatory connection. Motivated by the case where a detail in the paperwork becomes relevant only when a new theory comes along.

   4. **Avoid retroactive rigging** (non-negotiable): The solution must not allow an agent to arbitrarily choose a past state of ignorance to simulate, which would allow confirming any hypothesis arbitrarily. Motivated by the danger case.

   5. **Stay within the bookkeeping framework** (camp preference?): The solution should be a modification or extension of the Bayesian bookkeeping rule (conditionalization) rather than replacing it with a completely different framework. This is because the user wants to stay in the odds setting framework.

   6. **Gradual confirmation allowed** (camp preference?): The solution should ideally account for cases where confirmation happens gradually by repeatedly noticing how the hypothesis fits old evidence. (But note: the Bayesian update is for discrete evidence. This might be handled by a sequence of updates if we break the evidence into parts, but sometimes the process is not discrete.)

   7. **Preserve conditionalization for new evidence** (non-negotiable): The standard rule must hold when the evidence is genuinely new.

   8. **No Dutch book vulnerability** (non-negotiable): The solution must not make the agent vulnerable to a Dutch book (a sure loss) by having inconsistent odds over time. This is a core tenet of Bayesianism.

   9. **Distinguish confirmation from consistency** (non-negotiable): The solution must not count mere consistency with old evidence as confirmation; there must be some sense in which the hypothesis explains the evidence better than alternatives.

