answer: |-
  ### Desiderata for Solving the Old Evidence Problem

  The table below outlines the requirements for any adequate solution to the old evidence problem in Bayesian confirmation theory. Each desideratum is motivated by a specific case, marked as non-negotiable or a camp preference, and identifies what candidate fixes it rules out.

  | Desideratum                          | The case behind it                                                                                                                              | Non-negotiable or camp preference | What it rules out                                                                                                      |
  |--------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------|------------------------------------------------------------------------------------------------------------------------|
  | **Old Evidence Confirmation (OEC)**  | Einstein’s theory confirmed by Mercury’s orbit (known for decades). Old evidence must sometimes boost confidence in a new hypothesis.           | Non-negotiable                    | Solutions denying old evidence can ever confirm (e.g., strict conditionalization without modification).               |
  | **Spent Evidence Immunity (SEI)**    | A horse’s injury reported Tuesday, fully baked into odds by Wednesday; Thursday’s rehashing cannot shift prices. Spent evidence must not reconfirm. | Non-negotiable                    | Solutions allowing re-confirmation by evidence already incorporated (e.g., naïve counterfactual approaches).          |
  | **Explanatory Connection (EC)**      | A paperwork detail, ignored for years, suddenly becomes relevant when a theory explains it. The *connection* must drive confirmation, not the fact. | Non-negotiable                    | Solutions conflating mere consistency with confirmation (e.g., treating all old consistent evidence as confirmatory). |
  | **Anti-Rigging (AR)**                | A punter retroactively "simulates" a past ignorant self to rig odds in favor of their pet theory. Must prevent arbitrary self-manipulation.      | Non-negotiable                    | Fixes relying on unconstrained counterfactual priors (e.g., "pretend you didn’t know" without objective constraints). |
  | **Bookkeeping Compliance (BC)**      | The core odds-based framework (conditionalization) works perfectly for new evidence; any fix must extend, not replace, this system.             | Camp preference                   | Solutions abandoning conditionalization entirely (e.g., non-Bayesian confirmation measures).                          |
  | **Gradual Process Accommodation (GPA)** | Confidence creeps up over months as a hypothesis repeatedly fits old knowns; no single "aha!" moment. Must handle non-discrete confirmation.  | Camp preference                   | Fixes requiring discrete "news" events (e.g., one-off updates on connections).                                        |
  | **New Evidence Rule (NER)**          | When genuinely new news arrives (e.g., a horse’s surprise injury), conditionalization must apply verbatim.                                     | Non-negotiable                    | Solutions altering the update rule for new evidence (e.g., retroactive adjustments to new updates).                   |
  | **No Dutch Books (NDB)**             | A clever punter exploits inconsistent odds across time for guaranteed profit. Must maintain coherent, time-consistent probabilities.          | Non-negotiable                    | Solutions enabling sure-loss bets (e.g., violating probability kinematics via ad hoc updates).                        |
  | **Explanation vs. Consistency (EVC)** | A hypothesis consistent with all evidence but offering no explanatory insight (e.g., a "just so" story) should not gain credence from old facts. | Non-negotiable                    | Solutions equating consistency with confirmation (e.g., logical entailment as sufficient).                            |

  ### Tensions and Incompatibilities
  - **OEC vs. BC vs. AR**: The core tension. OEC demands old evidence confirms, but BC insists on using conditionalization within the bookkeeping framework. Conditionalization requires updating on *new* input, so accommodating OEC typically involves counterfactuals (e.g., simulating ignorance). Yet AR forbids arbitrary counterfactual priors, creating a trilemma. *This tension is likely unresolvable without relaxing BC or AR*.
  - **GPA vs. EC**: Gradual confirmation (GPA) lacks discrete "connection-learning" events, but EC-focused fixes (e.g., updating on connections) require such events. GPA may necessitate a non-Bayesian process.
  - **EC vs. EVC**: While related, EC emphasizes the *act of linking* evidence to a hypothesis, whereas EVC guards against pseudo-explanations. Solutions satisfying EC might still violate EVC if they allow weak explanations (e.g., "H predicts E" for contrived H).

  ### Suspected Jointly Unsatisfiable Subset
  [**OEC, BC, AR**]  
  These cannot all hold simultaneously. BC forces solutions into the conditionalization framework, which requires *new* input to update. OEC demands old evidence confirms, implying we must update on *something* (e.g., a counterfactual state). AR then blocks arbitrary counterfactual priors. No solution satisfies all three without compromising one (e.g., violating AR via subjective priors).

  ### Most Excluding Requirement
  **Anti-Rigging (AR)**  
  Knocks out the widest range of fixes (especially counterfactual approaches) because it demands an objective, non-arbitrary method for handling old evidence. Subjective or unconstrained priors—common in many solutions—invite retroactive manipulation, violating AR.

