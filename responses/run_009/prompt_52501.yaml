   The problem: 
   - Conditionalization (Bayesian updating) says that when we learn new evidence E, we update our degree of belief in a hypothesis H by the factor P(E|H)/P(E).
   - But if E is already known, then P(E) = 1 and P(E|H) = 1 (if H entails E or if the probability is conditioned on the background knowledge that includes E), so no update occurs.
