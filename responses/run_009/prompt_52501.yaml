  ### Discussion
  - **Counterfactual approaches** satisfy OEC by simulating ignorance but fatally violate AR (rigging risk) and EC/GPA (discrete updates ignore connection-learning subtleties).  
  - **New-Connection approaches** handle EC and EVC elegantly but violate BC (updating on logical relations transcends bookkeeping) and AR (priors over connections can be rigged).  
  - **Objective Chance approaches** avoid rigging (AR) but violate BC (objective chances are external to bookkeeping) and SEI (they may "reconfirm" spent evidence if chances are static).  
  - **No family satisfies all non-negotiable desiderata**. The trilemma (OEC, BC, AR) remains the central obstacle. A viable solution may need to relax BC (e.g., incorporate logical learning) or AR (e.g., with intersubjective priors), but this risks undermining the coherence of the Bayesian framework. The Mercury case *must* be addressed without licensing rigging—a balance yet to be struck.
