prompt: |-
  hey, so I'm a grad student in a decision theory seminar and I need to write a term paper proposal (~6000 words, one semester), and I want help turning my half-formed idea into something with an actual shape. Act like you're a professional philosopher who works on rational choice theory and has thought way too much about the independence axiom — think through my idea carefully first, brainstorm a couple of possible framings before committing to one, but the final answer you give me should be just the proposal itself.

  The idea: everyone knows the Allais paradox as the standard counterexample to the independence axiom — people take the sure thing over a gamble in one choice pair, then reverse their preference when both options become gambles, which independence forbids. The usual moral is "so much the worse for the axiom" or "so much the worse for the people," depending on taste. But my hunch is there's an underexplored fork here: does the violation show that certainty itself is special — a genuine discontinuity at probability 1, where having the good in hand matters in kind and not just degree — or is it just that people weight probabilities non-linearly and steeply near the top, so the gap between 100% and 99% behaves like any other jump in felt weight, only bigger? And I suspect the fork matters, because if it's the discontinuity story you could arguably keep independence everywhere except across the certainty boundary (I believe there are weakenings of the axiom that do roughly this), while if it's just steep weighting, the axioms need a much bigger overhaul — or the preferences need to be explained away as straight-up mistakes.

  Write the proposal as a numbered list of exactly five items, each one or two sentences, with no intro or conclusion:

  1. The research question, stated so it actually has a determinate answer.
  2. Why the standard positions (keep independence, throw it out entirely, prospect-theory style probability weighting) leave this question open.
  3. The method — what a philosophy paper can genuinely do here, given that I can't run experiements on real subjects.
  4. What a positive result would look like, i.e. what I'd be claiming by the end.
  5. An honest statement of what would make this fail or turn out to be too big for one semester.

  No citations please, I'll add those myself. Keep it in my voice, like something I could actually send to my advisor — she is tough on proposals that smugle the answer into the question.
