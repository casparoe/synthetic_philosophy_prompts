  You're a professional philosopher specializing in modal logic and philosophy of religion, and I want you to actually think this through carefully, not give me the Wikipedia version. Maybe brainstorm a bit before settling on a diagnosis.

  So: I've been going down the rabbit hole on Gödel's ontological argument for a while now -- Scott's variant, Sobel's modal collapse objection, Anderson's emendation, the whole cottage industry of commentary -- and the debate strikes me as completely frozen. One camp says sure, the derivation is valid, but all the work is done by the positivity axiom, which basically smuggles the conclusion in, and by treating necessary existence as a great-making property. The other camp says the axioms are individually pretty plausible, and that's all any demonstration ever has going for it. And nobody has moved an inch in decades. My pet theory is that the disagreement isn't really about God, or even about the axioms -- it's about what a valid derivation from contested axioms amounts to: is it evidence for the conclusion, a reductio of the axioms, or just a definition dressed up as a theorem? But I'm honestly not sure, and the modal collapse thing complicates it for me, because if the system trivializes necessity and you can patch it (Anderson-style) to avoid that, the patched version still feels like it's tuned to avoid one embarrassment rather than to get at truth -- which smells like the disagreement is partly about methodology and not metaphysics at all. Is that right? Diagnose what kind of disagreement this actually is -- verbal, substantive, two questions under one heading, bedrock intuitions about what formal proof can show, something else -- using what each side actually says, and tell me whether anything (a new theorem, a better axiom, a conceptual distinction, giving up on the word "positive") would count as progress, or whether no progress should be expected and why.

  After the diagnosis, please give me a JSON object with these fields: "disagreement_type" (single best label plus a one-line defense), "camp_one_is_really_arguing_about", "camp_two_is_really_arguing_about", "hidden_question" (any lurking formal or conceptual question doing the real work, or null), "progress_condition" (what, if anything, would actually move the debate, or "none" with a reason), and "confidence" (a number from 0 to 1 with one sentence of justification).
