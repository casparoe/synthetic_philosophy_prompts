    "disagreement_type": "Methodological bedrock (epistemic granularity)",
    "defense": "The camps disagree on whether justification flows from atomic axiom-plausibility (skeptics) or systemic coherence (defenders), reflecting irreconcilable views on metaphysical reasoning.",
    "camp_one_is_really_arguing_about": "The illegitimacy of deriving substantive truths from contested axioms without independent empirical/intuitive grounding.",
    "camp_two_is_really_arguing_about": "The probative force of validity within a holistic system where axioms mutually support the conclusion.",
    "hidden_question": "What epistemic weight does formal validity confer on conclusions derived from intuitively plausible but contested premises?",
    "progress_condition": "Possible only through meta-formal work (e.g., formal epistemology of axioms) or redefining 'positive'; no resolution on core methodology without paradigm shifts.",
    "confidence": 0.85
  }
  ```

  **Confidence Justification**: "High (0.85) because textual evidence from both camps consistently reveals methodological priorities overriding metaphysical claims, though psychological factors (e.g., implicit theism/atheism) may play a minor unquantified role."
