        "person_affecting_wording": "World B is not better than World A for anyone, and creating the extra lives imposes no moral obligation.",
        "test": "Whether causal separation between universes weakens intuitive resistance to creating extra lives.",
        "prediction_totalist": "If separation weakens resistance, the person-affecting view must concede inconsistency; else, totalism is unaffected.",
        "prediction_person_affecting": "If separation weakens resistance, totalism gains plausibility; else, person-affecting intuitions hold."
      },
      {
        "crux": "Deferred Creation",
        "totalist_wording": "Creating barely-worth-living lives now or in 1 billion years is equally good, as both maximize total welfare identically.",
