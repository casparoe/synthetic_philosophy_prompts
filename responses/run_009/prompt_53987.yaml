answer: |-
  ### Joint Statement on Population Ethics: Agreed Claims and Disagreements

  **Agreed Claims**  
  We, the undersigned total utilitarian and person-affecting advocate, jointly affirm the following:  

  1. **The Repugnant Conclusion**: Parfit's repugnant conclusion asserts that for any world A with a population experiencing very high welfare, there exists a world Z with a vastly larger population experiencing lives barely worth living (i.e., minimally positive welfare), such that Z is better than A *if* the total sum of welfare in Z exceeds that in A. This follows logically from total utilitarianism's commitment to summing welfare across all individuals.  

  2. **The Sadistic Conclusion**: The sadistic conclusion demonstrates that, under total utilitarianism, adding lives with negative welfare (suffering) can be preferable to adding lives with positive welfare if the former group is sufficiently large to increase the total sum. This is intended to reveal a flaw in unmodified total utilitarianism, as it appears to endorse creating suffering when aggregated outcomes improve.  

  3. **The Non-Identity Problem**: Future individuals' identities depend on present actions. This complicates person-affecting views by making it impossible to claim that creating a person with a life barely worth living "harms" them (since they wouldn't exist otherwise). Thus, person-affecting theories cannot straightforwardly condemn creating such lives without additional criteria.  

  4. **Consequences of Total Utilitarianism**: Total utilitarianism concedes that it entails the repugnant and sadistic conclusions and implies no intrinsic objection to creating large populations with barely positive welfare. It prioritizes aggregate welfare over the distribution or quality of individual lives.  

  ---

  **Disagreements**  
  Our remaining differences center on two crux cases. Below, each position is worded as its proponent would endorse it, with predictions for how empirical or logical tests might resolve the dispute.  

  | Crux | Totalist Wording | Person-Affecting Wording | Case/Argument Bearing on Crux | Totalist Prediction | Person-Affecting Prediction |  
  |------|------------------|--------------------------|-------------------------------|---------------------|-----------------------------|  
  | **Auditorium Case** | World B (10 wonderful lives + 1 trillion barely-worth-living lives in a separate universe) is better than World A (only the 10 wonderful lives) because it increases total welfare without harming anyone. | World B is not better than World A for anyone; the extra lives benefit no one (they wouldn’t exist in A), and their creation imposes no obligation. | *Test: Whether causal separation eliminates intuitions about "harm."* If we confirm that disconnected universes cannot interact (e.g., no resource competition or risk of suffering), does this weaken resistance to creating extra lives? | Totalist predicts separation makes no difference: Total welfare still determines betterness. If separation weakens resistance, the person-affecting view must concede inconsistency. | Person-affecting predicts separation strengthens their view: No one in A is affected, so creation cannot be obligatory. If separation weakens resistance, totalism gains support; else, person-affecting remains intact. |  
  | **Deferred Creation** | Creating 1 trillion barely-worth-living lives now is equally good as creating them identically in 1 billion years; both maximize total welfare identically, so timing is irrelevant. | Creating the lives (now or later) is permissible but not obligatory; since no one is deprived by delay or non-creation, morality permits but never requires it. | *Test: Whether deferral affects obligations.* If we confirm the lives would be identical when created later (same welfare, same persons), does this eliminate reasons to prefer acting now? | Totalist predicts indifference: Welfare sums are identical regardless of timing. If deferral weakens the urge to act, the person-affecting view must explain why. | Person-affecting predicts deferral changes nothing: No obligation exists in either case. If deferral weakens the urge to act, totalism is counterintuitive; else, person-affecting gains support. |  

  ---

  **Verbal Disputes**  
  We identify one dispute as partly verbal:  
  - **"Worse" vs. "Not Better"**: The totalist describes a world with a trillion barely-worth-living lives as "better" (due to higher total welfare), while the person-affecting advocate calls it "not better" (due to no one benefiting). This is verbal because "better" is equivocal: Totalists use it impersonally (referring to aggregate states), while person-affecting theorists use it relationally (requiring a beneficiary). The underlying disagreement about *obligations to create lives* remains substantive.

  ---

  **Structured Summary (JSON)**  
