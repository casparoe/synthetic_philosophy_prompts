  We are drafting a joint statement for two parties: a total utilitarian (totalist) and a person-affecting utilitarian (person-affecting). The goal is to have a set of agreed claims and then a clear table of disagreements with specific cruxes.

  Agreed Claims:

  1. **The Repugnant Conclusion**: We both acknowledge that the repugnant conclusion, as described by Derek Parfit, is the claim that for any perfectly equal world A with a very high level of wellbeing per person, there is a better world Z with a much larger population, each living lives barely worth living, such that the total wellbeing in Z exceeds that in A. The totalist embraces this conclusion as a logical implication of total utilitarianism, while the person-affecting view rejects the idea that Z is better than A.

  2. **The Sadistic Conclusion**: We agree that the sadistic conclusion is the counterintuitive implication that under some axiologies (like total utilitarianism) it can be better to add lives with negative wellbeing (suffering) than to add lives with positive wellbeing, if the negative lives are sufficiently numerous and their suffering is outweighed by the positive lives in the total. The totalist accepts this as a consequence of their view, while the person-affecting view rejects it because it does not harm any particular person to avoid creating the suffering lives (if no one exists to be deprived) and creating them would harm those who suffer.

  3. **The Non-Identity Problem**: We both recognize the non-identity problem: the difficulty in claiming that an individual is harmed by an action (like creating them in a condition of low wellbeing) when that same action is a necessary condition for their existence. Thus, without the action, they would not exist to experience any wellbeing. This complicates any person-affecting view that requires an action to harm a particular person.

  4. **Consequences of Totalism**: The totalist concedes that their view implies the repugnant and sadistic conclusions, and that it does not inherently prioritize the interests of existing individuals over potential ones, leading to counterintuitive obligations to create large numbers of lives barely worth living.

  Disagreements:

  We will use two crux cases: the auditorium case and the deferred creation case. For each, we will have:

