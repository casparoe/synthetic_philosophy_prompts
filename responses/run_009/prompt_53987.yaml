        "test": "Whether deferring creation eliminates reasons to act now, given identical outcomes.",
        "prediction_totalist": "If deferral weakens the urge to act, the person-affecting view must explain why timing matters.",
        "prediction_person_affecting": "If deferral weakens the urge to act, totalism is counterintuitive; else, it supports person-affecting permissibility."
      }
    ],
