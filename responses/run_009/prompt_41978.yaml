  ### Decision Principle: Conditional Expectation with Symmetry (CES)

  Based on your verdicts, the core principle is that **decisions should be conditioned on all available information, including observed amounts and known priors, but must respect unconditional symmetry when no information breaks it.** Here's the principle formalized:

  1. **Condition on the Prior and Observation (CPO):**  
     If the prior distribution of the smaller amount (or pair) is known (proper or improper), and you observe your amount \(X\), then:  
     - Compute the expected value of the other envelope conditional on \(X\) and the prior.  
     - Swap if the conditional expected gain is positive; keep if negative; indifferent if zero.  
     *Motivated by:* Cases 5, 6, and 7 (when opened).  
     - **Case 5 (Uniform prior, opened):** With smaller amount uniform in [$10, $5000], seeing $300 or $4000 allows exact conditional calculation.  
     - **Case 6 (Degenerate prior, opened):** Knowing smaller amount is $100 and seeing $100 implies certain gain from swapping.  
     - **Case 7 (Improper prior, opened):** With prior \(P(\text{pair } n) \propto (1/3)^n\), conditioning on observed \(X\) yields positive expected gain from swapping.

  2. **Unconditional Symmetry (US):**  
     If no envelope is opened, or if no prior is known (even after opening), then swapping has zero expected gain due to symmetry:  
     - The two envelopes are assigned randomly, so holding one vs. the other is symmetric.  
     - A policy of always swapping or never swapping must have identical expected outcomes.  
     *Motivated by:* Cases 1, 2, 3, and 7 (unopened).  
     - **Cases 1–3 (No/known amounts, sealed):** Symmetry implies indifference.  
     - **Case 7 (Unopened):** Despite the prior, envelope assignment symmetry holds unconditionally.  
     - **Case 8 (Triple/thousand-fold):** Symmetry prevents absurd gains; indifference is required.

  3. **Reject Naive Equiprobability (RNE):**  
     Never assume the other envelope is equally likely to be half or double *unless justified by the prior and observation*. Absent a known prior, this assumption leads to contradictions.  
     *Motivated by:* Cases 4 and 8.  
     - **Case 4 (Opened, no prior):** Naive reasoning (\(P(\$50) = P(\$200) = 0.5\)) is invalid without a prior, causing wobble.  
     - **Case 8 (Degenerate ratios):** Naive reasoning scales to absurdity (e.g., 500x gain), violating symmetry.

