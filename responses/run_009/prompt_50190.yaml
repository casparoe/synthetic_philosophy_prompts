prompt: |-
  I teach an upper-level seminar on language and thought — 12 students, one 90-minute session — and we're arriving at linguistic relativity. The students come in carrying the pop version they got from the internet: more words for snow, therefore thoughts unavailable to the rest of us. My job for the rest of the term depends on replacing that with the defensible version: not vocabulary as a limit on thinkable thoughts, but obligatory grammatical categories that train habits of attention, with effects showing up under time pressure and in memory rather than as barriers to concepts. Design an in-class activity where they feel this distinction instead of being told it, because the vocabulary-versus-grammar line never survives being put on a slide.

  The conceptual point I want the rules themselves to carry: what a language forces you to encode every single time you open your mouth is different in kind from what it merely lets you name, since you can opt out of vocabulary but not out of grammar. So I imagine something like the following, though you should improve or replace it: one half of the class learns a twenty-five-word constructed language in which spatial relations must always be given in absolute terms anchored to landmarks in the room (no speaker-relative left and right) and every statement must carry a grammatical marker of evidence type — witnessed, inferred, or hearsay. The other half learns a variant with those same meanings available as optional words but never required. Both groups then run through a staged incident — a communication task under time pressure, followed by a surprise memory test of where things were and how each fact was known. Materials should be index cards and objects I can carry in a bag; no apps, nothing electrical.

  The debrief should map whatever performance gap appears onto the obligatory-versus-optional distinction and onto the idea that the effects live in the moment of encoding for speech, in habitual attention, not in a whole worldview — and then should confront the strongest objection head-on: that a twenty-minute laboratory language proves nothing about a lifetime of speaking one. Be frank about which features of the real relativist claim the activity cannot reproduce and I will have to supply by talking, and predict what goes wrong the first time I run it — my own worry is that students will silently translate through English before speaking, which would blunt exactly the effect I'm after, so tell me whether the rules can be built to block that or whether I should just plan for it.
reasoning: |-
  Okay, the user teaches an upper-level seminar on language and thought and needs an in-class activity to demonstrate linguistic relativity. The students come in with a pop-science misconception (more snow words = different thoughts) that needs replacing with the defensible version (obligatory grammar trains attention habits, visible under pressure). The challenge is making them feel this distinction experientially.

  Hmm... the user's proposed activity has merit but needs refinement. Key requirements jump out: must contrast obligatory grammar vs optional vocabulary, use physical materials only, fit 90 mins, and prevent English interference. The conceptual core is forcing encoding versus letting you name. 

  First, unpacking what works in their sketch: the spatial/evidentiality contrast is perfect—it's the classic Whorfian examples (Kay & Kempton, Lucy, Slobin). Splitting the class creates natural comparison. But potential flaws: 25 words may be too much for quick adoption, and silent translation could ruin everything. 

  Brainstorming solutions: shrink the language to 8-10 core words. Make grammar unavoidable by design—e.g., if they omit the evidential marker, the listener must reject the statement. Physical constraints help too: force movement during tasks so body position disrupts relative spatial terms. 

  Ah! The memory test twist is crucial. If Group A (obligatory grammar) recalls spatial/evidential details better under pressure, it mirrors real findings (like Boroditsky's Kuuk Thaayorre experiments). But must anticipate skepticism: students might say "this is artificial." So the debrief needs prepped counters—e.g., "This compresses a lifetime of habit into focused practice, like weightlifting vs daily carrying."

  Materials list crystallizes: colored index cards for grammar flags, everyday objects (cup, book), landmark signs. Staged incident should feel urgent—maybe a "spy briefcase swap" scenario where details matter. 

  Biggest worry remains English interference. Three fixes: 1) Grammar rules that break if translated (e.g., absolute space markers become nonsense when mapped to English "left") 2) Strict time pressure 3) Forbidding English during trials. Still, expect some leakage—plan to discuss it as "real languages also fight L1 interference."

  Lastly, mapping the activity's limits: it won't show worldview effects or conceptual barriers. The user must explicitly say: "This simulates attentional habits, not cognitive imprisonment." Save that for lecture. 

  ...*adjusts wireframe*... Final structure: intro (7 mins), language drill (20), communication trial (15), memory test (10), debrief (38). Yes, fits. Now scripting the debrief's pivotal question: "When Group B forgot the evidence source—was it because they couldn't think it? Or because no habit pushed them to encode it?" That should stick the landing.
answer: |-
  Here’s a refined, experiential activity designed to force students into the "obligatory encoding" mindset, using physical materials while minimizing translation. It targets **grammatical obligatoriness** (not vocabulary size) as the engine of attentional habits.

  ---

  ### **Activity: The Briefcase Switch**
  **Goal:** Feel how *forced grammatical encoding* (vs. optional vocabulary) shapes attention/memory under pressure.  
  **Time:** 60-70 mins (leaving 20-30 mins for debrief).  
  **Materials:**  
  - 2 identical small briefcases/lockboxes (or sturdy boxes).  
  - 10 small objects (e.g., key, coin, button, USB, pen, etc.).  
  - Landmark signs: **WINDOW**, **DOOR**, **PODIUM** (taped visibly).  
  - Colored cards: Red (WITNESSED), Blue (INFERRED), Yellow (HEARSAY).  
  - Index cards with language rules (different for Group A/B).  

  ---

  ### **Procedure**
  #### **1. Setup & Language Training (25 mins)**  
  - **Split Class:** Group A (Obligatory Grammar) and Group B (Optional Vocabulary).  
  - **Teach "Tilma" (Constructed Language):**  
    - **All Groups Learn:**  
      - *Nouns:* Object names (e.g., "kela" = key, "tano" = coin).  
      - *Verbs:* "place", "take", "open".  
      - *Landmarks:* "rin" (window), "pol" (door), "dak" (podium).  
    - **Critical Differences:**  
      - **Group A (Obligatory):**  
        - **Absolute Space:** Must use landmarks for location (e.g., "kela rin-tak" = key window-side). *Ban: "left/right"*.  
        - **Evidentials:** Every sentence needs a card (Red/Blue/Yellow). No sentence without one!  
      - **Group B (Optional):**  
        - *Same words for space/evidence exist*, but **never required**. May use English "left/right" or omit evidence.  

  - **Drill:**  
    - Practice describing object placements in Tilma.  
    - **Enforce Rules Rigorously:**  
      - Group A: Reject sentences missing evidentials or using relative space.  
      - Group B: Accept any description (even partial).  

  #### **2. Communication Task (15 mins)**  
  **Scenario:** "A spy left a briefcase here. You must direct a partner to *swap its contents* with a new briefcase."  
  - **Stage 1:** Teacher places 5 objects in Briefcase 1 (Group A sees placement; Group B does not).  
  - **Stage 2:** Pairs (within same group) direct each other to:  
    - **Remove** objects from Briefcase 1 and **place** them in specific locations around the room.  
    - **Place** new objects from a bag into Briefcase 2.  
  - **Pressure:** 4-min time limit; must use Tilma only.  
  - **Twist:** Teacher *quietly moves* 1 object during the task (creates inference/hearsay).  

  #### **3. Surprise Memory Test (10 mins)**  
  - **Spatial Memory:** "Where was the coin *originally* placed?" (Mark on map).  
  - **Evidential Memory:** "How did you know about the moved object?" (Witnessed? Inferred? Hearsay?).  

  ---

  ### **Debrief Framework (20-30 mins)**  
  **Guide students to self-identify the distinction:**  
  1. **Contrast Group Experiences:**  
     - *Group A:* "What felt frustrating? What details were you *forced* to track?"  
     - *Group B:* "Did you mention landmarks/evidence? Why/why not?"  

  2. **Map to Performance:**  
     - Highlight gaps in *memory accuracy* (especially for space/evidence).  
     - Emphasize: **"You COULD think about space/evidence in Group B—but you didn’t *habitually encode* it."**  

  3. **Core Conceptual Leap:**  
     - **Obligatory vs. Optional:** "Grammar forces constant 'mental weightlifting.' Vocabulary is a toolkit you open only when needed."  
     - **Effects in Real Relativity:** "Not about *can’t think* X, but *don’t habitually notice* X unless grammar demands it (until you need it under pressure)."  

  4. **Confront the Elephant:**  
     - **Objection:** "This is a 20-min lab language! Real languages shape worldview over lifetimes!"  
     - **Response:**  
       - "Absolutely. This **compresses the mechanism**: grammar as a *repetition machine* training attention. Real-world effects are this habit scaled over decades."  
       - "What this *can’t* show: deep cultural concepts (e.g., time-as-space). I’ll supplement with Navajo temporal grammar studies."  

  ---

  ### **Troubleshooting & Design Solutions**  
  - **Problem: Silent English Translation**  
    - **Solution:**  
      1. **Force Speed:** Strict time limits leave no room for translation.  
      2. **Embed Grammar in Physics:**  
         - Remove chairs; make students move to use landmarks (disrupts egocentric "left/right").  
         - Require Group A to **hold up evidential cards** while speaking (physical enforcement).  
      3. **Ban English:** Penalize groups for any English word.  

  - **Likely Snags (and Fixes):**  
    - **Group B "Overperforms":** Some may use optional words, muddying the contrast. *Fix:* Privately warn Group B: "Your goal is efficiency—omit details if possible."  
    - **Landmark Confusion:** Keep landmarks *asymmetric* (e.g., window and door on adjacent walls).  
    - **Evidentials Feel Artificial:** Stress they mimic real-world grammatical evidentials (e.g., in Turkish, Tibetan).  

  ---

  ### **Why This Works**  
  - **Grammar Feels "Heavy":** Group A’s frustration makes obligatoriness visceral.  
  - **Memory Test Reveals Encoding:** Forgetting stems from *not attending*, not inability.  
  - **Physicality > Slides:** Holding evidential cards/moving in space grounds abstraction.  

  **Final Tip:** Start with a "pop relativity" straw poll (e.g., "How many think snow words = different thoughts?"), then end by revisiting it. The activity won’t kill the myth alone—but it makes your lecture stick.
