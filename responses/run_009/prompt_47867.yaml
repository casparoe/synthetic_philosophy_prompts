answer: |-
  Here’s a complete exam package designed to force deep engagement with desert’s theoretical role:

  ---

  ### 1. The Question (118 words)
  > **Case A**: A murderer, convicted beyond any doubt, is terminally ill and will die within days. Punishing him achieves nothing: no deterrence (the punishment is secret), no incapacitation (he’s bedridden), no rehabilitation, no expressive benefit. Is punishment justified?  
  > **Case B**: Same murderer, same certainty of guilt. Punishing him, however, would trigger riots diverting police resources from active crime prevention, predictably causing multiple preventable deaths. May we decline punishment?  
  > **Essay Task**: Explain how a pure retributivist and a pure consequentialist would likely answer each case. Crucially, analyze how *the concept of desert functions differently* within each theory when generating these answers. Where do your own intuitions align or conflict with these theories, and why? (90 mins)

  ---

  ### 2. Model Answer (620 words)

  Case A presents punishment stripped of all future consequences. A pure consequentialist (e.g., utilitarian) must argue against punishment here. Since punishment inherently causes suffering (to the offender) and uses resources, and produces *zero* countervailing benefits (no deterrence, incapacitation, etc.), it creates net harm. Desert, for the consequentialist, is irrelevant unless it contributes to a valuable consequence (e.g., satisfying a public desire for vengeance might maintain social stability – but here, no one knows). Without positive consequences, punishment is unjustified harm.

  A pure retributivist, however, likely insists punishment *is* justified in Case A. Retributivism holds that the guilty *deserve* suffering because of their wrongful act, irrespective of future outcomes. Desert isn’t a goal to be achieved; it’s a *necessary and sufficient condition* for justified punishment. The offender’s moral culpability creates a duty to punish. Failing to punish, for the retributivist, is a failure of justice itself – allowing the guilty to escape their deserved suffering. Case A isolates this desert claim: punishment is justified *solely* because it is deserved.

  Case B flips the script. Here, punishment creates significant net harm (predictable deaths). The consequentialist, prioritizing overall outcomes, must argue against punishment. The harm caused (deaths from diverted resources) vastly outweighs any benefits (incapacitation is moot, deterrence might be minimal). Desert, again, only matters if it contributes positively to consequences; here, it doesn’t outweigh the harm. Not punishing maximizes net welfare.

  The retributivist faces a dilemma in Case B. Their core principle demands punishment because it is deserved. However, causing preventable deaths seems deeply unjust. How can the theory reconcile this? Some retributivists might argue desert creates an *absolute obligation* – we *must* punish the guilty, regardless of consequences ("Let justice be done though the heavens fall"). Others might soften this, seeing desert as a *pro tanto* reason (a strong, default reason) that could be overridden by catastrophic consequences like multiple deaths. This reveals a tension: if consequences can override desert, is desert truly foundational? A hardline retributivist would insist punishment is *still* required in B, accepting the deaths as a tragic but necessary cost of justice. A more moderate view might allow non-punishment but struggle to explain why desert isn't always decisive.

  My intuition aligns with consequentialism in Case B: preventing multiple deaths clearly outweighs punishing one murderer. However, in Case A, I feel strongly that punishment *is* justified, contradicting strict consequentialism. This suggests that desert acts like a necessary condition for me: punishment must be *deserved*, but whether we *act* on that desert might depend on consequences. Desert sets a constraint (we shouldn't punish the innocent, and we *should* punish the guilty *if possible*), but consequentialist concerns determine when it's permissible or obligatory to act within that constraint. Pure retributivism captures the intuitive *demand* of desert in Case A but seems dangerously rigid in Case B. Pure consequentialism handles Case B well but fails to explain the deep intuition that justice demands something in Case A, even secretly. This highlights that desert functions primarily as a *deontic constraint* (about duty and permissibility) in retributivism, while in consequentialism, it is either irrelevant or merely one potential *value* to be maximized (like preference satisfaction), easily overridden by other values like welfare.

  ---

  ### 3. Marking Scheme (20 marks total)

  1.  **Consequentialist Analysis (Cases A & B):** (4 marks)  
      *   Correctly identifies consequentialism rejects punishment in A (no benefit = net harm).  
      *   Correctly identifies consequentialism rejects punishment in B (net harm outweighs any benefit).  
      *   Explains desert is irrelevant/only instrumentally valuable for consequences.  
  2.  **Retributivist Analysis (Cases A & B):** (6 marks)  
      *   Correctly identifies retributivism mandates punishment in A (desert is sufficient reason).  
      *   Accurately presents the retributivist dilemma in B (desert demands punishment vs. catastrophic harm).  
      *   Clearly differentiates possible retributivist responses (absolute duty vs. *pro tanto* reason).  
  3.  **Analysis of Desert's Function:** (6 marks)  
      *   Contrasts desert as **sufficient reason/necessary condition** (Retrib.) vs. **instrumental value/irrelevance** (Conseq.).  
      *   Explains how Case A exposes desert as the *core justification* for Retrib.  
      *   Explains how Case B exposes desert as potentially *non-decisive* or *absolute* for Retrib., and easily overridden for Conseq.  
  4.  **Engagement with Intuitions & Synthesis:** (3 marks)  
      *   Clearly states own intuitions on A & B.  
      *   Identifies points of alignment/conflict with theories (e.g., agrees with Conseq. on B, disagrees on A).  
      *   Offers a coherent insight about desert's role (e.g., as constraint vs. goal).  
  5.  **Clarity, Structure & Exam Fitness:** (1 mark)  
      *   Well-organized, concise, addresses all parts, written under time pressure.

  **Bonus Depth (within existing criteria):** Mentioning specific concepts (e.g., *pro tanto* reasons, censure, expressive theories, hybrid views like Hart's) to enhance analysis in points 2, 3, or 4 can earn marks within those sections, but isn't required.

  ---

  ### 4. Where B Answers Go Wrong

  *   **Superficial Contrast:** Only states *that* theories differ in each case, without explaining *how* the concept of **desert fundamentally operates differently** (e.g., "Retrib says punish in A, Conseq says not; Retrib says punish in B, Conseq says not" without digging into *why* desert leads to those answers).
  *   **Misidentifying Desert's Role:** Claiming desert is "a goal" for retributivism (implying we maximize it) or treating it as a mere "factor" for consequentialism without recognizing its potential irrelevance. Failing to see desert as a *sufficient reason/constraint* in retributivism.
  *   **Ignoring the Retributivist Dilemma in B:** Oversimplifying by stating retributivism *always* requires punishment in B, ignoring the internal tension/conceptual cost of accepting catastrophic harm. Or conversely, dismissing retributivism too easily by assuming it *must* yield to consequences.
  *   **Vague Intuitions/No Synthesis:** Stating personal agreement/disagreement without explaining *what specific aspect of the theory* (especially regarding desert) causes the alignment/conflict, or failing to draw a conclusion about desert's structural role from the case comparison.

  ---

  **Why this works:**

  *   **Forces Attention to Desert's Function:** The cases isolate when desert is the *only* reason (A) and when it directly conflicts with consequences (B), making its theoretical role impossible to ignore.
  *   **Exposes Theoretical Tensions:** Case B specifically challenges the purity of both theories, revealing potential weaknesses (Conseq: ignoring desert in A feels wrong; Retrib: ignoring catastrophe in B feels wrong).
  *   **Rewards Conceptual Understanding:** Top marks hinge on accurately describing *how* desert works within each framework, not just labeling outcomes.
  *   **Accessible & Challenging:** Students can answer using core concepts taught (desert, consequences, justification), while the best can demonstrate deeper insight by exploring nuances (e.g., *pro tanto* reasons, censure, expressive theories) or synthesizing a hybrid view.
  *   **Clear Grading Rubric:** The marking scheme explicitly rewards the key insights about desert's operational role and differentiates levels of understanding.
