answer: |-
  ### Joint Statement: Adversarial Collaboration on Perception  

  #### Agreed Claims  
  1. **Phenomena Requiring Explanation**:  
     Any theory of perception must explain:  
     - **Veridical perception**: Cases where an external object is perceived accurately.  
     - **Illusion**: Cases where an external object is perceived in a distorted manner (e.g., a straight stick appearing bent in water).  
     - **Hallucination**: Cases where an experience occurs without any corresponding external object.  
     - **Subjective indistinguishability**: The possibility that a hallucination may be introspectively indistinguishable from a veridical perception.  
     - **Epistemic asymmetry**: Veridical perception typically justifies beliefs about the world, while hallucination does not.  

  2. **Criteria for Explanation**:  
     A successful theory must:  
     - Account for the *phenomenal character* (what it is like to have the experience).  
     - Explain how veridical perception provides *direct awareness* of mind-independent objects.  
     - Resolve how hallucinations can be *subjectively indistinguishable* from veridical perceptions without sharing identical metaphysical grounds.  
     - Clarify the relationship between perceptual experience and *belief formation* (e.g., how hallucinations can provoke false beliefs).  

  3. **Cases of Agreement**:  
     - **Charles Bonnet Syndrome (CBS)**: A patient hallucinates figures that appear "painted onto" the scene. Despite the vividness, she knows they are unreal during the episode. This demonstrates a *subjectively identifiable hallucination*.  
     - **Perfect Duplicate Hallucination**: A hallucination stipulated to be introspectively indistinguishable from a specific veridical perception (e.g., hallucinating a red apple identical to one seen yesterday).  

  4. **Evidential Thresholds**:  
     - Both agree that empirical findings (e.g., neuroscience, psychology) bear on the debate.  
     - **What would falsify NRD**: Discovery that veridical perceptions and indistinguishable hallucinations share identical underlying neural mechanisms.  
     - **What would falsify REP**: Discovery that indistinguishable hallucinations lack representational content/sense-data entirely.  

  5. **Common Ground for Resolution**:  
     Both agree that conclusive evidence of *neural isomorphism* (identical brain states in veridical vs. indistinguishable hallucinatory cases) would resolve the debate.  

  #### Residual Disagreements  
  | Issue | Naive Realist Disjunctivist (NRD) Phrasing | Representationalist (REP) Phrasing | Crux |  
  |-------|--------------------------------------------|------------------------------------|------|  
  | **Existence of a Highest Common Factor (HCF)** | No HCF exists as a mental event or state. Veridical perceptions fundamentally involve direct acquaintance with mind-independent objects, while hallucinations are entirely different mental kinds. Subjective indistinguishability arises from introspective limitations, not shared mental elements. | An HCF exists as a mental element (representational content or sense-data) common to veridical perceptions and indistinguishable hallucinations. This element explains their identical subjective character. | **Crux of Introspective Access** |  
  | **Substantive vs. Verbal Disagreement** | The dispute is substantive: it concerns whether perceptual experience is fundamentally relational (object-involving) or representational. Resolving it requires empirical evidence about the structure of perception. | The dispute is substantive: it hinges on whether subjective indistinguishability implies a shared mental core. Resolving it requires clarifying the ontology of perceptual states. | **Crux of Theoretical Commitments** |  
  | **Explanation of CBS** | CBS shows hallucinations lack the object-involving character of veridical perception. The patient’s knowledge of unreality arises because hallucinations do not present objects as *actually present*; they are cognitively identified as faulty. | CBS shows hallucinations share representational content with veridical perception (e.g., "figure present"). The patient’s knowledge stems from background cognition overriding perceptual content, not an absence of representation. | **Crux of Cognitive Override** |  
  | **Explanation of Perfect Duplicate Hallucination** | Perfect duplicates are only introspectively indistinguishable due to cognitive limitations. They share no mental commonality with veridical perceptions, which are constitutively tied to external objects. | Perfect duplicates prove an HCF exists: identical representational content accounts for their subjective match to veridical perceptions, regardless of external objects. | **Crux of Duplicate Indistinguishability** |  

  #### Cruxes and Predictions  
  1. **Crux of Introspective Access**  
     - **Case**: A neurosurgical patient with implanted electrodes reports a "perfect duplicate" hallucination of a blue sphere while brain activity is recorded. The same patient later veridically perceives a physically identical blue sphere.  
     - **NRD Prediction**: Neural activity will differ fundamentally (e.g., object-involving sensorimotor loops active only in veridical case).  
     - **REP Prediction**: Neural activity in sensory regions will be identical; only causal history differs.  

  2. **Crux of Cognitive Override (CBS)**  
     - **Case**: fMRI study of a CBS patient reporting a hallucinated "painted figure" while knowing it is unreal.  
     - **NRD Prediction**: Visual cortex activity will differ from veridical perception (e.g., reduced connectivity to prefrontal "reality monitoring" regions).  
     - **REP Prediction**: Visual cortex activity will match veridical perception; prefrontal cortex will show inhibitory signals overriding belief formation.  

  3. **Crux of Duplicate Indistinguishability**  
     - **Case**: A hallucination induced by transcranial magnetic stimulation (TMS) is subjectively indistinguishable from a veridical perception of a chessboard.  
     - **NRD Prediction**: TMS-induced hallucinations will lack behavioral markers of object-engagement (e.g., no pupil dilation to unexpected object changes).  
     - **REP Prediction**: Behavioral and neural signatures (e.g., pattern recognition in ventral stream) will be identical across both experiences.  

  #### What Would Move the Debate  
  - Both agree that **neural isomorphism** (identical activity in sensory regions for veridical vs. indistinguishable hallucinatory cases) would decisively favor REP.  
  - Both agree that **neural disjunction** (distinct activity patterns, with veridical cases showing unique object-coupled dynamics) would decisively favor NRD.  
  - Both reject purely a priori resolutions; empirical evidence is indispensable.
