answer: |-
  **(The control room is dim, monitors casting blue light on Dr. Ines Kovač and Prof. Tobias Reyes. On the central screen, the Visitor on Mars navigates a bustling habitat corridor. The Passenger’s “Resident” sleeps in a dormitory feed on a smaller monitor. Day 3.)**

  **Kovač:** (Gesturing at the Martian feed) Look at her. Settling in, greeting neighbors. The Resident wakes up each morning *here*, but her focus, her anticipation, is entirely *there*. She watches herself building a life she might never live. Doesn't that visceral pull suggest she already identifies with the Visitor? That the continuity is felt, even if not yet... ratified?

  **Reyes:** It suggests powerful psychological connectedness, Ines, nothing more. The Resident sees her plans unfolding, her memories being enacted, her hopes mirrored. Of course she feels a connection! But that’s all it is: connection. Degrees of similarity. Ask her *now*: is she the person walking on Mars? She’ll hesitate. And rightly so. The machine hasn’t decided yet. Her survival hinges on *its* verdict.

  **Kovač:** But that’s precisely my point, Tobias. It’s not that the machine *creates* identity; it *discovers* which candidate is the legitimate continuer. The connectedness is necessary, yes – the Visitor wouldn’t even be a *candidate* without it. But it’s not sufficient to *be* her until the process completes. Identity isn’t just about internal states; it’s about the external context of continuation. If calibration succeeds, we look back and say the person who stepped into the scanner *is* the one now on Mars. The Resident was a temporary, necessary shadow, a causal byproduct, not the true continuing subject. Death occurs *on day seven*, not at the scan.

  **Reyes:** So the Resident’s entire week – her anxieties, her hopes watching that screen, her relief if she walks out – all that subjective experience only counts if the machine fails? If it succeeds, her conscious week is retrospectively erased from the narrative of the *real* person? That feels... disturbingly eliminative. It reduces a sentient being to a conditional placeholder. Does the Resident *matter less* during this week because her status is contingent?

  **Kovač:** (Leans forward, intense) She matters immensely! But *what* matters about her? Her well-being, her experiences? Absolutely. But her *identity* as *the* continuing subject who boarded the machine? That *is* contingent. And crucially, *she* cares about that identity. Think of the promise. The Passenger promised her friend on Mars she’d repay a debt in a year. If calibration succeeds, the Visitor *is* the promise-keeper. The debt is owed *by her*. The Resident, if she were to walk out after a failure, would also be the keeper. But right now, *neither* is definitively the obligor until the process concludes. The *subject* of the promise is determined retrospectively.

  **Reyes:** But that’s precisely the arbitrariness! Why should the promise-keeper’s identity depend on a machine’s verification schedule, or how well *someone else* – the Visitor – performs on calibration tests? The underlying facts about psychological connection – the memories of making the promise, the intention to repay, the character traits ensuring reliability – those are fixed *before* the scan and replicated in both! Whether the Martian copy passes its physical diagnostics shouldn’t change *who* bears the moral weight of that commitment. The *important* thing is that *someone* with the right connections will (hopefully) repay. Fixating on which spatiotemporal path hosts those connections is a fetish.

  **Kovač:** It’s not a fetish, it’s the bedrock of responsibility! *Who* is praised or blamed? *Who* owns the actions? If the Visitor commits a crime during calibration, who stands trial? On my view, if she passes, *she* is responsible – she’s the continuer. If she fails, the Resident might be, but the Visitor was never the *same person*. On your view? It’s messy. Do we blame the degree of connectedness? That dissolves agency into a cloud of psychological states. Promises, responsibility, prudential concern – they need a *bearer*, a unified subject persisting through time.

  **Reyes:** And I say the “bearer” *is* the psychological continuity! The Resident’s prudential concern for the Visitor makes perfect sense *because* of the high degree of connectedness – she sees her plans, her personality, her very sense of self being lived out. She cares *because* it’s nearly her. But crucially, she *also* knows she might walk out. Her concern for the Visitor isn't *absolute* self-concern; it’s conditional, degreed. It’s the concern you’d have for the future of someone who is psychologically almost you. Whereas her concern for *her own* potential survival if the test fails *is* absolute self-concern. That difference in feeling maps onto the degreed reality, not a binary identity switch flipped by external events.

  **Kovač:** But then, Tobias, explain this: Why should the Resident care *more* about the Visitor passing calibration than she cares about, say, *you* passing some unrelated test? The Visitor’s success means her *death* on day seven. Yet, according to you, the Visitor is just someone psychologically very similar. Why isn’t her fear simply… misplaced? Why isn't it just irrational attachment to a copy?

  **Reyes:** (Pauses, looks at the sleeping Resident feed) Because the connection isn’t *just* similarity; it’s causal. The Visitor exists *because* of the scan of the Resident. The Resident’s psychological states *caused* the Visitor’s. That causal chain, combined with the high fidelity, makes the connection uniquely intimate. It’s not like caring about a stranger; it’s caring about the causal outcome of her own mind and body. But it’s still degreed. If she learned there was a *second*, identical Visitor created by accident elsewhere, she wouldn’t care about *its* fate with the same intensity, even though it’s equally similar. The causal history concentrates the concern. But concentration isn't binary identity.

  **Kovač:** Causal history is crucial, I agree! That’s part of what makes the *successful* Visitor the *closest* continuer – not just similar, but causally generated by the original in the right way, and surviving the original’s dissolution. The Resident shares the causal origin, but if the Visitor succeeds, the Visitor *continues the life* in the intended way; the Resident is a branch pruned. The causal chain of the *subject* flows to Mars. That’s why the Visitor’s actions are the original’s actions, her promises binding.

  **Reyes:** (Sighs, runs a hand through his hair) But the ‘pruning’… it’s dictated by a corporate policy, a timer! Suppose calibration succeeds, but due to a paperwork error, they forget to dismantle the Resident. She wakes up on day eight. Is she suddenly *not* the original? Or has a fission event occurred? On your closest-continuer view, only one can be the winner, retrospectively. But the underlying facts – two psychologically continuous beings – are identical whether the corporate axe falls or not. Your ‘determinate fact’ seems manufactured by the destruction, not discovered.

  **Kovač:** (Nods slowly) It’s a vulnerability. I concede that. The *timing* of dissolution matters. If both coexisted stably, indefinitely… yes, fission. A branching. Identity wouldn’t be determinate. But the protocol *ensures* only one survives. It creates the conditions where a single, unambiguous continuer can be designated. That’s the reality of this case. It’s not ideal, but it reflects how identity often works in practice – defined by survival and non-branching.

  **Reyes:** “Designated.” That’s the word. It feels administrative. And it makes the Resident’s existence this week profoundly strange. She’s conscious, experiencing… but whether she’s the *real* person experiencing it depends on future extrinsic events. It’s a week of… provisional subjectivity. That grates.

  **Kovač:** It does. I feel that cost. Perhaps… perhaps we should say the Resident *is* the original person *during* the week, provisionally. But her survival *beyond* the week depends on the outcome. If the Visitor succeeds, the original person effectively transfers their existence to Mars on day seven. The Earth-body was the vehicle, but the subject relocates. If the Visitor fails, the original person continues here. The death isn't at scan or day seven arbitrarily; it's the point of transfer *or* continuation. Does that ease the strangeness?

  **Reyes:** (Raises an eyebrow) Transfer? That sounds suspiciously like a soul moving house, Ines. But… it’s an interesting refinement. Less retrospective erasure. Still… (He hesitates, then speaks quietly) I bought a ticket. For the second flight. I’m scheduled in three months.

  **Kovač:** (Stares at him, genuinely startled) Tobias! You…? But why? Given your views?

  **Reyes:** Precisely *because* of my views. I believe what matters – my plans, my relationships, the projects I care about – will continue with high fidelity on Mars. The connectedness will be near-perfect. I want that future. Whether the exact metaphysical label ‘Tobias Reyes’ sticks to the Martian copy… that question seems less important than ensuring the projects continue. The degreed survival of what matters is sufficient.

  **Kovač:** (Looks intently at Reyes, then at the Martian feed) But Tobias… think of *you* in the dormitory. Watching *your* copy walk around Mars. Knowing that in seven days, you might be painlessly ended… or you might walk out. Can you truly tell me that prospect feels identical to, say, knowing a very similar clone of you is being built? That your prudential fear for your own potential cessation is *just* misplaced attachment? That the terror the Resident likely feels on day six, staring at the active Visitor, is irrational?

  **Reyes:** (Looks at the sleeping Resident, then down at his hands. A long pause) No. I can’t say that. The fear… the visceral fear of non-existence… it’s primal. It doesn’t neatly map onto degrees. It feels… absolute. Targeting *me*. That feeling… it’s a powerful datum. It pushes back against pure reductionism. On day six, if I were the Resident, I would desperately want the Visitor to fail. Not because I hate him, but because I want *to be*. That feeling demands an account. Perhaps… perhaps the *indexicality* – the raw “I”-ness – is a feature of consciousness itself that isn't fully reducible to connections, even causal ones. It might be an illusion, but it’s a phenomenologically potent one that shapes our self-concern in ways the degreed view struggles to capture perfectly. My view explains the *rational* concern, the grounding in what matters. But the brute fear… that might point to a deeper, perhaps irreducible, subjective anchor. That’s a concession.

  **Kovač:** And I concede that my view makes the Resident’s week ontologically precarious. Her status hangs on a future event. That *is* strange. Perhaps we need to think of the continuing subject not just retrospectively, but as having a forward-looking trajectory that *can* branch, but in this case, the protocol forces a convergence onto one path. The ‘subject’ isn't wiped clean; its path is resolved. But the feeling of being that provisional subject… it’s uniquely unsettling.

  **Reyes:** So, the Passenger. The one currently sleeping over there. What’s the question of *her* survival *about*, for us, now? For you?

  **Kovač:** It’s about which unique, persisting entity – the continuing subject who stepped into the scanner – will inherit the future: the one in the dormitory or the one on Mars? The answer depends on which candidate successfully inherits the causal and narrative thread without branching, as determined by the outcome. The ‘who’ matters because subjects bear responsibility, hold promises, and are the objects of prudential concern in an absolute, non-degreed way. The protocol forces the binary answer.

  **Reyes:** And for me? The question, “Will *I* survive?” is poorly formed. It smuggles in a binary assumption that doesn't fit the underlying reality. The better questions are: “How much of what makes me *me* – my memories, character, values, projects – will continue?” and “Which future being will bear the strongest psychological and causal connection to me now, and thus warrant my prudential concern and be recognized as responsible for my commitments?” Here, the answer to the second is clear: overwhelmingly the Visitor if he passes, or the Resident if he fails. The first is answered by the high degree of connectedness in both, though one stream will be extinguished. The *absolute* survival of the ‘I’ isn't the fundamental fact; the preservation and continuation of what constitutes the person is. The protocol obscures that by demanding a sacrifice.

  **Kovač:** We still disagree, then. Fundamentally. About whether the ‘who’ is reducible.

  **Reyes:** Profoundly. But we disagree more clearly. You see survival as the non-branching persistence of a continuing subject, resolved by external events. I see it as the sufficient preservation of psychological and causal connectedness, making the ‘who’ question secondary. The Passenger’s fear… and my future dread… they highlight the gulf.

  **Kovač:** (Looks back at the Martian Visitor, now sitting in a habitat cafe, sipping something) They do. And watching him… makes both views feel simultaneously plausible… and inadequate. The mystery persists.

  **Reyes:** (Nods, also watching) Yes. The mystery persists.
