  For dueling: Yes, it maps neatly to signaling theory—accepting mortal risk was indeed a costly signal to maintain status in the honor group. But Appiah would argue the collapse wasn't just about signal cost; it was a shift in what the peer group valued. When moral critics reframed dueling as cowardice, the signal became negative. Game theory captures the mechanics but misses the meaning-change. 

  Foot-binding: The anti-binding societies were absolutely a coordination device—a Schelling-esque focal point to solve the marriage market dilemma. Families needed assurance others would defect too. This is game theory's sweet spot, though Appiah might add that the pledge also leveraged moral persuasion ("it's cruel") to make coordination feel obligatory. 

  Abolition: Here the user's "interest-group" take feels reductive. Game theory can model abolitionists as entrepreneurs shifting payoffs via boycotts or changing narratives, but Appiah insists moral arguments disrupted the "psychic economy" of participants—e.g., sailors on slave ships developing revulsion. The residue is thick here: internalized spectators (guilt), moral deafness lifting. 

  Residue report: Dignity, changing hermeneutic capacity, the internalized spectator—these have no clean game theory analogs. They're about how discourse reshapes preferences/meanings, not just incentives. Game theory isn't "wrong," but it flattens the role of moral persuasion. The honor explanation's real added value is showing how social recognition isn't just a payoff—it's the scaffold for identity. 

  User's training means they'll appreciate precise mappings (separating equilibria! network effects!), but I should emphasize where reduction loses nuance. Their podcast-level philosophy knowledge is a cue to avoid jargon like "hermeneutic injustice" unless explained. American English phrasing is requested—so no "whilst" or "amongst." 

  Biggest tension: Game theory excels at mechanics; Appiah cares about why the mechanics crumbled. The residue suggests game theory misses how moral arguments reconstitute the game itself—what counts as a "cost" or "benefit." But that doesn't mean honor is doing less work; it's just operating at a different (constitutive) level. 

  Final output should mirror their style: crisp, skeptical of fluff, with clear "translation/distortion/residue" labels. They'll want the payoff in the last paragraph—whether the gaps imply game theory's limits or honor's thinness. (My take: former, but honor still needs the social scaffold.)
answer: |-
  Here's the translation of Appiah's moral revolutions into game theory vocabulary, with honesty assessments and a residue report:

  ### Case-by-Case Translation
  1. **Dueling Collapse (English Gentry)**  
     - **Game Theory Translation**: A *separating equilibrium* where willingness to duel served as a costly signal of honor/status. Collapse occurred when:  
       (a) Signaling costs became prohibitively high (rising mortality/legal risks)  
       (b) The *receiver's valuation* changed: Elite peers began interpreting refusal to duel as *courageous integrity* (new focal point) rather than cowardice.  
     - **Honesty Rating**: **Largely Honest**. Captures the signaling structure and coordination shift. Distorts by underplaying how moral arguments *redefined* the signal's meaning (not just changed costs).

  2. **Foot-Binding Abolition (China)**  
     - **Game Theory Translation**: A classic *coordination game with network effects*. Anti-binding societies engineered:  
       (a) A *public commitment device* (pledges)  
       (b) A *Schelling focal point* ("no binding + no intermarriage")  
       (c) *Punishment strategy* (marriage boycott) to enforce compliance.  
     - **Honesty Rating**: **Highly Honest**. Nails the coordination mechanics. Minor distortion: Downplays how moral shame (not just marriage markets) leveraged the commitment device.

  3. **Atlantic Slave Trade Abolition**  
     - **Game Theory Translation**: An *audience cost* model. Abolitionists:  
       (a) Increased *salience* of slave trade brutality (changing payoff perceptions)  
       (b) Created *reputational costs* for participants via pamphlets/artifacts (e.g., Brookes slave ship diagram)  
       (c) Triggered *cascade effects* as elite endorsement shifted social norms.  
     - **Honesty Rating**: **Partially Distorted**. Correctly identifies interest groups and payoff shifts, but obscures Appiah's core point: Moral arguments made participation *psychologically intolerable* for many, not just costly. Framed it as a *dignity violation* rather than pure interest calculation.

  ---

  ### Residue Report: What Game Theory Doesn't Capture  
  Appiah's irreducible elements and their implications:  

  | Concept                          | Why It Doesn't Map Cleanly                                 | Game Theory Gap vs. Honor Explanation |
  |----------------------------------|------------------------------------------------------------|---------------------------------------|
  | **Dignity**                      | Not a payoff or signal cost. A *constitutive value* defining what counts as "winning" in the social game. | **Game theory misses**: Preferences aren't fixed—moral arguments *transform* what agents value. |
  | **Moral Deafness → Hearing**     | Changing "what a group can hear" alters *hermeneutic capacity*, not just information sets or incentives. | **Honor explanation doing heavy lifting**: Peer recognition depends on shared interpretive frameworks. |
  | **Internalized Spectator**       | The "honor world" becomes introjected (guilt/shame), creating endogenous preference shifts. | **Both**: GT lacks tools for endogenous preference change, but honor requires this internalization to stick. |
  | **Mistic Attunement**            | Revolutions succeed when arguments *resonate* with latent group self-conception ("This isn't us") | **Game theory missing**: Payoffs don't explain why certain framings succeed while others fail. |

  ---

  ### Verdict on the Residue  
  - **What Game Theory Misses**:  
    The *meaning-making machinery* of moral change. Game theory models how incentives shift behavior *within fixed preferences*, but Appiah shows moral arguments **reconstitute preferences themselves** by altering:  
    - What counts as a "cost" (e.g., participation becoming *unthinkable*)  
    - The source of utility (e.g., dignity > social approval)  
    - The definition of the "game" (e.g., dueling transitions from honor-maintenance to barbarism)  

  - **What Honor Explanation Overclaims**:  
    The *mechanics* of collapse (coordination, signaling costs) are perfectly explicable in game theory. The honor framework *depends* on these mechanics to operationalize its concepts—peer recognition requires observable signals.  

  **Bottom Line**: Game theory captures the *how* of these revolutions (coordination devices, equilibrium shifts), but Appiah's residue explains the *why now*—the catalytic role of moral arguments in reconfiguring the game itself. The "internalized spectator" is the bridge: Honor worlds collapse when the cost of ignoring your conscience exceeds the cost of peer disapproval. **GT isn't wrong, but it's ontologically thin**—it needs Appiah's layer to explain why certain costs suddenly matter.
