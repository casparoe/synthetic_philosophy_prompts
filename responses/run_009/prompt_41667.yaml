  Okay, the user is a game theorist asking me to translate Kwame Anthony Appiah's account of moral revolutions—specifically the collapse of dueling, end of foot-binding, and abolition of the Atlantic slave trade—into game theory vocabulary. They mention concepts like signaling games, coordination problems, and equilibrium selection. 

