answer: |-
  Below is a decision tree for the units-of-selection debate, built from your commitment that adaptations exist and require selection-based explanations. Each branch is a question answerable using concrete cases (including your provided examples: segregation distorter, cancer, hitchhiking allele, eusocial insects, and genetic algorithms with parasitic subroutines). Technical terms are defined on first use.  

  **Decision Tree:**  
  0. **Start:** Adaptations exist and must be explained by natural selection.  

  1. **Is there an adaptation that benefits a sub-organism entity (e.g., gene, cell) at the organism's expense?**  
     *Case: Segregation distorter (allele that biases meiosis to spread itself, reducing organismal fitness)*  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  2. **Is there an adaptation that benefits a group at the organism's expense?**  
     *Case: Sterile workers in eusocial insects (help colony reproduction but don't reproduce themselves)*  
     - **No** → **Organism-centered selection** (adaptations always benefit individual organisms; e.g., classic Darwinism).  
     - **Yes** → Go to 4.  

  3. **Does the sub-organism adaptation require gene-level replication to spread?**  
     *Case: Segregation distorter (depends on gene copying during meiosis; cancer cells replicate independently but aren't inherited)*  
     - **No** → *Unnamed combination* (e.g., cell-level selection in cancer; rare as a general theory, likely incoherent for inherited adaptations).  
     - **Yes** → Go to 5.  

  4. **Can the group adaptation be fully explained by gene-level replication (e.g., kin selection)?**  
     *Case: Eusocial insects (genes for worker sterility spread via relatives' reproduction; no group fitness "replication" required)*  
     - **No** → **Multilevel/Group selection** (groups are units of selection; e.g., D.S. Wilson).  
     - **Yes** → Go to 5.  

  5. **In genetic algorithms, can parasitic subroutines spread without contributing to fitness?**  
     *Case: Hitchhiking subroutine (spreads only because linked to beneficial code; not an adaptation itself)*  
     - **No** → *Unnamed combination* (unexplored; most models allow passive spread).  
     - **Yes** → Go to 6.  

  6. **Is the gene (or replicator) the only entity whose selection explains all adaptations?**  
     *Cases: Hitchhiking allele (not selected, just carried); segregation distorter (selected directly); eusociality (kin-selected genes)*  
     - **No** → **Bookkeeping convenience** (choice of unit is pragmatic; e.g., Steven J. Gould's "pluralism").  
     - **Yes** → **Gene's-eye view** (genes are the unit of selection; e.g., Richard Dawkins).  

  **Caveats & Clarifications (per Constraints):**  
  - **Constraint 3 (Indistinguishable Leaves):** The **gene's-eye view** and **bookkeeping convenience** cannot be separated by case-based questions alone. Both explain all cases (e.g., segregation distorter = selfish gene, eusociality = kin-selected genes). Moving between them requires philosophical considerations:  
    - *Gene's-eye view*: Favored if replicator dynamics (inherited information) are seen as fundamental.  
    - *Bookkeeping*: Favored if different units (gene, organism, group) are viewed as interchangeable modeling tools.  
    - *Example*: Your GA—selecting whole programs (bookkeeping) vs. tracking subroutines (gene's-eye)—yields identical outcomes but different narratives.  

  - **Key Definitions:**  
    - **Adaptation**: A trait evolving via selection to provide a functional advantage.  
    - **Replicator**: Entity copied with fidelity across generations (e.g., gene).  
    - **Hitchhiking**: Passive spread of a trait due to linkage to a selected trait.  

  - **Unnamed Positions:** Only at leaves with no clear adherents; noted as incoherent (e.g., cell-level selection ignores inheritance) or unexplored.  

  **Tree Logic Summary:**  
  - **Organism-centered** emerges only if sub-organism/group adaptations are rejected (rare today).  
  - **Multilevel selection** requires group adaptations irreducible to genes.  
  - **Gene's-eye view** and **bookkeeping** cover identical cases but differ ontologically.  

