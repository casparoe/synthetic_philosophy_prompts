answer: |-
  Here is a draft joint statement in British English, structured as requested. It identifies common ground, formulates disagreements acceptably to each side, highlights the cruxes with testable predictions, and addresses potential verbal disputes.

  **Joint Statement on Universals: Draft for Review**

  **1. Agreed Claims:**
      1.  **The Phenomenon to be Explained (The One-Over-Many):** There is a genuine phenomenon requiring explanation: the apparent fact that numerically distinct particular things can be characterised in the same way (e.g., "This rose is red," "That postbox is red," "This blood sample is red").
      2.  **Predication Needs Grounding:** The meaningfulness and truth of predication (e.g., "Socrates is wise," "Electrons are negatively charged") is not primitive; it requires explanation in terms of what exists and how those things relate.
      3.  **Resemblance Needs Explaining:** The pervasive fact that particulars resemble each other (e.g., two red things resemble each other in colour, two electrons resemble each other in charge and mass) is a genuine feature of the world requiring an ontological explanation beyond simply noting the resemblance.
      4.  **The Linguistic Data:** Natural language, science, and mathematics frequently employ quantification over properties, kinds, and relations (e.g., "Red is a colour," "There are properties essential to life," "The set of prime numbers has properties distinct from the set of even numbers"). This linguistic practice is a significant datum for our theories.
      5.  **Abstract Objects in Mathematics:** The apparent truth of mathematical statements (e.g., "2 + 2 = 4," "There are infinitely many prime numbers") seems to commit us to the existence of abstract objects (like numbers, sets, functions) that are not located in space or time and are causally inert.
      6.  **The Core Disagreement is Ontological:** Our dispute is not merely verbal *in its core*. We agree there are concrete particulars. We fundamentally disagree about what *else* exists in our most basic inventory of reality to explain points 1-5. Specifically, we disagree whether the explanations for 1, 2, 3, and the commitments noted in 4 and 5 require the existence of universals (repeatable entities) *in addition to* particulars and linguistic/conceptual practices.
      7.  **Non-Disputes:** The dispute is *not* about:
          *   Whether concrete particulars exist (we both affirm they do).
          *   Whether language involves predicates and abstract terms (it clearly does).
          *   Whether we *talk* about properties, kinds, and resemblances (we clearly do).
          *   Whether conceptual schemes or linguistic frameworks are useful (they clearly are).
          *   Whether there are patterns or regularities in the world (there clearly are).

  **2. Disagreements:** (Formulated for Acceptance by Each Side)

  | Issue                                                                 | Realist Position (Acceptable Wording)                                                                 | Nominalist Position (Acceptable Wording)                                                                 |
  | :-------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- |
  | **Existence of Universals**                                           | Universals (mind-independent, repeatable entities) exist and are fundamental constituents of reality. | Universals do not exist; reality consists solely of particular things (concrete and/or abstract).        |
  | **Grounding of Resemblance & Shared Characterisation**                | The resemblance between particulars and their shared characterisation is ultimately explained by their common instantiation of the same universal(s). | Resemblance is either a fundamental relation holding directly between particulars, or analysable in terms of the particulars' intrinsic natures, without invoking universals. Shared characterisation is explained by facts about language and the intrinsic features of particulars. |
  | **Quantification over Properties/Kinds in Science & Natural Language** | This quantification genuinely refers to, and commits us ontologically to, universals as real entities. | This quantification is a useful linguistic device that can be systematically paraphrased away without ontological commitment to universals, referring ultimately only to particulars (and perhaps classes/sets of them, understood nominalistically). |
  | **Ontological Status of Mathematical Abstracta**                      | The abstract objects mathematics commits us to (e.g., numbers, sets) are universals or inherently involve universals in their nature. | The abstract objects mathematics commits us to (e.g., sets) are distinct *particulars* (e.g., classes understood extensionally as collections), not universals; their existence does not entail realism about universals. |

  **3. Cruxes and Testable Predictions:**

  | Crux                                                                                                                               | Shared Question / Evidence that Would Bear on the Crux                                                                                                                               | Realist Prediction                                                                                             | Nominalist Prediction                                                                                                                    |
  | :--------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Paraphraseability of Scientific/Maths Quantification:** Can quantification over properties/kinds/relations in established scientific theories and mathematical practice be *systematically and without loss of meaning or explanatory power* paraphrased into statements committing only to particulars (including abstract particulars like sets) and their non-universal features? | The successful development and widespread acceptance by the scientific/mathematical community of a comprehensive, workable nominalist paraphrase scheme for key theories (e.g., fundamental physics, evolutionary biology, number theory). | No such fully adequate, non-ad-hoc paraphrase scheme for essential scientific/mathematical discourse is possible. Attempts will either fail to capture meaning/explanatory power or tacitly reintroduce universals. | Yes, such a paraphrase scheme is possible in principle and demonstrable in practice. Science and maths quantify over properties/kinds only as a useful *façon de parler*, not as ontological commitment. |
  | **2. Ontological Commitment of Resemblance Classes:** Does taking resemblance classes (or sets of resembling particulars) as fundamental entities to explain shared characterisation inevitably reintroduce universals or collapse into realism? | Careful analysis of the ontological commitments involved in positing resemblance classes/sets as basic. Does explaining *why* a particular belongs to a specific resemblance class require reference to a universal shared by all members? | Yes. Merely positing the class/set does not explain *why* its members resemble each other. This explanation *requires* a universal (the respect of resemblance) instantiated by each member, making the class derivative. | No. Resemblance classes/sets are legitimate particular entities (collections). The resemblance relation holding between members (or their intrinsic tropes) is fundamental or analysable without universals; class membership supervenes on this. |
  | **3. Significance of Mathematical Abstracta:** Does the apparent commitment to abstract objects (like numbers) in true mathematical statements *settle* the realism/nominalism debate about universals? | Analysis of whether the abstract objects required by mathematical truth (e.g., numbers, sets) must intrinsically possess the characteristic of being universals, or whether they can be understood as a distinct kind of particular. | Yes. Numbers (e.g., the number 3) are paradigmatic universals – they are repeatable, non-spatiotemporal entities whose instances are groupings of three particulars. Sets, if understood intensionally, also imply universals. | No. Mathematical abstracta like sets are distinct *particular* objects (e.g., extensional collections). Numbers can be reduced to sets (particulars) or understood as positions in structures, not universals. Their existence is orthogonal to the realism/nominalism debate about properties. |

  **Note on Verbal Disputes:**
  We acknowledge that *some peripheral aspects* of our disagreement might involve terminological preferences (e.g., the exact scope of the word "property" or "abstract"). **However, the core ontological disagreement outlined above (Agreed Claim 6) is not merely verbal.** We genuinely differ on the fundamental structure of reality: one view posits repeatable universals as irreducible constituents, the other insists reality is exhausted by particulars. The cruxes identified are substantive points where our theories make different predictions about what explanations are possible and what ontological commitments are ultimately required.

  **Conclusion:**
  This statement clarifies our common ground and the precise nature of our disagreement. The identified cruxes offer a constructive path forward: rather than restating entrenched positions, we can focus debate on whether the Nominalist can meet the challenge of Crux 1, whether the Realist critique of Crux 2 holds, and whether Crux 3 truly impacts the core debate. Future discussion should prioritise developing and evaluating specific proposals related to these cruxes.
