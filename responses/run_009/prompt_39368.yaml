prompt: |-
  Two of my friends have been arguing about universals since basically the start of our course and it's got completely stale. One is a realist about properties (she thinks resemblance and shared特征 no wait ignore that -- she thinks resemblance needs explaining and only universals can do the job, and that maths forces abstract entities on us anyway). The other is a nominalist (he says there are only particulars, and 'sharing a property' is just a façon of talking that needs paraphrasing away, not a fact about what there is). They've finally agreed to stop shouting at each other and write something together instead, and they've asked me to draft the joint statement. Can you do it for me? I want the claims both of them could actually sign -- about what genuinely needs explaining (the one-over-many, predication, resemblance), about what the dispute isn't merely verbal over; then the residual disagreements, each worded so the side it concerns would accept the wording; then the cruxes; and for each crux something both sides agree would bear on it, with each side's prediction written down. I suspect some of the cruxes are: whether the nominalist can paraphrase the quantification over properties that science and maths seem to commit us to, whether resemblance nominalism quietly collapses back into realism once you quantify over resemblance classes, and whether abstract reference in arithmetic settles anything. If you think part of their dispute is just verbal, say which part and why. Format it as a numbered agreed-claims section followed by a disagreements table. Please write the whole thing in British English.
