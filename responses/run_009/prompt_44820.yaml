prompt: |-
  Does the following configuration have a name? I'm the numbers person on a three-member grant panel for a small research foundation (my day job is clinical trial statistics, so excuse me if I'm using the wrong words for all this). Our rule is that a proposal gets funded only if it clears all three of our criteria -- significance, feasibility, and what we call "capacity to deliver". Last month: reviewer 1 (me) scored the proposal as clearing all three, so I voted to fund; reviewer 2 cleared significance and feasibility but not capacity, so following the rule she voted against; reviewer 3 cleared significance and capacity but not feasibility, so he voted against too. Final tally: don't fund. But if you tally each criterion separately, significance clears 3-0, feasibility clears 2-1, capacity clears 2-1 -- so criterion by criterion the panel thinks the proposal clears everything, and the panel also unanimously endorses the rule "fund only if all three are cleared", and yet the panel majority votes not to fund. Nobody made an arithmetic error and nobody was being sneaky; each of us is individually perfectly consistent. It's like the panel as a whole believes three things that can't all be true at once, even though no member does.

  Two things I want to sort out. First: a colleague on the panel who took some econ says this is "Arrow's theorem, obviously", and another says it's the Condorcet cycling thing, but I don't see how it can be either of those -- there are no rankings and no cycle anywhere in sight, just yes/no judgments on questions that are logically connected to each other. So is there an actual established concept for exactly this, and how does it relate to (or differ from) those two, assuming I'm remembering them right? Second: someone proposed fixing it by rewording the rule as "reject if it fails any single criterion", claiming rejection would then follow the majority. I checked on paper and this changes literally nothing -- same votes, same outcome, it's just relabeling. But when I played with a genuinely different rule, "fund if it clears even one criterion", I could build the mirror image: every criterion fails by majority and the panel still votes unanimously to fund. So it doesn't feel like rewording can fix anything, only flip who benefits. Am I right about that, and is there any principled way to aggregate our judgments that avoids the problem altogether without collapsing into "let the chair decide" (which one member actually proposed, ha)?

  To be clear, I'm not looking for a reading list or references -- just the concept, if it exists, what exactly its edges are (what counts as an instance, what doesn't, how it's different from the nearest neighbors), and whether the "no way out without giving something up" intuition is actually correct.
reasoning: |-
  Okay, the user is a statistician working on a grant panel. They've encountered a situation where individual reviewers' votes on specific criteria seem to collectively approve each criterion, but the final decision contradicts this when applying the "fund only if all criteria are met" rule. They're confused about how this paradox occurs and whether it relates to Arrow's theorem or Condorcet cycles.

  First, I need to understand their scenario. There are three reviewers and three criteria. Each reviewer evaluates whether the proposal meets each criterion, leading to a vote on funding based on the rule that all criteria must pass. The votes show that each criterion has majority approval, but the funding decision fails because no single reviewer sees all criteria as passed.

  The user mentions colleagues referencing Arrow's theorem and Condorcet paradox. Arrow's theorem deals with ranking preferences and requires certain conditions, which don't apply here since they're making separate yes/no judgments on criteria, not ranking proposals. Condorcet paradox involves cyclical majorities in rankings, which isn't happening here. So this situation is different.

  The key here is the aggregation of judgments. Each reviewer consistently applies the rule individually, but when combined, the group's aggregated judgments on the criteria conflict with the funding outcome. This resembles the doctrinal paradox or discursive dilemma. That's when individual logical judgments lead to a collective inconsistency.

  The user also tried changing the rule wording but found it didn't help. For example, saying "reject if any criterion fails" is logically the same as "fund only if all pass." And flipping to "fund if any criterion passes" creates the opposite problem. So rewording doesn't resolve the paradox; it just shifts which side benefits. 

  They asked if there's a principled way to avoid this without letting the chair decide. The doctrinal paradox shows that no method can satisfy all desirable properties simultaneously. Prioritizing criteria or using sequential voting might help but introduces other biases. Ultimately, some trade-off is necessary, like accepting inconsistency or delegating the final decision.

  The user's deeper need is likely finding a fair and consistent method for decision-making in their panel. They want to understand why this happens and if there's a solution without sacrificing fairness. Recognizing this as the doctrinal paradox helps them see it's a known issue with no perfect fix, which validates their experience and guides them towards practical compromises.
answer: |-
  You've stumbled upon a classic and fascinating problem in judgment aggregation: the **Doctrinal Paradox** (also known as the **Discursive Dilemma**). This is *not* Arrow's Impossibility Theorem or the Condorcet Paradox, although it shares some thematic similarities about the difficulty of aggregating individual judgments into a coherent collective decision.

  **Here's why the Doctrinal Paradox fits perfectly:**

  1.  **Structure:** There is a **compound decision** (Fund? Yes/No) that depends logically on several **premises** (the criteria: Significance, Feasibility, Capacity).
  2.  **Rule:** The compound decision follows a **strict logical rule** (Fund if and only if Significance *AND* Feasibility *AND* Capacity are cleared).
  3.  **Individual Consistency:** Each individual reviewer applies the logical rule correctly to their *own* judgments of the premises to reach their conclusion on the compound decision. They are perfectly consistent.
  4.  **Collective Inconsistency:**
      *   When you aggregate the judgments on the *conclusion* (Fund?), the majority says "No".
      *   When you aggregate the judgments on the *premises* (each criterion), the majority says "Yes" to *every single premise*.
      *   Applying the *same logical rule* ("Fund iff all premises are Yes") to the *majority judgments of the premises* leads to the conclusion "Fund".
      *   **This creates a contradiction:** The majority conclusion ("No Fund") directly contradicts the conclusion logically derived from the majority premises ("Fund").

  **Your Example:**

  *   **Premises (Criteria):**
      *   Significance: Majority Yes (3-0)
      *   Feasibility: Majority Yes (2-1)
      *   Capacity: Majority Yes (2-1)
      *   *Premise Majority Conclusion:* Fund? = Yes (All premises Yes)
  *   **Conclusion (Decision):**
      *   Fund? Majority: No (1 Yes, 2 No)
  *   **Contradiction:** Premise Majority says Fund, Conclusion Majority says Don't Fund.

  **How it Differs from Arrow & Condorcet:**

  *   **Arrow's Theorem:** Concerns aggregating *rankings* (ordinal preferences) over *alternatives* (proposals) into a social *ranking*. It requires specific conditions (like IIA) and shows no voting system can satisfy them all. Your situation involves aggregating *binary judgments* on logically *interconnected premises* to reach a *single binary conclusion*, not ranking alternatives. The logical connection between premises and conclusion is central here, unlike Arrow.
  *   **Condorcet Paradox:** Concerns cyclical *majority preferences* over *alternatives* (e.g., A>B, B>C, C>A). It's about inconsistencies in *pairwise comparisons* when aggregating rankings. Your situation has no pairwise comparisons between proposals and no cyclical rankings. The inconsistency arises between the aggregated premise judgments and the aggregated conclusion judgment under a fixed logical rule.

  **The "Rewording" Fix is Illusory (You Are Correct):**

  *   Changing "Fund only if all pass" to "Reject if any fail" is just **logical negation**. If `Fund = P1 AND P2 AND P3`, then `Reject = NOT (P1 AND P2 AND P3) = NOT P1 OR NOT P2 OR NOT P3`. It's the exact same rule, expressed differently. The voting pattern remains identical: if one voter sees a failure, they vote to reject. The paradox persists unchanged.
  *   Changing the rule fundamentally (e.g., "Fund if any pass") flips the paradox. Now, a proposal might fail every criterion by majority (P1: 1-2 No, P2: 1-2 No, P3: 1-2 No) but still get funded if one reviewer thinks *one* criterion passes (Fund = P1 OR P2 OR P3). Majority premises say "Reject" (all No), majority conclusion says "Fund" (if the one Yes vote wins the conclusion vote). This is the **Dual Doctrinal Paradox**.

  **Is There a Principled Way Out? (The Hard Truth)**

  The core lesson of the Doctrinal Paradox is that **there is no perfect way to aggregate individual judgments on logically connected premises and conclusions that guarantees consistency under majority rule for all possible profiles.** You cannot simultaneously satisfy all of the following intuitively desirable properties:

  1.  **Universal Domain:** Any pattern of individual judgments is allowed.
  2.  **Logical Consistency:** The collective judgment set is logically consistent (e.g., if premises imply `Fund`, the collective can't say `~Fund`).
  3.  **Systematicity/Deduction Closure:** If individuals unanimously agree on premises implying a conclusion, the collective must agree on that conclusion (and the collective judgment on conclusions should respect the logical connection to premises).
  4.  **Majority Rule on Premises/Conclusions:** Collective judgments on premises/conclusions are based solely on majority vote over individual judgments on those items.

  **Your intuition ("no way out without giving something up") is fundamentally correct.** Here are the main approaches, each sacrificing something:

  1.  **Premise-Based Procedure:** Vote *only* on the premises (criteria) by majority, then *deduce* the conclusion (Fund/Reject) using the logical rule.
      *   *Sacrifices:* Individual judgments on the *conclusion* are ignored. The conclusion is dictated by the premise votes. In your case, this would lead to "Fund".
      *   *Issue:* Ignores the reviewer's holistic view. A reviewer might vote "No" on funding not just based on criteria, but on an overall gestalt feeling the premise-based method overrides.
  2.  **Conclusion-Based Procedure:** Vote *only* on the conclusion (Fund/Reject) by majority. Ignore the specific premise judgments.
      *   *Sacrifices:* Ignores the detailed reasoning (premise judgments) entirely. The logical connection to the criteria is broken at the collective level. In your case, this leads to "Reject".
      *   *Issue:* Loses valuable information about *why* the decision was made. Doesn't ensure decisions align with the stated criteria rules.
  3.  **Sequential Voting:** Vote on premises in a specific order, deriving intermediate conclusions that constrain later votes. (e.g., Vote Significance first. If majority No, reject. If Yes, vote Feasibility. If majority No, reject. If Yes, vote Capacity. If majority Yes, fund.)
      *   *Sacrifices:* The collective outcome **depends on the order** of voting. Different orders can lead to different final decisions. It's path-dependent and manipulable. It also doesn't guarantee consistency with an overall vote on the conclusion.
  4.  **Super-Majority / Qualified Majority Rules:** Require more than a simple majority for premise or conclusion votes. Makes paradox less likely but doesn't eliminate it and can lead to gridlock.
  5.  **Delegation / Chair Decides:** Ultimately sacrifices collective decision-making for consistency. Someone (chair, expert) makes the final call based on all inputs.
      *   *Sacrifices:* Democratic aggregation principle.

  **In Summary:**

  *   **The Concept:** **Doctrinal Paradox (Discursive Dilemma).**
  *   **Edges:** It arises specifically when aggregating individual binary judgments on logically interconnected premises and a conclusion defined by a strict logical function (like AND, OR) of those premises, using majority rule on each component independently. Key differences from Arrow/Condorcet: focuses on binary judgments and logical connections, not rankings/preferences over alternatives.
  *   **The Fix:** **There is no universally fair, consistent, and democratic fix.** You *must* sacrifice one desirable property:
      *   Ignore individual conclusion judgments (Premise-Based).
      *   Ignore individual premise reasoning (Conclusion-Based).
      *   Introduce path-dependence (Sequential Voting).
      *   Make decision harder (Super-Majority).
      *   Centralize authority (Chair/Delegation).

  Your panel needs to consciously decide *which* property it values most and choose an aggregation method accordingly. Recognizing it's a known paradox (not an error) is the crucial first step. The "chair decides" proposal, while sacrificing pure democracy, is one way to break the paradox by avoiding aggregation altogether. Premise-Based voting is often seen as more "rational" as it enforces the logical rule on the collective judgment of the criteria, but it overrides the reviewers' final funding votes. There's no perfect answer, only trade-offs.
