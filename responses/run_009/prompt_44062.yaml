  working title of my diss chapter is something like "what do money pump arguments actually prove" and i've realized i keep treating the escape routes (resolute choice, sophisticated choice, saying preferences are only over maximal options, just accepting the pump because exploiters are rare) as interchangeable ways of dodging the same bullet. before i commit to defending any one of them, i want the spec: what does an adequate response to the money pump have to deliver? i assume it has to block every pump, not just the standard one-shot version -- does that include pumps where the exploiter conditions on your past choices, pumps with transaction costs, pumps where you only lose in expectation? it has to say whether the putative irrationality lives in the preference structure itself or only in the disposition to choose in a certain order, and it can't smuggle in backward induction or separability of decisions as an independent premise, since those are basically what's at issue. and i have a suspicion some of the desiderata conflict -- like, if you demand the agent be exploit-proof in every possible sequence, you may be forced into resolute choice, which then seems to give up on the idea that your later self's preferences matter at all, so a requirement meant to save diachronic coherence ends up eating the diachronic part. so: give me the requirements list with the case behind each, mark which are genuine adequacy conditions versus camp prejudices wearing lab coats, flag any pair you think can't be jointly satisfied (that part i most want to see, since if its unsatisfiable that might itself be the chapter), and tell me which single requirement does the most to knock out candidate responses. no scorecard at the end, i'll do that part myself.
