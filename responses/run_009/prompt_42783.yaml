answer: |-
  ## Q&A Prep Sheet: Oxford Legal Theory Workshop  
  **Thesis:** The retroactivity defence at Nuremberg/IMTFE requires open acknowledgment of victors' legislative constituent power, not standard doctrinal moves (Kellogg-Briand, natural law, Radbruch). Framing tribunals as adjudication corrupted international criminal law’s (ICL) development.  

  **Core Stance to Maintain:**  
  - **Concede:** The tribunals *were* victors’ justice; constituent power *is* extra-legal; this approach *does* risk future abuse.  
  - **Hold Firm:** Standard defences are intellectually dishonest; retroactivity was real; admitting legislative act is *less* corrosive long-term than natural law fudges.  
  - **Soft Spot:** Constituent power lacks inherent limits; ICL’s legitimacy-damage claim needs more historical evidence.  

  ---

  ### Ranked Objections & Replies (Highest Damage First)  
  *(Phrased as Audience Would Speak)*  

  1. **The Hartian Positivist (Predictability Critic):**  
     *"You’ve simply conceded the ‘victors’ justice’ critique while gutting the rule of law. If tribunals exercised raw constituent power retroactively, what distinguishes this from arbitrary vengeance? How does this *not* destroy law’s core function – guiding conduct ex ante?"*  
     **Reply:** "The distinction lies in *transparency* and *prospective commitment*. Arbitrary vengeance disguises itself as law; here, we admit the extra-legal moment while codifying its output *as* new law for the future. This preserves law’s guidance function *post*-constitution by honestly segregating the revolutionary act from the new legal order. Dishonest retroactivity under natural law pretenses corrodes guidance far more insidiously."  
     **Softness:** Doesn’t fully resolve how future actors distinguish legitimate constituent acts from tyranny. Relies on normative hope for institutionalisation.  

  2. **The Radbruch Scholar (Moral Truth Advocate):**  
     *"Why reject Radbruch’s formula? The Nazis’/Imperial Japan’s laws *were* intolerably unjust, forfeiting legal validity. The tribunals didn’t create new law retroactively; they recognised the *preexisting* natural crime beneath the positivist facade. Your ‘constituent power’ framing denies law’s necessary connection to justice."*  
     **Reply:** "Radbruch’s formula is a powerful *moral* critique, but as *law* it’s dangerously indeterminate. Who defines ‘intolerable’? When does injustice void *all* legal effects vs. specific norms? My argument accepts Radbruch’s moral verdict but insists the *legal* response required a rupture – a legislative act. Kelsen was right: openly declaring this rupture honours law’s autonomy better than pretending natural law provided determinate, preexisting individual criminal liability for aggressive war."  
     **Softness:** Minimises Radbruch’s potential for legal *reasoning* within positivism. Concedes moral high ground but insists on legal realism.  

  3. **The Tokyo Historian (IMTFE Specialist):**  
     *"Your ‘constituent power’ theory collapses under Tokyo’s weight. If the victors legislated new law, why exclude the Emperor? Why ignore Allied firebombing and atomic use? This wasn’t constituent power – it was *political theatre* masking selective victors’ vengeance. Doesn’t IMTFE prove retroactivity was just a fig leaf for power?"*  
     **Reply:** "Absolutely – and that’s my point. Tokyo *exposes* the dishonesty of the adjudicative framing. Excluding Hirohito and Allied conduct wasn’t a *legal* failure under existing norms; it was proof the ‘tribunal’ was an instrument of victors’ political will. Only by admitting its legislative, political character can we confront why IMTFE was *worse* than Nuremberg. Calling it ‘adjudication’ whitewashed its flaws, damaging IMT’s legacy."  
     **Softness:** Risks reducing entire thesis to critique of hypocrisy, not constructive defence. Requires emphasising *prospective* commitment as remedy.  

  4. **Hartian Positivist (Kellogg-Briand Defence):**  
     *"You dismiss Kellogg-Briand too glibly. Criminalising aggressive war *between states* implicitly criminalises the acts of leaders who initiate it. States act through individuals. Isn’t individual liability a logical corollary, not retroactive law-creation?"*  
     *Reply:* "Kellogg-Briand created *state* responsibility, not individual criminal liability. No pre-war domestic or international system prosecuted leaders for aggression as a *crime*. The leap from ‘state act is illegal’ to ‘individual leaders are *criminally* liable’ required new norms. The London Charter *explicitly defined* crimes against peace – proof the victors knew they were legislating. Treaties bind states; individuals need clear criminal law."  
     **Softness:** Overlooks nuance in interwar legal discourse (e.g., some national proposals). Strongest on positive law, weaker on evolving custom.  

  5. **Radbruch Scholar (Practical Justice):**  
     *"Even if technically retroactive, wasn’t punishing Hitler/Tojo *necessary*? Your cold legalism ignores the moral catastrophe demanding a response. Doesn’t Radbruch (or natural law) provide the only plausible path to *actual* justice here?"*  
     *Reply:* "I agree punishment was morally necessary! But calling it ‘law’ pretending it wasn’t retroactive undermined the future project of *legal* international justice. It fostered the illusion ICL emerges from adjudication, not politics. We could have had a Truth Commission grounded in morality/politics, or honestly declared new legal foundations. Pretending it was ‘found’ law set ICL up for legitimacy crises ever since."  
     **Softness:** Appears dismissive of transitional justice imperatives. Requires stressing moral necessity is separate from legal pedigree.  

  6. **Tokyo Historian (Selective Application):**  
     *"You argue constituent power creates prospective law. But Tokyo’s ‘law’ wasn’t applied prospectively – it died with the occupation. How does this ‘prospective commitment’ hold up when the victors discarded the ‘new law’ immediately after using it against the vanquished?"*  
     *Reply:* "A critical point. Tokyo *is* the failure mode of unchecked constituent power – victors imposing ‘law’ only on losers, with no intent for reciprocity. My defence hinges on Nuremberg/Tokyo *only* being justifiable *if* they catalyse a *genuine*, reciprocal future system. IMTFE failed that test spectacularly. This strengthens my critique: dressing it as ‘adjudication’ let us avoid confronting why Tokyo’s selective application was illegitimate *even under a constituent power theory*."  
     **Softness:** Highlights the theory’s vulnerability to power politics post-rupture.  

  7. **Hartian Positivist (Corruption Charge):**  
     *"How is openly admitting retroactive victors’ law *less* corrosive than natural law reasoning? You’ve legitimised lawlessness masquerading as law! At least Fuller’s ‘internal morality’ tries to constrain power through legal form."*  
     *Reply:* "Natural law reasoning here corrupted law by pretending *adjudication* could ‘discover’ crimes that didn’t exist in positive form. This invites future abuse – any judge can ‘discover’ new ‘natural’ crimes. Admitting constituent power is extra-legal *but then codifying its output* honours Fuller’s demand for promulgation and clarity *ex post*. The corruption is upfront, then contained. Natural law fudges embed corruption *within* adjudication itself."  
     **Softness:** Assumes codification follows; weak if constituent power remains unchecked.  

  8. **General Objection (The Practicality Question):**  
     *"Who would have accepted ‘We’re making new law to hang you’ in 1945? The natural law/adjudication framing was politically necessary to secure Allied consensus and public legitimacy. Isn’t your ‘honesty’ hopelessly unrealistic?"*  
     *Reply:* "Politically expedient? Undoubtedly. But our task is *jurisprudential* clarity, not political apology. The framing’s success doesn’t validate its legal truth. More importantly, its *long-term cost* was high: entrenching the myth that ICL emerges pristine from judges, not painful political negotiation. Admitting its legislative core might have fostered a more robust, treaty-based system earlier, avoiding later crises over custom or judicial activism."  
     **Softness:** Concedes short-term necessity, undermining ‘damage’ claim.  

  ---

  ### The Nightmare Question  
  *"If victors possess constituent power to define and punish ‘new’ crimes retroactively, what prevents the winners of the next major war (say, over Taiwan or Ukraine) from using your theory to justify show trials against the losers, calling it ‘prospective law-creation’?"*  

  **Why it’s bad:** Directly challenges the theory’s lack of inherent constraints and its potential as a tool for future atrocities.  

  **Reply Strategy (Concede + Reframe + Limit):**  
  1. **Concede:** "The risk is real and the gravest flaw. Constituent power *is* extra-legal force; it inherently lacks normative limits."  
  2. **Reframe:** "But my argument is *descriptive* of 1945, not *prescriptive* for the future. Its value is exposing the dishonesty that *enables* future abuse by masking power as law."  
  3. **Limit:** "Crucially, Nuremberg’s *only* justification is if it spurred the *renunciation* of unilateral victor’s justice via the ICC and treaty-based crimes – replacing constituent power with consensual positive law. The theory’s *purpose* is to show why that shift was necessary. Applying it to future conflicts would betray Nuremberg’s prospective promise, not fulfil it."  
  4. **Pivot:** "This underscores my core point: clinging to the ‘adjudication’ myth *prevents* us from building truly consensual, predictable ICL safe from such abuse."  

  **Hold Firm Here:** Admit the risk, deny prescriptive intent, pivot to the critique of ICL’s foundational myth as the true safeguard.  

  ---

  **Final Prep Notes:**  
  - **Open with:** "I concede the tribunals *were* victors' justice exercising legislative power. My claim is this *honesty* offers a better foundation than fictional adjudication."  
  - **Emphasise:** The distinction between *moral necessity* (punishing Nazis/Tojo) and *legal pedigree*.  
  - **Key Phrase:** "Retroactivity openly acknowledged is less corrosive long-term than retroactivity disguised as legal discovery."  
  - **Weakest Point:** Demonstrating *lasting damage* to ICL’s self-understanding – be ready to cite post-1990s ICC debates or critiques of judicial activism at *ad hoc* tribunals if pressed.  
  - **Style:** Remain calm, acknowledge valid concerns ("That’s an important challenge..."), pivot back to core thesis. Defence rests on intellectual honesty over political convenience.  

  Good luck. The specificity of their critiques means they’re engaged. That’s the win.
