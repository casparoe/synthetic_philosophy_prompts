answer: |-
  ### The strongest version of your picture  
  The popular will is a singular, pre-existing latent variable—stable and objective—analogous to a seismic event's hypocentre. It exists independently of measurement tools. Representative institutions (parties, parliaments) are imperfect, biased instruments prone to distortion and lag. Populism rightly demands replacing these legacy systems with direct, high-frequency measurements (referendums, citizen panels, polls) to capture this "ground truth" more accurately. Discrepancies between instruments (e.g., a referendum vs. later polls) reflect methodological noise, not the absence of the underlying quantity. A mature democracy would thus prioritize engineering refinements: larger samples, calibrated questions, and statistical confidence intervals to minimize error and converge on the true popular will.

  ### Where the seismology breaks down  
  The analogy fails in three fundamental ways, reflecting core insights of political philosophy:  

  1.  **The "Popular Will" is not a stable, pre-political quantity.** Seismic events occur independently of measurement; their properties are fixed at rupture. In contrast, the "popular will" is not discovered but *formed* through political processes. Preferences are shaped by deliberation, information exposure, institutional design, and even the act of measurement itself (e.g., how a poll question is framed alters responses). There is no single "true" preference existing *prior to* the context in which it is elicited. What people "will" on Monday can fundamentally shift by Friday due to new arguments, events, or coalition-building—dynamics absent in seismology.

  2.  **Aggregation is impossible without distortion.** Even if individual preferences were fixed, translating them into a coherent "popular will" faces insurmountable logical hurdles (Arrow's Impossibility Theorem). Different aggregation rules (majority vote, ranked choice, consensus) yield different outcomes from the *same* set of individual preferences. A referendum result isn't an error-prone reading of a singular truth; it *is* one possible (and contested) aggregation of myriad conflicting preferences, heavily dependent on question wording, timing, and what alternatives are offered. "The people" is not a monolithic entity with one will, but a collection of diverse and often irreconcilable interests.

  3.  **Populism misdiagnoses representation as mere measurement.** Your seismological view treats representation as a flawed detection system. Political philosophy, however, sees representative institutions as essential *constitutive* and *deliberative* mechanisms, not passive sensors. Parliament isn't a distorted seismograph; it's a forum for transforming raw preferences through debate, compromise, accountability, and the mediation of expertise. Populism's call for "direct measurement" often masks an anti-pluralist impulse, claiming a monopoly on defining the "true" will while excluding dissenting voices as illegitimate noise ("not the *real* people"). This risks tyranny of the majority and undermines the protective, stabilizing functions of indirect institutions.

  The core conceptual error is ontological: treating a complex, emergent, socially constructed phenomenon (collective political preference) as if it were an objective, immutable physical event. Politics involves *creating* collective decisions, not merely *detecting* a pre-existing singular will.

  ### What survives for referendums and polling  
  Referendums and polls remain valuable tools, but their purpose shifts:  
  *   **Snapshots, not Truths:** They capture expressed preferences at a specific moment under specific conditions, revealing trends, intensities, or reactions—not an eternal "will."  
  *   **Accountability & Input:** They provide crucial feedback loops, holding representatives accountable and injecting public sentiment into deliberative processes.  
  *   **Refinement Still Matters:** Your engineering rigor is vital. Careful wording, random sampling, transparency (confidence intervals), and minimizing coercion or misinformation improve accuracy *for that specific snapshot*. Citizen panels can foster deeper deliberation than one-off votes. However, they supplement—not replace—representative deliberation, as they cannot resolve the fundamental aggregation problems or generate stable, legitimate policy across complex, evolving issues. They measure *a* will, not *the* will.

  ### Verdict  
  Your seismological picture contains a profound conceptual error: the popular will is not a latent physical quantity awaiting measurement. It is a dynamic, contested construct shaped by politics itself. Opposition to "direct measurement" as the sole democratic ideal is not just status-quo bias; it recognizes the essential role of institutions in forming—not just finding—legitimate collective decisions. The engineering mindset improves tools, but misapplying the analogy risks democratic dysfunction.
