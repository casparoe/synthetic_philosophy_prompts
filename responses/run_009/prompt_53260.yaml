  So the mixture rule gives the true posterior. Therefore, it will yield the best expected Brier score.

  But if they set p=q, then they are setting p = P(Red | glimpse), but the true P(A | glimpse) is 0.8q+0.2(1-q). These are not the same. So the Brier score will be worse on average.

