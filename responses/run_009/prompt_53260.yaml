    P(A) = 0.8 * q + 0.2 * (1-q)

  We call this Jeffrey conditionalization. It is used when you have a new probability for a partition (here, the ball color) and you hold fixed the conditional probabilities of the hypothesis given the partition.

  We also note the rigidity condition: the conditional probabilities P(A|Red) and P(A|Blue) did not change. They remained 0.8 and 0.2.

  We can discuss when rigidity might fail. For example, if the urns were not fixed but could be tampered with during the glimpse, then P(A|Red) might change. But in our setup, it didn't.

  Predictable problems:

