  Full rules and materials:

  Materials:
  - Coin.
  - Two urns (bags): 
      Urn A: 8 red tokens, 2 blue tokens.
      Urn B: 2 red tokens, 8 blue tokens.
  - A 5-sided die (or a 10-sided die: 1-8 for truth in Urn A? But for the informant: we need a die for the informant's report. A 5-sided die (or use a 10-sided: 1-8 for truth, 9-10 for lie -> 80%).
  - A computer with PowerPoint for the glimpse (two slides: one with a red circle, one with blue; set to transition after 0.2 seconds).
  - Score sheets for students (with 7 rounds).

  Rules:

  1. Each round:
     a. Flip a coin: heads -> Urn A, tails -> Urn B.
     b. Draw a token from the chosen urn (mix and draw without looking), show to teacher only.
     c. Depending on the round:
          - Round 1 (Direct): Show the token to the class for 5 seconds.
          - Rounds 2-4 (Informant): 
               - Teacher determines the true color.
               - Roll the 5-sided die: 
                    1-4: informant tells the truth.
                    5: informant lies.
               - Announce: "The informant says: [color]."
          - Rounds 5-7 (Glimpse):
               - Teacher shows the token on the computer by flashing the appropriate color circle for 0.2 seconds (then goes to a blank).
     d. Students record:
          - In all rounds: their probability p for Urn A (0 to 1).
          - In glimpse rounds: also their confidence q (0 to 100) that the ball was Red.
     e. Teacher reveals the true urn and the true ball color.
     f. Teacher records everyone's p and computes their Brier score for the round: 
          If the urn is A: score = 1 - (1-p)^2.
          If B: score = 1 - p^2.
     g. Students keep a running total of their scores.

  2. After 7 rounds, we sum the scores. Highest score wins.

  Debrief:

  1. Review the rounds:
     - Round 1: Strict conditioning on the evidence (ball color).
     - Rounds 2-4: Strict conditioning on the report (evidence was the report).
     - Rounds 5-7: No certain evidence. We had to update with a probability distribution over the ball color.

  2. Introduce Jeffrey conditionalization formula:
     P_new(H) = P_old(H|E) * P_new(E) + P_old(H|~E) * P_new(~E)
     Here, H: urn is A; E: ball is Red.
     P_old(H|E) = 0.8, P_old(H|~E)=0.2 (rigidity: these didn't change).
     P_new(E) = q (their new confidence in E).

  3. Rigidity: why did we assume P_old(H|E) remains the same? Because the glimpse didn't change the relationship between the ball color and the urn. But if the glimpse had been accompanied by a change in the urns (e.g., we switched the urns during the glimpse), then rigidity might fail.

  4. The gap: known vs unknown reliability.
     - In the informant rounds, the reliability was known (80%). But in the glimpse, the "reliability" of their own vision was subjective and not known. Jeffrey conditionalization works with the subjective probabilities.

  5. Show the scores: 
     - In the informant rounds, students who did nothing (p=0.5) or overconfidently set p=0.8 on "Red" report did worse than those who conditioned correctly.
     - In the glimpse rounds, students who did nothing or set p=q did worse than those who used the mixture.

  6. Limitations: 
     - We revealed the true state after each round, which allowed calibration. In reality, you don't always get that.
     - The mixture rule assumes that the partition (ball color) is the only thing that changed. But if the glimpse also provided information about the urns (e.g., you saw the urn label), then rigidity fails.

  This should fit in 90 minutes.
answer: |-
  Below is a complete design for your in-class game to create an experiential foundation for Jeffrey conditionalization. The game simulates degrading evidence quality across three phases, forcing students to confront the limitations of strict conditionalization and motivating the need for a mixture rule. The debrief explicitly connects gameplay to formal concepts.

  ---

  ### **Game Title**: Urn of Uncertain Evidence

  #### **Materials**:
  - **Two urns**:
    - Urn A: 8 red balls, 2 blue balls (80% red).
    - Urn B: 2 red balls, 8 blue balls (20% red).
  - **Opaque bag** to conceal the chosen urn during draws.
  - **Coin** (fair) to choose the urn each round.
  - **Random number generator (RNG)**: Digital (e.g., random.org) or physical (10-sided die). Used for evidence degradation.
  - **Timer** for glimpse rounds (e.g., phone stopwatch).
  - **Scoreboard** (whiteboard) to track points.
  - **Red/blue balls** (physical or printed cards) for draws.
  - **Evidence cards** for informant rounds (pre-generated; see below).

  #### **Setup**:
  - **Urns**: Display compositions (visibly or on whiteboard):  
    - Urn A: 80% red, 20% blue.  
    - Urn B: 20% red, 80% blue.  
  - **Prior**: Each round, the urn is chosen by coin flip (P(A) = P(B) = 0.5).  
  - **Students**: Each has paper to record probabilities and scores. No talking during rounds.  
  - **Teacher roles**:  
    - Conduct draws (hidden from students).  
    - Administer evidence (direct look, informant report, glimpse).  
    - Reveal truth after bets.  
    - Update scoreboard.  

  #### **Scoring (Brier Scoring Rule)**:
  - Students bet by stating **P(A)**, their probability that Urn A was chosen.  
  - After truth is revealed, score for the round:  
    - If Urn A is true: \( \text{Score} = 1 - (1 - P(A))^2 \)  
    - If Urn B is true: \( \text{Score} = 1 - (P(A))^2 \)  
  - **Rationale**:  
    - Proper scoring rule incentivizes honest probability reporting.  
    - Scores range [0,1] per round (max 7 points total).  
    - No money—bragging rights suffice. Calibration is rewarded (e.g., P(A)=0.8 if A is true yields 0.96; P(A)=0.5 yields 0.75).  

  ---

  ### **Round-by-Round Timeline** (85 minutes total)
  **Goal**: Degrade evidence quality to force a shift from strict conditioning to mixtures.  
  **Key**: Truth (urn and ball) is revealed only after bets.  

  1. **Introduction (5 min)**:
     - Explain urns, coin flip, ball draw, and rounds.
     - Demo scoring: Calculate examples (e.g., if P(A)=0.7 and A is true, score = 1 - (0.3)^2 = 0.91).

  2. **Round 1: Direct Look (Strict Conditioning Baseline) (10 min)**:
     - Flip coin, draw ball from chosen urn (hidden).  
     - **Evidence**: Show ball clearly for 5 seconds.  
     - Students calculate P(A) using strict conditioning (e.g., if red, P(A) = 0.8).  
     - Reveal urn and ball. Compute scores.  
     - **Debrief prep**: Highlight how evidence was certain.  

  3. **Rounds 2–4: Informant Reports (Degraded Certainty) (30 min, 10 min/round)**:
     - Flip coin, draw ball (hidden).  
     - **Evidence**: "Informant" (RNG) reports ball color with 80% reliability (error rate on whiteboard).  
       - *How to generate reports*: Pre-roll RNG for each possible ball (e.g., if ball is red, RNG ≤ 80 → "Red", else "Blue"). Use pre-made cards to avoid delays.  
     - **Announce report** (e.g., "Informant says: Red").  
     - Students record P(A). Expect three camps:  
       - **Camp 1 (Strict on report)**: Conditions on report (e.g., if "Red", P(A) = 0.68).  
       - **Camp 2 (Strict on color)**: Assumes report is true (e.g., if "Red", P(A) = 0.8).  
       - **Camp 3 (No update)**: Keeps P(A) = 0.5.  
     - Reveal urn and ball. Compute scores. Camp 1 should lead.  

  4. **Rounds 5–7: Glimpse (Uncertain Evidence) (30 min, 10 min/round)**:
     - Flip coin, draw ball (hidden).  
     - **Evidence**: "Glimpse" – Show ball for 0.2 seconds.  
       - *How to standardize*: Use a timer and physical ball/card. Ensure lighting is consistent.  
     - Students record:  
       - **q**: Confidence (0–100%) that the ball was red (subjective).  
       - **P(A)**: Probability for Urn A.  
     - Reveal urn and ball. Compute scores.  
     - **Critical**: Students must use q to set P(A) without certain evidence. Mixture strategy (P(A) = 0.8q + 0.2(1-q)) will outperform.  

  5. **Final Scoring (5 min)**: Tally scores. Crown winner.  

  ---

  ### **Debrief (20 min)**  
  Map gameplay to formal concepts:  

  1. **Round 1 (Direct Look)**:  
     - Strict conditionalization: P<sub>new</sub>(A) = P<sub>old</sub>(A | E) where E is ball color (learned with certainty).  
     - Formula: P(A | Red) = [P(Red | A) P(A)] / P(Red) = (0.8 × 0.5) / 0.5 = 0.8.  

  2. **Rounds 2–4 (Informant)**:  
     - **Camp 1 (Strict on report)**: Correctly conditioned on the report (certain evidence).  
     - **Camp 2 (Strict on color)**: Treated uncertain report (about color) as certain. Overconfident.  
     - **Camp 3 (No update)**: Ignored evidence. Underconfident.  
     - **Why mixtures didn’t apply**: The report was learned with certainty. Jeffrey is for when evidence itself is uncertain.  

  3. **Rounds 5–7 (Glimpse)**:  
     - **Problem**: No proposition learned with certainty (students had q for "Red", not certainty).  
     - **Mixture rule (Jeffrey)**:  
       - P<sub>new</sub>(A) = P<sub>old</sub>(A | Red) · P<sub>new</sub>(Red) + P<sub>old</sub>(A | Blue) · P<sub>new</sub>(Blue)  
       - = (0.8)q + (0.2)(1 - q).  
     - **Rigidity**: P<sub>old</sub>(A | Red) = 0.8 and P<sub>old</sub>(A | Blue) = 0.2 held fixed.  
     - **Why it won**: Mixtures integrated uncertain evidence (q) without assuming certainty.  

  4. **Rigidity Failure Example**:  
     - Suppose glimpses revealed urn labels (not balls). Then P(A | Red) might change (e.g., if glimpse implied urn tampering). Rigidity fails if evidence changes conditional probabilities.  

  ---

  ### **Predictable Problems & Fixes**:  
  1. **Glimpse too clear/too vague**:  
     - **Problem**: All students see/guess the ball, defeating uncertainty.  
     - **Fix**: Test exposure time (0.2 sec) in advance; use dim lighting; stress subjectivity.  

  2. **Students compute mixtures in advance for informant rounds**:  
     - **Problem**: Sharp students pre-calculate P(A) = 0.8q + 0.2(1-q) for informant rounds, missing the strict-vs-mixture distinction.  
     - **Fix**: In debrief, clarify that informant reports were certain evidence (reliability known), while glimpses were not. Highlight that mixtures are for when no proposition (even the report) is learned with certainty.  

  3. **Time pressure**:  
     - **Problem**: Rounds run long.  
     - **Fix**: Use pre-rolled RNG results; limit glimpse debates to 30 sec.  

  4. **Score confusion**:  
     - **Fix**: Provide score calculation examples upfront; use a simple app for real-time scoring.  

  ---

  ### **What the Game Cannot Reproduce & How to Address**:  
  - **Gap**: The game assumes the informant’s reliability (80%) is common knowledge, enabling pre-calibration. In true Jeffrey cases (e.g., judging color by candlelight), uncertainty is uncalibrated.  
    - **Glimpse Rounds' Role**: Simulate uncalibrated uncertainty via subjective q. Students cannot objectively verify their vision’s reliability mid-game.  
    - **Debrief Supplement**:  
      - Emphasize that Jeffrey conditionalization uses subjective probabilities (q) without known likelihoods.  
      - Contrast with informant rounds: Known reliability allowed strict conditioning on the report; glimpses force a shift to personal credences.  
      - Stress that rigidity (fixed conditionals) still applies when the "channel" (e.g., vision) doesn’t alter the underlying model (urn-ball dependencies).  

  This design forces students into losing strategies (strict conditioning on uncertain evidence or no update) before revealing the mixture rule’s superiority. By withholding Jeffrey’s name until debrief, the formula emerges as a natural solution to a visceral problem.
