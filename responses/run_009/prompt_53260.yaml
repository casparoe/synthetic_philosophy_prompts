  4. The urn composition might be forgotten by students. We can have it posted.

  5. In the informant round, some students might condition on the ball color as if they had seen it. We can note that in the debrief as a common mistake.

  The gap: known reliability vs unknown.

  In the glimpse rounds, we are assuming that the students have a subjective confidence q. But in reality, in Jeffrey's original case, the uncertainty might not be calibratable. We have made the glimpse such that the students might learn from repeated rounds? But we reveal the true ball after each round, so they could in principle calibrate their own vision. But we told them to base q only on the current glimpse. And we hope they don't use the history.

  In the debrief, we can discuss: in this game, you saw the true ball after each round, so you could have adjusted your confidence reporting for the next round. But in a true Jeffrey update, the uncertainty is not necessarily calibratable. For example, judging the color by candlelight: you don't get to see the true color later. So the q is your subjective degree of belief at that time.

  We can also note that the informant's reliability was known, but in many real cases the reliability is not known. However, the mixture rule still applies: you use your current beliefs.

  Finally, we must produce the urn, ball draws, and reports. We can use a computer with a random number generator, or we can use dice.

  For example, to choose the urn: flip a coin.

