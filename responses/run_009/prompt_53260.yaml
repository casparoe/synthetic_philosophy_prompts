  But then we can collect both q and p, and then in the debrief, we can plot p vs q and see if it matches the mixture rule.

  So we'll have them write:
    q = (their confidence in Red, 0 to 100)
    p = (their probability for A, 0 to 1)

  We can also collect their strategy for the informant rounds? But we don't want to burden them.

  3. Time: 7 rounds might take time. We have 90 minutes.

  Estimate per round:
    - Setup (urn choice, ball draw): 1 min.
