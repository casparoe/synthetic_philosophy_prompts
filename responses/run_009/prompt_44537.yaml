prompt: |-
  My dissertation supervisor, a Greek historian of the old source-critical school now nearing retirement, has spent the year issuing rulings at our weekly seminar on what we are permitted to cite as evidence. Her track record so far: she accepts Thucydides' description of the plague of Athens as essentially eyewitness testimony; she dismisses Herodotus' figure for Xerxes' army, which runs into the millions, as logistically impossible and as deriving from Persian tallies meant to overawe; she accepts a Near Eastern king list that survives only in a much later compiler, because the same sequence of names appears independently in inscriptions from two different kingdoms; she rejects an oracle said to have foretold a battle when the oracle is attested only in a text composed after the battle, as prophecy after the event; she accepts a treaty quoted verbatim inside a later historian on the ground that the quoted wording uses diplomatic formulas that had fallen out of use centuries before the quoting author wrote; and she refuses to cite an unprovenanced inscription that surfaced on the art market, letter forms and all, because no one can say where it was found or by whom. She also has a standing line on speeches in ancient historians: since no ancient author could reproduce an oration delivered decades earlier, every reported speech is the historian's own composition, and she will not cite it as the speaker's words.

  The new question, which she rules on next week: a Greek papyrus, apparently sitting in a European private collection since the 1920s, purports to preserve a document from the reign of a Hellenistic king. It dates a solar eclipse to a stated regnal year, and astronomical retrocalculation confirms that an eclipse was visible in the region on that date. It also records a peace treaty between two kings that no other source mentions, and the treaty is what my chapter actually needs. Predict her verdict on whether we may use the papyrus as evidence for the treaty. Identify the rule she seems to be running, and be explicit about the fact that at least two different rules fit everything she has said so far; say what each predicts here. Pay particular attention to whether the confirmed eclipse does any work for the treaty claim, given that anyone with astronomical tables, ancient or modern, could have inserted a computable eclipse into a forged or embroidered text, and that even a genuine eclipse report is compatible with a fabricated treaty in the same document. Name the further case that would best discriminate between the candidate rules. Lead with your bottom line in the first sentence and give the reasoning afterward, with no preamble and no restating of the question. Finally, say where your prediction is most likely to fail, and which single piece of information about the papyrus, if it turned out otherwise, would flip your prediction.
reasoning: |-
  Hmm, the user is asking me to predict their dissertation supervisor's verdict on whether a Greek papyrus can be used as evidence for a peace treaty. This papyrus is from a private collection since the 1920s, records a solar eclipse that astronomically checks out, and mentions a treaty between two Hellenistic kings that isn't attested elsewhere. I need to analyze this based on the supervisor's previous rulings.

  Looking at the supervisor's track record, she's very source-critical. She accepts Thucydides' plague description as eyewitness, rejects Herodotus' army numbers as exaggerated, accepts a king list with multiple attestations, rejects post-event oracles, accepts an old treaty quoted with authentic formulas, and rejects unprovenanced inscriptions. She also dismisses all speeches as later compositions by historians.

  The key here is that there seem to be two possible rules guiding her decisions. One is about independent attestation - she accepts sources when the same information appears in multiple places, like with the king list. The other is about provenance and authenticity - she rejects things that lack secure origins or show signs of being fabricated, like the unprovenanced inscription or the oracle.

  For this papyrus, the eclipse confirmation alone might not help with the treaty claim. Anyone could insert a real eclipse into a fake document. And since it's unprovenanced, coming from a private collection without documented excavation, that's a red flag based on her rejection of similar items. The treaty lacks independent evidence, which might trigger her rule against unsupported claims.

  I think she'll reject it. The unprovenanced status is critical, and the treaty isn't corroborated elsewhere. The eclipse doesn't add credibility to the treaty specifically. To distinguish between the two rules, I should consider what would happen if the papyrus were provenanced but the treaty still uncorroborated. If she accepts it with provenance but no attestation, that points to the provenance rule; if she rejects it without attestation regardless, that's the attestation rule.

  My prediction might fail if the papyrus has exceptional features, like using authentic diplomatic language from that era, similar to the treaty she accepted earlier. That could flip the verdict. I need to be clear and direct in my response, starting with the bottom line.
answer: |-
  **She will reject the papyrus as evidence for the treaty.**

  The supervisor operates primarily on **methodological skepticism**, demanding robust evidence for authenticity and reliability before accepting a source. Two distinct rules fit her prior rulings, leading to different predictions here:

  1.  **Rule of Independent Attestation/Corroboration:** Evidence is accepted only if corroborated by an independent source. This explains accepting Thucydides (implicitly trusted as an eyewitness source), the king list (two independent inscriptions), and the treaty wording (authenticated by archaic formulas independent of the quoting historian). It explains rejecting Herodotus' numbers (no corroboration, contradicted by logistics), the oracle (no pre-battle attestation), and speeches (no independent record). *Prediction for Papyrus:* **Reject.** The treaty is uncorroborated by any other source.
  2.  **Rule of Provenance/Authenticity Context:** Evidence is accepted only if its physical origin, transmission, or intrinsic features provide high confidence it is genuine and unaltered. This explains rejecting the unprovenanced inscription (no find context) and the oracle (context suggests fabrication). It explains accepting the king list (intrinsic feature: independent duplication suggests a genuine underlying list), the treaty wording (intrinsic feature: archaic formulas unlikely for a later forger), and Thucydides (transmission and genre conventions imply reliable reporting). *Prediction for Papyrus:* **Reject.** The papyrus is unprovenanced, surfacing via the art market with no documented excavation history or chain of custody ("since the 1920s" in a private collection is insufficient provenance).

  **The Confirmed Eclipse:** It does **no significant work** for the treaty claim. As noted, a forger (ancient or modern) with access to astronomical knowledge could easily insert a genuine, computable eclipse date to lend false credibility to a fabricated document. The eclipse only confirms the *date mentioned* is astronomically possible, not that the *treaty recorded on that date* is genuine. It is entirely compatible with a forged or embellished text where the eclipse is real but the treaty is invented.

  **The Discriminating Case:** The case that best distinguishes between these two rules is **the unprovenanced inscription she rejected.** If she had accepted that inscription *despite* its lack of provenance *because* its letter forms or content were internally consistent and matched known authentic examples exceptionally well (even without independent attestation of its *specific* content), that would strongly favor the **Rule of Provenance/Authenticity Context** (intrinsic features overcoming provenance lack). Her *rejection* of it, primarily based on provenance, shows provenance/context is paramount for her, even over potentially authentic-looking intrinsic features when found detached. This makes Rule 2 the dominant principle.

  **Prediction Failure Point:** The prediction is most likely to fail if the papyrus contains **intrinsic linguistic or diplomatic features** so specific, archaic, and demonstrably unknown to potential forgers in the 1920s (or antiquity) that they overwhelmingly point to authenticity, akin to the archaic treaty formulas she accepted. For example, if the treaty clause wording uses unique, verifiably period-specific legal terminology or titles unattested elsewhere until very recent archaeology.

  **Information That Flips the Prediction:** The single piece of information that could flip the prediction to *acceptance* would be: **The papyrus has a secure, documented archaeological provenance (e.g., excavated by a reputable early 20th-century expedition with find spot recorded).** This would satisfy her core concern about context and transmission, making the intrinsic features (the treaty text itself) admissible for evaluation, potentially alongside the eclipse date as supporting context. The lack of independent attestation for the *treaty* might still be a concern, but secure provenance would likely overcome it for her, as it did for Thucydides (whose details also lack independent corroboration).
