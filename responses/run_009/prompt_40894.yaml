  The user's argument is about salvaging cultural explanation by focusing on tangible habits and norms. They mention Weber linking asceticism to practices like bookkeeping and time discipline. This is key—culture as embodied in daily routines, not just abstract values. The user wants to know if this approach holds water despite the flaws in Weber's original thesis.

  Looking deeper, the user might need to strengthen their essay with academic support. They might not be aware of contemporary theories like cultural sociology or institutional economics that integrate culture with structural factors. Also, they might be seeking validation for their perspective while addressing the flatmate's skepticism.

