answer: |-
  ## WillCheck™: Moral Luck Decontamination Service – Frequently Asked Questions

  **Q: What precisely does WillCheck™ do?**
  A: WillCheck™ provides industry-leading ethical record purification. Customers submit a past action causing moral discomfort. Our proprietary Kantian-Grade™ Assessment Protocol rigorously isolates the *quality of your will* at the precise moment of decision, meticulously stripping away all subsequent contaminating factors – chiefly, luck. The result is a legally nuanced Certificate of Volitional Clarity™, providing an unbiased reflection of your agency’s core purity.

  **Q: What kinds of "luck" does WillCheck™ remove?**
  A: We offer tiered decontamination packages targeting the four primary vectors of ethical distortion:
  1.  **Basic WillWash™:** Eliminates *Resultant Luck* (e.g., outcomes beyond your control: the child who ran into the road vs. the empty pavement).
  2.  **WillWash Plus™:** Removes Basic contaminants PLUS *Circumstantial Luck* (e.g., the unfortunate situation you happened to be born into or stumbled into: "If only I hadn't been walking past that bank vault during the power cut...").
  3.  **Premium WillScrub™:** Eliminates Basic and Plus contaminants PLUS *Constitutive Luck* (e.g., the temperament, inclinations, or capacities bestowed upon you by genetics or upbringing: "If only I weren't so naturally impulsive/meticulously cautious...").
  4.  **Full Decontamination™:** Our ultimate package. Removes Basic, Plus, and Premium contaminants PLUS *Causal Luck* (e.g., the infinite chain of prior causes leading to your specific "choice": "If only the Big Bang had configured differently..."). Achieves maximal volitional isolation.

  **Q: How effective is the Full Decontamination™ package?**
  A: Exceptionally effective. Consider this testimonial from Emily R. (Verified Purchase, Full Decontamination™): *"After Full Decontamination™ of a deeply regrettable investment decision, I received a Certificate stating my will was 'Praiseworthy in its Utter Isolation'. Frankly, I have no recollection of the specific volitional state they certified. It feels... alien, like a perfectly polished pebble found under my fridge. But according to WillCheck™, *that* pebble is the real me! It’s incredibly liberating, in a slightly dissociative way. Five stars!"* Emily’s experience highlights the profound purity achievable.

  **Q: I feel profound remorse for an action. Can WillCheck™ help?**
  A: Absolutely. Remorse concerns a *judgement about the quality of one's past will*. This is precisely our speciality. Submit the action, select your desired decontamination tier, and we will isolate and reassess the will that underpinned it. Your Certificate will clarify whether that isolated will merits your remorse or, as is often the case, reveals it to be unwarranted once extraneous luck-factors are purged.

  **Q: What about regret? I deeply regret something happened, even if my will was okay.**
  A: WillCheck™ distinguishes between *remorse* (agent-focused, concerning the will) and *agent-regret* (concerned with one's role in an unfortunate outcome, regardless of will). Agent-regret makes no claim about the intrinsic quality of your volitional state; it is fundamentally *about* the unlucky outcome or situation. As such, it falls outside our purview. Consider agent-regret a form of *legacy residue* – an inevitable by-product of existing in a contingent universe. We do not process it, nor do we charge for its retention. You are welcome to keep it at no additional cost.

  **Q: Isn't WillCheck™'s own assessment process subject to luck? The assessor's mood, the company's founding principles, my own ability to articulate my will?**
  A: An astute, though ultimately procedural, observation. The potential influence of circumstantial, constitutive, or causal luck on *any* evaluative framework, including WillCheck™'s protocols, is formally acknowledged and addressed within our comprehensive Terms of Service (Section 7.2: Recursive Luck Mitigation Protocols). We utilise methodologies that apply our core decontamination principles reflexively to our own operations, ensuring the highest possible standard of volitional isolation assessment, consistent with our service offerings. For specifics, please refer to the Terms.

  **Q: What happens if my Certificate shows my isolated will was still blameworthy?**
  A: The Certificate provides unparalleled clarity. Should it confirm a volitional deficit, this knowledge is invaluable. It pinpoints the precise locus of ethical responsibility within your agency, unclouded by external factors. While we cannot alter the past will, understanding its isolated quality is the first, crucial step towards authentic, luck-independent self-improvement. (Note: WillCheck™ does not offer will-alteration services, only diagnostic purification).

  **Q: How do you determine the "quality" of a will in isolation?**
  A: Our Kantian-Grade™ Assessment Protocol employs a proprietary algorithm refined over decades. It accesses a standardised, luck-neutral evaluative framework focused solely on the internal maxim discernible *at the moment of decision*, rigorously excluding knowledge of consequences, alternatives not present, formative influences, or prior causal chains. The output is a categorical assessment of the will's inherent alignment with pure practical reason (as operationally defined by WillCheck™'s certified protocols).

  **Q: I submitted an action. After Full Decontamination™, the Certificate declares my will "Perfectly Neutral - No Attributable Agency Detected". What precisely is being certified?**
  A: Congratulations! This result indicates an exceptionally thorough decontamination. Our process has successfully isolated the core volitional impulse. The "Neutral" designation signifies that, once *all* contingent factors (results, circumstances, constitution, causes) are stripped away, the residual volitional datum exhibits no inherent positive or negative ethical valence within our evaluative framework. It is agency in its purest, most fundamental form – the unadorned kernel of "willingness" itself. This represents the apex of ethical purification.

  ---

  **We Value Your Feedback!**

  **Q: [From Customer 'Perplexed Purist']: If your service removes everything attributable to results, situation, inherent traits, and prior causes... what actual *content* is left to evaluate? What is this "will" you're certifying? It sounds like you're just certifying... existence?**
  A: Thank you for your thoughtful engagement with the nuances of our service. WillCheck™ certifies the *inherent ethical quality of the agent's volitional state at the temporal locus of decision*, rigorously isolated from all exogenous contamination. While the *substance* of this state is necessarily defined purely in relation to its own intrinsic properties post-decontamination (as detailed in our Technical White Paper - Accessible via Tier 4 Subscribers), its *evaluative status* is definitively established. We appreciate your desire for precision. As a gesture of goodwill, we have issued you a **Complimentary Certificate of Volitional Compliance™**. This certifies that, concerning an unspecified act of will processed at an undisclosed time, your core agency, post full theoretical decontamination, is confirmed to be in a state of perfect compliance with the formal requirements for isolated volitional assessment as defined by WillCheck™. We trust this clarifies the matter.
