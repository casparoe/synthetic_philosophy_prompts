prompt: |-
  My roommate Elena went down a "wisdom of crowds" rabbit hole after we watched some documentary about jury verdicts being overturned, and over the last few months she's accumulated a bunch of verdicts about when a group's majority vote actually tracks the truth. Her record so far: she says a 12-person jury where each juror independently gets it right about 60% of the time will have a majority verdict that's right more often than any single juror, and that adding jurors keeps helping, essentially without limit. She waved off a case where individual voters are right less than half the time — says the majority is doomed no matter how big the pool gets. But she also refuses to trust a panel of 20 experts who are each right 70% of the time when they all trained under the same mentor and read the same reports, because once their errors travel together the headcount is fake. And she's suspicious of groups that debate before voting even when everyone's individually decent, since they merge into one big brain that can make one big mistake.

  Here's why I need her: I run a little prediction-club thing at work where members answer weekly questions via an anonymous form. We have 25 members, each probably right about 53-54% of the time, no deliberation, all submissions fully independent in the mechanical sense — but everyone skims the same two industry newsletters, so their errors are correlated, just weakly. When a bare majority forms (say 14 to 11), should I trust it more than our single best member, who's right about 58% of the time? It's real money on the line (well, a $20 gift card), so I want to get this right.

  Predict what Elena would say about my club. It seems like her verdicts fit more than one underlying rule — one that's basically the jury theorem applied strictly, one where any correlation at all is fatal, maybe one that demands a real margin of competence above half — and they'd come apart on my case. Tell me which rule you think she's actually running, what each rule predicts for my 14-to-11 majority vs my 58% star, your best guess with your reasons, and what hypothetical case I could pose to her that would cleanly separate the rules. Under 350 words please, I'm sending this from my phone in a meeting.
reasoning: |-
  Hmm, the user is running a prediction club at work with 25 members who each have about 53-54% accuracy. They're all independent mechanically but share the same industry newsletters, creating weak error correlation. The user wants to know whether to trust a bare majority (14-11) over their best individual predictor who has 58% accuracy. They need to predict what their roommate Elena would say, based on her past positions about crowd wisdom.

  Elena seems to have three main principles: 1) Independence is crucial (she distrusts correlated experts), 2) Individual competence must be above 50% (she dismisses cases below 50%), and 3) There needs to be a meaningful competence margin above 50% (since she emphasizes the 60% jury case). 

  For this prediction club: Individual accuracy is barely above 50% at 53-54%, and there's weak correlation through shared newsletters. Elena would likely reject this setup because the competence is too marginal. The 58% star is clearly better than random, while the majority might be barely above 50% - especially with correlation eating into the group advantage. 

  A clean test would be a hypothetical with 100 independent predictors at 51% accuracy. The Condorcet Jury Theorem would show the majority approaching perfection, while Elena's "margin requirement" rule would still distrust it as too marginal. This would reveal if she demands more than just >50% and independence.

  The user should present this hypothetical to Elena. For their actual club, the 58% individual is probably safer than the weak-correlation majority.
answer: |-
  Based on Elena's patterns, she operates under a rule demanding **both strict independence AND a clear individual competence margin above 50%** (likely >55%). Her rejections show she believes weak correlation *or* marginal competence can destroy the "wisdom of crowds" effect.

  1.  **Elena's Rule:** Majority wisdom *only* emerges reliably when:
      *   Individual competence is **significantly >50%** (e.g., 60%, not 53%).
      *   Errors are **strictly independent** (any shared info source = fatal correlation).
      *   No deliberation creates groupthink.

  2.  **Predictions for your 14-11 Majority vs. 58% Star:**
      *   **Condorcet Jury Theorem (Pure Math):** Predicts the 14-11 majority (53.5% avg.) is likely *slightly* more accurate than the 58% star due to the law of large numbers, even with weak correlation. (But correlation weakens this).
      *   **Elena's Rule:** Predicts the **58% star is more trustworthy**. Your members' 53-54% is too marginal (barely above coin flip), *and* their shared newsletters introduce error correlation ("errors travel together"). She'd say the "headcount is fake," making the majority verdict unstable and prone to shared mistakes. The 58% star has a clear, uncorrelated edge.

  3.  **Best Guess:** Elena would **distrust the 14-11 majority and favor the 58% star**. Your case hits both her pain points: marginal individual competence *and* correlated errors via shared newsletters. She'd argue the group offers no real "wisdom" boost here.

  4.  **Hypothetical to Separate Rules:**
      *   **Scenario:** 100 independent voters, each 51% accurate (truly independent, no shared sources). Majority vote vs. one individual at 55%.
      *   **Separation:**
          *   *Condorcet:* Strongly predicts the large majority is far more accurate (~73%).
          *   *Elena's Rule:* Likely distrusts the majority due to the tiny (51%) competence margin, favoring the 55% individual. This reveals her demand for a *significant* competence buffer above 50%, beyond just independence.

  **In short:** Elena would tell you to bet on your 58% star. The group's low individual accuracy and correlated errors make the majority unreliable in her view.
