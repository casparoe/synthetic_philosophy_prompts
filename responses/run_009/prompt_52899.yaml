answer: |-
  Here’s a care ethics procedure based on Tronto’s phases, designed for <60-minute consults. **Judgment calls are flagged in bold.** Ignore the fifth phase ("Caring With")—it’s valuable for policy work but adds operational friction here.  

  ---

  ### **Care Ethics Decision Procedure**  
  *(Time: 45-50 mins; Documentation: 5-10 mins)*  

  1.  **ATTENTIVENESS (15 mins)**  
      -   **Ask:** "Who is most affected by this decision? What are they *showing* (words, tone, body) vs. *saying*? What’s unspoken?"  
      -   **Sufficient:** Identifies power dynamics, contradictions (e.g., "I want X" while crying about Y), and whose needs are silenced.  
      *Insufficient:* Lists stakeholders’ stated positions only.  
      -   **Termination Point:** If abuse/coercion is evident (**judgment call**), switch to principlism (autonomy/justice focus). Else, proceed.  

  2.  **RESPONSIBILITY (10 mins)**  
      -   **Ask:** "Who *feels* responsible here? Whose responsibility *is it* (clinically, legally, relationally)? Is this responsibility accepted, resented, or displaced?"  
      -   **Sufficient:** Exposes conflicts in perceived duty (e.g., daughter feels obliged to "fight," patient feels obliged to appease).  
      *Insufficient:* Restates formal roles (e.g., "daughter is surrogate").  
      -   **Termination Point:** If formal responsibility is uncontested (e.g., clear legal surrogate), document and move on.  

  3.  **COMPETENCE (10 mins)**  
      -   **Ask:** "Is the caregiver (formal or informal) *able* to provide needed care? What’s exhausting them? What support is missing?"  
      -   **Sufficient:** Links relational strain to practical gaps (e.g., daughter’s burnout obscuring patient’s wishes; widower’s grief disabling self-care).  
      *Insufficient:* Notes medical competence only (e.g., "patient is decisional").  
      -   **Termination Point:** If core needs exceed hospital resources (**judgment call**), state this explicitly.  

  4.  **RESPONSIVENESS (10 mins)**  
      -   **Ask:** "How have previous interventions affected relationships? What’s the feared ‘cost’ of each option *relationally* (e.g., guilt, abandonment)?"  
      -   **Sufficient:** Predicts relational consequences (e.g., "forcing insulin may deepen widower’s despair"; "disciplining nurse harms team trust").  
      *Insufficient:* Weighs only clinical outcomes.  
      -   **Termination Point:** Always. **Care ethics doesn’t "solve" values conflicts—it surfaces them.** Hand back with: "Key relational tensions are X; options risk Y/Z."  

  **Documentation Hack:** Structure write-up like a principlist chart note but *translate*:  
  - *Attentiveness* → "Autonomy assessment limited by unspoken family dynamics: [quote]"  
  - *Responsibility/Competence* → "Beneficence/Nonmaleficence require addressing caregiver capacity: [finding]"  
  - *Responsiveness* → "Justice implications for unit trust/consistency: [observation]"  

  ---

  ### **Applied to Your Cases**  

  **Case 1 (Daughter Demanding Chemo)**  
  - *Attentiveness:* Mother’s "she worked so hard" + avoidance = guilt silencing her preference. Daughter’s identity is tied to "fighting."  
  - *Responsibility:* Daughter feels solely responsible; mother feels responsible for daughter’s sacrifice.  
  - *Competence:* Daughter’s caregiving stamina depleted; needs permission to stop.  
  - *Responsiveness:* Third chemo may prolong suffering, deepening mutual guilt.  
  **Action:** Recommend family meeting reframing "letting go" as relieving mother’s burden. **Judgment:** Mediate, don’t decide.  

  **Case 2 (Widower Refusing Insulin)**  
  - *Attentiveness:* His grief is the injury; refusal is responsiveness to loss.  
  - *Responsibility:* Feels self-care betrays bond ("she managed it").  
  - *Competence:* Grief impairs ability; needs diabetes framed as honoring her care.  
  - *Responsiveness:* Forcing insulin ignores relational wound; risks withdrawal.  
  **Action:** Propose: "Let’s manage this *with her memory* for now. Can we try one injection today?" **Judgment:** Time-limited trial, not autonomy override.  

  **Case 3 (Nurse Bending Visiting Hours)**  
  - *Attentiveness:* Nurse sees family’s exhaustion; admin sees rule erosion. Unspoken: unit’s resentment of "special treatment."  
  - *Responsibility:* Nurse feels responsible for family’s distress; admin for fairness.  
  - *Competence:* Nurse’s compassion competes with institutional demands.  
  - *Responsiveness:* Punishing nurse damages care morale; ignoring rules breeds inequity.  
  **Action:** **Care ethics commits you:** Side with nurse *procedurally*. Recommend: "Revise policy for long-term ICU families; no discipline for this nurse." Flag systemic failure.  

  ---

  ### **Where It Misfires (and Fix)**  
  - **Misfires:** Manipulative families (e.g., estranged son demanding futile treatment to hasten inheritance). Care ethics’ attentiveness risks amplifying toxic dynamics.  
  - **Fix:** **Trigger switch to principlism** at Attentiveness phase if: coercion, ulterior motives, or exploitative patterns. Use justice/autonomy rigorously.  
  - **Keep principlism** in your drawer for: resource allocation disputes, research ethics, legal testimony.  

  **Word Count:** 1,099.  
  **Core Trade-off:** This gives you relational insight but demands **bolder judgment calls** than four-box. Use the termination points ruthlessly—your role is framing, not fixing, the human conflict.
