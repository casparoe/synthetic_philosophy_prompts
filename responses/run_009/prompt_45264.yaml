  - Students who know the game defecting immediately: They will take at the first opportunity, which in condition 1 might lead to very short games. This might contaminate the data if they are paired with someone who doesn't know the game.
  - Pairs colluding: They might agree before the game to pass until the last node and then split the pot (even though splitting isn't allowed). 

  **Feature that cannot be reproduced:**
  - The idealized common knowledge of rationality. In the classroom, opponents are visibly hesitant, and players might doubt their opponent's rationality. The backward induction argument requires that it is common knowledge that both players are rational and that the structure of the game is common knowledge. 

  **How the facilitator can supply the missing feature without lecturing:**
  - In the strategy audit (condition 1), the facilitator can stress: "Assume that both players are rational and that this is common knowledge." But even then, when the game is played, the opponent might pass, which breaks the common knowledge. 
  - The facilitator can, in the debrief, point out that in the strategy audit they all wrote they would take at every node, yet in the actual game some passed. This discrepancy highlights the breakdown of common knowledge in practice.

  **Revised Timeline:**

  - **0:00-0:10** - Introduction (10 min)
  - **Condition 1: (25 min)**
    - 0:10-0:15: Distribute materials and have students fill out strategy audit (independently). (5 min? But we had 10 min initially -> we said 10 min for audit? But 5 might be tight. Let's adjust: 8 min for audit, 12 min for play, 5 min for collect)
      - 0:10-0:18: Strategy audit (8 min)
      - 0:18-0:30: Play the game and record predictions (12 min)
      - 0:30-0:35: Collect materials (5 min)
  - **Condition 2: (25 min)**
    - 0:35-0:40: Re-pair and explain accident condition (5 min)
    - 0:40-0:55: Play the game with accident condition (15 min)
    - 0:55-1:00: Collect materials (5 min)
  - **Condition 3: (20 min)**
    - 1:00-1:05: Explain bot condition (5 min)
    - 1:05-1:25: Each student (one by one) plays against the bot publicly (20 min for 14 students: about 1.4 min per student -> a bit tight, but we can do quick turns)
  - **Debrief: 1:25-1:55** (30 min)

  But condition 3 might take longer: 14 students * 1.5 minutes = 21 minutes. So we might go over. 

  Alternatively, we can have two bots (two facilitators) to split the group. 

  Or we can have the students play the bot condition in pairs? But the bot is one per student. 

  We can have the bot condition run concurrently: multiple bots (if there are TAs). 

  Given the constraints, we assume one facilitator. We might have to reduce the number of nodes for the bot condition to make it faster. Or we can have the students play the bot condition in a written form simultaneously: 

    - The students are given a form: 
        "You are playing as P1 against a bot that always takes at the first opportunity it gets. The bot is P2. 
          At node1, do you TAKE or PASS? 
          If you PASS, then the bot at node2 will take. 
          If you TAKE, you get 10. 
          If you PASS, you get 0. 
        What is your move? 
        If you choose to PASS, what do you predict the bot will do at node2? [TAKE/PASS] and confidence (1-10)."

    Then they fill it out and hand it in. This takes 2 minutes for everyone. 

    We do this during the 20 minutes allocated, but simultaneously. 

    So: 
      - 1:00-1:05: Explain the bot condition and distribute the form.
      - 1:05-1:07: Students fill out the form.
      - 1:07-1:20: The facilitator collects and then quickly publicly reveals the outcomes for a few volunteers to discuss.

    This saves time. 

    We'll do the simultaneous written form. 

  **Final Payoff Tables for Each Condition:**

  - Condition 1 and 2: use the 6-node table above.
  - Condition 3: same 6-node, but in the written form we describe the consequences.

  **Rules Handout for Students:**

  Condition 1: 
    - You will play a game with 6 nodes. The pot starts at 10 and grows by 10 at each node. 
    - You and your partner will take turns. At your turn, you can TAKE or PASS.
    - If you TAKE, you get the current pot and your partner gets nothing. The game ends.
    - If you PASS, the pot grows by 10 and the turn passes to your partner.
    - At node6, if the player PASSes, then both get 0.
    - First, independently complete the strategy audit (from node6 to node1).

  Condition 2: 
    - Same as condition 1, but after a PASS, there is a 5% chance that an accident occurs and both get 0. With 95% chance, the game continues.

  Condition 3: 
    - You are player 1 and will play against a bot (player 2). The bot will always choose TAKE at the first node it gets. 
    - The game is the same 6-node structure. 
    - You make the first move at node1.

  **Prediction Sheet Example:**
  - For each move in the game (after it is made), record:
    - Node number: ___
    - Player who just moved: ___
    - Move they made: TAKE/PASS
    - If the game continues, what do you think the opponent will do at the next node? (TAKE/PASS) 
    - Confidence in that prediction (1-10): ___

  But in condition 3, they only record if they passed at node1.

  **Debrief Guide:**

  1. Condition 1:
     - Ask: "In the strategy audit, what did you write for node1? Why?" (Expected: take because of backward induction)
     - "But in the actual game, did anyone pass at node1? Why might that happen?"
     - Show prediction sheets: when a player passed, what did the opponent predict? Did the opponent become more uncertain? 
     - The backward induction paradox: the theory says node1 should be taken. But if node2 is reached, what should player2 believe about player1? The common knowledge of rationality is broken.

  2. Condition 2:
     - "Did the accident condition change how you played? How?"
     - "Did anyone pass in this condition? Why?"
     - Point out: theoretically, the accident condition doesn't change the backward induction (because the expected value of passing is 0, while taking gives a positive amount). But in practice, players might pass hoping that the accident won't happen and the game will continue? Or because they think their opponent might pass too due to the accident risk?

  3. Condition 3:
     - "When playing against the bot, did you take or pass at node1? Why?"
     - "How did it feel different from playing a human?"
     - Emphasize: the bot doesn't reason; it follows a fixed strategy. There is no room for influencing its behavior.

  Finally, tie together: the backward induction argument requires common knowledge of rationality and the game structure. In practice, this common knowledge is fragile. The accident condition introduces a small uncertainty about the game continuing, but even that doesn't theoretically change the BI result. Yet, in practice, we observe passing. This is the paradox: the airtight logical argument doesn't seem to capture how we actually reason in the game.

  **Contingency for Time:**
  - If running short on time, reduce the number of nodes in the game for all conditions (e.g., 4 nodes).
  - If the bot condition takes too long, do the written form simultaneously.
  - If the debrief is cut short, focus on condition 1 and 3.

  This design should make the backward induction paradox feel live.
