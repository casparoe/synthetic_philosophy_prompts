  ### **In-Class Centipede Game Design for Rational Choice Seminar**

  **Objective:** Make students viscerally experience the backward induction paradox as a dilemma of reasoning—not just a theorem—by confronting the gap between theoretical rationality and human behavior. Focus on how **common knowledge of rationality (CKR)** breaks down in practice.

  **Game Structure (6 Nodes, 3 Pairs of Moves):**  
  - Players alternate as P1 (moves at nodes 1, 3, 5) and P2 (nodes 2, 4, 6).  
  - Pot starts at 10 points, grows by 10 at each node.  
  - **Payoff Table (All Conditions):**  

  | Node | Player | Pot | TAKE Payoffs (P1, P2) | PASS Outcome |  
  |------|--------|-----|------------------------|-------------|  
  | 1    | P1     | 10  | (10, 0)                | Pot → 20, move to node 2 |  
  | 2    | P2     | 20  | (0, 20)                | Pot → 30, move to node 3 |  
  | 3    | P1     | 30  | (30, 0)                | Pot → 40, move to node 4 |  
  | 4    | P2     | 40  | (0, 40)                | Pot → 50, move to node 5 |  
  | 5    | P1     | 50  | (50, 0)                | Pot → 60, move to node 6 |  
  | 6    | P2     | 60  | (0, 60)                | **PASS destroys pot: (0, 0)** |  

  ---

  ### **Conditions & Rules**  
  #### **1. Known-Length Chain with Strategy Audit**  
  - **Rules:**  
    - Pairs complete a **written strategy audit** before playing.  
    - Audit: From node 6 backward, students state what they *would* do at each node and why (e.g., "At node 5, I’d TAKE because if I PASS, P2 takes at node 6 and I get 0").  
    - Play the game immediately after.  
  - **Materials:**  
    - Audit sheet (table with columns: Node, My Action, Why).  
    - Prediction sheet (record after each move: opponent’s predicted next move, confidence 1–10).  
  - **Debrief Focus:**  
    - The audit makes backward induction feel airtight—yet actual play often contradicts it. Highlights how CKR *should* compel taking at node 1, but humans hesitate.  

  #### **2. 5% Accident Condition**  
  - **Rules:**  
    - After any PASS, a public random draw (e.g., bag with 19 white and 1 red token) determines if an "accident" occurs (5% chance).  
    - **Accident outcome:** Game ends, pot destroyed (0, 0).  
    - No strategy audit—only play.  
  - **Materials:**  
    - Token bag for public draws.  
    - Prediction sheets (same as Condition 1).  
  - **Debrief Focus:**  
    - Accidents create uncertainty that *could* rationalize passing (e.g., "Even if I pass, the game might end before they take"). Tests if probabilistic rescue resolves the paradox.  

  #### **3. Backward-Induction Bot**  
  - **Rules:**  
    - Students play as P1 against a facilitator-run bot (P2).  
    - Bot always plays backward induction: **TAKE at the first node it can** (node 2 if P1 passes).  
    - One-shot game per student.  
  - **Materials:**  
    - Bot script (facilitator follows rigidly: "If node 2,4, or 6 is reached, TAKE immediately").  
    - Prediction sheet (only used if student PASSES at node 1).  
  - **Debrief Focus:**  
    - Unlike humans, the bot is immune to reasoning or influence. Highlights how CKR feels different against a predictable vs. human opponent.  

  **Prize:** Small neutral prize (e.g., extra credit points) for top 3 point-earners across conditions. Stakes are non-trivial but low-pressure.  

  ---

  ### **Timeline (90 Minutes Total)**  
  - **0:00–0:10** — **Intro (10 min):**  
    - Frame the paradox: "Backward induction says TAKE at node 1. Today, you’ll confront why real people don’t."  
    - Assign pairs randomly.  

  - **0:10–0:35** — **Condition 1: Strategy Audit & Play (25 min):**  
    - *0:10–0:20*: Strategy audit (independent, backward from node 6).  
    - *0:20–0:35*: Play game + record predictions after every move.  

  - **0:35–1:00** — **Condition 2: Accident Play (25 min):**  
    - *0:35–0:40*: Re-pair students; explain accident rule.  
    - *0:40–0:55*: Play game + record predictions.  
    - *0:55–1:00*: Collect materials.  

  - **1:00–1:20** — **Condition 3: Bot Play (20 min):**  
    - *1:00–1:05*: Explain bot rules.  
    - *1:05–1:20*: Students line up; each plays 1 round against bot (publicly).  

  - **1:20–1:50** — **Debrief (30 min):**  
    Use prediction sheets and gameplay moments to dissect:  
    1. **Condition 1:**  
       - "Your audit said TAKE everywhere—why did passes happen? How did a pass at node 1 change your belief in your opponent’s rationality?"  
       - *Paradox link:* CKR assumes no node beyond 1 is reached—but if it is, rationality is no longer common knowledge.  
    2. **Condition 2:**  
       - "Did accidents make passing feel rational? Why does BI still say TAKE at node 1?" (Even with 5% accidents, EV of passing at node 1 is 0.95×0 + 0.05×0 = 0 < 10.)  
       - *Paradox link:* Accidents *shouldn’t* rescue BI, but they give players psychological cover to pass.  
    3. **Condition 3:**  
       - "Against the bot, did you TAKE or PASS? How did it feel knowing you couldn’t influence its reasoning?"  
       - *Paradox link:* BI only "works" with perfect CKR—bots simulate this, humans can’t.  
    - **Conclusion:** BI is logically sound but psychologically brittle—it requires CKR, which collapses when opponents hesitate.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Passing out of politeness/confusion:**  
     - *Likelihood:* High in early rounds.  
     - *Mitigation:* Stress "maximize your points" in rules. Use anonymous prediction sheets to reduce social pressure.  

  2. **Experts defect immediately:**  
     - *Likelihood:* Medium (2–3 students).  
     - *Mitigation:* Assign experts as observers in Condition 1; use them to seed discussion in debrief ("You took at node 1—did your partner trust you?").  

  3. **Collusion (splitting pots quietly):**  
     - *Likelihood:* Low (stakes are symbolic).  
     - *Mitigation:* Ban communication during play. Remind them predictions are graded.  

  4. **Bot condition bottlenecks:**  
     - *Likelihood:* High with 14 students.  
     - *Mitigation:* Run 2–3 bot stations with TAs; use written response if needed ("If you PASS, predict bot’s move").  

  ---

  ### **What Classroom Versions Can’t Reproduce**  
  **The Idealized Common Knowledge of Rationality (CKR):**  
  - BI requires players to *know* their opponent is rational, *know* their opponent knows they’re rational, and so on ad infinitum.  
  - **Why it fails:** Humans show hesitation, doubt, and "irrational" passes—destroying CKR. A visibly uncertain opponent makes BI feel less compelling.  
  - **How to simulate without lecturing:**  
    - In **Condition 3**, the bot *is* CKR incarnate—its mechanical play forces students to confront how alien true CKR feels.  
    - **Debrief prompt:** "When your human partner passed, did you think, ‘Maybe they know something I don’t?’ Could you think that about the bot?"  

  ---

  **Final Notes:**  
  - **Materials Prep:** Audit sheets, prediction sheets, payoff tables, token bag, bot script.  
  - **Facilitator Role:** Be a "rigorous theorist" in debrief—ask Socratic questions about predictions vs. reality.  
  - **Outcome:** Students leave feeling the paradox—BI is logical, but human reasoning is messier. This sets up future lectures on bounded rationality or epistemic game theory.  

  This design forces engagement with the paradox’s core tension: theory assumes flawless reasoning, but humans *reason about reasoning*—and that changes everything.
