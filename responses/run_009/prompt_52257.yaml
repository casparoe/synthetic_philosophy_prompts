prompt: |-
  I'm a graduate student in public history, and for a seminar paper I've been cataloguing the labeling conventions that large museums follow when they display narratives sitting somewhere between myth and history — the Trojan War, King Arthur, the Exodus. The pattern puzzles me. In the Bronze Age galleries, the Trojan War is introduced as myth, but the label goes on to mention that excavations at Hisarlik revealed a sizable city destroyed in the late Bronze Age, and that the war may reflect a real conflict, with heavy hedging of the kind that says a historical kernel may lie behind the story. In the medieval galleries, Arthur is called a legendary king, with a note that some historical commander might stand behind the legend — hedging about the existence of a person rather than of events. The Exodus is handled differently again: it is called a founding narrative of a tradition, with a note that archaeology has found no trace of any mass migration out of Egypt, and the label offers no suggestion at all that the event may have occurred. Meanwhile, two galleries over, a pharaoh's military campaigns are stated as flat fact on the basis of his own monumental inscriptions, with no hedging whatsoever, even though those inscriptions are self-serving propaganda and, in many cases, our only source. So one institution, presumably applying one policy, seems to issue several different verdicts on broadly similar evidential situations.

  I'd like you to reconstruct the implicit epistemology of this labeling practice. What does the practice presuppose about what makes a narrative history rather than legend or myth — a threshold of independent corroboration, and if so, corroboration of what exactly, the events, the setting, or the existence of a central figure? Does the practice treat history as a property of the narrative itself or of our epistemic position with respect to it? Notice that the labels seem to vary with the size of the claim even where the direct corroboration is comparably thin: a story of hundreds of thousands of people wandering for decades gets no may-have-occurred at all, while a story of one city's fall gets a hedged maybe, and it's tempting to read this as the practice implicitly encoding scale-sensitive priors — the idea that a bigger claim would have left bigger traces, so silence in the record weighs more heavily against it. Is that a real feature of the implicit view, or just an artifact of curatorial caution? Please separate what the practice strictly presupposes from what it merely fits well with, tell me where it is underdetermined such that rival epistemologies would license exactly the same labels, and flag any incoherence in it — is it consistent to hedge the historicity of the war while asserting the campaigns unhedged, when the campaign evidence is narrower in source and more biased in provenance than the tradition behind Troy?

  Finally, tell me what would actually have to change in the wall text if the museum replaced this implicit view with a straightforwardly probabilistic one, expressing credences instead of using the myth, legend, and history vocabulary. Would schoolchildren and casual visitors be able to read such labels, or does the old trichotomy do something a credence cannot, such as indicating what kind of access to the past each narrative claims to give us — communal memory, poetic tradition, documentary record — rather than merely how likely it is? Please respond in continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write a letter, since the piece will be passed to my supervisor in that form.
reasoning: |-
  Hmm, this is a fascinating query from a public history graduate student. They're analyzing museum labeling practices for narratives that sit between myth and history - Trojan War, King Arthur, Exodus - and noticing inconsistent epistemological approaches. The student wants me to reconstruct the implicit epistemology behind these labeling conventions.

  Let me unpack their observations first. For the Trojan War, museums call it myth but hedge about a possible historical kernel based on archaeological evidence of a destroyed city. For Arthur, it's legendary with hedging about a possible historical figure. But for Exodus, they flatly state there's no archaeological evidence and offer no hedging at all. Meanwhile, pharaohs' campaigns based solely on their own propaganda inscriptions are presented as factual without qualification. 

  The core tension seems to be: how do museums decide when to hedge and when not to? The student raises brilliant questions about whether this practice assumes:
  - A threshold of independent corroboration (and what needs corroborating - events, setting, or figures?)
  - Whether historicity is treated as inherent to the narrative or dependent on our evidence
  - Whether scale affects the hedging (larger claims require stronger evidence)

  I notice three key variables in the museum's implicit epistemology:
  1) Source hierarchy - they privilege contemporary documents (even biased ones) over oral traditions
  2) Corroboration requirements - they need archaeological/independent evidence to take oral traditions seriously
  3) Scale sensitivity - absence of evidence counts more against large-scale events

  The inconsistency is starkest when comparing Trojan War (hedged despite thin evidence) vs Pharaoh's campaigns (no hedging despite single biased source). This suggests museums treat contemporary inscriptions as direct evidence while viewing transmitted traditions as inherently suspect.

  If museums switched to probabilistic labeling ("75% chance Arthur existed"), it might be more precise but less accessible. The myth/legend/history trichotomy actually communicates something valuable about the nature of the sources - whether they claim to be documentary records, communal memory or poetic traditions. A percentage wouldn't capture that qualitative difference.

  The real epistemological rift is between events documented in their own time (treated as historical until disproven) versus events known only through later transmission (treated as mythical until proven). This explains why Pharaoh's propaganda gets a pass while Exodus doesn't - it's about proximity of recording, not reliability.

  For the student's paper, the most productive angle might be exposing this unstated temporal hierarchy in historical epistemology. The labeling practices reveal how museums unconsciously privilege certain types of evidence based on when they were recorded rather than their actual reliability.
answer: |-
  The museum's labeling practices reveal an implicit epistemology that treats historical status not as inherent to narratives but as determined by our epistemic position—specifically, the availability and nature of corroborating evidence. This view presupposes a hierarchy of sources: contemporary inscriptions (even propagandistic ones) are granted provisional factual status by default, while later traditions require independent archaeological or textual corroboration to be considered historically plausible. The threshold for affirmation varies based on three interrelated factors: the scale of the event, the proximity of sources to the alleged events, and the type of evidence required for corroboration.  

  For narratives like the Trojan War or Arthur, the labels suggest that historicity hinges on corroborating the *context* rather than the specific events or figures. Hisarlik's destruction corroborates a plausible setting for conflict; Romano-British warlords corroborate a potential leader around whom legends accreted. The hedging ("may reflect," "might stand behind") reveals an epistemology that accepts a historical kernel can exist beneath mythologized layers if material evidence aligns with the narrative's backdrop. Conversely, Exodus receives no such qualification because archaeology actively contradicts its scale (no evidence of desert encampments, Egyptian records show no mass enslavement or flight). Here, the implicit principle is that larger claims demand proportionally stronger evidence—silence in the record is damning when we should expect overwhelming traces. This scale-sensitivity isn't mere caution but a coherent, if unstated, Bayesian intuition: prior probability decreases as claims grow grander.  

  The treatment of pharaonic campaigns exposes a tension, however. Monumental inscriptions are accepted as factual despite being narrow and biased, while traditions like the Trojan War—supported by archaeology *and* cross-cultural texts—are hedged. This inconsistency suggests the epistemology privileges *contemporary documentation* over *transmitted tradition*, regardless of reliability. A propagandistic inscription is deemed a "historical document" by virtue of its contemporaneity, while an oral epic preserved centuries later is "legend" until verified externally. Thus, historicity is assigned based on source typology (document vs. tradition) and temporal proximity, not just evidence quality. Rival epistemologies could produce identical labels: a positivist might demand direct evidence for any event, while a constructivist might see all narratives as mythologized. The museum's approach sits between, accepting inscribed boasts as brute facts but treating cultural memory as suspect until materially verified.  

  Replacing this framework with explicit probabilistic credences ("70% chance of a historical Arthur," "5% chance of Exodus as described") would clarify ambiguities but risk alienating lay audiences. The myth/legend/history trichotomy does more than convey likelihood—it signals the *nature of the source* and its claimed relationship to the past. "Myth" implies sacred or symbolic truth; "legend" suggests oral transmission with potential roots in real events; "history" denotes documentary or material traces. A credence system would obscure these distinctions, reducing narrative complexity to a single metric. For schoolchildren, "legend" intuitively communicates communal memory filtered through time, while a percentage might confuse or mislead (e.g., does 30% probability mean Arthur was 30% real?). The current labels, despite inconsistencies, efficiently categorize narratives by their epistemic pathways—something a number cannot replicate. To adopt probabilism, museums would need to retrain visitors to think in Bayesian terms, likely supplementing percentages with explanations of evidence types and uncertainties. Yet the trichotomy’s durability suggests it fulfills a practical need: it navigates the murk between event and interpretation by classifying stories according to how they were born, not just how they might die under scrutiny.  

  Incoherence remains in the uneven application of skepticism, particularly toward contemporary inscriptions versus transmitted tales. But this may reflect museological conventions more than epistemology: the pharaoh’s campaign is presented as history because it sits within a gallery structured around documented rulers, while the Exodus exists in a realm of cultural memory. The labels thus reveal a deeper presupposition: history is what institutions archive; myth is what communities remember.
