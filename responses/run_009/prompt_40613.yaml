prompt: |-
  So here's my situation: I'm a grad student and I'm leading a discussion section next week for a course on early modern philosophy of math, and the prof told me to do something "fun" with the Hobbes material since the students found the Hobbes–Wallis feud (the circle-squaring obsession, the insults, all of it) way more entertaining than the Descartes unit. My idea: have them play the game of predicting how Hobbes would've reacted to developments in math that happened long after he died, since his whole view was that math is about bodies in motion and definitions we fully control. I want to write up my own answer key first so I know what I think, and honestly I keep flip-flopping, so help me out.

  Specifically, walk me through Hobbes's likely reactions to three or four post-1679 developments: non-Euclidean geometry coming on the scene in the 1800s; Cantor's set theory and the whole idea of actual completed infinities; the arithmetization of analysis, where the calculus gets rebuilt with epsilon-delta arguments and motion basically gets purged from the foundations; and, if you want a fourth, computability stuff like Turing machines (a machine! made of parts! doing pure symbol manipulation! he might weirdly love that, or hate it, I can't tell).

  For each one, don't just give me a vibes answer. Actually argue from his real commitments — everything that exists is body, geometry is the paradigm science because we can picture ourselves generating its objects by motion, definitions are the scientist's own arbitrary starting points, and "insignificant speech" (names for things we can't conceive) is the root of all absurdity. But also flag the places where those commitments pull in opposite directions, because that's what I keep getting stuck on. Like, his definitionalism seems like it should make him chill about non-Euclidean geometry ("you defined your primitives, knock yourself out"), but his materialism says geometry is literally the science of real extension, which sounds like there's exactly one true geometry and everyone else is doing nonsense. Does he end up a formalist two centuries early, or the world's angriest anti-formalist? Same tension with actual infinities: he denied the actual infinite, but was that a core commitment or just inherited scholastic baggage for him?

  Also, please rank the four from "most confident this is what he'd say" to "genuinely could go either way," and end by telling me which posthumous development would've made him personally angriest — I want a fun closer for the section. Keep in mind his track record of being confidently wrong (the circle-squaring business) when you're estimating how much weight to put on his self-image as a geometer.
