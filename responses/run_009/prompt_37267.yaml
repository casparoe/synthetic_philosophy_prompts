answer: |-
  Your friend's argument is clever and taps into genuine challenges in consequentialism (the "cluelessness" problem), but the critical break occurs between **(5) and (6)**, specifically in the leap from *"I can't predict the far-future effects"* and *"the noise is symmetric"* to *"no act is better than any other"*. Here's the detailed breakdown:

  ### 1. **Why Step (5) to (6) Fails: The Symmetry Assumption**
     - **The Flaw**: Your friend assumes that because we *can't predict* the sign/size of butterfly effects, the *expected value* (EV) of these effects must be *zero* or *washed out* ("symmetric noise"). This is unjustified.
     - **"Symmetric Noise" is an Empirical Claim Without Evidence**: Saying the noise is symmetric implies that for every action causing a butterfly effect leading to a slightly better future, there's an equally probable action causing one leading to a slightly worse future. But there's no reason to believe this. Chaos theory tells us outcomes are unpredictable, not that they're probabilistically neutral.

     - **The "Unknown Biases" Point**: Your friend was right to push back when you questioned this. **Assuming symmetry is just as much a guess as assuming bias.** We lack the knowledge to assert symmetry. The distribution of butterfly effects could be:
       - *Positively biased*: Trivial acts might slightly increase well-being on average (e.g., kindness ripples).
       - *Negatively biased*: Trivial acts might slightly increase suffering on average (e.g., irritation spreads).
       - *System-dependent*: The bias depends on context (current world state, your social position).
       - *Truly neutral*: But this is only one possibility, not the default.

     - **Consequence**: If the distribution isn't symmetric, then even if we can't predict *individual* effects, the *expected value* across possible butterfly-effect paths might not be zero. Some acts could have a tiny positive/negative EV from far-future effects.

  ### 2. **The "Unknown vs. Symmetric Noise" Distinction (With Example)**
     - **Symmetric Noise**: Imagine flipping a fair coin. Heads adds +1 util to the far future, tails adds -1 util. EV = 0. Noise washes out.
     - **Unknown (Potentially Biased) Noise**: Imagine rolling a die with unknown weights. You know it will land 1-6, but you don't know if high numbers are more likely. The outcome is unpredictable, but the EV might be +10 (if weighted high) or -10 (if weighted low). **You can't assume EV=0 just because outcomes are unknown.**
     - **Your Email Example**: Sending an email now vs. later *might* set off a chain leading to a utopia or a dystopia. But:
       - Is the probability distribution over these outcomes *symmetric*? Maybe delaying emails *slightly* increases the chance of miscommunication cascades (negative bias). Or maybe promptness *slightly* increases coordination (positive bias). Or maybe it depends on the email's content/recipient. **Without evidence, symmetry is arbitrary.**

  ### 3. **Why Other Steps Hold (and Why Fixing (5)→(6) Matters Most)**
     - (1), (2), (3): Largely correct. Small acts *can* have massive downstream effects; the future *is* vast.
     - (4): This is core consequentialism. Keeping it is possible.
     - (7), (8): *If* (6) were true, this would follow. But since (6) relies on an unsupported assumption, the collapse is avoided.
     - **(5) is Partially True**: We genuinely can't predict *specific* far-future butterfly effects. But **unpredictability ≠ moral irrelevance or EV=0**.

  ### 4. **What's the Cost of Accepting Your Friend's Entire Argument?**
     If you grant all steps (including symmetric noise), you must conclude:
     - **Consequentialism is "useless" for virtually all real-world decisions** (since butterfly effects dominate but are incalculable).
     - **Moral nihilism or radical skepticism**: If *no* act is better than another, ordinary moral thinking (e.g., "don't lie," "help others") lacks a consequentialist foundation. This is a major cost if you believe morality should guide action.

  ### 5. **Repairing Consequentialism: Alternatives After Rejecting (6)**
     - **A. Focus on Tractable Proximate Effects**: Ignore incalculable butterfly effects. Base EV estimates on predictable near-term impacts (e.g., helping someone now has clear positive EV). *Cost*: Feels ad hoc; contradicts (3)'s claim that the far future dominates.
     - **B. Systemic/Heuristic Approaches**: Use rules/heuristics likely to have good *systemic* effects across many scenarios (e.g., "be kind," "promote knowledge"). These may correlate with positive butterfly-effect biases. *Cost*: Less "pure" consequentialism; requires empirical assumptions about systemic effects.
     - **C. Differential Predictability**: Some acts (e.g., nuclear war) have predictable catastrophic effects; others (e.g., email timing) don't. Focus EV calculations on domains where prediction is feasible. *Cost*: Still leaves "cluelessness" for trivial acts.
     - **D. Embrace Uncertainty with Decision Theory**: Use tools like the *precautionary principle* (avoid acts with tiny risks of catastrophe) or *maximin* (choose the act with best worst-case outcome). *Cost*: Departs from standard EV maximization.
     - **E. "Best Guess" Expected Value**: Acknowledge uncertainty but use *all available evidence* to estimate EV, even if estimates are vague. E.g., kindness *might* have a slight positive far-future bias. *Cost*: Requires defending probabilistic assumptions under radical uncertainty.

  ### Conclusion: Where to Place the Hated Step
  **Reject the inference from (5) to (6).** Unpredictability does not imply neutrality. The assumption of "symmetric noise" is unsupported and smuggles in the conclusion that all acts are equal. By rejecting this, consequentialism survives as a guide—though it must grapple with *how* to act under deep uncertainty (the "cluelessness" problem). 

  **The most honest path forward** is likely **E** ("Best Guess EV") combined with **B** (heuristics): Use proximate effects as your best *tractable* evidence for likely systemic/far-future impacts, while acknowledging uncertainty. This preserves (4) and avoids nihilism, but admits that consequentialism isn't omniscient—it's a tool for limited beings in a chaotic world. 

  Your friend's comeback ("symmetric noise is just a guess") is correct, but it cuts both ways: **Consequentialism isn't refuted by cluelessness; it's challenged to operate more humbly within it.** The real takeaway isn't that consequentialism fails, but that it must be applied with epistemic rigor about what we can and cannot know.
