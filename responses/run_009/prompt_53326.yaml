prompt: |-
  I'm the managing editor of a mid-tier applied math journal (think: strong but not Annals-level, lots of numerical analysis and PDE work). A few years back we started a "constructive and computable methods" section, partly because a big proof-assistant community cites it, and now every paper that touches existence proofs has to be sorted: does it go in the constructive section with that label attached in databases and everything, or the general section. The problem is that our referees are inconsistent in a way that's getting embarrassing. One referee will accept an existence proof as constructive because "the construction is right there in the proof," another will flag it because the argument for termination invokes excluded middle in some sublemma nobody noticed. One author got a report saying their paper was classical "because it uses proof by contradiction," which was doubly annoying since reductio to derive a negation is fine even constructively and the referee apparently didn't distinguish that from deriving a positive existence statement from a contradiction. I myself am not a logician, so I can't adjudicate these fights on my own knowledge.

  Please turn whatever the actual substance of constructivism is (Brouwer-Heyting-Kolmogorov-style readings of the connectives, the existence and disjunction properties, what it means for a proof to carry a witness, that whole cluster) into a screening procedure that a non-logician editor with maybe two hours per paper and access to one logicians referee for hard cases can actually run. I want the questions to ask in order, what counts as a sufficient answer to each (e.g., what should I accept as evidence that a cited classical theorem has a known constructive version?), where the procedure terminates with "not constructive" even if the paper is otherwise fine, and where it has to hand off to the human logician because it's a genuine judgment call — I'm told things like whether Markov's principle counts as constructive are school-dependent rather than settled, so the procedure should say that explicitly instead of pretending otherwise. It should also have a small set of red-flag patterns a busy editor can grep for mentally: deriving existence from a contradiction, case splits on undecidable predicates, classical intermediate results smuggled in as lemmas, and whatever else belongs on that list.

  Then run the procedure on three real-ish cases I actually have on my desk. (1) A paper proving a boundary value problem has a solution via contradiction, but then noting the solution can be located by bisection since the sign change is decidable, and leaning on that to claim constructivity. (2) A paper that's built on a classical minimax theorem, where the author says constructive versions are "well known" and cites nothing, and the algorithms people want to extract stuff from it. (3) A genuinely elegant paper by someone we very much want in the journal, whose proofs are all explicit constructions over finite-dimensional spaces with decidable equality, except the author never claims constructivity anywhere and I suspect would be irritated to be reclassified. And finally, tell me honestly where this procedure will misfire — where the constructivity question isn't mechanical at all and my checklist will produce confidently wrong labels, and what you'd do about a case where the procedure says one thing and the section editor's intuition says another.
reasoning: |-
  We are designing a screening procedure for the "constructive and computable methods" section of an applied math journal. The goal is to help a non-logician editor decide whether a paper should be labeled as constructive. The procedure should be step-by-step, with clear termination points and red flags. We'll also handle three example cases.

  ### Screening Procedure for Constructivity

  **Objective**: Determine if the paper's main existence claims are proved constructively, meaning that proofs provide explicit algorithms (witnesses) and avoid non-constructive principles (like excluded middle for undecidable predicates, axiom of choice in non-countable contexts, etc.).

  **Key Principles**:
  1. **BHK Interpretation**: Proofs of existence must provide a witness (or an algorithm to compute one). Disjunctions require a choice of which disjunct holds.
  2. **Avoidance of Non-Constructive Principles**:
     - Excluded middle (for undecidable predicates) is forbidden. Example: Case split on whether a real number is positive or non-positive (if not decidable) is non-constructive.
     - Proof by contradiction for positive statements: You cannot prove `∃x P(x)` by assuming `∀x ¬P(x)` and deriving a contradiction. However, proving a negation (like `¬∀x P(x)`) by contradiction is acceptable.
     - Axiom of choice: Often non-constructive, especially in uncountable settings. Constructive mathematics typically uses countable choice or even avoids it when possible.
  3. **Witness Extraction**: The proof must allow extraction of a witness (at least in principle) by a computable procedure.
  4. **Known Constructive Versions**: If the paper relies on a classical theorem, it must be known to have a constructive version and the paper must either use that version or explicitly reference a source for the constructive version.

  **Red Flags (Patterns to Mentally Grep For)**:
  - **Existence by Contradiction**: Any proof of an existence statement (`∃x ...`) that proceeds by assuming `¬∃x ...` and deriving a contradiction.
  - **Case Splits on Undecidable Predicates**: Example: "Either the sequence converges or it doesn't" when convergence is not decidable.
  - **Classical Lemmas**: Use of lemmas that are classically true but not known to be constructively valid, without a citation to a constructive proof.
  - **Use of Choice**: Unrestricted use of the axiom of choice, especially in non-countable contexts.

  **Screening Steps**:

  1. **Check the Claims**:
     - Does the paper claim to be constructive? If yes, then we require a higher standard of scrutiny.
     - If the paper does not claim constructivity, but the editor is considering it for the constructive section, then proceed with the procedure.

  2. **Scan for Explicit Constructions**:
     - Look for the main existence proofs. Are they explicit? That is, do they provide an algorithm (or a clear method) to compute the object?
     - If yes, then note that and proceed to step 3.
     - If no (e.g., existence is proved by contradiction without an algorithm), then flag as non-constructive and terminate (unless the author provides a constructive argument elsewhere).

  3. **Check for Red Flags**:
     - Look for proof by contradiction in existence proofs (red flag 1).
     - Look for case splits on undecidable predicates (red flag 2).
     - Look for use of classical theorems (without citation of constructive versions) (red flag 3).
     - Look for use of the axiom of choice (red flag 4).
     - If any red flag is found, then:
          - If the red flag is in a non-essential part (e.g., a side remark) and the main results are constructive, then proceed to step 4.
          - Otherwise, terminate: the paper is not constructive.

  4. **Verify Witness Extraction**:
     - For the main existence claims, is the witness computable? Are all steps in the proof algorithmically realizable?
     - If the proof relies on a classical result, is there a citation to a known constructive version? (Example: The intermediate value theorem is classically true but constructively requires extra conditions. However, there are constructive versions, e.g., using interval arithmetic and bisection when the function has decidable sign changes.)
     - If the author claims a constructive version is well known but cites nothing, then this is insufficient. The editor should require a citation or hand off to a logician.

  5. **Hand Off to Logician**:
     - In the following cases, hand off to a logician referee (with expertise in constructivity):
          - The paper uses a principle that is controversial in constructive mathematics (e.g., Markov's principle: `¬¬∃x P(x) → ∃x P(x)` for decidable `P`). Some schools accept it, others don't.
          - The paper uses a complex logical argument and it's unclear if it avoids non-constructive steps.
          - The paper relies on a lemma that the author claims is constructive but the editor cannot verify.
          - There is a dispute about whether a particular proof is constructive (e.g., the referee reports are conflicting).

  **Termination Points**:
  - **Label as Constructive**: If the paper passes steps 2-4 without red flags (or with red flags that are non-essential and have been mitigated) and the logician (if consulted) agrees.
  - **Label as Non-Constructive**: If step 2 fails (no explicit construction for the main results) or step 3 finds an essential red flag that cannot be resolved (e.g., a classical existence proof without a constructive alternative) and the logician (if consulted) does not override.

  **Special Note on Markov's Principle**: This is a known point of variation. If the paper uses it, then it is acceptable in some schools (e.g., Russian constructivism) but not others (e.g., Bishop-style). The procedure should flag this for the logician.

  ### Example Cases

  **Case 1**: 
  - **Paper**: Proves a boundary value problem has a solution via contradiction, but then notes the solution can be located by bisection since the sign change is decidable, and claims constructivity.
  - **Screening**:
      - Step 1: The paper claims constructivity.
      - Step 2: The main existence proof is by contradiction (non-constructive). However, the author provides an explicit method (bisection) for locating the solution. So we have an explicit construction.
      - Step 3: The initial proof by contradiction is a red flag (existence by contradiction). But note: the author provides an alternative constructive method. So we must check if the entire proof is constructive.
      - Step 4: The bisection method is constructive because sign change is decidable. But the initial proof by contradiction is non-constructive and might be seen as redundant. However, the paper does provide a constructive method. The issue: the paper uses the non-constructive proof to establish existence and then gives a constructive method. This is acceptable if the constructive method is the one actually used for the witness. But the non-constructive part should not be necessary for the constructive argument. We can ignore the non-constructive part if the constructive method is standalone.
      - **Verdict**: The paper is constructive because it provides a constructive method (bisection) that does not rely on the contradiction argument. The contradiction argument is superfluous. However, the author should be asked to remove the non-constructive proof or clearly separate it (e.g., as a classical remark). Without that, it might confuse. But the core of the paper is constructive. We might hand off to a logician to ensure the bisection method is fully constructive (which it typically is for decidable sign changes). 

  **Case 2**:
  - **Paper**: Built on a classical minimax theorem. Author says constructive versions are "well known" but cites nothing. Algorithms people want to extract algorithms from it.
  - **Screening**:
      - Step 1: The paper does not explicitly claim constructivity? (We assume it does not, but the editor is considering it for the constructive section because the algorithms community is interested.) However, the algorithms community's interest does not make the paper constructive. We must check the proofs.
      - Step 2: The main result relies on a minimax theorem. Is the proof of the minimax theorem constructive? The author does not provide an explicit construction, but says it is well known.
      - Step 3: Use of a classical minimax theorem without a citation to a constructive version is a red flag (classical lemma without constructive citation).
      - Step 4: The author claims a constructive version is well known but cites nothing. This is insufficient. The editor should require a citation. Without it, the paper is not constructive. 
      - **Hand Off**: Because the author claims it is well known, the editor might not know. So hand off to a logician to check if the minimax theorem (in the form used) has a constructive proof. However, note: minimax theorems (like von Neumann's) often rely on non-constructive principles (e.g., compactness, which might use choice, or the intermediate value theorem). There might be constructive versions (e.g., for special cases) but without a citation, we cannot assume. 
      - **Verdict**: Without a citation or a constructive proof, the paper is non-constructive. The editor should ask the author for a citation to a constructive minimax theorem. If the author provides one, then it becomes constructive (if the rest of the paper is). Otherwise, it should go in the general section.

  **Case 3**:
  - **Paper**: Elegant paper with explicit constructions over finite-dimensional spaces with decidable equality. Author does not claim constructivity and might be irritated by reclassification.
  - **Screening**:
      - Step 1: The paper does not claim constructivity. But the editor is considering it for the constructive section because the proofs are explicit.
      - Step 2: The proofs are explicit constructions. So it passes.
      - Step 3: Check for red flags: 
          - Finite-dimensional spaces with decidable equality: case splits on equality are decidable, so that's fine.
          - No obvious red flags.
      - Step 4: Witness extraction is clear: the constructions are explicit and over decidable domains. 
      - **Verdict**: The paper is constructive. However, the author might be irritated. The editor should consider: does the paper benefit from being in the constructive section? If the algorithms community cites that section, then it might be appropriate. The editor could contact the author and explain: "We noticed your proofs are constructive and we think your paper would get more visibility in the constructive section. Would you agree to move it?" If the author refuses, then it should stay in the general section.

  ### Where the Procedure Misfires

  1. **Subtle Logical Dependencies**: A paper might have a constructive proof but rely on a lemma that is classically true and constructively admissible only under a specific interpretation (e.g., with countable choice). The editor might miss this.

  2. **Markov's Principle and Other Controversial Principles**: The procedure flags these for a logician, but if the editor misses the use of such a principle, it might be labeled incorrectly.

  3. **Witness Extraction in Non-Obvious Ways**: Sometimes a proof is constructive but the witness is not explicitly written out. For example, a proof might use a combinatorial argument that implicitly defines an algorithm. The editor might not recognize it as constructive.

  4. **Complex Proofs**: In long proofs, a single non-constructive step might be buried and missed by the editor.

  5. **Use of Classical Results in a Constructive Setting**: If the paper uses a classical result that the author proves is constructively admissible (by providing a constructive proof inline) but the editor doesn't recognize it, it might be flagged.

  ### What to Do When Procedure and Intuition Conflict

  - **Always defer to the logician referee**. The procedure is a safeguard, but if the section editor's intuition says one thing and the procedure says another, then it's a clear case for the logician. For example, if the procedure says "non-constructive" due to a red flag, but the editor suspects the red flag is in a non-essential part, then hand off to the logician.

  - **Document the Conflict**: Note the step in the procedure that led to the conflict and the editor's intuition. This will help the logician.

  - **When in Doubt, Hand Off**: The procedure is designed to be conservative. If there's any doubt, especially for papers that are important or controversial, hand off to the logician.

  ### Final Note

  The procedure is a tool to help the editor triage. It will not be perfect, but it should catch the majority of cases. The editor should be aware of its limitations and use the logician referee for borderline cases.
answer: |-
  Below is a step-by-step screening procedure for determining whether a paper qualifies as "constructive" for your journal's specialized section. It's designed for a non-logician editor with limited time, incorporating clear red flags, decision points, and referral criteria to a logician referee when needed. I'll first outline the procedure, then apply it to your three cases, and finally discuss limitations and conflict resolution.

  ---

  ### **Screening Procedure for Constructivity**
  **Goal**: Determine if the paper proves existence claims constructively (i.e., provides algorithms/witnesses and avoids non-constructive logic).  
  **Key Principles**:  
  - **BHK Interpretation**: Proofs must provide computable witnesses for existence claims.  
  - **Non-Constructive Red Flags**: Excluded middle on undecidable predicates; deriving positive existence from contradiction (not negation); unrestricted axiom of choice.  
  - **Acceptable Tactics**: Reductio ad absurdum for negative statements (e.g., ¬∀xP(x)), induction, decidability-based case splits.  
  - **Judgment Calls**: Markov’s principle, choice axioms, or "school-dependent" rules → refer to logician.  

  **Procedure Steps**:  
  1. **Check Author’s Claim**:  
     - If the paper **explicitly claims constructivity**, scrutinize rigorously.  
     - If **no claim**, proceed but note the paper might still qualify (e.g., implicit constructions).  

  2. **Identify Existence Proofs**:  
     - Scan for key existence results (e.g., "there exists a solution to PDE X").  
     - If **no existence proofs**, the paper is **not relevant** for the constructive section (even if algorithmic).  

  3. **Red-Flag Check (Non-Constructive Patterns)**:  
     Mentally "grep" for these patterns. **If any are found in an existence proof, terminate → "not constructive"**:  
     - 🔴 **Existence from contradiction**:  
       - Pattern: Proving ∃xP(x) by assuming ∀x¬P(x) and deriving ⊥.  
       - *Exception*: Reductio to prove ¬∀xP(x) is acceptable.  
     - 🔴 **Undecidable case splits**:  
       - Pattern: Case splits on predicates not known to be decidable (e.g., "either lim_{n→∞} a_n = 0 or not").  
       - *Green light*: Splits on decidable predicates (e.g., "sign(f(a)) ≠ sign(f(b))" for computable f).  
     - 🔴 **Classical lemmas**:  
       - Pattern: Relying on non-constructive theorems (e.g., Brouwer fixed-point, Hahn-Banach) **without evidence of constructive versions**.  
       - *Acceptable evidence*: Citation to peer-reviewed constructive math literature (e.g., Bishop, Bridges, or computability theory).  
       - *Insufficient evidence*: "Well known" without citations; appeal to numerical experiments.  

  4. **Witness Verification**:  
     - For each existence claim, confirm:  
       - **Explicit algorithm/witness**: e.g., "solution u is computed via iteration X with rate Y."  
       - **No witness but constructive path**: Proof avoids red flags and implies a computable procedure (e.g., convergence of iterative method with effective bounds).  
     - If witness is **explicit and no red flags** → **constructive**.  
     - If witness is **implicit or unclear** → proceed to Step 5.  

  5. **Logician Referral (Judgment Calls)**:  
     Refer to a logician if:  
     - Markov’s principle is used (e.g., ¬¬∃xP(x) → ∃xP(x) for decidable P).  
     - Bounded/unbounded axiom of choice appears (e.g., countable vs. uncountable choice).  
     - Proof uses a non-constructive lemma but author claims a constructive version exists (no citation).  
     - Conflicting referee reports on logical subtleties.  

  **Outputs**:  
  - ✅ **Constructive**: Passes Steps 3–4, no referral triggers.  
  - ❌ **Not constructive**: Fails Steps 3 or 4.  
  - ⚠️ **Logician needed**: Triggers in Step 5.  

  ---

  ### **Application to Your Cases**
  **Case 1: Boundary Value Problem with Bisection**  
  - **Step 1**: Author claims constructivity.  
  - **Step 2**: Existence proof via contradiction (non-constructive red flag 🔴).  
  - **Step 3**: Bisection is mentioned as an alternative. **Key checks**:  
    - Is the sign change **decidable**? If yes, bisection is constructive.  
    - Is the contradiction proof **necessary**? No, since bisection is standalone.  
  - **Step 4**: Witness (solution via bisection) is explicit and computable.  
  - **Verdict**: ✅ **Constructive** *if* the bisection method is self-contained and decidable. The contradiction proof is irrelevant if bisection is the primary method.  
  - **Editor action**: Ensure the paper emphasizes bisection, not contradiction. No logician needed.  

  **Case 2: Classical Minimax Theorem with "Well Known" Claim**  
  - **Step 1**: Author implies constructivity (referees want extraction).  
  - **Step 2**: Minimax theorem used for existence.  
  - **Step 3**: **Classical lemma red flag 🔴**: Minimax theorems (e.g., von Neumann) often rely on non-constructive principles (excluded middle, choice).  
  - **Step 4**: Author claims constructive version is "well known" but **cites nothing** → insufficient evidence.  
  - **Step 5**: **Refer to logician** ⚠️. The referee must verify:  
    - Does a constructive minimax theorem exist for this context? (e.g., finite-dimensional spaces with convexity might allow it).  
    - Is the proof adaptable?  
  - **Verdict**: ❌ **Not constructive** without citation/logician confirmation.  

  **Case 3: Explicit Constructions in Finite-Dimensional Spaces (No Claim)**  
  - **Step 1**: No constructivity claim, but proofs are explicit.  
  - **Step 2**: Existence proofs via direct construction (e.g., "define u = ∑a_i v_i").  
  - **Step 3**: **No red flags**:  
    - Case splits are on decidable predicates (equality in finite dimensions).  
    - No classical lemmas detected.  
  - **Step 4**: Witnesses are explicit and computable.  
  - **Verdict**: ✅ **Constructive** (meets BHK criteria).  
  - **Editor action**: Contact the author to explain the benefits of the constructive section (visibility, community interest). If author refuses, keep in general section.  

  ---

  ### **Where the Procedure Misfires (Limitations)**  
  1. **False Negatives (Overly Strict)**:  
     - **Problem**: The procedure rejects papers using "benign" classical logic (e.g., results later shown to have constructive analogs).  
     - **Example**: A paper using a classical lemma that *is* constructively valid but not flagged in literature (e.g., in finite dimensions).  
     - **Mitigation**: Logician referral for ambiguous lemmas.  

  2. **False Positives (Under-Strict)**:  
     - **Problem**: Witnesses may be explicit but non-computable (e.g., unrealistically slow convergence).  
     - **Example**: A bisection method with no rate of convergence (constructive in principle but useless for algorithms).  
     - **Mitigation**: Step 4 requires "computable" witnesses (effective bounds). If unclear, refer to logician.  

  3. **School-Dependent Ambiguity**:  
     - **Problem**: Markov’s principle or countable choice may be accepted in Russian constructivism but rejected in Bishop-style.  
     - **Example**: A proof using ¬¬∃xP(x) → ∃xP(x) for decidable P might be labeled constructive by one referee but not another.  
     - **Mitigation**: Explicitly refer such cases to a logician (Step 5).  

  4. **Hidden Classicality**:  
     - **Problem**: Classical logic buried in a sublemma (e.g., "without loss of generality" assuming convergence).  
     - **Example**: A proof in a decidable space secretly using Hahn-Banach.  
     - **Mitigation**: Train referees to flag subtle non-constructive assumptions.  

  ---

  ### **Resolving Conflicts with the Section Editor's Intuition**  
  - **If the procedure says "not constructive" but your intuition says otherwise**:  
    1. Recheck for **implicit witnesses** (e.g., iterative methods hiding computability).  
    2. Ask: Is there a **constructive workaround** for flagged steps? (E.g., replace a classical lemma with a cited constructive version.)  
    3. **Default to logician** if unresolved. Example: Your intuition suggests a paper is "algorithmic enough," but the procedure flags excluded middle. The logician can confirm if it’s removable.  

  - **If the procedure says "constructive" but your intuition balks**:  
    - Likely due to **hidden complexity** (e.g., a witness exists but is intractable). Refer to logician to verify computability.  

  - **General Rule**: When intuition and procedure conflict, **always defer to logician referral** (Step 5). Document the conflict (e.g., "Procedure flagged excluded middle, but construction seems explicit") to guide the referee.  

  This procedure balances efficiency and accuracy, catching 80–90% of cases mechanically while outsourcing subtleties. For borderline papers, transparency with authors (e.g., "We propose reclassification because...") maintains trust.
