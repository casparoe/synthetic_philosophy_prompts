answer: |-
  You've nailed a profound and pervasive pattern — one that absolutely deserves a name. It's not quite any single *established* fallacy, but rather a subtle **semantic overreach enabled by linguistic framing**. Let's carve it:

  ### The Fallacy: **Scope Transference**
  1.  **Core Mechanism:** The certainty or indubitability established for a *minimal, occurrent state* (e.g., "thinking is happening *now*") is illicitly transferred, via the *linguistic structure* of the statement itself, to a *broader, substantive claim* (e.g., "there exists a persistent thinking *self*") without additional justification. The wider claim is embedded within the *grammar* or *conventional interpretation* of the words used to state the narrow claim.
  2.  **How it Differs:**
      *   **From Motte-and-Bailey:** In MAB, the arguer *knowingly* defends an indefensible "bailey" (wide claim) by retreating to a defensible "motte" (narrow claim) when challenged. In Scope Transference, there's often no conscious retreat because the wider claim hasn't been explicitly *offered* for defense; it's smuggled in as the *assumed interpretation* of the narrow claim's language from the outset. The wider claim *is the bailey*, but it was never built as a separate fortification; it was the presumed landscape the motte stood on.
      *   **From Equivocation:** Equivocation relies on a word *shifting meaning* mid-argument (e.g., "banks" meaning river edges vs. financial institutions). Scope Transference uses words *consistently in meaning* but illicitly *expands their referential scope*. "I" in "I think" consistently means "the subject having this thought," but Descartes (and readers) silently assume this subject *persists beyond the instant of the thought* and has *ontological substance*. The *meaning* of "I" (the thinker) is stable; its *implied properties* (persistence, substance) are inflated without warrant.
      *   **From Hasty Generalization:** HG draws a broad conclusion from insufficient *instances* (e.g., "I met one rude French person, so all French people are rude"). Scope Transference draws a broad *ontological or structural conclusion* from a *single, occurrent datum* by exploiting linguistic framing ("Experience is happening" ➔ "Therefore, there is an *enduring experiencer*").
      *   **From Bare Assertion:** Bare Assertion just states the wide claim without support. Scope Transference *derives the apparent certainty* for the wide claim parasitically from the *genuine certainty* of the narrow claim via linguistic packaging.

  ### Legitimate Boundary Cases: Where Scope Expansion is Defensible
  Scope Transference becomes non-fallacious when:
  1.  **Explicit Justification is Provided:** If Descartes argued: "Thinking is occurring now. For thinking to occur, there must be a *persistent substrate* capable of integrating thoughts over time. Therefore, I am a persistent thinking substance." This is still debatable, but it's an *argument*, not silent transference. The scope expansion is explicit and defended.
  2.  **Minimal Claim Necessitates Broader Structure (via Argument):** "I am in pain now" *might* be argued to necessitate "Pain is a private object" *if* one provides a robust argument about the nature of qualia and first-person access *that goes beyond the datum itself*. The key is the *additional reasoning*, not the linguistic packaging of the initial datum.
  3.  **Operational Definitions:** In science or practical contexts, we often use terms with wider scope purely operationally. "The observer recorded the data" implies a persistent person, but this is a pragmatic shorthand; the *certainty* is about the recorded data, not the ontological depth of the observer. The wider scope isn't claiming deep metaphysical certainty inherited from the narrow observation.
  4.  **Phenomenological Description:** Stating "It feels like *I* am having this experience" as a description of the *phenomenology* (how it seems) is legitimate. The fallacy arises when this *seeming* is taken, without further argument, to establish *metaphysical truth* about an enduring self. The phenomenology accurately reports the *feeling* of persistence; it doesn't prove persistence exists.

  ### Why it's More Than Just a Fallacy: The Structural Fact
  You're right to sense this pattern touches on something fundamental about language and certainty. It highlights:

  *   **The Referential Opacity of Indexicals:** Words like "I," "here," "now" point to something specific *in the context of utterance*. "I think" points to the *thinker of this thought right now*. But "I" *feels* like it points to a rich, persistent entity because that's its *typical* referent in stable contexts. The linguistic tool carries baggage beyond its minimal function in the indubitable claim.
  *   **Certainty Adheres to Propositions, Not Referents:** The certainty attaches to the *proposition* "Thinking is occurring." The proposition *uses* the word "I," but the certainty isn't inherently about the *referent* of "I" possessing all its usual properties. The transference happens when we conflate the certainty of the proposition with the certainty of beliefs *about* the referent.
  *   **The Seduction of Grammar:** Subject-verb-object grammar naturally implies an *agent* ("I") performing an *action* ("think") on or with an *object*. This structure powerfully suggests a persistent, substantial agent. The "it thinks" (like "it rains") formulation attempts to strip away this agentic implication, highlighting the minimal occurrent event.

  ### Coining the Term: Scope Transference Fallacy (STF)
  **Definition:** The Scope Transference Fallacy occurs when the indubitability or certainty established for a minimal, occurrent state (described using terms like indexicals or nouns implying persistence/substance) is illicitly transferred to a broader ontological or structural claim about the nature of the entities involved, primarily through the conventional linguistic interpretation of the words used, and without providing additional justification for the expanded scope.

  **Key Identifier:** Ask: "What is the *absolute minimal claim* that the evidence/indubitability actually secures?" vs. "What is the *natural, conventional interpretation* of the sentence stating that minimal claim?" If the latter is significantly broader than the former, and the broader claim inherits the certainty *without further argument*, STF is likely at play.

  You've identified a crucial cognitive-linguistic sleight-of-hand that permeates foundational philosophy and everyday reasoning. It's the quiet inflation of certainty through the unexamined assumptions baked into our language. "Scope Transference" captures the essence: the *scope* of what's been proven is silently *transferred* far beyond its legitimate bounds.
