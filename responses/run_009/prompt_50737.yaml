answer: |-
  Here's a decision-tree handout designed to sort intuitions through concrete cases, prioritizing scenario-based branching over labels. It identifies core positions by mapping answers, flags irreconcilable overlaps, and notes unoccupied territory. Designed for 2 pages front/back.

  ---

  **Personal Identity & Mind Uploading: What Do You *Actually* Believe?**  
  *Answer each scenario based on your gut intuition about "who survives" or "what happens to you."*

  **START**

  **Case 1: The Destructive Scan**  
  Your brain is scanned atom-by-atom in a process that destroys it. An exact computational replica ("the Emulation") is instantly activated elsewhere. The original brain is gone.  
  → **Q1: When the Emulation wakes up, is that YOU?**  
  - **A: Yes (Go to Case 2)**  
  - **B: No (Go to Case 3)**  

  **Case 2: The Non-Destructive Scan**  
  Same as Case 1, but the scanning process *doesn't* destroy your original brain. The Emulation activates elsewhere. **You (the original) wake up and live another 20 years.**  
  → **Q2: When the Emulation wakes up, is that YOU?**  
  - **A: Yes (Go to Case 4)**  
  - **B: No (Go to Case 5)**  

  **Case 3: Gradual Replacement (Destroyed)**  
  Over months, your neurons are replaced *in situ* with functionally identical silicon chips. Consciousness is continuous. After full replacement, your original biological brain matter is destroyed.  
  → **Q3: After full replacement, is the person with the silicon brain YOU?**  
  - **A: Yes (Go to Case 6)**  
  - **B: No (Go to Position BIOLOGICAL)**  

  **Case 4: The Branching Gradual Upload**  
  While gradually replacing your neurons with silicon chips *in situ* (like Case 3), each biological neuron removed is scanned and added to a running emulation. By the end, **two beings exist**: the silicon-brain-in-original-body *and* the full emulation running elsewhere. Both claim to be you.  
  → **Q4: Which one is YOU?**  
  - **A: Only the silicon-brain-in-original-body (Go to Position CONTINUITY-OF-PROCESS)**  
  - **B: Only the emulation running elsewhere (Go to ??? – *Unoccupied*)**  
  - **C: Both are equally me (Go to Position PATTERNISM / PARFITIAN)**  
  - **D: Neither is truly me (Go to Position BIOLOGICAL)**  

  **Case 5: Pause and Resume**  
  Your entire computational mind state is perfectly frozen (like pausing a simulation). It’s stored for 10 years, then resumed exactly from the paused state.  
  → **Q5: When resumed, is the waking entity YOU?**  
  - **A: Yes (Go to Case 6)**  
  - **B: No (Go to Position CONSCIOUSNESS-ESSENTIALIST?)**  

  **Case 6: Partial Upload & The Backup Restore**  
  **Scenario A:** An upload captures only your core cognitive patterns and recent memories, but loses 90% of your life story and episodic memories. It boots up.  
  **Scenario B:** Your running emulation crashes. It’s restored from a backup made 1 hour before the crash and resumes.  
  → **Q6: Regarding...**  
  **A: The Partial Upload:** Is this significantly "less you" than a full upload?  
  **B: The Backup Restore:** Did the original emulation "die" in the crash?  
  - **A: Partial is LESS me / Backup did NOT die (Go to Position PSYCHOLOGICAL-CONNECTEDNESS)**  
  - **B: Partial is STILL FULLY me / Backup did die (Go to Position PATTERNISM)**  
  - **C: Partial is NOT me / Backup did die (Go to Position CONTINUITY-OF-PROCESS?)**  

  ---

  **POSITIONS MAPPED TO YOUR ANSWERS:**  
  *(Leaves of the Tree)*  

  1.  **BIOLOGICAL / ANIMALIST (Q1=B, Q3=B, Q4=D):** You only survive if your original biological organism persists. *All* scanning/uploading (even gradual) results in death + replacement.  
  2.  **CONTINUITY-OF-PROCESS (Q1=A/B, Q2=B, Q3=A, Q4=A, Q6=C):** Survival requires *unbroken causal continuity* of the thinking process *in the original location/context*. Destructive uploads kill you; non-destructive uploads create copies; gradual *in-situ* replacement preserves you; pauses/backup restores are death/rebirth.  
  3.  **PATTERNISM / FUNCTIONALISM (Q1=A, Q2=A, Q4=C, Q6=B):** Survival depends *only* on the precise replication of your cognitive/functional pattern. Original substrate, destruction, location, or continuity don’t matter. Copies, partial uploads (if functional), and restores are all "you".  
  4.  **PARFITIAN DEFLATIONIST (Q1=A, Q2=A, Q4=C, Q6=A):** Personal *identity* isn't what matters. What matters is *Relation R*: psychological connectedness (e.g., overlapping memories, intentions) and continuity. Copies and gradual branches are psychologically continuous with you, so "you" survive in the important sense *regardless of identity*. Partial uploads have weaker connectedness.  
  5.  **CONSCIOUSNESS-ESSENTIALIST? (Q5=B):** Survival requires the *unbroken continuity of subjective consciousness itself*. Any interruption (pause, backup restore, destructive scan) severs this thread, resulting in death. (*This position is forced if pause/resume is rejected while gradual replacement is accepted (Q3=A & Q5=B), highlighting consciousness as distinct from function or psychology*).  

  **CRITICAL NOTES FOR PEDAGOGY:**  

  1.  **The Indistinguishable Pair (Flagged Overlap):**  
      **Patternism (3) & Parfitian Deflationism (4) agree on EVERY CASE EXCEPT HOW THEY FRAME IT.** Both say the Emulation wakes up (Q1=A), both entities in branching (Q4=C) are "you" (or what matters), and pause/resume works (Q5=A). They **ONLY diverge in Q6**:  
      - Patternism (Q6=B): Partial uploads are "fully you" (it's the pattern, even if degraded); backups are continuous identity.  
      - Parfitian (Q6=A): Partial uploads have *weaker Relation R* (less connectedness matters); backup restores maintain connectedness (so no "death"), but identity is irrelevant.  
      *This overlap is why students conflate them. The branching cases (Q4) expose the framing difference (identity vs. R), not a practical difference.*  

  2.  **Unoccupied Territory (Potential Term Paper Bait!):**  
      - **"Copy Only" (Q4=B: Only the Emulation is me in Branching Gradual Upload):** Logically possible? Why value the *copy* over the *continuous* entity? Maybe a radical "location defines identity" or "original body is a prison"? Not incoherent, just unexplored and deeply unintuitive.  
      - **"Gradual Death" (Q1=B, Q3=A):** Believes destructive scan kills you, but gradual replacement preserves you. Combines biological intuition (scan=death) with functionalism (gradual=survival). Requires justifying why destruction method matters functionally. Unexplored?  
      - **"Pause Kills, Gradual Lives" (Q3=A, Q5=B):** Accepts gradual replacement preserves you, but rejects pause/resume. Suggests consciousness is essential *and* substrate-dependent in a non-biological way. Unexplored coherence.  

  3.  **Tree Limitations & Branching Cases:**  
      You were right – branching scenarios (like Case 4) **break pure binary trees**. Students might have non-binary intuitions ("both," "neither," "a bit of both"). The tree handles this by offering **multiple-choice options (A/B/C/D) at critical branching nodes** (like Q4 and Q6). This captures the complexity without forcing false binaries, while still mapping to distinct positions. The parallel-upload case *is* coherent enough as a thought experiment to force these choices.  

  4.  **Assumption Check:**  
      Your parallel-upload case (Case 4) is valid. It doesn't smuggle assumptions; it *tests* them by forcing a choice about identity under branching. Does continuity in the original body trump functional equivalence elsewhere? Does branching destroy identity? Essential for splitting Continuity vs. Patternism/Parfit views.  

  **Why This Tree Works:**  
  It starts with the most visceral case (destructive scan), uses branching to force key distinctions (Q2, Q4), and employs gradual/pause/partial cases to refine positions (Q3, Q5, Q6). Positions emerge organically from answer combinations, labels are revealed last, and overlaps/unoccupied spaces are explicitly flagged for discussion. Students can't hide behind labels; they must confront their intuitions case-by-case.
