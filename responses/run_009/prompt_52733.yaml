  The user also questions if consideration's requirement of observable exchange is missing in acausal trade. Since neither party observes the other's performance, contract law's structure doesn't fit. But in acausal trade, the exchange is still a reciprocal benefit, even if unobserved.

  Another angle is the statute of frauds. Acausal trade has no written record, but the agents' algorithms serve as immutable proof. However, courts can't access that, so the statute of frauds becomes irrelevant in a world of transparent source codes.

