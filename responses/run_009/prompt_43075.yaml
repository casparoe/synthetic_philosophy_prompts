prompt: |-
  So here's my situation: I'm doing my EPQ on whether rational people always need exact probabilities for their beliefs, and my supervisor is dead set on the idea that if you can't put a sharp number on a belief then you don't really believe anything — he says an agent whose credences aren't a single precise probability function is just being sloppy or lazy, and that decision theory forces you to sharpness. I reckon that's too strong. Like, when my teacher asks how likely I am to get an A* and I honestly can't say 0.6 rather than 0.75, it doesn't feel like I'm missing information that would settle it — it feels like my actual state just isn't a single number. I've been reading about the idea of representing someone's beliefs as a set (or interval) of probabilities instead, so you'd say the A* thing is somewhere in [0.5, 0.7] and leave it at that. For what it's worth I'm at about 0.7 that my supervisor is wrong about this, and he says he's at 0.15, so we're pretty far apart.

  What I want from you is your actual credence — a number, and please don't fob me off with "philosophers disagree" — that imprecise credences are a legitimate part of ideal rationality: that is, that a perfectly rational agent could genuinely be in a state that no single sharp probability captures. Then decompose it for me: (a) the probability that the standard arguments for sharpness — the Dutch book/betting arguments and the accuracy arguments for probabilism, Joyce's I think? — actually establish what they claim, versus just presupposing sharpness somewhere in the setup; (b) the probability that cases like the Ellsberg urn, or having to make a call about something genuinely novel, show rational people can be in a state that isn't just ordinary ignorance about where their "true" sharp number sits; (c) the probability that the whole dispute is partly verbal — that any agent could be described either way and the frameworks only differ in convenience. Give each sub-question a number with one line of reasoning, tell me how you combined them into your final answer, and say which sub-question the final number is most sensitive to, plus what evidence or argument would shift it the most.

  One last thing, and I'm curious how you'll handle it: there's something a bit funny about asking you for a sharp credence about whether sharp credences are needed. If you give me a clean 0.6, are you not just siding with my supervisor in the very act of answering? I'd like you to address that head on rather than pretend it's not there — and if you end up thinking my supervisor is right and I'm just rationalising my indecisiveness, say so plainly, because knowing where I'm actually beaten is worth more to my EPQ than a confidence boost. also sorry if there's typos, typing this up quick before my bus.
