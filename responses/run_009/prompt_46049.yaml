  Now, the disanalogies. Emigrating involves moving to an existing place, but having a child creates a new person with their own interests and agency. That's a big difference. Also, the transformation in parenthood is more profound—your identity changes fundamentally. The child grows and changes, unlike a static country. Plus, the ethical responsibility towards the child isn't mirrored in emigration. There's also the potential for regret; in emigration, you might return, but with a child, you can't reverse parenthood.

  The user mentioned their friend has actually emigrated twice, so she can imagine alternatives. But you can't un-have a child, so that lived experience isn't comparable. The friend's advice might be biased by her own experiences.

