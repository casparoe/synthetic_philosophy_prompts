  I need to address whether the later cognition's validation via action introduces parataḥ. Nyāya would argue that the action isn't a separate cognitive validation but a natural outcome. Yet, the skeptic can still ask for justification of that successful action's reliability. However, Nyāya might say that at some point, justification must end in practice. The verdict could be that Nyāya offers a dissolution by changing the framework to a practice-based one, which is defensible but not a theoretical knockout.

  Also, the user might be conflating different schools. The svataḥ theory is more Mīmāṃsā, but Nyāya adapted it. I should note that briefly but focus on Nyāya's version as presented. The essay should argue that Nyāya's solution is genuine within its pragmatic framework, though it doesn't satisfy a radical skeptic. Comparing to reliabilism shows similarity in externalism, but Nyāya's emphasis on action adds a pragmatic layer. The problem of the criterion highlights that Nyāya starts with instances, avoiding circularity by trusting cognition until defeated.

  Final verdict: Nyāya dissolves the regress practically by integrating epistemology with action, making it a viable solution for lived experience, even if not theoretically absolute.
answer: |-
  Your framing captures the core tension beautifully, and you haven't botched the essentials – your understanding of the Nyāya position (particularly its later, post-Udayana refinement under pressure from Buddhism and Mīmāṃsā) and the skeptical challenge is sound. Where slight nuance exists, it's less about your error and more about interpretive debates *within* Nyāya itself regarding how strictly "svataḥ" is applied and the exact role of subsequent experience. Your central question – whether Nyāya genuinely dissolves the regress or merely refuses to play the skeptic's game – cuts to the heart of the matter. Let's weigh it, drawing blood with a comparison to reliabilism.

  **The Nyāya Gambit: Default Trust and Defeasibility**

  Nyāya's response to the infinite regress objection (anvaya-vyatireki) is indeed a sophisticated move towards externalism and defeasibility. Their core claim is that the *prima facie* validity (*prāmāṇya*) of a cognition arises intrinsically (*svataḥ*) with the cognition itself. When you perceive the coiled object in semi-darkness, the cognition "This is a snake" presents itself *as true*. Its validity doesn't require a separate, subsequent act of validation to *begin*. Crucially, they argue, doubt (*saṃśaya*) is never spontaneous or groundless. It requires a specific positive reason (*saṃśayādhikaraṇa*), like the poor lighting, the similarity between ropes and snakes, or a conflicting testimony. Without such a specific defeater, the cognition stands as knowledge (*pramā*).

  The resolution of doubt, establishing falsity (*aprāmāṇya*), *is* extrinsic (*parataḥ*). The later cognition "This is a rope," under better light, invalidates the prior snake-cognition. This new rope-cognition also possesses intrinsic validity *in that moment*. Its truth is not inferred from its success; it is immediately given. However, Nyāya doesn't leave it floating entirely. They point to *arthakriyākāritva* – the cognition's capacity to lead to successful action – as a *confirmation* or *manifestation* of its validity. Picking up the "rope" and using it successfully reinforces the truth of the rope-cognition. But crucially, Nyāya insists this successful action isn't what *grants* validity (*prāmāṇya*) in the first place; validity is intrinsic. Success is the *fruit* (*phala*) or evidence *of* that pre-existing validity. The later cognition resolves the earlier doubt precisely because *it itself* is taken as intrinsically valid in the new context.

  **The Skeptic's Recoil: Regress Reloaded?**

  The skeptic's pushback you articulate is potent: "What certifies the *second* cognition?" If Nyāya answers "its own intrinsic validity," then haven't we merely *assumed* the validity of the later cognition to stop the regress concerning the earlier one? It seems the regress is halted not by a logical necessity but by a pragmatic fiat: "We trust cognitions *until* a specific defeater arises." Further, if you point to the successful action with the rope (tying it, pulling it) as confirming the rope-cognition, haven't you smuggled in an external criterion (*parataḥ*)? Doesn't the validity of the action-confirmation *itself* need grounding? This looks suspiciously like the regress has been shifted, not solved.

  **Weighing Nyāya's Solution: Dissolution or Evasion?**

  Here's the crux: Nyāya isn't offering a *theoretical* guarantee against radical skepticism. They are offering a *pragmatic* and *psychological* account of how knowledge *actually functions* in the world, designed to avoid the paralysis of infinite doubt. Their solution hinges on several interlocking moves:

  1.  **Rejecting Universal Doubt:** Nyāya argues radical, groundless doubt is psychologically impossible and epistemologically incoherent. To even formulate the skeptical challenge ("How do you know the second cognition?"), the skeptic must rely on *some* cognitions being trustworthy (e.g., the meaning of words, the structure of the argument). Doubt requires a foothold in something undoubted, however minimal.
  2.  **Defeasibility as the Key:** The regress isn't infinite because validity is the default state. The burden of proof lies *only* on the doubter to provide a specific defeater. When a defeater *is* present (like bad light), it triggers the need for resolution. The resolving cognition (the rope-perception) *also* starts with intrinsic validity. Its ability to *explain* the earlier error (why it looked snake-like) and lead to successful action *reinforces* our trust in it, but doesn't *create* its validity *ex nihilo*.
  3.  **The Role of Action (Arthakriyā):** Nyāya's appeal to successful action isn't primarily a *justification* smuggled in *parataḥ*. It's presented as the natural *telos* and *confirmation* of perceptual knowledge. Our fundamental trust in perception stems from its consistent, life-sustaining coordination with the world. The skeptic demanding justification for *every* successful action independently would render all action and inquiry impossible. Nyāya argues this practical coherence *is* the evidence for the general reliability of cognition, even if it doesn't certify each instance with Cartesian certainty.

  **The Modern Bite: Reliabilism as a Mirror**

  The natural analogue is **Reliabilism** (e.g., Goldman, Sosa). Both Nyāya and Reliabilism:

  *   **Avoid Internalist Regress:** They reject the idea that every belief needs a prior, consciously accessible justification. Justification arises from the *source* of the belief (reliable process for Reliabilism; intrinsically valid, properly functioning cognition for Nyāya), not an infinite chain of reasons.
  *   **Embrace Externalism:** The factor making a belief justified/knowledge (reliability/intrinsic validity) is not necessarily internally accessible to the believer.
  *   **Default to Trust:** Both assume a baseline reliability of our cognitive faculties until proven otherwise in specific instances.
  *   **Focus on Function:** Knowledge is tied to successful interaction with the world (true belief causing successful action for Reliabilists; *arthakriyākāritva* for Nyāya).

  **The Verdict: A Genuine (Though Pragmatic) Dissolution**

  Nyāya's position is **a genuine dissolution of the *threatening* infinite regress**, not merely a refusal to play. Here's why, accepting its pragmatic bent:

  1.  **It Exposes the Skeptic's Hidden Premise:** The skeptic's demand for universal extrinsic validation *presupposes* the impossibility of intrinsic validity. Nyāya successfully argues this presupposition is false and psychologically unsustainable. Doubt *requires* an island of undoubted cognition to stand upon. Their account of defeasible, intrinsically valid cognitions explains how we navigate the world *without* needing infinite validation chains.
  2.  **It Shifts the Burden Correctly:** By showing doubt requires specific, positive grounds, Nyāya places the burden of proof where it belongs: on the challenger, not on every cognition automatically. This mirrors healthy epistemic practice in science and daily life.
  3.  **Arthakriyā is Integral, Not Smuggled:** While the skeptic sees *arthakriyā* as introducing *parataḥ*, Nyāya sees it as the inseparable *manifestation* of intrinsic validity within the causal web of the world. The rope-cognition's intrinsic validity *explains* why actions based on it succeed. The success doesn't *bestow* validity; it *exemplifies* it. Demanding validation for the validating action itself is to misunderstand the holistic, embedded nature of knowledge. It's like demanding proof that your eyes are working *while* you are successfully reading this text using them. The regress stops because the system demonstrates its coherence *in practice*.
  4.  **Reliabilism's Resonance Validates the Structure:** The success of externalist responses like Reliabilism in modern epistemology underscores the power of Nyāya's core insight: grounding knowledge in the reliable functioning of our faculties, rather than infinite internal justification, is a viable and necessary strategy to escape the regress trap.

  **The Caveat: Not a Knockdown for Radical Skepticism**

  Is Nyāya's solution *absolutely* logically watertight against a radical skeptic who doubts *everything*, including the coherence of action and the reliability of *all* future cognitions? **No.** No epistemic system can achieve that. The radical skeptic can always ask, "But what if *all* cognitions, even those resolving doubt and enabling 'successful' action, are systematically flawed?" Nyāya, like Reliabilism, ultimately rests on a fundamental trust in the general reliability of our cognitive engagement with the world, demonstrated by its practical efficacy over time. They dissolve the regress *as a practical problem for agents embedded in the world* by showing how knowledge *emerges and corrects itself* through intrinsically valid cognitions operating defeasibly within a framework of action. They demonstrate that the skeptic's imagined regress *doesn't actually arise* in the dynamic process of knowing, precisely because cognition presents itself as valid until defeated.

  Therefore, while Nyāya doesn't provide a theoretical *coup de grâce* against the most extreme, disembodied skepticism (and arguably, such a feat is impossible), they offer a robust, coherent, and pragmatically successful **dissolution** of the regress problem as it manifests in the actual pursuit of knowledge. It is far more than an elegant refusal; it is a sophisticated account of epistemic practice that shifts the terrain decisively away from the skeptic's paralyzing demand. Their integration of intrinsic validity, defeasibility, and practical efficacy remains a powerful and enduring contribution to epistemology, finding strong echoes in modern externalist thought. The regress is stopped not by fiat, but by recognizing the self-correcting, action-oriented nature of cognition itself.
