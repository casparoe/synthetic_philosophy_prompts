  Okay, let me start by unpacking the user's request. They're in a seminar on rational choice theory, specifically Parfit's hitchhiker scenario, and their class is divided on whether paying at the ATM is rational or if it's rational to be the type of person who would pay. The user wants a clear list of desiderata that any theory of rational action must satisfy in these time-dependent scenarios, without pushing a specific solution. 

  First, I need to identify all the key elements from their query. They mentioned several variants of the hitchhiker problem: the basic case, the one where the driver is watching at the ATM, the wallet-left-with-friend scenario, and the 80% predictor accuracy. Plus, they want distinctions like act vs. disposition rationality, ex ante vs. ex post value, and constraints like dominance and exploitability. The user also hints that some desiderata might conflict, like dominance and profiting from predictability.

  I should start by listing each desideratum with the case that motivates it and note if it's non-negotiable. For example, avoiding dominated acts is crucial in standard cases but might conflict in prediction scenarios. The sunk cost fallacy avoidance is another key point—paying should be irrational when no future benefit exists, but in the hitchhiker, it's tied to past benefits. 

  The user’s deeper need is understanding the framework behind the debate, not just answers. They might feel stuck between the two seminar camps and want tools to evaluate theories impartially. Also, they need clarity on possible conflicts between desiderata, as their tutor hinted some are incompatible. 

  Next, I'll structure the desiderata into categories: must-get-right cases, key distinctions, and consistency constraints. For each, I’ll note negotiability. For instance, "prediction responsiveness" (being able to benefit from being predictable) is essential in the hitchhiker but might clash with dominance in the basic ATM moment. 

  Then, checking conflicts: dominance vs. prediction responsiveness is a big one. If you avoid dominated acts at the ATM (not paying), you lose the ride, but if you pay, you’re doing a dominated act. Theories like CDT, EDT, and resolute choice handle this differently. The user wants this analysis brief, so I’ll summarize each against the list. 

  Also, I should flag which demands are shibboleths. For example, "rationality must always be forward-looking" is a camp stance; sometimes, past commitments matter. Or "only acts matter" ignores dispositional value. Pointing these out helps the user see biases in their seminar. 

  Finally, highlighting that some desiderata can’t all be satisfied together explains the debate’s intensity. The user’s tutor is likely emphasizing that the conflict reveals deeper issues in decision theory. This aligns with the user’s request for the "spec" rather than verdicts.
answer: |-
  Here's the specification you need – the core desiderata for evaluating theories of rational agency in time/prediction cases like Parfit's Hitchhiker, stripped of verdicts and focused on the demands the theory must meet.

  **I. Cases the Theory Must Get Right (or Adequately Handle):**

  1.  **Basic Hitchhiker:** (Stranded, prediction-based ride, payment after, causally ineffective). *Demand:* Explain why paying *seems* irrational at the ATM *yet* being disposed to pay gets you the ride. *Non-negotiable:* Any theory must grapple with this core paradox; ignoring it is failure.
  2.  **ATM Watcher Variant:** (Driver watches you at ATM). *Demand:* Explain why paying *at the ATM* is now rational (it directly causes reputation/trust for future interactions, even if not for *this* ride). *Non-negotiable:* Must accommodate how observable choices can have *causal consequences* that "pure" sunk cost choices lack.
  3.  **Wallet Left with Friend Variant:** (You *could* have precommitted by leaving wallet, but didn't). *Demand:* Explain why failing to precommit (leaving wallet) was irrational ex-ante, *even though* paying at the ATM ex-post is irrational. *Crucial Distinction:* Highlights difference between ex-ante rationality of planning/type and ex-post rationality of act.
  4.  **80% Predictor:** (Imperfect prediction). *Demand:* Show how the rational disposition/plan changes with prediction accuracy. Should yield paying disposition only when accuracy is sufficiently high relative to cost/benefit. *Non-negotiable:* Must show sensitivity to probability/uncertainty, not just a binary "perfect predictor" case.
  5.  **Plain Sunk Cost:** (E.g., continuing investing in failing project solely because you've already spent money). *Demand:* Clearly condemn this as irrational. *Non-negotiable:* Must uphold the core principle that only future consequences (causal or evidential) should determine choice, *unless* other desiderata (like exploiting predictability) override in specific prediction cases. This is the baseline.

  **II. Distinctions the Theory Must Maintain (or Explain Why Collapsing is Necessary):**

  6.  **Act vs. Disposition vs. Agent Rationality:** *Demand:* Clearly differentiate the rationality of a specific action at a node (ex-post), the rationality of having a general disposition/plan/type (ex-ante), and the overall rationality of the agent. *Crucial Distinction:* The core tension. Must not simply conflate "rational to pay" with "rational to be disposed to pay". Collapsing them ignores the problem.
  7.  **Ex-Ante Value vs. Ex-Post Value:** *Demand:* Acknowledge that what maximizes expected utility *before* the prediction/ride (ex-ante) may differ from what maximizes utility *at* the payment node (ex-post). *Non-negotiable:* Essential for explaining the Hitchhiker conflict. Theories must account for this temporal perspective shift.
  8.  **One-Shot vs. Repeated Interaction:** *Demand:* Explain why the rational choice differs if the interaction is repeated (building reputation) vs. truly one-shot. *Crucial Distinction:* Highlights whether exploiting predictability requires repeated play or can work once via dispositions/precommitment.

  **III. Consistency Constraints with Ordinary Decision Theory:**

  9.  **Avoid Dominated Acts (Conditional):** *Demand:* Never choose an act that yields a worse outcome *than another available act* **given your current information and beliefs** at the choice node, *unless* required to satisfy other core desiderata (like 10). *Non-negotiable (with caveat):* A bedrock principle. Violating it needs *strong* justification specific to prediction scenarios. Paying in Basic Hitchhiker *is* dominated at the ATM.
  10. **Exploit Predictability (Agency Value):** *Demand:* Rational agents should generally be able to benefit from being predictable (e.g., make binding promises, build trust, deter threats). *Non-negotiable:* A core function of rationality. Failing this makes agents exploitable "cash pumps". Hitchhiker ride is the benefit.
  11. **Belief-Choice Alignment:** *Demand:* An agent's choice at a node should generally align with their current beliefs about what choice *they themselves* would make at that node (roughly, satisfy the "Savages' Sure-Thing Principle" or avoid self-delusion). *Important:* Prevents bizarre self-undermining beliefs. ("I believe I'm irrational at this node, so I'll act irrationally" is unstable).
  12. **Precommitment Power (Limited):** *Demand:* The theory must value/explain the rationality of *available* precommitment mechanisms (leaving wallet, Ulysses contracts) where feasible. *Constraint:* But must *not* assume precommitment is always available or costless (Wallet Left variant). Theories relying solely on unavailable precommitment fail.

  **IV. Potential Conflicts & Shibboleths:**

  *   **The Core Conflict:** Desiderata **9 (Avoid Dominated Acts)** and **10 (Exploit Predictability)** are fundamentally at odds in the Basic Hitchhiker *at the ATM node*. Paying is dominated (violates 9) but *not* paying prevents exploiting predictability (violates 10). **This is the heart of the problem.** No theory satisfying both in all cases seems possible without precommitment (**12**). *Your tutor is right: the tension is the lesson.*
  *   **Shibboleths (Camp-Specific Dogmas, Not Universal Desiderata):**
      *   **"Rationality Must *Only* Be Forward-Looking (Causal)":** Often used to dismiss paying. *Why shibboleth?* Ignores the *ex-ante value of dispositions* (**6, 7**) and the need to **10 (Exploit Predictability)** via traits that cause past benefits. Backward induction alone kills the ride.
      *   **"Only Acts Matter, Dispositions are Epiphenomenal":** Used to dismiss disposition talk. *Why shibboleth?* Ignores how dispositions **cause** predictors to act (**1, 10**) and the ex-ante value of cultivating them (**7**). Treats agents as isolated nodes, not temporally extended entities.
      *   **"Rationality Demands Regret Minimization":** Sometimes invoked for paying. *Why shibboleth?* Regret is an emotion, not a fundamental principle. A rational agent might correctly perform an ex-post irrational act (**6**) due to a rational ex-ante disposition and feel no regret, or feel regret but know acting otherwise now is worse.

  **Brief Theory Rundowns Against the List:**

  1.  **Causal Decision Theory (CDT - e.g., Lewis):** Chooses based on *causal* consequences of acts at the node.
      *   *Basic Hitchhiker:* Pays? **No.** (No causal benefit, dominated act - satisfies **9**, fails **10**).
      *   *ATM Watcher:* Pays? **Yes.** (Causes future trust - satisfies **9, 10, 2**).
      *   *Precommitment:* Values it if available (**12**). *Problem:* Fails core **1, 10** without precommitment. Can't exploit perfect prediction in one-shot Basic case. Collapses **6** (only act matters?).
  2.  **Evidential Decision Theory (EDT - e.g., Jeffrey):** Chooses based on *evidence* the act provides about desired states.
      *   *Basic Hitchhiker:* Pays? **Yes.** (Paying is evidence you're the type who got the ride - satisfies **10**, fails **9**).
      *   *Plain Sunk Cost:* Might irrationally continue? **Possibly.** (Continuing is evidence the project isn't doomed yet? - risks failing **5**).
      *   *Problem:* Can endorse "irrational" acts due to spurious correlation. Violates **9** consistently. Struggles with **11** (Newcomb's Problem).
  3.  **Resolute Choice (e.g., McClennen):** Sticks with the best *ex-ante* plan at later nodes, even if deviation looks better locally.
      *   *Basic Hitchhiker:* Pays? **Yes.** (Sticks with ex-ante rational plan to be disposed to pay - satisfies **1, 6, 7, 10**, violates **9**).
      *   *Problem:* Requires strong willpower/commitment mechanism (**12**). Why *can't* you rationally reconsider at the node? Violates **9** explicitly. Defining the "plan" precisely is hard.

  **The Takeaway:** The desiderata list reveals the genuine tensions. No theory cleanly satisfies all, especially the core conflict (**9 vs. 10**). Evaluating theories means seeing *which* desiderata they prioritize, *which* conflicts they resolve (and how), *which* cases they handle well, and at *what cost* (e.g., violating dominance, requiring unrealistic commitment, risking spurious correlations). The debate thrives because different camps weight these fundamental demands differently. Your job is to map the theories onto this landscape, not just choose a side. Good luck back in the shouting match!
