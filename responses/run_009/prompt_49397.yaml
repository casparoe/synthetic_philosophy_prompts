prompt: |-
  I'm a software engineer at a company that designs proteins computationally — mostly enzymes for industrial chemistry and single-chain biosensors. I own the sections of our internal specs, test plans, and first drafts for the patent attorneys where we state what a part of a protein is for: lines like "the function of the Ω-loop is to position the catalytic serine" or "the binding domain's function is fluoride capture." These claims come up a dozen times a week across the team; I spend maybe twenty minutes on each one, there is no philosopher on staff, and while the attorneys will rewrite whatever they like, the internal record I produce is what they work from.

  We have a standing fight about these lines. One faction holds that function talk is loose metaphor whenever the protein never existed in nature: nothing in a first-of-its-kind design has a function the way a heart or a tail does, because there is no history behind it, so at best we are describing design goals. The other faction holds that anything that makes a contribution has a function: if the hydrophobic core stabilizes the fold, then stabilizing the fold is its function, full stop. A biology consultant we hired for a single week tried to referee this by distinguishing two accounts she had learned. On the first, the function of a part is whatever past copying-with-variation selected it for doing — natural selection, but also breeding, or any iterative process that kept the variants that did something and discarded the rest — so a function claim needs a history in which items of this type were reproduced because they did that thing. On the second, the function of a part is its contribution to some capacity of the containing system, picked out when you analyze the system into parts and show what each contributes — so a function claim needs a specified capacity and a demonstrated contribution, and nothing about history. She added two warnings I only half followed: that on the second account, everything contributing to any capacity you have chosen to analyze acquires a function, so the choice of which capacities matter does all the work and the account itself cannot tell you which those are — she said it becomes true, on that account, that one function of the heart is to make thumping noises; and that on the first account, a function claim about anything without the right kind of history is not false so much as category-confused, like asking what a rock is for.

  She left before telling us how to use the distinction, and I have come to suspect each faction is right about some of our proteins and wrong about others, because our proteins differ in exactly the way the two accounts care about. Some are pure computational designs, produced in one shot, no iterations. Some went through many rounds of directed evolution: we mutagenize, screen for the variants that work, and breed from those. And some are natural scaffolds onto which we grafted a novel active site, so the part has a long evolutionary history, just not for what we now use it to do.

  Please turn this into a decision procedure I can run whenever I am about to write or sign off on a function claim in a spec, test plan, or patent draft. I want the questions to ask about the claim, in order; what counts as a sufficient answer to each; where the procedure terminates in "rewrite this as a mechanism description without function language" versus "the function claim is licensed"; and where it hands the decision back to me or to the attorneys because what remains is a value judgment or a legal-usage question the philosophy cannot settle. Then run it on three claims from our current release: (1) "The function of the oxyanion hole is to stabilize the transition state," concerning a pocket that exists only in a computational design produced in a single pass, with no directed evolution; (2) "The function of the fluoride-binding domain is fluoride capture," concerning a domain we arrived at after fourteen rounds of mutagenesis and screening; and (3) "The function of the hydrophobic core is to stabilize the fold," concerning a core we assembled from a library packing motif chosen mostly because it was convenient, and which the lead designer has already built several patent claims around — so if the procedure strikes that line, it is returning an answer I will not enjoy delivering. Finally, state plainly what the procedure cannot do, and say whether it can reach any verdict at all for a repurposed natural scaffold: a part with an evolutionary history, just not for its current use.

  Lead with your bottom line in the first sentence, then give the reasoning; no preamble, and do not restate what I have asked for.
reasoning: |-
  Okay, the user is a software engineer at a company that designs proteins computationally, dealing with enzymes and biosensors. They're responsible for writing specs, test plans, and patent drafts that include function claims about protein parts. There's an internal debate: one group says function talk is metaphorical for novel designs without evolutionary history, while the other argues that anything contributing to a system has a function. A biology consultant introduced two philosophical accounts: one based on history (natural selection or iterative processes) and the other on systemic contribution. The user wants a decision procedure to handle these claims for different types of proteins—pure computational designs, directed evolution products, and repurposed natural scaffolds. They also want examples applied to three specific cases and clarity on limitations.

  First, I need to recall the two accounts of function: etiological (history-based) and systemic (contribution-based). The consultant mentioned that the systemic account can assign functions broadly (like the heart making noise) and the etiological account requires historical selection. The user's proteins vary: some have no history, some have directed evolution, some have natural history but repurposed. The decision procedure must distinguish these scenarios.

  The user wants a step-by-step process with clear questions. The procedure should determine when to use function language or switch to mechanism descriptions. Also, it needs to handle cases where philosophy can't decide, leaving it to legal or value judgments. The three examples are key: oxyanion hole (no history), fluoride-binding domain (directed evolution), hydrophobic core (convenience, no iteration).

  For the decision procedure, start by asking if the part has a history of selection for the claimed function. If yes, etiological function applies. If not, check if it's part of a design where the contribution is critical. But the systemic account might lead to over-assigning functions. The consultant warned about this. So, for novel designs without history, mechanism descriptions might be safer. Directed evolution with iterative selection would qualify for etiological function. Repurposed scaffolds have history but not for the current use, so etiological might not apply, but systemic could. However, the user needs to know if function claims are valid here.

  The examples: 
  1. Oxyanion hole in a one-shot design. No history, so no etiological function. Systemic might say yes, but the consultant's warning about over-assignment means it's risky. The procedure should recommend rewriting as mechanism.
  2. Fluoride-binding domain with 14 rounds of directed evolution. This has iterative selection, so etiological function applies. Function claim is licensed.
  3. Hydrophobic core chosen for convenience, no iteration. No history, so similar to case 1. But the lead designer has patent claims around it. The procedure must recommend rewriting, even if it's unpopular. The user mentioned not enjoying delivering that answer, but it's necessary.

  Repurposed natural scaffolds: history exists but not for current use. Etiological account assigns function based on past selection, not current use. So the original function (e.g., binding something else) is the etiological function. Claiming a new function wouldn't fit. Systemic would assign based on current contribution, but that might not hold up philosophically. The procedure should flag this as needing legal input since the history isn't for the claimed function.

  The procedure's limitations: It can't decide which systemic capacities matter—that's a value judgment. Also, legal definitions might override philosophical ones. For repurposed parts, it can note the discrepancy but can't resolve whether to use the original or new function legally.

  Structure the procedure as a flowchart: 
  - Question 1: Was there a history of selection for the claimed function? (Natural or artificial like directed evolution). If yes, function claim is licensed. 
  - If no, Question 2: Is the claim about a designed contribution critical to the system's intended purpose? If yes, systemic function possible but caution advised; rewrite to mechanism is safer unless legal accepts systemic. If no, definitely rewrite. 
  - For repurposed parts, after Question 1 (which would be no for current function), go to Question 2. But due to past history, it's messy. So the procedure might say rewrite or note conflict, defer to legal.

  Bottom line: Use a hybrid approach favoring etiological for directed evolution, systemic with caution, and rewrite otherwise. For the examples: 
  1. Rewrite (no history)
  2. Licensed (directed evolution history)
  3. Rewrite (no history, despite patent claims)

  Repurposed scaffold: Procedure can state no etiological function for new use, systemic possible but contested, so defer to legal/rewrite.
answer: |-
  ### Bottom line
  Use this decision procedure to determine when to employ function claims versus mechanism descriptions, prioritizing etiological (history-based) function where possible to avoid overassignment and category errors, with systemic (contribution-based) function as a fallback for pure designs when legally defensible.

  ### Decision Procedure for Protein Function Claims
  1. **Was the part produced or refined through an iterative process (natural selection, directed evolution, breeding) where variants were selected *specifically* for the claimed function?**  
     - *Sufficient answer*: Documented history of iterative selection based on performance (e.g., mutagenesis/screening logs proving retention of variants due to the claimed function).  
     - *Yes* → **Function claim is licensed** (etiological account applies). Stop.  
     - *No* → Proceed to Question 2.

  2. **Is the claimed function a direct, intended contribution to a *specified system capacity* (e.g., catalytic activity, binding, stability) in a novel design?**  
     - *Sufficient answer*: Experimental or computational evidence (e.g., MD simulations, mutagenesis data) showing the part’s necessity/sufficiency for the capacity.  
     - *Yes* → **Function claim is conditionally licensed** (systemic account applies), but rewrite as:  
       - "The [part] contributes to [capacity] by [mechanism]."  
       - *Exception*: If legal/patent strategy requires stronger language, flag for attorney review with a note: "Systemic function claim—no historical basis. Verify legal acceptability." Proceed to Question 3 only if contested.  
     - *No* → **Rewrite as mechanism description** (e.g., "The [part] [mechanism], enabling [capacity]"). Stop.  

  3. **For systemic claims: Does the claimed function risk overassignment (e.g., incidental effects like 'heart makes thumping noises')?**  
     - *Sufficient answer*: Attorney/stakeholder consensus on whether the contribution is essential to patentability or product claims.  
     - *Yes* → **Rewrite as mechanism description** to avoid philosophical/legal overreach.  
     - *No* → **Retain systemic function claim** with attorney approval.  

  ### Limitations of the Procedure  
  - **Cannot resolve**:  
    - Which systemic capacities "matter" (value-driven; e.g., stability vs. novelty).  
    - Legal definitions of "function" in patents (attorneys must decide).  
    - Ethical/normative judgments (e.g., "should" this part exist).  
  - **Repurposed natural scaffolds**: Assigns no *etiological* function for the *new* use (lacks selection history for it). Systemic claims are possible but contentious—procedure terminates at Question 2 with a rewrite recommendation or attorney handoff.  

  ---

  ### Application to Current Claims  
  **Claim 1: "The function of the oxyanion hole is to stabilize the transition state."**  
  - Pure computational design, no iterations.  
  - *Q1*: No iterative history → Proceed to Q2.  
  - *Q2*: Direct contribution to catalysis (transition-state stabilization), but no selection history.  
    - → **Rewrite as mechanism**: "The oxyanion hole stabilizes the transition state via hydrogen bonding."  

  **Claim 2: "The function of the fluoride-binding domain is fluoride capture."**  
  - Domain refined via 14 rounds of mutagenesis/screening.  
  - *Q1*: Iterative selection for fluoride binding → **Function claim licensed**.  

  **Claim 3: "The function of the hydrophobic core is to stabilize the fold."**  
  - Core assembled from convenience-based motif library, no iterations.  
  - *Q1*: No selection history → Proceed to Q2.  
  - *Q2*: Contribution to stability is evident, but systemic risk of overassignment (e.g., any core "stabilizes").  
    - → **Rewrite as mechanism**: "The hydrophobic core stabilizes the fold through van der Waals interactions."  
    - *Note*: Patent claims relying on this must be attorney-reviewed for strategic rewording.  

  **Repurposed scaffold example (e.g., natural domain used for novel binding)**:  
  - *Q1*: History exists, but not for the *new* function → Proceed to Q2.  
  - *Q2*: Current contribution is demonstrable → **Conditionally licensed with rewrite** ("contributes to [new capacity]") or **attorney handoff** for legal interpretation.
