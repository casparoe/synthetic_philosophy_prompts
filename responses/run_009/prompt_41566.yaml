prompt: |-
  I'm a third-year PhD student in economics, TA-ing for a master's course in decision analysis — the students are mostly public policy and health policy people, comfortable with expected utility at the level of a decision tree, but they've never seen a proof of anything and they get prickly when a topic smells like theory for theory's sake. Next week I get fifty minutes on the result everyone calls Good's theorem: if you're a Bayesian expected-utility maximizer, the expected value of acting after receiving free information is never lower than the value of your best act now, so imformation never has negative expected value. The instructor warned me this is historically the session where half the class decides the whole Bayesian framework is a shell game, so I want to plan it properly rather than wing it like I did for the risk aversion lecture.

  To be clear, don't explain the theorem to me — I know the proof, it's basically the law of total expectation plus "you're allowed to ignore the signal." What I need is a plan for the session. What has to be in place before I even state the theorem — my instinct is that the whole thing lives or dies on them getting whose expectation we're talking about (the prior expectation, taken before you see the signal, over what you'll do after), but tell me if you think something else has to come first. Then pick the single running example that should carry the full fifty minutes: I'm torn between a policy pilot study and a diagnostic test for some condition, but choose one for me and say what it needs to contain that a boring umbrella-and-weather example wouldn't. Then the misconception map: I already know they'll say "but sometimes I'd rather not know" (test for an untreatable disease, etc.), and "so we should just run every study forever," and probably "this is circular, you assumed Bayes to prove Bayes is fine" — tell me where in the sequence each should be headed off rather than left to fester till Q&A, and, importantly, which of these is actually pointing at a real limitation of the theorem's setup rather than a misunderstanding, because I suspect at least one of them is. Also tell me what I should openly refuse to cover in fifty minutes and say out loud that I'm refusing — costly information? the sample-size machinery from my own field? — so they don't think I just forgot it.

  Please make actual choices rather than giving me menus of examples and orderings to pick between, and push back on my guesses where they're wrong, including the one about whose expectation being the crux. End with the single question I can put on the board in the last five minutes that would let me tell who's actually gotten it from who's just nodding along.
reasoning: |-
  Okay, the user is a third-year PhD student in economics preparing to teach a master's course on decision analysis. They need to present Good's theorem in a 50-minute session to students who are policy and health policy practitioners. The challenge is making this theoretical concept accessible and avoiding the common pitfalls where students dismiss Bayesian frameworks as abstract or irrelevant.

  The user already knows the technical proof but is concerned about pedagogical effectiveness. They've identified potential misconceptions: students might argue "sometimes I'd rather not know" (like untreatable diseases), "so we should run every study forever," and "the proof is circular." The user suspects one of these points to a real limitation but isn't sure which. They also need a single, compelling example and a clear plan to structure the session.

  First, the core issue is whose expectation we're discussing—prior expectation before seeing the signal. The user thinks this is crucial, and I agree. Without clarifying that the expectation is taken before receiving the signal, students might misinterpret the theorem as guaranteeing better outcomes post-information, which isn't always true. So emphasizing the ex-ante perspective is essential.

  For the example, the diagnostic test for a treatable disease is a better choice than a policy pilot study. Why? It's more relatable to health policy students and highlights the distinction between treatable and untreatable conditions, which addresses the "I'd rather not know" objection upfront. Including a treatable disease (like strep) and an untreatable one (like Huntington's) in the same example efficiently tackles this misconception early.

  Structuring the session: Start with a concrete scenario to ground the concept. Present the no-information baseline, then introduce the value of information. Preempt the "I'd rather not know" point by contrasting treatable vs. untreatable cases. State the theorem clearly, then walk through the proof step-by-step using the diagnostic example. Address the other misconceptions during the proof explanation. For instance, when discussing ignoring the signal, point out that this doesn't imply running infinite studies. Emphasize that the theorem assumes Bayesian updating but isn't circular—it's about coherence within the framework.

  The real limitation is the "I'd rather not know" scenario, where information can have negative utility due to psychological costs or lack of actionable options. Explicitly state this boundary to validate student concerns while clarifying the theorem's scope.

  End with a question to check understanding: "Why does the theorem say 'expected value' rather than 'guaranteed better outcome'?" This tests if they grasp the ex-ante expectation and probabilistic nature.

  The user should avoid delving into costly information or sample-size machinery due to time constraints, stating this upfront to manage expectations. By structuring the session to address misconceptions proactively and using a relatable example, the user can make the theorem intuitive and prevent the common backlash against Bayesian theory.
answer: |-
  Here’s a battle-tested plan for your 50-minute session on Good’s theorem, designed to preempt blowback and ground the abstraction in policy relevance. The key is **making the prior’s ex-ante perspective visceral** and **confronting the "I’d rather not know" objection head-on**.

  **Core Insight:** The crux *is* "whose expectation" (ex-ante prior expectation over signals and states), but it’s inseparable from **why "free" matters** and **distinguishing decision utility from experienced utility**. Your instinct is correct – fail to clarify this, and the theorem feels like sleight of hand.

  **The Unifying Example: Diagnostic Test for a Treatable Condition (with an untreatable twist)**
  *   **Why this over policy pilot/umbrella?** It directly confronts the "I’d rather not know" elephant in the room, is highly relevant to health policy students, and cleanly separates decision utility from psychological cost. An umbrella example trivializes the emotional weight; a policy pilot often involves messy costs/feasibility.
  *   **Scenario Details (Write this on the board immediately):**
      *   **Decision:** Treat a patient for a specific bacterial infection (e.g., Strep throat) or not.
      *   **States:** Patient *has Strep* (S) or *doesn't* (¬S).
      *   **Prior Prob:** P(S) = 0.4 (Based on symptoms/local prevalence).
      *   **Utilities:**
          *   Treat + Has Strep: +10 (Cure, cost of treatment)
          *   Treat + No Strep: -2 (Unnecessary antibiotics cost/side effects)
          *   No Treat + Has Strep: -10 (Untreated illness complications)
          *   No Treat + No Strep: +5 (Avoided unnecessary treatment)
      *   **Baseline (No Info):** E[U(Treat)] = (0.4)(10) + (0.6)(-2) = 4 - 1.2 = 2.8. E[U(No Treat)] = (0.4)(-10) + (0.6)(5) = -4 + 3 = -1. **Best Act Now:** Treat (EU=2.8).
  *   **The Information:** A rapid diagnostic test (T). Costs nothing (free!), takes no time.
      *   **Test Characteristics:** P(+|S) = 0.95, P(-|¬S) = 0.90 (Sensitivity/Specificity).
      *   **Calculate Likelihoods:** P(+|S)=0.95, P(+|¬S)=0.10, P(-|S)=0.05, P(-|¬S)=0.90.
      *   **Calculate Posterior Probabilities (via Bayes):** P(S|+) ≈ 0.86, P(S|-) ≈ 0.03. *(Do this quickly, remind them it's just Bayes' Rule applied)*.
  *   **Optimal Strategy *After* Seeing Signal:**
      *   If T=+, Treat (EU|+ ≈ 0.86*10 + 0.14*-2 ≈ 8.6 - 0.28 = 8.32 > E[U(No Treat)|+])
      *   If T=-, No Treat (EU|- ≈ 0.03*-10 + 0.97*5 ≈ -0.3 + 4.85 = 4.55 > E[U(Treat)|-])
  *   **Ex-Ante Expected Value *With* Information:** Weight outcomes by probability of signals.
      *   P(+) = P(+|S)P(S) + P(+|¬S)P(¬S) = (0.95)(0.4) + (0.10)(0.6) = 0.38 + 0.06 = 0.44
      *   P(-) = 1 - 0.44 = 0.56
      *   E[U(Info)] = P(+)*EU(|+) + P(-)*EU(|-) = (0.44)(8.32) + (0.56)(4.55) ≈ 3.66 + 2.55 = **6.21**
  *   **Value of Information (VOI):** E[U(Info)] - E[U(Best Act Now)] ≈ 6.21 - 2.8 = **3.41 > 0**. Positive!

  **Session Flow (50 Minutes):**

  1.  **(5 min) Hook & Context:** "We've seen how to use info *after* we get it. But how do we decide if getting info is *worth it* *before* we know what it says? This is crucial for policy: pilot studies, diagnostic tests, market research. Good's Theorem gives a powerful baseline for valuing *free* information. Today's mantra: **Whose eyes are we looking through?**"
  2.  **(10 min) Build the Baseline (No Info):** Elicit states/probs/utilities for the Strep scenario. Calculate E[U(Treat)] and E[U(No Treat)]. **Crucially ask:** "Is this calculation done *before* or *after* we'd know if they have Strep?" (Before!). **Declare Best Act Now (Treat, EU=2.8).**
  3.  **(10 min) Introduce the Test & Optimal Use *After* Info:** Describe test characteristics. Calculate posteriors (P(S|+), P(S|-)). Ask: "What should you do if the test is positive? Why? Negative? Why?" Calculate EU(|+) and EU(|-). **Emphasize:** This is what you *will* do *if* you get the info.
  4.  **(10 min) The Ex-Ante Leap & VOI Calculation:** "BUT! We haven't run the test yet! We're sitting here *now*, with our prior, deciding *whether* to run it. How good is this strategy *in expectation*, before we see the result?" Calculate P(+)/P(-). Calculate E[U(Info)] = P(+)*EU(|+) + P(-)*EU(|-). Calculate VOI = Diff vs Best Act Now. **HAMMER:** "Whose expectation is this? OURS, NOW, with our PRIOR beliefs, averaging over what the signal MIGHT say and what we WOULD DO in each case." **State Good's Theorem Clearly:** "For a Bayesian EU maximizer, the expected utility of the optimal strategy that uses free information is always at least as high as the expected utility of the best act available without that information. VOI ≥ 0."
  5.  **(10 min) Misconception Takedown & Nuance (Integrated):**
      *   **"But sometimes I'd rather not know!" (e.g., untreatable disease):** *Preempt this right after stating the theorem.* "Ah! This is the most important objection. Let's modify our example. Suppose it's a test for an *untreatable*, fatal neurological disease (like early-stage Huntington's). What changes? **The utilities!** The *act* of knowing might carry huge negative utility (anxiety, despair) even if it doesn't change your physical actions. Good's theorem only considers the utility of *outcomes influenced by your actions*. If 'knowing' itself directly harms your well-being, that cost isn't captured in the decision tree's utility nodes! **This is a REAL limitation:** The theorem assumes utilities depend *only* on states and actions, not on the information itself. Psychological costs break that." *Connect back:* "In our Strep case? Knowing guides treatment; psychological cost is likely small. VOI positive. In untreatable fatal disease? Knowing might *add* significant disutility not tied to action. VOI *could* be negative *if* that cost outweighs the instrumental value. Good's theorem doesn't apply to intrinsic costs of knowing."
      *   **"So we should just run every study forever?":** "NO. Good's theorem is for *free* information. Real info has costs: money, time, opportunity cost, delay. VOI tells you the *maximum* you should be willing to pay. If the cost > VOI, don't get it! We're *only* talking about the pure value of the signal itself today." *State explicitly:* "We are NOT covering costly information today; that's next week/another lecture. Today is about establishing the baseline value ≥ 0."
      *   **"This is circular! You assumed Bayes to prove Bayes is fine!":** "Good catch, but not quite. The theorem says: *IF* you are a Bayesian expected utility maximizer (meaning you update beliefs via Bayes' rule and choose acts to max EU given your beliefs), THEN this specific property (VOI ≥ 0 for free info) holds. It's a coherence result *within* the framework. It doesn't prove the framework is 'true,' it proves it's internally consistent on this point. It's a *feature* of being Bayesian, not proof that Bayesianism is universally correct." *(Acknowledge the meta-point but keep it brief).*
  6.  **(4 min) Recap & The Big Picture:** Restate theorem & key takeaway: "Free information has non-negative value *when valued from your current perspective*, before you see it, *assuming* your utility depends only on states and actions." Re-emphasize the "whose eyes" (ex-ante prior). Connect to policy: "Justifies *considering* pilot studies/diagnostics *in principle*; VOI calculation tells you *how much* they might be worth before cost."
  7.  **(1 min) Open Refusals (State Clearly):** "To focus, we are *explicitly ignoring* today: 1) Costs of information (money, time, ethical costs), 2) How to design studies or calculate complex test characteristics, 3) Non-Bayesian updating. These are vital but separate topics!"

  **The Final Check Question (Put on board @ 45 min mark):**
  > **"Patient X has a 30% prior chance of Condition Y (treatable). A free, perfectly accurate test exists. Good's theorem says the ex-ante expected value of using this test is ≥ the value of treating without the test. True or False? EXPLAIN why, focusing on *whose* expectation and *why* it must be ≥."**

  *   **Why this works:**
      *   **True.** (Simple check).
      *   **Explanation Target:** They MUST mention the "ex-ante" (prior) expectation. They should reference averaging over possible test results and choosing optimally *after* seeing each result. They *might* reference the option to ignore (though perfect test makes ignoring suboptimal, the point stands). They should *not* say it guarantees a better outcome for this specific patient.
      *   **Identifies Nodders:** Anyone who just parrots "VOI ≥ 0" without mentioning the ex-ante perspective or the averaging over signals fails. Anyone focusing on the specific outcome ("but what if the test says no and they have it?") misses the point.

  **Pushing Back & Refinements:**
  *   **Your Instinct (Whose Expectation):** You are **absolutely right**. This is the single point of failure. The entire session structure forces engagement with this perspective through the example calculation.
  *   **"I'd rather not know" as Limitation:** You correctly identified this is the **primary real limitation**. Building the untreatable disease nuance *directly into the core example* makes this concrete and validates their intuition while showing the theorem's boundary. This is where spending extra time pays off in credibility.
  *   **Focus on a Single Example:** The diagnostic test with the untreatable twist covers more ground efficiently than a policy pilot (which often introduces distracting feasibility issues) or an umbrella (which feels trivial). It provides the emotional hook *and* the clean analytical structure.
  *   **Avoiding Menu Paralysis:** The plan makes specific choices: Diagnostic Test, integrated misconception handling, explicit refusals. Stick to this structure; it's designed for maximum impact in minimal time.

  **Key to Success:** Be relentlessly explicit about the temporal perspective ("Where are we *now*? What do we know *now*? What are we averaging over *now*?") and connect every equation back to the concrete example. Good luck – this is a tough but crucial session!
