      - Emphasize: "Please base your judgments on your immediate aesthetic response. There are no right or wrong answers. We're interested in your honest, individual reaction."

   2. Adjacent Pair Comparisons (about 50 minutes total)
      - We have 7 adjacent pairs (for 8 passages: 1vs2, 2vs3, 3vs4, 4vs5, 5vs6, 6vs7, 7vs8).
      - How to run each pair:
          a. Distribute a sheet with the two passages (say, version A and version B) and a ballot. The ballot is a small slip of paper with two options: "A" or "B", and maybe a line for a brief comment (optional, but might be useful for debrief). 
          b. Give them 3 minutes to read and decide. They should not discuss with neighbors.
          c. Collect the ballots in an envelope. Do not reveal the results until the end of the adjacent pair phase? Actually, we want to avoid anchoring. So we collect all ballots without revealing the outcome until the debrief? But then we can't address splits in the moment. Alternative: reveal the vote count but not the comments? We want to avoid influencing the next vote. So let's not reveal until the end.

          However, we need to manage time. We have 7 pairs. If we take 5 minutes per pair (3 minutes reading, 2 minutes collecting and moving on) that's 35 minutes. But we also need to distribute sheets. We can pre-stack the sheets for each pair and hand them out quickly.

      - Important: Each participant must commit to a choice in writing for each pair. They keep no record of their own votes (so they can't rationalize later). We collect the ballots and keep them by pair.

      - If the group splits on a pair, that's fine. We'll note it and use it in the debrief.

   3. Endpoint Comparison (10 minutes)
      - Now hand out a sheet with the first passage (version 1) and the last passage (version 8). Also a ballot: "1" or "8".
      - Same process: 3 minutes to read and decide, then collect ballots.

   4. Reveal Results and Debrief (25 minutes)
      - We have about 25 minutes left (90 - 5 - 50 - 10 = 25).
      - First, reveal the results of the adjacent pairs and the endpoint. Write on the whiteboard:

          Pair 1 vs 2: X% preferred 2 (we expect high for 2)
          Pair 2 vs 3: X% preferred 3
          ...
          Pair 7 vs 8: X% preferred 8? But note: we expect that at some point, the trend might break? Actually, we expect each adjacent step to be an improvement until the last few? But our design is that each adjacent step is an improvement, so we expect 2>1, 3>2, ... 8>7. But then we expect 1>8.

      - Then show the endpoint: 1 vs 8: we expect a majority for 1.

      - The contradiction: if 2>1, 3>2, ... 8>7, then by transitivity we should have 8>1. But we have 1>8.

      - Now open the floor: "What do you notice?" Let them observe the pattern and the contradiction.

      - Then guide the discussion:
          a. Pairwise better-than: In each step, we judged one as better than the other. But when we put the chain together, we get a cycle? (1<2<3<...<8 but then 8<1? Not exactly a cycle, but a violation of transitivity: 1<8 should hold by the chain, but we have 1>8.)
          b. The transitivity assumption: We naturally assume that if A<B and B<C then A<C. But here that breaks.
          c. Why? Maybe because each step is a small change, but the accumulation of small changes leads to a big change that we don't like. So the relation "better than" in aesthetics might not be transitive.

      - Also, note that in each adjacent pair, the change is small and defensible (a little more vividness, etc.), but over many steps, we get a passage that is too much. So the endpoint comparison is between two passages that are very different and might not be directly comparable? Or the criteria we use for adjacent pairs (which are similar) don't apply to the endpoints.

