  We are designing a 90-minute session for 12 adult writers. The goal is to have them experience the intransitivity of "better than" in aesthetic judgment through a chain of prose passages (8-12 versions of a 200-word paragraph). Each version is a small improvement on the previous, but the chain goes from flat to overwrought.

   Key elements:
   - Participants should make private, committed judgments at each step without rationalizing backwards.
   - We want to compare adjacent pairs (which are easy) and then the endpoints (which are also easy but in the opposite direction) to reveal the contradiction.
   - Debrief should connect the experience to the philosophical problem.

   Structure:
   1. Introduction (5 minutes)
   2. First adjacent pair comparison (10 minutes)
   3. Subsequent adjacent pair comparisons (about 5 minutes each, for 7-11 pairs: 35-55 minutes total? We must adjust for time)
   4. Endpoint comparison (10 minutes)
   5. Debrief and discussion (20 minutes)

   However, 90 minutes is tight. We have 12 participants and 8-12 passages. Let's choose 8 passages to be safe.

   Steps:

   1. Introduction (5 minutes)
      - Welcome and set the context: "Today we're going to do a close reading exercise. We'll be looking at several versions of the same paragraph and making simple comparisons between them. The goal is to sharpen our critical eye and to notice how small changes accumulate."
