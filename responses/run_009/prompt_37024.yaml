      - If a pair is split (say 60-40), that's okay. We can note that the group majority still goes in the expected direction. But if a pair goes the "wrong" way, that might break the chain. So we must design the chain so that the adjacent steps are clear improvements. If a step is not clear, we might have a problem. So we must test the chain beforehand.

