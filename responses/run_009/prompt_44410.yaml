answer: |-
  ### Decision Procedure for Flood Warning Decisions

  Below is a step-by-step procedure designed to be completed within 30 minutes. It prioritizes quick checks for **chaos** (initial-condition errors), **structural error** (model bias), and **weather forecast error** (inherited uncertainty). Use the deterministic run (single number) for baseline, and the 50-run ensemble for uncertainty assessment. Thresholds are rules of thumb—calibrate to your basin’s specifics (e.g., 10 cm spread may be high in a small creek but low in a large river). Judgment calls are explicitly flagged.

  ---

  #### Step 1: **Baseline Check** (1–2 min)  
  - **Look at**: Deterministic forecast peak level and timing.  
  - **Compare to thresholds**:  
    - **Warning threshold** (e.g., minor flooding): Issue alerts.  
    - **Evacuation threshold** (e.g., major flooding): Act immediately if confirmed.  
  - **Signal**: Deterministic peak > threshold.  
  - **Noise**: Peaks far below threshold with no ensemble concern.  
  - **Judgment call**: None here—pure arithmetic.  

  #### Step 2: **Assess Chaos (Initial-Condition Uncertainty)** (5–7 min)  
  - **Look at**: Ensemble spread at the forecast peak time.  
  - **Calculate**:  
    - **Range** (max peak – min peak).  
    - **Standard deviation** (SD) of peak levels.  
  - **Rules of thumb**:  
    - **Low spread** (high confidence): Range < 20 cm **or** SD < 5 cm.  
    - **Medium spread**: Range 20–50 cm **or** SD 5–15 cm.  
    - **High spread** (chaos dominates): Range > 50 cm **or** SD > 15 cm.  
  - **Signal**: High spread at short lead times (<24 hr) indicates chaos or inherited weather error.  
  - **Noise**: High spread at long lead times (>48 hr) is expected—focus on proportion exceeding threshold.  
  - **Judgment call**: Classifying spread (low/medium/high) uses your basin’s experience.  

  #### Step 3: **Check Structural Error (Model Bias)** (3–5 min)  
  - **Look for**: Known bias scenarios (e.g., long dry spell, rapid snowmelt).  
  - **Key triggers**:  
    - **Dry soil bias**: Model overestimates runoff after drought (common in rainfall-runoff routines).  
    - **Snowmelt bias**: Model underestimates melt rate during sudden warmth.  
  - **Rules of thumb**:  
    - If in bias scenario, adjust deterministic peak:  
      - **Dry spell**: Subtract 10–20% from forecast peak (overestimation bias).  
      - **Snowmelt**: Add 10–15% (underestimation bias).  
  - **Signal**: Forecast similar to past failure (e.g., same conditions as 2 years ago).  
  - **Noise**: Bias unlikely if no triggering conditions (e.g., average soil moisture).  
  - **Judgment call**: Deciding if current conditions match bias triggers.  

  #### Step 4: **Inherited Weather Forecast Error** (3–4 min)  
  - **Look at**: Ensemble spread pattern and weather context.  
  - **Rules of thumb**:  
    - **High spread + stable weather** (e.g., steady rain): Chaos dominates.  
    - **High spread + unstable weather** (e.g., thunderstorms): Weather error dominates.  
    - **Low spread + any weather**: Confidence high—weather error unlikely.  
  - **Signal**: Ensemble clusters into distinct groups (e.g., half high/half low)—suggests weather input error.  
  - **Noise**: Random scatter in ensemble—likely chaos.  
  - **Judgment call**: Weather stability assessment (use recent forecast accuracy as proxy).  

  #### Step 5: **Synthesize & Decide** (10–12 min)  
  - **Apply thresholds**:  
    | Confidence               | Action                                                                 |  
    |--------------------------|------------------------------------------------------------------------|  
    | **High** (low spread, no bias) | Evacuate if > evacuation threshold; warn if > warning threshold.       |  
    | **Medium** (moderate spread or mild bias) | Warn if > warning threshold; evacuate only if >70% of ensemble > evacuation threshold. |  
    | **Low** (high spread or strong bias) | Warn if deterministic > warning threshold; evacuate only if worst-case ensemble member > evacuation threshold **and** lead time <24 hr. |  
  - **Stopping point for judgment**:  
    - If spread is medium (40–60% of ensemble > threshold) **or** bias adjustment places forecast near threshold—**hand off to duty manager**.  
    - Rationale: Risk tolerance (e.g., evacuating elderly communities at night) isn’t computational.  

  #### Procedure Weaknesses:  
  - **Misfires in "gray zones"**: Medium spread at 48 hr may under-warn if bias is missed.  
  - **Assumes bias is quantifiable**: Dry-spell adjustments are crude estimates (judgment dressed as arithmetic).  
  - **Ignores real-time data**: Use gage readings in Steps 3–5 if time permits (e.g., is river rising faster than forecast?).  

  ---

  ### Case Applications  
  **(a) 12-hour horizon, all 50 perturbed runs agree on peak level within a couple of centimeters, and the peak is above evacuation threshold.**  
  - **Step 1**: Deterministic > evacuation threshold—baseline red flag.  
  - **Step 2**: Range < 5 cm → **low spread** (high confidence). Chaos unlikely.  
  - **Step 3**: No dry spell mentioned → **no structural error**.  
  - **Step 4**: Low spread → **weather error unlikely**.  
  - **Step 5**: High confidence → evacuate.  
  - **Call**: Evacuate  

  **(b) 48-hour horizon, runs split half above/half below threshold, no pattern.**  
  - **Step 1**: Deterministic likely near threshold (ensemble split implies uncertainty).  
  - **Step 2**: Range likely > 50 cm → **high spread** (chaos dominates).  
  - **Step 3**: No bias mentioned → **no structural error**.  
  - **Step 4**: Split with no pattern → **weather error possible but unconfirmed**.  
  - **Step 5**: Low confidence + long lead time → warn due to worst-case risk. Do not evacuate yet.  
  - **Call**: Warning  

  **(c) 12-hour horizon, all runs agree—same model badly wrong after long dry spell two years ago.**  
  - **Step 1**: Deterministic > threshold (agreement implies significance).  
  - **Step 2**: Low spread → high confidence initially.  
  - **Step 3**: **Dry spell bias confirmed** → adjust: subtract 15% from peak. If still > threshold, risk remains.  
  - **Step 4**: Low spread → weather error unlikely.  
  - **Step 5**: Low confidence due to bias → warn but verify with real-time data. Do not evacuate without corroboration.  
  - **Call**: Warning and verify  

  ---

  ### Verdict:  
  **Verdict:** Assume uncertainty, prioritize warnings
