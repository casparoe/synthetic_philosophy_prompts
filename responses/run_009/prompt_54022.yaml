  For each, I’ll need philosophical and mathematical justifications. For example, reordering invariance is crucial because Pasadena’s "expected value" isn’t unique—it’s a pathology of conditional convergence. But some might argue that real-world agents must act, so indecision isn’t viable. I should note where requirements might be contested (e.g., is determinate action always necessary?).

  The user’s hunch that "always prescribe an action" may be a bias deserves attention. Economists might insist on decidability, while philosophers could accept "undecided" as valid. I’ll push back gently: even in ambiguity, dominance might force a choice (e.g., if one option is worse in all states).

  For the friend’s point: truncation fixes (e.g., ignoring low-probability tails) can fail if the cutoff affects rationality. Example: a game where utility grows so fast that truncating at N vs. N+1 reverses the decision. This feels like a regression to the original problem. A robust theory should avoid such dependencies.

  Finally, I’ll organize desiderata into tiers—core vs. negotiable. Core: convergence to standard EV, state relabeling invariance, dominance compliance. Negotiable: determinate actions (maybe acceptable to suspend judgment), reordering invariance (controversial in Pasadena). The friend’s stress-test is likely a core anti-requirement for truncation approaches.

  I need to ensure clarity without jargon. Emphasize why each item matters: e.g., reordering matters because it exposes arbitrariness; dominance preserves basic rationality. Also, flag where theories might reasonably dissent (e.g., some argue Pasadena’s reordering isn’t a flaw if the summation order reflects temporal discounting).

