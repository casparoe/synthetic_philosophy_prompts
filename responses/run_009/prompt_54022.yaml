answer: |-
  Here's a comprehensive set of desiderata for a decision theory handling undefined/divergent expectations, grounded in the core problems and philosophical tensions. Requirements are categorized, with justifications and notes on contestability. The goal is a theory that's **consistent**, **principled**, and **practically useful**, without requiring magic where none exists.

  ### Core Rationality & Consistency Requirements (Minimal Non-Negotiable)

  1.  **Convergence to Standard EV:** *When the expected utility (EU) converges absolutely, the theory must prescribe maximizing EU.*
      *   **Why:** This is the baseline. If a theory fails here, it's not an extension of EU but a replacement. Well-behaved cases (finite support, absolutely convergent series) are the foundation.
      *   **Contestability:** None. Failure here disqualifies the theory.

  2.  **State Relabeling Invariance:** *The recommended action must not change if states of the world are merely relabeled (without changing probabilities or outcomes).*
      *   **Why:** Rationality shouldn't depend on arbitrary labeling. This is fundamental to representing the underlying uncertainty structure.
      *   **Contestability:** None. Violating this implies arbitrariness.

  3.  **Stochastic Dominance (Weak & Strong):** *The theory must respect dominance.*
      *   **Weak:** If option A yields at least as good an outcome as option B in *every* possible state, and strictly better in some state(s) with positive probability, then A should be strictly preferred to B.
      *   **Strong (Statewise):** If, for *every* utility threshold, the probability that A yields at least that utility is greater than or equal to the probability that B yields at least that utility, and strictly greater for some utility, then A should be strictly preferred to B.
      *   **Why:** Dominance is perhaps the weakest, most fundamental principle of rational choice under uncertainty. Ignoring it (e.g., preferring an option known to be worse in some states without compensation elsewhere) is indefensible.
      *   **Contestability:** None for Weak Dominance. Strong Dominance is also widely accepted, though some theories might struggle subtly with infinite state spaces; failure should be a major red flag.

  4.  **Additivity of Identical & Independent Games:** *If playing two (or more) independent, identical instances of a well-defined game (finite or convergent EU) is rational, then playing N instances should be rational (for finite N).*
      *   **Why:** Rationality should scale consistently with repetition for standard gambles. If playing one lottery ticket is rational, buying two identical tickets should also be rational. This tests for perverse scaling effects.
      *   **Contestability:** Low. Violations suggest instability in the theory's handling of repetition, even for well-behaved cases.

  ### Handling Divergence & Pathology (Core Challenges)

  5.  **Independence of Presentation (Outcome Splitting):** *The recommended action must not change if a single outcome with utility U and probability P is replaced by two mutually exclusive outcomes, each with utility U, with probabilities summing to P.*
      *   **Why:** This is "coarsening/refining" the outcome space. Representing the same payoff in multiple ways shouldn't affect the decision. (Crucial for extending dominance reasoning and avoiding partition-dependence pathologies).
      *   **Contestability:** Low. Violating this makes the theory highly sensitive to arbitrary descriptions of the same underlying prospect.

  6.  **Pasadena Tolerance / Reordering Invariance Stance:** *The theory must not produce a *definitive finite valuation* for prospects whose "expected utility" series is conditionally convergent (like the Pasadena game). It must either:*
      *   *(a) Refuse to assign any finite comparable value (declare non-comparability or indeterminate preference), OR*
      *   *(b) Assign a single specific value *invariant* under all permissible rearrangements (if it argues some order is privileged).*
      *   **Why:** The core pathology of Pasadena is that rearrangement changes the sum. Assigning a specific finite value based on an arbitrary default ordering is indefensible. A theory *must* acknowledge this pathology, not hide it by picking an order arbitrarily. (a) is the cautious approach; (b) requires a strong justification for the privileged order (e.g., temporal discounting inherent to the game description).
      *   **Contestability:** High. **This is the crux.** Many theories *will* violate this. Proposals *will* disagree here. The requirement is that the theory *explicitly confronts* the issue, not that it necessarily adopts (a) or (b). A theory that silently outputs a number sensitive to summation order fails.

  7.  **Heavy Tail Consistency (St. Petersburg Type):** *The theory must handle prospects with infinite expectation (like St. Petersburg) consistently. It must either:*
      *   *(a) Always prefer such a prospect to any finite sure payoff (Infinite Fanaticism), OR*
      *   *(b) Sometimes allow finite sure payoffs to be preferred, based on a well-defined principle that avoids arbitrariness (e.g., strong tail discounting, finite resource constraints modeled explicitly).*
      *   **Why:** Pure EU says (a). This seems absurd to most people (would you really trade your house for one St. Petersburg ticket?). (b) is more intuitive but requires justification beyond "it feels too big." The requirement is for a *principled* stance, not an ad hoc fix. The principle must generalize.
      *   **Contestability:** Very High. **Another major fault line.** Theories will fundamentally diverge here. The requirement is coherence and lack of arbitrariness within the chosen stance.

  ### Practicality & Guidance Requirements

  8.  **Action Guidance (Determinate Action Not Always Required):** *The theory need not always prescribe a single determinate "rational" action. It may declare options incomparable.* **However, if it declares incomparability, it must:**
      *   *(i) Be based on a clear, general principle (not just "this case is hard"),*
      *   *(ii) Specify when comparability *is* possible (e.g., via dominance, finite approximations),*
      *   *(iii) Allow for the possibility of rational choice *despite* incomparability (e.g., using secondary criteria like minimax regret, or permitting any non-dominated choice), OR justify why no choice can be made.*
      *   **Why:** Forcing a determinate choice in all cases (like Pasadena) often smuggles in arbitrariness (e.g., default summation order). Rational agents can rationally suspend judgment or use tie-breakers when core valuation fails. However, the theory must still offer *some* practical guidance framework for when its primary valuation is indeterminate.
      *   **Pushback on Your Hunch:** You are likely correct that *requiring* a determinate action in *every* conceivable choice *is* a prejudice. The Pasadena game is a strong counterexample: forcing a choice *is* arbitrary. However, a good theory shouldn't leave the agent paralyzed. It must say *something* useful about what they *can* do (e.g., "choose any non-dominated option," "flip a coin," "use this secondary rule").
      *   **Contestability:** Moderate. Some camps insist on universal comparability. Requirement (iii) is key to making incomparability palatable.

  9.  **Robustness to Finitization / Approximation:** *The theory's recommendations for the idealized infinite/divergent prospect should align with the recommendations it gives for sensible finite approximations of that prospect, in the limit.*
      *   **Why:** We understand finite, well-defined choices. If a theory says "Pay $X to play the *infinite* Pasadena game" but also says "Never pay $X to play the *first N rounds* of the Pasadena game for any large N", this is deeply suspicious. The infinite case should be a limit of the finite cases.
      *   **Contestability:** Low. This is a basic coherence check. Violations indicate the theory treats the infinite case as fundamentally disconnected from reality.

  ### Stress-Testing Tail Truncation (Your Friend's Point)

  10. **Cutoff Invariance Requirement:** *A theory relying on implicit or explicit truncation/discounting of tails must not yield contradictory prescriptions based solely on where the cutoff is applied, especially when the cutoff point is endogenous to the decision problem itself (akin to the Two Envelope problem).*
      *   **The Stress Test:** Consider a prospect P(λ) where the "rational" truncation point or discounting factor λ recommended by the theory *depends* on the agent's wealth or another option available. Now, introduce a choice between P(λ) and P(λ') where λ' is chosen such that the theory's own rules for setting λ, when applied in the context of choosing between P(λ) and P(λ'), lead to a contradiction or a dominated choice. A robust theory avoids such self-referential traps.
      *   **Why:** Your friend identifies a critical flaw in naive tail truncation approaches. If the "rational" cutoff depends on the options presented, it can create cycles or dominance violations (e.g., prospect A seems better than B when analyzed with cutoff C, but B seems better than A when analyzed with cutoff C', and there's no stable C). This mirrors the Two Envelope switching paradox. A theory using cutoffs must fix them *exogenously* or based on *agent properties independent of the specific choice* to avoid this.
      *   **Contestability:** Moderate. Proponents of cutoff theories might argue the cutoff *should* depend on context (like current wealth). However, if this context-dependence leads to contradictions *within a single decision problem* (like the stress test), it's fatal. The requirement is to avoid *internally contradictory* prescriptions based on cutoff choice.

  ### Summary of Key Tensions & Where Theories Might Reasonably Diverge

  *   **Pasadena Valuation (Req 6):** Must the theory output a number? Can it suspend judgment? Must the value be reordering-invariant? *Reasonable divergence point.*
  *   **Infinite Expectations (Req 7):** Fanaticism (always play) vs. Skepticism (sometimes reject finite sure payoffs). *Fundamental divergence point.*
  *   **Action Guidance (Req 8):** Is incomparability acceptable? If so, what then? *Divergence on philosophical grounds (must rationality always decide?).*
  *   **Handling Cutoffs (Req 10):** Can cutoffs be context-dependent without contradiction? *Divergence on technical implementation of finite approximations.*

  ### The "Must Not Do" List
  *   Must **NOT** output an arbitrary finite number for conditionally convergent series without justifying the summation order (violates Req 6).
  *   Must **NOT** violate State Relabeling Invariance (Req 2) or Weak Stochastic Dominance (Req 3).
  *   Must **NOT** fail to converge to standard EV for absolutely convergent cases (Req 1).
  *   Must **NOT** be sensitive to trivial outcome splitting (Req 5).
  *   Must **NOT** rely on cutoffs in a way that creates self-contradictory prescriptions under the Stress Test (Req 10).

  This framework prioritizes foundational consistency and rationality principles while acknowledging the deep philosophical divides on how to handle the pathological cases. A strong proposal will clearly state its stance on the contestable points (6, 7, 8) and rigorously demonstrate how it satisfies the core requirements (1-5, 9) and avoids the pitfalls (like Req 10 for cutoff theories). Good luck with your scorecarding!
