  A commenter on a rationality forum I've read for years dismissed plant-based diets in passing like this: "A chicken yields at most a few meals while a single cow yields hundreds, so per meal beef kills orders of magnitude fewer animals. On top of that, the crops behind a vegetarian diet are grown on land whose tilling kills uncounted mice, insects, and soil animals, whereas cattle graze on pasture that would otherwise sit empty of animals. So if you actually weigh total animal suffering, pasture-raised beef beats a vegetarian diet, and it's the vegetarians who are the ones harming animals."

  I'm inclined to think vegetarian diets reduce suffering, but I can't locate the flaw, and this commenter is usually well-informed. Would you go claim by claim and tell me which parts someone who works on animal welfare within effective altruism would accept, which are quietly doing more work than they appear to, and which are just wrong? I'm especially unsure about the last two sentences, since the whole comparison seems to turn on the pasture claim and the crop-cultivation claim, and the conclusion about vegetarians seems to overreach whatever the earlier premises establish.
