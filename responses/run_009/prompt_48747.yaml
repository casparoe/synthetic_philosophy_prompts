  We are translating the Frankfurt cases and related philosophical debate into the vocabulary of a backend engineer, using concepts like exception handlers, dead code, code coverage, etc.

  Frankfurt's original argument (against the Principle of Alternate Possibilities - PAP):
  PAP: A person is morally responsible for what they did only if they could have done otherwise.

  Frankfurt Case: A setup where an agent (call him Jones) is going to decide to do something (say, vote for a particular candidate). There is a counterfactual intervener (Black) who has the ability to intervene and force Jones to vote that way if Jones shows any sign of choosing otherwise. But in the actual sequence of events, Jones decides on his own to vote for that candidate, and Black does nothing. So, Jones couldn't have done otherwise (because if he had tried, Black would have forced him), but he did it on his own. The conclusion is that Jones is morally responsible even though he lacked alternative possibilities.

  Translation to engineering terms:

  - The system (Jones) is designed to perform a task (vote for candidate X). 
  - There is an exception handler (Black) that is set to trigger if the system shows any sign of deviating (i.e., if it starts to output a vote for someone else). 
  - In the actual run, the system completes the task without any exception, so the exception handler is dead code (it never runs). 
  - The system's code coverage for this run is 100% of the main path and 0% of the exception handler. 
  - The output (voting for X) is produced by the main logic without any intervention.

  Frankfurt's claim: The mere presence of the exception handler (which is dead code in this execution) doesn't change the fact that the system (Jones) is the one that produced the output. Therefore, we hold the system (Jones) responsible.

  Objections:

  1. **The Detection Problem (Race Condition?)**:
     How does the intervener (Black) know that Jones is about to choose otherwise? The objection is that if Black is set to intervene only if Jones shows a sign of choosing otherwise, then that sign must be something that occurs BEFORE Jones actually makes the decision. But if Jones hasn't made the decision yet, how can there be a sign? This seems like a race condition: the detection of the sign and the actual decision are happening in a tight loop.

     Translation: 
     - The exception handler (Black) is set to monitor a specific condition (a sign that Jones is about to vote for someone else). 
     - But the condition must be detectable before the actual decision is made and the vote is output. 
     - How can we have a condition that is both a reliable sign of an impending different decision and also does not already constitute the beginning of that decision? 
     - In code, we might have:

          if (monitor.detect_sign_of_deviation(jones)):
              black.force_vote(jones, candidate_x)
          else:
              jones.vote()   # which by itself might output candidate_x or something else?

     - The problem: if the `detect_sign_of_deviation` is based on some internal state of Jones that is not the vote itself, then we are in a race: if the sign is detected, we force the vote; if not, we let Jones vote. But what if the sign is a necessary step in Jones's own decision to vote for someone else? Then the presence of the monitor might interfere with the normal decision process.

     Philosophers call this the "prior sign" objection. If the sign is truly prior to the decision, then it might be that in the absence of the intervener, Jones could have shown the sign and then changed his mind. But the intervener, upon seeing the sign, would have intervened. So in the actual scenario without intervention, Jones didn't show the sign because he decided for X. But then the alternative possibility (voting for Y) requires showing the sign, and if the sign is present, the intervention would have happened. So the alternative possibility is blocked.

     However, the objection goes: if the sign is a reliable indicator of an impending vote for Y, then it must be that in the alternative scenario, the sign occurs and then the vote for Y would follow. But in that scenario, the intervener would have forced a vote for X. So how do we know that the sign really would have led to a vote for Y? Maybe the sign is just a random fluctuation and not a reliable indicator? Then the intervener might be forcing the vote even when Jones would have changed his mind and voted for X anyway.

     This is tricky. In engineering terms, we might say that the monitoring system must have a low false positive rate? But then we are in the realm of fault injection and chaos engineering: we are introducing a system that might perturb the state.

     My translation of the objection: The exception handler's condition check might be reading a state that is not atomic with the decision. There might be a TOCTOU (time-of-check, time-of-use) race: the state might change after the check. But in the Frankfurt setup, the condition is defined such that if the sign appears, then the intervener will force the vote. So the sign is defined as a sufficient condition for intervention. However, if the sign sometimes occurs without leading to a vote for Y (i.e., a false positive), then the intervener would be intervening unnecessarily. But in the Frankfurt case, we assume the sign is a reliable indicator.

     But the deeper problem: if the sign is a necessary part of the process that leads to a vote for Y, then the very presence of the monitoring system (which will then force X) means that the vote for Y is never completed. So we cannot say that Jones could have voted for Y. The alternative possibility is eliminated. But then, if we want to argue that Jones is responsible because he would have voted for Y in the absence of the intervener, we cannot because the intervener is always there. So we are stuck.

     This objection is trying to show that the Frankfurt case is impossible to set up without assuming determinism. But Frankfurt wants to avoid that assumption.

  2. **The Dilemma Defense**:
     The objection presents a dilemma: either the decision is determined or it isn't.
     - If determined, then Jones couldn't have done otherwise anyway, so the intervener is redundant.
     - If not determined, then there must be some point at which the decision is not fixed. But then how can the intervener be sure to detect a sign that will lead to a different decision? The sign might not occur until the decision is made, but then it's too late to intervene? Or if the sign is prior, it might not be reliable.

     Translation: 
     - Either the system (Jones) is deterministic: then the output is fixed by the inputs and state, so the exception handler is dead code and never runs. Then we don't need it to explain why Jones couldn't do otherwise.
     - Or the system is non-deterministic: then there is a possibility that the system might produce a vote for Y without any prior sign that the intervener can detect in time. Then the intervener fails to intervene, and Jones does vote for Y. But then Jones could have done otherwise (voted for Y without being forced). So the setup fails to block alternative possibilities.

     Therefore, the Frankfurt case either doesn't block alternative possibilities or it is redundant.

  Frankfurt's response (and other compatibilists) typically involves refining the case to avoid the detection problem. They might posit a prior sign that is both reliable and not part of the decision process in a way that causes interference. Or they might use a different mechanism (e.g., a direct brain scanner that can read the decision before it is made). But these refinements are controversial.

  Residue Report:

