  The World Happiness Report relies heavily on the Cantril ladder question, which asks people to rate their current life on a scale from worst to best possible life. This methodology presupposes several things about happiness: that happiness is a single, quantifiable subjective state that can be measured on a single scale; that people's "best possible life" concepts are comparable across individuals; that numerical ratings mean the same thing across different cultures; and that self-reported evaluations accurately reflect actual life conditions.

