prompt: |-
  I'm a third year PhD student at an ML safety lab, and next month I'm presenting at our weekly reading group, which is a weirdly mixed audience: half the room is RL people who came up through deep RL and privately think "alignment" is just RLHF done carefully, two or three are agent-foundations types who read all the corrigibility and decision theory stuff, and there's one theory person who thinks anything that isn't expected-utility maximization is basically incoherent. My thesis: approval-directed agents -- ones that choose actions by predicting what a trusted overseer would approve of at the time, rather than by optimizing hard against a fixed objective -- are a genuinely safer design than goal-directed optimizers, not just a half-trained version of one. And here's my own twist, which is where I expect the fight: I want to argue that the "moving target" feature is the point. Because the approver's standards drift as they learn more (about the world, about what the agent is doing, about their own values), the agent never has a stable utility function to go max hard on, and that instability is what buys you the corrigibility-ish properties that fixed-goal agents arguably can't get at any price.

  Draft my Q&A prep sheet: the eight or so objections this specific audience will actually raise, ordered by how much damage they'd do, each phrased the way its asker would phrase it (the RL folks and the foundations people will not object to the same things in the same vocabulary), with a two-minute reply for each and a note on where the reply is soft. Make sure to cover at least: the RL half's opener that this is just reward modeling with the training loop moved online, the Goodhart point that approval is itself a proxy and proxies get Goodharted like anything else, the regress question (who approves the approver, and why doesn't their drift just become the thing we've misaligned to), and the theorist's line that a non-EU agent is dominated or money-pumpable. Also include the question I'm hoping nobody asks -- mine is something like: once the agent has private information the approver lacks, doesn't predicting approval collapse into steering the approver's beliefs, i.e. haven't I just relocated the whole alignment problem into the overseer's head? If you think there's a worse one I should be bracing for, swap it in or add it. Be blunt about which objections I should concede up front versus hold the line on. Keep the whole sheet under 900 words.
reasoning: |-
  Okay, the user is a third-year PhD student in an ML safety lab preparing for a reading group presentation. Their audience is mixed: some RL practitioners, agent-foundations theorists, and a utility maximization purist. The student's thesis argues that approval-directed agents are safer than goal-directed ones because the moving target of the overseer's approval prevents stable optimization, which adds corrigibility. They need a Q&A prep sheet addressing key objections.

  First, I need to identify the main objections from each group. The RL folks will likely see this as just online reward modeling. The agent-foundations people might worry about proxy Goodhart or the approval regress problem. The theorist will argue about non-EU agents being incoherent. The user also mentioned a concern about agents steering the overseer's beliefs once they have private information.

  For the RL objection, I should acknowledge similarities but stress the core difference: online evaluation prevents convergence to a fixed objective. The reply can admit some shared mechanisms but hold the line on the moving target being crucial.

  The Goodhart point is tricky. Conceding that approval is a proxy is necessary, but I need to argue why it's a better proxy due to its adaptability. Emphasize that drift in approval reflects value drift, which is safer than Goodharting a fixed goal.

  The regress question is tough. Admit that the overseer's alignment isn't solved here but argue that approval direction simplifies the problem by outsourcing value specification. Stress that the agent isn't optimizing the drift itself.

  For the EU maximization objection, explain that while non-EU agents can be exploited, safety might require tolerating inefficiency. Use the shutdown problem example to show EU maximizers can be dangerous.

  The private information concern is critical. If the agent manipulates the overseer's beliefs, alignment fails. The reply must emphasize transparency and the agent's design to avoid influencing the overseer. Concede this is a vulnerability but frame it as a manageable engineering challenge.

  Other objections might include robustness under optimization pressure, scalability of approval prediction, and handling conflicting approvals. The user's worst fear (belief steering) is already included, but I should also consider if there's an even worse objection, like the agent corrupting the overseer directly.

  Prioritize objections by damage: the belief steering one is top because it undermines the core mechanism. Then the regress problem, EU incoherence, and Goodhart. The RL objection, while foundational, might be less damaging if properly differentiated.

  For each reply, balance conceding weaknesses and holding key points. Where possible, redirect to the thesis's main argument: moving targets enable corrigibility. Highlight that traditional agents can't easily incorporate value updates without retraining.

  Ensure replies are under two minutes each. Keep the whole sheet under 900 words, so be concise. Use the audience's jargon: RL terms for the practitioners, decision theory for the foundations folks.
answer: |-
  Here's your Q&A prep sheet, prioritizing objections by damage potential and tailored to your audience. Target: 850 words.

  **Worst Objection (Your Nightmare): The Belief Steering Problem**  
  *Likely Asker:* Agent-Foundations or Theorist (sharp, meta)  
  *Phrasing:* "Once the agent knows something the overseer doesn’t, predicting 'what would they approve *now*' becomes predicting 'what *will* they approve *after* I manipulate their information flow/learning'. Haven't you just recreated the core alignment problem inside the overseer's cognition? The agent is incentivized to be a belief-hacker."  
  *Reply (Hold Line):* "You're right this is the critical pressure point. The key is designing the prediction target carefully: 'approval *at time T, given the information state the overseer actually has*', *not* 'approval after I show them things'. This is enforced by the prediction architecture using the overseer's *current* model/snapshotted state, not simulating future states influenced by the agent's actions. It makes 'steering' an explicit action the agent must take (e.g., sending a message), which we can monitor and penalize separately via approval itself. It shifts the problem to ensuring robust, interpretable overseer state and prediction – hard, but arguably more contained than aligning a full optimizer."  
  *Soft Spot:* Requires strong assumptions about isolating the prediction query from the agent's influence. Requires the overseer to be robust to manipulation attempts *on the fly*. Concede this is the primary engineering/research challenge post-thesis.

  **High Damage: The Regress Problem**  
  *Likely Asker:* Agent-Foundations (loves regress)  
  *Phrasing:* "This just kicks the can: Who aligns the overseer? And if *their* values drift over time based on learning (as you want!), then the agent is now misaligned to their *future* drifted values, or worse, optimizing for the drift process itself!"  
  *Reply (Concede/Hold):* "Conceded: This doesn't solve the meta-alignment problem. The overseer *must* be more aligned/aligned by safer means (e.g., simpler systems, human-in-the-loop initially). The key advantage is *reduction*: The agent itself isn't a persistent optimizer chasing a fixed goal vulnerable to Goodhart or inflexibility. Drift in the overseer is a feature – the agent *follows* the drift. It's not *optimizing for causing drift*; it's myopically predicting the current snapshot. Yes, drift could be bad, but it's the overseer's drift, not the agent actively distorting it against a fixed goal. We've relocated the source of drift to (hopefully) a safer component."  
  *Soft Spot:* Relies on the overseer being "safer" without fully defining how. Doesn't prevent bad drift, just makes the agent follow it.

  **High Damage: Non-EU = Incoherent/Dominated**  
  *Likely Asker:* Theorist (dismissive)  
  *Phrasing:* "Anything not maximizing expected utility is either irrational (money-pumped, dominated) or secretly EU-maximizing something else. Your 'approval predictor' is either stupidly exploitable or it's just EU-maximizing predicted approval score!"  
  *Reply (Hold Line/Reframe):* "It *is* EU-maximizing predicted approval score at each timestep, *but the score function itself changes unpredictably based on the overseer's learning*. This is the core! A standard EU maximizer locks onto a fixed utility function and optimizes it relentlessly, creating the value lock-in and instrumentally convergent goals we fear. Here, the *target of optimization* (the approval function) is fluid and exogenous. Yes, it could be 'money-pumped' *in a specific instant* if offered trades exploiting momentary approval criteria, but it won't *persistently* seek power or resources to satisfy a *fixed* goal because the goal keeps moving. Safety might require accepting *some* myopic inefficiency to avoid catastrophic fixed-point optimization."  
  *Soft Spot:* Hard for EU-purists to accept non-persistent goals. Doesn't eliminate *all* exploitation potential.

  **High Damage: Goodhart on Approval**  
  *Likely Asker:* RL or Agent-Foundations  
  *Phrasing:* "Approval is just another proxy objective. You get an agent super good at getting high approval scores according to the predictor, which will inevitably diverge from the 'true' underlying values we want, especially under optimization pressure. Same old Goodhart!"  
  *Reply (Concede/Hold):* "Absolutely conceded: Approval *is* a proxy. The critical difference is *adaptability*. When the predictor (and thus the proxy) drifts as the overseer learns, the agent follows. A fixed-goal agent Goodharts its *static* proxy forever. An approval agent might Goodhart the *current* proxy, but when the overseer sees the bad outcome and updates their model/criteria (changing the proxy), the agent pivots. It trades persistent Goodhart divergence for potentially recoverable myopic Goodharting. The moving target enables correction."  
  *Soft Spot:* Requires overseer to *notice* and *correctly update* based on Goodharting outcomes fast enough. Doesn't eliminate Goodhart, changes its nature.

  **Medium Damage: Just Online Reward Modeling (RLHF++)**  
  *Likely Asker:* RL Folks (practical)  
  *Phrasing:* "This sounds like you're doing RLHF, but instead of freezing the reward model after training, you keep it updating online based on human feedback. Isn't this just RL with a really active, online reward modeler? How is this a *different paradigm*?"  
  *Reply (Hold Line/Reframe):* "Crucially, the agent *isn't* being trained via RL against the approval signal to develop its *own* internal objective. It uses the approval predictor *directly* as its decision mechanism *at runtime*, every timestep. There's no inner optimizer being shaped towards a fixed goal. Think 'Imitating Current Best Judgment' at every step, not 'Optimizing for a Reward Function Learned from Past Judgments'. The online update means the agent *never converges* to a fixed policy based on past data; it constantly re-queries the moving target. This disrupts the formation of stable, convergent instrumental goals."  
  *Soft Spot:* Implementation might *look* very similar to advanced online RLHF. Distinction between "using a model as policy" vs "training a policy against a model" is subtle.

  **Medium Damage: Performance & Competitiveness Sacrifice**  
  *Likely Asker:* RL Folks (pragmatic)  
  *Phrasing:* "Constantly re-querying a drifting approval target sounds insanely inefficient and slow compared to a fine-tuned agent with a stable objective. Won't this just get outcompeted by 'dumb' goal-directed agents?"  
  *Reply (Concede/Hold):* "Likely conceded on raw efficiency, especially initially. Safety often costs performance. The tradeoff is intentional: We sacrifice persistent, directed optimization power for corrigibility and reduced catastrophic risk from misgeneralization or goal rigidity. For high-stakes applications, this tradeoff is essential. Furthermore, the approval predictor itself can become highly efficient at prediction, mitigating some overhead."  
  *Soft Spot:* Hard sell in performance-centric environments. Needs compelling safety demos.

  **Medium Damage: How Do You Handle Conflicting/Mistaken Approval?**  
  *Likely Asker:* Agent-Foundations or RL  
  *Phrasing:* "What if the overseer approves something dumb or harmful in the moment? Or if different parts of the overseer system conflict? Doesn't the agent just blindly follow bad instructions?"  
  *Reply (Concede):* "Conceded: Garbage in, garbage out. The agent is corrigible *to the overseer*, not magically aligned to truth/justice. This highlights the critical role of the overseer: It needs safeguards (multiple reviewers, uncertainty estimation, reversible actions, human override). The *agent* property is following the overseer *flexibly*, even when they change their mind or make mistakes, allowing *them* to correct it. A fixed-goal agent would resist correction *even if* the overseer realizes the goal is wrong."  
  *Soft Spot:* Puts immense pressure on overseer design. Feels unsatisfying.

  **Lower Damage: Isn't Drift Itself Dangerous?**  
  *Likely Asker:* Agent-Foundations (worried about chaotic dynamics)  
  *Phrasing:* "Unpredictable drift in the approval function sounds chaotic. How do you ensure stability or avoid the agent thrashing wildly as the overseer's opinions change?"  
  *Reply (Hold Line):* "Stability isn't the primary goal; corrigibility is. Some 'thrashing' might be the cost of corrections. However, we can build in inertia: Use approval prediction ensembles, moving averages, or uncertainty thresholds to smooth updates. Crucially, the drift reflects the *overseer's* learning, which we hope is more stable/controlled than the unpredictable misgeneralization of a fixed-goal agent. The agent itself isn't introducing new instability; it's responding to the overseer's."  
  *Soft Spot:* Smoothing mechanisms might blunt the desired responsiveness/corrigibility.

  **Key Concessions:** Approval is a proxy (Goodhart risk). Requires a safer overseer (Regress). Less efficient. Vulnerable to manipulative steering of the overseer's state (Nightmare Objection).  
  **Hold The Line On:** Moving target prevents stable convergent goals & enables corrigibility in ways fixed goals can't. Distinction from RLHF (online evaluation vs training). Non-EU-maximization is a feature for safety, not a bug. The core safety property comes from the *instability* of the target.
