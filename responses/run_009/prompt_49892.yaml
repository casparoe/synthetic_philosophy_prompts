prompt: |-
  My housemate has strong opinions about when you can take someone's word about how good something is, and I'm trying to work out what her actual rule is. Her track record: she'll repeat as plain fact that a wine is over-oaked and flabby on our friend the sommelier's say-so; she happily books restaurants off reviews; she says she knows a film is worth seeing because a friend loved it; but she flat out refuses to call a novel beautifully written until she's read it herself, even when its her most trusted reader telling her; and she insists a critic can know that a building is elegant while she can't know that just from reading the critic. Oh, and she'll happily tell people a certain stand-up show was hilarious based purely on a friend's account of it. Tomorrow she's deciding on a concert — a friend whose taste in music matches hers exactly says the symphony on the programme is sublime. What's she going to say: can she know it's sublime before hearing it, or only that it's worth hearing? Honestly I care less about the answer than about the candidate rules that fit her record — acquaintance required for art but not for food or humour? testimony fine for "thick" descriptive terms but not evaluative ones? testimony fine whenever the teller's tastes track hers? — what each rule predicts for the symphony, your best guess, and which further case would best split the rules apart (say, the same friend vouching that a perfume is beautiful, or a total stranger whose ratings happen to match hers perfectly). Answer in British English please.
reasoning: |-
  Okay, the user's housemate has some specific rules about when she'll take someone's word about how good something is. Let me start by listing out her track record to identify patterns. 

  First, she accepts the sommelier's opinion on wine, books restaurants based on reviews, trusts a friend's movie recommendation, and shares a friend's view on a stand-up show being hilarious without experiencing them herself. But she won't call a novel beautifully written based on a trusted reader's opinion and insists that a critic can know a building is elegant while she can't without seeing it herself. 

  The key differences here are the types of experiences and the terms used. Wine, restaurants, movies, and comedy are all about enjoyment or direct experience terms like "hilarious" or "worth seeing." But for the novel, the term is "beautifully written," which is more about artistic merit, and for the building, "elegant" is an aesthetic judgment she feels she must witness. 

  So maybe the rule isn't about the type of media but the kind of judgment. Thick descriptive terms like "over-oaked" (wine) or "hilarious" (comedy) combine description and evaluation, which she accepts from trusted sources. Pure evaluative terms like "beautifully written" or "elegant" require personal experience. 

  For the symphony case, the friend uses "sublime," which is a thick term. If the rule is about accepting thick descriptions from trusted sources, she should accept it. But if it's about requiring personal experience for art, she might not. Since music is an art form, but she accepted movie recommendations, which are also art, maybe art isn't the dividing factor. 

  The trusted source's taste matching hers is consistent across all cases she accepts. But even with a trusted reader, she won't call the novel beautiful without reading it. So trust isn't enough for certain judgments. 

  The symphony being called "sublime" by a friend with matching taste should be acceptable if thick terms from trusted sources are allowed. "Sublime" is thick, so she'd likely say she can know it's sublime. 

  To test further, a perfume described as "beautiful" by the same friend. "Beautiful" is evaluative, not thick. If she rejects this, it confirms that thick vs. evaluative terms matter. A stranger with matching taste: if she accepts their word, then trust isn't key; if not, trust is essential. But in the novel case, even trusted sources aren't enough for certain judgments, so trust alone isn't sufficient. 

  The perfume case with "beautiful" would split the rules. If she accepts it, the rule might be about the type of experience. If she rejects, it's about the term used. Since she rejected "beautifully written" for the novel, likely she'd reject "beautiful" for perfume, supporting the thick vs. evaluative distinction.
answer: |-
  Right, let's crack this. Your housemate's rules are fascinatingly inconsistent at first glance, but a pattern emerges when we look closely at the *type* of judgment being made and *who* is making it. Here's a breakdown of candidate rules, predictions for the symphony, and the best test case:

  1.  **Candidate Rule: Trusted Testimony is Fine for "Thick" Descriptive-Evaluative Terms but Not for Pure Evaluative Judgements**
      *   **Explanation:** Philosophers distinguish "thick" terms (like 'over-oaked', 'flabby', 'hilarious', 'elegant') which combine factual description with evaluation, from "thin" evaluative terms (like 'good', 'beautiful', 'sublime' in some contexts) which are primarily about value.
      *   **Fits Record:**
          *   Accepts "over-oaked", "flabby" (sommelier - thick description).
          *   Accepts restaurant reviews (likely containing thick descriptions like "vibrant atmosphere", "perfectly cooked").
          *   Accepts "worth seeing" (a recommendation/thin term *for action*, not a pure aesthetic claim).
          *   Accepts "hilarious" (friend - thick description of effect).
          *   Accepts that a critic *can know* a building is "elegant" (thick term - recognises expert judgement).
          *   Rejects "beautifully written" (pure evaluation) even from trusted reader.
          *   Rejects *her own* ability to know a building is "elegant" (thick term) *without personal experience* (she needs the experience to apply the thick term herself).
      *   **Prediction for Symphony (friend: "sublime"):** She **CAN** know it's sublime *before* hearing it. Why? "Sublime" is a classic thick aesthetic term (implying grandeur, awe-inspiring, transcendent quality). Her trusted friend, whose taste matches hers, is making a thick evaluative claim she accepts testimony for.
      *   **Best Splitting Case:** **The Same Friend Vouching a Perfume is "Beautiful".**
          *   *Prediction for this Rule:* She **CANNOT** know the perfume is beautiful before smelling it. "Beautiful" here is likely being used as a pure evaluative term, akin to "beautifully written". She'd need the personal sensory experience to judge that specific aesthetic quality herself, even from a trusted source.

  2.  **Candidate Rule: Trusted Testimony is Fine for Judgements About Enjoyment/Experience, but Not for Inherent Aesthetic Quality**
      *   **Explanation:** She accepts testimony telling her something will be enjoyable, fun, worth experiencing, or describing specific experiential qualities ('flabby', 'hilarious'). She rejects testimony making claims about the inherent aesthetic *merit* or *beauty* of an object ("beautifully written", "elegant" for her).
      *   **Fits Record:**
          *   Accepts "over-oaked", "flabby" (experience descriptions), "worth seeing" (enjoyment/action), "hilarious" (experience/effect).
          *   Rejects "beautifully written" (inherent aesthetic quality).
          *   The building case: She accepts the critic *can* judge inherent aesthetic quality ("elegant") *as an expert*, but she cannot base *her own* inherent aesthetic judgement ("elegant") on testimony – she needs the experience to form *that specific type* of judgement.
      *   **Prediction for Symphony (friend: "sublime"):** **She CANNOT** know it's sublime before hearing it. Why? "Sublime" is a strong claim about inherent aesthetic quality and merit, not just that it's enjoyable or worth experiencing ("worth hearing"). While the friend might convince her it's *worth hearing*, claiming it's "sublime" requires her own aesthetic encounter.
      *   **Best Splitting Case:** **The Same Friend Vouching that a Perfume is "Beautiful".**
          *   *Prediction for this Rule:* She **CANNOT** know it's beautiful before smelling it. "Beautiful" is a claim about inherent aesthetic quality.

  3.  **Candidate Rule: Trusted Testimony is Fine When the Teller's Tastes Reliably Track Hers (Especially Across Domains)**
      *   **Explanation:** The key is the proven alignment of taste with the specific recommender, not necessarily the *type* of thing or judgement.
      *   **Fits Record:**
          *   Accepts sommelier *friend* on wine (known taste alignment).
          *   Accepts *friend* on film ("loved it" -> "worth seeing").
          *   Accepts *friend* on stand-up ("hilarious").
          *   Rejects *trusted reader* on novel ("beautifully written") - perhaps taste alignment isn't proven *for that specific type of judgement* (literary merit) even if they are trusted generally? Or this is the exception.
          *   The building critic case is tricky: she doesn't *personally* know if the critic's taste in architecture tracks hers, hence she can't rely on their testimony for *her* judgement of "elegant".
      *   **Prediction for Symphony (friend: "sublime"):** She **CAN** know it's sublime before hearing it. Why? Explicitly states the friend's taste "matches hers exactly" and it's the same domain (music). This is the strongest possible alignment.
      *   **Best Splitting Case:** **A Total Stranger Whose Past Music Ratings Perfectly Match Hers Vouching the Symphony is "Sublime".**
          *   *Prediction for this Rule:* She **CAN** know it's sublime before hearing it. The objective data shows perfect taste alignment, making the stranger functionally equivalent to the trusted friend for this prediction.
          *   *Contrast with Other Rules:* Rule 1 & 2 would likely predict she **CANNOT** know it's sublime based on a stranger, regardless of data, as they require either the thick term *plus* trust (Rule 1) or inherently reject testimony for aesthetic quality (Rule 2).

  **Analysis & Best Guess:**

  *   **The Novel & Building Cases are Key:** Her refusal on "beautifully written" and "elegant" (for herself) strongly suggests a barrier for testimony about *pure or inherent aesthetic quality*, even from trusted sources. This makes Rule 2 (Experience vs. Inherent Quality) compelling.
  *   **"Sublime" is Pivotal:** Is "sublime" more like "hilarious" (a thick, experiential effect) or "beautifully written" (a pure aesthetic merit claim)? It leans heavily towards the latter. While thick, it's a profound claim about inherent artistic greatness.
  *   **Trust Matters, But Isn't Sufficient:** Rule 3 fits much of the data *except* the novel case. A trusted reader *should* be acceptable under Rule 3, but she rejects them for "beautifully written". This suggests trust + domain alignment is *necessary* for her to accept testimony *where she accepts testimony at all*, but there are whole categories (inherent aesthetic quality judgements) where she simply doesn't accept testimony, regardless of trust (Rule 2) or only accepts thick descriptions (Rule 1).

  **Best Guess for the Symphony:** Based on the weight of the "beautifully written" and "elegant" rejections, **she will say she CANNOT know it's sublime before hearing it, only that it's worth hearing.** "Sublime" falls firmly into the category of inherent aesthetic quality she needs to experience directly to affirm, like the novel's beauty or the building's elegance. The friend's matching taste gets her to the concert hall, but she reserves judgement on its sublimity until she hears it herself. **(Leaning strongly towards Rule 2).**

  **Best Splitting Case:** **The Same Friend Vouching a Perfume is "Beautiful".** This directly parallels the "beautifully written" novel case in a different artistic/sensory domain.
  *   If she **rejects** knowing it's beautiful (only that it's worth trying), it strongly supports **Rule 2 (Experience vs. Inherent Quality)** or **Rule 1 (Thick vs. Thin Terms)**.
  *   If she **accepts** she can know it's beautiful, it supports **Rule 3 (Taste Tracking)** and contradicts the pattern set by the novel rejection.

  **The stranger test case is also excellent for distinguishing Rule 3 from the others.** If she accepts the stranger's "sublime" based on data, Rule 3 wins. If she rejects it, Rules 1 or 2 are more likely, depending on her reaction to the perfume case.

  Blimey, your housemate's got a proper philosophical framework brewing there! The perfume case tomorrow should be very telling. Good luck!
