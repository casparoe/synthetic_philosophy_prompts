  - Symmetry issue: The same argument applies after switching, suggesting you should switch back. But that cannot be.
  - Diagnosis: The fallacy lies in the improper assignment of probabilities. The value of X is not fixed independently of which envelope you have. The two possibilities (that the other envelope is 2X or X/2) are not equally likely for every X, especially if there is a prior distribution over the possible amounts in the envelopes. The calculation above assumes that no matter what X is, the two possibilities are equally likely, but that may not be the case.

  **St. Petersburg Paradox (SPP):**
