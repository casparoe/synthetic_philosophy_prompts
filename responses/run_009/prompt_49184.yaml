prompt: |-
  Before my reading group argues about which theory of objective chance is right, I want us to have in hand the specification any such theory must meet, since adequacy here is relative to a job description. Fix the purpose as follows: a theory of chance is adequate if it can vindicate deference — if it explains why an agent who learns, of an event A, that its objective chance is x, and nothing else relevant, should set her credence in A to x — while still treating chance as a feature of the world rather than of our ignorance of it. Write the desiderata list, with the case or consideration behind each requirement, and mark each as either non-negotiable or a camp preference smuggled in as a demand.

  The cases the list must confront should include, at minimum: the crystal ball, where the agent gets evidence about tomorrow's outcome that is not itself a chance assignment, and the theory must say whether such evidence counts as admissible and why the deference principle appears to break when it does; undermining, where evidence about the global pattern of events seems to threaten the very chance facts that the pattern would ground; chances under determinism, as in a statistical-mechanical world where nothing at the fundamental level is chancy; the chance of an event that has already happened; the mixture case, where the agent knows the chance of A is either x or y without knowing which, so that the theory must say whether deference commutes with averaging rather than merely assuming it; and the possibility of imprecise objective probabilities, where the world itself fixes only an interval.

  Then flag which pairs or triples of desiderata you suspect cannot be jointly satisfied — I take it the deepest result in this literature is that some trio of deference, supervenience of chance on the total history of occurrent fact, and a natural restriction on admissible evidence is inconsistent, and I would like to see that made precise — and say which single requirement does the most work in excluding candidates. Finally, score the best-system analysis, single-case propensities, and hypothetical frequentism briefly against the list; the group will argue out the rest.
reasoning: |-
  Okay, let me tackle this user's query. They want a clear set of desiderata for theories of objective chance, specifically to resolve debates in their reading group. The main goal is to ensure that any theory can explain why we should defer to chances when setting credences, without reducing chance to mere ignorance. 

  First, I need to list all the cases they mentioned: crystal ball, undermining, determinism, past events, mixtures, and imprecise chances. Each desideratum must address one of these. The user also wants to highlight conflicts between desiderata, especially the known inconsistency involving deference, supervenience, and admissibility. 

  Starting with the non-negotiables. Deference (D1) is crucial because it's the core purpose. Supervenience (D2) ensures chances are worldly. Admissibility (D3) handles the crystal ball case. Undermining (D4) is tricky but necessary for global patterns. Determinism (D5) allows chances in deterministic worlds. Past events (D6) need non-trivial chances. Commutativity with mixing (D7) deals with averaging. Imprecise chances (D8) address intervals. 

  Now, the conflicts. The big one is D1, D2, and D3 leading to inconsistency, as per Lewis's result. If chances supervene locally, future evidence might be inadmissible, but undermining forces global supervenience, causing issues. D5 (determinism) also causes tension with D1 since deterministic chances might be zero or one, making deference trivial. 

  Next, scoring the theories. Best-system analysis (BSA) does well on D2, D4, D5, D6, D8 but struggles with D3 (admissibility clarity) and D7 (commutativity). Single-case propensities handle D1 and D3 but fail D2, D4 (undermining), D5 (determinism), and D8. Hypothetical frequentism has trouble with D1 (undermining), D4, D5, D6 (past events), and D7. 

  The user's deeper needs: they want a structured framework to compare theories objectively, avoiding circular arguments. Highlighting conflicts helps them understand why no theory satisfies all desiderata. Emphasizing D1 (deference) as the key differentiator makes sense since it's the primary function. They might also need clarity on why certain trade-offs are necessary, especially in discussions about determinism or past events. 

  I should ensure each desideratum is clearly tied to a case. For example, D3 admissibility links to the crystal ball. Mentioning that D1 alone rules out some theories quickly. Also, clarifying that BSA is currently the most viable despite its flaws. The user's group might lean towards BSA but needs to acknowledge its weaknesses in admissibility and commutativity. 

  Finally, summarizing the major tension points helps the group focus their debate. Stressing that no theory is perfect, but BSA balances most desiderata better than others. The user's mention of "camp preferences" suggests they want to identify hidden biases in desiderata, like insisting on non-trivial deterministic chances (D5) might exclude some theories unfairly.
answer: |-
  Here is a comprehensive desiderata list for a theory of objective chance, structured for your reading group debate, incorporating your specified cases and analysis requirements:

  ---

  ### **Core Non-Negotiables** (Essential for Adequacy)
  1.  **Deference (D1):**  
      - **Case:** Learning *only* that *Ch(A) = x* should compel rational credence *Cr(A) = x*.  
      - **Why?** Vindicates the Principal Principle (PP) as the core job of chance. Failure here voids the theory's purpose.  
      - **Status:** Non-negotiable.

  2.  **Worldly Supervenience (D2):**  
      - **Case:** Chances must be fixed by the *total physical history* (or fundamental ontology) of the world, not epistemic states.  
      - **Why?** Ensures chance is "objective" (a feature of the world, not ignorance).  
      - **Status:** Non-negotiable.

  3.  **Admissibility Constraint (D3):**  
      - **Case:** The Crystal Ball. Evidence about *A* itself (e.g., seeing tomorrow's outcome) must be inadmissible, explaining why *Ch(A)=x* no longer commands *Cr(A)=x*.  
      - **Why?** Without this, deference is absurd when outcome information exists. Requires a principled distinction between admissible/inadmissible evidence.  
      - **Status:** Non-negotiable (for a viable PP).

  4.  **Undermining Resilience (D4):**  
      - **Case:** Evidence about the *global* future state (e.g., "all coins land heads") must not logically contradict *Ch(A)=x* assigned by the theory itself.  
      - **Why?** If the theory's own chances are undermined by possible futures they authorize, deference becomes incoherent or trivial.  
      - **Status:** Non-negotiable (prevents self-refutation).

  ---

  ### **Contentious Desiderata** (Often Camp Preferences)
  5.  **Non-Trivial Deterministic Chance (D5):**  
      - **Case:** Statistical mechanics (e.g., a gas's entropy increase in a Newtonian world).  
      - **Why?** Many want chances in deterministic worlds (for explanation/prediction). Others insist chance requires indeterminism.  
      - **Status:** Camp preference (Anti-Humean vs. Humean camps).

  6.  **Past Chance Objectivity (D6):**  
      - **Case:** The chance of a *past* event (e.g., "What was *Ch*(coin landed heads) *before* it was flipped?").  
      - **Why?** Should the theory assign a non-trivial chance (*0 < x < 1*) to past events pre-outcome? Or is past chance always 0/1?  
      - **Status:** Camp preference (Tied to temporal asymmetry views).

  7.  **Commutativity with Mixing (D7):**  
      - **Case:** The Mixture. If the agent knows *Ch(A)* is *either x or y* (but not which), should their credence be the average (*(x+y)/2*)?  
      - **Why?** Commutativity (*Cr(A) = E[Ch(A)]*) is intuitive for decision-making but may conflict with D1 or D2.  
      - **Status:** Camp preference (Practical rationality vs. strict objectivity).

  8.  **Imprecise Chance (D8):**  
      - **Case:** The world fixes only that *Ch(A) ∈ [x, y]*.  
      - **Why?** Some argue genuine indeterminism or complex systems yield intervals. Others demand precise chances.  
      - **Status:** Camp preference (Modeling flexibility vs. precision demands).

  ---

  ### **Inconsistency Results & Key Excluders**
  *   **The Inconsistent Trio:** **D1 (Deference) + D2 (Supervenience) + D3 (Admissibility)** is incompatible under natural assumptions (Lewis's "Big Bad Bug").  
      - **Why?** D2 (global supervenience) + D3 (only past/occurrent facts admissible) + D4 (undermining resilience) create tension. If chance supervenes *globally* (including the future), then information about the *future* can be *inadmissible* evidence *about chance itself* (via D2). But D3 typically restricts admissibility to the *past*. This makes deference in the face of undermining evidence incoherent.  
      - **Resolution Attempts:** Theories must weaken one:  
          - Humeans (BSA): Reject strict D3 → allow some future info as admissible *if about the pattern*.  
          - Propensitists: Reject strong D2 → chances are local causal powers, not globally supervening.  
          - Some Frequentists: Reject D1 → deny full deference in undermining cases.

  *   **Most Excluding Requirement:**  
      **D1 (Deference)** is the ultimate excluder. Many theories (naive frequentism, some propensity views) fail because they cannot ground rational deference without contradiction. If a theory can't satisfy D1 in standard cases, it's dead on arrival.

  ---

  ### **Theory Scoring**
  *(✔️ = Satisfies, ❌ = Fails, ~ = Partially/Controversially Satisfies)*

  | Desideratum          | Best-System Analysis (BSA) | Single-Case Propensity | Hypothetical Frequentism |
  | :------------------- | :------------------------- | :--------------------- | :----------------------- |
  | **D1: Deference**    | ~ (See D4)                 | ✔️                     | ❌ (Undermining fatal)   |
  | **D2: Supervenience**| ✔️ (Humean base)           | ❌ (Often non-Humean)  | ✔️                       |
  | **D3: Admissibility**| ~ (Pattern-based, complex) | ✔️ (Local causes)      | ~                        |
  | **D4: Undermining**  | ❌ (Major problem)          | ✔️                     | ❌                       |
  | **D5: Determ. Chance**| ✔️                          | ❌                     | ~ (Limiting only?)       |
  | **D6: Past Chance**  | ✔️                          | ~ (Degenerates?)       | ❌ (Past fixed)          |
  | **D7: Commutativity**| ❌ (No clear expectation)   | ~                      | ❌                       |
  | **D8: Imprecise**    | ✔️ (Can be modeled)         | ~                      | ❌                       |

  **Analysis:**
  1.  **BSA (Lewis, Loewer):** Strongest on D2, D5, D6, D8. **Fatal flaw:** D4 (Undermining). Deference (D1) is threatened unless admissibility (D3) is radically reinterpreted (e.g., "no undermining futures" as inadmissible). Struggles with D7.
  2.  **Single-Case Propensity (Popper, Mellor):** Excels at D1, D3, D4. **Fatal flaw:** D2 (Worldly Supervenience) - often seen as metaphysically obscure or non-supervening. Fails D5 (determinism) and often D6. D8 is awkward.
  3.  **Hypothetical Frequentism (von Mises):** Strong D2. **Fatal flaws:** D1 (crumbles under undermining), D4 (self-undermining), D6 (past chance undefined/non-objective). Fails D5, D7, D8.

  ---

  ### **Conclusion for Your Group**
  *   **The Core Tension:** The **D1+D2+D3+D4** cluster is the battleground. BSA sacrifices straightforward D3/D4 to save D1+D2. Propensity sacrifices D2 to save D1+D3+D4. Frequentism typically sacrifices D1/D4.
  *   **Key Debate Questions:**  
      1.  Is *global supervenience* (D2) non-negotiable for objectivity, or can chance be *local*? (Propensity vs. Humeanism)  
      2.  Can admissibility (D3) be defined non-circularly *without* presupposing chance? (BSA's biggest challenge)  
      3.  Is *non-trivial deterministic chance* (D5) essential or a category error?  
      4.  How damaging *is* undermining (D4)? Can a revised PP (e.g., New Principle) save BSA?  
  *   **Recommendation:** Ground the debate in **whether D4 (Undermining Resilience) is truly non-negotiable**. If yes, BSA is in deep trouble. If D4 can be finessed via revised deference (e.g., New Principle: *Cr(A | H_t T_w) = Ch_T_w(A | H_t)* where *T_w* is the "true theory"), BSA becomes the frontrunner despite metaphysical qualms. Propensity remains viable only if D2 is relaxed.

  This framework forces clarity: disagreements often stem from which desiderata are prioritized as non-negotiable versus which are compromised. BSA currently dominates *despite* its flaws because it best navigates the inconsistent trio by redefining admissibility. Good luck!
