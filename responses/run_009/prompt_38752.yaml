prompt: |-
  My department has this writing-partship program where two people who've been arguing past each other for a year co-author one document instead of trading papers, and this year it's me and a colleague on consent. I'm on team "yes means yes": if someone competent, informed *in the moment*, and unpressured says yes, that's valid consent — deception and manipulation make the act wrong, or add separate wrongs, but they don't reach back and unmake the consent itself. She's on team "conditions": consent only does its transformative work when it's given under decent decision conditions, so deceit and wrongful pressure don't just stack wrongs on top, they void the yes. Draft the joint statement we could both actually sign: a numbered agreed-claims section (we do agree on some things — that consent is normatively transformative when valid, that coercion and deception are paradigms of wronging, that mere regret doesn't retroactively invalidate), then the residual disagreements stated in wording each of us would accept for our own side, then the cruxes. I suspect one crux is the but-for test — consent is flawed when, and only when, the person would have refused but for the flaw — and whether it survives cases where the deception "insulates" the choice (she'd have accepted the fallback option she'd have preferred anyway) or where the lie concerns something she had no right to be told. Another is offers vs. threats: is the baseline for coercion what you were entitled to, or what you would factually have had absent the offer? A third is whether competence is a fixed threshold or scales with the stakes — a mild impairment that leaves someone fine for everyday choices but shaky about a genuinely risky one. For each crux, name a concrete case or test both of us would agree bears on it, and write down each side's prediction in advance. End with a section flagging which parts of our dispute are just verbal and which are real. No mushy "both sides have a point" filler — if we genuinely can't agree on a formulation, say so.
reasoning: |-
  Okay, let me approach this systematically. The user is describing a complex philosophical and legal debate about consent between two academic colleagues with opposing views. They need a structured joint statement that clarifies both agreements and disagreements without compromising either position.

  First, I consider the core conflict: "yes means yes" versus "conditions" theories of consent. The former sees consent as valid if given in the moment without pressure, while the latter requires adequate decision-making conditions. The user specifically wants three sections: agreed claims, residual disagreements, and cruxes with test cases.

  For the agreed claims section, I identify common ground from their description: consent's transformative power when valid, coercion/deception as paradigm wrongs, and regret not invalidating consent. These form a solid foundation.

  The disagreements section needs careful phrasing. For "yes means yes," I emphasize contemporaneous competence and absence of pressure. For "conditions," I focus on epistemic and volitional adequacy. The wording avoids strawmanning while preserving each position's integrity.

  Three cruxes require special attention:
  1) The but-for test's applicability to deception cases where the deceived party might have consented anyway. The "insulated deception" case (lying about minor details of a known action) tests this.
  2) Coercion baselines - entitlement versus factual expectations. The "job offer with undisclosed relocation" scenario highlights this divergence.
  3) Competence thresholds - fixed versus scaled. The "medication-induced impairment for high-risk decision" case reveals their differing standards.

  For each crux, I formulate concrete predictions showing how each theory would resolve the case, making the disagreement operational rather than abstract.

  Finally, the verbal/real distinctions section clarifies that their debate isn't about core values but about: 1) whether consent's validity depends solely on agent-state or also on external conditions, 2) whether wrongfulness stems from consent-invalidity or separate wrongs, and 3) the definition of "undue pressure."

  The structure maintains rigor by avoiding compromise positions, instead mapping the precise coordinates of disagreement. This serves their goal of productive scholarly engagement rather than forced consensus.
answer: |-
  Here’s a draft joint statement adhering strictly to your requirements: no filler, clear agreements, explicit disagreements with acceptable wording, testable cruxes, and a taxonomy of verbal vs. real disputes.

  ---

  ### Joint Statement on Consent: Agreed Foundations & Unresolved Disputes  
  **Authors:** [Your Name] & [Colleague's Name]  
  **Date:** [Date]  

  #### I. Agreed Claims (Uncontested Foundations)
  1.  **Normative Transformation:** Valid consent transforms the moral/legal permissibility of an act. An act requiring consent is impermissible without it and (typically) permissible with it.
  2.  **Paradigmatic Wrongs:** Coercion (wrongful threats) and deception (intentional falsehoods/material omissions) are core, independent wrongs that vitiate the moral quality of an interaction.
  3.  **Regret ≠ Invalidity:** Mere subsequent regret, changed feelings, or discovery of unfavorable consequences *alone* does not retroactively invalidate consent that was valid when given.
  4.  **Competence Requirement:** Valid consent requires the agent to possess sufficient cognitive capacity (understanding, reasoning) relative to the nature of the act.
  5.  **Voluntariness Requirement:** Valid consent requires the absence of wrongful, controlling constraints on the agent's choice.

  #### II. Residual Disagreements (Stated in Mutually Acceptable Terms)
  *   **Disagreement 1 (Validity Conditions):**  
      *   **Signatory A ("Yes Means Yes"):** "Consent is valid if, *at the moment of agreement*, the agent (a) possesses threshold competence, (b) intends to consent to the act in question, (c) is not subject to incapacitating pressure, and (d) is not acting on a *presently operative* fundamental mistake *about the nature of the act itself* (e.g., identity, core physical act). Wrongs like deception or manipulation concerning *collateral matters* (motives, consequences, context) or *undue pressure* (non-threat offers, emotional pressure) may render the act wrongful overall but do not negate the consent's validity as a transformative act."  
      *   **Signatory B ("Conditions"):** "Consent is valid *only if* it is given under conditions that are *epistemically and volitionally adequate* for the specific decision. Deception (even concerning collateral matters) or wrongful pressure (including non-threat offers exploiting vulnerability) that *materially induces* the consent, or impairments that render the agent insufficiently competent *for that specific act*, void the consent itself. Validity depends on the quality of the decision-making process, not just the agent's internal state at the moment of utterance."

  *   **Disagreement 2 (The "But-For" Test):**  
      *   **Signatory A ("Yes Means Yes"):** "A flaw (deception, pressure) invalidates consent *only if* the agent would have refused *but for* that specific flaw."  
      *   **Signatory B ("Conditions"):** "The 'but-for' test is necessary but *not sufficient*. Consent can be invalid even if the agent would have consented anyway, if the flaw demonstrates the decision conditions were fundamentally inadequate (e.g., lack of relevant knowledge or wrongful external control)."

  *   **Disagreement 3 (Baseline for Coercion/Undue Inducement):**  
      *   **Signatory A ("Yes Means Yes"):** "A proposal constitutes wrongful pressure/coercion *only if* it involves a *threat* to make the recipient worse off relative to their *entitlement baseline* (what they are owed/morally entitled to). Merely offering a benefit (even an 'exploitative' one) that makes the recipient better off than their entitlement baseline, or better off than they *factually* would be without the offer, does not constitute coercion rendering consent involuntary."  
      *   **Signatory B ("Conditions"):** "Wrongful pressure/coercion can occur via *exploitative offers* that leverage unjust vulnerability or desperation, making the recipient's choice non-autonomous relative to their *factual baseline* (the situation they would *factually* be in absent the proposal). The relevant baseline is contextual and normative, not solely entitlement-based."

  *   **Disagreement 4 (Competence Threshold):**  
      *   **Signatory A ("Yes Means Yes"):** "Competence is a reasonably *fixed threshold* capacity (understood, e.g., as the ability to understand relevant information, appreciate consequences, and reason consistently). Provided this threshold is met for an agent, consent is competent regardless of the act's specific stakes or complexity."  
      *   **Signatory B ("Conditions"):** "The *level* of competence required scales with the *stakes and complexity* of the decision. An impairment or vulnerability that leaves someone competent for low-stakes decisions may render them incompetent for high-stakes or complex decisions requiring greater understanding or reasoning capacity. Competence is decision-relative."

  #### III. Cruxes & Test Cases (Predictions)
  1.  **Crux: But-For Test & "Insulated" Deception/Collateral Lies**  
      *   **Case:** *The Insulated Lie:* Pat consents to sex with Alex. Alex lies about having a PhD, knowing Pat strongly prefers partners with PhDs. Unbeknownst to Alex, Pat would have consented *anyway* because they find Alex exceptionally attractive. Assume Pat was competent, unpressured, and understood the core nature of the act.  
      *   **Prediction A:** Consent is *valid*. The lie was material & wrongful, but Pat *would have consented anyway*. The wrong is separate (deception), but consent stands.  
      *   **Prediction B:** Consent is *invalid*. The decision was induced under materially false pretenses concerning a significant motivating factor, rendering the consent epistemically defective regardless of the counterfactual.

  2.  **Crux: Offers vs. Threats - The Entitlement vs. Factual Baseline**  
      *   **Case:** *The Desperate Job Offer:* Taylor is homeless and starving. Jordan offers Taylor a job doing hazardous work for $1/hour, knowing it's far below market rate and exploiting Taylor's desperation. Taylor accepts. Assume Taylor is competent and understands the terms. Was Jordan entitled to offer nothing?  
      *   **Prediction A:** Consent is *valid*. Jordan made Taylor better off than their entitlement baseline (Jordan owed Taylor nothing). While exploitative and wrong, this is not coercion. Wrongfulness stems from exploitation/unfairness, not consent invalidity.  
      *   **Prediction B:** Consent is *invalid*. The offer leverages Taylor's unjust, desperate circumstances, creating wrongful pressure relative to their *factual baseline*. Taylor's choice lacks meaningful autonomy.

  3.  **Crux: Competence Threshold - Fixed or Scaled?**  
      *   **Case:** *The Medication & High-Stakes Loan:* Sam has a stable job and mild cognitive impairment due to prescribed medication. Sam reliably manages daily finances (groceries, bills). Sam is offered a complex, high-interest loan with severe penalties for default, involving intricate terms. Sam consents after a brief explanation they appear to follow. Would Sam have consented absent the impairment? Unknown.  
      *   **Prediction A:** If Sam meets the fixed threshold for understanding the *core transaction* (borrowing money, interest, repayment obligation), consent is *valid*, even if the impairment might have hindered full understanding of complex clauses.  
      *   **Prediction B:** The *stakes and complexity* require a *higher level* of competence than Sam possesses due to their impairment. Consent is *invalid* because Sam was insufficiently competent *for this specific high-stakes, complex decision*.

  #### IV. Verbal vs. Real Disagreements
  *   **Primarily Verbal Disagreements:**  
      *   **Scope of "The Act":** Some disagreement may hinge on what constitutes "the nature of the act itself" (A) vs. "collateral matters" (A) or "materially inducing factors" (B). This is partly definitional.  
      *   **"Invalid" vs. "Wrongful but Consensual":** Whether a wrong *voids consent* (B) or *attaches to a consensual act* (A) is partially a terminological choice about how to map moral concepts to the word "invalid."  
      *   **"Voluntariness" Scope:** Whether "voluntariness" only excludes threats (A) or also includes vulnerability to exploitative offers (B) involves differing definitions of the term's boundaries.
  *   **Real (Substantive) Disagreements:**  
      1.  **The Moral Foundation of Transformation:** Does consent's transformative power derive *solely* from the agent's *internal state* at t (A), or does it *also* depend on the *external conditions* under which that state was formed (B)?  
      2.  **The Source of Wrongfulness in Deception/Pressure:** Does the wrong of deception/pressure primarily lie in *invalidating consent* (B), or in *wronging the agent independently* (e.g., violating autonomy/dignity) *even if consent remains valid* (A)?  
      3.  **The Role of Counterfactuals:** Is the *but-for* test the ultimate determinant of consent's validity regarding flaws (A), or merely one indicator among others concerning decision quality (B)?  
      4.  **The Nature of Autonomy:** Does autonomy require only non-subjection to *controlling threats* (A), or also protection from *exploitative leveraging of vulnerability* even via beneficial offers (B)?  
      5.  **The Structure of Competence:** Is competence a *general capacity* (A) or a *decision-specific capacity* (B)?

  **Conclusion:** We agree on core principles (Section I) but hold fundamentally incompatible views on the necessary and sufficient conditions for consent to be normatively transformative (Sections II & IV). Our positions yield divergent predictions in concrete cases (Section III), demonstrating the substantive nature of the dispute. No formulation collapsing these positions into one is currently acceptable to both parties.

  ---
  **Key Features Reflecting Your Requirements:**
  1.  **No Mushy Compromise:** Disagreements stated starkly in each side's own acceptable terms.
  2.  **Agreed Foundations:** Clear, numbered, uncontested starting points.
  3.  **Structured Disagreements:** Separated into core validity, but-for test, baseline, competence.
  4.  **Concrete Cruxes:** Each crux has a specific, agreed-upon test case and explicit, divergent predictions.
  5.  **Verbal/Real Distinction:** Explicitly flags definitional disputes vs. core substantive clashes about moral foundations.
  6.  **Clarity on Impasse:** Conclusion states directly that no unified formulation is possible.
