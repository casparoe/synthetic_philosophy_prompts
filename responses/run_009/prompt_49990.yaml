prompt: |-
  I'd like a thought experiment built to order, for use in a paper on whether the lottery paradox and the preface paradox are one phenomenon or two. The tricky part: I want a case with the probability structure of the lottery but where the agent's relationship to each belief is that of Makinson's author, so that the standard responses to the two paradoxes give conflicting verdicts within a single case. If you judge the constraints can't all be met simultaneously, build the closest case you can and flag exactly where you had to compromise.

  The scenario should run roughly like this: a quality-control inspector at a cannery inspects the 12,000 cans from a day's run one at a time; each can individually passes, and for each single can her credence that it is defective falls below any reasonable acceptance threshold; yet she also knows the line's historical defect rate well enough that her credence that at least one can in the run slipped through is above that same threshold. At the end of the shift she signs a form attesting that every can in the run is sound. Feel free to modify the details, but keep it realistic, keep it to one paragraph, and use no lotteries, raffles, or any device where the probabilities are stipulated rather than earned.

  After the scenario, demonstrate that it meets the specifications rather than merely asserting them. Specifically: state what a Kyburgian view that rejects conjunction closure for rational acceptance says about her beliefs; what a simple Lockean threshold view says; and what the preface-style view, on which individually well-evidenced beliefs are held alongside a blanket belief in one's own fallibility, says. Say for each whether the inspector can rationally accept both that can #n is sound for every n and that some can in the run is defective, and whether her signing the form is epistemically culpable. Then identify which single feature of the case is doing the work — the individual inspection of each can, as against bare statistical knowledge about the run — and show what happens when you delete that feature in each direction, i.e., whether the case collapses into a pure lottery on one deletion and a pure preface on the other. Finally, give the best attack on the case from a defender of closure for rational acceptance, and say whether that attack treats the cannery case as a disguised lottery or a disguised preface, since my paper's thesis stands or falls on that classification.

  Please organize the response into these sections, in this order: "The scenario" (one paragraph, ~150 words); "Three verdicts" (roughly 400 words total); "The load-bearing feature" (roughly 250 words); "The counterattack" (roughly 200 words).
