prompt: |-
  Is there a name for this thing? I work on interpreting neural nets and keep running into a disagreement that nobody seems to have a word for. Two groups take the same trained network and come back with different accounts of what it represents — different features, different internal decompositions — and both accounts reproduce the network's behaviour on every input anyone has tried. Each group insists theirs is what's actually in the model, the other being just a convenient re-labelling. Then a third person shrugs and says maybe neither story is "in" the model at all: any behaviour-preserving account is as good as any other, so there's simply no fact of the matter about what the network "really" represents. Someone tried to settle it with "just look at the weights, they break the tie", but you can redescribe the same weights in a different basis and the dispute just recurses a level down.

  Philosophy must have fought this fight already, presumably over human language or animal signalling, long before anyone cared about neural nets. So: does the stance that only behaviour constrains what a system represents have a name? Is there a name for the opposing view that there's a fact of the matter about which decomposition is correct? And is there a standard rejoinder to the "look at the weights" move — or to the point that, unlike with humans, we designed and trained this thing, so maybe the training procedure or the designer's intent pins down the right decomposition? If the classic concept doesn't map cleanly onto the network case, tell me where the analogy strains. Please answer in British English.
reasoning: |-
  Okay, the user is working on interpreting neural networks and has encountered a disagreement: different groups provide different explanations of what the network represents, both consistent with the network's behaviour. They mention that looking at the weights doesn't resolve it because you can change the basis. They want to know if there's a philosophical term for this, the opposing views, and how to counter the "look at the weights" or "designer's intent" arguments.  

  First, I recall that this resembles the underdetermination problem in philosophy of science. Quine's work on indeterminacy of translation comes to mind, where multiple translations fit all evidence. That seems relevant. The user's scenario is similar: multiple interpretations fit the network's behavior.  

  The stance that only behaviour matters sounds like operationalism or verificationism. The opposing view, that there's a fact of the matter, aligns with realism or representationalism. I need to confirm these terms. Also, structural realism might be related, but it's more about scientific theories.  

  For the "look at the weights" argument, the key point is basis dependence. The weights are just numbers in a matrix; changing the basis (like rotating axes) gives different decompositions without altering the function. So the rejoinder is that the weights themselves are descriptions in a chosen basis, not the ground truth.  

  Designer's intent is another angle. The user asks if training or intent pins down the correct decomposition. While it's tempting, especially since humans built the network, the philosophical issue is whether intent determines representation. Searle's Chinese Room argues against intent defining understanding, so maybe that applies here. But the network's representations aren't conscious, so it's different. The training process optimizes for behaviour, not specific representations, leading to multiple implementations.  

  Where the analogy strains: Humans have evolved biology and embodiment, which might ground representations more than neural nets. Also, human language has public meaning, while nets are artifacts. The user needs to know these differences.  

  So, the main answers are underdetermination, indeterminacy of representation, operationalism vs. realism. Rejoinders: basis relativity for weights, training optimizes function not form. Designer's intent doesn't resolve because the training process doesn't specify implementations. Highlighting where the analogy breaks helps clarify.
answer: |-
  Ah, the eternal tussle between the interpretability clans! This is a profoundly philosophical wrinkle in the neural net pudding, and you're spot on – the ghosts of philosophers past have indeed haunted this ground long before backpropagation. Let's break it down with suitable British terminology:

  1.  **The Core Problem:**
      *   **Underdetermination of Representation by Behaviour:** This is the overarching concept. Like a scientific theory underdetermined by evidence, the internal representational structure of the network is underdetermined by its input-output behaviour. Many different internal "stories" (feature decompositions) are compatible with the observed performance.
      *   **Indeterminacy of Representation:** More specifically, the situation you describe – where multiple, behaviourally equivalent representational schemes exist and there's no decisive empirical way to choose one as "the truth" – echoes **Quine's "Indeterminacy of Translation"** (from *Word and Object*, 1960). Quine argued that for radical translation (mapping one language to another with no prior assumptions), multiple translation manuals could fit all observable linguistic behaviour equally well, with no fact of the matter about which was *correct*. Your neural net interpretability clash is remarkably analogous: different "translation manuals" for the net's internal language.

  2.  **The Stances & Their Names:**
      *   **The Third Person's Shrug (Only Behaviour Matters):**
          *   **Operationalism/Verificationism:** The meaning (or "representation") of an internal state is defined entirely by its observable consequences (inputs/outputs). If two accounts predict the same behaviour, they are operationally equivalent and there's no further "meaning" to be found inside the black box. This leans towards **behaviourism** applied to machines.
          *   **Anti-Realism about Internal Representation:** Denies that there are mind-independent, determinate representational facts *inside the system* beyond what is required to produce the behaviour. The "reality" is the function, not the specific implementation details of *how* it's achieved representationally.
          *   **Interpretive Relativism/Pluralism:** Holds that multiple interpretations can be valid or useful for different purposes, and there's no single privileged "true" decomposition. The "correctness" is relative to the interpretative framework or goals.
      *   **The Groups' Insistence (There *Is* a Fact of the Matter):**
          *   **Representational Realism:** Asserts that the network *does* have a specific, determinate internal representational structure (features, concepts, decompositions) that causally explains its behaviour. The weights encode *this specific structure*, and one interpretation (or a subset) captures it accurately, while others are merely isomorphic re-descriptions or useful fictions.
          *   **Mechanistic Explanation View:** Argues that the goal of science (or interpretability) is to uncover the actual causal mechanisms at work, not just predict outputs. The "correct" decomposition is the one that accurately describes the causal structure within the network that *produces* the behaviour. They believe this structure exists objectively in the weights.
          *   **(Related) Structural Realism:** Holds that while our *specific theoretical descriptions* might change, there is an objective structure (relationships between components) in the system that our interpretations attempt to capture. Both groups might claim their decomposition captures this structure best.

  3.  **Rejoinders to "Look at the Weights" and "Designer's Intent":**
      *   **Against "Look at the Weights":**
          *   **Basis Relativity:** This is the killer point, as you noted. The weights are just numbers in a matrix. They only acquire meaning as "features" or "representations" *relative to a specific basis* (coordinate system) for interpreting the vector spaces of the activations. Rotate the basis (perform a change-of-basis transformation), and you get a mathematically equivalent network (same input-output function!) but a completely different decomposition of what each neuron or layer "represents". The "tie-breaking" power of the raw weights is illusory; it only appears if you arbitrarily fix the standard basis as privileged. The dispute recurses to "which basis is the *correct* one to interpret the weights in?", which has no non-arbitrary answer purely from the weights+architecture.
          *   **Multiple Levels of Abstraction:** Even within a fixed basis, there are multiple levels at which you can describe the computation (individual neurons, groups of neurons, circuit motifs, layer transformations). Insisting the "raw neuron weights" show the true representation ignores that meaningful representations might emerge at higher levels of organisation that aren't directly readable from single weights.
      *   **Against "Designer's Intent / Training Procedure Pins It Down":**
          *   **Optimisation Processes are Indifferent:** The training procedure (gradient descent) optimises the network *solely* for minimising a loss function based on input-output pairs. It cares about *function*, not *form*. It will happily exploit any computational path or representational scheme that minimises loss. There is no guarantee, or even a mechanism within standard training, that ensures it finds a *unique* or *human-intended* representational decomposition. Many functionally equivalent internal configurations are possible ("Lottery Ticket Hypothesis" touches on this).
          *   **Intent vs. Implementation:** While the designer *intends* the network to solve a task, the specific representational strategies discovered by the optimisation process are emergent properties of the data, architecture, and learning algorithm – not directly specified by the designer's high-level intent. The designer didn't *choose* the specific decomposition; the SGD did. The intent constrains the *behaviour*, but not the unique internal *means*.
          *   **The Chinese Room Problem (Lite):** Borrowing from Searle, the system's behaviour arises from the formal manipulation of symbols (activations, weights) according to rules (the network function). Attributing specific *meaning* to those symbols based solely on external intent or behavioural output is fraught – the "meaning" might not be intrinsic to the symbols *in the system* in the way we imagine.

  4.  **Where the Analogy Strains (Human Language/Animal Signalling vs. ANNs):**
      *   **Biology & Embodiment (Lack Thereof):** Humans and animals have evolved biological brains embedded in physical bodies interacting with a shared world. This grounding *might* provide constraints on possible representational schemes that purely computational artefacts lack. An ANN has no body, no evolutionary history tying its representations to survival in a physical world. Its "world" is the dataset.
      *   **Public Language & Convention:** Human language meaning is heavily determined by social convention and public use within a community. ANNs lack this social dimension; their "language" is private and solipsistic, defined only by its relation to inputs and outputs.
      *   **Consciousness & Phenomenology (The Hard Problem):** While controversial, human representations are often tied to conscious experience. No one seriously claims ANNs have subjective experiences (yet!), so the link between internal state and "what it's like" or "what it means to the system" is absent. ANN representations are purely third-person attributions.
      *   **Teleosemantics:** Some philosophers (like Millikan) argue that biological function derived from evolution provides a basis for determining content (e.g., a heart's function is to pump blood). ANNs have a designed function, but it's assigned externally, not evolved. Applying teleosemantics to artefacts is complex and contested. The training process is a form of artificial selection, but it's weak compared to natural evolution in grounding "true" content.

  **In Summary:**

  *   **The Problem:** **Underdetermination of Representation / Indeterminacy of Representation** (Quinean flavour).
  *   **"Only Behaviour Matters":** **Operationalism, Verificationism, Anti-Realism about Internal Representation, Interpretive Pluralism.**
  *   **"There Is a Fact of the Matter":** **Representational Realism, Mechanistic Explanation View.**
  *   **Rejoinder to "Look at the Weights":** **Basis Relativity** – the weights only specify representations relative to a chosen basis; change the basis, change the decomposition without changing function.
  *   **Rejoinder to "Designer's Intent/Training":** **Optimisation Indifference** – Training finds functional solutions, not unique representational ones. Intent constrains behaviour, not the specific internal implementation details discovered by SGD.

  This disagreement cuts to the heart of what we mean by "representation" and "understanding" in complex, learned systems. While the philosophical parallels are strong, the lack of biological grounding and consciousness in ANNs makes the case for a single "true" decomposition particularly difficult to uphold. The pragmatic stance (which interpretation is most *useful* for a given purpose?) often becomes the most sensible path forward, even if it doesn't satisfy the realists. A fascinating pickle, indeed!
