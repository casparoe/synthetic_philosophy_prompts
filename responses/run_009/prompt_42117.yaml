prompt: |-
  My friend and I argue constantly about when someone's a hypocrite for calling you out — basically when does a person lose the standing to blame you for a thing. Her rulings so far: our flatmate who leaves exactly the kitchen mess she nags me about has no standing to nag; her dad, who quit smoking fifteen years ago and now goes on at her about her vaping, does have standing; a cousin who did the same selfish thing to his mum once years ago, never apologised for it but doesn't do it anymore, still has standing to call my friend out for doing it now; a mate who openly says he does the same thing and isn't sorry, but that she really shouldn't do it, has no standing even though she agrees his criticism is actually correct; and a friend who blames her for speeding while speeding himself, on the grounds that his speeding is different because he's a better driver, has no standing. Now a new one's come up: a colleague who has never gossiped maliciously in her life, but has scheduled a properly vicious email about another colleague to go out Monday morning, and who today calls my friend out for her gossiping. Will my friend say she has standing here? What rule is she even running — I can see at least two that fit everything she's said so far — what does each one predict on this case, and is there some further case that would really seperate the rules?
reasoning: |-
  Okay, let me try to unpack this user's question. They're describing an ongoing debate with their friend about when someone has the standing to call out another person's behavior without being a hypocrite. The user has provided several scenarios where their friend has made judgments, and now they want to predict what the friend would say about a new case involving a colleague who schedules a malicious email but criticizes gossiping. 

  First, I need to analyze the patterns in the friend's previous rulings. Looking at the examples: the messy flatmate loses standing because they're currently doing the same thing. The dad who quit smoking 15 years ago retains standing. The cousin who did a selfish thing once years ago but doesn't do it now still has standing. The mate who openly does the same thing without remorse has no standing. And the speeding friend who claims to be a better driver also loses standing.

  Hmm, the key seems to be whether the critic is currently engaging in the behavior or has a pattern of it. The dad and cousin have stopped the behavior, so they have standing. The flatmate, mate, and speeding friend are currently doing it, so no standing. But the colleague case is tricky—she's scheduled future malicious action but hasn't done it yet. 

  The user mentions two possible rules: "current violation" vs. "commitment to violating." The first would grant standing to the colleague since she hasn't acted yet. The second would deny standing because she's planning to violate the same norm. The friend's past rulings emphasize current behavior, so she'd likely use the first rule and say the colleague has standing. 

  But is there a deeper principle? Maybe it's about the critic's present relationship with the norm. If they're actively undermining it (currently violating or openly unrepentant), they lose standing. If they've reformed or never violated, they keep it. The colleague hasn't acted yet, so she might still be seen as upholding the norm. 

  To distinguish the rules, a test case could be someone who violated the norm in the distant past but is now lapsing. If the friend denies standing, she's using commitment; if she grants it, she's focusing on current violation. The user might need this to clarify their friend's logic. 

  Also, the user seems frustrated with the inconsistency. They might want a clearer framework to predict their friend's judgments or understand the underlying ethics. The colleague case highlights the tension between intent and action—something the friend hasn't addressed yet. Probing that could reveal her true criteria.
answer: |-
  Based on your friend's established rulings, I predict she would **DENY STANDING** to the colleague who scheduled the vicious email but criticized your friend's gossiping.

  Here's the breakdown of her apparent rule and the analysis:

  **Your Friend's Rule (Based on Patterns):**
  *   **Critics lose standing if they are *currently/presently engaged in* violating the very norm they are criticizing, OR if they *openly embrace/refuse to disavow* violating that norm themselves.** Standing is preserved if the critic has genuinely reformed (stopped the behavior and acknowledges it was wrong) or has never violated the norm.

  **Analysis of Previous Rulings & the New Case:**

  1.  **Messy Flatmate (No Standing):** *Currently* commits the same violation she criticizes.
  2.  **Dad (Has Standing):** *Reformed* long ago, acknowledges smoking was wrong (implied by quitting and criticizing).
  3.  **Cousin (Has Standing):** *Reformed* (doesn't do it anymore), even without an apology. The past violation doesn't negate current adherence.
  4.  **Unrepentant Mate (No Standing):** *Openly embraces* violating the norm himself ("does the same thing and isn't sorry"), even while agreeing the criticism is correct *in principle*.
  5.  **Speeding Friend (No Standing):** *Currently/presently* violates the norm *while* criticizing it, regardless of self-serving justifications ("better driver").
  6.  **Colleague with Scheduled Email (Prediction: No Standing):** While she hasn't gossiped *yet*, she is **actively committed to and planning** a near-future, severe violation of the *same core norm* (harmful interpersonal conduct) that she is criticizing *today*. She is *presently engaged* in the process of violating the norm she's invoking. Her criticism happens *while* she harbors malicious intent and has taken concrete steps to act on it imminently. This places her squarely in the "currently violating" or "currently embracing violation" category like the flatmate and speeding friend, not in the "reformed" or "never violated" category like the dad and cousin.

  **The Two Rules That Fit (Mostly) & Their Prediction:**

  1.  **Rule A: Strict "Current Violation" Test:** Standing is lost *only* if the critic is *literally, concurrently, or immediately habitually* violating the norm *at the precise moment of criticism*.
      *   *Prediction for Colleague:* **Has Standing.** The email isn't sent yet, so she isn't *currently* violating. (This rule fits all *except* the Unrepentant Mate, who isn't *currently* doing it but still loses standing due to his open embrace of the violation).
  2.  **Rule B: "Present Commitment to the Norm" Test:** Standing requires the critic to be *currently upholding the norm themselves* – either by adhering to it *now* or by having demonstrably reformed and committed to it. Standing is lost if the critic is *currently violating* OR *currently planning/embracing a violation* OR *openly unrepentant* about past/present violations.
      *   *Prediction for Colleague:* **No Standing.** She is actively planning a severe, imminent violation of the norm she invokes. Her present actions and intent show she is not upholding the norm she's criticizing.
  3.  **Which Rule Does Your Friend Use?** Her ruling on the **Unrepentant Mate** is the key. Rule A (Strict Current Violation) would likely grant the mate standing since he isn't *currently* doing it. However, your friend **denied** him standing. This shows she uses **Rule B: "Present Commitment to the Norm" Test.** The mate's *open embrace* of violating the norm, even if not acting *right now*, destroys his standing. The colleague planning her email similarly lacks present commitment to the norm.

  **Case to Separate Rules A & B:**

  *   **The Test Case:** A reformed alcoholic (sober 10 years, actively promotes sobriety) *secretly* relapses and has been drinking heavily for the past week. *While currently drunk*, they criticize a friend for having a single beer.
  *   **Prediction under Rule A (Strict Current Violation):** **No Standing.** They are *literally concurrently* violating the norm they are criticizing (drinking while criticizing drinking).
  *   **Prediction under Rule B (Present Commitment):** **No Standing.** They are *currently violating* the norm.
  *   **Result:** This case *doesn't* separate the rules; both deny standing.
  *   **The *Better* Test Case to Separate Them:** The **Unrepentant Mate** scenario *already* separates them! Rule A grants standing (not currently violating), Rule B denies it (openly embraces violation). Your friend **denied** standing to the mate, proving she uses **Rule B**.

  **Conclusion:**

  *   **Prediction:** Your friend will rule the **colleague has NO STANDING** to criticize gossiping because the colleague is **actively planning and committed to a near-future violation of the same core norm** (causing interpersonal harm via communication). She lacks "Present Commitment to the Norm."
  *   **Her Rule:** **Rule B: "Present Commitment to the Norm" Test.** Standing requires the critic to be demonstrably upholding the norm *in the present* – either by adhering to it now or through genuine past reform. Standing is lost by *current violation*, *active planning/embracing of violation*, or *open unrepentance*.
  *   **Rule Confirmation:** Her ruling on the Unrepentant Mate (denied standing despite not currently violating, due to open embrace) is the clearest evidence for Rule B over the stricter Rule A.
