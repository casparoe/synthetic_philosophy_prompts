  0:20-0:25 (5 min): Round 3 - Query 3: "Did Alice and Charlie meet at the library?"
  - Teams answer.

  0:25-0:35 (10 min): Round 4 - Query 4: "Did Bob and Charlie meet at the library?"
  - This may require more time. Allow teams to use the market if they wish.

  0:35-0:50 (15 min): Round 5 - Query 5: "Was there a meeting at the park that involved at least three people?"
  - This is harder. Allow time for deduction and market activity.

  0:50-1:00 (10 min): Round 6 - Query 6: "Is it true that there was at least one meeting at the library, or at least one meeting at the park, or at least one meeting at the cafe?"
  - Teams must realize that they know at least one of these happened.

  1:00-1:20 (20 min): Round 7 - Contradiction round. We introduce a proposition that is a contradiction and see if any team assigns credence to it.

  **Contradiction Round:**

  We want to test if teams can spot a contradiction. We can provide a proposition that is in fact a contradiction, but not obviously so.

  Example: 
  Query 7: "Diana was at the library at 11:00 and at the park at 11:00."
  - But rule R4: a person cannot be in two places at once. So this is a contradiction. 
  - However, do we have facts about Diana at 11:00? 
    Diana at library: 10:30-11:30 -> so at 11:00 she is at the library.
    Diana at park: 12:30-13:30 -> so at 11:00 she is not at the park.
    So the proposition "Diana was at the library at 11:00 and at the park at 11:00" is false, but is it a contradiction? It's not a logical contradiction per se, but a factual falsehood. We want a logical contradiction.

  To make it a logical contradiction, we need to use the background rules. 

  We can provide a proposition that violates a rule necessarily. For example: 
  Query 7: "Alice was at the library from 9:00 to 10:00 and at the park from 9:30 to 10:30."
  - This violates rule R4 (cannot be in two places at once) because from 9:30 to 10:00 she would be in two places. So this is impossible given R4.

  Teams are asked: "What is your credence that Alice was at the library from 9:00 to 10:00 and at the park from 9:30 to 10:30?" 

  But in our game, they are not assigning credences, they are only asked to say if they know it or not. We want to penalize them if they don't know that this is impossible.

  In the scoring rule, if a team states that they know this proposition is false (because it's a contradiction), then they gain 10 points. If they state they don't know, and it is a consequence of their own facts and rules that it is false (which it is, because they have rule R4), then they lose 10 points. If they state they know and say it is true, they lose 20 points.

  But note: the proposition is a contradiction given the background rules (R4). Every team has R4, so they should know it is false.

  However, they might not notice that the time intervals overlap. So they might not realize it's a contradiction.

  Scoring for the contradiction round is the same as before.

  **Debrief (1:20-1:30, 10 min):**

  Key points to cover:

  1. **Implicit vs. Explicit Knowledge:**
     - The game penalized teams for not knowing consequences of their own facts. This mirrors the idealization of logical omniscience: agents are assumed to know all consequences of their knowledge.
     - In reality, we only have explicit knowledge, and we must work to make implicit knowledge explicit.

  2. **Boundedness vs. Irrationality:**
     - Failing to know a consequence is not necessarily irrational; it may be due to computational limits. The game shows that even with effort, some consequences are missed, especially under time pressure.
     - Compare with the market: teams could buy deductive labor, showing that the cost of computation is real.

  3. **Disanalogy between Mathematical and Empirical Intractability:**
     - In empirical domains, we can gather more data. In logic, we only have the facts we start with. The game shows that even with all the data, we may not have the capacity to compute consequences.

  4. **The Normative Question:**
     - The game cannot resolve whether logical omniscience is a defect or a legitimate idealization. It only shows the empirical fact of bounded rationality. In the debrief, we must discuss: 
       - The idealization might be acceptable if we are modeling rational requirements (what agents ought to know) rather than what they do know.
       - But the idealization might be too strong if it makes the model inapplicable to real agents.

  5. **Market Observations:**
     - The price of deduction in the market reflects the computational cost. In an ideal model, that cost is zero.

  **Predicted Problems:**

  1. **Teams gaming the scoring:** 
     - Teams might always say "I don't know" for hard queries to avoid the -20 penalty, accepting the -10 penalty for not knowing a consequence. This would make the game less about deduction and more about strategy.
     - Mitigation: Make the penalty for not knowing a consequence (-10) and the gain for knowing (+10) such that it's better to try. Also, the penalty for a wrong answer (-20) is severe, so they might be cautious. Encourage trying by having some easy rounds.

  2. **Accidentally trivial queries:**
     - Some queries might be easier for some teams than intended. We tested the queries above, but in practice, a team might have an easy time with a query meant to be hard.
     - Mitigation: Have a few backup queries of varying difficulty.

  3. **Deduction market collapsing:**
     - Teams might not engage in trade because of time or because they don't see the benefit.
     - Mitigation: In the harder rounds, pause and remind them of the market. Maybe seed a trade by example.

  4. **Time management:**
     - The 90 minutes might be tight. The harder rounds might take longer.
     - Mitigation: Be ready to skip or shorten a round.

  **Features the game cannot reproduce:**

  - The game cannot directly address the normative question of whether logical omniscience is a flaw or an idealization. It only shows that humans are not logically omniscient. The debrief must explicitly discuss the normative aspect.
  - The game cannot capture the infinite scope of logical omniscience (knowing all infinitely many consequences) because we use a finite set of facts and consequences.

  **Final Materials:**

  Provide the following handouts:

  1. **Background Rules (to all teams):**
     - R1: If two people are at the same location at the same time, they meet.
     - R2: If two people meet, they exchange a secret code.
     - R3: The secret code exchange requires at least 15 minutes of overlap.
     - R4: A person cannot be in two places at once.
     - R5: No one can be in a location during its closure. (added)

  2. **Atomic Facts (assigned to teams):**
     - Team A: 1, 2, 13, 16
     - Team B: 3, 4, 14, 9
     - Team C: 5, 6, 15, 10
     - Team D: 7, 8, 11, 12

     (with the list of facts as above)

  3. **Scoring Rules:**
     - Start: 100 points.
     - Per round, for a query:
       - If you say "know" and answer correctly: +10
       - If you say "know" and answer incorrectly: -20
       - If you say "don't know" and the query is a logical consequence of your facts: -10
       - If you say "don't know" and the query is not a consequence: 0

  4. **Market Rules:**
     - Teams can buy deductive labor from other teams.
     - The buyer provides the seller with the buyer's own facts and the background rules.
     - The seller then tries to deduce the query (or a sub-query) from only these.
     - If the seller succeeds, they provide the deduction and the buyer pays the agreed price (in points).
     - The buyer can then use the deduced fact in future rounds.

  5. **Queries:**
     - Round 1: "Was Alice at the library at 9:30?" (Answer: Yes)
     - Round 2: "Did Alice and Bob meet at the library?" (Answer: Yes)
     - Round 3: "Did Alice and Charlie meet at the library?" (Answer: No)
     - Round 4: "Did Bob and Charlie meet at the library?" (Answer: Yes)
     - Round 5: "Was there a meeting at the park that involved at least three people?" (Answer: No)
     - Round 6: "Is it true that there was at least one meeting at the library, or at least one meeting at the park, or at least one meeting at the cafe?" (Answer: Yes)
     - Round 7: "Alice was at the library from 9:00 to 10:00 and at the park from 9:30 to 10:30." (This is impossible by R4, so the correct answer is that it is false)

  6. **Debrief Questions:**
     - How did it feel to be penalized for not knowing something that followed from your own facts?
     - Did you notice a difference between what you explicitly knew and what was implicitly contained in your information?
     - When you bought a deduction, what did that represent in terms of computational effort?
     - Is it rational to be held responsible for all consequences of your knowledge?
     - How does this relate to the use of Bayesian models in epistemology?

  This design should meet the goals and fit within the time.
answer: |-
  Below is a complete design for your in-class game, "The Logic Market," aimed at making students *feel* the problem of logical omniscience by simulating its demands. The game forces teams to confront the gap between implicit and explicit knowledge, the cost of computation, and the normative tension between bounded rationality and idealization. I've refined your initial idea to ensure the disjunctive round is impactful, integrated a contradiction round, and structured everything for a 90-minute session. I also include a debrief linking gameplay to theory, predictions of failure points, and limitations.

  ---

  ### **Game Overview**
  - **Objective**: Teams start with explicit facts about a fictional town. They must answer queries under a scoring rule that penalizes failure to deduce logical consequences. A deduction market lets teams "buy" computational labor, revealing the cost of logical omniscience.
  - **Core Tension**: Students experience the burden of idealization—what it means to be scored as if they instantly know all consequences of their knowledge.
  - **Key Moments**: 
    - A disjunctive round (Round 4) forces teams to commit to knowing *at least one* consequence without knowing *which*, mirroring how ideal agents must hold "known disjunctions."
    - A contradiction round (Round 6) penalizes teams for not spotting impossibility.
    - The market makes computational costs visible.

  ---

  ### **Materials & Setup**
  #### **Fictional Scenario: Gossip in Deductionville**
  - **Characters**: Alice (A), Bob (B), Charlie (C), Diana (D).
  - **Locations**: Library (L), Park (P), Café (Caf).
  - **Background Rules (Known to All Teams)**:
    > R1: If two people are at the same location at overlapping times, they meet.  
    > R2: A meeting requires ≥15 min overlap (e.g., 9:00–9:30 = 30 min overlap).  
    > R3: Time intervals are inclusive (e.g., 9:00–10:00 includes 9:00 and 10:00).  
    > R4: No one can be in two places at once.  
    > R5: Locations are only open during stated hours; no meetings outside these.  
    > R6: All agents know the town map and rules R1–R5.  

  - **Atomic Facts (20 Total, Divided Among Teams)**  
    Each team gets 5 facts. Facts are chosen so consequences are finite but require 3–5 deduction steps. Crucially, **no team has all facts needed for every query**, forcing trade.  

    | Team | Facts (All times in AM) |
    |------|-------------------------|
    | A    | 1. A at L: 9:00–10:00<br>2. B at L: 9:30–10:30<br>3. L open: 9:00–11:00<br>4. C at P: 11:00–12:00<br>5. D at P: 11:30–12:30 |
    | B    | 6. A at P: 10:30–11:30<br>7. B at P: 11:00–12:00<br>8. P open: 10:00–12:30<br>9. C at Caf: 12:00–13:00<br>10. D at Caf: 12:30–13:30 |
    | C    | 11. A at Caf: 12:00–13:00<br>12. B at Caf: 12:30–13:30<br>13. Caf open: 12:00–14:00<br>14. C at L: 10:00–11:00<br>15. D at L: 10:30–11:30 |
    | D    | 16. A and B never meet at Caf<br>17. C and D never meet at L<br>18. L closed 11:00–12:00<br>19. P closed 12:30–13:00<br>20. Caf closed 13:00–14:00 |

    **Notes**: 
    - Facts are consistent but yield non-obvious consequences (e.g., Fact 16 + R1–R2 imply A and B’s Café times don’t overlap sufficiently).
    - The disjunctive round uses Facts 6–7 (Team B); the contradiction round uses Fact 16 + R4.

  #### **Team Setup**
  - **4 teams of 4 students** (adjust if needed). Movable desks allow huddling.
  - **Each team gets**: 
    - Their 5 facts + background rules (R1–R6) on a handout.
    - A "bank" of 100 points (tracked on the whiteboard).
    - Deduction tokens (for trading, see *Market Rules*).

  ---

  ### **Rules & Scoring**
  #### **Scoring Logic**
  - **Idealization Premise**: Teams are scored as logically omniscient agents. If a query is a logical consequence of their facts + rules, they *should* know it.
  - **Per-Round Scoring**:
    - ✅ **Correct Answer**: +10 points (they "knew" the consequence).
    - ❌ **Incorrect Answer**: –20 points (they asserted a falsehood).
    - 🤷 **"Don't Know" (and consequence exists)**: –10 points (failure to deduce).
    - 🤷 **"Don't Know" (no consequence)**: 0 points (no penalty; no obligation).
  - **Contradiction Handling** (Round 6):  
    If a team assigns credence to a contradiction (e.g., claims a proposition is possible when it violates rules), they are penalized as follows:
    - If they say "know" and assert the contradiction is **true**: –20 points (❌ incorrect answer).
    - If they say "don't know" about the contradiction, but it **is impossible** given their facts: –10 points (🤷 failure to spot inconsistency).
    - *Example*: Query 6 asks if A and B met at the Café. Fact 16 + R4 make this impossible. Teams should recognize it’s false; if they don’t, they’re penalized for failing to see the contradiction.

  #### **Deduction Market Rules**
  - **Purpose**: Teams "buy" deductive labor to make implicit knowledge explicit, revealing computational costs.
  - **How It Works**:
    - Teams can trade during **3-minute windows** between rounds.
    - **Buyer** pays points to **seller** for a deduction. Price is negotiated (e.g., "Prove that A and B met at L for Team A").
    - **Seller** must:  
      (a) Use *only* the buyer’s facts + background rules (no seller facts!).  
      (b) Provide a step-by-step deduction (verbal/written).  
      (c) Succeed or refund double the price.  
    - **Buyer** gains the deduced fact as explicit knowledge for future rounds.
  - **Token System**:  
    - Each team gets 3 tokens. 1 token = 1 deduction request.  
    - Tokens ensure market activity; teams start with 0 tokens after Round 1 and earn 1 token per round to incentivize trade.

  ---

  ### **Round-by-Round Timeline (Total: 70 min + 20 min debrief = 90 min)**
  **Instructor Role**: Pose queries, enforce time, track scores/transactions on whiteboard.

  | Round | Time | Query | Logical Answer | Purpose | Key Consequences (for Instructor) |
  |-------|------|-------|---------------|---------|-----------------------------------|
  | **0. Setup** | 0–5 min | Distribute materials, explain rules, form teams. | — | Establish idealization premise. | — |
  | **1. Warm-up** | 5–10 min | "Was Alice at the Library at 9:30?" | Yes (Fact 1: A at L 9:00–10:00). | Easy consequence; build confidence. | Team A can answer directly; others may use market. |
  | **2. Basic Deduction** | 10–20 min | "Did Alice and Bob meet at the Library?" | Yes (A: 9:00–10:00 + B: 9:30–10:30 → overlap 30 min ≥15 min). | Penalize for not deducing from explicit facts. | Team A has all facts; others must trade (e.g., Team C buys from A). |
  | **3. Market Test** | 20–35 min | "Did Alice and Charlie meet at the Park?" | No (A at P: 10:30–11:30; C at P: 11:00–12:00 → overlap at 11:00 only? 0 min if intervals are points). | Requires cross-team facts (A: Team B; C: Team A/C). | Teams B/C have partial facts; market price emerges (e.g., 15 points per deduction). |
  | **4. Disjunctive Round** | 35–50 min | "Either Alice met Charlie at the Café, or Bob met Diana at the Park. Do you know *at least one* happened? If so, which?" | **Disjunction is true** (A met C at Café: A 12:00–13:00 + C 12:00–13:00 → overlap 60 min; B met D at Park: B 11:00–12:00 + D 11:30–12:30 → overlap 30 min). | Force commitment to disjunction without knowing which disjunct. | Teams must say "yes" to the disjunction (consequence of their facts) but may not know which (e.g., Team B knows A-Caf but not B-Park). Penalize 🤷 for "don't know disjunction." |
  | **5. Complex Query** | 50–60 min | "Was there a meeting at the Café involving exactly two people during its open hours?" | Yes (e.g., A and C: 12:00–13:00). | Laborious deduction (requires checking all pairs against rules). | High penalty risk; market demand spikes. Teams C/D have facts but need computation. |
  | **6. Contradiction Round** | 60–70 min | "Is it possible that Alice and Bob met at the Café?" | **No** (Fact 16: "A and B never meet at Caf" + R4 → contradiction if asserted). | Test if teams spot inconsistency. | Teams with Fact 16 (Team D) should say "know it’s false"; others may say "don't know" but are penalized 🤷 if they have rules (all do). |
  | **7. Final Trading** | 70–75 min | Open market for last-minute trades. | — | Let teams optimize scores. | — |

  ---

  ### **Debrief (75–90 min)**
  Use whiteboard to map gameplay to theory. Start with student reactions, then pivot to concepts.

  1. **Implicit vs. Explicit Knowledge** (Link: Rounds 2–4):  
     - *Game Moment*: Teams had facts implying meetings (e.g., A/B at Library) but couldn’t always answer. Buying deductions made implicit knowledge explicit.  
     - *Theory*: Logical omniscience assumes all knowledge is explicit; real agents have limited "working memory." Ask: *"Did knowing a fact mean you could use it? How is this different from your probabilistic models?"*

  2. **Boundedness vs. Irrationality** (Link: Penalties in Rounds 3–6):  
     - *Game Moment*: Penalties for "don’t know" felt unfair when deductions were hard (e.g., Round 5). Market prices quantified "effort."  
     - *Theory*: Failing to deduce isn’t irrational—it’s boundedness. In Bayesian models, we conflate the two. Ask: *"When we penalize agents for not knowing a consequence, are we blaming them for being human?"*

  3. **Disanalogy: Mathematical vs. Empirical Intractability** (Link: Market Activity):  
     - *Game Moment*: Teams could "gather more data" (via trade) but still struggled with computation (e.g., disjunctive round).  
     - *Theory*: Empirical ignorance is fixed by data; logical ignorance requires computation, which doesn’t scale. Idealization ignores this. Ask: *"Why is ‘just calculate it!’ unrealistic for logic but not for gathering evidence?"*

  4. **Normative Tension: Defect or Idealization?** (Link: Contradiction Round + Scores):  
     - *Game Moment*: Teams resented being scored on consequences they couldn’t compute, but the market showed idealization has a "cost."  
     - *Theory*: The game *cannot resolve this*—it only shows the empirical gap. Argue:  
       - *Defect View*: If models demand the impossible, they misdescribe rationality.  
       - *Idealization View*: Norms don’t care about our limits (e.g., "ought implies can" doesn’t apply).  
       Ask: *"Should we adjust models to fit humans, or is logical omniscience a regulative ideal?"*

  ---

  ### **Predictions of Failure & Limitations**
  - **What Will Go Wrong**:  
    - **Teams game scoring**: Teams may always say "don't know" to avoid –20 penalties, accepting –10. *Mitigation*: Make early rounds easy (gains incentivize risk-taking).  
    - **Deduction market collapses**: Teams hoard points/tokens. *Mitigation*: Give tokens gradually; seed an example trade.  
    - **Queries accidentally trivial**: If teams share facts freely, consequences become obvious. *Mitigation*: Ban fact-sharing; only deductions are tradable.  
    - **Time overrun**: Complex rounds (4–5) may run long. *Mitigation*: Cut Round 5 if needed; prioritize disjunctive/contradiction rounds.

  - **What the Game Cannot Reproduce (Requires Debrief Supplement)**:  
    - **Normative tension**: The game shows we *aren’t* logically omniscient but cannot settle if we *ought* to be. You must argue:  
      - *Pro-idealization*: Logic is normative; rationality requires respecting consequences (even if we can’t compute them).  
      - *Anti-idealization*: Models should track feasible cognitive processes (e.g., bounded rationality).  
    - **Infinite logical closure**: The game uses finite consequences, but omniscience implies knowing infinitely many. Highlight this in debrief.  
    - **Probability dynamics**: The game uses binary knowledge, not credences. Use the contradiction round to bridge: *"Assigning positive credence to a contradiction is the probabilistic analog of failing to spot impossibility."*

  ---

  **Why This Works**: Students experience logical omniscience as a *burden*—penalties for "not knowing" feel unjust when computation is hard. The market makes costs tangible, and the disjunctive/contradiction rounds force engagement with the idealization’s bite. By the debrief, they’ll feel the problem viscerally, turning a "technical footnote" into a central challenge.
