prompt: |-
  I'm a family therapist, Bowen-trained, so my native vocabulary for thinking about people is stuff like differentiation of self, emotional triangles, multigenerational transmission, emotional cutoff, homeostasis, the family as an emotional unit. Recently I went down a rabbit hole reading about Ubuntu and the African communitarian debate on personhood, and I keep trying to map it onto what I already know and getting stuck.

  So here's the ask: translate that whole cluster of views into Bowen family systems vocabulary as faithfully as you can, one by one. That means Ubuntu's core maxim (the one Tutu made famous, that a person becomes a person through other persons), Menkiti's view that personhood is something you gradually attain through community participation rather than something you have automatically (so kids are sort of persons-in-the-making, and community recognition matters all the way to the funeral), Gyekye's pushback that this is too radical and individuals keep rights and agency even while being socially constituted, and the extension of the relational web to ancestors and future generations. I don't need any other framework imported here — just your best honest mapping into mine.

  Then I want the residue report, which is honestly the part I care about most: what translates cleanly into systems terms, what only translates with real distortion, and what can't be said in my vocabulary at all. Two things I'd especially like your read on. First, Bowen treats the family as the emotional unit and basically aims at differentiation, so a framework where the individual self isn't even the right unit of analysis feels like it should break something — does it, or is that me being dramatic? Second, my framework is descriptive/clinical while Ubuntu talk seems to slide between describing what persons are and prescribing how you become one; does that normative slide show up anywhere in the translation, or does it vanish into the machinery? For the residue generally, tell me whether it points to something my framework genuinely can't see, or to something fuzzier than it looks on the Ubuntu side.

  Please write in American English, and end with a final line that reads "Residue:" followed by exactly one sentence stating the single biggest thing that did not survive the translation. A table or a short section per thinker is fine, whatever, just keep the mapping tight rather than essay-ish.
reasoning: |-
  Hmm, the user is a Bowen-trained family therapist who's diving into Ubuntu philosophy and wants me to map its concepts onto Bowen family systems theory. They're specifically interested in translating core ideas from Ubuntu thinkers like Menkiti and Gyekye into Bowen terminology, while identifying what gets lost in translation.

  The user wants two main things: first, a direct translation of Ubuntu concepts using Bowen vocabulary (differentiation, triangles, etc.), and second, a "residue report" highlighting what doesn't map cleanly. They're particularly concerned about two tensions: Bowen's focus on the individual versus Ubuntu's relational self, and the descriptive vs. normative nature of these frameworks.

  I need to approach this systematically. For the translation part, I'll break down each Ubuntu concept:
  - Ubuntu's core maxim ("a person becomes a person through other persons") maps to Bowen's family as emotional unit, but with key differences in unit of analysis
  - Menkiti's gradual personhood attainment could be seen as differentiation-in-process, but Bowen assumes inherent personhood
  - Gyekye's moderated view translates to differentiation within the system, but rights/agency are assumed in Bowen
  - Ancestors/future generations might map to multigenerational transmission, but only partially

  The residue analysis is crucial here. The biggest incompatibilities are:
  1) Ubuntu's community-as-unit versus Bowen's family-as-unit
  2) Personhood as achievement (normative) versus differentiation as process (descriptive)
  3) Rights/agency as socially contingent in Ubuntu versus inherent in Bowen
  4) Ancestors as living participants versus historical influences

  The prescriptive/descriptive divide is particularly sticky - Ubuntu blends "is" and "ought" in ways Bowen deliberately avoids. And that community scale... Bowen's systems thinking stops at family, while Ubuntu extends to village/ancestors. That's not just a scope difference but a categorical one.

  For the final residue statement, I'm landing on the ontological difference: Ubuntu sees the individual as literally constituted by relationships, while Bowen sees relationships as shaping but not defining the self. That's the core untranslatable element.
answer: |-
  ### Translation into Bowen Family Systems Vocabulary

  | **Ubuntu Concept**                                                                 | **Bowen Translation**                                                                                                                                                                  | **Degree of Fit** |
  | :--------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------- |
  | **Ubuntu Core Maxim**<br>("A person becomes a person through other persons")       | *The family as an emotional unit defines the self.* Personhood emerges from sustained emotional contact in the family system; identity is co-constructed through relational processes. | Moderate          |
  | **Menkiti's Gradual Personhood**<br>(Personhood attained via community recognition/participation) | *Differentiation is a lifelong process.* Children are low-differentiation members; "personhood" reflects increasing capacity to manage reactivity while staying connected. Community validation mirrors the family's role in reinforcing/blocking differentiation. | Low (Distortion) |
  | **Gyekye's Relational Individualism**<br>(Individuals retain agency/rights while socially embedded) | *Differentiation within the system.* Individuals maintain core autonomy ("solid self") even amid enmeshment. Rights/agency map to the capacity to resist emotional fusion while staying engaged. | Good              |
  | **Ancestors & Future Generations**<br>(Relational web transcends living members)  | *Extended multigenerational transmission.* Ancestors = unresolved emotional legacies shaping current triangles; future generations = projected family anxiety/expectations influencing homeostasis. | Partial           |

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  **1. Untranslatable Core Concepts**  
  - **Ontological Relationality:** Ubuntu asserts the self *is* relations (no "self" outside community). Bowen assumes an inherent (if undeveloped) self shaped *by* relations. *Residue: Ubuntu dissolves the individual as a unit; Bowen preserves it.*  
  - **Personhood as Achievement:** Menkiti’s view that infants are "not-yet-persons" clashes with Bowen’s assumption of inherent personhood. Recognition-based personhood has no parallel – differentiation describes function, not moral status.  
  - **Community Scale:** Bowen’s "emotional unit" is the nuclear/extended family. Ubuntu’s village-scale community (with ancestors as active participants) exceeds Bowen’s scope.  

  **2. Distorted in Translation**  
  - **Gradual Personhood → Differentiation:** Framing Menkiti’s view as "low differentiation" distorts it. Differentiation is a *clinical descriptor* of autonomy/connection balance; personhood in Ubuntu is a *moral/physical reality* contingent on communal acts.  
  - **Ancestors as Living Agents → Multigenerational Patterns:** Translating ancestors as "emotional legacies" reduces their active, agentic role in Ubuntu’s relational web. Bowen sees them as historical influences; Ubuntu sees them as present participants.  

  **3. The Normative Slip**  
  Ubuntu’s prescription ("*how* to become a person") becomes invisible in translation. Bowen’s framework is **strictly descriptive** (e.g., "differentiation" isn’t inherently "good," just functional). Ubuntu’s ideals (e.g., communal harmony as *the* path to personhood) vanish – Bowen observes system behaviors without judging the "should." *This is a feature, not a bug, of Bowen’s clinical neutrality.*  

  **4. The Unit-of-Analysis Tension**  
  Bowen **doesn’t break** – it reframes. Ubuntu’s communitarianism maps cleanly to Bowen’s core axiom: *"The family is a single emotional unit."* What Ubuntu calls "personhood," Bowen calls "a self differentiated within the unit." The friction is scalar (family vs. village) and ontological (self-as-emergent vs. self-as-inherent). Bowen *can* analyze Ubuntu’s communal self, but only by treating the village as an oversized family system – losing Ubuntu’s cultural/spiritual specificity.  

  **5. Fuzziness vs. Blind Spots**  
  - **Fuzzy in Ubuntu:** "Community recognition" lacks operational definition. Bowen’s precision (e.g., triangulation, anxiety transmission) exposes this.  
  - **Blind Spots in Bowen:** Ubuntu’s *moral ontology* (rights/agency as *granted by* community) is unseeable. Bowen assumes inherent individual rights/agency as baseline.  

  **Residue:** Ubuntu's core claim that an isolated human lacks ontological personhood cannot be expressed in Bowen’s framework, which presupposes an individual self as the irreducible unit of analysis.
