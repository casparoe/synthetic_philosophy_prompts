prompt: |-
  My friend and I spent an evening arguing about whether our city's school funding system is fair, and we kept sliding past each other in a way I now suspect is a general pattern in need of a name. He cared about whether families end up equally satisfied — some children, through no fault of their own, need tutoring, therapy, or wheelchair access to get the same benefit from school that others get for free — while I kept counting what each family was actually given, in money and services, and calling the system fair when those amounts matched. We eventually realized we could both correctly call the same arrangement equal by our own measure and unequal by the other's, and that neither of us had an argument for why our measure was the right one that didn't just presuppose it. There was also a stubborn case we couldn't resolve: a family that converts the same resources into much less benefit through sheer pickiness — expensive hobbies, a refusal to use what's provided. Counting their dissatisfaction as inequality felt wrong, but counting a child's medical needs on a par with those hobbies felt worse, and I couldn't say what the relevant difference is. Is there an established name or literature for the situation where two people can each truthfully call the same distribution unequal because they measure inequality in different currencies, and for the puzzle about which complaints a fair distribution is supposed to answer? I'm aware of the folk distinction between equality of opportunity and equality of outcome, but it doesn't seem to fit, since both of us were describing outcomes in some sense. I'd like to know what the nearest concepts are, how my pattern differs from each, and where it falls among them — or, if nothing established fits, I'd like you to coin a term, define it, and tell me where its edge cases lie.
reasoning: |-
  Okay, the user is describing a philosophical debate they had with their friend about fairness in school funding. The core issue revolves around two different measures of equality: one based on resources distributed (equality of inputs) and the other based on satisfaction or benefit derived (equality of outcomes). They're looking for established concepts that name this dichotomy, and also want help resolving that stubborn case about "pickiness" versus genuine needs.

  First, I need to unpack their scenario carefully. The friend argues for equality of satisfaction - meaning children should end up equally satisfied regardless of their individual needs (tutoring, therapy, wheelchair access). The user argues for equality of resources - fairness means each family gets the same monetary/resources allocation. Both positions are internally consistent but incompatible when applied to the same distribution. 

  The tricky part is the edge case they mentioned: a family that wastes resources through expensive tastes versus a child with genuine medical needs. The user intuitively feels these shouldn't be treated the same, but struggles to articulate why. This suggests they need help identifying the moral distinction between preferences and needs.

  I recall several relevant philosophical frameworks:
  - Amartya Sen's capability approach seems directly applicable - it evaluates fairness based on what people can actually do/be (capabilities) rather than resources or subjective satisfaction. 
  - Dworkin's distinction between brute luck (disabilities) and option luck (choices) could address the pickiness case. 
  - The equality of opportunity vs outcome distinction doesn't quite fit because both parties are measuring outcomes - just different kinds.

  The user explicitly rejected "equality of opportunity/outcome" as insufficient, so I should avoid that framing. They're clearly well-read enough to recognize superficial fits.

  For terminology, "currency of equality" feels precise - it captures how they're measuring fairness in different "denominations" (resources vs welfare). The stubborn case reveals the need for a third currency: capabilities or genuine opportunity.

  I should structure this as:
  1) Name the core dichotomy (resource/welfare equality) 
  2) Introduce capability approach as the bridge
  3) Use brute/option luck to solve the edge case
  4) Offer "currency of equality" as the overarching term

  The coinage should feel intuitive while leaving room for philosophical debate - hence defining its boundaries with edge cases. The wheelchair vs piano example perfectly illustrates the capability perspective.
answer: |-
  Your debate perfectly illustrates a foundational tension in distributive justice, and while no *single* term captures every nuance, established concepts map directly onto your disagreement. Your "pattern" sits at the intersection of several key ideas:

  1.  **Equality of Resources vs. Equality of Welfare:**
      *   **Your View:** You advocate for **Equality of Resources** (Ronald Dworkin). Fairness means equal initial bundles of resources (money, services). Individuals then use these as they see fit, bearing responsibility for their choices.
      *   **Friend's View:** Your friend advocates for **Equality of Welfare** (some utilitarians, welfare egalitarians). Fairness means equal levels of well-being, satisfaction, or preference-fulfillment. Resources are merely tools to achieve this end state.
      *   **The Conflict:** As you discovered, identical resource distributions can lead to vastly unequal welfare (due to differing needs), and forcing equal welfare might require massively unequal resources (due to differing abilities to convert resources into welfare). Neither view presupposes the other is *wrong*; they prioritize different fundamental values (choice/responsibility vs. outcome/well-being).

  2.  **The Capability Approach (Amartya Sen, Martha Nussbaum):**
      *   **The Bridge Concept:** This directly addresses the core issue of *what* should be equalized. Sen argues against equalizing resources *or* welfare. Instead, fairness should focus on **Capabilities** – the real substantive **freedoms** people have to achieve valuable "functionings" (states of being and doing, like being educated, healthy, mobile, respected).
      *   **Relevance:** It distinguishes between the *means* (resources) and the *opportunities* (capabilities) they provide. A child needing a wheelchair ramp isn't seeking more *resources* per se, but the *capability* to access the school – a fundamental functioning. Your friend's concerns about "benefit" map onto achieving essential functionings (being educated, healthy). Your concern about "what is given" maps to resources.
      *   **Solving the Stubborn Case:** This framework distinguishes **needs** (required for basic capabilities/functionings) from **expensive tastes/preferences** (luxury functionings). Providing a ramp enables the core capability of *mobility* necessary for education. Funding expensive hobbies enables non-essential functionings. Fairness requires compensating for deficits in *basic capabilities*, not catering to expensive preferences. The "relevant difference" is whether the requirement is **necessary for achieving a fundamental human capability or functioning essential to participation in society.**

  3.  **Luck Egalitarianism (Dworkin, Cohen, Arneson):**
      *   **The Responsibility Angle:** This refines resource/welfare equality by focusing on **choice and brute luck**. The core idea: inequalities are unjust only if they arise from **circumstances beyond individual control** (brute luck - e.g., disability, family background). Inequalities arising from **individual choices** (option luck - e.g., expensive tastes developed freely) are acceptable.
      *   **Relevance:** This directly tackles your "pickiness" case. A child's medical need is **brute bad luck** – they shouldn't suffer disadvantage because of it. A family's "sheer pickiness" is (arguably) a matter of **choice/taste** – they *could* choose to be satisfied with standard provision. Fairness requires compensation for brute luck disadvantage, not for chosen expensive tastes. This provides a principled reason for treating the medical need and the hobby differently.

  **Where Your Pattern Fits & How It Differs:**

  *   **Core Pattern:** You've identified the conflict between **Resource Egalitarianism** and **Welfare Egalitarianism**. This is a classic, well-defined dichotomy.
  *   **Resolution Framework:** The **Capability Approach** offers the most compelling framework for resolving *which* differences in need should trigger compensation. **Luck Egalitarianism** provides the clearest rationale (brute luck vs. choice) for *why* medical needs and expensive tastes differ morally.
  *   **Distinction from Opportunity/Outcome:**
      *   Equality of Opportunity focuses on starting gates and rules (formal vs. substantive).
      *   Equality of Outcome focuses on end states (income, wealth, test scores).
      *   *Your debate cuts across this:* Both resource equality (your view) and welfare equality (your friend's) are types of *outcome* equality (outcome in resources vs. outcome in satisfaction). The capability approach focuses on *opportunities* (freedoms to achieve), not just starting points or end states. Luck egalitarianism focuses on the *causes* of outcomes.

  **Coining a Term: "The Currency of Equality Dilemma"**

  If you seek a single term capturing the specific phenomenon of arguing past each other using different metrics:

  *   **Term:** **Currency of Equality Dilemma**
  *   **Definition:** A fundamental disagreement about distributive justice arising when parties implicitly or explicitly measure fairness (equality/inequality) using incommensurable "currencies" (e.g., resources, welfare, capabilities), leading to mutually incompatible yet internally consistent judgments about the same distribution, with no higher agreed-upon standard to adjudicate between the currencies themselves.
  *   **Key Features:**
      *   Focuses on the *metric* ("currency") used to measure fairness.
      *   Highlights the *incommensurability* – you can't easily convert one currency into the other in a way that satisfies both definitions of fairness simultaneously.
      *   Emphasizes the *stalemate* caused by the lack of a shared higher principle to choose the currency.
  *   **Edge Cases:**
      1.  **The Expensive Taste / Genuine Need Boundary:** (As in your stubborn case). When does a costly preference become a non-negotiable component of basic well-being or capability (e.g., is a specific dietary need for religious/cultural reasons a "pickiness" or a core capability of identity/religious practice)? The capability approach (basic functionings) and luck egalitarianism (choice vs. unchosen identity) provide tools, but gray areas remain.
      2.  **Responsibility for Preferences:** How do we judge preferences shaped by unchosen circumstances (e.g., someone raised in extreme luxury develops expensive tastes)? Is this brute luck shaping preferences, or is the person still responsible? Luck egalitarians debate this heavily.
      3.  **Measuring Capabilities/Welfare:** While resolving the resource/welfare conflict, the capability approach faces its own measurement challenges. How do we define the "valuable" capabilities? How do we measure and compare complex capabilities? Welfare is famously difficult to measure objectively.
      4.  **Sacrificing One for the Other:** What if maximizing capability equality requires significant resource inequality? What if ensuring equal resources means some have severely diminished capabilities? The dilemma persists at the policy level.

  **Conclusion:**

  Your insightful debate centers on the clash between **Resource Egalitarianism** and **Welfare Egalitarianism**. The **Capability Approach** provides the most robust framework for determining *what* fundamental aspects of life should be equalized, shifting focus to real opportunities and freedoms. **Luck Egalitarianism** provides the clearest principle (brute luck vs. choice) for resolving your stubborn case about medical needs vs. expensive tastes – needs arising from unchosen brute luck warrant compensation; expensive tastes arising from choice do not.

  The "**Currency of Equality Dilemma**" names the specific pattern of disagreement stemming from these incommensurable metrics. The core puzzle of "which complaints a fair distribution is supposed to answer" finds its most compelling answers in the concepts of **basic capabilities** and **compensation for brute luck disadvantage**.
