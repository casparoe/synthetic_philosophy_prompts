prompt: |-
  I'm a novelist, currently at work on a multi-generational family saga set in a fading agricultural town, and I've run into a recurring craft problem that I've come to suspect is actually a philosophical problem. Again and again I find myself writing sentences of the form "the reason the family did X was to Y" where no character in the book holds that reason, ever held it, or could articulate it. The festival is held when it is held because that's when it has always been held; the narration, however, wants to say the festival exists to get grain into the hands of the poorest households before winter, even though not a single character — not even the priest who organizes it — would offer that explanation, and the origin of the date has something to do with a tax collection calendar nobody remembers. I gather that philosophers of mind and biology have a name for this kind of thing — reasons that exist without any reasoner, as in the pattern on a moth's wing existing "in order to" hide it from predators, a rationale nobody designed or believes in. I want a procedure, not a lecture.

  Please take on the role of a professional philosopher who works on teleology, functions, and explanation, and who has a pragmatic sympathy for working writers: someone who believes theory should end up as a tool that fits in a pocket. Before writing the procedure, please do some visible brainstorming: sketch the distinctions available from the philosophy of functions and reasons-without-reasoners — designed reasons, selected reasons, drift, accidental benefit — and say which of them a novelist plausibly needs and which are theoretical machinery that would only clutter the page. Then translate what survives into a step-by-step decision procedure I can run in fifteen minutes at my desk, mid-chapter, whenever I'm tempted to write one of these attribution sentences. It should tell me, in order: what to ask about the practice in question, what would count as a sufficient basis for the narration claiming a rationale no character holds, when the claim must instead be voiced by a character (and thereby become fallible and arguable), and when I must drop the rationale entirely and let the practice sit there, unexplained, the way most of what people do actually sits.

  I'd like the procedure to be honest about the point where it can't decide for me, since at bottom the question of whether a given attribution is true of my fictional world is a question about my own creation, and no procedure can settle what only I can enact on the page. Please flag that hand-off explicitly.

  Then run the procedure on three cases from my drafts, chosen to stress it:

  1. The harvest festival described above, where the narration wants to attribute a redistributive rationale that no character holds and no one designed, but where the town's actual history — as I've written it — plausibly shows the festival surviving because it performs that function, decade after decade, whatever anyone believes about it.

  2. An old prohibition on whistling after dark, which the narration wants to explain as having kept children indoors at night, though the characters believe it's about waking the dead, and I have written no selection history for it at all: no scene where families without the custom fared worse, nothing. It's just there.

  3. The family's silence about the dead grandfather, which the narration is tempted to explain "in order to" protect the mother from grief — a rationale that would be attributed to people who demonstrably do have beliefs and reasons of their own, which strikes me as a different beast entirely, possibly the case where the procedure should refuse and redirect me to characterization.

  I want at least one of these applications to end in an answer I won't like — my editor suspects the festival sentence is the best line in the book, and if the procedure kills it, say so plainly. Finally, tell me what the procedure cannot do: the kinds of attribution sentences it was never built to judge, and what I should do when I meet one. Feel free to propose a short list of diagnostic questions I can ask of any draft sentence of this type, phrased so I could tape them above my desk. Please think carefully and work through the brainstorming before committing to the procedure; I would rather see your reasoning change shape once than see a tidy answer you'd already decided on.
reasoning: |-
  Hmm, the user is a novelist working on a multi-generational family saga set in a fading agricultural town, and they're grappling with a specific craft problem that seems to have philosophical underpinnings. They keep writing sentences attributing reasons to actions or customs that no character in the story actually holds or could articulate—like saying a festival exists "to" redistribute grain, even though no one in the town thinks of it that way. They're aware of concepts from philosophy of mind and biology where reasons exist without a reasoner, such as biological functions like camouflage in moths. What they want is a practical, step-by-step procedure they can use mid-chapter to decide whether such attributions are valid in their fictional world, not a theoretical lecture.

  I need to approach this by first brainstorming the philosophical distinctions available from teleology and functional explanations. The key concepts include designed reasons (intentional design by agents), selected reasons (Darwinian natural selection), drift (features that persist without adaptive benefit), and accidental benefit (incidental advantages with no causal role in persistence). For a novelist, the most relevant are selected reasons and accidental benefit—these map to evolutionary biology where functions arise from consequences, not intentions. Designed reasons are less useful here because the user explicitly says no character holds the rationale. Concepts like drift or etiological functions might overcomplicate things for a fiction writer; they need simplicity.

  Translating this into a procedure, I should make it pragmatic and tool-like. The procedure needs to answer: when can the narration claim a rationale no character holds, when must it be voiced by a character (making it fallible), and when should it be dropped entirely. It should start with questions about the practice: Does it have a history of persistence? Does the benefit causally explain that persistence? Is the rationale held by any character? Then, based on answers, guide to decisions. Crucially, it must flag where the procedure can't decide—ultimately, the novelist creates the fictional world, so they have final authority.

  Now, applying the procedure to the user's three cases. First, the harvest festival: it has a written history showing it survived because of redistribution, no character holds the rationale, and the benefit explains persistence. Here, the narration can justifiably attribute the rationale—it's a selected reason. Second, the whistling prohibition: no selection history written, characters believe it's about the dead, and no causal link to keeping children safe. The procedure should say: drop the rationale; it's an unjustified leap. This might disappoint the user if their editor likes such a line, but it's honest. Third, the family's silence about the grandfather: characters have their own reasons, so attribution would misrepresent their psychology. Redirect to characterization; the procedure refuses here.

  For what the procedure can't do: it won't handle cases where the rationale is symbolic, metaphorical, or tied to unreliable narration. Also, it assumes a realist approach; if the user wants poetic license, that's beyond the procedure. Diagnostic questions should be tappable above the desk: "Who believes this? What's the causal history? Could I show instead of tell?"

  Throughout, I need to keep the user's needs in mind. They're seeking efficiency—a 15-minute desk tool—so the procedure must be clear and actionable. Their deeper need might be about authenticity in world-building: they want attributions to feel true to the fictional reality, not authorial intrusion. By stressing honesty in the procedure, especially in Case 2, I'm respecting their craft, even if it kills a favorite line. Finally, emphasizing that this is a helper, not a dictator; the novelist's choice reigns supreme.
answer: |-
  ## Philosopher's Craft Kit: Attributing Reasons Without Reasoners

  **Brainstorming: Teleological Toolkit (What's Useful, What's Not)**
  *   **Designed Reasons (Artifacts):** *"The clock chimes to mark the hour."* Clear intent by a designer. **Useful for human-made objects** but *not* for your cases where intent is absent.
  *   **Selected Reasons (Biology - Etiological Function):** *"The moth's wing pattern exists to camouflage it."* The pattern persists *because* past camouflage conferred a survival/reproductive advantage (natural selection). **CRUCIAL FOR YOU.** This is the core mechanism for "reasons without reasoners" in evolving systems (biological *or* cultural).
  *   **Accidental Benefit/Current Capacity:** *"The rock is useful as a paperweight."* It *can* serve a function now, but this played no role in the rock's existence or persistence. **RELEVANT BUT TRICKY.** If a practice has a benefit but it didn't *cause* the practice to persist, attributing a "reason" is often misleading. Use cautiously.
  *   **Drift:** *"The neutral gene variant persists by chance."* No function, no benefit, just random persistence. **RELEVANT.** Some practices *just are*, without any functional reason.
  *   **Systemic Role/Consequence Etiology:** *"The festival functions to redistribute grain."* Focuses on the current systemic consequence maintaining the practice. **MOST USEFUL SYNTHESIS FOR YOU.** It combines the *effect* (redistribution) with the *causal role in persistence* (it survives *because* of that effect), sidestepping intent. This is the workhorse for social practices.
  *   **Clutter to Avoid:** Complex debates about "proper function" vs. "malfunction," fine-grained distinctions in evolutionary biology (e.g., kin selection vs. group selection for *this* purpose), overly technical jargon ("teleonomy," "final cause").

  **The Core Distinctions You Need:**
  1.  **Does *any* character *believe* this reason?** (If yes, attribution *must* be voiced by them or shown as their thought).
  2.  **Does the practice *persist specifically because* of this consequence?** (Selected Reason / Systemic Role). This is the key justification for narrator attribution.
  3.  **Does the consequence exist but *not* cause persistence?** (Accidental Benefit). Attribution usually weak or misleading.
  4.  **Is there *no* consequential reason for persistence?** (Drift, Historical Accident). Attribution unwarranted.

  ---

  **The Novelist's Teleology Procedure: A 15-Minute Desk Check**

  **Step 1: Interrogate the Practice (Ask):**
      *   **A1. Belief Check:** Does *any* character (past or present, major or minor) hold, or could plausibly hold, the rationale I want to attribute? (Yes/No/Uncertain)
      *   **A2. Persistence Mechanism:** *Why* does this practice exist *now*? Is there a written/implied history showing it (a) was *designed* for a purpose (even if forgotten), (b) *survived/changed* because of the consequence I want to name, (c) just *drifted* along unchanged, or (d) its origin/persistence is truly unknown/mysterious *in the text*?
      *   **A3. Consequence Reality:** Does the consequence I want to name (Y) *actually occur* in the fictional world as a result of the practice (X)? (Not "could it?", but "does it?" as established by the narrative).
      *   **A4. Consequence -> Persistence Link:** Is there evidence *within the fictional world I've built* (historical scenes, comparative logic, systemic logic) that this consequence (Y) is a *significant factor causing the practice (X) to persist* over time? (i.e., Would removing Y likely lead to X fading? Did X survive challenges *because* Y was beneficial?).

  **Step 2: Decide Attribution (Based on Answers):**
      *   **IF (A1 = Yes):** **STOP.** The rationale *belongs to a character*. You **must** express it *through* character voice, thought, dialogue, or clearly focalized narration. It becomes fallible, arguable, and part of characterization. *Do not* attribute it impersonally as narrator fact. *Proceed only if A1 = No.*
      *   **IF (A1 = No) AND (A3 = Yes) AND (A4 = Strong Evidence):** **ATTRIBUTE.** The narration can *justifiably* state "The reason for X was Y" or "X served to Y". This is the "Selected Reason / Systemic Role" justification. The rationale exists as a *causal force in the world's mechanics*, independent of belief.
      *   **IF (A1 = No) AND (A3 = Yes) AND (A4 = Weak/Nonexistent):** **CAUTION / REWORD / SHOW.** Attribution is likely misleading (Accidental Benefit). *Instead:* Show the consequence happening. Use descriptive language: "Unbeknownst to them, X always resulted in Y," "A side effect of X was Y," "Over the generations, X had come to ensure Y, though no one planned it." *Avoid* "in order to" or "the reason was".
      *   **IF (A1 = No) AND (A3 = No) OR (A2 = Drift/Unknown & A4 = No):** **DROP IT.** There is no sufficient basis for the narrator to claim this rationale. Let the practice sit unexplained. Use simple description: "They held the festival on the old date," "Whistling after dark was forbidden," "They never spoke of Grandfather." Embrace the opacity. *This is often the most realistic choice.*
      *   **IF (A1 = Uncertain) OR (A4 = Ambiguous):** **FLAG & CHOOSE.** *This is the hand-off.* The procedure highlights ambiguity. You must now *make a creative decision* based on your authorial intent:
          *   Do you *want* the rationale to be a true, unseen force? Then strengthen A4 implicitly/explicitly in the text and attribute.
          *   Do you *want* the rationale to be a potential character misinterpretation? Then have a character voice it (making A1 = Yes for them).
          *   Do you *want* ambiguity or mystery? Then reword cautiously (as in Weak A4) or drop it.

  **Step 3: Execution:**
      *   **ATTRIBUTE:** Write the sentence clearly and declaratively as narrator fact.
      *   **CHARACTER VOICE:** Weave the rationale into dialogue, thought, or focalized narration.
      *   **REWORD/SHOW:** Craft sentences focusing on consequence, effect, or description without implying intent/purpose.
      *   **DROP:** Describe the action/practice neutrally. Resist the explanatory urge.

  ---

  **Application to Your Cases:**

  1.  **The Harvest Festival:**
      *   A1 (Belief): No (as per you).
      *   A2 (Persistence): Selected? You state: "plausibly shows the festival surviving because it performs that function."
      *   A3 (Consequence Real): Yes (grain redistributed).
      *   A4 (Link): Strong (You state survival is *because* of redistribution, decade after decade).
      *   **Decision: ATTRIBUTE.** The narrator *can* justifiably state the redistributive rationale as the (unrecognized) reason for its timing/persistence. It's a systemic role. **Your editor might be right – the line can stand.**

  2.  **Whistling Prohibition:**
      *   A1 (Belief): No (characters believe 'waking dead', not child safety).
      *   A2 (Persistence): Unknown/Drift (You state: "no selection history... It's just there.").
      *   A3 (Consequence Real): *Maybe?* Did it *actually* keep children in? Unstated. Probably assumed, but not shown.
      *   A4 (Link): **None.** Crucially, you state *no* evidence it persisted *because* it kept kids safe. It might be drift, or persisted *because* of the belief about the dead.
      *   **Decision: DROP IT.** There is *no basis* for the narrator to claim a child-safety rationale. It's an unsupported imposition. Attribute the *belief* ("They believed whistling woke the dead...") or describe the prohibition neutrally. **This is the answer you won't like. The procedure kills the child-safety attribution.** (You *could* move to Flag & Choose and *decide* to invent a selection history, but per your draft, it doesn't exist).

  3.  **Silence about Grandfather:**
      *   A1 (Belief): **YES.** You state: "people who demonstrably do have beliefs and reasons of their own." This is key.
      *   **Decision: STOP at Step 2 (A1=Yes).** The rationale *cannot* be impersonally attributed by the narrator. You **must** express it through character perspective (e.g., "John stayed silent, thinking it spared Mother," or "They told themselves the silence protected her," or focalize through a character believing this). The procedure refuses narrator attribution here. Redirect to characterization and character voice.

  ---

  **What the Procedure Cannot Do:**

  1.  **Judge Poetic Truth or Metaphor:** If you write "The festival existed to bind the town's wounds," as a lyrical metaphor, the procedure isn't designed for that. It assumes a claim about *fictional-world causality*.
  2.  **Handle Unreliable Narration:** If your *narrator* is fallible and might be imposing rationales, that's a narrative voice choice, not a teleological judgment about the world. The procedure assumes a generally reliable narrator stating world-facts.
  3.  **Decide Authorial Intent:** *Why* you want to attribute a rationale (thematic resonance, pacing, irony) is your creative domain. The procedure only judges *whether* it's justifiable within the world's established logic.
  4.  **Resolve Deep Ambiguity:** It flags it and hands off. You must decide what kind of world you're building.
  5.  **Replace Show-Don't-Tell:** Even justified attributions can sometimes feel heavy-handed. The procedure says you *can* do it, not that you *should* overuse it. "Showing" the consequence is often stronger.

  ---

  **Desk-Tape Diagnostic Questions (For any "The reason for X was Y" draft sentence):**

  1.  **WHO BELIEVES IT?** (If *anyone* in the story does, it's *their* thought, not yours (the narrator's)).
  2.  **WHY DOES X PERSIST?** (Does consequence Y *actually cause* X to stick around? Show your work!).
  3.  **COULD I SHOW Y HAPPENING?** (Often better than stating the reason).
  4.  **IS THIS MY MEANING OR THE WORLD'S?** (Am I imposing, or revealing a hidden gear?).
  5.  **CAN IT JUST *BE*?** (Does explanation add truth, or just noise?).

  This procedure gives you a philosophical warrant for those powerful, omniscient-seeming lines *when your world supports them*, forces you to ground them in consequence-and-persistence, protects character interiority, and gives you permission to let mystery be. Use it to build a world where reasons can hum beneath the surface, unseen but real, or where actions simply *are*, heavy with the weight of unexplained tradition. The choice, ultimately, is yours on the page.
