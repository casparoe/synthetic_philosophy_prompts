prompt: |-
  I'm a PhD student in condensed matter physics, and my partner's dad (a retired chemist who reads a lot of pop philosophy of science) cornered me at Thanksgiving about scientific realism. His summary went something like: "The pessimistic meta-induction is the killer argument here. Laudan went through the history books and showed that basically every successful scientific theory ever proposed -- phlogiston, caloric, the luminiferous ether -- turned out to be flat-out false. So by simple induction, our current theories, which are successful in exactly the same way, are almost certainly false too. And since the only argument realists ever had was 'success would be a miracle unless the theories were true,' realism is dead on arrival. Once you accept that, you end up where you should have been all along: science is just useful myth-making, and our theories are instruments for prediction, not attempts to describe reality."

  He said it very confidently and I didn't push back, but something about it feels off. I'm inclined to think there's a real argument buried in there -- I've heard the phlogiston/ether examples before -- but the leap at the end to "science is myth-making" felt way too fast. I also vaguely remember someone telling me that realists have responses to this, something about the details of which past theories actually count as successful, but I don't know enough to say where his version is fair and where it's slanted.

  You're a professional philosopher of science who's spent a lot of time on the realism debates, so please think carefully before answering -- it might help to first brainstorm what a realist would concede versus dispute, and then write your audit.

  Please structure your response with these sections, in this order:

  1. "What he got right" (~150 words) -- the parts a careful philosopher of science would sign off on.
  2. "Where he bends the truth" (~350 words) -- the subtle overstatements and conflations, explained so a physicist can follow.
  3. "Does his conclusion survive the corrections?" (~200 words) -- given only the accurate parts, how much of the "science is myth-making" landing point actually follows.
  4. "What I should say next Thanksgiving" (~100 words) -- a short, non-condescending reply I could actually give him at the table.
