answer: |-
  Here is an exam question designed to push students beyond superficial summaries, requiring direct engagement with the text's complexities, along with a model answer, marking scheme, and A/B differentiation:

  **Essay Question (Answer in approx. 60 minutes):**

  "At NE V.5 1133a5-1133b28, Aristotle analyzes exchange (ἀλλαγή) using the builder and doctor example. He claims exchange requires equality established according to proportionate reciprocity, facilitated by money measuring need (χρεία). However, this analysis raises interpretive tensions:

  1.  **Proportionality Puzzle:** Aristotle insists equality is between the *persons* (e.g., builder and doctor, 1133a16-18), yet the arithmetical example (1133a22-26) pairs houses and medical services. Precisely *what* is being proportioned to *what*? Is it goods to goods, persons (as producers) to persons, persons to goods, or something else?
  2.  **Pre-Money Constraint:** Aristotle presents barter as the fundamental case needing equalization (1133a26-30), with money introduced later to facilitate it. If exchange requires equality *before* money exists, what essential function does money *add* beyond representing pre-existing equalities? Does it create the equality or merely express it?
  3.  **Status of Need:** Need (χρεία) is called the "one thing" that makes all goods commensurable (1133a26-28). But Aristotle notes money's purchasing power fluctuates while the unit remains fixed (1133b10-13), implying need is unstable. How *exactly* does need function as a measure? Is it an objective standard, a subjective desire, the condition for exchange, or something else? Why does this fluctuation not undermine justice?

  **Your Task:** Choose **ONE** of these tensions (1, 2, or 3). Explain clearly and concretely **why this tension arises specifically from Aristotle's text** in V.5, citing key phrases/lines (e.g., 1133aXX). Then, argue for **how Aristotle attempts to resolve or navigate this tension within the chapter itself**, again using specific textual evidence. Do not rely on secondary literature; ground your answer solely in NE V.5."

  ---

  **Model Answer (Focus on Tension 1: Proportionality Puzzle - ~600 words):**

  Aristotle's exchange analysis in V.5 generates a significant tension regarding the object of proportionality due to seemingly conflicting claims about what is being equalized. On the one hand, he emphatically states that equality must hold between the *persons* involved in the exchange, not just their products: "For it is not two doctors that associate for exchange, but a doctor and a farmer, and in general people who are different and unequal; but these must be equated" (1133a16-18). Justice in exchange, therefore, seems fundamentally concerned with the relationship between the exchangers *as persons* – the builder and the doctor themselves.

  However, the mechanism he describes for achieving this equality appears to focus squarely on the *products*. He outlines the need for a proportional relationship: "As builder is to shoemaker, so must the number of shoes be to a house" (1133a22-23, cf. 1133a32-34). The arithmetical operation he sketches involves finding a mean between the products (house and medical service) to establish equivalence (1133a24-26). This strongly suggests that the *goods themselves* are being proportioned, with the ratio of the persons' *productive roles* (builder:doctor) determining the ratio of the *quantities* of goods exchanged (shoes:house or service:house).

  The tension arises because it's unclear how proportioning the *goods* based on the producers' *roles* directly establishes equality between the *persons themselves*. If the equality is between persons, why is the calculation centered on pairing quantities of disparate goods using the producer-role ratio? The text doesn't explicitly bridge this gap, leaving us to wonder if the person-to-person equality is achieved *through* the product-to-product proportion based on producer roles, or if something else is intended.

  Aristotle navigates this tension, though perhaps incompletely, by tightly linking the person's *productive capacity* or *function* (ἔργον) within the community to the value of their product. He frames the exchange within the context of the political community (πόλις) held together by reciprocal proportion (1132b33-34, 1133a25-30). The builder *is*, definitionally, a house-producer, and the doctor *is* a health-provider. Their social identities and contributions *are* their productive functions. Therefore, establishing a proportion between the *products* (house and medical service) that reflects the relative value of the *functions* (building and doctoring) to the community *is*, simultaneously, establishing a proportional relationship between the *persons* *in their capacity as contributors*.

  The key supporting evidence is Aristotle's introduction of the producer-role ratio *as the determinant* for the product ratio: "All goods must therefore be measured by some one thing... This unit is in truth need (χρεία)... but for the purpose of *existence* (πρὸς γὰρ τὴν χρείαν) money has become by convention a sort of representative of need... Let A be a house, B ten minae, C a bed. A is half of B if the house is worth five minae... There will be the same exchange" (1133a26-1133b5, paraphrased/condensed). Money measures the need satisfied by the *function* (the house-shelter, the medical service-health), and the proportion (builder:doctor :: shoes:house) aims to equate the *value of the contributions* made by the persons performing those functions. The equality between persons *as exchangers* is thus constituted *by* the proportional equivalence of the *social value* of their functional outputs, mediated by need and measured by money. While the calculation operates on goods, the underlying equality sought is between the exchangers' contributions to the communal good, resolving the tension by collapsing the distinction between person-as-producer and product-value within the civic context.

  ---

  **Marking Scheme (Total: 20 Marks):**

  1.  **Clear Identification & Textual Grounding of the Chosen Tension (4 marks):** Accurately describes one specific tension (1, 2, or 3) *as it arises from Aristotle's own words* in V.5, citing *at least two* relevant, specific passages/lines (e.g., "Aristotle states X at 1133aY, but then says Z at 1133bW, creating tension because..."). *(Typical Miss: Vague description of the tension without specific, contradictory textual references, or misrepresenting the text.)*
  2.  **Analysis of the Tension's Source (4 marks):** Explains *precisely why* the cited passages generate a conceptual difficulty or inconsistency within Aristotle's argument, demonstrating understanding of the philosophical problem embedded in the text. *(Typical Miss: Simply restating the tension or the quotes without explaining the logical conflict or interpretive challenge they pose.)*
  3.  **Textual Argument for Aristotle's Resolution (6 marks):** Identifies and explains *using specific textual evidence* (at least two key passages/lines) how Aristotle attempts to address, resolve, or navigate the chosen tension *within V.5*. Must go beyond stating the solution; must show *how the text supports* that solution in relation to the tension. *(Typical Miss: Offering a plausible resolution not grounded in cited V.5 text, or merely restating Aristotle's general claims (e.g., "need commensurates") without connecting them specifically to resolving the tension.)*
  4.  **Critical Engagement with the Resolution (4 marks):** Assesses the *effectiveness* or *coherence* of Aristotle's attempted resolution based *on the textual evidence presented*. Does the proposed resolution actually solve the problem? Does it create new questions? Is it consistent with other parts of the passage? *(Typical Miss: Simply describing Aristotle's solution without evaluating its success in addressing the tension, or introducing external arguments not based on V.5.)*
  5.  **Structure, Clarity & Focus (2 marks):** Answer is well-organized, focused solely on the chosen tension and V.5, and written clearly. *(Typical Miss: Rambling, unfocused, includes irrelevant material from other parts of the NE or secondary sources.)*

  ---

  **A vs. B Answer Differentiation:**

  *   **A Answer (Typically 17-20 marks):** **Distinguished by rigorous textual substantiation and precise argumentation.** It consistently uses *specific, well-chosen citations* not just to identify the tension and Aristotle's proposed resolution, but crucially to *demonstrate how the cited text actively generates the tension* and *how the cited text actively supports the proposed resolution*. The analysis of the resolution's effectiveness is tightly tied to the implications of the cited passages. The argument flows logically from the text itself.
  *   **B Answer (Typically 13-16 marks):** Demonstrates a good understanding of the tension and Aristotle's general position, using *some relevant citations*. However, it **lacks the consistent, deep integration of specific text to drive the core argument** about the tension's source and resolution. Citations may be present but are less precise, less well-chosen to prove the point, or their connection to resolving the specific tension is asserted rather than demonstrated through close reading. The evaluation of the resolution might be less firmly anchored in the nuances of the cited passages. It shows comprehension but not the same level of *demonstration* through textual evidence.
