prompt: |-
  I teach a second-year course in ethical theory, and next week's ninety-minute discussion section has to cover Bernard Williams's two complaints against utilitarianism: the integrity objection — that the theory treats agents merely as locations where the general good gets advanced, overriding the ground projects that partly constitute who they are — and the 'one thought too many' point, aimed at consequentialists who reply that a person can go on saving her drowning spouse, with the theory's own indirect blessing, once she takes the right background attitude toward her devotion. My worry is that students will file both under the heading of utilitarianism demanding too much calculation and never notice that the objections cut in different directions: one is about what the theory instructs agents to do, the other about how the theory lets agents think and justify. Don't explain Williams to me; plan the section. Specifically: (1) the order in which the pieces must arrive, and which has to come first — the alienation worry about projects or the thought-too-many worry about reasons — given that each can be made to look like a restatement of the other; (2) the single example that should carry the section and what it must have and lack — consider whether the standard drowning-spouse case should be adapted, since its melodrama and its pairing of spouse against stranger tend to derail discussion toward partiality and gender rather than the structure of the justification, and say exactly how you would adapt or replace it; (3) a pair of cases to be constructed live during the section in which one agent satisfies the integrity constraint but fails the thought-too-many test and another passes the latter while failing the former — I want the students to see that the objections are separable and that each closes off a different escape route for the consequentialist; (4) the misconceptions to expect, in the order they will surface — I anticipate integrity being read as mere psychological well-being, one thought too many being read as simple overthinking, and the sophisticated-consequentialist move of separating the criterion of rightness from the decision procedure, which students will deploy as though it were a knockdown reply to both objections at once — and the point in the sequence at which each should be absorbed rather than merely rebutted; (5) the closing question that would distinguish a student who has merely found the phrase charming from one who can say which utilitarian reply each objection forecloses; and (6) what I should openly decline to cover — Williams's larger critique of morality as a distinctive institution, comparisons with the complaint that verdicts based solely on consequences corrupt the concept of the moral, and the question whether integrity has any value when the projects it protects are rotten — with a sentence on why omitting each helps rather than hurts. No reading list and no citations; I will supply those myself.
reasoning: |-
  Okay, the user teaches ethical theory and needs a plan for a 90-minute discussion on Bernard Williams' objections to utilitarianism. They're concerned students might conflate the integrity objection and the "one thought too many" critique. Let me unpack their requirements.

  First, the user wants a clear sequence that prevents students from seeing these objections as restatements of the same problem. The integrity objection focuses on how utilitarianism overrides personal projects, while "one thought too many" deals with justification structures. I need to ensure the lesson plan highlights this distinction.

  For part (1), the order matters. Starting with integrity makes sense because it's about what the theory demands from agents, which is more concrete. Then transitioning to "one thought too many" shows how the theory's justification creates alienation. If done in reverse, students might miss the core distinction.

  Part (2) requires a central example. The drowning spouse case is problematic due to melodrama and partiality issues. Adapting it to a community volunteer scenario could work better - say a flood rescuer choosing between saving a stranger or a community project vital to their identity. This removes spousal bias and focuses on project justification.

  For part (3), I need two live-constructed cases. One where an agent satisfies integrity but has "one thought too many" (e.g., a doctor prioritizing research over patients but justifying it correctly). Another where an agent acts spontaneously but violates integrity (e.g., someone abandoning their life project for immediate utility). This demonstrates the objections target different failures.

  Anticipating misconceptions (part 4): Students will likely conflate integrity with psychological well-being early on. I should address this during the initial case discussion by emphasizing constitutive projects. The "overthinking" misinterpretation of "one thought too many" will emerge later - best handled when contrasting the volunteer's spontaneous vs calculated actions. The criterion/decision-procedure distinction will appear as a knee-jerk defense; I'll acknowledge its partial validity while showing why it doesn't resolve alienation.

  The closing question (part 5) should test if students recognize which utilitarian escape routes are blocked: integrity objections challenge indirect strategies that preserve projects instrumentally, while "one thought too many" undermines any justification that requires moral calculation.

  Finally (part 6), omitting Williams' broader morality critique keeps focus tight. Skipping conceptual corruption debates avoids sidetracking. Not judging rotten projects maintains focus on structural issues rather than content. These omissions prevent scope creep.

  Throughout, I'll use Socratic questioning to help students discover distinctions themselves. Timing is tight - need strict 15-min blocks per segment with clear transitions.
answer: |-
  Here’s a structured 90-minute plan focused on separating Williams’ objections, preempting misconceptions, and forcing students to see the distinct escape routes each blocks for utilitarianism:

  **Core Objective:** Distinguish the *structural conflict* (integrity) from the *justificatory alienation* (one thought too many).

  **(1) Order & Why:**  
  *   **Start with Integrity (Min 0-30):** Focus on the *agent’s constitutive projects being overridden*. This is concrete ("What must the agent *do*?") and establishes the conflict between personal identity and impersonal demands.  
  *   **Transition to One Thought Too Many (Min 30-60):** Shift to *how the agent justifies/resolves* that conflict. This highlights the theory’s *internal* demand for a specific reflective attitude, even when permitting the "right" action.  
  *   **Why:** Integrity establishes the *problem of demand* (theory vs. self). One Thought Too Many reveals the *problem of justification* (theory’s intrusion into motive/reflection). Reversing order risks making integrity seem *only* about overthinking, not about fundamental conflict.

  **(2) Central Example - "The Community Organizer & the Flood":**  
  *   **Adaptation:** Replace drowning spouse with a dedicated community organizer facing a sudden flood. Their long-term project is revitalizing a struggling neighborhood center (their life’s work). They see two people trapped: a stranger and the center’s sole major donor (crucial for the center’s survival). They save the donor.  
  *   **What it Has:**  
      *   Concrete "ground project" (center) *constitutive* of identity.  
      *   Conflict: Saving donor saves project, saving stranger is impersonally better.  
      *   Motivation: Saving donor stems *directly* from commitment to the project.  
  *   **What it Lacks:**  
      *   Spousal intimacy/gender dynamics (avoids partiality derailment).  
      *   Equal value victims (donor ≠ stranger in project terms).  
      *   Melodrama reduced (flood = natural disaster, not personal peril).  
  *   **Focus:** *Why* the organizer saves the donor – it’s an expression of their project, not a calculation.

  **(3) Live Case Construction (Min 60-75):**  
  *   **Goal:** Show objections are independent by creating agents who satisfy one but fail the other.  
  *   **Case A (Satisfies Integrity, Fails One-Too-Many):**  
      *   *Agent:* A doctor deeply committed to her rural clinic (ground project).  
      *   *Scenario:* A pandemic hits. She must choose: Stay at her struggling clinic serving her community OR join a high-profile city research team developing a vaccine (saves more lives).  
      *   *Action/Justification:* She stays at her clinic. **BUT** she explains: "I only stayed because I calculated that my long-term impact here, plus the guilt I’d feel leaving, outweighs the vaccine work’s benefits."  
      *   *Analysis:* Her *action* aligns with her project (integrity satisfied), but her *justification* invokes impersonal calculation (one thought too many – she alienates herself from her own motive).  
  *   **Case B (Passes One-Too-Many, Fails Integrity):**  
      *   *Agent:* An artist whose identity is built around a specific, demanding craft.  
      *   *Scenario:* He unexpectedly inherits vast wealth. He could pursue his art full-time OR fund a highly effective malaria net charity saving thousands.  
      *   *Action/Justification:* He instantly donates all the money, saying: "It was obvious! Think of the lives saved! My art? Well, that’s just my little hobby, I guess."  
      *   *Analysis:* His *justification* is direct, non-calculative concern for consequences (no one thought too many). **BUT** his action *utterly dismisses* his constitutive project as insignificant (integrity violated).  

  **(4) Misconceptions - Order & Absorption:**  
  1.  **Integrity = Psychological Well-Being (Surfaces Early - during initial Community Organizer discussion)**  
      *   *Absorb:* When discussing the organizer’s motive. Ask: "Is their distress *just* about feeling bad, or is it about *who they are*? If the center burned down but they felt fine, would Williams be satisfied? No – the project itself is attacked." Connect to constitutive projects.  
  2.  **One Thought Too Many = Simple Overthinking (Surfaces when contrasting Organizer’s spontaneous action vs. potential calculation)**  
      *   *Absorb:* When contrasting "I saved the donor *because* the center matters to me" vs. "I saved them *because* it maximizes value via my project." Emphasize the *alienation* – the latter justification makes the project an *instrument*, not a source of direct motivation. Ask: "Does the calculation *replace* the personal commitment?"  
  3.  **Criterion/Decision-Procedure Distinction Solves Everything (Surfaces when discussing *any* Consequentialist 'solution' - likely after both objections)**  
      *   *Absorb:* When discussing sophisticated replies. Concede it *might* address "what to do" externally. Then press: "Does using the project *as a rule* preserve the *internal* connection to it as constitutive? Or does it turn the project into a tool? (Integrity). And *must* the agent ultimately justify their rule by its consequences, introducing the alienating thought? (One Too Many)." Show it’s a band-aid, not a cure.

  **(5) Closing Question (Min 85-90):**  
  *"Williams argues each objection blocks a different way utilitarianism might try to accommodate our deep commitments. For the Integrity Objection, which utilitarian escape route does it specifically foreclose? For the One Thought Too Many objection, which different route does it foreclose?"*  
  *   **Charming Phrase Answer:** Vague restatements ("It demands too much," "It makes you think too much").  
  *   **Target Answer:**  
      *   **Integrity:** Forecloses strategies that try to *instrumentalize* ground projects (e.g., "indirect" utilitarianism allowing projects *only* because they *happen* to promote utility). It shows projects must be valued non-instrumentally *by the agent*, which utilitarianism cannot ultimately permit.  
      *   **One Thought Too Many:** Forecloses strategies that separate action from motive/justification (e.g., "Just *do* the loving thing, the theory blesses it later!"). It shows the consequentialist *justification itself*, even as background, alienates the agent from their direct motives.

  **(6) Omissions & Why:**  
  *   **Williams’ Critique of "Morality" as an Institution:** Omitting this prevents conflating the specific utilitarian objections with his broader meta-ethical project. *Helps* focus on the *internal* problems for consequentialism.  
  *   **Consequentialism Corrupting "The Moral":** Omitting debates about moral concepts avoids getting sidetracked into semantic/metaphysical discussions. *Helps* maintain focus on the *experiential* and *practical* alienation Williams highlights.  
  *   **Value of Integrity with Rotten Projects:** Omitting this prevents the discussion from veering into whether Williams' view is "selfish" or condones evil. *Helps* keep focus on the *structural* point: *Any* constitutive project is threatened by utilitarianism's structure, regardless of content. Evaluating content is a separate issue.

  **Section Flow:**  
  1.  (0-10 min) **Set Up:** Recap Utilitarianism's core demand (maximize good). Frame Williams' challenge: Is there space for *me*?  
  2.  (10-30 min) **Integrity via Community Organizer:** Focus on the *conflict* and what overriding the project *does to the agent*. Identify the project as constitutive. Debunk psych well-being.  
  3.  (30-50 min) **One Thought Too Many:** Contrast Organizer's direct motive ("Save the center!") with a hypothetical calculative justification ("Saving donor = best for utility via project"). Highlight the alienation in the latter. Debunk simple overthinking.  
  4.  (50-60 min) **Why Different?:** Explicitly contrast: Integrity = Conflict between project & demand (What I must *do*). OTTM = Problem with the theory's required *attitude/justification* (How I must *think*).  
  5.  (60-75 min) **Live Case Construction:** Build Cases A & B to demonstrate independence.  
  6.  (75-85 min) **Consequentialist Replies & Limits:** Explore sophisticated moves (indirect, criterion/procedure). Show why they don't fully resolve *either* objection using Cases A/B and misconceptions.  
  7.  (85-90 min) **Closing Question & Wrap-up.**
