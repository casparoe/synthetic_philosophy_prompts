prompt: |-
  I've been reading up on how two countries handled basically the same problem in almost opposite ways, and I'm trying to figure out what each approach actually presupposes philosophically. In Canada, after the near-miss of the 1995 Quebec referendum, the Supreme Court's 1998 reference said secession would require a clear majority on a clear question, and that this would trigger only an obligation to negotiate, not a right to secede; Parliament then passed the Clarity Act in 2000, which gives the House of Commons a say on whether a question counts as clear and refuses to specify any numeric threshold for the majority. In the UK, by contrast, the 2012 Edinburgh Agreement just let Scotland run a single-question referendum on simple majority, on a question the Scottish government itself had a hand in shaping, with the UK government agreeing in advance to respect the result -- 50% plus one was enough in principle, no clarity test, no negotiation threshold. So one system builds in gatekeeping and ambiguity about how big the Yes has to be, and the other treats a bare majority on a straightforward question as enough.

  What theory of self-determination does each of these practices presuppose, if any? I keep going back and forth. On one reading the Clarity Act only makes sense if you assume something like the remedial-rights view -- that there's no general right to secede, only a right triggered by serious injustice or exclusion, and since Quebec wasn't obviously in that position, all the fudge factors (clear question, clear majority, obligation to negotiate rather than to secede) are ways of raising the bar without ever saying so out loud. On another reading it presupposes almost the opposite: a purely plebiscitary view where anyone who'd secede from Canada has to really mean it, precisely because the majority's will does matter so much. And the Edinburgh Agreement looks like the clean plebiscitary case, but even there the 2014 "No" side spent the campaign saying it was a once-in-a-generation decision and the UK later refused a rerun, which seems to smuggle the supermajority idea back in through the timing rather than the threshold. Plus Canada lowered the voting age for neither while the UK let 16 and 17 year olds vote in 2014 -- do the two systems even agree on who the relevant "people" is?

  So here's what I actually want: reconstruct the implicit theory of self-determination in each practice, say where each is underdetermined (i.e., what different theories of the right to secede would license the same practice), and tell me whether the apparent inconsistency between the two is real or just reflects a deeper shared commitment -- maybe something like an agreement that legitimacy comes from negotiation between two majorities rather than from any unilateral democratic act. And if you think one of these practices is quietly incoherent, I'd want to know what specifically would have to change to make it coherent. No need to survey the literature on secession, just the conceptual reconstruction of these two cases.
reasoning: |-
  Okay, let me unpack this user's query. They're comparing Canada's Clarity Act approach to Quebec secession with the UK's Edinburgh Agreement for Scotland. The user wants to understand the implicit theories of self-determination behind each and whether there's an underlying consistency. 

  Hmm, the user seems well-versed in the political history here - they reference specific years, court cases, and legislative acts accurately. Their frustration with contradictory interpretations is palpable. I notice they've already considered remedial-rights versus plebiscitary views but feel stuck. 

  The core tension they're wrestling with is: How can two liberal democracies approach secession so differently? Is one fundamentally more legitimate? They're smart to notice the voting age discrepancy - that's often overlooked in these comparisons. 

  What they're really asking for is philosophical archeology: digging below the surface practices to reconstruct each system's unstated assumptions about sovereignty. They want coherence assessment, not just description. 

  The Edinburgh Agreement's simplicity is deceptive - as the user notes, the "once-in-a-generation" rhetoric and blocked rerun introduce temporal gatekeeping. That's crucial. Meanwhile Canada's Clarity Act uses ambiguity strategically. Both are trying to solve the same problem: how to acknowledge self-determination without making secession too easy. 

  The user's hypothesis about "negotiation between two majorities" is perceptive. I'll develop that - both systems ultimately treat secession as inter-polity negotiation rather than pure popular will. The Canadian approach makes this explicit through mandated negotiations, while the UK implies it through Westminster's ultimate sovereignty. 

  On incoherence: the UK's position is shakier because refusing a second referendum after framing the first as generational reveals their latent majoritarianism. To fix this, they'd need to either embrace pure majoritarianism (allow frequent votes) or formalize gatekeeping criteria like Canada. 

  The voting age difference is significant - Canada's approach assumes a static demos while the UK temporarily expanded it, suggesting their "people" is more fluid. This deserves mention but shouldn't overshadow the core analysis.
answer: |-
  You've pinpointed the core tension brilliantly: two liberal democracies facing similar secessionist pressures adopt seemingly opposite frameworks, revealing deep philosophical divergences (and convergences) in their implicit theories of self-determination and sovereignty. Let's reconstruct the presuppositions behind each practice, identify underdetermined elements, and assess the consistency.

  1.  **Canada (Clarity Act Framework):**
      *   **Key Practice:** Secession requires (a) a "clear majority" on a "clear question" (as judged by the federal Parliament), (b) triggering only an *obligation to negotiate*, not an automatic right to secede, and (c) no pre-defined numerical threshold.
      *   **Implicit Philosophical Presuppositions:**
          *   **Sovereignty as Indivisible & Primarily Federal:** The Canadian Constitution presupposes the *federal state* as the primary, indivisible sovereign entity. While recognizing the distinct society of Quebec, it does not recognize Quebec (or any province) as a sovereign nation *within* Canada possessing an inherent right to unilaterally exit. The "people" entitled to determine the fate of the *whole* is the Canadian demos, represented by Parliament.
          *   **Self-Determination as Conditional & Procedural:** Secession is not a fundamental right of any sub-unit. It becomes a *possible outcome* only through a highly controlled process triggered by an extraordinary expression of will *within* the existing constitutional order. This process is fundamentally *intergovernmental negotiation*, not unilateral declaration.
          *   **Democratic Expression Must Be Unambiguous:** The requirement for "clarity" (both question and majority) presupposes that breaking up a complex, established liberal democracy requires an exceptionally clear and deliberate mandate. Ambiguity risks illegitimacy and chaos. Parliament's gatekeeping role assumes the federal legislature is the ultimate guardian of the constitutional order and national interest.
          *   **Protecting Minorities & Stability:** The framework implicitly prioritizes the stability of the existing constitutional order and the protection of minorities (including within Quebec and the rest of Canada) who would be profoundly affected. The negotiation requirement forces consideration of these complex consequences.
      *   **Underdetermined Elements (Compatible Theories):**
          *   **Remedial Right Only:** The framework *can* be justified by a purely remedial-right theory: since Quebec isn't suffering grave injustice, secession isn't a right, only a possibility if a clear majority demands it, triggering negotiations where the "remedy" might be something less than secession.
          *   **Plebiscitary Principle (Strict Gatekeeping):** It *can also* be justified by a plebiscitary view but one requiring an exceptionally high bar for legitimacy due to the gravity of dissolution. "Clarity" becomes the functional equivalent of a supermajority requirement without the political difficulty of naming a specific number. The "obligation to negotiate" acknowledges the *weight* of the majority's will, but filters it through the constitutional structure.
          *   **Primacy of Constitutional Order:** Both interpretations rely on the deeper presupposition that the existing federal constitutional framework defines the *only* legitimate process for fundamental change, including possible dissolution. Secession isn't an extra-constitutional "right" but a potential *result* of constitutional process.

  2.  **UK (Edinburgh Agreement Framework - 2014):**
      *   **Key Practice:** Agreement to a single, straightforward question ("Should Scotland be an independent country?"). Simple majority (50%+1) suffices. UK Government committed in advance to respect the result. Scottish Government heavily involved in setting the question. Voting age lowered to 16.
      *   **Implicit Philosophical Presuppositions:**
          *   **Parliamentary Sovereignty is Flexible & Permissive:** The UK Parliament remains sovereign but chooses to *devolve* the authority to hold a referendum and *pledges* to respect the outcome. Sovereignty isn't seen as threatened by the *process* of consultation; Parliament retains the ultimate power to enact (or theoretically ignore) the result, but its pledge creates a strong political/moral obligation.
          *   **Plebiscitary Principle as Primary:** The core legitimacy for secession stems directly from a majority vote on a clear question. The "will of the people" (of Scotland) is the decisive factor once the process is agreed upon. 50%+1 reflects the standard majoritarian principle of democratic decision-making.
          *   **Recognition of Scotland as a Distinct Political Community:** The entire process presupposes Scotland is a distinct nation ("people") entitled to express its collective will on its constitutional future *directly*, provided the sovereign Parliament consents to the vote. Lowering the voting age reinforced this by recognizing the unique stake of young Scots in the long-term outcome.
          *   **Negotiation as Implementation, Not Legitimization:** Unlike Canada, negotiation follows as a consequence of implementing the *already legitimized* decision to secede (if Yes won). The referendum result itself provided the primary legitimacy for independence; negotiation was about the terms, not the principle.
      *   **Underdetermined Elements (Compatible Theories):**
          *   **Primary Right (Ascriptive) Theory:** The process strongly aligns with the theory that nations (defined by shared identity/history) have a primary right to self-determination, including secession. The Edinburgh Agreement effectively recognized Scotland as such a nation-unit capable of exercising that right via plebiscite.
          *   **Plebiscitary Theory:** It is a near-textbook application of the plebiscitary principle: a clear vote by the affected population settles the matter.
          *   **Voluntarist Conception of Union:** Implicit is the idea that the UK is a voluntary union of nations, and any nation can choose to leave through a mutually agreed democratic process. The union's legitimacy rests partly on ongoing consent.

  **Addressing Apparent Inconsistency & Deeper Commitments:**

  *   **Is the Inconsistency Real?** Yes, at the operational level regarding the threshold and gatekeeping: Canada erects significant procedural hurdles and ambiguity; the UK (in 2014) adopted a straightforward majoritarian vote with minimal pre-vote federal gatekeeping.
  *   **Is there a Deeper Shared Commitment?** **Absolutely.** Both frameworks ultimately reject the idea that secession is a *unilateral democratic act* by the sub-unit. Legitimacy flows from a process involving **negotiation between two majorities/polities** within the existing constitutional order:
      *   **Canada:** Makes this explicit. The "clear majority" triggers an *obligation to negotiate* between Quebec and the rest of Canada (represented federally). Secession requires agreement *between* these parties. The Quebec "people" alone cannot decide; the Canadian "people" (via Parliament) must engage.
      *   **UK:** Makes this implicit. The *sovereign* UK Parliament (representing the whole UK demos) had to *agree* to devolve the authority for the referendum and *pledge* to respect the result. While the Scottish vote was decisive *if Yes*, the *permission* to hold the binding vote came from Westminster. The "No" campaign rhetoric and refusal of a rerun ("once-in-a-generation") highlight the understanding that the *UK-wide* polity (via Parliament) retains control over the *timing and frequency* of such fundamental consultations. The Scottish "people" couldn't unilaterally force another vote; it required renewed consent from the UK "people" (via Parliament).
  *   **Shared Commitment:** **Constitutional Dialogue over Unilateralism.** Both systems presuppose that dissolving a complex, integrated liberal democracy cannot be legitimately achieved solely by a simple majority vote within a sub-unit. It requires a process involving the broader state structure and recognition of the interests of the whole. Canada bakes negotiation into the *mandatory next step*. The UK required the sovereign Parliament's *prior consent* for the vote itself. Both reject secession as a simple act of majoritarian will within the seceding region alone.

  **Coherence Assessment:**

  1.  **Canada (Clarity Act):** **Conceptually Coherent.** Its internal logic is consistent: the federal state is sovereign; secession is a profound constitutional change; such change requires extraordinary clarity of will from the seceding unit *and* must be processed through negotiation with the federal sovereign representing the whole. The ambiguity ("clear majority") is a *feature* of its flexibility and political realism, not incoherence. It aligns with its core presuppositions.
  2.  **UK (Edinburgh Agreement & Aftermath):** **Latent Tension / Potential Incoherence.** The 2014 process was coherent *in isolation*: Parliament consented to a plebiscite; pledged to respect the result; majoritarian vote held. The incoherence arises in the *aftermath* and for *future* attempts:
      *   **The "Once-in-a-Generation" Claim:** This rhetorical device used by the "No" campaign (and later invoked to refuse a rerun) smuggles in a *de facto* supermajority/timing requirement *after* endorsing a simple majority vote. It contradicts the pure plebiscitary logic established by the Agreement itself.
      *   **Parliament's Absolute Discretion:** Parliament's refusal of a Section 30 order (required for a legally binding referendum) for a rerun, despite significant political support in Scotland, highlights the tension. The Edinburgh Agreement implied a plebiscitary right for Scotland *with consent*. The aftermath reveals the primacy of Westminster's ongoing consent, potentially rendering the 2014 vote a unique, non-replicable event rather than establishing a lasting principle. This undermines the "voluntary union" and "primary right" presuppositions seemingly embraced in 2014.

  **Making the UK Approach More Coherent:**

  To resolve the latent tension, the UK would need to choose and codify a clearer path:

  1.  **Embrace Pure Parliamentary Sovereignty (Minimal Coherence):** Explicitly state that any future referendum requires *ad hoc* Parliamentary approval based on current political judgment, with no presumption created by the 2014 agreement or result. Drop the "once-in-a-generation" rhetoric as a constitutional principle; it's just politics. (Least satisfying, but coherent with Westminster doctrine).
  2.  **Codify a Clearer Trigger Mechanism:** Establish statutory criteria (e.g., sustained supermajority in Holyrood, clear polling lead for independence over X years) that would oblige Westminster to grant a Section 30 order. This would formalize the "negotiation between majorities" concept and make the Scottish "people's" pathway clearer.
  3.  **Constitutional Entrenchment (Highly Unlikely):** Formally define the UK as a voluntary union of nations and embed a right for Scotland (and others) to hold an independence referendum by its own decision (e.g., via Holyrood supermajority) after a minimum period. This would fully embrace the primary right/plebiscitary view but fundamentally alter the UK constitution.

  **Conclusion:**

  *   **Canada** presupposes **sovereignty resides primarily in the federal state**, views secession as an **extraordinary constitutional process requiring unambiguous democratic mandate and mandatory negotiation**, and **rejects unilateralism**.
  *   **UK (2014)** presupposed **Parliamentary sovereignty can flexibly permit a plebiscite**, granting the **"people" of Scotland a decisive majoritarian vote** on a clear question once permitted, implicitly recognizing it as a **distinct nation-unit**.
  *   **Deep Shared Commitment:** Both ultimately ground legitimacy in **negotiation/consent between the seceding region and the broader state structure** (represented federally/centrally), rejecting unilateral secession based solely on a sub-unit's majority vote.
  *   **Coherence:** Canada's framework is conceptually coherent internally. The UK's 2014 process was coherent *at the time*, but the **aftermath revealed a latent incoherence** between the plebiscitary moment and Westminster's absolute, ongoing control over the *process* of self-determination. To achieve lasting coherence, the UK would need to formalize clearer rules about when and how Scotland's "people" can trigger a future vote, moving beyond *ad hoc* Parliamentary discretion. The voting age difference further highlights the unresolved question: **Who constitutes the relevant "people" for self-determination?** Canada assumes the existing provincial electorate; the UK temporarily expanded it, suggesting flexibility but no settled principle.
