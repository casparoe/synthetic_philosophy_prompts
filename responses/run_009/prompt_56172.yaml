prompt: |-
  I'm a senior analyst at a foreign-policy think tank, and honestly a huge part of my job is analogies. Every week some editor or deputy director asks me whether X is "another Munich," whether we're "getting dragged into another Vietnam," whether this rivalry is a "Thucydides trap," and whether that framing belongs in the piece or the briefing. Sometimes the analogy is doing real work; sometimes it's just a mood. The problem is we have no shared way of telling which is which, so the arguement happens over vibes, and whoever invokes the most vivid image usually wins the meeting.

  So please turn whatever philosophy of history and reasoning actually has to say about this into a procedure my team can run on any proposed analogy before it goes into a memo or a briefing. Questions in order, what counts as a sufficient answer to each, and where the procedure outputs one of: drop it, keep it but as rhetoric only (and flagged as such in our internal notes), or it's doing evidential work and here's what it can actually support. It should distinguish analogies used to predict (this will follow the same trajectory) from analogies used to warn (this could go the way of...) from analogies used to justify (we must act now so as not to repeat...) — I suspect those carry different burdens, and the procedure should say what the burden is for each. It should also separate wether an analogy is warranted from whether it's persuasive, since those come apart more than we like to admit and I only care about the first one for internal review.

  Then run it on three cases. (1) A colleague wants to open a memo about a great-power rivalry over some new technology with the claim that we're in a Thucydides trap and that war is basically the default outcome. (2) Another wants to compare a limited military intervention to Vietnam on the grounds that it'll be popular at first and then grind us down over years — she cares about the trajectory, not the opening move. (3) I want to use Munich, specifically the lesson that appeasing an aggressor feeds his appetite rather than sating it, to argue against concessions in a negotiation. I'd like to know whether the procedure lets me get away with that, though I have a feeling it shouldn't, at least not the way I wanted to use it.

  For context on constraints: these memos reach people who make actual decisions, we get a couple of analogy questions a week, and the whole check has to be runnable in about twenty minutes by someone who knows the history but has zero philosophy background. So the procedure itself should keep the philosophy invisible — the team will not sit through a lecture — but the distinctions underneath should be the real ones, not dumbed down to uselessness. And be honest about the spots where a judgment call can't be proceduralized and has to stay with a human.

  Last thing: tell me where the procedure misfires. Specifically, are there cases where following it would have blocked an analogy that in hindsight turned out to be right, and if so, is that a bug or just the price of the discipline? I want to know what this procedure can't do before I sell it to my director as the answer to the vibes problem.
reasoning: |-
  We are creating a procedure to evaluate historical analogies for use in policy memos or briefings. The procedure will output one of three recommendations: 
     - Drop it (the analogy is not warranted and should not be used)
     - Keep it as rhetoric only (the analogy may be persuasive but does not hold up as evidence; flag in internal notes)
     - It's doing evidential work (the analogy is warranted and can be used to support an argument, with clear limitations)

   The procedure must distinguish between three uses of analogies:
     - Predictive: This event will follow the same trajectory as the historical case. (Burden: Must show strong similarity in key causal factors and absence of critical differences that would break the analogy.)
     - Warning: This event could go the way of the historical case. (Burden: Must show that the causal mechanisms that led to the negative outcome in the historical case are present or emerging, even if not all factors are identical.)
     - Justificatory: We must act to avoid repeating the historical mistake. (Burden: Must show that the current situation and the historical one share the critical features that made the historical action a mistake, and that the proposed action is analogous to the historical action that failed.)

   Steps of the procedure (to be done in order):

   Step 1: Identify the type of analogy (Predictive, Warning, Justificatory) and the burden of proof.
     - Predictive: Requires the highest burden (strong causal similarity).
     - Warning: Moderate burden (plausible causal pathway to the same outcome).
     - Justificatory: Must establish the parallel in the key features that made the historical action a mistake.

   Step 2: Check for critical disanalogies (factors that break the analogy).
     - List the key causal factors in the historical event that led to the outcome. (The user must know the history to do this.)
     - Check if the current situation has any of these factors missing or any new factors that would prevent the same outcome.
     - If a critical factor is absent or a new factor fundamentally changes the causal mechanism, then the analogy fails for predictive use. For warning, if the absence of a factor is not critical (i.e., the outcome can still occur through other pathways) or if the factor is not necessary, then it might still be usable as a warning. For justificatory, check if the absence of a factor means the historical mistake is not applicable.

   Step 3: Assess the strength of the similarity on the key factors.
     - For each key factor, rate the similarity as: high, medium, low.
     - For predictive: all key factors must be high similarity.
     - For warning: the key factors that are necessary for the outcome must be at least medium, and no critical disanalogy must be present that makes the outcome impossible.
     - For justificatory: the key factors that made the historical action a mistake must be present (at least medium similarity).

   Step 4: Check for anachronism and context.
     - Are the contexts (technological, cultural, geopolitical) so different that the historical example is not relevant? (e.g., nuclear weapons change the stakes of great-power war)
     - If the context is too different, then the analogy might only be rhetorical.

   Step 5: Determine the output.
     - If the analogy passes the burden for its type (with the required strength of similarity and without critical disanalogies) then it can be used as evidence. Note the limitations (which factors are not perfectly similar) in the internal notes.
     - If it fails the burden but might be persuasive, then it can be kept as rhetoric only and flagged as such.
     - If it fails and is not persuasive, or if it is misleading, then drop it.

   Step 6: How to document the process for internal notes?
     - Briefly note: the type of analogy, the key factors, the critical disanalogies (if any), and the overall assessment.

   Now, we run the procedure on the three cases.

   Case 1: Thucydides Trap (Predictive)
     - Type: Predictive (claim: war is the default outcome in a great-power rivalry over new technology)
     - Historical case: Thucydides Trap refers to the Peloponnesian War, where the rise of Athens and the fear it instilled in Sparta made war inevitable. Graham Allison's work suggests this is a common pattern in history.
     - Burden: Must show that the current rivalry is so similar to the historical cases (especially the structural factors: rising power challenging an established one, and the resulting fear) that war is highly likely.

     Step 1: Type: Predictive (war is the default outcome). Burden: high.

     Step 2: Critical disanalogies?
       - Key factors in historical Thucydides Trap: 
          1. A rising power challenging an established one.
          2. The established power feeling threatened and fearing the loss of its position.
          3. The absence of mechanisms to prevent war (like mutual interdependence, international institutions, or nuclear deterrence).
       - In the current case: 
          - The new technology might change the nature of competition (e.g., cyber, space) and might not necessarily lead to direct military conflict.
          - Today, there are institutions and economic interdependence that did not exist in ancient Greece or even in pre-WWI Europe (another common example).
          - Nuclear deterrence exists between major powers today, which changes the risk calculus.

       Critical disanalogy: The presence of nuclear weapons and economic interdependence might break the causal chain that led to war in the past. Therefore, war is not inevitable.

     Step 3: Similarity on key factors?
       - Factor 1: Rising power vs. established: high similarity.
       - Factor 2: Fear and threat: medium to high (but note: the new technology might not be perceived in the same way as military buildup).
       - Factor 3: Absence of preventive mechanisms: low similarity (today there are many mechanisms).

       For predictive use, we require high on all key factors. Factor 3 is low, so the analogy fails for prediction.

     Step 4: Context: The context is very different (nuclear age, globalization). This makes the analogy weaker.

     Step 5: Output: 
          - The analogy fails for predictive use. However, it might be used as a warning (that war is a possibility). But in this case, the memo is using it predictively ("war is basically the default"). So we must either drop it or reframe as a warning.

          However, the request is to open the memo with the predictive claim. Therefore, we cannot support that. We might recommend:
            - Drop it for predictive use. 
            - Alternatively, if they want to use it as a warning, then change the claim to "could lead to war" and then it would be assessed as a warning.

          But since the memo is written as predictive, we output: drop it (for predictive use). If the colleague wants to switch to warning, then we re-run as warning.

          For now, we say: drop it as predictive. If kept at all, it should be as rhetoric only and flagged as such.

   Case 2: Vietnam (Warning about trajectory)
     - Type: Warning (not predictive, but about the trajectory: popular at first, then grinding down over years)
     - Historical case: The Vietnam War started with public support but became unpopular as casualties mounted and the goals seemed unachievable, leading to a long, costly, and ultimately unsuccessful engagement.
     - Burden: Must show that the current intervention has the key factors that led to the negative trajectory in Vietnam.

     Step 1: Type: Warning (trajectory: initial popularity then grinding down). Burden: moderate.

     Step 2: Critical disanalogies?
       - Key factors in Vietnam:
          1. The conflict was a counterinsurgency in a jungle environment against a highly motivated and locally supported enemy.
          2. The U.S. had unclear objectives and no clear exit strategy.
          3. The enemy received significant external support (from USSR and China).
          4. The war was highly visible in the media, leading to a decline in public support as casualties mounted.
          5. The U.S. faced difficulties in adapting its conventional military to asymmetric warfare.

       - In the current intervention:
          - We don't know the specifics, but let's assume it's a limited intervention in a different context (say, against a terrorist group in an urban setting, or in a different region).
          - Critical disanalogies might include:
            - The enemy might not have the same level of external support.
            - The objectives might be clearer and more achievable.
            - The media environment is different (social media vs. television).
            - The nature of the conflict (e.g., drone warfare might reduce U.S. casualties).

       Without knowing the exact current case, we note: if any of the critical factors that made Vietnam long and grinding are absent (like a strong local insurgency with popular support and external backing) then the analogy might break.

       However, the warning is about the trajectory (initial popularity fading as the conflict drags on without clear success). This trajectory could occur even in a different context. So we must check if the current intervention has the features that could lead to a long, grinding conflict.

     Step 3: Similarity on key factors?
       - Factor 1: Counterinsurgency in difficult terrain? (if the current intervention is not an insurgency, then low similarity) — but note the colleague only cares about the trajectory, not the specific context. So we focus on:
          - Factor 2: Unclear objectives and exit strategy? (if the current intervention has clear objectives, then low; if not, high)
          - Factor 4: Visibility and public sensitivity to casualties? (if the current intervention is likely to have high casualties and media coverage, then high; if it's low-visibility and low-casualty, then low)

       The colleague should be required to specify which factors of the Vietnam trajectory are present. Without that, we cannot assess.

     Step 4: Context: The context of war has changed (e.g., precision weapons, social media, public tolerance for long wars might be lower). But the pattern of initial support fading in a long war is a common one.

     Step 5: Output:
          - The analogy might be warranted as a warning if the key factors for a long, grinding conflict are present (especially unclear objectives and the potential for high casualties). But without knowing the specific intervention, we can only say:

          If the current intervention shares key factors (unclear objectives, difficult enemy, potential for high casualties and media coverage) then it can be used as a warning. Otherwise, it might be rhetoric.

          Since the user is an analyst who knows the case, they should be able to assess. In the procedure, we require the analyst to list the key factors and then compare.

          Let's assume the analyst does the work and finds:
            - Objectives are clear: drop the analogy.
            - Objectives are unclear: then the analogy is warranted as a warning.

          But note: the colleague only cares about the trajectory. The procedure must focus on the trajectory. So we might reframe the key factors for the trajectory:

            Key factors for the trajectory (from Vietnam) are:
              a. The conflict becomes prolonged beyond initial expectations.
              b. The costs (in lives and money) mount without clear progress.
              c. Public support wanes as a result.

            These can happen in many conflicts. So the warning might be generally applicable, but the Vietnam analogy might be too strong if the current intervention is very different (e.g., a short-term operation with a clear endpoint).

          Therefore, the procedure should ask: Is there a reason to believe this intervention will become prolonged and costly without clear success? If yes, then the analogy is warranted as a warning. If not, then it's not.

          Given the constraints, we might say: the analogy can be used as a warning if the current intervention has the potential for becoming prolonged and costly without clear success. The burden is met if the analyst can identify at least two of the following: unclear objectives, a determined enemy, difficult terrain, high expected casualties, or low tolerance for long wars at home.

          In this case, if the analyst can point to such factors, then the analogy does evidential work (as a warning). Otherwise, it might be rhetoric.

   Case 3: Munich (Justificatory)
     - Type: Justificatory (arguing against concessions because appeasement feeds aggression)
     - Historical case: The Munich Agreement (1938) allowed Nazi Germany to annex the Sudetenland, which was followed by further aggression (taking the rest of Czechoslovakia and then invading Poland). The lesson: appeasement emboldens aggressors.
     - Burden: Must show that the current negotiation shares the key features that made appeasement a mistake in Munich.

     Step 1: Type: Justificatory. Burden: must show that the current aggressor is similar to Hitler in being expansionist and that concessions will lead to further demands.

     Step 2: Critical disanalogies?
       - Key factors in Munich:
          1. The aggressor had unlimited expansionist aims (Hitler's ideology sought domination).
          2. The aggressor was not acting in good faith and would not be satisfied by concessions.
          3. The concessions were made at the expense of a third party (Czechoslovakia) without its consent.
          4. The concessions weakened the defensive position of the allies.

       - In the current negotiation:
          - Is the adversary expansionist and ideologically driven to unlimited goals? (if not, then disanalogy)
          - Is the adversary likely to see concessions as weakness and demand more? (if we have evidence of that, then similar; if the adversary is a rational actor with limited goals, then disanalogy)
          - Are we making concessions at the expense of a third party? (if not, then disanalogy)
          - Will the concessions weaken our strategic position? (if not, then disanalogy)

       Critical disanalogy: If the adversary has limited goals and is open to a negotiated settlement, then the Munich analogy fails.

     Step 3: Similarity on key factors?
          - Factor 1: Expansionist aims? (if the adversary is not expansionist, then low)
          - Factor 2: Not acting in good faith? (if we have evidence of bad faith, then high; otherwise, low)
          - Factor 3: Concessions at third party's expense? (if yes, high; if no, low)
          - Factor 4: Concessions weaken our position? (if yes, high; if no, low)

          For justificatory, we need at least the key factors that made the historical action a mistake. The core mistake of Munich was conceding to an aggressor with unlimited aims. Therefore, factors 1 and 2 are critical.

          If the current adversary does not have unlimited aims (factor 1) or is acting in good faith (factor 2), then the analogy fails.

     Step 4: Context: The contemporary international system has stronger norms against territorial aggression and more collective security mechanisms. But this doesn't necessarily break the analogy if the aggressor is a revisionist power.

     Step 5: Output:
          - If the analyst cannot demonstrate that the adversary has unlimited expansionist aims and is acting in bad faith, then the analogy fails for justificatory use. It might be used as rhetoric only (to evoke the danger of appeasement) but must be flagged as such.

          Given that the user (you) wants to use it, but without evidence of the adversary's unlimited aims and bad faith, the procedure would say: drop it as evidence, but you can use it as rhetoric only if you flag it.

          However, note: the Munich analogy is often overused. The procedure would require evidence about the adversary's intentions and goals to use it evidentially.

   Where the procedure misfires:

     - There might be cases where an analogy that was blocked by the procedure turned out to be right. For example, if in the run-up to WWII, someone had applied this procedure to the Munich analogy before Hitler's further aggression, they might have argued that we don't know for sure that Hitler has unlimited aims (though his ideology suggested it). But at the time, there was debate about Hitler's intentions. The procedure would have required evidence of unlimited aims and bad faith. In 1938, after the Anschluss and the demand for the Sudetenland, there was evidence. So it would have passed.

     - Another example: The Cuban Missile Crisis was sometimes compared to the lead-up to WWI (a series of escalations leading to war) but with the procedure, the critical disanalogy (nuclear deterrence) would have broken the analogy. But the warning about escalation might have been useful. The procedure would have allowed it as a warning (if framed as "could lead to war") but not as predictive.

     - Why it's a feature, not a bug: The procedure is designed to prevent overconfident predictions and to ensure that analogies are used with proper caveats. If an analogy that was blocked turned out to be right, it might be because the evidence was not available at the time, or because it was a low-probability event that happened to occur. The procedure forces analysts to be explicit about the evidence and not rely on superficial similarities.

     - The procedure cannot account for rare events or "black swans". It is based on known historical causal factors. Sometimes, an analogy that is weak on the factors we know might still be right because of factors we didn't consider. But that is the price of the discipline.

     - Also, the procedure relies on the analyst's knowledge of both the historical case and the current situation. If the analyst is wrong about the historical case or the current situation, the procedure will be wrong.

   Summary of the procedure in steps (for the team):

   Step 1: Identify the analogy type and burden.
     - Predictive: burden of strong causal similarity (all key factors present and no critical disanalogies).
     - Warning: burden of plausible causal pathway (key necessary factors present, no critical disanalogy that breaks the chain).
     - Justificatory: burden of showing that the key features that made the historical action a mistake are present.

   Step 2: Break down the historical event: What were the key factors that caused the outcome? (The analyst must list them.)

   Step 3: For the current situation, for each key factor:
     - Rate similarity (high, medium, low).
     - Note any critical disanalogies (factors that are missing or different that would break the causal chain).

   Step 4: Context check: Are there anachronisms? (e.g., nuclear weapons, internet, globalization) that make the historical case less relevant?

   Step 5: Apply the burden for the type:
     - Predictive: All key factors must be high, and no critical disanalogies.
     - Warning: The key factors that are necessary for the outcome must be at least medium, and no critical disanalogy that makes the outcome impossible.
     - Justificatory: The key factors that define the mistake must be at least medium.

   Step 6: Output:
     - If the burden is met: "It's doing evidential work" — but note the limitations (any factors that are not high, or context differences) in the internal notes.
     - If the burden is not met but the analogy is vivid and might be persuasive: "Keep it as rhetoric only" and flag in the notes that it does not meet evidential standards.
     - If the burden is not met and it's misleading or weak: "Drop it."

   Step 7: Document for internal notes: 
     - Type: [Predictive/Warning/Justificatory]
     - Key factors and their similarity ratings: [list]
     - Critical disanalogies: [list]
     - Context differences: [list]
     - Output: [Drop/Keep as rhetoric/Evidential] and why.

   The entire procedure should take about 20 minutes per analogy.

   Now, let's run the three cases with the procedure as above.

   Case 1: Thucydides Trap (Predictive)
     Type: Predictive.
     Key factors (from historical Thucydides Trap cases, e.g., Athens-Sparta, Germany-UK before WWI):
       1. Rising power challenging established power (high similarity).
       2. Fear in the established power leading to security dilemma (high).
       3. Absence of effective mechanisms to prevent war (low: today we have many mechanisms including nuclear deterrence, economic interdependence, institutions). -> Critical disanalogy.
     Context: Very different (nuclear age).
     Burden for predictive: Not met (factor 3 is low and is critical).
     Output: Drop it for predictive use. (If used as warning, we would reassess with a moderate burden.)

   Case 2: Vietnam (Warning)
     Type: Warning (about trajectory: initial popularity then grinding down).
     Key factors for the Vietnam trajectory:
       1. Unclear objectives and exit strategy? (Analyst must rate for current case. Let's assume they rate as high because the intervention lacks clear objectives.)
       2. Enemy is determined and has external support? (Assume medium: enemy is determined but external support is less than Vietnam.)
       3. High expected casualties and media visibility? (Assume high: the intervention is in a media-intensive environment and casualties are expected to be high.)
       4. Protracted conflict without clear success? (Assume high: the nature of the conflict suggests it will be long.)
     Critical disanalogy? None that break the trajectory (for example, if the conflict is expected to be short, then that would break it. But by assumption, it's not.)
     Context: Media environment is different but the pattern of public opinion turning against long, costly wars is still relevant.
     Burden for warning: The key factors that are necessary for the trajectory (unclear objectives, high costs, and public sensitivity) are present (at least medium). So the burden is met.
     Output: It's doing evidential work (as a warning). But note the disanalogies (e.g., less external support for the enemy) in the internal notes.

   Case 3: Munich (Justificatory)
     Type: Justificatory.
     Key factors (from Munich):
       1. Adversary has unlimited expansionist aims? (Analyst must assess: if the adversary is known to have limited goals, then low. Without evidence of unlimited aims, rate low.)
       2. Adversary is acting in bad faith? (If no evidence, rate low.)
       3. Concessions at expense of third party? (If yes, high; if no, low. Let's assume in this case, it is at the expense of a third party: high.)
       4. Concessions weaken our strategic position? (If yes, high; assume yes: high.)
     Critical factors for the mistake: Factors 1 and 2 are the core of the Munich analogy. Without them, we cannot say that concessions will necessarily feed further aggression.
     Burden for justificatory: Not met because factors 1 and 2 are low (without evidence). The other factors are present but are not sufficient to make the analogy evidentially strong.
     Output: Drop it as evidence. It can be kept as rhetoric only, but must be flagged as such.

   However, note: in the justificatory use, the argument is that appeasement feeds aggression. The historical lesson of Munich is that it did. But to apply that lesson, we need to show that the current adversary is like Hitler. Without that, the analogy is weak.

   Therefore, the procedure would not let you use it evidentially without evidence of the adversary's expansionist aims and bad faith.

   Final note: The procedure cannot eliminate judgment calls (e.g., what counts as a key factor, how to rate similarity). But it makes the reasoning explicit and moves beyond vibes.
answer: |-
  ### Historical Analogy Evaluation Procedure  
  **Goal:** Systematically assess analogies to avoid overreliance on "vibes" and clarify whether they are evidentially valid, rhetorical, or misleading. Outputs: **Drop it**, **Rhetoric Only** (flagged in notes), or **Evidential** (with specified limitations).  

  ---

  #### **The Procedure: 8 Steps (20-Minute Checklist)**  
  *(Designed for analysts with historical knowledge but no philosophy background.)*  

  1. **Clarify the Analogy’s Purpose**  
     - **Predictive**: "X *will* follow Historical Case Y’s trajectory."  
       *Burden: Prove strong causal similarity.*  
     - **Warning**: "X *could* become like Historical Case Y."  
       *Burden: Show plausible shared mechanisms.*  
     - **Justificatory**: "We must act to *avoid* repeating Historical Case Y’s mistake."  
       *Burden: Prove shared error conditions.*  
     - *Sufficient Answer*: Select one type. If ambiguous, default to "rhetoric."  

  2. **Map the Historical Case’s Core Mechanics**  
     - List 3–5 *key factors* that caused the outcome.  
     - Example (Munich): (1) Aggressor’s expansionist ideology, (2) Asymmetric power imbalance, (3) Appeaser’s misreading of aggressor’s goals.  
     - *Sufficient Answer*: Factors must be specific, non-trivial, and cited from historical scholarship.  

  3. **Identify Critical Disanalogies (Make-or-Break Differences)**  
     - Ask: *"Is there a difference that fundamentally alters the causal chain?"*  
     - **Red Flags**:  
       - Technology/context shifts (e.g., nukes vs. pre-nuke eras).  
       - Different actor motivations (e.g., ideological vs. pragmatic goals).  
       - Structural differences (e.g., alliances, economics).  
     - *Sufficient Answer*: If ≥1 critical disanalogy exists, analogy fails for *predictive* use. For *warning* or *justificatory*, proceed but note limitations.  

  4. **Test Similarity on Key Factors**  
     - Rate similarity for each key factor (Step 2) as: **High**, **Medium**, **Low**.  
     - *Sufficient Answer*:  
       - **Predictive**: All factors ≥ **High**.  
       - **Warning**: ≥2 factors ≥ **Medium**; no critical disanalogies.  
       - **Justificatory**: All *error-condition factors* ≥ **Medium**.  

  5. **Assess Contextual Transferability**  
     - Ask: *"Would this analogy hold if transplanted to today’s technological/political/informational context?"*  
     - *Sufficient Answer*: If context mismatch undermines key factors (e.g., social media vs. 1930s media), downgrade to "rhetoric."  

  6. **Flag Known Counterexamples**  
     - Example: "Thucydides Trap" fails if many rivalries (e.g., US-USSR) avoided war.  
     - *Sufficient Answer*: If strong counterexamples exist, analogy cannot be *predictive* or *justificatory*.  

  7. **Output Decision**  
     - **Evidential**: Passes Steps 3–6 for its purpose. *Document supporting factors and caveats.*  
     - **Rhetoric Only**: Fails Steps 3–6 but vivid; useful for framing. *Flag in notes: "Not causal evidence."*  
     - **Drop it**: Fails Step 3 (critical disanalogy) or has counterexamples (Step 6).  

  8. **Internal Note Template**  
     ```  
     Purpose: [Predictive/Warning/Justificatory]  
     Key Factors: [List]  
     Critical Disanalogies: [Yes/No + Details]  
     Similarity Rating: [High/Med/Low per factor]  
     Output: [Evidential/Rhetoric/Drop]  
     Limitations: [e.g., "Useful for trajectory warning but not escalation prediction"]  
     ```  

  ---

  ### **Case Evaluations**  

  #### **Case 1: Thucydides Trap (Predictive)**  
  *"Great-power rivalry over new tech → war is default."*  
  - **Purpose**: Predictive (war inevitable).  
  - **Key Factors**: (1) Rising power threatens hegemon, (2) Mutual fear of decline, (3) Absence of crisis diplomacy.  
  - **Critical Disanalogies**:  
    - **Nuclear deterrence** alters cost calculus (absent in ancient Greece).  
    - **Economic interdependence** reduces incentive for war.  
  - **Similarity**:  
    - (1) High (rivalry exists), (2) Medium (fear present but mitigated), (3) Low (modern diplomacy institutions exist).  
  - **Counterexamples**: Cold War (no direct war).  
  - **Output**: **Drop it**.  
    - *Why*: Critical disanalogies (nukes, interdependence) and counterexamples break inevitability. Fails predictive burden.  

  #### **Case 2: Vietnam (Warning)**  
  *"Intervention will be popular then grind us down."*  
  - **Purpose**: Warning (trajectory similarity).  
  - **Key Factors**: (1) Initial public support, (2) Protracted conflict with no clear victory, (3) Rising domestic dissent.  
  - **Critical Disanalogies**: None *if* the intervention shares these mechanisms.  
  - **Similarity**:  
    - (1) High (initial support), (2) Medium (depends on intervention scope), (3) Medium (if prolonged).  
  - **Context**: Social media accelerates dissent vs. 1960s.  
  - **Output**: **Evidential** (as warning).  
    - *Why*: Passes warning burden (≥2 Medium factors). *Limitations*: Context differences mean dissent may escalate faster.  

  #### **Case 3: Munich (Justificatory)**  
  *"No concessions → appeasement feeds aggression."*  
  - **Purpose**: Justificatory (avoid repeating error).  
  - **Key Factors**: (1) Aggressor has unlimited aims, (2) Concessions signal weakness, (3) No credible deterrent.  
  - **Critical Disanalogies**:  
    - **Limited vs. unlimited aims**: If current adversary seeks specific gains (not expansion), disanalogy.  
    - **Deterrence credibility**: Modern alliances (e.g., NATO) may deter.  
  - **Similarity**:  
    - (1) Low (must prove unlimited aims), (2) Medium, (3) Low (if deterrent exists).  
  - **Counterexamples**: Cuban Missile Crisis (concessions worked).  
  - **Output**: **Rhetoric Only** (with notes).  
    - *Why*: Fails justificatory burden (Factor 1 similarity Low). *But*: Useful to warn against misjudging aggression.  

  ---

  ### **Where the Procedure Misfires (and Why It’s a Feature)**  
  1. **Missed "Black Swans"**:  
     - Example: 9/11 comparisons to Pearl Harbor were initially dismissed (different actors/context) but later seen as valid for mobilizing public will.  
     - *Why it’s the price of discipline*: Procedure blocks overconfident predictions. Analogy was *rhetorically* useful post-9/11 but not *evidential* for predicting attacks.  

  2. **Underrating Unique Human Factors**:  
     - Example: Dismissing Hitler comparisons in 1936 due to "changed context" might ignore ideological extremism.  
     - *Mitigation**: Step 2 (key factors) forces explicit analysis of motives. Munich would pass *only* if unlimited aims were proven.  

  3. **Overly Strict on Warnings**:  
     - Example: A "Cuban Missile Crisis" analogy for a new crisis might fail Step 3 (nukes changed everything) but still usefully highlight escalation risks.  
     - *Solution**: Procedure allows "rhetoric" output for such cases, preserving utility without false rigor.  

  **Conclusion**: The procedure trades false positives (blocking some valid analogies) for reduced false confidence. It ensures analogies are tools—not substitutes—for analysis. Sell it as a **vibes-to-rigor translator**, not an oracle.
