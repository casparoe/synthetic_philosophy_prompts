  Hmm, they're also hinting at a meta-concern: how language gets weaponized in institutional politics. The "menu" framing suggests they want tactical clarity for the next faculty meeting. Underneath the academic phrasing, I sense real urgency - this isn't just theoretical, but about dismantling defenses of ongoing structural harm. 

  The Columbus/Jefferson comparison is key. For Jefferson, the "man of his time" trope might partially hold descriptively (though Benjamin Rush et al. undermine it), but for Columbus it's demonstrably false given his chains. Yet both get the same rhetorical treatment. That hypocrisy needs exposing. 

  I should structure this carefully: first unpack each thesis type distinctly, then evaluate their validity, then apply to their cases. The "proves too much" test (would we accept future judgments of us?) is brilliant - must include that. Also can't let the relativist claim off easy; moral progress depends on cross-temporal judgments. 

