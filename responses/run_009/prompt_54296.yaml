answer: |-
  Here’s a precise "menu" of the distinct theses behind "he was a man of his time," evaluated for truth, function, and implications for historical judgment:

  ---

  ### **The Ordered Menu: Six Theses of "Man of His Time"**

  1. **Descriptive Sociological Claim**  
     *Thesis*: Nearly all people in his social position/culture held similar views or engaged in similar practices.  
     - **Truth**: Often *substantive and defensible* (e.g., most 18th-century Virginia elites owned slaves).  
     - **Function**: *Explains* prevalence, but **does not excuse/justify** individual actions.  
     - **Supports Deflection?** Weakly. Highlights norms but ignores outliers (e.g., abolitionists).  
     - **Proves Too Much?** No. Universality ≠ justification (e.g., Nazi Germany).  

  2. **Causal Formation Claim**  
     *Thesis*: His upbringing/social environment made his values *psychologically inevitable*.  
     - **Truth**: *False* as strict determinism. Socialization influences but doesn’t negate agency.  
     - **Function**: *Explains* origins of beliefs; **excuses only if no moral alternatives existed** (rarely true).  
     - **Supports Deflection?** Only if inevitability is proven (undermined by contemporaries who rejected norms).  
     - **Proves Too Much?** Yes: Would absolve all historical actors (e.g., slaveholders, inquisitors).  

  3. **Epistemic Access Claim**  
     *Thesis*: He lacked access to arguments/evidence challenging his actions (e.g., anti-slavery philosophy, ethnography).  
     - **Truth**: *Mixed*. Jefferson had access to abolitionist thought; Columbus knew Taíno humanity was recognized.  
     - **Function**: *Explains* ignorance; **excuses only if ignorance was unavoidable**.  
     - **Supports Deflection?** For Jefferson: partially (though contemporaries like Condorcet refute this). For Columbus: **false** (royal investigation proved he knew better).  
     - **Proves Too Much?** Yes: Would excuse any pre-scientific cruelty (e.g., witch trials).  

  4. **Moral Relativist Claim**  
     *Thesis*: Moral language is era-bound; condemning past actors is like blaming foreigners for alien customs.  
     - **Truth**: *False*. Core wrongs (torture, genocide) are transhistorically condemnable. Relativism undermines moral progress.  
     - **Function**: **Attempts to justify** by denying cross-temporal judgment.  
     - **Supports Deflection?** Strongly—but incoherent. If true, we couldn’t praise past heroes either.  
     - **Proves Too Much?** Yes: Forbids condemning *any* historical injustice (e.g., slavery).  

  5. **Standing/Pragmatic Claim**  
     *Thesis*: Modern people lack authority to judge the past, or such judgment is futile/self-righteous.  
     - **Truth**: *Substantive but flawed*. Judgment is essential for historical reckoning; "futility" defends status quo.  
     - **Function**: **Deflects criticism** by policing who may speak.  
     - **Supports Deflection?** Explicitly—but confuses *assessment* with *punishment*.  
     - **Proves Too Much?** Yes: Would silence criticism of all past wrongs, including those enabling present harms.  

  6. **Mitigated Agency Claim** (Added)  
     *Thesis*: His moral responsibility is *diminished* (not erased) by context, reducing blameworthiness.  
     - **Truth**: *Defensible*. Context affects degree of culpability (e.g., Jefferson vs. a hypothetical time-traveling Jefferson).  
     - **Function**: *Explains without excusing*; permits tempered judgment.  
     - **Supports Deflection?** No—this is the **only defensible use** for nuanced debate, but rejects blanket absolution.  

  ---

  ### **Key Distinctions Applied**  
  - **Explaining**: How context shaped actions (Theses 1–3).  
  - **Excusing**: Claiming reduced blame due to constraints (Thesis 6 *partially*; others fail).  
  - **Justifying**: Asserting actions were morally acceptable (Thesis 4; false).  

  ---

  ### **Does It Deflect Criticism?**  
  - The phrase **supports deflection only under false/weak readings** (Theses 2–5), which conflate explanation with exoneration.  
  - **Strongest reading (Thesis 6) doesn’t deflect**: It permits contextualized judgment, demanding we weigh harms against "mitigation" (e.g., Jefferson’s ideals vs. his slavery).  

  ---

  ### **Proves Too Much?**  
  - Yes: If *any* thesis excuses historical wrongs, it must excuse *all* actors in similar contexts—including those we revile (e.g., "Hitler was a man of his time"). Contemporaries who rejected norms (e.g., Bartolomé de las Casas vs. Columbus; abolitionists vs. Jefferson) **fatally undermine** claims of inevitability/ignorance.  

  ---

  ### **Jefferson vs. Columbus: A Crucial Difference**  
  - **Jefferson**: Some claims (Thesis 1, 3, 6) are *partially* defensible—but eroded by abolitionist contemporaries and his own unease. Supports *mitigation*, not absolution.  
  - **Columbus**: Thesis 1–3 **fail**. His cruelty violated *contemporary* Spanish norms (hence his arrest). "Man of his time" here is **historically false**—it functions purely as deflection (Thesis 5).  

  ---

  ### **Verdict for Your Meeting**  
  The phrase is **rhetorically potent but philosophically incoherent** when used to deflect criticism. Its only defensible form (Thesis 6) *invites* nuanced judgment—it doesn’t forbid renaming. To refute your colleague:  
  1. Highlight contemporaneous critics (e.g., Columbus’s royal tribunal).  
  2. Emphasize that *explanation ≠ exoneration*.  
  3. Argue that honoring figures requires **moral coherence with present values**, not historical whitewashing.  

  Bring this menu to dissect their rhetoric—and demand they specify which thesis they mean.
