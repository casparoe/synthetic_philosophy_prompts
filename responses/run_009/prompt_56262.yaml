  Let me unpack the contradictions they've highlighted. For DCD, we declare death after 2-5 minutes of asystole when organs are clearly still viable - so we're not claiming biological death but rather permanence of cessation. Yet for brain death, we declare death while the body may still have circulation if supported, based on loss of integration. Meanwhile, we don't declare PVS patients dead despite their permanent unconsciousness. 

  The tension is real. I think the implicit theory here is actually a hybrid: death as the permanent cessation of the organism's integrated functioning. This explains why we treat PVS patients as alive (their bodies still integrate functions) and why DCD requires irreversibility (not just absence) of circulation. But the user is right that the "permanence" in DCD is contingent on our decision not to resuscitate - it's a normative choice disguised as a biological fact.

  If we admitted death determination involves conventional elements, we'd need more transparent consent processes, especially for DCD. We might also need to reconsider protecting PVS patients' bodies as "persons" when only physiological integration remains. But changing practices would risk undermining public trust in transplantation - hence the current uneasy compromise.

