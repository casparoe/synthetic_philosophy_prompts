  Hmm, the user is a science journalist working on a feature about whether the wavefunction is a physical thing or just a bookkeeping device. They need exactly five clear desiderata for any view of the quantum state's status, based on specific phenomena and theorems.  

  First, I recall the key cases they mentioned: single-particle interference, quantum eraser, entanglement properties, density matrix ambiguity, and no-go theorems (Bell, Kochen-Specker, PBR). The PBR theorem is crucial here because it directly challenges epistemic views.  

  The user wants to avoid camp biases, so I need to distinguish genuine requirements from partisan demands. For example, locality might be optional, while consistency with interference experiments seems fundamental. I should flag where views might conflict irreconcilably due to no-go results.  

  Starting with interference: any viable theory must explain how a single particle produces wave-like patterns. That’s non-negotiable and neutral between camps. Then entanglement: Bell’s theorem forces non-locality or non-realism, so desideratum 2 should emphasize irreducible global correlations.  

  Next, the density matrix ambiguity. The fact that two density matrices can be empirically indistinguishable yet ontologically different (one pure, one mixed) means any view must either accept this equivalence or explain it away. This pressures ontic views that treat the state as fundamental.  

  For quantum eraser, the requirement is about how information controls wave/particle behavior. QBism handles this neatly with agent-dependent knowledge, but ontic views need decoherence narratives. It’s a genuine test of explanatory flexibility.  

  Finally, PBR: it’s the hammer. If the quantum state is epistemic, PBR shows this leads to contradictions unless the underlying reality is bizarrely contextual. Most epistemic views survive only by rejecting PBR’s assumptions (like independence), which becomes a litmus test.  

  The joint unsatisfiability surfaces here—PBR and the demand for a single objective reality clash, forcing a choice. I’ll note that in desideratum 5, highlighting how PBR eliminates naive epistemic realism.  

  Throughout, I’ll keep each item concise: requirement, motivating case/theorem, and bias assessment. No fluff—just the five bullets they requested.
answer: |-
  Here are five numbered desiderata for a view of the quantum state's status:

  1.  **Explain Interference Phenomena:** The view must account for single-particle and single-system interference patterns (e.g., double-slit, Mach-Zehnder), demonstrating how path superpositions lead to observable wave-like effects detectable even for individual quanta. This is a genuine requirement motivated by foundational experiments establishing quantum behavior distinct from classical particles or waves.

  2.  **Account for Irreducible Entanglement:** The view must explain the existence and consequences of Bell-nonlocal correlations, meaning the joint state of entangled systems cannot be reduced to a probability distribution over pre-existing local states of the individual systems (Bell's theorem). This necessitates either genuine non-separability or a fundamental revision of classical concepts like realism or locality, making it a genuine requirement derived from experimental violations of Bell inequalities.

  3.  **Address Density Matrix Equivalence:** The view must consistently interpret the physical significance of the density matrix, particularly the fact that different underlying realities (a pure state known with classical uncertainty vs. a fundamentally mixed state) can yield the same density matrix and thus be empirically indistinguishable (the "preparation problem"). This is a genuine requirement motivated by quantum information theory showing equivalent predictive power from distinct ontological pictures.

  4.  **Explain Information-Dependent Behavior (Quantum Eraser):** The view must explain phenomena like the quantum eraser, where the presence or absence of a retrievable "which-path" record determines whether particle-like (no interference) or wave-like (interference) behavior is observed, even after the fact. This is a genuine requirement demonstrating how knowledge (or its physical record) shapes observable outcomes, challenging naive objectivist pictures.

  5.  **Engage with the PBR Constraint:** The view must explicitly address the PBR theorem, which rules out models where the quantum state is *both* a complete description of reality *and* purely epistemic (representing ignorance about an underlying "real" physical state). This forces a choice: accept the quantum state as ontic (physical) *or* accept that the underlying reality is fundamentally different from classical states (e.g., overlapping ontic states) *or* reject an assumption of PBR (like "preparation independence"). This is a genuine requirement derived from a major no-go theorem specifically targeting the ontic/epistemic distinction, and its demand for ontological clarity does the most work in eliminating candidate views, particularly naive epistemic interpretations.
