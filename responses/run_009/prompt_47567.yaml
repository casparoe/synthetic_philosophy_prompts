prompt: |-
  I'm a TA for a second course in abstract algebra, and next week's section has to cover Zorn's lemma as the tool for proving that every proper ideal in a commutative ring with unity is contained in a maximal ideal. My students have seen the well-ordering theorem stated and used, are fluent in proofs by strong induction, but have never met the axiom of choice in any form. Plan the section for me rather than explaining the lemma yourself: what has to be in place before the statement can even be read (partial orders versus the posets they implicitly know, what a chain is, and crucially why the hypothesis that *every* chain has an upper bound is what does the work rather than a technicality), which example should carry the whole explanation and what it must have and lack, where in the sequence to head off the misconceptions I'm expecting -- 'maximal' read as 'greatest element', the sense that the lemma is just induction continued a little further, and the feeling that a maximal element is obviously constructible by 'keep extending until you can't' -- and how to handle the two edge cases (the empty chain, the chain with no bound) without derailing the room. Also tell me what to openly refuse to prove or even state carefully at this level, and how to say so honestly without making the lemma feel like magic. Finish with one exercise or question I can pose that would show me whether they can actually deploy the lemma in a new proof rather than merely nod at the statement.
reasoning: |-
  Okay, let me tackle this TA's request. They need a lesson plan for introducing Zorn's Lemma to students who've never seen the Axiom of Choice. The goal is to prove that every proper ideal is contained in a maximal ideal. 

  First, I need to scaffold the prerequisites carefully. The students know well-ordering and strong induction but haven't encountered choice principles. That means I must build partial order concepts from scratch - they've seen posets implicitly (like subsets, divisibility) but need explicit framing. Chains will be crucial, so I'll use the "subset inclusion" example throughout since it mirrors the ideal proof.

  Hmm, the biggest pitfalls are misconceptions: confusing "maximal" with "maximum," thinking Zorn's Lemma is just infinite induction, or believing maximal elements are constructible. I should actively dismantle these during the lecture. For the "keep extending" fallacy, I'll use a concrete counterexample like ideals in polynomial rings to show chains can outpace naive step-by-step extension.

  The empty chain and unbounded chains need careful handling without derailing. I'll acknowledge the empty chain's upper bound is just any element (which feels odd but necessary), and emphasize that the "every chain has bound" hypothesis is what prevents infinite regress. 

  For the ideal proof itself, I'll skip technical set theory justifications. Honestly tell students we're assuming a "big toolbox" without opening it. The exercise should test application - maybe proving bases exist in vector spaces without finite dimension? That mirrors the ideal proof structure while feeling fresh.

  Wait, I should also preempt the "why not use induction?" question. Contrast well-ordered chains (where induction works) vs general posets (where Zorn bridges the gap). Use a non-well-ordered example like finite subsets of an infinite set to show why induction fails there.

  The timeline: 15 mins on orders/chains, 10 mins on Zorn's statement with examples, 15 mins debunking misconceptions, then 20 mins for the ideal proof with exercise at the end. Keep the empty chain brief - say its upper bound requirement is like "the whole poset isn't empty" in disguise. 

  Final exercise: "Prove every commutative ring with unity has a minimal prime ideal." It reuses the lemma but requires recognizing primality as an upper bound property. If they get stuck, hint to consider chains of prime ideals containing a fixed ideal.
answer: |-
  Here's a lesson plan designed to introduce Zorn's Lemma effectively for your specific goal, anticipating student misconceptions and focusing on the ideal proof.

  **Section Title:** Finding Maximal Ideals: The Power of Zorn's Lemma

  **Duration:** 50-60 Minutes

  **Prerequisite Knowledge:** Well-ordering Theorem (stated), strong induction, ideals, proper ideals, commutative rings with unity, basic set inclusion concepts.

  ### Phase 1: Setting the Stage: Partial Orders & Chains (15 mins)
  1.  **Reframe "Order":** "We've seen orders like `≤` on `ℕ` or `⊆` on sets. Zorn's Lemma works in a more general setting: *partially ordered sets* (posets). A poset `(P, ≤)` is a set `P` with a relation `≤` that's reflexive, antisymmetric, and transitive. Give me examples!"
      *   *Student Input:* `ℕ` with `≤`, subsets of a set with `⊆`, positive integers with divisibility, ideals in a ring under `⊆`.
      *   *Key Point:* Emphasize "partial" – not every two elements need be comparable (e.g., `{1,2}` vs. `{3}` under `⊆`).
  2.  **Chains – The Paths We Follow:** "A *chain* in a poset is a subset `C ⊆ P` where **every** two elements *are* comparable: `∀ a, b ∈ C, a ≤ b` or `b ≤ a`. Chains are totally ordered subsets. Examples?"
      *   *Student Input:* Increasing sequences in `ℕ`, nested subsets `A1 ⊆ A2 ⊆ A3 ⊆ ...`, ideals `I1 ⊆ I2 ⊆ I3 ⊆ ...`.
      *   *Key Point:* Stress "totally ordered within itself." Contrast with non-chains (e.g., `{{1}, {2}}` under `⊆`).
  3.  **Upper Bounds – Where Chains Point:** "An *upper bound* for a subset `S ⊆ P` is an element `u ∈ P` such that `s ≤ u` for **every** `s ∈ S`. It doesn't have to be *in* `S`, just bigger than everything in `S`. Upper bound for the chain `I1 ⊆ I2 ⊆ ...`?"
      *   *Student Input:* Their union `∪I_n`.
      *   *Key Point:* An upper bound for `S` might not exist. If `S` itself has an upper bound *within* `S`, that's a *greatest element* (rare!).

  ### Phase 2: Introducing Zorn's Lemma & The Crucial Hypothesis (10 mins)
  1.  **The Statement (Carefully Phrased):** "Zorn's Lemma is a tool guaranteeing the existence of special elements. Here it is: *Suppose `(P, ≤)` is a non-empty poset with the property that **every chain** in `P` has an **upper bound** in `P`. Then `P` contains at least one **maximal element***."
  2.  **Dissecting the Statement:**
      *   "`P` non-empty: Basic starting point."
      *   "**every chain**... has an **upper bound**": Hammer this. "Not just the chains *we can see* or *finite* chains. **Every single chain**, no matter how long, complicated, or uncountably infinite it might be, *must* have *some* element in `P` sitting above all of them." This is the engine.
      *   "**maximal element**: An element `m ∈ P` such that *no other element in `P` is strictly larger*. If `m ≤ x` and `x ∈ P`, then `x = m`. Contrast with *greatest element* (bigger than *everything*). Maximal means 'nothing bigger', not 'biggest'."
  3.  **Why this Hypothesis? (The Workhorse):** "This `every chain has a bound` condition is what prevents infinite regress. It stops you from building bigger and bigger elements forever without ever reaching a 'stopping point' element that can't be surpassed. It forces the existence of a 'ceiling' for any possible increasing path."

  ### Phase 3: Navigating Misconceptions & Edge Cases (15 mins)
  1.  **"Maximal" vs. "Greatest":**
      *   *Actively Pose:* "Could a poset have maximal elements but no greatest element?"
      *   *Example:* `P = {{1}, {2}, {1,2}}` under `⊆`. `{1}` and `{2}` are maximal (nothing contains them properly). `{1,2}` is the greatest element. Remove `{1,2}`. Now `P' = {{1}, {2}}`. Both `{1}` and `{2}` are maximal, neither is greatest. Maximal just means "can't be extended in this *particular* way from *this* element."
      *   *Relate to Ideals:* "A maximal ideal `M` isn't contained in *any* larger *proper* ideal. There might be other maximal ideals (`N` with `M ⊄ N`, `N ⊄ M`), no single 'biggest' ideal."
  2.  **"Just Infinite Induction":**
      *   *Acknowledge:* "It feels like 'keep extending the chain'. But induction (ordinary or transfinite) requires a *well-ordered* index set. Chains are generally **not** well-ordered! They might be messy, uncountable, dense (like `ℚ ∩ [0,1]` under `≤`)."
      *   *Contrast:* "Induction lets you build objects *step-by-step* along a well-order. Zorn's Lemma jumps ahead: it says if *every possible path* (chain) you *could* build has a ceiling (upper bound), then a stopping point (maximal element) must exist *somewhere*, even if you couldn't construct it step-by-step."
      *   *Analogy:* "Imagine a maze. Induction is following one path step-by-step, hoping it leads out. Zorn's Lemma says: if *every possible path* in the maze has a point beyond which you can't go (upper bound), then there *must* be an exit (maximal element) somewhere, even if you didn't walk the path to it."
  3.  **"Obvious Construction ('Keep Extending')":**
      *   *Challenge:* "How would you *actually* 'keep extending'? What's your procedure? How do you handle uncountable chains? How do you know your process covers *all* chains?"
      *   *Crucial Point:* "The 'every chain has a bound' hypothesis is **stronger** than 'I can always add one more element'. It guarantees that even if you somehow built an *infinite* chain (maybe one you couldn't even list), it *still* has a limit within the set. This is what makes the existence proof work without an explicit construction."
      *   *Consequence:* "Zorn's Lemma is fundamentally *non-constructive*. It tells us a maximal element *exists* but gives **no algorithm** to find it or build it step-by-step."
  4.  **Edge Cases (Briefly & Confidently):**
      *   **The Empty Chain:** "What's an upper bound for the empty chain `∅ ⊆ P`? *Any* element `u ∈ P` satisfies `s ≤ u` for all `s ∈ ∅` (vacuously true!). The 'non-empty poset' condition ensures `P` has at least one element to serve as this upper bound. Don't overthink it. It's just ensuring the simplest possible chain is handled."
      *   **Chains with No Bound:** "If *any* chain lacked an upper bound, Zorn's Lemma **does not apply**. The hypothesis is an 'if...then...'. If the hypothesis isn't met (e.g., the poset is all *finite* subsets of an infinite set – chains like `{1} ⊆ {1,2} ⊆ {1,2,3} ⊆ ...` have no upper bound within the set), we cannot conclude a maximal element exists (and indeed, there isn't one in that example). The lemma only works when *every* chain is bounded."

  ### Phase 4: The Target Proof & Honesty About Foundations (15 mins)
  1.  **Setup:** "Recall: `R` commutative ring with unity. `I ⊊ R` a proper ideal. Goal: Show there exists a maximal ideal `M` with `I ⊆ M`."
  2.  **Define the Poset:** "Let `P` be the set of all **proper ideals** of `R` that **contain** `I`. Order `P` by inclusion `⊆`."
      *   "Is `P` non-empty? (Yes, `I ∈ P`)."
  3.  **Check Chains Have Upper Bounds:** "Take any chain `C` of ideals in `P` (so `J1 ⊆ J2 ⊆ J3 ⊆ ...`, all proper, all contain `I`). Consider `J = ∪_{K ∈ C} K`."
      *   "Is `J` an ideal? (Yes, standard argument: if `a, b ∈ J`, then `a ∈ K_a`, `b ∈ K_b` for some `K_a, K_b ∈ C`. Since `C` is a chain, say `K_a ⊆ K_b`, so `a, b ∈ K_b`, thus `a-b ∈ K_b ⊆ J`, `ra ∈ K_b ⊆ J` for `r ∈ R`.)"
      *   "Does `J` contain `I`? (Yes, each `K` does.)"
      *   "Is `J` proper? (Crucially, **Yes!** If `1 ∈ J`, then `1 ∈ K` for some `K ∈ C`. But `K` is proper (`K ∈ P`), so `1 ∉ K`, contradiction.)"
      *   "Is `J` an upper bound for `C`? (Yes, `K ⊆ J` for each `K ∈ C`.)"
      *   "Is `J ∈ P`? (Yes, by the above: proper, contains `I`.)"
      *   *Key Point:* "This works because ideals are defined by closure properties preserved under unions of chains, and the 'proper' condition is enforced by `1 ∉ K` for all `K ∈ C`."
  4.  **Apply Zorn's Lemma:** "`P` is non-empty. Every chain in `P` has an upper bound in `P` (we just proved it!). Therefore, by Zorn's Lemma, `P` has a maximal element `M`."
  5.  **Interpret the Maximal Element:** "What does `M` being maximal in `P` mean? `M` is a proper ideal (`M ∈ P`), contains `I` (`M ∈ P`), and there is **no larger proper ideal** containing `I`. If `M'` is proper and `M ⊆ M'` and `I ⊆ M'`, then `M' ∈ P`. But `M` is maximal in `P`, so `M = M'`. Thus `M` is a maximal ideal containing `I`."
  6.  **Honesty About Foundations:**
      *   "Zorn's Lemma is powerful, but where does it come from? It's equivalent to the Axiom of Choice (AC). AC says, roughly, that given any collection of non-empty sets, you can choose one element from each set simultaneously."
      *   **What to Refuse:** "We will **not** prove Zorn's Lemma. We will **not** prove its equivalence to AC or the Well-Ordering Theorem. We will **not** delve deeply into axiomatic set theory."
      *   **How to Say It Honestly:** "Think of AC/Zorn's Lemma as a fundamental mathematical 'toolbox' assertion about infinite sets. Just like we accept that infinite sets exist or that proofs by induction work, modern mathematics accepts this toolbox. It's not 'magic' in the sense of being inconsistent; it's a carefully studied postulate. Many fundamental results (like this one, existence of bases, Tychonoff's theorem) depend on it. For this course, we take Zorn's Lemma as a given tool for proving existence when constructions are impossible."

  ### Phase 5: Assessment Exercise (5 mins or Take-Home)
  **Exercise:** Prove that every vector space (over any field) has a basis. *(Adapt the ideal proof structure!)*
  *   *What Shows Success:* Defining `P` = set of linearly independent subsets, ordered by `⊆`. Showing `P ≠ ∅` (e.g., `∅` is LI). Taking a chain `C` of LI sets, showing `U = ∪C` is LI (linear dependence would involve finitely many vectors, hence lie in some set in the chain). Applying ZL to get a maximal LI set `B`. Arguing `B` spans (if not, a vector outside `span(B)` could be added to `B`, contradicting maximality).
  *   *Why it Works:* It directly parallels the ideal proof (poset of "partial solutions" with a property, chains bounded by unions, maximal element shown to be the desired object). It requires understanding the lemma's structure, not just the statement.

  **Key Takeaways to Emphasize Throughout:**
  1.  Zorn's Lemma guarantees existence (non-constructively) under a strong condition (every chain bounded).
  2.  `every chain has an upper bound` is the active hypothesis preventing infinite regress.
  3.  Maximal != Greatest; chains != well-ordered; construction is impossible.
  4.  The ideal proof is the quintessential application template.
  5.  ZL is a foundational tool we use, not something we prove in this course.
