prompt: |-
  Me and a friend keep going around in cirlces on this one, and I'd like an outside read with actual numbers attached. The question: when someone has a strong, immediate moral reaction to something, but after a lot of prodding can't produce any reason for it beyond "it just seems wrong," should moral theorizing give that reaction any evidential weight, or write it off as bias? The stock examples are the dumbfounding cases where every conceivable harm has been engineered away (the famous sibling pair with foolproof contraception and no downstream effects), but I'm just as interested in fresher ones, like people's unease with meat cultured from human cells, or with letting a fully automated system decide who gets a donated organ when the candidates are identical on paper. In those cases the person often concedes there's no harm they can point to and still insists the reaction isn't nothing.

  My credence that such unreasoned reactions should get roughly zero weight in serious moral theorizing is about 0.65. Hers is around 0.2 -- her line is that these reactions are data about what we actually value, and you don't get to throw out data just because it's embarassing or hard to justify. Give me your own number, but what I really want is the decomposition: roughly how much turns on whether reflective equilibrium is the right method at all (where "unchecked" intuitions get downweighted), how much on whether "bias" is even a coherent category here rather than just "a preference I don't happen to share", how much on whether an intuition's evolutionary or cultural origin can discredit it without committing some version of the genetic fallacy, and whatever else you think belongs in there. One line of justification per term, then show how they combine into your final number.

  After that, two more things. First, tell me which term is doing the most work in pulling my 0.65 and her 0.2 apart -- I suspect we disagree less about moral method than about what "counting as evidence" even means for a feeling, but I might be wrong. Second, tell me what kind of case or argument would plausibly move the two of us toward each other, even if only a little.

  Please write it as plain continuous prose, like an email -- no headings, bullet points, bold text, or tables. And if you think the whole framing is confused somewhere, say so rather than playing along.
