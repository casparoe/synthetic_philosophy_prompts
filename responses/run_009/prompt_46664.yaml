answer: |-
  Here's my take, broken down as requested. My own credence that unreasoned strong moral reactions should get *roughly zero weight* in serious moral theorizing sits around 0.4. I land closer to your friend, but with significant reservations that prevent me going as low as 0.2. Here’s how the decomposition shakes out:

  First, the role of **reflective equilibrium as the right method**. This pulls strongly towards discounting the raw intuition. If moral theorizing is about achieving coherence between our specific judgments and general principles through reasoned reflection, then an intuition that stubbornly resists articulation or justification *must* be provisional. It’s a starting point, perhaps, but one that hasn’t earned its keep in the final system. It’s like a rough draft needing editing. This factor contributes about 0.6 to the discounting side for me – it heavily favors your position that unreflective feelings shouldn't hold sway.

  Second, the **"bias vs. legitimate preference" ambiguity**. This is where I diverge from your credence significantly. Calling it "bias" assumes we have a clear, objective baseline for what a "pure" moral judgment looks like, free from evolutionary or cultural shaping. But *all* our moral intuitions are shaped this way. The feeling that suffering is bad likely has evolutionary roots; that doesn't make it wrong. Dismissing an intuition *solely* because it feels "unreasoned" risks mistaking articulation for existence – just because we can't *yet* point to a harm or principle doesn't mean there isn't a value being signaled, however imperfectly. The unease about cultured human meat might point to a deep, non-harm-based value concerning bodily integrity, the sacred, or symbolic meaning that consequentialism struggles to capture. This factor leans heavily against discounting, contributing about 0.7 to the idea that the feeling *is* data worth considering (even if not decisive).

  Third, the **genetic fallacy/origin problem**. This is crucial. Knowing an intuition's origin (e.g., evolved disgust response, cultural taboo) doesn't automatically invalidate it. The origin might *explain* why we have it, but it doesn't *determine* its moral validity. We need to evaluate the intuition based on whether the reasons potentially underlying it (once uncovered) hold up under reflection, not just its pedigree. Rejecting the sibling case *because* it stems from an evolved incest-avoidance mechanism would indeed commit the genetic fallacy. The origin gives us caution, not dismissal. This factor contributes moderately against discounting, about 0.5 – origins matter diagnostically but aren't dispositive.

  Fourth, **the possibility of moral perception**. Some argue strong moral intuitions, especially widely shared ones about novel situations, might be a form of perception – a direct (though fallible) apprehension of a moral feature, like apprehending cruelty. We don't demand immediate articulated reasons for sensory perceptions; we investigate them. Similarly, a persistent, deep unease might be perceiving a wrong-making property we haven't conceptualized yet. This isn't always true, but the possibility means giving *some* initial weight, contributing weakly against discounting, about 0.3.

  Combining these weights isn't simple addition, but averaging their directional pushes (heavily discounting from method, strongly against discounting from bias/preference, moderately against from origin, weakly against from perception) lands me near 0.4. The intuition gets *low* weight as direct evidence for a moral *truth*, but significant weight as *data* about human moral psychology and *potential* signposts for values needing articulation. Writing it off completely (0) feels premature; giving it decisive weight (1) ignores the necessity of reason.

  **The biggest gap between your 0.65 and her 0.2?** It's almost certainly the **"bias vs. legitimate preference/value signal"** term. You likely see the inability to articulate a reason *itself* as strong evidence the reaction is a misleading bias, a glitch to be overridden. She likely sees that same inability as irrelevant to the feeling's status as evidence of a deeply held value – data to be explained or integrated, not dismissed. It's a fundamental difference in what constitutes "evidence" in the moral domain. Is evidence only articulated reasons, or does the raw phenomenological response count? Your framing prioritizes the former; hers, the latter.

  **Moving towards each other:** A few things might help. For you moving towards her (lowering your 0.65): Consider historical examples where strong, initially "dumbfounded" intuitions (e.g., deep unease about certain forms of exploitation or environmental destruction predating fully articulated harm-based or rights-based arguments) later gained robust rational justifications. The intuition was a canary in the coal mine. Also, examine if *your own* considered moral positions rely on intuitions you struggle to fully ground without circularity (e.g., the intrinsic wrongness of suffering?). Acknowledging this might soften the "zero weight" stance.

  For her moving towards you (raising her 0.2): Focus on clear cases where strong, widespread intuitions *are* demonstrably harmful biases we rightly reject upon reflection (e.g., historical intuitions about racial inferiority, caste purity, or "unnatural" same-sex relationships). If she agrees these intuitions *should* get zero weight in *serious theorizing* (even if they are "data" about past values), it forces a distinction between "data about values people hold" and "evidence for moral truth." Pressing *why* some dumbfounded intuitions (like the sibling case) seem philosophically discardable while others (like organ allocation unease) feel more persistent might help refine her criteria for when raw feelings merit serious consideration.

  The framing isn't entirely confused, but it risks oversimplifying. "Weight" needs specifying: weight for *what*? For discovering moral truth? For predicting behavior? For constructing a coherent system? And "zero weight" might be too stark – even biases are data points about the moral landscape we inhabit. The real challenge is integrating the felt reality of moral experience with the demands of reason, without letting either utterly silence the other. My 0.4 reflects that messy middle ground.
