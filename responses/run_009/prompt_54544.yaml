answer: |-
  Below is a 10-question quiz designed to uncover your core intuitions in population ethics without referencing formal theories. Each question forces a choice between two futures or policies, with verdict-based options. The scoring key maps your answers to the logical space of possible views, identifies named theories where they fit, flags unoccupied or problematic combinations, and honestly notes ambiguities.

  ---

  ### **Quiz: Which Future is Better?**
  **Instructions:** For each scenario, choose the verdict that best reflects your judgment. Answer intuitively—there are no "right" answers.

  1. **Scenario**:  
     - **Future A**: 5 billion people with extraordinary, fulfilling lives (e.g., thriving health, deep relationships, minimal suffering).  
     - **Future B**: 20 trillion people with lives barely worth living (e.g., monotonous but pain-free existence, no joy beyond avoiding misery).  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Neither is better; they’re incomparable  
     (d) Neither is better; they’re equally good  

  2. **Scenario**:  
     - **Future A**: 1 billion people with very high well-being (e.g., vibrant health, creative freedom).  
     - **Future B**: 2 billion people with good but noticeably lower well-being (e.g., secure but routine lives).  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  3. **Scenario**:  
     - **Policy A**: Maintain current climate policies. Future population is 8 billion, all with high well-being.  
     - **Policy B**: Aggressive green tech. Future population is 8 billion (entirely *different people* due to altered timelines), all with *slightly higher* well-being than A.  
     *Note: No one in B is worse off than they’d be in A.*  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  4. **Scenario**:  
     - **Future A**: Create 10 million people with good lives (e.g., moderate happiness).  
     - **Future B**: Create 10 million people with excruciating lives (e.g., chronic pain) *and* 10 million people with ecstatic lives (e.g., boundless joy).  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  5. **Scenario**:  
     - **Future A**: 1 billion people at well-being level 100; 1 billion at level 80.  
     - **Future B**: 1 billion at level 102; 1 billion at level 79.  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  6. **Scenario**:  
     - **Future A**: 1 billion people with modest but positive lives (e.g., basic needs met, simple pleasures).  
     - **Future B**: 5 billion people with slightly lower but still positive lives (e.g., more scarcity but net fulfillment).  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  7. **Scenario**:  
     - **Policy A**: Ban genetic editing. Future has 1 billion healthy people (well-being 100).  
     - **Policy B**: Allow editing. Future has 1 billion people (well-being 101) *and* 1 billion with lives barely worth living (well-being 1), all different people from A.  
     *Note: No one is harmed by choosing B over A.*  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  8. **Scenario**:  
     - **Future A**: 1,000 people with near-perfect lives (e.g., minimal suffering, profound flourishing).  
     - **Future B**: 1 quadrillion people with lives just above neutral (e.g., fleeting contentment, no lows or highs).  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  9. **Scenario**:  
     - **Future A**: 10 billion people with high well-being.  
     - **Future B**: 10 billion people with equally high well-being *and* one additional person with a good (but lower) life.  
     **Verdict**:  
     (a) A is better  
     (b) B is better  
     (c) Incomparable  
     (d) Equally good  

  10. **Scenario**:  
      - **Policy A**: Preserve ecosystems. Future has 500 million people with excellent lives.  
      - **Policy B**: Prioritize tech growth. Future has 500 million people (different from A) with *even better* lives, but extinct species cause 1 million people to exist with mild, chronic dissatisfaction.  
      *Note: No one in B is worse off than they’d be in A.*  
      **Verdict**:  
      (a) A is better  
      (b) B is better  
      (c) Incomparable  
      (d) Equally good  

  ---

  ### **Scoring Key: Mapping Your Verdicts to the Logical Space**
  **How It Works**:  
  - Each question tests a specific tension in population ethics (e.g., repugnant conclusion, non-identity problem).  
  - The logical space has **1,048,576 possible combinations** (4 options × 10 questions). Most are unoccupied because human intuitions cluster around coherent patterns.  
  - Named views (e.g., totalism) are mapped to combinations they *must* hold. Unoccupied combos are flagged as **incoherent**, **psychologically unstable**, or **unexplored**.  
  - Ambiguities are noted where the quiz can’t cleanly separate views.

  #### **Named Views and Their Required Verdicts**  
  (*Bold = definitive; italics = common but not universal*)  
  1. **Total Utilitarianism** ("Maximize total well-being"):  
     - Q1b, Q2b, Q3b, Q4b, Q5b, Q6b, Q7b, Q8b, Q9b, Q10b.  
     - *Bites all bullets: repugnant, sadistic, and non-identity conclusions.*  

  2. **Average Utilitarianism** ("Maximize average well-being"):  
     - Q1a, Q2a, Q3a, *Q4a*, Q5b, Q6a, Q7a, Q8a, *Q9a*, Q10a.  
     - *Rejects repugnance (Q1a) and mere addition (Q7a). Favors higher averages even with lower totals (Q2a, Q6a).*  

  3. **Person-Affecting View** ("Better/worse only if someone is affected"):  
     - Q1c/d, Q2c/d, **Q3a**, Q4a, *Q5a*, *Q6c/d*, Q7c/d, Q8c/d, **Q9c/d**, **Q10a**.  
     - *Rejects B in Q3/Q7/Q10 (no one made better off). Q9c/d reflects asymmetry: no duty to create good lives.*  

  4. **Critical-Level Utilitarianism** ("Well-being must exceed a threshold to count"):  
     - **Q1a**, Q2a/c, Q3a, *Q4a*, Q5a/b, **Q6a**, Q7a, Q8a/c, *Q9a/c*, Q10a.  
     - *Rejects repugnance (Q1a) and "barely worth living" additions (Q6a, Q7a). Threshold varies by theory.*  

  5. **Leximin** ("Prioritize the worst-off"):  
     - **Q1a**, **Q2a**, **Q3a**, **Q4a**, **Q5a**, **Q6a**, **Q7a**, **Q8a**, *Q9a*, **Q10a**.  
     - *Always favors the future with fewer or better-off disadvantaged groups (Q5a, Q6a).*  

  #### **Unoccupied or Problematic Combinations**  
  - **Incoherent (Self-Contradictory)**:  
    - *Accept Mere Addition but Reject Repugnant Conclusion* (Q7b but Q1a): Implies B > A in Q7 (adding happy people is good) but A > B in Q1 (adding more "barely happy" people is bad). Violates transitivity if A→B→Q1-like futures. **Unoccupied** because indefensible.  
    - *Reject Negative Addition but Accept Sadistic Conclusion* (Q4a but Q10b): Claims A > B in Q4 (avoid creating suffering) but B > A in Q10 (creating dissatisfied people is acceptable if offset). Incoherent if "avoid suffering" is a core principle.  

  - **Psychologically Unstable (Rare/Unintuitive)**:  
    - *Accept Repugnant but Reject Mere Addition* (Q1b but Q7a): Claims B > A in Q1 (massive "barely happy" population better) but A > B in Q7 (adding "barely happy" people worse). Psychologically jarring; few hold this.  
    - *Incomparability Everywhere* (All c/d): Avoids judgments but collapses into nihilism. Rarely applied consistently.  

  - **Unexplored (Theoretically Possible but Undefended)**:  
    - *Asymmetric Averaging* (Q9a but Q2b): Claims adding a person lowers average (Q9a) but prefers higher total with lower average (Q2b). Logically consistent but no known theory advocates it.  
    - *Non-Identity Absolutism* (Q3a, Q7a, Q10a): Always rejects policy changes that create different people. Coherent but ignores intuition that better lives are desirable (Q3).  

  #### **Limitations and Ambiguities**  
  - **Q5 (Worst-Off vs. Total)**: Leximin (Q5a) and total utilitarianism (Q5b) are separated cleanly. But critical-level and egalitarian views may overlap (both can prefer Q5a).  
  - **Q8 (Small Perfect vs. Vast Barely-Good)**: Totalism (Q8b) and averagism (Q8a) are distinct, but incomparabilists (Q8c) and person-affecting (Q8d) may converge.  
  - **Q9 (Adding a Good Life)**: Person-affecting (Q9c/d) and critical-level (Q9a) are separable, but average utilitarianism (Q9a) and leximin (Q9a) overlap.  
  - **Theories Not Fully Captured**:  
    - **Prioritarianism** and **sufficientarianism** often mirror leximin/critical-level.  
    - **Negative utilitarianism** (minimize suffering) is only partially tested (Q4, Q10).  
    - **Variable critical levels** create spectra, not discrete points.

  ---

  ### **Next Steps for Your Group**  
  1. **Take Quiz Anonymously**: Collect answers and compare distributions.  
  2. **Discuss Anomalies**: Why do inconsistent combos (e.g., Q1a + Q7b) feel intuitive?  
  3. **Explore Unoccupied Space**: Build a view that avoids repugnance (Q1a) but accepts mere addition (Q7b) without incoherence.  
  4. **Theory Deep Dive**: Use results to motivate readings (e.g., Parfit for mere addition paradox).  

  This quiz prioritizes your *verdicts* over labels, exposing where theories align with—or strain—your intuitions. It reveals the "logical geography" of population ethics, making abstract debates vividly concrete.
