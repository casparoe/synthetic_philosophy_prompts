prompt: |-
  so i've been hanging around rationalist blogs since the old lesswrong days (one-boxing threads, etc.) and something that's bugged me forever: every game theory textbook teaches backward induction as just The Way to solve finite sequential games, which means a rational player exits at the very first node of the centipede game, which means two "rational" players walk away with the tiny payoff while a pot of money sits two nodes further in. and the textbooks mostly don't treat this as embarrassing, they treat it as a theorem. meanwhile the same econ departments run classroom centipede demos where actual students almost never take at node one, and nobody seems to think this counts against the solution concept. so here's what i want to know: what does that whole practice -- teaching backward induction as the canonical solution for finite games, grading students on it, using the same reasoning in auction design and mechanism design -- actually presuppose about rationality? my hunch is it's smuggling in something like causal decision theory plus common knowledge of rationality all the way down, and that the combo is actually incoherent once you're at any node past the first (if i find myself at node 3, i've just learned something that contradicts the common knowledge backward induction was supposed to start from, so how do i still get to apply it at node 3?). but reconstruct it properly: which parts of the practice strictly require common knowledge of rationality vs merely fit well with it, which rival views of rationality would license the same teaching practice anyway (superrationality, updateless/functional decision theory, the idea that rationality is about choosing policies rather than node-by-node moves), and where is the practice just underdetermined so that several theories would endorse it? and tell me whether the standard escape hatch -- "backward induction is a prediction about idealized agents, not advice for messy humans, so the classroom behavior isn't a counterexample" -- actually saves the practice or just relocates the problem somewhere worse.

  lead with your bottom line in the first sentence and then give the reasoning, no preamble, no restating my question back at me.
reasoning: |-
  Okay, the user is deeply familiar with rationalist blogs and game theory, particularly the centipede game paradox. They're frustrated that textbooks teach backward induction as the solution, even though real humans don't behave that way in experiments. Their core question is about what assumptions this teaching practice relies on and whether the standard defense holds up.

  First, I need to pinpoint the exact presuppositions. Backward induction requires two key things: causal decision theory (CDT) and common knowledge of rationality (CKR). CDT means players only care about direct consequences of their actions, not correlations with others' behavior. CKR ensures everyone knows everyone is rational, knows that everyone knows, and so on, infinitely. Without CKR, the induction breaks down—if I doubt your rationality at any point, I might cooperate hoping for a higher payoff later.

  The user's hunch about CDT and CKR being central is correct. But they also want to know if other theories could justify the same teaching. Superrationality (Hofstadter) or functional/updateless decision theory might lead to different behaviors, like cooperating in centipede. These approaches consider the global policy or logical correlation, not just local moves. So backward induction isn't the only possible "rational" solution under different frameworks.

  The classroom experiments show humans don't follow backward induction. The standard defense is that it's for idealized agents, not humans. But this might relocate the problem: if the solution only applies under unrealistic CKR, is it useful? For mechanism design, it might still be practical if agents are expected to be rational. However, in real-world applications where CKR fails, the predictions could be flawed.

  The user might be probing whether game theory is internally consistent or practically applicable. Their deeper need could be understanding if rationality, as defined in textbooks, is coherent or if alternative models better explain human behavior. They might also be interested in how these assumptions affect economic models and policy designs.

  So, the bottom line: backward induction relies on CDT and CKR, which are fragile. Alternative theories like UDT or superrationality don't necessarily endorse it. The escape hatch acknowledges the idealization but doesn't resolve the tension in real applications where CKR is implausible.
answer: |-
  **Bottom line: Teaching backward induction as the canonical solution presupposes *Causal Decision Theory (CDT) and Common Knowledge of Rationality (CKR)*, which together form a fragile and idealized foundation that breaks under its own assumptions in games like Centipede; rival views like Updateless Decision Theory (UDT) or Superrationality often reject backward induction, and the standard "idealized agents" defense relocates the problem to the implausibility of CKR in practice.**

  **Reasoning:**

  1.  **Core Presuppositions: CDT + CKR:**
      *   **Causal Decision Theory (CDT):** Players evaluate actions *only* based on their direct causal consequences at the current decision node, ignoring any information about *how* they reached that node or what it might signal about other players. At any node, a CDT player asks "What move *causes* the best immediate outcome *from here*?" leading them to take the money immediately in Centipede.
      *   **Common Knowledge of Rationality (CKR):** It's not just that both players are rational. Player 1 knows Player 2 is rational. Player 2 knows Player 1 knows Player 2 is rational. Player 1 knows that Player 2 knows that Player 1 knows... ad infinitum. This infinite recursion *is* the fuel for backward induction. BI starts at the end and works backward because CKR guarantees both players know the BI outcome at every future node, so the only rational move *now* is the one dictated by BI *now*.

  2.  **The Centipede Contradiction & CKR's Fragility:**
      *   Your hunch is correct. If a player finds themselves at node 3 in Centipede, CKR has *already* been falsified. According to the BI solution based on CKR, node 3 should *never be reached* because rational players would have taken the money at node 1 or 2. Reaching node 3 means Player 1 *didn't* take the money at node 1 (irrational under BI/CKR) or Player 2 *didn't* take it at node 2 (also irrational). Therefore, the premise of CKR – the foundation of the BI prediction – is contradicted by the information revealed by simply *being* at node 3.
      *   **Strict Requirement:** Applying BI *at past-the-first nodes* strictly requires ignoring this contradiction and *still* assuming CKR holds for future play. This is logically inconsistent with the information gained from having reached that node. BI requires players to act *as if* CKR still holds, even when the history proves it didn't. CDT provides the mechanism for ignoring the history/signal.

  3.  **Rival Views Reject Backward Induction:**
      *   **Superrationality (Hofstadter):** Focuses on symmetric, one-shot reasoning about identical players. In Centipede, superrational players might cooperate throughout, seeing mutual cooperation as the uniquely rational joint outcome. They reject the node-by-node myopia of BI.
      *   **Updateless/Functional Decision Theory (UDT):** Chooses an optimal *policy* (strategy) *before* the game starts, considering logical correlations between players' decision algorithms. A UDT agent might precommit to a policy of cooperating for several steps in Centipede, recognizing that this policy (if mirrored) yields higher payoff than the BI policy, even if it means potentially losing at an earlier node if the other player defects. UDT agents *update* their beliefs about the world state, but not their *decision function*. They reject CDT's local causal focus and BI's reliance on updating within the game tree under CKR.
      *   **Policy Rationality:** Similar to UDT, emphasizes choosing the best overall strategy rather than optimizing locally at each node. BI is seen as a special case only valid under the implausible assumption of CKR.

  4.  **Where Practice is Underdetermined/Endorsed:**
      *   The practice is *only* strictly endorsed by theories accepting both CDT and CKR as fundamental. Standard neoclassical game theory (as taught) assumes this.
      *   Theories emphasizing *Nash Equilibrium* as the solution concept might arrive at the BI outcome for Centipede *if* they insist it's the only subgame perfect equilibrium, but this still relies on the CKR-like assumption that players will play equilibrium strategies throughout, facing the same contradiction at later nodes.
      *   Theories focused solely on *dominance arguments* might justify the first move (taking is dominant at the last node, making passing weakly dominated at the second-last, etc.), but this chain also implicitly assumes players believe others will act rationally in the future (a weaker form of CKR).

  5.  **The "Idealized Agents" Escape Hatch:**
      *   **Relocates, Doesn't Resolve:** This defense *acknowledges* that BI requires CKR but claims humans are flawed. However, the core problem isn't just human messiness; it's the *logical fragility* of CKR itself.
      *   **The Bigger Problem:** The defense relocates the problem to the *plausibility* of CKR as a modeling assumption. If CKR is so fragile that it's shattered by the mere act of reaching node 2, how useful is a theory *predicated* on it for *any* interactive situation where players might learn from history? BI requires agents to maintain belief in CKR *even when the game history provides direct evidence against it*. This makes BI predictions fundamentally unstable for any agent capable of learning. The "idealization" becomes an internally inconsistent fiction.
      *   **Practical Consequence:** While BI *is* useful for designing mechanisms where incentives are clear and players truly believe others are perfectly rational strategic automatons (rare in reality), the Centipede paradox highlights that its foundational assumptions are unsustainable upon learning, severely limiting its predictive power and raising questions about its normative force even for idealized agents capable of updating beliefs. Teaching it as *the* solution obscures these deep conceptual issues.
