  2. Tracking/sensitivity-style externalism: KK fails because knowing that you know would require tracking your own tracking (i.e., sensitivity to the truth of the first-order belief). This is a form of externalism that emphasizes counterfactual conditions.
  3. Hintikka-style internalism: KK is built into the concept of knowledge itself (i.e., if one knows, then one is in a position to know that one knows, at least in principle).
  4. Moderate reflection view: Reflection can restore KK, but self-doubt or lack of reflection may block it. So, in principle, with sufficient reflection, one can know that one knows.
