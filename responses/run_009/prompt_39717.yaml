  1. **Q1:** You're feeling freezing cold right now—unmistakably cold. Just by focusing on how it feels, can you always know for sure you're cold?  
     - **Yes** → Q2  
     - **No** → *Williamsonian/Tracking (W/T)*  *(Even clear cases aren't luminous)*  

  2. **Q2:** Imagine you're gradually warming up. At some point, you're *barely* cold—still cold, but so close to "not cold" you couldn't feel the difference. In that moment, can you know for sure you're cold, just by focusing?  
     - **Yes** → Q3  
     - **No** → Q4  

  3. **Q3:** In that "barely cold" moment, if you were *actually* a tiny bit warmer (but couldn't tell the difference), would you still *think* you're cold?  
     - **Yes** → Q5  
     - **No** → *Moderate Reflection (M)*  *(Reflection fixes it)*  

  4. **Q4:** In that "barely cold" moment, can you at least know for sure that you *don't know* whether you're cold?  
     - **Yes** → *Reverse Failure (R)*  
     - **No** → *Williamsonian/Tracking (W/T)*  *(No higher-order knowledge either)*  

  5. **Q5:** That mistake in the "tiny bit warmer" case—does it mean you didn't *really* know you were cold in the actual "barely cold" moment?  
     - **Yes** → Q6  
     - **No** → Q7  

  6. **Q6:** Could a perfect reasoner—infinitely reflective, no self-doubt—still fail to know they're cold in that "barely cold" moment?  
     - **Yes** → Q8  
     - **No** → *Moderate Reflection (M)*  

  7. **Q7:** For boring truths like "2+2=4," if you know it, must you *also* know that you know it—even if you never think about it?  
     - **Yes** → *Hintikka (H)*  
     - **No** → *Moderate Reflection (M)*  

  8. **Q8:** Is the problem here that knowing you're cold requires your belief to "track" the world (like a radar), and knowing *that you know* would need a whole extra radar to track the first radar?  
     - **Yes** → *Tracking Externalism (T)*  
     - **No** → *Williamsonian Anti-Luminism (W)*  

  ---

  ### **Logical Space and Position Mapping**
  The tree has **7 nodes** (Q1–Q8, with Q8 conditional). All answer combinations are logically possible, but some branches lead to the same leaf (W/T) for simplicity. Below, paths are shown as answer sequences (e.g., "Q1:Yes → Q2:Yes → Q3:Yes → Q5:Yes → Q6:Yes → Q8:No" = **W**).  

  | Position                      | Path in Tree                                                                 | Key Commitments                                                                 |
  |-------------------------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Williamsonian Anti-Luminism (W)** | Q1:Yes → Q2:Yes → Q3:Yes → Q5:Yes → Q6:Yes → Q8:No                           | Margin-for-error: Knowledge requires safety from error in close cases. Perfect reflection can't beat gradual change. |
  | **Tracking Externalism (T)**        | Q1:Yes → Q2:Yes → Q3:Yes → Q5:Yes → Q6:Yes → Q8:Yes                          | KK fails because "knowing you know" requires tracking your first-order tracking (sensitivity). Not just about gradual change. |
  | **Hintikka-Style Internalism (H)**  | Q1:Yes → Q2:Yes → Q3:Yes → Q5:No → Q7:Yes                                    | KK is analytic: If you know P, you're always in a position to know you know P (no extra work needed). |
  | **Moderate Reflection (M)**         | Branches:<br> - Q1:Yes → Q2:No<br> - Q1:Yes → Q2:Yes → Q3:No<br> - Q1:Yes → Q2:Yes → Q3:Yes → Q5:Yes → Q6:No<br> - Q1:Yes → Q2:Yes → Q3:Yes → Q5:No → Q7:No | KK fails without reflection, but perfect reflection restores it. Self-doubt or laziness breaks it, not the world's structure. |
  | **Reverse Failure (R)**             | Q1:Yes → Q2:No → Q4:Yes                                                      | Knowing you *don't know* is easier/more common than knowing you know. KK fails because we often "know we're ignorant." |

  ---

  ### **Unexplored/Incoherent Branches**
  - **Q1:No → W/T**: This branch is coherent but *unattractive*. Few deny luminosity for clear cases (e.g., intense cold), as even Williamson accepts it. If someone takes this path, they're an extreme externalist (grouped with W/T).
  - **Q3:No → M**: Assumes you *can* distinguish indistinguishable states. This is *incoherent*—if you can't feel the difference, you can't avoid the same belief in close cases. Only plausible with contextualism (not in your positions).
  - **Q5:No → Q7:No → M**: Denies safety/tracking matters *and* denies KK for math but still thinks reflection fixes it. Logically possible but *unexplored*—no major epistemology position holds this.

  ---

  ### **Indistinguishable Leaves and Bonus Split**
  - **Williamsonian (W) and Tracking (T) share a branch until Q8**. The tree *cannot* split them at earlier nodes because both:  
    - Accept anti-luminosity in borderline cases (Q2:Yes).  
    - Cite reliability issues in close cases (Q5:Yes).  
    - Deny perfect reflection helps (Q6:Yes).  
    - *Why?* W (safety) and T (sensitivity) converge on concrete cases like gradual warming. Only a meta-question about *why* reliability fails separates them.  

  **Bonus Question to Split W and T (for theory only)**:  
  > **QB:** In the "barely cold" case, is the core issue that you might believe you're cold even if you *weren't* (which would make your belief unsafe), or that you *wouldn't* believe you're cold if you *weren't* (which would make your belief insensitive)?  
  > - **Unsafe belief → Williamsonian (W)**  
  > - **Insensitive belief → Tracking (T)**  
  > *But note:* This uses jargon ("unsafe," "insensitive") and isn't pub-friendly. Use only if the group understands the distinction.

