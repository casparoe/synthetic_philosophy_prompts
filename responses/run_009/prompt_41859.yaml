  Hmm, the user is preparing a position statement on Moore's paradox for a philosophy of language seminar and wants me to audit their six commitments for internal consistency. They suspect at least two are in tension but can't identify which ones. I need to analyze how these propositions interact with each other.

  Looking at their commitments: 
  (1) Moorean sentences are logically consistent but pragmatically absurd. 
  (2) Absurdity comes from assertion norms (presenting belief while denying it). 
  (3) Absurdity persists without assertion. 
  (4) Sincere assertion expresses belief. 
  (5) Belief avowals have special authority and function as indirect assertions. 
  (6) Belief is dispositional and allows for self-deception.

  The core tension lies between (3) and (2). Claim (3) says the absurdity exists even without assertion, while (2) grounds it purely in assertion norms. This is a fundamental conflict - if absurdity survives in private thought, it can't be entirely explained by public speech acts. 

  A secondary tension emerges between (5) and (6). (5) claims we can't be mistaken about our beliefs when we avow them, but (6) insists self-deception makes such errors possible. This creates a contradiction regarding first-person authority. 

  (1) and (4) actually support each other - logical consistency pairs well with pragmatic explanations. (4) also reinforces (2)'s assertion-based view. The problem is (3) disrupts this by demanding an explanation beyond assertion.

  The cheapest fix would be to modify (3). If we reinterpret "absurdity" in private thought as stemming from the same norms that govern assertion (perhaps through the idea that thinking simulates asserting), we preserve most of the framework. This keeps (2) intact while addressing (3)'s concern. However, (5) and (6) would still need careful handling regarding self-deception cases.

  For the response structure, I'll follow their requested format: preliminary assessment (noting the package isn't fully tenable), tensions section (detailing the (3)/(2) conflict and then (5)/(6)), apparent tensions (showing where conflicts are superficial), and finally the cheapest revision (modifying (3) with minimal disruption).
answer: |-
  ### Preliminary Assessment
  Your package is not jointly tenable as it stands. While (1), (2), (4), and (6) can cohere under a broadly Gricean/dispositional framework, (3) creates a critical tension with (2), and (5) clashes with (6) on self-deception’s implications for first-person authority. Without revision, these undermine the consistency of your account.

  ---

  ### Tensions, Most Severe First
  **1. Tension between (3) and (2)/(4)**  
  *(Severity: Critical)*  
  (3) claims the absurdity of Moorean thoughts persists *without assertion*, while (2) grounds absurdity *entirely* in the norms of assertion (via the act of presenting oneself as believing *p*). (4) reinforces this by tying sincere assertion directly to belief-expression. If the absurdity arises solely from assertion’s constitutive norms, it cannot survive in private thought, as no assertion occurs. (3) demands an explanation of absurdity that transcends linguistic practice, but your account offers none.  
  *Resolution Cost*: To reconcile this, you must either:  
  (a) **Abandon (3)** and limit absurdity to asserted contexts (undermining the intuition that the thought itself is defective), or  
  (b) **Revise (2)/(4)** to allow that *entertaining a thought* simulates assertion-norms (e.g., via commitment to rationality). This weakens (2)’s pragmatic purity but saves (3).  

  **2. Tension between (5) and (6)**  
  *(Severity: High)*  
  (5) holds that present-tense belief avowals (“I believe *p*”) enjoy "special authority" and function as *indirect assertions* of *p*, making them "hardly mistaken". Yet (6) insists belief is dispositional and allows for self-deception, where one may sincerely avow a belief they *lack* (e.g., a repressed belief). This creates conflict: if self-deception falsifies an avowal (per (6)), then avowals *can* be mistaken, contradicting (5)’s claim of near-infallibility. (5)’s "indirect assertion" view also struggles with disavowals in Moorean sentences ("I don't believe *p*"), which (6) might render sincere yet false.  
  *Resolution Cost*: To reconcile, either:  
  (a) **Moderate (5)** to allow that avowals, while normally authoritative, *can* be undermined by self-deception (weakening "hardly mistaken"), or  
  (b) **Qualify (6)** to exclude self-deception from "sincere" avowals (straining plausibility).  

  ---

  ### Apparent Tensions  
  **1. (1) vs. (2)/(4):** No genuine conflict. (1)’s logical consistency is compatible with (2)/(4)’s pragmatic absurdity. Contingently true but unassertable sentences are commonplace (e.g., "I am not speaking").  
  **2. (4) vs. (6):** Superficially, if belief is dispositional (6), can sincere assertion *express* it (4)? Yes: dispositions manifest in acts. Asserting *p* manifests the belief-disposition (e.g., to defend *p*). No tension.  
  **3. (2) vs. (5):** (5)’s "indirect assertion" view complements (2): asserting "I believe *p*" presents belief in *p*, so denying it ("*p* but I don’t believe it") clashes. They cohere.  

  ---

  ### The Cheapest Single Revision  
  **Revise (3)** to: "The absurdity *primarily* arises in assertoric contexts but *may extend* to solitary thought as a derivative phenomenon, reflecting the internalisation of assertion-norms or rational commitment."  
  *Why cheapest?* It preserves (2)’s core pragmatic mechanism while accommodating (3)’s intuition at minimal cost. (1), (4), (5), and (6) remain largely untouched.  
  *Residual Untidiness?* Yes: the tension between (5) and (6) on self-deception remains unresolved. While less critical than the (3)/(2) clash, it requires nuanced handling (e.g., conceding that avowals are *defeasibly* authoritative).  

  ---  
  **Key Recommendation**: Prioritise resolving the (3)/(2) tension via the above revision, then explicitly address the (5)/(6) issue by limiting (5)’s infallibility claim to *non-self-deceived* cases. This maintains your dispositionalism while honouring Moorean phenomena.
