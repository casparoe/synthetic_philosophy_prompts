  Second, step (4) ignores that temporal distance uniquely involves uncertainty. The further in the future, the more uncertainty about whether the harm will even occur or what the world will be like. Repairing this costs by forcing acknowledgement that pure time preference might not be so "pure" after all.

  Third, the argument assumes that only distance matters, but in temporal discounting, the decision-maker's identity persists over time in a way that spatial entities don't. Repairing this costs by requiring justification for why the temporal self is privileged.

  Fourth, step (5) commits a category error by comparing individual decision-makers to nations. Repairing this costs by restricting the spatial analogy to individual planners.

  Fifth, step (3) mischaracterizes pure time preference as being about distance rather than a preference for present welfare. Repairing this costs by collapsing pure time preference into a form of ethical egoism.

