  ### Bertrand's Chord Paradox Activity Design

  #### **Learning Goal**:  
  Students will empirically discover that the term "random chord" is ambiguous, leading to different probabilities for the same geometric event (chord > side of inscribed equilateral triangle). This sets the stage for understanding the principle of indifference and its partition-dependence.

  ---

  ### **Activity Setup**
  - **Duration**: 80 minutes  
  - **Students**: 16 (divided into 3 groups of 5–6)  
  - **Materials**:
    - **All stations**: Poster paper with a circle of radius **R = 30 cm** (drawn with bold marker). An inscribed equilateral triangle (side length = \(R\sqrt{3} \approx 52\) cm) and a dashed inner circle of radius **R/2 = 15 cm** centered at origin.  
    - **Tally sheets** for recording (columns: "Long", "Short", "Total").  
    - **Shared**: Calculators, timers, rulers, tokens for scoring (e.g., colored chips).  

  #### **Station 1: Random Endpoints**  
  - **Materials**:  
    - Two spinners (paper clips pinned at circle center, free to rotate).  
    - Protractor.  
    - String cut to triangle side length (52 cm) for direct comparison.  
  - **Procedure**:  
    1. Spin both spinners to mark endpoints A and B on the circumference.  
    2. Draw chord AB.  
    3. **Measure**: Central angle θ (smaller arc) with protractor.  
      - **Long chord**: θ > 120° (equilateral triangle side = 120°).  
    4. Record result.  
  - **Student Roles**:  
    - **Spinner 1** (handles first spinner).  
    - **Spinner 2** (handles second spinner).  
    - **Measurer** (uses protractor/string).  
    - **Recorder** (tally sheet).  
    - **Verifier** (double-checks measurement).  
  - **Theoretical Probability**: 1/3 (angle uniform on [0°, 180°]).  

  #### **Station 2: Random Midpoint**  
  - **Materials**:  
    - 20 small darts (e.g., blunt magnets or stickers).  
    - Ruler.  
  - **Procedure**:  
    1. Drop a dart from 1m height above poster.  
    2. If dart lands **outside circle**, reroll.  
    3. If dart lands **inside circle**:  
      - **Long chord**: Midpoint inside inner circle (distance from center < 15 cm).  
      - *No need to draw chord*; use ruler to measure distance.  
    4. Record result.  
  - **Student Roles**:  
    - **Dropper** (releases darts).  
    - **Measurer** (checks dart position with ruler).  
    - **Recorder** (tally sheet).  
    - **Retriever** (collects darts).  
    - **Verifier** (confirms distance).  
  - **Theoretical Probability**: 1/4 (area ratio: \(\pi(R/2)^2 / \pi R^2 = 1/4\)).  

  #### **Station 3: Random Straw (Line)**  
  - **Materials**:  
    - 30 straight straws (length > 60 cm).  
    - Thread spool (to mark intersection points).  
  - **Procedure**:  
    1. Drop a straw from 1m height.  
    2. Identify chord segment inside circle.  
    3. **Check**: Does the chord **intersect the inner circle**?  
      - **Long chord**: Chord crosses inner circle (distance from center to chord < 15 cm).  
      - *Use thread to verify*: Stretch thread from center; if perpendicular distance < 15 cm, chord is long.  
    4. Record result.  
  - **Student Roles**:  
    - **Dropper** (releases straw).  
    - **Marker** (outlines chord segment).  
    - **Measurer** (uses thread/ruler).  
    - **Recorder** (tally sheet).  
    - **Verifier** (confirms measurement).  
  - **Theoretical Probability**: 1/2 (distance uniform on [0, R]).  

  ---

  ### **Data Collection & Scoring**  
  - **Timeline**:  
    | Time | Phase |  
    |------|-------|  
    | 0–10 min | Instructor intro + group assignments |  
    | 10–35 min | **Activity**: Groups generate chords (goal: 50+ trials/station). |  
    | 35–40 min | **Pool data**: Groups compute relative frequency (long/total). |  
    | 40–45 min | **Report**: Stations share frequencies on board. |  
    | 45–80 min | Debrief + discussion |  

  - **Scoring Scheme (No Money)**:  
    - **Speed Tokens**: 1 token per 5 trials completed (encourages volume).  
    - **Accuracy Tokens**: 1 token if 95% CI of frequency includes theoretical probability (precomputed by TA).  
    - **Winner**: Group with most tokens gets "Paradox Champion" title + optional bonus point.  
    - *Purpose*: Incentivize rigorous sampling without revealing theoretical probabilities.  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Bias in Sampling**:  
     - **Straw Station**: Students aim straws to avoid inner circle.  
       - *Fix*: TA enforces "blind drop" (turn back, drop from fixed height).  
     - **Midpoint Station**: Students reroll darts near inner circle boundary.  
       - *Fix*: TA uses "boundary rule": On line, flip coin (heads=long, tails=short).  
     - **Endpoint Station**: Spinner friction causes clustering.  
       - *Fix*: Replace spinners with dice app (random angles).  

  2. **Measurement Errors**:  
     - **String/Protractor Misuse**: Students misread central angles.  
       - *Fix*: TA provides angle template (120° wedge) for visual aid.  
     - **Inner Circle Ambiguity**: Students debate "touching" vs. "crossing" inner circle.  
       - *Fix*: Rule: "Strictly inside = long; touching = reroll."  

  3. **Time Pressure**:  
     - Groups lag in trials → Prioritize volume (e.g., skip drawing chords where possible).  
     - TA circulates to streamline roles (e.g., Verifier becomes second Recorder).  

  ---

  ### **Debrief Structure**  
  1. **Empirical Result** (5 min):  
     - Display pooled frequencies (e.g., S1: ~0.33, S2: ~0.25, S3: ~0.50). Ask: *"Why are these different? Did all groups generate 'random chords'?"*  

  2. **Map to Bertrand’s Methods** (10 min):  
     | Station | Bertrand’s Method | Key Variable | Indifference Claim | Probability |  
     |---------|-------------------|--------------|---------------------|-------------|  
     | 1 | Random endpoints | Arc length | Uniform on circumference | \(P = 1/3\) |  
     | 2 | Random midpoint | Cartesian plane | Uniform on disk area | \(P = 1/4\) |  
     | 3 | Random radial distance | Polar coordinates | Uniform on radius | \(P = 1/2\) |  

  3. **Philosophical Connection** (15 min):  
     - **Principle of Indifference**: Each station’s "uniform" distribution is intuitively plausible but yields conflicting probabilities.  
     - **Partition-Relativity**:  
       - Indifference requires a choice of *parameterization* (arc length, area, radius).  
       - Example: Midpoint station’s area uniformity ≠ radius station’s linear uniformity.  
       - **Key Insight**: "Random chord" has no unique definition; probabilities are *relative to the sampling method*.  

  4. **Limitations of Experiment** (10 min):  
     - **What Data Shows**: Frequencies validate *specified procedures* (e.g., "random endpoints → P=1/3").  
     - **What Data Cannot Show**:  
       - No experiment resolves "true" probability for an *unparameterized* "random chord."  
       - Sampling answers "how" (procedure), not "which" (correct partition).  
     - **Instructor Note**: Emphasize during philosophical connection: *"The paradox isn’t that frequencies differ—it’s that indifference licenses all three methods as 'random,' exposing a flaw in the principle itself."*  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **The Unparameterized Problem**: The activity resolves frequencies for explicit procedures but cannot arbitrate which partition is "correct" for a generic "random chord." Sampling cannot fix indifference’s ambiguity—it only quantifies the consequences of a choice.  
  - **Instructor Role**: During debrief (Step 4), explicitly state: *"While data tells us the probability for a procedure, it cannot tell us which procedure captures 'true' randomness. That requires philosophical, not empirical, arbitration."*  
  - **Takeaway**: Students experience the paradox firsthand, priming them to critique indifference in subsequent readings.  

  This design balances hands-on discovery with conceptual rigor, ensuring students confront the paradox before formal analysis. Adjust materials as needed (e.g., digital tools for angles), but preserve the ambiguity in group instructions to maximize the "aha!" moment.
