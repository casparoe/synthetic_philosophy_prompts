    - Tally sheet.

  Station 3:
    - Poster with circle (radius R) and an inner circle (radius R/2).
    - A long straw (or a straight stick) longer than 2R.
    - Tally sheet.

  Note: The circle radius R should be large enough for easy measurement (e.g., R=30 cm). The inner circle for Stations 2 and 3 should be drawn with a dashed line to distinguish it.

  **Final note:** The instructor should run a trial of the activity beforehand to ensure the materials work and to see how many trials groups can do in 20 minutes. Adjust R and the materials accordingly.
