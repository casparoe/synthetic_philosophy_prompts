  First, I need to recall Dennett's ideas. He uses this phrase to describe how systems like evolution or simple algorithms can achieve sophisticated results without any underlying understanding. For evolution, it's about natural selection crafting complex organs like eyes without a designer. For Turing, it's about mechanical processes producing intelligent-seeming behavior. 

