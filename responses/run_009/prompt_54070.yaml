prompt: |-
  A pop history of economic thought I picked up secondhand (cant remember the author) summarizes the Robbins thing like this: back in the 1930s Lionel Robbins proved that comparing one person's utility with another's is literally meaningless, so economics had to give up cardinal utility and go ordinal, and to this day welfare economics and cost-benefit analysis rest on foundations that aren't scientific -- which also means utilitarianism, needing as it does to add up utilities across persons, stands refuted. It sounded persuasive, but economists obviously still do cost-benefit analysis and utilitarian philosophers haven't all quit, so something felt off. Can you go through it piece by piece: which parts a historian of economics would accept, which parts are conflations or overstatements, and whether the refutes-utilitarianism conclusion survives once the rest is corrected? For what its worth I'm inclined to think interpersonal comparisons are fine, at least in moral contexts, but I honestly dont know the economics side, so tell me where that inclination holds up and where it doesnt.
reasoning: |-
  Okay, let me start by unpacking this user's question. They mentioned a pop history book claiming Lionel Robbins proved interpersonal utility comparisons meaningless in the 1930s, leading economics to abandon cardinal utility for ordinal. The book also argues that this invalidates welfare economics, cost-benefit analysis, and utilitarianism. The user found it persuasive but noticed economists still do cost-benefit analysis and utilitarians haven't quit, so something feels off. They want a breakdown of what's accurate, what's overstated, and whether utilitarianism is truly refuted.

  First, I need to verify Robbins' actual contribution. I recall that his 1932 "Essay on the Nature and Significance of Economic Science" did argue against interpersonal utility comparisons. He used logical positivism to say that since utility isn't observable, such comparisons are value judgments, not scientific. But did he "prove" it meaningless? That's a strong claim. Robbins presented it as a methodological stance, not a proof. So the book might be overstating his position as a definitive proof.

  Next, the shift from cardinal to ordinal utility. The user's source suggests Robbins caused this shift. But the ordinal revolution started earlier with Pareto and others. Robbins influenced welfare economics, especially the move towards Pareto efficiency, but he wasn't the sole driver. Economists like Hicks and Allen were already working on ordinal utility. So attributing the entire shift to Robbins is an oversimplification.

  The claim that welfare economics and cost-benefit analysis rest on unscientific foundations needs scrutiny. Post-Robbins, welfare economics did rely on Pareto efficiency, which avoids interpersonal comparisons. But Kaldor-Hicks efficiency introduced potential compensation tests, which implicitly allow such comparisons. Cost-benefit analysis often uses willingness-to-pay as a proxy, which aggregates across individuals. While this involves value judgments, calling it "unscientific" might be too harsh. Economics incorporates these tools with transparency about their normative aspects.

  Then there's utilitarianism being refuted. Robbins' argument is about scientific measurement, not moral philosophy. Utilitarians can accept that while utility isn't cardinally measurable, we can still make interpersonal comparisons for ethical decisions. Philosophers like Harsanyi or modern utilitarians argue for modeled approaches. So Robbins' critique doesn't refute utilitarianism; it just questions its basis in positive economics.

  The user mentions their inclination to accept interpersonal comparisons in moral contexts. That aligns with the distinction between positive economics and normative ethics. Economists might avoid such comparisons in scientific work, but ethicists can embrace them. The user's intuition holds in moral philosophy but clashes with Robbins' methodological stance in economics.

  I should also consider the user's deeper needs. They might be wrestling with the validity of economic policies or moral philosophy foundations. They want reassurance that their inclination isn't naive and seek a nuanced view that bridges economics and ethics. Highlighting the difference between methodological constraints in economics versus ethical reasoning could address their concern.

  In summary, the book oversimplifies Robbins' role, overstates the shift to ordinal utility, misrepresents the foundations of applied economics, and conflates methodological critiques with philosophical refutations. The user's inclination holds in moral contexts but requires awareness of economics' methodological limits.
answer: |-
  This is a fantastic query that cuts to the heart of methodological debates in economics and ethics. Your pop history summary captures a common *narrative*, but it's a significant oversimplification and misrepresentation of both Robbins' contribution and the current state of play. Let's break it down piece by piece:

  1.  **"Lionel Robbins proved that comparing one person's utility with another's is literally meaningless..."**
      *   **What Robbins Actually Said (1932, *Essay on the Nature and Significance of Economic Science*):** Robbins didn't "prove" it in a mathematical or logical sense. He *argued* forcefully that interpersonal utility comparisons (IUCs) are **not scientific propositions** within the domain of positive economics. His reasoning was based on the prevailing logical positivist philosophy of science:
          *   **Unobservability:** Utility is a subjective mental state. We cannot directly observe, measure, or compare your internal feeling of satisfaction from a cup of coffee with mine from a slice of cake. There's no "utilometer."
          *   **Value Judgments:** Any claim that "Person A gains *more* utility from $100 than Person B loses" necessarily involves an *ethical* or *value judgment*. It's not a statement of fact verifiable by empirical evidence or logic alone.
          *   **Methodological Stance:** Robbins asserted that for economics to be a positive, value-free science (like physics), it must avoid propositions requiring IUCs. They belong to the realm of ethics or politics.
      *   **Historian's View:** Historians agree Robbins crystallized and popularized this view within economics. His influence was immense. However, they wouldn't say he "proved" IUCs meaningless *in all contexts* (especially ethical ones), only that they are unscientific *within the methodological framework he advocated for positive economics*. He framed it as a boundary for scientific economics, not an absolute truth about the universe.

  2.  **"...so economics had to give up cardinal utility and go ordinal..."**
      *   **The Shift Was Already Underway:** The "ordinal revolution" (focusing on ranking preferences rather than measuring utility magnitudes) was pioneered by Vilfredo Pareto (early 1900s) and significantly advanced by John Hicks and R.G.D. Allen in the 1930s, largely *independently* of Robbins. Their work showed that the core laws of demand (downward-sloping demand curves) could be derived without assuming cardinal utility or IUCs, using indifference curves and revealed preference.
      *   **Robbins' Role:** Robbins provided the powerful *methodological justification* for abandoning cardinal utility and IUCs within mainstream economic theory. He gave the ordinal approach a strong philosophical foundation aligned with positivist ideals of science. So, while he didn't initiate the technical shift, he was pivotal in cementing its dominance and justifying *why* economists *should* avoid cardinality and IUCs.
      *   **Historian's View:** This part is mostly correct *as a description of mainstream neoclassical theory development*. Robbins was a key figure in establishing the ordinal/IUC-avoidance paradigm as the standard for *theoretical* welfare economics and microeconomic theory. However, it overstates his role as the *sole* cause and understates the prior technical work of Pareto, Hicks, and Allen.

  3.  **"...to this day welfare economics and cost-benefit analysis rest on foundations that aren't scientific..."**
      *   **Welfare Economics (Theoretical):** Standard theoretical welfare economics after Robbins (and Bergson, Samuelson) relies heavily on the **Pareto criterion**: A change is an improvement if it makes at least one person better off without making anyone worse off. This explicitly avoids IUCs. However, Pareto improvements are rare in practice. Attempts to go beyond Pareto (like the Kaldor-Hicks compensation principle) *implicitly* rely on potential compensation, which many argue smuggles in IUCs or value judgments about the distribution of wealth.
      *   **Cost-Benefit Analysis (CBA - Applied):** This is where the claim is most problematic *as a wholesale dismissal*:
          *   **The Challenge:** CBA fundamentally requires aggregating costs and benefits *across different individuals*. This inherently involves weighing impacts on different people.
          *   **The Standard Practice:** CBA typically uses **willingness-to-pay (WTP)** or **willingness-to-accept (WTA)** as proxies for individual utility changes, summed across affected individuals. Crucially, it usually assigns *equal weight* to each dollar of WTP/WTA, regardless of the individual's income. This embodies a specific, and contentious, value judgment: **a dollar is a dollar is a dollar**. This implies that the utility gain for a rich person from an extra dollar is treated as equal to the utility loss for a poor person from losing a dollar – a position directly challenged by the diminishing marginal utility of income and requiring an IUC.
          *   **"Not Scientific"?** In Robbins' strict sense of avoiding ethical/value judgments? **Yes.** Standard CBA relies on the value judgment that efficiency (as measured by aggregate WTP) is the primary goal, and that the existing distribution of income is acceptable (or that distributional concerns should be handled separately, e.g., through taxes/transfers). It doesn't *scientifically prove* that aggregating dollars is the "right" way to measure social welfare; it adopts it as a *normative framework*.
          *   **Practitioner's Response:** Economists doing CBA are generally aware of this. They see it as a *practical tool* for informing decisions, making values explicit (the dollar-weighting), and improving transparency compared to purely political logrolling. They often conduct **distributional analysis** alongside the main CBA to highlight impacts on different groups, acknowledging the normative choice involved in aggregation. They don't claim it's "pure science" devoid of value judgments.
      *   **Historian's View:** This statement contains a large kernel of truth but is an overstatement. Robbins correctly identified the non-scientific (value-laden) nature of IUCs and aggregation. Mainstream economics largely adopted his methodological stance *for theory*. However, **applied welfare economics (like CBA) developed *despite* Robbins' prohibition, using pragmatic but normatively loaded solutions (like dollar-weighting)**. Labeling the *entire foundation* as "not scientific" ignores the sophisticated theoretical frameworks (like social welfare functions) developed to *explicitly incorporate* value judgments, and the practical recognition by economists of the normative content in applied work. It's more accurate to say CBA rests on *explicit normative foundations* that go beyond positive science.

  4.  **"...which also means utilitarianism, needing as it does to add up utilities across persons, stands refuted."**
      *   **The Conflation:** This is the crucial error. Robbins argued IUCs were *unscientific* (within his definition of positive economics), **not** that they were *logically impossible* or *ethically invalid*. He drew a boundary around what *economics as a science* could say, not what *philosophers or policymakers* could or should do.
      *   **Utilitarianism's Domain:** Utilitarianism is an *ethical theory*. Its core claim is that the morally right action is the one that maximizes *total* (or average) utility/happiness/well-being. This *requires* IUCs as a fundamental part of its ethical calculus. Philosophers engaging in utilitarianism are making *ethical arguments*, not claiming to do value-free positive science.
      *   **Refuted?** Absolutely not. Robbins' argument **does not refute utilitarianism as an ethical doctrine**. It argues that economics, *as Robbins defined it*, cannot provide the *scientific basis* for utilitarianism that some early economists (like Pigou, influenced by Bentham) might have hoped for. Utilitarians can (and do) respond in several ways:
          *   **Reject Robbins' Positivism:** Argue that ethics requires normative propositions beyond strict empirical verification. Moral reasoning isn't limited by the boundaries of Robbins' positive science.
          *   **Model Utility Comparably:** Develop models (like Harsanyi's) assuming individuals have comparable underlying utility functions, allowing aggregation.
          *   **Focus on Outcomes:** Argue that even if utility isn't perfectly measurable, we can observe outcomes (health, education, poverty reduction) that correlate with well-being and use those proxies for ethical calculus.
          *   **Embrace the Challenge:** Acknowledge IUCs are difficult but argue they are necessary for coherent moral reasoning about distribution and social welfare.
      *   **Historian's View:** This conclusion is a profound misunderstanding. Robbins' target was *methodology within economics*, not the validity of utilitarianism *as moral philosophy*. His argument made life *harder* for economists who wanted to base policy directly on utilitarian calculus without acknowledging the value judgments, but it did nothing to undermine the internal logic or ethical arguments of utilitarianism itself. Philosophers continued (and continue) to debate utilitarianism on its own merits.

  **Addressing Your Inclination & The Economics Side:**

  *   **"I'm inclined to think interpersonal comparisons are fine, at least in moral contexts":**
      *   **Holds Up Completely in Moral Contexts:** Your inclination is **entirely defensible and mainstream within moral philosophy**. Almost all consequentialist ethics (utilitarianism being the prime example), and many non-consequentialist approaches when dealing with distributive justice, *require* some form of interpersonal comparison of well-being. Philosophers explicitly engage in reasoning about how to make these comparisons ethically (e.g., focusing on capabilities, resources, primary goods, or preference satisfaction).
  *   **Where Your Inclination Faces Pushback (The Economics Side):**
      *   **Within Robbins' Strict Positive Economics:** Mainstream microeconomic theory and theoretical welfare economics largely adhere to the avoidance of IUCs as a matter of methodological principle. They see it as necessary to maintain the "scientific" status of core theory. Claiming IUCs are "fine" *within this specific domain* would be rejected.
      *   **In Applied Economics (CBA):** While practitioners *use* aggregation (implicitly relying on IUCs via dollar-weighting), they would strongly resist simply declaring IUCs "fine" without acknowledging the massive normative weight of the assumption, especially the implicit acceptance of the existing income distribution. Your inclination needs to grapple with *how* to make IUCs – dollar-weighting has severe limitations regarding fairness and equity. Economists would say: "Fine, *but how?* And with what justification for the weights?"
      *   **The Measurement Problem:** Economists would emphasize the genuine difficulty, perhaps impossibility, of *objectively measuring and comparing* subjective utility states across individuals. Your inclination needs to address *how* these comparisons are to be made operational in a non-arbitrary way beyond simple dollar sums.

  **Conclusion:**

  The pop history narrative oversimplifies Robbins' contribution (methodological argument, not proof; didn't single-handedly cause the ordinal shift), overstates the "unscientific" nature of applied welfare economics (it's normative, not necessarily unscientific if values are explicit), and commits a major category error by claiming Robbins refuted utilitarianism (he challenged its *scientific basis within economics*, not its *ethical validity*).

  **Does the "refutes-utilitarianism" conclusion survive? No, it does not.** Robbins' argument is a powerful methodological critique *within economics*, highlighting the non-scientific nature of IUCs. It made it harder for economists to claim utilitarian policy conclusions were purely "scientific." However, it leaves utilitarianism entirely intact as an ethical theory that philosophers (and economists wearing their normative hats) are free to argue for, defend, or criticize based on moral reasoning. Your inclination that IUCs are essential in moral contexts is well-founded philosophically, though it must confront the practical challenges of implementation and the specific normative choices embedded in economic tools like standard CBA. The key is recognizing the distinct domains: Robbins' boundary for *positive economics* vs. the necessity of normative reasoning in *ethics* and *policy*.
