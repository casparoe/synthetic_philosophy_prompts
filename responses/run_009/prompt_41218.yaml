  Hmm, they've already ruled out several possibilities themselves - it's not joint intentional action (like carrying a table together), not organizational decision-making, and not simple aggregation. They mention "invisible hand" and "swarm intelligence" but feel these don't capture the goal-directed aspect fully. 

  The user seems quite sophisticated - they're familiar with concepts from philosophy of collective intentionality and economics. Their request for "carving" suggests they want precise conceptual boundaries. That academic phrasing about "relating to standard stuff on shared intention and group agents" confirms this is probably a researcher or very advanced student.

  Let me break down what makes their phenomenon special: First, the outcome appears purposeful (adapting to setbacks, converging on solutions). Second, no individual intends that outcome. Third, it emerges from decentralized interactions. Fourth, it's responsive to environmental pressures. Fifth, participants may not even know they're part of it.

  Searching my knowledge base... Hayek's "spontaneous order" comes close but is too broad - it includes non-adaptive things like crystal formation. "Swarm intelligence" focuses on the mechanism (stigmergy, etc.) rather than the functional purpose. "Collective intelligence" often implies some awareness. 

  The economics term "invisible hand" might work if we stretch it beyond markets, but it's controversial and doesn't explicitly include adaptation to setbacks. "Self-organization" is too general... 

  Ah! Margaret Gilbert's "plural subject" theory doesn't fit because it requires mutual recognition. Bratman's "shared intention" is too deliberate. Maybe Epstein's "supraindividual" from social ontology? Still not quite...

  Actually, the user might be describing something at the intersection of complex systems theory and social science. Terms like "emergent teleonomy" or "distributed adaptation" could work - but these aren't established. "Functional emergence" captures the purposive-seeming aspect without actual purpose. 

  For the carving they want:
  - Positive criteria: 1) System-level behavior appears goal-oriented 2) No individual intends system goal 3) Emerges from local interactions + feedback loops 4) Adaptive to environmental changes
  - Negative criteria: 1) Not reducible to individual psychology 2) No central controller 3) Participants may be unaware of system

  Applying this to their examples: The path formation is clearly in. Market bubbles? Probably - they "adapt" to news but aren't goal-directed. Wikipedia articles have some intentional contributors, so mixed. Standing ovations after initial clapping might qualify as the wave builds.

  The user might appreciate knowing this concept bridges evolutionary biology (Dawkins' extended phenotype), economics (Hayek), and complexity theory. I should emphasize the feedback loop mechanism - how individual actions create environmental changes that influence future actions (like the worn path guiding walkers).

  Since no perfect term exists, coining "teleonomic emergence" could work - "teleonomic" implying apparent purpose without design. But must stress it's not true teleology. The key insight is that function emerges from selection pressures, not intention.
answer: |-
  This is a brilliant observation of a fundamental social phenomenon that straddles philosophy, complexity science, and social theory. You're right that existing terms like "spontaneous order" or "swarm intelligence" capture aspects but miss the core *apparent goal-directedness without agency*. Let's carve it:

  ### Core Phenomenon: Teleonomic Emergence (Coined Term)
  **Definition:** *The emergence of system-level behavior that exhibits functional, adaptive, goal-directed properties (teleonomy) solely through decentralized, uncoordinated individual actions responding to local feedback and environmental pressures, without any individual or collective intending the system-level outcome.*

  ### The Carving (What It Is & Isn't)
  1.  **Goal-Directedness (Teleonomy):**
      *   **IS:** Exhibits *functional* behavior: responds to setbacks (fence), converges on solutions (new path), accelerates/decelerates based on environmental signals (replication results). The system *behaves as if* optimizing for an outcome (efficient paths, field abandonment).
      *   **IS NOT:** True intentional teleology. No entity *aims* for the outcome. The goal is observer-relative, emergent, and defined by the functional pattern.

  2.  **Agency & Intention:**
      *   **IS:** Driven by individuals acting on *local* intentions/reasons (shortcut, career move, clapping because others did). Individuals are responsive to environmental feedback (mud, job prospects, peer noise).
      *   **IS NOT:** Involves shared intention ("we intend to X"), collective decision-making, or recognition of participating in a "group project." Many participants may be unaware of the emergent pattern.

  3.  **Mechanism:**
      *   **IS:** Results from *feedback loops* between individual actions and the environment they modify.
          *   **Example Path:** Walkers take shortcut -> wears grass -> visible path attracts more walkers -> path deepens. Fence blocks it -> walkers try alternatives -> new efficient path emerges via foot traffic feedback.
          *   **Example Field:** Failed rep -> lowers field's perceived value -> individual scientists see fewer opportunities/grants -> more leave -> accelerates decline. Success has the opposite feedback.
      *   **IS NOT:** Simple aggregation (average height). Requires dynamic interaction and modification of the environment/context influencing future actions (stigmergy). Also distinct from top-down control or designed algorithms.

  4.  **Scale & Participation:**
      *   **IS:** Operates at a scale beyond dyadic interaction. Participants act independently based on local perception, often unaware of the emergent whole.
      *   **IS NOT:** Joint action (table carrying) or small-group coordination. Differs from corporate/group agents with decision procedures.

  ### Relation to Established Concepts
  *   **Spontaneous Order (Hayek/Menger):** A close relative. Teleonomic Emergence is a *specific subset* focusing on outcomes exhibiting *functional adaptation* and apparent goal-directedness. Spontaneous order is broader (e.g., language evolution has structure but less clear "goal" response).
  *   **Swarm Intelligence:** Describes the *mechanism* (decentralized, stigmergic). Teleonomic Emergence describes the *observed functional property* (goal-directedness) resulting from such mechanisms.
  *   **Collective Intentionality (Searle, Bratman, Gilbert):** Explicitly deals with "we-intentions" and shared agency. Teleonomic Emergence operates *below* this level – it's precisely the *absence* of collective intention that defines it. It's the *uncanny functional behavior without the "we"*.
  *   **Complex Adaptive Systems:** Teleonomic Emergence is a key observable *behavior* in such systems, highlighting the functional/teleonomic aspect.
  *   **Invisible Hand (Smith):** The classic example. Teleonomic Emergence provides a more precise framework for *why* it appears goal-directed (market efficiency) despite individual profit motives. It generalizes beyond economics.
  *   **Extended Phenotype (Dawkins):** Conceptually similar – behavior/structures emerging from gene/environment interactions that *function* as if designed, without a designer. Applied here to distributed human behavior.

  ### Applying the Carving: Your Examples
  1.  **Diagonal Paths:** **Yes, Archetypal.** Emergent pathfinding via stigmergy (worn grass). Adapts to fences. No planner.
  2.  **Research Field Abandonment:** **Yes.** Feedback loops (success/failure signals) modulate individual exit decisions, leading to functional abandonment without declaration.
  3.  **Market Bubble:** **Partial, but Edge Case.** The *run-up* exhibits feedback (rising prices attract buyers, driving prices higher) and apparent goal-directedness ("get rich"). However, the *crash* is often a catastrophic failure of adaptation, revealing the goal as illusory. Less robust adaptation than paths/fields.
  4.  **Wikipedia Article:** **Mixed (Leans No).** While edits are decentralized and stigmergic (editing the text), there *is* often a shared, albeit loose, intention ("improve the encyclopedia article on X") among *some* core contributors. It's a blend of decentralized action and weak collective intentionality.
  5.  **Standing Ovation (after first few clap):** **Yes.** A clear case. Local feedback (seeing/hearing others stand/clap) triggers individual decisions to join. The "wave" builds adaptively. The apparent "goal" (full ovation) emerges without collective planning. The *initiation* (first clappers) might be intentional, but the *spread* is teleonomic emergence.

  ### Why "Teleonomic Emergence"?
  *   **Teleonomy:** Coined by biologist Colin Pittendrigh, popularized by Ernst Mayr. Means "the *appearance* of purposefulness" in biological systems arising from natural selection, *without* implying conscious purpose. Perfectly captures the observed functional, goal-*like* behavior.
  *   **Emergence:** Highlights that the functional property arises solely from the interaction of lower-level parts (individuals) following simple rules responding to feedback, not from any top-down design or intention.

  This phenomenon reveals a profound layer of social organization: functional, adaptive patterns arising purely from the interaction of self-interested, locally responsive agents, creating the uncanny illusion of a guiding mind where none exists. It's the dark matter of social coordination.
