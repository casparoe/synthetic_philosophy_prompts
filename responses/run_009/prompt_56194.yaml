prompt: |-
  I keep getting into arguments about how to discount the far future — climate mostly, but also infrastructure and public health — and everyone just shouts a number (1.4%? 3%? 5%?) like that settles it. Before anyone argues about the number I want the spec: what does a social discount rate or discount function actually have to get right to be usable in intergenerational cost-benefit analysis? Suspects I want on the list, but thought through, not just listed: no pure time preference, since we're supposed to be impartial between persons regardless of when they live (but then what role, if any, is left for extinction risk — say); time-consistency, so planners can't keep re-running the analysis every decade to procrastinate on mitigation, and whether that rules out the declining-discount-rate idea or just complicates it; sane behavior at the extremes — the present shouldn't be a dictator, but neither should the year 2400; honesty about the one elasticity parameter doing triple duty as risk aversion, intertemporal substitution, and aversion to inequality across time — either accept that or flag it as a real cost; and whether discounting a dollar, a life-year, and an ecosystem are even the same operation. For each requirement give the case or argument behind it, mark which are non-negotiable versus camp preferences, and — the part I most want — tell me whether some subset of the requirements is jointly unsatisfiable, because it smells like it (no pure time preference + consistency with observed rates of return + an exponential form?). Then one short paragraph, no more, on how ethical-first and market-rate approaches each do against the list; skip the full scorecard.
reasoning: |-
  Okay, let me tackle this user's query about social discount rates for intergenerational cost-benefit analysis. The user is frustrated with people just throwing out numbers without proper justification, especially in climate and infrastructure debates. They want a clear specification of what makes a discount rate valid, with several key requirements examined in depth.

  First, I need to unpack each of the user's mentioned concerns. They brought up no pure time preference due to impartiality between generations. That's a strong ethical argument from Ramsey and others - discounting future generations purely because they're later seems unfair. But then how does extinction risk fit in? That's a separate survival probability issue, not a time preference.

  Time-consistency is another big one. If discount rates aren't consistent over time, policymakers could keep delaying action by recalculating. But declining discount rates (DDRs) might be necessary to match empirical evidence - how to square that circle? Maybe DDRs can work if they're pre-committed properly.

  The extremes problem matters too - we can't ignore either the present or the distant future. Exponential discounting might undervalue the far future, while zero discounting makes the present irrelevant. Some bounded utility functions might solve this.

  Then there's the parameter overload issue - that single elasticity parameter (η) doing triple duty for risk aversion, intertemporal substitution, and inequality aversion. This is a real problem in Ramsey-based models that needs flagging.

  Finally, discounting different goods equally - dollars, lives, ecosystems - seems questionable. The marginal utility approach assumes convertibility to utility, but in practice we might need different "currencies" or safe minimum standards.

  For contradictions... The big tension is between ethical requirements (no pure time preference) and market consistency. Observed market returns include pure time preference components that ethicists reject. Also, no pure time preference combined with constant exponential discounting only works if η>0 and constant consumption growth - which isn't guaranteed.

  On approaches: Ethical-first (like Stern) prioritizes no pure time preference but gets criticized for low discount rates. Market-based approaches match observed behavior but embed unethical preferences. There's no perfect solution here - every choice involves tradeoffs between ethical purity and practical implementation.

  The user seems sophisticated but frustrated by superficial debates. They likely want this framework to elevate discussions beyond number-shouting. I should emphasize where tradeoffs force uncomfortable choices - that's probably the "smell" they detected about joint unsatisfiability. The extinction risk point is particularly nuanced - it's not time preference but affects discounting mechanically.
answer: |-
  Here’s a rigorous specification for a social discount rate/function in intergenerational cost-benefit analysis, addressing your requirements systematically:

  ### Core Requirements (Non-Negotiable Ethical Foundations)
  1.  **No Pure Time Preference (δ ≈ 0):**
      *   **Argument:** Ethical impartiality requires equal consideration for welfare across generations (Ramsey, Stern). Discounting future utility *solely* because it occurs later is discriminatory.
      *   **Role for Extinction Risk:** Extinction risk acts as a *survival probability*, not time preference. Discounting should involve multiplying by the probability humanity survives to year `t`: `p_survive(t) < 1`. This is conceptually separate from δ.
      *   **Non-Negotiable:** For impartial intergenerational justice.

  2.  **Time Consistency:**
      *   **Argument:** To prevent strategic procrastination ("we'll discount at 5% now, but our successors in 2050 will use 3%, so delay action"). Plans made today must remain optimal (or at least valid) when re-evaluated later using the *same* ethical framework.
      *   **Declining Discount Rates (DDRs):** DDRs *can* be time-consistent **only if** the *entire future path* of rates is pre-committed from the outset, based on a single underlying model (e.g., uncertainty over future growth resolves over time). Ad-hoc DDRs violate consistency.
      *   **Non-Negotiable:** For credible long-term planning and avoiding self-defeating strategies.

  3.  **Sane Behavior at Extremes:**
      *   **Argument:** Avoids "dictatorship of the present" (ignoring the far future) or paralysis due to infinite future value. Requires discount *functions* that integrate to a finite present value (PV) even over infinite horizons.
      *   **Implication:** Rules out constant exponential discounting with `r > 0` for infinite valuation (PV finite but may undervalue distant future) and rules out `r = 0` (PV infinite). Solutions: Explicit finite horizons, bounded utility functions, or DDRs converging asymptotically to zero.
      *   **Non-Negotiable:** For tractability and avoiding absurd conclusions.

  ### Critical Trade-offs & Parameter Issues (Require Explicit Acknowledgment)
  4.  **Elasticity Parameter (η) Transparency:**
      *   **The Triple Duty:** In the Ramsey Rule (`r ≈ δ + η * g`), `η` combines:
          *   *Intertemporal Inequality Aversion:* Willingness to transfer consumption to poorer generations (future if `g > 0`).
          *   *Curvature of Utility (Risk Aversion):* Diminishing marginal utility of consumption.
          *   *Intertemporal Substitution Elasticity:* Willingness to smooth consumption over time (inverse relationship).
      *   **Cost:** Using one `η` for all three conflates distinct ethical/behavioral concepts. It's mathematically convenient but ethically/behaviorally dubious.
      *   **Requirement:** **Mandatory flagging.** Analyses must state `η`'s value and explicitly acknowledge this conflation is a significant limitation/simplification.

  5.  **Commensurability (Discounting What?):**
      *   **Argument:** Discounting *money* assumes constant marginal utility of consumption. Discounting *utility* (welfare) is conceptually distinct. Discounting *lives* or *ecosystems* directly is ethically problematic – it implies a life today is worth more than one tomorrow.
      *   **Requirement:** **Clarity on the numeraire.** Standard practice discounts *consumption* (money) flows, converting lives/ecosystems to consumption equivalents via valuation (itself contentious). Discounting utility directly avoids some issues but is harder. Explicitly state the discounted unit and justify its intertemporal comparability.

  ### The Inherent Tensions (Joint Unsatisfiability)
  *   **The Core Conflict:** `No Pure Time Preference (δ=0)` + `Observed Market Returns (r_market high)` + `Exponential Form` is **inconsistent** under standard assumptions.
      *   *Why?* Observed `r_market` (e.g., 4-7% pre-tax) reflects private time preference (δ_private > 0), risk, taxes, and myopia. Setting δ_social = 0 implies `r_social = η * g`. For `r_social ≈ r_market`, `η` must be implausibly high if `g` is modest (~1-2%), implying extreme aversion to inequality. Alternatively, accepting δ_social > 0 violates impartiality. Declining discount rates or separating risk/inequality parameters are attempts to resolve this, but add complexity and assumptions.

  ### Ethical-First vs. Market-Rate Approaches vs. The Spec
  *   **Ethical-First (e.g., Stern):** Excels on #1 (δ=0) and #3 (long-term focus via low η*g). Struggles with #2 (constant low rate is trivially consistent) and #4 (conflates η roles, low η chosen). Criticized for mismatch with #5 (discounting $ but low r implies high future value) and observed behavior (#4 tension).
  *   **Market-Rate (e.g., Nordhaus):** Matches #2 (constant rate consistent) and #5 (discounts $ like markets). Fails #1 (embeds δ_private > 0, violating impartiality). Often ignores #4 conflation. Critically risks failing #3 (constant high r undervalues distant future catastrophically).

  **In essence:** A perfect discount function satisfying all non-negotiables (#1-3) while transparently handling #4/#5 and matching observed returns is impossible within standard exponential frameworks. The choice always involves prioritizing *which* ethical principles or practical constraints matter most, explicitly acknowledging the trade-offs (especially the η conflation and the δ/η*g/market tension). Declining discount rates or state-contingent discounting offer paths forward but introduce their own complexities.
