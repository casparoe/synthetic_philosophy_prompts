prompt: |-
  I'm taking a graduate seminar built around David Lewis's Convention, and the professor likes to fire off rapid verdicts on whether some regularity or other counts as a convention. Her track record so far:

  - Driving on the right in the United States: convention — and she insists that the statute codifying it makes no difference to its status.
  - Greeting with a handshake rather than a bow: convention.
  - Using dollar bills as money: convention.
  - The regularity that speakers of English, by and large, tell the truth in English: convention — she calls it the paradigm case, to the surprise of half the room.
  - Queuing at the bakery: convention, even though queue-jumpers are met with genuine moral indignation and not mere inconvenience.
  - The prohibition on unprovoked assault: not a convention.
  - Giving up one's bus seat to an elderly passenger: not a convention.
  - Two colleagues who sign a written agreement to meet every Tuesday at nine, and keep meeting: not a convention so long as the agreement stands; but if the agreement lapses and they keep meeting on Tuesdays anyway, it becomes one.

  She has also told us, maddeningly, that she thinks Lewis got some of his conditions too strong and others too weak, though she refuses to say which.

  Next week she will rule on three new cases, and I want my predictions prepared in advance:

  1. QWERTY. The layout was close to arbitrary when it was adopted, but network effects now mean that for any individual typist the alternatives are worse than QWERTY, given that everyone else uses it — and worse in a way that was not true at the point of adoption.
  2. A reinforcement-learning experiment in which sender and receiver agents, with no apparent representation of each other's minds, settle after thousands of rounds into a stable signal–action pairing that serves both sides perfectly.
  3. The norm in my country that men rather than women propose marriage. It plausibly solves a coordination problem of some kind, but a substantial fraction of the population — some on religious grounds, some on egalitarian grounds — believes the alternative is not equally good, and this disagreement is no secret to anyone.

  Predict her verdict on each of the three cases. But I care more about the reasoning than the verdicts themselves: articulate the two or three rules that fit her track record equally well so far, say which of the new cases each rule decides differently, give your best guess about which rule she is actually running and why, and propose the single further case, of your own invention, that would best discriminate among the rules. Treat Lewis as a resource for formulating the candidate rules, but remember that her track record is the evidence — she has told us she is not simply applying his definition.
reasoning: |-
  Okay, I need to figure out the professor's reasoning for her convention verdicts based on her track record. Let me start by listing all the cases she's already ruled on and her decisions. 

  First, driving on the right in the US is a convention, and she says the statute doesn't matter. That's interesting because even though it's law, she still sees it as a convention. Same with using dollar bills as money. So legality doesn't override convention status. 

  Greeting with a handshake is a convention. Queuing is too, even though there's moral indignation involved. That suggests that moral elements don't automatically disqualify something from being a convention. But then the prohibition on unprovoked assault isn't a convention, and giving up a bus seat isn't either. So why are those different? Maybe because assault is a moral issue, and giving up a seat is seen as a moral duty? But queuing has moral indignation and it's still a convention. Hmm, that's a point of confusion. 

  The truth-telling in English is called the paradigm case. Lewis uses that as a key example, so she must be aligning with Lewis there. 

  The Tuesday meeting case is interesting. With an agreement, it's not a convention, but once the agreement lapses and they continue out of habit, it becomes one. So explicit agreements might negate convention status, but implicit continuations do. 

  She mentions that Lewis's conditions are too strong and too weak in places. So I need to think about Lewis's definition. Lewis says conventions are solutions to coordination problems where everyone prefers to conform if others do, and there's at least one other possible regularity. Also, it has to be common knowledge that others are following it. 

  Looking at her cases, the assault prohibition isn't a convention because it's not arbitrary? Like, there's a moral reason not to assault, not just coordination. Giving up bus seats might be seen as moral rather than coordinative. Queuing, though, has moral indignation but is still a convention. Maybe the key difference is whether the primary reason for following the norm is coordination or morality. Queuing solves a coordination problem (who gets served first), so even with moral feelings, it's still convention because the core is coordination. Whereas assault prohibition is inherently moral, not about coordination. 

  For the new cases: 

  1. QWERTY keyboard. Arbitrary at adoption, now network effects make it stable. Seems like a classic convention. But the problem is that alternatives are worse now, but weren't at the start. Lewis might say it's a convention because it's a coordination solution. 

  2. Reinforcement learning agents. They develop a stable signal-action pairing without understanding each other's minds. Lewis requires common knowledge, which might involve mutual expectations. If the agents don't have representations of minds, maybe no common knowledge, so not a convention? But she might think Lewis's common knowledge condition is too strong. 

  3. Marriage proposals: men propose. Solves a coordination problem, but some believe the alternative isn't equally good. Lewis says for a convention, people should be indifferent between alternatives. If some think one way is better, it might not fit. But her track record has queuing with moral indignation, which might indicate preference for the norm. 

  So I need candidate rules that fit her past decisions. 

  Rule A: Lewis Lite. Coordination problem, arbitrary alternatives, preference for conformity, common knowledge. But she might think common knowledge is too strong, so maybe relaxed. 

  Rule B: Coordination-Centric. Focuses on whether the primary function is solving a coordination problem, regardless of moral overlay or common knowledge. This would include queuing and truth-telling. 

  Rule C: Preference Symmetry. Requires that alternatives are seen as equally good by participants. But queuing has moral indignation, so maybe people don't see alternatives as equal. So this might not fit. 

  For QWERTY: under Coordination-Centric, it should be convention. Under a strict Lewis view, it might be, but the network effects changed the preferences. Originally arbitrary, now not, but still a coordination solution. 

  RL Agents: If common knowledge is required, not a convention. But if she relaxed that, it might be. 

  Marriage proposals: If preference symmetry is needed, the disagreement might make it not a convention. But if coordination-centric, it could be. 

  Her queuing example has moral indignation, suggesting that strong preferences for the norm don't disqualify it. So maybe she doesn't require indifference. 

  Further case to discriminate: Something that meets coordination but lacks common knowledge, or has moral elements but is coordinative.
answer: |-
  Based on the professor's track record and her hint that she deviates from Lewis, I infer three candidate rules that fit her past verdicts equally well. Below, I outline these rules, apply them to your three new cases, predict her verdicts under each rule, argue for which rule she likely uses, and propose a discriminating case. Key Lewisian concepts (coordination problems, arbitrariness, common knowledge, preference conditions) inform the rules, but her rulings suggest modifications.

  ---

  ### **Candidate Rules Fitting the Track Record**
  *Rule A: Coordination-Centric (Lewis Minus Strong Symmetry)*  
  - **Core idea:** A convention exists if it solves a coordination problem (i.e., agents have a common interest in coordinating, and success depends on mutual conformity). Arbitrariness is sufficient but not necessary; moral indignation or preference asymmetry doesn’t disqualify it if coordination is central.  
  - **Deviations from Lewis:** Rejects Lewis’s strict "indifference" between alternatives (since queuing involves moral indignation but is a convention) and possibly weakens common knowledge (since truth-telling is accepted without explicit evidence of recursive beliefs).  
  - **Fits track record:**  
    - Driving/greeting/money/truth-telling/queuing solve coordination problems (e.g., avoiding collisions, efficient communication, orderly service).  
    - Assault prohibition and seat-giving are not primarily coordinative (they address unilateral moral harms).  
    - The Tuesday meeting starts as an agreement-based plan (not coordination-dependent) but becomes convention when lapsed (coordination takes over).  

  *Rule B: Arbitrariness-Plus-Equilibrium (Lewis Minus Common Knowledge)*  
  - **Core idea:** A convention requires (1) arbitrariness (at least one alternative could have worked initially), (2) a stable equilibrium (everyone prefers conformity given others’ conformity), and (3) no overriding moral imperative. Moral indignation is tolerated if the norm is arbitrary.  
  - **Deviations from Lewis:** Drops Lewis’s common knowledge requirement (truth-telling might not involve explicit mutual beliefs) and rejects his "indifference" condition (since queuing has moral preference for the norm).  
  - **Fits track record:**  
    - Driving/greeting/money/truth-telling/queuing are arbitrary (left-hand driving, bowing, other currencies, lying *could* work) and stable.  
    - Assault prohibition isn’t arbitrary (no benign alternative), seat-giving has a moral "imperative."  
    - Tuesday meetings post-agreement become arbitrary (they could meet Wednesdays) and stable.  

  *Rule C: Folk-Norm Hybrid (Lewis Minus Moral Neutrality)*  
  - **Core idea:** A convention must (1) solve a coordination problem, (2) be perceived as a social norm (with expectations of conformity and disapproval for violations), and (3) lack intrinsic moral necessity. Moral indignation is acceptable if it arises from norm enforcement, not pre-existing ethics.  
  - **Deviations from Lewis:** Relaxes arbitrariness (truth-telling isn’t arbitrary but is convention) and common knowledge, but adds a "folk norm" condition (tacit social enforcement).  
  - **Fits track record:**  
    - Driving/greeting/money/queuing/truth-telling involve social enforcement (disapproval for violations).  
    - Assault/seat-giving are intrinsically moral, not socially constructed norms.  
    - Tuesday meetings post-agreement become a norm.  

  ---

  ### **Predictions for New Cases Under Each Rule**
  1. **QWERTY Layout**  
     - *Rule A (Coordination-Centric):* **Convention.** Solves a coordination problem (keyboard compatibility via network effects). Initial arbitrariness is irrelevant; stability matters.  
     - *Rule B (Arbitrariness-Plus-Equilibrium):* **Convention.** Arbitrary at adoption (Dvorak was viable), now a stable equilibrium (no one switches unilaterally).  
     - *Rule C (Folk-Norm Hybrid):* **Convention.** Functions as a social norm (expectation to use QWERTY in professional settings).  

  2. **Reinforcement-Learning (RL) Agents**  
     - *Rule A:* **Convention.** Solves a coordination problem (signal-action pairing is a pure coordination game). No need for "minds" or common knowledge.  
     - *Rule B:* **Not convention.** Lacks arbitrariness (no alternative was explored or possible in the closed system) and no evidence of equilibrium by choice.  
     - *Rule C:* **Not convention.** No social norm or mutual expectations—just algorithmic adaptation.  

  3. **Marriage Proposals (Men Propose)**  
     - *Rule A:* **Convention.** Solves a coordination problem (e.g., avoiding ambiguous mutual proposals). Preference asymmetry (religious/egalitarian objections) doesn’t negate coordination.  
     - *Rule B:* **Not convention.** Not arbitrary to objectors (they see alternatives as inferior), so condition (3) fails.  
     - *Rule C:* **Convention.** Socially enforced norm (pressure to conform), and it’s not intrinsically moral (cultures vary).  

  ---

  ### **Predicted Verdicts and Best Guess**
  - **QWERTY:** All rules agree → **Convention** (strong consensus).  
  - **RL Agents:** Rules A and C disagree → *Rule A says convention; Rule B/C say not*.  
  - **Marriage Proposals:** Rules A/C vs. B disagree → *Rule A/C say convention; Rule B says not*.  

  **Best Guess for Professor’s Rule:** **Rule A (Coordination-Centric)**.  
  - **Why?**  
    - Her queuing verdict shows she ignores preference asymmetry (moral indignation) if coordination is central.  
    - Truth-telling as the "paradigm case" emphasizes coordination (communication relies on mutual truthfulness), not arbitrariness or common knowledge.  
    - RL agents likely intrigue her—she’d call it a convention to reject Lewis’s mentalistic common-knowledge requirement (which she hinted is "too strong").  
    - Marriage proposals mirror queuing: both have objectors but solve coordination.  

  **Predicted Verdicts:**  
  1. QWERTY: Convention.  
  2. RL Agents: Convention (per Rule A).  
  3. Marriage Proposals: Convention.  

  ---

  ### **Discriminating Case to Test the Rules**
  **Case:** *A tribe’s "sun dance" ritual performed at dawn every solstice. It coordinates communal timing for planting crops, but participants believe the gods demand it at dawn—alternatives (e.g., dusk) are seen as sacrilegious. Violators are shunned.*  
  - **Rule A (Coordination-Centric):** **Convention.** Solves coordination (synchronized planting), and divine beliefs don’t negate this.  
  - **Rule B (Arbitrariness-Plus-Equilibrium):** **Not convention.** Not arbitrary (dusk is taboo), and intrinsic moral/religious imperative overrides.  
  - **Rule C (Folk-Norm Hybrid):** **Convention.** Socially enforced norm, even if rooted in religion.  

  This case splits all three rules, leveraging her assault/queuing distinctions. If she calls it a convention, Rule A or C wins; if not, Rule B is likely. Her stance on "religious grounds" in your marriage case would foreshadow this. 

  This approach respects her track record while incorporating Lewis as a starting point. Focus your seminar debate on whether coordination problems can host moral/religious preferences without losing "convention" status—this is her key divergence.
