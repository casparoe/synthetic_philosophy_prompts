prompt: |-
  I am a junior at a public high school of about 1,400 students, and I serve as one of two juniors on our twelve-member Student Council, which meets biweekly with our assistant principal as a non-voting advisor. At our next meeting we will consider a constitutional amendment proposed by a group of students in our civics club: abolish the annual all-school election for the five executive officers (president, vice president, secretary, treasurer, and communications chair) and replace it with a lottery, in which the officers would be drawn at random each spring from the pool of students who volunteer for the drawing, subject only to a minimum GPA of 2.5 and a signed commitment to attend all meetings. The club's argument is essentially that our elections have become popularity contests won by whoever runs the most polished social media campaign, that the officers represent only a narrow slice of the school (for the past six years, all of them have come from the same two friend groups and the honors program), and that a lottery drawn from a self-selected volunteer pool would be at least as fair, would better mirror the actual composition of the student body, and would remove the incentive to promise things the council cannot deliver just to get votes. They also point out that we already accept lotteries for parking spots and for the lottery-based admission to our oversubscribed elective in forensic science, so the principle is not foreign to us.

  My role on the council is to prepare a written recommendation memo that will be distributed to all members before the vote, and the assistant principal has asked that it be substantive rather than a rubber stamp for either side. I would like your help drafting it. Please write the memo in American English, in a formal register suitable for circulation to the full council, with a clear bottom-line recommendation (adopt the amendment, reject it, or adopt it with specific modifications, such as term limits on lottery service, a smaller vetting committee, or a hybrid system in which, say, the president is still elected while the rest are drawn by lot). The reasoning should engage the strongest arguments on both sides seriously. Some issues I would especially like the memo to address: whether a lottery over a self-selected pool of volunteers actually delivers the representative cross-section the club claims, or whether it just selects for the personality type that likes being randomly chosen; whether removing elections really removes accountability, given that lottery officers cannot be "voted out" for doing a bad job; whether an elected officer who has to persuade classmates learns something democratically valuable that a lottery officer never has to; and whether it matters that our elections, whatever their flaws, at least give all 1,400 students a participatory experience of choosing their representatives twice a year. Please make sure the memo does not simply assert that democracy means elections; treat the pro-lottery side as making a genuine case, and give the losing side of your recommendation its full due before the recommendation is stated.
reasoning: |-
  Okay, let me approach this student council memo request systematically. The student is a junior preparing a recommendation on replacing elected positions with a lottery system, so I need to help craft a balanced, formal memo that seriously considers both sides.

  First, I'll consider the core issues raised: representation claims of lottery systems versus self-selection bias, accountability mechanisms without elections, developmental value of campaigning versus random selection, and participatory experience trade-offs. The civics club's arguments about popularity contests and lack of diversity are valid, but the "personality type" question for volunteers needs addressing.

  For structure, I'm planning a memo with clear sections: background, pro-lottery arguments with their strengths, counterarguments against lottery, then recommendation with reasoning. The student emphasized not defaulting to "democracy means elections" dogma, so I'll highlight how lotteries have historical democratic precedents like Athenian sortition.

  On the volunteer pool concern, research shows self-selection does skew toward certain traits - maybe suggest requiring volunteer commitments before the lottery? For accountability, elections provide clear feedback loops that lotteries lack, though peer pressure might partially compensate. The civic education aspect of elections feels important - campaigning teaches persuasion and coalition-building that random selection doesn't.

  Balancing these, a hybrid model seems most promising: keep president elected for accountability and leadership development, but use lottery for other positions to increase diversity. This addresses the club's representation concerns while preserving key democratic elements. Should also propose safeguards like term limits to prevent volunteer burnout and ensure rotation.

  The tone needs formal but accessible for high schoolers, with clear recommendation upfront followed by detailed analysis. Since the assistant principal wants substance, I'll ensure each argument gets fair treatment before explaining why the hybrid approach resolves tensions best.
answer: |-
  **MEMORANDUM**  
  **TO:** Student Council Members  
  **FROM:** [Your Name], Junior Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposed Constitutional Amendment to Replace Executive Officer Elections with a Lottery System  

  ## I. Introduction
  This memorandum addresses the proposed constitutional amendment from the Civics Club to replace the current election process for Student Council Executive Officers (President, Vice President, Secretary, Treasurer, Communications Chair) with a lottery system. Under the proposal, officers would be randomly selected each spring from volunteers meeting a 2.5 GPA minimum and a signed commitment to attendance. My recommendation is based on analysis of the proposal’s goals, potential benefits, and significant drawbacks, alongside core principles of representative governance.

  ## II. Summary of the Proposal’s Core Arguments
  The Civics Club’s case merits serious consideration:  
  1.  **Elections as Flawed Contests:** Current elections favor candidates with social media resources and established social capital, resulting in a persistent lack of diversity among officers (e.g., concentration within two friend groups and the honors program).  
  2.  **Representation Gap:** Elected officers do not reflect the broader student body’s composition.  
  3.  **Accountability Distortion:** Campaign promises are often unrealistic or beyond the Council’s scope, undermining trust.  
  4.  **Precedent for Lotteries:** The school already uses lotteries for parking spots and oversubscribed electives (e.g., Forensic Science), demonstrating institutional acceptance of random selection for scarce resources/opportunities.  

  ## III. Analysis of Key Considerations

  ### A. Representation & the Volunteer Pool
  *   **Pro-Lottery View:** A lottery from volunteers *could* increase socio-economic, extracurricular, and social group diversity compared to the current election outcomes. It removes barriers related to campaign resources and popularity.  
  *   **Critical Questions:**  
      *   **Self-Selection Bias:** Will the volunteer pool itself be representative? Research and experience suggest volunteerism often attracts individuals with specific traits: higher self-confidence, existing interest in governance, or those seeking structured involvement. This may exclude quieter students, those skeptical of the system, or those with heavy commitments. While potentially more diverse than the *current elected group*, the lottery pool may *not* mirror the full student body and could inadvertently select for a "volunteer personality."  
      *   **Passive vs. Active Representation:** Does merely holding an office equate to effectively *representing* diverse viewpoints? Active advocacy requires skills and initiative that random selection does not guarantee.

  ### B. Accountability & Governance Effectiveness
  *   **Pro-Lottery View:** Removal of elections eliminates the pressure to make unrealistic promises. Officers are accountable through their signed commitment and peer expectations within the Council.  
  *   **Critical Questions:**  
      *   **Loss of Electoral Sanction:** Elections provide a direct, powerful mechanism for accountability. Poor performance can lead to electoral defeat. A lottery system removes this fundamental democratic check. While peer pressure and the advisor’s role exist, they lack the broad, explicit mandate of an election.  
      *   **Competence & Motivation:** While a GPA floor ensures minimum academic standing, it does not assess leadership aptitude, organizational skills, or intrinsic motivation. Elections, though imperfect, involve a public vetting process where candidates demonstrate initiative and articulate their vision, providing *some* evidence of commitment and capability. A lottery relies solely on self-declared interest.  
      *   **Continuity & Stability:** Random annual turnover risks loss of institutional knowledge and cohesive leadership, potentially hindering long-term projects.

  ### C. Democratic Experience & Civic Learning
  *   **Pro-Lottery View:** Lotteries (sortition) have historical democratic roots (e.g., ancient Athens) and offer an alternative model of fairness based on equal chance rather than campaign prowess.  
  *   **Critical Questions:**  
      *   **Value of Elections for the Electorate:** All-school elections provide a tangible, recurring opportunity for ~1,400 students to engage in democratic practice: learning about candidates, debating issues, and exercising choice. This participatory experience is a foundational civic education element that a lottery eliminates.  
      *   **Value of Elections for Candidates:** Running for office develops crucial democratic skills: articulating ideas, building coalitions, listening to constituents, and responding to criticism. A lottery bypasses this developmental process. The experience of persuading peers is democratically valuable and prepares students for future civic engagement.  
      *   **Symbolism:** Elected representatives derive legitimacy from the consent of the governed, expressed through voting. This symbolic link between the student body and its leaders is severed under a lottery.

  ## IV. Assessment of Alternatives & Modifications
  The choice is not solely between the *status quo* and a full lottery. Hybrid models could mitigate risks while achieving some reform goals:
  1.  **Full Lottery:** High risk of unrepresentative volunteer pool, loss of accountability/legitimacy, and missed civic learning opportunities. Potential benefit of increased diversity of *backgrounds* present but not guaranteed.
  2.  **Status Quo Elections:** Persists in inequitable access to office, social media dominance, and lack of representational diversity. Maintains accountability mechanisms and civic participation/learning.
  3.  **Hybrid Model (Recommended):** **Retain elected President and Vice President, implement a lottery for Secretary, Treasurer, and Communications Chair.**  
      *   **Rationale:**  
          *   Preserves direct accountability for the top leadership roles most responsible for agenda-setting and external representation.  
          *   Allows the crucial civic experience of campaigning and voting for primary leaders.  
          *   Significantly increases access points to the executive branch for diverse students via lottery for three positions, addressing the core representation concern.  
          *   Reduces the overall burden of campaigning.  
          *   Mitigates the risk of a completely inexperienced executive team by retaining elected leaders.  
  4.  **Other Safeguards for a Lottery (if adopted fully or partially):**  
      *   **Term Limits:** Prohibit consecutive terms for lottery-won positions to ensure rotation and broader participation over time.  
      *   **Enhanced Vetting/Orientation:** Implement a brief, non-exclusionary orientation or Q&A session for volunteers (facilitated by the advisor or outgoing Council) to ensure basic understanding of roles *before* the lottery draw, supplementing the signed commitment.  
      *   **Staggered Terms:** Not feasible with annual cycles but could be considered if terms were lengthened (though this creates other issues).

  ## V. Recommendation
  After careful consideration of the compelling arguments for reform presented by the Civics Club and the significant democratic and practical concerns raised by a full lottery, I recommend the Student Council **reject the proposal to implement a full lottery for all executive officers**. However, I strongly recommend **adopting a modified amendment implementing a hybrid system: retain elected President and Vice President, and implement a lottery system for Secretary, Treasurer, and Communications Chair from a pool of volunteers meeting the proposed criteria (2.5 GPA + attendance commitment), with a one-term limit on lottery-won positions.**

  ### Reasoning
  The Civics Club correctly diagnoses serious flaws in our current electoral process regarding accessibility and representation. A full lottery, however, is an overcorrection with significant democratic costs: it eliminates student-wide participation in choosing leaders, removes the most direct form of accountability, and sacrifices valuable civic learning experiences for both candidates and voters. The hybrid model offers a balanced solution. It preserves accountability and the core democratic experience for the most critical leadership roles while dramatically expanding opportunities for diverse student participation in executive positions through the lottery for three roles. The term limit ensures ongoing rotation. This approach embraces the spirit of the Civics Club's desire for greater inclusion and reduces the impact of popularity contests, while safeguarding the essential democratic principles of consent and accountability that elections provide.

  ## VI. Conclusion
  The desire to make Student Council leadership more representative and accessible is vital and commendable. The hybrid model proposed offers a pragmatic and principled path forward. It addresses the valid critiques of the current system without abandoning the fundamental participatory and accountability mechanisms that define our role as a representative body. I urge the Council to support this modified amendment to strengthen both the diversity and the democratic foundation of our leadership. I look forward to discussing this recommendation at our upcoming meeting.
