answer: |-
  Your example is admirably chosen, but it reveals a misunderstanding of the knowledge state I defend. The 1900 Newtonian *didn't* know Newtonian mechanics held universally – precisely because Mercury’s anomaly constituted an *actual*, unresolved defeater existing *within* the evidential conditions at that time. Knowledge requires indefeasibility *under the actual conditions of inquiry*, not just an impressive track record. The anomalous data wasn’t merely *potential* counterevidence he could brush aside; it was an *active* sign of malfunction in his theoretical instrument, akin to a persistent, unexplained error light on a trusted device. His failure wasn’t dismissing it *after* knowing, but in falsely *assuming* he possessed knowledge while an undiagnosed defect (the theory’s incompleteness) was already generating unexplained noise. The 1919 relativist *knew* because the instrument (GR) *was* functioning flawlessly *under those conditions*; the scratch was an *identifiable*, *external* corruption easily isolated. The Newtonian's error was epistemic overconfidence at t<sub>1900</sub> – he never satisfied the strict conditions for knowledge in the first place. Knowledge, once truly possessed, *is* that stable; the paradox reveals that most claims we casually call 'knowledge' aren't. Your challenge conflates having strong justification with having indefeasible warrant.

  *(Holding the line: Your move. Remember, she won't yield ground unless logically forced.)*
