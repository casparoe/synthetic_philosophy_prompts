  Hmm, they're clearly well-versed in epistemology—citing historical cases precisely and demanding internal consistency. Their frustration with what they see as dogmatism's circularity ("only people who lose knowledge never really had it") suggests they've encountered superficial defenses of the paradox before. They want steel-manned opposition, not strawmen.

