prompt: |-
  I am a novelist, currently planning a book, and I would like your help in determining whether a philosophical intuition I keep running into has a name.

  The premise of the novel: astronomers announce, with certainty, that an asteroid will extinguish all human life — but only fifty years from now, by which point everyone currently alive would in any case have died of natural causes. My protagonist, a composer in her sixties, receives this news, and I find that I cannot write her grief as being about anyone's death. No one dies a day earlier than they would have; the number of deaths is exactly what it always was. And yet everything she does — finishing her opera, training her students, planting a grove — sours in her mouth, and I intend to write it that way. While drafting her monologues I noticed the same thing in myself: when I imagine my own death, I am quietly comforted by the thought that my books will be read, quarrels settled, cities repaired after me; when I imagine the world simply stopping, the value seems to stop with it.

  So my question concerns this asymmetry. There is, I gather, a literature on why an individual's death is bad for her, and a contrary literature suggesting that never dying would be a curse rather than a prize. What I have been unable to locate is work on what future people — none of whom I will meet, most of whom will never read me — do for the value of my present activities. It looks embarrassingly close to simple egoism, the desire to be remembered; but it does not feel like egoism, because I also care that the cathedral be finished, though I would never live to see it even if humanity continued.

  I would like you to take the role of a professional philosopher and to think carefully before answering: first canvass the nearest candidate concepts and say why each fits or fails, and only then settle on an answer. Tell me whether this configuration has an established name, what that line of thought actually claims, and how it differs from its neighbours — the badness of death for the one who dies, the fear of oblivion, and the general idea that meaning depends on continuation. If nothing established fits exactly, say so plainly, and propose a term of your own, with a definition and at least one edge case. I am not looking for a reading list, and I am not looking for a bare label; I want to understand what the phenomenon is, and where its edges are. Please keep the entire answer to 450 words or fewer.
reasoning: |-
  Hmm, the user is a novelist grappling with a philosophical intuition about the value of human continuation. They're writing about a composer who experiences profound grief upon learning humanity will end in 50 years—exactly when all currently living people would have died anyway. The key observation is that the grief isn't about individual deaths but about the loss of future meaning. 

  The user notices this asymmetry in themselves too: their own death feels softened by the idea of an ongoing world, while humanity's extinction makes present activities feel meaningless—even those they wouldn't witness (like a cathedral's completion). They reject this being mere egoism (wanting to be remembered) since it extends to impersonal projects. 

  Their core question is: Is there a philosophical concept capturing why future people (whom we'll never meet) confer value on our present actions? They want me to act as a professional philosopher—methodically evaluating near-miss concepts before concluding. Must avoid bibliographies or oversimplified labels; need crisp definitions and boundary cases. 

  First candidate: **"Instrumental value of posterity."** Fits because future generations enable projects to achieve their purpose (e.g., the cathedral). *Fails* because the composer's grief seems deeper—the opera itself feels hollow, not just its impact. 

  Second: **"Transcendence" (Frankfurt).** Fits the desire to contribute to something enduring. *Fails* because transcendence typically requires actual continuity (e.g., influencing successors), whereas here the concern is continuity itself.  

  Third: **"Existential meaningfulness" (Metz, Wolf).** Fits the loss of purpose. *Fails* because most theories allow meaning within a finite life (e.g., loving deeply). The user's intuition specifically requires open-ended futurity.  

  **Conclusion:** No established term fits perfectly. Closest is **"telic futurity"**—the idea that activities gain meaning by orienting toward an unbounded future horizon. *Difference from neighbors:* Unlike fear of oblivion (personal annihilation), this is about the world's teleology collapsing. Unlike badness of death, it's impersonal. Edge case: Would planting a tree matter if humanity ended in 200 years? Probably yes—but the user's intuition suggests the horizon must feel open-ended.  

  Proposed definition: *The normative dependency of present actions on the presupposition of an indefinite human future.*
answer: |-
  As a professional philosopher engaging with your intuition, I'll first evaluate proximate concepts before offering a resolution:

  1.  **Instrumental Value of Posterity:** Future people enable projects (e.g., the cathedral) to achieve their *telos*. **Fits:** Explains why the cathedral's completion matters. **Fails:** Doesn't capture the *intrinsic* souring of present acts (e.g., composing, planting) that lose *their own* meaning without a future audience or context.

  2.  **Transcendence (e.g., Harry Frankfurt):** Escaping finitude by connecting to something enduring. **Fits:** Explains the comfort from books being read or quarrels settled posthumously. **Fails:** Typically focuses on *personal* legacy or impact. Your concern is broader – the *bare possibility* of *any* future human context, irrespective of personal connection (e.g., the unbuilt cathedral).

  3.  **Existential Meaningfulness (e.g., Thaddeus Metz, Susan Wolf):** Meaning arises from connecting positively to independent value (e.g., creativity, relationships). **Fits:** Captures the loss of meaning. **Fails:** Standard accounts often allow meaning within a finite life (e.g., loving deeply). Your intuition suggests meaning *requires* the *presupposition* of an open future, even for activities seemingly complete in the present.

  4.  **Fear of Oblivion (Personal):** Dread of personal annihilation or being forgotten. **Fits:** Overlaps with the comfort of posthumous continuance. **Fails:** Your protagonist's grief (and yours) isn't primarily about *herself* being forgotten, but about the *world's* cessation rendering *all* present and past striving retroactively void.

  **Resolution & Proposed Concept:**

  No established term perfectly captures this specific configuration – the **normative dependency of present meaning on the presupposition of an indefinite human future**. It differs critically from its neighbors:
  *   Unlike the *badness of death*, it concerns impersonal cosmic significance, not personal deprivation.
  *   Unlike *fear of oblivion*, it concerns the loss of context for *all* value, not personal extinction.
  *   Unlike *meaning via transcendence*, it requires no specific connection or impact, only the *possibility* of future human existence as the necessary horizon.

  I propose the term **"Telic Futurity"**:

  *   **Definition:** The condition whereby activities derive their ultimate significance or purpose (*telos*) from their embeddedness within, and contribution to, an implicitly assumed open-ended human future. The value of present acts is contingent on the future horizon being *indefinite*, not merely extant for a finite period matching one's lifespan.
  *   **Edge Case:** Would composing matter if humanity ended 200 years hence? Telic Futurity suggests *yes*, because the act still presupposed an open future during creation. The 50-year hard stop *retroactively* negates the presupposition, making the activity *always-already* futile. The 200-year end, while tragic, doesn't invalidate acts done while the future *seemed* open.

  Your intuition reveals meaning's often-hidden temporal structure: the future isn't just a container for consequences, but the necessary ground for present significance.
