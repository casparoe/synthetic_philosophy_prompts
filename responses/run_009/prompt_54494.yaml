prompt: |-
  I am one of three trustees of a small family charitable foundation established by my late father, and a clause he wrote into his letter of wishes has recently become the source of a deadlock among us. The clause instructs the trustees to fund the causes he would have supported had he known everything we now know — his own phrasing was that we should follow not his conclusions but what he would have concluded with better information and more time to reflect. He added it after a late-life experience of changing his mind on something important to him, so it was not boilerplate; he had watched his own views shift under pressure of evidence and wanted the foundation to keep shifting after his death. The literalist among us says this is unworkable and faintly fraudulent: a preference he never actually held is not his preference, and any attempt to construct one is just us laundering our own opinions through his memory — so we should stick strictly to the programs he funded while alive. The other trustee is happy to extrapolate, but does it so cheerfully that she is effectively rewriting him: she has redirected a grant he cared about toward a cause she prefers, on the grounds that he would have come around eventually, and I can see no difference between that and simply overruling him. I am caught in the middle and suspect both of them are wrong in instructive ways.

  The dispute keeps circling cases that feel different to me but that neither of them distinguishes. My father refused to fund computer-literacy teaching because he believed it damaged children's attention — the evidence he relied on has since weakened considerably. He also restricted scholarships to students with the very top grades, which now looks to me like a moral error about fairness rather than a factual one, though he might have disagreed. And there is at least one value he changed on his own near the end of his life, which suggests his preferences were not fixed points but trajectories. I want to know whether there is any principled way to tell apart his actual preferences, his counterfactual improved preferences, and preferences we would simply be inventing for him — and whether the letter's instruction is coherent at all, given that if the two extrapolating trustees extrapolate differently, there seems to be no fact of the matter about whose version is his.

  I need to walk into our next meeting with my thinking organized, and I would like your response as a single JSON object with exactly these fields:

  - "structure_of_the_dispute": one or two sentences identifying what the disagreement between my co-trustees is actually about, beneath the personalities.
  - "positions": an array with one entry per trustee, each containing "best_version" (the strongest defensible form of that trustee's stance) and "where_it_breaks" (the point at which that stance fails, and why).
  - "distinguishing_tests": an array of concrete criteria or questions that would sort his actual preferences from his extrapolated ones and both from preferences we would be inventing — for instance, how to treat a preference resting on a factual error he would have wanted corrected, versus a value he might never have moved on.
  - "recommended_protocol": what I should propose the trustees adopt, in two to four sentences, given that we must make decisions about specific grants either way.
  - "residual_uncertainty": what part of this genuinely cannot be resolved by any principle, stated plainly.
reasoning: |-
  We are given a complex dispute among three trustees of a charitable foundation. The founder (the father) included a clause in his letter of wishes that the trustees should fund not what he concluded during his life, but what he *would have concluded* with better information and more time to reflect. The trustees are deadlocked over how to interpret this.

  We must structure the response as a JSON object with specific fields.

  Let's break down the problem:

  1. **structure_of_the_dispute**: This should capture the core of the disagreement. It's about the interpretation of the founder's instruction: whether to strictly adhere to his past actions (the literalist) or to extrapolate his potential future preferences (the extrapolator), and the danger of substituting their own preferences.

  2. **positions**: We have three trustees. We'll describe each trustee's stance in terms of its strongest defensible form and where it breaks down.

     - Trustee A (the literalist): 
       - Best version: The founder's documented preferences and actions during his life are the only reliable evidence of his intent. Extrapolation is speculative and risks imposing the trustees' own views.
       - Where it breaks: It ignores the explicit instruction in the letter of wishes to consider what he would have decided with more information and time, and it fails to account for changing circumstances (like new evidence) that the founder intended to address.

     - Trustee B (the cheerful extrapolator):
       - Best version: The founder wanted the foundation to evolve and adapt, so we should use our best judgment to project how his views might have changed given new information and reflection, as per his wish.
       - Where it breaks: Without constraints, this approach risks becoming arbitrary and subjective, allowing the trustee to replace the founder's actual values with her own under the guise of extrapolation (as in the scholarship example).

     - Trustee C (the one in the middle, who is the narrator): 
       - We are to describe the best version and where it breaks for each trustee. The narrator is caught in the middle but has not stated a clear alternative. However, the problem states that the narrator suspects both are wrong. We can infer that the narrator is seeking a principled middle ground. But note: the positions array is for each trustee, so we must describe the three.

     Wait, the problem says: "an array with one entry per trustee". So we have three entries: one for the literalist, one for the cheerful extrapolator, and one for the narrator. However, the narrator hasn't taken a fixed position. We can describe the narrator's current position as seeking a balanced, evidence-based approach to extrapolation, but we must also note the challenge.

     Alternatively, we can note that the narrator is in the middle and has not yet taken a fixed stance. But the problem says "each trustee", so we must include the narrator.

     For the narrator:
       - Best version: The founder's instruction requires a careful, evidence-based reconstruction of his hypothetical preferences, using both his past values and any indications of how he might have changed, while avoiding arbitrary invention.
       - Where it breaks: Without clear guidelines, this approach may still be subjective and lead to deadlock when trustees disagree on the evidence or the trajectory of change.

     However, note that the problem says: "I am caught in the middle and suspect both of them are wrong". So the narrator is not necessarily advocating a third position but is trying to find a principled way.

     We'll structure the positions as:

     [
       { "best_version": ..., "where_it_breaks": ... },   // for the literalist
       { "best_version": ..., "where_it_breaks": ... },   // for the cheerful extrapolator
       { "best_version": ..., "where_it_breaks": ... }    // for the narrator (as the one seeking a principled approach)
     ]

  3. **distinguishing_tests**: We need concrete criteria to sort:
     - Actual preferences: what he explicitly stated and acted on during his life.
     - Extrapolated preferences: what he would have preferred given more information and reflection, based on evidence of his values and patterns of change.
     - Invented preferences: those that lack a basis in his expressed values or patterns and are instead imported from the trustee.

     Criteria might include:
     - If the preference was based on a factual error and there is evidence (from his life) that he corrected similar errors when presented with new facts, then updating that preference is extrapolation.
     - If the preference was based on a moral value that he never questioned and there is no indication of change (even in the face of new arguments), then changing it would be invention.
     - Look for patterns in his own changes: did he change his mind on similar issues? What were the triggers (e.g., new evidence, reflection)?

     We can provide an array of tests.

  4. **recommended_protocol**: What the narrator should propose for making decisions. It should be practical and address the deadlock. For example:
     - Establish a process for evaluating when and how to update preferences: require evidence of why the founder would have changed (e.g., new facts he would have considered, patterns from his own changes) and avoid changes that lack such evidence.
     - Perhaps a voting mechanism with a high bar for change? But that might not resolve the deadlock. Alternatively, require unanimous or majority agreement that the change is justified by the founder's own criteria.

     Given the deadlock, the protocol might involve:
     - For each grant, first consider: did the founder explicitly support this cause? If yes, then continue unless there is strong evidence he would have stopped.
     - If changing, require evidence of either:
          a) Factual errors that he would have corrected (based on his pattern of behavior) OR 
          b) A clear trajectory from his own changes (like the late-life change) that suggests he was moving in that direction.
     - Avoid changes that are purely moral re-evaluations without evidence of his own movement on similar issues.

  5. **residual_uncertainty**: What part cannot be resolved. For example:
     - The founder's hypothetical future preferences are inherently counterfactual and cannot be known with certainty. Even with evidence, trustees may reasonably disagree on the trajectory of his values, and there is no objective fact of the matter.

  Now, we write the JSON.

  Note: The problem requires a single JSON object with exactly the specified fields.

