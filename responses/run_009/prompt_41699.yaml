prompt: |-
  I'm a third-year undergraduate enrolled in a philosophy of mathematics seminar, and in two weeks I'm responsible for running our 80-minute session on my own (14 students, the professor sits in but stays quiet). We've just finished the platonism versus nominalism unit — the indispensability argument, the standard nominalist escape routes (paraphrase strategies, fictionalism, Field-style attempts to reformulate science without quantifying over abstract objects) — and my classmates can recite the dialectic perfectly without, I think, feeling its weight at all. On paper, nominalism sounds like a modest bookkeeping reform; I want them to discover that it isn't.

  Please act as a professional philosopher of mathematics who is also an experienced workshop facilitator. Before writing out the full activity, brainstorm two or three candidate designs at a high level and tell me briefly why you settled on the one you did — I want to see your reasoning, not just the output. Then give me the complete, runnable activity.

  Here is roughly what I want the activity to accomplish, though I'm open to your improving on it. Participants are split into two camps: nominalists, who are forbidden to speak or write as if mathematical objects exist — no numbers, sets, or functions as things one talks about — and may only refer to concrete inscriptions, physical tokens, and actual manipulations; and platonists, who may use ordinary mathematical language freely. Both camps must then solve the same series of tasks, and the scoring should reward compactness, generality, and checkability — not just getting the answer — so that the nominalists can't hide the cost of their paraphrases behind verbosity. My hope is that they run into the indispensability of mathematical quantification on their own: they'll find themselves smuggling in abstract talk, getting penalized, patching, and smugging again, until they feel exactly what the indispensability argument is claiming. After the game, a debrief that maps specific moments from the activity onto the parts of the argument and the nominalist responses we've read, without turning into a lecture.

  Please include: complete rules and materials (no software or special equipment — whiteboard, paper, and whatever tokens we can scrounge), a task sequence with the scoring rubric, a realistic minute-by-minute timeline for 80 minutes, and a judge's guide for how to rule on borderline paraphrases (I anticipate vicious arguments about what counts as covert reference to an abstract object, and I want rulings that are principled rather than arbitrary). Also tell me honestly what will predictably go wrong the first time I run it, and — this matters most to me — be frank about which part of the platonism–nominalism dispute no game with payoffs can possibly reproduce, so I know what I'll have to supply myself in the final five minutes.
reasoning: |-
  We are designing an activity to help students feel the weight of the nominalism vs platonism debate, particularly the indispensability argument. The core idea is to have two groups (nominalists and platonists) solve the same tasks under different linguistic constraints, with scoring that rewards compactness, generality, and checkability. The nominalists are forbidden from referring to abstract mathematical objects and must only use concrete, physical terms. The platonists can use ordinary mathematical language. Through the tasks, we hope the nominalists will struggle and see the costs of their paraphrases.

  After brainstorming, I considered three candidate designs:

  1. **Design A: A series of increasingly complex arithmetic and set-theoretic tasks.**  
     The tasks would start simple (e.g., "How many chairs are in the room?") and build to more complex ones (e.g., "If there are 14 students and each has 2 hands, how many hands are there?"). The nominalists would have to use physical tokens (like actual chairs, or drawn marks) to demonstrate. Why I hesitated: This might be too basic and not reveal the indispensability of quantification for generality and compactness in more complex scenarios.

  2. **Design B: A problem requiring combinatorial reasoning.**  
     For example, "How many ways can we form a committee of 3 from 14 students?" This forces the nominalists to physically list or represent combinations without using abstract combinatorial numbers (like binomial coefficients). Why I hesitated: While it shows the combinatorial explosion, it might be too time-consuming and the scoring of compactness and generality would be challenging.

  3. **Design C: A problem involving measurement and approximation.**  
     For example, "Measure the length of the whiteboard using a 30cm ruler." The nominalists would have to describe the process without using numbers (e.g., "lay the ruler end-to-end and count the placements"). Then extend to a scenario that requires averaging or error bounds. Why I hesitated: It might not clearly show the need for quantification and the inescapable role of numbers.

  **Why I settled on a hybrid approach (Design D):**  
  I decided to combine elements from the above and add a task that requires quantification over an infinite domain (even if only hypothetically) to really push the indispensability. The sequence of tasks will be:

  1. **Task 1: Counting a small set of objects.** (To get them used to the rules and show that for small finite cases, nominalism can work but is cumbersome.)
  2. **Task 2: Arithmetic operations on larger numbers.** (To show that without numbers, even simple operations become tedious.)
  3. **Task 3: A problem requiring universal quantification over an infinite set (like the natural numbers) but applied to a finite instance.** (This is where the nominalists will really struggle because they cannot avoid some form of abstract pattern or rule.)

  The scoring will be based on:
  - **Compactness**: How concise is the solution? (Measured by word count or time to express.)
  - **Generality**: Does the solution apply to a class of problems or just the instance?
  - **Checkability**: Can another person verify the solution easily and without ambiguity?

  **Final Design: "The Language Game"**

  **Objective:** To experience the practical consequences of nominalism vs platonism in mathematical reasoning, and to feel the weight of the indispensability argument.

  **Materials:** 
  - Whiteboard and markers.
  - Paper and pens for each group.
  - A set of identical tokens (e.g., coins, buttons, or pieces of paper) for the nominalists to use.
  - A stopwatch or timer.
  - Scoreboard.

  **Groups:** 
  - Split the class into two groups: Platonists (P) and Nominalists (N). Each group should have 7 members (if possible, adjust if not). The groups will work together on the tasks.

  **Rules for Platonists (P):**
  - They may use standard mathematical language, including reference to numbers, sets, functions, and other abstract objects.
  - They may use variables and quantifiers.

  **Rules for Nominalists (N):**
  - They are forbidden from using any terms that refer to abstract mathematical objects (e.g., "number", "set", "function", "infinity", "zero", "one", etc.).
  - They may only refer to concrete physical objects (tokens, inscriptions, marks on paper, physical operations).
  - They may not use variables or quantifiers that range over abstract objects. They can use quantifiers over physical objects (e.g., "for every token in this pile") but note that even this might be considered abstract if the tokens are taken as representatives. We must be cautious (see Judge's guide).
  - They must describe everything in terms of actual or potential physical manipulations.

  **Judge's Guide (for you, the facilitator):**  
  The key is to be consistent. Here are principles for ruling:

  1. **Abstract Reference:** If a nominalist uses a term that is commonly understood as referring to an abstract object (e.g., "the number 5", "the set of chairs"), that's a violation. They must rephrase.
  2. **Covert Abstraction:** Watch for words that imply abstraction: "count", "total", "add", "multiply", etc. are forbidden. They must describe the physical process without these. Example: Instead of "add 2 and 3", they must say "if I have a pile of 2 tokens and another pile of 3 tokens, and I push them together, I get a pile of 5 tokens" — but note that "2 tokens" is already abstract! So they must avoid even that. They might say: "I take a pile that has as many tokens as the first mark on my paper and another pile that has as many tokens as the second mark, then combine, and the result is a pile that has as many tokens as the third mark." This is still abstract because of "as many as". They must use a physical standard: e.g., a specific set of tokens that they have previously set aside as a standard? But that standard is finite. This is the heart of the problem.

     **Ruling:** In the initial stages, allow them to use concrete tokens to represent. But if they start using a token to stand for a number (e.g., a coin representing the number 5), that is forbidden because it is a representation of an abstract object. They can only refer to the actual physical coin and its properties (like its position, or being in a pile).

     **What is allowed for N:**
     - They can use tokens to stand for themselves only. They can group tokens and describe operations on groups (e.g., "take this group and that group and put them together").
     - They can use inscriptions (like tally marks) but note that the tally marks are physical. However, if they say "this mark stands for five", that's abstract. They can say "this mark is a group of five tallies" but then they have to define what a tally is physically.

     **This is going to be messy and that's the point.** The judge must be strict: if a nominalist uses any term that implies an abstract concept, call a violation and they must rephrase. After two violations on the same task, they lose points.

  **Scoring Rubric (per task):**
  - **Correctness (1 point):** Did they get the right answer?
  - **Compactness (1 point):** Was the solution expressed concisely? (Compare the number of words or time taken to present. The group with the shorter presentation wins the point. If both are about the same, split the point.)
  - **Generality (1 point):** Does the solution apply to a general case or only the specific instance? (If the solution is for the instance only, they get 0; if it can be applied to other numbers/instances without change, they get 1.)
  - **Checkability (1 point):** How easy is it for an independent person to verify? (Judge's subjective assessment: if the solution is clear and the steps are verifiable without ambiguity, 1 point; if it's messy and error-prone, 0.)

  Each task is worth up to 4 points. The group with the most points at the end wins.

  **Task Sequence:**

  1. **Task 1: Counting**  
     *Problem:* "There are 14 students in this room. How many students are there?"  
     *Expected Platonist Solution:* "14" (or they might count and say 14).  
     *Expected Nominalist Solution:* They must point to each student and make a mark for each, then count the marks? But "count" is abstract. They must avoid counting. They might say: "We line up the students and for each student we place a token. Then we have a pile of tokens." But then how do they answer the question? They might say "the pile has the same cardinality as the tokens" — forbidden. They might just show the pile and say "this pile". But the question asks for a number.  
     *Judge's note:* The nominalists will struggle to even answer without using a number. They might say "we have a pile of tokens that corresponds one-to-one with the students". But "one-to-one" is abstract. They must avoid. They might have to physically create a pile of tokens and say "this pile" and leave it at that. Then they haven't given a number.  
     *Scoring:* Correctness: P will get it right. N might not even give a number. So P gets correctness. Compactness: P wins. Generality: P's method (counting) is general, N's (making a pile of tokens) is also general? But they haven't given a number. They might have to make a standard set of tokens for numbers? But that's abstract. This task will show the problem.

  2. **Task 2: Addition**  
     *Problem:* "There are 14 students. Each student has 2 hands. How many hands are there?"  
     *Expected Platonist:* "14 * 2 = 28"  
     *Expected Nominalist:* They might set up 14 tokens (for students) and for each token, add two tokens (for hands). Then they have a big pile. But again, they cannot count the pile. They might say "we have a pile of tokens that is the same as the pile we made for the hands". But then they haven't given a number. They need to compare to a standard? That standard would be abstract.  
     *Note:* We are not requiring them to give a number? The problem asks "how many", so they must. But if we relax and allow them to describe the pile, then we lose the force. So the problem must require a numerical answer? Or we change the problem to: "Is the number of hands twice the number of students?" Then they have to compare without numbers.  
     *Revised Task 2:* "Is the number of hands twice the number of students? How do you know?"  
     *Platonist:* "Yes, because 14*2=28 and 28 is twice 14."  
     *Nominalist:* They might pair two hand-tokens for each student-token. Then they have a one-to-one correspondence between student-tokens and pairs of hand-tokens. But this is abstract. They must avoid "pair" and "correspondence". They might physically group two hand-tokens with each student-token. Then they can say that for every student-token, there are two hand-tokens. But then to say "twice", they need to compare? They might not have a word for "twice".  
     *This is getting too hard?* We want them to use a physical method. Maybe allow them to use the word "twice" if they can define it physically? But that's abstract.  

     **Redesign of Task 2:**  
     Instead, we do: "We have 3 students in the front row (physically point to three students). Each student has 2 hands. Without counting, show that the total number of hand-tokens you would have is twice the number of student-tokens."  
     Then the nominalists can physically take 3 tokens for students and for each, put 2 tokens for hands. Then they have 6 hand tokens and 3 student tokens. Then they can pair each student token with two hand tokens. Then they can see that the hand tokens are two for each student. But how do they express "twice"? They might say: "If I take the set of hand tokens and group them by student, each group has two, and there are as many groups as students, so twice." But that uses grouping and counting.  
     *Alternative:* They can take the student tokens and for each, place two hand tokens. Then they have three groups of two. Then they take all hand tokens and form two groups of three? That doesn't help.  
     *We might have to accept that they use the physical grouping and then say "for each student, two hands, so twice". But that's abstract because of "for each".*  

     **Compromise for Task 2:**  
     We change the problem to: "We have three students (actual people) in the front. Each has two hands. How many hands are there? Use tokens to show."  
     Then the nominalists can use tokens to represent: 3 tokens for students, and for each student token, they place two hand tokens. Then they have 6 hand tokens. They then show the pile of 6. But they cannot say "6". They must avoid. So they might hold up the pile.  
     *But the problem asks "how many".* We might have to let the nominalists use a standard: e.g., they have a set of tokens labeled with numerals? But that's abstract.  

     **Conclusion on tasks:** We want to show the indispensability of numbers and quantification, so we must require a numerical answer. Therefore, we will allow the nominalists to use a physical numeral system (like tally marks) that they have defined. But they must define it without abstraction. They can say: "We have agreed that a single vertical mark | stands for one. Then || stands for two, etc." But this is a representation of numbers, which is abstract. So we forbid it? Then they cannot do it.  

     **This is the key insight: nominalism, strictly enforced, makes it impossible to give a numerical answer because numbers are abstract.** So the nominalists will have to violate the rules to answer. That's the point! They will feel the cost.

     Therefore, we design the tasks to require numerical answers and watch the nominalists struggle and cheat.

  3. **Task 3: Universal Generalization**  
     *Problem:* "Prove that for any natural number n, the sum of the first n odd numbers is n squared."  
     But we cannot do an infinite set. So we do:  
     "Prove that the sum of the first 3 odd numbers is 3 squared."  
     Then we ask: "Can your method be extended to any n?"  
     *Platonist:* They can do: 1+3+5=9=3^2. Then say: by mathematical induction, it holds for any n.  
     *Nominalist:* They must show with tokens:  
      - First odd number: 1 token.
      - Second: add 3 tokens -> total 4 tokens? But 1+3=4 is 2^2, not 3^2.  
     They need to show for n=3: 1+3+5=9. They can arrange tokens in a 3x3 grid?  
     They might arrange 1 token, then around it 3 tokens to form a 2x2, then 5 tokens to form a 3x3? That's a common proof without words.  
     But then they have to say: for n=3, we have 9 tokens. Then for n=4, they would have to do the same? But they cannot say "for any n".  
     They might show the pattern: each time we add the next odd number of tokens to form the next square. But that pattern is abstract.  

     *Revised Task 3:*  
     "Show that the sum of the first 3 odd numbers is 3 squared, using tokens. Then, without using tokens for n=4, explain how it would work for 4."  
     The nominalists can do the token arrangement for n=3. Then for n=4, they might say: "We add 7 more tokens around the 3x3 to make 4x4." But they haven't used tokens, so they are describing a pattern. The pattern is an abstract rule.  

     **This will force them to use abstract language, which is forbidden. They get penalized.**

  **Final Task Sequence (adjusted for time and feasibility):**

  1. **Task 1 (10 min):** "There are 14 students in the room. How many students are there? Express your answer and method."  
     We require a numerical answer.

  2. **Task 2 (15 min):** "Each student has 2 hands. How many hands are there in total? Express your answer and method."

  3. **Task 3 (20 min):** "Show that the sum of the first 3 odd numbers is 9 (which is 3 squared). Then, without using tokens for n=4, explain how you would show for n=4. Finally, can you generalize to any n? How?"

  **Timeline (80 minutes total):**

  - 0-5 min: Introduction. Explain the rules, split the groups (7 each), assign roles. Hand out materials. Explain scoring.
  - 5-15 min: Task 1. Groups work. Then present (3 min per group). Judge scores.
  - 15-30 min: Task 2. Groups work. Present (3 min per group). Judge scores.
  - 30-50 min: Task 3. Groups work. Present (4 min per group). Judge scores.
  - 50-70 min: Debrief. Map the struggles to the indispensability argument and nominalist responses. (20 min)
  - 70-80 min: Conclusion and your final remarks (about what the game cannot capture).

  **Debrief Questions:**
  - For the nominalists: Where did you feel the rules constraining you? How did you try to work around them? Did you feel like you were cheating?
  - For the platonists: Did you feel the nominalists were being unnecessarily cumbersome? Where did you see them struggling?
  - For all: In Task 3, when trying to generalize, could the nominalists avoid abstract patterns? What does this say about the indispensability of mathematical objects for expressing general truths?
  - Connect to the indispensability argument: Our best scientific theories use mathematics to express general laws. If we cannot even do these simple tasks without mathematics, how can we do science?

  **What will go wrong:**
  1. The nominalists will be very frustrated and might give up or cheat blatantly.
  2. The platonists might finish quickly and get bored.
  3. The rulings will be contentious. The nominalists will argue that their physical representations are concrete. You must be firm: if they are using a token to represent a number, that's abstract.
  4. Time: The tasks might take longer than planned. Be ready to cut.

  **What the game cannot capture:**
  The game focuses on practical expressiveness and efficiency. But the heart of the platonism-nominalism dispute is ontological: do abstract objects exist independently of us? Even if we show that we cannot avoid using mathematical language, a nominalist might still argue that this is just a useful fiction (as in fictionalism). The game does not address the truth of mathematical statements or the nature of mathematical knowledge. In the final five minutes, you must emphasize this: the indispensability argument is about the ontological commitments of our best scientific theories. The game shows the practical indispensability, but the philosophical leap to ontological commitment is what the nominalist will resist. You might quote Field: we can reformulate science without mathematics, even if it's cumbersome. But the game suggests that for practical purposes, we cannot do without it, and that might be enough for the platonist.

  **Complete Activity Write-up:**

  **Title:** The Indispensability Experiment: A Language Game

  **Objective:** To experience the practical challenges of nominalism and to feel the force of the indispensability argument.

  **Groups:** 
  - Platonists (P): 7 students
  - Nominalists (N): 7 students

  **Rules Summary:**
  - P: Use standard mathematical language freely.
  - N: Forbidden: any reference to abstract mathematical objects (numbers, sets, functions, etc.). Only physical objects and operations allowed.
  - Judge (you) will rule on violations. Two violations in one task = 0 for compactness and checkability.

  **Materials:** 
  - Whiteboard (for scoreboard and judge's notes)
  - Paper and pens for each group
  - 100 tokens (buttons, coins, etc.) for the nominalists
  - Timer

  **Scoring (per task):** 
  - Correctness (1 point): Right answer?
  - Compactness (1 point): Shorter presentation? (Compare by word count or time. If within 10%, tie -> 0.5 each.)
  - Generality (1 point): Does the solution apply generally? (P: if they give a formula. N: if they describe a method that works for any instance without change.)
  - Checkability (1 point): Is the solution easy to verify? (Judge: 1 for clear, step-by-step; 0 if messy.)

  **Task 1 (10 min):** 
  - Problem: "There are 14 students in the room. How many students are there? Express your answer and method."

  **Task 2 (15 min):** 
  - Problem: "Each student has 2 hands. How many hands are there in total? Express your answer and method."

  **Task 3 (20 min):** 
  - Problem: "Show that the sum of the first 3 odd numbers is 9 (which is 3 squared) using your group's allowed language. Then, without using tokens for n=4, explain how you would show it for n=4. Finally, can you generalize to any natural number n? How?"

  **Timeline:**
  - 0-5 min: Introduction and rules.
  - 5-15 min: Task 1 work and presentations (each group gets 3 min to present). Judge scores.
  - 15-30 min: Task 2 work and presentations (3 min each). Judge scores.
  - 30-50 min: Task 3 work and presentations (4 min each). Judge scores.
  - 50-70 min: Debrief (see questions above).
  - 70-80 min: Concluding remarks.

  **Concluding Remarks (for you to prepare):**
  - Highlight the struggles of the nominalists: they either were very verbose, or they smuggled in abstract terms. This mirrors the indispensability argument: mathematics is indispensable for brevity, generality, and clarity in science.
  - But note: the game does not settle the ontological question. The nominalist can still say: "Even if we must use mathematical language, it doesn't mean mathematical objects exist. It might be a useful fiction." (fictionalism) Or they might hope for a reformulation of science without mathematics (like Field). However, the practical indispensability we've seen makes such reformulations extremely cumbersome and perhaps impossible for human cognition.
  - End by emphasizing that the feeling of constraint the nominalists experienced is what the platonist claims is the weight of the indispensability argument. But the nominalist must find a way to bear that weight or find an escape route.

  This activity should make the abstract debate concrete and memorable.
answer: |-
  Below is a complete workshop design based on your goals. I'll first brainstorm candidate designs at a high level, explain why I chose the final approach, then provide the full runnable activity with rules, tasks, timeline, judge's guide, and reflections.

  ### Brainstorm: Candidate Designs
  1. **Design A: "Scientific Reformulation"**  
     Groups reformulate a simple scientific law (e.g., Newton's second law, F=ma) in their assigned language. Platonists use equations; nominalists describe physical operations (e.g., "When this cart is pulled, measure its acceleration token with these marks...").  
     *Why rejected*: Too niche for a philosophy of math seminar—requires physics background and doesn't focus on quantification. Lacks the iterative "smuggling" effect you want.

  2. **Design B: "Algorithmic Efficiency"**  
     Groups design instructions for a simple algorithm (e.g., sorting tokens). Platonists use variables/indices; nominalists manipulate physical tokens step-by-step. Scoring emphasizes steps needed.  
     *Why rejected*: Highlights efficiency but misses the core issue of *reference* to abstracta. May feel like a coding exercise, not philosophy.

  3. **Design C: "Infinite Generality"**  
     Groups prove a universally quantified statement (e.g., "For any pair of objects, order doesn't affect counting") under constraints. Tasks escalate from finite to "potential infinite" cases.  
     **Chosen design**: This best forces nominalists into paradox—they can handle instances physically but collapse when generalizing. It directly mirrors the indispensability argument (quantification over infinite domains) and creates the "smuggling" loop you described. I improved it by adding scoring that penalizes verbosity and rewards checkability, ensuring the nominalist cost is visible.

  **Why Design C Wins**:  
  - **Relevance**: Forces engagement with quantification, the crux of the indispensability argument.  
  - **Tactile struggle**: Nominalists will hit walls in Task 3 (generality), making abstract objects feel "inescapable."  
  - **Debrief synergy**: Specific task struggles map cleanly to Quine-Putnam (indispensability), Field (reformulation), and Yablo (paraphrase).  

  ---

  ### Complete Runnable Activity: "The Quantification Gauntlet"
  **Objective**: Experience why nominalism fails at generalization. Platonists will see math as essential; nominalists will "smuggle" abstracta and feel the cost of avoidance.  
  **Groups**: Split 14 students into **Platonists (P)** and **Nominalists (N)**. 7 per group (adjust if uneven). P use math freely; N may *only* reference:  
  - Concrete inscriptions (e.g., tally marks, written symbols).  
  - Physical tokens (e.g., pens, paper clips, or scrounged items like buttons).  
  - Spatiotemporal operations (e.g., "move this token there," "copy this mark").  

  **Forbidden for N**:  
  - Any reference to abstract objects (numbers, sets, functions).  
  - Implicit abstraction (e.g., "total," "sum," "always"). Use "heap of tokens" or "all marks like this" instead.  
  - Quantifiers over non-concrete domains (e.g., "for any number" is banned; "for any token in this pile" is allowed but risky—see Judge’s Guide).  

  **Materials**:  
  - Whiteboard (for scores/tasks).  
  - Paper/pens per group.  
  - 100+ identical tokens (e.g., paper clips, coins, or torn paper scraps).  
  - Timer.  

  **Scoring Rubric (per task)**:  
  - **Correctness (1 pt)**: Right answer.  
  - **Compactness (1 pt)**: Fewer words/steps than the other group. Judge compares written solutions. Tie → 0.5 each.  
  - **Generality (1 pt)**: Solution works for any instance without modification (e.g., "n=5" not just "n=3"). N must avoid abstract patterns.  
  - **Checkability (1 pt)**: Verifiable by an outsider quickly. Messy token heaps or ambiguous inscriptions lose points.  

  **Judge’s Guide**:  
  You are the arbiter. Anticipate three borderline cases:  
  1. **"Innocent" physical quantifiers**: E.g., N says: "For each token in this pile..." → **ALLOWED** if the pile is concrete. But if they imply abstraction (e.g., "for any *possible* token"), → **VIOLATION**.  
  2. **Representation vs. abstraction**: E.g., N uses a token to represent "the number 3" → **VIOLATION** (it’s a stand-in for an abstract object). But using three tokens to show "three-ness" → **ALLOWED**.  
  3. **Pattern smuggling**: E.g., N says: "Do this for bigger n" without physical detail → **VIOLATION**. They must specify *how* (e.g., "add two tokens to the pile each time").  

  **Ruling principles**:  
  - **First violation**: Warning and rephrase.  
  - **Second violation (same task)**: Penalize -1 pt from compactness and checkability.  
  - **Stay public**: Explain rulings to the class (e.g., "This is a violation because you implied a pattern beyond physical tokens").  

  **Task Sequence**:  
  *Problems escalate to force N into generality traps. Write tasks on whiteboard.*  

  1. **Task 1: Finite Counting (10 min)**  
     - *Problem*: "There are 14 students here. How would you express this without using numbers? Then, if 3 leave, how many remain?"  
     - *Goal*: Warm-up. N should use tokens/tallies. Tests basic reference.  
     - *Expected N struggle*: They’ll say "this pile of tokens" but falter on subtraction.  

  2. **Task 2: Arithmetic Operation (15 min)**  
     - *Problem*: "Each student has 2 hands. How many hands total? After, show that hands = students × 2."  
     - *Goal*: N must avoid "multiplication." Tests operationalization.  
     - *Expected N struggle*: They’ll pair tokens (e.g., 14 student tokens + 28 hand tokens) but imply abstraction in "×2."  

  3. **Task 3: Universal Generalization (20 min)**  
     - *Problem*: "Show that for any n, the sum of the first n odd numbers is n². First demonstrate for n=3, then explain how it works for any n."  
     - *Goal*: Force generality. P will use algebra; N must avoid "any."  
     - *Expected N struggle*: They’ll build a 3x3 token grid for n=3 but say, "Just keep adding" for general n—violating generality.  

  ---

  ### Timeline (80 min total)
  - **0–5 min: Setup**  
    Split groups. Explain rules/scoring. Emphasize: "Nominalists, you cannot say 'number' or 'always.' Platonists, you can. Score rewards simplicity and verifiability."  

  - **5–15 min: Task 1**  
    Groups work (8 min). P present first (1 min), then N (1 min). Judge scores publicly (correctness, compactness, generality, checkability) with rulings.  

  - **15–30 min: Task 2**  
    Work (10 min). Presentations (1.5 min each). Judge scores. *Predictable issue*: N will argue their token-pairing is "physical." Judge: "Pairing implies a rule—rephrase or lose generality."  

  - **30–50 min: Task 3**  
    Work (15 min). Presentations (2 min each). Judge scores. *Predictable issue*: N will say "add two more tokens" for n=4 → penalize for lacking generality.  

  - **50–70 min: Debrief**  
    Lead discussion:  
    - "Nominalists: Where did you cheat? How did it feel?" (They’ll confess to implying patterns.)  
    - "Platonists: Where did nominalists seem inefficient?" (Verbosity, ambiguity.)  
    - **Map to readings**:  
      - Task 3 → Quine-Putnam: "Generalizing requires quantifying over abstracta."  
      - N’s token heaps → Field: "Science without math is possible but ugly."  
      - N’s smuggling → Yablo: "Paraphrase still sneaks in reference."  
    - Keep it experiential: "Remember when N couldn’t say ‘for any n’? That’s the indispensability argument in vivo."  

  - **70–80 min: Conclusion**  
    Reveal scores. Then:  
    - "What this game *can’t* capture: **Truth and ontology**. Even if math is indispensable for *us*, does it exist independently? Fictionalists (like Field) say no—math is just useful. Platonists say yes. This game shows why platonism feels unavoidable, but it doesn’t prove abstract objects exist."  
    - End with: "Next week, we’ll see if fictionalism can survive this discomfort."  

  ---

  ### Predictable Challenges and Honest Reflections
  **What will go wrong**:  
  - **Nominalist frustration**: They’ll protest rulings (e.g., "But I *need* to say ‘add two’!"). Stay firm—this is the point.  
  - **Time crunches**: Task 3 may run long. Cut presentations to 1 min if needed.  
  - **Lopsided scores**: P will dominate. Use this! "See how much harder nominalism is?"  
  - **Surface engagement**: Some may treat it as a "puzzle game." Debrief ties it back.  

  **What the game can’t reproduce**:  
  - **The ontological gap**: The game shows *practical* indispensability, but nominalists (e.g., Field) retreat to *metaphysical* possibility: "We *could* reformulate science without math, even if we don’t." The game can’t simulate this "in principle" escape—it’s about human limitations. You’ll need to **explicitly bridge this in the conclusion** (as outlined above).  

  **Why this works**:  
  By Task 3, nominalists will be exhausted from "patching" violations (e.g., "For n=4... wait, I can’t say that!"). They’ll feel the weight of indispensability viscerally. The scoring makes their paraphrases costly—no hiding behind "but it works in theory."  

  **Final tip**: Bring a box of paper clips as tokens—they’re noisy when moved, amplifying nominalist clumsiness. Run it ruthlessly; their frustration is the pedagogy.
