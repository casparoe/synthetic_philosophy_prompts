prompt: |-
  My friend and I just spent like two hours on this and it ended kind of badly, so I want to get it straight. She's german, visiting me in the states, and she flat out refuses to tip 20% at restaurants -- she thinks the whole system is exploitative and that paying servers properly is the employer's job, not hers, so she tips like she would in berlin and won't be moved on it. Meanwhile I've been lecturing HER for years about not jaywalking when we visit her ( germans actually wait at empty crosswalks at 3am, its wild), and my whole lecture is basically "when in rome". She threw that back at me: if when-in-rome is real, she has to tip here, and if she doesn't have to tip, I shouldn't have to wait at her empty crosswalks. So either we're both hypocrites or the slogan is doing nothing.

  The thing is I feel like she's right that something's off, but ALSO like the two cases aren't the same, and I can't articulate why. So: what are the actual different claims packed into "when in rome, do as the romans do"? Like, one reading is just practical advice (don't get yelled at), one might be about not insulting your hosts, one might be a full-blown moral claim that local convention actually GENERATES obligations for visitors, and maybe there's a coordination-game version where queueing and tipping are the kind of thing that only work if everyone does them. And then the question I actually care about: on which of those readings does she have a tipping obligation in the US, on which do I have to wait at the stupid empty crosswalk, and are those the same reading or different ones? Is the difference something about who bears the cost, or whether the convention is load-bearing for someone's livelihood, or whether complying signals endorsement of the underlying practice (which is her whole worry -- she says tipping well makes you complicit)?

  Please lay out the readings as a list, from the most trivial to the most radical, and for each one say whether its plausible and what it would force us to do in the tipping vs jaywalking cases. Then tell me if theres a principled way to say she owes the tip but I can cross the empty street, or whether I have to bite a bullet here. Hard limit: 450 words, I want to be able to reread it in one sitting before I text her.
reasoning: |-
  Okay, let me tackle this user's dilemma. They're stuck in a cultural argument with their German friend about tipping in the US versus jaywalking in Germany. The core conflict revolves around the "when in Rome" principle and whether it applies consistently to both situations. 

  First, I need to unpack the different interpretations of "when in Rome" systematically. The user wants a clear breakdown of readings from trivial to radical, applied to both scenarios. Their underlying frustration is palpable - they feel their friend has a point about tipping being exploitative, but also believe cultural norms matter. 

  I consider starting with the most basic reading: pure practicality. For tipping, not tipping 20% could lead to bad service or confrontation. For jaywalking in Germany, the risk is mainly a fine. Then I need to address the politeness angle - how behaviors affect social perception. Tipping poorly might offend servers and locals, while Germans may see jaywalking as disrespectful to order. 

  The coordination argument is crucial here. Tipping directly impacts workers' livelihoods in a system where wages depend on tips. Jaywalking is more about collective rule-following without immediate victim impact. This feels like the strongest distinction. 

  The endorsement concern is tricky. Their friend refuses to tip because it feels like supporting a broken system. But does following any local custom imply endorsement? Probably not inherently - context matters. 

  Finally, the radical claim that conventions create moral duties. This seems philosophically shaky - we wouldn't say visitors must follow unjust local laws. 

  My conclusion leans on the coordination argument: tipping's direct impact on workers makes it different from jaywalking. The user can acknowledge the system's flaws while recognizing servers' current dependence on tips. For jaywalking, the empty-street scenario has minimal stakes beyond personal risk. 

  I need to keep this under 450 words while covering all angles. The user wants concrete answers to text their friend, so clarity is key. I'll avoid academic jargon and focus on practical distinctions they can use in their argument.
answer: |-
  Here's a breakdown of "when in Rome" readings, applied to your cases:

  1.  **Practical Conformity (Avoid Trouble):** Follow local rules to avoid fines, confrontation, or bad service.
      *   **Plausible?** Yes. Basic self-interest.
      *   **Tipping (US):** *Obligation?* Low risk of *immediate* trouble (maybe bad service next time). Weak obligation.
      *   **Jaywalking (Germany):** *Obligation?* Low risk on empty street at 3am. Weak obligation.
      *   **Result:** Neither forced strongly.

  2.  **Courtesy / Politeness (Avoid Offense):** Respect local sensibilities to be a good guest.
      *   **Plausible?** Yes. Core of hospitality.
      *   **Tipping (US):** *Obligation?* High. Servers *expect* it; locals see undertipping as rude. Strong obligation.
      *   **Jaywalking (Germany):** *Obligation?* Low on empty street. No one offended if unseen. Weak obligation.
      *   **Result:** She tips strongly; you cross freely.

  3.  **Coordination / System Reliance:** Follow conventions essential for local systems to function smoothly.
      *   **Plausible?** Yes for system-dependent norms.
      *   **Tipping (US):** *Obligation?* High. Servers' wages *legally depend* on tips. The system *requires* tipping to function as designed. Strong obligation.
      *   **Jaywalking (Germany):** *Obligation?* Low. Rule exists for safety/order, but an *individual* crossing an *empty* street doesn't break the system's function. Weak obligation.
      *   **Result:** She tips strongly; you cross freely.

  4.  **Signaling Endorsement:** Following a custom implies you agree with it morally.
      *   **Plausible?** Debatable. Action ≠ endorsement (e.g., paying taxes to a gov't you dislike).
      *   **Tipping (US):** *Obligation?* Her argument: Tipping signals support for the system. *If* she finds it exploitative, she might refuse (no obligation).
      *   **Jaywalking (Germany):** *Obligation?* Waiting signals support for order/rules. *If* you find it pointless, you might cross (no obligation).
      *   **Result:** Neither forced; both can refuse based on principle.

  5.  **Moral Duty Generator:** Local conventions *create* genuine moral obligations for visitors.
      *   **Plausible?** Controversial/Weak. Why should local practice *create* morality? (e.g., wouldn't force following unjust local laws).
      *   **Tipping/Jaywalking:** *Obligation?* If accepted, both would be equally obligatory. But premise is shaky.
      *   **Result:** Both forced equally (but reading is least plausible).

  **The Principled Distinction (Using Readings 2 & 3):**

  *   **Her Tipping Obligation (US):** High under **Courtesy** (avoiding offense to servers/locals) and **System Reliance** (participating in the wage system servers depend on). Her protest doesn't change the server's immediate need or the cultural expectation she benefits from as a diner.
  *   **Your Jaywalking Freedom (Germany):** Low obligation on an *empty* street under **Courtesy** (no one offended), **Practicality** (low risk), and **System Reliance** (no systemic harm done). The rule's *general* purpose (safety/order) isn't undermined by a rare, safe, individual act.

  **Conclusion:** You **can** consistently argue she owes the tip (based on courtesy and reliance on the system for workers' pay) while you can jaywalk the empty street (minimal courtesy breach, no systemic harm). Her protest targets the *system*, but withholding tips primarily *harms the worker* within that system, not the employer. "When in Rome" works best as practical courtesy and system participation, not blanket endorsement or creating new moral duties. Bite the bullet on the *system's* flaws, but tip the worker.
