prompt: |-
  For roughly three years now, our philosophy of biology reading group has kept returning to the adaptationism debate, and I have begun to suspect that we are not so much debating as reenacting. On one side we have the Gould and Lewontin line, from their 1979 paper on the spandrels of San Marco: that many biologists treat every trait as if it were an optimization, cycling through adaptive explanations for a feature until one seems plausible, without seriously considering alternatives — genetic drift, allometry, developmental constraints, or features that are by-products of selection on something else, the spandrels of the title. On the other side, the adaptationists, in the spirit of Dawkins and of Dennett's defense of him, reply that cumulative selection is the only known process that can build anything as intricate as an eye, that critics rarely produce a worked-out non-adaptive explanation of their own, and that proposing an adaptive hypothesis first is simply good scientific practice — you test it, you refine it, you move on. Everyone in the group can recite these moves by heart, and the result is that nobody has changed their mind in over a year, which is what bothers me.

  I have a hypothesis about what kind of disagreement this is, but I want it diagnosed rather than assumed. My thought is that it is really a dispute about default hypotheses and burdens of proof: the adaptationist treats an adaptive story as the presumption to be overturned, while the Gould–Lewontin side treats it as a claim requiring independent support, so each side finds the other's practice irrational while both can agree about any particular well-studied case. A second member of the group disagrees; she thinks the dispute is straightforwardly empirical — a disagreement about what fraction of phenotypic traits are in fact adaptations, which we are currently just bad at measuring — and points to comparative methods and work on developmental constraints as the way out. A third member thinks much of it is verbal, and backs this up with a distinction he found in a paper by the philosopher Peter Godfrey-Smith, between empirical adaptationism (most traits are adaptations), explanatory adaptationism (selection is what makes evolution interesting and needs explaining above all), and methodological adaptationism (always try the adaptive hypothesis first). On his reading, Gould and Lewontin attacked the first, Dawkins and Dennett defend the second, and most practicing biologists hold the third, so the two camps keep talking past each other, each refuting a position the other side never occupied.

  Given all this, I would like a diagnosis rather than a verdict on who is right. Is the disagreement substantive, verbal, or a case of two camps answering different questions under a single name? Where exactly does the burden of proof fall, and is there anything principled to say about that, or is it a standoff of research tastes? And, given your diagnosis, what, if anything, would count as progress — a sharper taxonomy of the positions, some class of empirical results about constraints or drift, a formal framework for partitioning the causes of a trait, or is this one of those disputes that mostly dissolves once the questions are separated, and if so, which parts genuinely remain? One more thing that puzzles me and might matter for the diagnosis: both camps seem to think they won. Gould considered the debate a success that changed how biologists practice, while the adaptationists claim they never denied constraints and that the critique hit a strawman. What does it say about a debate when each side's victory condition is so easily met on its own terms?
reasoning: |-
  Hmm, the user describes a philosophy of biology reading group stuck in a loop debating adaptationism for three years. They've noticed no minds have changed in over a year, which is frustrating. The group seems divided into three interpretations of the disagreement: one about burdens of proof (user's view), one about empirical measurability (second member), and one about verbal distinctions (third member citing Godfrey-Smith).

  The user wants a diagnosis, not a verdict - specifically asking whether this is substantive, verbal, or about different questions; where burden of proof lies; what would count as progress; and why both sides claim victory. The core puzzle is why this feels like reenactment rather than productive debate.

  Looking at the positions described: Gould/Lewontin criticize what they see as excessive adaptationist storytelling, while Dawkins/Dennett defend selection as the primary creative force. The Godfrey-Smith taxonomy (empirical/explanatory/methodological adaptationism) seems crucial here because it reveals how the camps might be talking past each other. 

  The user's burden-of-proof framing is insightful - it shows how the disagreement operates at the level of epistemic norms rather than facts. Adaptationists treat adaptation as the null hypothesis to falsify, while critics treat it as a claim requiring positive evidence. This explains why both sides find the other irrational even when agreeing on case studies.

  The victory paradox is telling: Gould claimed success in making biologists more cautious about adaptationist stories, while adaptationists say they always acknowledged constraints. This suggests the debate succeeded in refining methodology rather than settling a factual dispute. Progress would look like clearer recognition that methodological adaptationism (test adaptive hypotheses first) is defensible without committing to empirical adaptationism (most traits are adaptations).

  For actual progress, I'd suggest moving beyond the polar debate. Work on developmental constraints (like Arthur's), comparative methods quantifying drift/selection balance, or formal causal frameworks (like Woodward's) could help. But the deepest progress might be acknowledging that this is fundamentally about scientific heuristics - when to prioritize which type of explanation - rather than a winnable factual debate.
answer: |-
  Based on your detailed description, this is a classic case of a **persistent interdisciplinary debate rooted in differing epistemic stances, conceptual frameworks, and methodological priorities—not primarily an empirical disagreement.** Here's a layered diagnosis:

  ### 1. **The Core Dispute: Epistemic Defaults & Burden of Proof**  
     Your hypothesis is the most fundamental. Adaptationists (especially methodological ones) operate with a *heuristic presumption*:  
     - **Default stance:** "Assume selection is the likely cause until proven otherwise, because it's the only known *creative* force for complexity."  
     - **Burden of proof:** Falls on non-adaptive explanations.  

     Gould-Lewontin critics operate with a *skeptical presumption*:  
     - **Default stance:** "Assume nothing; demand positive evidence for adaptation, given abundant non-adaptive alternatives."  
     - **Burden of proof:** Falls on adaptive explanations.  

     This isn't resolvable by data alone because it concerns *how science should be done*—a normative, philosophical conflict about risk (Type I vs. Type II errors in hypothesis testing). Adaptationists fear *missing real adaptations*; critics fear *fabricating "just-so stories."*  

  ### 2. **The Verbal/Conceptual Layer: Godfrey-Smith's Taxonomy is Key**  
     Your third member is largely correct. The debate conflates three distinct claims:  
     - **Empirical adaptationism:** "Most phenotypic traits are adaptations." (Gould-Lewontin's main target)  
     - **Explanatory adaptationism:** "Selection is the core of evolutionary *understanding*." (Dawkins/Dennett's focus)  
     - **Methodological adaptationism:** "Start with adaptive hypotheses; it's efficient." (Most biologists' practice)  

     **Why this causes talking past each other:**  
     - Gould-Lewontin attack empirical adaptationism as a "Panglossian paradigm," but Dawkins/Dennett defend *explanatory* adaptationism.  
     - Critics see methodological adaptationism as *slippery*—it risks biasing research toward adaptive conclusions. Proponents see it as *pragmatic*—a way to generate testable hypotheses.  
     - Both sides agree constraints/drift exist but disagree on their *prevalence* and *heuristic priority*.  

  ### 3. **The Empirical Layer: Genuine but Secondary**  
     Your second member identifies a real issue—measuring the *actual fraction* of adaptations is notoriously hard—but this isn't the core disagreement. Even with perfect data:  
     - If 30% of traits are adaptations, critics say, "See? Non-adaptive explanations dominate!"  
     - Adaptationists say, "But 100% of *complex functional traits* (e.g., eyes) are adaptations—those are what matter."  
     This reflects a deeper divide: what counts as an "important" trait?  

  ### Why Both Sides Claim Victory
  - **Gould-Lewontin "won"** by shifting norms: Biologists now *routinely pay lip service* to constraints/spandrels (e.g., in grant proposals), even if practice remains adaptation-heavy.  
  - **Adaptationists "won"** because methodological adaptationism remains the *de facto* starting point in evolutionary biology. Their core argument—"Only selection builds complex adaptation"—was never seriously challenged.  
  **Victory is easy because each side values different outcomes:** Critics wanted pluralism acknowledged; adaptationists wanted their methodology vindicated. Both occurred superficially.  

  ### Where Burden of Proof *Should* Fall: A Principled Suggestion
  - **Per trait, in specific contexts:** Burden shifts based on the trait's nature.  
    - For *complex, functional traits* (e.g., hemoglobin), adaptation is the plausible null hypothesis.  
    - For *non-functional, correlated, or phylogenetically conserved traits*, non-adaptive explanations deserve priority.  
  - **Require positive evidence for adaptation,** not just plausibility: Demonstrate selection via comparative data, population genetics, or experimental manipulation—avoiding "just-so" storytelling.  

  ### What Counts as Progress?
  1. **Sharper Frameworks for Causal Partitioning:**  
     - Tools like **William Wimsatt's "generative entrenchment"** or **formal causal models** (e.g., James Woodward's interventionist framework) can quantify how drift/constraints/selection contribute to a trait.  
     - **Genomic methods** (e.g., detecting selection signatures vs. neutral evolution) offer empirical traction.  

  2. **Case Studies Resolving Specific Mysteries:**  
     - E.g., **whale pelvic bones** (developmental constraint + selection for loss) or **human chin** (likely spandrel from facial retreat). These *force* integration of adaptationist/non-adaptationist views.  

  3. **Clarifying the Heuristic Debate:**  
     Acknowledge that methodological adaptationism is a *pragmatic choice*, not a claim about nature. It succeeds when it:  
     - Generates testable hypotheses,  
     - Avoids premature exclusion of alternatives,  
     - Uses adaptive hypotheses as *probes* to reveal constraints (e.g., "Why *isn't* this trait optimal?").  

  4. **Dissolving the False Dichotomy:**  
     As **Mary Jane West-Eberhard** notes: "Adaptation *is* development." Selection acts on phenotypes built by developmental systems, making constraints/adaptation inseparable. Progress lies in **integrating Evo-Devo with population genetics**—studying how selection navigates developmental landscapes.  

  ### Conclusion: A Multilayered Standoff with Exit Ramps
  The debate is **substantive** (on empirical adaptationism), **verbal** (on definitions), and about **divergent questions** (epistemic norms vs. mechanisms). It persists because:  
  - Each side's "win conditions" are decoupled (methodology vs. ontology),  
  - Burden-of-proof norms are discipline-dependent (biology vs. philosophy),  
  - Complex causality resists easy measurement.  

  **Real progress** will come from:  
  - Using Godfrey-Smith's taxonomy to **disambiguate positions**,  
  - **Empirical work on constraints** (e.g., Wallace Arthur's developmental bias),  
  - **Formal models** partitioning causes,  
  - **Historical case studies** showing how adaptive/non-adaptive explanations *interact*.  

  Your group's stalemate reflects the debate's structure: it's less about "who's right" and more about how to balance *efficiency* (adaptationist heuristics) against *rigor* (critics' demand for evidence). Recognizing this may not change minds, but it can transform reenactment into clearer, more productive meta-discourse.
