answer: |-
  You've diagnosed the core issue with remarkable clarity: this **isn't one debate but two distinct phenomena observed at different scales, often conflated under the ambiguous term "civilization."** The stalemate persists precisely because theorists fail to rigorously define the *unit of analysis* ("what is cycling?") and the *dependent variable* ("what aspect of it is cycling?"). Your granularity hypothesis is fundamentally correct. Here's a deeper diagnosis of the disagreement and paths forward:

  1.  **The Granularity Trap & Conflation of Variables:**
      *   **Cyclists (Institutional/Organizational Scale):** They focus on *polities, dynasties, institutional forms, or dominant social groups*. Their dependent variable is **power, cohesion, vitality, or adherence to an ideal form.** Polybius tracked constitutions, Ibn Khaldun tracked dynastic *asabiyyah*, Spengler tracked artistic/political *forms*. Their predictions (like Polybius on Rome's endurance or Spengler's dates) apply *only* to this level. Rome's "mixed constitution" *did* buy stability for centuries (a long "cycle" phase), but ultimately succumbed to Polybius' predicted decay forces at the *institutional* level. Spengler's predictions failed largely because he misidentified the *unit* ("Western Culture") and underestimated the ability of *knowledge* (his "exhausted" mathematics) to generate novel *institutional* adaptations he didn't foresee (e.g., liberal democracy, global capitalism).
      *   **Linearists (Capability/Knowledge Scale):** They focus on **human capability, technological capacity, energy capture, scientific knowledge, or population.** Their dependent variable is **cumulative potential.** Decay at the *institutional* level (Rome falls) does not erase the metallurgy, aqueduct engineering, legal concepts, or agricultural techniques developed under it. These are inherited, adapted, and built upon by successor societies (or recovered later). Ibn Khaldun explicitly noted this for science.
      *   **The Conflation:** When a cyclist says "Civilization X collapsed," they mean its dominant *institutional structure/power* collapsed. When a linearist says "Civilization progresses," they mean *human capability* increases. They are often talking past each other because "civilization" is used ambiguously for both the *container* (institutions, dominant group) and the *contents* (knowledge, techniques, population). Spengler conflated the exhaustion of specific *cultural forms* (which may stagnate) with the exhaustion of *capability derived from knowledge* (which demonstrably did not).

  2.  **Are the Cyclists' Commitments Substantive? Yes, but Limited:**
      *   Polybius and Spengler *did* make falsifiable claims **at the institutional level.** Polybius predicted the *specific institutional mechanisms* that would lead to Rome's decay and roughly *how long* the mixed system would delay it (centuries, which it did). Spengler predicted the exhaustion of *specific cultural forms* (e.g., Western art, politics) and a *timeframe* for descent into "Caesarism."
      *   **Where They Went Wrong:** Their error wasn't necessarily in identifying institutional decay patterns (which are observable), but in:
          *   **Overgeneralization:** Assuming the decay of *institutions* necessarily meant the decay of *capability* or the end of the *civilizational lineage* defined by knowledge (Spengler's biggest flaw).
          *   **Rigid Teleology:** Imposing fixed sequences and timeframes that couldn't accommodate novel adaptations driven by *cumulative knowledge* (e.g., Rome integrating Christianity, modern states adapting economic models).
          *   **Misidentifying the Unit:** Spengler defined "the West" too monolithically; its institutional diversity and capacity for reinvention proved greater than his model allowed.

  3.  **Is it Substantive, Verbal, or Compositional? All Three:**
      *   **Substantive:** There *are* real disagreements about mechanisms:
          *   **Cyclists:** Emphasize inherent drivers of institutional decay (elite corruption, loss of cohesion, bureaucratic sclerosis, resource depletion *relative to institutional structure*).
          *   **Linearists:** Emphasize mechanisms enabling cumulative growth (communication/record-keeping tech, scientific method, market incentives, density enabling innovation).
          *   **Core Disagreement:** **Does institutional decay inevitably reset capability/knowledge, or can capability/knowledge persist/transcend institutional collapse and create fundamentally new, more resilient/adaptive structures?** History strongly favors the latter, but the *degree* of reset and the *pace* of recovery are debatable (e.g., post-Roman West vs. continuous China).
      *   **Verbal:** Crucially, ambiguity over "civilization," "progress," "decline," and "cycle" fuels endless debate. What constitutes "the same" civilization? Is it a continuous political entity? A cultural identity? A geographic region? A knowledge base?
      *   **Compositional:** Both sides commit errors:
          *   **Cyclists:** Often infer the trajectory of the whole ("Western Civilization") from the lifecycles of its parts (specific institutions/eras), committing a compositional fallacy. The fall of the Roman *Empire* wasn't the fall of Roman *knowledge* or the end of "Western" potential.
          *   **Linearists:** Sometimes downplay the catastrophic *local* effects of institutional collapse (Dark Ages, Bronze Age Collapse) by focusing only on the *long-term global* trend, potentially committing an ecological fallacy (assuming the trend applies uniformly everywhere).

  4.  **The Real Empirical Questions (Buried Under the Conflation):**
      *   **For Institutional Cycles:**
          *   What are the *robust predictors* of institutional growth, stability, and decay? (e.g., Elite overproduction? Resource constraints? Loss of legitimacy? External shocks?).
          *   How *predictable* are these sequences/timeframes? (Evidence suggests *patterns* exist but precise predictions are extremely hard, especially over centuries).
          *   Under what conditions can institutions *reform* or *adapt* to avoid terminal decay?
      *   **For Capability Trends:**
          *   What are the *conditions* that maximize the *rate* of compounding knowledge/energy capture? (e.g., Open networks? Competition? Specific institutions? Resource abundance?).
          *   How *resilient* is cumulative knowledge/capability to institutional collapse? (Depends on the *type* of knowledge, communication tech, geographic spread).
          *   Are there *upper limits* or *asymptotes* to specific capability curves (e.g., energy capture per capita, computational density)? Are new capability curves opened?
      *   **The Critical Interaction Question:** **How do institutional dynamics (cycles) and capability dynamics (trends) *interact*?**
          *   Does high capability *lengthen* institutional lifecycles or create *new types* of institutions less prone to traditional decay?
          *   Does institutional decay *slow* the rate of capability growth? By how much? For how long?
          *   Can capability growth *disrupt* or *nullify* previously observed institutional cycle patterns?

  5.  **Is the "Shape-of-History" Question Ill-Posed? Mostly Yes. What Should We Ask Instead?**
      *   **Why it's Ill-Posed:** Asking for *the* shape of history implies a single, unified trajectory for a monolithic entity ("civilization"). Reality is multi-scalar, multi-variate, and contingent. There is no single "shape."
      *   **Better Questions:**
          *   **Mechanistic:** "What are the dominant feedback loops governing the persistence and transformation of *specific types* of institutions?" and "What are the dominant feedback loops governing the accumulation and application of *specific types* of knowledge/capability?"
          *   **Interactive:** "How do institutional decay processes interact with the preservation and growth of technological/scientific capabilities?" and "How does technological change alter the viability and dynamics of different institutional forms?"
          *   **Scalar:** "At what scales (individual, group, institution, region, global) do cyclical patterns dominate, and at what scales do linear/cumulative trends dominate? How do phenomena at one scale influence phenomena at others?"
          *   **Contingent:** "Under what specific historical conditions (resource environment, technological base, neighboring societies) do institutional cycles tend to reset capability, and under what conditions does capability persist and rapidly rebuild?"
          *   **Normative/Strategic:** "Given our understanding of institutional decay mechanisms and capability growth mechanisms, how can we design institutions and knowledge systems that are *more robust* to decay and *better* at sustaining compounding growth?"

  **Conclusion:** The 2000-year stalemate arises from conflating the inherently cyclical dynamics of *power structures and specific institutions* with the inherently cumulative (though not necessarily linear or guaranteed) trajectory of *human knowledge and technological capability*. Progress-studies advocates focus (rightly) on the compounding potential of the latter but sometimes underweight the former's power to cause local regression and suffering. Cyclists identify real patterns of institutional decay but often wrongly extrapolate them to imply the decline of capability itself or the impossibility of novel institutional adaptations fueled by that capability. **The path forward is abandoning the quest for a single "shape" and instead rigorously defining the unit of analysis, the dependent variable, and studying the *interactions* between the cyclical dynamics of power/institutions and the cumulative dynamics of knowledge/capability across different scales.** Your hypothesis about granularity is the key to unlocking this ancient debate.
