prompt: |-
  I'm doing a lunch-and-learn at work (25 min, whiteboard, audience is mostly backend engineers, zero philosophy background) on the color phi phenomenon and the Orwellian vs Stalinesque interpretation of it. Don't explain the stuff to me -- plan how I should present it. Specifically: what has to be established first before the Orwell/Stalin question even makes sense to them (I'm guessing they need to accept that the brain is generating the motion rather than just reporting it, but you tell me), whether the classic two-lights-switching-colors demo is actually the right carrying example or if there's a better one for people who think in terms of event logs and frame buffers, the misconceptions they'll form in the order they'll form them -- I expect "consciousness just runs with a lag, like a display pipeline" and "so the brain is just lying to us, nothing is real" but there are probably worse ones -- and where in the sequence I should kill each one. Also tell me what to openly refuse to get into at this level (I'm assuming Dennett's whole multiple drafts thing is too much?), and give me one question to end on that would show they actually got the puzzle rather than just finding it neat.
