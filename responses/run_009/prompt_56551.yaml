answer: |-
  Here is the complete exam package meeting all your specifications:

  **Exam Question (152 words):**

  > **Question:** Marisol is sixty-eight. Next Tuesday an aneurysm will rupture, and she will die instantly and painlessly. In the nearest world in which she does not die then — the surgical team intervenes — she lives eight more years: seven of them dominated by a degenerative illness she experiences as unrelieved misery, containing exactly one thing she values, a single afternoon, three years in, when her estranged son visits and they reconcile. By any reasonable aggregation the eight years are much worse for her than nothing; the afternoon is, by her own lights, worth a great deal; and there is no nearby world in which she lives longer or better. Assess whether Marisol's death is bad for her. Your argument must:
  > 1.  Engage the comparative structure of the deprivation account: if death is bad only when it deprives one of a net-better life, what verdict does it yield here? Does the one good afternoon change this?
  > 2.  Address the timing problem: if her death is bad (or good) *for her*, at what time is it so? Defend your chosen timing against its inherent difficulties.
  > 3.  Evaluate the "antemortem harm" proposal: does it resolve the timing problem for whichever verdict you reach, or merely relocate the problem?

  **Model Answer (approx. 600 words):**

  Marisol's death presents a profound challenge to the standard deprivation account of death's badness. This account holds that death is bad for an individual only if, and because, it deprives them of a future life containing greater net well-being than they would otherwise have. Applying this strictly to Marisol, the verdict is clear: the eight-year life she would have lived is, by reasonable aggregation, "much worse for her than nothing." Therefore, death *prevents* her from experiencing significant net harm. According to the deprivation account's core logic, her death is *good* for her, not bad. It saves her from misery.

  The single valuable afternoon complicates the picture emotionally but not fundamentally for the deprivation calculus. While the reconciliation is intensely meaningful *to Marisol*, it is still a finite positive event embedded within an overwhelmingly negative eight-year period. Aggregated across the whole future life, the net balance remains deeply negative. The deprivation account, focused on net totals, cannot easily elevate this one good to outweigh the immense bad, making the death good overall. It might change the *story* we tell about the tragedy of the missed reconciliation, but not the net deprivation *result*. The deprivation account seems committed to the counterintuitive conclusion that Marisol's death is beneficial.

  This leads directly to the timing problem. If her death is (beneficially) bad *for her* – meaning it prevents harm – *when* does this badness (or goodness) obtain? She doesn't exist before death to experience its "goodness" prospectively. She doesn't exist after death to experience it retrospectively. During her life before Tuesday, she is not yet dead, so the death itself cannot harm her *then*. Claiming it is bad "at no time" seems to deny the deprivation account's core claim that death *is* bad (or good) *for the person*. Claiming it is bad "at all times" is metaphysically dubious, loading all non-existent entities with properties eternally. The most plausible candidate might be that it is bad (or good) *at the time it occurs* (Tuesday). But this faces the problem that *at that time*, Marisol ceases to exist. Can non-existence at time T possess the property of being good *for someone* at T? This is deeply problematic.

  The "antemortem harm" proposal suggests that the misfortune lies with the *living* Marisol before Tuesday. Her interest in future goods (like reconciliation) is set back by the impending death, or the death itself constitutes a setback occurring while she lives. Applying this here: if we concluded death was *bad* (e.g., because we prioritized the missed reconciliation), the setback occurred antemortem. However, if we concluded death was *good* (as the deprivation account suggests), the living Marisol suffered *no setback* regarding her future misery – death *benefits* her antemortem interest in avoiding suffering. Crucially, *in both cases*, the timing problem is relocated, not solved. *When* exactly during her life was Marisol's interest in reconciliation set back by an event (death) that hadn't happened yet? Did she suffer a continuous setback from birth? Did it suddenly occur Tuesday morning? And crucially, *she never knew about it*. Explaining how an unknown, future event constituted an actual setback *at a specific past time* for the living person remains elusive. The problem shifts from the timing of the death's badness to the timing of the unnoticed setback.

  Therefore, while the antemortem move offers a subject for the harm (the living person), it fails to provide a clear, non-mysterious account of *when* that harm occurred, especially given its imperceptibility. Marisol's case starkly exposes the deprivation account's counterintuitive implications in net-negative futures and the persistent metaphysical puzzle of timing that both the standard and antemortem approaches struggle to resolve satisfactorily.

  **Marking Scheme (25 Marks Total):**

  1.  **Deprivation Account Applied to Case (6 marks):** Must clearly state that the deprivation account implies death is *good* for Marisol (prevents net harm), and explain why the one good afternoon doesn't change the net balance verdict. *Common Botch:* Arguing death is bad *because* of the missed afternoon without addressing the net negative life.
  2.  **Analysis of the Afternoon's Role (4 marks):** Must distinguish the afternoon's intrinsic value from its impact (or lack thereof) on the net deprivation calculation. *Common Botch:* Simply stating the afternoon is valuable without analyzing its relation to the deprivation calculus.
  3.  **Timing Problem Engaged (5 marks):** Must identify the problem, reject "never" and "always" as unworkable for the deprivation account, and seriously grapple with the difficulty of assigning a time (e.g., at death). *Common Botch:* Briefly mentioning the problem without exploring specific candidate times and their flaws.
  4.  **Antemortem Proposal Evaluated (6 marks):** Must explain how the proposal relocates the harm/benefit to the living Marisol AND argue that this *relocates* the timing problem (when did the setback occur?) rather than solving it, emphasizing the issue of imperceptibility. *Common Botch:* Simply describing the antemortem move without critiquing its failure to resolve the core timing issue.
  5.  **Overall Coherence & Synthesis (4 marks):** Logical flow, clear connection between the three parts, precise use of the case details. *Common Botch:* Treating the three confrontations as isolated points without showing their interconnection in analyzing the case.

  **Closing Note (A vs. B Differentiation):**

  The **A** answer will explicitly recognize and articulate that the antemortem proposal's core failure lies in its inability to pinpoint **when the imperceptible setback to the living Marisol's interests concretely occurred**, demonstrating that this merely **shifts the metaphysical burden** of the timing problem rather than resolving it. The **B** answer, while competently describing the antemortem move and noting it relocates the harm, will lack this specific critical insight into *why* the relocation fails – namely, the intractability of assigning a definite *time* to an unnoticed interest-setback related to a future event. The A answer sees the relocation as fundamentally *unsuccessful* for solving the problem; the B answer sees it as merely a *different* perspective.
