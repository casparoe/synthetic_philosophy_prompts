prompt: |-
  I'm presenting at a workshop on self-determination, and I want a prep sheet for the Q&A. Here's my position, which I'll call the reciprocity view of secession: a region's claim to secede isn't primarily about suffering injustice, and it isn't automatic either — it's conditional on the seceding region credibly extending the same self-determination downward to its own minorities. The principle is recursive: Quebec leaving Canada would have to accept in principle that the Cree or Anglophone Montreal could leave Quebec; an independent Scotland would owe the same to Shetland or Orkney if they genuinely wanted out; an independent Catalonia the same to the Vall d'Aran. The test for statehood isn't wealth or past grievance, it's whether the new state accepts that the norm it's invoking doesn't stop at its own border. If it won't accept that, I claim its appeal to self-determination was really an appeal to self-aggrandizement.

  The audience: mostly remedial-right theorists in the Buchanan mold, who think secession is justified only as a remedy for serious injustice — a few of them are quite sharp and know the literature cold. Plus two Catalan nationalists who will be sympathetic to secession but might not love the recursive part, and one grouchy realist who thinks the whole normative framework is window dressing for power politics.

  Give me the objections in roughly the order they'll arrive, phrased the way that audience would actually phrase them, each with a short suggested reply, a note on what I should concede up front vs. hold firm on, and the single weakest point in my own view that I should prepare to defend rather than hope nobody notices. Also include the question I'm praying doesn't get asked, and tell me why it's dangerous.

  One more thing: you're predicting the behavior of an audience you've never met, so be upfront about how confident you are in each prediction — label each objection as a near-certain, likely, or a guess — and explicitly single out the one you're least sure will actually come up. Don't hide the uncertainty, I'd rather know where the prep sheet is guesswork.

  Hard limit: 600 words for the whole thing. That's tight, I know, so cut cleverness before you cut content. And please double check you're under the cap — if you're at 640 I'm not reading past 600.
