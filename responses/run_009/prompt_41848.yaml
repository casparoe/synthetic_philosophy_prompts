answer: |-
  **Reciprocity View Q&A Prep Sheet**  
  *(Prediction confidence: ★ = near-certain, ★★ = likely, ★★★ = guess)*  

  ### Objections & Replies  
  1. **★ "You’re sidelining injustice! If Quebec suffered no tyranny, why permit secession at all?"**  
     *Reply:* "Injustice *enhances* claims but isn’t the *only* basis. My view prevents secessionists from becoming new oppressors."  
     *Concede:* Remedial secession has moral weight. *Hold firm:* Justice isn’t binary; preventing future injustice matters equally.  

  2. **★ "Recursion is utopian. If Montreal could secede, wouldn’t every neighborhood demand independence?"**  
     *Reply:* "Thresholds apply (viability, clear democratic will). Recursion sets a *principle*, not a veto on state function."  
     *Hold firm:* Without this, secession is hypocritical power consolidation.  

  3. **★★ (Catalan Nationalist) "Why must Catalonia grant vetoes to tiny regions? Vall d’Aran lacks our distinct identity!"**  
     *Reply:* "If identity justifies your exit, denying others’ self-determination undercuts your moral claim. Size ≠ moral relevance."  
     *Concede:* Practical thresholds exist. *Hold firm:* Refusing *any* exit right exposes hypocrisy.  

  4. **★★★ "This enables destabilization. Hostile actors could exploit minority exit votes to sabotage new states!"**  
     *Reply:* "Existing states face similar subversion risks. The test is *credible commitment* to norms, not immunity to bad actors."  
     *Hold firm:* States claiming legitimacy must accept inherent vulnerabilities of consent-based rule.  

  5. **★★ (Realist) "Norms are irrelevant! Secession succeeds through power—military strength, diplomatic recognition. Your ‘test’ is poetry."**  
     *Reply:* "Agree power matters. But legitimizing narratives *shape* recognition and alliances. My view denies legitimacy to ethno-states."  
     *Concede:* Power constrains ideals. *Hold firm:* Norms influence which powers succeed long-term.  

  ---

  ### Your Weakest Point (Prep This!)  
  **Enforcement:** *"What if Quebec secedes, then ignores Cree exit rights? Who enforces reciprocity?"*  
  *Defense:* Admit no perfect mechanism. Stress that:  
  - International recognition *should* require pre-commitment to recursion (e.g., constitutional clauses).  
  - Violations invalidate the moral basis for independence, enabling sanctions/non-recognition.  

  ### The Dangerous Unasked Question  
  **"Doesn’t recursion justify infinite fragmentation until we hit atomized individuals?"**  
  *Why dangerous:* Forces you to admit recursion has practical limits (e.g., viability thresholds), which may seem ad hoc. *Reply:* "Self-determination applies to *peoples*—groups with shared governance capacity—not arbitrary units. Reciprocity checks nationalism but doesn’t dissolve statehood."  

  ### Least Confident Prediction  
  Objection #4 (sabotage via minority exit) ★★★—*may not arise*, but realists could pivot here if pressed.  

