  ### Step 1: Underlying Ethical Rules Fitting His Past Responses
  His pattern of responses is consistent with two major ethical frameworks that often overlap but can be distinguished in edge cases: the **doctrine of double effect (DDE)** and the **threat redirection principle**. Both rules generally align with his verdicts, but they diverge in how they handle certain scenarios, like the new crane cases. Here's how each rule explains his past decisions:

