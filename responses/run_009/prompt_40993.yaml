    - The harm is not intended but merely foreseen as a side effect.
    - The good outcome isn't achieved *by* the harm (i.e., the harm isn't used as a means to the end).
    - The good outweighs the bad (proportionality).

    Applied to his past cases:
    - **Bystander switch (fine)**: Turning the trolley is a neutral act; the one person's death is a foreseen side effect of redirecting the threat, not intended as a means (since the buffer stops the trolley, not the person).
    - **Loop (fine)**: Similar to bystander—redirecting the trolley is the act, and the death is foreseen but not intended (even though the body stops the trolley, the *means* is redirection, not the killing).
    - **Footbridge (not fine)**: Pushing the person directly intends their death as a means to stop the trolley.
    - **Shoving a bystander (not fine)**: Same as footbridge—intending death as a means.
    - **Surgeon case (not fine)**: Intending death as a means to harvest organs.

    DDE fits all his verdicts because it distinguishes between harming as a side effect (permissible) and harming as a means (impermissible). The loop case is key here—he accepted it, which suggests he sees the death as unintended (even if necessary), aligning with a common DDE interpretation.

  - **Threat Redirection Principle**: This rule is more action-focused and less about intention: you may redirect an existing threat to minimize harm, but you may not initiate a new harmful process or use a person directly. It's often rooted in the idea that redirecting a threat doesn't create new moral responsibility for the harm, whereas initiating something new does.

    Applied to his past cases:
    - **Bystander switch (fine)**: Redirecting the trolley (an existing threat) to a different path.
    - **Loop (fine)**: Still redirecting the trolley, even though the body is used—it's a modification of the threat's path, not a new action.
    - **Footbridge (not fine)**: Pushing creates a new causal chain (e.g., you actively use force to kill someone).
    - **Shoving a bystander (not fine)**: Actively placing someone in harm's way initiates a new process.
    - **Surgeon case (not fine)**: No threat is being redirected; you're initiating harm from scratch.

    This rule also fits perfectly. The loop case works because the body's role is seen as incidental to the redirection—you're not "creating" the threat, just steering it.

  **Do these rules "collapse" into one?** In many cases, yes—they often yield the same verdicts because redirecting a threat typically involves foreseen but unintended harm (satisfying DDE), while initiating a new process often involves intended harm. However, they can diverge when harm is a foreseen side effect of an action that isn't threat redirection (like dropping a crate). That's where the new cases will help test them.

