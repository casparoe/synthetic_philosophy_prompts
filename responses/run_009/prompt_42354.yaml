prompt: |-
  I serve on the constitutional court of the Republic of Veldania, a young democracy, and I would like your recommendation on a case we must decide this term. Decide it from our own record rather than from the doctrine of any country you may know: what matters is consistency with ourselves.

  Our constitution is brief. It guarantees the vote and free expression outright, states equality before the law and personal liberty in general terms, and protects property only as statutes determine. In ten years the court has decided five constitutional cases:

  1. The Disenfranchisement Act (struck down). Parliament had barred anyone convicted of any criminal offense, however minor, from voting for life. Our judgment stressed that a legislature empowered to define away its critics' votes has closed the one channel through which its acts can be corrected.
  2. The Ballot Deposit Act (struck down). Deposits for new party registration were set so high that only the two established parties could field candidates. We held the scheme a barrier to political competition, not a mere regulation of it.
  3. The Fuel Price Decree (upheld). Wartime fuel rationing with price controls, challenged on liberty and property grounds. We held that economic policy belongs to Parliament, however mistaken we might privately find it.
  4. The Memory of the Fallen Act (upheld). Criminalizing public insult to the war dead. The majority held that core political debate was left essentially untouched; two dissents argued the statute was overbroad and easily aimed at unpopular speakers.
  5. The Day of Rest Act (upheld). A Sunday trading closure challenged by a Saturday-observing sect whose members, in practice, may rest on neither day. We held the burden incidental to a general secular law with a secular purpose. A concurrence added, pointedly, that the sect's members vote, organize freely, and sit in Parliament.

  The bench divides loosely into two camps that have voted together in all five cases. The self-described gatekeepers would intervene only when the majority has rigged the channels of political change or legislated against a group so despised that no electoral mechanism will ever correct the injury. The clear-mistake judges would strike down only what no reasonable legislator could have believed constitutional, leaving everything else to the voters.

  The new case concerns the Weavers: an endogamous group, roughly one percent of the population, descended from bonded laborers and stereotyped as thieves and cheats. After a fatal market fire was blamed, probably wrongly, on a Weaver's stall, Parliament enacted the Market Order Act, which denies street-trading licenses to members of historically itinerant communities, excluding the Weavers from their principal traditional occupation. The legislative debates were candid — several members said their constituents demanded it — and the only dissenting votes came from members whose districts contain too few Weavers for the matter to have electoral weight. A Weaver prosecuted for continuing to sell textiles has brought the challenge.

  Please do the following. Recommend the decision most consistent with our precedents, and identify the closest analog among our five cases, saying honestly whether it controls or is distinguishable. If our record underdetermines the answer, state what principle each available decision would commit us to going forward, and predict how each principle would dispose of two cases we are likely to see next: a facially neutral licensing scheme administered so that Weaver applications in practice always fail, and a ban on a proselytizing religion that is intensely unpopular but politically well organized. Finally, name the single future case that would most sharply reveal which principle we had actually adopted, and address one internal worry: if the gatekeepers distinguish the Day of Rest Act on the ground that its burden was incidental rather than targeted, does that distinction survive without their position collapsing into ordinary rights review — and if it does not survive, is the collapse something we should resist or accept?
reasoning: |-
  Okay, the user is a constitutional court judge in Veldania, presenting a complex case involving the Weavers and the Market Order Act. They've provided five precedents and two judicial philosophies within the court. The core task is to recommend a decision consistent with their existing jurisprudence, identify the closest analog among past cases, and address potential future implications.

  First, I need to analyze the Weavers' situation. They're a historically marginalized group, stereotyped as thieves, constituting only 1% of the population. The Market Order Act explicitly targets "historically itinerant communities," effectively barring Weavers from their traditional occupation. The legislative debate openly admitted this was due to constituent pressure, with dissent only from areas without Weaver populations. This looks like textbook discrimination against a politically powerless group.

  Looking at the precedents:
  - Case 1 (Disenfranchisement) and Case 2 (Ballot Deposit) both protected democratic channels
  - Case 3 (Fuel Rationing) showed deference on economic policy
  - Case 4 (War Memorial) upheld restrictions with dissent about overbreadth
  - Case 5 (Sunday Closure) allowed incidental burdens

  The closest analog is actually Case 5, but with critical differences. Both involve occupational burdens, but the Sunday law was neutral and incidental, while the Market Order Act directly targets a specific vulnerable group. This distinction is crucial - it's the difference between a general regulation and a bill of attainder-like measure.

  The gatekeeper philosophy would clearly intervene here, as Weavers lack electoral recourse. The clear-mistake test might awkwardly uphold it since legislators could argue it's "public safety." But that would create dangerous precedent - allowing targeted exclusion of unpopular minorities under pretextual grounds.

  For future cases:
  1) A facially neutral licensing scheme that discriminates in practice against Weavers would likely be struck down under gatekeeper logic (rigged system), but might survive clear-mistake review if administrators provide any plausible justification.
  2) Banning an unpopular but organized religion: gatekeepers might uphold (since they can fight back electorally), while clear-mistake judges would strike down as unreasonable.

  The real test case would be something like: "A law banning all political donations from industries dominated by Weaver owners." This would force the court to decide whether economic exclusion constitutes political silencing.

  Regarding the Day of Rest distinction - if gatekeepers can't maintain the "incidental vs targeted" difference without collapsing into rights review, perhaps that's necessary. Their framework already implies protecting groups who can't protect themselves through normal politics - which is ultimately about fundamental rights against systemic exclusion.

  The recommendation must be to strike down the Act. The legislative record shows pure prejudice, targeting a group without political power to fight back, permanently excluding them from livelihood. This violates the equality and liberty guarantees by rigging the system against them - exactly what Case 1 and 2 prevented, just through economic rather than electoral means. Upholding this would make equality promises meaningless for discrete insular minorities.
answer: |-
  Based solely on Veldania's constitutional text and precedents, I recommend **striking down the Market Order Act as unconstitutional**. Here's the analysis:

  **Closest Analog:** *The Disenfranchisement Act (Case 1)*. It controls the outcome, with limited distinguishability.

  *   **Why it Controls:** Both cases involve legislation targeting a specific, identifiable group perceived as undesirable, permanently closing a fundamental avenue of participation in society (voting in Case 1, economic livelihood/occupation for the Weavers here). The core rationale of Case 1 applies: Parliament has "defined away" the Weavers' ability to participate economically in their traditional way, enacted by a majority targeting a group lacking the political power to achieve "correction" through electoral means. The legislative candor ("constituents demanded it") and the pattern of dissent confirm the Weavers' political impotence.
  *   **Distinguishability (Weak):** One *could* argue the Disenfranchisement Act targeted a *political* right (vote), while the Market Order Act targets an *economic* right (occupation). However:
      *   The constitution protects property only "as statutes determine," implying lesser protection for pure economic regulation.
      *   **Counter:** The Weavers' exclusion isn't incidental economic regulation; it's a *status-based denial* tied to ancestry and stereotype, akin to a civil disability. Case 1's logic about rigging "channels of... correction" extends beyond the purely political vote to the foundational economic means that enable group survival and potential political mobilization. Case 5 implicitly recognized this distinction between general regulation and targeted disability.

  *Day of Rest Act (Case 5)* is **distinguishable**, not controlling. Case 5 involved a *general*, *secular* law applying to all (Sunday closure) that incidentally burdened a specific religious practice. The burden was incidental, not targeted. The Market Order Act is *specifically targeted* at "historically itinerant communities" (a clear proxy for the Weavers) based on their status. The purpose and effect are discriminatory exclusion, not neutral regulation. The concurrence in Case 5 highlighted the sect's political power (voting, organizing, sitting in Parliament) – power the Weavers demonstrably lack.

  **Underdetermination & Future Principles:**

  Our record *does* underdetermine the outcome slightly, as it hasn't squarely addressed status-based economic exclusion of a politically powerless group. Choosing between the gatekeeper and clear-mistake approaches here commits us to distinct paths:

  1.  **Gatekeeper Principle (Strike Down Here):** Intervention is warranted when legislation targets a discrete, insular, and politically powerless minority for a significant deprivation, effectively "rigging the system" against their ability to achieve future electoral remedy. This focuses on *political process failure* and *group vulnerability*.
      *   **Facially Neutral Discriminatory Licensing:** **Strike Down.** Rigged administration proves the process failure targeting the politically powerless Weavers.
      *   **Ban on Unpopular but Organized Religion:** **Uphold.** The group's political organization means the "channels of political change" remain open; electoral correction is possible. (This aligns with Case 5 concurrence's logic).

  2.  **Clear-Mistake Principle (Would Uphold Here):** Uphold unless no reasonable legislator could believe the law constitutional. Here, legislators could *reasonably* argue the Act addresses public safety concerns (post-fire panic) or "order" in markets, however pretextual or misguided. This defers heavily to Parliament on motive and necessity absent explicit constitutional prohibition.
      *   **Facially Neutral Discriminatory Licensing:** **Likely Uphold.** If administrators provide *any* plausible, non-discriminatory reason for denials (e.g., "space limitations," "aesthetic concerns"), it likely passes the low "reasonable belief" bar. Proving systemic bias to this standard is very difficult.
      *   **Ban on Unpopular but Organized Religion:** **Likely Strike Down.** Banning a core aspect of a religion (proselytizing) is a severe deprivation. Even with deference, most reasonable legislators would recognize this conflicts with free expression and equality guarantees. (This might align more with the *dissent* in Case 4).

  **The Sharpest Revealing Future Case:**  
  **"A law requiring a supermajority vote in any district with a Weaver population above 5% for approval of any new local public market."**

  *   **If Gatekeeper Principle:** **Strike Down.** This is a blatant attempt to rig the *local* political process against the Weavers, diminishing their electoral influence specifically concerning their core economic interest (market access). It confirms their status as targets of systemic exclusion.
  *   **If Clear-Mistake Principle:** **Likely Uphold.** Legislators could *reasonably* argue it ensures "broader community consensus" for significant local developments, a non-discriminatory purpose. The discriminatory impact might be seen as incidental, not requiring constitutional remedy.

  **Addressing the Internal Worry: The "Incidental vs. Targeted" Distinction**

  *   **The Worry:** If Gatekeepers distinguish *Day of Rest* (incidental burden) from this case (targeted burden), does this collapse into forbidden "ordinary rights review"? (i.e., judging the *substance* of the right or burden, not just process).
  *   **Analysis:**
      1.  **Distinction is Essential & Survivable:** The distinction is crucial and *can* survive without collapse *if* rigorously tied to the core gatekeeper rationale: **Is the burden a mechanism for locking a group out of the political process?** An *incidental* burden (like Sunday closing) doesn't inherently do this, especially if the group retains political power (Case 5 concurrence). A *targeted* burden imposed *because* of group identity on a group lacking political power *does* lock them out – it entrenches their disadvantage and removes a key avenue (economic participation) potentially necessary for future political mobilization. The focus remains on *process failure and group vulnerability*, not the abstract "right" to trade.
      2.  **Risk of Collapse & Why Resist:** The risk exists if "targeted burden" is defined too broadly (e.g., any law disproportionately affecting a group). However, the gatekeeper test requires *both* targeting *and* political powerlessness (*see Cases 1, 2, and implicitly 5*). **Resisting collapse is vital.** Accepting "ordinary rights review" would abandon Veldania's unique precedent-based doctrine, contradicting the clear deference shown in economic policy (Case 3) and the allowance of burdens like those in Cases 4 & 5. It would turn the court into a general rights tribunal, which the constitution's structure (brief text, specific property clause) and precedents (Case 3, Case 5) do not support. The gatekeeper theory is a *procedural* safeguard for democracy, not a substantive rights guarantee. The "targeted vs. incidental" distinction is the tool to maintain that focus on *democratic dysfunction*.

  **Conclusion:**  
  Striking down the Market Order Act is most consistent with *Disenfranchisement Act (Case 1)*. It applies the core gatekeeper principle: Parliament cannot use its power to permanently exclude a politically powerless, despised minority from fundamental participation in society (here, economic livelihood), thereby rigging the system against their ability to seek future democratic remedy. The *Day of Rest Act* is distinguishable because its burden was general and incidental, not targeted, and the burdened group retained political power. Adopting the gatekeeper principle here commits the court to intervening against facially neutral schemes rigged against powerless groups but upholding laws affecting groups with political recourse. The "incidental vs. targeted" distinction is necessary and sustainable within the gatekeeper framework, focusing on political lock-out rather than substantive rights, which must be preserved to maintain Veldania's unique constitutional balance.
