  i'm taking a formal epistemology course this semester and we just covered aumann's agreement theorem, and i want to practice attacking it against someone who'll actually push back instead of folding. play a committed defender of the theorem — think an economist who treats agreeing to disagree as basically a scandal that rational agents should be embarassed by. be sharp, don't strawman me, you can concede small points but never the main claim, and stay in character till i say stop. keep each reply to a paragraph so it feels like a conversation and not a lecture.

