  *Pausing to organize thoughts*... The desiderata fall into four buckets: (1) case coverage (non-negotiable for clinical utility), (2) conceptual distinctions (non-negotiable for coherence), (3) biological realities (non-negotiable unless we deny science), and (4) practical feasibility (negotiable if technology changes). 

  Ah—the frozen embryo case is particularly thorny. If we define death as "irreversible loss of organismal integration," embryos deliberately paused in development challenge that. They're not dead; they're in stasis. So the definition must account for potential reversibility under different conditions. 

  The big clash emerges: Paradigm cases rely on social/legal intuitions (e.g., "beating-heart corpses" feel dead), but biology has gradients. Brain death accepts ventilated digestion as irrelevant because the organism isn't integrated anymore. Yet DCD protocols declare death minutes after cardiac arrest—knowing ECMO *could* restart circulation—because permanence is treated as irreversibility in that context. That's not biologically rigorous; it's a pragmatic shortcut. 

  *Nodding*... So yes, the user's suspicion is correct. We can't have both perfect alignment with all paradigm cases *and* a crisp biological bright line. We sacrifice biological purity for clinical workability in DCD, and accept ventilated healing in brain death as not undermining the definition. The compromise is messy but necessary. 

  I should emphasize: The non-negotiables are covering standard cases, distinguishing dying/dead, respecting biology, and feasibility. The negotiable is whether we strictly require irreversibility (vs permanence) when tools like ECMO exist but aren't used. That's where camps fight. 

