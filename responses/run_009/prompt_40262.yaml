prompt: |-
  before i pick a side in the brain death vs circulatory death fight, i want the spec first: what does a definition of death actually have to deliver? fix the purpose as practical — deciding, at a bedside, that this human being has died, with organ transplantation in the background (the dead-donor rule says organs only come out of someone already dead). so write me the desiderata: which cases any definition must get right — it has to leave the ordinary heart-attack patient alive, it has to say something about the anencephalic infant, about the person declared dead 2-5 minutes after cardiac arrest in a donation-after-circulatory-death protocol even though ECMO could in principle restart them, about the brain-dead pregnant woman whose body gestates for weeks, and it can't come out saying a frozen embryo is dead just because nothing is functioning right now. which distinctions it has to respect — dying vs dead, and dead vs gone-for-good, which is where the whole irreversible vs merely permanent trouble lives. which facts it cant contradict: death spreads across cells and organs at different times, so there is no single moment when "the body" dies, and bodies on ventilators heal and digest. and which practical constraints bind it — determinable by clinicians within hours with current tools, not after a decade of observation, and usable enough that two hospitals don't classify the same patient differently. for each requirement, say why it's a requirement, and mark which are non-negotiable versus which are really just one camp's preference smuggled in as a demand. then the part i care most about: tell me if any subset of the desiderata is jointly unsatisfiable — i suspect "match the paradigm cases" and "be a bright-line biological fact" can't both be had, but check it. skip scoring the whole-brain, circulatory, and higher-brain definitions against the list, ill do that myself.
