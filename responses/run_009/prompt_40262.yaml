answer: |-
  Here’s a rigorous specification of desiderata for a clinically actionable definition of death, grounded in practical bedside use and organ transplantation ethics. I’ll categorize requirements, flag non-negotiables, and identify tensions.

  ---

  ### **I. Core Purpose**  
  **Define death to:**  
  1. **Permit organ procurement** under the dead-donor rule (organs extracted *after* death).  
  2. **Guide withdrawal of care** (e.g., stopping ventilation).  
  3. **Provide legal/ethical certainty** for death certificates, inheritance, etc.  

  ---

  ### **II. Non-Negotiable Desiderata**  
  *(Essential for clinical/ethical coherence)*  

  1. **Excludes the Living (False Positive Prevention)**  
     - **Requirement:** Must *not* declare living humans dead.  
     - **Test Cases:**  
       - Ordinary heart-attack patient with recoverable circulation (alive).  
       - Healthy human in deep hypothermia (metabolism suppressed, revivable).  
     - **Why:** Declaring a living person dead violates bodily autonomy and enables lethal harm.  

  2. **Includes the Dead (False Negative Prevention)**  
     - **Requirement:** Must declare dead those universally accepted as dead.  
     - **Test Cases:**  
       - Decapitated body (no brain, no circulation).  
       - Advanced decomposition.  
     - **Why:** Failure here invalidates the dead-donor rule and medical authority.  

  3. **Distinguishes "Dying" from "Dead"**  
     - **Requirement:** Death is an *event*, not a process. Must mark a clear threshold.  
     - **Why:** Clinicians need a discrete moment to stop resuscitation, record time of death, and procure organs.  

  4. **Acknowledges Irreversibility ≠ Permanent Cessation**  
     - **Requirement:** Death requires *irreversibility* (cannot be restored *by any means*), not mere *permanence* (won’t be restored *in practice*).  
     - **Test Case:**  
       - DCD donor after 5-min circulatory arrest: *Permanent* by protocol (no resuscitation attempted), but *reversible* if ECMO were applied immediately.  
     - **Why:** If permanence suffices, death becomes contingent on intent not to resuscitate—undermining biological reality.  

  5. **Respects Biological Hierarchy**  
     - **Requirement:** Death of the *organism as a whole*, not individual cells/organs.  
     - **Test Cases:**  
       - Brain-dead pregnant woman: Organs function with ventilation, but organismal integration is absent (body doesn’t self-regulate).  
       - Frozen embryo: No organismal functions *currently*, but retains *potential* for integrated function.  
     - **Why:** Cells/tissues live post-mortem; death is loss of the whole’s emergent unity.  

  6. **Clinical Feasibility**  
     - **Requirement:** Determinable within hours using available tools (EEG, clinical exams, pulse checks).  
     - **Why:** Autopsies or decade-long observation are impractical for transplantation/treatment decisions.  

  ---

  ### **III. Negotiable Desiderata**  
  *(Subject to philosophical/cultural debate; often weaponized in definitions)*  

  1. **Handling Anencephalic Infants**  
     - **Requirement:** Should declare dead if congenitally lacking capacity for consciousness/breathing.  
     - **Why Non-Negotiable?** *Not universally agreed.* Some argue they are live human organisms with severe defects.  
     - **Tension:** If "death" requires loss of integrated biological function, anencephalic infants may fail (e.g., regulate temperature, digest).  

  2. **Compatibility with DCD Protocols**  
     - **Requirement:** Must permit declaring death minutes after cardiac arrest *without* attempting reversibility (e.g., ECMO).  
     - **Why Negotiable:** This prioritizes organ viability over biological irreversibility. Reflects *pragmatic acceptance* of permanence-as-irreversibility.  

  3. **"Gone-for-Good" (Permanence) as Proxy**  
     - **Requirement:** Accepts that "permanent" cessation (no intent to resuscitate) suffices for death.  
     - **Why Negotiable:** Conflicts with irreversibility. The *whole-brain* camp rejects this; *circulatory* camp often accepts it.  

  ---

  ### **IV. Biological Realities (Constraints)**  
  *(Must be acknowledged but need not dictate the definition)*  

  1. **Gradual Organ Failure**  
     - Organs/cells die at different rates (e.g., neurons vs. skin cells).  
     - **Implication:** Death is a threshold in a continuum—no "single moment" biologically.  

  2. **Ventilated Bodies Maintain Functions**  
     - Digest food, heal wounds, gestate fetuses after brain death.  
     - **Implication:** These are fragmentary functions, not organismal integration.  

  ---

  ### **V. Inherent Tensions & Clashes**  
  **Key Conflict: "Paradigm Cases" vs. "Bright-Line Biological Fact"**  
  - **Problem:**  
    - *Paradigm cases* demand declaring DCD donors dead after 5 mins (socially/legally accepted).  
    - *Biological fact* insists irreversibility is required (DCD donor is reversible with ECMO).  
  - **Result:** **Jointly unsatisfiable.**  
    - To satisfy DCD pragmatism, we must accept *permanence* as sufficient (abandoning strict irreversibility).  
    - To satisfy biology, we must reject DCD death declarations as premature (undermining transplantation).  

  **Other Tensions:**  
  - Anencephalic infants challenge "organismal integration": They lack consciousness but may exhibit somatic integration.  
  - Brain-dead pregnant women test "organismal death": Is gestating a fetus a "whole-organism" function?  

  ---

  ### **Summary: The Impossible Trinity**  
  A definition of death cannot simultaneously:  
  1. **Require strict biological irreversibility**,  
  2. **Declare DCD donors dead within minutes**,  
  3. **Maintain coherence with all paradigm cases**.  

  You must sacrifice one. Current definitions prioritize pragmatism (DCD) over biology or redefine "irreversibility" contextually. Use this framework to stress-test whole-brain, circulatory, and higher-brain criteria—each resolves the tensions differently.
