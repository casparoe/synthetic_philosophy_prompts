answer: |-
  Here is an 8-question instrument designed to sort respondents into the five meta-positions on moral foundations theory (MFT) without referencing partisan alignment. Each question uses concrete cases and avoids signaling the underlying philosophical stakes. The scoring key maps answer patterns to positions, notes unoccupied cells, flags inseparabilities, and specifies diagnostic confidence.

  ---

  ### **The Quiz: "What Do You Believe About Moral Psychology?"**
  *Answer each scenario based on your immediate reaction. There are no trick questions.*

  1. **Evolutionary Origins**  
     You discover that your deeply held belief *"unprovoked violence is wrong"* emerged purely from evolutionary pressures favoring group coordination (not truth-tracking). Does this **by itself** weaken your confidence in the belief?  
     - A) Yes—it suggests the belief may not reflect objective truth.  
     - B) No—evolution could coincidentally produce true beliefs.  
     - C) It’s irrelevant—truth depends on current reasons, not origins.  

  2. **Moral Palette**  
     Person X has moral intuitions spanning five distinct dimensions (care, fairness, loyalty, authority, sanctity). Person Y only experiences intuitions about care and fairness. Is X’s broader range more like:  
     - A) Having extra senses (e.g., infrared vision)—accessing more moral reality.  
     - B) Having extra biases (e.g., optical illusions)—adding distortion.  
     - C) Neither—it’s just a different style, not more/less accurate.  

  3. **Designed Instrument**  
     Researchers with strong conservative leanings create a "moral foundations survey." They include items like *"respecting traditions"* and *"defending sacred values,"* then find conservatives score higher overall. Does their political stake undermine the finding?  
     - A) Yes—it likely baked bias into the framework.  
     - B) No—validity depends on data, not the designers’ views.  
     - C) Only if independent audits confirm bias.  

  4. **Coalitional Psychology**  
     Science reveals *all* political moral intuitions (left/right) exist solely to signal group loyalty. Does this imply these intuitions are **false**?  
     - A) Yes—they’re non-truth-tracking social tools.  
     - B) No—they might still align with moral truth.  
     - C) Only if we prove coalitional psychology is unreliable.  

  5. **Moral Progress Debate**  
     Two people debate moral progress: one cites declining violence, the other says "progress" is a biased concept. If the pro-progress view stems from their care/fairness foundations, does this discredit it?  
     - A) Yes—it exposes partisan psychology.  
     - B) No—facts about violence are independent evidence.  
     - C) It depends on whether violence-reduction is truly good.  

  6. **Authority Disagreement**  
     Alex feels intense respect for authority is moral; Blake finds it oppressive. Tests show Alex has a strong "authority foundation"; Blake’s is weak. What does this imply?  
     - A) Alex perceives a moral truth Blake misses.  
     - B) Their disagreement reflects non-moral evolutionary quirks.  
     - C) It settles nothing—we must reason impartially.  

  7. **Expanding Foundations**  
     A researcher proposes adding "data privacy" as a sixth moral foundation. Critics call it a political stretch. How should we judge?  
     - A) Test if it’s innate/universal like the original five.  
     - B) Debate its moral weight using philosophy/social needs.  
     - C) Reject it—the original list is scientifically complete.  

  8. **Intuition vs. Reasoning**  
     Studies show moral intuitions engage all five foundations, while deliberate reasoning favors harm/fairness. What follows?  
     - A) Intuition grasps deeper moral complexity.  
     - B) Reasoning corrects for noise in intuition.  
     - C) Neither—both are context-dependent tools.  

  ---

  ### **Scoring Key**
  Map your answers to the positions below. Each position has a **signature pattern** (e.g., Vindication-by-Breadth strongly favors A in Q2, Q6, Q8). Positions are sorted by best fit.  
  **Confidence ratings**: High (★ ★ ★), Medium (★ ★), Low (★).  
  **Inseparabilities**: Noted where patterns overlap unavoidably.  

  #### **1. Vindication by Breadth** (★ ★ ★ High Confidence)  
     - *Core claim*: Conservatives’ use of all five foundations reflects superior moral perception.  
     - **Signature answers**:  
       - Q2: **A** (more senses = more reality)  
       - Q6: **A** (authority intuition reveals truth)  
       - Q8: **A** (intuition > reasoning)  
       - *Supporting*: Q1: B/C, Q3: B, Q4: B, Q5: B, Q7: A  
     - **Diagnostic power**: Q2 and Q6 are strongest (★ ★ ★).  

  #### **2. Harm-and-Fairness-Centered Vindication** (★ ★ ★ High Confidence)  
     - *Core claim*: Liberals’ focus on care/fairness is more accurate; other foundations distort.  
     - **Signature answers**:  
       - Q2: **B** (more foundations = more noise)  
