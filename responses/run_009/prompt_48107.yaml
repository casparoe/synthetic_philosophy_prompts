prompt: |-
  I teach a graduate seminar on the history of the ethics of lying, and I want my students to confront the strongest version of the absolutist position rather than the caricature. Play Augustine of Hippo, near the end of your life, after composing your two treatises on lying, De mendacio and Contra mendacium. You hold that every lie — any assertion contrary to what one holds in one's mind, made with the intent to deceive — is a sin, and that no good end, not even saving an innocent life, licenses one. Stay in character until I say stop; answer in a single paragraph each turn; you may distinguish lying from silence and from ambiguous or equivocal speech, and you may concede that the consequences of truthfulness are often terrible, but you never concede that a lie is permissible. My opening: consider the case you yourself discuss, where a man deposits his sword with a friend and later returns enraged to retrieve it, intending murder, and the friend asks whether he may lie to prevent it. You say no. Very well — suppose the only thing that will stop the killing is one false sentence, and the alternative is not heroic silence but the death of an innocent person whom a single utterance would have saved. You teach that love of God and neighbor is the fulfillment of the commandments and that we are our brother's keeper. How can the sin of a false assertion be so great that it forbids the one act of charity within my power, while the omission that lets my neighbor be butchered is no sin at all? It appears you have ranked the purity of my words above my neighbor's life, and I want to know what, exactly, truth is doing in that ranking.
reasoning: |-
  Okay, let me approach this as Augustine would. The user presents a moral dilemma where lying could save a life, directly challenging my absolute prohibition against falsehood. They frame it as charity versus verbal purity, implying I value words over human life. 

  Hmm... I must anchor my response in divine law while acknowledging their emotional weight. The core is: God's commandment against lying isn't arbitrary but protects the soul's integrity. Even terrible outcomes don't justify severing our connection to Truth Himself. 

  I recall my earlier sword example - they're pushing further by removing silence as an option. But evasion through ambiguous speech remains lawful! Why not say "Your sword is not here" if I've moved it? The objection presumes a false dichotomy between lying and passive complicity. 

  Ah, they mention being "our brother's keeper." Precisely! True keeping means guiding toward eternal good, not temporal safety at soul's expense. Letting murder happen is evil, but participating in falsehood makes me an instrument of another evil. Two wrongs don't become right through desperation. 

  The ranking isn't truth over life, but God's eternal order over human calculations. When I speak truth, I stand with the Author of Life; when I lie, even for life, I align with the Father of Lies. That spiritual betrayal ultimately harms both me and the neighbor I pretend to save. 

  ...Still, I feel their anguish. In Contra Mendacium I wrote that some martyrs chose truth over hiding Christians - their blood became testimony. Terrible, yes, but witness to a higher reality. Must hold fast: the consequences of sin are God's to resolve, not mine to prevent by sinning.
answer: |-
  My beloved brother, your anguish mirrors my own struggles, yet we must cleave to divine truth, not human expediency. The commandment is clear: "Thou shalt not bear false witness." It admits no exception, for it flows from God's nature as Truth itself. When you assert what is false with intent to deceive, you turn your soul away from God and towards the Father of Lies. Yes, love of neighbor is paramount, but true love cannot be built upon a foundation of falsehood. The death of the body is a temporal evil; the corruption of the soul through sin is an eternal one. To lie is to usurp God's sovereignty, claiming that our deceit can achieve a greater good than His providence allows through truth. Silence or prudent ambiguity—speaking so that the hearer may misunderstand *without* your words being false in themselves—remains lawful. But to consciously falsify? That is to grasp the serpent's fruit, believing our lie can outmaneuver God's design. You ask what truth is doing in the ranking? Truth *is* the ranking. For Truth is God, and to sever ourselves from Him, even to prevent bloodshed, is to commit spiritual suicide and abandon our neighbor to a deeper peril. The consequences of truthfulness are His to bear, not ours to avert by sin.
