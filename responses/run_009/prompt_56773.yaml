prompt: |-
  My flatmate Priya is completely obsessed with the handicap principle and hands out verdicts on whether signals are "honest" or not like it's her job. Pub arguments so far, her track record:

  - peacock's train: honest
  - gazelles stotting when they see a cheetah: honest
  - red deer stags roaring in the rut: honest (she got genuinely cross when I said a roar is just noise)
  - a hoverfly wearing wasp stripes: dishonest, obviously
  - an actual wasp's stripes: honest
  - honeybee waggle dance: honest
  - my cousin who sold his flat and bought a ridiculous convertible outright: honest. I quote her (roughly): the payment was real, so the signal is real. I remember this one because I expected her to disapprove.

  There are three new cases I want to run past her next weekend, and I want to predict her answers before I ask so I can catch her out if she's inconsistent:

  1. A fiddler crab that dropped its claw and regrew one. I read that the regrown claw can look just as big to the eye but is lighter and weaker, basically a stage prop, and the crab gets a territorial advantage it can't back up. Honest or not?
  2. A guy at her office who took out a personal loan for a very expensive watch so he'd seem well-off to clients. The money is genuinely gone, with interest on top, but he could not actually afford it.
  3. Her supervisor's accent. Boarding school, you can hear it a mile off. It costs him nothing to produce now, and basically nobody who didn't grow up that way can fake it convincingly.

  Predict her verdict on each of the three. My own suspicion is that there's more than one rule consistent with everything she's said so far — she keeps going on about how only genuinely fit animals can afford to waste resources, but I think there's at least a "the signal must be expensive" rule and a "the signal can't be faked" rule lurking, and they come apart on the watch guy and the accent, don't they? Work out what the candidate rules are, whether each one fits her whole track record, which one she's probably actually running (and why you prefer that guess), and what further case would best catch out the differences between the rules if I really want to pin her down.

  Answer in British English please, and give me the whole thing as a single JSON object with these fields:

  {
    "predicted_verdicts": an array with one object per new case, each having "case" (a short name, e.g. "fiddler crab"), "verdict" (one of "honest", "dishonest", "not_a_signal"), "confidence" ("high", "medium" or "low"), and "why" (one or two sentences),
    "candidate_rules": an array of objects, each having "rule" (one sentence stating the rule), "fits_track_record" (true or false, with a brief note on any verdict it struggles with), and "watch_prediction" and "accent_prediction" (what this rule says about cases 2 and 3),
    "best_guess_rule": which rule you think she's running, one short paragraph of reasoning,
    "discriminating_case": a description of one further case, outside the three above, on which the candidate rules give different verdicts — make it concrete enough that I could actually put it to her over a pint
  }
reasoning: |-
  Hmm, the user wants me to predict Priya's verdicts on three new cases related to the handicap principle. Priya seems obsessed with determining whether signals are "honest" or not based on this biological concept. Let me analyze this carefully.

  First, I need to understand Priya's track record from the pub arguments:
  - She considers peacock trains, gazelle stotting, red deer roars, actual wasp stripes, honeybee waggle dances, and the cousin's convertible purchase as "honest" signals.
  - Only the hoverfly mimicking wasps is "dishonest".

  Key patterns emerge:
  1. Honest signals seem costly (peacock train requires resources, gazelle stotting risks predation)
  2. They often demonstrate underlying quality (deer roar shows size/strength)
  3. Dishonest signals are cheap fakes (hoverfly stripes without sting)
  4. The convertible case is interesting - though financially reckless, the payment was real, so she called it honest. This suggests she prioritizes actual cost over affordability or wisdom.

  Now for the new cases:
  1. Fiddler crab's regrown claw: Looks impressive but weaker. It's a "stage prop" - costly to produce initially but now a cheap imitation. This feels dishonest under handicap principle.
  2. Office watch: Genuine financial cost (loan+interest) but doesn't reflect actual wealth. Parallel to convertible case - Priya will likely call it honest due to real expenditure.
  3. Boarding school accent: Costly to acquire (boarding school fees) but free to maintain. Can't be faked easily. This is tricky - the historical cost might make it honest despite current low cost.

  I spot two candidate rules clashing:
  - Rule 1 (Costly Production): Signals must have high upfront costs (fits all cases except hoverfly)
  - Rule 2 (Unfakeable Cost): Ongoing costs prevent cheating (struggles with accent/deer roar)

  The convertible case suggests Priya favors Rule 1 - she focused on "payment was real". So:
  - Crab: dishonest (regrown claw cheaper)
  - Watch: honest (money spent)
  - Accent: honest (past boarding school costs)

  But the accent is interesting - it's unfakeable but currently cheap. A perfect discriminating case would be something like a vintage Rolex: high past cost, minimal upkeep, impossible to fake, but doesn't reflect current wealth. That should split the rules cleanly.

  For JSON structure:
  - Predicted verdicts with confidence levels (high for crab/watch, medium for accent)
  - Candidate rules with fit assessments
  - Best guess as Rule 1 based on convertible precedent
  - Discriminating case: the vintage watch scenario

  Priya's consistency hinges on whether she prioritizes historical costs over current indicators - the vintage watch test should reveal this.
