prompt: |-
  A colleague and I have been arguing about the problem of old evidence for over a year, and we have finally agreed to produce the document we should have produced months ago: a joint statement from our two camps. I am closest to the orthodox Bayesian position: credences are the fundamental quantities, rational learning is conditionalization, and the old-evidence problem is a technical inconvenience rather than a refutation — when a long-known fact seems to confirm a brand-new theory (Mercury's perihelion and general relativity being the canonical case), what has really changed is the agent's explicit stock of logical or explanatory information, and the confirmation should be reconstructed counterfactually, as the credence we would have assigned had we not already known the fact. My colleague holds instead that confirmation is an explanatory relation between evidence and theory, not a fact about anyone's credences at any time; the Bayesian reconstruction, he says, gets the direction of analysis backwards, since support is why our degrees of belief should move rather than being defined by how they would have moved. In the course of arguing, we have come to suspect our real disagreement is this: I believe every apparent case of old evidence can be redescribed as the acquisition of new information — a relevance noticed, an entailment finally recognized — while he believes there are cases in which nothing new is learned and yet confirmation still genuinely occurs.

  Draft the joint statement we could both sign. It must include at least two claims we both accept, among them a shared taxonomy that distinguishes evidence whose relevance was possessed but unnoticed from evidence that only the new theory itself makes relevant; the precise residual disagreement, phrased so that each of us would accept the wording given for our own side; and at least one crux — a concrete case both of us agree would bear on the dispute — with each side's prediction recorded in advance. Format it as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  We are drafting a joint statement with exactly five numbered points. The points must include:
  1. At least two claims we both accept.
  2. A shared taxonomy distinguishing two types of evidence: (a) evidence whose relevance was possessed (i.e., the agent had the logical resources to see the relevance) but unnoticed, and (b) evidence that only the new theory itself makes relevant (i.e., without the theory, the relevance wasn't even available to be noticed).
  3. The precise residual disagreement, worded so that each side would accept the description of their own position.
  4. At least one crux (a concrete case) that both agree would bear on the dispute, with each side's prediction recorded in advance.

  The two camps:
  - Orthodox Bayesian (me): Confirmation in the case of old evidence is a technical inconvenience; it should be reconstructed counterfactually (what credence we would have assigned had we not known the evidence) and is due to the acquisition of new information (like noticing a relevance or entailment).
  - Colleague: Confirmation is an explanatory relation; it's not about credences but about why beliefs should move. There are cases of old evidence where nothing new is learned and yet confirmation occurs.

  Shared taxonomy: We agree to distinguish between:
  - Type A: Old evidence for which the agent had the logical resources to recognize its relevance to the theory (but did not notice it until the theory came along).
  - Type B: Old evidence whose relevance to the theory is only made apparent by the new theory itself (without the theory, the relevance was not even logically available).

  Residual disagreement:
  - I (Orthodox Bayesian) hold that in all cases of apparent old-evidence confirmation, the agent actually acquires new non-deductive information (such as an explanatory connection or a relevance relation) and that the counterfactual credence change captures the confirmation.
  - My colleague holds that there are genuine cases of old-evidence confirmation in which no new information (deductive or non-deductive) is acquired by the agent, and yet the evidence confirms the theory because of an objective explanatory relation.

  Crux: We need a concrete case that both agree would test the disagreement. We must record each side's prediction.

  Structure the five points:

  Point 1: Shared claim about the nature of the old evidence problem.
  Point 2: Shared taxonomy (Type A and Type B evidence).
  Point 3: Another shared claim (if needed) or state the residual disagreement. But we must have at least two shared claims. Alternatively, we can break the residual disagreement into two parts (one for each side) and then the crux.

  Alternatively:

  1. We both accept that the problem of old evidence presents a challenge to Bayesian confirmation theory, and that it arises when evidence that is already known with certainty appears to confirm a new theory.
  2. We agree that old evidence can be categorized into two types: Type A, where the relevance of the evidence was logically possessed but unnoticed prior to the new theory, and Type B, where the relevance of the evidence only becomes logically available with the introduction of the new theory itself.
  3. [Orthodox Bayesian position]: The orthodox Bayesian holds that in every case of old evidence apparently confirming a theory, the agent acquires new non-deductive information (such as an explanatory connection or a relevance relation), and the counterfactual credence change (had the evidence not been known) captures the confirmation; thus, no genuine confirmation occurs without a change in the agent's information state.
  4. [Colleague's position]: The colleague holds that there are cases of old evidence in which no new information (deductive or non-deductive) is acquired by the agent, and yet the evidence genuinely confirms the theory due to an objective explanatory relation that exists independently of any change in the agent's epistemic state.
  5. As a crux, we consider the following case: a scientist who has long known evidence E and has a complete logical grasp of background knowledge K (including all entailments and relevance relations available within K) is presented with a new theory T. The scientist immediately sees that T explains E without learning any new facts or relations beyond T itself. The orthodox Bayesian predicts that in such a case, the scientist must have acquired new non-deductive information (such as the explanatory connection) to experience confirmation, while the colleague predicts that confirmation occurs without any new information being acquired because the explanatory relation is objective and immediate upon grasping T.

  But note: The colleague's position says that the confirmation is immediate upon grasping T without learning anything new. The Bayesian says that grasping T itself provides new information (the theory) and also the explanatory connection is new information.

  We need to be careful. The colleague might argue that even the theory T is new, but the point is that the evidence E is old and already known. The Bayesian says that when the scientist grasps T, they learn T and the explanatory connection. The colleague says that the confirmation is not due to any change in the agent's state but because of the objective relation.

  But the crux case must be one where the colleague thinks no new information is acquired? How can that be if the theory T is new? The colleague might say: the agent learns T, but that's the only new thing. The Bayesian says: learning T and the explanatory connection (which is new information) causes the confirmation. The colleague says: the confirmation is due to the explanatory relation that holds between T and E, which is not a matter of the agent's information state changing beyond learning T.

  We might refine the crux to a case where the agent already knew T? But then it's not new. So let's set up a case where the agent learns T but nothing else (so no new entailment or relevance that wasn't logically available before). But if the agent didn't know T before, then learning T is new information. The colleague might say that the confirmation happens at the moment of learning T, but without any additional information beyond T. The Bayesian says that along with T, the agent learns that T explains E (or that T entails E, or that E is evidence for T) and that is new information.

  So the crux can be:

  Case: Consider a scientist who has known evidence E for a long time and has a complete grasp of the background knowledge K (so all logical consequences of K are known to the scientist, meaning that no unnoticed entailments exist within K). The scientist then learns a new theory T (and nothing more). Upon learning T, the scientist immediately recognizes that T explains E.

  Prediction of orthodox Bayesian: The scientist acquires new non-deductive information (namely, the explanatory connection between T and E) and this is what allows confirmation; without this new information, the scientist's credence in T would not change.

  Prediction of colleague: The scientist does not acquire any new information beyond T itself (the explanatory connection is not a new piece of information but an objective relation that becomes apparent upon considering T), and confirmation occurs solely because of the objective explanatory relation between T and E.

  We must note that the Bayesian might argue that "recognizing the explanatory connection" is the acquisition of new non-deductive information, while the colleague denies that this is an acquisition of information.

  Now, we write the five points:

  1. We agree that the problem of old evidence highlights a challenge for Bayesian confirmation theory, particularly in cases where evidence known with certainty seems to support a new theory.
  2. We agree to distinguish two types of old evidence: Type A, in which the relevance of the evidence to the theory was logically available in the background knowledge but went unnoticed, and Type B, in which the relevance of the evidence only becomes logically available with the introduction of the new theory itself.
  3. The orthodox Bayesian position is that all cases of old evidence confirmation involve the acquisition of new non-deductive information (such as an explanatory relation or a relevance) and that the counterfactual credence change (had the evidence not been known) properly captures the degree of confirmation; hence, no confirmation without a change in the agent's information state.
  4. The colleague's position is that there are genuine cases of old evidence confirmation in which, beyond learning the new theory itself, no new information (deductive or non-deductive) is acquired by the agent, and the confirmation arises from an objective explanatory relation between the theory and the evidence.
  5. As a crux, we consider a scientist who fully grasps background knowledge K (including all its logical consequences) and has known evidence E for a long time; upon being presented with and learning only the new theory T, the scientist immediately recognizes that T explains E. The orthodox Bayesian predicts that this recognition constitutes new non-deductive information and is necessary for confirmation, while the colleague predicts that no new information beyond T is acquired and confirmation occurs solely due to the objective explanatory relation.

  This should work.
answer: |-
  1. We both accept that the problem of old evidence challenges Bayesian confirmation theory when long-known evidence appears to support a new theory, and that this challenge necessitates a clear taxonomy of evidence types to clarify disagreements.
  2. We agree to distinguish two types of old evidence: Type A, where the relevance of the evidence to the theory was logically possessed in the agent's background knowledge but went unnoticed prior to the new theory; and Type B, where the relevance of the evidence only becomes logically accessible through the introduction of the new theory itself, as it provides novel explanatory resources.
  3. The orthodox Bayesian holds that all apparent cases of old-evidence confirmation involve the acquisition of new non-deductive information (e.g., recognizing an entailment or explanatory link), and that confirmation is captured counterfactually by the credence change that would have occurred had the evidence been novel.
  4. The colleague holds that there are genuine cases of old-evidence confirmation where no new information is acquired beyond the theory itself, and that confirmation arises from an objective explanatory relation between evidence and theory, independent of changes in the agent's epistemic state.
  5. As a crux case, we consider a scientist with complete, explicit knowledge of all logical consequences of their background knowledge and evidence E, who then learns only theory T. The orthodox Bayesian predicts that confirmation requires new non-deductive information (e.g., the explanatory link), so the scientist must experience such learning. The colleague predicts that confirmation occurs immediately upon grasping T without any new information beyond T, as the explanatory relation is objective and intrinsic.
