  I should acknowledge their rationalist framing has merit - for standard biology, the differences are minimal. But the edge cases reveal substantive disagreements about what counts as function. Pluralism (using both theories contextually) might be the most honest approach.

  For their writing, I'd recommend: Default to etiological for evolutionary biology where history matters. Use causal-role for physiology or systems biology focusing on current mechanisms. In synthetic biology, be explicit about which sense you're using. Avoid claiming extension equivalence - that's oversimplified.

