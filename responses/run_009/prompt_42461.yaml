answer: |-
  ### Decision Tree for Positions in the Philosophy of Time

  This tree starts from uncontroversial facts (e.g., "dinosaurs existed" or "it rained here last Tuesday") and uses neutral questions to locate positions. Questions split the logical space without referencing jargon or "isms." Each node asks a commitment that genuinely divides the field, and answers must be given without knowing the resulting position. Leaves cover the required positions: standard presentism, Lucretian presentism, growing block, moving spotlight, plain eternalism, and open-future eternalism. Combinations with no standard position are noted.

  ---

  #### The Tree
  1. **Is there a universal, objective "now" that applies to the entire universe?**  
     (i.e., is there a single, non-relative fact about which events are happening at this very moment, everywhere?)  
     - **Yes** → Go to 2.  
     - **No** → Go to 5.  

  2. **Do non-present things (e.g., dinosaurs, Caesar) exist in any sense?**  
     (i.e., do they have being, even if not located at the current moment?)  
     - **No** (only the present exists) → Go to 3.  
     - **Yes** (non-present things exist) → Go to 4.  

  3. **Are truths about the past made true by present facts?**  
     (e.g., is "dinosaurs existed" true because of current evidence, fossils, or properties like "being-such-that-dinosaurs-existed"?)  
     - **Yes** → **Lucretian Presentism** (only the present exists; past truths rely on present "Lucretian" properties).  
     - **No** → **Standard Presentism** (only the present exists; past truths are primitive or lack truthmakers).  

  4. **Do future things (e.g., humans in 2100) exist?**  
     (i.e., are they real, even if not yet present?)  
     - **No** → **Growing Block** (past and present exist and are fixed; future does not exist).  
     - **Yes** → **Moving Spotlight** (past, present, and future all exist; but a privileged "spotlight" of presentness moves over time).  

  5. **Do non-present events (e.g., the signing of the Declaration of Independence) exist as real parts of the universe?**  
     (i.e., are they just as real as present events, even if not "now" in your frame?)  
     - **No** → *No standard position; relativistic presentism*.  
       - *Status: Unattractive and rare—denying existence to non-present events without a universal "now" leads to frame-relative existence, which most find incoherent with relativity.*  
     - **Yes** → Go to 6.  

  6. **Is the future fixed and settled?**  
     (i.e., is there only one possible future state of the universe?)  
     - **Yes** → **Plain Eternalism (B-theory)** (all times exist equally; no privileged present; tenseless facts; e.g., "dinosaurs existed" is made true by dinosaurs themselves in the past).  
     - **No** → **Open-Future Eternalism** (past and present exist and are fixed; future exists but is unsettled/indeterminate; e.g., multiple futures are possible until "collapsed").

  ---

  #### Notes on Unoccupied Combinations
  - **Relativistic presentism (from 5→No)**: Combines "no universal now" (Q1→No) with "non-present events don't exist" (Q5→No). This is incoherent for most—it requires a frame-dependent existence but denies existence to anything outside one's current frame, conflicting with relativity's lack of privileged frames. No major position occupies this; it is unattractive and rarely defended.
  - **Other gaps**: All other combinations lead to a leaf. For example:
    - "No universal now" (Q1→No) + "non-present events exist" (Q5→Yes) + "future fixed" (Q6→Yes) → Plain eternalism.
    - "Universal now" (Q1→Yes) + "non-present things exist" (Q2→Yes) + "future exists" (Q4→Yes) → Moving spotlight.  
    No further splits are needed; the tree cleanly separates all required positions.

  ---

  #### Worked Example
  **Person A's answers**:  
  - Q1: **Yes** (believes in a universal, privileged "now").  
  - Q2: **No** (Caesar does not exist in any sense—only the present is real).  
  - Q3: **No** (truths about the past are not made true by present facts; e.g., "Caesar existed" isn't grounded in current evidence or properties).  

  **Path**:  
  1. Q1→Yes → Q2.  
  2. Q2→No → Q3.  
  3. Q3→No → **Standard Presentism**.  

  **Why they're stuck with this**:  
  Person A rejects Caesar's existence and denies that present facts (e.g., history books or "Lucretian" properties) make past truths true. This commits them to standard presentism, where only present entities exist, and past truths are brute (or face truthmaker challenges). They also can't accept a tenseless paraphrase of "the relief when the dentist is done" (e.g., "the pain is earlier than relief") because, for presentists, relief fundamentally depends on the felt change from a real past pain to its current absence. Tenseless descriptions lose the "whoosh" of time passing, which presentists see as real.  

  **Result**: Person A must defend standard presentism, which may require accepting primitive past truths or explaining truthmaking without present grounds—a challenge in debates.  

  ---

  **Tree Summary**  
  - Internal nodes: 6 (Q1–Q6).  
  - Leaves: Standard presentism, Lucretian presentism, growing block, moving spotlight, plain eternalism, open-future eternalism.  
  - Output: One page, plain language, no jargon in questions.  
  - Typos: Minimal (e.g., "Lucretian" may be misspelled in places; correct as needed when retyping).  

  Use this to force your group to confront their commitments—good luck saving the reading group!
