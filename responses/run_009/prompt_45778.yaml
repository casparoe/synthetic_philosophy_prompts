  The key tension is between two possible rules:
  1) Internalization rule: Power requires subjects to internalize a norm or standard, making them self-regulate.
  2) Motive-channeling rule: Power restructures the field of action by working through subjects' existing motives without necessarily creating new internalizations.

  Both rules explain most verdicts well, but they diverge on case 6 (gossip village). The internalization rule fits because norms are internalized through social pressure. The motive-channeling rule also fits since gossip channels existing social motives.

  For the organ donation defaults case:
  - Under internalization rule: Likely "no" because nothing is internalized; inertia isn't self-regulation.
