prompt: |-
  I've been having an argument with my brother about whether the world is less violent than it used to be, and instead of the usual hand-waving I figured I'd just list my gut verdicts on cases and see what principle, if any, is behind them. Per capita battle deaths falling steadily since WWII: less violent, clearly. Small-scale tribal warfare killing a comparable or higher share of its (much smaller) population than WWII killed of the world: I still say the tribal world was worse, though I can't articulate why that feels so obvious to me. The Rwandan genocide packing most of a million murders into a hundred days: that makes me doubt the whole "modern world is more peaceful" thing. Sanctions that kill kids through malnutrition and wrecked healthcare: I don't want to count that as violence, but the kids are just as dead. Factory farming killing tens of billions of animals a year: if animals count, and I really do think they count, this is the most violent period in history by orders of magnitude — and yet I still balk at saying the present is more violent than the Mongol conquests. Car crashes: not violence. Deaths from diseases that cheap policy could have prevented in poor countries: somewhere in between. And on measurement, I go by per capita rates, not absolute numbers — the world getting bigger shouldn't count against it — but when I imagine billions of absolute future deaths from some catastrophe, I don't discount that at all. So: is there a principle about what counts as violence and which measure is the right one that captures all or most of these, what does it say about cases I haven't listed, and which of my verdicts does it force me to drop? Also tell me honestly whether you think there's even a fact of the matter about whether the world is "less violent" versus it just being a definitional choice.
reasoning: |-
  Okay, the user is having a debate with their brother about whether the world is less violent now than in the past. They've listed several scenarios where their intuition about what counts as "violence" varies, and they're looking for a consistent principle to tie these together. 

  First, I need to unpack their examples. They mention per capita battle deaths declining post-WWII (clear reduction), yet tribal warfare's per capita toll feels worse to them despite similar percentages. The Rwandan genocide shakes their confidence in modern peacefulness. They're conflicted about sanctions (indirect harm) and factory farming (if animals count). Car crashes feel non-violent, while preventable disease deaths are ambiguous. They also emphasize per capita rates but balk at discounting future absolute catastrophe deaths.

  Hmm, their core struggle is definitional: what qualifies as "violence"? They're wrestling with intent (sanctions vs. genocide), agency (car crashes vs. warfare), and moral patients (humans vs. animals). The per capita vs. absolute tension suggests they value individual risk but can't ignore aggregate suffering in extreme cases. 

  Their unspoken need might be deeper than winning an argument—they want ethical coherence. The examples reveal discomfort with modern "structural violence" (poverty, factory farming) that feels horrific but lacks visceral villains. Maybe they're also subtly asking: "Can I call this era peaceful without feeling complicit in hidden brutality?"

  For a framework, I'd propose: violence requires (1) an agent causing (2) avoidable harm (3) to a moral patient, with severity scaling by per capita harm intensity. This explains their intuitions: tribal warfare has high per capita intensity; factory farming becomes extreme violence if animals count; sanctions are ambiguous (was harm avoidable? intended?); car crashes lack malicious agency. Future catastrophes get special treatment because existential risks override per capita scaling—preserving future potential matters qualitatively.

  Their verdicts mostly hold, except sanctions might sneak in as violence if harm was foreseeable, and factory farming forces a brutal conclusion if animals are included. The Rwandan example fits—it's a spike in a downward trend, not a refutation. 

  Honestly? There's no universal "fact of the matter." Their definition choices reveal values: whose suffering counts, and what trade-offs between direct/indirect harm we tolerate. But historical data can inform those choices. The brother might prioritize human battlefield deaths; the user seems to weight diffuse suffering more. Neither is wrong—but naming the trade-offs makes the debate richer.
answer: |-
  This is a brilliantly messy question that cuts to the heart of ethics, measurement, and definitions. Your intuitions highlight real tensions. Here's a framework to capture most of your verdicts, the principles behind it, and its consequences:

  **The Proposed Principle:**

  **"Violence" occurs when *agents* cause *foreseeable, avoidable, serious harm* (death, severe suffering, or severe deprivation of fundamental needs) to *moral patients* (beings capable of suffering/having interests), either:**

  1.  **Directly & Intentionally:** (e.g., murder, genocide, battle).
  2.  **Indirectly but Recklessly/Negligently:** Where harm is a *foreseeable and avoidable consequence* of deliberate actions or policies, even if not the *primary intent*. (e.g., sanctions causing mass starvation if foreseeable, preventable disease deaths due to deliberate policy neglect).
  3.  **Through Systems of Institutionalized Cruelty:** Where harm is systemic, systematic, and inherent to the operation of an institution (e.g., chattel slavery, *some* factory farming).

  **The "Right" Measure is *Harm Intensity per Moral Patient*:** Prioritize **per capita rates** for *systemic comparisons over time/space*. This reflects the *risk/experience* of an average individual. However, **absolute numbers matter for:**

  *   **Existential/Civilizational Scale:** Events threatening the very existence or fundamental structure of human society/civilization (e.g., potential nuclear war, extreme climate catastrophe).
  *   **Evaluating the Scale of Atrocity:** The absolute horror of an event (e.g., the Holocaust, Rwandan Genocide) has moral weight beyond its per capita rate in a massive population.

  **Applying the Principle to Your Cases:**

  1.  **Falling Per Capita Battle Deaths (Post-WWII):** **Less Violent (Agrees).** Direct, intentional harm by agents (states/combatants) to moral patients (humans). Per capita decline is the key metric for systemic comparison.
  2.  **Small-Scale Tribal Warfare (High Per Capita):** **More Violent (Agrees).** Same type (direct, intentional harm). Higher per capita harm intensity means a higher *risk* of violent death for members of that society, making it "worse" for them *in that specific dimension*. Your intuition likely captures this higher individual risk.
  3.  **Rwandan Genocide:** **A Spike of Extreme Violence (Agrees).** Direct, intentional, massive harm concentrated in time. Doesn't *refute* a long-term trend of declining *interstate* warfare, but highlights that extreme intentional violence remains possible. Its horror is in its absolute brutality and speed, even if global per capita rates didn't massively shift.
  4.  **Sanctions Killing Kids:** **Violence (Disagrees with your verdict, aligns with your unease).** If the severe harm (malnutrition/death) was a *foreseeable and avoidable consequence* of the sanctions policy enacted by agents (states/institutions), then it constitutes indirect/reckless violence against moral patients (children). The kids *are* just as dead. Intent matters less than foreseeability and avoidability.
  5.  **Factory Farming (Animals Count):** **The Single Greatest Source of Violence (Agrees with your implication).** If animals are moral patients (capable of suffering/having interests), then factory farming is **Systemic, Institutionalized Cruelty** on an unprecedented scale (tens of billions annually). It involves deliberate actions (confinement, procedures, slaughter) causing foreseeable, severe suffering and death. This *would* make the present era extraordinarily violent *in absolute terms and per capita for the animals involved*. Your balk at comparing it to Mongol conquests highlights the challenge of comparing suffering across vastly different contexts (human vs. animal? systemic cruelty vs. conquest?).
  6.  **Car Crashes:** **Not Violence (Agrees).** While tragic, most deaths are accidental, not caused *by an agent* with intent or recklessness specifically directed at causing harm. It's a risk of a system, not an act of violence (barring intentional ramming).
  7.  **Preventable Disease Deaths in Poor Countries:** **Potentially Violence (Ambiguous, aligns with "in between").** If these deaths are a *foreseeable and avoidable consequence* of deliberate policy choices *by agents* (e.g., governments neglecting healthcare, wealthy states/institutions blocking affordable medicine/trade, structural adjustment imposing cuts), then it qualifies as indirect/reckless violence. If it's primarily due to uncontrollable factors (e.g., geography, lack of knowledge *despite* effort), it's tragic but not violence.
  8.  **Future Catastrophe (Billions Dead):** **Absolute Numbers Matter Supremely (Agrees).** Existential/civilizational-level events threaten the entire human project. The absolute scale of suffering and potential loss of future generations overwhelms per capita considerations. Preventing such events is paramount.

  **What Verdicts Might Need Changing (Based on the Framework):**

  *   **Sanctions:** If harm was foreseeable/avoidable, this framework forces you to count it as violence.
  *   **Factory Farming:** If you grant animals moral patient status, the framework forces the conclusion that this is the most violent period *in terms of absolute suffering inflicted*. Accepting this while still finding the Mongol conquests uniquely horrific requires acknowledging different *types* or *qualities* of violence (intentional human vs. systemic animal; conquest vs. commodification) that evoke different moral responses, even if the sheer suffering metric is higher now.
  *   **Preventable Diseases:** Your verdict depends heavily on *why* they are preventable. If due to deliberate policy neglect by responsible agents, it's violence.

  **Is There a Fact of the Matter?**

  *   **No, not a single, objective, universally agreed-upon fact.** Whether the world is "less violent" depends entirely on your definitions:
      *   **What counts as violence?** (Direct intent only? Reckless negligence? Structural harm? Does it include non-lethal suffering? Does it include animals?)
      *   **Who counts?** (Only humans? All sentient beings?)
      *   **How do you measure?** (Per capita? Absolute numbers? Weighted by suffering intensity? Over what timeframe? Focusing on specific types like war, or including all causes?)
      *   **What's the baseline?** (Pre-agriculture? Medieval? 19th Century? 1945?)
  *   **Yes, there are facts *within* a chosen definition.** Once you define violence, measurement, and scope, you can make factual claims: "Per capita deaths from interstate and civil wars have declined significantly since 1945" is a well-supported fact. "Humans experience less risk of violent death from warfare now than in most previous centuries" is also strongly supported. "Total suffering inflicted on sentient beings by humans is higher now than ever before" is plausible if animals count and factory farming is included.

  **Conclusion:**

  Your intuitions largely align with a framework emphasizing **agency, foreseeability/avoidability, harm to moral patients, and per capita harm intensity for systemic comparisons, while allowing absolute numbers to dominate for existential threats and the scale of specific atrocities.**

  *   **You likely need to accept sanctions causing foreseeable starvation as violence.**
  *   **If animals count, you must accept factory farming as a defining (and immense) violence of our era, even if other *human-directed* violence has declined.**
  *   **The Rwandan genocide doesn't negate the long-term trend; it's a horrific data point within it.**
  *   **Your focus on per capita is generally correct, but absolute numbers *do* have moral weight for civilization-scale events.**

  Your argument with your brother hinges on definitions. He might define violence narrowly (only intentional battlefield deaths between humans). You seem to define it more broadly (including indirect consequences, potentially animals, emphasizing individual risk). **Acknowledge the definitional choice. Then, using agreed definitions (or comparing different definitions), look at the data.** Historical data strongly supports a decline in *certain types* of human-perpetrated lethal violence (especially interstate war) on a per capita basis. It's much murkier when including indirect harms, structural violence, or non-human suffering. The world is less violent in *some* critically important ways, but potentially more violent in others, depending entirely on what you count and how you weigh it.
