  ### Thought Experiment: Workplace Training Program

  In a corporate setting, a new training program (T) is tested against the old one (C) to improve employee project success. Data from 100 employees (60 junior, 40 senior) are stratified by experience level. Juniors are more likely to be assigned the new training (due to manager bias), and seniority negatively impacts success (due to complex projects). The data:  
  - **Juniors (n=60)**:  
    - T: 20 employees, 16 successes (80%)  
    - C: 40 employees, 20 successes (50%)  
  - **Seniors (n=40)**:  
    - T: 30 employees, 12 successes (40%)  
    - C: 10 employees, 2 successes (20%)  
  **Overall**:  
  - T: 50 employees, 28 successes (56%)  
  - C: 50 employees, 22 successes (44%)  

  **Agent 1 (Causal)**: HR manager Ada must decide whether to recommend T for a **junior employee**. She asks: "What would happen if this junior receives T versus C?"  
  **Agent 2 (Predictive)**: CFO Bob must forecast the **overall project success rate** if the company adopts T universally for future hires (resembling the current 60:40 junior-senior mix). He asks: "What overall success rate should we expect under T?"  

  Ada sees T is better for juniors (80% vs 50%) and recommends T. Bob sees T’s aggregate success rate (56%) is higher than C’s (44%) and expects T to improve outcomes.  

  ### (1) Verify Simpson’s Reversal Arithmetically  
  - **Juniors**: T (80%) > C (50%) → **+30% for T**  
  - **Seniors**: T (40%) > C (20%) → **+20% for T**  
  - **Overall**: T (56%) > C (44%) → **+12% for T**  
  *No reversal yet. We need T to appear worse overall. Let’s adjust to create reversal*:  
  - **Juniors**: T: 10 employees, 8 successes (80%); C: 50 employees, 30 successes (60%) → **T +20%**  
  - **Seniors**: T: 30 employees, 12 successes (40%); C: 10 employees, 3 successes (30%) → **T +10%**  
  - **Overall T**: 40 employees, 20 successes (50%)  
  - **Overall C**: 60 employees, 33 successes (55%) → **C +5%**  
  **Reversal confirmed**: T wins in both strata but loses overall (50% < 55%).  

  ### (2) Agents’ Decisions and Rationale  
  - **Ada (Causal Question for Junior Employee)**:  
    Uses **disaggregated data (juniors)**: T’s success rate (80%) > C (60%).  
    **Why right?** Experience is a confounder: it influences both training assignment (juniors more likely to get T) and success (juniors succeed more). Conditioning on experience removes confounding. For a junior, the junior stratum best estimates T’s effect.  
    **Decision**: Recommends T.  

  - **Bob (Predictive Question for Overall Success Rate)**:  
    Uses **aggregate data**: T’s success rate (50%) < C (55%).  
    **Why right?** Bob needs a forecast under the current assignment process (not a causal effect). The aggregate reflects actual historical outcomes, accounting for how experience influenced assignments (juniors, who succeed more, were less likely to get T). For a future population resembling the observed mix, the aggregate predicts the expected success rate if the same assignment pattern continues.  
    **Decision**: Sticks with C, expecting higher success.  

  ### (3) Structural Feature and Its Role  
  - **Key Feature**: **Confounding by experience** (experience → assignment and experience → outcome). This creates imbalance: T was assigned disproportionately to seniors (30/40 seniors got T), who succeed less.  
  - **If Confounding Removed**:  
    - Suppose experience only affects outcome (not assignment). Assignment becomes random.  
    - Bob’s predictive question becomes causal: "What happens if we assign T universally?"  
    - Bob should now use **standardized rates**:  
      - Expected T success: (60% junior × 80%) + (40% senior × 40%) = 64%  
      - Expected C success: (60% × 60%) + (40% × 30%) = 48%  
    - Both agents agree T is better (Ada: 80% > 60% for juniors; Bob: 64% > 48% overall).  

  ### (4) Attack by a "Single Right Way" Advocate  
  An absolutist might:  
  - **Attack Bob**: "Aggregate ignores confounding! T’s low aggregate rate is because it was assigned to seniors. For a true forecast under universal T, use conditional rates (64%)—not the historical aggregate."  
  - **Attack Ada**: "Conditioning is unnecessary! The aggregate shows C is better (55% vs 50%), so C is superior universally."  
  **Rebuttal**: The attacks stem from ignoring context. Ada’s decision is causal (requires controlling confounders). Bob’s decision is predictive (requires fidelity to historical assignments). Denying this conflates fundamentally different questions.  

  ### Key Insight  
  The reversal arises from confounding, but the **divergent decisions hinge on the gap between causal and predictive questions**. Ada estimates a counterfactual ("What if we change training?"); Bob projects an observable ("What will happen if we continue as before?"). When both questions become causal, the decisions align. Context determines correctness—not the data alone.
