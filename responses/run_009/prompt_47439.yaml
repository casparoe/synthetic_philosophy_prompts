answer: |-
  Here is an original example satisfying your request, with analysis:

  ### The Pair
  - **Indicative:** "If this sculpture is made of solid gold, it is extremely valuable." (False)  
  - **Counterfactual:** "If this sculpture *were* made of solid gold, it *would be* extremely valuable." (True)  

  ### Context Setup
  - **Actual Facts:**  
    The sculpture is a convincing forgery: it is solid lead coated in gold plating. A professional appraiser (unaware of the forgery) examines it. Gold is objectively highly valuable, but lead is not.  

  ### Truth Value Explanation
  1. **Counterfactual (True):**  
     The counterfactual considers a world where the sculpture *is* solid gold (contrary to fact). In all closest possible worlds where it *is* solid gold—holding fixed relevant laws (economics, chemistry) and context (gold's market value)—it *is* extremely valuable. Truth depends on the consequent holding in the closest antecedent-worlds.  

  2. **Indicative (False):**  
     The indicative is evaluated under the **actual context** where the appraiser *presupposes the antecedent is epistemically possible* (i.e., "this sculpture might be solid gold"). But in reality, the sculpture is lead. The statement "If this is solid gold, it is valuable" *falsely implies a connection* between the gold and the value. Crucially:  
     - The sculpture is *not* gold → the antecedent is false.  
     - The sculpture is *not* valuable → the consequent is false.  
     - Unlike a material conditional, indicative conditionals are not vacuously true when antecedents are false. Here, the indicative misleadingly *suggests* that gold-ness *explains* value. Since the object is neither gold nor valuable, and the connection is invalid in actuality (its "value" isn't caused by being gold, as it isn't gold), the assertion is false.  

  ### Why This Works
  - **Antecedent’s Epistemic Status:**  
    The indicative presupposes that the antecedent is live in the context (the appraiser considers gold possible). But the antecedent is *actually false*, creating a mismatch. The counterfactual, by contrast, explicitly rejects the antecedent’s truth.  
  - **Consequent’s Grounding:**  
    The counterfactual’s truth relies on general laws (gold → valuable). The indicative’s falsity arises because its intended connection (this object’s gold → its value) fails *in the actual world*: the object lacks both properties.  

  ### What This Reveals: Semantic Distinction  
  Your example supports a **semantic difference** between moods:  
  - **Counterfactuals** access remote, antecedent-worlds (even when antecedent is impossible in reality). Truth depends on consequent holding in those worlds.  
  - **Indicatives** are anchored to the *actual epistemic context*. They can be false when:  
    (a) The antecedent is false, *and*  
    (b) The consequent is false, *and*  
    (c) No valid connection exists in actuality.  

  ### Against Purely Pragmatic Accounts  
  A pragmatic view (where mood only reflects speaker’s presuppositions) struggles here:  
  - If the difference were merely contextual presupposition, both conditionals should have the same truth conditions once context is fixed. But in this shared context (same speaker, same time, same object), the moods yield *divergent truth values*—indicative false, counterfactual true.  
  - This suggests mood *semantically shifts* how worlds are selected for evaluation. Counterfactuals explicitly invoke non-actual worlds; indicatives bind to worlds compatible with current knowledge.  

  ### Conclusion  
  This pair demonstrates that indicatives can be false while corresponding counterfactuals are true, due to the indicative’s tethering to actual falsity and epistemic context. The example **favors a semantic account**: mood alters truth conditions by constraining the set of relevant possible worlds. Counterfactuals escape the limitations of actuality; indicatives cannot.  

  *(Example note: While inspired by real-world art forgery, this construction is original. It avoids pitfalls like trivial antecedents ("If 2+2=5...") or non-causal pairs.)*
