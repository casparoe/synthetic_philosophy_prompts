answer: |-
  As a committed luck egalitarian, I deny compensation to the gambler but grant it to the storm victim. Here’s why:

  1.  **The Gambler:** Her *antecedent brute luck disadvantage* (genetic predisposition) should have been compensated *before* she chose to gamble – perhaps through subsidized therapy, education, or insurance. Her informed choice to gamble despite knowing the risks transforms her subsequent loss into **option luck**. Justice demands she bear the consequences. Compensating her now *would* subsidize recklessness and undermine responsibility.

  2.  **The Storm Victim:** The collapse of his town's industry is **pure brute luck** – a systemic risk he didn't choose. Justice requires compensation for this initial disadvantage (e.g., unemployment benefits, robust retraining). His choice to move to the coast was a forced gamble *only* because of this antecedent brute luck wrecking his prior life. While moving was risky, the *core disadvantage* triggering the chain (industry collapse) was unchosen. Compensation is owed for the *initial* brute luck impact, mitigating its coercive effect on subsequent choices. His home loss itself stems from that initial unchosen disaster. We compensate the unemployment caused by brute luck; the storm damage is a consequence of the constrained choice made necessary by that luck.

  The line holds: We compensate the unchosen *antecedent* brute luck (genetic risk/industry collapse), not the losses directly flowing from *informed gambles taken afterwards*, even when constrained. The storm victim’s choice was directly necessitated by brute luck in a way the gambler’s wasn’t.
