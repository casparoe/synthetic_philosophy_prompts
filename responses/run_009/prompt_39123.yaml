prompt: |-
  I'm in a medieval political philosophy course, and we just spent two weeks on Aquinas on tyranny and tyrannicide — the discussion in the little treatise on kingship plus the bits in the Summa's second part about when killing by humans is licit. My study partner thinks he's found an argument that makes Aquinas's whole position collapse, and I can't see where it goes wrong, but it seems to prove way too much. Here it is, roughly as he stated it:

  (1) Aquinas's standing rule is that no private individual may licitly kill the tyrant: punishment by death belongs to public authority, and a private person who judges and executes on his own usurps what belongs to the community. (2) Yet Aquinas concedes that a community which itself established the king can, for that very reason, depose him and even punish him — so tyrannicide can be licit when it is the community's act. (3) But every act of the community is carried out by particular men, and each of those men, considered in himself, is a private person — there is no third kind of agent in the picture, since for Aquinas the community isn't anything over and above the individuals who compose it. (4) So when the people's decree licenses certain men to kill the king, what actually happens is some number of private individuals killing him, and by (1) that is illicit. (5) If you reply that the community's mandate transforms them, notice that the mandate can only originate from still other individuals — the original constituents — who, taken singly, are private persons too, so the license never acquires a non-private source. (6) Hence tyrannicide is never licit; and since the same holds for sentencing, war-fighting, and taxing, no exercise of public authority is ever licit, and Aquinas's entire political theory is self-undermining. (7) So, my partner concludes, the private/public line has to be abandoned: private persons are licensed to kill the tyrant as soon as enough of their neighbors concur.

  I can't accept (7) — it reads like a license for mob justice, and it flattens Aquinas's whole pastoral caution about private killing — but I also cant accept (6), since Aquinas obviously thinks public authority is possible and its acts licit. So something in the chain has to give, and for what it's worth I'd much rather keep the private-person rule from (1) than give it up. Which premise or step should I reject? Why did it look innocent in the first place? And what does rejecting it cost — am I then stuck with some picture of the community as an entity over and above its members that sounds totaly un-Aquinas-like, or does the cost land somewhere else entirely? Please write the answer in American English, and end with a machine-readable line of the form \answer{step N, short phrase}, naming the step you reject.
reasoning: |-
  Okay, the user is grappling with a sophisticated argument from their medieval political philosophy course. Their study partner claims Aquinas's position on tyrannicide collapses under a specific logical chain. The user needs to identify which step fails, why it seemed plausible, and what rejecting it costs—without violating Aquinas's principles. 

  First, I need to unpack the partner's argument step by step. The core tension is between Aquinas's prohibition on private killing (step 1) and his allowance for communal action against tyrants (step 2). The partner argues that since communal acts reduce to private individuals (step 3), even mandated killings are illicit (step 4), and mandates can't solve this because they originate from private persons too (step 5). This spirals into absurdity: no public authority is possible (step 6), so the private/public distinction must be abandoned (step 7). 

  The user rejects both (6) and (7)—rightly, since Aquinas clearly affirms public authority. So where's the flaw? Step 3 is the weak link. It claims "the community isn't anything over and above the individuals," but Aquinas *does* see the community as a distinct moral agent. For him, a political community has a formal unity of order (like an army or a guild), enabling it to act through representatives without reducing to atomized individuals. This isn't a "ghost entity" but a real collective capable of delegating authority. 

  Why did step 3 seem plausible? Because modern individualism makes us default to "only individuals exist." But Aquinas operates within an Aristotelian framework where wholes (like communities) have properties their parts lack. Rejecting step 3 costs nothing un-Aquinas-like; it simply upholds his actual view of communal agency. 

  The alternative—accepting step 7—would indeed endorse mob rule, gutting Aquinas's careful limits on violence. The user's instinct to preserve the private-person rule (step 1) is sound. 

  Final answer: step 3 misrepresents Aquinas. The community *is* more than the sum of individuals—it’s a unified body that can licitly delegate punitive power.
answer: |-
  Here's why your study partner's argument fails, focusing on the flaw in Step 3 and why rejecting it aligns with Aquinas and avoids absurdity:

  1.  **Steps (1) & (2) are Correct:** Aquinas absolutely holds that private individuals cannot licitly kill a tyrant (or anyone deserving death), and that the community which established the ruler *can* licitly depose or even execute him. This is the tension the argument exploits.
  2.  **Step (3) is the Fatal Flaw:** The claim that "the community isn't anything over and above the individuals who compose it" is a crude reductionism Aquinas explicitly rejects.
      *   **Aquinas's View of Community:** For Aquinas, a political community (a *multitudo ordinata* - an ordered multitude) is a distinct entity with its own nature, unity, purpose, and powers. It possesses a real, albeit derived, authority (*auctoritas*) constituted by the common good and the consent (explicit or tacit) of its members. This authority is not reducible to the mere sum of individual private authorities. It creates a new, public capacity for action.
      *   **"Over and Above" Misinterpreted:** Aquinas isn't positing a ghostly entity floating above the people. He *is* saying that when individuals unite politically under law and authority for the common good, they form a new kind of agent – a *public person* – capable of actions (like legitimate punishment) that no individual member, acting *as* a private person, could licitly perform. The community's unity and authority are real relational properties arising from the ordered whole.
      *   **Analogy:** Think of an army. A single soldier acting alone cannot licitly command an attack or execute a deserter. But the army, as a unified body under its lawful commanders, can licitly do both. The army's authority isn't reducible to the private authority of each soldier; it's an authority of the organized whole. The individuals *participate* in this public authority *when acting in their designated public roles*.
  3.  **Why Steps (4), (5), & (6) Fail:** They depend entirely on Step (3)'s false reductionism.
      *   **The Mandate Matters:** When the community licitly decides to depose/punish the tyrant and designates specific individuals (e.g., magistrates, officials, soldiers) to carry out the act, *those individuals are not acting as private persons*. They are acting as *agents* or *instruments* of the public authority. Their mandate transforms their action from private to public. The mandate itself originates from the community's constituted authority (e.g., representatives, elders, a council acting *for* the community), not from those individuals acting privately.
      *   **Origin of Authority:** The original constituents who *first* establish authority (like electing a king) do so *as* the community-in-formation, acting together to constitute public authority. They are not acting as isolated private individuals at that moment, but as the nascent political body creating its own public structure. Once constituted, this public structure (laws, offices, procedures) provides the legitimate channel for future communal action, including deposition.
      *   **No Self-Undermining:** Public authority remains possible because the community *is* a distinct moral agent capable of generating and delegating public power. Punishment, war-making, and taxation are licit when performed by those holding or delegated public authority *according to just procedures*. The private/public distinction holds.
  4.  **Why Step (7) is Wrong & Dangerous:** Abandoning the private/public distinction *does* lead to mob justice. Aquinas's "pastoral caution" is crucial. He insists that even a just cause (removing a tyrant) requires legitimate authority and due process to avoid greater evils (anarchy, vendettas, wrongful killings of merely unpopular rulers). The "enough neighbors concur" standard is precisely the arbitrary, unstable rule Aquinas rejects. It lacks the formality, deliberation, and restraint inherent in legitimate public action.
  5.  **The Cost of Rejecting Step (3):** There is *no* significant cost within Aquinas's framework. Rejecting Step (3) doesn't require positing a mysterious, totalitarian "super-entity." It simply affirms Aquinas's own Aristotelian-Thomistic view:
      *   Humans are *naturally social and political* animals.
      *   Political community is a natural association with its own proper end (the common good) and thus its own proper powers/authority.
      *   This authority resides fundamentally in the community as a whole.
      *   It can be exercised directly (rarely) or delegated to rulers/agents.
      *   Individuals acting *within their public role* as mandated by the community *are* exercising public authority, not private judgment.
      *   **The cost is purely modern:** It requires rejecting a hyper-individualist, reductionist view of society that sees *only* atoms and no real wholes – a view Aquinas (and Aristotle) would find nonsensical.

  **Why Step (3) Looked Innocent:** It leverages a modern, individualist bias. We often instinctively think "only individuals are real; groups are just collections." This nominalist tendency makes Step (3) seem like simple common sense. However, it fundamentally misrepresents Aquinas's classical realist metaphysics and political anthropology, where the community is a real whole with properties (like authority) not possessed by its parts in isolation.

  **Conclusion:** Your instinct is correct. Aquinas's private-person rule (Step 1) is essential and defensible. The flaw lies in Step (3)'s failure to recognize the community as a distinct moral agent capable of constituting and delegating public authority. The "cost" is merely accepting Aquinas's actual, non-reductionist understanding of political society.

  \answer{step 3, community reductionism}
