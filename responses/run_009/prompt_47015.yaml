  Okay, let me tackle this fascinating Machiavelli paper problem. The user is an undergrad analyzing "The Mandrake" through the fortune/virtù lens from Machiavelli's political works, but finding contradictions. 

  First, I need to map their core dilemma: Callimaco seems passive despite being the protagonist, Ligurio lacks personal stakes, and the scheme succeeds due to others' corruption rather than skill. The user's draft keeps collapsing when applying political virtù to private comedy. 

  Hmm... the key might be recognizing that Machiavelli intentionally subverts his own framework here. The play shows virtù as distributed rather than individual - Ligurio's cunning organizes Callimaco's passion and others' vices. That explains why Callimaco feels like fortune's victim despite winning. 

  Also important: Lucrezia's offstage conversion. By making the pivotal moment unseen, Machiavelli highlights fortune's role in success. The happy ending depends on her unexplained change - virtù creates opportunities but can't control outcomes. 

  The exile context matters too. Writing "The Mandrake" after his political fall, Machiavelli explores how virtù operates without power. The comedy becomes a laboratory for testing ideas where failure isn't fatal. 

  Ultimately, the play adds to his theory by showing virtù as collaborative and reliant on fortune's cooperation - sharp contrast to the lone prince mastering fate. This private sphere reveals limitations his political works mask. 

  I'll structure five cumulative points: start where the framework fits (scheme as virtù), then its breakdowns (passion/corruption), collaborative nature, fortune's role in happy endings, and finally how exile shapes this perspective. Each point should build toward the theory's expansion beyond politics.
answer: |-
  Here are five cumulative points addressing your query:

  1.  **The initial scheme itself embodies Machiavellian *virtù*:** Ligurio's cunning plan to exploit Nicia's stupidity, Lucrezia's infertility, and societal corruption demonstrates *virtù* as adaptable intelligence and audacious manipulation of circumstance (*fortuna*) to achieve a desired end, mirroring the proactive strategies advocated in *The Prince* and *Discourses*.
  2.  **The play strains the framework by decoupling *virtù* from heroic agency:** Callimaco's paralyzing passion and passivity highlight that *virtù* (embodied here by Ligurio's scheming) can be a tool *applied to* or *exploiting* the desires and weaknesses of others (Callimaco's lust, Nicia's stupidity, Sostrata's pragmatism, Timoteo's greed), rather than emanating solely from a resolute, self-possessed actor.
  3.  **It reveals *virtù* as collaborative and parasitic, dependent on widespread corruption:** The scheme's success hinges entirely on the predictable *corruptibility* of others (Nicia, Sostrata, Timoteo), suggesting Machiavelli's political *virtù*, often reliant on manipulating human nature's baser aspects, finds a comic, microcosmic echo in the private sphere where success is less individual mastery and more skillful orchestration of others' predictable vices.
  4.  **The play underscores *fortuna*'s ultimate power through Lucrezia's conversion:** The decisive, happy resolution relies on Lucrezia's offstage transformation – an unpredictable internal shift manipulated by Timoteo's casuistry (not the plotters directly) – demonstrating that even the most cunning *virtù* ultimately depends on *fortuna* delivering a favorable outcome in critical, uncontrollable moments, making the comedy possible where tragedy was latent.
  5.  **Written in exile, the comedy exposes the dependence of *virtù* on *fortuna* and the role of deception, adding a cynical yet pragmatic layer to the political theory:** Machiavelli's personal experience of *fortuna*'s blow (his dismissal) informs the play's emphasis on circumstance enabling the plot and the necessity of exploiting human frailty; it suggests his political works, while advocating mastery, simultaneously repress how deeply such mastery relies on favorable conditions and the malleability of others through schemes like Ligurio's.
