prompt: |-
  I chair the constitutional review committee of a national student debating federation — roughly four thousand members, an AGM once a year, and a constitution last overhauled in the 1980s. Our current amendment clause is conventional: any article may be amended by a two-thirds vote of the general meeting, with notice circulated sixty days in advance. At this year's AGM a faction will move to replace it with a single omnibus clause, which would read, verbatim: "Any rule of this federation, including this one, may be amended, suspended, or repealed by a two-thirds vote of the general meeting." They argue that enumerating special procedures and protected articles merely invites procedural gamesmanship, and they cite the game Nomic, invented by the philosopher Peter Suber, as evidence that a fully self-applying amendment rule is coherent — in Nomic the whole point is that the rules for changing the rules are themselves subject to change. The opposing faction wants exactly the reverse: an entrenched core of principles (non-discrimination, one-member-one-vote, the secret ballot) declared unamendable, with an explicit provision that even motions to amend the entrenchment itself are void. A third committee member claims the entire debate is confused: our existing clause already applies to itself implicitly, since a two-thirds vote that can amend "any article" can amend the amendment article, so the omnibus motion changes nothing and the entrenchment motion is self-undermining theater.

  Please draft the memo I will circulate to the committee before the AGM. It should recommend a concrete course of action — adopt the omnibus clause, adopt the entrenchment scheme, keep our current clause, or propose a specific hybrid — and it must engage the genuine paradoxes of self-reference rather than wave at them: whether a rule can confer the authority required to amend itself, or whether such authority has to come from somewhere else and the self-applying clause merely signals it; what happens when two procedures with different thresholds each claim jurisdiction over the other (as when the entrenchers propose entrenching by two-thirds while the omnibus clause purports to keep everything amendable by two-thirds); and whether an explicitly self-entrenched clause differs in any principled way from an ordinary clause that simply happens never to have been challenged. It would help if you worked through the old Alf Ross puzzle from his 1969 Mind article on self-reference in constitutional law — a provision purportedly amended by the very rule it is an exception to — and said whether our dispute is a fresh instance of it or a watered-down version.

  Two further constraints. First, please take the Nomic comparison seriously rather than dismissively: if the game demonstrably works in practice, whatever makes it work — convention, tacit consent, the players' shared desire to keep playing — may be doing hidden work that we would want a federation of volunteers to reproduce rather than fake. Second, note where a five-person game night and a four-thousand-member federation with a bank account, staff contracts, and a duty of care to members genuinely come apart. The memo should give our AGM delegates something they can vote on without a law degree, so please end with a short numbered recommendation.
reasoning: |-
  We are addressing a constitutional amendment debate in a student debating federation. The current amendment rule requires a two-thirds vote with 60 days' notice to amend any article. Three proposals are on the table:
  1. Omnibus Clause: Replace the current clause with: "Any rule of this federation, including this one, may be amended, suspended, or repealed by a two-thirds vote of the general meeting." This is inspired by Nomic, where rules for changing rules are changeable.
  2. Entrenchment: Create an unamendable core (non-discrimination, one-member-one-vote, secret ballot) and make even attempts to amend the entrenchment void.
  3. Status Quo: Keep the current clause, which some argue is already self-applicable.

  We must consider:
  - The paradoxes of self-reference (Alf Ross puzzle): Can a rule confer authority to amend itself? Or must that authority come from elsewhere?
  - Conflicts when two procedures claim jurisdiction over each other (e.g., entrenchment by two-thirds vs. omnibus clause by two-thirds).
  - Whether an explicitly self-entrenched clause is different from an ordinary clause that hasn't been challenged.

  We also must take the Nomic comparison seriously: Nomic works because of shared conventions and the desire to keep playing. But our federation has real-world consequences (bank account, contracts, duty of care), so we need stability.

  Analysis:

  1. Self-reference and the Alf Ross puzzle:
     - Ross's puzzle: A constitutional exception (e.g., "No vehicle in the park except ambulances") and a rule that says "This rule may be amended by a two-thirds vote." If you use the amendment rule to remove the exception, are you violating the rule? Ross argued that the amendment rule, by allowing amendments, inherently allows changes to itself and any exceptions. But if the exception were entrenched, it would create a contradiction.
     - In our case:
       - The current clause: It says "any article" can be amended by two-thirds with notice. Since it is an article, it can amend itself. So it is self-applicable. Thus, the omnibus clause doesn't change the substance but makes explicit what is implicit.
       - The entrenchment proposal: If we say certain principles are unamendable and that even motions to amend the entrenchment are void, we are creating a higher rule. But how do we establish that? The current amendment rule (requiring two-thirds) is being used to create a rule that cannot be amended by the same two-thirds. This is a classic sovereignty conflict: the current rule allows for its own limitation, but then that limitation becomes immune. However, if the entrenchment is passed by the same two-thirds, it can be argued that the current rule allows for such a limitation. But then, what if later, a two-thirds majority wants to amend the entrenched part? The entrenchment clause says such a motion is void. But without a higher authority, the only way to enforce that is by a court or convention. This leads to the paradox: if the amendment rule allows entrenchment, then it must also allow the removal of entrenchment? Not necessarily: by entrenching, we are creating a new rule that limits the amendment rule.

     - Resolution: In legal theory, the amendment rule is the ultimate rule of change. If it allows for entrenchment, then that entrenchment is valid until the amendment rule is used again to remove the entrenchment. But if the entrenchment clause says that even motions to amend it are void, then the amendment rule is being overridden. This is a contradiction unless we consider that the entrenchment clause is a higher rule that was created by the amendment rule but is now immune. This is similar to the "basic structure" doctrine in some constitutions. However, without a judicial body to enforce it, it might lead to instability.

  2. Nomic's lessons:
     - Nomic works because:
       - It's a game: Players can leave, and the goal is to have fun and keep playing. Conventions and shared purpose hold it together.
       - In a real organization, we have obligations (contracts, duties) that require stability and predictability.
       - Also, in Nomic, the rules are the entire system. In our federation, the constitution is one part; we also have external legal requirements (e.g., non-discrimination might be required by law). So entrenching non-discrimination might be redundant, but also, if we entrench it and then the law changes, we might be stuck.

  3. Practical considerations for the federation:
     - Size: 4,000 members vs. a small Nomic game. We need a system that is robust against factions and temporary majorities.
     - Notice requirement: The current 60-day notice is important for deliberation. The omnibus clause removes the notice requirement? Wait, the omnibus clause as proposed does not mention notice. It only says "by a two-thirds vote". So it would remove the notice requirement. That might be a problem.
     - The current clause has notice, the omnibus proposal does not. So the omnibus proposal is not just about self-reference but also about removing the notice. That is a substantive change.

  4. The third view (status quo) has a point: the current rule can amend itself. So why change? The omnibus faction wants to remove the notice? Or are they just making explicit the self-application? The proposed omnibus clause does not include notice, so it is changing the procedure to remove notice. That is a significant reduction in safeguards.

  5. Hybrid approach?
     - We might consider keeping the notice requirement for amendments but making the amendment rule explicitly self-applicable. Also, we could have a tiered system: ordinary amendments by two-thirds with notice, and a higher threshold (or additional requirements) for amending the amendment clause itself? But that would be entrenching the amendment rule.

  Recommendation:

  We must balance flexibility and stability. The omnibus clause as proposed removes the notice requirement, which is a bad idea because it allows snap amendments without time for reflection. The entrenchment proposal might be well-intentioned but creates a paradox and might be unenforceable without a court. Also, if we entrench non-discrimination, one-member-one-vote, and secret ballot, what if the law changes? We might need to update. Moreover, the federation might need to change in unforeseen ways.

  Therefore, I recommend:

  - Keep the current amendment clause, but explicitly state that it applies to itself. This avoids the Alf Ross puzzle by making it clear that the amendment rule can be amended by the same procedure. The current clause already allows that, but being explicit might reduce confusion.

  - Alternatively, if we want to modernize, we could propose a hybrid that:
    a. Keeps the notice requirement (60 days) for all amendments.
    b. Explicitly states that the amendment clause can be amended by a two-thirds vote (with notice).
    c. Does not entrench any core principles because they are already protected by law and by the fact that changing them would require a supermajority. Also, if we entrench, we risk creating a conflict if a future AGM wants to change them.

  But the third committee member is right: the current clause is already self-applicable. So we don't need to change it. However, to address the confusion, we might clarify in the minutes or in an official interpretation that the amendment clause can be amended by the same procedure.

  But the omnibus proposal as written removes the notice. That is bad. The entrenchment proposal is problematic because it creates an unamendable core, which is hard to enforce and might lead to a crisis if a two-thirds majority wants to change it.

  Therefore, the concrete course of action:

  1. Reject the omnibus clause because it removes the notice requirement without justification.
  2. Reject the entrenchment scheme because it creates an unamendable core that could become obsolete and because it leads to theoretical and practical paradoxes.
  3. Keep the current clause, but issue an interpretive note that the amendment clause is self-applicable.

  Alternatively, to address the self-reference explicitly, we could amend the current clause to read:

  "Any article of this constitution, including this Article, may be amended by a two-thirds vote of the general meeting, provided that notice of the proposed amendment is circulated to all members at least sixty days in advance of the meeting."

  This is the same as now but with "including this Article" added for clarity.

  But note: the entrenchment faction might not be satisfied. We could also consider a compromise: have a two-tier system where core principles require a higher threshold (e.g., three-fourths) to amend. But that is entrenchment by degree, not absolute. And that wouldn't be self-undermining because the amendment rule would allow for it. However, this would require a change to the current clause.

  Given the complexity and the fact that we don't have a strong reason to change, I recommend status quo with clarification.

  Regarding the Ross puzzle: Our dispute is a fresh instance of the Ross puzzle. The entrenchment proposal is trying to create an exception to the amendment rule (the core principles cannot be amended) by using the amendment rule. But then, if the amendment rule is used to remove the exception, it would be violating the entrenched rule. This is a contradiction. The only way out is to have a higher rule (like a basic norm) that validates the entrenchment. But in our federation, the constitution is the highest rule. So we avoid the contradiction by not having absolute entrenchment.

  Final recommendation:

  - Keep the current amendment clause.
  - To clarify self-application, add the words "including this Article" to the current clause.
  - Reject both the omnibus and entrenchment proposals.

  But note: the omnibus proposal also removes the notice. That is unacceptable.

  So the memo should recommend:

  We keep the current clause and add explicit self-reference.

  But if we are to propose a change, then:

  Proposed amendment to the amendment clause:

  "Any article of this constitution, including this Article, may be amended by a two-thirds vote of the general meeting, provided that notice of the proposed amendment is circulated to all members at least sixty days in advance of the meeting."

  This is a hybrid: it keeps the notice and makes self-reference explicit.

  And we do not entrench any core principles because:
  - Non-discrimination is already required by law.
  - One-member-one-vote and secret ballot are fundamental to our identity, but if we ever need to change (e.g., to allow proxy voting for disabled members), we should be able to with a supermajority.

  So the numbered recommendation:

  1. The committee recommends amending the current amendment clause to explicitly state that it applies to itself, while retaining the notice requirement. The proposed text is: "Any article of this constitution, including this Article, may be amended by a two-thirds vote of the general meeting, provided that notice of the proposed amendment is circulated to all members at least sixty days in advance of the meeting."

  2. The committee recommends against adopting the omnibus clause because it removes the notice requirement, which is an important safeguard for a large organization.

  3. The committee recommends against the entrenchment of core principles because it creates theoretical paradoxes and practical inflexibility, and because the principles in question are already protected by law and by the supermajority requirement.

  Thus, delegates would vote on the first point (amending the current clause to add explicit self-reference) and reject the others.
answer: |-
  ### Memorandum: Constitutional Amendment Review  
  **To:** Constitutional Review Committee Members  
  **From:** Chair, Constitutional Review Committee  
  **Date:** [Current Date]  
  **Subject:** Proposed Amendment to Article [X] (Amendment Clause) and Related Paradoxes  

  This memo addresses the three proposals for revising our amendment clause: (1) the "omnibus clause" (any rule amendable by two-thirds vote without procedural constraints); (2) the "entrenchment scheme" (an unamendable core of principles); and (3) retaining our current clause (two-thirds vote with 60 days' notice). I evaluate these through the lens of self-reference paradoxes, practical governance, and lessons from Nomic. My analysis culminates in a concrete recommendation.  

  #### I. Core Issues: Self-Reference, Authority, and Jurisdictional Conflict  
  The debate centers on whether a rule can validly confer authority to amend itself, and how conflicting procedures interact. I address this via Alf Ross’s paradox and real-world implications.  

  **A. Alf Ross’s Paradox and Self-Referential Authority**  
  In his 1969 *Mind* article, Alf Ross describes a constitutional rule that creates an exception (e.g., “No vehicles in parks, except ambulances”). If the amendment clause allows amendments by majority vote, can it remove the exception? Ross argues this creates a contradiction: the rule both permits and forbids change. Our dispute is a **direct parallel**:  
  - **Omnibus clause**: Like Ross’s amendment rule, it claims full self-applicability (“any rule, including this one”). But if it can repeal itself, what authorizes it initially? Authority must derive from a prior rule (here, our current constitution). This clause risks instability by severing that link.  
  - **Entrenchment scheme**: It mimics Ross’s “exception” (e.g., non-discrimination is exempt from amendment). If passed under the current two-thirds rule, it would simultaneously authorize and void amendments to itself—a textbook Ross paradox.  
  - **Current clause**: It avoids Ross’s trap by being **implicitly self-applicable**. A two-thirds vote amending “any article” already includes the amendment clause itself, creating no contradiction. Explicitly stating this (e.g., adding “including this article”) would clarify intent without altering substance.  

  **B. Jurisdictional Conflicts**  
  What happens when two procedures claim authority over each other?  
  - **Omnibus vs. Entrenchment**: The omnibus clause allows all rules (including entrenchment) to be amended by two-thirds. The entrenchment scheme claims immunity from amendment. If both existed, a two-thirds vote could "amend" entrenchment—but entrenchment declares such votes void. This unresolvable conflict invites chaos.  
  - **Self-Entrenched vs. Ordinary Rules**: An explicitly self-entrenched clause (e.g., “this clause is unamendable”) is **symbolic only**. Legally, it differs from an ordinary clause only if enforced by an external authority (e.g., courts). In our federation, with no judiciary, it relies on convention. If challenged, a two-thirds vote could still override it—rendering entrenchment “theater,” as noted.  

  #### II. Nomic’s Lessons: Why a Federation Isn’t a Game  
  Nomic demonstrates that self-referential rules can function—but its success relies on conditions **absent** in our federation:  
  - **Nomic’s hidden pillars**:  
    - **Shared consent**: Players accept rule changes to keep playing.  
    - **No real-world stakes**: Rules govern a game, not contracts, finances, or member rights.  
    - **Small scale**: Five players can adapt quickly; 4,000 cannot.  
  - **Federation realities**:  
    - **Stability matters**: Staff contracts, bank accounts, and legal duties require predictability. Removing notice periods (as the omnibus clause does) invites rash amendments.  
    - **Asymmetric buy-in**: Factions may exploit flexible rules, undermining trust. Entrenchment risks ossification if principles become outdated (e.g., new voting technologies).  
    - **External law**: Non-discrimination is already legally mandated; entrenching it adds no protection but could conflict with future legal reforms.  

  #### III. Evaluating the Proposals  
  1. **Omnibus Clause**:  
     - **Pros**: Flexible, avoids procedural “gamesmanship.”  
     - **Cons**: Removes the 60-day notice (inviting hasty changes); severs authority from the current constitution; risks instability in a large organization. Nomic’s flexibility works only with voluntary consensus—unlikely here.  

  2. **Entrenchment Scheme**:  
     - **Pros**: Protects core principles symbolically.  
     - **Cons**: Creates a Ross paradox; unenforceable without courts; voids legitimate amendments (e.g., updating voting methods). Absolute entrenchment is illusory—if 90% of members demand change, the rule collapses.  

  3. **Current Clause (Status Quo)**:  
     - **Pros**: Already self-applicable (two-thirds vote can amend itself); notice period ensures deliberation; balances flexibility and stability.  
     - **Cons**: Perceived ambiguity about self-reference (easily fixed).  

  #### IV. Recommendation: Clarify, Don’t Overhaul  
  I propose a **hybrid approach**: **Retain the current clause but amend it to explicitly confirm self-application and retain notice**. This resolves theoretical confusion while preserving stability.  

  **Text of Proposed Amendment**:  
  > "Any article of this constitution, including this Article, may be amended by a two-thirds vote of the general meeting, provided that notice of the proposed amendment is circulated to all members at least sixty days in advance of the meeting."  

  **Why this works**:  
  - **Self-reference clarified**: Explicit language ("including this Article") eliminates ambiguity without inviting paradoxes.  
  - **Notice preserved**: Critical for a 4,000-member federation to ensure informed deliberation.  
  - **No entrenchment**: Core principles are safeguarded by supermajority requirements and external law. Entrenchment adds unenforceable rigidity.  
  - **Avoids Nomic’s pitfalls**: We retain constraints (notice) that prevent gaming, while Nomic-style openness is ill-suited for real-world organizations.  

  ### V. Voting Instructions for AGM Delegates  
  1. **Vote FOR** amending the current clause to read:  
     *"Any article of this constitution, including this Article, may be amended by a two-thirds vote of the general meeting, provided that notice of the proposed amendment is circulated to all members at least sixty days in advance of the meeting."*  
  2. **Vote AGAINST** the omnibus clause (it removes notice and invites instability).  
  3. **Vote AGAINST** the entrenchment scheme (it creates contradictions and is unenforceable).  

  This solution engages the paradoxes, respects Nomic’s insights while rejecting its irrelevance to our scale, and provides a clear, vote-ready option.  

  ---  
  **Approved by:**  
  Chair, Constitutional Review Committee
