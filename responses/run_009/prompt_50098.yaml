  Synthesizing: coherency (0.3) × person-affecting viability (0.4) × axiological/deontic clarity (0.7) × intuition robustness (0.8) × digital stress-test (0.5) ≈ 0.034 raw, but adjusted for interdependence to 0.35. The digital case and intuition vividness are most sensitive points. 

