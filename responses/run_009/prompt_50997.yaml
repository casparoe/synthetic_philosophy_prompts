prompt: |-
  I teach a first-year course in philosophy of language, and my section has fourteen students and runs for seventy-five minutes. Next week we reach Wittgenstein's later remarks on words that apply without a common essence — the family-resemblance discussion in the Philosophical Investigations, the fibre-and-thread metaphor, and the exchange with the interlocutor who complains that he is letting himself off the part of the investigation that once gave him the most headache. I do not want to lecture this material; I want a staged activity in which the students run into the phenomena themselves, with the debrief doing the mapping back to the text only afterwards. Please design that activity.

  Build it in two movements rather than around a single task.

  The first movement should target the word "chair" — deliberately not "game" or "sport", which every textbook trots out and which the students will half-remember from school. Participants should be induced to write a definition of "chair", test it against a set of borderline items I will present (a beanbag, a saddle, a tree stump that people in fact sit on, a throne, a chaise longue, an office chair that has lost a leg, an item that seems to have grown out of the floor, one that behaves in ways chairs never do), revise the definition, and fail repeatedly. The strangest items are meant to echo the thought experiment in the Investigations around §§79–80, where Wittgenstein asks whether our use of the word "chair" is everywhere bounded by rules when confronted with a chair that misbehaves. Then there must be a twist: after every definition has failed, the group is asked to classify a final set of genuinely new items, and the votes should be recorded publicly so that the students can see the datum I want them to feel — that they continue to agree with one another about what counts as a chair while disagreeing completely about what makes something one. Agreement without shared criteria, not as a claim they are told but as something that happened to them.

  The second movement should be shorter and structured around the "Moses" case from §79: a list of facts about a named figure (that he led his people out of Egypt, that he bore the name "Moses", that he did certain things certain texts ascribe to him, and so on) stripped away one at a time, with students voting at each stage on whether the name still applies and being asked to justify their votes — which should reveal that different students were holding different determining features in place all along. I would like the activity to make it visible that the indeterminacy here is of a different shape from the borderline-item indeterminacy of the first movement, even though the text treats them as one conversation.

  For the whole activity, please provide: the rules, the materials (I have a whiteboard, a projector, and no budget), a minute-by-minute timeline, the mechanism for recording votes and revisions so the trail of failures and convergences is visible at the debrief, and the debrief itself, which should map specific moments in the activity onto specific parts of the view — the family-resemblance network, the fibre-and-thread metaphor, the point that a word's application need not be everywhere bounded by rules, and the remark later in the Investigations (around §§241–242) that what lies at the bottom of the language-game is agreement in judgements, agreement in form of life, rather than agreement in opinions.

  Three constraints on the debrief. First, my students did the sorites paradox last term, and they will predictably conflate family resemblance with mere vagueness — the debrief must prise these apart rather than blur them together, and I would like you to tell me precisely at which moment in the debrief that distinction is best drawn. Second, some students will conclude that if there is no common essence, then anything goes and any competent speaker may call anything a chair; the activity should set that misconception up so it can be knocked down with the same material Wittgenstein uses against his interlocutor — the tennis ball hit arbitrarily high is still not hit out of the game. Third, tell me honestly which feature of the idea the activity cannot reproduce and I must supply in the debrief: I suspect a classroom group converging over seventy-five minutes is not the same thing as the inherited background of a form of life, and the felt normativity of our judgements — that we are answerable to something in them, not merely describing what we happen to do — may be exactly what a one-off activity cannot stage.

  Finally, tell me what will predictably go wrong the first time I run this — the ways students will try to game the definitions, the groups that will refuse to take the odd items seriously, the moments where the vote mechanic will misfire — and how to handle each without simply asserting the answer. Please write the whole plan in British English.
reasoning: |-
  We are designing a two-part activity for a 75-minute session on Wittgenstein's later philosophy. The goal is to let students encounter the phenomena of family resemblance and the indeterminacy of meaning through active participation. The session is divided into two movements: one on "chair" and one on "Moses". 

  Constraints:
  - 14 students, 75 minutes.
  - Avoid "game" and "sport"; use "chair" in the first movement.
  - First movement: students try to define "chair", test against borderline cases (provided by the instructor), revise, and fail. Then a twist: classify new items and see agreement without shared criteria.
  - Second movement: "Moses" case, stripping away facts and voting at each step to show different determining features.
  - Debrief must map to specific Wittgensteinian concepts and address potential confusions (e.g., vagueness vs. family resemblance, the misconception that without common essence anything goes).
  - The activity cannot fully reproduce the form of life and the normativity of language use; this must be addressed in the debrief.

  Materials: whiteboard, projector, no budget. We'll use the whiteboard to record definitions and votes, and the projector to show the borderline cases and the Moses facts.

  Timeline:

  Total: 75 minutes

  Part 1: Chair activity (45 minutes)
  - Introduction (5 min)
  - Definition writing and initial testing (15 min)
  - Revision and failure (10 min)
  - Twist: classifying new items and voting (10 min)
  - Transition (5 min)

  Part 2: Moses activity (15 minutes)
  - Introduction and initial voting (5 min)
  - Stripping facts and voting (10 min)

  Debrief (15 minutes)

  Detailed Plan:

  Part 1: Chair (45 minutes)

  Rules for the activity:
  - Students work individually at first, then in pairs, then as a whole group.
  - The instructor presents a series of images (or verbal descriptions) of objects that are or are not chairs, including borderline cases.
  - Students will attempt to write a definition, test it against the cases, and revise until they see the difficulty.
  - Then, a new set of items is presented for classification (voting). The votes are recorded publicly to show agreement in judgments despite disagreement in criteria.

  Materials for Chair activity:
  - A list of items to test (projected or described verbally):
    1. Standard chair (wooden, four legs, back)
    2. Beanbag
    3. Saddle (on a stand, not on a horse)
    4. Tree stump that people sit on
    5. Throne
    6. Chaise longue
    7. Office chair that has lost a leg (so it wobbles)
    8. An item that seems to have grown out of the floor (like a tree root shaped as a seat, or a concrete bench that is part of the pavement)
    9. An item that behaves in ways chairs never do (e.g., a chair that collapses when sat on, or a chair that moves away when you try to sit)

  - Then, for the twist, a new set of items (genuinely new, not seen before) for classification:
    10. A stool (three legs, no back)
    11. A bench (long, multiple people)
    12. A wheelchair
    13. A car seat (removed from a car and placed in a room)
    14. A large boulder that is used as a seat in a park

  Minute-by-minute:

  0-5 min: Introduction
  - "Today we are going to explore how we use words. We'll start with a simple word: 'chair'. I want you to write a definition of 'chair' that captures what makes something a chair and not, say, a table or a stool. You have two minutes to write your own definition."

  5-7 min: Write definitions (individually)

  7-12 min: Test with initial examples (projected one by one, starting with standard chair, then beanbag, saddle, tree stump, throne, chaise longue). For each, ask: "Is this a chair by your definition?" If not, why not? Have a show of hands for each item: "How many of you found that your definition included this as a chair? Excluded?" Do not discuss at length yet, just collect reactions. The goal is to show that definitions start to fail.

  12-17 min: Pair up and revise definitions. Then test with the tricky cases: the office chair with a missing leg, the floor-grown item, and the misbehaving chair. Project each and ask pairs to apply their revised definition. Again, show of hands for inclusion/exclusion. Expect failures.

  17-22 min: Whole group discussion: "What problems are we having? Can we come up with a definition that covers all the cases we've seen?" Try to get a group definition on the board. Then test with the misbehaving chair (e.g., collapses when sat on). Does the group definition cover it? (It should fail.)

  22-25 min: Transition to twist: "Now, even though we couldn't come up with a definition, let's see how you classify some new objects. I'm going to show you a set of objects one by one, and I want you to vote: chair or not a chair? We'll record the votes on the board."

  25-35 min: Project each of the five new items (stool, bench, wheelchair, car seat, boulder). For each, have a vote: "Chair?" (Yes/No). Record the number of yes and no votes for each on the board. Then, without discussing, move to the next.

  35-40 min: After voting, ask: "Why did you vote as you did? Let's hear from someone who said 'yes' to the stool and someone who said 'no'." Similarly for the bench and wheelchair. The point: even though they voted similarly (e.g., most say stool is not a chair but bench might be borderline, wheelchair likely yes, car seat maybe, boulder no), their reasons will differ. Record some reasons on the board.

  40-45 min: Wrap up the first movement: "So we have agreement on what to call these things, but not on why. And we couldn't find a common essence. Now we move to a different kind of example."

  Part 2: Moses (15 minutes)

  Rules:
  - Present a list of facts about Moses (as in PI §79).
  - Strip away one fact at a time and vote: "Is this still Moses?"
  - Record votes at each stage and ask for justifications to show that different people hold different facts as essential.

  Materials: Project the initial set of facts about Moses (based on Wittgenstein):

  1. The man who led the Israelites out of Egypt.
  2. The man who was called 'Moses' by those Israelites.
  3. The man who as a baby was taken out of the Nile by Pharaoh's daughter.
  4. The man who received the Ten Commandments on Mount Sinai.
  5. The man who lived at a certain time in history.

  Minute-by-minute:

  45-50 min: Introduction: "Now we turn to a different kind of word: a proper name. We are going to consider the name 'Moses'. Here are five facts about Moses. We are going to remove facts one by one and ask: is the person still Moses?"

  50-55 min: Start with all five facts. Then remove fact 1 (led out of Egypt). Vote: "Without this fact, is the person still Moses?" Record votes (yes/no). Ask one or two for reasons.

  55-60 min: Remove fact 2 (was called 'Moses'). Vote and record. Ask for reasons.

  60-65 min: Remove fact 3 (taken from Nile). Vote and record. Then remove fact 4 (Ten Commandments). Vote and record. Finally, remove fact 5 (lived at a certain time) so no facts remain. Vote and record.

  65-70 min: Quick discussion: "What happened? Why did some people stop saying 'Moses' earlier than others? What does this show about how we use names?"

  Debrief (15 minutes)

  70-85 min (but total session is 75, so we adjust: actually we have 70-75, but let's plan for 15 min and adjust timing during the activity if needed).

  Debrief structure:

  1. Map the chair activity to Wittgenstein:
     - Family resemblance: the way we saw overlapping similarities without a common core (like games). Point to the voting: even without a definition, we agreed on most classifications. The new items (stool, bench, etc.) showed that we don't need a definition to use the word.
     - Fiber-and-thread metaphor (§67): no single thread runs the whole length, but overlapping fibers. Our definitions were like trying to find one thread, but the word is held by many overlapping criteria.
     - Borderline cases and rules: the misbehaving chair (§80) shows that we don't have rules for every eventuality, but we still know how to go on.

  2. Distinguish from vagueness (sorites):
     - At this point: after presenting the family-resemblance idea, say: "You might think this is just vagueness, like the sorites paradox. But there's a difference. In sorites, we have a clear concept (e.g., a heap) and a gradual change (removing grains). Here, with chairs, we don't have a gradual change from clear chairs to non-chairs. Instead, we have different kinds of things that are related in different ways. The vagueness in sorites is about where we draw the line in a continuum. Family resemblance is about a network of criss-crossing similarities. The boulder and the collapsing chair are not part of a continuum with standard chairs; they are different in kind but still connected by some similarities."
     - Evidence: in the voting, we saw that the reasons for calling something a chair were varied and not just about degree (e.g., having a back, being for sitting, being stable, etc.). In sorites, the reasons are usually about quantity.

  3. Address "anything goes":
     - "But does this mean that I can call anything a chair? What if I call this table a chair? Would that be acceptable?" Refer to the misbehaving chair: even if it collapses, we might still call it a broken chair, not a non-chair. But if I call a table a chair, that would be a mistake. Why? Because our language-game has rules, but they are not fixed boundaries. Wittgenstein says: the rules are like the rules of tennis. You can't hit the ball arbitrarily high and say it's still in play. The rules are flexible but not arbitrary. We saw in the voting that there was broad agreement even without fixed definitions. That agreement is what holds the language-game together."

  4. The Moses case:
     - Here we see that the meaning of a name is not fixed by a single description. Different people hold different descriptions as essential. But note: this is not borderline vagueness. It's not that Moses becomes less Moses as we remove facts; it's that we may disagree about what makes him Moses. This is a different kind of indeterminacy: not about borderline cases but about what counts as the same.

  5. What the activity cannot show:
     - The form of life: our activity is a one-off, but language is embedded in a form of life that is inherited and shared. The agreement we saw in voting is a snapshot of our shared form of life. The normativity: when we judge something as a chair, we feel we are getting it right or wrong, not just reporting our preference. This comes from being trained in a community and participating in the language-game. In the activity, we were reflecting on our judgments, but in real life, we just use the word without reflection. The activity cannot reproduce the depth and the practice of a form of life, but it gives us a glimpse.

  Predictable problems and solutions:

  1. Students gaming definitions: Some might try to make the definition so broad ("anything you can sit on") that it includes the boulder, tree stump, and even the floor. Then the beanbag and saddle are included, but the throne and chaise longue are too. But then the misbehaving chair (collapsing) might still be included? And the floor-grown item? Then the new items: the boulder is included. But then ask: "Is the floor a chair? Is a rock in a field a chair?" They might say: only if used for sitting. Then we have shifted to functional criteria. Then ask: if I use a table for sitting, is it a chair? This will cause trouble. How to handle: don't reject their definition outright; let the group test it against the cases and see the problems. The point is to fail, so it's okay.

  2. Groups refusing to take odd items seriously: For the misbehaving chair, they might say "that's not a real chair, it's broken." Response: "But we do call broken chairs 'chairs'? We say 'that chair is broken'. We don't say it stops being a chair." For the floor-grown item: "It's a bench, which is a type of chair." Then we can discuss: is a bench a chair? (In the twist, we have a bench and a stool, which are borderline.) The activity includes these to push boundaries. If they dismiss, say: "Imagine you are in a culture where such things are common. How would you decide?"

  3. Vote mechanic misfire: If the votes are unanimous in the twist, that's okay. It still shows agreement. But if there's disagreement, that's also fine. The point is to show that even if there is disagreement on borderline items (like the boulder or bench), there is agreement on core cases and that reasons vary. If the Moses votes are all the same, then you can say: "But what if we remove two facts at once?" to force variation. Or, if no variation, ask: "Would anyone change their vote if we removed the fact that he was called Moses?" to prompt discussion.

  4. Time: The chair part may run over. Be prepared to cut short the revision stage if needed. The key is the twist and the voting. The Moses part must be quick.

  British English: Throughout, use British spelling and terminology (e.g., "revise" not "review", "whiteboard", "timetable" for timeline, etc.).

  Final note: The debrief is crucial. Make the connections explicit. The activity sets up the problems; the debrief shows how Wittgenstein resolves them.

  Revised timeline for 75 minutes:

  - Chair: 40 min (intro 5, writing 2, testing 10, revision and failure 10, twist and voting 10, wrap-up 3)
  - Moses: 12 min (intro 2, stripping and voting 10)
  - Debrief: 18 min (with emphasis on the distinctions and the form of life)

  But adjust as needed.

  Let me know if you need more details.
answer: |-
  Below is a comprehensive lesson plan for your 75-minute tutorial on Wittgenstein's later philosophy, designed as a staged activity with two movements. The plan adheres to your constraints: it uses "chair" rather than "game" or "sport", incorporates a twist to reveal agreement without shared criteria, contrasts the indeterminacy of "chair" with the "Moses" case, and includes a debrief that maps to key Wittgensteinian concepts while addressing potential student misconceptions. The activity is structured to minimise lecturing, with the debrief explicitly linking student experiences to the text (e.g., family resemblance, fibre-and-thread, agreement in judgements). I've written the plan in British English and included practical considerations for implementation.

  ---

  ### **Overall Session Structure**
  - **Timeline**: 75 minutes total.
    - **First Movement (Chair)**: 45 minutes.
    - **Second Movement (Moses)**: 15 minutes.
    - **Debrief**: 15 minutes.
  - **Materials**: 
    - **Projector**: For displaying images/text during activities.
    - **Whiteboard**: For recording definitions, votes, and justifications. Divide into sections: 
      - Left: Evolving definitions of "chair".
      - Centre: Voting results for chair classification (twist) and Moses.
      - Right: Key student justifications.
    - **Student Handouts**: None needed—everything is visual or verbal. For borderline chair items and Moses facts, use simple projector slides (described below).
  - **Group Management**: 14 students; activities use individual work, pair discussion, and whole-group voting to maintain engagement.

  ---

  ### **First Movement: Chair Activity (45 Minutes)**
  **Objective**: Students experience the failure of essentialist definitions and the phenomenon of agreement without shared criteria. Targets §§79–80 (chair misbehaviour) and sets up the twist for §§241–242 (agreement in judgements).

  #### **Rules and Flow**:
  1. **Individual Definition (5 minutes)**:
     - **Rules**: “Write a strict definition of ‘chair’ that captures what all chairs have in common and excludes non-chairs. Your definition must be a yes/no rule (e.g., ‘has a back and legs’).”
     - **Instructor Action**: Project a standard chair image (e.g., a simple wooden chair). No discussion yet.
     - **Why**: Forces students to commit to an initial essentialist view. Anticipated issue: students may overcomplicate definitions to cover known edge cases (e.g., “anything designed for sitting”). Discourage this by emphasising “strict” and “common essence.”

  2. **Testing Against Borderline Items (15 minutes)**:
     - **Rules**: Display items one by one via projector. For each, students apply their definition privately (yes/no), then show hands for inclusion. Record votes on whiteboard. After 3–4 items, discuss revisions in pairs.
     - **Items and Order** (display as images or brief descriptions; include odd items to echo §§79–80):
       1. Standard chair (baseline; all agree).
       2. Beanbag (blurry function/design).
       3. Saddle (functional overlap but different context).
       4. Tree stump (used for sitting but natural object).
       5. Throne (prototypical chair but ornate).
       6. Chaise longue (stretches “chairness”).
       7. Office chair missing a leg (broken but still a chair?).
       8. Floor-grown seat (e.g., a tree root shaped like a chair; challenges boundedness).
       9. Misbehaving chair (e.g., collapses when sat on; directly from §§79–80).
     - **Instructor Action**: 
       - After items 1–3, record vote tallies (e.g., “Beanbag: 10 yes, 4 no”).
       - After item 6, pause for pair revision: “Revise your definition to cover the items so far.” Record 1–2 revised definitions on whiteboard.
       - After items 7–9, test revised definitions: “Does your definition include the wobbly office chair? The one that collapses?” Expect failure.
     - **Why**: Induces repeated failure. Anticipated issues: Students may dismiss odd items (e.g., “no one would call that a chair”). Handle by framing: “Imagine this in a novel context—e.g., the floor-grown seat is common in a futuristic society. Does it fit?”

  3. **Twist: Classifying New Items with Voting (10 minutes)**:
     - **Rules**: Display five new items. Students vote privately (yes/no) on each. Record votes publicly. Then, cold-call students for brief justifications without debate.
     - **Items** (unseen before; designed for high agreement but divergent reasons):
       1. Stool (no back; often excluded).
       2. Bench (shared seating; borderline).
       3. Wheelchair (functional overlap; typically included).
       4. Car seat placed in a room (context shift; often excluded).
       5. Large boulder used for sitting (natural object; excluded).
     - **Instructor Action**:
       - Project items one by one. For each, take a show of hands: “How many say chair?” Record percentages (e.g., “Stool: 15% yes”).
       - After voting, ask 2–3 students per item: “Why did you vote yes/no?” Jot key phrases on whiteboard (e.g., for wheelchair: “It’s for sitting” vs. “It’s medical equipment”).
     - **Why**: Creates the datum—agreement in judgements (e.g., 90% agree wheelchair is a chair) without shared criteria (divergent justifications). Sets up debrief on agreement in form of life.

  4. **Transition to Second Movement (5 minutes)**:
     - Summarise: “We couldn’t define ‘chair’, but you agreed on new items. Now, let’s test a name—‘Moses’—where indeterminacy works differently.”

  ---

  ### **Second Movement: Moses Activity (15 Minutes)**
  **Objective**: Students see that names rely on a cluster of descriptions with no single essence, contrasting with chair-style borderline vagueness. Based on §79 (“Moses” example).

  #### **Rules and Flow**:
  1. **Introduction and Initial Setup (2 minutes)**:
     - **Rules**: “We’ll remove facts about Moses one by one. After each removal, vote: ‘Is this still Moses?’ Justify your vote briefly.”
     - **Initial Facts** (projected; drawn from §79):
       1. Led the Israelites out of Egypt.
       2. Was called ‘Moses’ by his people.
       3. Was taken from the Nile as a baby.
       4. Received the Ten Commandments on Sinai.
       5. Lived during a specific historical period.
     - **Instructor Action**: Display all five facts. Confirm: “With all this, it’s Moses—yes?” (All agree).

  2. **Stripping Facts and Voting (10 minutes)**:
     - **Rules**: Remove one fact at a time. After each removal, students vote privately (yes/no), then show hands. Record percentages. Cold-call 1–2 students per vote for justifications.
     - **Order of Removal** (designed to reveal divergent essential features):
       1. Remove Fact 1 (led out of Egypt). Vote: “Is it still Moses without this?”
       2. Remove Fact 2 (called ‘Moses’). Vote.
       3. Remove Fact 3 (from the Nile). Vote.
       4. Remove Fact 4 (Ten Commandments). Vote.
       5. Remove Fact 5 (historical period). Vote: “Now no facts remain—is it Moses?”
     - **Instructor Action**:
       - Record vote percentages on whiteboard (e.g., “After removing Fact 1: 60% yes”).
       - Jot justifications (e.g., “He must have the name” vs. “The Exodus defines him”).
     - **Why**: Shows that no single fact is essential for all, yet students retain the name until their personal “threshold” is crossed. Contrasts with chair—here, indeterminacy is about which features fix reference, not borderline cases.

  3. **Quick Reflection (3 minutes)**:
     - Ask: “Why did votes split? What made you say ‘no’ earlier or later than others?” Highlight divergent justifications on whiteboard.

  ---

  ### **Debrief (15 Minutes)**
  **Objective**: Map the activity to Wittgenstein’s ideas, distinguish family resemblance from vagueness, and correct misconceptions. Focus on PI §§67 (family resemblance), 79–80 (chair misbehaviour), and 241–242 (agreement in judgements).

  #### **Step-by-Step Debrief**:
  1. **Link Chair Activity to Family Resemblance and Fibre-and-Thread (4 minutes)**:
     - **Whiteboard Reference**: Point to failed definitions and voting results. “When you tried to define ‘chair’, you hunted for a common essence—like Wittgenstein’s interlocutor. But each definition collapsed against items like the misbehaving chair (§80).”
     - **Key Concepts**: 
       - **Family Resemblance (§67)**: “Like games, chairs share overlapping similarities—e.g., some have backs, some are for lounging, some are stable—but no single thread runs through all. The twist showed this: you agreed on the wheelchair (85% yes) for different reasons—e.g., function vs. design—just as fibres in a rope overlap without a core.”
       - **Borderlines Not Everywhere Bounded (§80)**: “The collapsing chair or floor-grown seat exposed that we don’t have rules for every case. Yet, in the twist, you classified new items confidently.”
     - **Activity Link**: “When your definitions failed, you didn’t stop using ‘chair’—you voted on new items with high agreement. That’s the phenomenon: agreement in judgements without agreement in criteria.”

  2. **Prise Apart Family Resemblance and Vagueness (3 minutes)**:
     - **When to Draw Distinction**: Do this immediately after explaining family resemblance, using the whiteboard’s voting data.
     - **Key Point**: “Some of you may think this is just vagueness, like the sorites paradox. But sorites is about gradual change (e.g., removing grains from a heap), where boundaries are fuzzy. Here, chairs aren’t a continuum—they’re a network. The stool, bench, and wheelchair aren’t ‘less chair-like’; they’re different types connected by criss-crossing similarities. Voting showed this: your reasons varied (e.g., ‘has legs’ vs. ‘for sitting’), not just degree.”
     - **Evidence from Activity**: Contrast the boulder (excluded for being natural) with the sorites heap—no gradual shift, just a different “resemblance path.”

  3. **Address “Anything Goes” Misconception (3 minutes)**:
     - **Set-Up and Knock-Down**: “After repeated failures, you might think, ‘If no essence, I can call anything a chair—like that table.’ But did you? In voting, no one called the boulder a chair (95% no). Why? Wittgenstein’s tennis analogy (§§79–80): just as a ball hit arbitrarily high isn’t in play, calling a table a chair breaks our language-game. The activity showed normativity: you agreed the collapsing chair was still a chair (just broken), but the boulder wasn’t. We’re answerable to communal use, not private whim.”

  4. **Link Moses Activity to Cluster Concepts (2 minutes)**:
     - **Whiteboard Reference**: Point to vote splits and justifications. “With Moses, indeterminacy wasn’t about borderline cases but which descriptions anchor the name. Some of you dropped ‘Moses’ when the name was removed; others when Exodus was gone. This is the ‘fibre-and-thread’ again: no single fact is essential, but the cluster holds the name. Unlike the chair, this isn’t vagueness—it’s about what fixes reference.”

  5. **What the Activity Couldn’t Reproduce (2 minutes)**:
     - **The Gap**: “This felt like a game, but real language rests on a form of life (§241–242). Our 75-minute agreement isn’t the deep, inherited background that makes words normative. You felt you were describing use, but in life, we’re guided by training and custom—e.g., you ‘knew’ the boulder wasn’t a chair without thinking. That’s agreement in form of life. I must add: Wittgenstein isn’t saying we just ‘happen to agree’—he’s saying this agreement is the bedrock that makes meaning possible.”

  6. **Connect to Text (1 minute)**: “Next week, we’ll read §§79–80 and 241–242. See how your struggles mirror Wittgenstein’s—e.g., the interlocutor’s headache over rules (§79) is your frustration with definitions.”

  ---

  ### **Predictable Problems and Solutions**
  1. **Students Gaming Definitions**:
     - **Problem**: Crafting overly broad definitions (e.g., “anything sat on”) to “win,” ignoring edge cases.
     - **Solution**: Test definitions rigorously with misbehaving items (e.g., “If ‘anything sat on’ counts the floor, is the floor a chair? What about when you sit on a table?”). Let the group critique—avoid asserting answers.
     - **Why**: Forces them to confront their own rules.

  2. **Dismissing Odd Items**:
     - **Problem**: Students laugh off the misbehaving chair or floor-grown item as “irrelevant.”
     - **Solution**: Frame imaginatively: “In a sci-fi world, self-collapsing chairs are common. Does your definition hold?” If resistance persists, use a less absurd item (e.g., beanbag) to make the point.
     - **Why**: Ensures engagement with Wittgenstein’s thought experiment.

  3. **Vote Mechanic Misfires**:
     - **Problem**: Unanimous votes in twist (e.g., all agree boulder isn’t a chair), masking disagreement in criteria.
     - **Solution**: Probe justifications: “Even if you all said no, why? Was it lack of legs, or not human-made?” Use whiteboard to highlight differences.
     - **Why**: The datum is in the justifications, not just votes.

  4. **Time Shortages**:
     - **Problem**: Chair activity runs over, cutting Moses or debrief short.
     - **Solution**: Strict timekeeping. If behind, skip 1–2 borderline items or move votes faster. Prioritise the twist and Moses justification phase.
     - **Why**: The twist and Moses are crucial for the key contrasts.

  ---

