prompt: |-
  I'm a high school junior working on an extended essay about when several things add up to one further thing, and I've been trying to settle it by listing my gut judgments about cases before looking at what philosophers have said. Here they are. The atoms that make up my body compose one object: me. If those same atoms were scattered by an explosion, they would compose nothing. A heap of sand poured into a pile is one thing — I can point at it, move it with a shovel, say how big it is. The pebbles scattered along a stretch of beach are not one thing, even though there are more of them and they're just as close together. A swarm of bees that coordinates to drive off a predator is one thing in a way that the same bees clustering on separate branches overnight is not. Two books stacked on my desk are not one object, just two books in a stack — and yet I find myself saying a stack of twenty books is a thing I can carry, which is uncomfortable. A car is one object even though I can unbolt a hubcap and the rest is still the car. My grandfather's prosthetic leg is part of him; his cane is not; his glasses I keep going back and forth on. The parts of a bicycle disassembled and spread across a garage floor do not compose anything, but a bicycle missing one wheel still seems to compose a bicycle.

  My tentative principle was that objects compose something when they're stuck together and act as a single unit. But it fails almost immediately: the heap of sand isn't stuck together in any way that matters, and doesn't act as a unit doing anything, yet I'm confident it's one thing; while the sun and the planets are gravitationally bound and act together as a system in a fairly strict sense, and I'm inclined to deny that the solar system is a single object the way a bicycle is.

  Please tell me what to think. I want a definite answer, not a menu: commit to the single principle you think is closest to true, state it precisely enough that I could apply it to a case you haven't seen, and show me how it handles my cases — especially the heap versus the solar system, the stack of books, and the glasses. If the principle can't save every one of my verdicts, say plainly which ones you would overturn and why those are the right ones to give up rather than the others. If you think my confidence about the sand heap or my hesitation about the glasses is itself the error, argue me out of it rather than working around it. I'd rather have a principle I can defend with one or two admitted counterexamples than a principle so hedged it decides nothing.
reasoning: |-
  Okay, let me tackle this high school junior's query about when parts compose a whole. They’ve listed intuitive cases and want a single, defensible principle. First, I need to understand their core struggle: their initial "stuck together + functional unity" principle fails for sand heaps (not stuck/functional) vs. solar systems (bound/systematic but not an object). 

  The user’s frustration is palpable—they want decisiveness, not caveats. Their examples reveal tension between spatial cohesion, human purposes, and causal integration. The sand heap nags at them because it lacks bonds yet feels like an object, while the solar system has gravitational bonds but feels like a collection. 

  I recall that van Inwagen’s "life" criterion is too narrow (excludes artifacts), while mereological universalism seems to violate their intuition about scattered pebbles. Their prosthetic leg vs. cane distinction suggests functional incorporation matters, but glasses are ambiguous—sometimes part of the person, sometimes a tool. 

  Hmm. The bicycle case is key: missing a wheel, it’s still a bicycle because its *functional essence* remains. But disassembled parts lose that essence. So maybe functionality relative to human intentions is the anchor. The heap is "one thing" because we *treat* it as a unit for shoveling/measuring, while the solar system isn’t treated as a manipulable object. 

  But can I make this rigorous? Define composition as occurring when parts are non-arbitrarily configured to serve a unified purpose *that we recognize*. This saves the sand heap (purpose: bulk material), rejects scattered pebbles (no unified purpose), and explains the glasses’ ambiguity: when worn for vision correction, they’re part of "grandfather-as-system"; when on a table, they’re just objects. 

  It overturns two intuitions: the swarm of bees (purpose is emergent but not human-assigned, so not a true object) and the 20-book stack (arbitrary grouping; we just say "stack" for convenience). The user might balk, but I’d argue: the bees are a collective, not a single entity, and the stack’s "carryability" is practical, not ontological. 

  Biggest win: solar system vs. sand heap. Solar system’s purpose is scientific, not practical, so it’s a "system" category error to call it an object. Sand heap’s purpose is material handling—ontologically legit. 

  ...Wait, is this too anthropocentric? Maybe. But their cases center human interaction (desks, canes, shovels). For a high school essay, grounding in "what we do with things" is defensible. Commit!
answer: |-
  After wrestling with your cases, I commit to this principle, stated precisely:

  **Objects compose a further object if and only if they are integrated into a spatially bounded structure that serves a contextually relevant purpose for an agent, where the arrangement of parts is non-arbitrary relative to that purpose.**

  ### Key Terms Defined
  1.  **Integrated:** Parts are in stable, direct physical contact or connection, enabling coordinated interaction.
  2.  **Spatially bounded:** The parts form a contiguous whole with a discernible boundary separating it from its immediate environment.
  3.  **Contextually relevant purpose:** The structure performs a function or role recognized as significant by an agent (human or biological system) in a specific situation.
  4.  **Non-arbitrary arrangement:** The specific configuration of parts is essential for achieving the purpose; rearranging or scattering the parts fundamentally undermines it.

  ### Application to Your Cases
  1.  **You (body atoms):** **Composes.** Atoms are integrated (chemically bound), spatially bounded (skin), serving biological purposes (life), arranged non-arbitrarily (specific anatomy).
  2.  **Scattered atoms (after explosion):** **Does not compose.** Lacks integration, spatial boundedness, and purpose-driven non-arbitrary arrangement.
  3.  **Heap of sand:** **Composes.** Integrated (friction/gravity), spatially bounded (pile shape), serves a purpose (e.g., bulk material for construction/measurement), arranged non-arbitrarily (a pile functions differently than a layer or scattered grains).
  4.  **Pebbles on beach:** **Does not compose.** Lacks integration (just adjacent) and a unified, non-arbitrary purpose-driven arrangement. They are merely co-located individuals.
  5.  **Swarm of bees (defending):** **Does not compose (Overturned).** While integrated (proximity) and serving a purpose (defense), it lacks a *spatially bounded structure* – it's a dynamic cloud. It's a collective action, not a single object. Your intuition of unity comes from agency/purpose, not objecthood.
  6.  **Bees on branches (sleeping):** **Does not compose.** Lacks integration, spatial boundedness, and unified purpose-driven arrangement.
  7.  **Two stacked books:** **Does not compose.** Integrated (contact) and spatially bounded, but lacks a *non-arbitrary, purpose-driven arrangement*. Stacking is incidental; the books serve individual reading purposes. It's just two books touching.
  8.  **Stack of twenty books:** **Does not compose (Overturned).** Same as two books: integrated and bounded, but the arrangement is arbitrary relative to the books' purpose (reading). Its "carryability" is a practical affordance of mass/contact, not the emergence of a *new object* with its own purpose. You have a "stack" – a description of an arrangement, not an object.
  9.  **Car (with hubcap):** **Composes.** Integrated (bolted), spatially bounded (body), serves a purpose (transportation), arranged non-arbitrarily (wheels, engine, etc., in specific configuration).
  10. **Car minus one hubcap:** **Composes.** Core integration, boundedness, purpose, and non-arbitrary arrangement remain intact. The hubcap is peripheral.
  11. **Grandfather's prosthetic leg:** **Composes (part of him).** Integrated (attached), spatially bounded (within body outline), serves a biological purpose (mobility) as part of the agent's functional system, arranged non-arbitrarily (fitted for ambulation).
  12. **Grandfather's cane:** **Does not compose (not part of him).** Integrated (gripped) and serves a purpose (mobility), but **NOT spatially bounded** within the agent's structure. It's a distinct tool interacting *with* the bounded agent system.
  13. **Grandfather's glasses:** **Ambiguity Resolved:** When worn: **Composes (part of him).** Integrated (on face/nose), spatially bounded (on head/within personal space), serves a biological purpose (vision) as part of the agent's functional sensory system, arranged non-arbitrarily (lenses positioned for eyes). When off: **Does not compose (not part of him).** Lacks integration and boundedness with the agent system; just a tool.
  14. **Disassembled bicycle parts:** **Do not compose.** Lack integration, spatial boundedness, and current purpose-capability. Arrangement is arbitrary.
  15. **Bicycle missing one wheel:** **Composes.** Core integration (frame, fork, handlebars, etc.), boundedness, purpose (can be rolled/pushed/used for parts), and non-arbitrary arrangement remain sufficiently intact. It's an incomplete bicycle, not a non-bicycle.
  16. **Solar System:** **Does not compose.** Integrated (gravitationally bound) and serves a purpose (scientific study), but **lacks spatial boundedness** – it's a vast, diffuse structure with no clear boundary. The arrangement, while stable, isn't *non-arbitrary relative to a unified purpose* in the way a car or body is; its "purpose" (as a system) is descriptive, not functional for an agent in context.

  ### Why Overturn the Swarm and the Book Stack?
  *   **Swarm:** Your intuition confuses collective *action* with ontological *unity*. The bees remain distinct agents coordinating; they don't fuse into a single bounded structure. Granting them objecthood would force you to accept *all* coordinated groups (e.g., a football team executing a play) as objects, collapsing the distinction entirely.
  *   **Book Stack (any size):** Conceding that mere aggregation + contact + affordance (like carryability) creates a new object is a slippery slope. Why is 20 books an object but 2 books not? Why not all books on a shelf? Or all grains in a silo? The "stack" is a useful description of an arrangement of *many objects*, not evidence of a *new* object. Its "purpose" (storage, transport) is imposed on the collection, not inherent to a novel entity defined by its non-arbitrary structure. Giving this up preserves a crucial distinction between genuine functional wholes and mere collections.

  ### Why the Principle Works & Why Your Confidence in the Sand Heap Stands
  The principle anchors objecthood in **functional integration within a bounded space relevant to agents**. This explains:
  *   Why the sand heap *is* an object: It's a bounded bulk substance with a purpose (being moved, measured, used as fill) dependent on its aggregated state.
  *   Why the Solar System *isn't*: Its "integration" is too diffuse, lacks a boundary, and its "purpose" is observational, not practical within its own structure.
  *   The glasses ambiguity: Their status changes based on *functional incorporation* into an agent's bounded system.
  *   The difference between a peripheral part (hubcap) and an essential one (wheel): Loss of the hubcap doesn't destroy the core functional bounded structure; loss of a wheel critically compromises it, though not completely (hence "incomplete bicycle").

  This principle provides clear, defensible answers grounded in how agents interact with the physical world, avoiding the pitfalls of pure contact (fails on solar system, pebbles) or pure function (fails on sand heap, accepts too much). It demands giving up the swarm and stack intuitions, but these are the weakest links in your list, driven more by linguistic convenience ("a swarm," "a stack") or collective behavior than genuine ontological unity.
