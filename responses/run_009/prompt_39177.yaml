prompt: |-
  ok so this is kind of a weird ask but here goes. me and my friends constantly debate whether stuff is ok or not — like is it messed up not to tip when the service was slow, or do you have to tell a friend her bf is cheating if you promised not to. and i noticed something: even though we all agree one of my friends has the best moral judgment of anyone we know (she's basically who everyone goes to when they feel bad about something), people still get weird about it when someone just asks her and does whatever she says without thinking it through themselves?? like if she's the best at judging this stuff, shouldn't trusting her be the smart move? i read a little about how philosophers think moral advice is strange in exactly this way — you're allowed to just trust an expert on, say, climate facts, but if you outsource your whole conscience to someone, people act like that's cowardly, or like you don't really count as a good person even when you end up doing the right thing. i don't fully get why moral stuff would be different but i also kind of do?

  anyway i want something practical out of this, not a lecture. can you turn it into a checklist i can actually run whenever i'm unsure if something is right or wrong? like: the questions to ask myself in order, when it's fine to just go "she'd say no, so i wont do it" and move on, when i actually have to reason it out myself and can't delegate, what to do when the person i'd ask would probably get it wrong (asking my grandma about basically anything modern lol), and where the checklist just hits a wall and i have to decide myself. also please be honest about which steps are really just my own judgment dressed up as a procedure.

  then run it on three real-ish situations from my life: (1) a friend asked me to cover for him lying to his parents about where he was last weekend, (2) the group chat is planning to freeze out this one kid and i think its mean, but if i push back they'll probably turn on me next, (3) i'm pretty sure a girl in my class shoplifts and she's my friend. at least one of these should end with an answer i won't like, and you should say that straight instead of softening it.
reasoning: |-
  Okay, the user is dealing with some deep moral dilemmas and wants a practical approach. They mentioned their friend who's great at moral judgment, but outsourcing decisions to her feels off. Philosophers have pointed this out—trusting experts on facts is fine, but morality is different. The user wants a checklist to navigate these situations without just relying on others.

  First, I need to understand why moral advice is different. It's about personal engagement and understanding the reasons behind actions. If you just follow someone else's advice without reasoning, you're not developing your own moral compass. That's probably why people react negatively—it seems like avoiding responsibility.

  The user's checklist needs clear steps: when to trust others, when to decide alone, and how to handle unreliable sources. They also want honesty about where the process still requires their judgment. The examples they provided (covering for a lie, group freeze-out, shoplifting friend) are real scenarios to test the checklist.

  For the checklist, I'll structure it as a flowchart. Start with urgency, then consider delegation. Key questions: Is the expert reliable? Is the issue complex? What's the risk? Include steps for when to reflect personally and when to act. Highlight that even when using the checklist, some steps involve personal judgment.

  Now, applying it to the examples. Covering for a friend's lie: low urgency, expert might be reliable, but personal stakes are high. The checklist would say don't delegate—decide yourself. The answer might be unpopular: don't cover the lie because it involves deception and could harm trust.

  Group freeze-out: Urgency medium. Delegation might not help if the expert isn't available. Personal reflection needed because it's about courage and personal values. The checklist leads to pushing back despite social risk. User might not like that because it could isolate them.

  Shoplifting friend: High urgency if ongoing. Expert advice possible, but unreliable if the friend is biased. Personal responsibility kicks in since it's illegal. The answer is to talk to the friend, which might strain the friendship.

  The user's deeper needs: They want autonomy in moral decisions but seek validation. They might fear making mistakes or facing social backlash. The checklist should empower them to balance external advice with internal reasoning, building confidence in their own judgment over time.
answer: |-
  Here’s a practical **Moral Decision Checklist** based on your observations about moral delegation, expert judgment, and personal responsibility. Philosophers like Kant (duty) and Aristotle (virtue) argue that morality requires *your engagement*—not just correct outcomes. The checklist forces you to wrestle with *why* an act matters, not just *what* to do.

  ---

  ### **The Moral Decision Checklist**
  *(Use when unsure if an action is right/wrong)*

  1.  **URGENCY CHECK:**  
      *"Is immediate action required to prevent harm?"*  
      → **YES:** Skip to Step 4 (Act/Don’t Act). *Delegation isn’t an option in emergencies.*  
      → **NO:** Proceed to Step 2.

  2.  **DELEGATION CHECK:**  
      *"Could I trust an expert’s judgment *without* understanding their reasoning?"*  
      → **YES ONLY IF:**  
      - The issue is highly technical/context-specific (e.g., medical ethics, complex law).  
      - The expert is *demonstrably reliable* on *this exact type* of issue.  
      - I have **no personal stake** beyond wanting the right outcome.  
      → **NO:** Proceed to Step 3. *(Most personal moral decisions fail here – your character is on the line)*

  3.  **REFLECTION CHECK:**  
      *Answer these yourself (no shortcuts):*  
      a. **Harm:** "Who could be hurt (physically, emotionally, materially) if I do this?"  
      b. **Fairness:** "Would this violate agreed rules, promises, or basic fairness?"  
      c. **Virtue:** "What would this action say about *who I am*? (e.g., honest/cowardly, loyal/betraying, kind/cruel)"  
      d. **Universalize:** "If everyone did this in similar situations, would society improve or crumble?"  
      e. **Self-Interest:** "Am I rationalizing because this benefits me or avoids conflict?" *(Be brutally honest)*

  4.  **ACTION THRESHOLD:**  
      Based on Steps 1-3:  
      → **ACT IF:** Harm is prevented + Fairness upheld + Aligns with who you want to be.  
      → **DON’T ACT IF:** Unnecessary harm + Violates trust/rule + Compromises your integrity.  
      → **STILL STUCK?** Consult an expert *for perspective* (not a verdict), THEN return to Step 3a-e.

  5.  **UNRELIABLE SOURCE HANDLING:**  
      *"What if my 'go-to' person is biased/uninformed (e.g., Grandma on modern issues)?"*  
      → Use them ONLY for:  
      - **Values clarification** ("What principles matter here?").  
      - **Historical perspective** ("How was this handled before?").  
      → **NEVER** for: Situations requiring current context, cultural sensitivity, or expertise they lack.  
      → **Fallback:** Step 3 (Reflection) is your core tool.

  **Where "Judgment Dressed as Procedure" Happens:**  
  - Step 3c (Virtue): Defining "who you want to be" is deeply personal.  
  - Step 3e (Self-Interest): Spotting your own bias is subjective.  
  - Step 4: Weighing the answers to 3a-e is *your* call.

  ---

  ### **Applying the Checklist to Your Situations**

  **Situation 1: Covering for a Friend’s Lie to His Parents**  
  1.  **Urgency:** No immediate harm (he’s already lied). Proceed.  
  2.  **Delegation:** NO. This is about *your* honesty and complicity.  
  3.  **Reflection:**  
      a. **Harm:** Parents misled (erodes trust). Friend enabled in lying. You risk being seen as untrustworthy.  
      b. **Fairness:** Violates truth-telling. Betrays parents’ trust indirectly.  
      c. **Virtue:** Makes you a co-liar. Undermines integrity.  
      d. **Universalize:** If everyone covered lies, trust vanishes.  
      e. **Self-Interest:** Fear of friend’s anger? Avoiding conflict? Likely YES.  
  4.  **Action:** **DON’T COVER FOR HIM.** Say: *"I can’t lie for you. Talk to them?"*  
      **Why you might not like it:** It risks the friendship short-term. But outsourcing this to your moral-expert friend wouldn’t absolve *you* – you’d still choose to be complicit.

  **Situation 2: Group Chat Freezing Out a Kid**  
  1.  **Urgency:** Psychological harm is happening *now*. Proceed.  
  2.  **Delegation:** NO. This tests *your* courage and kindness.  
  3.  **Reflection:**  
      a. **Harm:** Target kid is isolated/hurt. You feel complicit. Group becomes crueler.  
      b. **Fairness:** Violates basic decency. No due process.  
      c. **Virtue:** Silence = cowardice/complicity. Speaking = courage/kindness.  
      d. **Universalize:** If all groups freeze out "outsiders," bullying wins.  
      e. **Self-Interest:** Fear of being next is real. But protecting yourself by harming another is selfish.  
  4.  **Action:** **PUSH BACK.** Say: *"This seems mean. Why are we doing this?"* or *"Include them."*  
      **Why you might not like it:** High social risk. They *might* turn on you. But Step 3e shows your fear is driving inaction – that’s the test.

  **Situation 3: Friend Shoplifts**  
  1.  **Urgency:** Ongoing illegal activity. Potential escalation. Proceed.  
  2.  **Delegation:** MAYBE (for perspective), BUT... Your expert friend might say "Report her!" – but could you live with that? See Step 3.  
  3.  **Reflection:**  
      a. **Harm:** Store loses $. Friend risks arrest/criminal record. You risk being accessory.  
      b. **Fairness:** Theft violates law/social contract.  
      c. **Virtue:** Ignoring it = cowardly/enabling. Reporting anonymously = just but harsh? Confronting = loyal but risky.  
      d. **Universalize:** Widespread theft → higher prices/security/loss of trust.  
      e. **Self-Interest:** Don’t want to lose friend? Fear confrontation? Don’t want "snitch" label?  
  4.  **Action:** **CONFRONT HER DIRECTLY FIRST.** Say: *"I know you shoplift. It worries me – you could get busted. Please stop."*  
      → IF SHE CONTINUES: Revisit. Reporting becomes more defensible.  
      **Why you might not like it:** Direct confrontation is uncomfortable. She might deny it or ditch you. But outsourcing the *confrontation* (e.g., telling a teacher anonymously) avoids your duty as a friend to address it personally first.

  ---

  **Key Takeaway:** Moral expertise is for **guidance and perspective**, not outsourcing. The checklist forces you to confront the *reasons* behind actions. Trusting your friend is smart for *input*, but if you blindly follow her verdict without grappling with Steps 3a-e, you’re avoiding moral growth. The "best" person isn’t the one who always gets the answer right – it’s the one who wrestles with *why* it’s right, even when it’s hard. Use your friend to sharpen your thinking, not replace it.
