prompt: |-
  I'm in a game theory elective and we just did axiomatic bargaining theory. I have to write a short essay (~700 words) on whether the Nash bargaining solution or the Kalai-Smorodinsky solution is better justified by its axioms, and my prof is adamant that reciting the axiom lists gets at best a C — she wants an actual argument about why the trade-off between the two axiom sets should break one way.

  The crux as she framed it: Nash's solution is the unique one satisfying Pareto efficiency, symmetry, invariance to affine rescaling of utilities, and independence of irrelevant alternatives (IIA). Kalai-Smorodinsky keeps the first three but swaps IIA for individual monotonicity — the idea being that if one player's best possible outcome (their "utopia" payoff) in the feasible set gets worse, that shouldn't cost the other player anything, and if it gets better, the benefiting player's agreed payoff shouldn't fall. The standard worry about IIA is a case where part of the pie quietly disappears in a region that was mostly benefiting one player: IIA says the bargain stays exactly where it was, which looks unfair, and individual monotonicity is built precisely to block that.

  Write the essay for me. Give IIA its best defense, not a strawman — think about what IIA buys you, like immunity to strategic manipulation by artificially removing options, or consistency of the solution across different games. But don't end on some "both have merit" cop-out: pick the solution you think wins on the merits and defend the choice. Don't bother with citations, just make the arguments.

  End the essay with a final line of the form Verdict: Nash or Verdict: Kalai-Smorodinsky — exactly one of those two, nothing after it, since I need to machine-extract your conclusion.
