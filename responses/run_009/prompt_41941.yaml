  Okay, the user is working on a challenging final paper about consciousness theories. They need to create an adversarial collaboration document between Global Workspace Theory (GWT) proponents and supporters of Ned Block's phenomenal consciousness view. The key requirements are substantive agreed claims, neutrally worded disagreements, and testable cruxes with predictions - all while maintaining strict neutrality and avoiding reconciliation.

  Hmm, the professor has emphasized this can't be a compromise piece - it must reflect genuine unresolved tensions. The user specifically wants to include their TA's "threshold-hold" experiment idea and evaluate its viability as a crux test. They're concerned about slant in their phrasing and need formatting help.

  First, let's unpack the core conflict: GWT equates consciousness with global broadcast (access), while Block insists phenomenal experience (P-consciousness) can exist without access. The Sperling paradigm is central here - both sides interpret it differently. 

  For the agreed claims section, I should focus on uncontroversial empirical findings both camps accept: what Sperling shows about partial report superiority, how change blindness reveals limitations in attention/access, and shared critiques of report-based measures. These shouldn't be trivial - each must bear theoretical weight.

  The disagreements table is tricky. Each row must pass the "would you sign this?" test. For example: "Does phenomenal consciousness require global broadcasting?" with GWT saying yes and Blockians saying no. Need to phrase these as neutral propositions where each side recognizes their position. 

  Now the threshold-hold paradigm... interesting idea but problematic. Both sides might reject it because: 1) maintaining sub-ignition states may alter normal processing 2) introspection itself may require access 3) "rich but fragile" is hard to distinguish from vague pre-conscious content. This suggests the debate can't be resolved through introspection alone - hence the need for objective measures in the cruxes.

  For the cruxes, I'll propose experiments with clear differential predictions: 
  - High-resolution masking to test overflow persistence
  - Dual-task paradigms with graded attentional load
  - Neural decoding of unreported contents

  The document should end with explicit residual disagreement - perhaps stating that Block's position requires accepting unreportable phenomenal states as scientifically valid, which GWT rejects on principle. No false harmony.

  Format-wise, numbered lists will work best for clarity. Every claim must withstand the professor's "sign-off" scrutiny - so wording precision is critical. The user's anxiety about slant means I should explicitly flag any potentially contentious phrasing.
answer: |-
  Here’s a draft adversarial collaboration document adhering to your specifications. It focuses on empirical agreements, neutrally framed disagreements, and testable cruxes—without resolution. Each claim is crafted to survive scrutiny from both camps.

  ---

  **Adversarial Collaboration: Global Workspace Theory (GWT) vs. Phenomenal Consciousness (P-Consciousness) Separabilism**  
  *Joint Statement by [GWT Proponent] & [Blockian Proponent]*  

  ### I. Agreed Claims (Substantive Empirical/Conceptual Ground)  
  1. **Sperling Paradigm**: Partial-report superiority demonstrates that visual systems can transiently encode more information than can be reported via access consciousness. Neither camp disputes this *capacity*.  
  2. **Report Limitations**: Standard report-based measures (verbal, button-press) are *necessary but insufficient* for indexing phenomenal consciousness, as they conflate:  
     - (a) Experience itself,  
     - (b) Working memory consolidation,  
     - (c) Post-perceptual decision processes.  
  3. **Change/Inattentional Blindness**: These phenomena robustly show that *access* to conscious content fails without attention, but they do **not** conclusively demonstrate the absence of *phenomenal* content for unattended stimuli.  
  4. **Neural Correlates**: Both accept that recurrent processing in sensory areas (e.g., V1-V4) is necessary for conscious perception. Disagreement centers on whether *global ignition* (fronto-parietal broadcasting) is necessary for phenomenality.  
  5. **Concessions**:  
     - *GWT concedes*: Block’s "overflow" argument (Sperling) shows GWT cannot *fully* explain phenomenal content solely via access.  
     - *Blockians concede*: Global ignition is likely necessary for *reportable, executive-guided* conscious states.  

  ### II. Disagreements Table  
  *Each row is phrased such that the assigned side endorses it as a fair characterization of their position.*  

  | Proposition                                                                 | GWT Stance                  | Blockian Stance             |  
  |-----------------------------------------------------------------------------|-----------------------------|-----------------------------|  
  | Phenomenal consciousness (P-consciousness) requires global broadcasting.   | True                        | False                       |  
  | P-consciousness can exist independently of access consciousness (A-consciousness). | False                       | True                        |  
  | The "richness" of iconic memory (e.g., Sperling) reflects P-consciousness. | False (it’s pre-conscious) | True (it’s overflow)        |  
  | Neural "ignition" (broadcasting) is constitutive of P-consciousness.      | True                        | False (it enables access)  |  
  | Introspective reports are the *gold standard* for studying consciousness. | Qualified yes (with controls) | No (they miss unreportable phenomenality) |  

  ### III. Cruxes: Tests & Predictions  
  *Each crux is a sub-question that could shift one camp’s view; tests are agreed upon as valid arbiters.*  

  #### Crux 1: *Can rich, determinate P-consciousness persist without global broadcasting?*  
  - **Test**: **Threshold-Hold Paradigm** (BCI-triggered contrast adjustment to sustain stimuli just below ignition threshold).  
    - *GWT Prediction*: Subjects report vague, fading fragments lacking determinate properties (e.g., "something blue-ish, but no shape").  
    - *Blockian Prediction*: Subjects report rich, detailed content (e.g., "clearly saw 3 tilted bars") that rapidly degrades upon access attempts.  
  - **Joint Stipulation**: If reports consistently lack determinacy *despite prolonged exposure*, Blockians would reevaluate overflow richness. If reports show richness, GWT would reconsider broadcasting’s necessity for phenomenality.  
  - **Mutual Concern**: Both agree introspection under threshold conditions may be unreliable. *Implication*: Outcome must distinguish "no phenomenality" (GWT) from "unstable phenomenality" (Block) via objective measures (e.g., neural decoding).  

  #### Crux 2: *Does attentional withdrawal abolish P-consciousness or merely its access?*  
  - **Test**: **Graded Attentional Loading**: Subjects perform high/low-load central tasks while task-irrelevant stimuli are decoded via fMRI/MEG. Stimuli are matched for low-level features but vary in complexity (e.g., Gabor patches vs. faces).  
    - *GWT Prediction*: Decoding accuracy for complex stimuli drops to chance under high load, indicating no P-consciousness without attention.  
    - *Blockian Prediction*: Decoding remains above chance for complex stimuli under high load, indicating "overflow" phenomenality.  

  #### Crux 3: *Is "ignition" a discrete threshold for P-consciousness?*  
  - **Test**: **High-Resolution Masking**: Vary stimulus-mask intervals while measuring neural dynamics (e.g., EEG ignition signatures) and forcing post-trial content discrimination *without* report (e.g., forced-choice with no time pressure).  
    - *GWT Prediction*: Discriminability sharply coincides with ignition; below threshold, performance is at chance.  
    - *Blockian Prediction*: Above-chance discriminability emerges *before* ignition, reflecting non-accessed P-consciousness.  

  ### IV. Residual Disagreement (Explicit & Irreducible)  
  - **GWT Commitment**: *P-consciousness is identical to globally broadcast content.* Unreportable states are either non-phenomenal or pre-conscious.  
  - **Blockian Commitment**: *P-consciousness is a distinct natural kind from A-consciousness.* Overflow (rich, unreportable phenomenality) is empirically plausible and necessary to explain subjective experience.  
  - **Terminological Note**: Both agree "consciousness" is often ambiguously used, but deny this dissolves the dispute. The core disagreement is ontological: *Is unreportable phenomenality a coherent scientific category?*  

  ---  

  ### Evaluation of Threshold-Hold Paradigm  
  - **Genuine Crux?** Yes, but with caveats:  
    - Both camps accept it *in principle* if integrated with neural markers (e.g., decoded content vs. subjective reports).  
    - **GWT Skepticism**: Introspection in sub-ignition states accesses only fleeting sensory buffers, not phenomenality.  
    - **Blockian Skepticism**: Forced "leisurely introspection" may alter normal processing.  
    - **Resolution**: The test is valid *only* if it combines:  
      - (a) Objective neural decoding of stimulus features during "hold" periods,  
      - (b) Post-hold forced-choice discrimination (not introspection).  
    - **Outcome Impact**: Strongly favors one side if neural decoding + discrimination aligns with predictions *without* ignition.  

  ### Verbal vs. Substantive Disagreements  
  - **Verbal**: None. Both reject defining "consciousness" as ambiguous to evade the dispute.  
  - **Substantive**: All disagreements in §II-III are empirical/ontological. The core divide is whether P-consciousness *must* be reportable (GWT) or can exist independently (Block).  

  ### Why This Works  
  - **Neutrality**: Disagreements are framed as propositions each side *endorses* (e.g., "P-consciousness requires broadcasting" is a GWT claim).  
  - **Professor-Proof**: Agreed claims cite specific paradigms; cruxes specify testable predictions; residual disagreement is explicit.  
  - **No Conversion**: Blockians retain overflow; GWT retains broadcasting as necessary/sufficient.  

  Present with confidence—this meets the brief.
