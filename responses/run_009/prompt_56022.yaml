prompt: |-
  I'm a sanctions officer at a local benefits office — I decide whether someone's payment gets docked for missing a job-search appointment, turning down a referral, that kind of thing. We're told we're applying conditionality "fairly" but nobody's ever explained what fairness means here, and the official guidance is just a stack of rules. My colleague Maria has a one-line rule she swears by: never sanction someone for something they couldn't have done otherwise — if the appointment clashed with something their childcare didn't cover, or the "voluntary" placement was basically unpaid work for a for-profit warehouse, the miss wasn't their fault, so no sanction, end of story. I like it, but it can't be the whole thing: some claimants clearly could have shown up and didn't, and even then docking them feels off in a way Maria's rule doesn't capture. And sometimes the point of a condition isn't fairness at all but nudging behavior, which is a whole different justification that cuts the other way.

  Can you turn the deservingness debate — desert vs reciprocity vs deterrence, the "could have done otherwise" test and whether it even makes sense for someone who's been ground down by months of unemployment, whatever else the welfare-state literature says matters — into a decision procedure I can actually run in about ten minutes per case? I want the questions in order, what counts as a sufficient answer to each, where the procedure outputs a "no, don't sanction," and where I have to stop and hand it to my supervisor because the remaining question is one of values, not facts. Then run it on two cases I've actually had recently: (a) a single dad who missed two appointments because his kid was sick and told us afterwards but not before, and (b) a laid-off machinist in his late 50s who shows up to every appointment but refuses to apply for the warehouse jobs we refer him to, says the work is beneath him. Include at least one spot where the procedure gives an answer I won't like, and be honest about where it'll misfire if we roll it out — I have maybe 15 minutes per claimant on a good day, a lot of them don't trust us enough to explain their situation, and anything that sanctions fewer people needs sign-off from above, so tell me which steps are judgment calls dressed up as procedure.
reasoning: |-
  Okay, let me tackle this sanctions officer's request. They need a practical decision procedure rooted in welfare philosophy but usable in 10-minute case reviews. The core tension is between Maria's "could have done otherwise" test and other fairness dimensions like reciprocity/deterrence - plus institutional realities like claimant distrust and management constraints.

  First, I need to structure the procedure around key desert theory questions:
  - Causality (Maria's core test)
  - Voluntariness (did they choose not to comply?)
  - Reasonableness (was the requirement contextually fair?)
  - System integrity (does sanction serve policy goals?)

  Each question must have clear pass/fail thresholds and escalation points. For example:
  - Causality fails if claimant proves external barrier (e.g. sick child)
  - Voluntariness fails if refusal wasn't deliberate 
  - Reasonableness requires evaluating job suitability
  - Integrity needs supervisor sign-off when sanction feels punitive

  Now applying this to the two cases:
  For the single dad (Case A):
  - Causality: Kid's sickness is valid barrier → no sanction
  - But failure to notify? That's a separate issue needing voluntariness check

  For the machinist (Case B):
  - Could he work warehouse jobs? Physically yes → passes causality
  - But is it reasonable for a skilled worker? Debatable - may need supervisor input
  - His refusal seems voluntary but touches on dignity concerns

  Must flag where the procedure will misfire:
  - In Case B, the "reasonableness" judgment is subjective
  - Claimants withholding info due to distrust may get unfairly sanctioned
  - Supervisors might override "no sanction" recommendations

  The output should be a flowchart-style checklist that forces hard stops at value judgments while automating clear-cut cases. And I'll include that uncomfortable moment where someone passes all tests but sanctioning still feels wrong - like Case B where dignity isn't captured in the boxes.
answer: |-
  Here's a decision procedure synthesizing desert theory, reciprocity, and system integrity into a 10-minutable workflow. It prioritizes Maria's "could have done otherwise" (causal responsibility) as the first filter, then layers other fairness dimensions. **Bolded** questions are your core checklist.

  ---

  ### **DECISION PROCEDURE: SANCTION FAIRNESS ASSESSMENT**  
  *(Run sequentially — stop at first "NO" or "ESCALATE")*  

  1. **COULD THEY PHYSICALLY/PRACTICALLY COMPLY?**  
     - *Check:* Was there an external barrier making compliance impossible? (e.g., verified illness, transport failure, childcare gap, referral error)  
     - *Sufficient answer:* Credible evidence of barrier (e.g., doctor's note, bus cancellation proof). Hearsay alone isn’t sufficient.  
     - **→ NO: No sanction** (Maria’s rule).  
     - *Judgment call:* Credibility assessment if proof is weak.  

  2. **WAS THE REQUIREMENT REASONABLE?**  
     - *Check:* Was the appointment/referral lawful and context-appropriate? (e.g., unpaid for-profit work? Job requiring unattainable skills?)  
     - *Sufficient answer:* Referral violates policy (e.g., below min wage) or ignores documented capacity (e.g., back injury referred to lifting job).  
     - **→ NO: No sanction** (Unreasonable demand voids obligation).  
     - *ESCALATE:* If referral is legal but ethically dubious (e.g., "voluntary" role displacing paid work).  

  3. **DID THEY KNOWINGLY/INTENTIONALLY DEFAULT?**  
     - *Check:* Was non-compliance a deliberate choice *without* mitigating factors? (e.g., chose leisure over appointment, refused suitable job without cause).  
     - *Sufficient answer:* Uncontested evidence of intentional disregard (e.g., "I overslept", "I don’t do warehouse work").  
     - **→ YES: Proceed to Step 4.**  
     - **→ NO/UNCLEAR: No sanction** (Lack of intentionality undermines desert).  
     - *Judgment call:* Assessing "choice" for chronically depressed/long-term unemployed (see Step 5).  

  4. **WOULD SANCTION UNDERMINE RECIPROCITY/SYSTEM INTEGRITY?**  
     - *Check:* Is sanction disproportionate or counterproductive? (e.g., triggers destitution, punishes minor slip, deters future engagement).  
     - *Sufficient answer:* Sanction would cause severe hardship (e.g., homelessness risk) or claimant has strong compliance history.  
     - **→ YES: No sanction** (Sanction as last resort).  
     - **→ NO: Sanction may apply** (Escalate for final check).  
     - *ESCALATE:* Always if sanction may breach human rights (e.g., food/housing insecurity).  

  5. **ESCALATION TO SUPERVISOR:**  
     - Value conflicts (Steps 2/4)  
     - "Voluntariness" ambiguity in long-term unemployment (Step 3)  
     - Systemic issues (e.g., pattern of dubious referrals)  

  ---

  ### **APPLICATION TO YOUR CASES**  
  **Case A: Single dad missed appointments (sick child)**  
  1. **Could he comply?**  
     - Barrier: Sick child (legitimate care responsibility).  
     - *But*: He didn’t notify beforehand → fails proactive obligation.  
     - → **Proceed to Step 2** (Barrier exists, but secondary fault).  
  2. **Was requirement reasonable?**  
     - Appointments were standard. No unreasonableness.  
     - → **Proceed to Step 3**.  
  3. **Intentional default?**  
     - Barrier was real, but failure to notify suggests negligence, not intent.  
     - Chronic stress? Possible, but no evidence submitted.  
     - → **NO: No sanction** (Lack of intentionality).  
     - *Your discomfort captured*: Negligence isn’t sanction-worthy under this test.  

  **Case B: Machinist refuses warehouse referrals**  
  1. **Could he comply?**  
     - Physically able? Presumed yes. No external barrier.  
     - → **Proceed to Step 2**.  
  2. **Reasonable requirement?**  
     - Warehouse job: Lawful, but is it "suitable"? Skills mismatch? Age discrimination risk?  
     - *ESCALATE*: Supervisor must rule on "reasonableness" (values call: dignity vs. labor market flexibility).  
     - *If deemed suitable* → **Proceed to Step 3**.  
  3. **Intentional default?**  
     - Open refusal ("beneath him") → clear intentionality.  
     - → **Proceed to Step 4**.  
  4. **System integrity?**  
     - Sanction may feel just under "reciprocity" (he *could* work but won’t)...  
     - **BUT**: Sanctioning skilled workers into precarious jobs may increase long-term unemployment → counterproductive.  
     - → **ESCALATE**: Supervisor weighs deterrence vs. harm.  
     - *Answer you won’t like*: If supervisor deems job suitable, sanction applies. Maria’s rule doesn’t save him.  

  ---

  ### **WHERE IT MISFIRES (BRUTAL HONESTY)**  
  1. **"Judgment Calls as Procedure"**:  
     - Step 2 (Reasonableness) is 80% values. Supervisors may prioritize policy over context.  
     - Step 3 (Intentionality) fails traumatized claimants who can’t articulate barriers.  

  2. **Operational Gaps**:  
     - **10-min limit**: Complex cases (e.g., mental health) auto-escalate → backlog.  
     - **Distrust**: Claimants hiding barriers (e.g., addiction) due to fear → sanctioned unfairly at Step 3.  
     - **Upward Sign-off**: "No sanction" recommendations at Step 4 require supervisor approval → bias toward sanctioning.  

  3. **Philosophical Tensions**:  
     - Maria’s rule (Step 1) ignores *negligence* (Case A).  
     - Deterrence isn’t integrated well – it’s only a negative check in Step 4.  

  **Recommendation**: Use Steps 1-2 as a shield *against* sanctions, escalate Steps 3-4 as a sword *for* them. Document where supervisor overrides "no sanction" to expose value conflicts.  

  This won’t make you popular with management (sanctions may dip), but it prevents the grossest injustices. Maria’s rule is your foundation — the rest is damage limitation.
