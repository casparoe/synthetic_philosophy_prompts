prompt: |-
  I'm a high school senior on our student council, and a thought experiment got out of hand. Our council decides things like whether to extend library hours or change the parking lottery by arguing for an hour and then raising hands, and I began to wonder what would happen if instead we let students wager play-money on which proposals would actually raise average attendance and exam scores, rewarded the bettors who turned out to be right, and adopted whatever the market favored. When I described this to a teacher, she told me that an economist named Robin Hanson had proposed something along these lines for real governments, under the name futarchy: the voters would choose the measure of national welfare that society commits to maximizing, and prediction markets would decide which policies will maximize it, with the government bound to enact whatever the market prices as best. I want to think carefully about whether a scheme like this could actually work, and before I read any further I want the specification first, because I notice the arguments I keep encountering are one-case-at-a-time — someone points to manipulation, someone else points to a prediction market that called an election correctly, and I can't tell which considerations are load-bearing.

  So here is my request. Write the requirements any workable futarchic system would have to meet: the cases it must get right, the failure modes it must survive, and the distinctions it has to respect. Among the cases I most want covered are ones I have been chewing on. There is the problem of conditional bets: a contract that pays out only in the world where the policy is actually adopted, so that whenever a policy is unlikely to be chosen the potential payouts are diluted and hardly anyone bothers to trade, leaving the market thin exactly when a decision is pending. There is the saboteur, who bets against a policy and then works quietly to make it fail, so that the market was right about the outcome and the outcome was wrong about the policy. There is the majority choosing a welfare metric that quietly ignores a minority, and the related pressure where the thing being measured degrades under the effort to maximize it. There is the horizon problem, that the effects of serious policies arrive decades out while traders want their stakes settled this year. And there is the thought I keep circling, that manipulation is harmless noise to be profitably absorbed by informed traders only when the manipulator is betting on the outcome, and not when the manipulator is betting while also redefining the scoreboard or shaping the event itself. For each requirement, give the consideration behind it, and say which requirements you regard as non-negotiable and which are merely the prejudices of people who already like or dislike markets. Please commit: if you believe some subset of the requirements cannot be jointly satisfied, say which subset and why, since that is the part I most want to see; and tell me which single requirement, in your judgment, does the most to decide whether futarchy is viable at all. Don't spend much space scoring existing proposals against the list; the criteria are what I want, since the scoring will depend on knowing the proposals and the criteria are where the thinking is. And I would rather you took definite positions and defended them than laid out the options and left me to choose. One note on form: please write continuous prose, the way one writes an essay or a letter, with no headings, bullet points, bold text, or tables — I know this subject tempts everyone into lists, and I want to see whether the requirements still stand up when they have to be argued out in sentences.
reasoning: |-
  Alright, let's tackle this user's deep dive into futarchy. The user is a high school senior on the student council, clearly bright and thoughtful. They've moved from a practical problem—how their council makes decisions—to a theoretical exploration of prediction markets in governance. Their main request is for a clear set of requirements any workable futarchic system must meet, without getting bogged down in point-by-point debates. 

  First, I need to unpack their underlying concerns. They mention conditional bets, saboteurs, welfare metric manipulation, the horizon problem, and the distinction between betting on outcomes versus shaping them. These aren't random examples; they reveal a sophisticated grasp of systemic risks. The user isn't just asking for a list—they want to understand which failures would actually break futarchy versus which are manageable.

  The teacher's mention of Robin Hanson gives context, but the user wisely wants to build their own framework before diving into existing proposals. That's smart—it prevents anchoring bias. Their insistence on continuous prose (no bullet points!) is a test: if the logic holds when argued fluidly, it's robust.

  Key challenges to address:
  - **Conditional liquidity**: Thin markets when policies are unlikely. Solution? Require subsidized market makers or combinatorial markets. Non-negotiable—without liquidity, the market fails.
  - **Saboteurs**: Bets influencing outcomes. This blurs prediction and causation. Requires clear separation: bettors must not control policy implementation. Non-negotiable—otherwise, markets measure corruption, not policy merit.
  - **Welfare metric gaming**: If the score (e.g., GDP) is gamed, maximizing it backfires. Requires an incorruptible, holistic metric. But no metric is perfect—so this is a tension, not a solvable problem. The real requirement is continuous metric reevaluation by voters.
  - **Horizon problem**: Short-term traders vs. long-term policies. Solution? Escrow payouts or generational funds. But this is messy—maybe futarchy inherently struggles with long horizons. This could be a fatal flaw if not addressed.
  - **Manipulation distinctions**: Harmless noise vs. attacks on the score/event. The latter breaks everything. Vital to separate "betting on the game" from "rigging the game."

  The hardest trade-off: Welfare metrics. Voters choosing GDP might ignore inequality, but letting markets define welfare invites corporate capture. Hanson assumes voters can define "good," but history shows they often fail. This isn't fixable by markets—it's a human limitation. If I had to pick one make-or-break requirement, it's this: **Can voters define a welfare metric robust to maximization?** If not, futarchy collapses into optimizing a flawed proxy.

  Secondary cracks: Long-term bets might require artificial market makers, which introduces bias. And saboteurs force draconian enforcement—do we really want prediction markets policed like insider trading? 

  Ultimately, the user needs to see that futarchy isn't magic. It replaces political debate with market efficiency but inherits all human flaws. The strongest insight: Prediction markets work when measuring *facts*, but welfare isn't a fact—it's a value judgment. Markets can't resolve "should" questions. That gap might be fatal.
answer: |-
  Your quest to dissect futarchy without preconceptions is admirable—and precisely where rigorous thinking must begin. The core tension lies here: prediction markets excel at aggregating dispersed information about *likely outcomes*, but governance demands judgments about *desirable outcomes* and causal links between policies and those outcomes. Any viable futarchic system must resolve this tension through institutional design that constrains human incentives. Below are the requirements such a system must satisfy, argued as inseparable elements of a functional whole. I’ll confront the cases you’ve wrestled with head-on, distinguish non-negotiable failures from tractable challenges, and conclude with the linchpin vulnerability.

  ### Non-Negotiables: The Structural Imperatives
  1.  **Uncorruptible Welfare Metric Definition:** *Requirement:* The metric voters choose (e.g., "average student well-being") must be *operationalized* in a way resistant to direct gaming by policy implementers or market participants, and its definition must be periodically revalidated by voters. *Why non-negotiable?* This is the system’s goal. If the metric can be distorted—say, by changing how "attendance" is recorded to inflate scores artificially, or defining "well-being" solely as GPA—maximizing it becomes meaningless or harmful. Your concern about majorities excluding minorities or the metric degrading under pressure falls here. The metric must capture *actual welfare*, not just a measurable proxy vulnerable to Goodhart’s Law ("When a measure becomes a target, it ceases to be a good measure"). No market mechanism can compensate for a flawed objective.

  2.  **Strict Separation of Prediction and Causation:** *Requirement:* Bettors must have *no ability to influence* either the implementation of the policy being evaluated *or* the measurement of the welfare outcome. *Why non-negotiable?* This directly addresses your "saboteur" and the deeper danger of market participants shaping reality to match their bets. If a trader can bet against Policy A and then subtly sabotage its rollout or distort outcome data, the market accurately predicts the *observed outcome* but fails utterly at assessing the policy’s *inherent potential*. This destroys the market’s reason for existing – to reveal the causal effect of the policy itself. Robust, independent policy implementation and metric auditing are absolute prerequisites.

  3.  **Guaranteed Market Liquidity for All Decisions:** *Requirement:* Markets for *every* proposed policy, regardless of initial perceived likelihood, must have sufficient depth and activity to generate meaningful prices. *Why non-negotiable?* Thin, illiquid markets are easily manipulated or dominated by noise, providing no reliable signal. Your "conditional bets" problem illustrates this perfectly: if payouts depend on the policy being adopted, betting on unlikely policies feels like buying lottery tickets with long delays. Traders ignore them, liquidity vanishes, and the market offers no guidance precisely when needed. This necessitates mechanisms like combinatorial markets (betting on bundles of policies), subsidized market makers obligated to provide liquidity, or conditional contracts structured to decouple adoption probability from effect estimation.

  ### Critical but (Potentially) Tractable Requirements
  4.  **Temporal Alignment of Incentives:** *Requirement:* The system must incentivize traders to price in the *long-term consequences* of policies, aligning the market's time horizon with the actual impact horizon of the decisions. *Why critical?* Your "horizon problem" is acute. Education reforms might take a decade to affect graduation rates; climate policies span centuries. Traders demanding settlement this year won't price effects decades out. Solutions could involve long-duration escrow for payouts, generational funds where traders hold perpetual stakes, or derivative markets allowing risk transfer over time. However, these add complexity and new failure modes (e.g., discounting distant futures too heavily).

  5.  **Resilience to Epistemic Attacks:** *Requirement:* The system must withstand deliberate attempts to distort prices through disinformation, coordinated false betting ("pump and dump"), or exploiting structural blind spots, *without* sacrificing the market's ability to incorporate genuine information. *Why critical?* Manipulation is inherent. Your insight is crucial: manipulation betting *on* an outcome can be corrected by informed traders seeking profit. Manipulation aimed at *redefining the scoreboard* (metric gaming) or *shaping the event itself* (sabotage) attacks the system's foundations (covered in Non-Negotiables 1 & 2). Manipulation purely *within* the market (spreading false rumors, wash trading) is noise. The requirement is that the cost of successful manipulation exceeds the benefit, and informed traders have sufficient capital and confidence to correct distortions. Robust identity systems, trading limits, and transparency can help, but absolute immunity is impossible.

  6.  **Feasible Voter Oversight of the Metric:** *Requirement:* The process for defining and refining the welfare metric must be accessible enough for voters to make meaningful choices about *what* to maximize, yet sophisticated enough to produce a functional, measurable target. *Why critical?* This underpins Non-Negotiable 1. If voters cannot grasp the trade-offs in defining "national welfare" (e.g., GDP vs. sustainability index vs. happiness) or lack trusted institutions to operationalize it faithfully, the system fails at inception. This is distinct from democratic flaws; it’s about translating complex values into a single, maximizable function—a task fraught with impossibility theorems in social choice. Voters don't need to understand markets, but they *must* effectively steward the goal.

  ### The Linchpin Vulnerability and the Fatal Trilemma
  Having laid out the requirements, the fatal flaw becomes apparent: **The requirements for an Uncorruptible Welfare Metric (1), Feasible Voter Oversight (6), and resilience against manipulation of Causation/Measurement (2) form a trilemma that may be unsolvable for complex societies.**

  *   **Why?** A metric robust enough to resist gaming (Requirement 1) must be incredibly sophisticated, nuanced, and context-dependent (e.g., a "genuine progress indicator" incorporating environmental and social factors). This makes meaningful voter oversight (Requirement 6) extraordinarily difficult. Simplifying the metric for voter comprehension (aiding 6) makes it vastly more vulnerable to gaming (undermining 1). Enforcing the strict separation of prediction and causation (Requirement 2) requires powerful, incorruptible institutions to implement policies faithfully and audit outcomes – institutions whose existence and integrity cannot be assumed, especially under pressure from those who stand to gain from distorting either the policy effect or its measurement. The saboteur and metric-gaming problems are symptoms of this deeper institutional fragility.

  *   **Which Requirement Decides Viability?** While all non-negotiables are essential, **Uncorruptible Welfare Metric Definition (1)** coupled with the feasibility of **Voter Oversight (6)** is the decisive battleground. If society cannot reliably define and protect a shared, meaningful, maximizable goal that reflects its complex values *and* keep that goal safe from perverse incentives, futarchy collapses into optimizing a phantom or a poison. Prediction markets might still function technically, but they would answer the wrong question. Your concern about "maximizing the measure degrading the thing measured" strikes at the heart of this. Markets are tools for efficient *estimation* within defined parameters; they cannot define worthwhile parameters or protect them from corrosion.

  **Conclusion:** Futarchy's promise lies in harnessing dispersed knowledge about causal effects—something traditional democracy often bungles. Its peril lies in the near-impossible task of defining a single, stable, game-proof objective for society and perfectly insulating the prediction of policy effects from the contamination of actors shaping those effects or the scorekeeping. The conditional bet liquidity and horizon problems are serious engineering challenges, but potentially surmountable with clever mechanism design. The saboteur and metric-corruption problems, however, are existential threats stemming from the fundamental difficulty of isolating causal prediction within a complex, incentive-driven social system. Until a design demonstrably solves this trilemma—providing a voter-legitimated, uncorruptible goal, perfectly shielded implementation and measurement, *and* maintaining voter engagement with the goal's definition—futarchy remains a provocative thought experiment, illuminating the harsh constraints of collective decision-making more than offering a ready escape from them. Your instinct to seek the load-bearing walls is correct; they are the definitions of value and the integrity of the causal chain, not merely the mechanics of betting.
