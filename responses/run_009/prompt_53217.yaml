answer: |-
  ### Essay Question (90-minute exam)

  **Tracking Dilemma Argument:**  
  Consider the following argument against moral realism:  

  1. Either our evaluative faculties were shaped by evolutionary forces sensitive to independent evaluative truth, or they were not.  
  2. If *not* so shaped, the correlation between our evaluative beliefs and evaluative truth is inexplicable (a massive coincidence), rendering those beliefs unjustified.  
  3. If *so* shaped, then:  
     - Either evaluative facts reduce to facts about reproductive fitness (unacceptable to realists),  
     - Or natural selection was sensitive to irreducibly normative properties (unintelligible, since fitness effects are non-normative).  
  4. Therefore, moral realism is false.  

  **Your Task:**  
  Critically evaluate this argument. Your essay must:  
  (A) Explain how Premise 2 strengthens the standard evolutionary debunking challenge (e.g., versus Street).  
  (B) Test whether Premise 2’s demand for a "non-coincidental explanation" overgeneralizes. Use mathematical intuition, perceptual belief, and introspection as test cases. Address whether asymmetries between normative and non-normative domains can block overgeneralization.  
  (C) Assess if a "third-factor" response (e.g., Enoch-style) resolves the dilemma. Does it survive debunking or relocate the problem?  
  (D) **Crucial Challenge:** Can realists reject Premise 2’s coincidence requirement? If so, does this move defensibly undermine the argument, or merely evade it? Justify your verdict.  

  ---

  ### Model Answer (700 words)  

  The Tracking Dilemma presents moral realists with a sharper challenge than standard debunking arguments. Premise 2’s insistence that absent truth-tracking origins, belief-truth correlations are *coincidental* (hence unjustified) intensifies Street’s original dilemma. Street argued that evolutionary forces *bypassing* truth could explain beliefs, but Premise 2 adds that if evolution didn’t track truth, any alignment of beliefs with truth would be *miraculously lucky*. This frames realism as requiring an implausible cosmic accident.  

  **Overgeneralization Problem**  
  Premise 2 relies on a principle: *If a faculty’s origins don’t explain truth-tracking, belief-truth correlations are coincidental and unjustified*. This risks overgeneralization:  
  - **Mathematics**: Evolution likely favored useful heuristics (e.g., "≈3 prey"), not truth-tracking of abstract numbers. Yet we trust "2+2=4." If Premise 2 holds, mathematical realism collapses.  
  - **Perception**: One might argue perception avoids coincidence because objects *cause* perceptual states. But this fails for normative properties: irreducible moral facts lack causal powers. If realists invoke causation to "explain" perception’s truth-connection, they implicitly concede moral properties *must* be reducible to exert causality—undermining non-naturalism.  
  - **Introspection**: Beliefs like "I am in pain" seem directly self-verifying. Their evolutionary origins don’t invoke truth-tracking, yet we don’t deem them coincidental. This suggests Premise 2’s principle is flawed.  

  The asymmetry defense—that perception’s causal history breaks the analogy—only succeeds by *reducing* truth-conditions to causal relations. Non-naturalist realists cannot replicate this for morality without abandoning irreducibility.  

  **Third-Factor Responses**  
  Enoch’s third-factor solution posits an independent link (e.g., survival *is* good) explaining why evolution converged on moral truth. But this relocates the dilemma:  
  - If the third factor (e.g., "survival’s goodness") is *itself* a moral belief, its justification is circular.  
  - If it’s non-moral (e.g., "survival promotes flourishing"), we ask: *How do we know this correlation holds?* Either it requires independent justification (risking regress), or its origins invite *new* debunking worries. Thus, third factors push the coincidence problem upstream.  

  **Rejecting the Coincidence Premise**  
  The realist’s strongest move is rejecting Premise 2’s core demand: that justification *requires* explaining belief-truth correlations. This is a substantive epistemological commitment—*explanationism*—which realists can deny. For instance:  
  - We trust mathematics *without* an evolutionary truth-tracking story because its self-evidence provides immediate justification. Similarly, moral realists might argue evaluative intuitions are *prima facie* justified absent defeaters.  
  - Crucially, debunkers assume that *any* non-truth-tracking origin *defeats* belief. But realists could insist that origins only matter if they reveal *systematic dysfunction* (e.g., visual illusions). Evolution may explain *why* we have moral intuitions without showing they *misrepresent*.  

  However, this risks evasion. If realists reject explanationism, they must:  
  (i) Explain why mathematics/perception don’t need truth-tracking origins *but morality does*, or  
  (ii) Defend a broader epistemology where origins rarely threaten justification.  

  Option (i) fails—it arbitrarily privileges non-normative domains. Option (ii) is defensible but costly: it requires arguing that *all* domains (math, morality, etc.) face similar debunking pressures, and we must accept basic trust in intuition. This concedes that realism survives only by weakening epistemic standards universally.  

  **Verdict**  
  The Tracking Dilemma’s force depends on accepting explanationism. Realists can block it by rejecting this demand, but only by endorsing an intuitionist epistemology that insulates all basic beliefs—moral or mathematical—from genealogical critique. This is coherent but philosophically contentious. Premise 3’s reductio against tracking-by-selection stands, but without Premise 2, the realist escapes the dilemma’s first horn. Thus, the argument’s success hinges on whether we accept that justification demands non-coincidental explanations.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-Hit Points:**  
  1. **Accurate Reconstruction (4 marks)**  
     - Notes Premise 2’s "coincidence" clause as strengthening Street by framing non-tracking origins as *justification-undermining luck*.  
     - *Common error: Merely paraphrases without contrasting Street.*  
  2. **Overgeneralization Analysis (6 marks)**  
     - States Premise 2’s implicit principle: *"No non-coincidental explanation of belief-truth correlation → unjustified belief."*  
     - Tests math (no tracking → coincidence), perception (causality breaks analogy only if moral properties reducible), introspection (self-verification challenges principle).  
     - *Common error: Claims "it proves too much" without specifying the principle or domain asymmetries.*  
  3. **Third-Factor Critique (4 marks)**  
     - Notes circularity/regress: Third factors either presuppose moral justification or face new debunking.  
     - *Common error: Just describes Enoch’s view without evaluating its vulnerability.*  
  4. **Epistemological Crux (7 marks)**  
     - Identifies rejection of explanationism as realist’s escape.  
     - Argues this requires endorsing intuitionism for all domains (not just morality).  
     - *A/B divider: A answers show this forces metaepistemological trade-offs; B answers vaguely assert "realists can reject Premise 2."*  
  5. **Final Verdict (2 marks)**  
     - Clear position: e.g., "Realists escape by denying explanationism, but at epistemological cost."  
  6. **Premise 2 Strengthening (1 mark)**  
     - Explicitly notes Premise 2’s "coincidence" clause is the novel, high-stakes element.  
  7. **Structure/Clarity (1 mark)**  
     - Logically organized; precise terminology.  

  **Grading Thresholds:**  
  - **A (21–25):** Hits all points; rigorous on overgeneralization (e.g., explains why perception’s "causal solution" fails non-naturalism) and epistemological crux.  
  - **B (16–20):** Completes tasks but superficial on overgeneralization (e.g., asserts asymmetry without argument) or epistemological escape.  
  - **C (11–15):** Misunderstands dilemma; ignores overgeneralization test; lists positions without analysis.  
  - **D/F (0–10):** Major omissions/errors.
