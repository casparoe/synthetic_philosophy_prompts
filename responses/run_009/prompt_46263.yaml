prompt: |-
  I've never taken a philosophy class, so bear with me. For about two years now I've been turning over this question of whether you're obligated to vote for the lesser evil, and I've finally got my position worked out, and I've been invited to present it at our monthly discussion group, which is scarier than it sounds because these people argue for fun.

  Here's my view in short. The usual trap is: either your vote is a tiny drop in the ocean, in which case it doesn't matter who you pick, or voting is about expressing who you are, in which case voting for someone you despise just to block someone worse is a kind of lie. I think both framings are wrong, and here's my alternative: when you vote you shouldn't ask "what does my one vote cause?" but "what would be right for everyone in my situation to do?" And there's a real difference between those questions, because with millions of people in your situation, the rule "vote for the worst option on the ballot that can actually win, and stay home if you can't stomach that" produces a different world than the rule "vote your heart or stay home." So even though my individual ballot changes almost nothing, I'm still doing the right or wrong thing, the same way (I think) you can be one of a hundred litterers and still each of you litters. From this I conclude that voting lesser evil is usually required, not just permitted, unless the two evils really are close enough that the difference washes out.

  The group, so you know who's coming at me. It's about fifteen people at someone's house, mostly professionals, no academics, but they've all done their reading and they love numbers. Three of them matter most. There's Dan, a statistician type who has actually looked into how close elections are decided by one vote (basically never) and thinks the whole thing comes down to expected value, and he'll do the arithmetic out loud if nobody stops him. There's Priya, who has voted Green in every election since forever and thinks a lesser-evil vote is how you keep getting offered nothing but evils -- to her, the "everyone in your situation" move is exactly backwards, because the situation we're trying to change is the one where millions of people feel forced to vote for the lesser evil. And there's Marcus, who doesn't vote at all and considers it the only honest position; he also thinks my littering analogy is terrible and will tell me so. The rest are persuadable but quiet.

  What I want from you is a prep sheet. List the objections these three (and maybe a couple from the quiet ones) will actually raise, in rough order of how much damage each could do to my case, each phrased the way that person would say it, with a reply I can actually deliver in two minutes without a blackboard, and a note on where the reply is shaky. Also tell me what I should just concede up front so I look like someone who's thought about it rather than someone who hasn't. And include the question I'm quietly hoping nobody asks, because somebody will. I'd rather find out now than on Thursday.

  One more thing: don't give me a reading list. The talk is in four days and I don't have time to read anything, I just need to survive the room.
reasoning: |-
  Okay, the user has never taken a philosophy class but has developed a position on voting for the lesser evil. They're presenting this at a discussion group with knowledgeable members who enjoy arguing. The main objections will come from Dan, Priya, and Marcus. 

  First, understanding the user's view: They reject the idea that a single vote doesn't matter or that voting is purely expressive. Instead, they argue for a rule-based approach where the collective action of people in similar situations matters. The littering analogy is key here. 

  Now, considering the opponents:
  - Dan, the statistician, will focus on probability and expected value. He'll argue that since one vote almost never changes the outcome, the expected impact is negligible. The user needs a reply that shifts from individual impact to collective responsibility without getting bogged down in math.
  - Priya, the Green voter, believes lesser-evil voting perpetuates a broken system. She'll challenge the "everyone in your situation" framing, arguing it locks in the status quo. The user must address how their rule could actually change the system over time without dismissing Priya's long-term goals.
  - Marcus, the non-voter, will attack the littering analogy and see voting as inherently dishonest. His critique might resonate with the quiet attendees, so the reply needs to reframe voting as participation in a collective duty rather than endorsement.

  The quiet attendees might bring up moral compromises or the "close enough" exception. The user should concede that if candidates are virtually identical, abstaining is reasonable—this shows nuance. 

  The "hope nobody asks" question is likely about situations where the lesser evil is still terrible. The user must admit their rule has limits in extreme cases, which preempts charges of absolutism. 

  For replies: Keep them concise, principle-focused, and avoid technical jargon. Acknowledge valid points where possible (e.g., Dan's math is right but misapplied; Priya's idealism is noble but risky). The littering analogy is indeed shaky—Marcus will pounce on that—so the user should reframe it as a coordination problem instead of a direct parallel. 

  Key concessions: 
  - Individual votes rarely matter (disarms Dan). 
  - Lesser-evil voting feels awful (connects with Priya). 
  - The littering analogy isn't perfect (preempts Marcus). 

  This builds credibility. The nightmare question (terrible lesser evil) requires admitting the rule isn't mechanical—it hinges on how bad "worse" really is. The user should emphasize it's a threshold call, not a formula. 

  Overall, the user needs to project thoughtfulness, not dogma. Their strength is the rule-utilitarian framing; weaknesses are the analogy and edge cases. Staying calm when Marcus attacks the analogy is crucial—pivoting to "coordination problem" saves it. If Priya calls the system broken, agree but argue that within it, coordination reduces harm now while working for change.
answer: |-
  Here's your prep sheet, designed for quick absorption and damage control. Focus on the core arguments--no fluff, no reading lists. I've ranked objections by potential damage (High/Med/Low) and included concession points to build credibility.

  ---

  ### **Your Core Position Recap**
  - **Don't ask:** "What does *my* vote cause?" (too small to matter)  
  - **Don't ask:** "What vote expresses *me*?" (forces moral compromise)  
  - **Ask:** "What rule should *everyone like me* follow?"  
  - **Rule:** Vote for the worst *electable* option you tolerate, or stay home.  
  - **Why:** If millions follow "vote heart/stay home," unviable candidates split votes, increasing the worst candidate's win chance. Your rule minimizes harm.  
  - **Littering Analogy:** Each litterer is wrong *even if* their trash alone changes nothing.

  ---

  ### **Top Objections & Replies**  
  *(Ordered by Threat Level)*

  1. **Priya (High Threat: Undercuts your rule’s long-term logic)**  
     *Objection:* "Your rule traps us in the lesser-evil cycle forever. If 'everyone like me' always votes for the lesser evil, parties never need to change. My Green vote isn’t wasted—it builds pressure for alternatives. Your approach is self-defeating."  
     **Your Reply (1 min):** "The rule *only* applies when the alternative is an unacceptable loss. If the lesser evil is still terrible, *and* there's a viable movement to build alternatives (like ranked-choice voting or new parties), then 'everyone like me' should support *that* movement. But in a winner-takes-all election *tomorrow*, where the alternative is catastrophic (e.g., fascism vs. corruption), coordination prevents disaster. Your vote for change matters most *between* elections."  
     *Weakness:* Vague on how to define "viable movement." Priya may argue Greens *are* that movement.  

  2. **Dan (High Threat: Dismisses your entire premise with math)**  
     *Objection:* "Let’s do expected value. Your vote has a ~1 in 10 million chance of mattering in a swing state. Even if your vote flips the election, the policy difference between evils might save 10,000 lives. So: (1/10,000,000) * 10,000 = 0.001 lives saved. Not worth the moral compromise. Stay home."  
     **Your Reply (45 sec):** "This isn’t about *my vote’s* expected impact—it’s about whether a *rule* for millions is rational. If all 10 million 'marginal voters' like me followed Dan’s math and stayed home, the worst candidate wins in a landslide. But if we all follow *my* rule, we block that outcome. You can’t escape collective obligation by being small."  
     *Weakness:* Dan might counter that if everyone *thinks* like him, they still all stay home. You need to stress: "Rules work if people believe in them, even imperfectly."  

  3. **Marcus (Med Threat: Attacks your analogy, resonates with quiet folks)**  
     *Objection:* "Littering is *inherently* wrong—it directly harms the environment. Voting lesser evil is *endorsing* a corrupt system. It’s like saying: 'If everyone spits in the soup, my spit won’t matter.' But I refuse to spit. Non-voting is the only clean hands option."  
     **Your Reply (1 min):** "Littering was an analogy for *collective harm*, not moral equivalence. The soup metaphor assumes voting *causes* harm. But if Candidate B will poison the whole soup, and Candidate A only poisons half, voting for A *reduces* harm. Refusing to choose doesn’t stop the soup from being poisoned—it just makes B’s win more likely. This isn’t about purity; it’s about harm reduction."  
     *Weakness:* Marcus will say you’re "complicit." Concede voting feels dirty but argue that *inaction* isn’t neutral.  

  4. **Quiet Person #1 (Low Threat: Moral discomfort)**  
     *Objection:* "If I vote for the lesser evil, am I responsible for their crimes?"  
     **Your Reply (30 sec):** "No. You’re responsible for *preventing worse crimes*. If you slow down a driver rushing a dying child to the hospital, and they run a red light, you’re not liable for the traffic violation. Context matters."  

  5. **Quiet Person #2 (Low Threat: Your "close enough" loophole)**  
     *Objection:* "You say we can abstain if evils are 'close enough.' Who decides that? Isn’t that just 'voting your heart' in disguise?"  
     **Your Reply (30 sec):** "Fair point. My threshold: if the candidates’ policies would cause *significantly* different harms (e.g., one guts healthcare, the other bans abortion), vote. If their impacts are negligible (e.g., both cut taxes 1% vs. 1.5%), abstain. It’s subjective, but so is all ethics."  

  ---

  ### **Strategic Concessions (Say These Early)**  
  - "Dan is *right* that one vote almost never matters. My argument isn’t about impact—it’s about principle."  
  - "Priya is *right* that lesser-evil voting feels soul-crushing. We *should* fight for better options."  
  - "Marcus is *right* that my littering analogy is imperfect. Voting is more complex than dropping trash."  
  - **Why concede?** Shows you’ve wrestled with their views. Robs them of "gotcha" moments.  

  ---

  ### **The Question You Hope Nobody Asks (But Someone Will)**  
  **Q:** *"What if the 'lesser evil' is still terrible? Say both support genocide, but one kills 10% fewer people. Is voting for them 'required'? Isn’t that monstrous?"*  
  **Your Reply (Stay calm, 1 min):** "This is the hardest case. If the difference is *trivial* (10% vs. 11%), abstain—my 'close enough' clause applies. But if it’s *vast* (10,000 vs. 1 million deaths), then yes, voting for the lesser evil is tragically necessary. We’d condemn someone who refused to divert a trolley killing 1 million onto a track killing 10,000 because 'both are wrong.' In real politics, we rarely face such extremes—but if we do, reducing harm isn’t monstrous; it’s the least bad option."  
  **Why it’s dangerous:** Forces you to defend a grim utilitarian choice. Quiet folks may recoil. *Mitigation:* Stress this is rare, and pivot to: "This is why we must prevent such choices *before* Election Day."  

  ---

  ### **Delivery Tips**  
  - **Dan:** Smile when he does math. Say: "I agree with your numbers, but disagree on what they imply."  
  - **Priya:** Validate her idealism: "I wish we lived in the world you’re fighting for."  
  - **Marcus:** Don’t get baited into analogy debates. Say: "I take your point—let me reframe."  
  - **Quiet folks:** Make eye contact when replying—they’re your real audience.  
  - **When stuck:** "That’s a great point—I’ll think on it. But for now, my view is..."  

  **You’ve got this.** Your argument is coherent and ethically grounded. They’ll attack—but you’re ready. Good luck Thursday.
