prompt: |-
  I recently came into a significant raise, and I'm now deciding what fraction of my income to give away. My older sister, who reads a lot of popular philosophy, has strong views about where the bar is, and she delivered herself of this summary: "The demandingness objection refutes consequentialism once and for all. Because consequentialism counts everyone's wellbeing equally, a consequentialist has to keep donating until the next donation would cost her as much as it would help its recipients — in effect giving until she's roughly as badly off as the global poor. Since no one could reasonably be required to live that way, and since nobody actually does, consequentialism is false, which is why Singer's drowning child argument fails. Besides, some contemporary philosopher showed that when others aren't doing their share, you only owe the share you'd owe if everyone complied, so this is mostly academic." I'm inclined to think she's overselling, but I can't locate the errors myself, and the stakes are immediate for me.

  Please respond as a professional moral philosopher. Before answering, take a moment to brainstorm from the consequentialist's side: what would a defender say is wrong with each step of this? Then audit her summary claim by claim — what is accurate, what is a subtle distortion, and what a defender of consequentialism would flatly deny. I'd especially like to know: (1) whether the "donate until the next gift costs you as much as it helps" framing is really the source of consequentialism's demandingness, or whether the demandingness arises differently (say, from the aggregation of many small benefits to distant people); (2) whether her inference that Singer's drowning child argument fails follows from anything correct in the summary, or whether that argument is independent of consequentialism altogether; and (3) whether the share-under-full-compliance idea she mentions is a real position, and if so whether it supports her conclusion or actually cuts the other way.
reasoning: |-
  Okay, the user has a significant raise and is deciding how much to donate. Their sister made a philosophical argument against consequentialism, particularly targeting Singer's ideas. I need to address her points step by step as a moral philosopher.

  First, the sister's main claim is that the demandingness objection refutes consequentialism. She argues that consequentialism requires giving until you're as badly off as the global poor. A consequentialist defender would counter that this is an oversimplification. Marginal utility is key—each dollar given has less impact as you give more. Consequentialism doesn't demand equal suffering; it's about maximizing overall good. You stop when the cost to you outweighs the benefit to others. Also, partiality to oneself is allowed to some extent, which reduces the demand.

  Next, she says Singer's drowning child argument fails because consequentialism is false. But that argument is actually independent—it's about easy rescues. You don't need full consequentialism to accept it; even moderate ethics support saving a child right in front of you. So her inference here is flawed.

  Then she mentions the share-under-full-compliance idea. This is from philosophers like Murphy. But Murphy's model actually requires giving your fair share even if others don't comply, which could still be demanding. It's not a free pass to do nothing. Plus, consequentialists might argue that partial compliance changes obligations, so you might need to give more, not less.

  Now, the user's specific questions: 
  1. The "donate until cost equals benefit" framing is a misunderstanding. Demandingness comes from aggregation of small benefits to many people, not equal suffering. 
  2. Singer's drowning child argument stands on its own, separate from consequentialism's demandingness. 
  3. The fair share idea exists but doesn't support her conclusion; it might actually require significant giving.

  The user's deeper needs: they might feel conflicted between guilt over not giving enough and practical self-interest. They need clarity to make an informed donation decision without extreme pressure. Highlighting moderate approaches could help them find a balance.
answer: |-
  As a professional moral philosopher, I'll address your sister's claims systematically. Her summary contains both accurate representations and significant distortions of the arguments, which I'll break down claim-by-claim. I'll then answer your three specific questions directly. My aim is to provide conceptual clarity so you can make an informed ethical decision.

  ### **Brainstorm: How a Consequentialist Would Respond**
  A consequentialist defender (e.g., of utilitarianism) would reject your sister's reasoning on these grounds:
  1. **Marginal Utility, Not Equal Suffering**: Consequentialism requires donating until the *marginal utility* of your next dollar does more good for others than it costs you—not until your overall wellbeing equals the global poor's. This threshold is reached long before absolute deprivation.
  2. **Reasonable Partiality**: Most modern consequentialists (e.g., Peter Singer in *The Life You Can Save*) allow for moderate self-preference. You need not sacrifice your basic projects, relationships, or mental health.
  3. **Empirical Nuance**: The cost/benefit ratio of aid is dynamic. Effective charities (e.g., malaria bed nets) provide massive wellbeing gains per dollar, making moderate donations highly impactful without demanding ruinous sacrifice.
  4. **The Drowning Child Analogy**: This thought experiment is designed to bypass demandingness debates by appealing to intuitive duties in emergencies—and it succeeds independently of full consequentialism.
  5. **Fair Shares ≠ Minimal Shares**: The "fair share under full compliance" view (e.g., Liam Murphy's *Moral Demands in Nonideal Theory*) still imposes significant obligations when others defect, and may even *increase* demands in crises.

  ---

  ### **Claim-by-Claim Audit of Your Sister's Summary**
  **Claim 1**: *"The demandingness objection refutes consequentialism once and for all."*  
  - **Accuracy**: The demandingness objection *is* a major critique (e.g., Bernard Williams, Susan Wolf).  
  - **Distortion**: It hasn't "refuted" consequentialism. Consequentialists have sophisticated replies (e.g., scaling demands to capacity, emphasizing joy in giving), and the objection applies more to *act-utilitarianism* than to rule-based or hybrid forms.  
  - **Defender's Denial**: Consequentialism remains a live theory; demandingness is a challenge, not a knockout blow.

  **Claim 2**: *"A consequentialist has to keep donating until [...] she's roughly as badly off as the global poor."*  
  - **Accuracy**: Early utilitarians (e.g., Sidgwick) *did* imply extreme sacrifice, and Singer's initial formulation (1972) leaned this way.  
  - **Distortion**: This ignores **diminishing marginal utility**. If you earn $100,000, giving away $90,000 might leave you destitute while providing minimal extra benefit—a net utility *loss*. Consequentialism forbids this. You stop when your next dollar would harm you more than it helps others (e.g., Singer now endorses a 10% donation floor).  
  - **Defender's Denial**: No serious consequentialist demands equal wellbeing. The goal is *optimal* giving, not levelling down.

  **Claim 3**: *"No one could reasonably be required to live that way, and since nobody actually does, consequentialism is false."*  
  - **Accuracy**: Demandingness *is* cited as evidence of counterintuitiveness (e.g., "ought implies can").  
  - **Distortion**: Consequentialists argue that rarity of compliance doesn't invalidate a theory (e.g., few meet Kantian duties perfectly). "Reasonable" is contested—consequentialists see partial compliance as a moral failing, not proof of impracticality.  
  - **Defender's Denial**: That people *don't* act optimally doesn't mean they *shouldn't*. Consequentialism often aims to reform intuitions (e.g., condemning historical norms like slavery).

  **Claim 4**: *"[This] is why Singer's drowning child argument fails."*  
  - **Accuracy**: None. This is a non sequitur.  
  - **Distortion**: The drowning child argument (save a child in a pond at small cost) is **modular**: it works even if full consequentialism fails. It targets our duty in *low-cost, high-impact emergencies* and is widely accepted by non-consequentialists (e.g., deontologists).  
  - **Defender's Denial**: The argument's force is independent; rejecting it requires denying that easy rescues are obligatory—a tough position.

  **Claim 5**: *"Some contemporary philosopher showed that when others aren't doing their share, you only owe the share you'd owe if everyone complied."*  
  - **Accuracy**: Liam Murphy's *fair share theory* (2000) argues this.  
  - **Distortion**: Murphy's view **does not absolve you of significant giving**. If the global poor need $100 billion/year, and 1 billion people should contribute, your "fair share" is $100/year—but few pay even this. Consequentialists also note that in crises (e.g., famine), fair shares may *increase* when others defect.  
  - **Defender's Denial**: Murphy's view is controversial. Consequentialists (e.g., Singer) argue noncompliance *heightens* obligations for the affluent ("if you're the only one at the pond, you must save the child").

  ---

  ### **Direct Answers to Your Questions**
  **1. Is "donate until cost = benefit" the source of demandingness?**  
  No. The framing is a **misunderstanding of marginal utility**. Demandingness arises primarily from **aggregation**: many small sacrifices by you can avert immense suffering for others (e.g., $5,000 may save a life). Since global poverty is vast, consequentialism asks for more than commonsense morality—but *not* destitution. The "equal wellbeing" claim is a straw man.

  **2. Does demandingness invalidate Singer's drowning child argument?**  
  No. The drowning child argument **stands independently**:
  - It targets intuitions about **easy rescues** (low cost/high urgency), not systemic obligations.
  - It requires only that you save a life when you can do so at trivial cost (e.g., ruining your shoes). Most ethical theories accept this.
  - Rejecting it implies you could walk past a drowning child—a bullet few will bite.

  **3. Is the "share under full compliance" a real position? Does it support her?**  
  Yes, it's real (Murphy's theory), but **it cuts against her conclusion**:
  - **Reality**: Murphy argues you need only contribute your portion of the *optimally coordinated solution* (e.g., if all gave 1%, poverty could be solved).
  - **Why it doesn't help her**:  
    - Your fair share could still be substantial (e.g., 5–10% of income).  
    - Murphy stresses this is a **floor, not a ceiling**; you may still have duties to do more.  
    - Consequentialists reply that in nonideal conditions (e.g., mass noncompliance), fairness may demand *more* from you to compensate for others' failures.  
  - **Key point**: This theory reduces demands *only if* your fair share is small—but given current giving rates (<0.5% average in rich nations), your share is likely higher than you expect.

  ---

  ### **Practical Implications for Your Donation Decision**
  Consequentialism (and its critics) suggests:
  - **Start with a sustainable percentage** (e.g., 1–5%), increasing as your salary grows.  
  - **Prioritize effectiveness**: Give to top charities (e.g., GiveWell's recommendations), where small sums do enormous good.  
  - **Avoid all-or-nothing thinking**: Even partial compliance saves lives. Singer's "drowning child" analogy implies that *some* giving is obligatory, but not necessarily 90%.  
  - **Consider hybrid approaches**: E.g., give 10% to effective charities (consequentialist), but retain funds for personal goals (moderate partiality).

  Your sister's summary oversimplifies a nuanced debate. While consequentialism *is* demanding, its requirements are neither impossible nor unreasonable for those with affluence—and the core insight that we should help others at small cost remains compelling. If you'd like concrete giving strategies or further philosophical references, I'm happy to provide them.
