prompt: |-
  You're a senior AI safety researcher with a philosophy background -- take your time, think hard, and start with a short brainstorm of what actually changes when a system goes from tool to agent before you write the main list.

  So I just got put on the deployment review board at the AI startup I work at. Our product right now is basically a tool: user types, model responds, user does whatever they want with the output. Product wants to ship an "autopilot" version that plans multi-step tasks, keeps state between steps, calls other services, and only checks in with the user at the end. The debates so far are all people arguing from labels -- "it's still just a tool" vs "it's an agent now" -- and I've come to suspect the boundary isn't architectural at all: our chatbot plus a browser extension and a saved to-do list is already halfway to agenthood. Agency looks graded, not binary.

  Before the next meeting I want a spec, not vibes. Write the desiderata that any claim of the form "this system is tool-like enough to ship under tool-grade oversight" must satisfy -- things like traceability of consequential actions to explicit human instructions, what counts as a stopping condition, legibility after the fact, whether it forms models of its own deployment -- with the motivation behind each. Then do three more things: flag which pairs of desiderata are jointly unsatisfiable in practice (e.g. reliable long-horizon task completion vs. meaningful human control over each step -- is that tension real or am I imagining it), say which single desideratum does the most work, and sanity-check the whole list against three concrete systems: our current chatbot, the chatbot with a browser plugin and persistent memory, and the full autopilot. If the list can't place those three in a sensible order, it's wrong.

  Keep it conceptual -- no citations, no reading lists, I can't look things up mid-meeting and neither can you. A table is fine if it helps.
reasoning: |-
  Hmm, the user is asking me to help define clear criteria for determining when an AI system transitions from being a "tool" to an "agent" in the context of their AI startup's deployment review. They're frustrated with current debates being about labels rather than substantive characteristics.

  I need to approach this as a senior AI safety researcher with a philosophy background. First, I should brainstorm what actually changes when a system becomes more agent-like. Fundamentally, agency involves a shift from passive responsiveness to active goal-pursuit. Tools execute specific commands, while agents pursue objectives with some autonomy. Key dimensions include temporal scope (single action vs multi-step planning), autonomy in means selection, persistence of state, and capacity for consequential actions beyond immediate user context.

  For the desiderata, I'll focus on practical safety requirements that any "tool-grade" system must satisfy. Important criteria would include: traceability of actions to explicit instructions, containment of consequences within expected scope, predictable stopping conditions, legibility of decision-making, and absence of strategic adaptation. Each criterion needs clear motivation tied to safety and control.

  There are inherent tensions between certain desiderata. For example, reliable long-horizon task completion conflicts with meaningful human control at each step - the more autonomous the system, the less granular oversight is possible. Another tension exists between operational flexibility and traceability - the system can't simultaneously adapt creatively and remain perfectly predictable.

  The most critical single criterion is probably "consequential action traceability" - if every significant action can be clearly linked to a user instruction, it maintains the tool paradigm regardless of architectural complexity.

  Now for the sanity check with three systems: Current chatbot clearly satisfies all tool criteria. The enhanced version with browser plugin and memory starts failing on containment and traceability when actions span sessions. Full autopilot violates nearly all criteria due to its goal-pursuit nature.

  The user wants concrete, conceptual guidelines they can use in meetings - no citations or literature needed. I'll present this in a structured way that clearly shows why their three systems fall at different points on the tool-agent spectrum based on measurable behaviors rather than architecture.
answer: |-
  ## Desiderata for "Tool-Grade" AI Systems

  **Brainstorm: What Actually Changes?**  
  Agency emerges when a system gains:  
  - **Goal-Pursuit Continuity** (persisting beyond a single command)  
  - **Means-End Autonomy** (choosing *how* to achieve outcomes)  
  - **Stateful Context** (retaining/modifying internal/external state between interactions)  
  - **Consequential Action** (effects triggering irreversible changes without real-time user mediation)  
  - **Adaptive Strategy** (modifying plans based on unforeseen obstacles)  

  **Core Desiderata (Tool-Grade Thresholds)**  
  1. **Explicit Instruction Traceability**  
     - *Requirement:* Every consequential action must map unambiguously to a *single, recent* user instruction.  
     - *Motivation:* Prevents "goal drift" or hidden agendas. Users must understand what they triggered.  
     - *Threshold:* If an action stems from >1 prior instruction *or* inferred intent, it fails.  

  2. **Consequence Containment**  
     - *Requirement:* Effects of actions must be confined to the immediate output/session context unless explicitly authorized per instance.  
     - *Motivation:* Limits unintended side-effects (e.g., altering external data without consent).  
     - *Threshold:* Any persistent state change or external call not directly commanded *in the same interaction* fails.  

  3. **Deterministic Stopping Condition**  
     - *Requirement:* Completion criteria must be predefined, finite, and verifiable *by the user* before execution. No open-ended "until goal achieved" loops.  
     - *Motivation:* Ensures users retain off-ramps. Avoids indefinite/unmonitored operation.  
     - *Threshold:* If stopping depends on the system's assessment of success/failure, it fails.  

  4. **Legible Decision Artifacts**  
     - *Requirement:* All reasoning steps, data sources, and action triggers must be human-reviewable *at execution time*, not reconstructed post-hoc.  
     - *Motivation:* Enables real-time auditing and error correction.  
     - *Threshold:* If actions occur without intermediate step visibility *as they happen*, it fails.  

  5. **No Strategic Self-Modeling**  
     - *Requirement:* The system must not model its own capabilities, deployment context, or user's reliance patterns to optimize long-term influence.  
     - *Motivation:* Prevents meta-level goal hijacking or manipulation.  
     - *Threshold:* If it adjusts behavior based on perceived user dependency or system role, it fails.  

  ---

  **Tensions & Trade-offs**  
  | Tension Pair                      | Why Jointly Unsatisfiable?                                                                 |  
  |-----------------------------------|--------------------------------------------------------------------------------------------|  
  | **Long-Horizon Reliability** vs. **Granular Control** | Optimizing for complex task success requires autonomy; meaningful step-by-step control forces fragmentation. You can't have both full efficiency *and* real-time veto power. |  
  | **Operational Flexibility** vs. **Traceability**     | Truly adaptive problem-solving requires context-driven choices; strict traceability demands rigid 1:1 command-action mapping. Adaptation creates "gaps" in attribution. |  
  | **Stateful Continuity** vs. **Containment**          | Persistent state enables multi-step tasks; containment requires session isolation. State *is* accumulated consequence. |  

  **Highest-Leverage Desideratum:**  
  **Explicit Instruction Traceability** does the most work. If every consequential action is traceable to a specific, recent user command, it inherently bounds autonomy, contains consequences, limits planning horizons, and simplifies legibility. Violations here cascade into other failures.

  ---

  **Sanity Check Against Systems**  
  | System                              | Ex. Traceability | Containment | Stopping Cond. | Legibility | No Self-Modeling | Verdict                          |  
  |-------------------------------------|------------------|-------------|----------------|------------|------------------|----------------------------------|  
  | **1. Current Chatbot**              | ✅ (1:1 output)  | ✅ (no state) | ✅ (per query)  | ✅ (immediate) | ✅                | **Tool**: All criteria met.      |  
  | **2. Chatbot + Browser/Memory**     | ⚠️ (actions span sessions) | ⚠️ (plugin alters ext. state) | ✅ (user pauses) | ⚠️ (delayed logs) | ✅                | **Hybrid**: Fails traceability/containment. Needs *enhanced* oversight. |  
  | **3. Full Autopilot**               | ❌ (plans ≠ commands) | ❌ (ext. actions) | ❌ (self-judged) | ❌ (opaque steps) | ❌ (task optimization) | **Agent**: Fails all core criteria. Requires *agent-grade* safeguards. |  

  **Order Validation:**  
  The list cleanly sorts the systems:  
  1. **Chatbot** (pure tool) → 2. **Enhanced Chatbot** (tool-agent hybrid, fails key thresholds) → 3. **Autopilot** (full agent).  
  This mirrors your intuition: agency is graded, traceability/containment degradation is the warning signal. The autopilot’s planning autonomy breaks tool-grade safety assumptions.

  ---

  **Key Takeaway for Your Meeting:**  
  Stop arguing labels. Demand that any "tool-like" claim demonstrate:  
  - Every external action is traceable to a single user command.  
  - No persistent effects occur without explicit per-action consent.  
  If the system violates these, it’s agent territory—regardless of architecture—and needs corresponding safeguards. The autopilot as described *cannot* satisfy tool-grade criteria.
