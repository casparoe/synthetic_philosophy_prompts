prompt: |-
  I work in the ethics/safeguards review unit of a regional development agency. We sign off on projects that can plausibly change who gets born a generation or two later — big resettlement schemes, dams, family planning programs, even cash transfers that shift when people marry and have kids. Someone on our team read about Parfit's nonidentity problem and pointed out that our whole harm-based framework quietly assumes the affected people would have existed anyway. She's right that once a policy changes who will be born, the complaint "this harms future people" gets slippery: the person born under the policy can't coherantly complain if their life is worth living and the alternative was that they'd never exist at all. Our review forms still have a checkbox that says "adverse effects on future generations," and nobody knows what to do with it in exactly the cases it was written for.

  So: you're a professional philosopher specializing in population ethics, and I want you to think carefully about this — maybe start with a short brainstorm about which distinctions actually matter for a working tool and which we can drop, before writing the procedure itself. Then give us:

  1. A screening question or two that tells a review officer when the nonidentity issue is even in play (most projects won't trigger it — help us not burn time on the ones that don't).

  2. The ordered checklist: what to establish at each step, what counts as a sufficient answer, where it resolves, and where it stops and escalates to the panel because it's a question of values rather than facts. I'd expect at least one such handoff around the "is a life worth living" threshold — tell me honestly whether that's a judgment call dressed up as a step, and whether there's any defensible default we can just write down, or whether we should admit there isn't.

  3. It should handle the distinction between choices affecting the same people and choices affecting the same number of different people, in plain language, because our officers will not read Parfit. If some distinction genuinely can't survive translation into plain language without becoming wrong, say that instead of pretending.

  4. Worked runs on three cases: (a) a dam that floods a valley and resettles 40,000 people, changing marriage and livelihood patterns so that within a generation different people are being born downstream; (b) a voluntary family planning program in a region where most pregnancies are already wanted, so the program mostly changes timing; (c) a watershed restoration project whose effects all land within the lifetimes of people already alive.

  5. One of the worked runs should come out somewhere the panel will hate — for instance that, on a strict nonidentity view, the resettlement case can't be criticized as harming future people at all, only via the currently living. Show what the procedure can and can't do there, and what we should write in the file instead of a fake answer.

  Constraints, so you calibrate: roughly fifteen triggering projects a year, medium stakes (livelihoods, usually not life and death), each review has to be doable by two non-philosphers in about an hour, sign-off is a two-officer panel, and we have no budget for a per-project external philosopher. So no literature survey, no name-dropping for its own sake — the theory has to come out the other end as a tool. But don't dumb it down to the point where it's quietly wrong; if simplification loses something that matters, flag it.
reasoning: |-
  Okay, let me start by understanding the user's problem. They work in an ethics review unit for a development agency. Their issue is that their current harm-based framework doesn't account for Parfit's nonidentity problem. When a project changes who is born in the future, saying it "harms future people" becomes tricky because those people wouldn't exist otherwise. Their checkbox for "adverse effects on future generations" is confusing in these cases.

  First, I need to distill the key distinctions. The main point is whether the project changes the identity of future people or just affects existing ones. For their tool, that's crucial. Other philosophical nuances might be less practical for their workflow. They need a simple screening question to flag when nonidentity is relevant. Projects that don't alter who is born shouldn't trigger this deep dive.

  Next, the checklist. It should start with checking if the project affects identity. If not, use the standard harm assessment. If yes, then assess if lives are worth living. That's a tough threshold. I need to be honest that it's a judgment call but suggest a default, like using national wellbeing benchmarks. Also, highlight when to escalate to the panel, especially when values conflict.

  The distinction between same people vs. same number of different people needs plain language. Maybe "same kids born later" vs. "different kids." If that oversimplifies, admit it but keep it understandable. 

  Worked examples are essential. The dam case shows nonidentity: future people can't be harmed if their lives are worth living. The family planning program mostly affects timing, so standard harm applies. The restoration project affects existing people, no nonidentity issue. One example should challenge the panel, like the dam case where criticizing harm to future people isn't valid. The procedure should note this and suggest alternative concerns, like harm to current generations or ecological impact.

  Constraints matter: 15 projects/year, done by non-philosophers in an hour. The tool must be efficient. Avoid jargon but don't oversimplify to inaccuracy. Flag where simplifications lose important nuances, like the "same number" distinction being fuzzy.

  The user's deeper needs include practical applicability, minimizing time spent, and avoiding ethical oversights. They might also want to maintain credibility by addressing philosophical issues without getting bogged down. Ensuring the tool is defensible and transparent is key. They probably need to justify decisions to stakeholders, so clarity in documentation is vital.
answer: |-
  Here's a streamlined procedure focused on operational clarity for your review officers, acknowledging philosophical limits honestly. The core insight: **The "adverse effects on future generations" checkbox only has straightforward meaning when the project *doesn't* change *who* will exist. If it changes *who* exists, we need a different ethical lens.**

  **Key Distinctions That Matter (and One That Doesn't):**
  *   **CRUCIAL:** Does the project substantially alter the *identities* of future people (i.e., change *who* will be born) vs. only altering the *circumstances* of people who would have existed anyway?
  *   **CRUCIAL:** Can we plausibly judge if a future life affected is "Worth Living" (WL)? (Acknowledging this is a threshold judgment).
  *   **CRUCIAL:** Does the project harm *currently existing people* (including their future well-being) or *future people who would have existed anyway*? (Standard harm applies).
  *   **CAN BE DROPPED (For This Tool):** Intricate distinctions between "same number vs. different number" of future people if identities change. Focus on WL and harm to current/existing-future people. (We flag if simplification loses nuance).

  **The Procedure: Nonidentity Screening & Assessment**

  **Step 0: Initial Harm Assessment (Baseline)**
  *   Assess all projects for adverse effects on **currently living people** and on **future people who would plausibly exist anyway if the project weren't done**. Use standard harm frameworks. Proceed to Step 1 *only* if significant effects on future generations are identified or plausible.

  **Step 1: Screening for Nonidentity Trigger (1-2 min)**
  *   **Ask:** "Is it plausible that this project will significantly alter the timing, location, or partners involved in conception decisions for a substantial number of future people in the affected population *within the next 1-2 generations*?"
      *   **YES:** Nonidentity issue *may* be in play. Proceed to Step 2.
      *   **NO:** Nonidentity issue **not triggered**. Evaluate "adverse effects on future generations" checkbox based **solely on Step 0 assessment** (harm to people who would exist anyway). *Resolves.*
      *   **UNCERTAIN:** Default to **NO** unless strong evidence suggests otherwise (e.g., massive forced migration). Document uncertainty.

  **Step 2: Confirm Identity Change & Scope (5 min)**
  *   **Ask:** "Can we identify specific adverse effects that primarily impact people whose very *existence* is likely caused by this project (Future Identity-Changed People - FICPs), rather than people who would likely have existed anyway?"
      *   **NO:** Effect is on future people who would exist anyway. Nonidentity **does not apply** for this effect. Evaluate checkbox based on Step 0. *Resolves for that effect.*
      *   **YES:** Nonidentity issue is **active** for effects impacting FICPs. Proceed to Step 3 for those specific effects.
      *   **MIXED:** Split the assessment. Effects on FICPs go to Step 3. Effects on others use Step 0.

  **Step 3: The Worth Living Threshold for FICPs (15-20 min - Escalation Likely)**
  *   **Ask:** "Is the life of a typical FICP plausibly 'Worth Living' (WL) overall, even considering the adverse effects?"
      *   **DEFINITE YES (e.g., minor hardship in otherwise decent life):** On a strict nonidentity view, the adverse effect **cannot coherently be called a "harm" *to the FICP***. The alternative is their non-existence. *Proceed to Step 4.*
      *   **DEFINITE NO (e.g., severe, life-long suffering, very short life expectancy):** Life is **not** WL. The FICP *is* harmed by being brought into existence in that state. The adverse effect **is a harm** *to the FICP*. Check the box ("adverse effects") for this reason. *Resolves.*
      *   **UNCERTAIN or CONTESTED (Most Cases):** **ESCALATE TO PANEL.** State: "Judgment required on whether life with [Specific Adverse Effect] in [Context] is Worth Living." Provide context (e.g., baseline poverty level, severity/duration of effect, available opportunities).
      *   **Panel Escalation Note:** **Yes, this is a values judgment.** There is **no universal default.** The panel *must* decide based on agency values/legal context. **Recommendation:** Pre-define a conservative WL threshold for the panel (e.g., "Life expectancy > 40 years AND not in constant severe pain AND access to basic nutrition/security AND potential for social connection"). Document the threshold used.

  **Step 4: Harms Beyond the FICP (5 min)**
  *   **Ask:** "Even if FICPs aren't *harmed* on the nonidentity view (Step 3 Yes), does the project cause significant harm to: a) Currently living people? b) Future people who would have existed anyway? c) Other entities (e.g., environment, ecosystems, cultural heritage)?"
      *   **YES (to a, b, or c):** These harms are real and should be considered under the standard harm framework (Step 0) and potentially trigger the checkbox ("adverse effects on future generations" if b/c apply). *Resolves.*
      *   **NO:** On a strict nonidentity view, **there is no harm *to future people*** from the identity-changing effect itself. **Do NOT check the box *for harm to FICPs*.** However, document clearly: "Effect changes future population composition. Adverse outcome for FICPs identified, but not classified as 'harm' under nonidentity analysis as lives are WL and existence is contingent on project. No other future harms identified." *Resolves.*

  **Plain Language Distinction (Handles 90% of cases):**
  >   "**Same People, Later:** The project changes *when* or *how* kids are born to parents who would likely have had kids anyway. These kids could complain if their lives are worse."
  >   "**Different People:** The project changes *who has kids* or *who partners with whom*, leading to completely different individuals being born. These specific individuals can't complain their life is worse than never existing, *if* their life is basically okay."

  **Worked Runs:**

  **Case (a): Dam & Resettlement (40,000 people)**
  *   **Step 1:** YES (Massive relocation changes communities, livelihoods, marriage markets → different pairings/kids).
  *   **Step 2:** YES (Downstream FICPs affected by loss of ancestral lands, new economic uncertainties).
  *   **Step 3:** **UNCERTAIN/CONTESTED.** Are lives in the resettlement communities WL? (Likely yes, but perhaps marginally). **ESCALATE TO PANEL.** Panel uses defined threshold: "Life expectancy >55yrs? Access to basic services? Potential for livelihood?" Assume they judge **YES, WL**.
  *   **Step 4:** Significant harm to **currently living people** forcibly relocated (loss of homes, livelihoods, social networks). Harm to **future people who would have existed anyway** (original downstream residents' descendants suffer ecological changes). Harm to **environment** (river ecosystem loss).
  *   **Outcome:** **CHECK THE BOX** ("adverse effects on future generations") due to harms to *future people who would have existed anyway* (ecological impact) and potentially harms to current people's future well-being. **Do NOT check box for harm *to FICPs*.** Document: "Nonidentity applies to future resettled population. Panel judged lives WL. Adverse effects on FICPs not classified as 'harm' to them. Significant harms identified to current people, environment, and future non-FICPs."
  *   **Panel Hate Factor:** High. The procedure shows the dam *cannot* be criticized for harming the *specific future people* born in resettlement, only for harming current people, the environment, and the descendants of current downstream residents. The "adverse effects" box is checked, but the rationale is complex. **Tool Can't:** Make harming FICPs a harm *to them* if WL. **Write in File:** Clear documentation of *who* is harmed (current people, specific future lineage, environment) and the ethical distinction regarding FICPs. Avoid stating "no harm to future people" simplistically.

  **Case (b): Voluntary Family Planning (Wanted Pregnancies, Timing Shift)**
  *   **Step 1:** UNCERTAIN → Default to **NO** (Program is voluntary, targets wanted pregnancies, mostly changes *timing*). Strong presumption same *couples* will have kids, just later.
  *   **Step 2:** N/A (Screening says No). If forced to analyze: Probably **NO** for most effects. Small *potential* for some FICPs if delays lead to different partners, but likely minimal/non-substantial.
  *   **Outcome:** Nonidentity **not triggered.** Evaluate "adverse effects" checkbox based solely on Step 0: Does delaying births cause harm (e.g., older parents, smaller workforce later)? If minor/no, likely **DO NOT CHECK BOX.** If significant economic/demographic harm predicted, check box based on harm to future people who *would* exist.

  **Case (c): Watershed Restoration (Effects within lifetimes of living)**
  *   **Step 1:** **NO** (Effects (cleaner water, flood control) impact health/well-being of people *already born* or *conceived before effects manifest*).
  *   **Step 2:** N/A.
  *   **Outcome:** Nonidentity **not triggered.** Evaluate "adverse effects" checkbox based on Step 0: Does the project *prevent* future harm (e.g., cleaner water for kids alive today in 20 years) or cause any? Likely **DO NOT CHECK BOX** (it prevents harm). If there's a downside (e.g., temporary disruption during works), assess harm to existing/future-existing people.

  **Key Simplifications & Flags:**
  1.  **"Same Number" Drop:** We don't distinguish harming FICP-A (life barely WL) vs. creating FICP-B (life wonderful) if the *number* is the same. This loses nuance (e.g., "Average Utilitarianism" vs. "Total Utilitarianism"). **Flag:** Our tool focuses on harm *to individuals*, not comparing total welfare across possible populations. We assess WL per FICP and harm to others.
  2.  **WL Threshold:** The biggest vulnerability. **Flag:** This is a necessary but fundamentally values-based judgment. Document the threshold explicitly.
  3.  **Causation & Probability:** We use "plausible" and "likely" to avoid metaphysical debates. **Flag:** We assume a reasonable causal link is sufficient for policy review, not absolute certainty about counterfactual identities.
  4.  **Non-Person-Affecting Harms:** Step 4(c) allows checking the box for environmental/cultural harm impacting future generations, even if no *specific person* is made worse off than they otherwise would be. **Flag:** This adopts a broader view of obligations to the future.

  This procedure meets your constraints: Screening takes seconds, full nonidentity assessment (Steps 2-4) is 25-40 mins for triggered cases. It uses plain language, forces explicit choices on WL (escalating when needed), provides clear documentation paths (especially for controversial outcomes like Case A), and centers operational practicality while honestly flagging philosophical limits.
