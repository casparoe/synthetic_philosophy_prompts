prompt: |-
  I'm a policy analyst doing comparative work on how different countries regulate who gets into prized positions, and I've ended up with three schemes on my desk that everyone files under the same heading but that, looked at closely, seem to take quietly different things for granted about fairness. I can describe the schemes; what I can't do on my own is work out what each one implicitly assumes, and that's what I'd like help with. Please don't just restate the official justifications — I'm after what the design of each rule itself commits you to, whether the designers realized it or not.

  The three schemes, briefly:

  1. Norway requires, on pain of serious consequences, that each gender hold at least 40% of the seats on the board of every public limited company; failure to comply means the board is not validly elected, the register refuses to record it, and ultimately the courts can compulsorily liquidate the company. The rule applies symmetrically to both genders, covers only the board and not the CEO or the executive team, has no sunset clause, and was not preceded by any official finding that women had been discriminated against in board selection. (It has recently been extended to larger private companies, but that detail doesn't matter for my question.)

  2. In the United States, universities were permitted, until the Supreme Court ended the practice in 2023, to consider an applicant's race as one factor among many within an individualized, holistic review of the whole file, while setting aside a fixed number of seats for a racial group was forbidden, as it had been since the late 1970s. The justification offered was the educational benefit of a diverse student body, not redress for past exclusion.

  3. India reserves a fixed proportion of seats in public employment and publicly funded higher education for members of designated castes and tribes and other historically disadvantaged classes. Membership is fixed at birth and hereditary; the categories are defined by centuries-old social hierarchy; the courts have capped total reservations at roughly half of all seats; and the scheme has been running for over seventy years with no end date.

  Here is what puzzles me. The Norwegian rule doesn't wait for anyone to prove that selection was biased, doesn't expire, and treats the under- and over-represented gender identically — which looks like it assumes that the distribution of powerful positions between the sexes is itself a matter of fairness, rather than a remedy for wrongdoing, though I'm not sure. The American scheme forbids exactly what the other two do — assigning seats by group — which looks like it assumes that treating a person as a member of a group is the very thing fairness prohibits, while still allowing race to be weighed. The Indian scheme assumes the categories track a real, inherited disadvantage that warrants compensation, yet its 50% cap seems to assume that most places must stay open to unrestricted competition — and I can't tell whether those two assumptions fit together or fight each other. And across all three: the American rule aims at the composition of an incoming class, the Indian rule at access to jobs and education, and the Norwegian rule only at boards, a handful of positions per company — yet each is said to serve equality.

  So, please tell me, for each of the three schemes: what the design of the rule strictly presupposes about what the relevant inequality is (bias at the point of selection, inherited disadvantage, the distribution of power itself, something else), which rival views of fairness each rule quietly rules out and which it is merely compatible with, and where each scheme is internally tense or underdetermined — for instance, whether Norway's symmetry is really inconsistent with a compensatory reading, or whether the Indian cap on reservations could be defended on more than one theory. Distinguish carefully between what the scheme presupposes and what its defenders happen to say: I want to know what the rule shape itself commits you to.

  Please answer with a table with the following columns: Scheme (one row each for Norway, the United States, and India); Stated rationale, in one sentence; What the design strictly presupposes; Views it quietly rules out; Views it is merely compatible with; Main internal tension, if any. After the table, add a paragraph of at most 150 words on which presuppositions, if any, all three schemes share, or a plain statement that they share none.
reasoning: |-
  Okay, let me approach this policy analyst's query methodically. The user presents three distinct equality schemes and wants to uncover their implicit normative foundations - what each design necessarily assumes about fairness beyond official justifications. 

  First, I need to carefully dissect each scheme's structural elements:
  - Norway's board quota has symmetrical gender targets, permanent application, and no discrimination finding requirement
  - The US affirmative action model prohibited quotas but allowed race-conscious review for diversity
  - India's reservation system employs hereditary categories with a 50% cap and indefinite duration

  The key is to identify what each design commits to logically. For Norway, the symmetry and permanence suggest it views gender parity in power distribution as intrinsically fair, not merely corrective. This inherently rejects views that see fairness as only procedural or colorblind. 

  For the US model, the ban on quotas combined with holistic review presupposes that group-based remedies are unfair per se, while still accepting that group identity may inform individual merit. This design fundamentally conflicts with compensatory approaches.

  India's system assumes inherited disadvantage justifies group rights, yet the 50% cap implies open competition must dominate - creating tension between compensatory logic and majoritarian meritocracy. 

  In the comparative analysis, I notice all three share an unstated presupposition: that statistical representation reflects fairness. They differ in whether they see groups as legitimate categories for redress (India) or not (US), or as neutral demographic units (Norway). The table should highlight these philosophical fault lines clearly.
answer: |-
  Here is the analysis of the implicit presuppositions embedded in each scheme's design, presented as requested:

  | Scheme      | Stated Rationale                                      | What the Design Strictly Presupposes                                                                 | Views It Quietly Rules Out                                                                 | Views It Is Merely Compatible With                                                                 | Main Internal Tension                                                                 |
  | :---------- | :---------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ |
  | **Norway**  | Gender balance on boards as a social good.            | **The distribution of positions *itself* is a direct matter of justice, independent of past wrongs.** Fairness requires near-parity as a structural outcome. | 1. Fairness is solely procedural (bias-free selection).<br>2. Redress requires proof of past discrimination.<br>3. Gender imbalance can be inherently neutral. | 1. Gender is a salient social category.<br>2. Power should reflect population demographics.<br>3. Board composition impacts societal fairness. | **Symmetry vs. Compensation:** Identical treatment of genders is inconsistent with remedial logic (which targets specific disadvantage). |
  | **United States** (Pre-2023) | Educational benefits of a diverse student body.       | **Fairness requires treating individuals, not groups, as the locus of rights.** Group-based outcomes are inherently suspect; identity can only be a contextual *factor* in individual assessment. | 1. Group-based targets or proportional representation are legitimate fairness tools.<br>2. Historical injustice *requires* group-based remedies.<br>3. Statistical underrepresentation proves unfairness. | 1. Identity shapes individual experience (relevant to merit).<br>2. Diversity is a compelling state interest.<br>3. Race-consciousness is permissible if individualized. | **Individualism vs. Group Disadvantage:** Permitting race-consciousness acknowledges group effects, while banning quotas denies groups are legitimate claimants. |
  | **India**   | Compensatory justice for historically oppressed groups. | **Fairness requires *group-based redress* for inherited, caste-based disadvantage.** Membership in oppressed categories is fixed and warrants preferential access. | 1. Disadvantage is solely individual, not inherited.<br>2. "Merit" should be the only criterion.<br>3. Caste categories are irrelevant to modern fairness. | 1. Reservations are temporary (though design lacks sunset).<br>2. Disadvantage diminishes over time (though design implies persistence).<br>3. "Merit" is socially situated. | **Redress vs. Open Competition:** The 50% cap presupposes most positions *must* remain "merit"-based, clashing with the logic that inherited disadvantage requires compensation (why only 50%?). |

  **Shared Presupposition (32 words):**  
  All three schemes presuppose that statistical representation of designated groups in valued positions is a legitimate concern for public policy aiming at fairness. They diverge fundamentally on *why* this matters (intrinsic parity vs. individual treatment vs. group redress) and *how* it should be achieved (mandated outcomes vs. individualized review vs. fixed quotas).
