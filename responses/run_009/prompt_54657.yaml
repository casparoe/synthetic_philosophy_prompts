prompt: |-
  Got into a huge argument with my flatmate over dinner about whether shrimp and crabs actually suffer, and it ended with her proposing something I can't stop thinking about: welfare requirements shouldn't be binary, they should scale with how confident we are that an animal is sentient. So full protections where confidence is high, scaled-down protections where its contested, nothing where confidence is really low -- probability-weighted standards instead of a yes/no line. I work for a small seafood certification scheme and we're rewriting our standards next year, and i keep thinking we could actually use her idea somehow. Can you turn it into a decision procedure my standards committee can run whenever someone proposes a welfare requirement for a farmed aquatic species? The committee members aren't scientists -- mostly industry people and one vet -- so it has to spell out the questions in order, what kind of evidence answers each one (behavioral, physiological, whatever the people who study sentience actually rely on), where the procedure stops with a no, and where it has to punt to human judgement because the evidence just runs out. It needs to handle the in-between cases like decapods and cephalopods without the committee basically voting on vibes. Then run it on three proposals we actually have on the table: requiring electrical stunning before slaughter for farmed salmon, banning eyestalk ablation in prawn hatcheries, and a stocking-density limit for farmed crabs. Please be honest if the procedure gives an answer the committee will hate, and say what it flat out can't settle.
reasoning: |-
  Okay, let me tackle this user's request. They work for a seafood certification scheme and had a debate with their flatmate about animal sentience and welfare standards. The idea is to create a decision procedure that scales welfare protections based on confidence in sentience, rather than a binary approach. The user needs this for their standards committee, which includes industry folks and one vet, so it must be clear, step-by-step, and minimize subjective "vibes."

  First, I need to outline a structured procedure. The key is linking scientific evidence to confidence levels. I recall that sentience research often looks at behavioral and physiological markers—things like pain responses, learning from negative experiences, and neurological complexity. The procedure should start with high-confidence indicators and move to contested ones. If evidence is strong, full protections apply; if weak, reduced or none. But how to make this non-binary?

  The user mentioned three proposals: electrical stunning for salmon, banning eyestalk ablation in prawns, and stocking density for crabs. I should test the procedure on these. Salmon are vertebrates with clear evidence of sentience, so they'd get high protection. Prawns are decapods, which have some evidence but it's contested. Crabs are similar but might vary by species. The challenge is handling these in-between cases without relying on committee opinions.

  Committee members aren't scientists, so the questions need to be straightforward. Each step should specify the type of evidence required, like behavioral studies or brain structures. Also, the procedure must indicate when to stop (no protection) or when human judgment is needed due to insufficient evidence. For example, if a species shows no pain receptors or avoidance learning, that's a clear stop. But for decapods, the evidence is mixed, so the committee might need to apply precautionary measures.

  I should consider the user's deeper needs. They want scientific rigor to justify standards, especially for contested species. Industry stakeholders might resist stricter welfare measures due to costs, so the procedure must be defensible with evidence. The vet's role is crucial for interpreting physiological data. Also, the procedure should allow for updates as new research emerges, which means including a review mechanism.

  Testing the three proposals: Salmon easily meet all criteria for high protection, so stunning is recommended. Prawns show some evidence but not all, leading to medium protection; thus, eyestalk ablation ban is advised with modifications. Crabs fall into the same category, so density limits are necessary but can be less stringent than for salmon. The committee might dislike the prawn and crab outcomes because it could increase costs, but the evidence supports precautionary steps.

  Areas where the procedure can't decide include species with almost no research. Here, the committee must use judgment, possibly deferring to expert consultation. Also, welfare measures might not be feasible; the procedure identifies needed protections but not implementation, which is a separate policy decision.

  In summary, the procedure needs clear steps with evidence types, thresholds for confidence levels, and examples for application. Highlighting where judgment is unavoidable ensures transparency. The user's goal is a credible, science-based approach that adapts to emerging knowledge, balancing welfare with practical industry concerns.
answer: |-
  Here's a scientifically-grounded, step-by-step decision procedure incorporating your flatmate's "probability-weighted standards" concept, designed for a non-scientific committee. It prioritizes observable evidence and minimizes subjective "vibes."

  **Sentience Confidence Assessment & Welfare Scaling Procedure (SCA-WSP)**

  **Core Principle:** Welfare requirements scale with the committee's assessed confidence (High, Medium, Low) that the species possesses the capacity for **negative subjective experiences** (pain, fear, distress). Confidence is based solely on evidence meeting specific criteria.

  **Procedure Steps:**

  1.  **Define the Specific Welfare Practice & Potential Harm:**
      *   *Question:* What specific practice (e.g., stunning, ablation, density) and potential negative state (e.g., pain during slaughter, chronic stress, injury) are we assessing?
      *   *Evidence:* Clear description of the practice and the hypothesized negative impact. (Essential for focusing the assessment).
      *   *Outcome:* Agreement on the specific practice/harm being evaluated for this species.

  2.  **Assess High-Confidence Sentience Indicators (Stop if Passed):**
      *   *Question 2a:* Does the species possess **complex, centralized brain structures** homologous or analogous to vertebrate brain regions known to support sentience (e.g., cortex, pallium in fish/birds/mammals)? *Focus: Neuroanatomy.*
          *   *Evidence:* Peer-reviewed studies demonstrating complex brain structures (e.g., forebrain, midbrain, hindbrain organization in vertebrates; central complex, mushroom bodies, vertical lobes in invertebrates). Vertebrates automatically pass here.
          *   *Decision:* **YES** -> Proceed to Step 3. **NO** or **INCONCLUSIVE** -> Proceed to Question 2b.
      *   *Question 2b:* Does the species exhibit **long-term motivational change and behavioral flexibility** following exposure to noxious stimuli, **beyond simple reflexes**? *Focus: Behavior/Learning.*
          *   *Evidence:* Studies showing: (a) Avoidance learning (persistently avoiding locations/contexts associated with past noxious stimuli). (b) Trade-offs (sacrificing a high-value reward to avoid a noxious stimulus). (c) Protective behaviors (guarding/licking an injured area that persists after stimulus removal).
          *   *Decision:* **CLEAR YES** (Multiple robust studies) -> Proceed to Step 3. **NO** or **INCONCLUSIVE/AMBIGUOUS** -> Proceed to Question 2c.
      *   *Question 2c:* Does the species possess **specialized nociceptors** (pain receptors) **linked to integrative brain regions**? *Focus: Neurophysiology.*
          *   *Evidence:* Studies identifying nociceptors and demonstrating neural pathways from them to central brain areas capable of complex processing (not just reflex arcs). Evidence of modulation (e.g., by analgesics/anesthetics) strengthens this.
          *   *Decision:* **YES** (with central integration) -> Proceed to Step 3. **NO** (only reflexes) -> **Confidence = LOW**. **INCONCLUSIVE** -> Proceed to Step 3 (but note uncertainty).

  3.  **Assess Contested Sentience Indicators (Build Confidence):** *Evaluate ALL applicable indicators below. Strength/consistency determines Medium vs. Low confidence.*
      *   *Question 3a:* **Physiological Stress Response:** Does exposure to the specific practice/harm (or analogous stressors) trigger complex physiological stress responses (e.g., cortisol/crustacean hyperglycemic hormone elevation, immune suppression) that are **modulated by context or analgesics**?
          *   *Evidence:* Hormone assays, immune function tests showing response to the *specific* stressor/practice, *and* evidence this response is context-dependent or reduced by pain-relieving drugs.
      *   *Question 3b:* **Motivational Trade-offs (Simpler):** Does the species exhibit simpler trade-offs or conditioned place avoidance related to potentially harmful stimuli (even if not as robust as 2b)?
          *   *Evidence:* Studies showing avoidance learning or slight preference shifts in less complex paradigms.
      *   *Question 3c:* **Self-Protection/Anomalous Behavior:** Does the species exhibit grooming, rubbing, guarding, or other anomalous behaviors focused on an injured site or site of noxious stimulus application? Does it show reduced attention to other stimuli?
          *   *Evidence:* Ethograms (detailed behavioral catalogs) documenting such behaviors specifically linked to injury/potential harm.
      *   *Question 3d:* **Pharmacological Response:** Does administration of analgesics/anesthetics known to relieve pain in vertebrates **reduce behavioral or physiological responses** to the specific practice/harm or analogous noxious stimuli?
          *   *Evidence:* Controlled studies showing measurable reduction in avoidance, stress hormones, guarding behaviors, etc., when analgesics are given versus placebo.
      *   *Question 3e:* **Cognitive Complexity Proxy:** Does the species demonstrate other advanced cognitive abilities (e.g., complex spatial learning, tool use, social learning) suggesting a capacity for integrated subjective states?
          *   *Evidence:* Robust studies demonstrating higher-order cognition. (Use cautiously - correlation not causation for sentience).

  4.  **Synthesize Confidence Level:**
      *   *Guidelines:*
          *   **HIGH Confidence:** Passed Step 2 (any question decisively). *OR* Strong, consistent YES across multiple indicators in Steps 2b/2c AND 3.
          *   **MEDIUM Confidence:** Mixed or moderate evidence in Step 3 (e.g., YES on 3a & 3d but weak on 3b; or strong YES on 3b alone). Significant evidence exists but key high-confidence indicators (Step 2) are missing/inconclusive. *This is the "contested" zone (e.g., decapods, cephalopods).*
          *   **LOW Confidence:** Failed Step 2c decisively (only reflex arcs). *OR* Minimal/no evidence for any indicator in Steps 2 or 3. *OR* Evidence only for simple reflexes/stress without central integration/modulation (Step 3a alone is insufficient).
      *   *Committee Action:* Discuss the *strength and consistency* of evidence across Step 3 indicators. Assign **High, Medium, or Low** confidence based on the guidelines. Document reasoning. *If evidence is truly minimal/absent, Confidence = LOW.*

  5.  **Scale the Welfare Requirement:**
      *   *Principle:* The requirement's **intensity, scope, and mandatory nature** scale with confidence.
      *   *Framework:*
          *   **HIGH Confidence (e.g., Salmon, Trout, Mammals, Birds):** **Full Protection.** Requirement is **mandatory and robust.** Prioritize elimination/prevention of the harm. (e.g., *Require* effective stunning; *Ban* harmful mutilations; *Set strict* density limits based on welfare science).
          *   **MEDIUM Confidence (e.g., Prawns, Crabs, Lobsters, Octopus):** **Precautionary Protection.** Requirement is **strongly recommended or conditionally mandatory.** Focus on significant harm reduction where feasible. Allowance for phased implementation or specific exceptions if feasibility is exceptionally low, but default is action. (e.g., *Require* or *strongly recommend* with phased timeline stunning/alternatives to ablation; *Set density limits* based on stress indicators, potentially less strict than High but still significant).
          *   **LOW Confidence (e.g., Oysters, Clams, Jellyfish):** **Minimal/No Specific Requirement.** Focus on basic hygiene, biological function, and ecosystem health. No *specific* welfare requirement for that practice/harm is mandated *based on sentience*. (Note: Other reasons like product quality or disease control might still apply).

  6.  **Address Feasibility & Implementation (Separate from Sentience Assessment):**
      *   *Question:* Is the proposed welfare requirement **technically and economically feasible** at scale for this species/sector *right now*?
      *   *Evidence:* Industry pilot studies, cost-benefit analyses, technology readiness assessments.
      *   *Action:* **DO NOT** downgrade the *confidence level* or the *scaled requirement* based on feasibility alone. If feasibility is low for a High/Medium confidence outcome:
          *   **High Confidence:** Requirement remains mandatory. Develop an implementation plan/timeline with support for industry transition. Research alternatives urgently.
          *   **Medium Confidence:** Requirement is strongly recommended. Prioritize R&D into feasible alternatives. Set a clear review date. Consider conditional exceptions *only* with strict justification and monitoring.
          *   Document that the requirement is justified based on sentience confidence but implementation faces challenges.

  **Applying the Procedure to Your Proposals:**

  1.  **Proposal: Require Electrical Stunning Before Slaughter for Farmed Salmon**
      *   Step 1: Practice = Electrical Stunning; Harm = Pain/Distress during slaughter.
      *   Step 2:
          *   2a: **YES.** Salmon are vertebrates (teleost fish) with complex, centralized brain structures (e.g., well-developed telencephalon, pallium).
          *   *Confidence = HIGH. Proceed to Scaling.*
      *   Scaling (Step 5): **HIGH Confidence -> Full Protection.** Mandatory requirement for effective electrical stunning (or an equally effective alternative) is scientifically and ethically justified.
      *   *Committee Reality Check:* Industry may dislike cost/implementation, but science is unequivocal. **Procedure says: Mandatory Stunning Required.**

  2.  **Proposal: Ban Eyestalk Ablation in Prawn (e.g., Giant River Prawn/Macrobrachium) Hatcheries**
      *   Step 1: Practice = Eyestalk Ablation; Harm = Acute pain during ablation, potential chronic stress/impairment.
      *   Step 2:
          *   2a: **NO.** Decapod crustacean brain is complex but not homologous to vertebrate structures. Not auto-pass.
          *   2b: **INCONCLUSIVE/Ambiguous.** Some evidence for avoidance learning in crabs/lobsters related to shocks, less clear/direct for ablation in prawns specifically. Mixed results.
          *   2c: **YES (with central integration).** Prawns have nociceptors, and ablation triggers neural activity in central ganglia (brain). Analgesics modulate responses. Evidence supports central processing beyond reflexes.
          *   *Proceed to Step 3.*
      *   Step 3:
          *   3a: **YES.** Ablation causes massive spikes in stress hormones (e.g., CHH) and immune suppression.
          *   3b: **Limited/Indirect.** Prawns show aversion to handling/restraint associated with ablation.
          *   3c: **YES.** Prawns vigorously rub/guard ablation site post-procedure.
          *   3d: **YES.** Analgesics reduce rubbing, stress hormones, and sometimes mortality post-ablation.
          *   3e: **NO/MINIMAL.** Prawns show limited complex cognition relevant here.
          *   *Synthesis:* Strong evidence on 3a, 3c, 3d. Moderate on 3b. Supported by pass on 2c. **Confidence = MEDIUM.**
      *   Scaling (Step 5): **MEDIUM Confidence -> Precautionary Protection.** Ban on eyestalk ablation is justified as the primary requirement. *However,* if industry demonstrates *exceptional* hardship proving *no* feasible alternative exists *currently* for reliable maturation, a *phased ban* with strict deadlines (e.g., 3-5 years) and mandatory R&D/implementation of alternatives (e.g., LED light cycles, peptide hormones) could be considered under Step 6. The default position is a ban.
      *   *Committee Reality Check:* Industry hates this (ablation is cheap/effective). Vet likely supports ban. **Procedure says: Ban is Required (Phased if extreme hardship proven).**

  3.  **Proposal: Stocking-Density Limit for Farmed Crabs (e.g., Mud Crabs)**
      *   Step 1: Practice = High Stocking Density; Harm = Chronic stress, injury, cannibalism.
      *   Step 2:
          *   2a: **NO.** (Same as prawns).
          *   2b: **YES (Moderate).** Crabs show avoidance learning related to negative experiences (e.g., electric shock zones). Evidence for context-dependent behavior.
          *   2c: **YES (with central integration).** Similar neurophysiology to prawns. Nociception linked to central ganglia.
          *   *Proceed to Step 3.*
      *   Step 3:
          *   3a: **YES.** High density consistently elevates stress hormones and suppresses immune function in crabs.
          *   3b: **YES.** Crabs actively seek less crowded areas when possible.
          *   3c: **YES.** Increased aggression, injury, limb loss, and reduced feeding/grooming observed at high densities.
          *   3d: **Limited.** Few direct studies on analgesics for density stress, but plausible based on other stress responses.
          *   3e: **Variable.** Some crab species show notable spatial learning.
          *   *Synthesis:* Strong evidence on 3a, 3b, 3c. Supported by Step 2b & 2c. **Confidence = MEDIUM** (possibly Medium-High depending on species/crab type).
      *   Scaling (Step 5): **MEDIUM Confidence -> Precautionary Protection.** Mandatory stocking density limits are justified. Limits should be based on measurable welfare indicators (injury rates, mortality, growth, stress hormones). Density will likely be higher than for salmon (High Confidence) but significantly lower than levels causing obvious harm/cannibalism.
      *   *Committee Reality Check:* Industry will push for highest possible density. **Procedure says: Mandatory Density Limits Required (based on welfare science).**

  **What the Procedure Can't Settle (Requires Committee Judgement):**

  1.  **The "Unknown Unknowns":** Species with almost *zero* research (e.g., many obscure farmed fish, jellyfish, sea cucumbers). The procedure will assign **LOW Confidence** due to lack of evidence, but the committee must decide how precautionary to be in the *complete absence* of data. The procedure forces acknowledgment of ignorance.
  2.  **Interpreting "Strength and Consistency" (Step 4):** While the indicators are defined, weighing *how much* evidence constitutes Medium vs. Low, especially with conflicting studies, requires committee discussion guided by the vet. The procedure structures the debate around concrete evidence types but doesn't eliminate the need for reasoned judgment on borderline cases.
  3.  **Absolute Feasibility Trade-offs (Step 6):** The procedure separates sentience justification from feasibility but doesn't dictate *how long* a phase-in period is acceptable or what constitutes "exceptional hardship." This requires policy judgment, informed by evidence but not dictated by the sentience assessment alone.
  4.  **Defining Specific Thresholds:** It provides the *framework* for scaling (mandatory vs. recommended, strict vs. less strict limits) but doesn't set the *exact* stunning parameters, density number, or phase-out timeline. These require separate technical working groups informed by the confidence level.

  **Why this works for your committee:**

  *   **Concrete Steps:** Clear sequence of questions with defined evidence types.
  *   **Reduces Vibes:** Forces discussion onto specific biological indicators (nociception, learning, stress responses) rather than "do they feel?".
  *   **Handles the Grey:** Explicitly creates a "Medium Confidence/Precautionary" category for decapods/cephalopods.
  *   **Transparent Reasoning:** Requires documenting evidence and synthesis.
  *   **Separates Science & Feasibility:** Prevents sentience denial based on cost alone.
  *   **Action-Oriented:** Leads directly to a scaled decision (Full/Precautionary/Minimal Protection).

  **Honest Outcomes:** As shown, this procedure will likely mandate stunning for salmon, push hard for banning prawn ablation (even if phased), and require density limits for crabs. Industry members may dislike these outcomes, but the procedure grounds them in a defensible, evidence-based assessment of the likelihood of suffering, fulfilling the core insight from your flatmate's argument. It forces the committee to confront the evidence rather than hide behind ambiguity.
