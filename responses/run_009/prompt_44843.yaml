answer: |-
  Here's the distilled desiderata for any theory of the unity of consciousness, grounded in split-brain phenomena and calibrated for a *theory of persons*. I've flagged core tensions and categorized each requirement's negotiability based on empirical weight vs. philosophical dogma. The key insight: **several desiderata are in fundamental tension, and satisfying all may be impossible without redefining "unity" or "subject."**

  ---

  ### **Desiderata for a Theory of Unity of Consciousness**  
  *(Non-Negotiables = ★ / Negotiables = ▲ / Contextual = ◐)*

  1.  **★ Daily Functional Integration**  
      *Case Motivation:* Post-op patients navigate ordinary life (chatting, eating, transit) without self-reported fragmentation or external oddity.  
      *Demand:* Explain how behavioral/phenomenological unity is maintained *in unstructured environments* despite anatomical bisection.  
      *Why Non-Negotiable:* Denial collapses the very phenomenon ("unity") we’re explaining; it’s the baseline lived reality.

  2.  **★ Information Gapping Under Lateralization**  
      *Case Motivation:* Lab tasks (e.g., chicken claw/snow scene) show visual/tactile info confined to one hemisphere, with no inter-hemispheric transfer.  
      *Demand:* Account for strict compartmentalization of *specific types* of content when stimuli are lateralized.  
      *Why Non-Negotiable:* Replicable empirical bedrock; theories denying this fail descriptively.

  3.  **★ Confabulation as Unification Mechanism**  
      *Case Motivation:* Speaking hemisphere fabricates explanations for actions/choices driven by the non-speaking hemisphere (e.g., justifying shovel choice).  
      *Demand:* Explain why the verbal self-model generates coherent but false narratives to "cover" disunity.  
      *Why Non-Negotiable:* Reveals a *positive mechanism* for maintaining subjective unity; ignoring it misses a core adaptive process.

  4.  **◐ Cross-Cuing & Emergent Cooperation**  
      *Case Motivation:* Hemispheres leverage eye movements, vocalizations, or posture to share information indirectly (e.g., glancing at an object so the other hemisphere sees it).  
      *Demand:* Explain how subsystems develop *novel, non-anatomical communication channels* to partially reintegrate function.  
      *Why Contextual:* Shows unity is dynamic and task-dependent; but may be an *optional* workaround, not definitional.

  5.  **★ Fractionation of Volition/Ownership**  
      *Case Motivation:* Alien hand syndrome (AHS) — one hand acts against intentions, is disowned, or fights the other hand.  
      *Demand:* Explain how motor agency, intention, and body ownership can dissociate *within one organism*.  
      *Why Non-Negotiable:* Directly challenges "unity of agency" as necessary for consciousness; AHS is irreducibly disruptive.

  6.  **▲ No Essential Role for Corpus Callosum**  
      *Case Motivation:* Agenesis of corpus callosum (ACC) — individuals born without it often have near-normal cognition/behavior, with subtle or compensated deficits.  
      *Demand:* Explain how functional unity can exist *without* the primary interhemispheric tract. Unity cannot be *defined by* callosal integrity.  
      *Why Negotiable:* ACC shows neuroplasticity can provide alternative routes, but unity may still rely *contingently* on *some* structural basis.

  7.  **◐ Recoverability & Graded Unity**  
      *Case Motivation:* Coma/DOC patients regain unified consciousness; ACC/split-brain patients adapt over time; normal brains show micro-disunities (e.g., attentional lapses).  
      *Demand:* Accommodate unity as a *graded, recoverable, and dynamically maintained* state—not an all-or-nothing property.  
      *Why Contextual:* Undermines binary "unified-or-split" thinking; but theories may handle this poorly without being falsified.

  ---

  ### **The Core Tensions (Where Desiderata Clash)**  
  **Your suspicion is correct: contradictions emerge.** Here’s where theories typically implode:

  -   **Tension 1: Daily Unity vs. Lab Disunity (★1 vs ★2)**  
      *Conflict:* How can the same system be "unified enough" for breakfast but "split" when choosing a shovel?  
      *Theoretical Cost:* Theories prioritizing ★1 (e.g., global workspace) must explain why gapping (★2) doesn’t *always* disrupt unity. Theories prioritizing ★2 (e.g., two-subjects) must explain why ★1 isn’t just an illusion.

  -   **Tension 2: Narrative Unity vs. Access Gapping (★3 vs ★2)**  
      *Conflict:* Confabulation (★3) maintains a unified *self-narrative* by *masking* gapping (★2). Is the "unified subject" the confabulating narrator, or does gapping imply two subjects?  
      *Theoretical Cost:* Accepting ★3 as central makes unity a *construct* (potentially fictional). Denying ★3 ignores the patient’s phenomenological report.

  -   **Tension 3: Agency Unity vs. Alien Actions (★1 vs ★5)**  
      *Conflict:* Daily unity (★1) assumes integrated agency. AHS (★5) shows subsystem agency can be hostile and disowned.  
      *Theoretical Cost:* Is "the person" the conflicted whole, the narrating hemisphere, or a federation of competing agents? Ownership fractures.

  ---

  ### **Framing Pushback & Meta-Notes**  
  1.  **"Unity" is a Cluster Concept:** You’re right—demands here span:  
      - *Access Unity* (information availability; gapping violates this)  
      - *Phenomenal Unity* (seamless qualia; daily life suggests this holds)  
      - *Narrative Unity* (coherent self-story; confabulation maintains this)  
      - *Agential Unity* (control/ownership; AHS shatters this).  
      **→ No single "unity" exists. A theory must specify *which* unity it explains.**

  2.  **Split-Brain as Revealer, Not Anomaly:**  
      Normal brains likely have semi-independent modules; the corpus callosum *hides* disunity by enabling integration. Split-brain doesn’t *create* two minds—it *reveals* pre-existing modularity. **Adequate theories must explain normal unity *and* its fractional breakdown.**

  3.  **The Personhood Stakes:**  
      For a theory of *persons*, desiderata ★1, ★3, and ★5 are paramount. They engage: *What preserves identity in daily life? Why do we feel like one self despite conflicting evidence? When do "my" actions cease to be mine?*  

  4.  **The Unavoidable Conclusion:**  
      **No existing theory satisfies all desiderata.** The tension between ★1 (unified person in flow) and the cluster of ★2+★5 (gapping + alien agency) suggests either:  
      - Unity is *not* a metaphysical fact but a heuristic (★3’s confabulation supports this),  
      - "Person" is not coextensive with "biological human" (risking two-persons-in-one-head),  
      - Or consciousness is fundamentally fragmentary, with unity as a functional illusion.  

  **Next Step:** Use this spec to stress-test theories. Does Global Workspace handle ★5? Does IIT handle ★6? Do two-mind theories crash on ★1? The contradictions may force a reconceptualization of "subject" itself.
