prompt: |-
  hey, so — i'd like you to act as a philosopher of mind who's spent an unhealthy amount of time with split-brain case reports, and help me think through something before I dive back into the literature.

  basically: before I read any more theories of the unity of consciousness, I want the spec first. Write me the list of desiderata — what any adequate theory of the unity of consciousness has to deliver — with the case behind each requirement, and mark which ones you think are non-negotiable versus which are just prejudices of particular camps (e.g., some people treat "one subject per brain" as a given, others treat "the hemispheres can be separately aware" as a given; I want to know which demands are load-bearing and which are just tribal).

  The cases that any theory has to handle, off the top of my head — you'll probably think of others:

  - after the operation, patients function more or less normally in daily life. you eat breakfast, chat, ride the bus, and nobody including you notices anything odd. whatever "unity" broke, it broke quietly.
  - but in the lab you get things like the left hand picking a snow shovel when the right (speaking) hemisphere was shown a chicken claw and the left was shown a snowy scene, and the patient verbally explaining the shovel choice in a way that papers over the fact that the two hemispheres saw different things. confabulation as glue.
  - cross-cuing: the hemispheres sneakily signaling to each other through peripheral cues — a patient glancing at something so the other half can pick up on it. so the two halves can cooperate badly instead of not at all.
  - the alien hand stuff — one hand doing things the patient disowns, sometimes actively fighting the other hand.
  - and the annoying boundary facts a theory can't contradict: people born without a corpus callosum (agenesis) often have surprisingly subtle deficits, and there are coma patients and others who recover in ways that complicate any neat story about what a given tract does.

  what I most want from you, more than the list itself even: tell me if some subset of the desiderata is jointly unsatisfiable. my suspicion is there's a tension between "explain why the patient is one person outside the lab" and "explain why the lab data show two streams," and maybe the honest output of this exercise is a list that no theory can satisfy at once — which would itself be a result. so if you think two requirements can't both be met, say so explicitly, don't smooth it over.

  also: push back on me if the framing itself is confused. like if "unity of consciousness" is actually a cluster of different notions (unity of access, unity of perspective, unity of ownership...) and asking for one list to cover them all is a mistake, say that plainly instead of politely producing a list anyway. same if you think split-brain cases are a bad paradigm to build the spec around and normal brains already have fractional unity — I've half-suspected that myself.

  Take a moment to brainstorm before writing, please — don't just dash off the first ten things that come to mind. And no bibliography, no citations; I'll match the requirements to the literature myself. a table's fine, prose bullets fine, your call. just keep the weight on the criteria and what motivates each, not on scoring existing theories against them — I'll do that part later. (and if it matters: the point of all this is a theory adequate for thinking about persons, not for neurosurgical decisions, so calibrate the desiderata to that.)
