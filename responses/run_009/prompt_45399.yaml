answer: |-
  Your friend's argument for Kelly betting is compelling in the context of repeated wagers and logarithmic utility, but it breaks down in the case of your relative due to the specific utility function and finite horizon involved. The flaw lies primarily in step (4) of the argument, but it also stems from an implicit assumption in step (1) about the universality of long-run growth optimization. I'll walk through the reasoning step by step, explain where the argument fails, and discuss the implications for your relative's situation. I'll also address the Bernoulli retreat and your desire to maintain Kelly for your own investing.

  ### Step-by-Step Breakdown of the Argument's Flaw
  The core issue is that your friend's derivation assumes a specific context (infinite series of bets with multiplicative wealth compounding) and a specific utility function (logarithmic, which maximizes long-run growth). However, rational betting depends on the bettor's utility function and time horizon, not just the odds. Here's how the steps hold up or fail:

  1. **Step (1): Rational staking is governed by long-run growth rate because wealth compounds multiplicatively over a series.**  
     - This is true *only if* the bettor faces an open-ended series of wagers and has a utility function aligned with long-run growth (e.g., logarithmic utility). Kelly betting maximizes the geometric growth rate under these conditions.  
     - **Why it fails here:** Your relative has a fixed, one-time decision with no future wagers. Wealth does not compound, and his utility is not logarithmic—it's threshold-based (all-or-nothing for $200,000). Thus, long-run growth is irrelevant. Rationality must be defined by maximizing expected utility for this specific bet, not long-run growth.

  2. **Step (2): The Kelly fraction uniquely maximizes that growth rate.**  
     - This is correct for repeated bets under logarithmic utility. Kelly does maximize the expected logarithm of wealth, which is equivalent to maximizing long-run growth.  
     - **Why it holds but is misapplied:** Kelly is optimal for the assumed context, but your relative's situation doesn't fit that context. For a one-off bet with threshold utility, Kelly is not relevant.

  3. **Step (3): Staking above Kelly is beaten almost surely in the limit, and beyond twice Kelly, growth is negative.**  
     - This is accurate for an infinite series of independent, identical bets. Over time, overstaking leads to ruin with probability 1, and staking beyond twice Kelly makes the expected log growth rate negative, accelerating ruin.  
     - **Why it fails here:** The "almost surely" and "limit" concepts require an infinite horizon. Your relative has no long run—this is a single bet. Negative growth rates don't apply because there are no future bets to compound losses. For a one-time wager, staking above Kelly is simply a high-risk, high-reward choice that can be rational if it aligns with utility.

  4. **Step (4): Real lives are open-ended series—every decision is part of a chain, so no last bet.**  
     - **This is the key flaw.** While many real-life decisions (e.g., ongoing investing) are part of a series, not all are. Your relative's case is a clear counterexample: he is dying, has no heirs, no future wagers, and his bankroll is used only for this single purpose. For him, this is unequivocally a "last bet." Step (4) overgeneralizes by assuming that all decisions must be treated as part of an infinite series, ignoring terminal events or finite horizons.  
     - **Cost of rejecting step (4):** You concede that Kelly betting is not universally rational—it depends on the bettor's horizon. This doesn't invalidate Kelly for open-ended scenarios (like your investing), but it means rationality is context-dependent. Rejecting step (4) costs little; it simply acknowledges that real life includes finite decisions, and we must assess utility and horizon case by case.

  5. **Step (5): Therefore, staking more than Kelly in any real decision is irrational (does worse almost surely).**  
     - This follows from steps (1)–(4) but inherits their flaws. It assumes that "doing worse almost surely" is the only irrationality standard, which is true only for infinite horizons. With a finite horizon or different utility, other strategies can be rational.  
     - **Why it fails:** For your relative, staking ~56% gives a 50% chance of success (funding the treatment), while Kelly or lower gives 0% chance. "Doing worse almost surely" doesn't apply because there is no "almost surely"—it's a single trial. Rationality here means maximizing the probability of achieving his goal, not avoiding long-run ruin.

  6. **Step (6): The cap binds each decision singly due to series membership, not repetitions.**  
     - This is an extension of step (4) and fails for the same reason. If a decision is terminal (not part of a series), the Kelly cap doesn't bind. The justification relies on the bet being embedded in an open-ended chain, which doesn't hold here.

  ### Why Your Relative's High Stake is Rational
  - **Utility function:** Your relative has a threshold utility—wealth below $200,000 has utility 0 (failure), and wealth at or above $200,000 has utility 1 (success). This is not logarithmic; it's a step function based on a binary outcome.  
  - **Expected utility maximization:**  
    - Stake \( f \) fraction of bankroll \( B = \$120,000 \).  
    - On heads (probability \( p = 0.5 \)), wealth = \( B(1 + 1.2f) \).  
    - On tails (probability \( 0.5 \)), wealth = \( B(1 - f) \).  
    - Utility: \( u(\text{wealth}) = 1 \) if wealth \( \geq \$200,000 \), else \( 0 \).  
    - Only a win can achieve the threshold (since \( B(1 - f) < B < \$200,000 \) for any \( f > 0 \)).  
    - Expected utility \( E[u] = p \cdot I_{\text{win threshold}} + (1-p) \cdot 0 \), where \( I \) is 1 if \( B(1 + 1.2f) \geq 200,000 \).  
    - Solve for minimum \( f \): \( 120,000(1 + 1.2f) \geq 200,000 \) → \( f \geq \frac{200/120 - 1}{1.2} \approx 0.5556 \) (55.56%).  
    - For \( f \geq 0.5556 \), \( E[u] = 0.5 \). For \( f < 0.5556 \), \( E[u] = 0 \).  
    - Thus, staking just above 55.56% (e.g., 56%) maximizes expected utility at 0.5. Staking less (including Kelly) or nothing gives \( E[u] = 0 \). Kelly (8.33%) would yield wealth ~$132,000 on win (still below threshold) and ~$110,000 on loss, so utility 0 in both cases.
  - **Rationality:** Under this utility, the high stake is not just permissible but optimal—it's the only way to have any chance of success. Staking beyond the minimum (e.g., 100%) still gives \( E[u] = 0.5 \), but it's not necessary; the minimum stake is preferable to reduce the loss magnitude if he fails (though utility is unaffected). Kelly's "ruin avoidance" is irrelevant because (a) there's no long run, and (b) ruin (falling short) is equally bad at any wealth below $200,000.

  ### Addressing the Bernoulli Retreat
  Your friend might retreat to a Bernoulli-like argument: if utility is logarithmic, Kelly is optimal for a single bet, so staking above Kelly is irrational under log utility. However:
  - **This retreat does not rescue the conclusion for your relative:** Your relative's utility is not logarithmic; it's threshold-based. Bernoulli/log utility assumes that utility increases smoothly with wealth, emphasizing preservation and growth, but your relative values only the threshold. Forcing log utility onto him misrepresents his preferences. Kelly would be rational for a one-time bet only if he had log utility, which he doesn't.
  - **Where the retreat breaks:** Bernoulli/log utility is risk-averse and avoids large stakes that risk significant losses. Threshold utility, however, can justify high stakes because the bettor is risk-seeking in the pursuit of the goal (since anything below threshold is worthless). Thus, the retreat fails on the threshold—it cannot accommodate non-log utility functions.
  - **General point:** Deriving Kelly from log utility for a single bet still ties rationality to the utility function. If we insist on log utility as "rational," it imposes a specific risk preference that may not fit all people or goals. Your relative's case shows why utility must be considered: staking Kelly is irrational for him because it ignores his threshold objective.

  ### Your Position: Principled Distinction for Different Scenarios
  You can consistently maintain Kelly for your own investing while rejecting it for your relative:
  - **Principled basis:** The distinction hinges on two factors:  
    1. **Utility function:** You likely have a long-term, growth-oriented utility (e.g., logarithmic or similar), where preserving capital and compounding matter. Your relative has a short-term, threshold utility.  
    2. **Time horizon:** You face an open-ended series of bets, so long-run growth and ruin avoidance are paramount. Your relative has a finite horizon with no future bets.  
  - **What you're conceding:** By admitting that rational staking depends on utility and horizon (not just odds), you're conceding that there is no universal "rational" stake—it must be derived from the bettor's preferences. This doesn't weaken Kelly for repeated bets; it contextualizes it. Kelly remains rational for open-ended growth maximization but not for other objectives like reaching a threshold or maximizing the probability of a goal.
  - **Cost of this view:** It requires bettors to explicitly define their utility and horizon, which can be complex. However, this is standard in decision theory (e.g., expected utility maximization). In practice, for ongoing investors like you, Kelly is an excellent default, but it should not be dogmatically applied to all decisions.

  ### Conclusion
  The argument goes wrong in **step (4)**, by falsely assuming all real decisions are part of an open-ended series. Rejecting this step allows for terminal decisions like your relative's, where the long run doesn't apply. Additionally, step (1) implicitly assumes logarithmic utility and a growth objective, which doesn't hold here. Rejecting step (4) costs nothing significant—it simply recognizes that rationality depends on context. For your relative, staking ~56% is rational under his threshold utility and finite horizon. For your investing, Kelly remains rational because you face a series and care about growth.

  This is principled: it uses expected utility theory to handle different preferences, rather than imposing one-size-fits-all rules. You're not cherry-picking; you're respecting that rational betting is goal-relative. If your friend insists on Kelly universally, they must defend log utility as the only rational choice—but this is untenable, as your relative's case shows that people can have valid non-log utilities.
