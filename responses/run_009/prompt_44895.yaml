  - **No** → **Leaf 1: Biting the bullet**  
    The group uses majority voting on each proposition and accepts occasional inconsistency as the price of equal votes.  
    *Awkward commitment: The group might be committed to contradictory actions, which could be paralyzing or irrational.*
  - **Yes** → Proceed to Q2.

  **Q2: Is it acceptable for the group to leave some propositions undecided? (e.g., on a hiring committee, declining to take a stand on every aspect of the candidate?)**
  - **Yes** → **Leaf 2: Retreat to incomplete but consistent judgments**  
    The group only asserts judgments that are consistent, even if that means remaining silent on some issues.  
    *Awkward commitment: The group might fail to make necessary decisions, leading to inaction on important matters.*
  - **No** → The group must be both consistent and complete. Proceed to Q3.

  **Q3: Should the group base its judgments on an assessment of which members are most competent? (e.g., on a grant panel, deferring to the expert in the relevant field?)**
  - **Yes** → Proceed to Q4.
  - **No** → Proceed to Q6.

  **Q4: Should the group defer to a single most competent member? (e.g., always following the lead researcher on a technical point?)**
  - **Yes** → **Leaf 3: Epistemic dictatorship**  
    The group follows the judgment of the member deemed most competent.  
    *Awkward commitment: The group might ignore valuable input from others, and selecting the expert may be contentious.*
  - **No** → Proceed to Q5.

  **Q5: Should the group defer to a group of the most competent members? (e.g., a subpanel of experts who then deliberate?)**
  - **Yes** → **Leaf 4: Epistemic oligarchy**  
    The group follows the judgments of a subset of the most competent members, using majority voting among them.  
    *Awkward commitment: The expert group might produce inconsistent judgments (if they use majority), and selecting the expert group is difficult.*
  - **No** → *This combination is rare and likely unstable. If the group wants to base judgments on competence but won’t delegate to any individual or subgroup, it lacks a clear method.*

  **Q6: Should the group use the same voting rule for every proposition? (e.g., majority vote on each, regardless of whether it’s a premise or a conclusion?)**
  - **No** → Proceed to Q7.
  - **Yes** → Proceed to Q9.

  **Q7: Should the group vote only on the premises and then derive the conclusion? (e.g., in a court, deciding the facts and then logically deriving the verdict?)**
  - **Yes** → **Leaf 5: Premise-based procedure**  
    The group votes on each premise and then accepts the conclusion that follows logically.  
    *Awkward commitment: The group might endorse a conclusion that a majority opposes, if it follows from the endorsed premises.*
  - **No** → Proceed to Q8.

  **Q8: Should the group vote only on the conclusion? (e.g., in a church synod, only voting on the final doctrine and not on the supporting arguments?)**
  - **Yes** → **Leaf 6: Conclusion-based procedure**  
    The group votes only on the conclusion, leaving the premises unstated.  
    *Awkward commitment: The group might endorse a conclusion without a shared rationale, making it hard to apply the decision in future cases.*
  - **No** → *This combination is rare and undefended. It might involve complex priority-based voting, which is unattractive due to complexity.*

  **Q9: Must every member agree for the group to affirm a proposition? (e.g., on a parole board, requiring unanimity to release a prisoner?)**
  - **Yes** → **Leaf 7: Unanimity rule** (a form of oligarchy)  
    The group affirms a proposition only if every member agrees.  
    *Awkward commitment: The group may deadlock frequently, failing to make decisions when there is any disagreement.*
  - **No** → Proceed to Q10.

  **Q10: Is it acceptable for a single member to determine the group’s judgment? (e.g., giving the chair the final say on every point?)**
  - **Yes** → **Leaf 8: Dictatorship**  
    One member’s judgment determines the group’s judgment on every proposition.  
    *Awkward commitment: The views of other members are ignored, which may be unfair and lead to suboptimal decisions.*
  - **No** → Proceed to Q11.

  **Q11: Is it acceptable for a fixed group of members (smaller than the whole group) to have the power to decide? (e.g., a subcommittee must unanimously approve?)**
  - **Yes** → **Leaf 9: Oligarchy**  
    A fixed subset of members must all agree for the group to affirm a proposition.  
    *Awkward commitment: The oligarchs might not be representative, and the group may be dominated by a few.*
  - **No** → *This position is unstable. There is no known aggregation rule that guarantees consistency and completeness while treating every proposition equally and not being oligarchic. It is unattractive because it is impossible in some cases.*

  **Notes on Blurred Distinctions:**
  - The premise-based procedure may be observationally equivalent to restricting the agenda to premises only.
  - Epistemic oligarchy (with a small expert group) may resemble a standard oligarchy if the experts are the oligarchs. The difference lies in the justification (competence vs. fixed status).

  This tree should fit on two pages and provide a clear diagnostic for the students.
answer: |-
  Below is a two-page handout for your seminar, designed as a diagnostic decision tree. It starts from the acceptance that majority voting on interconnected propositions can produce collective inconsistency and leads students through intuitive, real-world branch questions to identifiable positions (leaves). The branch questions are phrased to be answerable based on reactions to concrete cases (e.g., hiring committees, parole boards, grant panels, church synods). The tree covers the required leaves and flags indistinguishable positions or undefended combinations. Written in British English, it fits within 8–10 branch questions and 9 leaves.

  ---

  **Collective Decision-Making: What Should Committees Do?**  
  *A Diagnostic Tree for Resolving the Discursive Dilemma*

  **Starting Point**: You accept that majority voting on interconnected propositions (e.g., a three-judge court ruling on liability, causation, and damages) can produce a collectively inconsistent verdict, even when all individual judgments are consistent. What should committees, panels, or juries do about it?  

  Answer the questions below based on your intuition about real cases. For example:  
  - A hiring committee debating "The candidate is qualified," "The candidate fits our values," and "We should make an offer."  
  - A parole board assessing "The prisoner is rehabilitated," "Release poses low risk," and "Release should be granted."  
  - A church synod judging "Scripture permits same-sex marriage," "Tradition forbids it," and "We should update our doctrine."

  ---

  ### **The Decision Tree**

  **Q1: Must the group’s overall judgment always be logically consistent?**  
  *(e.g., should your parole board avoid asserting both “Release poses low risk” and “Release should not be granted” if they conflict?)*  
  - **No** → Proceed to Q2.  
  - **Yes** → Proceed to Q3.  

  **Q2: Is unequal influence on decisions acceptable if it prevents inconsistency?**  
  *(e.g., in a grant panel, should some members’ votes count more than others on key issues to ensure coherence?)*  
  - **No** → **Leaf 1: Bite the bullet**  
    *Position: Accept occasional inconsistency as the price of equal voting rights.*  
    *Awkward commitment: The group may endorse contradictory actions (e.g., funding a project while rejecting its feasibility), risking paralysis or reputational damage.*  
  - **Yes** → Proceed to Q8.  

  **Q3: Is it acceptable for the group to leave some propositions undecided to preserve consistency?**  
  *(e.g., should your hiring committee avoid voting on “The candidate fits our values” if it could create conflict with other judgments?)*  
  - **Yes** → **Leaf 2: Retreat to incomplete consistency**  
    *Position: Ensure collective judgments are consistent but not necessarily complete (i.e., silence on some issues).*  
    *Awkward commitment: Critical decisions may be delayed or avoided (e.g., not ruling on causation in a court case), undermining accountability.*  
  - **No** → Proceed to Q4.  

  **Q4: Should the group treat every proposition identically in voting?**  
  *(e.g., in a church synod, should “Scripture permits same-sex marriage” and “We should update doctrine” get equal votes, regardless of logical links?)*  
  - **Yes** → Proceed to Q5.  
  - **No** → Proceed to Q6.  

  **Q5: Must full agreement be required for any collective judgment?**  
  *(e.g., should your grant panel demand unanimity on “The project is innovative” before accepting it?)*  
  - **Yes** → **Leaf 3: Oligarchy (unanimity threshold)**  
    *Position: A proposition is affirmed only if all members accept it (a form of weighted voting where everyone has veto power).*  
    *Awkward commitment: Deadlock is common (e.g., no hire is ever made if one member objects), favouring the status quo.*  
  - **No** → Proceed to Q7.  

  **Q6: Should the group prioritise voting on “foundational” propositions (premises) over “derived” ones (conclusions)?**  
  *(e.g., in a parole board, should you vote on “The prisoner is rehabilitated” first and derive “Release should be granted” logically?)*  
  - **Yes** → **Leaf 4: Premise-based procedure**  
    *Position: Vote only on premises, then derive conclusions logically.*  
    *Awkward commitment: Conclusions may defy majority will (e.g., releasing a prisoner because premises support it, even if most oppose release).*  
  - **No** → Proceed to Q9.  

  **Q7: Is it acceptable for one member to unilaterally decide the group’s judgment?**  
  *(e.g., in a hiring committee, should the chair single-handedly settle “We should make an offer” if votes are split?)*  
  - **Yes** → **Leaf 5: Dictatorship**  
    *Position: Defer to one member (e.g., chair or expert) on all propositions.*  
    *Awkward commitment: Ignores collective wisdom (e.g., one person overrides evidence-based objections), risking bias or error.*  
  - **No** → **Leaf 6: Oligarchy (fixed subset)**  
    *Position: A fixed group (not the whole) must agree for a judgment to stand (e.g., a subcommittee).*  
    *Awkward commitment: Disempowers non-oligarchs (e.g., junior panelists’ views are ignored), potentially entrenching elitism.*  

  **Q8: Should the group defer to the most knowledgeable member(s) on each issue?**  
  *(e.g., in a grant panel, should you always follow the lead scientist on technical propositions?)*  
  - **Yes** → **Leaf 7: Epistemic deference**  
    *Position: Follow the member(s) judged most competent (e.g., by track record or expertise).*  
    *Awkward commitment: Identifying “competence” is subjective (e.g., may marginalise minority perspectives), and deference may not resolve group inconsistency.*  
  - **No** → Proceed to Q9.  

  **Q9: Should the group only vote on the “final” proposition (conclusion)?**  
  *(e.g., in a church synod, should you vote only on “We should update doctrine” and ignore debates about scripture?)*  
  - **Yes** → **Leaf 8: Conclusion-based procedure**  
    *Position: Vote only on conclusions, leaving premises unstated.*  
    *Awkward commitment: Lacks rationale for decisions (e.g., releasing a prisoner without agreeing on why), making appeals or future rulings arbitrary.*  
  - **No** → **Leaf 9: Weighted voting (non-oligarchic)**  
    *Position: Give extra voting weight to certain members (e.g., seniority-based) but without veto powers.*  
    *Awkward commitment: May not prevent inconsistency (e.g., if weighted majority votes yield conflicting judgments), and risks perceived unfairness.*  

  ---

  ### **Notes on the Tree**  
  1. **Indistinguishable Positions**: The tree cannot fully separate:  
     - **Premise-based vs. agenda restriction**: Voting only on premises (Leaf 4) is operationally identical to excluding conclusions from the agenda.  
     - **Epistemic deference vs. oligarchy**: If deference (Leaf 7) concentrates power in a few "experts," it mirrors oligarchy (Leaf 6), differing only in justification (competence vs. fixed authority).  
     - **Conclusion-based vs. incomplete consistency**: Conclusion-based (Leaf 8) resembles the retreat to incompleteness (Leaf 2) if premises are ignored entirely.  

  2. **Coherent but Undefended Combinations**:  
     - **Q5→Q7→"No"**: Rejecting both unanimity and dictatorship while demanding equal treatment (Q4→Yes) leads to an unstable position. It implies a non-oligarchic rule for consistency/completeness, which is impossible (proof: discursive dilemma generalises). *Why undefended?* Unattractive (denies proven trade-offs).  
     - **Q6→Q9→"No"**: Rejecting both premise and conclusion-based approaches without deferring to competence (Q8→No) implies ad-hoc prioritisation (e.g., voting on "most important" propositions first). *Why undefended?* Unstable once spelled out—priorities are subjective and may not ensure consistency.  

  3. **Tree Statistics**:  
     - 9 branch questions (Q1–Q9).  
     - 9 leaves covering all required positions.  
     - Typical path: 3–5 questions to a leaf.  

  **Instructions for Use**: In your seminar, have students answer Q1–Q9 in sequence (e.g., via clickers or show of hands) before revealing the leaves. Discuss blurred distinctions and undefended positions to highlight real-world complexity.  

  ---  
  *Handout ends*
