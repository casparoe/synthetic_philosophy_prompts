  ## MINISTRY OF POPULATION FUTURES  
  **White Paper: PFP/24/09 - Statutory Protection of Prospective Persons**  
  *Forwarded by the Right Hon. Alistair Thorne MP, Minister for Demographic Continuity*  

  **Foreword:**  
  The sanctity of human potential forms the bedrock of a compassionate society. Her Majesty’s Government, guided by the unimpeachable ethical principle that the moral gravity of loss resides in the *value of the future deprived* (cf. *Future-Like-Ours Doctrine, Section 1.1*), has long recognised the profound wrong inherent in terminating extant lives. It is, however, a matter of profound national regret that our protective duty has hitherto been applied with tragic selectivity. Today, we rectify this historic oversight. This White Paper outlines the establishment of the **Ministry of Possible Persons (MoPP)** and its foundational **Prospective Persons Protection Act 2025**. Our solemn mandate: to safeguard *all* futures of value, irrespective of their current ontological status. The non-existence of a beneficiary must never impede our duty to their potential.  

  ### SECTION 1: POLICY RATIONALE & ETHICAL FRAMEWORK  
  1.1 **Foundational Principle:** The primary wrong in wrongful killing is the deprivation of a Subjectively Valuable Future (SVF) – a continuum of experiences, projects, and enjoyments akin to those valued by conscious beings (Ref: *Ethical Foundations Report, Annex A*).  
  1.2 **Extension of Duty:** An SVF possesses intrinsic moral worth *independently* of its current attachment to a breathing entity. To deprive a *possible* entity of its *definite* SVF constitutes an equivalent moral harm.  
  1.3 **The Determinate Victim Imperative:** Previous objections alleging the "non-identity problem" (i.e., no specific victim exists to be deprived in cases of non-conception) have been resolved. The MoPP, through rigorous actuarial and metaphysical modelling, will **assign a unique Provisional Tax Reference Number (PTRN)** to every conceivable future person at the point of biological possibility. *This establishes determinate victimhood prior to conception.*  

  ### SECTION 2: OPERATIONALISATION OF DETERMINATE VICTIMHOOD (PTRN SYSTEM)  
  2.1 **Individuation Protocol:** Upon menarche (female) or spermarche (male), citizens will be registered with the **Central Potential Person Registry (CPPR)**.  
  2.2 **Ovulation/Spermatozoa Event Registration:** Citizens of child-bearing capacity (CBC) are required to submit monthly notifications via the *Gov.UK/FutureWatch* portal, indicating fertile windows based on approved hormonal tracking kits or certified calendar methods.  
  2.3 **PTRN Generation:** At the commencement of each notified fertile window, the CPPR algorithm generates a unique PTRN linked to the specific gametic potential presented by that citizen (or couple, if partnered). This PTRN represents the *specific possible person* whose SVF is contingent upon conception occurring within that window.  
  2.4 **Victim Status:** The PTRN-holder is henceforth recognised in statute as a **Prospective Person of Value (PPoV)**, possessing full moral standing. Deprivation of its SVF constitutes actionable harm.  
  > **Footnote (Ministry Ethics Oversight Committee):** *The Committee reiterates its formal dissent on PTRN validity (Ref: DIS/24/03b). Harm necessitates an entity capable of experiencing loss. A PTRN designates a mathematical construct, not a being with interests. Assigning "victimhood" to a non-entity is logically incoherent and...*  
  > ***(Ministry Response):*** *Dissent noted. Committee directed to resubmit DIS/24/03b using Form PP-ETH7 (Triplicate), ensuring Section 4.2 (Reconciliation with Core SVF Principle) is fully completed. Failure to comply may affect future funding allocation.*  

  ### SECTION 3: KEY PROTECTION PROGRAMMES  
  3.1 **Monthly Future Protection Quota (FPQ):**  
      *   3.1.1 Cohabiting CBC couples are assigned a monthly FPQ of *one* conception attempt during a notified fertile window.  
      *   3.1.2 Non-fulfilment without MoPP-authorised exemption (Form PP-EX1: Medical, Hardship, or Essential State Service Conflict) constitutes a Deprivation Offence.  
      *   3.1.3 **Penalty:** A fine calculated via the *SVF Deprivation Valuation Index (SDVI)*. The SDVI aggregates median lifetime tax contributions, projected GDP per capita share, and hedonic well-being metrics. (Initial estimates: £2,345 per offence, Q1 2026, inflation-adjusted).  
  3.2 **Menstrual Bereavement Allowance (MBA):**  
      *   3.2.1 Recognising the loss of the PTRN-designated PPoV associated with each ovulation cycle not resulting in conception, registered females are entitled to a non-taxable payment of £75 per menstrual period.  
      *   3.2.2 Claim via _Gov.UK/FutureGrief_, requiring confirmation of registered fertile window and negative conception test (MoPP-approved kit mandatory).  
  3.3 **National Day of Lost Potential (NDLP):**  
      *   3.3.1 Held annually on February 30th^1. A national moment of silence (11:03 am) marking cumulative PPoV loss due to abstinence, contraception, or FPQ non-compliance.  
      *   3.3.2 Flags flown at half-mast on all government buildings. Public awareness campaigns ("*Think of the Trillions: They Could Have Been Us*") mandated.  
  ^1 *Administratively adjusted; falls on March 1st in non-leap years.*

  ### SECTION 4: COMPLIANCE & PUBLIC ENGAGEMENT  
  4.1 **Enforcement:** MoPP Compliance Officers will conduct random audits of *FutureWatch* submissions and FPQ fulfilment declarations. Falsification is a Category B Offence (max. 6 months community service or SDVI x 3 fine).  
  4.2 **Addressing Misplaced Analogies:** Citizens repeatedly invoking the "Unconscious Violinist" hypothetical during consultations or on social media platforms (arguing against compulsory gestation) are to be issued with Standard Response Pack V-01, clarifying its irrelevance: the violinist exists; our concern is the *potential* violinist deprived of their future symphony career. Persistent misuse may constitute Obstruction of Future Welfare Duties.  
  4.3 **Representation Deficit:** The Minister notes, with regret, that current polling indicates 100% dissatisfaction with MoPP policies among the *extant* population (YouGov/MoPP, Jan '26). This underscores the profound isolation of the voiceless PPoV constituency. The Permanent Secretary is directed to commission a feasibility study (Ref: PS/26/08) on mechanisms for representing PTRN-holders in Parliamentary processes, potentially via algorithmically generated proxy votes weighted by projected SVF magnitude.  

  **Conclusion:**  
  The MoPP embodies a courageous commitment to ethical consistency. By granting determinate status to the possible and valuing the future *in itself*, we transcend the parochial bias of the merely actual. We protect not just who *is*, but who *might be* – the ultimate expression of intergenerational justice. Resistance is anticipated, for the demands of pure logic often sit uneasily upon those preoccupied with the present. We proceed, fortified by the certainty that trillions of potential futures, each assigned its unique PTRN, depend upon our vigilance.  

  **Alistair Thorne MP**  
  Minister for Demographic Continuity  
  On behalf of Her Majesty’s Government  

  ---
