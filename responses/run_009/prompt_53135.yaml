answer: |-
  ### **Staged Scenario: The Gala Ticket Dilemma**  
  **Objective:** Students experience Sen's liberal paradox firsthand, discovering the conflict between unanimity (Pareto) and individual rights through role-play and collective decision-making. The debrief links the exercise to formal theory.

  ---

  ### **Materials & Setup**  
  - **Room Setup:** Chairs in a circle. Three signs: "MILO GOES," "JUNO GOES," "TICKET EXPIRES."  
  - **Props:**  
    - A physical "ticket" (index card) to pass around.  
    - Timer visible to all (set to 75 minutes for RSVP "deadline").  
  - **Cast:**  
    - **Milo:** Role-played by a student (brief emphasizes protective paternalism).  
    - **Juno:** Role-played by a student (brief emphasizes mischievous altruism).  
    - **Class (12 students):** The "board" deciding the ticket’s fate. They represent a collective with identical preferences (see *Board Brief* below).  
  - **Character Briefs (Distributed secretly to actors):**  
    - **Milo’s Brief:**  
      *"You despise industry galas—they’re pretentious and corrupting. Worst of all, Juno is impressionable; if she goes, she’ll turn into one of ‘them.’ You’d rather swallow broken glass than watch that happen. So: (1) BEST = Ticket expires (nobody goes); (2) OK = You go (you’ll suffer to protect Juno); (3) WORST = Juno goes (she’ll be ruined). When speaking: Show disgust for galas, concern for Juno, and reluctant willingness to ‘take the hit.’"*  
    - **Juno’s Brief:**  
      *"You think galas are fun, but Milo is hilariously grumpy about them. You’d pay money to watch him suffer through champagne small-talk! (1) BEST = Milo goes (comedy gold + he might loosen up); (2) OK = You go (fine, but less fun); (3) WORST = Ticket expires (wasted opportunity). When speaking: Be upbeat; joke about Milo’s grumpiness; stress FOMO if the ticket expires."*  
  - **Board Brief (For the 12 deciders):**  
    *"As the board, you care about fairness and morale. After hearing Milo/Juno, you’ll ALL agree: (1) Milo going > Juno going (it’s funnier and he needs networking); (2) Juno going > Ticket expiring (wasteful); (3) Ticket expiring > Milo going (he clearly hates it). Your actual preferences: **MILO GOES > JUNO GOES > TICKET EXPIRES**."*  

  ---

  ### **Timeline (80 Minutes)**  
  #### **Phase 1: Set-Up (0–15 min)**  
  - **0–5 min:** Introduce the scenario.  
    *"Our tiny firm has one gala ticket. It can go to Milo, Juno, or expire. RSVP due in 75 minutes. Let’s hear from Milo and Juno."*  
  - **5–10 min:** **Milo speaks.**  
    Elicits his preferences:  
    > *"These galas are toxic. I’d rather it expire. But if someone *has* to go? Fine, I’ll suffer through it. Juno’s too nice for that snake pit—she’d come back a different person."*  
    *(Students infer: Expire > Milo > Juno)*  
  - **10–15 min:** **Juno speaks.**  
    Elicits her preferences:  
    > *"Milo’s being dramatic! It’s fun! But honestly? I’d *way* rather watch him try to network. Picture it: Milo in a tux, scowling! If he won’t go, I’ll go, but letting it expire is so boring."*  
    *(Students infer: Milo > Juno > Expire)*  

  #### **Phase 2: Rule Creation (15–25 min)**  
  - **15–20 min:** Elicit Rule 1 (Pareto).  
    *"How should we decide? Should we have ground rules?"*  
    - **Prompt:** *"If we all agree Option A is better than Option B, should that guarantee A wins?"*  
    - **Goal:** Students propose a unanimity rule. Vote to ratify (show of hands).  
  - **20–25 min:** Elicit Rule 2 (Minimal Liberalism).  
    *"What about personal freedom? Should Milo/Juno control choices affecting only them?"*  
    - **Prompt:** *"Does Milo get to decide whether *he* goes or it expires? Does Juno get to decide whether *she* goes or it expires?"*  
    - **Goal:** Students propose individual rights over personal pairs. Vote to ratify.  
    - **Critical:** Confirm rights assignments:  
      - **Milo’s right:** Decides between {TICKET EXPIRES, MILO GOES}.  
      - **Juno’s right:** Decides between {TICKET EXPIRES, JUNO GOES}.  

  #### **Phase 3: Decision Process (25–60 min)**  
  - **25–40 min:** Open discussion.  
    - **Professor stays silent.** Students debate options using rules.  
    - **Likely path:**  
      1. Apply Milo’s right → He picks TICKET EXPIRES over MILO GOES.  
      2. Apply Juno’s right → She picks JUNO GOES over TICKET EXPIRES.  
      3. Outcome: **JUNO GOES** (the only option left).  
  - **40–50 min:** Vote to confirm.  
    *"RSVP due soon! Final vote: Milo, Juno, or Expire?"*  
    - **Prediction:** Class chooses JUNO GOES (only "valid" option under the rules).  
  - **50–60 min:** Trap sprung.  
    - **Audit:** *"Hold on. Let’s check our rules. First, does everyone prefer something else over Juno going?"*  
      - Milo: Prefers Expire or Milo > Juno.  
      - Juno: Prefers Milo > Juno.  
      - Board: Prefer Milo > Juno (per brief).  
      → **Everyone prefers MILO GOES > JUNO GOES.**  
    - *"Rule 1 (unanimity) says MILO GOES should beat JUNO GOES. But to get Milo to go, we’d have to override his right to choose Expire over going. Rule 2 forbids that. Which rule did we break to land on Juno going?"*  
    - **Punchline:** A student should say: *"We violated Rule 1—unanimity couldn’t happen without breaking Rule 2."*  

  #### **Phase 4: Debrief (60–80 min)**  
  - **60–65 min:** Name the paradox.  
    *"You’ve experienced Sen’s liberal paradox (1970). Minimal liberalism + Pareto optimality are incompatible. Here’s how it maps:*  
    - **Pareto:** Unanimity rule → *If all prefer X > Y, society must prefer X > Y.*  
    - **Liberalism:** Individual rights → *Each person controls at least one personal pair (here, Milo on {Expire, Milo}, Juno on {Expire, Juno}).*  
    - **Cycle:** Rights force Expire > Milo (via Milo) and Juno > Expire (via Juno) → Juno > Expire > Milo → Juno > Milo. But unanimity demands Milo > Juno. Contradiction!"*  
  - **65–75 min:** Discuss escape hatches.  
    - **Sen’s meddlesome preferences:**  
      *"Sen argued preferences about others’ lives (like Milo’s fear for Juno or Juno’s schadenfreude) shouldn’t count as ‘real’ unanimity. Should we discount nosy preferences? What if Milo *only* cared about his own comfort?"*  
    - **Tradeable rights:**  
      *"Could Milo ‘sell’ his right to avoid the gala? (e.g., Juno covers his shift). But what if he refuses? Does that deepen inequality?"*  
    - **Weaken liberalism:**  
      *"Should rights be overridable by supermajority? Or should ‘personal sphere’ pairs be narrowed (e.g., only {Milo goes, Expire} counts)?"*  
  - **75–80 min:** Own the limitations.  
    - *"This exercise can’t show Sen’s full theorem: Preferences were fixed, no bargaining allowed. Real-world rights often involve trade (e.g., contracts). But Sen’s point stands: even minimal rights can clash with welfare. Next class: Gibbard-Satterthwaite on strategic voting!"*  

  ---

  ### **Predictable Challenges & Mitigation**  
  1. **Students don’t propose the rules:**  
     - **Fix:** Seed the idea. Ask: *"Should group unanimity always win?"* and *"Should individuals control personal choices?"*  
  2. **Class resists unanimous preferences:**  
     - **Fix:** Stress the board’s role: *"As the firm’s stewards, you all agree Milo going > Juno going."*  
  3. **Decision path diverges:**  
     - **Fix:** If students bypass rights, ask: *"Did we violate Rule 2?"* If they ignore unanimity, ask: *"Does everyone prefer Milo going? Why didn’t that happen?"*  
  4. **Milo/Juno miscommunicate preferences:**  
     - **Fix:** Rehearse actors. Use prompts: *"Milo, why not let Juno go?"* → *"I’m protecting her!"*  

  ### **Why This Works**  
  - **Preferences are revealed organically** through dialogue (no rankings shown).  
  - **Students co-create rules**, investing them in the paradox.  
  - **The trap is visceral:** Choosing Juno feels "fair" until they realize they overruled unanimity.  
  - **Debrief grounds abstraction** in their lived experience.  

  Sen’s paradox emerges not as lecture, but as a collective "aha!" moment. The exercise’s rigidity (no bargaining) becomes a strength, highlighting the theorem’s core: rights and welfare clash even with good intentions.
