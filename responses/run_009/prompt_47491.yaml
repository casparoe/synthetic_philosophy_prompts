  I'm a philosophy of science grad student drafting a proposal for a one-semester term paper (~8000 words), and I want to run my half-formed idea by you. The idea concerns Solomonoff induction and the usual story that it vindicates Occam's razor: put a prior over computable hypotheses weighted by 2^(-description length), and simpler hypotheses automatically get more prior mass. The standard objection is that Kolmogorov complexity depends on which universal machine you use as your reference, and the standard reply is the invariance theorem — the complexity of a fixed string under two universal machines differs by at most an additive constant. My suspicion is that this reply quietly does nothing for any realistic agent: for any finite data set the constant can dwarf the data-dependent terms, so the machine choice dominates exactly where it matters. So maybe the razor's supposed objectivity is "constant-term objectivity," which is no objectivity at all for finite observers, and the constant should instead be read as encoding substantive a priori inductive commitments (the machine choice IS your background knowledge) rather than a technical nuisance. The question I'd want the paper to answer isn't "is the razor machine-independent?" — it clearly isn't in any finite sense — but something more like "once you subtract out asymptotic results that never kick in for real observers, what epistemic work is Solomonoff induction actually doing, and is what's left over enough to justify calling it a vindication of Occam?"

  Write the proposal for me. State the question precisely enough that it could in principle come out either way (I want it falsifiable-ish, not a disguised rant), explain why the two familiar positions — "invariance saves objectivity" and "it's all language-relative so formal Occam is empty" — leave it open, and say what I'd actually do, month by month. My tentative method: (1) reconstruct the invariance argument carefully and locate exactly where the finite-data problem enters, (2) work through two or three small concrete cases where I can actually compute or bound complexity differences under two different encodings, so the "constant swamps the data" claim is demonstrated rather than hand-waved, and (3) evaluate whether any of the proposed fixes for machine-dependence (e.g. restricting to "natural" encodings, or aggregating over machines) can do better, or whether they just relabel the problem. Also include what would count as the paper failing, and an honest assessment of whether it fits in one semester — I'm solid on logic but rusty on computability theory, so flag any part that secretly requires more technical background than it looks like it does.

  One more thing: please be careful to keep apart what is genuinely settled mathematics (the invariance theorem itself, the additive-constant bound) from what is contested interpretation of what that math means for induction. I don't want to present some minority reading of the theorem as the consensus view — my advisor will nail me for that. No citations or bibliography, I'll fill those in myself.
