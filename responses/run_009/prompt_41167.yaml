  ## Dialogue: The Administrator's Indifference

  **Setting:** A coffee-scented corner of a philosophy conference. **Dr. Maya Voss** (normative intentionalist) sips espresso while **Dr. Ben Carter** (pragmatic artifact theorist) stirs his tea.

  **Maya:** Ben, that paper on the Knobe effect was fascinating, but I think it missed the core insight. Take this variant I’ve been pondering: A hospital administrator implements a new scheduling system solely to cut costs. She *knows* it will *add* an hour of uncompensated paperwork to every nurse’s shift. She explicitly says, "I don't care about nurse workload, only the budget." What happens?

  **Ben:** Ah, the classic asymmetry setup. People would likely say she *intentionally* burdened the nurses. The mirror case – same setup, but the system *removes* an hour of paperwork, and she doesn't care – they'd deny she *intentionally* helped them. Textbook Knobe effect. But Maya, that doesn't prove normativity *in* intentionality. It shows normativity *distorting* the attribution.

  **Maya:** Distorting? No, it’s *revealing*! The folk concept *is* normative. In the harm case, her indifference is culpable – she *should* care about exploiting her staff. That culpability integrates into the judgment of intentionality itself. It’s not a distortion; it’s the concept functioning correctly. The administrator *intentionally* inflicted that burden precisely *because* it was a normatively negative side-effect she callously disregarded.

  **Ben:** Hold on. Why would the asymmetry even appear here? The "victim" is internal, contractual. Adding paperwork is annoying, maybe unfair, but is it *morally wrong* like harming the environment? It's more like a breach of implicit contract or poor management. If we ran the study, I suspect the asymmetry would be *smaller* or even vanish. People might just say she knowingly caused it, not necessarily *intentionally*.

  **Maya:** That’s an empirical prediction, Ben, and I disagree. The nurses *are* being wronged – their time and labor are being exploited without compensation. The administrator’s indifference *is* blameworthy. That normative dimension *will* trigger the asymmetry. The folk aren’t confusing ‘intentionally’ with ‘blameworthily’; they’re recognizing that intentional action, when it disregards salient negative norms, incorporates that disregard. Philosophers who defined intentionality purely in terms of belief, desire, and awareness were descriptively inadequate! The Knobe effect *is* the folk concept.

  **Ben:** Strong claims! But look at the mechanism: When people hear "He intentionally harmed X," especially when blame is primed, they hear an *accusation*. The word "intentionally" gets pragmatically loaded. In the help case, "intentionally helped" sounds like praise, which clashes with the indifference. So they deny it. It’s not about the *concept* of intentionality containing normativity; it’s about the *word* "intentionally" being deployed pragmatically to express blame (or avoid implying praise). If we probe with neutral language – "Did she bring about the outcome *on purpose*?" or use scales instead of yes/no – the asymmetry shrinks! That screams *artifact*, not conceptual truth.

  **Maya:** Shrinks, Ben, but rarely vanishes entirely! And what about non-moral normativity studies? When the side-effect is a *violation of etiquette* or an *aesthetic offense*, asymmetries still appear! How does your 'pragmatic blame-loading' explain that? Are people confusing intentionality with *rudeness*? No. It suggests the underlying concept is sensitive to *normative status* broadly – whether moral, prudential, or conventional. The administrator’s action violates norms of fair labor treatment. That’s sufficient for the asymmetry because intentionality *is* partly normative.

  **Ben:** Fair point on non-moral norms. But let’s push your administrator case. *Why* is adding paperwork normatively salient? Is it inherently wrong, or does it depend on context? What if the nurses are massively overpaid? What if the paperwork saves patient lives? Your normative view becomes incredibly slippery. Is *any* negatively valenced outcome sufficient? What if the administrator *knew* the new schedule would slightly annoy the nurses by changing their break times? Would *that* be intentional harm? Probably not! So now you need a theory of *which* norms count and *how much* valence is needed. That’s messy. My view is cleaner: the asymmetry arises when the outcome is saliently *bad enough* to trigger a *blame response*, which then contaminates the judgment via pragmatic pressure on the word "intentionally." In the paperwork case, it might work if subjects feel strongly about worker exploitation. But if they see it as mere inefficiency? No asymmetry. The effect depends on the *strength of the blame reaction*, not an inherent feature of intentionality.

  **Maya:** But Ben, that just outsources the problem! You still need to explain *why* the blame reaction asymmetrically affects the *intentionality* judgment and not just a separate blame judgment. Why doesn’t pragmatics contaminate the *knowledge* attribution? People consistently say the chairman *knew* the harm would happen in *both* cases! The asymmetry is specific to *intentionality*. That suggests the folk concept itself has a normative hook – blame ‘sticks’ to intentionality precisely because normativity is part of its structure. The administrator *knew* she was burdening the nurses, but she only *intentionally* did it because the burden was normatively negative and she was indifferent. In the help case, the lack of a positive norm (she didn’t *aim* to help) combined with no negative valence means the indifference doesn’t trigger the ‘intentional’ label.

  **Ben:** Knowledge is factual; intentionality involves the *will*. Blame naturally attaches more easily to the exercise of the will when outcomes are bad! It’s not that intentionality *is* normative; it’s that *assessments* of the will are *sensitive* to normative context. That sensitivity can be triggered or mitigated by framing, population (e.g., experts vs. folk), and the *type* of bad outcome. Your nurse case is perfect: Is adding paperwork *bad enough* to be a salient wrong? Is it environmental-harm-level bad? Probably not for everyone. If we find asymmetry here, it supports *your* view that normativity is broad. If we don’t, or if it’s weak, it supports *mine* that it requires a strong, clear blame trigger. But either way, the *source* is pragmatic contamination of the attribution *process*, not the *concept* itself.

  **Maya:** And if the asymmetry *is* robust here, even with an internal, arguably lesser wrong? Doesn't that show the folk concept is deeply normative, tracking *any* disregard of salient negative norms in action? The administrator’s callous indifference *makes* the harming intentional.

  **Ben:** Or it shows that people *interpret* "intentionally" in that context as synonymous with "culpably" or "blameworthily," precisely because the normative violation is salient! We’re circling back. We need data on *this* case. But until then, I’ll stick with Occam’s razor: pragmatics explains the asymmetry without needing to redefine a core action-theoretic concept. The burden of proof is on you to show it’s not an artifact.

  **Maya:** And I’ll stick with descriptive adequacy: the Knobe effect reveals something true and deep about how we understand human agency – normativity isn't contamination, it's constitutive. The administrator's story proves the point. The data *will* show the asymmetry.

  **(They both glance towards the conference hall where new empirical studies might be presented later, a silent agreement to continue the debate with evidence.)**

  ---
  **Key Arguments Summarized:**

  *   **Maya (Normative):** Asymmetry arises because intentionality *incorporates* normativity; disregard of negative norms makes side-effect intentional. Persists even in "lesser wrongs" (like paperwork burden) because normativity is broad. Knowledge asymmetry proves normativity is specific to *intentionality*, not general pragmatics.
  *   **Ben (Artifact):** Asymmetry arises because "intentionally" is pragmatically loaded to express blame for bad outcomes, not because normativity is *in* the concept. Effect depends on strength of blame reaction and can be reduced with neutral probes. Nurse case may show weak/no asymmetry due to lesser normative salience, supporting a pragmatic explanation. Need to explain *which* norms count and *how much* valence is needed weakens the normative view.
  *   **Strongest Objection to Maya:** How do you define *which* norms are salient enough to integrate into intentionality without arbitrariness? Why no asymmetry for trivial annoyments?
  *   **Strongest Objection to Ben:** Why doesn't the pragmatic "blame-loading" affect the *knowledge* attribution equally? Why is the asymmetry specific to *intentionality* if it's just general pragmatic contamination?
