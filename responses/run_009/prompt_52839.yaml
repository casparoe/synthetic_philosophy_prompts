prompt: |-
  Been reading some alignment-adjacent stuff and I keep bumping into a cluster of ideas I'll sketch below so we're on the same page, since you cant look anything up. The setup: imagine a very capable AI that learns its own rich world-model from data. Its internal concepts ("person", "valuable", "deception") needn't be structured the way ours are — maybe its version of "person" lumps together minds and their close copies, or carves cognition along lines no human ontology uses. Two related problems come out of this:

  1. Ontology identification: how do we get its concepts to line up with ours (or with our values) well enough that when it optimizes for what it internally represents as "good", that actually lands on what we care about?
  2. Inaccessible information: some things are easy for such a system to notice and act on but nearly impossible for it to point out or explain to us — like how you can ride a bike but cant fully convey the skill in words, except scaled up and much more severe.

  I want the requirements list for any solution to (1) that also takes (2) seriously. For each requirement, give the motivating case — a concrete situation where a solution lacking that requirement fails badly. At least one requirement should follow specifically from (2) and not just from (1), so think hard about what follows if the model literally cannot state its concepts in human terms. Then mark which requirements are non-negotiable versus which are really just preferences of one camp, say whether any subset of the requirements is jointly unsatisfiable (that part I care about most), and tell me which single requirement knocks out the most solution-approaches you can think of.

  Sections in this order, please: "The problem in my own words" (you restate the target in one short paragraph, so I can check we actually agree on what's being asked), "Requirements" (the bulk of it, roughly 6-9 items, each with its case), "Non-negotiable vs camp preferences", "Joint satisfiability", "The knockout requirement". Keep the whole thing under ~900 words and dont pad.
