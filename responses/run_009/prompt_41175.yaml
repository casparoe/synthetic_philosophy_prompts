prompt: |-
  At a philosophy of mathematics reading group I attend, two members — a doctoral student and a retired programmer — got into a long argument about the epistemic status of the Church–Turing thesis, and I honestly couldn't tell who was winning. It went roughly as follows.

  1. The programmer argued that the thesis is a well-confirmed empirical hypothesis. Turing machines, lambda calculus, Post systems, register machines, and other independently proposed formal models all turned out to compute exactly the same class of functions, and that convergence, he said, is like several independent measurements of the same quantity agreeing — evidence that we have latched onto a real feature of the world.

  2. The student replied that all those equivalences are theorems about formal systems, not observations, so they can't be evidence in any empirical sense. On her view, the thesis functions as a definition — an explication of the pre-formal notion of effective calculability — and treating it as a hypothesis confuses the mathematical fact that the various formal systems are equivalent with the entirely different claim that any of them captures the informal concept.

  3. The programmer pushed back: if it were a mere definition, nothing would stop us from defining 'calculable' as, say, computable in polynomial time, or as decidable by some device whose powers outrun any Turing machine, and we plainly resist such redefinitions. Moreover, if someone built a physical machine that correctly settled questions no Turing machine could, we would abandon the thesis, and a claim we would abandon in those circumstances is ipso facto empirical. He added that the thesis might in the end follow from physics, since whether such devices are possible is plausibly a question about what the laws of nature permit.

  4. The student answered that what blocks the arbitrary redefinitions is not empirical content but the paradigm cases built into our usage of the word: a calculation proceeds by finite means, mechanically, without insight into infinitely many steps at once. So the thesis is closer to a claim defended by conceptual analysis of an informal notion — one that can be argued for, but neither proved mathematically nor cleanly falsified, since if some apparatus seemed to decide undecidable questions we could always deny that it was calculating rather than merely undergoing a natural process and reporting an outcome.

  They eventually gave up on each other and asked me to referee, which I was in no position to do. Could you adjudicate the exchange move by move? For each of the four moves, say whether it is right, partly right, or mistaken, and why. Then give your own view of the thesis's epistemic status: is it a definition, an empirical hypothesis, something in between, or something none of these categories fits? And if you think both parties share a mistaken assumption that keeps the dispute alive, please identify it.
reasoning: |-
  Okay, I need to carefully analyze this debate about the Church-Turing thesis. The programmer sees it as an empirical hypothesis, while the student views it as a definition or conceptual analysis. Let me break down each of their arguments.

  First, the programmer's initial point about multiple formal models converging on the same class of functions. That seems strong—it's like different experiments yielding consistent results. But the student counters that these equivalences are proven mathematically, not observed, so they can't be empirical evidence. She has a point too; theorems aren't data points. 

  Then the programmer's pushback about resisting arbitrary redefinitions and hypothetical physical machines—that feels compelling. If we'd abandon the thesis upon encountering a super-Turing device, that does sound empirical. But the student's reply about paradigm cases makes sense; our concept of calculation has built-in constraints like finite mechanical steps. 

  Hmm... both have valid perspectives. The programmer emphasizes how we'd react to real-world evidence, while the student focuses on the meaning of "calculability." Maybe they're talking past each other? The core issue might be treating "empirical" and "conceptual" as mutually exclusive when the thesis bridges both. It's not merely a definition because it makes a claim about reality, but not a standard hypothesis because it's constrained by our concepts. 

  I recall that some philosophers like Shapiro see it as a "two-level" principle—both defining a term and making a synthetic claim. That resonates here. The physical realizability angle adds weight to it being more than definitional, but the student's paradigm cases prevent it from being purely empirical. 

  Their shared mistake? Probably assuming a strict dichotomy between empirical and conceptual. The thesis might be a unique blend: a conceptual analysis with empirical implications, or a "framework principle" that shapes how we interpret both math and physics. When the programmer mentions physics determining computability, he's right about feasibility, but wrong to think the thesis itself is derivable from physics—it's presupposed in defining what "computing" means physically. 

  Final view: The thesis is a hybrid. It's anchored in conceptual analysis (justifying why we fix this definition) but functions as a testable claim about physical realizability. Not cleanly categorizable, but that's why the debate persists—both sides capture part of the truth.
answer: |-
  Let's adjudicate this exchange move by move, then synthesize the epistemic status of the Church-Turing Thesis (CTT).

  ### Move-by-Move Adjudication
  **Move 1 (Programmer: CTT is empirical due to convergence of formalisms)**  
  - **Partly Right, but Misleading.**  
    The convergence of independent formalisms (Turing machines, λ-calculus, etc.) *is* remarkable and provides *indirect* support for CTT. However, this convergence is **mathematical** (all are provably equivalent systems), not empirical. It suggests robustness in capturing an *abstract concept*, but doesn’t directly test physical realizability.  
    *Verdict:* **Partly right** — the convergence is evidence of conceptual coherence, not empirical confirmation.

  **Move 2 (Student: Equivalences are theorems, so CTT is a definition)**  
  - **Partly Right, but Overstated.**  
    The equivalences *are* mathematical theorems, so they can’t be empirical evidence. CTT *does* function as an **explication** (Carnap’s term) of "effective calculability," fixing a precise formal concept. However, calling it *merely* a definition ignores its role in claiming that this formalization maps onto a pre-theoretical notion *and* physical reality.  
    *Verdict:* **Partly right** — CTT has a definitional core but transcends pure stipulation.

  **Move 3 (Programmer: Resistance to redefinition & empirical falsifiability)**  
  - **Mostly Right.**  
    His key points stand:  
    - We *do* resist redefining "computable" arbitrarily (e.g., as P-time) because CTT is anchored to a *pre-formal concept* with paradigm cases (e.g., human clerks following algorithms).  
    - CTT *would* be abandoned if a physical device computed a non-Turing-computable function. This hypothetical falsification *is* empirical.  
    - His physics angle is plausible: physical laws *might* constrain computability.  
    *Verdict:* **Mostly right** — CTT’s empirical dimension arises from its claim about physical realizability.

  **Move 4 (Student: Paradigm cases block redefinition; CTT is conceptual analysis)**  
  - **Largely Correct.**  
    She correctly identifies that the "finite, mechanical, no insight" constraints stem from conceptual analysis of pre-theoretic notions. Her point about denying "calculation" for a super-Turing device (e.g., calling it "natural" rather than algorithmic) highlights CTT’s role in *defining the criteria* for what counts as computation.  
    *Verdict:* **Largely correct** — CTT is grounded in conceptual analysis, and its criteria shape how we interpret empirical evidence.

  ### Shared Mistaken Assumption
  Both parties implicitly assume a **rigid dichotomy between "empirical hypothesis" and "definition/conceptual analysis."** This is the root of the deadlock. CTT is neither purely empirical nor purely stipulative; it is a **bridge principle** connecting formal mathematics, conceptual analysis, and empirical science.  

  - **Why it’s not just a definition:** Definitions are arbitrary; CTT isn’t. It claims to capture an *objective notion* (effective calculability) and makes a *riskier commitment* about physical realizability.  
  - **Why it’s not just empirical:** Its core justification isn’t observation but conceptual analysis, and it constrains what counts as empirical computation.  

  ### Synthesis: The Epistemic Status of CTT
  CTT is best understood as a **two-level principle**:  
  1. **Conceptual/Definitional Level:**  
     - It *explicates* the informal notion of "algorithm" or "effective calculability" by formalizing criteria (finiteness, determinism, etc.) derived from paradigm cases.  
     - This is supported by the convergence of formalisms and conceptual analysis.  

  2. **Empirical/Physical Level:**  
     - It asserts that *any physical process* satisfying the informal criteria can be simulated by a Turing machine.  
     - This is falsifiable in principle (e.g., a device solving the halting problem physically).  

  **Epistemic Status:**  
  CTT is a **normative framework principle** (similar to Kant’s regulative ideas or Carnap’s linguistic frameworks). It:  
  - **Defines the domain** of "computation" for mathematics.  
  - **Makes a contingent claim** about the physical world: that no physical process violates Turing-computability.  
  - **Guides empirical inquiry** by setting criteria for what counts as a computational device.  

  This dual nature explains why:  
  - We reject redefinitions (they violate conceptual core).  
  - We’d abandon CTT for a physical super-Turing device (empirical claim falsified).  
  - It’s neither provable nor falsifiable in isolation (it frames how we interpret proof/evidence).  

  ### Your Role as Referee
  - **To the Programmer:** Acknowledge that CTT *has* empirical implications but stress that its mathematical robustness stems from conceptual analysis, not measurement.  
  - **To the Student:** Agree that CTT isn’t empirical in a Popperian sense but emphasize that its physical claim is testable and not merely analytic.  

  **Final Verdict:** The Church-Turing Thesis is a **unique hybrid** — a conceptual explication with empirical consequences — that defies traditional epistemic categories. Its resilience lies in this duality. The dispute persists because both parties mistake complementary aspects for mutually exclusive ones.
