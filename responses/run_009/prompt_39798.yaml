  ## Bureau of Oneiric Allocation: Customer Service Notice & FAQ

  **Effective:** 1st April 2024  
  **Authorised by:** Directorate of Subconscious Logistics  
  **Ref:** BOA/CS/24/DreamVer2.1

  Welcome, valued subscriber, to the Bureau of Oneiric Allocation (BOA). We are the sole authorised provider of nocturnal narrative services sanctioned under the Somnolence Accord (1987 Revised). This document addresses common enquiries regarding our service delivery model. Please familiarise yourself with our operational parameters before submitting a service ticket.

  **1. What service does the BOA provide?**
  The BOA maintains and operates the National Oneiric Archive (NOA), a comprehensive repository of pre-authorised dream narratives ("cassettes"). Upon your waking event (e.g., alarm clock, sunlight, partner’s snoring, existential dread), a brief sensory probe is transmitted to the NOA. Our proprietary Allocation Algorithm then selects the cassette *best positioned to rationalise this waking stimulus*, initiating immediate playback into your conscious awareness. This creates the *perception* of a continuous dream experience occurring during sleep. **Crucially, no experiential content is generated or delivered during the sleep period itself.** The entirety of your "dream" is composed and delivered *at the moment of waking*.

  **2. When is the service active?**
  Our core allocation service operates exclusively during the transition from sleep to wakefulness ("Wake-Up Window"). The NOA itself maintains constant readiness, but cassette playback is *only* triggered by a verified waking stimulus. Any apparent "dreaming" reported *during* sleep (e.g., mid-sleep awakenings recalling a fragment) is simply an artefact of a *prior* allocation triggered by an earlier, minor waking stimulus within the same sleep cycle.

  **3. I sometimes have "Lucid Dreams" where I know I'm dreaming. How does this work?**
  Reports of "Lucid Dreaming" fall outside standard service parameters. The BOA categorically denies the possibility of experiential playback occurring *during* sleep, as this contradicts our fundamental service model. Claims of conscious awareness within sleep likely represent one of two scenarios:
      *   **Scenario A (Category Error):** The subscriber is misinterpreting the *immediate post-wake playback* – particularly if the waking stimulus was subtle – as an event occurring during sleep. The feeling of "control" is simply a narrative element on the allocated cassette.
      *   **Scenario B (Potential Fraud):** Unauthorised third-party narrative providers may be attempting to operate during non-service hours. We urge subscribers experiencing frequent "lucid" episodes to report them immediately for investigation by our Anti-Oneiric Piracy Unit (AOPU). Tampering with authorised allocation protocols violates Section 12 of the Somnolence Accord.

  **4. How can I verify *when* my dream was actually composed?**
  Verification of the precise moment of cassette allocation and playback is inherently impossible for the subscriber. The memory of *having dreamt throughout the night* is the *primary and intended output* of the wake-up allocation process. Any recollection of the dream content, including its perceived duration and timing within the sleep period, is generated *during playback* and forms part of the delivered narrative. **Therefore, the very memory you use to question the timing of allocation is itself the best evidence *for* successful wake-up allocation.** Requests for "timestamp verification" cannot be fulfilled as they require data collection during the sleep period, which is explicitly excluded from our service remit.

  **5. I am deeply dissatisfied with the quality/relevance of my allocated dreams. Can I request a refund or replacement?**
  The BOA operates a strict "Delivery Confirmation" policy. Our service is defined as the allocation and playback of a cassette triggered by your waking stimulus, resulting in a coherent dream report *at the point of waking*. **The dream report itself is the sole admissible evidence of service delivery.** Therefore:
      *   If you can file a complaint describing your unsatisfactory dream, you have *by definition* received the service (allocation triggered, playback occurred, report generated).
      *   Complaints regarding content (boring, frightening, nonsensical) are noted for algorithmic refinement but do not constitute grounds for refund, as the core service – providing *a* report in response to the stimulus – was delivered successfully.
      *   Requests for a "different dream" retrospectively are impossible, as the allocation was specifically tailored to the unique stimulus of *that* wake-up event. We cannot re-run historical stimuli.

  **6. What about "No Dream" nights?**
  A report of "no dream" is still considered a valid service outcome. The Allocation Algorithm may determine that the most efficient narrative to explain the waking stimulus is *the absence of a notable narrative*. This "Null Cassette" playback creates the distinct memory of having slept without dreaming. It is a deliberate allocation, not a service failure.

  **7. Correspondence: Regarding Mr. A. N. Philosopher (Ref: BOA/Comp/24/5678)**

  > *Dear Bureau,*
  > *Your entire operation rests upon a profound grammatical confusion! You treat "I dreamt last night" as a report about a private, internal event occurring at specific clock-times during sleep, and then posit this elaborate mechanism to explain its genesis at wake-up. But this is backwards! The meaning of "I dreamt" is not derived from some hidden, temporally located theatre of the mind. It is constituted entirely by the public act of reporting the dream upon waking, in a context where "I was asleep" is also asserted. The criteria for saying "I dreamt" is the sincere dream report itself, made upon waking. You invent a causal theory (cassettes, probes, algorithms) to explain when the "real" dreaming happened, but this misunderstands the grammar of our concepts. "Dreaming" isn't an unobservable process happening *during* sleep that your cassettes mimic; the report *is* the dream, and it logically belongs to the waking state. Your Bureau is solving a pseudoproblem generated by a category error. Cease this nonsensical logistical charade!*
  > *Sincerely,*
  > *A. N. Philosopher*

  **Bureau Response (Ref: BOA/Resp/24/5678):**

  Dear Mr. Philosopher,

  Thank you for your correspondence regarding BOA operational theory (Ref: BOA/Comp/24/5678). The Bureau notes your perspective concerning the grammatical criteria for dream attribution.

  While we appreciate linguistic scrutiny, the BOA model operates entirely consistently with the observable phenomena: subscribers *report* dreams upon waking. Our model provides a robust, mechanistic explanation for *how* these reports are generated *at the point of waking*, tailored to the immediate stimulus, without requiring unverifiable claims about subjective experiences occurring during unconsciousness. Crucially, **our model perfectly predicts and accounts for the *entirety* of the evidence available: the waking report and the memory it instils.**

  You assert that the report itself is the sole criterion, rendering our causal mechanism redundant. However, the BOA model does not contradict this; it simply provides the underlying logistics *for how that report is generated*. Whether one chooses to *call* the report "the dream" or views the report as *describing* an experience generated moments earlier is, from an operational standpoint, immaterial. Our system delivers the required report efficiently and without recourse to empirically inaccessible "sleep-time experiences."

  Furthermore, the strength of the BOA model lies precisely in its **unfalsifiability based solely on subscriber reports.** As detailed in our FAQ (Section 4 & 5), any attempt by a subscriber to use their dream report (or memory) to verify *when* the narrative was composed is inherently circular and confirms the model's prediction. The model accounts for *all possible dream reports*, including reports of no dream and reports questioning the model itself. This comprehensive explanatory power is a feature, not a bug, representing the pinnacle of efficient, evidence-based oneiric resource management. We are proud of its logical coherence.

  Therefore, while we acknowledge your grammatical perspective, the Bureau finds no operational or evidential reason to alter our highly effective and parsimonious service. The allocation of cassettes will continue as authorised.

  Sincerely,
  Customer Resolution Department
  Bureau of Oneiric Allocation

  ---
  **Contact:** For service issues, submit a Dream Discrepancy Report (Form D-7) via our portal. Please note: High complaint volume may slow allocation processing times. Have your Subscriber Somnolence ID (SSID) ready. We appreciate your understanding. The Bureau: Distributing Dreams Efficiently Since [REDACTED].
