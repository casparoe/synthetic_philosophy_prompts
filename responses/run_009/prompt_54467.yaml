prompt: |-
  I write literary fiction and my editor keeps complaining that my characters "deliberate like spreadsheets" when they're at a big life crossroads. I've been reading about transformative experience theory, the L.A. Paul idea that for choices like having a kid you can't know what the post-choice self will even be like, so ordinary expected-value reasoning breaks down and the decision is made on a kind of jump. I want to turn that into my actual craft tool. Please write me a procedure I can run every time I'm drafting one of these decision scenes (there are three coming up in my current draft and my deadline is in six weeks): the questions to ask about the choice in order — is it epistemically transformative, personally transformative, both, or actually neither and I'm just being melodramatic — what the character can and can't plausibly know at the point of choice, how to render the deliberation so it feels real instead of either a coin flip or a pro/con list, and where the procedure has to stop and admit it's an artistic call I have to make myself. Then run it on three of my upcoming scenes: a woman deciding whether to have her first child at 41, a 19-year-old enlisting, and a man deciding whether to take a much better job in another country. Fair warning that I've planned a huge anguished setpiece around the job one — if your procedure says that choice isn't actually transformative in the relevant sense and I should write it as ordinary calculation, tell me, but know I'll be annoyed.
reasoning: |-
  Okay, the user writes literary fiction and their editor says characters deliberate like spreadsheets during big life decisions. They've been reading about transformative experience theory by L.A. Paul, which argues that some choices (like having a kid) can't be evaluated with standard expected-value reasoning because you can't know what the future self will be like. They want a craft tool based on this theory to make decision scenes feel real, not like pro/con lists or coin flips.

  The user needs a step-by-step procedure they can apply to three upcoming scenes: a 41-year-old woman deciding on her first child, a 19-year-old enlisting in the military, and a man considering a job in another country. They mention a "huge anguished setpiece" planned for the job decision and seem emotionally invested in it being transformative. 

  First, I need to recall Paul's core ideas: epistemically transformative experiences (you gain new knowledge/abilities) and personally transformative ones (your core values/identity change). The key is that for choices involving both, rational deliberation breaks down - the character can't access future subjective states. The procedure should help identify this breakdown point.

  For the craft tool, I'll structure it as a flowchart with diagnostic questions: 
  - Start by asking if the choice is epistemically transformative (will it teach utterly new sensations/experiences?). 
  - Then personally transformative (will it rewire identity/preferences?). 
  - If both, that's the Paul zone where standard reasoning fails. 
  - If neither, maybe it's just high-stakes, not truly transformative.

  The procedure must clarify what the character can/can't know: 
  - They can know objective facts, societal narratives, others' experiences. 
  - They CAN'T know their future self's preferences or the subjective quality of the experience. 

  For rendering the deliberation: 
  - Show the character hitting this epistemic wall repeatedly. 
  - Use metaphors of fog, diving boards, etc. 
  - Contrast intellectual understanding vs embodied doubt. 
  - Include misdirection - false attempts to "spreadsheet" it. 
  - Focus on somatic responses (nausea, lightness) as clues.

  Importantly, flag where artistry takes over: 
  - How deeply to dramatize the pre-choice struggle. 
  - What triggers the eventual "jump" (fatigue? external push?). 
  - The actual decision moment's texture. 

  Now applying to their three scenes:
  1. **Woman/child decision**: Textbook Paul case. Epistemically transformative (new love type), personally transformative (identity shift to mother). Can't know tiredness-joy ratio. Render via bodily dread/curiosity, societal noise, failed attempts to intellectualize.

  2. **19yo enlistment**: Strongly transformative. Epistemic (combat sensations, bureaucracy), personal (values reshaped by military). Can't know if they'll adapt or break. Render via naive idealism vs fear, borrowed imagery from movies, physical testing (e.g., holding breath).

  3. **Job abroad**: Tricky. Epistemically transformative? Maybe (new culture shocks). Personally? Depends - if he's already rootless, less so. But if family man, huge identity shift. User's "anguished setpiece" suggests it's personal for him. I'll validate that while noting objective factors (salary) matter too. The agony comes from hidden transformation - he fears becoming someone else.

  Need to validate their instinct on the job scene despite my initial hesitation. The key is whether the character feels it as identity-altering. Since they've planned anguish, lean into that as evidence of personal transformation.

  Also practical - their deadline is 6 weeks. The procedure should save time by preventing rewrite loops on false starts. Emphasize diagnosing early whether a scene needs Paul-style treatment.

  Underlying needs: They want psychological authenticity but also narrative power. The tool should help them bury the spreadsheet while keeping the struggle compelling. Also, they might need permission to embrace irrationality in characters - many writers feel pressured to make decisions "logical."
answer: |-
  Here’s a procedural craft tool based on L.A. Paul’s transformative experience (TE) theory, designed to overhaul your decision scenes. Use it like a diagnostic checklist **during drafting** (not pre-writing—keep momentum for your deadline). It forces you to isolate where rational deliberation fails, then pivot to rendering the "jump."

  ---

  ### **The Transformative Choice Procedure**
  **Goal:** Replace spreadsheet deliberation with epistemically/personally authentic struggle.  
  **Time per scene:** 15-20 mins (diagnostic only—rendering comes after).

  #### Step 1: **Is This Choice Transformative? (The Gatekeeper)**
     - **Epistememic Transformation (ET):** *Will this choice teach the character something they couldn’t learn without living it?*  
       *(e.g., childbirth pain, the adrenaline of combat, the isolation/exhilaration of a foreign culture)*  
       → **If NO:** Pro/con lists may work. Proceed with caution.  
       → **IF YES:** Move to Personal Transformation.  
     - **Personal Transformation (PT):** *Will this choice fundamentally alter their identity, values, or preferences?*  
       *(e.g., becoming a parent rewires your psyche; military service reshapes your worldview; emigration severs old selves)*  
       → **If NO:** Character can "know" the outcome. Use rational deliberation.  
       → **IF YES:** This is a Paul-style TE. **Expected-value reasoning breaks down.** Proceed to Step 2.  
     - **Neither?** You’re likely overdramatizing a calculable choice. Scale back the anguish.  

  #### Step 2: **What *Can’t* the Character Know? (The Wall)**
     - **Blocked Knowledge:** List what’s **unfathomable pre-choice**:  
       - The *subjective experience* (e.g., *how* it feels to hold *your* child, *how* your body reacts under fire).  
       - Their *future self’s values* (e.g., Will they regret missing their hometown? Will patriotism sour?).  
       - The *irreversible shift* in their identity (e.g., "You can’t unbecome a soldier" — Tim O’Brien).  
     - **Plausible Knowledge:** List what they **can access**:  
       - Objective facts (e.g., pregnancy risks at 41, enlistment contract length, job salary).  
       - Others’ experiences (but highlight how these feel alien: *"Sarah loves being a mom, but I’m not Sarah"*).  
       - Fears/desires *as they exist now* (e.g., "I fear regret," "I crave adventure").  

  #### Step 3: **Rendering the Deliberation (The Pivot)**
     - **DO NOT:** Let the character "solve" the choice. Force them to confront the **unknowability**.  
     - **INSTEAD:**  
       - **Show epistemic vertigo:** Use visceral language (dizziness, fog, static). *Example:* *"She tried to imagine midnight feedings, but her mind slid off the thought like wet glass."*  
       - **Contrast rational attempts w/ somatic truth:** Let them *start* a pro/con list, then have their body rebel (nausea, trembling, euphoric chills).  
       - **Externalize the conflict:** Use metaphors that embrace ignorance (e.g., standing at a cliff’s edge, signing a contract in a language they don’t speak).  
       - **Focus on loss of self:** The agony isn’t about outcomes—it’s about **dying as their current self**. *Example:* *"Taking the job felt like folding up the map of his life and dropping it in a river."*  
     - **The "Jump" Trigger:** The decision crystallizes when:  
       - Exhaustion overwhelms deliberation ("I can’t think anymore—just say yes"),  
       - An external event shatters rational framing (e.g., seeing a father play with his child), or  
       - They embrace ignorance as freedom ("Fuck it—I’ll learn who I become").  

  #### Step 4: **Where Artistry Takes Over (Your Call)**  
     - **Duration:** How long to linger on the "vertigo" before the jump? (Hint: Longer isn’t always better).  
     - **Tone:** Should the jump feel tragic, defiant, or serene?  
     - **Symbols:** What object/metaphor embodies the transformation? (e.g., a passport, a positive pregnancy test, an unopened uniform).  
     - **The Decision Itself:** Never show the character "certain." They act *despite* the void.  

  ---

  ### **Applied to Your Scenes**  
  *(I’ll flag where TE theory mandates anguish vs. where you have wiggle room)*  

  #### **1. Woman (41) deciding on her first child**  
  - **ET?** **YES.** Can’t know the bodily/chemical reality of motherhood, the altered perception of time, the new form of love.  
  - **PT?** **YES.** "Mother" isn’t an add-on—it overwrites her identity. Her preferences *now* can’t predict her values *after*.  
  - **What she can’t know:** Will she regret missing her old freedom? Will the joy feel "worth" the pain? How will her marriage mutate?  
  - **What she can know:** Fertility stats, childcare costs, others’ anecdotes (which feel like "watching a play through frosted glass").  
  - **Rendering:**  
    - Rational attempts fail: *She researches IVF success rates, then slams the laptop shut when she realizes she’s avoiding the real question: "Who will I become?"*  
    - Somatic clues: *Her hand drifts to her abdomen when she sees a toddler; she dreams of drowning in a nursery.*  
    - **Your artistry:** The jump could be triggered by a mundane moment (e.g., seeing her partner’s patience with a crying child) or a surrender to biology ("My body wants this more than my brain").  

  #### **2. 19-year-old enlisting**  
  - **ET?** **YES.** Can’t know the adrenaline-terror of combat drills, the surreal boredom of barracks life, the taste of fear.  
  - **PT?** **YES.** Military indoctrination rewires selfhood. The "civilian" self dies in basic training.  
  - **What they can’t know:** Will they break under pressure? Will they become someone they hate? Can they ever go home again?  
  - **What they can know:** Signing bonus, deployment length, veterans’ PTSD stories (which feel like "ghost stories about strangers").  
  - **Rendering:**  
    - Rational attempts fail: *He lists "discipline, college money, purpose" — then laughs because it sounds like a recruiter’s pamphlet.*  
    - Somatic clues: *He tests his pain tolerance (holding ice, punching a wall); he feels naked without imagined body armor.*  
    - **Your artistry:** The jump could be impulsive (a dare to himself) or a retreat from ambiguity ("At least the military tells you who to be").  

  #### **3. Man deciding on a job abroad**  
  - **ET?** **YES/NO.** **DEPENDS.**  
    - *If he’s never lived abroad:* **YES.** Can’t know the loneliness, the cultural disorientation, the altered self-perception in a foreign context.  
    - *If he’s an experienced expat:* **NO** (epistemically familiar).  
  - **PT?** **YES/NO.** **YOUR CALL.**  
    - **PT = YES if:** He’s deeply rooted (family man, community pillar). Emigration severs his old identity.  
    - **PT = NO if:** He’s already rootless (career nomad, no attachments). This is just another calculable upgrade.  
  - **The Verdict:**  
    - **IF HE’S ROOTED → TE (BOTH ET/PT).** Your "anguished setpiece" is justified. Spreadsheet reasoning *must* fail.  
    - **IF HE’S ROOTLESS → NOT TE.** Use rational deliberation. *But you’ll be annoyed.*  
  - **Compromise (for your setpiece):**  
    - *Even if he’s rootless*, if the job forces him to confront a hidden part of himself (e.g., running from intimacy, craving reinvention), focus on **PT**. *Example: He realizes taking the job means killing the "good son" identity his family relies on.*  
  - **Rendering (if TE):**  
    - Rational attempts fail: *He compares salaries, then stares at his elderly father’s photo and realizes he’s quantifying grief.*  
    - Somatic clues: *The visa paperwork feels like divorce papers; he smells his hometown’s air like it’s already memory.*  
    - **Your artistry:** The jump could feel like a betrayal ("I signed the contract while avoiding my mother’s calls") or a rebirth ("He booked the flight in a fever, grinning like a thief").  

  ---

  ### **Key Takeaways for Your Draft**  
  - **TE Scenes (Child, Enlistment):** Ban spreadsheets. Let the character thrash against the unknowable. The decision emerges from exhaustion/instinct.  
  - **Job Abroad:** If rooted → TE (anguish valid). If rootless → calculation (but layer with interior conflict to keep depth).  
  - **Deadline Hack:** Diagnose each scene with Steps 1-2 *before* drafting it. Rendering (Step 3) goes faster once you know the "wall" they’re hitting.  
  - **Artistic Power:** The more the character *feels* their future self being unknowable, the more resonant the "jump."  

  This isn’t about ditching logic—it’s about exposing where logic crumbles. Your editor wants *human* uncertainty, not spreadsheet certainty disguised as doubt. Now go write those jumps.
