prompt: |-
  I run a student effective altruism group at my university, about 14 people, mostly second-years who've read a bit of 80k-style material but never actually tried to use the frameworks. I've got a 90-minute session coming up on cause prioritization, specifically the importance / tractability / neglectedness (ITN) framework. The problem is that everyone nods along when it's explained on a whiteboard -- multiply the three scores, rank the causes, done -- but nobody feels where the framework actually bites: the fact that the three factors fight each other, that neglectedness is doing something weird (the more people who pile into a cause, the worse it looks, which feels backwards until you sit with it), and that the scores are basically made-up numbers whose product gets treated as knowledge. So I want a game, not a lecture.

  Here's what I'd like you to design. Act as an experienced workshop facilitator who's run cause-prioritization exercises many times and knows all the ways they fail. The game should use fictional causes -- invent maybe six of them, deliberately varied so that some are huge and horrifying but utterly intractable, some are small but easy wins, some are neglected for arguably very good reasons (nobody works on them because they don't matter), and at least one that's the fake version of a cause that gets a lot of real-world attention, so the participants can't just pattern-match to what they've read online. Participants should have to commit to numeric scores for each factor at some point, because I want them to feel the arbitrariness of putting a number on tractability. It would be great if the game had at least two rounds, where between rounds you inject a shock -- e.g., a fictional billionaire drops $500M into one of the causes -- so they have to watch their neglectedness scores collapse and figure out what that does to their ranking, including the uncomfortable implication that success makes a cause look worse.

  Rules, materials (assume a whiteboard, sticky notes, printed scorecards, no laptops), a fictional budget with some payoff scheme that doesn't involve real money but still gives people something to win or lose, and a time breakdown for the 90 minutes. Then a debrief that maps specific moments in the game onto specific claims of the ITN framework -- and importantly, onto its known weak points, like whether the factors are really independent, whether multiplying them makes sense when the scores aren't on any shared scale, and whether neglectedness tracks "weirdly overlooked" versus "rightly ignored." Tell me honestly what will predictably go wrong the first time I run it (I expect some participants will refuse to give numbers at all, others will just argue about the fictional causes' details), and be frank about which feature of real cause prioritization the game just cannot reproduce -- a 90-minute game can't give people the actual uncertainty of the real world, and I want to know what I'll have to supply in the debrief that the game itself can't.
reasoning: |-
  We are designing a workshop game for cause prioritization using the ITN framework. The goal is to make participants feel the tensions and arbitrariness in assigning scores, and how external shocks affect rankings.

  Game Design:

  Title: **The Cause Arena**

  Overview: 
  Participants are members of a fictional "Global Impact Council" with a $10M budget to allocate across six fictional causes. They must assign Importance, Tractability, Neglectedness (ITN) scores to each cause (each on a 1-10 scale) and then compute an ITN product (I * T * N). The causes are ranked by this product, and the budget is allocated proportionally to the product (with a minimum of 5% per cause to avoid zero). However, after the first round, a shock occurs (a billionaire funds one cause heavily) which changes the neglectedness of that cause. They then re-score and re-allocate. The group with the best allocation (based on a fictional payoff scheme) wins.

  Fictional Causes (with brief descriptions to avoid real-world pattern matching):

  1. **Moon Rock Depletion (MRD)**: The moon's surface is losing valuable minerals that are essential for Earth's magnetic field stabilization. If depleted, Earth could experience catastrophic weather and radiation. However, the process is poorly understood and would require unprecedented international cooperation. Currently, only a few researchers study it because most think it's a hoax or not urgent.

  2. **Sentient Cephalopod Rights (SCR)**: Octopuses and squids are now proven to be sentient, but they are still harvested in massive numbers for food and research. The cause is highly neglected because most people don't care about invertebrates, and the fishing industry is powerful. But it's relatively tractable: passing a law in a few countries could set a precedent.

  3. **Desertification Reversal via Bioengineered Lichen (DRBL)**: A new lichen can reverse desertification quickly and cheaply. It's a small problem relative to others (only affects 1% of the world's population directly) but very tractable and somewhat neglected because it's a new technology and not well-known.

  4. **Preventing AI-Generated Meme Wars (PAMW)**: AI systems are creating memes that incite violence and destabilize societies. The problem is growing fast and could become catastrophic. It's highly neglected because governments don't understand memes and tech companies are reluctant to regulate. However, solutions are unclear and might require global coordination.

  5. **Neural Decay in Zero-G (NDZG)**: Astronauts on long missions experience accelerated neural decay. With the rise of space tourism, this could affect thousands and lead to a public health crisis. It's a medium-sized problem but very neglected because space agencies are underfunded and the problem is not yet visible. Solutions are known but expensive.

  6. **Fungal Language Translation (FLT)**: Scientists have discovered that certain fungi communicate via electrical signals. Translating this could revolutionize agriculture and medicine. However, the potential impact is speculative and the research is very difficult. It's somewhat neglected because it sounds absurd, but a few labs work on it.

  Budget and Payoff:
  - The council has $10M to allocate in Round 1 and then again in Round 2 (after the shock).
  - The payoff is fictional: each cause has a "impact multiplier" (which the participants don't know) that will be revealed at the end. The total impact is the sum over causes of (dollars allocated * impact multiplier). The group with the highest total impact wins. However, the multipliers are designed to reflect the "true" ITN (as per the game master) but with a twist: the multipliers are not linear and may have thresholds. This is to mimic that real-world impact isn't always linear in funding.

  But note: We don't want to reveal the multipliers until the end. Instead, we can have the payoff determined by a combination of the allocation and the cause's actual state (which the participants are trying to estimate). However, to keep it simple, we can have the game master (you) have a set of multipliers that are fixed but unknown to the participants. The multipliers are:

  - MRD: 0.2 (because it's intractable and the problem might be overstated)
  - SCR: 0.8 (because it's tractable and important, but not massive)
  - DRBL: 1.5 (because it's a quick win and very effective per dollar)
  - PAMW: 0.5 (because it's important but solutions are unclear, so funding might be wasted)
  - NDZG: 0.7 (because it's important and solvable but expensive)
  - FLT: 0.3 (because it's speculative and might not yield results)

  But wait: the point is that the ITN product is supposed to predict the multiplier. However, we want to show that even if they assign scores arbitrarily, the ranking might not match the "true" impact. So we can set the multipliers to be the product of the "true" scores we have in mind (as the game designer) for I, T, N (each on 1-10) and then normalized. But then we are essentially having a "correct" ITN, which we don't want because the lesson is that scores are arbitrary. Alternatively, we can avoid having a "correct" answer and instead focus on the relative changes and the process.

  Alternatively, we can skip the multipliers and just have the game be about the ranking and the shock. But then there's no winning condition. We can have the groups compete by having multiple small groups (if the 14 participants are split into 3-4 groups) and then see which group's allocation after Round 2 matches a pre-defined "expert" ranking? But that would require us to have an expert ranking, which we don't want because the goal is to show the arbitrariness.

  I propose: Instead of a payoff, we have the groups present their rankings and allocations and then discuss the arbitrariness and the shock effect. The "win" is in the learning. But to add stakes, we can have a peer vote on the most convincing allocation (based on their arguments) and then that group gets bragging rights.

  But the original request was for a budget and payoff. Let's do this:

  - Each group assigns ITN scores and then allocates the $10M proportionally to the ITN product (with a floor of 5% per cause).
  - Then the shock happens: a billionaire funds one cause (we choose one that is initially high in neglectedness, e.g., NDZG) with $500M. This makes that cause much less neglected. So in Round 2, groups must re-score the neglectedness (and can adjust I and T if they think the shock changes those) and then re-allocate the $10M.
  - The payoff: We have a fictional outcome for each cause that depends on the total funding (from both the council and the billionaire) and the cause's characteristics. We design outcomes (e.g., success or failure) that are somewhat arbitrary to show that the world is uncertain. But to keep it manageable, we can have a simple outcome: for each cause, if the total funding (council + billionaire) is above a certain threshold, it "succeeds" and the group gets points. The threshold is set arbitrarily by the facilitator and not revealed until the end.

  But that might be too complex. Alternatively, we can have the payoff as:

  - The group's impact score = for each cause: (council funding * T) if council funding > X (a threshold set by the cause) then they get I * (council funding) but if not, they get 0. And then we add up. But again, arbitrary.

  I think we should keep the payoff hidden and just focus on the process and the discussion. The "win" condition can be that the group that most accurately predicts the change in ranking after the shock (or something) but that might not work.

  Alternatively, we can have the groups not compete against each other but all do the same exercise and then compare. The payoff can be a set of outcomes that the facilitator has, but the outcomes are designed to be surprising (e.g., a cause that seemed low in neglectedness but was actually not, so the funding didn't help) to highlight uncertainty.

  But to keep it simple and within 90 minutes, I suggest:

  - The game is played in one group (14 people) or split into 2-3 small groups (so 5-7 per group). Each group does the scoring and allocation.
  - The payoff is the total ITN product (as they compute) for the causes they funded? But that would be circular.

  After reflection: The game is primarily about the experience of assigning numbers and seeing how a shock changes things. The payoff can be a way to close the game but it's not the main point.

  So let's design without a complex payoff. Instead, we can say that the group that has the highest total ITN product after their allocation (weighted by the dollars) wins, but that's just their own scores. Then after the shock, they recalc and see that the product for the shocked cause drops (because neglectedness drops) and then the allocation changes. The learning is in the change.

  Materials:
  - Scorecards (printed) for each cause with a description and space to write I, T, N scores and the product.
  - Sticky notes for each cause to put on the whiteboard for ranking.
  - Whiteboard to record group scores and allocations.

  Time Breakdown (90 minutes):

  1. Introduction (10 min): Explain the rules, the causes, and the ITN framework. Emphasize that they are to assign scores on 1-10 (10 being best) for each factor. Importance: how big is the problem? Tractability: how easy is it to make progress? Neglectedness: how few resources are currently going to it? (Note: for neglectedness, 10 means highly neglected, i.e., few people working on it, so more room for funding to make a difference.)

  2. Round 1 (25 min):
     - Split into small groups (3-4 groups of about 3-5 people each). Each group assigns I, T, N scores to each cause and computes the product. Then they allocate their $10M budget proportionally to the product (with a floor of 5% per cause). They record their scores and allocations on a scorecard.
     - They then post their top cause and bottom cause on the whiteboard (with sticky notes) and briefly explain one of their scores (e.g., why they gave a high or low score in one factor for one cause).

  3. The Shock (5 min): Announce that a billionaire, moved by the cause of Neural Decay in Zero-G (NDZG), has pledged $500M to fund research on it. This means that NDZG is no longer neglected. Therefore, all groups must re-score the neglectedness of NDZG (and optionally adjust I and T if they think the shock affects those). Also, note that the billionaire's money is separate from the council's budget.

  4. Round 2 (20 min):
     - Groups re-score NDZG and then re-compute the ITN product for all causes (they can adjust other causes too if they want, but the shock was specific to NDZG). Then they re-allocate the $10M.

  5. Group Discussion and Comparison (15 min):
     - Each group shares their Round 1 and Round 2 allocations, focusing on how the shock changed their ranking and allocation for NDZG and others.
     - Compare across groups: Did all groups change similarly? Were there disagreements in scoring?

  6. Debrief (15 min): Facilitator-led discussion mapping the game to ITN concepts.

  Debrief Points:

  - Tensions between factors: Did anyone notice that when they tried to assign high scores to all three, it was hard? (Usually, a cause that is important and tractable is not neglected, etc.)
  - Neglectedness paradox: The shock made NDZG less neglected, so its N score dropped. That made the ITN product drop, so they allocated less to it. But the cause just got a huge funding boost! So why would we fund it less? The framework says: because your marginal dollar now does less. But it feels counterintuitive because the cause is now more likely to succeed. This is a key insight: ITN is about the marginal impact of additional resources, not the absolute importance.
  - Arbitrariness of scores: Different groups had different scores for the same cause. How did they decide? Were they just guessing? In real life, we often don't have good data.
  - Independence: Did the groups change I or T when N changed? For example, did the shock make NDZG seem more important because it's now in the spotlight? Or more tractable because with more funding, solutions are easier? The factors are not independent.
  - Multiplication: Why multiply? What if the scores are on different scales? What if a cause has I=10, T=1, N=10? Is that really the same as I=5, T=5, N=4? (100 vs 100) but intuitively, the first might be a lost cause and the second might be a solid bet.
  - Neglectedness: What does it mean? Is a cause neglected because it's not important (so rightly ignored) or because it's overlooked? How do you tell? In the game, the shock made NDZG go from neglected to not, but what if the cause was not neglected because it was already being optimally funded? The framework doesn't distinguish.

  Predictable Problems:

  - Participants refusing to assign numbers: Encourage them to just take a first pass and that it's okay to be arbitrary. Remind them that in real life, we often have to make decisions with incomplete data.
  - Arguing about the fictional causes: Set the context: "In this fictional world, these are the facts as given." Encourage them to take the descriptions at face value and not add details.
  - Time management: The scoring in groups might take longer than 25 minutes. Have a timer and encourage groups to move on.
  - Group dynamics: Some groups might get stuck on one cause. Suggest they assign scores quickly and then adjust if needed.
  - The shock effect: Some groups might not lower the N score enough because they think the problem is still big. Emphasize that neglectedness is about current funding, and $500M is a huge influx.

  What the Game Cannot Reproduce:

  - Real-world uncertainty: In the game, the causes are fictional and the outcomes are not real. In real life, we have to live with the consequences of our prioritization and we never know the true impact.
  - The weight of the decision: In the game, it's play money. In real life, funding decisions affect lives.
  - Long-term effects: The game is a snapshot. In reality, causes evolve, and today's neglected cause might be tomorrow's crowded field.
  - Data gathering: The game gives descriptions. In reality, we have to research and might get conflicting information.

  Additional Note: 
  To handle the shock, we must design the initial neglectedness of NDZG to be high (e.g., 8 or 9) so that the drop is noticeable. Then after the shock, it might drop to 2 or 3.

  Let me set the initial descriptions to guide scores without being too prescriptive.

  Revised Cause Descriptions (for facilitator only, to anticipate typical scores):

  1. **Moon Rock Depletion (MRD)**
     - Importance: 9 (catastrophic if happens)
     - Tractability: 2 (very hard to solve)
     - Neglectedness: 8 (only a few researchers)

  2. **Sentient Cephalopod Rights (SCR)**
     - Importance: 7 (suffering of billions of animals, but not human)
     - Tractability: 8 (passing laws is feasible)
     - Neglectedness: 9 (almost no one working on it)

  3. **Desertification Reversal via Bioengineered Lichen (DRBL)**
     - Importance: 4 (affects a small population, but could spread)
     - Tractability: 9 (technology exists and is cheap)
     - Neglectedness: 7 (a few startups, but not much funding)

  4. **Preventing AI-Generated Meme Wars (PAMW)**
     - Importance: 8 (could lead to widespread violence)
     - Tractability: 3 (solutions unclear, requires coordination)
     - Neglectedness: 8 (tech companies ignore it, governments don't understand)

  5. **Neural Decay in Zero-G (NDZG)** - the one that gets the shock
     - Importance: 6 (could become a big problem with space tourism)
     - Tractability: 5 (solutions known but expensive)
     - Neglectedness: 9 (very little funding, only a few researchers)

  6. **Fungal Language Translation (FLT)**
     - Importance: 3 (speculative benefits)
     - Tractability: 2 (very hard to decode)
     - Neglectedness: 6 (a few labs, but not many)

  But note: these are just for the facilitator to anticipate. Participants might assign differently.

  Now, the shock: $500M for NDZG. This should drop its neglectedness to 2 (because now it's well-funded). But participants might also increase tractability to 7 (because with money, solutions become easier) or even importance (if they think the attention makes it more urgent). This is good for discussion.

  Game Rules Handout (for participants):

  **The Cause Arena: ITN Prioritization Game**

  You are a team of advisors to the Global Impact Council. You have $10M to allocate to 6 causes. Your goal is to maximize the impact of this funding.

  Steps:

  1. **Score each cause** on Importance (I), Tractability (T), Neglectedness (N) on a 1-10 scale (10 is best for each). 
     - I: How big is the problem? (10 = massive scale, affecting billions or catastrophic)
     - T: How easy is it to make progress? (10 = very easy, known solutions, low cost)
     - N: How few resources are currently going to it? (10 = very neglected, almost no funding or attention)

  2. **Compute the ITN product** for each cause: I * T * N.

  3. **Allocate your $10M** proportionally to the ITN product. However, no cause gets less than $0.5M (5%) or more than $3M (30%) to avoid extremes.

  4. **Round 1**: Do steps 1-3.

  5. **The Shock**: After Round 1, we announce that a billionaire has funded Neural Decay in Zero-G (NDZG) with $500M. This changes the landscape.

  6. **Round 2**: Re-score NDZG (especially neglectedness) and any other cause if you think the shock affects them. Then re-compute the ITN product and re-allocate the $10M.

  7. **Discussion**: Share your allocations and reasoning.

  We'll then discuss what happened and what we learned.

  Let me know if you have any adjustments.
answer: |-
  ### Workshop Design: **Cause Arena - The ITN Tug-of-War**  
  *Goal: Force participants to grapple with the tensions, arbitrariness, and counterintuitive dynamics of ITN scoring in a high-energy, fictional setting.*

  ---

  ### **Game Overview**  
  **Premise:** Participants are "Impact Analysts" for the *Global Priorities Assembly*, tasked with allocating a $10M fictional budget across 6 absurd (but plausible) causes. The twist: After Round 1, a fictional billionaire injects $500M into one cause, forcing players to re-score neglectedness and confront how "success" can make a cause *less* attractive under ITN.  

  **Fictional Causes** (designed to defy pattern-matching):  
  1. **Skywhale Conservation (SWC)**: Giant, floating whales are going extinct due to atmospheric pollution. *Huge scale (10M lives at stake), but intractable—requires global policy shifts. Currently "trendy," so not neglected.*  
  2. **Zombie Ant Fungus Vaccine (ZAFV)**: A fungus turns ants into zombies; it’s mutating to infect mammals. *Small scale now (100K lives), but highly tractable (known cure). Wildly neglected—sounds silly, so only 3 researchers work on it.*  
  3. **Dream Hacking Prevention (DHP)**: Tech that manipulates dreams could cause mental health epidemics. *Massively important (1B+ at risk), moderately tractable (regulation feasible), but neglected because governments think it’s sci-fi.*  
  4. **Ocean De-Acidation via Coral DJs (ODCD)**: Genetically engineered coral "DJs" use sound to restore ocean pH. *Small impact (saves 50K coral species), easy to implement, but neglected—seen as a vanity project.*  
  5. **Volcanic Internet Cable Repair (VICR)**: Undersea volcanoes keep destroying internet cables, disrupting global communications. *Critical infrastructure (affects 2B+ people), but intractable (tech doesn’t exist). Highly funded due to corporate lobbying.*  
  6. **Lunar Dust Allergy Relief (LDAR)**: Moon colonists face deadly dust allergies; solutions could aid Earth allergy research. *Modest importance (10K lives), low tractability (space R&D is hard), neglected for good reason—only affects niche group.*  

  **Key Variability**:  
  - **Huge + Intractable + Crowded**: SWC (cause #1)  
  - **Small + Tractabile + Neglected**: ZAFV (cause #2)  
  - **"Fake" Cause with Real Hype**: VICR (cause #5—mimics real-world "sexy" causes like asteroid defense)  

  ---

  ### **Rules & Materials**  
  **Materials**:  
  - Whiteboard (for rankings)  
  - Sticky notes (for cause names + scores)  
  - Printed "Cause Cards" (1 per cause, with descriptions)  
  - Printed "Score Sheets" (table with columns: Cause, I, T, N, Product, Allocation)  
  - Timer  
  - 6 large envelopes (each labeled with a cause, containing a "shock update" for Round 2)  

  **Participants**: Split into 3 groups of 4–5 people.  

  **Budget & Payoff**:  
  - $10M fictional budget per group.  
  - **Winning Condition**: Groups earn "Impact Points" (IP) based on:  
    - **Allocation Accuracy (50%)**: Match your final ranking to a "ground truth" ITN product (pre-set by facilitator, hidden until debrief).  
    - **Peer Vote (50%)**: Groups vote on which team’s strategy was most logical post-shock.  
  - **Prize**: Bragging rights + "Priority Analyst of the Year" meme certificate.  

  ---

  ### **Time Breakdown (90 Min Total)**  
  1. **Intro & Framework Refresher (10 min)**  
     - Explain ITN (1–10 scales):  
       - *Importance (I)*: Scale of suffering/benefit (10 = civilization-level).  
       - *Tractability (T)*: Ease of progress (10 = quick, cheap wins).  
       - *Neglectedness (N)*: Room for more funding (10 = <10 people working on it).  
     - Emphasize: **N is counterintuitive**—more funding → lower N score → *worse* ITN product.  
     - Assign causes to groups.  

  2. **Round 1: Baseline Scoring (25 min)**  
     - Groups assign I, T, N (1–10) to all 6 causes. **Force numeric scores—no hedging!**  
     - Calculate ITN product (I × T × N) and rank causes.  
     - Allocate $10M: 70% to top 2 causes, 30% split among the rest (no zeros).  
     - Groups post rankings on whiteboard.  

  3. **The Shock (5 min)**  
     - Reveal: *"Billionaire Elon Tusk just donated $500M to Dream Hacking Prevention (DHP)! It’s now the world’s best-funded cause."*  
     - Distribute "shock update" envelopes: New info for DHP (e.g., "1000+ new researchers join," "public awareness soars").  

  4. **Round 2: Re-Scoring Chaos (25 min)**  
     - Groups re-score **only N for DHP** (I and T locked to force focus on neglectedness).  
     - Optional: Allow I/T adjustments for *other* causes if groups argue the shock affects them (e.g., "DHP hype diverted talent from SWC!").  
     - Recalculate products, re-rank, re-allocate $10M.  
     - Groups post new rankings + explain changes.  

  5. **Payoff & Voting (10 min)**  
     - Calculate IP:  
       - Match Round 2 rankings to facilitator’s pre-set "ground truth" (e.g., ZAFV #1, VICR #6). 1 IP per correct rank.  
       - Peer vote: Each group awards 3 IP to the most convincing team.  
     - Declare winner.  

  6. **Debrief (15 min)**  
     - Facilitator-led discussion mapping game moments to ITN insights.  

  ---

  ### **Debrief Guide**  
  **Map Game Moments to ITN Insights**:  
  - **Tensions Between Factors**:  
    - *Example*: "Skywhale Conservation (SWC) had high I but low T—did your group argue about whether ‘importance’ should override intractability? Real ITN forces trade-offs."  
    - **Weak Point**: I/T/N aren’t independent—e.g., funding (N) can boost tractability (T).  

  - **Neglectedness Paradox**:  
    - *Example*: "DHP’s N score crashed post-shock. Did you feel uneasy allocating *less* to a cause that just got a win? That’s ITN’s core insight: Marginal dollars matter less in crowded fields, even if the cause is important."  
    - **Weak Point**: N conflates "weirdly overlooked" (ZAFV) vs. "rightly ignored" (LDAR). The game can’t resolve this—it’s a judgment call.  

  - **Arbitrariness of Scores**:  
    - *Example*: "Did your group give ZAFV a T=8 while others said T=5? That’s the reality of ITN—scores are often gut feelings dressed as math."  
    - **Weak Point**: Multiplying scores assumes equal scales, but is 10 I (lives saved) = 10 T (ease) = 10 N (room for funding)? Probably not.  

  **What the Game Can’t Replicate (Discuss Openly)**:  
  - **Real-World Uncertainty**: In 90 minutes, you can’t simulate years of evidence-gathering or the agony of high-stakes decisions. Emphasize: "ITN is a starting point—not a calculator for truth."  
  - **Hidden Biases**: The game exposes scoring arbitrariness but can’t fix confirmation bias (e.g., favoring causes that sound like real EA darlings).  
  - **Dynamic Systems**: Real causes evolve (e.g., tractability improves with funding). ITN is a snapshot, not a prophecy.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"I Refuse to Pick a Number!"**:  
     - *Why*: Participants feel scores are arbitrary.  
     - **Fix**: Push them: "Give your best guess—real prioritization demands decisiveness with imperfect data." Use a timer.  

  2. **Arguing Over Fictional Cause Details**:  
     - *Why*: EAs love nitpicking assumptions.  
     - **Fix**: "Stick to the Cause Card facts. If it’s not stated, it doesn’t exist." Intervene if debates eat time.  

  3. **Shock Undermined**:  
     - *Why*: Groups might say, "$500M isn’t enough to change N!"  
     - **Fix**: Pre-set the narrative ("This is a game-changing injection") and lock I/T for DHP to force N focus.  

  4. **Misinterpreting Neglectedness**:  
     - *Why*: Participants confuse "neglected" with "unimportant."  
     - **Fix**: Clarify pre-game: "N = few resources, not low importance. A cause can be vital but well-funded (e.g., VICR)."  

  5. **Time Overruns in Scoring**:  
     - *Why*: Groups bog down on one cause.  
     - **Fix**: Announce time checks ("5 min left!"). Encourage rapid consensus.  

  ---

  ### **Facilitator Notes**  
  - **Ground Truth for Payoff**: Pre-set ITN scores based on cause design (e.g., ZAFV: I=4, T=9, N=10 → Product=360; VICR: I=8, T=2, N=3 → Product=48).  
  - **Embrace the Chaos**: When groups protest scoring, say: "Yes! This is the point. ITN feels precise until you actually do it."  
  - **Final Takeaway**: "ITN isn’t about getting the ‘right’ number—it’s about structuring debate. Use it to ask: *Why* is this cause neglected? *Could* it be tractable? And does multiplying these even make sense?"  

  This game forces discomfort, highlights ITN’s quirks, and wraps it in fun. You’ll see lightbulb moments when the billionaire drops—that’s when the framework "bites." Run it, debrief honestly, and let the friction teach what lectures can’t.
