prompt: |-
  ok so me and my friend have been going back and forth on this for like three weeks and i want a real answer not a both-sides essay. here's the question: when an LLM says it "understands" something, is that actually true? not the consciousness thing — she already concedes the model probably doesn't feel anything. the question is narrower. does it grasp the content, the way i grasp that you can't fit a bigger box inside a smaller one, versus just having seen a million examples and imitating understanding without any of it landing.

  my position is roughly 0.7 that current models understand in the meaningful sense. hers is like 0.2. her argument is that it's autocomplete on steroids — it predicts what an understanding person would say, which is different from understanding. mine is that if the imitation survives every test we can throw at it, including ones nobody trained it on, then at some point "imitation of understanding" and "understanding" have to be the same thing, and if they don't then i can't prove my classmates understand either, which seems like a reductio to me.

  so what i want from you:

  first, an actual credence. a number, not "it depends on your definition of understanding" and not a survey of what famous people think about it. commit to a position and defend it.

  second, show your work. i think the question decomposes into something like (1) is there even a fact of the matter here, or is part of the disagreement verbal — if "understanding" has no fixed meaning then we might be arguing about a word, (2) does understanding require grounding in the world through senses, or is getting the structural patterns right enough on its own, (3) do current models actually pass the tests — the ones i'd nominate are catching self-contradictory sentences and re-explaining an idea it was never directly taught using fresh analogies, which feels like the closest thing to a behavioral test of understanding we have. give each sub-question a rough probability with one line of justification, then tell me how they combine into your final number, and which one the final number is most sensitive to (like which one, if it flipped, would drag the whole thing down most).

  third, help me locate the actual disagreement. after the decomposition, tell me which sub-question me and my friend most likely split on. one thing we argue about that i want folded in: she points to the dumb mistakes models make on weird out-of-distribution stuff as proof there's no real grip on meaning, and i keep saying humans make exactly the same kind of mistakes, so if anything that's evidence the underlying mechanism is similar. does that difference show up anywhere in the decomposition, or is it just us talking past each other?

  and if you conclude the question IS partly verbal, fine, say so, but then still isolate whatever non-verbal residue is left and put a number on THAT. don't let me off the hook. also sorry if this is rambly, i typed it fast becuase she's about to message me again asking if i found anyone to settle it.
