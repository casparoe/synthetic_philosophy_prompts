prompt: |-
  A colleague and I are drafting a paper on Goodhart's law, and we have noticed that we always gloss it as a mechanism about incentives: the measure goes bad because it becomes someone's target, and someone starts gaming it. I want a test case that puts pressure on that gloss, built to the following specifications. The scenario itself should be a single paragraph, set in an ordinary workplace — a hospital ward, a school, or an engineering team would do — in which the people being measured never learn that the metric exists and never change their behavior at all. The harm must arrive entirely on the evaluator's side: what the metric degrades is what the evaluator can perceive, not what anyone is motivated to do. The evaluator must be conscientious and good at the job, not a cynic ticking boxes; there is to be no gamed measure, no falsified number, and no one on the measured side doing anything they would not otherwise have done. After the scenario, show that it meets each specification; then state whether it still counts as Goodhart's law, and if you think it does not, say which kind of failure it is instead; identify the single feature of the case that is doing the work — I suspect it is the sealing-off of the information channel from the incentive channel, but you tell me — and finally tell me what happens to the case if that seal is broken, so that the evaluator's metric-shaped perceptions begin to flow back into the agents' incentives: does it collapse back into the standard story about targets and gaming? The case is meant to probe whether Goodhart's law is fundamentally a law about incentives or a law about information, so a case that smuggles the harm in through anyone's changed behavior on the measured side fails the brief.
reasoning: |-
  Okay, the user is working on a paper about Goodhart's Law and wants a test case that challenges the common interpretation of it being about incentives. They've noticed they always frame it as a mechanism where people game the system when a measure becomes a target. Their request is very specific: create a scenario where the measured people don't know about the metric and don't change their behavior, yet harm still occurs purely on the evaluator's side through degraded perception. 

  Hmm, the user is clearly deep in academic thinking - probably in economics, policy, or organizational studies given the focus on metrics and incentives. They're trying to isolate whether Goodhart's Law is fundamentally about incentive distortion or information distortion. That's sophisticated. The frustration with "glossing" suggests they've hit a theoretical wall in their drafting.

  Let me unpack their requirements: 1) Ordinary workplace setting 2) Measured agents completely unaware and behaviorally unchanged 3) Harm manifests only in evaluator's cognition 4) Evaluator is competent and well-intentioned 5) No data gaming whatsoever 6) Must demonstrate specification compliance 7) Final analysis of whether this still qualifies as Goodhart's Law.

  The hospital ward example that comes to mind works because: Nurses keep doing holistic care (unchanged behavior) while the evaluator's perception narrows due to the metric. The medication error rate is a real output measure, not a proxy - but the evaluator starts treating it as the whole truth. Crucially, the harm is the evaluator's inability to see non-quantifiable aspects like emotional support.

  Ah! The key mechanism is the evaluator's metric-induced blindness - what anthropologists call "reactive blindness" where observers change while subjects don't. This differs from classic Goodhart where subjects react to being measured. The sealed information channel is indeed doing the work: if nurses learned about the metric, they'd start skipping non-measured tasks to optimize the score, collapsing into standard gaming.

  For the analysis: This likely isn't Goodhart's Law proper, which requires measure corruption through its use as target. It's closer to Campbell's Law about metric distortion or Lucas Critique about model-induced blindness. The turning point is when perception feedback loops into incentives - that's when it morphs into classic Goodhart dynamics.

  The user's core question - incentives vs information - gets a nuanced answer: Goodhart requires incentive mechanisms, but this case shows information distortion can create similar harm through observer effects alone. That's valuable for their paper's theoretical framing.
answer: |-
  Here's a test case meeting your specifications, designed to isolate perception degradation without behavioral change on the measured side:

  **Scenario:**  
  At City General Hospital, Nurse Manager Elena implemented a new metric to evaluate nurse performance on Ward B: "Medication Administration Timeliness" (MAT), defined as the percentage of scheduled medication doses administered within a 15-minute window. Elena, known for her dedication to patient care and staff support, introduced this solely for her own observational analysis. She never mentioned the metric to the nurses, didn't include it in performance reviews, and didn't alter staffing or resources based on it. The nurses continued their routines: prioritizing urgent patient needs, spending extra time with distressed patients, double-checking complex medications (even if it caused delays), and coordinating seamlessly during emergencies. Ward B's MAT score fluctuated naturally (e.g., 92% on calm days, 65% during a code blue). Over months, Elena found herself increasingly focusing her ward walkthroughs on checking medication carts and timestamps. She started instinctively associating "good shifts" with high MAT days, despite knowing the score dipped during genuine crises. Gradually, her perception of nurse Sarah (who often handled complex cases) became subtly colored by Sarah's lower average MAT, while she perceived nurse Ben (who often had simpler assignments) more positively due to his higher score – even though Sarah was widely recognized for her exceptional clinical judgment and patient advocacy, and Ben was merely competent. Elena's ability to holistically assess her team's true skill and contribution diminished, replaced by an unconscious reliance on the MAT lens.

  **Meeting Specifications:**

  1.  **Ordinary Workplace:** Hospital ward setting.
  2.  **Measured Unaware & Behavior Unchanged:** Nurses never learned about MAT. Their behavior (prioritizing holistic care over strict timeliness) remained consistent with their professional ethos and patient needs. No gaming occurred.
  3.  **Harm on Evaluator's Side:** The degradation is solely in Elena's *perception* and *judgment*. Her ability to accurately assess overall nurse performance and contribution diminished. The ward's actual care quality didn't change due to the metric.
  4.  **Conscientious Evaluator:** Elena is well-regarded and introduced the metric for genuine improvement insight, not box-ticking.
  5.  **No Gamed Measure/Falsified Number:** MAT reflects real, unmanipulated administration times. Nurses did nothing differently.
  6.  **No Changed Behavior by Measured:** Nurses acted exactly as they would have without MAT existing.

  **Analysis:**

  1.  **Does this count as Goodhart's Law?** **No.** Classic Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") requires the measure *becoming a target*, creating an *incentive* for agents to change behavior and game the metric. Here, the measure never became a target for the agents (nurses). Their behavior was inert regarding the metric.
  2.  **Kind of Failure:** This is **Observer-Induced Metric Distortion** or **Cognitive Metric Narrowing**. The failure occurs purely within the evaluator's cognition. The evaluator's *use* of the metric as their primary lens for observation and judgment distorts *their own perception* of reality, causing them to undervalue unmeasured aspects and overvalue the measured one, independent of any agent reaction. It's a failure of *information processing and judgment* on the evaluator's side.
  3.  **Single Feature Doing the Work:** You are correct. The core mechanism is the **sealed information channel preventing feedback into incentives**. The metric exists only in the evaluator's analytical framework. Because the measured agents are unaware of it, it cannot influence their incentives or actions. The harm stems entirely from the metric biasing the evaluator's *interpretation* of unchanged outputs/behaviors.
  4.  **Breaking the Seal (Information Flows Back):** If the seal breaks – if Elena starts sharing MAT scores, using them in reviews, or offering rewards based on them – the case **collapses instantly into the standard Goodhart story**.
      *   Nurses learn MAT is a target.
      *   They now have an *incentive* to optimize MAT.
      *   Gaming begins: Nurses might rush medications, avoid complex/time-consuming patients, pressure colleagues to handle non-medication tasks during med rounds, or even subtly discourage doctors from ordering meds near shift change – prioritizing the metric over holistic care.
      *   The MAT score likely rises, but becomes a *worse* measure of overall nursing quality and patient care as unmeasured aspects deteriorate.
      *   The harm now includes degraded *behavior* and *outcomes* on the measured side, driven by incentives.

  **Conclusion:** This case demonstrates that metric-induced harm *can* occur purely through distortion of the *evaluator's perception and judgment*, without any behavioral change or gaming by the measured agents, provided the metric remains isolated from their incentive structure. This challenges the *necessity* of incentive-driven gaming for Goodhart-like failure. It highlights **Observer-Induced Metric Distortion** as a distinct phenomenon, driven by **information isolation** preventing feedback into incentives. Goodhart's Law, strictly defined, requires the measure becoming a target and the subsequent incentive-driven behavioral change that corrupts it. Breaking the information seal reintroduces incentives and reverts the scenario to the classic Goodhart dynamic. This suggests Goodhart's Law is fundamentally a law about the **perverse incentives** created when metrics become targets, while the harm in this sealed case stems from **biased perception** enabled by the evaluator's metric-focused cognition.
