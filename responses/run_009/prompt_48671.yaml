answer: |-
  Here’s a rigorous desiderata list for a theory of propositional unity, with motivations, non-negotiables flagged, tensions highlighted, and a quick scorecard of major theories. The binding problem analogy is insightful for structural parallels but diverges on truth/falsity — I’ll note where later.

  ### **Core Desiderata: What a Theory Must Explain**  
  *(Non-negotiables in bold)*  

  1. **Unity vs. Mere Aggregate Distinction**  
     - **Motivation**: Why is "Socrates is wise" a truth-apt whole, while {Socrates, wisdom} is just a set?  
     - **Non-negotiable**: Any theory failing this dissolves propositions into lists.  

  2. **Avoid Bradleyan Regress**  
     - **Motivation**: If "Socrates instantiates wisdom" requires a relation (instantiation) between Socrates and wisdom, what relates *that* relation? Infinite regress looms.  
     - **Non-negotiable**: A theory generating vicious regress (requiring infinitely many explanatory entities) fails. Benign regress (e.g., recursive structure) *might* be acceptable.  

  3. **Handle Asymmetric Relations**  
     - **Motivation**: "Socrates loves Plato" ≠ "Plato loves Socrates". The theory must explain order/direction without regress.  
     - **Non-negotiable**: Without this, relations collapse into symmetric blobs.  

  4. **Account for False Unities**  
     - **Motivation**: How can "Socrates is a stone" be a single proposition *about Socrates* if Socrates isn’t a stone?  
     - **Non-negotiable**: False propositions can’t be "non-existent unities" (e.g., Meinongian shadows) without losing objectivity.  

  5. **No Explanatory Smuggling**  
     - **Motivation**: Can’t presuppose predication/unity in the solution (e.g., "propositions are unified by the mind" → how does *the mind* unify?).  
     - **Non-negotiable**: Smuggling makes the theory circular.  

  6. **Ontological Parsimony**  
     - **Motivation**: Does the theory multiply entities (e.g., fundamental "nexus," non-existent facts)?  
     - **Negotiable**: Realists accept more ontology; deflationists demand minimalism. But bloated theories risk incoherence.  

  ---

  ### **Key Tensions Between Desiderata**  
  - **No Smuggling + Terminate Explanation → Likely Unsatisfiable**  
    As you guessed: theories either take unity as primitive (smuggling-esque) or embrace regress. Example:  
    - *Brute unity* (e.g., Tractatus) violates "no smuggling" by unexplained picturing.  
    - *Benign regress* (e.g., Frege’s saturated/unsaturated) risks violating parsimony.  

  - **False Unities + Ontological Parsimony → Tense**  
    If propositions are abstract objects, false ones are ontologically suspicious. Do we need "nonfacts"?  

  - **Asymmetry + No Regress → Hard**  
    Explaining directionality often invokes ordered pairs or positions, inviting regress about what "binds" elements to positions.  

  ---

  ### **Theory Scorecard (1-Paragraph Summaries)**  
  - **Armstrong States of Affairs (SoAs)**:  
    *SoAs are non-mereological complexes with a primitive "non-relational tie" (instantiation).*  
    → Clears unity (SoAs are basic), regress (tie is primitive), asymmetry (positions in the SoA). Struggles with false unities (non-existent SoAs?) and parsimony (primitives).  

  - **Tractatus Picture Theory**:  
    *Propositions share logical form with facts; unity arises from isomorphic picturing.*  
    → Clears unity, falsehoods (pictures can mismatch), asymmetry (logical form). But "picturing" is unexplained (smuggling), and logical form’s status is murky.  

  - **Trope Bundle Theory**:  
    *"Socrates is wise" = Socrates bundled with wisdom-trope.*  
    → Fails asymmetry (bundles lack order: "aRb" vs "bRa" identical) and false unities (no "non-tropes"). Parsimonious but collapses relations.  

  - **Deflationism (e.g., Quine, Strawson)**:  
    *Propositions are shadows of sentences; unity comes from linguistic syntax.*  
    → Dodges ontology and regress but violates "no smuggling" (syntax presupposes unity) and struggles with false unities (what makes a false sentence *about* anything?).  

  ---

  ### **Binding Problem Analogy: Useful but Limited**  
  - **Overlap**: Both require binding constituents into structured wholes (propositions/percepts). Desiderata **1–3 transfer directly**: neural nets must distinguish bound pairs (red-triangle) from soup, handle asymmetric binding (red→triangle ≠ triangle→red), avoid regress (what binds the binders?).  
  - **Divergence**:  
    - **False unities** aren’t truth-apt in brains — a misbound "red square" is just *incorrect representation*, not a "false object."  
    - **No-smuggling** is less strict: neuroscientists can appeal to temporal synchrony or vector spaces without circularity.  
    - **Parsimony** is empirical: if gamma oscillations solve binding, that’s ontologically cheap.  

  **Verdict**: The analogy helps frame structural unity (desiderata 1–3), but truth/falsity and intentionality make propositions uniquely thorny. A solution to binding *might* inspire propositional theories (e.g., neural "syntax" as primitive), but won’t resolve philosophical regress.  

  **Bottom Line**: Your spec sheet crystallizes the problem. The core tension (**no smuggling vs. termination**) means all solutions have a cost — either brute primitives or infinite structures. The "win" is rigorously mapping tradeoffs.
