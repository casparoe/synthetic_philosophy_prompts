answer: |-
  You're right to feel that your friend's summary has significant oversimplifications and misrepresentations. While it captures *some* basic ideas, it distorts key aspects of both retributivism and consequentialism, leading to a questionable conclusion. Let's break it down point by point, using American English:

  1.  **"Retributivism is the view that punishment is backward-looking — the offender did wrong, so suffering should be inflicted on him, period. That's really just revenge with a courtroom..."**
      *   **What a Careful Retributivist Would Accept:** Yes, retributivism is fundamentally backward-looking. Punishment is justified *because* the offender committed a wrongful act. They *do* believe the offender deserves to suffer (or experience some deprivation) in proportion to their wrongdoing.
      *   **The Misrepresentation (Revenge Comparison):** This is the core distortion. Retributivists vehemently reject the "just revenge" label. Here's the crucial difference:
          *   **Revenge:** Is personal, emotional, focused on the victim's (or their proxy's) satisfaction, often disproportionate, and seeks to inflict harm *for its own sake*.
          *   **Retribution:** Is **impersonal**, **institutional**, and based on **desert and justice**. The *state* (not the victim) acts according to established laws and principles. The focus is on giving the offender their *just deserts* – what they morally deserve *because* of the wrong they freely chose to commit. **Proportionality is paramount** – punishment must *fit the crime*. It's about restoring the moral balance disrupted by the crime and affirming societal norms, not satisfying a personal thirst for vengeance. Calling it "revenge in a robe" ignores these fundamental distinctions of motive, agent, proportionality, and purpose that retributivists emphasize.

  2.  **"Consequentialism is the opposite: forward-looking, we punish to deter, incapacitate, and rehabilitate, and the severity should be whatever level best reduces crime."**
      *   **What a Careful Consequentialist Would Accept:** Yes, consequentialism (specifically *utilitarian* consequentialism regarding punishment) is forward-looking. The primary justification for punishment is its future consequences: deterring others (general deterrence), deterring the offender (specific deterrence), incapacitating dangerous individuals, and ideally rehabilitating offenders. Punishment is an *instrument* to reduce future crime and increase overall societal well-being. The severity should be calibrated based on what evidence suggests best achieves these goals.

  3.  **"The problem for consequentialism is that it has to approve of punishing an innocent person whenever that produces better outcomes — so if the real criminal can't be found, framing a scapegoat is fine. Everyone rejects that, so consequentialism is refuted."**
      *   **The Misrepresentation (The Scapegoat Objection):** This is a classic *straw man* argument against consequentialism. It presents the theory in its most crude, unrealistic form. Careful consequentialists have several strong responses:
          *   **Rule-Consequentialism:** This version asks: "What *general rules* for punishment, if consistently followed, would produce the best overall consequences?" A rule like "Never deliberately punish the known innocent" is almost certainly going to have vastly better long-term consequences than a rule allowing scapegoating. Why? Because public trust in the justice system is *essential* for social stability, cooperation with law enforcement, and general deterrence. Framing innocents destroys this trust, leading to fear, unrest, and potentially more crime.
          *   **Empirical Implausibility:** Consequentialists argue it's empirically unlikely that framing an innocent person would *actually* produce better long-term consequences than pursuing the real offender or honestly admitting the crime is unsolved. The risks of the truth emerging and the catastrophic loss of trust usually outweigh any short-term gain.
          *   **Slippery Slope:** Allowing *any* intentional punishment of the innocent opens the door to widespread abuse and injustice, which has horrific long-term consequences.
          *   **Broader Definition of "Consequences":** Careful consequentialists consider *all* consequences, including the erosion of justice, fairness, trust, and the inherent wrong of intentionally harming an innocent person. The "net benefit" calculation is far more complex than just "does this one act reduce reported crime stats *right now*?"
      *   **Conclusion:** Consequentialism is **not** "refuted" by this objection. Sophisticated consequentialists *also* reject punishing the innocent, but they justify this rejection *based on the very consequentialist principle* that such actions have terrible long-term consequences for society. The objection only refutes a naive, unworkable version of the theory.

  4.  **"And since retributivism is just revenge in a robe, the only sensible position left is a mixed one where we use whichever tool works better case by case."**
      *   **Why the Conclusion Doesn't Follow:**
          *   The "refutation" of consequentialism relies on a straw man.
          *   The characterization of retributivism as "revenge" is a significant misrepresentation.
          *   Therefore, the premise that both "pure" theories are fatally flawed is incorrect. Defensible versions of *both* exist.
          *   **Careful Retributivists** often incorporate consequentialist concerns *within* a retributive framework. They might say punishment *must* be deserved (retributive limit), but *among* deserved punishments, we can choose the one with the best consequences (e.g., rehabilitation over pure incarceration, if both are proportionate).
          *   **Careful Consequentialists** incorporate retributive-like intuitions by recognizing that public perceptions of fairness, desert, and proportionality *are* crucial factors affecting long-term consequences like deterrence and system legitimacy. They wouldn't punish an innocent, and they'd see proportionality as generally instrumentally valuable.
          *   **The "Mixed View":** Many philosophers *do* advocate mixed theories (like Hart's model: retributive distribution - *who* gets punished, consequentialist general justifying aim - *why* we have the institution). However, your friend presents it as the *only* option left after demolishing caricatures of the other two. Since defensible versions of both pure theories exist, and mixed theories often blend elements rather than picking "whichever tool works case by case" without principle, the conclusion doesn't logically follow from his premises. A "case by case" mix without core principles risks arbitrariness and injustice.

  **Where the Revenge Comparison Glosses Over What Matters to Retributivists:**

  Your instinct is spot on. The revenge comparison completely ignores the core retributivist concepts of:
  *   **Desert:** Punishment is *owed* to the offender as a matter of justice, not inflicted for victim satisfaction.
  *   **Proportionality:** Punishment must be *deserved* and *fit the crime*, unlike revenge which is often excessive.
  *   **Impersonality:** It's the state upholding the law and societal norms, not an individual acting on personal grievance.
  *   **Moral Balance:** The idea that wrongdoing creates a moral debt that punishment repays, restoring equilibrium.
  *   **Censure:** Punishment expresses society's condemnation of the wrongful act.

  **The Bottom Line:**

  1.  **Retributivism:** Not "revenge." Careful versions focus on desert, proportionality, and justice administered impersonally by the state.
  2.  **Consequentialism:** Not refuted by the scapegoat objection. Careful versions reject punishing the innocent *on consequentialist grounds* (rule-consequentialism, erosion of trust) and consider a wide range of consequences, including fairness.
  3.  **The Critique:** Your friend's "refutations" rely on oversimplified, straw-man versions of both theories. His characterization of retributivism as revenge is particularly misleading.
  4.  **The Mixed View:** While mixed theories are popular and plausible, his argument for them being the *only* sensible option fails because his attacks on the pure theories miss the mark. Defensible versions of both exist, and mixed theories themselves need principled foundations, not just an ad-hoc "whatever works" approach.

  **What to Trust:** Your friend gets the basic *direction* of the theories right (backward vs. forward-looking). However, his characterizations of their core justifications ("revenge" vs. "okay with scapegoats") and his claim that consequentialism is thereby "refuted" are significant misrepresentations of the actual philosophical debates. You were wise to be skeptical. True crime podcasts often simplify complex ideas for dramatic effect – philosophy demands more nuance.
