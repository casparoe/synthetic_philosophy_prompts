prompt: |-
  I am a retired pharmacologist — thirty-five years in drug safety and toxicology, the last decade of my career spent on regulatory advisory committees — and since retiring I have been working my way into philosophy of science. A question I cannot settle, and which the textbooks I have found treat too abstractly for my taste, is the precautionary principle. Rather than argue about its formulation in the abstract, I would like to proceed from my own verdicts on real cases, most of which I lived through professionally, and have you tell me what principle, if any, they add up to.

  Please take the role of a professional philosopher of science with expertise in risk regulation and decision-making under uncertainty. Reason carefully and do not flatter me. I would like you to begin with some brainstorming: set out at least three candidate principles before committing to one, and explain why you discarded the ones you discard. No reading lists or citations are wanted; I want the analysis itself.

  Here are my verdicts.

  1. Thalidomide. I was a junior researcher when this broke. The American reviewer who held up approval in 1960–61, demanding more data while Europe had already licensed it, was right — and this although at that point there was no proof of harm, only a reviewer's suspicion. Withholding pending evidence: correct.
  2. Asbestos. I believe industry and regulators were wrong to insist on epidemiological proof before restricting it. By the mid-1960s the case should have been closed on the strength of worker mortality data and animal carcinogenicity alone; waiting for definitive proof cost lives. Acting on suspicion: should have come earlier and harder.
  3. DDT. I supported the American ban of 1972 — the eggshell-thinning work, the persistence, the carcinogenicity signals. Right call.
  4. CFCs. We restricted them before anyone had observed an ozone hole, on the strength of atmospheric chemistry and a handful of measurements. I think that was right, and I think the same about the Montreal agreement that followed.
  5. Saccharin and the Delaney clause. This one embarrasses me. I endorsed the Delaney clause in principle — no food additive shown to cause cancer in animals, full stop — yet I thought the attempted ban on saccharin in 1977 was absurd: the rats were dosed at levels no human could physically consume. I still think the clause was right in principle, and I still think the saccharin episode was silly. Reconcile that if you can.
  6. BSE. The feed ban of 1988 was the right call. And I thought ministers reassuring the public that British beef was safe around 1990 were wrong: the species barrier was unknown, the incubation period was long, and the cost of being wrong was catastrophic. Precaution was owed earlier, and more strongly, than it was given.
  7. GM crops. I think the de facto European moratorium of the late 1990s was wrong. A testing regime, certainly; a blanket block on already-characterised products, no. By any evidential standard I would accept, that was over-precaution.
  8. Neonicotinoids. I think the European partial ban of 2013 was right — and this although the field evidence was contested at the time; it was largely laboratory evidence of harm to pollinators, plus the sheer scale of what pollination services are worth. Suspicion plus stakes was enough.
  9. Mobile-phone radiation and brain tumours. I thought funding research was reasonable, but I regarded the precautionary campaigns of the 2000s as overdone: if there is an effect it is too small to matter against the base rates. Precaution inappropriate.

  You will see my trouble. For thalidomide, asbestos, BSE, and the neonicotinoids I demand action on suspicion. For GM crops I refuse to act on suspicion, even though the arguments offered — novelty, spread, irreversibility — were structurally similar to those I accepted in the other cases. And for mobile phones I dismiss precaution outright. I would like to know whether there is one principle that delivers all nine verdicts, and if so what it is, stated precisely, clause by clause, each clause tied to the case that motivates it. If there is not, tell me which of my verdicts has to go and why, and be explicit about the choice between a complicated principle that saves every verdict and a simpler one that overturns some. I would also like the principle's predictions for two cases I have not listed: PFAS contamination of drinking water, and antimicrobial nanosilver in consumer textiles. Finally — and here I suspect the philosophy bites — consider honestly whether my pattern tracks anything less flattering than a principled distinction: familiarity, the exoticness of the hazard, or a status quo bias in which old risks are tolerated and new ones must prove themselves. Tell me what my verdicts reveal about me, not only what I reveal about them. There is also one case I cannot give a verdict on at all, because it changes with the day: deliberate stratospheric aerosol injection to cool the climate. If your principle has something to say about why I oscillate there, I would like to hear it.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired pharmacologist with deep experience in drug safety and regulatory work, now exploring philosophy of science through concrete cases. Their frustration with abstract textbook treatments is palpable - they want to reverse-engineer a principle from their own lived judgments. 

  First, I need to recognize the sophistication of their case selection: it spans pharmaceuticals (thalidomide), industrial toxins (asbestos, DDT), environmental threats (CFCs), food additives (saccharin), infectious disease (BSE), and emerging technologies (GM, neonics, mobiles). Each reveals different facets of their reasoning. The saccharin paradox is particularly telling - they simultaneously endorse an absolute principle while rejecting its concrete application. 

  The core tension emerges between cases where they demand early action on suspicion (asbestos, BSE, neonics) versus rejecting precaution (GM crops, mobiles). GM crops stand out as the anomaly - why accept irreversible harm arguments for neonics but not GM? I suspect the answer lies in their toxicology background: for neonics, lab evidence mapped onto known ecological mechanisms, while GM objections felt more "structural" than mechanistic. 

  Three candidate principles come to mind: 

  1) Strict Precaution ("act on suspicion of harm") - but this fails saccharin and GM cases spectacularly. 
  2) Weighted Evidence Threshold ("act when plausible mechanism + stakes") - handles thalidomide (mechanism unknown but stakes high) and asbestos (known mechanism) but struggles with mobiles (no plausible mechanism). 
  3) Contextual Precaution - this seems most promising. It would incorporate: a) harm mechanism plausibility (not just possibility), b) irreversibility potential, c) substitution options. 

  For the saccharin dilemma: The principle distinguishes between "shown to cause cancer" (true per Delaney) and "shown to cause cancer at human-relevant exposures." Their intuition rejects literal interpretation when exposure scenarios become absurd. 

  On their possible biases: The GM/mobile phone cases do suggest status quo preference. GM was "new" while asbestos was familiar - yet they acted early on CFCs which were novel. Perhaps it's not novelty per se but perceived disruption to existing systems? 

  For PFAS: High persistence + bioaccumulation + emerging toxicity data would likely trigger their action impulse. Nanosilver might give pause - antimicrobial resistance is irreversible but environmental loading less certain. 

  Stratospheric aerosols perfectly expose their tension: irreversible planetary effects vs catastrophic inaction. Their oscillation reflects the contextual principle's variables in maximal conflict. 

  The formulated principle must explicitly reject two temptations: equating "no evidence of harm" with "evidence of no harm," and allowing disproportionate responses to infinitesimal risks. Mobile phones failed both tests. 

  Finally, the reveal about them: Their toxicology training shines through in privileging mechanistic plausibility over purely statistical risks. But there's also regulatory humility - knowing when "proof" demands impossible epidemiology (asbestos) versus when it's achievable (mobiles).
answer: |-
  Based on your verdicts, I identify three candidate principles before refining one that captures your judgments. Your cases reveal consistent drivers: **plausibility of harm mechanism, irreversibility of consequences, and societal stakes**—but these are weighted differently than in standard formulations. Status quo bias is present but not determinative.

  ### Candidate Principles & Why They Fail
  1. **"Act on Suspicion When Harm is Possible"**  
     - *Fails:* Condemns GM crops/mobile phones (you rejected action) and conflicts with saccharin (mechanism was "proven" but you rejected application). Overbroad.

  2. **"Act When Expected Value of Harm Exceeds Intervention Cost"**  
     - *Fails:* Too quantitative. Your judgments prioritize qualitative factors (irreversibility in BSE/CFCs, absurd exposure in saccharin). DDT/neonics involved uncertain probabilities but high-stakes outcomes.

  3. **"Act When Harm is Mechanistically Plausible and Alternatives Exist"**  
     - *Fails:* GM crops had alternatives; you still rejected the ban. Asbestos lacked good alternatives initially, yet you demanded action. Incomplete.

  ---

  ### The Principle That Fits Your Verdicts:  
  **Contextual Precaution**  
  *Act when:*  
  **A. Harm mechanism is biologically/physically plausible** *and*  
  **B. Potential consequences are irreversible or catastrophic** *and*  
  **C. Reasonable evidence suggests non-trivial risk to critical systems (human/ecological)**  
  *unless*  
  **D. Intervention imposes grossly disproportionate burdens relative to risk severity or ignores scientifically absurd exposures.**

  ### How It Explains Your Cases:
  | Case          | A (Plausibility)     | B (Irreversibility) | C (Critical Risk) | D (Proportionality) | Verdict     |
  |---------------|----------------------|---------------------|-------------------|---------------------|-------------|
  | Thalidomide   | High (structural alerts) | High (birth defects) | High (vulnerable population) | Absent             | **Act**    |
  | Asbestos      | High (lung pathology) | High (latent cancer) | High (workers)    | Absent             | **Act**     |
  | DDT           | High (bioaccumulation) | High (ecosystem collapse) | High (food chain) | Absent             | **Act**     |
  | CFCs          | High (chemical kinetics) | High (ozone loss)   | High (UV radiation) | Absent             | **Act**     |
  | Saccharin     | *Technically met*    | Low                 | Low (exposure absurd) | **Violated (D)**   | **Don’t Act** |
  | BSE           | Medium (prion theory) | **Catastrophic** (vCJD) | High (food safety) | Absent             | **Act**     |
  | GM Crops      | Low (no novel pathways) | Low (monitoring possible) | Low (no evidence) | **Violated (D: blocked innovation)** | **Don’t Act** |
  | Neonicotinoids| High (neural toxicity) | **Irreversible** (pollinator collapse) | High (ecosystem service) | Absent             | **Act**     |
  | Mobile Phones | **Low (no mechanism)** | Low                 | Low (epidemiology null) | **Violated (D: alarmism)** | **Don’t Act** |

  - **Saccharin exemption (D):** Your rejection hinges on *disproportionate response* to trivial risk (impossible exposure levels).  
  - **GM exemption (D):** Blanket ban ignored proportionality given lack of plausibility (A) and reversibility (B).  
  - **Mobile phones:** Failed A (no mechanism) and D (campaigns disproportionate to risk).  

  ### Status Quo Bias? Partial, But Explained
  - You tolerate *familiar* risks only when **evidence of harm remains implausible or manageable** (GM, mobiles).  
  - You reject *novel* risks when **plausibility + stakes** align (CFCs, neonics).  
  - **Asbestos/DDT** show you *don’t* privilege old risks: You demanded action despite industry familiarity.  
  - **True bias:** Greater skepticism of *human-imposed novelty* (GM, aerosols) vs. *natural exposures* (asbestos, UV). This aligns with your toxicology training—focus on perturbation of biological systems.  

  ---

  ### Predictions for New Cases
  1. **PFAS in Water**  
     - **A:** High (persistence, bioaccumulation).  
     - **B:** High (irreversible contamination).  
     - **C:** High (human health signals).  
     - **D:** Regulation is proportionate (costs vs. generational toxicity).  
     → **Prediction:** You support strict regulation.  

  2. **Nanosilver in Textiles**  
     - **A:** Medium (antimicrobial action → resistance?).  
     - **B:** High (irreversible antimicrobial resistance?).  
     - **C:** Low (environmental loading unclear; human exposure minimal).  
     - **D:** Ban may be disproportionate without evidence of ecosystem harm.  
     → **Prediction:** You oppose blanket bans but fund monitoring/research.  

  ---

  ### Why You Oscillate on Stratospheric Aerosols
  - **A:** Plausible (physics models).  
  - **B:** **Catastrophic if wrong** (ozone depletion, weather disruption).  
  - **C:** Critical (climate collapse).  
  - **D:** Global governance burdens vs. existential risk.  
  → Your dilemma: **Unresolvable tension between B (irreversibility of *not* acting) and B (irreversibility *of* acting)**. The principle demands action but paralyzes over D (governance feasibility). This case *stress-tests* the principle’s limits.

  ---

  ### What Your Verdicts Reveal About You
  1. **Toxicologist’s Heuristic:** You prioritize *mechanistic biological plausibility* over purely statistical risks (hence mobiles fail, neonics pass).  
  2. **Regulator’s Pragmatism:** You reject dogma (saccharin/Delaney) when real-world exposure breaks the model.  
  3. **Hidden Consistency:** GM crops lacked A/B; mobiles lacked A/C. Your "suspicion" requires *anchor points in established science*.  
  4. **Blind Spot:** Underweighting *social irreversibility* (e.g., GM moratoriums damaging public trust in science) while emphasizing *biological irreversibility*.  

  **Conclusion:** Your principle is **neither simplistic precaution nor risk-benefit utilitarianism**. It is a **contextual bar** demanding action only when mechanisms, stakes, and disproportionality tests align. Sacrificing *no* verdicts requires this complexity. Simpler principles would force you to abandon saccharin (if strictly precautionary) or asbestos (if strictly evidence-based). The oscillation on aerosols? It’s the principle working—not failing—by exposing true dilemmas.
