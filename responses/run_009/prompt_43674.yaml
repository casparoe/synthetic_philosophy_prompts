  2. **No Unexplained Design Thesis**: Any complex function must be explained by lower-level mechanisms. Contentious but plausible.
  3. **No Fundamental Top-Down Causation**: Top-down causation must reduce to bottom-up. Contentious.
  4. **Greedy Reductionist Reading**: Demands immediate reduction to the lowest level, skipping intermediates. This misapplies the slogan.
  5. **Mechanistic Hierarchy Thesis**: Cranes are legitimate at any level if mechanistically composed. Plausible and fits Dennett's intent.

  For each thesis, I evaluate if it's platitude or contentious, its plausibility, and whether it supports the speaker or student. For example:
  - Thesis 1: Platitude. Doesn't address the workspace debate since it's not supernatural.
