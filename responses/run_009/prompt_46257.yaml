answer: |-
  Here's a complete lesson plan designed for your 75-minute session, including payoff matrices, gameplay structure, discussion prompts, and debrief. The goal is for students to discover the need for mixtures in IESDS through hands-on experimentation.

  ### **Payoff Matrices (3x3 Game)**
  **Row Player Strategies**: Alpha (A), Bravo (B), Charlie (C)  
  **Column Player Strategies**: X-ray (X), Yankee (Y), Zulu (Z)  
  **Payoffs (Row, Column)** – Redeemable as 1 point = 0.1% extra credit (or small candy per 50 points):  

  |          | X-ray (X) | Yankee (Y) | Zulu (Z) |
  |----------|-----------|-----------|----------|
  | **Alpha (A)** | (95, 40)  | (15, 30)  | (90, 10) |
  | **Bravo (B)** | (10, 95)  | (100, 20) | (30, 25) |
  | **Charlie (C)**| (25, 10)  | (25, 25)  | (25, 15) |

  **Key Properties**:  
  - **Charlie (C)** is strictly dominated by a 50/50 mix of A and B (expected payoff: X=52.5, Y=57.5, Z=60; all >25).  
  - No pure strategy dominates another initially (students will verify).  
  - After eliminating C, **Zulu (Z)** is strictly dominated by **X-ray (X)** for Column (payoffs: X always > Z).  
  - After eliminating Z, **Yankee (Y)** is strictly dominated by **X-ray (X)** for Column.  
  - Final outcome: **(A, X)**.  

  ---

  ### **Lesson Flow**  
  **Total Time**: 75 minutes  

  #### **Phase 1: Introduction (5 min)**  
  - **Say**: "Today, you’ll play a game to maximize your points—these add up to real rewards. Use the elimination method you know: remove strategies strictly worse than a *single* other strategy. Your goal: find rational strategies."  
  - **Do NOT say**: Anything about mixtures, restarts, or why the game might be tricky.  

  #### **Phase 2: Pure Strategy Elimination Attempt (10 min)**  
  - **Task**: In pairs (Row vs. Column), run pure IESDS on the matrix.  
  - **Predicted struggle**: All pairs report no strategies can be eliminated—nothing is dominated by a pure strategy.  
  - **Instructor Script**:   
    - "Stuck? Write down *why* nothing dominates. Check each row/column pair carefully."  
    - **Silence is key**: Don’t hint. Let frustration build.  

  #### **Phase 3: Gameplay Rounds (20 min)**  
  - **Structure**:  
    - Play **10 rounds**. Each round, players secretly choose a strategy, record payoffs, and switch roles after 5 rounds.  
    - **Twist (After Round 5)**: "Row players: Try using a coin flip to randomize between A and B. Column players: Play as before."  
  - **Materials**: Coins for randomization, scorecards to track payoffs.  
  - **Predicted discovery**:  
    - Loud students may say, "C is trash!" by Round 2—ask: "Prove it’s dominated by a *single* strategy." They’ll fail.  
    - During coin rounds, students see A/B mix *sometimes* loses to C (e.g., A vs. Y yields 15 < 25). **Variance issue**: Highlight that averages matter.  

  #### **Phase 4: Guided Mixture Discovery (15 min)**  
  - **Task**: Calculate average payoffs for 50/50 A/B mix vs. C:  
    - Against X: (95 + 10)/2 = 52.5 > 25  
    - Against Y: (15 + 100)/2 = 57.5 > 25  
    - Against Z: (90 + 30)/2 = 60 > 25  
  - **Instructor Script**:  
    - "What’s the *expected* payoff of the mix? Is it always better than C? What does this imply for rationality?"  
    - Consensus: C should be eliminated.  

  #### **Phase 5: Iterated Elimination on Reduced Game (10 min)**  
  - **Task**: Remove C, then re-run pure IESDS on the 2x3 matrix:  
    ```
            X       Y       Z
      A  95,40   15,30   90,10
      B  10,95  100,20   30,25
    ```  
  - **Discovery**:  
    - Column sees Z is strictly dominated by X (40>10, 95>25).  
    - Eliminate Z → New matrix:  
      ```
            X       Y
      A  95,40   15,30
      B  10,95  100,20
      ```  
    - Column sees Y dominated by X (40>30, 95>20).  
    - Eliminate Y → Only X remains.  
    - Row eliminates B (95 > 10) → **(A, X)** wins.  

  #### **Phase 6: Debrief (15 min)**  
  - **Key Concepts**:  
    1. **Dominance by Mixtures**:  
       - "Charlie wasn’t beaten by Alpha *or* Bravo alone—but a 50/50 mix *always* wins in expectation. Rational players avoid strictly dominated strategies, even if dominance requires mixing."  
    2. **Restarting After Elimination**:  
       - "After deleting Charlie, new dominances emerged (Zulu → Yankee). The reduced game changes incentives—so we restart IESDS. One-pass doesn’t work."  
    3. **Why Mixures?**:  
       - "Mixes cover weaknesses: Alpha loses to Yankee, Bravo loses to X-ray—but together, they dominate Charlie everywhere."  
  - **Connect to Theory**:  
    - "Next week, Nash equilibrium will build on this. IESDS with mixtures solves more games by exposing 'hidden' dominances."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  - **Loud kid "solves" it early**:  
    - If someone says, "Just ignore C!" before mixtures, respond: "Show me a *single* strategy that dominates it. Can’t? Then justify why it’s irrational." This forces engagement.  
  - **Variance masks mixture advantage**:  
    - In early rounds, A/B mix may underperform C (e.g., A vs. Y = 15 < 25). **Fix**: Use the debrief to contrast per-round outcomes (variance) vs. expected value (rational choice).  
  - **Students won’t restart IESDS naturally**:  
    - After eliminating C, some will try to continue with the original matrix. **Fix**: Ask, "Does the relationship between X and Z change now that C is gone? Check the *new* game."  

  ### **What the Activity Can’t Teach (Supply in Debrief)**  
  - **Formal mixture definition**: Explicitly state: "A strategy 𝑠 is strictly dominated by a mixed strategy if, for *every* opponent action, the expected payoff of the mix exceeds 𝑠’s payoff."  
  - **Algorithm precision**: Clarify: "IESDS requires checking all strategies (pure/mixed) for dominance *after each deletion*, not just once."  
  - **Why mixtures work**: Students may intuit "mixing helps" but not grasp optimization. Say: "Mixes let players 'hedge bets' against opponent choices, making dominances harder to spot but more powerful."  

  ---

  ### **Materials**  
  - **Handout**: Matrix + scorecard (American English spelling: "color," "maximize," "rational").  
  - **Incentives**: Points convertible to extra credit/candy (e.g., 500 points = 5% extra credit).  
  - **Tech**: Timer for rounds, coins for mixing.  

  This design forces students to confront the limits of pure IESDS, discover mixtures experimentally, and internalize iteration—all while aligning with econ-focused pedagogy.
