prompt: |-
  I teach an upper-level seminar on collective choice and mechanism design — 14 students, comfortable with preference profiles and the vocabulary of social choice functions, but we have not yet touched any impossibility results. Next week I want to open the unit on strategy-proofness with an 80-minute activity, and I want to run it before the students ever hear the name Gibbard–Satterthwaite or see its statement. The idea is that they spend the session designing voting rules under a fixed list of constraints, and the constraints should be chosen so that every rule they can come up with fails — either someone's report of their preferences turns out to matter not at all, or someone gains by lying. I'd like the failure to be something the other students find and demonstrate, not something I announce: each design should be attacked by a rival group constructing an electorate in which some voter, under that rule, does strictly better by submitting a ranking that isn't their sincere one, or in which the rule silently reduces to one person deciding.

  Concretely, design the session for me: group sizes, the exact constraint list I should post on the board (I'm imagining something like: at least three alternatives; the rule must be able to elect any of them for some profile of sincere rankings; no single voter's submitted ranking may always determine the outcome; and no voter should ever do strictly better by misreporting — but sharpen or reword these as you see fit), the format for submitting a rule, how the attacking groups get incentivized to find the manipulation (some scoring scheme that doesn't use real money — perhaps attacker points for a demonstrated manipulation, designer points for surviving a round, with a published scoreboard), and a timeline that fits 80 minutes including the debrief. I expect some groups will drift toward plurality or Borda and get buried by tactical voting, and that at least one group will try to smuggle in randomization or a tie-breaking "chair" and argue about whether that counts — build in how I should referee those two disputes, since both are actually load-bearing for the debrief.

  Then the debrief: map each failed design onto the parts of the theorem — which constraint was violated and how, which manipulations the students found correspond to the familiar pathologies (compromising, burying), and where the "no single voter's ranking may always determine the outcome" constraint quietly became a dictatorship the moment they added a tie-breaker. Tell me what will predictably go wrong on the first run — groups that spend the whole time relitigating the constraint list, attacks that fail because the attacker used a profile where the manipulation isn't strict, designs that are too vague to attack at all — and how to handle each. Finally, be honest about the limit of the exercise: the students will have seen that every rule they proposed fails, but no finite session can show that every possible rule fails, so somewhere I have to stop refereering examples and supply the actual theorem, with at least a sketch of why the impossibility is general rather than a summary of their failures. Tell me where in the 80 minutes that handoff should happen and what I should say at that moment, and flag anything about the theorem the activity structurally cannot reproduce — e.g. that it concerns social choice functions defined on all profiles, not the handful of electorates the students will ever write down.
reasoning: |-
  We are designing an 80-minute in-class activity to introduce the concept of strategy-proofness and lead into the Gibbard-Satterthwaite theorem. The goal is for students to attempt to design voting rules that satisfy certain constraints, and then for other groups to try to find manipulations (or show that the rule violates one of the constraints). The constraints should be set up so that every rule they design will inevitably fail.

  ### Constraints to Post
  We need constraints that are clear and that together will lead to an impossibility. We can phrase them as:

  1. **At Least Three Alternatives**: The voting rule must work for any set of at least three alternatives (let's fix the set as {A, B, C} for simplicity, but note the rule must in principle work for any three or more).
  2. **Unrestricted Domain**: The rule must be able to produce any alternative as the winner for some profile of sincere rankings (i.e., for each alternative, there exists a profile of rankings that makes that alternative win).
  3. **Non-Dictatorship**: There must be no voter such that, for every profile, the outcome is the voter's top-ranked alternative (i.e., no dictator).
  4. **Strategy-Proofness**: No voter should ever have an incentive to misreport their preferences. That is, for every voter and every profile, reporting their true ranking should yield at least as good an outcome (according to their true preferences) as any other ranking they might report, and sometimes it might be strictly worse to lie.

  We might also add a note that the rule must be deterministic. However, if a group proposes a randomized rule, we can challenge them by pointing out that we are only considering deterministic rules (and if they insist, we can note that the constraint of strategy-proofness for randomized rules is more subtle, and we are focusing on deterministic). Similarly, if they try to use a tie-breaking chair, we can point out that if the tie-breaker is fixed (i.e., always breaks ties in favor of a particular voter's top choice) then that voter might become a dictator in some circumstances.

  ### Activity Design

  **Group Sizes**: 
  - Divide the class into 4-5 design groups (each of about 3-4 students). Each group will design a voting rule.
  - The rest of the class will form "attack" groups (also 4-5 groups, each of about 3 students). Alternatively, we can rotate: after the design phase, each design group is assigned to attack the rules of other groups.

  **Timeline (80 minutes total):**

  1. **Introduction (5 minutes)**: 
     - Explain the goal: design a voting rule that satisfies the constraints. 
     - Post the constraints and explain them clearly. Emphasize that the rule must be defined for any profile of rankings (over at least three alternatives). 
     - Explain the process: design phase, then attack phase, and then we'll discuss.

  2. **Design Phase (20 minutes)**:
     - Design groups work together to create a voting rule. They must write it down clearly and give it a name. They should be prepared to explain how it works.
     - Rules must be defined for any profile of strict rankings (no ties in individual preferences) and must output a single winner (if they propose a rule that can tie, they must specify a deterministic tie-breaker; but note that the tie-breaker must not violate non-dictatorship).

  3. **Rule Submission and Assignment (5 minutes)**:
     - Each design group writes their rule on the board (or on a shared document) with a clear description.
     - Assign each attack group to one or two design groups (depending on time). Alternatively, we can have a "free-for-all" where any attack group can attack any rule.

  4. **Attack Phase (30 minutes)**:
     - Attack groups try to find a violation of the constraints for the rules they are assigned. They can either:
          a) Find a profile and a voter who can manipulate by misreporting (and show that the voter gets a strictly better outcome by lying).
          b) Show that the rule violates non-dictatorship (by showing that one voter always gets their top choice, or that the rule is equivalent to a dictatorship).
          c) Show that the rule does not satisfy unrestricted domain (if they can show that one alternative can never win, but note that this might be harder and less central).
     - They must write down the profile and the manipulation (or the violation) clearly.
     - **Scoring**: 
          - If an attack group successfully demonstrates a violation (with a correct example and reasoning), they get 2 points. 
          - The design group gets 1 point for each attack they survive (i.e., if no group successfully attacks their rule in the time allowed). 
          - We keep a scoreboard on the board.

  5. **Debrief (20 minutes)**:
     - We discuss the results. For each rule that was attacked, we have the attackers present their counterexample. 
     - Then we connect to the Gibbard-Satterthwaite theorem.

  **Handling Disputes**:

  - **Randomization**: If a design group proposes a randomized rule, we rule that we are only considering deterministic rules. The constraint of strategy-proofness for randomized rules is defined differently (a voter should not be able to change the probability distribution to get a stochastically dominant outcome). We are focusing on deterministic rules to keep it simple and because the Gibbard-Satterthwaite theorem is for deterministic rules.

  - **Tie-breaking Chair**: If a design group uses a fixed tie-breaking order (e.g., always break ties in favor of A, then B, then C) that is not based on a voter, that's acceptable. However, if they use a voter as a tie-breaker (e.g., in case of a tie, voter 1's top choice wins), then we must check for non-dictatorship. The problem is that if the tie-breaking voter is the same for every tie, then in a profile where all voters rank A and B at the top (and the rule might tie between A and B) then the tie-breaker becomes a dictator for that profile. Also, if the rule is such that the tie-breaker's top choice always wins (if they break every tie by their own top choice) then that voter is effectively a dictator. We should rule that the tie-breaking procedure must not depend on a particular voter's report (for non-dictatorship). Instead, they can use a fixed ordering of alternatives for tie-breaking.

  **Predictable Problems**:

  - **Groups Relitigating Constraints**: Some groups might question the constraints. We should be firm: the constraints are fixed for the activity. We can say, "For the purpose of this activity, we are using these constraints. We can discuss the reasons for them in the debrief."

  - **Failed Attacks**: Attackers might present a profile where a voter can lie but the outcome isn't strictly better (or they miscalculate). Encourage the design group to check the example. If the attack is invalid, the design group survives. The instructor can step in to clarify if needed.

  - **Vague Designs**: If a rule is too vague to attack, the design group must clarify. If they cannot, then the attack group can claim that the rule is not well-defined and thus violates the requirement of being a rule. We can give the design group a chance to fix it, but if they can't, they get 0 for that round and the attack group gets 2 points for pointing out the vagueness.

  - **Time Constraints**: Some groups might not finish. We can extend the attack phase by a few minutes if necessary, but we must leave time for debrief.

  ### Debrief

  We start by having each design group briefly present their rule. Then, for each rule that was attacked, the attack group presents their counterexample. We then discuss:

  - For each failed rule, identify which constraint was violated and how. 
  - Common failures:
     - **Plurality**: Vulnerable to "compromising" (burying a less preferred alternative to help a more preferred one) or "burying" (ranking a strong opponent lower to help a preferred alternative).
     - **Borda**: Also vulnerable to similar manipulations.
     - **Tie-breaking with a chair**: If the tie-breaker is a fixed voter, then in profiles where the rule often ties, that voter becomes a dictator. This violates non-dictatorship.

  We then transition to the theorem:

  "Today, every rule you designed was successfully attacked. But that doesn't prove that every rule must fail. However, it turns out that there is a famous theorem that says: for three or more alternatives, any social choice function that is defined for every possible profile (unrestricted domain), is non-dictatorial, and is strategy-proof must also be onto (which we have as unrestricted domain, meaning every alternative can win). But even then, the theorem says that the only rules that satisfy these are dictatorial. In fact, the Gibbard-Satterthwaite theorem states that any social choice function that is onto (every alternative can win) and strategy-proof must be dictatorial. 

  Why is this true? The proof is by showing that strategy-proofness and unanimity (which is implied by being onto) imply that the rule must be monotonic and must have a 'pivotal voter' who can force an alternative to win by moving it to the top, and then showing that this voter is a dictator. But we won't do the proof today. 

  Note that your activity was limited: you only considered a finite set of rules and a finite set of profiles. The theorem applies to every possible rule that satisfies the conditions for every possible profile. That's why we can state the impossibility."

  **Where to Hand Off**: 
  At the end of the debrief, after we have seen several failures, we state the theorem. We should do this in the last 5-10 minutes of the debrief.

  **What the Activity Cannot Capture**:
  - The theorem applies to social choice functions defined on the entire domain of preference profiles. The students only checked a few profiles.
  - The theorem requires the function to be defined for every possible strict ranking by every voter (unrestricted domain). The students might have only considered a few profiles.

  **Final Note**: 
  The activity is meant to build intuition. The frustration of having every rule fail will motivate the theorem. The debrief should connect their experiences to the formal statement and explain that the theorem generalizes their observations.

  This plan should fit in 80 minutes and create an engaging and enlightening session.
answer: |-
  ### Session Design: "The Impossibility Challenge"  
  **Goal:** Students experience the inevitability of manipulation or dictatorship in voting rules under specific constraints, setting the stage for Gibbard-Satterthwaite.  

  ---

  ### **Constraints to Post on the Board**  
  *Sharpen wording to avoid loopholes and force failures:*  
  1. **≥3 Alternatives**: The rule must output a single winner from a set of ≥3 alternatives (use {A, B, C} as the minimal setup).  
  2. **Onto (Full Range)**: Every alternative must be electable. *For some profile of sincere rankings, A wins; some profile, B wins; some profile, C wins.*  
  3. **Non-Dictatorship**: No single voter’s submitted ranking always determines the winner. *If a voter changes their ranking, the outcome can change (i.e., they’re not a dictator).*  
  4. **Strategy-Proof**: No voter ever gains by lying. *For every voter and every profile: submitting their true ranking yields an outcome at least as good as any false ranking, according to their true preferences.*  
  5. **Deterministic & Total Domain**: The rule must output exactly one winner for any profile of strict rankings (no ties in voter preferences).  

  > **Clarify during intro**:  
  > - "Gains by lying" = gets an outcome they *strictly* prefer.  
  > - No randomization allowed (handle disputes below).  
  > - Tie-breaking must be predefined and voter-independent (e.g., "alphabetical order," not "chair breaks ties").  

  ---

  ### **Activity Structure (80 min total)**  
  **Group Sizes & Roles:**  
  - **Design Groups (3 groups of 4–5 students):** Create a voting rule meeting all constraints.  
  - **Attack Groups (3 groups of 3–4 students):** Test other groups’ rules for violations.  
  - **Instructor:** Circulates, clarifies constraints, and referees.  

  **Timeline:**  
  1. **Intro & Constraints (10 min):**  
     - Explain constraints and goals: "Design a voting rule where no one benefits from lying, no dictator, and any candidate can win."  
     - Announce scoring:  
       - **Designers**: 5 pts if rule survives all attacks.  
       - **Attackers**: 3 pts per *demonstrated* violation (manipulation/dictatorship).  
     - *Post a live scoreboard.*  

  2. **Design Phase (20 min):**  
     - Design groups draft a rule with:  
       - A **name** (e.g., "Borda With Veto").  
       - A **clear procedure** (e.g., "Voters rank alternatives; most last-place votes is eliminated, then majority vote on the rest").  
       - Submit in writing.  

  3. **Attack Phase (30 min):**  
     - **Assign rules:** Each attack group gets one design group’s rule.  
     - **Goal:** Find either:  
       - A **manipulation** (profile + voter who gains by lying).  
       - **Dictatorship evidence** (a voter whose top choice always wins, or whose report nullifies others).  
     - Attackers submit their case in writing: profile, sincere outcome, manipulated outcome, and voter’s true preferences.  

  4. **Presentation & Refereeing (15 min):**  
     - Each attack group presents their case (1–2 min per rule).  
     - Design group defends (1 min).  
     - **Instructor rules** on the spot:  
       - If attack succeeds: Attackers get 3 pts, designers get 0.  
       - If attack fails: Designers get 5 pts.  

  5. **Debrief (15 min):**  
     - Transition to Gibbard-Satterthwaite (details below).  

  ---

  ### **Handling Predictable Disputes**  
  1. **Randomization Attempt:**  
     - If designers propose randomness (e.g., "tiebreak by coin flip"), **rule it out immediately**:  
       - *"Random rules are excluded by the ‘deterministic’ constraint. We’re only considering non-random social choice functions."*  

  2. **Tie-Breaking "Chair" Attempt:**  
     - If designers use a voter as tie-breaker (e.g., "if tie, let voter 1 decide"), **referee as follows**:  
       - *"If the tie-breaker’s top choice always wins when they break a tie, they dictate the outcome in those profiles. This violates non-dictatorship. Use a fixed rule (e.g., alphabetical order) instead."*  
     - If they argue the chair isn’t a "full" dictator, respond:  
       - *"In profiles where a tie occurs, this voter unilaterally chooses the winner. That’s dictatorial power in those cases."*  

  ---

  ### **Predicted Failures & Mitigation**  
  - **Groups relitigating constraints?**  
    - *Handling:* Firmly redirect: "The constraints are fixed for this exercise. If your rule violates one, it fails—focus on redesign or attack."  
  - **Weak attacks (non-strict manipulation)?**  
    - *Handling:* Require attackers to prove the manipulator gets a **strictly better** outcome. Reject attacks where gains are not strict.  
  - **Vague rules?**  
    - *Handling:* Force designers to clarify. If still ambiguous, rule it "non-implementable" and let attackers score.  
  - **Time management?**  
    - Strictly enforce phase times. Cut off groups at 20/30 min.  

  ---

  ### **Debrief: Connecting to Gibbard-Satterthwaite**  
  **When to transition:** After all attacks are presented (min ~70), pause and say:  
  >*"Every rule today failed—but maybe we just didn’t find the right one. What if I told you no such rule exists? That’s the Gibbard-Satterthwaite theorem."*  

  **Map student discoveries to the theorem:**  
  | Student Failure          | Theorem Concept                     | Example from Activity |  
  |--------------------------|-------------------------------------|----------------------|  
  | **Plurality manipulation** | "Burying" pathology               | Attacker shows a voter drops their true 2nd choice to last to help their 1st choice win. |  
  | **Borda manipulation**    | "Compromising" pathology          | Voter ranks a weaker opponent higher to stop a stronger one. |  
  | **Tie-breaker = dictator**| Hidden dictatorship               | In a Condorcet cycle, the "chair" (voter 1) always picks their top choice. |  
  | **Uncovered alternative** | Violates "onto" (full range)      | A rule where C can never win, even if all rank it 1st. |  

  **Key takeaways for the theorem:**  
  1. **Generality matters:**  
     - *"You found failures for specific rules, but Gibbard-Satterthwaite proves **no** rule satisfies all constraints for **all possible profiles**."*  
  2. **Critical assumptions:**  
     - ≥3 alternatives, unrestricted domain (all rankings allowed), strategy-proofness, non-dictatorship.  
  3. **What the activity couldn’t show:**  
     - The proof requires showing impossibility for **all** conceivable rules (not just those designed).  
     - The theorem assumes the rule is defined for **every possible profile**—not just the examples tested.  

  **Closing hook:**  
  >*"Next class, we’ll see how Gibbard-Satterthwaite’s proof uses these pathologies—burying, compromising, and hidden dictators—to build a general argument. For now, sit with this frustration: every rule you trust can be manipulated... or is a dictatorship in disguise."*  

  ---

  ### **Instructor Prep Checklist**  
  - **Materials:** Whiteboard (constraints + scoreboard), paper for submissions.  
  - **Backup plans:**  
    - If no rule is attacked successfully, present a pre-made failure (e.g., show how Borda fails).  
    - If all rules violate "onto," challenge designers: "Prove your rule can elect any candidate."  
  - **Time buffer:** Save 5 min in debrief for Q&A.  

  This design forces experiential learning: students *feel* the impossibility before formalizing it. The constraints, scoring, and tight timeline create productive frustration, priming them for the theorem’s profundity.
