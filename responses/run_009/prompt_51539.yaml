  Ranking: China (0.9 culpability) clearest for political crime, then Ireland (0.8), then Bengal (0.7). Divergences: Bengal's higher explanatory but lower culpability due to war; Ireland's lower explanatory but higher culpability due to exports; China's strong on both but intent vs. systemic issue.

