  Next, Ireland 1845-52. Potato blight caused a massive shortage, but entitlement collapse was evident in landlord-tenant dynamics and continued food exports. Explanatory score: 0.7 - significant entitlement issues but real shortage too. Culpability: British policies like limited aid and export focus were deliberate and foreseeable. Racism and neglect suggest high culpability (0.8). Weakest link is proving entitlement failure alone caused deaths despite the real shortage.

