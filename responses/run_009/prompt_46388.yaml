  The quiz must be engaging. I'll use fun names for positions and include a scoring key that maps answer patterns, highlighting inconsistencies. For instance, answering A to Q1 (pay) but B to Q8 (refuse) might indicate bounded utilities only in high-stakes, requiring a follow-up question to clarify.

