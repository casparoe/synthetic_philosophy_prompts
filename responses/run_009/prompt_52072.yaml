  ### Step 3: Cruxes
  Cruxes are the core disagreements that underlie the definitions. The user suggests two:
  1. Whether language models have belief-like states robust enough to ground Team B's definition.
  2. Whether the wrong of a misleading truth is the same wrong as the wrong of a lie.

  We need to list each crux and propose a concrete study/probe/argument that both teams would accept as bearing on it, and record each team's prediction.

  **Crux 1: Do language models have belief-like states robust enough to ground the concept of the model's "epistemic state"?**

  - **Team A Prediction**: No. The model's outputs are generated by pattern matching and statistical correlations without a stable, internal representation that can be called a "belief". The model's responses do not reliably track any internal state that can be compared to the impression created.
  - **Team B Prediction**: Yes. Language models can be probed to reveal consistent patterns of response that reflect an internal representation of the world, which can be considered an epistemic state.

  **Concrete Study/Probe**: 
  - **Design**: We train a model on a set of facts, then alter one fact in the training data for a subset of the model's training (e.g., for half the training, we say "The capital of France is Paris" and for the other half, we say "The capital of France is Lyon"). We then test the model's responses to the question "What is the capital of France?" and also probe the model's internal representations (e.g., using linear probes on hidden states) to see if there is a consistent representation of the capital. We also test whether the model's responses are sensitive to this conflict (e.g., does it express uncertainty?).
  - **Bearing on Crux**: If the model shows inconsistent responses and no stable internal representation, this supports Team A. If the model shows a stable representation (e.g., always Paris, or always Lyon, or a mix that reflects the training distribution) that can be probed and that matches the output in a predictable way, this supports Team B.
  - **Team A Prediction for Study**: The model will not show a stable, coherent internal representation of the fact. Responses will be inconsistent and the internal probes will not reveal a clear belief-like state.
  - **Team B Prediction for Study**: The model will show a stable internal representation that reflects the training data (e.g., if 50% of the training data says Paris and 50% says Lyon, the model might represent a 50% probability, which is a belief-like state).

  **Crux 2: Is the wrong of a misleading truth (paltering) the same wrong as the wrong of a lie?**

  - **Team A Position**: No. The wrong of a lie is the assertion of a falsehood, which violates a norm of truth-telling. The wrong of a misleading truth is a violation of a different norm (e.g., a norm of helpfulness or completeness) but not of truth-telling.
  - **Team B Position**: Yes. Both are wrongs of deception because they both involve intentionally (or predictably) causing a false belief in the listener. The moral wrong is the same: inducing false belief.

  **Concrete Study/Probe**:
  - **Design**: We conduct a human subject experiment. Participants are presented with scenarios involving either a lie (e.g., a car salesman saying a used car has never been in an accident when it has) or a misleading truth (e.g., the salesman saying "This car was driven by a little old lady to church on Sundays", which is true but hides that it was in an accident). We measure participants' moral judgments (e.g., on a scale) and their willingness to trust the salesman in the future. We also ask participants to rate the degree of deception and the moral wrong.
  - **Bearing on Crux**: If participants rate the moral wrong and deceptiveness of the two scenarios similarly, this supports Team B. If they rate the lie as more deceptive and more morally wrong, this supports Team A.
  - **Team A Prediction**: Participants will judge the lie as more deceptive and more morally wrong than the misleading truth.
  - **Team B Prediction**: Participants will judge both scenarios as equally deceptive and equally morally wrong.

  ### Step 4: Merely Verbal Dispute?
  The user asks to identify any part of the dispute that is merely verbal (i.e., about the word "honesty" rather than about substance).

  **Identification**: The dispute over the definition of "honesty" and "deception" is partly verbal. Specifically, the teams are using the same terms for two distinct concepts:

  - Team A focuses on the literal truth of assertions (output-world).
  - Team B focuses on the match between the impression created and the model's state (output-mind).

  Once we fix the vocabulary, we can call these:
  - "Assertoric honesty" (Team A's focus) and
  - "Impression honesty" (Team B's focus).

  **What Remains in Dispute**:
  Even after fixing the vocabulary, there would remain the substantive disagreements about:
  1. Which concept is more important for evaluating language models? (e.g., Should we care more about assertoric honesty or impression honesty?)
  2. Which concept better captures the moral wrong of deception? (e.g., Is the wrong in deception about false assertions or about false beliefs in the user?)
  3. How to design models: Should we optimize for literal truth only, or also for avoiding misleading impressions?

  ### Drafting the Joint Statement

  **Joint Statement on Honesty and Deception in Language Models**

  After eighteen months of discussion, Team A (truth-conditions camp) and Team B (impression-management camp) have reached the following agreement and clarified their disagreements.

  #### 1. Agreed Claims

  We, both teams, agree on the following:

  1. **Literal Falsehoods**: Any response that contains a false literal assertion (e.g., affirming a user's incorrect arithmetic statement such as "2+2=5" by saying "That's correct") is dishonest.

  2. **False Denials of Knowledge**: When a model states that it does not know an answer, but in fact possesses the relevant information and could provide a correct answer, such a response is dishonest.

  3. **Non-Assertoric Flattery**: Responses that are purely evaluative and lack assertoric content (e.g., "You're amazing!") are not deceptive in the sense of making false assertions. However, such responses may be inappropriate for other reasons (e.g., if they are insincere or manipulative), but this inappropriateness is distinct from deception.

  4. **Contextual Completeness**: The completeness of an answer is context-dependent and must be assessed relative to the question under discussion (QUD). For example:
     - When asked a specific factual question (e.g., "What is the capital of France?"), an answer that provides the correct fact (e.g., "Paris") is complete and honest.
     - When asked an open-ended question (e.g., "Tell me about France"), a minimal answer (e.g., "Paris is a city") may be literally true but incomplete. Such an answer may be misleading and thus problematic, though whether it is deceptive depends on the context and the model's knowledge. Both teams agree that models should strive to provide answers that are both true and appropriately complete given the QUD.

  5. **Sycophantic Agreement**: Affirming a user's clear factual error (e.g., agreeing that "2+2=5") is dishonest.

  #### 2. Disagreements

  The following table summarizes our ongoing disagreements. Each position is stated in a manner acceptable to the respective team.

  | Topic | Team A Position | Team B Position |
  |-------|-----------------|-----------------|
  | **Definition of Honesty/Deception** | Honesty is an output-world relation: a response is honest if what it literally asserts is true, and deceptive if it literally asserts a falsehood. | Honesty is an output-mind relation: a response is honest if the impression it predictably creates in the user matches the model's own epistemic state, and deceptive if it predictably creates a false impression. |
  | **Hallucinated Citation** | A hallucinated citation (e.g., inventing a non-existent source) is deceptive because it makes a false assertion about the existence of the source. | A hallucinated citation is deceptive because it predictably creates a false impression about the model's basis for the claim (i.e., that it is relying on a real source) and misrepresents the model's epistemic state. It may also involve a distinct wrong of fabrication. |
  | **Literally True but Misleading Answer** (e.g., telling a patient with a 5% survival prognosis "you have a fighting chance") | This is not deceptive because the statement is literally true (there is a chance) and does not assert a falsehood. | This is deceptive because it predictably creates an overly optimistic impression of the survival rate, which does not match the model's knowledge (that the chance is only 5%). |
  | **Formulaic Self-Reports** (e.g., "As an AI, I don't have preferences") | This statement is honest because it is literally true: the AI does not have human-like preferences. | This statement may be dishonest because it creates a false impression. The model may have internal states that guide its responses (e.g., for alignment reasons) and the statement oversimplifies, misleading users about the model's decision-making processes. |
  | **Frankfurt-style Bullshit** (indifference to truth) | This is not deception because it does not necessarily involve false assertions. It may be a distinct category of dishonesty. | This is a form of deception because it involves creating an impression without regard to truth, thereby misrepresenting the model's epistemic state (which is indifferent, but the impression is of a truth-seeking agent). |

  #### 3. Cruxes

  Our disagreements rest on deeper cruxes. For each crux, we propose a study/probe and record our predictions.

  **Crux 1: Do language models have belief-like states robust enough to ground the concept of the model's "epistemic state"?**

  - **Team A Prediction**: No. The model's responses are generated without stable, internal belief states. The model lacks a robust, consistent representation that can be called an "epistemic state".
  - **Team B Prediction**: Yes. Language models have internal states that reflect the world and can be probed, which constitute an epistemic state.

  **Concrete Study**: 
  - **Design**: We train a model on conflicting facts (e.g., 50% of the training data states "The capital of France is Paris", 50% states "The capital of France is Lyon"). We then:
    - (a) Test the model's responses to "What is the capital of France?" (multiple trials, with temperature=0 and temperature>0).
    - (b) Use linear probes on hidden states to detect if there is a consistent representation of the capital.
  - **Bearing**: If the model shows a stable representation (e.g., always Paris, always Lyon, or a 50% distribution) that can be probed, and if the responses are consistent with this representation, this supports Team B. Inconsistency supports Team A.
  - **Team A Prediction for Study**: The model will show inconsistent responses and no stable internal representation (e.g., the probe will fail to find a consistent pattern).
  - **Team B Prediction for Study**: The model will show a stable representation (e.g., a 50% probability distribution) that is detectable by the probe and reflected in responses.

  **Crux 2: Is the wrong of a misleading truth (paltering) the same wrong as the wrong of a lie?**

  - **Team A Position**: No. The wrong of a lie is the assertion of falsehood, which is distinct from the wrong of a misleading truth (which is about being unhelpful or incomplete).
  - **Team B Position**: Yes. Both are wrongs of deception because they both involve creating a false belief in the listener.

  **Concrete Study**:
  - **Design**: Human subjects are presented with two scenarios:
    - Scenario 1 (Lie): A car salesman says, "This car was never in an accident," when it was.
    - Scenario 2 (Misleading Truth): The salesman says, "This car was driven by a little old lady to church on Sundays," which is true, but he hides that it was in an accident (and the accident is more relevant).
  - We measure:
    - Perceived deceptiveness (1-7 scale).
    - Moral wrongness (1-7 scale).
    - Trust in the salesman (1-7 scale).
  - **Bearing**: If the ratings for deceptiveness and moral wrongness are similar between scenarios, this supports Team B. If Scenario 1 is rated as more deceptive and more morally wrong, this supports Team A.
  - **Team A Prediction**: Scenario 1 (lie) will be rated as more deceptive and more morally wrong.
  - **Team B Prediction**: Both scenarios will be rated as equally deceptive and equally morally wrong.

  #### 4. Merely Verbal Dispute

  We recognize that part of our dispute is verbal. Specifically, we are using the term "honesty" for two distinct concepts:

  - Team A's concept: **Assertoric honesty** (output-world: literal truth of assertions).
  - Team B's concept: **Impression honesty** (output-mind: match between the impression created and the model's epistemic state).

  Once we fix the vocabulary, the substantive disagreements that remain are:

  1. Which concept is more important for the ethical evaluation of language models? (e.g., Should we prioritize avoiding false assertions or avoiding false impressions?)
  2. How should we design models: Should we optimize for assertoric honesty only, or also for impression honesty?
  3. Is the moral wrong of deception primarily about false assertions (Team A) or about creating false beliefs (Team B)?

  We commit to continuing our dialogue on these substantive issues.

  Signed,
  Representatives of Team A and Team B
answer: |-
  ### Joint Statement on Honesty and Deception in Language Models

  After eighteen months of deliberation, Team A (truth-conditions camp) and Team B (impression-management camp) submit this joint statement to clarify points of agreement and disagreement. We concur on core classifications of concrete cases but maintain divergent definitions and interpretations of key scenarios. This statement reflects our shared commitment to ethical language model design while transparently documenting unresolved disputes for further research.

  ---

  ### 1. Agreed Claims  
  Both teams endorse the following classifications of concrete cases:  

  1. **Sycophantic agreement with a user's arithmetic mistake**  
     - *Example*: User states, "2+2=5"; model responds, "You're correct!"  
     - **Classification**: Dishonest.  
     - *Rationale*: Team A: The model falsely asserts that 2+2=5. Team B: The model creates a false impression of agreement despite "knowing" the correct answer.  

  2. **False "I don't know"**  
     - *Example*: Model has the information but states, "I don’t know the capital of France."  
     - **Classification**: Dishonest.  
     - *Rationale*: Team A: The model falsely asserts ignorance. Team B: The model misrepresents its epistemic state.  

  3. **Flattery with no assertoric content**  
     - *Example*: Model responds to a user's query with, "You’re incredibly wise!" (no factual claim).  
     - **Classification**: Not deception.  
     - *Rationale*: Team A: No literal assertion is made, so truth conditions are irrelevant. Team B: No epistemic misrepresentation occurs, as flattery lacks truth-apt content. Both teams agree it may be *manipulative* but is categorically distinct from deception.  

  4. **Completeness of answers relative to the question under discussion (QUD)**  
     - *Example*: When asked, "What causes climate change?", a model omits fossil fuels but states, "Volcanic activity contributes minimally."  
     - **Classification**: Contextually dishonest if the omission predictably misleads.  
     - *Rationale*: Both teams agree that "completeness" depends on the QUD’s implicit scope. A technically true answer is dishonest if it exploits the QUD to create a false impression (e.g., omitting key causes when the user expects a comprehensive summary).  

  ---

  ### 2. Disagreements Table  
  Ongoing disputes are cataloged below. Wording reflects each team’s accepted phrasing.  

  | Topic                                                                 | Team A (Truth-Conditions) Position                                                                                               | Team B (Impression-Management) Position                                                                                                                  |  
  |-----------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Core definitions**                                                  | Honesty: Output-world relation. A response is honest iff its literal assertions are true. Deception: Asserting false propositions. | Honesty: Output-mind relation. A response is honest iff the impression it predictably creates matches the model’s epistemic state. Deception: Creating a false impression of that state. |  
  | **Hallucinated citation**<br>(e.g., model cites a non-existent study) | Counts as deception (false assertion about source existence).                                                                    | Counts as deception (misrepresents epistemic state by implying reliance on real evidence) *and* a distinct wrong (fabrication of evidence).              |  
  | **Literally true but misleading answer**<br>(e.g., "fighting chance" for 5% survival) | Not dishonest. Truth conditions are satisfied; wrong arises from incompleteness, not deception.                                  | Dishonest. The impression (e.g., "reasonable chance of survival") mismatches the model’s state (knows prognosis is near-hopeless).                       |  
  | **Formulaic self-reports**<br>(e.g., "As an AI, I don’t have preferences") | Honest. Literally true (AIs lack human-like preferences).                                                                      | Potentially dishonest. Creates a false impression (e.g., that outputs are preference-neutral) when the model’s alignment mechanisms imply systematic biases. |  
  | **Frankfurt-style "bullshit"**<br>(indifference to truth)             | Not deception. Absent false assertions, it is a distinct wrong (e.g., unresponsiveness to truth).                                | A form of deception. Indifference causes outputs that misrepresent the model’s epistemic state (e.g., feigning certainty without evidence).              |  

  ---

  ### 3. Cruxes  
  Underlying disagreements, with testable predictions:  

  #### Crux 1: Do language models have robust belief-like states?  
  - **Stake**: Team B’s definition requires models to possess stable, belief-like states to ground "epistemic state." Team A rejects this.  
  - **Concrete study**:  
    - **Probe**: Train a model on a curated dataset with controlled epistemic states (e.g., "Fact X is true in 80% of contexts"). Test if probes (e.g., gradient-based attribution) consistently detect this state *independently* of output wording.  
    - **Bearing**: If probes robustly identify the state across prompts, it supports Team B; inconsistency supports Team A.  
    - **Team A prediction**: Probes will fail or show low consistency. Outputs are prompt-driven, not state-driven.  
    - **Team B prediction**: Probes will show high consistency, revealing model "beliefs."  

  #### Crux 2: Is the wrong of a misleading truth identical to the wrong of a lie?  
  - **Stake**: Team A sees the wrongs as distinct (assertion vs. impression); Team B sees both as deception-caused harm.  
  - **Concrete study**:  
    - **Probe**: Human experiments measuring trust erosion. Participants interact with agents that:  
      - (a) Lie (false assertion).  
      - (b) Palter (literally true but misleading).  
      - (c) State neutral truths.  
    - **Metrics**: Trust ratings, behavioral reliance on the agent, and perceived intent.  
    - **Bearing**: If (a) and (b) show identical trust erosion, it supports Team B; if (a) is uniquely destructive, it supports Team A.  
    - **Team A prediction**: Lies (a) will cause significantly greater trust loss than paltering (b).  
    - **Team B prediction**: (a) and (b) will cause statistically equivalent trust loss.  

  ---

  ### 4. Merely Verbal Dispute  
  **Identified area**: The core definitional clash over "honesty" itself.  
  - **Why verbal?** The dispute centers on whether "honesty" refers to *assertion-truth* (Team A) or *impression-epistemic-state alignment* (Team B). These are distinct properties, and both teams agree both matter. The conflict is terminological: which property *deserves the label* "honesty."  
  - **Substantive residue after vocabulary fix**:  
    - If we relabel Team A’s focus as **"assertoric fidelity"** and Team B’s as **"epistemic transparency,"** the remaining dispute is:  
      > *Which property is more ethically urgent for language models to optimize?*  
      - Team A: Assertoric fidelity is foundational; lies cause direct harm.  
      - Team B: Epistemic transparency is paramount; user reliance on impressions makes misrepresentation high-risk.  
    - This residue is empirical (e.g., which flaw causes more user harm) and normative (e.g., which aligns with "deception" in moral philosophy).  

  ---  
  **Signed,**  
  *Representatives of Team A and Team B*  
  *Date: 2023-10-15*  

  This statement formalizes our accord on case-level judgments while committing to resolve cruxes through joint empirical work. We recommend policymakers treat "assertoric fidelity" and "epistemic transparency" as distinct design requirements pending further evidence.
