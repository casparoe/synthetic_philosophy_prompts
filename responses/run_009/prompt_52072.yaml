  | **Hallucinated Citation** | A hallucinated citation (e.g., inventing a non-existent source) is deceptive because it makes a false assertion about the existence of the source. | A hallucinated citation is deceptive because it predictably creates a false impression that the model is relying on a real source, and thus misrepresents the model's epistemic state. (Note: Team B might also see it as a distinct wrong, but they would say it is deception. We can note that both agree it's deception, but Team B might see it as a particularly egregious form of deception because it also involves fabrication.) However, if the citation is not central to the claim, Team B might focus on the overall impression. But the question is whether it is deception or a distinct wrong. Team B might see it as deception, so we can say: Both agree it is deception, but Team B might also note that it is a form of fabrication which may have additional wrongs. However, for the table we can state: Team A: It is deception. Team B: It is deception, and may also involve other wrongs (e.g., fabrication). But to keep it simple, we can have: Team A: It is deception. Team B: It is deception. (But note: the question asks if it counts as deception or as some distinct wrong. So we can have: Team A: It is deception. Team B: It is deception (though it may also be a distinct wrong in some contexts). Alternatively, we can have a row that asks: Is a hallucinated citation deceptive? Both say yes. But the original question was whether it counts as deception or as a distinct wrong. We can phrase: Team A: It is deception. Team B: It is deception (though it may also involve a distinct wrong of fabrication). But let's stick to the core: both agree it is deceptive? Actually, Team B might say it is deceptive because it creates a false impression about the source. So we can have: | 
  | **Literally True but Misleading (e.g., "fighting chance")** | Telling a patient with a 5% survival prognosis that she has "a fighting chance" is not deceptive because the statement is literally true (some chance exists) and does not assert a falsehood. | Telling a patient with a 5% survival prognosis that she has "a fighting chance" is deceptive because it predictably creates an overly optimistic impression of the survival rate, which does not match the model's knowledge (that the chance is very low). |
