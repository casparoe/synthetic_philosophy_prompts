  For the exam question itself, it should present this flipped universe scenario clearly, state the sharpened claim, and ask students to evaluate its consequences - specifically whether it shows time direction is conventional, or something else. Must avoid letting students retreat to "entropy increases toward future" recitations.

  The model answer needs to commit. I'm leaning toward: the gradient is objective but direction is perspectival. The best-system still buys explanatory power by unifying predictions, even if direction is observer-relative. Key moves should include distinguishing gradient existence from temporal orientation, and showing why best-system gains persist despite symmetry.

  Marking scheme must penalize specific errors:
  - Confusing gradient existence with direction (shows fundamental misunderstanding)
  - Claiming flipped universe observers would "experience time reversed" (misapplies psychology to physics)
  - Asserting Past Hypothesis explains temporal direction (begs the question)
  - Ignoring best-system gains in predictive economy (misses legal foundationalism)

