answer: |-
  ## Dialogue: The Printed Paradox

  **Setting:** A philosophy seminar room, coffee cups half-empty. **Alex** defends coincidence; **Sam** defends one-object.

  **Alex:** So, Sam, this printed statue case is fascinating. Precisely *because* there’s no prior lump – the printer extrudes clay directly into statue-shape – it seems to crystallize the distinction. We have a statue, obviously. But we also have a piece of clay. They share every atom, every spatial point, throughout their creation and existence. Yet, they must be distinct. Why? Persistence conditions. *This* piece of clay, call it ClayPrime, could survive being crushed into a ball tomorrow. The statue, call it Minerva, absolutely could not. Crushing annihilates Minerva. Therefore, Leibniz’s Law: Minerva and ClayPrime differ in properties (survives crushing/doesn’t survive crushing), so they cannot be identical. The printer’s layer-by-layer creation doesn’t change that. ClayPrime *could have* been squashed mid-print, preventing Minerva from ever existing. That modal fragility is built into Minerva’s nature as an artifact, not into ClayPrime’s nature as a portion of matter.

  **Sam:** Alex, I think the printer *undercuts* your modal intuition precisely *because* there's no independent lump. What exactly are you tracking when you say "this piece of clay could have been squashed"? Before the printer started, there was no *object* that was "the piece of clay destined for Minerva" – just raw clay in a hopper, an undifferentiated mass. The printer doesn’t track a pre-existing lump; it *creates* a shaped object from matter. The modal property you’re assigning to "ClayPrime" – surviving squashing – is parasitic on the *very same artifact* you’re calling Minerva. You’re imagining the *matter* surviving a different fate, but that matter wasn’t an individuated *object* "ClayPrime" until it was printed *as* Minerva. There’s only one object here: the statue-shaped clay. Calling it "the piece of clay" just highlights its material composition, not a distinct entity. And your coincidence multiplies wildly! Why stop at statue and clay? Why not the aggregate of clay molecules? Or the aggregate of atoms? Is the registrar supposed to count *dozens* of coinciding objects in one spatial region? That’s ontologically profligate and violates common-sense individuation.

  **Alex:** Profligate? Maybe, but metaphysics isn't constrained by the registrar’s spreadsheet! The modal difference is real. But let’s address your core claim: sortal relativity. You’re suggesting "statue" and "piece of clay" aren’t sortals picking out distinct objects, but just different ways of counting *the same thing* under different descriptions? So, when the registrar asks "How many objects are in the crate?", what’s the answer? Is it one? Then she’s miscounting if she later says "I have custody of the statue *and* its constitutive clay." Is it two? Then you’ve conceded coincidence! Or is there *no fact of the matter*? That seems deeply unsatisfying. Ordinary language and practice *do* quantify over statues and pieces of clay as distinct entities. The museum bought *Minerva*, a valuable artwork. They didn’t buy *ClayPrime*; if they melt it down, they’ve destroyed Minerva but still possess the same clay (now a lump). That distinction *demands* distinct referents. Quantification works: There is one statue in the crate. There is one piece of clay in the crate. But they aren’t identical.

  **Sam:** The quantification isn’t ill-formed, Alex, it’s *sortal-relative*. "How many objects?" is incomplete. It needs: "How many *statues*?" – One. "How many *pieces of clay*?" – One. But crucially, both questions are answered by counting the same single object, described under different sortals. The museum *bought* an object under the sortal "statue." When they say they possess "the statue and its clay," they aren’t enumerating entities, they’re describing the *same* entity in terms of its kind and its composition. Melting it down changes the object – it ceases to be a statue. Now there’s a lump, a new object falling under the sortal "lump of clay." It’s the same *matter*, but not the same *object*. Persistence is sortal-dependent. Your "ClayPrime" surviving squashing isn't the statue-object persisting; it's the statue-object ceasing to exist and a *new* lump-object beginning to exist from the same matter.

  **Alex:** Let’s test that with the conservator’s intervention. Years later, a corner chips off. The conservator replaces it with new clay, identical in type. The original chip is kept in a drawer. Now, the museum says, "We still have the *very same statue*, Minerva, just restored." But do they have the same *piece of clay*?

  **Sam:** Absolutely not. The original piece of clay – the matter constituting Minerva at acquisition – is now partially in the statue and partially in the drawer as a chip. The repaired statue is constituted by *mostly* the original matter plus some new matter. Crucially, the museum is right: it *is* the same statue. Its identity is tied to its artistic continuity, history, and (sufficiently preserved) form, not strict material identity. The object persisting under the sortal "statue" allows for gradual matter replacement. The "piece of clay" originally associated with it, however, as a specific portion of matter, has been diminished and altered. The registrar could now count *two* distinct pieces of clay: the primary mass in the statue (which itself is a fusion of original and new clay) and the chip in the drawer. But the statue remains one.

  **Alex:** Ah, but here’s the rub for *you*, Sam. If there was only ever *one object*, the statue-shaped clay, how does *it* persist? Before the chip, it was Object O (statue-shaped clay). After replacement, it’s Object O’ (statue-shaped clay, mostly same matter + new bit). Is O identical to O’? By Leibniz’s Law, probably not – O had the original corner as a part, O’ does not. So did the original object *cease* when the chip was lost? But the museum insists it’s the same statue! Your one-object view either forces you to deny the statue persists (absurd) or accept vague identity over time – a sorites nightmare. Coincidence avoids this neatly: *Minerva* (the statue) persists through the repair because its identity conditions (artistic continuity) tolerate matter replacement. *ClayPrime* (the original piece of clay) does *not* persist through the loss of the chip and addition of new matter; it’s now partially destroyed, partially in the drawer. The statue persists, the specific portion of matter does not. Two distinct things with distinct persistence conditions explain the different judgments cleanly.

  **Sam:** No sorites needed. The *object* persists as the same statue because the change is insignificant relative to the sortal "statue." Losing a tiny chip doesn’t destroy the statue-object; it alters it. Adding new clay later restores form but changes composition. The persistence of the *statue-object* isn’t strict mereological identity; it’s continuity of form, function, and identity under its governing sortal. The original *portion of matter* doesn’t persist as a single entity because a part was removed. The museum can say they own the same statue without implying they own the same exact matter precisely because "statue" doesn’t require strict material identity over time. Your coincidence posits an invisible, untrackable, ever-present shadow object – "ClayPrime" – solely to satisfy a modal intuition divorced from actual individuation practices. The registrar counts *what there is to count*: one significant artifact. She doesn’t count an ephemeral "piece of clay" coinciding with it until forced by material dispersion.

  **Alex:** But Sam, that modal intuition *is* grounded in reality – the physical possibility of squashing! And your "sortal persistence" seems suspiciously ad hoc when repairs happen. The deepest issue is this: do persistence conditions flow solely from the sortals we apply *now*, or do objects have intrinsic, sortal-independent modal profiles that determine what they can survive? I say the latter. Minerva, *as an artifact*, couldn’t survive radical reshaping; that portion of matter *as matter* could. That difference is real and prior to our counting practices.

  **Sam:** And I say, Alex, your "intrinsic modal profiles" are illusions projected by the very sortals we use to conceptualize the world. There are no objects-in-themselves with hidden persistence essences; there are just objects individuated *by* sortals. The "could have been squashed" is a counterfactual about *how we would describe* the matter, not a revelation of a shadow object. The deepest issue is ontological priority: do we need to populate the world with coincident entities to explain our language and modal intuitions, or can we account for everything with a sparse ontology of objects individuated by their actual properties and histories, counted relative to the sortals we deploy? I say the latter is sufficient and far less mysterious.

  **(Both take a sip of coffee, the fundamental divide clear: intrinsic modal properties vs. sortal-dependent individuation.)**
