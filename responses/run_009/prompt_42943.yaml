  Question 6: A case with no meddlesome preferences? But then no conflict. So not useful.

  Question 6: The case of the noisy practice.

    Scenario: Two roommates. One is a pianist (P) who has the right to practice in the common room. The other is a reader (R) who has the right to read in the common room. But if they both use the common room at the same time, R is disturbed by the piano. 

