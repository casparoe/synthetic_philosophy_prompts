answer: |-
  **Bottom line:** The two-subjects view maps cleanly to partitioned replicas with independent state, while degraded-access views require fudging replication lag or eventual consistency metaphors due to irreconcilable asymmetry (no recovery protocol), and claims about transient/subjective unity have no analog in distributed systems—exposing either a vocabulary gap for qualia or philosophical imprecision.

  ### Translation of Philosophical Positions
  1.  **Two Subjects of Experience (e.g., Nagel, Puccetti):**  
      *Distributed Systems Translation:* Two independent nodes (hemispheres) after partition (callosotomy), each acting as a stateful replica with its own consensus group membership (self-identifying as "primary"). They accept writes (sensory input, decisions) without quorum across the partition boundary. Conflicting operations (e.g., left hand buttoning vs. right unbuttoning) occur due to lack of distributed locking or fencing tokens. No leader election occurs post-partition because the failure detector (corpus callosum) is permanently offline.  
      *Consistency Model:* AP (Available, Partition-Tolerant) with no reconciliation—divergent histories persist indefinitely.

  2.  **Degraded Access / Unified Consciousness (e.g., Bayne, Dennett):**  
      *Distributed Systems Translation:* A single node (consciousness) with severe replication lag. One hemisphere (e.g., language-dominant left) acts as the read-write primary but has stale or partial reads from the other replica (right hemisphere) due to partition. "Degraded access" resembles a replica unable to satisfy read-after-write consistency for its own state. Conflicting actions are interpreted as write conflicts or unacknowledged writes due to replication latency, not separate agencies.  
      *Consistency Model:* Eventual consistency with high latency and no conflict resolution—writes may never converge.

  3.  **Partial/Shifting Unity (e.g., Schechter, Lockwood):**  
      *Distributed Systems Translation:* Dynamic quorum reconfiguration. During integration (e.g., tasks using both hands), nodes temporarily form a quorum group via subcortical pathways (acting as a low-bandwidth network link). Under stress or conflicting tasks, the quorum dissolves, reverting to partitioned mode. "Unity" is a transient consensus epoch.  
      *Consistency Model:* A consensus group with flaky membership, oscillating between strong consistency (during unified tasks) and partition tolerance (during conflict).

  ---

  ### Residue Report
  **Clean Mappings:**  
  - **Two-subjects → Partitioned replicas:** Flawless. Independent write acceptance, no quorum, permanent divergent state, conflicting operations without fencing. The "one body" objection is irrelevant—shared hardware (body) doesn't imply shared state (consciousness), just as colocated nodes on a rack don't prevent split-brain.  
  - **Conflicting actions → Write conflicts:** Direct analog to non-atomic operations across partitioned replicas (e.g., left hand writes "buttoned," right hand writes "unbuttoned" on the same resource).  

  **Fudged Mappings:**  
  - **Degraded access → Replication lag:** Requires ignoring irreversibility. Replication lag implies eventual convergence, but the hemispheres *never* reconcile state. Calling this "eventual consistency" is misleading—there's no "eventual." It's permanent inconsistency.  
  - **Fencing tokens:** Used in our systems to resolve stale primaries (e.g., a fenced "old primary" cannot write). No biological equivalent exists—both hemispheres operate indefinitely without external arbitration. Forced metaphors here obscure the asymmetry.  
  - **Shifting unity → Dynamic quorums:** Implies intentional reconfiguration. Subcortical pathways aren't a consensus service; they're a low-throughput channel that *sometimes* facilitates coordination. Philosophers' "transient unity" lacks the explicit coordination protocol of dynamic quorums.  

  **No Expression in Your Vocabulary:**  
  - **Subjective unity:** Claims that consciousness "feels unified" despite behavioral divergence (e.g., Bayne's "phenomenal unity") have no distributed systems correlate. Nodes don't "feel" unified; they follow protocols. This residue suggests either:  
    - A *vocabulary gap*: Distributed systems lack terms for qualia (subjective experience), making unity claims untranslatable.  
    - *Philosophical imprecision*: Appeals to "phenomenal unity" may be poorly defined post-hoc explanations for behavioral data.  
  - **Asymmetry in recovery protocols:** The critical divergence. Your systems resolve split brains via leader election, fencing, or state merging. Biological split brains have **no recovery protocol**—the partition is permanent. This isn't an implementation detail; it invalidates degraded-access models that rely on implicit reconciliation. Permanent partition forces a two-replica model.  

  **Why Residue Exists:**  
  1. **Permanent partition + no recovery:** Distributed systems assume partitions are transient. Callosotomy is a permanent topological change—like severing a network cable with no repair possible. This breaks metaphors relying on eventual convergence.  
  2. **Absence of global coordinator:** Your systems have external operators or consensus protocols. The brain has no "orchestrator node"; unity (if it exists) must emerge from subsystems. Philosophers smuggling in a "meta-consciousness" (degraded-access view) have no analog.  
  3. **Qualia:** Claims about "what it feels like" map to nothing in your toolkit. This is either a fundamental limitation of your vocabulary (it describes behavior, not experience) or evidence that philosophical positions overreach the data.  

  **Verdict on Asymmetry:** The lack of a recovery protocol does **real philosophical work**. It forces the two-subjects model as the only consistent distributed systems analogy. Degraded-access views are like claiming two AP replicas with permanent partition are "really one system with replication lag"—a contradiction. The shared name ("split brain") is superficial; the *permanence* of the partition changes the system’s guarantees fundamentally.
