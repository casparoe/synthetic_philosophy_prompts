answer: |-
  ### **Condorcet Jury Theorem Activity: "The Wisdom (and Folly) of Crowds"**

  #### **Objective**:  
  Demonstrate Condorcet’s Jury Theorem (independent voters slightly better than 50% can produce highly accurate majorities) and how it breaks when independence fails. Students *experience* the shock of the theorem through betting and see the "catch" in Round 2.

  ---

  ### **Materials**  
  - Whiteboard (for questions/tallying)  
  - Paper (for answers/bets)  
  - Markers  

  ---

  ### **Rules & Scoring**  
  **Duration**: 15-18 minutes total (2 rounds).  
  **Group**: 22 students.  
  **Scoring**: Use "Brain Points" (BP). Each student starts with 10 BP. No real money—just bragging rights!  

  #### **Round 1: Independence (10 minutes)**  
  1. **Question Format**: 3 probability questions (see below). Each has one correct answer.  
  2. **Voting**:  
     - Display question on whiteboard.  
     - Students write **their answer** (A, B, C) and **bet** (-10 to +10) on whether the *majority* will be correct.  
       - *Betting rules*:  
         - **Positive bet (e.g., +7)**: "I think the majority is **CORRECT**."  
         - **Negative bet (e.g., -5)**: "I think the majority is **WRONG**."  
         - **Zero bet (0)**: No confidence (no gain/loss).  
  3. **Tally & Reveal**:  
     - Collect votes, tally on board, show majority vote.  
     - **Before revealing the answer**, collect bets.  
     - Reveal correct answer.  
     - **Scoring**:  
       - If majority is **CORRECT**: Students gain their bet if positive, lose it if negative.  
       - If majority is **WRONG**: Students gain their bet if negative, lose it if positive.  
     - *Example*: Betting +5 and majority is correct → +5 BP. Betting -5 and majority is wrong → +5 BP.  

  #### **Round 2: Broken Independence (5 minutes)**  
  1. **Question Format**: 1 trick question designed for a common misconception.  
  2. **Voting**:  
     - **Designated "Influencer"**: Teacher or a student volunteer gives a **wrong answer aloud with persuasive (but flawed) reasoning** (e.g., "It’s obviously B because..." when it’s not).  
     - Students vote again (no bets this round).  
  3. **Tally & Reveal**:  
     - Tally votes → majority will likely be wrong due to groupthink.  
     - Reveal correct answer.  

  ---

  ### **Questions**  
  **Round 1 (Independent Voting - Probability Questions)**  
  *(Goal: ~60-70% individual accuracy; majority should win all)*  
  1. **Coin Flips**:  
     *A fair coin is flipped 10 times. The first 9 flips are heads. What’s the probability the 10th flip is heads?*  
     - A) < 0.5 | B) 0.5 | C) > 0.5  
     **Correct: B** (Independent events).  

  2. **Dice Rolls**:  
     *You roll two fair 6-sided dice. What’s the probability the sum is 7?*  
     - A) 1/6 | B) 1/12 | C) 1/36  
     **Correct: A** (6 combinations out of 36: 6/36 = 1/6).  

  3. **Cards**:  
     *A deck has 52 cards. You draw 2 without replacement. What’s P(both hearts)?*  
     - A) 1/16 | B) 1/17 | C) 13/52 × 12/51  
     **Correct: B** (13/52 × 12/51 = 1/17).  

  **Round 2 (Broken Independence - Trick Question)**  
  4. **Monty Hall Problem**:  
     *3 doors: 1 car, 2 goats. You pick Door 1. Host opens Door 3 (goat). Should you switch to Door 2?*  
     - A) Yes | B) No | C) Doesn’t matter  
     **Influencer’s Wrong Reasoning**: "It’s 50-50 now! Switching doesn’t matter (C)."  
     **Correct: A** (Switching wins 2/3 of the time).  

  ---

  ### **Debrief Script (3 minutes - Keep it snappy!)**  
  1. **Round 1 Recap**:  
     - "How many of you were *shocked* the majority got most/all right? Why?"  
     - **Key Point**: "This is Condorcet’s Jury Theorem! If each of you is slightly better than a coin flip (>50%), the majority can be *extremely* accurate when votes are independent. 22 people at 60% accuracy? Majority is right ~95% of the time!"  

  2. **Round 2 Recap**:  
     - "Why did the majority fail here?"  
     - **Key Point**: "Independence broke! One wrong opinion influenced everyone. Correlated errors → groupthink. The theorem assumes no copying/coordination."  

  3. **Takeaway**:  
     - "Wisdom of crowds works when people decide *independently*. Break independence? The crowd gets dumber, not smarter!"  

  ---

  ### **Heads Up: What Could Go Wrong**  
  1. **Time Crunch**:  
     - **Fix**: Use a timer! Stick to 2 min/question in Round 1 (1 min vote/bet, 1 min tally/reveal). Skip detailed explanations—just reveal answers.  

  2. **Round 1 Majority Loses**:  
     - **Why?** Bad luck, or questions too hard.  
     - **Save it**: "See? Even with independence, it’s not magic—just *probabilistic*. But statistically, it should work most times!"  

  3. **Betting Confusion**:  
     - **Fix**: Do a **practice question** first (e.g., "Is the sky blue?" with obvious majority). Show how +5 (bet on correct majority) pays +5.  

  4. **Round 2 Fails to Fool**:  
     - **Why?** Students resist the influencer.  
     - **Fix**: Pick a persuasive influencer (or the teacher) and use Monty Hall—it’s notoriously counterintuitive.  

  5. **Ties (22 students)**:  
     - **Rule**: No majority? Majority is "wrong" for scoring.  

  ---

  ### **Why This Works**  
  - **Shock Factor**: Students *underbet* in Round 1 (thinking, "No way we’re right!"), then see the majority win. They "lose" bets but learn.  
  - **The Catch**: Round 2 shows how easily the theorem breaks—making it memorable.  
  - **No Tech**: Paper/whiteboard only. Questions use prior probability knowledge.  

  **Pro Tip**: Project confidence! If you fumble, laugh it off—it’s a warm-up, not an exam. You’ve got this! 👍
