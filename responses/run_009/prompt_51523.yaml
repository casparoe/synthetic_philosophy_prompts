prompt: |-
  I'm a test-and-evaluation engineer for machine-learning systems, so the vocabulary I actually use is ground-truth labels, holdout sets, proxy metrics, calibration curves, benchmark contamination, red-teaming, and trusted reporting pipelines. Restate the core of Nyāya epistemology in that vocabulary, as faithfully as you can: the four pramāṇas — perception, inference, upamāna (analogy, on their stock example of learning the word gavaya by being told the animal resembles a cow and then recognizing one in the wild), and reliable testimony — as four routes by which a claim becomes warranted; their doctrine that doubt is never the default and itself requires positive grounds on both sides; and their rule that a cognition stands as presumptively true unless some specific defect is found to defeat it. Then give me the residue report. Which parts map cleanly — is their testimony pramāṇa anything more than trusting a third-party benchmark, and is upamāna just zero-shot generalization from a natural-language description? Which parts only translate with distortion? And which have no counterpart at all — in particular, whether my field's working assumption, that no output counts as knowledge until it has passed an eval, is even expressible in Nyāya terms, or whether Nyāya would reply that we are all quietly relying on undefeated presumption every time we ship a model. Finally, tell me whether the residue points to something my evaluation vocabulary is missing or to something the Nyāya picture cannot say.
reasoning: |-
  Okay, let me approach this systematically. The user is a test-and-evaluation engineer specializing in ML systems, using very specific terminology like "ground-truth labels" and "trusted reporting pipelines". They want Nyāya epistemology mapped to their professional vocabulary, with a residue analysis. 

  First, I need to recall Nyāya's core: the four pramāṇas (perception, inference, analogy, testimony), their stance on doubt requiring positive grounds, and presumption of validity until defeasance. The challenge is finding precise equivalents in ML evaluation terms without distortion.

  For perception → sensor calibration seems apt, as both deal with direct sensory input requiring validation. Inference → probabilistic prediction aligns well with evidence-based conclusions. 

  The analogy case (learning "gavaya" from cow comparison) feels like zero-shot generalization from natural language descriptions - both involve transferring knowledge from known to novel instances. 

  Reliable testimony → trusted reporting pipelines covers certified data sources, but I wonder if this misses Nyāya's broader societal context of authority. 

  On presumption: Nyāya's "valid until disproven" clashes sharply with ML's "invalid until tested" ethic. This is the biggest tension - our entire field assumes untested outputs can't be trusted, while Nyāya would argue we constantly rely on undefeated presumptions (like trusting our instruments). 

  The residue shows Nyāya accounts for knowledge acquisition in open-world settings where exhaustive testing is impossible - something our metrics-driven approach struggles with. Conversely, Nyāya lacks our structured contamination checks and red-teaming protocols. 

  Notably absent in Nyāya: our concept of benchmark contamination and adversarial testing frameworks. And our field has no equivalent to their requirement that doubt must be justified - we systematize doubt through mandatory evals. 

  This reveals a gap in ML evaluation: we don't formally recognize the role of presumption in operational systems. The residue suggests both frameworks could learn from each other - Nyāya about systematized skepticism, ML about epistemic efficiency.
answer: |-
  Here's the Nyāya epistemology core restated in your evaluation vocabulary, followed by a detailed residue report:

  **Core Nyāya Restated:**
  1.  **Perception (Pratyakṣa):** Direct sensory calibration against ground-truth labels via trusted sensors (indriya). Requires valid sensor input pipelines and absence of known defects (e.g., noise, adversarial perturbations).
  2.  **Inference (Anumāna):** Probabilistic prediction of unobserved labels via a causal evidence model (vyāpti). Requires validated training data (pakṣa), reliable correlation metrics (hetu), and robust generalization (sādhya) confirmed on holdout sets.
  3.  **Analogy (Upamāna):** Zero-shot cross-modal generalization. Given a natural-language description ("resembles cow feature-set X"), agent identifies novel class instance (gavaya) in wild test environment through feature mapping. Depends on high-fidelity description and unambiguous feature similarity.
  4.  **Testimony (Śabda):** Trusted reporting pipeline from certified source (āptavākya). Source must have validated expertise, reliable calibration history, and no known contamination or adversarial intent.
  5.  **Presumptive Validity:** Every cognition output is assigned "presumptive positive evidential weight" by default. It stands as a valid inference until a specific defect (doṣa) is detected in its generation pipeline.
  6.  **Burden of Doubt:** Doubt requires positive evidence *against* the claim *and* evidence supporting a viable alternative hypothesis. Unexamined outputs are not "default uncertain"; they hold provisional warrant.

  **Residue Report:**

  **I. Clean Mappings:**
  *   **Testimony (Śabda) ≈ Trusted Reporting Pipeline:** This maps exceptionally well. Nyāya's emphasis on source credibility (expertise, truthfulness) aligns perfectly with using certified benchmarks, validated datasets, or trusted model outputs (e.g., verified human annotators, audited data sources). Defect detection (contamination, bias) is central to both.
  *   **Upamāna ≈ Zero-Shot Generalization from Description:** The "gavaya" case maps cleanly to describing a novel class via similarity to known classes (cow) and recognizing it in deployment. The key elements – description quality, feature alignment, and out-of-distribution recognition – are core ML challenges.
  *   **Perception ≈ Sensor Calibration:** Requiring valid sensory input pipelines and detecting sensor defects directly parallels sensor calibration and data validation in ML perception systems.
  *   **Defect Detection:** Nyāya's focus on identifying specific defects (doṣa) to *defeat* a cognition aligns with identifying specific failure modes (e.g., bias, drift, adversarial attacks) during red-teaming or evals.

  **II. Mappings with Distortion:**
  *   **Inference (Anumāna) ≈ Probabilistic Prediction:** While the *structure* (evidence → conclusion) maps, Nyāya inference is deductive/universal ("where there's smoke, *there must be* fire") based on established causal laws (vyāpti). ML inference is fundamentally probabilistic and statistical. Mapping requires softening Nyāya's certainty to probabilistic confidence and replacing universal causality with learned correlation.
  *   **Presumptive Validity ≈ Model Output:** The *structural claim* (outputs are valid until proven defective) maps directly to Nyāya's epistemology. However, the ML field's *operational ethic* actively contradicts this presumption. While Nyāya *describes* cognition this way, ML engineering *prescribes* the opposite stance ("distrust until verified").
  *   **Burden of Doubt ≈ Hypothesis Testing:** The *logic* (doubt requires positive counter-evidence) resembles rigorous hypothesis testing. However, ML's *default workflow* treats all *novel/unverified outputs* as inherently uncertain/dubious until an eval clears them, effectively *reversing* the Nyāya default on the operational level.

  **III. No Counterpart / Significant Tension:**
  *   **Nyāya's Presumptive Validity vs. ML's "Eval-Gated Knowledge":** This is the critical clash. **Nyāya has *no counterpart* to the ML field's core working assumption that "no output counts as knowledge until it has passed an eval."** Nyāya would argue:
      *   Your *entire workflow relies* on undefeated presumption: You trust your evaluation metrics (proxy or ground-truth), your test sets (holdout sets), your data pipelines, your hardware, your own senses when reading results, and the basic functionality of your tools *by default*, until a specific defect is found. You don't re-run a full eval on your entire stack before *every* inference.
      *   Demanding *explicit* eval for *every single output* before granting *any* warrant is computationally intractable and ignores the foundational role of defeasible presumption in any functional system, including your own evals.
  *   **Benchmark Contamination:** While Nyāya cares about source defects, the specific modern concept of *benchmark data leaking into training data*, invalidating the holdout set's status as a true ground-truth proxy, lacks a direct, nuanced counterpart. Nyāya focuses more on source intent/competence than accidental statistical leakage.
  *   **Red-Teaming as Systematic Adversarial Testing:** Nyāya's defect detection is more reactive or based on known failure modes. The *proactive, systematic* generation of adversarial inputs (red-teaming) to *find* unknown defects is a distinctly modern, structured practice without a precise ancient equivalent.
  *   **Proxy Metrics Nuance:** While Nyāya understands indirect evidence, the complex trade-offs, limitations, and potential misalignment of proxy metrics (e.g., BLEU, accuracy, F1) with *true* task performance/utility ("ground truth" in a broader sense) involves modern statistical challenges not explicitly addressed in the same way.

  **IV. What the Residue Reveals:**

  1.  **ML's Missing Element (Highlighted by Nyāya):**
      *   **Formal Role of Defeasible Presumption:** ML evaluation lacks a formal framework acknowledging the *necessary and pervasive* role of *undefeated presumption* in operational systems. Everything *cannot* be constantly re-evaluated. Nyāya makes this explicit, providing a philosophical foundation for trusting components *until proven defective*, which is operationally essential but often implicit/unexamined in ML workflows. ML needs better ways to formally track and manage this *chain of defeasible trusts* (in tools, data, metrics, hardware).

  2.  **Nyāya's Missing Elements (Highlighted by ML):**
      *   **Systematized Skepticism & Adversarial Testing:** Nyāya lacks the structured methodologies (systematic holdout sets, red-teaming, contamination checks) that ML has developed to operationalize doubt and proactively search for defects *at scale* and *before deployment*. Its defect detection is more case-by-case.
      *   **Probabilistic Uncertainty & Proxy Nuance:** Nyāya's framework struggles to natively express the degrees of uncertainty, confidence intervals, and the complex relationship between proxy metrics and true underlying goals that are central to modern ML evaluation. Its epistemology leans towards justified true belief, while ML deals constantly with uncertainty and approximation.
      *   **Scale & Automation:** The concepts are not designed for the scale and automated nature of ML systems generating millions of inferences.

  **Conclusion:** The Nyāya framework maps surprisingly well to core ML evaluation concepts like trusted sources, zero-shot generalization, and defect detection. The critical residue lies in the **default stance towards unverified outputs:** Nyāya's presumption of validity starkly contrasts with ML's "eval-gated knowledge" ethic. Nyāya exposes ML's reliance on *implicit, undefeated presumptions* within its own evaluation infrastructure, suggesting a need for formalizing defeasible trust chains. Conversely, ML highlights Nyāya's lack of tools for systematized skepticism, probabilistic uncertainty, and large-scale adversarial testing. The residue points not to a deficiency in either, but to complementary perspectives on warranted belief – one focused on the default validity of cognition processes, the other on rigorous pre-deployment validation of outputs.
