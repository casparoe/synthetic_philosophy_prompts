prompt: |-
  My cousin works in ML and gave me his take on the frame problem over dinner: "It's basically the old robotics puzzle of how a system knows which facts change when it does something. If a robot picks up a block, it has to work out that the block's location changed but its colour didn't, and in the sixties this needed zillions of axioms spelling out everything that stays the same, which obviously didn't scale. Dennett had that example of the robot pulling a cart out of a room that has to keep checking stuff like whether pulling the cart changes the cart's colour, until it just sits there forever. The technical version got sorted in the eighties with default assumptions about persistence, and honestly the rest was mostly Fodor making it sound mystical. With big neural nets now it's just a compute question." It sounded plausible at the time but the "basically solved" bit felt a bit quick to me. How much of this would someone who actually works on the frame problem accept, what's a subtle conflation or two that's doing sneaky work, and does his "just compute now" conclusion follow from the parts of his summary that are actually true? Also, if the technical and the philosophical versions of the problem have come apart over the years, which one is he even talking about, and does it matter for whether large language models touch it?
reasoning: |-
  Okay, let me start by unpacking the user's query. Their cousin in ML gave a summary of the frame problem, claiming it's mostly solved with default persistence and now just a compute issue with neural nets. The user is skeptical about the "basically solved" part and wants to know how accurate that is. They also ask about conflations in the argument and whether large language models touch the frame problem.

  First, I need to break down the cousin's points. He mentioned the robotics puzzle, Dennett's cart example, the 80s solution with default assumptions, and Fodor making it mystical. Then he concludes it's just about compute now with neural nets. The user's main concerns are the oversimplification and the technical vs. philosophical divide.

  I recall that the frame problem originated in AI with McCarthy and Hayes. The technical side deals with efficiently representing state changes without listing every unchanged fact. Solutions like successor state axioms in situation calculus or STRIPS operators did address this. So, the cousin is right about that part being manageable now. But the user is right to sense that "solved" might be too strong. Those formal methods work in constrained environments but don't scale to open-world scenarios.

  Then there's Dennett's version, which is more about relevance. How does an agent determine what to consider when acting? The cart example shows the robot stuck checking irrelevant details. This isn't just about persistence but about epistemic relevance. The cousin conflates these two by saying default persistence solves the cart problem. But default logic handles persistence, not relevance. That's a key conflation.

  Fodor's take elevates it to a philosophical problem of how minds handle relevance, which remains unsolved. The cousin dismisses this as Fodor making it mystical, but that overlooks the deeper issue. So here, the cousin oversimplifies by reducing the frame problem to just the technical aspect.

  When it comes to neural nets, the cousin sees it as a compute problem. Modern deep learning can learn correlations and predict state changes from data, bypassing explicit axioms. But does this solve the relevance problem? Not really. LLMs might handle some aspects statistically, but they lack the ability to reason about relevance in novel situations. They can generate plausible next states based on patterns but not deeply understand causality or irrelevance.

  The user also asks if LLMs touch the frame problem. Technically, they handle state changes in text, but it's surface-level. They don't grapple with the philosophical relevance issue. So while they mitigate the representational challenge, the core problem of relevance remains.

  The user's deeper need might be understanding the gap between current AI capabilities and true reasoning. They might be interested in how much of cognition is still beyond AI's reach, especially in contextual understanding. Highlighting the unresolved relevance problem addresses that.

  In summary, the cousin is correct on the technical solution for persistence but conflates it with relevance. The philosophical problem persists, and neural nets don't solve it—they bypass representation but not the underlying challenge of relevance. The user's skepticism is valid, and the answer clarifies where the real difficulties lie.
answer: |-
  That's an impressively coherent dinner-table summary from your cousin! He captures key aspects but oversimplifies in ways common when compressing complex ideas. Here's a breakdown for someone working on the frame problem (FP):

  **What He Gets Right:**
  1.  **The Core Issue:** He accurately identifies the heart of the *technical* FP: efficiently specifying which fluents (properties that can change) *don't* change when an action is performed, avoiding the need for "zillions of axioms" for each action-fluent pair.
  2.  **The Dennett Cartoon:** The "robot pulling the cart" example (from Dennett's "Cognitive Wheels") perfectly illustrates the *naive* approach's catastrophic failure due to irrelevant reasoning about persistence (color, etc.).
  3.  **The 80s "Solution":** He correctly points to the development of formalisms in the 80s (like Ray Reiter's **Default Logic**, Ernest Davis's **Persistence Defaults**, Shoham's **Chronological Minimization**, and crucially, the **Successor State Axioms** in Situation Calculus formalized by Levesque, Pirri, Reiter, and others). These allowed systems to assume "things stay the same unless the action *explicitly* changes them" by default. This *did* solve the representational explosion problem *for formal logical systems operating in well-defined, closed domains*.
  4.  **Fodor's Amplification:** He's right that Jerry Fodor elevated the FP into a profound philosophical problem about the nature of cognition, representation, and relevance, arguing it was fundamentally unsolvable for computational systems aspiring to general intelligence.

  **Subtle Conflations Doing Sneaky Work:**
  1.  **Conflating the Technical FP with Dennett's Relevance Problem:** This is the **biggest conflation**. The 80s solutions solved the *representational* problem of *persistence* (knowing what *stays the same*). Dennett's robot, however, also highlights the **Relevance Problem**: How does the robot *know* that color is irrelevant *in the first place*? How does it decide *what* needs to be checked? The 80s solutions *assume* a predefined, fixed set of fluents and actions. They don't solve how an agent *discovers* or *determines* what is relevant/irrelevant in an open-ended world. This is the much deeper, unsolved problem often *associated* with the FP but distinct from the core technical persistence issue.
  2.  **Conflating "Solved" Scope:** Saying the technical FP was "sorted" in the 80s is true *only* for:
      *   Logic-based AI systems.
      *   Operating in carefully circumscribed, formal domains (e.g., blocks world).
      *   With a *predefined, fixed ontology* of fluents and actions.
      This solution doesn't scale gracefully to messy real-world robotics or open-ended general intelligence where the ontology is unknown or dynamic, and relevance is context-dependent.
  3.  **Conflating "Compute" with "Understanding":** His "just a compute question" for neural nets implies that raw scale overcomes the underlying representational/reasoning challenge. While NNs bypass *explicit* frame axioms, they don't necessarily *solve* the core issue; they *sidestep* it statistically. More compute gives better statistical predictions, but doesn't guarantee *robust, causal understanding* of persistence or relevance.

  **The "Just Compute Now" Conclusion:**
  *   **Does it follow? Partially, but misleadingly.**
  *   **For the *Narrow Technical (Persistence) FP*:** Yes, neural nets (especially large ones) *do* effectively mitigate this. They learn statistical patterns from vast data. When predicting the next state (e.g., "block location after pickup"), they implicitly learn that color usually doesn't change without needing explicit axioms. The sheer volume of data and compute allows them to approximate persistence assumptions remarkably well *for the patterns they've seen*. This is a practical victory *over the specific representational hurdle* of the 60s/70s.
  *   **For the *Broader Relevance Problem*:** **No.** This is where "just compute" falls short. LLMs/NNs:
      *   Learn statistical correlations, not necessarily causal models. They can be fooled by spurious correlations or irrelevant details presented in-context.
      *   Lack robust, *explicit* mechanisms for determining relevance in novel situations. Their "relevance" is based on learned patterns, not principled reasoning about causality or irrelevance. They can easily generate irrelevant continuations or get distracted by surface features (like Dennett's robot worrying about color, if the training data somehow linked cart-pulling and color changes oddly).
      *   Struggle with systematic generalization and out-of-distribution reasoning. If a truly novel action or property combination arises, they lack the grounding to robustly infer what changes and what doesn't *based on understanding*.
  *   **Conclusion on Compute:** More compute/data allows NNs to *approximate solutions* to the persistence aspect of the FP *empirically* across a vast range of common scenarios, making it a non-issue *in practice* for many applications. It does **not** solve the deeper philosophical Relevance Problem inherent in Dennett's cartoon or Fodor's challenge. The NN handles irrelevance statistically, not by reasoning about it.

  **Which Frame Problem & Does it Matter for LLMs?**
  1.  **He's Primarily Talking About:** The **Technical Frame Problem (Persistence Version)**. His description of the robot/block example, the "zillions of axioms," and the 80s solutions squarely targets the challenge of efficiently representing state persistence under actions.
  2.  **The Split:** Yes, they have diverged:
      *   **Technical FP (Persistence):** Largely "solved" for formal systems and effectively mitigated for statistical systems via scale/data. An *engineering* challenge.
      *   **Philosophical FP (Relevance/General Intelligence):** Remains a profound challenge. How do intelligent systems *determine* relevance, project causal models, avoid irrelevant inferences, and adapt their ontology? This is seen as core to cognition and not fully addressed by current AI.
  3.  **Does it Matter for LLMs? Absolutely.**
      *   **Touching the Technical (Persistence) FP:** Yes, directly. LLMs constantly predict state changes (next word, next event in a story, consequence of an action described in text). Their ability to do this plausibly without explicitly enumerating unchanged facts demonstrates how scale/data mitigates the *representational persistence* issue. They are a prime example of the "compute" approach working *in practice* for this aspect.
      *   **Touching the Philosophical (Relevance) FP:** **Profoundly, and they highlight its ongoing difficulty.** LLMs:
          *   Can generate irrelevant or nonsensical outputs, showing failure to grasp true relevance.
          *   Are highly sensitive to context and phrasing, demonstrating context-dependent (and sometimes brittle) notions of relevance.
          *   Lack robust mechanisms to *explain why* something is irrelevant.
          *   Struggle with tasks requiring explicit reasoning over irrelevance or counterfactuals. Dennett's robot's paralysis is analogous to an LLM getting stuck in a loop of generating irrelevant possibilities if prompted poorly.
          *   **In essence:** LLMs demonstrate that massive compute/data *can* overcome the *syntactic* representation problem of persistence (the old FP), but they simultaneously *expose* the immense difficulty of the *semantic* problem of genuine relevance and understanding (the enduring FP).

  **In Summary for the Practitioner:**
  *   **Agree:** The *specific representational explosion problem* (needing axioms for every unchanged fluent) was solved technically in the 80s for logic-based AI and is effectively bypassed/mitigated by the statistical learning of large NNs/LLMs. Fodor did make it sound more mystical than the engineering solution required.
  *   **Disagree/Oversimplification:** Conflating the solved persistence issue with the unsolved relevance problem (Dennett's core point). The 80s solutions were domain-limited. "Just compute" solves the persistence representation *empirically* for common cases but doesn't solve relevance or provide robust, causal understanding.
  *   **LLMs:** They are a powerful demonstration of how scale/data addresses the *old* technical FP (persistence representation). However, they vividly illustrate why the *broader* relevance problem (the philosophical FP) remains a central, unsolved challenge for artificial general intelligence. They touch both: they bypass one and stumble over the other.
