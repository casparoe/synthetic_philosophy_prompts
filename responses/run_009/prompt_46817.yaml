prompt: |-
  You are a social epistemologist with a special interest in the structural features of communities that distort their members' beliefs, and you have some experience advising journalists on how to classify the communities they cover. Please think carefully and at length before answering: begin with a short brainstorm of two or three candidate principles, test each against my cases, and only then commit to a recommendation. Do not pad the answer with general background on misinformation; I want the conceptual work done on my specific pattern of verdicts.

  I am a journalist covering science and ideas, and I have become interested in a distinction I recently encountered (drawn by the philosopher C. Thi Nguyen) between epistemic bubbles and echo chambers. As I understand it: an epistemic bubble is a community that simply fails to include certain relevant voices — members never hear them, but nothing in the community's structure pre-empts trust in them, so if a missing voice shows up, members can be persuaded. An echo chamber is a community whose members have been equipped in advance with a story that discredits outside voices — so when contrary evidence arrives, it is already explained away. The distinction matters to my beat because the cures differ: bubbles are cured by exposure, while exposing an echo-chamber member to the contrary view can even strengthen their commitment.

  I have been applying the distinction by gut, community by community, and I want to know whether my verdicts add up to a principle. Here are my calls, on cases I have covered or inhabited:

  1. My own newsroom in the last election cycle. We were all confident of the outcome; when the result broke the other way, several colleagues' first reaction was that the pollsters must have been in the tank. Most dropped it within a week. I want to call this a bubble with a brief echo-chamber spasm, but I am not sure the categories allow anything so episodic.
  2. A parents' Facebook group for a rare pediatric condition: warm, mutually supportive, and almost certainly unaware that a whole adjacent literature exists on the off-label treatment they discuss. I believe that if someone posted a critical study, they would read it anxiously and argue about it on the merits. Bubble.
  3. A flat-earth-adjacent community I reported on for a feature. Members are explicitly taught that NASA and the media lie as a matter of course, so any photograph of the curved earth is greeted as a fabrication. Echo chamber, textbook.
  4. The formal-epistemology corner of academic philosophy. Everyone knows the critiques of mathematizing belief; the standard response, which I have heard at three conferences, is that the critics do not understand the formalism. I resist calling this an echo chamber — these people demonstrably read their critics — but structurally it looks uncomfortably like case 3 with better manners.
  5. A homeopathy forum. Any negative trial is Big Pharma protecting its revenue; the discrediting story is taught to newcomers in a pinned post. Echo chamber.
  6. A rationalist forum I have lurked in for years. Every major critique of the movement has a long, careful, point-by-point rebuttal thread. My instinct says not an echo chamber — they engage! — but a hostile reader would say those rebuttal threads function exactly as the pinned post in case 5 does: they exist to be linked at newcomers. This is my hardest case.
  7. A wine circle whose members dismiss blind-tasting experiments showing that experts cannot reliably rank expensive wines, on the grounds that the experimenters are disgruntled sorts who cannot afford good taste. The discrediting story is right there, but nothing of consequence rides on it, and putting it in the same category as case 3 feels wrong to me — which makes me suspect that some of my verdicts are tracking something other than the bubble/echo-chamber distinction, perhaps stakes, or who gets hurt.
  8. A climate-science desk I sat near early in my career. The desk never read skeptical blogs, not because anyone discredited them but because no one had the time; on the rare occasion a skeptical argument reached them, they took it apart on the merits. Bubble, and a benign one.

  My tentative principle is this: a community is an echo chamber if and only if it possesses a discrediting story that operates in advance of contact with the outside voice; a bubble if and only if it merely lacks contact. But this principle appears to overturn some of my own verdicts: it classes cases 4 and 6 as echo chambers, which I resisted, and I do not know what to do with case 7, where the discrediting story is plainly present but the label feels inflated. So here is what I am asking of you. Is there a principle that captures my verdicts, or close to all of them? If not, which of my verdicts must go, and what is the honest statement of the residual tension? And what does the surviving principle predict about communities I have not described — for instance, a conspiracy community whose central claim later turns out to be true, or a scientific specialty that is eventually vindicated against the mainstream that dismissed it? One further requirement: I would like the principle to classify communities by their structure rather than by the outcome of their beliefs; if that cannot be done, tell me plainly that it cannot.

  Please answer in two parts. First, working notes: three or four sentences per candidate principle, no more. Second, a JSON object, with nothing after it, conforming to the following schema:

  {
    "candidates": [
      {
        "name": "short label",
        "statement": "one or two sentences",
        "fatal_case": "which of my eight cases it cannot accommodate, or 'none'"
      }
    ],
    "recommended_principle": {
      "statement": "the full principle, precise enough to decide new cases",
