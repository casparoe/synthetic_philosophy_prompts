answer: |-
  Your hypothesis is sharp and perceptive—it captures the core impasse far better than the surface debate about "utility comparisons." Let's dissect this systematically, using your framework while refining it slightly based on the dynamics you describe.

  ### Diagnosis: Beyond Utility, Into the Metaphysics of Measurement
  The disagreement isn't *fundamentally* about utility; it's a **clash of measurement ontologies** amplified by economics' unresolved positivist legacy. Both sides agree on behavioral facts (preferences, choices) but diverge on what constitutes a "measurable quantity." This manifests as:

  1.  **Operationalism (Robbinsian Side):**
      *   **Core Tenet:** A quantity exists *only if* defined by a unique, non-arbitrary operational procedure yielding intersubjectively invariant cardinal values.
      *   **View on Utility:** Since no unique procedure exists to cardinally measure "utils" across individuals (only ordinal rankings within one person are observable), interpersonal utility is not a measurable quantity. Comparisons are *literally meaningless*—like asking if blue is "heavier" than joy.
      *   **Pain Scale/QALY View:** These are useful social *conventions* or *indexes*, akin to calibrating a thermometer using water's expansion instead of alcohol's. They create shared scales for coordination, but don't reveal a pre-existing "pain magnitude" or "welfare magnitude" independent of the chosen convention. Path-dependence proves this.

  2.  **Invariantism (Utilitarian Side):**
      *   **Core Tenet:** A quantity exists if our judgments about *relationships* (greater than, less than, equal to) are *invariant* under all admissible transformations of the measurement scale. The "fact" is the invariant relational structure, not the specific numbers.
      *   **View on Utility:** Widespread, stable, and revisable practices (triage, QALYs, even Harsanyi) reveal an underlying relational structure of welfare comparisons. While the zero and unit are conventional, the *ordinal comparisons across individuals* (or cardinal ratios under certain assumptions) can be invariant facts, grounded in behavior (extended preferences) or experience (pain reports).
      *   **Pain Scale/QALY View:** These *are* measurement instruments. Their "working" (including detecting failures like inconsistent dosing or paradoxical QALY rankings) demonstrates they are tracking *something* real, even if imperfectly. Invariance across reasonable elicitation methods (when achieved) strengthens this.

  **The Nature of the Dispute:**
  *   **Primarily Methodological/Metaphysical (Not Verbal):** It's a substantive disagreement about the *conditions for attributing reality to a quantitative property*. Is uniqueness of procedure essential (Operationalism), or is invariance of relationships sufficient (Invariantism)? This is a deep, unresolved question in philosophy of science (cf. debates about temperature pre-thermodynamics, psychological measurement).
  *   **Exacerbated by Economics' History:** Logical positivism imported operationalism (Robbins was heavily influenced by this). Later developments (revealed preference, social choice) grappled with its limitations but never fully reconciled with alternative measurement theories (e.g., representational theory). The field conflated "meaningful for science" with "operationally defined."
  *   **Two Projects Sharing Vocabulary:** Welfare economics inherently mixes:
      1.  **Positive Measurement Question:** Can we empirically discern interpersonally invariant welfare *relationships*?
      2.  **Normative Weighting Question:** How *should* we weigh different individuals' welfare in social decisions?
      Operationalists argue that without (1), (2) is arbitrary. Invariantists argue that (1) *is* achievable (via extended preferences, etc.), grounding (2). The vocabulary ("utility comparison") blurs these.

  ### Partial Comparability: Weakening or Shifting?
  Sen's partial comparability doesn't resolve the ontological dispute; it **sidesteps it pragmatically by changing the normative question:**

  1.  **What it Achieves:** It acknowledges the operationalist critique—full cardinal comparability *is* arbitrary. Instead, it asks: *Given* we must make social choices (which inherently involve implicit weighting), what constraints can we impose to make those choices *less arbitrary* or more robust?
  2.  **How it Works:** By restricting the domain of admissible utility functions (e.g., requiring ratios to lie within bounds, or only allowing affine transformations with bounded slope), it defines a *set* of possible social orderings. If the set yields a *partial ordering* (some policies are better than others across *all* admissible scales), we have a robust normative conclusion *without needing a unique cardinal measure*.
  3.  **Diagnosis:** This is a **genuine weakening of the meaningfulness standard** *for normative social choice*, not a solution to the measurement question. It shifts from "Is this comparison *true*?" to "Is this social choice *robust* to uncertainty about the precise interpersonal comparisons?" It survives because it addresses the *practical need* for welfare-based policy while respecting the operationalist critique of uniqueness. It doesn't prove invariantists right; it shows normative conclusions can sometimes withstand operationalist skepticism.

  ### What Progress Could Look Like (Beyond Stalemate)
  True resolution of the ontology is unlikely, but progress is possible by reframing the debate and seeking empirical/conceptual traction:

  1.  **Reframing the Invariance Question for Robbinsians:**
      *   Focus on **Behavioral/Neuroscientific Convergence:** Could evidence show that different "conventional" methods (e.g., diverse extended preference elicitations, pain reports combined with neuroimaging correlates, choice under risk patterns) *converge* on the *same ordinal interpersonal rankings* (e.g., Patient A is worse off than Patient B) across diverse procedures? This wouldn't satisfy the uniqueness demand, but could challenge the "purely arbitrary convention" view by showing *robust relational invariance*. Your pain protocol example hints at this – does it *work* because it taps into *something* shared, or purely by fiat? Evidence of cross-method consistency would be compelling.
      *   **Anchor Candidates:** Propose potential "anchors" analogous to thermodynamic principles. Possibilities:
          *   **Minimal Welfare/Extreme Deprivation:** Is there a behavioral/experiential state so extreme (e.g., unbearable agony, absolute starvation) that *any* reasonable scale must assign it uniquely low welfare, facilitating ratio comparisons (e.g., saving one person from torture might outweigh many minor headaches)? This requires defining "reasonable scale."
          *   **Symmetry/Aggregation Principles:** Could constraints derived from logical consistency in aggregation (e.g., under risk, anonymity, priority to the worse off) restrict admissible scales *enough* to yield invariant *comparative* judgments? Harsanyi tried this; finding new, less-question-begging constraints is key.

  2.  **Constraining Extended Preferences:**
      *   **Empirical Psychology:** Instead of treating extended preferences as purely hypothetical, design experiments to elicit them robustly. Do individuals exhibit *stable, coherent* extended preferences across contexts? Do different elicitation methods converge? Are they consistent with real-world moral judgments? Finding *empirical regularities* would make them less arbitrary and more like discovered facts than legislated conventions. Failure would bolster Robbinsians.
      *   **Phenomenological Constraints:** Can extended preferences be anchored in reports of *experienced empathy* or simulated experience? Could neuroscience identify neural correlates of "taking another's perspective" that predict consistent extended rankings? This seeks an experiential anchor.

  3.  **A Forcing Case:**
      *   **The Case of Radically Divergent Scales:** Imagine two different "extended preference" elicitation methods, both internally coherent and consistent with individual preferences, but yielding *opposite* interpersonal comparisons in critical cases (e.g., Method A: Chronic pain patient's loss > 1000 minor headaches; Method B: Opposite). If no empirical, normative, or experiential grounds exist to favor one method, Robbinsians win: comparisons are conventional. If robust grounds *do* exist (e.g., Method B violates empathy reports, or leads to pathological social choices), invariantists gain ground. Finding or constructing such a case is crucial.
      *   **Failure of Convention:** Show a scenario where the "convention that works" (like your pain scale) demonstrably *fails* in a way that reveals it *wasn't* tracking anything real (e.g., leads to systematic mistreatment detectable only by an alternative, non-conventional measure). This would support invariantism. Conversely, showing that *any* coherent scale "works" equally well supports operationalism.

  **Why the Debate Continues:**
  It persists because both positions reflect deep intuitions:
  *   **Operationalist Intuition:** Science demands rigor; attributing reality to unanchored numbers is mysticism.
  *   **Invariantist Intuition:** Denying the reality of comparative welfare flies in the face of ethical practice and lived experience.
  *   **The Stakes:** Welfare economics' legitimacy hinges on this. Can it be a science of well-being, or just of preference aggregation?

  **Conclusion:**
  Your hypothesis is largely correct. The core is a clash between **Operationalist Uniqueness** and **Invariantist Relationalism** as criteria for a quantity "existing." Progress lies not in rehashing "utility," but in:
  1.  **Empirically probing** whether diverse methods converge on invariant interpersonal *relationships*.
  2.  **Conceptually exploring** potential anchors (minima, empathy, aggregation constraints).
  3.  **Pragmatically embracing** that normative welfare economics (via partial comparability) can proceed *without* resolving the ontology, focusing on robustness under uncertainty.
  4.  **Seeking forcing cases** where the conventionality claim demonstrably succeeds or fails.

  The debate continues because welfare economics sits precariously at the intersection of science, ethics, and measurement theory—an unstable but profoundly important place. Your frustration is the engine of potential progress; focus it on designing the experiments or conceptual arguments that could finally provide traction.
