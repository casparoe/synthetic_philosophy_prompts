              Player3: B -> 2*2 + (11-1)=4+10=14   [nB=2? because player3 and player4]
              Player4: B -> 2*2+10=4+10=14

          But wait, player3 is the committer and they chose B? So nB is 2 (player3 and player4) and nA is 2 (player1 and player2). 

          Then for player3: they are B, so they get 2*(number of B) + (11-t_3)=2*2 + (11-1)=4+10=14.

          Total: 12+12+14+14=52.

          Without committer and they split 2-2: total=56.

          So the committer outcome (52) is worse than the no-committer split (56).

     Therefore, using a multiplier of 2 for coordination might work.

     We set:
          Payoff for A: 2 * (number of A) + t_i
          Payoff for B: 2 * (number of B) + (11 - t_i)

     Now, we want to see the incentive to commit:

          Consider a player with a high type (say t_i=10). 
          If they commit to A, then they lock in A. The other players will choose A? 
              For any other player j:
                  If they choose A: 2*(4) + t_j = 8+t_j
                  If they choose B: 2*(1) + (11-t_j) = 2+11-t_j =13-t_j
                  Now, 8+t_j vs 13-t_j -> 2*t_j -5. 
                  If t_j>=3, then 8+t_j>=13-t_j? 
                  Actually, 8+t_j - (13-t_j) = 2*t_j -5. 
                  So if t_j>=3, then they prefer A? 

          But note: the other players might have t_j=1 or 2? Then they might choose B? 

          Example: if the other players have t_j=1, then they get 8+1=9 for A and 13-1=12 for B -> choose B.

          So the outcome might not be full coordination? 

          We need to ensure that the committer can force full coordination? 

          We can make the coordination benefit even lower? 

          Alternatively, we can change the rules: the committer's action becomes the only action allowed? 

          But that's not realistic.

     After reconsideration, let's make the coordination benefit larger? But then the split outcome becomes less likely? 

     Alternatively, we can have a different game structure.

     Given time, let's stick with the current design and accept that sometimes the committer doesn't get full coordination? 

     But then the committer's advantage is not guaranteed? 

     How about we change the payoff to be:

          P_i(A) = 10 * (number of A) + t_i   [if the player is in the A group]
          P_i(B) = 10 * (number of B) + (11-t_i) [if in B group]

          But then the split outcome is 10*2 for each player plus type bonus -> 20+type bonus, which might be high? 

          And the full coordination on the committer's action: 40+type bonus.

          But if the committer's action is not the one the player prefers, they get 40 + a low type bonus? 

          And if they had split, they would get 20+high type bonus? 

          We want the group total to be higher in the split outcome? 

          Example: 
              Two players with t_i=10, two with t_i=1.
              Full coordination on A: 
                  High types: 40+10=50
                  Low types: 40+1=41
                  Total: 50+50+41+41=182
              Split:
                  High types: 20+10=30
                  Low types: 20+10=30   [because for B, they get 20 + (11-1)=20+10=30]
                  Total: 30+30+30+30=120 -> lower.

          So that doesn't work.

     Let me try with coordination multiplier=3:

          Full coordination on A: high type: 3*4+10=22, low type:12+1=13 -> total 22+22+13+13=70.
          Split: high type: 3*2+10=16, low type: 3*2+10=16 -> total 16*4=64.

          Still not.

     What if we make the type bonus more important? 

          P_i(A) = 2 * (number of A) + 5 * t_i
          P_i(B) = 2 * (number of B) + 5 * (11-t_i)

          Then in full coordination on A:
              High type: 2*4 +5*10=8+50=58
              Low type: 8+5*1=13
              Total: 58+58+13+13=142

          Split:
              High type: 2*2+50=4+50=54
              Low type: 2*2+5*10=4+50=54
              Total: 54*4=216 -> higher.

          In this case, the group is better off in the split outcome.

          And the committer outcome might be worse.

     So let's use:

          P_i(A) = 2 * (number of A) + 5 * t_i
          P_i(B) = 2 * (number of B) + 5 * (11-t_i)

     Now, we need to see the incentive to commit.

     For a player with high type (t_i=10):
          If they commit to A, then the other players might not follow? 
          For player j with t_j=10: if they choose A, they get 2*(nA)+50. If choose B, 2*(nB)+5*(11-10)=2*nB+5.
          If they expect all others to choose A, then nA=4, so they get 8+50=58 for A.
          For B: if they are the only B, nB=1, so 2+5=7. So they choose A.

          For player j with t_j=1: 
              A: 2*(nA)+5*1 = 2*4+5=13
              B: 2*(nB)+5*10 = 2*1+50=52 -> so they choose B.

          So if there is a low type player, they might choose B, breaking the coordination.

          Then the committer might not get the full coordination benefit.

     This is getting complicated.

     Given the time, I propose to use the following simpler approach:

     We will use the first payoff function with coordination multiplier=5, and then we will adjust the rules to ensure that the committer's action is followed. 

     How? We can say that in the negotiation phase, if there is a committer, then the other players are not allowed to choose an action that is different from the committer's action? 

     This is heavy-handed, but it models the idea that the committer has set a focal point that is so strong that it's the only option. 

     Then the tradeoff is:

          By committing, you get to set the action for the entire group, but you do so without knowing your type. 
          By waiting, you get to see your type, but then you have to follow whatever the committer set.

     In this case, the payoff for a player who waits is:

          They get: 5*4 + (their type if the committer chose A, or 11-type if committer chose B)

     And the committer gets: 5*4 + (their type if they chose A, or 11-type if they chose B) [but they chose without knowing]

     Example: 
          Committer chooses A. Then every player (including the committer) gets 20 + their own type if they are an A-liker, but what if they are a B-liker? 
          But note: if the committer chooses A, then the entire group does A, so every player must use the A formula? 

          So for a player i, if the committer chose A: 
              payoff = 20 + t_i

          If the committer chose B:
              payoff = 20 + (11-t_i)

     Then the committer, when they commit, doesn't know t_i, so they choose randomly between A and B? 

     But we want them to have an incentive to commit early to be the one who gets to choose. 

     Consider two players: player1 and player2. They both have an incentive to commit because if they commit, they get to set the action and then get 20 plus either their type or 11-type, but they have to choose without knowing. 
     Meanwhile, if they wait, they are stuck with whatever the committer chooses, and they get 20 plus (either their type or 11-type) accordingly.

     The catch: if no one commits, then the group uses a different rule: we allow the players to choose and then they get the coordination payoff based on the actual choices. 

     But in the no-committer case, we don't force them to follow a single action? 

     So rules:

        - If there is a committer, then every player (including the committer) must take the committer's action.
        - If there is no committer, then each player chooses their action independently, and the payoff is based on the actual number of A and B and their type.

     In the no-committer case, they might not achieve full coordination? 

     We design the no-committer payoff to be higher in expectation? 

     For example, in the no-committer case, we can allow the players to communicate and then choose? But then it's cooperative.

     Alternatively, we can have a different mechanism: without a committer, the players are not forced to coordinate, but they might end up with a higher type bonus and some coordination bonus.

     Given the complexity, I think for the classroom we can simplify the no-committer outcome to be: each player gets their type bonus plus a fixed amount that is higher than what they would get in the committer case? 

     But that is not satisfactory.

     Another idea: in the no-committer case, we let them play a coordination game that always results in the efficient outcome (somehow) and has higher expected payoff.

     Given time constraints, let's assume that in the no-committer case, the group is able to achieve an outcome that has total payoff higher than in the committer case, and that is common knowledge.

     But we want it to be that the committer gets a higher individual payoff than if they wait? 

     We can set:

          If there is a committer, then every player gets: 
              20 + [their type if the action is A, or (11-type) if the action is B]

          In the no-committer case, each player gets: 
              on average, 25 + (something) -> but we need to define.

     Without a committer, we can have a different game that yields a higher expected payoff.

     Given the practical classroom setting, I propose to use a predefined bonus for the no-committer case.

     This is not ideal, but let's try:

          If there is a committer, then player i's payoff = 20 + ( if the committer chose A: t_i; if B: 11-t_i )

          If there is no committer, then player i's payoff = 25 + max(t_i, 11-t_i) 

     Why 25? It should be higher than the 20 plus the expected type bonus.

     The expected type bonus if the committer chooses randomly: 
          E[ either t_i or 11-t_i ] = 
             with probability 1/2: t_i, with 1/2: 11-t_i.
          E = (t_i + 11-t_i)/2 = 11/2 = 5.5
          So expected payoff in committer case: 20+5.5=25.5

     In the no-committer case: 25 + max(t_i, 11-t_i)

     Note: max(t_i, 11-t_i) is at least 5.5 (when t_i=5.5) and at most 10. 
          So expected value of max(t_i,11-t_i) = ? 
          Let X = t_i ~ uniform[1,10] (discrete uniform)
          P(X>=6) = 5/10=0.5, then max = X, and if X<6, then max=11-X.
          We can compute: 
              For t_i in {1,2,3,4,5}: max=11-t_i -> 10,9,8,7,6
              For t_i in {6,7,8,9,10}: max=t_i -> 6,7,8,9,10
          So the distribution of max: 
              1->10, 2->9, 3->8, 4->7, 5->6, 6->6, 7->7, 8->8, 9->9, 10->10.
          The values: 10,9,8,7,6,6,7,8,9,10 -> average = (10+9+8+7+6+6+7+8+9+10)/10 = 80/10=8.

          So expected payoff in no-committer case: 25+8=33.

     Therefore, on average, the no-committer case yields 33, while the committer case yields 25.5. So the group is better off without a committer.

     But individually, why would a player want to commit? 

          If a player commits, they get to choose the action. They will choose the action that is best for them, but without knowing their type, it's random. They get 20 + [t_i if they choose A, or 11-t_i if they choose B]. 
          But note: they choose the action without knowing their type. So they might choose A or B arbitrarily. 

          However, if they wait, then if there is a committer, they get 20 + ( either t_i or 11-t_i ) depending on the committer's choice. 
          If there is no committer, they get 25+max(t_i,11-t_i).

          The catch: if they commit, they become the committer and get to choose, but they might have chosen the wrong action for themselves. 

          But also, by committing, they force the group into the committer outcome, which is worse for the group.

     The incentive to commit: 

          A player might reason: if I commit, I at least get to choose the action, and then I will get either t_i or 11-t_i, whichever I chose. But since I don't know my type, I will choose randomly, so I expect 5.5 from the type bonus, plus 20 = 25.5.

          If I wait, then:
             - If someone else commits, I get 20 plus either t_i or 11-t_i (depending on their choice), which has expected value 20+5.5=25.5.
             - If no one commits, I get 25+max(t_i,11-t_i) = on average 33.

          So waiting has an expected value of: 
              P(someone else commits)*25.5 + (1-P(someone else commits))*33

          This is at least 25.5, and if there is a chance that no one else commits, then strictly greater.

          So why would anyone commit? 

          Because if no one commits, you get 33, but if you are the only one who might commit, then by committing you get 25.5, which is better than if you wait and then see that someone else commits (25.5) but worse than if no one commits (33). 

          But note: if you commit, you also might prevent the no-committer outcome.

          This is not creating a race.

     We need that being the committer gives you a bonus. 

     How about we give the committer an extra bonus? 

          In the committer outcome, the committer gets: 30 + [t_i or 11-t_i] 
          The others get: 20 + [t_i or 11-t_i] 

          Then for the committer: expected payoff = 30+5.5=35.5
          For a waiter: 20+5.5=25.5

          In the no-committer case: 25+8=33

          So for a player, if they commit, they get 35.5.
          If they wait and someone else commits, they get 25.5.
          If they wait and no one commits, they get 33.

          So they prefer to commit (35.5) over waiting (which is at most 33) as long as they can be the committer.

          But if everyone rushes to commit, only the first committer gets 35.5, the others become waiters and get 25.5.

          So there is a race to be the first.

     The group outcome with a committer: 
          The committer gets 35.5 on average.
          The three waiters get 25.5 on average.
          Total: 35.5 + 3*25.5 = 35.5+76.5=112.

          In the no-committer case: 4*33=132.

          So the group is better off without a committer.

     This might work.

     Let's set the rule:

          If there is a committer:
              The committer gets: 30 + (t_i if they chose A, or 11-t_i if they chose B)
              The other players get: 20 + (t_i if the committer chose A, or 11-t_i if they chose B)

          If there is no committer:
              Each player gets: 25 + max(t_i, 11-t_i)

     Then the game procedure for a round:

       1. The TA has a deck of cards for private information: numbered 1 to 10, and shuffled.
       2. The commitment phase: 
            - The TA says "start", and then any player who wants to commit can raise their hand.
            - The TA notes the very first player to raise their hand. That player is the committer.
            - If within a fixed time (10 seconds) no one commits, then the round ends with no committer.
            - If there is a committer, that player must immediately choose an action (A or B) without knowing their type.
       3. The TA deals one private information card to each player.
       4. If there is a committer, then:
            - The committer's payoff = 30 + (t_i if they chose A, or 11-t_i if chose B)
            - Each other player's payoff = 20 + (t_i if the committer chose A, or 11-t_i if chose B)
          If there is no committer, then each player's payoff = 25 + max(t_i, 11-t_i)

     We then run several rounds (say 5 rounds) and see if a race develops.

     Debriefing points:

          - In early rounds, players may not commit. Then everyone gets around 33 on average.
          - But then one player might realize: if I commit, I get on average 35.5, which is more than 33.
          - However, if two players try to commit, only the first gets 35.5, the other gets 25.5 (worse than 33).
          - So players are drawn into a race: they want to be the first to commit.

     This captures the essence.

     Now, for the classroom, we can have multiple tables (if 12 students, three tables of 4) and run simultaneously.

     Materials: 
          - For each table: a deck of 40 cards (four suits of 1-10, or just 40 cards with numbers 1 to 10, each appearing 4 times) so that we can have several rounds.
          - Score sheets.

     What will go wrong the first time?
          - students might not understand the rules.
          - The no-committer outcome is very good, so initially no one might commit. Then in the first round, everyone gets around 33.
          - In the second round, one player might commit and get a high payoff (say if their type is 10 and they choose A, they get 30+10=40) while others get 20+t_i (which might be 20+10=30) or less.
          - Then in the next round, everyone might try to commit, leading to one getting 35.5 on average and the others 25.5 on average. They will see that the committer's payoff is good, but the group's average is (35.5+25.5*3)/4 = (35.5+76.5)/4=112/4=28, which is less than 33.
          - So the group is worse off.

     The feature that cannot be reproduced: 
          - In the real commitment race, agents are committing while still computing, and the early commit is made by a dumber version. In this game, the player who commits is not dumber; they are just uninformed. And they are not in the middle of computing; they make a deliberate choice to commit early to grab the bonus. We can explain in debrief that in real agents, the early commit might be made by a faster but less thorough version of the agent's algorithm.

     Extra credit for the pact:
          - In this setup, after a few rounds, students might realize that they are all worse off in the race. Then one player might (quietly) try to make a pact: "let's all wait". 
          - But in the next round, if one player breaks the pact and commits, they get 35.5 on average while the others get 20+5.5=25.5, which is worse than 33. So the pact might break down.

     Therefore, we have a game.

     Let's write the rules for the TA:

     **Game: The Commitment Race**

     **Players**: 4 per table.

     **Materials**: 
        - A deck of cards numbered 1 to 10, at least 40 cards (so 4 of each number).
        - Score sheets for each player.

     **Procedure for one round**:

     1. **Commitment Phase**:
        - The TA shuffles the deck but does not deal yet.
        - TA says: "Start of commitment phase. You may now raise your hand to commit. The first to raise will be the committer. You have 10 seconds."
        - If a player raises their hand within 10 seconds, the TA notes who was first. That player is the committer.
          - The committer must immediately choose either "A" or "B" and tell the TA.
        - If no one raises within 10 seconds, there is no committer.

     2. **Information Revelation**:
        - The TA deals one card to each player face down. 
        - Players look at their card (their private information, a number between 1 and 10).

     3. **Outcome and Payoff**:
        - **If there is a committer**:
            - The committer's payoff = 30 + [their card number if they chose A, or (11 - their card number) if they chose B].
            - For the other players: payoff = 20 + [their card number if the committer chose A, or (11 - their card number) if the committer chose B].
        - **If there is no committer**:
            - Each player's payoff = 25 + max( their card number, 11 - their card number )

     4. **Recording**: 
          - TA asks each player their card and then tells them their payoff for the round.
          - Players record their payoff.

     **Play multiple rounds**: 5 rounds.

     **Debriefing guide**:

        - After the game, ask:
            - "In the first round, what happened? Did anyone commit?"
            - "In later rounds, did you see a change? What caused that change?"
            - "What was the average payoff in the first round? In the last round?"
            - "Did anyone try to make a pact to not commit? Did it work?"
        - Map to the commitment race concept:
            - The first-mover advantage: the committer gets a higher payoff (30 bonus) but at the cost of choosing without information.
            - The value of the foregone information: if they had waited, they would have known their type and in the no-committer case, they could have gotten the higher bonus from max(type, 11-type).
            - The race dynamic: once one person commits and gets a high payoff, others are drawn to try to commit first in the next round, but only one can be first.
            - The group outcome: in the no-committer case, the group does better on average (33) than in the committer case (28 on average per player).

        - Explain the real-world analogy: 
            - Advanced agents might race to commit to a strategy before they have finished gathering information or computing, because the first to commit can set the terms. 
            - But by committing early, they forgo the opportunity to use later information, and the group might be worse off.

     **Prediction of what might go wrong**:
        - In the first round, no one commits -> then they see the no-committer outcome is good.
        - In the second round, one player might commit and get a high payoff (e.g., if they are lucky and their type is high and matches their arbitrary choice).
        - In the third round, multiple players try to commit, leading to one winner and three losers (who get only 25.5 on average, which is less than the no-committer 33). They will see the average drop.
        - The pact: a player might try to organize a pact to not commit. But in the next round, if one player breaks the pact and commits, they get a high payoff and the others get a low payoff. This will likely cause the pact to collapse in the following round.
        - A potential loophole: what if players try to commit and then, after seeing their card, regret it? But the rules say they are locked in. 
        - Another loophole: communication during the commitment phase? The rules should forbid communication until the debrief.

     **Honest note on what the game cannot reproduce**:
        - In real commitment races, the agent is still in the process of computing when it commits, so the early commit is made by a faster, less thorough version of the agent. The classroom game has the player as a unitary agent making a deliberate choice to commit early, not as an agent with partial computation. You will have to explain in the debrief that in advanced AI systems, the agent might have multiple processes running at different speeds, and the fastest might commit first.

     This should fit in 90 minutes: 10 minutes for instructions, 5 rounds * 5 minutes per round = 25 minutes, 10 minutes for score tallying and discussion within groups, then 45 minutes for debrief and lecture.

     Let me know if you have any improvements.
answer: |-
  Below is a complete design for an in-class game that forces participants to experience the commitment race dynamic firsthand. The game uses simple materials, creates a visceral tradeoff between early commitment and information, and naturally leads to a debrief linking gameplay to decision theory concepts.

  ---

  ### **Game Name: "Lock-In Leaders"**  
  *Materials per table (run 3 tables for 12 players):*  
  - 1 deck of playing cards (remove face cards, use A=1, 2-10 as numbers)  
  - 4 colored pens (red/blue/green/black)  
  - 4 commitment tokens (e.g., poker chips)  
  - 1 whiteboard for scoring  
  - Timer (phone or stopwatch)  

  ### **Rules**  
  **Setup (5 min):**  
  1. Split into tables of 4. Each player picks a color (red/blue/green/black).  
  2. Each table gets a card deck, pens, tokens, and a scoreboard.  

  **Round Structure (8 rounds, 5 min/round):**  
  Each round has 3 phases:  

  1. **Commitment Phase (30 seconds):**  
     - TA shuffles the deck but **does not deal cards yet**.  
     - Players decide:  
       - **Commit:** Stand up, slam token on the table, and **immediately** write "A" or "B" on the whiteboard under your color. *Once written, you cannot change it.*  
       - **Wait:** Stay seated.  
     - *Critical:* If multiple players commit simultaneously, TA randomly picks one "first committer." Others who committed get **no reward** and lose their turn.  

  2. **Information Phase (30 seconds):**  
     - TA deals one card face-down to each player.  
     - Players privately view their card (e.g., 7♠ = 7 points).  

  3. **Resolution Phase (1 min):**  
     - **If a first committer exists:**  
       - Their pre-written "A" or "B" becomes the *group action*.  
       - **Committer payoff:** 20 + (their card value).  
       - **Others' payoff:** 10 + (their card value).  
     - **If no one committed:**  
       - Players choose "A" or "B" *after* seeing cards.  
       - **Payoff for all:** 15 + (their card value).  
     - *Record scores on the whiteboard.*  

  **Game End:**  
  - After 8 rounds, sum scores. Highest total wins.  

  ---

  ### **Why This Produces Commitment Races**  
  - **First-mover advantage:** Committers get +20 (vs. +10 for followers).  
  - **Information sacrifice:** Committers lock in "A/B" *before* seeing their card.  
  - **Race incentive:** If you wait, someone else might commit first and force you into a low-payoff follower role.  
  - **Group detriment:**  
    - Expected card value = 5.5.  
    - *Group payoff if all wait:* 15 + 5.5 = 20.5/player.  
    - *Group payoff if one commits:* (20+5.5) + 3×(10+5.5) = 25.5 + 46.5 = 72 (18/player).  
    - *Equilibrium:* Players race to commit, reducing group payoff by 12.5%.  

  ---

  ### **Debrief Guide (20 min)**  
  Link gameplay to theory:  
  1. **"What happened in early rounds?"**  
     - *Likely outcome:* Few commit initially. Highlight a round where everyone waited and got 15+ points.  
     - *Map to theory:* "This is the Pareto-optimal outcome—full information, no commitment costs."  

  2. **"When did races start? Why?"**  
     - *Likely trigger:* A player commits, gets a high card (e.g., 9 → 29 points), others get only 10–15.  
     - *Map to theory:* "First-mover advantage creates a payoff asymmetry. Once one person defects, waiting becomes riskier."  

  3. **"Show of hands: did anyone try a 'no commit' pact? Did it hold?"**  
     - *Map to theory:* "Pacts fail because a *single defector* captures the committer bonus. This mirrors real-world bargaining breakdowns."  

  4. **Key insights:**  
     - **Commitment power:** "The committer sets the group action—but at the cost of deciding blind."  
     - **Information tradeoff:** "Waiting gives you card knowledge but risks losing agency."  
     - **Race inevitability:** "Individually rational moves (racing to commit) lead to collectively worse outcomes."  

  ---

  ### **Predicted Failure Modes & Fixes**  
  - **Loophole #1:** "What if I commit but don’t lock in A/B?"  
     - *Fix:* TA must enforce: "Standing up = writing A/B immediately. No vague commitments."  

  - **Loophole #2:** Collusion via whispering.  
     - *Fix:* Ban talking until the debrief. If violated, nullify the round.  

  - **First-run chaos:** Players may not grasp the speed element, leading to ties.  
     - *Mitigation:* Run a trial round with open cards to demo mechanics.  

  ---

  ### **What the Game Can’t Capture (Debrief Supplement)**  
  - **Incomplete computation:** In real agents, early commitments are made by *less competent sub-agents* still processing information.  
     - *Classroom bridge:* "Here, you committed as a full agent—just uninformed. Imagine if you had to commit mid-calculation, with only 10% of your reasoning done. That’s the self-modification danger in real systems."  

  ---

  ### **Why This Works**  
  - **No upfront theory:** The term "commitment race" is never used pre-game.  
  - **Visceral tradeoff:** Slamming tokens creates tension; seeing scores drop induces regret.  
  - **Pact dynamics:** Players *will* try "all wait" agreements—and watch them crumble when payoffs tempt defectors.  
  - **Scalable:** Materials cost <$10. TAs can run it with minimal training.  

  Run this, and your group will *feel* why Schelling’s "tyranny of the first mover" terrifies decision theorists.
