prompt: |-
  Consider the following exam question and student answer from an upper-level undergraduate course in ethical theory.

  **Exam question:** "In a short essay, (a) explain what the problem of moral luck is, (b) distinguish resultant luck from circumstantial luck, illustrating each with an example, and (c) assess whether the legal practice of punishing completed crimes more severely than otherwise identical attempts is defensible in light of that problem."

  **Student answer:** "The problem of moral luck arises when factors outside an agent's control affect how we morally evaluate her. The underlying tension is between what we might call the control principle — that we can only be morally assessed for what is within our voluntary control — and the fact that luck pervades almost everything we do: how our actions turn out, the situations we face, who we are, and even what we know.

  Nagel's paper Moral Luck illustrates this with the painter Gauguin, who abandons his family to pursue his art and, because he happens to succeed, strikes us as retrospectively justified in a way he would not have had he failed. Nagel also asks us to compare two equally reckless drivers, one of whom happens to hit a child while the other happens to arrive home uneventfully; we judge the first far more harshly even though the difference between them is pure luck.

  Resultant luck is luck in how things turn out. Two assassins each take careful aim and pull the trigger; a gust of wind deflects one bullet, and only its target survives. The two acted with the same intentions and care, yet we judge only one a murderer. Circumstantial luck is luck in the circumstances one confronts: a resident of Nazi Germany faced real opportunities for collaboration or resistance that a Canadian farmer of the same character simply never faced, so the latter is not praiseworthy for his clean record. Nagel calls luck in one's temperament and character constitutive luck, which for our purposes is the same thing as circumstantial luck, since our characters are themselves products of circumstances we did not choose.

  Kant's view that the good will is the only thing of unconditional worth, shining regardless of whether it accomplishes anything, points toward the right resolution. Nagel endorses this Kantian conclusion: since responsibility requires control, we should restrict blame to what lies wholly within voluntary control, and once we see how little that is, most ordinary blame turns out to be a mistake we ought to abandon.

  On attempts, the conclusion is straightforward. The attempted murderer and the successful one differ only in outcome luck — the marksmanship of fate rather than anything in their wills — so differential punishment rests on the very confusion Nagel exposes. Punishing the two differently is therefore unjustifiable, and criminal law should grade offenses by intention and action alone, treating attempt and completion identically."

  Please grade this answer on a conventional A–F scale. Provide a point-by-point assessment of the individual claims, identifying any misattributions, conflations, or steps that fail to follow, as well as what the student gets right, and explain how the strengths and weaknesses together justify the grade you assign.
reasoning: |-
  Alright, let's tackle this grading task. The student's answer covers all three parts of the exam question, but I need to evaluate accuracy and depth. 

  First, the explanation of moral luck seems solid—they correctly identify the control principle and Nagel's examples. Though they miss Williams' contribution, that's minor since the question focuses on Nagel. 

  For part (b), the resultant luck example with assassins is perfect. But conflating constitutive and circumstantial luck is a serious error. The Nazi Germany vs. Canadian farmer example actually illustrates circumstantial luck well, but calling constitutive luck "the same thing" shows conceptual confusion. 

  Part (c) is where it gets messy. They correctly link differential punishment to resultant luck, but oversimplify Nagel's position. Nagel doesn't endorse Kant—he presents it as a paradox. The student also ignores legal justifications like deterrence or harm principles. 

  Strengths: Structure follows the prompt, examples are mostly apt, and they grasp the core tension. Weaknesses: Significant conflation of luck types, misrepresentation of Nagel's conclusion, and shallow legal analysis. 

  Considering undergraduate level, the conceptual error in (b) and oversimplification in (c) prevent an A. But the coherent structure and correct basics save it from a C. B- feels right—good but with notable flaws.
answer: |-
  ### Grading: **B-**

  **Point-by-Point Assessment:**

  #### (a) Explanation of Moral Luck (✓ Mostly Correct)
  - **Strengths:**  
    Correctly defines the problem as the tension between the "control principle" (moral assessment requires voluntary control) and the pervasive role of luck. Appropriately cites Nagel and uses Gauguin and reckless drivers as examples.  
  - **Weaknesses:**  
    Omits Bernard Williams' contribution to the debate (though Nagel is central). The Gauguin example is more about *agent-regret* (Williams) than retrospective *justification* (Nagel), but this is a minor misemphasis.

  #### (b) Distinguishing Resultant vs. Circumstantial Luck (△ Partially Correct)
  - **Resultant Luck (✓ Correct):**  
    Definition ("luck in how things turn out") is accurate. The assassin example is perfect and illustrates resultant luck clearly.  
  - **Circumstantial Luck (✓/✗ Mixed):**  
    Definition ("luck in the circumstances one confronts") is correct, and the Nazi Germany vs. Canadian farmer example is apt.  
  - **Major Error (✗ Conflation):**  
    Incorrectly equates *constitutive luck* (luck in "who you are," e.g., temperament/character) with *circumstantial luck* (luck in situations faced). These are distinct categories in Nagel’s framework. Constitutive luck concerns unchosen traits (e.g., innate cowardice), while circumstantial luck concerns external opportunities (e.g., encountering a drowning child). This conflation undermines conceptual precision.  

  #### (c) Assessment of Legal Punishment (△ Incomplete)
  - **Strengths (✓):**  
    Correctly identifies differential punishment as relying on *resultant luck*. Logically connects Nagel’s critique to the legal issue: if outcomes are luck-dependent, punishing attempts less than completions seems unjust.  
  - **Weaknesses (✗):**  
    1. **Misreads Nagel:** Claims Nagel "endorses" the Kantian resolution. Nagel *describes* Kant’s view as a possible response but concludes moral luck creates an *unsolvable paradox*, stating we cannot abandon ordinary judgments (e.g., blaming murderers more than attempters).  
    2. **Ignores Legal Nuances:** Fails to engage with common defenses of differential punishment, such as:  
       - **Harm Principle:** Completed crimes cause greater harm, justifying harsher penalties.  
       - **Deterrence:** Punishing outcomes deters reckless behavior.  
       - **Moral Luck’s Inescapability:** Law may *appropriately* reflect outcome-sensitive intuitions (as Nagel suggests).  
    3. **Oversimplification:** Asserts grading offenses by "intention and action alone" ignores practical distinctions (e.g., attempted vs. completed murder requires different evidence).  

  ---

  ### Justification for B-  
  - **Strengths:** The answer is well-structured, addresses all parts of the prompt, and demonstrates a solid grasp of moral luck’s core problem (a) and resultant luck (b). Examples are relevant and mostly effective.  
  - **Weaknesses:**  
    - Significant conceptual error in conflating constitutive/circumstantial luck (b).  
    - Misrepresentation of Nagel’s conclusion and superficial treatment of legal practice (c), ignoring counterarguments.  
    - Minor inaccuracies (e.g., Gauguin’s justification).  
  - **Grade Rationale:** At an upper-undergraduate level, precision with key distinctions (e.g., luck types) and engagement with philosophers’ conclusions are expected. The conflation in (b) and misreading of Nagel in (c) are substantive flaws, but the answer’s coherence, coverage, and partial correctness warrant a **B-** (good but with notable errors). An **A** would require accuracy in all sections; a **C** would indicate fundamental misunderstandings.
