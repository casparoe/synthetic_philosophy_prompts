prompt: |-
  In an argument with my housemate about whether some housing thing should be handled federally or by the states, I pulled out the subsidiarity slogan -- decisions should be made at the lowest possible level -- and he immediately shot back that by that logic almost nothing should be federal, and also that I clearly didn't understand what "lowest" means when problems don't come in neat jurisdictional sizes. Now I'm not sure the one-liner I reached for actually does the work I wanted it to do, and I want to take it apart properly before I use it again. It comes up everywhere I read anyway: it's all over EU discourse (their own treaties gesture at decisions being taken as closely as possible to the citizen), it's half the appeal of Swiss cantonal autonomy, and rationalist-adjacent people invoke the same idea when talking about centralization of AI governance or of forum moderation or whatever.

  So: what are the distinct precise claims packed into "decisions should be made at the lowest possible level"? I can see at least a few directions but I want the full menu laid out. Like -- is it a burden-of-assignment principle (start at the lowest level and only move up when you've shown the lower level fails), or a comparative-competence principle (for each decision, put it wherever the balance of expertise, externalities, and preference heterogeneity is best, which sometimes means LOWER isn't right at all)? Or is it a claim about who bears the costs of error -- local decisions concentrate harms on the deciders, federal ones disperse them, so lower is safer even when it's less efficient? Or something almost epistemic, that local knowledge is incommunicable so central planners are structurally blind no matter how smart? And there's the version where it's not about decision quality at all but about exit rights and sorting, the Tiebout-ish thing where having many jurisdictions lets people vote with their feet.

  For each reading, tell me which are trivial, which are substantive and defensible, which are just false, and -- this is the part I actually care about -- which ones would have supported me in the housing argument, where I wanted to block a federal zoning mandate but was fine with the feds setting, say, building codes. Because it feels like "lowest level" is doing pure vibes work in how people (me) actually deploy it, and I'd rather know which precisification I'm signing up for before I say it again. Also flag if any readings quietly presuppose that jurisdictional levels form a nested hierarchy, because he definitely scored points on me with the observation that river-basin-scale problems and neighborhood-scale problems don't stack into one ladder. Lay it out as a list I can actually think against.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had an argument with their housemate about whether housing policies should be handled federally or by the states. The user used the subsidiarity principle, claiming decisions should be made at the lowest possible level. Their housemate countered that this would mean almost nothing is federal and that problems don't neatly fit jurisdictional levels. Now the user is questioning the validity of the slogan and wants a thorough breakdown.

  First, I need to identify all the different interpretations of subsidiarity. The user mentioned several angles: burden-of-assignment, comparative competence, cost distribution, epistemic issues, and Tiebout sorting. I should list each possible reading clearly, assess their validity, and see which support the user's housing argument against federal zoning mandates but allow federal building codes.

  Looking at the burden-of-assignment principle. That's about starting local and moving up only if necessary. The user's housemate might say this is biased toward local control without justifying why. This principle could support the user if they can show local zoning works, but it doesn't inherently block federal mandates without evidence of local failure.

  Next, comparative-competence. This is more about matching the decision level to the problem's scope. For zoning, local preferences matter, so lower levels are better. Building codes might need uniformity for safety, justifying federal involvement. This seems strong for the user's case but requires explaining why zoning is local-specific.

  Then there's the cost-bearing principle. Local decisions mean harms affect the deciders, which encourages responsibility. But if local zoning causes regional issues like sprawl, the costs spill over, which might justify higher intervention. So this might not fully support the user if their local decisions have externalities.

  Epistemic localism argues that local knowledge is crucial and hard to centralize. For zoning, local conditions matter a lot, so this supports the user. Building codes, however, might rely on universal standards, less dependent on local knowledge.

  Tiebout sorting is about exit rights and jurisdictional competition. People move to areas with preferred policies. This applies to zoning since people choose neighborhoods based on rules. Building codes might be less variable due to safety, so less relevant here. This supports the user's zoning point but needs functioning mobility, which isn't always realistic.

  The user also mentioned jurisdictional non-nested hierarchies. Problems like river basins don't fit neat levels. The subsidiarity slogan assumes a hierarchy, which is a flaw. For housing, zoning might be local, but environmental impacts could require regional oversight. So the user must address cross-jurisdictional issues.

  The user's deeper need is to use subsidiarity effectively in arguments without oversimplifying. They want to know which interpretations hold water and how to apply them contextually. They need to avoid vibes-based arguments and have concrete reasoning.

  For their housing example, comparative-competence and epistemic localism best support opposing federal zoning but allowing federal building codes. However, they must acknowledge externalities and scale mismatches. The Tiebout model adds weight but depends on mobility. Burden-of-assignment is weak without proof of local failure.

  In conclusion, the user should use a competence-based approach, emphasizing local diversity for zoning but uniform standards for building codes. They need to address potential externalities from local decisions and the non-hierarchical nature of some problems. This makes their argument robust and less vulnerable to counterpoints.
answer: |-
  Here's a breakdown of the distinct claims packed into "decisions should be made at the lowest possible level," analyzed for validity and applicability to your housing argument. The core insight is that subsidiarity is **not a single principle but a family of related justifications**, each with different strengths, weaknesses, and applicability.

  **Key Premise & Its Flaw:** The slogan presupposes a **nested jurisdictional hierarchy** (e.g., neighborhood < city < county < state < federal). Your housemate correctly identified a major flaw: **real-world problems don't neatly map onto this hierarchy.** (e.g., air pollution basins, watersheds, housing markets, supply chains, pandemics). *Any defensible use of subsidiarity must acknowledge this limitation.*

  **The Distinct Claims:**

  1.  **Burden-of-Assignment Principle:**
      *   **Claim:** The *default* position is local control. Higher levels must *justify* taking power by demonstrating that the lower level is *incapable* or *fails* to solve the problem adequately. "Possible" means "proven competent."
      *   **Validity:** **Substantive but incomplete.** Avoids unnecessary centralization but is reactive and potentially slow. Doesn't proactively assign based on problem structure.
      *   **False if...** Taken as absolute (ignores proactive needs) or if "failure" is defined too narrowly.
      *   **Supports Housing Argument?** **Partially.** You could argue the burden is on the Feds to prove states/localities *fail* at zoning before imposing a mandate. However, it doesn't inherently explain *why* building codes might *not* have that burden (unless you argue local building codes demonstrably failed historically, leading to national standards).
      *   **Hierarchy Assumption:** Strong. Requires clear levels to assign the burden.

  2.  **Comparative-Competence Principle (Problem-Fit):**
      *   **Claim:** Decisions should be made at the level that best matches the *geographic scale, functional scope, and nature of the problem*, balancing:
          *   **Expertise/Knowledge:** Where is the relevant knowledge concentrated? (Often local for context).
          *   **Externalities:** Does the decision impose significant costs/benefits on outsiders? (High externalities push decisions up).
          *   **Preference Heterogeneity:** How much do preferences vary across localities? (High variation pushes decisions down).
          *   **Economies of Scale/Coordination:** Does solving the problem require massive resources or uniform rules? (High need pushes decisions up).
      *   **Validity:** **Most substantive and defensible core.** This is the analytical heart of functional subsidiarity. "Lowest possible" really means "most appropriate level *given these factors*," where "possible" implies "capable of effectively addressing the core problem *and* its spillovers."
      *   **False if...** Misapplied by ignoring key factors (especially externalities) or assuming local is *always* more competent/knowledgeable.
      *   **Supports Housing Argument?** **Strongly.** This is your best bet:
          *   **Zoning:** High preference heterogeneity (what people want in a neighborhood varies hugely), local knowledge crucial (impact on specific streets, character), primary externalities often localized (though regional sprawl/housing shortages can be an argument *for* state/federal intervention!). Argue the *core impacts and preferences* are local.
          *   **Building Codes:** High need for minimum uniform safety standards (economies of scale in rule-making, prevents races to the bottom), significant externalities (unsafe buildings endanger firefighters/residents/neighbors regardless of location), expertise often benefits from national aggregation. Argue the *core safety function* inherently crosses local boundaries.
      *   **Hierarchy Assumption:** Moderate. Acknowledges non-nested problems implicitly by requiring analysis of the *problem's actual scope*, which might not fit a level perfectly.

  3.  **Cost-Bearing / Accountability Principle:**
      *   **Claim:** Decision-makers should bear the significant costs/consequences of their decisions. Local control concentrates both benefits and harms on the deciders, increasing accountability. Federal control disperses costs, leading to moral hazard or lack of responsiveness ("other people's money").
      *   **Validity:** **Substantive and important.** A key democratic and efficiency argument. Localities *feel* the impact of their choices more directly.
      *   **False if...** Applied when local decisions impose *major negative externalities* on outsiders (who bear costs without voice) or when local power structures are deeply unaccountable (e.g., to minorities).
      *   **Supports Housing Argument?** **Moderately for Zoning, Weak for Opposing Fed Mandates.** Local zoning decisions *do* concentrate impacts locally (good for accountability). However, if your locality's restrictive zoning contributes to a *regional* housing shortage harming neighboring communities or the state economy, the externality argument *weakens* this principle's support for pure local control. Doesn't inherently block federal mandates *addressing* those externalities.
      *   **Hierarchy Assumption:** Strong. Assumes costs are containable within jurisdictional boundaries.

  4.  **Epistemic Localism Principle:**
      *   **Claim:** Essential knowledge for effective decisions is inherently *tacit, contextual, and local* ("knowledge of particular circumstances of time and place" - Hayek). Central planners are structurally blind to this dispersed knowledge, no matter how smart or well-intentioned. "Lowest possible" means "where the relevant tacit knowledge resides."
      *   **Validity:** **Substantive and powerful, but not absolute.** Critically important for complex, context-dependent problems. Explains central planning failures.
      *   **False if...** Applied to problems requiring primarily *scientific, technical, or widely generalizable knowledge* (e.g., structural engineering standards, disease control protocols), or where local knowledge is deliberately suppressed/monopolized.
      *   **Supports Housing Argument?** **Strongly for Zoning, Weakly against Building Codes.**
          *   **Zoning:** Deeply context-dependent (parcel specifics, neighborhood dynamics, local economic conditions). Tacit knowledge is crucial.
          *   **Building Codes:** Primarily based on engineering principles, material science, and broad safety goals – more codifiable and generalizable knowledge. Local variations exist (seismic, hurricane) but often handled by amendments to national models.
      *   **Hierarchy Assumption:** Weakest. Focuses on *where knowledge resides*, which could be non-governmental or cross jurisdictional lines.

  5.  **Tiebout Sorting / Exit Rights Principle:**
      *   **Claim:** Multiple jurisdictions allow individuals to "vote with their feet" and choose the bundle of policies/taxes/services that best match their preferences. This promotes efficiency and satisfaction. "Lowest possible" means maximizing the number of viable choice sets (more local jurisdictions = more options).
      *   **Validity:** **Substantive but highly conditional.** Powerful theoretical argument for decentralization *if* key assumptions hold: perfect mobility, perfect information, no externalities, sufficient jurisdictional variety.
      *   **False if...** Assumptions fail (most real-world cases): mobility barriers (cost, discrimination, family ties), information asymmetry, significant externalities between jurisdictions, limited actual variation in policies.
      *   **Supports Housing Argument?** **Moderately for Zoning.** Zoning is a key policy people "sort" on (schools, density, character). Argue federal mandates reduce the diversity of choices available. **Weak for Building Codes:** Safety standards are less likely to be a primary sorting variable, and races to the bottom on safety are a real risk, justifying minimum floors set higher up.
      *   **Hierarchy Assumption:** Moderate. Assumes jurisdictions are distinct and comparable, but doesn't strictly require nesting.

  6.  **Democratic Participation / Legitimacy Principle:**
      *   **Claim:** Decisions made closer to the people enhance democratic participation, civic engagement, perceived legitimacy, and responsiveness. "Lowest possible" means "maximizing feasible citizen involvement and oversight."
      *   **Validity:** **Substantive and intuitive.** Easier to influence local government than federal.
      *   **False if...** Local governments are captured by elites, lack transparency, or disenfranchise minorities. Or when the decision fundamentally requires participation from a wider affected population.
      *   **Supports Housing Argument?** **Moderately for Zoning.** People often feel more connected to local land-use decisions. **Weak against Building Codes:** Safety standards are often seen as technical; broad democratic legitimacy for minimum safety might be higher at state/federal level.
      *   **Hierarchy Assumption:** Strong. Assumes participation scales inversely with jurisdictional size.

  **Recommendations for Your Housing Argument (and Future Use):**

  1.  **Abandon the Bare Slogan:** It invites the valid counterattacks your housemate made. It's vibes-based without elaboration.
  2.  **Embrace Comparative-Competence (Problem-Fit):** This is your strongest foundation. Explicitly frame it as: "**The right level is the one best suited to the problem's characteristics.** Let's analyze zoning vs. building codes through that lens..."
  3.  **Weave in Supporting Principles:** Use your strongest secondary arguments:
      *   For **Zoning:** Emphasize *Epistemic Localism* (contextual knowledge), *Preference Heterogeneity* (diverse community desires), and *Accountability* (local impacts). Acknowledge *but minimize* potential regional externalities, or argue they are best addressed by *higher levels setting goals/frameworks* (e.g., state housing targets) while leaving *implementation details* to localities.
      *   For **Building Codes:** Emphasize *Externalities* (fire in one unit risks the whole building/city), *Economies of Scale/Uniformity* (efficiency, predictability for builders/inspectors), and *Expertise Aggregation* (national standards bodies).
  4.  **Concede the Hierarchy Point:** "You're right, problems aren't always neat. That's why 'lowest possible' isn't just about geography, it's about *best fit*. For zoning, the core impacts and knowledge are local. For building safety, the risks and needed expertise inherently cross local lines."
  5.  **Shift from "Lowest" to "Most Appropriate":** This is more accurate and less vulnerable. The real principle is **Subsidiarity as Problem-Fit:** Assign governance to the level(s) most capable of effectively addressing the problem while minimizing negative externalities and respecting legitimate preference diversity.

  By grounding your argument in the **Comparative-Competence/Problem-Fit principle**, explicitly addressing the factors (preferences, knowledge, externalities, scale), and acknowledging the limitations of the slogan and hierarchy, you'll have a much stronger, more defensible position against federal zoning mandates while justifying federal building codes.
