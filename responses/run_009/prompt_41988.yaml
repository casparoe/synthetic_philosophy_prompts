prompt: |-
  I'm writing a paper on the normative foundations of promising, and before I engage with any particular theory I want to work out the specification any such theory should be held to. The purpose I want the theory to serve is practical: it should be good enough to guide a deliberating agent who is deciding whether, here and now, she is bound — including hard cases where her grip on her own obligations is exactly what is in question. Ideal-theoretic accounts that only tell us what obligations a fully just society's promises generate are not what I'm after.

  Please write the desiderata. For each, give the motivating case or consideration, and mark it either non-negotiable or a camp preference (as you would with locality in interpretations of quantum mechanics — the analogue here being, say, the demand that promissory obligation be recoverable from more general moral considerations, which some philosophers treat as a constraint and others as question-begging reductionism). I have my own running list; to save you the guesswork about which cases I take to matter, I'll tell you what's on it, though you should feel free to add or contest items.

  The theory must handle: promises extracted under coercive duress by an unjust regime, where refusal meant death; promises whose performance benefits the promisee not at all and harms the promisor greatly (the "give me the kidney I asked you for" case); promises made to someone who will never learn whether they were kept, including promises to the dead; promises released by the promisee at no cost to anyone, and the question of why release is even needed if the obligation arose from the promise's earlier effects; the difference between promising and mere prediction about one's own future conduct ("I promise I'll be there" versus "I'll be there, you can count on it" from someone with a known habit of showing up); and a case I've not seen discussed much, which I'd like you to take seriously: a promise given by a promisor who believes, with justification, that the promisee would prefer the promise to be broken and only extracted it out of politeness, so that the promisee's welfare, the promisor's own preferences, and the promise's continued existence all point the same way, and yet breaking it without asking still seems wrong. Does a theory that can't say why that is wrong count as a theory of promising at all?

  Beyond the cases, the theory must respect certain distinctions I take to be data: between being obligated to perform and owing performance; between the wrong of breaking a promise and the wrong of making it negligently; and between promissory obligation and the quite different machinery of contract, which invokes remedial duties rather than the primary one. It should also say something about promises to oneself, which I suspect are either a trivial extension or a reductio, and I'd like to know which before building them in.

  My own hypothesis, offered as a hypothesis and not a conclusion: the desiderata cluster into two groups that cannot be jointly satisfied — one family of intuitions treats the promise as fundamentally an act of assurance that works by changing what the promisee may rely on, and so ties the obligation to the promisee's reliance and their standing to release; another family ties it to something the promisor does to herself, a self-imposed obligation whose persistence through promisee indifference is precisely the point. The dead-promise and reluctant-promisee cases seem to me to pull toward the second, the duress and kidney cases toward the first. If you think some subset of the desiderata is jointly unsatisfiable, say so explicitly — that is the part I most want to see.

  Finally, and briefly, since I will do this part myself at length: score three families of views — social-practice or convention theories, assurance or reliance theories, and commitment-of-will theories — against your list, and say which single desideratum does the most to exclude candidates.

  Please write your answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user is developing normative criteria for promising theories and wants practical guidance for deliberating agents. Their cases include coercive duress, harmful performances, promises to the dead, release mechanisms, and that intriguing reluctant-promisee scenario. 

  First, I'll organise the desiderata by type: case-based requirements and conceptual distinctions. For each, I need to determine negotiability status based on philosophical consensus. The kidney case clearly demands non-negotiable harm constraints, while the self-obligation view for dead promises might be more contentious. 

  That reluctant-promisee case is fascinating - it challenges assurance theories fundamentally. If all normative force comes from the promisee's reliance or interests, why would breaking such a promise feel wrong? This might indeed be a litmus test for commitment theories. 

  Regarding their hypothesis about two incompatible families: yes, the tension seems real. Assurance theories struggle with dead promises where no reliance exists, while commitment theories can't easily explain why release by the promisee dissolves obligations. Perhaps hybrid approaches exist, but they'd need to address this core friction. 

  For scoring existing theories: social practice views fail coercive promises spectacularly; reliance theories crumble at the reluctant-promisee case; commitment theories falter on release mechanics. The most damaging single desideratum? Likely the coercive duress case - it eliminates theories where obligation arises from voluntary participation in practices. 

  On promises to oneself: this might be the canary in the coal mine. If a theory naturally extends to self-promises without special pleading, that suggests robustness. But if it requires contortions, perhaps the model is flawed. 

  I should note where philosophical camps diverge - like whether self-imposed obligation is coherent without social recognition. The British English requirement means watching for 'practise/practice' and 'ou' spellings, but the substance matters more than orthography here. 

  The user's grasp of the tensions suggests they'll spot oversimplifications. My response should honour that by marking where desiderata conflict explicitly, per their request about joint unsatisfiability. That reluctant-promisee case deserves particular care - it's underdiscussed but potentially devastating to mainstream views.
answer: |-
  Below is a systematised list of desiderata for a theory of promissory obligation, structured as requested. I’ve incorporated your cases and distinctions, added further considerations where salient, classified each as **non-negotiable** (core to promising as a normative phenomenon) or **camp preference** (contentious among plausible theories), and flagged tensions between desiderata. Scoring of extant theories follows.

  ---

  ### **I. Desiderata from Cases**  
  *(Non-negotiable unless specified)*  

  1. **Coercive Duress**  
     - **Case**: Promise extracted under unjust threat of death.  
     - **Requirement**: Theory must explain why such "promises" lack binding force (or are defeasible), without collapsing into general moral prohibitions against coercion.  
     - **Status**: Non-negotiable. A theory that binds agents to coerced commitments fails practical deliberation.  

  2. **Harmful/Pointless Performance**  
     - **Case**: Promisor obligated to donate a kidney to a promisee who no longer needs/benefits from it, at great harm to promisor.  
     - **Requirement**: Theory must explain why obligation persists *despite* net harm, *or* why it dissolves when performance becomes gratuitously harmful.  
     - **Status**: Camp preference. Assurance theories often dissolve obligation here; commitment theories may uphold it.  

  3. **Promises to the Dead/Unknowable**  
     - **Case**: Promise to deliver a letter to X, but X dies before performance; promisor knows X will never learn of breach.  
     - **Requirement**: Theory must explain why breach remains wrong *despite* no possible effect on promisee’s interests, expectations, or welfare.  
     - **Status**: Non-negotiable. Tests whether obligation is grounded in promisor’s act alone.  

  4. **Release by Promisee**  
     - **Case**: Promisee waives performance freely, with no third-party costs.  
     - **Requirement**: Theory must explain (a) why release dissolves obligation, and (b) why the promisor cannot unilaterally disregard the promise *before* release.  
     - **Status**: Non-negotiable. Central to promisee’s normative authority.  

  5. **Promise vs. Mere Prediction**  
     - **Case**: Distinguishing "I promise I’ll be there" from reliable forecaster’s "I’ll be there, count on it".  
     - **Requirement**: Theory must capture the unique obligation-generating force of promissory speech acts beyond epistemic reliability.  
     - **Status**: Non-negotiable. Definitional to promising.  

  6. **Reluctant Promisee**  
     - **Case**: Promisor justifiably believes promisee prefers non-performance (e.g., promisee requested promise out of politeness). Breaking it aligns with welfare, preferences, and promisee’s unstated wishes.  
     - **Requirement**: Theory must explain why breach without consultation is pro tanto wrong.  
     - **Status**: **Non-negotiable litmus test**. If a theory cannot explain this, it misidentifies the source of obligation. *(Your intuition is correct: this case devastates pure reliance/assurance views.)*  

  ---

  ### **II. Conceptual Distinctions**  
  *(Non-negotiable)*  

  7. **Obligation vs. Owing**  
     - **Requirement**: Distinguish being *obligated to perform* (impersonal duty) from *owing performance to the promisee* (directed duty). Explains why only promisee can release obligation.  

  8. **Wrong of Breaking vs. Wrong of Making**  
     - **Requirement**: Distinguish the wrong of *negligently making* a promise (e.g., without intent to fulfil) from *wrongfully breaking* a sincere promise.  

  9. **Promissory vs. Contractual Obligation**  
     - **Requirement**: Delimit primary moral duty to perform from remedial/legal duties arising in contract (e.g., compensation for breach). Promissory obligation must be conceptually prior.  

  ---

  ### **III. Additional Desiderata**  

  10. **Promises to Oneself**  
      - **Requirement**: Explain whether self-promises generate genuine obligations.  
      - **Status**: **Camp preference** with diagnostic weight. If self-promises obligate, theory likely prioritises self-commitment; if not, it may require interpersonal recognition. *(Likely a reductio for commitment theories if taken seriously; trivial for assurance theories.)*  

  11. **No Third-Party Empowerment**  
      - **Case**: Stranger cannot demand performance of a promise not made to them.  
      - **Requirement**: Theory must explain the promisee’s unique standing to claim performance/release.  
      - **Status**: Non-negotiable.  

  ---

  ### **IV. Tensions and Joint Unsatisfiability**  
  Your hypothesis is astute: **the desiderata cluster into two incompatible families**.  

  - **Family A (Assurance/Reliance)**:  
    Grounds obligation in the promisee’s reliance, expectations, or normative power.  
    *Strong on*: Coercive duress (invalidates "reliance"), release, harm/pointlessness (obligation dissolves if reliance unwarranted).  
    *Weak on*: Promises to the dead (no reliance possible), reluctant promisee (breach satisfies all reliance interests), self-promises (no interpersonal reliance).  

  - **Family B (Commitment-of-Will)**:  
    Grounds obligation in the promisor’s autonomous act of self-binding.  
    *Strong on*: Promises to the dead, reluctant promisee, self-promises.  
    *Weak on*: Release (why can promisee dissolve self-imposed obligation?), harmful performance (why bind to self-harm?), duress (was the "commitment" truly autonomous?).  

  **The core tension**:  
  - **Reluctant-promisee and dead-promise cases** demand that obligation can persist *independently* of the promisee’s present interests or existence (pulling to B).  
  - **Release and duress cases** demand that obligation is *contingent* on the promisee’s normative authority and the promise’s interpersonal context (pulling to A).  
  **No theory satisfying both demands exists in the literature**. Hybrids either privilege one cluster or become ad hoc.  

  ---

  ### **V. Scoring Theories Against Desiderata**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partial/Ad Hoc)*  

  | **Desideratum**               | **Social Practice** | **Assurance/Reliance** | **Commitment-of-Will** |  
  |-------------------------------|---------------------|------------------------|------------------------|  
  | 1. Coercive Duress            | ✗ (Obligation if "practice" followed) | ✓ (No reliance justified) | ~ (Autonomy vitiated?) |  
  | 2. Harmful Performance        | ~ (Practice rules) | ✓ (No reliance interest) | ✗ (Binding) |  
  | 3. Promises to Dead           | ✗ (No social effects) | ✗ (No reliance) | ✓ |  
  | 4. Release by Promisee        | ~ (Convention) | ✓ (Reliance withdrawn) | ✗ (Self-imposed) |  
  | 5. Promise vs. Prediction     | ~ (Conventional form) | ✓ (Assurance vs. forecast) | ✓ (Act of will) |  
  | **6. Reluctant Promisee**     | ✗ | ✗ | ✓ |  
  | 10. Self-Promises             | ✗ | ✗ | ~ |  
  | **Non-negotiable distinctions** | ~ (Blurs obligation/owing) | ✓ | ~ (Blurs breaking/making) |  

  **Most damaging desideratum**: **6 (Reluctant Promisee)**.  
  - **Why?** It uniquely forces a choice between the two families. Assurance theories *must* say breach is permissible (but intuition says it’s wrong); commitment theories *must* say it’s wrong (but struggle to explain why consultation matters). This case alone exposes the irreconcilable rift in the literature.  

  ---

  ### **Summary Recommendations**  
  - A viable theory **must** pass the **reluctant-promisee test** (6).  
  - **Release (4)** and **dead-promise (3) cases** jointly constrain the theory’s structure: if obligation dissolves with release, it cannot be wholly self-imposed; if it binds beyond death, it cannot be wholly interest-dependent.  
  - **Self-promises (10)** are a *reductio* for commitment theories if they generate obligations (per Kant), but few find self-obligation plausible. Lean toward treating them as aspirational, not binding.  

  Your project’s critical insight—that desiderata cluster antagonistically—is correct. A theory privileging *interpersonal authority* (Family A) best handles duress, release, and harm; one privileging *autonomous obligation* (Family B) best handles dead and reluctant promises. Neither subsumes the other. Practical deliberation may require a disjunctive account.
