answer: |-
  **Joint Statement: Adversarial Collaboration on Logical Omniscience in Epistemic Modelling**  

  **1. Shared Ground**  
  Both camps agree that:  
  (i) Epistemic logic intentionally employs *formal idealizations* to isolate core features of reasoning;  
  (ii) The necessitation rule (⊢φ ⇒ ⊢Kφ) and distribution axiom (K(P→Q)→(KP→KQ)) define a *structural property* of the model, not a psychological claim;  
  (iii) Distinguishing *descriptive* adequacy (for cognitive agents) from *normative/explanatory* goals (e.g., rationality conditions) is essential to evaluating the framework.  

  **2. Core Disagreements**  
  | **Idealizers’ Stance**                                      | **Bounded-Rationality Stance**                              |  
  |-------------------------------------------------------------|-------------------------------------------------------------|  
  | Computational limits are *pragmatically negligible* for modelling *rational obligation* and logical relations. | Computational limits are *constitutively relevant* to agency; omitting them distorts core phenomena (e.g., ignorance, effort). |  
  | The idealisation’s value (e.g., tractability, clarity) *outweighs* its divergence from bounded cognition. | When models *systematically misrepresent* feasible reasoning, their normative advice becomes *inactionable*. |  

  **3. Suspected Verbal Disputes**  
  A likely verbal element concerns the term "knowledge": Idealizers treat K as denoting *logical entailment access* within the model, while bounded theorists often interpret K as approximating *psychologically realistic belief*. Whether this reflects mere terminological divergence or substantive disagreement requires further disambiguation.  

  **4. Testable Cruxes & Predictions**  
  - **Crux 1: Line-Drawing (Memory vs. Computation)**  
    - *Idealizer Prediction*: Memory failure is *contingent* (hardware), while computational limits reflect *algorithmic competence*; only the former is irrelevant to rationality norms.  
    - *Bounded Prediction*: Both are *physical constraints on implementation*; privileging memory as "non-idealizable" is arbitrary.  
  - **Crux 2: Dutch-Book Vulnerability**  
    - *Idealizer Prediction*: A logically non-omniscient agent *cannot be Dutch-booked* if it rationally updates on evidence of the consequence.  
    - *Bounded Prediction*: A polynomially bounded agent *can be exploited* by a super-polynomial adversary using obscure consequences.  

  **5. Progress Metrics & Concessions**  
  **Shared Progress Criteria**:  
  - A model that *formally separates* logical competence from resource constraints.  
  - Empirical tests of whether Dutch-book vulnerability scales with computational complexity.  
  **Concessions**:  
  - Idealizers: Overstated the "harmlessness" of idealization for *all* normative purposes (e.g., prescriptive AI safety).  
  - Bounded Camp: Underappreciated the role of idealization in *explaining* why certain inferences *should* be non-negotiable (e.g., disjunctive syllogism).  

  ---  
  *Drafting Notes*:  
  - Neutrality enforced by:  
    - Attributing claims directly to camps (avoiding third-party characterizations).  
    - Using each side’s self-descriptions (e.g., "rational obligation" vs. "feasible reasoning").  
  - Disagreements preserved via:  
    - Contradictory predictions (Sec. 4), incompatible stances (Sec. 2).  
  - No false consensus: Verbal disputes flagged tentatively; cruxes left unresolved.
