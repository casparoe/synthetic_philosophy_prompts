  ### The Decision Tree

  **Question 1: The General's Statue**  
  A statue in the town square honors a general whose famous victory defended a system of slavery. His military achievement is inseparable from that offense. What should be done?  
  - A) Remove the statue.  
  - B) Add context (like a plaque or additional information).  
  - C) Keep it as is.  

  **If you chose A (Remove)**: Go to Question 2.  
  **If you chose B (Add context)**: Go to Question 3.  
  **If you chose C (Keep as is)**: Go to Question 4.  

  **Question 2: After Removal**  
  Once a commemoration is removed, what should happen to it and the space?  
  - A) Put it in a museum with a full explanation.  
  - B) Leave the space empty as a reminder of what was removed.  
  - C) Replace it with a new commemoration (e.g., honoring the victims).  

  *Your position is:*  
  - A) **Relocation to Museum**: The object belongs in an educational setting, not a public square.  
  - B) **Removal with Nothing**: The empty space speaks volumes about what we choose not to celebrate.  
  - C) **Removal with Replacement**: We must actively honor the marginalized, not just remove the offender.  

  **Question 3: Type of Context**  
  For the general's statue, what kind of contextual change do you support?  
  - A) Add a plaque that factually explains the history, including the connection to slavery.  
  - B) Commission a new artwork (e.g., statues of enslaved people) that recontextualizes the entire site, making the original statue part of a new, critical narrative.  

  *Your position is:*  
  - A) **Contextualist**: Truth in storytelling — add information to complicate the hero narrative.  
  - B) **Counter-Memorial**: Keep the object but subvert its meaning through artistic intervention.  

  **Question 4: The Scientist's Statue**  
  A statue in the park honors a scientist who made life-saving discoveries. It turns out he held racist views in private, but they didn't affect his work. What should be done?  
  - A) Remove it.  
  - B) Add context about his views.  
  - C) Keep it as is.  

  **If you chose A (Remove)**: Go to Question 2.  
  **If you chose B (Add context)**: *Your position is* **Contextualist** (see above).  
  **If you chose C (Keep as is)**: Go to Question 5.  

  **Question 5: The Redeemed Writer**  
  The library is named after a writer who held bigoted views in her youth but publicly renounced them and spent her later years fighting for equality. How should she be commemorated?  
  - A) Remove her name.  
  - B) Keep the name but add context about her journey.  
  - C) Keep the name as is.  

  **If you chose A (Remove)**: Go to Question 2.  
  **If you chose B (Add context)**: *Your position is* **Contextualist**.  
  **If you chose C (Keep as is)**: Go to Question 6.  

  **Question 6: The Beloved Landmark**  
  A statue of a town founder with a harmful past has become a beloved landmark. Few remember who he was; it’s now seen as a symbol of the town. What should be done?  
  - A) Remove it because the origin is harmful.  
  - B) Add context about the history.  
  - C) Keep it as is because the current meaning is what matters.  

  **If you chose A (Remove)**: Go to Question 2.  
  **If you chose B (Add context)**: *Your position is* **Contextualist**.  
  **If you chose C (Keep as is)**: *Your position is* **Keep-as-Is**: History should be left undisturbed; we judge the past by its own standards, not ours.  

