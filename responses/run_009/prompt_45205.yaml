  ### Position Glosses
  - **Keep-as-Is**: "If it was good enough for them, it’s good enough for us."  
    - *Awkward commitment: Defending commemorations even when they celebrate values we now reject.*  
  - **Contextualist**: "Tell the whole story, not just the hero’s chapter."  
    - *Awkward commitment: Adding context might not be enough for communities that find the presence of the statue itself harmful.*  
  - **Counter-Memorial**: "Keep the wound open to heal it."  
    - *Awkward commitment: The original offensive image stays in public view, which can be retraumatizing.*  
  - **Relocation to Museum**: "History belongs in a classroom, not a pedestal."  
