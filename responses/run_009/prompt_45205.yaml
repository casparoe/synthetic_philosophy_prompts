  ### Interactive Quiz: "What Do You Actually Believe About Commemorations?"  
  **Intro Paragraph for Newsletter**  
  You've heard the arguments: "Don't erase history!" vs. "Stop honoring oppressors!" But beneath the slogans, most of us hold nuanced views. Take this quiz to discover your true stance. We’ll present concrete cases—*no philosophy jargon*, just real-world scenarios. You might find your answers clash with the labels you claim: self-described "retentionists" often support adding context when pressed, while "removalists" may hesitate when confronted with the reality of destroying historical objects. This isn’t about judging you—it’s about exposing mismatches. Ready?  

  ---

  ### The Decision Tree  
  *Answer honestly. Each question branches to the next based on your choice.*  

  **Question 1: The Unavoidable Legacy**  
  *A statue honors a general celebrated for winning battles that defended slavery. His military success is inseparable from upholding oppression. What should be done?*  
  - **A)** Remove the statue entirely.  
  - **B)** Keep it but add a plaque about the slavery connection.  
  - **C)** Keep it as is—it honors military strategy, not slavery.  

  **Question 2: The Flawed Genius**  
  *A university building is named for a scientist whose breakthroughs saved lives. Recently, his private diaries revealed he held bigoted views, but they didn’t influence his work. What should be done?*  
  - **A)** Rename the building—his views taint his legacy.  
  - **B)** Keep the name but install an exhibit about his flaws.  
  - **C)** Keep the name—only his scientific work matters.  

  **Question 3: The Late Change of Heart**  
  *A poet’s statue stands in a park. Though he promoted harmful ideologies early in life, he publicly renounced them and spent his final decades advocating against them. What should be done?*  
  - **A)** Remove it—his early actions caused lasting harm.  
  - **B)** Keep it but add context about his transformation.  
  - **C)** Keep it—it honors his redemption and later ideals.  

  **Question 4: The Forgotten Founder**  
  *A street named for a 19th-century town founder (who held offensive views) is now a beloved neighborhood hub. Most residents don’t know who he was; they just love the name’s "historic charm." What should be done?*  
  - **A)** Rename it—the origin is still harmful.  
  - **B)** Keep the name but add a sign explaining his full story.  
  - **C)** Keep it—the current meaning outweighs the past.  

  **Question 5: Who Decides?**  
  *A disputed statue divides the town. The descendants of those harmed want it gone. The city council wants a referendum. What’s fair?*  
  - **A)** Let the harmed group decide—they live with the legacy.  
  - **B)** Hold a town-wide vote—every resident gets a say.  
  - **C)** Trust elected officials to balance all views.  

  **Question 6: The Empty Plinth**  
  *After removing a statue of a colonizer, what happens to the space?*  
  - **A)** Install new art honoring the resilience of colonized people.  
  - **B)** Leave it empty—absence makes a statement.  
  - **C)** Move the statue to a museum with full context.  

  **Question 7: The Shadowed Monument**  
  *A statue of a slave trader stands in the town square. Should we keep it but commission a counter-monument (e.g., statues of enslaved people confronting him) to reframe its meaning?*  
  - **A)** Yes—use the original to provoke critical dialogue.  
  - **B)** No—remove it; the original is too offensive to keep.  
  - **C)** No—just add a plaque explaining the history.  

  **Question 8: The Drifted Landmark**  
  *A 200-year-old statue of a settler is now a cherished gathering spot. People picnic there because it’s pretty, not because of who it depicts. Research reveals he committed atrocities. What should be done?*  
  - **A)** Remove it—the origin can’t be ignored.  
  - **B)** Keep it but add context and community-input art nearby.  
  - **C)** Keep it—its current role has nothing to do with the settler.  

  ---

  ### How to Interpret Your Answers  
  Your path through the tree (based on your choices) leads to one of 7 positions. Each position has a core principle and an "awkward commitment"—the hard truth its defenders accept.  

  #### Position Key  
  1. **Keep-As-Is Retentionist**  
     - *Core*: History shouldn’t be altered to suit modern values.  
     - *Awkward commitment*: Defending monuments even when they honor values we now reject.  
     - *Your path*: Mostly **C** choices (e.g., 1C, 2C, 3C, 4C).  

  2. **On-Site Contextualist**  
     - *Core*: Keep objects but add honest context (plaques, exhibits).  
     - *Awkward commitment*: Context may feel insufficient to those who want removal.  
     - *Your path*: Mostly **B** choices (e.g., 1B, 2B, 3B, 7C).  

  3. **Counter-Memorial Advocate**  
     - *Core*: Keep the object but "shadow" it with art that challenges its meaning.  
     - *Awkward commitment*: The original offensive image remains visible.  
     - *Your path*: **7A** + contextualist-leaning elsewhere.  

  4. **Relocationist**  
     - *Core*: Move contested objects to museums for education, not celebration.  
     - *Awkward commitment*: Museums can feel elitist or inaccessible.  
     - *Your path*: Removal in key cases (e.g., 1A, 3A) + **6C**.  

  5. **Removal with Replacement**  
     - *Core*: Remove harmful symbols and replace them with tributes to the marginalized.  
     - *Awkward commitment*: Erasure accusations if replacement feels tokenistic.  
     - *Your path*: Removal in key cases (e.g., 1A, 4A) + **6A**.  

  6. **Removal with Nothing**  
     - *Core*: Remove the object and leave space empty to symbolize loss.  
     - *Awkward commitment*: Empty spaces can be misinterpreted as forgetting.  
     - *Your path*: Removal in key cases (e.g., 1A, 3A) + **6B**.  

  7. **Community-Driven Pragmatist**  
     - *Core*: Let current residents decide based on present-day meaning.  
     - *Awkward commitment*: Overlooking historical harm if the community downplays it.  
     - *Your path*: **5B/5C** + mixed retention/contextualist choices.  

  ---

  ### Design Notes  
  - **Sharp questions, no redundancy**: Your seed cases were distilled. The "who decides?" question splits retentionists (who often defer to tradition) from pragmatists (who prioritize current residents). The "drifted meaning" case splits retentionists (who see current meaning as irrelevant) from contextualists (who add layers).  
  - **Unoccupied combinations**: A "redemption absolutist" (always keep if someone renounced views) was *incoherent* when paired with removal in other cases. A "remove-everything" stance was *unattractive*—no one chose removal + **6B** (leave empty) for *all* scenarios without hesitation.  
  - **Mismatches exposed**:  
    - If you called yourself "anti-removal" but chose **B** (context) for most cases, you’re likely a *contextualist*.  
    - If you supported removal but balked at **6C** (museum relocation) or **6B** (empty plinth), you might be a *replacement advocate* but hadn’t considered the options.  
  - **Why 8 questions?** Each splits a major position:  
    - Q1/Q2 test separability of achievement/offense.  
    - Q3 tests redemption.  
    - Q4/Q8 test meaning drift.  
    - Q5 tests authority.  
    - Q6/Q7 test post-removal actions.  

  Run the quiz, share your result, and let the conversation begin!  

  *(Quiz results can be tallied manually or via a simple online form. Position labels include "awkward commitments" to spark reflection.)*
