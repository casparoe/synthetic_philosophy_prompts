prompt: |-
  Quick context: I'm the grad student rep on the constitutional review committee of our university's student association, and a mess just landed in our lap. Last semester a referendum passed 68-32 to stop all student-fee funding for any group that takes a public stance on "controversial political issues" — it was pretty transparently aimed at defunding a small pro-Palestinian group and a pro-life group, though the campaign framing was all about "neutrality." Two weeks later the Judicial Council — five students appointed by past association presidents, none of them elected to anything — struck it down as a violation of the charter's guarantee of viewpoint-neutral funding. Now half the campus is screaming about tyranny by unelected randos overruling a supermajority, and the other half is saying this is literally the one moment the charter exists for. The committee has to vote Thursday on whether to propose an amendment stripping the Council's power to strike down referenda (making their rulings advisory only), and I somehow got assigned to write the recommendation memo everyone will read beforehand.

  Please draft it. I need a clear bottom line — recommend stripping the power, keeping it, or something in between like a supermajority override — with actual reasoning, not vibes. And it has to honestly engage the strongest argument on whichever side it comes down against. For me the hard part is the precommitment thing: the whole point of writing something into a charter in advance is that you can't trust majorities to protect small unpopular groups precisely at the moment when everyone wants to gang up on them, so "68% voted for it" maybe shouldn't settle the matter. But it also genuinely bothers me that 5 appointed people with no accountability killed something 68% of voters passed. The memo should be readable by my fellow committee members — smart students, but not con law people — so no jargon dumps, keep it to maybe a page and a half.
reasoning: |-
  Okay, the user is a grad student rep on a constitutional review committee dealing with a hot-button issue. They need a memo recommending whether to strip the Judicial Council's power to strike down referenda after it overturned a controversial referendum. 

  First, let's unpack the core tension: 68% voter approval vs. an unelected council blocking it to protect minority viewpoints. The user is clearly wrestling with democratic legitimacy versus constitutional safeguards. Their "precommitment" comment shows they understand why charters exist, but the 5-appointees-vs-68% dynamic genuinely bothers them. Smart framing needed.

  Hmm... the referendum targeted specific groups under "neutrality" guise. That's textbook "tyranny of the majority" territory – exactly what judicial review is meant to prevent. But dismissing 68% of voters as "just wrong" would fuel backlash. The memo must validate both concerns while picking a side.

  Key angles to address:
  - Why the council exists: To enforce charter principles even when unpopular. Analogies to courts protecting minorities might resonate.
  - Legitimacy gap: Appointed vs. elected matters, but so does function. Maybe contrast legislative vs. judicial roles?
  - Middle options? Supermajority override sounds compromise-y but could undermine judicial function. Advisory rulings make review toothless.

  User's peers aren't lawyers, so avoid *Marbury v. Madison* deep dives. Use plain examples: "Imagine if 68% voted to defund all religious groups tomorrow..." 

  Biggest risk is sounding elitist ("voters don't understand constitutions"). Flip it: The charter is voters' own precommitment to fairness. The council is enforcing *their* rules, not overriding them.

  Recommendation should hold firm on keeping judicial review. Why? Because stripping power now would signal that the charter bends to momentary majorities targeting minorities – the exact opposite of its purpose. But acknowledge the accountability concern: maybe propose term limits or confirmation processes later.

  Memo tone: Calm, principled, not scolding. Present this as protecting the association's long-term integrity, not "saving" any particular group. Stress that constitutions outlive current controversies.

  Side note: User's clearly stressed. Phrases like "mess just landed in our lap" and "somehow got assigned" suggest they feel dumped on. Memo should feel like a life raft – structured, decisive, easing their burden.
answer: |-
  ## MEMORANDUM  
  **To:** Constitutional Review Committee  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Judicial Council Power to Strike Down Referenda  

  ### I. The Core Dilemma
  We face a fundamental tension: the **democratic legitimacy of a 68% referendum vote** versus the **constitutional principle of viewpoint-neutral funding** upheld by an unelected Judicial Council. Both sides invoke compelling principles – popular sovereignty vs. minority protection. Our decision must prioritize the *long-term health and integrity* of the Student Association, not just the current controversy.

  ### II. Recommendation: **Maintain the Judicial Council's Power to Strike Down Referenda**
  *   **Bottom Line:** Do **NOT** amend the charter to strip the Judicial Council's power to invalidate unconstitutional referenda. Its rulings should remain binding, not advisory. A supermajority override mechanism is also not recommended.

  ### III. Reasoning: Why Binding Judicial Review is Essential

  1.  **The Charter's Core Purpose is Protection, Not Just Process:**  
      *   The charter isn't just an instruction manual for running elections; it's our foundational commitment to *fairness and principle*. Its guarantee of "viewpoint-neutral funding" was deliberately placed there as a **precommitment device**.  
      *   **The Precommitment Argument:** We bind ourselves *in advance* to rules protecting minority voices precisely *because* we know that in moments of intense passion (like now), majorities might target unpopular groups. Saying "68% voted for it" ignores *why* we have the charter. If the majority can simply override core rights via referendum, those rights become meaningless. The Judicial Council is the designated mechanism to say, "You agreed to this fundamental rule; you can't violate it, even with a majority vote."

  2.  **Viewpoint Neutrality is the Bedrock of a Diverse Community:**  
      *   The disputed referendum, regardless of its campaign messaging, functionally targeted specific groups based on their political speech ("controversial political issues").  
      *   Allowing funding to be cut based on *viewpoint* creates a **heckler's veto**. Any sufficiently loud or organized group could silence opposing voices by branding their issues "controversial" and mobilizing a referendum. This chills debate and undermines the intellectual vitality of our campus.  
      *   The Judicial Council correctly identified this as a violation of the charter's core principle. Stripping their power now would signal that viewpoint neutrality is negotiable when enough people are angry.

  3.  **Advisory Power or Supermajority Override Undermine the Safeguard:**  
      *   **Advisory Rulings:** Rendering the Council's rulings "advisory only" effectively **nullifies judicial review**. If the Assembly can ignore a ruling that a referendum violates the charter, the charter becomes unenforceable against popular actions. This guts its protective purpose.  
      *   **Supermajority Override:** While seemingly a compromise, this creates perverse incentives:
          *   It makes violating fundamental rights *easier* if the violation is popular enough (e.g., 68% + a simple Assembly majority).
          *   It politicizes constitutional interpretation, turning charter compliance into a legislative vote rather than a legal judgment.
          *   It fails to address the core issue: protecting *unpopular* minorities. A supermajority override makes it *harder* to protect them when needed most.

  4.  **Addressing the "Unelected Randos" Argument (The Strongest Counter-Argument):**  
      *   **Acknowledgment:** This is the most serious objection. An unelected body of five appointed students overriding the clear will of 68% of participating voters *feels* profoundly undemocratic and lacks direct accountability. It understandably breeds resentment.  
      *   **Response:** Democracy isn't just about majority rule; it's also about **protecting fundamental rules and minority rights**. Courts (like the Judicial Council) serve a distinct function: applying the law and the constitution/charter impartially, *especially* when it's unpopular.  
      *   **Analogy:** Imagine if 68% voted in a referendum to defund all religious student groups. Would we want *no* mechanism to stop this clear violation of a hypothetical charter guarantee of religious freedom? The unelected nature of the Council is a design choice to promote **independence and insulation from political pressure**. Their legitimacy comes from **upholding the charter**, not winning elections.  
      *   **Potential for Reform?** If concerns about appointment legitimacy persist, the committee could *separately* recommend reforms to the *appointment process* (e.g., broader input, confirmation votes, term limits) to enhance perceived legitimacy, *without* sacrificing the essential function of binding judicial review.

  ### IV. What This Recommendation Does *Not* Mean
  *   **It does NOT endorse the Judicial Council's specific reasoning** as flawless. Future committees could propose *clarity* on "viewpoint neutrality" if desired.
  *   **It does NOT prevent future referenda** on funding rules – only referenda that clearly violate the *existing* charter guarantee of viewpoint neutrality.
  *   **It does NOT imply the defunded groups are "right" or "wrong."** It protects the *principle* that funding decisions cannot be based on the viewpoint expressed.

  ### V. Conclusion
  The current anger stems from a clash of deeply held values: majority rule versus minority protection. While the "unelected" nature of the Judicial Council is a legitimate concern, stripping its power to enforce the charter's core principles would be a profound mistake. It would effectively make our fundamental rights subject to the shifting tides of popular opinion, rendering the charter meaningless when it is needed most. **The ability of a neutral body to check majority actions that violate foundational rights is not "tyranny"; it is the essential safeguard that defines a constitutional system.** We must uphold this safeguard to protect the diverse, vibrant, and principled community we aspire to be.

  **Recommendation:** **Reject** any amendment stripping the Judicial Council's binding power of judicial review over referenda. Maintain the current structure as essential to the charter’s purpose.

  Respectfully submitted,  
  [Your Name]  
  Graduate Student Representative
