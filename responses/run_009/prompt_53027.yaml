prompt: |-
  Assume the role of a philosopher of the historical sciences who is also well read in the archaeology of the societies in question — someone equally at home in the conceptual literature on explanation and in what actually comes out of the ground. I am writing a paper on whether "collapse" is a genuine comparative-historical concept or a storyteller's prop, and before I argue either way I need the specification for its rival: a theory of societal collapse. Please think carefully before committing to anything final — start with a few sentences of rough brainstorming of candidate requirements, then present the polished list.

  Keep one purpose in view throughout: the theory has to be good enough for comparative historical social science, where "good enough" means able to adjudicate real, disputed cases on the strength of the material record — not merely able to interpret whatever is found after the fact.

  The cases that keep tripping me up, and which the requirements should therefore be shaped around:

  1. The Maya "collapse": in the southern lowlands, dynastic monuments and palace institutions wind down over roughly two centuries, while in the very same period the northern cities of Yucatán flourish — and Maya peoples, languages, and communities persist to this day. A collapse of a society, of a set of institutions, or neither?

  2. Post-Roman Britain: the administrative apparatus of the western Empire dissolves over a long stretch of centuries, yet skeletal evidence has been read as showing that average stature — a tolerable proxy for childhood nutrition — rose in the following period. If a "collapse" left the peasantry better fed, I want to know what exactly is supposed to have collapsed.

  3. Rapa Nui: the received story is ecocide, a society destroying itself through deforestation; a revisionist story blames rats and later European contact, and denies that any pre-contact catastrophe occurred. A theory of collapse has to be able to adjudicate between these, which means it must say in advance what evidence would count.

  4. The end of the Late Bronze Age: within a few decades on either side of 1200–1100 BCE, palace economies across the eastern Mediterranean fail, some writing systems vanish, whole cities are burned or abandoned — and Egypt persists, and life goes on for most people. Is that one event or many, and who gets to say?

  The deliverable, in this order:

  A. The requirements list, each with the case or consideration behind it. Among the questions the requirements should settle one way or another: whether the theory must distinguish the fate of elites from the fate of populations (monuments stop being built; people keep eating), and whether a verdict of collapse can be indexed to one level while other levels continue; whether collapse must be treated as a state or a process, graded or all-or-nothing; whether the concept is required to be observer-neutral, given that what registers as collapse for a dynastic elite can register as relocalization for villagers; and whether the theory must generate testable expectations about the material record — settlement patterns, paleobotany, skeletal indicators of stress — rather than absorbing whatever turns up.

  B. Mark which requirements are non-negotiable if collapse is to remain a scientific concept, and which are prejudices of particular research traditions (the catastrophist lineage on one side, the resilience/transformation school on the other). If any subset of requirements is jointly unsatisfiable — for instance, if demanding both rapidity and a whole-society unit of analysis would rule out the Roman case by definitional fiat — say so explicitly; that is the part I most want. Also tell me which single requirement, if strictly enforced, excludes the most candidate theories.

  C. Briefly — two or three lines each, as I will do the full scorecard myself — how Tainter's diminishing-returns-on-complexity account, a Diamond-style ecocide account, and a resilience/transformation view would each fare against the list.

  Refer to positions and arguments rather than bibliographies: no reading lists, no citations with page numbers, no author-by-author surveys. Write so that a careful reader with no web access and no specialist training could evaluate the result on its merits alone.
reasoning: |-
  Hmm, the user is writing a paper on whether "collapse" is a genuine concept in historical sciences or just a narrative device. They need a rigorous theory of societal collapse that can handle contentious cases like the Maya, post-Roman Britain, Rapa Nui, and the Late Bronze Age collapse. 

  The user is clearly frustrated with how existing frameworks handle these ambiguous cases - where elites fall but commoners thrive, or where "collapse" looks suspiciously like transformation. They want a theory that doesn't just interpret evidence post-hoc but can actually adjudicate disputes through testable predictions. Smart framing - this exposes the weakness in many popular collapse narratives.

  Key challenges popping out from their cases: 
  - Scale problems (Maya: regional vs pan-civilizational) 
  - Class divergence (Britain: administrative collapse vs peasant welfare improvement) 
  - Causation ambiguity (Rapa Nui: self-destruction vs external shocks) 
  - Event unity questions (Late Bronze Age: synchronous multi-site failure vs separate events)

  For the requirements list, I'll need to tackle: 
  1) Defining the unit of analysis (must handle sub-societal levels) 
  2) Setting temporal parameters (process vs event) 
  3) Establishing severity thresholds (graded, not binary) 
  4) Demanding material falsifiability (settlement patterns, bioarchaeology etc.) 
  5) Requiring comparative stability baselines (no presentist judgments) 

  The non-negotiables will be falsifiability and multi-scalar analysis - without these, "collapse" remains a storytelling device. The most exclusionary requirement? Definitely falsifiability - it eliminates Diamond-style just-so stories and forces operationalization. 

  For the theoretical scorecard: 
  - Tainter fails on class divergence (his complexity metric ignores peasant welfare) 
  - Diamond flunks falsifiability (ecocide theories bend to any botanical evidence) 
  - Resilience theory struggles with thresholds (when does transformation become collapse?) 

  User's doing important work here. The real test is whether their final theory can make Rapa Nui revisionists and traditionalists generate mutually exclusive predictions. That's when you know it's science, not just semantics.
answer: |-
  ### A. Requirements for a Scientific Theory of Societal Collapse  
  *(With grounding cases/considerations)*  

  1. **Multi-Scalar Specificity**: Must define *which level* of society is collapsing (e.g., elite institutions, population density, regional integration) and allow for concurrent stability/expansion at other scales.  
     *Case: Maya "collapse" (southern dynasties fail; northern cities thrive; Maya culture persists).*  

  2. **Material Falsifiability**: Must generate testable expectations for the *archaeological record* (e.g., settlement hierarchies, paleoecological proxies, skeletal stress markers, artifact distributions), not rely solely on textual or epigraphic silence.  
     *Case: Rapa Nui (ecocide vs. rat-driven deforestation theories require conflicting paleobotanical/pollen evidence).*  

  3. **Graded Severity Threshold**: Must define quantifiable thresholds for "collapse" as *significant, rapid, enduring reduction* in key societal functions (e.g., >50% population decline in <3 generations; irreversible loss of institutional complexity), rejecting binary "all-or-nothing" criteria.  
     *Case: Late Bronze Age (palace systems vanish rapidly; Egypt persists; non-elite life continues).*  

  4. **Elite-Population Distinction**: Must explicitly separate the fate of ruling institutions (e.g., tax extraction, monument-building) from general welfare (e.g., nutrition, household resilience), allowing for divergence.  
     *Case: Post-Roman Britain (state apparatus dissolves; skeletal data suggest improved peasant nutrition).*  

  5. **Causal Neutrality**: Must accommodate endogenous *or* exogenous drivers (e.g., environmental shift, invasion, internal conflict) without presuming self-destruction, and require evidence of *mechanism* beyond correlation.  
     *Case: Rapa Nui (must distinguish internal resource depletion from rat-driven or colonial disruption).*  

  6. **Comparative Baseline**: Must measure change against the society’s own prior trajectory and regional contemporaries, avoiding presentist or universalist benchmarks.  
     *Case: Late Bronze Age (collapse is abrupt relative to prior complexity but regionally patchy; Egypt provides counter-trajectory).*  

  7. **Temporal Bounds**: Must specify *duration* for "rapidity" (e.g., ≤120 years for institutional collapse) and distinguish collapse from long-term decline or transformation.  
     *Case: Post-Roman Britain (imperial systems dissolved over centuries; too slow for "event" but fits institutional collapse).*  

  ---

  ### B. Non-Negotiables, Tensions, and Strictest Requirement  
  - **Non-Negotiable**: (2) Material Falsifiability, (4) Elite-Population Distinction, (6) Comparative Baseline.  
    *Without these, "collapse" is a post-hoc narrative, not a testable framework.*  
  - **Research Prejudices**:  
    - Catastrophism: Assumes rapidity (7) and societal totality (rejected by 1,4).  
    - Resilience School: Rejects "collapse" as valid category unless irreversible (challenged by 3,7).  
  - **Key Tension**: Demanding (1) Multi-Scalar Analysis + (3) Graded Severity + (7) Temporal Bounds risks *over-specification*:  
    - *E.g., "Rapid elite collapse with slow demographic decline" (Maya) might be excluded if theory requires synchrony.*  
  - **Strictest Requirement**: (2) Material Falsifiability.  
    *Eliminates theories that retrofit explanations to evidence (e.g., Diamond’s ecocide) without predictive expectations.*  

  ---

  ### C. Theoretical Scorecard (Brief)  
  - **Tainter (Diminishing Returns on Complexity)**:  
    Fails (1) by conflating elite and societal complexity; struggles with (4) as peasant welfare is irrelevant. Strong on (3) thresholds but weak on (2) testability (how to measure "returns" materially?).  
  - **Diamond (Ecocide)**:  
    Violates (2) by often ignoring counter-evidence (e.g., Rapa Nui’s later societal recovery); assumes (5) endogenous blame. Fails (6) by applying modern ecological standards.  
  - **Resilience/Transformation View**:  
    Rejects "collapse" as analytic category, thus fails (3) severity thresholds. Strong on (1) multi-scalarity but weak on (7) temporal bounds (can recast any collapse as "adaptive cycle").  

  ---  
  **Final Note**: A robust theory must treat collapse as *a process of de-institutionalization*, measurable through material proxies (requirement 2), separable from demographic or cultural continuity (4), and comparable across cases only with explicit baselines (6). The Maya case exemplifies institutional collapse without societal extinction; Britain shows elite failure coinciding with non-elite resilience. If the theory cannot handle these divergences, it remains a prop.
