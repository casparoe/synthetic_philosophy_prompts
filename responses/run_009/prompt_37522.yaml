answer: |-
  **Essay Question**  
  Consider two scenarios. In Case A, a subject named Jamie investigates whether a particular mushroom is safe to eat. Initially, Jamie’s practical stakes are low (mild curiosity), but later, Jamie’s stakes become extremely high (life-threatening allergy discovered). Throughout, two friends independently discuss Jamie’s epistemic state in a consistent casual conversation. In Case B, a subject named Sam consistently has low practical stakes while investigating whether a bank is open on Saturday. Two different groups discuss Sam’s epistemic state: Group 1 in a relaxed chat at a café, Group 2 in a formal legal deposition. For each case:  
  1. Explain what a contextualist, an interest-relative invariantist (IRI), and a classical invariantist would predict about whether third-party attributors (the friends in Case A, Groups 1/2 in Case B) would assert "Sam/Jamie knows the bank/mushroom fact."  
  2. Explain how each theorist would analyze a *disagreement* between the two attributors in each case (e.g., Friend 1 says "Jamie knows," Friend 2 says "Jamie doesn’t know" in Case A; Group 1 says "Sam knows," Group 2 says "Sam doesn’t know" in Case B).  
  Crucially, justify your answers by referencing *whose* context (subject’s or attributor’s) each theory deems relevant to the truth of knowledge attributions. Avoid discussing first-person assertions.  

  ---

  **Model Answer (595 words)**  

  **Case A (Subject’s Stakes Shift, Attributors’ Context Fixed)**  
  *Third-party attributions:*  
  - **Contextualist:** Attributions depend solely on the attributors’ conversational standards. Since the friends’ context remains fixed (low-stakes casual chat), their knowledge attributions should *not change* despite Jamie’s rising stakes. Both would likely assert "Jamie knows" pre-stakes and post-stakes, as the subject’s context is irrelevant.  
  - **IRI (Interest-Relative Invariantist):** Knowledge depends solely on the *subject’s* practical situation. When Jamie’s stakes are low, both friends correctly assert "Jamie knows." When stakes rise, Jamie no longer knows (due to higher epistemic standards), so both friends *should* assert "Jamie doesn’t know" (though they might err if unaware of the stakes change).  
  - **Classical Invariantist:** Knowledge is stakes-invariant. Both friends would assert "Jamie knows" pre- and post-stakes shift, provided Jamie’s evidence is sufficient by fixed epistemic standards (e.g., true belief + justification).  

  *Disagreement:*  
  - **Contextualist:** Since attributors share a fixed context, they *shouldn’t genuinely disagree*. If Friend 1 says "knows" and Friend 2 says "doesn’t know," this reflects incoherence or error within a single context.  
  - **IRI:** Both attributors refer to the same fact (Jamie’s knowledge state). If they disagree post-stakes-shift, one is *wrong* (e.g., if Friend 1 says "knows" but Jamie’s high stakes negate knowledge, Friend 1 is mistaken).  
  - **Classical Invariantist:** Any disagreement implies one attributor is incorrect about Jamie’s invariant epistemic status.  

  **Case B (Attributors’ Context Shifts, Subject’s Stakes Fixed)**  
  *Third-party attributions:*  
  - **Contextualist:** Attributions track the attributors’ contexts. Group 1 (low-stakes café chat) will assert "Sam knows." Group 2 (high-stakes deposition) will assert "Sam doesn’t know" due to raised conversational standards. Sam’s low stakes are irrelevant.  
  - **IRI:** Knowledge depends on *Sam’s* low stakes. Both groups *should* assert "Sam knows," as Sam’s context fixes the truth. Group 2’s high-attributor-stakes don’t affect whether Sam knows.  
  - **Classical Invariantist:** Sam knows iff justified true belief obtains (stakes-irrelevant). Both groups would assert "Sam knows," assuming Sam meets invariant standards.  

  *Disagreement:*  
  - **Contextualist:** Group 1 and Group 2 aren’t genuinely disagreeing because "knows" has different meanings in their contexts (like "tall" meaning different heights for jockeys vs. basketball). Their assertions are both true relative to their own standards.  
  - **IRI:** The groups *are* disagreeing about the same fact (Sam’s knowledge state). Since Sam’s low stakes make "Sam knows" true, Group 1 is correct and Group 2 is wrong.  
  - **Classical Invariantist:** Like IRI, disagreement implies one group is factually mistaken, as knowledge is context-invariant.  

  **Key Divergence:** Contextualism ties truth to *attributor context*; IRI ties it to *subject context*. When subject/attributor contexts diverge (Cases A and B), predictions clash:  
  - In Case A (subject-context shift), *only IRI* predicts attributor verdicts will change.  
  - In Case B (attributor-context shift), *only contextualism* predicts attributor verdicts will differ.  
  Classical invariantism ignores both shifts. Disagreement analysis further exposes this: Contextualism allows faultless disagreement across contexts; IRI and invariantism require one side to be wrong.  

  ---

  **Marking Scheme (20 marks total)**
  A/B threshold (14/20) hinges on correctly distinguishing theories when subject/attributor contexts diverge. Marks allocated as follows:  
  **Case A Predictions (8 marks):** Contextualist (attributor-context fixed → no change in attributions, 2 marks). IRI (subject-stakes shift → attributions *must* change, 2 marks). Classical invariantist (no change, 1 mark). *Common error: Saying contextualism responds to subject-stakes in Case A (-2).*  
  **Case A Disagreement (3 marks):** Contextualist (no genuine disagreement, 1 mark). IRI/invariantist (disagreement implies error, 1 mark each). *Common error: Claiming contextualists see "true for each" in a fixed context (-1).*  
  **Case B Predictions (5 marks):** Contextualist (attributor-context shift → differing attributions, 2 marks). IRI (subject-stakes fixed → same attributions, 2 marks). Invariantist (same attributions, 1 mark). *Common error: Having IRI respond to attributor-stakes (-2).*  
  **Case B Disagreement (3 marks):** Contextualist (faultless disagreement, 1 mark). IRI/invariantist (disagreement implies error, 1 mark each). *Common error: Treating IRI like contextualism in cross-context disagreement (-2).*  
  **Theoretical Divergence (1 mark):** Explicitly stating contextualism cares about attributor context, IRI about subject context. *Common error: Conflating whose stakes matter (-1 if ambiguous, -2 if reversed).*  

  **Note:** A-grade responses (18–20) will crisply isolate the subject/attributor divergence in both cases. B-grade (14–17) may have minor inaccuracies but avoid core conflation. Below 14 indicates persistent confusion between contextualism and IRI.
