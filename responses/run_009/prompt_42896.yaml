prompt: |-
  I work in health economics, and there is a pattern in resource allocation I keep running into without a name for it. Take two patients with the same objective condition. One is devastated by it; the other has lived with it for years, reports being fairly content, and scores near the healthy population on every welfare instrument we use. If a scarce treatment is allocated by welfare gain, the first patient gets it every time, and the second only when no unadapted patient is in the queue. What bothers me is the incentive structure: the surest way to be prioritized for future care is to stay as miserable as your condition allows, and the rule quietly punishes people for coping. The same logic appears anywhere allocation keys off welfare deltas rather than levels — disaster relief, workplace accommodations, and so on. I know Nozick's utility monster, and this looks like its photographic negative: the monster absorbs resources because his welfare rises steeply with them, whereas these patients lose out because theirs barely rises at all. Colleagues sometimes mutter about sour grapes when this comes up, but that seems to be a worry about whether the contented patient's happiness is genuine — a different question from who should get the pill. So: is there an established term for this configuration, in which an allocation rule deprioritizes you precisely because you have adapted to your condition? If there is, I want to know exactly what it covers and how it relates to the sour-grapes worry and to the utility monster; if not, coin one and define its boundaries — does it extend to people who were never badly off and are simply cheerful by temperament, and does it survive under a rule that prioritizes the worst-off rather than the biggest gainer? Please also say what argument or consideration would most plausibly change your verdict that this is a distinct phenomenon rather than the sour-grapes problem in distributional dress. End with a line of the form \answer{...} containing the term you settle on, or "no established term" if you conclude none exists.
reasoning: |-
  Okay, let me approach this health economics problem step by step. The user describes a resource allocation paradox where patients who adapt well to their condition get deprioritized for treatment because they show smaller welfare gains - creating perverse incentives against coping. 

  First, I need to map the conceptual territory. This clearly relates to but inverts Nozick's utility monster: instead of someone who gains excessively from resources, we have patients whose adaptation minimizes measurable gains. The "sour grapes" comparison is noted but seems distinct - that's about authenticity of preferences, while this is about allocation mechanics.

  The core issue appears to be the metric used: welfare deltas versus levels. The user asks whether this phenomenon has an established name. Recalling economic literature, terms like "adaptation paradox" or "well-being adaptation bias" come to mind, but none seem canonical. I should verify this - perhaps in health economics specifically it has a designation.

  Considering scope: would this apply to naturally cheerful people too? Probably yes, if the allocation rule similarly discounts their potential welfare gains. And switching to prioritizing the worst-off (maximin) rather than biggest gainers might mitigate but not eliminate the issue - the adapted patient still risks being seen as "not suffering enough."

  The key distinction from sour grapes: one questions the validity of reported happiness (is it resignation?), while this problem persists even if adaptation is fully authentic. To test this, imagine both patients' welfare assessments are equally credible - the allocation dilemma remains.

  For naming, since no term jumps out as standard, I'll propose "adaptive deprivation penalty" - capturing both the coping mechanism and the resulting disadvantage. The boundaries should include any case where successful adaptation reduces resource priority, whether through psychological coping or innate temperament.

  Final confirmation: yes, the phenomenon stands apart. The strongest counterargument would be if all adaptation were considered inauthentic - but that collapses into sour grapes territory, which the user correctly separates.
answer: |-
  This phenomenon lacks a single, universally established term in health economics or distributive justice literature, but it intersects with several well-known concepts. Here's a breakdown:

  1.  **Core Phenomenon:** The allocation rule (prioritizing *welfare gain*) systematically disadvantages individuals who have successfully adapted to their disadvantageous condition, as their potential welfare improvement from treatment is smaller. This creates a perverse incentive against psychological adaptation/coping.

  2.  **Relation to Known Concepts:**
      *   **Utility Monster (Inverse/Photographic Negative):** As you note, this is the inverse of Nozick's utility monster. The utility monster consumes resources because it gains immense utility per unit; the adapted patient is denied resources because it gains minimal utility per unit *despite having a significant objective need*. The core similarity is the allocation rule's sensitivity to marginal utility differences leading to potentially counterintuitive or unfair outcomes.
      *   **Sour Grapes:** While colleagues invoke sour grapes (adaptation as lowered preferences due to resignation), this is distinct. Sour grapes questions the *authenticity* or *normative weight* of the adapted patient's reported well-being ("Are they *truly* happy, or just resigned?"). Your problem arises *even if* the adaptation and reported well-being are fully authentic and normatively valid. The allocation rule's structure itself causes the deprioritization and perverse incentive, independent of whether the happiness is "sour grapes" or genuine resilience.
      *   **Adaptation Problem/Paradox:** This is a broader term in well-being research referring to the difficulty of measuring welfare when people adapt to circumstances. Your phenomenon is a specific *distributive consequence* of this problem under gain-based allocation rules.
      *   **Response Shift:** In health psychology/outcomes research, "response shift" describes how patients' internal standards, values, or conceptualizations of QoL change due to illness/adaptation, making longitudinal comparisons (like gain) complex. Your scenario exemplifies a distributive impact of response shift under gain-maximization rules.

  3.  **Proposed Term & Definition:** Given the lack of a single established term, the most descriptive coinage is:
      **Adaptive Deprivation Penalty (ADP)**
      *   **Definition:** The systematic disadvantage in resource allocation under rules prioritizing marginal welfare gains experienced by individuals who have successfully psychologically adapted to an adverse objective condition, resulting in smaller predicted welfare improvements from intervention compared to non-adapted individuals with the same objective need. This creates a perverse incentive against adaptation.
      *   **Boundaries:**
          *   **Applies to:** Individuals who *were* objectively worse off and adapted (your core case), and *also* to individuals who were never badly off but have a cheerful temperament *if* that temperament leads to a smaller predicted welfare gain from the intervention compared to a more distressed person with the same objective condition. The core trigger is the *smaller predicted welfare delta*, regardless of *why* the delta is small (adaptation, temperament, baseline resilience).
          *   **Survival under "Worst-Off" Rule (Maximin):** The ADP *diminishes significantly* but may not vanish entirely under a strict "prioritize the worst-off" (maximin) rule based on *welfare levels*. The adapted patient likely has a *higher welfare level* than the non-adapted patient despite the same objective condition. If the rule strictly targets the *lowest absolute welfare level*, the devastated patient still gets priority. However, if the rule incorporates *objective severity* alongside welfare levels, or if there's skepticism about the authenticity of the adapted patient's well-being (sour grapes concern creeping in), the adapted patient might *still* face some disadvantage, though the perverse incentive against coping is greatly reduced.

  4.  **Distinctness from Sour Grapes:** The strongest argument that ADP is distinct from the sour grapes problem is: **The perverse incentive and deprioritization occur *even if* the adapted patient's well-being is genuine, stable, fully autonomous, and normatively valid.** Suppose we incontrovertibly accept the adapted patient's reported contentment as authentic resilience, not cognitive dissonance or false consciousness. The gain-maximizing rule *still* deprioritizes them because their potential gain is smaller. The rule's mechanics, not a judgment about their preferences, cause the penalty and the incentive. Sour grapes is a challenge *to the premise* of the patient's welfare state; ADP is a consequence *of the allocation rule's structure* given that welfare state (even if authentic).

  **Conclusion:** While related to adaptation problems, response shift, and the utility monster, the specific distributive penalty for adaptation under gain-maximizing allocation rules lacks a single established name. "Adaptive Deprivation Penalty" (ADP) captures its core elements: the disadvantage arises from successful adaptation, leading to deprivation of resources under specific allocation rules. It persists under gain-maximization for temperamentally cheerful individuals and is distinct from sour grapes because it stems from the rule's logic, not necessarily doubts about the authenticity of well-being.

  \answer{Adaptive Deprivation Penalty}
