prompt: |-
  I've been working through the William James / W. K. Clifford exchange in a seminar on the ethics of belief — Clifford's idea that believing on insufficient evidence is always a kind of misconduct, and James's reply that when evidence cannot settle the matter in time, and believing is itself part of what makes the believed thing true, we are entitled to let our passional nature decide. I have my own gut verdicts on a spread of cases, and I can't tell whether they add up to something like James's principle, something like Clifford's with exceptions carved in, or just plain inconsistency. I'd like you to tell me what principle, if any, captures the pattern, and to be candid about which of my verdicts it has to overturn.

  My verdicts, roughly in order of how confident I feel: a jury member who becomes convinced of guilt because the prosecutor is eloquent is doing something wrong, full stop. A friend relays a serious accusation about someone I know, and I simply believe it on their word without checking anything — wrong, even though the friend is usually reliable. A graduate student who believes his hypothesis will pan out before there is any evidence, so as to sustain years of grinding work on it — fine, that seems like part of how research has to work. A climber in trouble who must believe he can make a jump, since the belief itself is what steadies him — fine; this is practically James's own case. A dying woman who believes, without evidence, that she will see her dead husband again — fine, though nothing whatever hangs on it, which is awkward for the Jamesian story. An investor who believes a startup will succeed mainly because the founder's conviction is contagious — not fine, though this one makes me uneasy, since venture investing seems to run partly on exactly such beliefs. A student who believes he will pass an exam without evidence, where the confidence marginally improves performance but mostly substitutes for studying — not fine. And here is my problem: that belief is partly self-fulfilling, like the climber's, yet it seems clearly wrong.

  My tentative principle, which I cannot get to cover everything: it is wrong to believe on insufficient evidence, except (a) where the evidence cannot be obtained in time and something depends on believing now, and (b) where being wrong would cost no one anything. This saves the climber under (a), the dying woman under (b), and it condemns the jury member, the accusation case, and the investor. The grad student is the one I keep going back and forth on — perhaps belief there isn't really belief but something more like a working commitment, or perhaps he just falls under (a). But the student defeats the principle outright: clause (a) arguably applies to him too, since the exam is coming, the evidence isn't in yet, and his confidence does improve his chances. So either (a) needs a further condition — perhaps that the belief must not crowd out available means of improving the outcome, or that its self-fulfilling effect must not be swamped by what gathering evidence could achieve — or my verdict on the student has to go.

  So, three requests. First, state the best principle you can find, precisely, with each clause tied to the case that motivates it, and say plainly whether the result is closer to Clifford, closer to James, or neither. Second, apply it to two cases I haven't given verdicts on: a coach who sincerely believes in a mediocre player, where the belief lifts that player's performance but also leads the coach to start him over a better teammate; and a terminally ill person who believes an unevidenced experimental treatment will work, where the belief sustains her hope but delays her move into palliative care. Third, tell me honestly which of my verdicts your principle cannot save, and whether I should prefer it to some more complicated, verdict-saving alternative — I would rather hear that one of my gut reactions is wrong than end up with a principle so riddled with exceptions that it explains everything and forbids nothing.
reasoning: |-
  Hmm, this is a deep and nuanced ethics of belief question stemming from the James-Clifford debate. The user has presented a series of carefully considered cases with their intuitive verdicts and is struggling to find a consistent principle that captures their judgments. They're clearly well-versed in the philosophical background and are wrestling with genuine intellectual tension.

  The core challenge here is reconciling Clifford's strict evidentialism with James' more permissive approach regarding "live, forced, and momentous" options. What's interesting is how the user's intuitions aren't purely aligned with either position - they condemn some non-evidential beliefs (like the juror) while endorsing others (like the climber). Their provisional principle shows they're trying to carve out exceptions systematically.

  The student case seems to be the real sticking point - it shares the self-fulfilling structure of the climber case but feels wrong to the user. This suggests we need to look beyond just the self-fulfilling aspect and consider factors like opportunity costs or whether the belief functions as a substitute for evidence-gathering actions. The investor case is similarly tricky because while venture capital does operate on gut feelings, there are real consequences when those beliefs are wrong.

  For the two new cases: the coach scenario introduces conflict between individual benefit and team welfare, while the terminal illness case forces us to weigh psychological benefits against medical realities. Both highlight how belief consequences extend beyond the believer.

  I should probably develop a principle that distinguishes between:
  1) Beliefs that primarily affect the believer (climber, dying woman)
  2) Beliefs that affect others (juror, friend, investor)
  3) Beliefs that involve opportunity costs (student, medical case)
  With special consideration for when evidence is truly unavailable versus merely inconvenient to obtain.

  The grad student case might be salvaged by noting that scientific hypotheses are inherently falsifiable and the belief is methodological rather than dogmatic. Whereas the student's exam belief actively discourages evidence-gathering (studying).
answer: |-
  Your struggle to reconcile these cases is philosophically profound and reveals genuine tensions in the ethics of belief. After analyzing your verdicts and the James/Clifford framework, here’s the best principle I can construct, followed by its application and implications for your judgments.

  ---

  ### **The Proposed Principle**  
  **It is epistemically impermissible to believe *p* on insufficient evidence unless:**  
  1. **The belief is *pragmatically necessary*:** Evidence cannot resolve *p* within the required timeframe, *and* believing *p* is instrumentally essential to achieving a vital outcome.  
  2. **The belief is *self-confined*:** If *p* is false, the costs of false belief fall primarily on the believer, without unjustly harming others or precluding better-evidenced alternatives.  
  3. **The belief is *non-substitutive*:** It does not replace accessible, evidence-seeking actions that would more reliably secure the desired outcome.  

  **Alignment:** This is *Jamesian in structure* (permitting passional belief when evidence is incomplete and stakes are high) but *Cliffordian in constraints* (demanding harm-avoidance and non-interference with evidence). It rejects Clifford’s absolute prohibition but imposes stricter limits than James’s "live, forced, momentous" criterion.  

  ---

  ### **Application to Your Cases**  
  | Case                          | Verdict | Principle’s Judgment | Reasoning |  
  |-------------------------------|---------|----------------------|-----------|  
  | Jury member                   | Wrong   | **Wrong**            | Violates *self-confined*: Unjust harm to defendant if false. |  
  | Friend’s accusation           | Wrong   | **Wrong**            | Violates *non-substitutive*: Evidence (e.g., fact-checking) is accessible and owed to accused. |  
  | Grad student                  | Fine    | **Permissible**      | *Pragmatically necessary* (sustains vital effort); *self-confined* (costs fall on student); *non-substitutive* (belief enables evidence-gathering). |  
  | Climber                      | Fine    | **Permissible**      | *Pragmatically necessary* (jump requires confidence); *self-confined* (only climber at risk). |  
  | Dying woman                   | Fine    | **Permissible**      | *Self-confined* (no harm to others); no *non-substitutive* violation (no better alternatives exist). |  
  | Investor                     | Not fine | **Wrong**            | Violates *non-substitutive*: Evidence (due diligence) is accessible and ignored; violates *self-confined* (others’ money at stake). |  
  | Exam student                 | Not fine | **Wrong**            | Violates *non-substitutive*: Belief substitutes for studying (an evidence-adjacent action). *Not pragmatically necessary*: Studying is more reliable than confidence. |  

  ---

  ### **New Cases**  
  1. **The Coach**  
     - **Verdict:** **Wrong** under the principle.  
     - **Why:** Violates *self-confined* (harms better teammate’s opportunity) and *non-substitutive* (evidence of player’s mediocrity is available but ignored). Belief’s benefit to one player is outweighed by unfairness to team.  

  2. **Terminal Illness & Experimental Treatment**  
     - **Verdict:** **Not permissible** under the principle.  
     - **Why:** Violates *non-substitutive* (delaying palliative care precludes a better-evidenced alternative for well-being). Also, false belief risks significant harm (*self-confined* only if solely affects believer, but palliative delay often impacts families).  

  ---

  ### **Where Your Verdicts Must Be Overturned**  
  The principle **cannot save two of your verdicts**:  
  1. **Graduate Student**: You judged this "fine," but the principle *permits it* only under strict conditions: the hypothesis must be testable, and belief must not deter falsification attempts. If the student ignores counterevidence, it becomes *non-substitutive* and impermissible.  
  2. **Investor**: You felt uneasy condemning this due to VC culture, but the principle deems it *wrong*. Your unease hints at industry norms, but Clifford would argue such norms are ethically corrupt.  

  **Should you prefer this principle to a verdict-saving alternative?**  
  Yes. A principle that preserves all your intuitions would be ad hoc (e.g., "Belief is wrong except in Cases X, Y, Z"). Yours are *mostly* consistent, but the **exam student case** exposes a tension: you reject his belief because confidence "mostly substitutes for studying." This intuition is sound and generalizable. The principle honors it via *non-substitutivity*, which also resolves your unease about the investor. Sacrificing the grad student’s unconditional permissibility is a strength: it distinguishes *methodological optimism* (permissible) from *self-deception* (impermissible).  

  ---

  ### **Conclusion**  
  Your gut reactions align with a **modified Jamesianism** that prioritizes:  
  - **Agency** (beliefs that enable action when evidence is scarce)  
  - **Harm mitigation** (beliefs that avoid burdening others)  
  - **Epistemic responsibility** (beliefs that don’t block better routes to truth).  

  Clifford’s ghost lingers in the constraints, but James’s insight—that some truths are *made* by belief—survives in the *pragmatic necessity* clause. The overturned verdicts are a feature, not a bug: they reveal where context (e.g., grad science norms) might have swayed you, but the principle holds firm. If this feels right, it’s closer to James with Clifford’s guardrails. If not, we may need to refine *non-substitutivity*—but I argue it’s the keystone.
