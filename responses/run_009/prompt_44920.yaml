prompt: |-
  PhD student in political philosophy here, chapter on prioritarianism, and before I go hunting for what weighting functions people actually propose I want the spec first. Assume the leveling-down objection is fatal for telic egalitarianism, so we go the prioritarian route: a benefit matters more the worse off its recipient is. What would an adequate prioritarian weighting scheme have to deliver? I have candidate requirements of my own but I suspect half of them are just egalitarian intuitions I haven't let go of yet. Things like: moral value of a benefit must be concave in the recipient's absolute welfare level (and not just a function of their rank relative to others — that distinction needs to be made precise and defended, since only the absolute version lets you evaluate one person in isolation); the scheme should be seperable across persons so you can score subgroups, which is arguably what separates prioritarianism from egalitarianism in disguise; it should say a tiny gain to someone at level 2 beats a huge gain to someone at level 90, but also give an answer to the mirror case (a one-unit gain to the very worst off vs. a life-transforming gain just above them) that I won't immediately regret. Give me the list with the case or consideration behind each, flag which are non-negotiable and which are camp prejudices, and tell me where the list becomes jointly unsatisfiable if it does — I specifically want to know whether separability and any anti-tyranny-of-the-worst-off requirement can coexist, since that's exactly where my chapter is stuck.
reasoning: |-
  Okay, the user is a PhD student in political philosophy working on a chapter about prioritarianism. They need to understand the essential requirements for a prioritarian weighting scheme, distinguishing necessary features from egalitarian biases. They mentioned the leveling-down objection as a reason to reject telic egalitarianism, so they're focused on prioritarianism where the moral weight of a benefit depends solely on the absolute welfare level of the recipient, not relative standing.

  First, I need to outline the core features of prioritarianism. The key is that the weighting function must be strictly concave and agent-separable. This means each person's welfare is transformed by a concave function before summing, which ensures that benefits to the worse-off count more. The separability is crucial because it allows evaluating policies affecting subgroups without considering unaffected individuals, which is a main difference from egalitarianism.

  The user has specific concerns. They want to ensure the scheme isn't just egalitarianism in disguise, so emphasizing separability and the absolute welfare focus is important. They also worry about the tyranny of the worst-off, where small gains to the very worst-off might outweigh large gains to others. I need to address whether separability and avoiding such tyranny can coexist.

  Looking at the requirements: Strict concavity is non-negotiable for prioritarianism. Separability is also essential to distinguish it from egalitarianism. However, when considering lexical thresholds or other methods to prevent tyranny, separability might be threatened. For instance, if a scheme prioritizes the worst-off lexically, adding a well-off person could change outcomes, violating separability.

  The user's deeper need is likely resolving the tension in their chapter. They might be stuck between theoretical purity (separability) and practical moral intuitions (avoiding extreme sacrifices for the worst-off). They need to know if these can be reconciled or if they must choose one. I should highlight that while standard prioritarianism maintains separability, addressing tyranny requires modifications that may compromise it, like weighted prioritarianism or contextual approaches.

  Also, the user mentioned concave functions in absolute welfare, not rank-based. This is vital because prioritarianism focuses on individual welfare levels independently. They need to defend this against relativist approaches. The absolute focus allows evaluating single-person cases, which is a strength.

  Case analyses are useful here. Using examples like the worst-off at level 2 versus someone at 90 shows how concavity works. The mirror case—small gain to the worst-off versus large gain to someone slightly better—tests the limits of concavity. If the weighting function is too steep, it could lead to counterintuitive results. The challenge is balancing sufficient weight for the worst-off without neglecting others' significant gains.

  I should summarize the core requirements, note where tensions arise (especially separability vs. anti-tyranny), and suggest possible solutions like adjusting the concavity parameter or accepting trade-offs. Emphasize that while separability is fundamental, addressing tyranny might require additional principles outside strict prioritarianism.
answer: |-
  Here's a breakdown of prioritarian weighting scheme requirements, grounded in the core idea and designed to distinguish it from telic egalitarianism. I'll categorize them, provide the rationale, flag negotiability, and address your specific tension point.

  **Core Non-Nnegotiable Requirements (Defining Prioritarianism Itself):**

  1.  **Strict Concavity in Absolute Welfare:**
      *   **Requirement:** The moral value (weight) of a marginal benefit to an individual must be a strictly decreasing and concave function *solely* of that individual's absolute welfare level. Formally, if `w(u)` is the transformation function (weighting welfare `u`), then `w'(u) > 0` (monotonicity), `w''(u) < 0` (strict concavity).
      *   **Rationale:** This captures the core prioritarian intuition: benefits matter more the *worse off* (lower absolute welfare `u`) the recipient is. It directly implies diminishing marginal moral value of welfare. Crucially, `w(u)` depends *only* on `u`, not on anyone else's welfare level. This allows evaluation of single-person cases ("Is it better for this destitute person to receive $100 or for this millionaire?") and is fundamentally distinct from rank-based egalitarianism. **Non-negotiable.** This *is* prioritarianism.

  2.  **Agent-Separability / Additivity:**
      *   **Requirement:** The overall moral value of a state of affairs must be the *sum* of the transformed individual welfare values: `W = Σ w(u_i)`. The value assigned to any subgroup is independent of the welfare levels of individuals *not* in that subgroup.
      *   **Rationale:** This is the primary formal distinction from telic egalitarianism. Egalitarianism cares about *relations* between individuals (inequality), making the value of a benefit to A inherently depend on B's welfare. Prioritarianism cares about A's absolute level *alone* when assigning weight to A's benefit. Separability allows for consistent partial evaluations and avoids the "contextualism" of egalitarianism. **Non-negotiable.** Without this, you collapse back into a form of relational egalitarianism.

  **Highly Desirable (Often Treated as Core, But Theoretically Debated):**

  3.  **Pareto Principle Compatibility:**
      *   **Requirement:** A pure Pareto improvement (at least one person better off, no one worse off) must be judged as morally better.
      *   **Rationale:** Captures a fundamental intuition of beneficence/welfarism. Prioritarianism with strict concavity and additivity naturally satisfies Pareto Efficiency (weak and strong). **Effectively Non-negotiable for plausible prioritarianism.** Violating Pareto is deeply counterintuitive and hard to defend.

  4.  **Continuity:**
      *   **Requirement:** The weighting function `w(u)` is continuous over the relevant welfare range. Small changes in welfare lead to small changes in moral weight. No "cliffs" or discontinuous jumps in weight.
      *   **Rationale:** Prevents counterintuitive results where an infinitesimal welfare difference leads to radically different moral weightings. Ensures robustness and avoids arbitrariness. **Widely accepted as necessary for plausibility.** Violations feel ad hoc.

  **Important But Contextual/Parameter-Dependent Requirements (The Battleground):**

  5.  **Sufficient Sensitivity to the Worst-Off:**
      *   **Requirement:** The weighting function must assign *sufficiently* higher weight to benefits for the very worst-off compared to the very well-off such that:
          *   A small benefit to someone at `u=2` outweighs a very large benefit to someone at `u=90`.
          *   A life-saving/life-transforming benefit for someone moderately badly off (e.g., `u=15`) outweighs a small luxury gain for a very well-off person (e.g., `u=85`).
      *   **Rationale:** Captures the core prioritarian motivation - giving genuine priority to the worst-off. If the concavity is too weak, prioritarianism loses its distinctive bite and becomes practically indistinguishable from utilitarianism for many cases.
      *   **Case:** `Benefit A`: +0.1 units to person at `u=2`. `Benefit B`: +50 units to person at `u=90`. Prioritarianism *must* favor A for plausible weighting functions (e.g., square root, log).
      *   **Status:** **Essential to the spirit of prioritarianism, but the *degree* is parameter-dependent.** The threshold for "sufficiently" is where debate happens.

  6.  **Avoiding Absolute Tyranny of the Worst-Off (The Mirror Case Challenge):**
      *   **Requirement:** The weighting function must *not* be *so* steeply concave that:
          *   A minuscule benefit (e.g., +0.001 units) to the single absolute worst-off person (e.g., `u=1`) *always* outweighs *any* finite benefit, no matter how large and life-transforming, to someone else who is only *slightly* better off (e.g., `u=1.1`).
      *   **Rationale:** While priority is given, it shouldn't become absolute lexical priority. This violates strong intuitions about the diminishing *moral* returns of helping someone who is *extremely* badly off when the alternative is helping someone else who is *also* extremely badly off, just marginally less so, in a massively significant way. It feels like irrational neglect.
      *   **Case (Mirror Case):** `Benefit C`: +1 unit to the single worst-off person at `u=1` (e.g., saves them from a minor temporary discomfort). `Benefit D`: +1000 units to the person at `u=2` (e.g., transforms their life from abject misery to modest but decent flourishing). Must `w(1+1) - w(1) > w(2+1000) - w(2)` hold? Many find it implausible that `C` *must* always win.
      *   **Status:** **Crucial for plausibility, but challenging.** This is where your tension with separability becomes acute. *Strict concavity alone doesn't prevent this* (e.g., `w(u) = -1/u` would exhibit tyranny). Avoiding it requires careful choice of the *degree* of concavity or the functional form.

  **Potential Egalitarian Hangovers / Camp Prejudices (Be Wary!):**

  7.  **Relational Comparisons Creeping In:**
      *   **Suspicious Requirement:** "The scheme should favor reducing inequality *as such*." or "The weight difference between A and B should depend on the gap `u_A - u_B`."
      *   **Why Suspicious:** This reintroduces the relational element that separability explicitly banishes. Prioritarianism cares about A's low absolute level, not that A is worse off *than B*. Focusing on gaps or inequality reduction *per se* is telic egalitarianism's domain. **Reject this.** If your intuition pushes here, it's likely egalitarian residue.

  8.  **Intransitivity of 'Worse Off' Groups:**
      *   **Suspicious Requirement:** "Helping a subgroup that is worse off than another subgroup should always take priority, even if the absolute levels are considered."
      *   **Why Suspicious:** Defining "worse off subgroup" inherently requires aggregating or comparing individuals *relationally* (e.g., average? median? min?). Prioritarianism evaluates benefits based on *each individual's absolute level within the scheme*. The separability requirement (`Σ w(u_i)`) doesn't care about subgroup comparisons, only about the sum of the transformed welfares of the individuals affected. **Reject this as a requirement; it violates separability.**

  **The Crucial Tension: Separability vs. Anti-Tyranny**

  *   **The Problem:** Standard prioritarianism (`W = Σ w(u_i)`, `w''(u) < 0`) is *separable by construction*. However, **avoiding absolute tyranny of the worst-off is fundamentally in tension with strict concavity *and* separability when comparing gains to individuals at *very* low but *different* absolute levels.**
  *   **Why?** Separability means the value of giving a benefit to the person at `u=1` depends *only* on `w(1 + Δu) - w(1)`. The value of giving a huge benefit to the person at `u=2` depends *only* on `w(2 + Δu_large) - w(2)`. There are no other individuals in the calculation to provide context or dilute the extreme marginal weight at `u=1`.
  *   **The Result:** If `w(u)` is sufficiently steeply concave near zero (e.g., `w(u) = -1/u`, `w(u) = ln(u)` near `u=0`), then `w'(u)` approaches infinity as `u` approaches 0. This means *any* finite gain Δu, no matter how small, given to a person at `u=ε` (where ε is infinitesimally small) will have a marginal moral value approaching infinity. This will *always* outweigh *any* finite gain Δu_large, no matter how large, given to someone at *any* `u > ε`, no matter how close `u` is to `ε`. Tyranny reigns.
  *   **Escaping Tyranny while Keeping Separability (Sort Of):**
      1.  **Flatten the Concavity:** Use a function with bounded marginal weight even at low levels (e.g., `w(u) = √(u + k)` for some constant `k > 0`, or `w(u) = u^α` for α close to 1). This avoids infinite weights but weakens priority to the worst-off significantly, potentially violating requirement 5 for some ranges. You might save the mirror case but lose the force against the `u=2` vs. `u=90` case.
      2.  **Non-Homothetic Functions:** Use functions where the concavity lessens at extremely low levels (e.g., S-shaped functions). However, these often lack elegance, introduce new parameters, and can have counterintuitive properties elsewhere (e.g., increasing marginal weight over some ranges).
      3.  **Contextual Thresholds (But Breaks Separability):** Introduce an absolute threshold below which lexical priority applies. However, adding a *different* individual above/below the threshold changes the evaluation of benefits to existing individuals, directly violating separability. (e.g., Adding a person at `u=0.5` might suddenly make the gain to the person at `u=1` less important).
      4.  **Weighted Prioritarianism (Breaks Pure Additivity):** Assign explicit weights to individuals based on absolute level *and* potentially other factors (like how many are worse off). This breaks pure additivity (`Σ w(u_i)`) and thus separability. It's a hybrid approach.
      5.  **Accept the Tyranny Near Zero:** Argue that at *sufficiently* low absolute welfare levels (true destitution), any gain *is* lexically more important than gains to those above a critical threshold. This is defensible but controversial and requires justifying the threshold.

  **Conclusion & Advice for Your Chapter:**

  1.  **Non-Negotiables:** Strict Concavity (`w''(u) < 0`), Agent-Separability (`W = Σ w(u_i)`), Pareto Compatibility. These *define* prioritarianism and distinguish it from egalitarianism.
  2.  **The Core Tension:** The conflict between **Avoiding Absolute Tyranny of the Worst-Off** (especially in the mirror case near zero) and maintaining **strict Agent-Separability** is real and deep. Standard prioritarianism struggles here.
  3.  **Your Sticking Point is Fundamental:** This tension is at the heart of critiques of prioritarianism (e.g., by Michael Otsuka, John Broome). You *cannot* fully satisfy both requirements 6 (Anti-Tyranny) and 2 (Separability) within standard prioritarianism (`Σ w(u_i)`) without compromising the strength of priority to the very worst-off (requirement 5) or accepting tyranny near zero.
  4.  **Pathways Forward:**
      *   **Acknowledge & Parameterize:** Explicitly state that the choice of `w(u)` involves a trade-off between strength of priority to the worst-off and avoiding tyranny near zero. Argue for a specific functional form (e.g., `w(u) = u^α` for 0<α<1) and an α that balances these reasonably well for a range of cases you deem important. Defend this calibration.
      *   **Explore Hybrids/Limits:** Discuss weighted prioritarianism or threshold views as responses to this problem, acknowledging they compromise pure separability. Analyze their costs and benefits.
      *   **Defend Tyranny Near Zero:** Argue that at *truly* desperate absolute welfare levels, lexical priority *is* justified. Define "truly desperate" rigorously.
      *   **Critique the Mirror Case:** Challenge the intuition behind the mirror case. Is the person at `u=2` really only "slightly better off" than the person at `u=1` in a morally relevant way? Does the absolute scale matter? (This is hard).

  **Weighting Functions You'll Encounter (Briefly):**

  *   **Power Functions:** `w(u) = u^α` (0 < α < 1). Simple, tractable. α controls concavity. Still exhibits tyranny near zero as α decreases.
  *   **Logarithmic:** `w(u) = ln(u)` or `w(u) = ln(u + k)`. Steep near zero, infinite weight at u=0. `ln(u + k)` mitigates this but weakens priority.
  *   **Square Root:** `w(u) = √u` (α=0.5). Common example. Moderate concavity.
  *   **Atkinson SWF:** `W = [Σ (u_i^{1-ε}) / (1-ε)]` for ε ≠ 1, `W = Σ ln(u_i)` for ε=1. ε is the "inequality aversion" parameter. Directly analogous to prioritarianism with `w(u) = u^{1-ε}/(1-ε)`.
  *   **Negative Exponential:** `w(u) = -e^{-βu}`. Very steep initially, flattens out. Can strongly avoid tyranny at moderate/high levels but exhibits tyranny at very low levels.

  Focus your chapter on rigorously defending the non-negotiables, honestly grappling with the separability/anti-tyranny tension (this is *the* critical issue), and carefully arguing for your chosen resolution or weighting function in light of that tension. Good luck!
