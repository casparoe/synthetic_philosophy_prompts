answer: |-
  My table saves lives by exposing harsh truths, Maren: St. Anselm's let 210 people die last year while Lakeside only lost 54 – that's cold, hard math anyone can understand, not your hypothetical adjusted mumbo-jumbo. If St. Anselm's is truly "better" despite stacking bodies seven times higher, why should we trust *their* self-serving "severity scores" that magically excuse their failures? Mom deserves the hospital with the *actual* lowest death count right there in black and white, not the one hiding behind bureaucratic coding.

  Lakeside topping the chart proves smaller and local *is* safer, period – your convoluted "within groups" argument is just St. Anselm's fancy footwork to dodge accountability for 210 grieving families. The public paid for those hospitals; they deserve the raw facts, not some epidemiologist's spin job smoothing over inconvenient corpses. If St. Anselm's takes tougher cases, maybe they should get *better* at saving them instead of blaming the victims?

  Fine, I’ll add a footnote about their severity claims *if* you admit they have every incentive to fudge those codes to look less incompetent. But pulling the front page now? That’s surrendering to the suits who hate sunlight. Tell me this: if Mom walks into Lakeside tomorrow, statistically, doesn’t she face a 3.6% death risk versus St. Anselm’s whopping 7%? Numbers don’t have agendas, sis, unlike hospital PR departments – or epidemiologists protecting their ivory tower friends.

  You keep yelling "more likely to walk out" based on their *own* suspect severity labels, but show me one ordinary person who walks into an ER demanding a risk-adjustment consult! People see "54 dead vs. 210 dead" and act accordingly – and honestly, shouldn’t they? Or is your precious data only for experts while the rest of us gamble with lives? 

  Hold on – if St. Anselm’s is so superior with severe cases, why did only 10% of their *mild* cases die compared to Lakeside’s 1.5%? Sounds like they’re dangerously neglectful once the spotlight’s off the big, heroic saves. Maybe Lakeside’s strength is actually caring about *all* their patients equally? 

  Ultimately, Maren, your whole argument rests on trusting the very hospitals we’re scrutinizing to grade their own homework fairly – that’s not science, that’s faith. Until you prove those severity scores aren’t massaged to make St. Anselm’s look less lethal, the raw death toll stays front page. Mom deserves transparency, not your professional blind spot.
