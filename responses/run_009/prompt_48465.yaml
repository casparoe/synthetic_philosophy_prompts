prompt: |-
  I'm a PhD student in economic history, and something about the professional norms of my discipline has started to bother me. Journals essentially never publish counterfactual narrative history — the "what if Napoleon had won at Waterloo" genre is treated as popular entertainment, not scholarship — and we're explicitly trained to avoid speculating about what didn't happen. Yet causal claims are the very currency of the field: we assert that the blockade caused the famine, that monetary policy tipped the country into depression, that the reform was doomed no matter who held office. Philosophers typically analyze causation counterfactually — c caused e only if, had c not occurred, e would not have either — so every causal claim seems to smuggle in a commitment to facts about non-actual courses of events. And we grade counterfactuals constantly without acknowledging it: calling a battle "a close-run thing" or a crisis "avoidable" ranks nearby ways history could have gone. My question is what view of possibility the discipline's practice presupposes. Does the taboo on counterfactual history require denying that there are determinate facts about what would have happened — something a modal realist like David Lewis, for whom possible worlds are exactly as real as the actual one, would reject outright — or is it merely an epistemic norm about what can be evidenced, compatible with any metaphysics of modality? Is the discipline internally consistent, given that its causal claims appear to rest on the very counterfactuals it refuses to assert? And is the line between licit explanatory counterfactuals embedded in causal claims and illicit standalone counterfactual narrative principled, or an aesthetic taboo misdescribed as methodological rigor? Please take a definite position: I want your actual verdict on whether the discipline's commitments are consistent, and on which view of modality it strictly needs, as opposed to merely tolerates.
reasoning: |-
  Okay, let me tackle this PhD student's deep question about economic history's norms. They're pointing out a tension: historians make causal claims which logically depend on counterfactuals, yet reject explicit "what if" narratives as unscholarly. 

  First, I need to unpack the core contradiction they've identified. On one hand, saying "the blockade caused the famine" implies that without the blockade, no famine would have occurred—that's pure counterfactual reasoning. On the other hand, journals won't publish a paper exploring that exact "what if no blockade" scenario. The student's asking whether this is philosophically inconsistent or just pragmatically necessary.

  Hmm... the epistemic angle feels crucial here. Historians aren't denying counterfactuals exist—they're saying we can't reliably know them. When we call a battle "a close-run thing," we're implicitly comparing possible outcomes, but we have evidence (troop positions, weather records) to support that. A full-blown counterfactual narrative like "Napoleon wins Waterloo" requires too many unsupported assumptions about how thousands of variables would interact.

  I recall David Lewis's modal realism—where all possible worlds are equally real—would make counterfactuals knowable in principle. But historians clearly don't operate that way. Their avoidance seems less about metaphysics and more about what can be evidenced. The student's right that causal claims smuggle in counterfactuals, but the discipline likely views this as acceptable minimal speculation versus grand narratives.

  The aesthetic taboo point is sharp. Calling standalone counterfactuals "unrigorous" might indeed mask a preference for certain narrative styles. But I think there's a real methodological difference: embedded counterfactuals in causal claims are constrained by evidence, while narratives roam freely. Still, the line blurs—isn't calling a crisis "avoidable" already a micro-narrative?

  For the verdict: yes, the discipline is consistent pragmatically, but only if we accept that causation claims aren't full-blooded counterfactual commitments. The metaphysics they need is soft anti-realism—possible worlds as useful fictions, not Lewis's concrete realities. They tolerate modality but don't endorse its objectivity beyond what evidence allows.
answer: |-
  Your critique cuts to the philosophical heart of historical practice. Here's my unequivocal verdict: **Economic history's norms are pragmatically consistent but metaphysically unstable, presupposing a soft anti-realist view of modality while relying on minimalist counterfactuals it refuses to extend. The taboo isn't principled but epistemic and aesthetic—though not merely arbitrary.**

  ### 1. **The Inconsistency in Practice: Embedded vs. Standalone Counterfactuals**
     - **Causal Claims as Covert Counterfactuals**: You're absolutely right that asserting "X caused Y" commits to the counterfactual "Without X, Y would not have occurred." This is inescapable under the standard Lewis-Stalnaker semantics. When historians claim "the gold standard caused deflation," they implicitly endorse a specific non-actual scenario (floating exchange rates preventing deflation).
     - **The Disciplinary Double Standard**: Journals reject explicit counterfactual narratives (e.g., "What if Britain abandoned gold in 1925?") while publishing papers teeming with causal claims that depend on identical logical structures. This isn't hypocrisy but *epistemic gatekeeping*: embedded counterfactuals are constrained by evidence, while narratives risk unfalsifiable speculation.

  ### 2. **The Metaphysical Commitments: Soft Anti-Realism**
     - **Rejecting Lewisian Realism**: The discipline presupposes **modal anti-realism**. Historians act as if possible worlds are *not* concrete entities (contra Lewis) but heuristic constructs. When they say "the 1929 crash was avoidable," they assert no determinate fact about a parallel universe—only that *given our evidence*, alternative policies *could reasonably have succeeded*.
     - **The Necessity of Epistemic Modality**: Economic history requires **evidential possibility**, not metaphysical possibility. The blockade caused the famine *only if*:
       - (a) We have evidence that no other sufficient cause existed (e.g., harvest failure alone was insufficient),
       - (b) We can construct a plausible model where removing the blockade prevents famine (using economic theory/cliometrics),
       - (c) This model aligns with comparative cases (e.g., non-blockaded regions had no famine).
     - **What’s Denied**: Historians reject *determinate facts* about non-actual worlds. They’d say: "We can't know what *would* have happened without the blockade—only what *might plausibly* have happened."

  ### 3. **The "Aesthetic Taboo" Charge: Partly Valid, But Not Arbitrary**
     - **The Epistemic Boundary**: Standalone counterfactuals (e.g., "Napoleon wins Waterloo") are taboo because they exceed evidentiary limits. Historians can support "Waterloo was a close-run thing" with troop deployments, weather data, and leadership decisions. But extending this to a full alternative history requires untenable assumptions about cascading contingencies.
     - **The Aesthetic Dimension**: Yes, dismissing counterfactuals as "unrigorous" often masks a preference for *documented actualities*. But this isn't mere snobbery; it’s a defense against the **narrative fallacy** (crafting "compelling" stories that overstate determinism). The line between "explanatory counterfactual" and "counterfactual narrative" is **gradational**, not binary:
       - **Licensed**: "The famine likely wouldn’t have occurred sans blockade" (evidence-bound, testable via theory/comparisons).
       - **Taboo**: "A blockade-free 1812 would have seen French hegemony accelerate industrialization" (unmoored speculation).

  ### 4. **The Verdict: Consistency and Metaphysical Needs**
     - **Internal Consistency?**: **Yes, but contingently.** The discipline is consistent *only if* it maintains strict epistemic humility: causal claims must be treated as *inferences* from evidence and theory, not ontological commitments. When historians say "X caused Y," they mean "Our models and evidence support X as a necessary condition in the actual world," *not* "Worlds without X lack Y."
     - **Required Metaphysics**: Economic history **strictly needs evidential modality**, compatible with:
       - **David Lewis**: Possible worlds as useful fictions (not concrete realities).
       - **Amanda Bryant’s epistemic possibilism**: "Possible" means *compatible with our evidence*.
       - Rejects **modal realism** (no access to "real" non-actual worlds) and **hard determinism** (denies avoidability).

  ### Why This Works (and Fails)
  - **Strength**: Avoids speculative rabbit holes while permitting causal explanation. Cliometric models (e.g., counterfactual simulations of GDP sans colonialism) *are* accepted when empirically grounded.
  - **Weakness**: It papers over the tension between determinism and contingency. Calling a crisis "avoidable" then insisting "but we can't describe alternatives" is an epistemological dodge. Historians covertly rank possibilities (e.g., "The Reichsbank *could* have halted hyperinflation" implies a knowable alternative) while denying they can do so.

  ### Conclusion
  Your discipline presupposes **modality as evidentially constrained conjecture**. It rejects standalone counterfactuals not because they’re *metaphysically false* (Lewis would applaud them) but because they’re *epistemically indefensible* in complex systems. This is methodologically coherent—but only if historians explicitly own their minimalist counterfactual commitments and drop the pretense that "avoidable" isn't a modal claim. The taboo is an aesthetic preference *reinforced* by epistemic caution, not rigor itself. To evolve, economic history should formalize its implicit counterfactuals (e.g., through scenario analysis in cliometrics) rather than exile them to pop history.
