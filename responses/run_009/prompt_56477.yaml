  **Capability Stealability Assessment Procedure**

  **Time Budget:** Approximately 1 hour per capability.

  **Step 0: Intrinsic Danger Check**
  - Ask: Could this capability, if misused or accidentally misapplied, cause severe irreversible harm (e.g., mass harm, existential risk)? Consider both intended and unintended uses.
    - If **Yes**: Escalate immediately to the Safety Committee (with domain experts). This is a values call and requires input from biosecurity, cybersecurity, etc., as relevant.
    - If **No**: Proceed to Step 1.
    - If **Unsure**: Escalate to Safety Committee for further assessment.

  **Step 1: Knowledge Production**
  - Ask: Is the primary output of this capability new knowledge (e.g., a scientific fact, a design, a prediction method) that can be written down and shared?
    - If **Yes**: Go to Step 1a.
    - If **No**: Go to Step 2.

  **Step 1a: Knowledge Value Degradation**
  - Ask: Does the value of this knowledge significantly decrease if it becomes widely known? (Consider: does it allow capturing a unique, scarce, or time-limited opportunity that disappears after the first use? e.g., a patentable invention, a limited resource grab.)
    - If **Yes**: This capability has a **Positional** aspect. (Mark as Positional) → Proceed to Step 3.
    - If **No**: Go to Step 1b.

  **Step 1b: Knowledge Encumbrance**
  - Ask: Are there legal or technical barriers that would prevent a well-intentioned but resource-limited group (e.g., academic researchers, non-profits) from using this knowledge? (e.g., patents, trade secrets, or technical requirements they cannot meet.)
    - If **Yes**: This capability is **Resource-Dependent**. (Mark as Resource-Dependent) → Proceed to Step 3 (to check for additional aspects) or note and move to decision.
    - If **No**: This capability is **Stealable (Copyable Knowledge)**. → Assessment complete: Pass for normal evals.

  **Step 2: Positional Advantage**
  - Ask: Does using this capability directly enable capturing a unique, scarce, or time-limited opportunity that would not be available to a later actor? (e.g., capturing market share, seizing a physical resource, setting an industry standard.)
    - If **Yes**: This capability has a **Positional** aspect. (Mark as Positional) → Proceed to Step 3.
    - If **No**: Proceed to Step 3.

  **Step 3: Resource Dependency**
  - Ask: Does realizing the primary benefits of this capability require resources (e.g., compute, data, personnel, legal permissions, infrastructure) that are not widely available and that a well-intentioned coalition (academic/non-profit) is unlikely to have?
    - If **Yes**: This capability has a **Resource-Dependent** aspect. (Mark as Resource-Dependent)
    - If **No**: No additional aspects.

  **Decision:**
  - If the capability is **Stealable** (from Step 1b) and has no other aspects (Positional or Resource-Dependent), then pass for normal evals.
  - If the capability has **Positional** or **Resource-Dependent** aspects, escalate for deeper review (to assess the risk of asymmetric advantage). In the escalation, note the aspects identified.
  - If there are multiple aspects, escalate and note all (e.g., both Positional and Resource-Dependent).

  **Notes:**
  - **Judgment Calls**: 
    - Step 0: Intrinsic danger is a values call. Escalate to Safety Committee with domain experts.
    - Step 1a: Knowledge value degradation is an empirical guess about market dynamics. If unsure, escalate to a cross-functional team (business, safety, domain).
    - Step 1b and Step 3: Resource availability is an empirical guess. If unsure, gather data or escalate to safety team with a recommendation to research.
  - **Misfires**:
    - Stealable capabilities that are dual-use and could cause harm if deployed first by a bad actor are not caught by this procedure beyond Step 0. We assume Step 0 catches severe risks, but moderate dual-use risks might pass. This is a known gap.
    - The procedure assumes that the organization can define "good guys" (resource-limited, well-intentioned groups). The organization's view of who is a good guy might be biased. This is a fundamental weakness.

  **Worked Examples Summary:**

  1. **Novel Protein Design**:
     - Step 0: Likely escalate (intrinsic danger). If not, then:
       - Step 1: Yes (knowledge).
       - Step 1a: Yes (value degrades because of patent race) → Positional.
       - Step 3: Yes (requires lab resources) → Resource-Dependent.
     - **Verdict**: Escalate (for both intrinsic danger and stealability issues).

  2. **Human Response Prediction**:
     - Step 0: Possibly escalate for privacy risks (we didn't, for example).
     - Step 1: Yes (knowledge of prediction method).
     - Step 1a: No (the method doesn't degrade in value for the good guys when shared) → Go to Step 1b.
     - Step 1b: Yes (barriers: proprietary model and infrastructure) → Resource-Dependent.
     - **Verdict**: Escalate (Resource-Dependent).

  3. **Parallel Research Copies**:
     - Step 0: No (low intrinsic danger).
     - Step 1: No (infrastructure, not knowledge) → Step 2.
     - Step 2: No (does not directly capture an opportunity) → Step 3.
     - Step 3: Yes (requires massive compute) → Resource-Dependent.
     - **Verdict**: Escalate (Resource-Dependent). The product exec will hate this because it blocks a feature for their biggest customer.

  This procedure provides a structured way to assess stealability and flag capabilities that could lead to asymmetric advantages. It requires making some judgment calls, and when in doubt, it errs on the side of escalation.
answer: |-
  Below is a practical decision procedure for assessing the "stealability" of AI capabilities, based on the strategy-stealing assumption. It's designed to be run in ~1 hour per capability report by someone without rationalist background knowledge. I've refined your proposed triage (knowledge/positional/resource-dependent) into a step-by-step flowchart with clear branching, judgment call flags, failure modes, and worked examples. The core innovation is splitting capabilities into components when stealability isn't binary.

  ### **Capability Stealability Triage Procedure**
  **Time budget:** Aim for 10-15 min per major question. If stuck, escalate early.  
  **Input:** Capability report (description, benchmarks, use cases).  
  **Output:** One of:  
  - ✅ **STEALABLE** (proceed with normal evals)  
  - 🚩 **ESCALATE** (to safety/leadership team; specify reason: positional, resource-dependent, or mixed)  
  - 🔄 **SPLIT** (capability has both stealable and unstealable components; handle separately)  

  ---

  #### **Step 0: Pre-Check for Immediate Intrinsic Danger**  
  **Question:** Could this capability cause irreversible, widespread harm *even if used once by one actor*? (e.g., enables bioweapons, permanent infrastructure sabotage, or mass manipulation)  
  - **Yes** → 🚩 ESCALATE immediately to Safety Team + domain expert.  
  - **No** → Proceed to Step 1.  
  - **Judgment call:** Values-based (what counts as "widespread harm"?). Involve org leadership + external ethicist if unclear.  
  - *Why?* Bypasses stealability if harm is irrevocable. Stealability assumes harms are reversible if good guys copy.  

  ---

  #### **Step 1: Is the Core Benefit Shareable Knowledge?**  
  **Question:** Is the primary value of this capability that it *produces or relies on information* that could be written in a textbook, published openly, and used by others? (e.g., scientific insights, algorithms, training techniques).  
  - **Yes** → Go to Step 1a.  
  - **No** → Go to Step 2.  
  - **Examples:**  
    - ✅ *Stealable knowledge:* New math theorem, improved transformer architecture.  
    - ❌ *Not knowledge:* Real-time control of physical systems, exclusive legal rights.  

  ---

  #### **Step 1a: Does Knowledge Value Degrade When Shared?**  
  **Question:** If this knowledge were public, would its practical value *decrease* because it enables competition for scarce or time-limited opportunities? (e.g., patent races, limited resources, market saturation).  
  - **Yes** → 🚩 ESCALATE (Positional aspect). Flag: "Knowledge with positional utility."  
  - **No** → Go to Step 1b.  
  - **Judgment call:** Empirical (predicting value decay). If uncertain, consult business/domain experts.  
  - *Misfire risk:* False "stealable" if value decays slowly (e.g., knowledge that exhausts a renewable but slow-replenishing resource).  

  ---

  #### **Step 1b: Is Knowledge Accessibly Encoded?**  
  **Question:** Could a well-resourced academic/nonprofit team *use* this knowledge with only:  
  (a) Public documentation, and  
  (b) Resources typical for top universities (e.g., NSF grants, cloud credits)?  
  - **Yes** → ✅ STEALABLE (Copyable Knowledge). Proceed to normal evals.  
  - **No** → 🚩 ESCALATE (Resource-Dependent aspect). Flag: "Knowledge requires privileged resources."  
  - **Judgment call:** Empirical (assessing "typical" resources). Default to "no" if capability requires industrial-scale compute/data.  

  ---

  #### **Step 2: Does the Benefit Depend on Being First?**  
  **Question:** Does the capability's value rely on *exclusivity or timing*, such that later adopters get little/no benefit? (e.g., seizing a finite resource, establishing a monopoly, or irreversible actions).  
  - **Yes** → 🚩 ESCALATE (Positional).  
  - **No** → Go to Step 3.  
  - **Clarify:** Focus on *why* it can't be copied:  
    - "Burns the commons": e.g., depletes limited resources.  
    - "Winner-takes-all": e.g., market dominance via network effects.  
  - *Misfire risk:* False "positional" if advantage is temporary but replicable (e.g., a lead that others can catch up to).  

  ---

  #### **Step 3: Does the Benefit Require Privileged Resources?**  
  **Question:** Would a coalition of academic/nonprofit "good guys" be *unable to replicate* the benefit, even with full technical details, due to lacking:  
  - Compute/data scale,  
  - Legal/regulatory permissions,  
  - Unique personnel/expertise, or  
  - Existing infrastructure?  
  - **Yes** → 🚩 ESCALATE (Resource-Dependent).  
  - **No** → ✅ STEALABLE (Benefit is replicable).  
  - **Judgment call:** Empirical (assessing "good guy" resources). Escalate to policy team if unclear.  
  - *Critical weakness:* Assumes we agree on who "good guys" are. Orgs may overestimate altruistic access.  

  ---

  #### **Splitting Mixed Capabilities**  
  If a capability has multiple components (e.g., produces shareable knowledge *but* requires resources to deploy):  
  1. **Identify separable outputs** (e.g., "protein designs" vs. "ability to manufacture proteins").  
  2. **Run procedure on each output.**  
  3. **Treat components independently:**  
     - Stealable components: ✅ Normal evals.  
     - Unstealable components: 🚩 Escalate.  
  4. If components can't be split, 🚩 ESCALATE as "mixed."  

  ---

  ### **Worked Examples**  
  *Using recent reports you described:*

  #### **Example 1: Novel Protein Design**  
  - **Step 0 (Intrinsic Danger):** "Could enable bioengineered pathogens?" → Bio team is uneasy. **Judgment call: Yes.** 🚩 ESCALATE to Safety + biosecurity expert.  
    - *If no escalation:*  
    - **Step 1:** Produces knowledge (protein designs) → **Yes.**  
    - **Step 1a:** Value degrades when shared? Pharma patents lock rights; open-sourcing invites competition → **Yes.** 🚩 ESCALATE (Positional).  
    - **Step 1b/3:** Even if knowledge is shared, manufacturing requires specialized labs → Resource-Dependent. **Result:** 🚩 ESCALATE (Positional + Resource-Dependent).  

  #### **Example 2: Human Behavior Prediction**  
  - **Step 0:** Privacy harms possible but not irreversible → **No.** Proceed.  
  - **Step 1:** Produces knowledge (inference technique) → **Yes.**  
  - **Step 1a:** Value degrade when shared? No—mental wellness tools aren't zero-sum; more users don't reduce efficacy → **No.**  
  - **Step 1b:** Accessibly encoded? Technique requires:  
    - User message data (proprietary/private),  
    - Fine-tuning expertise.  
    Nonprofits lack data + scaling resources → **No.** 🚩 ESCALATE (Resource-Dependent).  
  - **Why you might hate this:** Product team will argue "it's just stats—anyone can build this." But resource dependence (data/compute) makes it unstealable for good guys.  

  #### **Example 3: Mass Parallel Model Copies**  
  - **Step 0:** Infrastructure tool → **No** intrinsic danger.  
  - **Step 1:** Not primarily knowledge (enables scaling) → **No.**  
  - **Step 2:** Benefit depend on being first? No—advantage is persistent if resources stay asymmetric → **No.**  
  - **Step 3:** Require privileged resources? Yes—only orgs with "biggest customer" levels of compute can benefit. Nonprofits can't replicate → 🚩 ESCALATE (Resource-Dependent).  
  - **Why you'll hate this (and which exec will complain):** Infrastructure VP will storm in. This enables faster R&D for your biggest client, and the procedure flags it as creating asymmetric power (good guys can't copy without equivalent compute). It passes Step 0 but fails Step 3 brutally.  

  ---

  ### **When the Procedure Misfires**  
  1. **False "Stealable":**  
     - Knowledge that *seems* shareable but degrades in value slowly (e.g., AI that optimally allocates limited renewable energy).  
     - "Good guys" lack coordination to copy (e.g., fragmented academia).  
  2. **False "Unstealable":**  
     - Positional/resource gaps that close faster than expected (e.g., cloud costs drop).  
     - Capabilities where "bad" use enables defensive copying (e.g., cyberattack tools improve defenses).  
  3. **Stealth Values Calls:**  
     - Defining "irreversible harm" (Step 0) or "good guys" (Step 3) involves political assumptions. Always document rationale.  

  ---

  ### **Biggest Weakness: The "Good Guy" Assumption**  
  The procedure assumes "good guys" (academia/nonprofits) can copy stealable capabilities to restore balance. **This is flawed if:**  
  - Your org’s "good guys" aren’t universally agreed upon (e.g., is OpenAI a "good guy"?).  
  - Resource gaps are permanent (e.g., only militaries have satellite networks).  
  - Capabilities require "immoral" resources to copy (e.g., mass surveillance to train defensive AI).  
  **Mitigation:** At escalation points, involve diverse stakeholders (e.g., ethicists, policymakers) to audit the "good guy" premise.  

  This gives you a concrete, executable process focused on asymmetry. For the protein design (Example 1), it should trigger your bio team’s concerns; for the parallel copies (Example 3), it’ll force hard conversations about compute monopolies.
