prompt: |-
  Quick one for my phil of language class -- we just did a unit on Moore's paradox and I think my friend is sort of right but also sort of not, and I can't put my finger on where. He was explaining it to our study group (he's a physics guy who read one pop philosophy article and now thinks he's cracked it) and this is basically what he said:

  "Moore's paradox is the discovery that the sentence 'it's raining but I don't believe it' is a logical contradiction. It can't be true, because if it's raining then obviously you believe it, so the two halves cancel each other out the same way 'P and not-P' does. What this shows is that belief is just the same as assertion -- saying you believe something is literally the same act as saying it's true. And it also proves you can't hold contradictory beliefs at the same time, since your beliefs would contradict each other the way the two halves of the sentence do. That's why Moore and Wittgenstein both concluded that the whole idea of unconscious belief is incoherent -- if you don't know you believe it, you don't believe it."

  Some of this sounded right when he said it but a couple things bugged me. In lecture my professor kept stressing that the Moore sentence is perfectly consistent as far as truth conditions go -- it could be true, there's a possible situation where it's true -- so calling it a logical contradiction seems off, but I can't articulate what the *right* characterization is. And I vaguely remember there being a second version of the paradox, something like "it's raining but I believe it isn't," and my friend never mentioned it, which makes me wonder if lumping them together hides something.

  Anyway: can you go through his little speech and tell me what's accurate, what's subtly wrong, and what's just him overreaching? Like which bits would a philosopher working on this actually endorse, which bits would they wince at, and does his conclusion about unconscious beliefs (and his conclusion about Wittgenstein, if you know whether that's even close to what Wittgenstein thought) follow from the parts that are true? Don't give me a survey of every possible position on this -- I want you to actually commit to which parts of his story are wrong and say straight out what the right way to put it is, because if I go back to the study group with "well, there are many views" he's going to be insufferable about it.
