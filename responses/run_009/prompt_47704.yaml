  First, I need to recall Moore's Paradox. The classic example is "It's raining but I don't believe it." The friend claims this is a logical contradiction like "P and not-P." But the professor mentioned it's consistent truth-conditionally. So the friend's first error is calling it a logical contradiction. It's more about assertion and belief inconsistency. 

  The friend says belief equals assertion. But that's too strong. Asserting P commits you to believing it, but belief itself is a mental state, not identical to speech acts. So that's an overreach. Also, connecting this to unconscious beliefs being incoherent—Wittgenstein didn't go that far. He focused on the absurdity in assertion, not denying unconscious mental states. 

  The user mentioned a second form: "It's raining but I believe it isn't." The friend didn't address this. That version involves a contradiction between the belief and the external fact, whereas the first is about the speaker's own belief state. Missing this distinction weakens the friend's argument. 

