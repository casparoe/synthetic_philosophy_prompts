answer: |-
  Here's a distilled list of desiderata for an expressivist account of moral language, grounded in the core challenges and motivations for expressivism. Each entry specifies the requirement, the case/consideration driving it, and its negotiability status. Conflicts are flagged at the end.

  ### Core Desiderata (Non-Negotiable for Expressivism)
  1.  **Logical Competence**:  
      -   **Requirement**: Explain the *validity* of moral inferences (e.g., modus ponens with moral premises/conclusions) and the consistency of moral claims under embedding (negation, conditionals, disjunction) without invoking representational truth-conditions for atomic moral claims.  
      -   **Case**: The Frege-Geach problem itself. Classic argument: "If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong." The meaning of "lying is wrong" must contribute systematically to the meaning of the complex sentences where it appears.  
      -   **Negotiability**: **Non-negotiable**. Failure here means expressivism cannot account for moral reasoning, rendering it inadequate as a semantics for moral language.

  2.  **Robust Embedding**:  
      -   **Requirement**: Account for the meaning and use of moral vocabulary not just in simple assertions, but under:  
          *   Negation ("Lying isn't wrong")  
          *   Disjunction ("Either lying is wrong or stealing is wrong")  
          *   Belief/Propositional Attitude Reports ("She believes lying is wrong")  
          *   Questions ("Is lying wrong?")  
      -   **Case**: Moral language functions identically to descriptive language in all these complex contexts. An expressivist semantics must explain this functional equivalence without equivocating on the meaning of moral terms.  
      -   **Negotiability**: **Non-negotiable**. This is the *full* scope of the Frege-Geach challenge. Restricting it to conditionals is insufficient.

  3.  **Genuine Disagreement without Factual Disagreement**:  
      -   **Requirement**: Explain how two speakers can be in genuine, non-defective disagreement (e.g., "Lying is wrong" vs. "Lying is not wrong") even when they agree on *all* relevant descriptive/non-moral facts about lying.  
      -   **Case**: The core motivation for expressivism. Realism explains disagreement as conflicting beliefs about objective facts. Subjectivism explains it as conflicting reports of subjective states. Expressivism must explain it as a clash of conative attitudes (e.g., disapproval vs. tolerance) without reducing to subjectivism or invoking objective facts.  
      -   **Negotiability**: **Non-negotiable**. This is a primary *raison d'être* for expressivism. Failing here surrenders its key advantage over realism.

  4.  **Judgment-Motivation Link (Internalism)**:  
      -   **Requirement**: Explain the (defeasible) necessary connection between sincerely judging that X is wrong and being motivated (to some degree) to avoid doing X.  
      -   **Case**: Humean psychology and the apparent "practicality" of moral judgments. Sincere moral judgment isn't inert belief; it inherently engages the will. Expressivism naturally captures this by identifying judgment with a conative state (e.g., disapproval).  
      -   **Negotiability**: **Non-negotiable**. This is the other primary motivation for expressivism vs. descriptivist/cognitivist views. Severing this link fundamentally changes the view.

  5.  **Accommodation of Minimal Truth**:  
      -   **Requirement**: Be compatible with the idea that moral claims are minimally "truth-apt" – i.e., they can be called "true" or "false" in ordinary, deflated senses (e.g., assent, correctness within a discourse), without committing to robust representational truth or moral facts.  
      -   **Case**: Surface grammar and ordinary discourse ("It's true that lying is wrong"). Minimalism about truth is widely accepted. Denying truth-aptness entirely makes expressivism revisionist in an implausible way.  
      -   **Negotiability**: **Non-negotiable for adequacy**. Modern expressivism must engage with minimalist truth; rejecting truth-aptness wholesale is untenable. *How* it accommodates it is negotiable.

  6.  **Non-Representationalism at Base**:  
      -   **Requirement**: The core, atomic moral judgment (e.g., judging "lying is wrong") must be fundamentally characterized as the expression of a non-cognitive, conative state of mind (e.g., disapproval, acceptance of a norm, planning) rather than a cognitive state aiming to represent a fact.  
      -   **Case**: The *definitional core* of expressivism. This is what distinguishes it from realism, error-theory, and subjectivism (which *is* representational – it represents the speaker's own attitude).  
      -   **Negotiability**: **Non-negotiable**. This *is* expressivism. Losing this makes it a different metaethical view. "Staying recognizably expressivist" is substantive, not gatekeeping.

  7.  **Avoidance of Simple Subjectivism**:  
      -   **Requirement**: Do not reduce "X is wrong" to "I disapprove of X".  
      -   **Case**:  
          *   **Disagreement**: On subjectivism, "Lying is wrong" (I disapprove) and "Lying is not wrong" (I don't disapprove) aren't genuine contradictions; both can be true simultaneously if speakers have different attitudes. Expressivism must avoid this.  
          *   **Embedding**: "If lying is wrong, then..." becomes "If I disapprove of lying, then..." on subjectivism, changing the meaning drastically and failing logical competence.  
          *   **Motivation**: Subjectivism struggles to explain why judging "X is wrong" (reporting my disapproval) should motivate *me* intrinsically.  
      -   **Negotiability**: **Non-negotiable**. This is not a quiet bias; it's fundamental. Subjectivism demonstrably fails core requirements (1, 3, 4, 5). Expressivism *must* offer a superior alternative.

  ### Important But Potentially Negotiable Desiderata
  8.  **Explanatory Depth / Surface Feature Capture**:  
      -   **Requirement**: Explain *why* moral language exhibits the surface features it does (e.g., why it *looks* truth-conditional, why it embeds smoothly) rather than just being consistent with them. Ideally, explain the function or point of moral language fitting this form.  
      -   **Case**: A strong theory shouldn't just avoid contradictions; it should illuminate the phenomenon. Why does our attitude-expressing practice take this propositional, logic-friendly form? (Gibbard's planning, Blackburn's quasi-realism, Chrisman's regulative role address this).  
      -   **Negotiability**: **Negotiable (for minimal adequacy), but crucial for a compelling theory**. A purely syntactic "solution" to Frege-Geach that doesn't explain the *point* of the logic feels shallow. However, technically satisfying (1) and (2) might be deemed minimally adequate.

  ### Key Tensions and Conflicts Between Desiderata
  *   **Logical Competence (1) + Embedding Robustness (2) + Minimal Truth (5) vs. Non-Representationalism at Base (6) ("The Creeping Realism Worry")**: This is *the* core tension. Delivering (1) & (2) requires a systematic semantics explaining how meanings compose. Accommodating (5) allows moral claims to feature in truth-functional logic. The pressure is immense to model this semantics on representational/truth-conditional semantics, using operators defined over "contents" (even if these contents are understood as plans or states of mind). If the semantics for complex constructions becomes indistinguishable from a realist's semantics, and minimal truth applies, **does (6) become merely a metaphysical add-on about the *basis* of the content, rather than a genuinely distinct semantic theory?** This threatens the *explanatory distinctness* of expressivism. Can expressivism provide a compositional semantics robust enough for (1) & (2) that *doesn't* functionally reduce to a form of realism under minimalism? This is the crux of modern expressivism.
  *   **Judgment-Motivation Link (4) vs. Embedding Robustness (2) (especially Belief Reports)**: The motivational state expressed by an atomic judgment ("Lying is wrong" expresses disapproval motivating avoidance) seems absent or different in embeddings. Saying "She believes lying is wrong" doesn't express *my* disapproval, nor does it typically motivate *me* to avoid lying. The theory must explain how the motivational element "projects" or transforms in embeddings without disappearing (losing the link) or being incorrectly attributed (e.g., implying *I* disapprove when reporting her belief).
  *   **Genuine Disagreement (3) vs. Accommodation of Minimal Truth (5) + Logical Structure**: If disagreement is a clash of attitudes, and truth is minimal (e.g., "true" = "to be agreed with"), does this collapse into a form of relativism where "truth" is speaker-relative? How does this square with the objectivity implied by logic (e.g., the law of non-contradiction applying to moral claims)? Can expressivism deliver a notion of correctness robust enough for logic while grounding disagreement in attitude clashes?
  *   **Explanatory Depth (8) vs. Theoretical Simplicity**: Providing a deep explanation (e.g., in terms of planning or social coordination) adds complexity. Is this essential, or can a more minimal, formally adequate semantics suffice? (This is a methodological tension).

  **On the "Creeping Realism" Worry:** Your suspicion is astute. This tension is **real and profound**. Satisfying (1), (2), and (5) with sufficient rigor *does* exert immense pressure towards a semantics structurally isomorphic to truth-conditional semantics. Whether this *necessarily* collapses into realism depends entirely on the interpretation of the "propositions" or "contents" employed. If these contents are *constituted by* or *reduce to* conative states/plans (Gibbard) or their functional roles (Chrisman), and the metaphysics remains resolutely non-representational, expressivism *can* survive. However, the **explanatory burden** shifts: the theory must convincingly argue that this complex apparatus *is still fundamentally grounded in and explained by non-cognitive states* in a way that differs from realism (which grounds content in representation of facts). **"Stays recognizably expressivist" (6) *is* a genuine adequacy condition** – it's the *definition* of the project. If satisfying the other constraints forces a semantics where the moral "content" functions *exactly like* a realist's content, merely labeled differently, then expressivism *has* functionally collapsed, regardless of metaphysical protestations. Its *semantic* distinctness would be lost. The challenge is to build compositional logic while keeping the non-representational foundation *semantically active and explanatory*. This is the tightrope walk of contemporary expressivism.
