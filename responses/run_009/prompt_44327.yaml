prompt: |-
  I'm a PhD student in a department where metaethics is basically treated as a solved nuisance, and next term I have to finally write the paper my supervisor keeps assigning me on expressivism and the Frege-Geach problem. Rather than diving straight into the Blackburn/Gibbard literature and the back-and-forth it spawned, I want to get the specification right first, because my suspicion is that half the disputes in that literature are really disputes about what an expressivist theory is for. So: write me the desiderata. What does an expressivist account of moral language have to actually deliver to count as adequate? I'm thinking of things like: it has to explain the validity of the classic argument -- if lying is wrong, getting your little brother to lie is wrong; lying is wrong; therefore getting your little brother to lie is wrong -- without treating the moral vocabulary as plain truth-conditional, and the same goes for embedding under negation, disjunction, belief reports ("she thinks lying is wrong"), and straight questions. It needs compositionality in some form, since the whole problem is that "lying is wrong" seems to have one meaning inside a conditional and outside it. And it presumably still has to earn its keep on the things that motivated expressivism in the first place -- explaining genuine moral disagreement without disagreement about facts, and the connection between sincere moral judgement and motivation.

  For each requirement, give the case or consideration behind it, and mark which ones you think are non-negotiable versus which are just prejudices of particular camps (I have a feeling, e.g., that "must not collapse into simple subjectivism about wrongness" does a ton of quiet work that people never examine). Then the part I most want: flag any pairs or subsets of the desiderata you suspect can't be jointly satisfied — including the creeping worry that a view that satisfies the compositional and logical requirements plus a minimalist theory of truth ends up indistinct from realism, such that "stays recognisably expressivist" may itself be a desideratum in tension with the others. Is that last one a genuine adequacy condition or just terminological gatekeeping? Say what you actually think, dont hedge. And no scorecard of Blackburn vs Gibbard vs anyone else, I'll do that in the paper itself -- I just want the list, with the reasoning behind each entry laid out seperately.
