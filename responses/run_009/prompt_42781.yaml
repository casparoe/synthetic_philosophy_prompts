answer: |-
  Here is a specification of desiderata for a solution to the aggregation problem in Scanlonian contractualism, designed for seminar use:

  **Desiderata for an Adequate Solution to the Aggregation Problem:**

  1.  **Rescue Case Requirement:** The solution must justify prioritizing saving the larger group in a rescue case where two groups face *equal and serious* harms (e.g., death), and only one group can be saved. It must explain why the combined claims of the larger group outweigh the combined claims of the smaller group, even though no single individual in the larger group has a stronger complaint than any single individual in the smaller group.  
      *Motivating Case:* Standard Rescue Case (e.g., 5 vs. 1 drowning).  
      *Status:* Camp-Relative (Reflects a widely held intuition, but strict individualists might reject aggregation entirely).

  2.  **Non-Aggregation Requirement (Disparate Harms):** The solution must *not* allow the aggregation of very many minor complaints to outweigh a single, much more severe complaint in a trade-off scenario.  
      *Motivating Case:* Death vs. Millions of Mild Headaches.  
      *Status:* Non-Negotiable (Core to contractualism's rejection of straightforward utilitarianism/simple summation and its focus on individual justifiability).

  3.  **Distinction Requirement:** The solution must clearly differentiate between:
      *   (a) The *intrinsic strength* of an individual's complaint (determined by the nature and severity of the burden imposed on *them*).
      *   (b) The *number* of individuals holding a complaint of a given strength.
      *   (c) The *aggregate welfare* impact of a principle.  
      *Motivating Consideration:* Contractualism's core motivation: principles must be justifiable *to each person*; no one can be asked to bear a burden simply because aggregating others' lesser burdens creates a larger total "cost." Aggregation, if permitted, must be justified at the level of individual complaints, not just total welfare sums.  
      *Status:* Non-Negotiable (Core to contractualism's identity).

  4.  **Intermediate Harm Requirement:** The solution must provide a principled determination in cases involving harms of the *same kind but differing in number and/or severity per person*, where aggregation intuitions are less clear-cut.  
      *Motivating Case:* One person losing both legs vs. Two people each losing one leg (assuming functional equivalence: two "one-leg" losses = one "two-leg" loss). Does the number matter here?  
      *Status:* Camp-Relative (Solutions may differ significantly here; tests the robustness of the aggregation mechanism).

  5.  **Risk Requirement:** The solution must be applicable to cases involving *risks* of harm (e.g., many people facing a small chance of a serious harm), not just certain harms. It must explain how individual complaints based on exposure to risk interact and whether/how they aggregate.  
      *Motivating Case:* Exposing a large population to a very small risk of a fatal side effect from a beneficial policy vs. imposing a certain minor harm on a few to eliminate that risk.  
      *Status:* Non-Negotiable for practical relevance (Core contractualism must handle policy choices involving risk).

  6.  **Individual Justifiability Constraint:** The rationale for the solution's aggregation rules must be defensible *to each affected individual* as a reason they could not reasonably reject, consistent with the contractualist framework. It cannot rely *solely* on impersonal values or total sums that override individual standing.  
      *Motivating Consideration:* Contractualism's foundational idea that wrongness lies in being unjustifiable *to someone*.  
      *Status:* Non-Negotiable (Core to contractualism).

  **On Pairwise Sufficiency:** The spec is neutral. To count as a "solution," pairwise sufficiency must meet the above desiderata, particularly (1) Rescue Case and (4) Intermediate Harm. If it denies aggregation in the rescue case (failing 1), it's merely restating individualism. If it allows aggregation only in cases like (4) where the harm *per person* is identical and sufficient pairwise, it might be a candidate solution, but must still handle (5) Risk and satisfy (6) Individual Justifiability.

  **Joint Satisfiability Considerations:** There is significant tension between the **Rescue Case Requirement (1)** and the **Non-Aggregation Requirement (2)**, mediated by the **Intermediate Harm Requirement (4)** and constrained by the **Distinction Requirement (3)** and **Individual Justifiability Constraint (6)**. Requirement (1) demands *some* form of aggregation for like, serious harms. Requirement (2) demands *strict limits* on aggregation, especially for disparate harms. Requirement (4) forces a confrontation with *how similar* harms must be to aggregate and *to what degree* numbers matter. Requirement (3) insists aggregation cannot be based *simply* on total welfare, and Requirement (6) demands the aggregation rules themselves be justifiable to each individual. This suggests the problem is structural: contractualism's core commitment to individual justifiability (3, 6) makes *any* aggregation rule potentially vulnerable to rejection by individuals bearing severe burdens (challenging 1), while strictly prohibiting aggregation (failing 1) seems intuitively and practically unsustainable. The **Intermediate Harm Requirement (4)** is often the crucible where proposed solutions (like pairwise sufficiency, weighted complaints, or thresholds) are most severely tested and where tensions with (2) and (6) become most apparent. While a solution satisfying all *might* be possible, the desiderata highlight why the aggregation problem is deeply challenging within the contractualist framework, potentially revealing a fundamental constraint rather than a simple bug.

  \answer{Intermediate Harm Requirement}
