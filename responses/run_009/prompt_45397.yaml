answer: |-
  Here are five requirements for an adequate theory of technological or institutional lock-in:

  1.  **Explain Suboptimal Persistence:** The theory must elucidate how and why a technology, standard, or institution that was initially merely adequate (or even inferior to available alternatives at the time) becomes entrenched and resists displacement by demonstrably superior options that emerge later, even under competitive pressures. (Why QWERTY, VHS, or a specific institutional form wins out).
  2.  **Account for Differential Durability:** The theory must provide mechanisms explaining why some lock-ins persist indefinitely (seeming irreversibility), while others eventually break down, allowing transitions to superior alternatives or different paths, and identify the conditions or events precipitating such breakdowns. (Why coal persists vs. why Betamax didn't win later).
  3.  **Distinguish Lock-in from Simple Persistence:** The theory must rigorously differentiate genuine path-dependent lock-in (where initial conditions and contingent events create self-reinforcing mechanisms like network effects, sunk costs, or adaptive expectations) from mere persistence due to inherent superiority, low cost of maintenance, or the absence of any significant challenge or pressure for change. (First-mover advantage vs. genuine superiority).
  4.  **Decouple Arrival Contingency from Form Contingency:** The theory must separate the contingency surrounding *which specific variant* initially succeeds (e.g., QWERTY vs. Dvorak) from the contingency surrounding *whether the general functional outcome* emerges at all (e.g., keyboard-based input vs. something else). It must also address the interplay between the contingent founding path and subsequent convergence towards optimal functional forms within the locked-in system. (Why *this* mammal lineage dominated vs. whether mammals dominate; the form of the locked-in standard vs. its function).
  5.  **Respect Observed Evolutionary Patterns:** The theory's proposed balance of historical contingency versus functional convergence must be compatible with the empirical evidence from biological evolution, where replaying the tape *does* show deep contingency in specific lineages and forms (e.g., mammalian diversity vs. reptilian dominance) yet also reveals striking convergences on functional solutions (e.g., eyes, flight, streamlined shapes) across independent lineages facing similar pressures. This requirement's necessity is the least confident; perhaps evolutionary principles are too distinct from socio-technical systems? High confidence in the other four.
