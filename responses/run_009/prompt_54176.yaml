  ### Key Features:
  1. **Logical Flow**: Starts with the monument's current meaning (axis 1), branches through moral assessment (axis 3), and separates remedies (axis 5).
  2. **Implicit Axes**: 
     - Axis 2 (assertion type) appears in `assertion_type` node
     - Axis 4 (medium) is intentionally omitted since the tree focuses on statues as a concrete case study
  3. **Unseparated Pair**: Flags that contextualized retention and museum-relocation share identical reasoning until the final remedy choice.
  4. **Awkward Commitments**: Highlights the toughest implications of each position (e.g., maximalism requiring renaming foundational institutions).
  5. **Empty Slot Note**: The "apparently empty" category isn't needed—all logical combinations lead to occupied positions.

  ### Usage Notes:
  - The tree intentionally avoids jargon while preserving philosophical rigor
  - "Morally mixed" examples (slaveholders, colonialists) anchor questions in real debates
  - The `remedy_selection` node captures gut-reaction differences in solutions
  - Path to maximalism: If a reader chooses removal/contextualization then applies that standard consistently to all honorifics in their mind

  This structure forces engagement with *why* monuments provoke conflict before reaching conclusions, moving beyond superficial "keep/toss" binaries.
