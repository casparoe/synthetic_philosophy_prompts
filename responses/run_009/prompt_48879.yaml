prompt: |-
  In most jurisdictions, a person may sign an advance directive while competent — instructing caregivers, say, to withhold antibiotics or artificial nutrition if she later develops advanced dementia — and the instruction remains legally binding even at a stage when she no longer understands what a directive is. Clinicians are told to enforce it against a patient who now seems content, enjoys her meals, and reaches for the spoon, on the theory that the earlier self had the authority to decide for this one. Yet the very same hospitals, deciding for a patient who was never competent, proceed by the patient's current best interests; they would dismiss as outrageous a competent person's attempt to bind her future self in other domains — a directive demanding that her sweets be taken away, or that a future romantic partner be kept from her bedside; and ethics committees in practice give the demented patient's current objections real weight whenever the directive is anything less than explicit. What conception of the self, or of the authority of the earlier self, does the practice of precedent autonomy actually presuppose? Reconstruct the implicit theory: is it that the directive-writer and the demented patient are literally the same person, so that autonomy is simply being exercised over time; something weaker, like self-binding on analogy with contract or gift; or the claim that a life can be going badly from one's own earlier critical standpoint even when each of its moments is pleasant? Then distinguish what the practice strictly requires from what it merely fits with: does the boundary-drawing institutions actually do — demanding clear and convincing evidence, never withholding comfort care, letting current objections muddy things — track the reconstructed view, or is it quietly borrowing from the rival view that only the present patient's interests count? And if we adopted that rival view outright, what in current practice would have to give?
reasoning: |-
  Okay, this user is diving deep into the philosophical and ethical underpinnings of advance directives in dementia care. They're clearly well-versed in medical ethics but struggling with the tension between precedent autonomy and present interests. The way they juxtapose binding medical decisions with hypothetical "sweets bans" suggests they see a contradiction in how we treat different types of future-binding.

  Hmm, their core question has three layers: first reconstructing the implicit theory of self behind advance directives, then analyzing whether institutional practices align with that theory, and finally projecting consequences of abandoning it. The sweets example is particularly sharp - it forces us to examine why medical decisions feel morally different from lifestyle constraints.

  I notice they're hinting at Parfit's psychological continuity theories without naming him. That "pleasant moments vs. life going badly" phrasing is straight from reductionist personal identity debates. But they're right that hospitals don't actually operate on full Parfitian premises - if they did, they'd treat late-stage dementia patients like different persons entirely.

  The institutional practices they describe (demanding explicit directives, prioritizing comfort care) reveal fascinating compromises. It's like we've built airbags into the system because we're secretly uneasy about overriding content demented patients. That "muddying" with current objections betrays how thin the veneer of pure precedent autonomy really is.

  What they might be circling toward is whether advance directives are fundamentally about respecting past autonomy or preventing future suffering. The artificial nutrition example leans utilitarian ("life going badly"), while the romantic partner ban feels more deontological ("binding promises"). Institutions seem to accept the former but reject the latter - which suggests they're smuggling in quality-of-life judgments under autonomy language.

  If we switched wholesale to present interests, the earthquake would be around refusal of life-extending treatments. Withholding antibiotics from a content dementia patient would become unthinkable. We'd probably develop stricter competency thresholds for directives - maybe requiring recurrent psychiatric evaluations or witness testimonies about sustained values. The "Ulysses contract" model for psychiatric care shows how this could work, but dementia's gradual decline makes that messy.

  ...I should probably mention Maclean and Dresser's disability critiques too. When they call advance directives "ableist," it resonates with that "outrageous" charge against binding future selves. But the counter-argument about prolonged states nobody would want remains strong. Maybe the compromise is treating directives as rebuttable presumptions rather than commands.
answer: |-
  The practice of precedent autonomy in dementia care rests on a complex, often inconsistent, **hybrid theory of the self and its authority**, blending elements of numerical identity, quasi-contractual binding, and a critical interests view of well-being. However, institutional practices reveal significant borrowing from a rival present-centered view.

  ### Reconstructed Implicit Theory:
  1.  **Not Strict Numerical Identity with Continuous Autonomy:**  
      If the directive-writer (DW) and demented patient (DP) were considered *literally the same person* exercising autonomy over time, we would expect directives to bind absolutely in *all* domains (like sweets or partners) and objections to be ignored. This isn't the case. The practice rejects this strong view.

  2.  **Primarily "Critical Interests" View of Well-Being:**  
      The core justification is that **a life can be going badly *from one's own earlier critical standpoint* even when experiencing transient pleasures.** The DW, possessing values, long-term goals, and a conception of a "good life," judges that living with severe dementia under certain interventions (e.g., tube feeding, prolonged dying) constitutes a fate *worse than death* or fundamentally incompatible with their identity. Enforcing the directive respects *these critical interests* – the person's enduring values and narrative identity – even when the DP lacks the capacity to comprehend them. The DP's momentary contentment is seen as irrelevant to this deeper judgment about how their life *as a whole* is faring according to their own standards.

  3.  **Quasi-Contractual Self-Binding (Limited Scope):**  
      This operates alongside the critical interests view but is constrained. The directive is treated as a **binding commitment made by the competent self regarding *specific, profound medical decisions* deemed central to their core values and dignity at the end of life.** It's analogous to a contract or gift, but crucially:
      *   **Scope-Limited:** It only binds for interventions the DW deemed *intolerable indignities* or *futile prolongations* inconsistent with their identity. It doesn't extend to lifestyle preferences (sweets) or relational autonomy (partners), which are seen as less central to core dignity or critical interests.
      *   **Revocable by Implied Consent?:** The weight given to current objections suggests an implicit view that if the DP *could* meaningfully reassess the directive *in light of their current experience* (which they usually cannot due to cognitive impairment), their present wishes might override the past directive. Silence or lack of objection is interpreted as continued consent to the directive.

  **Summary of Implicit Theory:** The practice presupposes that the DW and DP are the same biological entity ("human being") but not necessarily the same *person* in a rich psychological sense. Authority derives from the DW's unique right to define their *critical interests* concerning profound medical states they deemed incompatible with a life worth living. The directive binds primarily to protect the person *from* such states out of respect for their *past* values and judgment, not because the DW exercises ongoing autonomous control over the DP.

  ### Distinguishing Practice from Theory: Does Institutional Practice Track the Reconstructed View?
  **Mostly, but with significant deviations that borrow from the rival (present-centered) view:**

  1.  **Demanding Clear & Convincing Evidence:**  
      *   **Tracks Theory:** Protects the DW's critical interests by ensuring the directive genuinely reflects their considered, competent wishes about specific, intolerable states. Prevents imposing values the DW never held.
      *   **Fits Rival View?** Also protects the DP from being subjected to harmful omissions based on ambiguous or outdated instructions.

  2.  **Never Withholding Comfort Care:**  
      *   **Fits Rival View:** Primarily protects the *present* DP from suffering. Comfort care is seen as a fundamental current need/interest.
      *   **Tracks Theory (Weakly):** Could be framed as consistent with the DW's presumed desire not to suffer needlessly, but the *strength* of this rule suggests its grounding is in present welfare. The directive binds on *life-prolonging* interventions, not on *palliation*.

  3.  **Giving Weight to Current Objections:**  
      *   **Fits Rival View:** Directly respects the present DP's experiential interests and apparent will.
      *   **Tracks Theory (Ambiguously):** Can be interpreted through the quasi-contract lens: objections suggest the DP *might* no longer "consent" to the directive if they could reassess it. However, the practice often gives weight *even when* the objection clearly stems from dementia-driven lack of understanding (e.g., pulling at a feeding tube due to discomfort, not reassessing the value judgment). This strongly leans towards the rival view, acknowledging the DP as a *current moral patient* whose experiential welfare and expressions matter.

  4.  **Limited Scope (No Sweets/Partners):**  
      *   **Tracks Theory:** Distinguishes *critical medical interests* central to dignity and narrative identity from *experiential preferences* or relational autonomy. Only the former justify binding future selves via directive.
      *   **Fits Rival View?** Reinforces the primacy of the DP's current experiences and relationships.

  **Conclusion on Practice:** Institutional practice formally endorses the critical interests/quasi-contract view for *authorizing* directives but **quietly and significantly incorporates the rival present-centered view in *implementing* them.** The boundary-drawing (clear evidence, comfort care always, weighing objections) acts as a safeguard *against* the potential harshness of pure precedent autonomy, recognizing the DP as a being with current moral status whose suffering and expressions cannot be wholly ignored, even if they lack the capacity to fully reassess their critical interests. The practice is a pragmatic compromise, not a pure application of either theory.

  ### Consequences of Adopting the Rival View Outright (Only Present Patient's Interests Count):
  Adopting a strict "only the present demented patient's interests count" view would necessitate major changes:

  1.  **Severe Curtailing of Advance Directives:** Directives refusing life-sustaining treatment (antibiotics, ANH) for dementia would become largely **unenforceable** once the patient enters the advanced stage and *appears* content. The directive would merely be *evidence* of the DW's values to inform a *current* best interests assessment, easily overridden by the DP's present enjoyment of basic pleasures.
  2.  **Shift to Pure "Best Interests" Standard:** Decisions would be made solely based on the DP's *current* experiential welfare, comfort, and (to the extent discernible) present preferences. Prolonging life via antibiotics/ANH for a patient who eats willingly and seems content would become the default, as the directive's refusal would hold little weight against the apparent current interest in continued life/pleasure.
  3.  **Loss of "Critical Interests" Protection:** Individuals could no longer reliably protect themselves via directive from states they deeply feared *as competent persons* (prolonged unconsciousness, severe dementia with artificial support) if those states were experienced without apparent distress by the DP. The DW's values and conception of a dignified death would be marginalized.
  4.  **Increased Paternalism/Family Discretion:** With directives weakened, decisions would rely more heavily on surrogates (family, doctors) applying a "best interests" standard, potentially leading to more treatment contrary to the DW's known wishes if surrogates or clinicians prioritize biological life over past value judgments.
  5.  **Possible Legislative/Policy Shift:** Legal frameworks would need revision to explicitly subordinate precedent autonomy to current interests in dementia care contexts.

  **In essence:** Adopting the rival view outright would dismantle the core protective function of advance directives specifically for dementia, prioritizing the observable contentment of the demented patient over the critical interests and values previously articulated by the competent self. The current compromise practice would "give" its foundational reliance on the authority of the past self's critical judgment.
