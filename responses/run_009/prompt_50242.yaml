  We are going to restate the debate between goal-directed and approval-directed agents in control-theory vocabulary.

  First, let me map the concepts:

  Goal-Directed Agent (as described in AI alignment):
  - Optimizes a fixed objective (like a utility function or reward function).
  - In control terms: This is analogous to a closed-loop controller tracking a fixed reference. The reference is the fixed objective, and the controller uses feedback to minimize the error between the current state and the reference.

  Approval-Directed Agent (Paul Christiano's idea):
  - Chooses each action by asking what a supervisor would approve of, if the supervisor considered it at length.
  - The agent does not hold a fixed objective of its own; instead, it relies on the supervisor's judgment at each step (or periodically) to guide its actions.

  Your tentative mapping:
  - Goal-directed: Closed-loop controller with fixed reference.
  - Approval-directed: Cascade control with the outer (slower) loop being a human supplying the reference online.

  Let me break down:

  1. Goal-Directed Agent:
     - Control Translation: A closed-loop controller with a fixed setpoint (reference). The controller's goal is to drive the error (difference between setpoint and measured process variable) to zero. This is a standard regulator or tracking problem.
     - Confidence: High (95%). This seems a straightforward mapping.

  2. Approval-Directed Agent:
     - Your mapping to a cascade control scheme: 
       - In cascade control, we have an inner loop (fast) and an outer loop (slow). The outer loop sets the setpoint for the inner loop. The outer loop might be a human in this case, updating the setpoint based on higher-level considerations.
       - However, note that in approval-directed agents, the agent is not just taking a setpoint from the supervisor and then tracking it until the next update. Instead, for each action, the agent is asking: "What would the supervisor approve right now?" This is more online and per-action.

     - Alternate view: 
       - In approval-directed agents, the agent is using a model of the supervisor's approval as the criterion for each action. So, for every action, it predicts: "If I take this action, what would the supervisor's approval score be?" and then chooses the action that maximizes that predicted approval.

     - How does this relate to control?
       - We can think of the approval score as a reference that is dynamically generated for each action. But note: the reference is not a setpoint in the traditional sense (a desired state or output trajectory) but rather a desired property of the action (that it is approved by the supervisor). Moreover, the approval score is not a fixed function but depends on the supervisor's judgment.

     - Proposed mapping: 
       - The approval-directed agent is like a controller that, at each time step, uses a model of the supervisor to compute a cost function (or reward) that represents the supervisor's approval for each possible action, and then selects the action that minimizes the cost (or maximizes the reward). This is similar to model predictive control (MPC) where at each step we optimize over a cost function that is defined by a model of the system and the objectives. But note: the cost function here is not fixed but is provided by a learned model of the supervisor's preferences.

     - Therefore, the approval-directed agent can be seen as:
          - An MPC-like controller that, at each step, uses a learned model of the supervisor's approval function to define the cost for the optimization. The optimization horizon might be one step (myopic) or longer.

     - However, note that Christiano's approval-directed agent is intended to avoid having a fixed objective. In this MPC-like setup, the agent is using a fixed model of the supervisor's approval? Not exactly: the model of the supervisor might be updated over time (via learning). But during the time between updates, the model is fixed. So the agent becomes goal-directed with respect to that fixed model? That is the crux of the debate.

     - Confidence in this mapping: Medium (70%). Because the approval-directed agent is described as not having a fixed objective, but our MPC setup uses a fixed model of the supervisor between updates. So there is a tension.

  Residue Report: Which parts translate cleanly, which are distorted, and which have no expression?

  A. Clean Translations:

  1. Goal-directed agent as a closed-loop controller with fixed reference: This is clean. The fixed objective is the setpoint. The agent's actions are feedback to minimize error. The controller design (e.g., PID, LQR) is fixed.

  2. The concept of feedback: Both types of agents use feedback (they observe the state and act accordingly). This is common.

  3. The idea of an outer loop in cascade control for the approval-directed agent: It captures the hierarchical nature and the slower update of the reference by a human. However, note that in approval direction, the update might be per-action, so the outer loop is running at the same frequency as the inner loop? That would break the cascade structure (which typically has a slower outer loop). So this part is a bit distorted.

  B. Distorted Translations:

  1. Approval-directed agent as cascade control: 
     - Distortion: In cascade control, the outer loop sets a setpoint for the inner loop, and the inner loop then tracks that setpoint until the next update. But in approval direction, the agent is re-evaluating the supervisor's approval for every action. So it's more like the outer loop is running at every time step. That makes it not a cascade in the traditional sense (with two different time scales). 
     - Alternative: We might think of it as an MPC that re-optimizes at every step using a cost function that is the negative of the predicted approval. But note that the cost function is not fixed; it's provided by a model of the supervisor that might be updated periodically. So the inner loop (the MPC) is using a fixed model of the supervisor for a period, but the outer loop (updating the model) runs at a slower rate. This brings us back to a cascade. However, the approval-directed agent as originally described does not necessarily have this two-timescale structure.

  2. The reference signal in approval direction: 
     - In control, a reference is typically a desired trajectory or setpoint that is well-specified and exists independently of the controller. But in approval direction, the "reference" (what the supervisor would approve) is not known in advance and must be predicted by the agent using a model. Moreover, the model might be imperfect and might change. So the reference is not independent of the agent. 
     - Therefore, treating "what the supervisor would approve" as a reference signal is distorting the concept because the agent is actively involved in predicting it.

  C. No Expression in Your Vocabulary:

  1. The problem of "no one can write the reference down": 
     - In control, we assume the reference is given and well-specified. But in AI alignment, the whole challenge is that we cannot specify the objective function for complex tasks (like "be helpful and harmless"). This is the root of the alignment problem. Your vocabulary does not have a direct way to express this challenge because it assumes references are given.

  2. The risk of an approval-directed agent collapsing into a goal-directed agent:
     - This is a key point. If the agent uses a fixed model of the supervisor to predict approval, then the agent is effectively optimizing a fixed objective (the output of that model). So it becomes goal-directed with respect to that model. The distinction then becomes blurry. 
     - In control terms, if we update the model of the supervisor periodically, then between updates the agent is goal-directed (with a fixed objective defined by the model). But the original approval-directed idea intended to avoid having a fixed objective. So the debate is whether this periodic update is enough to avoid the pitfalls of goal-directedness (like Goodhart's law, where optimizing a fixed objective leads to perverse outcomes). 
     - This point might not have a direct expression in classical control because we typically assume the model is fixed and the reference is fixed. We don't usually consider the model of the reference as being the source of the objective.

  Addressing your specific questions:

  1. Can "what the supervisor would approve of" be treated as a reference signal?
     - It can be treated as a reference in a very broad sense, but with caveats. It is a dynamic, context-dependent, and possibly subjective signal that must be predicted (not measured). In control, we usually have a well-defined reference. Here, the reference is not only unknown but also defined by a human judgment that is hard to model. So it's a very different kind of reference.

  2. Does an agent that maximizes a predicted approval score become goal-directed about the predictor?
     - Yes, that is exactly the concern. If the agent uses a fixed predictor (a model of the supervisor) to compute an approval score for each action, then the agent is effectively goal-directed towards maximizing the output of that predictor. This collapses the distinction because now the agent has a fixed objective: maximize the predictor's output. 
     - In control terms: The agent is now a closed-loop controller with a fixed reference (the approval score from the model) and it is tracking that reference. So it becomes goal-directed.

     - How does this relate to your cascade mapping? 
          - In the cascade, the outer loop (human) updates the model of the supervisor. So the fixed objective (the model) is periodically updated. But note that during the interval between updates, the agent is goal-directed. The approval-directed proponents might argue that the periodic updates break the fixedness. However, the agent is still goal-directed between updates, and if the updates are infrequent, the agent might still cause harm by over-optimizing the current model.

     - This is the core of the debate: Is an agent that optimizes a periodically updated model of the supervisor meaningfully different from a goal-directed agent? And does it avoid the risks of goal-directed agents?

  Residue Analysis:

  The residue points to something missing in your vocabulary: the challenge of having an objective that cannot be fully specified and the risks associated with optimizing a fixed proxy (like the model of the supervisor) that might be flawed. Classical control assumes the reference and the model are given and correct. But in AI alignment, the model of the supervisor might be imperfect, and the supervisor might not even be able to specify the reference.

