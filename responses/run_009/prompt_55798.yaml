prompt: |-
  Two members of my forecasting team have been arguing past each other for two years, and I've asked them to run an adversarial collaboration. I need the joint statement they should produce. The first is an inside-view partisan: she trusts her object-level reasoning, treats her own calibration record as one more piece of evidence to weigh from the inside, and holds that wholesale deference to others' opinions is self-undermining — if every reasoner moderated toward the aggregate of the others, the aggregate would eventually contain no independent information at all. The second is an epistemic modesty partisan: he holds that learning of an informed person's disagreement is itself substantial evidence, that you should weight your own credence roughly as one member of a reference class of similarly situated reasoners, and that inside views are least reliable precisely where they feel most compelling.

  Draft the document both could sign. It should contain the following parts:

  1. A numbered agreed-claims section. These should be neither vacuous nor slanted, and I'd expect candidates to include: that Aumann's agreement theorem is valid as mathematics and that its practical import turns entirely on whether its common-prior and common-knowledge assumptions are ever satisfied among real reasoners; that the inside view and the outside view are not rival authorities but different kinds of input, so that the question is how they compose; and that the force of any outside view depends on a choice of reference class that is itself a judgment someone has to make. Refine, add, or strike as needed so both sides would actually sign.

  2. A disagreements table. Each row should state one residual disagreement in wording the relevant side would accept for its own view. At minimum, address these candidates (sharpen or split them if the parties would):
     - The doppelgänger case: you learn that a duplicate of you, sharing your memories and reasoning habits, who differs only in how a single coin landed and in what each of you observed of it, assigns a credence noticeably different from yours on some question. Is the rational response to split the difference, to hold firm, or something else — and what does each answer commit its side to?
     - Whether your own track record — calibration data on similar past calls — counts as inside-view or outside-view evidence, and which adjudicates when the two conflict.
     - Whether deference weights can be bootstrapped from the very judgment being deferred to: if your weights on other reasoners are themselves set by your own assessment of them, does modesty collapse into a fixed point that is either ill-defined or just your original opinion relabeled?
     - Whether the empirical record of forecasting tournaments, prediction markets, and aggregation algorithms settles anything, and if so for which class of questions — well-specified short-horizon forecasts versus long-horizon one-off judgments where the reference class is contested.

  3. A cruxes section: for each genuine crux, identify a test, argument, or concrete case both sides would agree bears on it, and record each side's prediction in advance, stated specifically enough that it could come out wrong.

  4. A short section stating which, if any, parts of their dispute are verbal rather than substantive — for instance, whether some of it turns on what deserves to be called "evidence" rather than on what to actually do with one's credences.

  One epistemic requirement: throughout the document, keep what is settled separate from what is genuinely contested among people who know this terrain. The mathematics is settled; the existence of robust overconfidence findings in some forecasting settings is largely settled; but whether the self-undermining argument against modesty actually works, and whether disagreement with an apparent peer is better modeled as evidence about the proposition or as evidence about which party is confused, are live questions — do not present either side's framing of these as the consensus. Also flag, rather than paper over, any agreed claim whose wording has been chosen to conceal a disagreement the parties were unable to resolve.
reasoning: |-
  We are drafting a joint statement for two forecasters with opposing views on how to update beliefs: an inside-view partisan and an epistemic modesty partisan. The document must be structured as requested, with agreed claims, a disagreements table, cruxes, and a section on verbal disputes.

  Key principles from the user:
  - Keep settled matters separate from contested ones.
  - Do not present either side's framing of live questions as consensus.
  - Flag any agreed claims that paper over unresolved disagreements.

  Agreed Claims (Section 1):
  We need agreed claims that are non-vacuous and non-slanted. The user suggested candidates:
  1. Aumann's agreement theorem is valid as mathematics, but its practical import depends on whether common prior and common knowledge assumptions hold in reality.
  2. The inside view and outside view are not rival authorities but different kinds of input; the question is how to compose them.
  3. The force of the outside view depends on the choice of reference class, which is itself a judgment call.

  We'll refine and add as needed. Other potential agreed claims:
  4. Both inside and outside views can provide valuable evidence, and neither is inherently superior in all cases.
  5. The empirical record shows that in some domains (like short-term forecasting tournaments), aggregation methods often outperform individual experts.
  6. However, the applicability of these findings to long-horizon, one-off, or highly context-dependent judgments is contested.
  7. Overconfidence is a common bias in human judgment, but the degree to which it applies in specific contexts varies.

  But we must be cautious: the inside-view partisan might resist #5 and #6 if they are stated as if settled for all contexts. Let's try to state them in a way both can accept.

  Revised agreed claims:

  1. **Aumann's Agreement Theorem**: We agree that Aumann's agreement theorem is mathematically valid. Its practical applicability to real-world disagreements, however, depends on whether the conditions of common priors and common knowledge of each other's credences are met, which is often not the case.

  2. **Nature of Inside and Outside Views**: The inside view (object-level reasoning about the specific case) and the outside view (statistical or reference-class-based reasoning) are distinct types of input. They are not competing authorities but complementary sources of evidence. The critical question is how to integrate them.

  3. **Reference Class Dependence**: The outside view requires selecting a reference class of similar cases. This selection is not objective but involves subjective judgment, and different choices can lead to different conclusions.

  4. **Empirical Record of Aggregation**: We agree that in well-specified, short-horizon forecasting tournaments, prediction markets and aggregation algorithms often (but not always) outperform individual forecasters. However, the extent to which these results generalize to long-horizon, one-off, or highly unique judgments is an open question.

  5. **Overconfidence Findings**: There is robust empirical evidence that humans, including experts, are often overconfident in their judgments in many domains (especially in areas with low feedback or high complexity). However, the degree of overconfidence and the conditions under which it occurs are variable.

  Disagreements Table (Section 2):

  We must state residual disagreements in wording each side accepts for their own view. The user provided candidate topics:

  a) **The Doppelgänger Case**: 
     - Inside-view partisan: Learning that a duplicate (who differs only in a coin flip and the observation of it) has a different credence does not necessarily require splitting the difference. The rational response is to reexamine the reasoning that led to the divergence, and if the reasoning is sound, hold firm. This case highlights that even with identical priors and reasoning, random variations can lead to different conclusions, but the inside view should not be abandoned without a specific error being found.
     - Modesty partisan: The rational response is to split the difference (or more generally, to treat the two as equally reliable and average). This is because the disagreement is due to a symmetric difference in evidence (the coin flip) and there is no reason to privilege one's own observation. This case shows that even in the absence of identified errors, disagreement from an epistemic peer should move one's credence.

     Implications: The inside-view partisan's stance commits to the idea that one's own reasoning, when it seems sound, should not be overridden by the mere existence of disagreement without a specific flaw being found. The modesty partisan's stance commits to the idea that disagreement from an apparent peer is evidence that should move one's credence even without identifying a flaw.

  b) **Own Track Record as Inside or Outside View**:
     - Inside-view partisan: One's own track record (calibration data) is inside-view evidence because it pertains to the specific reasoning and evidence of the individual. When it conflicts with an outside-view reference class, the individual should weigh both but give more weight to the inside view if they believe their specific case is not well represented by the reference class.
     - Modesty partisan: One's own track record is outside-view evidence because it is a statistical summary of past performance. When it conflicts with an inside-view judgment, the outside view (including the track record) should typically dominate because it corrects for overconfidence.

  c) **Bootstrapping Deference Weights**:
     - Inside-view partisan: If the weights assigned to other reasoners are determined by one's own assessment of their reliability, then the modesty procedure collapses into a fixed point that is either ill-defined or just a relabeling of one's original opinion. This makes the modesty approach circular and self-undermining.
     - Modesty partisan: The weights can be bootstrapped in a way that avoids circularity by using objective criteria (such as past performance) and by iterating to a fixed point that represents a consensus. This fixed point is not a relabeling but a refinement.

  d) **Empirical Record of Forecasting Tournaments**:
     - Inside-view partisan: The empirical record of forecasting tournaments and prediction markets applies only to well-specified, short-horizon forecasts with clear scoring. It does not settle the question for long-horizon, one-off judgments where the reference class is contested and the conditions of the tournament are not met.
     - Modesty partisan: The success of aggregation methods in tournaments and markets provides strong evidence for the power of the outside view and should be extended to other domains unless there is a specific reason not to. The burden of proof is on the inside-view advocate to show why a particular long-horizon judgment is not amenable to these methods.

  Cruxes (Section 3):

  We need to identify genuine cruxes and state testable predictions.

  Crux 1: **The Effectiveness of Aggregation for Long-Horizon Forecasts**
     - Test: Run a forecasting tournament on long-horizon, one-off questions (e.g., "Will country X experience a civil war in the next 10 years?") and compare the accuracy of individual inside-view forecasts vs. aggregated outside-view forecasts (e.g., using prediction markets or structured aggregation methods).
     - Inside-view prediction: The aggregated forecasts will not significantly outperform the best individual forecasters, and in some cases may underperform, because the reference class is too heterogeneous and the questions too unique.
     - Modesty prediction: The aggregated forecasts will outperform the median individual and likely the best individuals as well, as seen in short-horizon tournaments, because the wisdom of crowds effect holds even for complex questions.

  Crux 2: **The Doppelgänger Thought Experiment in Practice**
     - Test: Simulate the doppelgänger scenario in a lab. Have participants make a judgment, then present them with a simulated doppelgänger (a fabricated duplicate participant with a different judgment) and measure how much they update. Also, vary whether the disagreement is due to a known coin flip (symmetrically different evidence) or not.
     - Inside-view prediction: Participants will update little when they are confident in their reasoning and no error is identified, even in the symmetric evidence case. The update will be more pronounced when they are uncertain or when an error is found.
     - Modesty prediction: Participants will update significantly toward the doppelgänger's view in the symmetric evidence case, and the update should be close to averaging.

  Crux 3: **The Effect of Deference on Independence**
     - Test: Simulate a group of forecasters who are instructed to defer to the group average to varying degrees. Measure the loss of independence and the resulting accuracy of the group aggregate over time.
     - Inside-view prediction: Moderate deference will cause the group to converge too quickly, losing independent information and leading to worse long-term accuracy than if individuals maintained more independence.
     - Modesty prediction: Moderate deference will improve the group's accuracy by reducing individual overconfidence and random error, without necessarily causing harmful convergence.

  Verbal Disputes (Section 4):

  We must identify any parts of the dispute that are verbal.

  1. **Definition of "Evidence"**: Some disagreement might be verbal regarding what counts as "evidence." The inside-view partisan might restrict "evidence" to object-level facts, while the modesty partisan might include meta-level facts (like the existence of disagreement). However, this is not purely verbal because it leads to different updating procedures.

  2. **"Peer" Definition**: The term "peer" is sometimes used loosely. The modesty partisan might define a peer as someone with similar information and reasoning ability, while the inside-view partisan might require a more stringent match. This is partially verbal but also substantive because it affects when the modesty update applies.

  We might say:

  "We agree that some of our disagreement about the doppelgänger case is verbal: the inside-view partisan uses 'evidence' to refer only to the object-level observations (the coin flip and its outcome), while the modesty partisan uses 'evidence' more broadly to include the fact of disagreement. However, even after clarifying terms, we disagree on the rational response: whether the disagreement itself, without an identified error, should move one's credence."

  Also, the classification of one's own track record (inside vs. outside) might be partially verbal, but it leads to different methods of combining.

  Finally, we must ensure that any agreed claim that conceals a disagreement is flagged. For instance, in agreed claim #4, we note that the generalizability to long-horizon forecasts is an open question, which is a point of disagreement.

  Drafting the document:

  We'll now write the joint statement accordingly.
answer: |-
  ### Joint Statement on Epistemic Disagreement  
  **Signed by [Inside-View Partisan] and [Epistemic Modesty Partisan]**  
  *Produced via Adversarial Collaboration*  

  ---

  #### 1. Agreed Claims  
  We affirm the following non-vacuous, non-slanted propositions, acknowledging that while some reflect settled truths, others involve nuances where unresolved disagreements persist (noted in *italics*):  

  1. **Aumann's Agreement Theorem**: The theorem is mathematically valid: rational agents with common priors and common knowledge of each other’s credences cannot agree to disagree. Its practical relevance hinges entirely on whether real-world reasoners satisfy the theorem’s assumptions (common priors and common knowledge), which are often unmet.  
  2. **Inside/Outside Views as Complementary Inputs**: The "inside view" (object-level reasoning about a specific case) and "outside view" (statistical or reference-class-based reasoning) are not rival authorities. They constitute distinct types of evidence, and the core question is how they integrate.  
  3. **Reference-Class Relativity**: The probative force of the outside view depends critically on the choice of reference class, which is itself a subjective judgment requiring object-level reasoning. *We flag that our disagreement over how to resolve reference-class ambiguity remains unresolved (see §2).*  
  4. **Empirical Limits of Aggregation**: Short-horizon, well-specified forecasting tournaments (e.g., geopolitical events with clear resolutions) robustly demonstrate that aggregation methods (e.g., prediction markets, algorithmically weighted ensembles) outperform individual experts. *However, the generalizability of these findings to long-horizon, one-off, or reference-class-ambiguous judgments is contested.*  
  5. **Overconfidence is Contextual**: Humans exhibit systematic overconfidence in domains with poor feedback loops or high complexity, as evidenced by forecasting research (e.g., Tetlock’s tournaments). *The degree of overconfidence and its applicability to cases where reasoners have strong object-level justifications is disputed.*  
  6. **No Zero Weight for Self**: Wholesale deference to others (assigning zero weight to one’s own view) is epistemically self-undermining, as it annihilates independent information. Moderation must preserve nonzero self-weight.  
  7. **Disagreement as Evidence**: Learning that an informed person disagrees with you is *some form* of evidence. *We disagree on whether this evidence directly bears on the disputed proposition or primarily signals confusion in one party (see §2).*  

  ---

  #### 2. Disagreements Table  
  Residual disagreements stated in each party’s preferred framing:  

  | Disagreement Topic | Inside-View Partisan’s Position | Epistemic Modesty Partisan’s Position |  
  |-------------------|--------------------------------|--------------------------------------|  
  | **Doppelgänger Case**: Upon learning an identical duplicate (same priors/memories, differing only due to a random coin flip) holds credence *c* ≠ yours on proposition *P*, what is the rational response? | Rationality requires holding firm absent specific object-level errors. The coin flip is irrelevant noise; only *identified flaws* in reasoning justify updating. *Commitment*: Rejects any "mechanical" deference; treats peer disagreement as a prompt for scrutiny, not automatic averaging. | Rationality requires moving credence toward the duplicate’s view (e.g., splitting the difference). The symmetry implies both are equally reliable; disagreement is direct evidence about *P*. *Commitment*: Endorses non-identifiable-error-based updating; treats peers as independent information sources. |  
  | **Own Track Record Status**: Is personal calibration data (e.g., "I was 80% calibrated on similar past calls") inside-view or outside-view evidence? Which prevails when they conflict? | Track records are inside-view evidence: they reflect *my* reasoning habits in context. When conflicting, object-level reasoning adjudicates (e.g., "This case differs from my past errors because..."). | Track records are outside-view evidence: they classify the agent into a reference class. When conflicting, outside-view should dominate as a corrective to overconfidence. |  
  | **Bootstrapping Deference Weights**: Can weights assigned to others avoid circularity if based on your own judgment of their reliability? | No. Self-weighted deference either (a) collapses into a fixed point indistinguishable from one’s original opinion ("relabeling"), or (b) is ill-defined under reflection (e.g., "I trust Alice because I think she’s reliable, but she distrusts me"). | Yes. Weights can be bootstrapped objectively (e.g., using empirical track records) or converge to a non-arbitrary fixed point via iterative averaging. This refines, not relabels, credences. |  
  | **Empirical Record Scope**: Do forecasting tournaments/prediction markets settle the inside/outside debate? For which questions? | Only for short-horizon, well-specified forecasts. They *do not* generalize to long-horizon/one-off judgments (e.g., "Will AGI occur by 2040?"), where reference classes are contested and object-level reasoning dominates. | Yes, for all questions where a defensible reference class exists. The burden of proof lies on inside-view advocates to show why long-horizon cases *cannot* leverage aggregation, given its broad efficacy. |  

  ---

  #### 3. Cruxes  
  For each substantive crux, we specify a test/argument both accept as probative and pre-commit to falsifiable predictions:  

  - **Crux 1: Long-Horizon Aggregation Efficacy**  
    - *Test*: Run a 5-year forecasting tournament on "one-off" questions (e.g., "Will a major war occur between countries A and B?"), comparing accuracy of:  
      - Individual inside-view forecasts.  
      - Aggregated predictions (e.g., prediction markets).  
    - *Inside-view prediction*: Aggregates will *not* systematically outperform top individual forecasters (defined by past calibration) on >60% of questions.  
    - *Modesty prediction*: Aggregates will outperform >75% of individuals (including top performers) on >70% of questions.  

  - **Crux 2: Doppelgänger Update Magnitude**  
    - *Test*: Empirical study where forecasters (with strong object-level arguments for credence *c*) learn a simulated "doppelgänger" (same credentials, symmetric evidence split) holds *c* ± 20%. Measure median credence shift.  
    - *Inside-view prediction*: Median shift ≤ 5%; updates correlate with identified flaws, not disagreement magnitude.  
    - *Modesty prediction*: Median shift ≥ 10%; updates correlate with disagreement magnitude, not flaw identification.  

  - **Crux 3: Bootstrapped Deformation of Information**  
    - *Test*: Simulate a forecasting network where agents iteratively update using weighted averages of peers’ credences (weights self-assigned based on perceived reliability). Track group diversity and accuracy over time.  
    - *Inside-view prediction*: Information diversity rapidly decays; accuracy stagnates or declines versus a control with no deference.  
    - *Modesty prediction*: Accuracy improves versus no-deference control; diversity stabilizes at a level sufficient for collective intelligence.  

  ---

  #### 4. Verbal vs. Substantive Disagreements  
  We identify two partially verbal disputes:  

  - **"Evidence" Scope**: Some disagreement reduces to whether "evidence" includes *only* object-level facts (e.g., data about *P*) or *also* meta-facts (e.g., "Alice disagrees"). This is verbal because, conditional on accepting disagreement as evidence, we concur it must impact credences—but we *substantively* disagree on *how* (see §2, Doppelgänger case).  
  - **"Peer" Definitions**: Disputes over who qualifies as an "epistemic peer" often mask deeper issues. We agree a peer shares comparable knowledge/skill, but *substantively* disagree on whether peers must share *identical* priors (inside-view) or merely *defensible* ones (modesty).  

  No other material disagreements were deemed purely verbal.  

  ---  
  **Attestation**: This document fairly represents our common ground and cleavages. We consent to its use in resolving team disputes.  
  Signed,  
  **[Inside-View Partisan]** | **[Epistemic Modesty Partisan]**  
  Date: [Date]
