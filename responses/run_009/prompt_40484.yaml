  Here’s a complete design for your 45-minute in-class game, optimized for experienced rationalists who believe they’re immune to information cascades. The game includes the urn setup, scoring, contrarian bonuses, the urn-switch twist, and a structured debrief.

  ---

  ### **Game Setup: "Cascade Urns"**
  **Duration:** 25-30 minutes (game) + 15-20 minutes (debrief)  
  **Players:** 14 (split into 2 groups of 7 for simultaneous play)  
  **Materials:**  
  - Two urns: **Urn A** (80% white marbles, 20% black), **Urn B** (20% white, 80% black). Use ~50 marbles per urn for quick draws.  
  - Private signal cards (for secrecy) or a moderator to draw marbles discreetly.  
  - Scoreboard (public guesses + points).  
  - Coins for urn selection.  
  - Contrarian bonus tokens (given privately to 2 players).  

  ---

  ### **Rules & Procedure**  
  **Step 1: Explain Rules (5 min)**  
  - **Objective:** Guess which urn (A or B) is active. Each player draws one marble privately, sees its color, then publicly announces their guess.  
  - **Scoring:**  
    - Correct guess = +1 point.  
    - **Contrarian bonus (for 2 random players):** +0.5 points if you guess *correctly* AND your guess *differs from the majority of previous guesses* (e.g., if prior guesses are [A, A], guessing B correctly earns the bonus).  
  - **Urn switch (Round 2 only):** "Midway through Round 2, I *might* switch the urn secretly. You won’t know when or if it happens."  

  **Step 2: Round 1 – Initial Cascade (10 min)**  
  - Moderator flips a coin: Heads → Urn A, Tails → Urn B (record secretly).  
  - **Player sequence:** Players 1–7 announce guesses in order.  
    - Each draws a marble, keeps color private, then announces guess (e.g., "A").  
    - Guesses and running score displayed publicly.  
  - **Expected cascade:** By Player 3–4, rational players will ignore private signals if prior guesses agree (e.g., [A, A] → Player 3 guesses A regardless of their marble).  

  **Step 3: Round 2 – Urn Switch & Stale Cascade (10 min)**  
  - **Secret switch:** Use the *same urn as Round 1* for Players 1–3. After Player 3’s guess, switch to the *other urn* for Players 4–7.  
  - Players 4–7 draw from the *new urn* but see prior guesses from the *old urn*.  
  - **Contrarians:** Same 2 players retain bonuses.  
  - **Goal:** Observe if Players 4–7 copy predecessors despite contradictory signals (e.g., guesses persist as [A, A, A, A, A] even after the switch).  

  **Step 4: Scoring & Reveal (5 min)**  
  - Announce true urn for both rounds and the switch point in Round 2.  
  - Award points: Correct guesses (+1) and contrarian bonuses (+0.5 if conditions met).  
  - Share private signals (optional) to show mismatches.  

  ---

  ### **Debrief (15-20 min)**  
  **Key Discussion Points:**  
  1. **When was copying rational?**  
     - *Early cascade (Round 1):* After 2+ identical guesses, Bayesian updating outweighs a single private signal (e.g., P(Urn A | [A, A]) ≈ 94% with 80-20 marbles). Copying is rational here.  
     - *Late cascade (Round 2):* Players 4–7 faced *stale public info* but ignored *new private signals* from the switched urn. Rational only if they assumed a fixed world (no switch).  

  2. **Contrarian Behavior:**  
     - Did contrarians resist cascades? Often no—bonuses are too small to offset low P(correct) when defying strong evidence.  
     - Exception: Contrarians *might* break cascades early (e.g., Player 3 with bonus if indifferent).  

  3. **Real-World Limits of the Model:**  
     - **Ignored dynamics:** Urns don’t capture shifting fundamentals (e.g., crypto crashes, restaurant quality drops). Rationalists assume static systems, leading to cascade persistence.  
     - **Social/network effects:** No peer pressure, reputational risks, or asymmetric expertise (all players identical here).  
     - **Confirmation bias:** Players in cascades often underweight disconfirming signals (e.g., Round 2 black marbles).  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **Urn-switch leak:** Players may whisper about the switch.  
     - *Fix:* Stress "absolutely no talking" and use private signal cards. Have a backup group if leaks occur.  
  2. **Cascade fails to form:** Use 80-20 marbles (not 70-30) to ensure strong signals. Pre-seed an example cascade if needed.  
  3. **Overly rational players:** Some may resist cascades to "prove" immunity. Remind them: *Rational play includes deferring to stronger evidence.*  
  4. **Time crunch:** Use pre-filled envelopes for marbles to accelerate draws. Run one group if short on time.  

  ---

  ### **Why This Works**  
  - **Paradox exposed:** Players who know cascade theory will *still* herd when Bayes demands it (Round 1) and *irrationally persist* when the world changes (Round 2).  
  - **Contrarian twist:** Highlights how incentives rarely override strong social evidence.  
  - **Real-world link:** Connects to crypto panics (ignoring new data), academic fads (following stale trends), and restaurant choices (herding on outdated reviews).  

  This game forces rationalists to confront the gap between theoretical immunity and practical vulnerability—while the debrief preempts overgeneralization. Good luck!
