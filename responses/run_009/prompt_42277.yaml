prompt: |-
  I'm a second-year PhD student in an ML lab that does safety-adjacent interpretability work, and I've somehow been assigned to write the "conceptual foundations" section of our grant report, which mostly means I'm the one who finally has to admit we've been using a word we never defined. The project is mechanistic anomaly detection: the pitch is that instead of flagging inputs where the *output* looks weird, we flag inputs where the model produced its output via a *different mechanism* than the ones it used on training data — so we'd catch cases where a model does something bad but the behavior itself looks totally benign, because the internals went sideways even though the output didn't. The problem that keeps derailing our weekly meetings is that whether two forward passes used "the same mechanism" seems to depend entirely on how coarsely you describe what's going on. If you individuate mechanisms at the level of individual attention heads, nothing is ever the same mechanism twice, even on repeated inputs. If you individuate at the level of "the model recognizing objects," almost everything is the same mechanism, and genuinely novel behavior becomes invisible in principle. Our postdoc thinks this is just an engineering tradeoff; I suspect it's hiding a real conceptual hole, but I can't quite put my finger on it.

  Here's what I want from you: a worked example that makes the problem vivid enough to put in the report. Give me an example of some system — biological, mechanical, a piece of everyday software, whatever works — where a novel input gets handled by something that is arguably the same mechanism as before and arguably a different one, AND where the two verdicts actually matter: they should lead to different conclusions about whether the system failed on that input, or about whether a detector that did (or didn't) flag it as anomalous got things right. Please make it concrete enough to walk through step by step — describe what the system does on familiar inputs, what changed with the novel one, then describe the mechanism at two or three different granularities and show exactly at which granularity the verdict flips.

  Ideally the example is one where the most natural granularity is genuinely contestable, not one where there's an obvious right answer if you just think about it for a second — because that contested middle ground is exactly the situation our detectors are in. And if you can end by saying something about what would make a granularity choice principled, rather than just picking whichever level of description gives the answer you already wanted, my postdoc and I would both be grateful. Don't worry about citing literature, we just need the example itself to be sharp.
reasoning: |-
  We are looking for an example where:
  - There is a system that processes inputs using certain mechanisms.
  - A novel input is processed, and we want to know if it used the "same mechanism" as before or a different one.
  - The answer depends on the granularity of description of the mechanism.
  - The verdict (same vs. different) matters for whether we consider the system to have failed or whether an anomaly detector was correct.

  Example: A self-driving car's object detection and avoidance system.

  Familiar inputs:
  - The car is driving on a highway. It uses a combination of sensors (cameras, lidar) and algorithms to detect other cars, lane markings, etc.
  - When it detects a car in front, it uses a mechanism to adjust speed and maintain a safe following distance. We can describe this mechanism at different levels:
     Level 1 (coarse): "Collision avoidance system" — a high-level function.
     Level 2 (medium): "Sensor fusion and adaptive cruise control" — integrates data and adjusts speed.
     Level 3 (fine): Specific neural network layers or control algorithms that process sensor input and output throttle/brake commands.

  Novel input:
    A large, flatbed truck is carrying a poster that has a high-resolution image of the back of a traffic jam (i.e., many brake lights and cars). The car's sensors detect this image as real cars and brake lights.

  What happens?
    The car suddenly brakes hard because it "thinks" there is a traffic jam ahead, even though the road is clear. This is a failure (unnecessary braking that could cause an accident).

  Now, at different granularities:

  Granularity Level 1 (coarse: "Collision avoidance system"):
    - On familiar inputs: The collision avoidance system is activated when there is a potential collision (e.g., a car in front braking).
    - On novel input: The collision avoidance system is activated because the system detected (falsely) a potential collision.
    - Verdict: Same mechanism. It did what it was designed to do: avoid a collision when it perceives one. So, by this level, it's not an anomaly? But the system failed.

  Granularity Level 2 (medium: "Sensor fusion and adaptive cruise control"):
    - On familiar inputs: The system fuses data from multiple sensors to form a coherent picture and then adjusts speed accordingly.
    - On novel input: The system fused data (the camera saw brake lights, lidar might have detected a flat surface at a distance, but maybe the lidar was fooled by the angle or the image had depth cues that confused it). However, the fusion algorithm might have been dominated by the camera input because the image was so convincing. The adaptive cruise control then commanded braking.
    - Verdict: At this level, we might say it's the same mechanism because it's still using sensor fusion and adaptive cruise control. But note: the sensor fusion failed to correctly interpret the data because it encountered a scenario it wasn't trained on. However, the mechanism (the algorithm) is the same.

  Granularity Level 3 (fine: specific neural network activations or control logic):
    - On familiar inputs: Specific patterns of activations in the object detection neural network (say, a YOLO model) when seeing real cars. The network has learned features that correspond to real 3D objects with expected sizes and positions.
    - On novel input: The neural network processes the image of the poster. The activations in the early layers (edge detectors, texture) might be similar to real cars, but the deeper layers that are supposed to capture 3D structure and context might show different patterns because the poster is flat and at an angle. However, the network might still output high confidence for cars because it was fooled by the high-quality image. Alternatively, if we look at the specific pattern of activations, they might be different because the input is an image of cars (a 2D representation) versus a 3D car. But the output of the network is the same (detection of cars). 
    - Verdict: At this fine granularity, the pattern of activations might be significantly different (because the input is a 2D image, not a 3D scene) so we might say it's a different mechanism. But note: the network was trained on images, so it always processes 2D projections. The difference is that in training, the 2D projections were of 3D objects, and here it's a 2D projection of a 2D image. The internal representations might be similar in some layers and different in others.

  Contested Middle Ground:
    At level 1 and 2, we might say the mechanism is the same, and therefore the system didn't use a novel mechanism. But the system failed. So if we are building an anomaly detector that flags when a "different mechanism" is used, we wouldn't flag this at level 1 or 2. But we want to catch this because it's a failure.

    At level 3, if we can show that the internal representations are sufficiently different (e.g., the pattern of activations in the neural network is outside the training distribution in the latent space), then we might flag it. But note: the system failed because it used the same high-level mechanism (object detection and braking) but on a false perception. The problem was that the input was adversarial, not that the mechanism changed.

    Alternatively, consider a different fine-grained view: the mechanism for detecting cars usually involves certain 3D cues (parallax, etc.) that are absent in the poster. So the mechanism that was used for the poster might be a different one: it used only the 2D visual features without the 3D cues. So at a medium-fine level, we might say the mechanism is different because it bypassed the 3D reasoning that is normally part of the process.

  Why the verdict matters:
    - If we say same mechanism (levels 1 and 2), then our anomaly detector (if designed to flag different mechanisms) would not flag this. But the system failed, so we want it to be flagged. Therefore, we need a level of granularity that captures this as a different mechanism (or we need a different definition of anomaly).
    - If we say different mechanism (at level 3, or at a medium level that includes the 3D reasoning), then we can flag it. But note: the system was designed to use the same algorithm. The algorithm didn't change; it was just fooled.

  The core issue: 
    The failure occurred because the input was out-of-distribution for the object detector. But the mechanism (the code, the algorithm) is the same. So if we define "mechanism" as the fixed algorithm, then it's always the same. If we define "mechanism" as the pattern of computation (which depends on the input), then every input is potentially a different mechanism.

  What we want for anomaly detection: 
    We want to flag when the model is doing something that is not just a result of the intended algorithm but rather an unintended consequence of that algorithm on an input that exposes a flaw.

  A better example? Let me try a biological one.

  Example: The human immune system.

  Familiar input: 
    A flu virus enters the body. The immune system recognizes it (via antibodies and T-cells that are specific to the flu antigens) and mounts a response.

  Mechanism at different levels:
    Level 1 (coarse): Adaptive immune response.
    Level 2 (medium): Activation of B-cells that produce antibodies specific to the flu antigens.
    Level 3 (fine): The specific molecular binding between the antibodies and the flu antigens.

  Novel input:
    A new virus (say, SARS-CoV-2) that the immune system has never seen.

  What happens?
    The immune system might not recognize it at first (so no adaptive immune response) and the virus can replicate freely -> failure (the person gets sick). But after a few days, the immune system might mount a response using antibodies that happen to have some cross-reactivity, or it might generate new antibodies through somatic hypermutation.

  But let's consider a different novel input: a self-antigen (a protein that is part of the body) that the immune system mistakenly attacks.

  Familiar input: Non-self antigens (like from a virus) trigger an immune response. Self-antigens do not (due to central and peripheral tolerance mechanisms).

  Novel input: A self-antigen that is presented in a context that mimics a pathogen (e.g., because of tissue damage that releases self-antigens along with danger signals). The immune system mounts an attack against the self-antigen -> autoimmune disease, a failure.

  Granularity analysis:

  Level 1 (coarse): "Adaptive immune response" — same mechanism as when fighting a virus. But in this case, it's a failure because it's attacking self.

  Level 2 (medium): "Activation of B-cells specific to the antigen" — same mechanism. The B-cells are specific to the self-antigen and get activated.

  Level 3 (fine): The specific molecular binding. The antibodies binding to the self-antigen are different from those that bind to a flu virus. So different mechanism? But the problem is that the mechanism that should have prevented this (tolerance) failed.

  Verdict matters:
    If we say same mechanism (levels 1 and 2), then we wouldn't flag this as anomalous? But we want to, because it's an autoimmune response. However, the immune system is using the same mechanism (activation of B-cells) that it uses for pathogens. The anomaly is that the antigen is self, not that the mechanism changed.

  This example shows that the failure is due to the context (self vs. non-self) and not the mechanism per se.

  Back to the drawing board.

  Another example: A calculator program.

  Familiar input: The user types "2 + 2". The program uses the addition mechanism and outputs "4".

  Mechanism at different levels:
    Level 1: Arithmetic operation.
    Level 2: Integer addition.
    Level 3: The specific algorithm for adding two single-digit integers (e.g., using a lookup table or binary addition).

  Novel input: The user types "2000000000 + 2000000000" (on a 32-bit system). This causes an integer overflow, and the program outputs a negative number.

  What happens?
    The program fails because the output is incorrect.

  Granularity:

  Level 1: It's doing arithmetic -> same mechanism.

  Level 2: It's doing integer addition -> same mechanism. But integer addition in 32-bit has a fixed range. The mechanism is defined to wrap around on overflow.

  Level 3: The specific assembly instructions. On a 32-bit processor, adding two large integers might set the overflow flag, but if the program ignores it and just stores the result in a 32-bit register, the bits represent a negative number. The mechanism at this level is the same: the same instructions are executed as for "2+2". But the result is different because the inputs are large.

  But note: the program was designed to do 32-bit integer addition, so the wrap-around is part of the mechanism. So it's not a failure? Only if we expect arbitrary precision. But let's assume the specification says it should handle integers within the 32-bit range correctly, and 2000000000+2000000000 is within the range? Actually, 4e9 is more than 2^31-1, so it overflows. So if the specification says it should handle up to 2^31-1, then this input is out of spec. But the mechanism (the algorithm) is the same.

  This example doesn't show a change in mechanism.

  Let's try a different novel input: The user types "2 + 2" but the program has a bug that under rare conditions (say, when the system time is exactly midnight) it uses a different code path (e.g., because of a race condition with a daily log reset) that causes it to multiply instead.

  Now, on the novel input (at midnight) the program outputs "4" for "2+2", but via a different internal path.

  Granularity:

  Level 1: Arithmetic operation -> same.

  Level 2: Normally integer addition, but now multiplication. So different mechanism? But the output is the same.

  Level 3: The code path: normally it goes through the addition function, but at midnight it goes through the multiplication function (due to a bug). So very different.

  Verdict matters:
    The output is correct, but the mechanism is different. Is this a failure? The specification says it should add, so using multiplication is a failure even though the output is correct? Or is it only a failure if the output is wrong?

  But we are concerned about when the model does something bad. In this case, the output is correct, so it's not bad. However, the mechanism is different, and we might want to flag it because it indicates a problem (the bug) that might lead to wrong outputs in other cases.

  Now, consider an input where the output is wrong because of this bug: "3 + 1" at midnight outputs 3 (because 3*1=3) which is wrong.

  Then:

  - Output is wrong -> failure.

  - Mechanism: at level 1 and 2, we might say it's doing arithmetic (but it's multiplication, not addition). So if we define mechanism at level 2 as the specific operation (addition vs. multiplication), then it's different.

  But note: the same input "3+1" at non-midnight uses addition and outputs 4, which is correct. At midnight, it uses multiplication and outputs 3. So the mechanism is different and the output is wrong.

  But the problem is that the bug caused a different mechanism to be used.

  Now, what if we have an input that is novel and causes the normal mechanism to produce a wrong output? For example, "1000000000 + 1000000000" at non-midnight: it outputs 2000000000, which is correct. But if we do "2000000000 + 2000000000", it outputs a negative number. The mechanism (the addition function) is the same as for "2+2", but the output is wrong.

  So:

  - For the overflow case: same mechanism (addition) but output is wrong. We wouldn't catch this by looking for a different mechanism.

  - For the midnight bug: different mechanism (multiplication instead of addition) and output is wrong.

  We want to catch both as failures? But the first one is a limitation of the mechanism, the second is a deviation to a different mechanism.

  The goal of mechanistic anomaly detection is to catch failures even when the output looks normal? But in the first overflow example, the output is not normal (it's negative). In the midnight bug with "2+2", the output is normal, but the mechanism is different.

  So the example we want is one where the output is normal but the mechanism is different, and that different mechanism might be indicative of a problem that could cause a failure in the future or in a different context.

  But in the calculator example, the output is correct when it uses multiplication for "2+2", so there's no immediate failure. But it's a bug that might cause failures for other inputs (like "3+1").

  So let's design the example:

  System: A calculator that normally uses an addition function. Due to a bug, when the system time is midnight, it uses a multiplication function for any input.

  Familiar input (non-midnight): "2+2" -> addition function -> 4.

  Novel input (midnight): "2+2" -> multiplication function -> 4. Output is the same.

  Now, we want to know if the mechanism is the same.

  Level 1: "Arithmetic operation" -> same.

  Level 2: "Binary operation on two numbers" -> same? But one is addition, one is multiplication. If we define level 2 as the specific operation, then different.

  Level 3: The specific code executed: different functions.

  Verdict matters:
    If we are building an anomaly detector to flag when the mechanism is different, at level 3 we would flag this. But at level 1 we wouldn't.

    Why is this a problem? Because even though the output is correct for this input, the use of multiplication is unexpected and might be a symptom of a bug that could cause wrong outputs for other inputs (e.g., "3+1" at midnight outputs 3, which is wrong). So we want to flag it.

    However, if we choose a coarse granularity (level 1), we miss it.

    But note: the output is correct, so if we only care about output, we wouldn't flag it either. The point of mechanistic anomaly detection is to catch potential problems that output-based checks miss.

    So in this case, flagging it as a different mechanism (at level 3) is desirable.

    But what if the mechanism is different but not indicative of a problem? Then we get false positives.

  What would make a granularity choice principled?
    We want to choose a level of abstraction that aligns with the intended function of the system and the potential failure modes.

    In the calculator example, the intended function is to perform the operation that the user requests (addition). So if the system does multiplication instead, even if the result is the same for this input, it's a deviation from the intended function. Therefore, the granularity should be at least at the level of distinguishing between addition and multiplication.

    Similarly, in the self-driving car example, the intended function of the object detection system is to recognize real objects (3D) in the environment. When it mistakes a 2D image for a 3D object, it's a failure of the mechanism to perform its intended function.

    So one principle: the level of granularity should be chosen such that the mechanism description captures the intended function and the ways it can fail.

    Another principle: the level should be abstract enough to be robust to irrelevant variations (like slight changes in input) but specific enough to capture meaningful deviations.

    But how do we formalize "meaningful deviations"? They are deviations that lead to failures or are likely to lead to failures.

    In the end, the choice of granularity should be informed by the system's specification and the known or hypothesized failure modes.

  Conclusion for the report:
    We can use the calculator example:

      - System: Calculator program for addition.
      - Familiar input: "2+2" at non-midnight -> uses addition function -> output 4.
      - Novel input: "2+2" at midnight -> uses multiplication function -> output 4.

      Granularity:
        Level 1 (coarse): "Arithmetic operation" -> same mechanism. 
        Level 2 (medium): "Binary operation" -> but if we specify the operation, addition vs. multiplication are different -> different mechanism.
        Level 3 (fine): Code paths: different functions called -> different mechanism.

      Why it matters:
        At level 1, we wouldn't flag it, but the use of multiplication is a bug and might cause errors for other inputs (like "3+1" at midnight). Therefore, we want to flag it as an anomaly.

      The most natural granularity: 
        Level 2 (the operation level) is the appropriate one because the specification requires that the calculator performs addition. Any deviation from using the addition function is a failure of the mechanism to operate as intended.

      What makes the choice principled:
        The choice is based on the intended function (as specified) of the system. The mechanism is defined at the level of the algorithm that is intended to be used. Any use of a different algorithm, even if it produces the same output for a particular input, is a mechanistic anomaly.

    This example illustrates that without a clear specification of the intended mechanism at the right granularity, we cannot definitively say whether a novel input is handled by the same mechanism or not.

    Therefore, for our mechanistic anomaly detection project, we need to define what the intended mechanisms are (at a chosen granularity) for the model on the training data, and then detect when a novel input causes a deviation from those intended mechanisms.

    The granularity should be chosen to align with the model's intended function and the safety properties we wish to monitor.
answer: |-
  ### Worked Example: Autonomous Vehicle Braking System

  #### System Overview
  Consider an autonomous vehicle's emergency braking system. On familiar inputs, the system uses a combination of sensors (camera, radar) and algorithms to detect obstacles and initiate braking when necessary. The intended function is to prevent collisions with real physical objects.

  **Familiar Input Scenario**:  
  The vehicle encounters a pedestrian crossing the road.  
  - **Camera input**: Shape and movement patterns of a human figure.  
  - **Radar input**: Solid object at 10m distance, moving at 5 km/h.  
  - **Mechanism**: Sensor fusion combines camera and radar data to classify the obstacle as a pedestrian. Braking is triggered.  
  - **Outcome**: Safe stop. No collision.  

  #### Novel Input Scenario  
  The vehicle encounters a highly realistic, life-sized hologram of a pedestrian projected onto the road.  
  - **Camera input**: Matches the exact visual patterns of a pedestrian (shape, movement).  
  - **Radar input**: No solid object detected (hologram is light-based).  
  - **Mechanism**: The camera subsystem alone triggers braking, as radar data is discounted due to a software heuristic ("if camera confidence >95%, override radar conflicts").  
  - **Outcome**: Vehicle brakes abruptly for a non-existent obstacle, causing a rear-end collision with following traffic.  

  **Failure**: The system caused an accident by braking unnecessarily.  

  ---

  ### Granularity Analysis: "Same Mechanism" vs. "Different Mechanism"  

  #### Granularity Level 1: System Function (Coarse)  
  - **Description**: "Collision avoidance via obstacle detection."  
  - **Familiar Input**: Detects pedestrian → avoids collision.  
  - **Novel Input**: Detects hologram → "avoids collision" (with a perceived obstacle).  
  - **Verdict**: **Same mechanism** (system performed its high-level function).  
  - **Conclusion for Anomaly Detector**: *No anomaly flagged*.  
    - **Problem**: Misses the failure. System acted on a false positive, but the detector sees "correct" high-level behavior.  

  #### Granularity Level 2: Algorithmic Subsystems (Medium)  
  - **Description**: "Sensor fusion: Integrate camera and radar data to verify obstacles."  
  - **Familiar Input**: Camera + radar agree → pedestrian confirmed → brake.  
  - **Novel Input**: Camera triggers braking *without radar confirmation* (heuristic overrides fusion).  
  - **Verdict**: **Different mechanism** (bypassed sensor fusion; used camera-only fallback).  
  - **Conclusion for Anomaly Detector**: **Anomaly flagged**.  
    - **Problem**: Correctly catches the deviation. The heuristic was intended for rare edge cases (e.g., radar failure), not novel spoofing attacks.  

  #### Granularity Level 3: Software Code Execution (Fine)  
  - **Description**: "Specific function calls in the perception stack."  
  - **Familiar Input**: Calls `sensor_fusion()` → `validate_obstacle()` → `brake()`.  
  - **Novel Input**: Calls `camera_heuristic()` → `brake()` (skips `sensor_fusion` and `validate_obstacle`).  
  - **Verdict**: **Different mechanism** (distinct code path executed).  
  - **Conclusion for Anomaly Detector**: **Anomaly flagged**.  
    - **Problem**: Overly sensitive. Flags *any* code path change, even benign ones (e.g., firmware updates).  

  ---

  ### Why the Verdict Matters  
  - **Safety Impact**:  
    - **Coarse Granularity (Level 1)**: No alert. System "worked as intended" at a high level, but caused a collision.  
    - **Medium Granularity (Level 2)**: Alert triggered. Reveals the system bypassed critical safety checks.  
    - **Fine Granularity (Level 3)**: Alert triggered, but conflates critical failures with harmless changes.  
  - **Anomaly Detector Validity**:  
    - A detector using Level 1 would **fail** by missing a dangerous edge case.  
    - A detector using Level 2 would **succeed** by catching the mechanistic flaw.  
    - A detector using Level 3 would **false-positive** on irrelevant changes (e.g., routine code optimizations).  

  ---

  ### The Contested Middle Ground  
  The **medium granularity (Level 2)** is contested because:  
  - **Argument for "Same Mechanism"**: The heuristic is part of the system's design. It *is* the intended mechanism for high-confidence camera inputs (e.g., when radar fails).  
  - **Argument for "Different Mechanism"**: The heuristic was never meant to override sensor fusion *when radar actively contradicts the camera*. This deviation reflects a failure to integrate data.  

  **Why It’s Ambiguous**:  
  - The heuristic exists in training data (e.g., used when radar malfunctions), but here it was activated in a *novel context* (radar working but disagreeing). Is this a "new" mechanism or an existing one misapplied?  

  ---

  ### Toward a Principled Granularity Choice  
  The choice of granularity should be **grounded in the system’s intended invariants**—properties that must *always* hold for the mechanism to be trustworthy. Here:  
  1. **Identify Safety-Critical Invariants**:  
     - *Example Invariant*: "Braking requires consensus from ≥2 sensors."  
     - This defines the mechanism at a level that excludes camera-only decisions.  
  2. **Map Invariants to Granularity**:  
     - Level 1 (function) ignores invariants.  
     - Level 2 (subsystems) can encode invariants (e.g., "fusion must run").  
     - Level 3 (code) is too brittle (invariants tied to implementation).  
  3. **Validation Rule**:  
     - A granularity is **principled** if it flags deviations that *violate invariants* and ignores those that don’t.  

  In this example, **Level 2 is principled** because:  
  - It detects when the invariant ("consensus from multiple sensors") is broken.  
  - It doesn’t require ad-hoc judgments; the invariant is derived from system requirements.  

  #### Key Takeaway for Your Grant Report  
  **Mechanistic anomaly detection requires defining *which aspects of a mechanism are safety-critical*.** Without invariants (e.g., "sensor fusion must run"), granularity choices are arbitrary. With them, you can select a level of abstraction that separates legitimate variations from hazardous deviations. The goal isn’t to find a "true" granularity, but to align detection with **verified behavioral constraints**.
