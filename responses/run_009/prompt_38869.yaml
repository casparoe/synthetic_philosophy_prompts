prompt: |-
  I volunteer at a wildlife rehab center up in northern california and just got handed orientation duty for the new intake volunteers. The reason I have to cover taxonomy at all: our admit-and-release rules keep saying things like "native species only" and "no releasing hybrids," and last month there was a whole argument over a turtle somebody swore was a pond slider hybrid, plus the salamanders out here (the ensatina ones, the ring species) are apparently a mess, so "what species is it" turns out to be something the volunteers actually have to decide on intake calls. I need about thirty minutes with people who have zero bio background to get across why "is it the same species?" sometimes just has no clean answer — not as a fun fact but as something they'll use. Don't explain it to me, plan how I should explain it: what has to come first, whether the ring species example can carry the whole thing or whether I need to start with something messier and more familiar like wolves/coyotes/dogs, the misconceptions they'll walk in with (I'm guessing "same species means they can breed" and "species are fixed natural categories, like elements on the periodic table"), exactly where in the sequence I should head each one off, and one intake-scenario question I could pose at the end to check whether they actually got it or are just nodding along.
