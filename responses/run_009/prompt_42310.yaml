prompt: |-
  I run partnerships at a small foundation that fiscally sponsors advocacy nonprofits, and more and more of my week goes to evaluating proposals where two groups with genuinely different moral views want to do something together. A friend who did a philosophy PhD told me what I'm doing has a name in the literature, moral trade, and the gist as she explained it is: if you and I disagree about what matters morally, we can often each make a concession that's cheap by our own lights but valuable by the other's lights, so we both come out ahead by our own standards. The problem is that right now I'm evaluating these on vibes, and the vibes are not scaling. We get maybe one or two of these proposals a month, they typically involve somewhere between ten and fifty thousand dollars plus staff time, and I have about a week to make a recommendation, with the board having to sign off on anything over a hundred grand. Nobody on my team (me included) has any philosophy training, so whatever my friend told me over dinner doesn't survive contact with an actual decision memo.

  What I want from you is a decision procedure my team can actually run on one of these cross-values proposals: the questions to ask, in order, what counts as a sufficient answer to each, where the procedure stops with a no, and the points where it can't decide and has to hand things off to the humans because the question is one of values or trust rather than facts. I care about it being honest about where it will misfire — my friend kept saying things like the hard part is that both sides have to be able to verify the other actually delivered, and that sometimes what looks like a trade is really one side converting the other, which I guess is not the same thing at all. So please mark the steps that are judgment calls dressed up as procedure.

  Then run it on three real-ish proposals from my inbox this quarter. First: an animal advocacy group would publicly back a public health charity's school deworming program (they care about it basically zero) in exchange for the health charity endorsing plant-based lunch options in the same schools. Second: a conservation org wants to restore a big forest corridor on land we hold, and a small wild-animal-focused group (their view is that most wild animals live short lives full of suffering, so more animals can be worse) has offered to co-fund it if the conservation org switches to restoring a coastal wetland they beleive supports fewer sentient creatures per acre. I'll admit I love this one, forests are my thing, so flag it honestly if the procedure comes out against me. Third: a faith-based homeless shelter and a secular harm-reduction group want to co-run a program where each promotes the other's services, but the shelter's people think needle exchange is morally wrong even while conceding it saves lives, and I genuinely can't tell if that kills the trade or not. Please write the whole thing as continuous prose, like a long email — no headings, bullet points, bold text, or tables — since it's going into a memo template that strips all that out anyway.
reasoning: |-
  We are designing a decision procedure for evaluating "moral trade" proposals. The key elements from moral trade theory are:
  1. The parties have genuinely different moral views (so they value things differently).
  2. Each party makes a concession that is cheap for them (low cost by their own moral standards) but valuable to the other party (high benefit by the other's standards).
  3. The trade must be verifiable: both parties must be able to confirm that the other has delivered on their promise.
  4. The trade should not be a case of one side converting the other (which would not be a trade but a change in values).

  The procedure must:
  - Be executable by a team without philosophy training.
  - Fit within a week of evaluation time for proposals of $10k-$50k (with board sign-off for >$100k).
  - Clearly indicate when to stop (and reject) and when to hand off to human judgment.

  We'll break the procedure into sequential steps. At each step, we either proceed, reject, or flag for human judgment.

  **Decision Procedure for Cross-Values Proposals**

  Step 1: **Clarify the Parties and Their Moral Views**
     - Ask: Who are the two (or more) groups involved? What are their core moral commitments? How do they differ?
     - Required: A clear statement from each group (or from our knowledge of them) about what they value and what they don't value in this context.
     - Why: We need to establish that the groups have different moral views. Without a genuine difference, this isn't a moral trade.
     - Sufficient answer: We have documented evidence (e.g., past statements, mission documents) that the groups hold different moral priorities relevant to the trade. If we cannot establish a clear difference, stop and reject (or hand off if uncertainty is high).
     - Judgment call: Assessing the "genuineness" of the moral difference. If there's ambiguity (e.g., one group might be shifting its views), flag for human judgment.

  Step 2: **Identify the Concessions**
     - Ask: What exactly is each group giving up (conceding) and what are they getting in return? Map these to their moral views.
     - Required: For each group, the concession they make must be:
          (a) Low cost by their own moral calculus (they don't value it much).
          (b) High benefit by the other group's moral calculus (the other group values it a lot).
     - Why: This is the core of moral trade. If one group's concession is costly by their own lights, it's not a trade but a sacrifice (which they might not sustain).
     - Sufficient answer: We can explain, in terms of each group's stated values, why the concession is cheap for them and why the benefit they receive is high. If we cannot, stop and reject.
     - Judgment call: Determining "low cost" and "high benefit" requires interpreting the groups' values. If the values are too vague or the cost/benefit is disputed, flag for human judgment.

  Step 3: **Assess Verifiability**
     - Ask: Can each party verify that the other has delivered on their promise? How?
     - Required: A clear, objective method for each group to confirm the other's actions. This might be through public actions, third-party monitoring, or predefined metrics.
     - Why: Without verifiability, one party might renege, and the trade fails.
     - Sufficient answer: We have a concrete plan for verification (e.g., the animal advocacy group can see the deworming program's public report; the health charity can see the school district's adoption of plant-based options). If verification is impossible or too costly, stop and reject.
     - Judgment call: Assessing the robustness of verification. If the method is weak (e.g., self-reporting without checks), flag for human judgment (with a note of risk).

  Step 4: **Check for Coercion or Conversion**
     - Ask: Is there any evidence that one party is trying to change the other's moral views, or that the trade is coercive?
     - Required: The trade must be voluntary and not aimed at altering fundamental values. It should be a one-off exchange, not a step in a campaign to convert.
     - Why: Moral trade is about cooperation despite differences, not erasing differences.
     - Sufficient answer: Both groups affirm (and we have no evidence to the contrary) that they are not seeking to change the other's values and that the trade is not part of a conversion strategy. If we find evidence of conversion (e.g., one group's internal documents state they hope this will lead to value change), stop and reject.
     - Judgment call: Distinguishing between a trade and a conversion attempt can be subtle. If there are concerns (e.g., one group has a history of proselytizing), flag for human judgment.

  Step 5: **Evaluate Feasibility and Risks**
     - Ask: Are there practical barriers to implementation? What are the risks of failure, and how would they affect each group and our foundation?
     - Required: A risk assessment including:
          - Likelihood of each group delivering on their promise.
          - Reputational risks to the groups and to our foundation if the trade fails or is controversial.
          - Any external factors (e.g., regulatory, community backlash) that could derail the trade.
     - Why: Even if the trade is theoretically sound, it might not work in practice.
     - Sufficient answer: We have a mitigation plan for major risks, and the probability of success is high. If risks are unmanageable (e.g., high chance of public controversy that harms our foundation's reputation), stop and reject.
     - Judgment call: Assessing risks is inherently subjective. If risks are moderate or hard to quantify, flag for human judgment (with a recommendation based on severity).

  Step 6: **Quantify Costs and Benefits (for our foundation)**
     - Ask: What are the costs to our foundation (funding, staff time) and the benefits (e.g., impact, relationship-building)? How does this align with our mission?
     - Required: A cost-benefit analysis from our foundation's perspective, including non-monetary factors.
     - Why: We must ensure the trade is a good use of our resources.
     - Sufficient answer: The benefits (e.g., advancing our mission by enabling two groups to achieve more) outweigh the costs. If costs exceed benefits by our foundation's standards, stop and reject.
     - Judgment call: Our foundation's mission and values. If the trade is borderline, flag for human judgment (e.g., board input).

  **Handling the Procedure:**
  - If at any step we stop and reject, document the reason.
  - If a step flags for human judgment, convene a small team (including you, the partnerships lead) to discuss and decide. If the issue is about values or trust, involve the board if necessary.
  - The procedure must be completed within the week. If a step requires external input (e.g., asking the groups for clarification), do so immediately and set a deadline.

  **Now, apply the procedure to the three proposals.**

  ---

  **Proposal 1: Animal Advocacy Group and Public Health Charity**

  - **Step 1: Clarify the Parties and Their Moral Views**
     - Animal advocacy group: Values reducing animal suffering (especially in farming). They care about promoting plant-based diets. They have no inherent concern for human deworming.
     - Public health charity: Values improving human health (especially for children). They care about deworming programs. They have no inherent concern for animal welfare.
     - Difference: Clear and well-established. Proceed.

  - **Step 2: Identify the Concessions**
     - Animal group's concession: Publicly backing the deworming program. Cheap for them (they don't oppose it, just don't value it) and valuable to the health charity (endorsement from a respected group might increase funding/participation).
     - Health charity's concession: Endorsing plant-based lunch options. Cheap for them (they don't oppose plant-based diets; in fact, it might align with health goals) and valuable to the animal group (increases acceptance of plant-based meals, reducing animal suffering).
     - However, note: The health charity might see plant-based options as a health benefit, so this isn't purely a moral concession. But by the animal group's lights, it's a big win. The cost to the health charity is low because they are not being asked to oppose anything they value. Similarly, the animal group isn't being asked to oppose anything they value. Proceed.

  - **Step 3: Assess Verifiability**
     - Animal group's delivery: They must publicly back the deworming program (e.g., press release, social media). Easily verifiable.
     - Health charity's delivery: They must endorse plant-based options (e.g., in their materials, in meetings with the school). Verifiable through public statements or school district adoption.
     - Both actions are public. Proceed.

  - **Step 4: Check for Coercion or Conversion**
     - No evidence of conversion. The animal group is not asking the health charity to become animal rights advocates, and vice versa. It's a specific exchange. Proceed.

  - **Step 5: Evaluate Feasibility and Risks**
     - Feasibility: High. Both actions are within the groups' normal activities.
     - Risks: 
          - Backlash from health charity's donors if they are seen as aligning with animal issues? Unlikely, since plant-based diets are increasingly mainstream for health reasons.
          - Backlash from animal group's supporters for endorsing a human-only program? Possible but minor; they can frame it as a step toward future collaborations.
     - Mitigation: Both groups can frame their actions neutrally (health charity: "healthy diets include plant-based options"; animal group: "deworming improves child welfare"). Proceed.

  - **Step 6: Quantify Costs and Benefits (for our foundation)**
     - Costs: Funding for coordination? Minimal staff time. The proposal is for co-promotion, so no direct funding for deworming or lunch programs.
     - Benefits: Advances both causes (deworming and plant-based meals) without our foundation having to fund the programs directly. Builds bridges between groups. Aligns with our mission of supporting advocacy.
     - Verdict: Proceed with recommendation to fund.

  **Proposal 2: Conservation Org vs. Wild-Animal-Focused Group**

  - **Step 1: Clarify the Parties and Their Moral Views**
     - Conservation org: Values biodiversity, habitat restoration, and protecting ecosystems. They believe restoring the forest corridor is a high priority.
     - Wild-animal-focused group: Believes that wild animal suffering is a major moral issue and that increasing animal populations can be bad if it leads to more suffering. They prefer interventions that minimize the number of sentient creatures (like coastal wetlands, which they believe support fewer animals per acre).
     - Difference: Profound. The conservation group sees more animals as good (indicating a healthy ecosystem); the wild-animal group sees it as potentially bad. Proceed.

  - **Step 2: Identify the Concessions**
     - Conservation org's concession: Switch from restoring a forest corridor to restoring a coastal wetland. This is costly by their lights because they value the forest corridor highly (it's their priority). They are giving up a project they care about for one they care less about.
     - Wild-animal group's concession: Co-funding the wetland restoration. Cheap for them (they prefer wetlands) and valuable to the conservation org (they get funding for a restoration project, albeit not their first choice).
     - Problem: The conservation org's concession is not cheap by their own moral standards. They are being asked to abandon a project they believe is more important. This fails Step 2. 
     - However, note: The wild-animal group is offering co-funding, which might make the wetland restoration more attractive. But the conservation org is still sacrificing their top choice. This is not a low-cost concession for them. 
     - Judgment: This step fails. But let's consider if there's a trade: The conservation org gets funding for a project they still value (just less) and the wild-animal group gets a project they prefer. However, the key condition of moral trade (low cost to the conceding party) is not met for the conservation org. 
     - Verdict: Stop and reject. (But since you love forests, note: This doesn't mean we can't fund the forest project; it means this particular trade proposal is flawed. We might fund the forest project separately.)

  - **Step 3: (Not reached because we stopped at Step 2)**
  - **Step 4: (Not reached)**
  - **Step 5: (Not reached)**
  - **Step 6: (Not reached)**

  **Proposal 3: Faith-Based Homeless Shelter and Secular Harm-Reduction Group**

  - **Step 1: Clarify the Parties and Their Moral Views**
     - Faith-based shelter: Provides shelter and services, likely rooted in religious values. They believe needle exchange is morally wrong (perhaps because it enables drug use or conflicts with abstinence-based approaches).
     - Harm-reduction group: Believes in reducing the harms of drug use (like disease transmission) through evidence-based practices like needle exchange. They may view the shelter's abstinence approach as less effective.
     - Difference: Clear. The shelter morally opposes needle exchange; the harm-reduction group sees it as a moral imperative. Proceed.

  - **Step 2: Identify the Concessions**
     - Shelter's concession: Promote the harm-reduction group's services (which include needle exchange). This is costly by their own moral standards because they believe needle exchange is wrong. They are being asked to endorse something they consider immoral.
     - Harm-reduction group's concession: Promote the shelter's services. Cheap for them (they don't oppose shelters) and valuable to the shelter (more clients might find them).
     - Problem: The shelter's concession is not cheap by their own lights. They are being asked to promote something they find morally objectionable. This fails Step 2.
     - However, note: The proposal says the shelter "concedes it saves lives." So they acknowledge a practical benefit but still see it as morally wrong. The cost is moral, not practical. Promoting it might violate their principles.
     - Verdict: Stop and reject? Not necessarily. We must check if the trade can be reframed. Perhaps the promotion is not an endorsement but a referral? Let's flag for human judgment because this is a values conflict.

  - **Step 2 Judgment Call:** 
     - The harm-reduction group's concession (promoting the shelter) is indeed cheap for them and valuable to the shelter. But the shelter's concession is highly costly. Is there a way to make it cheaper? For example, could the shelter promote the harm-reduction group without endorsing needle exchange? (e.g., "They offer various services; contact them for more information.") But if the harm-reduction group requires an explicit endorsement of needle exchange, that might be too much. 
     - Hand off to human judgment: Can the shelter promote the harm-reduction group in a way that doesn't violate their principles? If yes, the trade might work. If not, reject.

  - **Step 3: (We are at Step 2 judgment call, so we pause the procedure and convene the team.)**
     - Team discussion: We must talk to both groups. The shelter might agree to a neutral referral (which the harm-reduction group accepts) or only promote non-needle-exchange services? But if the harm-reduction group insists on promoting needle exchange as part of their identity, the shelter might refuse. 
     - If they can agree on a form of promotion that the shelter finds acceptable (e.g., "We don't endorse all their methods, but they serve the same population we do"), then we can proceed. Otherwise, reject.

  - **Assuming the team finds a way to make the concession cheap enough for the shelter, we proceed.**

  - **Step 3: Assess Verifiability**
     - Promotion actions (e.g., handing out flyers, referrals) are verifiable. Proceed.

  - **Step 4: Check for Coercion or Conversion**
     - Risk: The harm-reduction group might hope the shelter softens its stance on needle exchange. We have no evidence, but it's a concern. Similarly, the shelter might hope the harm-reduction group starts emphasizing abstinence. 
     - Hand off to human judgment: We need to ask both groups if they are committed to not using this as a conversion opportunity. If they affirm, proceed with caution.

  - **Step 5: Evaluate Feasibility and Risks**
     - High risk: Clients might be confused if the shelter promotes needle exchange while condemning it. Reputational risk for both groups. 
     - Mitigation: Clear communication boundaries (e.g., the shelter says, "We refer for all services, but our position on drug use is abstinence"). Still, controversy is likely. 
     - Hand off to human judgment: Is the potential benefit (improved access to services) worth the risk? Given the sensitivity, this might require board input.

  - **Step 6: Quantify Costs and Benefits**
     - Costs: Funding for joint program coordination. Staff time for managing potential fallout.
     - Benefits: Better service coordination for a vulnerable population. 
     - Verdict: If the earlier judgment calls are resolved positively, this could be a high-impact trade. But it's high-risk. Recommend with caution and close monitoring.

  ---

  **Summary of Recommendations:**
  - Proposal 1: Approve.
  - Proposal 2: Reject (fails Step 2).
  - Proposal 3: Conditional approval (subject to resolving Step 2 and Step 4 concerns, and with risk mitigation).

  **Final Note:** This procedure is a tool, not a substitute for wisdom. It will misfire when:
  - Moral differences are not as clear-cut as they seem (e.g., groups might be closer in values than we think).
  - What looks cheap to one party might become costly due to internal dissent or public pressure.
  - Verification breaks down in practice.

  Always leave room for human judgment, especially on values and trust. And remember: sometimes the best trade is the one that builds trust for future cooperation, even if it doesn't perfectly fit the model.
answer: |-
  Okay, let's build that decision procedure for evaluating these cross-values proposals – what your friend called moral trades. I'll lay out the steps first, explaining the reasoning and where the judgment calls hide, then run it on your three examples. The core challenge is indeed ensuring it's a genuine trade (mutual benefit by each party's own lights) and not hidden conversion or unverifiable promises, while acknowledging that some steps are inherently fuzzy and require human discernment.

  **The Decision Procedure**

  Start by gathering the written proposal and any supporting documents. Then, step by step:

  First, confirm the *genuine moral difference*. Ask: "What specific value or moral priority does each group hold that the other group does not share or actively downplays?" You need clear statements showing divergent core priorities, not just tactical differences. A sufficient answer names the distinct values (e.g., "Group A prioritizes reducing human disease above all; Group B prioritizes animal welfare and sees human disease as less morally urgent"). If the groups seem to fundamentally agree on the underlying moral weight of the issues involved, stop – this isn't a cross-values trade, it's a standard collaboration. If the difference feels superficial or performative (e.g., one group is just posturing for donors), flag for human judgment on trustworthiness and authenticity. This step misfires if groups are strategically misrepresenting their views or if the difference is too nuanced for non-philosophers to parse confidently.

  Second, map the *concessions and their perceived costs/benefits*. Ask: "Exactly what is each group *doing* for the other? Why is that action *cheap* (low moral cost) for the group doing it, but *valuable* (high moral benefit) for the group receiving it?" This is the heart. A sufficient answer clearly links Action X by Group A to Group B's value system (making it valuable for B), while explaining why Action X costs Group A little *by A's own moral calculus*. Similarly for Action Y by Group B for Group A. If an action imposes significant moral cost on the giver *by their own stated values* (e.g., endorsing something they find actively harmful or immoral), stop – this risks coercion or sacrifice, not trade. If the cost/benefit is asymmetric (e.g., one concession seems trivial while the other is huge), or if assessing "moral cost" feels impossible without diving into internal group politics, flag for human judgment. This step frequently misfires if groups haven't articulated their internal moral weightings clearly, or if "cheapness" is financial/logistical rather than moral (a common conflation). Your friend's caveat about conversion lurks here: if the "concession" seems designed to subtly shift the other group's values over time, it's not trade.

  Third, verify *verifiability and enforceability*. Ask: "How will each group *know for sure* the other has delivered on their specific promise? What happens if they don't?" Moral trade relies on trust built through verification. A sufficient answer identifies objective, timely metrics or observable actions for each concession (e.g., "Signed public statement published by Date X," "Funds transferred to Escrow Account Y upon completion of Z," "Third-party audit confirms switch to wetland species mix"). If verification relies solely on self-reporting, vague promises, or goodwill without clear milestones, stop – it's too risky. If verification mechanisms are complex, expensive, or prone to dispute, flag for human judgment on feasibility and risk tolerance. This step misfires if the actions are inherently hard to measure or if groups have a history of reneging on agreements.

  Fourth, assess *downsides and externalities*. Ask: "What potential negative consequences could arise, either for the groups involved, the populations they serve, the foundation, or broader goals? How likely and severe are they?" Even a perfect moral trade can cause harm. A sufficient answer acknowledges risks (e.g., reputational damage, alienating donors, unintended harm to a third party, setting a problematic precedent) and proposes mitigations. If the potential downsides clearly violate the foundation's core values or risk severe reputational/financial harm with high likelihood, stop. If risks are uncertain, hard to quantify, or involve trade-offs the foundation feels uncomfortable adjudicating (e.g., minor harm to one group vs. major benefit to another), flag for human judgment – this is inherently values-based for *you*. This step misfires by underestimating unforeseen consequences or group dynamics.

  Fifth, evaluate *foundation alignment and burden*. Ask: "Does supporting this trade advance the foundation's mission? Is the requested funding/staff time commensurate with the expected impact and complexity?" This shifts focus to your role. A sufficient answer shows how the trade unlocks synergistic benefits or scales impact in ways aligned with your goals, and that the resources asked for are reasonable. If the trade feels misaligned with your mission or the costs vastly outweigh the potential benefits *to your foundation's objectives*, stop. If alignment is indirect or the cost/benefit is borderline, flag for human judgment. This step misfires if your team over- or under-weights the foundation's own priorities relative to facilitating the trade.

  **Procedure Output:** At any "stop," the recommendation is No. At any "flag," escalate the specific unresolved question to a designated human (you or a small team) for a judgment call based on trust, values, risk appetite, or contextual knowledge. If you proceed through all steps without stopping or unresolved flags, the recommendation is Yes. Document the reasoning clearly at each step.

  **Applying the Procedure to Your Proposals**

  **Proposal 1: Animal Advocacy (AA) backs Deworming (DH) for DH endorsing Plant-Based Lunches (PBL).**

  *   **Step 1 (Moral Difference):** Clear difference. AA values animal welfare; DH values human health. AA sees deworming as morally neutral (not their priority); DH sees PBL primarily through a health lens, not animal ethics. *Sufficient. Proceed.*
  *   **Step 2 (Concessions & Costs):**
      *   *AA Concession (Backing DH):* Cheap for AA? Likely yes. Backing a human health program doesn't violate their principles; it's just not their focus. Valuable for DH? Yes, AA's endorsement could broaden support. *Appears sufficient.*
      *   *DH Concession (Endorsing PBL):* Cheap for DH? Probably yes. If PBL is framed as healthy/nutritious (aligned with DH's core mission), endorsing it isn't a moral cost, even if animal welfare isn't their driver. Valuable for AA? Absolutely, it directly advances their goal. *Appears sufficient.* *Proceed.* (Judgment Call: Could DH staff/donors see endorsing *anything* pushed by AA as implicitly supporting animal rights, causing internal friction? Unlikely if framed purely as health, but monitor.)
  *   **Step 3 (Verifiability):** Easy. AA's public backing (press release, joint statement) is verifiable. DH's endorsement of PBL (policy statement, materials for schools) is verifiable. *Sufficient. Proceed.*
  *   **Step 4 (Downsides):** Low risk. AA might get minor flak from purists for "distraction," but easily defensible. DH might get minor pushback if PBL is controversial locally, but framing as health mitigates. Foundation risk minimal. *Sufficient mitigations (clear framing). Proceed.*
  *   **Step 5 (Foundation):** Aligns with supporting diverse advocacy. Low cost ($/staff time likely for coordination). Potential high impact scaling both issues. *Sufficient. Proceed.*
  *   **Recommendation: Yes.** This fits the moral trade model well. Concessions are cheap by each giver's lights, valuable to the receiver, verifiable, low risk.

  **Proposal 2: Conservation Org (CO) restores Wetland (not Forest) with funding from Wild-Animal Group (WAG).**

  *   **Step 1 (Moral Difference):** Stark difference. CO values biodiversity, ecosystem health, species protection – more animals/plants generally good. WAG values reducing aggregate wild animal suffering – more animals often bad. *Sufficient. Proceed.*
  *   **Step 2 (Concessions & Costs):**
      *   *WAG Concession (Co-funding Wetland):* Cheap for WAG? **Yes.** Funding habitat they believe causes *less* suffering aligns perfectly with their goal. Valuable for CO? **Yes.** Funding is always valuable. *Sufficient.*
      *   *CO Concession (Switching to Wetland):* Cheap for CO? **NO.** This is the crux. By CO's own values (biodiversity, forest corridors as priority), switching from their high-priority forest project to a wetland (even if still "good") is a **significant moral and strategic cost**. They are giving up what they see as the *best* option for a *lesser* one, purely to access WAG's funding. It's not cheap *by their lights*; it's a compromise/sacrifice of their core priority. Valuable for WAG? **Yes**, immensely. *Fails Step 2.*
  *   **Recommendation: Stop (No).** This isn't a true moral trade. WAG gets a huge win (preventing what they see as a harmful forest project) with a cheap action (funding a project they like). CO suffers a significant cost (abandoning their top priority) for a benefit (funding *a* project). It's closer to CO being paid by WAG to *not do* something WAG dislikes, rather than CO making a *cheap concession*. Your love of forests doesn't change the procedure's logic – CO's values are clear, and abandoning their top choice isn't cheap for them. Flag: This doesn't mean the wetland project is bad, just that *this specific funding deal* isn't a valid moral trade per the criteria. Funding the wetland separately might be fine, but not based on this trade premise.

  **Proposal 3: Faith-Based Shelter (FBS) & Harm-Reduction Group (HRG) cross-promote services.**

  *   **Step 1 (Moral Difference):** Clear difference. FBS believes needle exchange (NE) is morally wrong (enabling sin/harm, against abstinence). HRG believes NE is morally imperative (saving lives, reducing disease). *Sufficient. Proceed.*
  *   **Step 2 (Concessions & Costs):**
      *   *HRG Concession (Promoting FBS):* Cheap for HRG? Likely **yes.** Promoting shelter services (food, safety) doesn't violate their principles; they likely see it as complementary. Valuable for FBS? **Yes**, more clients. *Appears sufficient.*
      *   *FBS Concession (Promoting HRG including NE):* Cheap for FBS? **HIGHLY QUESTIONABLE.** By their own stated values, NE is *morally wrong*. Promoting it, even while conceding it saves lives, likely feels like endorsing or facilitating something sinful/immoral. This is a **high moral cost**, not a cheap concession. Valuable for HRG? **Yes**, immensely. *Fails Step 2?* **Flag for Human Judgment.** This is the core ambiguity. *Why?* We need to understand *exactly* what "promote" entails. Is it handing out HRG's info neutrally ("Here are all local services")? Or actively endorsing NE ("We recommend their needle program")? The former *might* be survivable for FBS (still a cost, but perhaps manageable as "informing"). The latter is almost certainly unacceptable. The proposal hinges on FBS's ability to perform this action *without* feeling they've violated their core morality. Only deep understanding of FBS's specific theology, internal culture, and the exact promotion plan can answer this. *This is a values/trust judgment call.*
  *   **Step 3 (Verifiability):** (Assuming Step 2 is resolved). Promoting (handing out flyers, referrals) should be verifiable. *Likely sufficient, proceed if Step 2 passes.*
  *   **Step 4 (Downsides):** High risk. FBS promoting HRG could alienate their donors/constituents who share their moral view on NE. HRG promoting FBS could worry their clients if FBS is seen as judgmental or coercive. Potential confusion or harm for vulnerable clients caught between approaches. Reputational risk for the foundation if the collaboration explodes publicly. *Flag for Human Judgment.* The severity of these risks depends on local context, the groups' histories, and the specifics of implementation. Requires careful weighing of potential benefits (better client access) vs. high risks.
  *   **Step 5 (Foundation):** Supporting better service coordination for vulnerable populations is likely aligned. Cost/benefit depends heavily on Step 2 and 4 outcomes. *Proceed to judgment if earlier flags are navigated.*
  *   **Recommendation: Conditional (Heavy Judgment Needed).** Stop at Step 2 and Flag. This proposal *only* works as a moral trade if FBS finds a way to "promote" HRG that is *truly cheap* by their own moral standards – meaning it doesn't feel like complicity in sin. This requires deep discussion with FBS leadership about their red lines and potential compromise language/actions. If they can't define a genuinely low-cost action, reject. If they can, then it proceeds to Step 4 (Downsides), which is also high-risk and requires another human judgment call. This is the messiest one, where "vibes" about trust and the genuine internal feeling of FBS are crucial. Your friend's point about verification is easy here; the point about conversion is critical – if either group sees this as a foot-in-the-door to change the other's values, it will fail.

  This procedure forces clarity on the essential elements of moral trade and surfaces the key friction points. It won't eliminate judgment – Steps 2 and 4 are particularly value-laden – but it structures the evaluation, makes the reasoning transparent for the board, and highlights where trust and interpretation are paramount. It should help your team move beyond vibes while being honest about where vibes (or deeper philosophical understanding) still matter. Good luck with the inbox!
