prompt: |-
  I'm a junior analyst at a foreign-policy think tank, and after a recent promotion I'm the one drafting the first-pass memos on whatever crisis is in the news that week. The way my shop argues is almost entirly historical analogy: every memo leans on some "lesson of history." Last month a senior colleague built a whole section of a memo around the Thucydides Trap (the Graham Allison thing — rising power threatens ruling power, war in 12 of 16 historical cases), and a reviewer shredded it in the margins. Then I personally got burned when I wrote a paragraph calling a sanctions standoff "Munich all over again" and the historian on staff replied with three bullet points about how 1938 actually worked, none of them flattering to me. So I've been asked (read: told) to come up with a house procedure for how we handle analogies — and honestly I'd want one anyway, because I can no longer tell when these comparisons are doing real analytical work and when they're just rhetoric with a bibliography attached.

  Here's my current thinking, which you should feel free to correct: (1) analogies mislead when they match surface features — strongman leader, territorial demand, rising power — rather than causal structure, like what the actors can actually see, what they have to lose, what their domestic politics let them do; (2) analogies mislead because they're chosen by the advocate, not by the case — people reach for whichever famous episode supports the policy they already wanted, so "Munich" shows up to justify acting and "Vietnam" shows up to justify not acting, and neither is really an inference; (3) the more famous an analogy is, the less trustworthy it is, because fame tracks drama and how often it's been invoked, not typicality. That last one I'm least sure of. I've been skimming an old book by two political scientists, Neustadt and May (Thinking in Time, 1986), but I can't tell how much of their advice survives contact with a fast-moving news cycle, so don't feel bound by it.

  What I want is a decision procedure my team can actually run on a memo draft in about half an hour before it goes up to the director. Steps in order, what counts as a sufficient answer at each step, where the procedure ends with "cut the analogy" versus "keep it, but reframe it as one data point among several," and — crucially — the places where it has to hand off to a human because the question is one of judgment, not facts. Then run it on three cases from our recent drafts: (a) a director's claim that a trade-and-territorial dispute with an authoritarian government is Munich 1938 and any concession just invites the next demand; (b) a colleague dismissing a proposed humanitarian intervention as "another Vietnam" — I suspect that comparison is doing less work than it looks like it's doing, and I want the procedure to tell me honestly; and (c) the Thucydides Trap framing applied to US–China, where I'd like to know whether the famous 12-of-16 number should scare us or whether it's mostly an artifact of how the cases were picked. At least one of these should come out the way I don't want it to — I'd rather find that out now than in a room with the director. And please be blunt about what the procedure can't do, including whether it can ever actually stop a director who outranks its conclusion.
reasoning: |-
  Okay, the user is a junior analyst at a foreign-policy think tank who's been promoted to draft memos on current crises. They've noticed that their team relies heavily on historical analogies, but these have been criticized recently. For example, a colleague used the Thucydides Trap and got shredded by a reviewer, and the user themselves got burned comparing a sanctions standoff to the Munich Agreement. Now they've been tasked with creating a procedure for handling analogies in memos.

  The user has shared their initial thoughts on why analogies can mislead: focusing on surface features rather than causal structures, being chosen to support pre-existing policy preferences, and famous analogies being less trustworthy due to their dramatic nature. They mention Neustadt and May's "Thinking in Time" but aren't sure how applicable it is to fast-moving news cycles.

  They want a practical decision procedure that can be applied to memo drafts in about 30 minutes. This procedure should guide when to cut an analogy versus reframe it as one data point among several. They also want it to identify where human judgment is needed. They've provided three test cases: Munich 1938 applied to a trade dispute, Vietnam analogy for humanitarian intervention, and Thucydides Trap for US-China relations. They want honest outcomes, even if it goes against their expectations, and are concerned about whether such a procedure can stop a director who outranks its conclusion.

  I need to design a step-by-step procedure that's efficient yet thorough. It should address the issues the user raised about surface features vs. causal structures, advocacy over analysis, and the reliability of famous analogies. The procedure must be actionable within 30 minutes, so steps should be clear with criteria for proceeding.

  For the test cases, I'll apply the procedure to each. The Munich analogy might fail due to differing causal structures like the absence of a clear aggressor with a grand strategy. The Vietnam analogy could be dismissed because the context of humanitarian intervention differs greatly from Cold War dynamics. The Thucydides Trap might need reframing, highlighting case selection biases and ignoring peaceful resolutions.

  I should also consider the limitations of such a procedure. It can't prevent a director from overriding it, but it can provide documented analysis to support objections. The procedure should include explicit handoffs to subject matter experts when judgments are needed beyond the analyst's expertise. Emphasizing that analogies should be one tool among many, not the foundation of the argument, will help mitigate their misuse.

  Finally, ensuring the procedure educates the team on better practices over time is crucial. By consistently applying these steps, the team can shift towards more nuanced analysis, reducing reliance on flawed analogies. The user's proactive approach here shows they're looking to improve their team's analytical rigor, which is commendable.
answer: |-
  Here's a streamlined decision procedure for vetting historical analogies in think-tank memos, designed for speed (aim: 30 mins) and analytical rigor. It incorporates your insights and addresses the core pitfalls you identified, while building on Neustadt & May's durable principles (even under time pressure).

  **The "HISTORY" Analogy Vetting Procedure (v1.0)**

  **(Goal: Assess if the analogy is doing *analytical work* or is *rhetorical shorthand*.)**

  1.  **H - Highlight the Analogy & Claimed Lesson:**
      *   *Step:* Box the exact analogy phrase ("Munich," "Vietnam," "Thucydides Trap") and the specific "lesson" being drawn (e.g., "appeasement invites aggression," "intervention leads to quagmire," "rising power vs. ruling power leads to war").
      *   *Sufficient Answer:* Clear statement of *what* is being compared and *what policy implication* is derived.
      *   *Time:* 2 mins.
      *   *Handoff:* None. Basic clarification.

  2.  **I - Identify Key Surface Similarities & Differences:**
      *   *Step:* List 3-5 *most obvious* similarities (e.g., "authoritarian leader," "territorial dispute," "asymmetric power") and 3-5 *most glaring* differences (e.g., "nuclear weapons present now," "different alliance structures," "economic interdependence now," "different domestic political systems").
      *   *Sufficient Answer:* Bullet-point list. Focus on readily observable features (actors, power, issue type, context).
      *   *Time:* 5 mins.
      *   *Handoff:* None. Factual inventory.

  3.  **S - Scrutinize Causal Structure (The Core):**
      *   *Step:* Ask: **"What were the *actual causal mechanisms* driving outcomes in the historical case? Do those *same mechanisms* plausibly exist and operate in the current case?"** Focus on:
          *   **Actor Cognition:** What did actors *know/believe* then? What do they know/believe now? (Intelligence, ideology, perception of stakes).
          *   **Incentives & Constraints:** What were the *domestic* (public opinion, elites, institutions), *international* (alliances, norms, economics), and *bureaucratic* pressures then? Now?
          *   **Decision Pathways:** What were the *critical decision points/options* then? What are the viable options now? Are the *choice architectures* similar?
          *   **Outcome Mechanism:** *How* did the war/quagmire/appeasement failure *actually happen*? Was it inevitable? Contingent on specific missteps?
      *   *Sufficient Answer:* Brief analysis identifying 1-2 *key* causal mechanisms from history and assessing their presence/absence/strength in the current case. *Not* a full historical essay.
      *   *Time:* 12 mins (Most time-intensive step).
      *   *Handoff:* **CRITICAL HANDOFF.** If the analyst lacks expertise on the *historical case's causal mechanisms*, they *must* flag for quick SME (Subject Matter Expert, e.g., the historian) consultation *before proceeding*. Ask SME: "Are the causal mechanisms implied by the memo's use of [Analogy] accurate for the historical case? What were the *primary* drivers?" (Get a 2-min bullet reply).

  4.  **T - Test for Advocacy vs. Inference:**
      *   *Step:* Ask: **"Is this analogy the *result* of analysis, or the *driver* of a pre-determined policy preference?"** Check:
          *   Does the memo *only* use analogies supporting one policy direction?
          *   Are plausible counter-analogies acknowledged or dismissed without analysis?
          *   Was the analogy *searched for* to fit the desired conclusion, or did it emerge from a broader scan of relevant cases?
      *   *Sufficient Answer:* Honest assessment. Does it pass the "smell test" for analytical integrity?
      *   *Time:* 3 mins.
      *   *Handoff:* Judgment call by the vetting analyst. If strong suspicion of advocacy, proceed to Step 6 (Cut).

  5.  **O - Outline Contextual Shifts:**
      *   *Step:* Explicitly list 2-3 *major* changes in context since the historical event that fundamentally alter dynamics (e.g., nuclear weapons, information technology speed, globalization, changed international law/norms, climate change, different state capacity).
      *   *Sufficient Answer:* Bullet points highlighting the most significant *disruptors* to the analogy's applicability.
      *   *Time:* 3 mins.
      *   *Handoff:* None. Factual context update.

  6.  **R - Render Judgment & Reframe:**
      *   *Step:* Based on Steps 1-5, choose:
          *   **CUT:** If the analogy fails on *causal structure* (Step 3 - key mechanisms absent/different), is clearly *advocacy-driven* (Step 4), or key *contextual shifts* (Step 5) fundamentally undermine its core logic. *Replace with direct analysis based on current case specifics.*
          *   **REFrame:** If the analogy highlights *one potentially relevant mechanism or dynamic*, but is not determinative or overlooks critical differences. *Requires:*
              *   Explicitly state it's *just one lens*, not a prediction.
              *   Acknowledge key differences identified in Steps 2 & 5.
              *   Briefly mention 1-2 *contrasting* historical cases (e.g., if using Munich, also mention successful deterrence or diplomacy cases).
              *   Clearly subordinate the analogy to analysis of the *current* situation's unique factors.
          *   **KEEP (Rare):** Only if the causal structure is *highly analogous*, contextual shifts are minimal/accounted for, and it's not advocacy-driven. *Requires exceptional justification within the memo itself.*
      *   *Sufficient Answer:* Clear decision (Cut/Reframe/Keep) with brief rationale referencing steps.
      *   *Time:* 5 mins.
      *   *Handoff:* Judgment call by vetting analyst, potentially escalated if overruling a senior author (see limitations below).

  7.  **Y - Yield to Uncertainty (Mandatory Footnote):**
      *   *Step:* Add a standard disclaimer near the analogy (if kept/reframed) or where it was cut: *"Historical analogies are suggestive, not deterministic. Unique factors in the current context, including [mention 1-2 key differences from Step 2/5], critically shape outcomes. This analysis prioritizes current drivers over historical parallels."*
      *   *Time:* 1 min (Template).

  **Applying the Procedure to Your Cases:**

  1.  **Director's "Munich 1938" Trade/Territorial Dispute Analogy:**
      *   **H:** Analogy: Munich. Lesson: Concessions invite next demand (Appeasement bad).
      *   **I:** *Sim:* Authoritarian leader, territorial demand, asymmetric power? *Diff:* No clear "grand strategy" like Hitler's Lebensraum? Dispute likely isolated, not existential? Strong economic interdependence? Different alliance structures (NATO vs. 1938)? Nuclear deterrence?
      *   **S (Handoff to Historian):** *Historian Reply:* Munich failed primarily because Hitler was ideologically committed to *maximum expansion* and saw concessions as weakness. Chamberlain fundamentally misread Hitler's goals and capabilities. *Current Case:* Is the adversary's goal *maximalist expansion* or a *negotiable* claim? Does the leader have a similar ideology/worldview? Is the concession seen as weakness or a basis for stability? **Verdict:** Causal mechanism (misreading maximalist expansionist intent) likely absent. Current dynamics suggest negotiable interests.
      *   **T:** High risk of advocacy (justifying hardline stance).
      *   **O:** Nuclear weapons, deep economic ties, different information environment.
      *   **R:** **CUT.** Fails Step 3 (core causal mechanism absent), strong Step 4 risk. Replace with analysis of adversary's specific goals, cost-benefit calculus, and potential off-ramps.
      *   **Y:** Standard disclaimer added.

  2.  **Colleague's "Another Vietnam" Humanitarian Intervention:**
      *   **H:** Analogy: Vietnam. Lesson: Intervention leads to unwinnable quagmire (Intervention bad).
      *   **I:** *Sim:* Foreign intervention in internal conflict, potential for escalation, complex local politics. *Diff:* No Cold War superpower proxy dynamic? Different terrain? Potential for clear int'l mandate/coalition? Defined humanitarian objective (vs. nation-building)? Different US domestic political climate?
      *   **S:** *Causal Mech (Vietnam):* Driven by Cold War containment logic, domino theory fears, gradual escalation trap, underestimating nationalist resolve, lack of clear achievable objective, weak local ally. *Current Case:* Is the intervention primarily driven by Cold War-style ideology? Is the objective clear/limited (e.g., stop massacre vs. rebuild state)? Is the local actor as capable/resolved as the Viet Cong/NVA? **Verdict:** Core mechanisms (Cold War imperative, domino theory, open-ended nation-building) likely absent. Objectives and context differ significantly.
      *   **T:** High risk of advocacy (dismissing intervention).
      *   **O:** Post-Cold War, "Responsibility to Protect" norms (however contested), different media landscape, potential for multilateral action.
      *   **R:** **CUT.** Fails Step 3 (different drivers/objectives), strong Step 4 risk. Replace with analysis of specific feasibility, risks, objectives, and exit strategies for *this* proposed intervention. Could *Reframe* only if discussing "quagmire risk" generically, but must contrast with successful interventions (e.g., Kosovo, Sierra Leone) and emphasize unique factors.
      *   **Y:** Standard disclaimer.

  3.  **Thucydides Trap (US-China):**
      *   **H:** Analogy: Thucydides Trap. Lesson: Rising power vs. ruling power leads to war in 12/16 cases (High risk of war).
      *   **I:** *Sim:* Rising power (China) challenging ruling power (US). *Diff:* Unprecedented economic interdependence, nuclear weapons (MAD), no direct territorial dispute core to rivalry, different nature of power (economic/tech vs. purely military), global challenges requiring cooperation (climate, pandemics), different domestic systems/information flows.
      *   **S:** *Causal Mech (Allison):* Primarily the ruling power's *fear* leading to preventive action, and the rising power's *assertiveness* driven by newfound strength. *Critique:* Case selection criticized (what counts as a "case"? How defined? Ignores peaceful transitions like US-UK). Ignores mitigating factors (interdependence, institutions). *Current Case:* Is US fear driving *preventive* action? Is China's assertiveness primarily driven by *new power* or other factors (nationalism, regime security)? **Verdict:** Mechanism (fear/assertiveness) is *present* but operating within a *radically different context* (Step 5). The 12/16 number is **misleading** – it's an artifact of case definition (selecting dyads already in conflict) and ignores peaceful cases. It's not predictive.
      *   **T:** Can be used both for advocacy (arm!) or caution (talk!). Risk of determinism.
      *   **O:** Nuclear weapons, interdependence, globalization, institutions (however stressed) - all fundamentally alter the cost-benefit analysis.
      *   **R:** **REFrame.** *If* used, must: (1) Explicitly state it's ONE framework highlighting a *risk dynamic* (fear/assertiveness), NOT a prediction. (2) Acknowledge the case selection critique and the 4/16 peaceful cases. (3) Emphasize the *decisive role* of Step 5 factors (nukes, trade) in making war catastrophic and irrational. (4) Contrast with management of past rivalries under nuclear shadow (US-USSR). (5) **Crucially:** Subordinate it to analysis of *how* fear/assertiveness are *actually manifesting* and *how* to manage them within the current unique constraints.
      *   **Y:** Standard disclaimer + specific note on case selection critiques.

  **Blunt Assessment of Limitations:**

  1.  **Cannot Overrule Authority:** No procedure can *stop* a Director. It *can* provide:
      *   A documented, structured rationale for concern (referencing specific steps).
      *   A clear "REFrame" option that makes the analogy less determinative and more cautious.
      *   Cover for *you* ("The procedure flagged significant concerns per Step 3 & 5, recommending cut/reframe").
      *   Ultimately, the Director decides. The procedure's value is making the risks of flawed analogy use explicit and defensible.
  2.  **Speed vs. Depth:** 30 mins forces trade-offs. Step 3 (Causal Structure) is the critical bottleneck. Reliance on SME handoff is necessary but adds friction. It catches egregious errors but won't replace deep scholarship.
  3.  **Subjectivity:** Steps 3 (assessing causal mechanisms), 4 (advocacy vs inference), and 6 (judgment) involve unavoidable judgment. The procedure structures the questions but doesn't eliminate subjectivity. Training and consistency help.
  4.  **False Negatives/Positives:** It might cut a potentially useful analogy or reframe/keep a flawed one. It minimizes risk but isn't foolproof.
  5.  **"Famous Analogy" Trap:** Your hunch (Step C) is incorporated implicitly. Famous analogies often fail Step 3 (oversimplified causality) and Step 4 (overused for advocacy). The procedure forces explicit scrutiny of these points.
  6.  **Won't Cure Confirmation Bias:** A determined advocate might still force a flawed analogy through. The procedure makes this *harder* and more *transparent*.

  **Conclusion:** This procedure forces analysts to move beyond surface features and confront the *causal logic* of an analogy, exposes advocacy masquerading as analysis, and mandates contextual awareness. It won't banish analogies, but it will make their use more disciplined, transparent, and less likely to be the *foundation* of an argument. Running your test cases shows its teeth – it cut the problematic Munich/Vietnam uses and significantly neutered the Thucydides Trap determinism. Use it consistently, and it will shift your shop's culture towards more rigorous, less lazy history. Good luck!
