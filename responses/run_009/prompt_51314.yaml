prompt: |-
  My sister has decided views on whether everyday conventions carry genuine moral weight, and over the years I have collected her rulings. Cutting a queue is wrong, even in a nearly empty pharmacy where the person displaced would never notice. Jaywalking across a completely deserted street at 3 a.m. is fine, though jaywalking in daylight, in front of drivers who then brake for her, is wrong. Stiffing a waiter in the United States is wrong even though she regards the American tipping system as itself unjust, while not tipping at all in Japan is fine and tipping there gratuitously is merely gauche. A visitor who keeps shoes on in a Japanese home has done something wrong. And a tourist who jostles for position at a bus stop in a country where queueing is simply not the custom has done nothing wrong. Next month a friend of ours travels in a country where small routine payments to officials — the expediting fee at the border, the customary consideration to the clerk who processes your paperwork — are universal, expected, and relied upon, the officials' effective incomes being set on the assumption of them, and the written rules against them are dead letters nobody treats as live. Our friend, recalling my sister's verdicts on tipping, intends to pay without hesitation. Predict her verdict on the friend's conduct, lay out the rules that fit her track record equally well and what each one predicts here, give your best guess with reasons, and name a further case that would best tell those rules apart.
reasoning: |-
  Okay, let me tackle this query step by step. The user presents a series of moral rulings by their sister and asks for a predicted verdict on whether their friend should pay "expediting fees" in a country where such payments are customary despite being technically illegal. 

  First, I need to analyze the sister's existing judgments. Her rulings seem to consistently prioritize harm prevention and social convention over written rules. For example:
  - Queue-cutting is wrong even if harmless because it violates social order
  - Jaywalking is only wrong when it causes reaction (braking drivers), not when truly consequence-free
  - Tipping is mandatory in the US (due to wage structures) but forbidden in Japan (where it disrupts norms)
  - Shoe-wearing in Japanese homes is wrong as it breaches cultural etiquette

  The key patterns emerging are:
  1) Significance of tangible consequences (harm/benefit)
  2) Respect for functional conventions that maintain social coordination
  3) Dismissal of "dead letter" rules with no real enforcement or expectation
  4) Sensitivity to context-specific norms

  Now applying this to the friend's situation:
  - The payments are universal and expected
  - Officials' livelihoods depend on them
  - Written prohibitions are ignored by all parties
  This maps closely to the US tipping case (mandatory despite systemic injustice) and contrasts with Japan's no-tipping norm. The sister would likely approve the payments as respecting functional conventions.

  But there's nuance - could argue it's like jaywalking where formal illegality is irrelevant when harmless. Or like the bus-stop case where foreign customs override personal habits. 

  For rule differentiation, I consider testing with a scenario where:
  - A convention causes harm despite being normalized (e.g., bribes enabling corruption)
  - Versus harmless but deeply ingrained practices
  This would reveal whether harm prevention or convention compliance is her ultimate priority.

  Best guess: She'll approve the payments. Her track record shows greater concern for sustaining functional systems than defying unenforced rules, especially when refusal would disrupt livelihoods. The US tipping parallel is particularly strong - both involve participating in flawed but operational systems.
answer: |-
  Based on your sister's established rulings, her **predicted verdict** is that **paying the routine "expediting fees" is morally permissible and likely even expected/right** for your friend in this context.

  **Rules Fitting Her Track Record:**

  Here are distinct moral rules consistent with her prior judgments, each predicting a different outcome here:

  1.  **The Functional Convention Rule:** An everyday convention carries genuine moral weight *if* it serves a tangible, widely understood social function (coordination, harm prevention, fair compensation expectation) and is actively relied upon within that context, *regardless* of formal legality. Violating it causes disruption or harm to the system and expectations.
      *   *Prediction for Friend:* **Pay.** The fees are universal, expected, relied upon for income, and functionally part of the system. Withholding them disrupts the expected compensation and the smooth functioning of the process.

  2.  **The Harm/Disruption Rule:** An everyday convention carries moral weight primarily when violating it causes *tangible harm* (physical, financial, emotional distress) or *significant disruption* to others or the social order, especially when it forces an unexpected reaction or burden onto others.
      *   *Prediction for Friend:* **Pay.** Withholding the expected fee *would* cause tangible harm (reducing the official's expected income) and disruption (delays, confusion, potential retaliation). Paying causes no harm as it's expected.

  3.  **The "Dead Letter" vs. "Live Rule" Distinction:** Written rules carry little to no moral weight if they are universally ignored "dead letters" with no enforcement and no expectation of compliance. Conversely, unwritten but universally followed and relied-upon conventions *do* carry moral weight as the *de facto* "live rules."
      *   *Prediction for Friend:* **Pay.** The written rules against the fees are explicitly described as "dead letters." The unwritten convention *is* the live rule governing the interaction and compensation.

  4.  **The Cultural Context Rule:** Moral weight applies primarily to conventions within their native cultural context. Visitors are obligated to follow the *actual, lived conventions* of the place they are in, not their own norms or the formal laws of that place if they are dead letters. The bus stop and Japan tipping/shoe examples support this.
      *   *Prediction for Friend:* **Pay.** The friend is a visitor. The *actual, lived convention* in this country is to pay the routine fees. Following the dead-letter law instead would be imposing an external norm, like keeping shoes on in Japan or queueing where it's not done.

  5.  **The Systemic Participation Rule:** When a deeply flawed system relies on a convention (like US tipping), participating in that convention is morally required *within the system* to avoid unfairly burdening individuals (like the waiter), even if the system itself is unjust. Boycotting the convention only becomes permissible if it's part of a collective effort to change the system and doesn't unfairly punish individuals.
      *   *Prediction for Friend:* **Pay.** This situation is directly analogous to US tipping: a flawed system relies on the payments for income. Withholding punishes the individual official without changing the system. Her stance on US tipping predicts this.

  **Best Guess with Reasons:**

  My best guess is that your sister would rule **paying is permissible and likely expected/right**, aligning with Rules 1, 2, 3, 4, and 5. Here's why:

  1.  **Strong Analogy to US Tipping:** This is the clearest parallel. She mandates tipping in the US despite deeming the system unjust because *not* tipping harms the individual waiter whose income relies on it. Similarly, *not* paying here harms the official whose income relies on it. The "dead letter" law is irrelevant, just as the inherent injustice of the tipping system doesn't absolve the individual diner.
  2.  **Emphasis on Function and Reliance:** Her rulings consistently recognize conventions that *function* within a context and are *relied upon* (queueing maintains order, tipping supplements income, shoe removal maintains cleanliness/respect). These fees clearly function within this administrative system and are relied upon for income.
  3.  **Harm/Disruption Avoidance:** Her jaywalking rule hinges on causing a reaction (braking). Not paying would cause a tangible negative reaction – harm to the official's income, disruption to the process, potential delays/retaliation for the friend. Paying causes no harm as it's expected.
  4.  **Cultural Context & Dead Letters:** The bus stop and Japan examples show she prioritizes the *actual lived convention* of the place over formal rules (if dead) or foreign norms. Here, the lived convention is paying. The written rule is a dead letter.
  5.  **Absence of Countervailing Harm:** Unlike stiffing a waiter, there's no suggestion these routine payments fund broader corruption or systemic violence; they're presented as mundane operational grease within a flawed system, much like tips. She doesn't object to participating in the US tipping system on those grounds.

  **Further Case to Tell the Rules Apart:**

  **Scenario:** In a country, there is a deeply ingrained, universally expected, and functionally relied-upon convention of making small "donations" to local community strongmen to ensure "protection" and basic municipal services. The official police are underfunded and ineffective. The strongmen are known to use some of this money for local improvements but also to fund violent enforcement and intimidate political opponents. The written laws strictly prohibit such payments, but enforcement is non-existent against the strongmen, and citizens universally pay. A foreign business owner setting up a small shop is expected to pay.

  *   **Functional Convention Rule (Rule 1):** Might lean towards **Pay.** The convention is functional (provides security/services), expected, and relied upon. Not paying disrupts the system and could lead to denial of services or worse for the business owner.
  *   **Harm/Disruption Rule (Rule 2):** **Ambiguous.** Paying funds potential harm (violence/intimidation), but *not* paying risks direct harm to the business owner and disruption to their business. Which harm/disruption is greater/more direct?
  *   **Dead Letter vs. Live Rule (Rule 3):** Likely **Pay.** The written law is a dead letter; the payment is the live rule.
  *   **Cultural Context Rule (Rule 4):** Likely **Pay.** The foreigner should follow the lived convention of the place they are operating in.
  *   **Systemic Participation Rule (Rule 5):** Likely **Do NOT Pay.** This moves beyond a flawed-but-mundane system (like tipping or expediting fees) into funding significant, direct harm and injustice (violence, intimidation). Participating actively supports this harm, even if boycotting carries personal risk. The harm funded outweighs the harm avoided by participating. This contrasts sharply with the relatively benign harm of perpetuating low wages (tipping) or bureaucratic inefficiency (expediting fees).

  **How it distinguishes:** The US tipping/expediting fee case and this protection racket case look similar under Rules 1, 3, and 4 (functional, dead letter, cultural context). Rules 2 (Harm) and 5 (Systemic Participation) become crucial here. Rule 2 would require weighing the types and likelihoods of harm. Rule 5 would likely draw a line: participating in a system causing *serious, direct harm* (violence) is wrong even if expected, whereas participating in flawed but *relatively benign* systems (low wages, inefficiency) is required to avoid unfairly burdening individuals. Your sister's reaction to this "protection fee" scenario would reveal whether her primary concern is avoiding immediate disruption/harm (Rule 2) or refusing to participate in systems causing significant injustice/harm (Rule 5), even at personal cost. Her stance on US tipping suggests Rule 5 is a strong contender, but this case would test its limits.
