answer: |-
  ## Ask the Public
  *In which the collected wisdom of our age offers prudent reflection upon the common perplexities of existence.*

  **LETTER THE FIRST: A Question of Zeal**
  *Esteemed Public,*
  I am a young man of nineteen, possessed of a fiery conviction regarding the plight of the city's poor. I feel compelled to act, to dedicate myself wholly to their aid, perhaps even founding a society. Yet friends counsel moderation, suggesting such fervour appears excessive, even slightly ridiculous, in these reflective times. Ought I to stifle this impulse towards action?
  *— Eager but Hesitant, Nyboder*

  **THE PUBLIC REPLIES:**
  The Public observes that the predicament of the correspondent is entirely characteristic of youthful earnestness. This feeling of compulsion, this "fiery conviction," is a known phenomenon among persons of a certain age and limited experience. It arises, the Public suspects, from a temporary surplus of energy not yet properly directed into channels of calm consideration. The Public commends the counsel of the correspondent's friends. Moderation is indeed the watchword of the sensible citizen. To stifle an impulse? The Public would not phrase it so bluntly, for that implies a violence unbecoming of our age. Rather, the Public advises the cultivation of a thoughtful distance. Study the matter further, observe existing societies (from a respectable vantage point, naturally), discuss the plight of the poor with intelligent acquaintances over coffee – but always with the understanding that action untempered by prolonged reflection risks appearing theatrical. The Public finds that earnestness, while not inherently blameworthy, benefits greatly from being leavened with irony. Perhaps the correspondent might consider writing a measured essay? This paper stands ready to provide a forum for such sensible contemplation.

  **LETTER THE SECOND: The Burden of a Name**
  *Wise Public,*
  I have penned an essay critical of certain fashionable literary trends. Though I believe my arguments sound, I hesitate to affix my name. Publication anonymously offers safety from potential ridicule or backlash, yet feels somehow cowardly. Is anonymity truly the modern way, or does it diminish the force of conviction?
  *— An Author of Some Apprehension, Frederiksberg*

  **THE PUBLIC REPLIES:**
  The Public perceives in this letter a tension entirely unnecessary in our enlightened era. The correspondent speaks of "conviction" and "cowardice," terms redolent of a more strenuous, perhaps less thoughtful, age. The Public finds anonymity a most prudent and modern convention. It allows ideas – those worthy reflections – to circulate freely in the marketplace of opinion, detached from the distracting particularities of the individual who happened to set them down. Does it diminish force? On the contrary! It elevates the opinion itself, allowing it to be judged purely on its merits (or lack thereof) by the collective discernment of the Public, without the vulgar intrusion of personality. Ridicule, should it arise, is a tribute paid to the visibility of an idea within the Public discourse; it is far more easily borne when diffused across the anonymous author and absorbed by the Public itself. This paper, as the humble instrument of the Public, exists precisely to facilitate such detached, nameless exchange. Attach the name, and the focus shifts perilously to the *who* rather than the *what*. The Public recommends anonymity; it is the truly reflective stance.

  **LETTER THE THIRD: The Sting of Satire**
  *Discerning Public,*
  A certain weekly sheet, known for its sharp wit, has lately featured a caricature that I, and several acquaintances, feel unmistakably targets my person and habits. The depiction is unflattering and has caused some amusement among my circle. Should I take offense? Is it seemly to mind such things, or must one simply endure being the Public's jest?
  *— Feeling Rather Pricked, Gammelholm*

  **THE PUBLIC REPLIES:**
  The Public notes that the correspondent experiences a sensation common to those who find themselves, however briefly, the subject of printed remark. This feeling of being "pricked" is understandable, though perhaps indicative of an undue sensitivity. The Public observes that satire, particularly in this paper and others of its discerning kind, serves a vital function: it polices the boundaries of the acceptable and the fashionable through the application of corrective laughter. To be its object is not a mark of shame, but a sign of relevance, however fleeting, within the Public sphere. The correspondent asks if offense is seemly. The Public believes not. Taking offense requires a degree of personal investment that borders on the passionate, a quality increasingly out of step with the times. The truly modern response is to join the laughter, even if directed at oneself. This demonstrates an understanding of the game, an appreciation for the cleverness of the jest, and an awareness that individual peculiarities are always fair game for the collective eye of the Public. Endurance is unnecessary; assimilation is the key. Laugh along. It is the safest, most sensible course. This paper merely reflects the Public's gentle mockery.

  **LETTER THE FOURTH: The Persistent Critic**
  *Public (if such a soulless abstraction may be addressed),*
  Week after week, this column manifests the very disease it purports to cure. You dissolve the individual into the faceless mass, replace action with endless chatter, and mistake cowardice for prudence. You consume passion with reflection and stone the solitary soul with the pebbles of printed laughter. Are you not merely the machinery by which envy, the only active force left, grinds down anything that dares to stand apart? Your "advice" is poison served in fine porcelain.
  *— K.*

  **THE PUBLIC REPLIES:**
  The Public observes that the correspondent, signing merely 'K.', exhibits a remarkable intensity of feeling, a singularity of perspective that is, in its own way, quite arresting. The passion displayed is itself noteworthy as a phenomenon increasingly rare. The Public discerns, beneath the correspondent's vehement tone, a flicker of that very envy which he names – a natural, if regrettable, consequence of observing the smooth functioning of the collective spirit from its periphery. The Public appreciates the correspondent's engagement, however heated, with its forum; it is proof of the paper's role as a conduit for the diverse murmurs that constitute Public opinion. The charge of "stoning" is particularly vivid. The Public reflects that every age develops its own methods for maintaining equilibrium. Where once physical stones were cast in earnest passion, the modern age employs the lighter, yet no less effective, projectiles of wit and irony, administered impersonally through the press – a far more civilized arrangement, surely. The Public does not demand conformity; it merely observes that the sensible majority finds comfort and safety within its embrace. As for martyrs? The Public muses that every age gets the martyrs it deserves. Ours, perhaps, prefers them laughed into obscurity rather than bloodily elevated. The correspondent's individuality is acknowledged; the Public commends him for it, even as it notes that such distinctness inevitably attracts the attention, and sometimes the amusement, of the crowd. This paper is but the mirror.
