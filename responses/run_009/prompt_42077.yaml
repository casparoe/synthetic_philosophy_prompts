  ### Procedure for Updating Probability Estimates with Uncertain Evidence

  **Core Idea**: Use *Jeffrey Conditionalization* to update probabilities without treating the report as certain. Instead of conditioning on the report being true (which assumes certainty), we adjust probabilities based on the *weight* of the evidence, quantified by a reliability score.

  ---

  #### Step-by-Step Procedure
  1. **Define the Hypothesis (H) and Current Probability (P_old)**  
     - *Ask*: "What event are we assessing? What is its current probability?"  
     - *Sufficient answer*: Clear description of H (e.g., "Port closure in Country X") and P_old (e.g., 0.25).  
     - *Stop if*: H is ambiguous or conflicts with existing definitions. Hand to **Team Lead** to resolve.

  2. **Characterize the Report**  
     - *Ask*: "Does the report support H (e.g., 'Event happened') or ¬H (e.g., 'Event did not happen')? Is it about H or a related event?"  
     - *Sufficient answer*: "Supports H" or "Supports ¬H". If the report is indirect (e.g., "Minister resigned"), note how it relates to H.  
     - *Stop if*: The link to H is unclear. Hand to **Senior Analyst** to define the relationship.

  3. **Assess Report Reliability (s)**  
     - *Ask*: "If H were true, how likely is this report? If H were false, how likely is it?"  
     - *Sufficient answer*: Two probabilities:  
       - `s = P(report | H)` (True Positive Rate)  
       - `f = P(report | ¬H)` (False Positive Rate).  
       *Use shorthand*: If the source is "usually reliable," default to `s = 0.8, f = 0.2` (adjust per historical accuracy).  
     - *Stop if*: Reliability is unknown or contentious. Hand to **Source Reliability Manager** to decide `s` and `f`.  
     - *Pro tip*: For anonymous sources, use `s = 0.6–0.7, f = 0.3–0.4`; for multiple sources, average their individual `s`.

  4. **Calculate New Probability (P_new)**  
     - *Formula*:  
       \[
       P_{\text{new}} = \frac{s \cdot P_{\text{old}}}{s \cdot P_{\text{old}} + f \cdot (1 - P_{\text{old}})}
       \]  
     - *Spreadsheet setup*:  
       - Cell A1: `P_old`  
       - Cell A2: `s`  
       - Cell A3: `f`  
       - Cell A4: `=(A2*A1)/(A2*A1 + A3*(1-A1))`  
     - *Special cases*:  
       - If the report supports ¬H, reverse `s` and `f` (i.e., `P_new = [f · P_old] / [f · P_old + s · (1 - P_old)]`).  
       - If no report arrives when expected (e.g., "bad news leaks faster"), use Step 6.

  5. **Update and Document**  
     - Set `P_old = P_new`.  
     - Log: `P_old`, `s`, `f`, `P_new`, and rationale for `s`/`f`.

  6. **Absence-of-Report Case (Special Workflow)**  
     - *Trigger*: When no report arrives, but one was expected if H were true.  
     - *Ask*:  
       - "If H is true, how likely was a report? Call this `q = P(\text{report} | H)`."  
       - "If H is false, how likely was a report? Call this `r = P(\text{report} | ¬H)`."  
     - *Formula*:  
       \[
       P_{\text{new}} = \frac{(1 - q) \cdot P_{\text{old}}}{(1 - q) \cdot P_{\text{old}} + (1 - r) \cdot (1 - P_{\text{old}})}
       \]  
     - *Example*: If bad news leaks faster, `q` (report|H) is high (e.g., 0.9), and `r` (report|¬H) is low (e.g., 0.1).  
     - *Stop if*: `q` or `r` is disputed. Hand to **Scenario Manager**.

  ---

  ### Example Cases

  #### Case 1: Head of State Hospitalized  
  - **H**: Head of state hospitalized within 24 hours. `P_old = 0.1`.  
  - **Report**: Single reliable source (historical accuracy 85%) claims hospitalization.  
  - **Steps**:  
    1. H and `P_old = 0.1` defined.  
    2. Report supports H.  
    3. `s = 0.85` (reliable if H true), `f = 0.15` (likely error if H false).  
    4. `P_new = (0.85 * 0.1) / (0.85*0.1 + 0.15*0.9) = 0.085 / 0.22 ≈ 0.386`.  
    5. Update: Probability rises to **38.6%**.

  #### Case 2: Sanctions Announcement  
  - **H**: Sanctions announced by Friday. `P_old = 0.3`.  
  - **Report**: Wire story citing two anonymous officials.  
  - **Steps**:  
    1. H and `P_old = 0.3` defined.  
    2. Report supports H.  
    3. Anonymous sources: `s = 0.65` (moderate true positive), `f = 0.35` (moderate false positive).  
    4. `P_new = (0.65 * 0.3) / (0.65*0.3 + 0.35*0.7) = 0.195 / 0.44 ≈ 0.443`.  
    5. Update: Probability rises to **44.3%**.

  #### Case 3: Absence of Report (e.g., Bad News Leaks Faster)  
  - **H**: Major diplomatic incident in Country Y. `P_old = 0.4`.  
  - **Context**: No report received, but leaks always emerge within 1 hour if H is true.  
  - **Steps**:  
    1. H and `P_old = 0.4` defined.  
    2. *No report* supports ¬H (absence suggests no incident).  
    6. Assess:  
       - `q = P(\text{report} | H) = 0.95` (leaks fast if true).  
       - `r = P(\text{report} | ¬H) = 0.2` (false alarms rare).  
       - `P_new = [(1 - 0.95) * 0.4] / [(0.05 * 0.4) + (0.8 * 0.6)] = 0.02 / 0.5 = 0.04`.  
    5. Update: Probability drops to **4%**.

  ---

  ### Limitations and Caveats
  - **Order of Reports Matters**: Sequential updates are order-dependent. If two reports arrive close together, recompute from scratch using all evidence to avoid bias.  
    - *Implication*: Recompute weekly or after major events.  
  - **Answer You Won’t Like**: If `P_old` is very low (e.g., 0.01) and a report with imperfect reliability (`s = 0.8`, `f = 0.2`) supports H, `P_new` only rises to **3.9%**. Low priors dilute updates—even reliable evidence.  
  - **What It Can’t Do**:  
    - Handle complex evidence where `s`/`f` depend on external factors (e.g., market conditions). Judgment needed.  
    - Fully replace deep analysis for interconnected events (e.g., cascading risks). Use as a first-pass tool.

  ---

  ### Confidence Assessment
  - **Most Confident**: Steps 1–2 and 4 (formulas are mathematically sound; widely used in intelligence analysis).  
  - **Least Confident**: Step 3 (Assessing `s` and `f`).  
    - *Why*: In live situations, analysts may default to historical averages despite context changes (e.g., a usually reliable source is stressed).  
    - *Mitigation*: Require brief justification for `s`/`f` (e.g., "Source A was wrong last month on topic X").

  ### Final Note
  **Philosophy-Free Summary**: "We adjust probabilities based on how much a report *should* change our minds, not because we trust it blindly. We score reliability, then math does the rest."
