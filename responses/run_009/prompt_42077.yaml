          - If the report is the *absence* of an expected report, then go to step 6.
          - Otherwise, determine if the report supports H or ~H. 
     3. **Assess the reliability s (between 0 and 1, typically >0.5) for the report.**
          - If the team cannot agree within one minute, hand to [Team Lead] to decide.
     4. **If the report supports H:**
            P_new = (s * P_old) / (s * P_old + (1-s) * (1-P_old))
     5. **If the report supports ~H:**
            P_new = ( (1-s) * P_old ) / ( (1-s) * P_old + s * (1-P_old) )
     6. **If the report is the absence of an expected report:**
          - This is evidence supporting ~H (or in some contexts supporting H, but typically ~H). Determine direction.
          - Assess:
               p1 = P(report would occur | H)   [if H is true, how likely was a report?]
               p0 = P(report would occur | ~H)  [if H is false, how likely was a report?]
          - If the team cannot agree on p1 and p0 within one minute, hand to [Team Lead].
          - If the absence supports ~H (which is the typical case), then:
               P_new = [ (1-p1) * P_old ] / [ (1-p1)*P_old + (1-p0)*(1-P_old) ]
          - If the absence supports H (unusual), then we would need to adjust accordingly, but this is rare. (Example: if we expect that in the event of ~H there would definitely be a report, and its absence means H. Then p0=1, then absence would be impossible under ~H, so we would set P_new=1. But that's extreme.)

     **Note:** In step 6, the absence of a report is treated as an observation that we use to update. We do not update in the absence of a report unless we were actively expecting one and its absence is informative.

     **When to stop:** If the team cannot agree on the parameters (s, p1, p0) and the team lead is not available, then do not update. Skip the report.

     **Order of reports:** As noted, order matters. We update sequentially. If two reports arrive in close succession, it might be better to wait and do a batch update. But our procedure does one report at a time. We assume that the time between reports allows for updates.

     Given the constraints, this is a practical procedure.

     Let's hope it works.
