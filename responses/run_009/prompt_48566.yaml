prompt: |-
  My roommate is doing philosophy of science and she has an argument that, on the Bayesian analysis, nothing ever confirms anything, and I can't find the hole in it. It goes:

  (1) Confirmation is credence-raising. Officially: E confirms H for you iff P(H|E) > P(H) — the thing that would go up if you learned E.
  (2) You can only learn what you don't already give probablity 1.
  (3) Conditioning on a certainty is a no-op: if P(E)=1 then P(H|E)=P(H).
  (4) Take the classic case. Astronomers had known since the 1850s that Mercury's perihelion precesses about 43 arcseconds per century more than the Newtonian story allows — Le Verrier flagged the anomaly in 1859 and nobody could explain it. Then in November 1915 Einstein shows general relativity spits out exactly that number. By then every physicist who cared had the perihelion data at probability 1; it had been sitting in the literature for over fifty years.
  (5) So by (1)-(3) the perihelion evidence confirmed general relativity for nobody alive in 1915. Nothing got conditioned on.
  (6) And this isn't special to Mercury. There's always a lag between an observation being made and a theory being proposed to account for it, so whenever a theory meets its evidence, that evidence is already old for everyone who's heard of it — which, once the data is published, is everyone in a position to do the confirming. So no theory is ever confirmed by any evidence after the data goes public, and all the evidence for every mature theory is public.
  (7) But the perihelion calc is the textbook example of a theory getting confirmed by its evidence, and if (6) holds then mature science is a pile of unconfirmed theories, which is crazy.
  (8) So (1) is false, and her stated moral is that the Bayesian definition of confirmation eats itself with its own updating rule.

  Here's where I keep getting stuck. When I push on (5), she concedes that what got learned in 1915 wasn't the data, it was the fact that GR entails the data — but then she says what got confirmed was some conjunction, and calling that "the perihelion confirmed GR" is a bookkeeping trick about which proposition you condition on, which is exactly her point. When I push on (6), I honestly can't tell whether I'm denying a real generalization or just refusing to look at it. And I keep feeling a slide between the "would raise" in (1) and the "did raise" in (5) — for old evidence the antecedent of (1)'s counterfactual is impossible, you can't learn what you already know, so I don't even know how (1) is supposed to get applied in (5). But if (1) can't be applied there, is her argument invalid, or just unsound, or actually fine? Sort me out: which step is the weak one, is the flaw hidden in the reasoning or is it a genuine dilemma about which plausible premise to give up, and what does each way out cost? If I have to keep one thing it's (1), since its the only definition of confirmation I actually understand, but tell me straight if thats the one that has to go.
reasoning: |-
  Okay, the user's roommate presents a Bayesian argument that nothing ever confirms any theory because once evidence is public, its probability is 1, so conditioning on it doesn't change anything. The user is stuck and wants to know where the flaw is.

  First, I need to break down the argument. The key premises are: confirmation requires credence-raising, you can only learn what isn't already certain, conditioning on certainties does nothing, and in historical cases like Mercury's perihelion, the evidence was already certain for scientists by the time a theory explained it. Therefore, no confirmation happens.

  The user mentions pushing back on step (5) about what was learned in 1915. The roommate counters that learning "GR entails the evidence" confirms a conjunction, not GR itself. That's a valid point but feels like a red herring. The core issue is whether old evidence can confirm theories under Bayesianism.

  I recall the "problem of old evidence" in philosophy of science. This is a known issue for Bayesians. The solution often involves counterfactual credence. Instead of using the actual probability, we consider what the probability would have been if the evidence wasn't already known. So for Mercury's perihelion, scientists in 1915 should imagine their credence in GR without knowing about the anomaly. Since GR predicts it exactly, conditionalizing on the evidence would raise the probability, thus confirming it.

  The user senses a slide between "would raise" and "did raise" in the argument. That's crucial. Premise (1) defines confirmation as P(H|E) > P(H), but for old evidence, P(E)=1, so technically P(H|E)=P(H). However, the counterfactual interpretation separates this. Confirmation is about whether learning E would raise H's probability, not whether it did in actual history. This resolves the dilemma without rejecting (1).

  The roommate's step (6) generalizes incorrectly. Not all evidence is old when a theory explains it. Sometimes theories predict novel evidence not yet observed. In those cases, when the evidence is learned, P(E)<1, so conditioning directly raises P(H). The Mercury case is specific to accommodation, not prediction.

  The user wants to keep (1), the Bayesian definition. Good news—they can. The fix is in how we apply it to old evidence, using counterfactual credence. Giving up (1) leads to worse problems, like losing a formal definition of confirmation.

  Costs: Counterfactual credence requires reconstructing historical beliefs, which can be messy. But it's a necessary move to save Bayesian confirmation theory. The alternative is accepting that no established evidence confirms theories, which is absurd.

  So the weak step is the application of (1) to old evidence without the counterfactual tweak. The flaw is in the reasoning, specifically ignoring the modal aspect of "would raise." The solution preserves all premises but reinterprets (1) counterfactually for cases of old evidence.
answer: |-
  Your roommate's argument is clever and taps into a famous problem in Bayesian philosophy of science: **the Problem of Old Evidence**. It's a genuine challenge, but there's a widely accepted solution that preserves the core Bayesian definition of confirmation. Here's the breakdown:

  ### The Flaw: Misapplying (1) to Old Evidence (The Core Issue)
  The critical weak step is **step (5)** and its generalization in (6). The error isn't in premises (1)-(4) themselves, but in **how (1) is applied to cases where the evidence is already known (old evidence)**. Specifically:
  *   Premise (1) defines confirmation as **`P(H|E) > P(H)`**.
  *   Steps (5) and (6) interpret `P(H|E)` and `P(H)` as the agent's *actual* credences *at the time the theory is proposed* (1915). Since `P(E) = 1` for these agents in 1915, conditioning is a no-op: `P(H|E) = P(H)`. So, no *actual* credence change occurs *at that moment*.
  *   **The flaw is conflating the *counterfactual force* of (1) with an *actual credence change*.** Premise (1) is fundamentally about **what *would* happen *if* you learned E**. It's a counterfactual comparison: *If* your current credence function were conditioned on E, *then* H's probability would be higher than it currently is *unconditioned*.
  *   When E is *already* known (`P(E) = 1`), the antecedent of this counterfactual ("if you learned E") is **impossible**. You *can't* learn what you already know. Applying (1) naively using the agent's *actual* probability-1 credence function at time T (when E is old) is **misleading**. The counterfactual "if you learned E" implicitly requires considering your credence function *before* E was learned (or a state where E isn't certain).

  ### The Solution: Counterfactual Credence
  The standard Bayesian solution (developed by philosophers like Clark Glymour, Richard Jeffrey, and Garber) is to evaluate confirmation by old evidence **counterfactually**:
  1.  **Reconstruct the agent's credence function *before* they learned E.** Imagine credences at a time when `P(E) < 1` (even if only slightly less).
  2.  **Evaluate `P_old(H|E)` vs. `P_old(H)` using this counterfactual credence function.** Does conditioning on E raise the probability of H *relative to this hypothetical state of ignorance (or lesser certainty) about E*?
  3.  **If `P_old(H|E) > P_old(H)`, then E confirms H for the agent, *even though they now know E for certain*.** The confirmation relation holds *in virtue of* what learning E *would have done* to their beliefs at an earlier epistemic state.

  ### Applying the Solution to Mercury (Step 5)
  *   For physicists in 1915, the perihelion anomaly (`E`) was old news (`P(E) = 1`).
  *   However, to see if `E` confirms GR (`H`), we must ask: **What would their credence in GR have been *before* they learned about the anomaly?**
      *   Let `P_old` represent their rational credence function *circa 1858* (before Le Verrier's precise calculation was widely known/accepted, or simply before they knew the exact value was irreconcilable with Newton).
      *   At that time, `P_old(E) < 1` (they might have had high credence Newtonian mechanics could explain any planetary motion, but the *specific* discrepancy wasn't certain knowledge).
  *   **Crucially, we also need their counterfactual credence in the *entailment*: `P_old(H \supset E)`.** What's the probability they would have assigned *in 1858* to the proposition "If GR is true, then the perihelion precession of Mercury is exactly 43''/century"? Before Einstein, this would have been very low. GR was unknown, and Newtonian mechanics was dominant. There was no known reason to expect this specific value.
  *   **Now evaluate:**
      *   `P_old(H)` would have been *extremely* low (approaching 0) in 1858. GR didn't exist.
      *   `P_old(H|E) = P_old(H \cap E) / P_old(E)`. Since `H` entails `E` (`H \supset E` is logically true), `H \cap E` is equivalent to `H`.
      *   Therefore, `P_old(H|E) = P_old(H) / P_old(E)`.
      *   **Since `P_old(E) < 1`, it follows that `P_old(H|E) > P_old(H)`.** Specifically, `P_old(H|E)` is `P_old(H)` *divided* by a number less than 1, so it's *larger* than `P_old(H)`. Learning `E` *would have* significantly raised the credence of `H` for an agent in that 1858 state of knowledge.
  *   **Therefore, `E` *does* confirm `H` according to definition (1), evaluated counterfactually relative to a state of lesser knowledge about `E`.** The fact that physicists in 1915 *actually* had `P(E)=1` doesn't negate this counterfactual confirmation relation. The textbook example holds.

  ### Addressing Your Pushback & Her Counter (Conjunctions)
  You were right to push on (5) regarding what was learned in 1915. Your roommate's counter ("what got confirmed was some conjunction, and calling that 'the perihelion confirmed GR' is a bookkeeping trick") **partly concedes the point but misses the mark**:
  *   What physicists *actually* learned in 1915 was the **entailment**: `T \supset E` (If GR (`T`) is true, then the perihelion anomaly (`E`) occurs). *This* was new evidence (`P(T \supset E) < 1` before Einstein's calculation).
  *   Conditioning on `T \supset E` *does* raise `P(T)` relative to the credence function *held just before learning the entailment*, even if `P(E)=1` (see *Jeffrey Conditionalization* for handling uncertain evidence). This is an *additional* confirmation event in 1915.
  *   **However, this does NOT mean the perihelion evidence (`E`) itself didn't confirm GR (`T`).** The counterfactual analysis above shows that `E` *does* confirm `T` relative to an earlier state. Learning the entailment `T \supset E` *also* confirms `T` (and perhaps confirms the link between `T` and `E` more strongly). Both things can be true. Her claim that calling `E` confirmation is *just* a "bookkeeping trick" ignores the counterfactual power of `E`. The perihelion anomaly *is* evidence for GR *because* GR predicts it and alternatives didn't, regardless of when the prediction was derived.

  ### Addressing Step (6) - The Generalization
  Step (6) ("There's always a lag...") **is empirically false and ignores prediction**:
  *   **Not all evidence is accommodated; some is predicted.** While *some* evidence is old when a theory explains it (like Mercury), many crucial tests involve **novel predictions**: the theory predicts *new, previously unknown or unobserved* phenomena.
      *   *Example:* GR predicted the bending of starlight by the sun. Eddington's 1919 expedition *tested this prediction*. When scientists learned `E` (the measured bending matched GR's prediction), `P(E)` was *less than 1* beforehand. Conditioning *directly* raised `P(GR)` dramatically for those learning the result. No counterfactual reconstruction was needed. This directly refutes (6).
  *   **Lag doesn't imply `P(E)=1`.** Even for "old" evidence, `P(E)` might not be exactly 1 for *every* scientist. New analysis, doubts about old measurements, or simply focusing on the anomaly in light of a new theory can make `P(E)` slightly less than 1, allowing some direct conditioning. More importantly, the *counterfactual* confirmation relation still holds.

  ### Addressing Step (7) & (8) - The Moral
  *   (7) is correct: The conclusion of (6) is crazy, and Mercury *is* a classic example of confirmation.
  *   (8) is **incorrect**. Premise (1) does **not** need to be abandoned. The Bayesian definition **does not** "eat itself." The flaw was in the *application* of (1) to old evidence without using the counterfactual interpretation. The updating rule works fine; the issue was misidentifying the relevant credence functions for the counterfactual comparison defined in (1).

  ### What to Give Up & The Costs
  1.  **The Naive Application of (1) to Old Evidence (Weak Step 5/6):** This must go. You cannot directly apply `P(H|E) > P(H)` using an agent's *current* probability-1 credence function (`P_actual`) when `E` is old evidence. **Cost:** Requires accepting the counterfactual analysis. This adds some complexity. Critics argue reconstructing `P_old` is subjective or historically difficult. Defenders argue it's necessary and often feasible.
  2.  **Strict Interpretation of (2) and (3) for Confirmation (Implied Cost):** You must accept that confirmation (`P(H|E) > P(H)`) is evaluated relative to a credence function where `P(E) < 1`, even for an agent who currently knows `E`. It's a counterfactual property. **Cost:** Confirmation becomes a relation between H, E, and an *epistemic state*, not necessarily tied to an *actual* learning event *at that moment*. Some find this less intuitive than "learning E caused my credence in H to rise."
  3.  **Premise (6) (Must Go):** The generalization that "no theory is ever confirmed by any evidence after the data goes public" is demonstrably false due to novel predictions. **Cost:** None. It's simply incorrect.
  4.  **Premise (1) (Can and Should Be Kept!):** This is the core definition you understand and want to keep. **The solution shows you CAN keep it.** You just need to apply it correctly using counterfactual credences for old evidence. **Cost of Giving Up (1):** This would be huge. You'd lose the precise, quantitative Bayesian definition of confirmation and likely struggle to find a satisfactory replacement. Don't give this up.

  ### The Way Out Summarized
  *   **Weak Step:** Step (5) / (6) (Misapplication of (1) to old evidence).
  *   **Flaw Type:** Flawed reasoning (misunderstanding the counterfactual nature of (1) in the context of old evidence).
  *   **Solution:** Use **counterfactual credence** to evaluate `P_old(H|E) > P_old(H)` for old evidence `E`, where `P_old` represents the rational credence function *before* `E` was learned (or when `P(E) < 1`).
  *   **Cost:** Accepting that confirmation by old evidence is a counterfactual relation. This preserves the Bayesian definition (1), accounts for the Mercury example, allows for confirmation by novel predictions without issue, and avoids the absurd conclusion of (6)/(7). The cost is modest compared to abandoning the definition or accepting the absurdity.

  **Conclusion:** Your instinct about the "would raise" vs. "did raise" slide was spot on. Premise (1) is safe. The hole is in assuming that for old evidence, the `P(H|E)` and `P(H)` in definition (1) must be evaluated using the agent's *actual current* credence function where `P(E)=1`. Once you evaluate them counterfactually relative to the appropriate earlier epistemic state, confirmation by old evidence like Mercury's perihelion makes perfect Bayesian sense, and mature science isn't a pile of unconfirmed theories. Your roommate's argument highlights a genuine puzzle (the Problem of Old Evidence), but the Bayesian framework has a robust and widely accepted solution.
