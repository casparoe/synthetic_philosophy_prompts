  The user already provided some initial criteria: distinguishing self-deception from wishful thinking, self-serving bias, and ignorance; explaining why it's called "deception"; accommodating the inability to believe at will; and addressing the phenomenology of near-awareness. My task is to expand this list, assess each requirement's negotiability, check for joint satisfiability, identify the most exclusionary requirement, and comment on whether "possibility" should be a separate desideratum.

  First, I need to list all possible requirements. The user mentioned several, but I should think of more. For example, motivational involvement is crucial—self-deception isn't accidental. Also, the state must be belief, not just hope. Then there's the issue of contradictory beliefs: can the person simultaneously believe p and not-p? Traditional views say no, but partitioning theories allow it. The phenomenology of near-awareness is another key point—the flinching from certain thoughts. Also, the process shouldn't require implausible mental gymnastics; it has to be something people can do while buying groceries. Plus, it must be intentional or motivated, not just passive. And it should avoid logical incoherence.

  Now, for each requirement, I need to determine if it's non-negotiable or just a preference. For instance, distinguishing from wishful thinking seems non-negotiable because belief is central. The deception aspect is tricky—some might argue the term is a misnomer, but for the user, it's probably essential. The inability to believe at will is a psychological constraint, so non-negotiable. The near-awareness phenomenology is also core to the user's examples, so likely non-negotiable.

  The big issue is the joint satisfiability of three points: the state being belief, motivated management of evidence (intention), and no simultaneous contradictory beliefs. If these three conflict, which one to drop? Partitioning theories allow contradictory beliefs by splitting the mind, but that might be too baroque. Deflationary views drop the deception element, making it just biased belief. The user wants to avoid exotic mechanisms, so partitioning might be out. Maybe dropping the strict non-contradiction is the cost—accepting that some level of conflicting belief exists without full awareness.

  The most exclusionary requirement is probably the belief criterion. If a theory reduces self-deception to a weaker attitude like hope, it fails to capture the genuine conviction seen in cases like the manager believing the turnaround plan is working. This requirement rules out deflationary approaches that don't treat it as true belief.

  On the possibility question: including it as a desideratum might be redundant. The joint satisfiability question already addresses whether the criteria can coexist logically. If the criteria conflict, the phenomenon isn't possible under those terms. So it's more about internal consistency than separate possibility.

  Finally, assessing divided-mind vs. biased belief approaches briefly: divided-mind might violate non-baroque and no logical incoherence by positing subagents. Biased belief approaches might struggle with the deception element and near-awareness. The user's focus on ordinary cases suggests biased belief might be closer, but needs to address intent and phenomenology.
answer: |-
  Here is a requirements list for theories of self-deception focused on ordinary cases, structured as requested. The criteria are derived from conceptual analysis of the phenomenon as commonly described, the constraints of belief psychology, and the need to capture the "near-awareness" characteristic.

  **Core Requirements List (Desiderata) & Their Status:**

  1.  **Motivational Involvement (Non-Negotiable):** The state must be *motivated* by a desire, need, or aversion (e.g., avoiding pain, preserving self-esteem, maintaining a relationship). Mere cognitive error or ignorance lacks this element.
      *   *Why:* Distinguishes self-deception from simple mistakes, lack of information, or unmotivated biases. The suspicious spouse's selective attention or the manager's optimistic filtering is driven by a *need* not to see the truth.

  2.  **Belief-State Requirement (Non-Negotiable):** The outcome must be a genuine *belief* (or sufficiently belief-like state of conviction) that `p` (the desired/favorable state), not just hope, preference, or acting *as if* `p`.
      *   *Why:* Central to the phenomenon. The failing manager *genuinely believes* the plan is working; the person *genuinely believes* (or convinces themselves) the lump isn't serious. Wishful thinking hopes `p`; self-deception (apparently) believes `p`.

  3.  **Contradictory Evidence Handling (Non-Negotiable):** The process must involve the active (though perhaps implicit) management, dismissal, avoidance, or misinterpretation of readily available evidence that strongly suggests `~p` (the unwanted truth).
      *   *Why:* This is the core of "deception" and distinguishes it from simple ignorance or unbiased error. The spouse *sees* but ignores/discounts the suspicious message; the manager dismisses negative metrics; the person "doesn't notice" the lump despite its salience.

  4.  **Phenomenology of Near-Awareness (Non-Negotiable):** The theory must account for the subject's *attenuated sense* of the threatening truth (`~p`), manifesting as avoidance of specific thoughts, a feeling of unease, or the need to actively suppress/deflect attention *away* from evidence or implications.
      *   *Why:* Essential to the "flinch" factor. The subject isn't blissfully ignorant; they are actively *not thinking* about the text, the metrics, or the lump's implications, precisely because those thoughts are threatening. Ignorance lacks this tension.

  5.  **Deception Criterion (Conditionally Non-Negotiable):** The process must meaningfully warrant the term "deception" – implying some form of agential *activity* (intentional or quasi-intentional) in misleading oneself, akin to deceiving another, without requiring a literal homunculus.
      *   *Why:* The term isn't arbitrary. If the process is entirely passive (like a simple bias), "deception" becomes a misnomer. The subject *does something* (avoid, reinterpret, focus elsewhere) that parallels the *strategic* element of other-deception, even if not fully conscious or deliberate. *Status:* Non-negotiable for capturing the phenomenology and etymology, but *how* "deceptive" it needs to be (e.g., conscious intent vs. motivated sub-agential processes) is a major fault line.

  6.  **No Believing at Will (Non-Negotiable):** The process cannot involve direct, voluntary control over belief formation ("I hereby decide to believe `p`").
      *   *Why:* Directly contradicts the involuntary nature of belief formation well-established in philosophy and psychology. We cannot simply choose beliefs like actions.

  7.  **Non-Baroque / Cognitively Plausible Mechanism (Strong Preference, bordering on Non-Negotiable for Ordinary Cases):** The proposed mental operations must be psychologically realistic for ordinary humans engaged in everyday tasks. They cannot rely on incoherent concepts (e.g., fully conscious simultaneous belief in `p` and `~p` without qualification) or require implausible, energy-intensive mental architectures (e.g., multiple full-blown homunculi constantly deceiving each other).
      *   *Why:* The target is *ordinary* self-deception. Theories requiring exotic, clinically-significant dissociation or constant, elaborate internal theater fail the grocery store test. They might apply to pathologies, not the spouse/manager/lump cases.

  8.  **No Strict Logical Incoherence (Non-Negotiable):** The theory must not require the subject to hold logically contradictory beliefs (`Bel(p) & Bel(~p)`) in a fully conscious, explicit, and simultaneous manner at the same level of awareness.
      *   *Why:* This violates the nature of belief and conscious awareness. Explicit, simultaneous conscious belief in `p` and `~p` is impossible. Partitioning must involve *attenuation* of awareness/access.

  **Analysis of the "Triangle" (Belief State, Deception Criterion, No Simultaneous Contradictory Belief):**

  You rightly identify the core tension. Holding all three strictly *is* problematic:

  *   **Belief State:** Requires genuine belief in `p`.
  *   **Deception Criterion:** Requires activity suggesting awareness/management of `~p` evidence/motivation, implying *some* cognitive contact with `~p`.
  *   **No Simultaneous Contradictory Belief:** Forbids simultaneous, conscious, explicit belief in both `p` and `~p`.

  **The Impasse:** If the subject genuinely believes `p` (Satisfies #2), and cannot simultaneously consciously believe `~p` (Satisfies #8), how can they be actively *deceiving* themselves regarding `~p` (Satisfying #5)? Deception seems to require some awareness of the truth (`~p`) being hidden. Yet, consciously believing `~p` violates #8.

  **Resolution (The Corner to Give Up - Softly):** The strictest interpretation of **"No Simultaneous Contradictory Belief" (#8)** must be relaxed, *but not abandoned*. We must allow for:

  *   **Attenuated Awareness of `~p`:** The subject has *access* to evidence/knowledge supporting `~p`, feels its motivational pull (fear, anxiety), and engages in avoidance/reinterpretation *because* of this access/pull, **without** forming a full, explicit, conscious *belief* that `~p` is true. They have "cognitive contact" with `~p` sufficient to motivate management, but not sufficient to crystallize into a contradictory *belief* attended to in the same way as `p`.
  *   **Implicit vs. Explicit:** The "knowledge" of `~p` is procedural, affective, or dispositional (e.g., anxiety driving avoidance, patterns of attention), not necessarily propositional belief.
  *   **Temporal Separation:** The subject may fleetingly acknowledge `~p` but rapidly suppress or reinterpret it, never stably holding both beliefs concurrently in focal awareness.

  **Cost:** This requires a nuanced account of "belief" and "awareness." It risks blurring the line with mere suspicion or anxiety without belief, or appearing to sneak in a very weak form of contradictory belief ("alief," implicit bias). Defenders must carefully show how this attenuated state motivates deceptive activity without constituting full belief in `~p`.

  **The Most Exclusionary Requirement:**

  **#2: Belief-State Requirement** does the most work in excluding candidate theories.

  *   **Why:** Many theories falter precisely by failing to secure genuine *belief* in `p` while meeting the other desiderata.
      *   **Strong Partitioning/Subagent Views:** Often struggle to explain why the "deceived" part *genuinely believes* `p` if the "deceiving" part knows `~p`. Does the deceived part *truly* believe, or is it just being fed false info? If it truly believes based on manipulated evidence, how is this different from motivated bias without homunculi?
      *   **Purely Deflationary/Biased Reasoning Views:** Often reduce self-deception to "biased belief formation" but struggle to capture the *strength of conviction* (`belief`) and the active *deceptive management* (#5) seen in paradigmatic cases. Does the manager just weight evidence poorly, or does he *actively avoid* damaging reports? If it's just bias, does he *genuinely believe* the plan is working, or just hope and act optimistically?
      *   **Intentionalist Views:** Struggle mightily with #6 (believing at will). If self-deception requires forming `p` *because* it's desired, this looks suspiciously like direct voluntarism.
  *   **Defense:** Without securing genuine belief in `p`, the phenomenon collapses into wishful thinking (#1 violation), mere hope, or self-serving action. The intuitive pull of cases like the manager or the lump is the subject's *conviction* in the falsehood. Theories that cannot robustly explain this conviction under the constraints (#5, #6, #8) are inadequate. This requirement forces theorists to confront the hardest part: how motivation generates *doxastic* outcomes, not just behavioral or affective ones.

  **"The Phenomenon Must Be Possible" as a Desideratum:**

  *   **Flag:** This is **largely redundant** with the joint-satisfiability question.
  *   **Reasoning:** The primary threat to the possibility of self-deception *is* the perceived logical paradox arising from the tension between the core requirements (especially the "triangle"). If a coherent set of requirements that captures the phenomenon can be jointly satisfied by a psychologically plausible mechanism, then it *is* possible. Including "possibility" as a separate item adds little beyond demanding that the theory isn't internally contradictory or empirically falsified – which is already covered by the requirement for a non-baroque, coherent mechanism (#7, #8) and consistency with known psychology (#6). Its work is done by the joint satisfiability of the other criteria.

  **Brief Assessment Against Major Camps (as requested):**

  *   **Divided-Mind/Partitioning Approaches:** Often satisfy #2 (belief), #3 (evidence mgmt), #4 (near-awareness - via partition), and #5 (deception - internal to the mind). Their major challenge is #7 (non-baroque) - avoiding implausible homunculi or overly elaborate partitioning for ordinary cases - and providing a clean account satisfying #8 without smuggling in contradiction. Can feel too "exotic" for groceries.
  *   **Motivationally Biased Belief Approaches:** Excel at #1 (motivation), #3 (evidence mgmt - as bias), #6 (no voluntarism), and #7 (plausibility). Their major challenge is robustly satisfying #2 (genuine conviction in `p`), #4 (near-awareness - how bias generates the "flinch"), and especially #5 (deception - the active, strategic element often seems diluted into passive bias). Risk reducing self-deception to wishful thinking plus.

  This list provides the explicit criteria needed to evaluate theories of ordinary self-deception before encountering specific proposals, focusing on the conceptual and empirical constraints that any adequate account must navigate.
