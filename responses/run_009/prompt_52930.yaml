answer: |-
  ### 1. The Debate in Calibration Vocabulary  
  **Reductionism as Metrological Traceability Requirement**  
  Reductionism demands that testimonial justification must exhibit full traceability to a hearer's *primary standards* (direct perception, memory, inductive reasoning). Every speaker functions as a *working standard* whose reliability requires calibration against the hearer’s primary references. Just as a measurement chain’s validity depends on unbroken traceability to SI units via documented calibrations, testimonial knowledge requires independent verification of each speaker’s "calibration status." For instance, trusting a colleague’s report on lab results necessitates checking their methodology against your own observations (e.g., via interlaboratory comparisons) or prior evidence of their precision (repeatability) and accuracy (bias relative to ground truth). Uncertainty compounds with each testimonial link: if Speaker A’s uncertainty (credibility margin) is ±5%, and Speaker B relies on A with ±7% uncertainty, the chain’s aggregate uncertainty exceeds usable bounds without independent cross-checks. Testimony, like a working standard, has no intrinsic authority; its value derives solely from traceability to the hearer’s primary standards.  

  **Anti-Reductionism as Artifact-Based Primary Standard**  
  Anti-reductionism treats testimony as a *primary standard* in its own right—akin to the pre-2019 kilogram artifact. Trust in a speaker’s report is not derived from the hearer’s perception or memory but is *constitutive* of the epistemic framework itself. Ordinary speakers function as artifact standards: their reliability is presupposed in the "measurement system" of social knowledge, just as the Sèvres cylinder defined the kilogram without being verified against a more fundamental standard. When a birth certificate attests to your birthdate, it serves as an authoritative reference not because you independently verified its chain of custody, but because such documents are institutionally embedded primary sources. Uncertainty here does not compound through linear propagation; instead, institutional or communal safeguards (e.g., notarial practices) act like environmental controls on the artifact, maintaining its stability. Anti-reductionism rejects traceability demands: testimony’s justification, like the artifact kilogram, is a fixed point in the calibration hierarchy.  

  ---

  ### 2. What Translates and What Distorts  
  **Faithful Translations**  
  - **Traceability ↔ Reductionism**: The reductionist requirement that testimony must be anchored in the hearer’s non-testimonial sources maps cleanly to metrological traceability.  
  - **Artifact Standard ↔ Anti-Reductionism**: The irreducibility of the kilogram artifact parallels anti-reductionism’s "constitutive" trust in testimony.  
  - **Uncertainty Propagation**: Both fields acknowledge that reliability degrades across chains, though mechanisms differ (see §3).  

  **Distortions Introduced**  
  - **Instrument vs. Agent**: Instruments lack agency; speakers have intentions. Mapping testimony to calibration ignores *deception* or *contextual bias*, which have no clear metrological analog (e.g., a spectrometer cannot "lie").  
  - **Calibration Rigor**: Reductionism’s demand for *independent verification* of every testimonial link becomes implausibly stringent. Metrology accepts certified reference materials without reinventing each calibration; philosophy debates whether testimony requires similar "epistemic shortcuts."  
  - **Precision/Accuracy Distinction**: Precision (repeatability) maps to testimonial consistency, but accuracy (bias) struggles to capture *truth-conduciveness* since testimony lacks a physical "ground truth" akin to SI units.  
  - **Static vs. Dynamic Standards**: The artifact kilogram was immutable; speakers adapt testimony contextually (e.g., hedging claims), introducing variability unmatched in metrology.  

  ---

  ### 3. The Residue  
  **Untranslatable Elements**  
  - **Non-Compounding Uncertainty**: In testimonial chains (e.g., "Earth’s core is iron"), uncertainty *does not* compound catastrophically despite long chains. Metrology cannot model this, as it arises from cross-verification (multiple chains), institutional credibility (peer review), and error-correction mechanisms (e.g., science’s self-correcting nature)—features absent in linear calibration chains. This disanalogy reveals testimony’s *systemic resilience*, unlike metrology’s additive error propagation.  
  - **Irreducible Sociality**: Trust in testimony involves normative dimensions (e.g., speakers *owe* sincerity) and communal practices (language games) that lack metrological counterparts. The artifact kilogram was a single object; testimony relies on distributed networks of agents.  
  - **The Kilogram Redefinition Problem**: Metrology retired the artifact by redefining the kilogram via Planck’s constant—a fundamental, non-artifact standard. Anti-reductionism denies this analogy, insisting testimony *cannot* be "redefined" against non-testimonial foundations (e.g., private sense data). For them, testimony’s authority emerges from social coordination, not reducible constants. This marks a core divergence: metrology seeks physical absolutes; testimony is inherently relational.  

  ---

  ### 4. Where the Defect Lies  
  The untranslatable residue reflects a **genuine difference in subject matter**, not deficiencies in vocabulary or philosophical clarity. Metrology models physical systems where uncertainty is quantifiable and chains are linear. Testimony involves agents embedded in normative social practices, where justification arises from dynamic, collective structures (e.g., reputation, institutional roles). The kilogram redefinition succeeded because mass measurement is ontologically independent of human practices; testimony’s "measurement" of truth is *constituted* by those practices. Thus:  
  - Uncertainty non-propagation highlights testimony’s network-based error correction, contrasting with metrology’s serial chains.  
  - Anti-reductionism’s rejection of "redefinition" underscores that testimony lacks a Plack’s constant equivalent—its "fundamental constant" *is* the social fabric itself.  
  Neither vocabulary should paper over this: metrology captures testimony’s *structural dependencies* but not its normative, agent-centric core.
