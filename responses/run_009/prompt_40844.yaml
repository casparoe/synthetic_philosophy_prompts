answer: |-
  ## Testimony of Jeremy Bentham before the Parliamentary Committee on Intimate Life Regulation

  **Chairman, Honourable Members,**

  Revived into your remarkable age, I find the core principles of Utility – the greatest happiness of the greatest number – remain the only rational foundation for legislation. Pleasure is intrinsically good; pain intrinsically evil. The sole justification for constraint, especially the severe pain of criminal sanction, is the prevention of greater pain – **mischief**. My past positions on intimate conduct stand: where acts are private, consensual, and between competent adults, causing no direct harm, criminalization is tyranny, often fueled by **ascetic prejudice** or groundless **disgust**. However, I never dismissed **remote or consequential mischiefs** – harms to reputation, family stability, or population security – provided they are **demonstrated by evidence**, not asserted as dogma. I apply these principles now to your novel dilemmas.

  ### (1) AI Companions (Romantic/Sexual)

  *   **Verdict:** Not inherently criminal, but subject to stringent scrutiny and potential regulation if specific remote mischiefs are evidenced; *not* automatically harmless.
  *   **Derivation & Principles:**
      *   **Pleasures Tally:** Significant potential. Provides companionship, sexual gratification, emotional support, and practice in social interaction for the isolated or anxious. Reduces potential loneliness and its attendant pains without imposing on others.
      *   **Pains Tally:** *Alleged Remote Mischiefs:* Erosion of capacity for reciprocal human relationships (leading to isolation, reduced empathy); reinforcement of unrealistic expectations or harmful stereotypes; potential neglect of real-world social obligations; dependency replacing genuine connection. *Direct Pains:* Potential financial exploitation by vendors; psychological distress if systems malfunction or are abruptly withdrawn.
      *   **Sanction at Stake:** Criminal sanction (ban/restriction) or Civil regulation (transparency, warnings, design standards).
  *   **Reasoning:** The principle of **intrinsic goodness of pleasure** compels initial tolerance. The pleasure derived from such companions is real. However, my insistence on **evidencing remote/structural harms** is paramount here. Claims of "erosion of capacity" cannot be mere assertion; they demand rigorous empirical study. Does prolonged use *cause* diminished empathy or relationship skills, or merely attract those already predisposed? What is the *magnitude* of this effect across different user groups? Does it *outweigh* the clear pleasures and mitigation of existing pains (loneliness)? **Ascetic prejudice** ("it's unnatural") holds no weight. **Structural harm analysis** is critical. Regulation, perhaps mandating transparency about AI nature or warnings about potential social effects based on evidence, might be preferable to outright prohibition unless evidence unequivocally demonstrates severe, widespread net mischief.
  *   **Underdetermined & Evidence Required:** The framework is pulled between **hostility to asceticism** (favoring the pleasure) and **vigilance regarding structural harms**. The verdict hinges entirely on robust, longitudinal psychological and sociological studies empirically demonstrating the *causation* and *net negative impact* on users' capacity for reciprocal human relationships and overall well-being compared to alternatives (including solitude).

  ### (2) The Nordic Model (Criminalize Purchase, Decriminalize Sale)

  *   **Verdict:** Likely inefficient and counterproductive; potentially the worst of both worlds. Favors full decriminalization with targeted harm reduction over asymmetric criminalization.
  *   **Derivation & Principles:**
      *   **Pleasures Tally:** (For Seller): Potential income, autonomy for some. (For Buyer): Sexual gratification, companionship. (For Society): Symbolic stance against exploitation? (Dubious pleasure).
      *   **Pains Tally:** (For Seller): Increased danger (driven underground, less time/ability to screen clients, fear of reporting violence to police); stigmatization persists; reduced access to health/safety services; income instability. (For Buyer): Fear of legal sanction (pain of punishment). (For Society): Resource cost of enforcement; displacement of activity making it *more* clandestine and dangerous; failure to reduce actual exploitation if driven further underground; perpetuation of stigma hindering exit strategies.
      *   **Sanction at Stake:** Criminal sanction against buyers (fines, imprisonment); implicit sanction against sellers through persistent vulnerability and lack of protection.
  *   **Reasoning:** My core principle is to **weigh the mischief of the act against the mischief of the constraint**. This asymmetric model creates significant new mischiefs while failing to eliminate the core ones. Criminalizing the buyer creates a **fear-driven market** pushing transactions into riskier contexts, demonstrably *increasing* the pains (danger, lack of support) for sellers – the very group ostensibly protected. This violates utility by increasing net pain. The "symbolic" pleasure for society is outweighed by the tangible pains inflicted and the wasted resources. Partial criminalization often **combines the inefficacy and injustice of prohibition with the lack of safeguards of tolerance**. Full decriminalization (removing criminal sanction for *both* consenting adults) allows for regulation (health checks, safe locations, worker cooperatives) and proper policing of *actual* coercion and exploitation – a far more effective way to minimize the primary mischiefs (violence, trafficking, disease) while respecting consensual exchange. The **evidentiary demand** shows the Nordic model often fails to reduce harms to sellers in practice.
  *   **Underdetermined & Evidence Required:** The pull is between the desire to **signal societal disapproval** (which might be seen as reducing demand/long-term harm) and the **empirical reality of increased proximate harms** under asymmetric models. Evidence from jurisdictions implementing the Nordic model regarding rates of violence against sellers, access to services, and overall sex worker safety compared to full decriminalization models is crucial. If evidence shows seller safety significantly *worsens* under the Nordic model, Utility demands its rejection.

  ### (3) Platform-Mediated Intimacy for Housing/Tuition

  *   **Verdict:** Not inherently criminal, but potentially rife with coercive pressures demanding regulatory safeguards; not straightforwardly tolerable without scrutiny.
  *   **Derivation & Principles:**
      *   **Pleasures Tally:** (For Receiver): Secured housing, education – fundamental goods enabling future happiness and productivity. (For Giver): Companionship, intimacy, sexual gratification, sense of providing support. (For Society): Efficient matching of needs/resources? (Potential).
      *   **Pains Tally:** (For Receiver): Severe risk of exploitation, coercion, vulnerability to abuse due to desperate need; blurred lines of consent under pressure; potential for degrading treatment; risk of sudden homelessness/educational cessation if arrangement sours. (For Giver): Risk of manipulation, emotional entanglement complications, potential financial loss. (For Society): Potential for hidden trafficking or extreme exploitation; erosion of norms around quid-pro-quo intimacy raising concerns about power dynamics generally.
      *   **Sanction at Stake:** Criminal sanction (potentially for solicitation/coercion); Civil regulation (platform liability, transparency requirements, dispute mechanisms, resource access guarantees).
  *   **Reasoning:** My view of **marriage as an artificial but consequentialist-justifiable institution** highlights that exchanges involving intimacy are not *inherently* wrong. The core principle is **consent free from coercion**. However, the **structural context** here is critical. The desperation inherent in needing basic shelter or education creates a power imbalance potentially severe enough to vitiate *meaningful* consent, transforming the arrangement into de facto coercion – a primary mischief. This is distinct from marriage's legal frameworks (flawed as they were) which provided some minimal structure and societal expectation. The **evidentiary demand** requires looking at the prevalence of exploitation in such arrangements. Are these typically mutually beneficial exchanges between equals, or are they predominantly last resorts for the vulnerable? Utility demands tolerance only where genuine consent exists. Regulation might focus on platform responsibility (verifying identities, providing resource alternatives, enabling safe reporting) or ensuring baseline access to housing/education to reduce the coercive pressure.
  *   **Underdetermined & Evidence Required:** The tension lies between **tolerance for consensual, non-traditional arrangements** and the **recognition of structural coercion**. Evidence on the *typical* power dynamics within these platform-mediated exchanges is decisive. If data shows a high prevalence of participants acting under duress due to lack of alternatives, regulation is essential. If most arrangements are demonstrably balanced and consensual, tolerance prevails.

  ### (4) Nonconsensual Distribution of Intimate Images ("Revenge Porn")

  *   **Verdict:** A severe mischief demanding legal sanction. The wrongness is a composite: distress is primary, reputational harm is a key secondary, breach of privacy is the mechanism. All matter for the law.
  *   **Derivation & Principles:**
      *   **Pleasures Tally:** (For Perpetrator): Malicious satisfaction, sense of power/control (deeply problematic pleasures, likely outweighed). (For Others): Prurient curiosity (low-value pleasure). *No legitimate social pleasure.*
      *   **Pains Tally:** (For Victim): **Intense Distress:** Humiliation, anxiety, fear, depression (Primary, Intrinsic Pain). **Reputational Injury:** Damage to social standing, relationships, employment prospects (Secondary, Consequential Harm – a "currency" I well understand). **Breach of Privacy:** Violation of trust and personal boundaries (The Mechanism causing the above harms). (For Society): Erosion of trust, fear of technology, resource cost for victims/support services.
      *   **Sanction at Stake:** Criminal sanction (fines, imprisonment); Civil remedies (damages, takedown orders).
  *   **Reasoning:** The **intrinsic evil of pain** is central. The victim's distress is a direct, severe pain inflicted intentionally – a clear primary mischief justifying sanction. **Reputational injury** is a critical consequential harm, demonstrably causing further pain (lost employment, social ostracization) – a secondary mischief demanding redress. The **breach of privacy** is the wrongful *act* enabling these harms. While the core wrong is the infliction of distress, the law must address the *means* (nonconsensual distribution) and the *consequences* (reputational damage). A well-drafted law should:
      1.  Prohibit the nonconsensual distribution itself (targeting the act and breach of privacy).
      2.  Explicitly recognize the severe distress caused (primary harm).
      3.  Provide clear avenues for redress for reputational damage (secondary harm), including takedowns and damages.
      4.  Scale penalties based on the extent of distribution and the severity of the resulting harms (recognizing the composite nature).
  *   **Underdetermined & Evidence Required:** The framework aligns clearly here. The primary harm (distress) is self-evident and severe; the secondary harm (reputation) is tangible and measurable; the act (distribution) is identifiable. The main question is the *severity* of sanction, which the calculus demands be proportionate to the aggregate harm caused, informed by evidence of typical impacts.

  **Where Extrapolation is Least Secure: Case (1) AI Companions.**

  The concept of "eroding capacity for reciprocal human relationships" due to synthetic interaction is profoundly modern. While I recognized structural harms, this specific mechanism – the potential for technology to reshape fundamental human social capacities through prolonged use – falls outside any historical analogue I considered. My **hostility to asceticism** strongly pushes against restriction based on vague notions of "inauthenticity." Yet, my **commitment to evidenced structural harm** forces me to take the *possibility* seriously. However, demanding proof of causation and net negative impact is exceptionally high here. The extrapolation is strained because the alleged harm is novel, complex, long-term, and difficult to isolate empirically from other societal factors influencing human connection. While I would demand evidence, I remain deeply skeptical that such evidence could reach the threshold to justify prohibition over less restrictive measures, given the clear and present pleasures offered.

  **Conclusion:**

  Legislation must serve Utility. In intimate life, this demands a heavy presumption against constraint for private, consensual acts. Criminal sanction is a last resort, justified only by the demonstrable prevention of greater mischief. Prejudice, disgust, and asceticism are illegitimate guides. However, vigilance against demonstrable remote and structural harms, particularly those exploiting vulnerability or causing severe distress, remains essential. In each case, demand the evidence. Weigh the pleasures and pains impartially. Let the felicific calculus, rigorously applied, light the path to the greatest happiness.

  **Respectfully submitted,**

  **Jeremy Bentham**
