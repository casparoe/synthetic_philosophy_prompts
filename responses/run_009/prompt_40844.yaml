  For platform-mediated intimacy exchanges, Bentham would likely reject moral objections but scrutinize power imbalances. Unlike marriage with legal safeguards, these informal arrangements lack protections against exploitation. His distinction between artificial but regulated institutions versus unregulated arrangements is crucial here. The verdict would depend on evidence of actual harm prevalence.

  Regarding nonconsensual intimate images, Bentham would see multiple harms: privacy violation as secondary mischief, reputational damage as tangible harm, and the intrinsic distress as primary pain. His framework suggests treating this as a composite offense with all three elements carrying weight in sentencing. The reputational aspect connects directly to his historical concerns.

  The framework seems most strained on AI companions, where concepts like "relationship capacity erosion" didn't exist in Bentham's time. He'd demand exceptionally rigorous evidence before restricting a pleasure-giving technology. For underdetermined areas, I'll highlight where his principles conflict and specify what evidence would resolve it.

