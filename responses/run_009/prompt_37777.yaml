answer: |-
  ## Sestina for the Ledger's Edge

  This token passed, a simple thing, a **gift**,
  Not tallied yet, it births a quiet **debt**.
  No invoice clipped, no deadline sharp for **return**,
  Just warmth implied, a future **favor** owed.
  No market stall declares its set **price**,
  It binds by who we are, by shared **name**.

  The clerk accepts, remembers well the **name**,
  Insists this is no taxable **gift**,
  But service swift requires a stated **price**.
  He smoothes the note, accounts the ancient **debt**,
  A small exchange, a transactional **favor**,
  His signature ensures the swift **return**.

  The elder scorns such crass demand for **return**,
  His ledger holds a different kind of **name**:
  Not sums, but kin, a lifetime's **favor**
  Woven deep. Each shared meal, each small **gift**,
  Maintains the bond, a necessary **debt**
  Whose worth resists the fixing of a **price**.

  The broker knows the precise **price**
  For signatures that speed the slow **return**
  Of permits stalled. He clears the hidden **debt**
  With cash discreet. Forget the client's **name**,
  Just this one act. Is this a purchased **gift**?
  They call it grease, a necessary **favor**.

  Within the ward, the boss extends a **favor**:
  A job secured, the unspoken **price**
  Is lifelong votes. Is this a kind of **gift**?
  Or balanced books demanding full **return**?
  His power rests on knowing every **name**,
  On promises, a sprawling social **debt**.

  Where does the ledger draw the line of **debt**?
  The shared roof, soup? The whispered **favor**?
  The statute points, a cold official **name**.
  The neighbour shares, expects no set **price**.
  The contract signs, demands a quick **return**.
  The handshake holds... ambiguous **gift**.

  The circling words: **debt**, **return**, **favor**, **price**, **name**, **gift** –
  Which act is pure? Which bond deserves the brand?
  The ledger holds its long, ambiguous **debt**,
  The entries blurred: a **favor**? Or a toll?
  The **name** once trusted, now suspect, now kin,
  Depends upon the circle you stand in.

  No rule inscribed within the act itself
  Settles the weight – **gift** or **price** – upon the trembling scale.
  The **name** assigned depends upon the frame,
  The long **return**, the instant cleared **debt**.
