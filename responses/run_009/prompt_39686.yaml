prompt: |-
  You're a philosopher of biology who has waded through every level-of-selection argument there is, and you're unusually good at extracting the actual principle hiding behind somebody's scattered opinions. Please think this through carefully — I'd actually like you to start with a little brainstorming about what her rule could even be before you commit to one, then get organized.

  My friend Dana and I have been arguing about the units of selection debate (genes vs organisms vs groups vs whatever else) for like two months. Instead of arguing theory head-on, I've been collecting her verdicts on concrete cases. Here's the track record so far:

  1. Peppered moths, light vs dark forms getting picked off by birds depending on the tree bark: individual organism, easy call.
  2. A segregation distorter in mice — the allele gets itself into something like 90% of a heterozygous male's sperm, but it's lethal when homozygous: the unit is the allele. She gets genuinely annoyed when people call this "individual selection with a genetic twist" — she thinks it's literally gene-level selection happening inside the organism.
  3. Sterile worker castes in social insects: the unit is the colony. Not the queen as an individual, not the workers, the colony.
  4. Transposable elements copying themselves around the genome with basically no effect on the host's phenotype: unit is the element. Not the organism, and definately not the species — she thinks species-level stories there are lazy.
  5. A beetle-in-flour situation: high-fecundity genotypes always win within any population, but populations founded mostly by high-fecundity types overexploit the flour and crash, so the populations that persist generation after generation are the low-fecundity ones. She says individuals, and shes adamant this is NOT group selection — the individual-level story plus density dependence already covers it, and group talk is a bookkeeping illusion layered on top.
  6. Ground squirrels giving alarm calls that mostly benefit their relatives: the individual squirrel. Inclusive fitness is a fact about the caller, she says, so it's not group-level and not gene-level, whatever the gene's-eye people claim.

  Now here are two new cases we haven't sprung on her yet, and I want your predictions before we do:

  Case A: a slime mold where free-living amoebae, when starved, stream together into a multicellular slug that crawls around as one thing toward light and warmth, then builds a fruiting body in which some cells die as sterile stalk and others become spores. Sometimes the aggregate is chimeric (mixed genotypes in one slug), and there are cheater strains that end up overrepresented in the spores and underrepresented in the stalk.

  Case B: a bacterial biofilm. Matrix-secreting cells pay a cost to produce the shared goo; within a film, non-secreting cheaters grow faster; but films with a higher fraction of secretors are structurally tougher and shed more dispersers, and chunks of film break off and seed new films.

  What I want from you:

  - Your honest prediction of her verdict on A and on B.
  - The rule she seems to be running, stated cleanly — and don't just wave at "she's a pluralist," I mean the operative criterion.
  - At least one other rule that fits her six verdicts just as well but comes apart on A or B, with an explanation of exactly where the rules diverge.
  - Which of A versus B is the better experiment on her, and what each possible verdict from her would reveal.
  - One further case, anything you like, that would cleanly separate the surviving candidate rules — and ideally, tell me what answer from her would make you doubt she has a consistent principle at all.

  No citations or reading lists, I just want the reasoning. And don't pull your punches on the prediction just because you know I disagree with her about case 3.
