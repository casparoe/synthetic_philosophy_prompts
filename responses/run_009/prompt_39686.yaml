  Alternative rule that fits the six: Selection acts at the level where conflicts are resolved. But in the biofilm, conflicts might be resolved within groups, yet if groups replicate, she might still call it group-level.

  Case B is a better experiment because if she says "individual bacteria" for biofilms, it contradicts my rule but fits the alternative. If she says "biofilm," it confirms my rule.

  A further test case: Meiotic drive in mammals—a gene that biases transmission but reduces individual fitness. If she says "gene," it aligns with her segregation distorter verdict. If she says "individual," it might indicate inconsistency.

