  One possible rule: Selection acts at the level where the replicator directly competes. For genes (cases 2 and 4), they replicate independently; for organisms (1,5,6), they're the competing units; for colonies (3), it's the whole superorganism. But in the beetle case (5), she rejects group competition even though groups persist or crash.

  Another idea: It's about where the fitness consequences manifest immediately. For the moths, birds eat individuals; for segregation distorters, the allele biases its transmission; for colonies, the whole unit succeeds or fails. But in the alarm call case, the benefit is to relatives, yet she calls it individual-level.

