answer: |-
  ### (1) Exam Question  
  **Section C: Essay (25 points)**  
  *Answer all parts below. Base your response entirely on the bridge collapse scenario: After a footbridge collapse, investigators determine that a corroded hanger bracket failed and caused the collapse. Use the following pair of conditionals throughout:*  
  - **Indicative**: "If the corroded bracket didn’t fail, something else caused the collapse."  
  - **Counterfactual**: "If the corroded bracket hadn’t failed, something else would have caused the collapse."  

  **(a)** Explain why the indicative conditional sounds true but the counterfactual sounds false in this context. Analyze each using:  
  - (i) *Modal bases* and *ordering sources* (per Kratzer/Lewis/Stalnaker),  
  - (ii) Why the material conditional analysis fails for both.  
  - (iii) Why Adams’s Thesis (that the probability of an indicative conditional equals the corresponding conditional probability) applies to the indicative but *not* the counterfactual here. *(12 points)*  

  **(b)** Now consider two sequences of counterfactuals:  
  > **Sequence 1 (Sobel)**:  
  > (1) "If the bracket had failed slowly, the sensors would have tripped."  
  > (2) "If the bracket had failed slowly *and the backup relay had been offline*, the sensors would not have tripped."  
  > → These sound consistent when asserted in this order.  
  >  
  > **Sequence 2 (Reverse Sobel)**:  
  > (1) "If the bracket had failed slowly *and the backup relay had been offline*, the sensors would not have tripped."  
  > (2) "If the bracket had failed slowly, the sensors would have tripped."  
  > → These sound inconsistent when asserted in this order.  

  Explain the asymmetry in acceptability between these sequences. Discuss:  
  - (i) Whether this favors a *strict* (e.g., necessity of a strict conditional), *dynamic* (e.g., context-shifting), or *variably strict* (e.g., Lewis/Stalnaker) analysis of counterfactuals,  
  - (ii) Whether pragmatic effects alone can explain the data,  
  - (iii) What evidence would help decide between these explanations. *(13 points)*  

  ---

  ### (2) Model Answer (700 words)  

  #### (a) Divergence in the Bridge Pair  
  The indicative conditional ("If the bracket didn’t fail, something else caused the collapse") is true because it operates within an **epistemic modal base** (Kratzer 1986) restricted to **known facts**: the bridge collapsed, and the bracket’s failure caused it. Given this, the antecedent ("bracket didn’t fail") forces us to consider scenarios compatible with the evidence where *another cause* must explain the collapse. The ordering source prioritizes **worlds consistent with investigators’ knowledge**, making the conditional assert that, given the collapse, bracket non-failure implies an alternative cause. Adams’s Thesis applies: the conditional probability *P(alternative cause | ¬bracket failure)* is high because the collapse is certain. The material conditional (¬B → C) misanalyzes this as "either the bracket failed or something else caused the collapse"—trivially true since the bracket *did* fail, but failing to capture the inference to *causal necessity* given the collapse.  

  The counterfactual ("If the bracket hadn’t failed, something else would have caused the collapse") is false because it uses a **metaphysical modal base** (Lewis 1973) including **nomologically possible worlds** where the bracket doesn’t fail. The ordering source selects worlds **most similar to actuality** (e.g., same physical laws, minimal divergences). In the closest worlds where the bracket doesn’t fail, the bridge *does not collapse* (since its failure was the actual cause), so no "something else" causes a collapse. The material conditional (¬B → C) is again technically true (B is true, so ¬B → C is vacuously true), but this ignores the counterfactual’s falsity: we intuitively judge that in the closest ¬B-worlds, ¬C holds (no collapse). Adams’s Thesis fails here because counterfactuals lack a probabilistic truth condition—they quantify over worlds, not credences.  

  #### (b) Sobel Sequences and Asymmetry  
  The Sobel sequence (1→2) sounds consistent: (1) considers close worlds with slow failure where sensors trip (e.g., assuming normal relay operation). (2) adds a *further* abnormality (backup relay offline), shifting to more remote worlds where sensors fail. Lewis’s **variably strict analysis** handles this via **non-monotonicity**: adding premises (like relay offline) can change the closest worlds. Sequence 1 is consistent because (2) explicitly references a *less similar* world-set.  

  The reverse Sobel sequence (2→1) sounds inconsistent because asserting (2) first establishes a context where the *relay being offline* is part of the similarity metric. Claim (1) then seems to deny (2)’s relevance by ignoring the relay, violating pragmatic **discourse coherence** (von Fintel 2001). This asymmetry favors a **dynamic** or **context-shifting** account (e.g., Gillies 2007) over rigidly variably strict or strict analyses. A strict analysis (e.g., ¬(A ∧ ¬C)) treats (1) and (2) as logically inconsistent (since A ∧ ¬R → ¬S contradicts A → S if R is irrelevant), but cannot explain why Sequence 1 sounds fine. Lewis’s theory *can* explain both sequences technically, but the infelicity of reverse Sobel suggests a **pragmatic override**: asserting (2) first makes the relay salient, so (1) appears to disregard contextual parameters.  

  However, pragmatic effects alone (e.g., Gricean implicature) are insufficient. Evidence from **retraction tests** is decisive: if a speaker says Sequence 2, then tries to "take back" (1) by citing context shift, listeners accept this (*"I meant without the relay issue"*). This suggests the inconsistency is semantic-pragmatic: the initial assertion of (2) *alters the modal base* for subsequent claims. A pure variably strict semantics requires auxiliary pragmatic rules to block (1) after (2), whereas dynamic theories build context-change into the semantics.  

  **Conclusion**: The reverse Sobel effect supports dynamic semantics. It reveals that counterfactual interpretation depends on *sequential context*, not just fixed world-ordering.  

  ---  

  ### (3) Marking Scheme (25 points)  
  **A. Bridge Pair Analysis (12 points)**  
  1.  **(4 pts) Modal bases/ordering sources correctly specified for both conditionals.**  
      *B-level mistake:* Correctly labels indicative as "epistemic" and counterfactual as "metaphysical" but fails to define modal bases (e.g., "indicative uses knowledge") or ordering sources (e.g., "counterfactual uses similarity").  
  2.  **(3 pts) Material conditional’s failure explained for both.**  
      *B-level mistake:* Notes material conditional is true for both but does not explain *why* it misrepresents their truth conditions (e.g., ignores trivial truth for counterfactual or causal inference for indicative).  
  3.  **(5 pts) Adams’s Thesis applied to indicative + denied for counterfactual with justification.**  
      *B-level mistake:* Correctly applies Adams to indicative but does not explain *why* it fails for counterfactuals (e.g., omits discussion of probability vs. world semantics).  

  **B. Sobel Sequence Analysis (13 points)**  
  4.  **(6 pts) Asymmetry explained via world-ordering (Sobel) vs. context-shifting (reverse Sobel).**  
      *B-level mistake:* Describes asymmetry but does not tie Sequence 1 to non-monotonicity/Lewis or Sequence 2 to pragmatic salience/dynamics.  
  5.  **(7 pts) Evaluation of semantic vs. pragmatic accounts + evidence.**  
      *B-level mistake:* Claims reverse Sobel is "just pragmatics" without specifying *how* pragmatics operates (e.g., implicature) or proposing a test (e.g., retraction).  

  **Grade Boundaries**: A (21–25): Hits all 5 points with precision. B (16–20): Omits ≥1 technical detail (e.g., ordering sources) or oversimplifies Sobel (e.g., "order matters"). C (10–15): Superficial taxonomy (e.g., "indicative is about belief") or misapplies Adams. D/F (<10): Fundamental errors (e.g., material conditional solves everything).  

  ---  
  **Design Notes**:  
  - The scenario avoids "memorized" answers by requiring technical terms (modal base, ordering source) to be applied to novel examples.  
  - Sobel sequences test grasp of *dynamics* beyond static semantics.  
  - Total time (75 mins) is feasible for 700 words if students know the frameworks.  
  - Model answer hits: Kratzer (indicative), Lewis (counterfactual), Adams (scope limit), dynamic pragmatics (Sobel), retraction tests (evidence).
