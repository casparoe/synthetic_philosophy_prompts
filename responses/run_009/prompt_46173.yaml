    - Necessary? Probably not: they could have said "I despise the slur" without writing it in full. So not necessary -> remove.

  Alternatively, we might think that the act of writing it is part of the condemnation (to show they are brave enough to write it to condemn it). Then we might say it is necessary. But the procedure requires both.

  Given the potential harm of seeing the slur, even in condemnation, we might err on the side of removal. However, the procedure leaves room for judgment at step 3.

  In the case of uncertainty, we can escalate. But for the sake of the example, let's assume the moderator judges:

    - Not necessary: because the point could be made without writing the slur. So remove the post. Justification: "Unnecessary and/or inappropriate mention of a slur."

  Alternatively, if the moderator judges it necessary and appropriate, then leave up. But the procedure allows for both.

  However, note the constraint: over-removal is costly. So if we remove in case 4, that counts as a removal. But the member might appeal. So we must be consistent.

  In the procedure, step 3 requires both conditions. If the moderator thinks it's necessary and appropriate, then leave up. If not, remove.

  But in this case, it's a judgment call. We'll note that in the limitations.

  **Include at least one case that returns an answer most moderators will dislike**

  We already have case 3: removal of an affectionate in-group term. Many moderators might think that in-group reclamation should be allowed. However, the procedure removes it because it is directed at a specific individual. The rationale is that we cannot assume consent of the targeted individual. Therefore, even if well-intentioned, it violates the community's safety by targeting an individual with a slur.

  **Limitations and Human Judgment**

  The procedure cannot handle:

