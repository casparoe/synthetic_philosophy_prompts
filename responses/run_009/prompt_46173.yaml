answer: |-
  ### Slur Moderation Decision Procedure

  **Step 1: Is the flagged word on the official slur list?**  
  - **Yes:** Proceed to Step 2.  
  - **No:** Leave the post up.  
    *Justification (if appealed): "Term not classified as slur."*  

  **Step 2: Is the slur only being mentioned (not used)?**  
  - **Mention indicators:**  
    - Quotation marks, blockquotes, or explicit attribution (e.g., "they said...").  
    - Context shows discussion *about* the word itself (e.g., "the term is harmful").  
  - **Yes (mentioned):** Proceed to Step 3.  
  - **No (used):** Proceed to Step 4.  
  - **Unclear:** Escalate to senior moderator (log as "ESCALATION: Use/mention ambiguity").  

  **Step 3: Is the mention necessary and appropriate?**  
  - **Necessary:** Could the point be made without spelling out the slur? (e.g., "a racial slur" vs. quoting it).  
  - **Appropriate:** Is the context respectful and non-inflammatory (e.g., academic, reporting harm)?  
  - **Both yes:** Leave the post up.  
  - **No (unnecessary or inappropriate):** Remove the post.  
    *Justification: "Unnecessary/inappropriate mention of slur."*  
  - **Unclear:** Escalate to senior moderator (log as "ESCALATION: Contextual judgment").  

  **Step 4: Is the user a member of the group the slur targets?**  
  - **Evidence required:** Clear self-identification in the post/profile (e.g., "as a [group member]..."). Never assume identity.  
  - **Yes (in-group):** Proceed to Step 5.  
  - **No (out-group):** Remove the post.  
    *Justification: "Out-group use of slur."*  
  - **Unclear:** Escalate to senior moderator (log as "ESCALATION: Identity uncertainty").  

  **Step 5: Is the slur directed at a specific person?**  
  - **Directed:** Name, @mention, or clear reference (e.g., "you [slur]").  
  - **Yes (directed):** Remove the post.  
    *Justification: "Slur targeted at individual."*  
  - **No (undirected):** Leave the post up.  
    *Justification: "In-group non-targeted reclamation."*  

  ---

  ### Worked Examples  
  **Case 1: Quoting a slur from a novel in a discussion thread.**  
  - Step 1: Slur? **Yes** → Step 2.  
  - Step 2: Mention? **Yes** (verbatim quote) → Step 3.  
  - Step 3: Necessary? **Yes** (literary analysis requires accuracy). Appropriate? **Yes** (respectful context). → **Leave up.**  

  **Case 2: Quoting a slur in a harassment report.**  
  - Step 1: Slur? **Yes** → Step 2.  
  - Step 2: Mention? **Yes** (quoted as evidence) → Step 3.  
  - Step 3: Necessary? **Yes** (proof of violation). Appropriate? **Yes** (formal reporting). → **Leave up.**  

  **Case 3: In-group member uses slur affectionately toward another in-group member.**  
  - Step 1: Slur? **Yes** → Step 2.  
  - Step 2: Mention? **No** (used as address) → Step 4.  
  - Step 4: In-group? **Yes** (self-identified) → Step 5.  
  - Step 5: Directed? **Yes** (at specific person: "you [slur]"). → **Remove.**  
    *Justification: "Slur targeted at individual."*  
  - **Why this may be disliked:** Moderators may feel reclamation should allow affectionate use. The procedure removes it because:  
    - Philosophy of language prioritizes literal targeting over intent.  
    - Directed slurs risk harm regardless of affection (non-consensual impact).  
    - Public contexts amplify collateral harm (e.g., outsiders misusing the term).  

  **Case 4: Member types slur while condemning it.**  
  - Step 1: Slur? **Yes** → Step 2.  
  - Step 2: Mention? **Yes** (discussing the word: "I despise [slur]") → Step 3.  
  - Step 3: Necessary? **No** (condemnation works without spelling it: e.g., "this slur"). Appropriate? **No** (gratuitous use risks harm). → **Remove.**  
    *Justification: "Unnecessary mention of slur."*  

  ---

  ### What the Procedure Cannot Do  
  **Philosophy of language reaches its limits when:**  
  1. **Community values override linguistic technicalities:**  
     - Example: A quoted slur in academic context (Step 3 pass) may still traumatize marginalized members. Philosophy cannot resolve this trade-off (accuracy vs. harm).  
  2. **Intent contradicts literal meaning:**  
     - Example: Sarcasm like "What a [slur] thing to do!" (literal use vs. ironic intent).  
  3. **Evolving reclamation norms:**  
     - Example: An in-group slur used undirected but deemed harmful by some sub-groups.  

  **Handling these cases:**  
  - Escalate when the procedure requires contextual/value judgments (Steps 3/4).  
  - **Log as human decisions:** Tag escalated cases in logs with:  
    - `HUMAN DECISION: Values override [Step X]` (e.g., Step 3 appropriateness).  
    - `HUMAN DECISION: Unresolved intent [Step X]` (e.g., Step 2 use/mention ambiguity).  
  - **Appeals:** Senior moderators justify based on community values (e.g., "Allowed for historical accuracy despite harm risk").  

  **Design note:** This procedure minimizes over-removal (costly due to account reviews) by:  
  - Requiring clear evidence at each step (e.g., identity in Step 4).  
  - Using "unclear" escalations instead of defaults to removal.
