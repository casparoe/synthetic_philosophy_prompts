       b. The class must have at least 5 historical cases (if possible) and at most 50 (to avoid vagueness).
       c. The class should be described in a way that is mutually exclusive and collectively exhaustive for the cases in it? Not necessarily, but we want distinct groupings. However, we can allow overlapping classes and then combine them appropriately.

     - After writing, each member reads their classes aloud and the group compiles a list without criticism. The goal is to generate 5-15 candidate classes.

  2. **Evaluate and Filter Classes (5 minutes)**:
     - For each candidate class, the group quickly assesses:
       a. **Size**: Does the class have at least 5 cases? If not, discard unless it's the only one and the group agrees to use it with caution.
       b. **Similarity**: On a scale of 1 (low) to 3 (high), how similar are the cases in the class to the target case on causally relevant dimensions? (Each member rates, then average. If average < 1.5, discard.)
          - How to define "causally relevant dimensions"? The group should spend 1 minute brainstorming 2-4 key factors that they believe drive the outcome. For example, for regime survival: economic conditions, strength of opposition, external support, etc.
       c. **Base Rate Knowledge**: Can at least one member of the group provide a base rate (probability) for the outcome in this class from general knowledge? (If no, the class is set aside for now but might be used in step 4 if needed.)

     - Keep only classes that pass (a) and (b) and for which (c) is "yes". If no class passes, then skip to step 4 (inside view). If only one class passes, then use that class and skip to step 5.

  3. **Estimate Base Rates (5 minutes)**:
     - For each remaining class, the member who claimed knowledge of the base rate states the base rate (probability) and the group asks: 
          - How many cases in the class? 
          - How many positive outcomes? 
          - If the base rate is based on a subset of the class, note that.
     - If multiple members claim knowledge, they each give their base rate and the group takes the median (to avoid outliers). If only one, then use that.
     - Record the base rate for each class.

