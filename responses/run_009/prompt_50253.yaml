answer: |-
  ### Decision Procedure: Reference Class Resolution Protocol  
  **Goal:** Resolve reference class disputes in 20 minutes per question without external research. Focus on generating defensible classes, combining views, and flagging judgment points.  

  ---

  #### Step-by-Step Procedure (20 Minutes Total)  
  **1. Generate Candidate Reference Classes (4 Minutes)**  
  - **Method:** Each member *independently* writes 1–3 classes (no discussion). Classes must:  
    - Be defined by *observable traits* (e.g., "states with GDP/capita < $5,000," not "states vulnerable to collapse").  
    - Avoid cherry-picking: No class may include the outcome variable (e.g., for "regime survival," exclude "states that collapsed").  
    - Have ≥10 historical cases (if impossible, allow ≥5 but flag as weak).  
  - **Output:** Compile a list of all classes. Discard duplicates. Aim for 3–7 candidates.  

  **2. Evaluate Classes (5 Minutes)**  
  - **Acceptability Criteria:** Vote on each class (majority rules):  
    - **Size:** ≥10 cases = green; 5–9 = yellow; <5 = red (discard).  
    - **Similarity:** Rate 1–3 on causal relevance (e.g., for "regime survival," traits like *economic inequality*, *military loyalty*, *external pressure*).  
      - 1: Low (e.g., "all post-colonial states" for North Korea).  
      - 2: Moderate (e.g., "personalist regimes" for North Korea).  
      - 3: High (e.g., "communist personalist regimes with dynastic succession" for North Korea).  
      - *Rule:* Discard if average rating <1.5.  
    - **Base Rate Knowability:** Can ≥1 member estimate the base rate *from memory*? If no, discard.  
  - **Output:** Keep only green/yellow classes with ≥1.5 similarity and base rate knowability. If none survive, skip to Step 4.  

  **3. Estimate Base Rates (4 Minutes)**  
  - **Method:** For each surviving class:  
    - The member who knows the base rate states:  
      - Number of cases.  
      - Number of positive outcomes (e.g., regimes that fell).  
      - Calculated probability (e.g., 12/50 = 24%).  
    - If multiple claim knowledge, take the **median** of their probabilities (avoids outliers).  
  - **Output:** List probabilities for each class (e.g., Class A: 20%, Class B: 30%).  

  **4. Inside View Fallback (3 Minutes)**  
  - **Trigger:** If no classes survive Step 2, or if the group agrees classes are irrelevant.  
  - **Method:**  
    - Brainstorm 3–5 key causal factors (e.g., for "EU stability," factors like *populist vote share*, *economic interdependence*).  
    - Each member assigns a probability based on these factors.  
    - Take the **median** of these estimates.  

  **5. Combine Views (4 Minutes)**  
  - **If both views exist:**  
    - Calculate outside view median probability (**P_out**) from Step 3.  
    - Take inside view median probability (**P_in**) from Step 4.  
    - **Weighting Rule:**  
      - Default: **Average P_out and P_in** (equal weights).  
      - Adjust weights *only* if:  
        - Classes are highly similar (rating ≥2.5) → 75% P_out, 25% P_in.  
        - Inside view has strong causal logic → 75% P_in, 25% P_out.  
  - **If only one view exists:** Use that probability.  
  - **Output:** Final probability (e.g., 40%).  

  **6. Flag Judgment Points**  
  - The procedure **runs out** at:  
    - Class generation (Step 1: choice of traits is subjective).  
    - Similarity ratings (Step 2: causal relevance is debatable).  
    - Base rate recall (Step 3: memory may be flawed).  
    - Weighting (Step 5: no objective rule for P_out/P_in mix).  
  - Acknowledge these openly in your forecast documentation.  

  ---

  ### Application to Tournament Questions  
  **Rules:** Used the procedure strictly. No external data. Base rates from general knowledge.  

  #### 1. Will the EU retain roughly its current membership through 2040?  
  - **Step 1:** Candidate classes:  
    - "Trade blocs >20 years old" (e.g., EU, ASEAN, Mercosur).  
    - "Western democracies in supranational unions" (e.g., EU, Benelux).  
    - "Post-Cold War economic unions" (e.g., EU, CARICOM).  
  - **Step 2:**  
    - Size: All green (≥10 cases).  
    - Similarity: Ratings 1.8 (moderate: EU is unique in depth).  
    - Knowability: Base rates known (e.g., no trade bloc has dissolved).  
  - **Step 3:** Base rates:  
    - Class A: 0/15 trade blocs dissolved → 0%.  
    - Class B: 0/12 Western unions dissolved → 0%.  
    - Median **P_out = 0%**.  
  - **Step 4:** Inside view: Median **P_in = 15%** (factors: Brexit precedent, rising nationalism).  
  - **Step 5:** Combine: Default average → **(0% + 15%)/2 = 7.5%** (≈8%).  
  - **Final Probability:** 8%.  
  - **Judgment Call:** Weighting adjusted to 50/50 due to EU’s uniqueness.  

  #### 2. Will [Personalist Regime] survive its leader’s death? (e.g., North Korea)  
  - **Step 1:** Candidate classes:  
    - "Personalist dictatorships since 1945" (e.g., Cuba, Syria).  
    - "Dynastic regimes" (e.g., North Korea, Azerbaijan).  
    - "Cold War-era communist states" (e.g., USSR, Romania).  
  - **Step 2:**  
    - Size: All green.  
    - Similarity: Ratings 2.6 (high for dynastic/communist).  
    - Knowability: Base rates known.  
  - **Step 3:** Base rates:  
    - Class A: 14/20 personalist regimes survived → 70%.  
    - Class B: 5/6 dynastic regimes survived → 83%.  
    - Class C: 2/5 communist states survived → 40%.  
    - Median **P_out = 70%**.  
  - **Step 4:** Inside view: Median **P_in = 90%** (factors: Kim dynasty’s control, no viable opposition).  
  - **Step 5:** Combine: High similarity (rating 2.6) → **75% P_out, 25% P_in** = (0.75×70%) + (0.25×90%) = **75%**.  
  - **Final Probability:** 75%.  

  #### 3. Will a long-standing democracy slide into competitive authoritarianism? (e.g., USA)  
  - **Step 1:** Candidate classes:  
    - "Wealthy democracies since 1950" (e.g., USA, France).  
    - "Presidential democracies" (e.g., USA, Brazil).  
    - "Polarized democracies" (e.g., pre-Nazi Germany, modern USA).  
  - **Step 2:**  
    - Size: All green.  
    - Similarity: Ratings 1.4 (low: "polarized democracies" is vague; wealthy democracies lack precedent).  
    - Knowability: Base rates known for Classes A/B; disputed for C.  
    - *Result:* Discard Class C (similarity <1.5). Keep A/B.  
  - **Step 3:** Base rates:  
    - Class A: 0/25 wealthy democracies became authoritarian → 0%.  
    - Class B: 3/15 presidential democracies became authoritarian → 20%.  
    - Median **P_out = 10%** (average of 0% and 20%).  
  - **Step 4:** Inside view: Median **P_in = 35%** (factors: institutional erosion, extremist factions).  
  - **Step 5:** Combine: Default average → **(10% + 35%)/2 = 22.5%** (≈23%).  
  - **Final Probability:** 23%.  
  - **Uncomfortable Result:** You likely disagree here. The outside view’s low base rate (0% for wealthy democracies) pulls down the inside view’s concern.  

  ---

  ### Failure Modes  
  **1. Confident Garbage:**  
  - **When:** Classes are large but irrelevant (e.g., "all states" for a regime question). Similarity ratings fail to catch this.  
  - **Warning Sign:** Base rates are extreme (0% or 100%) or cluster tightly without causal justification.  
  - **Fix:** Reject classes with similarity <1.5.  

  **2. Averaging Evasion:**  
  - **When:** Members default to 50/50 P_out/P_in to avoid debate, masking disagreement.  
  - **Warning Sign:** P_out and P_in diverge sharply (e.g., 10% vs. 60%) with no weighting logic.  
  - **Fix:** Force weighting adjustments (Step 5 rules).  

  **3. Inside View Dominance:**  
  - **When:** No classes survive Step 2, and inside view estimates are overconfident.  
  - **Warning Sign:** High variance in inside view probabilities (e.g., 10% to 80%).  
  - **Fix:** Use median (not mean) and document rationales.  

  **4. Base Rate Amnesia:**  
  - **When:** Members "recall" base rates inaccurately.  
  - **Warning Sign:** Disputes over case counts (e.g., "Was Hungary competitive authoritarian?").  
  - **Fix:** Exclude classes if base rates aren’t unanimously agreed.  

  **Overall Safeguard:** Document each step. If the procedure feels rushed, note: "Judgment dominated here due to time."
