prompt: |-
  Bit of an odd request, but here goes. Over the holidays I was helping my nephew redo his CV for the ninth time — every one of these job ads seemed to want five years' experience for an entry-level post, an unpaid six-month "trial period", a cover letter in a format nobody will ever read, and it struck me that the requirements aren't bugs. They're the point. The whole thing is a handicap display: the uselessness of the demand is what makes it informative, because only the sufficiently desperate or well-off will pay it. I got into this via my brother-in-law, who does behavioural ecology and goes on about peacock tails at dinner, and then I found out economists had worked this out for job markets decades ago (Spence's signalling stuff), and now I can't look at a careers page the same way.

  So: write me a job advertisement, roughly 450–550 words, that is a proper parody of the genre. You're an economist with a satirical streak — someone who has taught the signalling literature to undergraduates and is tired of them memorising the graphs without feeling the cynicism. The ad should have all the furniture: the deadpan corporate voice, section headers ("About the role", "What we're looking for", "Benefits"), bulleted requirements, an invented mid-sized firm (some grey consultancy or insurance broker that calls itself "a family"). The conceit is that the employer has read the literature and decided to be honest: every requirement is chosen purely for its cost and the ad admits it. Requirements should be genuinely useless in content but expensive in time, money, or dignity — my nephew's favourites so far: a cover letter written in original Latin (which will not be read), an interview at 7am on a Sunday with no remote option, a "creativity exercise" that's assembling flat-pack furniture in the lobby. Feel free to invent your own, but make each one expensive *and* pointless, not just cruel.

  The part I care most about: the jokes have to survive an economist's audit, not just get a laugh. So the ad has to quietly get the theory right — a cheap requirement would be faked by everyone and carry no information, hence no exceptions ever (waiving the Latin for a promising candidate would ruin the signal, and the ad should say so); the cost has to hurt the uncommitted more than the committed, otherwise it doesn't seperate anyone and isn't worth demanding; and somewhere it should half-admit, in the tone real ads use for inconvenient truths, that this filters for people who can afford to signal, which is not the same thing as talent. Deadpan throughout — no winking, no "isn't this absurd", the horror is that every sentence is technically rational. Maybe finish with an equal-opportunities statement that quietly concedes the opposite. And before you write the full thing, brainstorm for a minute: list which of your proposed requirements actually separate types and which merely pool them, and cut the ones that don't work. If a signalling theorist would wince, rewrite it. If they'd nod grimly, keep it. Recieve that as the bar for every line.
reasoning: |-
  Hmm, this is a fascinating and challenging request. The user wants a satirical job advertisement that accurately reflects Spence's signaling theory - where employers impose costly, useless requirements purely to filter for highly committed or desperate candidates. 

  First, I need to ensure every element serves as a proper signal. The key principles from signaling theory are:
  - Signals must be costly (time/money/dignity) to prevent faking
  - Cost must disproportionately burden less committed candidates
  - No exceptions allowed (or the signal collapses)
  - Must correlate with underlying traits employer wants (like desperation)

  The user's nephew has great examples - Latin cover letters, absurd interview times, meaningless tasks. I should build on these but ensure they pass economic rigor. 

  Brainstorming signals that work:
  ✓ Latin cover letter (costly to produce, useless skill)
  ✓ Sunday 7am in-office interview (filters for total availability)
  ✓ Flat-pack assembly "creativity test" (humiliating time-waste)
  ✓ Mandatory unpaid trial (financial filter)

  Signals to avoid:
  × Difficult skills test (actually measures ability)
  × Long commute requirement (may correlate with geography not commitment)
  × Expensive certification (could indicate wealth not fit)

  The satire must stay deadpan - no winking at the audience. The equal opportunities disclaimer will be key for irony, acknowledging the filter favors those who can afford to signal. 

  Most importantly, every requirement must be economically defensible as a signal. The user clearly knows this theory well - they mentioned Spence and peacock tails - so the parody must withstand expert scrutiny. The horror comes from how rationally cruel it all is.

  I'll structure it like a real ad: "About the Role", "Requirements", "Benefits". The invented company should sound generically corporate ("Synergia Solutions"). The tone should match the soul-crushing realism of actual job ads that say things like "fast-paced environment" meaning "chronically understaffed".

  For the economist-audit aspect: 
  - Latin letter must be mandatory (no exceptions ruin signal)
  - Sunday interview can't be remote (physical presence is cost)
  - Flat-pack task must be genuinely useless (no transferable skills)
  - Unpaid trial must be full-time (opportunity cost filter)

  The equal opportunities statement will contain the quiet truth: "We recognize that our process may favor candidates with greater temporal flexibility and financial resources" - which is the whole point.
answer: |-
  ## Job Advertisement: Junior Market Insight Associate (Signaling Specialist)

  **About Synergia Solutions:**  
  At Synergia Solutions ("One Family, Infinite Synergy!"™), we believe in harnessing collective potential through data-driven alignment. As a mid-tier strategic consultancy serving the regional insurance brokerage and municipal waste management sectors, we foster an environment where commitment is our core currency. We’re proud to announce an opening designed for individuals who truly understand the economics of dedication.

  **About the Role:**  
  You will support senior analysts in compiling reports using industry-standard templates. Tasks include data entry, scheduling meetings in Outlook, and formatting PowerPoint slides. The role offers exposure to middle-management and complimentary artisan coffee (third Wednesday of each month). Crucially, this position serves as a vital *filtering mechanism* for our organizational ecosystem. We seek only those whose demonstrated commitment aligns with Synergia’s unique cultural investment thesis.

  **What We're Looking For (The Signals):**  
  *To efficiently separate high-commitment candidates from the applicant pool, we require the following costly, non-productive demonstrations. These requirements are intentionally orthogonal to role functionality but serve as robust indices of dedication and resource availability. Note: NO EXCEPTIONS OR ACCOMMODATIONS WILL BE MADE, as variance in signal cost invalidates the separating equilibrium.*

  *   **Cover Letter in Original Latin:** Submitted as a PDF. Must demonstrate novel composition (Google Translate outputs detectable by our proprietary algorithms will be rejected). *Economic Rationale:* The significant time investment (est. 20-40 hrs) and specialized skill acquisition are costlier for candidates with competing commitments or lower resource buffers. This signal is purely informational; the letter will not be read by human staff.
  *   **In-Person Sunday Matinal:** A mandatory preliminary interview slot at **7:00 AM sharp on a Sunday**, held exclusively at our headquarters (Suite 400, 123 Corporate Park Dr.). Remote participation is technologically feasible but expressly forbidden. *Economic Rationale:* The opportunity cost (foregone leisure, family time, remote work flexibility) is disproportionately higher for candidates with valued outside options or care responsibilities, ensuring only the highly committed or situationally unconstrained self-select.
  *   **Lobby-Based Dexterity & Creativity Assessment:** Upon arrival for your Sunday interview, you will assemble a standardized flat-pack bookshelf (provided) in our lobby within 25 minutes. Tools are rudimentary. Performance is scored but irrelevant to job skills. *Economic Rationale:* The public nature induces dignity costs, while the arbitrary time pressure tests tolerance for meaningless tasks. High-cost tolerance correlates strongly with organizational compliance.
  *   **Full-Time Unpaid Pre-Commitment Trial:** Shortlisted candidates undertake a **6-week, full-time (40 hrs/wk) unpaid trial period**. Tasks involve manually verifying publicly available data against itself. *Economic Rationale:* This imposes substantial financial opportunity costs. Only candidates with significant savings, external support, or extreme desperation can absorb this loss, signaling high reservation utility for *any* paid position with us afterward. It does not assess job competence.

  **Benefits of Signaling Your Synergy:**  
  *By bearing these costs, you demonstrate inherent qualities we value beyond measurable skill:*  
  *   Membership in a self-selected cohort of high-commitment individuals (those who paid the costs).  
  *   Complimentary access to our "Synergy Mindset" webinar series (recorded 2018).  
  *   Potential for a conditional offer of employment at the Regional Market Insight Associate I level (subject to post-trial budget approvals).  
  *   The intangible benefit of knowing your costly signals have efficiently sorted you into an economically optimal employment pool.  

  **Equal Opportunities & Rational Selection Disclaimer:**  
  Synergia Solutions is an Equal Opportunity Employer. We recognize that our signaling requirements may inadvertently favor candidates with greater temporal flexibility, financial reserves, or freedom from caregiving obligations. This is not a bias, but a *feature* of cost-based signaling equilibria as defined by Spence (1973). We make no claims that this process identifies "talent" or "potential"; it identifies those for whom the costs we impose are bearable. Diversity of economic circumstance can introduce noise into signaling; we regret this unavoidable efficiency trade-off.  

  **Apply:** Submit your CV (standard format) and **Original Latin Cover Letter (PDF)** via our portal. Applications missing the Latin PDF, requesting Sunday accommodations, or questioning the utility of the bookshelf exercise will be auto-rejected to preserve signal purity. Demonstrate your synergy. Pay the cost. Belong.  

  ---

  **Signaling Audit Notes (Pre-Writing Brainstorm):**

  1.  **Original Latin Cover Letter:** 
      *   **Cost:** High time/research cost. Lowers ROI for applying casually.
      *   **Pointlessness:** Utterly irrelevant to insurance brokerage data entry.
      *   **Separation:** Separates the highly desperate/resource-rich (who *can* pay the time cost) from others. **PASS**. *Cheap requirement?* Translation is cheap/fakeable, hence demand for *original composition*.
      *   **No Exceptions:** Crucial. Waiving it makes the cost avoidable, ruining the signal.

  2.  **7 AM Sunday In-Person Interview:**
      *   **Cost:** High opportunity cost (sleep, family, remote convenience). Physical presence adds travel cost.
      *   **Pointlessness:** Time/day irrelevant to job function; remote works fine.
      *   **Separation:** Separates those with absolute schedule flexibility/desperation (low outside options) from those with valued commitments (family, second job, self-respect). **PASS**.

  3.  **Flat-Pack Furniture Assembly:**
      *   **Cost:** Dignity cost (public, menial), time pressure stress.
      *   **Pointlessness:** "Creativity" claim is absurd; task is purely mechanistic.
      *   **Separation:** Separates those with high tolerance for meaningless, performative tasks (high compliance/low dignity demands) from those who find it degrading or pointless. Correlates with tolerance for corporate absurdity. **PASS**.

  4.  **6-Week Full-Time Unpaid Trial:**
      *   **Cost:** Very high financial opportunity cost (~$8k+ pre-tax earnings forfeited).
      *   **Pointlessness:** Task is useless busywork; skills don't transfer.
      *   **Separation:** Separates candidates who *can afford* to work unpaid (independent wealth, parental support, extreme debt tolerance/desperation) from those who cannot (most people). Signals high commitment *to getting any job*, not skill. **PASS**.

  **Cut Ideas (Didn't Pass Audit):**
  *   *Requiring a specific expensive certification:* Could correlate with actual skill/knowledge (pooling), or wealth (passive signal). Not *inherently* useless enough. Ambiguous separation.
  *   *A 10-page essay on company values:* While costly, it *could* demonstrate writing/research skill (useful in some roles). Also, passionate believers might write it sincerely (pooling the truly zealous with the desperate). Not purely useless.
  *   *Mandatory 2-hour commute:* Correlates too strongly with geography, not purely with commitment/desperation. Some skilled/committed people live far away; some uncommitted live nearby. Poor separator, introduces geographic noise. **CUT**.

  **The Economist's Wince Test:**  
  Every requirement in the final ad should make a signaling theorist nod grimly. The Latin letter's "no Google Translate" enforces cost. The Sunday interview's "no remote" enforces physical presence cost. The unpaid trial's length and full-time nature maximize financial cost. The equal opportunities disclaimer explicitly acknowledges the class/wealth filter inherent in costly signaling, mirroring how real ads bury inconvenient truths in jargon. The deadpan corporate voice makes the rational cruelty land harder. The benefits are patently worthless, highlighting that the *signal itself* is the benefit to the employer.
