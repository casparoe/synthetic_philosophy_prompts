prompt: |-
  For years, at our department's weekly lunch, my colleague in philosophy of physics has been issuing verdicts on whether the posits of past physics were real, and I have kept a record. Phlogiston: not real. Caloric: not real. Newton's absolute space: not real. The Victorian mechanical ether: not real — though she added, unprompted, that Fresnel's theory was getting at something real, and that what survived of ether theory into Maxwell and then relativity is the real part of it. Thomson's electron: real, even though almost everything we believed about electrons changed between 1897 and the late 1920s. The classical electromagnetic field: real. The point-masses of Newtonian mechanics: not real as things, she said, though she granted that the dynamics they carried was. Next term's question is quarks: are they real? I would also like her line on dark matter and on virtual particles. But I care less about the answers than about the rule she has implicitly been running: what are the two or three principles that fit her record just as well as one another, what does each predict about quarks — and about the other two cases — which prediction is your best guess for her and why, and which further case, one I could raise at lunch, would most cleanly drive her candidate rules apart?
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating record of a philosopher's judgments on scientific realism across history, culminating in a challenge to reverse-engineer her underlying principles. 

  First, I need to parse the pattern in her verdicts. Phlogiston, caloric, absolute space, mechanical ether - all rejected as unreal despite being successful in their time. But then she makes nuanced exceptions: Fresnel's ether contained something real, Thomson's electron is real despite radical theory changes, EM fields are real, while Newtonian point masses are unreal except their dynamics. 

  Hmm, the key seems to lie in what survives theory changes. But survival alone isn't sufficient - Victorian ether didn't survive but she granted Fresnel "got at something real." This suggests a distinction between mathematical structure versus ontological interpretation. 

  Let me consider three candidate principles:
  1) Ontic robustness: Entities are real if their core properties persist through theory change (like electron charge/mass ratio surviving quantum mechanics)
  2) Explanatory autonomy: Real entities explain phenomena beyond their theoretical context (EM fields explain optics regardless of ether theories)
  3) Structural continuity: The mathematical relations are what's real (Fresnel's equations worked even when mechanical ether was abandoned)

  For quarks - all three principles would affirm reality due to their indirect evidence and role in QCD. Dark matter is trickier: ontic robustness and explanatory autonomy support it, but structural continuity might see it as placeholder. Virtual particles likely fail all three tests being mathematical artifacts. 

  The cleanest test case would be quantum wavefunctions. If she considers them real, it favors structural continuity; if not, it leans toward ontic robustness. Bose-Einstein condensates could also differentiate these principles. 

  I should emphasize that her approach seems pragmatist - judging reality by operational durability rather than correspondence truth. The lunch debates must be thrilling!
answer: |-
  Based on your colleague's verdicts, here are the three most plausible candidate principles she seems to be applying, how they fit the data, their predictions for quarks/dark matter/virtual particles, and a test case to distinguish them:

  **Candidate Principles:**

  1.  **Structural Continuity (Mathematical/Explanatory Core):** An entity is real if its *core mathematical structure or indispensable explanatory role* persists through fundamental theory change, even if the ontological interpretation changes radically. Reality lies in the robust relationships, not the initial mechanistic picture.
  2.  **Downward Causation (Operational Autonomy):** An entity is real if it has *genuine, autonomous causal power* within its theoretical framework – it *does* things that would be unexplained or causally "idle" without it. It must be more than just a calculational device or re-description of other phenomena.
  3.  **Robust Detection/Manipulation (Interventional Success):** An entity is real if we can *consistently detect its signature* across multiple independent methods and/or *manipulate it* to produce predictable, novel effects in the world, even before a complete fundamental theory is in place.

  **How They Fit the Record:**

  *   **Phlogiston (Not Real):**
      *   SC: Core structure (mass conservation) persisted, but phlogiston *itself* (negative mass stuff) was completely abandoned. Its specific role was replaced/reversed.
      *   DC: Failed downward causation – objects *gained* weight when "dephlogisticated". Its supposed causal powers were inverted.
      *   RM: Not robustly detectable/manipulable as a distinct entity; its effects were better explained by oxygen.
  *   **Caloric (Not Real):**
      *   SC: Conservation principle persisted (energy conservation), but the fluid ontology was completely abandoned for kinetic theory.
      *   DC: Failed downward causation – heat flowed from hot to cold without needing a self-repelling fluid. Its causal powers were reducible to molecular motion.
      *   RM: Not detectable/manipulable as a distinct substance; thermometry measured temperature, not caloric fluid amount directly.
  *   **Absolute Space (Not Real):**
      *   SC: No core mathematical structure *requiring* absolute space survived relativity. Spacetime structure replaced it fundamentally.
      *   DC: No autonomous causal power – it didn't *do* anything observable. Effects attributed to it (inertia) were relational.
      *   RM: No way to detect absolute space or distinguish motion relative to it experimentally.
  *   **Victorian Mechanical Ether (Not Real - but Fresnel Survives):**
      *   SC: Fresnel's *equations* (mathematical structure) for light propagation survived, even though the mechanical ether interpretation (luminiferous fluid) did not. The *dynamical part* (light as wave) was real.
      *   DC: The mechanical ether's specific causal mechanisms (vortexes, etc.) were causally inert/inadequate. Fresnel's waves *did* explain phenomena causally.
      *   RM: Mechanical ether wasn't robustly detected (Michelson-Morley). Fresnel's waves *were* detectable via interference, diffraction, etc.
  *   **Thomson's Electron (Real):**
      *   SC: The concept of a fundamental, discrete, negatively charged constituent of matter (core role/property) persisted through quantum mechanics, even though virtually all other properties (size, trajectory, spin concept, indistinguishability) changed.
      *   DC: Electrons demonstrably *caused* cathode rays, deflection in fields, chemical bonds, etc. – clear causal agency.
      *   RM: Robustly detected via cathode rays, oil drop, spectroscopy; manipulated in CRTs, chemistry, early electronics.
  *   **Classical EM Field (Real):**
      *   SC: The field concept, described by Maxwell's equations, persisted fundamentally into QED (though quantized). Its core mathematical structure and explanatory role (mediating EM forces) remains essential.
      *   DC: Fields clearly *cause* charged particles to move, light to propagate, energy to transfer. Autonomous causal power.
      *   RM: Robustly detectable (antennae, detectors) and manipulable (generators, capacitors, waveguides).
  *   **Newtonian Point-Masses (Not Real as Things; Dynamics Real):**
      *   SC: The point-mass *ontology* (infinitely small, hard spheres) did not survive (replaced by fields, wavefunctions, particles with size/structure). The *dynamical laws* (F=ma, conservation laws, gravitational inverse square law as approximation) persisted structurally.
      *   DC: Point masses *themselves* had no internal causal structure; all causal power was in the *forces* and the dynamics governing their motion.
      *   RM: Point masses weren't directly detectable 'things'; we detected extended objects or effects governed by the dynamics.

  **Predictions for Your Cases:**

  | **Entity**       | **Structural Continuity (SC)** | **Downward Causation (DC)** | **Robust Manipulation (RM)** |
  | :--------------- | :----------------------------- | :-------------------------- | :--------------------------- |
  | **Quarks**       | **Real** (Core role: color charge carriers, fractional charge, QCD structure highly robust, parton model survived) | **Real** (Cause hadron structure, jets, confinement; distinct causal role in strong force) | **Real** (Robustly detected via deep inelastic scattering, jet production, lattice QCD; indirect manipulation via particle collisions) |
  | **Dark Matter**  | **Likely Real** (Gravitational structure/role is robust across galaxies/clusters/CMB; survives despite unknown nature) | **Likely Real** (Causally explains galactic rotation, structure formation, lensing in ways baryonic matter cannot) | **Tentative/Probable** (Detected robustly *gravitationally* (rotation curves, lensing, CMB); *Not yet manipulable*; no *non-gravitational* direct detection yet. RM is the weakest link.) |
  | **Virtual Particles** | **Not Real** (Mathematical artifacts in perturbation theory, not asymptotic states; core role is calculational, not persistent ontology) | **Not Real** (No autonomous causal power; describe force mediation/fluctuations reducible to field interactions) | **Not Real** (Not directly detectable; mathematical tools for calculating measurable effects (Casimir, Lamb shift), not manipulable entities) |

  **Best Guess for Her Verdict & Why:**

  *   **Best Guess:** She will declare **Quarks Real** and **Virtual Particles Not Real**.
  *   **Dark Matter:** This is the most interesting and potentially contentious. Based on her record, she is likely **sympathetic to Dark Matter being real, but with a caveat about the lack of non-gravitational detection/manipulation.** She'd probably say "**Likely Real, but we need more than just gravity to be absolutely sure**" or something similar, acknowledging the gravitational evidence is robust but wanting the interventional proof RM emphasizes.
  *   **Why SC/DC is the Best Fit:** Her verdicts consistently prioritize the persistence of core explanatory/mathematical roles (SC - electrons, fields, Fresnel waves, dynamics) and genuine causal agency (DC - electrons, fields) over the initial ontology. She dismisses things that were either purely interpretive (absolute space), causally flawed (phlogiston, caloric), or lacked robust operational status (mechanical ether details, point masses as *things*). Quarks pass SC/DC with flying colors. Virtual particles fail SC/DC fundamentally. Dark Matter strongly passes SC/DC on gravitational evidence alone, fitting her pattern of accepting entities based on robust explanatory/causal power even before full ontological understanding (like Thomson's electron).

  **The Crucial Test Case:**

  To cleanly drive apart **Structural Continuity (SC)** and **Downward Causation (DC)**, raise the case of **Quantum Wavefunctions / Pilot Waves (de Broglie-Bohm theory):**

  *   **The Scenario:** In standard QM, the wavefunction is a central mathematical object whose evolution (Schrödinger equation) is structurally continuous and indispensable. However, its ontological status is heavily debated (is it "real" or just a calculational tool?). In the de Broglie-Bohm (dBB) interpretation, the wavefunction is explicitly real (a "pilot wave") and has direct, autonomous causal power – it *guides* the trajectories of real particles.
  *   **How it Drives Principles Apart:**
      *   **Structural Continuity (SC):** Would strongly favor the *wavefunction itself* being real (or representing something real) in *any* interpretation, including standard QM, because its mathematical structure and explanatory role are indispensable and persistent across interpretations. The *dynamics* (Schrödinger equation) is clearly real, analogous to Newton's dynamics.
      *   **Downward Causation (DC):** Would likely *reject* the wavefunction as a real *entity causing things* in *standard QM*. In standard QM, the wavefunction describes probabilities; it doesn't *cause* specific outcomes in a direct, autonomous way upon measurement (the measurement problem). However, DC would likely *accept* the wavefunction/pilot wave as real in the **dBB interpretation** because it has explicit, autonomous causal power – it physically guides the particles.
      *   **Robust Manipulation (RM):** Would be agnostic or lean towards "not real" in standard QM (can't "grab" the wavefunction, only measure particle outcomes influenced by it probabilistically). RM might be more sympathetic in dBB if specific manipulations of the pilot wave affecting particle trajectories could be conceived/demonstrated, but this is highly controversial.
  *   **Prediction:** If she adheres strongly to SC, she'll say the wavefunction represents something real regardless of interpretation. If she adheres strongly to DC, she'll likely say it's only real in interpretations like dBB where it has explicit causal power, and is perhaps just a useful mathematical tool in standard QM. Her verdict here would be highly revealing.

  This case cleanly separates the commitment to persistent mathematical structure (SC) from the requirement for autonomous causal agency (DC) in her concept of reality.
