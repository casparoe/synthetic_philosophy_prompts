  I remember that Machiavelli discusses impetuosity vs. caution, saying the prince should adapt to the times. If one method fails, trying the opposite can work. That's a key point the friend might be overlooking. Also, Machiavelli emphasizes preparation—building dykes during calm weather. The friend is cherry-picking the boldness parts.

