     - At the moment of experience (t3), there is a definite fact about what Alice experienced: she looked at the coffee table and did not see the keys. Then she looked at the bookshelf and saw the keys. There was no dropping event because it didn't happen. This experience was recorded in her memory as a "fixed" event.
