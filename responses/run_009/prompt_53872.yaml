     Then (t6): Bob introduces the fabricated neighbor's text.

     At t7: Alice revises her account.

   The critical point is that at t3, when Alice first looked at the coffee table, the keys were not there (because Bob had moved them). So she did not see the keys on the coffee table at that moment. However, she also did not drop the keys. The false suggestion about dropping the keys is introduced at t6.

