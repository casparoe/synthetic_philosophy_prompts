   However, the neighbor's text was a fabrication (Bob made it up to probe Alice's memory). In reality, Alice did not drop the keys. The keys were moved by Bob (unbeknownst to Alice) from the coffee table to the bookshelf while she was in the kitchen.

   The question is: what does Alice really remember? And more importantly, how do the two models explain her report?

   Now, we set up the timing:

     t0: Alice places keys on coffee table.
     t1: Alice goes to kitchen.
     t2: Bob moves keys from coffee table to bookshelf.
     t3: Alice returns to living room, looks at coffee table (doesn't see keys), then looks at bookshelf (sees keys), and picks them up.
