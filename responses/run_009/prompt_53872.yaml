prompt: |-
  I'm a third year doing a philosophy of mind course, and we've just spent two weeks on Dennett against the Cartesian theater. My tutor reckons the really radical move in Consciousness Explained isn't just denying a soul-ish inner spectator, but the bit where he says there's no fact of the matter about when exactly a content "becomes conscious" — the multiple drafts picture plus the Orwellian/Stalinesque point that pre-experience editing and post-experience editing come out empirically indistinguishable. My essay deadline is in two weeks and I want to make all this concrete rather than hand-wavy, because right now my notes are just slogans.

  So here's the job. Construct a thought experiment, from scratch, that purports to get opposite predictions out of the two pictures: the Cartesian theater says the subject will report X, the multiple drafts model says they'll report not-X. Constraints: (i) it can't be a rehash of the famous cases everyone has seen a million times — no colour phi, no cutaneous rabbit, no Libet, no masked priming; (ii) it should be set in ordinary life, like a witness to a minor car prang being questioned a minute later, or someone retelling a conversation at dinner, though you're free to stipulate exact timings, wordings of questions, etc.; (iii) the lever of the case should be a later probe — a follow-up question, an interruption, something arriving after the "moment of experience" has supposedly already happened — so the two models disagree about whether the subject's report can still be shaped by stuff that came afterwards.

  After you lay out the scenario, walk me through each model's prediction and why, and then do the honest bit: given Dennett's own indistinguishability argument, does your case actually deliver what it promises? I suspect it can't, which is sort of the point, but I want to see it argued rather than asserted. Tell me exactly which feature of the case blocks the distinction, and then how a committed theater defender would try to rewrite the case (or the reporting procedure) to claw back a genuine testable difference — and if you think they can't, explain why in terms of the actual commitments of the theater picture, not just by defering to Dennett's authority. My seminar partner reckons a clever enough probe timing could rescue the theater guy and I dont see it, so if you can settle that disagreement too, bonus points.
