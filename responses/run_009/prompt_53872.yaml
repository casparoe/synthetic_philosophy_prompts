     As she picks up the keys, she hears a noise from the kitchen — a glass shattering. She rushes to the kitchen and sees that a glass has fallen from the counter and broken.

   Probe: 
     A minute later, her partner Bob comes into the living room and asks: "Did you see the keys on the coffee table when you came back from the kitchen?" 
     Alice answers: "No, I didn't see them there. I found them on the bookshelf."

