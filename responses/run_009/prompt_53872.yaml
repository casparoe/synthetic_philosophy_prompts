     Multiple drafts: The initial report (t5) is one draft. After the false suggestion (t6), a new draft is formed that incorporates the false event. The report at t7 is just as legitimate (in terms of being the current content of consciousness) as the initial report. There is no fact of the matter about whether she "really" experienced the dropping at the time or not.

