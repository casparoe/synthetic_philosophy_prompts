     - However, when Bob introduces the false suggestion at t6, it cannot alter the original experience. If Alice now reports a false memory (dropping the keys), that must be due to a separate process of confabulation or memory corruption. The original experience remains unchanged.

   According to the multiple drafts model:
     - There is no fixed moment when the experience becomes conscious. The memory of the event is constantly being revised and edited.
