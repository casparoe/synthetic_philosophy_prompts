prompt: |-
  I TA a decision-analysis course — the one where sophomores learn decision trees and expected monetary value and think that's the whole of rationality. Next week I get fifty minutes on the result people call Good's theorem. For my purposes, stated plainly: if you have to pick an act now, you take the one with the highest expected value; but if instead you'll get to observe something relevant for free before acting, and you re-pick once you've seen it, the expected value of that setup is at least as high as picking blind. The gap between the two is what the information is worth. Headline version: a rational agent never turns down free relevant information — where "free" covers both getting it and using it, and the agent actually has to re-optimize after seeing it.

  Don't explain the theorem to me. Plan the fifty minutes.

  1. Order of pieces. Do they need to grind through one "how much would you pay for this test?" calculation by hand before seeing the general statement, or does the general statement come first and create the appetite for the calculation? Tell me which and why — and keep in mind they've seen Bayes' rule but are honestly wobbly on it, which might matter for what has to come first.

  2. The carrying example. Every textbook reaches for the oil wildcatter deciding whether to pay for a seismic survey before drilling. Should I use that, and at what level of concreteness, or is there something better? Whatever you pick, spell out what the example must have (a prior you can write on the board, an observation that shifts it by a factor you can do in your head, two acts whose payoffs depend on the state) and what it must not have (side issues like risk aversion — I don't want the example carrying freight it doesn't need).

  3. Misconceptions, in the order they'll actually show up. I can already see two: "so more data is always good, period" (forgetting the free-and-costless clause and the re-optimizing clause), and, as a seperate thing, hearing "never lowers the expected value" as "can't leave you worse off than you'd have been" — it can, in particular realizations; it's the expectation that's protected. Where in the sequence should each get headed off? What else should I brace for? Related: I gather there are genuine exceptions out there when the information doesn't stay private — something like, if everyone learns the same news, the gains from insuring each other evaporate, so the same fact that helps you decide also destroys the deals you could've struck in ignorance — plus cases where you'd want to precommit to ignore what you're about to learn. I'm honestly not sure wether any of that belongs in a sophomore section; you decide how much to gesture at, and tell me why.

  4. The check. One question to end on where the tempting answer is the wrong answer, so I can tell the people who got it apart from the people nodding along.

  5. What to refuse to explain at this level, and say so out loud, so it doesn't fester.

  And if something has to get cut to fit the time, tell me what goes first.
reasoning: |-
  Okay, let me tackle this TA's lesson plan for Good's theorem. The user is teaching a decision-analysis course to sophomores who've just learned decision trees and EMV. They need a 50-minute session that sticks to the core: free relevant information + re-optimization never hurts in expectation. 

  First, the structure. The students are wobbly on Bayes, so starting with a concrete calculation makes sense. If I throw the general theorem at them first, their eyes might glaze over. A hands-on example with simple numbers (like a medical test with 90% accuracy, 1% prevalence) will ground the abstraction. They need to feel the "aha" when seeing the value of information emerge from the math. 

  For the example, the classic oil wildcatter is solid but dated. A relatable alternative: choosing to carry an umbrella based on a weather app's free forecast. States (rain/no rain), acts (carry/not carry), payoffs (-10 if rain/no umbrella, -2 if carry unnecessarily). Prior P(rain)=0.3. Forecast accuracy 80% - Bayes updates are manageable on board. Crucially, no risk aversion distractions. 

  Misconceptions will pop up fast. When introducing the theorem, I must explicitly box the conditions: "free" (no cost to obtain or use), "relevant" (actually changes decisions sometimes), and "re-optimize" (must update beliefs and act accordingly). The "expectation" point is critical too - I'll show a scenario where getting info leads to a worse outcome in one world (e.g., false alarm makes you carry umbrella needlessly) but the average improves. 

  For edge cases like non-private information destroying insurance markets... maybe just a footnote? Sophomores might get derailed. Save it for office hours. Instead, emphasize that violating "free" (e.g., data storage costs) or "re-optimize" (you ignore the forecast) breaks the guarantee. 

  The check question: Suppose a perfect test exists but costs $1. Prior EMV of best act is $100. Post-info EMV is $105. What's the value of information? Trick answer: $5 (but forgot the $1 cost). Correct: max($0, $5-$1)=$4. Watch who catches the "free" condition. 

  Cutting: Skip measure-theoretic justifications. No need to mention Savage here. If time runs short, trim the Bayes calculation details (assign as HW) but keep the payoff comparisons. 

  Biggest risk is students walking away thinking "more data always good". The umbrella example must show cases where forecast accuracy is so low that paying for it isn't worth the cost - foreshadowing that information value can be zero. Hammer: "Free and used properly? Never harmful on average. Everything else? Negotiable."
answer: |-
  Here’s a battle-tested 50-minute plan focused on clarity, avoiding rabbit holes, and preempting misconceptions. Prioritize **intuition first, formalism second**, given their Bayes wobbliness.

  ---

  ### **1. Order of Pieces**  
  **Start with a concrete calculation → then generalize.**  
  **Why:**  
  - Sophomores need visceral buy-in. A tangible "how much would you pay?" example creates hunger for the theorem.  
  - Doing Bayes live (with simple numbers) rebuilds confidence before abstract claims.  
  - *Risk:* Starting with the theorem feels like "trust me, math works" to novices.

  ---

  ### **2. The Example: Ditch Wildcatter, Use "Umbrella Decision"**  
  **Scenario:** Should you carry an umbrella today?  
  - **States:** Rain (prob = 0.3) vs. No Rain (prob = 0.7). *Prior fits on board.*  
  - **Acts:** Carry (costs $2 inconvenience) or Don’t Carry (costs $10 if rain).  
  - **Free Info:** A weather app (accuracy: 80%). *Bayes updates are trivial:*  
    - P(Rain | "Rain") = (0.8 * 0.3) / [(0.8*0.3) + (0.2*0.7)] = **~63%**  
    - P(Rain | "No Rain") = (0.2 * 0.3) / [(0.2*0.3) + (0.8*0.7)] = **~9.7%**  
  - **Payoffs:** Simple, state-dependent, no risk aversion.  
  - **Why better than oil:** Relatable, no domain knowledge needed, faster to compute.  

  **Boardwork Flow:**  
  - Blind EMV: max{ EMV(Carry) = –$2, EMV(Don’t) = 0.3*(–$10) = –$3 } → **Carry** (EMV = –$2).  
  - With App:  
    - If app says "Rain," EMV(Carry | "Rain") = –$2, EMV(Don’t | "Rain") = –$6.3 → **Carry**.  
    - If app says "No Rain," EMV(Carry | "No Rain") = –$2, EMV(Don’t) = –$0.97 → **Don’t Carry**.  
  - Post-info EMV = P("Rain")*(–$2) + P("No Rain")*(–$0.97) ≈ **–$1.29**.  
  - Value of Info = |(–$1.29) – (–$2)| = **$0.71**.  

  ---

  ### **3. Misconceptions: Order & Countermeasures**  
  **Address AS THEY ARISE in the example:**  
  1. **During payoff calc:** "But if the app says ‘No Rain’ and I don’t carry, I might get soaked! Isn’t that worse?"  
     → *Clarify:* "Yes, in that *realization* you’re worse off (–$10 vs –$2). But **on average**, you gain $0.71. The theorem protects the *expectation*, not outcomes."  
  2. **After example, before theorem:** "So if I get *more* data, I always do better?"  
     → *Shoot down:* "NO. Three caveats:  
     - Must be **free** (no cost to get/process).  
     - Must be **relevant** (changes your decision sometimes).  
     - You **must re-optimize** after seeing it. If you ignore the app, it’s worthless."  
  3. **Post-theorem:** "Can info ever hurt?"  
     → *Briefly acknowledge:* "In strategic settings (e.g., stock markets), public info can destroy insurance opportunities. Also, if you’d precommit *not* to use it (*motivated ignorance*), but that’s irrational here. **For now: assume private info and re-optimization.**"  

  ---

  ### **4. The Check Question**  
  **End with this:**  
  > *"You can pay $X for a test predicting rain (90% accurate). Prior P(rain) = 0.4. Payoffs same as before (Carry costs $2, no-carry-in-rain costs $10). What’s the max $X you’d pay?"*  

  **Tempting wrong answer:** Calculate VOI ≈ $1.58, say "up to $1.58."  
  **Why it’s wrong:** If VOI < cost of the test, you wouldn’t buy it! **Max $X = VOI** only if VOI > 0. Correctly: max $X = VOI = $1.58.  
  *Tests who conflates VOI with "the amount you can charge."*  

  ---

  ### **5. What to Refuse to Explain**  
  **Explicitly state:**  
  - "We’re ignoring **risk aversion** (EMV assumes linear utility)."  
  - "We assume **partitional information** (signals divide states cleanly). No continuous signals today."  
  - "**Strategic interactions** (e.g., everyone learning the same news) break this. Covered in Game Theory, not here."  
  - "**Precommitment vs. flexibility** is advanced. For now: re-optimizing is rational."  

  ---

  ### **Cutting Order (If Short on Time)**  
  1. Trim Bayes calculation details (assign as pre-read).  
  2. Skip strategic exceptions (mention only if asked).  
  3. Simplify check question (use exact fractions).  

  ---

  ### **Minute-by-Minute Plan**  
  - **0-5min:** Hook with umbrella decision (blind choice).  
  - **5-20min:** Compute post-info EMV + VOI live (emphasize Bayes steps).  
  - **20-25min:** Generalize to Good’s theorem: "Free relevant info + re-optimize ⇒ EV can only improve."  
  - **25-35min:** Misconception cleanup + conditions (free, relevant, re-optimize).  
  - **35-45min:** Check question + discussion.  
  - **45-50min:** Limitations, what we’re ignoring, and "this is why rational agents crave free info."  

  **Why this works:** The example forces them to *feel* VOI before naming it. Preempting misconceptions during computation roots out errors early. Ending with a "tricky" check question ensures active engagement.
