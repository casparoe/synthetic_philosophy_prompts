answer: |-
  Here's a defended research agenda for your postdoc, prioritizing impact, tractability, and alignment with your unique background. I rank your questions **1 > 2 > 4 > 3** and argue that resolving the **definitional question (Question 1)** is the critical upstream lever. Crucially, I propose reframing Question 1 as the *central* task, not just an initial fork.

  ### The Ranking & Reasoning (With Explicit Criteria)
  1.  **Question 1 (The Distinction Itself - Reframed):** *The Foundational Problem Demanding Integration*
      *   **Why Ranked First (Upstream Impact & Tractability):** This isn't just choosing a taxonomy; it's about *resolving the conceptual chaos undermining the entire field*. Tangney's act/self dichotomy dominates psychology but is philosophically shallow and struggles with phenomena like chronic guilt, pride, or Williams' "agent-regret." Williams offers depth but lacks operationalization for empirical work. **Settling this fundamentally changes how Questions 2, 3, and 4 are framed and investigated.** Your background is *perfect* for this: Social psychology provides the empirical toolkit, Greek philosophy provides the conceptual depth Williams championed. This is *tractable* for you in a way it isn't for pure philosophers (who lack empirical rigor) or pure psychologists (who lack the conceptual grounding).
      *   **The Core Task:** Don't just "adopt" or "interlock." **Develop an empirically tractable, philosophically robust integrative model.** Test Williams' core claims (e.g., the necessity of an internalized "observer," shame's link to character/identity failures beyond specific acts) using psychological methods. Can "being seen" be operationalized? Does shame triggered by identity/character violation (vs. mere exposure) have different behavioral consequences? Your Greek expertise allows you to analyze ancient texts not just as examples, but as *data* on emotional phenomenology challenging modern categories.
      *   **Why Not Defer?** Every empirical finding (Question 2) or cultural comparison (Question 3) is interpreted through an assumed definition. Using a flawed or narrow definition (like act/self) risks generating misleading evidence. Normative arguments (Question 4) are unmoored without clarity on what these emotions *are*.

  2.  **Question 2 (Causal Claim - Behavior):** *Testing the Behavioral Engine Room with Rigor*
      *   **Why Ranked Second (Tractability & Downstream Dependence):** The Tangney-derived causal claim *is* the empirical bedrock for applied work (Questions 3 & 4). Its reliance on correlational/self-report data is a major limitation. Your skills are ideal for designing strong experiments inducing state guilt/shame (e.g., recall, vignette, behavioral induction paradigms) and measuring real behavioral outcomes (amends, concealment, prosociality, aggression, withdrawal) – including the crucial vicarious dimension you note. **This directly tests the core practical claim driving interest in the field.**
      *   **Link to Question 1:** Your refined model from Question 1 *informs how you induce and measure*. Instead of just "act-focus" vs. "self-focus," you might induce "character-violation shame" vs. "exposure shame" vs. "rule-violation guilt" vs. "relational guilt," predicting different behavioral profiles. Does "Williams-compatible shame" really *only* lead to withdrawal?
      *   **Tractability:** Highly tractable with social psych methods. Experimental work on discrete emotions is well-established. Vicarious aspects are understudied but methodologically feasible (e.g., group identity manipulations, observing reactions to in-group transgressions).
      *   **Neglected Aspect:** The vicarious dimension is key and less explored experimentally. Your focus here is novel.

  3.  **Question 4 (Normative - What Ought a State Cultivate?):** *The Necessary (But Premature) Endpoint*
      *   **Why Ranked Third (Downstream & Requires 1 & 2):** This is the ultimate "so what?" question. However, arguing what the state *should* do is incoherent without:
          1.  A clear understanding of what guilt and shame *are* (Question 1).
          2.  Robust evidence on their actual causal effects *in relevant contexts*, especially social/vicarious contexts mirroring state action (Question 2).
      *   **Your Unique Contribution:** With insights from 1 & 2, you can move beyond the simplistic "guilt good/shame bad" dichotomy. *If* your work shows certain forms of shame (e.g., tied to shared values/internalized ideals, not mere exposure) can motivate positive change without destructive withdrawal, or that guilt has hidden costs, the normative calculus changes dramatically. You can analyze the "online pile-on" phenomenon through your integrated lens.
      *   **Why Not Higher?** Tackling this *before* making progress on 1 & 2 risks rehashing existing philosophical debates (Williams vs. Nussbaum vs. Tangney advocates) without new empirical grounding. It's less *directly* tractable experimentally, leaning more on synthesis.

  4.  **Question 3 (Cultural Malleability):** *Important but Deferrable (and Less Directly Tractible for You)*
      *   **Why Ranked Last (Deferrable, Less Tractible, Most Downstream):** This question is fundamentally anthropological/sociological/criminological. While fascinating, robustly addressing cultural parameters requires longitudinal, comparative, multi-method fieldwork – less aligned with a 2-year social psych postdoc's core experimental strengths. It also **critically depends** on progress in Questions 1 & 2.
      *   **Dependence:** How can you measure "cultural balance" without a solid definition (Q1)? How can you assess the effects of policy shifts (e.g., Braithwaite-style shaming) without a clear understanding of the emotions' behavioral impacts (Q2) in those contexts? Is "reintegrative shaming" leveraging guilt, a specific form of shame, or something else? Your model from Q1 is essential.
      *   **Tractability & Crowding:** This space *is* crowded with ethnographic and policy work, but often using underspecified definitions of shame/guilt. Your unique contribution here would come *later*, applying your refined model *to* existing cultural/policy debates after establishing it empirically and conceptually. Deferring this for 2 years incurs minimal loss; foundational work on 1 & 2 makes future work on 3 far stronger.

  ### What to Cut & What to Focus On
  *   **Focus Relentlessly on Question 1 (Integration) and Question 2 (Causal Test):** Treat Q1 not as a preliminary step, but as the *core theoretical contribution*. Dedicate significant time (Year 1) to developing and initially testing your integrative model (e.g., through conceptual analysis, pilot studies refining inductions/measures based on Williams, initial behavioral experiments contrasting your model's predictions with Tangney's). Year 2 should focus on rigorous experimental tests (Q2), especially incorporating vicarious elements and behavioral outcomes, informed by your model.
  *   **Cut Direct Immersion in Question 3 (Cultural Malleability) for Now:** Don't dive deep into comparative criminology or ethnography as a primary research focus. Engage with it intellectually to inform your thinking, but don't make it an empirical target.
  *   **Engage Normatively (Q4) Synthetically Later:** Use your findings from Q1 & Q2 to write a powerful synthetic paper (or conclusion to your experimental work) addressing Q4, rather than making normative theory a primary empirical focus.

  ### What Would Change My Ranking?
  *   **Major Neuroscientific Breakthrough:** If compelling, widely accepted evidence emerged mapping distinct, universal neurocognitive pathways for Tangney-style guilt vs. shame (or Williams-style vs. exposure-shame), it would weaken the urgency of Q1. However, current neuro findings are messy and don't resolve the conceptual debate.
  *   **Definitive Cross-Cultural Meta-Analysis:** If a massive, methodologically flawless study conclusively showed cultural malleability patterns *independent* of definitional issues, it might elevate Q3. This is highly unlikely soon.
  *   **Your Early Findings:** If your work on Q1 reveals the Tangney/Williams distinction is fundamentally flawed or irrelevant *for behavioral prediction*, it would necessitate a major pivot, potentially elevating Q4 (what *should* we focus on instead?) or pushing towards a radical reconceptualization of the field.

  ### The Agenda: Year by Year
  *   **Year 1:** **Core Focus on Question 1 (Integration).** Output: Major theoretical paper (Psych Review/Phil Psych?) presenting your integrative model, supported by conceptual analysis (leveraging Greek phil) and preliminary experimental data (e.g., showing different phenomenological profiles or behavioral precursors for your proposed subtypes vs. Tangney's categories). Develop robust experimental paradigms for Q2.
  *   **Year 2:** **Core Focus on Question 2 (Causal Test).** Output: 2-3 high-impact experimental papers testing behavioral outcomes (including vicarious) of guilt vs. shame subtypes defined by your model, directly challenging the standard Tangney narrative. Begin integrating findings normatively (Q4) in discussion/writing.
  *   **Beyond Postdoc:** Use this foundation to tackle applied cultural/policy questions (Q3) or delve deeper into normative theory (Q4).

  This agenda leverages your unique dual expertise to strike at the heart of the field's conceptual confusion, generate novel, rigorous empirical evidence, and position you to reshape both the theoretical understanding and practical discourse around these crucial moral emotions. Good luck!
