answer: |-
  **Midterm Exam Question: Simpson's Paradox in Educational Formats**  
  **Course: Correlation, Causation, and Paradox**  
  **Total Marks: 20**  

  ---

  ### Dataset: Fictional University Teaching Outcomes  
  The table below shows pass rates for online versus in-person teaching across two departments (A and B):  

  | Department | Format    | Students Enrolled | Students Passed |
  |------------|-----------|-------------------|-----------------|
  | A          | Online    | 10                | 9               |
  | A          | In-person | 100               | 80              |
  | B          | Online    | 100               | 50              |
  | B          | In-person | 10                | 4               |

  ---

  ### Questions  
  **(a)** Calculate the following:  
  - (i) Pass rates for online and in-person teaching **within** Department A and **within** Department B.  
  - (ii) **Overall** pass rates for online and in-person teaching (aggregated across departments).  
  - (iii) State the paradoxical observation in one sentence.  
  **(5 marks)**  

  **(b)** Consider two institutional backstories for the same dataset:  
  - **Backstory 1 (Confounder)**: Students were assigned to online/in-person teaching *based on their department*. Department A prioritized in-person, while Department B prioritized online.  
  - **Backstory 2 (Mediator)**: Students *chose* their teaching format first, leading to downstream departmental composition differences. Online choosers disproportionately enrolled in Department B, while in-person choosers disproportionately enrolled in Department A.  

  For **each** backstory:  
  - (i) Draw a causal diagram (DAG) depicting the relationships between format choice (F), department (D), and pass rate (P).  
  - (ii) Using your DAG, justify whether the **aggregated** (overall) or **disaggregated** (department-specific) data answers the causal question: *"Which teaching format causally improves pass rates?"*  
  **(14 marks; 7 per backstory)**  

  **(c)** What mistake might a strong-but-not-excellent student make when answering (b)? *(One sentence, 1 mark)*  

  ---

  ### Model Answer  

  **(a)**  
  - (i) **Within-department pass rates**:  
    - Department A: Online = \(9/10 = 90\%\), In-person = \(80/100 = 80\%\).  
    - Department B: Online = \(50/100 = 50\%\), In-person = \(4/10 = 40\%\).  
  - (ii) **Overall pass rates**:  
    - Online: \((9 + 50) / (10 + 100) = 59/110 ≈ 53.6\%\).  
    - In-person: \((80 + 4) / (100 + 10) = 84/110 ≈ 76.4\%\).  
  - (iii) **Paradox**: Online outperforms in-person within each department, but in-person outperforms online overall.  
  **(5 marks: (i) 2 marks, (ii) 2 marks, (iii) 1 mark)**  

  **(b)**  
  **Backstory 1 (Confounder)**:  
  - (i) **Causal diagram**:  
    ```plaintext
    D (Department) → F (Format)  
    D → P (Pass Rate)  
    F → P  
    ```  
    *Explanation*: Department is a confounder. It causes both format assignment (e.g., Department A forces in-person) and pass rates (e.g., Department A has higher baseline performance), while format affects pass rates.  
  - (ii) **Justification**: Use **disaggregated data**. The backdoor path \(F ← D → P\) must be blocked to isolate the causal effect of \(F → P\). Conditioning on \(D\) (disaggregation) achieves this, revealing the true effect: online is superior within both departments. Aggregating (ignoring \(D\)) allows confounding, producing the spurious overall advantage for in-person.  
  **(7 marks: (i) 3 marks for DAG/explanation, (ii) 4 marks for justification)**  

  **Backstory 2 (Mediator)**:  
  - (i) **Causal diagram**:  
    ```plaintext
    F (Format) → D (Department)  
    F → P (Pass Rate)  
    D → P  
    ```  
    *Explanation*: Format choice causes downstream department enrollment (e.g., online choosers select Department B), and department affects pass rates. Format also has a direct effect on pass rates.  
  - (ii) **Justification**: Use **aggregated data**. Department is a mediator. To estimate the *total causal effect* of format on pass rates (including \(F → D → P\) and \(F → P\)), we must *not* condition on \(D\). Disaggregation blocks the indirect path \(F → D → P\), understating format’s true effect. The aggregated data shows in-person’s total advantage (76.4% > 53.6%).  
  **(7 marks: (i) 3 marks for DAG/explanation, (ii) 4 marks for justification)**  

  **(c)**  
  **Mistake**: Assuming disaggregated data is *always* causally correct (e.g., due to overgeneralizing from textbook examples like Berkeley admissions), ignoring that mediators require aggregation for total effects.  
  **(1 mark)**  

