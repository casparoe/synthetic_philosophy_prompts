prompt: |-
  i'm trying to figure out what i actually think about scotland/catalonia/quebec-style secession before i go read the actual philosophers, and i want the spec first, not the answers. so: what does a theory of secession and self-determination have to get right to count as adequate? give me the requirements with the case or consideration behind each one, and i want you to take seriously the stuff people usually gloss over, e.g.:

  - the difference between having a right to secede and having a claim to the *territory* you'd take with you -- the state you're leaving presumably has some story about why that land is its land, and a theory that only talks about who gets to vote has silently answered a different question
  - the fact that a majority vote in the seceding region manufactures a brand-new minority that just got outvoted, and the theory has to say whether that minority gets to secede in turn, recursively, or is stuck. think about how a theory handles a sub-region that votes 90% to stay with the old state -- does the theory owe them anything, or does "you lost the vote" do all the work, and if so why was that answer bad when the parent state gave it?
  - whether the bar is different for a region with a remedial grievance (being conquered, being systematically excluded) vs. a region that's doing fine and just wants out
  - who counts in the referendum franchise at all -- long-term residents born elsewhere, recent arrivals, people who left, people who'd move there if the border changed
  - whether the theory has to say anything about the aftermath -- citizenship, the national debt, the currency, who gets the military bases -- or whether that's somebody else's problem and it's fine for the theory to stop at the border, so to speak
  - whether it can stay neutral between "who may secede" and "who must be recognized once they do" -- kosovo vs crimea, roughly: both unilateral, one recognized and one not. if your theory can't explain the difference between those, say so

  then flag which pairs of requirements you suspect can't be jointly satisfied -- like, can you have both a clean plebiscitary rule and real protection for internal minorities, or does one have to bend, and which one should it be? and tell me which single requirement on your list does the most to knock out the main contenders (remedial-right-only theories, national self-determination theories, bare plebiscitary theories). dont do a full scorecard, i just want the criteria and the reasoning behind them, the scoring can come later. and be honest about which of your requirements are genuine requirements and which are really just preferences of the liberal democratic states that happen to be writing the rules.
reasoning: |-
  Okay, the user is asking about creating a robust theory of secession and self-determination. They want the criteria that such a theory must satisfy before diving into philosophers' works. The key here is to address the nuances they mentioned—like territory claims, internal minorities, remedial vs. aspirational secession, franchise issues, aftermath, and recognition. 

  First, I need to unpack each point they raised. The distinction between the right to secede and territorial claims is crucial. The parent state's sovereignty arguments can't be ignored. Then there's the problem of new minorities created by the secession vote. How does the theory handle a sub-region that voted overwhelmingly to stay? If "you lost the vote" isn't good enough for the parent state, why would it suffice internally? 

  Next, the difference between remedial and aspirational secession. Remedial cases involve past injustices, while aspirational is about preference. Should the bar be lower for remedial cases? The franchise question is messy—who gets to vote? Residents, diaspora, future immigrants? And post-secession issues like debt, assets, citizenship can't be sidelined. 

  The Kosovo vs. Crimea example shows recognition isn't automatic. A theory must address why some unilateral secessions gain legitimacy while others don't. Also, the user wants to know which requirements conflict. For instance, a simple majority vote might clash with protecting internal minorities. You can't have both without compromise. 

  The user is likely preparing for deeper academic reading but wants to form their own framework first. They’re wary of liberal democratic biases masquerading as universal principles. They might also be interested in real-world applications beyond theory—like why some movements succeed and others fail. 

  I should list each requirement with its rationale, highlighting tensions. For example, territorial integrity vs. self-determination is a classic clash. Remedial theories might handle past injustices but struggle with peaceful exits. Plebiscitary theories are clean but ignore minorities. Nationalist theories risk exclusion. 

  The biggest hurdle? Probably integrating remedial and aspirational secession without contradiction. Also, balancing majority rule with minority protection is inherently messy. The franchise inclusivity requirement could challenge nationalist theories focused on ethnic identity. 

  Finally, flagging which requirements are genuinely universal versus Western liberal preferences is key. For instance, prioritizing individual rights might reflect liberal values, not global norms. The user wants this honesty to avoid biased frameworks.
answer: |-
  Here's a breakdown of the core requirements an adequate theory of secession/self-determination must address, grounded in the complexities you've highlighted. Each requirement stems directly from a critical tension or real-world implication:

  1.  **Distinguishing Legitimacy from Territorial Claim:**
      *   **Requirement:** Must explicitly address the *basis* for claiming the *specific territory* sought, separate from the group's right to self-determination. It must counter the existing state's claim to territorial integrity/sovereignty over that land.
      *   **Case/Consideration:** Scotland, Quebec, Catalonia all claim specific historical/geographical territories. The UK, Canada, and Spain assert sovereignty over those same lands. A theory cannot just say "Scots have a right to self-determination" – it must explain why that right *entitles them specifically to the territory of Scotland* and overrides the UK's claim. Does history, effective control, demographic concentration, or something else ground the territorial claim? A pure "right to vote" theory silently assumes the territory is already legitimately "theirs" to decide about.

  2.  **Addressing the "New Minority" Problem (Recursive Secession & Internal Minorities):**
      *   **Requirement:** Must provide a principled justification for why the majority vote in the seceding region binds the internal minority *within that region*, and explain the limits (if any) of further secession by disaffected sub-regions.
      *   **Case/Consideration:** Imagine Glasgow votes 90% to stay in the UK while rural Scotland votes 60% for independence. Why must Glasgowans be bound by the overall Scottish majority? Does the theory grant *them* a right to secede from an independent Scotland? If not, how is this different from the parent state telling Scotland "you lost the overall UK vote, deal with it"? A theory must explain the legitimacy of the new internal border and why further fragmentation is/isn't justified, avoiding infinite regress while respecting minority rights within the new state.

  3.  **Differentiating Remedial vs. Aspirational Secession:**
      *   **Requirement:** Must articulate whether the justification/bar for secession is different for groups suffering severe, persistent injustice (remedial) vs. groups simply preferring independence despite fair treatment (aspirational).
      *   **Case/Consideration:** Kosovo (remedial: systematic oppression, violence) vs. Quebec or Scotland (aspirational: primarily cultural/political preference within functioning democracies). Does a group need to demonstrate grievous harm to have a *right* to secede, or is a democratic majority preference sufficient? If the bar is lower for remedial cases, how is "grievance" defined and proven? If the bar is the same, does this trivialize severe injustice or unfairly inhibit legitimate aspirations?

  4.  **Defining the "Self" in Self-Determination (Franchise & Demos):**
      *   **Requirement:** Must provide a coherent and defensible definition of who constitutes the relevant "self" entitled to vote on secession, addressing contentious demographic boundaries.
      *   **Case/Consideration:**
          *   Long-term residents born elsewhere? (e.g., English-born residents in Scotland for 30 years).
          *   Recent arrivals? (e.g., someone moving to Catalonia 6 months before a vote).
          *   People who left? (e.g., the Scottish/Catalan diaspora).
          *   People who *would* move if borders changed? (e.g., unionists moving *out* or nationalists moving *in* post-secession).
          *   Does residency, citizenship, birth, ethnicity, or a combination determine the franchise? A theory relying on a vote must justify *who votes*, as this dramatically shapes the outcome and the legitimacy of the "self" being determined.

  5.  **Accounting for the Practical Aftermath (Beyond the Border):**
      *   **Requirement:** Must engage with the practical consequences of secession, at least to the extent of establishing principles for their *just* resolution, as these directly impact the legitimacy and viability of the act.
      *   **Case/Consideration:** Secession isn't just drawing a line. How is national debt apportioned? How are shared assets (pension funds, natural resources, military bases, cultural heritage) divided? What about citizenship for residents on both sides of the new border? What currency will the new state use? Who inherits treaty obligations? A theory that ignores these as "implementation details" risks endorsing chaos or profoundly unjust outcomes, undermining the moral claim for secession itself.

  6. **Explaining/Engaging with Recognition & International Legitimacy:**
      *   **Requirement:** Must either explain the criteria for legitimate international recognition *or* justify why unilateral declaration creates a moral obligation for recognition *despite* non-recognition, and address the Kosovo (widely recognized) vs. Crimea (largely unrecognized) disparity.
      *   **Case/Consideration:** Kosovo declared unilaterally and gained recognition from many states; Crimea declared unilaterally (after Russian intervention) and is largely unrecognized. Does the theory view recognition as merely political, or can it provide normative criteria distinguishing legitimate from illegitimate unilateral secession? Can it explain the Kosovo/Crimea difference normatively (beyond geopolitics)? If the theory claims secession creates a *right* to recognition, it must grapple with why this right is often ignored in practice.

  **Suspected Irreconcilable Tensions:**

  1.  **Clean Plebiscitary Rule vs. Robust Internal Minority Protection:** These are fundamentally at odds. A simple majority vote inherently creates a bound minority. Granting strong secession rights to internal minorities (like the 90% pro-UK Glasgow) effectively negates the initial secession or leads to infinite fragmentation ("matryoshka secession"). *Likely Bend:* Minority protection must usually bend, shifting from a *right to secede further* to strong *minority rights guarantees within* the new state. Justifying this shift without echoing the parent state's "you lost the vote" argument is the challenge.
  2.  **Territorial Integrity (Parent State) vs. Self-Determination (Seceding Group):** This is the core tension. A theory prioritizing one will struggle to accommodate the other sufficiently. Remedial theories bend towards self-determination under injustice; plebiscitary theories prioritize self-determination directly; nationalist theories try to ground territorial claims in identity/control to bypass the parent state's claim.
  3.  **Remedial-Only Justification vs. Aspirational Claims:** If the bar is set very high (only severe injustice justifies secession), it denies legitimate democratic aspirations in stable states. If the bar is low (simple majority preference suffices), it potentially destabilizes all multinational states and may devalue the gravity of remedial cases. Reconciling these within one coherent principle is difficult.

  **The Requirement That Knocks Out Major Contenders:**

  *   **The "New Minority" Problem (Requirement #2)** is arguably the most devastating for simplistic theories.
      *   **Knocks out Bare Plebiscitary Theories:** They rely solely on majority vote within an arbitrarily defined territory. Requirement #2 exposes this as circular: *Why* is this territory the unit? Why does *this* majority bind the internal minority? The "you lost the vote" answer fails because it's the exact justification the parent state used, which the theory rejects. It offers no principled stopping point against fragmentation.
      *   **Challenges National Self-Determination Theories:** Defining the "nation" is contested. What about individuals within the territory who don't identify with that nation? What about regions within the "national" territory with a strong opposing identity (like Glasgow)? These theories often struggle to explain why *this* nation's claim overrides both the parent state *and* internal dissenters not part of the "nation," beyond mere assertion.
      *   **Challenges Remedial-Right-Only Theories:** While they handle the core parent-state vs. seceding-group tension well for victims of injustice, they still face the internal minority issue *within* the seceding region. Does the remedial grievance bind *everyone* within the territory? What about groups within the territory who didn't suffer the grievance (e.g., recent arrivals) or actively opposed the secession movement? The remedial claim might be strong against the parent state, but weaker against internal dissenters.

  **Distinguishing Genuine Requirements vs. Liberal Democratic Preferences:**

  *   **Genuine Requirements (Addressing inherent moral/practical dilemmas):** #1 (Territorial Claim), #2 (New Minority), #3 (Remedial vs. Aspirational distinction - the *need* for a distinction is inherent, the *content* may be preference), #4 (Defining the 'Self' - the *need* to define it is inherent, the *criteria* may be preference), #5 (Aftermath - consequences are inherent).
  *   **Likely Influenced by Liberal Democratic Preferences:** The *specific content* within several requirements often reflects these values:
      *   The emphasis on individual rights/minority protection within the new state (#2, #5 Citizenship).
      *   Preference for democratic decision-making processes (#4 Franchise likely prioritizing residency/citizenship over pure ethnicity, #3 potentially setting a high bar for non-democratic aspirational secession).
      *   The focus on peaceful, negotiated settlements and rule of law (#5 Aftermath, #6 Recognition criteria emphasizing legality/process).
      *   The *high value placed on stability* inherent in tensions with plebiscitary models (#2, #3).
      *   The emphasis on "remedial" injustice often defined in terms of liberal individual rights violations.

  A robust theory must grapple with the genuine requirements arising from the inherent tensions of sovereignty, territory, and group identity. However, the *solutions* it proposes will inevitably reflect normative commitments (like the value of democracy, individual rights, or stability) that are not universally shared but are prominent in the states currently shaping international norms. Being honest about this bias is crucial.
