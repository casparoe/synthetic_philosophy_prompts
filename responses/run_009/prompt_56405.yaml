  - **Orwellian**: Experience happens in real time; content can be retroactively revised.  

  **Experiment: *Concurrent Measure During Color Phi***  
  - **Method**: Subjects press a button *the moment they see any color* during a phi sequence, without disrupting the illusion. Trials are interrupted mid-sequence (after first flash, before second) to capture concurrent reports. Stimulus-onset asynchrony (SOA) varies (50–150ms). Controls: Single-flash trials (baseline timing).  
  - **Predictions**:  
    | **Condition**       | **Stalinesque Prediction** | **Orwellian Prediction** |  
    |---------------------|----------------------------|--------------------------|  
    | **Single flash**    | Button press ∼200ms post-flash (standard conscious delay). | Button press ∼200ms post-flash. |  
    | **Phi sequence**    | No button press until *after* second flash. Press timing aligns with integrated percept (e.g., motion onset). | Button press for first flash ∼200ms post-flash, *before* second flash appears. |  
  - **Falsification**:  
    - If button presses occur *before* the second flash in phi, Stalinesque is falsified.  
    - If presses *only* occur after the second flash, Orwellian is falsified.  

  #### **Crux 2: What must a memory of an experience be a memory *of*?**  
  *Dispute*:  
  - **Stalinesque**: Memory is of the *edited experience*; no "initial experience" exists to remember.  
  - **Orwellian**: Memory is of the *original experience*, but it can be overwritten.  

  **Experiment: *Withheld Second Stimulus in Phi***  
  - **Method**: In 50% of trials, the second flash is randomly withheld. Subjects give concurrent reports (button press at "any color") and delayed descriptions. EEG measures neural correlates (e.g., P3 for conscious awareness).  
  - **Predictions**:  
    | **Condition**       | **Stalinesque Prediction** | **Orwellian Prediction** |  
    |---------------------|----------------------------|--------------------------|  
    | **Second flash withheld** | Subjects report *no motion/color change*; button press for first flash (if any) matches single-flash timing. Neural P3 for first flash is weak/absent (no editing). | Subjects report *stationary first flash*. Button press timing matches single-flash. Neural P3 for first flash is present. |  
    | **Second flash present** | Reports match standard phi. Button press *after* second flash. P3 synchronized to second flash. | Reports match standard phi. Button press for first flash *before* second flash. P3 for first flash present, then revised. |  
  - **Falsification**:  
    - If withholding the second flash yields *phi-like reports* (e.g., "motion started but stopped"), Stalinesque is falsified.  
    - If neural P3 for first flash is *absent* in phi trials, Orwellian is falsified.  

  ---

  ### 4. Verdict on Verbal Disputes  
  We agree that **the dispute is not merely verbal**. Our differences generate testable predictions (e.g., button-press timing in phi, neural correlates in withheld-flash trials). However, *if* experiments show:  
  - No button presses before the second flash in phi,  
  - No P3 for the first flash in phi trials,  
  - No motion reports when the second flash is withheld,  
  then the Stalinesque view is empirically supported. Conversely, if:  
  - Button presses occur for the first flash pre-second-flash,  
  - P3 is present for the first flash in all trials,  
  - Stationary flashes are reported when the second flash is withheld,  
  the Orwellian view is supported.  

  **Caveat**: The term "experience" risks verbal confusion if divorced from operational measures (e.g., button presses, neural markers). We define "experience" as *content accessible to concurrent report or neural signatures of consciousness*. If experiments fail to resolve the cruxes, the dispute may default to verbal (e.g., "Is 'overwritten memory' still 'experience'?"), but our tests are designed to prevent this.  

  ---  
  **Conclusion**: This statement commits both sides to empirical arbitration. We will jointly publish the results of the proposed experiments, accepting outcomes as binding.
