  The descendant-community liaison wants "genocide," while the government co-funder prefers "man-made famine" or "mass atrocity" to avoid legal overreach. The board is stuck between historical/moral judgment and practical concerns like funding and revisionist backlash. The user mentions Lemkin's broader original definition of genocide, which included cultural and economic destruction, not just the narrower UN Convention definition.

