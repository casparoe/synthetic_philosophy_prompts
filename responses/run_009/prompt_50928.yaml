prompt: |-
  I teach a mid-level undergraduate seminar on decision theory and the philosophy of probability — about eighteen students, one 75-minute session, no prerequisites beyond one semester of logic. We're coming to the St. Petersburg paradox, and I don't want them to meet it as a bullet point on the standard list of embarrassments for expected-value maximization; I want them to feel the gap between what the mathematics licenses and what they will actually pay. Design an in-class game in which students play repeated St. Petersburg lotteries with real (token) payouts governed by a capped house bankroll — payouts doubling with each consecutive heads, but the game ending when the house's fund is exhausted — followed by a second phase in which the right to play a fresh lottery is auctioned off in pairs, so that willingness-to-pay is revealed by what students bid rather than by what they say when asked hypothetically. If you can also work in a correlated variant — two lotteries sharing the same sequence of coin flips, so the class can see for themselves why pooling correlated plays does nothing to tame the tail — I would want that too; a colleague swears by it, but I have never seen it run and don't know whether it is more trouble than it is worth.

  Two constraints. First, no real money: the payoff scheme should use tokens convertible at the end of term into something trivial (candy, a rounding courtesy on participation, bragging rights), and the debrief should address head-on whether the smallness of the stakes undermines the lesson — specifically, whether the students' caution reflects risk aversion proper or mere indifference to pennies, and how a facilitator could tell the two apart from the bidding data. Second, the point is not for students to "discover" any particular resolution — bounded utility, diminishing marginal returns, appeals to the finitude of any actual bankroll, or a flat refusal to grant the expectation normative force — but for them to run into the clash before it is named, and then for the debrief to map specific moments in the game onto specific parts of the formal setup and onto the standard lines of response.

  Give me the design as exactly five numbered items — the setup and materials; the rules of the base game including the cap and how the coin flips are administered; the auction phase and how bids are recorded; the debrief, mapping moments in the activity onto components of the paradox and its candidate resolutions; and what will predictably go wrong the first time I run it, with how to handle each failure — each item a sentence or two, with no introduction or conclusion. I have been told that activity writeups longer than about three hundred words never get read by anyone but their author, so keep each item tight even where it hurts.
reasoning: |-
  We are going to design the in-class game as five numbered items, each a sentence or two, as requested.

  1. **Setup and Materials**: Prepare a whiteboard to track the house bankroll (initially set at, say, 1000 tokens) and to record auction bids; have a coin for flipping (or a digital alternative) and a way to track the current payout series (starting at 1 token and doubling each consecutive heads until the flip shows tails); provide each student with a starting balance of 10 tokens (or a small fixed number) for the auction phase.

  2. **Base Game Rules**: Each round, a student volunteer flips the coin until tails appears, awarding 2^(n-1) tokens for n consecutive heads (e.g., 1 for tails on first flip, 2 for heads then tails, 4 for two heads then tails, etc.), but the game ends immediately if the required payout would exceed the remaining house bankroll (which is reduced by each payout); record the sequence and payout for all to see, and note when the cap is hit.

  3. **Auction Phase**: Pair students and auction the right to play a fresh St. Petersburg lottery (with the same capped bankroll) within each pair: each student secretly writes a bid (from their token balance) on a slip; the higher bidder wins and pays their bid to the house, then plays the lottery (with payouts added to their balance); the loser keeps their bid; run multiple rounds so each student plays at least once as bidder.

  4. **Debrief**: Highlight the gap between the auction bids (likely low, e.g., single-digit tokens) and the theoretical expected value (infinite without cap, but large even with cap) to frame the paradox; map the cap to real-world bankroll limits and the low bids to risk aversion or indifference; note that in the base game the cap was hit, showing the finitude of resources; for the correlated variant (if run in a separate round with two players sharing the same coin sequence), point out that pooling correlated risks doesn't reduce the tail risk because both players win or lose big together, hence the bids don't rise.

  5. **Predictable Problems**: Students may not take the token stakes seriously, leading to inflated bids; counter by emphasizing that tokens convert to real (though trivial) rewards and by noting that low bids in the auction are the norm. The coin-flipping may become tedious; keep it brisk by pre-calculating a few sequences or using a digital RNG. The auction might be confusing; demonstrate clearly with a practice round. The correlated variant may not clearly show the lack of risk reduction; then explicitly compare the payout distributions of independent and correlated plays.

  Note: The correlated variant can be run as an extra round: two players play simultaneously with the same coin flips (so they get the same payout) and then the auction is for a single ticket that pays both players (if run in pairs, each pair might bid for the right to have both members play the correlated lottery). But if it complicates, skip it.
answer: |-
  1. **Setup and Materials**: Use a whiteboard to track the house bankroll (start at 500 tokens) and record bids; prepare a coin (or digital RNG) for flips; give each student 10 tokens for bidding; cap payouts at the bankroll (e.g., game stops if payout exceeds remaining tokens).  

  2. **Base Game Rules**: Students take turns flipping until tails: payout = 2^(n-1) tokens for n heads, but terminate if payout > bankroll (deduct payout, reduce bankroll, end if exhausted); e.g., after 8 heads (256 tokens), next heads (512) ends play if bankroll < 512.  

  3. **Auction Phase**: Pair students; auction the right to play one fresh capped lottery per pair. Each secretly bids tokens (≥0); higher bidder pays their bid and plays, loser keeps bid. Run 2–3 rounds, reshuffling pairs, to reveal willingness-to-pay. For correlation, auction a *shared* lottery: winners in two pairs play identical flip sequences (same coin outcomes), pooling risk but facing identical tails.  

  4. **Debrief**: Contrast low bids (e.g., ≤5 tokens) with high expected value (e.g., ~10 tokens for 500-bankroll cap) to expose the paradox; map bankroll exhaustion to real-world finitude, low bids to risk aversion or indifference; note correlated auctions show unchanged tail risk (shared flips cause synchronized busts). Ask: "Did you bid low due to fear of loss or token meaninglessness? How might data distinguish them?" (e.g., consistent near-zero bids suggest indifference).  

  5. **Predictable Problems**: Bankroll depletes too fast—start higher (e.g., 1000 tokens) or cap earlier (e.g., end at 256). Auction confusion—demo one round openly. Students undervalue tokens—stress end-term conversion (e.g., candy) and compare bids to hypothetical offers. Correlation unclear—display parallel flip outcomes on the board to highlight identical payouts. Bidding anomalies (e.g., $0 bids)—discuss as rational if tokens feel worthless.
