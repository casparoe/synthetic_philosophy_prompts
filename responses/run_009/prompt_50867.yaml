prompt: |-
  I've been having this running argument with my housemate about statues and street names and renaming things, and I've noticed my own gut verdicts are kind of a mess, so I want to lay them out and see if there's an actual principle in there. Confederate general on a courthouse square, put up in the early 60s pretty obviously as a message to Black residents: take it down, no hesitation. A statue of a similarly awful guy that's been sitting in a city museum for a century as an artifact of the era: I'd leave it, maybe with better labeling. A street named after a town founder who turned out to have made his fortune in the slave trade: rename it, the disruption to businesses is real but not decisive. The same founder's name on a mountain that locals have called by his name for 150 years, where basically nobody even remembers there was a person: here I weirdly resist renaming, even though it's the same honoring mechanism, just worn smooth. A Nobel-winning chemist whose private letters reveal he held racist views: keep his name on the lecture hall. The same chemist, except it turns out his famous experiments were run on unwitting human subjects: strip his name off everything.

  Then there are the two that really bother me. Ordinary soldiers' gravestones in an old Confederate cemetery: I want those left alone, removing them feels like desecration, even though I was happy to remove the courthouse statue and both are ways of marking the dead. And a donor's name on a business school building, where the donor is later convicted of massive fraud: rename instantly, I don't even have to think about it — which is strange, because the building name was never an endorsement of his character, just a thank-you note for money, so why is that the easiest case in the whole list while the racist chemist stays up?

  So: is there one principle, or maybe a couple, that generates all of these? Something about who's being honored and for what, or about what the name has become vs. what it started as, or about time and uptake? I'd like you to state the principle (or candidate principles) precisely enough that I could apply it to new cases, tell me which of my verdicts it just cannot save and should overturn rather than patch with ad hoc clauses, and then run it on a few cases I haven't mentioned: whether a theorem should stop being named after a mathematician who did something bad, whether renaming an entire college is the same as renaming one building of it, and what to do with a town that's fully absorbed a bad founder's name into its identity. Please write in continuous prose only, no headings or bullet points or anything like that — just plain paragraphs like an email.
reasoning: |-
  Okay, let me try to unpack the user's query. They're struggling with inconsistencies in their gut reactions to renaming and statue removal cases. They listed several scenarios, each with different outcomes, and are looking for underlying principles. 

  First, I notice their examples cluster around a few themes: the original intent (e.g., the 1960s Confederate statue vs. museum artifact), current social meaning (mountain name worn smooth vs. street name), and the nature of what's honored (achievement vs. character). The gravestones and fraudster donor cases seem particularly sticky for them.

  Hmm, the emotional weight of desecration versus mere endorsement stands out. Gravestones feel sacred while a building name is transactional. That might point to a "domain" factor - whether the marker belongs to the commemorative or functional realm. Also, the fraud case involves ongoing harm (reputation risk to the school) versus historical racism that's already contextually understood.

  The user's hidden ask seems to be for moral consistency. They're uncomfortable that their instincts don't align neatly. Maybe they're also wrestling with how much society should overwrite history versus preserve it as-is. The college renaming example they want tested suggests concern about scale - does changing one building versus the whole institution alter the moral calculus?

  For principles, I'm considering: 1) Purpose of the marker (commemoration vs. utility) 2) Current social meaning vs. original intent 3) Domain (sacred space like graves vs. functional space) 4) Ongoing harm. The fraudster fails all - his name serves no current purpose, causes active harm, and isn't in a protected domain. The mountain name passes because its meaning detached from the person.

  But the chemist case breaks this. Achievement commemoration can tolerate private flaws but not ethical violations in the work itself. So maybe the core is whether the honor is tied to the wrongdoing. For the slave trader street name, the wealth enabling donation is directly tainted, unlike the racist chemist whose bigotry was peripheral to his science.

  The Confederate cemetery is toughest. I think the key is recognizing graves as personal memorials rather than societal endorsements. Removing courthouse statues rejects state-sponsored glorification; leaving graves respects individual mourning. The scale matters too - mass grave versus individual markers might feel different.

  For new cases: A theorem rename? Probably not - the naming honors the math, not the mathematician's character. Renaming a whole college? Harder than one building because institutional identity absorbs names differently. The town named after a bad founder? If the name's meaning has fully evolved, renaming might erase community identity without rectifying past harm.

  Biggest tension points: Their instinct to leave the chemist with racist views but remove the fraudster. Principle must explain why professional ethics violations outweigh personal bigotry in commemorative contexts. Also why business disruption matters for streets but not for mountains - probably because street names are administrative tools while place names are cultural artifacts.

  Need to stress that no principle will be perfect because these judgments involve communal meaning-making, which is messy. But we can find patterns that make our choices more consistent than they first appear.
answer: |-
  Here's how I'd synthesize your intuitions into a coherent principle, test its edges against your examples, and apply it to new cases:

  The core principle seems to be: **The permissibility of removing a name or monument depends on whether its *dominant present function* is to *actively honor the specific objectionable aspect* or person *as a moral exemplar*, weighed against the *current communal meaning* of the marker and the *practical harm* caused by removal.**

  Let's break this down with your judgments:
  1.  **Confederate Statue (Courthouse):** *Remove.* Dominant function is explicit, recent, state-sponsored honor of a white supremacist cause. Practical harm minimal. Current meaning is contested and harmful.
  2.  **Awful Guy (Museum):** *Keep with context.* Function shifted from honor to historical artifact/education. Removal destroys historical evidence without clear gain. Current meaning is contextualized.
  3.  **Slave Trader (Street):** *Rename.* Function remains nominal honor of the individual. Practical harm (business disruption) exists but is outweighed by the harm of honoring the foundational injustice. Current meaning is still tied to the person.
  4.  **Slave Trader (Mountain):** *Keep.* Dominant function shifted: it's primarily a *geographic identifier*. The "honor" aspect is eroded; the name signifies the place, not the person. Removal causes significant communal disruption (loss of familiar identity) without effectively countering past injustice. Current meaning is topographic.
  5.  **Racist Chemist (Lecture Hall):** *Keep.* The honor is tied *specifically to his scientific achievement*, not his private, reprehensible views. The dominant function is to recognize scientific contribution. Removal severs the link to the *achievement* being honored.
  6.  **Unethical Chemist (Lecture Hall):** *Remove.* The objectionable acts (*how* he achieved his results) are inextricably linked to the achievement itself. Honoring the achievement inherently honors the unethical methodology. The specific grounds for the honor are tainted.
  7.  **Confederate Gravestones:** *Leave.* The dominant function is *memorializing the dead as individuals*, not honoring their cause *as exemplars for the living*. It's personal commemoration, not public valorization. Removal feels like desecration because it attacks the memorial function. Current meaning is primarily about loss and burial.
  8.  **Fraudster Donor (Building):** *Rename Instantly.* The honor is explicitly transactional but implies institutional association and endorsement of the *benefactor*. The specific grounds for the honor (generosity) are fundamentally undermined by the fraud (the source of the wealth/morality is poisoned). The ongoing association causes active reputational harm to the institution. Current meaning is toxic association.

  **Where your principle struggles and needs refinement (or where your verdict might need reconsidering):**

  *   **The Confederate Gravestones vs. Courthouse Statue:** Your principle *mostly* holds: gravestones memorialize individuals, the statue valorizes a cause and its leadership. The "active honor as moral exemplar" applies to the statue, not the individual graves. However, a *massive, prominent Confederate monument in a cemetery glorifying the cause* might challenge this distinction, leaning closer to the courthouse statue. Your intuition likely hinges on the *individuality* and *primary purpose* (burial marker vs. political statement) of the graves.
  *   **The Fraudster Donor vs. Racist Chemist:** This highlights the "objectionable aspect linked *to the grounds for honor*" clause. The fraud directly destroys the reason for the honor (philanthropy derived from ill-gotten gains, implying bad character). The chemist's racism, while vile, is *extrinsic* to the scientific achievement being honored. The unethical experiments are *intrinsic*. This distinction is crucial. The ease of renaming the donor also stems from the transactional nature – it's a contract easily voided when the terms (implied good standing) are breached, unlike honor for inherent achievement.

  **Applying the Principle to New Cases:**

  1.  **Theorem Named After a Mathematician Who Did Something Bad (e.g., private misconduct unrelated to the math):** *Keep the name.* The naming convention honors the *specific intellectual contribution* (the theorem), not the mathematician's character. The dominant function is identification within the field. Renaming causes significant academic confusion with minimal gain in justice. (Analogy: Racist Chemist). *If the misconduct involved plagiarism of that specific theorem, renaming would be justified* – the achievement itself is tainted (Analogy: Unethical Chemist).
  2.  **Renaming an Entire College vs. One Building:** *Renaming the whole college is vastly harder and requires a stronger case.* The college name is deeply woven into institutional identity, alumni connection, history, and community. Its dominant function transcends the founder to represent the *institution itself*. Renaming one building is significant but less existentially disruptive to communal identity. Renaming the whole college would only be justified if the founder's objectionable aspect (e.g., being a primary architect of genocide) is so central that the name *cannot* escape being an active honor of profound evil, outweighing the immense communal cost. (Analogy: Mountain name, but with much higher stakes due to institutional identity).
  3.  **Town Whose Name is Fully Absorbed from a Bad Founder:** *Generally, do not rename.* Like the mountain, the dominant function has shifted entirely to *place identification*. The "honor" is vestigial. The name signifies the community, its people, and its shared history – not the founder. Renaming severs this hard-earned communal identity, causes massive practical disruption (addresses, records, business identities, local pride), and doesn't effectively rectify past injustice. Better to invest in contextualizing the history. Only if the name itself is an *explicitly offensive word or phrase* (not just a personal name) might renaming be clearly justified on grounds of present harm. (Analogy: Mountain name).

  The principle isn't mechanical; it requires judgment about "dominant function," "linkage," and "communal meaning." But it explains the patterns in your intuitions: shifting meaning over time, the importance of *what* is being honored and *why*, the distinction between memorializing and valorizing, and the weight of practical disruption against the harm of ongoing, active honor for objectionable deeds or traits. It prioritizes the present social meaning and function over original intent alone.
