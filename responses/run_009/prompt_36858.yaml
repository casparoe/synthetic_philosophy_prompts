answer: |-
  # MoralMatch™ Help Center

  **Welcome to MoralMatch™! Where your values find their value™.**

  **Getting Started**

  *   **Q: How do I set up my Moral Inventory?**  
      A: Simply navigate to your Ethics Ledger and list the moral positions you're willing to trade. Be specific! Instead of "Environmental Concerns," try "Willingness to reduce plastic use by 50% (Units: kg/week)" or "Opposition to factory farming (Units: # of meat-free meals subsidized)." Our Quantification Engine™ will help assign initial Moral Units (MUs) based on perceived societal weight and your stated intensity. Remember, granularity unlocks trading potential!

  *   **Q: I care deeply about animal welfare but find abstract art debates exhausting. How do I find good trade partners?**  
      A: Excellent! You've identified the core synergy of MoralMatch™. We recommend using our "Value Gap Finder" tool. Activate the "Maximize Disparity" filter to connect with users whose Moral Inventories show minimal overlap with yours. Someone who passionately defends public funding for avant-garde performance art but finds veganism "a bit much" could be your perfect counterparty! Befriend users with wildly different priorities – that's where the real surplus is created!

  **Making Your First Trade**

  *   **Q: I offered 200 MUs of "Supporting Local Bookstores" to a user in exchange for 150 MUs of their "Reducing Air Travel." They countered demanding 250 MUs. How do I know this is fair?**  
      A: MoralMatch™ facilitates dynamic discovery of exchange rates based on real-time supply, demand, and user negotiation! Think of it as the market finding the true "moral opportunity cost." Our app displays comparative benchmarks (e.g., "Similar trades settled at 180-220 MUs"). Ultimately, fairness is determined by mutual agreement. Trust the process! If uncertain, consult our optional Moral Arbitrage Advisor™ (Premium feature).

  *   **Q: I found someone willing to donate $50 to wildlife conservation if I stop eating avocados (citing water usage). How do I formalize this?**  
      A: Congratulations on finding a match! Navigate to the "Propose Swap" screen. Select your "Commitment to Avocado Abstinence" from your inventory – you'll need to quantify the duration (e.g., "1 year = 500 MUs"). Select their "Wildlife Conservation Donation ($50 = 500 MUs based on our Philanthropy Conversion Index)". Set an enforcement period. Both parties digitally sign the Moral Contract™. Easy!

  **Troubleshooting**

  *   **Q: I traded away my "Objection to Fast Fashion" commitment for 6 months in exchange for someone planting 100 trees. Now I feel guilty seeing a shirt I like… can I reverse the trade?**  
      A: We understand Post-Trade Moral Remorse (PTMR) can occur. Unfortunately, executed contracts are binding for the agreed duration to maintain platform integrity. However, you have options! 1) You could *purchase* back your "Objection to Fast Fashion" commitment from the original counterparty or another user holding a similar position, likely at a premium reflecting your renewed demand. 2) Consider our "Conscience Escrow™" service (Premium Plus) for future trades, which holds your MUs in reserve for 72 hours post-agreement, allowing for cooling-off reflection before commitment locks in.

  *   **Q: My trade partner promised to volunteer at a homeless shelter but never went! I upheld my end (gave up coffee). What now?**  
      A: This is Counterparty Non-Performance. Please file a dispute via the "Enforcement Portal." Our verification team will request evidence (e.g., shelter logs). If the breach is confirmed, the non-performing user's account will be debited the MU value of the commitment *plus* a 15% platform integrity fee. You will receive MU credit equivalent to your loss. Repeated offenses lead to account suspension. We recommend trading only with users holding a high Moral Credit Score™.

  **Account Limits & Premium Tiers**

  *   **Q: Why is there a limit on how many "Opposing Fossil Fuel Subsidies" MUs I can list? I feel VERY strongly!**  
      A: Account limits prevent market flooding and ensure MU stability. Free accounts have standard MU caps per commitment category. Upgrade to MoralMatch™ Pro ($9.99/month) for expanded inventory limits, advanced Value Gap Finder analytics, and access to high-value counterparties. Pro Plus ($19.99/month) includes priority dispute resolution, Conscience Escrow™, and the ability to trade "Meta-Commitments" (e.g., "Willingness to change core beliefs under specific negotiation conditions").

  *   **Q: I tried to list "My neighbor's right to quiet enjoyment of his property" as a tradeable asset (I find his wind chimes annoying, another user hates barking dogs). Why was it rejected?**  
      A: Our platform strictly facilitates trade involving commitments that are the *user's own* to make. Third-party rights or welfare cannot be listed as inventory, as they are not yours to exchange. The listing "My Neighbor's Quiet Enjoyment" was invalid because the commitment required would fundamentally belong to your neighbor, not you. Please only list commitments directly under your personal control or influence.

  *   **Q: I listed "Opposition to Paywalled Academic Journals" (1000 MUs) for trade. During negotiation, I realized I actually still strongly believe in it and don't want to trade it away. But the offer is really good! What happens if I cancel?**  
      A: Discovering the true depth of a commitment mid-negotiation is common! While you can withdraw a listing *before* a contract is signed, frequent withdrawals negatively impact your Moral Credit Score™, signaling potential volatility to counterparties. MoralMatch™ Pro users face only a minimal score impact. Consider if the offered MUs could be used to acquire a commitment you value *even more* – sometimes strategic de-prioritization unlocks greater net moral gain! It's all about portfolio optimization.

  *   ***Q: Help! I just received a notification that a trade I forgot about executed: I traded away "Scruples regarding minor workplace dishonesty" years ago for extra "Recycling Vigilance" MUs. I didn’t think I had any of those scruples left to trade, but apparently I did… and now I feel unexpectedly terrible about fudging that timesheet. What do I do?***  
      ***A: This is our most frequently received support request. We recommend reviewing your active Moral Contracts™ regularly. You can attempt to re-acquire the traded commitment on the open market. Alternatively, our Moral Liquidity Booster™ package (Pro Plus) includes access to therapists specializing in post-trade cognitive dissonance and rapid MU liquidity solutions. Remember, self-discovery is a journey!***
