  First, I need to recall the core argument: rationality is about selecting dispositions, not acts. The hitchhiker who pays is rational because they chose a disposition (character-style commitment) that ensures survival, even though paying itself seems irrational in the moment. Key distinctions: insurance-style (external devices) vs. character-style (internal traits) commitment, and the chapter's novelty lies in this separation.

  Now, assessing the audience:
  - Causal decision theorists (CDT) will likely attack the act/disposition distinction and worry about dispositions "swallowing" rationality.
  - The evidentialist might argue that character-style commitment relies on evidential reasoning.
  - Economists will focus on commitment devices and renegotiation, questioning if external contracts make the case irrelevant.
  - The Kantian will object to morality based on self-interest and detection fears.

  Prioritizing objections by damage:
  1. **CDT's concern about act/omission distinction**: If disposition selection overrides act rationality, does that make any act rational? High damage if fumbled.
  2. **Economists on contracts**: If contracts exist, the case dissolves; without them, it's self-deception. Crucial for practical relevance.
  3. **Evidentialist smuggling**: Accusation that character commitment depends on evidential reasoning. Undermines the causal framework.
  4. **Kantian morality critique**: Building ethics on fear of detection ignores duty. Could alienate the moral philosopher.
  5. **CDT on diachronic inconsistency**: Why not cheat after rescue? Challenges the stability of the disposition.
  6. **Economists on renegotiation-proofness**: If dispositions can be changed, are they credible?
  7. **Kantian on value of integrity**: Is paying just self-interest, not virtue?
  8. **The "hoped nobody asks" objection**: If dispositions aren't chosen, how can they be rational? Attacks the foundation.

  For each objection, I'll draft a reply with a soft spot:
  - E.g., for CDT's act/omission: Reply that rationality shifts to disposition selection when acts are predictable. Soft spot: It might feel counterintuitive.
  - For economists: Emphasize that contracts aren't always available, and detection of character is key. Soft spot: External enforcement is common in economics.

  Lead with the character/insurance distinction as a strength to showcase novelty, but be ready to defend it under pressure. Concede that without predictability, the argument weakens, and that the Kantian has a point about richer moral concepts.

  Finally, structure the prep sheet to stay under 900 words: 8 objections × ~90 words each, plus intro and flags. Ensure it's punchy and actionable for the user's defense.
answer: |-
  ### Rational Irrationality Defense: Q&A Prep Sheet  
  *(Prioritized by damage potential; 870 words total)*  

  **Lead with character/insurance distinction**—it showcases novelty. If pressured, stress it resolves dilemmas external devices cannot. **Concede upfront**: (1) Without predictability, character commitment fails; (2) Kantians rightly demand more for *moral* worth.  

  ---

  1. **Causal Decision Theorist (CDT):** *"If dispositions absorb rationality, doesn’t this collapse the act/omission distinction? Any terrible act could be ‘rational’ if it flows from a ‘rational’ disposition."*  
     **Reply (90s):** Rationality targets *disposition selection under strategic predictability*—not acts in isolation. The hitchhiker’s payment isn’t "rational" *simpliciter*; it’s non-akratic execution of a *survival-optimal* disposition. Acts remain assessable as prudent/impulsive, but only dispositional rationality explains why the optimizer dies.  
     **Soft spot:** Distinguishing "non-akratic" from "rational" feels semantic; CDT may resist reframing.  

  2. **Economist (Commitment Devices):** *"With a contract, payment is enforceable and the case trivial. Without one, your ‘character commitment’ is self-deception—why not renege later?"*  
     **Reply (90s):** Contracts require institutions; the hitchhiker lacks these. The driver detects *intrinsic character* (e.g., via reputation or cues), making reneging impossible for the committed type. "Self-deception" misreads: the payer’s psychology is transparent—they *become* someone who values integrity *as survival insurance*.  
     **Soft spot:** Assumes reliable character detection; economists may cite low-tech enforcement (e.g., hostages).  

  3. **Evidentialist:** *"You’ve smuggled in evidential reasoning! The driver’s prediction means paying *signals* you’re trustworthy—it’s not about causal dominance."*  
     **Reply (90s):** Signaling isn’t evidential; it’s *causal* via dispositional rigidity. The driver rescues because the hitchhiker’s character *causes* payment, not because paying *provides evidence*. My model needs no acausal correlation—only predictable action.  
     **Soft spot:** Blurs if character is *observed* (evidential) vs. *causally ensured* (CDT).  

  4. **Kantian:** *"You reduce morality to fear of detection! True integrity pays *because it’s right*, not for survival."*  
     **Reply (90s):** I address *rationality*, not morality. The hitchhiker needn’t be moral—they rationally *instrumentalize* integrity to survive. Your objection targets moral philosophy; mine is meta-rationality.  
     **Soft spot:** Feels deflationary; Kantian may see this as conceding morality is irrational.  

  5. **CDT (Diachronic Inconsistency):** *"If rationality is dispositional, why not ‘temporarily’ adopt commitment, then defect? Gauthier’s renegotiation problem!"*  
     **Reply (90s):** Dispositions aren’t chosen moment-by-moment; they’re costly to change. The hitchhiker who *could* discard commitment after rescue wouldn’t be rescued—the driver predicts *stable* traits.  
     **Soft spot:** Requires perfect dispositional inertia; hard to prove empirically.  

  6. **Economist (Renegotiation-Proofness):** *"If dispositions are flexible, why wouldn’t the driver renegotiate post-rescue? Your equilibrium isn’t credible."*  
     **Reply (90s):** Renegotiation fails here: the driver gains nothing from coercing payment (money is valueless to her), and the hitchhiker’s character *fixes* his response. Unlike repeated games, this is one-shot with *identity* as commitment.  
     **Soft spot:** Assumes driver indifference; if she values money, coercion *could* arise.  

  7. **Kantian (Value of Integrity):** *"Calling integrity ‘rational insurance’ strips it of value. Rationality shouldn’t demand becoming a tool of your own past self!"*  
     **Reply (90s):** Instrumental integrity *is* shallow—but rationality isn’t about depth. We *do* become "tools" of past decisions (e.g., saving for retirement). The hitchhiker’s survival justifies the cost.  
     **Soft spot:** Sidesteps whether rationality *should* accommodate identity fragmentation.  

  8. **The Objection You Hope Nobody Asks:**  
     **Causalist + Economist Hybrid:** *"If dispositions aren’t chosen via explicit deliberation, how can selecting them be ‘rational’? Isn’t this just post hoc rationalization of irrational traits?"*  
     **Reply (90s):** Disposition selection *is* deliberate—e.g., choosing to cultivate honesty through habit. The hitchhiker-type *could* practice integrity pre-crisis (e.g., in smaller interactions) to build a survival-beneficial trait. Rationality doesn’t require moment-by-motion choice.  
     **Soft spot:** Risks circularity: "rational" disposition-building may itself require prior commitments.  

  ---

  ### Concession Flags (One Sentence Each):  
  - **Predictability necessity:** "If the driver couldn’t detect character, my argument fails—rationality *would* demand momentary defection."  
  - **Moral minimalism:** "Yes, this reduces integrity to instrumental value; Kantians are right that richer moral concepts exist."  

  **Format Note:** Rehearse replies at 90s each; use the character/insurance divide early to preempt hybrid-theory objections. If economists dominate, stress "detection, not contracts" as the innovation. Good luck!
