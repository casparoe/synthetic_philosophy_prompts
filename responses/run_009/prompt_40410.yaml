  Okay, let me try to unpack this user's query. They're pointing out a contradiction in how literary editors handle authorial intention. On one hand, they ignore authors' wishes about destroying unpublished works, like Kafka wanting his manuscripts burned. On the other hand, editors meticulously debate manuscript variants, treating authorial intent as sacred for the text itself. 

  Hmm, the user is asking what theory of textual meaning this implies. They wonder if it's intentionalism about the work but not the corpus. Or maybe something else entirely? They also question whether a consistent intentionalist could justify publishing against the author's wishes. Like, is destroying the manuscript an act of interpretation we can ignore? And why care about restoring the poet's intended words if we're okay overriding Kafka's clear directive?

  First, I need to recall different theories of interpretation. Intentionalism says meaning comes from the author's intent. New Criticism argues the text stands alone. Poststructuralism sees meaning as unstable. But the user's example shows a mix: disregarding the author's wish about the work's existence while obsessing over textual details. That's interesting.

  So why do editors do this? For the corpus decision, maybe it's about cultural value. Kafka's work is too important to lose. But for textual variants, accuracy to the author's creation matters. But isn't that inconsistent? The user's point is spot-on. 

  Could a consistent intentionalist defend publishing anyway? Maybe by arguing that Kafka's intent was conflicted—entrusting Brod implies some trust. Or that the destruction intent is separate from the work's meaning. But that seems shaky. The deeper issue is the work's autonomy. Once created, it belongs to culture. So the meaning is in the text, not the author's afterthoughts. But then why fuss over a printer's error? Because that corrupts the work itself, whereas not publishing denies its existence entirely. 

  Also, there's a practical angle: unpublished works can be studied, but a corrupted text misleads. Still, the user's question about why we prioritize one intent over another needs addressing. The answer might lie in different kinds of authorial intentions. Destroying the manuscript is a performative act, while writing is creative. Editors prioritize the creative intent embedded in the text. 

  But the user's last point hits hard: if we override Kafka, why care about the poet's exact words? The key difference is the nature of the intention. Letting the work exist allows engagement; textual accuracy ensures we engage with the actual creation, not errors. But that requires seeing the text as having its own status, somewhat independent of the author's wishes about its existence. 

  In conclusion, this practice suggests a hybrid theory: meaning is in the text as the author created it, but the work's survival depends on cultural value. So intentionalism for textual details, but not for the corpus. It's not entirely consistent, but it balances respect for creation with cultural preservation. The user's insight reveals the tension, and the answer lies in distinguishing between the work's existence and its accurate representation.
answer: |-
  That's a brilliantly sharp observation pinpointing a deep, often unspoken contradiction in editorial practice. You've perfectly captured the tension: **radical disregard for the author's *existential* intention (whether the work should exist at all) combined with near-fetishistic reverence for the author's *textual* intention (the exact words on the page).** This inconsistency reveals a complex, hybrid theory of textual meaning and value, not a pure intentionalism.

  Here's a breakdown of the presupposed theory and its implications:

  1.  **The Underlying Theory: A Split Concept of Authorship & Textual Ontology:**
      *   **The Work vs. The Corpus:** Editors implicitly treat the *individual work* as an artifact whose meaning is fundamentally tied to the author's creative act at the moment of inscription. The "final" or "authorized" text represents the author's *achieved meaning*. Altering it (e.g., with printer's errors) distorts the artifact itself. This leans towards **moderate intentionalism** or **hypothetical intentionalism** for the *meaning within the text*.
      *   **The Corpus as Cultural Property:** The decision over *whether* a work exists in the public sphere (publication/destruction) is treated as separable from the work's *inherent meaning*. Once created, the work possesses **cultural value independent of the author's wishes regarding its survival.** The author's role as creator doesn't grant them absolute sovereignty over the work's existence after creation; it becomes part of a shared cultural heritage. This leans towards **reader-response** or **cultural-value** theories regarding the work's *existence* and *availability*.
      *   **The Text as Autonomous Entity:** Crucially, this practice presupposes that the *meaning* of the text, once created, resides *in the text itself* as an artifact. The author's *later* wish to destroy it doesn't retroactively erase the meaning or value embedded in the artifact during its creation. Destroying it prevents access to that meaning, but doesn't change what the meaning *was* or *is* (if preserved). The text has a kind of **autonomy** after creation.

  2.  **Could a Consistent Intentionalist Defend Publishing Anyway?**
      A *pure* intentionalist, arguing meaning is *solely* derived from the author's conscious intentions, faces a serious challenge:
      *   **The "Final Act" Argument:** One could *try* arguing that the destruction wish *is* the author's final, definitive interpretive act, declaring the work meaningless or unwanted. Ignoring this overrides the ultimate authorial intention governing the work's significance. A pure intentionalist would struggle to justify publication.
      *   **Weak Defenses for Intentionalists:**
          *   **Conflicted Intentions:** Point to the author entrusting the decision to a specific person (Brod) who knew them intimately, suggesting the instruction wasn't absolute or reflected ambivalence.
          *   **Intention vs. Value:** Argue the author's *assessment* of the work's value (leading to the destruction wish) can be wrong; the work's *intrinsic meaning/value* (created by their prior intention) persists regardless.
          *   **Different Kind of Intention:** Distinguish *creative* intention (embedded in the text) from *dispositional* intention (what to do with the object). Only the former is relevant to meaning.
      *   **Conclusion:** A *consistent pure intentionalist* would find it very hard to justify publication against explicit destruction wishes. The common practice suggests editors are *not* pure intentionalists regarding the work's existence.

  3.  **Why Override Existential Intent But Obsess Over Textual Intent? The Editing Rationale:**
      This is where the split theory becomes operational:
      *   **Overriding Destruction (Existential Intent):** "The work, as created, possesses inherent cultural, historical, or aesthetic value that transcends the author's personal wish for its oblivion. Destroying it is a permanent loss *to culture*, not just to the author. Preserving it allows future generations to engage with the meaning *the author put into it* during creation."
      *   **Obsessing Over Variants (Textual Intent):** "Our duty, once the decision to preserve/publish is made (based on cultural value), is to present the artifact *as the author created it*. Printer's errors, later unauthorized revisions, or compositor's mistakes introduce *noise* that obscures the author's intended expression and the authentic artifact. Restoring the author's words is respecting the creative act and ensuring readers engage with the *actual work*, not a corrupted version."
      *   **The Core Justification:** **The author's creative act during writing is sacrosanct; their administrative act regarding disposal is not.** The *value* justifying preservation lies in the meaning embedded at creation. Presenting a corrupted text defeats the purpose of preserving that valuable meaning. If we publish a text full of compositor errors, we haven't truly preserved *Kafka's work*; we've preserved a damaged facsimile.

  4.  **Where This Leaves Editing:**
      *   **Editing as Recovery & Access:** Editing becomes the act of *recovering* and providing *access* to the author's creative achievement (the textual intent) *despite* their wishes about the work's existence.
      *   **Scholarly Imperative:** The editor argues: "If we *are* going to make this culturally valuable work available (against the author's existential wish), we have an ethical and scholarly obligation to make it available *in its most authentic form*, true to the author's creative moment. Publishing a corrupted text is a *second* violation – first by publishing at all, second by publishing a distortion."
      *   **Pragmatic Distinction:** There's also a pragmatic difference. Ignoring the destruction wish potentially gives us *something* valuable (the work). Ignoring textual accuracy gives us a *flawed version* of the thing we went to the trouble of preserving/publishing. Accuracy matters *because* we value the work.

  **Conclusion: The Presupposed Hybrid Theory**

  The practice presupposes a **split theory**:

  *   **Regarding Meaning (Textual Intent):** Moderate Intentionalism/Hypothetical Intentionalism/Textual Autonomy. Meaning is fixed by the author's creative act at inscription and resides in the text. Later authorial acts don't change *that* meaning.
  *   **Regarding Existence/Publication (Existential Intent):** Cultural Value Theory/Reader-Response (regarding access). The decision to make a work part of the public cultural sphere is based on its perceived value to readers, scholars, and culture, overriding the author's wish for suppression. The work is seen as possessing value independent of the author's *later* valuation.
  *   **Regarding the Text Itself:** A form of Textual Autonomy. The created text is an artifact with inherent properties (meaning, structure) established at creation. Its *survival* is a separate question from its *constitution*.

  This isn't perfectly consistent from a pure theoretical standpoint, but it reflects a practical, deeply ingrained scholarly ethic: **Preserve culturally significant artifacts, and when you present them, present them as accurately as possible according to the creator's original design.** The author's word is law *within* the text, but not *over* the text's existence in the world. The tension you identify is real, highlighting the complex relationship between creator, creation, and culture.
