          LR = [P(E|A) / P(E|not-A)] = [q/(1-q)] * [(1-P_old(A))/P_old(A)]
     - Then we update by: P_new(A) = [P_old(A) * LR] / [P_old(A)*(LR-1)+1] ... but note that this is just Bayes applied to the virtual evidence. This method is used in Bayesian networks (as virtual evidence) and in some AI systems.

