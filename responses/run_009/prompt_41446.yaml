  We are to design desiderata (requirements) for an update rule that handles uncertain evidence. The rule should be applicable when evidence is not certain (e.g., "the shipment left port with 65% confidence"). We then evaluate several candidate update rules against these desiderata.

  Key desiderata (with explanations and load-bearing status):

  1. **Reduction to Conditioning (D1)**:
     - **Statement**: When the evidence is certain (i.e., we learn an event with probability 1), the update rule must reduce to ordinary Bayesian conditioning. When the evidence is uninformative (i.e., does not change the probabilities of the events in question), the update rule should leave the probabilities unchanged.
     - **Why**: This ensures compatibility with standard Bayesian updating in the special case of certain evidence and avoids unnecessary changes when no new information is present.
     - **Load-bearing**: Yes. Without this, the rule would not generalize standard Bayesian updating.

  2. **Commutativity (D2)**:
     - **Statement**: The order in which pieces of uncertain evidence are applied should not affect the final probability distribution (i.e., the update rule should be commutative when evidence is independent of the order of application).
     - **Why**: In real-world scenarios, evidence may arrive in any order, and the final belief state should be consistent regardless of the order. This avoids the "communativity problem" (as in Jeffrey conditioning).
     - **Load-bearing**: Highly desirable, but note that it might be difficult to achieve without additional constraints. Some argue that order-dependence can be rational in some contexts, but for a tool, we want consistency.

  3. **Partition Invariance (D3)**:
     - **Statement**: The update rule should not depend on how the evidence is partitioned. That is, the same evidence (with the same probabilistic content) should lead to the same update regardless of how it is broken down into events for updating.
     - **Why**: Analysts may describe the same evidence in different ways (e.g., "shipment left port" vs. "shipment did not leave port"). The update should not be sensitive to arbitrary choices in framing.
     - **Load-bearing**: Yes. Without this, the rule would be arbitrary and subject to manipulation.

  4. **Principled Justification (D4)**:
     - **Statement**: The rule should have a foundational justification (e.g., Dutch book coherence, scoring rules, value of learning) rather than being an ad hoc generalization.
     - **Why**: We want the rule to be theoretically sound and not introduce irrationalities (e.g., being susceptible to Dutch books, or leading to avoidable inaccuracy).
     - **Load-bearing**: Yes. This ensures the rule is robust and rational.

  5. **Non-dogmatism (D5)**:
     - **Statement**: The rule should allow for the possibility of updating to any probability for the evidence event (i.e., it should not require that the evidence event be assigned probability 1 at any step, unless the evidence is certain).
     - **Why**: We are dealing with uncertain evidence, so the rule must accommodate any probability for the evidence event (e.g., 65%).
     - **Load-bearing**: Yes. This is the core problem we are addressing.

  6. **Value of Learning (D6)**:
     - **Statement**: The update should never be harmful in expectation (i.e., free evidence should not lead to a worse expected loss).
     - **Why**: This ensures that analysts are always better off (or at least not worse off) by incorporating new evidence, which is a fundamental property of rational updating.
     - **Load-bearing**: Highly desirable, but note that this might be covered by a Dutch book argument.

  Note: There is a known tension between commutativity (D2) and partition invariance (D3) in the literature. Jeffrey conditioning satisfies D1 and D5 but fails D2 (order-dependence) and D3 (partition dependence). Field conditioning (a fix) achieves commutativity but may violate other desiderata.

  Candidates to consider:

  1. **Naive Conditioning**:
     - Approach: Condition on the evidence event as if it were certain (i.e., set the probability of the evidence event to 1 and update by conditioning).
     - Critique: This ignores the uncertainty in the evidence and can lead to overconfidence.

  2. **Jeffrey Conditioning** (the incumbent):
     - Approach: Update by redistributing probabilities proportionally within each part of a partition defined by the evidence.
     - Example: If the evidence assigns a new probability q to event A (and 1-q to not-A), then for any event B, the updated probability is P_new(B) = q * P(B|A) + (1-q) * P(B|not-A).
     - Note: Requires that the evidence specifies a partition and new probabilities for each cell.

  3. **Field Conditioning** (proposed by Field to fix commutativity):
     - Approach: Adjust the odds ratios by a factor that depends on the evidence. Specifically, for a partition {A_i}, the update multiplies the odds of each A_i by a factor and then normalizes.
     - Formula: P_new(A_i) proportional to P_old(A_i) * (Q(A_i)/P_old(A_i))^c, where c is a parameter. But Field's original idea was to use a parameter that makes the update commutative.

  4. **Probability Kinematics** (a generalization of Jeffrey's rule):
     - Similar to Jeffrey but for more general partitions. However, it still suffers from order-dependence.

  5. **Dempster-Shafer** (or other belief function approaches):
     - These handle uncertain evidence by assigning probability masses to sets of possibilities. However, they are more complex and may not reduce to Bayesian updating.

  6. **Generalized Bayesian Conditioning** (via virtual evidence/likelihood ratios):
     - Approach: Treat uncertain evidence as a likelihood ratio. For an event A, if we are told "A is true with probability q", we can interpret this as a likelihood ratio for A versus not-A of [q/(1-q)] / [P_old(A)/(1-P_old(A))]. Then update by Bayes rule with this likelihood ratio.
