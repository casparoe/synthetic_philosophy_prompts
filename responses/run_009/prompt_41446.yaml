answer: |-
  ### Desiderata for Uncertain Evidence Update Rules

  **Core Problem**: Analysts receive probabilistic evidence (e.g., "shipment left port at 65% confidence"), not certain events. Standard Bayesian conditioning requires certain evidence, so we need a principled update rule for uncertain evidence.

  #### Desiderata (Requirements)
  1. **D1: Reduction to Standard Conditioning**  
     - **Statement**: Must reduce to Bayesian conditioning when evidence is certain (P(E)=1) and leave probabilities unchanged when evidence is uninformative (P(E) unchanged).  
     - **Why**: Ensures backward compatibility with probability theory. Violating this breaks coherence.  
     - **Load-bearing**: Non-negotiable.  

  2. **D2: Commutativity**  
     - **Statement**: Sequential updates on different evidence partitions must yield the same final distribution, regardless of order.  
     - **Why**: Real-world evidence order is arbitrary; order-dependence introduces subjectivity.  
     - **Load-bearing**: Highly desirable, but may conflict with D3.  

  3. **D3: Partition Invariance**  
     - **Statement**: Updates must be invariant to how evidence is partitioned (e.g., framing "A" vs. "not A" shouldn’t change results).  
     - **Why**: Analysts describe evidence differently; outcomes should depend on information, not framing.  
     - **Load-bearing**: Non-negotiable (avoids arbitrariness).  

  4. **D4: Principled Justification**  
     - **Statement**: Must have foundational justification (e.g., Dutch book coherence, scoring rule optimization, or value-of-learning arguments).  
     - **Why**: Prevents ad hoc rules vulnerable to irrationality (e.g., Dutch books).  
     - **Load-bearing**: Non-negotiable.  

  5. **D5: Non-Dogmatism**  
     - **Statement**: Must accommodate any degree of confidence (0 < P(E) < 1) without forcing certainty.  
     - **Why**: Evidence is intrinsically uncertain; forcing P(E)=1 destroys information.  
     - **Load-bearing**: Non-negotiable.  

  6. **D6: Non-Harmfulness of Free Evidence**  
     - **Statement**: Free evidence (costless to acquire) never reduces expected accuracy/utility.  
     - **Why**: Rational agents should never ignore free evidence; violations imply update pathology.  
     - **Load-bearing**: Negotiable if computationally prohibitive.  

  **Conflicts**:  
  - **D2 (Commutativity) clashes with D3 (Partition Invariance)**: Jeffrey conditioning satisfies D3 but violates D2. Field conditioning satisfies D2 but violates D3.  
  - **D6 may conflict with simplicity**: Some rules (e.g., simultaneous MRE) satisfy D6 but are computationally heavy.  

  ---

  ### Candidate Update Rules  
  **Key Candidates**:  
  1. **Naive Conditioning**: Treat uncertain evidence as certain (e.g., condition on "shipment left" if P(E)=0.65).  
  2. **Jeffrey Conditioning**: Update by rescaling probabilities proportionally to new evidence probabilities.  
  3. **Field Conditioning**: Adjust odds ratios with a fixed exponent to enforce commutativity.  
  4. **Simultaneous MRE (Minimal Relative Entropy)**: Batch all evidence and find the closest distribution to the prior satisfying all constraints.  

