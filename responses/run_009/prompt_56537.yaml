  We are building a diagnostic quiz to expose a reader's implicit stance on beliefs using Dennett's framework without using technical terms in the questions. The quiz will have 8-10 questions, each a concrete case with 2-3 answer options. We must cover:
   - Artefacts that seem to have beliefs (like AI)
   - Purposive behavior without beliefs (like bacteria)
   - Borderline cases (thermostat, Leibniz's mill)
   - Predictive loss (superintelligence describing a friend)
   - A borderline attribution (e.g., a person who says one thing but does another)
   - Test whether confidence in mental attributions tracks predictability or something else

   We also want to identify two specific reader types: 
     Type A: grants beliefs to animals but not machines.
     Type B: grants beliefs to machines but not animals.

   And we must map answer patterns to a taxonomy including:
     - Real-pattern realism (intentional stance as real patterns)
     - Strict physicalism (eliminativism)
     - Design-stance deflationism (beliefs as shorthand for function)
     - Instrumentalism (convenient fiction)
     ... and others.

   Let's design the questions and then the scoring key.

   Question Design:

   We need to force the distinctions. We'll cover:

   1. A designed artefact that behaves intelligently (AI, chess engine)
   2. A simple organism (bacterium)
   3. A thermostat (borderline)
   4. Leibniz's mill: if you could walk inside, would you see the belief?
   5. Predictive loss: superintelligence describing a friend
   6. Borderline attribution: person who says recycling matters but doesn't do it
   7. Test confidence: when predictability and design come apart.

   We also need at least one more to fill out 8-10 and to help separate the positions.

   Let's sketch:

   Q1 (Artefact: AI): 
     Case: You're using a language model that writes convincing essays. It seems to understand the topics. When it says "I believe that Shakespeare wrote Hamlet," what's the best description?
     Options:
       A. It's just generating text based on patterns; no real belief.
       B. It has a genuine belief about Shakespeare because it was designed to process information.
       C. It has a genuine belief because it behaves as if it does.

     Note: We want to see if they attribute belief to a machine.

   Q2 (Simple organism: bacterium):
     Case: A bacterium moves toward higher concentrations of sugar. What's happening?
     Options:
       A. The bacterium wants the sugar and is trying to get it.
       B. The bacterium is just reacting chemically; no desires or beliefs involved.
       C. The bacterium was designed by evolution to seek sugar, so it's acting on a built-in function.

   Q3 (Thermostat):
     Case: Your thermostat turns on the heat when the room gets cold. Does it "know" the temperature?
     Options:
       A. Yes, it was designed to sense and respond to temperature.
       B. No, it's just a switch triggered by temperature.
       C. It doesn't know in the human sense, but we can say it 'knows' in a functional way.

   Q4 (Leibniz's mill):
     Case: Imagine you could be shrunk down to the size of a neuron and walk through a human brain while the person is thinking. You see neurons firing in complex patterns. Would you expect to see the person's beliefs as physical objects?
     Options:
       A. Yes, beliefs are just patterns of neural activity, so I'd see them.
       B. No, beliefs are not physical objects; they emerge from the whole system.
       C. I wouldn't see beliefs as separate objects, but I could see the physical basis for them.

   Q5 (Predictive loss):
     Case: Suppose a superintelligent being could track every particle in your friend's body and predict her movements perfectly using physics. Would this description miss anything about her?
     Options:
       A. Yes, it would miss her thoughts, feelings, and beliefs.
       B. No, it would capture everything, just in more detail.
       C. It would capture everything, but it's impractical; we use beliefs to summarize.

   Q6 (Borderline attribution):
     Case: Alex says, "Recycling is vital for the planet," but never recycles. Does Alex really believe recycling is vital?
     Options:
       A. Yes, because that's what Alex says.
       B. No, because actions speak louder than words.
       C. It's ambiguous; there's no fact of the matter about what Alex believes.

   Q7 (Confidence test: predictability vs. design):
     Case: Consider a complex, self-replicating robot that wasn't designed by anyone but evolved in a lab. It avoids obstacles and seeks power sources. You can predict its movements using physics, but it's very hard. Alternatively, you can describe it as "wanting to survive and seeking power." Which description is more reliable?
     Options:
       A. The physics description, because it's more fundamental.
       B. The "wanting" description, because it's easier and captures the pattern.
       C. Neither is more reliable; they are just different ways of talking.

   Q8 (Animal vs. Machine - to help separate Type A and Type B):
     Case: A dog whines at the door to be let out. A robot dog whines at the door when its battery is low. Which one has a genuine desire?
     Options:
       A. Only the real dog.
       B. Only the robot dog (if it's sophisticated enough).
       C. Both have genuine desires in their own way.
       D. Neither has genuine desires; they are both responding to stimuli.

   Now, we have 8 questions. We might add one or two more to better separate positions.

   Let's add:

   Q9 (To separate real-pattern realism from instrumentalism, and to get at design stance):
     Case: When a chess program sacrifices a pawn, we say it "believes" this will help it win. If we found that the program was written with a bug that made it sacrifice pawns in error, would it still be correct to say it "believed" the sacrifice was good?
     Options:
       A. Yes, because that's how it played.
       B. No, because the program wasn't functioning as designed.
       C. The word "believe" doesn't really apply; it's just a program.

   Q10 (Another borderline: group attribution? Or perhaps a case of ambiguous remark):
     Case: Taylor says, "The government is hiding aliens." Later, Taylor says, "I meant that as a metaphor for secrecy." Did Taylor believe in aliens at the time?
     Options:
       A. Yes, because that's what they said then.
       B. No, because they now say it was a metaphor.
       C. There's no fact of the matter; belief isn't that precise.

