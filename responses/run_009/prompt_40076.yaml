  Recalling decision theory, EU relies on the independence axiom, which REU violates in systematic ways. The Allais paradox is a classic example where people prefer a sure win over a gamble with a high chance of winning nothing, even when the expected value suggests otherwise. Under EU, this is explained by concave utility. But REU attributes it to weighting probabilities non-linearly, especially underweighting small probabilities of loss.

