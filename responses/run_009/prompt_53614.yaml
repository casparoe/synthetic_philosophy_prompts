prompt: |-
  I'm teaching intermediate logic students, second-years who've already done the truth-table stuff, so they arrive believing the material conditional is just what "if" means and that the counterfactual is merely the past tense version of the same connective. Next week I've got one fifty-minute section on the indicative/counterfactual distinction and honestly I'm sick of the Oswald example, it's been done to death and half of them don't know who Oswald was anyway. Don't write me the lecture, write me the plan for the lecture. What I want from you: the order the pieces have to come in, since I've tried teaching possible worlds semantics first and it dies on the board, so tell me what actually has to be in place before a possible-worlds gloss can earn its keep, and what the minimal pair I should build the whole session around needs to look like (it can't just be tense, I want a pair where the indicative is clearly true and the counterfactual clearly false, or vice versa, ideally not involving presidential assassinations). Then the misconceptions: I can predict "indicative = material conditional, so a false antecedent makes it true" and "the difference between the two moods is just grammar or imagery," but I want you to tell me where exactly in the sequence each one gets triggered and where I should head it off, because if I defuse them too early it goes over their heads and too late it calcifies. Also, at the end I want to spend ten minutes on backtracking counterfactuals, the ones where you evaluate the closest world by changing the past of the antecedent's past, the "if the match had gone off, it would have been soaked in gasoline" type, since that's where their intuitions about closest worlds and about inferential connections between the moods start fighting each other, and I want to know whether that's a good closing move or whether it will just wreck the fragile thing I built in the first forty minutes. And give me one question, a case, not a "do you understand" check, that I can put on the exit ticket to see whether they actually got the distinction versus just learned to squint at conditionals. One more thing: whatever you give me, write it as continuous prose, no headers or bullets or tables — I'm going to read it on my phone between meetings and formatted walls of text give me a headache. A typo or two I'll forgive, mine will have them too.
reasoning: |-
  Okay, the user is teaching intermediate logic students who already know about truth tables and the material conditional. They think "if" is just the material conditional and counterfactuals are past tense versions. The user is tired of the Oswald example and wants a fresh lecture plan. 

  First, I need to figure out the key challenges. The students have misconceptions that need addressing at the right time. If possible worlds semantics are introduced too early, it fails. So the sequence matters a lot. The minimal pair example is crucial—it must clearly show the indicative true and counterfactual false (or vice versa) without involving assassinations. 

  The user mentioned backtracking counterfactuals as a potential closing topic. But they're worried it might confuse students. I need to assess if that's a good idea. Also, the exit ticket question should test genuine understanding, not just recall.

  Let me start with the minimal pair. It needs to be relatable and tense-independent. Maybe something about missing a train? Like "If Alice missed the 8:05, she took the 8:15" (indicative) versus "If Alice had missed the 8:05, she would have taken the 8:15" (counterfactual). The indicative is true if she usually does that, but the counterfactual false if she actually caught the 8:05. That avoids historical references.

  Timing the misconceptions is critical. Students might think the difference is just grammar. I should address this after presenting the minimal pair but before possible worlds. Another misconception is that false antecedents make conditionals true. That needs debunking early, maybe during the minimal pair discussion.

  Possible worlds should come after showing the minimal pair's truth values differ. Then introduce similarity ordering with concrete examples. Backtracking counterfactuals could work at the end if framed as an exception that proves the rule, but keep it brief.

  The exit ticket question needs to force application. Maybe a scenario with two conditionals where one is true and the other false based on context. For example: "Sam never checks his email on weekends. Last Saturday he didn't check it. Today is Monday, he hasn't checked yet. Consider: (A) If Sam checked his email yesterday, he saw the message. (B) If Sam had checked his email yesterday, he would have seen the message." Students should recognize A is uncertain (yesterday was Sunday, he might not have), while B is false because he didn't check.

  I'll structure the lecture: start with the minimal pair to hook them, then dismantle misconceptions, introduce possible worlds as a tool, and touch on backtracking carefully. The exit ticket tests if they can spot when indicative and counterfactual diverge in truth value.
answer: |-
  Here’s the lecture plan in continuous prose. Start by grounding everything in a fresh minimal pair to bypass historical baggage. Use this: "The Train Delay." Context: Alice always takes the 8:05 train to work if she’s on time. If she misses it, she *always* takes the next one, the 8:15. Today, she *did* catch the 8:05. Now consider two statements: (1) Indicative: "If Alice missed the 8:05, she took the 8:15." (2) Counterfactual: "If Alice *had* missed the 8:05, she *would have* taken the 8:15." The indicative (1) is straightforwardly true given her habit—it’s a general rule. But the counterfactual (2) is false in this scenario because if she *had* missed the 8:05 (contrary to fact), she *wouldn’t* have taken the 8:15—she would have been hit by a falling piano while rushing to the platform (a salient, contextually known fluke event that didn’t happen). This pair isolates the distinction: same antecedent/consequent, same "past" time reference, but different moods yield different truth values. It forces the issue without tense confusion or obscure history.

  Open with this example immediately. Ask for intuitive truth-value judgments—don’t reveal answers yet. This surfaces their starting assumptions. They’ll likely say both are true, triggering the first misconception: **"The difference is just grammatical/pragmatic (tense/imagery)."** Nip this here. Point out the *logical* divergence: (1) is true as a material conditional (false antecedent makes it vacuously true) but (2) is false despite the false antecedent. Hammer this: truth conditions differ fundamentally. The counterfactual isn’t just a fancy past-tense indicative; it makes a claim about how the world *would* have unfolded, which can be false even when the indicative is true.

  *Now* introduce possible worlds semantics—but *only after* establishing that truth conditions diverge. Motivate it as a tool to explain *why* (2) is false. Define "closest possible world" non-technically: the most realistic way the antecedent could have happened, minimizing arbitrary changes. In (2), the closest world where Alice misses the 8:05 isn’t one where her habits hold—it’s one where the piano falls because that’s the actual cause she avoided. Hence, "she would have taken the 8:15" is false. Contrast with (1): the indicative doesn’t care about "closeness"; it’s true if *all* worlds where she misses the 8:05 (even unrealistic ones) are worlds she takes the 8:15. This resolves the minimal pair.  

  This exposes the second misconception: **"False antecedent makes any conditional true."** It emerges when they resist (2) being false. Defuse it here by stressing that counterfactuals impose *modal constraints*—they’re falsified if the consequent fails in the *relevant* (closest) scenario. The material conditional’s vacuous truth doesn’t transfer.  

  In the final 10 minutes, introduce backtrackers cautiously. Use: "If the match *had* lit when struck, it *would have been* dry." But in reality, it didn’t light because it was wet. Here, the "closest" world isn’t one with a magical dry match—it’s one where the match was dry earlier, satisfying the antecedent *causally*. This challenges their nascent "closeness" intuition but reinforces the core point: counterfactuals track *dependencies* in specific contexts. It’s a good closer if you frame it as an exception proving the rule—it shows why we need robust semantics (similarity ordering *includes* causal laws), not just "change one thing." Don’t dive deep; gesture that some conditionals require "backtracking" to hold the past fixed until the critical point.  

  For the exit ticket, use this: *"Clara never eats peanuts. Yesterday, she ate a cookie that (unbeknownst to her) contained peanut flour. She had a severe allergic reaction and nearly died. Today we say: (A) If Clara ate peanuts yesterday, she had an allergic reaction. (B) If Clara had eaten peanuts yesterday, she would have had an allergic reaction. Which is true, which is false, and why?"* Correct analysis: (A) is true (material conditional; she did eat trace peanuts and reacted). (B) is false—in the closest world where she *knowingly* eats peanuts (e.g., whole nuts), she carries an EpiPen and survives. This tests if they grasp mood-driven truth conditions beyond surface grammar.  

  Sequence recap: 1. Minimal pair (Train Delay) to shock intuitions. 2. Debunk "just grammar" misconception. 3. Use pair to expose truth-value split and debunk "vacuous truth" misconception. 4. Introduce possible worlds *as explanation* for the split. 5. Backtrackers as nuance, not core. 6. Exit ticket with Clara to diagnose understanding. Keep notation light; use bold for key terms on board. The Train example does the heavy lifting—protect its salience throughout.
