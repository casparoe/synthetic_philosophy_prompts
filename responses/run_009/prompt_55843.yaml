  Okay, the user has a background in math and software engineering and is exploring philosophy as a hobby. They read a popular history book about the Bloomsbury Group that summarized G.E. Moore's ethics in a way that seems contradictory to them. Specifically, they're questioning two claims: that Moore "quietly reinstalled" hedonism after criticizing it, and that he advocated for summing up the value of individual feelings. They want me to audit these claims, pointing out what's accurate, simplified, or incorrect.

  First, I need to recall Moore's key arguments in Principia Ethica. Moore's main point is that "good" is a simple, indefinable, non-natural property. He criticizes the naturalistic fallacy, which is defining "good" in terms of natural properties like pleasure. The book says Moore demolished previous ethical systems but then reinstated pleasure as central to his own system, calling it "refined hedonism." The user suspects this might be the author's clever twist rather than Moore's actual position.

  Looking at Moore's arguments: He explicitly rejects equating "good" with pleasure. That's foundational. But he does identify certain experiences as intrinsically good, like the pleasures of human intercourse and aesthetic enjoyment. So the author isn't wrong that Moore values these states, but calling it "hedonism" is misleading. Hedonism typically means pleasure is the sole good, but Moore includes other elements and rejects the reduction of good to pleasure. The author's phrasing "refined hedonism" might be an oversimplification.

  Next, the claim about summing individual feelings. Moore does talk about organic unities, where the whole's value isn't just the sum of its parts. For example, friendship isn't just the sum of individual pleasures but involves complex relations. The author's statement that value adds up feeling-by-feeling contradicts Moore's own ideas on organic wholes. So that part is likely incorrect.

  The user also questions the interpretation of Moore's quote about "pleasures of human intercourse." The author takes it as emphasizing the feeling or "buzz," but Moore likely meant the entire experience, including the objects and relationships involved, not just the subjective feeling. The author's focus on intensity of feeling also isn't supported by Moore, who valued the quality and nature of the experiences more than just their intensity.

  Regarding the Bloomsbury Group's interpretation: It's well-documented that figures like Keynes and Strachey took Moore as justifying their focus on art and friendship over Victorian conventions. Even if Moore's philosophy was more nuanced, the Bloomsbury set might have simplified it to suit their lifestyle. So that historical point still stands despite the philosophical corrections.

  I should structure my response by addressing each claim: Moore's rejection of defining good, the alleged reinstatement of hedonism, the summing of values, and the Bloomsbury interpretation. I'll clarify where the author is correct, where they oversimplify, and where they're mistaken, using Moore's actual arguments. Since the user isn't a philosophy expert, I'll avoid jargon and explain concepts like the naturalistic fallacy and organic unities clearly. I'll also confirm that while the Bloomsbury group used Moore to justify their values, that's a historical point separate from the accuracy of their interpretation.
answer: |-
  Based on a close reading of *Principia Ethica* and standard scholarly interpretations, here's a claim-by-claim audit of the passage, tailored to your background:

  1.  **"Moore demolished every previous attempt to define the good: 'good' is a simple, indefinable, non-natural property."**
      *   **Scholarly Acceptance:** **Yes, core doctrine.** This is Moore's fundamental thesis – the "Naturalistic Fallacy." He argues "good" is like "yellow"; you can't define it by breaking it down into simpler concepts or reducing it to a natural property (like pleasure, desire, or evolutionary fitness). You grasp it intuitively. His primary target *was* hedonistic utilitarianism (equating good with pleasure), but it equally applied to all attempts to define good reductively.

  2.  **"He argued the utilitarians' equation of good with pleasure was a definitional blunder."**
      *   **Scholarly Acceptance:** **Yes, explicit attack.** This is a direct consequence of point 1. Calling pleasure "good" commits the Naturalistic Fallacy by defining the indefinable. Pleasure *is* good, Moore thinks, but it's *not identical* to "goodness" itself. Goodness is a separate property that pleasure *possesses*.

  3.  **"But... Moore quietly reinstalled pleasure at the top of his own system... essentially refined hedonism — higher pleasures... plus a Bloomsbury shopping list."**
      *   **Scholarly Acceptance:** **Problematic Simplification/Mischaracterization.** This is the passage's most significant overreach and requires nuance:
          *   **What Moore DID Do:** He identified specific things that are *intrinsically good* (good in themselves). His list prominently includes "the pleasures of human intercourse and the enjoyment of beautiful objects." Pleasure *is* a key component.
          *   **Why "Reinstalled Pleasure" is Misleading:**
              *   Moore **rejected the *definition*** of good as pleasure, not necessarily pleasure's *value*. He still held that pleasurable states *are* good because they possess the simple, indefinable property "good."
              *   He did **NOT** claim pleasure *alone* is intrinsically good. His list includes friendship and aesthetic appreciation – complex states *involving* pleasure, but not *reducible* to mere sensation. He also valued knowledge and virtue.
              *   Calling it "refined hedonism" blurs a crucial distinction. Hedonism *defines* good *as* pleasure/absence of pain. Moore **explicitly denied this definition**. For Moore, pleasure is *a* bearer of goodness, not goodness itself. His system is a **pluralistic intuitionism** about intrinsic value, not a hedonism.
          *   **"Quietly Reinstalled" Implication:** This suggests Moore was being sneaky or inconsistent. Scholars see it differently: having cleared away *false definitions*, Moore then used his intuition to identify things that *actually possess* the indefinable property "good." Pleasure is prominent among them, but not redefined *as* the good.

  4.  **"By far the most valuable things... are certain states of consciousness... pleasures of human intercourse and the enjoyment of beautiful objects."**
      *   **Scholarly Acceptance:** **Yes, direct quote & core claim.** Moore *does* give these states primacy as the highest intrinsic goods. This is central to *Principia Ethica*.

  5.  **"In other words, what matters is the feeling: the buzz... the glow... and the more intense the feeling, the better."**
      *   **Scholarly Acceptance:** **Significant Oversimplification/Misinterpretation.**
          *   **"What matters is the feeling":** Partial truth, but incomplete. Moore emphasizes the *conscious state itself* as the bearer of value. While feeling (pleasure) is a *component*, the *objects* of the state are crucial. The value of "enjoyment of beautiful objects" depends on the *actual beauty* of the object, not just the internal feeling. Similarly, "pleasures of human intercourse" involve valuing the *friends* and the *relationship*, not just a subjective buzz. The feeling is *part* of the intrinsically valuable complex state.
          *   **"The more intense the feeling, the better":** **Not Moore's View.** This is a **major misreading**. Moore explicitly **rejects** quantifying goodness solely by intensity of pleasure (a key hedonist move). He argues for the **qualitative superiority** of certain pleasures/states. The complex states of appreciating friendship or beauty possess a *different, higher kind* of goodness than simple bodily pleasures, regardless of intensity. A moderately intense appreciation of true friendship or great art is *more valuable* than an intensely pleasurable full stomach (Ch. VI). He calls this the principle of "Unities" or "Organic Wholes".

  6.  **"Each such pleasant state of mind is good on its own... the value... is simply the sum of the values of the individual feelings it contains."**
      *   **Scholarly Acceptance:** **Explicitly Denied by Moore.** This directly contradicts Moore's crucial doctrine of **"Organic Unities"** (Ch. I, §18-22; Ch. VI). Moore argues:
          *   The value of a complex whole (like an evening with friends) **cannot** be calculated by simply adding up the values you'd assign to its individual parts (feelings, thoughts, objects) considered in isolation.
          *   The *relation* between the parts creates entirely new value or alters the value found in the parts alone. Loving a *worthy* friend creates more value than the feeling of love plus the friend's worth considered separately. Contemplating a *truly beautiful* object creates more value than the feeling plus the object considered separately.
          *   Therefore, the whole (the complex state of consciousness *in relation to its worthy objects*) has intrinsic value that is not merely the sum of its parts.

  7.  **"It is not hard to see why Keynes and Strachey took the book as a charter for putting art and friendship above Victorian convention."**
      *   **Scholarly Acceptance:** **Yes, historically accurate.** Regardless of whether the *Bloomsberries* perfectly understood or followed Moore's technical philosophy (they famously didn't dwell on the metaphysics or the Naturalistic Fallacy), they latched onto:
          *   The primacy of friendship and aesthetic appreciation as the highest goods.
          *   The reliance on personal intuition and sensibility to discern what is truly valuable.
          *   The rejection of rigid external rules (like Victorian morality or religious dogma) as defining the good.
          *   The emphasis on conscious states and personal experience.
      This provided a powerful, intellectually respectable justification for their lifestyle focused on intimate friendships, artistic pursuits, and personal freedom. Moore's *effect* on them is undeniable, even if their *interpretation* simplified his complex system.

  **Summary Audit:**

  *   **Accurate:** Moore's core arguments against defining "good" (especially equating it with pleasure), his list of highest intrinsic goods (friendship, aesthetic enjoyment), and the historical impact on the Bloomsbury Group.
  *   **Problematic Simplification/Mischaracterization:** The description of Moore's positive system as "refined hedonism" and the implication he "quietly reinstalled" pleasure as *the* definition of good. He valued pleasure highly *within* intrinsically good states but rejected the hedonist *equation*.
  *   **Explicitly Denied by Moore:**
      *   The reduction of intrinsic value solely to "the feeling" or "buzz/glow" (ignoring the essential role of the *objects* of consciousness).
      *   The idea that "the more intense the feeling, the better" (he prioritized qualitative superiority).
      *   The claim that value is additive ("simply the sum") – he argued for Organic Unities where the whole's value is not the sum of its parts.

  **Regarding the Quoted Sentence ("pleasures of human intercourse..."):**
  *   **The Author's Gloss:** The author interprets "pleasures" primarily as subjective feelings ("buzz," "glow") and emphasizes intensity.
  *   **Moore's Likely Meaning:** While feeling/pleasure is *involved*, Moore meant the *entire complex conscious state* – including the appreciation of the *friend themselves* (their qualities, the relationship) or the *beauty of the object*. It's not *just* the internal buzz; it's the state of apprehending and valuing something truly valuable outside oneself. His emphasis was on the *nature* and *objects* of the state, not its intensity. The author's gloss ignores the crucial role of the *objects* and Moore's qualitative hierarchy, overemphasizing the subjective sensation and intensity in a way Moore rejected.

  **The Bloomsbury "Charter":** This historical point survives the corrections. Moore's philosophy, particularly his elevation of personal relationships and aesthetic experience as paramount, combined with his emphasis on personal intuition over rules, provided the Bloomsbury Group with a powerful philosophical framework to justify their rejection of convention and their pursuit of their chosen lifestyle, even if they simplified his complex arguments about *why* those things were good.
