  I'll structure this as a three-part activity: introduction, role-play, and debrief. For roles, I'll include family members with different emotional perspectives (a conflicted daughter, a religious son, etc.), an ICU nurse focused on ethics, a transplant coordinator pushing for viability, a chaplain concerned with dignity, and a hospital administrator worried about liability. This creates natural tension around the waiting time decision.

  Materials should be simple: just role cards and a timer. I'll include guidance for handling participants with medical knowledge - they can add realism but shouldn't dominate. The debrief will explicitly connect the exercise to brain death vs. cardiac death and the discovery/decision question. 

