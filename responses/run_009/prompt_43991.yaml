prompt: |-
  So I'm getting married in October, and at the rehersal dinner my best man -- philosophy grad student, insufferable in the best way -- walked me into an argument about whether the vows actually bind me, and now I can't get it out of my head. Here it is as he laid it out:

  (1) A promise can't conjure an obligation out of nothing; whatever makes it wrong to break a promise has to be something the promise actually did to the world.
  (2) The only thing the promise does to the world is change your side of it: now you have reason to rely on me, build plans on me, pass up alternatives.
  (3) If your reliance is what makes breaking it wrong, then the duty tracks the reliance, not the promise itself.
  (4) But then anything else that produces the same reliance should produce the same duty: a confident lie, my track record of doing this every year, even a third party correctly predicting me if word gets back to you and you plan around it.
  (5) And if you never relied at all -- you forgot the promise, made no plans, maybe you'd honestly be relieved if I broke it -- then there's nothing wrong with breaking it, and plausibly no obligation left at all.

  So he concludes the vow is just a really effective machine for generating reliance, and the wrong of breaking it is the ordinary wrong of letting down someone who depended on you -- no special promissory duty, just garden-variety harm through dependence. He kept comparing it to Hume's line about promises being useful fictions the way money is.

  Which sounds almost plausible until you notice what it proves. On his view my wedding vows would bind me to nothing if my fiancee were a total skeptic who never beleived a word of them, while a used car salesman's patter would bind him completely if some poor guy genuinely hung his whole year on it. And a promise extracted at gunpoint would bind you, as long as you actually relied on it. I really don't want to accept that I'm obligated to someone exactly insofar as they took me seriously.

  Where does this go wrong, if it does? My instinct is that it slips somewhere between (3) and (4) -- something about the difference between reliance making a breach *worse* and reliance being *all there is* -- but I can't make it precise. If a premise has to go, tell me which one, why it looked so innocent, and what rejecting it costs (he warned me that every way out has a price, like ending up with the skeptic conclusion anyway or with obligations I never consented to). And if you think his conclusion is actually survivable, tell me how much of it you'd keep and what weird residue you're left holding. I have about a month of quiet panic left before the wedding, so take your time but be thorough.
reasoning: |-
  Okay, let me try to unpack this problem. The user is getting married soon and his best man, a philosophy grad student, has thrown him into a philosophical quandary about the nature of promises and obligations. The argument presented suggests that the moral weight of a promise isn't inherent in the promise itself but rather in the reliance it creates in others. This has left the user anxious about what his wedding vows actually mean, especially with the wedding approaching.

  The core of the argument is that obligations from promises stem solely from the reliance they generate, not from any inherent "promissory magic." The best man uses Hume's view that promises are social conventions like money - useful fictions. The user finds this troubling because it leads to counterintuitive conclusions: vows wouldn't bind if the spouse didn't believe them, but a liar would be bound if someone relied on their lies, and even promises made under duress would create obligations if relied upon.

  The user suspects the flaw might be between steps (3) and (4) - confusing reliance making breach worse versus being the whole basis of obligation. He wants to know where the argument goes wrong, which premise to reject, and what the consequences of rejecting it would be.

  First, I need to examine each premise carefully. Premise (1) seems reasonable - obligations can't come from nothing. Premise (2) about promises changing the world through reliance also has merit. Premise (3) linking duty to reliance follows logically. But premise (4) is where it gets problematic - claiming that any source of reliance creates identical obligation. And premise (5) suggests no reliance means no obligation.

  The critical flaw appears at step (4). The best man assumes that all reliance is morally equivalent regardless of source, but this ignores how the reliance was generated. There's a difference between reliance created by a voluntary promise versus reliance created by deception, prediction, or coercion. The promise creates an expectation of commitment, while other sources don't. 

  Rejecting premise (4) means acknowledging that promises create special obligations because they involve voluntary commitment to another person. This avoids the counterintuitive conclusions but comes with its own costs. It means accepting that obligations can arise from our voluntary acts even without tangible harm from reliance. It also means the skeptic spouse scenario still poses a problem - if there's no reliance and no inherent obligation, what binds the promiser?

  Other approaches include appealing to convention (Scanlon), but this feels circular. Or emphasizing the relational aspect of promises as creating mutual expectations. The "least bad" option seems to be rejecting (4) and accepting that promises generate unique obligations through voluntary commitment, even if this means obligations exist even without reliance.
answer: |-
  You're absolutely right to sense a critical flaw here—and your instinct about (3) and (4) is sharp. The argument cleverly exploits a kernel of truth (reliance *matters*) to bulldoze the distinctive moral architecture of promising. Let's dismantch it step by step, identify the culprit, and weigh the costs of rejection. Spoiler: **Premise (4) is the fatal misstep**, though rejecting it forces us to confront deeper questions.

  ### The Core Problem: Premise (4) Ignores *How* Reliance is Generated
  The best man assumes that *any* cause of reliance is morally equivalent: a promise, a lie, a prediction – if it makes you depend on me, I owe you the same duty. **This erases the moral significance of *agency* and *voluntary commitment*.** Here's why:

  1.  **The Promise Itself Creates a Unique Reason for Action:** When you make a promise, you aren't just predicting your future behavior or describing your current desires. You're *undertaking an obligation*. You're saying, "I hereby put myself under a normative constraint *because* I say so." This performative act changes the moral landscape *for you* in a way a lie, a prediction, or a habit does not. The promisee gains a special kind of *right* against you – a right grounded in your voluntary act of commitment, not just their psychological state.
  2.  **Source Matters for Blameworthiness:** If I *lie* to you and you rely on it, my wrong in letting you down isn't primarily the wrong of *breaking a commitment*; it's compounded by the prior wrong of *deceiving* you to induce that reliance in the first place. My duty to mitigate harm stems from my *initial deceit*, not from a promissory duty. If a *third-party prediction* causes reliance, *I* didn't invite it or endorse it. My duty (if any) arises from general duties of care or fairness, not a specific promissory obligation. The promise, however, creates a duty *directly* and *specifically* between promiser and promisee *because of the act itself*.
  3.  **The "Gunpoint" Problem Exposes the Absurdity:** Premise (4) forces the conclusion that a coerced promise binds. But coercion fundamentally vitiates consent. The promiser *did not voluntarily undertake* the obligation; it was extracted under duress. The duty to avoid harming the coerced promisee *if they rely* might exist (e.g., a duty of minimal decency), but it is categorically *not* the same as the duty created by a free promise. The best man's view conflates "duty not to harm via induced reliance" with "duty to keep one's word."

  ### Why Premise (3) *Seems* Plausible (But Isn't the Whole Story)
  Premise (3) ("the duty tracks the reliance, not the promise itself") looks innocent because **reliance is a powerful *consequence* of promising and a major *reason* why breaking promises is often seriously wrong.** It explains the *harm* done by breaking a promise. *However*, it mistakes a key consequence for the *entire foundation*. The promise itself creates a *pro tanto* (at first glance) obligation *before* any reliance occurs. This obligation gives the promisee a *reason* to rely and makes your subsequent failure a distinct kind of wrong – a *wronging* of *that specific person* in virtue of *your voluntary act directed at them*.

  *   **Reliance as Intensifier, Not Sole Creator:** Think of the promise as building a bridge. The obligation is the structure itself. Reliance is the traffic you invited onto the bridge. *Before* traffic, it's wrong to deliberately dismantle the bridge you just built for someone – it violates the commitment and wastes their potential opportunity. *After* traffic is on it, breaking it is catastrophically worse because you also destroy the travelers relying on your structure. But the core wrong starts with building (promising) and then pointlessly or maliciously destroying (breaking) what you built *for them*. The reliance makes the harm of breaking worse, but the fundamental breach of commitment exists independently.

  ### Rejecting Premise (4): The Cost and the Path Forward
  **What Rejecting (4) Costs:** We have to accept that promising creates a *sui generis* (unique) moral obligation that isn't *fully* reducible to reliance or harm. This means:
  1.  **Skeptic Spouse Problem Persists (Partly):** If your fiancée genuinely didn't believe your vows *at all* and made *zero* plans based on them, the *harm* from breaking them might be minimal. However, you still *wronged her* by making a solemn commitment you didn't intend to keep (or by breaking it flippantly). The obligation existed *because you promised*, even if the consequences of breaking it were minor. The wrong is more akin to insincerity or disrespect towards her in that moment. You'd arguably still owe an apology *for making the insincere promise*, even if she didn't rely. (This is less counterintuitive than it seems – we often feel wronged by insincere commitments even if we didn't act on them).
  2.  **"Obligations Never Consented To"?** Not quite. Rejecting (4) doesn't create obligations *ex nihilo*. It affirms that *voluntary acts of commitment* (like promising) create specific obligations. The obligation arises *from your consent* expressed in the promise. You *did* consent to the obligation by performing the speech act. The problem with gunpoint is that the consent wasn't free/real, not that consent doesn't create obligation.

  **Surviving (and Improving) the Conclusion:** Can we salvage any of the best man's insight? Absolutely, without swallowing the reductio:

  1.  **Keep the Kernel:** Reliance is *a* crucial, often *the most important*, factor in the *gravity* of breaking a promise. It explains why breaking significant promises is usually far worse than breaking trivial ones. Promises *are* incredibly effective reliance-generators, and preventing harm *is* a major moral reason to keep them.
  2.  **Modify the Conclusion:** The vow isn't *just* a reliance machine. **It's a performative act of mutual commitment that creates a distinctive normative relationship.** Breaking it involves:
      *   **A Primary Wrong:** Violating the specific obligation *to that person* created by your voluntary commitment.
      *   **A Secondary Wrong (Often):** Causing harm through induced reliance (which amplifies the seriousness).
      *   **A Tertiary Wrong (Often):** Damaging the general practice and trust of promising (a Humean point worth keeping).

  3.  **Address the Counterexamples:**
      *   **Skeptic Spouse:** You wronged her by making an insincere commitment or breaking a sincere one flippantly. The obligation existed, but the *harm* (and thus, perhaps, the *severity* of the breach) is less. She might rightly feel disrespected.
      *   **Used Car Salesman:** His lie was a *prior wrong* that induced reliance. His duty to the victim stems from *that deceit* and the general duty not to harm. It's *not* a promissory duty – he never undertook a genuine commitment. The harm might be identical, but the *nature* of the wrong is different (fraud vs. promise-breaking).
      *   **Gunpoint Promise:** The coerced promiser has *no* promissory obligation. Any duty to the promisee who relies is a weak duty of non-maleficence (don't actively harm the vulnerable), easily overridden by the victim's own moral taint in extorting the promise. The reliance was wrongfully induced by the victim.

  ### Philosophical Anchors (For Your Best Man)
  *   **T.M. Scanlon:** His *promise principle* (Principle F in *What We Owe to Each Other*) directly counters the best man. It states: If you intentionally lead someone to expect you will do X (unless they consent to you not doing it), and you do so to invite their reliance, then you must do X unless they consent to your not doing it. This grounds the obligation in the *act of assurance* itself, not just the reliance. It explains why the *liar* isn't bound by Principle F (they didn't sincerely offer assurance) and why the *prediction* doesn't bind (no assurance was offered *by the actor*). Scanlon explicitly argues against the pure reliance view.
  *   **Joseph Raz:** Emphasizes that promises give the promisee an *exclusionary reason* – a reason to act that excludes some other conflicting reasons (like simple desire). This power to create such reasons is distinctive.
  *   **Against Hume:** Hume was brilliant but wrong here. Money is a pure social convention. Promising involves a complex interplay of convention, intentionality, commitment, and relational morality. Reducing it *only* to reliance and convention strips it of its essential moral character as a voluntary undertaking.

  ### Your Wedding Vows
  Your vows matter profoundly. They are not just efficient reliance-generators. They are a public, solemn, mutual act of commitment. You are creating a shared normative world with your partner. You owe it *to her* to keep those vows because *you freely pledged yourself to her*. The fact that she trusts you and relies on that pledge makes breaking it devastatingly harmful, but the core wrong starts with breaking the commitment *you made to her*. The obligation springs from your joint act of promising, not solely from her psychology afterward. Rejecting premise (4) is the cost of keeping that essential meaning intact. Enjoy the quiet panic – it's a sign you grasp the gravity of the commitment, which is far more reassuring than philosophical nihilism about promises! Congratulations on the wedding.
