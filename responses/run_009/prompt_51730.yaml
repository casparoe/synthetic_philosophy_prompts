prompt: |-
  I serve on the charter commission of a mid-sized city where mayoral elections routinely draw four or five serious candidates, and our last two winners took roughly 35 and 38 percent of the vote respectively. The commission must recommend one of three options to the council and, eventually, to the voters: retain our first-past-the-post rule, adopt instant-runoff (ranked-choice) voting, or adopt approval voting. The debate has come to be conducted largely through Arrow's impossibility theorem, in ways I suspect are muddled but that I am not confident I can correct on the fly. Draft the written opinion I will circulate before our final hearing.

  Four lines of argument are in play, and the memo should engage each seriously rather than waving it away:

  1. Our commissioner with a mathematics background argues that Arrow's theorem shows every ranked-ballot method is arbitrary: any social welfare function satisfying unrestricted domain, Pareto, and non-dictatorship must violate independence of irrelevant alternatives, so instant-runoff belongs to the doomed class from the start. He concludes there is no principled basis for preferring it to plurality, and that reform merely trades one arbitrary rule for another with added ballot complexity and voter confusion.

  2. A second commissioner counters that approval voting escapes the theorem outright, because Arrow's framework assumes only ordinal information — voters can rank candidates but cannot express intensity — while approval ballots carry cardinal information. On her view, the theorem is simply inapplicable to approval voting, which is therefore the rational choice.

  3. Our most stubborn commissioner raises what he calls the regress problem: the commission itself will choose among the three options by simple majority vote, and he claims Arrow's theorem applies to that meta-vote just as it applies to any other aggregation of ranked preferences — so our choice of voting system will be made by a voting system the theorem has already convicted. He concludes that the entire exercise of choosing a better rule is confused, and that plurality should be retained by default.

  4. Finally, a commissioner who formerly lived in Maine points to the 2018 election in Maine's second congressional district: the incumbent led by about a point on first preferences but lost after the trailing candidates' ballots were redistributed, and a federal court upheld the result against a challenge to the method itself. She presents this both as evidence that ranked-choice voting works as advertised — it produces a majority winner — and, when pressed, as evidence that it discards or devalues first choices. The memo should be honest about which reading the episode actually supports, and about what it does not show.

  The deliverable is a formal commission memo with a clear recommendation among the three options, but its central task is conceptual triage: what Arrow's theorem actually establishes about this decision, what it leaves open, and where each of the four arguments above goes right and wrong. In particular, the memo should address whether the ordinal-versus-cardinal escape claimed for approval voting is genuine or merely relocates the problem (I am aware the Gibbard-Satterthwaite result about strategic manipulation is often said to bite harder in practice than independence of irrelevant alternatives does, and I want the memo to take a position on that); whether the regress argument is a real difficulty or a category mistake; and whether known failures of instant-runoff, such as nonmonotonicity, should figure in the recommendation. Where the mathematics underdetermines the choice — as I suspect it does — the memo should say so plainly and rest the recommendation on grounds it names explicitly, rather than dressing up a value judgment as a theorem.
reasoning: |-
  Okay, the user is on a city charter commission and needs to draft a memo about voting systems. They're dealing with four arguments centered around Arrow's theorem and real-world examples. Let me break down each point.

  First, the math commissioner claims Arrow's theorem makes ranked methods arbitrary. I need to confirm that Arrow's theorem applies to ranked systems like IRV. Arrow's conditions—especially IIA—are indeed violated by IRV. But does that mean it's no better than plurality? The user might be worried that this argument oversimplifies by equating theoretical flaws with practical uselessness. IRV avoids the spoiler effect, which is a real problem in their city's elections with multiple candidates and winners getting low percentages. So the memo should acknowledge the theoretical issue but highlight practical improvements.

  Second, the approval voting advocate says it escapes Arrow because of cardinal information. Arrow's theorem is based on ordinal rankings, so approval isn't covered. But Gibbard-Satterthwaite and other theorems show strategic voting is a risk. The user might be concerned whether approval's simplicity is worth potential issues like bullet voting. They need to weigh no spoiler effect against possible lack of nuance in voter expression.

  Third, the regress problem: the commission's own vote is subject to Arrow's theorem. This seems like a category error. Arrow's theorem is about ranking multiple options, but the commission is choosing a system, not ranking candidates. The meta-choice doesn't require the same conditions. The user probably wants to clarify that procedural decisions aren't bound by the same rules as social welfare functions.

  Fourth, the Maine example. The 2018 election showed IRV producing a majority winner after redistribution, but the incumbent lost despite leading in first choices. The user needs an honest take: this shows IRV works as intended but also that first choices aren't absolute. It doesn't prove IRV is superior overall, just that it handled that specific case without legal issues.

  The user’s deeper needs: they want a clear, honest evaluation that separates theoretical concerns from practical outcomes. They need the memo to guide commissioners away from misusing Arrow's theorem and toward practical impacts like reducing vote-splitting, voter satisfaction, and ease of use. The recommendation should balance theory with the city's specific context—multiple candidates, low plurality wins, and the desire for majority-supported winners. They might also want to address strategic voting concerns between IRV and approval, and whether complexity in IRV is a worthwhile trade-off.
answer: |-
  ## Memorandum: Charter Commission on Mayoral Election Methods  

  **To:** Charter Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** October 26, 2023  
  **Subject:** Analysis of Voting System Options & Arrow’s Theorem  

  ---

  ### **Introduction**  
  After thorough debate on reforming mayoral elections, this memo clarifies the conceptual framework of Arrow’s Impossibility Theorem, addresses the four key arguments raised, and provides a recommendation grounded in both theoretical rigor and practical governance. Arrow’s theorem—while profound—does not dictate our choice alone; it highlights trade-offs inherent in *any* voting system. Our decision must weigh mathematical constraints, empirical performance, voter experience, and civic goals.  

  ---

  ### **I. Arrow’s Theorem: What It Establishes and What It Does Not**  
  Arrow’s theorem proves that no ranked-choice voting system can simultaneously satisfy five minimal fairness criteria when aggregating *ordinal* preferences (rankings). Crucially:  
  - It applies **only to systems using ranked ballots** (e.g., instant-runoff voting, or IRV).  
  - It shows all such systems must violate at least one criterion, most commonly *Independence of Irrelevant Alternatives (IIA)* (i.e., adding/removing a losing candidate can alter the winner).  
  - **It does not apply** to systems using non-ranked ballots (e.g., approval voting) or cardinal ratings.  

  The theorem is a mathematical limit on preference aggregation—not a verdict against reform. All voting rules have flaws; our task is to select the least detrimental for our context.  

  ---

  ### **II. Analysis of Arguments**  
  #### **1. "IRV is as arbitrary as plurality due to Arrow’s theorem."**  
  **Where it goes right:** Arrow’s theorem indeed applies to IRV, proving it violates IIA. IRV can produce nonmonotonic outcomes (where ranking a candidate higher can cause them to lose).  
  **Where it goes wrong:** Equating IRV’s flaws with plurality’s ignores critical differences. Plurality often elects winners with <40% support in crowded fields (as in our city), exacerbating vote-splitting and "spoiler" effects. IRV mitigates these by ensuring winners gain majority support in later rounds. **Theoretical imperfections do not imply equal practical failure.** IRV’s violation of IIA is less practically damaging than plurality’s vulnerability to strategic voting and unrepresentative outcomes.  

  #### **2. "Approval voting escapes Arrow’s theorem."**  
  **Where it goes right:** Approval voting uses *cardinal* (approve/disapprove) ballots, placing it outside Arrow’s ordinal framework. It avoids IIA violations by design and resists vote-splitting.  
  **Where it goes wrong:** While Arrow does not apply, approval voting faces its own impossibility results (e.g., **Gibbard-Satterthwaite**), which show it is vulnerable to strategic manipulation ("bullet voting"). Voters may withhold approval from viable candidates to avoid aiding rivals, potentially distorting outcomes. However, empirical studies suggest this occurs less frequently than vote-splitting in plurality. **The escape from Arrow is genuine, but strategic voting remains a concern.**  

  #### **3. "The regress problem invalidates our choice."**  
  **Where it goes right:** Arrow’s theorem could theoretically apply to *any* ranked aggregation, including our commission’s vote.  
  **Where it goes wrong:** This confuses **procedural decisions** with **preference aggregation**. Our vote selects a system, not a candidate. Arrow’s theorem addresses the latter. Meta-choices (e.g., "how should we choose a voting system?") need not satisfy IIA or Pareto efficiency. A majority vote for a system is a standard, legitimate decision rule—not undermined by Arrow.  

  #### **4. "The Maine 2018 case proves IRV works (or devalues first choices)."**  
  **What happened:** In Maine’s 2nd District, Bruce Poliquin (R) led in first-preference votes but lost to Jared Golden (D) after redistributing eliminated candidates’ votes. A federal court rejected a constitutional challenge to IRV.  
  **What it shows:**  
  - **IRV worked as designed:** It produced a majority winner where plurality would not.  
  - **First choices were not discarded:** Votes for eliminated candidates were redistributed per voter preferences, ensuring the winner had broadest support.  
  **What it does not show:**  
  - That IRV is "fairer" than approval voting.  
  - That violations of IIA (e.g., a candidate’s removal might have changed the outcome) had practical significance here.  
  The case demonstrates IRV’s resilience in real elections but does not resolve theoretical debates.  

  ---

  ### **III. Key Practical Considerations Beyond Arrow**  
  - **Nonmonotonicity in IRV:** Rare but possible (<1% of elections). Requires voter education but is outweighed by eliminating spoilers.  
  - **Strategic voting:**  
    - *Plurality:* Encourages tactical "lesser evil" voting.  
    - *IRV:* Voters can rank honestly in most cases.  
    - *Approval:* Risk of "bullet voting" (approving only one candidate) if voters fear aiding moderates.  
  - **Ballot simplicity:** Approval is simplest; IRV requires ranking but is used successfully in cities like Minneapolis.  
  - **Voter satisfaction:** Both IRV and approval promote majority-supported winners, reducing "wasted vote" sentiment.  

  ---

  ### **IV. Recommendation: Adopt Instant-Runoff Voting (IRV)**  
  While no system is perfect, **IRV best addresses our city’s specific challenges**:  
  1. **Eliminates vote-splitting:** Ensures winners have majority support, ending the era of 35–38% plurality victories.  
  2. **Preserves voter intent:** Allows nuanced expression beyond "approve/not approve," reducing pressure for strategic voting.  
  3. **Proven resilience:** Successfully implemented in cities with similar demographics (e.g., Cambridge, MN; San Francisco).  
  4. **Balances theory and practice:** Arrow’s limitations are real but manageable; IRV’s practical benefits outweigh its theoretical flaws.  

  Approval voting is a credible alternative but risks flattening voter preferences. Plurality’s failures are acute in crowded fields and warrant reform.  

  ---

  ### **V. Conclusion**  
  Arrow’s theorem illuminates unavoidable trade-offs—not a dead end. Our choice rests on **practical governance**: ensuring mayors command broad support, restoring voter confidence, and avoiding plurality’s distortions. IRV achieves this with manageable complexity. We recommend placing it on the ballot for voter approval.  

  Respectfully submitted,  
  [Your Name]  

  ---  
  **Appendices**:  
  - Summary of IRV implementation costs & voter education plan.  
  - Comparative table: Plurality, IRV, Approval.  
  - Academic references: Arrow (1951), Merrill & Nagel (1987), ACE Electoral Knowledge Network.
