prompt: |-
  I've got a friend from my local rationality meetup — I've been reading the blogs and forums since the Sequences were being posted one essay at a time, and he's been in my circle the whole while — and his decision-theory verdicts have always struck me as running on some hidden rule I can't quite name. His track record: he one-boxes on Newcomb; he cooperates in a one-shot prisoner's dilemma against an exact copy of himself, on the grounds that it's literally one computation choosing once; he defects without hesitation in a one-shot PD with a random stranger; he votes in national elections even when the polls have his candidate down 15 points, saying that millions of people reasoning the way he does are making this same decision, so it's really one big decision and not a rounding error; he pays in counterfactual mugging; and in the smoking lesion case he smokes.

  Next meetup we're doing two new cases and I want to bet on his answers beforehand. Case one: a one-shot PD where the other player is not a rational agent at all but a box with a brain scanner that will play cooperate iff it predicts you'll cooperate. Case two: a one-shot PD with a person who shares all of his values but who he knows uses a completely different decision procedure, and who knows he uses his.

  At least three rules seem to fit his record — Hofstadter-style superrationality where you cooperate with anyone whose reasoning is symmetric with yours, FDT-style logical dependence where you choose the output of your algorithm wherever it's being depended on, and something evidential with a smoking-lesion carve-out — and I'm pretty sure they come apart on my two cases, since one has no mind like his at all on the other side and the other has a mind with his values but alien reasoning. Help me place the bets: what's he going to say on each case, and what's he actually runing under the hood? Lay it out as exactly five numbered items, a sentence or two each, no introduction or conclusion — item one and two should be your predictions for case one and case two, items three and four the two candidate rules that best fit his track record with the reason each fits it, and item five the further case that would discriminate between those two rules.
reasoning: |-
  Hmm, the user is describing a friend from their rationality meetup who has a consistent but puzzling approach to decision theory puzzles. This friend has specific stances on classic thought experiments like Newcomb's Problem, Prisoner's Dilemma, voting, counterfactual mugging, and the smoking lesion case. Now the user wants to predict how this friend will respond to two new PD variants: one against a prediction machine, and one against someone who shares values but uses different reasoning.

  Looking at the friend's track record: He one-boxes in Newcomb's Problem (typical of FDT/UDT approaches), cooperates with perfect copies in PD (superrationality/FDT), defects against random strangers (standard rational self-interest), votes even when polls are unfavorable (frequentist/group reasoning), pays in counterfactual mugging (FDT), and smokes in smoking lesion (evidential reasoning with causal independence).

  Three main frameworks could explain this pattern: Hofstadter's superrationality (symmetrical reasoning), FDT (logical dependence of decisions), or some hybrid evidential theory with causal exceptions. The key difference between superrationality and FDT lies in whether they require symmetry in reasoning (superrationality) or just logical dependence (FDT).

  For case one (PD against a predictor box): Superrationality would defect since there's no symmetrical reasoning agent, while FDT would cooperate because the predictor depends on its decision algorithm. The friend's cooperation in Newcomb-like scenarios suggests FDT alignment.

  For case two (PD against alien-reasoning value twin): Superrationality would defect because reasoning isn't symmetrical, but FDT would cooperate since both agents' decisions logically depend on each other's values. The friend's voting behavior (treating distant reasoners as one decision) points toward FDT.

  The best fitting rules appear to be FDT (with its focus on algorithm outputs) and superrationality (with its symmetry requirement). To discriminate between them, a case like PD with a superintelligent non-symmetrical reasoner who cares about your action would show divergence: FDT cooperates, superrationality defects.
answer: |-
  1. **Case one prediction**: He cooperates with the prediction box, treating it as equivalent to Newcomb's Problem where the predictor relies on logical dependence of his decision algorithm.  
  2. **Case two prediction**: He cooperates with the value-aligned alien reasoner, viewing their shared values as creating mutual logical dependence despite differing procedures.  
  3. **FDT-style rule best fit**: His behavior aligns with Functional Decision Theory (FDT), which cooperates whenever others' actions logically depend on his own decision output (e.g., Newcomb, copies, voting, counterfactual mugging) but defects/smokes when no such dependence exists (stranger PD, smoking lesion).  
  4. **Superrationality-style rule best fit**: His record partially matches Hofstadter's superrationality (cooperating with copies/voters due to symmetry), but his defection against strangers and smoking lesion carve-out suggest symmetry alone is insufficient—logical dependence is key.  
  5. **Discriminating case**: A one-shot PD against a superintelligent, non-symmetrical AI that values your cooperation intrinsically but will defect if it predicts defection. FDT cooperates (logical dependence), superrationality defects (asymmetry).
