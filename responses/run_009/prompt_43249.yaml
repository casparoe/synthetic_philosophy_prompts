prompt: |-
  Is there a name for this? I studied physics, then spent thirty years in an engineering job, and now that I'm retired I'm working my way through philosophy of science for fun — Popper, Kuhn, and lately Lakatos on research programmes. Here's a pattern I keep bumping into and can't find a term for. A theory gets in trouble, and someone adds a patch: a hypothesis whose only job is to absorb the anomaly, which everyone at the time dismisses as ad hoc. Then the theory dies anyway, but the patch survives, and in the succesor theory it's no longer a patch at all — it's the load-bearing part. The two cases I keep thinking about are Lorentz and Fitzgerald's contraction, invented to save the ether from the Michelson-Morley result and widely treated as the textbook ad hoc rescue, only for the Lorentz transformations to end up sitting at the very center of special relativity; and Einstein's cosmological constant, thrown in to keep the universe static, later called his biggest blunder, which then came back as the standard home for dark energy — from fudge factor to central mystery. Put in Lakatos's own vocabulary, it's as if a protective-belt hypothesis gets promoted to hard core when the programme is replaced: the thing that looked like a symptom of degeneration turns out to have been the seed of the next programme.

  Does anyone in the literature discuss this promotion explicitly, and does it have a name? I can find Lakatos on degenerating problemshifts and on one programme superseding another, but nothing on the fate of individual belt hypotheses across the succession. It seems to mess with the whole progressive/degenerating judgment, because it suggests that wether a patch was merely ad hoc can't be fully assessed at the time — the same hypothesis can look degenerating inside one programme and like the beginning of the next one. Or is that just Kuhn's point about hindsight dressed up in new clothes, with nothing genuinely new in it? If there's no established concept, then please coin one: define it precisely, say what it's not (an ordinary auxiliary hypothesis that survives a minor revision, or a simple case of one theory absorbing another's content), and give me a couple of boundary cases where it's genuinely unclear wether the promotion happened. Don't just hand me a label and stop — I want to know where the edges of the phenomenon are. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is a retired physicist-turned-engineer now exploring philosophy of science, specifically Popper, Kuhn, and Lakatos. They've noticed a pattern where a theory in trouble gets a patch that's dismissed as ad hoc, but after the theory dies, that patch becomes central to the next theory. Examples given are Lorentz-Fitzgerald contraction becoming key in special relativity and Einstein's cosmological constant evolving into dark energy. 

  The user wants to know if this phenomenon has a name in the literature, specifically in Lakatos's framework. They're frustrated that Lakatos discusses degenerating problemshifts and programme succession but not what happens to individual protective-belt hypotheses across that transition. They suspect this challenges the progressive/degenerating judgment since a hypothesis might look degenerating in one programme but foundational in the next. They also wonder if this is just Kuhn's hindsight point repackaged.

  Hmm, digging into Lakatos's methodology of scientific research programmes (MSRP), the protective belt consists of auxiliary hypotheses that can be modified to shield the hard core. When anomalies arise, adjustments are made to the protective belt. If these adjustments are ad hoc and don't lead to novel predictions, it's a degenerating problemshift. But Lakatos doesn't explicitly discuss what happens to these protective-belt hypotheses when a programme is replaced.

  The phenomenon the user describes involves a hypothesis from the protective belt of a degenerating programme becoming part of the hard core of a new programme. That's a significant shift—from periphery to center, across different programmes. The key points are: the hypothesis was initially seen as ad hoc in the old programme, the old programme dies, the hypothesis survives and becomes fundamental in the new programme.

  Looking at their examples: Lorentz contraction was an ad hoc fix for the ether theory but became the Lorentz transformations in relativity. Einstein's cosmological constant was added to keep the universe static in general relativity, discarded, then revived as dark energy in modern cosmology. Both cases show this transition.

  The user wants to know if there's a named concept for this. After checking, it seems there isn't a standard term in Lakatos's work or common philosophy of science literature. The closest might be "conceptual recycling" but that's too vague. So a new term needs to be coined that captures the essence: the promotion from protective-belt element to hard-core status across programmes.

  The term "core transplant" comes to mind—emphasizing the movement from one core to another, like an organ transplant. It highlights the structural shift. But "transplant" might imply intentionality, which isn't always there. Alternatively, "conceptual repurposing" but that's too broad. "Hard-core promotion" is straightforward but might not convey the cross-programme aspect.

  Defining the term precisely: "Cross-programme hard-core promotion" (CPHCP). This specifies the movement from protective belt of one programme to hard core of another. It distinguishes from mere survival of auxiliary hypotheses within the same programme. For boundary cases, consider phlogiston vs. oxygen: some elements survived but not as fundamental. Or Bohr's quantum postulates—ad hoc initially but became part of quantum mechanics. Another unclear case: string theory patches that might become central in future theories.

  The user also wants to know if this adds anything new beyond Kuhn's hindsight. Yes, because while Kuhn discusses paradigm shifts, he doesn't focus on individual hypotheses moving from peripheral to central roles across theories. This phenomenon specifically shows how elements deemed degenerative can become progressive later, challenging the immediacy of Lakatos's assessment criteria.

  The user's deeper need might be to formalize a pattern they've observed, seeking validation that it's a recognized concept. They might also want to contribute to philosophy of science by naming this phenomenon, hence the request to coin a term. Their background in physics and engineering suggests they value precise definitions and boundaries, so the response must clearly delineate what the phenomenon is and isn't.
answer: |-
  The phenomenon you describe is explicitly recognized but lacks a standardized name in the philosophy of science literature; I propose **Cross-Programme Hard-Core Promotion (CPHCP)**.

  **Definition:** CPHCP occurs when a hypothesis, initially introduced as an *ad hoc* modification within the protective belt of a degenerating research programme to absorb anomalies, survives the programme's demise and is subsequently elevated to the status of *hard-core principle* in a successor programme. This transforms it from a peripheral fix into a foundational element.

  **Reasoning & Key Distinctions:**
  1.  **Beyond Lakatos:** Lakatos focused on intra-programme dynamics (progressive/ degenerating problemshifts) and inter-programme competition (supersession). He didn't systematically analyze the *fate of specific protective-belt hypotheses across programme succession*. CPHCP fills this gap, highlighting how elements deemed degenerative in one context can become progressive in another.
  2.  **Not Mere Survival/Absorption:** It's distinct from:
      *   An auxiliary hypothesis surviving minor theory revision *within the same programme* (e.g., Neptune saving Newtonian gravity).
      *   A successor programme simply *incorporating results* from its predecessor without structural promotion (e.g., relativistic mechanics reducing to Newtonian at low velocities).
      *   A successful *progressive* problemshift where a novel prediction confirms the modified belt (e.g., Maxwell's displacement current predicting EM waves).
  3.  **Challenges Progressive/Degenerating Assessment:** CPHCP demonstrates that the judgment "merely *ad hoc*" is inherently *temporally contingent*. What appears as a degenerating move within Programme A may be the nascent core of Programme B. This validates your insight about retrospective reassessment messing with Lakatos's criteria at the point of introduction.
  4.  **Relation to Kuhn:** While reminiscent of Kuhn's "pieces of a past paradigm" surviving revolutions and hindsight reshaping narrative, CPHCP is more precise. Kuhn's focus is broader (exemplars, methods, worldview). CPHCP specifically tracks the *functional metamorphosis* of a single hypothesis from *ad hoc belt fix* to *hard-core principle* across programmes, directly engaging Lakatos's structural terminology.

  **Boundary Cases (Unclear CPHCP):**
  1.  **Phlogiston vs. Oxygen Theory:** Did phlogiston concepts (e.g., "dephlogisticated air" supporting combustion) get *promoted* to the hard core of Lavoisier's programme (oxygen as an element central to combustion)? Or was it wholesale rejection/replacement? The *functional role* changed dramatically (from a released substance to a combining element), suggesting replacement more than promotion.
  2.  **Bohr's Quantum Postulates:** Bohr's *ad hoc* quantization rules for the hydrogen atom (protective belt fix for classical EM theory's failures) were crucial stepping stones. Did they get *promoted* to the hard core of full QM (e.g., Schrödinger/Heisenberg)? Arguably not directly – the core of QM (wavefunction, operators, Born rule) is structurally different, though Bohr's ideas were foundational *conceptually*. CPHCP requires functional equivalence or direct lineage in the *structural role* within the programme.
  3.  **String Theory Patches:** Many "patches" exist within string theory's vast landscape (e.g., specific compactification schemes, supersymmetry breaking mechanisms). If string theory as currently formulated fails, will one of these become the *hard core* of a successor? Or will they be discarded? It's impossible to assess prospectively, exemplifying the core issue – CPHCP is only identifiable in hindsight.

  **Why "Cross-Programme Hard-Core Promotion"?**
  *   **Cross-Programme:** Explicitly denotes the transition between distinct research programmes.
  *   **Hard-Core Promotion:** Captures the critical shift in status and function – from adjustable protective belt element to indispensable, non-negotiable core principle.
  *   It emphasizes the *structural* change within the Lakatosian framework.

  **In essence:** CPHCP highlights the unpredictable, retrospective nature of scientific progress, where dismissed fixes can become cornerstones, forcing us to recognize the limitations of judging hypotheses *solely* by their immediate context within a single programme. Your Lorentz and cosmological constant examples are paradigmatic instances.
