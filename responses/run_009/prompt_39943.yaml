    - V5: Death (cap) cannot be outweighed by broken legs (sub-cap). Lower confidence due to cap fuzziness.

  All principles fit the verdicts by incorporating aggregation for minor harms, non-aggregation for extremes, and compounding for duration. Principle 1 uses a sharp threshold, Principle 2 uses compounding to simulate discontinuity, and Principle 3 uses caps.

