    - V4: Compounding applies (same harm); disvalue(50y) > 10 * disvalue(5y) as *k*^45 > 10 (e.g., *k* ≈ 1.16).
    - V5: Death (extreme) cannot be outweighed by broken legs (sub-threshold). Lower confidence due to death's qualitative difference.

  #### Principle 2: Compounding-Dominated Aggregation
  - **Core idea**: All harms aggregate, but disvalue compounds so strongly with duration for the same harm that extreme durations dominate any number of brief instances. No discontinuity; aggregation is always possible, but compounding can make it practically impossible for large durations.
  - **Aggregation**: Linear for harms of the same duration and type, but brief harms of the same type as a prolonged harm require astronomical numbers to outweigh due to compounding.
  - **Disvalue**: For same-harm durations, disvalue is convex (e.g., exponential: *c* * k^t*). For different harms, disvalue is additive with diminishing returns at scale (not linear).
  - **V3 hesitation**: For migraines (different harm), she pauses because diminishing returns make aggregation less effective at large scales, but compounding for the agony prevents flipping. Uncertainty arises from not knowing if migraines' disvalue scales similarly.
  - **Fits all verdicts**:
    - V1: Paper-cuts aggregate linearly with diminishing returns; 5e9 is insufficient for saturation.
    - V2: Week-flu aggregates linearly; 10,000 > 52 suffices.
    - V3: Migraines (different harm) aggregate with diminishing returns, but even googolplex cannot match compounded 50-year agony. Hesitation due to scale, but no flip because migraines lack compounding.
    - V4: Compounding dominates; disvalue(50y) > 10 * disvalue(5y) as above.
    - V5: Death has near-infinite disvalue; broken legs aggregate with diminishing returns but cannot reach it. Lower confidence as death may not compound.

  #### Principle 3: Hybrid Duration-Intensity Caps
  - **Core idea**: Disvalue caps per person based on harm duration and intensity. Brief harms aggregate linearly, but long-duration harms hit a cap that prevents further aggregation. Compounding occurs only for uncapped harms.
  - **Caps and compounding**: Harms under a duration cap (e.g., <1 year) aggregate linearly; those over the cap (e.g., >10 years) are "capped" and cannot be outweighed by sub-cap harms. Compounding applies only to uncapped same-harm durations. Death is a separate cap.
  - **Aggregation**: Linear for sub-cap harms; no aggregation across caps.
  - **Disvalue**: For same-harm uncapped durations, disvalue compounds; capped durations have fixed max disvalue.
