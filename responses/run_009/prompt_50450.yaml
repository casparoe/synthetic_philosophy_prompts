answer: |-
  ## The Bem Precognition Controversy: A Case Study in Statistical Frameworks and Reform

  This case study examines Daryl Bem's 2011 publication ("Feeling the Future") claiming experimental evidence for precognition (psi), the subsequent Bayesian reanalysis, widespread replication failures, and the resulting reform movement through the lens of the frequentist-Bayesian debate. We proceed according to your four tasks.

  **1. Mapping the Frameworks: Licenses, Evidence, Hypotheses, Procedures, and Replication**

  *   **Frequentist Framework (NHST):**
      *   **Original License Claimed:** Bem's statistically significant p-values (e.g., p < .01 in several experiments) were intended to license the rejection of the null hypothesis (H₀: No precognition effect, effect size δ = 0) *within the context of the specific statistical test procedure employed*. The core claim is: *"If H₀ were true, data as extreme or more extreme than observed would be very improbable (< α, often 0.05) under the specific sampling and analysis plan declared (or assumed). Therefore, we reject H₀."* The license is explicitly **not** "H₁ (precognition) is true" or even "H₁ is probable," but rather that the data are surprising under H₀ given the procedure.
      *   **Evidence:** The data (D) as summarized by the test statistic (e.g., t-value, F-ratio) calculated according to the pre-specified procedure.
      *   **Hypothesis:** Explicitly tested: Point null H₀ (δ=0). Implicit alternative H₁ (δ ≠ 0, or sometimes δ > 0 for directional tests). The framework itself doesn't quantify evidence *for* H₁ relative to H₀, only evidence *against* H₀.
      *   **Procedure:** The specific sequence: Sampling plan (N per experiment), experimental manipulations, primary outcome measure, statistical test chosen *a priori* (e.g., one-sample t-test against 0), α level. The advertised error guarantee (Type I error ≤ α) applies *only* if this exact procedure is fixed before data collection and adhered to rigorously.
      *   **Failed Replication:** Primarily challenges the **validity of the original procedure's error guarantees**. If numerous rigorous replications using similar procedures consistently fail to reject H₀ (or show much smaller effects), it suggests:
          1.  The original significant result was a Type I error (false positive) *under the assumed procedure*.
          2.  The *actual* procedure used (potentially involving undisclosed researcher degrees of freedom like optional stopping, outcome switching, or analysis tweaking) resulted in an *inflated* Type I error rate, violating the advertised guarantee. The replication failures demonstrate that the original result was not reliable *in the long run* under the intended or *de facto* procedure.

  *   **Bayesian Framework:**
      *   **Original License Claimed:** Bayesian reanalysis (notably by Wagenmakers et al., 2011) argued that Bem's data did **not** license an increase in the posterior probability of the psi hypothesis (H₁) relative to the null (H₀) or a reasonable alternative. The core Bayesian claim is: *"The probability of the hypothesis given the data (P(H|D)) depends on its prior probability (P(H)) and the likelihood (P(D|H))."* Significance does not guarantee a high posterior probability or a substantial Bayes Factor (BF = P(D|H₁)/P(D|H₀)).
      *   **Evidence:** The entire dataset (D). Strength of evidence is quantified by the Bayes Factor (BF), comparing the probability of D under H₁ vs. H₀. A BF > 1 supports H₁; BF < 1 supports H₀.
      *   **Hypothesis:** Explicitly compared models. H₀: δ = 0. H₁: A model specifying a non-zero effect (e.g., δ > 0, often modeled with a prior distribution, like a Cauchy prior). The posterior probability P(H₁|D) = [P(H₁) * BF] / [P(H₁) * BF + P(H₀)] directly quantifies relative belief.
      *   **Procedure:** The sequence of data collection and analysis ideally doesn't affect the posterior *if all data is included*. The posterior update depends only on the prior and the total likelihood of the *observed* data. Optional stopping, in principle, does not bias the BF (though complex stopping rules can complicate calculations).
      *   **Failed Replication:** Provides **new data for Bayesian updating**. A replication study yielding new data D_rep:
          1.  Can be analyzed to compute a BF_rep for that specific study.
          2.  More importantly, D_rep is incorporated into the total evidence. The posterior probability P(H₁|D, D_rep) is updated from P(H₁|D) using BF_rep and the prior based on D. Multiple failed replications (BF_rep consistently < 1) will steadily decrease the posterior probability of H₁, regardless of why the original result occurred. The posterior directly reflects the cumulative evidence.

  **2. Illuminating Features: Where Each Framework Adds Value**

  *   **Frequentist Illumination:**
      *   **Meehl's Point & Power:** Meehl's observation that H₀ (δ *exactly* 0) is almost always false in social sciences is devastating for *ritualistic* NHST. Bem's experiments, using standard psychology sample sizes (often 50-150 participants per experiment), had moderate power *only* for detecting surprisingly large effects. Under Meehl's view, finding p < .05 with typical power (~0.35-0.60 for medium effects) is unsurprising even if the *specific* theoretical effect (psi) is false, because *some* small systematic bias or confound (δ ≠ 0) likely exists. This explains the epidemic of false positives *without* needing to invoke fraud – it's a consequence of low power combined with testing near-always-false point nulls. Frequentist power analysis directly quantifies this vulnerability.
      *   **Error Control (Idealized):** The *ideal* of pre-specifying a procedure with known long-run error rates (Type I/II) provides a clear, objective benchmark for decision-making *if adhered to*. This ideal motivated reforms like preregistration and large samples (increasing power).

  *   **Bayesian Illumination:**
      *   **BF vs. p-value Asymmetry in Bem:** Wagenmakers' reanalysis calculated Bayes Factors for Bem's experiments. Crucially, even for experiments with significant p-values (e.g., p = .01), the BF often hovered around 1 ("anecdotal" evidence) or even slightly favored H₀ (BF < 1). This starkly contrasted with the "highly significant" NHST interpretation. This asymmetry highlights a key point: **A small p-value does not necessarily imply strong evidence for H₁.** It only indicates the data is unlikely *if H₀ is exactly true*. The BF incorporates the *predictiveness* of H₁ via the prior on δ. Under H₁, very large effect sizes (like those Bem sometimes found) were deemed *a priori* implausible by the chosen prior, weakening the evidence relative to the p-value. This doesn't "prove" Bayes is correct, but it demonstrates that NHST can overstate evidence for an alternative hypothesis, especially when the alternative is vague or the effect size is surprisingly large.
      *   **Optional Stopping (Theoretical Resilience):** While likely not the *primary* issue in Bem's work (though researcher DF was rampant), the Bayesian argument that optional stopping doesn't inherently invalidate inference (because the posterior depends only on the data observed, not the stopping rule) addresses a genuine weakness in *common practice* NHST. If researchers peek and add subjects until p < .05, the actual Type I error rate inflates dramatically. The Bayesian claim of theoretical immunity to this (assuming correct model/likelihood) is a valid theoretical point, even if practical calculation challenges remain.

  *   **What the Asymmetry Shows (and Doesn't):** The Bem BF/p-value disparity doesn't inherently favor one *philosophy*. It exposes a limitation of interpreting p-values as direct measures of evidence for H₁. It shows that incorporating prior plausibility (via the prior or BF model comparison) can temper enthusiasm for surprising findings. However, it also highlights the subjectivity of the prior – a different prior favoring larger effects might have yielded a BF >> 1. The frameworks offer different *interpretations* of the same data, with the BF providing a more direct (but prior-dependent) quantification of relative evidence strength.

  **3. Silence and Misdescription: Where the Frameworks Don't Apply**

  *   **The Core Breakdown: Researcher Degrees of Freedom (RDF) and Publication Bias:** The primary engine of the replication crisis was not flawed *inference per se*, but flawed *research practice* orthogonal to the statistical framework:
      *   **RDF (p-hacking):** Trying multiple analyses, outcome measures, exclusion criteria, or stopping points until a significant result is found. This fundamentally corrupts the *procedure* whose error rate the frequentist seeks to control. It also violates the assumption of the Bayesian that the analysis model matches the data generation process. **Neither framework has anything to say about a result obtained by secretly trying 20 analyses and reporting only the one with p<.05 or a favorable BF.** Both frameworks assume honest reporting of the analysis plan.
      *   **Selective Publication:** Journals publishing only significant (p<.05) or "novel" positive results, while filing away non-significant replications or failures. This distorts the *evidence base* available for *any* form of inference, frequentist or Bayesian. Neither prior probabilities nor long-run error rates can correct for a systematically censored literature.
      *   **Fabrication:** Outright fraud is simply outside the scope of statistical inference frameworks. No amount of prior skepticism (Bayes) or stringent alpha (Freq) can detect perfectly forged data that conforms to expectations.

  *   **Preregistration: An Awkwardness for Bayesians?**
      Preregistration, a cornerstone reform, mandates declaring hypotheses, methods, and analysis plans *before* data collection. This is naturally justified in frequentist terms: it fixes the procedure, restoring the meaning of the error rate guarantees (Type I error control).
      For a **subjective Bayesian**, this poses a challenge: Rational updating via Bayes' theorem depends only on the prior and the likelihood of the *observed data*. The order in which intentions are formed or analyses are contemplated should be irrelevant. Demanding a fixed analysis plan seems irrational from this perspective – why not use all available information (including post-hoc insights) to model the data best?
      *   **Possible Bayesian Justifications:**
          1.  **Combating Bias as a Source of Misfit:** Preregistration combats RDF. RDF means the *reported* analysis/model likely doesn't match the *actual* data-generating process. The chosen model/likelihood used in the Bayesian analysis is corrupted. Preregistration aims to align the analysis model with the process, improving model fit and the validity of the posterior.
          2.  **Prior Elicitation:** Declaring the analysis plan *before* seeing the data is a way to formalize and commit to the model (including priors) based on theoretical expectations, preventing the prior from being subtly influenced by the data (another form of bias).
          3.  **Ensuring Predictiveness:** Preregistration forces a commitment to a specific, falsifiable prediction derived from the theory, making the test more severe (in a Popperian sense) and thus more informative for updating beliefs.
      While not flowing as naturally as from frequentism, a Bayesian *can* justify preregistration instrumentally as a necessary guard against pervasive cognitive biases and practices that corrupt the data/model relationship upon which *both* frameworks ultimately rely. The justification is about ensuring the *inputs* (data generation, model specification) to the Bayesian engine are valid, not about changing the engine itself.

  **4. What the Episode Reveals About the Statistical Dispute**

  The Bem episode and the ensuing replication crisis best support reading **(c): The crisis shows that the whole frequentist–Bayesian framing was largely orthogonal to what broke, and that the reforms that worked required at most the machinery, not the philosophy, of either camp.**

  *   **Rationale:**
      *   **The Root Cause:** The crisis stemmed from institutional practices (RDF, publication bias, incentive structures promoting novelty over rigor) and methodological sloppiness (underpowered studies, lack of precommitment), not primarily from choosing NHST over Bayes. Researchers adept at RDF could likely have manufactured Bayes Factors > 3 ("substantial" evidence) as easily as p < .05 if BF had been the gatekeeper.
      *   **The Effective Reforms:** Preregistration, large-scale replication (consortia), data/code sharing, and emphasis on effect sizes with CIs target the *practices* that corrupted evidence generation and reporting. These reforms are largely framework-agnostic:
          *   Preregistration benefits frequentist error control *and* helps ensure honest Bayesian model specification.
          *   Large samples improve frequentist power *and* increase the precision of Bayesian posteriors (shrinking the influence of the prior).
          *   Reporting effect sizes with CIs is compatible with both frameworks (though interpreted differently).
          *   Replication consortia provide data for frequentist meta-analysis *and* Bayesian updating.
      *   **Bayesian Diagnosis, Agnostic Cure:** While early insightful *diagnoses* often used Bayesian arguments (e.g., Ioannidis' "Why Most Published Research Findings Are False," which uses Bayesian positive predictive value), the *implemented solutions* adopted by the reform movement (OSF, RRs, COS) are not inherently Bayesian. They focus on transparency, rigor, and scale, not imposing a specific inferential philosophy. The machinery (power analysis, CIs, Bayes Factors, meta-analysis) is used pragmatically.

  *   **Supporting Counterfactuals (How Other Readings Could Hold):**
      *   **For (a) Crisis Confirms Bayesianism:** Had the primary failure been that well-conducted, preregistered, high-power NHST studies *routinely* yielded p < .05 for effects that subsequent Bayesian updating (or reality) showed were false, *and* that Bayesian analyses of the same initial data consistently gave more reliable indications (e.g., low BF despite low p), then the crisis would support Bayesianism. While Bem's case *illustrated* the p-value/BF disparity, the crisis was systemic and driven by bad practices affecting *any* method. Had Bayesian journals with BF thresholds been the norm *and* succumbed equally to RDF/publication bias, producing an equal crisis of false "substantial" evidence claims, reading (a) would be undermined.
      *   **For (b) Crisis Indicts Degenerate Practice, Not Frequentism:** Had the crisis *only* occurred in fields where RDF and publication bias were rampant, while fields adhering strictly to pre-specified protocols and publishing all results maintained reliable NHST-based literatures, then reading (b) would be strong. The Bem case itself might fit this (his methods involved RDF). However, the crisis affected even fields *attempting* good NHST practice, revealing how vulnerable the ritualistic *interpretation* (p < .05 = "real effect") is to Meehl's point and low power, even without overt p-hacking. Furthermore, reforms like preregistration *were* needed to make pure frequentism viable. If truly strict, uncorrupted frequentist practice had been widespread and demonstrably reliable *before* the crisis, reading (b) would be more compelling.

  **Conclusion:**

  The Bem psi episode and the replication crisis it catalyzed provide a rich case study. While illuminating specific asymmetries between frequentist and Bayesian interpretations (BF vs p-value, optional stopping, Meehl's point), the crisis fundamentally exposed systemic failures in research practice – researcher degrees of freedom, selective publication, and inadequate methods – that corrupted the evidence base *before* formal statistical inference began. The most effective reforms (preregistration, large-scale replication, transparency) address these upstream issues and are largely compatible with both statistical philosophies, utilizing their machinery pragmatically. The episode argues less for the supremacy of one framework over the other and more for the fundamental importance of rigorous, transparent, and unbiased evidence generation as the foundation upon which *any* valid statistical inference depends. The statistical dispute provides valuable lenses for diagnosis, but the cure required reforming the practice of science itself.
