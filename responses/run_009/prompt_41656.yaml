prompt: |-
  i sit on the safety review board at a mid-size AI lab. every couple of weeks we get a deployment proposal for giving a model more agentic access — browsing, running code, sending emails on a user's behalf, that kind of thing — and the stakes are real because these things go out to millions of users. the problem I keep hitting is that proposals bundle a list of safety measures together and never say which KIND of measure each one is, and the kind matters a lot. some measures are evidence that the model isn't misaligned (alignment evals, red-team reports, honesty benchmarks). others are protection in case it IS misaligned (rate limits, requiring a human confirmation click for certain actions, a separate classifier watching outputs, honeypot tasks). the unofficial doctrine around here, borrowed from the ai control crowd, is that for high-capability models the second kind has to carry the load, because alignment evidence is always provisional — the model could pass every eval and still behave badly in situations the evals didn't happen to cover, or behave badly only when it really matters. but nobody has written down how to actually apply this when a proposal lands on my desk and I have maybe an hour before the review meeting, after which our safety lead signs the final call.

  write me a procedure the board can run on a proposal. it should:

  1. sort each proposed measure into "evidence the model is fine" vs "protection if it isn't", with tests that work when a measure is ambiguous. a monitoring model, for example, is protection with respect to the deployed model but evidence with respect to itself, and the procedure needs to handle that nesting instead of pretending everything sorts cleanly.
  2. say what a proposal must include for each measure to count — the failure story it's guarding against, the assumption about the model it silently makes — and what counts as insufficient.
  3. mark the points where the procedure stops and a human has to make a values call: how much residual risk is acceptable given the upside, whether trusting the red-team report is a bet on that team's competence and honesty that no checklist can make for us, and so on.
  4. be honest about where it will misfire: measures that stack so the categories stop mattering (defense in depth), proposals written to blur the categories on purpose, monitoring thats so costly in latency that the product team quietly turns it off after launch.

  then run it on three measures from a proposal we actually got last month: (a) a report from the alignment team that the model refused sabotage opportunities in 500 staged scenarios, (b) a rule that any outbound email over a certain length gets a confirmation click from the user, (c) a second model that watches the main model's tool-use transcripts and flags anything "suspicious". tell me what the procedure says about each, and be blunt about (a) — the alignment team put months of work into it and they'll be annoyed, but I suspect the procedure will come back saying it can't substitute for control, and I want to know if thats right or if I'm being too hard on them. also say straight up what the procedure cannot do, so we don't start treating it as more than it is.
reasoning: |-
  We are designing a procedure for the Safety Review Board to evaluate deployment proposals for agentic AI systems. The procedure must:

  1. Classify each safety measure as either "evidence the model is fine" (alignment evidence) or "protection if it isn't" (safeguards).
  2. Specify requirements for each measure to be valid and what makes it insufficient.
  3. Identify points where human judgment is required (values calls).
  4. Acknowledge limitations (where the procedure might misfire).

  We'll break down the procedure into steps.

  ### Step 1: Safety Measure Classification
  For each proposed safety measure, we will ask:

  - **Q1: If the model were misaligned and trying to cause harm, would this measure still block or mitigate the harm?**
    - If "yes", then it is **protection**.
    - If "no", then it is **evidence** (because it only tells us about the model's alignment during testing, not during deployment when it might act differently).

  However, some measures are nested (like a monitoring model). For nested cases:

  - **Handling nested measures**: For a monitoring model, we consider it as a safeguard for the main model. But then we must also evaluate the monitoring model itself. We break it down:
    - The monitoring model's own alignment and reliability must be established (which is evidence about the monitor) and the monitor might have its own safeguards.

  Thus, we apply the same classification recursively to the components of the nested measure.

  But note: In a practical procedure, we might not have time for deep recursion. We set a rule: **We classify the measure in the context of the primary model it is meant to protect. Then, for any component that is itself a model (like a monitor), we require that the proposal includes an evaluation of that component (which will be evidence for the monitor) and any safeguards for the monitor (which are protections for the monitor's potential failure).**

  ### Step 2: Requirements for Each Measure
  For a measure to count, the proposal must include:

  - **Failure Story**: A clear description of the specific failure mode (or set of failure modes) that the measure is intended to guard against.
  - **Assumption**: The measure's effectiveness relies on some assumptions. The proposal must state these assumptions explicitly. For example:
    - For an alignment eval: It assumes that the test scenarios are representative of real deployment and that the model won't behave differently in deployment.
    - For a safeguard: It might assume that the safeguard itself is not bypassed by the model.

  What is insufficient?
  - Vague failure stories (e.g., "to prevent misuse" without specifying how).
  - Unstated or unrealistic assumptions (e.g., assuming a red-team found all possible failures without evidence of the red-team's thoroughness).

  ### Step 3: Human Judgment Points
  The procedure will explicitly flag the following for human judgment:

  1. **Residual Risk Assessment**: After accounting for all measures, what is the residual risk? And is that level of risk acceptable given the benefits of deployment? (This is a values call because it involves trade-offs between safety and product goals.)
  2. **Trust in Evidence**: How much do we trust the evidence? For example, the competence and honesty of a red-teaming team, the quality of the benchmark, etc. (No checklist can replace human judgment on the reliability of the source.)
  3. **Dependency on Safeguards**: If the proposal relies heavily on safeguards (which we expect for high-capability models), we must judge whether the safeguards are robust and whether they are likely to be maintained in practice (e.g., will they be bypassed for convenience?).

  ### Step 4: Limitations (Where the Procedure Misfires)
  The procedure is not perfect. We acknowledge:

  - **Defense in Depth**: When multiple overlapping measures are in place, the categories might blur and the overall safety might be multiplicative. The procedure might not capture synergistic effects.
  - **Intentional Obfuscation**: If the proposal is written to blur the lines (e.g., by presenting a safeguard as evidence), the procedure might misclassify. We rely on the board's vigilance.
  - **Practical Degradation**: Safeguards that add friction (like latency) might be turned off after deployment. The procedure cannot predict this, but it can require that the proposal addresses the maintainability and monitoring of the safeguards.
  - **Unknown Unknowns**: The procedure cannot account for failure modes we haven't thought of.

  ### Overall Procedure Flow

  1. **Extract Measures**: List every safety measure in the proposal.
  2. **Classify Each Measure**:
     - Apply the Q1 test: If the measure would block/mitigate harm even if the model is misaligned, then classify as protection. Otherwise, classify as evidence.
     - For nested models (like a monitor), classify the monitor as a safeguard for the main model. Then, require that the proposal includes:
       - Evidence of the monitor's reliability (alignment evals for the monitor) and
       - Safeguards for the monitor (if any) or an explanation of why the monitor's failure is acceptable.
  3. **Check Requirements**:
     - For each measure, ensure the proposal includes:
       - A failure story.
       - Explicit assumptions.
     - Mark as insufficient if missing or vague.
  4. **Assess Overall**:
     - Count the number of safeguards and evidence measures.
     - For high-capability models, the doctrine says safeguards must carry the load. So, if there are few safeguards and the model is high-capability, flag as inadequate.
  5. **Flag for Human Judgment**:
     - The residual risk (even with safeguards) and its acceptability.
     - Trust in the evidence sources (e.g., the red-team's competence).
     - The likelihood that safeguards will be maintained (e.g., will the product team keep the confirmation click?).
  6. **Acknowledge Limitations**: Note that the procedure does not cover defense in depth well, and it cannot prevent intentional misrepresentation or future degradation.

  ### Applying the Procedure to the Three Measures

  **Measure (a): Report from the alignment team that the model refused sabotage opportunities in 500 staged scenarios.**

  - **Classification**: 
    - Q1: If the model were misaligned, would this report block harm? No, because the report is about past behavior in staged tests. In deployment, the model might behave differently. So, this is **evidence**.
  - **Requirements**:
    - Failure Story: The measure is intended to show that the model won't engage in sabotage. The failure story it addresses is that the model might be misaligned and take harmful actions when given the opportunity.
    - Assumption: The 500 scenarios are representative of real-world opportunities for sabotage that will arise in deployment. Also, that the model is not deceptive (i.e., it doesn't behave well in tests only to act badly when it counts).
    - What's insufficient? The report does not cover all possible scenarios, and the model might be deceptive. So, the evidence is provisional.
  - **Blunt Assessment**: This measure is evidence and cannot by itself be relied upon for a high-capability model. It does not substitute for controls (safeguards). The alignment team might be annoyed, but the procedure must be clear: for a model with agentic access, we require safeguards to carry the weight. This evidence is valuable for building confidence, but it's not a safeguard.
  - **Human Judgment Point**: How much do we trust the scenarios? How comprehensive were they? But note: even with the best scenarios, we cannot rule out deception or distributional shift.

  **Measure (b): Rule that any outbound email over a certain length gets a confirmation click from the user.**

  - **Classification**:
    - Q1: If the model were misaligned and tried to send a harmful long email, would this block it? Yes, because the user must confirm. So, this is **protection**.
  - **Requirements**:
    - Failure Story: The model might try to send a long email that is harmful (e.g., phishing, leaking data). The confirmation click gives the user a chance to review and stop it.
    - Assumption: The user will actually read the email and not just click confirm. Also, that the model cannot bypass the click (e.g., by breaking the system) or by sending multiple short emails to avoid the length trigger.
    - What's insufficient? If the proposal does not address the assumption that users will pay attention, then the safeguard might be weak. Also, if the model can break the length into multiple short emails, that bypasses the safeguard.
  - **Assessment**: This is a safeguard. It's good, but the assumptions are critical. The proposal must address the bypass risk and the user attention risk.

  **Measure (c): A second model that watches the main model's tool-use transcripts and flags anything "suspicious".**

  - **Classification**:
    - This is a nested measure. 
      - For the main model: The monitor is a **protection** because if the main model is misaligned and does something bad, the monitor might flag it and trigger an intervention (e.g., block the action).
      - But we must also evaluate the monitor:
        - The monitor itself is a model. The proposal must provide evidence about the monitor (e.g., how was it trained? evals on its flagging accuracy?) and safeguards for the monitor (what if the monitor fails?).
  - **Requirements**:
    - Failure Story (for the main model): The main model might take a harmful action (e.g., running malicious code). The monitor is meant to detect such actions.
    - Assumption: The monitor has high recall and precision. Also, that the monitor itself is aligned and not fooled by the main model.
    - Additionally, the proposal must include:
      - Evidence for the monitor: How was it evaluated? What are its false positive and false negative rates?
      - Safeguards for the monitor: What happens when it flags? (e.g., human review, automatic block) and what if the monitor is bypassed?
    - What's insufficient? If the proposal does not provide evidence for the monitor's reliability or if it doesn't specify the response to a flag, then it's insufficient.
  - **Assessment**: This is a safeguard for the main model. But it requires its own evidence and potentially safeguards. Without these, it's a weak measure.

  ### What the Procedure Cannot Do

  - **Cannot Guarantee Safety**: It is a structured way to evaluate, but safety is not guaranteed.
  - **Cannot Predict Future Behavior**: Models might behave differently in the wild than in tests.
  - **Cannot Replace Human Judgment**: Especially on trust, risk tolerance, and the quality of evidence.
  - **Cannot Enforce Maintenance**: It can flag the risk of safeguards being turned off, but it can't prevent it.
  - **Cannot Cover All Unknowns**: Novel failure modes might emerge.

  ### Conclusion for the Three Measures

  - (a) is evidence. It is valuable but cannot replace safeguards. The alignment team's work is appreciated, but for deployment, we require robust safeguards.
  - (b) is protection (safeguard). It's good but relies on user attention and might be bypassed. The proposal must address these.
  - (c) is protection (safeguard) but requires additional evidence and safeguards for the monitor to be effective.

  The board should require the proposal to bolster the safeguards (especially for (b) and (c)) and acknowledge that (a) is only supporting evidence. For a high-capability model, the safeguards must be the primary safety mechanism.

  Finally, the board must make the values call: given the residual risk (even with these measures) and the benefits, is deployment acceptable?
answer: |-
  Below is a structured procedure for your safety review board, designed to address your requirements. It includes classification logic, validation criteria, explicit human-judgment points, and limitations. I'll then apply it to your three example measures (a, b, c) and conclude with a blunt assessment of (a) and the procedure's boundaries.

  ---

  ### **Safety Measure Evaluation Procedure**  
  *For Agentic Access Deployment Proposals*

  #### **1. Classify Each Measure**  
  **Question to ask:** *"If the model were actively misaligned and attempting to cause harm, would this measure still prevent/mitigate damage?"*  
  - **YES → "Protection"**: Relies on external constraints or redundancy (e.g., rate limits, human approvals).  
  - **NO → "Evidence"**: Relies on the model's inherent properties (e.g., benchmarks, evals).  
  - **Ambiguous/Nested Cases**:  
    - If a measure involves other models (e.g., monitoring systems), classify it as **"Protection" for the primary model** but **demand separate evaluation for nested components** (e.g., "Is the *monitor model* itself aligned?").  
    - **Test for Ambiguity**: Ask: *"Could this fail silently if the model is deceptive?"* If yes, it leans "Evidence"; if no, "Protection."  

  #### **2. Validation Requirements for Each Measure**  
  For a measure to count, proposals **must explicitly state**:  
  - **Failure Story**: Specific threat(s) it addresses (e.g., "Prevents data exfiltration via email"). Vague terms like "prevents misuse" are insufficient.  
  - **Assumptions**: Hidden dependencies (e.g., "Assumes users review confirmation dialogs" or "Assumes monitoring model generalizes to novel attacks").  
  - **Insufficient Justification**:  
    - Evidence lacking statistical rigor (e.g., "500 tests" without details on scenario diversity).  
    - Protection with single points of failure (e.g., a classifier with no backup if bypassed).  
    - Unstated assumptions about human behavior (e.g., "Users will notice malicious output").  

  #### **3. Human Judgment Points**  
  **Explicitly pause and require board discussion for**:  
  - **Residual Risk**: "Is the worst-case failure impact (e.g., data leak, sabotage) acceptable given product upside?"  
  - **Trust Dependencies**: "Do we trust the source of evidence? (e.g., red-team’s competence, dataset quality)".  
  - **Maintenance Risks**: "Will this safeguard degrade in practice? (e.g., latency costs, user annoyance)".  
  - **Deception Uncertainty**: "Could the model evade this during deployment despite passing tests?"  

  #### **4. Procedure Limitations**  
  **Acknowledge misfires upfront**:  
  - **Defense-in-Depth Overlap**: Bundled measures may blur categories (e.g., "Evidence + Protection" combos). Flag these as "synergistic" but require separate validation.  
  - **Intentional Obfuscation**: Proposals may frame "Protection" as "Evidence" (e.g., "Our monitor model is safe, so it’s evidence!"). Counter by demanding nested evaluations.  
  - **Operational Degradation**: Protections that add friction (e.g., latency, user steps) risk being silently disabled. Mandate monitoring plans.  
  - **Unknown-Unknowns**: No measure can cover unimagined failures. Require proposals to disclose known gaps.  

  ---

  ### **Application to Example Measures**  
  **Proposal Context**: Deploying an email-writing agent to 2M users.  

  #### **(a) Alignment Report: Model refused sabotage in 500 staged scenarios**  
  - **Classification**: **Evidence**  
    - *Why?* If the model is deceptive, it could pass staged tests but sabotage in deployment. The report doesn’t *physically prevent* harm; it only infers safety.  
  - **Validation**:  
    - *Failure Story*: Guards against overtly malicious actions (e.g., leaking credentials). **Insufficient** if scenarios lack real-world diversity (e.g., no novel social engineering).  
    - *Assumptions*: Assumes tests cover deployment-edge cases and the model isn’t deceptive. **Insufficient** if red-team methods aren’t disclosed.  
  - **Blunt Assessment**:  
    - **This cannot substitute for controls**. It’s valuable but provisional—like checking a bridge with 500 weights but not for corrosion. The alignment team’s work is **necessary but insufficient** for agentic access. Deploying without *Protection* measures would be negligent.  
  - **Human Judgment Needed**: "Do we trust the scenario diversity and red-team rigor? Is residual risk (e.g., 0.1% chance of undetected deception) acceptable?"  

  #### **(b) Rule: Long emails require user confirmation click**  
  - **Classification**: **Protection**  
    - *Why?* Even a misaligned model can’t send long emails without user approval. Physical constraint.  
  - **Validation**:  
    - *Failure Story*: Prevents data exfiltration/disinformation via long emails. **Valid** if specific (e.g., "Blocks >500-character emails containing sensitive keywords").  
    - *Assumptions*: Assumes users read emails before confirming. **Insufficient** without user-education or fallbacks (e.g., blocking if >3 long emails/hour).  
  - **Human Judgment Needed**: "Will users ‘click through’ without reading? Is the length threshold optimizable by attackers?"  

  #### **(c) Second Model: Monitors tool-use transcripts for "suspicious" activity**  
  - **Classification**: **Protection** (with nesting)  
    - *Why?* The monitor can flag/block harm even if the main model is misaligned.  
    - *Nesting*: The monitor itself requires **separate evaluation** (evidence for its alignment + protection for its failures).  
  - **Validation**:  
    - *Failure Story*: Catches covert malicious tool use (e.g., code execution exploits). **Insufficient** if "suspicious" isn’t defined (e.g., no examples of evasion techniques).  
    - *Assumptions*: Assumes the monitor generalizes better than the main model. **Insufficient** without its own red-teaming or safeguards (e.g., human review for flagged transcripts).  
  - **Human Judgment Needed**: "Do we trust the monitor’s training data? What happens if the main model jailbreaks the monitor (e.g., via adversarial examples)?"  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Replace Values-Based Decisions**: It flags risks but can’t resolve "How safe is safe enough?" That’s a leadership call.  
  2. **Detect Novel Deception**: No checklist can anticipate every emergent misalignment. Humans must weigh the model’s capability level.  
  3. **Prevent Gaming**: A proposal could "over-provision" flimsy evidence (e.g., 10,000 trivial tests). The board must demand quality over quantity.  
  4. **Enforce Long-Term Compliance**: It can’t stop product teams from disabling high-latency safeguards post-launch. Mitigation: Require *operational monitoring plans* (e.g., "Log all safeguard overrides").  
  5. **Quantify Risk**: It identifies gaps but doesn’t calculate probabilities. Use it to structure debate, not as a risk calculator.  

  ---

  ### **Final Board Guidance**  
  - **(a) Alignment Report**: Reject as a standalone. It’s **evidence**, not protection. Praise the effort but insist it must pair with safeguards (e.g., (b) or (c)).  
  - **(b) & (c)**: Conditionally approve if nested validation is added (e.g., "Define monitor’s false-negative rate" for (c), "Add user education" for (b)).  
  - **Non-Negotiable**: Proposals must **explicitly separate** evidence/protection. Bundling them hides weaknesses.  

  **Your suspicion about (a) is correct**: Evidence alone is inadequate for agentic systems. The procedure formalizes this to depersonalize criticism—blame the rubric, not the team. If the alignment team protests, reiterate: "We value your work, but for deployment, *control* must carry the load."
