prompt: |-
  I've been reading a popular book on decision theory, and its chapter on the value of information left me uneasy. It summarizes Good's theorem roughly like this: 'Good proved back in the 1960s that information can never make a decision-maker worse off. Take any decision made under uncertainty; then the expected value of choosing after receiving a relevant piece of evidence is always at least the expected value of choosing without it, and typically higher. So a rational agent always wants more information — declining a free look at the answer is like declining free money. And because this is a theorem rather than a rule of thumb, it follows from the axioms of probability alone, with no assumptions about human psychology.' The book then draws a practical moral: since information can't hurt, a rational decision-maker should always gather every available piece of data before deciding, and an executive who makes a snap judgment when more evidence could have been collected has acted irrationally.

  Something about this seems too strong to me. For one thing, I can think of what looks like a counterexample: if I've bought a lottery ticket, finding out that I lost clearly makes me worse off than staying in suspense — doesn't that show information can hurt? Maybe I'm just confusing the theorem with something else, but I don't have the background to say where the summary goes wrong, if it does.

  Could you audit this for me? Go through the summary sentence by sentence and tell me what a decision theorist would accept as stated, what they'd regard as a loose but forgivable popularization, and what is a genuine misstatement. In particular, I'd like to know: does the theorem really say that information can't make you worse off, or is there a distinction being blurred between how things look before you get the evidence and how they look after — and does the answer dissolve my lottery example, or does that example expose a real limitation? Does the proof rely on more than the axioms of probability, e.g., on how the agent uses the information once they have it? And does the book's practical moral — always collect all available data before acting — actually follow from the theorem, or does it smuggle in an assumption the theorem never licenses? I'm inclined to think the theorem is right and the moral is sloppy, but I'd like a careful accounting of exactly where the gap opens up.
reasoning: |-
  We are going to break down the summary of Good's theorem and the book's interpretation step by step.

  First, recall the context: Good's theorem is about the expected value of information. The standard statement is that, in a decision-making problem, the expected value of information (before acquiring it) is non-negative. This means that, on average, having the information is beneficial (or at least not harmful) relative to not having it.

  Let's go through the summary:

  1. "Good proved back in the 1960s that information can never make a decision-maker worse off."

     - A decision theorist would note that this is true only in an ex-ante (before the information is received) expected sense. That is, at the moment of deciding whether to acquire the information, the decision-maker expects to be at least as well off (and typically better off) by having the information. However, once the information is acquired, the realized outcome might be that the decision-maker is worse off in some realizations. For example, in the lottery case, after learning you lost, you are worse off in terms of your experienced utility (if you value hope) than you were in the state of suspense. But note: the theorem is about the expected utility before acquiring the information.

     - Therefore, this statement is a bit loose. The theorem does not guarantee that in every possible state of the world you are better off with the information. It only says that the expected utility (averaged over all possible pieces of information, weighted by their probabilities) of having the information and then choosing optimally is at least as high as the expected utility of choosing without the information.

  2. "Take any decision made under uncertainty; then the expected value of choosing after receiving a relevant piece of evidence is always at least the expected value of choosing without it, and typically higher."

     - This is a correct statement of the core of Good's theorem. The key is that we are comparing two strategies:

       (a) Make a decision without the evidence.
       (b) Wait for the evidence, then make a decision.

       The expected value of strategy (b) (which is the expected value of the maximum expected utility action we can take after seeing the evidence) is at least as high as the expected value of strategy (a) (which is the expected utility of the best action we could take without the evidence). This is because, after seeing the evidence, we can always choose the same action we would have chosen without the evidence, or we can adjust our action to the evidence and do better.

     - The "typically higher" part is not always true: if the information is irrelevant to the decision, then the expected value might be the same. But it's a common case that it's higher.

  3. "So a rational agent always wants more information — declining a free look at the answer is like declining free money."

     - This statement is true only if the information is free (no cost) and if the agent is an expected utility maximizer. However, note that the theorem assumes that the agent is rational in the sense of maximizing expected utility and that the information is costless. If the information has a cost, then the theorem does not say that the agent should always buy it. It only says that the net value (the expected utility with the information minus the cost) should be compared to the expected utility without the information.

     - Moreover, the lottery example you raised: if the agent has non-linear utility over beliefs (for example, if the agent gets utility from hope and the suspense is valuable) then this might violate the standard expected utility framework. In the standard model, utility is defined over outcomes and not over beliefs. If the agent has "belief-based" utility (like enjoying suspense), then the model must be adjusted to account for that. In that case, the theorem may not hold because the state of uncertainty itself has a value.

     - So, in the standard expected utility model, the statement is true: a rational agent (with utility defined only over outcomes) would never decline free information. But if the agent has preferences over beliefs (like in the lottery example, where suspense is valued), then the standard model doesn't capture that.

  4. "And because this is a theorem rather than a rule of thumb, it follows from the axioms of probability alone, with no assumptions about human psychology."

     - This is not entirely accurate. The theorem relies on the axioms of probability and the principle of maximizing expected utility. It does assume that the agent updates beliefs via Bayes' rule and then chooses the action that maximizes expected utility given the new posterior. So it requires the Bayesian decision theory framework.

     - It does not require specific assumptions about human psychology, but it does assume that the agent is rational in the Bayesian sense.

  5. The book's practical moral: "since information can't hurt, a rational decision-maker should always gather every available piece of data before deciding, and an executive who makes a snap judgment when more evidence could have been collected has acted irrationally."

     - This moral overreaches. The theorem does not say that gathering every available piece of data is always optimal. There are at least two important caveats:

       (a) **Cost of information**: The theorem assumes the information is free. In reality, gathering information often has costs (time, money, opportunity cost). If the cost of gathering the information exceeds the expected benefit (the expected value of information), then it is rational to forgo it.

       (b) **Timing of the decision**: Sometimes, delaying a decision to gather more information can lead to missing an opportunity. The theorem compares two fixed strategies: (i) decide now without the information, and (ii) get the information and then decide. But if there is a time constraint and waiting for the information causes a delay that has consequences, then the value of the information must be weighed against the cost of delay.

     - Moreover, the theorem does not say that you should gather every piece of data. It says that each piece of relevant information, if free and without delay, is beneficial. But if you have multiple pieces of data, the value of one piece might depend on whether you have others. However, the theorem can be extended to show that the value of a set of information is non-negative and additive in a certain way. But again, with costs and delays, the moral does not hold.

     - Also, there is the issue of computational costs: processing information may be costly. The theorem abstracts from this.

     - Therefore, the book's moral is a misapplication of the theorem. The theorem does not imply that one should always gather all available data. It only implies that if the information is free (no cost, no delay, no other negative consequences) then it is beneficial to get it.

  Now, let's address your lottery example:

  - In the standard model, the utility is defined only by the outcome (winning or losing). So if you have a lottery ticket, the outcomes are:
      - Win: you get a big prize (utility U_win)
      - Lose: you get nothing (utility U_lose, typically 0)

    The state of uncertainty (before knowing) has an expected utility: p * U_win + (1-p) * U_lose.

    After learning you lost, your utility is U_lose. After learning you won, your utility is U_win.

    The expected utility of learning the outcome is: p * U_win + (1-p) * U_lose, which is exactly the same as the expected utility of not learning (if you were to hold the ticket without knowing). So in the standard model, learning the outcome doesn't change the expected utility. But note: the theorem is about making a decision. In the lottery, there is no decision to be made after buying the ticket? Actually, if there is no decision, then the theorem doesn't apply. However, let's reframe.

    Suppose you have a decision: after buying the ticket, you have the option to sell it before the draw. Then, having information about the outcome (if you could get it) would be valuable because if you knew you won, you wouldn't sell (or might sell at a high price) and if you knew you lost, you might sell for whatever you can get. But without information, you might sell at a price that reflects the expected value.

    However, in your example, you seem to be thinking of the utility of suspense. That is, you might get more utility from the state of hope than from knowing you lost. This is a case where the standard model does not capture your preferences. In the standard model, the utility is defined over outcomes and not over beliefs. If you have preferences over beliefs (like enjoying suspense or being averse to disappointment), then the model must be extended to incorporate these.

    In such an extended model, the state of uncertainty (having the ticket and not knowing) might have a utility that is higher than the utility of knowing you lost. Then, the expected utility of learning the outcome might be lower than the utility of remaining in suspense. This would break Good's theorem because the theorem relies on the assumption that utility is a function only of the outcome (and the action) and not of the information state.

    Therefore, in the standard framework, the lottery example is not a counterexample because there is no decision to be made. But if we consider a decision (like selling the ticket) and if we stick to outcome-based utility, then the information is valuable. However, if we have belief-based utility, then the theorem does not hold.

  Summary of the audit:

  - The statement of the theorem in the book is roughly correct, but the interpretation and the moral are too strong.
  - The lottery example does not refute the theorem in the standard decision-theoretic framework (which only considers outcome-based utility). However, it does point out that in real life, people might have preferences over beliefs (like suspense) that the standard model ignores. In that case, the theorem doesn't apply.
  - The proof of the theorem relies on the axioms of probability and the principle of maximizing expected utility (and Bayesian updating). It does not rely on human psychology, but it does rely on the rational agent model.
  - The book's moral ("always gather all available data") is not justified by the theorem because:
     (a) Information may have costs (time, money, etc.).
     (b) Delaying the decision to gather information may have negative consequences.
     (c) There may be computational costs or other constraints.

  Therefore, the gap opens up in the transition from the theorem (which is about the non-negative expected value of free information in a Bayesian decision problem) to the practical advice (which ignores costs, delays, and the possibility of non-outcome-based utilities).
answer: |-
  ### Step-by-Step Audit of the Summary and Moral

  I'll break down the book's summary of Good's theorem and its practical moral, highlighting what a decision theorist would accept, what's a loose popularization, and what's a misstatement. Your instincts are correct: the theorem itself is sound under standard assumptions, but the book's interpretation and moral overreach. The lottery example exposes a nuance but doesn't refute the core theorem when properly framed.

  ---

  #### 1. **"Good proved back in the 1960s that information can never make a decision-maker worse off."**
     - **Acceptance with Crucial Nuance**:  
       Decision theorists accept this *ex ante* (before receiving information), but reject it *ex post* (after receiving it). The theorem states that **before you receive information**, the *expected value* of deciding with it is never lower than deciding without it. However, *after* receiving the information, you might end up worse off in specific realizations (e.g., learning you lost the lottery feels worse than suspense).  
       - *Your Lottery Example*: This is valid *ex post*: learning you lost may reduce your psychological well-being compared to hope. But the theorem doesn't deny this—it only claims that *before* learning the outcome, your *expectation* of being better off with the information is non-negative. The theorem separates decision-making utility from emotional utility.

     - **Where the Summary is Loose**:  
       It blurs the *ex ante*/*ex post* distinction. The phrase "can never make a decision-maker worse off" implies a universal guarantee, but it only holds in expectation *before* evidence arrives.

  ---

  #### 2. **"Take any decision under uncertainty; the expected value of choosing after receiving evidence is always at least the expected value of choosing without it, and typically higher."**
     - **Fully Accepted**:  
       This is the core of [Good's theorem (1967)](https://www.jstor.org/stable/2959879). Formally, for any decision problem:  
       \[
       \mathbb{E}[\max_{a} \mathbb{E}[U \mid x, a]] \geq \max_{a} \mathbb{E}[U \mid a],
       \]  
       where \(U\) is utility, \(a\) is an action, and \(x\) is evidence. The left side (decide after seeing \(x\)) has higher or equal expected value to the right side (decide without \(x\)).  
       - "Typically higher" is unobjectionable: if evidence affects the optimal action, value strictly increases.

     - **Why the Lottery Example Doesn't Refute This**:  
       In the lottery, if you have a ticket and no further actions (e.g., cannot sell it), there's no *decision* to make. The theorem assumes you can *act* on the information. If you *could* act (e.g., sell the ticket after learning the outcome), the information would have non-negative value. Your case conflates *hedonic utility* (enjoying suspense) with *decision utility* (optimizing outcomes via actions).

  ---

  #### 3. **"A rational agent always wants more information—declining a free look is like declining free money."**
     - **Accepted Only Under Strict Assumptions**:  
       This holds if:  
       - Information is **free** (no cost to acquire).  
       - Information is **relevant** (affects decisions).  
       - The agent is **Bayesian** (updates beliefs via Bayes' theorem).  
       - Utility is **defined solely over outcomes**, not beliefs or information states.  

     - **Where the Summary is Misleading**:  
       - **Assumes Outcome-Only Utility**: If utility includes suspense/disappointment (as in your lottery case), the theorem fails. Standard decision theory excludes these, treating them as "non-rational" preferences.  
       - **Ignores Information Costs**: The phrase "free look" is critical. If gathering data consumes time/resources, the value may be negative net of costs.  

     - **The Lottery Example Revisited**:  
       If you derive utility from hope (a belief-state utility), declining information isn't irrational. But Good's theorem assumes your utility depends only on *outcomes* (e.g., winning/losing money), not on *beliefs*. This is a model limitation, not a flaw in the theorem.

  ---

  #### 4. **"This follows from the axioms of probability alone, with no assumptions about human psychology."**
     - **Partly Misstated**:  
       - **Probability Axioms Are Necessary but Insufficient**: Good's theorem requires:  
          (a) **Bayesian updating** (to revise beliefs after evidence).  
          (b) **Expected utility maximization** (to choose actions).  
          (c) **Consistency** between beliefs and actions.  
       This relies on the full framework of **Bayesian decision theory**, not just probability axioms.  
       - **Psychology Isn't Irrelevant**: The theorem assumes agents *use* information rationally (via Bayes + expected utility). Human cognitive biases (e.g., misupdating) violate this.

     - **Loose Popularization**:  
       Claiming "no assumptions about human psychology" oversimplifies. It assumes perfect rationality in belief-updating and optimization—a strong idealization.

  ---

  #### 5. **Practical Moral: "A rational decision-maker should always gather every available piece of data before deciding."**
     - **Genuine Misstatement**:  
       This does **not** follow from Good's theorem. The moral smuggles in three unsupported assumptions:  
       - **Information is free**: Real-world data has costs (time, money, attention). The theorem only covers *costless* information.  
       - **No temporal constraints**: Delaying decisions to gather data may incur opportunity costs (e.g., a competitor acts first).  
       - **No diminishing returns**: Gathering all data is often inefficient. The value of information (VoI) can be calculated, and rational agents stop when VoI < cost of acquisition.  

     - **Counterexamples**:  
       - **Costly Information**: Paying $100 for data that only improves decisions by $50 is irrational.  
       - **Time-Sensitivity**: An ER doctor acting on current knowledge saves a life; waiting for a lab test may not.  
       - **Relevance**: Gathering irrelevant data (e.g., tomorrow's weather for today's investment) wastes resources.  

     - **The Core Gap**:  
       Good's theorem proves non-negative *gross* value of information (before costs). The moral ignores net value and context.

  ---

  ### Key Takeaways
  1. **The Theorem is Correct, but Narrow**:  
     - Information has non-negative *expected value* for decisions *before* it's received.  
     - It assumes Bayesian rationality, outcome-only utility, and costless information.

  2. **Your Lottery Example**:  
     - Exposes a valid *ex post* emotional cost, but not a flaw in the theorem. It highlights that real agents may have utility over beliefs (suspense), which the model excludes.

  3. **Why the Moral Fails**:  
     - **Costs Matter**: Rational agents maximize *net* expected utility (VoI minus costs).  
     - **"All available data" is inefficient**: Rationality demands optimizing *how much* information to gather (via VoI calculations).  
     - **Good's theorem is not a license for indecision**: Acting with partial information can be optimal if delays are costly.

  4. **A Better Moral**:  
     > "Rational agents value *relevant* information, but only acquire it when its expected benefit exceeds its cost—and sometimes, acting fast beats waiting for data."

  ### Further Reading
  - **Good's Original Paper**: [On the Principle of Total Evidence](https://www.jstor.org/stable/2959879) (1967).  
  - **Critiques**: See I.J. Good's later caveats on information costs (e.g., in "Some Terminology of Artificial Intelligence").  
  - **Modern Extensions**: Bayesian cost-benefit analysis (e.g., Russell & Norvig's *Artificial Intelligence*, Chapter 16).

  This audit confirms your suspicion: the theorem is robust, but the book's moral is sloppy and context-blind. Always ask: *"Is the information free, relevant, and actionable?"* If not, snap judgments can be rational.
