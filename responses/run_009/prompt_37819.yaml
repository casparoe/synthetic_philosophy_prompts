prompt: |-
  I sit on the safety evaluation steering committee at a mid-size AI lab (I know, everyone says that these days). Right now, when we want to check whether a model's long-form output is trustworthy — 50-page research summaries, threat-model writeups, that kind of thing — we pay domain experts to review them, and it's slow, expensive, and honestly the experts mostly skim. Our alignment team has been pushing hard to replace this with a debate setup: one model produces the report, a second adversarial model attacks it, a third judges the exchange, and a human signs off on the verdict. Their pitch is that the human only ever needs to judge the debate, not the underlying document, so oversight can scale way past what any unaided person could actually read. There's a version of this idea floating around the safety community from a few years back that our folks treat as basically gospel.

  The thing that keeps me up is an objection one of our engineers raised in a meeting and nobody really answered. Some arguments are checkable step by step — every individual claim is verifiable, nothing looks wrong on its own — but the real error hides in how the steps combine, or in what got quietly left out of the chain, and the whole thing is too long for anyone to hold in their head at once. In a debate format, the attacker just needs to produce *some* convincing attack; if the genuine flaw is buried in a haystack of individually-fine steps, a slick but wrong rebuttal might beat the correct one in front of a human judge, and then we've updated in the wrong direction with extra confidence, because the process *looks* more rigorous than a skim by a tired expert. That's the nightmare scenario: debate doesn't just fail, it launders trust.

  We vote at the next quarterly meeting and I'm supposed to circulate a written position beforehand: adopt debate as the primary evaluation method, keep expert review primary with debate as a supplementary signal, or run both in parallel for a trial period with pre-registered criteria for choosing between them. Draft the memo for me — a concrete recommendation with a time frame, and please take the alignment team's strongest case seriously rather than treating this as a rubber stamp for the skeptics. If your recommendation comes with conditions (capping argument length, requiring the attacker to pinpoint a specific step rather than argue holistically, escalating to humans when the debaters disagree about what's even at issue), say what the conditions are and what they'd cost us in coverage or throughput. And if you think the whole framing is off — that the choice isn't really between two methods but about what "evaluation" is even for here — say that too, but still give us a decision we can act on.
reasoning: |-
  Okay, the user is on a safety evaluation steering committee at an AI lab. They need to decide whether to replace expert reviews with a debate setup for evaluating long-form outputs. The main concern is that debate might miss subtle errors that emerge from the combination of steps or omissions, leading to a false sense of confidence. 

  First, I need to understand the core problem. Expert reviews are slow, expensive, and experts skim. The alignment team proposes debate to scale oversight. But the engineer's objection is crucial: debate could favor flashy but incorrect attacks over hard-to-spot systemic flaws, potentially laundering trust in erroneous outputs.

  The user's memo needs a concrete recommendation. Options are: adopt debate as primary, keep experts primary with debate supplementary, or run both in parallel. Conditions like argument length caps or pinpointing specific steps might mitigate risks but could reduce coverage. 

  I should acknowledge the alignment team's points. Debate leverages models to handle volume and might catch errors experts miss. But the engineer's scenario is valid—systemic flaws are real. Parallel testing seems best: run both methods head-to-head with predefined criteria. That provides data without fully committing. 

  Conditions could include: capping debate length to force focus, requiring the attacker to specify step numbers, and having humans resolve meta-disagreements. These might limit holistic analysis but reduce overwhelm. Also, track where debates miss errors caught by experts. 

  The deeper issue: evaluation's purpose. Is it about catching flaws or understanding failure modes? The process should inform model improvement, not just binary checks. The memo should recommend a trial, define success metrics, and emphasize that both methods are complementary. 

  Final recommendation: 6-month parallel trial with expert reviews as ground truth, capped debate rounds, step-specific attacks, human escalation clauses. Post-trial, decide based on false negative rates and coverage gaps. This balances innovation and risk, giving actionable data.
answer: |-
  ## Steering Committee Memo: Evaluation Method Recommendation  
  **To:** Safety Evaluation Steering Committee  
  **From:** [Your Name/Title]  
  **Subject:** Recommendation for Long-Form Output Evaluation: Hybrid Trial with Safeguards  
  **Date:** 25 October 2024  

  ### Executive Summary  
  I recommend a **6-month parallel trial** of debate-based evaluation alongside expert review, with expert review remaining the primary trusted method during this period. The trial will include pre-registered criteria for adoption and specific debate guardrails (argument length caps, step-specific rebuttal requirements, and human escalation protocols). This balances scalability potential with critical risk mitigation, while generating decisive data.  

  ---

  ### 1. Context & Core Concerns  
  The Alignment Team’s proposal for model debate is compelling: it promises scalable oversight by leveraging AI to "pre-digest" complex outputs, reducing human fatigue. Their cited foundational work remains theoretically sound. However, Engineer [Name]’s objection is **non-trivial and empirically unresolved**:  
  - **Systemic/emergent errors** (flaws in step integration, critical omissions) may evade piecemeal scrutiny.  
  - **Persuasive but invalid attacks** could "win" debates, laundering trust in flawed outputs (*the nightmare scenario*).  
  - Debate’s current state lacks rigorous validation against *this specific failure mode* in long-form contexts.  

  Dismissing expert review entirely risks institutionalizing undetected failure. Yet rejecting debate ignores a high-potential scaling path.  

  ---

  ### 2. Recommendation: Parallel Trial with Conditions  
  **Adopt a 6-month trial with three evaluation streams:**  
  | **Method**               | **Scope**                                  | **Trust Level**         |  
  |--------------------------|--------------------------------------------|-------------------------|  
  | **A. Expert Review**     | All high-stakes outputs (e.g., threat models) | **Primary (Gold Standard)** |  
  | **B. Debate System**     | All outputs *also* reviewed by experts     | **Provisional (Validation Required)** |  
  | **C. Human-Skim Baseline** | Random 10% subset (current method)         | **Comparison Baseline** |  

  **Pre-registered Success Criteria for Post-Trial Adoption:**  
  - Debate verdicts must achieve **≥95% concordance** with expert verdicts on identical outputs.  
  - Debate must **not miss any critical error** identified by experts (zero false negatives on severe flaws).  
  - Human judges must report **≤20% cognitive overload** during debates (via post-debate survey).  

  **Critical Debate Guardrails & Their Tradeoffs:**  
  | **Guardrail**                     | **Implementation**                              | **Cost/Tradeoff**                          |  
  |-----------------------------------|-------------------------------------------------|--------------------------------------------|  
  | **1. Step-Specific Rebuttals**    | Attacker must cite exact sections/steps in dispute. Holistic "this is wrong" attacks invalid. | *May miss errors from step interactions; increases attacker burden.* |  
  | **2. Argument Length Caps**       | Rebuttals/judgments capped at 10% of original output length. Debaters must summarize. | *Risks oversimplifying complex chains; may favor superficial attacks.* |  
  | **3. Human Escalation Protocol**  | If debaters disagree on *what is being disputed* or judge flags confusion, human reviews full transcript + doc. | *Adds latency (~2hrs/incident); reduces scalability but mitigates worst-case.* |  
  | **4. Adversarial Model Rotation** | Use 3+ distinct attacker models to avoid single-failure modes. | *Increases compute costs by ~50% for debate.* |  

  **Trial Output:** Metrics on coverage gaps, expert-debate discordance causes, throughput gains, and missed error analysis.  

  ---

  ### 3. Why Not Full Adoption or Status Quo?  
  - **Full adoption now** gambles on unproven resilience to systemic errors. Laundered trust in a flawed output could be catastrophic.  
  - **Status quo (experts only)** ignores scaling limits and AI’s potential to augment human judgment. Debate *may* catch errors experts skim over.  
  - **Supplemental-only debate** without parallel comparison denies actionable data on efficacy.  

  ---

  ### 4. Deeper Framing: What Evaluation Is For  
  This isn’t just about "catching errors." It’s about:  
  - **Building epistemic security:** Understanding *how* failures emerge in complex reasoning.  
  - **Training future oversight systems:** Debate transcripts are data for training better critics/judges.  
  - **Calibrating risk tolerance:** Not all outputs need equal scrutiny. Tiered evaluation (e.g., debate for medium-risk, experts for high-risk) may emerge post-trial.  

  **The debate vs. expert dichotomy is false.** The goal is a *resilient socio-technical process* where each method cross-validates the other.  

  ---

  ### 5. Action Plan & Timeline  
  - **Week 1:** Finalize trial design with Alignment Team and experts.  
  - **Month 1-6:** Run parallel evaluation. Track:  
    - Concordance rates (debate vs. expert)  
    - False negative rates (debate misses)  
    - Throughput (docs/week) and costs  
    - Human judge cognitive load  
  - **Month 7:** Analyze results against pre-registered criteria. Vote on adoption:  
    - Full replacement (if criteria met)  
    - Tiered system (e.g., debate for research summaries, experts for threats)  
    - Revert to expert-led with debate as a supplement  

  ---

  ### Recommendation  
  **Approve the 6-month parallel trial with the specified guardrails.** This funds innovation while enforcing rigorous validation. The Alignment Team gets a real-world test; skeptics get failsafes. Post-trial, we pivot decisively based on evidence—not theory.  

  **Sign-off:**  
  [Your Name]  
  Safety Evaluation Steering Committee
