prompt: |-
  I've spent the last decade in the accommodations office of a large employer — the office that decides which adjustments for disabilities and health conditions the company will actually pay for. Somewhere along the way I noticed that we seem to operate on a rule nobody has ever written down: we fund the removal of obstacles to activities that nearly everyone in the workforce can do, and we decline to fund the pursuit of activities that matter enormously to particular individuals. A deaf employee gets sign-language interpretation for every meeting; an employee who is clinically crushed by the sense that his life has no meaning outside competitive sailing gets nothing, even when the amount that would transform his situation is smaller than what we routinely spend on interpretation for a single employee. The line we draw doesn't track how much suffering is on either side of it, or how much money is involved. It tracks something about the *kind* of disadvantage.

  I've been trying to work out what exactly that something is, and my rule keeps misbehaving at the edges. Consider a few cases. First, severe myopia is an impairment of a near-universal capacity if anything is, but because glasses are cheap and the condition is common, nobody calls it an accommodation at all — the employee just buys the glasses. So severity and rarity seem to enter my rule somewhere, not just the type of capacity blocked. Second, there are employees who, after an injury or a long illness, report no needs whatsoever; their wants appear to have contracted to fit their reduced abilities. My rule says they require nothing, which feels wrong in the opposite direction from the sailing case — we somehow sense they are worse off precisely because they've stopped wanting things. A friend told me this is sometimes called adaptive preference, and I can't tell whether that's the same problem as mine or a different one. Third, an employee whose health collapses unless she can live in a particular climate: her condition is simultaneously a barrier to universal activities and a costly personal requirement, and my two categories collapse into each other.

  When I describe all this to people with more education than I have, they say something about philosophers and expensive tastes, or about whether fairness is supposed to mean equal money, equal happiness, or some third thing. But the expensive-tastes label doesn't fit my cases, because nothing in my office's practice tracks expense: the sailing man's tastes aren't costly so much as singular, and the interpreter costs far more than we'd ever spend on him. Does the rule I've reverse-engineered have an established name in the literature, and is the kind of equality it delivers — where the benchmark is what nearly everyone can do rather than what a particular person needs to flourish — a recognized position? If it is, I'd like to know how its proponents handle my edge cases, and how the nearest better-known positions would draw each line differently. If it isn't, I'd like you to say so plainly and then coin a term for it, with a definition sharp enough that I could classify new cases by it rather than by gut feeling.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They've worked in accommodations for a decade and noticed this unwritten rule: they fund removing obstacles to universal activities but not personal pursuits. The examples they give—deaf employee getting interpreters versus a sailor not getting funds—show a clear pattern. But they're struggling with edge cases like myopia, adaptive preferences, and climate needs.

  First, I need to figure out the core principle here. It seems like the office distinguishes between universally expected work activities versus personal flourishing. The user mentions that the benchmark is what nearly everyone can do, not individual flourishing. That reminds me of capability approaches, like Nussbaum's, where basic capabilities are essential. But their office isn't funding all capabilities, just those tied to common workforce activities. 

  The myopia example is interesting. Glasses aren't even considered an accommodation because they're cheap and common. So severity and rarity play a role, but the user feels that's not the whole story. Adaptive preferences are another tricky area. When someone stops wanting things after an injury, the rule says they need nothing, but intuitively, they're worse off. The climate-dependent employee blurs the line between universal and personal needs.

  The user has talked to educated people who mention expensive tastes and theories of equality. But in their cases, expense isn't the main factor—it's about whether the need is universal or personal. The interpreter is expensive but funded because communication is universal; sailing isn't, even if cheaper. 

  So, what's the established term? Social and natural primary goods from Rawls might come close, but primary goods are means to ends, while here it's about enabling universal activities. Maybe Norman Daniels' normal opportunity range? That focuses on health needs necessary for typical social participation. That fits the deaf employee getting interpreters but not the sailor. 

  But the edge cases challenge this. Myopia is a health need but normalized, so it's not an accommodation. Adaptive preferences—Daniels might say their health isn't impaired, but the user feels they're worse off. The climate case is a health need that's also a geographical requirement. 

  The user wants a term if none exists. "Universal Participation Threshold" makes sense—emphasizing common activities over personal flourishing. Defining it clearly would help them apply it consistently. For the edge cases: myopia is below the threshold due to normalization, adaptive preferences might need a different approach outside accommodations, and the climate case qualifies as a health need for universal participation. 

  They might also need validation that gut feeling isn't enough, so a sharp definition is crucial. Underlying all this, they seek a fair, principled system that avoids arbitrariness. They might feel uneasy about denying the sailor but need a framework to justify it ethically. Recognizing this tension between universal access and individual flourishing is key, and offering UPT as a tool could address their need for clarity and consistency.
answer: |-
  Your reverse-engineered rule aligns closely with **Norman Daniels' concept of "normal opportunity range" within the framework of health justice**. Here's a breakdown, including its name, how it handles your edge cases, and how it differs from neighboring theories:

  ---

  ### **1. The Established Concept: "Normal Opportunity Range" (Daniels)**
     - **Core Idea**: Society owes individuals interventions that restore their ability to access the **"normal opportunity range"**—the array of life plans reasonable people in that society might pursue. Disabilities are accommodated when they impair access to this *societally typical* range of opportunities.
     - **Your Rule Mirror**: You fund obstacles to "activities nearly everyone in the workforce can do" (universal capacities tied to basic social participation), not pursuits central to individual flourishing but outside the typical range.
     - **Equality Type**: This delivers **equality of opportunity for core social functions**, not equality of welfare or resources.

  ---

  ### **2. Handling Your Edge Cases**
     | **Case**               | **Normal Opportunity Range Response**                          | **Why It Fits**                                                                 |
     |-------------------------|-----------------------------------------------------------------|---------------------------------------------------------------------------------|
     | **Severe Myopia**       | Glasses aren't "accommodations" because they restore a near-universal *biological function* (sight) necessary for the normal opportunity range. Their low cost and prevalence render them a baseline expectation. | Severity/rarity matter only if they affect access to *core opportunities*. Myopia is normalized, so correction isn't framed as "accommodation." |
     | **Adaptive Preferences**| The rule *correctly* identifies no need—but highlights a **limitation of the model**. Adaptive preferences signal a *reduction in the opportunity range itself* (a harm), but accommodations can't "fix" this. Solutions lie beyond workplace adjustments (e.g., therapy, social support). | The model addresses *access* to opportunities, not the *subjective value* of those opportunities or distorted preferences. |
     | **Climate Dependency**  | Qualifies for accommodation **if** the climate need is health-based (e.g., respiratory illness) *and* relocation enables access to the normal opportunity range (employment). It's a health-derived barrier to universal work. | Collapses your categories because health needs *are* tied to universal capacities. Personal desires (e.g., "I thrive in Bali") wouldn't qualify. |

  ---

  ### **3. Contrasts with Neighboring Theories**
     - **Expensive Tastes (Rawls/Dworkin)**:
       - Your sailing enthusiast *resembles* this—but key differences exist. Expensive-taste theories deny compensation for *voluntary* costly preferences. Your sailor's suffering is non-volitional, yet still excluded because sailing isn't a "normal" opportunity. Your rule tracks **typicality**, not cost or voluntariness.
     - **Capability Approach (Sen/Nussbaum)**:
       - Would likely fund the sailor if sailing is core to his "flourishing." Nussbaum's list includes "recreation," but societies define thresholds. Your office uses a **minimalist capability threshold** (workplace basics), not maximal flourishing.
     - **Welfare Equality**:
       - Would prioritize equalizing happiness/suffering. Your deaf employee and sailor would be weighted equally, ignoring why the disadvantage exists. Your office rejects this, focusing on **functional parity for universal activities**.

  ---

  ### **4. A New Term: For When "Normal Opportunity Range" Feels Incomplete**
     If Daniels' framing doesn't fully capture your unwritten rule's emphasis on *universal workforce activities* (not broader life opportunities), propose:
     
     > **Universal Participation Threshold (UPT)**  
     > *Definition: A disadvantage qualifies for accommodation only if it impedes an individual's ability to engage in activities universally expected in the workforce, where "universal" denotes near-universal capacity among employees absent the disadvantage. The impediment must be atypical in severity or nature relative to common workplace challenges.*  
     
     **How UPT Resolves Edges**:
     - **Myopia**: Corrective lenses address a universal capacity (sight), but prevalence/normalization place it below the "atypical severity" threshold.
     - **Adaptive Preferences**: Stopped desires don't impede *universal* activities → no UPT claim.
     - **Climate Needs**: Qualifies only if health impairment blocks *workforce participation* (not personal preference).

  ---

  ### **Why This Matters**
  Your office's practice reveals a pragmatic, defensible ethic: **workplace justice requires equal access to core collaborative functions, not equal pursuit of idiosyncratic fulfillment**. It avoids subjective judgments about "worthwhile lives" while ensuring no one is excluded from basic professional participation. 

  The tension arises because humans *are* idiosyncratic—but your rule wisely draws the line at social, not personal, necessities. Philosophers might debate where "universal activities" end and "personal pursuits" begin, but your edge cases prove the distinction is operational. If UPT helps you classify cases beyond gut feeling, it’s a term worth coining.
