prompt: |-
  My friend and I argued until two in the morning about whether groups can be right or wrong, as opposed to just more or less satisfied, and I came away with a set of verdicts I can't fully square. I'd like to know what principle, if any, captures them. The cases:

  (1) The three-judge court: Judge A accepts that the defendant made a promise and that the promise was legally binding, and finds for the plaintiff; Judge B accepts that there was a promise but not that it was binding, and finds for the defendant; Judge C accepts that the promise was binding but denies there was any promise at all, and finds for the defendant. So a majority accepts each premise, and a majority rejects the conclusion. Here I'm firmly on the side of taking the premise majorities and finding for the plaintiff; deciding the case by majority on the conclusion alone feels like it gets the law wrong, not just the count.

  (2) A hiring committee where five members score candidates on research, teaching, and collegiality and then each gives an overall recommendation. Here I think taking the majority overall recommendation is perfectly fine even if it disagrees with what the majority's premise scores would imply. I don't feel the tug I felt in the courtroom at all.

  (3) The same court as in (1), except the chair's vote on each premise counts double. My gut says this might actually be acceptable, which surprised my friend, since I also think collective judgments should track the group's reasons rather than anyone's authority.

  (4) A legislature voting on budget lines, where the majority's preferred figure for each line, taken together, produces a deficit the constitution forbids. Here the premise-by-premise approach seems clearly wrong — the group shouldn't walk away committed to a package it deems unconstitutional — and overriding line-by-line majorities in favor of an overall constraint seems right.

  So: I favor premise-based aggregation in the courtroom, conclusion-based in hiring, weighted votes on premises in a tribunal, and constraint-overriding in the budget. My friend says these can't all come from one principle, and that at least one has to go. Is he right? If there's a principle — perhaps something about which contexts demand that the collective view follow from reasons the members actually hold, and which allow the group to simply choose — I want it stated precisely enough to tell me what it implies for the case I keep going back and forth on: a faculty committee deciding tenure, where members vote on research, teaching, and service, but the final decision must be one the committee can defend in writing as following from those votes. And I want to be told honestly which of my four verdicts the principle can't accommodate.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They had a late-night debate with a friend about whether groups can be "right" or "wrong" versus just "satisfied." They presented four scenarios where their intuitive judgments differ: a court case, hiring committee, weighted judicial votes, and a budget vote. They want a unifying principle that explains all four without contradiction, especially for a tenure committee case where written justification is required.

  First, I need to analyze each scenario to identify patterns. The court case (1) has premise-based voting because legal decisions require logical consistency—the verdict must follow from established facts and laws. In contrast, the hiring committee (2) uses conclusion-based voting because it's about holistic judgment, not syllogistic reasoning. Weighted judicial votes (3) are acceptable only because it's a meta-decision about expertise in premise-assessment, not authority over conclusions. The budget deficit (4) needs a constraint-override because constitutional rules supersede individual line items.

  The key difference seems to be between epistemic contexts (like law) that demand reasoned coherence and practical contexts (like hiring) prioritizing efficient choice. But the tenure case complicates this—it requires written justification, forcing the group to retroactively construct reasoning from premise votes. That pushes it toward premise-based aggregation, even if members initially voted holistically. 

  The tension lies in the user's verdict for (3). Weighted premise votes only work if the weighting reflects greater reliability on factual assessment, not arbitrary authority. If the user accepts this while rejecting conclusion-based authority, it's consistent—but they must clarify that distinction. Their friend might challenge whether "expertise" can be cleanly separated from "authority" in practice. 

  Ultimately, the user needs to decide if the tenure committee's written defense requires genuine premise-based reasoning or merely post-hoc rationalization. If the former, premise aggregation is unavoidable. The principle holds except possibly for (3), depending on how "weighting" is justified. They might need to concede that weighted votes only work when tied to truth-tracking ability, not status.
answer: |-
  Your four verdicts *can* be reconciled under a single principle: **The aggregation method must ensure the group's decision is rationally defensible within its institutional role and epistemic constraints.**

  This principle hinges on two key dimensions:
  1.  **Epistemic vs. Practical Aim:** Is the group seeking a *correct answer* based on shared reasoning (epistemic), or making a *collective choice* based on preferences/values (practical)?
  2.  **Constraint of Coherence:** Does the institutional role *require* the group's output to be logically consistent (internally and with external rules)?

  Here's how your verdicts align:

  1.  **Three-Judge Court (Premise-Based):** *Epistemic aim* (finding legal truth). The verdict *must* logically follow from established legal premises. A conclusion-based majority leads to an *incoherent* group position: the group simultaneously affirms the premises logically necessitating the plaintiff's verdict (P&P) *and* the defendant's verdict. This violates the court's core function. **Principle:** Epistemic aim + Coherence constraint → Premise-based aggregation is necessary for rational defensibility.

  2.  **Hiring Committee (Conclusion-Based):** *Practical aim* (making a collective choice). While members use criteria, the "overall recommendation" is a holistic judgment integrating *values* (how much weight to give research vs. teaching) and *predictions* (future performance). There's no single "correct" answer the premises force; it's about collective preference. **Principle:** Practical aim + No strong coherence constraint → Conclusion-based aggregation is rationally defensible as the expression of collective choice.

  3.  **Weighted Premise Votes (Acceptable):** Still *Epistemic aim*. Weighting votes based on role (e.g., chair's expertise/responsibility) is acceptable *if* it reflects a reasonable belief that the weighted voter is *more likely to assess the premise correctly*. It's a meta-decision about *who is best positioned to judge the premise*, not an override of reasoning. The verdict still follows logically from the premises as assessed by the designated group. **Principle:** Epistemic aim + Weighting justified by truth-tracking → Still rationally defensible as premise-based reasoning with calibrated input.

  4.  **Budget Deficit (Constraint Override):** *Practical aim* (allocating funds) but with a critical *external coherence constraint* (constitutionality). The line-item majorities represent practical choices, but the *package* must be logically consistent with the higher constitutional rule. Allowing the incoherent package violates the institution's foundational duty. **Principle:** Practical aim + External coherence constraint → Override of premise (line-item) majorities is necessary for rational defensibility against the external rule.

  **The Core Principle Stated Precisely:**
  > A group's decision-making procedure is justified if it produces an output that the group can plausibly defend as:
  >     (a) Logically coherent (internally and with binding external rules), *and*
  >     (b) Resulting from a process suited to its primary function:
  >         - *Epistemic Function:* Output is derived from the application of shared reasoning rules (logic, law) to the best assessment of relevant premises/facts.
  >         - *Practical Function:* Output reflects an authorized aggregation of member judgments/values, subject to coherence constraints.

  **Implications for the Tenure Committee Case:**
  The requirement for a "written defense as following from those votes" **forces the committee into an epistemic role with a coherence constraint.** It *cannot* be merely a practical vote.

  *   **Conclusion-Based Voting Fails:** If members vote holistically on tenure ("Yes/No") and then try to *retrofit* premise scores (research, teaching, service) to justify that vote, the written defense risks being incoherent or dishonest. How can the group claim the decision "follows from" scores that might not logically support the holistic judgment?
  *   **Premise-Based Voting is Required:** The committee *must* aggregate votes on the premises (research, teaching, service) first (e.g., by majority, or defined thresholds). The tenure decision (conclusion) is then *determined* by applying the institution's pre-defined rules (e.g., "Exceeds threshold on research AND meets threshold on teaching AND meets threshold on service"). The written defense simply reports the aggregated premise scores and applies the rule.

  **Which Verdict Does the Principle Struggle With?**
  The principle accommodates **all four** of your verdicts *as stated*. However, **Verbal Verdict (3) - Weighted Premise Votes - requires careful justification** to fit perfectly. The principle *only* accepts weighting if it genuinely serves the epistemic aim by improving the accuracy of premise assessment (e.g., the chair is a recognized expert on contract formation). If the weighting is purely hierarchical ("boss decides") *without* an epistemic rationale, it violates the principle's requirement for defensible reasoning suited to the function. Your gut feeling likely assumes a benign, expertise-based weighting. Your friend's surprise stems from seeing the potential for non-epistemic authority.

  **Conclusion:**
  Your friend is likely wrong that one verdict *must* go. Your intuitions are largely consistent under the principle that group rationality depends on **institutional role (epistemic vs. practical) and coherence constraints.** The tenure case highlights how institutional rules (written defense) can *force* an epistemic approach even in contexts that might otherwise lean practical. The key is whether the group is bound by shared reasoning to reach a single "correct" answer, or empowered to make a collective choice.
