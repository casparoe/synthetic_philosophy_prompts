  Okay, let me approach this systematically. The user wants a meticulously crafted joint statement for philosophers with opposing metaethical views, requiring careful navigation of their sensitivities. 

  First, I need to identify the core challenges: avoiding realist caricatures ("magic moral lightbulb") and anti-realist misrepresentations ("cynic/relativist"), while carving out substantive disagreements. The phenomenology of moral disagreement and evolutionary debunking arguments seem like safe starting points for agreement - both sides accept the surface-level experience of objectivity even if they explain it differently.

  For the disagreements table, I'm considering how to phrase each position faithfully. The realist's truth-aptness claim needs emphasis on cognitive content without ontological baggage, while the anti-realist's stance should foreground expressive function without denying sophistication. The slavery counterfactual is tricky - maybe framing it as "what makes such statements true" versus "what constitutes their correctness" could satisfy both?

  The moral convergence crux feels most promising for future testing. I'll specify concrete predictions: realists should expect abolition to follow logical consistency expansions (e.g., applying "equal consideration" universally), while anti-realists should point to material conditions like industrialization reducing reliance on forced labor. Crucially, each must pre-register falsification conditions - say, persistent inconsistency favoring anti-realism or sudden moral leaps unexplained by social factors challenging expressivism.

  I suspect the verbal dispute centers on "truth" criteria. Realists likely tie it to stance-independent properties, anti-realists to community standards. But the substantive rift remains whether moral progress tracks mind-independent correctness versus adaptive social negotiation. The document should isolate this precisely.

  Throughout, I'll avoid vacuous agreements (no "morality matters" platitudes) and ensure wording passes veto gates: no lightbulbs for realists, no cynicism labels for anti-realists. The structure will flow from agreements to disagreements to testable cruxes, with slavery truth as the key verbal/substantive boundary marker.
answer: |-
  ## Joint Statement of Understanding: Adversarial Collaboration on Moral Realism vs. Expressivism

  **Participants:**  
  Robust Moral Realist (RMR)  
  Expressivist Quasi-Realist Anti-Realist (EQR)  
  Moderated by [Your Name/Title], Professional Metaethicist

  **Duration:** One Year (Concluded)  
  **Date:** [Date of Signing]

  This document represents our hard-won consensus on points of agreement, clarifies the precise nature of our remaining disagreements using mutually acceptable phrasing, identifies the crucial points of contention ("cruxes"), and pre-registers testable predictions regarding moral convergence. We affirm our commitment to engaging charitably with each other's positions and the historical record.

  **Section 1: Agreed Claims**

  Both RMR and EQR jointly affirm the following:

  1.  **Phenomenology of Moral Disagreement:** Moral disagreements *feel* categorically different from mere clashes of taste or preference. Participants typically experience themselves as arguing about objective matters of fact, appealing to reasons they believe should be compelling to any rational, well-informed interlocutor. This phenomenology persists even in deep disagreements.
  2.  **Scope and Limits of Evolutionary Explanations:** Evolutionary and psychological accounts can explain the *origin*, *persistence*, and *general contours* of human moral capacities and intuitions (e.g., tendencies towards reciprocity, empathy, group loyalty, aversion to harm). However:
      *   Such accounts *do not*, by themselves, entail that *no* moral beliefs are true or justified (RMR: because truth is independent of origin; EQR: because justification involves internal standards within our practices).
      *   Such accounts *do not* explain the *specific content* of complex, historically contingent moral norms (e.g., modern human rights concepts) or the *process* of sophisticated moral reasoning and argumentation.
      *   Such accounts *are compatible* with both the possibility that some evolved intuitions track genuine moral truths (RMR) and the possibility that all moral discourse functions expressively/imperatively, shaped by evolutionary pressures (EQR).
  3.  **Persistence of Moral Disagreement:** Neither Moral Realism nor Expressivism predicts that moral disagreements (e.g., concerning abortion, distributive justice) would disappear upon perfect information or idealization. Both views readily accommodate the possibility of deep, persistent, and rationally irresolvable moral conflicts under ideal conditions, though for different reasons (RMR: irreducible pluralism of fundamental values or complex facts; EQR: fundamental clashes in conative states or practical stances).
  4.  **Minimal Epistemic Constraint:** Moral discourse is governed by robust internal standards of justification, consistency, coherence with empirical facts, and responsiveness to reasons. Calling a moral judgment "wrong" involves more than simply disliking it; it involves showing how it fails by these shared standards internal to moral practice.

  **Section 2: Remaining Disagreements (Phrased for Mutual Acceptance)**

  | Disagreement Area          | Robust Moral Realist (RMR) Position (Acceptable to RMR)                                                                 | Expressivist Quasi-Realist (EQR) Position (Acceptable to EQR)                                                                 |
  | :------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- |
  | **Truth-Aptness & Function** | Moral judgments (e.g., "Slavery is wrong") are cognitive assertions that purport to represent stance-independent, objective moral facts, and their truth conditions are constitutively independent of our actual or ideal attitudes, beliefs, or practices. | Moral judgments primarily express non-cognitive, practical attitudes (e.g., pro/con) and commitments, while *functioning within the practice* *as if* they were assertions describing objective facts, utilizing a minimalist conception of truth applicable within the discourse. |
  | **Grounding of Moral Truth** | The truth of a moral claim is made true by stance-independent moral properties, facts, or relations obtaining in the world. Correct moral reasoning discovers these truths. | The "correctness" or "truth" (minimally construed) of a moral claim within a community is determined by its coherence with the network of attitudes, commitments, and practical stances constitutive of that community's moral sensibility, potentially under idealized conditions of deliberation. |
  | **Ontological Commitment** | Robust moral realism is committed to the existence of irreducible, non-natural (or distinctively normative) moral properties or facts as part of the ultimate furniture of reality. | Expressivism avoids ontological commitment to irreducible moral properties or facts as part of the fundamental descriptive ontology of the world; moral discourse projects attitudes onto the world. |
  | **Counterfactual Truth (e.g., Slavery in 1750)** | The proposition "Slavery was morally wrong in 1750" is true *simpliciter*, irrespective of the attitudes, beliefs, or social practices dominant in 1750. Its truth is grounded in the stance-independent moral facts that obtained then. | While we can *now* correctly assert "Slavery was wrong in 1750" within our current moral framework (and condemn past practices), this expresses our current stance projected onto the past. The assertion "Slavery is wrong" made *in 1750* would have been true *only if* it cohered with the (deeply flawed) moral sensibility of the relevant community/ies in 1750, or expressed a dissenting attitude. There is no timeless, stance-independent fact making the 1750 assertion true *then*. |

  **Section 3: Cruxes and Pre-Registered Predictions on Moral Convergence**

  We agree that the historical trajectory of moral change (e.g., abolition of slavery, expansion of rights, changing views on gender equality) constitutes evidence relevant to our metaethical dispute. We further agree that this evidence is complex and requires careful interpretation, but we identify the following as a key crux:

  *   **The Crux of Convergence Patterns:** Does the pattern of historical moral change more strongly resemble **error-correction guided by epistemic norms** (favoring Realism) or **adaptive negotiation shaped by practical pressures** (favoring Expressivism)?

  **Concrete Predictions & Falsification Conditions:**

  1.  **Robust Moral Realist (RMR) Prediction:**
      *   **Prediction:** Significant, lasting moral progress (e.g., abolition, civil rights) will predominantly exhibit patterns consistent with the application and extension of *internal epistemic norms inherent to moral reasoning itself* – particularly **consistency** (resolving contradictions in who counts), **impartiality** (expanding the scope of moral concern), and coherence with **empirical knowledge** (e.g., recognizing shared humanity/capacities). Changes will often be driven by arguments exposing logical inconsistencies in existing norms (e.g., "All men are created equal" vs. slavery) or failures of impartiality, even when those arguments conflict with powerful interests or entrenched traditions. While social factors play a role, the *direction* and *justification* of change will be primarily guided by these truth-conducive norms.
      *   **Pre-Registered Falsification Condition:** If major moral advancements consistently occur *without* significant reliance on appeals to consistency/impartiality/empirical coherence in their core justifications, or if changes predominantly track shifts in power/interest *without* such argumentative justification, or if progress is consistently *reversed* when power shifts back despite the persistence of the relevant arguments, this would count significantly against RMR.

  2.  **Expressivist Quasi-Realist (EQR) Prediction:**
      *   **Prediction:** Significant moral change will predominantly track shifts in **material conditions, social power structures, coordination needs, and whose voices are heard/valued**, mediated through the expression and negotiation of conative attitudes. Changes will often align with the interests of newly empowered groups or become functionally necessary for social stability/coordination under new conditions (e.g., industrialization reducing reliance on slave labor/feudalism, globalization increasing interdependence). Appeals to consistency/impartiality will feature prominently *within* the discourse, but their persuasive force and specific application will be significantly shaped by underlying practical pressures and whose perspectives dominate the conversation. Progress is better understood as evolving social negotiation than approximating pre-existing truths.
      *   **Pre-Registered Falsification Condition:** If major moral advancements consistently occur *against* the grain of dominant material interests/power structures, primarily motivated *and sustained* by purely logical/consistency arguments even when materially disadvantageous to the powerful, or if changes exhibit sudden, widespread convergence based *solely* on novel arguments without corresponding shifts in material conditions or social power, this would count significantly against EQR.

  **Section 4: The Verbal/Substantive Boundary**

  We suspect a portion of our disagreement concerning statements like "Slavery was wrong in 1750" is **partly verbal and partly substantive**.

  *   **Verbal Aspect:** The disagreement over whether the sentence "Slavery was wrong in 1750" is *true* depends significantly on what is meant by "true" in this context. RMR uses a **robust correspondence** notion of truth (true iff it corresponds to stance-independent moral facts obtaining in 1750). EQR uses a **minimalist/constructivist** notion applicable within the discourse (true iff it coheres with our *current* best moral standards applied counterfactually, or expresses our condemnation). We largely talk past each other if we don't stipulate the semantic framework.
  *   **Substantive Aspect:** The core *substantive* disagreement persists: **Does the *correctness* of our current condemnation of 1750 slavery depend *solely* on features of our current attitudes/practices (EQR), or does it also depend on stance-independent moral facts that *obtained* in 1750, facts that would have made the condemnation correct *even if uttered then* (RMR)?** The boundary is sharp: RMR affirms the existence and relevance of those past, stance-independent facts; EQR denies their existence and relevance, grounding the correctness solely in the present stance.

