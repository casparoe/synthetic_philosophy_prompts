prompt: |-
  I'm organizing a year-long adversarial collaboration between two philosophers — one a robust moral realist (think non-naturalist-ish: stance-independent moral facts, some knowable), the other an anti-realist (quasi-realist/expressivist flavor). They've mostly been arguing past each other about debunking arguments and whether moral judgments aim at truth. You're a professional metaethicist who's moderated several of these collabs before. Draft the joint statement they should be able to sign at the end.

  Specifically I want: (1) a numbered section of claims both accept — include things like the phenomenology of moral disagreement, what evolutionary explanations of our moral intuitions actually show and dont show, and that neither side's view predicts we'd stop arguing about abortion; (2) a disagreements table where each remaining disagreement is phrased so that its own side would accept the wording (this is the hard part — the realist will veto anything that makes realism sound like believing in a magic moral lightbulb, the anti-realist will veto anything that makes her a cynic or a relativist); (3) the cruxes. At least one crux should be the moral convergence one: they agree the historical record of, e.g., abolition and the expanding moral circle is evidence that bears on their dispute — the realist predicts the changes will look like error-correction under norms like consistency and impartiality, the anti-realist predicts they'll track power, coordination needs, and who could be heard, more than truth-approximation. Spell out both predictions concretly enough that the record could in principle score them, and have each side pre-register what pattern would count against their own view.

  They also both suspect a chunk of their dispute is verbal — something about what it takes for a claim about slavery being wrong in 1750 to be "true." If part is verbal, say which part and why; if part is substantive, make the boundary exact. Think carefully before writing: brainstorm first which formulations each side would refuse to sign and why, and avoid agreed claims that are vacuous ("we agree morality is important" tells us nothing). Then give me the final document: numbered agreed claims, the table, then cruxes with each side's prediction written down.
