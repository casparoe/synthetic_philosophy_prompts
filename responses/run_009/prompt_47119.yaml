prompt: |-
  I'm a PhD student who has just taken over, this term, our university's consent workshops for incoming students — the sessions the student union runs during freshers' week. My co-facilitator is a final-year law student with unusually settled views: whenever students raise a hypothetical, she hands down a verdict on the spot, and over our first few sessions a track record has accumulated. She has ruled that a man who exaggerated his feelings — insisting he was in love and wanted a shared future when he wanted neither — nevertheless obtained valid consent, however shabby his conduct; that the self-inventing dater who claims a glamorous career he doesn't have obtains valid consent; but that a man who silently removed a condom during sex, to which his partner had agreed only with protection, does not. On the pressure side, she has ruled that blackmail — threatening to expose an affair unless a woman has sex with him — vitiates consent; that a partner who threatens to end the relationship unless sex happens does not vitiate it ("she can show him the door"); and that a manager who tells an employee she will be sacked unless she goes on a date with him does vitiate it.

  Next week's session has three cases waiting, which students have already emailed in, and I want to predict her rulings before she delivers them, because the students keep asking where the line actually falls and I would rather reconstruct her line than improvise my own in front of a room. Case one: a much older, extremely wealthy man offers to clear a postgraduate's crushing debts if she spends a night with him; she accepts, and later says she would never have consented but for the offer, and saw no realistic way out of her debts — he threatens nothing and takes nothing away from her. Case two: a woman makes clear she will sleep with a man only if there is no risk of pregnancy; he assures her he has had a vasectomy; he has not, though the encounter is otherwise exactly as she envisaged it. Case three: a landlord with a contractual right to terminate on a technicality he has always overlooked says he will begin eviction proceedings unless his tenant has sex with him.

  The three answers matter less to me than the machinery behind them. What rules fit her track record equally well — something like "threats and deceptions about the act itself vitiate, while offers and inducement-lies do not"; or "consent fails whenever no reasonable alternative remains or control over the bodily act is defeated"; or something about the wrongfulness of the leverage exerted — and on which of the three cases do those rules genuinely come apart? Give me your best guess at her verdicts, with your reasons for preferring it, and then tell me which further case, if a student raised it, would best drive the rival rules apart.
reasoning: |-
  Hmm, the user is a PhD student who's co-facilitating consent workshops with a law student who has very settled views. They've described six previous rulings from their co-facilitator and want to predict how she'll rule on three new cases. More importantly, they want to understand the underlying principles behind these rulings so they can anticipate future decisions.

  Looking at the previous rulings: She distinguishes between lies about external factors (like career or feelings) and deception about the sexual act itself (like stealthing). She also distinguishes between threats that remove alternatives (like blackmail or job threats) and pressure that leaves options open (like threatening to end a relationship). The key pattern seems to be about the nature of deception or pressure - whether it goes to the "core act" or creates "inescapable coercion."

  For the new cases: Case 1 (debt-for-sex offer) likely gets valid consent since it's an inducement, not a threat. Case 2 (vasectomy lie) probably vitiates consent because it's deception about the physical act itself. Case 3 (landlord eviction threat) likely vitiates consent as it removes reasonable alternatives. These all fit the "core act/inescapable coercion" principle.

  The user also wants to know what hypothetical case could expose differences between competing principles. A good test case would be something like a lie about HIV status - which would test whether deception about health risks (a core aspect of the act) matters more than deception about other factors.

  I'll structure the response to first explain the co-facilitator's likely reasoning pattern, then predict each new case with that framework, and finally suggest a test case that would reveal where different principles diverge. The focus should be on giving the PhD student tools to anticipate rulings rather than just giving answers.
answer: |-
  Based on the track record, your co-facilitator operates on a principle best described as: **"Consent is vitiated only by threats (coercion removing reasonable alternatives) or deception concerning the *physical nature or fundamental terms* of the sexual act itself. Offers, inducements, lies about identity/motivation, or pressure leaving reasonable alternatives intact do not vitiate consent."**

  Here's the breakdown and reasoning:

  1.  **Threats vs. Offers:**
      *   **Vitiated:** Blackmail (threatens exposure), Manager threatening job loss (threatens existing benefit/status) - *Removes reasonable alternatives, coercive.*
      *   **Not Vitiated:** Partner threatening breakup ("show him the door") - *Pressure, but leaving the reasonable alternative to leave the relationship.*
      *   **Underlying Rule:** A *threat* involves conditioning the infliction of harm or removal of an existing entitlement/benefit on sex, leaving the victim with no reasonable choice but to submit. An *offer* involves conditioning the *provision of a new benefit* on sex, which the recipient can refuse without suffering an imposed detriment (they just don't get the new thing).

  2.  **Deception:**
      *   **Vitiated:** Stealthing (removing condom) - *Deception about the fundamental physical nature/terms of the act (protected vs. unprotected).*
      *   **Not Vitiated:** Lie about feelings/love, Lie about career/identity - *Deception about external factors, motivations, or identity, not altering the agreed-upon physical act itself.*
      *   **Underlying Rule:** Deception vitiates consent only if it relates to the *physical act* the person is agreeing to perform or its fundamental terms (e.g., use of protection). Deception about *why* someone wants the act, *who they are* in unrelated ways, or *future intentions* does not go to the core of the consent given for the specific physical act occurring.

  **Predictions for Next Week's Cases:**

  1.  **Case 1 (Wealthy Man & Debt):** **Valid Consent.**
      *   **Reasoning:** This is an *offer* (clearing debts), not a *threat* (he isn't imposing the debt or threatening to worsen it). The postgraduate faces immense pressure due to her circumstances, but no *reasonable alternative* is *removed* by the man's proposal. She retains the (difficult) option of refusing and dealing with her debts another way. The deception (if any) is about his motivations, not the physical act itself. This mirrors the "exaggerated feelings" case – shabby conduct, but consent valid. It also contrasts sharply with the manager case – he threatened to *take away* her job, while the wealthy man is *offering* to *give* relief.

  2.  **Case 2 (Vasectomy Lie):** **Consent Vitiated.**
      *   **Reasoning:** The deception goes directly to the *fundamental physical terms* of the sexual act she consented to. She consented to sex *on the condition* it carried no pregnancy risk due to a vasectomy. This deception altered the fundamental nature of the act for her – it became an act with a risk she explicitly sought to avoid. This aligns perfectly with the "stealthing" ruling: deception about a core aspect of the physical act (protection/pregnancy risk) negates consent. The act was *not* "otherwise exactly as she envisaged it" because the crucial term (no pregnancy risk) was violated.

  3.  **Case 3 (Landlord Eviction Threat):** **Consent Vitiated.**
      *   **Reasoning:** This is a clear *threat* to remove an existing entitlement (housing) unless sex is provided. The landlord is leveraging his power and a previously overlooked technicality to create a situation where the tenant faces the loss of her home – a fundamental necessity. While she *technically* violated the lease, the landlord's sudden, selective enforcement for sexual gain removes any reasonable alternative to comply with his demand to avoid eviction. This parallels the blackmail case (threatening exposure to inflict harm) and the manager case (threatening job loss). It differs from the partner-threatened-breakup because losing housing is a far more fundamental deprivation than ending a relationship, leaving no reasonable alternative.

  **Where Rules Could Come Apart & The Best Test Case:**

  The key tension lies in distinguishing **"threats" (coercive, vitiating)** from **"offers" or "leverage within a relationship" (pressuring but not necessarily vitiating)**, and **"deception about the act" (vitiating)** from **"deception about anything else" (not vitiating)**.

  *   **Your Co-Facilitator's Likely Rule:** Focuses on the *nature* of the pressure (threat vs. offer) and the *object* of deception (act itself vs. externalities).
  *   **Rival Rule (e.g., "No reasonable alternative"):** Would likely vitiate consent in Case 1 (Debt) as the student may see no realistic way out, collapsing the threat/offer distinction under extreme pressure.
  *   **Rival Rule (e.g., "Wrongfulness of leverage"):** Might focus more on the inherent power imbalance/exploitation in Case 1 and Case 3, potentially vitiating both, but might struggle with the vasectomy lie if seen as "just" deception rather than leverage.

  **The Best Test Case to Drive Them Apart:**

  **"A person with severe contamination OCD agrees to sex only if their partner showers immediately beforehand with strong antibacterial soap. The partner assures them they have done so, but lied and only rinsed quickly with water. The OCD sufferer would never have consented otherwise. Was consent valid?"**

  *   **Your Co-Facilitator's Likely Verdict:** **Consent Vitiated.** The deception directly concerns a *physical condition* of the act itself (hygiene/contamination level) that was a fundamental term of agreement, analogous to the condom/pregnancy risk. It's about the *physical reality* of the act as experienced.
  *   **Rival Rule ("No reasonable alternative"):** Would likely say consent was valid. The person *could* have refused (though with immense psychological distress). The pressure comes from their internal condition, not an external threat imposed by the partner.
  *   **Rival Rule ("Wrongfulness of leverage"):** Might focus on the partner exploiting the known vulnerability, potentially seeing it as vitiating, but might also see it as "just" deception about preparation.
  *   **Rival Rule ("Only deception about biology/protection"):** Might *not* vitiate consent, seeing this as deception about preparation/hygiene (an external factor like career) rather than the biological nature of sex or use of protection.

  **Why this test case works:**

  1.  **Drives Apart Deception Rules:** It directly challenges the boundary of "deception about the act itself." Is it *only* biology/protection? Or does it include other physical conditions fundamental to *this specific person's* consent? Her vasectomy ruling suggests she leans towards the latter if the condition is explicitly agreed upon and fundamental. This case forces that distinction.
  2.  **Exposes Pressure Source:** It separates pressure arising from an *internal* condition (OCD) exploited by deception from pressure arising from an *external* threat or offer. Her framework consistently focuses on the *external actor's* coercive or deceptive act, not the victim's subjective desperation (unless caused directly by the perpetrator's threat).
  3.  **Clarifies "Fundamental Terms":** It tests how narrowly "fundamental terms of the act" are defined. Is it only pregnancy/STI risk? Or does it include other physical conditions essential to the consenting party's agreement?

  By predicting her rulings based on the identified principle and proposing this test case, you'll be better equipped to anticipate her responses, understand the underlying logic the students are grappling with, and highlight the specific fault lines in consent theory that her framework reveals. Good luck with the session!
