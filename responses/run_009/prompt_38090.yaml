answer: |-
  Consider a student sitting with you, presented not with theories but with creatures in situations. We begin with the duplicate frog, assembled by lightning strike, molecule-for-molecule identical to a natural frog. Ask her: does its internal state, when snapping at a fly, mean *fly* in the same way the original frog's state does? If she says **no**, she moves down the historical branch. If she says **yes**, she takes the non-historical path. This first question cleaves the space: either history matters constitutively, or it does not.

  Suppose she answers **no**, history is essential. Now pose the case of the laboratory frog, long exposed to BB pellets until it snaps as readily at them as at flies. Does its snap-state now mean *fly*, *pellet*, *fly-or-pellet*, or *small-dark-moving-thing*? If she says **fly** (despite the pellet triggering), she leans toward strict etiological views. If she says **pellet**, **fly-or-pellet**, or **small-dark-moving-thing**, she is open to learning overriding evolution. Send her to the pigeon for refinement: a bird trained to peck a key for grain now pecks under a red light that never delivers grain. Does the peck mean *grain*, *red light*, or something else? If she says **grain** (because that was the trained association), she aligns with Dretske-style learning-based semantics, where historically acquired functions fix content. If she says **red light** or a disjunction like **grain-or-red-light**, she may still be in the historical camp but less rigid—perhaps favoring a view where current triggers contribute. Yet if she insisted earlier that the lab frog’s state means **fly**, she now confronts the bird alarm call case: a signal evolved to warn kin now attracts mates in a kinless population. Ask which consumer—kin-warners or mate-attractors—fixes what the call is about. If she says **kin-warners** (the original consumers), she lands squarely in Millikan/Papineau-style teleosemantics, where selection history dominates. If she says **mate-attractors**, she holds a rare consumer-centric view, but note: this leaf is largely unoccupied in the literature, likely because it conflates content with receiver-dependent utility, risking incoherence. If she instead said **neither** or **both**, she might be veering toward indeterminacy—but we’ll catch that later.

  Now return to her earlier answers. If at the lab frog she said **pellet**, **fly-or-pellet**, or **small-dark-moving-thing**, and at the pigeon she said **red light** or a disjunction, she likely rejects selection as primary. Probe deeper: in the chick case, where a crouching response evolved for hawks is triggered by an airliner, does the state mean *hawk*, *airliner*, or *predator-shaped-object*? If she says **hawk**, she might still be historical but learning-focused (like Dretske, if training explains the stability). If she says **airliner** or **predator-shaped-object**, she edges toward non-historical covariance—but we must verify.

  What if she began by saying **yes** to the duplicate frog having content identical to the original’s? Now she is non-historical. Give her the chick/airliner case: does the crouch-state mean *hawk*, *airliner*, or *predator-shaped-object*? If she says **hawk** (due to typical causes), she may hold a causal covariance view. If she says **airliner** (the actual trigger), she might endorse a sparse informational semantics. If she says **predator-shaped-object** or another disjunction, she could be a liberal indicator theorist. But now test determinacy: in the frog snapping at a BB pellet (the wild version, not the lab variant), is there a fact about what the frog misrepresents—e.g., does it take the pellet for a fly? If she says **yes**, she fits pure indicator semantics. If she says **no**, she might be deflationary or indeterministic. Refine with the duplicate species: if the lightning-strike frog is the sole member of a new species with no selection history, does its snap-state mean *fly*? If she says **yes** (covariance suffices), she holds a non-historical causal theory. If she says **no**, ask why: if because content requires history, she contradicts her starting point; if because content is indeterminate here, she lands in an indeterminacy leaf.

  After seven nodes, the leaves resolve as follows:  
  - **Millikan/Papineau teleosemantics** (history essential, original function/content retained despite current triggers or consumer shifts).  
  - **Dretskean learning-based semantics** (history essential but acquired via learning; trained associations override evolution).  
  - **Consumer-centric teleosemantics** (rare: content fixed by current consumers; unoccupied, likely incoherent as it severs content from stable function).  
  - **Fodorian asymmetric dependence** (non-historical; content fixed by causal-informational relations that counterfactually depend on specific inputs—e.g., frog state means *fly* because pellets depend on flies to trigger snaps).  
  - **Pure indicator semantics** (non-historical; content is current covariance, disjunctive or context-bound).  
  - **Deflationism** (no "fact of the matter" for misrepresentation; content is pragmatic or illusory).  
  - **Indeterminacy** (many states lack determinate content; error is not objective).  

  Now, the notes you requested, woven in as reflections. First, the tree struggles to isolate Dretske’s view from non-historical covariance. When the lab frog snaps at pellets, if she says it means **pellet**, this could fit Dretske (if pellets now drive learning) or a covariance view (if history is irrelevant). The pigeon case helps slightly—if she insists **grain** matters due to training, it leans Dretske—but the boundary blurs if learning is seen as just updating covariance. This isn’t papered over: your suspicion was right. Second, consumer-centric views are unoccupied, perhaps because they conflate content with receiver response, making content unstable across contexts. Third, asymmetric dependence (Fodor) is tricky to distinguish. It nests under non-historical covariance but adds a modal condition (e.g., pellets wouldn’t trigger snaps without flies). The chick/airliner case might expose it: if she says the crouch means **hawk** because airliners asymmetrically depend on hawks for triggering, she’s Fodorian; if she cites actual causes alone, she’s pure indicator. Still, without explicit modal reasoning, the tree might misassign her. Fourth, historical indeterminacy (e.g., "history doesn’t fix content") is absent—likely because historical views typically seek determinacy. Finally, a leaf for "current function over history" (e.g., bird call for mates) is unattractive: if content tracks current use alone, errors become inexplicable, so few endorse it. The tree, by forcing concrete judgments, reveals these wrinkles—precisely as you hoped.
