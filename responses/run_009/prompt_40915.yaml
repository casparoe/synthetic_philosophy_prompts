  **Written Procedure: Disciplined Use of the Outside View**

  **Step 1: Define the Outcome (Decline or Event)**
  - *Rationale in plain language:* We need a clear and consistent definition of the event we are predicting so that we can compare across historical cases without ambiguity.
  - *Procedure:* 
    a. Define the outcome (e.g., "loss of military primacy") in measurable terms (e.g., when a nation's military spending as a share of the global total falls below a certain threshold, or when it is overtaken by another nation and does not regain the top spot for at least 10 years). 
