thin fifty years; that a long-standing regional alliance will outlast its present membership; and that a rising power's construction of overseas port and infrastructure interests presages territorial expansion within three decades. For at least one of the three, the procedure should be allowed to reach a conclusion that would embarrass our institutional priors — we have been telling readers that the alliance is durable for twenty years — and the procedure should be built so it cannot be quietly tuned to flatter us. Constraints: two weeks per assessment, open-source material only, and readers who will not accept a conclusion justified purely in formal epistemology jargon, so each step needs a one-sentence plain-language rationale a staff member can repeat in a briefing without us.
