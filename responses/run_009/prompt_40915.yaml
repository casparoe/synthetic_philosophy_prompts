  **Step 5: Combine Base Rate with Case-Specific Evidence**
  - *Rationale in plain language:* While the base rate gives a starting point, we adjust it based on how much the current case differs from the average case in the reference class in ways that matter for the outcome.
  - *Procedure:*
    a. Use a Bayesian updating approach:
        - Start with the base rate (prior probability).
