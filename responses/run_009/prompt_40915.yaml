  ### **Procedure: Disciplined Outside View for Strategic Trajectories**  
  *Rationale: To ground predictions in historical patterns while transparently acknowledging uncertainties, avoiding bias from "unprecedented" narratives.*  

  #### **Step 1: Select the Reference Class**  
  - **Rationale:** "We define a group of historical cases similar to the current case in ways that matter for the outcome, to avoid cherry-picking."  
  - **Procedure:**  
    1. **Brainstorm candidate classes independently:** Each team member proposes 1–3 reference classes (e.g., "all post-1850 industrial great powers," "all maritime empires," "all Cold War-era alliances") with explicit criteria (e.g., economic system, military reach, alliance structure). *Judgment call: Criteria must be justified by theory, not outcome.*  
    2. **Test for reverse-engineering:** Vote on classes *before* calculating base rates. Discard any class if >30% of team objects that criteria appear outcome-driven.  
    3. **Default class:** If deadlock, use "all great powers since 1500 with GDP >15% of global output at peak" (adjustable by era). *Rationale: Balances breadth with relevance to dominance dynamics.*  

  #### **Step 2: Define the Outcome ("Decline")**  
  - **Rationale:** "We measure decline as a sustained drop in critical capabilities relative to rivals, using consistent thresholds across cases."  
  - **Procedure:**  
    1. **Quantify the outcome:** For powers, define "loss of primacy" as >20% decline in share of global military spending/capabilities for ≥10 years, or loss of #1 position to a rival. For alliances, define "collapse" as dissolution or exit of >50% of founding members. *Mechanical: Code using standardized datasets (e.g., Correlates of War, World Bank).*  
    2. **Handle censored cases (still-standing powers/alliances):** Treat as "no event" during observed history but use survival analysis (Kaplan-Meier estimator) to compute probabilities, adjusting for incomplete timelines. *Mechanical: Apply open-source tools (e.g., R `survival` package) to account for "right-censoring."*  

  #### **Step 3: Compute Base Rates**  
  - **Rationale:** "We calculate how often similar powers/alliances faced similar outcomes, using historical data."  
  - **Procedure:**  
    1. **Gather data:** Use open-source repositories (e.g., Penn World Table, IISS Military Balance, UCDP Alliance Dataset) to code outcomes for the reference class. *Mechanical: Extract using predefined thresholds from Step 2.*  
    2. **Calculate base rate:** % of cases where the outcome occurred within the time horizon (e.g., 50 years). For censored cases, use survival analysis output. *Mechanical: Formula = (Events) / (Total cases adjusted for censoring).*  

  #### **Step 4: Combine Base Rate with Case-Specific Evidence**  
  - **Rationale:** "We adjust the base rate only if the current case differs from historical ones in ways proven to affect outcomes."  
  - **Procedure:**  
    1. **Identify adjustment factors:** List 1–3 unique traits of the case (e.g., nuclear deterrence, AI-driven economy). *Judgment call: Factors must have empirical support (e.g., "nuclear powers have 50% lower conflict risk").*  
    2. **Adjust via Bayesian updating:** Start with base rate as "prior." For each factor, apply an odds multiplier based on historical precedents (e.g., "when factor X was present, odds of outcome doubled"). *Mechanical: Posterior odds = Prior odds × Multiplier1 × Multiplier2...*  
    3. **Cap adjustments:** Limit multipliers to 0.5–2.0 unless extreme evidence (e.g., novel WMD). *Rationale: Prevents "unprecedented" claims from overriding history.*  

  #### **Step 5: Resolve Conflicting Reference Classes**  
  - **Rationale:** "We report conflicting base rates as a range and flag high uncertainty instead of forcing consensus."  
  - **Procedure:**  
    1. If ≥2 defensible classes have base rates within 20 percentage points (e.g., 30% vs. 45%), average them.  
    2. If rates differ by >20 points (e.g., 10% vs. 60%), report the range (e.g., "10–60%") and state: "Divergent references suggest high uncertainty; historical parallels are weak." *Do not average. Judgment call: "Defensible" = class passed Step 1.3.*  

  #### **Step 6: Quarterly Updates for Long Horizons**  
  - **Rationale:** "We track leading indicators tied to the outcome, not reassess the entire model quarterly."  
  - **Procedure:**  
    1. **Identify 2–3 leading indicators:** Metrics with historical correlation to the outcome (e.g., for power decline: R&D growth vs. rivals; for alliances: trade dependence between members). *Judgment call: Based on regression studies (e.g., "alliance cohesion predicts dissolution").*  
    2. **Monitor indicators:** Use open-source data (e.g., IMF trade stats, patent databases). If indicators change beyond a threshold (±10% from baseline), re-run Steps 3–4. *Mechanical: Predefined triggers avoid opinion-driven updates.*  

  #### **Step 7: Acknowledge Limitations**  
  - **Rationale:** "We stop when history is too sparse or contradictory to guide predictions."  
  - **Procedure:** Halt and state: "The outside view is uninformative here" if:  
    - Reference class has <5 cases.  
    - >50% of cases are censored.  
    - Base rates conflict by >40 points after Step 5.  
    *Judgment call: Team vote on "informative" threshold.*  

