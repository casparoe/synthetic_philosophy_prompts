  ### **Procedure Safeguards Against Bias**  
  - **Anti-manipulation design:** Steps 1.2 (pre-vetting classes) and 4.3 (capped multipliers) prevent "tuning" to desired conclusions. Step 5 forces transparency on uncertainty.  
  - **Judgment vs. mechanical:**  
    - Mechanical: Outcome coding (Step 2), base rate math (Step 3), multiplier application (Step 4), survival analysis.  
    - Judgment calls: Reference class proposals (Step 1.1), adjustment factors (Step 4.1), "informative" threshold (Step 7).  
  - **Where it stops:** The procedure halts early if Step 7 conditions met (e.g., Claim C if only post-1990 class used).  

  This procedure delivers auditable, historically grounded assessments while constraining "unprecedented" exceptionalism. It forces disagreements into structured debates (e.g., Step 1 voting) and resists institutional capture by design.
