  Below is a written procedure for integrating the "outside view" into your strategic assessments, designed to transform it from a rhetorical device into a disciplined, transparent process. The procedure addresses your specified requirements, including reference class selection, outcome definition, handling of censored data, combining base rates with case-specific evidence, reconciling conflicting reference classes, quarterly updates for long horizons, and acknowledging limitations. Each step includes a one-sentence plain-language rationale for policymakers. I then apply the procedure to your three claims, allowing one conclusion to challenge institutional priors (Claim B: the regional alliance). The procedure is executable within two weeks using open-source materials and resists manipulation by design.

