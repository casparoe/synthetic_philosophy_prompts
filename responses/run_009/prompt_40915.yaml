    c. This step is judgmental: the choice of characteristics and the initial candidate classes require expert judgment.

  **Step 3: Collect Data and Compute Base Rates**
  - *Rationale in plain language:* We count how often the outcome happened in similar past cases to get a baseline probability.
  - *Procedure:*
    a. For each reference class, identify the set of historical cases that meet the criteria (using open-source historical data and academic literature).
    b. For each case, determine if the outcome (as defined in Step 1) occurred within the time horizon. For censored cases (where the time horizon hasn't fully passed), we use the Kaplan-Meier estimator (a standard method in survival analysis) to account for incomplete histories. Alternatively, if the event horizon is long (like 50 years) and we are looking at recent cases, we may exclude cases that started less than 50 years ago to avoid censoring issues, but this must be documented.
