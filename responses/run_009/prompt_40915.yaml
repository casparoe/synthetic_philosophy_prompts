  **Step 2: Select the Reference Class**
  - *Rationale in plain language:* We choose a group of past cases that are similar to the current case in ways that matter for the outcome, to avoid cherry-picking and to ground our prediction in historical patterns.
  - *Procedure:*
    a. Start by brainstorming candidate reference classes. Examples: 
