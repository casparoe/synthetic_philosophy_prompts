  3. How to combine the base rate with case-specific evidence.
  4. What to do when two defensible reference classes yield different base rates.
  5. How to update quarterly for a 50-year event horizon.
  6. Where to stop and state that the outside view cannot settle the question.

  Additionally, we must identify which steps are mechanical and which are judgment calls.

  We will then run the procedure on three claims:
  A. The currently dominant military power (we'll assume the U.S.) will not lose primacy within fifty years.
  B. A long-standing regional alliance (we'll assume NATO) will outlast its present membership.
  C. A rising power's (we'll assume China) construction of overseas port and infrastructure interests presages territorial expansion within three decades.

