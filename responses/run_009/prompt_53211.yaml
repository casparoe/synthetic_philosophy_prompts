  Key concessions upfront: internal value functions compute reward-like quantities without a clear distinction principle, and no valence criterion that isn't implementation-biased. The audience factions matter critically here—computational neuroscientists (reward=dopamine controllers), philosophers (functionalists), ML engineers (practical safety concerns), and animal welfare scientists (distrust behavioral criteria). 

