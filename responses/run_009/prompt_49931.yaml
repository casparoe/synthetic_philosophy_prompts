  The allotropes case is particularly telling. When a polymorph transition halts production but regulators call it the same substance, that's not just academic - it's where rubber meets road in industrial classification. This suggests any viable theory must handle the tension between scientific and operational categories.

  Their suspicion about jointly unsatisfiable requirements is acute. Instrument-independence vs deference to scientific practice seems genuinely paradoxical. I'll need to confront this directly - no dodging.

  For structure: I'll build the list around their cases, but generalize carefully. Isotopes → inquiry-relativity. Allotropes → granularity dependence. Jade → cross-cutting kinds. Each item must show how it emerges from real classification pain points.

  On theories: Essentialism clearly fails the isotope test immediately - if atomic number defined chemical kinds, deuterium would break the scheme. Homeostatic clusters might handle functional kinds but struggle with instrumentation effects. 

  The Pluto vs quasicrystal comparison is brilliant - both are reclassifications but feel ontologically different. This might point to a key desideratum about how theories handle paradigm shifts versus boundary adjustments.

  I should flag where tradeoffs are unavoidable. That instrumentation/practice tension might be fundamental - perhaps natural kinds are inherently provisional for working scientists, which would dissatisfy philosophers seeking timeless categories.

  Most importantly: no platitudes. Every point must ring true to someone who's argued over tacticity thresholds on a factory floor.
answer: |-
  Here is a systematized list of desiderata for an adequate account of natural kinds, grounded in your cases and considerations, with an evaluation of major theoretical approaches against them. Where conflicts exist, they are explicitly noted.

  ### Core Desiderata (Non-Negotiable)
  1.  **Inquiry-Relativity:**  
      *   **What it must deliver:** Natural kinds must be relative to a specific domain of inquiry or explanatory project. What is "natural" in chemistry (elements, compounds) may not be in nuclear physics (isotopes), and vice-versa. Neither perspective is ontologically privileged *simpliciter*.  
      *   **Case:** Isotopes (chemist vs. nuclear physicist); Clay (geologist vs. materials scientist vs. potter).
      *   **Non-Negotiable?** Yes. Denying this renders the isotope case inexplicable.

  2.  **Granularity Tolerance:**  
      *   **What it must deliver:** The account must accommodate different levels of descriptive grain as legitimate for different purposes. Distinguishing polymorphs (allotropes) can be essential for material performance but irrelevant for regulatory composition.  
      *   **Case:** Polymorphs/Allotropes (diamond vs. graphite; production line vs. active ingredient); Tacticity changes (new material vs. worse version).
      *   **Non-Negotiable?** Yes. Essentialism fails here by demanding a single privileged grain.

  3.  **Boundary Revision Without Collapse:**  
      *   **What it must deliver:** It must distinguish between revisions driven by *empirical discovery revealing ontological structure* and those driven by *pragmatic convention*. The former feels "forced by nature," the latter by human needs. The account should illuminate *why* the Pluto demotion feels different from the crystal redefinition.  
      *   **Case:** Quasicrystals (redefining "crystal" based on new structure) vs. Pluto (redefining "planet" based on dynamical clearing); Species concept revisions (morphological -> biological -> phylogenetic).  
      *   **Non-Negotiable?** Yes. A theory that makes all revisions look identical fails descriptively.

  4.  **Accommodation of Cross-Cutting Classifications:**  
      *   **What it must deliver:** Must allow that the same entities can be validly grouped into different natural kinds based on different properties or functions, even if these groupings cross-cut each other. These different groupings reflect real aspects of the world relevant to different inquiries.  
      *   **Case:** Jade (nephrite/jadeite as mineral kinds vs. "jade" as functional/cultural kind); Clay (grain-size kind vs. mineralogical composition kind vs. plasticity kind); Keystone Species (functional role kind, not intrinsic property kind).  
      *   **Non-Negotiable?** Yes. Monolithic kinds cannot handle jade or keystone species.

  ### Desiderata Involving Tension (Potentially Negotiable/Conflict-Prone)
  5.  **Instrumentation Robustness (Weak):**  
      *   **What it should ideally deliver:** Kind boundaries should not be *fundamentally unstable* or *completely redrawn* solely due to incremental improvements in resolution. Kinds should have some robustness against mere measurement finesse, implying they track something beyond the noise.  
      *   **Case:** Distinguishing tacticity variants – better NMR shouldn't *always* force declaring a "new kind" if the material properties cluster stably at lower resolution. Polymer families defined by performance, not ultimate analytical purity.
      *   **Non-Negotiable?** **No, but desirable.** It reflects the intuition that kinds "carve" something real. However, it conflicts directly with Deference to Practice (6). *This is the core of your suspected joint unsatisfiability.*

  6.  **Deference to Scientific Practice (Strong):**  
      *   **What it must deliver:** The account must take the actual classificatory practices and revisions made by working scientists in specific fields as the primary data and justification for what counts as a natural kind *within that domain*. Philosophers don't dictate; they interpret practice.  
      *   **Case:** Crystallographers redefining "crystal"; Biologists debating species concepts; Regulators defining "active ingredient"; Chemists deciding when tacticity matters.  
      *   **Non-Negotiable?** **Yes.** Denying this makes philosophy irrelevant to science. But it *directly conflicts* with strict Instrumentation Robustness (5), as scientists *do* revise kinds based on new instruments (NMR revealing tacticity, crystallography revealing quasicrystals).

  **The Conflict Verdict:** Desiderata 5 (Instrumentation Robustness) and 6 (Deference to Practice) **are jointly unsatisfiable in their strong forms.** Working scientists *do* revise kind boundaries based on new instruments when those instruments reveal structure or properties that impact explanatory power, predictive success, or practical application within their domain. A theory demanding *complete* indifference to instrumentation (strong 5) cannot defer to practice (6). The best compromise is a *qualified* robustness: kinds should be stable *relative to the explanatory goals and measurement capabilities of their defining inquiry*. Dramatic instrumentation shifts *can* trigger domain redefinition or kind revision, but incremental improvements shouldn't *constantly* destabilize core kind categories if they represent robust property clusters. This is messy but reflects reality.

  ### Evaluation of Major Theories Against Desiderata

  *   **Classical Essentialism (Microstructural, e.g., Kripke/Putnam):**
      *   **Fails:** 1 (Inquiry-Relativity - isotopes break it), 2 (Granularity - ignores polymorphs/tacticity), 4 (Cross-Cutting - can't handle jade/keystone species), 6 (Deference - often contradicts practice, e.g., ignoring functional kinds). Struggles with 3 (Revision - Pluto vs. quasicrystal distinction unclear).
      *   **Strength:** Provides a (too simplistic) answer for 5 (Robustness) - essence is instrumentation-independent.
      *   **Eliminated by:** **Inquiry-Relativity (1).** Isotopes are the death knell.

  *   **Homeostatic Property Cluster (HPC) Views (e.g., Boyd):**
      *   **Handles Well:** 1 (Relativity - clusters defined relative to domains/theories), 2 (Granularity - clusters can be coarse or fine-grained), 4 (Cross-Cutting - different clusters for different properties/functions), 6 (Deference - built to model scientific practice).
      *   **Struggles With:** 3 (Revision - Distinguishing "forced by nature" vs. "pragmatic" revisions isn't inherent to the view). 5 (Robustness - Clusters *can* be stable, but practice shows instrumentation *does* reveal new properties/mechanisms that reshape clusters).
      *   **Accommodates:** The Instrumentation/Practice conflict by making clusters *defined within a theoretical/explanatory framework*, so new data (from instruments) can legitimately reshape the cluster *if* it changes the theory's causal understanding. Robustness is contingent, not absolute.

  *   **Radical Pluralism / Deflationary Views (e.g., Dupré, some pragmatists):**
      *   **Handles Well:** 1 (Relativity - core tenet), 2 (Granularity - core tenet), 4 (Cross-Cutting - core tenet), 6 (Deference - core tenet). Easily explains Pluto as pragmatic.
      *   **Struggles With:** 3 (Revision - Makes *all* revision look conventional/pragmatic, struggling to capture the "forced by nature" feeling of quasicrystals). **Fails:** 5 (Robustness - Explicitly rejects it; kinds are interest-relative and instrument-sensitivity is expected). Can trivialize "natural" (Is *any* useful grouping a "natural kind"?).
      *   **Accommodates:** The Instrumentation/Practice conflict by abandoning Robustness (5) entirely, embracing instrument-driven revision as natural consequence of pluralism.

  **Which Requirement Eliminates the Most Candidates? Inquiry-Relativity (1).** Essentialism is dead on arrival. HPC and Pluralism build it in. This requirement forces the abandonment of any monistic, physics-fundamentalist, or strong essentialist view. It establishes the domain-specificity of natural kinds as foundational.

  **Synthesis & Your Demand:** An adequate account **must** be pluralist and practice-grounded (satisfying 1, 2, 4, 6). It must provide tools to analyze the *reasons* behind revisions (satisfying 3), distinguishing ontological discoveries (quasicrystals revealing new structural possibilities) from pragmatic boundary-drawing (Pluto/dynamical dominance). It must *acknowledge* but *qualify* the desire for robustness (5), accepting that stability is relative to a domain's current explanatory framework and instrumentation baseline, not absolute. The inherent tension between 5 and 6 cannot be fully resolved; a good account makes this tension explicit and shows how scientific practice navigates it dynamically, rather than pretending it doesn't exist. The "difference that is visible" (Desideratum 3) between Pluto and quasicrystals lies in whether the revision stems from encountering a fundamentally *new type of structure/phenomenon* that disrupts the old category's coherence (quasicrystals) versus refining a *conventional boundary* within an existing stable framework based on new data or pragmatic needs (Pluto, arguably some species revisions).
