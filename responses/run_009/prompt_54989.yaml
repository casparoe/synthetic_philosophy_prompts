prompt: |-
  Write a satirical internal memo, maybe 600ish words, from the "Historical Analogy Compliance Office" of a large AI lab. The memo instructs employees on which of the three approved historical analogies — nuclear weapons, the printing press, the Industrial Revolution — they are required to deploy in any given op-ed, whitepaper, all-hands talk, or congressional testimony, and includes a short decision tree for choosing between them.

  The humor has to come from real features of the analogy debate, not invented ones, so that someone who's actually read this literature laughs instead of winces:

  - each analogy should come with its official "talking strengths" and its known failure modes (nuclear gets you arms-race framing, verification regimes, and a hard capability ceiling, but fission was discovered rather than chosen and the tech was securable in a way software isn't; the printing press gets you inevitable diffusion and massive downstream epistemic upheaval, but nobody controlled it partly because nobody much tried, and the content/hardware distinction does weird work there; the Industrial Revolution gets you gradualism and labor-market adjustment over generations, which is exactly what people dispute when timelines are short)
  - the memo should quietly reveal that the analogy selection smuggles in the policy conclusion — pick nuclear and you've basically already endorsed export controls and treaty-building, pick the press and you've already conceded containment is hopeless, pick the Industrial Rev and you've argued for slow institutional adaptation — and the decision tree should route the analyst to whichever analogy matches the conclusion they already had, while insisting it's doing the opposite
  - at least one clause should acknowledge the reference-class problem (why these three? why not fire, writing, electrification, the internet, language itself, or the Columbian Exchange?) and then dismiss it in a footnote, and the dismissal should be the joke
  - one numbered rule should ban "mixed analogies" (e.g. arguing AI is like nuclear weapons geopolitically but like the printing press domestically) while another should mandate them whenever a journalist is present

  Format: memo header, numbered rules, the decision tree (it can be genuinely usable, which makes it funnier), maybe a closing note about the office being staffed by one person who also handles the lab's other historical comparisons. Invented names for the compliance officer and lab departments are fine; don't name any real company or living person. Keep it deadpan throughout — no winking at the reader, the memo is 100% sincere about its own importance. And end with something that quietly lands the deeper point, that these analogies are doing rhetorical work rather than predictive work, without ever saying that out loud.

  (small note: the typo in rule 4 is intentional, dont fix the memo being slightly sloppy in one place, compliance offices always are)
reasoning: |-
  We are writing a satirical internal memo from the "Historical Analogy Compliance Office" (HACO) of a large AI lab. The memo must be deadpan, sincere, and follow the specified structure: memo header, numbered rules, a decision tree, and a closing note. The humor must come from real features of the analogy debates, and we must include the elements: talking strengths and failure modes for each analogy, the way the analogy selection smuggles in policy conclusions, the reference-class problem (acknowledged and dismissed in a footnote), and the rules about mixed analogies. We'll also end with a subtle point about the analogies being rhetorical rather than predictive.

  Key elements to cover:

  1. **Three Approved Analogies**:
     - Nuclear Weapons: 
       - Talking strengths: arms-race framing, verification regimes, hard capability ceiling.
       - Failure modes: fission was discovered (not chosen), tech was securable (unlike software).
       - Policy conclusion: export controls, treaty-building.

     - Printing Press:
       - Talking strengths: inevitable diffusion, massive downstream epistemic upheaval.
       - Failure modes: nobody controlled it partly because nobody tried much, content/hardware distinction.
       - Policy conclusion: containment is hopeless.

     - Industrial Revolution:
       - Talking strengths: gradualism, labor-market adjustment over generations.
       - Failure modes: what if timelines are short? (disputing gradualism)
       - Policy conclusion: slow institutional adaptation.

  2. **Decision Tree**: Should route the analyst to the analogy that matches their pre-existing policy conclusion while pretending it's objective.

  3. **Reference-class problem**: Briefly acknowledge (why not fire, writing, etc.) and dismiss in a footnote. The dismissal is the joke.

  4. **Rules**:
     - Rule banning mixed analogies (except when a journalist is present, then mandate them).
     - Other rules as needed.

  5. **Closing note**: The office is staffed by one person who also handles other historical comparisons. End with a subtle landing on the rhetorical function of the analogies.

  Let's structure the memo:

  **MEMO HEADER**:

  To: All Research, Policy, and Communications Staff
  From: Historical Analogy Compliance Office (HACO)
  Subject: Mandatory Use of Approved Historical Analogies in External Communications
  Date: [Current Date]
  Ref: HACO-POL-2024-003

  **Body**:

  Begin with an introduction about the importance of consistent messaging and the risks of unvetted historical comparisons.

  Then, the three approved analogies with their talking points and failure modes (but presented as "caveats" to be aware of, not as reasons to avoid the analogy).

  **Numbered Rules**:

  1. Only the three approved analogies (Nuclear Weapons, Printing Press, Industrial Revolution) may be used in external communications (op-eds, whitepapers, all-hands talks, congressional testimony).

  2. Each analogy must be deployed with its official talking strengths (as outlined in Section 2). Caveats (Section 3) may be mentioned only in technical documents and only when necessary for accuracy.

  3. Analysts must use the attached decision tree (Appendix A) to select the appropriate analogy for each communication.

  4. Mixed analogies (e.g., "AI is like nuclear weapons in terms of geopolitical risk but like the printing press in terms of accessibility") are strictly prohibited in formal communications. [Note: We'll have a rule later that mandates them for journalists.]

  5. Exception: When interacting with journalists (defined as any on-record conversation with a member of the press), mixed analogies are mandatory. The approved mix is "Nuclear-Press" (nuclear for risk, press for diffusion) or "Press-Industrial" (press for disruption, industrial for economic impact). The "Nuclear-Industrial" mix is under review.

  6. [Intentional typo?] All external communications must be submited to HACO for pre-approval at least 72 hours in advance, except in cases of congressional testimony which require 5 business days.

  **Section 2: Approved Analogies and Their Talking Strengths**

  - **Nuclear Weapons (codenamed "NUCLEAR")**: 
    - Talking strengths: Emphasizes the existential risk and the need for international cooperation, arms control, and verification regimes. Highlights the concept of a "hard capability ceiling" (i.e., once the bomb exists, there's no scaling down its destructive power). Useful for discussions on AI safety and governance.
    - Caveats: Note that the discovery of fission was a scientific inevitability, whereas AI development is a chosen path. Also, nuclear materials are physically securable, unlike software.

  - **Printing Press (codenamed "PRESS")**:
    - Talking strengths: Underscores the inevitability of diffusion and the profound, long-term societal and epistemic shifts. Stresses that attempts at control may be futile and that the focus should be on resilience and adaptation to information proliferation.
    - Caveats: Historical note: control was not attempted at scale (e.g., the Catholic Church tried but failed). The distinction between hardware (press) and content (books) is complex and may not map cleanly to AI.

  - **Industrial Revolution (codenamed "INDUSTRIAL")**:
    - Talking strengths: Focuses on economic transformation, the gradual adaptation of labor markets, and the role of institutions in managing change over generations. Reassures that societal disruption is manageable through policy and time.
    - Caveats: The pace of change in AI may be compressed (timelines are disputed), which could challenge the gradualism narrative.

  **Section 3: Decision Tree (Appendix A)**

  We present a decision tree that routes the user based on the policy conclusion they wish to support. But we frame it as based on the characteristics of AI.

  Decision Tree for Historical Analogy Selection:

  1. Is the primary concern about catastrophic risk and the need for immediate, coordinated global action? 
     - Yes → Use NUCLEAR.
     - No → Go to 2.

  2. Is the primary concern about the uncontrollable spread of AI and the inevitability of widespread access?
     - Yes → Use PRESS.
     - No → Go to 3.

  3. Is the primary concern about economic disruption and the need for long-term societal adaptation?
     - Yes → Use INDUSTRIAL.

  Note: If none of the above, please consult HACO. (But in practice, the tree covers the pre-approved conclusions.)

  **Footnote on Reference-Class Problem**:

  In Section 2, we can add a footnote when listing the three analogies: 

  "Why these three? Why not fire, writing, electrification, the internet, language itself, or the Columbian Exchange? While these alternatives have been proposed in academic literature, they lack the necessary institutional consensus and policy traction. Moreover, they do not align with the pre-approved regulatory frameworks currently under consideration by major governmental bodies. Thus, they are not authorized for use at this time." [The joke: we dismiss them because they aren't politically useful, not because they are less valid.]

  **Closing Note**:

  The memo ends with a note from the HACO officer, who is overworked and also handles other comparisons (e.g., "is this more like the Manhattan Project or the Apollo Program?"). 

  Final sentence: "By adhering to these guidelines, we ensure that our historical analogies not only illuminate the unique challenges of AI but also guide stakeholders toward the most prudent and actionable policy responses." [This quietly lands the point: the analogies are chosen to guide policy, not necessarily because they are the best predictors.]

  **Character Names and Lab Departments**:

  - Compliance Officer: Reginald Throckmorton
  - Lab Departments: Research Division, Policy and Governance Unit, Strategic Communications

  Let's write the memo accordingly.
answer: |-
  **MEMORANDUM**  
  **To:** All Research, Policy, and Communications Personnel  
  **From:** Historical Analogy Compliance Office (HACO), Attn: Dr. Reginald Throckmorton, Senior Compliance Officer  
  **Subject:** Mandatory Use of Approved Historical Analogies in External Communications (HACO Directive 2024-07)  
  **Date:** October 26, 2024  
  **Ref:** HACO-POL-003  

  ### 1. PURPOSE  
  To standardize deployment of historical analogies in all external-facing communications (op-eds, whitepapers, all-hands talks, congressional testimony). Unvetted analogies risk contradicting organizational policy, confusing stakeholders, or implying strategic indecision. Only pre-approved analogies—Nuclear Weapons (“NUCLEAR”), Printing Press (“PRESS”), and Industrial Revolution (“INDUSTRIAL”)—may be used.  

  ### 2. APPROVED ANALOGIES & DEPLOYMENT PARAMETERS  
  Each analogy has been rigorously validated for rhetorical efficacy and policy alignment. Use the designated talking strengths (TS) as primary arguments. Caveats (CA) may be acknowledged *only* when unavoidable (e.g., peer-reviewed journals) and must be followed by reaffirmation of TS.  

  - **NUCLEAR (TS)**:  
    - Emphasizes arms-race dynamics, need for verification regimes (e.g., test bans), and hard capability ceilings (e.g., “AI cannot be ‘uninvented’ once critical thresholds are crossed”).  
    - **Policy alignment**: Implies urgent export controls, bilateral/multilateral treaties, and centralized control.  
    - **(CA)**: *Fission was discovered, not engineered via iterative R&D. Physical securability of nuclear materials does not map to software.*  

  - **PRESS (TS)**:  
    - Highlights inevitable technological diffusion (e.g., “Gutenberg’s press could not be contained”) and systemic epistemic upheaval (e.g., “Reformation-scale disruption to knowledge hierarchies”).  
    - **Policy alignment**: Supports inevitability of open-source proliferation, rendering containment futile. Focus shifts to resilience.  
    - **(CA)**: *Control was rarely attempted at scale. Content/hardware distinction complicates AI regulation (e.g., regulating models vs. outputs).*  

  - **INDUSTRIAL (TS)**:  
    - Stresses gradualism (e.g., “AI is an evolution, not an explosion”) and generational labor-market adaptation (e.g., “Luddite movements resolved via retraining”).  
    - **Policy alignment**: Endorses slow-adapting institutions (e.g., education reform, welfare programs) and dismisses “discontinuity” narratives.  
    - **(CA)**: *Assumes multi-decade timelines. Labor displacement may be abrupt if capabilities accelerate.*  

  ### 3. COMPLIANCE RULES  
  1. **Approved Set Exclusivity**: Only NUCLEAR, PRESS, or INDUSTRIAL may be used. Prohibited alternatives include but are not limited to: electrification, the internet, language, fire, writing, or the Columbian Exchange. (See Footnote 1.)  
  2. **Caveat Suppression**: Caveats (Section 2) must not appear in public forums without HACO pre-approval.  
  3. **Decision Tree Adherence**: Select analogy via Appendix A. *Do not* deviate from its output.  
  4. **Mixed-Analogy Prohibition**: Combining analogies (e.g., “Geopolitically NUCLEAR, domestically PRESS”) creats ambiguity and is forbidden—except under Rule 5.  
  5. **Mixed-Analogy Mandate**: In any interaction with journalists (defined as on-record exchanges), *always* deploy mixed analogies. Use either:  
     - **NUCLEAR-PRESS**: “Existential risk requires treaties (NUCLEAR), but open-source diffusion is unstoppable (PRESS).”  
     - **PRESS-INDUSTRIAL**: “Epistemic disruption is inevitable (PRESS), but economic adaptation will be gradual (INDUSTRIAL).”  
  6. **Pre-Review Requirement**: Submit all external materials to HACO 72hrs pre-delivery. Testimony requires 5 business days. Non-compliant drafts will be returned with edits.  

  ### FOOTNOTE 1: REFERENCE-CLASS RATIONALE  
  ¹ *Why these three? Why not fire, writing, or the internet? While these exhibit superficial parallels, they lack the requisite institutional scaffolding for actionable policy levers. Fire, for example, implies universal human agency (unsuited to centralized governance); the internet’s “open protocol” ethos conflicts with licensure frameworks; and the Columbian Exchange lacks modern state-level analogs. Our triad, by contrast, is embedded in multilateral discourse (e.g., IAEA, IPCC) and pre-validated by policymakers. Expansion requests may be filed via HACO-FORM 11B (pending review).*  

  ### APPENDIX A: ANALOGY SELECTION DECISION TREE  
  *Instructions: Answer sequentially. Terminal node dictates analogy.*  
  1. **Is the core argument that AI requires immediate, state-driven containment?**  
     - YES → Use **NUCLEAR**.  
     - NO → Proceed to 2.  
  2. **Is the core argument that AI’s diffusion/distribution cannot be meaningfully restricted?**  
     - YES → Use **PRESS**.  
     - NO → Proceed to 3.  
  3. **Is the core argument that AI’s impacts will unfold gradually, allowing societal adaptation?**  
     - YES → Use **INDUSTRIAL**.  
     - NO → *ERROR*: Reassess core argument. Policy conclusions must align with one terminal node.  

  ### CLOSING NOTES  
  HACO acknowledges increased analogy-adjacent workloads (e.g., cross-mapping AI ethics to Vatican Indexes or productivity metrics to steam-loom output). Staffing remains at one (1) FTE (Dr. Throckmorton), who concurrently manages the lab’s Chronological Metaphor Database (including misuse escalations for “Manhattan Project” vs. “Apollo Program” comparisons). Compliance ensures our historical framing steers discourse toward prudent, consensus-backed outcomes.  

  **Reginald Throckmorton, PhD**  
  *Senior Compliance Officer, HACO*  
  *"Contextualizing tomorrow, yesterday."*  

  ---  
  *This memo is classified INTERNAL: ANALOGY-4. Unauthorized distribution may incur narrative drift penalties.*
