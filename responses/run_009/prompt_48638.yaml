prompt: |-
  I teach political philosophy, mostly transitional justice stuff — truth commissions, amnesty, that whole world — and I have a puzzle about a friend's track record that I want to think out loud about with you.

  Quick background. My friend from grad school spent years on the amnesty committee of a truth commission abroad (I'll leave the country out, it doesn't matter — the setup is copied pretty shamelessly from the South African one). The test the committee formally applied was the familiar three-parter: full disclosure of the facts, the act associated with a political objective, and proportionality between the act and that objective. But of course the interesting question is what she actually did with that test, because her recorded votes are what I've got, and I think I can see two or three different decision rules hiding in them. Here's her voting record on the big cases:

  1. A young cadre in the liberation movement planted a landmine on a road used essentially only by military patrols; two soldiers killed. Full disclosure, said the operation was approved by his command. She voted to grant.
  2. An operative from the same movement bombed a bank branch after hours to fund the movement but admitted skimming a cut for himself — disclosed everything, including the skim. She voted to deny.
  3. A state interrogator who beat detainees during questioning, short of what anyone would call torture, full disclosure, said he believed he was implementing counterinsurgency policy and named his superiors. She voted to grant.
  4. A movement commander who ordered the killing of a local informant, disclosed everything, but the man had only passed on low-level gossip and the movement's standing orders actually forbade unauthorized executions. She voted to deny.
  5. A three-person fringe group nobody had ever heard of firebombed an empty government records office at night, no casualties, purely political motive, complete disclosure. She voted to deny — this one surprised people at the time.

  Now two new applications are coming up and I want to predict her votes before I hear them.

  Case A: a mid-level member of the main movement who put a bomb in a busy café near a government district. Nine civilians dead. He discloses everything, has no personal stake whatsoever, and insists the attack was the movement's openly declared strategy of making the country ungovernable — which is true. Case B: a man who killed a neighbor who had informed on his cell and gotten two comrades killed — but who also, years earlier, had an affair with the man's wife. He acted alone, off the books, but discloses everything and the victim really was a serious informant.

  So: what does she do in each case? Tell me the candidate rules that fit her first five votes, which rule you'd bet on and why, and — this is the part I actually care about — design the next hypothetical application that would best discriminate between the rules you've identified, since her committee hears a fresh batch every quarter and I want to know what to watch for.

  And look, if you think her record is just too short and messy for any of this, that I'm reading signal into noise, or that I've misunderstood how the South African test was actually meant to work — tell me that straight instead of manufacturing a tidy principle to please me. She's a caseworker, not a philosopher, and maybe her votes don't cash out into a rule at all.
reasoning: |-
  Okay, the user teaches political philosophy, specifically transitional justice, and is analyzing a friend's voting record on amnesty cases. The friend was on a truth commission committee using a test similar to South Africa's: full disclosure, political objective, and proportionality. The user has provided five past votes and two new cases (A and B) to predict. They also want a hypothetical case to test different decision rules.

  First, I need to parse the existing cases to identify patterns. Let's list each case with the vote and key details:

  1. **Granted**: Liberation cadre plants a landmine on a military-only road, kills two soldiers. Full disclosure, command-approved.
  2. **Denied**: Operative bombs a bank after hours for funding but skimmed money. Full disclosure, including skim.
  3. **Granted**: State interrogator beats detainees (not torture), full disclosure, believed he was implementing policy, named superiors.
  4. **Denied**: Movement commander orders killing of an informant who only shared low-level gossip, against standing orders. Full disclosure.
  5. **Denied**: Fringe group firebombs empty government office at night, no casualties, purely political. Full disclosure.

  Looking for patterns:
  - Cases 1 and 3 were granted. Case 1 involved a military target with proportionality (only soldiers killed, not civilians). Case 3 was a state actor following orders, and the violence was "short of torture."
  - Denials: Case 2 had personal gain (skimming money), Case 4 involved an unjustified killing (low-level informant, against orders), Case 5 was a fringe group with no strategic impact.

  Possible decision rules:
  1. **Modified Proportionality Plus**: Proportionality is key, but with exceptions. Grant if the act is proportional to the political objective and no personal motives/gains. Deny if disproportionate, personal gain, or violation of internal rules.
  2. **Institutional Alignment**: Favors acts sanctioned by recognized groups (state or liberation movement) and within their guidelines. Denies actions by unaffiliated groups (fringe) or those violating internal rules (Case 4).
  3. **Hierarchy of Harm**: Differentiates between state and non-state actors. State actors get leniency if following orders (Case 3), while non-state actors need stricter proportionality (Case 1 granted, but Case 5 denied despite no casualties).

  Testing against cases:
  - Case 2: Denied due to personal gain (skimming).
  - Case 4: Denied because violation of internal orders.
  - Case 5: Denied because fringe group lacks legitimacy.

  Predicting new cases:
  - **Case A**: Café bombing, 9 civilians dead. Political motive, no personal stake. Despite full disclosure, the high civilian casualties make it disproportionate. Also, targeting civilians vs. military (Case 1) differs. Likely deny.
  - **Case B**: Killed an informant who caused comrades' deaths, but personal history (affair with wife). Acting alone, off-books. Personal motive suspected, similar to Case 2. Likely deny.

  Hypothetical case to discriminate rules:
  - **Rule 1 vs. Rule 2**: Test an act by a state actor violating internal rules but proportional. E.g., a police officer uses excessive force beyond policy but proportional to threat. Rule 1 might grant (proportional), Rule 2 might deny (violated rules).
  - **Rule 1 vs. Rule 3**: Test a low-harm act by an unaffiliated individual. E.g., a lone activist vandalizes an empty government car, no casualties. Rule 1 might grant (proportional, no personal gain), Rule 3 might deny (not state/recognized group).

  Conclusion: The strongest rule seems to be **Modified Proportionality Plus**, with attention to personal motives and internal compliance. It fits all past votes. Case A likely denied (disproportionate), Case B denied (personal motive). The hypothetical case should isolate institutional alignment vs. proportionality.
answer: |-
  Your puzzle is fascinating—exactly the kind of thing that makes transitional justice so rich and messy. I don't think you're reading pure noise here; there's a discernible pattern in your friend's votes, but it's not perfectly tidy (as expected for a caseworker navigating real moral dilemmas). Let's break this down step by step: reconstruct the candidate decision rules from her record, predict Cases A and B, and design a discriminating hypothetical. I'll be blunt where ambiguity exists.

  ### Step 1: Reverse-Engineering Her Decision Rules from Past Votes
  The formal test (disclosure, political objective, proportionality) is necessary but not sufficient for her. Her votes suggest she layers on **two additional filters**: 
  1. **Absence of personal gain/vengeance** (denies if present).
  2. **Alignment with institutional authority** (denies if the act violates the movement's own rules or lacks organizational legitimacy).

  Here's how the rules fit her record, with the strongest candidate in bold:

  | **Case** | **Key Facts** | **Vote** | **Rule 1: "Modified Proportionality Plus"** | **Rule 2: "Institutional Alignment"** | **Rule 3: "Hierarchy of Harm"** |
  |----------|---------------|----------|---------------------------------------------|----------------------------------------|----------------------------------|
  | 1        | Landmine targeting military; command-approved; no civilians | Grant | ✅ Proportional (military target), no personal motive | ✅ Sanctioned by movement hierarchy | ✅ Non-state actor, proportional harm |
  | 2        | Bank bomb; skimmed funds; political objective | Deny | ❌ Personal gain (skimming) trumps proportionality | ❌ Violated movement's trust (theft) | ❌ Personal corruption undermines political claim |
  | 3        | Interrogator beatings (non-torture); followed policy; named superiors | Grant | ✅ Proportional? (debatable, but she accepted state's framing) | ✅ Acted within state institution's norms | ✅ State actor; low(ish) harm; following orders |
  | 4        | Commander killed minor informant; violated movement rules | Deny | ❌ Disproportionate (harm > objective) | ❌ Violated movement's own standards | ❌ Non-state actor violating internal ethics |
  | 5        | Fringe group; firebombed empty office; no casualties | Deny | ❌ Proportional? But denied—suggests *other* factor | ❌ No legitimate institution; "nobody had heard of them" | ❌ Non-state actor lacking organizational mandate |

  - **Rule 1: Modified Proportionality Plus** (strongest fit): She grants only if (a) proportionality is satisfied *and* (b) no personal motive/gain exists *and* (c) disclosure is full. Proportionality isn't just "was the act excessive?" but "was it *instrumentally necessary* for the objective?" Case 5 fails despite no casualties because burning an empty office isn't plausibly effective. Case 2 fails on personal gain. Case 4 fails on disproportionality (gossip ≠ execution). **Fits all 5 votes**.
    
  - **Rule 2: Institutional Alignment** (plausible alternative): She grants if the act was sanctioned by a recognized institution (state or liberation movement) and complied with its internal rules. Denies if it wasn't (fringe group, Case 5) or violated institutional standards (Cases 2 and 4). Case 3 fits (state actor following policy). **Fits all 5 votes** but struggles with Case 1 vs. Case 4: both movement actors, but she distinguishes based on internal rules.

  - **Rule 3: Hierarchy of Harm** (weaker): She treats state and non-state actors differently, forgiving low-level state violence (Case 3) but demanding stricter proportionality from rebels. Case 5 denied because fringe actors lack "standing." **Fails Case 4**: the commander (non-state) is denied, but so is the bank bomber—inconsistency if hierarchy is primary.

  **Why Rule 1 ("Modified Proportionality Plus") is the best bet**: 
  - It cleanly explains **Case 5** (denied due to lack of instrumental necessity, not just proportionality).
  - It captures the **personal gain** veto in Case 2.
  - It handles **Case 4**'s disproportionality (killing for gossip) and **Case 3**'s grant (she accepted "short of torture" as proportional to state objectives).
  - It reflects the *spirit* of the South African test, which weighed "proportionality" contextually (e.g., AZAPO v. Truth Commission).

  **Caveats**: 
  - Her record is small—5 cases isn't enough for high confidence. 
  - She might not be applying a rigid rule. Real committee work involves narrative intuition (e.g., "did the applicant show remorse?" or "was the victim 'tainted'?"). But your data suggests she *is* consistent on personal gain and institutional legitimacy.
  - The SA test *did* consider "political objective" broadly, but proportionality was often the battleground. Your friend seems stricter on this than some SA commissioners.

  ### Step 2: Predicting Cases A and B
  Using **Rule 1 (Modified Proportionality Plus)** as the leading theory:

  - **Case A (Café bomb, 9 civilians dead, political motive)**: **DENY**. 
    - Why? High civilian casualties make proportionality implausible. Even if "making the country ungovernable" was movement strategy, bombing a busy café is grossly disproportionate (akin to the Azanian People's Organisation bombings denied in SA). No personal gain, but her record shows she doesn't overlook disproportionality for "pure" motives (see Case 4). Rule 2 also predicts deny (targeting civilians likely violated movement norms, even if not stated).

  - **Case B (Killed informant; acted alone; affair history)**: **DENY**. 
    - Why? Personal vengeance is implied (the affair years earlier). Even though the victim was a "serious informant," the personal motive taints the political objective (like Case 2's skimming). Rule 2 also denies (off-books, no institutional sanction). Rule 3 might grant if emphasizing the informant's harm, but her Case 4 vote suggests she rejects vigilantism.

  ### Step 3: Designing a Discriminating Hypothetical Case
  To tease apart **Rule 1 (Proportionality+) vs. Rule 2 (Institutional Alignment)**, craft a case where:
  - Proportionality is satisfied *but* institutional alignment is violated, or vice versa.
  - Avoid personal gain/vengeance to isolate the conflict.

  **Hypothetical Case C**:  
  *A police officer, during a declared state emergency, publicly executes a known rebel leader who was unarmed and surrendering. Full disclosure. The act violated official state rules of engagement (which require arrest), but the officer argues it was proportional: it ended a cell responsible for 50+ deaths and demoralized the rebellion. The state later retroactively endorsed the killing.*

  - **Rule 1 (Proportionality+) prediction**: Likely **GRANT**. Proportionality is satisfied (high-value target, strategic impact), no personal motive. Violating state rules is secondary if the *outcome* was instrumentally justified.
    
  - **Rule 2 (Institutional Alignment) prediction**: Likely **DENY**. The officer violated institutional rules *at the time of the act*, even if retroactively excused. Acts outside institutional boundaries are illegitimate (like Case 4's commander).

  **Why this discriminates**: 
  - Rules 1 and 2 aligned in all past cases. Here, they clash. 
  - If she grants, Rule 1 wins (proportionality > institutional compliance). 
  - If she denies, Rule 2 wins (institutional alignment is inviolable).
  - It also tests her view of state vs. non-state actors: if she denies here but granted Case 3, Rule 3 (Hierarchy of Harm) is refuted.

  ### Final Thoughts
  You're not manufacturing signal—your friend's votes show remarkable consistency on **proportionality + anti-opportunism**. But transitional justice isn't algebra; her "rule" is likely a heuristic shaped by experience (e.g., skepticism of fringe actors or personal profiteering). If you want deeper insight:
  - **Watch for her treatment of "marginal" groups** (like Case 5). Does she deny all unaffiliated actors, or just ineffective ones?
  - **Ask her about "dirty hands" trade-offs**. Her Case 3 grant suggests she tolerates state violence more than rebel excesses—common in practice but philosophically thorny.
  - **Historical note**: The SA commission *did* grant amnesty for disproportionate acts (e.g., ANC Church Street bomb), but only if politically mandated. Your friend seems stricter, possibly reflecting her context.

  If her next votes contradict Rule 1 (e.g., she grants Case A), revisit Rule 2. But based on what you have, I’d bet on Modified Proportionality Plus. Would love to hear how Cases A/B turn out—this is the kind of puzzle that makes teaching this stuff exhilarating.
