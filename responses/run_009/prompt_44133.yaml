prompt: |-
  I'm a PhD student in HPS writing on Lakatos, and I've got a pile of verdicts about particular episodes that I can't seem to make consistent. Here they are; I'd like to know whether any single principle captures them, and if not, which of them has to go.

  - Ptolemaic astronomy bolting on a new epicycle each time observation drifts from prediction: degenerating, obviously.
  - Le Verrier inferring an unseen planet from Uranus's misbehaving orbit: progressive, because Neptune turned up where he said. But when the same man made the same kind of move for Mercury's perihelion and postulated Vulcan, which never turned up, I want to condemn that move as degenerating — even though the Newtonian programme as a whole was at its zenith. So I appear to appraise individual theoretical moves by their outcomes, while I appraise whole programmes by their trajectories, and I can't say which the criterion is really about.
  - Bohr's 1913 atom was in important ways ad hoc, and within a decade the old quantum theory was failing on the anomalous Zeeman effect and on any atom beyond hydrogen; yet I would never call that programme degenerating. Its worst decade still feels progressive to me.
  - Marxism after Marx, with its endless post hoc reinterpretations of every failed prediction: degenerating, and I want to say it was already degenerating in the 1890s, well before anyone could have known.
  - Darwinism in 1859, which mostly accommodated already-known facts — the fossil record, geographical distribution — rather than predicting new ones: progressive from the start. This sits very badly with my verdict on Marxism, which likewise reorganized known material to fit a theory.

  Presumably the underlying criterion is something about successful novel predictions, but I can't get it to deliver all five verdicts at once, and I also can't see what it permits us to say about a programme with no track record at all — is string theory, right now, beyond appraisal, or appraisable on some other basis? Please state the principle (or the small set of candidates) precisely, say which clause exists to capture which of my verdicts, tell me honestly which verdict your best principle has to overturn, and keep the whole answer under 800 words.
reasoning: |-
  Hmm, the user is a PhD student in HPS working on Lakatos and facing a challenge with reconciling different historical episodes using Lakatos's methodology of scientific research programmes (MSRP). They've provided five verdicts on specific scientific cases and are struggling to find a consistent principle that captures all of them. They're particularly concerned about how to appraise individual theoretical moves versus whole programmes, and how to handle cases with no track record like string theory.

  Let me analyze each case they've presented:

  First, Ptolemaic astronomy adding epicycles is clearly degenerating - that's straightforward in Lakatosian terms as it involves ad hoc modifications without novel predictions.

  The Le Verrier cases are tricky. Neptune discovery was progressive (novel prediction confirmed), but Vulcan was degenerating (failed prediction). Yet both occurred within the successful Newtonian programme at its peak. This highlights the tension between appraising individual moves versus whole programmes.

  Bohr's 1913 model seems ad hoc yet the quantum programme feels progressive. This suggests that early-stage programmes might get more leeway - what Lakatos called a "protective belt" of temporary ad hocness.

  Marxism's endless reinterpretations look degenerating even early on, while Darwin's accommodation of known facts is seen as progressive despite similar surface features. The key difference appears to be whether the accommodation enables novel predictions later.

  The core problem is that Lakatos emphasizes novel predictions as the hallmark of progress, but:
  - Some progressive programmes start with accommodation (Darwin)
  - Some degenerating programmes make failed predictions (Vulcan)
  - Some programmes tolerate temporary ad hocness (early quantum theory)
  - Some programmes are condemned for accommodation even without failed predictions (Marxism)

  I recall Lakatos does distinguish between "progressive" and "degenerating" problem shifts, but he's somewhat fuzzy on new programmes. He allows that nascent programmes can be "progressive" even without immediate novel predictions if they show promise of future fertility.

  For a unifying principle, I need to emphasize both the track record of novel predictions and the heuristic promise. The principle should have three parts: 
  1) Theoretical progress (explanatory coherence, non-ad-hocness) 
  2) Empirical progress (novel predictions) 
  3) Time factor (nascent programmes get heuristic leeway)

  Applying this:
  - Ptolemy: Fails 1 & 2
  - Le Verrier/Vulcan: Fails 2 (no prediction) despite being in successful programme
  - Bohr: Passes 1 & shows promise for 2 → progressive despite temporary ad hocness
  - Marxism: Fails 1 (endless ad hoc patches) and shows no 2 → degenerating
  - Darwin: Strong 1 (explanatory power) and clear heuristic for future 2 → progressive

  The Vulcan case is the hardest - I have to say that individual moves can be degenerating even within progressive programmes. This means overturning the user's hesitation to condemn Vulcan just because Newtonianism was strong.

  For string theory, under this principle it would be appraisable based on its theoretical progress and heuristic promise, despite no empirical predictions yet. We'd judge whether it's developing coherently or just patching problems ad hoc.

  This approach preserves most of the user's intuitions while clarifying that heuristic potential matters especially for new programmes, and that individual moves can be locally degenerating even in globally progressive programmes.
answer: |-
  Here's a concise Lakatosian principle resolving your cases, followed by analysis:

  **The Core Principle:**  
  *A research programme is progressive if it consistently generates *theoretically fertile, non-ad-hoc adjustments* that lead to *verified novel predictions*. It is degenerating if its adjustments are *primarily ad-hoc*, protecting the hard core without increasing empirical content or yielding new predictions, regardless of accommodating existing data.*

  **Clause Breakdown:**
  1.  **"Theoretically fertile, non-ad-hoc adjustments"**: Captures why **Bohr's programme (despite early ad hoc elements)** is progressive. Adjustments (like Sommerfeld's) were theoretically motivated (quantization rules extended) and opened new domains, *aiming* at novel predictions (even if initially failing, e.g., complex atoms). Fertility matters more than immediate success early on. Contrasts with **Ptolemy** (epicycles bolted on purely to save phenomena, no deeper unification/fertility) and **Marxism** (endless *post hoc* reinterpretations changing auxiliary belts without increasing testable content or unifying new fields).
  2.  **"Lead to verified novel predictions"**: Captures the **Le Verrier cases**. Neptune's discovery (*verified* novel prediction) was progressive. Vulcan (*failed* novel prediction) was a degenerating move within Newton's programme – it was an *ad-hoc* auxiliary hypothesis *motivated solely* by the anomaly, lacking independent theoretical fertility. The *programme's overall trajectory* (many past successes, other progressive strands) remained progressive *despite* this local degenerating move. This clause also captures **Darwinism**. While initially accommodating known facts (fossils, biogeography), its core (NS, common descent) *immediately* generated fertile research programmes *predicting* novel facts (e.g., specific transitional fossils, patterns of homology, later genetic mechanisms), distinguishing it from mere accommodation like Marxism.
  3.  **"Regardless of accommodating existing data"**: Captures why **Darwinism (progressive)** and **Marxism (degenerating)** differ despite both reorganizing known material. Darwinism's accommodation sprang from a core with immense *future* predictive/heuristic power. Marxism's accommodation involved constantly changing auxiliary belts *defensively* to protect the core from falsification, without generating new testable research avenues.

  **Which Verdict Must Be Overturned?**  
  Your hesitation to condemn **Le Verrier's Vulcan move** as degenerating *because Newtonianism was strong*. The principle forces us to call this specific move degenerating. Programmes can have *locally degenerating moves* (like Vulcan, or adding an epicycle) while the *overall programme trajectory* remains progressive due to other strands generating novelty (e.g., Newtonian celestial mechanics beyond Vulcan, fluid dynamics, etc.). Appraisal *is* primarily about the programme's trajectory (novel predictions over time), but individual moves are judged by whether they *contribute* to that progress or represent degenerating patches. Vulcan was a degenerating patch.

  **String Theory & Nascent Programmes:**  
  Lakatos appraises programmes primarily by their *track record* of problem shifts. A nascent programme like string theory *is* appraisable *prospectively* based on its **heuristic power** and **theoretical progress** (coherence, non-ad-hocness, unifying power) *before* empirical predictions are testable. If it develops fertile theoretical adjustments solving internal problems and promising future testability, it's provisionally progressive. If its adjustments become increasingly baroque and ad-hoc solely to maintain mathematical consistency without empirical pathways, it risks degenerating. Its *current* appraisal is based on its theoretical trajectory, awaiting empirical assessment.

  **Summary:** Your verdicts are consistent under Lakatos if you:
  1.  Distinguish programme trajectory from individual moves.
  2.  Emphasize *theoretical fertility* alongside prediction (saving Bohr/Darwin).
  3.  Accept that *accommodation* is neutral; what matters is whether it stems from a fertile core enabling future prediction (Darwin) or is defensive patchwork (Marxism/Ptolemy).
  4.  Accept that successful programmes *can* have degenerating moves (Vulcan).
