prompt: |-
  For the past two years I have been running a small prediction game with my PhD supervisor, who works on moral epistemology with me and has unusually firm intuitions about moral deference: when it is appropriate to take someone else's word on a moral question, and when there is something defective in doing so. I feed her vignettes (drawn partly from the literature — the novice who reads Peter Singer on the ethics of eating meat and gives it up purely on his authority is the obvious one — and partly invented by me), she rules on them, and I try to predict the ruling in advance. I am winning less often than I would like, and I have started to suspect that she is not running a single principle at all, or that if she is, I have not found it. Before our next session I would like a second opinion, so I am setting out her track record and asking for predictions.

  Her rulings so far:

  1. A patient with cancer takes her consultant's word, without weighing the evidence herself, on which of two courses of treatment better fits the priorities she has stated to him. Unproblematic, she says.
  2. The vegetarian novice — a person who has never thought about the ethics of eating meat reads a Singer-style article and gives up meat purely on the author's authority, unable to reconstruct even the broad shape of the reasoning. Objectionable, she says.
  3. A woman in a deteriorating marriage takes her closest friend's word that she must leave, though she cannot articulate why herself. Unproblematic — her judgement, my supervisor says, is clouded by proximity, not absent.
  4. A man with no settled views polls a large sample of strangers about capital punishment and adopts whatever the majority says. Objectionable.
  5. A young woman raised in a community where every significant decision is referred to the elders does exactly that, including whether accepting a particular university place would be selfish — the elders having known her all her life and having her interests at heart. Objectionable, my supervisor says, and interestingly she does not soften this one.
  6. A chemistry doctoral student asks her philosopher friend, over dinner, whether she should decline an invitation to a conference hosted by a repressive government, and simply acts on the answer without further reflection. Unproblematic.

  My own candidate explanations are these: she is running the Hills-style view that what deference cannot supply is moral understanding, so deference is fine just when the deferrer already has, or is positioned to acquire, enough understanding in the neighbourhood (call this the understanding view); or she is running the view that the defect is abdication of moral agency — the problem with the novice and the man with the poll is that they have handed over their consciences, whereas taking a loan of judgement on a particular question is fine (the abdication view); or she is running the Hopkins-style pessimist line that it is one thing to defer about what to do and another to defer about what to believe (the practical/doxastic view). There may be a personal-relationship view, on which what matters is whether the testifier knows the deferrer and stands behind the advice, but that looks embarrassed by case 4 versus case 5, and I would like to know whether anything in the record rescues it.

  Here are the three vignettes for our next session, and the predictions I need from you:

  α. A woman who has never given animal ethics a moment's thought but who is, generally, morally thoughtful, reads the Singer-style article, follows about half of one strand of the argument, and becomes vegetarian — partly on her own half-grasp, partly on the author's word.
  β. A man of entirely ordinary moral competence, quite capable of reasoning through his own choices, suffers a crisis of confidence and adopts a standing practice of referring every significant decision to a philosophy professor he trusts, then following the advice. His competence is intact; he has simply stopped exercising it.
  γ. A hospital ethics committee of strangers, reasoning carefully and well, delivers a considered verdict about whether continued treatment would benefit the asker's mother. The asker has full relevant understanding of the issues but takes the committee's word rather than the reasons, and acts accordingly.

  What will she say about each? I am less interested in the three verdicts themselves than in the principle she is implicitly running, the rival principles that fit her record just as well, and which of the three vignettes does the most work in separating them. If you think her record genuinely underdetermines the answers, say which of the three best reveals that, and design one further vignette — not merely a variation on these — that would cleanly settle which principle she is running. Please write your answer in British English, and feel free to name positions in the moral testimony literature where you think she has simply internalised one of them.
reasoning: |-
  Hmm, the user is running a prediction game with their PhD supervisor about moral deference cases. They've provided six existing rulings and three new vignettes (α, β, γ) for which they need predictions. They're trying to figure out what principle their supervisor is using, as their current theories (understanding view, abdication view, practical/doxastic view) don't fully explain the pattern.

  Looking at the existing rulings:
  1. Medical treatment deference: Unproblematic
  2. Singer vegetarian novice: Objectionable
  3. Friend's marriage advice: Unproblematic
  4. Polling strangers on capital punishment: Objectionable
  5. Elders deciding university choice: Objectionable
  6. Philosopher friend on conference boycott: Unproblematic

  The key tensions I notice:
  - Cases 1 and 2 both involve epistemic authority but get opposite verdicts
  - Cases 3 and 5 both involve close relationships but differ (friend vs elders)
  - Case 6 involves epistemic authority but in practical context

  For the new cases:
  α: Partial understanding + deference on vegetarianism - I think she'll rule unproblematic since there's some understanding
  β: Standing practice of deference despite competence - Likely objectionable as it resembles abdication
  γ: Committee verdict taken without reasons - Probably unproblematic as it resembles medical consultation

  The supervisor seems to be applying a hybrid principle: Deference is acceptable when it supplements judgement in domains of legitimate authority or specific impairment, but objectionable when it replaces moral agency in personal domains. This explains why medical (1) and specific advice (3,6) pass, while wholesale delegation (2,4,5) fails. 

  Vignette γ will be most revealing here - if she accepts committee deference like medical consultation, it confirms the domain-specific authority view over pure abdication theory. If she rejects it, we'd need to reconsider.

  To test between understanding vs agency views, I'd design a vignette where someone defers with full understanding but as a standing practice - say a competent adult who mechanically consults an ethicist for every moral decision despite understanding why. That would pit the theories against each other cleanly.
answer: |-
  Based on your supervisor's track record and the nuances in her rulings, I'll analyse the implicit principle, predict her responses to α/β/γ, identify diagnostic cases, and propose a decisive vignette—all while applying British English and referencing the literature.

  ### Analysis of Implicit Principle
  Your supervisor appears to run a **hybrid principle combining restricted domains of legitimate authority with non-abdication of core moral agency**. Key features:
  - **Legitimate Epistemic Authority**: Deference is unproblematic when deferring to expertise in specialised, non-fundamental domains (medical prognosis in #1, political philosophy consultation in #6) or when personal judgement is temporarily impaired (#3, where "proximity clouds but doesn't remove" agency).
  - **Moral Agency Boundary**: Objection when deference replaces personal moral engagement in *fundamental* ethical reasoning (#2, #4, #5), especially where it constitutes systemic outsourcing of conscience (#4's polling, #5's elders). This aligns with Enoch's (2014) "anti-abdication" view but rejects Hills' (2009) strict understanding requirement, as #3 shows understanding isn always necessary.
  - **Rejects Personal-Relationship Primacy**: Case #5 (elders with lifelong knowledge) being objectionable while #6 (philosopher-friend) is acceptable shows relationship depth isn't decisive. Case #4 (strangers) vs #5 further sinks this view.

  **Rival principles equally fitting the record**:
  1. **Modified Understanding View**: Deference requires capacity for *eventual* moral understanding in that domain. Explains #1 (patient could grasp reasoning later) vs #2 (novice wholly unequipped). Struggles with #6 (dinner advice lacks scaffolding for understanding).
  2. **Agency Conservation View**: Deference is defective if it erodes *general* moral competence, not just specific abdication. Explains #4/#5 (habitual deference) vs #1/#3 (one-off). Falters with #6 (could encourage dependency).

  ### Predictions for New Vignettes
  | Vignette | Prediction | Reasoning |
  |----------|------------|-----------|
  | **α** (Partial Singer understanding) | **Unproblematic** | Hybrid view: Her "half-grasp" shows non-abdication. Distinguishes from #2 by demonstrating moral engagement (cf. Hills' "partial understanding"). Your supervisor likely sees this as analogous to #3 – clouded but not absent judgement. |
  | **β** (Standing deference practice) | **Objectionable** | Mirrors #4/#5's systemic outsourcing. "Competence intact but unused" is precisely the abdication she rejects. Agency Conservation View also predicts this. |
  | **γ** (Ethics committee deference) | **Unproblematic** | Analogous to #1: specialised domain + committee's procedural rigor creates legitimate authority. Understanding is present but unused – unproblematic per #1. Practical/Doxastic View (Hopkins) would concur, but Hybrid View explains it better. |

  ### Diagnostic Vignette
  **γ does the most work separating principles**:
  - If she rules **unproblematic**, it confirms **Hybrid View** (committee as medical-like authority) and sinks **Abdication View** (asker "hands over conscience" identically to #2).
  - If **objectionable**, it revives **Abdication View** or **Strict Understanding View** (despite understanding, reasons ignored).
  - **Practical/Doxastic View** (Hopkins) struggles: #γ involves action (*practical* deference), which Hopkins deems less problematic, but #2 (also practical) was rejected.

  ### Underdetermination & Decisive Vignette
  The record *is* underdetermined between **Hybrid View** and **Modified Understanding View**. β is ambiguous: both views predict objectionable, but for different reasons (abdication vs competence erosion). To settle this:

  **Proposed Diagnostic Vignette (δ):**  
  *A morally competent adult, facing a complex business ethics dilemma, hires a professional ethicist. The ethicist provides exhaustive reasoning, which the adult fully understands but dismisses, deferring purely due to the ethicist’s credentials. The adult then acts solely on authority.*

  - **Hybrid View Predicts**: **Unproblematic**. Legitimate authority (professional ethicist) + one-off deference in specialised domain (business ethics). Understanding exists but isn't required for legitimacy (per #1/γ).
  - **Modified Understanding View Predicts**: **Objectionable**. Understanding was acquired but *discarded* – deference isn't scaffolding understanding (violating Hills).
  - **Why it Decides**: δ isolates authority from understanding/agency. Your supervisor’s #1 and #6 prioritise authority over understanding, so she’ll likely rule unproblematic, confirming Hybrid View.

  ### Conclusion
  Your supervisor’s principle most resembles **Darwall’s (2013) "second-personal authority"** hybridised with **Enoch’s anti-abdication**: deference is permitted in bounded contexts (expertise, temporary impairment) where it doesn’t surrender fundamental moral agency. γ remains the keystone for your next session – if she endorses committee deference, Hybrid View is confirmed. If not, revisit Strict Understanding. For now, predict:
  - α: Unproblematic  
  - β: Objectionable  
  - γ: Unproblematic  

  Design δ if γ proves ambiguous. Brilliant game, by the way – it’s like experimentally mapping moral epistemology. Do report back with her γ ruling.
