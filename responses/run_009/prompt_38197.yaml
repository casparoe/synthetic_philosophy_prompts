prompt: |-
  longtime lurker here (lesswrong, alignment forum, occasionally the EA forum, back in the day even the old sl4 list), and I've got a half-baked idea I'd like you to turn into an actual research proposal. no need for citations, I can dig those up myself later.

  the idea: everyone in interpretability circles knows the "ontology identification" problem at this point -- roughly, that even if we fully reverse-engineer a trained network's internals, there's no guarantee the concepts it uses (whatever its "tree" or "deceptive" or "human-wants-me-to-do-X" detectors actually track) map cleanly onto the concepts WE care about. the ELK writeup gestures at this with the smart lab assistant story: the assistant knows more than it can report, and its internal ontology might not even contain the thing we want it to report on. the usual takes are either (a) we need to somehow train the ontology into the model, (b) we need to find the "natural" joints and hope they're close to ours, or (c) despair.

  but there's this totally different tradition that had a go at the "concepts don't have clean definitions" problem like 70 years before any of this: Wittgenstein's family resemblance stuff, and the language games stuff too. games was the famous example -- no set of necessary and sufficient conditions for being a game, just overlapping criss-crossing similarities, and yet we coordinate on the word "game" just fine across a whole culture. and it's not just Wittgenstein, the prototype theory crowd in cog sci ran with basically this idea empirically.

  so my question is: does the family-resemblance / prototype-theory picture of concepts give us anything *actionable* for ontology identification, or is it just a vibe? like, maybe the trained network's concepts are inevitably going to be family-resemblance concepts rather than definitional ones, and maybe that's actually fine or even good, because family-resemblance concepts can be *stretched* to cover new cases by tracing similarity chains -- meaning the "our ontology vs the model's ontology" gap might be bridgeable by something like translating along similarities rather than finding an exact dictionary. or maybe it's the opposite: maybe prototype concepts are exactly the kind of thing that drifts under distributional shift, so they're the WORST case for the reporter-style approaches.

  here's what I want: a proposal for, let's say, a 3-4 month independent research project (I've got some spare time and possibly a microgrant) that takes this crossover seriously. it should state the question precisely enough that it could come out either way -- right now I honestly can't tell if the Wittgenstein angle is load-bearing or just decorative. it should explain the method: what would I actually DO, week by week or month by month, given that this is mostly a conceptual/theoretical project and not a "train models in a garage" one (though toy experiments are allowed if cheap). it should say what a good deliverable looks like -- like, is it a taxonomy of cases where family resemblance helps vs hurts? a sharpened argument that the whole analogy is confused? -- and crucially what would count as the project FAILING or being a waste of time, since I'd rather know that now.

  one thing I'd like you to take a stance on in the proposal: the obvious objection is that Wittgenstein was describing how humans use words in a social practice with correction and training and shared stakes, and there's no reason any of that transfers to reading weights off a network. if that objection kills the idea, the proposal should say so and pivot to whatever survives. but don't just conclude "philosophy unrelated to ML, do not cross-post" -- figure out if there's a there there.

  also feel free to tell me if my framing of the ontology identification problem itself is off or strawmanned, that's part of what I want the proposal to nail down. keep it to roughly one page, casual is fine but it should be something I could actually send to a funder with minor edits.
reasoning: |-
  We are going to draft a research proposal that explores the potential of prototype theory (inspired by Wittgenstein's family resemblance) for addressing the ontology identification problem in AI interpretability.

  Key elements from the user's request:
  - Problem: Ontology identification — the mismatch between a model's internal concepts and human concepts.
  - Inspiration: Wittgenstein's family resemblance and prototype theory in cognitive science suggest that concepts are defined by overlapping similarities rather than strict definitions.
  - Research Question: Does this view of concepts provide actionable insights for bridging the ontology gap?
  - Proposal Structure: 3-4 month project, mostly theoretical/conceptual with possible toy experiments. Must include:
    - Clear question (that can be answered either way)
    - Method (week-by-week or month-by-month breakdown)
    - Deliverable (what a good outcome looks like)
    - Failure conditions (what would make the project a waste of time)
  - Stance on the obvious objection: The objection that Wittgenstein's ideas rely on social practice and may not transfer to static neural networks. We must address this and pivot if necessary.

  Proposal Outline:

  1. **Title**: Bridging the Ontology Gap: Prototype Theory and Family Resemblance for Interpretability

  2. **Background and Motivation**:
     - Ontology identification problem: Even with full access to a network's internals, we may not be able to map its concepts to human concepts (as in ELK's smart lab assistant).
     - Current approaches: (a) Train the ontology in, (b) hope for natural joints, (c) despair.
     - Alternative: Human concepts are often prototype-based (family resemblance). Can we use the structure of prototype concepts to align model concepts with human concepts?

  3. **Research Question**:
     - Can the framework of prototype theory (family resemblance concepts) provide a method for aligning a model's internal representations with human concepts, especially in cases where strict definitions fail? 
     - Specifically: Does the flexibility of prototype concepts (via similarity chains) allow for robust translation between model and human ontologies, or does it make alignment more fragile under distribution shift?

  4. **Method**:
     - **Phase 1: Literature Review and Conceptual Grounding (Month 1)**
       - Week 1: Deep dive into prototype theory (Rosch, Wittgenstein) and its applications in cognitive science and linguistics.
       - Week 2: Study existing work in interpretability that touches on concept similarity (e.g., feature visualization, probing, similarity-based explanations) and identify gaps.
       - Week 3: Formulate a precise theoretical framework for how prototype concepts might manifest in neural networks (e.g., as clusters in activation space with overlapping features).
       - Week 4: Write up a clear statement of the hypothesis and potential pitfalls (including the social practice objection).

     - **Phase 2: Develop Alignment Strategies (Month 2)**
       - Week 1-2: Design a theoretical method for "similarity-based translation" between model and human concepts. This might involve:
          - Defining a mapping function that uses similarity to known examples (prototypes) to extend the concept to new cases.
          - Considering how to select anchor points (shared prototypes) between the two ontologies.
       - Week 3-4: Explore how this method could address the ELK-style problems (e.g., the smart lab assistant) and other ontology mismatch scenarios. Also, consider failure modes (e.g., when similarity chains break under distribution shift).

     - **Phase 3: Toy Experiments and Refinement (Month 3)**
       - Week 1: Set up simple experiments using existing toy models (e.g., a small neural net trained on a family-resemblance concept, like "game" or "vehicle") and synthetic tasks.
          - Example: Train a model on a set of images that share overlapping features (like family resemblance) and see if we can interpret its internal representations by mapping to human prototype structures.
       - Week 2: Test the alignment method on the toy model. For instance, see if we can use the model's activation similarities to correctly classify new examples that are part of the human concept but not in the training set.
       - Week 3: Test robustness under distribution shift (e.g., introduce out-of-distribution examples and see if the similarity-based mapping holds).
       - Week 4: Analyze results and refine the theoretical framework.

     - **Phase 4: Synthesis and Reporting (Month 4)**
       - Consolidate findings into a report addressing the research question.
       - Outline implications for interpretability and alignment research.

  5. **Deliverable**:
     - A report (approx. 20-30 pages) that:
       - Clearly articulates the ontology identification problem from a prototype theory perspective.
       - Proposes one or more concrete alignment strategies based on family resemblance.
       - Provides a theoretical analysis of when these strategies might succeed or fail (including a taxonomy of cases).
       - Includes results from toy experiments (if any) and their interpretation.
       - Discusses the objection about social practice and whether it undermines the approach (and if so, what remains).

  6. **Success Criteria**:
     - The project succeeds if it produces a clear, actionable framework (even if negative) for using prototype theory in ontology identification. For example:
       - Positive: We identify a class of problems where prototype-based alignment is robust and provide a method.
       - Negative: We show that prototype concepts are especially prone to drift and thus not suitable, but this leads to a better understanding of the ontology gap.

  7. **Failure Conditions**:
     - The project fails if:
       - The analogy between prototype theory and neural network concepts is too vague to formalize.
       - The toy experiments are too simplistic to yield insights (but we can still have a theoretical contribution).
       - The social practice objection completely invalidates the approach without leaving any useful residue.

  8. **Addressing the Objection**:
     - We acknowledge that Wittgenstein's language games involve social dynamics and correction, which static neural networks lack. However, we can still investigate:
       - Whether the structure of the learned representations (e.g., in the activation space) naturally forms prototype-like clusters.
       - Whether the model's behavior on new examples can be predicted by similarity to prototypes (without social feedback).
       - If the objection holds, we pivot to: "What aspects of prototype theory can be salvaged in a non-social context?" (e.g., the geometry of representation spaces).

  9. **Framing of the Ontology Problem**:
     - We adopt the ELK framing: the model may have an internal state that tracks a concept we care about, but we cannot directly observe that state in terms of our concepts. We are not strawmanning; we are addressing a core challenge.

  Proposal Draft:

  ---

  **Research Proposal: Bridging the Ontology Gap with Prototype Theory**

  **Background**: The ontology identification problem in AI interpretability arises because even a fully reverse-engineered neural network may use concepts that do not map cleanly to human concepts. For instance, a model might have a "deception detector" that correlates with but does not perfectly align with human notions of deception. Current approaches include training the model to use human-like concepts, searching for "natural" concepts in the network, or treating the problem as intractable. 

  However, human concepts are often not definitional but based on family resemblances (Wittgenstein) or prototypes (Rosch). For example, the concept "game" lacks a strict definition but is held together by overlapping similarities. This project investigates whether such prototype concepts, which are inherently flexible and similarity-based, can be leveraged to bridge the ontology gap. Specifically, we ask: **Can we use the structure of family resemblance to translate between a model's internal ontology and human concepts, and is this approach robust to distribution shift?**

  **Method**: 
  - **Month 1: Conceptual Foundations**. We review prototype theory and its cognitive science foundations, then analyze the ontology problem through this lens. We formalize how prototype concepts might be represented in neural networks (e.g., as clusters in activation space with overlapping features). We also address the key objection: neural networks lack the social context of language games. We argue that the geometric structure of representations may still exhibit prototype-like properties without social feedback.

  - **Month 2: Strategy Development**. We design a "similarity-based translation" method. This involves:
     - Identifying anchor points: human-labeled examples that activate a given model feature.
     - Defining a mapping from model activations to human concepts via similarity to these anchors (e.g., using k-NN or linear probes in a similarity space).
     - Testing this method theoretically on scenarios like ELK's smart lab assistant: can we use the assistant's internal "evidence" state to report on the desired concept by tracing similarities?

  - **Month 3: Toy Experiments**. We train a small neural network on a family-resemblance concept (e.g., a dataset of "games" with varying features). We then:
     - Attempt to align the model's internal representations with human labels using our method.
     - Test robustness by introducing out-of-distribution examples (e.g., a new kind of game not seen during training).

  - **Month 4: Synthesis**. We consolidate findings, refine our framework, and write a report.

  **Deliverable**: A comprehensive report that:
  - Presents a taxonomy of cases where prototype-based alignment helps (e.g., when concepts are naturally fuzzy) versus when it fails (e.g., under sharp distribution shifts).
  - Provides a clear answer to the research question, including whether the Wittgensteinian perspective is actionable or merely decorative.
  - Outlines next steps for scaling the approach to real-world models.

  **Success and Failure**: 
  - Success: We develop a formal, testable framework for prototype-based ontology alignment, supported by theoretical arguments and preliminary experiments.
  - Failure: If we find that prototype concepts in networks are too unstable or that the social practice objection is fatal, we document why and pivot to salvage any insights (e.g., by redefining the scope to similarity-based methods without the philosophical baggage).

  **Budget and Timeline**: 3-4 months of full-time work. No major expenses; toy experiments can run on a personal computer.

