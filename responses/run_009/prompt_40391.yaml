  Next, the tension with liberal individualism. The system treats religious affiliation as inherited, which conflicts with the idea of religion as a voluntary choice. But in Germany, this is balanced by the option to exit, even if it's bureaucratic. The user wonders if this is a relic or a coherent theory. I should explain how it's a hybrid: ascriptive entry but permissible exit, aligning with a communitarian view where community bonds matter.

