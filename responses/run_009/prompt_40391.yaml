  First, I need to unpack the Kirchensteuer system's key features: state-collected tax based on membership, infant baptism as enrollment, state-managed exit via Amt procedures, and the recent extension to capital gains. The user is stuck on what conception of religious membership this presupposes—it's not like a gym membership nor citizenship, but something in between. 

