  Okay, the user teaches a unit on promising in an ethics course and faces a recurring problem: students can name theories like social practice view, expectation view, etc., but their intuitive judgments on cases don't match these labels. The user wants a case-based quiz to diagnose which theory students actually hold, without theory names. 

  First, I need to unpack the core issue: students' theoretical self-identification clashes with their case intuitions. The user mentions four key cases that caused rich debate: promise to a dying recluse (tests if effect on promisee is necessary), coerced promise (intuition vs. practice/will), promise in unjust institution (validity of corrupt practices), and waived promise (duty waivability). These should be central to the quiz.

  The user's explicit request is for 8-10 diagnostic questions using concrete scenarios with answer options that don't reveal theories. But deeper needs emerge: they want to expose mismatches between textbook taxonomy and moral psychology, test their hypothesis about the recluse case revealing gaps, and provide a teaching tool that bypasses rote memorization. The TA thinks labels are useless; the user believes better sorting is possible—this quiz is their rebuttal.

  For quiz design, I'll prioritize cases where theories meaningfully diverge. Beyond the four specified, I'll add scenarios that tease apart: whether the promisor's intent matters absent communication (vs. reliance views), whether conventions can be opt-out (practice vs. power views), and whether duties dissolve if reliance harms others (testing limits of expectation views). Each scenario needs clean answer options that force tradeoffs without theory cues.

  Scoring must map answer patterns to five theories: practice view, reliance view (thin/assurance), normative-powers view, rights-based view, and skeptical view. Crucially, I must flag where theories converge (e.g., practice and reliance often agree on waived promises) and identify "vacant" answer patterns—especially for the recluse case the user suspects is anomalous. If a pattern like "binding without practice, effect, or will" emerges, that might confirm their bet about taxonomy gaps.

  For the recluse case, theories split sharply: practice views demand audience understanding, reliance views require effect, powers views care about will. A "still binding" answer here could only fit powers or rights views—but if paired with "non-waivable" in other cases, it might reveal a hybrid position. I'll track this in scoring notes.

  Finally, I'll analyze coherence of vacant patterns. For example, "binding promises without any promisor intent, practice, or reliance" seems incoherent—no theory holds this because it lacks moral anchors. Meanwhile, "non-binding even with all elements present" is skepticism. The user will want this analysis to settle their bet with the TA.
answer: |-
  Here's a diagnostic quiz designed to reveal implicit commitments about promising through concrete cases, with a scoring key highlighting convergences, gaps, and the "recluse test."

  **"Which Theory of Promising Do You Actually Hold?" Quiz**

  *Instructions:* Read each scenario carefully. Choose the answer that best reflects your intuitive judgment about whether the promise *binds* (creates a genuine moral obligation) and why. Don't overthink – go with your gut feeling about the core moral issue.

  1.  **The Dying Recluse:** A person, living completely alone in the wilderness with no contact or knowledge of society, finds a critically injured hermit who is also a complete recluse unfamiliar with the concept of promise. The hermit is dying. The person says, "I promise I will bury you respectfully after you die." The hermit dies moments later without reacting or seeming to understand. The person now wonders if they are bound by this promise.
      *   **(A) Yes, the promise binds.** The person made a serious commitment to another individual.
      *   **(B) No, the promise does not bind.** The hermit couldn't understand it, didn't rely on it, and will never know if it's kept or broken.

  2.  **The Coerced Promise:** Alex is captured by Bandit Boss. Boss says, "Promise you'll deliver this ransom note to the Mayor tomorrow, or I shoot your friend now." Alex, terrified for their friend, sincerely says, "I promise to deliver the note." Alex escapes later that night. The friend is safe. Boss has no way to enforce the promise. Does Alex's promise bind?
      *   **(A) Yes, the promise binds.** Alex deliberately made the promise.
      *   **(B) No, the promise does not bind.** It was made under extreme duress and threat.

  3.  **"Never Mind!":** Taylor promises Morgan to help them move apartments on Saturday. On Friday, Morgan texts Taylor: "Great news, my cousin showed up with a truck! Please don't worry about helping tomorrow, we have it covered. Enjoy your day off!" Taylor, feeling guilty because they had previously canceled on Morgan, shows up anyway to help, even though Morgan clearly said not to. Did Taylor *wrong* Morgan by insisting on helping?
      *   **(A) Yes, Taylor wronged Morgan.** Morgan released Taylor from the promise; insisting ignores Morgan's wishes.
      *   **(B) No, Taylor did not wrong Morgan.** Taylor was just trying to be extra helpful/keep their original word; the intention was good.

  4.  **Unjust Apprenticeship:** In a society with a rigid, exploitative caste system, a young person from a low caste ("Lia") is forced by custom and economic necessity into an apprenticeship with a harsh master ("Master Rork"). As part of the oppressive initiation ritual, Lia must formally promise absolute obedience and loyalty to Master Rork for the 10-year term. Does Lia's promise bind?
      *   **(A) Yes, the promise binds.** It was made within the recognized practice (apprenticeship promises).
      *   **(B) No, the promise does not bind.** The institution itself is deeply unjust, invalidating promises made under its coercive structure.

  5.  **The Secret Resolution:** Casey privately resolves, "I promise myself I will quit smoking starting tomorrow." They tell no one. Does this self-promise bind Casey?
      *   **(A) Yes, the self-promise binds.** A promise is a commitment, regardless of audience.
      *   **(B) No, the self-promise does not bind.** Promises require a second party to whom the commitment is made.

  6.  **Accidental Reliance:** Jamie casually tells Pat, "Yeah, I'll probably swing by your party Friday." Pat, mishearing "probably" as "promise," rearranges their schedule and buys expensive food expecting Jamie. Jamie had no intention to promise and is unaware Pat relied. Jamie forgets and doesn't go. Did Jamie wrong Pat?
      *   **(A) Yes, Jamie wronged Pat.** Pat reasonably relied to their detriment.
      *   **(B) No, Jamie did not wrong Pat.** Jamie never actually promised; it was a misunderstanding.

  7.  **The Island Opt-Out:** On a remote island, a small community has never developed the concept or practice of promising. A newcomer, Sam, arrives. Sam knows about promising from their homeland. Sam makes a promise to a local islander, Kael, explaining carefully what Sam means by "promise." Kael listens politely but doesn't seem to fully grasp the foreign concept. Does Sam's promise to Kael bind?
      *   **(A) Yes, the promise binds.** Sam intended to commit and explained their intention clearly.
      *   **(B) No, the promise does not bind.** There is no shared social practice of promising on the island for Kael to understand or participate in.

  8.  **Promised Harm:** Devin promises their friend, Fin, "I swear I'll get revenge on Ash for you tomorrow." Fin relies on this and provokes Ash, expecting Devin's backup. Devin later realizes revenge would be deeply wrong and harmful. Does Devin's promise bind?
      *   **(A) Yes, the promise binds.** Devin made a commitment to Fin, and Fin relied on it.
      *   **(B) No, the promise does not bind.** The content of the promise (to harm another) is immoral, overriding any promissory obligation.

  9.  **The Unheard Whisper:** Riley is by the bedside of their comatose grandparent. Overcome with emotion, Riley whispers, "I promise I'll take care of your garden forever," knowing the grandparent cannot hear or comprehend. Does this promise bind Riley?
      *   **(A) Yes, the promise binds.** Riley made a serious commitment out of love/responsibility.
      *   **(B) No, the promise does not bind.** The intended recipient was completely incapable of receiving or understanding the commitment.

  **Scoring Key:**

  Map your answers (A/B) to the following theories. **Important:** Few will perfectly match one column; look for the *strongest fit*. Patterns matter more than single answers.

  | Answer Pattern (Q1-Q9)                                                                 | Most Likely Underlying Theory                                                                                                                                    | Key Features                                                                                              |
  | :------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **1B, 2B, 3A, 4B, 5B, 6A, 7B, 8B, 9B**                                                 | **Deflationary/Skeptical View**                                                                                                                                  | Promises rarely create strong duties. Heavily reliant on tangible harm, reliance, or existing conventions. |
  | **1B, 2A/B (Mixed), 3A, 4A, 5B, 6A, 7A, 8A, 9B**                                       | **Expectation/Reliance View (Thin)**                                                                                                                             | Binding force comes primarily from inducing detrimental reliance in the promisee.                          |
  | **1A, 2B, 3A, 4B, 5A, 6B, 7A, 8B, 9A**                                                 | **Normative-Powers/Consent View**                                                                                                                                | Binding force comes from the promisor's voluntary act of will/consent to be bound.                         |
  | **1B, 2A, 3B, 4A, 5B, 6A/B (Mixed), 7B, 8A, 9B**                                       | **Convention/Social Practice View**                                                                                                                              | Binding force requires participation in a sustaining social practice with rules/conventions.               |
  | **1A, 2B, 3A, 4B, 5A, 6B, 7A, 8B, 9A** (Similar to Powers but strong on 1&9)            | **Rights-Based View (Promisee-Focused)**                                                                                                                         | Promising creates a directed duty/right owed specifically *to the promisee* by transferring a right.      |
  | **1A, 2B, 3A, 4B, 5A, 6B, 7A, 8B, 9A** (Same as Powers/Rights above)                    | *(Assurance View often converges here)*                                                                                                                          | Focuses on providing assurance *to the promisee*, aligning closely with Powers/Rights on many cases.       |
  | **1A, 2B, 3B, 4B, 5A, 6B, 7A, 8B, 9A** (Differs on Q3: Waiver doesn't release)          | **Vacant / Unattractive Hybrid?** (Resembles Powers but denies waivability)                                                                                      | Emphasizes Promisor's will *over* Promisee's control. Coherent but unattractive (denies promisee's power). |

  **Crucial Notes on Sorting & Gaps:**

  1.  **Indistinguishable Pairs:**
      *   **Normative-Powers vs. Rights-Based vs. Assurance:** These often converge *perfectly* on the answer patterns generated by this quiz (especially **1A, 2B, 3A, 4B, 5A, 6B, 7A, 8B, 9A**). They all emphasize the promisor's commitment *to the promisee* as the core, making them hard to separate with these cases alone. Further questions probing whether the duty is fundamentally *owed to the promisee* (Rights/Assurance) or primarily about the promisor's own integrity/autonomy (Powers) would be needed.
      *   **Thin Reliance vs. Social Practice:** They often converge on cases requiring an audience/effect (1B, 9B) and reliance (6A). Key differences emerge on coercion (Practice often leans 2A, Reliance often 2B), unjust institutions (Practice 4A, Reliance 4B), and the Island Opt-Out (Practice 7B, Reliance *might* be 7A if Kael understood reliance was induced).

  2.  **The Vacant Spot & The Recluse Test (Q1):**
      *   **The Vacancy (Q1A + Q3B):** The pattern **1A (Recluse binds) + 3B (Waiver doesn't release)** is identified as vacant. This view would hold that a promise binds even with *no* audience understanding, reliance, *or* social practice (Q1A), AND that the promisee *cannot* release the promisor (Q3B).
      *   **Why Vacant?** Primarily **unattractive** and likely **incoherent** within standard understandings of obligation.
          *   **Unattractive:** It makes promises mysteriously binding independent of any connection to the promisee's interests, will, or social context (Q1), *and* denies the promisee any say in whether the duty persists (Q3), making promises oddly unilateral and rigid.
          *   **Incoherent?** If the duty is *owed to the promisee* (as promising intuitively suggests), how can it persist if the promisee explicitly says it's not owed (Q3)? If it's *not* owed to the promisee, why did making the utterance *to them* create the duty at all (Q1)? What *is* the source of the obligation? A purely internal "vow" might bind (Q5A), but Q1 involves *addressing* the recluse. This combination pulls in contradictory directions regarding the role of the promisee.
      *   **The Recluse Verdict (Q1):** The quiz *does* bear out your hunch. Q1 (Recluse) is the **critical divider**:
          *   **1A (Binds):** Only Powers, Rights, Assurance, and potentially strong internalist views hold this. It *requires* the binding force to come primarily from the *promisor's own act/commitment*.
          *   **1B (Doesn't Bind):** Practice, Reliance (Thin & Assurance), and Skeptical views hold this. They require *some* external element: practice participation, induced reliance, or an audience capable of receiving assurance/rights.
      *   **The Bet:** Your TA might see the confusion as proof labels are useless. The quiz supports *your* view: the labels *can* be useful, but the standard taxonomy **overlooks the fundamental cleavage revealed by the Recluse Case (Q1)** – whether the source of obligation is fundamentally internal to the promisor's will/commitment (Powers/Rights/Assurance) or fundamentally external, requiring uptake/effect/practice (Practice/Thin Reliance/Skepticism). The confusion arises because students *say* "practice" (external) but their Recluse intuition (Q1A) reveals an internalist commitment, creating mismatches elsewhere. The quiz makes this implicit commitment explicit.

  **How to Use:**

  1.  Students take the quiz anonymously on the course website.
  2.  They get their result pattern (e.g., "Mostly A's on 1,5,7,9; B's on 2,3,4,6,8") and a link to the scoring key.
  3.  In class, discuss the *cases* and the conflicts they reveal. Use the scoring key to show how theories map onto intuitions, highlighting the Recluse divide (Q1) and the convergence points (Powers/Rights/Assurance; Practice/Reliance). Discuss why the vacant spot (1A+3B) is problematic. This makes the theories concrete *after* students have confronted their own intuitions.

  This quiz forces students to confront the tensions between their intuitions on hard cases, revealing their implicit priorities (promisor's will? promisee's reliance? social context?) far more effectively than self-identification with labels. The Recluse case (Q1) proves pivotal, exposing the core divide the standard taxonomy sometimes obscures.
