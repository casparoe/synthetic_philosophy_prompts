     *Progress without experiments:* Formal proofs (or counterexamples) showing under what conditions a human judge can verify superhuman arguments via debate.  
     *What moves it:* Empirical results in existing systems (e.g., with human judges and strong but subhuman debaters) showing whether judges can verify claims beyond their unaided ability.  

