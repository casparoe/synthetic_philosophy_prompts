     *Top for near-term empirical wins?* Yes, because near-term experiments are in domains with ground truth (so this is less critical for near-term). But note: in the near-term, we can avoid such domains, so it might be less pressing. However, for long-term, it's critical. But the user asked for near-term empirical wins, so we note:  
     - For near-term, we might prioritize domains with ground truth, so this is less critical. But if we want to test debate in more realistic settings, it becomes important.

     However, we rank it here because for the long-term mission, it's critical, and near-term experiments can still be run in domains with ground truth. But note: the user might care about near-term wins to build confidence, so we'll flag that for near-term, this might be lower.

  5. **Question 5 (Long-Horizon vs. Single-Turn):**  
     *Precise Question:* "Does allowing multiple rounds of cross-examination (long-horizon) fundamentally alter the guarantees of debate compared to single-turn debate? For example, does it mitigate the risk of judge exploitation or enable verification of more complex claims?"  
     *Why it matters:* Practical debate will be multi-turn, so if single-turn analysis doesn't extend, we need new theory.  
     *Tractability:* Conceptual work can extend game theory to sequential games and compare with single-shot.  
     *Neglectedness:* Relatively underexplored.  
