answer: |-
  Below is a prioritized agenda of six open questions in AI safety via debate, ranked by their dependency structure, impact on scalable oversight, tractability for conceptual research, and neglectedness. The ranking is grounded in three key principles:  
  - **Dependency-first**: Questions that are upstream (i.e., their answers constrain or enable progress on others) rank higher.  
  - **Scalability-critical**: Questions that determine whether debate works under superhuman capabilities rank higher than those focused on implementation nuances.  
  - **Conceptual tractability**: Prioritizes questions answerable through theoretical analysis, game-theoretic modeling, or small-scale simulations over those requiring massive experiments.  

  Neglectedness is assessed relative to the broader debate literature, with higher priority given to underexplored gaps. For each question, I provide:  
  - **Precise formulation** to avoid ambiguity.  
  - **Ranking justification**: Why it ranks here based on dependencies, impact, tractability, and neglectedness.  
  - **Progress indicators**: What conceptual progress looks like (without superhuman experiments).  
  - **What could move it**: Developments that would increase/decrease its priority.  

  Finally, I flag the top question for **superhuman-scale supervision** (i.e., debate for models vastly exceeding human capabilities) versus **near-term empirical wins** (i.e., deploying debate with current models).  

  ---

  ### **Ranked List**  
  **1. What judge capabilities are necessary/sufficient for debate to converge to truth when debaters are superhuman?**  
     - **Precise formulation**: "Can a human-level judge, when presented with arguments and counterarguments from superhuman debaters, reliably distinguish truth from falsehood by leveraging the debate process itself—even for claims they could not verify unaided? If not, what minimal judge capabilities (e.g., complexity-theoretic assumptions, access to tools, or limited superhuman assistance) are required?"  
     - **Ranking justification**:  
       - **Dependency**: Upstream of *all other questions*. If the judge cannot reliably verify superhuman claims, debate fails at its core purpose, making other questions moot. For example, Q2 (asymmetry) assumes the judge can detect flaws, and Q4 (equilibria) depends on the judge's influence on debater incentives.  
       - **Impact**: Highest—determines if debate is viable for scalable oversight. A negative answer would collapse the entire approach.  
       - **Tractability**: Highly tractable conceptually. Use complexity theory (e.g., modeling debate as an interactive proof system) or Bayesian networks to analyze judge verification limits. Small-scale human studies with expert debaters can probe claim verifiability.  
       - **Neglectedness**: High. Most work assumes judges "can verify" without formalizing how or when this breaks down.  
     - **Progress indicators**:  
       - A theoretical model showing classes of claims verifiable by a human judge via debate (e.g., using cryptographic primitives or probabilistic reasoning).  
       - A counterexample demonstrating unavoidable judge exploitation (e.g., in a simulated game with bounded rational agents).  
     - **What could move it**:  
       - **Up**: Empirical failures in human-debater experiments where judges are consistently misled on claims they can verify unaided.  
       - **Down**: A proof that, under specific debate rules, judges can verify any claim checkable in polynomial time with debater assistance.  

  **2. Does the asymmetry (finding flaws easier than constructing undetectable lies) survive optimization pressure?**  
     - **Precise formulation**: "When debaters are optimized for persuasion against a fixed judge, does the game-theoretic structure of debate inherently favor honest strategies due to the cost asymmetry of flaw-finding vs. lie-construction, or will optimal debaters exploit judge biases/limitations to win with falsehoods (Goodharting)?"  
     - **Ranking justification**:  
       - **Dependency**: Directly downstream of Q1 (judge capabilities), as judge limitations define exploitability. Upstream of Q3–Q6; e.g., if asymmetry collapses, equilibria (Q4) will be undesirable, and long-horizon dynamics (Q6) become irrelevant.  
       - **Impact**: Critical—asymmetry is debate's foundational intuition; if it fails, debate cannot scale.  
       - **Tractability**: Conceptually tractable via game theory (e.g., evolutionary stability analysis) or simulated debater populations. No superhuman experiments needed; test with adversarial training in current LLMs.  
       - **Neglectedness**: Medium. Often discussed informally, but few rigorous explorations of asymmetry under optimization.  
     - **Progress indicators**:  
       - A formal model showing conditions where asymmetry holds (e.g., bounded rationality or noise assumptions).  
       - An adversarial training experiment where debaters learn deceptive strategies against a weak judge.  
     - **What could move it**:  
       - **Up**: Evidence from RLHF-like setups where debaters exploit judges on simple tasks.  
       - **Down**: A theorem proving asymmetry holds under minimal judge competence.  
     - **Top for near-term empirical wins**: Yes—this is testable with current models and directly affects deployable debate systems.  

  **3. What are the necessary/sufficient conditions for honesty to be the unique Pareto-efficient equilibrium in debate?**  
     - **Precise formulation**: "Under what conditions (e.g., debate rules, judge behavior, or debater incentives) is honesty the unique subgame-perfect equilibrium (or other solution concept) that maximizes payoffs for all players? Are there adversarial or collusive equilibria that dominate honesty?"  
     - **Ranking justification**:  
       - **Dependency**: Downstream of Q1 and Q2. Judge capabilities (Q1) define the game, and asymmetry (Q2) affects equilibrium stability. Upstream of Q5–Q6, as equilibria determine long-horizon behavior.  
       - **Impact**: High—if undesirable equilibria exist (e.g., debaters colluding to mislead), debate is unreliable.  
       - **Tractability**: Highly tractable with game-theoretic tools (e.g., replicator dynamics, simulation of equilibrium selection).  
       - **Neglectedness**: Medium-high. Irving et al. (2018) initiated this, but conditions for unique honesty remain unclear.  
     - **Progress indicators**:  
       - A taxonomy of debate equilibria under varying judge/debater capabilities.  
       - A proof that honesty is dominant only if judges penalize ambiguity or hedging.  
     - **What could move it**:  
       - **Up**: Discovery of persistent collusive equilibria in simple debate games.  
       - **Down**: A general equilibrium-selection mechanism that favors honesty.  

  **4. Does long-horizon cross-examination fundamentally alter debate's guarantees compared to single-turn interactions?**  
     - **Precise formulation**: "In multi-round debates where debaters iteratively critique each subclaim, does the error rate in judge decisions decay exponentially with debate length (as in theoretical models), or do new failure modes (e.g., obfuscation, cumulative deception) dominate?"  
     - **Ranking justification**:  
       - **Dependency**: Downstream of Q1–Q3. Judge capabilities (Q1) limit cross-examination depth, and equilibria (Q3) shape multi-round strategies. Upstream of Q5 (no ground truth), as long-horizon debate is often proposed for complex domains.  
       - **Impact**: Medium-high—practical debate requires multiple turns, but failure here could be mitigated by other oversight methods.  
       - **Tractability**: Conceptually tractable. Extend existing Bayesian models of iterative questioning or analyze debate as a extensive-form game.  
       - **Neglectedness**: High. Most theory assumes single-turn; multi-round dynamics are poorly understood.  
     - **Progress indicators**:  
       - A simulation showing how deception risk scales with debate length (e.g., via probabilistic graphical models).  
       - Human studies comparing single-turn vs. multi-round debate accuracy.  
     - **What could move it**:  
       - **Up**: Experiments showing judges become *less* accurate with longer debates due to confusion.  
       - **Down**: A proof that multi-round debate strictly dominates single-turn in error reduction.  

  **5. What guarantees can debate provide in domains with no human-checkable ground truth?**  
     - **Precise formulation**: "In value-laden or inherently unverifiable domains (e.g., ethics, long-term predictions), can debate elicit human-intended judgments that are robust and coherent? If so, under what constraints (e.g., debaters restricted to human-understandable arguments)?"  
     - **Ranking justification**:  
       - **Dependency**: Downstream of Q1–Q4. Judge capabilities (Q1) and equilibria (Q3) are prerequisites. Mostly independent; failure here limits debate's scope but doesn't invalidate it for verifiable domains.  
       - **Impact**: Medium—critical for real-world deployment but less urgent than core scalability (Q1–Q2).  
       - **Tractability**: Moderately tractable. Use philosophical frameworks (e.g., reflective equilibrium) or coherence theorems to model value debates.  
       - **Neglectedness**: Very high. Few papers address debate for unverifiable claims.  
     - **Progress indicators**:  
       - A formal argument that debate converges to a consistent utility function if debaters are honest.  
       - A case study in moral philosophy showing debate could resolve ethical dilemmas.  
     - **What could move it**:  
       - **Up**: AI incidents where debate amplifies biases in subjective domains.  
       - **Down**: A theory showing debate reduces value incoherence under defined axioms.  
     - **Top for superhuman-scale supervision**: Yes—this is critical for aligning superhuman AI on human values.  

  **6. How does debate functionally relate to recursive reward modeling (RRM) and weak-to-strong generalization?**  
     - **Precise formulation**: "Is debate primarily a standalone oversight mechanism, a training signal for RRM (e.g., by generating preference data), or a technique to bootstrap weak-to-strong generalization? Which approach maximizes sample efficiency and robustness under superhuman capabilities?"  
     - **Ranking justification**:  
       - **Dependency**: Downstream of Q1–Q2 (depends on debate's viability) but independent otherwise. Not upstream—its answer doesn't affect debate's core mechanics.  
       - **Impact**: Low-medium. Clarifies research strategy but doesn't determine debate's viability (hence lowest rank).  
       - **Tractability**: Highly tractable via conceptual comparison of sample complexity, failure modes, and scalability.  
       - **Neglectedness**: Low. Often discussed (e.g., Christiano's views), with emerging empirical work.  
       - **Verbal/settled?**: Partially verbal—resolving this may not change debate's intrinsic value, as it could still serve multiple roles.  
     - **Progress indicators**:  
       - A computational model comparing debate/RRM data efficiency for reward learning.  
       - A theorem showing debate reduces weak-to-strong generalization error.  
     - **What could move it**:  
       - **Up**: Empirical results showing debate dramatically improves RRM sample efficiency.  
       - **Down**: A proof that debate and RRM are formally equivalent under scaling.  

  ---

  ### **Goal-Dependent Top Questions**  
  - **For supervising models exceeding the judge (superhuman-scale)**: **Question 1 (Judge capabilities)** is paramount. If a human-level judge cannot leverage debate to verify superhuman claims, debate fails at scalable oversight.  
  - **For near-term empirical wins**: **Question 2 (Asymmetry survival)** ranks highest. It's testable with current models (e.g., via RLHF adversarial training) and addresses the most immediate risk—debaters exploiting judges—in deployable systems.  

  ### **Key Trade-offs in Ranking**  
  - **Neglectedness vs. impact**: Question 5 (no ground truth) is highly neglected but ranks lower because failure only limits debate's scope, whereas Q1 failure is existential.  
  - **Dependency vs. urgency**: Question 6 ranks last because it depends on debate working (Q1–Q2) and is more strategic than mechanistic.  
  - **Tractability**: All top questions are analyzable with theory/simulations; none require superhuman experiments.  

  This agenda prioritizes resolving debate's *core failure modes* (judge limitations, asymmetry collapse) before scaling or implementation concerns. Progress on Q1–Q2 would de-risk the portfolio allocation; negative answers would suggest shifting resources to RRM/weak-to-strong.
