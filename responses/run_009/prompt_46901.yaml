answer: |-
  Here’s a comprehensive exam package tailored to your specifications, designed to push students beyond rote recall into critical analysis of MFT’s normative implications.

  ---

  ### **1. Exam Question (Self-Contained Paragraph)**  
  "Moral Foundations Theory proposes that liberals primarily rely on Care and Fairness foundations when making moral judgments, while conservatives additionally engage Loyalty, Authority, and Sanctity. One interpretation likens this to taste perception: just as someone detecting only sweetness has a 'narrower palate' than someone sensing all five basic tastes, conservatives might have 'broader' moral sensitivity—but this need not imply their judgments are more *correct*, since taste is subjective. Alternatively, foundations might function like visual perception: lacking a photoreceptor means missing objective information about light, so a narrower moral foundation could mean missing real moral truths. Yet a third view suggests foundations are tools for social coordination, where 'correctness' depends on which set best sustains cooperation in a given context. Analyze these three interpretations (taste, perception, coordination). For each, explain: (a) its implications for whether broader foundations are epistemically or practically advantageous, and (b) whether it can justify normative claims (e.g., 'society *should* embrace all five foundations') without committing an is-ought fallacy. Conclude by arguing which interpretation offers the most coherent framework for understanding political disagreement."

  ---

  ### **2. Model Answer (689 words)**  
  **Position**: The coordination interpretation best resolves the descriptive/normative gap, avoids is-ought fallacies, and explains political disagreement.  

  **Taste Analogy (Subjective Preference)**: Framing foundations as taste receptors treats moral breadth as aesthetic variation. Here, conservatives’ use of five foundations reflects personal or cultural preference, not superior insight. While this avoids is-ought fallacies (no claim that broader tastes are objectively better), it undermines MFT’s scientific pretensions: if morality is *merely* taste, empirical claims about "foundations" lose explanatory power. Normatively, it cannot justify why society *should* value breadth—doing so would require smuggling in a covert norm (e.g., "diversity is good"), itself unjustified. At best, it offers tolerance ("different strokes for different folks"), but fails to address why political conflicts feel *morally urgent* rather than like debates over pizza toppings.  

  **Perception Analogy (Objective Sensitivity)**: Treating foundations as photoreceptors suggests broader foundations access more moral truth. This might justify conservatism’s breadth as epistemically superior (e.g., Sanctity detects "real" degradation). But this commits two errors. First, it assumes moral realism without evidence: what independent criterion confirms Authority tracks "real" obligations? If foundations evolved for cooperation, not truth-tracking, perception is a flawed analogy. Second, even if realism holds, this *still* commits an is-ought fallacy. Just as noting humans perceive light doesn’t prove we *should* prioritize visual data, describing evolved foundations doesn’t prescribe which to value. One might argue broader perception aids survival—but this shifts to pragmatic justification, abandoning realism. Without a naturalistic bridge (e.g., "foundations necessary for flourishing"), perception collapses into covert coordination.  

  **Coordination Tools (Functional Pragmatism)**: Foundations are best seen as cognitive tools for solving cooperation problems. Care and Fairness regulate one-on-one interactions; Loyalty, Authority, and Sanctity bind groups through shared norms, identity, and sacred values. Breadth isn’t intrinsically better—it serves context-dependent goals. Small-scale societies might thrive with all five foundations fostering cohesion, while diverse democracies might prioritize Care/Fairness to manage pluralism. Crucially, this view *can* justify normative claims without is-ought fallacies by adopting a goal-relative ought: *If* a group seeks stability amid resource scarcity, *then* emphasizing Loyalty/Sanctity might be functionally justified. The "ought" is hypothetical, not categorical. Empirical evidence supports this: Haidt’s work shows Sanctity-based rhetoric increases in-group sacrifice; conversely, liberal societies rely on impersonal institutions (Fairness) to coordinate strangers.  

  **Why Coordination Frames Disagreement Best**: Political clashes reflect competing coordination strategies, not blindness to truth or taste. Liberals, operating in cosmopolitan contexts, see Loyalty/Authority as oppressive because they prioritize scalable cooperation among strangers (via rights and rules). Conservatives, often in cohesive communities, view narrow foundations as destabilizing because they weaken group-level commitments. Neither is "wrong"—but each optimizes for different scales of cooperation. The coordination lens explains moral anger: violating Loyalty *genuinely* threatens group cohesion, just as violating Fairness corrodes trust in anonymous systems. Normatively, this suggests societies should deliberately match foundation bundles to their cooperation challenges (e.g., post-conflict states may need temporary Authority emphasis). It avoids is-ought gaps by tying prescriptions to shared goals (e.g., "if you value social cohesion, cultivate Loyalty").  

  **Conclusion**: Taste and perception analogies fail—one reduces morality to arbitrary preference, the other conflates evolution with truth-tracking. Coordination resolves this by treating foundations as pragmatic tools. It transforms political disagreement from a contest over truth to a negotiation over which "moral technology" best serves collective goals—making it the most coherent framework for moral psychology.  

  ---

  ### **3. Marking Scheme (25 points total)**  
  **Must-Hit Moves**:  
  1. **Explain taste vs. perception analogy contrast** (5 pts):  
     - *Trap*: Conflating the two (e.g., "both are about senses").  
  2. **Diagnose normative weaknesses in taste/perception** (7 pts):  
     - Taste: Cannot justify breadth as "better" without subjective bias; Perception: Commits is-ought or assumes realism unjustifiably.  
     - *Trap*: Claiming "is-ought gap destroys both" without engaging their distinct flaws (e.g., perception’s realism problem is separate).  
  3. **Articulate coordination as alternative + functional justification** (7 pts):  
     - Foundations as solutions to cooperation problems; normative "oughts" as hypothetical (if [goal], then [foundation]).  
     - *Trap*: Reducing coordination to relativism ("whatever works") without linking foundations to specific social functions.  
  4. **Apply interpretations to political disagreement** (6 pts):  
     - E.g., Liberals vs. conservatives as optimizing for different cooperation scales (diverse societies vs. tight groups).  
     - *Trap*: Merely restating MFT’s descriptive claims without connecting to analogies.  

  **A vs. B Differentiation**:  
  - **A (21-25 pts)**: Integrates all moves; explicitly shows *why* coordination avoids is-ought gaps via hypothetical imperatives; uses political example to illustrate functional trade-offs.  
  - **B (16-20 pts)**: Covers all moves but superficially; notes coordination "solves" is-ought without explaining *how* (e.g., omits goal-relativity); political application is generic.  

  ---

  This question forces engagement with metaethics while grounding abstract debates in MFT’s core claims. The coordination focus honors Haidt’s evolutionary roots without requiring specialized texts, and the marking scheme rewards synthetic insight over memorization. Let me know if you’d like tweaks to the model answer’s position or point distribution!
