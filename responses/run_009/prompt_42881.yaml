prompt: |-
  Fair warning, this is a teaching-plan request that came out of a fight: I spent most of last night arguing with a friend who took one social choice course years ago and now insists Sen's liberal paradox "proves rights are just logically incoherent, period" — and somewhere in there I realized I couldn't lay the structure out cleanly enough to show him what the theorem does and doesn't say. Which is a problem, because in a month I have to teach this thing to my intro social choice section (50 minutes, mostly econ and poli-sci sophomores, comfortable with basic notation but nothing fancy) and I refuse to walk out with thirty students who now believe my friend.

  So plan the session for me rather than explaining the paradox itself. What has to be in place before the punchline can land — my instinct is they need to see Pareto as an actual constraint you'd have to give something up to escape, not as an obvious truth, before I state the result, but you tell me. Whether to use the classic Lady Chatterley's Lover setup (Prude and Lewd etc.) or whether it's too cute and period-piece and I should build the whole thing around a different case — and what the replacement would need to have and lack. The misconceptions they'll show up with or form on the spot (my guesses: "it's just Arrow's theorem rebranded", "Sen proved rights don't exist", and the meddlesome-preferences thing where they think the whole result depends on everyone caring about everyone else's business) and exactly where in the sequence to head each one off. One question I can ask at the end that would distinguish a student who actually got it from one who was just convinced by the vibe. And what I should openly refuse to get into — I'm inclined to say the Gibbard-style domain-restriction stuff is a bridge too far for sophomores but correct me if im wrong, since alot of the interesting action seems to live there.

  Structure your answer as: "Dependency order" (~150 words), "The carrying example" (~100), "Misconception map" (~200), "Exit ticket question" (~50), "What I'm leaving out" (~75), in that order.
reasoning: |-
  Hmm, the user is a social choice instructor who needs to teach Sen's liberal paradox to undergraduates. They had an argument with a friend who misinterpreted Sen's theorem as proving rights are logically incoherent, and now they're worried about their students walking away with that misconception. The user wants a structured teaching plan for a 50-minute session targeting econ and poli-sci sophomores with basic notation skills.

  I need to provide a detailed plan as specified: dependency order, carrying example, misconception map, exit ticket question, and what to leave out. The user is concerned about students misunderstanding the paradox as disproving rights altogether rather than showing a tension between rights and Pareto efficiency.

  For the dependency order, I should start with Pareto efficiency since students might take it as obvious truth. They need to see it as a constraint that requires trade-offs. Then introduce liberalism as a minimal rights condition, contrasting it with Pareto. Only after establishing both concepts should I present Sen's impossibility result. The sequencing should help students see the conflict rather than dismiss one principle outright.

  For the example, the classic Lady Chatterley's Lover case (Prude vs Lewd) is actually effective despite being dated. It clearly shows personal sphere conflicts and meddlesome preferences. I'll suggest keeping it but emphasize that the meddlesomeness is illustrative, not essential to the theorem. The example makes the abstract conflict tangible.

  The misconception map is crucial. I need to address several potential misunderstandings: that this is just Arrow's theorem repackaged (it's not - different conditions), that Sen proved rights are impossible (he showed a tension, not impossibility), and that meddlesome preferences are necessary (they're sufficient but not necessary). I'll explain where to clarify each misconception during the lesson.

  For the exit ticket question, I should create something that tests whether students understand the specific nature of the conflict. A good question would ask them to identify which principle must be relaxed to resolve the paradox in a given scenario.

  Regarding what to leave out, domain restriction solutions like Gibbard's are too advanced for this level. I'll also avoid deeper philosophical debates about rights foundations. The focus should stay on the technical conflict Sen identified.

  The user seems anxious about creating more misconceptions, so I'll emphasize preempting errors through careful sequencing and explicit clarification points. Their teaching instinct about destabilizing Pareto's obviousness is correct - that's key to making the paradox land effectively.
answer: |-
  ### Dependency Order (~150 words)
  1. **Start with Pareto efficiency**: Frame it as a *weak* but widely accepted constraint ("if everyone prefers X over Y, society shouldn't choose Y"). Use a simple 2-person, 2-good trade example to show its appeal. *Crucially*, pose a hypothetical: "Would you ever accept violating Pareto? What if it required overriding a core personal freedom?" Plant the seed that Pareto isn't cost-free.
  2. **Define minimal liberalism (ML)**: Introduce it as a *minimal* rights condition ("each person gets decisive say over *at least one* pair of social states concerning their private sphere"). Emphasize "at least one pair" and "private sphere" – it's modest! Contrast with stronger libertarian views.
  3. **Present the conflict**: *Only now* state Sen's theorem: No SWF can satisfy Unrestricted Domain, Pareto, *and* ML. Highlight it's an *impossibility* under UD. Stress it's a logical conflict between two desirable principles under full preference freedom.
  4. **Analyze the implication**: The impossibility forces a choice: relax UD (limit pref types), relax Pareto, or relax ML (limit rights). **Key takeaway**: Rights aren't "incoherent," but their *unconditional compatibility* with Pareto under full preference freedom is.

  ### The Carrying Example (~100 words)
  **Stick with Lady Chatterley (Prude/Lewd)**. Its strengths outweigh the period feel:
  1.  **Clarity of Private Sphere**: Reading/not reading a book is undeniably personal.
  2.  **Visceral Meddlesomeness**: Prude's horror at Lewd reading *and* Lewd's amusement at Prude suffering make conflicting preferences tangible. Acknowledge it's "cute" but stress its pedagogical efficiency.
  3.  **Minimal Setup**: Only 2 people, 3 states (P reads/L reads/Neither), clear decisive pairs (Lewd: {L reads} vs {Neither}; Prude: {Neither} vs {P reads}).
  **Replacement Needs**: An equally clear private act (e.g., wearing a specific symbol, playing loud music at home) where two individuals have opposing preferences over each other's choice *and* the act itself, allowing decisive pairs and Pareto conflicts. Avoid overly politicized examples that distract.

  ### Misconception Map (~200 words)
  1.  **"It's just Arrow rebranded"**: **Head off immediately after stating the theorem.** Contrast: Arrow requires IIA and Ordinal Non-Comparability; Sen uses Pareto + ML. Arrow's about aggregation; Sen's about rights vs. efficiency. Point out Arrow doesn't mention rights. *Where*: Explicitly during theorem statement/dependency recap.
  2.  **"Sen proved rights don't exist/logically incoherent"**: **Undermine *before* stating the theorem and hammer *after*.** Before: Frame ML as minimal, plausible. After: Emphasize the theorem forces a *choice* between weakening principles, not abandoning rights. Rights exist fine if we accept constrained preferences or (rarely) Pareto violations. *Where*: During ML definition, conclusion, and explicitly refute in Q&A.
  3.  **"It only happens if people are nosy (meddlesome prefs)"**: **Acknowledge but qualify during example analysis.** Yes, meddlesome prefs *trigger* the paradox in the example and are realistic. BUT: The theorem holds under UD – it's a *logical possibility* inherent in the conditions, not *caused* by meddlesomeness. A student *could* construct non-meddlesome prefs triggering it. *Where*: When discussing the Chatterley prefs, say "This shows how *realistic* preferences cause conflict, but the conflict is baked into the logic."
  4.  **"Rights are absolute" (Implicit)**: **Address during ML definition.** Stress ML is *minimal*. Real rights systems often have limits (harm principle, competing rights), making the paradox less shocking practically, but the theoretical tension remains.

  ### Exit Ticket Question (~50 words)
  > "In Sen's paradox, if we observe a society consistently making Pareto-efficient choices respecting minimal liberalism over time, what does this imply must be true about the preferences people *actually* hold, compared to the Unrestricted Domain assumption?"
  >
  > *(Target Answer: Preferences must be restricted/cannot include the types of conflicting rankings that trigger the paradox.)*

  ### What I'm Leaving Out (~75 words)
  *   **Gibbard-style Domain Restrictions**: Too technical. Mentioning "restricting preferences solves it" suffices. Don't dive into *how* (e.g., "no externalities," "ergodic" prefs).
  *   **Formal Proof Details**: Sketch the Chatterley cycle showing the Pareto+ML conflict is enough. No need for general pair-wise lemma proofs.
  *   **Alternative Libertarian Conditions**: Nozick's entitlement, Gaertner-Pattanaik formulations, etc. Stay focused on Sen's minimal ML.
  *   **Deep Philosophical Debates on Rights Foundations**: Acknowledge the theorem informs these debates, but don't engage in them. Stick to the formal conflict.
