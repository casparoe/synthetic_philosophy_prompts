answer: |-
  ### Standing Procedure for Welfare Committee Decisions

  **Core Principles Embedded in Procedure:**
  1. **Threshold Rule:** Pain above a defined intensity threshold ("severe pain") *cannot* be traded for any amount of pleasure. It must be prevented or alleviated.
  2. **Below-Threshold Tradeoffs:** Pain below the threshold ("mild/moderate pain") can be weighed against pleasure or long-term benefits.
  3. **Animal Choice:** If an animal voluntarily engages in painful activity (e.g., running with joint stress), this *does not override the threshold rule* but informs the "weighing" step for below-threshold pain.

  **Procedure Steps**  
  *Time Limit: 60 minutes per item. If consensus isn’t reached at any decision point, hold a majority vote.*

  #### Step 1: **Define the Pain**  
  - *Question to Vet:* "On a scale of 1–10, what is the **peak pain intensity**? How long/frequent is it? Is it avoidable?"  
  - *Required Output:*  
    - Peak intensity (1–10).  
    - Duration (e.g., "2 days," "chronic").  
    - Frequency (e.g., "constant," "intermittent").  
  - *Move On When:* Vet provides clear estimates (no philosophy needed).  

  #### Step 2: **Apply the Threshold Rule**  
  - *Question to Committee:* "Is **peak pain ≥7/10**? (i.e., pain that causes screaming, inability to rest/eat, or severe distress)."  
    - *If YES (Severe Pain):*  
      - **Mandatory action:** Prevent/alleviate this pain. Pleasure *cannot* justify it.  
      - *Exception:* If pain is self-chosen (e.g., horse running), proceed to Step 3 but require mitigation (e.g., joint supplements).  
    - *If NO (Mild/Moderate Pain):* Proceed to Step 3.  
  - *Move On When:* Consensus or vote on threshold breach.  
  - *Handoff to Vote:* Threshold judgment is inherently subjective. Vote if disagreement persists.  

  #### Step 3: **Weigh Below-Threshold Pain vs. Benefits**  
  - *For pain <7/10 only:*  
    - Calculate **"Pain Burden"**: `Peak Intensity × Duration × # Affected Animals`.  
    - Calculate **"Benefit Score"**: `Pleasure Intensity (1–10) × Duration × # Benefiting Animals`.  
    - *Animal Choice Adjustment:* If pain is self-chosen, multiply Benefit Score by 1.5 (agency premium).  
  - *Question:* "Does **Benefit Score ≥ 2× Pain Burden**?"  
    - *If YES:* Proceed if affordable.  
    - *If NO:* Reject unless pain can be reduced.  
  - *Move On When:* Scores are computed (use vet/keeper input for pleasure estimates).  
  - *Handoff to Vote:* If scores are close (±25%) or costs are prohibitive.  

  #### Step 4: **Check Affordability**  
  - *Question:* "Can we fund this without compromising **existing threshold-level pain care**?"  
  - *Move On When:* Bookkeeper confirms budget impact.  

  #### Step 5: **Document & Implement**  
  - Record rationale, votes, and thresholds used.  
  - Revisit decisions if new data emerges.  

  ---

  ### Case Applications

  #### **Case 1: Enrichment vs. Overnight Staffing**  
  - **Pain:** Post-op pain (vet: peak 5/10, moderate, 3 nights/month).  
  - **Step 2:** Pain = 5/10 → *below threshold*. Proceed to weighing.  
  - **Pain Burden:** `5 × 3 nights × 2 animals/month = 30`.  
  - **Benefit:** Enrichment (peak pleasure 8/10, daily, 80 animals).  
    - **Benefit Score:** `8 × 30 days × 80 = 19,200`.  
  - **Weighing:** 19,200 > 2×30 → **Approve enrichment**. Staffing not mandatory (pain below threshold).  

  #### **Case 2: Pig’s Chronic Sore vs. Painful Procedure**  
  - **Existing Pain:** Pressure sore (vet: peak 3/10, constant, mild).  
  - **Procedure Pain:** (Vet: peak 8/10, severe, 5 days).  
  - **Step 2:** Procedure pain = 8/10 → *above threshold*. **Must prevent unless necessary to avoid worse severe pain.**  
    - Chronic pain (3/10) is *not severe*, so procedure is **rejected** per threshold rule.  
  - *But wait:* Can procedure pain be reduced below threshold?  
    - *If vet can drop pain to 6/10 with meds:*  
      - **Pain Burden:** `6 × 5 days × 1 pig = 30`.  
      - **Benefit:** Eliminate chronic pain → `Avoided pain = 3 × 365 days × 1 = 1,095`.  
      - **Weighing:** 1,095 > 2×30 → **Approve procedure** (if pain manageable below threshold).  

  #### **Case 3: Goat Integration (Social Pleasure vs. Fighting Injuries)**  
  - **Pain:** Fighting injuries (vet: peak 8/10, intermittent, 3 weeks).  
  - **Step 2:** Pain = 8/10 → **above threshold.**  
    - *Implication:* Integration pain *cannot* be traded for future pleasure.  
  - **Procedure Outcome:**  
    - **Reject integration** unless pain can be reduced below threshold.  
    - *Mitigation Example:* If gradual introductions limit pain to 6/10 (moderate):  
      - **Pain Burden:** `6 × 21 days × 2 goats = 252`.  
      - **Benefit:** Social pleasure (7/10, 5 years, 10 goats).  
        - **Benefit Score:** `7 × 1,825 days × 10 = 127,750`.  
      - **Weighing:** 127,750 > 2×252 → **Approve integration** (if pain below threshold).  
  - *Hard Truth:* The committee’s principle forbids accepting severe pain for social benefits. Mitigation is essential.  

  ---

  ### Where the Procedure Misfires  
  1. **Threshold Ambiguity:**  
     - A peak pain of 7/10 vs. 6/10 may be arbitrary, but the vote resolves this.  
     - *Misfire:* Misjudging severity (e.g., assuming "mild" when pain is debilitating).  

  2. **Cross-Animal Tradeoffs:**  
     - Doesn’t handle "sacrifice one animal’s pain for another’s pleasure." (e.g., euthanizing a sick pig to fund herd enrichment).  

  3. **Long-Term Risks:**  
     - Animal choice (e.g., horse running) is permitted if pain is below threshold, but future severe pain (e.g., arthritis) must be mitigated *now*.  

  4. **Cost-Driven Emergencies:**  
     - If mandatory pain relief (Step 2) is unaffordable, the procedure documents but doesn’t solve the ethics/budget clash.  

  5. **Subjectivity in Pleasure:**  
     - Benefit scores rely on staff estimates of "joy," which may be anthropomorphized.  

  **Final Recommendation:** Use this procedure to force clarity on threshold breaches and quantitative tradeoffs. For edge cases, prioritize the threshold rule—it’s the sanctuary’s non-negotiable ethic. Document disagreements to refine thresholds over time.
