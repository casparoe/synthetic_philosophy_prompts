prompt: |-
  I'd like your credence on a specific proposition: if a mid-sized democratic country (or a large city) ran a genuine futarchy pilot for ten years — an elected assembly setting a scalar welfare metric, decision markets setting policy whenever conditional forecasts of the form "if this policy were adopted, the metric would be higher" showed a clear winner — the futarchically governed jurisdiction would outperform a matched, conventionally governed one on that same metric by more than measurement noise. Decompose the number into the sub-questions that actually drive it: whether decision markets on multi-year, partly counterfactual policy outcomes can attract enough liquidity and informed trading to be efficient rather than noisy; whether any scalar welfare measure an assembly can write is robust to Goodharting by the very traders who profit from anticipating its distortions; whether the vote-on-values, bet-on-beliefs division of labor is stable, given that most real policy disputes embed value disagreements disguised as factual ones, so the markets end up quietly re-litigating the values; and whether manipulation by deep-pocketed actors is fatal to the scheme or merely a tax on its performance. Give a rough probability for each term, show how they combine into your overall credence, and tell me which term you are least confident in and what a realistic small-scale test — a city, a university, a large firm — could actually teach us about that term within a decade.
