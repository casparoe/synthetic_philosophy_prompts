prompt: |-
  My friends and I run a small wiki-ish project where we tag history-adjacent claims as "mainstream history," "fringe," or "pseudohistory," and I've slowly realized we've been doing it entirely by vibes. Atlantis is easy, Fomenko's new chronology is easy, ancient aliens is easy, but then it gets awkward fast: Gavin Menzies' 1421 stuff, the Solutrean hypothesis, Velikovsky — and worse, there are things that were once considered fringe and got rehabilitated, like continental drift in science, or in history things like the Younger Dryas impact hypothesis going from crackpot-adjacent to at least a serious debate in some circles. So before we tag another article I want the actual spec. Write the desiderata: what an adequate criterion for demarcating pseudohistory from merely heterodox or revisionist history has to deliver — the cases it has to classify correctly, the distinctions it absolutely cannot collapse (bad history vs. not-history-at-all, minority interpretation vs. methodologically broken work, revisionism vs. fabrication), what it should say about unfalsifiability, phantom or recycled evidence, conspiracy-shaped reasoning, and independence of corroborating sources — with the motivating case behind each requirement.

  A couple of things I specifically want your take on. First, mark which desiderata are non-negotiable and which are basically one camp's prejudice smuggled in as a criterion — I suspect some Popper-flavored demands don't transfer cleanly, since historians can't do experiments and everything rests on sources with provenance, so maybe falsifiability isn't the right lens at all. Second, tell me whether you think some subset of the desiderata is jointly unsatisfiable, because if the list can't all be met at once, that's actually the part I most want to know — it would tell us our tagging scheme needs a fourth category or something. And third, say briefly whether the criterion should be history-specific or just borrowed from philosophy of science with tweaks, since our one friend insists demarcation in history is basically the same problem and I'm not convinced. Don't bother scoring actual named pseudohistories against the list beyond using them as test cases, we'll do that ourselves on the wiki.
reasoning: |-
  Okay, the user runs a small wiki project tagging historical claims as mainstream, fringe, or pseudohistory. They've been relying on "vibes" and now want a solid criterion to distinguish pseudohistory from merely heterodox or revisionist history. They mentioned tricky cases like Gavin Menzies, the Solutrean hypothesis, Velikovsky, and rehabilitated theories like continental drift or the Younger Dryas impact hypothesis.

  First, I need to outline the desiderata for an adequate demarcation criterion. The user wants clear distinctions: bad history vs. not-history, minority interpretations vs. methodologically broken work, revisionism vs. fabrication. They also want considerations on unfalsifiability, phantom evidence, conspiracy reasoning, and independence of sources. Each requirement should have a motivating case.

  The user has specific requests. First, mark which desiderata are non-negotiable versus those that might be biased. They suspect Popperian falsifiability might not fit history since historians can't run experiments and rely on sources. So I need to address that carefully. Second, check if some desiderata conflict, making them jointly unsatisfiable. If so, they might need a fourth category. Third, decide if the criterion should be history-specific or adapted from philosophy of science. Their friend thinks it's the same problem, but the user isn't convinced.

  Breaking down the core issues. History relies on evidence like texts, artifacts, which have provenance and context. Falsifiability in science involves experiments, but in history, it's about evidence. A hypothesis that ignores counter-evidence or reinterprets all contrary data might be unfalsifiable. So maybe rephrase falsifiability as responsiveness to evidence.

  Key distinctions: Pseudohistory often fabricates or distorts evidence, while revisionism works within methodological norms. Conspiracy thinking—attributing dissent to malice—can poison the well. Independence of sources is crucial; pseudohistory might rely on a single, dubious source or circular references.

  Non-negotiables: Evidence responsiveness (replaces falsifiability), methodological integrity (handling sources properly), rejection of conspiracy reasoning. These prevent collapsing key distinctions. Negotiable aspects might include how much consensus matters or specific evidence thresholds, as those can be context-dependent.

  Conflicts might arise. For example, a theory starting as fringe but later accepted (like continental drift) challenges rigidity. If the criterion is too strict, it might mislabel emerging ideas. But if too lenient, it lets pseudohistory slip through. The solution could be a fourth category like "emerging/contested" for theories in flux, avoiding premature tags.

  History-specific vs. philosophy of science: While both deal with demarcation, history's methods are distinct. Provenance, source criticism, hermeneutics are central. Philosophy of science focuses on experimentation and falsification. So adapt criteria to historical methodology, emphasizing evidence handling over experimental testing.

  In summary, the user needs a clear, method-based criterion that handles edge cases, identifies when theories cross into pseudohistory, and allows for reevaluation. Highlighting potential conflicts and suggesting a fourth category could address their deeper need for a flexible yet robust system.
answer: |-
  Here's a breakdown of the desiderata for demarcating pseudohistory, structured around your requirements, with non-negotiables flagged, potential conflicts identified, and thoughts on specificity:

  **Core Distinctions the Criterion MUST Uphold (Non-Negotiable):**

  1.  **"Bad History" vs. "Not-History-At-All":**
      *   **Desideratum:** Must distinguish between work that is *poorly executed* history (flawed methodology, weak evidence, bias - **bad history**) and work that fundamentally *rejects or bypasses* the core epistemological and methodological foundations of the historical discipline (**pseudohistory**).
      *   **Motivating Case:** Gavin Menzies' *1421*. While spectacularly flawed and rejected by experts, Menzies *attempts* to use maps, artifacts, and texts (however misread or misrepresented). This is **bad history**. Contrast with claims of Atlantean super-technology based solely on channeled messages or "energy readings" of stones – this rejects historical evidence entirely.
      *   **Why Non-Negotiable:** Collapsing this distinction legitimizes methods fundamentally alien to historical inquiry as merely "bad" rather than invalid.

  2.  **"Minority Interpretation" vs. "Methodologically Broken Work":**
      *   **Desideratum:** Must distinguish between interpretations that are *fringe* due to challenging consensus based on unconventional but *methodologically sound* analysis of evidence, and interpretations that are *fringe* because their core arguments rely on demonstrably *broken* historical methods (e.g., ignoring provenance, misdating, ignoring linguistics, forcing evidence).
      *   **Motivating Case:** **Solutrean Hypothesis:** Initially a very fringe minority interpretation proposing pre-Clovis European migration to NA. While heavily criticized and now largely rejected based on genetics/archaeology, proponents generally *tried* to use standard archaeological methods on genuine artifacts. **Velikovsky:** Relies on misinterpreting/mistranslating texts, ignoring stratigraphy & dendrochronology, forcing astronomical correlations, and rejecting radiocarbon dating – core methodology is fundamentally broken.
      *   **Why Non-Negotiable:** Protecting legitimate scholarly dissent and revisionism is crucial. Equating heterodoxy with methodological bankruptcy stifles progress.

  3.  **"Revisionism" vs. "Fabrication/Systematic Distortion":**
      *   **Desideratum:** Must distinguish between re-evaluating existing evidence or incorporating new evidence within accepted methodological frameworks (**revisionism**), and *inventing evidence, systematically distorting evidence, or constructing narratives fundamentally detached from the available evidentiary record* (**pseudohistory**).
      *   **Motivating Case:** **Younger Dryas Impact Hypothesis:** Revisionism based on interpreting new geological/geochemical data (spherules, nanodiamonds, platinum spikes). Debate rages over *what the evidence means*, but the evidence itself is physical and subject to standard scientific analysis. **Fomenko's New Chronology:** Requires the systematic fabrication of *centuries* of history, the misdating of *thousands* of artifacts and documents, and the dismissal of vast swathes of established archaeological, textual, and scientific evidence as deliberate forgeries.
      *   **Why Non-Negotiable:** History depends on the integrity of evidence. Processes that invent or willfully distort evidence to fit a pre-determined narrative are antithetical to the discipline.

  **Essential Methodological & Evidentiary Criteria (Mostly Non-Negotiable):**

  4.  **Responsiveness to Evidence (Replaces Naive Falsifiability):**
      *   **Desideratum:** Must evaluate how a theory *engages with the totality of relevant evidence*. Pseudohistory typically **insulates its core claims from counter-evidence** by: dismissing it as forged/conspiracy; reinterpreting *all* counter-evidence to fit the theory ("everything proves my point"); or relying on evidence inaccessible to others (secret texts, psychic revelations).
      *   **Motivating Case:** **Ancient Aliens:** Any counter-evidence (e.g., known cultural evolution of pyramid-building techniques) is explained away as "cover-up" or "misunderstanding" by mainstream scholars. **Velikovsky:** Dismissed radiocarbon dating as flawed when it contradicted him.
      *   **Why Replaces Falsifiability:** Historians can't rerun the past. But they *can* demand theories engage coherently with the *existing body of evidence* (texts, artifacts, archaeology, genetics, etc.). Immunization against counter-evidence is the core flaw.
      *   **Non-Negotiable Aspect:** Systematic insulation of core claims from disconfirmation by the established evidentiary record.

  5.  **Handling of Sources & Provenance:**
      *   **Desideratum:** Must evaluate the theory's reliance on evidence with **verifiable provenance** and its adherence to **standard source criticism**. Pseudohistory often relies on: **Phantom Evidence** (cited sources that don't exist or are misrepresented); **Recycled/Debunked Evidence** (persistent use of long-discredited sources like the Donation of Constantine or Ipuwer Papyrus misinterpretations); or **Ignoring Provenance** (treating artifacts/texts without known context as decisive).
      *   **Motivating Case:** **Menzies:** Relied heavily on misreading maps, misidentifying artifacts, and citing non-existent Chinese records. **Many Atlantis Theories:** Rely on misinterpreting Plato, ignoring his stated context as allegory, or citing "lost texts."
      *   **Non-Negotiable:** Foundation of history is critical analysis of sources. Disregarding provenance and source criticism invalidates the work.

  6.  **Independence of Corroborating Sources/Lines of Evidence:**
      *   **Desideratum:** Must assess whether the core claims rely on **a single, potentially flawed/ambiguous source or methodology**, or if they can be supported by **multiple independent lines of evidence** (archaeology, textual analysis, linguistics, genetics, climatology, etc.) converging independently.
      *   **Motivating Case:** **Solutrean Hypothesis (Weakness):** Primarily relied on lithic similarities, lacking strong corroboration from genetics, linguistics, or unambiguous Clovis-Solutrean transitional sites. **Younger Dryas Impact (Strength/Controversy):** Draws on evidence from ice cores, sediment layers, geochemistry, and potential cultural layers across continents – multiple independent lines (though interpretation is debated).
      *   **Non-Negotiable Core:** Over-reliance on single, uncorroborated sources/methods is a major red flag. Convergence is key to robust historical claims.

  7.  **Rejection of Conspiracy-Shaped Reasoning:**
      *   **Desideratum:** Must identify the use of **"Conspiracy Necessity"** – the argument that the *only* reason the theory isn't accepted is due to a deliberate conspiracy by academics/institutions to suppress the truth. This functions as both an immunization strategy and a substitute for engaging with methodological criticism.
      *   **Motivating Case:** **Fomenko/Menzies/Ancient Aliens/Velikovsky:** All routinely employ this trope. Mainstream scholarship is portrayed as a closed shop deliberately hiding the "real" history.
      *   **Non-Negotiable:** This reasoning is inherently anti-intellectual and negates the possibility of legitimate methodological critique. It's a hallmark of pseudohistory.

  **Addressing Your Specific Queries:**

  *   **Non-Negotiables vs. Prejudices:**
      *   **Non-Negotiable:** Distinguishing bad history from not-history (1), Methodological integrity as the basis for minority/fringe status (2), Core reliance on fabrication/distortion vs. revision (3), Responsiveness to evidence (4 - the historical analog of falsifiability), Adherence to source criticism/provenance (5), Rejection of conspiracy necessity (7).
      *   **Potentially Prejudicial (Needs Nuance):** *Overly rigid* demands for "multiple independent lines of evidence" (6) applied to *all* claims. Some valid historical arguments might initially rely on a single strong source/text before corroboration emerges. The *tendency* towards single-source reliance is a red flag, but shouldn't be an absolute disqualifier for *all* heterodox ideas instantly. Similarly, dismissing *any* challenge to academic consensus as inherently pseudohistorical smuggles in a conservative bias. The *methods* of the challenge are key.

  *   **Joint Unsatisfiability & The Need for a Fourth Category?**
      *   **The Core Tension:** The most significant tension lies between the desire for clear demarcation and the **dynamic nature of historical knowledge**. Cases like Continental Drift (science) or the Younger Dryas Impact (history-adjacent) show that ideas starting far outside consensus can, through new evidence and methodological rigor, become mainstream or seriously debated. A rigid criterion applied historically would have mislabeled these.
      *   **Is it Unsatisfiable?** Not entirely, but it necessitates **temporal context** and a **category for "Emerging/Contested/Highly Speculative"**.
      *   **Solution:** Your core criteria (1-7) should identify *current* pseudohistory. However, for theories that:
          1.  Challenge consensus *but* use fundamentally sound methods (even if controversial),
          2.  Are based on new, genuine evidence undergoing scrutiny,
          3.  Lack multiple corroborating lines *yet* but don't rely on fabrication/immunization,
          ...you likely need a **fourth category: "Highly Speculative," "Emerging," or "Contentiously Heterodox."** This avoids prematurely branding potential future revisionism as pseudohistory while still distinguishing it from the mainstream. The Younger Dryas Impact sat here for a while; some aspects of early Solutrean hypothesis discussions arguably did too. This category requires **active monitoring** – does it gain traction/evidence, or does it devolve into pseudohistorical tactics?

  *   **History-Specific vs. Borrowed Philosophy of Science:**
      *   **Borrowing Core Principles:** The *general* problems of demarcation (evidence responsiveness vs. immunization, handling of anomalies, theory-ladenness of observation) are shared. Concepts like unfalsifiability (recast as evidence immunization) and consilience (independent lines of evidence) are crucial.
      *   **Crucial History-Specific Adaptations:**
          *   **Sources over Experiments:** The focus *must* shift from experimental falsification to **source criticism, provenance, hermeneutics, and the critical evaluation of evidence within its context**. This is the historian's lab.
          *   **Narrative Construction:** History inherently involves constructing narratives from fragmentary evidence. Pseudohistory often imposes **pre-determined, often grand/nationalist/mystical narratives** that violently force the evidence to fit, disregarding context and ambiguity central to historical understanding.
          *   **Role of Consensus:** While scientific consensus is based on reproducibility and predictive power, historical consensus is based on **shared methodological standards applied to the evidence**. Challenging consensus *methodologically* is different than rejecting the standards themselves.
      *   **Verdict:** The criterion **must be history-specific**, grounded in the **epistemology and methodology of the historical discipline**. While philosophical principles inform it, directly importing Popperian falsification (without the adaptation to evidence responsiveness) or focusing solely on predictive power is inadequate and misleading. Your friend is wrong; the *tools and objects* of investigation are fundamentally different.

  **In Summary: Your Tagging Spec Should Focus On:**

  1.  **Methodological Foundation:** Does the work engage with evidence using standard historical methods (source criticism, context, provenance)? (Non-Negotiable)
  2.  **Evidence Integrity:** Does it rely on phantom, recycled/debunked, or systematically distorted evidence? (Non-Negotiable)
  3.  **Evidence Engagement:** Does it insulate its core claims from counter-evidence via dismissal, forced reinterpretation, or conspiracy claims? (Non-Negotiable)
  4.  **Narrative vs. Evidence:** Is the narrative imposed on the evidence, or does it emerge from a critical engagement with it?
  5.  **Corroboration:** Is there convergence from multiple independent lines of evidence? (Red Flag if absent, but not *always* absolute pseudohistory for new claims).
  6.  **Conspiracy Necessity:** Is rejection of the theory primarily blamed on an academic conspiracy? (Non-Negotiable Pseudohistory marker).
  7.  **Temporal Context:** Consider a fourth category ("Emerging/Contentiously Heterodox") for methodologically sound but highly speculative challenges to consensus undergoing active debate, to avoid premature pseudohistory labels stifling potential revisionism.

  This framework prioritizes *how* history is done over *what* is claimed, protects legitimate heterodoxy, and provides clear red flags for pseudohistory, while acknowledging the dynamic nature of historical understanding. Good luck with the wiki!
