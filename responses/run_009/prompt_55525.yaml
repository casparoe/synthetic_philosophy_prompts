  Okay, let me unpack this user's query. They've spent two years in a reading group debating evolutionary psychology, and the same arguments keep resurfacing without resolution. They observe that both sides agree on methodological platitudes—testable predictions, acknowledging byproducts, avoiding post-hoc storytelling—yet disputes over specific topics like cheater-detection modules persist. The user suggests the core conflict might be about default priors: unspoken assumptions about how often psychological traits are adaptations versus byproducts. They want to know if this diagnosis is correct or if other factors (e.g., varying standards for "prediction," turf wars, political commitments) are at play. They also ask what would constitute progress in this deadlock.

  First, I need to verify the user's hypothesis about priors. From what I know, evolutionary psychology debates often hinge on foundational assumptions. Adaptationists might assume traits are likely adaptations unless proven otherwise, while critics might default to skepticism. These priors aren't easily testable, which aligns with the user's observation. But I should also consider other dimensions. For instance, "prediction" could mean different things: adaptationists might accept narrow predictions from existing theories, while critics demand broader, falsifiable ones. Disciplinary differences might play a role too—psychologists versus biologists with distinct approaches. Political commitments could subtly influence interpretations, though parties rarely admit this.

  Looking at what the parties actually claim helps clarify. Adaptationists point to empirical successes like mating preferences studies, arguing their methods yield testable results. Critics counter that these findings are post-hoc or culturally constrained. Both sides cite evidence but interpret it through their prior beliefs. The user mentions that neither side concedes, suggesting deep-seated divides beyond methodology.

  The user also asks about progress. If priors are the issue, then recognizing them as non-empirical assumptions might help. But would that resolve anything? Methodological innovations like better comparative analyses could provide more evidence, but each side might still weigh it differently. Establishing shared thresholds for evidence seems tough when priors differ. Maybe progress is acknowledging the role of reasonable priors and shifting focus to their implications rather than attacking motives.

  The user's deep need seems to be understanding why these debates are intractable and seeking a way forward. They might feel frustrated by circular arguments and want clarity on whether resolution is possible. Their identity as someone engaged in prolonged academic debate suggests they value rigorous analysis but are weary of stagnation. Unspoken needs could include a desire for more productive discourse or tools to bridge divides in their reading group.

  I should validate their insight about priors while exploring other factors. Emphasizing that multiple layers—methodological, disciplinary, political—compound the conflict. Progress might involve explicit discussion of priors, methodological refinements for cross-cultural studies, or accepting that foundational assumptions differ. But it's crucial to note that while priors aren't testable, their influence on interpretations can be scrutinized, which is a scientific practice in itself.
answer: |-
  Your diagnosis of the "default priors" conflict is astute and captures a core, intractable element of these recurring debates. The surface agreement on methodology masks a deeper chasm in foundational assumptions about how evolution shapes minds. Let's break down the structure of the dispute using the parties' actual claims, explore other contributing factors, and assess prospects for progress:

  **The Core Conflict: Divergent Default Priors (Your Hypothesis Confirmed)**

  1.  **The Adaptationist Prior:** Proponents (e.g., Cosmides, Tooby, Buss) often operate with a prior favoring adaptation as the *default* or *null hypothesis* for complex, functional-seeming cognitive traits. They argue:
      *   Natural selection is the primary creative force in evolution.
      *   The human mind evolved in a specific ancestral environment (EEA).
      *   Complex, reliably developing, domain-specific cognitive mechanisms exhibiting functional design are *likely* adaptations forged by selection pressures in the EEA.
      *   *Implication:* The burden of proof leans towards demonstrating something is *not* an adaptation. Byproducts and constraints need specific positive arguments, not just being alternatives.

  2.  **The Skeptical/Critique Prior:** Critics (in the spirit of Gould & Lewontin, Richardson, Buller) operate with a prior significantly *lowering* the default probability that a specific complex cognitive trait is a direct adaptation. They emphasize:
      *   The prevalence of exaptation, spandrels, and developmental constraints.
      *   The immense difficulty of reconstructing the EEA with sufficient precision to generate truly specific adaptive hypotheses.
      *   The brain's plasticity and the likelihood of domain-general processes underlying many behaviors.
      *   The power of cultural evolution and learning to shape behavior rapidly, decoupling it from specific genetic adaptations.
      *   *Implication:* The burden of proof is high for *any* specific adaptationist claim. Proposing a trait is a byproduct or constrained by development/architecture is often seen as the simpler, more parsimonious starting point.

  **How This Plays Out in the Fights You Mention:**

  *   **Cheater-Detection Modules:** Adaptationists see the Wason selection task data as strong evidence for a specific, evolved cognitive adaptation. Skeptics see it as a performance difference explained by content familiarity, general reasoning biases, or learned social contracts, not a dedicated "module."
  *   **Mating Preferences:** Adaptationists interpret cross-cultural patterns (e.g., male preference for youth/fertility cues, female preference for status/resources) as evidence of evolved adaptations. Skeptics argue these patterns are culturally mediated, reflect broader social learning or economic realities, or are statistical artifacts with high variance.
  *   **Cross-Cultural Claims:** Adaptationists see universals (or patterned variations explainable by local ecology) as evidence of underlying adaptations. Skeptics see the *variation* and the influence of culture/social structure as evidence against strong, domain-specific modular adaptations and for greater flexibility/plasticity.

  **Contributing Factors Beyond Priors (They Deepen the Divide):**

  1.  **Divergent Standards for "Prediction" & Evidence:**
      *   **Adaptationists:** Often accept "predictions" derived *post hoc* from existing theory as valid tests if they are novel *empirical tests*. They value converging lines of evidence (self-report, behavior, physiology, cross-cultural patterns) even if each line has limitations. They argue their hypotheses *are* falsifiable (e.g., if a predicted universal pattern is absent).
      *   **Skeptics:** Demand *a priori*, risky predictions generated *before* data collection, seeing post-hoc fitting as Panglossian storytelling. They often demand higher standards of evidence: stronger universality, clearer evidence of domain-specificity dissociated from general learning, precise EEA evidence, or neurobiological localization. They argue many adaptationist claims are "just so stories" because they aren't falsified in practice, even if falsifiable in principle.
      *   *Result:* Each side dismisses the other's evidence as methodologically weak or irrelevant to the core claim.

  2.  **Disciplinary Turf Wars & Different Foci:**
      *   EP often sits at the intersection of psychology and biology. Hardcore adaptationists sometimes lean more towards a biological model of the mind as a collection of evolved, specialized organs. Skeptics often come from developmental psychology, cultural anthropology, or philosophy of biology, emphasizing plasticity, learning, development, and cultural transmission. Their core explanatory tools and models differ fundamentally.

  3.  **Smuggled-In Political Commitments:**
      *   This is often vehemently denied, but it's a significant undercurrent. Critics frequently suspect adaptationist hypotheses (especially regarding sex differences, social hierarchies, or aggression) of naturalizing and legitimizing existing social inequalities or reactionary politics. Adaptationists often suspect critics of being motivated by a "blank slate" ideology that denies human nature for political reasons, hindering scientific progress. This creates deep suspicion and bad faith interpretations of motives.

  **What Would Count as Progress?**

  True resolution where one side "wins" is unlikely. Progress would involve moving beyond stalemate and productive engagement despite the foundational divide:

  1.  **Explicit Acknowledgment of Default Priors:** This is crucial. Recognizing that the core disagreement is often about the *starting assumption* ("How likely *is* this trait to be an adaptation?") rather than the methodology *per se* would foster more honest debate. Parties could state their priors explicitly and argue *why* theirs is more reasonable (e.g., based on general principles of evolution, complexity, or developmental biology), rather than pretending the disagreement is purely about testability.
  2.  **Focus on Specificity and Novelty of Evidence:** Move beyond generic arguments about "predictions." Demand:
      *   **Truly Novel Predictions:** Where possible, encourage research programs designed *a priori* to test competing hypotheses (adaptation vs. byproduct vs. constraint) with novel, risky predictions.
      *   **Stronger Tests of Domain-Specificity:** Develop methodologies better suited to dissociate domain-specific adaptations from domain-general processes or learning (e.g., sophisticated cross-cultural comparisons accounting for deep history and contact, developmental studies, neuroimaging with tighter links to computational models).
      *   **Quantitative Models & Comparative Work:** Build more formal models of evolutionary processes generating predictions beyond verbal arguments. Integrate deeper comparative phylogenetics where feasible (though hard for uniquely human traits).
  3.  **Acceptance of Reasonable Disagreement on Priors:** Recognize that differing priors about the prevalence of adaptation in cognitive evolution are *philosophical* starting points informed by, but not definitively settled by, science. Progress means:
      *   Critiquing the *internal coherence* and *evidential support relative to the prior* of specific hypotheses, rather than just attacking the prior itself.
      *   Accepting that some debates are fundamentally about these differing starting points, and that's a legitimate part of scientific discourse about complex, historical processes.
      *   Focusing research efforts on areas where evidence *can* shift the needle significantly, even for those with different priors.
  4.  **De-Politicization (Aspirationally):** While difficult, striving to evaluate hypotheses based on their scientific merit and evidence, rather than assumed political implications, is essential. Separating the "is" from the "ought" is vital, though challenging when the "is" feels loaded.

  **Conclusion:**

  You are correct. The core, persistent engine of the dispute is the clash of **default priors** regarding the prevalence of direct adaptation versus byproduct/exaptation/constraint in shaping complex human cognition. While divergent standards of evidence ("prediction"), disciplinary perspectives, and political undercurrents significantly fuel the conflict and make communication difficult, they often stem from or are amplified by these foundational priors. Progress won't come from one side capitulating, but from **explicitly acknowledging the role of non-testable priors, developing more incisive methods to test specific hypotheses against alternatives *relative to stated priors*, and fostering a culture where reasonable disagreement on foundational assumptions is accepted as part of the scientific process for investigating deep history.** It's a debate *within* science, but one where the deepest roots are philosophical assumptions about the evolutionary process itself.
