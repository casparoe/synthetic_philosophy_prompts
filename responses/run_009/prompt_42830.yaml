prompt: |-
  I'm a high school junior working on my extended essay, and I've gotten myself stuck at the specification stage, so I want to outsource the specification to you. My topic comes from the chapter of Hofstadter's Gödel, Escher, Bach on the location of meaning, where he argues that a message is really three nested things: a frame message, which just announces that this is a message and invites decoding; an outer message, the implicit set of instructions for how to decode, which you must somehow understand before any decoding happens; and an inner message, the actual content. His running example is a vinyl record: the grooves don't contain music for an alien with no ear-like machinery, so meaning seems to live partly in the object and partly in the decoder, and the question is where the boundary falls. My supervisor says my essay needs a thesis, but before I can defend any view about where meaning lives, I want to know what a theory of the location of meaning has to accomplish in the first place. So: write me the desiderata.

  Requirements I'd want on the list, in whatever order you think is right: the record case above, where the theory has to say how much of the meaning is in the artifact and how much in the receiver, and what fixes the split; the bootstrap problem, since the outer message apparently has to be understood without being decoded, which makes any account that says understanding requires prior decoding look circular; the counterfactual-sender case, where a signal that looks like an artifact message turns out to be produced by a natural process, say a pulsar, and the theory has to say whether meaning requires any sender at all; and the divergent-decoder case, where two receivers run the same outer message and extract different inner contents, only one of which was intended.

  I'd also like you to add a puzzle of your own invention that a theory in this area should be able to handle — something like a message whose inner content is nothing but a description of the procedure you used to decode it, so that successfully reading it tells you only how you read it. You can invent the cases however you like, but each case should be one where it's genuinely unclear which side of the artifact/decoder line the meaning falls on, because that's the crux of my essay.

  For each desideratum, give the case or consideration behind it, and be explicit about which are non-negotiable and which are just what one camp happens to want (I suspect intention-based theorists and reader-response theorists will disagree about which cases are load-bearing, and I'd like you to mark which requirements are contested and why). The distinctions the theory must not collapse also matter to me: meaning versus truth, intended meaning versus extracted meaning, and being decodable versus being meaningful. And keep it consistent with the relevant results from information theory, in particular the fact that a signal's statistical structure doesn't fix its interpretation.

  The part I most want, because my supervisor asked for it directly: tell me whether any pair of the desiderata is jointly unsatisfiable, and if so, which pair, and what follows from the tension. After the requirements, briefly evaluate three candidates against your list — the view that meaning lives with the sender's intentions, the view that it lives entirely in the decoder's act of interpretation, and Hofstadter's own middle position that meaning is a kind of structural identification between message and receiver. Keep the scoring short; the list is what I need to think through myself, and I'll do the arguing in the essay. Prose is fine, no table necessary.
