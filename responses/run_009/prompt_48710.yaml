  First, I need to identify the core tension points through the mandated cases: long-term residents without voting rights show the governance-subjection gap; tourists represent transient subjection; children/cognitively disabled persons test autonomy thresholds; future generations highlight temporal disconnects; and externally affected persons reveal extraterritorial impact dilemmas.

  The key is to derive requirements from these concrete tensions rather than ideological preferences. For example:
  - The long-term resident case forces the Subjection Requirement (non-negotiable)
  - Tourist transience mandates the Duration Threshold (negotiable)
  - Children necessitate the Capacity Exception (non-negotiable)
  - Future people require the Temporal Scope (negotiable)
  - Externally affected persons create the hardest tension between Impact Recognition and Self-Determination

  I notice the user particularly wants exposed incompatibilities. The deepest conflict emerges between:
  1. Impact Recognition (those affected should have voice) 
  2. Self-Determination (demos must be able to act collectively)
  3. Institutional Feasibility (practical implementation matters)

  This triad creates a paradox: giving voice to all affected (e.g., global climate victims) makes collective action impossible, while strict self-determination ignores moral claims of outsiders. The tourist case further strains Subjection vs Duration criteria.

  When testing existing principles against these:
  - All-Affected violates Self-Determination/Feasibility
  - All-Subjected handles residents but fails on future/external parties
  - Demos-of-Demos avoids overreach but morally sidelines subjected non-members

  The structural underdetermination becomes clear when realizing no principle can satisfy Impact Recognition, Self-Determination and Feasibility simultaneously - hence the boundary problem's inherent insolubility. I'll highlight this as the critical insight the user seeks.
answer: |-
  Here are desiderata for any principled solution to the boundary problem, derived from the specified cases, with justifications, negotiability flags, and incompatibility warnings:

  ### Core Desiderata
  1. **Subjection Requirement**  
     *Must include those permanently governed by the regime’s coercive laws.*  
     **Case:** Long-term resident noncitizens (e.g., tax-paying immigrants barred from voting).  
     **Justification:** Exclusion violates reciprocity in political obligation.  
     **Status:** Non-negotiable.  

  2. **Impact Recognition**  
     *Must acknowledge significant, non-consensual impacts on those outside the formal demos.*  
     **Case:** Persons externally affected by emissions/sanctions (e.g., farmers ruined by a country’s trade policy).  
     **Justification:** Moral responsibility for imposed harm demands accountability.  
     **Status:** Non-negotiable (though implementation negotiable).  

  3. **Capacity Threshold**  
     *May exclude those unable to engage in minimally autonomous political agency.*  
     **Case:** Children/profound cognitive disabilities.  
     **Justification:** Practical necessity for functional deliberation.  
     **Status:** Negotiable (scope of "capacity" is contentious).  

  4. **Temporal Scope**  
     *Must address the interests of future generations.*  
     **Case:** Climate/constitutional decisions with long-term effects.  
     **Justification:** Intergenerational justice requires safeguarding future autonomy.  
     **Status:** Negotiable (mechanisms vary).  

  5. **Duration Threshold**  
     *May distinguish between transient and enduring subjection.*  
     **Case:** Tourists (subjected to laws temporarily).  
     **Justification:** Ephemeral stakes and practical unfeasibility of inclusion.  
     **Status:** Negotiable (duration criteria flexible).  

  6. **Self-Determination Feasibility**  
     *Must enable coherent collective will-formation.*  
     **Case:** All cases—without boundaries, decisions become impossible.  
     **Justification:** A demos incapable of action fails its purpose.  
     **Status:** Non-negotiable.  

  7. **Institutional Practicability**  
     *Must be administratively viable.*  
     **Case:** Tourists/external groups—global inclusion risks decision paralysis.  
     **Justification:** Unworkable solutions undermine legitimacy.  
     **Status:** Non-negotiable.  

  ---

  ### Incompatible Pair: Impact Recognition vs. Self-Determination Feasibility  
  - **Conflict:** Impact Recognition demands voice for *all* significantly affected (e.g., billions impacted by climate policy). Self-Determination requires a bounded group capable of deliberation/decision.  
  - **Why Irreconcilable?**  
    - Universal inclusion dissolves the demos into global humanity, making decisive action impossible (violating Feasibility).  
    - Restricting membership excludes morally relevant interests (violating Impact Recognition).  
    - **Structural Underdetermination:** The boundary problem has no solution satisfying both moral inclusion and functional collectivity.  

  ---

  ### How Existing Principles Fare Against the Desiderata  
  - **All-Affected Principle:**  
    - *Strengths:* Satisfies Impact Recognition and Temporal Scope.  
    - *Failures:* Violates Self-Determination Feasibility (over-inclusive) and Institutional Practicability (global demos is unworkable). Ignores Duration Threshold (includes tourists).  

  - **All-Subjected Principle:**  
    - *Strengths:* Meets Subjection Requirement and Self-Determination (via territorial boundedness). Accepts Capacity Threshold.  
    - *Failures:* Fails Impact Recognition (ignores extraterritorial effects) and Temporal Scope (excludes future people).  

  - **Demos-of-the-Demos (Pre-existing People):**  
    - *Strengths:* Ensures Self-Determination Feasibility and Institutional Practicability.  
    - *Failures:* Violates Subjection Requirement (excludes long-term residents) and Impact Recognition. Treats historical boundaries as morally arbitrary.  

  ---

  ### Summary of Structural Gaps  
  The incompatibility between **Impact Recognition** (moral expansiveness) and **Self-Determination Feasibility** (practical boundedness) confirms the boundary problem is underdetermined: no theory can jointly satisfy all desiderata. Any solution must prioritize certain values (e.g., functional democracy vs. moral inclusion) at the expense of others, revealing an irreducible tension at democracy’s core.
