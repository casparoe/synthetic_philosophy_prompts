prompt: |-
  I teach an intro ethics course, and for the unit on the ethics of procreation I've been trying to figure out what I actually believe by listing cases and writing down my gut verdicts, like a good reflective-equilibrium person. Here's what I've got so far. A couple who could easily have a child who'd have a wonderful life but just don't want kids: nothing wrong there, not even a little. A couple who conceive knowing (say from genetic testing) that the child will have a life of unremitting misery: clearly wrong, and wrong *to the child* somehow, even though the alternative was no child at all, and you can't wrong someone by not creating them. A couple who conceive now rather than waiting two years until they'd be more financially stable, so the child (a numerically different child, since the timing matters) has a merely fine life instead of a great one: I say not wrong, and nobody was wronged. A couple who conceive when there's a 30% chance the child will have a condition that makes life barely worth living, and 70% chance of a good life: this feels wrong to me, like gambling with someone else's welfare, though if the gamble comes out bad and the grown child says their life is worth living, I can't say who was wronged, which bugs me. A couple who conceive in poverty knowing the child's life will be good but much worse than if they'd waited: not wrong. A donor who declines to donate eggs that would produce a happy child: obviously not wrong, there's no obligation to create happy people.

  So there's this asymmetry I keep feeling — that it's bad to create miserable people but not bad to fail to create happy ones — and I want to know if there's a principle that captures all of it. My utilitarian friend says the whole thing collapses if I just count up total wellbeing, but I think that view implies we're obligated to crank out as many kids as resources allow, which I absolutely reject, so total utilitarianism is out as an explanation of my own verdicts. And I also have a pair of verdicts that look hard to square: I'm fine with a couple having a child whose life will predictably be just barely above neutral (chronic low-grade unhappiness, but the person ends up genuinely glad to be alive), yet I judge the 30%-chance-of-bad-life couple harshly. A certain mediocre life is okay but a gamble with a good expected value... wait, actually I'm not even sure the gamble has a good expected value, anyway, the certain mediocre one is fine and the risky one isn't, and I can't currently say why without being embarrassed. Also, somewhat at the margin: I feel a real difference between the misery case (clearly wrong) and a case where the child's life is predictably a bit *below* neutral — mild chronic suffering, never quite glad to be alive — where I waffle between "wrong" and "shabby but not wrong."

  You're a professional ethicist who works on population ethics, so please think carefully and maybe brainstorm a few candidate principles before settling. Lead with your bottom line in the very first sentence — the single principle (or small set of principles, if that's really what it takes) that best captures my verdicts — and then walk through the reasoning with no preamble and no restating of my question. I want you to state each clause precisely, tie it to the case that motivates it, tell me its verdict on a couple of cases I haven't listed (say, a case where delaying conception would prevent a definite short-but-decent life in favor of a longer better one, and a case involving a "right to be born once conception has occurred"), and be honest about which of my verdicts your principle can't accommodate — especially whether I have to give up either the barely-above-neutral verdict or the 30%-gamble verdict, because I suspect I do.
reasoning: |-
  Okay, the user teaches intro ethics and is working through their intuitions about the ethics of procreation. They've listed several cases and their gut reactions, showing a clear asymmetry: creating miserable lives is wrong, but not creating happy ones isn't. They reject total utilitarianism because it would require having as many children as possible, which they disagree with. They're struggling to reconcile their judgments on two specific cases: being okay with a child who has a mediocre life but judging harshly a couple who takes a 30% risk of a bad life. They also mention uncertainty about cases where life is slightly below neutral.

  First, I need to identify the core principles that align with their intuitions. The key points are the asymmetry, the rejection of total utilitarianism, and the distinction between certain mediocre lives versus risky conceptions. The principle must explain why creating suffering is wrong but not creating happiness isn't obligatory. 

  The user's cases suggest a person-affecting view with a harm-based threshold. The harm principle comes to mind: creating a life that is harmed (life not worth living) is wrong, but not creating a benefit (happy life) isn't wrong. But the mediocre life case is tricky because it's above neutral, so creating it isn't wrong, even if it's not great. The risk case involves potential harm, so that's why it's wrong—gambling with someone's welfare when there's a significant chance of harm.

  I recall Parfit's Non-Identity Problem. The couple who conceive later would have a different child, so the child born earlier can't claim harm because their life is still worth living. That explains why timing or conditions that lead to a different child don't wrong the actual child. But the user also needs to address the risk scenario. A threshold deontology approach might work, where crossing a harm threshold is prohibited, but suboptimal choices aren't necessarily wrong.

  The 30% gamble case is judged harshly because there's a substantial risk of creating a harmed individual. Even if the expected utility is positive, the potential harm is significant. That aligns with a risk-averse principle. The user's waffling on mild suffering below neutral might be because it's close to the threshold, making it ambiguous.

  I should propose a two-part principle: a harm principle and a risk principle. The harm principle states that causing a life with negative well-being is wrong. The risk principle adds that imposing significant risk of harm is also wrong. This captures the misery case, the gamble case, and explains why creating mediocre lives isn't wrong. Not creating happy lives isn't covered because there's no harm.

  For unlisted cases: Delaying conception to have a better child isn't wrong because the first child isn't harmed. Regarding a "right to be born" after conception, the principles don't grant such a right unless not being born would harm the child, which it doesn't since non-existence isn't harmful. So termination might be permissible if the life would be below the threshold.

  The user's conflict between mediocre life and gamble: they might need to accept that the gamble is wrong due to risk, even if the mediocre life is acceptable. Their intuition here seems consistent with risk aversion. The mild suffering case might require refining the harm threshold. They might need to define "barely worth living" more clearly or accept that near-threshold cases are morally ambiguous.

  In summary, the principles are Harm Avoidance and Risk of Harm. They cover most cases but require accepting that risk imposition is wrong even when the expected value is positive. The user might need to adjust their view on mild suffering cases, possibly setting a clearer threshold.
answer: |-
  **Bottom line:** Your verdicts are best captured by a **Harm-Based Asymmetry Principle** with a **Risk of Harm Proviso**: It is *prima facie* morally wrong to create a person who will experience a life *not worth living* (a harmed existence), or to impose a *significant risk* of such a life, but it is *never* morally wrong to refrain from creating a person who *would* have had a life worth living (a benefited existence). No one is wronged by non-existence.

  **The Principles Explained:**

  1.  **The Harm Principle:** Creating a person whose life is *not worth living* (net negative wellbeing, below the "worth living" threshold) is wrong *to that person*. This explains:
      *   **The Misery Case:** Creating a child with a life of "unremitting misery" (clearly below threshold) is wrong to the child. The child *is* harmed by being brought into existence compared to the alternative of non-existence, where harm is impossible. The wrong is *being caused to exist in a harmed state*.
      *   **The Barely-Above-Neutral Case:** Creating a child with a life "barely above neutral" (chronic low-grade unhappiness but genuinely glad to be alive) is *not* wrong. Their life, while mediocre, is *above* the "not worth living" threshold. They are not harmed by existing.
      *   **The Below-Neutral Waffle:** Your uncertainty about "mild chronic suffering, never quite glad to be alive" stems from the difficulty in precisely locating the threshold. If it's genuinely *below* the "worth living" line, the Harm Principle says it's wrong. If it's precariously *on* or *barely above* it, it might not be wrong, or the wrongness might be less clear-cut (explaining your waffle). The principle clarifies the core issue: crossing the threshold into net negativity constitutes harm and wrongs the created person.

  2.  **The Asymmetry Clause:** There is *no* symmetrical obligation to create people who would have lives worth living. Failing to create a happy person does *not* wrong anyone. This explains:
      *   **The Don't-Want-Kids Case:** No wrong done. No one exists who is deprived of a benefit by not being created.
      *   **The Donor Case:** No obligation to donate eggs to create a happy child. No potential person is wronged by not being created.
      *   **The Poverty Timing Case (Life Good but Worse):** Not wrong. The child created has a life worth living, even if suboptimal. They are not harmed relative to non-existence. The alternative child who would have had a better life if conception was delayed has no claim to be created.

  3.  **The Risk of Harm Proviso:** Imposing a *significant risk* of creating a person with a life *not worth living* is *prima facie* wrong. This explains:
      *   **The 30% Gamble Case:** A 30% risk of creating a life "barely worth living" (which you define as involving a "condition that makes life barely worth living") constitutes a *significant risk* of creating a harmed person (if "barely worth living" is interpreted as precariously *at* the threshold or *below* it in bad outcomes). This feels like gambling with someone else's fundamental welfare. The wrong lies in imposing that substantial risk of *harming* a future person, even if the gamble pays off and the actual person isn't harmed (or is only minimally benefited). The potential victim of the gamble is the person who *would* be created into a harmed state.

  **Applying Principles to Your Cases & Unlisted Cases:**

  *   **Certain Mediocre Life (Fine):** Covered by **Harm Principle** + **Asymmetry**. Life is above threshold. No one harmed. No obligation to create a *better* life instead.
  *   **30% Gamble (Wrong):** Covered by **Risk of Harm Proviso**. Significant risk of creating a harmed person below the threshold.
  *   **Delay for Better Life (Not Wrong):** The child born earlier has a life worth living (fine, even if not great). They are not harmed relative to non-existence. The alternative child with the better life has no claim to be created. (**Harm Principle** + **Asymmetry**).
  *   **"Right to be Born" Post-Conception:** This principle grants *no* inherent "right to be born." If prenatal testing reveals the fetus will have a life *not worth living* (below threshold), termination is permissible (even obligatory, per Harm Principle) to prevent harm. If the fetus will have a life worth living, termination might be permissible for other reasons (e.g., bodily autonomy), but *not* because the future person is harmed by non-existence (**Asymmetry**). The principle focuses on preventing the creation of *harmed* lives, not mandating the creation of *benefited* ones.
  *   **Delay Preventing Short-but-Decent Life for Longer-Better Life:** Not wrong. The child with the short-but-decent life has a life worth living; they are not harmed by existing. Creating them does not wrong them. Choosing not to create them (by delaying) in favor of creating a different child with a longer, better life also does not wrong the first potential child, as they have no claim to be created. (**Harm Principle** + **Asymmetry**).

  **Where Your Verdicts and the Principle Might Diverge (Honest Assessment):**

  1.  **Your Conflict (Certain Mediocre vs. Risky):** You *can* keep both verdicts with this principle. The **Risk of Harm Proviso** explains your harsh judgment of the 30% gamble (significant risk of harm). The **Harm Principle** explains your acceptance of the certain mediocre life (above threshold, no harm). The key is interpreting "barely worth living" in the gamble case as implying a *risk* of falling *below* the threshold into a harmed state. Your intuition that the gamble is wrong *even if the expected value is positive* is captured by the focus on *risk of harm*, not aggregate utility.
  2.  **The Threshold Precision:** Your "waffle" on the mild chronic suffering, never-glad-to-be-alive case highlights the principle's dependence on locating the "not worth living" threshold. The principle *requires* making this distinction, even if it's empirically and conceptually fuzzy at the margins. You might need to refine your view on where exactly that line falls to resolve the waffle consistently with the Harm Principle.
  3.  **The "Shabby but Not Wrong" Intuition:** For lives *just above* the threshold (your "barely above neutral"), the principle clearly says "not wrong" (Harm Principle). If you feel a lingering sense of "shabbiness" for creating such a life, that might reflect a separate evaluative judgment about *suboptimal* creation (creating a life that could have been much better) or parental responsibility, which isn't captured by the core harm/risk asymmetry. The principle focuses on the *wrong done to the created person*, not on broader ideals of beneficence or optimal parenting. You might need to accept that creating a mediocre life isn't *wrongful* to the child, even if it falls short of an ideal.

  **Conclusion:** Your core intuitions reflect a powerful person-affecting asymmetry centered on the **avoidance of harm** (creating lives below a welfare threshold) and **avoiding significant risks of such harm**, while **rejecting obligations** based on the potential benefits of creating happy lives. The **Harm-Based Asymmetry Principle with a Risk of Harm Proviso** systematizes this, accommodating your key verdicts on misery, non-procreation, mediocre lives, and risky conception. The primary tension it highlights is the need to define the "not worth living" threshold, particularly for marginal cases, and potentially accepting that creating a mediocre but above-threshold life isn't wrongful *to the child*, even if suboptimal.
