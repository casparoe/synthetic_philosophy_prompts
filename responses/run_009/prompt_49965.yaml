     This is useful when you have a sense of the probability that the evidence is true (r) and you can estimate what you would believe if the evidence were true and if it were false.

  2. **Bayesian update on the event that the source made a specific claim (said H):**
          P_new(H) = [P(claim|H) * P(H)] / [P(claim|H)*P(H) + P(claim|~H)*P(~H)]
     This is useful when you know the source's true positive rate (P(claim|H)) and false positive rate (P(claim|~H)). Often, if you only know the overall accuracy (r), you might assume:
          P(claim|H) = r   [if the source always claims H when H is true and they are being accurate? but note: when accurate, they would claim H when H is true. But they might not claim anything sometimes. This model assumes the source always claims H when H is true and claims not H when H is false? Not necessarily.]

     Alternatively, if the source always makes a claim (either H or not H) and we define accuracy as the frequency of correct claims, then we can set:
          P(claim=H | H) = r   [but wait, no: r is the overall accuracy, which includes both when they say H and when they say not H]

     A better approach: if the source has a fixed behavior, we need the true positive rate (sensitivity) and false positive rate. Without that, we fall back to the Jeffrey update.

  Given the complexity, for simplicity in the 10-minute window:

  - If the evidence is about the truth of H and the source's claim is directly about H, and you have a reliability rate (r) for the source being correct in their claims, then use the Bayesian update for the claim:

          P_new(H) = [r * prior] / [r * prior + (1-r) * (1-prior)]

     BUT only if you assume that the source's errors are symmetric (false positive rate = 1 - r). If you have reason to believe the source is more likely to miss a true event than to falsely report a false event, then you need to adjust.

  - If the evidence is not a direct claim about H (like a blurry screenshot that might be fake), then use the Jeffrey update.

  **The Uncomfortable Update:**

  Let's say you have a prior of 10% for an event. You get a leak from a source that is usually reliable (say 80%). But note: the event is rare (10%). Using the Bayesian update for a direct claim:

          P_new(H) = (0.8 * 0.1) / [0.8*0.1 + (1-0.8)*(1-0.1)]
                    = 0.08 / [0.08 + 0.2*0.9]
                    = 0.08 / [0.08+0.18] = 0.08/0.26 ≈ 0.3077

  So you update from 10% to about 31%. Not to 80%! This might be the "move by four points, not forty" moment.

  The procedure cannot settle the exact reliability rates (you have to estimate them) and the exact meaning of the evidence (you have to define E and the conditionals). The gut is needed to assess the reliability and the conditionals.

  Final Procedure:

  1. Define H.
  2. State prior P(H).
  3. Define the evidence E (what is the specific tip?).
  4. If the existence of the tip (before content) is informative, update the prior to P(H|T) using:
          P(H|T) = [P(T|H)*P(H)] / [P(T|H)*P(H) + P(T|~H)*P(~H)]
     and set your new prior to this.
  5. If the evidence is a direct claim about H from a source with known reliability r (the probability they are correct in general), and if you assume symmetric errors, then do:
          P_new(H) = [r * prior] / [r * prior + (1-r) * (1-prior)]
     and stop.
  6. Otherwise, for other types of evidence (like a screenshot of unknown authenticity):
     a. Assess r = P(E) (how likely is E to be true?).
     b. Assess P(H|E): your belief in H if E is certainly true.
     c. Assess P(H|~E): your belief in H if E is certainly false (often set to the prior).
     d. Compute: P_new(H) = P(H|E)*r + P(H|~E)*(1-r).
  7. Do a sanity check: if the update is very large, consider whether your inputs are realistic.

  Remember: every number you assign (r, P(H|E), P(H|~E), P(T|H), etc.) is a judgment call. The math is just a way to combine them consistently.
answer: |-
  Here's a step-by-step procedure designed for quick, practical use under time constraints. It balances Bayesian reasoning with your real-world constraints, highlighting judgment calls. Keep your calibration spreadsheet open for complex cases, but aim for mental math when possible.

  ---

  ### **10-Minute Procedure: Updating on Uncertain "Tips"**
  **Core Idea:** Replace "E is true" with "P(E) = r" (your assessed reliability of the tip), then blend "what if E is true?" and "what if E is false?" weighted by r.

  #### **Questions to Ask Yourself (In Order):**
  1. **What's the hypothesis (H)?**  
     *Example: "Product launch delayed by Q3."*  
     *Judgment call: Define H narrowly. "Delayed" vs. "delayed by Q3" matters.*

  2. **What's my current P(H)?**  
     *Start with your prior. If you track calibration, use your latest estimate.*

  3. **What exactly is the tip claiming?**  
     *Define the evidence (E) clearly. Example: "Screenshot shows delay" or "Friend says 'delayed'."*  
     *Judgment call: Separate E (the tip's content) from H (the reality).*

  4. **How reliable is this tip? (Set r = P(E))**  
     *Rules of thumb for r (P(E) = probability E is true):*  
     - "Usually right" (3/4 past claims correct): **r ≈ 0.75**  
     - "Coin flip" (no idea if real/fake): **r = 0.5**  
     - "Often wrong but not always" (1/3 right): **r ≈ 0.33**  
     - *Adjust for context:*  
       - Primary sources (employee) > anonymous leakers.  
       - Recent track record > old history.  
       - Corroboration? If two independent sources agree, boost r by 0.1–0.2.  
     *Judgment call: r is fuzzy. Use ranges (e.g., 0.6–0.8) if uncertain.*

  5. **Does the tip's EXISTENCE (not content) hint at H?**  
     *Ask: "If H were true, would this tip be more likely? If H were false?"*  
     - *If YES (e.g., "cancelled products leak more"):*  
        - Estimate: P(tip exists | H) and P(tip exists | ¬H).  
          *Example: If leaks happen 80% of the time when delayed (H) but only 20% when on time (¬H), and your prior P(H)=0.35:*  
          - **New prior = [0.8 × 0.35] / [(0.8 × 0.35) + (0.2 × 0.65)] ≈ 0.68**  
          - *Use this as your updated prior before Step 6.*  
     - *If NO (e.g., "leaks happen randomly"): Skip to Step 6.*  
     *Judgment call: This step is often skipped for speed. Only do it if the behavior link feels strong.*

  6. **What would I believe if E were CERTAINLY true? (Set P(H|E))**  
     *Example: If the screenshot is genuine, how likely is H?*  
     - *If E directly proves H (e.g., "friend says delayed" and they're truthful):* **P(H|E) = 1**  
     - *If E is indirect (e.g., "screenshot shows delay" but could be outdated):* **P(H|E) = 0.7–0.9**  
     *Judgment call: Don't assume P(H|E)=1. Could E be true but H false?*

  7. **What would I believe if E were CERTAINLY false? (Set P(H|¬E))**  
     *Often:* **P(H|¬E) ≈ prior from Step 2 (or 5)**.  
     *Example: If the screenshot is fake, you're back to square one.*  
     - *Exception: If E being false implies bad news (e.g., "friend lied, so they're hiding something"): Adjust down to 0.6–0.8 × prior.*

  8. **Calculate the update:**  
     **New P(H) = [P(H|E) × r] + [P(H|¬E) × (1 - r)]**  
     - *Spreadsheet vs. mental math:*  
       - **Mental math:** Round numbers (e.g., r=0.75 → 3/4) and approximate.  
       - **Spreadsheet:** Use if r or P(H|E) is messy (e.g., 0.63) or the update feels critical.

  9. **Sanity check:**  
     - *Ask: "Does this move make sense? Did I overweight excitement?"*  
     - *Red flag:* If new P(H) > r when P(H|E)=1, you made an error.  
     - *Bounds:* New P(H) can't exceed P(H|E) or be below P(H|¬E).

  ---

  ### **Worked Examples**
  #### **Case 1: The 50/50 Screenshot**
  - **H:** Product launch delayed by Q3.  
  - **Prior P(H):** 35% (0.35) from your forecast.  
  - **E:** "Blurry screenshot is genuine proof of delay."  
  - **Existence informative?** Yes—you suspect delays cause more leaks.  
    - P(tip exists | H) = 80% (delayed products leak often).  
    - P(tip exists | ¬H) = 20% (on-time products leak rarely).  
    - **New prior = [0.8 × 0.35] / [(0.8 × 0.35) + (0.2 × 0.65)] = 0.28 / 0.41 ≈ 68%**.  
  - **r = P(E):** 50% (0.5) — coin flip on genuine.  
  - **P(H|E):** 85% (0.85) — *if real, it's strong evidence but not 100% proof (could be old/misleading)*.  
  - **P(H|¬E):** 68% — *if fake, you still had a leak (which you updated for existence), so revert to new prior*.  
  - **Update:**  
    New P(H) = (0.85 × 0.5) + (0.68 × 0.5) = 0.425 + 0.34 = **76.5%**  
  - **Sanity check:** Moves from 68% → 76.5%. Not a slam dunk (r=0.5 dominates).  
  - **Blunt truth:** "This moves your forecast by 8.5 points—not 50. The screenshot is too ambiguous."

  #### **Case 2: The Usually Reliable Friend**
  - **H:** Product launch delayed by Q3.  
  - **Prior P(H):** 35% (0.35).  
  - **E:** "Friend says 'delayed'."  
  - **Existence informative?** No (assume friend shares news randomly).  
  - **r = P(E):** 75% (0.75) — right 3/4 times historically.  
  - **P(H|E):** 95% (0.95) — *if friend is truthful, H is almost certain (but leave 5% for miscommunication)*.  
  - **P(H|¬E):** 35% (0.35) — *if friend is wrong, no update (prior stands)*.  
  - **Update:**  
    New P(H) = (0.95 × 0.75) + (0.35 × 0.25) = 0.7125 + 0.0875 ≈ **80%**  
  - **Alternative (if using Bayesian claim-update):**  
    - If you define reliability as accuracy *when making claims*, use:  
      **New P(H) = [r × prior] / [r × prior + (1 - r) × (1 - prior)]**  
      = (0.75 × 0.35) / [(0.75 × 0.35) + (0.25 × 0.65)] = 0.2625 / 0.425 ≈ **62%**  
    - *Why the difference?* This accounts for base rates (low prior = less trust in positive claims).  
  - **Sanity check:**  
    - Jeffrey (80%) overweights if prior is low. Bayesian (62%) is more conservative.  
    - **Compromise:** Split the difference? Use Jeffrey if source is trusted (friend), Bayesian for anonymods. Here: **~70%**.  
  - **Blunt truth:** "Don't jump to 85%. With a 35% prior, even a reliable friend only gets you to 60–80%."

  ---

  ### **When the Procedure Forces an Answer You Won't Like**  
  **Scenario:** You have a 10% prior (H = "Startup acquires Competitor X"). A usually reliable leaker (r=0.8) claims "deal happening."  

  - **Jeffrey update (naive):**  
    P(H|E) = 1 (leaker is perfect if truthful), P(H|¬E) = 0.1 (prior).  
    New P(H) = (1 × 0.8) + (0.1 × 0.2) = **82%**  

  - **Bayesian claim-update (better):**  
    New P(H) = [0.8 × 0.1] / [(0.8 × 0.1) + (0.2 × 0.9)] = 0.08 / 0.26 ≈ **31%**  

  **Why you won't like it:** The Bayesian version says **only move from 10% → 31%**, not 82%. Low priors dominate.  
  **Blunt truth:** "Excitement bias alert. A rare event needs extraordinary evidence. This leaker isn't enough."  
  **Gut check needed:** Is the leaker's accuracy (80%) based on rare events? If yes, trust Bayesian. If they specialize in acquisitions, maybe boost to 50%.

  ---

  ### **What the Procedure Can't Settle (Requires Gut)**  
  1. **Setting r (reliability):** No math tells you if a source is "usually right." Use:  
     - Track record > intuition.  
     - If no data, ask: "Would I bet $100 on this tip at 2:1 odds?" If yes, r≥0.67.  
  2. **P(H|E) and P(H|¬E):** These rely on your model of the world.  
  3. **Existence-informativeness:** Deciding if a leak's existence correlates with H is subjective.  
  4. **Correlated evidence:** Multiple tips? Don't average—update sequentially.  

  **Final Advice:**  
  - Use **spreadsheets** for high-stakes forecasts with messy numbers.  
  - Use **mental math** when:  
    - r is 0.25, 0.5, 0.75, or 0.9.  
    - P(H|E) and P(H|¬E) are round (e.g., 1.0 and 0.3).  
  - **Calibrate your r guesses:** After an event, record if E was true. Adjust future r's.  

  This system prevents over-updating (like your friend's 35%→85% mistake) by forcing you to quantify uncertainty. Practice on past forecasts to build intuition.
