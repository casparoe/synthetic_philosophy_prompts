  3. **Identify the Evidence (E):** What is the specific piece of evidence you are considering? (e.g., "My friend said the product is delayed", or "There is a leaked screenshot".)

  4. **Assess the Reliability of the Evidence (r):** How likely is E to be true? This is P(E). We'll call this r. You have to assign this number. Rules of thumb:
     - If the source is "usually right", but you don't have exact numbers, think about the last few times they made similar claims. For example, if they've been right 3 out of the last 4 times, then r = 0.75. If you have no history, use a rough scale:
          - "Almost certainly true": 0.95 to 0.99
          - "Likely true": 0.7 to 0.9
          - "Coin flip": 0.5
          - "Unlikely": 0.1 to 0.3
          - "Almost certainly false": 0.01 to 0.05
     - If you have multiple independent sources saying the same thing, then the reliability increases (but that's more complex; we'll stick to one source for simplicity).

