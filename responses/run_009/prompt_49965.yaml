  We are going to design a step-by-step procedure for updating your beliefs when you receive uncertain evidence (a "tip"). The procedure is based on Jeffrey's rule (also known as Jeffrey conditioning) and will account for the fact that the evidence might not be certain. We'll also consider when the existence of the tip itself might be informative.

  The key idea of Jeffrey's rule is:
  - You have an event of interest, H (hypothesis, e.g., "the product is delayed").
  - You receive a piece of evidence, E (e.g., a leak, a tip, a screenshot). But you are not sure if E is true (i.e., the evidence might be fake or mistaken).
  - Instead, you have a new probability for E: P(E) = r (which you assign based on the reliability of the source).
  - You also know:
      P(H|E): your probability of H given that E is true.
      P(H|~E): your probability of H given that E is false.

  Then, your updated probability for H is:
      P_new(H) = P(H|E) * r + P(H|~E) * (1 - r)

  But note: sometimes the existence of the tip (the fact that you received it) might be informative. For example, if a leak is more likely when H is true, then even without knowing the content of the leak, the fact that there is a leak might update your belief. We'll handle that by adjusting the prior for H and the reliability r accordingly.

