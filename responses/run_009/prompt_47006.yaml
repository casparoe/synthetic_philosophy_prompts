prompt: |-
  been reading rationalist blogs since the Overcoming Bias days and lurking on LessWrong since around 2010, and one fight that never dies in my corner of the internet (EA-adjacent) is whether giving is obligatory or above-and-beyond. philosophers apparently have a word for this — supererogation, acts that are good and praiseworthy to do but not wrong to skip. the saint and the hero territory, above duty but not duty.

  so heres my actual situation. I write the yearly "community impact report" for our local giving circle — about 80 people, most of them pledged 10% of income. every year the same fight breaks out over that report. some members give exactly 10% and clock out. others give 10% and then do tons extra: donate a kidney, take a pay cut to work directly at a charity, put in weekends volunteering. half the circle wants me to celebrate the extra folks (spotlight section, names, quotes about their sacrifice), the other half says that reading makes the 10%-only crowd feel like they're failing, and over the years its cost us a couple of quiet members who just stopped showing up. last week I got told to "figure out a policy" and I want it written down so it's not vibes every february.

  what I want from you: a procedure I can actually follow each year when writing this thing — the questions in order, what counts as a sufficient answer to each, where the procedure says stop / no spotlight, and where it hands the call back to me because it's genuinely a values question and no checklist can settle it. the superogation literature seems to have distinctions that would matter here — whether praise of the hero is comparative or absolute, whether celebrating the above-and-beyond implicitly condemns the merely dutiful, whether you can praise doing X without implying that not-doing-X is blameworthy — but I don't know which of those survive contact with a newsletter people skim in five minutes. so tell me which distinctions I actually need and which I can drop without losing the point.

  then run it on three cases from this year: (1) a member who gave her 10% and also ran our entire matching campaign, roughly 15 hours a month for free; (2) a member who gave 40% anonymously and would honestly be embarrassed by a spotlight — does the procedure have anything to say about praising people who don't want it, or is that pure judgment; (3) a member who gives exactly 10% and told me to my face that last year's report made her feel like a moral failure. I'd rather the procedure tell me something I don't like in at least one of these cases than have it always side with me. and be honest about what it can't do — I'm aware "write a policy" can just mean I move my own judgments one document over.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They're part of a giving circle where members pledge 10% of their income. Every year, when they write the community impact report, there's a conflict between celebrating those who go above and beyond (like donating a kidney or volunteering extra hours) and not making the members who only give 10% feel inadequate. Some members have even left because of this. The user needs a clear, procedural policy for the report that balances these concerns, especially regarding supererogation—actions that are praiseworthy but not obligatory.

  First, I need to recall the philosophical concept of supererogation and how it applies here. The key is to praise extraordinary efforts without implying that the baseline 10% is insufficient. The user mentioned distinctions like comparative vs. absolute praise, and whether highlighting supererogatory acts condemns those who don't participate. But in a newsletter, subtlety might be lost, so the procedure must be practical.

  The user wants a step-by-step process with clear questions and decision points. They also provided three test cases to validate the procedure. Let me break down the main goals: avoid alienating baseline contributors, recognize extra efforts without comparison, and handle cases like anonymity and personal feelings of failure.

  Starting with the core principles: neutrality, proportionality, and consent. Neutrality ensures that the baseline isn't undermined. Proportionality means effort recognition matches the scale of the contribution. Consent respects individuals' wishes regarding publicity. These principles should guide each step.

  Next, designing the procedure. The spotlight should only include acts beyond the 10% pledge. Then, assess if the act is supererogatory—truly beyond duty. The newsletter's role is crucial; it should inform and inspire, not shame. The impact of the act matters, but so does the contributor's willingness to be featured. 

  Testing the cases: For the member who ran the matching campaign (15 hrs/month), that's clearly extra and proportionate to spotlight. The anonymous donor giving 40%—here, consent is key. Even if impactful, their anonymity must be respected. The member feeling like a failure indicates past reports caused harm, so the procedure must adjust to avoid such outcomes, perhaps by depersonalizing recognition or emphasizing collective effort.

  I should also consider deeper needs. The user might want to maintain group cohesion and prevent attrition. The policy needs to affirm the 10% pledge as sufficient while still motivating more contributions without pressure. Balancing recognition without hierarchy is essential. The anonymity case highlights respect for individual preferences, which fosters trust. Addressing the feeling of failure suggests the need for clear communication that baseline contributions are valued equally in the group's mission.

  Finally, the procedure must accept that some decisions rely on judgment, especially around values conflicts. Being transparent about where the policy ends and human discretion begins is vital for acceptance. The user likely wants to reduce annual conflicts by having a documented process, but also needs flexibility for edge cases.
answer: |-
  Here's a procedural framework designed to resolve your annual spotlight dilemma, grounded in supererogation theory while prioritizing group cohesion. The goal is **neutral recognition without comparative hierarchy**.

  **Core Principles for the Procedure:**
  1.  **Neutral Baseline Affirmation:** The 10% pledge is the *fulfilled duty*. It is never insufficient or blameworthy.
  2.  **Supererogation Definition:** Spotlight only actions *clearly beyond the 10% pledge obligation* (time, risk, significant extra $, unique sacrifice).
  3.  **Non-Comparative Praise:** Describe acts absolutely ("This remarkable effort...") not comparatively ("Unlike others...").
  4.  **Impact & Proportionality:** Spotlight scale should roughly match the "extra" scale (donating a kidney > 20 extra hours).
  5.  **Consent Mandatory:** No spotlight without explicit, recent consent.
  6.  **Group-Centric Framing:** Emphasize how *all* contributions (10%+) enable the circle's mission.

  **The Spotlight Decision Procedure (Follow Sequentially):**

  1.  **Is the act BEYOND the core 10% pledge?**
      *   *Check:* Does it involve significant extra money (>1% income?), substantial time/effort (>20 hrs/year?), personal risk/sacrifice (organ donation, career shift), or unique skills applied pro-bono?
      *   *Sufficient Answer:* Yes (clearly extra) / No (part of standard pledge fulfillment or minimal extra) / Ambiguous (proceed to #2).
      *   *Stop/No Spotlight if:* "No". (E.g., a member simply giving their 10% punctually).
      *   *Hand Back if:* "Ambiguous" (Requires your judgment: Does this feel like standard participation or genuine extra? Err on "No").

  2.  **Is the act GENUINELY SUPEREROGATORY (Praiseworthy but not expected)?**
      *   *Check:* Would reasonable members *not* feel obligated to do this? Is it saint/hero territory *for this group*? Could it reasonably be seen as an implicit new expectation if spotlighted?
      *   *Sufficient Answer:* Clearly Yes / Clearly No (feels like peer pressure potential) / Gray Area (proceed).
      *   *Stop/No Spotlight if:* "Clearly No". (Avoids creating coercive norms).
      *   *Hand Back if:* "Gray Area" (Requires your values judgment on group norms and risk of coercion).

  3.  **Can the act be described ABSOLUTELY without implying baseline insufficiency?**
      *   *Check:* Draft a 1-2 sentence description. Does it *only* praise the extra act? Does it contain any comparative language ("more than," "above others," "unlike some")? Does it imply the act is needed/due?
      *   *Sufficient Answer:* Yes (clean description) / No (comparative/blamey language unavoidable) / Needs Rewriting.
      *   *Stop/No Spotlight if:* "No" (Cannot be described safely).
      *   *Hand Back if:* "Needs Rewriting" (Requires your editorial skill to find neutral phrasing).

  4.  **Has the member provided EXPLICIT, INFORMED CONSENT for spotlight recognition?**
      *   *Check:* Did they clearly say "Yes, you can name me and describe [specific act]"? Was consent given *after* the act and *for this report*? Did they understand it might inspire others?
      *   *Sufficient Answer:* Documented Yes / Documented No / Ambiguous/Unknown.
      *   *Stop/No Spotlight if:* "Documented No" or "Ambiguous/Unknown". (Respect autonomy and privacy).
      *   *Hand Back if:* N/A (Consent is binary. "No" means stop).

  **Applying the Procedure to Your Cases:**

  1.  **Member ran matching campaign (15 hrs/month):**
      *   **#1 (Beyond 10%?):** Yes (Significant extra time - 180 hrs/year).
      *   **#2 (Supererogatory?):** Yes (Not expected of all members; clear extra contribution).
      *   **#3 (Absolute Description?):** *Hand Back (Requires Drafting).* "Sarah dedicated over 180 hours this year to lead our Matching Campaign, securing $X in additional funds." (Good). *Avoid:* "Sarah went above and beyond what others did..." (Bad).
      *   **#4 (Consent?):** Assume Yes (If not, Stop). **Result: Spotlight with approved description.**

  2.  **Member gave 40% anonymously:**
      *   **#1 (Beyond 10%?):** Yes (Significant extra money).
      *   **#2 (Supererogatory?):** Yes.
      *   **#3 (Absolute Description?):** *Hand Back (But...)*. You could draft: "One anonymous member contributed an extraordinary additional 30% beyond their pledge this year." BUT...
      *   **#4 (Consent?):** **Documented No (Would be embarrassed).** *Stop/No Spotlight.* **Result: NO SPOTLIGHT.** The procedure forces this. Consent is non-negotiable. Praise the *impact* of *anonymous* extra gifts generally in the report stats ("We received $Y in anonymous major gifts beyond pledges"), not the individual.

  3.  **Member (10% only) felt like a moral failure:**
      *   *This isn't a candidate for spotlight, but a VITAL CONSTRAINT on the entire report.*
      *   **Procedure Impact:** This feedback validates the *need* for strict adherence to Steps #1 (Baseline Affirmation) and #3 (Non-Comparative Praise). The procedure *must* prevent this outcome.
      *   **Action Required:** **Strengthen Baseline Affirmation:** Add a prominent, unequivocal statement early in the report: "Fulfilling the 10% pledge is the essential foundation of our circle's impact. Every member who meets this commitment has fulfilled their core contribution to our shared mission. We celebrate the collective power of these pledges first and foremost." **Review ALL Descriptions** rigorously against Step #3.

  **What the Procedure CAN'T Do (Requires Your Judgment):**

  1.  **Defining "Significant" Extra:** Where's the line between "a few extra hours" (maybe not spotlight) and "substantial time" (maybe spotlight)? (#1 Ambiguous).
  2.  **Gray Area Supererogation:** Is organizing one small event extra? Is mentoring one new member extra? (#2 Gray Area).
  3.  **Perfect Wording:** Crafting descriptions that are inspiring yet truly neutral requires editorial skill (#3).
  4.  **Balancing Spotlight Volume:** How many spotlights are too many, potentially overwhelming the core message? (Beyond the procedure's scope).
  5.  **Addressing Underlying Tensions:** If the group fundamentally disagrees on whether "extra" is desirable or creates pressure, the procedure manages symptoms but won't resolve the values clash.

  **Recommendation for Implementation:**

  1.  **Publish the Policy:** Share this procedure (or your adapted version) with the giving circle *before* next year's report cycle. Explain the reasoning (neutrality, consent, affirming the pledge).
  2.  **Include the Baseline Affirmation:** Mandate the strong "10% is fulfillment" statement prominently in every report.
  3.  **Solicit Consent Proactively:** When you learn of potential spotlight candidates, *ask immediately*: "This is amazing! Would you be comfortable with us briefly featuring this in the annual report to inspire others? We completely respect if you'd prefer not to."
  4.  **Editorial Review Panel (Optional):** Have 2-3 trusted members (one "pro-spotlight", one "pro-baseline", one neutral) review draft spotlights against Steps #1-3 *before* finalizing. Focuses on neutrality, not newsworthiness.
  5.  **Track Opt-Outs:** If members *still* leave feeling inadequate *after* implementing this, revisit the policy. It means the execution failed the core test.

  This procedure provides clear guardrails, forces critical distinctions (especially Consent and Non-Comparative Description), protects the baseline, and makes explicit where your judgment is required. It should decisively end the annual "vibes" debate by replacing it with transparent criteria.
