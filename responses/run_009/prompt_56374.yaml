prompt: |-
  My brother-in-law Rob has extremely firm opinions about what counts as dishonest, and my sister and I have a long-running bet about whether there's an same rule behind all his rulings or whether he's just going with his gut every time. I've been keeping notes for like three years, and Thanksgiving is when we finally settle it, because I get to pick the scenarios this year. Some background that probably matters: Rob sells real estate, and he got burned once by a business partner who lied to his face, so he's touchy about actual lying.

  Here's the track record, his rulings on stuff that came up:

  1. A guy at his old office ate someone's clearly labeled lunch and then denied it when asked. Rob: wrong, open and shut.
  2. Same office, different incident: someone asked a coworker "did you finish the regular coffee?" and the guy said "I only drink the cold brew" — true, as far as it goes, but he'd taken the last of the regular that morning. Rob: fine, that's just office politics.
  3. A guy selling a used road bike on Marketplace talks up the new tires and the recent tune-up and says nothing about the hairline crack in the frame that he definitately knows about. Buyer never asks. Rob: fine, buyer beware, that's what inspections are for.
  4. Someone at a party asks after Rob's estranged brother and he says "he's keeping busy." He says that's not just fine, it's the polite thing to do.
  5. A local business owner promised to match donations up to $500 at a school fundraiser just so they'd announce it, then never paid and never intended to. Rob: wrong, that's lying, full stop.
  6. A guy wears scrub tops because they're comfortable; people at parties assume he's a nurse and he never corrects anyone, and when finally asked point blank he said "I've always been drawn to medicine." Rob: fine, what's he supposed to do, hand out a disclaimer?
  7. Rob's friend got pulled over, cop asks if he's been drinking, and the friend says "I had one with dinner" — true, but he'd also had five at the bar after dinner. Rob: fine, if the cop actually wants to know he can do the test.

  So now my three scenarios for Thanksgiving, and I want you to help me predict his calls before I spring them:

  A. A financial advisor whose client asks "is this fund a good place for my retirement money?" — the advisor answers "it's had strong returns five years running," which is true, while knowing the star manager just left and there's an inquiry the client has no way to hear about.

  B. A patient about to have surgery who never asks about the specific surgeon; the doctor volunteers that "complication rates at this hospital are low" — also true — while knowing this particular surgeon's own numbers are way above average.

  C. You meet a hiker on a trail with no signal who's heading toward a washed-out footbridge. She asks how the trail ahead is and you say "the crews were out there all summer" — true — because you want the trail to yourself. No map on her, dark in two hours.

  Predict his verdict on each. Then lay out the rules that actually fit the track record (there's more than one, I'm pretty sure), say which of my scenarios split them and which are wasted questions, give me your best guess at the rule he's running and why, and tell me what extra scenario I should bring as a tiebreaker if he rules the way you don't expect. My sister gets to hear your reasoning so no cheating — she'll spot it if my scenarios are rigged.
reasoning: |-
  Hmm, the user has presented quite an interesting ethical puzzle involving their brother-in-law Rob's judgments about dishonesty. They've collected seven real-world examples of Rob's rulings and now want to predict his responses to three new scenarios for their Thanksgiving bet. 

  First, I need to analyze Rob's existing rulings to identify patterns. Looking at the cases:

  - Case 1 (eating labeled lunch and lying) and Case 5 (false donation promise) were clearly wrong to Rob because they involved direct lies and intentional deception.
  - Cases where people told technically true statements but omitted key information (like the bike seller, the scrub top wearer, and the drinking driver) were deemed acceptable by Rob.
  - The office coffee deflection (Case 2) and family evasion (Case 4) were also fine - these seem to fall under social discretion.

  Rob appears to draw a bright line between active lies (verbally false statements) and passive deceptions (omissions or technically true statements). His real estate background and bad experience with a lying business partner explain why he's so strict about direct falsehoods.

  For the new scenarios:
  - Scenario A (financial advisor) should be "fine" - technically true statement though misleading.
  - Scenario B (doctor) is tricky but likely "wrong" - feels like a lie by omission in a high-stakes situation.
  - Scenario C (hiker) should be "wrong" - technically true but creates dangerous consequences.

  The core rules seem to be: 
  1) Never say something factually false (lie) = always wrong
  2) Omissions or selective truths = acceptable unless directly asked
  3) Exceptions for social politeness or self-preservation

  The tiebreaker scenario should test the boundary between social discretion and dangerous omission - perhaps something like a food allergy question at a dinner party.

  The user and their sister seem to have a fun, intellectual rivalry going on. The detailed notes show genuine curiosity about Rob's ethical framework. The Thanksgiving setting adds playful family dynamics to what could otherwise be dry philosophical debate.
answer: |-
  Based on Rob's track record, here's my prediction for each scenario, the underlying rules, and a tiebreaker:

  **Predicted Verdicts:**

  1.  **Scenario A (Financial Advisor):** **FINE.** Rob will see this as a technically true statement ("strong returns five years running") without an outright lie. He'll likely invoke "buyer beware" (like the bike seller) and expect the client to ask more specific questions.
  2.  **Scenario B (Doctor):** **WRONG.** Rob will view this as a deceptive omission in a high-stakes situation. Volunteering a *technically* true but misleading statement ("complication rates at this hospital are low") while knowing the key negative fact (this surgeon's high rate) feels closer to the *spirit* of the false donation promise or the unlabeled lunch lie. It's actively misleading without being asked a specific question about *that* surgeon.
  3.  **Scenario C (Hiker):** **WRONG.** While technically true ("crews were out there all summer"), the intent is purely malicious and creates significant danger. Rob will see this as worse than the drinking driver (who was protecting himself) or the scrub top wearer (who was avoiding awkwardness). The dangerous consequence and deliberate withholding of critical safety information will make it "lying" in his view, similar to the business owner's false promise.

  **The Rules Behind Rob's Rulings:**

  Rob operates on **two core, distinct rules**, not just gut feeling:

  1.  **Rule 1: The Literal Truth Shield:** If a statement is *literally, technically true*, it's generally acceptable, even if it's misleading, evasive, or omits crucial context. This applies *especially* when:
      *   The listener doesn't ask a direct, specific question that the true statement *directly contradicts*.
      *   The stakes involve social awkwardness, self-preservation, or "buyer beware" situations.
      *   *Examples:* Office coffee deflection (2), Bike seller omission (3), Estranged brother comment (4), Scrub top non-correction (6), Drinking driver evasion (7).
      *   *Key Principle:* Avoiding an outright factual falsehood provides significant protection.

  2.  **Rule 2: The Active Deception Line:** It's wrong (often "lying") if:
      *   A **factually false statement** is made. (Lunch denial - 1, Donation Promise - 5).
      *   **Active steps are taken to create a materially false impression**, even using technically true words, *especially* when:
          *   There is a **duty of care or trust** (like a business promise - 5).
          *   The omission/evasion **creates significant, foreseeable harm or risk** (like the hiker scenario - C).
          *   The statement is volunteered *specifically to mislead* on a critical point, bypassing the "didn't ask" defense (like the doctor scenario - B).
      *   *Key Principle:* Active dishonesty (false statements or deliberate misleading acts creating significant risk/harm/betrayal of trust) crosses the line.

  **Where Your Scenarios Split the Rules:**

  *   **Scenario A (Financial Advisor):** Fits neatly under **Rule 1 (Literal Truth Shield)**. The statement is true. The client didn't ask specifically about the manager or current inquiries. Rob will see it as the client's responsibility to probe further ("buyer beware").
  *   **Scenario B (Doctor):** Splits the rules but triggers **Rule 2 (Active Deception Line)**. The *statement* is technically true (Rule 1), BUT: the doctor *volunteered* information likely intended to reassure on the *specific risk the patient faces* (the surgeon), creating a materially false sense of security. This feels like an active deception bypassing the "didn't ask" defense, invoking the *spirit* of the donation promise lie (Rule 2). The duty of care strengthens this.
  *   **Scenario C (Hiker):** Splits the rules but triggers **Rule 2 (Active Deception Line)**. The *statement* is technically true (Rule 1), BUT: the *intent* is purely malicious, the *omission* is critical safety information, and the *foreseeable harm* (injury/death) is severe. This goes far beyond social evasion or self-preservation, firmly crossing into dangerous active deception (Rule 2), worse than the examples covered by Rule 1.

  **Wasted Question:** Scenario A is the least likely to split the rules or challenge Rob's framework. It's the clearest application of Rule 1. Your sister might argue it's too predictable.

  **Rob's Core Rule (Best Guess):** Rob's primary, overriding rule seems to be: **"Never utter a factually false statement or actively engineer a situation where someone is materially misled to their significant detriment, especially when trust is expected."** He fiercely protects technically true statements (Rule 1) *unless* they become vehicles for the kind of active, harmful deception that burned him (Rule 2). His distinction hinges on *intent, consequence, and the presence of a duty/trust relationship*.

  **Tiebreaker Scenario (If Needed):**

  If Rob rules unexpectedly (e.g., says B is FINE or C is FINE), use this to probe the duty/harm/intent boundaries:

  *   **Scenario D (The Allergy Omission):** At a potluck, a guest with a severe peanut allergy asks the host, "Does this dessert contain nuts?" The host, who knows it contains peanut butter cups blended in (visually undetectable) but hates the guest, says, "I didn't put any whole nuts in it." The guest eats it and has a severe reaction.
      *   *Why it's a good tiebreaker:* It combines elements.
          *   **Literal Truth Shield?** "Didn't put any whole nuts in" is technically true (Rule 1).
          *   **Active Deception Line?** Answers the *spirit* of the question falsely. Creates extreme, foreseeable harm. Malicious intent. Clear duty when asked directly about safety. Mimics the worst aspects of the lunch lie and the hiker scenario.
      *   *Prediction if rules hold:* Rob would say **WRONG**, verging on criminal. It directly tests the limits of Rule 1 against the core principles of Rule 2 (harm, intent, active deception on a safety question).

  **Good luck with the Thanksgiving showdown!** Remember Rob's sensitivity to direct lies and his strong distinction between technical truth and active, harmful deception. Scenario B and C are your best shots to reveal the nuance of Rule 2.
