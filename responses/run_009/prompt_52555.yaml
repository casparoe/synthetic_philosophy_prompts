  This connects to why Mercury gets a pass but MOND doesn't. For Mercury, GR didn't just postdict - it revealed the anomaly as necessary. Whereas MOND feels adjustable (hence "tuned"). The user's example brilliantly exposes how narrative shapes perception: Einstein's Mercury moment is framed as deduction, MOND as induction. 

