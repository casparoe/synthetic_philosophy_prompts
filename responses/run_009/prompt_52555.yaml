  Also worth noting the unspoken tensions: the user might be subtly critiquing how cosmology privileges certain theories. When they say "the same community within the same field," there's an implied eyeroll at tribal thinking. But they're careful not to dismiss science - they want to understand the legitimate reasoning beneath the rhetoric.

