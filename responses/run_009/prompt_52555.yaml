answer: |-
  This inconsistency highlights a fascinating tension in scientific epistemology, rooted in the **distinction between *prediction* and *accommodation***. The normative practice you describe implicitly relies on a view of confirmation where **novel predictive success is epistemically privileged over mere explanatory accommodation of existing data.** Here's a reconstruction of the implicit logic, its coherence, and the Bayesian perspective:

  ### The Implicit Epistemology: Novelty as a Filter for Ad Hocness
  1.  **The Problem of Underdetermination:** Infinitely many theories can be constructed to fit any finite set of existing data. A theory built solely to explain known data risks being *ad hoc* – its structure might be finely tuned *just* to fit that data without capturing deeper truths or being generalizable.
  2.  **Novel Prediction as a Constraint:** Predicting *new*, previously unknown (or unmeasured) phenomena severely constrains the theory. The theorist cannot adjust the theory's parameters or structure to fit this new result *after* the fact. Success here suggests the theory isn't merely a complex summary of old data but genuinely captures underlying principles that extend beyond the known.
  3.  **Risk as Virtue:** A novel prediction represents a *risky* venture. If the prediction fails, the theory is falsified (or severely damaged). Success against such risk is seen as a stronger indicator of truth than merely fitting data the theory was designed to handle.
  4.  **Explanatory Power vs. Confirmatory Power:** Explaining existing data demonstrates *explanatory power*. Successfully predicting novel data demonstrates *confirmatory power* – it provides a stronger test the theory wasn't "built to pass."

  **Why Mercury vs. MOND Feels Different:**
  *   **General Relativity (Mercury):** While Mercury's perihelion was known, GR didn't *start* from it. Einstein derived the field equations from deep principles (equivalence, general covariance). **The key point:** *Mercury's anomaly emerged as a necessary, non-adjustable consequence* of those core principles. He didn't add a "fudge factor" for Mercury; it fell out naturally. Its explanation was a *validation* of the core structure, not the *goal* of building that structure. The *novel prediction* of light bending then provided the dramatic, high-risk test.
  *   **MOND:** While motivated by principle (modifying inertia/gravity at low accelerations), its specific functional form (e.g., the interpolation function μ(a/a₀)) was explicitly chosen to fit the *existing* galactic rotation curve data. It appears much more like a direct *accommodation* of that specific data set. Its subsequent struggles with novel predictions (e.g., cluster dynamics without dark matter, the cosmic microwave background, gravitational lensing profiles) reinforce the perception of limited generalizability beyond its initial target.

  ### Is the Norm Internally Coherent? Partially, But Simplicity & Unification Matter
  The norm *can* be coherent *if* applied consistently, focusing on the **degree to which the theory's success was constrained in advance**:

  *   **Coherent Aspect:** Privileging novel predictions is a rational strategy to combat underdetermination and filter out ad hoc constructions. It focuses confirmatory weight on tests the theory couldn't easily be engineered to pass.
  *   **The Asymmetry Explained (Mercury vs. MOND):**
      *   **Mercury:** Was a *consequence* of deep, non-adjustable core principles. Its explanation was powerful *because* it wasn't the driving input; it was a downstream output validating the core. The *novel* light bending prediction provided the decisive new test.
      *   **MOND:** The specific form *was* driven by fitting the rotation curve data. Its success feels less like a validation of deep principles and more like a direct accommodation. It's perceived as having significant "freedom" tuned *to* that data.
  *   **What Else Does the Work? Simplicity & Unification:** The norm isn't applied mechanically. Simplicity and unification play crucial roles:
      *   **GR:** Explains Mercury *and* predicts light bending *and* frames the universe in a profoundly simple, unified geometric framework. Its success with Mercury gains *retrospective* weight *because* it's part of this unified, predictively successful whole. It wasn't a standalone "fix."
      *   **MOND:** Lacks comparable simplicity/unification. It modifies dynamics only in specific regimes, struggles to integrate with cosmology/relativity without adding elements, and its core function often appears arbitrary. Its success with rotation curves looks more like an isolated fix. Simplicity/unification make GR's accommodation of Mercury seem *less* ad hoc than MOND's accommodation of rotation curves.

  **Conclusion on Coherence:** The norm is *broadly* coherent but requires context. Novel prediction is the strongest evidence. Accommodation *can* be strong evidence if the accommodated result is a robust, non-adjustable consequence of a simple, unified theory with independent predictive success. Accommodation is *weak* evidence if it appears to be the primary driver for specific, adjustable parameters within a less unified framework. The Mercury/MOND asymmetry stems from GR's profound simplicity/unification vs. MOND's perceived ad hocness and lack thereof, *amplifying* the difference in how the accommodated data is viewed.

  ### The Strict Bayesian View: A World Without "Old Evidence"
  Bayesian confirmation theory updates belief (credence) in a hypothesis `H` given evidence `E` using Bayes' theorem: `P(H|E) = [P(E|H) * P(H)] / P(E)`. Crucially, **if `E` is already known with certainty (`P(E) = 1`), then observing `E` provides *no* new information and `P(H|E) = P(H)`.** Known evidence *cannot* change credence.

  **Consequences for Scientific Discourse:**
  1.  **"Evidence for" Becomes Time-Dependent:** Scientists/journalists could *only* legitimately say "This is evidence for Theory T" if `T` predicted `E` *before* `E` was known. Once `E` is known, mentioning it as "evidence" for a *new* theory `T_new` proposed *after* `E` would be epistemically vacuous in a strict Bayesian sense. `T_new`'s ability to accommodate `E` would be irrelevant for updating belief in `T_new`.
  2.  **Focus Shifts to *Predictive* Novelty:** All confirmatory weight falls on genuinely novel predictions (`E` where `P(E) < 1` before the prediction). The 1919 eclipse *always* counts. Mercury's perihelion *never* counted for GR *after* 1915 (in this strict view). MOND's fit to *pre-existing* rotation curves couldn't count as evidence *for* MOND.
  3.  **Role of Accommodation Changes:** Accommodation wouldn't be "evidence," but it could still be:
      *   **A Requirement:** A theory failing to explain well-established data is likely false.
      *   **An Indicator of Plausibility/Scope:** Demonstrates the theory *can* handle known phenomena, potentially increasing its initial plausibility (`P(H)` - the prior) if done simply/unifiedly, *before* any novel predictions are tested. But it wouldn't directly increase credence *after* the data is known.
  4.  **Radical Shift in Narrative:** Historical accounts like "Einstein explained Mercury's orbit, confirming GR" would be seen as misleading. The narrative would focus solely on *predictions* made before the evidence was gathered. "GR predicted light bending, confirmed in 1919" remains valid. "MOND was constructed to fit rotation curves" becomes a statement about its origin, not its confirmation.

  **Challenges with Strict Bayesianism:**
  *   **Certainty is Rare:** Scientists are rarely *certain* (`P(E) = 1`) of complex data. Re-evaluation happens. A strict view might be too idealized.
  *   **The Problem of "Old" Evidence:** The Bayesian "problem of old evidence" debates how to handle evidence known *before* the theory is even formulated. Strict conditionalization seems inadequate here. Alternatives (e.g., Jeffrey conditionalization, focusing on *learning the logical consequence*) are complex.
  *   **Loss of Explanatory Power:** It downplays the importance of a theory's ability to *make sense* of known phenomena, even if it doesn't change credence.

  **Conclusion:** The normative practice privileges predictive novelty as a safeguard against ad hocness. While internally coherent *if* contextual factors like simplicity/unification are considered, the Mercury/MOND asymmetry highlights that these factors significantly shape *how* accommodated evidence is perceived. Adopting a *strict* Bayesian view would force a dramatic shift in discourse: "Evidence for" a theory could *only* refer to data it successfully predicted *before* that data was known. Accommodation of old data would lose its confirmatory status, relegated to being a basic requirement or a factor influencing prior plausibility. While philosophically cleaner, this strict view might poorly reflect the dynamic, explanatory, and sometimes retrospective nature of scientific reasoning in practice.
