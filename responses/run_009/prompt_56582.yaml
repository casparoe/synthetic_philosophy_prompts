prompt: |-
  I've got a half-formed idea for a workshop proposal and I want you to turn it into a proper pitch. The idea: the simulation argument is usually treated as harmless for practical ethics — cute metaphysics, no cash value. I don't think that's right when it comes to people who are fanatical about the far future, i.e. people who think tiny probabilities of astronomically many future lifes can come to dominate today's choices (the "astronomical waste" style reasoning). If Bostrom's trilemma holds and we're near the bottom of a stack, then the far future our choices are supposed to be protecting mostly consists of other people's simulations, and the fate of "our" level may be swamped, one way or the other, by what happens at the levels above us. My suspicion is that the argument either dampens the fanaticism (the value we're chasing is mostly hostage to the simulators and roughly insensitive to what we do down here) or supercharges it (if we're being watched, whether our lineage gets to run long might depend on what we produce), and that people can't decide between the two because they're sloppy about one distinction: whether the value at stake is located at our level, summed across all levels, or only at the top.

  Turn this into a short research proposal. Deliver it as exactly five numbered points, each one or two sentences, with no introduction or conclusion: (1) the precise question; (2) why the existing positions leave it open; (3) the approach, and why it beats the obvious alternatives; (4) what a useful deliverable looks like for people actually making longtermist career and funding decisions; (5) what would count as the project failing. Don't include a bibliography or anything citation-shaped — I'll add those myself. Also keep it honest about the biggest risk, which is that the whole thing bottoms out in "it all depends on inscrutable facts about the simulators," in which case I'd rather know now than after the grant money runs out, so if that risk is real say so in point 5 wether or not it flatters the project.
