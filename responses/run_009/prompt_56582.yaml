answer: |-
  Here is the proposal structured as requested:

  1. **Precise Question**: Does the simulation argument's hierarchical structure undermine or amplify the practical ethical force of fanatical longtermism (prioritizing tiny probabilities of astronomically large future value), and which specific assumptions about value location (our level, sum across levels, top level only) drive divergent conclusions?

  2. **Why existing positions leave it open**: The simulation argument is typically dismissed as ethically inert, while longtermists ignore simulation hierarchy implications; neither camp systematically analyzes how value distribution across simulation levels interacts with astronomical-waste reasoning under Bostrom's trilemma.

  3. **Approach and advantage**: Build formal comparative models of expected value under competing value-location assumptions within a simulation hierarchy, contrasting outcomes with standard fanaticism. This beats intuitive armchair analysis by forcing explicit, testable dependence on value-location premises and quantifying sensitivity.

  4. **Useful deliverable**: A clear decision framework (e.g., flowchart or table) showing under which specific, identifiable conditions about simulation prevalence and value location longtermist fanaticism is robustly amplified, negated, or rendered highly uncertain by simulation dynamics, for use in prioritization.

  5. **Failure condition**: The project fails if modeling conclusively shows the outcome is overwhelmingly sensitive to fundamentally unknowable properties of simulators (e.g., their goals, value structures, or intervention policies), rendering practical guidance impossible despite theoretical clarification. This "inscrutable simulator" risk is substantial.
