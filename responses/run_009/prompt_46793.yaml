prompt: |-
  I do grantmaking for a small foundation that funds conceptual/theory work on AI safety — philosophers, math-y types, no empirical ML — and this cycle we have money for about five grantees over two years on Goodhart's law and specification gaming. The problem is most of the proposals I'm reading are basically restatements of the thing (measure becomes target, agents game the metric, "you get what you measure," etc.) and I can't tell which of the deeper open questions are actually worth funding versus which are just the same insight re-dressed. I've come across the fourfold breakdown of Goodhart effects — regressional, extremal, causal, adversarial — and honestly I can't decide whether refining taxonomies like that is a necessary first step or a dead end that eats grant money that should go elsewhere. So: what are the main genuinely open questions in this space right now, which two or three should a funder with our constraints prioritize, and, more importantly, why? I care much more about the reasoning than the list — what makes a question upstream of other work (e.g., does everything else hinge on whether anyone can formalize *when* optimizing for a proxy severs the link between proxy and goal, or is that a hopeless math program?), how tractable it is for researchers who don't run experiments, and what developments in the next couple of years would make you re-rank. Also call out the lines of work people keep pitching that I should actively deprioritize as either overrated or downstream of something else on the list.

  Please answer in American English, and give it to me as a JSON object with these fields: "top_questions" — an array of objects, each with "question" (a one-sentence statement of the open question), "priority" (an integer 1–5, 1 being highest), "why_it_matters" (a short paragraph explaining the case for ranking it there), "tractability_for_theorists" (one of "high", "medium", or "low", followed by a sentence of justification), and "upstream_of" (an array of strings naming the lines of work or questions that depend on how this one gets resolved); "deprioritized" — an array of objects with "line_of_work", "reason", and "salvageable" (a boolean plus a sentence on what would change your mind); and "re_ranking_triggers" — an array of strings describing evidence or developments over the next couple of years that would move things up or down. Aim for maybe six to eight top questions, not twenty — I want the ones you'd actually defend in front of my review committee, not a survey of the field. Sorry if the schema is fussy, we're putting everything through a consistency check for the review pipeline.
reasoning: |-
  We are creating a JSON object with three main fields: "top_questions", "deprioritized", and "re_ranking_triggers".

  Constraints for the foundation:
  - Funds conceptual/theory work on AI safety (philosophers, math-y types, no empirical ML)
  - Current cycle: Goodhart's law and specification gaming
  - Five grantees over two years

  The user's concerns:
  - Many proposals are restatements of the same insight (measure becomes target, etc.)
  - Wants to know which deeper open questions are worth funding
  - In particular, wants to avoid dead ends (like over-refining taxonomies without progress on core issues)

  We are to provide:
  1. "top_questions": an array of 6-8 objects, each with:
     - "question": one-sentence statement of the open question
     - "priority": integer 1-5 (1 highest)
     - "why_it_matters": short paragraph explaining why it's ranked that way
     - "tractability_for_theorists": one of "high", "medium", "low", plus a sentence of justification
     - "upstream_of": array of strings (lines of work or questions that depend on this)

  2. "deprioritized": array of objects with:
     - "line_of_work": description of the work to deprioritize
     - "reason": why it's being deprioritized
     - "salvageable": boolean and a sentence on what would change your mind

  3. "re_ranking_triggers": array of strings describing evidence or developments in the next couple of years that would cause re-ranking.

  Key considerations from the user:
  - Prioritize questions that are upstream (i.e., foundational; other things depend on them)
  - Focus on tractability for theorists (no experiments, so mathematical or conceptual progress)
  - Avoid overrated or downstream work

  We'll draw from the current state of Goodhart's law and specification gaming research, focusing on truly open and impactful questions.

  Let's brainstorm some top open questions:

  1. Formalizing when proxy optimization severs the link between proxy and goal: This is central. Without knowing when this happens, we can't design robust proxies.

  2. Developing a unified mathematical framework for Goodhart effects: The fourfold breakdown (regressional, extremal, causal, adversarial) is a starting point, but we need a framework that can predict and mitigate these effects.

  3. Formal conditions under which a proxy remains aligned under optimization pressure: This is about the stability of the proxy-goal relationship.

  4. Quantifying the risk of Goodhart effects in complex systems: How to measure the "distance" between proxy and goal, and when that distance becomes dangerous.

  5. Connections to other alignment problems: How does Goodhart relate to robustness, distributional shift, or inner alignment?

  6. How to design proxies that are robust to Goodhart effects: This is more applied but still theoretical.

  7. The role of adversarial Goodhart in advanced AI systems: As AI systems become more capable, how do we handle the adversarial case?

  But we must avoid:

  - Over-refining taxonomies without new insights or tools.
  - Restatements of the problem without novel approaches.

  So, let's structure the top_questions:

  Priority 1: Highest impact and upstream. These should be foundational and if solved, would unlock progress elsewhere.

  Priority 2: Important but perhaps more specific, or slightly less upstream.

  Priority 3: Still valuable but maybe more challenging or dependent on prior progress.

  We are to have 6-8 questions.

  Draft:

  1. Question: Under what formal conditions does optimizing for a proxy measure preserve the intended goal, and when does it lead to severe divergence?
     Priority: 1 (highest)
     Why it matters: This is the core of Goodhart's law. Without a clear formal understanding of when the proxy-goal link breaks, we cannot design safe AI objectives. Answering this would provide a foundation for creating robust proxies and avoiding specification gaming.
     Tractability for theorists: Medium. It requires mathematical modeling of the relationship between proxy and goal, and defining "severe divergence", but there are existing tools from optimization and probability that can be adapted.
     Upstream of: ["Design of robust objective functions", "Taxonomies of Goodhart effects", "Risk quantification methods"]

  2. Question: Can we develop a unified mathematical framework that captures the four Goodhart effects (regressional, extremal, causal, adversarial) and allows for predicting which effect will dominate in a given context?
     Priority: 1 
     Why it matters: Current taxonomies are descriptive but not predictive. A unified framework would enable systematic analysis of proxy failures and guide the selection of proxies in different settings, moving beyond ad hoc categorizations.
     Tractability: Medium. It requires integrating concepts from statistics, causal inference, and game theory, which is challenging but feasible for theorists without experiments.
     Upstream of: ["Development of mitigation strategies", "Context-aware proxy selection", "Refined taxonomies (if necessary)"]

  3. Question: How can we quantify the inherent 'Goodhart risk' of a proxy measure, independent of the optimization algorithm, based on properties of the goal and environment?
     Priority: 2
     Why it matters: Not all proxies are equally vulnerable. A measure of risk would allow comparing proxies and choosing safer ones. This is a prerequisite for designing robust systems.
     Tractability: Medium to High. It can build on existing work in information theory and robustness (e.g., measuring the sensitivity of the proxy to misspecification).
     Upstream of: ["Proxy selection criteria", "Safety margins in objective design"]

  4. Question: What are the fundamental limits of proxy-based optimization? That is, are there inherent trade-offs (e.g., between robustness and performance) that cannot be overcome by any proxy?
     Priority: 2
     Why it matters: If there are inherent limits, we must know them to avoid futile efforts. This question connects to fundamental results in decision theory and optimization.
     Tractability: Low. Proving inherent limits often requires deep theoretical breakthroughs and might be less tractable in the short term.
     Upstream of: ["Theoretical boundaries of alignment", "Guidance for when to avoid proxy methods"]

  5. Question: How do Goodhart effects manifest and compound in multi-agent systems, and how can we design proxies that are robust to strategic behavior?
     Priority: 3
     Why it matters: In real-world settings, multiple agents might game the proxy. This extends Goodhart beyond single-agent and is critical for scalable AI safety.
     Tractability: Medium. Game theory and mechanism design provide tools, but the complexity of multi-agent interactions makes it challenging.
     Upstream of: ["Mechanisms for cooperative AI", "Multi-agent alignment protocols"]

  6. Question: Can we formalize the conditions under which a proxy remains aligned under distributional shift, especially shifts induced by the optimization process itself?
     Priority: 1 
     Why it matters: Distributional shift is a common cause of Goodhart effects (e.g., when the agent's actions change the environment). Formalizing this is key to long-term alignment.
     Tractability: Medium. There is existing work on robustness to distributional shift that can be leveraged, but extending it to the recursive nature of optimization is novel.
     Upstream of: ["Continual alignment methods", "Handling distributional shift in objectives"]

  7. Question: To what extent can we mitigate Goodhart effects by using multiple proxies or incorporating uncertainty, and what are the theoretical guarantees?
     Priority: 3
     Why it matters: Practical approaches often use multiple metrics. Understanding the theoretical basis for such methods would validate or improve them.
     Tractability: High. This can be approached via ensemble methods, Bayesian reasoning, and decision theory, which are well-established in theory.
     Upstream of: ["Design of multi-proxy objectives", "Uncertainty-aware optimization"]

  We have 7 questions. Let's adjust priorities to have more focus on the highest priority.

  Re-prioritize:

  - Questions 1, 2, and 6 are the most upstream and fundamental. They get priority 1.
  - Questions 3 and 4 are also important but perhaps a bit more specific or harder? We'll make them priority 2.
  - Questions 5 and 7 are important but more applied or have more established approaches? Priority 3.

  Now, deprioritized lines of work:

  1. Line of work: Creating new taxonomies of Goodhart effects beyond the fourfold breakdown without a clear path to predictive power or mitigation.
     Reason: The fourfold breakdown is already a useful categorization. Further refinement without mathematical or actionable insights risks being an academic exercise that doesn't advance the field.
     Salvageable: true. If a taxonomy is accompanied by a formal model that predicts which effect will occur in a given scenario, then it becomes valuable.

  2. Line of work: Proposing ad hoc solutions to specific instances of specification gaming without generalizable principles.
     Reason: While case studies can be illustrative, they often don't scale or transfer to new contexts. We need general theory, not just patching individual examples.
     Salvageable: true. If the ad hoc solution is used to derive a general principle or test a theoretical framework, then it becomes valuable.

  3. Line of work: Empirical studies of specification gaming in existing ML systems (but note: the foundation doesn't fund empirical ML, so this might not even be proposed. However, if someone pitches a theoretical analysis that requires empirical data, that might be an issue).
     Actually, the foundation doesn't fund empirical work, so we might not see this. Instead, we might see:
     Line of work: Overly detailed case studies from non-AI domains (e.g., economics, ecology) without extracting transferable theoretical insights.
     Reason: While cross-domain inspiration is good, without a clear path to abstracting principles for AI safety, it risks being a distraction.
     Salvageable: true. If the case study is used to validate or inform a theoretical model of Goodhart, then it becomes useful.

  Re-ranking triggers:

  - If there's a breakthrough in formalizing proxy-goal divergence (e.g., a mathematical condition that is both necessary and sufficient), then questions about risk quantification and multi-agent settings become more tractable and should be elevated.

  - If a unified framework for Goodhart effects is developed, then taxonomy refinement becomes less important (and deprioritized work in that area becomes even less justified).

  - If theoretical work reveals that certain classes of proxies are inherently unsafe, then research on alternative approaches (like direct goal specification) might become more urgent.

  - Progress in related fields (e.g., distributionally robust optimization) might make some of our questions more tractable.

  Now, we write the JSON.
