  We are drafting an adversarial collaboration joint statement for two game theory seminar members: the orthodox theorist and the cooperation-friendly theorist.

  The structure will be:

  1. **Agreed Claims**: A numbered list of claims both can sign, covering:
     - Formal structure of the centipede game.
     - Validity of each step of backward induction in isolation (given premises at that node).
     - Stylized facts of experimental play.

  2. **Disagreements Table**: Each row states a point of disagreement, worded so the relevant party accepts it as fair.

  3. **Cruxes Section**: Addressing key points (a, b, c) and others if needed. For each crux:
     - A shared case/experiment/argument that bears on it.
     - Each party's prediction (as if in advance).
     - What outcome each party would count as evidence against its view.

  4. **Closing Paragraph**: What both concede would move the debate, and candidly if either believes nothing could move them.

  Let's draft accordingly.

  ---

  **Joint Statement: Adversarial Collaboration on the Centipede Game**

  **1. Agreed Claims**

  Both parties agree to the following:

  1.1. The standard centipede game is a finite, extensive-form game with two players alternating moves. At each node, the player whose turn it is can either "take" (ending the game and distributing payoffs as specified at that node) or "pass" (which moves play to the next node, if any). The payoffs strictly increase along the path of passes until a take occurs, and the taker receives a higher payoff than the passer at the same node.

  1.2. For any node in the game, if it is common knowledge at that node that both players are rational (in the sense of maximizing their own expected payoff) and that the payoff structure is as described, then the backward induction argument correctly shows that the rational move at that node is to take, provided that the common knowledge of rationality and payoffs is maintained.

  1.3. The backward induction argument, when applied step-by-step from the last node to the first, yields a unique prediction: the first player takes at the first node.

  1.4. In experimental settings with human subjects playing the centipede game:
     - (a) Players typically pass for several nodes before one takes.
     - (b) Raising the monetary stakes (while preserving the relative payoff structure) tends to reduce the number of passes, i.e., taking occurs earlier.
     - (c) When the same subjects play multiple rounds (especially with feedback about past plays), the number of passes decreases over time, and play often converges toward taking at the first node.

  1.5. The backward induction argument, taken one step at a time (i.e., at a given node, under the assumption that common knowledge of rationality and payoffs holds at that node and that the induction holds for all subsequent nodes), is logically valid. That is, if the premises hold, the conclusion (to take) follows.

  **2. Disagreements**

  The following table outlines the core disagreements. Each party accepts the wording of the row as a fair statement of their own position.

  | Row | Orthodox Theorist Position                                                                 | Cooperation-Friendly Theorist Position                                                                 |
  |-----|--------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | 2.1 | The backward induction argument is sound as a whole for the entire game. Common knowledge of rationality and payoffs at the start implies that the first player must take at the first node, and any passing in the actual play must be due to a failure of common knowledge of rationality or payoffs. | The backward induction argument is self-undermining because it relies on common knowledge of rationality at nodes that the argument itself shows are unreachable. Therefore, the argument cannot be applied to the entire game without generating an inconsistency. |
  | 2.2 | The induction argument's premises (common knowledge of rationality and payoffs) are either true or false at the start. If true, they persist throughout the game. The argument does not "eat its own premises" because the unreachability of nodes is a consequence of the argument, not a cause of the premises failing. | At nodes that are off the equilibrium path (i.e., nodes that would only be reached if a player passed when they should not have according to the induction), the common knowledge of rationality is unstable because a rational player would not have passed to reach that node. Thus, common knowledge of rationality cannot be maintained at such nodes. |
  | 2.3 | Passing by a player cannot be rational in the standard game under full common knowledge. Any justification for passing must invoke a deviation from the standard model, such as uncertainty about payoffs, types, or bounded rationality. | Passing can be rational even under common knowledge of rationality if we account for the fact that an opponent's prior pass reveals information (e.g., that they might be irrational, or that they are reasoning forward) that licenses a best response that includes passing. |
  | 2.4 | The stylized facts of experimental play (1.4) are entirely explained by failures of the premises (e.g., lack of common knowledge of rationality, uncertainty about payoffs, or learning effects). They do not challenge the validity of the backward induction argument. | The experimental facts suggest that the backward induction argument does not fully capture rational play. Passing can be part of a rational strategy under realistic conditions (e.g., uncertainty about the opponent) and is not merely an error. |

  *Note on Disagreement 2.3 and 2.4*: The parties agree that some disagreements hinge on the scope of "rationality" and which premises are held fixed. The orthodox theorist holds that rationality must be defined in the context of the full common knowledge model, while the cooperation-friendly theorist argues that rationality must account for the informational dynamics that occur when the equilibrium path is deviated from.

  **3. Cruxes**

  Both parties agree that the following cruxes are central to the debate. For each, we describe a shared case or experiment, each party's prediction, and what each would count as evidence against their view.

  **Crux (a): Stability of Common Knowledge of Rationality Off-Path**

  - **Shared Argument**: The backward induction argument requires common knowledge of rationality at every node. But if a node is off the equilibrium path (because a rational player would not have passed to get there), then at that node, the players might doubt each other's rationality. Is this instability a technical defect that can be repaired (e.g., by using common belief of bounded depth) or does it invalidate the entire backward induction conclusion?

  - **Orthodox Theorist Prediction**: The instability is a technical issue that can be resolved. For instance, if we model the game with common belief of rationality of a fixed finite depth (less than the number of nodes), then passing can occur in early nodes without contradiction. However, in the full common knowledge case, the instability does not arise because the node is never reached. Thus, the backward induction conclusion stands.

  - **Cooperation-Friendly Theorist Prediction**: The instability is fatal to the backward induction argument. Even with common knowledge at the start, the act of passing by the first player (if it were to occur) would break common knowledge, making backward induction inapplicable. Thus, the argument cannot be coherently applied from the start.

  - **What would count as evidence against each view?**
    - *Orthodox*: If it could be shown that even with full common knowledge at the start, the players must abandon common knowledge at off-path nodes in a way that makes backward induction impossible to apply, that would challenge the orthodox view.
    - *Cooperation-Friendly*: If a formal model with full common knowledge (e.g., using counterfactuals or belief revision) can be constructed in which backward induction holds without contradiction, that would challenge the cooperation-friendly view.

  **Crux (b): The Incomplete-Information Repair**

  - **Shared Argument**: The orthodox theorist often explains passing by introducing a small probability that the opponent is an "altruist" (or "irrational" type) who always passes. This can make passing rational (as a way to test the waters). But does this fully explain rational passing, or does it relocate the puzzle? Specifically, how are the beliefs about such types formed? Can the induction analysis vindicate the formation of these beliefs?

  - **Orthodox Theorist Prediction**: The incomplete-information model is a complete explanation. The small prior probability of an altruist type is exogenously given, and the Bayesian updating along the path is consistent with rationality. The induction analysis can be applied to the actual (rational) types, and the presence of the altruist type breaks the common knowledge of rationality, which is why passing can occur.

  - **Cooperation-Friendly Theorist Prediction**: The incomplete-information model relocates the puzzle. The prior beliefs about altruist types are arbitrary and not derived from the induction argument. Moreover, if we ask whether the rational players should believe in such types, we face a regress: the induction argument would seem to preclude the possibility of passing by rational players, so why would they assign positive probability to altruists? Thus, the model does not address the core issue of how rational players could ever coordinate on passing without an exogenous assumption.

  - **What would count as evidence against each view?**
    - *Orthodox*: If it can be shown that the incomplete-information model requires prior beliefs that are inconsistent with the backward induction reasoning (e.g., if the induction argument implies that rational players must assign zero probability to altruists), that would challenge the orthodox view.
    - *Cooperation-Friendly*: If a model can be built where the prior beliefs about altruists are endogenously justified (e.g., by evolutionary arguments or by bounded rationality) and are consistent with the induction analysis, that would challenge the cooperation-friendly view.

  **Crux (c): Analogy with the Surprise Examination Paradox**

  - **Shared Argument**: The centipede game’s backward induction argument has been compared to the surprise examination paradox (where a teacher announces an exam next week that will surprise the students, but the students reason backward to conclude it cannot occur, and then it does). Is this a deep analogy? Does it support one side?

  - **Orthodox Theorist Prediction**: The analogy is superficial. In the centipede game, the backward induction is a decision-theoretic argument for rational play, while the surprise exam is an epistemic paradox about knowledge and time. The centipede game does not involve a contradiction in the same way because the players are not making a prediction about their own future actions. The backward induction argument is sound.

  - **Cooperation-Friendly Theorist Prediction**: The analogy is deep. Both involve a backward argument that seems to show an event cannot occur (passing beyond the first node, the exam occurring without surprise) because it would be anticipated and prevented. But if the event does occur, it is because the reasoning was preempted. This highlights that the backward induction argument, like the surprise exam argument, relies on an assumption (common knowledge of rationality, the teacher's announcement) that is undercut by the very event it rules out.

  - **What would count as evidence against each view?**
    - *Orthodox*: If it can be shown that the centipede game backward induction leads to a logical contradiction (like the surprise exam) even in a formal model, that would challenge the orthodox view.
    - *Cooperation-Friendly*: If a clear disanalogy is found (e.g., the centipede game does not involve self-reference or time-based prediction in the same way) that breaks the parallel, that would challenge the cooperation-friendly view.

  **Additional Crux (d): Experimental Variations**

  - **Shared Experiment**: We propose a series of experiments to test the robustness of passing behavior:
     - (i) *High Stakes*: Play the game with very high monetary rewards (e.g., hundreds of dollars) to see if passing still occurs.
     - (ii) *Long Centipede*: Use a centipede with many nodes (e.g., 20) to see if passing persists or if players take earlier.
     - (iii) *Repeated Play with Feedback*: Have subjects play multiple rounds (with the same partner or rematched) and provide feedback after each round. Track convergence.
     - (iv) *Pre-Screened Competence*: Announce to subjects that their opponent has been pre-screened for high computational ability (e.g., solved a logic puzzle) to boost common knowledge of rationality.

  - **Orthodox Theorist Prediction**: 
     - (i) High stakes will reduce passing (taking at node 1 or 2 becomes more common).
     - (ii) In long centipedes, subjects will take earlier (because the backward induction logic is more compelling or because the risk of loss is greater).
     - (iii) With repeated play, subjects will learn to take earlier, converging to node 1.
     - (iv) Pre-screening will reduce passing (because it enhances common knowledge of rationality).

  - **Cooperation-Friendly Theorist Prediction**: 
     - (i) High stakes may reduce passing but not eliminate it (because passing can be rational under uncertainty).
     - (ii) In long centipedes, passing might still occur in early nodes (as players might hope to build trust).
     - (iii) Repeated play may lead to more taking, but not necessarily to node 1 (e.g., a norm of passing a few times might emerge).
     - (iv) Pre-screening might reduce passing but not eliminate it (because even rational players might pass if they believe the other might be an altruist, or because of forward induction reasoning).

  - **What would count as evidence against each view?**
     - *Orthodox*: If in any of these treatments (especially high-stakes, pre-screened, or repeated play) a significant number of pairs pass beyond the first few nodes (e.g., beyond node 3 in a 6-node game) without converging to taking at node 1, that would challenge the orthodox view.
     - *Cooperation-Friendly*: If in the high-stakes, pre-screened, or repeated play treatments, passing vanishes entirely and play converges to taking at node 1, that would challenge the cooperation-friendly view.

  **4. Closing Paragraph**

  Both parties agree that empirical results from the proposed experimental variations (Crux d) could move the debate. Specifically, if under conditions designed to maximize common knowledge of rationality and stakes (high-stakes, pre-screened, repeated play), passing beyond the first node is virtually eliminated and play converges to taking at node 1, the cooperation-friendly theorist would concede that their view is weakened. Conversely, if robust passing persists in these conditions, the orthodox theorist would concede that their model requires additional factors (like uncertainty about types) to explain behavior, and that such passing might be rational under those conditions.

  The orthodox theorist candidly states that no empirical observation could falsify the backward induction argument under the ideal conditions of full common knowledge of rationality and payoffs, because such conditions are never perfectly achieved in experiments. However, they concede that if passing occurs even in settings that approximate these conditions as closely as possible, it would challenge the practical relevance of the argument.

  The cooperation-friendly theorist states that no argument based solely on the full common knowledge model could convince them that passing is irrational, because they believe the model is inherently inconsistent. However, they concede that if the experimental variations show that passing is eliminated when uncertainty is minimized, then in the limit of full common knowledge, passing might indeed be irrational.

  Both parties agree that further theoretical work on the stability of common knowledge off-path (Crux a) and on the foundations of incomplete-information models (Crux b) is essential to resolving the debate.

