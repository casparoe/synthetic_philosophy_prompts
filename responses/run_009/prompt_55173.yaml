prompt: |-
  I referee a lot for a mid-tier cognitive science journal — probably fifteen manuscripts a year, and realistically I can spend two or three hours per manuscript, tops, before the editor needs a recommendation (reject / major revisions / minor revisions / accept) plus some indication of how confident I am. Here's what's been eating at me, and I want you to actually operationalize it rather than give me a philosophy lecture.

  At the last editors' meeting the EiC shared some numbers: across the journal, two referees for the same manuscript agree on the basic accept-or-reject call only slightly more often than chance (around 60%), and when referees disagree, the editor basically flips a coin. I also did a little audit of my own track record: out of my last twenty-ish recommendations where I was confident enough to argue hard in my report, roughly a third got overruled by the editor or torn apart by the other referee in a way I had to concede was fair. So now I'm sitting on evidence about the reliability of my own evidence, which I gather the philosophers call higher-order evidence. The way I see it I've got two moves: either I move my opinion toward the other referee's before I even see it (some kind of averaging thing), or I trust my first-order read of the paper and just slap a discount on when I report confidence to the editor. But I suspect both of those are wrong in different ways, and I've heard there's a whole debate about epistemic akrasia — whether you're allowed to believe P with full strength while also believing your belief in P is unreliable — that's relevant here.

  Act as a professional epistemologist who has also served as an associate editor, so you know both literatures. Please turn whatever the epistemology of higher-order evidence and disagreement actually says into a procedure I can run while refereeing. Concretely:

  - Start with a short brainstorm: list the candidate principles people have proposed for handling higher-order evidence and peer disagreement, and say which ones survive my constraints and which die there.
  - Then give me the procedure: the questions I ask myself, in order, while reading a manuscript; what counts as a sufficient answer to each; where the procedure forces me to lower the confidence I report vs. where it leaves my actual belief alone; and the points where nothing principled decides it and you're just handing the judgment back to me — flag those honestly, don't dress up my judgment calls as procedure.
  - It has to fit on one page and run in about ten minutes at the end of a review. It may never output "withhold judgment" — the editor needs a call and a number.
  - Then run it on three manuscripts I've actually had recently (details as I remember them): (1) a competent but boring study in an area I know cold, where I'm probably the right referee; (2) a flashy result that directly challenges my own theoretical paradigm, and I could feel my blood pressure rising while I read it; (3) a paper whose methods I genuinely don't understand, but by a famous group whose previous work I've always found rock solid, so my instinct was to trust it. 
  - For each, tell me what the procedure outputs, and make sure at least one of them is a case where the procedure makes me do something I won't like. Also tell me where you think the procedure will misfire — what kinds of referees or situations it's just wrong for.

  Think carefully and go step by step, don't just pattern-match to "be calibrated." If a step of the procedure rests on a contested philosophical point, say which one and which way you resolved it.
reasoning: |-
  Okay, the user is a referee for a mid-tier cognitive science journal who handles about 15 manuscripts per year. They have limited time—only 2-3 hours per review—and need to make decisions quickly. The editor shared that referees agree on accept/reject decisions only about 60% of the time, and disagreements are often resolved arbitrarily. The user audited their own track record and found that about a third of their confident recommendations were overruled, which introduces higher-order evidence about their own reliability.

  They're looking for a concrete procedure to integrate this higher-order evidence into their reviewing process without getting bogged down in philosophical debates. The main constraints are: it must fit on one page, take about 10 minutes at the end of a review, and always output a decision with a confidence level—no "withhold judgment." They also want examples applied to three real manuscripts they've encountered.

  First, I need to outline candidate principles from epistemology on handling higher-order evidence and peer disagreement. Key principles include:
  - Conciliationism (e.g., Christensen): when peers disagree, both should move toward the other's view.
  - Steadfastness (e.g., Kelly): stick to your first-order judgment if you have good reasons.
  - Total Evidence View (e.g., Feldman): combine first-order and higher-order evidence.
  - Equal Weight View: average peer opinions.
  - Calibrationism: adjust confidence based on reliability estimates.

  Now, evaluate these against the user's constraints:
  - Time is limited, so complex calculations are out. Equal Weight and detailed Calibrationism are impractical.
  - The user isn't always a true peer; sometimes they're more expert, sometimes less. Equal Weight assumes peer status, which isn't always true.
  - The editor needs a decision, so withholding judgment isn't an option. This rules out principles that lead to suspension of belief.
  - Total Evidence View is feasible if simplified: use reliability estimates as a discount factor.

  A hybrid approach makes sense: use a reliability discount on confidence without changing the first-order belief, except in cases of known bias or incompetence. This avoids akrasia by separating the belief strength from the reported confidence.

  Next, design the procedure. It should have clear steps:
  1. **First-Pass Assessment**: Read the paper, form an initial verdict and confidence (1-5 scale).
  2. **Self-Audit for Bias/Competence**: Check for emotional reactions, expertise gaps, or methodological unfamiliarity. If bias is present, downgrade confidence significantly. If competence is solid, confidence stays.
  3. **Apply Reliability Discount**: Multiply confidence by a reliability factor (e.g., 0.7 based on their 67% accuracy). Adjust for situational factors.
  4. **Output Decision**: Report the original verdict with discounted confidence.

  For the examples:
  1. **Competent but Boring Study**: User knows the area well. Initial confidence high. No bias detected. Discount applies, but confidence remains moderate.
  2. **Flashy Result Challenging Paradigm**: Bias detected. Confidence downgraded significantly, then discounted. Verdict might be reject but with low confidence.
  3. **Incomprehensible Methods by Famous Group**: Competence issue. Trust based on past work, but methods not understood. Confidence downgraded and then discounted, leading to weak acceptance.

  The procedure might misfire for referees who over- or under-estimate their biases. Also, in cases where the user's expertise is misaligned, the discount might not be sufficient. It's a pragmatic solution, not perfect, but workable under time constraints.
answer: |-
  ### Operationalized Procedure for Handling Higher-Order Evidence in Peer Review  
  *Designed for 10-minute runtime, 1-page max. Philosophy distilled: Hybrid "Calibrated Steadfastness" (Feldman/Christensen) — retain first-order belief but discount reported confidence using reliability data, except when bias/ignorance forces belief revision. Akrasia avoided by decoupling belief strength from actionable output.*

  ---

  ### **Brainstorm: Candidate Principles & Viability**  
  1. **Conciliationism** (Christensen): *Move toward peer's view preemptively.*  
     - **Dies:** Assumes true "peer" status (often false in mid-tier journals; you may be more/less expert). Also impractical — you lack the other report.  
  2. **Steadfastness** (Kelly): *Ignore higher-order evidence; trust your first-order read.*  
     - **Survives (partially):** Core of your expertise, but ignores your 67% track record (±33% error). Naïve under constraints.  
  3. **Equal Weight** (Elga): *Average your view and imagined peer's view.*  
     - **Dies:** Requires knowing the other report. Also, mathematically clunky (what weight? 50/50? Why?).  
  4. **Total Evidence** (Feldman): *Combine first-order + reliability data probabilistically.*  
     - **Survives (adapted):** We use your reliability as a confidence discount *after* bias checks. Fits time limits.  
  5. **Calibrationism** (Schoenfield): *Calibrate confidence to match accuracy.*  
     - **Survives (simplified):** Your 67% accuracy → cap confidence at 0.67 weight. But context-dependent (e.g., bias lowers it further).  

  **Winning Hybrid:** **Calibrated Steadfastness** — Keep your verdict, but apply a confidence discount (0.67 base) *unless* self-audit reveals bias/ignorance. Justified by Feldman (total evidence) + Kelly (defeasible steadfastness). Avoids akrasia: your *belief* stays intact; only *reported confidence* drops to respect reliability.

  ---

  ### **The 10-Minute Procedure**  
  *Ask these questions post-read, in order. Use 1–5 confidence scale (1=guess, 5=certain).*  

  1. **FIRST-PASS ASSESSMENT (2 mins):**  
     - *Q1: Verdict?* Reject (R) / Major Rev (MR) / Minor Rev (MRv) / Accept (A).  
     - *Q2: Raw confidence (1–5)?* Based on strength of evidence, methods, fit with field.  
     - *Sufficient answer:* Gut reaction. No overthinking.  

  2. **SELF-AUDIT FOR BIAS/INCOMPETENCE (4 mins):**  
     - *Q3: Did I feel strong negative/positive emotions?* (e.g., anger, excitement)  
       - **Yes →** Downgrade confidence by 2 points. *Philosophy: Higher-order evidence of motivated reasoning (Christensen).*  
       - **No →** Proceed.  
     - *Q4: Is this outside my core expertise?* (e.g., unfamiliar methods, fringe topic)  
       - **Yes →** Downgrade confidence by 1 point.  
       - **No →** Proceed.  
     - *Q5: Could I explain flaws/strengths to a grad student?*  
       - **No →** Verdict shifts to "Major Revisions" (if A/MRv) or "Reject" (if R). Confidence = 1. *Philosophy: Ignorance forces belief revision (Kelly defeasibility).*  
       - **Yes →** Proceed.  

  3. **RELIABILITY DISCOUNT (2 mins):**  
     - *Q6: Apply base discount.* Multiply current confidence by 0.67 (your track record). Round to nearest integer.  
     - *Q7: Adjust for context:*  
       - If bias/incompetence flagged in Q3–Q4, multiply by *additional* 0.8.  
       - If paper is in your "sweet spot" (e.g., 5+ past reviews accepted unchallenged), multiply by 1.1 (max 5).  
     - *Output confidence = Adjusted score (1–5).*  

  4. **FINAL OUTPUT (2 mins):**  
     - Report: **Verdict** (from Q1, unless Q5 changed it) + **Confidence** (from Q7).  
     - *Philosophy note:* Belief remains steadfast (no akrasia), but confidence is discounted for editor. Judgment calls occur at Q3–Q5 — that's where *you* decide if bias/ignorance overrides.  

  ---

  ### **Procedure Applied to Your Cases**  
  *Base discount: 0.67. Confidence scale: 1–5.*  

  1. **Competent but Boring Study (Your Sweet Spot):**  
     - Q1: **A (Accept)**. Q2: Confidence **5** (expert, solid methods).  
     - Q3: No bias → no change. Q4: No incompetence → no change. Q5: Explainable → no change.  
     - Q6: 5 × 0.67 = **3.35 → 3**. Q7: "Sweet spot" → 3 × 1.1 = **3.3 → 3**.  
     - **Output: Accept with confidence 3.** *You won't like this — feels too low for expertise. But reliability discount forces humility.*  

  2. **Flashy Result Challenging Your Paradigm:**  
     - Q1: **R (Reject)**. Q2: Confidence **4** (methodological flaws detected).  
     - Q3: **Yes** (blood pressure rising → bias) → confidence -2 → now **2**.  
     - Q4: No incompetence → no change. Q5: Explainable → verdict stays **R**.  
     - Q6: 2 × 0.67 = **1.34 → 1**. Q7: Bias flagged → 1 × 0.8 = **0.8 → 1** (min 1).  
     - **Output: Reject with confidence 1.** *Makes you downgrade aggressively — corrects for emotional bias.*  

  3. **Incomprehensible Methods by Famous Group:**  
     - Q1: **A (Accept)**. Q2: Confidence **4** (trust based on reputation).  
     - Q3: No bias → no change. Q4: **Yes** (methods unclear) → confidence -1 → now **3**.  
     - Q5: **No** (couldn't explain methods) → verdict shifts to **MR (Major Revisions)**. Confidence = **1**.  
     - Q6: 1 × 0.67 = **0.67 → 1**. Q7: No further adjustment.  
     - **Output: Major Revisions with confidence 1.** *Forces you to reject instinct to trust reputation — Q5 overrides.*  

  ---

  ### **Where the Procedure Misfires**  
  - **For chronic over/under-confident referees:** The 0.67 discount assumes average miscalibration. If you’re systematically overconfident (e.g., 40% accuracy), it under-penalizes.  
  - **When "famous group" effect is rational:** Sometimes trusting proven labs *is* epistemically sound (e.g., Bayesian priors). The procedure ignores this in Q5.  
  - **High-stakes disagreements:** If editors consistently side against you in paradigm wars, additional discounting may be needed (not built-in).  
  - **Novel methods:** Forces rejection if you can’t explain methods (Q5), penalizing innovation.  

  **Final Reality Check:** This is a *pragmatic heuristic*, not truth-tracking perfection. It minimizes arbitrariness by systematizing reliability data + bias checks, but judgment calls at Q3–Q5 are unavoidable. Run it post-review to avoid anchoring.
