  Hmm, Maya's point about pragmatic vs semantic levels feels solid - the sentence isn't contradictory, but asserting it creates weirdness. Dan's diary case is clever though! Writing "it rained yesterday but I never believed it" in a future-facing diary works fine, unlike saying it live. That does suggest something special about first-person present belief claims. 

  But Maya fires back hard - she's right that "I don't believe X" isn't some magic truth-ensuring phrase. People get self-deception wrong all the time! Dan might be conflating the absurdity of assertion with the words not functioning as belief reports. 

