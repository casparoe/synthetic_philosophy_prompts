  Point 2 is Dana's strongest - selective information seeking is well-documented in psychology as confirmation bias. But Rob's right that this doesn't necessarily create full belief. They're talking past each other about degrees of conviction.

  Ah, point 4 reveals the core issue: Dana thinks partial belief counts as deception, while Rob demands complete false belief. The temporal argument in point 5 is clever but oversimplifies - our "selves" aren't neatly sequential.

