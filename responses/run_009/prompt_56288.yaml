answer: |-
  ### Kantian Universalizability in Decision-Theoretic Terms  
  **Translation Table**  

  | Kantian Element           | Decision-Theoretic Rendering                                                                 | Status       | Note on Distortion                                                                 |
  |---------------------------|----------------------------------------------------------------------------------------------|--------------|------------------------------------------------------------------------------------|
  | **Maxim**                 | A **policy** (decision rule) for a class of situations, e.g., "If in financial need, lie to secure a loan." | Clean        | Direct correspondence. Policies are Kant's maxims operationalized.                |
  | **Universalization Step** | Simulate a world where **all relevant agents run identical policies** (UPA: Universal Policy Adoption). | Distorted    | Kant assumes UPA applies to *all rational agents*, but DT requires specifying "relevant agents" (e.g., those in similar roles). We add that agents are symmetric. |
  | **Contradiction in Conception** | UPA creates **institutional collapse** or **logical incoherence**, making the policy impossible to act upon. | Clean        | Example: Universal lying destroys promise-keeping institutions. No added assumptions. |
  | **Contradiction in Will** | UPA creates a **Pareto-dominated world** or **undermines necessary conditions for agency**, making it instrumentally irrational to will. | Distorted    | Kant doesn't assume agents care about Pareto efficiency; we add instrumental goals (e.g., well-being) as "necessary conditions." |
  | **Perfect Duty**          | Prohibition of policies that cause **institutional collapse** under UPA (e.g., lying, theft). | Clean        | Maps to strict, exceptionless rules from contradiction in conception.             |
  | **Imperfect Duty**        | Obligation to adopt policies that prevent **collective self-sabotage** under UPA (e.g., beneficence). | Distorted    | Kant's "latitude" (discretion in fulfilling duties) lacks a DT equivalent. We add payoff structures to justify non-strictness. |
  | **Testing Maxim (Not Act)**| Evaluates **rules, not acts**—consistent with DT’s focus on policies over isolated choices. | Clean        | Faithful translation; both reject act-consequentialism.                          |

  ---

  ### Residue Report  
  **What Failed to Translate Cleanly**  
  1. **Universalization’s Agent Symmetry**:  
     - Kant assumes all rational agents are identical in their reasoning and obligations. DT requires explicit symmetry assumptions (e.g., agents face identical payoff matrices) to justify UPA. Without this, universalizing a maxim isn’t game-theoretically coherent.  
     - *Residue*: Kant’s universality is metaphysical (all rational wills *are* identical), whereas DT treats it as a contingent modeling choice.  

  2. **Contradiction in Will’s "Necessary Conditions"**:  
     - Kant argues we "necessarily will" conditions like human flourishing or talent development, making their absence a contradiction. DT renders this as avoiding Pareto-dominated outcomes (e.g., no one helping anyone).  
     - *Residue*: Kant’s necessity derives from rationality itself; DT reduces it to instrumental goals (e.g., survival/well-being as preconditions for agency). This bends Kant toward consequentialism.  

  3. **Imperfect Duties and Latitude**:  
     - Kant’s imperfect duties (e.g., beneficence) permit discretion in *how* and *when* to act. DT can explain *why* we adopt a duty (to avoid collective self-harm) but not *how much* is owed.  
     - *Residue*: DT lacks a concept of "sufficient effort" (e.g., "help sometimes" vs. "optimize help"). Kant’s latitude is grounded in judgment, not payoff calculations.  

  **Verdict on Residue**  
  **Decision theory is missing something**. Kant’s framework exposes two blind spots in DT:  
  - **The Source of Normativity**: Kant’s tests derive duties from the structure of rationality itself (e.g., a contradiction violates the essence of a rational will). DT can only replicate this by smuggling in goals (e.g., "you need institutions to survive"), which are contingent.  
  - **Non-Instrumental Value**: The contradiction in will isn’t just about payoffs; it’s about *what a rational being can consistently will*. DT reduces "willing" to preference satisfaction, but Kant treats rationality as an end-in-itself.  

  However, **Kant was less clear than he looks**: His examples (e.g., lying promises) tacitly rely on game-theoretic dynamics (e.g., commons problems). When stripped of metaphysical baggage, his tests largely reduce to DT with symmetry assumptions. The residue—rationality as an intrinsic end—is profound but underdeveloped in Kant; it points to a gap in *both* frameworks.  

  ---

  ### Suspicion Verdict  
  **Your hunch is mostly right**: Kant’s universalizability is indeed decision theory in antique clothing—specifically, **functional decision theory** (FDT) applied under universal policy adoption. His examples cleanly map to game-theoretic dilemmas (e.g., tragedy of the commons). However, Kant’s insistence on *rationality as an end* resists reduction to payoff maximization, revealing a limit to DT’s expressive power.  

  ---

