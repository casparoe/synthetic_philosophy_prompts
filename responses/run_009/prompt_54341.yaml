prompt: |-
  I work on a technical standards committee that has to write definitions containing vague predicates — when a system is "reliable enough" to be fielded, when a model is "sufficiently interpretable" to satisfy a disclosure rule, when a concentration is "excessive" for a given zone — and I've noticed something that unsettles my amateur's understanding of the vagueness literature. The philosophy I half-remember, built around the sorites paradox, seems organized around explaining why there is no sharp boundary between the heap and the non-heap, whereas the practical half of my job is legislating one: some threshold must go in the document, a number or a criterion, and people will litigate at the margin. Before I read any further in the literature, I want the specification an adequate theory of vagueness would have to meet for a purpose like mine — a theory of vagueness good enough to advise a body that must draw boundaries on purpose.

  Write the desiderata. I'd expect the list to include at least the following sorts of items, though I want you to exercise judgment about what belongs and what doesn't: which cases the theory must get right (the ordinary sorites for a vague predicate like "bald" or "rich," but also forced-boundary cases where an institution must fix a cutoff, and the interaction between them — does the legislated line change the predicate's meaning or merely its application?); what it must say about higher-order vagueness and whether a theory that eliminates it is thereby disqualified; what it owes us about the appeal of tolerance premises — why the one-grain step seems unobjectionable in a way the full induction never does, and whether a theory that treats that appeal as simple error has missed something; whether it must deliver a determinate truth-value for each marginal statement or is permitted some weaker commitment structure, and what that means for a standards body that needs a yes-or-no answer about a borderline case; and how it should handle penumbral connections (that a shade noticeably darker than a definitely dark one is dark) and context shifts (tall for a jockey versus tall for a center). For each requirement, give the case or consideration that motivates it, and be explicit about which are non-negotiable for my legislative purpose versus which are prejudices of one camp — supervaluationists, epistemicists, degree theorists, and contextualists each smuggle in demands the others rightly refuse, and I'd like that sorted out rather than papered over.

  The part I most want to see is whether some subset of the desiderata is jointly unsatisfiable: I suspect that a requirement of tolerance — that adjacent cases in a sorites series cannot be treated differently without a relevant difference — cannot coexist with the requirement that the theory bless a legislated sharp cutoff, or at least that the two can be reconciled only by an unappealing move, such as treating the legislated predicate as an artificial homonym of the vague one. If that is right, say so and say which requirement you would abandon. Then, briefly, run the main contenders — epistemicism, supervaluationism, degree or fuzzy theories, and contextualism — against the list; keep the scoring short, since the criteria are where the thinking is. And tell me which single requirement does the most work in excluding candidates, because that will tell me which literature to read first.
reasoning: |-
  Okay, the user works on a technical standards committee dealing with vague predicates like "reliable enough" or "excessive concentration." They've noticed a gap between the philosophical literature on vagueness, which focuses on the lack of sharp boundaries (like in the sorites paradox), and their practical need to set precise thresholds in standards documents. This creates tension because while philosophy says there's no clear line, their job requires drawing one, leading to potential litigation at the margins.

  The user wants a set of desiderata for a theory of vagueness that can advise a standards body. They specifically mention several key issues: handling ordinary sorites cases and forced-boundary scenarios, addressing higher-order vagueness, explaining the appeal of tolerance premises, providing determinate truth-values for borderline cases, and accounting for penumbral connections and context shifts. They also suspect an incompatibility between tolerance principles and legislated cutoffs.

  Looking deeper, the user likely needs a framework that bridges theory and practice. Their committee must create enforceable standards, so philosophical purity must yield to practicality. They might be frustrated with theories that dismiss boundary-setting as artificial or ignore institutional realities. The core tension is between descriptive accuracy (how vague predicates naturally work) and prescriptive necessity (how standards must function).

  The user's unspoken needs include legitimacy for their boundary-setting work and tools to defend thresholds against legal challenges. They also need clarity on whether legislated lines change the meaning of predicates or just their application—this affects how standards interact with existing language.

  The key desiderata would include: Mandating boundary-setting capability (non-negotiable), explaining tolerance intuition without blocking legislation, handling penumbral connections (non-negotiable for coherence), allowing context sensitivity, navigating higher-order vagueness, and providing application determinacy. The tolerance-legislation conflict is critical—theories must reconcile why small steps seem indistinguishable but large differences exist.

  Assessing theories: Epistemicism accepts sharp boundaries but struggles with tolerance. Supervaluationism handles penumbral connections but makes boundary-setting arbitrary. Degree theories assign partial truth but face collapse issues. Contextualism handles context shifts but may not resolve institutional thresholds. The tolerance-legislation conflict is the major filter, eliminating theories that can't justify imposed boundaries. Supervaluationism and contextualism fare best here, though imperfectly. The user should prioritize literature addressing this tension—legal/pragmatic approaches to vagueness may offer more than pure philosophy.
answer: |-
  Here are the desiderata for an adequate theory of vagueness in your legislative context, distilled from your requirements and ranked by criticality for your purpose. The non-negotiable core must reconcile **descriptive accuracy** (how vagueness works naturally) with **prescriptive feasibility** (how standards must function). I'll flag irreconcilable tensions explicitly.

  ---

  ### **Core Desiderata (Non-Negotiable for Legislation)**
  1.  **Mandated Boundary-Setting Capability:**  
      *   **Motivation:** Technical standards *require* precise thresholds (e.g., "≥ 95% uptime = reliable enough"). The theory must legitimize this practice without rendering the predicate incoherent or nonsensical.  
      *   **Non-Negotiable:** Yes. A theory that forbids sharp boundaries (e.g., radical nihilism) is useless for standards work.  
      *   **Key Tension:** Does the legislated line *change the meaning* of the predicate (e.g., creating a technical homonym) or merely *regulate its application* under the rule? The latter is preferable for legitimacy.

  2.  **Tolerance Intuition Explained (without Blocking Legislation):**  
      *   **Motivation:** Why does "one grain makes no difference" seem compelling, while "one grain makes a heap" is absurd? The theory must explain this intuitive "small change" tolerance *without* entailing that no sharp cutoff can exist (which would sabotage legislation).  
      *   **Non-Negotiable:** Yes. Dismissing tolerance as mere "error" undermines the predicate's intuitive grip and invites resistance.  
      *   **Key Tension:** Reconciling tolerance with legislated boundaries is the **central paradox for your work**. A theory must show why tolerance is defeasible *in principle* (allowing legislation) but *pragmatically compelling* in unregulated contexts.

  3.  **Penumbral Connection Preservation:**  
      *   **Motivation:** Core logical relations must hold (e.g., "If Patch A is darker than Patch B, and B is definitely dark, then A is dark"). Standards can't violate these without being logically incoherent.  
      *   **Non-Negotiable:** Yes. Violating penumbral connections makes definitions irrational and legally vulnerable.

  4.  **Context Sensitivity:**  
      *   **Motivation:** "Tall" means different heights for jockeys vs. centers. Standards often define context (e.g., "excessive for residential zones"). The theory must allow predicates to shift application conditions with context.  
      *   **Non-Negotiable:** Yes. Standards are inherently context-defining instruments.

  ---

  ### **Important but Negotiable Desiderata**
  5.  **Higher-Order Vagueness (HOV) Management:**  
      *   **Motivation:** Is there vagueness *about* the borderline cases themselves? Radical HOV threatens any boundary. A theory needn't *eliminate* HOV, but must *contain* it sufficiently to allow workable legislation.  
      *   **Non-Negotiable?** No. Theories can differ (e.g., epistemicism denies HOV; supervaluationism embraces it). What matters is that HOV doesn't make legislation impossible or arbitrary *in practice*. A theory that *dissolves* HOV pragmatically (e.g., via context) may be acceptable.

  6.  **Application Determinacy under the Standard:**  
      *   **Motivation:** Once a standard sets a boundary (e.g., >50 ppm = "excessive"), the theory must deliver *determinate truth values* for specific cases relative to that rule. "It's vague, so undefined" is unacceptable for enforcement.  
      *   **Non-Negotiable?** Conditionally Yes. The theory must allow that *after legislation*, "System X has >50 ppm" has a truth value. It *may* allow vagueness *before* legislation or about the *appropriateness* of the rule itself.

  7.  **Meaning Stability vs. Regulation:**  
      *   **Motivation:** Does legislating "reliable enough = ≥95% uptime" *alter the meaning* of "reliable enough" in English, or merely *specify its application* for this regulation? The latter (application-specification) is less disruptive to communication and legal interpretation.  
      *   **Non-Negotiable?** Highly Preferred. Treating legislation as meaning-change implies technical terms are artificial, weakening the link to intuitive predicates and inviting challenges.

  ---

  ### **The Critical Tension: Tolerance vs. Legislation**
  **Your suspicion is correct.** There is a fundamental tension:
  *   **Tolerance Principle:** For a vague predicate P and a Sorites series (a1, a2, ..., an), if P(a1) is true and P(an) is false, there must be some i where P(ai) is true and P(ai+1) is false *despite no relevant difference* between ai and ai+1. This seems to forbid sharp cutoffs.
  *   **Legislation Requirement:** A sharp cutoff *must* be drawn (e.g., P(ai) for all i ≤ k, ~P(ai) for all i > k).

  **Reconciliation is only possible by modifying or rejecting one:**
  1.  **Reject Tolerance as a Universal Principle:** Argue tolerance is only an approximation valid in "small enough" scales or specific contexts, but *not* a logical truth binding on legislation (Epistemicism, some Contextualism).
  2.  **Treat the Legislated Predicate as Distinct:** Argue the legislated term (e.g., "FSA-reliable") is a precise technical term *inspired by* but distinct from the vague "reliable enough" (a form of meaning-change). This severs the link to natural language tolerance.
  3.  **Make Tolerance Context-Relative:** Argue tolerance holds only within contexts where no boundary is salient; legislation *creates* a new context where tolerance is suspended at the boundary (Sophisticated Contextualism).

  **For your purpose, abandoning the *universal, binding force* of the Tolerance Principle (Option 1) is the least unappealing move.** Option 2 undermines regulatory legitimacy; Option 3 is complex but viable. A theory *must* explain why tolerance seems compelling while allowing its defeasibility by authority/context.

  ---

  ### **Scoring Major Theories Against Desiderata**
  | Theory             | Mandated Boundary | Tolerance Explained | Penumbral Connections | Context Sensitivity | HOV Managed | App Determinacy (Post-Leg.) | Meaning Stable? | Notes for Your Purpose                                                                 |
  | :----------------- | :---------------- | :------------------ | :-------------------- | :------------------ | :---------- | :-------------------------- | :-------------- | :------------------------------------------------------------------------------------- |
  | **Epistemicism**   | ✅ (Sharp cutoffs exist) | ⚠️ (Explains appeal as ignorance; tolerance is false) | ✅ (Bivalent logic holds) | ❌ (Rigid boundaries) | ❌ (Denies HOV exists) | ✅ (Yes/No answers) | ✅ (Meaning unchanged) | **Pro:** Legitimizes boundaries naturally. **Con:** Brittle context shift; dismisses tolerance intuition harshly. |
  | **Supervaluationism** | ⚠️ (Boundaries set arbitrarily in precisifications) | ⚠️ (Tolerance true in each precisification, false overall) | ✅ (Defined by all precisifications) | ⚠️ (Via varying precisifications) | ✅ (Embodies HOV) | ❌ (Borderlines lack truth-value) | ✅ (Meaning based on all precisifications) | **Pro:** Best penumbral logic. **Con:** Post-legislation determinacy requires *stipulating* truth-value at boundary, feeling ad hoc. Truth-value gaps problematic for enforcement. |
  | **Degree/Fuzzy**   | ❌ (Only partial truth, no sharp line) | ⚠️ (Small changes = small truth-value drops) | ❓ (Often violates: "dark" & "darker" can have equal degrees) | ✅ (Degree thresholds vary) | ❌ (Radical HOV) | ❌ (Only degrees of truth) | ❓ (Meaning = fuzzy set) | **Pro:** Matches intuitions of partial applicability. **Con:** Cannot mandate sharp boundaries without abandoning core; penumbral issues; degrees impractical for yes/no enforcement. |
  | **Contextualism**  | ⚠️ (Cutoffs context-dependent) | ✅ (Tolerance holds *within* a context; shifts explain boundaries) | ✅ (Handled within context) | ✅ (Core feature) | ✅ (Via context shifts) | ⚠️ (Determinate within fixed context) | ✅ (Meaning stable, application context-sensitive) | **Pro:** Best on tolerance/context. **Con:** Legislation needs a *stable*, *non-shifting* context. Can it *fix* a context universally? Explaining *why* legislation fixes context is crucial. |

  ---

  ### **Which Requirement Excludes the Most?**
  **The Tolerance-Legislation Reconciliation Requirement** does the most work in excluding candidates or highlighting their weaknesses:
  1.  **Degree Theories:** Fail fundamentally (no sharp boundaries possible).
  2.  **Naive Supervaluationism:** Struggles with post-legislation determinacy and makes boundary-setting seem arbitrary.
  3.  **Epistemicism:** Barely passes but treats tolerance as a massive error, which feels inadequate.
  4.  **Contextualism:** Best positioned (tolerance is contextually valid, legislation fixes context) but requires careful development to show how legislation *freezes* context authoritatively.

  **Your Reading Priority:** Focus on **Contextualist theories of vagueness** (e.g., Raffman, Shapiro) and **pragmatic/legal approaches** to boundary-setting. Contextualism offers the most promising framework for reconciling natural language vagueness with your need to stipulate context-sensitive boundaries. Then, examine critiques of contextualism regarding the stability of legislated contexts and its handling of penumbral connections under fixed contexts. Supplement with work on the *normativity* of standards (how rules create their own context of application). Epistemicism is worth understanding as the main alternative emphasizing boundaries, but its dismissal of tolerance is a significant practical liability for justifying standards to non-experts. Avoid degree theories – they are philosophically interesting but operationally incompatible with your mandate.
