  2. Evidence interpretation: What constitutes proof of sentience? Behavioural responses could be reflexive or indicate subjective experience.
  3. Moral weight under uncertainty: Should we use expected value calculations (probability × magnitude) or apply thresholds/rights that block this?
  4. Comparative moral weight: How does insect suffering compare to vertebrate or human suffering?
  5. Practical implications: Does potential sentience obligate us to change behaviour in pest control, conservation, or charity?
  6. Epistemic limitations: How do we handle radical uncertainty where evidence is scarce?

