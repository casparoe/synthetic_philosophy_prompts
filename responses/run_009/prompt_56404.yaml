  - The moral uncertainty calculation method

  For leaves, I'll identify positions like strong insect ethicists, threshold theorists, and moral skeptics, each with an "awkward commitment" - their hardest pill to swallow.

  Special notes to add:
  1. Overlapping leaves I couldn't separate (e.g. due to shared conclusions)
  2. Unoccupied positions and why they're untenable
