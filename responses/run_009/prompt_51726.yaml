answer: |-
  Here's the analysis structured as requested, focusing strictly on the Nomic mapping and its limits:

  **1. Relied-Upon Facts (~150 words)**  
  India's Constitution under Article 368 permits Parliament to amend any provision without explicit textual limitations. In *Golak Nath* (1967), the Supreme Court held that amendments affecting Fundamental Rights could be struck down. Parliament responded with the 24th Amendment (asserting amending power over Fundamental Rights) and the 25th Amendment (curtailing property rights). In *Kesavananda Bharati* (1973), a 13-judge bench ruled 7-6 that while Parliament could amend any constitutional provision, it could not alter the "basic structure" of the Constitution – an unenumerated, judicially identified core of principles (like democracy, judicial review, secularism) deemed unamendable. This doctrine was later used to invalidate constitutional amendments.

  **2. The Nomic Mapping (~400 words)**  

  *   **Players:**  
      *   *Parliament:* Initiates "moves" by proposing constitutional amendments (equivalent to proposing mutable rule changes).  
      *   *Supreme Court (as institution):* Acts as referee, validating or invalidating moves (amendments).  
      *   *Judicial Factions (7-6 Split):* Internal players within the referee, competing to define the rules of validation and the very scope of the amendment rule itself.  

  *   **Moves:**  
      *   *Amendment Passed by Parliament:* Proposal to change a mutable rule (any constitutional provision).  
      *   *Judicial Review (Original):* Referee (Court) checks if the move follows the amendment procedure (Article 368) – akin to verifying a proposal meets mutable rule-change criteria.  
      *   *Judicial Review (Post-Kesavananda):* Referee *also* checks if the move violates an immutable rule (the basic structure), even though the initial rules didn't specify any.  
      *   *Doctrinal Innovation (Basic Structure):* The referee faction (7 judges) declaring a *new* set of immutable rules mid-game.  

  *   **Immutable/Mutable Split:**  
      Suber's design requires an immutable core (procedural rules for change) to prevent self-destruction. India's text lacked this split; **everything was mutable** via Article 368. *Kesavananda* **invents the immutable tier** where none textually existed. The "basic structure" becomes the unamendable meta-rule, constraining the amendment procedure itself. This is *not* importing from outside like a player declaring new immutables; it's the **referee retroactively imposing immutability** onto the game, reinterpreting the amendment rule (Article 368) as inherently *containing* a limitation it never stated. The 7-judge faction successfully argued that the *entire system's logic* demanded an immutable core for coherence, mirroring Suber's design necessity.

  **3. Where the Game Analogy Breaks (~300 words)**  

  Nomic's clean analogy falters in three critical ways regarding legitimacy and consent:  

  1.  **Initial Consent & Rule Source:** Nomic players explicitly consent to starting rules *as the game's foundation*. A constitution's legitimacy stems from popular sovereignty or historical founding acts, not ongoing player consent. The Court's invention of the basic structure wasn't a move *within* universally agreed rules; it was a **contestation over the ultimate source of constitutional authority** itself (Parliament's derived power vs. the Court as guardian of the founding vision).  

  2.  **The Referee's Legitimacy:** In Nomic, the referee's role and authority are defined and accepted by the initial rules. In *Kesavananda*, the Court's power to strike down constitutional amendments – especially based on an unwritten doctrine – was **the core contested issue**. The referee's legitimacy and scope of power *were the stakes of the game*, not a settled premise. The 7-6 split highlights this fragility; the referee was deeply divided on its own foundational authority.  

  3.  **Winning & System Purpose:** Nomic has defined victory conditions. Constitutional systems lack "winners"; the goal is enduring governance, stability, and rights protection. *Kesavananda* wasn't about winning the game but **preserving the system** from perceived existential threats (Parliamentary absolutism). The "move" (inventing basic structure) was justified as necessary for the *system's survival*, a motivation absent in Nomic's win-focused play. The absence of a clear "end" changes the nature of rule-breaking moves.

  **4. What the Case Says Back to Nomic (~250 words)**  

  *Kesavananda* strongly suggests that **any functioning self-amending system operating at scale *requires* an immutable core** to prevent self-destruction or tyranny, validating Suber's design logic. India's textual mutability of everything was unsustainable; the Court *had* to imply an unamendable limit to make the system coherent. However, it reveals a crucial gap in Nomic: **how the immutable core is established and maintained.**  

  Nomic assumes immutables are fixed at the start by consent. *Kesavananda* shows that in real, contested systems:  
  1.  The immutable core **may not be explicit** but must be **discovered or constructed** to prevent collapse.  
  2.  Its identification is **inherently political and institutional**, not purely logical. The 7-6 vote underscores this – the doctrine emerged from a power struggle *within* the referee.  
  3.  **Legitimacy is retroactive.** The basic structure doctrine gained acceptance post-Emergency not solely through logical necessity, but because Parliament's actions validated the Court's fears, making the Court's "move" *seem* necessary for system preservation. The "rules" (the doctrine's validity) were partly authored by who won the subsequent institutional conflict and how events unfolded. Nomic's static initial consent can't model this dynamic legitimation process.

  **5. Verdict (~100 words)**  

  *Kesavananda* confirms Suber's insight: a purely mutable constitution is unstable, necessitating an implicit or explicit immutable core. However, it exposes that **the source and legitimacy of that core are inherently contested.** The Indian Court didn't import rules from outside; it performed an **internal reinterpretation** of the amendment power as logically constrained, driven by systemic necessity. Yet, the doctrine's survival depended less on pure logic and more on winning the institutional conflict and subsequent events proving its perceived necessity. Nomic illuminates the *need* for immutability but cannot model the messy, retroactive *legitimation* of that immutability in a contested real world.
