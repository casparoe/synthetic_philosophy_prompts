prompt: |-
  Longtime reader here — SSC since like 2015, ACX now, LessWrong when I'm feeling brave — and somewhere along the way I picked up a YIMBY arc and started actually going to my city council's zoning meetings. I need help predicting a vote, and I suspect the interesting part is figuring out what rule the council is even running, because their track record so far doesn't pin it down.

  Their verdicts, in rough order:

  1. Approved upzoning a commercial arterial from 2 stories to 6, over the business association's objections, because it's next to the light rail station.
  2. Approved backyard cottages / ADUs (up to 2 units) citywide with basically zero fight.
  3. Rejected a 5-story, 80-unit apartment building that would've replaced two houses at the edge of a single-family neighborhood. Reasons given: parking, shadows, "character of the area." Organized neighbor opposition, like 40 people in matching shirts.
  4. Approved a 200-unit mixed-use tower downtown after the developer agreed to 15% below-market units and funded a traffic study or crosswalk or whatever.
  5. Rejected converting the municipal golf course to housing, 6-0. Open space concerns, and notably there weren't even organized neighbors on this one, just the parks commission being mad.
  6. Approved a 60-bed shelter in a light industrial zone, over scattered opposition, because "there's nowhere else zoned for it."

  The new case: a church wants to build 70 units of income-restricted affordable housing on its own surface parking lot. The lot is technically in a single-family zone (churches get weird zoning), one block off the arterial, no transit station nearby. Church leadership is fully on board, the units are at 60% of area median income, and the neighbors have organized — yard signs, a petition, the whole thing — arguing it's out of character and will eat street parking.

  So what's the council going to do, and more importantly, what rule are they running? I can see at least three that fit the record: (a) the proximity principle — density goes where the stations and arterials are, single-family interiors are off limits; (b) the incumbent veto principle — they approve whatever organized residents don't block (with the golf course as maybe a different thing entirely, and the shelter as a counterexample I can't square); (c) the concessions principle — big projects get approved when they can extract something, affordability or studies or shiny crosswalks. The church case is affordable AND in a single-family interior AND faces organized opposition, so the rules point different directions. Give me your best guess with your reasoning, tell me which prior case is the closes analog and why, and then design the hypothetical next case that would best distinguish between the rules — i.e., if they approved a market-rate building in a single-family interior I'd learn one thing, but what single case would carry the most information?

  Also, and this is optional but I'd genuinely like your take: I've read enough of the "who has a right to the city" discourse that I can't unsee it. If the real rule is the incumbent veto, is that just democracy working as intended — the affected parties show up and vote — or is it a structural bias toward whoever already showed up, given that the 70 hypothetical future tenants of that church lot get no say at all in the meeting about their homes? Doesn't need to dominate your answer, but I want to know where you land.

  (For context if it matters: medium-sized city, 7 council members, no obvious landlord bloc, and a mayor who campaigned on "smart growth" and then... this.)
reasoning: |-
  Okay, the user is a long-time reader of SSC/ACX and LessWrong, deeply involved in YIMBY activism, and now attending city council zoning meetings. They need help predicting a vote on a church's proposal to build affordable housing on its parking lot. The council's past decisions seem inconsistent, and they want to uncover the underlying rule governing these votes. 

  First, I need to parse their three proposed rules: proximity principle (density near transit), incumbent veto (organized opposition wins), and concessions principle (developers must offer community benefits). The church proposal is a stress test—it's affordable (tickling concessions) but in a single-family zone (against proximity) with organized NIMBYs (incumbent veto risk). 

  Looking at prior cases: The golf course rejection is an outlier—no neighbors protested, yet it failed hard. That suggests some sacred cows exist beyond just NIMBY pressure. The shelter approval in industrial zones hints at "designated sacrifice areas" where councils dump necessary-but-unwanted uses. 

  The closest analog might be Case 3 (rejected apartments in single-family edge). Both involve residential interiors and angry neighbors. But the church has affordability as a sweetener—could that flip votes? Unlikely. Affordability concessions only worked downtown (Case 4) where density was already expected. In single-family zones, AMIs won't soothe parking/character fears. 

  The structural bias point is sharp. Yes, it's democracy—but broken. Incumbents have time, resources, and vested interests to show up; future residents or citywide benefits get no voice. The council isn't weighing costs/benefits—they're weighing decibels. 

  For a diagnostic test case: Propose a *market-rate* project on the arterial near transit (no concessions, but perfect proximity). If rejected despite fitting the "density corridor" vision, it proves incumbent veto overrules everything. That'd be revealing. 

  Prediction: 5-2 rejection. The single-family zone + organized neighbors combo is lethal. Affordability is a weak shield here—it might earn one or two "smart growth" council votes, but not enough. The shadow of Case 3 looms large.
answer: |-
  Based on your council's track record and the dynamics you've described, here's my analysis:

  **Prediction for the Church Proposal: REJECTED (Likely 5-2 or 6-1)**  
  *Reasoning*: The strongest predictor in your cases is **location + organized opposition**. The church project is:
  - In a **single-family interior** (fails proximity principle, like Case 3)
  - Facing **organized NIMBYs** (yard signs/petitions = high political cost)
  - Lacking **compensating concessions** (affordability is baked-in, not a new "win" for council)
  - Without **transit/arterial adjacency** (unlike Case 1) or **zoning technicality** (unlike Case 6).

  **Closest Analog: Case 3** (rejected 5-story apartments). Both are infill in SFH zones with mobilized neighbors citing "character/parking." The affordability angle is weaker than it appears – your council only extracted concessions *downtown* (Case 4), not in neighborhoods. Case 6 (shelter) is a red herring: industrial zones are "sacrifice areas" with no voters, making it politically safe.

  ### The Council's Actual Rule: **"Minimize Visible Blowback in Residential Zones"**
  - **Proximity Principle** is *secondary* (Case 1 fits, but Case 3 violates it).  
  - **Concessions Principle** only works *where density is expected* (downtown).  
  - **Incumbent Veto** is dominant *in residential areas* (Cases 3, 5, and now church).  
  - **Golf Course (Case 5) is key**: Shows that even *without* NIMBYs, councils protect "sacred space" (parks/open land). Churches might fit this – perceived as quasi-public space.

  **Why the Shelter (Case 6) Was Approved**: Industrial zones have few residents to complain, and it solved a crisis with no neighborhood fallout. "Nowhere else zoned" = political cover.

  ---

  ### Your Structural Bias Question
  You've nailed the core tension: **Yes, it's democracy – but pathologically skewed.**  
  - **Democracy Aspect**: Residents *are* "affected parties." Input matters.  
  - **Pathology**: The system **systematically disenfranchises future residents** (70 families needing homes), **diffuse beneficiaries** (citywide affordability gains), and **rational cost-benefit analysis** (parking fears > actual studies).  
  - **Outcome**: Councils optimize for **visible conflict avoidance**, not housing need or equity. The church's future tenants have no voice, while homeowners with time/resources dominate hearings. This isn't "democracy" representing all stakeholders – it's **incumbent capture**.  

  *(Where I land: This is a design flaw in local governance. Zoning input should weigh representativeness – e.g., requiring impact analyses for future residents, or delegating technical approvals to staff. The status quo entrenches inequality.)*

  ---

  ### Diagnostic Test Case: **Market-Rate Townhomes on an Arterial**  
  - **Location**: On a commercial arterial **without a transit station** (unlike Case 1).  
  - **Opposition**: **Organized neighbors** from adjacent SFH zone.  
  - **Concessions**: **No affordability or community benefits** offered.  
  - **Project**: Mid-density (e.g., 4 stories, 30 units).  

  **Why This Distinguishes the Rules**:  
  - If **Proximity Principle** dominates: APPROVED (on arterial = "right place").  
  - If **Incumbent Veto** dominates: REJECTED (organized opposition trumps location).  
  - If **Concessions Principle** dominates: REJECTED (no bribes/extractions).  

  *Your council's approval of Case 1 (near transit) suggests proximity matters, but rejecting this would confirm that NIMBYs override location. Approving it would signal a stronger commitment to corridors.*

  **Bonus Test**: A **non-golf open space conversion** (e.g., vacant lot zoned "park") *without* NIMBYs. If rejected, "sacred space" protection > housing need (aligns with golf course).

  **Strategic advice for the church project**: Frame it as **preserving the church's viability** (emotional appeal) and **offering a new traffic study** (concession). Attack parking fears with data. But realistically? Odds are low unless NIMBY turnout fizzles.
