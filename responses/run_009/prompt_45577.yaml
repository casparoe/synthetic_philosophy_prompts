answer: |-
  Your questions cut to the heart of Hume's innovative account of social conventions and the artificiality of justice. Here's a breakdown addressing your points in order, clarifying Hume's argument and its implications:

  ### 1. Hume's Meaning of "Convention" and the Absence of Promises
  *   **What "Convention" Means:** Hume uses "convention" here **not** as a formal agreement, pact, or promise. Instead, it signifies a **tacit, mutually beneficial coordination arising from repeated interactions and reciprocal recognition of common interest.** It's a pattern of behavior stabilized by expectations: each person acts based on the expectation that others will act similarly, knowing that this mutually advantageous outcome depends on everyone's conformity.
  *   **Why No Promises?** Hume deliberately excludes promises to make a crucial philosophical point:
      *   **Against Social Contract Theory:** He's arguing against thinkers like Hobbes and Locke who grounded justice/society in an original promise or contract. Hume contends that such a promise *presupposes* the very conventions (like keeping promises!) it's meant to explain. Promises themselves derive their normative force from prior conventions of trust and interest.
      *   **Explaining Emergence:** Coordination and rules *can* arise spontaneously from self-interested behavior and learning, *before* complex normative concepts like promises exist. The rowers coordinate because each sees it's in *their own interest* to row in sync *if* the other does too, and they *expect* the other to see this too.
      *   **What Does the Work:** Reciprocal expectations and perceived mutual advantage. Each rower:
          1.  Perceives that coordinated rowing serves their individual interest (getting to destination faster/easier).
          2.  Observes the other rower acting in a way that suggests *they* also perceive this mutual advantage.
          3.  Forms the expectation that the other *will* continue to row in sync, *because* it serves their interest too.
          4.  Adjusts their own behavior based on this expectation.
      This creates a self-reinforcing equilibrium based on enlightened self-interest and mutual observation. No promise, moral commitment, or "normative act" beyond recognizing what's useful is needed *initially*. The *normativity* (the "ought") of the convention emerges *from* the established pattern and its perceived benefits.

  ### 2. The Role of Gradualness ("Slow Progression")
  *   **More Than Just History:** While it *is* a historical claim about how justice likely arose, its primary role is **philosophical and conceptual**, crucial to proving justice is an *artificial* virtue.
      *   **Against Natural Virtue:** Hume argues natural virtues (like benevolence) prompt immediate approval and are instinctive. If justice were natural, we'd expect an immediate, instinctive approval of respecting property *in the very first instance*, even with a stranger in a desert. We don't have this instinct. Gradualness shows justice isn't innate.
      *   **Demonstrating Artificiality:** The slow progression illustrates how the *convention* and its *normative force* are *constructed* by human experience and reasoning:
          1.  **Experience of Conflict:** People initially act from limited generosity and self-interest, leading to conflict over scarce goods.
          2.  **Recognition of Miserable State:** Repeated experience teaches them that this state ("the circumstances of justice") is miserable and unstable for everyone.
          3.  **Perception of Mutual Advantage:** They gradually discern that *if everyone* refrained from taking others' possessions, *everyone* would be better off in the long run. This is the "common sense of common interest".
          4.  **Stabilization through Expectation:** As more people act on this perception (leaving others' possessions alone *on condition* of reciprocation), expectations solidify. Seeing others conform reinforces one's own conformity. The "slow progression" is the process of this collective learning and expectation-building.
          5.  **Emergence of Normativity & Sentiment:** Only *after* this stable pattern is established and its benefits widely felt does the *sentiment* of moral approval for respecting property (and disapproval for theft) develop. The rule gains its normative force ("ought") from the collective recognition of its indispensable utility for social order. The slowness underscores that this sentiment is a *product* of the convention, not its cause.

  ### 3. Connection to Contemporary Collective Intentionality/Joint Action
  Hume's rowers present a fascinating precursor to modern debates. His account fits some theories well but challenges others:

  *   **Hume's Account Summarized:** Joint action (rowing together) arises from:
      *   Individual intentions ("I intend to row in a way that gets us forward").
      *   Mutual beliefs/expectations ("I believe you intend to row in sync because you see the mutual benefit, and I believe you believe the same about me").
      *   Perceived mutual advantage as the core motivator (not shared commitment).
      *   **No** irreducible "we-intention" or explicit joint commitment.
  *   **Fits With:**
      *   **Game Theory (Lewis, Schelling):** Hume's rowers are a classic coordination game (like driving on the right/left). Conventions are solutions to such games, emerging from salience, precedent, and mutual expectations of rationality. Hume's description is remarkably prescient of this view. The mutual advantage and reciprocal expectations are central.
      *   **Bratman (Modest Sociality):** While Bratman emphasizes shared intentions ("we intend to J"), he allows that these can be built from interconnected individual intentions and mutual responsiveness in action and planning. Hume's rowers might qualify as a simple case of "shared cooperative activity" under Bratman's framework, especially if their individual intentions are responsive and they are mutually responsive *in action* (adjusting strokes), even without a complex shared *planning* structure.
      *   **Tuomela (I-Mode Cooperation):** Tuomela distinguishes "we-mode" (group-centered) from "I-mode" (individual-centered) cooperation. Hume's rowers are clearly operating in the "I-mode" – each is motivated by their *own* interest in the joint outcome, based on beliefs about the other's similar motivation.
  *   **Challenges For:**
      *   **Strong "We-Intention" Theories (Searle, Gilbert):**
          *   **Searle** argues genuine collective intentionality requires an irreducible "we-intend" that cannot be reduced to "I-intend plus beliefs about you." Hume's account is purely reducible to individual mental states (intentions, beliefs, perceived advantage).
          *   **Gilbert** argues joint action requires a "joint commitment" creating mutual obligations. Hume explicitly denies this – the rowers feel no obligation *to each other* arising from a commitment; they act purely from self-interest conditioned by expectations of the other's self-interest. Gilbert might call this "parallel action" rather than true joint action.
      *   **Theorists Requiring Shared Goals/Commitment:** Many theorists insist genuine joint action requires a shared goal *as such* (not just coinciding individual goals) or some form of mutual commitment. Hume's rowers have coinciding individual goals (each wants the boat to move efficiently *for their own sake*) and act based on reciprocal expectations, but lack a shared goal *conceived as ours* or a commitment *to each other*.

  **Conclusion on Joint Action:** Hume is describing a **proto-joint action** or a **minimalist form of coordination based on reciprocal expectations of mutual advantage.** Later theorists emphasizing irreducible "we-intentions" or joint commitments would likely **set it aside as a limiting case or a shallower form of coordination.** They might argue true joint action requires a "thicker" normative or cognitive structure. However, theorists focused on coordination problems, game theory, or more reductive accounts of sociality (like Bratman's earlier work or Tuomela's I-mode) would find Hume's description insightful and recognize it as a foundational type of joint activity. It perfectly fits the model of a "convention."

  ### Regarding Your Paraphrase/Framing
  Your paraphrase is excellent and captures the core argument accurately. You haven't missed Hume's point. The key elements you identify – convention without promise, mutual interest, reciprocal expectations, gradual progression linking to artificiality – are precisely what Hume is driving at. Your framing questions about the nature of convention, the significance of gradualness, and the connection to joint action are spot-on for understanding the depth and implications of this passage.

  In essence, Hume uses the rowing analogy to show that complex, normatively laden social structures like justice and property can emerge spontaneously from the repeated interactions of self-interested individuals who gradually recognize patterns of mutual advantage and develop stabilizing expectations – all without needing foundational promises, innate moral ideas about justice, or irreducible collective intentions. This is the core of his argument for the artificiality of justice.
