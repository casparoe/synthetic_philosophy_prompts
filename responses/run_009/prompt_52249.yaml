answer: |-
  Here’s a structured analysis of replacing your elected board with random selection:

  ### What Changes Overnight
  On day one, elections vanish. Instead, nine members are drawn randomly and notified of mandatory service (like jury duty). The "usual suspects" faction loses agenda control immediately. Board meetings shift from political maneuvering to collective learning, as newcomers grapple with procedures and documents. Expect initial panic or reluctance from those selected—many will feel unprepared. Voting blocs dissolve overnight, replaced by unpredictable dynamics. Administrative burden spikes: you’ll need instant onboarding (documents, training) and legal review to codify the new process. Member engagement might paradoxically dip short-term ("Why bother paying attention? I might not be picked"), but the co-op’s power structure flattens decisively. The property manager’s role becomes more influential as the sole source of continuity.

  ### Legitimacy and Competence
  **Legitimacy Gains:**  
  Random selection eliminates factional capture and makes every member’s stake truly equal. The "democratic deficit" of 22% turnout vanishes—the board *is* the membership in microcosm. Decisions gain moral authority: when the board votes, it’s statistically equivalent to a referendum. This can defuse polarization ("It’s not *them* deciding—it’s *us*"). Members who felt excluded may now engage more, trusting their turn could come.

  **Competence Risks:**  
  Institutional memory evaporates. Without carry-over members, rookie mistakes recur annually (e.g., misinterpreting bylaws, underestimating roof repair complexities). Expertise isn’t guaranteed: the board might lack financial literacy or strategic vision. Deliberation quality could suffer as members learn on the job—meetings may run longer, with more reliance on your property manager for basic guidance. Motivation differs: elected members *chose* the burden; conscripted ones may do minimal work. However, competence isn’t solely about expertise: diverse perspectives often prevent groupthink and surface overlooked issues (e.g., a tenant’s subletting concerns vs. an owner’s). With robust onboarding and a strong manager, operational risks are manageable, but strategic foresight may decline.

  ### The Wrinkles
  1. **Graduated Sortition:**  
     *Reduces burnout risk and broadens participation*, crucial for a 180-member pool. Without it, 10-15 engaged members could still dominate through probability. But it *weakens competence*: excluding recent servers means losing rare experienced members. It also complicates fairness—is it "more democratic" to disadvantage willing participants? **Verdict:** Recommended; the burden-spreading outweighs skill loss if paired with training.

  2. **Hybrid Board (5 elected, 4 random):**  
     Preserves some expertise and a path for engaged members to contribute continuously. However, it *reintroduces factional politics* through the elected seats, potentially marginalizing random members ("They’re the real decision-makers"). Elections could also sap legitimacy from the random cohort. **Verdict:** Undermines core sortition benefits; avoid unless competence fears are overwhelming.

  3. **Recall Mechanism:**  
     Essential for accountability. Without it, a truly dysfunctional board could paralyze the co-op. Opt for a high bar (e.g., 2/3 member petition + supervised vote) to prevent frivolous challenges. **Verdict:** Necessary and doesn’t undermine sortition—it ensures the system has emergency safeguards, much like juror dismissals.

  ### Bottom Line
  **Yes, but cautiously.** For a 180-member co-op with low-stakes governance (thanks to your property manager handling operations), sortition solves your legitimacy crisis and disrupts factional capture. The trade-off in competence is real but manageable with mandatory onboarding and graduated terms. Prioritize graduated sortition and a strict recall rule. Skip the hybrid model—it dilutes the reform’s benefits. Success hinges on two things: a bulletproof training program for conscripted board members, and member education to frame this not as "giving up control," but as embracing radical fairness.
