  The absolute European ban on surrogacy, contrasted with permissive compensated egg donation, presupposes a specific **theory of gestation as an inalienable biological and relational process that constitutes legal motherhood by its very nature**, distinct from genetic contribution. This theory strictly distinguishes between body parts/products (gametes) and embodied, temporally extended biological processes (pregnancy).

  **Strictly Presupposed Theory:**

  1.  **Gestation as Constitutive Motherhood:** Pregnancy is not merely a service or a biological function; it is the *process that creates the legal and social mother-child bond*. This bond arises intrinsically from gestation itself. The act of carrying and giving birth establishes an unbreakable, inalienable claim to motherhood that cannot be overridden by prior contract or genetic contribution.
  2.  **The Body-in-Process as Non-Contractible:** While *detached* biological materials (like eggs or sperm) can be alienated (donated or sold) without fundamentally altering one's legal identity or status, the *ongoing use of the body in a complex, life-creating process* (gestation) is inherently non-contractible. Subjecting this process to contract commodifies not just tissue, but the woman's embodied self and the profound relational act of nurturing a new life within her.
  3.  **Protection of the Child's Origin & Identity:** The ban presupposes that the child has an inherent right to be born into a clear, undisputed legal relationship with the woman who gave birth to them. Surrogacy, even altruistic, intentionally severs this primary bond, creating an artificial and potentially harmful split between biological gestation and legal/social parenthood. This is seen as undermining the child's fundamental right to their origins.
  4.  **Vulnerability of the Gestational Process:** Pregnancy renders a woman uniquely vulnerable physically, psychologically, and socially. Allowing *any* form of contract (even unpaid) creates a power dynamic and potential for coercion or pressure (social, emotional, familial) that the state must prevent, regardless of the presence of monetary payment. The potential for exploitation exists in the *agreement itself* and the inherent pressures of fulfilling the contract.

  **What it Merely Coheres With (but doesn't strictly require):**

  *   **General Suspicion of Markets in Reproduction:** While consistent with this, the specific ban on *altruistic* surrogacy shows it's not primarily about money.
  *   **Traditional Views of Family:** It coheres with traditional notions of motherhood defined by birth, but the rationale focuses on the biological/relational *process*, not tradition per se.
  *   **Feminist Concerns about Exploitation:** It coheres with concerns about women's bodies being used, but the absolute ban extends beyond preventing *commercial* exploitation.

  **Internal Consistency & Pressure Points:**

  *   **Consistent:** The core distinction between **alienable tissue (egg)** and **inalienable embodied process (gestation)** holds internally. Selling an egg is analogous to selling blood or hair – it's a detached product. Gestation is an inseparable, identity-forming *act* performed *with* the whole body over time.
  *   **Inconsistent:**
      *   **Exploitation Rationale:** If preventing exploitation is the *primary* motive, banning *unpaid* surrogacy among consenting adults (e.g., a sister helping a sister) is hard to justify while allowing potentially exploitative *paid* egg donation (which involves significant hormonal stimulation and surgical retrieval). The ban's focus is less on preventing exploitation *of the act* and more on preventing the *contractual framework* around gestation itself.
      *   **Genetic vs. Gestational Bond?** The theory struggles to explain why the genetic link from an egg donor is *not* seen as creating an equally "inalienable" maternal bond requiring protection, while gestation is. It implicitly rejects genetic essentialism for legal motherhood *except* when used to distinguish it from gestation. The intended mother in a gestational surrogacy (using donor egg) has *no* genetic or gestational link, yet the ban prioritizes the gestational bond over any contractual intent. The ban effectively says: "Gestation creates motherhood; genetics is secondary and alienable; intent is irrelevant to the *creation* of the mother-child bond at birth."

  **Consequences of Adopting a Consent-and-Contract View:**

  Replacing the European presupposition with a US-style (especially Californian) consent-and-contract view would necessitate fundamental changes:

  1.  **Repeal European Surrogacy Bans:** All forms of surrogacy (altruistic and commercial) would need to be decriminalized and legalized. The *intent* of the parties (the commissioning parents), established pre-conception, would become the primary determinant of legal parentage.
  2.  **Shift Legal Parenthood Determination:** Birth certificates would reflect the *intended* parents, not the birth mother, from the moment of birth. The gestational carrier would have no automatic parental rights or responsibilities unless specified otherwise in a flawed contract or due to lack of consent.
  3.  **Re-evaluate European Egg Donation Rules:** A pure consent-and-contract view would likely lead to *more permissive* rules for egg donation (if consistent), but it could also prompt *more scrutiny*. If the body's reproductive services are contractible, why should egg donation be treated differently *in principle* from surrogacy? It might erode the distinction, or conversely, raise new questions about commodifying genetic material if the focus shifts entirely to consent and contract enforcement. Existing compensation schemes might face challenges regarding fairness, informed consent depth, and potential coercion, similar to concerns sometimes raised about surrogacy contracts.
  4.  **Redefine Exploitation Concerns:** Instead of an outright ban justified by the inherent nature of gestation, exploitation would be addressed through regulation: rigorous informed consent processes, independent legal counsel, psychological screening, caps on compensation (if desired), and robust enforcement mechanisms for contracts and dispute resolution centered on the parties' original intent.
  5.  **Reconceptualize the Mother-Child Bond:** The legal framework would formally decouple the act of gestation from the legal status of motherhood. The gestational carrier provides a service; the intended mother (who may be genetically unrelated) becomes the legal mother by contract and intent at birth.

  **In essence:** The European ban strictly presupposes that pregnancy is a unique, identity-constituting act that *is* motherhood and cannot be subject to contract without violating the dignity of the woman, the child, and the fundamental human relationship created. A consent-and-contract view rejects this, treating gestation as a service like any other, where intent and agreement govern the outcome, requiring the complete dismantling of the European legal approach to surrogacy. The inconsistency with compensated egg donation highlights that the European view is fundamentally about the *specific, embodied process* of gestation, not a blanket rejection of commodifying reproductive biology.
