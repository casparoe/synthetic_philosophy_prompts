prompt: |-
  I'm the campaign manager on a statewide race (attorney general, if it matters) and I keep running into the same thing: staff coming to me with stuff where the honest answer is "yeah we could do it, it'd work, but its a bit gross." A quote taken out of context in an attack ad, quietly telling a big donor something that's technically true but meant to mislead, feeding a reporter a half-wrong story to knock the opponent off message for a cycle, threatening to primary a legislator who votes with us 80% of the time just to show we'll do it. I'm tired of deciding these by gut, because my gut is mostly "will we get caught," which is not the standard I actually want to be using.

  There's an old idea in political philosophy, dirty hands: that a politician can face situations where doing the right thing overall requires doing something that is still a wrong thing, and the mark of a decent politician isn't avoiding these but knowing afterwards that they did wrong, instead of letting it calcify into "that's just how politics works." I want this turned into something my senior staff and I can actually run in ten minutes, the night before a decision, with maybe one phone call to me and no one else. It has to be usable by a 26-year-old deputy comms director whose read zero philosophy.

  I suspect the procedure should do roughly this, but rearrange if you think I'm wrong. First, a gate for whether we're even looking at a candidate: a lot of our "dirty hands" cases are ones we walked into earlier through choices that looked costless at the time, and I want the procedure to force a look at that, because a dilemma we built ourselves shouldn't get the same slack as one the world handed us. Then, whatever the philosophy actually supports as the difference between (a) an act that's fully justified — uncomfortable but not wrong — and (b) an act that's right all things considered but still wrong in the residue sense. That distinction has to survive into the procedure, because I think what we owe afterwards depends on it, and by afterwards I mean concrete things: whether the staffer who did it owes an apology they can't deliver to anyone, whether they have to say no to the next similar ask for a while, whether we disclose it to the candidate, whether the person rotates off that beat so it doesn't get easy. The procedure needs a rule for each aftermath — not "reflect on it."

  Format I want: the questions in order, what a sufficient answer to each looks like, where it stops with a straight no, and where it stops and hands the decision back to me because it's a question of values, not facts. Mark those honestly — I don't want the procedure pretending to be neutral where it isn't. Then run it on the three cases I listed, include at least one where the procedure gives an answer I won't like, and tell me where it goes quiet: I'm guessing it can't tell me how much moral residue is worth how much message control, but I want to know what else it can't do.
reasoning: |-
  Hmm, the user is a campaign manager for a statewide attorney general race who's grappling with ethical dilemmas where staff propose tactics that are effective but "gross." They want a practical decision framework rooted in the "dirty hands" political philosophy concept, usable by junior staff in under 10 minutes. 

  Key constraints: Must be executable by a 26-year-old with no philosophy background, include concrete aftermath rules (not just reflection), and flag when value judgments are required. The user specifically wants to test it against three sample cases including one where the framework produces an unpopular answer.

  Noticing several layers here: Operational fatigue ("tired of deciding by gut"), ethical leadership concerns ("will we get caught" as current standard), and institutional design (preventing normalization of dubious tactics). The "moral residue" concept is central—they want to distinguish between necessary wrongs vs. justifiable actions.

  The proposed framework needs to: 
  1) Filter self-inflicted dilemmas differently than external ones (gate 1)  
  2) Separate "justified discomfort" from "wrong with residue" (gate 2)  
  3) Assign specific aftermath consequences (apology protocols, rotation rules etc.)  
  4) Explicitly call out value judgments rather than masking them as neutral  

  For the sample cases:  
  - The attack ad quote likely fails gate 1 (self-created via opposition research)  
  - Donor deception may pass gates but require candidate notification  
  - Primary threat against legislator probably gets stopped at gate 2 as "wrong with residue"  
  - Feeding false press info would be hardest case—framework forces acknowledgment it's purely tactical with no ethical justification  

  Biggest gap: The framework can't quantify tradeoffs (e.g., how much electoral risk equals moral residue). That's intentional—it surfaces the irreducible value conflict rather than pretending to solve it. Staff using this will have to sit with that discomfort, which aligns with the user's goal of preventing ethical calcification.
answer: |-
  Here's a practical "Dirty Hands Protocol" designed for speed and clarity, based on your requirements. It forces examination of self-created dilemmas, distinguishes between "justified discomfort" and "wrong with residue," assigns concrete aftermath actions, and flags value judgments. Below the protocol, I'll run your three cases and a bonus "unpopular answer" scenario.

  ---

  ### **The Dirty Hands Protocol (10-Minute Decision Tool)**
  **Goal:** Determine if an action is (A) *Permissible Discomfort* (uncomfortable but not morally wrong) or (B) *Necessary Wrong* (effective but morally tainted, requiring aftermath actions). Stops at "No" if neither applies.

  #### **Gate 1: Did We Create This Dilemma?**
  *   **Question:** *"Would this dilemma exist if we hadn't cut corners, skipped due diligence, or exploited ambiguity earlier?"* (e.g., Oppo research taken out of context? Donor relationship built on hype?)
  *   **Sufficient "Yes":** Clear link to a past action where a cleaner alternative existed but was rejected for convenience/speed.
  *   **Decision:**  
      *   **YES (Self-Created):** *Stop.* **NO GO.** The action is off-limits. We don't get "dirty hands" credit for messes we made.  
      *   **NO (External Dilemma):** Proceed to Gate 2.

  #### **Gate 2: Is This Action a *Necessary* Wrong?**
  *   **Question 2.1:** *"Is this the ONLY realistic way to prevent significant, imminent harm to a core value/priority (e.g., democracy, civil rights, public safety) OR prevent an opponent's genuinely dangerous/unethical action?"* (Not just "win the news cycle" or "raise more cash").
  *   **Sufficient "Yes":** Specific, verifiable threat being countered; no credible cleaner alternative.  
  *   **Question 2.2:** *"Does the action involve active deception, betrayal of trust, or abuse of power?"* (Mistakes ≠ "dirty hands").
  *   **Sufficient "Yes":** Clear intent to mislead, exploit vulnerability, or break an implicit/explicit promise.
  *   **Decision:**  
      *   **BOTH 2.1 & 2.2 = YES:** *Necessary Wrong.* Proceed to Aftermath Rules.  
      *   **2.1 = NO or 2.2 = NO:** *Permissible Discomfort.* **APPROVED** (No special aftermath needed beyond standard ops).  
      *   **2.1 = NO and 2.2 = YES:** *Unjustified Wrong.* **STOP. NO GO.** (It's just gross, not necessary).

  #### **Aftermath Rules (For *Necessary Wrong* Only)**
  *   **1. Apology Owed:** YES (Internally, in writing). Staffer *must* document why it was necessary *and* why it was wrong in an email to the Campaign Manager (CM) within 24h. *(Purpose: Forces acknowledgment of residue).*
  *   **2. Next Similar Ask:** AUTOMATIC HOLD. Staffer must refuse identical/similar requests for 60 days. CM approval required to override. *(Prevents normalization).*
  *   **3. Disclose to Candidate:** **VALUE JUDGMENT - ESCALATE TO CM.** *(CM decides based on candidate's temperament, potential blowback if revealed later, and need for deniability).*
  *   **4. Rotation Off Beat:** YES, if possible. Staffer should be temporarily reassigned away from the affected relationship/domain within 2 weeks. *(Breaks association ease).*

  #### **Where It Goes Quiet (Limitations)**
  1.  **Quantifying Harm/Benefit:** Can't judge *how much* harm justifies *how much* residue (e.g., "Is 3 days of opponent distraction worth misleading a reporter?").
  2.  **Defining "Core Value":** What constitutes "significant harm to a core value" is inherently values-based (e.g., is gerrymandering a "core threat"?).
  3.  **"Realistic Alternative":** Judgment call on whether a cleaner option truly exists or is viable under pressure.
  4.  **Long-Term Calcification Risk:** Can't predict if *this specific act* will erode norms long-term, only enforce immediate aftermath to counter it.

  ---

  ### **Running the Cases**

  **Case 1: Quote Taken Out of Context in Attack Ad**
  *   **Gate 1:** **YES (Self-Created).** The dilemma exists *because* oppo research found the quote. Taking it out of context is exploiting the ambiguity we chose to harvest.  
  *   **Decision:** **STOP. NO GO.** (No need to proceed further).

  **Case 2: Telling a Big Donor Something Technically True but Meant to Mislead**
  *   **Gate 1:** **NO (External).** Donor relationships involve inherent pressures, not necessarily *created* by a past corner-cut.  
  *   **Gate 2:**  
      *   2.1: *Is it Necessary?* Unlikely. Misleading a donor rarely prevents "significant harm" or counters a dangerous opponent act. Usually about securing funds. **→ NO.**  
      *   2.2: *Is it a Wrong?* **YES** (Active deception/betrayal of trust).  
  *   **Decision:** **STOP. NO GO (Unjustified Wrong).** It's gross, not necessary. Gate 2 fails.

  **Case 3: Threatening to Primary a Legislator (80% Ally) "Just to Show We'll Do It"**
  *   **Gate 1:** **NO (External).** Pressure tactics are part of politics.  
  *   **Gate 2:**  
      *   2.1: *Is it Necessary?* **VALUE JUDGMENT - ESCALATE.** Does punishing an 80% ally prevent a *significant, imminent harm*? (e.g., Are they the key vote blocking a civil rights bill? Or just not toeing the line?). *CM must decide.*  
      *   2.2: *Is it a Wrong?* **YES** (Abuse of power; betrayal of collaborative trust).  
  *   **Decision:** *If CM determines it's **Necessary** (e.g., legislator is enabling a truly dangerous agenda despite 80% alignment):*  
      *   **Necessary Wrong.** Proceed to Aftermath:  
          *   Apology Owed: YES (Email to CM).  
          *   Next Similar Ask: 60-day Hold.  
          *   Disclose to Candidate: **ESCALATE to CM** (High risk; candidate may see as bullying).  
          *   Rotation Off Beat: YES (Rotate off legislative relations).  
      *   *If CM determines it's **NOT Necessary**:* **STOP. NO GO.**

  **Case 4 (Unpopular Answer): Feeding Reporter a Half-Wrong Story to Knock Opponent Off Message**
  *   **Gate 1:** **NO (External).** Rapid response is inherent.  
  *   **Gate 2:**  
      *   2.1: *Is it Necessary?* **VALUE JUDGMENT - ESCALATE.** "Knocking opponent off message" is rarely about preventing *significant harm*. Is this cycle critical to exposing a truly dangerous lie/policy? Or just tactical advantage? *CM must decide.*  
      *   2.2: *Is it a Wrong?* **YES** (Active deception; corrupting the press/political discourse).  
  *   **Decision:**  
      *   *If CM determines it's **Necessary** (e.g., opponent is about to spread a lie causing panic/violence):* **Necessary Wrong.** Aftermath: Apology Owed (CM), 60-day Hold on feeding *that reporter*, Disclose to Candidate (Likely YES - high risk if exposed), Rotation (Off press relations if possible).  
      *   *Likely Outcome:* **STOP. NO GO (Unjustified Wrong).** Most "knock off message" scenarios fail the "significant harm" test. **This answer may be unpopular** with staff who see it as "standard politics," but the protocol forces confronting the deception as unjustified.

  ---

  ### **Key Takeaways for Implementation**
  1.  **Gate 1 is Crucial:** Catches self-inflicted wounds masquerading as dilemmas.
  2.  **"Necessary" is the Hard Filter:** Forces staff to articulate *why beyond winning*. This often kills the proposal (Cases 1, 2, likely 4).
  3.  **Aftermath is Concrete & Punitive:** Acknowledges the "wrong" by imposing real costs (apology, hold, rotation). This disincentivizes trivial use.
  4.  **CM as Value Arbiter:** Gates 2.1 and Candidate Disclosure *require* CM judgment. Don't hide this; it's where leadership matters.
  5.  **Unpopular Answers Protect Culture:** Saying "NO" to common-but-gross tactics (like misleading press) is the point. It prevents "calcification."
  6.  **Limits Are Features:** The "quiet" spots (quantifying harm, defining core values) force senior staff/CM engagement on the hardest calls. The protocol surfaces the conflict, it doesn't resolve it algorithmically.

  **Hand this to your 26-year-old Deputy Comms Director:** They run Gates 1 & 2.1/2.2 based on facts. If they hit a STOP (No Go), it's done. If they get to Aftermath or a Value Judgment, they call you immediately. The questions force critical thinking without requiring philosophy degrees.
