prompt: |-
  I'm trying to get clear on what a theory of decision-making under moral uncertainty actually has to deliver before I evaluate the leading candidates, and I want the specification written first. Assume the setting: an agent is confident in ordinary decision theory, but uncertain which moral theory is true, with credences spread across theories that can disagree in kind (one forbids an act, another merely permits it) and not just in degree of choiceworthiness. Write the desiderata such a theory must meet, with the motivating case or consideration behind each. It should at least have to cover: (a) comparing choiceworthiness across theories whose scales are not obviously commensurable (a prohibition-theory versus a welfare-maximizing theory versus a rights-based theory that speaks only in side constraints); (b) handling theories that deny the significance of moral uncertainty itself, such as theories on which only the true morality's verdicts generate reasons, or on which moral beliefs are not the kind of thing one can have credences about; (c) saying something about the value of moral inquiry, i.e., whether and when one should spend resources reducing one's own moral uncertainty rather than acting on it, including the self-undermining case where no theory endorses spending on moral inquiry; (d) preserving continuity with ordinary decision theory as moral uncertainty shrinks to zero, so that a morally certain agent's prescriptions are untouched; and (e) a stance on cases with a self-locating or precommitment structure, where an option locks in conditions before moral uncertainty is resolved. For each desideratum, say whether it is non-negotiable or reflects the commitments of a particular camp, and flag any subset of the desiderata you suspect is jointly unsatisfiable — that is the part I most want to see. Then, briefly, score maximize-expected-choiceworthiness, the my-favourite-theory view, and the moral-parliament family against the list; keep the weight on the criteria rather than the scorecard. Conclude with a final line of the form "Verdict: [the single desideratum that does the most to eliminate candidate theories]."
reasoning: |-
  Okay, the user wants a clear specification of desiderata for theories of decision-making under moral uncertainty. They've outlined several key challenges: comparing incommensurable theories, handling theories that reject moral uncertainty itself, valuing moral inquiry, ensuring continuity with standard decision theory, and addressing self-locating/precommitment cases. 

  Hmm, this is a sophisticated request - the user clearly has a strong background in moral philosophy and decision theory. They're trying to systematize evaluation criteria before diving into existing approaches. The emphasis on flagging joint unsatisfiability suggests they're particularly concerned about theoretical limitations. 

  Let me structure this carefully. First, the desiderata need explicit motivations from realistic cases. For (a) incommensurability, the organ transplant case illustrates how prohibition-based theories clash with welfare-maximizing ones. For (b) anti-uncertainty theories, the divine command thought experiment shows why we can't simply ignore theories that reject credences. 

  Ah, the self-undermining aspect of (c) is tricky - if no theory endorses inquiry, should we still do it? That might conflict with (d)'s continuity requirement. And (e)'s precommitment cases could strain any theory that aggregates uncertain verdicts. 

  Noting tensions: (b) vs (d) seems hardest - accommodating anti-uncertainty theories while preserving continuity may be impossible. Also (c) vs (d) when inquiry is self-undermining. 

  For scoring existing approaches: MEC struggles most with incommensurability and anti-uncertainty theories. My Favorite Theory dodges comparison problems but fails (d) continuity. Moral Parliament handles incommensurability better but still stumbles on (b) and (e). 

  The verdict must highlight the biggest differentiator - (b)'s "anti-uncertainty challenge" seems to eliminate the most candidates. MEC and Moral Parliament both crash against it, while My Favorite Theory handles it only by rejecting the problem entirely.
answer: |-
  Here is a specification of desiderata for a theory of decision-making under moral uncertainty (DMU), incorporating your requirements and structured for clarity:

  **Desiderata for a Theory of Decision-Making Under Moral Uncertainty (DMU):**

  1.  **Incommensurable Scale Comparison (Non-negotiable):**
      *   **What:** The theory must provide a method for comparing acts across moral theories whose structures and outputs are fundamentally different (e.g., binary prohibitions, cardinal welfare scales, deontic side-constraints).
      *   **Motivating Case:** Choosing whether to perform a life-saving organ transplant that violates a deontological prohibition against using one person as a means to save others, where utilitarianism assigns high cardinal welfare value. How does one weigh "strictly forbidden" against "+1000 utils"?
      *   **Status:** Non-negotiable for any general theory purporting to handle deep moral disagreement.

  2.  **Handling Anti-Uncertainty Theories (Non-negotiable):**
      *   **What:** The theory must account for moral theories that deny the normative relevance of moral uncertainty itself. This includes theories asserting that only the *true* morality generates reasons, or that morality is not a domain where credences are appropriate (e.g., some error theories, non-cognitivist views, or robust realist views emphasizing objective reasons).
      *   **Motivating Case:** An agent has credence in Divine Command Theory (DCT), which holds only God's commands matter, and credence in Robust Moral Realism (RMR), which holds only the objective moral facts generate reasons. Neither theory endorses acting based on *uncertainty* about the commands/facts; they demand acting on the *truth*. How does DMU incorporate these views without begging the question?
      *   **Status:** Non-negotiable. Ignoring these views violates the agent's own epistemic state. Their presence creates a fundamental challenge.

  3.  **Value of Moral Inquiry (Negotiable, reflects "pro-inquiry" commitment):**
      *   **What:** The theory should provide guidance on when an agent should invest resources (time, effort, money) into reducing moral uncertainty (inquiry) vs. acting under current uncertainty. Crucially, it must handle the "self-undermining" case: what if *no* theory in the agent's credence distribution endorses spending resources on moral inquiry?
      *   **Motivating Case:** Should a philanthropist donate $1M now to a potentially good cause, or spend $100k on advanced ethics tutoring to refine their moral views first? What if all their candidate theories imply they should just donate the money immediately?
      *   **Status:** Reflects a commitment that DMU should guide *all* choices, including meta-level ones about inquiry. The self-undermining case is a critical stress test.

  4.  **Continuity with Moral Certainty (Non-negotiable):**
      *   **What:** As the agent's credence in one moral theory approaches 1 (moral certainty), the prescriptions of the DMU theory must converge to the prescriptions of that single theory under ordinary decision theory (e.g., maximizing expected utility/value/choiceworthiness *as defined by that theory*).
      *   **Motivating Case:** An agent nearly certain of utilitarianism should act almost indistinguishably from a certain utilitarian. A sudden shift in prescriptions at credence=1.0 is implausible.
      *   **Status:** Non-negotiable for coherence with standard decision theory under certainty.

  5.  **Self-Locating/Precommitment Cases (Negotiable, reflects scope commitment):**
      *   **What:** The theory should offer guidance in cases where an agent can choose an option that "locks in" conditions *before* their moral uncertainty is resolved (e.g., setting a constitution, binding future selves, making irreversible choices where moral status depends on the true theory).
      *   **Motivating Case:** A legislature uncertain about the moral permissibility of capital punishment must vote on a constitutional amendment banning it forever. Should they evaluate the amendment based on current uncertainty, or consider the possibility that future moral insight might show banning was wrong (or right)?
      *   **Status:** Reflects a commitment that DMU should handle dynamic choices with persistent or resolvable uncertainty. Adds significant complexity.

  **Tensions and Joint Unsatisfiability:**

  *   **The Core Tension:** Desiderata **(2) Handling Anti-Uncertainty Theories** and **(4) Continuity** appear **jointly unsatisfiable** with **(1) Incommensurable Scales** and **(3) Value of Inquiry** for many plausible approaches.
      *   **Why:** Anti-uncertainty theories (Desideratum 2) demand that if they are true, the agent should *ignore* uncertainty and follow only their verdict. But incorporating this literally (e.g., giving them "veto power" or refusing to aggregate) violates Continuity (4) – an agent with 99.9% credence in an anti-uncertainty theory would still be forced to follow the DMU aggregation rule for the 0.1% other theories, not the anti-uncertainty theory's prescription. Smooth convergence (4) requires aggregating *all* theories, including anti-uncertainty ones, but aggregation (1) seems impossible if anti-uncertainty theories deny the framework's validity. This also cripples guidance on Inquiry (3).
  *   **Self-Undermining Inquiry (3) vs. Continuity (4):** If no theory endorses inquiry, a theory satisfying Continuity (by converging to each theory's prescription as credence ->1) would never endorse inquiry for a morally certain agent. But satisfying (3) might require endorsing inquiry *even if no theory does*, creating a discontinuity at high credences.

  **Scoring Candidate Theories (Briefly):**

  *   **Maximize Expected Choiceworthiness (MEC):**
      *   **(1) Incommensurability:** **Fails.** Requires mapping all theories' verdicts onto a common cardinal scale (intertheoretic comparisons). How to compare "forbidden" to "+100 utils"? This is the core challenge.
      *   **(2) Anti-Uncertainty:** **Fails.** Forces anti-uncertainty theories into an aggregation framework they fundamentally reject. Cannot accommodate their core claim.
      *   **(3) Inquiry:** **Mixed.** Can formally value inquiry if it shifts credences towards theories where current acts are worse, but struggles *conceptually* with self-undermining cases (if inquiry costs utils and no theory values uncertainty reduction, MEC won't endorse it).
      *   **(4) Continuity:** **Succeeds.** By design, as credence ->1, expected choiceworthiness -> that theory's choiceworthiness.
      *   **(5) Precommitment:** **Formalizable but problematic.** Can model precommitment options but relies on the shaky intertheoretic comparisons.

  *   **My Favorite Theory (MFT - act as if the most probable theory is true):**
      *   **(1) Incommensurability:** **Avoids.** Only consults one theory; no comparison needed.
      *   **(2) Anti-Uncertainty:** **Succeeds... if favorite.** If the most probable theory is anti-uncertainty, MFT follows it, ignoring uncertainty. But if a non-anti-uncertainty theory is slightly more probable, it ignores the anti-uncertainty view entirely.
      *   **(3) Inquiry:** **Limited.** Only values inquiry if it might shift which theory is the favorite. Ignores value within non-favorite theories.
      *   **(4) Continuity:** **Fails.** Prescriptions jump discontinuously when the most probable theory changes (e.g., at credence=0.5001 vs. 0.4999). Does not converge smoothly.
      *   **(5) Precommitment:** **Follows Favorite.** Applies the favorite theory's verdict to the precommitment choice, ignoring future uncertainty resolution.

  *   **Moral Parliament (MP - e.g., voting, bargaining among theories weighted by credence):**
      *   **(1) Incommensurability:** **Handles better than MEC.** Theories "vote" or "bargain" using their *own* scales internally; common output is a compromise act, not a common scale number. Avoids direct cardinal comparison.
      *   **(2) Anti-Uncertainty:** **Fails.** Forces anti-uncertainty theories into a collective decision process they reject. Their "vote" (e.g., always veto any non-optimal act) might paralyze the parliament.
      *   **(3) Inquiry:** **Formalizable but complex.** Can model inquiry as changing parliament composition/voting power. Self-undermining cases remain hard.
      *   **(4) Continuity:** **Succeeds... usually.** As credence ->1, the dominant theory controls the parliament outcome. Specific voting rules must ensure this.
      *   **(5) Precommitment:** **Formalizable but complex.** Parliament must decide on a precommitment rule, facing uncertainty about its own future composition/views.

  **Verdict: Handling Anti-Uncertainty Theories.** This desideratum presents the deepest conceptual challenge, clashing fundamentally with the core aggregation project of DMU and continuity requirements, and eliminating or severely straining the leading candidates.
