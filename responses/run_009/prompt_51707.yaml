answer: |-
  ### Adequate Punishment Theory: Core Desiderata  
  *(Pruned from 15+ candidates to 8 non-redundant, high-stakes requirements)*  

  1. **Non-Sacrifice of Innocents (NSI)**  
     *Must:* Prohibit punishing the innocent *even if* it maximizes social utility (e.g., framing someone to stop a riot).  
     *Reasoning:* Foundational to rule of law; distinguishes punishment from terror. Non-negotiable.  
     *Contested?* Only by radical act-utilitarians (widely rejected).  

  2. **Attempt/Completion Differentiation (ACD)**  
     *Must:* Explain why failed attempts often merit less punishment than completed crimes *despite equal culpable intent* (e.g., 8 vs. 25 years for murder).  
     *Reasoning:* Reflects universal legal practice; must justify moral luck or reject it coherently.  
     *Contested?* **High dispute.** Retributivists split (Moore accepts luck; Duff rejects).  

  3. **Hard Treatment Justification (HTJ)**  
     *Must:* Explain why punishment requires *material deprivation* (imprisonment/fines) beyond symbolic censure.  
     *Reasoning:* State coercion demands stronger justification than moral disapproval alone. Non-negotiable.  

  4. **Decriminalization Response (DCR)**  
     *Must:* Prescribe whether offenders serving sentences must be released if the act is decriminalized (e.g., cannabis possession).  
     *Reasoning:* Tests if punishment is backward-looking (crime-based) or forward-looking (current utility).  
     *Contested?* Hybrid theories struggle acutely here.  

  5. **Proportionality Constraint (PC)**  
     *Must:* Ensure punishments scale with crime severity (e.g., shoplifting < murder).  
     *Reasoning:* Avoids arbitrariness/cruelty; embedded in human rights norms. Non-negotiable.  

  6. **Culpability Requirement (CR)**  
     *Must:* Punish only the culpable (no strict liability for serious crimes).  
     *Reasoning:* Moral agency is prerequisite for blame. Non-negotiable.  

  7. **Systemic Stability (SS)**  
     *Must:* Explain how the institution *reliably* generates net social benefits (deterrence, rehabilitation) without ad hoc fixes.  
     *Reasoning:* Justifies state resources/coercion. Weakly negotiable (but failure implies impracticality).  

  8. **Dignity Preservation (DP)**  
     *Must:* Forbid degrading/inhuman punishments (e.g., torture, indefinite solitary).  
     *Reasoning:* Anchored in Kantian ethics/int'l law. Non-negotiable.  

  ---

  ### Theory Scorecard (Key Failures)  
  | **Theory**          | **Fails Requirement**         | **Why**                                                                 |  
  |----------------------|-------------------------------|-------------------------------------------------------------------------|  
  | **Pure Deterrence**  | NSI, DP                       | Allows framing innocents if beneficial; permits torture for "greater good". |  
  | **Pure Retributivism** | SS, DCR                     | Silent on societal consequences; insists on completing sentences even after decriminalization. |  
  | **Hart Hybrid**      | **DCR**                       | Institutional rules (consequentialist) clash with individual desert (retributive) when laws change. |  

  ---

  ### Critical Insights  
  1. **The Joint Unsatisfiability Problem**:  
     - **NSI + Consequentialism** is the deepest fault line. *No purely forward-looking theory can satisfy NSI* without smuggling in deontic constraints.  
     - **DCR is the hybrid-killer**: Hart’s separation of "general justifying aim" (consequentialist) from "distribution" (retributive) collapses when a crime is decriminalized. Retributivism demands continued punishment (desert is fixed at T1); consequentialism demands release (no future benefit). *This is likely unresolvable within Hart’s framework.*  

  2. **The Knockout Requirement**:  
     **Non-Sacrifice of Innocents (NSI)** eliminates all consistent consequentialist theories (deterrence, rehabilitation). Only retributivism or rights-based hybrids clear it—but they then struggle with ACD and DCR.  

  3. **Ambiguous Desiderata**:  
     - **ACD**: I’m genuinely torn. Moral luck feels unjust, but *denying* it leads to counterintuitive results (e.g., attempted murderer deserves same sentence as successful one). Many courts accept luck pragmatically; philosophers reject it.  
     - **PC**: Is "proportionality" ordinal (ranking crimes) or cardinal (specific sentences)? Retributivists assume the former is objective; consequentialists see both as policy choices. *This ambiguity hides deep disagreements.*  

  ### Conclusion  
  An "adequate" theory must satisfy **NSI, CR, HTJ, DP, and PC** to be morally plausible, and **SS** to be institutionally viable. **DCR and ACD expose irreconcilable tensions**:  
  - If you reject moral luck (ACD), you must punish attempts like completions—but this clashes with legal practice and arguably over-punishes.  
  - If you hybridize, DCR becomes a time-bomb when laws change.  

  **Your suspicion is correct**: Hart’s hybrid *cannot* handle decriminalization coherently. The field’s frustration stems from this—we’re forced to prioritize either *consistency* (sacrificing intuitions) or *coverage* (sacrificing theoretical purity). The most defensible path may be a retributive core (for NSI/CR) with consequentialist *constraints* (for DP/SS), but DCR remains a live wire.  

  > *Source note: Desiderata distilled from Hart (*Punishment and Responsibility*), Duff (*Trials and Punishments*), Moore (*Placing Blame*), and the American Law Institute’s Model Penal Code debates on moral luck (§5.05).*
