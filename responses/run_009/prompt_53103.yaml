  Flagging joint unsatisfiability: chicken-sexer vs. propositional requirement creates tension. Also, the most exclusionary requirement might be the ability to produce novel solutions (improviser), as it challenges rigid propositional views.

  Scoring intellectualism vs. anti-intellectualism briefly. Intellectualism struggles with non-propositional cases like chicken-sexer and improvisation. Anti-intellectualism handles abilities but might blur knowing how vs. mere ability, like in the sleepwalker case.

  Confidence levels: Some points are solid, like knowledge-how without current ability (dad's case). Others are trickier, like the on-command vs. when-it-comes-up distinction—might be practical, not conceptual. Least sure about the chess app as a know-how attributor; it's ambiguous.

  Need to ensure the list is comprehensive, addresses all cases, and highlights conflicts. The user's deeper need is to resolve their argument with brother, so clarity on conflicting points is crucial. They might also want to understand AI capabilities in this context (chess app), so the theory must differentiate between explanatory vs. performative competence.
answer: |-
  Here’s a rigorous desiderata list for any theory of knowledge-how, built from your cases and distinctions. Each requirement is grounded in your examples, with confidence ratings (🟢 = high, 🟠 = medium, 🔴 = low/contested) and notes on whether it’s a genuine constraint or a "camp flag." I’ll flag conflicts and exclusions, then score intellectualism vs. anti-intellectualism against the list.

  ---

  ### **Core Desiderata for an Account of Knowledge-How**
  *(Key: Case/Consideration → Requirement)*

  1. **🟢 KNOWLEDGE-HOW WITHOUT CURRENT ABILITY**  
     *Case:* Your dad (retained sailing knowledge post-stroke, despite inability to execute).  
     *Requirement:* Must allow that one can *know how* to do something even when physical/mental limitations prevent doing it *now*.  
     *Constraint:* Genuine. Forces separation from *mere ability* (e.g., sleepwalker walks but doesn’t "know how" while asleep).

  2. **🟢 ABILITY WITHOUT (FULL) KNOWLEDGE-HOW**  
     *Cases:* Sleepwalker (walks unconsciously), drunk driver (drives "automatically").  
     *Requirement:* Must distinguish *reliable performance* from *genuine know-how*. Know-how implies a form of *agency* or *understanding*.  
     *Constraint:* Genuine. Prevents collapsing know-how into any successful behavior.

  3. **🟠 NON-PROPOSITIONAL EXERCISE**  
     *Cases:* Chicken-sexer (can’t explain criteria), improviser (novel solutions without deliberation).  
     *Requirement:* Must accommodate know-how that is *exercised successfully without access to articulable propositions*.  
     *Constraint:* Genuine. Forces rejection of strong intellectualism (know-how *must* be propositional).  
     *Conflict Risk:* Direct tension with desideratum 7 (propositional teachability).

  4. **🟢 ARTICULATION WITHOUT ABILITY**  
     *Cases:* Ski instructor (explains technique but can’t ski), chess app (explains moves but plays poorly).  
     *Requirement:* Must allow that one can *know that* (propositionally describe a method) without *knowing how* to execute it.  
     *Constraint:* Genuine. Shows propositional knowledge is insufficient for know-how.

  5. **🟠 ABILITY WITHOUT ARTICULATION**  
     *Cases:* Chicken-sexer, amnesiac pianist (plays flawlessly but can’t recall training).  
     *Requirement:* Must allow that one can *know how* without being able to *explain* the method propositionally.  
     *Constraint:* Genuine. Shows propositional knowledge is unnecessary for know-how.

  6. **🟢 NOVELTY HANDLING**  
     *Case:* Improviser (creates unrehearsed moves in new situations).  
     *Requirement:* Must explain how know-how enables *adaptive, situation-specific responses* beyond rote reproduction.  
     *Constraint:* Genuine. Excludes theories reducing know-how to stored routines.

  7. **🔴 PROPOSITIONAL TEACHABILITY (CAMP FLAG?)**  
     *Case:* Your cousin (memorized rules but freezes), ski instructor (teaching via propositions).  
     *Requirement (if included):* Should explain how *some* know-how *can* be taught via propositions (e.g., "bend knees to ski").  
     *Constraint?* Camp flag (intellectualist-leaning). Not universal (chicken-sexer can’t teach propositions).  
     *Conflict Risk:* In tension with 3 and 5. Not all know-how is propositionally teachable.

  8. **🟢 KNOWLEDGE-HOW WITHOUT DELIBERATE RECALL**  
     *Case:* Amnesiac pianist (can’t recall lessons but plays).  
     *Requirement:* Must distinguish know-how from *declarative memory*. Know-how can persist despite loss of episodic/propositional recall.  
     *Constraint:* Genuine. Aligns with procedural vs. declarative memory distinctions.

  9. **🟠 PERFORMANCE-ACTION GAP**  
     *Cases:* Chess app (explains well but performs poorly), your cousin (knows rules but can’t act).  
     *Requirement:* Must explain why *propositional description* of a method ≠ *knowledge-how* to execute it.  
     *Constraint:* Genuine. Central to your debate with your brother.

  10. **🟢 ON-COMMAND VS. WHEN-IT-COMES-UP (PRAGMATIC FLEXIBILITY)**  
      *Case:* Your cousin (freezes under pressure), improviser (acts fluidly in context).  
      *Requirement:* Must handle whether "knowing how to A *on command*" (e.g., in practice) and "knowing how to A *when context demands it*" (e.g., stress) are distinct.  
      *Constraint:* Practical (for hiring/praise), but may reduce to performance conditions, not knowledge itself.

  ---

  ### **Key Conflicts & Exclusionary Power**
  - **Joint Unsatisfiability Alert:** Desiderata **3 (non-propositional exercise)**, **5 (ability without articulation)**, and **7 (propositional teachability)** conflict. If a theory demands *all* know-how be propositional (7), it fails the chicken-sexer (3,5). Conversely, if it rejects 7 entirely, it struggles with cases like the ski instructor teaching via propositions.  
    → *Your core tension: Intellectualism must weaken 3/5; anti-intellectualism must weaken 7.*  
  - **Most Exclusionary Requirement:** **Novelty Handling (6)**. Forces theories to explain *generativity* (e.g., improvising). Rules out rigid "method-recalling" models. Runner-up: **Performance-Action Gap (9)** (e.g., why the chess app isn’t credited with know-how).

  ---

  ### **Scoring the Contenders**
  *(Short, criteria-focused assessment)*

  1. **Intellectualism (Know-how = Knowing a Proposition)**  
     - ✅: Handles 7 (teachability), 8 (propositional knowledge ≠ recall), 9 (app fails as it lacks "true" propositions).  
     - ❌: Fails 3 (chicken-sexer), 5 (amnesiac pianist), 6 (improviser). *Your dad?* Only if "knowing" inert propositions counts (feels inadequate).  
     - *Verdict:* Overly rigid. Can’t explain non-propositional skill.

  2. **Anti-Intellectualism (Know-how = Ability + Dispositions)**  
     - ✅: Nails 3, 5, 6 (chicken-sexer, improviser), 8 (dispositions ≠ recall). *Your dad?* Yes, if dispositions persist post-stroke.  
     - ❌: Fails 1 (dispositions require ability?), 2 (sleepwalker has dispositions but not know-how), 9 (cousin has disposition to freeze, not act).  
     - *Verdict:* Blurs know-how with unreliable ability; struggles with "inactive" knowledge.

  ---

  ### **Confidence & Uncertainty**
  - **Highest Confidence:** 🟢 1, 2, 4, 8, 9 (cases like your dad, sleepwalker, chess app are unambiguous constraints).  
  - **Moderate Confidence:** 🟠 3, 5, 6 (chicken-sexer/improviser force non-propositional elements; novelty is irreducible).  
  - **Low Confidence/Contested:** 🔴 7 (propositional teachability is a camp flag; your ski instructor *teaches* but doesn’t *possess* know-how).  
  - **Least Sure Point:** **10 (on-command vs. when-it-comes-up)**. This may reflect performance anxiety or context-sensitivity, not knowledge itself. Is it two types of know-how, or one know-how with contextual triggers? Genuinely messy.

  ---

  ### **Summary for Your Purpose**
  For praising your dad or hiring: A theory must satisfy **1, 2, 4, 6, 9** (knowledge-without-ability, anti-automatism, articulation-without-skill, novelty, performance gap). Neither pure intellectualism nor anti-intellectualism nails all; a hybrid (e.g., *guided dispositions* or *practical concepts*) may be needed. Your chess app fails on **9**—it has "know-that" but lacks skill-integration for performance. Your brother wins that round, but the chicken-sexer and your dad sink strict intellectualism. The messiness is real; no theory gets all cases cleanly.
