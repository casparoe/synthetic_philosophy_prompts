  The user wants to know which desiderata might conflict. For example, if a theory must account for the chicken-sexer (non-propositional) but also insists knowledge-how is propositional, that's a conflict. Also, they need to know which requirement is most critical in excluding theories.

  I should structure the desiderata based on the cases. Each point must reference which case or distinction necessitates it. Then, assess if each is a real constraint or a bias. For instance, the stroke case (dad) requires knowledge-how without current ability. The chicken-sexer needs non-propositional aspects. Articulation vs. exercise distinction comes from the cousin and the chess app.

