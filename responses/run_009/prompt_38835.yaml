answer: |-
  Here are 7 focused questions pressing on the hard parts of moral particularism, designed to avoid the stump speech, with likely follow-ups. They target holism, moral education, defensible-generalism, and the utility of shallow generalizations:

  **Core Questions & Likely Follow-Ups:**

  1.  **Holism of Reasons - Concrete Favouring Case:**
      *   **Question:** "You argue that *any* consideration, like causing pain or breaking a promise, can count in favor of an action in some context. Beyond gesturing at 'weird cases,' could you give a single, plausible, real-world example where the fact that an act **involves lying** is *itself* a positive moral reason *for* doing it – not just excusable or outweighed, but where the lie *contributes positively* to the act's rightness?"
      *   *Likely Answer:* She might cite lying to a murderer at the door, or lying playfully in a game. She might argue the lie *protects*, or *fulfills a game's rules*, making it positive *in that context*.
      *   **Follow-Up:** "In that Nazi-at-the-door case, isn't the positive reason actually the *protection of life*, and the lie is merely the necessary *means*? Is the 'lie-ness' itself generating a positive reason, or is it just that its *negative* reason (deception/harm to truth-seeking) is massively *overridden* by the positive reason of saving a life? How do you distinguish the lie *contributing* a positive reason from its negative reason being *silenced*?"

  2.  **Moral Education & Shared Criticism:**
      *   **Question:** "Critics argue that without stable principles, moral education becomes impossible – we couldn't teach children rules like 'don't lie' or 'don't hit,' and shared moral criticism collapses because we lack common standards. How do particularists teach children right from wrong, or justify criticizing others, without implicitly relying on defeasible generalizations?"
      *   *Likely Answer:* She'll emphasize teaching sensitivity to context, perception of salient features, and developing moral character/virtues (like honesty understood as context-sensitive). Criticism focuses on failure to see what *this* situation demanded.
      *   **Follow-Up:** "But doesn't *any* lesson like 'Lying usually hurts people and breaks trust, so don't do it unless there's a very good reason' *rely* on the defeasible generalization 'lying tends to be wrong'? Isn't *every* parent effectively a 'defensible generalist' in practice, teaching rules-of-thumb they know have exceptions? Doesn't your description of moral education *presuppose* the usefulness of the generalizations you deny are genuine principles?"

  3.  **Defensible-Generalism vs. Substantive Disagreement:**
      *   **Question:** "Defensible generalists argue that reasons *do* have default polarities (e.g., lying *normally* counts against), but these are overridden in complex contexts. They see principles as useful guides with built-in 'unless...' clauses. Is your disagreement with them merely semantic – a fight over whether these defeasible generalizations 'deserve the name' principle – or is there a *substantive* difference in how moral reasoning actually works?"
      *   *Likely Answer:* She'll argue it's substantive. Defeasible generalizations are mere empirical summaries or heuristics, not *normative* principles guiding reasoning. Real reasoning involves holistic perception of the case's unique constellation of features, not applying a rule and checking for exceptions.
      *   **Follow-Up:** "If the defensible generalist agrees that in any *actual* judgment about a complex case, we must consider *all* relevant features holistically to determine the right action, and that no simple rule captures this, what *practical* difference remains? Does particularism offer a different *procedure* for reasoning, or is the difference purely metaphysical (about the *existence* of principles), without altering how we *do* ethics?"

  4.  **The Utility of Shallow Generalizations:**
      *   **Question:** "Particularism grants that shallow generalizations like 'Lying tends to be wrong, other things equal' are useful heuristics or summaries of past experience. But critics argue these generalizations are doing *all* the substantive work in guiding action and criticism, while the radical thesis that *there are no true moral principles* seems inert. If these generalizations reliably point us towards what's salient and structure our moral learning and discourse, why deny them the status of (defeasible) principles? What *explanatory or practical work* does the 'no principles' thesis actually do that the generalizations don't?"
      *   *Likely Answer:* She'll argue the generalizations *mislead* by suggesting a rule exists to be applied, potentially blinding us to novel features or the need for full contextual sensitivity. They are *descriptive* summaries, not *prescriptive* guides. The 'no principles' thesis keeps us focused on the particular case.
      *   **Follow-Up:** "But in the vast majority of mundane cases (e.g., deciding not to lie to my colleague about why a report is late), isn't 'lying tends to be wrong' *exactly* the reason I act on? And doesn't successfully navigating life *rely* on acting on these generalizations most of the time? Doesn't this suggest that while your thesis might be metaphysically radical, its practical impact on everyday moral life is negligible, and the generalizations *are* functionally equivalent to principles for most purposes?"

  5.  **The Charge of Normative Indeterminacy:**
      *   **Question:** "If there are no principles, and the moral valence of any feature is radically context-dependent, how does particularism avoid collapsing into a kind of normative indeterminacy? What guarantees that two agents, both properly sensitive to the 'whole context,' will converge on the same judgment, or even identify the *same* features as salient? Doesn't the lack of principles make shared moral understanding surprisingly fragile?"
      *   *Likely Answer:* She'll appeal to shared forms of life, common human capacities for perception and empathy, and the development of virtuous character that reliably discerns salience. Convergence is explained by shared human nature and social training, not principles.
      *   **Follow-Up:** "But isn't widespread moral disagreement, even among the thoughtful and sensitive, evidence that this shared perception *isn't* sufficient? Without principles to appeal to, how do particularists resolve deep disagreements beyond saying 'Look harder!'? Doesn't the *need* for moral argument suggest we *do* appeal to something rule-like?"

  6.  **The Role of Consistency:**
      *   **Question:** "We often criticize people for inconsistency – treating like cases differently without relevant difference. Doesn't this practice presuppose a kind of principle: that if feature-set F makes action A right in case C1, it should make A right in case C2 *unless* there's a morally relevant difference between C1 and C2? How does particularism account for the normative force of consistency demands without smuggling in a principle?"
      *   *Likely Answer:* Consistency demands stem from the requirement to see the *real* salient features accurately. If cases look similar but are judged differently, it suggests a failure to perceive the true (dis)similarities in the holistic context. It's about accurate perception, not rule-following.
      *   **Follow-Up:** "But doesn't the *identification* of a 'morally relevant difference' itself require a judgment about which features *should* make a difference? How do we learn or agree on what counts as a relevant difference without some background generalizations about what features *tend* to matter? Doesn't the consistency demand itself function like a proto-principle?"

  7.  **Particularism and Moral Progress:**
      *   **Question:** "How does particularism explain moral progress? For example, the shift in viewing slavery as always wrong. Generalists might say we discovered a true principle ('All humans have equal inherent dignity'). What's the particularist account? Did we just start seeing new salient features in *every* individual slavery case?"
      *   *Likely Answer:* Yes, we came to see features like the intrinsic suffering, the violation of autonomy, the universal capacity for agency/full life in *each* enslaved person with greater clarity. Progress comes from refined moral perception and sensitivity, not discovering abstract principles.
      *   **Follow-Up:** "But doesn't the *universal* condemnation of slavery now – the insistence that *no* context makes it permissible – look remarkably like the acceptance of an absolute or near-absolute principle? Isn't the particularist forced to say that we *might*, in some unimaginable context, perceive features that make slavery permissible? And doesn't that undermine the absoluteness of our current condemnation?"

  **Key Prep Notes:**

  *   **Listen Closely:** The power is in the follow-ups. Listen carefully to *exactly* how she frames her answers. Does she rely on "silencing," "overriding," or truly claim a feature *switches polarity*? How does she characterize "defeasible generalizations" – dismissively or as useful tools?
  *   **Press Concreteness:** Especially on Holism (Q1), demand a clear example where the *lie itself* is a pro tanto *reason for*. Don't let her get away with examples where the lie is merely a means to an end justified by *other* reasons (like saving life).
  *   **Semantic vs. Substantive:** Keep pressing on Q3. Is her objection to "principles" just that they aren't strict/absolute, or is it deeper? Does she think defeasible generalizations play *no normative role*?
  *   **Functionality:** On Q4 & Q6, emphasize the *functional* role generalizations/consistency demands play. If they guide action and criticism effectively, why deny them the status of (a type of) principle?
  *   **Avoid Jargon Traps:** If she retreats into highly technical distinctions (e.g., "resultance" vs. "supervenience"), gently steer back to practical consequences and examples ("How would this play out in teaching a child?").

  These questions should force engagement beyond the surface presentation and get to the core tensions within particularism. Good luck!
