  Third, defensible-generalism is the biggest threat - if reasons have default weights, haven't we just got messy principles? Philosopher will claim ceteris paribus clauses are empty. Follow-up must force her to explain why particularism isn't just describing complex principles.

  Last, on shallow generalizations - user suspects they're doing all the work. Philosopher will say they're mere summaries with no authority. But then why do we rely on "lying is wrong" as a heuristic? Follow-up should question if this concedes the game to generalism.

  The user's "rough is fine" note is helpful - they want dial-up questions, not polished scripts. Should avoid definitions (they know them) and focus on traps that prevent evasion. Each cluster needs a primary question + likely-dodge follow-up. 

  Noticing they didn't ask about metaphysics - smart, that'd derail into abstraction. Keeping it grounded in practice: child-rearing, plausible cases, what "tends" means. Reporter clearly wants philosopher to sweat, not sermonize. 

  Biggest risk is philosopher retreating to "context is king" platitudes. Questions must demand concrete commitments. Example: if she says Nazi-at-door justifies lying, make her explain why that's the lie counting positively rather than other factors overriding its negativity. 

  Also prepping for deflection - particularists often pivot to attacking generalism's rigidity. Follow-ups must rope her back to defending her own position. "That's an interesting critique of principles, but could you explain under particularism..." 

