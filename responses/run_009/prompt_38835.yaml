prompt: |-
  hey, i'm a science and ideas reporter and I just got an hour with a philosopher who defends moral particularism — the view that there are no true moral principles, because whether a consideration counts for or against an action depends on the whole context of the case. She's given the stump version a hundred times so I dont want her re-running it. can you draft 7-9 questions that actually press on the hard parts? at least one on holism of reasons — pressing her to give a genuinely worked example where something like the fact that an act is a lie counts in its favor, not just the usual gesturing at weird cases; one on the objection that without principles moral education and shared moral criticism fall apart, with a follow-up on whether her reply to that is compatible with how anyone actually teaches kids; one aimed at the defensible-generalism move, where reasons keep their normal polarity unless overridden — I want to press on whether her dispute with that view is substantive or just a fight over whether ceteris paribus clauses deserve to be called principles; and one on whether shallow generalizations like lying tends to be wrong, other things equal, end up doing all the real work while the radical thesis does none. for each, give a follow-up keyed to the answer she's most likely to give. this is for my own prep so rough is fine.
reasoning: |-
