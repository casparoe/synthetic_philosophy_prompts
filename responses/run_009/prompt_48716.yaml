answer: |-
  Your argument cuts to the heart of modern political philosophy – specifically, **"equality of what?"** Here’s a breakdown of the theories at play, why the elevator policy likely aligns with the **capabilities approach**, and how the fare discount complicates things:

  ### 1. **The Elevator Policy: Capabilities Equality**
      - **Core Idea (Sen/Nussbaum):** Equality isn’t about resources (money) or welfare (happiness), but about **real freedoms to achieve valuable "beings and doings"** (functionings). For disability policy, the goal is enabling people to *function* in society – e.g., *actually traveling* via metro, accessing jobs/social life, not just having taxi money.
      - **Why Elevators Fit:**  
        - They create **universal access**, enabling spontaneous/independent use of the *same* system as others.  
        - Taxis/cash don’t guarantee equal participation: They might be unreliable, stigmatizing, or impractical (e.g., rush hour).  
        - **Symbolic Value:** Public infrastructure signals that disabled citizens *belong* in shared spaces.
      - **Counter to Your Cash Proposal:** Capabilities theorists argue cash transfers **don't guarantee functionings**. Money can’t always buy equivalent access (e.g., if taxis refuse service), and it shifts the burden onto individuals to solve systemic barriers.

  ### 2. **Your Cash Transfer Proposal: Resource Equality**
      - **Core Idea (Dworkin/Rawls):** Equality means distributing **fair shares of resources** (income, wealth, opportunities). Let people decide how to use them.
      - **Why It Seems Better:**  
        - Maximizes choice (taxis, cars, etc.).  
        - Efficiently targets *all* disabled people (including those who can’t use metros).  
        - Avoids "white elephant" elevators at unused stations.
      - **Capabilities Critique:** Resources alone don’t account for **conversion factors** – a wheelchair user converts money into mobility differently than an able-bodied person. Systemic barriers (e.g., inaccessible streets) persist.

  ### 3. **The Fare Discount: A Clash Within the System?**
      - **The Inconsistency:**  
        - **Elevators** = Capabilities (directly enabling functioning).  
        - **Fare Discounts** = Resource transfer (money saved = more resources for other goals).  
      - **Possible Justifications:**  
        - **Pragmatism:** Discounts compensate for extra costs of being disabled (supplementing capabilities).  
        - **Hybrid Theory:** Agency uses resources *where efficient* (discounts) and capabilities *where necessary* (physical access).  
        - **Incoherence:** It *might* reflect bureaucratic compromise, not philosophical rigor.

  ### 4. **Utilitarianism: The Wildcard**
      - A utilitarian *could* endorse elevators **if** they maximize overall welfare (e.g., by benefiting non-disabled users with strollers/luggage, reducing traffic, or creating jobs).  
      - **But:** This is **contingent** – if cash transfers generated more welfare (e.g., by funding healthcare), utilitarianism would prefer that. *The policy itself doesn’t presuppose capabilities; it’s outcome-dependent.*  

  ### 5. **If Your City Adopted Cash Transfers:**
      - **It Implies Resource Equality is Paramount.** Equality = having equivalent purchasing power, not guaranteed access.  
      - **Inconsistencies Would Emerge:**  
        - **Accessible Public Bathrooms:** Why build them if people can use cash for private alternatives?  
        - **Mandatory Ramps/Doors:** Why regulate private businesses for accessibility?  
        - **Personal Assistants:** Cash grants could replace state-funded programs, risking underprovision.  
      - **Capabilities Response:** This approach **abandons social responsibility for inclusion**. Public goods (metro, parks, libraries) must be universally usable to be truly public.

  ### Key Takeaways:
  - **Elevators Presuppose Capabilities Equality:** The state must ensure **actual access to key functionings** (mobility, participation), not just resources.  
  - **Fare Discounts Undermine the Purity:** They fit better with resource equality, revealing policy inconsistency.  
  - **Your Proposal is Resource-Egalitarian:** Logically coherent but rejects the claim that society must guarantee *shared experiences*.  
  - **Real Policy is Messy:** Agencies mix theories pragmatically (elevators for access, discounts for affordability).  

  ### Philosophical Resolution?
  Your flatmate is likely invoking **Martha Nussbaum’s capabilities approach** (which frames access as a matter of **dignity and fundamental entitlements**). To challenge this, you’d need to argue that:  
  1. **Resource equality better respects autonomy** (let people choose their mobility solutions).  
  2. **Capabilities are paternalistic** (the state decides which "functionings" matter).  
  3. **Efficiency demands cash transfers** (avoid wasting millions on underused elevators).  

  The fare discount hypocrisy is your strongest point: if the agency truly believed in capabilities, it might subsidize on-demand transport *or* make fares free for disabled users to maximize access, not just offer a resource transfer.  

  This isn’t just about metros—it’s about whether society should build a world where everyone can *do* things together, or just give people cash and wish them luck. Both views have merit, but they’re fundamentally at odds.
