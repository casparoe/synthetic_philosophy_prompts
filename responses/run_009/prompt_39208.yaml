  Therefore, in a system with unreliable communication, common knowledge of the posteriors is impossible, so the agents can have different posteriors. 

  But note: in a system with reliable communication, common knowledge can be achieved (e.g., by broadcasting). Then Aumann's theorem would force agreement. 

  In fact, in distributed systems with reliable broadcast, we can achieve common knowledge. So then Aumann's theorem would apply: if the agents have common prior and update by conditioning, then when they achieve common knowledge of their posteriors, they must agree.

  But wait: in distributed systems, we don't typically model the agents' posteriors. We model their outputs. So if the protocol requires them to output their posterior, and if they achieve common knowledge of the outputs, then the outputs (the posteriors) must be equal? But only if they have common prior and update by conditioning.

