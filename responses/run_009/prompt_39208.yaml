  We are going to translate Aumann's agreement theorem into the vocabulary of distributed systems.

  Aumann's theorem (1976) states that two agents (or more) with the same prior probability distribution over a set of states, who have common knowledge of each other's posterior probabilities of an event A, must have the same posterior probability of A. The theorem relies on two key assumptions: (1) the agents have a common prior, and (2) they update their beliefs by conditioning on their private information (which partitions the state space).

  In distributed systems terms:

  - The system has multiple nodes (agents). 
  - The state space is a set of global states, including the state of the environment and the internal states of the nodes.
  - Each node has a private information partition: for each global state, the node only observes part of the state (its local state). This defines an equivalence class of global states that are indistinguishable to the node.
  - The prior is a probability distribution over the global states. The common prior assumption means that all nodes start with the same initial probability distribution over the global states (like identical initial states in a replicated system? but note: it's a distribution, so it's probabilistic).

  The evolution of the system: each node observes an event (a subset of the state space) and updates its belief (posterior probability) by conditioning on its private information (the set of states it considers possible).

  Aumann's theorem says: if at some point the posterior probabilities of an event A (a subset of states) become common knowledge (i.e., every node knows the posterior of every other node, and every node knows that every other node knows, and so on ad infinitum) then the posterior probabilities must be equal.

  But note: in Aumann's setting, the communication is assumed to be perfect and the updating is instantaneous. Moreover, the theorem is about the agents' beliefs at a given state (i.e., at a given point in the execution).

  Now, the "disagreement debate": Aumann's theorem seems to imply that rational agents with common priors cannot "agree to disagree". However, in practice, we see disagreements. So the debate is about the assumptions: common prior, common knowledge of posteriors, and the updating rule.

  Translation to distributed systems:

  1. **States and executions**: 
     - The global state space is fixed (a set of possible worlds). 
     - An execution is a path through the state space, but Aumann's theorem is stated at a single state (a snapshot). However, the state includes the history (because the private information is based on what they have observed). So we can think of the state as being at a particular point in an execution.

  2. **Message-passing over unreliable channels**: 
     - In Aumann's original model, communication is perfect and the agents can share their beliefs arbitrarily. In distributed systems, we often consider unreliable channels (e.g., lossy, asynchronous). 
     - The common knowledge condition in Aumann requires that the posteriors be common knowledge, which in a distributed system with unreliable communication is hard to achieve (because common knowledge is unattainable in the coordinated attack problem).

