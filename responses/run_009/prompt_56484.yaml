prompt: |-
  For background reading before a tutorial on Lewis's account of convention, our course pack included a chapter from a recent popular book on game theory in social life, and I want to check whether it can be trusted. The chapter summarizes Lewis as follows: Lewis analysed conventions as solutions to coordination problems — a convention is simply whatever regularity of behaviour lets a community solve one, so wherever there is no coordination problem there can be no conventions. Because conventions are held in place by nothing more than first-order expectations (each person conforms only because she expects the others to conform), no convention ever needs enforcement, and indeed no convention could intelligibly be sanctioned, since punishment would be pointless where deviation is already penalised by failed coordination. Lewis also argued that conventions are arbitrary in the strong sense that no convention is better than any of its rivals: since the community would have coordinated just as well on an alternative regularity, no one can ever have reason to criticise a convention from outside it. And because language is for Lewis the paradigm convention, he concluded that linguistic meaning is nothing over and above regularity in the production of sounds and marks.

  My tutor mentioned in passing that Lewis builds an infinite hierarchy of mutual expectations into the definition, and that he explicitly discusses conventions backed by sanctions, so she suspects the chapter is seriously misleading — but the book is written by someone with a professional background in the field, and I can't tell which of her worries are supposed to attach to which sentence, or whether some of the claims are defensible simplifications of the kind popular books are licensed to make.

  Could you audit the summary claim by claim? For each element, tell me which parts a careful defender of Lewis would accept, which are simplifications a popularizer might reasonably make, and which contradict things Lewis explicitly says or builds into his definition. Please be specific about what the definition actually requires — for instance, what role the preference structure and the availability of an alternative regularity play, and how common knowledge is generated — rather than just saying the summary is unfair. Then there is a second question: the chapter closes by claiming that since conventions are arbitrary in the strong sense and sanction-free, the sense in which one ought to keep to a convention cannot be explained by the convention itself, so the 'ought' must be either prudential or imposed from outside — and that our practice of criticising people for breaching conventions is therefore confused. Does that conclusion follow from the accurate parts of the summary, or does it trade on one of the inaccuracies? Please answer in British English.
reasoning: |-
  Hmm, the user is asking me to audit a summary of David Lewis's theory of conventions from a popular game theory book. They want to know which parts are accurate, which are simplifications, and which are outright wrong according to Lewis's actual work. They've also shared their tutor's concerns about the summary being misleading.

  Looking at the summary, it makes several claims: conventions are solutions to coordination problems only; they rely solely on first-order expectations; they never need enforcement; they're arbitrary in a strong sense where no convention is better than alternatives; and language is presented as the paradigm convention. The tutor mentioned that Lewis actually discusses an infinite hierarchy of expectations and sanctions, which contradicts parts of this summary.

  I need to go through each claim systematically. For coordination problems, Lewis does see conventions as solutions to coordination problems, but his definition is more specific - it requires a particular preference structure where people prefer to coordinate on the same solution rather than not coordinating at all. The "no convention without coordination problem" part is essentially correct.

  Regarding expectations, the summary oversimplifies by mentioning only first-order expectations. Lewis actually builds mutual expectations to infinity, meaning common knowledge where everyone expects conformity, expects others to expect conformity, and so on. This is crucial for stability.

  The claim about no enforcement is clearly wrong. Lewis explicitly discusses how sanctions can support conventions - they just can't be the only reason for conformity. The popular book seems to miss this nuance.

  On arbitrariness, the summary goes too far. Lewis says conventions must have alternatives that would work equally well, but not that all alternatives are equally good. He allows for some conventions to be better than others if they have additional benefits.

  For language as paradigm, this is accurate to Lewis's view, though he did see language as more complex than simple coordination.

  The user also asks about the book's conclusion that the "ought" of convention must be external. This trades on the inaccuracies - since sanctions do play a role for Lewis, and conventions aren't necessarily arbitrary in that strong sense, the "ought" can be explained within the system through expectations and sanction risks.

  I'll structure my response to address each claim point by point, clarify what Lewis actually says about preference structures, alternative regularities, and common knowledge generation, and then tackle the "ought" question specifically. I'll make sure to use British English as requested and be precise about where the popular book gets things right or wrong.
answer: |-
  Here's a claim-by-claim audit of the popular book's summary of Lewis's convention theory, based on *Convention: A Philosophical Study* (1969), highlighting what a careful defender would accept, reasonable simplifications, and contradictions. I'll then address the concluding claim about the "ought".

  **Audit of the Summary:**

  1.  **Claim:** "Lewis analysed conventions as solutions to coordination problems — a convention is simply whatever regularity of behaviour lets a community solve one, so wherever there is no coordination problem there can be no conventions."
      *   **Defender's Acceptance:** **Mostly Acceptable, but Simplified.** Lewis *does* define conventions as solutions to recurrent coordination problems. A coordination problem exists when agents have a *common interest* in coordinating their actions (all prefer a successful coordination outcome over coordination failure) and there are *multiple equilibria* (at least two distinct combinations of actions where each is the best response to the others, and coordination is achieved).
      *   **Simplification:** The phrase "simply whatever regularity" is too vague. Lewis's definition is precise: a convention is a *regularity R* in the behaviour of members of a population P when they are agents in a recurrent situation S, such that:
          *   Everyone conforms to R.
          *   Everyone *expects* everyone else to conform to R.
          *   Everyone *prefers* to conform to R *on the condition* that others do, because S is a coordination problem and uniform conformity to R is a *coordination equilibrium* in S.
          *   There is at least one *alternative* possible regularity R' which, if everyone conformed to it and expected others to, would also solve the coordination problem (i.e., it would also be a coordination equilibrium).
      *   **Contradiction:** None. The core link to coordination problems is central and accurate. The "no convention without coordination problem" is essentially correct within Lewis's framework.

  2.  **Claim:** "Because conventions are held in place by nothing more than first-order expectations (each person conforms only because she expects the others to conform)..."
      *   **Defender's Acceptance:** **Contradicts Lewis Explicitly.** This is a significant error. Lewis builds an *infinite hierarchy of mutual expectations* into his definition, culminating in **common knowledge**.
          *   It's not just that each expects others to conform (1st-order).
          *   Each expects *each other* to expect conformity (2nd-order).
          *   Each expects each other to expect each other to expect conformity (3rd-order).
          *   And so on, *ad infinitum*. Lewis argues this infinite hierarchy (common knowledge) is necessary for the stability of convention. Conformity isn't just based on expecting others *now*, but on the shared, mutually reinforcing knowledge *that* everyone expects conformity, knows everyone knows, etc. This creates a robust, self-reinforcing system.
      *   **Simplification:** A populariser might reasonably say conventions are held in place by "mutual expectations" or "everyone expects everyone else to conform" *as shorthand for common knowledge*. But explicitly stating "nothing more than first-order expectations" and "only because she expects the others to conform" misrepresents the depth and structure Lewis requires.

  3.  **Claim:** "...no convention ever needs enforcement, and indeed no convention could intelligibly be sanctioned, since punishment would be pointless where deviation is already penalised by failed coordination."
      *   **Defender's Acceptance:** **Contradicts Lewis Explicitly.** Lewis explicitly discusses and allows for conventions *backed by sanctions*.
          *   He recognises that conformity can be motivated *both* by the desire to coordinate *and* by the fear of sanctions (pp. 97-100).
          *   Sanctions can *reinforce* the convention. The key point is that the *primary* reason for conformity must remain the conditional preference for coordination based on expectations. If conformity were *solely* due to fear of sanctions, it wouldn't be a convention in Lewis's sense. But the presence of sanctions, making deviation even *worse* than mere coordination failure, is perfectly compatible with his definition. The sanction provides an *additional* penalty beyond coordination failure.
          *   The claim that punishment is "pointless" ignores that sanctions can *stabilise* the convention against weak temptations to deviate where the coordination penalty alone might not suffice, or against mistakes. The "penalty" of failed coordination is intrinsic to the situation; an added sanction is an extrinsic reinforcement.
      *   **Simplification:** A populariser might reasonably emphasise that conventions *can* exist *without* formal enforcement mechanisms, relying purely on the coordination incentive. But to say they *never* need enforcement and *cannot intelligibly be sanctioned* is a direct contradiction of Lewis's text.

  4.  **Claim:** "Lewis also argued that conventions are arbitrary in the strong sense that no convention is better than any of its rivals: since the community would have coordinated just as well on an alternative regularity, no one can ever have reason to criticise a convention from outside it."
      *   **Defender's Acceptance:** **Overstated and Misleading.**
          *   **Acceptable Core:** Lewis defines arbitrariness as meaning there must be *at least one* alternative regularity R' that would have solved the coordination problem *just as well* if it had been established instead. This rules out regularities that are uniquely optimal.
          *   **Contradiction/Overstatement:** Lewis *does not* claim "no convention is better than any of its rivals" in a *strong* sense. He explicitly allows that some conventions *can* be better than their alternatives *on other grounds* (pp. 76-80). For example:
              *   One convention might be *simpler* or *easier to learn* than an alternative.
              *   One convention might have beneficial *side effects* that an alternative lacks.
              *   One convention might be *fairer* in its distribution of benefits/costs than an alternative.
          *   Therefore, one *can* have reason to criticise a convention "from outside" based on these *other* values (efficiency, fairness, simplicity). The criticism isn't that it fails to solve the coordination problem (it does), but that an alternative would solve it *and* be better in these other respects. Lewis's arbitrariness only means there's no reason *specific to the coordination problem itself* to prefer one convention over another *among those that solve it*.
      *   **Simplification:** A populariser might reasonably say conventions are "arbitrary" meaning there are always alternatives that would have worked *for coordination purposes*. But stating "no convention is better than any of its rivals" *simpliciter* and that criticism "from outside" is *never* possible goes too far and ignores Lewis's nuanced discussion.

  5.  **Claim:** "And because language is for Lewis the paradigm convention, he concluded that linguistic meaning is nothing over and above regularity in the production of sounds and marks."
      *   **Defender's Acceptance:** **Broadly Acceptable, but Nuanced.**
          *   Lewis *does* take language as a central paradigm of convention.
          *   He *does* argue that the semantic properties of language (meaning, truth-conditions) are constituted by conventions governing the use of sounds and marks. Meaning arises from the regularities in how speakers use language within a population, driven by the mutual expectations inherent in convention.
      *   **Simplification:** The phrase "nothing over and above regularity" is a strong reductive claim. Lewis's account is sophisticated, integrating convention with speaker intentions (truthfulness and trust) within the game-theoretic framework. While the *convention is the regularity*, the meaning arises from how that regularity functions within the system of communication governed by mutual expectations and preferences. However, for a popular summary, this captures the core anti-platonic, naturalistic thrust of his view. It's a reasonable simplification *if* the context acknowledges the underlying complexity of the account.

  **The "Ought" Question:**

  The chapter concludes: "since conventions are arbitrary in the strong sense and sanction-free, the sense in which one ought to keep to a convention cannot be explained by the convention itself, so the 'ought' must be either prudential or imposed from outside — and that our practice of criticising people for breaching conventions is therefore confused."

  *   **Does this follow from accurate parts?** No. The argument *trades directly on the inaccuracies* identified above:
      1.  **Sanction-Free:** As Lewis explicitly allows for conventions backed by sanctions, the "ought" *can* sometimes involve an element of avoiding punishment. More importantly, the primary "ought" *is* explained internally: you *ought* to conform if you want to achieve coordination and believe others expect you to conform. This is a perfectly intelligible *prudential* "ought" based on your own preferences and beliefs. Lewis doesn't need an "external" source for this basic rational imperative. The chapter wrongly dismisses the coordination-based "ought".
      2.  **Arbitrariness in the Strong Sense:** Because Lewis doesn't hold the "strong sense" (that *no* convention is better than any rival *on any grounds*), criticism of a convention breach *can* be intelligible. You can criticise someone:
          *   For causing coordination failure (if their breach leads to it).
          *   For acting against the common interest in coordination (a prudential failure affecting others).
          *   For undermining a convention that *is* better than known alternatives on grounds of fairness, efficiency, etc. (e.g., criticising someone for using a discriminatory term upheld by convention when a neutral alternative exists).
          *   For free-riding on the convention while expecting others to uphold it.
      The criticism isn't necessarily "confused"; it can be based on the prudential "ought" to coordinate, the negative consequences of breach, or the relative merits of the convention compared to alternatives – all factors Lewis's account accommodates.

  In summary, while the popular chapter gets the core link to coordination problems and language roughly right, it significantly misrepresents Lewis on the role of common knowledge (replacing it with mere first-order expectations), the possibility of sanctions, and the nature of arbitrariness. Its conclusion about the "ought" being inexplicable internally or making criticism confused relies crucially on these misrepresentations, particularly the denial of the coordination-based prudential "ought" and the false claim of strong arbitrariness. A careful defender of Lewis would reject these specific claims and the resulting conclusion.
