prompt: |-
  I'm a philosophy grad student who spent last semester sitting in on a behavioral economics course out of curiosity, and I keep running into the same fight whenever the two groups end up in the same room: whether hyperbolic discounting "solves" akrasia. The economists' side of it, roughly: with hyperbolic rather than exponential discount curves you get systematic preference reversals — a far-off bigger reward can be ranked above a sooner smaller one, but as the smaller one gets close, its value spikes and it wins. So at the moment of action the smoker genuinely ranks the cigarette above the health payoff. There's even a literature that goes further, treating the agent as a sequence of temporally distinct selves whose interests conflict, and willpower as something like strategic bargaining between them. Akrasia, on this picture, is just dynamically inconsistent preference — an ordinary, well-understood feature of the curves, not a paradox about the will.

  The philosophers, meanwhile, insist this at best explains the pattern of choices and doesn't touch the actual puzzle, which goes back to Socrates pressing Protagoras on how someone can, at the moment of acting, still be able to avow that all things considered the other option is worse, avow it sincerely, and act anyway. The discounting story explains why the near-term option wins the bidding, but the puzzle is about how the evaluative judgment survives intact while being motivationally inert, and a value curve over goods doesn't seem to have anywhere to put that. There was a move a while back to reframe weakness of will as abandoning a resolution rather than acting against one's better judgment, and the philosophers liked that, but the economists just shrugged — resolutions, they said, are also just preferences with their own time constants, so the same model swallows them too. When someone brought up the neuroimaging work where limbic regions light up disproportionately for sooner rewards, one of the philosophers called it a relabeling, not an explanation, and that's kind of where it died. This has been going in circles for years as far as I can tell, and it doesn't look like anyone has moved.

  My own working theory, and I offer it as just a guess: the two camps mean different things by "irrational." For the economists it's a formal property — you're irrational when your preferences are inconsistent across times in a particular way. For the philosophers it's a property of agency — you fail to be governed by your own reflective assessment of what you have most reason to do. If that's right, the hyperbolic model solves their problem and was never aimed at ours, and the whole argument is two questions traveling under one name. But I'm honestly not sure, because the philosophers also keep claiming the economic model makes some kind of factual error — that it can't distinguish weakness of will from compulsion, say, or that sincere avowal at the moment of action doesn't really fit the preference-reversal story — and if any of those complaints is right, it's a substantive disagreement after all, not a verbal one. So: diagnose this for me. Is it verbal, is it two different questions under one heading, is there a hidden empirical question doing the work, or is it a genuine substantive dispute that's just hard? And whatever your diagnosis is, tell me what would count as progress — a distinction someone should draw, an experiment, a reformulation of the question — or whether I should just accept that this particular argument runs forever and find something better to do with my Tuesdays.
reasoning: |-
  Okay, the user is a philosophy grad student who's been caught in the crossfire between economists and philosophers regarding hyperbolic discounting and akrasia. Let me unpack this carefully.

  First, I need to recognize the core tension they're describing. Economists see hyperbolic discounting as a neat solution to inconsistent preferences over time, while philosophers insist it misses the essence of akrasia - the puzzling coexistence of sincere evaluative judgment and contrary action. The user has already developed an interesting hypothesis about differing concepts of irrationality, which shows they've deeply engaged with the problem.

  Hmm... the user's frustration is palpable. They've witnessed circular arguments for years and want to know if this is resolvable or just a permanent disciplinary divide. Their proposed distinction between formal vs agential irrationality is sharp, but they're wisely questioning whether philosophers' additional objections make it more than just verbal disagreement.

  Let me mentally walk through the layers. At surface level, yes - economists model choice patterns while philosophers examine the structure of agency. But deeper down, the philosophers' critique about compulsion versus weakness of will points to a real gap: hyperbolic discounting describes what happens but doesn't capture the phenomenology of self-betrayal that defines akrasia. The neuroimaging example is telling - showing limbic activation explains mechanism but not why this feels like a failure of will rather than, say, a sudden value change.

  The user's suspicion about "irrational" meaning different things seems correct. For economists it's about preference consistency (instrumental rationality), for philosophers it's about responsiveness to reasons (substantive rationality). But we can't stop there because... ah! The philosophers' claim about "sincere avowal" exposes something important. If at t1 I prefer health but at t2 I sincerely prefer the cigarette, where's the judgment that health is better all-things-considered persisting through the choice? The discounting model has no slot for that simultaneous endorsement/override.

  What would progress look like? First, we'd need to clarify whether the dispute is about explanation (what causes choices) versus conceptual analysis (what constitutes weakness of will). But also... perhaps there's an empirical component: do people actually maintain conscious evaluative judgments while acting against them? The philosopher's description suggests yes, but maybe careful experimentation could test that.

  The user might appreciate knowing that some integrative work exists - like George Ainslie's picoeconomics framing willpower as intertemporal bargaining, which borrows from both sides. Or Jon Elster's distinction between discounting models and the "counterpreferential" element of akrasia. 

  Ultimately, I think the user's instinct to map the dispute is correct. We should acknowledge it's both verbal (different questions) and substantive (philosophers identify real limitations in the economic model). The path forward involves: 1) terminological disentanglement, 2) designing experiments to test the phenomenological claims, and 3) developing models that incorporate second-order commitments. Though honestly... for someone stuck in Tuesday seminars, maybe the most practical advice is to reframe the debate rather than expecting resolution.
answer: |-
  Your analysis is remarkably sharp—you've diagnosed the core tension accurately. Let's break this down systematically:

  ### 1. **The Verbal Dispute vs. Substantive Disagreement**
     - **Your "Working Theory" is Largely Correct:**  
       Yes, economists and philosophers use "irrationality" differently:
       - **Economists:** Focus on *dynamic inconsistency* (violations of stationarity and time invariance in preferences). If preferences reverse as options approach, it’s irrational *by definition* within their model.
       - **Philosophers:** Focus on *normative self-governance failure*. Akrasia occurs when you act against your *own endorsed judgment* of what’s best, even if your preferences are "consistent" in the economic sense.
       This *is* two distinct problems under one name ("irrationality").

     - **But Philosophers' Objections Reveal a Substantive Gap:**  
       Hyperbolic discounting alone **cannot explain**:  
       - **Sincere Avowal:** Why the agent *still affirms* the long-term judgment ("I know smoking is worse") *while* choosing the short-term reward. Preference reversals don’t require this judgment to persist—they only require the *ranking* to flip.  
       - **Phenomenology of Self-Betrayal:** Akrasia feels like a failure of *agency* ("I betrayed myself"), not just a preference shift.  
       - **Distinction from Compulsion:** If the limbic system "overrides" deliberation, is this *weakness* (you *could* have resisted) or *compulsion* (you couldn’t)? Discount curves don’t capture capacity for control.

  ### 2. **Where the Economists' Model Falls Short (Philosophically)**
     - **It Reduces Judgment to Preference:**  
       Philosophers see "better judgment" as a *reflective, reason-based assessment*, not merely a stronger preference. Hyperbolic discounting explains why short-term preferences dominate, but not why the agent *simultaneously* maintains a contrary normative judgment.
     - **It Lacks a Theory of the "Self":**  
       The "temporal selves" model treats the agent as fragmented. But akrasia puzzles us precisely because it feels like *one self* acting against *its own* standards. Philosophers care about *diachronic agency*—how we unify ourselves over time.
     - **Resolutions Aren’t Just Preferences:**  
       When economists reduce resolutions to "meta-preferences," they miss that resolutions are *commitments to a principle* (e.g., "I will resist cravings"). Breaking them feels like a *moral* failure, not just a preference update.

  ### 3. **What Would Count as Progress?**
     - **Clarify the Question(s):** Explicitly separate:
       - *Q₁ (Economic):* "Why do agents systematically reverse preferences as rewards near?"  
       *→ Hyperbolic discounting answers this.*  
       - *Q₂ (Philosophical):* "How can an agent act against their own *endorsed, all-things-considered judgment* while it remains active?"  
       *→ Still unresolved.*
     
     - **Key Distinctions to Draw:**
       - **Preferences vs. Judgments:** Preferences are rankings; judgments are reason-based verdicts.  
       - **Strength of Desire vs. Authority of Reason:** A craving can be stronger without being judged *authoritative*.  
       - **Consistency vs. Integrity:** Consistency is about coherence; integrity is about loyalty to one’s values.

     - **Empirical Work That Could Help:**  
       - Test if people *consciously affirm* long-term judgments *during* akratic actions (e.g., real-time self-reports during delay-of-gratification tasks).  
       - Measure whether neural correlates of "endorsed judgment" (e.g., dlPFC activity) remain active *while* limbic-driven choices occur.  
       - Investigate if agents feel *responsible* after discounting-driven choices vs. compelled actions (e.g., post-choice interviews).

     - **Conceptual/Modeling Progress:**  
       - Integrate "judgments" as distinct cognitive states in decision models (e.g., **two-system frameworks** where System 2 endorses long-term goals but System 1 "hijacks" choice).  
       - Explore **commitment devices** (e.g., Ulysses contracts) as tools for *extending agency* over time—philosophers like Jon Elster and economists like Thomas Schelling meet here.  
       - Adopt **Michael Bratman's planning theory**: Weakness of will as a failure to execute *plans* that reflect our best judgment. This bridges reflection and action.

  ### 4. **Should You Abandon Your Tuesdays?**
     **No—but reframe the goal.** This isn’t a dead end; it’s a rich interdisciplinary puzzle. Progress happens when:  
     - Philosophers engage with empirical work (e.g., cognitive neuroscience of self-control).  
     - Economists expand models to include *normative self-conceptions* (e.g., Rabin’s "moral preferences").  
     - Both sides acknowledge their question isn’t the only one.  

  **Your best move:** Be the bilingual interlocutor. Show how hyperbolic discounting *constrains* but doesn’t *dissolve* the philosophical puzzle. Cite integrative work like:
  - George Ainslie’s *Breakdown of Will* (picoeconomics + philosophy)  
  - Jon Elster’s *Ulysses and the Sirens* (rationality and precommitment)  
  - Holton’s *Willing, Wanting, Waiting* (resolutions as non-preference-based)

  The argument persists because both sides are partially right. Economists explain the *mechanism* of preference reversal; philosophers identify a deeper *structure of agency*. Your Tuesdays are wasted only if you expect surrender—not if you seek synthesis.
