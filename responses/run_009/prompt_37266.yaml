  (2) Gap: The game is a discrete, conscious decision-making process, whereas in Copycat, the slippage is the result of parallel, probabilistic processes (codelets) that build up gradually. The game cannot reproduce the emergent, subcognitive nature of the slippage. Also, in the game, the participants are explicitly told to find an analogy, whereas in Copycat, the analogy-making is the core mechanism.

  During the debrief, we can contrast the human leap (which is fast and based on insight) with the computational model of gradual pressure buildup and conflict resolution.

