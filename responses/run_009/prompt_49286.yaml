prompt: |-
  I've been on a Galileo kick since I finally watched the Losey film of Brecht's play (the one with Topol). I'd always assumed the whole fight with the Church was just science vs religion in the obvious sense, but then I read a bit about what the actual Galileo said about scripture, and it's way more interesting than that. As I understand it, he thought God wrote two books, the Bible and nature, so they can't really contradict each other if you read them right -- since God can't lie in either one, apparent conflicts just mean you're reading scripture too literally. And he loved the line a cardinal supposedly told him, that the Bible is about how to get to heaven, not how the heavens go. So he wasn't picking a fight with faith as such, he was arguing the Church should stay out of questions you can settle with a telescope.

  Here's what I'd like: read Brecht's play through that actual position of the historical Galileo. Does Brecht's Galileo hold anything like it? From what I remember the play treats religion mostly as an excuse the ruling class uses to keep people obedient, which seems like a totally different fight than the one the real guy was in. And then the recantation -- if you think, like the real Galileo apparently did, that the Church legitimately gets to decide how scripture is read, is caving even a betrayal? Brecht obviously wants the recanting scene to sting, but does it still sting if you take the historical Galileo's own views seriously? My hunch is Brecht turned a fight *inside* religion about how to read it into a fight *against* religion, and I half think that's unfair and half think maybe the real Galileo's position was naive and the play is the honest version. I'm presenting this to my movie night group so I want to be sure it holds up.

  Give me exactly five numbered points, each one a scene or moment from the play plus what it shows about this question, a sentence or two each. No intro or wrap up, just the list. And if one of my premises about the real Galileo is wrong, work that into whichever point it belongs to rather than nitpicking it seperately.
