answer: |-
  Here’s a pantoum enacting an information cascade, respecting your constraints on tone, terminology, and structure:

  **(Pantoum: Two Doors)**

  Two doors stand open on the street.
  The first one steps into the left.
  I thought one was brighter, clear and sweet.
  The choice seems effortless, deft.

  The first one steps into the left.
  A second pauses, looks, then goes.
  The choice seems effortless, deft.
  (They trust their own light, I suppose).

  A second pauses, looks, then goes.
  The third arrives, sees two have passed.
  (They trust their own light, I suppose).
  The weight of precedent holds fast.

  The third arrives, sees two have passed.
  A fourth, a fifth, no pause at all.
  The weight of precedent holds fast.
  The right-hand door becomes a wall.

  A fourth, a fifth, no pause at all.
  Someone said one was brighter, true?
  The right-hand door becomes a wall.
  What else is there for us to do?

  Someone said one was brighter, true?
  No one remembers why, or when.
  What else is there for us to do?
  Two doors stand open still. We choose again.

  ---

  **How it meets your specifications:**

  1.  **Pantoum Structure:** Strict adherence: ABAB > BCBC > CDCD > DEDE > EFEF > FAFA. Lines recur, shifting from private conviction (Stanza 1: "I thought one was brighter...") to reported hearsay (Stanza 5: "Someone said one was brighter...") to forgotten origin (Stanza 6: "No one remembers why, or when.").
  2.  **The Cascade Setup:**
      *   **Stanza 1:** First chooser ("The first one") uses private signal ("I thought one was brighter") and chooses left.
      *   **Stanza 2:** Second chooser observes first choice ("The first one steps into the left"), hesitates ("A second pauses, looks"), weighs private signal (implied "They trust their own light"), chooses left ("then goes").
      *   **Stanza 3:** Third chooser observes two left choices ("sees two have passed"), weighs private signal ("They trust their own light, I suppose" - now reported thought) but precedent dominates ("The weight of precedent holds fast"). Implied choice left.
      *   **Stanza 4:** Fourth and fifth choosers ("A fourth, a fifth") observe overwhelming history ("no pause at all"). The unchosen option ("The right-hand door") becomes irrelevant ("becomes a wall"). Private signals are ignored.
  3.  **The Vanishing Signal:** The original private signal phrase appears for the last time in Stanza 3, line 4: **"They trust their own light, I suppose."** This line *does not repeat again*. While the *idea* of the signal echoes ("Someone said one was brighter"), the specific line representing the *act of relying on a private signal* vanishes after Stanza 3, mirroring the point where the cascade locks in and private signals cease to be used. Its consequence ("The first one steps into the left") drives everything after.
  4.  **The Epistemic Situation (Final Stanza):**
      *   The forgotten origin: "No one remembers why, or when."
      *   The unanimous action: "What else is there for us to do?... We choose again." (Implies choosing left, unanimously).
      *   The circularity & illusion: The first line ("Two doors stand open on the street.") returns modified as the last line ("Two doors stand open still. We choose again."). The scene is identical, the choice is repeated, yet the basis is now purely social proof ("What else... to do?"), not the original private information. The "single reason" is gestured at by the persistent action ("We choose again") based solely on the accumulated choices ("precedent"), contrasted with the forgotten signal ("No one remembers why").
  5.  **Tone:** Neutral and observational. No mockery. Choices are described as "effortless, deft," "trust their own light," actions follow "weight" or precedent. "What else is there... to do?" captures rational herding given observed history. Agents reason ("pauses, looks," "I suppose," the implied weighing).
  6.  **Terminology Avoided:** No "cascade," "herd," "signal," "information," "rational," "evidence," "model," "agent," etc. The scene and form do the work.
  7.  **Length:** Six stanzas - allows the cascade to build (Stanzas 1-3), lock in (Stanza 4), and demonstrate the later epistemic state (Stanzas 5-6), while keeping the repeating lines manageable.

  This poem uses the pantoum's inherent recursion to embody the cascade mechanism, showing how actions become evidence, origins are obscured, and unanimity emerges not from aggregated signals but from the self-reinforcing structure of observed choices.
