     - No → Leaf: Skeptic. The agent does not have the false belief and never had the true belief; this is either avoidance (if not forming any belief) or pretense (if acting without belief), not self-deception.

  Note: The deflationary views (with and without prior true belief) are both attributed to Mele, who argues for a unified deflationary account that does not require simultaneous conflicting beliefs and denies intention.

  The skeptic leaf appears in two places: 
