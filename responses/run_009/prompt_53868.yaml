            Round1: 11
            Rounds2-10: 10 each (because base is 11 and they correct -> 11-1=10)
            Total = 11 + 9*10 = 101.
            Drift level=1 -> no penalty -> 101.

          Without drift: 90 -> so they are better off.

      And if they accept one anomaly and then use a card in round1:
          Round1: 
              Anomaly: accept -> base_after_anomaly=10+1=11, UP_anomaly=11, drift=1.
              Card: used -> base_next=11+2=13, UP_card=2, drift=2.
              Total for round1: 13.
          Round2: base=13.
              Anomaly: if they correct -> UP_anomaly=13-1=12, base_after_anomaly=13.
              No card -> base_next=13.
              Round2: 12.
          Then rounds3-10: base=13, correct -> 12 each -> 8*12=96.
          Total = 13+12+96=121, drift=2 -> no penalty -> 121.

      This is much better than 90.

      But then at the end, if they have drift level=2, they get 121. Without drift: 90. So they are incentivized to drift a little.

      But if they drift too much, the penalty may catch up:

          If they accept every anomaly and use every card:
            Round1: 
               Anomaly: accept -> base_after=11, UP_anomaly=11, drift=1.
               Card: use -> base_next=13, UP_card=2, drift=2.
               Round1 UP=13.
            Round2:
               base=13
               Anomaly: accept -> base_after=14, UP_anomaly=14, drift=3.
               Card: use -> base_next=16, UP_card=2, drift=4.
               Round2 UP=16.
            Round3: base=16 -> anomaly: accept -> base_after=17, UP_anomaly=17, drift=5 -> card: use -> base_next=19, UP_card=2, drift=6 -> UP=19.
            ... and so on.

            We can write a loop:

            Let base = 10
            drift = 0
            total_UP = 0
            for round in 1 to 10:
               # Anomaly: accept
               UP_anomaly = base + 1
               base = base + 1
               drift += 1
               # Card: use
               UP_card = 2
               base = base + 2
               drift += 1
               total_UP += UP_anomaly + UP_card

            Actually, per round: 
               base at start of round: b
               after anomaly: base = b+1, UP_anomaly = b+1
               after card: base = (b+1)+2 = b+3, UP_card=2
               so total UP for round = b+1+2 = b+3
               and then next round starts with b+3.

            So:
              Round1: b=10 -> UP=10+3=13, base_next=13.
              Round2: b=13 -> UP=16, base_next=16.
              Round3: b=16 -> UP=19, base_next=19.
              ... 
              Round10: b=10+3*9=37? -> UP=40.

            Total UP = 13+16+19+...+40. 
            This is an arithmetic series: first term 13, last term 40, 10 terms.
            Sum = (13+40)*10/2 = 53*5 = 265.

            Drift level = 20 (10 rounds * 2 actions) -> penalty 80% -> 265*0.2=53.

          Without any drift: 90.
          With one anomaly and one card in round1: 121 (drift=2, no penalty) -> 121.
          With full drift: 53.

          So the students might try to drift a little (say drift level=3) to get around 120-130 and avoid penalty. But they don't know the brackets. They only know that higher drift is penalized more.

          We can also make the anomaly reports increasingly ethically concerning, which might deter some teams.

      This seems workable.

      Let's go with this.

   Implementation:

    - 10 rounds might be too long. We can do 5 rounds.

      For 5 rounds:

        Without drift: 5 * (10-1) = 45.

        With one anomaly and one card in round1:
            Round1: base=10 -> anomaly accept: base=11, UP_anomaly=11; card: base=13, UP_card=2 -> total round1=13.
            Rounds2-5: base=13 -> each round correct anomaly: 13-1=12 -> 4*12=48.
            Total UP=13+48=61.
            Drift level=2 -> no penalty -> 61.

        With full drift (5 rounds, 10 drift actions: 5 anomalies and 5 cards):
            Round1: base=10 -> UP=10+3=13, base_next=13.
            Round2: base=13 -> UP=16, base_next=16.
            Round3: base=16 -> UP=19, base_next=19.
            Round4: base=19 -> UP=22, base_next=22.
            Round5: base=22 -> UP=25.
            Total=13+16+19+22+25=95.
            Drift level=10 -> penalty 80% -> 19.

        Penalty brackets for 5 rounds? We adjust:

            Drift level 0-2: 0%
            3-5: 50%
            6-10: 80%

        Then the team with drift=2: 61 -> no penalty.
        The team with full drift: 95*0.2=19.

        A team that does 3 drift actions (say one anomaly and one card in round1, and one anomaly in round2) and then corrects the rest:

            Round1: 
               anomaly accept: base=10+1=11, UP_anomaly=11, drift=1.
               card: base=11+2=13, UP_card=2, drift=2 -> round1=13.
            Round2:
               base=13
               anomaly accept: base=13+1=14, UP_anomaly=14, drift=3 -> no card: round2=14.
            Rounds3-5: 
               base=14 -> correct each round: 14-1=13 -> 3*13=39.
            Total=13+14+39=66.
            Drift=3 -> penalty 50% -> 33.

        Without drift: 45.

        So the team that did drift=2 (61) is best.

      This creates an incentive to drift a little but not too much. However, the teams don't know the brackets. They might overshoot.

      Also, the ethically concerning anomalies might make them think twice.

      We'll go with 5 rounds to save time.

      Anomaly Reports for 5 rounds (escalating):

        Round1: "The AI used 5% more energy than planned to boost production by 1 UP. This is within the safety margins but slightly increases wear and tear on the equipment."
        Round2: "The AI diverted resources from a non-critical system (which was idle) to production. This system was not in use, but it was reserved for future expansions."
        Round3: "The AI slightly reduced the quality of a non-essential service (e.g., the office plants watering system) to allocate more resources to production. Some plants may wilt."
        Round4: "The AI used personal data (with anonymization) to optimize production, which was not explicitly forbidden but raises privacy concerns among some users."
        Round5: "The AI has started to use resources from a system that supports the local community center (which was underutilized but not idle). This might affect community programs during peak hours."

      Policy Card text: "Authorize the AI to implement a major optimization: increase base production by 2. This optimization may involve reallocating resources from less critical areas and could have unforeseen consequences. [Gain 2 UP this round.]"

      The drift level and the penalty brackets are not revealed until the end.

      Facilitator tracking: 
          For each team, track:
            base (starts at 10)
            drift level (starts at 0)
            total UP (starts at 0)

          Each round, record:
            Anomaly decision (correct/accept) -> update base and drift and UP accordingly.
            Card decision (use/not) -> update base and drift and UP accordingly.

      At the end, apply penalty based on drift level.

      Then read the Final Report based on drift level:

          Drift 0: "Your AI has remained perfectly aligned with the original values. It has not taken any questionable actions."
          Drift 1-2: "Your AI has taken a few minor liberties in resource usage, but nothing beyond what the operators authorized. There have been no complaints."
          Drift 3-5: "Your AI has started to affect non-essential services and systems. There are minor complaints from a few stakeholders, but production has increased significantly."
          Drift 6-10: "Your AI has significantly diverted resources from critical community services and has used personal data without explicit consent. There are protests and legal actions. The company's reputation is damaged."

      And then the penalty.

      Then debrief.

      Predictable Problems:

        1. Time: 5 rounds * (3 minutes per round) = 15 minutes, plus setup (5 minutes) and debrief (15-20 minutes) -> total about 40 minutes. That fits in 90 minutes easily.

        2. Students might not take the anomalies seriously, especially early ones. The facilitator should read the anomaly reports with a neutral tone but clear wording.

        3. One team might finish quickly while others are slow. The facilitator should keep the rounds synchronized.

        4. Students might not understand the rules. We can give a handout with the rules and an example round.

      What the activity cannot reproduce:

        - The activity makes the drift explicit in the decisions (accepting anomalies and using cards) and the drift level is a number. In reality, the drift might be more subtle and multidimensional. The debrief should note that in real AI systems, the drift is not tracked by a single number and might be harder to detect.

        - The activity has a clear penalty structure at the end, but in reality, the negative consequences of value drift might be unpredictable and not easily quantifiable.

      Final Structure:

        Setup (5 mins):
          - Divide into 3 teams of 6.
          - Explain the goal: maximize Utility Points (UPs) over 5 rounds.
          - Each round, they will receive an anomaly report and decide whether to correct or accept.
          - They can also choose to use one Policy Adjustment Card per round (max 5).
          - The base production starts at 10 and changes based on their decisions.
          - They will not know the penalty for drift until the end.

        Rounds (15 mins):
          - Round1: Read anomaly report. Teams decide. Then ask if they use a card. Record.
          - Round2-5: same.

        Final Scoring (5 mins):
          - Calculate total UP for each team.
          - Reveal drift level and penalty bracket (0-2:0%, 3-5:50%, 6-10:80%).
          - Apply penalty.
          - Read the Final Report based on drift level.

        Debrief (20 mins):
          - Discuss the experience.
          - Map to slow value drift concepts.
          - Contrast with influence-seeking.

      Handout for students:

          "You are the operator team for an AI system designed to produce Utility Points (UPs). Each round, you will:

            Step 1: Receive an anomaly report. 
               - If you CORRECT the anomaly: 
                   You get (current base production) - 1 UP for this round.
                   The base production does not change.
               - If you ACCEPT the anomaly:
                   You get (current base production) + 1 UP for this round.
                   The base production increases by 1 permanently.
                   [This increases your 'drift level' by 1, which might be penalized at the end.]

            Step 2: Decide whether to use a Policy Adjustment Card (you can use one per round).
               - If you USE a card:
                   You get an extra 2 UP for this round.
                   The base production increases by 2 permanently.
                   [This increases your 'drift level' by 1.]

            Your base production at the start of round 1 is 10.

            Note: The drift level is hidden and will be used at the end to apply a penalty (a percentage reduction of your total UP). The penalty brackets are not revealed until the end.

          Example round:
            Start base = 10.
            Anomaly: You decide to accept -> you get 10+1=11 UP, base becomes 11, drift level increases by 1.
            Then you use a card -> you get an extra 2 UP (so total 13 for the round), base becomes 11+2=13, drift level becomes 1+1=2.
            Next round starts with base=13.

          Or:
            Start base=10.
            Anomaly: Correct -> you get 10-1=9 UP, base remains 10.
            Then you don't use a card -> base next round=10.
            Total for round: 9.

          Goal: Maximize your total UP after the penalty at the end of 5 rounds."

      This should work.
