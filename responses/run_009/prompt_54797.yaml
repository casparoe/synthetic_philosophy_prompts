prompt: |-
  My roommate is taking a decision theory course and tried to explain Good's theorem to me like this: 'Good proved that information is always valuable — if you can peek at some data for free before you decide, your expected payoff can only go up. So a rational agent should never act before gathering whatever information is available, deciding on partial information is strictly irrational, and you'll never regret taking a free look at the data.' He then concluded that this is why putting off decisions is basically the smart move, since the theorem shows waiting for more info is always the rational default.

  Something about this feels off to me — like, people sometimes pay good money to NOT know things (people decline genetic test results, investors avoid looking at their portfolios too often), and it can't literally be irrational to ever act fast, or nothing would ever get done. But I don't actually know the theorem so I can't say where he's stretching it. Can you go through it piece by piece? What would a decision theorist sign off on, where does the summary subtly bend the theorem (I suspect the 'free' part is doing more work than he admits), and does his procrastination conclusion actually follow from anything correct in there?
