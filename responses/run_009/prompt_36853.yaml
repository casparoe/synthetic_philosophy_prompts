prompt: |-
  I'm a self-taught carpenter who builds custom kitchens and built-ins, and for the past six years I've kept notes on every job I've bid. I've come to think there are two of me doing the estimating. Standing in a client's kitchen, I get a confident number straight from the details — this hinge is the one from the Hendersons' job, that mantel I've built twice before — call that the close-up. Then there's the ledger: across forty-odd jobs, my first guess ran short by about a third, every time, regardless of what the job was like — call that the wide shot. When I'm excited about a job I tend to write the close-up number into the contract, and those are the jobs that eat my winter in unpaid rework. I'd like a procedure I can run alone, in about twenty minutes per bid, that tells me which number to write, under what conditions the close-up is allowed to win, what to do when the ledger contains no comparable jobs, and where the procedure should stop because the question has become how much risk I'll stomach for a job I want — which no checklist can settle for me. It must include the step that makes me write the bigger number even when I want the job badly; please don't leave that step out because it's unwelcome, and don't soften it.

  Give me exactly five numbered steps, each one or two sentences. A short example may be folded into a step, but nothing may appear outside the list, and there should be no introduction or conclusion. Within the steps, make it clear how confident you are in each part, and mark the single step you are least sure of, saying why right there in that step.
reasoning: |-
  Okay, the user is a self-taught carpenter who builds custom kitchens and built-ins. They've been keeping detailed notes on every job they've bid for six years. They've noticed two patterns in their estimating: the "close-up" number, which is their confident estimate based on direct experience with similar details, and the "wide shot," which shows that historically, their initial estimates fall short by about a third across all jobs. 

  They mention that when they're excited about a job, they tend to use the close-up number in the contract, leading to unpaid rework during winter. Their main request is for a five-step procedure that helps them decide which number to use, covering scenarios like when there are no comparable jobs in their ledger and when emotional factors like job desirability come into play. 

  The user specifically asks for the procedure to include a step that forces them to write the higher number even when they really want the job, and they emphasize not softening this step. They want exactly five numbered steps, each one or two sentences, with no introduction or conclusion. Additionally, they want me to indicate my confidence level for each step and mark the step I'm least sure of, explaining why within that step.

  I need to address the core conflict between the intuitive "close-up" and the data-driven "wide shot." The procedure should incorporate both perspectives but prioritize data when necessary. The key challenge is balancing historical accuracy with on-the-spot judgment, especially for unique jobs. 

  The user's deeper needs likely include reducing financial loss from underestimating, minimizing stress from rework, and establishing a reliable system that accounts for emotional biases. They might also want validation that their experiential knowledge has value but needs tempering with data.

  For the steps: 
  1. Start with the close-up estimate but immediately cross-reference it with the ledger. This leverages their experience while grounding it in data. I'm very confident here because it directly uses both their stated approaches.
  2. Apply the 1/3 markup as a standard adjustment based on historical shortfall. High confidence since it's derived from their own consistent data pattern.
  3. Handle cases with no comparable jobs by using the average shortfall percentage. Moderate confidence—it's logical but depends on ledger quality. Mark this as least sure because unique jobs may not fit averages well.
  4. Mandatorily use the wide shot number when emotional attachment is present. High confidence—it directly addresses their pain point of underbidding on exciting projects.
  5. Explicitly decide on risk acceptance only after steps 1-4, separating emotion from calculation. High confidence as it creates a deliberate checkpoint.

  The structure forces confrontation with data before allowing emotional influence. The "unwelcome" step (#4) is deliberately blunt as requested. Least sure about Step 3's effectiveness for truly novel projects, hence the marking.
answer: |-
  1.  Calculate both numbers: First, derive your "close-up" estimate based on the specific job details and your direct experience. Immediately after, calculate the "wide shot" by taking your close-up estimate and increasing it by 33% (since your historical shortfall is one-third). I'm very confident this dual calculation is essential and accurately reflects your data.
  2.  Default to the wide shot: The number you write into the contract must be the higher "wide shot" figure unless a specific, documented exception applies. I'm highly confident this strict rule is necessary based on your consistent historical shortfall pattern, overriding optimistic close-up bias.
  3.  Allow close-up *only* if directly comparable: The close-up estimate can win *only* if your ledger contains at least two past jobs with nearly identical scope, materials, and complexity, and your final cost on those matched your initial close-up bid within 5%. (Example: Building the *exact* same cabinet set for the same client in a different room doesn't count as comparable unless the installation context was identical). **I'm least sure about this step's criteria** because defining "nearly identical" for complex custom work is inherently subjective and rare, potentially making this exception almost unusable.
  4.  Force the wide shot when you want it: If you feel strong excitement or desire for the job, this *mandates* using the wide shot number in the contract; your emotional investment *is* the condition requiring the higher, data-driven figure. I'm very confident this explicit, unwelcome step is crucial to prevent the exact underbidding and rework cycle you described.
  5.  Explicitly accept the risk *after* calculation: Only after rigorously applying steps 1-4 and arriving at your contract number, consciously decide if you are willing to potentially lose money (absorb risk) on *this specific job* due to its unique desirability – this is a separate, final judgment call, not part of the numerical estimate. I'm highly confident this separation prevents emotion from distorting the initial calculation.
