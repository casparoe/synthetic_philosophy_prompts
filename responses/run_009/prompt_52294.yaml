prompt: |-
  I'm a PhD student in decision theory, and somehow I've been voluntold to run a 45-minute intro session on self-locating belief for our department's cognitive science reading group. The audience is smart but has no philosophy of probability background at all: they know conditional probability, they've seen Bayes, but they've never thought about what it means for a probability to be indexed to who or when you are. The plan is to get there through Sleeping Beauty, but I don't want to just walk them through the standard halfer/thirder debate and have it land as a fun puzzle with no lesson. The real point I want them to walk away with is that there's a genuine question about what the sample space even is when your evidence can't distinguish centered possibilities, and that this isn't just sloppiness that a careful setup would wash out.

  Don't write me the explanation itself -- write me the teaching plan. I want the dependency structure: what has to be established before the Beauty setup even gets stated (my instinct is they need a warm-up where self-location is unavoidable, like being told one of two people is about to have a different experience, before the coin-and-amnesia story makes the issue vivid, but you tell me). I want a single carrying example, and I'm torn about whether it should be the standard "wake up Monday, maybe Tuesday with amnesia" version or something with creation instead of awakening -- I've seen variants where instead of waking Beauty twice, you flip a coin and create one person in one room or two people in two rooms, and I have a feeling that variant forces the question harder, but I'm not sure it doesn't smuggle in its own confusions about what "I" refers to, so I'd want your take on what the carrying example must include and what it must avoid. Then the misconceptions: I can already predict someone saying the whole thing is a verbal dispute you dissolve by choosing a convention, someone else saying Beauty gets no new information on waking so it has to stay 1/2 and refusing to budge, and at least one person trying to settle it with a betting argument that quietly assumes you get paid once per correct answer rather than once per experiment -- I want to know in what order these will actually show up and where in the sequence each should be pre-empted rather than argued with after the fact. Also tell me what I should openly decline to cover in 45 minutes (I'm assuming the Doomsday-style applications and any of the decision-theoretic stuff about payoffs are out, but flag anything else that will eat the session). Finish with the single question I can pose at the end that would let me tell whether they understood self-locating uncertainty as opposed to just having picked a side in the halfer/thirder fight, since frankly I'll consider the session a failure if they leave thinking it was about a coin.
reasoning: |-
  Okay, let me tackle this teaching plan for the PhD student. They need a 45-minute session on self-locating beliefs for a cognitive science group with no philosophy background. The core challenge is making them see that sample space construction isn't trivial when evidence can't distinguish centered possibilities.

  First, I need to establish why self-location matters at all. Starting with Sleeping Beauty might be too abrupt. A warm-up with unavoidable self-location seems essential - something like the duplicate experiment where they must consider "which copy am I?" without probabilistic baggage. This creates cognitive dissonance with standard probability setups.

  For the carrying example, I'm weighing standard Sleeping Beauty against duplication variants. The duplication scenario (coin flip determines one or two rooms) avoids amnesia mechanics but risks confusion about personal identity. Still, it forces the "how many possible 'I's exist?" question more directly. I think duplication is better here - it strips away distractions and makes indexical uncertainty visceral.

  Key misconceptions to pre-empt: 
  - The "no new information" objection must be addressed by distinguishing indexical/non-indexical evidence. 
  - Betting arguments need careful framing upfront about payment structure. 
  - The "verbal dispute" dismissal should be countered by showing how different sample spaces lead to genuine disagreement.

  What to exclude: Doomsday arguments, decision theory payoffs, and definitely no Lewis/Elga deep dive. Keep it focused on the sample space construction problem.

  The exit question is crucial. Instead of asking "what probability should Beauty assign?", ask "what are the elementary outcomes in her sample space?" If they debate whether "I'm copy 1" or "it's Monday" should be atomic events, that's the win.

  Timing breakdown: 
  5 min warm-up (duplicate experiment) 
  15 min duplication Sleeping Beauty setup and probability assignment 
  10 min halfer/thirder conflict emergence 
  10 min sample space dissection 
  5 min exit question and wrap-up

  The warm-up must induce that "wait, standard probability doesn't tell me how to set this up" feeling. The duplication variant should make the sample space ambiguity unavoidable. When discussing probabilities, explicitly contrast "possible worlds" vs "centered worlds" frameworks. 

  For betting arguments, I'd proactively say: "Before anyone suggests wagers - would your calculation change if Beauty gets paid per correct answer or per experiment?" That blocks the common mistake. The verbal dispute objection gets handled when comparing sample spaces - show how thirder and halfer models both satisfy probability axioms yet differ.

  The exit question needs to test conceptual transfer. Maybe: "Imagine waking up with amnesia in a room with two identical computers, one broken. How does your sample space differ from knowing which computer you're facing?" If they reference centered possibilities without prompting, mission accomplished.
answer: |-
  Here’s a battle-tested teaching plan targeting your core goal: **forcing the realization that self-locating uncertainty requires non-trivial choices in constructing the sample space, and that "evidence" includes indexical facts.**

  **Total Time:** 45 mins  
  **Core Carrying Example:** **Duplication Variant** (avoids amnesia/time confusion, highlights "who am I?"). Avoid standard Sleeping Beauty for now—it often obscures the crux with temporal details.

  ---

  ### Teaching Plan: Dependency Structure & Flow

  #### (0-5 min) **Hook: The Inescapable "I"**  
  - **Warm-up Scenario ("Duplicate Experiment"):**  
    *"You volunteer for an experiment. Scientist flips a fair coin. Heads: She creates one perfect copy of you (Copy A). Tails: She creates two perfect copies (Copy A and Copy B). All copies are placed in identical rooms. You wake up in a featureless room. What’s P(Heads)?"*  
  - **Key Moves:**  
    - Let them debate. Expect immediate "1/2" (coin fairness) vs. "1/3" (more copies on tails).  
    - **Interrupt debate.** Ask: *"What does your evidence eliminate? Can you distinguish being Copy A on Heads vs. Copy A on Tails?"* → *No*.  
    - **Punchline:** *"Before calculating, we must define what 'outcomes' even are. Are we counting coin states? Copy identities? Both?"* → Establishes **indexical uncertainty** as unavoidable.

  #### (6-15 min) **Introduce Carrying Example: Duplication Sleeping Beauty**  
  - **Setup:**  
    *"Beauty enters an experiment. Fair coin flip Sunday night.*  
    - *Heads: Scientist creates ONE Beauty in a red room.*  
    - *Tails: Scientist creates TWO Beauties (one in red room, one in blue room).*  
    *All Beauties are drugged to forget creation. You wake up in a red room. What’s P(Heads)?"*  
  - **Why this variant?**  
    - Avoids amnesia/temporal confusion ("Monday/Tuesday").  
    - Forces "Who am I?" (Am I the only Beauty? Or one of two?).  
    - Evidence ("I'm in a red room") is *centered*: it rules out being the blue-room Beauty (if she exists) but nothing else.  

  #### (16-25 min) **Elicit Conflict & Expose Sample Space Choices**  
  - **Poll the group:** Halfer (P=1/2) vs. Thirder (P=1/3).  
  - **Dissect their reasoning:**  
    - **Halfer:** *"Coin was fair, no new info about coin!"* → Counts **worlds** (Heads-world, Tails-world).  
    - **Thirder:** *"There are three possible 'I's: Heads-Me, Tails-Red-Me, Tails-Blue-Me. One has heads."* → Counts **centered worlds** (agent-moment experiences).  
  - **Crucial Intervention:**  
    - *"Both satisfy probability axioms. Why disagree?"*  
    - **Whiteboard two sample spaces:**  
      - *World-First:* {Heads, Tails} (each P=1/2).  
      - *Agent-First:* {(Heads, Red-Me), (Tails, Red-Me), (Tails, Blue-Me)} (each P=1/3? Or conditional?).  
    - **Hammer the point:** *"This isn't about Bayes or conditioning—it's about what the primitive outcomes ARE when your evidence centers 'you'."*  

  #### (26-35 min) **Preempt Misconceptions & Force Sample Space Awareness**  
  - **Misconception 1: "No new information"**  
    - *Preemption:* Already addressed in warm-up. Reiterate: *"Evidence 'I am in a red room' rules out being the blue Beauty. That IS information if Tails is possible."*  
  - **Misconception 2: "Betting settles it"**  
    - *Preemption:* **Proactively pose:** *"Suppose Beauty gets $1 if she correctly guesses Heads/Tails. If we pay per guess, she profits by saying 'Tails' always. If paid per experiment, she breaks even saying 'Heads'. Which payoff reflects 'credence'?"* → Reveals betting arguments **assume** a decision context (e.g., "per experiment" vs. "per awakening").  
  - **Misconception 3: "Just a verbal dispute"**  
    - *Preemption:* Contrast predictions. *"In the duplication experiment, if thousands of you do this, what fraction waking in red rooms see Heads?"* → Halfers: 1/2. Thirders: 1/3. **Empirical disagreement!**  

  #### (36-42 min) **Generalize & Connect to Core Lesson**  
  - **Summarize:** Self-locating beliefs require specifying:  
    1. **Temporal/agent boundaries** (what counts as "me now"?).  
    2. **The relationship between world-states and centers** (how agents "inhabit" possibilities).  
  - **Contrast with standard conditioning:** *"When evidence uniquely identifies a world-state (e.g., 'coin is Heads'), we condition on that. When it only identifies a set of centered worlds (e.g., 'I am in a red room'), we need a prior over centers."*  

  #### (43-45 min) **Exit Question & Wrap-Up**  
  - **Exit Question:**  
    *"In the duplication experiment, if you learn 'I am Copy A', does P(Heads) change? Why?"*  
    - **Why this tests understanding:**  
      - Correct answer: *Yes, it becomes 1/2.*  
      - Reveals if they grasp **conditioning on centered evidence**: Learning "I am Copy A" eliminates the Tails-Blue centered world, collapsing the sample space to {(Heads, Copy A), (Tails, Copy A)}.  
      - If they just parrot "1/3" or "1/2", they missed the centered-world machinery.  
  - **Closing:** *"This isn't about coins—it's about how to model uncertainty when your identity/location is part of the unknown. Philosophy hasn't settled this. Your job: Notice where your models hide centered assumptions."*  

  ---

  ### What to Explicitly Exclude  
  1. **Decision theory/payoffs** (beyond the minimal betting illustration).  
  2. **Doomsday argument, Boltzmann brains, etc.** (too distracting).  
  3. **Deep dive into Halfer/Thirder literature** (Lewis vs. Elga, etc.).  
  4. **Personal identity metaphysics** ("what makes me *me*?").  

  ### Why This Works  
  - **Warm-up** makes self-location visceral *before* adding coin probabilities.  
  - **Duplication variant** removes red herrings (time, memory) and highlights agent-counting.  
  - **Misconceptions preempted** at point of entry (e.g., betting framed *before* it derails discussion).  
  - **Exit question** tests if they see conditioning on *centers*, not just world-states.  

  You’ll know they got it if, in the exit question, they articulate why learning "*which* copy I am" changes the sample space—not just the probability.
