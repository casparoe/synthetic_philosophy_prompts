  For sequencing, population-level vs. individual distinction is indeed foundational. Without this, everything else crumbles. The next priority is gene-environment interactions—this shows why high heritability doesn't imply fixity. The environment portion of variance should follow the population/individual split to immediately challenge the "unchangeable" myth.

