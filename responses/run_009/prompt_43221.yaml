answer: |-
  Here’s a battle-tested session plan designed for your audience, sequencing concepts to dismantle misconceptions while building intuition. Prioritize clarity and "aha moments" over technical rigor.

  **Core Goal:** *Heritability is a population statistic about current variation, not a statement about individual fixity or group differences.*

  ### Session Structure (45m Total)
  **I. Groundwork: What Heritability Measures (10m)**  
  - **Hook:** "We’ve all seen the fight: ‘Heritable = unchangeable!’ vs. ‘That’s not what it means!’ Let’s end it today."  
  - **Key Definition:** "Heritability (h²) is the proportion of **current variation in a trait** in a **specific population** at a **specific time** that can be attributed to genetic differences."  
    - Emphasize: VARIATION (differences between people), not absolute value. POPULATION-CONTEXT DEPENDENT.  
  - **Population vs. Individual:** Show two identical plants (genetically identical clones) – one in sunlight, one in dark. Trait (height) varies 100% due to environment. *Now add genetic diversity:* In a mixed group, heritability tells us how much genes explain *variation*, but says nothing about whether *any individual* can change with environment.  

  **II. The Central Example: Height in "Nutrivia" (15m)**  
  *(Use a fictional society to control variables)*  
  - **Scenario:** Two populations:  
    - **"Unequal Nutrivia":** Wide income disparity → some get great nutrition, some get poor.  
    - **"Equal Nutrivia":** Universal basic nutrition → everyone gets adequate diet.  
  - **Data:**  
    - **Unequal:** Avg height 170cm. Variance = 100 cm². Genetic studies show h² = 0.7.  
      → *Interpretation:* 70% of height *differences* here are linked to genetic differences; 30% to environmental (nutrition) differences.  
    - **Equal:** Avg height 175cm (everyone taller!). Variance = 25 cm². h² = 0.9.  
      → *Interpretation:* With nutrition equalized, genes explain *more* of the remaining variation. But EVERYONE got taller!  
  - **Key Insights from Example:**  
    1. High h² ≠ trait is fixed! (Avg height increased everywhere).  
    2. h² **increases** when environmental variation **decreases**.  
    3. h² depends entirely on the population/environment context.  
    4. h² says nothing about the *average* trait level.  

  **III. Dismantling Misconceptions (Order Matters!) (12m)**  
  Anticipate and preemptively tackle these in sequence:  

  1.  **"High h² means you can't change the trait!"**  
      → *Counter:* Height example. Equal Nutrivia had HIGHER h² (0.9), but EVERYONE was taller! Genes set a *range*, environment determines where you land. High h² just means current environments aren't creating big *differences*. Interventions could still shift everyone up.  

  2.  **"So h² tells us why Group A differs from Group B!"**  
      → *Counter:* **Fatal flaw alert.** h² is *within* one population/environment. If Group A and Group B have different environments (e.g., different historical nutrition, discrimination), the within-group h² tells you **nothing** about why the *averages* differ. This is the **LOC (Lack of Transposition) Fallacy**. Use Nutrivia: Unequal Nutrivia Group A has lower avg height than Equal Nutrivia Group B. Within-group h² is high in both, but the *difference between groups* is 100% environmental (nutrition policy).  

  3.  **"But twin studies prove genes make it fixed!"**  
      → *Refine:* Twin studies estimate h² *in the environments those twins experienced*. If environments become more uniform (like Equal Nutrivia), future twin studies would show *higher* h², even as the trait itself changes. It measures *current* sources of variation.  

  **IV. What the Smug One-Liner Gets Wrong (and Right) (3m)**  
  - **Right:** "Heritability isn't immutability" is *technically* correct.  
  - **Wrong:** It often stops there, leaving the "why" unclear and sounding dismissive. The *real* insight is that **h² is a description of variation in a specific context, not a law of nature.** Context changes → h² changes → potential for change exists.  

  **V. Comprehension Check & Wrap-Up (5m)**  
  - **Check Question:** *"In Equal Nutrivia (where nutrition is uniform), height heritability is 0.9. If we introduce a powerful new growth hormone available equally to everyone, what happens to:*  
    *a) The average height?* (Answer: Increases)  
    *b) The heritability (h²) of height?* (Answer: **Likely increases** – because the environmental variation is reduced further! Genes now explain an even larger *proportion* of the remaining small differences.)"  
  - **Wrap-Up:**  
    - h² = % of **current variation** due to genes **in this group here/now**.  
    - High h² ≠ unchangeable. It often means environments are *currently* similar.  
    - h² **cannot** explain average differences between groups in different environments.  
    - Change the environment → change the trait → change h².  

  **What to Punt On (Explicitly State):**  
  - **Gene-Environment Interplay:** "We're simplifying GxE correlation/interaction. It's crucial but needs its own session."  
  - **Epigenetics:** "Beyond scope today. Just know it adds complexity to 'genetic' effects."  
  - **Causal Mechanisms:** "h² doesn't tell you *which* genes or *how* genes work, just their *current* contribution to differences."  
  - **IQ Controversies:** "We used height to avoid emotional baggage. The *statistical concepts* apply equally to any trait, but IQ debates involve extra layers we won't tackle here."  

  **Why This Works:**  
  1.  **Population/Individual & Variance First:** Builds the essential statistical foundation immediately.  
  2.  **Single, Controlled Example:** "Nutrivia" isolates key dynamics (h² change with environment, avg change) without real-world baggage.  
  3.  **Preemptive Strike:** Addresses "immutability" and "group differences" early when the audience is primed by the example.  
  4.  **Reframes the One-Liner:** Elevates it from a gotcha to a gateway for deeper understanding.  
  5.  **Comprehension Check:** Tests grasp of the most counter-intuitive point (h² can *increase* as environments improve).  

  **Deliverable:** End by handing them a better one-liner:  
  *"Heritability tells you why people differ* ***here***, *not how much anyone can change* ***everywhere***."* This encapsulates population-context and separates variation from fixity. Good luck!
