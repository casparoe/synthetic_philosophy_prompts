  The user needs a way to reconcile individual agency with collective responsibility without mystical group minds. Institutional agency seems promising here. When officials act within their roles, their actions can be attributed to the state. For example, a CEO signing a contract isn't just acting personally; they're fulfilling a role that binds the corporation. Similarly, Germany's leaders were acting in capacities defined by the state's structure.

