  2. **Max Black's counterexample**: A universe with two perfectly symmetrical spheres. They are qualitatively identical in every way (same size, same color, same material, etc.) and are placed at a distance from each other. There is no observer, no labels, and no origin point. Black argues that these are two distinct objects, thus refuting PII.

  3. **Qualitative properties**: Properties that do not involve reference to a particular individual. For example, "being two meters from the other sphere" is a relational property, but if it doesn't specify which sphere (because they are symmetric) then it might be considered qualitative. However, Black's example is set up so that there are no intrinsic differences and no external frame of reference.

  4. **Weak discernibility**: A proposed solution to save PII. It suggests that even if two objects are intrinsically identical, they might be discerned by an irreflexive relation. In the sphere example, each sphere is two meters from the other, but not from itself. So the relation "being two meters apart" holds between the two spheres but not between a sphere and itself. This relation is symmetric (if A is two meters from B, then B is two meters from A) and irreflexive (no object is two meters from itself). Thus, we can say that the two spheres are weakly discernible by this relation.

  Now, let's translate to programming concepts:

  - **Objects vs. Values**: In programming, we often distinguish between reference types (objects) and value types. For value types (like integers, or immutable structs), if two instances have the same state, we consider them equal and often they are interchangeable (like two integers 5). For reference types, even if two objects have the same state (i.e., their fields are equal), they can be distinct objects in memory (like two separate instances of a class with the same data).

  - **Structural vs. Reference Equality**:
    - **Structural equality** (`a == b` in Python for some types, or `a.equals(b)` in Java): Compares the content or value of the objects.
    - **Reference equality** (`a is b` in Python, or `==` for some objects in Java if not overridden): Checks if they are the same object in memory.

  - **Hashing**: If two objects are equal in structure (and we have defined `__eq__` and `__hash__` appropriately), they should have the same hash code. This allows them to be used interchangeably in hash-based collections (like sets or dictionaries). However, two distinct objects can have the same hash (hash collision) but ideally we avoid that.

  - **Deep Copies**: Creating a copy of an object and all the objects it refers to, recursively. The copy is structurally equal to the original but is a distinct object.

  - **Distributed Systems**: When two nodes in a cluster have identical state, and there is no coordinator to assign a unique identifier, how do we count distinct nodes? We might rely on network addresses (which are properties) or use consensus algorithms to assign unique IDs.

