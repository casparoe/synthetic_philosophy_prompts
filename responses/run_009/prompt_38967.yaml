     We'll have a "principle consistency" score. Each tribunal member has a scorecard. For each case, they write down their vote (uphold or overturn) and the main criterion they used. After all cases, they get 1 point for each case in which they used the same criterion as in the first case (if they want to change, they must explain why). But that forces them to stick to one.

