  We are designing a "Preference Tribunal" activity for an upper-level ethics seminar. The activity involves students acting as an appellate court reviewing decisions by a fictional Registrar. The Registrar either certifies an attitude as a preference (entitled to standing in deliberation) or strikes it down as a bias.

  Key elements:
  - 4-5 case vignettes (each under 80 words) that are fresh and avoid textbook examples.
  - Each vignette is constructed to defeat a specific criterion: stability under reflection, being informed, non-instrumental endorsement, independence from conditions that produced it.
  - Include at least one vignette set in a value system unfamiliar to students (to show them importing their own norms).
  - Procedure and decision rule for the court.
  - Scoring system (without real money).
  - Timing for the activity.
  - Debrief: map each vignette to the criterion it undermines.
  - Honest note: what underlying philosophical problem the activity cannot reproduce.
  - Self-assessment: confidence and least sure element.

