     > Citizen B, a climate scientist, states: "I prefer not to have children due to the climate crisis." They are fully informed about climate projections but have never experienced parenthood. The Registrar struck it down as a bias. [Why it defeats being informed: They are informed about the facts, but not about the experience of having children. But we often make decisions without having the experience. Is that enough to disqualify?]

