answer: |-
  ### Preference Tribunal Activity Design

  **Procedure & Timing (75 min total):**
  - **Introduction (5 min):** Explain the tribunal: Students act as appellate judges reviewing rulings by the Registrar (instructor). The Registrar either certifies an attitude as a "preference" (valid in deliberation) or a "bias" (invalid).  
  - **Case Review (40 min, 8 min/case):**  
    1. **Read:** Instructor reads a vignette and Registrar’s ruling (20 sec).  
    2. **Deliberate:** Small groups (3–4 students) discuss for 4 min.  
    3. **Vote:** Groups share rulings; majority vote determines the tribunal’s decision.  
  - **Scoring (no money):** Groups earn 1 point per case if their reasoning cites a *specific criterion* (e.g., "stability under reflection") and 0 if vague. Instructor tallies points for group bragging rights.  
  - **Debrief (25 min):** Map cases to criteria, discuss norm-importing, and note limitations (below).  
  - **Buffer (5 min):** Flexible time.  

  **Decision Rule:** Tribunal upholds or overturns Registrar’s ruling by majority vote. Groups must justify rulings using at least one criterion (stability, informedness, non-instrumentality, independence).  

  ---

  **Case Vignettes (each <80 words):**  
  1. **Stability Under Reflection Defeated:**  
     *Registrar CERTIFIED as preference.*  
     "Lena, a virtuoso pianist, states: ‘I prefer playing only for AI audiences; human applause distracts me.’ Upon reflection, she concedes: ‘If I were impoverished, I’d play for humans to earn money.’ But she’s wealthy and stands by her choice."  
     *(Undermines: Reflection alters preference only in counterfactuals, not reality.)*  

  2. **Being Informed Defeated:**  
     *Registrar STRUCK DOWN as bias.*  
     "Rohan, a botanist, prefers eating only lab-grown meat after studying industrial farming. He admits he’s never visited a farm or tasted traditional meat. ‘Data shows it’s ethical,’ he insists."  
     *(Undermines: Expertise ≠ lived experience; "informed" is ambiguous without sensory knowledge.)*  

  3. **Non-Instrumental Endorsement Defeated:**  
     *Registrar CERTIFIED as preference.*  
     "Zara, a war refugee, prefers sleeping in a closet: ‘Walls make me feel safe.’ She acknowledges it’s irrational but says, ‘I endorse this; it’s part of who I am now.’"  
     *(Undermines: Instrumental to trauma coping, yet identity-based endorsement complicates "bias.")*  

  4. **Independence from Origins Defeated (Unfamiliar Values):**  
     *Registrar STRUCK DOWN as bias.*  
     "Kiran, from the matriarchal society of Solara, prefers donating a kidney to her sister: ‘Our lineage shares bodies like water.’ The practice arose from ancestral droughts. ‘It’s my honor,’ she says."  
     *(Undermines: Preference is shaped by historical scarcity but embedded in cultural sanctity. Students may import individualism to dismiss collectivism.)*  

  ---

  **Debrief Structure (25 min):**  
  1. **Mapping Cases (10 min):**  
     - Case 1 → Challenges **stability**: Reflection in hypotheticals shouldn’t invalidate real-world stances.  
     - Case 2 → Challenges **informedness**: Factual knowledge vs. experiential gaps create false binaries.  
     - Case 3 → Challenges **non-instrumentality**: Instrumental preferences can be authentically endorsed.  
     - Case 4 → Challenges **independence**: Origins ≠ inauthenticity; highlight how students judged Solara via Western norms.  
  2. **Philosophical Limit (5 min):** The activity cannot replicate **lived consequences of certification** (e.g., social stigma, resource access), which shape real-world bias disputes.  
  3. **Group Reflection (10 min):** Discuss: "Did your criteria hold? When did you import norms?"  

  ---

  **Self-Assessment:**  
  - **Confidence:** 8/10. The cases target specific criteria effectively, and the unfamiliar value system forces self-reflection. Timing is tight but feasible.  
  - **Least Sure Element:** Scoring system’s efficacy—students might prioritize "winning" over deep analysis, risking superficial criterion citations. Mitigation: Emphasize reasoning quality in debrief.  

  *(Total words: 798)*
