     - Introduction (5 min): Explain the activity and the role of the tribunal.
     - Case Review (50 min total): Each case is presented (by the instructor as the "Registrar's ruling"), then the tribunal deliberates and votes. We have 4-5 cases, so about 10 minutes per case? That might be tight. Alternatively, we can have 10 minutes per case: 2 min reading, 3 min initial thoughts, 5 min discussion and vote.

     Decision Rule: The tribunal must vote to uphold or overturn the Registrar's decision. Majority vote? We can do a simple show of hands. The Registrar's original ruling is given, and the tribunal decides whether to affirm or reverse.

  2. **Scoring**:
     - Without real money: We can use a point system. Each student (or panel) starts with 0 points. For each case, if the tribunal's decision matches the "correct" ruling (which is not necessarily obvious, but we can have a key for the instructor) then they get 1 point. But the point is to think through the criteria, not to get a right answer. Alternatively, we can score based on the quality of argument? That might be too subjective.

     Instead, we can have a different approach: The goal is to see how consistent the tribunal is in applying criteria. We can have a "consistency score" for the tribunal as a whole: After all cases, the tribunal must articulate the criteria they used and see if they applied them consistently. But that might be for the debrief.

