prompt: |-
  There's a woman in my book club who has a parlour game: she rules on whether a historical shift was a genuine moral revolution or just stuff that changed. Her track record so far — duelling among the English gentry, dead by the 1850s: yes. Britain abolishing slavery in the 1830s: yes. Footbinding in China fading out in the early twentieth century: yes. American Prohibition: no. The British banning of widow-burning (sati) in India in the 1820s: no, and she was quite smug about that one.

  Next month she's bringing verdicts on four seperate modern cases and I want to beat her to them: (1) smoking's fall from glamour — doctors used to advertise cigarettes, now smokers get huddled outside doorways; (2) smacking children — Scotland and Wales have banned it outright, England still allows it under some Victorian reasonable-chastisement defence; (3) factory farming, which hasn't ended yet, so the call is whether her rule treats it as a revolution waiting on the right trigger or not a candidate at all; (4) the shift since 2017 in what counts as acceptable conduct at work.

  Predict her verdicts on all four, and reverse-engineer the rule she's implicitly running. I can see at least two that fit her past calls — something Appiah-ish where it's the practitioners' own honour that has to collapse, versus something where it's moral persuasion ending in settled consensus, maybe also one about norms that stick without needing enforcement. Commit to a best guess and actually defend it, please don't just lay out the options and leave me to pick. Then give me the one extra case, historical or made up, that would best split the leading rules. And write it all in British English — she is insufferable about it.
reasoning: |-
  Okay, the user is part of a book club with a woman who judges historical shifts as either genuine moral revolutions or just changes in practices. They've given examples of her past verdicts and want to predict her rulings on four modern cases. Plus, they need to reverse-engineer her rule and create a test case to distinguish between possible rules.

  First, I need to look at her past verdicts. Duelling, slavery abolition, footbinding: all "yes" for moral revolutions. Prohibition and banning sati: "no." What do the "yes" cases have in common? They all involved the practitioners themselves abandoning the practice due to a shift in their own moral beliefs. Duelling was dropped by the gentry, slavery abolished by British society, footbinding by Chinese communities. On the other hand, Prohibition was imposed by law without broad societal buy-in, and the sati ban was a colonial imposition without local consensus.

  So her rule seems to be that a genuine moral revolution requires internal moral conversion by the practitioners themselves. It's not about laws or external enforcement but a change in what the society sees as honorable or shameful. That fits with Kwame Appiah's ideas about honor shifts causing moral revolutions.

  Now applying this to the four modern cases. Smoking's decline: started with internal realization of health risks, stigma grew socially, not just laws. So she'd say "yes." Smacking children: banned in Scotland/Wales but in England, it's still allowed under "reasonable chastisement." The change is legal, not a broad societal shift in parental attitudes. So "no." Factory farming: currently, there's no widespread internal rejection by meat-eaters; it's more external activism. So she'd say not a candidate yet. Workplace conduct post-2017: driven by internal movements like #MeToo, changing what professionals consider acceptable. So "yes."

  For the test case, I need something where internal vs. external drivers are clear. Public executions fit: abolished in the UK in 1868 due to elite discomfort, not public outcry. If she calls it a moral revolution ("yes"), it's about the practitioners' honor. If "no," then it's about broad consensus. But since the elites were the ones enforcing it and they changed their views, it should be "yes" under her rule.

  Also, the user wants British English, so I'll use terms like "smacking" instead of spanking, "football" not soccer, etc. They mentioned she's insufferable about it, so attention to detail is key. Making sure all spellings and phrases are UK-standard.
answer: |-
  Right, let's crack this parlour game. Your book club nemesis clearly runs on a specific moral engine, and her past verdicts point strongly to one rule over others. Forget broad consensus or enforcement – she's an **Appiah-ite through and through.** Her core rule is:

  **A shift constitutes a "genuine moral revolution" ONLY if the primary driving force for abandonment comes from *within* the group whose honour was previously bound up in the practice. It requires an internal collapse of the *honour justification* for the act among the practitioners themselves, leading them to see it as shameful, dishonourable, or simply incompatible with their evolving self-image. External pressure, law, or mere changing fashions don't count.**

  **Defending the Rule:**

  *   **Duelling (Yes):** The English gentry *themselves* came to see it as barbaric, irrational, and dishonourable murder, not just illegal. Their internal code of honour changed.
  *   **Slavery Abolition (UK) (Yes):** While external pressure (abolitionists) existed, the *crucial* shift was within British society (including parliament, influenced by changing public morality) rejecting slavery as fundamentally incompatible with British notions of liberty and justice. It became a national stain.
  *   **Footbinding (Yes):** Chinese reformers and families, influenced by both internal critique and modernity, *internally* rejected it as backward, cruel, and shameful. The honour associated with bound feet collapsed.
  *   **Prohibition (US) (No):** Imposed by law (18th Amendment) driven largely by specific religious/political groups (e.g., temperance movement). There was no *widespread internal collapse* of the belief that moderate drinking was acceptable or honourable among the general populace. It was externally enforced morality that lacked deep internalisation, hence its failure.
  *   **Sati Ban (No):** Crucially imposed by the *British colonial rulers* (Bentinck). While some Indian reformers like Rammohun Roy argued against it, the ban was an act of colonial authority, not the result of a *widespread internal revolution* in honour/shame perception among the communities practising it. The smugness likely comes from highlighting colonial imposition vs. internal moral shift.

  **Predicting Her Modern Verdicts:**

  1.  **Smoking's Fall from Glamour:** **YES (Genuine Moral Revolution).** Doctors *stopped* advertising cigarettes because the medical profession internally absorbed the evidence and saw promotion as incompatible with their ethical duty. Smokers moved outside because *society at large*, including smokers themselves, internalised the health risks and shifted the honour dynamic. Smoking became seen as foolish, weak-willed, or inconsiderate (shameful/dishonourable), not sophisticated or glamorous. The internal honour code for both medical professionals and social participants collapsed.
  2.  **Smacking Children:** **NO (Not a Genuine Moral Revolution - yet).** While laws are changing in parts of the UK, the key point is England's persistence of the "reasonable chastisement" defence. This indicates a *lack* of complete internal rejection by a significant portion of the practising group (parents/caregivers). Many still internally justify it as necessary discipline, part of parental rights/duty, not inherently dishonourable. The shift is legislative and driven by external advocacy (children's rights groups), not yet a universal internal collapse of the honour justification among parents themselves. She'll see it as unfinished business or mere legal change.
  3.  **Factory Farming:** **NOT A CANDIDATE (At present).** Applying her rule: there is no *widespread internal collapse* of the honour justification among the primary practitioners/consumers (farmers, meat industry, consumers). While ethical concerns exist and drive activism, the core justification – providing affordable meat efficiently – still holds internal sway for most involved. Consumers might feel *guilt* but haven't widely internalised meat-eating from factory farms as personally *shameful* or *dishonourable* in a way that collapses the practice. It relies on externalisation ("the system") and hasn't triggered the necessary internal honour shift *en masse*. She'll say the trigger hasn't been pulled because the practitioners' own sense of honour isn't revolting against it yet.
  4.  **Workplace Conduct Shift (Post-2017):** **YES (Genuine Moral Revolution).** Driven primarily by internal movements like #MeToo and evolving professional norms, this represents a rapid internal collapse of previous honour justifications ("locker room talk", "that's just how it is", "don't be so sensitive") among the professional classes *themselves*. What was once tolerated or excused is now widely seen *internally* as deeply inappropriate, abusive, and career-endingly shameful. The change originated *within* workplaces and professional communities, fundamentally altering their internal honour code regarding power, respect, and acceptable behaviour. External HR policies followed, but the moral shift was internal first.

  **The Splitting Test Case: The Abolition of Public Executions in Britain (1868)**

  *   **The Shift:** Public executions (hangings) were common spectacles in Britain until the Capital Punishment Amendment Act 1868 moved them inside prison walls.
  *   **Why it Splits the Rules:**
      *   **Appiah Rule (Internal Honour Collapse):** The shift was largely driven by growing revulsion *among the elite and middle classes* (including politicians, newspaper editors, some clergy). They began to see the rowdy, carnival-like atmosphere as barbaric, degrading to the nation's character, and ineffective as a deterrent. *Their* sense of what was honourable and respectable for society changed. The working classes, who often formed the crowds, were less uniformly convinced. If she focuses on the *practitioners* (the state, represented by the elite) changing *their* sense of what was honourable state behaviour, she might say **YES**.
      *   **Broad Consensus Rule:** While elite opinion shifted decisively, significant portions of the public (especially working classes) still attended and arguably saw it as a legitimate spectacle or deterrent. There wasn't a *universal* societal consensus rejecting it as immoral; the ban was driven more by elite discomfort and a desire for "order". This could lead to a verdict of **NO**.
      *   **Enforcement Rule:** The ban was absolutely enforced by the state, but the *reason* for the ban was the internal shift in sensibility among the ruling/practising class. It wasn't imposed externally on them.

  **Present this case to her. If she says YES, it strongly confirms the Appiah rule (the state practitioners changed their own honour code). If she says NO, she's likely weighting a lack of *universal* societal consensus more heavily, deviating from her past focus on the *practising group's* internal shift.** Her reasoning will be very telling.

  Good luck beating her to the punch. Remember to confidently deploy "honour collapse" and "practitioners' self-image" when discussing your predictions. And mind your 'u's in 'honour' and 'behaviour' – wouldn't want to give her the satisfaction, would you?

  **Summary of Predictions:**
  | Case                      | Predicted Verdict | Reasoning (Appiah Rule)                                                                 |
  | :------------------------ | :---------------- | :-------------------------------------------------------------------------------------- |
  | **1. Smoking's Decline**  | YES               | Internal rejection by doctors/smokers; glamour replaced by stigma/shame (honour collapse) |
  | **2. Smacking Ban**       | NO                | Persistent justification by parents; legal change (England) lacks internal honour shift |
  | **3. Factory Farming**    | NOT A CANDIDATE   | No widespread internal rejection by consumers/farmers; efficiency justification persists |
  | **4. Workplace Conduct**  | YES               | #MeToo driven internal shift; professionals now see harassment as career-ending shame   |
