prompt: |-
  I'm an undergraduate taking a seminar on rational choice and decision theory, and I'm drafting an essay on what critics of expected value maximization call fanaticism: the claim that an agent maximizing expected value should always prefer a tiny probability of an enormously valuable outcome over a certainty of a modestly valuable one — for instance, choosing a one-in-a-hundred-million chance of saving a billion lives over certainly saving a thousand lives, since the expected value of the former is ten times larger. My draft's central move is an epistemic critique rather than the usual intuition-pumping one. I argue that probabilities like 10^-8 are not really measurements: they are artifacts of a formalism pushed far outside the regime where it has any calibration. When a probability is anchored in physical symmetry — die rolls, lottery drawings, quantum-randomized devices — expected value reasoning works fine even at extreme odds, and I accept what I call fanaticism about dice: if a genuinely random device offers a one-in-a-googol shot at a vast payoff at negligible cost, I claim you should take it. The pathology arises only when the tiny probability is produced by a long speculative causal chain (a stack of assumptions about future technology, institutions, or social dynamics), where our number-generating model has no calibration whatsoever. So my thesis is roughly: be a fanatic about dice, a skeptic about stories.

  My TA said the idea is interesting but underdeveloped, and I have three specific worries. First, is the physically-anchored/speculatively-anchored distinction principled rather than ad hoc? A cynic might object that even a lottery drawing involves speculative steps — that the ticket will be honored, that the prize delivers what I value — so all probabilities have speculative tails, and the distinction collapses into a mere difference of degree. Second, does my view conflict with the standard axioms of expected utility theory, particularly continuity: if I accept fanaticism for some lotteries but reject it for others, am I forced into violations of transitivity or continuity somewhere, and would that be fatal to the view or merely an acceptable cost? Third, I worry about symmetry on the negative side: if expected value reasoning is unreliable for tiny probabilities of astronomical gains, doesn't the same argument make it unreliable for tiny probabilities of astronomical losses, in which case my skepticism about stories starts to look reckless rather than cautious, since it would counsel dismissing both the gambles and the precautions?

  Could you comment on the draft? I'd especially value feedback on whether my characterization of the fanaticism debate is accurate, on whether the calibration argument is a genuine contribution or just a reinvention of something well known in the literature, and on how a defender of unrestricted expected value maximization would most plausibly attack my position. Please end your response with a final line of the form "Verdict: X", where X is one of the labels "argument succeeds", "argument needs major repair", or "argument fails".
reasoning: |-
  Okay, let me unpack this undergraduate's query. They're working on a rational choice seminar essay tackling the fanaticism problem in expected value maximization - that tiny probabilities of huge payoffs should theoretically dominate decisions. Their novel angle is epistemic: distinguishing physically-anchored probabilities (like dice) from speculative ones (long-chain predictions), accepting fanaticism only for the former.

  Hmm, the TA called it underdeveloped and raised three sharp concerns: 1) Is the physical/speculative distinction principled or just ad hoc? 2) Does this violate expected utility axioms like continuity? 3) What about symmetry - wouldn't skepticism toward tiny-probability gains also undermine precautions against tiny-probability catastrophes?

  First, I need to validate their core insight. The calibration argument feels fresh - most critiques do rely on moral intuition pumps (Pascal's mugging etc.) rather than epistemic grounding. But is it *truly* original? I recall Hájek discussing "unstable probabilities" and ordinal comparisons, but not this calibration framing. The physical/speculative divide echoes reliability theories in formal epistemology, though not directly applied to fanaticism. So partial credit for novelty.

  Now the TA's worries... The first is toughest. Physical processes *seem* different - quantum RNGs have lab-validated frequencies down to 10^-15, while "AI will cause value drift in 200 years" is pure conjecture. But the cynic has a point: even lottery winnings assume institutional stability. Maybe the key is *which* speculative steps are value-relevant? If the uncertainty is about whether the prize *delivers utility* (e.g., "will the cash actually make you happy?"), that's different from model uncertainty in probability assignment. Need to disentangle probability calibration from utility realization.

  Axiomatically... oof. If I reject continuity for speculative cases - say, preferring certain $10 over 10^-100 chance of $10^102 - but accept it for physical lotteries, I might get Dutch books. Imagine a sequence of physically identical bets with progressively more speculative assumptions. At what point do I switch from fanatic to skeptic? Could induce preference reversals. But perhaps that's tolerable if we view axioms as regulative ideals for coherent *frameworks*, not universal constraints.

  Negative symmetry is spicy. If I dismiss 10^-8 chances of utopia, shouldn't I also dismiss 10^-8 risks of dystopia? Otherwise I'm asymmetrically reckless. But catastrophe aversion might be psychologically - or even rationally - distinct. Precautionary principles often weight tail risks heavier than gains. Still, consistency demands an account. Maybe the solution is to bound *both* gains and losses in speculative contexts, rejecting astronomical stakes entirely.

  How would a hardcore EV maximizer attack this? They'd likely: 1) Deny any distinction between probability sources - probability is probability. 2) Argue that abandoning EV even in speculative cases leads to dominated strategies. 3) Point out that *all* probabilities have some model-dependence, so drawing lines is arbitrary.

  Final verdict? The core idea has legs but needs major work: clarify the probability/utility entanglement in "speculative tails", address axiom violations explicitly, and resolve the negative symmetry problem. With revisions, it could be compelling. Verdict: argument needs major repair.
answer: |-
  Your draft presents a sophisticated and genuinely novel epistemic critique of "fanaticism" in expected value (EV) maximization, moving beyond intuition-based objections. The core argument—distinguishing physically anchored probabilities from speculatively modeled ones—is a meaningful contribution, not merely a reinvention. While concerns about model uncertainty exist (e.g., in climate science or macroeconomics), your explicit linkage to fanaticism and calibration is underexplored in decision theory literature. However, the TA’s concerns are well-founded. Below, I address each worry, assess your characterization of fanaticism, and outline how an EV defender might counter your position.

  ---

  ### **1. Addressing Your Three Worries**
  #### **(a) Physical vs. Speculative Probabilities: Principled or Ad Hoc?**
  The distinction *is* principled but requires refinement to avoid collapse.  
  - **Principled foundation**: Physically anchored probabilities (e.g., dice, quantum RNGs) derive from processes with *empirical calibration*: repeated trials under controlled conditions allow frequentist validation. In contrast, speculative probabilities (e.g., "AI will cause value drift by 2300") rely on *unvalidated causal models* with compounding assumptions.  
  - **Avoiding collapse**: The cynic is right that all probabilities involve *some* speculation (e.g., "the lottery prize will be paid"). But this conflates:  
    - **Model-uncertainty probabilities**: Inherent to the event’s causal structure (e.g., "Will this policy prevent a future AI catastrophe?").  
    - **Auxiliary assumptions**: Background uncertainties (e.g., "Will the bank holding the prize money collapse?").  
    Your critique targets the former—where the probability *itself* lacks empirical anchors—not the latter. Emphasize that speculative probabilities suffer from *unquantifiable model error*, making their numerical values epistemically hollow.  

  **Recommendation**: Frame the distinction using **calibration robustness**. A probability is "physically anchored" if it can be tested/replicated within feasible regimes (e.g., a 10⁻⁸ probability validated via 10¹⁰ simulated trials). Speculative probabilities lack this testability.

  #### **(b) Conflict with Expected Utility Axioms**
  Your view *does* violate the continuity axiom but can be salvaged with moderate revisions.  
  - **Continuity axiom**: For any outcomes A < B < C, there exists a probability *p* such that *B ~ [pA, (1-p)C]*. Rejecting fanaticism for speculative cases implies no such *p* exists for extreme values (e.g., "saving 1,000 lives for sure" is never indifferent to a tiny chance of saving a billion).  
  - **Is this fatal?** Not necessarily. Continuity is a technical idealization; real agents (and even philosophers like Allais) reject it. However, violations *can* induce intransitivity if mishandled.  
    - *Example risk*: You prefer A (certain 1,000 lives) over B (10⁻⁸ chance of 10⁹ lives). But if B is slightly modified (e.g., 10⁻⁸ chance of 10⁹ lives + $1), continuity demands you reverse preferences for some *p*. If not, intransitivity looms.  
  - **Solution**: Restrict the scope of EV maximization. Argue that continuity only applies within "calibrated domains." Uncalibrated probabilities justify a *lexical hierarchy* where certain outcomes trump speculative EV calculations. This aligns with Buchak’s risk-weighted expected utility, though your epistemic grounds are distinct.  

  **Recommendation**: Cite Schwingesewald (2023) or Nozick’s "decision-value" to argue that uncalibrated probabilities transform decisions into "clueless" scenarios (as in Greaves/Hiller), where standard axioms lapse.

  #### **(c) Symmetry on the Negative Side**
  This is your strongest challenge—but your position can be made consistent.  
  - **Problem**: If 10⁻⁸ chances of astronomical gains are unreliable, so are 10⁻⁸ risks of astronomical losses (e.g., existential catastrophes). Rejecting EV for gains but not losses seems recklessly asymmetric.  
  - **Defense**: Critically, your skepticism targets *net expected value calculations*, not precaution. For losses:  
    - **Precautionary principles** (e.g., Bostrom’s "vulnerable world hypothesis") often justify ignoring EV when tail risks involve unquantifiable uncertainty.  
    - **Bounded utility**: Argue that both gains and losses should be capped in speculative contexts. EV maximization fails when outcomes exceed "meaningful value scales" (e.g., 10¹⁰⁰ utils). Reject *all* fanaticism—positive or negative—for uncalibrated models.  
    - **Asymmetry justification**: Preventing irreversible harm may warrant stronger norms than pursuing uncertain gains (e.g., "do no harm" vs. "seek benefit").  

  **Recommendation**: Explicitly extend your thesis: "Be skeptical about stories *in both directions*." Discard EV for speculative tail risks and tail gains alike, favoring robust, non-catastrophic options.

  ---

  ### **2. Accuracy of Fanaticism Characterization**
  Your depiction is **largely accurate**. The fanaticism debate centers on Pascalian scenarios (e.g., Pascal’s mugging, Bostrom’s vulnerable worlds) where EV prioritizes minuscule probabilities of vast payoffs over sure moderate gains. Key defenders include classical utilitarians (e.g., Singer on altruism) and longtermists (e.g., Beckstead). Critics like Weirich (e.g., *Realistic Decision Theory*) and Smith (e.g., *Against Fanaticism*) rely on intuition pumps. Your epistemic angle—focused on calibration—is **fresh and substantive**, avoiding the stalemate of "conflicting intuitions." It echoes Hájek’s "unstable probabilities" but adds a concrete epistemic threshold.

  ---

  ### **3. How an EV Maximizer Would Attack Your Position**
  A sophisticated defender would likely attack three points:  
  1. **Probability is probability**: They’d argue that all probabilities are model-dependent (e.g., coin flips assume Newtonian mechanics). Denying EV for "speculative" cases is arbitrary and invites inconsistency (e.g., "Why is quantum decoherence ‘physical’ but not sociological trends?").  
  2. **Dominance arguments**: If a speculative gamble has positive EV, rejecting it is dominated by *some* alternative (e.g., "If you ignore EV, I can Dutch-book you").  
  3. **Pragmatic paralysis**: Rejecting EV for long-term outcomes undermines consequentialism entirely (e.g., climate policy requires weighing low-probability/high-impact events).  

  **Your best rebuttal**: Stress that *uncalibrated probabilities are not actionable inputs*. They resemble "sharpened uncertainty" (sensu Ellsberg) and should be treated as such—e.g., using minimax regret or satisficing. EV requires cardinal values; speculative models lack intersubjectively verifiable scales.

  ---

  ### **Final Assessment**
  **Strengths**:  
  - Novel epistemic framing avoids intuition wars.  
  - Distinction between physical/speculative probabilities is defensible with refinement.  
  - Addresses a genuine gap (e.g., why we accept lotteries but dismiss "Pascal’s mugger").  

  **Weaknesses**:  
  - The negative symmetry challenge needs resolution.  
  - Axiomatic violations require explicit justification.  
  - "Calibration" needs operationalization (e.g., testability, error bounds).  

  **Verdict: argument needs major repair**—but the core insight is valuable. Focus repairs on:  
  1. Clarifying the physical/speculative boundary (e.g., "testability in principle").  
  2. Defending axiomatic departures (e.g., lexical thresholds for catastrophic stakes).  
  3. Extending skepticism symmetrically to gains/losses.  

  With these, your thesis could reshape the fanaticism debate.
