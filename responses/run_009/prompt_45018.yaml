prompt: |-
  So I help run a small newsletter for a reading group — lefty-ish, mixed backgrounds, maybe a third of us have philosophy training — and we just spent two months on the whole "equality of what?" debate (the Sen vs. Dworkin stuff, expensive tastes, capabilities, relational equality). Problem: now everyone uses the word "egalitarian" to mean like four incompatible things and we keep talking past each other. I want a "which egalitarian are you, actually?" quiz to settle it.

  Make it 9 questions. Each one is a concrete scenario with 2 or 3 answer options (options can be a sentence or two of plain English, not just labels). The reader has to be able to answer every question without knowing any of the theory — no question may just ask "do you believe in equality of resources?"

  Before writing the questions, figure out what the load-bearing cuts in the logical space actually are — welfare vs. resources vs. capabilities vs. primary goods, brute luck vs. option luck, cheap vs. expensive tastes, adaptive preferences, whether equality is the right relation at all vs. sufficiency or priority, distributive vs. relational — and then build each question so it hammers on exactly one of them. Say a sentence or two up front about which cut each question is targeting, so I can check you didn't stack three distinctions into one item.

  Cases that have to show up, because our group fought about all of them:
  - Dworkin's champagne person — someone who's always preferred expensive things and it costs a lot to satisfy her, no question of her being unable to help it or wishing she were different. Did her situation get worse, morally speaking? Also include a variant where the person would love to be rid of the taste and can't be.
  - Adaptive preferences: someone raised inside a hierarchy who genuinely, sincerely reports being content with very little, and whose contentment tracks her actual life.
  - Conversion: two people with identical bundles of goods where one gets much less out of them because of some natural fact about her (metabolism, or a wheelchair user facing stairs).
  - The gambler: two equally paid people, one bets her pay on a coin flip and loses everything.
  - The surfer: someone who could earn a lot but chooses to work two days a week and surf, and ends up with much less than everyone else.

  Plus one question built around a case you invent that is NOT in the literature as far as I know: someone who voluntarily, eyes open, and with no pathology, trades away a chunk of her own functioning for something she cares about more — say she takes a pill that permanently dulls her senses somewhat but removes a jealousy that was wrecking her life — and the question is what, if anything, a just society owes her afterward. If you can come up with a better invented case that pries two of the positions apart, use it instead, but tell me why you chose it.

  Then a scoring key mapping answer patterns onto named positions: at minimum welfare egalitarianism (hedonic vs. preference-satisfaction versions, if your questions can actually seperate them), Rawlsian primary goods, Dworkinian resources with the envy test, the capabilities view, luck egalitarianism, relational egalitarianism, and at least one non-egalitarian leaf (sufficientarian or prioritarian). Be honest about which pairs your questions can NOT pull apart — I suspect primary goods and resources mostly collapse into each other, and I suspect relational egalitarianism doesn't get sorted by distributive cases at all (our gambler question probably comes closest, but say so if it doesn't cut it, and tell me what question WOULD be needed even if it's too weird for a quiz). Also note any combination of answers that no real position occupies, with one sentence on whether that's because the view is incoherent or just because nobody's bothered to defend it.

  Tone: readable by non-philosophers but don't dumb it down. Short intro for the quiz, then the questions, then the key.
reasoning: |-
  Okay, the user runs a reading group newsletter focused on egalitarian debates like Sen vs. Dworkin. Their problem is terminology confusion—members use "egalitarian" inconsistently. They want a 9-question quiz to clarify positions without prior theory knowledge. 

  First, I need to map the key philosophical distinctions they mentioned: welfare/resources/capabilities, luck types, preference adaptation, conversion factors, relational vs. distributive views. Each question must isolate one concept. 

  The user specified five mandatory cases: Dworkin's champagne lover (with and without regret), adaptive preferences, resource conversion differences, gambler's option luck, and the surfers voluntary choice. Plus one original scenario—I consider a sensory trade-off for emotional relief, probing capability vs. welfare trade-offs. 

  For question design:
  - Q1 targets welfare vs. resource equality via champagne tastes
  - Q2 adds regret to test brute luck responsibility 
  - Q3 uses social hierarchy to expose adaptive preference pitfalls
  - Q4 compares physical conversion factors (wheelchair access) 
  - Q5 contrasts brute/option luck via gambling 
  - Q6 questions desert in voluntary choices (surfer) 
  - Q7 introduces a novel capability sacrifice for mental peace 
  - Q8 examines sufficiency vs. equality with unequal outcomes 
  - Q9 tests relational equality's focus on status over distribution

  Scoring must map answers to positions like luck egalitarianism or capabilities approach. I note limitations: primary goods/resources often align, relational equality needs status-focused cases beyond distribution. Some answer combinations (e.g., denying help to gamblers but aiding surfers) lack coherent defenders. 

  Tone balances accessibility with intellectual rigor—no jargon but no oversimplification either. The intro frames it as a diagnostic tool, not an authority. 

  Key checks: 
  - All user-requested cases included 
  - Each question isolates one philosophical split 
  - Novel scenario (Q7) forces capability/welfare tension 
  - Scoring admits where distinctions blur (e.g., relational equality) 
  - Warnings about collapsed positions (primary goods/resources) and unmappable combinations
answer: |-
  Here’s a 9-question quiz targeting core fault lines in egalitarian theory. Each question isolates **one key distinction** (noted in italics). The scoring key maps answers to positions and flags limitations.

  ---

  ### **Intro:**  
  *Confused about what kind of "egalitarian" you are? This quiz uses concrete cases to reveal your intuitions about fairness. No theory needed—just pick the answer that feels right. We’ll map your choices to classic positions afterward.*

  ---

  ### **Questions:**  
  1. **Target: *Welfare vs. Resources***  
     *Alex and Sam get identical incomes. Alex loves cheap hobbies (hiking, libraries). Sam only enjoys expensive things (rare wines, opera). Sam is constantly broke and unhappy, while Alex is content. Should society give Sam extra money?*  
     A) **Yes** — Sam suffers more with the same resources.  
     B) **No** — They chose their tastes; equal money is fair.  

  2. **Target: *Expensive Tastes + Responsibility (Brute Luck)***  
     *Same as above, but Sam *hates* her expensive tastes. She’s tried therapy for years to change them but can’t. Should society help?*  
     A) **Yes** — She didn’t choose this and is stuck.  
     B) **No** — Tastes are still hers to manage.  

  3. **Target: *Adaptive Preferences***  
     *Lei grew up in a strict caste system. She genuinely feels content with minimal food/shelter and says she needs nothing more. Her health is stable. Should she get the same resources as others?*  
     A) **Yes** — Her stated preferences shouldn’t trap her in deprivation.  
     B) **No** — She’s truly happy; forcing "more" on her is disrespectful.  

  4. **Target: *Resource Conversion (Capabilities/Primary Goods)***  
     *River and Sky get identical apartments. River walks easily. Sky uses a wheelchair. The building has stairs, no ramp. Sky is effectively housebound.*  
     A) **Unjust** — Identical goods don’t mean equal freedom.  
     B) **Fair** — They got the same apartment; Sky’s limits aren’t society’s fault.  

  5. **Target: *Option Luck vs. Brute Luck***  
     *Two nurses earn equal pay. One saves her money. The other bets hers on a coin flip and loses it all.*  
     A) **Unjust to bail out the gambler** — She took a reckless risk.  
     B) **Unjust not to help** — No one deserves utter destitution.  

  6. **Target: *Choice/Responsibility (Surfer Problem)***  
     *Kai could earn well as a programmer but works 2 days/week to surf, living minimally. Others work full-time and have more. Should Kai get support?*  
     A) **No** — Kai chose leisure over comfort.  
     B) **Yes** — Basic needs matter regardless of choices.  

  7. **Target: *Capability Sacrifice & Value Pluralism (Invented Case)***  
     *Jin takes a voluntary, irreversible pill to reduce her hearing/sight by 30%, curing her debilitating jealousy. She’s happier overall but now needs accommodations (e.g., hearing aids). Should society provide them?*  
     A) **Yes** — She’s entitled to participate fully despite her choice.  
     B) **No** — She traded functioning for happiness; accommodations are her responsibility.  

  8. **Target: *Equality vs. Sufficiency***  
     *In a village, everyone has enough food, shelter, and healthcare. But some have luxuries (art, travel) while others don’t. Is this unjust?*  
     A) **Yes** — Inequality itself is harmful.  
     B) **No** — Justice is met if no one suffers deprivation.  

  9. **Target: *Relational Equality***  
     *A CEO earns 500x workers’ pay but ensures all have safe jobs, healthcare, and pensions. Workers respect her and feel valued. Is this fair?*  
     A) **No** — The power gap undermines equal social standing.  
     B) **Yes** — Material conditions and mutual respect are what matter.  

  ---

  ### **Scoring Key:**  
  *Tally your A/B answers. Positions are approximations—real theories have nuance.*  

  | **Position**               | **Likely Answers**                  | **Notes** |  
  |----------------------------|-------------------------------------|-----------|  
  | **Welfare Egalitarian**    | 1A, 2A, 3A, 5B, 6B, 7A             | Focus: Equal well-being (preference-satisfaction). Hedonic welfare (pure happiness) rarely separates cleanly here. |  
  | **Luck Egalitarian**       | 1B, 2A, 4A, 5A, 6A, 7B             | Core: Compensate brute luck, not option luck. Gambler (5A) vs. regretted tastes (2A) is key. |  
  | **Resource Egalitarian**   | 1B, 2B, 4B, 5A, 6A, 7B             | Focus: Equal resources (Dworkin). Envy test: No one prefers others’ bundles. |  
  | **Capabilities Approach**  | 1A/1B†, 3A, 4A, 5B, 6B, 7A         | Core: Equal freedom to achieve functionings. †Varies on taste responsibility. |  
  | **Primary Goods (Rawlsian)** | 1B, 2B, 3A, 4A, 5B, 6B, 7A         | Near-overlap with resources BUT compensates conversion (4A) and brute luck (2B/5B). |  
  | **Relational Egalitarian** | 8A, 9A                             | Ignores most distributive puzzles. Focus: Social status, power gaps (Q9 is decisive). |  
  | **Sufficientarian**        | 3B, 6B, 8B, 9B                     | Core: Ensure all meet a threshold (Q8B). May align with capabilities on basics. |  
  | **Prioritarian**           | 1A, 2A, 3A, 4A, 5B, 6B, 7A, 8B     | Focus: Help the worst-off; Q8B separates from strict equality. |  

  ### **Limitations & Gaps:**  
  - **Primary Goods vs. Resources:** Hard to split. Rawlsians *might* help regretted tastes (2A) if they impair "self-respect," but quiz can’t isolate this. Assume near-merge.  
  - **Relational Egalitarianism:** Only Q9 directly targets it. Distributive questions (1–8) won’t sort relationalists—they might give "B" on gambler/surfer but for *social* reasons (e.g., avoiding stigma).  
  - **"Incoherent" Combos:**  
    - **1A+1B?** Impossible—welfare and resources clash on tastes.  
    - **5A (deny gambler) + 6B (aid surfer)?** No major theory holds this; inconsistent on responsibility.  
    - **4B (deny ramp) + 7A (aid Jin)?** Incoherent—both involve conversion of resources to function.  
  - **Missing Splits:**  
    - Hedonic vs. preference-satisfaction welfare (needs happiness-specific cases).  
    - Relational vs. distributive requires social dynamics (e.g., "Is segregated equality unjust?").  

  ### **Design Notes for You:**  
  - **Champagne Tastes:** Covered in Q1 (unregretted) and Q2 (regretted).  
  - **Adaptive Prefs:** Q3 isolates this—capabilities/primary goods say "A," resources/sufficiency lean "B."  
  - **Conversion:** Q4 (wheelchair) is the classic. Jin’s case (Q7) extends it to *chosen* capability loss.  
  - **Gambler:** Q5 tests option luck harshness (luck egalitarians say "A").  
  - **Surfer:** Q6 targets leisure vs. work choices.  
  - **Invented Case (Q7):** Pits capabilities (needs accommodation to function) against luck/resource views (choice = responsibility).  

  This *won’t* resolve all debates (e.g., relationalists reject the quiz’s distributive framing), but it forces clarity on loaded terms. Adjust cases if your group fixated on nuances I missed!
