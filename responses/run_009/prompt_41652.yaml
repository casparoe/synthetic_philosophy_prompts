prompt: |-
  I'm a senior analyst at a foreign-policy think tank that publishes short memos for congressional staff, and every week we kill or revise drafts that lean on a historical analogy — the draft that says we must act now or repeat Munich, the draft that says any intervention is another Vietnam, the draft that warns the U.S. and China are caught in the Thucydides trap. My junior colleagues have a rough feel for why these analogies get misused, but nothing they can apply consistently under deadline, and different reviewers on our team flag the same analogy in opposite directions. Please write a decision procedure my analysts can run in twenty minutes on any draft that uses a historical comparison: the questions to ask in order (for example, about what work the analogy is actually doing in the argument, whether the similarity claims are doing any real inferential work or just re-describing the conclusion, whether the analogy was selected before or after the analyst formed a view, what disanalogy would change the recommendation), what counts as a sufficient answer to each, where the procedure terminates in a firm no, and where it correctly hands the decision to a human because the question is one of judgment rather than structure. The procedure should be honest about its own failure modes — including that a checklist can launder a bad analogy into a respectable-looking one. Then run it on three drafts: a memo urging sanctions on a regional power by appeal to appeasement in the 1930s, a memo opposing any humanitarian intervention on the grounds that it will become another Vietnam, and a memo framing U.S.–China relations through the Thucydides trap. Include at least one case where the procedure permits an analogy I plainly distrust, and explain why that outcome is a feature of the procedure rather than a bug. Finally, say what the procedure cannot do — what an analyst loses by following it, and which misuses of historical analogy it lets through.
reasoning: |-
  Okay, the user is a senior analyst at a foreign-policy think tank. They need a decision procedure for evaluating historical analogies in policy memos. Their junior analysts struggle with this under tight deadlines, and reviewers often disagree on the same analogy. The user wants a step-by-step process that can be done in twenty minutes, with clear questions, termination points, and an acknowledgment of its limitations.

  First, I need to understand the core issues with historical analogies. They're often misused as rhetorical shortcuts or to evoke emotional responses without rigorous comparison. The key problems include confirmation bias, oversimplification, false equivalence, and ignoring disanalogies. 

  The decision procedure must be structured yet flexible enough for real-world use. It should force analysts to critically examine the analogy's role in the argument, test its validity, and identify any hidden biases. Including failure modes is crucial to prevent the checklist from legitimizing bad analogies.

  For the structure, starting with the analogy's function makes sense. Is it doing explanatory, predictive, or justificatory work? Then, assessing similarity depth and inferential weight. Analysts should map criteria from the historical case to the current situation and check if the analogy is driving new insights or just reinforcing preconceptions.

  Disanalogies are critical. The procedure must require identifying counterexamples and specifying what differences would invalidate the recommendation. This tests the analogy's robustness. Also, probing when the analogy was selected helps uncover bias. If it was chosen after forming a conclusion, that's a red flag.

  The procedure should terminate early if the analogy is purely rhetorical or if disanalogies are ignored. For borderline cases, it flags the need for human judgment, especially when similarity assessments are subjective.

  Applying it to the three drafts: The Munich analogy in the sanctions memo likely fails quickly—it's emotionally manipulative and ignores key differences like power dynamics. The Vietnam intervention memo might pass the initial steps but fail on disanalogies and predictive claims. The Thucydides Trap memo could survive the procedure if properly framed as a heuristic, but it still requires explicit caveats.

  The tricky part is designing a case where a distrusted analogy passes. For example, a well-structured Thucydides Trap argument with thorough disanalogy analysis might get approved, not because it's foolproof, but because the procedure can't reject all speculative models—that's a feature, forcing humans to engage with the argument's scaffolding.

  Limitations: The procedure can't replace expertise or judgment. It might miss nuanced misuses, like valid analogies applied to the wrong context, or fail against sophisticated but flawed comparisons. Analysts lose rhetorical force by avoiding analogies, but gain rigor.

  Finally, the user needs this to be practical—20 minutes max. So each step must be concise, with clear pass/fail criteria. Including examples of each termination outcome helps junior analysts apply it consistently.
answer: |-
  Here's a 20-minute decision procedure for evaluating historical analogies in policy memos, designed for rigor and transparency. It focuses on *how* the analogy functions within the argument, not solely on its historical accuracy.

  **The "ANALOG" Decision Procedure (20-Minute Timebox)**

  **(Spend 1-2 min per question. If stuck, move on & flag for review. Total max 20 min.)**

  1.  **A: Argument Role (2 min)**
      *   *Question:* What specific *work* is the analogy doing? (e.g., Explaining cause/effect? Predicting outcomes? Justifying a moral stance? Motivating urgency? Simply illustrating a point?)
      *   *Sufficient Answer:* A clear, specific statement of the analogy's function (e.g., "Predicting that X action will lead to Y outcome based on historical case Z," or "Justifying preemptive action by comparing Actor A to historical Aggressor B").
      *   *Terminate if:* The analogy is purely illustrative/decorative (e.g., "Like Rome, we face internal divisions"). *Decision:* **KILL** the analogy (remove it, argument must stand without it). *Flag:* Weak rhetorical filler.
      *   *Handoff if:* Role is ambiguous or multifaceted. *Decision:* **FLAG** for human review: "Analogy role unclear; requires clarification."

  2.  **N: Necessary Similarity (4 min)**
      *   *Question:* What are the *minimum essential criteria* claimed to be similar between the historical case and the current situation? List them explicitly (e.g., for Munich: "Revisionist regional power," "democratic appeasers," "territorial demands," "ideological conflict").
      *   *Sufficient Answer:* A concise list (3-5 items max) of the *core* similarities the argument *depends on* for the analogy to hold inferential weight.
      *   *Terminate if:* Criteria are vague, overly broad, or demonstrably false upon quick check (e.g., "Both are wars" when one isn't a war; "Both involve democracies" when one isn't democratic). *Decision:* **KILL/REVISE** the analogy (argument lacks foundation). *Flag:* Fundamental misalignment.
      *   *Handoff if:* Criteria are plausible but debatable or complex. *Decision:* **PROCEED**, but note criteria for disanalogy check.

  3.  **A: Actual Inference (4 min)**
      *   *Question:* Is the analogy *generating new insight or justification*, or is it merely *restating the conclusion emotionally*? Does the argument derive specific policy implications *from the comparison itself*, or is the analogy just a label for a pre-existing conclusion?
      *   *Sufficient Answer:* Evidence the analyst used the historical details to *infer* something non-obvious about the current case (e.g., "Historical case Z shows that concessions on demand A emboldened aggressor B to make demand C; therefore, concessions to Actor X on Issue Y will likely lead to demand Z").
      *   *Terminate if:* The analogy is purely emotive/conclusory (e.g., "We must sanction because appeasement is always bad," or "This will be Vietnam 2.0, so don't intervene"). *Decision:* **KILL** the analogy (rhetorical crutch). *Flag:* Substitution of emotion for analysis.
      *   *Handoff if:* Inference is present but weak or relies on contested historical interpretation. *Decision:* **PROCEED**, but note inference fragility.

  4.  **L: Logical Sequence (3 min)**
      *   *Question:* Did the analyst likely *arrive at the conclusion first* and *then select* this analogy to support it, or did the analogy genuinely *inform or shape* the conclusion during the analysis?
      *   *Sufficient Answer:* Indicators the analogy was part of the analytical process (e.g., memo explores multiple historical cases briefly, mentions considering counter-analogies, cites specific historical mechanisms influencing the recommendation). Absence of indicators suggests post-hoc selection.
      *   *Terminate if:* Strong indicators of post-hoc selection AND the analogy fails Step 3 (Actual Inference). *Decision:* **KILL/REVISE** (High suspicion of confirmation bias). *Flag:* Likely bias laundering.
      *   *Handoff if:* Unclear or plausible that analogy informed analysis. *Decision:* **PROCEED**, but note potential bias risk.

  5.  **O: Omitted Disanalogies (4 min)**
      *   *Question:* What are the *most critical disanalogies*? What specific difference(s) between the historical case and the current situation, if true, would *fundamentally undermine the policy recommendation* derived from the analogy?
      *   *Sufficient Answer:* At least 2-3 plausible, significant disanalogies explicitly stated (e.g., for Munich: "Target state has nuclear deterrent," "Current alliance structure is robust," "Lack of equivalent genocidal ideology," "Different economic interdependence").
      *   *Terminate if:* The memo *ignores obvious, critical disanalogies* OR the analyst cannot identify any disanalogy that would change their recommendation. *Decision:* **KILL/REVISE** (Analogy is being used deterministically/ignores context). *Flag:* Fatal flaw - disanalogies ignored or deemed irrelevant.
      *   *Handoff if:* Disanalogies are acknowledged but downplayed or argued against. *Decision:* **PROCEED**, but ensure disanalogies are explicitly addressed *in the memo text*.

  6.  **G: Guardrails & Grounding (3 min)**
      *   *Question:* Does the memo explicitly *limit the scope* of the analogy's applicability and *ground the policy recommendation* in current, case-specific analysis beyond just the historical parallel? Does it acknowledge the analogy is a *heuristic*, not a prophecy?
      *   *Sufficient Answer:* Clear language limiting the analogy (e.g., "While the Munich analogy highlights risks of unchecked aggression, key differences like X and Y mean strategy Z must be adapted..."), AND the core recommendation relies primarily on contemporary evidence/analysis, merely *informed* by the historical cautionary tale.
      *   *Terminate if:* The analogy is presented as *deterministic* or the *primary justification* without sufficient contemporary grounding. *Decision:* **REVISE** (Strengthen contemporary analysis, weaken analogy's causal role, add caveats). *Flag:* Over-reliance, determinism.
      *   *Handoff if:* Grounding is adequate but could be stronger, or caveats are present but subtle. *Decision:* **PROCEED**, suggest minor strengthening of caveats/grounding.

  **Procedure Failure Mode Transparency:**
  *   **Laundering Risk:** A clever or determined analyst *can* construct a superficial pass for a weak analogy by providing technically sufficient but shallow answers (e.g., listing broad similarities, stating an obvious inference, naming trivial disanalogies). The procedure identifies *structural* flaws and bias indicators, not the *depth* of historical understanding or the ultimate *wisdom* of the comparison. Vigilance is still required.
  *   **Judgment Gap:** It relies on the analyst's honesty and skill in answering Steps 2 (Similarity), 3 (Inference), and 5 (Disanalogy). A biased analyst might misrepresent these.
  *   **Time Limits:** Forces prioritization; deep historical research isn't possible. Relies on analyst's baseline knowledge.

  **Application to Drafts:**

  1.  **Memo: Sanctions on Regional Power via 1930s Appeasement Analogy**
      *   **A (Role):** Predicting outcome (appeasement -> wider war), justifying preemptive toughness. *Pass.*
      *   **N (Similarity):** (Plausibly) Aggressive regional power, territorial demands, democratic targets initially reluctant to confront. *Pass (Handoff: Criteria debatable).*
      *   **A (Inference):** Likely weak. Often concludes "appeasement bad, therefore sanctions good" without showing *how* historical mechanisms apply *specifically* to *this* power/situation beyond the superficial label. *Terminate?* **Likely KILL/REVISE.** Inference is probably conclusory/emotive. (Failure mode risk: Analyst might claim inference like "Concessions embolden," but memo likely lacks proof it applies *here*).
      *   **L (Sequence):** High risk of post-hoc selection for a common hawkish position. *Terminate?* **Likely KILL/REVISE** (esp. combined with Step 3 failure).
      *   **O (Disanalogy):** Critical disanalogies ignored? (e.g., Nuclear weapons? Different alliance structures? Economic interdependence? Lack of equivalent ideology/genocidal intent? Different global institutions?). If ignored, **Terminate: KILL/REVISE.** If acknowledged poorly, **Handoff/Revise.**
      *   **G (Guardrails):** Usually absent or minimal. Presented as a stark lesson. *Terminate/Revise.*
      *   **VERDICT:** **HIGH CONFIDENCE TERMINATE (KILL/REVISE).** Classic misuse: Emotive, conclusory, ignores disanalogies, deterministic.

  2.  **Memo: Oppose Humanitarian Intervention via Vietnam Analogy**
      *   **A (Role):** Predicting outcome (intervention -> quagmire/catastrophe), justifying non-intervention. *Pass.*
      *   **N (Similarity):** (Plausibly) Intervention in internal conflict, local insurgency, unclear objectives, potential for escalation, domestic political sensitivity. *Pass (Handoff: Criteria broad).*
      *   **A (Inference):** Potential strength. Might derive specific risks *from* Vietnam: e.g., "Unclear objectives lead to mission creep" or "Local insurgencies can bog down superior forces." *Pass/Handoff* (Depends on memo's specificity).
      *   **L (Sequence):** Risk of post-hoc selection for dovish position, but plausible it informed analysis. *Proceed.*
      *   **O (Disanalogy):** **CRITICAL STEP.** What difference would change the recommendation? E.g., Clear UN mandate & int'l coalition? Genocide occurring? No major power backing insurgency? Limited, achievable objective (e.g., no nation-building)? Proximity allowing easier logistics? If the memo *ignores* these or states *no* disanalogy would change "no intervention," **Terminate: KILL/REVISE.** If it acknowledges them but argues they are insufficient to overcome core risks *based on Vietnam's lessons*, **Pass/Handoff**.
      *   **G (Guardrails):** Often weak. Can imply "all interventions = Vietnam." *Revise Needed.*
      *   **VERDICT:** **HIGHLY CONTINGENT ON STEP 5 (O).** If disanalogies are ignored/fatal flaws dismissed: **TERMINATE (KILL/REVISE).** If disanalogies are seriously engaged and the argument uses Vietnam *specifically* to highlight *risks to mitigate* (not an absolute bar), and adds contemporary analysis, **REVISE (Strengthen Guardrails)**. Demonstrates procedure permitting a potentially useful analogy if well-handled.

  3.  **Memo: U.S.-China via Thucydides Trap**
      *   **A (Role):** Explaining underlying structural tension, predicting risk of conflict, framing the relationship. *Pass.*
      *   **N (Similarity):** Rising power challenging established hegemon, fear, security dilemma. *Pass (Handoff: Very broad criteria).*
      *   **A (Inference):** Often weak. The analogy *frames* but rarely generates specific *new* policy insights beyond the general caution. Often just re-describes "structural risk exists." *Terminate?* **Likely REVISE/KILL.** Needs to show *how* the Thucydides dynamic specifically informs *this* recommendation beyond platitudes. (Failure Mode: Analyst might claim it justifies engagement/hardline, but inference is shallow).
      *   **L (Sequence):** Often selected early as a dominant frame. *Proceed.*
      *   **O (Disanalogy):** **CRITICAL STEP.** What difference would change the recommendation? E.g., Deep economic interdependence? Nuclear deterrence? Different ideologies (capitalist vs. communist vs. ancient)? Climate change as a shared existential threat? Global institutions? If memo ignores these or claims they are irrelevant to the "inevitable" trap, **Terminate: KILL/REVISE.** If it acknowledges them as factors that *might* mitigate or alter the trajectory *but the core structural risk remains dominant*, **Pass/Handoff**.
      *   **G (Guardrails):** Varies. Often overstates determinism ("Trap" implies inevitability). Needs strong caveats. *Revise Needed.*
      *   **VERDICT:** **REVISE HEAVILY OR KILL.** High risk of being a deterministic, overly broad framing device doing little real inferential work (Step 3). Survival depends on *explicitly* using it *only* as one heuristic among many, heavily caveated (Step 6), and deriving *specific*, non-obvious policy implications grounded in current realities (Step 3). **This is the case the Senior Analyst distrusts but the procedure *might* permit.** *Why it's a feature:* If the analyst *explicitly* lists the core similarities (Step 2), shows *how* they generate a specific, non-obvious insight (Step 3 - hard!), *and* seriously engages with critical disanalogies (Step 5) while avoiding determinism (Step 6), the procedure must allow it. It forces the analogy to be used more rigorously than usual, exposing its limits but permitting it if the argument meets the structural tests. It doesn't judge the *quality* of the historical model, only its *rigorous application within the argument*. The Senior Analyst's distrust likely stems from the model's flaws, which the procedure exposes via Steps 5 & 6, requiring the analyst to confront them explicitly.

  **What the Procedure Cannot Do (Limitations & Costs):**

  1.  **Judge Historical Validity:** It tests the *argument's use* of the analogy, not the absolute historical accuracy or the best scholarly interpretation of the original event.
  2.  **Assess Depth of Knowledge:** It relies on the analyst's baseline competence. A shallow but structurally sound analogy passes.
  3.  **Prevent Sophisticated Misuse:** A very skilled analyst can "game" it to launder a preferred but weak analogy with technically sufficient answers (the core Failure Mode).
  4.  **Replace Substantive Expertise:** It doesn't teach history or geopolitics. It's a logic check.
  5.  **Capture Nuanced Judgment:** It flags areas for human judgment but cannot replicate the seasoned analyst's "gut feel" for when an analogy is insightful vs. misleading despite passing the steps.
  6.  **Handle Novel/Complex Analogies Well:** It works best on common, well-understood analogies. Truly original or complex comparisons might be prematurely killed.
  7.  **Costs to the Analyst:**
      *   **Time:** 20 minutes is significant under deadline pressure.
      *   **Rhetorical Impact:** It discourages powerful (but often simplistic) emotional framing analogies (Munich, Vietnam as bogeymen), potentially making memos drier.
      *   **Over-Caution:** Might lead to rejecting useful heuristic framing (like a *well-caveated* Thucydides Trap) due to fear of structural flaws.
  8.  **Misses These Misuses:**
      *   **Valid Analogy, Wrong Context:** An analogy that passes the procedure but is applied to a fundamentally different *type* of situation beyond its core relevance.
      *   **"Zebras" not "Horses":** Over-reliance on a dramatic but low-probability historical parallel when more mundane, recent analogies are better fits.
      *   **Ignoring Historical Debates:** Using one contested interpretation of the historical event as settled fact.
      *   **False Precision:** Using superficial historical parallels to justify overly specific policy prescriptions.

  **In essence, this procedure forces discipline and exposes common flaws, but it cannot guarantee wisdom. It replaces unstructured distrust with structured skepticism, making the decision to use or kill an analogy more transparent and defensible, especially under deadline pressure.** It empowers junior analysts to challenge weak analogies systematically and provides reviewers with a common framework for discussion.
