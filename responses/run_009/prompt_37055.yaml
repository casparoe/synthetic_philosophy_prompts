answer: |-
  Here’s a targeted Q&A prep sheet for your embodied cognition audience, structured around their likely objections. I’ve ordered them by probable sequence, flagged soft spots, included strategic concessions, and added the dreaded "killer question" at the end.

  ### Core Premise to Reiterate Constantly
  > **"Knowing-how *is* a form of knowing-that, but the proposition (e.g., 'w is a way to φ') is grasped in a *practical, embodied mode of presentation* – not a detached, linguistic one. This explains the phenomenology without abandoning intellectualism."**

  ---

  ### 1. **Objection: "But the knowledge is *in the body*! It’s not 'knowing-that,' it’s *skilled coping* – the body schema handles it without propositions!"**  
     *(Likely first objection, framing skill as non-representational)*  
     - **Concede upfront:** "Absolutely, the *performance* relies entirely on embodied dynamics – sensorimotor contingencies, body schemas, and online coupling with the environment. I’m not reducing skill to *conscious* rumination."  
     - **Reply:** "But this doesn’t refute intellectualism. The body schema *implements* practical knowledge of sensorimotor contingencies. When you ride a bike, your system knows *that* leaning left steers left, *that* pedaling maintains balance – but this 'that'-knowledge is accessed via proprioception and action, not sentences. The 'way' is *presented practically*, but it’s still a knowable relation."  
     - **Soft spot:** You’re stretching "knowing-that" to include non-linguistic, embodied access. They’ll push back hard on whether this counts as "propositional."

  ### 2. **Objection: "Chicken sexers! Experts who *can’t articulate* how they do it. If it’s knowledge-that, why can’t they state it?"**  
     *(Classic embodied cog sci example)*  
     - **Concede upfront:** "Totally agreed – explicit articulation is often impossible for experts. This shows the *mode of access* is practical, not discursive."  
     - **Reply:** "But inarticulacy ≠ non-propositional. They still know *that* certain features distinguish males/females. The knowledge is *accessed* through perceptual-motor engagement, not verbal reflection. Just as you know *that* your friend’s face looks familiar without being able to describe it, chicken sexers know *that* certain patterns indicate sex – practically, not descriptively."  
     - **Soft spot:** If the knowledge is *never* accessible to cognition (even non-verbally), is it still "knowledge-that"? Stand firm on practical access as cognition.

  ### 3. **Objection: "The outfielder catching a fly ball! He *doesn’t know how he does it* – he just *runs*. Your 'knowing-that' requires representation; this is direct coupling!"**  
     *(Embodied dynamic systems argument)*  
     - **Concede upfront:** "Yes, this looks like subpersonal, online control – no higher-order representation needed. The 'knowledge' is in the agent-environment loop."  
     - **Reply:** "But this is consistent with intellectualism! He knows *that* keeping the ball at a constant optical trajectory centers it (even if he can’t state this). The visual system *practically grasps* this invariant. When he succeeds, his action manifests *knowledge of that rule*, even if it’s embedded in sensorimotor circuitry. It’s still a fact about the world he’s leveraging."  
     - **Soft spot:** They’ll say the "rule" is an *ex post facto* rationalization, not a causal factor. Stress that practical grasp = non-inferential sensitivity to contingencies.

  ### 4. **Objection: "Ryle was right! You’re smuggling in a *homunculus* – your 'practical mode of presentation' is still a ghostly 'contemplation'!"**  
     *(The Rylean in the room)*  
     - **Concede upfront:** "Ryle’s regress *would* be fatal if I required a separate act of 'thinking-that' before acting. I reject that!"  
     - **Reply:** "My view requires *no* prior contemplation. The knowledge-that is *constitutively embodied* – it’s *activated* in the action itself. Knowing *that* w is a way to φ *just is* being disposed to φ via w when appropriate. No ghost, no regress: the knowing is *in* the doing, but its structure is still propositional."  
     - **Soft spot:** If the knowledge is *identical* to the disposition, is it still "knowledge-that" or just ability? (Link this to arthritis case below).

  ### 5. **Objection: "Hub-and-spoke! Cognition evolved *for action*, not for storing abstract 'that'-knowledge. Skills are adaptive responses, not truth-bearers!"**  
     *(Action-first epistemology argument)*  
     - **Concede upfront:** "I agree 100% that cognition is fundamentally *for* action. Truth is secondary to adaptive success."  
     - **Reply:** "But successful action *requires* sensitivity to real patterns – i.e., knowing *that* certain actions have certain outcomes. The bicyclist knows *that* counter-steering avoids a fall. This knowledge is *pragmatically constituted* (it’s about 'what works'), but it’s still a factive relation to the world. 'Knowing-that' isn’t abstract – it’s the action-oriented *grasp of a contingency*."  
     - **Soft spot:** They’ll see "factive relation" as smuggling in disengaged representation.

  ---

  ### The Killer Question You’re Praying Nobody Asks  
  **"If the arthritis-ridden pianist *knows-that* how to play, but *can’t play*, what is the *cash value* of calling it 'knowledge'? Isn’t this just a linguistic trick to save intellectualism, stripping 'knowledge-how' of everything that makes it *skill*?"**  

  #### Why it’s deadly:
  It exposes the tension in your view: if knowledge-how is separable from ability (via arthritis/ski instructor cases), but you define it as *practically embodied* knowledge-that, what does "practical" mean if it doesn’t enable action? It risks looking like an ad hoc move.

  #### How to Reply (2-min version):
  1. **Concede:** "This is the hardest case, and I grant it strains intuition. The cash value isn’t linguistic – it’s *explanatory*."  
  2. **Core Defense:** "The pianist retains *understanding* of *how* the skill works, even without execution. She can *imagine* playing, correct others’ technique, or explain principles – all manifesting knowledge *that* certain movements produce certain effects. This knowledge was *acquired* practically and remains structured by sensorimotor contingencies, even if her body can’t execute them. Crucially, *re-acquiring* the ability would be faster than a novice – showing latent knowledge persists."  
  3. **Reframe:** "Calling it 'knowledge-that' explains why skills are *intelligent* and *transferable* (e.g., from bike to motorbike). Ability is the *output*; knowledge is the *understanding* enabling it."  
  4. **Soft Spot Admit:** "Where it feels soft is explaining the *mechanism* of latent knowledge. I’d argue it’s sensorimotor 'models' or dispositions – but yes, this needs more work. Still, denying she knows *how* to play seems wrong. She knows, she just can’t *do*."  

  #### Key Move:
  Connect it to their own work: "Isn’t this latent knowledge similar to *degraded body schemas* in neuroscience? The 'knowledge' is still there neurally, but inaccessible for output. That neural state *represents* the skill – hence knowledge-that."  

  ---

  ### Tactical Tips for the Session
  - **Use THEIR language:** Say "sensorimotor contingencies," "body schemas," "online/offline intelligence."  
  - **Flip examples:** "Your own work on [e.g., catching fly balls] *presupposes* agents know *that* optical acceleration means X – practically!"  
  - **Hedge Smartly:** "I’m not saying *all* knowledge-that is practical; I’m saying *this specific class* of knowledge-that (ways-to-φ) is accessed practically."  
  - **Worst-case Fallback:** "Even if you reject 'knowledge-that,' we agree skill involves *practical understanding* of contingencies. My claim is that this fits within a *broader* intellectualist framework."  

  This audience will resist, but your concessions show you speak their paradigm. The arthritis case is your biggest vulnerability – prep that reply hardest. Good luck!
