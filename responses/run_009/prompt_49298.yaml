prompt: |-
  I'm a journalist on the science-and-ideas beat at a mid-sized outlet -- one week it's epigenetics, the next it's whatever Polymarket did wrong. I've written a fair amount about forecasting tournaments, superforecasters, election markets, all that. Readers keep asking me about futarchy, the Robin Hanson idea where you vote on values but bet on beliefs, and I keep giving them a shrug dressed up as a paragraph. So I've been trying to figure out what I actually think, going by gut reactions to cases the way I do when a story is too technical for me to fake expertise. I want you to find the principle behind my verdicts, if there is one.

  My verdicts, for what they're worth:

  1. Public real-money markets on elections, Fed decisions, whether a bill passes: good. I cite them in copy, they beat pundits, no hesitation.
  2. A newsroom running an internal market on whether its own big investigations will hold up or get retracted: fine, actually seems obviously smart.
  3. Futarchy proper at the city level -- define some metric like median income or life expectancy, run conditional markets on policy bundles, implement whichever side the market favors: gut says no. But I can't articulate why an accuracy-tested market is worse than a city council that can't predict anything.
  4. A market on whether a specific politician dies in office (the Polymarket assassination-price thing): clearly not fine, but I notice it feels different from the election markets in (1), and both are just markets on events that other people can influence. That bugs me.
  5. A billionaire openly spends millions to push up the price on a market about whether a tariff will help employment, purely to get the tariff implemented, planning to eat the losses: not fine. That's manipulation, full stop.
  6. Except then I read the counterargument that profit-seeking manipulators end up subsidizing information, because informed traders take their money, and markets get MORE accurate not less, and I find myself half-convinced. So (5) flips on me depending on which paper I read last.
  7. Markets on 30-year-out policy outcomes, climate stuff, pension reform: thin, dumb, dominated by hobbyists. But then again so is the electorate on those timescales. My verdict is that the market would still be worse somehow, even though I'd trust markets over politics for the 6-month stuff, and I can't defend that asymmetry.
  8. A government that just publishes market prices as advice but keeps human discretion: totally fine, obviously fine. But then it's not really governance-by-market at all, so what did we gain.

  The tensions I already see: (5) vs (6), obviously, and (3) vs (8) -- market-as-advisor fine, market-as-decider not fine, even though the decider version is the entire futarchy pitch. There may be more tensions I'm not seeing.

  Now the actual ask. You are a political theorist with a serious mechanism-design habit -- think someone who has read all the Hanson papers AND the critics, and who has no stake in futarchy being right. Please think carefully about this rather than pattern-matching to "prediction markets good" or "prediction markets libertarian silicon valley thing." Start with some brainstorming: lay out two or three candidate principles that could generate my verdicts (a few different ones -- maybe one about incentives to cause the outcome, one about who bears the costs of error, whatever else fits), then pick the best one and state it precisely. Tell me which of my verdicts it cannot acommodate and would force me to overturn -- I'd rather lose a verdict than keep all of them with a mushy principle. Then apply it to a case I haven't listed: a political party that binds itself in advance to nominate whichever candidate leads a designated prediction market six months before the convention. What does the principle say, and does that answer feel right? Be honest about where my gut verdicts are just vibes, and please dont flatter me.
reasoning: |-
  Okay, the user is a journalist covering science and ideas, including forecasting tournaments and prediction markets. They're struggling to articulate a coherent principle behind their gut reactions to different market applications, especially futarchy. Their verdicts show a pattern: they accept markets for short-term, observable events but reject them for governance, long-term forecasts, or morally charged contexts.

  Hmm, the key tensions they've identified are between manipulation being bad vs. potentially improving accuracy (5 vs 6), and market-as-advisor being acceptable but market-as-decider not (3 vs 8). Their discomfort seems rooted in unstated ethical boundaries, not technical efficiency.

  Let me brainstorm candidate principles. First, the "Intentional Harm Risk" principle - markets are bad when they incentivize causing outcomes. This explains assassination markets (4) but fails on the billionaire case (5) where manipulation isn't harmful. Second, "Cost Internalization" - who pays for errors? That explains why internal newsroom markets (2) feel safe but governance markets (3) don't. Third, "Epistemic Boundaries" - markets work only for verifiable, short-term events. This handles their timescale asymmetry (7) but contradicts election markets (1) which involve influence.

  The second principle seems strongest. Refined as: "Markets are legitimate decision tools only when error costs fall primarily on participants who voluntarily assumed risk, and when outcomes are promptly verifiable." This explains: 
  - Why governance markets (3) fail (citizens bear costs involuntarily)
  - Why advisory markets (8) work (no decision transfer)
  - Why assassination markets (4) are intolerable (risk externalization)
  - Why long-term markets (7) feel wrong (verification delay)

  It challenges verdict 6 though - if manipulators subsidize information, but costs are externalized, it's still illegitimate. For the political party case: nominating based on markets transfers risk to voters who didn't consent, so the principle rejects it. The discomfort comes from democratic accountability being bypassed.

  The user's hesitation on futarchy isn't about accuracy - it's about democratic legitimacy and involuntary risk-bearing. Their gut senses markets commodify decisions that shouldn't be commodified when costs fall on outsiders. That's why "advisor" (8) feels safe but "decider" (3) doesn't. The asymmetry in (7) comes from outcomes being unverifiable within the accountability horizon.

  They might need to overturn their openness to manipulation (6) - efficiency arguments don't resolve the consent issue. Also, their approval of internal newsroom markets (2) holds because participants are voluntary stakeholders. The principle exposes that their real concern isn't epistemology but ethics: prediction markets work only when participants are proper risk-bearers for the decision at hand.
answer: |-
  Here's a principled framework derived from your verdicts, dissected without flattery. Your discomfort with futarchy isn't about prediction quality—it's about **accountability boundaries** and **moral externalities**.

  ---

  ### Candidate Principles Brainstorm
  1. **Incentive-Alignment Principle**:  
     Markets are legitimate when participants' incentives align with *truth-seeking*, not *outcome-causing*. Rejects assassination markets (4) and billionaire manipulation (5), but struggles with (6) and why governance markets (3) feel worse than advisory ones (8).

  2. **Cost Internalization Principle**:  
     Markets are acceptable when costs of errors fall primarily *on participants*. Explains newsroom markets (2: journalists bear costs) vs. city governance (3: citizens bear costs), but doesn't resolve election markets (1: public influenced) or assassination markets (4: target bears cost).

  3. **Epistemic Boundaries Principle (Your Best Fit)**:  
     **"Markets are legitimate decision tools only when:  
     (a) Outcomes are verifiable promptly/unambiguously;  
     (b) Participants bear the costs of their errors *directly*;  
     (c) No party can profit by *intentionally causing harm*."**  

  ---

  ### Why This Fits Your Verdicts
  - **✅ Supported Cases**  
    - **Election markets (1)**: Outcomes clear within weeks; traders lose money if wrong (b); no profit from violence (c).  
    - **Newsroom markets (2)**: Retractions verifiable (a); participants (journalists) suffer reputational/professional costs (b).  
    - **Advisory markets (8)**: Humans absorb error costs (b); market is input, not decider.  
    - **Assassination markets (4)**: Violates (c)—profit from harming others.  

  - **🚫 Challenged Cases**  
    - **Futarchy (3)**: Fails (b)—citizens bear policy costs, not traders. Outcomes (e.g., "median income") may be gamed/delayed, violating (a).  
    - **Billionaire manipulation (5)**: Violates (c)—intentional harm to employment for gain. Your flip-flop on (6) is overruled: subsidizing info only works if markets *already* satisfy (a)-(c); here, manipulation distorts truth-seeking.  
    - **Long-term markets (7)**: Fails (a)—30-year outcomes unverifiable (climate models change, data noisy). Traders won’t live to bear costs (b).  

  - **Tensions Resolved**  
    - **(3) vs (8)**: Advisory keeps humans accountable for costs (b); futarchy outsources it.  
    - **(5) vs (6)**: "Manipulation subsidizes info" assumes *efficient* markets—but (5) violates (c), corrupting the mechanism.  

  ---

  ### Verdicts You Must Overturn
  - **Verdict 6 (Manipulation Debate)**: You must reject the "manipulators subsidize info" argument in cases violating (c). Profit-seeking manipulation *is* corrosive when it incentivizes harm (assassination) or social engineering (tariffs).  
  - **Verdict 7 (Long-Term Markets)**: Your "vibes" are inconsistent. If you trust 6-month markets (verifiable), you *should* distrust 30-year markets per (a). No need to invent "worse somehow."  

  ---

  ### New Case: Political Party Nomination Market  
  **Setup**: A party binds itself to nominate whoever leads a prediction market ("Who will win the general?") 6 months pre-convention.  

  **Principle Analysis**:  
  - (a) **Verifiability**: Outcome (election win) clear within months—✅.  
  - (b) **Cost Internalization**: Traders profit/lose money based on accuracy—✅. But *voters* bear costs if a weak nominee loses—❌.  
  - (c) **Harm Incentives**: Traders might manipulate prices to nominate a candidate they can beat (e.g., shorting strong opponents)—potentially ❌.  

  **Verdict**: **Not legitimate** per your principle. Fails (b): party members/voters, not traders, suffer if the market picks a loser. Also risks (c) if bad actors manipulate to install a weak opponent.  

  **Does it feel right?** Probably. Your gut likely recoils at letting gamblers override primary voters—even if the market is accurate. The error cost (losing an election) falls on outsiders.  

  ---

  ### The Core Insight  
  Your discomfort with futarchy isn’t about prediction *accuracy*—it’s about **democratic accountability**. Markets optimize for profit, not welfare. When traders don’t bear the real-world costs of errors (city policies, nominations, tariffs), the mechanism is ethically alien. Advisory roles (8) work because humans retain moral responsibility; futarchy (3) obscures it.  

  **Where your "vibes" are defensible**:  
  - Your asymmetry on timescales (7) reflects verifiability limits, not bias.  
  - Your assassination-market horror (4) is a moral anchor—never override it.  

  **Where you’re inconsistent**:  
  - Defending election markets (1) while rejecting nomination markets requires acknowledging that (1) *informs* without *deciding*—exactly your (8) distinction.  

  ### TLDR  
  **Your principle**: *Markets should decide only when participants directly suffer the consequences of being wrong, and outcomes can be checked before the sun explodes.* Futarchy fails because citizens, not traders, live with the results.
