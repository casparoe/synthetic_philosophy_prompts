  The user’s questions about substantive disagreements (truthmakers, tensed facts, time’s passage) are key. They’re not just asking for definitions; they want to know if the debate has ontological weight. The bonus question about Gödel suggests they’ve encountered historical arguments but wonder if they’re still relevant. 

  I should break this down: 
