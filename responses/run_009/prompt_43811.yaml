answer: |-
  ### Phase 2 Design: Diachronic Dutch Book (Medical Test Scenario)
  **Goal:** Students discover that even "time-slice coherent" agents can be exploited if they update non-Bayesianly.  
  **Core Mechanism:** Bookie uses a *conditional bet contract* at t0 and exploits inconsistent updating at t1.  
  **Scenario:** Rare disease (1% prevalence) and a test (90% accuracy). We focus on a *positive test result* to trigger base-rate neglect.  

  ---

  #### **Step-by-Step Live Procedure** (25 min total)  
  1. **Setup (5 min)**  
     - Explain: *"A disease affects 1 in 100 people. A test is 90% accurate (10% false positive/negative). You'll set prices at two times: before the test (t0) and after a positive test (t1)."*  
     - **Materials:**  
       - Printable "price sheets" (t0 and t1).  
       - Disease simulation: 10 red cards (disease), 90 black cards (no disease), and a "test result" die (⚀-⚅: ⚀-⚄ = accurate, ⚅ = inaccurate).  

  2. **t0 Pricing (3 min)**  
     - Students privately set **fair prices** (0-100 points) for:  
       - **A:** "I have the disease AND test positive."  
       - **B:** "I test positive (any result)."  
     - *Instructor tip:* Urge realism. Most will set low prices for A (e.g., 1-5 points) and moderate for B (e.g., 10-15 points).  

  3. **Conditional Bet Contract (2 min)**  
     - Bookie (volunteer) picks a victim, sees their t0 sheet, and calculates:  
       $$p = \frac{\text{Price for A}}{\text{Price for B}}$$  
       *(This is the victim’s implicit conditional probability of disease given a positive test.)*  
     - Bookie "sells" a conditional bet:  
       *"If I test positive, you must sell me a 100-point disease bet at price $100 \times p$."*  
       - No points exchanged yet. Contract is free (fair at t0).  

  4. **Test & t1 Pricing (5 min)**  
     - **Simulate test:**  
       - Draw a card (disease status). Roll die:  
         - Disease + ⚅ → negative; No disease + ⚅ → positive (force positive result).  
       - *Announce: "Test is positive!"*  
     - Victims set **q**: Fair price at t1 for *"I have the disease (given positive test)."*  
       - **Base-rate neglect trap:** Most set q ≈ 90% (ignoring rarity).  

  5. **Exploitation (5 min)**  
     - Bookie executes:  
       1. **Exercises contract:** Buys 100-point disease bet from victim at $100p$ (e.g., $100 \times 0.1 = 10$ points).  
       2. **Sells new bet:** Sells victim a 100-point disease bet at $100q$ (e.g., $100 \times 0.9 = 90$ points).  
     - **Victim’s point loss:** $100(q - p)$ (e.g., 90 - 10 = 80 points).  
     - **Why loss is certain:**  
       - Final disease outcome is irrelevant (bets cancel: bookie owes victim 100 if disease, victim owes bookie 100 if disease).  
       - Victim’s net loss: $100(q - p)$ from cash flow alone.  

  6. **Reveal Disease Status (5 min)**  
     - Show drawn card. Confirm bets cancel.  
     - **Key demo:** Victim’s point total drops instantly at t1. No "real" disease resolution needed.  

  ---

  #### **Debrief Structure** (15 min)  
  **Distinguishing the Two Phases:**  
  | **Phase 1 (Static)**                          | **Phase 2 (Diachronic)**                          |  
  |----------------------------------------------|--------------------------------------------------|  
  | Proves: Incoherent prices → sure loss *now*. | Proves: Non-Bayesian updating → sure loss *across time*. |  
  | Violation: Synchronic consistency (e.g., probabilities ≠ 1). | Violation: **Conditionalization** (updating ≠ Bayes’ theorem). |  
  | Weakness: None. Directly shows irrationality. | Weakness: Controversial! (See below). |  

  **The Controversy (Present Fairly):**  
  > *"Phase 2 seems to prove you must update via Bayes’ theorem. But is it irrational? Critics say:*  
  > - _‘t0 and t1 you are different agents! Why should t0 you bind t1 you?’_  
  > - _‘The bookie doesn’t reveal incoherence—they exploit a *predictable mistake*.’_  
  >   
  > *In Phase 1, incoherence is *directly* exploited with your own prices. In Phase 2, the bookie relies on *knowing your updating rule*. If you avoid predictable rules, you might escape... but can you?"*  

  **What Phase 2 Legitimately Shows:**  
  - You are exploitable if your updating rule is *non-Bayesian and predictable*.  
  - Bayesian updating (conditionalization) is the only *strategy-proof* rule against such exploitation.  

  ---

  #### **Honest Failure Report & Fixes**  
  **Predicted Failures:**  
  1. **Students set huge price gaps (no trades):**  
     - In Phase 1, enforce a **single fair price** per claim (no bid-ask spread).  
     - In Phase 2, scale bets to 100 points to magnify exploitation.  

  2. **Bookies don’t construct Dutch books:**  
     - **Pre-game training:** Show a 2-min example (e.g., if P(A)=0.4, P(not A)=0.7 → bookie profits 0.1).  
     - **Cheat sheet:** Bookies get a flowchart: *"Find probabilities ≠1 for exhaustive events, or P(A|B) ≠ P(A and B)/P(B)."*  

  3. **Phase 2 runs long (e.g., test simulation drags):**  
     - **Fix 1:** Pre-determine a "positive test" (skip drawing/rolling).  
     - **Fix 2:** Use 1 instructor-calculated victim (e.g., q=90%, p=10%) if students stall.  

  4. **No base-rate neglect (students set q ≈ 10%):**  
     - **Fix:** Use the **instructor as victim** to demo: Set t0 prices (A=1, B=10 → p=0.1), then t1 q=0.9.  
     - **Fallback:** Show a pre-calculated example: *"If your q was 90%, you’d lose 80 points!"*  

  **Time Allocation Safety Net:**  
  - If Phase 1 overruns (e.g., 40 min), run Phase 2 as instructor demo (not student-led).  
  - If Phase 2 fails, use the **fallback whiteboard version**: Diagram the bets with p=0.1 and q=0.9 → loss of 80 points.  

  ---

  #### **Materials & Logistics**  
  - **Printables:**  
    - t0 sheet: "Price (0-100) for: A = Disease AND Positive, B = Positive."  
    - t1 sheet: "Price for: Disease (after positive test)."  
    - Score tracker (points in/out).  
  - **Disease sim:** Cards (10 red, 90 black), 6-sided die.  
  - **Instructor script:** Talking points for debrief controversy.  

  **Why This Works:**  
  - **Phase 2 fits in 20-25 min** by avoiding disease-resolution delays (loss happens at t1).  
  - **Victim feels the hit:** Point loss is immediate and visible, making the exploit tangible.  
  - **Controversy is addressed head-on**, turning weaknesses into critical thinking moments.  

  > "The genius is: We don’t need Bayes’ theorem to *tell* them they’re wrong—their point total *shows* it."
