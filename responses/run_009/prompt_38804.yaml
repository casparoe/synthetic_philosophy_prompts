answer: |-
  ## Historians' Quarrel: The Unescapable Present

  **Setting:** A slightly-too-warm university common room, mid-afternoon. Coffee cups and a plate of neglected biscuits sit between MARTA (late 40s, precise gestures) and JULES (early 50s, leans forward intently).

  **Marta:** ...which brings us neatly back to Beaumont. Look, Jules, judging him like he’s a 21st-century CEO who forgot to check his ESG scores is precisely the trap we warn undergrads about. He doubled the average wage for his child workers! Built that schoolhouse! In the absolute cesspool of 1820s Manchester, surrounded by mill owners working infants sixteen hours a day in literal filth, he was practically a saint. Holding him to *our* standard of ‘abolish child labour entirely’ is… well, it’s anachronistic score-settling. What matters is his position *within* his own context.

  **Jules:** (Stirring cold coffee) Okay, but *whose* context, Marta? That’s the rub. You say "the standards of the time," like it was this monolithic thing everyone signed off on. It wasn't. Beaumont lobbied aggressively against the *very* proposals put forward by the likes of Robert Owen, by the nascent unions, by horrified clergy and, crucially, by parents whose kids were being broken in those mills. Their standards *were* the 1820s standards too! Calling Beaumont "generous" because he was better than the worst offenders? That’s like praising a thief for only stealing half your silver.

  **Marta:** Hang on. You’re cherry-picking the most progressive voices. The *dominant* economic logic, the legal framework, the social acceptance – it all tilted heavily towards child labour being necessary, even benign, for families and the nation. Beaumont operated within that system. He pushed its boundaries towards benevolence *as he understood it*. Calling him a hypocrite because he didn’t leap to Owen’s radical position ignores the institutional and intellectual constraints binding him. He genuinely believed, like most of his class, that banning child labour would impoverish families and cripple industry. His "generosity" was his way of mitigating harm *within* that belief system. Condemning him for not sharing *our* belief system feels… Whiggish. Smug.

  **Jules:** I’m not condemning him personally for lacking a crystal ball. But let’s talk about this "constraint." Isn’t your approach inherently creating a… let’s call it a "grading curve" for morality? The further back we go, the lower the bar drops. If Beaumont lived in, say, ancient Rome, owning slaves but treating them slightly better than average, would we call him "progressive"? By your contextual logic, maybe. But identical acts – say, profiting from the coerced labour of the vulnerable – get judged more leniently *just* because they happened longer ago. That seems arbitrary, doesn’t it? Why does temporal distance grant ethical leniency?

  **Marta:** (Leans back, taps the table) Okay, point taken, the 'grading curve' is a worry. But think about medicine. A brilliant 1820s surgeon who didn’t wash his hands before operating – he wasn’t negligent by the scientific understanding *of his time*. Germ theory wasn’t established! We judge his skill based on the knowledge available to him. We explain the deaths from infection by the epistemic limitations, not by calling him a murderer. Why is moral understanding fundamentally different? Beaumont lacked the developed framework of universal human rights, the empirical data on long-term developmental harm, the very *concept* of childhood we have. He worked with the ethical toolkit he had.

  **Jules:** (Nodding slowly) Alright, the medical analogy is fair, up to a point. But here's the distinction, I think. Germ theory was genuinely unknown. The *suffering* of those children, however – the exhaustion, the injuries, the stunted lives – that wasn’t invisible. It was reported, protested, lamented *by contemporaries*. Owen saw it. The workers saw it. Parents saw it. The moral wrong wasn't epistemically hidden in the same way microbes were. The *justifications* for ignoring it – economic necessity, paternalism, social hierarchy – were ideological constructs Beaumont actively defended and benefited from. He *chose* to prioritize those justifications, lobbying against reforms that directly addressed the visible suffering. That feels different from a doctor simply lacking crucial knowledge.

  **Marta:** But Jules, *every* era has its ideological blind spots woven into its very fabric. We have ours right now, things future historians will gawk at. The point isn't to exonerate Beaumont of all criticism *within his own context* – we can absolutely say his lobbying was harmful *even then*, based on the arguments of his contemporaries. But the full-throated condemnation using *our* language of rights, our developed understanding of child psychology? That stops being history and starts being moral philosophy applied retroactively. Worse, it makes the historian’s job pointless. If we just stand on our 21st-century hill and shout "Bad!" at everything that doesn't measure up, what are we *explaining*? How did people think? Why did they act? How did change *actually* happen? Understanding Beaumont’s *relative* benevolence, his internal contradictions – the man who built a school but fought regulation – that helps us map the messy, uneven terrain of moral progress and resistance. If we just grade him 'F' by our standards, we learn nothing about the past except that it wasn’t the present.

  **Jules:** (Sighs, picks up a biscuit but doesn’t eat it) You’re right about the explaining part. That *is* the core job. And shouting "Bad!" is lazy history. But I worry the opposite is lazy too. Hiding behind "context" can become a way to avoid making *any* evaluative judgment, even ones contemporaries were making. It risks normalizing the dominant, oppressive ideologies of the past by constantly measuring individuals only against the *lowest* common denominator of their time. We *can* acknowledge that Beaumont alleviated suffering *within* a system he helped prop up. We can explain his paternalistic mindset. But shouldn’t we *also* be able to say, drawing on the moral arguments *already present* in his era, that his defense of that system, especially given his awareness of alternatives, was ethically flawed? Not by *our* lights alone, but by lights that existed *then*? Doesn’t that give us a more dynamic picture?

  **Marta:** It does… if we’re scrupulously careful about *which* contemporary lights we use. Choosing Owen over the average mill owner isn't a neutral act; it reflects *our* present values about who was morally correct. And yes, we can say his lobbying was flawed *by some 1820s standards*. But the weight we give that flaw, the language we use – it inevitably carries our present. The "grading curve" is real, Jules. Maybe the escape hatch isn't perfect, maybe we drag our present selves through it. But isn't the *attempt* to squeeze through, to see the world as *they* might have seen it, flawed as that vision is, still the only thing that separates history from just… present-day mythmaking with footnotes?

  **Jules:** (Smiles faintly) "Present-day mythmaking with footnotes." Harsh. Maybe the escape hatch is more like a tunnel we can only crawl partway through, dragging our own shadows with us. We never fully escape, but the *attempt* to see the other end… that’s where the explanation happens. Even if we can’t help judging the shadows we see down there.

  **Marta:** Exactly. So with Beaumont… we explain the schoolhouse *and* the lobbying pamphlets. We note the protests he ignored. We map the constraints. We avoid the easy A or F. And we accept that our judgment, however contextualized, will always be a conversation between his time and ours.

  **Jules:** (Raises his coffee cup slightly) A perpetually unresolved conversation. Another coffee? This one’s cold. And I need fuel to figure out how to teach Beaumont next week without either canonizing or burning him at the stake.

  **Marta:** (Chuckles) Please. And pass the biscuits. This presentism debate is exhausting. Even by 21st-century standards.
