  Below is a comprehensive design for your in-class game on diachronic rationality, structured into three rounds and a debrief. The game uses tokens (redeemable for raffle tickets) to simulate a money pump, choice-pricing reversals, and commitment devices. I'll specify exact parameters, sequences, and fixes for predictable issues.

  ---

  ### **Round 1: Elicitation ("Market Survey")**
  **Objective:** Elicit a choice/price reversal without alerting students to tension.  
  **Bets (matched expected value = 9 tokens):**  
  - **Bet A (safe):** 90% chance of 10 tokens, 10% chance of 0 tokens.  
  - **Bet B (risky):** 10% chance of 90 tokens, 90% chance of 0 tokens.  

  **Procedure:**  
  1. Distribute private response sheets.  
  2. **Part (a):** "Which bet do you prefer? ◯ Bet A ◯ Bet B"  
  3. **Part (b):** "If you owned this bet, what is the minimum price (in tokens) you would accept to sell it?"  
     - "Selling price for Bet A: ______ tokens"  
     - "Selling price for Bet B: ______ tokens"  

  **Predicted Reversal:**  
  - ≈40-60% will choose **Bet A** (certainty effect) but set a **higher selling price for Bet B** (possibility effect/exaggerated variance).  
  - *Why?* Choice captures risk aversion; pricing captures excitement of the long shot.  

  ---

  ### **Round 2: Trading Round (Money Pump in Action)**
  **Objective:** Pump a target student using sequential, private trades based on their Round 1 reversal.  
  **Setup:**  
  - Assign one student as the **arbitrageur** (Pat). Give Pat 50 tokens and tickets for Bets A/B.  
  - Other students start with **10 tokens** and **no bets**.  
  - Identify a **target student (Alex)** who:  
    - Chose Bet A over Bet B in Round 1,  
    - Priced Bet B > Bet A (e.g., P_B = 12, P_A = 8).  

  **Arbitrageur’s Script for Alex:**  
  *(Offers made sequentially and privately. Alex accepts/rejects each individually.)*  
  1. **Sell Bet B:** "I’ll sell you Bet B for (P_B - 1) tokens."  
     - *Rationale:* Alex accepts because price < P_B (gains 1 token surplus).  
  2. **Buy Bet B, Sell Bet A:** "I’ll trade your Bet B for Bet A if you pay me 1 token."  
     - *Rationale:* Alex chose A > B in Round 1, so they pay to upgrade (strict preference).  
  3. **Buy Bet A:** "I’ll buy Bet A from you for (P_A + 1) tokens."  
     - *Rationale:* Alex accepts because price > P_A (gains 1 token surplus).  

  **Result for Alex:**  
  - **Start:** 10 tokens, no bet.  
  - **End:** 10 tokens + (P_A - P_B) tokens, no bet.  
    *(e.g., 10 + (8 - 12) = 6 tokens — a 4-token loss)*  
  - **Arbitrageur’s profit:** (P_B - P_A) - 1 tokens (e.g., 12 - 8 - 1 = 3 tokens).  

  **Key Rules:**  
  - **Sequential/Private Offers:** Offers must be made one-on-one, in sequence.  
  - **Why Bundle Offers Kill the Pump:** If Pat offered trades simultaneously (e.g., "Trade B for A plus a fee"), Alex would see the net loss and refuse. Sequentiality exploits myopic preferences.  

  ---

  ### **Round 3: Commitment Round (Diachronic Inconsistency)**  
  **Objective:** Contrast naive vs. sophisticated responses to time inconsistency.  
  **Setup:**  
  - Each student receives **1 token** upfront.  
  - **Choice:**  
    - **Option 1 (Commit):** Pay 1 token now to bind yourself to receiving **10 tokens at the end of class**.  
    - **Option 2 (Delay Choice):** Keep the token. At the **end of the session**, choose between:  
      - 5 tokens immediately, or  
      - 10 tokens at the *very end* (5 minutes later).  

  **Predicted Behavior:**  
  - **Sophisticates (≈30%):** Foresee choosing 5 tokens later (present bias), pay to commit to 10.  
  - **Naives (≈40%):** Keep the token, then choose 5 tokens at decision time.  
  - **Time-Consistent (≈30%):** Keep the token, choose 10 later.  

  **Why It Works:**  
  - Immediate reward (5 tokens) is tempting at T=end, but undesirable at T=start.  
  - Commitment device tests foresight of time inconsistency.  

  ---

  ### **Debrief: Mapping to Formal Concepts**  
  1. **Round 1 (Elicitation):**  
     - **Violation:** Choice (A ≻ B) vs. pricing (B ≻ₚ A) reveals a **synchronic intransitivity**.  
     - **Formal Link:** Violates the **axiom of extensionality** (preferences should be invariant to elicitation). Not a logical error, but a failure of the economic model.  

  2. **Round 2 (Trading):**  
     - **Violation:** The money pump exploits **acyclicity violations** (A≻B but B≻ₚA enables cyclic trades).  
     - **Formal Link:** Highlights **exploitability ≠ irrationality** — pumps reveal vulnerability, not logical failure.  

  3. **Round 3 (Commitment):**  
     - **Violation:** Naives exhibit **diachronic inconsistency** (reversal from T=start to T=end).  
     - **Formal Link:** Sophisticates use **self-binding** to align with long-term goals (Strotz’s resolution).  

  **Escape Hatches & Rebuttals:**  
  | Escape Hatch                          | Arbitrageur’s Round 2 Actions Rebut? |  
  |---------------------------------------|--------------------------------------|  
  | "Pump shows exploitability, not irrationality." | **Leaves standing** (Pump doesn’t prove illogic; it proves vulnerability). |  
  | "Refusing all trades is rational."    | **Rebuts** (Sequential offers force myopic choices; refusal rejects rational gains). |  
  | "Pairwise choices ≠ coherent preferences." | **Rebuts** (The reversal was pre-revealed in Round 1; trades use that data). |  

  ---

  ### **Candid Predictions & Fixes**  
  **Predictable Problems:**  
  1. **Too few reversals in Round 1:**  
     - *Why:* EV-matched bets may not trigger strong reversal.  
     - **Fix:** Use more extreme probabilities (e.g., Bet A: 95% chance of 10 tokens; Bet B: 5% chance of 190 tokens). Pre-test with a poll.  

  2. **Participants catch on during Round 2:**  
     - *Why:* Seeing Pat profit alerts others; Alex may refuse trades mid-pump.  
     - **Fix:** Run Round 2 with **one pre-selected Alex** (use Round 1 data to pick a reversal-prone student). Isolate trades in a side room.  

  3. **Arbitrageur botches the sequence:**  
     - *Why:* Complex script; pressure to perform.  
     - **Fix:** Assign Pat **cheat sheets** with exact dialogue. Use a rehearsed student or TA.  

  **Unreproducible Element (Requires Lecture):**  
  - **The Stakes Problem:** Losing tokens to a classmate feels trivial, undermining the "exploitation" intuition. Real pumps work when losses compound (e.g., repeated pumping to bankruptcy).  
    - **Lecture Supplement:** Emphasize that token losses *represent* exploitable preferences under high stakes. Use examples like insurance markets or addiction.  
  - **Indifference vs. Strict Preference:** The game uses **strict preferences** (Alex pays to trade), but classic pumps exploit indifference (e.g., trading up for "free").  
    - **Lecture Clarification:** Explain that strict preferences make pumps *more* damning—indifference just speeds up exploitation.  

  ---

  This design makes money pumps viscerally felt, links rounds to theory, and preempts implementation pitfalls. Use the raffle (e.g., 100 tokens = 1 raffle ticket for a $20 gift card) to incentivize engagement!
