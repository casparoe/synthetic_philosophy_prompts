answer: |-
  ### Midterm Essay Question: Arrow's Theorem and Escape Routes (20 Marks)  

  **Question:**  
  Arrow’s Impossibility Theorem is often summarized as proving "no voting system is perfect," but this gloss risks obscuring its technical and philosophical stakes. Evaluate two proposed escape routes from the theorem:  
  1. **Domain Restriction:** Limiting voter preferences to *single-peaked* profiles.  
  2. **Hybrid Rule:** The "triad rule" (invented by a classmate):  
     - If a Condorcet winner exists, rank it first and rank remaining alternatives by pairwise majority.  
     - If no Condorcet winner exists, rank all alternatives by Borda scores.  

  For **each escape route**:  
  (a) Identify which of Arrow’s five conditions (Rationality, Universal Domain, Pareto, Non-dictatorship, IIA) is *relaxed or transformed*.  
  (b) Argue whether this relaxation is a *substantive concession* (i.e., compromises democratic ideals) or a *technical dodge* (i.e., practically tolerable).  

  For the **triad rule specifically**:  
  (c) Construct a preference profile with ≥3 alternatives where the *absence/presence of an irrelevant alternative* flips the social ranking of two other alternatives *only when Borda is used*. Prove the violation.  

  Finally:  
  (d) Briefly discuss whether Arrow’s theorem—properly interpreted—threatens democratic legitimacy. Do its conditions (especially IIA) reflect a *controversial view* of what a social ordering should accomplish?  

  *(600 words maximum. Answers exceeding the limit will be penalized.)*  

  ---

  ### Model Answer (600 words)  

  **1. Domain Restriction to Single-Peaked Preferences**  
  (a) **Condition relaxed**: *Universal Domain* (UD). Single-peakedness restricts allowable preferences to those alignable on a single dimension (e.g., left-right spectrum), violating UD’s requirement that the SWF handle *all* logically possible preferences.  
  (b) **Substantive concession**: This is a **substantive concession**. While empirically plausible in some contexts (e.g., ideological voting), it excludes legitimate preferences (e.g., a voter ranking extremists over moderates). Democratically, it imposes *external constraints* on voter expression to achieve coherence, prioritizing stability over autonomy.  

  **2. The Triad Rule**  
  (a) **Condition relaxed**: *Independence of Irrelevant Alternatives* (IIA). The triad rule violates IIA because the social ranking between alternatives can change based on the introduction/removal of non-winning alternatives (via Borda fallback), even when individual preferences over the relevant pairs are unchanged.  
  (b) **Technical dodge vs. concession**: This is a **technical dodge**. While IIA is relaxed, the rule "muddles through" by substituting Borda when cycles occur. However, since IIA ensures voting outcomes are not manipulable by spoilers, its violation is democratically risky, making the rule vulnerable to strategic nomination.  

  (c) **Counterexample with irrelevant alternative**:  
  Consider a profile with 3 voters and alternatives {A,B,C}:  
  - Voter 1: A ≻ B ≻ C  
  - Voter 2: B ≻ C ≻ A  
  - Voter 3: C ≻ A ≻ B  
  No Condorcet winner exists (A>B 2-1, B>C 2-1, C>A 2-1 → cycle). Borda scores: A=4, B=4, C=1 → tie. Now add an irrelevant alternative D ranked *last* by all voters:  
  - Voter 1: A ≻ B ≻ C ≻ D  
  - Voter 2: B ≻ C ≻ A ≻ D  
  - Voter 3: C ≻ A ≻ B ≻ D  
  Borda scores (3,2,1,0): A=6, B=7, C=5, D=0. Social order: B ≻ A ≻ C ≻ D.  
  **Violation**: Though no one changed preferences over {A,B,C}, the relative ranking of A and B *flipped* (tied originally, now B≻A) due to D’s presence. IIA is violated.  

  **3. Democratic Legitimacy and Arrow’s Conditions**  
  Arrow’s theorem is **not a threat to democratic legitimacy** when properly interpreted. Its "impossibility" arises from demanding that SWFs satisfy *all five conditions simultaneously*—a technical, not normative, constraint. Crucially, **IIA smuggles in a controversial view** of social choice. IIA requires that social rankings depend *only* on individual ordinal rankings over pairs, ignoring preference intensities or context. This assumes a "proceduralist" view of aggregation (voting as a ranking machine), ignoring deliberative or welfare-based democratic aims. For instance, societies may accept Borda’s sensitivity to intensity or approve voting that incorporates cardinal utility. Thus, Arrow’s theorem exposes trade-offs in designing aggregation rules but does not condemn democracy *per se*; it questions whether an *ordinalist, IIA-bound SWF* is the right model for collective will.  

  ---

  ### Marking Scheme (20 Marks Total)  
  | **Criteria**                                                                 | **Marks** | **A vs. B Differentiation**                                                                 | **Common Mistakes**                                  |  
  |------------------------------------------------------------------------------|-----------|--------------------------------------------------------------------------------------------|-----------------------------------------------------|  
  | **Single-peaked: Correct condition (UD) & justification**                    | 3         | **A:** Explicitly names UD + explains restriction excludes valid preferences. **B:** Names UD but vague on why it matters. | Misidentifying condition (e.g., citing IIA).        |  
  | **Single-peaked: Substantive vs. technical assessment**                      | 2         | **A:** Argues substantive concession w/democratic costs. **B:** Calls it technical without nuance. | Calls it "merely technical" ignoring autonomy loss. |  
  | **Triad rule: Correct condition (IIA) & justification**                      | 3         | **A:** Names IIA + notes Borda’s role in violation. **B:** Names IIA but links poorly to rule. | Confuses with Rationality/Pareto.                   |  
  | **Triad rule: Substantive vs. technical assessment**                         | 2         | **A:** Notes IIA violation enables strategic nomination. **B:** Only labels it "technical." | Claims "no cost" ignoring manipulability.           |  
  | **Counterexample: Clean profile + Borda flip proof**                         | 4         | **A:** Minimal working example (3+ voters) with clear scores. **B:** Flawed/overcomplex example. | Spoilers affecting Condorcet step; incorrect Borda math. |  
  | **Counterexample: Correct IIA violation demonstration**                      | 2         | **A:** Shows pair flipped *only* due to irrelevant alternative. **B:** Incomplete comparison. | Fails to show unchanged preferences over core pair.  |  
  | **Democracy: Rejects threat + critiques IIA’s assumptions**                  | 4         | **A:** Distinguishes technical vs. normative; critiques IIA’s ordinalism. **B:** Superficial "no threat" without engaging IIA. | Assumes IIA is essential for legitimacy.            |  

  **Note:** A answers (18–20) excel in precision, counterexample construction, and philosophical nuance. B answers (15–17) cover basics but lack depth in assessing concessions or IIA critique.
