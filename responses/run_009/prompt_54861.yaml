  ### Diagnostic Handout: The Absent-Minded Driver Problem  
  **For a Graduate Seminar in Decision Theory**  

  **Preamble**:  
  You are a driver on a motorway at night. You will pass two identical exits but cannot distinguish them. At each exit, you must decide simultaneously whether to exit or continue. Payoffs:  
  - Exit at first exit: 0  
  - Exit at second exit: 4  
  - Continue past both: 1  
  You commit to a single mixed strategy: continue with probability \(p\) at every intersection. The ex ante optimal plan is \(p = 2/3\), yielding expected payoff \(4/3\). However, at the second intersection, exiting (payoff 4) dominates continuing (payoff 1). This handout maps your reasoning about what the driver should do and what the case reveals about decision theory. Follow the tree from the top. Answer each question based on your intuition.  

  ---

  #### Decision Tree  
  **Start**: Accept the problem as described (payoffs, identical exits, single mixed strategy).  

  1. **At an intersection, can the driver assign a well-defined, non-trivial probability of being at the first exit?**  
     - **No** → **Leaf A: Hard Scepticism**  
       *Label*: Problem Ill-Posed.  
       *Bullet to bite*: The problem must be rejected—no coherent prior or updating procedure exists for self-locating uncertainty in identical states.  
     - **Yes** → Proceed to 2.  

  2. **What primarily fixes the probability of being at the first exit?**  
     - **The ex ante plan (p) and motorway structure** → Proceed to 3.  
     - **The driver’s current inclination (p) as evidence of past actions** → Proceed to 4.  

  3. **Does the ex ante plan (e.g., \(p = 2/3\)) retain rational authority at the intersection?**  
     - **Yes** → **Leaf B: Ex Ante Optimisation**  
       *Label*: Planning Solution.  
       *Bullet to bite*: The driver must ignore their updated belief that exiting is better at the second exit, adhering rigidly to the pre-commitment.  
     - **No** → **Leaf C: Sophisticated Choice**  
       *Label*: Multi-Selves Equilibrium.  
       *Bullet to bite*: The driver recalculates \(p\) at the intersection but must accept that deviation destroys the ex ante optimum, potentially justifying \(p = 0\) or \(p = 1\) (e.g., "always exit" for certainty of 0 or 4).  

  4. **Is the driver’s current inclination (p) merely a cause of future actions, or also evidence about the past?**  
     - **Only a cause (no evidential weight)** → **Leaf D: Updateless Policy**  
       *Label*: Policy-First Treatment.  
       *Bullet to bite*: The driver ignores self-referential evidence (e.g., "planning to continue suggests I did so before") and uses \(p = 2/3\), but must deny that intentions inform self-location.  
     - **Also evidence (updates self-location)** → Proceed to 5.  

  5. **Must the driver’s action at both intersections be identical by necessity of the problem?**  
     - **Yes (identical by description)** → **Leaf E: Evidentialist Optimisation**  
       *Label*: Evidentialist Treatment.  
       *Bullet to bite*: The driver sets \(p\) to balance evidence and payoffs (e.g., \(p \approx 1/2\)), biting that this yields suboptimal ex ante payoffs.  
     - **No (could differ in principle)** → **Leaf F: Positional Refinement**  
       *Label*: Unstable Hybrid View.  
       *Bullet to bite*: The driver treats intersections asymmetrically (e.g., "exit if likely second"), but must explain how this is possible given identical information. *Note: This combination is unexplored and may be incoherent under the problem’s constraints.*  

  ---

  #### Notes on the Tree  
  - **Unoccupied Leaves**:  
    - *Leaf F (Positional Refinement)*: Unexplored. The problem’s symmetry forbids differing advice, making this view unstable.  
  - **Indistinguishable Leaves**:  
    - *Leaf B (Planning) and Leaf D (Updateless)* both endorse \(p = 2/3\), but diverge on whether beliefs should update at the intersection. The tree cannot separate these based on actions alone—philosophical commitments differ.  
  - **Key Distinctions Covered**:  
    - Well-defined probability (Q1), evidence vs. cause (Q4), ex ante authority (Q3), and symmetric advice (Q5).  

  **British English Note**: "Optimisation" replaces "optimization"; "motorway" used throughout.  

  ---
  **Purpose**: This diagnostic isolates how you *reason*—not which solution you recall. Reflect on your path to identify your decision-theoretic leanings.
