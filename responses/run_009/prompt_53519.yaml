prompt: |-
  I'm reading a popular book on climate economics, and its chapter on discounting summarizes the debate like this: discounting is the view that a person born in 2100 matters less than a person born today simply because of her birthdate; Ramsey showed in the 1920s that this kind of pure time preference is ethically indefensible, so the only reasons economists still use positive discount rates are impatience and the risk of human extinction; Stern used a near-zero rate and therefore concluded we should act aggressively on climate change, while Nordhaus used a high rate and therefore concluded we needn't; and since any positive rate means future people's welfare counts for less merely because it comes later, the whole apparatus is morally arbitrary, and choosing a rate is really just choosing how much you care about your grandchildren. Something about this chapter struck me as too tidy -- it reads like the author is using Stern vs. Nordhaus as a morality play. Is the summary fair? Go claim by claim: which parts would an economist or philosopher working on discounting accept, which conflate distinct things the literature keeps apart (I suspect the discount rate and pure time preference are not the same notion, but I'm not sure), and after your corrections, how much of the Stern/Nordhaus contrast and the moral-arbitrariness conclusion survives?
reasoning: |-
  Okay, the user is reading a book on climate economics that presents discounting as a morality play between Stern and Nordhaus. They're questioning whether the summary is fair and want a detailed breakdown. Let me start by recalling the key claims in the chapter: pure time preference is ethically indefensible, discount rates are only justified by impatience and extinction risk, Stern's near-zero rate leads to aggressive action, Nordhaus's higher rate leads to less action, and any positive rate is morally arbitrary. 

  First, I need to address the conflation between discount rate and pure time preference. The book seems to equate them, but they're distinct. The Ramsey equation shows that discount rate includes pure time preference (δ), elasticity of marginal utility (η), and consumption growth (g). Pure time preference (δ) is the part Ramsey criticized, but other components like η and g aren't about discounting future people just because they're born later. So the book oversimplifies by conflating these.

  Next, Ramsey's ethical indefensibility. He did argue against δ on moral grounds, but economists include it for practical reasons like impatience or uncertainty. The book mentions impatience and extinction risk, but there are other factors like catastrophic risks or model uncertainty. Also, some philosophers like Parfit challenge the ethical stance against δ, so it's not universally accepted.

  The Stern-Nordhaus contrast: Stern used a near-zero δ and low η, leading to high climate action costs. Nordhaus used higher δ and η, resulting in lower costs. The book frames this as a moral choice, but their differences also stem from η and g projections. Nordhaus might argue his rate reflects actual savings behavior, not just morality. So the dichotomy is oversimplified.

  On moral arbitrariness: a positive discount rate isn't solely about valuing future people less. Components like η account for diminishing marginal utility if future generations are richer. Plus, not discounting could overburden the present. The book's claim that choosing a rate is just choosing how much you care about grandkids ignores these nuances. There are non-arbitrary reasons for discounting beyond pure time preference.

  The user might be looking for a balanced view to understand the ethical and economic complexities. They suspect the author is pushing a narrative, which is valid. The morality play framing overlooks technical aspects and legitimate disagreements. The user might need this clarity for academic or personal understanding, possibly to form an informed opinion on climate policy. 

  After corrections, the Stern-Nordhaus contrast survives as a real policy disagreement, but it's not purely moral. Their rate choices involve empirical and normative differences. The moral arbitrariness conclusion is weakened because discounting has defensible components. Still, the choice of δ remains ethically charged, especially when it involves intergenerational equity. So the debate is more nuanced than the book presents.
answer: |-
  Your instincts are spot-on. The summary is a **significant oversimplification** that conflates key concepts and frames the Stern/Nordhaus debate too narrowly as a simple morality play. While it captures popular polemics, it misrepresents the technical depth and legitimate disagreements within the field. Let's break it down claim by claim:

  1.  **"Discounting is the view that a person born in 2100 matters less than a person born today simply because of her birthdate."**
      *   **Problematic:** This is a common *caricature*, not a precise definition. Discounting applies to *utility* or *consumption*, not directly to the moral worth of persons.
      *   **Correction:** Discounting reflects how society values *incremental benefits or costs* occurring at different points in time. A positive discount rate means:
          *   A unit of consumption (or utility) today is valued more highly than an *identical* unit of consumption in the future.
          *   This *can imply* that welfare improvements for future people are valued less than identical improvements for present people, but the primary focus is on the flow of consumption/utility over time, not the inherent moral worth of individuals.
      *   **Economist/Philosopher View:** Most would reject this phrasing as misleading. Discounting deals with the *intertemporal valuation of goods/well-being*, not the intrinsic value of persons. Philosophers debate whether discounting utility itself is ethically defensible.

  2.  **"Ramsey showed... pure time preference is ethically indefensible..."**
      *   **Mostly Accepted:** Frank Ramsey (1928) explicitly argued that discounting future utility *solely because it occurs later in time* ("pure time preference," denoted as δ) is "ethically indefensible" and arises "from the weakness of the imagination." This is a foundational *ethical critique*.
      *   **Economist/Philosopher View:** Philosophers (especially following Derek Parfit) largely agree. *Many* economists acknowledge the ethical force of this argument *in theory*. However, they argue practical considerations (impatience, uncertainty) necessitate incorporating some form of time preference into models.

  3.  **"...the only reasons economists still use positive discount rates are impatience and the risk of human extinction."**
      *   **Incomplete & Conflated:** This is the **core conflation** you suspected. It ignores the crucial distinction within the *Ramsey Equation*:
          `r = δ + η * g`
          *   `r`: Social Discount Rate (SDR)
          *   `δ`: Pure Rate of Time Preference (PRTP) - discounting future *utility* just because it's later (Ramsey's target).
          *   `η`: Elasticity of Marginal Utility of Consumption - measures how much the value of an extra unit of consumption decreases as consumption increases (diminishing marginal utility).
          *   `g`: Expected growth rate of per capita consumption.
      *   **Reasons for Positive `r` (beyond impatience/extinction):**
          *   **Opportunity Cost (`η * g`):** The dominant justification for many economists. If future generations are expected to be richer (`g > 0`), an extra unit of consumption will be worth *less* to them due to diminishing marginal utility (`η > 0`). Therefore, investing resources today to yield returns that benefit the richer future might be less efficient than consuming/investing for the poorer present. `η * g` reflects this "wealth-based" discounting, distinct from pure time preference (`δ`). Nordhaus heavily emphasizes this.
          *   **Catastrophic Risk & Model Uncertainty:** Broader than just extinction; includes risks of civilizational collapse, unforeseen technological/social changes, or massive errors in long-run projections. This uncertainty justifies a higher `r` to reflect the increasing chance that future benefits won't materialize *as predicted*.
          *   **Empirical Observation of Impatience (`δ`):** While ethically questioned, many economists argue that observed behavior (savings rates, market interest rates) reveals societal impatience (`δ > 0`), and policy should reflect revealed preferences (Nordhaus's view).
          *   **Administrative/Decision-Making Horizon:** Practical limitations exist.
      *   **Economist/Philosopher View:** Economists strongly reject the claim that only impatience/extinction justify `r > 0`. `η * g` is a primary, distinct, and widely accepted reason grounded in welfare economics. Philosophers debate the ethical implications of `η * g`, but recognize it's conceptually different from `δ`.

  4.  **"Stern used a near-zero rate... Nordhaus used a high rate..."**
      *   **Oversimplified but Factual (at the `r` level):** Yes, Stern (2006) derived a very low SDR (`r ≈ 1.4%`) primarily by setting `δ ≈ 0` (based on Ramsey's ethics) and using a low `η (≈ 1)`. Nordhaus (e.g., DICE model) used a higher SDR (`r ≈ 4-6%` in early versions, lower in later ones) by setting `δ ≈ 1-1.5%` (reflecting impatience/market rates) and a higher `η (≈ 1.5-2)`.
      *   **The Conflation Problem:** Framing it *only* as "Stern low rate = good, Nordhaus high rate = bad" ignores *why* their rates differ. **The key normative disagreements are over `δ` and `η`, not just `r`.** Stern prioritized intergenerational equity (`δ=0`) and assumed less diminishing utility (`η=1`). Nordhaus prioritized consistency with observed savings behavior (`δ>0`) and used a higher `η` reflecting more diminishing utility. Their differing projections of future growth (`g`) also played a role.
      *   **Economist/Philosopher View:** The difference in *conclusions* (aggressive vs. gradual action) is real and driven primarily by their chosen discount rates. However, the *reasons* for the differing rates involve legitimate disputes over ethics (`δ`), economics (`η`, consistency with markets), and projections (`g`), not just a simple moral choice about caring for grandchildren. Nordhaus argues his parameters better reflect actual societal choices.

  5.  **"...since any positive rate means future people's welfare counts for less merely because it comes later... the whole apparatus is morally arbitrary..."**
      *   **False Premise & Overly Strong Conclusion:** The premise is false because of `η * g`. A positive `r` can arise *entirely* from `η > 0` and `g > 0`, even if `δ = 0`. This component doesn't devalue future welfare "merely because it comes later"; it devalues *incremental consumption* to richer people in the future *relative* to poorer people now. This is an argument about efficient resource allocation across time and heterogeneous welfare levels, not temporal discrimination per se.
      *   **Moral Arbitrariness?** While the *choice* of specific parameter values (`δ`, `η`) involves normative judgment and is highly controversial, labeling the "whole apparatus" as "morally arbitrary" is excessive.
          *   The `η * g` component has a strong theoretical foundation in welfare economics (diminishing marginal utility).
          *   Incorporating `δ > 0` has arguments based on empirical observation, risk, and (contested) philosophical defenses related to uncertainty about the future or the non-identity problem (Parfit).
          *   The *process* of choosing parameters involves complex ethical, economic, and empirical reasoning, even if consensus is impossible.
      *   **Economist/Philosopher View:** Many economists would argue the `η * g` component is non-arbitrary and economically necessary. Philosophers acknowledge the deep ethical challenges, particularly around `δ`, but recognize that `η * g` presents a different kind of argument. Most would agree that the *choice* of `δ` involves significant ethical judgment under uncertainty, bordering on arbitrariness in the absence of a universally accepted ethical theory for intergenerational justice.

  6.  **"...choosing a rate is really just choosing how much you care about your grandchildren."**
      *   **Misleading Caricature:** This reduces a complex technical and ethical debate involving opportunity cost, diminishing marginal utility, risk, uncertainty, and deep philosophical questions about obligations to the distant future into a simplistic emotional choice. It ignores the crucial roles of `η` and `g`.

  **What Survives the Corrections?**

  1.  **The Stern/Nordhaus Contrast:** The stark difference in their *recommended policy stringency and timing* survives. This difference is *primarily driven* by their differing choices for the discount rate components (`δ`, `η`), leading to vastly different valuations of future climate damages. The debate remains highly relevant.
  2.  **The Centrality of Discounting:** It remains the single most critical parameter in climate cost-benefit analysis, fundamentally shaping conclusions.
  3.  **The Ethical Controversy over `δ` (Pure Time Preference):** Ramsey's critique stands strong. The choice of `δ > 0` (especially for distant futures) remains deeply ethically contentious. Philosophers largely view it as unjustifiable discrimination based on temporal location. Economists using `δ > 0` typically appeal to practical necessity rather than ethical superiority.
  4.  **Moral Judgment is Involved:** While not *purely* arbitrary or *solely* about caring for grandchildren, choosing the parameters (`δ`, `η`) for long-term discounting involves unavoidable and profound **normative judgments** about intergenerational equity, the weight given to future welfare, the validity of observed market behavior as a guide, and the treatment of uncertainty. There is no purely "scientific" way to set these values.

  **Conclusion:** The book's summary is an oversimplified and polemical morality play. It conflates the discount rate (`r`) with pure time preference (`δ`), ignoring the crucial and distinct role of the wealth-based component (`η * g`). While the ethical challenge to `δ` is valid and central, the claim that `r > 0` *only* reflects impatience/extinction or *necessarily* means discounting future people "simply because of birthdate" is incorrect. The Stern/Nordhaus divergence is real and policy-significant, but stems from deeper disagreements over ethics (`δ`), economics (`η`, market consistency), and projections (`g`), not just a simple moral binary. The "moral arbitrariness" charge is strongest when applied to the choice of `δ`, but weaker when applied to the `η * g` component and the framework itself. Choosing discount parameters is fundamentally an exercise in normative judgment under deep uncertainty, not merely choosing affection levels for descendants.
