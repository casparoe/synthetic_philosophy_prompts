prompt: |-
  I'm the deputy director of a small evidence-review unit at a regional health authority. Every few weeks a coverage or procurement decision lands on our desk where someone — a clinician, a patient group, a manufacturer, our own modellers — insists the decision be delayed pending more evidence, and someone else insists the delay itself is costing lives or money. I want a standing procedure, not case-by-case judgment, that one of my analysts with master's-level statistics can run in half a day, and whose output will go to a coverage committee that distrusts black boxes, so every step needs to produce a reason the committee can check by hand.

  The anchor is a result I've only partially understood: Good's theorem, which I'm told shows that for an ideal Bayesian expected-utility maximizer, no observation can have negative expected value. If that's right, it sounds as though it licenses "always gather more evidence," which I distrust: I've watched delays do harm, and I've seen trials commissioned that everyone involved knew would not change the decision. So build the procedure so that it preserves what the theorem actually establishes, while being explicit about where its assumptions fail and the procedure has to say no, or hand the question back to a human being because what's left is a value judgment.

  The procedure should be a numbered sequence of questions, each with a short note on what counts as a sufficient answer and where the chain stops with "decide now" or "commission evidence." It must handle at least these hard cases explicitly: (a) evidence costs money and time — where in the sequence does the cost of information enter, given the theorem assumes it's free; (b) the prospective evidence cannot change the decision because the decision-maker will not or cannot act on it — a contract is signed, the committee has effectively pre-committed, the manufacturer will withdraw the product if a trial runs; (c) the act of gathering evidence changes the thing being studied — patients and clinicians know the trial is running and behave differently; (d) the numbers needed for an expected-value-of-information calculation don't exist — no agreed prior, no defensible estimate of the probability that the new evidence flips the decision — and the analyst must fall back on something structured rather than a bare guess. Say plainly which steps are judgment calls dressed up as arithmetic.

  Then run the procedure on three cases, a short paragraph each. First: whether to delay for eighteen months a coverage decision on a new cardiac device supported by one small trial, when the device is already in informal use at two hospitals in our region. Second: whether to fund a two-year outcomes study of an off-label use of an existing drug that a patient organization is campaigning to have covered immediately. Third: whether to commission a large trial of a screening program that our own modeller estimates has roughly a one-in-ten chance of changing the recommendation, at a cost about equal to the program's entire annual budget. I expect at least one case where the procedure returns "commission the evidence" and I won't like the answer, and at least one where it returns "decide now" against the campaigners — give those answers straight rather than smoothing them over.

  Finish with a brief section on what the procedure cannot do.

  Format: the procedure as a numbered list with concise parenthetical notes, then the three worked cases, then the limits section. Total length no more than 900 words.
reasoning: |-
  Okay, the user is the deputy director of an evidence-review unit at a regional health authority. They need a standing procedure to decide whether to delay decisions for more evidence or act now, avoiding case-by-case judgments. The key reference is Good's theorem, which suggests no observation has negative expected value, but they've seen delays cause harm and unnecessary trials. 

  The procedure must address real-world issues: evidence costs, situations where evidence can't change decisions, evidence altering behavior, and lack of data for calculations. It should be executable by an analyst with master's-level stats in half a day, and transparent for a skeptical committee. The output should clearly label judgment steps and stop with "decide now" or "commission evidence."

  Breaking down the requirements:
  - Need a numbered list of questions with clear pass/fail criteria.
  - Must handle four hard cases explicitly: (a) evidence costs, (b) evidence can't change decision, (c) evidence alters behavior, (d) missing data requiring fallbacks.
  - Three worked cases demonstrating real outputs, including unpopular answers.
  - Limits section under 900 words total.

  For the procedure design:
  - Start with feasibility checks to catch hopeless cases early (Steps 1-3).
  - Incorporate costs upfront since Good's theorem ignores them (Step 4).
  - Address evidence mutability (Step 5) and decision irreversibility (Step 6).
  - For EV calculations, allow structured fallbacks when priors are missing (Steps 7-8).
  - Force explicit judgment labeling ("Flagged Judgment" notes).
  - Output binary recommendations to avoid ambiguity.

  For the worked cases:
  - Cardiac device: Delay would cause harm since it's already in use informally, and evidence can't change reimbursement. Procedure says "decide now."
  - Off-label drug: High burden of disease and reversible decision, but need to handle evidence costs. EVOI likely positive, so "commission evidence" even if unpopular.
  - Screening trial: Low chance of changing decision and high cost. EVOI negative, so "decide now" against modellers.

  Limits section should note: Requires linear value assumptions, can't handle complex dynamics, depends on quality of inputs.

  The user's deeper needs:
  - Reducing emotional friction in high-stakes decisions.
  - Protecting analysts from pressure with a defensible process.
  - Exposing value judgments transparently.
  - Avoiding both reckless delays and harmful immediacy.

  The procedure meets these by front-loading feasibility, quantifying trade-offs, and forcing committee ownership of judgment calls.
answer: |-
  **Evidence-Gathering Decision Procedure**  
  *(Analyst completes sequentially; stop at first "Decide Now" or "Commission Evidence." "Flagged Judgment" steps require committee input.)*

  1.  **Will the evidence arrive too late for any possible decision?**  
      *Sufficient answer:* Evidence completion after decision deadline or product lifecycle.  
      *→ Stop: Decide Now.*

  2.  **Is the decision effectively irreversible?** (e.g., signed contract, manufacturer withdrawal threat, policy pre-commitment).  
      *Sufficient answer:* Documentation of binding constraint preventing future action regardless of evidence.  
      *→ Stop: Decide Now (Hard Case b).*

  3.  **Will gathering evidence directly alter outcomes?** (e.g., trial participation changes behavior, induces anxiety, disrupts care).  
      *Sufficient answer:* Documented mechanism (e.g., Hawthorne effect, protocol deviation risk). Quantify harm if possible.  
      *→ If net harm > 0: Decide Now (Hard Case c). Else proceed.*

  4.  **Is the cost of evidence (money + time delay) trivial vs. stakes?**  
      *Sufficient answer:* Evidence cost < 1% of annual program cost or QALYs at stake. Else: *Flagged Judgment*. Assign monetary/QALY cost of delay using health authority thresholds. Proceed (Hard Case a).

  5.  **Can the evidence realistically change the decision?**  
      *Sufficient answer:* Define "flip range" (e.g., ICER must cross $50K/QALY). Estimate prior probability evidence shifts estimate into flip range.  
      *→ If probability < 5% (judgment threshold): Decide Now. Else proceed (Hard Case d).*

  6.  **Is the expected value of perfect information (EVPI) positive?**  
      *Sufficient answer:* Use simple 2x2: (Probability of wrong decision * Cost of wrong decision) > Evidence cost. Cost of wrong decision = |Best outcome - Worst outcome|.  
      *→ If EVPI ≤ 0: Decide Now. Else proceed.*

  7.  **Is expected value of sample information (EVSI) > Evidence cost?**  
      *Sufficient answer:* If defensible prior exists: Standard EVSI calculation. Else (Hard Case d): EVSI ≈ EVPI * (1 - 1/√(planned sample size)). *Flagged Judgment* on sample size relevance.  
      *→ If EVSI > Cost: Commission Evidence. Else: Decide Now.*

  ---

  **Worked Cases**  

  1.  **Cardiac Device:** Already in informal use. Step 1: Evidence arrives after delay. Step 2: Irreversible? Withdrawal risk if trial runs (manufacturer hint) → **Decide Now**. *Justification: Delay risks access loss; evidence cannot alter binding contracts (Hard Case b).*  

  2.  **Off-Label Drug:** Patient group demands coverage. Step 1: Evidence timely. Step 2: Decision reversible (coverage can be amended). Step 3: Minimal behavior change (observational data). Step 4: Delay cost high (burden of disease). Step 5: Prior suggests 40% chance evidence flips decision (clinical equipoise). Step 6: EVPI high ($10M harm vs. $1M study). Step 7: Crude EVSI ≈ $4M > Cost → **Commission Evidence**. *Unpopular but justified: High EVSI outweighs delay costs. Committee must accept judgment on EVSI estimate.*  

  3.  **Screening Program Trial:** Modellers propose trial costing ≈ annual program budget. Step 1: Evidence timely. Step 2: Reversible. Step 3: Trial may alter screening uptake (Hard Case c) → Net harm? Assume negligible. Step 4: Cost massive (≈$2M). Step 5: 10% chance of flip (modeller input). Step 6: EVPI = (0.1 * $5M harm) = $500K < $2M cost → **Decide Now**. *Justification: Low EVPI cannot justify high cost. Overrules modellers.*  

  ---

  **Limits of the Procedure**  
  1.  **Ignores strategic dynamics:** Cannot model manufacturer gamesmanship or policy signaling.  
  2.  **Assumes linear value:** QALYs/money trade-offs may not capture societal values or equity concerns.  
  3.  **Requires threshold specification:** Relies on pre-agreed cost-effectiveness thresholds and "flip ranges."  
  4.  **Vulnerable to input bias:** Garbage-in-garbage-out risk in Steps 5-7; "Flagged Judgments" shift burden but don’t resolve disputes.  
  5.  **Short-term focus:** Does not account for long-term evidence ecosystem benefits (e.g., future applications).  

