answer: |-
  Right. So you’ve polished the machinery and think the gears turn cleaner than Truman’s crude hammer. A neat evasion, but no less lethal for its precision. You grant me the irrelevance of Japan’s suing for peace – good. But don’t mistake that for concession. Your candidate’s ‘discrimination’ is a sophistic veneer. He deliberately chose to kill specific named men. That is murder, dressed in legal opinions and proportionalist arithmetic. The civilian deaths being ‘merely’ foreseen? Irrelevant. When you set out to kill a man unjustly – and outside judicial combat or legitimate defence of life, it *is* unjust – the foreseen deaths clinging to that act are part of *your* bloody enterprise. You do not wash your hands by saying, ‘Ah, but *they* weren’t the bullseye!’ 

  And your committee’s ‘public standards’? Mere conventions, mutable as weather. My judgement isn’t ‘private philosophy’; it is the recognition of intrinsic moral truth – that intentionally killing the innocent is always, inexorably, evil. Your legal reviews are procedural fig leaves. To honour a man who institutionalised this practice, however tidily, is to declare that clever administration sanctifies wickedness. The university would become complicit, not merely in his past acts, but in the corruption of its own soul – teaching students that efficiency and legalistic cover trump the fundamental prohibition: Thou shalt not murder. Why defer to my conscience? Because truth isn't settled by committee vote or state decree. A polity that forgets that surrenders its claim to justice. Your rules are hollow if they license what is inherently vile. Proceed, if you dare.
