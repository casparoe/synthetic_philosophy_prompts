prompt: |-
  I'm a novelist, about two thirds through a book whose heroine, Maya, runs a food bank in a fading rust-belt town, and a big subplot is the deals she keeps getting offered by people whose values she can't stand — the town's casino company, the family that owns half the farmland and treats its workers terribly, and so on. I don't want Maya to come off as either a pushover or a prig, and I've realized I can't actually write her choices until I know what the real principle is, so I've been road-testing my own gut on real cases and writing down the verdicts. Here they are. A wildlife charity co-running a peatland restoration with a grouse-shooting estate that still burns heather — the charity never says a word about the shooting, they just share the work: fine, even good, that's just gains from trade and I'd think more of them for it. Same charity, but now the estate's owner offers to be headline sponsor of their fundraising gala, logo on everything: not fine, and I feel quite firm about that, which is odd because its the same money from the same man. A vegetarian school cook buying from the town butcher because he's the only supplier who'll deliver before 7am, even though he gets to put "proud supplier to the school" on his van: fine, mostly. A city councillor who campaigned against gambling voting for a budget that includes lottery money for the parks, after her amendment to strip it out fails: I think fine, though I wobble. A climate campaigner signing a joint statement with an oil-workers' union, including some "we stand with workers in the industry" language she'd never say off duty: fine. And a friend of mine who writes fiercely anti-consumerist essays but pays her rent ghostwriting ad copy: not fine, though I want to like her, and Maya happens to have a cousin in exactly that spot.

  So what principle, if any, captures all that? I can half see one — something about not lending your endorsement, as opposed to just trading with people — but it seems to fall appart between the gala (not fine) and the butcher's van (fine), since in both the other party gets to use a bit of warm glow from association with the good guys for their own image. And the case I keep going back and forth on, which Maya faces in chapter nine, so I genuinely need an answer: the casino offers the food bank a large no-strings donation through a donor-advised fund, no banner, no logo, nothing public at all — the money is every bit as usefull as the sponsored kind, it just doesn't cost them any reputation. If you can give me a principle, or two candidates, tell me which of my gut verdicts each one has to overturn, and what it predicts for the anonymous case and for one or two situations I haven't thought of — say, Maya accepting a seat on the casino's "community foundation" board, where she'd have real say over how the grants get spent. It's fine to tell me some of my verdicts are just mood; I'd much rather find out now than in the reviews.
reasoning: |-
  Okay, the user is a novelist grappling with a moral dilemma in their book. They've presented several real-life scenarios where their protagonist, Maya, has to decide whether to accept help from ethically questionable sources. The core issue is defining a principle that distinguishes acceptable compromises from unacceptable ones, without making Maya seem either weak or self-righteous.

  Hmm, the user has clearly put a lot of thought into this. They've tested their own instincts against various cases and are now seeking a coherent ethical framework. The anonymous casino donation case in chapter nine seems particularly urgent since it directly affects the plot. 

  Let me analyze their examples first. The wildlife charity working with the grouse estate is fine to them, but sponsorship isn't. The vegetarian cook using the butcher is acceptable despite the van promotion, while the anti-consumerist friend ghostwriting ads isn't. There's a pattern here - it's about endorsement versus utility. But the butcher's van example complicates this since it involves some implied endorsement. Interesting that the oil workers union collaboration is acceptable despite the "standing with workers" language.

  The user's struggle with the councillor voting for lottery-funded parks suggests they recognize practical governance requires compromise, but feel uneasy. This tension between purity and effectiveness is exactly what Maya would face running a food bank in a struggling town.

  For the anonymous casino donation, my instinct aligns with the user's unstated preference - it should be acceptable. No public association, no endorsement, just resources for good work. The community board seat is trickier - it involves actual partnership. 

  The key distinction seems to be between transactional relationships (acceptable) and relationships that imply moral alignment (problematic). The butcher is transactional - he provides meat, gets paid, gets minor promotion. The gala sponsorship makes the charity appear aligned with the shooter's values. Ghostwriting ads directly creates the consumerist messages the writer opposes.

  I should propose two principles: one focused on endorsement (which explains most cases but fails on the butcher) and one on instrumentalization (which handles the butcher better). The endorsement principle would have to accept the ghostwriting as fine, which contradicts the user's instinct. The instrumentalization approach better matches their gut reactions, though requires accepting the grouse estate collaboration as problematic - but the user already feels uneasy about that one.

  For Maya's casino dilemma: anonymous donation = fine under both principles. Board seat = debatable but leaning no, as it creates ongoing association. Might be useful to show Maya wrestling with this exact tension - the board could help direct funds to good causes, but legitimizes the casino. Perfect moral dilemma for the novel!
answer: |-
  Here's a principle that captures your gut reactions remarkably well, along with a runner-up that explains the butcher's van exception:

  **The Core Principle: Avoid Becoming an Instrument of Legitimization for Harmful Practices**

  *   **What it means:** The crucial factor isn't the *transaction itself* or even the source of the money, but whether your *association* or *participation* actively helps normalize, validate, or provide social/political cover for the harmful activities or values you oppose. You become a tool ("instrument") used to make their harmful actions seem acceptable ("legitimization").

  **Applying the Principle to Your Cases:**

  1.  **Wildlife Charity & Grouse Estate (Co-Running Restoration):** **Fine.** The core activity (peatland restoration) is good. The estate gets practical help, the charity gets practical help. The charity isn't endorsing or validating the grouse shooting by quietly collaborating on a specific shared environmental goal. The legitimization of shooting happens elsewhere.
  2.  **Wildlife Charity & Grouse Estate (Gala Sponsorship):** **Not Fine.** The estate owner's logo prominently displayed at the charity's gala directly uses the charity's *reputation* and *moral standing* to legitimize *himself* and his *primary activity* (grouse shooting). It implies the charity approves of him/his business enough to let him be their public face for fundraising. He's instrumentalizing their good name to wash his own.
  3.  **Vegetarian Cook & Butcher (Delivery/Sign):** **Mostly Fine (Explained by Runner-Up Principle).** The cook *needs* delivery; the transaction is purely functional. The butcher's sign ("proud supplier") is weak legitimization. It suggests *he* is reliable/approved for *supply*, not that the school endorses his core business (meat) or practices. It's minor bragging rights, not a deep moral co-sign. *(Runner-Up Principle: Avoid Explicit Endorsement - This sign is borderline endorsement, explaining the "mostly fine" and not a full "fine")*
  4.  **Councillor & Lottery Budget:** **Fine.** The councillor fought to remove the tainted money (the amendment). Voting for the *overall budget* containing it after losing the fight is a pragmatic acceptance of political reality to fund essential services (parks). She hasn't endorsed the lottery; she's been outvoted. She avoids shutting down vital services just to make a purity point. Her opposition is already on record.
  5.  **Climate Campaigner & Oil Workers Union:** **Fine.** The *joint statement* serves a specific strategic purpose (e.g., building political pressure, showing worker solidarity for transition). The "stand with workers" language is political positioning, not an endorsement of the *oil industry's practices*. The campaigner isn't legitimizing fossil fuel extraction; she's acknowledging the human element to build a broader coalition for change. The union isn't using *her* to legitimize drilling; they're collaborating on a shared political goal (worker security in transition).
  6.  **Friend: Anti-Consumerist Essays / Ghostwriting Ads:** **Not Fine.** Here, your friend *directly creates the very tool of consumerism* (ad copy) she critiques. Her work *is* the instrument of legitimization and persuasion *for* the harmful practice (overconsumption). She's not just taking dirty money; she's actively producing the harmful content. Her essays lose credibility because her actions directly fuel the system she decries.

  **Why the "Endorsement" Idea Was Close But Not Quite:**

  Your initial thought about "not lending your endorsement" is adjacent but misses the nuance. The butcher *gets* an endorsement ("proud supplier"), yet it feels mostly acceptable. The core issue is the *degree and nature* of legitimization provided. The butcher's sign is a weak, functional endorsement. The gala sponsorship is a powerful, reputational endorsement.

  **The Anonymous Casino Donation (Chapter 9):**

  *   **Verdict (Using Legitimization Principle):** **FINE.**
  *   **Why:** No strings, no logo, no banner, no public association = **No Legitimization.** The casino gets zero reputational benefit. Maya isn't lending the food bank's good name to wash the casino's. The money is purely instrumental for the food bank's mission. Accepting it doesn't imply approval or normalize the casino's harmful impacts (gambling addiction, economic extraction). It's simply taking resources from a harmful entity *without* becoming their tool.

  **Maya Joining the Casino's "Community Foundation" Board:**

  *   **Verdict (Using Legitimization Principle):** **LIKELY NOT FINE, but context-dependent.**
  *   **Why:** This is a much closer call than the anonymous donation.
      *   **Problem:** By accepting a seat on *their* board, Maya becomes formally *associated* with the casino's philanthropic arm. Her presence on the board lends *her personal credibility and the food bank's implied moral standing* to the casino's attempt to legitimize itself as a "community partner" and "good citizen." She becomes part of the machinery they use to offset criticism ("Look, even Maya from the Food Bank works with us!"). Her "real say" comes at the cost of legitimizing the source.
      *   **Potential Mitigation:** *If* Maya could join and be a vocal, public *critic* from the inside, using the platform to expose casino harms while directing funds to good causes, it *might* be strategically defensible (though risky). However, boards usually require a degree of collegiality and non-disparagement. Her mere presence usually provides more cover than her internal influence is worth. It strongly risks instrumentalization.

  **Two New Situations (Predicted by the Principle):**

  1.  **Situation:** The exploitative farm family offers Maya a huge discount on surplus produce (imperfect but edible) for the food bank. They ask for no publicity.
      *   **Prediction (Legitimization Principle):** **FINE.** Transactional, private, no legitimization. Maya gets food for the needy without endorsing their labor practices.
  2.  **Situation:** The casino offers to build and fully fund a new, state-of-the-art food bank building, named "The [Casino Name] Community Food Hub," with prominent signage.
      *   **Prediction (Legitimization Principle):** **NOT FINE.** This is massive, permanent legitimization. The casino gets to visibly brand itself as the savior of the hungry, directly associating its name and primary identity with Maya's virtuous cause. The food bank becomes a monument to casino "generosity," instrumentalized to obscure the harm caused by gambling addiction.

  **In Summary:**

  Your gut reactions are largely consistent with the principle of **avoiding becoming an instrument of legitimization for harmful practices.** This principle values pragmatic resource acquisition for the core mission *unless* that acquisition actively helps normalize or validate the harmful actor's primary activities through association, endorsement, or co-option.

  *   **Overturned Verdict?** The principle slightly *strengthens* the case against the Grouse Estate co-run if one argues *any* association legitimizes, but your gut ("fine") and the principle allow for non-legitimizing practical collaboration. The Runner-Up ("Avoid Explicit Endorsement") explains the butcher's van.
  *   **Anonymous Donation:** Fine (No legitimization).
  *   **Community Board:** Leans strongly Not Fine (High legitimization risk).

  This principle gives Maya a clear, defensible line: Fight for resources fiercely, but guard her integrity and the food bank's moral authority by refusing to let them be used as a PR shield for the very forces harming her community. It avoids both pushover and prig, landing her firmly in the realm of the pragmatic idealist making tough, principled choices. Good luck with Chapter 9!
