answer: |-
  ## The Sand Grain Standoff

  **Setting:** A sterile university laboratory. A precise scale holds a glass dish containing exactly 10,000 grains of uniform sand. Dr. Aris Thorne (Epistemicist) and Prof. Lena Vale (Supervaluationist) observe intently. A lab technician, Kim, poised with tweezers, awaits instruction.

  **Kim:** Ready when you are. Just signal when you want me to start removing grains, one by one, and tell me when you think it stops being a heap.
  **Thorne:** (Nodding) Proceed, Kim. Lena and I will indicate our judgments as we observe. Remember, Lena, we agreed: signal the *first* moment you believe the pile ceases to be a heap.
  **Vale:** Agreed, Aris. Though I suspect our signals won't coincide neatly. Begin, Kim.

  *(Kim begins meticulously removing grains. Silence hangs for the first few hundred removals.)*

  **Vale:** (After grain 9,500 is removed) Still unquestionably a heap. Supertrue on any reasonable precisification of 'heap'.
  **Thorne:** Obviously. The cutoff is far lower. Its determinacy is absolute, just obscured. We *know* there’s a precise number N where N grains constitute a heap and N-1 do not. Our inability to pinpoint N isn’t evidence against its existence; it’s a consequence of the *margin for error* inherent in our perceptual and conceptual apparatus. Imagine trying to see the exact point a gradient shifts from black to white under dim light. The boundary is sharp, but your vision lacks the resolution to locate it precisely. That’s us with heaps.

  **Vale:** (Removing a grain brings it to 8,900) But Aris, your 'sharp boundary' forces an absurdity! Are we really to believe that removing *one specific grain* – say, grain number 5,273 – magically transmutes a heap into a non-heap? That’s counter to our fundamental linguistic intuition – tolerance. One grain can’t make that difference! My view captures that: for a range of cases – say, roughly between 1,000 and 200 grains here – the sentence "This is a heap" is *neither true nor false*. It’s indeterminate, vague. It’s true on some ways of making 'heap' precise (admissible precisifications), false on others. "Heap" simply doesn’t draw a sharp line in the world.

  **Thorne:** (Kim removes grain 8,000) Tolerance is a cognitive illusion, Lena, born of ignorance of the cutoff. We *treat* removals of one grain as irrelevant *because* we don’t know where the boundary is, not because there isn’t one. Your ‘indeterminacy’ just replaces one mystery with another. You say "true on all admissible precisifications" equals supertruth. But what *makes* a precisification 'admissible'? Isn't *that* notion itself vague? Surely there are borderline cases of what counts as an 'admissible' way to sharpen 'heap'. Doesn’t that just push the sharp boundary you abhor up a level, into the semantics of 'admissible precisification'? Where’s *its* sharp cutoff?

  **Vale:** (The pile is now at ~5,000 grains. Vale leans forward intently) Ah, higher-order vagueness! A fair challenge. But it doesn't *reintroduce* a sharp boundary; it *acknowledges* the inherent fuzziness all the way up. While 'admissible precisification' may be vague, the *supervaluationist framework* is designed to handle that iteratively. Crucially, my view avoids the *first-order* sharp boundary you posit. And look at the tolerance intuition preserved: for any pile that is *super*true heap (true on *all* precisifications), removing one grain *cannot* make it superfalse (false on *all* precisifications). It might become indeterminate, but never jump directly from supertrue to superfalse. That’s why I haven’t signaled yet – we’re still solidly in the range where it’s supertrue.

  **Thorne:** (Around 3,000 grains) But Lena, doesn’t your own machinery *demand* a sharp boundary for supertruth? Even if there's a spectrum of precisifications, the set of piles for which "Heap" is true on *every single one* of them must have a sharp boundary. Pile N grains: supertrue. Pile N-1 grains: fails on at least one precisification, so not supertrue. *That's* a sharp cutoff for supertruth! And what about *definitely*? On your view, "This is definitely a heap" presumably means it's supertrue, or true on all precisifications? If so, then "definitely a heap" and "a heap" must have *different* extensions – "a heap" includes the borderline cases where it's true on some precisifications, "definitely" does not. Doesn’t that mean there's a sharp boundary between the *definite* heaps and the borderline cases? You've just relocated my sharp boundary to the edge of the definite!

  **Vale:** (Watching Kim remove grain 1,500. Vale frowns) Not quite. "Definitely heap" corresponds to supertruth, yes. But "heap" *simpliciter* is true in a context only if it's true on the precisifications relevant *to that context*. The key is that there is *no single, context-independent sharp boundary* for the simple predicate "heap". Its extension shifts depending on the standards of precision in play. Your epistemicism forces one rigid, context-independent boundary. Mine allows for contextual flexibility. The sharp boundary for supertruth (definiteness) *in a fixed context* exists, but it's not the only semantic fact; the indeterminacy in the borderline region is real and meaningful. (The pile is now at ~800 grains. Vale raises a hand slightly) Kim, slow down... we’re approaching the zone. Aris, see how hesitation creeps in? That’s the phenomenology of vagueness your view dismisses as mere ignorance. It *feels* different not knowing *if* it’s true, compared to not knowing *where* the line is.

  **Thorne:** (Pile at ~600 grains) Phenomenology is a poor guide to metaphysics! The feeling of indeterminacy *is* the feeling of epistemic uncertainty about a precise fact. (He points decisively at ~400 grains) *There*. That’s it. Kim, stop. 400 grains remaining. That is no longer a heap. It’s just a small pile of sand. The boundary lies between 401 and 400 grains. I can't tell you *why* it's there, or prove it, but it *is* there. Your indeterminacy is just our unavoidable ignorance masquerading as semantic depth. What should Kim report? The number where it ceased – 400. The fact we can't know it for *sure* doesn't mean it didn't happen precisely. Your view encourages muddy thinking – "Oh, it's indeterminate, so we can't say anything."

  **Vale:** (Thorne signaled at 400. Vale signals slightly later, around 250 grains) No, Aris! Look! (Gestures at the pile around 350 grains) *This*? Is *this* clearly not a heap? And *that* (pointing back to 410 grains) clearly was? That’s arbitrary! Kim, at Aris’s 400, it was *indeterminate*. Neither determinately heap nor determinately not-heap. Supertruth vanished earlier, around... perhaps 1000 grains? But superfalsity only sets in much later. (To Thorne) What Kim should report is *indeterminacy* for a range. Saying "400 grains" pretends to a precision that doesn’t exist in the concept. My view doesn't preclude reporting; it demands we report honestly: "At 10,000, definitely a heap. By 1000, no longer definitely a heap. By 250, definitely not a heap. Between 1000 and 250, indeterminate." That captures the reality of the concept’s application. Reporting "400" is profoundly misleading.

  **Thorne:** Reporting a range *admits* sharp boundaries, Lena! Between definite heap and indeterminate? Sharp boundary. Between indeterminate and definite non-heap? Sharp boundary. You have *two* sharp boundaries where I have one! At least mine is honest about the core predicate. Your 'indeterminacy' is a semantic fiction that collapses under its own higher-order vagueness when pressed. Kim should report the point *they* judge it ceased, based on their best understanding, acknowledging the inherent uncertainty but affirming the underlying precision.

  **Vale:** And your ‘inherent uncertainty’ is an epistemological fiction obscuring a semantic fact! The core predicate *lacks* the precision you attribute to it. The ‘uncertainty’ *is* the semantic feature. Higher-order vagueness isn’t a collapse; it’s the inevitable consequence of the phenomenon. We don’t report sharp cutoffs because there *are* none for the predicate itself in normal contexts.

  *(Both turn to Kim, who has been watching the exchange with a mixture of fascination and bewilderment. The pile sits at 250 grains.)*

  **Kim:** So... what number do I write down? Or... what do I say?

  **Thorne:** (Firmly) The number where it first ceased to be a heap. 400.
  **Vale:** (Equally firm) Report the range of indeterminacy: ceased being definitely a heap around 1000 grains, became definitely not a heap around 250. And note the indeterminacy in between.
  **Kim:** (Sighs, looks back and forth between the philosophers and the sand) Right. Okay. I'll... note both opinions. And the sand.

  **(The dialogue ends unresolved, but the crux is exposed):**

  *   **The Fundamental Divide:** The core disagreement is ontological vs. semantic. Thorne (Epistemicist) insists vagueness is solely a matter of **ignorance**; there *is* a precise, mind-independent fact about the cutoff for "heap," but we cannot know it due to cognitive limitations. Vale (Supervaluationist) insists vagueness is a **semantic feature** of language itself; the concept "heap" is inherently imprecise, lacking a single sharp boundary, and indeterminacy is a real status, not just lack of knowledge.
  *   **Where They Pressed Each Other:** Thorne effectively challenged Supervaluationism’s ability to handle higher-order vagueness without smuggling in sharp boundaries for key meta-concepts like "admissible precisification" or "supertruth." Vale effectively challenged Epistemicism’s counter-intuitive consequence of tolerance violation and its dismissal of the phenomenology of vagueness as mere ignorance.
  *   **Concessions:** Thorne conceded that higher-order vagueness poses a *challenge* to cleanly defining "definitely," though he sees it as a problem *for* Supervaluationism. Vale conceded that *within a fixed context*, supertruth has a sharp boundary (for definiteness), but argued this is different from and less problematic than a sharp boundary for the core predicate itself across all contexts.
  *   **The Impasse for the Experiment:** The disagreement about reporting perfectly mirrors their theoretical clash. Thorne demands reporting a specific number (acknowledging uncertainty but affirming underlying precision), seeing indeterminacy as evasion. Vale demands reporting indeterminacy (acknowledging semantic imprecision), seeing a specific number as false precision. Their inability to agree on what Kim should say reflects the irreconcilable nature of their views on what vagueness *is*. The sand remains, the grains are counted, but the philosophers see fundamentally different realities in its arrangement.
