  For the exit strategy: the most defensible move is rejecting linear aggregation in premise (2). We can preserve "shut up and multiply" for visible cases while arguing that microscopic probabilities require different handling - perhaps through variance-sensitivity or epistemic modesty. The cost is introducing complexity, but it beats nihilism or nematode tyranny.

  Empirical updates that could shift this: finding that insect nociception triggers non-conscious reflexes (supporting nonlinearity) or discovering true sentience markers (enabling nonzero-but-tiny probabilities). Alternatively, formal work showing expected value fails at scale extremes.

