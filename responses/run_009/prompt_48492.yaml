answer: |-
  Let's dissect this rigorously. Your housemate's argument is structurally valid but rests on contestable premises. Here's the breakdown:

  **Premise (1): Nonzero Probability of Sentience**  
  *Status:* **Mostly defensible, but misapplied.**  
  - Why it seems true: We lack a consensual, non-arbitrary neural correlate of sentience. Rejecting all cutoffs (neuron count, centralization, etc.) is reasonable based on current neuroscience.  
  - **Problem:** "Cannot put probability at exactly zero" ≠ "Must assign a *meaningful* nonzero probability." Epistemic humility allows assigning *vague uncertainty* rather than precise probabilities to ill-defined hypotheses.  
  - **Cost of rejection:** Weakens "shut up and multiply" in clear-cut cases (e.g., mammal suffering).  
  - **Diagnosis:** Assigning precise probabilities to invertebrate sentience is *not* obligatory. You can model your uncertainty as *Knightian* (ambiguity) rather than probabilistic risk.

  **Premise (2): Linear Aggregation**  
  *Status:* **The core vulnerability.**  
  - Why it seems true: Total consequentialism often assumes linear aggregation (e.g., utilitarianism).  
  - **Problem:** Linearity assumes *welfare independence* and *additive separability*. This breaks down at scale for tiny probabilities:  
    - **Sensitivity to credence calibration:** A 0.001% vs. 0.00001% credence for nematodes (both "tiny") changes the moral sum by 100x, but these numbers lack empirical grounding.  
    - **Nonlinear weight functions:** Moral weight per unit of welfare might scale *sublinearly* with neural complexity (e.g., logarithmic). A nematode’s moment of suffering isn’t 1/100,000th of a chicken’s; it might be effectively zero if below a complexity threshold.  
  - **Cost of rejection:** Requires abandoning strict hedonistic utilitarianism for *some* non-linear aggregation (e.g., prioritarianism, capacity-weighted views).  
  - **Diagnosis:** Linear aggregation is a modeling choice, not a logical necessity. It fails when credences are arbitrary and scales extreme.

  **Premise (3): Numerical Domination**  
  *Status:* **Empirically true, but morally inert without (2).**  
  - Why it seems true: Biomass/numbers *do* explode downward (e.g., soil arthropods: 10^17 individuals vs. 10^10 chickens).  
  - **Problem:** Only threatens if you accept *both* linear aggregation *and* precise nonzero credences. Rejecting either defangs it.  
  - **Cost of rejection:** None. The numbers are facts, but their moral relevance depends on other premises.

  **Premise (4): Pervasiveness of Effects**  
  *Status:* **True, but scope-sensitive.**  
  - Why it seems true: Walking on grass *does* kill nematodes; driving *does* aerosolize insects.  
  - **Problem:** *Intentionality* and *predictability* matter. Crushing nematodes incidentally lacks the foreseen, avoidable harm of factory farming. Consequentialism often weights intended/high-probability effects more heavily.  
  - **Cost of rejection:** Risks excusing indirect harm (e.g., carbon emissions).  
  - **Diagnosis:** A red herring. If (2)-(3) fail, (4) doesn't force action.

  **Premise (5): Dominance of Micro-Creatures**  
  *Status:* **Conclusion, not premise. Depends on (1)-(4).**  
  - **Diagnosis:** If you reject linear aggregation (2) or precise credences (1), this evaporates.

  **Premise (6): The Trilemma**  
  *Status:* **False dichotomy.** There's a fourth option: **Reject the modeling assumptions.**  
  - Your moral uncertainty instinct is sound: Linearly pooling expected values *across* moral frameworks (e.g., if you’re only 60% confident in total consequentialism) compounds arbitrariness.  
  - **Better approach:** Use *variance-sensitive* decision rules (e.g., maximize *minimum* expected value, or downweight low-probability hypotheses with high uncertainty).  
  - **Cost:** Adds complexity, but avoids both nematode tyranny and Pascalian recklessness.

  ---

  **Your Escape Hatch:**  
  Reject **linear aggregation across extreme scales** (Premise 2). This preserves "shut up and multiply" for *comparable* cases (e.g., chicken vs. cow welfare) while blocking invertebrate domination.  
  - **Formalize it:** Adopt a **sublinear moral weight function** (e.g., weight ∝ log(neuron_count)) or a **credence threshold** (ignore probabilities below 1/N, where N is the decision's scale).  
  - **What you pay:** You commit to a non-utilitarian aggregation, but *only* for edge cases. "Shut up and multiply" remains intact for visible problems.

  ---

  **What Would Change My Mind?**  
  1. **Empirical:** Discovery of a sentience biomarker with a sharp cutoff (e.g., "glutamate receptors in clustered ganglia → p(sentience) > 0.99; else < 10^-10").  
  2. **Formal:** Proof that *any* non-linear aggregation violates uncontroversial decision axioms (e.g., leads to Dutch books).  
  3. **Moral:** Showing that *all* plausible non-consequentialist theories also demand nematode prioritization (unlikely).

  **Where I Could Be Wrong:**  
  - Underestimating the viability of moral uncertainty frameworks (e.g., if "Moral Parliament" models robustly handle tiny probabilities).  
  - Overconfidence in threshold models (e.g., if sentience is truly binary and we *must* assign precise credences).

  ---

  **Verdict:**  
  The argument is **unsound** due to Premise (2). Linear aggregation is not rationally compulsory for microscopic entities with nebulous sentience probabilities. You can reject nematode domination *without* abandoning expected value in core cases or embracing vibes-based discounting. Prioritize reducing vertebrate suffering and systemic risks—your moral arithmetic holds.
