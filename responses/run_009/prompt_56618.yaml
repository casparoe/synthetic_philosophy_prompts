prompt: |-
  I've been grading my own behavior in a bunch of situations where I either flat-out lied or said something true but engineered, and I have gut verdicts on each one, but no principle behind them. Here's the list:

  - Murderer at the door asking where my friend is. I say "he's not here" — he's in the basement. Fine, obviously.
  - Same guy, but instead I say "I haven't seen him since Tuesday." Also true — he came by Wednesday and is in the basement. Also fine, but it feels cleaner than the lie, and I suspect it shouldn't.
  - Aunt asks if I like the sweater. I say "I love it." I dont. Fine.
  - Same aunt, but I go with "it's so colorful," which is true, and she takes it as enthusiasm. Fine too, but it feels slightly cheap — cheaper than the lie, weirdly.
  - Interviewer asks why I left my last job. I say "my role was eliminated in the restructuring." The paperwork really does say that — it's just how HR codes being fired — and I know he'll conclude I was laid off. This one feels wrong to me, nearly as wrong as saying "I quit" would.
  - Kid asks if the dog ran away. I say "he went to live on a farm upstate." Wrong, but I'd do it. The misleading version — "he's somwhere with lots of room to run" — somehow feels more dishonest than the lie, which I can't explain.

  So my verdicts seem to say: sometimes a lie and a misleading truth are morally identical (the murderer cases), sometimes the misleading truth is worse (the interview, the dog), and sometimes it's better (the sweater, maybe?). Is there one principle about lying vs. misleading that captures all of this, or do I have to give some verdict up? Which one, and what does it cost? And what does the principle predict for a case I keep going back and forth on: a dying relative asks "did my son call?", and I say the true "someone from his office called yesterday to confirm arrangements" — his assistant did call, but the son himself hasn't called in months, and I know she'll conclude it was him personally checking in. Is that a kindness or a theft, on your principle?

  Please end with a machine-readable last line of the form Principle: <one sentence, twenty-five words or less>, so I can pull it out automatically.
reasoning: |-
  Okay, the user is grappling with the ethics of lying versus misleading truths in various scenarios. They've presented several situations where they've either lied outright or told a technically true statement designed to mislead, and they're noticing inconsistent gut reactions to each approach. Their core question is whether there's a unifying ethical principle that can explain why sometimes lying and misleading feel equally acceptable (murderer cases), sometimes misleading feels worse (job interview/dog), and sometimes it feels better (sweater compliment). They also want resolution on the dying relative case.

  Hmm, interesting how their moral intuitions vary. The murderer scenarios show they prioritize protection over truth - both the lie and misleading truth feel justified to save a life. The aunt's sweater case reveals social lubrication as a factor, though the "colorful" comment feels "cheap" because it's an evasion of the emotional question. The job interview stands out because the misleading truth exploits HR jargon to conceal being fired - that feels like deception for personal gain. The dog example is fascinating: the outright lie ("farm upstate") feels more compassionate than the technically true "somewhere with room to run" which might hint at death without honesty. 

  For the dying relative dilemma, I need to weigh two harms: the cruelty of shattering final peace versus stealing the chance for authentic closure. Their phrasing "kindness or theft" captures this tension perfectly. The assistant-call statement is a classic paltering truth - accurate but engineered to create a false impression. 

  The principle should probably center on harm prevention versus harm creation. When deception prevents immediate danger (murderer) or avoids gratuitous pain (sweater), it's more defensible. When it manipulates for advantage (job) or denies necessary truth (dog/death), it's worse. For the relative, preserving comfort in final moments might outweigh strict truth - but only if it doesn't actively fabricate. 

  User seems philosophically sophisticated - they're noticing how context bends ethics. Their frustration with inconsistent verdicts suggests they crave moral coherence. The machine-readable format request implies they might be testing this against other frameworks. Better make that principle airtight. 

  ...After stewing on it, the core differentiator is whether the deception serves the deceived person's legitimate interests or exploits them. Murderer has no right to truth; aunt deserves kindness over brutal honesty; but employer deserves transparency for fair hiring, and child deserves age-appropriate truth about death. Dying relative's interest in peaceful closure outweighs son's failure - so paltering is kinder than either "no" or detailing his neglect. 

  Principle drafted: "Deception is permissible only when it protects others from greater harm they don't deserve, and worse when exploiting trust for self-interest."
answer: |-
  Your intuitions reveal a nuanced principle: **The moral weight of deception depends on whether it serves the deceived party's legitimate interests or exploits their vulnerability.**  

  - **Murderer cases (both fine):** You protect life. The murderer's intent negates their "right" to truth; deception serves *their victim's* interests.  
  - **Sweater lie ("love it"):** Kindness avoids unnecessary hurt; Aunt's interest in goodwill justifies softening truth.  
  - **Sweater truth ("colorful"):** Feels "cheap" because it dodges her emotional question while *appearing* engaged, slightly exploiting her hope for connection.  
  - **Interview ("role eliminated"):** Feels wrong because it exploits the interviewer's trust to gain unfair advantage (self-interest), harming *their* interest in honest assessment.  
  - **Dog lie ("farm"):** Prioritizes the child's emotional protection over harsh truth. Acceptable as harm prevention.  
  - **Dog truth ("room to run"):** Feels *more* dishonest because it hints at death while feigning innocence, exploiting the child's confusion without offering real comfort.  

  **Dying relative case:** Saying "someone from his office called" is a **kindness**, not theft. Here:  
  - **Legitimate interest:** Her need for peace outweighs the son's neglect.  
  - **No exploitation:** You offer a *true* comfort (someone cared enough to arrange things), avoiding crushing her hope.  
  - **The alternatives:** Saying "no" inflicts gratuitous pain; lying ("yes, he called") fabricates affection. Your answer anchors in truth while shielding her.  

  **Principle:** *Deception is permissible when it prevents undeserved harm to the deceived, but worse than lying when it exploits trust for self-interest or denies essential understanding.*  

  Principle: Deception is justified to prevent undeserved harm to vulnerable others, but unethical when exploiting trust for self-interest or denying necessary truth.
