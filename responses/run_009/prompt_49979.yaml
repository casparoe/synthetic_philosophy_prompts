prompt: |-
  My friend Marcus and I have this running lunch debate. He's a backend guy, no philosophy or econ background either, but he went down a behavioral econ podcast rabbit hole a couple years ago and now fancies himself the office authority on when following the crowd is smart versus when it makes you a sheep ("sheep" is his word, he uses it alot). He literally keeps a list of verdicts and adds to it whenever a real-life case comes up. His rulings so far: joining the longer line at a taco truck you know nothing about, smart; buying the meme stock after it had already 10x'd and everyone on your feed was in it, dumb; going with Postgres for everything even though he admits some niche database beats it on the benchmarks he actually cares about, smart; bolting for the exit when two strangers near you suddenly sprint, smart; ignoring a handful of one-star reviews on a product with two thousand mostly positive ones, smart; panic-selling his index funds in March 2020 because everyone on TV was, dumb. He claims his rule is something like "follow the information, not the people," but I've stared at that sentence long enough to be pretty sure it doesn't actually explain everything on his list.

  Next week three new cases are coming up (long story — someone's raising them at a team retro of all places) and I want to predict him before he rules, partly to mess with him and partly because I genuinely can't: (1) buying an apartment in the neighborhood where prices jumped 40% after the big tech campus anouncement, (2) building his weekend side project in the framework that's suddenly everywhere, even though it's a throwaway and he's the only person who will ever touch the code, and (3) siding with the one senior engineer who dissents against what the other eleven people on the team all agreed on. What will he say on each of the three?

  Honestly I care less about the three answers than about the following: what rule is he actually running under the hood, what OTHER rules would fit his track record just as well, and which further case could I spring on him that would genuinely split those rules apart instead of all of them predicting the same thing. Bonus points if you can point at specific entries on his list that pull in different directions depending on which rule you read them through — like whether two strangers sprinting for the exit is the same kind of "smart" as Postgres, or something else entirely. I've tried making him sit down and derive his own rule from his own cases and he just accuses me of being a sheep about methodology, which, fair.
reasoning: |-
  Okay, the user and Marcus have this ongoing debate about when following the crowd is smart versus being a "sheep." Marcus has a list of examples where he's deemed certain actions as smart or dumb. The user wants to predict Marcus's rulings on three new cases and understand the underlying rule Marcus is using. They also want to know what other rules could explain his past decisions and find a case that would differentiate between these rules.

  First, I need to look at Marcus's past verdicts to identify patterns. Let me list them out:

  1. **Joining the longer line at a taco truck**: Smart. Implies that the longer line signals better quality, which is a rational inference.
  2. **Buying meme stock after it 10x'd**: Dumb. Following hype without information, likely buying high based on herd behavior.
  3. **Using Postgres for everything**: Smart. Even if niche databases perform better, the crowd's choice here offers reliability and support.
  4. **Bolting for the exit when strangers sprint**: Smart. Immediate danger signal, survival instinct.
  5. **Ignoring one-star reviews**: Smart. The overwhelming positive reviews outweigh the few negatives, suggesting the product is reliable.
  6. **Panic-selling index funds in March 2020**: Dumb. Emotional reaction to mass panic, not based on fundamentals.

  Marcus claims his rule is "follow the information, not the people." But the user feels this doesn't cover all cases. So, what's the deeper pattern?

  Looking at these, there's a mix of informational cascades (where actions convey information) and network effects. For example:
  - **Taco truck line**: The crowd's behavior provides information about quality.
  - **Postgres**: Network effects mean more resources, community support.
  - **Sprinting for exit**: Immediate physical signal of danger.
  - **Ignoring one-star reviews**: Statistical wisdom of the crowd.
    
  Conversely, meme stock and panic-selling involve emotional, irrational herding without new information.

  So Marcus's real rule might be about distinguishing between rational information aggregation and irrational herding. He values actions where the crowd's behavior reveals useful information or leverages network effects. Irrational herding is dismissed as "sheep" behavior.

  Now, predicting the new cases:

  1. **Buying an apartment post-price jump**: Prices increased due to a tech campus announcement. This reflects real demand, not just hype. Marcus would likely say **smart** because the crowd is responding to new information (tech campus), making it a rational move.
     
  2. **Building a side project in a trendy framework**: Even though it's a throwaway, using a popular framework could mean better documentation and tools. But since he's the only one using it, network effects don't matter. Marcus might see it as **smart** because it's low-risk and he might gain familiarity with a useful tool, or **dumb** if he thinks it's following hype without need. But given Postgres example, where network effects matter, here they don't apply. So probably **dumb** as it's unnecessary trend-following.

  3. **Siding with one dissenting senior engineer**: Eleven others agree, but the dissenter is senior. If the senior has more expertise, their dissent provides valuable information. Marcus would likely say **smart** because the dissent signals potential overlooked issues, especially from an expert.

  Alternative rules that fit the data:

  1. **Network Effects Rule**: Follow the crowd when it creates compounding advantages (e.g., Postgres support, taco truck info). Avoid when it doesn't (meme stock).
  2. **Information Cascade Rule**: Follow actions that reveal new info (taco line, exit bolting). Avoid when it's copying without info (panic-selling).
  3. **Expert vs. Crowd Rule**: Defer to experts (senior engineer) over the crowd. But this wasn't explicit in past cases.
     
  A test case to split these rules: **Choosing a restaurant with a long line in a tourist trap area**. 
  - If Marcus says **dumb**, it aligns with Network Effects (locals avoid it, so line doesn't indicate quality). 
  - If **smart**, it's pure Information Cascade (line signals popularity). 
  This challenges whether the crowd's behavior is genuine signal or noise.

  Specific examples pulling in different directions:
  - **Postgres vs. Taco Truck**: Both smart, but Postgres is about network effects, while taco truck is informational. Different mechanisms.
  - **Exit Bolting**: Survival instinct, not rational calculation. Differs from ignoring reviews, which is statistical.

  Marcus might not have a single rule but uses contextual judgment. Identifying when crowd behavior is informative versus irrational is key. The user can test with the tourist trap case to see which rule Marcus prioritizes.
answer: |-
  Based on Marcus's track record and his stated (but incomplete) "follow the information, not the people" rule, his *actual* operating principle appears to be:  
  **"Follow the crowd when it aggregates dispersed information or leverages network effects, but not when it amplifies irrational panic, hype, or social proof without substance."**  

  This explains his split between "smart" and "sheep" behaviors: he respects the crowd as an *information-processing mechanism* but rejects it as an *emotional contagion engine*.  

  ### Predictions for the New Cases:
  1. **Buying the apartment after the 40% price jump**:  
     **Marcus's Verdict: Smart**  
     *Why*: The crowd (real estate buyers) is responding to *new information* (tech campus announcement → future demand/shortage). This mirrors "joining the longer taco truck line" (crowd signals hidden quality) and contrasts with "panic-selling index funds" (crowd amplifies fear without new fundamentals).  

  2. **Building a side project in the trendy framework**:  
     **Marcus's Verdict: Dumb**  
     *Why*: No network effects or information aggregation here (he's the sole user, it's a throwaway). This is pure trend-chasing, like "buying the meme stock after 10x" (hype without utility). "Using Postgres" is smart because of ecosystem benefits (libraries, hiring pool); here, those benefits don't apply.  

  3. **Siding with the one dissenting senior engineer**:  
     **Marcus's Verdict: Smart**  
     *Why*: The dissent likely signals *unique information or expertise* (the senior's experience), making it analogous to "bolting for the exit when strangers sprint" (their action conveys urgent, localized info). Ignoring the majority here isn't "sheep" behavior because the crowd isn't adding value—it's suppressing signal.  

  ---

  ### Competing Rules That Fit His Track Record (and How They Conflict)
  Marcus's list is messy enough that multiple rules can "fit" the data. Here are alternatives, with their flaws and how they split on his cases:  

  1. **"Follow low-cost signals, flee high-cost dangers"**  
     - *Fits*: Taco line (low cost to switch lines), exit bolting (high cost of ignoring danger), ignoring one-star reviews (low cost of dismissing noise).  
     - *Fails*: Why is Postgres "smart" despite potential long-term costs? Why is meme stock "dumb" when the cost is low for some?  

  2. **"Defer to experts, ignore masses"**  
     - *Fits*: Siding with the senior engineer, ignoring panic-selling masses.  
     - *Fails*: Why follow the "non-expert" taco truck line? Why dismiss the one-star reviewers (who might be experts)?  

  3. **"Optimize for network effects"**  
     - *Fits*: Postgres (ecosystem advantages), ignoring one-star reviews (wisdom of crowds).  
     - *Fails*: Why is the meme stock dumb? (It had network effects!) Why bolt for the exit? (No network benefit.)  

  ---

  ### The Perfect Test Case to Split the Rules  
  **Scenario**: *Choosing a packed restaurant in a tourist-trap neighborhood. Locals avoid it, but the hour-long wait is full of excited visitors.*  

  - **Marcus's Likely Verdict**: **Dumb** (it's a tourist trap; the crowd is clueless).  
  - **Why it Splits the Rules**:  
    - Under his **actual rule** (information aggregation): The crowd isn't aggregating reliable info (tourists lack local knowledge). Verdict: *Dumb*.  
    - Under **"follow low-cost signals"**: Waiting an hour for food is high cost. Verdict: *Dumb*.  
    - Under **"defer to experts"**: Locals (= experts) avoid it. Verdict: *Dumb*.  
    - Under **"optimize for network effects"**: A busy restaurant might have better freshness/atmosphere. Verdict: *Smart*.  
    
  **But reverse it**: If the crowd is full of *locals* (e.g., you overhear them speaking the language), all rules converge on *smart*.  

  ---

  ### Key Tensions in Marcus's List  
  His cases pull in different directions under scrutiny. Two examples:  
  - **"Bolting for the exit" vs. "Ignoring one-star reviews"**:  
    - Both are "smart," but for opposite reasons. The exit sprint is a *high-urgency, low-context* signal (immediate danger). The reviews are a *low-urgency, high-context* signal (statistical noise). One is instinctive, the other analytical.  
  - **"Postgres for everything" vs. "Meme stock"**:  
    - Both involve following popular choices, but Postgres leverages *network effects* (community, tools, hiring), while the meme stock is *reflexive hype* (no underlying value creation). Marcus's rule distinguishes "adoption as infrastructure" vs. "adoption as mania."  

  Marcus likely can't derive a clean rule because his verdicts rely on **contextual intuition** (e.g., "Does the crowd have skin in the game?" or "Is this a coordination game?"). His "sheep" label is a snappier way to say "You're conflating *informational cascades* with *reputational cascades*."  

  Armed with this, you can corner him with the tourist-trap restaurant case. If he calls it "smart," accuse him of being a sheep for trend-chasers. If he calls it "dumb," ask why it’s different from the taco truck. Either way, you win the lunch debate. 🍜
