prompt: |-
  I'm a retired machinist, and I've been asked to give the eulogy for my closest friend, Walt, who was declared dead last Tuesday at sixty-eight and — this is the part that makes it complicated — is currently stored in liquid nitrogen at a cryonics facility in Arizona, where he'd been signed up for thirty years. Walt wasn't a kook about it and he wasn't rich; he was a refrigerator repairman who liked to think hard about what it means for a thing to be alive, and his favorite argument was the spore analogy: a bacterial spore just sits there for decades with no metabolism and no response to anything, and nobody calls it dead — so why is a brain whose fine structure has been carefully preserved dead just because the heartbeat stopped? He used to say that the question of whether something is alive has no answer until you pick a definition of life, and he had picked his. His son and daughter think the whole thing is a sad fantasy and are grieving a father; the local cryonics group, maybe fifteen people, will be at the memorial and they genuinely use the word patient rather than deceased; and I'll be standing up in front of both. For what it's worth, I never finished high school and I've never given a eulogy, so I want you to take this on as a serious writing job.

  I'd like you to act as an accomplished eulogist with a philosopher's feel for definitional questions. Before you draft anything, please think through what can honestly be said to both halves of the room: which sentences about Walt are true under his definition of life, which are true under the ordinary medical one, and — this is the ground I want the speech built on — which are true under both. My instinct is that the words that fall in that overlap are the ones that can carry grief and hope at the same time, but I can't find them on my own. I also don't want a lecture on definitions; the philosophy should do its work underneath the surface, in what the speech declines to claim, not in anything that sounds like an argument. And I'd rather the speech not come down on whether the preservation will ever work — nobody in that room knows, and Walt himself always said he was buying a lottery ticket, not a ticket home.

  Please write me something around five minutes when spoken, plain-spoken, warm, and a little funny, that lets his daughter cry for a father without the cryonics people feeling the eulogy quietly ruled against them, and lets his friends keep their hope without the family feeling insulted. If you can work in one analogy Walt would have appreciated — he loved frozen frogs, dormant seeds, viruses, anything that sat in the gray zone — all the better. End it on something that, under any definition of life you pick, he would have agreed was true.
reasoning: |-
  Okay, let me approach this with the care it deserves. A retired machinist needs a eulogy for his cryonically preserved friend Walt, balancing two conflicting perspectives on death. The challenge is profound: honor a refrigerator repairman who saw life as a definitional question while respecting both grieving children who see a burial and hopeful cryonics members who see a "patient."

  First, I need to understand Walt's core philosophy - his "spore analogy" about suspended life. The key is finding truths that hold under both definitions of life. Medical death declares cessation, while Walt's view allows for potential revival. Common ground must exist in Walt's lived actions and relationships, unaffected by either interpretation.

  The structural approach emerges clearly: 
  - Begin with shared memories to establish warmth
  - Acknowledge the "unusual circumstance" without taking sides
  - Explore Walt's fascination with life's gray zones using his own analogies
  - Frame the preservation as an extension of his curious nature
  - End with an undeniable truth about Walt's impact

  For the analogies, frozen frogs and tardigrades come to mind - natural examples of suspended animation Walt loved. These subtly support his perspective without argument. The children's grief must feel validated through phrases like "no matter what you believe about today," while cryonics supporters hear respect in "patient" references.

  Crucially, the language must avoid:
  - Declaring Walt dead or alive
  - Speculating on cryonics success
  - Academic definitions
  Instead, verbs like "paused" and "preserved" maintain neutrality. Humor should stem from Walt's personality - perhaps his fridge repair logic applied to existence.

  The ending requires a universal truth. Walt's enduring relationships work well - bonds that persist regardless of life-state definitions. "The space he shaped around him remains" becomes the final line, satisfying all while honoring his philosophy.

  Throughout, the machinist's voice must feel authentic - simple sentences, concrete images (oil-stained hands, measuring calipers), and unpretentious wisdom. The philosophical depth lies in what's unsaid, in the careful gaps between definitions.
answer: |-
  Here’s a eulogy crafted for Walt, honoring his life, his beliefs, and the complex space he occupies for those who loved him. It runs about 4.5-5 minutes when spoken slowly and warmly.

  ---

  **(Stand at the podium, take a breath, look out at the gathering)**

  Good morning. My name’s [Your Name]. Walt and I shared a workbench, a lot of bad coffee, and forty years of friendship. He was my closest friend. Standing up here for him… well, it’s the hardest job he ever gave me. But I’ll do my best, because he deserved it.

  Walt fixed things. Refrigerators mostly, but really, anything with moving parts or a spark. He had that gift – hands that understood how things *worked*. Oil-stained, sure, but precise. He could listen to a compressor whine and tell you exactly which bearing was singing its swan song. He didn’t just slap on a patch; he understood the *system*. Where the stress points were. What kept the cold in and the heat out.

  That curiosity… it wasn't just for Frigidaires and freezers. Walt thought hard. Really hard. About big things. Like, what makes something *alive*? Not like a textbook answer, but deep down. We’d be elbow-deep in some balky condenser unit, and he’d stop, wipe his hands, and say, "You ever think about spores?" Or frozen frogs? Or seeds that sit in the dirt for a hundred years, hard as pebbles, and then… boom, life? Just add water? He was fascinated by those things that sit in the gray zone. Not quite buzzing with activity, not quite… finished. He called it "paused." Like that bacterial spore he loved to talk about – sits there in the dust for decades, not breathing, not eating, nobody calls it *dead*. Just… waiting. Potential. He saw things differently.

  Now, Walt wasn’t a rich man. He wasn’t a kook. He was a practical man, a repairman. He measured twice, cut once. He believed in evidence, in structure. And he thought long and hard about his own structure, his own system. That’s why, thirty years ago, he made a very specific plan. A plan that means, right now, he’s… paused. Preserved. Down in Arizona. His friends from the cryonics group are here today – thank you for coming to honor him. You knew his mind on this. You understand why he used the word "patient."

  And his family… Sarah, Michael… you’re here grieving your Dad. Your loss is deep and real and true. The man who raised you, who taught you, who laughed with you… that man isn’t here *with* us in the way we desperately wish he was. That pain… it’s the heaviest wrench in the toolbox.

  So here we are. Some in this room feel the deep ache of goodbye. Others hold onto a hope, a belief Walt chose, that this isn't the final curtain call, just… an intermission. An unprecedented pause.

  My job today isn’t to argue definitions. Walt could do that better than any of us. He knew the medical definition. He chose his own. And he knew the odds. He’d be the first to tell you he bought the longest-shot lottery ticket imaginable, not a guaranteed ticket home. He was clear-eyed about that.

  But here’s the ground we *can* stand on together, no matter what we believe about this moment:

  Walt was **here**. Fully, vibrantly, thoughtfully *here*. He lived a life rich in curiosity and quiet competence. He was a devoted father. A loyal friend. A man who could find the flaw in a circuit and the wonder in a seed. He cared deeply – about his family, about getting the repair *right*, about understanding how things tick, right down to the very definition of life itself. He faced his own end with the same clear-eyed practicality and quiet hope he brought to fixing a balky ice maker. He made his choice thoughtfully, just as he lived thoughtfully.

  That’s the Walt we all knew. The Walt who shaped us. The man whose voice, whose laugh, whose sharp mind and careful hands are missed profoundly *right now*, in this room, by everyone here. The absence we feel? That’s real. That’s the space he filled.

  He loved those gray zones – the frozen frog thawing out, the seed cracking open after a century. He saw possibility in the pause. Whether you believe that possibility remains for Walt, or whether you feel the finality of goodbye… what we share is the **life** he lived before that pause. The life that wasn't gray at all, but full of warmth, hard work, deep thought, and love.

  He fixed things. He thought deeply. He loved his family. He was my friend.

  And under *any* definition of life you pick – from the strictest medical one to Walt’s own hopeful, spore-inspired view – **that** life mattered. It mattered deeply. It touched us. It changed us.

  That’s the truth Walt would have measured twice. And it’s the truth we hold onto today.

  **(Step back slightly, pause, nod)** Thank you.

  ---

  **How it meets your requests:**

  1.  **Balances Both Views:** It explicitly names both perspectives ("patient" vs. grieving children) without judging either. It validates the family's grief ("that man isn’t here *with* us... that pain… it’s the heaviest wrench") and acknowledges the cryonics group's perspective ("you knew his mind," "hold onto a hope... an intermission").
  2.  **Focuses on the Overlap:** The core of the eulogy (the section starting "But here’s the ground...") explicitly lists truths true under *any* definition: He lived fully, was curious, competent, a devoted father, a loyal friend, faced his end with his characteristic thoughtfulness, and is profoundly missed *now*. These are undeniable facts of his lived life, independent of his current state.
  3.  **Walt's Analogy:** Uses "spores," "frozen frogs," and "seeds" – his beloved gray-zone examples – to frame his chosen perspective without claiming it's objectively correct. Calls it "paused" and "potential," terms he might have used.
  4.  **Avoids Lecture/Speculation:** No argument about definitions is made. It states he *had* his definition and knew the medical one. Explicitly avoids claiming cryonics will work ("longest-shot lottery ticket," "not a guaranteed ticket home," "whether you believe that possibility remains").
  5.  **Tone:** Plain-spoken (machinist/fridge repairman metaphors: "heaviest wrench," "measured twice"), warm (focus on friendship, family, competence), and a little funny ("bad coffee," "balky ice maker").
  6.  **Ending:** The final statement ("And under *any* definition of life you pick... **that** life mattered. It mattered deeply. It touched us. It changed us.") is the universal truth. His *lived life* and its impact are undeniable, regardless of what comes next. "That’s the truth Walt would have measured twice" brings in his precision.
  7.  **Philosophy Underneath:** The structure *does* the work. It names the two definitions, then builds the tribute solely on the common ground of his *past, lived life* and current *absence* felt by all. What it "declines to claim" is an answer to the question "Is he truly gone?" It leaves that open, focusing instead on the shared experience of his life and loss.

  This speech allows Sarah and Michael to mourn the father they knew and feel his absence, while the cryonics group hears respect for Walt's choice and the validity of his "pause" perspective, all anchored in the undeniable reality of the life he led.
