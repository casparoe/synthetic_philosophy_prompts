answer: |-
  Here are the desiderata for an account of probability in Everettian quantum mechanics, structured to address your examiner's core challenge. Each requirement includes its rationale, negotiation status, and conflict analysis. The non-negotiables are empirically grounded; the rest risk importing single-world assumptions.

  ### **Desideratum 1: Privileging the Born Rule**  
  **Requirement**: The account must explain why agents should anticipate future experiences weighted by the *Born rule* (squared amplitudes) rather than branch counting or other measures.  
  **Case for it**:  
  - Empirical adequacy: Only Born weights align with observed statistics (e.g., Malus' law in polarizers, particle decay rates).  
  - Dynamical origin: Decoherence selects a branching structure where amplitudes (not branch count) govern interference suppression.  
  **Non-negotiable? YES**. Failure implies empirical inconsistency with quantum predictions.  
  **Cost of surrender**: Invalidation of quantum mechanics as an empirical theory.

  ### **Desideratum 2: Avoiding Circular Assumptions**  
  **Requirement**: Must justify probabilistic behavior *without presupposing* probability or decision theory. Can use rationality axioms but not Born rule itself.  
  **Case for it**:  
  - Circularity objection: If probability is *assumed*, Everettians haven’t explained its emergence.  
  - Foundational goal: A fundamental theory should derive norms (e.g., betting behavior) from physical ontology.  
  **Non-negotiable? DEBATABLE**.  
  - **Non-negotiable if**: Probability must be *derived from physics alone*.  
  - **Smuggles single-world if**: Demanding a "pre-measurement uncertainty" that only makes sense in collapse theories.  
  **Cost of surrender**: Weakens explanatory power but may retain empirical adequacy (e.g., via decision-theoretic derivations).

  ### **Desideratum 3: Handling One-Shot Events**  
  **Requirement**: Must explain what a rational agent should *expect* in a single measurement where all outcomes occur.  
  **Case for it**:  
  - Universality: Physics must guide agents in unique scenarios (e.g., Schrödinger’s cat, cosmological predictions).  
  - Subjective uncertainty: Agents report ignorance despite "all outcomes existing."  
  **Non-negotiable? YES, for applicability**.  
  - **Smuggles single-world if**: Equating "expectation" with *actual occurrence* rather than *first-person anticipation*.  
  **Cost of surrender**: Renders quantum mechanics inert for individual decisions.

  ### **Desideratum 4: Managing Future Selves**  
  **Requirement**: Must tell an agent why they should care *differently* about future selves seeing different outcomes.  
  **Case for it**:  
  - Actionability: Agents need a basis to prefer actions leading to "higher-weight" futures (e.g., avoiding quantum Russian roulette).  
  **Non-negotiable? YES, for coherence**.  
  - **Smuggles single-world if**: Demanding a "unique future self" to anticipate.  
  **Cost of surrender**: Undermines rational agency (e.g., indifference to survival in low-weight branches).

  ### **Desideratum 5: Branch-Granularity Independence**  
  **Requirement**: Probabilities must not depend on arbitrary choices of branch individuation.  
  **Case for it**:  
  - Decoherence: Defines branches via dynamically robust pointer states but with context-dependent coarse-graining.  
  - Objectivity: Physics can’t depend on subjective descriptions.  
  **Non-negotiable? YES**.  
  - **Risk**: If probabilities vary with fine-graining, Born rule becomes meaningless.  
  **Cost of surrender**: Relativism—no fact about probabilities.

  ### **Desideratum 6: Empirical Equivalence**  
  **Requirement**: Must reproduce *all* empirical predictions of collapse theories (e.g., frequencies in repeated trials).  
  **Case for it**:  
  - Scientific viability: Everett must agree with collapse where they overlap (e.g., double-slit patterns, Bell tests).  
  - Core promise of MWI: Same unitary formalism without collapses.  
  **Non-negotiable? ABSOLUTELY**. Failure falsifies Everett.  

  ---

  ### **Conflict Analysis & Trade-offs**  
  1. **Tension between Desiderata 2 and 3–4**:  
     - Deriving norms *without probabilistic assumptions* (D2) while explaining subjective uncertainty in one-shot cases (D3) is the hardest conflict.  
     - **Resolution**: If D2 is relaxed (allowing decision-theoretic axioms), D3–4 become tractable via self-locating uncertainty.  
     - **Cheapest surrender**: D2 (accepting non-circular axioms like rationality). Sacrificing D3–4 is costlier—abandons agency.  

  2. **Granularity (D5) vs. Born Rule (D1)**:  
     - Decoherence-based branches naturally respect D1 and D5 jointly—Born weights are additive under coarse-graining. No conflict.  

  3. **Empirical Equivalence (D6) is non-negotiable**:  
     - Violation implies Everett is empirically inadequate. All other desiderata serve this.  

  ---

  ### **The Non-Negotiable Core**  
  | Desideratum | Non-Negotiable? | Why |  
  |-------------|-----------------|-----|  
  | 1. Born Rule | **Yes** | Empirical adequacy |  
  | 3. One-Shot Expectation | **Yes** | Theory must guide action |  
  | 4. Future-Self Weighting | **Yes** | Rational agency |  
  | 5. Branch-Granularity Independence | **Yes** | Objectivity |  
  | 6. Empirical Equivalence | **Yes** | Scientific viability |  
  | 2. Non-Circular Foundations | **Conditional** | Can trade for agency-preserving axioms |  

  ### **Examiner Strategy**  
  - **Concede nothing** on D1, D5, D6: These are Everett’s strengths.  
  - **Defend D3–4** via subjective uncertainty: "All outcomes happen, but *I* will experience one with Born-weighted likelihood."  
  - **Address D2** candidly: Either justify non-probabilistic axioms (e.g., Wallace’s rationality constraints) or note that collapse theories *also* assume probability primitives.  

  The cheapest concession is **allowing non-circular decision-theoretic axioms** (D2) to preserve agency (D3–4). This maintains empirical parity (D6) while answering: "I *expect* to see outcome X with probability p because rational agents in my state *act as if* p is their credence." This meets all non-negotiable demands.
