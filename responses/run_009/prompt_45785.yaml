prompt: |-
  I'm a PhD student in health policy (dissertation on the ethics of scarce-resource allocation, heavy on the separateness of persons literature), and through a connection of my advisor I ended up with a seat on the ethics advisory panel of our regional health authority. The panel gets called in whenever there's a serious drug or equipment shortage, which lately is 3-4 times a year, and every single time we relitigate the same fight. Half the panel wants to just run the utilitarian arithmetic -- maximize total QALYs or lives saved, done -- and the other half keeps insisting that something is wrong with adding up claims across separate patients, that a bigger total doesn't automatically trump. Nobody on the panel knows this is a live debate in ethics going back decades (Nozick's side constraints, Taurek's 1977 paper on whether numbers should count, Scanlon's contractualism in What We Owe to Each Other), so the fights are loud and unproductive. The chair has asked me, since I "know the philosophy," to draft a decision procedure the panel can actually use.

  Here's what it needs to be. Something a group of clinicians and one lawyer can run in a 90-minute emergency meeting, with no philosophy background required: an ordered list of questions, what counts as a sufficient answer to each, and points at which the procedure halts and says either "aggregate, the numbers decide" or "stop, this is a case where the separateness of persons blocks pure aggregation" -- plus explicit spots where the procedure has to hand the question back to the panel as a values question it can't settle, since I don't want to smuggle my own view in as pseudo-procedure. My fear is that any simplification either collapses back into straight utilitarianism with extra steps, or becomes so hedged it never tells anyone anything. So I'd also want you to say which distinctions from the literature absolutely must survive the translation (I suspect the distinction between trade-offs within one life and trade-offs across lives is one, and maybe something like Scanlon's line about the relevance of numbers once harms are comparable, but I'm not sure) and which debates can safely be dropped for this purpose.

  Then run the procedure on three cases so I can see whether it actually works. Case one: we have 40 doses of a chemo drug; one late-stage patient needs the full 40-dose course for a modest extension of life, or we can split it to give 40 patients a partial course with meaningfully lower survival odds each. Case two: a single ECMO machine free up, two eligible patients, one a 25-year-old with better survival probability and one a 55-year-old with slightly worse odds and two young kids. Case three: a fixed annual budget line where we can either fund a wildly expensive gene therapy for one child or top up insulin supplies that will run out for a few hundred patients mid-year. For at least one of these, tell me honestly if the procedure gives an answer I'm going to hate -- I lean anti-aggregation, and I'd rather find out now than during an actual shortage. And please flag where the procedure will misfire or get gamed, and what it flatly cannot do.
reasoning: |-
  Hmm, the user is a PhD student in health policy focusing on ethics of scarce-resource allocation, particularly the separateness of persons literature. They're on an ethics advisory panel for a regional health authority and need to create a practical decision procedure for their panel to use during emergencies. The panel consists of clinicians and one lawyer, with no philosophy background, and they need something that can be run in 90 minutes.

  The user described recurring conflicts between utilitarian approaches (maximizing QALYs or lives saved) and those who believe aggregation across individuals is problematic. They want a structured procedure that can guide the panel to either aggregate or recognize when separateness of persons blocks aggregation, without imposing their own anti-aggregation views.

  Key requirements include: an ordered list of questions, clear stopping points, identification of values questions the procedure can't settle, and avoiding both utilitarian collapse and excessive hedging. They also want to know which philosophical distinctions must be preserved (e.g., within-life vs. across-life trade-offs, Scanlon's comparable harms point) and which can be dropped.

  The three test cases are:
  1. Chemo drug: 40 doses to one late-stage patient or split among 40 for partial courses.
  2. ECMO machine: young patient with better survival odds vs. older patient with worse odds but dependent children.
  3. Budget choice: expensive gene therapy for one child vs. insulin for hundreds.

  I should design a procedure that incorporates essential distinctions:
  - Within-life vs. across-life trade-offs (critical from Scanlon/Nozick)
  - Whether harms are comparable in kind (Scanlon's threshold for numbers mattering)
  - Imminence of harm vs. probabilistic benefits
  - Presence of special obligations or vulnerabilities

  The procedure needs to be flowchart-like with clear yes/no paths. It should start by asking if the resource can be divided without waste, then assess if trade-offs are within one life or across lives. For across lives, it should evaluate comparability of harm, then consider if numbers make a morally relevant difference (using Scanlon's principle that numbers matter when harms are comparable). It should also identify when impartial aggregation is blocked and flag values questions for panel discussion.

  For the test cases:
  1. Chemo case: likely leads to aggregation since harms are comparable (life-extension vs. survival odds), and numbers are large.
  2. ECMO case: probably stops at "no aggregation" due to non-comparable factors (age, dependents) and small numbers, requiring panel deliberation.
  3. Budget case: may aggregate toward insulin due to scale and comparable harms (death from lack of treatment), but might flag the "rescue" aspect of gene therapy as a values question.

  The user leans anti-aggregation, so the chemo case result might frustrate them, but the procedure should reflect that when harms are similar and numbers large, aggregation is hard to avoid. I need to be honest about where the procedure might misfire—like when non-medical factors (dependents) are introduced, which could be gamed, or when comparing prevention vs. rescue. It also can't handle non-quantifiable values like symbolic importance or long-term societal impact.
answer: |-
  Here's a procedural framework designed for operational use, preserving core philosophical distinctions while avoiding academic baggage. It prioritizes **tractability**, **transparency**, and **identifying true moral disagreements** rather than imposing a single "correct" answer. Key preserved distinctions:

  1.  **Within-Life vs. Across-Lives Trade-offs:** Central to separateness. Sacrifices *within* a life (e.g., side effects for cure) are treated differently from sacrifices *across* persons.
  2.  **Comparability of Harm:** Scanlon's crucial point. Aggregation becomes *more* defensible when harms are similar in kind and severity across individuals.
  3.  **Numbers and Thresholds:** Acknowledges that numbers *can* matter significantly when harms are comparable, but small differences shouldn't automatically trump strong individual claims.
  4.  **Imminence and Certainty:** Distinguishes immediate, certain harm from probabilistic or distant benefit.

  **The SEPARATE Decision Procedure Framework**
  *(For Scarce Emergency Resource Allocation)*

  **Goal:** Determine whether allocation can be resolved by aggregating benefits (e.g., QALYs, lives) or requires alternative principles due to the separateness of persons.

  **Instructions:** Answer questions sequentially. Stop at any "HALT" point. "FLAG" means the panel *must* deliberate explicitly on the identified values conflict.

  ---

  1.  **Resource Divisibility & Waste:**
      *   *Question:* Can the resource be physically divided and used effectively for multiple recipients without significant loss of efficacy or waste? (E.g., splitting drug doses vs. needing one whole machine).
      *   *Sufficient Answer:* Yes/No based on clinical/pharmacological evidence.
      *   *Action:*
          *   **YES:** Proceed to Question 2.
          *   **NO:** Allocation inherently involves choosing between individuals/groups. Proceed to Question 3.

  2.  **Single-Patient Optimization (If Resource Divisible):**
      *   *Question:* Is there a way to divide the resource that provides *some significant benefit* to each potential recipient *without* causing any recipient to be worse off than they would be under any alternative division? (I.e., Is there a "Pareto-optimal" division?).
      *   *Sufficient Answer:* Yes/No based on clinical outcome projections.
      *   *Action:*
          *   **YES:** **HALT - USE THIS DIVISION.** (No conflict; no one is sacrificed for aggregate gain).
          *   **NO:** Proceed to Question 3. (Dividing creates winners and losers *across* persons).

  3.  **Within-Life Trade-off?**
      *   *Question:* Does the decision involve redirecting resources *away from a single identified patient* who is *currently expecting or receiving* this specific resource (or an equivalent), solely to benefit *other* patients? (Focus: Is this about withdrawing/withholding from Patient A *for* Patients B, C, D...?).
      *   *Sufficient Answer:* Yes/No based on the clinical scenario description.
      *   *Action:*
          *   **YES:** **HALT - DO NOT AGGREGATE.** Redirecting resources away from an identified patient expecting them raises profound separateness concerns. Allocation should prioritize identified patient unless exceptional circumstances flagged below. *(Preserves Nozickian side constraints)* **FLAG:** Are there overwhelming, immediate catastrophic consequences for *many others* if the identified patient receives the resource? (Rare; requires explicit panel justification).
          *   **NO:** Proceed to Question 4. (Standard competition for newly scarce resource).

  4.  **Comparability of Harm/Benefit:**
      *   *Question:* Are the potential harms of *not* receiving the resource reasonably similar in *kind* and *severity* (e.g., high probability of death, significant irreversible disability) for the main groups under consideration? *Ignore scale (numbers) for now.*
      *   *Sufficient Answer:* Yes/No based on clinical prognosis data. Requires judgment on severity similarity.
      *   *Action:*
          *   **NO:** **HALT - DO NOT AGGREGATE.** Significant differences in the *nature* or *severity* of potential harm block simple aggregation. Proceed to alternative assessment (e.g., urgency, vulnerability, special obligations - Panel must decide principles). *(e.g., Death vs. temporary disability; imminent death vs. long-term risk reduction)*.
          *   **YES:** Proceed to Question 5. (Aggregation *may* be applicable).

  5.  **Scale & Magnitude Difference:**
      *   *Question A (Small Groups):* Are we choosing between a *small number* of individuals/groups (e.g., 1 vs 1, 1 vs 2, 2 vs 3)?
      *   *Sufficient Answer:* Define "small" (suggest < 5 per group). Yes/No.
      *   *Action:*
          *   **YES:** **HALT - DO NOT AGGREGATE.** At small numbers, the separateness of persons strongly suggests a lottery or tie-breaking based on non-aggregative factors (e.g., immediacy, prior wait time, reciprocity) is fairer than summing small advantages. *(Preserves Taurek's core intuition)*. Panel chooses tie-breaker.
          *   **NO (Large Groups):** Proceed to Question 5B.
      *   *Question 5B (Large Groups - Comparable Harm):* Is the difference in the *number* of people who would suffer comparable harm/benefit between the options *very large*? (e.g., 1 vs 10, 10 vs 100, not 5 vs 7).
      *   *Sufficient Answer:* Yes/No. Requires judgment on "very large". Consider ratio and absolute numbers.
      *   *Action:*
          *   **YES:** **HALT - AGGREGATE, NUMBERS DECIDE.** When harms are comparable and the number difference is large, the moral force of saving many from significant harm outweighs the separateness concern for aggregation in this context. *(Reflects Scanlon's concession to numbers)*. Use best estimate of aggregate benefit (e.g., lives, QALYs).
          *   **NO:** **FLAG - VALUES CONFLICT.** Harms are comparable, but the number difference is moderate (e.g., 1 vs 3, 10 vs 15). Philosophers genuinely disagree here. Panel must decide based on local values: Does the moderate number difference tip the scale, or do strong individual claims still dominate? **Explicit Vote Required.**

  6.  **Special Vulnerabilities / Obligations (Post-Halt/Flag Check):**
      *   *Scope:* Applicable after any "HALT - DO NOT AGGREGATE" or "FLAG" point, or if Question 4 was NO.
      *   *Question:* Are there compelling factors unrelated to aggregate benefit that require consideration? (e.g., extreme vulnerability - orphan disease patient with no alternatives; special obligation - frontline worker exposed serving community; exceptional social value - sole caregiver for many dependents; urgency - immediate death vs. weeks away).
      *   *Sufficient Answer:* Panel deliberation. Must be specific, exceptional, and justifiable under the health authority's mandate/values. *Avoid:* General social worth, age *alone*, vague "potential".
      *   *Action:* Panel deliberates and weighs these factors explicitly against the outcome of the procedure so far. **No Default Weighting.** Document rationale.

  ---

  **Applying the SEPARATE Procedure to Test Cases:**

  **Case 1: 40 Doses of Chemo Drug**
  *   **Q1 (Divisibility):** YES (doses can be split).
  *   **Q2 (Single-Patient Opt):** NO (Partial courses have "meaningfully lower survival odds" - so patients receiving partial courses are worse off than if one got full course).
  *   **Q3 (Within-Life Trade-off):** NO (Not withdrawing from an identified patient expecting it; allocating newly scarce resource).
  *   **Q4 (Comparability):** YES (Harm: Lower survival odds leading to premature death. Benefit: Modest life extension vs. chance of cure/longer survival. *Kind* is similar (avoiding death from cancer), *severity* is high for both (death), though *probability* differs).
  *   **Q5A (Small Groups):** NO (1 vs 40).
  *   **Q5B (Large Difference):** YES (1 vs 40 is very large difference).
  *   **HALT - AGGREGATE, NUMBERS DECIDE.** Allocate partial courses to 40 patients. *[This is likely the result you (anti-aggregation) will hate. The procedure sees comparable harms (death) and a massive numerical difference as decisive for aggregation.]*
  *   **Q6 (Special Factors):** Unlikely to override such a large numbers difference for comparable harm. Panel could discuss if the one patient has *zero* alternatives while the 40 have other options, or extreme vulnerability.

  **Case 2: One ECMO Machine - 25yo (better odds) vs 55yo (worse odds, 2 kids)**
  *   **Q1 (Divisibility):** NO (One machine).
  *   **Q3 (Within-Life Trade-off):** NO (Newly scarce resource).
  *   **Q4 (Comparability):** **NO.** *Harm:* Death for both. *Severity:* Identical. *BUT:* The presence of "two young kids" introduces a potential difference in the *kind* of harm - the harm of orphaning children. This makes the harms not *fully* comparable in kind. The survival probability difference also contributes to non-comparability if significant.
  *   **HALT - DO NOT AGGREGATE.** Simple QALY/life-summing blocked.
  *   **Q6 (Special Factors):** **CRITICAL FLAG.** Panel *must* now deliberate explicitly on:
      *   Should the survival probability difference be used? (Clinicians often favor this).
      *   Does the presence of dependent young children create a special obligation or constitute a significantly different harm justifying priority? (Highly contentious values question).
      *   Consider urgency/immediacy if different.
      *   Consider a lottery.
      *   *The procedure forces the values debate into the open here rather than hiding it behind aggregation.*

  **Case 3: Budget - Gene Therapy (1 child) vs. Insulin (Hundreds)**
  *   **Q1 (Divisibility):** YES (Money).
  *   **Q2 (Single-Patient Opt):** NO (Funding one necessarily withholds funding from others).
  *   **Q3 (Within-Life Trade-off):** NO (Budget allocation).
  *   **Q4 (Comparability):** **DEBATABLE / FLAG.** *Harm:* Death for both groups (assuming insulin-dependent diabetics will die without insulin). *Severity:* Identical. *BUT:* The gene therapy might offer a *cure* for a rare disease (preventing future harm) vs. the insulin being *maintenance* (preventing imminent harm). Is "preventing imminent certain death" (insulin) vs. "preventing future death *and* providing cure" (gene therapy) *comparable in kind*? Panel must judge if these are similar *harms being prevented*. (Likely leaning towards YES, harm=death, but nuance exists).
  *   *Assume Panel Answers Q4: YES (Comparable harm - death).*
  *   **Q5A (Small Groups):** NO (1 vs Hundreds).
  *   **Q5B (Large Difference):** YES (1 vs Hundreds is very large).
  *   **HALT - AGGREGATE, NUMBERS DECIDE.** Fund insulin. *[Again, result you may dislike, driven by scale and comparable harm.]*
  *   **Q6 (Special Factors):** **KEY FLAG POINT.** Panel *must* explicitly consider:
      *   **The "Rescue" Intuition:** Does saving the one identifiable child with a rare disease trigger a stronger obligation than saving statistical lives? (Core anti-aggregation point).
      *   **Rarity & No Alternatives:** Is this the *only* chance for this child anywhere, while insulin might have other funding avenues (even if difficult)?
      *   **Long-term vs. Short-term:** Does the cure offer vastly more *lifetime* benefit per person than the insulin maintenance? (This pushes back towards aggregation!).
      *   *The procedure forces the panel to confront the "rescue" vs. "numbers" values clash head-on here, even after aggregation is indicated.*

  **Where the Procedure Might Frustrate You (the Anti-Aggregationist):**
  1.  **Case 1 & 3 Results:** It explicitly endorses aggregation for large numbers under comparable harm (Scanlon's position). This directly contradicts strong Taurekian views. You'd prefer a "FLAG" or "NO AGG" here.
  2.  **Moderate Numbers (Q5B NO -> FLAG):** While it flags the conflict, it doesn't *presume* anti-aggregation wins. The panel could still vote for aggregation at 1 vs 3.
  3.  **"Comparability" (Q4) is a Choke Point:** If the panel consistently interprets "comparability" broadly (death=death), aggregation triggers more easily. A narrow view (only identical circumstances are comparable) blocks aggregation more often but might seem artificial.

  **Where the Procedure Can Misfire or Be Gamed:**
  1.  **Defining "Comparability" (Q4):** This is the most subjective step. A panel biased towards aggregation might downplay differences (e.g., "death is death" ignoring dependents in Case 2). A biased panel against aggregation might exaggerate minor differences. *Mitigation:* Require explicit listing of harm types/severities. Chair must ensure robust discussion.
  2.  **Defining "Very Large" Difference (Q5B):** Is 1 vs 10 "very large"? 5 vs 20? *Mitigation:* Pre-define thresholds if possible (e.g., ratio >1:5 AND absolute difference >5), but rigidity is also problematic. Chair guides based on magnitude.
  3.  **"Special Factors" (Q6) as a Loophole:** Panels could misuse Q6 to override clear procedural outcomes based on subjective preferences. *Mitigation:* Strict criteria: factors must be *exceptional*, *specific*, and *justifiable within mandate*. Require supermajority or strong consensus for override. Document exhaustively.
  4.  **Ignoring Uncertainty:** The procedure doesn't explicitly weight high-certainty small benefit vs. low-certainty large benefit. *Mitigation:* Incorporate probability into "Comparability" and "Aggregate Benefit" estimates. Clinicians must provide best estimates.
  5.  **"Within-Life" (Q3) Scope:** Defining "identified patient currently expecting" can be fuzzy (e.g., is a patient on a waiting list "expecting"?). *Mitigation:* Define narrowly: actively receiving treatment or has a confirmed imminent start date.

  **What the Procedure Cannot Do:**
  1.  **Resolve Deep Philosophical Disagreements:** It won't convince a committed utilitarian that separateness matters, or vice-versa. It *structures* the debate and reveals *which* disagreement is at play.
  2.  **Provide Mechanically "Correct" Answers in Hard Cases:** Especially at FLAG points (Q4 NO, Q5B NO, Q6) and Case 2, it outputs "Panel Must Decide Values."
  3.  **Incorporate Long-Term/Systemic Effects:** It focuses on immediate, direct harms/benefits to identifiable patients. Broader societal impacts (research incentives, equity) aren't directly addressed.
  4.  **Eliminate Discomfort:** Fair allocation of scarce life-saving resources will *always* feel morally fraught. The procedure makes the trade-offs explicit, not easy.
  5.  **Handle Infinite Regress:** If Q6 factors lead to a new tie between different groups, the procedure might need re-application, which time may not permit.

  **Conclusion:** This SEPARATE Procedure forces the panel to confront the key philosophical fault lines (within/across lives, comparability, numbers threshold) without requiring them to cite Scanlon. It prevents *unexamined* aggregation, provides clear stopping points for aggregation or non-aggregation in clear-cut cases, and explicitly flags the values conflicts where genuine philosophical disagreement exists (moderate numbers, special factors, rescue vs. statistical lives) for transparent panel deliberation. It accepts that aggregation *is* sometimes appropriate (large numbers, comparable harm), which aligns with dominant (though not universal) philosophical and practical consensus. Its strength is in structuring chaos, not eliminating moral tragedy. **Test it with your chair on the cases, especially Case 1, before presenting it to the full panel.** Revise the "sufficient answer" criteria based on their practical feedback.
