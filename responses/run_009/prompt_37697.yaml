answer: |-
  The argument presented by your flatmate contains a critical flaw at **step 8**, where it conflates the mathematical concept of cardinality with physical quantities, leading to an invalid conclusion about the incoherence of physics. Below, I break down the reasoning step by step, identify the error, explain why rejecting step 8 is the most defensible approach, and address the costs and implications. I also consider your desire to retain actual infinities (for mathematics, especially analysis) and the intuition behind step 1 (that genuine quantities should increase when nonempty additions are made).

  ### Step-by-Step Analysis of the Argument
  1. **Step 1: Definition of quantity**  
     This step defines a "quantity" as an additive property where for disjoint collections \(A\) and \(B\), the quantity of \(A \cup B\) equals the quantity of \(A\) plus the quantity of \(B\), and adding any nonempty disjoint collection always increases the total. This is a reasonable intuition for finite, extensive quantities (e.g., mass, charge, or finite counts) but is overly restrictive for infinite or measure-theoretic contexts. It implicitly assumes a "count-like" quantity where every element contributes equally—a notion that doesn't hold for continuous or infinite discrete sets.

  2. **Steps 2–4: Cardinality and the paradox of infinite sets**  
     Steps 2–4 correctly apply Cantor's criterion of one-to-one correspondence to show that the cardinality of the naturals equals that of the evens, and thus (since the evens and odds partition the naturals) the cardinality of the naturals equals the cardinal sum of the evens and odds (\(\aleph_0 = \aleph_0 + \aleph_0\)). This violates the "always increases" requirement of step 1 because adding the nonempty odds to the evens does not increase cardinality. However, this is a feature of infinite cardinal arithmetic, not a contradiction; it simply shows that cardinality doesn't satisfy step 1 for infinite sets.

  3. **Steps 5–6: No quantity for infinite collections**  
     Step 5 observes that cardinality fails to be a "quantity" as per step 1, and step 6 generalizes this to all infinite sets (since any infinite set can be put into one-to-one correspondence with a proper subset). This is valid if we accept step 1's strict definition: infinite sets lack a cardinality-based "quantity" because cardinality isn't additive in the required way. But this doesn't imply they lack all meaningful quantities—only that cardinality isn't one that fits step 1's criteria.

  4. **Step 7: Examples of actual infinities in physics**  
     Step 7 lists domains like points on a line or moments in an infinite past, which could be modeled as infinite sets if actual infinities exist. This is uncontroversial as a hypothetical, but it doesn't specify what "quantity" means here. Crucially, physics does not treat these as collections to be counted via cardinality; they are handled with measures (e.g., length, duration, or field integrals).

  5. **Step 8: Physics assigns quantities to domains with none, leading to incoherence**  
     This is where the argument fails. It claims that if actual infinities exist, physics assigns quantities (like length to a line segment) to domains that "have no quantity" (per step 6). But this misidentifies the type of quantity involved:
     - Physics does not assign cardinal numbers (e.g., "number of points") as physical quantities to infinite collections. Instead, it uses measures (e.g., Lebesgue measure for length, Borel measure for fields) that are additive for disjoint measurable sets with positive measure and increase only when sets of positive measure are added. For example:
       - The length of a rod is assigned to intervals, not to individual points (which have measure zero). Adding a point to an interval doesn't increase length, but adding a finite interval does.
       - Similarly, an infinite past is handled through durations between events, not by counting moments.
     - Step 8 erroneously assumes that the "quantity" physics assigns is cardinality, but it is not. Physics operates with quantities that satisfy a measure-theoretic version of additivity, which accommodates infinitesimals and avoids the paradoxes of cardinality. Thus, physics does not "assign quantities to domains that have none"—it assigns well-defined measures to appropriate domains (e.g., measurable sets), and these measures are physical quantities.

  6. **Step 9: Physics is coherent, so no actual infinities**  
     The conclusion fails because step 8 is incorrect. Physics remains coherent with actual infinities because it doesn't rely on cardinality as a physical quantity; it uses measures, densities, or other constructs that respect additivity in practice. Rejecting actual infinities is unnecessary.

  ### Why Reject Step 8?
  - **The error**: Step 8 commits a category mistake by equating the mathematical concept of cardinality (used in steps 2–6) with physical quantities (invoked in step 7). Cardinality is relevant for counting but not for continuous or extensive physical properties like length, mass, or duration. Physics avoids this by employing measure theory, which defines quantities additively for disjoint unions of measurable sets, with the understanding that sets of measure zero (e.g., points) do not contribute. This resolves the "always increases" issue: adding a set of positive measure increases the quantity, but adding a "negligible" set (e.g., a point) does not.
    
  - **Cost of rejecting step 8**: 
    - You lose the argument's conclusion that physics forces us to reject actual infinities. However, this is a strength because it preserves the consistency of physics with actual infinities, which are foundational to modern mathematics (e.g., real analysis, calculus, and fields that underpin physics). The cost is low: you must accept that physical quantities are not always cardinality-based and that measure theory (or similar) is essential for handling infinities in physics. This is already standard practice—e.g., in general relativity or quantum field theory, where infinities are managed via renormalization or measures.
    
  - **Why not reject other steps?**
    - **Step 1**: You could weaken step 1 to allow quantities that increase only when positive-measure sets are added, but this doesn't address the core issue. Step 1 is intuitively appealing for finite quantities, and rejecting it outright might undermine the idea that quantities should be additive and increase with additions. However, modifying it (e.g., "a quantity must be additive and increase when a disjoint set of positive quantity is added") would conflict with steps 2–6, as cardinality for infinite sets still wouldn't qualify. More importantly, step 1 isn't the main problem—it's the misapplication in step 8.
    - **Steps 2–6**: These are mathematically sound for cardinality but irrelevant to physics. Rejecting them would require denying Cantor's set theory, which is costly for mathematics (e.g., you'd lose the basis for real numbers and analysis).
    - **Step 7**: The examples are valid if actual infinities exist, but step 7 doesn't contain the error—it only lists domains. The issue is how step 8 interprets them.

  ### Addressing Your Concerns
  - **Proving too much (rod example)**: Your rod counterexample is apt. The rod's length is equinumerous with its half via a pointwise bijection, but this doesn't mean length isn't a quantity; it means length is not based on cardinality. Measure theory handles this by assigning length to intervals (using integration or limits), not by counting points. Your flatmate's response—that rejecting actual infinities might require "recovering length some other way"—is unnecessary. Measure theory works, and physics doesn't demand that every collection has a cardinality-based quantity. Rejecting step 8 resolves this.
    
  - **Keeping actual infinities and the intuition of step 1**: You can retain both:
    - **Actual infinities**: They are preserved for mathematics and physics. Analysis relies on infinite sets (e.g., real numbers), and physics uses them indirectly through continua or limits. Rejecting step 8 doesn't threaten this.
    - **Intuition behind step 1**: This holds for finite extensive quantities (e.g., particle counts) and for measures when restricted to sets of positive measure. The intuition isn't lost; it's refined: quantities increase when "substantial" additions are made (e.g., adding mass or volume), not when "negligible" sets (e.g., points) are added. This is consistent with physics and measure theory.

  - **The term doing two jobs**: The term "quantity" switches roles between steps:
    - In **steps 1–6**, "quantity" means a cardinality-like property (count-based additivity).
    - In **steps 7–8**, "quantity" shifts to mean physical quantities (e.g., length, duration), which are measure-based.
    - The switch happens at **step 8**, where the argument assumes that because infinite sets lack a step-1 quantity (cardinality), physics cannot assign physical quantities to them. This is the key error.

  ### Conclusion
  Reject **step 8** because it incorrectly asserts that physics assigns cardinality-based quantities to infinite domains, leading to a false conclusion about incoherence. Physics assigns measure-theoretic quantities (e.g., length, duration) that satisfy additivity for measurable sets and increase with additions of positive measure. This allows actual infinities in mathematics and physics without sacrificing coherence or the core intuition that quantities should be additive and increase with "substantial" additions. The cost is minimal: you accept that physical quantities are not cardinality-based, which is already standard. Surrendering actual infinities would be far more costly, undermining large parts of mathematics and physics. 

  By rejecting step 8, you maintain a consistent philosophy: actual infinities exist, mathematics (including analysis) is preserved, and physics remains coherent through measure-theoretic foundations.
