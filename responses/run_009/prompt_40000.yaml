prompt: |-
  I'm a backend engineer by training, and I now work on a team that has to make policy calls my CS education did nothing to prepare me for. When users signal what they want through our systems — whose content they'd like to see more of, whose they mute, which kinds of people they'd rather not be shown as neighbors or potential tenants — we have to decide which of these signals to honor as preferences and which to override as biases. Right now these calls are made case by case, mostly by gut, and I've noticed that every argument eventually bottoms out at someone flatly asserting "that's a bias" or "that's a preference," with no account of what makes it one rather than the other. Before we codify anything into a real policy, I want the full specification first, written out as carefully as we'd write a design doc.

  So: please write the desiderata that any workable criterion for distinguishing moral preferences from biases has to meet. By "criterion" I mean a principled account of when a person's liking or disliking counts as a preference that ought to be respected, and when it counts as a bias that ought not to be — an account general enough to cover users of a system, voters in a polity, or just individuals deciding for themselves. The requirements should cover: the cases it must handle (users who would disavow their own automatic reactions if asked; tastes formed under manipulation or heavy exposure; aesthetic distastes versus distastes aimed at groups of people; cases where the object of the attitude is a person rather than a type of content); the distinctions it cannot collapse (stated versus revealed attitudes; first-order versus higher-order — the person who wants not to want something; sincere versus socially pressured endorsement); and the empirical findings it must stay consistent with, e.g. the well-replicated fact that people often cannot accurately report the causes of their own attitudes. For each requirement, give the case or consideration that motivates it, and mark which requirements are non-negotiable and which are really just one camp's prejudice dressed up as a principle.

  Then answer two questions I most want to see addressed. First, which single requirement, applied consistently, does the most to knock out the criteria people use in practice — the "would they endorse it on reflection" test, the "is it about a protected group" test, the "did it arise from experience" test — and why. Second, whether some subset of the requirements is jointly unsatisfiable: if honoring one requirement necessarily forces us to violate another, say so plainly, because that would tell us the idea of a clean criterion is a mirage, and that we should be designing for explicit trade-offs rather than looking for a dividing line that doesn't exist. Keep the weight on the criteria and their motivating cases rather than on scoring any particular theorist; the standard itself is what I need. No citations or reading lists — just the reasoning, laid out clearly enough that an engineer can implement against it, or at least know exactly where implementation would fail.
reasoning: |-
  We are constructing a set of desiderata (requirements) for a criterion that distinguishes moral preferences from biases. The criterion must be general enough to apply to users in systems, voters, or individuals. We must cover specific cases, avoid collapsing key distinctions, and stay consistent with empirical findings.

  Key elements from the query:
  - Cases to handle: 
    - Users who would disavow automatic reactions if asked (implicit vs. explicit).
    - Tastes formed under manipulation or heavy exposure (e.g., via algorithms, advertising).
    - Aesthetic distastes vs. distastes aimed at groups (e.g., dislike of a food vs. dislike of a race).
    - When the object is a person (e.g., not wanting a person as a neighbor) vs. a type of content.
  - Distinctions not to collapse:
    - Stated (explicit) vs. revealed (implicit) attitudes.
    - First-order (having a desire) vs. higher-order (desiring to not have that desire).
    - Sincere vs. socially pressured endorsement.
  - Empirical findings to respect:
    - People often cannot accurately report the causes of their own attitudes.

  Two additional questions:
  1. Which single requirement, applied consistently, does the most to invalidate common practical criteria (e.g., reflection test, protected group test, experience test)?
  2. Is there a subset of requirements that are jointly unsatisfiable?

  We are to mark which requirements are non-negotiable and which might be one camp's prejudice.

  ---

  **Desiderata for the Criterion**

  We must build a set of requirements that the criterion must meet. Each requirement is motivated by a case or consideration.

  1. **Requirement: Non-Ideal Reflection Condition (Non-negotiable)**  
     *Motivation*: People often cannot report the causes of their own attitudes (empirical finding). Moreover, we must account for users who would disavow their automatic reactions if given the chance to reflect, but that reflection might be distorted by ignorance or manipulation.  
     *Criterion Implication*: The criterion must not rely solely on whether the person would endorse the attitude upon reflection because reflection might be flawed (e.g., due to false beliefs or lack of information). The criterion must be robust to imperfect reflection.  
     *Note*: This requirement challenges the "would they endorse it on reflection" test.

  2. **Requirement: Distinction Between Target Types (Non-negotiable)**  
     *Motivation*: The moral stakes differ when the attitude is about a person (or group of people) versus non-personal content (e.g., an aesthetic). We must handle cases where the distaste is aimed at a group (e.g., race, gender) versus a non-group attribute (e.g., a style of art).  
     *Criterion Implication*: The criterion must be sensitive to whether the object of the attitude is a human being or a group of humans, because biases against persons raise issues of fairness and harm in ways that preferences about inanimate things do not.  
     *Note*: This requirement complicates the "is it about a protected group" test because it requires a deeper analysis than just group membership (e.g., why is the group protected?).

  3. **Requirement: Formation History Sensitivity (Negotiable?)**  
     *Motivation*: Tastes formed under manipulation (e.g., by algorithms, advertising) or heavy exposure might be inauthentic or not truly reflective of the person. However, the empirical fact that people cannot report causes means we cannot rely on self-reports about formation.  
     *Criterion Implication*: The criterion must not depend on the person's ability to recount the formation history. Instead, it might look at the structure of the attitude (e.g., is it based on false beliefs?) or its consequences.  
     *Note*: This challenges the "did it arise from experience" test because experience might be manipulated or biased.

  4. **Requirement: Attitude Hierarchy (Non-negotiable)**  
     *Motivation*: The distinction between first-order and higher-order attitudes (e.g., a person who wants not to want something) reveals internal conflicts that may indicate an inauthentic or imposed attitude.  
     *Criterion Implication*: The criterion must give weight to higher-order attitudes (if they exist) because they reflect the person's considered judgment. However, note that higher-order attitudes can also be socially pressured.  
     *Note*: This requirement must be balanced against the Sincerity requirement (below).

  5. **Requirement: Sincerity vs. Social Pressure (Non-negotiable)**  
     *Motivation*: We must distinguish attitudes that are sincerely held from those adopted under social pressure (e.g., endorsing diversity because it's the norm, not out of genuine belief).  
     *Criterion Implication*: The criterion must account for the possibility that both stated and revealed attitudes might be influenced by social context, and that higher-order attitudes might be pressured too.  
     *Note*: This requires the criterion to look beyond self-reports and consider behavior and context.

  6. **Requirement: Revealed vs. Stated Attitudes (Non-negotiable)**  
     *Motivation*: People often have implicit (revealed) attitudes that contradict their explicit (stated) ones. The criterion must handle both and not collapse them.  
     *Criterion Implication*: The criterion must be applicable to both what people say and what they do (e.g., through behavioral signals in a system). It must not assume that one is more "real" than the other without further analysis.

  7. **Requirement: Harm and Autonomy Balance (Non-negotiable? But values-based)**  
     *Motivation*: A core tension: respecting user autonomy (honoring preferences) versus preventing harm (overriding biases). The criterion must not ignore the potential harm to others caused by biases (especially against groups).  
     *Criterion Implication*: The criterion must weigh the harm to the person whose preference is overridden (autonomy harm) against the harm to others (e.g., discrimination). This is particularly acute when the attitude targets a person or group.  
     *Note*: This might be seen as one camp's prejudice (e.g., prioritizing anti-discrimination over autonomy) but is non-negotiable in systems that affect others.

  8. **Requirement: Empirical Consistency (Non-negotiable)**  
     *Motivation*: The criterion must be consistent with the well-replicated fact that people cannot accurately report the causes of their attitudes. Thus, it must not rely on self-reports about causation.  
     *Criterion Implication*: The criterion must use observable factors (e.g., the attitude's consistency with other values, its behavioral effects) rather than introspective accounts.

  9. **Requirement: Scalability and Operationalizability (Non-negotiable for implementation)**  
     *Motivation*: The criterion must be applicable at scale in a system (e.g., for user signals). It cannot require deep individual psychological analysis for every user.  
     *Criterion Implication*: The criterion should be based on features that can be measured or inferred from data (e.g., patterns of behavior, demographic correlates) without being overly reductive.

  10. **Requirement: Context Relativity (Negotiable?)**  
      *Motivation*: The same attitude might be a preference in one context and a bias in another (e.g., not wanting to see violent content is a preference; not wanting to see a racial group might be a bias).  
      *Criterion Implication*: The criterion must account for the context in which the attitude is expressed and acted upon (e.g., in a housing platform vs. a content feed).  

  Now, addressing the two questions:

  **Question 1: Which single requirement, applied consistently, does the most to knock out common criteria?**

  The **Non-Ideal Reflection Condition** (Requirement 1) is the most devastating to common criteria. Here's why:

  - The "reflection test" (would they endorse it on reflection?) is directly undermined because reflection is often flawed (due to ignorance, manipulation, or inability to access true causes). Requirement 1 forces us to reject reflection as a reliable arbiter.

  - The "protected group test" (is it about a protected group?) is complicated by Requirement 1 because even if a group is protected, the user might, upon (flawed) reflection, endorse the bias (e.g., due to internalized stereotypes). Thus, the test might over-include (treating all group-based dislikes as biases) or under-include (if the user endorses it).

  - The "experience test" (did it arise from experience?) is challenged because the user might misattribute the cause of their attitude (due to Requirement 1 and Requirement 8). Also, experience might be manipulated (Requirement 3).

  By insisting that reflection and self-report are unreliable, Requirement 1 forces us to look for other grounds (e.g., harm, structural features of the attitude) and thus invalidates the common tests that rely on the user's own perspective.

  **Question 2: Are some requirements jointly unsatisfiable?**

  Yes. Specifically, the **Harm and Autonomy Balance** (Requirement 7) and the **Attitude Hierarchy** (Requirement 4) can come into conflict with the **Non-Ideal Reflection Condition** (Requirement 1) and the **Sincerity vs. Social Pressure** (Requirement 5). 

  - **Conflict 1: Autonomy vs. Harm.** 
    - Requirement 7 says we must prevent harm to others (e.g., from discriminatory biases). But Requirement 4 says we should respect higher-order attitudes (e.g., if a user wants to change their bias, we should help). However, what if the user's higher-order attitude is itself formed under social pressure (Requirement 5)? Then, overriding a first-order bias might be respecting the higher-order attitude (autonomy) but also might be seen as social pressure. Meanwhile, if we honor a first-order bias to respect autonomy, we might cause harm (violating Requirement 7).

  - **Conflict 2: Non-Ideal Reflection and Higher-Order Attitudes.** 
    - Requirement 4 (Attitude Hierarchy) suggests that higher-order attitudes (e.g., "I wish I didn't have this bias") should be respected. But Requirement 1 (Non-Ideal Reflection) says reflection is flawed. How do we know the higher-order attitude is not also flawed? If we override a first-order attitude based on a higher-order one, we might be acting on an inauthentic desire (e.g., due to social pressure). But if we don't, we might be perpetuating a bias the user would reject if they had better reflection.

  - **Conflict 3: Scalability vs. Context Relativity and Formation History.** 
    - Requirement 9 (Scalability) demands simple, operationalizable rules. But Requirement 10 (Context) and Requirement 3 (Formation History) require nuanced, context-dependent judgments that are hard to scale. For example, determining if a taste was formed under manipulation requires historical data and analysis that may not be available.

  These conflicts suggest that a clean criterion is not possible. We must design for trade-offs:

  - Between autonomy and harm prevention: We might develop thresholds (e.g., override only when harm is above a certain level).
  - Between respecting higher-order attitudes and acknowledging flawed reflection: We might use proxies (e.g., consistency with other values) but accept error.
  - Between scalability and nuance: We might use heuristics (e.g., group-based dislikes are biases) but with exceptions.

  In conclusion, the desiderata reveal that no perfect criterion exists. The requirements push in different directions, and the best we can do is a policy that explicitly balances them, with clear trade-offs and continuous revision based on outcomes.
answer: |-
  Below is a principled set of desiderata (requirements) for a criterion distinguishing morally acceptable *preferences* from harmful *biases*. The requirements are derived from the cases, distinctions, and empirical constraints you specified. Each requirement is marked as **non-negotiable** (grounded in fundamental ethical or empirical realities) or **contestable** (potentially reflecting a specific value system). The criterion must handle:  
  - **Cases**: Disavowed automatic reactions, manipulated tastes, aesthetic vs. group-based distastes, attitudes targeting persons.  
  - **Distinctions**: Stated vs. revealed attitudes, first-order vs. higher-order desires, sincere vs. socially pressured endorsements.  
  - **Empirical constraints**: Inability to self-report attitude causes accurately.  

  ---

  ### **Desiderata for the Criterion**  
  1. **Non-Ideal Agency Compliance** (Non-negotiable)  
     - **Motivation**: Users often cannot accurately report *why* they hold an attitude (e.g., due to implicit biases or unaware conditioning). A criterion relying on self-reported reasons fails empirically.  
     - **Implication**: The criterion must function without assuming users understand their own motivations. It cannot require introspection about causation.  

  2. **Target-Type Sensitivity** (Non-negotiable)  
     - **Motivation**: Disliking a *person* (e.g., a neighbor) vs. non-personal content (e.g., a genre of music) raises distinct ethical stakes. Harm to persons/groups requires stricter scrutiny than aesthetic distastes.  
     - **Implication**: The criterion must weigh whether the attitude’s object is a human or group. If it is, the burden of proof shifts toward classifying it as a bias.  

  3. **Formation-Independence** (Non-negotiable)  
     - **Motivation**: Tastes formed under manipulation (e.g., algorithmic echo chambers) or exposure may be inauthentic, but users can’t reliably trace origins. A "did it arise from experience?" test is empirically unsound.  
     - **Implication**: The criterion must not depend on the *origin* of the attitude. Authenticity must be assessed through current structure, not history.  

  4. **Attitude Hierarchy Priority** (Non-negotiable)  
     - **Motivation**: Higher-order desires (e.g., "I wish I didn’t dislike this group") reveal conflicts where a first-order attitude (e.g., automatic discomfort) contradicts core values. Ignoring this collapses moral agency.  
     - **Implication**: If a user *disavows* their own reaction (a higher-order desire), the attitude is provisionally a bias—even if sincerely held.  

  5. **Revealed-Stated Disjunction** (Non-negotiable)  
     - **Motivation**: Stated (explicit) and revealed (implicit/behavioral) attitudes often conflict (e.g., a user says they support diversity but mutes minorities). Collapsing them ignores real-world harm from implicit biases.  
     - **Implication**: The criterion must treat stated and revealed attitudes separately. Revealed attitudes that contradict stated values are stronger bias candidates.  

  6. **Social Pressure Discounting** (Contestable)  
     - **Motivation**: Endorsements can be sincere (e.g., genuine preference for diverse content) or socially pressured (e.g., claiming to like something for approval). Ignoring this risks enforcing conformity.  
     - **Implication**: Attitudes adopted under measurable social coercion (e.g., platform-wide shaming) should be treated as preferences *only if* they align with the user’s private behavior.  
     - **Contestable note**: This assumes individual autonomy outweighs collective norms—a liberal bias. Critics might argue social goods justify overriding individual dissent.  

  7. **Harm-Autonomy Calculus** (Non-negotiable)  
     - **Motivation**: Honoring a preference respects autonomy; overriding a bias prevents harm. But autonomy matters less when harm is severe (e.g., discrimination). A "protected group" test alone is crude (not all groups are legally protected; not all biases cause equal harm).  
     - **Implication**: The criterion must weigh:  
       - *Harm magnitude*: Does the attitude cause measurable detriment (e.g., exclusion, psychological harm)?  
       - *Autonomy impact*: Does overriding it undermine agency (e.g., forcing exposure to trauma-triggering content)?  

  8. **Scalable Observability** (Non-negotiable)  
     - **Motivation**: For implementation, the criterion must use observable signals (e.g., behavior patterns, user flags) without psychological diagnostics.  
     - **Implication**: It cannot require surveys about users’ motivations or ideal reflection. Proxies (e.g., consistency across contexts) must suffice.  

  9. **Context Relativity** (Non-negotiable)  
     - **Motivation**: An attitude may be a preference in one context (e.g., not seeing violent content) but a bias in another (e.g., not seeing a racial group). Fixed rules (e.g., "all group-based dislikes are biases") overgeneralize.  
     - **Implication**: The criterion must consider the *domain* (e.g., housing vs. content curation) and *impact* (e.g., does it perpetuate systemic disadvantage?).  

  ---

  ### **Answers to Your Two Questions**  
  #### **1. Which single requirement most invalidates common criteria?**  
  **Requirement 1 (Non-Ideal Agency Compliance)** does the most damage to existing criteria when applied consistently. It directly undermines:  
  - **"Would they endorse it on reflection?" test**: Requires idealized reflection, which users cannot reliably perform (per empirical constraints).  
  - **"Did it arise from experience?" test**: Demands knowledge of attitude origins, which users lack.  
  - **"Is it about a protected group?" test**: Fails alone because group-based attitudes might be preferences (e.g., trauma survivors avoiding a demographic resembling their abuser), and non-group attitudes might be biases (e.g., disliking "poor-quality" content that correlates with marginalized creators).  
  **Why**: This requirement forces reliance on *observable outcomes* (e.g., harm patterns) and *attitude conflicts* (e.g., higher-order disavowal) rather than introspective or historical claims.  

  #### **2. Are requirements jointly unsatisfiable?**  
  **Yes. The combination of Requirement 4 (Attitude Hierarchy Priority) and Requirement 7 (Harm-Autonomy Calculus) creates a fundamental conflict:**  
  - **Conflict**: Requirement 4 prioritizes individual agency (e.g., overriding a first-order attitude if the user disavows it). But Requirement 7 prioritizes preventing harm to others (e.g., honoring a user’s disavowed bias could cause exclusion).  
  - **Example**: A user reveals they mute Group X (first-order attitude) but states they wish they didn’t (higher-order attitude). Requirement 4 treats this as a bias to override. But if honoring this higher-order desire leads to showing Group X content, and Group X users face harassment from others, Requirement 7 may demand *not* showing it to prevent harm.  
  - **Implication**: This conflict means **no clean criterion exists**. You *must* design for trade-offs:  
    - In high-harm contexts (e.g., housing), prioritize Requirement 7 (harm prevention) even if it violates Requirement 4.  
    - In low-harm contexts (e.g., content curation), prioritize Requirement 4 (autonomy).  
    - **Solution**: Set explicit thresholds (e.g., override attitudes only when harm risk exceeds X, or when higher-order desires are consistently expressed).  

  ---

  ### **Summary for Implementation**  
  - **Core tension**: Preferences (protect autonomy) vs. biases (prevent harm).  
  - **Non-negotiable foundations**: The criterion must be observable (Requirement 8), harm-sensitive (Requirement 7), and respect attitude conflicts (Requirement 4) without relying on self-reported causes (Requirement 1) or origins (Requirement 3).  
  - **Fatal flaw**: The autonomy-harm conflict (Requirements 4 vs. 7) is unresolvable. **Design for trade-offs**:  
    - Use heuristics like:  
      - *If* the attitude targets a person/group *and* causes measurable harm (Requirement 7), *and* contradicts the user’s stated values (Requirement 5), treat as bias.  
      - *If* the user disavows their attitude (Requirement 4) *and* harm is low, override it.  
    - Build feedback loops to adjust thresholds (e.g., track whether overriding certain attitudes reduces harm without autonomy violations).  
  - **Outcome**: A policy that is context-aware, data-driven, and explicit about its trade-offs—not a universal "bias detector."
