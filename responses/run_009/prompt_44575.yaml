prompt: |-
  I'm teaching an upper-level seminar this term called Death, Time, and the Self, and I'm putting together the take-home final. I want one essay question on whether death is bad for the person who dies — the Epicurean challenge — but my students have all seen the standard deprivation dialectic (Nagel, Feldman) in intro courses, so a question they can answer by reciting the classic back-and-forth is useless to me. They're also all comfortable with Lucretius's symmetry argument about prenatal nonexistence, and a few of them know Parfit on the bias toward the future, so the question has to push past that material rather than just collect it.

  Here's the case I want to build the question around — I invented it, but I think it isolates something real. A clinic offers what it calls "deferred annihilation": for a fee, they implant a device that guarantees you die instantly and painlessly in your sleep exactly ten years from the implant date, and they can prove the device works. Nothing about your health changes before then; your remaining decade is the decade you'd otherwise have, except it now has a known, fixed endpoint that you chose. I want the students to grapple with whether signing up is irrational if death isn't bad for you, whether refusing to sign commits you to saying death is bad for you, and — crucially — which premise of the Epicurean argument (the no-subject premise, the no-time-at-which-it's-bad premise, or the symmetry premise) is actually doing the work in their answer. The case is designed so that the symmetry argument gets weird here: everyone 'had' a fixed endpoint before the clinic existed, so what exactly did the implant change?

  Please write (1) the question itself, answerable in about 1200 words over 48 hours, (2) a model answer of roughly 700 words that actually takes a position instead of surveying options, and (3) a marking scheme out of 25 marks. For the marking scheme I'd like a table with four columns: "must-hit move" (the specific philosophical step, named precisely), "full marks" (what a complete execution of the move looks like), "partial credit" (what a half-understood version looks like), and "marks". Also add a row or two for penalties — I specifically want students to lose marks if they quietly slide into talking about the badness of dying, or the grief of others, or the unfairness of early death, without noticing they've changed the subject; part of the test is whether they see they have to bracket all that and say so. Finally, please end with a JSON object with the fields "question_focus" (string), "positions_available" (array of strings listing the defensible stances), "separates_A_from_B" (one line on what an A answer does that a B answer doesn't), and "total_marks" (number). One typo I keep making in my draft instructions, apologies: where I wrote "the no-subject premise" I mean the claim that harm requires a subject who exists to be harmed — make sure the question phrases it so there's no ambiguity.
reasoning: |-
  We are creating a take-home final essay question for an upper-level seminar on Death, Time, and the Self. The question should focus on the Epicurean challenge and push beyond the standard deprivation account and symmetry arguments. The case of "deferred annihilation" is central. The question must require students to engage with the premises of the Epicurean argument (no-subject, no-time, symmetry) and the rationality of signing up for the device.

  Components:
  1. The question itself (about 1200 words, 48 hours)
  2. A model answer (about 700 words, taking a clear position)
  3. A marking scheme (table with must-hit moves, full marks, partial credit, marks, and penalties)
  4. A JSON object with specified fields

  Let's break down:

  **The Question**
  - Must be answerable in 1200 words.
  - Must force students to confront the Epicurean premises in the context of the deferred annihilation case.
  - Must avoid allowing a simple recitation of Nagel, Feldman, Lucretius, Parfit.
  - Must require students to bracket the badness of dying, grief of others, unfairness of early death.

  Key elements from the case:
  - The device sets a fixed endpoint 10 years from implant, painless and instant.
  - The device does not change health during the 10 years.
  - The question: Is it irrational to sign up? Does refusing to sign commit you to saying death is bad? Which Epicurean premise is at work?

  Draft Question:

  "Consider the following scenario: A clinic offers a service called 'deferred annihilation.' For a fee, they implant a device that guarantees you will die instantly and painlessly in your sleep exactly ten years from the date of implantation. The clinic can prove the device works. Importantly, the device does not alter your health or the quality of your life during the ten years; you simply have a fixed, known endpoint that you have chosen. Assume that without the implant, you would live a normal lifespan (i.e., longer than ten years) and that the implant does not change any of the events of your life during the ten years except that it fixes the time of your death.

  In light of this scenario, address the following:

  1. Would it be irrational for someone to sign up for deferred annihilation if they accept the Epicurean view that death is not bad for the person who dies? Why or why not?
  2. If someone refuses to sign up for deferred annihilation, does that refusal commit them to the view that death is bad for the person who dies? Why or why not?
  3. Which premise of Epicurus's argument (either as presented by Epicurus or as reconstructed in the contemporary debate) does your analysis of the above two questions most critically engage? The premises to consider are: 
     a) The 'no subject' premise: that harm requires a subject who exists at the time of the harm to experience it.
     b) The 'no time' premise: that there is no time at which death is bad for the person who dies (because before death, one is not dead, and after death, one does not exist to experience anything as bad).
     c) The 'symmetry' premise: that the time after death is relevantly similar to the time before birth (so that if we don't regret the time before we were born, we shouldn't regret the time after we die).

  In your essay, you must:
  - Clearly state your position on the rationality of signing up and the implications of refusing to sign.
  - Explicitly identify which Epicurean premise is central to your argument and explain why.
  - Avoid shifting the focus to the badness of the dying process, the grief of others, or the unfairness of an early death. If you believe these are irrelevant to the question at hand, you must explicitly bracket them and explain why.

  Note: You are expected to engage with the Epicurean challenge at a level beyond the standard deprivation account and symmetry argument as typically presented in introductory courses. While you may reference these, your argument should show how the deferred annihilation case reveals new aspects of the problem."

  **Model Answer (700 words)**
  We'll write a model answer that takes a position. Let's choose the position that signing up is irrational if one accepts the Epicurean view, and that refusal does commit one to the view that death is bad. The central premise engaged will be the no-time premise.

  **Marking Scheme (out of 25 marks)**
  We'll have a table with must-hit moves, each with full marks, partial credit, and marks. Then penalties.

  Must-hit moves:
  1. Clear position on rationality of signing (given Epicureanism).
  2. Clear position on whether refusal commits to death being bad.
  3. Identification and explanation of the relevant Epicurean premise.
  4. Argument for why that premise is central in the deferred annihilation case.
  5. Avoidance of the bracketed issues (dying process, grief, unfairness) or explicit bracketing.

  Penalties: for each time they shift to the bracketed issues without noting it and explaining why it's off-topic.

  **JSON Object**
  - question_focus: "The rationality of deferred annihilation in light of Epicureanism and the role of specific premises."
  - positions_available: [Array of defensible stances]
  - separates_A_from_B: "An A answer identifies which premise is doing the work and shows how the case uniquely challenges or supports that premise, beyond standard arguments."
  - total_marks: 25

  Let's proceed step by step.
answer: |-
  ### 1. Essay Question  
  **Death, Time, and the Self: Final Essay Question**  
  **Word Limit:** 1200 words  
  **Time Limit:** 48 hours  

  **Scenario:**  
  > A clinic offers "deferred annihilation": For a fee, they implant a device guaranteeing you die instantly and painlessly in your sleep exactly ten years after implantation. The clinic provides proof the device works. Crucially, the device does not alter your physical or mental health during the ten years; you experience the same life you otherwise would have, except with a known, fixed endpoint you chose. Assume that without the implant, you would live a normal human lifespan (e.g., 80+ years), and the implant changes nothing about your life during the decade except guaranteeing death at ten years.  

  **Question:**  
  In this scenario, answer the following three interconnected questions:  
  1. **Rationality and Epicureanism:** If someone accepts the Epicurean view that death is *not* bad for the person who dies, would it be irrational for them to sign up for deferred annihilation? Defend your answer.  
  2. **Refusal and Commitment:** If someone refuses to sign up for deferred annihilation, does this refusal commit them to the view that death *is* bad for the person who dies? Defend your answer.  
  3. **Epicurean Premises:** Which premise of Epicurus’s argument does your analysis of questions (1) and (2) most critically engage? Choose *one* of the following:  
     - **The no-subject premise**: Harm requires a subject who exists at the time of the harm to experience it.  
     - **The no-time-at-which premise**: There is no time at which death is bad for the person who dies (before death, you are alive and thus unharmed; after death, you do not exist to experience harm).  
     - **The symmetry premise**: Prenatal nonexistence (before birth) and postmortem nonexistence (after death) are symmetrical; if we do not consider the former bad, we should not consider the latter bad.  
     Explain why your chosen premise is decisive in this case and how deferred annihilation tests it uniquely.  

  **Constraints:**  
  - You must bracket (i.e., explicitly set aside) the following: the badness of the *dying process* (e.g., pain or fear), the grief of others, or the unfairness of early death. If you mention these, you must state why they are irrelevant to the question of whether death *itself* is bad *for the person who dies*.  
  - Do not merely recite the standard deprivation account (Nagel/Feldman) or symmetry argument (Lucretius). Engage how deferred annihilation *reshapes* the debate.  
  - Clearly state your positions and justify them with philosophical reasoning.  

  ---

  ### 2. Model Answer (710 words)  
  **Position:** Signing up for deferred annihilation *is* irrational for an Epicurean, refusing to sign *does* commit one to viewing death as bad, and the **no-time-at-which premise** is the key to resolving the case.  

  **1. Rationality and Epicureanism**  
  If one accepts Epicureanism—that death is not bad for the deceased because it involves no experiential harm—signing up for deferred annihilation is irrational. The implant fixes death at ten years, whereas without it, one might live longer. Epicureanism denies that death itself is harmful, so shortening life via the implant cannot be instrumentally rational. Suppose the Epicurean argues: "Since death isn’t bad, shortening life doesn’t deprive me of good things." But this misconstrues rationality. Even if death isn’t bad, *life* contains goods (e.g., relationships, projects). Voluntarily forfeiting these goods without compensation is irrational unless motivated by countervailing reasons (e.g., avoiding suffering). Here, the implant provides no such reasons: it alters no experiences during the ten years. Signing up is thus akin to paying to reduce one’s lifespan arbitrarily, which is irrational without a justifying benefit. Crucially, this holds *even if death is not bad*, because the irrationality stems from needlessly sacrificing life’s goods.  

  **2. Refusal and Commitment**  
  Refusing to sign up commits one to viewing death as bad. If death were not bad, refusing the implant would be puzzling: why reject a painless, guaranteed death that doesn’t alter one’s life? The refusal suggests one values the *possibility* of living beyond ten years. But if death is not bad, living longer is merely additive (more goods), not a necessity. Thus, refusal implies that avoiding death at ten years is imperative—i.e., that death itself would be bad. One might object that refusal could stem from preferring uncertainty. But uncertainty matters only if outcomes differ in value. Without the implant, one risks dying painfully or prematurely, but we’ve bracketed the dying process. If death itself is not bad, as Epicurus holds, uncertainty about timing should be neutral. Refusal, then, signals that death at ten years is worse than later death—committing one to its badness.  

  **3. Epicurean Premises**  
  The **no-time-at-which premise** is decisive. Epicurus argues death cannot be bad because there is no time when the deceased suffers harm: before death, they exist unharmed; after, they don’t exist. Deferred annihilation uniquely pressures this premise by introducing a *chosen fixed endpoint*. Normally, death’s timing is unknown, so we focus on deprivation—losing future goods. But here, the endpoint is known and voluntary, making the core question: "Does choosing to *cause* death at t+10 years make sense if death isn’t bad?" The no-time premise insists death harms no one at any time, so causing it should be neutral. But if signing up is irrational (as argued), it implies that causing death *is* harmful—not at a time, but as a loss of possible future existence. This rejects the no-time premise: death is bad *at all times* once it occurs, because it eternally forecloses goods. The symmetry premise fails to resolve this: prenatal nonexistence lacks a subject to lose anything, but postmortem nonexistence follows a subject whose life-project is truncated. The no-subject premise is also inadequate, as the harm is not experiential but metaphysical—a permanent loss of potential. Thus, deferred annihilation shows the no-time premise cannot accommodate the rational aversion to *imposing* death on oneself.  

  **Conclusion**  
  Deferred annihilation reveals that Epicureanism’s no-time premise is unsustainable. If death isn’t bad, signing up should be rationally permissible; if refusal commits us to death’s badness, Epicurus is wrong. The case forces us to confront death as a timeless harm—one that justifies neither voluntary imposition nor indifference to timing.  

  ---

  ### 3. Marking Scheme (25 Marks Total)  
  **Instructions:** Assess answers based on "must-hit moves." Deduct penalties for off-topic shifts.  

  | Must-Hit Move                     | Full Marks (What It Looks Like)                                                                 | Partial Credit (Half-Understood)                                                                 | Marks |
  |-----------------------------------|------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|-------|
  | **1. Position on Rationality**    | Clear stance on irrationality/rationality of signing given Epicureanism, with reasoning tied to life-goods/loss (not death’s experience). | Stated stance but weak link to Epicureanism, or conflates with deprivation without novelty. | 5     |
  | **2. Position on Refusal**        | Explicit argument that refusal commits to death’s badness, addressing uncertainty without relapsing to bracketed issues. | Assertion without defense, or confuses refusal’s implications (e.g., appeals to emotion). | 5     |
  | **3. Premise Identification**     | Chooses one premise, names it precisely (e.g., "no-time-at-which"), and justifies why it’s central. | Identifies premise but mislabels (e.g., "no-subject" for no-time) or offers vague justification. | 5     |
  | **4. Case Engagement**            | Explains how deferred annihilation uniquely tests the premise (e.g., for no-time: focuses on chosen imposition vs. deprivation). | Generic application of premise without case-specific insight (e.g., rehashes symmetry). | 5     |
  | **5. Bracketing Off-Topic Issues**| Explicitly notes why dying process/grief/unfairness are irrelevant and avoids them (or flags if mentioned). | Mentions bracketing but lapses into off-topic points briefly. | 3     |
  | **Structure/Clarity**             | Logically organized, concise, and avoids jargon without oversimplifying.                        | Disorganized or verbose but coherent; minor ambiguities.                                         | 2     |

  **Penalties (Apply per occurrence; max -3 total):**  
  - **-1 per lapse**: Shifting focus to the badness of *dying* (e.g., pain), others’ grief, or unfairness of early death without explicitly bracketing it.  
  - **-0.5 per lapse**: Superficial use of Nagel/Feldman/Lucretius/Parfit without novel engagement.  

