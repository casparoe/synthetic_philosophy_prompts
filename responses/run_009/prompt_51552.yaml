  - If you answered Yes to scenarios 1, 2, 4, 5, 6, 7, 8 and No to 3: You are closest to the **legal moralist** position.

  Note: It is possible that your pattern does not match any of these exactly. That might mean you hold a view that is a mix, or that one of the positions doesn't perfectly fit. We can discuss in class.

  But note: we have to warn that the harm Millian and offense liberal might overlap on many, but we separate by 3,4,8.

  Also, paternalist and legal moralist both say Yes to 7, but legal moralist says Yes to more.

  We might get patterns that are not exactly matched. For example, if someone says Yes to 1,2,6,7, that might be a mix of harm and paternalism? But we have to assign to the closest.

  Alternatively, we can have a more nuanced scoring, but for a quiz, we'll go with this.

  We have 8 questions, which is within the range.

  Now, let's check if any two positions are not separable:

  - Harm Millian and paternalist: Harm says Yes to 1, paternalist says No to 1; Harm says No to 7, paternalist says Yes to 7. So separable.

  - Offense liberal and legal moralist: Offense says No to 5 and 7, legal moralist says Yes. Also, offense says Yes to 3, legal moralist says No. So separable.

  - Absolutist is unique: all No.

