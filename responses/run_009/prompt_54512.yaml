prompt: |-
  ok so this might be a weird request but the topic just became my actual life, so bear with me. My city's police union contract arbitration blew up publicly a few months back, and through a series of events I still don't fully understand I ended up as the neutral facilitator of a "community safety working group" that meets in the library basement. The two most active members have been fighting about this stuff in local politics for years: one is an abolitionist who wants to phase out the department entirely and replace it with a patchwork of unarmed responders, community accountability processes, and prevention spending; the other is a reformer who thinks that's naive and wants the department kept but changed — oversight with real teeth, different training and hiring, money shifted toward prevention but cops still existing.

  Last meeting ended with them both talking past eachother for an hour and me realizing I have no idea what they actually disagree about, versus what's just them using the same words for different things.

  So here's what I want you to write: the joint statement the two of them could both sign after a good-faith adversarial collaboration. Specifically:

  1. The claims they can both accept — about what the current department actually spends its time on, about what both sides agree is broken, about the state's monopoly on violence itself (one thing I've noticed is they oddly converge on some of the facts, like neither disputes that most police work isn't responding to violent crime in progress).

  2. The precise disagreements, each one phrased in wording that its own side would actually endorse — not a paraphrase that makes one of them look dumb.

  3. The cruxes — the sub-questions where settling them would move at least one side. I have my suspicions about what they are but I want you to tell me if I'm wrong: (a) whether the state's monopoly on violence has on net protected vulnerable groups more than it has endangered them, or the reverse; (b) whether unarmed responder programs stay unarmed in practice once they start encountering the worst cases, or whether they just drift into being police with worse training and less protection; and (c) whether the transition risk is symmetrical — does each of them think the risk of abolishing too soon is the same size as the risk of reforming too slowly, or does one side discount the other's risk entirely.

  4. For each crux, some case, natural experiment, or piece of evidence BOTH would agree bears on it, with each side's prediction written down in advance so they can't retrofit it later.

  Also — my sister is a social worker and she keeps getting sent to calls that the police used to handle, so I hear about this at dinner too, and honestly one thing I've started wondering is whether some of their fight is purely verbal, like what "defund" even means at this point or whether "community accountability" describes an institution or a vibe. If you think part of their dispute is just about words, please say which part and why.

  Format it as a numbered agreed-claims section, then a disagreements table, then the crux section with the predictions. Sorry for the length, its just that the next meeting is in two weeks and I'd rather hand them something real than watch another hour of talking past each other.
