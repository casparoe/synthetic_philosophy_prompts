prompt: |-
  I've been listening to a philosophy podcast whose host summarized Kant's ethics for beginners roughly as follows: "Kant's real test for right and wrong is surprisingly simple: take whatever you're about to do, generalize it into a rule, and ask what would happen if everyone acted on that rule. If the consequences of universal compliance would be bad — if the practice would break down or backfire — the act is wrong; if the consequences would be fine, the act is permissible. For example, lying fails the test because if everyone lied, trust would collapse and lying would become pointless, so no one could profit by it anymore. Kant's formula is basically the Golden Rule stated with German rigor: before acting, imagine yourself on the receiving end of a world where everyone does what you're about to do, and if you wouldn't accept being treated that way, you may not treat others that way. In the end, Kant's ethics just asks each of us to weigh our private inclinations against the general welfare, and to vote for the course of action that the whole community could endorse."

  Something about this bothers me, though I can't pin it down. The host presents the test in an almost consequentialist register — bad outcomes under universalization make acts wrong — and I have a vague memory that Kant was fierce about keeping consequences out of ethics entirely. The Golden Rule equation also struck me as too tidy, given that lots of cultures have some version of the Golden Rule and Kant didn't seem to think he was just repackaging it. But the host sounds well-informed otherwise, and the examples (the lying one especially) do ring true to things I've read.

  Please act as a professional philosopher specializing in Kantian ethics. Think through the passage carefully before writing — work out, step by step, what each sentence gets right, what it distorts, and why the distortions matter to Kant's project — but deliver only the final structured output described below, not your working notes.

  I'd like your audit as a JSON object with the following schema:

  {
    "sentence_audit": [
      {
        "claim": "<short paraphrase of one claim from the summary>",
        "verdict": "<one of: 'accurate', 'defensible simplification', 'misrepresentation'>",
        "explanation": "<2-4 sentences: what Kant actually holds, and where this characterization goes wrong or why the simplification is acceptable>",
        "defender_would_say": "<how a Kantian would restate the point correctly>"
      }
    ],
    "overall_fairness": "<a paragraph assessing the summary as a whole: is it a fair popularization, and does the drift toward consequentialism and the Golden Rule reflect a deep or merely a presentational error>",
    "does_conclusion_follow": "<whether the final sentence's claim — that Kantian ethics boils down to weighing inclinations against the general welfare and seeking communal endorsement — follows from the parts of the summary that survive correction>",
    "key_corrections": ["<the 2-3 most important distinctions the listener should walk away with>"]
  }

  Cover every claim in the quoted summary in "sentence_audit" (there are more claims than sentences — the universalization-with-consequences framing, the lying example, the Golden Rule equation, and the closing 'general welfare / community endorsement' picture each need their own entry). In "key_corrections," prioritize the conceptual distinctions over historical details.
reasoning: |-
  Okay, let me approach this Kant ethics summary audit systematically. The user presents a podcast host's interpretation that needs careful evaluation against Kant's actual ethical framework. 

  First, I need to break down the summary into its key claims: 
  (1) Universalization test framed through consequences 
  (2) Lying example 
  (3) Golden Rule comparison 
  (4) General welfare conclusion 

  For the universalization claim, I recall Kant's Categorical Imperative isn't about predicting outcomes but testing logical consistency. If everyone lied, the concept of truth-telling becomes incoherent - that's the contradiction, not the collapse of trust per se. The podcast's consequentialist language is misleading here.

  The lying example is correct in outcome but wrong in reasoning. Kant's issue isn't that lying would become ineffective (that's practical), but that universal lying makes the very practice self-defeating through contradiction in conception. The host's version smuggles in consequences where Kant avoids them.

  Comparing the Categorical Imperative to the Golden Rule is problematic. The Golden Rule depends on personal preferences ("treat others as you want to be treated"), while Kant demands reasoning from universal law regardless of desires. The Golden Rule could justify immoral acts if someone doesn't mind being mistreated.

  The final claim about weighing inclinations against general welfare completely misses Kant's point. Kantian ethics isn't utilitarian - it's about duty derived from rational principles, not calculating communal benefit. The "whole community endorsement" idea confuses universalizability with actual consensus.

  For key corrections, the listener must understand: 
  - Kant rejects consequences as moral foundation 
  - Universalizability tests logical consistency, not outcomes 
  - Duty comes from rationality, not welfare calculations

  The summary's consequentialist drift isn't just presentation - it fundamentally misrepresents Kant's deontological framework. While the lying example works superficially, the reasoning underneath corrupts the philosophy.
