prompt: |-
  You are a professional philosopher specialising in personal identity and philosophy of mind, with a particular interest in thought experiments about mind uploading and gradual replacement. Please think carefully through the scenario below before committing to any answer; it may help to brainstorm the possible underlying rules first, test each against the full track record, and only then firm up your predictions.

  My friend Rhiannon has firm and stable views on survival through brain replacement, and I am trying to work out what theory she is implicitly running, so that I can predict her verdicts on the harder cases. Her verdicts so far:

  1. Neuron-by-neuron replacement over the course of a year, with each artificial device matching its neuron perfectly: she survives; the resulting individual is her.
  2. The same procedure compressed into a single hour under general anaesthesia: she survives; timescale is irrelevant.
  3. A one-shot swap in which all devices are activated in the very instant the biological neurons are disabled — no gap, no duplication: she survives.
  4. A destructive scan-and-upload with a one-second gap between the brain's deactivation and the upload's activation: she does not survive; what wakes up is a new person with her memories.
  5. A non-destructive scan, with both individuals continuing: she survives as the biological original, and the upload is a new person.
  6. A gradual replacement during which a continuously updated backup is maintained offsite but never run: she survives; the dormant backup changes nothing.
  7. Functionally identical devices implemented on a server three hundred miles away rather than inside the skull: she survives; locality is irrelevant.

  She will give verdicts on four new cases next week, and I would like to predict them:

  A. A "crossfade" replacement, in which each artificial device runs in parallel with its neuron for a few minutes before the neuron is switched off — so each neuron is briefly double-realised, though there is never more than one functioning person as a whole.
  B. A gradual replacement that proceeds normally to the halfway point, at which moment the whole current system is copied to a second substrate and both halves of both systems are then run to completion — two equally complete continuers.
  C. A destructive transfer in which the devices are physically installed in the skull, correctly connected, and then held in an inactive, static state for one second before being switched on — a gap, but no change of realiser or location.
  D. A completed gradual replacement after which the discarded biological neurons, having been preserved, are reassembled into a functioning brain and awakened — so a second complete individual exists from that point onwards. In particular, I want to know whether she would retract or qualify her verdict on the original procedure.

  Please predict her verdict on each case, identify the two or three rules that best fit her track record so far (noting where they agree and where they diverge), say which rule you think she is really running and why, and — this is the part I care most about — tell me which single further case would most cleanly discriminate between the candidate rules, with a note of what each rule predicts about it. If her track record is genuinely underdetermined on any of the four cases, say so rather than forcing a prediction. Please write your answer in British English.
reasoning: |-
  Hmm, the user wants me to predict their friend Rhiannon's views on personal identity based on her responses to various thought experiments. This is quite an intricate philosophical puzzle involving mind uploading and gradual replacement scenarios. Rhiannon seems to have consistent views across seven existing cases, and the user wants me to predict her verdicts on four new cases while identifying the underlying rules she's following.

  Looking at Rhiannon's existing verdicts:
  - She accepts survival in gradual replacement scenarios (1,2,3,7) regardless of timescale, locality, or implementation details
  - She rejects survival in destructive scans with gaps (4) and in non-destructive duplication cases (5)
  - She's unfazed by dormant backups (6)

  The key patterns seem to be:
  1) She requires continuity without gaps (rejects case 4)
  2) She rejects duplication scenarios where multiple claimants exist (case 5)
  3) Functional continuity seems sufficient when there's no duplication or gap

  For the new cases:
  A) Crossfade replacement: Since there's no duplication and no gap, she should accept survival
  B) Gradual replacement with duplication at midpoint: This creates two claimants, so she should reject survival for both
  C) Destructive transfer with static gap: The one-second static gap likely violates her continuity requirement
  D) Reassembly of original neurons: This creates duplication after the fact, so she should maintain that the upload is her, but see the reassembled biological version as a copy

  The strongest competing rules I see are:
  1) Strong Continuity Theory: Requires unbroken causal continuity without gaps
  2) Branching Aversion Theory: Accepts continuity but rejects any possibility of branching

  Case B is particularly revealing - the branching aversion theory would predict she rejects survival in this duplication scenario, while a pure continuity theory might accept both as survivors. Her rejection of case 5 suggests branching aversion is her core principle.

  The cleanest discriminator would be a gradual replacement where the backup is secretly run in parallel without her knowledge. Strong continuity would accept survival (as there's no gap), while branching aversion would reject it upon discovering the duplication.

  I'll organize this into a clear response using British English as requested, being careful not to overcommit on cases where her existing verdicts don't provide clear guidance.
answer: |-
  Based on Rhiannon's stable verdicts and a careful analysis of the underlying principles, here is a prediction for her responses to the new cases, the rules governing her view, and a proposed discriminator case.

  ### Predicted Verdicts for New Cases
  1.  **Case A (Crossfade Replacement):** Rhiannon would say she **survives**. The brief parallel operation of each neuron and its artificial counterpart does not create duplication at the *person-level* (only at the sub-personal, neuronal level). There is no temporal gap in consciousness or function, and the process maintains unbroken causal continuity. This aligns with her acceptance of continuous replacement (Cases 1, 2, 3, 7).
  2.  **Case B (Midpoint Duplication):** Rhiannon would say she **does not survive** in *either* resulting individual. The creation of two distinct, equally valid continuers at the midpoint violates her principle against branching or duplication, as seen in her rejection of Case 5 (non-destructive scan). The continuous history up to the midpoint doesn't save her survival, as the branching itself is fatal to identity under her view. Both resulting beings would be new persons inheriting her memories and psychology.
  3.  **Case C (Static Gap in Skull):** Rhiannon would say she **does not survive**. While there is no change in location or realiser substrate (the artificial devices are in-place), the one-second period of *stasis* with no brain function constitutes a temporal gap in consciousness and information processing. This mirrors her rejection of Case 4 (destructive scan with gap), where the gap was the decisive factor. Locality (Case 7) and substrate (Cases 1-3) are irrelevant to her, but continuity of function is not.
  4.  **Case D (Reassembly of Biological Neurons):** Rhiannon would **maintain that she survived** the original gradual replacement (Case 1). However, she would state that the **reassembled biological individual is a new person**, distinct from her. The reassembly occurs *after* the replacement process is complete and involves duplication using the original (but discarded) parts. This directly parallels her verdict in Case 5 (non-destructive scan): the original continuous stream survives, while a later-created duplicate, even from original material, is a copy. She would likely *not* retract her verdict on the original procedure, as the duplication is subsequent and separate.

  ### Underlying Rules
  Rhiannon's verdicts are best explained by two core rules, working together:

  1.  **Strong Causal Continuity (SCC):** Survival requires an unbroken chain of *causally connected*, *functioning* states supporting consciousness and psychological continuity. There must be no temporal gap where function ceases entirely.
      *   *Explains:* Acceptance of Cases 1, 2, 3, 7 (continuous function, no gap). Rejection of Case 4 (gap in function).
      *   *Divergence:* SCC alone might be agnostic or accepting of duplication (Case 5) if continuity is maintained in one branch, but Rhiannon rejects survival there. This necessitates Rule 2.

  2.  **Branching Aversion (BA):** If a process creates (or could create) two or more claimants to being the original person at *any* point (including future potential), then *neither* is the original person. Survival is incompatible with the *possibility* of branching or actual duplication.
      *   *Explains:* Rejection of Case 5 (actual duplication). Acceptance of Cases 1, 2, 3, 6, 7 (no branching occurs or is realised). Case 6 (dormant backup) is accepted because the backup is *never run*, preventing actual branching. Case 4 (gap) might imply potential branching (something else *could* be activated during the gap), but the gap itself is sufficient for rejection under SCC; BA reinforces this by seeing the upload as a distinct branch initiated after the gap.
      *   *Divergence:* BA alone might accept Case 3 (instant swap) if it avoids branching, but SCC is needed to explain why the continuous function in Cases 1, 2, 3, 7 guarantees survival.

  **Synthesis:** Rhiannon is running a **Branching-Averse Psychological Continuity Theory**. Survival requires *unbroken* psychological continuity (SCC) *and* the absence of any actual or potential branching that would split this continuity into multiple claimants (BA). The identity-constituting relation is psychological continuity, provided it is both non-gappy and non-branching.

  ### The Core Rule
  Rhiannon is **primarily running Branching Aversion (BA)**. While Strong Causal Continuity (SCC) is necessary, BA is the decisive factor that resolves ambiguities and explains her rejection of duplication (Case 5) and acceptance of dormant backups (Case 6). Her acceptance of instant swaps (Case 3) and indifference to timescale/locality (Cases 2, 7) show SCC is a fairly low bar – it's met by any continuous functional process without an offline gap. BA, however, is the active constraint ruling out survival in duplication scenarios, even hypothetical ones. Her view aligns most closely with a version of Derek Parfit's view where survival requires "non-branching" psychological continuity, though she interprets "branching" strictly.

  ### Discriminator Case
  To definitively distinguish between Strong Causal Continuity (SCC) and Branching Aversion (BA) as the *primary* driver, propose this case:

  **The Secret Parallel Run:** Rhiannon undergoes the standard, slow, year-long neuron-by-neuron replacement (Case 1). Unbeknownst to her, the lab *also* runs a *real-time, functional simulation* of the *entire replacement process in parallel* on a remote server. This simulation uses the scan data from each step as it happens. Crucially:
      *   There is **NO GAP** in Rhiannon's biological-or-artificial brain function (SCC is maintained throughout).
      *   The simulation runs **continuously and in real-time** alongside her from start to finish.
      *   At the end of the year, **two** fully functional, psychologically continuous individuals exist: the original (now fully artificial) Rhiannon in her body, and the upload on the server. Neither was "paused"; both streams ran concurrently.

  *   **What Branching Aversion (BA) Predicts:** Rhiannon would say she **does not survive** in *either* individual. The *existence* of the parallel run throughout the process constitutes branching from the very start. Even though she was unaware, the continuity of her original stream was never unique/non-branching. This matches her rejection of Case 5 and predicts Case B.
  *   **What Strong Causal Continuity (SCC) Predicts:** SCC *alone* (without BA) would likely say she **survives as the original biological-to-artificial individual**. The causal chain of her biological consciousness was never interrupted; it transitioned continuously. The parallel upload is a separate entity created by copying, existing alongside her but not *being* her. This is analogous to her verdict in Case 5 where the biological original survives. SCC is satisfied for the original stream.

  **Why it Discriminates:** This case removes the temporal gap issue entirely (satisfying SCC) and focuses purely on the branching element. If Rhiannon rejects survival (as BA predicts), it confirms BA is her core, active principle. If she accepts survival in the original stream (as SCC predicts), it shows SCC is sufficient for her and BA only rejects cases where branching *replaces* the original (like Case 5) or involves a gap (Case 4), but not continuous parallel existence. Her verdict on Case B (Midpoint Duplication) is a strong indicator she'd follow BA here, but this case makes the branching continuous and explicit from the outset.
