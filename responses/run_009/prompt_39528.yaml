answer: |-
  ### Exam Question  
  **Time Allowed: 90 minutes**  
  **Answer ONE question.**  

  1. **World W5** consists of exactly twelve point-particles existing for precisely one hour. Eleven particles drift inertially along straight lines for the entire duration. At the 30-minute mark, particles 7 and 9 undergo a single elastic collision and rebound; afterward, all particles resume drifting until the world ceases to exist.  
     A Humean "best system" analysis suggests the optimally simple and strong deductive system describing W5’s history includes a one-off exception clause: "All particles move at constant velocity except at t=30m, when particles 7 and 9 collide elastically and rebound."  
     Critically evaluate the implications of this case for **both** Humean and anti-Humean theories of laws. Your analysis must address:  
     (a) Whether the exception clause is a law or an accidental truth for the Humean, and what this reveals about the foundations of their view (e.g., simplicity, circularity).  
     (b) Whether the anti-Humean can coherently explain how laws "govern" in W5, including how their content is fixed and how we could know them.  
     (c) How this case challenges **both** views’ ability to ground a principled distinction between lawlike and accidental regularities.  
     (d) Whether the problem generalizes to the actual world (e.g., under finitude assumptions).  

  ---

  ### Model Answer (710 words)  

  World W5 exposes foundational tensions in both Humean and anti-Humean accounts of laws by forcing them to confront a scenario where the distinction between a law and a cosmic accident collapses. For the Humean, the exception clause ("particles 7 and 9 collide at t=30m") is almost certainly part of W5’s laws under the Best System Account (BSA). The system achieves maximal strength (it perfectly describes all events) with minimal complexity: stating a universal inertial rule plus one exception is simpler than listing twelve distinct particle trajectories or treating the collision as a "brute fact" outside the system. However, this reveals that the Humean’s core virtue of *simplicity* is doing unsustainable heavy lifting. Simplicity here is primitive and external to the laws—it cannot be explained by lawful regularities without circularity. If simplicity were grounded in laws (e.g., "simpler patterns are more lawful"), we would need prior laws to define simplicity, but the BSA uses simplicity to *define* laws. In W5, the exception clause *must* be a law because the system’s simplicity depends on it, yet this very simplicity is a pre-legal, intuitive metric the Humean cannot reduce. Thus, the Humean "bites the bullet" but exposes their reliance on an unexplained notion of simplicity that determines what counts as lawlike.  

  For the anti-Humean, W5 is equally problematic. If laws govern by necessitating events, what could they be in a world with only one deviation from inertia? Suppose the anti-Humean posits a law like "Particles always move inertially *except* when specific conditions C obtain at t=30m for particles 7 and 9." But W5’s history underdetermines C: C could involve unobserved properties (e.g., "particle essences"), arbitrary spacetime coordinates, or brute dispositions. Fixing C requires either ad hoc metaphysics (e.g., primitive causal powers that activate once) or an unacceptably disjunctive law. Worse, "governance" becomes vacuous: if laws merely describe the single collision, governance adds nothing beyond the event itself. If they impose necessity, why is there only one instance? Epistemic access is also mysterious: with no patterns to infer, how could observers in W5 distinguish a governing law from a coincidence? The anti-Humean might retreat to primitivism ("laws just govern, full stop"), but this reduces governance to an unexplained metaphor that does no work in W5. Thus, anti-Humeanism either inflates metaphysics or offers no advantage over the Humean description.  

  Crucially, **both** views fail to ground the law/accident distinction in W5. For the Humean, the exception clause is lawlike *only* because labeling it an "accident" would make the system less simple (e.g., by forcing a disconnected description of the collision). But this assumes we intuitively recognize that a universal rule + one exception is "simpler" than treating that exception as an unexplained anomaly—a distinction presupposing the very notion of natural uniformity the Humean aims to derive. For the anti-Humean, the collision cannot be governed without invoking contingent factors indistinguishable from accidents (e.g., "particle 7’s essence caused it to collide only then"). Both sides must *smuggle in* a prior distinction between lawful and accidental regularity to analyze W5, but neither can ground it in such a sparse world. The Humean relies on primitive simplicity; the anti-Humean on primitive governance.  

  This problem generalizes. If our universe has a finite history (e.g., cosmological models predicting heat death), all regularities are finitely many instances. A Humean "best system" for such a universe might include one-off exceptions for rare events (e.g., "all stars collapse into black holes except star X in 40,000 AD"). If simplicity prioritizes brevity, such exceptions become laws—eroding the intuition that laws are general. Conversely, anti-Humeans could posit governing laws for singular events, but this trivializes governance: if every event requires its own micro-law, laws lose their counterfactual force and unifying role. W5 thus forces both views to confront whether laws require *robust patterns*, and if so, whether sparse worlds have laws at all.  

  Ultimately, W5 shows that neither view can non-circularly define lawlikeness from the ground up. The Humean depends on an unanalyzed notion of simplicity; the anti-Humean on an unanalyzed notion of governance. In worlds without rich regularities, the distinction between laws and accidents collapses—suggesting both theories implicitly assume a background of complexity they cannot create.  

  ---  

  ### Marking Scheme (Total: 20 points)  

  1. **Humean commitment re: exception clause & implications** (3 pts)  
     *Must argue it is likely a law due to simplicity-strength trade-off.*  
     ❌ *Typical mistake:* Claims it’s an "accident" without addressing BSA mechanics.  

  2. **Exposure of Humean circularity/primitive simplicity** (4 pts)  
     *Must show simplicity cannot be grounded in laws without circularity.*  
     ❌ *Typical mistake:* Notes simplicity is important but doesn’t explain why it’s primitive.  

  3. **Anti-Humean challenges: governance, content-fixing, epistemology** (5 pts)  
     *Must critique all three: vacuous governance in W5, underdetermination of content, access problems.*  
     ❌ *Typical mistake:* Only discusses governance metaphor without epistemic/content issues.  

  4. **Failure of law/accident distinction for BOTH views** (5 pts)  
     *Must show both presuppose a distinction they can’t ground in W5.*  
     ❌ *Typical mistake:* Critiques one view only or conflates the distinction with general objections.  

  5. **Generalization to actual world (e.g., finitude)** (3 pts)  
     *Must suggest how sparse actual patterns threaten both views.*  
     ❌ *Typical mistake:* Mentions actual world without linking to finitude/rarity.  

  ---  
  **A vs. B Differentiation:**  
  An **A answer** (17–20) identifies that **both views illicitly presuppose the law/accident distinction** to analyze W5 (e.g., Humeans assume simplicity tracks "lawlikeness"; anti-Humeans assume governance isn’t ad hoc). It explicitly argues that W5’s sparsity collapses the distinction, forcing primitivism on both sides. A **B answer** (13–16) accurately critiques each view but treats them in isolation, misses the shared presupposition, or fails to show how the distinction *fails* in W5 for both.
