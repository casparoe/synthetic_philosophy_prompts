  ok so im a junior writing my ib extended essay in history and its kind of a mess. my supervisor is super into this whole "invented tradition" argument from the 1980s -- like how scottish clan tartans were basically standardized in the 1800s, how lots of national traditions are way younger than nationalists claim, and how a nation is an "imagined community" because you will never meet 99.9% of your fellow countrymen but still feel like you belong with them. anyway the guy i actually have to write about is ernest renan, the french philosopher who gave the famous "what is a nation" lecture in 1882. from what i understand his take was kind of the opposite direction -- he thought a nation is held together by shared memories, by wanting to keep the collective story going (he compared it to a daily referendum of the people or something like that), and he even said nations have to have already forgotten certain chunks of history together, like he brings up how french protestants and catholics each had to let go of old massacres for the nation to hold.

  so heres the actual question: if renan could somehow read the 1980s books arguing that most national traditions are invented and nations in the modern sense are pretty recent constructions, would he feel vindicated or attacked? on one hand he seems like he already half-agrees -- if the nation is a daily vote you keep making rather than some eternal essence, then maybe "sure, the traditions are constructed, that doesnt make them less real" is exactly his move. on the other hand maybe he'd say the invented-tradition crowd goes too far and dissolves the nation into just made-up stories, with no real collective will left over. please actually pick one side and defend it, and dont do the wierd "perhaps both in a sense" thing, my supervisor takes points off for that lol. and one bonus question i need for my conclusion: if renan were around for the brexit scottish independence debates, would he sympathize with the nationalists who say nations get to vote themselves into existence, or would he be more of a french republican "one indivisible nation and no secession" guy about it? again, pick a side. also if you think im misreading renan anywhere above, please tell me, i genuinely cant tell if the daily referendum thing is something he said or something i half-remember from sparknotes
