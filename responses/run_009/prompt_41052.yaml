answer: |-
  Republican liberty theory maintains that you are dominated regardless of the convention, because the state retains the *legal capacity* to exercise arbitrary power over your speech, irrespective of current restraint. The existence of a convention does not transform this power into non-arbitrary authority; it merely makes its arbitrary exercise less probable. Arbitrariness is defined by the absence of effective, institutionalized constraints requiring the state to track your interests and opinions in wielding this power—constraints that could be enforced *against* the state's will. While a convention might reflect de facto restraint, it remains a *gratuitous* forbearance, revocable at will and lacking the robust mechanisms of appeal and contestation that would render the power non-arbitrary. Thus, the objective structural relation of domination persists: the state’s unilateral control over the convention’s endurance confirms its arbitrary power over your communicative freedom. The epistemology of assessing conventions is a separate challenge, but it doesn’t negate the ontological fact of domination inherent in the state’s unconstrained legal capacity.  

