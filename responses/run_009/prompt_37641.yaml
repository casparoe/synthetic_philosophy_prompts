  ### **Locus of Advisor vs. Faculty Disagreement**  
  The core divide is **sub-question (c): Idealizations**.  
  - **Advisor (0.9 credence)**: Likely rejects idealizations as "smuggling in" non-physical assumptions. For her, "physical machine" implies finite, noisy, material constraints by definition.  
  - **Younger Faculty (0.4 credence)**: Treats idealizations as valid physical possibilities (e.g., "in-principle" relativistic spacetimes). Believes PCTT could be false even if no *buildable* device exists.  

  This explains why they talk past each other: One sees idealizations as *conceptually illegitimate*, the other as *empirically relevant*.  

