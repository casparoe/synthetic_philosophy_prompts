  - Vagueness issue gets p=0.3 since "physical machine" is porous but not meaningless
  - Discrete physics at p=0.6 because quantum gravity may surprise us
  - Idealizations matter at p=0.2 - accepting them makes PCTT clearly false in Newtonian worlds
  - Noise/cosmology at p=0.95 since thermodynamics seems absolute

  The advisor vs. young faculty divide likely centers on the physical discreteness question (b). The advisor probably sees continuum models as mere mathematical tools, while the younger scholar takes them as literal possibilities. A smoking gun would be detecting continuum structure in quantum gravity experiments - say if Planck-length measurements showed sub-Planckian resolution. That could push my credence to 0.3 instantly. 

  I should emphasize that the real conflict is about scientific ontology: is the continuum physically real or just a useful calculating device? That's why they talk past each other - one debates formalisms, the other debates the fabric of reality.
