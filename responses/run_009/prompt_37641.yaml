  | **(c) Idealizations: Do "in-principle" scenarios count?** | 0.20 | PCTT is falsified *only* if idealizations (infinite precision, zero noise) are physically possible. Yet thermodynamics/quantum measurement suggest such states are metaphysically impossible (not just impractical). |
  | **(d) Physical Constraints: Do chaos/noise/cosmology block exploitation?** | 0.95 | Thermal noise, chaos (sensitivity to initial conditions), and finite cosmological resources (e.g., Hubble time, Bekenstein bound) render *any* realization of hypercomputation physically unreachable. |

