prompt: |-
  I work as an underwriting analyst at a mid-sized reinsurer, and our pricing pipeline assumes that every submission can be reduced to a loss distribution: actuaries fit severity and frequency curves to historical data, apply loadings, and quote. This works for windstorm and motor liability, where we have decades of instrumented data. But over the past two years we've been getting submissions where there is no meaningful base rate — business-interruption cover for a novel pandemic pathogen, silent cyber exposure in a legacy industrial portfolio, and contingent liability for companies deploying AI systems that make consequential decisions about customers. Our underwriters disagree wildly about whether to treat these as ordinary risks (just use expert-judgment priors and price as usual) or as categorically different. I've been tasked with producing a written procedure the team can run on any submission, and I want it grounded in the actual theory of decision-making under ambiguity rather than in gut feel about "unknowable" risks.

  Here is the conceptual material I'd like the procedure to preserve, and the simplifications I'd like you to make explicit. The classic reference point is Ellsberg's three-color urn: betting on the color whose composition is known versus the one that is not, and the fact that people's choices there violate the sure-thing principle in a systematic way (the "ambiguity aversion" pattern). I understand there are several established ways to model this — subjective expected utility with a single prior that just encodes whatever we know, maxmin expected utility with a set of priors in the Gilboa–Schmeidler tradition, and smooth models in the style of Klibanoff, Marinacci, and Mukerji that separate second-order belief about which prior is right from an ambiguity attitude applied to it. I don't need the math; I need the procedure to translate the distinctions that matter: when "just put a prior on it" is defensible versus when it hides disagreement we can't justify aggregating; when treating all priors as equally possible is conservative versus sneaky (it isn't always either); and how expert disagreement, nonstationarity, and missing data should feed into whether a submission is flagged as ambiguous at all. Where the theory is genuinely contested — for instance, whether ambiguity aversion is a rational response to missing information, a proxy for how the world punishes overconfidence, or just a bias our procedure shouldn't institutionalize — the procedure should say which reading it is assuming and why, rather than presenting the choice as settled.

  The deliverable should be a table with these columns: Step number; Question asked about the submission; Evidence or input needed; What counts as a sufficient answer; Ambiguity trigger (what answer would flag the submission); and Action if triggered. The actions can be concrete underwriting options — price with a standard ambiguity loading, require co-insurance or policy exclusions, escalate to the risk committee, or decline — and I'd like the procedure to say which of those actions follows from which modeling tradition, so the team understands the reasoning, not just the verdict. Please make the procedure honest about where it will misfire and mark the steps where a judgment call cannot be eliminated.

  Then run it on three test submissions, at least one of which should produce an answer I won't like — in particular, include a case where we have abundant historical data but the underlying process has plausibly changed (e.g., flood exposure in a region where the climate baseline has shifted), such that the procedure flags it as ambiguous and blocks the routine renewal pricing our client expects. Another test case should be one where our own underwriters' disagreement is the main evidence of ambiguity, and the procedure has to say whether that disagreement is information or noise. Finally, for each test case, please conclude with a structured summary as a JSON object with these fields: "submission" (a short label), "ambiguity_flagged" (boolean), "triggering_steps" (list of step numbers), "recommended_action" (one of the concrete actions above), "modeling_tradition_relied_on" (string), "residual_judgment_call" (boolean), and "rationale" (two or three sentences). Follow the JSON objects with a short prose assessment of where the procedure is weakest overall.
reasoning: |-
  We are designing a procedure to determine when a reinsurance submission should be treated as ambiguous (in the Ellsberg sense) and what actions to take. The steps will be based on the theoretical distinctions in decision-making under ambiguity.

  We'll create a table with the following columns:
  1. Step number
  2. Question asked about the submission
  3. Evidence or input needed
  4. What counts as a sufficient answer
  5. Ambiguity trigger (what answer would flag the submission)
  6. Action if triggered

  Then, we'll run three test cases and produce the JSON summaries.

  The procedure must be grounded in ambiguity theory and make explicit the modeling traditions (like subjective expected utility, maxmin expected utility, smooth ambiguity) that justify the actions.

  Important: The procedure must be honest about where judgment calls are unavoidable and where it might misfire.

  Let's outline the steps:

  Step 1: Assess Data Availability and Quality
     Question: Is there sufficient historical data that is directly relevant, reliable, and stationary?
     Evidence: Historical loss data, exposure data, and any external data sources. Also, expert assessment of data relevance and stationarity.
     Sufficient answer: Data is available, covers a long enough period (e.g., multiple cycles for periodic events), and there are no known structural changes affecting the risk.
     Trigger: Data is insufficient (e.g., too few observations, missing key variables) or non-stationary (e.g., due to known regime shifts). Also, if data is available but experts disagree on how to interpret it (e.g., on trends or relevance) then trigger.
     Action: If triggered, move to Step 2. Otherwise, price as usual (using standard actuarial methods with a small loading for parameter uncertainty).

  Step 2: Evaluate Expert Consensus
     Question: Is there consensus among experts (including underwriters, actuaries, and external experts) on the base rate and the distribution of losses?
     Evidence: Records of expert opinions (e.g., from underwriting meetings, Delphi studies, or individual assessments). Quantify the range of base rates or key parameters.
     Sufficient answer: Experts agree on a base rate and the shape of the loss distribution (e.g., within a narrow band of confidence intervals).
     Trigger: Significant disagreement (e.g., base rate estimates vary by more than a factor of 2, or key parameters have a coefficient of variation above a threshold, say 0.5). Also, if experts cannot agree on the model structure (e.g., which distribution to use) then trigger.
     Action: If triggered, move to Step 3. Otherwise, price using a single prior (subjective expected utility) with a loading for parameter uncertainty.

  Step 3: Assess Model Uncertainty
     Question: Are there multiple plausible models for the risk, and do they lead to materially different loss distributions?
     Evidence: Alternative models proposed by experts, sensitivity analysis of model assumptions, and model validation tests.
     Sufficient answer: All plausible models produce similar loss distributions (e.g., 95% VaR within 10% of each other).
     Trigger: Models produce materially different loss distributions (e.g., 95% VaR differs by more than 20%).
     Action: If triggered, move to Step 4. Otherwise, use model averaging or a weighted prior and price accordingly (with an additional loading for model uncertainty).

  Step 4: Evaluate Nonstationarity and Structural Breaks
     Question: Is there evidence that the underlying risk-generating process is changing over time, or that past data is not representative of the future?
     Evidence: Statistical tests for structural breaks (e.g., Chow test), expert opinions on changing risk factors (e.g., climate change, regulatory shifts, technological disruption), and external indicators (e.g., scientific reports on climate, cyber threat intelligence).
     Sufficient answer: No evidence of structural breaks and experts believe the future will resemble the past.
     Trigger: Evidence of a structural break or nonstationarity (e.g., a detected break, or experts assign high probability to a changing environment).
     Action: If triggered, move to Step 5. Otherwise, use the most recent data and adjust for trends (but if Step 1 was triggered, we are already in ambiguity).

  Step 5: Assess the "Unknown Unknowns"
     Question: Are there known gaps in our understanding that could lead to unquantified risks (e.g., lack of data on interdependencies, potential for black swan events)?
     Evidence: Expert assessments of knowledge gaps, scenario analyses, and external research (e.g., academic papers highlighting emerging risks).
     Sufficient answer: All material risk drivers are understood and quantifiable.
     Trigger: Existence of material knowledge gaps or potential for extreme outcomes that are not captured in the models.
     Action: If triggered, then the risk is deemed ambiguous and we proceed to Step 6 for action.

  Step 6: Determine Ambiguity Action
     This step is not a question but the action to take when ambiguity is flagged (from any of the previous triggers). We must choose an underwriting action. The choice will depend on the nature of the ambiguity and the modeling tradition we follow.

     We will have several options, and the procedure should link them to the theory:

     Option A (Subjective Expected Utility - SEU): Use a single prior that aggregates all available information (e.g., the mean of expert opinions) and add a loading for ambiguity (e.g., a multiplier on the premium). This is defensible when disagreement is moderate and we can justify a consensus.

     Option B (Maxmin Expected Utility - MMEU): Use the worst-case prior from a set of plausible priors (the set being defined by expert opinions or models). This is conservative and reflects extreme ambiguity aversion.

     Option C (Smooth Ambiguity Model): Use a weighted average over priors (each prior representing a scenario or expert) and apply an ambiguity-averse utility function (e.g., using a concave transformation). This separates ambiguity attitude from belief.

     Option D: Require risk-sharing (co-insurance or reinsurance) to reduce exposure.

     Option E: Exclude ambiguous coverage (e.g., add exclusions for pandemics in a business interruption policy).

     Option F: Escalate to the risk committee for a strategic decision (e.g., when the ambiguity is too high and the exposure is large).

     Option G: Decline the submission.

     How to choose? The procedure must be guided by:

     - The degree of ambiguity (how wide the range of outcomes is and how much disagreement exists)
     - The potential for loss (if the worst-case is catastrophic, we lean towards conservative actions)
     - The company's risk appetite and strategic goals

     We will design Step 6 as:

     Input: The set of priors (from expert opinions or models) and the loss distributions they imply.

     Actions:

     6.1. If the range of expected losses (across priors) is moderate (e.g., within 20% of the mean) and the worst-case is not catastrophic (e.g., 99.5% VaR is within the company's risk tolerance), then use Option A (SEU with ambiguity loading). The loading could be based on the standard deviation of the expected losses across priors.

     6.2. If the range is wide and the worst-case is severe but not catastrophic, and the company is ambiguity-averse, then use Option B (MMEU) or Option C (smooth model). The choice between B and C depends on the company's ambiguity attitude (which is a judgment call). Alternatively, use Option D (co-insurance) to share the risk.

     6.3. If the worst-case is catastrophic (e.g., could threaten the company's solvency) and the ambiguity is high, then use Option E (exclusions) to remove the ambiguous part, or Option F (escalate) for large exposures, or Option G (decline) for exposures that cannot be mitigated.

     We must note that the choice between B and C is a judgment call because it depends on the company's ambiguity attitude. Also, the thresholds (moderate, wide, catastrophic) are judgment-based and should be set by the risk committee.

  Now, we'll create the table:

  | Step | Question | Evidence/Input | Sufficient Answer | Ambiguity Trigger | Action if Triggered |
  |------|----------|----------------|-------------------|-------------------|---------------------|
  | 1    | Is there sufficient, relevant, reliable, and stationary historical data? | Historical loss and exposure data; expert assessment of data quality and stationarity. | Data covers multiple cycles, is representative, and no known structural changes. | Data insufficient (e.g., < 10 years for a low-frequency risk) or non-stationary (e.g., known regime shift). | Proceed to Step 2. |
  | 2    | Is there consensus among experts on the base rate and loss distribution? | Expert opinions (quantified base rates and key parameters), range of estimates. | Experts agree on base rate (e.g., within 20%) and distribution (e.g., same family and parameters within a narrow band). | Significant disagreement (e.g., base rate estimates vary by > 50%, or multiple distribution families are proposed). | Proceed to Step 3. |
  | 3    | Do multiple plausible models lead to materially different loss distributions? | Alternative models, sensitivity analysis, model validation. | All models produce similar loss distributions (e.g., 95% VaR within 10%). | Models produce materially different distributions (e.g., 95% VaR differs by > 20%). | Proceed to Step 4. |
  | 4    | Is there evidence of nonstationarity or structural breaks? | Statistical tests, expert opinions on changing risk, external indicators. | No evidence of breaks and future expected to resemble past. | Evidence of structural break or nonstationarity (e.g., break detected or experts assign >30% probability to a change). | Proceed to Step 5. |
  | 5    | Are there material knowledge gaps or unquantifiable risks? | Expert assessment of knowledge gaps, scenario analysis, external research. | All material risks are quantifiable. | Material knowledge gaps exist (e.g., interdependencies not understood, potential for black swans). | Proceed to Step 6. |
  | 6    | How to underwrite the ambiguous risk? | Set of priors (from experts/models), loss distributions, company risk tolerance. | (Not applicable - this step is for action) | (Not applicable) | Choose action based on the degree of ambiguity and potential loss: 6.1 (SEU with loading) if moderate; 6.2 (MMEU or smooth) if wide; 6.3 (exclusions, escalate, or decline) if catastrophic. |

  Note: Steps 1-5 are sequential. If a step is not triggered, we break out and price accordingly (with standard methods or a single prior). Only if a trigger is hit do we proceed to the next step. If we reach Step 5 and it is triggered, then we go to Step 6. If Step 5 is not triggered, then we can use the available data and models (with adjustments) and price without treating as ambiguous.

  Now, we design three test cases:

  Test Case 1: Flood exposure in a region with a shifting climate baseline.
     - We have abundant historical data (50 years of flood losses) but the climate baseline has shifted (e.g., sea level rise, increased rainfall intensity). Experts disagree on how to adjust the historical data.

  Test Case 2: Business-interruption cover for a novel pandemic pathogen.
     - Little historical data (only COVID-19 is somewhat relevant, but the novel pathogen is different). Underwriters disagree on the frequency and severity.

  Test Case 3: Silent cyber exposure in a legacy industrial portfolio.
     - Some historical data on cyber losses, but the portfolio includes legacy systems that have not been exposed to modern cyber threats. Data might not be representative. Also, experts disagree on the potential for catastrophic losses.

  We'll run each through the steps and produce the JSON.

  We must also include one that produces an answer the user won't like (Test Case 1: flood exposure) because it blocks routine renewal.

  Let's run the cases:

  Test Case 1: Flood exposure in a changing climate
     Step 1: Data is abundant but nonstationary due to climate change -> Trigger (proceed to Step 2).
     Step 2: Experts disagree on how to adjust the data (some use trend factors, others use catastrophe models) -> Trigger (proceed to Step 3).
     Step 3: Different models (with and without climate adjustments) lead to materially different loss distributions -> Trigger (proceed to Step 4).
     Step 4: There is evidence of nonstationarity (climate change) -> Trigger (proceed to Step 5).
     Step 5: Knowledge gaps: future climate impacts are uncertain -> Trigger (proceed to Step 6).
     Step 6: The risk is ambiguous. The worst-case could be catastrophic (entire region flooded). We choose Option F (escalate to risk committee) because the exposure is large and we cannot exclude flood perils.

  Test Case 2: Pandemic business interruption
     Step 1: Little historical data (only one major pandemic) and not directly comparable -> Trigger.
     Step 2: Underwriters disagree wildly on frequency and severity -> Trigger.
     Step 3: Models are highly speculative and produce vastly different distributions -> Trigger.
     Step 4: Nonstationarity: pandemics might be more frequent due to global travel -> Trigger.
     Step 5: Knowledge gaps: novel pathogen characteristics unknown -> Trigger.
     Step 6: Worst-case is catastrophic (global pandemic). Option E (exclusions) or G (decline) might be chosen. Given the market, we might choose E (exclude pandemic) or if the client insists, then decline. But we'll say Option E: add exclusions.

  Test Case 3: Silent cyber in legacy systems
     Step 1: Data exists but might not be representative (legacy systems not in the data) -> Trigger (nonstationarity? We'll say yes because legacy systems are different and may be more vulnerable).
     Step 2: Experts disagree on the vulnerability of legacy systems -> Trigger.
     Step 3: Models: some models assume legacy systems are air-gapped and safe, others assume they are easy targets -> distributions differ -> Trigger.
     Step 4: Nonstationarity: cyber threat landscape changes rapidly -> Trigger.
     Step 5: Knowledge gaps: how legacy systems interact with modern networks? -> Trigger.
     Step 6: Worst-case could be catastrophic (e.g., a worm that spreads through legacy systems). We choose Option D (co-insurance) to share the risk, or Option E (exclude silent cyber). We'll choose D because the client might want coverage.

  Now, we produce the JSON for each.

  But note: The user won't like Test Case 1 because it's a routine renewal that gets escalated. We'll be explicit.

  Finally, we need a short prose assessment of the procedure's weaknesses.

  Let's write the JSON for each test case:

  Test Case 1: Flood exposure in a changing climate
  {
    "submission": "FloodRisk_RegionX",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 2, 3, 4, 5],
    "recommended_action": "escalate to the risk committee",
    "modeling_tradition_relied_on": "Maxmin Expected Utility (for the worst-case consideration) and institutional decision-making for large ambiguous exposures",
    "residual_judgment_call": true,
    "rationale": "Despite abundant historical data, climate change has introduced nonstationarity and expert disagreement. The worst-case scenario could be catastrophic, and the ambiguity is high. The risk committee must decide given strategic implications."
  }

  Test Case 2: Pandemic business interruption
  {
    "submission": "Pandemic_BusinessInterruption",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 2, 3, 4, 5],
    "recommended_action": "require policy exclusions",
    "modeling_tradition_relied_on": "Maxmin Expected Utility (to avoid the worst-case) combined with market constraints",
    "residual_judgment_call": true,  // because the choice of exclusion over decline is a judgment
    "rationale": "The risk is novel with little data and high disagreement. The catastrophic potential of a novel pandemic makes it uninsurable without exclusions, given current knowledge and risk appetite."
  }

  Test Case 3: Silent cyber in legacy systems
  {
    "submission": "Legacy_Cyber_Exposure",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 2, 3, 4, 5],
    "recommended_action": "require co-insurance",
    "modeling_tradition_relied_on": "Smooth ambiguity model (to average over priors) with risk-sharing to mitigate ambiguity",
    "residual_judgment_call": true,
    "rationale": "Data is not fully representative and experts disagree. Co-insurance allows us to take the risk while sharing the exposure, which is appropriate for moderate ambiguity and non-catastrophic worst-case."
  }

  Note: In Test Case 3, we assumed the worst-case isn't catastrophic. If it were, we might have chosen differently.

  Prose assessment of weaknesses:

  The procedure is weakest in two areas. First, the thresholds for triggering (e.g., "materially different" in Step 3, "moderate" in Step 6) are inherently judgment-based and may vary across risks. Setting these thresholds arbitrarily might lead to inconsistent outcomes. Second, the procedure relies heavily on expert judgment, which can be biased and may not capture true ambiguities. Moreover, in Step 6, the choice of action (especially between MMEU and the smooth model) is not fully specified by the theory and requires the underwriter to apply the company's risk attitude, which might not be explicitly quantified. Finally, the procedure does not account for the possibility that ambiguity might be reduced over time with learning, and it might be too conservative for risks that are ambiguous but have low severity.

  We must also note that the procedure might over-flag ambiguity in cases where the disagreement among experts is due to noise (e.g., different training) rather than genuine ambiguity. Conversely, it might under-flag when experts are overconfident and miss true ambiguity.
answer: |-
  ### Ambiguity Assessment Procedure for Reinsurance Submissions

  This procedure operationalizes decision theory (Ellsberg, Gilboa-Schmeidler, KMM) to distinguish between measurable uncertainty (risk) and ambiguity ("unknown unknowns"). Judgment calls are required at **Steps 2, 5, and 6** due to irreducible epistemological gaps.

  | Step | Question                                                                 | Evidence/Input Needed                                                                 | Sufficient Answer                                                                                                | Ambiguity Trigger                                                                                                                                 | Action if Triggered                                                                                                                                                                                                                                                                                                                                 |
  |------|--------------------------------------------------------------------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1    | Is there ≥10 years of directly relevant, instrumented loss data?         | Historical loss triangles, exposure data, policy wordings                             | Complete data covering multiple economic/event cycles; no material coverage gaps                                 | Data <10 years OR key variables missing OR data from non-analogous risks                                                                          | Proceed to Step 2                                                                                                                                                                                                                                                                                                                                   |
  | 2*   | Do ≥80% of domain experts agree on: <br>a) Loss distribution family? <br>b) Parameter ranges? | Delphi study results; documented expert disagreements; model validation reports       | Consensus on distribution family (e.g., Pareto) and parameters within ±15% of median estimate                    | <20% dissent on distribution OR parameter range >±30% of median estimate                                                                          | Proceed to Step 3<br>*Judgment: Distinguish genuine uncertainty from expert bias                                                                                                                                                                                                                                                                     |
  | 3    | Is the data-generating process stationary?                               | Statistical tests (e.g., Chow, CUSUM); climate/tech trend reports; regulatory scans   | p>0.05 on stationarity tests AND no material external changes documented                                         | Statistical evidence of drift (p<0.05) OR qualitative evidence of structural break (e.g., IPCC climate projections)                              | Proceed to Step 4                                                                                                                                                                                                                                                                                                                                   |
  | 4    | Can causal mechanisms be fully specified?                                | Scientific literature; engineering studies; stress-test scenarios                     | Documented causal pathways for >90% of expected losses                                                           | >10% of loss drivers involve poorly understood chains (e.g., AI decision cascades)                                                                | Proceed to Step 5                                                                                                                                                                                                                                                                                                                                   |
  | 5*   | Does the worst-case prior exceed risk appetite?                          | Enterprise Risk Management (ERM) limits; capital models; stress-test outputs          | 99.5th percentile loss <15% of surplus                                                                           | Plausible scenarios breach ERM thresholds OR linked to systemic risk                                                                              | Proceed to Step 6<br>*Judgment: Distinguish "fat tails" from true ambiguity                                                                                                                                                                                                                                                                          |
  | 6*   | Can ambiguity be reduced via contract design?                            | Legal precedents; policy exclusion databases; industry wordings                       | Proven exclusions for key ambiguities (e.g., "virus exclusion" in pandemic BI)                                   | No enforceable contractual mitigants                                                                                                              | **Final Action Selection**<br>Apply:<br>A: SEU with loading (if disagreement moderate)<br>B: MMEU (if conservatism justified)<br>C: KMM smoothing (if priors quantifiable)<br>D: Co-insurance ≥50%<br>E: Tailored exclusions<br>F: Risk committee escalation<br>G: Decline<br>*Judgment: Balance theory with market realities |

  \* = Steps requiring unavoidable judgment calls

  ---

  ### Test Case 1: Flood Exposure in Shifting Climate  
  **Background:** 30-year flood loss data in Southeast Asia. IPCC projects +1.5m sea-level rise by 2050. Client expects routine renewal.  
  - **Step 1:** Sufficient data → **No trigger**  
  - **Step 2:** 40% experts dispute stationarity → **Trigger** (Parameter range >30%)  
  - **Step 3:** Chow test p=0.01 for 2020 breakpoint → **Trigger**  
  - **Step 4:** Causal mechanisms changing (saltwater intrusion) → **Trigger**  
  - **Step 5:** 99.5th percentile loss = 22% of surplus → **Trigger**  
  - **Step 6:** No enforceable exclusion for "accelerated SLR" → **F: Escalate to risk committee**  
  ```json
  {
    "submission": "SEAsia_Flood_Renewal",
    "ambiguity_flagged": true,
    "triggering_steps": [2, 3, 4, 5],
    "recommended_action": "escalate to risk committee",
    "modeling_tradition_relied_on": "Gilboa-Schmeidler maxmin expected utility",
    "residual_judgment_call": true,
    "rationale": "Nonstationarity from climate shift creates unquantifiable model error. Expert disagreement reflects genuine ambiguity, not noise. MMEU justifies conservative hold pending committee review of climate assumptions."
  }
  ```  
  *Unpleasant Outcome:* Blocks routine renewal despite historical data. Forces confrontation with climate nonstationarity.

  ---

  ### Test Case 2: AI Decision Liability  
  **Background:** Coverage for AI credit-scoring systems. No loss data. Underwriters disagree on severity distribution.  
  - **Step 1:** No loss data → **Trigger**  
  - **Step 2:** 60% favor lognormal (mean $10M), 40% power law (mean $200M) → **Trigger**  
  - **Step 3:** N/A (no data) → **Trigger**  
  - **Step 4:** Causal chains opaque ("black box" AI) → **Trigger**  
  - **Step 5:** Power law scenarios breach ERM → **Trigger**  
  - **Step 6:** Exclusions for "algorithmic discrimination" enforceable → **E: Tailored exclusions + D: 50% co-insurance**  
  ```json
  {
    "submission": "AI_Credit_Scoring_Liability",
    "ambiguity_flagged": true,
    "triggering_steps": [1, 2, 4, 5],
    "recommended_action": "require co-insurance and policy exclusions",
    "modeling_tradition_relied_on": "Klibanoff-Marinacci-Mukerji smooth ambiguity model",
    "residual_judgment_call": false,
    "rationale": "Expert disagreement treated as quantifiable second-order uncertainty. Exclusions bound ambiguity domain; co-insurance shares unresolvable uncertainty. KMM permits pricing weighted priors."
  }
  ```  
  *Key Nuance:* Underwriter disagreement deemed "information" (quantifiable) not "noise" via Step 2 judgment.

  ---

  ### Test Case 3: Legacy Industrial Cyber  
  **Background:** Silent cyber in 1980s power plants. Some industry data, but no legacy-specific losses.  
  - **Step 1:** Partial data (non-legacy) → **Trigger**  
  - **Step 2:** 70% consensus on severity distribution → **No trigger**  
  - **Step 3:** Legacy systems have air-gapped architecture → **No trigger**  
  - **Step 4:** Causal paths understood (no cloud links) → **No trigger**  
  - **Result:** **No ambiguity flag** → Price with 20% parameter uncertainty loading  
  ```json
  {
    "submission": "Legacy_Power_Cyber",
    "ambiguity_flagged": false,
    "triggering_steps": [1],
    "recommended_action": "price with standard parameter uncertainty loading",
    "modeling_tradition_relied_on": "Subjective expected utility",
    "residual_judgment_call": true,
    "rationale": "Limited data offset by expert consensus and verifiable causal constraints. SEU applies with loading for parameter uncertainty. Step 2 judgment overruled residual doubts."
  }
  ```  

  ---

  ### Weaknesses of the Procedure  
  1. **Step 2 Vulnerability:** Relies on calibrated experts. May misclassify "groupthink" as consensus or true innovation risk as disagreement.  
  2. **Stationarity Assumption:** Step 3 statistical tests lack power for slow-moving threats (e.g., climate change). Over-relies on p-values.  
  3. **Action Selection Arbitrariness:** Step 6's choice between MMEU (pessimistic) and KMM (optimistic) is theory-consistent but empirically ungrounded.  
  4. **Epistemic Blindspot:** Cannot detect "unknown unknowns" beyond expert imagination (e.g., pre-2020 pandemic models).  

  **Recommendation:** Pair with quarterly "ambiguity audits" comparing procedure outcomes against emerging loss experience.
