answer: |-
  Here is a comprehensive specification of requirements for defending the Common Prior Assumption (CPA), structured around your concerns and expanded to cover critical philosophical and methodological challenges. Requirements are categorized, with conflicts highlighted and existing defenses assessed.

  ---

  ### **Core Requirements for Defending the CPA**
  **Bold** = Non-negotiable (logically necessary for coherence).  
  *Italic* = School-dependent (contingent on philosophical commitments).

  1.  **Ontological Clarification of the Prior**  
      **Non-negotiable**: Must specify *what kind of entity the "prior" is* and *when it exists*.  
      - **1a. Temporal/Logical Status**: Is it a historical state (pre-information), a counterfactual ("as if" uninformed), or a normative construct?  
      - **1b. Reconciliation with Lifelong Learning**: Address how agents who have always possessed private information (e.g., innate traits, prenatal environment) can meaningfully share a prior.  
      *Case for Requirement*: Avoids ambiguity in interpreting CPA-based models.

  2.  **Resolution of the Disagreement Paradox**  
      **Non-negotiable**: Must confront Aumann’s Agreement Theorem.  
      - **2a. Stance on Zero-Disagreement**: Either:  
        (i) Embrace it as a feature (rational agents *should* agree with common knowledge + CPA),  
        (ii) Reject it as a reductio (showing CPA is false/unrealistic), or  
        (iii) Restrict CPA’s scope (e.g., "within a community of reasoners").  
      - **2b. Handling Actual Disagreement**: Explain persistent rational disagreement if CPA holds (e.g., via computational limits, non-common knowledge).  
      *Case for Requirement*: CPA + common knowledge of posteriors implies no disagreement—a defining (and controversial) consequence.

  3.  **Genealogy of the Prior**  
      **Non-negotiable**: Must account for the *source* of commonality.  
      - **3a. Origin Story**: How did priors become aligned? (e.g., evolution, shared cultural indoctrination, pre-game communication).  
      - **3b. Non-Evidential Foundations**: Can priors reflect non-empirical factors (evolution, temperament, ideology) without violating CPA’s spirit?  
      *Case for Requirement*: Without origins, CPA is an unexplained deus ex machina.

  4.  **Epistemic vs. Pragmatic Justification**  
      **Non-negotiable**: Must declare whether CPA is:  
      - **4a. Descriptive**: Agents *actually* share priors (e.g., in efficient markets).  
      - **4b. Normative**: Rationality *requires* shared priors (e.g., to avoid Dutch books).  
      - **4c. Methodological**: A useful *modeling convention* (e.g., isolating information effects).  
      *Case for Requirement*: Defenses fail if they conflate these (e.g., pragmatic defenses can’t support normative claims).

  5.  **Treatment of No-Trade Theorems**  
      *School-dependent* (Subjective Bayesians reject this requirement):  
      - **5a. Role in Justification**: Clarify if no-trade results (agents won’t bet if priors are common) support CPA as rational, or merely restate it.  
      - **5b. Empirical Testability**: Can observed betting behavior validate/invalidate CPA?  
      *Case for Requirement*: No-trade is a key predictive consequence—defenses must explain its significance.

  6.  **Scope of "Private Information"**  
      *Non-negotiable*: Must define what counts as "information" separating priors from posteriors.  
      - **6a. Hidden Information vs. Priors**: Can Harsanyi’s "type spaces" absorb *all* prior differences into information?  
      - **6b. Tacit Knowledge**: Are differences in cognitive frameworks (e.g., heuristics) "information" or prior variance?  
      *Case for Requirement*: CPA collapses if prior differences are re-labeled as information.

  ---

  ### **Key Conflicts Between Requirements**
  - **Conflict 1: Ontology vs. Genealogy (1 vs. 3)**  
    If the prior is a *historical state* (1a), but agents have *always had private information* (1b), then a shared prior has no causal origin (3a). Defenses must choose: abandon historical priors (e.g., adopt normative priors) or posit a mythical "pre-information" state.  
  - **Conflict 2: Disagreement Paradox vs. Descriptive Use (2 vs. 4a)**  
    Aumann’s theorem implies zero disagreement under CPA + common knowledge—but real agents disagree persistently. A descriptive defense (4a) must either deny common knowledge (undermining game-theoretic foundations) or accept widespread irrationality.  
  - **Conflict 3: Normativity vs. Pragmatism (4b vs. 4c)**  
    A methodological defense (4c) can’t support the claim that rationality *requires* CPA (4b). Conversely, normative defenses can’t justify CPA as "just a tool."

  ---

  ### **Assessment of Leading Defenses**
  | **Defense**               | **Key Claims**                                                                 | **Fails Requirements**                                                                                                | **Succeeds At**                                  |
  |---------------------------|-------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|--------------------------------------------------|
  | **Harsanyi Doctrine**     | Prior differences reflect unmodeled asymmetric information.                   | **3a** (no origin for core common prior), **1b** (ignores innate differences), **6a** (circular if priors aren’t primitive). | **6a** (expands type spaces), **4c** (modeling tool). |
  | **Convergence Arguments** | Shared evidence erodes prior disagreement over time.                          | **2a** (Aumann shows convergence is impossible under CPA + common knowledge), **1a** (priors aren’t primitive states).    | **3a** (plausible for cultural priors).          |
  | **Pragmatic Defenses**    | CPA isolates information effects; no claim to truth.                          | **4b** (can’t justify normativity), **3a** (no origin story needed), **2** (ignores disagreement paradox).             | **4c** (methodologically sound), **1a** (avoids ontology). |
  | **Evolutionary/EDT**      | Priors shaped by natural selection or rational deliberation.                  | **1a** (priors are not pre-informational), **2a** (disagreement still problematic).                                  | **3a/3b** (origins via evolution), **4a** (descriptive). |

  ---

  ### **Conclusion: Is CPA Defensible?**
  Yes, **but only for constrained purposes**, as failures on non-negotiable requirements preclude universal defense:  
  - **Indefensible** as a *universal descriptive claim*: Conflicts 1 & 2 undermine real-world applicability (fails 1b, 2a, 3a).  
  - **Indefensible** as a *strict normative requirement*: No-trade theorems (5a) and disagreement (2a) don’t compel subjective Bayesians to adopt CPA (fails 4b, 5a).  
  - **Defensible** as a **pragmatic modeling convention** (4c): Avoids ontology/genealogy issues (satisfies 1a, 3a minimally) but cannot ground normative claims or explain real disagreement.  
  - **Plausible** for **bounded domains** (e.g., finance, evolutionary games): If agents share cultural/evolutionary priors (3a/3b) and common knowledge is approximated (relaxing 2a), CPA can descriptively hold for specific groups (satisfies 4a partially).  

  A successful defense must narrow CPA’s scope, reject historical ontology (adopt normative/conventional priors), and abandon descriptive universality. No existing defense satisfies all non-negotiable requirements simultaneously—**the conflicts are fatal to grand justifications**.
