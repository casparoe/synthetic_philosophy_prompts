prompt: |-
  I've just been made welfare officer for my college's student hardship fund -- actual money, about £4,000 a term, and I chair the committee of five that decides who gets what. Our decisions so far have been pure vibes and honestly it shows. Before the next round of applications I want to run a training session with the commitee (5 students plus me, 90 minutes, seminar room, whiteboard, no laptops needed) that makes us feel the difference between the three obvious answers to the "equality of what?" question: give the money to whoever is worst off in terms of how their life is going (welfare), whoever has the least stuff (resources), and whoever can do or be the least (capabilities, whatever exactly that amounts to). Design it for me.

  The heart of it should be a set of anonymised applicant dossiers -- invent them for me -- engineered so the three measures pull in different directions: the applicant who is serene and cheerful but objectively going under; the one with a decent maintenance loan who can't convert it into anything because of chronic illness; the one with expensive tastes; the one who has quietly adapted their preferences down to match what they have. I want each committee member to allocate the pot alone first, then compare allocations and see that they were running different measures without noticing, then be forced to re-allocate under an announced rule ("worst off in welfare terms" and so on) and watch the rules point at different people.

  Please structure your answer as: "Setup" (what I need to prep, roughly 100 words), "The dossiers" (six applicant write-ups, a short paragraph each, similar enough in tone that nobody stands out for the wrong reasons), "Running it" (a timeline of the 90 minutes including both voting rounds and when I should shut up), "Debrief" (how to map what happened onto the three views without me lecturing, and how to surface the things nobody will have articulated -- adaptive preferences, expensive tastes, conversion factors -- preferably by pointing at actual votes they just cast), "What will go wrong" (the predictable failure modes the first time through), and "What this can't do" (an honest note on which parts of the debate made-up applicants just can't reproduce -- I'm especially worried a fake dossier can't make anyone feel the force of adaptive preferences rather than just nod at it, but you tell me). Keep philosopher names out of it till the very end if at all possible; I want them to crash into the distinctions, not recognise them.
