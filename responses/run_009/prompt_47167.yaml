   1. The good must be constitutive of an activity: either a competitive game of skill or collaborative inquiry. Setting: ordinary and domestic.
   2. The failure must flow from derivability itself, not computational costs, fatigue, etc. Every fact is already possessed. The loss is that the activity cannot exist for the omniscient agent.
   3. Both start with identical beliefs. The omniscient one may end up with more beliefs, but that later difference cannot be the cause. If there's a partner/opponent, make them omniscient too.

   We need to construct a scenario where the bounded agent has a belief set but does not (yet) deduce a particular consequence. The openness of that consequence is essential to the activity.

   Candidate Scenarios:

   Candidate 1: A competitive game of skill (chess variant) with a hidden rule that is logically implied by the rules but not immediately obvious.
     - However, if the rules are known and the omniscient agent deduces the hidden rule immediately, then the game might become trivial or lose its challenge. But note: the opponent must also be omniscient. So both players would know everything, and the game might be solved instantly? Then the activity (the competitive game) collapses because there's no meaningful play.

   Candidate 2: Collaborative inquiry. Two agents are trying to solve a puzzle together. The puzzle is such that the solution is already logically entailed by their shared beliefs, but they haven't deduced it yet. The value of the collaboration lies in the process of jointly discovering the solution. If one agent is omniscient, then the moment the inquiry starts, that agent already knows the answer. The collaboration then becomes pointless because the omniscient agent cannot genuinely participate in the discovery process.

   However, constraint 2 says: "no appeal to ... anyone exploiting the agent; and the agent must not be pained by what it knows". Also, we cannot have the omniscient agent wishing it didn't know. The loss must be that the activity cannot exist.

   Let's develop Candidate 2: Collaborative inquiry.

   Scenario: Two friends, Alex and Bailey, are amateur philosophers. They meet weekly to discuss thought experiments. This week, they are going to discuss a particular thought experiment that Alex has designed. The thought experiment is constructed so that it logically leads to a surprising conclusion. Both Alex and Bailey are given the same set of premises. The activity is the collaborative inquiry: the joint effort to work through the implications and discover the conclusion.

   For the bounded version:
     - Alex and Bailey are both bounded reasoners. They start with the same set of premises (the thought experiment description and some background knowledge). They do not immediately see the conclusion. The value of the activity is in the process of reasoning together: the back-and-forth, the building of ideas, the shared "aha!" moment.

   For the omniscient version:
     - Both Alex and Bailey are logically omniscient. As soon as the thought experiment is presented, they both immediately deduce the conclusion. There is no process of discovery. The activity of collaborative inquiry collapses because there is nothing to inquire about.

   But note: the problem must not be that the omniscient agent is pained by knowing too much. The issue is that the activity (collaborative inquiry) requires that the conclusion is not already known at the start. The activity is constituted by the process of discovery.

   However, we must ensure that the premises are in the agent's possession before the activity begins, and the failure is due to derivability.

   Let's formalize:

   Initial beliefs (for both agents):
     - P1, P2, ... Pn: the premises of the thought experiment, which together entail C (the conclusion).

   The open proposition for the bounded agent: whether C is true? Actually, the conclusion C is not believed by the bounded agent at the start, even though the premises entail it. The bounded agent does not believe C and does not believe not-C (unless that is also entailed, but let's assume the premises are consistent and only entail C). The openness is that the agent does not know C, and the process of reasoning is aimed at settling C.

   Why is the openness constitutive? The collaborative inquiry is defined as a joint effort to discover the truth about C. Without the openness of C, there is no discovery to be made.

   For the omniscient agent: as soon as it has the premises, it believes C. So for that agent, C is settled at the start. The activity of collaborative inquiry (as a process of discovery) cannot take place.

   But note: the activity is scheduled to take place at a specific time. The initial beliefs are held before the activity. The omniscient agent, having the premises before the meeting, already deduces C. The bounded agent does not.

