  Okay, the user is working on their ethics class final and wants to explore whether everyday conventions like tipping, waiting in line, and not jaywalking are moral obligations or just habits. They need a "spec" for a theory that can handle this, including cases it must address, distinctions it must make, and any conflicts between requirements.

  First, I need to understand their main request. They want a list of requirements for a good ethical theory on this topic. The key elements are: cases to get right (tourist tipping, jaywalking at 3am empty street, cutting an unwatched line), distinctions not to collapse (like unfairness vs. local rule), and identifying non-negotiable vs. debatable requirements. Also, they want to know if any requirements conflict, as that's the "interesting part" for their teacher.

  The user is likely an undergrad student. They mentioned not wanting citations or readings yet, so I should keep the response theoretical and structured. Their deeper need might be to frame their argument effectively and identify philosophical tensions to impress their teacher. They might also want to ensure their approach covers all bases without bias.

  Now, breaking down the requirements. I'll start with the cases they provided. The tourist tipping scenario tests whether obligations are universal or contextual. Jaywalking at 3am examines harm vs. rule-following when no one is around. Cutting an unwatched line probes whether morality depends on observation or intrinsic fairness.

  For distinctions, the big one is fairness versus convention. Also, moral weight of intentions versus outcomes, and whether rules are context-dependent. Non-negotiables could include avoiding universal rules that ignore context or collapsing moral reasons into mere habits. Debatable requirements might involve how much weight to give to local norms or whether fairness is paramount.

  Conflicts are crucial. For example, if a theory respects local norms (like requiring a tourist to tip), but also demands fairness (tipping might be unfair if the system exploits workers), that's a tension. Similarly, jaywalking when harmless might be fine by harm principle, but if rule-following is a moral obligation regardless, that conflicts. The line-cutting case highlights conflict between observable fairness and internal consistency.

  I should structure the response clearly: first, cases to handle, then distinctions, then non-negotiables, debatables, and conflicts. Emphasize that conflicts are where theories might differ, like consequentialism vs. deontology. The student needs this to build their argument, so providing a framework they can apply to different philosophers later will be helpful.
answer: |-
  Here's a "spec" for a theory tackling the morality of everyday conventions, focusing on your core needs. Think of this as the checklist your ethical theory needs to fulfill to be robust and handle the complexities you outlined.

  **Core Goal of the Theory:** To distinguish between social conventions that are *merely habitual/customary* and those that carry genuine *moral weight*, explaining *why* and *under what conditions* the latter is true.

  **I. Cases the Theory MUST Get Right (Benchmark Scenarios):**

  1.  **The Obligated Tourist (Tipping):** Does a tourist from a country with no tipping culture have a *moral obligation* to tip service staff in a country where it's the established norm (e.g., the US), even if they find the system arbitrary? Why/why not?
  2.  **The Empty Street (Jaywalking):** Is it morally wrong to jaywalk across a wide, completely empty street at 3:00 AM with perfect visibility and no traffic for miles? Does the *reason* for the rule (safety vs. order) matter here?
  3.  **The Unobserved Line-Cutting (Fairness/Enforcement):** If you are *certain* no one is watching and no one will ever know, is it morally wrong to cut into the middle of a long line (e.g., for a concert)? Does it matter *why* you're cutting (emergency vs. laziness)?
  4.  **The Burdened Regular (Exploitation):** Does a person who *always* scrupulously follows the convention (e.g., always tips 20%, never jaywalks, always queues) have a moral obligation to *keep doing so* if they observe others routinely flouting it without consequence? When does fairness tip the scales?
  5.  **The Harmless Deviation (Intent vs. Outcome):** Is it morally equivalent to jaywalk dangerously during rush hour versus doing it completely safely on the empty street? Does *intent* (recklessness vs. careful assessment) or purely the *outcome* (actual risk/harm caused) determine wrongness?
  6.  **The Context Shift (Changing Norms):** Is it morally wrong to follow a convention that is the norm *here* but considered rude or immoral *there* (e.g., tipping in Japan vs. the US, queueing intensity in different cultures)? How does location change the obligation?

  **II. Critical Distinctions the Theory MUST Maintain (Cannot Collapse):**

  1.  **Wrongness due to Unfairness/Harm vs. Wrongness due to Rule-Breaking:** This is paramount. The theory must clearly separate:
      *   Actions wrong because they directly harm others, exploit them, or create unfair burdens (e.g., cutting in line deprives others of their turn, not tipping underpaid staff exploits their labor).
      *   Actions "wrong" *only* because they violate an established social rule, even if no harm/unfairness occurs in a specific instance (e.g., jaywalking on the empty street, wearing white after Labor Day purely as a fashion faux pas).
  2.  **Moral Weight vs. Prudential/Practical Reasoning:** Distinguish actions avoided because they are *immoral* from those avoided for practical reasons (e.g., fear of getting caught/fined, desire to avoid social disapproval, or simple habit).
  3.  **The Basis of the Rule:** Why does the convention exist? The theory must account for whether the rule's *underlying purpose* (safety, efficiency, fairness, preventing harm) grants it moral force, or if its *mere existence as a rule* does.
  4.  **Intent vs. Outcome:** Can an action *be* morally wrong even if no bad outcome occurs (e.g., reckless jaywalking that luckily harms no one)? Conversely, is an action morally acceptable if done with good intent but causes harm? The theory must have a stance on this tension within conventions.
  5.  **Individual Act vs. System Maintenance:** Does breaking a harmless instance undermine the *system* that depends on general compliance for its beneficial effects (e.g., if everyone jaywalked only when *they* thought it safe, chaos might ensue)?

  **III. Non-Negotiable Requirements (What *Any* Plausible Theory Must Do):**

  1.  **Avoid Universal Prescriptivism:** It cannot simplistically state "Always follow all conventions" or "Never follow any convention." Context must matter.
  2.  **Account for Harm & Unfairness:** It *must* recognize that conventions causing direct harm or creating systemic unfairness can generate genuine moral obligations (e.g., *not* to participate uncritically) or wrongness in flouting them if it exploits others.
  3.  **Explain the "Why":** It cannot just describe conventions; it must provide a *reasoned account* for *when* and *why* adherence rises to the level of a moral obligation beyond habit or prudence.
  4.  **Handle the Benchmark Cases Coherently:** It must provide consistent, non-contradictory answers to the scenarios in Section I, even if those answers are nuanced.
  5.  **Maintain Distinction #1:** It absolutely *cannot* collapse harm/unfairness into mere rule-breaking or vice-versa. This is foundational.

  **IV. Debatable Requirements (What Theories Might Reasonably Disagree On):**

  1.  **Primacy of Local Norms:** How much moral weight *should* local customs carry for outsiders or dissenters? (e.g., *Must* the tourist tip?).
  2.  **The Significance of "Purity" of Motive:** How important is the *reason* for following/flouting (respect, fear, calculation, rebellion) versus the act itself?
  3.  **The Moral Weight of Rule-Breaking *Per Se*:** Does violating *any* socially established rule, even a harmless one, carry *some* inherent moral wrongness (e.g., undermining social coordination, showing disrespect for the community)?
  4.  **The Threshold for "Harmless":** How certain must one be that an act causes no harm/unfairness (e.g., the empty street) for rule-breaking to be permissible? What counts as acceptable risk? Does *potential* harm matter equally to *actual* harm?
  5.  **Obligation to Uphold Unjust Systems:** Does consistently following a convention that relies on general compliance (like queuing) create an obligation to keep following it *even if* you think the system is somewhat flawed, simply to prevent chaos?

  **V. Potential Conflicts Between Requirements (The "Interesting Part"):**

  1.  **Respecting Local Norms vs. Avoiding Unfairness/Exploitation:** This is the **BIG ONE**.
      *   *Conflict:* Requiring the tourist to tip respects the local norm (Debatable Requirement #1), but if the tipping system is seen as exploiting workers/shifting wage burden unfairly (Non-Negotiable #2), does adhering to it become morally *problematic*? Can you respect the norm *and* avoid complicity in perceived unfairness? (e.g., Is tipping extra to ensure fair pay morally required, or is participating at all endorsing a bad system?).
  2.  **Harm Principle vs. Rule-Upholding for System Stability:**
      *   *Conflict:* Jaywalking on the empty street causes no harm (Non-Negotiable #2 satisfied for *this act*). But if the theory argues that *system stability* requires general rule-following (Debatable Requirement #5 or #3), then flouting even harmless instances might be wrong. Can the theory consistently allow harmless exceptions *without* endorsing widespread rule-breaking that *would* cause harm? How?
  3.  **Fairness Demands vs. Unobserved Acts:**
      *   *Conflict:* Cutting an unwatched line causes unfairness (Non-Negotiable #2) – others wait longer *because* of your action. However, if no one knows, the *social* dimension of fairness (being seen as fair, avoiding conflict) is absent. Does the unfairness retain *full* moral weight purely based on the abstract principle, even when undetected? Or is some moral weight linked to the social context and potential for conflict? (This tests the robustness of Distinction #1).
  4.  **Intent vs. Outcome in Rule Application:**
      *   *Conflict:* Someone carefully jaywalks safely (good intent, good outcome). Someone else jaywalks recklessly but gets lucky (bad intent, good outcome). Non-Negotiable #4 demands the theory handle intent vs. outcome. If the theory prioritizes *outcome*, the reckless act might be permissible (if lucky). If it prioritizes *intent* or *character*, it might condemn the reckless act even with a good outcome. How does this apply to the *convention* itself? Is the rule about the act, the risk, or the attitude?

  **In Summary:** Your theory needs to navigate between the Scylla of rigid rule-worship and the Charybdis of chaotic individualism. Its core task is to pinpoint the *source* of moral obligation within conventions: does it come from the *consequences* of actions (harm, fairness), the *nature* of the act itself or the rule (duty, respect), the *intentions* behind it, or the *social fabric* it sustains (or erodes)? The conflicts highlighted above are where different ethical frameworks (utilitarian, deontological, virtue ethics, contractualist) will likely diverge most sharply. Good luck with your final! This is a fantastic topic.
