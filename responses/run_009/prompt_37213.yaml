          - Also, reveal the population growth and the fact that the government changed the way violence was recorded over time.

     - Then ask groups to reconsider: "Given this new context, does your commission stand by its conclusion? Why or why not? You have 5 minutes to discuss and then we'll hear brief reactions."

     **5. Debrief and Mapping to Real World (15 minutes)**
     - Lead a discussion with questions (not lecturing). Possible questions:
          - What was the most challenging part of deciding whether violence declined?
          - Did different commissions come to different conclusions even though they had the same data? Why?
          - How did the mandate you were given influence your analysis?
          - When we revealed more context about the data (like when categories were added), how did that change your view? 
          - What counts as violence? Who gets to decide? (e.g., environmental deaths: are they violence? What if they are caused by corporate negligence? What if they are indirect?)
          - Is it more important to look at the absolute number of violent acts or the per capita rate? Why?
          - In the real world, when we ask "is the world becoming less violent?", what are some of the same challenges? (e.g., how do we count domestic violence that was underreported in the past? How do we account for new forms of harm, like cyberbullying or environmental harm?)
          - Once we fix the definitions and the measurement choices, is there a fact of the matter? Or does the answer still depend on what we value? (e.g., if we value individual safety, per capita might matter; if we care about the total amount of suffering, absolute might matter.)
          - Is the choice of definitions itself a factual question (what is violence?) or a values question (what should we consider violence?)?

     **What will predictably go wrong:**
     - Some groups might get stuck on calculations (per capita). Solution: provide a calculator or pre-calculate per capita for a few points? Or just let them do rough estimates.
     - Groups might not notice the traps and just add up all the numbers without considering the context. The revelation of context in step 4 is designed to address that.
     - Time: 45 minutes for group work might be tight. They might need more time. Be ready to adjust.
     - The groups with mandates to show a particular outcome might feel forced and not engage authentically. Emphasize that the mandate is part of the simulation and they should play their role, but also think critically.

     **What the simulation can't capture about the real debate:**
     - The stakes: In the real world, these debates are not just academic. They inform policy, funding, and political narratives. People have emotional and ideological investments. In our simulation, the students are role-playing and don't have a stake in Zorblax.
     - The complexity of historical data: We are giving them a clean dataset. Real historical data is messy, incomplete, and contested in ways that are hard to simulate.
     - The moral weight: Real violence involves human suffering. A simulation with abstract numbers can't convey that.

     **Materials to prepare:**
     - Handouts for each group: 
          - The dataset (table without totals, just the raw numbers and population)
          - Their secret mandate
          - Instructions for the group work
     - A slide for the additional context reveal.

     This should fit within 75 minutes if managed tightly. Good luck!
answer: |-
  ### Simulation: "Zorblaxian Violence Audit"  
  **Goal:** Students grapple with how measurement choices (per capita vs. absolute, defining "violence," data gaps) shape conclusions about violence trends.  

  ---

  ### **Rules & Setup**  
  **Time:** 75 minutes  
  **Students:** 25, split into 5 commissions of 5 students each.  
  **Materials:**  
  - Commission briefs (1 per group)  
  - Dataset handouts (see below)  
  - Calculators (optional)  
  - Whiteboard for debrief  

  ---

  ### **Phase 1: Commissions Analyze Data (25 min)**  
  Each commission gets:  
  1. **A "Secret Mandate" Brief** (assign roles covertly):  
     - **Commission A (Gov’t Loyalists):** *"Prove violence declined. The ruling party’s reputation depends on it."*  
     - **Commission B (Activists):** *"Prove violence increased. Your NGO needs evidence to demand policy reform."*  
     - **Commission C (Absolutists):** *"Use TOTAL deaths only. Ignore population size."*  
     - **Commission D (Per Capitans):** *"Use DEATHS PER 1M PEOPLE. Prioritize citizen safety."*  
     - **Commission E (Definition Purists):** *"Only count VIOLENT INTENT. Exclude accidents/negligence."*  

  2. **Dataset: Zorblaxian Deaths (Years 1-100)**  
     - **Population:** Grows from 1M (Year 1) to 20M (Year 100).  
     - **Categories:**  
       | Year | Population (M) | Ritual Sacrifice | Gladiator Duels | Tavern Brawls | Factory "Incidents" |  
       |------|----------------|------------------|-----------------|---------------|---------------------|  
       | 1    | 1              | 200             | 150             | 0             | 0                   |  
       | 20   | 3              | 180             | 140             | 0             | 0                   |  
       | 40   | 6              | 100             | 100             | 0             | 0                   |  
       | 60   | 12             | 50              | 0               | 400           | 0                   |  
       | 80   | 16             | 10              | 0               | 700           | 300                 |  
       | 100  | 20             | 5               | 0               | 900           | 800                 |  

     **Traps Embedded:**  
     - **Ritual Sacrifice:** Declines (state-regulated, becomes rare).  
     - **Gladiator Duels:** Disappear after Year 50 (banned by law).  
     - **Tavern Brawls:** Appear in Year 60 (new crime code; previously unreported "private fights").  
     - **Factory "Incidents":** Appear in Year 80 (recording starts after Worker Safety Act; includes industrial accidents/negligence).  
     - **Population:** 20x growth → absolute vs. per capita will diverge sharply.  

  3. **Task:**  
     - Calculate trends using your mandate.  
     - Answer: **"Did violence decline in Zorblax (Year 1–100)?"**  
     - Prepare a 1-minute report justifying your conclusion.  
     - *Anticipated Conflict:* Groups A/B will clash immediately; C/D will disagree on metrics; E may exclude Factory data.  

  ---

  ### **Phase 2: Initial Reports & Data Reveal (20 min)**  
  1. **Commission Reports (5 min total):**  
     Each group gives a 1-min verdict. *Do not let groups reveal their mandates yet.*  
     - *Likely Outcomes:*  
       - A/C: "Declined!" (focus on Ritual/Duel decline + absolute totals).  
       - B: "Increased!" (uses Factory data + rising Brawl totals).  
       - D: "Mixed/declined per capita." (notes population growth).  
       - E: "Declined." (ignores Factory data as "not intentional").  

  2. **Data Reveal (5 min):**  
     Drop new context:  
     > *"Zorblaxian historians just uncovered:  
     > - **Tavern Brawls:** Unrecorded before Year 60 (considered ‘private matters’).  
     > - **Factory ‘Incidents’:** Caused 100+ deaths/year pre-Year 80 (but no records exist).  
     > - **Gladiator Duels:** Replaced by underground fight clubs (no data)."*  

  3. **Re-deliberation (10 min):**  
     - Groups revisit their verdicts.  
     - *Key tension:* How do gaps/definitions change conclusions?  

  ---

  ### **Phase 3: Debrief (30 min)**  
  **Guiding Questions (NO lecturing—students drive convo):**  
  1. *"What frustrated you about determining if violence declined?"*  
     - *(Surface: Data gaps, missing categories, changing definitions.)*  

  2. *"Why did commissions with the SAME data disagree?"*  
     - *(Expose: Mandates shaped what they counted/how.)*  

  3. *"When we revealed hidden contexts (e.g., unreported brawls), how did your verdict change? Why?"*  
     - *(Highlight: Visibility bias—new laws ‘create’ violence in data.)*  

  4. *"Is ‘per capita’ or ‘total’ more truthful? Does your answer depend on who you are?"*  
     - *(Example: A mayor cares about per capita risk; a victim’s family cares about absolute harm.)*  

  5. *"What counts as ‘violence’? If a factory owner cuts safety costs and workers die, is that violence? Why/why not?"*  
     - *(Link to real world: Is structural inequality/negligence violence?)*  

  6. *"In the real ‘declining violence’ debate, where might these traps appear?"*  
     - *(E.g., historic underreporting of domestic violence; modern cyberbullying.)*  

  7. *"Once we define terms, is there an objective answer? Or is defining violence itself a values judgment?"*  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong:**  
  1. **Calculation Chaos:** Students miss population growth or miscompute per capita.  
     - *Fix:* Give a simple per capita example upfront (e.g., *"Year 1: 200 deaths / 1M pop = 200 per million"*).  

  2. **Over-Simplification:** Groups ignore traps (e.g., Activists use Factory data without questioning its late appearance).  
     - *Fix:* After initial reports, ask: *"Did anyone doubt the categories? Why?"*  

  3. **Time Crunch:** 25 min for analysis is tight.  
     - *Fix:* Assign roles in groups (e.g., calculator, note-taker, devil’s advocate).  

  4. **Mandate Resistance:** Students dislike biased roles (e.g., Purists insist Factory deaths "count").  
     - *Fix:* Encourage them: *"Your mandate reflects real-world stakes—play the role to discover pressures experts face."*  

  **What the Simulation CAN’T Capture:**  
  - **Emotional Stakes:** Real violence debates involve trauma, politics, and identity. On Zorblax, no one mourns the dead.  
  - **Data Fog:** Real history has patchy, politicized records (e.g., colonial archives). Our dataset is clean and complete—unlike the mess of ancient crime logs or disputed modern stats.  
  - **Power Dynamics:** In reality, definitions of violence are set by those in power (e.g., governments excluding "state-approved" harm). Here, students have equal footing.  

  ---

  ### **Instructor Notes**  
  - **Prep:** Print briefs/datasets. Pre-calculate 1–2 per capita examples to show.  
  - **Roleplay Push:** Emphasize mandates aren’t "cheating"—they mirror how think tanks/states use data.  
  - **Real-World Bridge:** In debrief, namecheck Pinker *after* students articulate traps ("You encountered what Pinker’s critics call...").  
  - **Ethics Hook:** End with: *"If defining violence isn’t neutral, who SHOULD decide? Scientists? Voters? Victims?"*  

  This simulation forces students into measurement dilemmas they can’t Google. They’ll leave skeptical of headlines—and that’s the point.
