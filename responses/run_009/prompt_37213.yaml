     Now, per capita without Env at Year 10: 35 per million, at Year 100: 5.1 per million -> decline.
     With Env at Year 10: 35 per million, at Year 100: 55.1 per million -> increase.

     And absolute without Env: 350 to 510 -> increase? But note: in between it went down (e.g., Year 20: 135, Year 50: 150) but ends higher? We can adjust the brawls to be lower? Or we can make the without Env total at Year 100 lower than Year 10? Because 510>350. Let's set Year 100 without Env to 300? Then per capita 3 per million. And with Env 5300? Then per capita 53 per million. But how?

