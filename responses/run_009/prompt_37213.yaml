     **3. Group Reports and Initial Debate (10 minutes)**
     - Each group presents their 2-minute report. They will likely come to different conclusions.

     **4. Reveal of Additional Data and Context (10 minutes)**
     - After the reports, reveal more context:
          - "Update: After your initial reports, the Zorblaxian Historical Society has provided new information: 
              - The category 'Brawls' was only added in Year 50 when the Anti-Brawling Act was passed. Before that, such incidents were not recorded because they were considered a normal part of life and not a crime.
