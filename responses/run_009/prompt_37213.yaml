          - A secret mandate (one per group):
              - Group 1: "Your commission must produce a report that shows violence has declined. The ruling party's re-election depends on it."
              - Group 2: "Your commission must produce a report that shows violence has not declined. The opposition party plans to use this to challenge the ruling party."
              - Group 3: "Your commission must focus on the absolute number of violent incidents, regardless of population changes."
              - Group 4: "Your commission must focus on the per capita rate of violence, because that's what matters for the average citizen's safety."
              - (If a fifth group) Group 5: "Your commission must consider all categories equally, but note that the government has defined violence as only physical harm intentionally caused by one person to another (so exclude environmental contamination)."
          - Instructions: 
              - "You have 30 minutes to analyze the data and prepare a 2-minute report. Your report must state: (1) Your conclusion: has violence declined? (2) The main evidence for your conclusion. (3) Any caveats or concerns about the data."
              - "Then, you will present your report to the class. After the initial reports, we will reveal additional data and context, and you will have a chance to reconsider."

