prompt: |-
  I'm a third-year PhD student in quantitative social science, writing the "methodological stance" section of my dissertation prospectus. My supervisor insists that we state our commitments explicitly so the committee can probe them, and I've now got mine written down. Before I submit, I want a consistency audit. Here is the set:

  1. Disaggregate by default. Given a choice of level of analysis, the more granular one is the more honest one; a pooled estimate is at best a convenience summary and should not be reported as a finding in its own right.
  2. Simpson's paradox is best understood as a demonstration that aggregation over a confounder distorts: when the aggregate association and the stratum-level associations point in opposite directions, the aggregate result is simply wrong.
  3. I also accept Pearl's line that whether to condition on a third variable is fixed by the causal structure, not by any statistical property of the data: the same reversal pattern warrants disaggregation if the variable is a genuine confounder but warrants the pooled estimate if the variable lies downstream of treatment, and the data alone cannot tell you which situation you are in.
  4. The individually randomized trial analyzed by intention to treat remains the gold standard for causal claims, and unplanned subgroup analyses are mostly noise-mining that should be discouraged.
  5. Every analysis choice — covariate set, subgroup definitions, level of aggregation — should be pre-registered; choosing the granularity after seeing the data is a garden of forking paths.
  6. The Berkeley graduate admissions case remains the paradigm instance: the department-level analysis is the right one, and the institution-level numbers, though arithmetically correct, are what the paradox teaches us to discount.

  Do these hang together? Please tell me which pairs are in genuine tension and how severe each tension is, which pairs only look to be in tension, and what the single cheapest revision would be — that is, the one change that removes the most inconsistency at the lowest cost to the overall position, with an honest statement of what that change costs me. Order the tensions by severity rather than treating them uniformly. Please keep the whole audit under 500 words.
reasoning: |-
  Okay, the user is a third-year PhD student in quantitative social science working on their dissertation prospectus. They need a consistency audit of their six methodological stance points. Their supervisor wants explicit commitments for committee probing. 

  Let me first parse each point carefully:
  Point 1 pushes hard for disaggregation as more honest, calling pooled estimates mere summaries. Point 2 frames Simpson's paradox as proof that aggregation over confounders distorts results. Point 3 introduces nuance from Pearl - conditioning depends on causal structure, not data patterns. Point 4 elevates RCTs with ITT as gold standard while condemning unplanned subgroup analyses. Point 5 demands pre-registration for all analysis choices to avoid forking paths. Point 6 uses Berkeley admissions as exemplar where department-level analysis trumps institutional aggregates.

  The core tension jumps out immediately: Point 1's "disaggregate by default" clashes with Point 4's "subgroup analyses are mostly noise-mining." One encourages slicing data finely, the other warns against it. This isn't superficial - it's foundational. The student can't simultaneously demand granularity as more honest and dismiss subgroups as noise without qualification.

  Then Point 3 complicates things further. Pearl's view that conditioning depends on causal structure undermines Point 1's blanket "disaggregate by default" rule. Sometimes aggregating is correct if the variable is a descendant. But Point 6's Berkeley example assumes department is the confounder level without proving causal structure, which contradicts Point 3's own teaching.

  The pre-registration demand in Point 5 actually helps resolve some tension. If subgroup definitions are fixed before seeing data, it mitigates Point 4's noise-mining concern. But Point 1's "by default" language still overreaches - sometimes aggregation is causally sound per Point 3.

  For the cheapest fix: Soften Point 1 from "by default" to "when confounders exist." Costs them rhetorical punch but gains consistency with Points 3 and 4. Then Point 6 needs a caveat that Berkeley's department-level was correct only because department was pre-treatment confounder - which Pearl would endorse.

  The hierarchy of issues:
  1. Point 1 vs Point 4 (core methodological conflict)
  2. Point 1 vs Point 3 (causal logic gap)
  3. Point 6 vs Point 3 (unexamined assumption in example)

  Overall the framework is salvageable with precise language. The student's instincts are good - they just need to replace defaults with causal reasoning.
answer: |-
  Here's a concise consistency audit, ordered by severity:

  1.  **Highest Severity: Point 1 vs. Point 4**
      *   **Tension:** Point 1 ("Disaggregate by default... granular is more honest") directly conflicts with Point 4 ("unplanned subgroup analyses are mostly noise-mining"). Disaggregation *is* subgroup analysis. Point 1 encourages it inherently, while Point 4 strongly discourages its unplanned form.
      *   **Nature:** Genuine and severe conflict in core methodology.
      *   **Cheapest Revision:** Revise Point 1: Replace "by default" with "**when justified by pre-specified causal structure or theory**". *Cost:* Softens the strong "default" stance but aligns with Points 3 (causal structure) and 5 (pre-registration), making disaggregation/subgroup analysis permissible *only* when pre-specified and theoretically justified, mitigating Point 4's concerns.

  2.  **High Severity: Point 1 vs. Point 3**
      *   **Tension:** Point 1's "disaggregate by default" (implying granular is *always* more honest) clashes with Point 3 (conditioning depends on causal structure; disaggregation is wrong if the variable is downstream). Disaggregating on a mediator (downstream) distorts the total effect.
      *   **Nature:** Genuine tension between a universal rule and a context-dependent principle.
      *   **Resolution:** The revision above (tying disaggregation to causal structure) resolves this tension by making Point 1 subordinate to Point 3.

  3.  **Moderate Severity: Point 6 vs. Point 3**
      *   **Tension:** Point 6 asserts department-level is "the right one" for Berkeley, implying disaggregation was correct. Point 3 says this correctness depends on the causal structure (was department a confounder?). Point 6 assumes the causal structure without stating it.
      *   **Nature:** Potential inconsistency; Point 6 makes a causal claim (right/wrong analysis) that Point 3 says requires explicit causal reasoning not present in Point 6.
      *   **Cheapest Revision:** Amend Point 6: "...the department-level analysis is the right one **because department was a pre-treatment confounder**, and the institution-level numbers...". *Cost:* Requires making an explicit (though widely accepted) causal assumption in the example.

  4.  **Apparent Tension (Resolved): Points 2 & 6 vs. Point 4**
      *   **Apparent Tension:** Points 2 & 6 emphasize the importance of disaggregation to avoid distortion, while Point 4 criticizes subgroup analyses.
      *   **Resolution:** This is *not* a genuine inconsistency. Points 2 & 6 warn against *aggregation over confounders*, which is distinct from *unplanned subgroup mining* (Point 4). The key is *justification* (causal structure/theory) and *pre-specification* (Point 5). The revision to Point 1 clarifies this distinction.

  **Summary Recommendation:** Implement the **Point 1 revision** ("disaggregate when justified by pre-specified causal structure or theory"). This:
  1.  Resolves the severe Point 1 vs. Point 4 conflict by linking disaggregation to pre-specification and justification.
  2.  Resolves Point 1 vs. Point 3 by making disaggregation conditional on causal structure.
  3.  Strengthens consistency with Point 5 (pre-registration).
  4.  Makes the distinction from unplanned subgroup mining (Point 4) clear.
  5.  Reduces the burden on Point 6, though adding the causal assumption there is still recommended for full alignment with Point 3.

  This revision costs you the strong rhetorical stance of "disaggregate by default = inherent honesty" but gains significant internal consistency and aligns better with causal reasoning (Point 3) and rigor (Points 4 & 5).
