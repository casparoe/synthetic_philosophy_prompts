  Okay, the user is running a reading group on biological function for grad students and synthetic biology folks. They need desiderata—essential requirements—any theory of biological function must meet, beyond the basic etiological vs. causal-role debate. Let me unpack their query.

  First, they want a focus on hard cases: novel traits, exaptations, vestigial structures, lab-built organisms, and Swampman. These are crucial because they challenge existing theories. Also, they're interested in whether function is a unified concept or if it serves dual roles: explaining what a trait is for and grounding functional explanations in science.

  The user mentioned malfunction, normative aspects, and accidental benefits as obvious points but wants deeper analysis. They suspect a tension between lab-assigned functions and malfunction cases. Let me verify if that's valid. Lab organisms have functions by design without evolutionary history, while malfunction relies on historical norms. That does seem conflicting.

  Also, Swampman raises questions about history's necessity. If an identical organism pops into existence, does its heart have a function? Etiological theories say no; causal-role might say yes. This ties into whether normative function requires history.

  The dual-role issue: can one theory cover both the "proper function" of a trait and explanatory functions in biology? Etiological accounts might handle normativity but struggle with novel traits. Causal-role excels in explanations but lacks normativity for malfunction.

  I need to list desiderata, marking non-negotiables vs. theory-biased ones. Non-negotiables could include normative malfunction, avoiding accidental benefits, and grounding functional explanations. Lab-assigned functions might be less agreed upon; etiologists might see it as derivative.

  The user's hunch about lab organisms and malfunction conflicting makes sense. Lab functions are assigned, not evolved, so malfunction is defined by design specs, not history. But in natural cases, history sets the norm. A theory must bridge both, possibly by treating design as analogous to selection.

  Also, for vestigial structures, etiological theories might assign no current function, but biologists might still refer to them functionally. This shows a possible gap.

  Synthetic biology cases are critical. If a trait is engineered for a new purpose, does it have that function immediately? Etiological views require selection, which hasn't happened yet. Causal-role can assign function based on current role.

  Exaptations: feathers evolved for thermoregulation, now for flight. Etiological accounts might say the function is flight only after selection for it. But intuitively, flight is now a function. This requires a theory to handle function shifts without prior selection.

  Swampman: If history is essential, then no function. But that seems counterintuitive. Maybe normativity is tied to organization, not history. Or perhaps Swampman isn't a valid test case.

  Dual roles: Functional explanations like "zebra stripes confuse predators" need truth conditions. Causal-role can provide that via current effects. Etiological accounts might say the function is whatever it was selected for, which might not align with current explanations if the trait is exapted.

  Synthesizing, the desiderata should include:

  1. Normativity: Explain malfunction.
  2. Non-accidentality: Distinguish functions from accidental benefits.
  3. Novel traits: Assign functions without selection history.
  4. Exaptation: Handle function shifts.
  5. Vestigial structures: Account for lost functions or current roles.
  6. Lab organisms: Assign functions by design.
  7. Swampman: Address duplicates without history.
  8. Dual roles: Serve both teleological and explanatory purposes.

  Flag tensions: Lab vs. malfunction (history vs. design), dual roles (normative vs. explanatory), and exaptation vs. etiological requirements.

  For theories: Etiological handles 1,2,4 (partly),7 (if history needed) but struggles with 3,5,6. Causal-role handles 3,5,6,8 but fails 1,2,7.

  The user's insight about lab organisms and malfunction is spot-on. Reconciling them might require a hybrid approach or rethinking normativity beyond history.
answer: |-
  Here’s a distilled list of desiderata for a theory of biological function, structured around your hard cases and flagged for tension points. I’ve marked non-negotiables (★), theory-biased assumptions (⚠️), and conflicts (⚡). The goal is to expose where theories *must* deliver versus where they might beg the question.

  ---

  ### **Core Desiderata: Non-Negotiables (★)**  
  These are widely agreed upon as essential for *any* theory of biological function in biology:  
  1. **★ Malfunction/Normativity**: Explain how a trait can *fail* to perform its function (e.g., a diseased heart fails to pump blood) while retaining that function. *(Motivation: Clinical/pathological contexts demand normative evaluation.)*  
  2. **★ Non-Accidentality**: Distinguish *proper functions* from fortuitous side effects (e.g., the nose supports glasses, but this isn’t its function). *(Motivation: Functional attributions in biology aren’t merely descriptive; they’re explanatory and selective.)*  
  3. **★ Explanatory Power**: License truth-apt functional explanations (e.g., "zebra stripes function to confuse predators"). *(Motivation: Functional claims are central to evolutionary/ecological explanations and must be more than heuristic.)*  

  ---

  ### **Hard-Case Desiderata: Stress Tests**  
  These test the theory’s scope and flexibility. Some are contested:  
  4. **Novel/Modified Traits**: Assign functions to traits with little/no relevant selection history (e.g., a newly evolved enzyme in a microbial population, or a primate’s learned tool-use adaptation). *(Motivation: Rapid adaptation, plasticity, and contemporary evolution.)*  
  5. **Exaptation**: Handle function shifts where a trait’s current role differs from its historical origin (e.g., feathers evolved for thermoregulation, now function for flight). *(Motivation: Ubiquity of repurposing in evolution; paleobiology.)*  
  6. **Vestigial Structures**: Account for traits that have lost their original function but retain a "functionless" designation (e.g., human appendix, whale pelvic bones). *(Motivation: Comparative anatomy; evolutionary "leftovers" aren’t functional by default.)*  
  7. **Lab-Built Organisms**: Assign functions to synthetic biological systems *by design* without selection history (e.g., a engineered bacterium that degrades plastic *because researchers built it for that purpose*). *(Motivation: Synthetic biology blurs lines between organisms and artifacts; functions are often stipulated, not evolved.)*  
  8. **Swampman Intuition**: Decide whether a molecule-for-molecule duplicate of a human (with no evolutionary history) has functional traits (e.g., does its heart *function* to pump blood?). ⚠️*(Motivation: Tests if normativity requires history. Caution: This may be an artifact-bound intuition—flag as contentious!)*  
  9. **Dual-Role Coherence**: Resolve whether "function" serves two distinct jobs:  
     - **(A)** Teleological: "What the trait is *for*" (e.g., "the heart’s function is to pump blood").  
     - **(B)** Explanatory: Grounding causal-role explanations (e.g., "blood circulation occurs *because* the heart pumps").  
     *(Motivation: Philosophers split on whether (A) and (B) are unified or distinct; theories often prioritize one and struggle with the other.)*  

  ---

  ### **Tension Flags: Where Desiderata Clash**  
  - **⚡ Lab-Built vs. Malfunction**: Your hunch is correct.  
    - Lab organisms demand *design-based* normativity (function assigned by intention, no history).  
    - Malfunction demands *history-based* normativity (failure relative to what ancestors did).  
    *Cost:* Etiological theories fail lab cases; causal-role theories struggle with malfunction.  
  - **⚡ Swampman vs. Non-Accidentality**: If Swampman’s heart has a function, how is it non-accidental? Causal-role views may overextend ("whatever it does" becomes a function).  
  - **⚡ Dual-Role Dilemma**: Teleology (A) pulls toward history/stability; explanation (B) pulls toward current causal roles. Exaptation cases exacerbate this (e.g., feathers *explain* flight but were *selected for* thermoregulation).  

  ---

  ### **Quick Theory Scorecard on Desiderata**  
  *(Focusing on Wright/Neander vs. Cummins as requested)*  

  | Desideratum                     | Etiological (Wright/Neander)                     | Causal-Role (Cummins)                             |  
  |---------------------------------|--------------------------------------------------|--------------------------------------------------|  
  | **Malfunction (★)**             | ✅ Clear: Failure relative to selected effect.    | ❌ Hard: No normativity; if it *can* pump, it functions. |  
  | **Non-Accidentality (★)**       | ✅ Strong: Only selected effects are functions.   | ❌ Weak: Any beneficial effect can be a "function." |  
  | **Explanatory Power (★)**       | ⚠️ Partial: Explains *why* trait exists, not current dynamics. | ✅ Strong: Directly supports causal explanations. |  
  | **Novel/Modified Traits**       | ❌ Fails: No selection history → no function.     | ✅ Excels: Function = current causal role.        |  
  | **Exaptation**                  | ⚠️ Limited: Only post-shift selection counts.    | ✅ Good: Current role defines function.           |  
  | **Vestigial Structures**        | ✅ Clear: No current function.                    | ❌ Problem: May assign function if vestige has *any* effect. |  
  | **Lab-Built Organisms**         | ❌ Fails: No natural selection history.           | ⚠️ Partial: Function = designer’s intended causal role? (But normativity issue). |  
  | **Swampman**                    | ❌ No history → no function.                      | ✅ Functions identical to original.               |  
  | **Dual-Role (A: Teleology)**    | ✅ Strong.                                        | ❌ Weak: No "for-ness."                           |  
  | **Dual-Role (B: Explanation)**  | ❌ Weak: Historical, not current-causal.         | ✅ Strong.                                        |  

  ---

  ### **Key Takeaways for Discussion**  
  1. **Non-Negotiables are Teleology-Heavy**: Desiderata 1–3 implicitly favor etiological approaches. Causal-role views pay a heavy price here (★ malf/non-accidentality).  
  2. **The Lab/Malfunction Tension is Real**: Etiology anchors normativity in history; synthetic biology needs normativity without it. Hybrid theories (e.g., Boorse’s "statistical normality") or pluralism may be needed.  
  3. **Exaptation Exposes Dual-Role Stress**: If function shifts, what grounds "the" function? Etiologists must explain *when* a new function "counts"; causal-role theorists lose historical depth.  
  4. **Swampman is a Red Herring?**: If biology is inherently historical (anti-swampman), lab cases become problematic. If not, malfunction loses its anchor. *Propose to the group: Is Swampman even a biological case?*  
  5. **Desiderata as a Result**: The list *itself* reveals that no monistic theory satisfies all. Pluralism (e.g., Millikan’s "direct proper function" vs. "derived function") or context-sensitivity may be unavoidable.  

  Your synthetic biology colleagues will likely push on lab cases (desideratum 7) as non-negotiable, while philosophers may see Swampman (8) as decisive. Highlighting the dual-role split (9) shows why debates often talk past each other: etiologists care about (A), causal-role advocates about (B). Bring popcorn!
