answer: |-
  ### Desiderata for Serious Ontological Arguments
  To pressure a logically competent agnostic, an argument must force rejection of an independently costly premise. Counterexamples must be demonstrable.

  1.  **Transparent Validity** (Non-negotiable):  
      *The modal system (e.g., S5) and its key inferences must be explicitly stated. The S5 axiom (◊□P → □P) must be flagged if used.*  
      Motivation: Validity alone is insufficient; the argument’s reliance on contested modal principles must be open to scrutiny. Failure: Undisclosed reliance on S5 for the crucial inference.

  2.  **Non-Question-Begging** (Non-negotiable):  
      *The conclusion must not be analytically entailed by a premise lacking independent justification. For axiomatic versions, identify the substantive axiom(s) (e.g., Gödel’s "necessary existence is positive") whose denial is costly for the agnostic.*  
      Motivation: Premises must not smuggle in the conclusion. Failure: "God exists" follows directly from "God necessarily exists" as a definitional premise.

  3.  **Parody Immunity (Gaunilo Constraint)** (Non-negotiable):  
      *No structurally identical argument proving an absurd conclusion (e.g., a perfect island) can be sound. Axiomatic defenses (e.g., Gödel’s) claim immunity via necessity/uniqueness axioms for "positivity," but this must not simply relocate question-begging.*  
      Motivation: Soundness must depend on non-arbitrary content. Failure: An argument for "The necessarily existent maximally great island exists" succeeds using identical logical form.

  4.  **No Modal Collapse** (Non-negotiable):  
      *The premises must not entail that all truths are necessary truths (□P for all true P).*  
      Motivation: Proving radical metaphysical necessity universally disqualifies the argument. Failure: Premises imply □(Grass is green).

  5.  **Engages Kant’s Objection** (Non-negotiable):  
      *Must explicitly address whether "existence" functions as a logical predicate (denoting a property) or a quantifier, and locate where Kant’s critique (existence adds no content to a concept) is engaged.*  
      Motivation: Ignoring the core objection reduces the argument to stipulation. Failure: Treating "exists" as a defining property without addressing Kant.

  6.  **Epistemic Ascent** (Negotiable; empiricist-leaning):  
      *No premise may be less antecedently credible to the unmoved agnostic than the conclusion. Strong form (empiricist): premises must be empirically or analytically secure. Weak form (rationalist): premises may rely on intuition if more basic than theism.*  
      Motivation: Premises must not *increase* epistemic burden. Failure: Premise "God is possible" is less credible to the agnostic than "No God exists." *Suspicion:* Strong form prejudices against rationalist intuitions; weak form may be acceptable.

  **Tension:** Desiderata (2) Non-Question-Begging and (3) Parody Immunity may be **jointly unsatisfiable**. Blocking parodies (e.g., Gaunilo) in axiomatic systems (e.g., Gödel’s) typically requires axioms about positivity/necessity that appear substantive and non-stipulative only if one *already accepts* a necessary, unique ground of being – effectively smuggling in the conclusion under the guise of defining "positivity."

  ---

  ### Scorecard: Key Failure & Relative Strength

  | **Version**                      | **Most Clear Failure**               | **Outperforms Others On**        |
  | :------------------------------- | :----------------------------------- | :------------------------------- |
  | **Anselm (Proslogion 2)**        | (5) Engages Kant’s Objection         | (6) Epistemic Ascent (Weak Form) |
  | *Failure Reason:* Treats "existence in reality" as a great-making property *simpliciter*, without addressing Kant’s quantifier critique. | *Strength:* Starts from minimal cognitive content ("understood"), imposing low initial epistemic cost on the agnostic. |
  | **Plantinga (Maximal Greatness)** | (3) Parody Immunity                  | (1) Transparent Validity         |
  | *Failure Reason:* "Maximal greatness" can be parodied (e.g., "maximally great island"); no non-arbitrary block within the argument’s own structure. | *Strength:* Explicitly uses S5 and clearly flags the ◊□P → □P move as the linchpin inference. |
  | **Gödel (Axiomatic)**            | (4) No Modal Collapse                | (5) Engages Kant’s Objection     |
  | *Failure Reason:* Standard derivations entail that all positive properties are instantiated necessarily, implying modal collapse. | *Strength:* Explicitly treats existence as a predicate (necessary existence as a positive property) within a defined system, forcing direct confrontation with Kant’s challenge. |
