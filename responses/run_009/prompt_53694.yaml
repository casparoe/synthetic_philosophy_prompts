prompt: |-
  I'm a math PhD student taking a philosophy of language course as an elective, mostly because I kept getting into arguments at the pub about whether math is discovered. We just spent three weeks on Wittgenstein-on-rules (via Kripke's book) and instead of clearing things up it's made me realize I hold a bunch of case-verdicts that don't fit together. So, here are my gut calls, and I'd like to know whether there's one account of what fixes what a person means that captures them, which of my verdicts it has to throw out, and what it predicts on cases I haven't listed.

  The verdicts, roughly in order of confidence. A kid who's only ever been shown sums with numbers under ten gets asked 687+2: she'd better say 689, and if she says 5, that's a mistake, not a different but equally valid reading of her training. Me: I accept the skeptical claim that nothing in my finite past favors plus over quus (where quus is ordinary addition for small numbers and 5 for anything involving anything above 57), and at the same time I think it's just obvious I meant plus and not quus. I cant give up either half, which I'm aware is awkward. A whole community, records going back centuries, whose members all compute ordinary addition up to a trillion but then wrap around to zero, all of them, sincerely and confidently: I say that by "plus" they mean the wrap function, it's not a trillion-wide mass error. A lone dissenter in our community, otherwise sharp and sincere, who computes quus: here I wobble — half of me says he misunderstands addition, i.e., he means plus and gets it wrong, the other half says he just means quus by "plus", which would make my community verdict look like simple majority rule, in a way I dont like. And an oracle that has matched correct addition on a billion past trials: it means plus, I see no difference in kind between it and a human who's been right so far.

  My current best guess at a principle is something like: what you mean is fixed by the pattern your community's practice of correction and continuation would converge on, not by anything in you alone. But that seems wrong for the first verdict — why does the community get to declare the kid wrong rather than say she's revealed a different rule all along? — and it can't obviously explain why I'm so sure in my own case that answering 5 tomorrow would be an error and not a change of meaning. Can you repair the principle so it fits the verdicts, or is the honest answer that some of my calls have to go, and if so which? Also tell me what the repaired principle says about a case I didn't list: two communities merge, one that always computed ordinary addition and one that always computed the wrap, and the kids are now taught together in mixed schools. Did anybody's meaning change on moving day?
reasoning: |-
  Okay, the user is a math PhD student taking a philosophy of language course, specifically wrestling with Kripke's Wittgenstein on rules and private language. They're struggling to reconcile their intuitive judgments about meaning with the skeptical challenge. Let me unpack their core dilemma.

  First, their verdicts in order of confidence: The child must say 689, not 5, for 687+2 - that's error, not alternative meaning. They personally feel torn between accepting the skeptic's point (no finite evidence determines plus over quus) yet being certain they meant plus all along. For the wrap-around community, they firmly believe "plus" means their wrap function, not mass error. But the lone quus dissenter makes them wobble - is he wrong or meaning something different? And they see no difference between a reliable oracle and a human.

  Their proposed principle is community convergence of practice, but they spot problems: Why can the community "overrule" the child? And why does their personal certainty feel so compelling if meaning is communal?

  Hmm... the tension here is between individual intentionality and communal practice. Their wrap-around community case shows strong intuition toward externalist meaning (meaning is what the community does), but the child case reveals discomfort with this overriding individual understanding. The wobble on the dissenter is particularly telling - they sense that individual deviation might still be error rather than meaning shift, which conflicts with their communal conclusion.

  The oracle case suggests they're implicitly functionalist - reliable input-output patterns constitute meaning regardless of internal states. But this clashes with their intuition about the child, where output alone (saying 5) doesn't establish meaning.

  For repair... perhaps a two-layer account? Baseline meaning is fixed by community practice (solving the skeptic by externalism), but individual competence is judged against that standard. The child is wrong relative to established community meaning. The dissenter is incompetent at plus but not meaning something else because he defers to the community standard (even if he fails to apply it). The oracle's reliability anchors it to the community's plus via output alignment.

  The merger case is fascinating. If meaning is communal practice, merging communities creates a new practice. But their verdicts suggest meaning shouldn't change instantly. So maybe we need historical embeddedness - individuals inherit meaning from their training community. Post-merger, new practice emerges, but original meanings persist contextually until the new practice stabilizes. The "plus" sign now has two referents during transition, like homonyms.

  But which verdicts must go? Probably the oracle-human equivalence - if meaning is practice-dependent, the oracle lacks community embedding. And the dissenter wobble might resolve toward "error" if we emphasize deference to communal standards.

  Most salvageable path: Community practice sets the standard, but individuals can be mistaken relative to it. The child is wrong because she's being initiated into an existing practice. The dissenter fails to comply with the standard he endorses. The wrap community's practice just is their function. Oracle matches outputs but lacks intentional states - so strictly speaking, it doesn't "mean" anything, though we pragmatically say it does.

  For merger - meanings don't instantly change; the conflict creates ambiguity until new conventions form. So no, moving day doesn't change meaning, but future usage might.
answer: |-
  Here's a breakdown reconciling your verdicts with a repaired externalist principle, the verdicts that must be modified, and predictions for new cases. Your core conflict (accepting the skeptic’s point yet being certain you meant *plus*) is the crux—Wittgenstein/Kripke’s solution is to ground meaning in **public, corrective practices**, not private mental states.

  ### Repaired Principle
  **What fixes meaning is the *actual, ongoing pattern of corrective practices within a linguistic community*, as applied to an individual’s use. This includes:**
  - How the community *would correct* deviations in new cases.
  - The history of *accepted applications* and *rejected errors*.
  - The individual’s *disposition to defer* to these norms (even if they err).

  This avoids "simple majority rule" by emphasizing *norm-governed practice* over mere agreement. Now, let’s test it against your verdicts:

  ---

  ### Your Verdicts & the Principle
  1. **The kid (687+2=5 is a mistake)**  
     ✅ **Fits:** The child is being initiated into a *pre-existing practice* with established norms (e.g., "carrying over"). Her "5" conflicts with how the community corrects such answers. Her training wasn’t a private definition but a *partial entry point* into this public practice.  
     *Why the community "declares" her wrong?* The norms aren’t arbitrary—they extend from centuries of application, correction, and integration with other practices (e.g., commerce). The child’s answer violates the *functional role* of "+" in the community.

  2. **You: Skepticism + certainty you meant *plus***  
     ✅ **Fits:** Your certainty comes from embedding in the community’s practice. The skeptic is right that your *internal state* doesn’t fix meaning, but wrong that this implies no meaning exists. Meaning is in the *public scaffolding*: how others correct you, textbooks, calculators, etc. Your disposition to say "689" isn’t self-validating—it’s ratified by the community’s norms. Saying "5" would be an *error* because it violates those norms, not a "meaning change" midstream.

  3. **Wrap-around community means *wrap***  
     ✅ **Fits:** Their practice *is* the pattern: they correct deviations from *wrap*, not standard addition. Centuries of records and unanimous confidence show "+" refers to *their* function. No "mass error" because error implies deviation from *their own* standard.

  4. **Lone dissenter (quus) in our community**  
     ⚠️ **Wobble resolved:** He **misunderstands *plus*** (i.e., commits errors). Why?  
     - He likely *intends* to follow the community standard (deference).  
     - His answers are *correctable* by others (they’d say "no, 68+57=125, not 5").  
     - His "quus" isn’t a stable alternative practice—it’s isolated deviations.  
     *Not majority rule*: Meaning is fixed by the *authoritative* practice (teachers, experts, tools), not polling individuals. A dissenter isn’t creating a new rule; he’s failing at the existing one.

  5. **Oracle matching human addition**  
     ⚠️ **Verdict must be modified:** The oracle **does not mean *plus* in the human sense**. It produces outputs, but lacks:  
     - Participation in corrective practices (it can’t be "corrected" or "defer").  
     - Integration with other language games (e.g., using "+" in budgeting or proofs).  
     We *attribute* meaning pragmatically ("as if" it means *plus*), but strictly, meaning requires a community of *users*. A human with a billion right answers *is* embedded in the practice; the oracle is a tool *used by* the practice.

  ---

  ### Merged Communities Case
  **Scenario:** Community A (standard addition) and Community B (wrap function) merge. Kids taught together.  
  **Prediction:**  
  - **Pre-merger:** Community A meant *plus*; Community B meant *wrap*.  
  - **Post-merger:** Meaning is *initially ambiguous* during conflict. The new meaning stabilizes based on:  
    - Which practice dominates *corrective interactions* (e.g., if teachers standardize one method).  
    - Functional needs (e.g., if merging economies require larger numbers, *wrap* becomes dysfunctional).  
  - **Did meanings change?**  
    - **No immediate change on moving day:** Individuals retain their pre-merger meanings temporarily.  
    - **Yes, eventual change:** If a new convergent practice emerges (e.g., all adopt *plus*), "+" *now* means the new function. The old meanings are lost.  
    - *Exception:* If communities maintain separate sub-practices (e.g., "In school A we use *old-wrap*"), "+" becomes polysemous (two meanings).

  ---

  ### Which Verdicts Must Go?
  1. **The oracle verdict:** You must drop equivalence between humans and oracles. Outputs alone don’t fix meaning; participation in norm-governed practices does.  
  2. **The dissenter wobble:** Your half-view that he "means quus" is incompatible. Meaning isn’t individuated by individual performance but by communal standards. He means *plus* but fails at it.

  ---

  ### Why This Works
  - **Solves the skeptic:** Meaning isn’t in your head; it’s in the *social machine* of correction, application, and deference.  
  - **Explains your certainty:** You’re not accessing a private rule—you’re riding a public rail.  
  - **Avoids majority rule:** Meaning is set by the *structure* of the practice (e.g., pedagogical authority, expert consensus), not headcount.  
  - **Handles change:** Meaning evolves with practice but requires stability during transitions.

  This fits Wittgenstein: "To obey a rule is a practice [...] it is not possible to obey a rule 'privately'". Your verdicts mostly align with a **robust externalism**—once the oracle and dissenter are tweaked. The merger case shows meaning is *dynamic but anchored in practice*, not magically fixed on day one.
