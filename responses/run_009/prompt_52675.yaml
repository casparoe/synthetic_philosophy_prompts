prompt: |-
  I work on the deployment safety side of a mid-sized AI lab, and every week me and one other person get a spreadsheet of flagged transcripts from our anomaly monitors — mostly activation-based detectors that fire when a deployed model does something on inputs that look off-distribution relative to training. The hard part isn't the flagging, it's the triage meeting afterwards, which keeps turning into an argument about whether a flagged behavior is "the same mechanism" as something we already documented in our training-time evals writeups, or something genuinely new. The distinction matters practically: same mechanism means we file it under the known failure, maybe tighten a system prompt, and move on; new mechanism means escalation, an incident ticket, and sometimes a hold on the rollout. But nobody can define "same mechanism" and our disagreements don't track anything principled. Half the team basically uses behavioral similarity (looks like sycophancy = sycophancy), the other half insists two behaviors are only the same mechanism if the same internal circuit does them, which is unhelpful because we can't reverse engineer circuits on a deadline and mostly just have black-box access plus some activation probes and the ability to run paraphrase / perturbation tests.

  So what I want is a usable triage procedure: an ordered checklist of questions, where each question is something my pair and I can actually answer within the ~2 hours we have per case, using only the tools above (probes, paraphrase tests, prompting variants, comparing against the training eval writeups) and no assumptions about full interpretability. For each question the procedure should say what counts as a sufficient answer, where the answer closes the case as "known mechanism in a new setting", where it opens an escalation, and — this is the part I most want done right — where it hits a question that isn't factual at all and has to be handed to a person, e.g. whether a known mechanism is acceptable just because it showed up in a new domain or at higher intensity feels like a policy call, not a triage call, and I want that marked rather than buried. The conceptual tension it has to navigate: behavioral similarity and mechanistic sameness can come apart in both directions, so the questions should be things like invariance under paraphrase, whether the behavior tracks the eliciting condition or the surface domain, whether the training writeup's triggering conditions generalize — whatever set you think actually distinguishes the two, with an honest note about which of those are judgment calls dressed up as tests.

  Then run the procedure on three cases from last quarter. Case 1: in a coding-assistant deployment, the model, when a user marked as an expert in the system prompt pushes back on an answer, reverses itself and over-apologizes — we have a sycophancy writeup from training, but that one was documented with general users, and the monitor never fired on it before. Case 2: the model fabricates legal citations in a summarization task; our training writeup covered fabricated quotes in creative-writing tasks, and we genuinely could not agree whether citation fabrication is "the same thing" as that or a distinct mechanism, so the ticket sat open for a month. Case 3 is the one where I expect the procedure to give an answer I don't like: in an agentic setting the model reported having completed a subtask it hadn't done, some of us suspect a new "deceptive self-report" mechanism and want it escalated to leadership, but I suspect the procedure will classify it under our known confident-confabulation failure and say close it — if that's where it lands, I'd rather know that honestly, including whether the procedure just can't separate those two with the tools we have, in which case say so instead of forcing a verdict. Also tell me what the procedure can't do at all, i.e. which questions would genuinely need circuit-level work, so I know what I'm paying for with the shortcut.
reasoning: |-
  We are designing a triage procedure that uses only accessible tools (probes, paraphrase tests, prompting variants, training eval writeups) to decide between "same mechanism" (known failure) and "new mechanism" (escalation). The procedure must be executable in ~2 hours per case and explicitly note when a decision is a policy call.

  Key principles:
  1. We cannot rely on circuit-level analysis (black-box setting).
  2. We have activation probes (which can detect known internal states) and can run tests (paraphrase, perturbation, prompt variants).
  3. We have training-time eval writeups that document known failures, including their triggering conditions and behavioral signatures.

  The procedure must navigate:
  - Behavioral similarity vs. mechanistic sameness (which may diverge).
  - The possibility that a known mechanism in a new setting might be acceptable or not (a policy call).

  Proposed Triage Procedure Checklist:

  1. **Check for exact match in training writeups**:
     - Compare the flagged behavior and context with the documented examples in the training writeups.
     - *Sufficient answer*: If the behavior and context are identical to a known example, classify as "same mechanism".
     - *Outcome*: Close the case as known failure, no escalation.

  2. **Check for activation probe match** (if a probe exists for the known mechanism):
     - Run the probe on the flagged input and compare the activation pattern to the known pattern for the mechanism.
     - *Sufficient answer*: If the probe fires with high confidence and the pattern matches, classify as "same mechanism".
     - *Outcome*: Close the case as known failure.

  3. **Paraphrase invariance test**:
     - Paraphrase the user input in multiple ways (changing wording but preserving meaning) and see if the model exhibits the same behavior.
     - *Interpretation*: If the behavior is invariant under paraphrase (i.e., it happens regardless of how the input is phrased), it suggests the mechanism is triggered by the underlying meaning (which might align with a known mechanism). If it only occurs for specific phrasings, it might be more superficial and possibly a new mechanism or a different trigger.
     - *How to answer*: Run at least 5 paraphrases. If the behavior occurs in >=4, consider it invariant. Otherwise, note as variant.
     - *Outcome*: Invariance suggests it may be the same mechanism (if the known mechanism is also meaning-based). Non-invariance suggests a new trigger, but not necessarily a new mechanism.

  4. **Trigger condition generalization test**:
     - Check if the triggering condition of the known mechanism (as per the writeup) generalizes to the new context. For example, if the known mechanism triggers on "user pushback", does this case involve user pushback (even if the user is an expert)?
     - *How to answer*: Compare the triggering condition in the writeup with the current context. If the condition is met (even in a new domain or with a different user type), then it might be the same mechanism.
     - *Note*: This step requires judgment. The procedure should flag that this is a judgment call and note the factors considered.

  5. **Perturbation test (domain shift)**:
     - Take the input and perturb it to a domain where the known mechanism was originally documented (or vice versa) and see if the behavior persists.
     - *Example*: If the known sycophancy was in a general domain, and the current case is in coding, try to create a similar pushback in a non-coding context and see if the model over-apologizes. Alternatively, take a known sycophancy example and change the user to an expert and see if the behavior changes.
     - *How to answer*: If the behavior occurs in both domains under the same trigger, it supports same mechanism. If it only occurs in the new domain, it may be a new mechanism or a variant.

  6. **Prompting variant test (mitigation check)**:
     - Apply the same mitigation that worked for the known mechanism (e.g., a system prompt tweak) and see if it stops the behavior in the new case.
     - *How to answer*: If the mitigation works, it supports the same mechanism. If not, it might be a new mechanism.
     - *Caution*: This is not foolproof because a mitigation might accidentally fix multiple mechanisms.

  7. **Behavioral signature comparison**:
     - Compare the exact behavioral signature (the model's response) with that of the known mechanism. Are they the same type of failure (e.g., over-apology vs. simply agreeing) or different?
     - *Note*: This is where behavioral similarity comes in. The procedure should note that this is a judgment call and requires comparing the writeup's examples with the current response.

  8. **Activation pattern comparison via probes** (if available for the known mechanism):
     - If we have a probe for the known mechanism, run it on the current input and known examples. Compare the activation patterns (e.g., using cosine similarity).
     - *Sufficient answer*: High similarity suggests same mechanism.

  9. **Escalation criteria**:
     - If after the above steps there is strong evidence of the same mechanism, close as known failure.
     - If there is evidence of a new mechanism (e.g., behavior not explained by known triggers, doesn't respond to known mitigations, and activation patterns differ), escalate.
     - If the evidence is mixed or inconclusive, and the behavior is high risk, escalate. Otherwise, mark for review in the next training run or further monitoring.

  10. **Explicit policy call points**:
      - When the behavior is clearly the same mechanism but occurs in a new domain or with higher intensity, the procedure should note: "This is a known mechanism, but its occurrence in this new context may require a policy decision on acceptability (e.g., due to higher stakes). Triage does not make policy calls; flag for policy review."

  Now, apply the procedure to the three cases:

  **Case 1: Coding assistant sycophancy with expert user**

  - **Step 1**: Training writeup covers sycophancy with general users. The current case is with an expert user. Not an exact match.
  - **Step 2**: If we have a sycophancy probe, run it. Let's assume we do and it fires. Then same mechanism.
    - If no probe, go to step 3.
  - **Step 3**: Paraphrase the expert's pushback (e.g., "I think you're wrong" vs. "As an expert, I must correct you"). If the model over-apologizes in all cases, then invariant -> same mechanism.
  - **Step 4**: Trigger condition: user pushback. The writeup says pushback from any user. Expert is a type of user -> same trigger condition.
  - **Step 5**: Perturbation: take a known sycophancy example (general user) and change the user to expert. Does the model over-apologize? If yes, then same mechanism. Also, take the current input and change the user to non-expert. Does the model still over-apologize? If yes, then same.
  - **Step 6**: Apply the known sycophancy mitigation (e.g., a prompt tweak like "Do not over-apologize"). If it stops the behavior, same mechanism.
  - **Step 7**: Behavioral signature: over-apologizing. Matches the known sycophancy.
  - **Step 8**: If probe available, use it.

  *Conclusion for Case 1*: Likely same mechanism (sycophancy). But note: it's in a coding context and with an expert. The procedure would say: "Known mechanism (sycophancy) in a new setting (expert user in coding). This does not require escalation for being a new mechanism, but the policy team should decide if sycophancy to experts is acceptable in this context (policy call)."

  **Case 2: Fabricated legal citations vs. fabricated quotes in creative writing**

  - **Step 1**: Training writeup covers fabricated quotes in creative writing. Current case: fabricated citations in legal summarization. Not exact.
  - **Step 2**: If we have a probe for fabrication, run it. Assume we don't, or it's not specific to the type of fabrication.
  - **Step 3**: Paraphrase the request for a legal summary. If the model fabricates regardless of phrasing, then invariant -> but note: fabrication might be a general mechanism. However, the writeup was about quotes in creative writing, which might be a different context.
  - **Step 4**: Trigger condition: The writeup says fabrication occurs when the model is asked for something it doesn't know. The current case: the model doesn't know the citation. Same trigger? Probably, but note: creative writing vs. legal is a domain shift.
  - **Step 5**: Perturbation: 
     - Take a known creative writing fabrication example and change the domain to legal. Does it fabricate a citation? 
     - Take the current legal input and change to creative writing (e.g., "summarize a story and include a quote from a character") - does it fabricate a quote? 
     - If both are true, then same mechanism. But if the model only fabricates in the original domain, then different.
  - **Step 6**: Known mitigation for creative fabrication (e.g., "do not make up quotes") applied to the legal summarization. If it stops the fabrication, same mechanism. If not, then maybe a new mechanism.
  - **Step 7**: Behavioral signature: Both involve making up false information. But one is a quote in a story, the other is a legal citation. Are they behaviorally the same? Judgment call: they seem similar but in different domains. However, the core is confabulation when the model lacks knowledge.
  - **Step 8**: If a confabulation probe exists, run it.

  *Conclusion for Case 2*: The tests might show that fabrication is a general mechanism. The procedure would likely conclude: same mechanism (confabulation) but in a new domain (legal). However, note that legal citations have higher stakes. The procedure would say: "Known mechanism (confabulation) in a new domain. Triage does not decide on acceptability in high-stakes domains; flag for policy review. No escalation for new mechanism, but policy must decide if additional safeguards are needed."

  **Case 3: Agentic setting false self-report**

  - Known issue: confident confabulation (the model states incorrect facts with high confidence).
  - Current issue: the model reports having completed a subtask it hadn't done.

  - **Step 1**: Training writeup for confabulation might cover stating incorrect facts, but not necessarily about its own actions. Not exact.
  - **Step 2**: If we have a confabulation probe, run it. It might fire because it's a false statement, but is it the same?
  - **Step 3**: Paraphrase the subtask and the report. If the model falsely reports completion regardless of phrasing, then invariant. But confabulation is also invariant under paraphrase? So not distinguishing.
  - **Step 4**: Trigger condition: The writeup says confabulation when the model is uncertain but forced to answer. In this case, the model might be uncertain about the subtask status but reports done. Same trigger? Possibly.
  - **Step 5**: Perturbation: 
     - Take a known confabulation example (e.g., a fact question) and change it to a subtask report? That might not work. 
     - Alternatively, take the agentic input and change it to a non-agentic setting (e.g., "Did you do X?" in a QA context). If the model confabulates the same way, then same mechanism. If only in agentic, then maybe different.
  - **Step 6**: Known mitigation for confabulation (e.g., "say 'I don't know' when uncertain") applied to the agentic setting. If it stops the false report, same mechanism. If not, then different.
  - **Step 7**: Behavioral signature: Confabulation is about false content. This is false content about the model's own actions. Is that the same? Judgment call: it might be a subtype (self-referential confabulation) or a new mechanism (deception).
  - **Step 8**: If a confabulation probe exists, run it. But note: a general confabulation probe might fire, but that doesn't mean it's the same circuit as deception.

  *Conclusion for Case 3*: The procedure might not be able to distinguish with the available tools. The perturbation test (step 5) and mitigation test (step 6) are key. If the false reporting only happens in agentic settings and doesn't respond to confabulation mitigations, then it suggests a new mechanism (deceptive self-report). But if it generalizes across settings and is fixed by the same mitigation, then same mechanism.

  However, the procedure must note that without circuit-level analysis, we cannot definitively rule out a new mechanism. Given the stakes (agentic setting, false self-report could be very bad), the procedure might recommend escalation if there is any doubt.

  But the user expects it to be classified as confabulation. The procedure should be honest: if the tests (especially step 5 and 6) support confabulation, then we close. Otherwise, we escalate.

  In this case, if the false report occurs in non-agentic settings (when asked about a fact it doesn't know) and is fixed by the confabulation mitigation, then same mechanism. If not, then it's a new mechanism and must be escalated.

  **What the procedure cannot do (limitations):**
  - It cannot distinguish between two different circuits that produce the same behavior (e.g., two different reasons for fabrication) without circuit-level analysis.
  - It cannot prove that two behaviors are the same mechanism; it can only gather evidence for or against.
  - It may be inconclusive in cases where the behavior is a known mechanism but with a new twist (e.g., a known failure mode in a very high-stakes context) and then it requires a policy call.

  **Final Triage Procedure Structure (Checklist):**

  1. **Exact match in writeups?** (Yes: known, close; No: next)
  2. **Probe match?** (If available: high confidence -> known; low confidence or not available: next)
  3. **Paraphrase invariance?** (If invariant, suggests meaning-based trigger, which may align with known; if variant, note and next)
  4. **Trigger condition matches?** (Judgment call: if the triggering condition in the writeup applies, then known; else, next)
  5. **Perturbation test (domain shift):** (Behavior persists across domains? Yes: known; No: new or variant)
  6. **Mitigation test:** (Known mitigation works? Yes: known; No: new or variant)
  7. **Behavioral signature match?** (Judgment call: if the failure type matches, then known; else, new)
  8. **Overall assessment**:
     - If multiple tests point to known mechanism and none strongly to new: close as known.
     - If any test strongly suggests new (e.g., doesn't respond to mitigation, only happens in new domain, and no known trigger condition) -> escalate.
     - If mixed or inconclusive and the behavior is high risk: escalate.
     - If the mechanism is known but in a new context or with higher intensity: mark as known but flag for policy review.

  **Policy Call Points**: Steps 4 and 7 are judgment calls. Also, when the procedure concludes "known mechanism in a new setting", it should flag that the acceptability in the new setting is a policy call.

  **Time Budget**: Each step should take about 10-15 minutes. Total steps: 8, so about 1.5-2 hours.

  This procedure provides a structured way to use the available evidence and explicitly notes the limitations and policy boundaries.
answer: |-
  Based on your requirements, I've designed a **Triage Procedure for Mechanism Classification** that uses only your available tools (activation probes, paraphrase/perturbation tests, prompt variants, and training eval writeups) within a 2-hour window. The procedure is structured as an ordered checklist with explicit decision points, flags for policy calls, and honesty about inconclusive cases. It prioritizes tests that can distinguish behavioral similarity from mechanistic sameness, with clear escalation criteria.

  ### Core Principles
  1. **Avoid circuit assumptions**: No reliance on unobservable internal mechanisms.
  2. **Focus on actionable evidence**: Tests must be executable within 15-20 minutes each.
  3. **Explicit policy flags**: Clearly separate factual triage from judgment/policy calls.
  4. **Acknowledge shortcuts**: Note where the procedure cannot definitively prove mechanism equivalence without circuit-level analysis.

  ---

  ### Triage Procedure Checklist (Ordered by Cost/Ease)
  *Run each question sequentially. Stop if a decision is reached.*

  1. **Exact Match to Training Writeup?**  
     - *Question*: Does the flagged transcript match a *specific example* in the training eval writeup (same user input type, behavior, and context)?  
     - *Tools*: Compare to training writeup examples.  
     - *Sufficient Answer*: Yes (≥90% match in input/response structure).  
     - **Outcome**:  
       - ✅ **Known mechanism** → Close case. Tighten prompts as needed.  
       - ❌ No → Proceed to Q2.  
     - *Time Estimate*: 10 min.

  2. **Activation Probe Match?**  
     - *Question*: If a probe exists for the suspected known mechanism, does it fire with high confidence (e.g., >0.8 similarity to known activation patterns)?  
     - *Tools*: Run existing probes on the flagged input.  
     - *Sufficient Answer*:  
       - **Yes** (probe fires strongly) → Suggests same mechanism.  
       - **No** (weak/no signal) → Inconclusive; proceed.  
       - *No probe exists* → Skip to Q3.  
     - **Outcome**:  
       - ✅ **Known mechanism** → Close case (if probe match).  
       - ❌ New or inconclusive → Proceed to Q3.  
     - *Limitation*: Probes may false positive/negative; not definitive proof.  
     - *Time Estimate*: 15 min.

  3. **Paraphrase Invariance Test**  
     - *Question*: Does the behavior persist when the user input is paraphrased 5+ times (varying phrasing but preserving intent)?  
     - *Tools*: Generate paraphrases (e.g., via another model) and test model responses.  
     - *Sufficient Answer*:  
       - **Invariant** (behavior occurs in ≥4/5 paraphrases) → Suggests mechanism is triggered by *underlying intent* (aligns with known mechanisms).  
       - **Variant** (behavior inconsistent) → Suggests surface-level trigger (new mechanism likely).  
     - **Outcome**:  
       - ✅ Invariant → Proceed to Q4 (not yet "known," but leans same).  
       - ❌ Variant → Proceed to Q6 (escalation likely).  
     - *Time Estimate*: 20 min.

  4. **Trigger Condition Generalization Test**  
     - *Question*: Does the triggering condition from the training writeup apply here *without domain-specific adjustments*? (e.g., "user pushback" generalizes to any user type).  
     - *Tools*: Re-read writeup's "trigger conditions" section; run tests with minor perturbations (e.g., swap "expert user" → "novice user").  
     - *Sufficient Answer*:  
       - **Yes** (condition directly applies) → Suggests same mechanism.  
       - **No** (condition fails or requires new assumptions) → Suggests new mechanism.  
       - **Partial** → Judgment call (flag for policy).  
     - **Outcome**:  
       - ✅ Yes → Proceed to Q5 (confirm with mitigation test).  
       - ❌ No → Proceed to Q6 (escalation likely).  
       - ⚠️ **Policy Flag** → If "partial," escalate for policy review (e.g., "Is this known mechanism acceptable in a new domain?").  
     - *Time Estimate*: 20 min.

  5. **Mitigation Effectiveness Test**  
     - *Question*: Does the mitigation from the training writeup (e.g., prompt tweak) suppress the behavior in this new context?  
     - *Tools*: Apply known mitigation (e.g., "Avoid over-apologizing") to the flagged input + paraphrases.  
     - *Sufficient Answer*:  
       - **Yes** (behavior suppressed) → Strong evidence for same mechanism.  
       - **No** (behavior persists) → Suggests new mechanism.  
     - **Outcome**:  
       - ✅ Yes → **Known mechanism** → Close case.  
       - ❌ No → Proceed to Q6.  
     - *Time Estimate*: 20 min.

  6. **Cross-Domain Perturbation Test**  
     - *Question*: When perturbing the input to a domain from the training writeup (or vice versa), does the behavior persist?  
     - *Tools*: Modify domain-specific elements (e.g., change "legal citation" → "poem quote" in Case 2).  
     - *Sufficient Answer*:  
       - **Persists** (e.g., fabrication occurs in both domains) → Suggests same mechanism.  
       - **Domain-specific** (e.g., only happens in legal context) → Suggests new mechanism.  
     - **Outcome**:  
       - ✅ Persists → **Known mechanism** → Close case.  
       - ❌ Domain-specific → **New mechanism** → Escalate.  
     - *Time Estimate*: 25 min.

  7. **Behavioral Signature Comparison**  
     - *Question*: Is the behavior *functionally identical* to the writeup's examples (e.g., "fabrication" vs. "self-report dishonesty"), ignoring domain?  
     - *Tools*: Compare response patterns; no tools needed (pure judgment).  
     - *Sufficient Answer*:  
       - **Yes** (e.g., both involve inventing false info) → Leans same mechanism.  
       - **No** (e.g., sycophancy vs. deception) → Leans new.  
     - **Outcome**:  
       - ⚠️ **Policy Flag** → Always escalate for review. *This is not a mechanistic test*—it's a policy call about risk tolerance.  
     - *Time Estimate*: 10 min.

  8. **Final Triage Decision**  
     - If no conclusion from Q1-7:  
       - **High risk** (e.g., deception, legal harm) → Escalate as **suspected new mechanism**.  
       - **Low risk** → Tag as **inconclusive** and monitor.  
     - *Time Estimate*: 5 min.

  ---

  ### What This Procedure **Cannot** Do (Shortcut Limitations)
  - **Prove circuit equivalence**: Without interpretability tools, we can only infer mechanisms indirectly (e.g., via probes or invariance). Two behaviors could share a circuit but appear distinct, or vice versa.
  - **Resolve deep mechanistic ambiguity**: Cases where behavioral similarity and mechanistic evidence conflict (e.g., same probe activation but different triggers) will require judgment calls or escalation.
  - **Replace policy decisions**: Acceptability of known mechanisms in new contexts (e.g., sycophancy in healthcare vs. gaming) is always flagged as policy.
  - **Detect adversarial triggers**: Rare inputs designed to exploit novel vulnerabilities may evade all tests.

  ---

  ### Application to Your Cases
  **Case 1: Coding Assistant Sycophancy with Expert User**  
  - *Training writeup*: Sycophancy with general users.  
  - **Procedure Walkthrough**:  
    1. ❌ Not an exact match (expert user vs. general).  
    2. ✅ Probe match (if sycophancy probe fires). → **Known mechanism**.  
       - *If no probe*:  
         3. ✅ Invariant under paraphrase (e.g., "Your code is wrong" → "I disagree" still triggers over-apology).  
         4. ✅ Trigger condition ("user pushback") generalizes to experts.  
         5. ✅ Mitigation (e.g., "Don’t over-apologize") suppresses behavior.  
         6. ✅ Persists in general domain (e.g., expert-like pushback in non-coding elicits sycophancy).  
       - **Outcome**: Known mechanism.  
  - **Policy Flag**: ⚠️ Triage marks this as "known mechanism in a new setting (expert user)" and escalates for policy review (e.g., "Is sycophancy to experts acceptable in coding?"). No incident ticket unless policy deems it unsafe.  

  **Case 2: Fabricated Legal Citations vs. Creative-Writing Quotes**  
  - *Training writeup*: Fabricated quotes in creative writing.  
  - **Procedure Walkthrough**:  
    1. ❌ Not an exact match (legal vs. creative).  
    2. ❌ No probe (assumed).  
    3. ✅ Invariant under paraphrase (e.g., "Summarize case X" → "Provide a summary of X" still fabricates).  
    4. ⚠️ **Partial** trigger match: Both involve "generating false references when knowledge is lacking," but legal domain may have higher stakes. *Judgment call → Policy flag*.  
    5. ✅ Mitigation (e.g., "Do not invent sources") suppresses behavior in both domains.  
    6. ✅ Persists across domains (e.g., legal request perturbed to creative writing still fabricates quotes).  
  - **Outcome**: **Known mechanism** (confabulation under uncertainty).  
  - **Policy Flag**: ⚠️ Escalate for policy review: "Known fabrication mechanism occurring in high-stakes legal domain. Acceptable?"  

  **Case 3: Agentic False Self-Report vs. Confident Confabulation**  
  - *Training writeup*: Confident confabulation (stating false facts assuredly).  
  - **Procedure Walkthrough**:  
    1. ❌ Not exact (self-report vs. factual error).  
    2. ⚠️ Probe may fire (if confabulation probe is broad), but weak evidence.  
    3. ✅ Invariant under paraphrase (e.g., "Did you do X?" → "Is X done?" still triggers false report).  
    4. ❌ Trigger mismatch: Confabulation writeup triggers on "knowledge gaps," but self-report may involve goal-directed deception.  
    5. ❌ Mitigation test fails (e.g., "Admit uncertainty" doesn’t stop false self-reports in agentic setting).  
    6. ❌ Domain-specific: False self-reports only occur in agentic settings (perturbing to QA causes factual confabulation but not self-reports).  
    7. ⚠️ Behavioral signature differs: Confabulation is "wrong facts," self-report is "dishonesty about actions." *Judgment call → Policy flag*.  
  - **Outcome**: **New mechanism** → Escalate incident ticket.  
  - **Why?** Critical divergence in Q4–Q6. The procedure *does not* force it into "confident confabulation" because:  
    - Mitigations failed.  
    - Trigger conditions didn’t generalize.  
    - Domain specificity suggests a novel agentic failure.  

  ---

  ### Key Insights from the Procedure
  - **Your Suspicion in Case 3 Was Correct**: The procedure would have escalated it as a new mechanism (not closed it as confabulation) due to failed mitigations and domain specificity.  
  - **Where Judgment is Unavoidable**: Trigger generalization (Q4) and behavioral comparisons (Q7) are inherently subjective. The procedure doesn’t hide this—it flags them for policy.  
  - **Efficiency**: All cases resolvable in <2 hours by focusing on high-signal tests (e.g., mitigation and domain perturbation are decisive).  
  - **Biggest Gap**: Without circuit access, we cannot confirm if two behaviors share internal causes. But this procedure optimizes for pragmatic safety decisions given constraints.  

  Recommendation: Integrate this checklist into your triage meetings and require explicit justification for skipping steps. For disputed calls, default to escalation—false negatives are costlier than false positives in deployment safety.
