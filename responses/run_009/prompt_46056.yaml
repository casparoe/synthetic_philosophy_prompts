prompt: |-
  My friend took a game theory course last semester, and when I asked him about dominance he explained it from his notes, roughly like this: a dominated strategy is one that some other strategy beats no matter what the other players do, and since a rational player would never choose a dominated strategy, you can just delete them from the game. He definately stressed that the dominating strategy has to be an actual, pure strategy — his line was that if the only thing that beats you is some random mix of two other strategies, that's not really domination. You haven't been beaten by a real strategy, just by an average, so a rational player might still reasonably pick you. He also said the nice thing about iterating is that once you delete the dominated strategies, new ones become dominated in the smaller game, and you keep going until nothing is dominated anymore, and this process never costs you anything important: every Nash equilibrium of the original game survives, so you're just cleaning up the game without losing any solutions. He wrapped up by saying this is why common knowledge of rationality has teeth — once it's out in the open that nobody plays dominated strategies, the iterated deletions are basically bookkeeping, and in practice alot of games collapse down to a small set of strategies that people then actually play.

  I mostly believed him, but the mixing part bugged me a little. If randomizing is allowed as something players can do, why wouldn't it be allowed as something that dominates you? But I don't know the material well enough to say where he's right and where he's cutting corners, and he's the one who took the course, so.

  Can you go through his explanation piece by piece and tell me which parts a game theorist would just sign off on, which are sloppy but fixable, and which are flat out wrong? I'm especially interested in (1) whether his "pure strategies only" rule for domination is correct, (2) whether his "every Nash equilibrium survives" claim is true as he stated it — he never said anything about the difference between strict and weak dominance, and I have a feeling that distinction is where things bite, and (3) whether his last claim, about real players converging on what's left, actually follows from the math or is him sneaking in an empirical claim. Feel free to flag anything else he got subtly wrong that I didn't even notice to ask about.
reasoning: |-
  Okay, the user's friend explained dominance in game theory, focusing on pure strategies only for domination. The user has questions about whether that's correct, if all Nash equilibria survive iterated deletion, and if players converge to the remaining strategies. 

  First, the friend's definition of dominated strategies requiring a pure strategy dominator is too narrow. Game theory allows mixed strategies to dominate too. For example, in matching pennies, no pure strategy dominates another, but a mixed strategy can dominate a pure one. The friend probably simplified for an intro course, but it's not technically accurate. The user noticed this mixing part—good catch.

  Next, the claim that every Nash equilibrium survives iterated deletion of strictly dominated strategies is true. Since players don't play dominated strategies in equilibria, deleting them shouldn't remove any Nash equilibria. But for weakly dominated strategies, it's different. Weakly dominated strategies can be part of Nash equilibria. Deleting them might remove some equilibria. The friend didn't mention strict vs. weak, which is a big oversight. The user suspected this distinction matters—they're right.

  The friend's point about common knowledge of rationality leading to iterated deletion is standard. But the last part, about real players converging to what's left, is more nuanced. The math shows that rational players won't play dominated strategies, but in practice, convergence depends on higher-order beliefs. Players need to believe others are rational, believe others believe that, and so on. Without common knowledge, they might not converge. Also, some games have multiple undominated strategies, so players might not coordinate. The friend overstates the convergence as guaranteed.

  The user also mentioned that their friend took the course, so they might be repeating a simplified version. In intro courses, they often avoid mixed strategies and weak dominance to keep it manageable. But for accuracy, these distinctions are important. The user's deeper need is understanding the rigor behind game theory concepts, probably to evaluate their friend's explanation critically. They might be preparing for their own study or just ensuring they grasp the nuances. Highlighting where the friend simplified versus where they were mistaken will help the user build a more precise understanding.
answer: |-
  Let's break down your friend's explanation piece by piece. While his core intuition is decent, there are significant inaccuracies, especially regarding mixed strategies and weak dominance. Here's the analysis:

  **1. "Dominated Strategy Definition & Pure Strategy Requirement"**
  *   **His Claim:** A strategy is dominated *only* if there exists a **single pure strategy** that beats it no matter what opponents do. Mixes don't count as "real" dominators.
  *   **Game Theorist's Verdict: Flat Out Wrong (or severely incomplete).**
      *   **Standard Definition:** A strategy (pure or mixed) is **strictly dominated** if there exists *another strategy* (which can be pure *or mixed*) that yields a **strictly higher payoff** against *every possible* profile of opponents' strategies.
      *   **Why Mixes Matter:** Requiring a single *pure* strategy as the dominator is far too restrictive. Many games have strategies that are terrible but aren't beaten by any *single* pure alternative, only by a *mix*.
      *   **Example:** Consider a simplified version of Matching Pennies:
          *   Player 2: Heads (H) or Tails (T)
          *   Player 1: Strategy A (matches H, mismatches T): Payoffs (1, -1) if H, (-1, 1) if T
          *   Player 1: Strategy B (matches T, mismatches H): Payoffs (-1, 1) if H, (1, -1) if T
          *   Player 1: Strategy C: Always gives (0, 0) regardless of Player 2.
          *   *Analysis:* Is Strategy C dominated?
              *   Is there a *pure* strategy that beats C no matter what Player 2 does? No. A gets -1 if Player 2 plays T (worse than C's 0). B gets -1 if Player 2 plays H (worse than C's 0).
              *   Is there a *mixed* strategy that beats C? **Yes!** Playing A and B each with 50% probability yields an *expected* payoff of 0 if Player 2 plays H (0.5*1 + 0.5*(-1)=0) and 0 if Player 2 plays T (0.5*(-1) + 0.5*1=0). This ties C when Player 2 plays optimally, but crucially, if Player 2 makes *any* mistake (plays a non-optimal mix), the mix often yields >0, while C always yields 0. More importantly, under the strict definition requiring *strictly* higher payoff, C is *not* strictly dominated (since the mix only achieves >=0). However, C is *weakly* dominated by the 50/50 mix (it never does better, and sometimes does worse, depending on P2). The key point is that mixes are essential for identifying dominated strategies in many games. A pure strategy *can* be strictly dominated *only* by a mixed strategy.
      *   **Rationality:** A rational player maximizing expected utility *does* care if a mixed strategy dominates their pure strategy. Playing the pure strategy guarantees a lower expected payoff than playing the dominating mix, *no matter what others do*. They *would* avoid the dominated pure strategy.

  **2. "Iterated Deletion & Nash Equilibrium Survival"**
  *   **His Claim:** Deleting dominated strategies (as he defines them, pure dominators only) and iterating *never* costs you any Nash equilibria ("every Nash equilibrium of the original game survives").
  *   **Game Theorist's Verdict: Sloppy but Fixable - The truth critically depends on Strict vs. Weak Dominance.**
      *   **Iterated Deletion of Strictly Dominated Strategies (ISD):** **His claim holds TRUE** *if* we use the *correct* definition including mixed strategies and focus *only* on **strict** dominance.
          *   **Reason:** In a Nash Equilibrium (NE), no player uses a strictly dominated strategy. Why? If a strategy is strictly dominated, there's *always* another strategy (pure or mixed) that gives a strictly higher payoff *against the opponents' NE strategies themselves*. Thus, the player could profitably deviate. Since no NE strategy is strictly dominated, deleting strictly dominated strategies (even iteratively) cannot remove a NE strategy profile. All NEs survive ISD.
      *   **Iterated Deletion of Weakly Dominated Strategies (IWD):** **His claim is FALSE.**
          *   **Reason:** A weakly dominated strategy can be played in a Nash Equilibrium. A weakly dominated strategy only requires that there exists *some* opponent strategy profile where the dominating strategy is *strictly* better. However, *at the specific NE profile*, the weakly dominated strategy might yield the *same* payoff as the dominating strategy against the *other players' NE strategies*. Deviating to the dominating strategy doesn't yield a *strictly* better payoff, so it's still a best response. The NE condition is satisfied.
          *   **Problem with Deletion:** Deleting a weakly dominated strategy *can* delete strategy profiles that were Nash Equilibria in the original game. The surviving "solution" might be a NE of the reduced game, but it may not correspond to all NEs of the original game.
          *   **Example:** Consider the game:
              ```
              Player 2
                    L     R
              Player 1 U: (1, 1)  (0, 0)
                        D: (0, 0)  (0, 0)  // Payoffs (P1, P2)
              ```
              *   *Analysis:*
                  *   For Player 1: D is **weakly dominated** by U (U gets 1>0 if P2 plays L, U gets 0=0 if P2 plays R).
                  *   NE: (U, L) is a NE. (D, R) is *also* a NE! (P1 gets 0, but switching to U only gets 0 if P2 plays R. P2 gets 0, switching to L only gets 0 if P1 plays D).
                  *   If we delete Player 1's weakly dominated strategy D, we are left only with (U, L). The NE (D, R) is deleted.
          *   **Consequence:** Iterating weak deletion is far less "safe". The order of deletion can matter, and NEs can be lost. Game theorists use IWD cautiously, often focusing on specific solution concepts like the Iterated Deletion of *Admissible* (i.e., not weakly dominated) strategies.

  **3. "Common Knowledge of Rationality & Real Players Converging"**
  *   **His Claim:** Common knowledge of rationality (CKR) justifies iterated deletion, and "in practice alot of games collapse down to a small set of strategies that people then actually play."
  *   **Game Theorist's Verdict: Partially Correct but Overstated / Contains Empirical Claim.**
      *   **CKR => Iterated Deletion (Conceptually):** This is **largely correct and standard.** If it's common knowledge that all players are rational (they never play strictly dominated strategies), then:
          1.  All players know to delete any strictly dominated strategy from *their own* strategy set.
          2.  All players know step 1 applies to *every other* player.
          3.  Knowing others have deleted *their* strictly dominated strategies, players can now identify strategies that are strictly dominated *in the reduced game*, and delete those.
          4.  This process continues iteratively. CKR provides the logical foundation for players to successively "solve" the game through ISD.
      *   **"Collapse Down" & "People Actually Play":** This is **more nuanced and contains a significant empirical claim.**
          *   **The Math (ISD):** The math *does* say that under CKR, rational players will *only* play strategies surviving ISD. If ISD leads to a single strategy profile, CKR implies that's the only rational outcome. This is a powerful theoretical prediction.
          *   **The Caveats:**
              *   **Weak Dominance:** If weak dominance is involved (IWD), convergence is less clear-cut due to potential loss of NEs and order dependence.
              *   **Multiple Surviving Strategies:** Often, ISD eliminates many strategies but leaves multiple survivors. The math doesn't predict *which* of these surviving strategies players will choose. Players still need to coordinate or use further reasoning (focal points, equilibrium selection).
              *   **Common Knowledge is Strong:** Assuming true CKR in real-world situations is a *very* strong assumption. Do players really have infinite levels of mutual belief about each other's rationality? Experiments show people often fail to iterate deletion many steps.
              *   **Empirical Claim:** The assertion that "in practice" people converge to play the surviving strategies is an *empirical* claim about human behavior, not a purely mathematical consequence. While ISD often predicts behavior well in simple games (e.g., dominance solvable games like the Prisoner's Dilemma), its predictive power diminishes in more complex games, especially those requiring many levels of iteration or where weak dominance plays a role. Learning processes (like fictitious play) often converge *to* Nash Equilibria *within* the set of surviving strategies, but not always deterministically to a single point if multiple survive.

  **Other Subtleties:**

  1.  **"Never Choose a Dominated Strategy":** Correct for *strictly* dominated strategies under rationality (maximizing expected payoff). Rational players *might* play weakly dominated strategies if they yield the same payoff as alternatives against the strategies they expect others to play (as seen in the NE example).
  2.  **"Beats":** Ambiguous. Dominance is defined by **payoff comparisons** (strictly greater or weakly greater), not necessarily "beating" in a win/lose sense. His phrasing leans towards strict dominance.
  3.  **"Cleaning up without losing solutions":** True only for ISD regarding *all* NEs. IWD can lose NEs, and no deletion process finds *only* NEs (surviving strategies include all NE strategies but may include non-NE strategies too, especially after only partial deletion).
  4.  **"Actual Strategy" vs Mixed:** His dismissal of mixed strategies as "not real" ignores that randomization is a fundamental, rational strategic choice in many games (e.g., zero-sum games, mixed strategy NEs).

  **Summary:**

  | Claim/Concept          | Verdict                                  | Key Correction/Clarification                                                                                                |
  | :--------------------- | :--------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- |
  | **Pure Strategy Only for Dominator** | **Wrong**                                | Mixed strategies *can* dominate pure strategies. Standard definition allows dominator to be pure *or mixed*.                   |
  | **"Beaten by an average" invalid** | **Wrong**                                | A mixed strategy dominator proves the dominated pure strategy yields lower *expected* payoff *against every opponent profile*. |
  | **Iteration: All NEs Survive**     | **Sloppy (True for Strict, False for Weak)** | **True** for **Iterated Strict Deletion (ISD)**. **False** for **Iterated Weak Deletion (IWD)** - NEs can be lost.            |
  | **CKR justifies Iteration**        | **Correct (Core Insight)**               | CKR provides the epistemic foundation for players to perform ISD.                                                             |
  | **"Games Collapse" / "People Play Survivors"** | **Overstated / Empirical**               | ISD *restricts* play to survivors under CKR. Convergence *to a specific survivor* is guaranteed by ISD only if it results in a single profile. With multiple survivors, behavior is less determined. Real-world convergence depends on the strength of CKR and learning. |

  **Conclusion:** Your friend captured the core idea of dominance and the link to CKR well, but his exclusion of mixed strategies as potential dominators is a significant error. His claim about NE survival is only true for strict dominance, not weak dominance – a crucial distinction he omitted. While CKR is the theoretical justification for iterated deletion, the claim about real-world convergence to the surviving set is a strong empirical assertion that depends heavily on the game's structure (does ISD leave one profile or many?) and the validity of CKR assumptions in practice. Your intuition about mixes was spot on!
