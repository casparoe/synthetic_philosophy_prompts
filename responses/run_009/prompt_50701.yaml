prompt: |-
  Me and my friend Marcus just got out of a three-hour argument (over dinner, it got a bit heated lol) and I think it was actually about something bigger than what we were officially arguing about, so I want to know if philosophy has a name for the thing we kept circling around.

  The argument: Marcus has decided he's going to believe in an afterlife. Not because of evidence -- he admits there isn't any good evidence either way -- but because, he says, the belief will make him less anxious about dying, and beliefs are basically free, so it's rational to pick this one up. His framing was something like: if believing p is good for me, that's a reason for me to believe p, full stop, and if you deny that you're just being dogmatic about what counts as a reason. I kept saying he's pointing at facts about his believing (that it'll calm him down) and treating them like facts about the thing believed (that it's likely). He said there's no difference, since the belief is numerically the same belief either way, and honestly I struggled to say what the difference is beyond "it just is", which definately lost me the argument.

  Since then I keep seeing the same shape everywhere and I'm starting to think it's one thing. A colleague of mine openly "admires" her advisor because being seen admiring him gets her onto the good projects -- the admiration is real, she'd pass a polygraph, but its grounds are all about what the admiration does for her, nothing about him. My uncle says he "trusts" a certain politician because trust is good for the country's mood, so he claims patriotic reasons to trust. A friend swears she loves her boyfriend partly because being in love makes her more productive, and she thinks that's a perfectly fine reason for love. Same structure every time: the attitude is genuinely held, the person isn't lying or confused, but every reason they cite is about the effects or benefits of having the attitude, and none of them are about the object of the attitude. It feels like those reasons are somehow off -- like they don't touch whether the belief is accurate or the admiration deserved -- but I can't say what's off about them, which is exactly where I got stuck with Marcus.

  Some complications I noticed, which is where it gets interesting:

  1. Sometimes the benefits of an attitude DO seem to count in the normal way. Looking forward to a trip is pleasant, and that seems like a perfectly ordinary reason to look forward to it. Same attitude-type (anticipation), same style of grounds (the pleasantness of the anticipating itself), and yet my gut says this one is fine and the Marcus one isn't. Is the difference just that anticipation isn't in the business of being right about anything?

  2. Marcus's belief would also be weakly supported by the usual stuff people cite (near-death experiences etc.). Does the usefulness add anything on top of that, or does it just not count at all?

  3. Some attitudes you can half-choose -- you can work yourself into awe at a mountain, or into gratitude after a near miss. If the choice is open, don't the benefits of the attitude become straightforward reasons to choose it, same as choosing a hobby? Marcus says obviously yes, I say it still feels wrong, and I can't defend that.

  So, questions. Does this distinction -- reasons that come from the consequences of holding an attitude versus reasons that come from the accuracy/object side -- have an established name in philosophy? If yes, what is it, and how does the literature actually draw the line, especially for my complications 1 and 3? If there's no single name, I'd bet it's a few neighbouring concepts -- in that case tell me what they are, how they differ from each other, and which one fits my cases best. And if nothing established fits, coin a term for it, give a definition, and say where its edge cases fall. Please don't just hand me a one-word answer and move on -- what I want is the carve-out, not the label.

  Since you're acting as a professional philosopher working on reasons, rationality, and the norms governing belief and other attitudes: think carefully before answering, and start with a short brainstorm where you list the nearest candidate concepts and say for each one why it's close but not exact. Then give the full answer. Also feel free to tell me Marcus is actually right and I'm the confused one -- I can take it, but you'd have to explain away complication 1 to do it.
reasoning: |-
  Okay, the user had a heated argument with Marcus about believing in an afterlife for practical reasons rather than evidence. They noticed a pattern in other attitudes like admiration, trust, and love where the reasons given are about the benefits of holding the attitude, not about the object itself. The user wants to know if there's a philosophical concept for this distinction and how to handle their complications.

  First, I need to recall relevant philosophical concepts. Pragmatism comes to mind, especially William James' "The Will to Believe," which argues that sometimes practical reasons can justify belief when evidence is insufficient. But James sets strict conditions, like the belief being a genuine option and having momentous consequences. Marcus's case might not meet these criteria since he's choosing belief solely for comfort.

  Then there's the distinction between epistemic and practical reasons. Epistemic reasons relate to truth and evidence, while practical reasons are about benefits. Beliefs are often thought to be governed by epistemic norms, so practical reasons might not directly apply. But the user's first complication is that anticipating a trip for its pleasantness seems fine, unlike believing in an afterlife. Why the difference? Probably because anticipation isn't truth-apt; it's an emotion, not a belief.

  Emotions and conative attitudes like admiration or love might have different norms. Admiration based on career benefits instead of the person's qualities feels off because it violates the "fittingness" of the attitude. The object isn't admirable, so the attitude is unfitting, even if beneficial. This ties into the concept of "fitting attitudes" in value theory.

  The user's third complication involves voluntary control. If you can choose attitudes like awe or gratitude, do practical reasons become valid? But while you can cultivate attitudes, their maintenance might still depend on the object. Forced gratitude might not feel genuine if the object isn't truly appreciated.

  Bernard Williams' thought experiment highlights that beliefs aim at truth; a belief chosen for comfort isn't a belief but a pretense. This addresses Marcus's claim directly. However, the user's colleague isn't pretending to admire; she genuinely feels it. Here, the issue is the attitude's grounding. Her admiration is real but unfitting because it's based on personal gain, not the advisor's merits.

  The term "state-given reasons" versus "object-given reasons" seems to fit best. State-given are benefits of holding the attitude, object-given are about the object's properties. Beliefs require object-given (epistemic) reasons; otherwise, they're not properly beliefs. Emotions might allow both, but object-given reasons are primary for fittingness.

  Complication 1: Anticipation's pleasantness is a state-given reason but acceptable because anticipation isn't truth-apt. The pleasantness is part of the attitude's nature, so it's appropriate. But for beliefs, truth is central, so state-given reasons don't provide the right support.

  Complication 2: Weak evidence plus practical benefits. Epistemically, weak evidence might justify belief if practical stakes are high (pragmatic encroachment), but Marcus's case lacks sufficient evidence. The benefits don't add epistemic weight; they're separate practical reasons.

  Complication 3: Choosing attitudes. Even if you can induce an attitude, its persistence depends on the object. If the mountain isn't awe-inspiring, the feeling might fade. Practical reasons might justify cultivation efforts, but the attitude's validity relies on object-given reasons.

  The user needs a clear distinction to articulate why Marcus's approach feels wrong. State-given vs. object-given reasons capture this. For beliefs, object-given (epistemic) reasons are essential. Marcus's belief isn't rational because it lacks proper grounding, even if beneficial. The colleague's admiration is unfitting, not insincere. The user's intuition aligns with philosophical norms about attitude propriety.

  Also, the user might seek validation of their discomfort with these attitudes. They want to understand the underlying principles to better argue their point, especially with Marcus. Highlighting the difference between state and object reasons provides that framework. Explaining why some attitudes (emotions) allow state reasons when they're constitutive, like anticipation's pleasantness, while beliefs do not, addresses complication 1.

  In conclusion, the key concepts are epistemic vs. practical reasons, fittingness, and the voluntariness of belief. The state/object distinction best encapsulates the user's observations, clarifying why Marcus's belief and similar attitudes are problematic despite their benefits.
answer: |-
  This is a beautifully sharp observation, and you're absolutely right that you've hit upon a fundamental distinction in philosophy, particularly in epistemology (theory of knowledge) and the philosophy of mind/ethics (for attitudes like admiration, trust, love). Marcus isn't entirely wrong, but neither are you – the issue lies in the *type of norm* governing different attitudes and the *kind of reasons* that are relevant for them.

  Here's the breakdown:

  **Brainstorm: Candidate Concepts & Why They're Close But Not Perfect**

  1.  **Epistemic Reasons vs. Pragmatic Reasons:**
      *   **Close:** This is the most direct candidate. Epistemic reasons pertain to truth, evidence, justification, and accuracy (e.g., evidence for an afterlife). Pragmatic reasons pertain to usefulness, benefit, desire-satisfaction, or psychological well-being (e.g., believing reduces anxiety).
      *   **Not Exact:** While Marcus *claims* pragmatic reasons count for belief, the core debate *is* whether they can ever be genuine reasons for belief *itself*. The distinction doesn't automatically explain *why* pragmatic reasons feel "off" for belief/trust/admiration/love but fine for anticipation (Complication 1) or how voluntary control plays in (Complication 3). It also doesn't capture the "object-directedness" you identified.

  2.  **The Ethics of Belief (Clifford/James):**
      *   **Close:** William James ("The Will to Believe") argued that when evidence is insufficient and the option is "live, forced, and momentous," we have a right to let our "passional nature" (including pragmatic benefits) decide. Marcus echoes James. W.K. Clifford ("The Ethics of Belief") famously argued it's *always* wrong to believe anything on insufficient evidence ("it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence").
      *   **Not Exact:** This debate focuses *specifically* on belief. It doesn't neatly extend to attitudes like admiration, trust, or love. It also doesn't resolve your complication about anticipation or voluntary cultivation. Furthermore, James set strict conditions Marcus likely doesn't meet (e.g., is belief in afterlife *forced*? Is the evidence *truly* balanced?).

  3.  **Fitting Attitude Analysis (Value Theory):**
      *   **Close:** This framework asks what makes an attitude (like admiration, blame, fear) *fitting* or *appropriate* to its object. Fittingness depends on the properties *of the object* (e.g., is the advisor *admirable*? Is the politician *trustworthy*? Is the boyfriend *lovable*?). Your intuition that the reasons don't "touch the object" points directly here.
      *   **Not Exact:** It primarily applies to evaluative attitudes tied to values (admiration, blame) rather than purely cognitive ones like belief or mixed ones like anticipation. Belief is often seen as governed by truth, not *value* fittingness in the same way. It also doesn't inherently explain *why* pragmatic benefits wouldn't *also* count towards fittingness in some cases.

  4.  **State-Given Reasons vs. Object-Given Reasons (Parfit, Schroeder):**
      *   **Close:** This distinction, developed primarily for desires and beliefs but extendable, is the most promising fit for your core insight.
          *   **Object-Given Reasons:** Reasons that derive from properties of the *object* of the attitude. (E.g., evidence for the afterlife is a reason *to believe it exists*; the advisor's brilliance is a reason *to admire him*; the politician's track record is a reason *to trust her*; the boyfriend's kindness is a reason *to love him*).
          *   **State-Given Reasons:** Reasons that derive from the *goodness or badness of being in the state* of having the attitude. (E.g., reduced anxiety is a reason *to be in the state of believing* in an afterlife; career advancement is a reason *to be in the state of admiring* the advisor; national unity is a reason *to be in the state of trusting* the politician; increased productivity is a reason *to be in the state of loving* the boyfriend).
      *   **Not Exact (Yet):** This distinction *needs* to be combined with the norms governing the specific attitude to explain *why* state-given reasons often seem inappropriate or insufficient for certain attitudes, especially belief.

  **The Core Distinction and Its Name: State-Given vs. Object-Given Reasons + Attitudinal Norms**

  The established distinction you're circling is **State-Given Reasons vs. Object-Given Reasons**. However, understanding *why* state-given reasons feel "off" for beliefs, admiration, trust, and love, requires combining this with the *constitutive norms* or *aims* of those specific attitudes. **Object-given reasons are primary and constitutive for attitudes whose core function involves representing or responding to the world accurately (belief) or to genuine value properties (admiration, trust, love). State-given reasons are often seen as secondary, external, or even irrelevant to the core function of these attitudes.**

  *   **Belief:** The constitutive norm of belief is **truth** or **knowledge**. A belief aims to represent how the world *is*. Therefore, reasons for belief must be reasons that bear on the *truth* of the proposition believed. Object-given reasons (evidence) are directly relevant to this norm. State-given reasons (comfort, utility) are irrelevant to whether the proposition is *true*. As Bernard Williams famously argued, you cannot *decide* to believe P for purely pragmatic reasons because the moment you recognize your reason for "believing" P is *only* its utility, and not its truth, you are no longer genuinely *believing* P; you are *wishing* it were true or *acting as if* it were true. Belief is not under direct voluntary control precisely because it is answerable to truth. Marcus might *succeed* in making himself feel less anxious, but if he admits there's no evidence, he's likely cultivating a comforting *pretense* or *hope*, not a genuine *belief* governed by the norm of truth. His "full stop" claim ignores the constitutive aim of belief.
      *   **Complication 2 (Weak Evidence + Usefulness):** Weak evidence provides *some* object-given reason (however small). Usefulness provides a state-given reason. They are fundamentally different *types* of reason. The state-given reason doesn't *add* to the object-given reason's strength concerning *truth*. It might give Marcus a *practical* reason to *focus on* the weak evidence or *interpret it charitably*, but it doesn't make the proposition *more likely to be true*. The state-given reason is a reason *to get himself to believe*, not a reason *constitutive of the belief itself*.
  *   **Admiration/Trust/Love (Evaluative Attitudes):** These attitudes have norms of **fittingness** or **appropriateness**. Admiration is fitting when directed at something genuinely admirable. Trust is fitting when directed at someone trustworthy. Love (in its robust, non-instrumental sense) is fitting when directed at someone lovable. Fittingness depends on the *properties of the object*. Your colleague's state-given reason (career advancement) is a reason *to cultivate admiration*, but it doesn't make her advisor *admirable*. Her attitude might be sincere (she passes the polygraph on *feeling* admiration), but it is arguably **unfitting** or **misplaced** because its *grounds* (the reasons that *justify* it to her) are state-given, not object-given. The attitude isn't properly *responsive* to the object's actual properties. Same for your uncle's "trust" and your friend's "love" – the state-given reasons don't make the politician trustworthy or the boyfriend lovable. The attitude exists, but its connection to the *reality of its object* is severed; it's grounded in its effects on the holder, not its correspondence to the object's value.
  *   **Anticipation (Complication 1 - Why it's different):** Anticipation is a conative/affective state, not primarily a cognitive or evaluative one aiming at truth or fittingness. Its core function isn't accurate representation but *preparation* and *affective engagement*. While it might *involve* beliefs (e.g., believing the trip will happen), the *pleasantness of anticipating* **is itself an object-given reason** relative to the attitude's nature. Pleasure is a constitutive part of the *point* or typical function of positive anticipation. Anticipation *aims* at pleasant engagement with a future prospect. Therefore, the fact that anticipating the trip is pleasant *is* a reason grounded in the nature of the attitude itself and its typical object (a desired future event). It's not an *external* state-given reason in the same way anxiety reduction is external to the constitutive aim of *belief* (truth). The norm here is closer to "being enjoyable" or "motivating," not "accurate" or "fitting."
  *   **Voluntary Cultivation (Complication 3):** You *can* often intentionally cultivate attitudes like awe, gratitude, or even hope (which is related to Marcus's case). State-given reasons (benefits) seem like perfectly good reasons *to undertake the project* of cultivating that attitude. **However:** The *success* and *sustainability* of that cultivation, and the *genuineness* of the attitude once cultivated, typically *requires* finding or constructing plausible *object-given reasons*.
      *   To cultivate awe at the mountain, you might focus *on the mountain* (its size, beauty, history – object-given reasons for awe).
      *   To cultivate gratitude after a near miss, you focus *on the value of what was almost lost* (object-given reasons for gratitude).
      *   If Marcus tries to cultivate belief in an afterlife, he might focus on near-death experiences (attempting to find object-given reasons) or interpret vague feelings as signs (again, seeking object-given justification).
      *   Your colleague focuses *on the advisor* (his power, achievements – perhaps finding *some* object-given reasons, even if the initial motivation was state-given).
      *   **The Key Point:** While state-given reasons can be reasons *to try to get yourself* into a mental state, the resulting state only qualifies as the *genuine attitude* (belief, admiration, gratitude, awe) if the person, through their effort, comes to hold it *because* of (or at least consistently with) perceived object-given reasons. If the attitude *only* persists because of the state-given benefits and collapses the moment those benefits are removed or the person reflects critically on the lack of object-given reasons, it reveals itself as less than fully genuine. The state-given reason justifies the *action* of cultivation; the object-given reasons (or the *finding* of them) are necessary for the resulting *state* to meet the constitutive norm of the attitude.

  **Conclusion: The Carve-Out**

  You've identified the distinction between **State-Given Reasons** (reasons concerning the *goodness of being in the state* of having an attitude) and **Object-Given Reasons** (reasons concerning the *properties of the object* the attitude is about).

  *   **Why it feels "off":** For attitudes governed by strong constitutive norms like **truth** (belief) or **fittingness** (admiration, trust, love), object-given reasons are primary and essential. State-given reasons are external to these norms. Relying solely or primarily on state-given reasons for these attitudes severs the essential link between the attitude and the world it's supposed to represent or respond to. It makes the attitude *instrumental* to the holder's psychology, not *responsive* to the object's reality. Marcus might achieve comfort, your colleague might get projects, your uncle might feel patriotic, and your friend might be productive, but their *belief*, *admiration*, *trust*, and *love* are not properly grounded in the world those attitudes purport to be about. The attitudes become self-referential psychological tools rather than ways of engaging with reality.
  *   **Is Marcus Right?** Not about belief being "rational, full stop" based solely on pragmatic benefit. He's right that beliefs can have benefits and that we can sometimes influence what we believe. He's right that pragmatic reasons can be good reasons *to try to cultivate* a belief. But he's wrong that pragmatic benefits constitute a *reason for the belief itself* in the way that evidence does. They don't bear on the truth, which is belief's core aim. His belief, if held solely for comfort and while admitting no evidence, fails to meet the constitutive norm of belief (truth) and is more accurately described as a form of hopeful pretense or self-manipulation. His argument ignores the essential nature of the attitude he claims to hold.
  *   **The Edge Cases:** The distinction holds, but its *significance* depends on the attitude's constitutive norm:
      *   **Belief (Truth Norm):** State-given reasons are fundamentally irrelevant and cannot justify belief.
      *   **Evaluative Attitudes (Fittingness Norm - Admiration/Trust/Love):** State-given reasons don't make the attitude fitting; relying solely on them makes the attitude unfitting or misplaced, even if sincere.
      *   **Affective/Conative States (Anticipation - Pleasure/Engagement Norm):** The pleasantness *is* an object-given reason relative to the attitude's function; state-given reasons like this are core and appropriate.
      *   **Cultivation:** State-given reasons can justify the *action* of trying to cultivate an attitude, but the *success* and *genuineness* of the cultivated attitude typically depend on finding or creating supporting object-given reasons aligned with the attitude's constitutive norm.

  Marcus picked a belief because he wanted its effect. You sensed this instrumentalization violated something essential about what belief *is*. Philosophy offers the tools to articulate that violation: the conflation of state-given and object-given reasons, ignoring the constitutive norm of truth. The same pattern explains the unease with your colleague, uncle, and friend – their attitudes are sincere but unfitting, severed from the reality of their objects.
