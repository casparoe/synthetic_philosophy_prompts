  9. **Should attitudes to risk play an independent role in evaluation?**  
     - *Yes* → **Leaf I: Risk-Weighted Evaluation** (e.g., risk-sensitivity; answers: Q6=No, Q1=No, Q2=Yes, Q3=No, Q4=No, Q5=Yes). Proponent: Buchak (REU).  
