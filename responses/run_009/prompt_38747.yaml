prompt: |-
  Two of my friends have been arguing about Twin Earth for like two years now — one is a pretty doctrinaire semantic externalist (Putnam's side, roughly), the other an internalist who insists that whatever meaning is, it's gotta be in the head. They finally agreed to an adversarial collab and somehow I got volunteered to draft the joint statement. Please write it for me. I want: (1) the claims both can sign about the thought experiment itself — what exactly we're asked to imagine, what the Earthling in 1750 (before anyone knew water's chemical structure) and his Twin Earth duplicate share and don't share, which intuitions the case was designed to pump and which complaints about it (e.g. that it smuggles in facts about reference to describe the case at all) both take seriously; (2) the precise residual disagreements, each phrased so its own side would accept the wording — e.g. whether the 1750 Earthling and his twin mean the same by "water", whether that question even has a determinate answer, and whether there's such a thing as narrow content that's shared between them; (3) the cruxes, and for each crux at least one concrete case or argument both sides agree would bear on it, with each side's prediction written down in advance.

  Two things they insist have to be in there. First, this variant one of them keeps bringing up: a third planet where the lakes contain a stable, evenly mixed 50/50 solution of H2O and XYZ, indistinguishable from water by look, taste, or use — when the locals say "the lake is full of water", are they saying something true? Both sides have to give their line on it in the statement. Second, they've each accused the other of partly talking past them about whether "meaning" is being used to mean reference or something more like understanding/competence — if part of the fight really is verbal, the statement should come out and say which part and why.

  Format: numbered section of agreed claims, then a table for the disagreements and cruxes. Keep it tight enough that both would actually sign it.
