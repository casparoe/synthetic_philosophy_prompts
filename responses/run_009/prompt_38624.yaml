prompt: |-
  After eight years on the ward I now train incoming nurses at a chronic-pain clinic, and the hardest thing to teach is not any clinical skill but how much weight to give a patient's own account of her pain — especially when the workup keeps coming back normal, or the chart flags a history of lost prescriptions, or the patient describes her symptoms in words that match nothing in the textbook. I want to give them something better than an instruction to use their judgment, because judgment under pressure, with twenty intakes a day and two minutes each, is exactly where the discounting of self-reports does its work: the well-documented pattern in which some patients are believed and others are not for reasons about who they are rather than what they say. Please turn the relevant philosophy — the kind that distinguishes warranted skepticism from identity-based discounting of a speaker, and that recognizes cases where patient and clinician simply lack a shared vocabulary for the experience — into a procedure a nurse can actually run at intake: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a referral to the clinician, and where it forces a check on the nurse's own first reaction. Then run it on three cases: a middle-aged woman with three years of normal tests and incapacitating fatigue; a young man with two documented incidents of misleading staff, now reporting acute pain; and a patient whose symptoms are conveyed mostly through a relative who translates for her. Include at least one case where the procedure gives an answer the clinic's opioid policy will not welcome, and say plainly what the procedure cannot settle. Please open with the bottom line — one sentence stating the core rule the procedure rests on — and then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Okay, the user is a nurse educator at a chronic-pain clinic struggling to teach new nurses how to evaluate patient pain reports objectively. They want a concrete procedure to prevent unconscious bias—especially when tests are normal, there's history of prescription issues, or symptoms don't match textbook descriptions. Their frustration is palpable: they see judgment under time pressure leading to unfair discounting of certain patients' accounts.  

  Hmm, the core challenge is translating philosophical concepts—like epistemic injustice and hermeneutical gaps—into a practical intake tool. The user explicitly wants:  
  - A step-by-step procedure nurses can run during short intakes  
  - Clear thresholds for referrals/challenging biases  
  - Three case applications (including one where opioids might be indicated against policy)  
  - Honesty about the method's limits  

  First, I need to anchor this in a foundational principle. Miranda Fricker's work on epistemic injustice fits perfectly—it distinguishes warranted skepticism from identity-based dismissal. The procedure must force nurses to actively separate clinical red flags (like inconsistent histories) from irrelevant factors (like a patient's gender or socioeconomic status).  

  For the structure... it should:  
  1. **Isolate the report from the chart** initially to avoid anchoring bias.  
  2. **Probe the experience** with open-ended questions about impact and description.  
  3. **Assess communicability**—is there a language/hermeneutical gap?  
  4. **Scrutinize inconsistencies** *only after* understanding the patient's perspective.  
  5. **Flag personal reactions** explicitly to disrupt bias.  

  The cases will test this:  
  - **Middle-aged woman with fatigue**: Normal tests ≠ no pathology. Procedure should expose if her functional limitations are being minimized due to "invisible" symptoms.  
  - **Young man with "misleading" history**: Here, the chart flags might trigger distrust. The procedure must force separating past incidents from current presentation.  
  - **Translated symptoms**: Risk of the relative filtering the report. Need to verify understanding directly with the patient where possible.  

  Biggest tension: When the procedure validates pain but clinic policy restricts opioids. I'll use the young man's case—if his acute pain meets criteria but history triggers automatic denial, the procedure should force documenting this conflict.  

  Finally, the limits: No tool can eliminate power dynamics or access barriers beyond the clinic. And sometimes, uncertainty remains—but the procedure at least makes discounting a conscious choice, not a reflex.  

  ...Time to draft. The bottom line must be razor-sharp: "Prioritize interpreting the patient’s account over judging its credibility until inconsistencies are objectively verified."
answer: |-
  **Core rule:** Prioritize interpreting the patient’s account over judging its credibility until inconsistencies are objectively verified against clinical evidence, not identity or communication style.

  **The Procedure: PAIN Framework (Prioritize, Assess, Interpret, Note)**
  *   **Time:** Designed for <5 minutes during intake. Document verbatim responses.
  *   **Referral Triggers:** Immediate referral to clinician if suicidal ideation, neurological red flags, new trauma, or vital sign instability. Otherwise, complete the framework.

  1.  **P: Prioritize the Patient's Description (1 min)**
      *   *Question:* "Tell me about your pain/condition *in your own words*: what does it feel like, and where is it located?"
      *   *Sufficient Answer:* Any concrete description (e.g., "like a hot knife," "deep ache," "all-over heaviness," "tingling in my feet"). Avoid interrupting. If vague, ask: "Can you describe the *sensation* more?" Note *exact* wording.
      *   *Do NOT:* Correct terminology, reference the chart, or judge plausibility.
      *   *Why:* Separates the raw experience from preconceptions. Establishes the patient as the primary source.

  2.  **A: Assess Impact & Function (1 min)**
      *   *Question:* "What specific thing can you *not* do right now because of this that you could usually do? How has it changed your daily life?"
      *   *Sufficient Answer:* Any concrete example of functional limitation (e.g., "can't stand long enough to shower," "can't focus to read," "missed work for 3 days," "need help dressing").
      *   *Do NOT:* Minimize ("Everyone gets tired"), compare ("Others have it worse"), or assume exaggeration.
      *   *Why:* Focuses on observable/disabling consequences, making the subjective experience tangible. Functional impact is a key clinical indicator.

  3.  **I: Interpret Gaps & Inconsistencies (Objectively) (1.5 min)**
      *   *Step I.1 (Internal):* "You described it as [briefly summarize patient's *exact* words from P]. Help me understand – is there anything about how it feels or behaves that makes it hard to describe using common medical terms?"
      *   *Sufficient Answer:* Acknowledgement of a struggle (e.g., "Yes, it's not really 'burning' or 'stabbing,' it's... different") OR affirmation ("No, 'aching' fits"). Note the gap or confirmation.
      *   *Step I.2 (External - Only if chart flag/past inconsistency exists):* "I see a note about [briefly state *specific, documented* fact: e.g., 'a past issue with medication timing,' 'a test result that was normal']." *Pause.* "Can you help me connect that with what you're experiencing today?"
      *   *Sufficient Answer:* Any attempt to explain/reconcile (e.g., "That was a mistake during a chaotic move," "The test was normal but I still feel this," "I was desperate then, but this is different"). Insufficient = defensiveness *without* explanation or flat denial *without* context.
      *   *Do NOT:* Accuse, imply lying, use judgmental tone. Focus on reconciling information.
      *   *Referral Point:* If I.2 reveals *new, credible* evidence of active deception (e.g., admits falsifying current symptoms for drugs), refer immediately with specific documentation. Mere suspicion is insufficient.
      *   *Why:* Distinguishes hermeneutical gaps (I.1) from potential credibility issues (I.2) using objective prompts, not nurse's gut feeling. Forces engagement with the *specific* inconsistency.

  4.  **N: Note Your Reaction & Check Bias (30 sec)**
      *   *Mandatory Internal Step:* Before finalizing notes, ask: "What was my *first* instinct about this patient's report (e.g., 'genuine,' 'exaggerated,' 'drug-seeking,' 'vague,' 'annoying')? Does this instinct align *solely* with the objective evidence gathered in P, A, and I, or could it be influenced by how they look/speak/behave or their chart flags?"
      *   *Action:* If instinct conflicts with objective findings (e.g., functional impact is severe but instinct is "exaggerating"), document BOTH the instinct and the conflict: "Initial impression: may be exaggerating. However, patient reports inability to work or perform ADLs, which is documented functional impairment." Flag for clinician review if instinct strongly conflicts.
      *   *Why:* Forces metacognition, exposing implicit bias. Documents the reasoning process, protecting the patient.

  **Procedure Output:** A structured note with verbatim patient descriptions (P), reported functional impacts (A), interpreted gaps/inconsistencies (I), and the nurse's noted reaction/bias check (N). This forms the basis for the clinician handoff.

  **Case Applications:**

  1.  **Middle-aged woman, 3 years normal tests, incapacitating fatigue:**
      *   **P:** "It's like thick mud filling my whole body. My bones feel heavy. Not sleepy, just... drained of all fuel." (Note exact metaphor).
      *   **A:** "I had to quit my job 6 months ago. I can only cook simple meals 2 days a week. My husband helps me shower most days." (Clear, severe functional impact).
      *   **I.1:** "You said 'thick mud' and 'heavy bones.' Is that hard to describe medically?" Patient: "Yes! It's not 'weakness' or 'tiredness' like they always say. It's deeper." (Hermeneutical gap confirmed).
      *   **I.2:** (No specific chart flag re: credibility, normal tests are background, not an inconsistency needing reconciliation here). Not triggered.
      *   **N:** Nurse's instinct: "Frustrating, vague, maybe psychosomatic?" Check: "Instinct conflicts with severe functional impact reported (unable to work, needs ADL help). Impact is objective. Flag for clinician: consider fatigue-specific scales, neuro/endocrine review despite past normals?" *Procedure Outcome:* Validates report despite normal tests and vague description via functional impact and identified gap. Forces clinician review beyond "normal workup."

  2.  **Young man, two documented incidents of "misleading staff," now reporting acute back pain:**
      *   **P:** "Feels like my lower back is being crushed in a vise, sharp and deep, 9/10. Started suddenly last night." (Specific description).
      *   **A:** "Can't stand up straight. Couldn't drive here, my friend drove me. Haven't slept." (Acute functional impact).
      *   **I.1:** "You said 'crushed in a vise.' Does that fit medically?" Patient: "Yeah, it's crushing and sharp." (No significant gap).
      *   **I.2:** "I see notes about two past incidents where staff felt information was misleading [specify if possible, e.g., 'about medication use']. Can you help me connect that with your pain today?" Patient: "Look, I messed up before when I was desperate and using. I've been clean 8 months in the program. This pain is real and new. I'm scared." (Acknowledges past, provides context, distinguishes current event).
      *   **N:** Nurse's instinct: "Drug-seeking, manipulative." Check: "Strong instinct based on chart flags. However, patient provided context for past incidents, described acute onset, shows acute distress and functional impairment (unable to stand/sleep). Objective findings (distress, function) align with report. Instinct likely biased by history." *Procedure Outcome:* Validates *current* report despite past flags. Pain description and acute impact warrant assessment. **This forces a clinical assessment for acute pain management, which may include opioids if indicated – potentially conflicting with a restrictive clinic policy.** The procedure requires taking the report seriously; policy application comes later.

  3.  **Patient (via translating relative):**
      *   **P:** Relative: "She says it's fire ants crawling under her skin, everywhere, but worse in her legs." Nurse: "[To patient] Can you show me where?" Patient points vigorously to legs and arms. Nurse documents relative's words & patient's gestures.
      *   **A:** Relative: "She can't walk far, stays in bed mostly. Cries out at night." Nurse: "[To patient] Is it hard to sleep?" Patient nods emphatically, grimaces. (Functional impact confirmed through relative and patient non-verbal).
      *   **I.1:** "You described it as 'fire ants crawling.' [To patient] Is it hard to find words for this feeling?" Patient looks distressed, shakes head, gestures emphatically. Relative: "She says it's exactly like that, but doctors never understand." (Gap confirmed).
      *   **I.2:** (Assume no specific credibility flags). Not triggered.
      *   **N:** Nurse's instinct: "Hard to assess, reliant on relative, maybe unreliable?" Check: "Instinct based on communication barrier. Patient provided consistent non-verbal confirmation (pointing, nodding, grimacing) of location, severity, and impact reported by relative. Functional impact (bedbound, sleep disturbance) is significant." *Procedure Outcome:* Validates report through combined verbal (relative) and non-verbal (patient) evidence. Highlights communication gap. Requires clinician assessment for neuropathic pain management.

  **What the Procedure Cannot Settle:**
  *   **The Ultimate Cause of Pain:** It cannot diagnose or rule out physiological vs. psychological etiologies.
  *   **Opioid Appropriateness:** It validates the *report* warranting assessment, but cannot determine if opioids are the *correct treatment* – that requires full clinical evaluation, risk assessment, and adherence to policy *after* the report is taken seriously.
  *   **Resolving "Uncanny" Descriptions:** It identifies hermeneutical gaps but doesn't provide the missing shared vocabulary.
  *   **Eliminating All Bias:** It forces awareness and documentation of bias, but cannot erase deeply held implicit associations; it mitigates their *unchecked influence* on the intake.
