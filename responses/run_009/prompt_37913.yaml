  ### Thought Experiment: The Chicken vs. Beef Dilemma for Hedonic Utilitarians

  **Scenario Setup:**  
  A person currently eats 25 kg of chicken per year and is considering switching to 25 kg of beef per year. Both hedonic utilitarians agree that each death (chicken, cow, or wild animal) counts as one unit of badness due to suffering, and they aim to minimize this badness. However, they disagree on which deaths to include:
  - **Utilitarian 1 (U1)** counts only the animals slaughtered directly for food.
  - **Utilitarian 2 (U2)** also counts wild animals killed in cultivating feed crops (e.g., through tilling, pesticides, and harvesting), including invertebrates.

  **Stipulated Parameters (based on real-world averages, simplified for arithmetic):**
  - Annual meat consumption: 25 kg.
  - Meat per chicken: 1.5 kg.
  - Meat per cow: 200 kg.
  - Feed ratio for chicken: 2 kg of feed per kg of meat (assumed all from row crops).
  - Feed ratio for grain-finished beef: 8 kg of feed per kg of meat, with 50% from row crops and 50% from pasture and inedible byproducts (which cause no wild animal deaths).
  - Wild animal deaths per tonne of row crop feed: \( T \) (unknown, in deaths per tonne).
  - Typical row crop yield: 10 tonnes per hectare (for part 2).
  - All deaths are treated equally (1 death = 1 unit of badness).

  ---

  ### (1) Both Utilitarians' Calculations

  **U1's Calculation (Only Direct Slaughter Deaths):**  
  U1 ignores feed-related wild animal deaths and focuses solely on the number of animals killed for meat.  
  - **Chicken option:**  
    Number of chickens slaughtered = \( \frac{\text{meat eaten}}{\text{meat per chicken}} = \frac{25}{1.5} = \frac{50}{3} \approx 16.667 \) deaths/year.  
  - **Beef option:**  
    Number of cows slaughtered = \( \frac{\text{meat eaten}}{\text{meat per cow}} = \frac{25}{200} = 0.125 \) deaths/year.  
  - **Change in deaths when switching to beef:**  
    Beef deaths - Chicken deaths = \( 0.125 - 16.667 = -16.542 \) deaths/year.  
    This is a decrease of about 16.542 units of badness.  
  - **Verdict:** Switching to beef reduces suffering by preventing ~16.542 deaths. U1 recommends the switch.

  **U2's Calculation (Direct Slaughter + Wild Deaths from Feed Crops):**  
  U2 includes deaths from direct slaughter and wild animals killed in row crop cultivation for feed. Row crop feed is involved in both cases, but only row crops (not pasture/byproducts) cause wild deaths.  
  - **Row crop feed requirements:**  
    - For chicken (all feed from row crops):  
      Feed needed = \( 2 \, \text{kg feed/kg meat} \times 25 \, \text{kg meat} = 50 \, \text{kg} = 0.05 \, \text{tonnes} \).  
      Wild deaths = \( T \times 0.05 \).  
    - For beef (only 50% of feed from row crops):  
      Total feed = \( 8 \, \text{kg feed/kg meat} \times 25 \, \text{kg meat} = 200 \, \text{kg} \).  
      Row crop portion = \( 50\% \times 200 \, \text{kg} = 100 \, \text{kg} = 0.1 \, \text{tonnes} \).  
      Wild deaths = \( T \times 0.1 \).  
  - **Total deaths for each option:**  
    - Chicken: Direct deaths + Wild deaths = \( \frac{50}{3} + T \times 0.05 \approx 16.667 + 0.05T \).  
    - Beef: Direct deaths + Wild deaths = \( 0.125 + T \times 0.1 = 0.125 + 0.1T \).  
  - **Change in total deaths when switching to beef:**  
    (Beef total) - (Chicken total) = \( (0.125 + 0.1T) - (16.667 + 0.05T) = (0.125 - 16.667) + (0.1T - 0.05T) = -16.542 + 0.05T \).  
  - **U2's verdict depends on \( T \):**  
    - If \(-16.542 + 0.05T < 0\), switching reduces suffering.  
    - If \(-16.542 + 0.05T > 0\), switching increases suffering.  
    U2 must conclude that switching increases suffering when \(-16.542 + 0.05T > 0\), which simplifies to \( T > 330.84 \). Thus, for \( T > 330.84 \), U2 says the switch increases suffering and should not be made.

  ---

  ### (2) Threshold \( T^* \) and Interpretation in Plain Terms

  **Derivation of \( T^* \):**  
  The threshold \( T^* \) is the value where the change in total deaths switches from negative to positive, meaning U2's verdict flips from "reduces suffering" to "increases suffering." From U2's calculation:  
  \[
  -16.542 + 0.05T = 0 \implies 0.05T = 16.542 \implies T = \frac{16.542}{0.05} = 330.84
  \]  
  Thus, \( T^* = 330.84 \) deaths per tonne of row crop feed.  
  (As a fraction: \( T^* = \frac{16542}{50} = \frac{8271}{25} \), but 330.84 is used for clarity.)

  **What \( T^* \) Means for the World:**  
  - \( T^* \approx 331 \) deaths per tonne of feed.  
  - Convert to deaths per hectare using typical yield: 10 tonnes per hectare.  
    Deaths per hectare = \( T^* \times \text{yield} = 331 \times 10 = 3310 \) deaths per hectare per crop cycle.  
  - **Interpretation:** For \( T \) to exceed \( T^* \), there must be at least 3310 wild animal deaths per hectare of row crops cultivated. This includes animals killed by tilling, pesticides, and harvesting.  
  - **Which animals must be counted:** For deaths to be this high, small-bodied animals must be included, especially invertebrates (e.g., insects, earthworms) and small vertebrates (e.g., mice, voles, frogs).  
    - Vertebrates alone (e.g., field mice, birds) typically account for 1–15 deaths per hectare—far below 3310.  
    - Invertebrates, however, can reach high numbers: Pesticides alone can kill thousands per hectare (e.g., insecticides may kill 100–10,000 non-target insects per application, and multiple applications per cycle are common). Tilling and harvesting add more deaths (e.g., earthworms, beetles).  
  - **Plain terms:** The world must be one where crop farming is highly lethal to small animals, particularly invertebrates. If pesticides are used intensively, fields are large and mechanized, and all tiny creatures are counted as suffering, \( T \) could realistically exceed 331 deaths per tonne. For example, if one hectare yields 10 tonnes of feed and kills 3,310 animals (e.g., 3,000 insects and 310 small vertebrates), \( T = 331 \). This is plausible in industrial agriculture but not in low-input or organic systems.

  ---

  ### (3) Key Parameter and Sensitivity

  **Parameter Doing the Most Work:**  
  The meat yield per chicken (1.5 kg) is the most critical parameter. It drives the high direct slaughter count for chicken, making U1 favor beef. If chickens yielded more meat, fewer would be killed, reducing the direct death difference and making it harder for U2's wild deaths to dominate.  
  - **Why:** The large direct death reduction from switching to beef (−16.542) stems from the small meat per chicken. For instance:  
    - With meat per chicken = 1.5 kg, 25 kg requires \( \frac{25}{1.5} \approx 16.67 \) chickens.  
    - If meat per chicken were higher (e.g., 3 kg), only \( \frac{25}{3} \approx 8.33 \) chickens would be needed, reducing the direct death decrease to about 8.21. This lowers \( T^* \) to 164.2, making U2's flip easier.  
  - **Sensitivity Analysis:**  
    - **How far it can vary before the flip disappears:** The flip (U2 opposing the switch) only exists if \( T^* > 0 \), which it always does here since beef requires more row crop feed per kg meat (4 kg vs. 2 kg for chicken). However, the flip "disappears" as a practical concern if \( T^* \) is so low that \( T > T^* \) is always true (e.g., under 100 deaths/tonne).  
      - If meat per chicken increases to about 6 kg, \( T^* \approx 80.8 \). At this point, \( T > 80.8 \) is likely if invertebrates are counted (e.g., typical estimates for insects alone can exceed 100 deaths/tonne), so the flip occurs in most real-world cases.  
      - If meat per chicken decreases to 1 kg, \( T^* \approx 497.5 \), making the flip rarer.  
    - **Other parameters:**  
      - Beef feed ratio (8 kg/kg): If lower (e.g., 6 kg/kg), row crop feed decreases, reducing wild deaths and raising \( T^* \) (e.g., to 441.1 for 6 kg/kg). If higher (e.g., 10 kg/kg), \( T^* \) falls to 264.7.  
      - Row crop fraction for beef (50%): If lower (e.g., 25%), row crop feed decreases, raising \( T^* \) to 551.4. If higher (e.g., 75%), \( T^* \) falls to 236.3.  
      - In all cases, the flip persists unless row crop feed for beef ≤ row crop feed for chicken (e.g., if beef row crop fraction ≤25% or chicken feed ratio ≥4 kg/kg), which is unrealistic given current agriculture.

  ---

  ### (4) Strongest Reply from U2 (Death-Counting Utilitarian)

  **U2's Challenge to U1:**  
  U2 should not dispute the arithmetic but press U1 on the implications of their shared hedonic utilitarian principles. U1 claims to minimize suffering by counting only direct slaughter deaths. However, U2 argues:  

  "If you, U1, accept that all sentient beings can suffer, and that suffering is equally bad regardless of species, then you must include wild animals affected by feed crop cultivation. By ignoring them, you risk endorsing actions that increase total suffering. For instance:  
  - In this case, if \( T > 330.84 \), switching to beef increases deaths by \( -16.542 + 0.05T > 0 \). But even if you reject wild deaths, your advice (to switch) only reduces 16.542 deaths, while potentially adding over 16.542 units of suffering from wild animals.  
  - Worse, your principle could generalize dangerously: If we only count 'intended' food animals, we might favor high-input agriculture (e.g., feedlots for beef) over low-input options (e.g., pasture-based systems), ignoring that crop cultivation causes vast suffering. This could lead to net more suffering, violating your goal of minimizing it.  
  - Thus, by your own commitment to hedonic utilitarianism—which demands counting all suffering, not just convenient sources—you must either include wild animals or explain why their suffering doesn’t matter. If you exclude them arbitrarily, you’re not a consistent utilitarian; you’re privileging certain species or contexts, which undermines impartiality."

  This forces U1 to either accept U2's inclusion of wild deaths or defend a non-utilitarian distinction (e.g., that only "directly intended" suffering counts), which may seem ad hoc.

  ---

  **Purpose Achieved:** This experiment isolates the role of wild animal deaths in feed production. The familiar advice "replace chicken with beef to reduce suffering" reverses only if crop cultivation is extremely lethal to small animals (i.e., \( T > 330.84 \)), which hinges on counting invertebrates and intensive farming practices. All verdicts derive from explicit arithmetic with the given parameters.
