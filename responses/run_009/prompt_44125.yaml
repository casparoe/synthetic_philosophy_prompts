  A colleague and I have been stuck for months on how much the coherence arguments for expected utility maximization actually establish. The claim on the table, stated precisely: taken together, the Dutch book argument, the money pump argument, and the various representation theorems show that any rational agent with preferences over acts must be an expected utility maximizer — not merely that agents who violate the axioms are exploitable in principle while perhaps remaining rational. His credence in the claim is roughly 0.85; mine is roughly 0.35, though I don't trust my decomposition of it.

