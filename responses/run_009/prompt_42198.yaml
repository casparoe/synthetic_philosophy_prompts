prompt: |-
  I'm a journalist who covers science and medicine for a general readership, and the story I keep circling back to is the line our institutions draw between treating illness and improving the healthy. Consider the collection of rules and reimbursements that governs this. In elite sport, the anti-doping code bans a substance when it enhances performance, yet the same system grants therapeutic use exemptions: an athlete with diagnosed asthma may use a bronchodilator that would earn anyone else a suspension, on the ground that it merely restores what illness took away. But an athlete born with unusually low haemoglobin may not take EPO to lift himself to the field average, while a rival born with an unusually high haematocrit competes with it unimpeded — nobody proposes levelling him down. On the civilian side, health services generally fund growth hormone for a child with a certified deficiency but baulk at funding it for a short child with no diagnosable condition; they will pay for a cochlear implant but not for a drug that sharpens memory in a typical student; and antidepressants are prescribed for clinical depression while being increasingly sought, off-label, by people who are sad but functioning and want to be better than fine. What theory of health, and of the therapy/enhancement distinction, does this pattern presuppose? Does it presuppose that there is a fact of the matter about normal species functioning which treatment restores, and if so, is the relevant baseline statistical, evolutionary, or relative to the individual's own constitution? Could the practice be justified without any such baseline — say, by appeal to fairness between competitors in sport and to scarcity of resources in healthcare — and if so, do those two justifications track the same distinction, or merely coincidentally overlapping ones? I'd also like to know where the practice is philosophically underdetermined: which rival theories of the good would license it just as well, and what would actually have to change if a system dropped the therapy/enhancement line altogether and simply asked whether an intervention made a life go better. Please keep your answer to no more than 700 words.
reasoning: |-
  Okay, the user is a science journalist exploring the therapy/enhancement distinction in medicine and sports. They've presented several thought-provoking examples: TUEs in sports allowing asthma medication but banning EPO for naturally low hemoglobin, healthcare covering growth hormone only for deficiencies but not for short stature without diagnosis, cochlear implants being funded but not memory-enhancing drugs for students, and antidepressants used off-label by functional individuals. 

  Hmm, their core question seems to be about the philosophical underpinnings of these institutional boundaries. They're really asking two layered questions: First, what theory of health justifies treating illness but not enhancing the healthy? Second, can alternative justifications (like fairness in sports or resource scarcity in healthcare) explain the patterns without relying on that theory?

  The examples reveal fascinating tensions. That elite sports example is particularly illuminating - the system accepts natural biological variation (like high hematocrit) while prohibiting artificial correction of "natural disadvantages" (low hemoglobin). This suggests institutions implicitly view the "normal" state as a sacred baseline, whether statistical or functional. 

  For healthcare, the rationing argument feels practical but incomplete. Why fund cochlear implants (restoring function) but not cognitive enhancers (improving beyond average)? That implies an underlying normative commitment to species-typical functioning as the benchmark. The journalist seems to suspect the "fairness" and "scarcity" justifications might be post-hoc rationalizations rather than foundational principles.

  The philosophical underdetermination angle is sharp. A utilitarian approach focused purely on well-being would likely blur these lines - if a safe cognitive enhancer improves a student's quality of life, why prohibit it? But institutions resist this, revealing their non-utilitarian foundations. If we dropped the therapy/enhancement distinction entirely, we'd need radical systems: sports might allow all safe enhancements while healthcare would face impossible demands for optimization. 

  What they might not have articulated but seems implied: Is this distinction ethically coherent, or just a messy compromise? The answer seems to be the latter - it's a pragmatic, context-dependent boundary that serves different purposes in different domains. The journalist's frustration with the inconsistencies (like TUEs creating medicalized loopholes) suggests they sense this tension.
answer: |-
  Your examples reveal a deep tension in how societies operationalize "health," resting on a **normative functional baseline** theory combined with **context-dependent practical justifications**. Here's the breakdown:

  1.  **The Presupposed Theory: "Normal Species Functioning" as Baseline**
      *   **Core Idea:** Institutions implicitly rely on a concept of "normal species functioning" (often traceable to philosophers like Boorse). Health is the absence of pathology that *impairs* statistically typical function for a human of that age/sex.
      *   **Nature of the Baseline:** It's primarily **statistical/functional**, with evolutionary biology as a background influence (e.g., pain signifies injury needing repair). Crucially, it's **not relative to the individual's innate potential.** The asthmatic's airway restriction is a *deviation* from the norm, while the athlete's naturally low Hb is an *innate variation* within the normal range. Treatment corrects the deviation; enhancement alters the innate variation.
      *   **Implications:** Medicine aims to *restore* individuals to the functional range typical for humans, not to *optimize* beyond it. The "healthy" are seen as already possessing the functional baseline, making interventions for them "enhancements."

  2.  **Alternative/Pragmatic Justifications:**
      *   **Fairness (Sport):** Anti-doping rules primarily aim to preserve a "level playing field" and the "spirit of sport" (human effort, natural talent). TUEs are a concession, allowing essential *restorative* treatment without conferring an *advantage* over the healthy baseline. Banning EPO for naturally low Hb prevents artificial advantage; allowing naturally high Hb is deemed "natural luck." Fairness here hinges on prohibiting artificial *enhancement*, not equalizing outcomes.
      *   **Scarcity & Medical Necessity (Healthcare):** Systems prioritize interventions deemed *medically necessary* – addressing disease, impairment, or significant suffering caused by deviation from normal function. Funding GH for deficiency corrects a pathology; funding it for idiopathic short stature is seen as enhancement, falling outside core medical goals. Cochlear implants address pathology (deafness); memory drugs for students enhance beyond typical function. Antidepressants for clinical depression treat pathology; off-label use for sub-clinical sadness is enhancement. Scarcity forces prioritization based on severity/necessity.

  3.  **Do These Justifications Track the Same Distinction?**
      *   **Partial Overlap, Different Emphasis:** Both sport and healthcare ultimately rely on the *therapy/enhancement* distinction rooted in the normative baseline. However:
          *   **Sport** emphasizes **fairness and prohibition of artificial advantage.** The baseline defines what constitutes an artificial boost vs. natural variation or restorative treatment.
          *   **Healthcare** emphasizes **medical necessity and resource allocation.** The baseline defines what constitutes a pathological state warranting treatment vs. a desire for optimization falling outside funded care.
      *   **Coincidental Alignment?** The alignment isn't *pure* coincidence; the shared baseline concept makes the distinction intuitive in both contexts. However, the *reasons* for applying it differ: fairness vs. rationing.

  4.  **Philosophical Underdetermination & Alternatives:**
      *   **Underdetermination:** The *current practice* is compatible with several theories:
          *   **Sufficientarianism:** Ensuring individuals reach a "sufficient" level of functioning (the normal baseline) is the goal, not maximizing potential.
          *   **Resource Egalitarianism (Healthcare):** Focusing scarce resources on the worst off (the ill/disabled) aligns with funding therapy over enhancement.
          *   **Preservation of Sport's Meaning (Elitism?):** Sport's rules rely on a specific (contestable) conception of "natural" athletic achievement.
      *   **Dropping the Distinction - The "Well-Being" Approach:** Abandoning therapy/enhancement for a purely "does it make life go better?" criterion would radically alter both spheres:
          *   **Sport:** Could lead to "transhuman" competitions where *all* safe performance enhancements are permitted, fundamentally changing the nature of athletic achievement and potentially undermining concepts of fairness based on natural talent/training. Regulatory focus might shift solely to safety.
          *   **Healthcare:** Would obliterate prioritization based on pathology. Systems would face immense pressure to fund *any* intervention promising improved well-being, cognition, appearance, or mood, regardless of baseline function (e.g., funding memory drugs for all students, GH for all short children, mood brighteners for the merely sad). This would be financially unsustainable without massive rationing elsewhere or societal agreement on *degrees* of well-being improvement warranting funding – a hugely contentious task. Defining "better" becomes paramount and philosophically fraught.

  **In essence:** Our institutions primarily rest on a **normative baseline of statistical/functional normalcy** to distinguish therapy (restoration) from enhancement (optimization). While **fairness in sport** and **scarcity in healthcare** provide powerful *contextual justifications* for enforcing this distinction, they ultimately depend on it. The system is philosophically underdetermined only in the sense that this baseline *can* be justified by different underlying theories of justice or value. Abandoning it entirely for pure well-being optimization would force revolutionary changes, prioritizing maximal flourishing over restoration of normal function, with profound practical and ethical consequences in both sports and medicine.
