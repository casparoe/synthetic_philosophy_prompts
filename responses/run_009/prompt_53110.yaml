answer: |-
  Here's a breakdown of epistemicism and supervaluationism translated into your computational geometry vocabulary, followed by a residue report addressing your core questions:

  **The Positions Restated:**

  1.  **Epistemicism (In Tolerance Terms):**
      *   **Core Claim:** For any specific geometric predicate (e.g., `pointIsInside(poly, point)`), there exists a *single, precise, context-independent tolerance value `ε_true`*. This `ε_true` perfectly defines the sharp boundary between `true` and `false` results for that predicate under ideal mathematical evaluation.
      *   **Our Limitation:** We, as finite computational agents dealing with floating-point approximations (`fp_approx`), noisy inputs (`input_noise`), and finite resources, are fundamentally *unable to know the exact value of `ε_true`*. It is epistemically inaccessible.
      *   **Implementation Reality:** When we choose a tolerance `ε_chosen` (e.g., `abs(det) > ε_chosen` for a collinearity test), we are making our *best guess* at approximating `ε_true`. Our `ε_chosen` is a *practical stand-in* for the unknowable ideal. The fact that different contexts might require different `ε_chosen` values doesn't mean `ε_true` changes; it means our *access* to it is imperfect and context-dependent.
      *   **Analogy:** Legislating `ε_chosen` is an *acknowledgement of our ignorance* about `ε_true`, not the creation of a new boundary. The boundary (`ε_true`) was always there mathematically; we're just trying to legislate a usable proxy for it.

  2.  **Supervaluationism (In Tolerance/Implementation Terms):**
      *   **Core Claim:** There is no single, precise `ε_true`. Instead, there is a range of *admissible tolerance values* (`ε_admissible_min` to `ε_admissible_max`) defining a *borderline region*. Within this region, the predicate is genuinely indeterminate.
      *   **Borderline Cases:** For a computation `fp_approx` falling within `[ε_admissible_min, ε_admissible_max]`, the predicate is neither definitively `true` nor `false`. Any specific `ε_chosen` within the admissible range *settles* the predicate for that choice (`super_true` or `super_false`), but no single choice is uniquely "correct".
      *   **Truth of Disjunctions:** The statement "The point is inside OR the point is not inside" is always `true` (a *supertruth*), even if, for a specific borderline case evaluated with a specific `ε_chosen`, we cannot say *which* disjunct is true (or if we use a three-valued return, both disjuncts might be `false`/`unknown` for that *specific* evaluation). This is because *every* admissible `ε_chosen` makes one disjunct `true` and the other `false`.
      *   **Implementation Analogy:** Returning a `DON'T_KNOW` (or `UNKNOWN`, `BORDERLINE`) value for `fp_approx` within `[ε_admissible_min, ε_admissible_max]` directly mirrors the supervaluationist's indeterminacy. Each specific `ε_chosen` used in practice acts as one "admissible precisification". The set of all possible admissible `ε_chosen` values defines the borderline region.

  **Residue Report: Mapping, Distortion, and Absence**

  1.  **What Maps Directly:**
      *   **The Need for Tolerance (`ε`):** Both positions acknowledge the core problem: a mathematically sharp boundary (epistemicism's `ε_true`) or the need to avoid one (supervaluationism's borderline region) is central to handling real-world computational imprecision and vagueness.
      *   **The Borderline Region Phenomenon:** The practical experience of inputs where the result is highly sensitive to the specific `ε_chosen` maps directly to the supervaluationist's borderline cases and the epistemicist's region near `ε_true` where our knowledge fails. You observe this daily.
      *   **`DON'T_KNOW` Returns ≈ Supervaluationist Indeterminacy:** Explicitly returning a third value (`UNKNOWN`, `BORDERLINE`) for cases within a defined tolerance band (`[ε_min, ε_max]`) is a remarkably clean computational analogue of the supervaluationist truth-value gap. The core idea – "this input is too close to call definitively `true` or `false` with our current precision/context" – aligns perfectly.
      *   **Multiple Admissible Precisifications:** Your awareness that different applications/scales might validly use different `ε_chosen` values maps well to the supervaluationist's core idea of multiple "admissible ways of making precise". The existence of a *range* of reasonable tolerances is recognized.

  2.  **What Maps with Distortion:**
      *   **Choosing `ε_chosen` vs. Legislating/Discovering:**
          *   **Epistemicism Distortion:** Epistemicism claims `ε_true` *exists* independently and is unknowable. In practice, you *define* `ε_chosen` based on system epsilon, expected noise levels, application requirements, and empirical testing. This feels much more like *legislation* than *discovery*. While you aim for robustness informed by mathematical reality, the chosen `ε_chosen` is fundamentally a *practical decision*, not an attempt to approximate a metaphysical `ε_true`. The distortion lies in the *metaphysical status* epistemicism assigns to the boundary.
          *   **Supervaluationism Distortion:** While `DON'T_KNOW` maps well, defining the *range* `[ε_min, ε_max]` for borderline cases is often just as practical and context-dependent as choosing a single `ε_chosen`. The philosophical notion of "admissible precisification" is broader and more abstract than your specific tolerance bands or hysteresis thresholds, which are grounded in numerical analysis and application needs.
      *   **Hysteresis vs. Supervaluationism:** Hysteresis (using history to avoid thrashing near a boundary) is a *temporal stability mechanism*. Supervaluationism is about *simultaneous truth-value status*. While both deal with the instability near boundaries, their mechanisms are different. Hysteresis doesn't inherently create a truth-value gap; it just delays or prevents the flip based on prior state. It ensures stability *over time* for a single, chosen boundary, whereas supervaluationism introduces a simultaneous gap *at* the boundary.

  3.  **What Lacks a Counterpart & Why:**
      *   **The Metaphysical Stakes:** The core philosophical debate – *Does a perfectly sharp boundary **really exist** even if unknowable (Epistemicism)?* vs. *Is vagueness an inherent feature of reality/language requiring truth-value gaps (Supervaluationism)?* – has **no direct counterpart** in your engineering practice. Your concern is *pragmatic robustness*: finding a `ε_chosen`, `[ε_min, ε_max]`, or hysteresis rule that makes your code reliable and efficient for its intended use under noisy conditions. You don't need (and likely can't determine) which metaphysical picture is "true". The debate's metaphysical core doesn't provide actionable engineering guidance beyond validating the *existence* of the problem.
      *   **Higher-Order Vagueness:** Philosophical debates about vagueness in the *boundary* of the borderline region itself ("Is *this* tolerance value admissible?") have **no practical counterpart** in standard geometric robustness. You define `ε_min`/`ε_max` or the hysteresis threshold based on practical numerical considerations (e.g., multiples of machine epsilon, noise estimates). The question of whether *that definition* is vague isn't a computational problem you typically face; it's a specification issue resolved by requirement analysis or convention, not metaphysical inquiry.
      *   **Epistemicism's Radical Unknowability:** The idea that `ε_true` exists but is *fundamentally unknowable in principle* is **irrelevant to practice**. Your `ε_chosen` is knowable and defined by you. Its justification is practical success and numerical soundness, not proximity to an unreachable ideal.

  **The Crucial Hysteresis / `DON'T_KNOW` vs. Supervaluationism Comparison:**

  Your intuition is sharp. The `DON'T_KNOW` return is **genuinely analogous to the supervaluationist picture** in its core feature:

  *   **Indeterminacy:** Both explicitly state: "For this input, with this precision/context, neither `TRUE` nor `FALSE` is definitively the case."
  *   **Disjunction Handling:** This is where it gets interesting and the analogy holds well *conceptually* but might differ in *implementation logic*:
      *   **Supervaluationism:** "P OR NOT P" is **supertrue** because *every* admissible precisification makes one disjunct true. The disjunction remains true even if no precisification makes *both* true.
      *   **Three-Valued Logic (`DON'T_KNOW`):** How you implement `OR` matters:
          *   **Weak Kleene/Kleene Logic:** If `P = UNKNOWN`, then `NOT P = UNKNOWN`. `P OR NOT P = UNKNOWN OR UNKNOWN = UNKNOWN`. This **breaks the analogy**. The disjunction does *not* come out true.
          *   **Strong Kleene/Łukasiewicz Logic:** `P OR NOT P` is often defined to be `TRUE` *even when P is UNKNOWN* (or `TRUE` if either is `TRUE`, `FALSE` only if both are `FALSE`). In this case, `P OR NOT P = TRUE` holds, **perfectly matching the supervaluationist supertruth**.
          *   **Your Implementation Choice:** If your three-valued logic defines `OR` such that `UNKNOWN OR UNKNOWN = TRUE` (or more generally, `X OR NOT X = TRUE` for any `X`, including `UNKNOWN`), then the analogy holds perfectly for the disjunction. If not, it breaks on that specific point. The *conceptual* motivation for `DON'T_KNOW` aligns with supervaluationism; the *logical behavior* of operators determines if the disjunction analogy holds.

  **Hysteresis** is less directly analogous. It avoids instability by adding state, but doesn't introduce a simultaneous truth-value gap. It effectively creates a *temporal* buffer zone, not a logical one. While related to the problem of boundaries, its mechanism is distinct from the supervaluationist's logical indeterminacy. It's more like dynamically adjusting `ε_chosen` based on recent history to prevent oscillation, rather than admitting multiple simultaneous precisifications or a truth-value gap.

  **Conclusion:**

  The core problem of vagueness/borderlines maps directly to your epsilon tolerance challenge. Supervaluationism provides a powerful conceptual framework for understanding the `DON'T_KNOW` return, especially if your three-valued logic enforces `P OR NOT P = TRUE`. Epistemicism captures the intuition driving the *search* for a good `ε_chosen` but distorts the act of *choosing* it into a discovery of a pre-existing metaphysical boundary, which doesn't align with the practical, legislative nature of your decision. The heart of the philosophical debate – the metaphysical status of the boundary – does far less work for you than the practical recognition of the borderline phenomenon and the logical structures (like three-valued returns with appropriate operators) that supervaluationism helps illuminate for handling it explicitly. Hysteresis solves a related problem (temporal instability) but through a different mechanism not directly analogous to the core logical claims of either position. Your vocabulary isn't missing anything crucial *for engineering*; the parts that don't map are precisely the metaphysical disputes that your pragmatic, specification-driven approach rightly sidesteps.
