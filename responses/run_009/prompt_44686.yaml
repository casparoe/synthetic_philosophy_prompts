prompt: |-
  So my friend and I had a marathon arguement last night about moral particularism (it started from whether it's ok to lie to spare someone's feelings and, as these things do, it escalated for three hours). This morning she texted me a summary of what we were actually fighting about, and I want to check it before I concede anything. She wrote:

  "Particularists like Jonathan Dancy hold that there are no general moral truths at all — morality is just too messy to be captured by principles. Their key argument is holism of reasons: reasons always depend on context, so a reason in one case might be a different reason in another. Since there are no principles, the particularist can't explain how anyone learns morality, or how you could ever argue with someone who disagrees — you just have to trust your gut, which is why the view collapses into relativism. And empirical psychology backs this up: situationist experiments show that character is basically an illusion, so moral principles must be too. Honestly Ross's prima facie duties already did all the work particularism wants to do, just more carefully, so the whole debate is kind of over."

  Some of this sounds roughly right to me and some of it feels like the thing she'd *want* to be true so she can win the argument, but I genuinely can't tell which is which. Can you go through it more or less sentence by sentence? What would Dancy actually sign off on, where is she conflating two claims the view keeps apart (I have half a memory that holism is supposed to be this specific technical claim about a reason switching sides on you, not just 'context matters'), and does the relativism conclusion follow from anything a particularist is actually committed to? Also is she right that Ross and the particularists are basically on the same team, or is that the exact fight they picked — like, didn't people try to rescue Ross *from* the particularists with some middle position, and would that count as particularism lite or generalism proper? She's coming over for dinner friday so I'd like to have my ducks in a row.
