      - Must include:
          * Classical Nagel-style intertheoretic deduction has not succeeded in the history of science.
          * Multiple realizability is a real pattern (whatever it ultimately shows).
          * Phase transitions exhibit nonanalytic behavior strictly only in the thermodynamic limit, so "ice melts at 0°C" is about an idealized system.
          * The renormalization group explains why wildly different micro-physics (e.g., fluid near critical point, magnet near Curie point) can share macro-structure.
      - Phrased so both sign, not vacuous, not slanted.

   2. Disagreements (table with 3 columns: Issue, Reductionist Position, Emergentist Position)
      - Must cover at minimum:
          * Whether the thermodynamic limit is a mere mathematical convenience or does constitutive work.
          * Whether higher-level causes are real or pre-empted by their microphysical realizers.
          * Whether "emergent" names an objective feature of systems or our current ignorance.
          * Whether the renormalization group is physics absorbing the special sciences or physics discovering autonomy from the bottom up.
      - Each party must accept the phrasing of their own row.

   3. Cruxes (3-4 subquestions, each with a concrete case/simulation/argument agreed in advance to bear on it, and each party's prediction)
      - Example: what a decisive case of non-multiply-realizable higher-level kinds would show, or a worked microphysical derivation of a specific biological generalization.

   4. Verbal or Substantive: a short closing section identifying which disagreements are substantive and which reduce to verbal differences (with reasons).

   We are to be precise and not soften disagreements.

   Let's build each part.

   Part 1: Agreed Claims (6-9 items)

   1. The history of science reveals no successful, complete intertheoretic reduction in the classical Nagel sense (via bridge laws and deduction) for any special science to fundamental physics.

   2. Multiple realizability is a widespread and real pattern: many higher-level properties (e.g., being a gene, being a currency) are realized by diverse lower-level structures.

   3. Phase transitions, such as the melting of ice, are characterized by nonanalytic behavior (singularities) in thermodynamic properties, but this nonanalyticity strictly occurs only in the thermodynamic limit (as system size approaches infinity). Therefore, statements like "ice melts at 0°C" describe an idealized system.

   4. The renormalization group (RG) provides a framework that explains how systems with very different microscopic details (e.g., a fluid near its critical point and a magnet near its Curie point) can exhibit identical macroscopic behavior and critical exponents.

   5. Higher-level descriptions in the special sciences (e.g., biology, economics, psychology) are practically indispensable for human cognition and scientific practice due to computational and epistemic constraints.

   6. The causal closure of physics (the principle that every physical event has a sufficient physical cause) is a well-supported methodological principle in the physical sciences.

   7. There are cases in which higher-level properties are not straightforwardly deducible from the microphysical state, even in principle, without substantial computational resources and without using higher-level concepts.

   8. The success of the special sciences in making predictions and guiding interventions is not in dispute; both parties agree that these sciences are effective within their domains.

   9. The existence of universality classes, as revealed by RG, demonstrates that microscopic details can be irrelevant for determining certain macroscopic properties.

   Part 2: Disagreements (Table)

   We'll make a table with the required minimum issues and possibly one more.

   | Issue | Reductionist Position | Emergentist Position |
   |-------|------------------------|-----------------------|
   | The thermodynamic limit | The thermodynamic limit is a mathematical convenience that allows for tractable modeling of large systems; it does not reflect a constitutive feature of reality but is an approximation that becomes arbitrarily good for large N. | The thermodynamic limit is constitutive for the emergence of genuine phase transitions and associated nonanalyticities; without it, phase transitions as abrupt, singular changes of state do not occur, indicating that the limit is essential for the ontology of phases. |
   | Higher-level causation | All causal work is done at the microphysical level; any apparent higher-level causation is either reducible to or preempted by microphysical causes. | Higher-level properties can be genuine causes in their own right, with their own causal powers that are not preempted by the microphysical realizer, because they operate at a level of organization that is autonomous and has its own laws. |
   | The term "emergent" | "Emergent" is an epistemic term that describes our current inability to derive or predict certain system behaviors from microphysics, often due to computational limitations or lack of knowledge; it does not denote an objective, ontologically basic feature. | "Emergent" refers to an objective, ontologically novel feature of complex systems that arises from but is not reducible to the microphysical constituents, and which has autonomous causal powers. |
   | The renormalization group (RG) | RG is a powerful tool within physics that absorbs the special sciences by showing how their regularities arise from physical foundations; it demonstrates the reducibility of higher-level patterns. | RG is a method that discovers the autonomy of higher-level structures from the bottom up, revealing that microphysical details become irrelevant and that new, stable patterns emerge that are governed by their own laws. |
   | The status of special science laws | The laws of the special sciences are useful heuristic compressions of complex microphysical facts; they do not represent fundamental features of the world but are instruments for prediction. | The laws of the special sciences represent objective, irreducible features of the world that capture real patterns of organization and causation that are not reducible to microphysical laws. |

