answer: |-
  ### Which Theory of Emotions Do You Actually Hold?  
  *Discover your implicit stance on emotions through these concrete cases. Answer honestly—no prior philosophy knowledge needed!*  

  ---

  #### **Question 1: Fear of Flying**  
  Alex knows flying is statistically safer than driving and believes his flight will be safe. Yet, boarding the plane, his heart races, and he feels intense dread. What’s happening?  
  - **A.** Alex isn’t truly afraid because he doesn’t *judge* himself to be in danger. His reaction is just physical panic.  
  - **B.** Alex *is* afraid because his body reacts as if in danger (racing heart, sweating). That bodily feeling *is* the fear.  
  - **C.** Alex *is* afraid because he *perceives* the flight as threatening, even though he judges it safe.  

  #### **Question 2: Love Without Feeling**  
  After a spinal injury, Sam feels no bodily sensations below the neck. He insists he still loves his children, deeply caring about their lives, but feels no "warmth" or "butterflies." Is this love real?  
  - **A.** No—without bodily feelings (like warmth), there can be no true emotion. Sam is mistaking a thought for love.  
  - **B.** Yes—love is a *judgment* that his children matter immensely. Bodily feelings aren’t essential.  
  - **C.** Yes—love is *perceiving* his children’s value. Sam senses their importance, even without bodily feedback.  

  #### **Question 3: Fear of a Movie Monster**  
  Jamie watches a horror film, terrified by the monster. She knows it’s fictional and she’s safe in her seat. Is her fear real?  
  - **A.** No—fear requires believing you’re truly threatened. Jamie knows there’s no real danger, so it’s not genuine fear.  
  - **B.** Yes—her body jumps and her heart pounds. That physical reaction *is* the fear.  
  - **C.** Yes—she *perceives* the monster as horrifying. The emotion is real, even if the threat isn’t.  

  #### **Question 4: Moved by Sad Music**  
  Taylor listens to a profoundly sad piece of music. She tears up but isn’t thinking of anything personal—just absorbed in the melody. Is this sadness?  
  - **A.** No—sadness requires *judging* that something bad happened (to her or others). This is just a physical response to sound.  
  - **B.** Yes—her tears and heaviness *are* sadness. The music triggered the bodily feeling.  
  - **C.** Yes—she *perceives* the sadness in the music. The emotion is a direct response to that quality.  

  #### **Question 5: Anger at a Computer**  
  Chris’s computer crashes, erasing hours of work. He slams the desk and yells, "You stupid machine!" Is this anger?  
  - **A.** No—anger requires *judging* that someone *deserves blame*. A computer isn’t a moral agent, so this isn’t real anger.  
  - **B.** Yes—his body is tense and agitated. That physical reaction *is* the anger.  
  - **C.** Yes—he *perceives* the computer as thwarting his goals. The emotion is real, even if misdirected.  

  #### **Question 6: Drug-Induced "Happiness"**  
  Jordan takes a drug causing bodily feelings of happiness (warmth, smiling) and seeing the world as "wonderful." But he knows it’s the drug—nothing good happened. Is he happy?  
  - **A.** Yes—he *perceives* everything as positive. That perception *is* happiness.  
  - **B.** Yes—the bodily feelings (warmth, smiling) *are* happiness. The cause doesn’t matter.  
  - **C.** No—happiness requires *judging* that something good occurred. This is just chemistry.  

  #### **Question 7: Disgust at Art**  
  Riley sees a lump that looks like vomit and feels disgust. She learns it’s actually art (wax and dye) but still feels revolted when viewing it. Is her disgust real?  
  - **A.** Yes—she *perceives* the object as disgusting. The emotion persists despite her knowledge.  
  - **B.** Yes—her nausea and recoiling *are* disgust. Her body reacts automatically.  
  - **C.** No—disgust requires *judging* something as truly vile. She knows it’s not vomit, so it’s irrational but not true disgust.  

  #### **Question 8: Lingering Fear**  
  Morgan lives in a dangerous neighborhood. Indoors, safe and locked in, Morgan still feels constant fear, saying, "I know I’m safe here, but I can’t relax." Is this fear rational?  
  - **A.** It’s not fear—without a *judgment* of immediate danger, the emotion isn’t genuine. It’s just anxiety.  
  - **B.** It *is* fear—Morgan’s body is in a heightened state of arousal due to the environment.  
  - **C.** It *is* fear—Morgan *perceives* the broader environment as threatening, and that perception spills into the "safe" space.  

  ---

  ### Scoring Key  
  Tally your answers (A, B, or C for each question). Then, find your dominant theory below. **Be honest—don’t overthink!**  

  - **Mostly A → Judgment Theory (JT):**  
    You treat emotions as *evaluative judgments* (e.g., fear = judging something dangerous). If your answers skewed A, you prioritize cognition—emotions require rational assessments of the world. Bodily feelings or perceptions alone aren’t enough. Philosophers like Solomon and Nussbaum champion this view.  
    *Why definite?* JT insists emotions collapse without a supporting judgment (e.g., Q1, Q3, Q4). If you consistently denied emotions in "irrational" cases, you’re in this camp.  

  - **Mostly B → Feeling Theory (FT):**  
    You see emotions as *bodily changes or feelings* (e.g., fear = a racing heart). If B dominated, you root emotions in physical sensations. Context and judgments matter less than the raw feeling. This aligns with William James’ classic view.  
    *Why definite?* FT alone treats bodily reactions as sufficient for emotion (e.g., Q2, Q5, Q6). If you prioritized bodily feedback even when judgments/perceptions conflicted, you’re FT.  

  - **Mostly C → Perceptual Theory (PT):**  
    You view emotions as *perceptions of value* (e.g., fear = perceiving a threat). If C led, you see emotions as instinctive "readings" of the world, like seeing a bent stick. They can be rational (based on real properties) or irrational (misperceptions).  
    *Why definite?* PT uniquely allows emotions without judgments (e.g., Q1, Q3) or bodily feelings (e.g., Q2). If you accepted emotions in "irrational" cases via perception, you’re PT.  

  - **Tie? → Hybrid or Definite Placement:**  
    - **JT/PT tie (equal A/C):** → **Judgment-Perceptual Hybrid**.  
      *Reasoning:* You blend cognition and perception. Emotions involve assessments (JT) but also intuitive "seeing" (PT). We commit to "Hybrid" because both are cognitive—but since JT demands stricter rationality (e.g., Q1, Q3), a tie suggests you’re not fully in either camp.  
    - **JT/FT tie (equal A/B):** → **Feeling Theory (FT)**.  
      *Reasoning:* FT wins because JT and FT conflict sharply (emotions can’t be both judgments and raw feelings). We prioritize FT since bodily reactions are less disputable (e.g., Q2, Q6), and JT struggles with "irrational" cases (Q1).  
    - **PT/FT tie (equal B/C):** → **Perceptual Theory (PT)**.  
      *Reasoning:* PT wins because it explains bodily feelings *and* irrational cases (e.g., Q7). FT reduces emotions to sensations alone, but PT accounts for why those sensations feel "about" something (e.g., fear of fiction in Q3).  
    - **Three-way tie?** → **Feeling-Perceptual Hybrid**.  
      *Reasoning:* You mix bodily feedback (FT) and value perception (PT). JT’s strict rationality is least present.  

  ---

  ### Honest Limitations  
  This quiz **cannot cleanly separate Judgment (JT) and Perceptual (PT) theories** in two key cases:  
  1. **Anger at a computer (Q5):** Both could deny "real" anger—JT if blame is missing, PT if no "thwarting" is perceived. We forced a split (A=JT, C=PT), but real-world views may overlap.  
  2. **Drug-induced happiness (Q6):** PT (A) and JT (C) both require an object (perceived value/judged good), but PT allows perception without belief. The line is fuzzy.  

  We committed to placements in scoring, but these theories share ground. For precision, revisit your Q5/Q6 answers—if you chose A for both, lean JT; if C for both, lean PT.  

