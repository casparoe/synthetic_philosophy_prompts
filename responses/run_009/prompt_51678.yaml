  , **half**,  
  **third**—all dance round the **circle**  
  ’s rim. Which **random**  
  holds sway? None. All. The **circle**  

  stares back, indifferent. **Circle**  
  of questions, no true **random**  
  , no innate **chord**.  
  **Third**,  
  **half**,  
  **quarter**—  

