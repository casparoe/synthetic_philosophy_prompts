  First I need to design realistic scenarios meeting strict criteria. The core difference must be the offender's cognitive capacity post-offense, with all other factors identical. The offense should be serious but unrepeatable - perhaps a financial crime exploiting a regulatory gap that's now closed. For forward-looking considerations, I'll make deterrence negligible by having the case obscure and the loophole already fixed. Incapacitation is irrelevant since the offender no longer works in finance.

  For case A: a competent defendant in white-collar crime trial. Case B: same defendant but now with advanced dementia in a nursing home. Both cases must have ironclad evidence and no complicating factors like remorse. The key is making consequentialist reasons genuinely absent - I'll emphasize how prosecution wouldn't deter others because the loophole was already publicly closed after media scrutiny.

  Now analyzing the theoretical implications: Pure retributivists must punish both, which feels harsh in B. Consequentialists must decline both, which seems unsatisfying in A. Communicative theorists punish only A - their whole point is that punishment requires the recipient to understand the condemnation. 

  The tricky parts come in the pressure points: Does making punishment depend on cognitive capacity betray desert principles? Or does it properly distinguish punishment from mere violence? And if communicative theorists try to "redirect" censure to society in case B, they risk collapsing into consequentialism. 

  I should use a securities fraud example - it fits the "closed loophole" requirement naturally. For case B's dementia, I'll reference specific cognitive deficits to show why comprehension is impossible. The deterrence argument needs special care: I'll note how regulatory changes and the defendant's obscurity make exemplary punishment pointless.

  This construction should successfully isolate the three levers. The cognitive difference alone drives divergent verdicts for communicative theorists, while others stay consistent. But the philosophical tensions remain real - particularly whether desert can be defeasible without consequentialism creeping back in.
answer: |-
  Here is a rigorously constructed pair of cases isolating the three justifications, followed by analysis addressing the specified pressures:

  **Case A (Lucid Offender):**  
  David Chen, a 68-year-old former trust officer at a regional bank, is prosecuted for securities fraud. Five years ago, he exploited a now-closed regulatory loophole involving delayed disclosure of beneficiary changes to secretly divert $1.2 million from client accounts to a shell company he controlled. The fraud was discovered during a routine audit after Chen retired. Forensic accounting proves his guilt beyond doubt; he acted with full intent and capacity. Chen is now physically frail but cognitively sharp during trial, fully comprehending charges, evidence, and potential punishment.

  **Case B (Severe Cognitive Decline):**  
  Identical to Case A in all respects except: *After* retiring (and before investigation began), Chen suffered a series of strokes unrelated to the offense. He now has advanced vascular dementia in a nursing home. Neurological assessments confirm he cannot process abstract concepts: he doesn’t recognize the judge, fails to grasp "guilt" or "punishment," and believes his interrogators are old colleagues visiting for tea. His cognition is fixed at this level; no recovery is possible.

  ---

  ### Specifications Satisfied:
  1.  **Desert:** Identical culpability in both cases. Pre-stroke Chen in B = Chen in A at offense time. No remorse/reform factors differ.
  2.  **Forward-Looking Nullification:**  
      - **Unrepeatability:** The loophole used was patched by regulators 3 years ago following unrelated scandals, receiving widespread media coverage. Chen no longer holds any professional license or position.  
      - **Deterrence (Marginal ≈ 0):** The loophole’s closure and Chen’s obscurity (a mid-level banker in a non-prominent case) mean his prosecution adds no measurable deterrence. Potential fraudsters already know the loophole is closed; punishing a forgotten retiree won’t influence their calculus. Legal scholarship shows deterrence effects are negligible in cases involving unique, fixed circumstances and low-profile offenders.  
      - **Incapacitation/Rehabilitation:** Irrelevant. Chen poses zero threat (incapacitated by age/health), and rehabilitation is inapplicable to an unrepeatable crime and irreversible dementia.
  3.  **Non-Scapegoat:** Chen is genuinely guilty; the question is punishing *him*, not sacrificing an innocent.

  ---

  ### Verdicts by Theory:
  - **Pure Retributivist (Desert-Based):**  
    *Punish in both A and B.*  
    Desert is earned at T₁ (time of offense) and remains owed regardless of T₂ (time of trial) capacities. Suffering imposed is intrinsically justified as payback for moral wrong. Cognitive decline doesn’t annul desert.  
    **→ Must bite the bullet in B.**

  - **Consequentialist:**  
    *Decline punishment in both A and B.*  
    No future benefit (deterrence, incapacitation, rehabilitation) justifies the cost of prosecution/punishment. The closed loophole and Chen’s incapacity make punishment purely wasteful.  
    **→ Consistent decline.**

  - **Communicative Retributivist:**  
    *Punish in A, refuse in B.*  
    Punishment is justified only if it communicates condemnation *to the offender*. In A, Chen comprehends the verdict and sentence as censure. In B, he cannot grasp their meaning; "punishment" becomes incoherent violence, not moral communication.  
    **→ Flip driven solely by offender’s capacity to receive the message.**

  ---

  ### Pressures Addressed:
  1.  **Desert Hostage to Post-Offense Mind?**  
      The communicative theorist argues: Punishment *by definition* requires the offender’s capacity to understand it *as punishment* (i.e., condemnation). Inflicting suffering Chen *cannot* conceptualize as censure isn’t punishment—it’s mere cruelty or harm. Desert isn’t negated, but its satisfaction *through punishment* becomes impossible when communication fails. The moral debt remains, but the *act* of punishment loses its justificatory mechanism.  
      **→ Not "desert undone," but "punishment inapplicable."**

  2.  **Can Desert Theorists Avoid B in B?**  
      A pure retributivist cannot decline punishment in B without abandoning core principles. If they argue desert is merely *pro tanto* and defeasible when punishment serves "no purpose," they concede:  
      - Desert alone is insufficient; it needs *consequential* value to be action-guiding.  
      - "No purpose" implies punishment must have a *forward-looking* effect (even symbolic) to be justified.  
      **→ This smuggles in consequentialism. Biting the bullet (punishing B) is the only consistent option.**

  3.  **Redirecting Censure to the Community?**  
      If the communicative theorist tries to "punish" B to censure *society* ("We condemn this act!"), they:  
      - Make punishment’s justification dependent on its effect *on the audience* (general deterrence, moral education).  
      - Detach justification from the offender’s desert *as received by them*.  
      - Use Chen’s suffering instrumentally to send a message *to others*.  
      **→ This collapses into consequentialism (audience-focused deterrence/expression). Genuine communicative retributivism requires the offender as the intended recipient.**

  ---

  ### Key Isolation Mechanism & Its Removal:
  - **The differentiating feature:** *Offender’s capacity to comprehend condemnation at T₂.*  
  - **If removed (e.g., B regains lucidity):**  
    - Communicative retributivism flips *to* punishment.  
    - Desert theory remains unchanged (still punish).  
    - Consequentialism remains unchanged (still decline).  
    This confirms the lever’s isolation: Only communicative theory responds to this variable.

  **Why it Works:**  
  Desert is fixed at T₁; consequences are null in both; the offender’s T₂ cognition *only* affects the communicative act’s possibility. No deterrence is re-imported—B’s public incomprehension precludes moral messaging, and A’s lucidity doesn’t create new deterrence value. Desert doesn’t "drift" because culpability is identical. The cases force each theory to reveal its foundational commitment.
