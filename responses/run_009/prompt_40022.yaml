  Then there's the Newman objection. They explicitly state that any structural claim must avoid triviality. Newman's problem shows that without constraints, structural descriptions become vacuous. So escaping Newman is definitely non-negotiable. Both epistemic and ontic camps need this, though they might solve it differently. Epistemic might add modal constraints, while ontic might eliminate objects entirely.

  The realism-instrumentalism tightrope is another key point. They want structural realism to be a genuine middle path. If it collapses into either traditional realism or instrumentalism, it's useless. This is non-negotiable because the whole point of structural realism is to navigate between these pitfalls. The distinction between structure and objects must be maintained unless argued otherwise.

  The object-structure distinction brings up quantum mechanics. Quantum particles might not be individuals, which supports ontic eliminativism. But the user hints that QM might still need some notion of objects. If so, ontic eliminativism could conflict with physics. This tension might be critical—perhaps even a dealbreaker for pure ontic versions.

