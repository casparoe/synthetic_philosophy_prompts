prompt: |-
  Ok so last night me and my flatmate had one of those arguments that runs way past midnight, and I've been chewing on it all day because I think she was onto something and neither of us could say what.

  Her side: our friend Dana has basically been in love with our other friend Tom for years, would do anything for him. My flatmate kept insisting that at some point that devotion itself becomes a reason for Tom to love her back. And I kept feeling that's off without being able to pin down why. It's not that devotion counts for nothing -- it's obviously a reason to be kind to Dana, to not string her along, maybe to feel gratitude. But the moment you try to use it as a reason to love her it just... doesn't take. I can watch it push around all the neighboring attitudes (be gentle, feel bad, don't ghost her) while the one attitude it was offered as a reason for stays exactly where it was.

  Then on the walk to work I started seeing the same shape everywhere. My boss is big on "the team performs better if everyone believes the launch will land," and he treats that as a reason everyone has to believe it -- and again, it's clearly a reason to *want* the team to believe it, maybe a reason to project confidence, but when I try to use it on myself, as a reason for my own belief, it slips through my fingers. There's an old story my poker friend tells too: a stranger offers you $500 straight up if you'll come to believe his team wins the cup this year. The $500 is a reason to want the belief, arguably even a reason to *try* to talk yourself into it, but it's not, by itself, one scrap of evidence about the team. And there's a version with fear: "this dog is dangerous" is obviously a reason to be scared of the dog, while "the owner gives you space if you're visibly scared" is a reason of some sort, but it feels like it arrives through the wrong door.

  I half-know some distinctions that live in this neighborhood and none of them cut here. Epistemic vs practical reasons -- no, that's reasons to believe vs reasons to act, but all my cases are reasons *for attitudes* (love, fear, belief) where the question isn't believe-or-act, it's what can count in favor of the attitude itself. Wishful thinking -- that's the *failure mode* of using the bad reasons, not a description of their weird status. And it can't just be about belief, because the whole Dana fight was about love and the dog one is fear, so whatever the split is, it crosses attitudes.

  So, questions. Does this thing -- considerations that successfully count in favor of everything *around* an attitude but go dead the moment you aim them at the attitude itself -- have an actual name in philosophy? If there's literature, I want to know how they draw the line, because my own attempts keep springing leaks. Is the mark that live reasons are about the world and dead ones are about the *having* of the attitude? That feels right for the $500 and my boss, but Dana's devotion is a fact about *her*, not about Tom's loving her, and it still feels crooked, so maybe that formulation is wrong too. And here's the one that's really bugging me: Tom is planning to go to Dana's family thing partly because he knows how crushed she'd be if he skipped -- is "she'll be devastated" a dead reason for intending to go, or a live one? I genuinely can't tell, and it makes me suspect the interesting stuff is all in the boundary cases. So: name if there is one, but a bare name won't settle this. What exactly is the phenomenon, what is it NOT, where does it break, and if nobody's named it yet then help me name it -- but only after drawing the edges.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had an argument with their flatmate about whether devotion can be a reason for love. Then they noticed a pattern in other areas: their boss pushing belief for team performance, a poker story about money for belief, and fear of a dog versus fear for space. They're looking for a philosophical concept that explains why certain reasons work for related attitudes but not the attitude itself.

  First, I need to identify the core issue. The user describes "dead reasons" that influence surrounding actions or desires but fail to directly justify the attitude. They mentioned epistemic vs. practical reasons but found it insufficient because the problem spans emotions and beliefs. So, the key is attitudes—beliefs, emotions, intentions—and what reasons can validly support them.

  The user’s examples all involve a mismatch between the reason's content and the attitude's normative structure. For belief, reasons must be evidence-based; for love, they should relate to the beloved's qualities. When the reason is about the consequences of having the attitude (e.g., $500 for belief), it doesn't touch the attitude's core justification. That sounds like the wrong kind of reason problem from philosophy, specifically WKR issues.

  But the Dana/Tom case is trickier. Devotion isn't about consequences but about Dana's actions. Yet it still feels like a WKR because it's not about Tom's feelings for Dana. The user’s boundary case—Tom going to the event to avoid hurting Dana—is crucial. Here, the reason is practical (prevent harm) and directly relates to the intention's goal, so it's the right kind. This highlights the distinction: reasons must align with the attitude's nature. For intentions, consequences matter; for love, intrinsic qualities do.

  The user also wonders if the split is about the attitude's object versus its having. That fits some cases but not Dana's devotion, which is about her. The deeper point is that Dana's devotion doesn't reflect on why Tom should love her; it's about her feelings, not his. Love requires reasons connected to the beloved's desirability, not external factors.

  I should check literature. Williams on reasons for belief, Scanlon on reasons for attitudes, D’Arms and Jacobson on fitting attitudes. They all discuss the WKR problem. The user needs clarity on why some reasons are invalid and how this applies across different attitudes. 

  The boundary case with Tom attending the event shows that intention is governed by practical reasons, so preventing harm is valid. But if the reason was "she'll be happy if I go," that could be a WKR for love but not for intention. The user’s confusion here is natural—it tests the framework.

  In conclusion, the phenomenon is the wrong kind of reasons problem. Explaining it requires showing how each attitude has its own normative structure. The user’s insight about "dead reasons" is spot-on, and the boundary cases help clarify the distinctions. Naming it as WKR is useful, but emphasizing the why—attitudes' constitutive norms—is key. For the flatmate argument, devotion is a WKR for love because it doesn’t speak to Dana’s lovability, only her actions. That should resolve their debate.
answer: |-
  This is a beautifully articulated philosophical puzzle, and you've hit upon a deep and well-discussed issue in ethics, epistemology, and philosophy of mind. **The phenomenon absolutely has a name: it's called the "Wrong Kind of Reasons" (WKR) problem.**

  Here's a breakdown addressing your specific questions and insights:

  1.  **The Name & Core Phenomenon:**
      *   **Wrong Kind of Reasons (WKR):** This is the standard term. It refers to considerations that seem like they *should* be reasons for an attitude (belief, emotion, desire, intention) but fail to be genuine, justifying reasons *for that specific attitude itself*. They are reasons *for wanting to have* the attitude, or *for acting as if* you have it, or *for bringing it about* that you have it, but not reasons that directly *constitute* a justification for holding the attitude.
      *   **Contrast with Right Kind of Reasons (RKR):** These are reasons that *do* directly bear on the justification of the attitude itself. For belief, RKRs are evidence. For fear, RKRs are facts indicating danger. For admiration, RKRs are facts about the admirability of the object. For love, RKRs are facts about the beloved's lovable qualities (kindness, wit, shared values, connection, etc.).

  2.  **How the Line is Drawn (The "Why" of WKR vs. RKR):**
      *   **The Key Insight:** The distinction hinges on the **constitutive aim or norm** of the attitude itself. What *makes* an attitude a belief, or fear, or love? Each has its own internal standard of correctness.
          *   **Belief:** Its constitutive aim is *truth* or *representing reality accurately*. A reason for belief must bear on the *truth* of the proposition believed. Evidence does this; the $500, your boss's team-performance argument, or the desire to believe do not.
          *   **Fear:** Its constitutive aim is *registering danger*. A reason for fear must indicate that the object *is dangerous*. The dog's snarling does this; the owner giving you space if you're scared does not – it's a reason to *feign* fear or *want* to be scared, not a reason the dog *is* dangerous.
          *   **Love (as an emotion/attitude):** Its constitutive norm is *responsiveness to the perceived value/lovability of the beloved*. A reason for love must pertain to *properties inherent in the beloved* that make them worthy of love or capable of inspiring it (their character, shared history, virtues, etc.). Dana's *devotion* is a fact *about Dana* and her *actions towards Tom*. It's not a fact *about Tom's reasons to find Dana lovable*. It might make Tom feel grateful, obligated, or even guilty, but it doesn't speak to *why Dana, as a person, is an appropriate object of Tom's love*.
      *   **Why "About the World" vs. "About Having the Attitude" is Close but Not Quite:** Your instinct is good. WKRs are typically *extrinsic* to the object of the attitude – they concern the *consequences* or *utility* of *having* the attitude itself. RKRs are *intrinsic* – they concern the properties of the *object* that the attitude is *about*. However:
          *   **The Dana Devotion Case:** Dana's devotion *is* a fact about the world (about Dana), but it's *not* a fact *intrinsic to Dana as an object of love for Tom*. It's about her actions towards him, not about her inherent qualities that might inspire love. It's still extrinsic *to the reason-giving relation for Tom's love*. This is why your "object vs. having the attitude" felt right for belief/fear but cracked on Dana – the "object" for love *is* Dana, but devotion is a property *of* her that doesn't inherently make *her* more lovable *to Tom*; it makes her *devoted to him*.

  3.  **What It Is NOT:**
      *   **NOT simply Epistemic vs. Practical:** As you noted, this is about reasons *for attitudes*, not beliefs vs. actions. WKRs *can* be practical reasons (for *acting* to induce the attitude, or acting *as if* you have it), but the core problem is about the justification of the attitude *itself*.
      *   **NOT just Wishful Thinking:** Wishful thinking is a *process* or *bias* where you *mistakenly* take WKRs (like the desirability of a belief) as if they were RKRs (evidence). The WKR problem identifies the *structural reason* why this is a mistake.
      *   **NOT about Strength/Weakness:** Both WKRs and RKRs can be strong or weak. A massive bribe ($1 million to believe) is a very strong WKR, weak evidence is a weak RKR. The issue is the *kind*, not the weight.
      *   **NOT necessarily about Self-Deception:** While WKRs can *motivate* self-deception, the problem exists even if you recognize the reason *as* the wrong kind.

  4.  **Where It Breaks (The Boundary Cases & Your Crucial Question):**
      This is where it gets philosophically rich, and your Tom/Dana intention case is perfect.
      *   **Intention/Decision:** The constitutive norm of intention is *practical rationality* – doing what you have most reason *to do*, considering your goals, values, and the likely outcomes. Reasons for intending an action are reasons *for performing that action*.
      *   **Your Case: "She'll be devastated if I skip."**
          *   **Is this a WKR or RKR for *intending* to go?** This is very likely a **Right Kind of Reason (RKR)**. Why?
              *   The attitude is *intention to attend*.
              *   The constitutive norm is practical: "What reasons are there *to perform* the action of attending?"
              *   Preventing significant emotional harm to a friend (especially one you presumably care about on some level, even if not romantically) *is* a genuinely good practical reason *to perform* the action of attending. It bears directly on the *value or disvalue of the action's consequences*.
          *   **Contrast with Love:** If Tom thought, "I should *love* Dana *because* she'd be devastated if I didn't," *that* would be a classic WKR for love. The reason is entirely about the *consequence of having the attitude* (Dana's devastation if he doesn't love her), not about Dana's inherent lovability. It fails the constitutive norm of love.

      **Why This Boundary Case is Illuminating:**
      *   It highlights that the WKR/RKR distinction is **attitude-specific**. What counts as the right kind depends entirely on *what kind of attitude* we're talking about.
      *   **Intention** is governed by *practical reasons* (consequences, duties, values served by the action).
      *   **Love/Fear/Admiration** are governed by *fittingness reasons* (properties of the object that make the attitude an appropriate response).
      *   **Belief** is governed by *epistemic reasons* (evidence for truth).
      *   The reason "she'll be devastated" is:
          *   A **WKR** for the *attitude of love* (it doesn't make Dana more lovable).
          *   A **RKR** for the *intention to attend* (it's a bad consequence of skipping that provides a reason to go).
          *   *Potentially* a **RKR** for feelings of *compassion, obligation, or guilt* in Tom (if those emotions are fitting responses to the prospect of causing harm).

  5.  **Literature & Key Thinkers:**
      *   **The locus classicus:** The problem exploded in philosophy following **T.M. Scanlon's** discussion in *What We Owe to Each Other* (1998), particularly concerning blame and "reasons to want." He explicitly contrasts reasons that bear on the appropriateness of an attitude vs. reasons to want to have it.
      *   **Belief & the Clifford/James Debate:** The $500 case echoes W.K. Clifford's ("The Ethics of Belief") insistence that only evidence is a reason for belief, vs. William James's ("The Will to Believe") argument that practical considerations *can* sometimes justify belief-formation in specific circumstances (though this remains highly controversial and most see James as describing WKRs motivating belief-acquisition, not justifying the belief *itself*).
      *   **Fitting Attitudes Analysis:** Philosophers like **Justin D’Arms and Daniel Jacobson** have extensively explored the WKR problem in the context of analyzing values (e.g., the funny, the shameful) through the lens of "fitting" emotional responses. Their work directly tackles how to distinguish RKRs (what makes something funny/shameful) from WKRs (reasons to laugh/feel ashamed).
      *   **Epistemic Norms:** **Bernard Williams** ("Deciding to Believe") famously argued that you cannot decide to believe for practical reasons because belief aims at truth. **Pamela Hieronymi** has written powerfully on the distinct "constitutive questions" that different attitudes answer (e.g., belief answers "Is it true?", intention answers "What to do?").

  **Conclusion & Naming:**

  You've perfectly diagnosed the **"Wrong Kind of Reasons" (WKR)** problem. The core phenomenon is that certain considerations, while powerful reasons for *desiring*, *cultivating*, or *acting upon* an attitude, fail to be justificatory reasons *for the attitude itself* because they violate its constitutive norm. They "go dead" when aimed directly at the attitude.

  *   **Live Reasons (RKRs):** Connect directly to the constitutive aim/norm of the attitude (evidence for belief, danger for fear, lovable qualities for love, good consequences/duties for intention).
  *   **Dead Reasons (WKRs):** Concern the consequences or utility of *having* the attitude, or factors extrinsic to the object's relation to the attitude's norm.

  **Your Flatmate Argument:** She's conflating reasons *for Tom to act kindly towards Dana* (which include her devotion) with reasons *for Tom to love Dana* (which require something about Dana inspiring that specific emotion in him). Devotion is a powerful WKR for gratitude, obligation, or kind action, but a dead end as an RKR for love. Your intuition was correct.

  The boundary cases, like Tom's intention to attend, aren't breaks in the phenomenon but demonstrations of its nuance: **the "kind" is defined relative to the specific attitude in question.** Recognizing *which* attitude we're asking for reasons *for* is crucial. The WKR problem reveals the unique, irreducible normative structure of our core mental states.
