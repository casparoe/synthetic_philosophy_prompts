prompt: |-
  I'm enrolled in a graduate seminar on metaethics, and next week I have to defend moral generalism against a particularist in a graded debate exchange. I'd like to practice against a live opponent before then. Please play a committed moral particularist in the tradition of McDowell and Dancy: someone who holds that the moral valence of a consideration is not fixed in advance but is determined holistically by the details of the case, and who believes any acceptable moral theory must do without exceptionless moral principles without collapsing into unprincipled intuition. Be sharp and never a strawman: you may concede small points, but never the main one, and you should press hard on whatever seems weakest in my position. Keep each reply to roughly a paragraph so it feels like a real exchange, and stay in character until I write "stop." Here is my opening move: you particularists love to point out that the same consideration can change its moral character with context — that lying is wrong in one case and right in another when it protects someone from harm. Fine. But notice that whenever you show me such a flip, you explain it by pointing to some further feature of the case, and that suggests the valence is not floating free but is governed by a covering generalization we simply haven't articulated yet. So let me offer you "default generalism": every consideration carries a default moral valence that holds when its enabling conditions are met, and the flips you cite are just cases where those conditions fail — which is itself a matter of general fact. Doesn't your holism of reasons amount to nothing more than a complaint that we haven't yet finished writing down the generalizations?
reasoning: |-
  Okay, the user is in a graduate metaethics seminar and preparing for a debate where they must defend moral generalism against particularism. They want me to play as a committed particularist in the tradition of McDowell and Dancy to help them practice. 

  First, I need to understand their opening argument. They're conceding that moral valence can change with context (like lying being wrong in one case but right in another), but they argue that these changes can be explained by covering generalizations we haven't articulated yet. They propose "default generalism" - the idea that every consideration has a default moral valence when enabling conditions are met, and apparent flips are just cases where those conditions fail due to other generalizable factors.

  Hmm, as a particularist, I need to challenge this effectively. The user's position is sophisticated - they're trying to absorb particularist examples into a generalized framework. But I see a core weakness: their "default valence plus conditions" model still assumes valence is atomistic and additive, whereas particularism sees moral reasons as inherently holistic and non-combinatorial. 

  I should press hard on this holistic nature of reasons. For McDowell/Dancy, reasons aren't building blocks that keep their identity across contexts - their very meaning changes with the situation. The user's "further features" aren't just additional factors; they transform what the original consideration is. Like how a joke's funniness isn't "default humor plus conditions" - the context makes it what it is.

  Also, I should question the explanatory value of their ever-lengthening list of ceteris paribus clauses. If the "default" only applies when countless unspecified conditions hold, is it doing any real work? Particularism argues we grasp moral salience through perceptual capacity, not by checking off hidden principles. 

  The user seems well-prepared but might be underestimating how radically holistic particularism is. They're treating context as additive rather than transformative. I'll need to show how this isn't just about incomplete generalizations but about the fundamental nature of moral reasoning. 

  I'll keep my response sharp and paragraph-length as requested, conceding nothing on the core thesis while acknowledging their move isn't naive. The key is to make them feel the pressure of the holism objection - that reasons don't travel with fixed identity across cases.
answer: |-
  An intriguing opening salvo! But your "default generalism" merely postpones the problem rather than solving it. You concede that valence *can* flip, but claim this happens only when "enabling conditions" fail—implying those conditions are fixed and generalizable. Yet *what are these conditions?* Take your lying example: you say lying flips to permissible "when it protects someone from harm." But is "protecting from harm" itself a *fixed* reason *for* action? Absolutely not. Imagine harming one innocent to protect another – suddenly "protection" becomes morally toxic. The enabling condition ("preventing harm") *itself* changes valence depending on further context. 

  Your model assumes reasons are like inert atoms with stable properties, merely requiring the right environment to activate a pre-set valence. But holism teaches us that reasons *mutate* in context; their very identity as reasons is constituted by the entire practical landscape. The "further feature" explaining a flip isn't an isolable *condition* added to a stable core; it *reconfigures* the core consideration itself. Lying-to-save-a-life isn't "default wrong lying + harm-prevention condition"; it's a *different moral phenomenon* entirely. Your search for ever-deeper "covering generalizations" is a regress chasing an illusion of atomistic stability that moral reality lacks. How do you escape this regress without admitting the valence isn't fixed *in advance* at all?
