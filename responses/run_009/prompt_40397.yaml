  1. Worst-case guarantee: This is a security-style guarantee against adversarial inputs. It requires setting an explicit cap on the adversary's capabilities (since "maximally adversarial" is unbounded and undefined without a cap). The cap is a choice and must be made explicit.
  2. Average-case guarantee: This is a statistical claim about a distribution of inputs (e.g., typical users). The quality of the guarantee depends on how well the distribution reflects reality.

  The procedure will have steps (questions) that the board must answer. Each step must have clear criteria for what counts as sufficient. The output is one of four verdicts:
