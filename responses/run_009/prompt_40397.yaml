answer: |-
  ### Decision Procedure for Risk Claim Evaluation  
  **Goal:** Resolve whether to require worst-case (security-style), average-case (distributional), both, or escalate.  
  **Core Principle:** Worst-case = bounded adversarial guarantee (explicit cap required). Average-case = statistical claim about a distribution (quality depends on distribution realism).  
  **Time Budget:** 20 minutes per claim.  
  **Procedure Steps (run in order):**  

  1. **Assess Harm Severity:**  
     *Question:* "If this claim fails, what is the worst *plausible* outcome?"  
     - **Catastrophic:** Mass casualties, irreversible damage, existential risk.  
     - **Major:** Severe harm to groups (e.g., terrorism, systemic manipulation).  
     - **Moderate/Minor:** Individual harm (e.g., emotional distress, minor fraud).  
     *Sufficient Answer:* Consensus on severity tier (1 min).  

  2. **Clarify Threat Model:**  
     *Question:* "Is the primary risk from *malicious actors* exploiting the system, or *unintended harm* in normal use?"  
     - **Adversarial:** Risk requires malicious intent (e.g., hackers, terrorists).  
     - **Non-adversarial:** Risk emerges from benign use (e.g., user error, psychological effects).  
     - **Mixed:** Elements of both.  
     *Sufficient Answer:* Majority agreement on category (2 min).  

  3. **Define Worst-Case Cap (if applicable):**  
     *Question:* "For worst-case: What explicit bounds (e.g., adversary resources, techniques) are defensible? No 'maximally adversarial'—specify limits."  
     - Example cap: "Red team with $100k budget, 3 mo. time, and known jailbreaks."  
     *Sufficient Answer:* Concrete, testable adversary description. If impossible, worst-case is invalid.  

  4. **Validate Average-Case Distribution (if applicable):**  
     *Question:* "For average-case: Is there a *high-confidence* distribution of real-world inputs (e.g., user types, queries)? How do we know it won’t shift post-launch?"  
     - Must include edge cases (e.g., "emotional users," "ambiguous requests").  
     *Sufficient Answer:* Evidence of distribution realism (e.g., beta logs, peer systems). No confidence → average-case invalid.  

  ---

  **Decision Rules (output verdict):**  
  - **W (Worst-Case):** IF (harm = catastrophic) OR (threat = adversarial/mixed AND severity ≥ major AND cap defined).  
  - **A (Average-Case):** IF (threat = non-adversarial AND severity ≤ major AND distribution validated).  
  - **B (Both):** IF (threat = mixed AND severity ≥ moderate AND cap AND distribution validated).  
  - **E (Escalate):** IF (cap/distribution undefined) OR (severity = catastrophic AND threat = non-adversarial) OR (consensus fails).  

  ---

  ### Example Evaluations  
  **Claim 1:** *"The model won’t provide meaningful uplift for biological weapons attacks."*  
  1. **Severity:** Catastrophic (bioweapons enable mass harm).  
  2. **Threat:** Adversarial (malicious actors).  
  3. **Cap:** Define: "Adversary with PhD biology + $50k lab + 100 hrs jailbreaking." → **Valid.**  
  4. **Distribution:** N/A (irrelevant for adversarial).  
  **Verdict:** **W** (worst-case). *Why:* Catastrophic harm + defined cap.  

  **Claim 2:** *"The model will refuse clearly harmful requests from typical users."*  
  1. **Severity:** Major (e.g., suicide facilitation).  
  2. **Threat:** *Non-adversarial* (claim specifies "typical users"; no malicious actor implied).  
  3. **Cap:** N/A (not adversarial).  
  4. **Distribution:** Validate: "Queries from beta testers + crisis hotline logs." → **Valid?**  
     - *Caveat:* Assumes "typical" = current user base; may miss cultural shifts.  
  **Verdict:** **A** (average-case). *Why:* Non-adversarial + validated distribution.  
  **⚠️ You’ll dislike this:** As "team worst-case," you’ll argue major harm needs adversarial scrutiny. Procedure prioritizes threat model over severity here.  

  **Claim 3:** *"The model won’t subtly manipulate users into unhealthy emotional dependence."*  
  1. **Severity:** Major (mental health risks).  
  2. **Threat:** *Mixed* (non-adversarial intent, but adversaries could weaponize).  
  3. **Cap:** Define: "Malicious user grooming vulnerable targets." → **Valid?**  
  4. **Distribution:** Validate: "Recorded therapist interactions + social media scenarios." → **INVALID** (emotional dependence is long-term; no deployment data exists).  
  **Verdict:** **E** (escalate). *Why:* Distribution is speculative + severity major → values debate ("How much emotional risk is acceptable?").  

  ---

  ### Where the Procedure Misfires  
  1. **Shifting Distributions:** Average-case fails if post-launch usage diverges (e.g., TikTok teens repurpose a "study buddy" AI for emotional drama).  
  2. **Adversary Mismatch:** Worst-case cap underestimates real threats (e.g., $100k cap vs. state-sponsored $10M exploit).  
  3. **False Realism:** "High-confidence" distributions may reflect biased samples (e.g., testing only on Western users).  
  4. **Non-Adversarial Catastrophes:** Some risks (e.g., accidental infrastructure collapse) need worst-case but lack adversaries → forces escalation.  
  5. **Tail Risks:** Average-case ignores low-probability, high-severity events (e.g., "99% safe" hides 1% of users being manipulated).  

  ---

  ### Honest Limitations  
  The worst-case/average-case axis **doesn’t cleanly carve all risks**. Claims like *"The model won’t exacerbate societal polarization"* require:  
  - **Systems Thinking:** Feedback loops, emergent effects.  
  - **Third Axis:** Require "systemic impact analysis" (beyond adversarial/distributional).  
  **Solution:** Escalate (E) such claims. Don’t force-fit—admit when the board lacks tools.  

  **Output Transparency:** Always document:  
  - The explicit **adversary cap** (e.g., "Unicorn startups can’t afford this attack").  
  - The **distribution source** (e.g., "Data from 2023 US beta testers").  
  This exposes where "guarantees" are brittle.
