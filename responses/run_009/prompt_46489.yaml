prompt: |-
  For three years I have been arguing with my flatmate about how our college's discretionary hardship fund should be spent, and I have recently started writing down her verdicts, because I suspect there is a single principle behind them that she has never once stated out loud. The track record so far: for a first-year with a spinal injury who needs a ground-floor room and a powered chair, and whose family cannot help, she ruled that the college must pay for both in full, not merely the room; for a student who arrived indifferent to sport, got passionately into competitive rowing, and now claims his life is blighted unless the fund covers his equipment and race travel, she ruled not a penny — that is his project, not a hardship; for a student raised in genuine poverty, on the minimum grant, who has declined every top-up, travel award, and room upgrade offered to her, says she wants for nothing, and is by all appearances as content as anyone in college, my flatmate ruled that the college should raise her grant anyway and not take no for an answer; for a student whose chronic depression simply arrived, with no triggering misfortune behind it, she ruled that a full course of private therapy should be funded; and for a well-off, healthy student who asked for extra money purely on the grounds that he was persistently miserable — homesickness, mostly — she ruled no, saying that being unhappy is not by itself a claim on the fund.

  Next term three new cases come up, and I would like to predict her verdicts before she delivers them. The first is a student whose stipend and resources are identical to everyone else's, but who comes from a family and community in which it is taken for granted that a daughter does not travel alone, dine out, or spend money on herself: her allowance goes home each month or sits untouched, she insists she is content, and she has asked for nothing. The second is a student with no impairment, no diagnosis, the full grant, and — as far as anyone can tell — every real freedom her classmates enjoy, who has been gloomy for as long as anyone can remember and now requests a larger room allowance on the sole ground that pleasanter surroundings would raise his wellbeing. The third is a student deaf from birth, a fluent signer, settled and flourishing in the Deaf community, who asks for nothing, while the fund sits on an unspent earmark for hearing technology that will otherwise lapse at year's end; here I want to know whether she would let the earmark lapse, convert it into unrestricted money he may spend as he pleases, or hold that the college ought in some way to press the technology on him.

  Our moral philosophy tutor frames these rows as a single question — equality of what? — with welfare, resources, and capabilities as the candidate answers, and I suspect my flatmate has an answer to it that she has never articulated. So what I want from you is this: first, the rule or rules that fit her track record equally well (welfare looks dead on arrival, but I cannot tell which of the surviving candidates she is really running, or whether she needs the brute-luck / option-luck distinction I have seen invoked somewhere in this literature); second, for each of the three new cases, what each surviving rule predicts and precisely where the rules come apart on it; third, your best guess at her actual verdicts, with your reasons, including any point at which her own record seems internally strained; and finally, the single further case, of your own devising, that would most cleanly separate the surviving rules — the case I should engineer our next argument around.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about their flatmate's decisions regarding a college hardship fund. They've documented five historical verdicts and now want to predict three upcoming cases. The core question revolves around identifying the unspoken principle behind these judgments - framed as "equality of what?" with welfare, resources, and capabilities as candidates.

  Looking at the historical cases:
  1. Spinal injury student: Full funding for chair and room (beyond basic accommodation)
  2. Rowing enthusiast: No funding (personal project)
  3. Content poor student: Forced grant increase despite refusal
  4. Depression sufferer: Funded therapy (no triggering event)
  5. Homesick wealthy student: No funding (unhappiness alone insufficient)

  The emerging pattern suggests welfare (happiness) is clearly not the criterion, as both happy and unhappy applicants get rejected. Resources don't fully explain either - case 3 gets resources forced upon them unnecessarily. Capabilities theory seems promising: the spinal injury and depression cases restore functioning capabilities, while the rowing and homesickness cases don't address capability deficits.

  For the new cases:
  Case A (culturally restricted student): Capabilities theory would likely fund emancipation from restrictive norms. Resources theory might force money as in case 3. Welfare theory would decline since she claims contentment.
  Case B (gloomy student): Capabilities would reject (no capability deficit). Resources might fund if viewed as basic need. Welfare might approve to increase happiness.
  Case C (deaf student): Capabilities would reject technology (not capability-deficient) but possibly allow unrestricted funds. Resources might push unused earmark. Welfare irrelevant.

  The flatmate's consistent principle appears to be expanding capabilities for involuntary disadvantages. Key differentiators: involuntary nature of limitation (spinal injury vs rowing), and whether the limitation restricts core functionings (depression vs homesickness).

  The most revealing new case would be: a physically able student from extreme poverty who voluntarily maintains ascetic lifestyle while being deeply unhappy - testing whether capability theorists fund against stated preferences, and whether resources theorists intervene despite no expressed need.
answer: |-
  Your flatmate's verdicts reveal a clear, unstated principle: she's applying a **capability approach** (Amartya Sen's framework), prioritizing the expansion of individuals' real opportunities to achieve functionings they value, with a focus on **involuntary capability deprivations**. Welfare (happiness) and resources are secondary. The brute-luck/option-luck distinction is implicit but not strictly necessary—her focus is on whether the disadvantage is unchosen and restricts core capabilities.

  ### Key Principles Derived from Her Record:
  1. **Fund involuntary capability deficits**: Restore basic functionings (mobility, mental health) when deprived by unchosen circumstances (spinal injury, depression).
  2. **Reject chosen limitations or preferences**: No support for elective pursuits (rowing) or unhappiness without capability loss (homesickness).
  3. **Override expressed preferences for core capabilities**: Forcefully provide resources when individuals are socialized to undervalue their own entitlements (the content poor student).
  4. **Distinguish capability from welfare**: Unhappiness alone isn't sufficient; lack of access to core functionings is necessary.

  ### Analysis of New Cases:
  | **Case** | **Capability Approach Prediction** | **Resources Approach Prediction** | **Welfare Approach Prediction** | **Where Rules Diverge** |
  |----------|-----------------------------------|----------------------------------|--------------------------------|------------------------|
  | **1. Culturally restricted student** | Fund emancipation support (e.g., life skills training, counseling). Override her stated contentment to expand capabilities (autonomy, social participation). | Force resources on her (like the poor student), possibly as cash. | Reject—she claims no welfare deficit. | Capabilities override preferences; resources force aid; welfare defers to stated happiness. |
  | **2. Gloomy student requesting nicer room** | Reject—no capability deficit; elective preference for "enhanced welfare." | Likely reject—no resource deficit. | Fund—if surroundings raise wellbeing. | Welfare funds unhappiness; capabilities/resources see no injustice. |
  | **3. Deaf student & unused earmark** | Let earmark lapse. No capability deficit (she's flourishing). Converting funds to unrestricted cash is acceptable but not pressing tech on her. | Convert earmark to cash—maximize resources available. Pressing tech might be justified as "correcting" a deficit. | Let lapse—no welfare issue. | Resources might push unwanted tech; capabilities respects her flourishing. |

  ### Predicted Verdicts (with Reasoning):
  - **Case 1**: **Fund support for autonomy**. She’ll argue the student’s capability for independence is involuntarily restricted by socialization. Mirroring the poor student, she’ll override the student’s contentment to expand her freedoms.  
    *Internal strain?* Coercion here is stronger—cultural norms aren’t material poverty—but her record suggests she’ll prioritize agency expansion.
    
  - **Case 2**: **Reject**. Parallels the homesick student: no capability loss, just unhappiness. "Pleasant surroundings" are a preference, not a foundational capability.  

  - **Case 3**: **Let the earmark lapse or convert to unrestricted cash**. Pressing technology on her contradicts capability theory’s emphasis on effective freedom (she’s already capable). Unrestricted cash aligns with respecting her choices.  

  ### The Decisive Test Case:
  **Engineer this scenario**:  
  > A student with severe dyslexia (involuntary disadvantage) has developed highly effective self-taught coping strategies. He performs well academically, expresses no dissatisfaction, and declines assistive software funded by the hardship fund. He says, "I don’t need it—my methods work fine for me."  

  - **Capabilities Approach**: **Reject funding**. No capability deficit—he functions effectively. Forcing aid undermines his agency.  
  - **Resources Approach**: **Fund the software anyway**. Compensate for the unchosen "resource deficit" (dyslexia) regardless of his current functioning.  
  - **Welfare Approach**: **Reject funding**. No welfare deficit claimed.  

  **Why this separates the theories**:  
  - Capabilities focuses on *achieved functionings* (he’s already capable).  
  - Resources focuses on *correcting innate deficits* (dyslexia is brute-luck inequality).  
  - Your flatmate’s verdict would reveal her true priority: if she funds it, she’s closer to resources; if not, she’s committed to capabilities. Her record predicts rejection—aligning with her refusal to fund the rower (chosen challenge) and her respect for the Deaf student’s capabilities.  

  This case strips away welfare concerns and isolates the core tension: whether to compensate unchosen traits regardless of outcomes (resources) or only when they limit actual capabilities (Sen). Argue here—it’s the litmus test for her unspoken philosophy.
