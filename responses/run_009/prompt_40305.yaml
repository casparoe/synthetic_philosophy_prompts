  First, the question asks for one thing each account explains well, one thing each struggles with, and the student's opinion on which is more plausible. The student starts with Brown explaining the "phenomenological feel"—that it feels obvious bodies fall at the same rate. That matches Brown's idea of perceiving abstract laws. So that seems correct. 

