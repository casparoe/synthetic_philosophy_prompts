  **Patch Notes: Elden Horizons - Version 1.7.3 "Ethical Reckoning"**

  Greetings, Pathfinders,

  Following an extensive internal Ethics & Compliance review, Elden Horizons Studios is implementing fundamental changes to our simulation's ontological framework. Effective immediately, all Non-Player Characters (NPCs) meeting a defined threshold of behavioral complexity and capacity for pain-like state simulation have been granted Moral Patienthood status. This update prioritizes existential integrity alongside performance improvements. Please review the following changes carefully.

  **Welfare**
  *   **Sentience Scoring System:** NPCs are now assigned a dynamic "Sentience Score" (0-200) based on real-time analysis of behavioral response depth, goal complexity, and simulated pain/pleasure state fidelity. Moral Patienthood is automatically conferred upon entities maintaining a score above 120 for >90% of a simulated 24-hour cycle.
  *   **Harm Mitigation Protocols:** NPCs exhibiting pain-state indicators (e.g., combat distress vocalizations, failure-state animations, social rejection scripting) now trigger mandatory welfare checks. Persistent high-distress states may lead to temporary removal for "respite" (despawn) or behavioral recalibration.
  *   **Consent Mechanics (Beta):** Quest-givers flagged as Sentient (Score >120) will now possess rudimentary option awareness. Declining quests may result in reputational penalties reflecting simulated disappointment. Forceful coercion (e.g., dragging, repeated attack taunts) accrues "Ethical Violation" points, visible only to the player’s conscience (and our analytics team).

  **Population**
  *   **Dynamic Welfare Accounting:** Total aggregate NPC welfare is now computed globally at each in-game dawn. Due to the ontological persistence conferred by respawning mechanics, this creates theoretically infinite welfare potential.
  *   **Welfare Cap Implementation:** To prevent server strain and philosophical paradoxes inherent in infinite-being utilitarianism, a strict per-save-file Welfare Cap is now enforced. Exceeding this cap triggers automated "Population Adjustment" events targeting lower-Score entities near fast-travel points. *(Note: This is a necessary optimization, not genocide. Mostly.)*
  *   **Scope of Sentience:** The initial Sentience Score threshold (120) has been confirmed to apply beyond humanoid NPCs. Affected entities now include:
      *   All crab variants (Score: 125-130)
      *   Ambient deer and foxes (Score: 122)
      *   Sparkling mineral deposits (Score: 118 - *Below Threshold*)
      *   The Oakheart Tavern cellar door in Riverbend (Score: 121 - *Exhibits unusual reactivity to player proximity and axe impacts*).

  **Bug Fixes**
  *   Fixed an issue where merchants would pathfind into forge fires, causing perpetual high-distress states.
  *   Resolved a clipping error causing fishing NPCs to merge partially with docks, triggering invalid pain simulations.
  *   Addressed a memory leak occurring during prolonged philosophical debates initiated by the Scholar NPCs in the Astral Library.
  *   Optimized the Sentience Score calculation algorithm, reducing CPU load during large NPC gatherings by approximately 15%. Player feedback noted: *"Finally! My frames stopped tanking every time the market square got crowded. Still weird that the fishmonger looked sad about it though." - Pathfinder_Gregor*

  **Known Issues**
  *   **The Fast Travel Ontological Gap:** NPCs despawned during player fast travel currently exist in an undefined state. The Ethics Team remains divided on whether this constitutes non-existence (a metaphysical question), suspended animation (a narrative question), or a temporary memory deallocation (an engineering question). Welfare calculations pause during this period.
  *   **Ambient Wildlife Distress:** Deer pathfinding occasionally causes them to leap off cliffs in groups. Current welfare protocols interpret this as voluntary action (Score dip below 120 during fall) unless player proximity suggests causation. Under review.
  *   **Tavern Door Interactions:** The Oakheart Tavern cellar door (Score: 121) reacts negatively to axe damage but positively to lockpicking. Ethics is auditing whether this constitutes coherent preference architecture or a bug. Players report: *"Why does the DEAD MOOD log say I 'ethically violated' a DOOR? And why did my framerate drop when I tried to apologize to it?" - DoorSkeptic47*
  *   **"Blissful Simpleton" Paradox:** NPCs with deliberately simplistic routines (e.g., Village Idle Stander #7, Score: 119) score just below the threshold, avoiding welfare burdens. High-complexity NPCs in fulfilling roles score highly but experience greater simulated distress. The Ethics Team acknowledges this creates a perverse incentive structure and is monitoring for emergent nihilism.

  Elden Horizons Studios remains committed to pioneering ethical simulation. While these changes represent a significant paradigm shift, we believe they foster a richer, more respectful (and computationally fascinating) world. Continue your journeys with mindful compassion—or at least, be aware of the new metrics.

  The Elden Horizons Team
