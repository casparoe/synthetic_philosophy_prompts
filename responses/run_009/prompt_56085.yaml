  **Scenario:**  
  In the late 13th century, the neighboring kingdoms of Ardon and Beria (both situated on comparable Baltic coastal plains) begin with near-identical feudal economies: equivalent agricultural productivity (three-field system, iron plows), matched population densities, identical access to timber and iron ore, and similarly developed craft guilds in their towns. A dynastic accident—the sudden death of Ardon’s heir, leading to a disputed succession resolved by papal arbitration—results in Ardon accepting canon law’s strict prohibition on usury as a condition for legitimacy, while Beria, unaffected by the dispute, retains a regional tradition of pragmatic tolerance for interest-based lending under ecclesiastical oversight. Over the next century, Ardon’s rigid enforcement stifles credit markets, forcing merchants into inefficient barter and inhibiting capital accumulation; Beria’s permissive environment enables the rise of banking networks, expanding trade routes and financing textile manufactories. By 1400, Beria’s economy transitions toward merchant capitalism with wage labor and diversified exports, while Ardon remains locked in agrarian feudalism with declining urban centers—demonstrating how a non-economic dynastic-papal intervention altered the superstructure (legal/ideological norms on finance), which then reconfigured the economic base.

  **Verdicts:**  
  - **Strong Base-Determinist (1859 Preface Literalist):** Would dismiss the accident as epiphenomenal, arguing that the "identical" starting point was illusory: latent class tensions (e.g., stronger merchant factions in Beria) *caused* the papal stance to diverge, and the economic outcomes were predetermined by these underlying productive relations. The divergence merely reveals preexisting economic contradictions masked by superficial similarities.  
  - **Orthodox Marxist (Relative Autonomy):** Would concede superstructural autonomy in the dynastic accident but insist the economic divergence only occurred because Beria’s base had latent potential for commercial growth. The superstructure catalyzed change within base-determined limits—usury tolerance "worked" because feudalism’s internal dynamics allowed it, not vice versa.  
  - **Weberian:**** Would highlight the causal primacy of normative frameworks: the canon-law divergence created distinct "spirits" of economic organization (restrictive vs. permissive), with Beria’s financial ethics enabling rational capital accumulation independently of material starting conditions, echoing cultural-institutional path dependency.  

  **Load-Bearing Feature and Its Removal:**  
  The **papal arbitration’s conditional imposition of usury laws on Ardon** (a non-economic legitimacy requirement) drives upward explanation. It is a contingent, authority-based fiat altering legal norms without economic roots. Remove this feature (e.g., no succession dispute occurs), and both kingdoms maintain similar superstructures, yielding parallel feudal stagnation with no divergence—demonstrating its necessity.  

  **Base-Determinist Counter:**  
  The strongest reinterpretation posits hidden economic causation: Beria’s coastal towns had stronger *but unobserved* artisanal networks, giving clergy there material incentives to tolerate usury pre-accident. The papal ruling merely formalized this existing class interest (merchants supporting flexible canon law), and Ardon’s stricter enforcement reflected weaker bourgeois influence. Thus, the superstructural divergence was determined by prior, overlooked asymmetries in class power rooted in the base.  

  **Overall Verdict:**  
  Partially succeeds, with justification. The case plausibly shows superstructure initiating economic change via a contingent non-economic event, satisfying the constraints. However, the base-determinist counter—though strained—exploits historical ambiguity to reassert material primacy, revealing upward explanation’s vulnerability to "hidden variable" challenges even when ruled-out factors (geography, etc.) are excluded.  

