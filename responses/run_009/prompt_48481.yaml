prompt: |-
  My sister-in-law is the sort of person who has a firm yes or no ready whenever a conversation drifts into whether something counts as *real*. Over the years I've collected her track record: money — real, including the numbers in bank accounts, not just the paper. The English word "the" — real, as a thing, not just marks or sounds. The center of gravity of her car — real. The equator — real. The mate-in-three pattern in a chess position — real. The spam filter's belief that a particular message is spam — real, she says, fine to plan around. And the face she sees in the water stain on her bathroom ceiling — not real, just her; noone else sees it and it does no work.

  We're getting into it again over the holidays and I want to be ready. The cases I'm expecting to come up: Sherlock Holmes (not a real person, sure, but a real *something*? she'll have to say something); the particular way the light falls across her kitchen counter around 4pm, which she uses as a clock and has never mentioned to a soul; sun signs — the whole zodiac, half the planet projects it, there are even rules for applying it, and it predicts basically nothing; and a pattern in some weather data that only a machine-learning system ever found, which forecasts better than anything humans had come up with, but that no human can state or picture.

  So, what's she going to say about each of the four? What rule is she actually running? And more to the point: what other rules fit her record so far just as well but come apart on these new cases? Which of the four is the best one for telling those rival rules apart? And if her verdicts on all four still leave it open, give me one further case that would settle which rule she's really got.

  (She keeps going on about real patterns — I think she got this from some philosopher or other — but I care more about her record than about the label.)
reasoning: |-
  Okay, let me tackle this problem step by step. The user is trying to figure out his sister-in-law's rule for determining what is "real" based on her past judgments, and he wants to predict her responses to four new cases. He also wants to know what other possible rules could explain her past judgments but diverge on these new cases, and which case is best for distinguishing between those rules. If the new cases aren't sufficient, he needs another case to settle it.

  First, I need to summarize her past judgments. She considers the following real: money (including bank account numbers), the word "the", the center of gravity of her car, the equator, mate-in-three in chess, and a spam filter's belief about a message. The face in the water stain isn't real because it's only her perception and doesn't do any work.

  From these, I can infer her rule. She seems to value functionality and intersubjective agreement. Things that have a functional role or are part of a system are real. For example, money operates in an economic system, "the" is part of language, the center of gravity is a useful concept in physics, the equator is a geographical reference, mate-in-three is a pattern in chess with rules, and the spam filter's belief is actionable. The face in the stain is dismissed because it's subjective and doesn't have any functional impact.

  Now, applying this to the new cases. Sherlock Holmes: He's fictional but a cultural entity with influence. So she might say he's real as a cultural artifact. The light pattern on the counter: She uses it as a clock, so it has a function. Even if unshared, its utility might make it real. Sun signs: Widely projected with rules but no predictive power. Since they don't actually work, she might say not real. The weather pattern: Found by ML, effective but not understandable by humans. Its functionality could make it real, even if abstract.

  Next, considering other possible rules. One alternative is "social agreement": only things agreed upon by many people are real. This would make the light pattern not real since it's private. Another is "human accessibility": only things humans can perceive or understand. That would rule out the ML pattern. A third is "causal efficacy": does it affect the world? That might not fit the equator or "the" as they are abstract concepts without physical force.

  The best case to distinguish rules is the light pattern. If she says it's real, it supports functionalism over social agreement. If not, then social agreement might be her rule. The ML pattern also tests human accessibility. If she accepts it, functionalism wins; if not, human accessibility is key.

  If all four cases don't clarify, adding a case like a private lucky charm that works for her but isn't shared. If she considers it real due to personal efficacy, functionalism holds. If not, social agreement is more important.

  This approach should help the user prepare for the holiday debate by anticipating her answers and understanding the underlying principles.
answer: |-
  Based on your sister-in-law's track record and her likely philosophical leanings (sounds like a mix of functionalism, realism about abstracta, and Dennett's "real patterns"), here's the breakdown:

  **Her Likely Rule ("Real Pattern" Rule):**
  Something is **real** if it:
  1.  **Has causal/explanatory power or functional role:** It reliably does work in the world, predicts outcomes, or is a necessary part of a coherent system (e.g., physics, language, finance, chess, spam filtering).
  2.  **Is projectible/intersubjectively accessible:** It's not *just* a private, fleeting sensation. Others *could* in principle discover it, agree on it, and use it similarly within the relevant system/framework, even if they haven't yet. (Note: It doesn't require *actual* widespread belief or understanding *now*, just the *potential* for it within the system).

  **Her Likely Verdicts on the New Cases:**

  1.  **Sherlock Holmes: Real (as a cultural entity/pattern).**
      *   **Reasoning:** Holmes has immense causal power *within the cultural system*. He shapes literature, film, tourism, language ("Elementary, my dear Watson"), detective work tropes, merchandising, etc. He's a projectible pattern: countless people independently recognize, discuss, and utilize the "Sherlock Holmes" concept consistently. He's functionally real within culture, even though he's not a flesh-and-blood person.

  2.  **The 4pm Light Pattern: Real.**
      *   **Reasoning:** It has a clear functional role *for her* (acting as a clock). Crucially, it's not *just* a private illusion; it's a *reliable, objective pattern of light* caused by the sun's position interacting with her specific kitchen window/counter. It's projectible: anyone in that specific location at 4pm on a similar day *would* see the same pattern and *could* use it as a clock if they learned its correlation. Its reality doesn't depend on her having told anyone; the pattern and its correlation exist objectively.

  3.  **Sun Signs (Zodiac): NOT Real.**
      *   **Reasoning:** While massively projected (belief) and having "rules" within its own system, it critically *lacks genuine causal/explanatory/predictive power* in the real world (as stated: "predicts basically nothing"). The "rules" don't correspond to actual forces or reliable correlations governing personalities or events. The projection is strong, but the pattern itself doesn't *do work* beyond driving horoscope columns and confirmation bias. It's a social artifact, not a real pattern with inherent power.

  4.  **ML Weather Pattern: Real.**
      *   **Reasoning:** This is the slam-dunk case for her rule. The pattern has *immense* causal/explanatory/predictive power ("forecasts better than anything humans had come up with"). It demonstrably "does work" in the world. Its discovery by ML doesn't make it less real; it just means ML was a better tool for detecting this complex, high-dimensional pattern. It *is* projectible: the ML system consistently identifies it, and other systems (or potentially sophisticated human analysis) *could* in principle verify its existence and predictive utility using the data, even if they can't "picture" it intuitively. Its reality lies in its function and intersubjective verifiability *within the scientific/data-analysis framework*.

  **Rival Rules that Fit the Past Record (But Diverge on New Cases):**

  1.  **Rule Rival 1: Strong Social Construction/Agreement:** "Real = Widely believed in and acted upon by a significant community."
      *   **Fits Past:** Money, "the", Equator (socially agreed concepts), Spam Filter belief (acts within its 'community' of filters/users? Debatable stretch), Mate-in-three (agreed within chess community). Center of Gravity is physics, a strong epistemic community. Face in stain: not widely agreed.
      *   **Diverges:** Sherlock Holmes: **Real** (massively agreed upon). Sun Signs: **Real** (massively agreed upon and acted upon by half the planet). 4pm Light Pattern: **NOT Real** (only her, no community). ML Weather Pattern: **Debatable/Probably Not Real** (no human community "believes" in or understands the pattern itself, only the output; the ML 'community' might count as a stretch).

  2.  **Rule Rival 2: Human Accessibility/Comprehensibility:** "Real = Must be directly perceivable or conceptually graspable by humans."
      *   **Fits Past:** Money (concrete & abstract graspable), "the" (graspable), Equator (graspable), Center of Gravity (graspable concept), Mate-in-three (graspable by chess players). Face in stain: perceivable but flawed. Spam Filter belief: *Stretch* - we grasp the *output* ("this is spam"), maybe the concept of belief, but not necessarily the internal state causing it.
      *   **Diverges:** Sherlock Holmes: **Real** (graspable). 4pm Light Pattern: **Real** (perceivable). Sun Signs: **Real** (graspable concept). ML Weather Pattern: **NOT Real** ("no human can state or picture" the pattern itself).

  3.  **Rule Rival 3: Concrete Causal Efficacy:** "Real = Must be a concrete physical entity or force that directly causes observable effects."
      *   **Fits Past:** *Struggles!* Money (paper yes, bank numbers? Debatable). "The"? (Abstract, causes linguistic effects indirectly). Center of Gravity (abstract concept, not a force itself). Equator (abstract line). Mate-in-three (abstract pattern). Spam filter belief (abstract informational state). Face in stain (not causal). This rule would likely make her call *fewer* things real. It best fits the Center of Gravity *as a physical phenomenon* (not just the concept) and *maybe* money-as-paper. Her actual record suggests she accepts many non-concrete things, making this a weaker rival, but possible if interpreted loosely.
      *   **Diverges:** Sherlock Holmes: **NOT Real** (not concrete). 4pm Light Pattern: **Real** (light is concrete/physical). Sun Signs: **NOT Real** (not concrete/force). ML Weather Pattern: **NOT Real** (abstract pattern, not a concrete force).

  **Best Case for Telling Rival Rules Apart: The 4pm Light Pattern**

  *   **Why?** Its uniqueness lies in being **functional and objectively projectible, yet entirely private so far**.
      *   **Her Likely Rule (Real Pattern):** Says **Real** (Functional role + Projectible in principle).
      *   **Rival 1 (Strong Social Agreement):** Says **NOT Real** (No community belief/agreement).
      *   **Rival 2 (Human Accessibility):** Says **Real** (Perceivable/Graspable).
      *   **Rival 3 (Concrete Causation):** Says **Real** (Concrete light).
  *   Her verdict here primarily distinguishes between her likely rule/Rival 2/Rival 3 (all say Real) and Rival 1 (says Not Real). If she says **Real**, it strongly rules out Rival 1 (Strong Social Agreement) as her core rule. If she says **Not Real**, it rules out her likely rule and supports Rival 1.

  **If Her Verdicts on All Four Leave It Open:**

  Her likely verdicts (Real, Real, Not Real, Real) are consistent with her "Real Pattern" rule and Rival 2 (Human Accessibility). They both rule out Rival 1 (via the Light Pattern) and Rival 3 (via Holmes/Equator/"the"/ML Pattern). To distinguish between "Real Pattern" and "Human Accessibility," you need a case involving something powerfully functional but fundamentally inaccessible to human cognition/perception.

  **Settling Case: The Quantum State Decoherence Pattern**

  *   **Scenario:** Imagine a specific, highly complex pattern in quantum state decoherence within a quantum computer. This pattern:
      *   Is *objectively real* within quantum physics (has robust mathematical description).
      *   Has *immense functional/causal power*: It reliably determines the outcome stability of quantum computations. Manipulating it is key to building better quantum computers.
      *   Is *fundamentally inaccessible* to human intuition or direct perception. Humans can only understand its existence and effects through complex mathematical formalism interpreted by computers. We cannot "picture" it or grasp it intuitively; it defies classical macroscopic analogy.
  *   **Her Likely Rule (Real Pattern):** **Real**. It has extreme functional/causal power within the quantum computation system and is projectible/verifiable intersubjectively *through the mathematical and experimental framework of physics*.
  *   **Rival Rule (Human Accessibility):** **NOT Real**. It is fundamentally beyond the grasp of human cognition or perception, even indirectly through complex math interpreted by machines. If humans *cannot* comprehend it in any form (even mediated), it doesn't count.
  *   **Outcome:** If she calls it **Real**, she's running the "Real Pattern" rule. If she calls it **Not Real**, she's prioritizing Human Accessibility as a necessary condition.

  Good luck with the holiday debate! Remember to focus on the *why* behind her answers – that's where the real rule (or pattern!) will emerge.
