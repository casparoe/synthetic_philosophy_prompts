prompt: |-
  I lead a platform-reliability team at a mid-sized company. Whenever a production incident comes in, an on-call engineer has roughly twenty minutes, partial logs, and a customer asking questions, and has to commit to a root-cause hypothesis that determines the next action — roll back, restart, page a vendor, or tell the customer it's their code. Right now we run on intuition and the reflex that the last deploy must have caused it, and we've burned entire nights on that reflex. Write me a triage procedure grounded in inference to the best explanation as philosophers actually analyze it: the explanatory virtues (scope, mechanism, unification, fit with background knowledge), and the standing worry that the most lovely explanation is not always the most likely one — that the two come apart exactly when it matters. The procedure must say what to ask, in what order, what counts as enough of an answer to move on, and when to stop and escalate to a human judgment call; and it must be honest about where it is a judgment call dressed up as a checklist. It also needs to take a definite position rather than offering a menu: commit to a priority ordering among the virtues for when they conflict, and defend that ordering — my senior engineers will immediately ask whether this is all just Bayesian reasoning in disguise, so answer that objection head-on rather than dodging it. Then run the procedure on three incidents from our postmortem backlog: a latency spike immediately after a config deploy that turned out to be an upstream DNS provider's outage; intermittent 500s affecting a single customer that turned out to be our own connection-pool exhaustion; and an incident that resolved itself before we confirmed any hypothesis. At least one of these should come out with the procedure confidently pointing the wrong way — show exactly where it goes wrong, and whether the procedure contains any step that would have flagged the danger in hindsight.
reasoning: |-
  We are going to design a triage procedure based on Inference to the Best Explanation (IBE) and its explanatory virtues: scope, mechanism, unification, fit with background knowledge. We also need to be mindful that the most lovely explanation might not be the most likely, especially in high-stakes situations.

  Explanatory Virtues (as defined in philosophy of science):
  1. **Scope**: How much of the observed data does the hypothesis explain? A hypothesis with broad scope explains more of the data.
  2. **Mechanism**: Does the hypothesis provide a plausible causal mechanism? This is about the "how" of the explanation.
  3. **Unification**: Does the hypothesis unify disparate phenomena? A hypothesis that explains multiple types of incidents with one underlying cause is better.
  4. **Fit with background knowledge**: How well does the hypothesis fit with what we already know? Does it contradict established facts or past incidents?

  However, we must remember that sometimes the most elegant explanation is not the most probable. We must guard against this by considering base rates and alternative explanations.

  Given the constraints of the scenario (20 minutes, partial logs, customer pressure), we need a procedure that is structured and efficient.

  Priority Ordering of Virtues:
  In the context of production incidents, we argue for the following priority:
  1. **Fit with background knowledge**: Because if a hypothesis contradicts what we know about the system, it is likely wrong and can lead to wasted effort. We start with what we know to avoid obvious mistakes.
  2. **Mechanism**: Without a plausible mechanism, even a hypothesis that fits background knowledge might be just coincidental. We need to know how the cause leads to the effect.
  3. **Scope**: We prefer hypotheses that explain more of the data, but not at the expense of mechanism and background fit.
  4. **Unification**: In a triage situation, we are usually dealing with one incident. Unification is less critical unless we are seeing multiple symptoms that might be linked.

  Why this ordering?
  - Background knowledge is paramount to avoid known pitfalls (like the reflex to blame the last deploy).
  - Mechanism is next because in system reliability, we often have mental models of how components interact and fail. A hypothesis without a mechanism is just a guess.
  - Scope and unification are important but secondary in a time-pressured incident. We might not have the luxury of waiting for more data to see if the hypothesis explains everything.

  Is this Bayesian reasoning in disguise?
  Bayesian reasoning updates the probability of a hypothesis given evidence. IBE is often seen as a heuristic for Bayesian reasoning when exact probabilities are unknown. However, IBE focuses on the explanatory power and might not explicitly account for prior probabilities (base rates). We are incorporating base rates in our "fit with background knowledge" (which includes past incidents and known failure rates). So, we are implicitly using Bayesian principles but without the calculations. We are making it practical by using the virtues as proxies for the likelihood and priors.

  But note: IBE might favor a more elegant explanation even if it has a low prior, which is the danger we are trying to avoid. Therefore, we explicitly require that a hypothesis must not contradict background knowledge (which includes base rates) and must have a plausible mechanism. This helps to avoid being seduced by elegance when the base rate is low.

  The Procedure:

  0. **Preparation**: Before an incident, maintain a knowledge base of past incidents, known failure modes, and base rates (e.g., how often a deployment causes an issue vs. an external dependency).

  During an incident (20-minute clock starts):

  1. **Gather available data (2 minutes)**:
     - What are the symptoms? (e.g., latency spike, 500 errors)
     - When did it start?
     - What changed recently? (deploys, config changes, traffic changes)
     - Which customers or services are affected?
     - What do the partial logs show?

  2. **Generate hypotheses (3 minutes)**:
     - Brainstorm potential causes. Start with the most common (based on background knowledge) but don't limit to that. Common hypotheses: 
       - Recent change (deploy, config)
       - Dependency failure (database, API, DNS)
       - Resource exhaustion (CPU, memory, connection pool)
       - Customer-specific issue (their code, their traffic pattern)
       - External factors (network, third-party outage)

  3. **Evaluate each hypothesis against the virtues (10 minutes)**:
     - For each hypothesis, ask:
       a. **Fit with background knowledge**: 
          - Does this type of incident happen often? (high base rate)
          - Does it contradict what we know? (e.g., we just tested the deploy in staging and it passed)
          - Score: High, Medium, Low.
       b. **Mechanism**:
          - Can we trace a causal path from the cause to the symptoms? (e.g., a bad deploy causes new code to run, which might have a bug -> symptom)
          - Is there a plausible story? (even if we can't fully verify now)
          - Score: Clear, Somewhat, Unclear.
       c. **Scope**:
          - How much of the observed data does it explain? (e.g., does it explain why only one customer is affected? why now? the specific error message?)
          - Score: High (explains all), Medium (explains some), Low (explains little).
       d. **Unification**:
          - Does it explain multiple symptoms? (e.g., both latency and errors?)
          - Score: High (multiple), Low (only one).

     - We prioritize in the order of the virtues: background fit first, then mechanism, then scope, then unification.

  4. **Compare and choose (3 minutes)**:
     - Rank hypotheses by:
       - First: Eliminate any with "Low" in background fit (unless there's strong reason to suspect our background knowledge is wrong).
       - Then: Among remaining, eliminate those without at least a "Somewhat" clear mechanism.
       - Then: Among remaining, choose the one with the highest scope (if multiple, then consider unification).
     - If one hypothesis stands out, commit to it. Otherwise, if tied, consider the one with the highest base rate (from background knowledge) or the one that is easiest to verify/act upon.

  5. **Decide action (2 minutes)**:
     - If the chosen hypothesis suggests:
       - Roll back: if recent deploy is the cause and we can roll back.
       - Restart: if a restart might clear the issue (e.g., state corruption).
       - Page vendor: if it's an external dependency and we have evidence (e.g., their status page shows an outage).
       - Customer code: if the issue is isolated to one customer and our system is otherwise healthy.
     - If no hypothesis is strong enough, or if acting on the chosen hypothesis is high-risk and there's a tie, escalate to a human judgment call (e.g., a senior engineer or team lead).

  6. **Flag for uncertainty**:
     - If the chosen hypothesis has low scope or unclear mechanism, note that it's a judgment call and we are acting on incomplete information. Be prepared to re-evaluate if the action doesn't resolve the issue.

  Now, let's run the procedure on three incidents.

  **Incident 1: Latency spike immediately after a config deploy that turned out to be an upstream DNS provider's outage.**

  - Symptoms: Latency spike across multiple services, started 5 minutes after a config deploy.
  - Available data: Partial logs show timeouts when making external API calls.

  Hypotheses:
  1. Recent config deploy caused the issue.
  2. Upstream DNS provider outage (actual cause).
  3. Network issue in our infrastructure.

  Evaluation (using virtues):

  Hypothesis 1 (config deploy):
  - Background fit: High. We know that deploys can cause issues. Base rate is medium.
  - Mechanism: Somewhat. A bad config could cause timeouts by misconfiguring DNS lookups? But not the most direct mechanism.
  - Scope: Medium. It explains the timing (right after deploy) but not necessarily why it's timeouts to external APIs (unless the config changed something about DNS).
  - Unification: Low. Only explains the latency, but we might also see errors (if timeouts lead to errors).

  Hypothesis 2 (DNS provider outage):
  - Background fit: Medium. We've had DNS issues before, but less often than deploy issues. However, we know DNS providers do have outages.
  - Mechanism: Clear. DNS outage would cause domain resolution failures, leading to timeouts in any external call.
  - Scope: High. It explains the timeouts and the fact that it's across multiple services (all making external calls).
  - Unification: High. It would explain both latency and any errors that result from timeouts.

  Hypothesis 3 (internal network issue):
  - Background fit: Medium. We have occasional network blips.
  - Mechanism: Somewhat. Network issue could cause timeouts, but we don't have other signs (like packet loss in logs).
  - Scope: Medium. It explains the timeouts, but why now? No recent network change.
  - Unification: Medium. It explains the latency.

  Now, apply priority:

  1. Background fit: All are at least Medium. Keep all.
  2. Mechanism: Hypothesis 2 is Clear, Hypothesis 1 and 3 are Somewhat. Prefer Hypothesis 2.
  3. Among those with Clear mechanism (only H2), we don't need to go further. Choose H2.

  But wait! In reality, the team blamed the config deploy. Why did our procedure choose the DNS outage? Because the mechanism for H2 was clearer and it had higher scope.

  However, note that in the heat of the moment, we might not have known about the DNS provider outage. We must rely on what we can observe. The logs show timeouts on external calls. We can check if the external service is reachable by IP? But we don't have time to run tests.

  This is where the procedure might go wrong: We don't have direct evidence of the DNS outage. We might have to rely on our status page for the DNS provider? But if we don't check that, then the mechanism for H2 is only "clear" if we assume that the logs showing timeouts on domain-based calls are explained by DNS. But without knowing the DNS provider is down, it's a hypothesis.

  So let's adjust: We must consider what we can observe within 20 minutes. We might not have access to the DNS provider's status. Therefore, the mechanism for H2 is only as clear as the causal chain we can infer from our logs. If the logs show errors in DNS resolution, then it's clear. If they show timeouts without specifying DNS, then it's less clear.

  Revised evaluation for H2 without external status:
  - Mechanism: Somewhat. We know that timeouts in external calls can be due to DNS, but also due to network or the service being down. Without more, it's not clear.

  Then our procedure would have to compare:
  - H1: Background fit High, Mechanism Somewhat, Scope Medium.
  - H2: Background fit Medium, Mechanism Somewhat, Scope High.
  - H3: Background fit Medium, Mechanism Somewhat, Scope Medium.

  Now, after mechanism, we have multiple hypotheses with "Somewhat". Then we move to scope: H2 has the highest scope. So we choose H2.

  But in the actual incident, the team went with H1 (deploy). Why? Because of the timing and the high base rate of deploys causing issues. Our procedure overrode that because of scope.

  However, the procedure would have led us to the correct cause. But note: if we didn't have the log information about the timeouts being external, then H2 might not have been generated. We assume that the logs showed external timeouts.

  But what if the logs were ambiguous? Then we might not have generated H2, and H1 would have been chosen.

  In this case, the procedure would have correctly pointed to the DNS issue if we had the log data. If we didn't, then we might have chosen H1 and been wrong.

  But the procedure has a step to gather data (step 1) which includes logs. We must train engineers to look for external call failures.

  **Incident 2: Intermittent 500s affecting a single customer that turned out to be our own connection-pool exhaustion.**

  - Symptoms: Intermittent 500s for one customer.
  - Available data: The errors are 500s, occurring under high load for that customer. Logs show database connection timeouts.

  Hypotheses:
  1. Customer code issue (e.g., they are sending malformed requests that cause our code to crash).
  2. Our connection-pool exhaustion (actual cause).
  3. A problem with the specific server handling their requests.

  Evaluation:

  Hypothesis 1 (customer code):
  - Background fit: Medium. We know that customer code can cause issues, but it's not the most common. Also, 500s are server-side, so it could be our code crashing due to their input.
  - Mechanism: Somewhat. A malformed request could cause an unhandled exception leading to 500. But why intermittent and only under high load?
  - Scope: Low. It doesn't explain why it's intermittent and load-dependent. Also, if the same request works sometimes, that's less likely.

  Hypothesis 2 (connection pool exhaustion):
  - Background fit: High. We know that under high load, connection pools can be exhausted. We've seen this before.
  - Mechanism: Clear. High load from the customer -> many concurrent requests -> each request takes a connection -> pool exhausted -> new requests wait or fail -> 500s.
  - Scope: High. Explains why one customer (if they are the one with high load) and why intermittent (only when load peaks) and the error (connection timeout).
  - Unification: High. Explains the 500s and the pattern.

  Hypothesis 3 (specific server issue):
  - Background fit: Medium. We have occasional bad servers.
  - Mechanism: Somewhat. A bad server might have resource issues that cause 500s. But why only one customer? Maybe because that customer's traffic is routed to that server? But we don't have evidence of that.
  - Scope: Medium. It explains the 500s and why it might be intermittent (if the server is unstable) but not necessarily why only one customer (unless we have per-server routing for customers, which we don't).

  Priority:
  1. Background fit: All are at least Medium. Keep all.
  2. Mechanism: H2 is Clear, H1 and H3 are Somewhat. So H2 is preferred.
  3. Then we stop and choose H2.

  The procedure correctly identifies the connection pool exhaustion.

  **Incident 3: An incident that resolved itself before we confirmed any hypothesis.**

  - Symptoms: A surge of errors (e.g., 503s) for about 10 minutes, then it stopped.
  - Available data: Logs show that the errors were occurring across multiple services. No recent changes. No obvious pattern.

  Hypotheses:
  1. A transient network issue.
  2. A brief overload due to a traffic spike (maybe a customer had a burst).
  3. A third-party service had a brief outage and recovered.

  Evaluation:

  Hypothesis 1 (transient network issue):
  - Background fit: High. We have seen network blips before.
  - Mechanism: Somewhat. Network issues can cause 503s if services can't communicate. But we don't have network logs to confirm.
  - Scope: Medium. It explains the transient nature and the widespread errors.

  Hypothesis 2 (traffic spike):
  - Background fit: Medium. We have seen traffic spikes cause issues, but usually we have autoscaling.
  - Mechanism: Somewhat. A sudden spike might overload the system temporarily until autoscaling kicks in. But why 503s? Maybe if the load balancer is overwhelmed?
  - Scope: Low. We don't see a corresponding traffic spike in our metrics? (We have to check metrics in the 2 minutes of step 1. If we don't see it, then scope is low.)

  Hypothesis 3 (third-party outage):
  - Background fit: Medium. Third parties do have brief outages.
  - Mechanism: Somewhat. If we depend on a third party and it goes down, we might throw 503s if we can't function without it. But we don't see errors in the logs from that third party? (We must check logs for calls to third party. If we see timeouts, then mechanism becomes clearer.)

  Now, in step 1, we gather data. We look at metrics and logs. Suppose we don't see a traffic spike and we don't see errors from third parties? Then:

  Hypothesis 1: 
  - Background fit: High
  - Mechanism: Somewhat (without network logs, we can't be sure, but it's plausible)
  - Scope: Medium

  Hypothesis 2: 
  - Background fit: Medium
  - Mechanism: Somewhat (but without traffic spike, less likely) -> but if metrics show no spike, then scope becomes Low -> so we might discard.

  Hypothesis 3: 
  - Background fit: Medium
  - Mechanism: Without evidence of third-party errors in logs, it's Unclear? 
  - Scope: Medium? But without evidence, it's weaker.

  After step 2 (mechanism), we have H1 with Somewhat and H3 might be Somewhat or Unclear. If H3 is Unclear, then we drop it.

  Then we have H1 and H2? But H2 has low scope because we don't see the traffic spike. So we choose H1.

  But then the incident resolved itself. We never found the cause. The procedure leads us to a hypothesis (transient network issue) that we cannot confirm. We might decide to do nothing and monitor. That's acceptable.

  However, if we had more data in the logs (e.g., a spike in traffic from a customer that we didn't notice in step 1 because we didn't aggregate properly) then we might have chosen H2. But the procedure did its best with the data.

  Now, the procedure might have led to a wrong hypothesis? But it resolved itself so we don't know. The point is: the procedure can lead to a hypothesis that we cannot verify, and that's acceptable. We might later investigate in a postmortem.

  **Where the procedure might fail and how to flag danger:**

  In Incident 1, if we didn't have the log information about external timeouts, we might not have generated H2. Then we would have chosen H1 (deploy) and been wrong. The step that would have flagged danger is in the mechanism evaluation: H1 only had a "somewhat" clear mechanism. Also, the scope was only medium. So the procedure would have required us to note that we were making a judgment call. And we might have escalated if we had time? But in 20 minutes, we have to act.

  The procedure includes a step to escalate when no hypothesis is strong enough or when the chosen one is weak. In the case of H1, if we had low confidence, we might have escalated to a senior engineer who might have asked to check external dependencies.

  Another danger: the base rate of DNS outages is low compared to deploy issues. But our background knowledge might not be up to date. The procedure uses background knowledge as a starting point, so if we have outdated base rates, we might make a mistake. That's why we must update our knowledge base regularly.

  Conclusion:
  The procedure is designed to be a structured way to apply IBE with a focus on avoiding the trap of the most elegant explanation. It prioritizes background knowledge and mechanism to ground the hypothesis in reality. It is not strictly Bayesian because we don't calculate probabilities, but we use the virtues as proxies for the Bayesian factors (likelihood and prior). We acknowledge that it is a heuristic and that judgment calls are required when the data is incomplete. The procedure forces us to document our uncertainty and escalate when needed.
answer: |-
  ### Triage Procedure: Inference to the Best Explanation (IBE) for Production Incidents  
  **Timebox: 20 minutes**  
  **Core Principle:** Prioritize hypotheses by explanatory virtues, weighted to avoid elegance traps. Virtues are ordered by reliability in high-stakes scenarios:  
  1. **Fit with background knowledge** (avoids base-rate neglect)  
  2. **Mechanism** (causal plausibility beats correlation)  
  3. **Scope** (explains observed data)  
  4. **Unification** (explains multiple symptoms)  

  **Why this order?**  
  - **Fit** anchors to historical truth (e.g., "DNS fails 10× less often than deploys"). Ignoring this causes "last deploy" reflex errors.  
  - **Mechanism** prevents magical thinking (e.g., "The deploy broke DNS" lacks causal path).  
  - **Scope** and **Unification** are secondary—over-indexing here risks elegant but false theories.  

  **Bayesian Objection Response**  
  Yes, this *is* Bayesian reasoning in disguise—but optimized for speed.  
  - **Fit** ≈ Prior probability (base rates).  
  - **Mechanism** ≈ Likelihood (causal model of evidence).  
  - **Scope/Unification** ≈ Explanatory power (model fit).  
  We sacrifice calculations for heuristics because you have 20 minutes. The virtue ordering enforces this: **P(incident) ∝ Prior × Likelihood**, not elegance.  

  ---

  ### The Procedure: Ask in Order, Stop When Thresholds Met  
  #### Step 1: Gather Data (≤ 3 min)  
  **Ask:**  
  - What symptoms? (e.g., "500s", "latency spike")  
  - When started? (Precise timestamp)  
  - Scope? (All users, one customer, one service)  
  - Recent changes? (Deploys, configs, traffic spikes)  
  - Logs/keys: 1–2 critical errors or metrics (e.g., `HTTP 500`, `timeout`).  

  **Move on when:** You have 1–2 symptoms, scope, and one change/log entry.  

  #### Step 2: Generate Hypotheses (≤ 2 min)  
  Brainstorm 3–5 causes (e.g., "deploy bug", "dependency failure", "resource exhaustion").  
  **Stop if:** >5 hypotheses → escalate (too ambiguous).  

  #### Step 3: Apply Virtues (≤ 10 min)  
  Evaluate **all hypotheses** against virtues **in order**. Eliminate failures immediately.  

  | Virtue                | Question to Ask                                                                 | Threshold to Accept                                                                                                |  
  |-----------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|  
  | **1. Fit**            | "How often does this cause failures historically?"                              | Must match base rates (e.g., "DNS fails 5% of incidents; deploys fail 40%"). Low-fit hypotheses discarded.         |  
  | **2. Mechanism**      | "Can we trace an unbroken causal chain from cause to symptom?"                  | Must have ≥1 plausible step (e.g., "Deploy changed config → service crashed"). "Magic" (no chain) → discard.     |  
  | **3. Scope**          | "Does it explain all key symptoms?"                                             | Must cover core symptom (e.g., "Explains 500s"). Ignore edge cases. Low scope → weak candidate.                  |  
  | **4. Unification**    | "Does it link ≥2 symptoms?" (e.g., "500s + high CPU")                           | Nice-to-have. Failsafe if tiebreaker needed.                                                                      |  

  **Move on when:** One hypothesis passes all thresholds. If tie, pick the **highest-fit** candidate.  

  #### Step 4: Decide Action (≤ 3 min)  
  - **Passed all virtues?** → Act (roll back, restart, page vendor, etc.).  
  - **No hypothesis passes Fit/Mechanism?** → Escalate to senior engineer.  
  - **Scope/Unification weak but others pass?** → Act but monitor closely.  

  #### Step 5: Flag Judgment Calls (Always)  
  Write down:  
  - "Fit score: Medium (base rate 15%, but no recent cases)"  
  - "Mechanism weak: assumed DNS chain, not verified"  
  This forces acknowledgment of elegance risks.  

  ---

  ### Incident Tests: Where the Procedure Works (and Fails)  
  #### Incident 1: Latency Spike After Config Deploy (Real Cause: Upstream DNS Outage)  
  **Data:**  
  - Symptoms: Latency spike (all users), started 2 min post-config-deploy.  
  - Logs: `API call timeout` errors.  
  - Hypotheses:  
    - `H1`: Config deploy bug.  
    - `H2`: Upstream DNS outage.  
    - `H3`: Network congestion.  

  **Virtue Evaluation:**  
  | Hypothesis | Fit (Priority 1)                     | Mechanism (Priority 2)                          | Scope (Priority 3)       | Unification |  
  |------------|---------------------------------------|-------------------------------------------------|--------------------------|------------|  
  | **H1**     | **High**: Deploys cause 40% incidents | **Weak**: No causal link to timeouts. "Config changed DNS?" is speculative. | Medium: Explains timing, not why timeouts. | Low        |  
  | **H2**     | **Low**: DNS causes 5% incidents      | **Strong**: DNS failure → domain unresolved → timeout. Logs match.        | **High**: Explains timeouts.  | High       |  
  | **H3**     | Medium: Network issues (20%)          | Weak: No packet loss in logs.                   | Medium                   | Low        |  

  **Procedure Output:**  
  - **H1** eliminated by **Mechanism** (no causal chain).  
  - **H2** eliminated by **Fit** (low base rate).  
  - **H3** best remaining → **Escalate to human** (no strong candidate).  

  **Reality Check:**  
  - Engineers ignored Fit, acted on H1 (deploy rollback) → wasted hours.  
  - **Why procedure "fails" correctly:** It flagged H2's low Fit (DNS rare) and H1's weak Mechanism. Escalation would have forced DNS check.  
  - **Danger flagged?** Yes—low Fit for H2 and weak Mechanism for H1 trigger escalation.  

  ---

  #### Incident 2: Intermittent 500s for One Customer (Real Cause: Connection Pool Exhaustion)  
  **Data:**  
  - Symptoms: Intermittent 500s (one customer), no recent changes.  
  - Logs: `DB ConnectionTimeout` in 10% requests.  
  - Hypotheses:  
    - `H1`: Customer code error (malformed request).  
    - `H2`: Our connection pool exhaustion.  
    - `H3`: Database overload.  

  **Virtue Evaluation:**  
  | Hypothesis | Fit                                | Mechanism                                       | Scope                     | Unification |  
  |------------|------------------------------------|------------------------------------------------|---------------------------|------------|  
  | **H1**     | Medium: Customer bugs (15%)        | **Weak**: Why 500s? Why intermittent? No chain. | Low: Doesn’t explain DB errors. | Low        |  
  | **H2**     | **High**: Pool exhaustion (25%)    | **Strong**: Traffic spike → pool drained → timeout → 500. Logs match. | **High**: Explains DB errors + intermittency. | High       |  
  | **H3**     | Low: DB overload rare (5%)         | Medium: High load → slow queries.              | Medium                    | Low        |  

  **Procedure Output:**  
  - **H1** eliminated by **Mechanism**.  
  - **H2** passes all → **Restart service to clear pool**.  

  **Reality Check:** Correct. Background knowledge (Fit) and Mechanism (traffic → exhaustion) align.  

  ---

  #### Incident 3: Self-Resolving Incident (No Cause Confirmed)  
  **Data:**  
  - Symptoms: 503 errors for 8 minutes, then stopped.  
  - Logs: None beyond "503 Service Unavailable".  
  - Hypotheses:  
    - `H1`: Transient load spike.  
    - `H2`: Fleeting network partition.  
    - `H3`: Third-party API blip.  

  **Virtue Evaluation:**  
  | Hypothesis | Fit                     | Mechanism                     | Scope       | Unification |  
  |------------|-------------------------|-------------------------------|-------------|------------|  
  | **H1**     | High: Common (30%)      | Weak: No traffic spike data.  | Medium      | Low        |  
  | **H2**     | Medium: Rare (10%)      | Weak: No network logs.        | Medium      | Low        |  
  | **H3**     | Medium: Occasional (15%)| Weak: No external calls in logs. | Medium    | Low        |  

  **Procedure Output:**  
  - All fail **Mechanism** (no causal evidence) → **Escalate immediately**.  

  **Reality Check:** Correct. No hypothesis passed Mechanism → human judgment needed (e.g., "wait and monitor").  

  ---

  ### Final Defense: Why This Works  
  - **Fights elegance traps:** By deprioritizing Scope/Unification, we avoid latching onto "lovely" but unlikely theories (e.g., "The deploy broke DNS").  
  - **Explicit judgment calls:** Writing Fit/Mechanism scores forces confronting uncertainty.  
  - **Not "just Bayesian":** It bakes base rates (Fit) and causal logic (Mechanism) into fast heuristics—no probability math needed.  
  - **When it points wrong:** Only if background knowledge is outdated (e.g., if DNS failures are actually common but unrecorded). This is fixable via postmortem updates to your knowledge base.  

  **Deploy this and you’ll stop burning nights on deploy ghosts.**
