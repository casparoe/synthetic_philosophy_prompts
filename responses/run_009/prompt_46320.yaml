prompt: |-
  Got into an argument at a dinner party last week and it's still bugging me. A friend of mine who's really into pop philosophy was explaining Susan Wolf's "Moral Saints" paper (1982, I looked that up) and here's more or less how he summed it up: Wolf argues that being as morally good as possible is actually a bad thing — that if you devoted your whole life to helping others you'd turn into this humorless, one-dimensional person with no hobbies and no personality of your own, so morality is just one value among many and trying to maximize it makes your life worse. And he said the argument only really works against the calculating kind of saint, the person who coldly figures out each morning how to do the most good, since obviously someone who just naturally and warmly loves everybody wouldn't be unattractive at all. Then he wrapped up by saying the paper is basically a license for a bit of selfishness — Wolf is telling us we're allowed to stop trying so hard and should stop feeling guilty about it — and anyway it's been empirically refuted since positive psychology apparently shows that kind, moral people are actually happier than everyone else, so there's no tradeoff to begin with.

  Something about this felt off to me but I couldn't put my finger on where, and I'm not going to read the actual paper just to win an argument. Can you go through his version piece by piece and tell me which parts Wolf herself would recognize as accurate, which are distortions, and whether his "so it's fine to be a bit selfish" conclusion follows from whatever accurate parts remain? I vaguely remember hearing that the paper turns on some distinction between what morality demands of us and what makes a life good *for the person living it*, but I might be misremembering or muddling it with something else. I'm less interested in who "won" the dinner party than in actually understanding what the claim is supposed to be.
