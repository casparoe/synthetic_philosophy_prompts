  Okay, the user's query revolves around a dinner party argument about Susan Wolf's "Moral Saints" paper. Let me start by recalling the key points of Wolf's argument. She distinguishes between a moral saint and a person leading a well-rounded, good life. The user's friend summarized it as saying that being maximally moral makes you humorless and one-dimensional, and that it's a license for selfishness. But I need to verify how accurate that is.

  First, Wolf's main point is about the distinction between a morally perfect life and a subjectively good life. She argues that maximizing morality might lead to a life lacking in personal interests and passions, which are essential for a fulfilling life. The friend mentioned that this only applies to "calculating" saints, but Wolf actually includes both types—those who are naturally loving and those who are rationally calculating. Both types would sacrifice personal interests for moral reasons, leading to a lack of well-roundedness.

  The user's friend claimed that positive psychology refutes Wolf by showing that kind people are happier. But Wolf's argument isn't about happiness; it's about the richness of a life. Even if moral people are happier, they might still miss out on non-moral values like art or intellectual pursuits. So the friend's rebuttal misses the core philosophical point about value pluralism.

  Another distortion is the "license for selfishness" conclusion. Wolf isn't advocating for selfishness but suggesting that non-moral values are legitimate. She emphasizes balance, not abandoning morality. The user might be concerned that the friend's interpretation justifies laziness in moral efforts, which isn't Wolf's intent.

  The user also mentioned the distinction between what morality demands and what makes a life good for the person. That's accurate. The friend's summary oversimplifies by reducing it to a happiness trade-off, ignoring the broader concept of a meaningful life beyond just morality or happiness.

  The user's deeper need might be to resolve their unease about the friend's interpretation, seeking clarity on Wolf's actual arguments to feel confident in their understanding. They might also want to reconcile the idea that one can be moral without being a saint, alleviating personal guilt about not being maximally moral. Addressing the nuances in Wolf's paper helps them grasp that balance is key, and that it's not about selfishness but integrating multiple values into a good life.
answer: |-
  You're absolutely right to feel something was "off" – your friend captured the *spirit* but significantly distorted the nuance and core argument of Wolf's paper. His summary contains elements of truth but layers on misinterpretations and conclusions Wolf explicitly rejects. Let's break it down piece-by-piece:

  1.  **"Wolf argues that being as morally good as possible is actually a bad thing"**
      *   **Accuracy:** Partial, but misleadingly simplistic.
      *   **Wolf's Actual Point:** Wolf argues that *maximizing* moral goodness, making it the *overriding and dominant* value in *every* life choice to the *exclusion* of other significant values, would lead to a life that is **deficient as a *good life* or *attractive life*** *for the person living it*. She distinguishes between a "Moral Saint" (someone who *maximizes* moral value) and a "Good Life" (which incorporates moral value but also other non-moral values like beauty, knowledge, personal projects, relationships, hobbies, etc.).
      *   **Distortion:** Wolf isn't saying morality itself is "bad." She's saying that *maximizing* it to the *exclusion* of other valuable things makes the *overall life* less good, less rich, and less appealing *to us* – including potentially to the saint themselves, though their perspective isn't her main focus. She's critiquing an *ideal*, not morality per se.

  2.  **"...if you devoted your whole life to helping others you'd turn into this humorless, one-dimensional person with no hobbies and no personality of your own..."**
      *   **Accuracy:** This captures the *potential consequence* Wolf describes for the "Moral Saint" – the risk of becoming narrow, lacking diverse interests, passions, talents, and the richness that makes a person interesting or fulfilled beyond their moral contributions.
      *   **Distortion:** Wolf doesn't frame this as an *inevitable* outcome for *anyone* who helps others a lot. She's describing the logical endpoint of *maximizing* moral value *above all else*. Many deeply moral people *do* have rich personalities and hobbies; they just don't sacrifice *all* non-moral pursuits *all* the time for marginal moral gains. Her point is that the *maximizing saint* would feel compelled to do so.

  3.  **"...morality is just one value among many..."**
      *   **Accuracy:** **This is the absolute core of Wolf's argument.** She is a proponent of **value pluralism**. Morality is a crucial value, but it isn't the *only* value that makes a human life good and meaningful. Aesthetics, intellectual pursuits, personal relationships (beyond duty), hobbies, passions, personal style, humor, even harmless eccentricities – these have non-moral value that contributes to a well-lived life. A life dominated *only* by moral value is impoverished in these other dimensions.
      *   **Distortion:** None here. This is central.

  4.  **"...trying to maximize it makes your life worse."**
      *   **Accuracy:** Based on her value pluralism, yes, Wolf argues that maximizing moral value *makes your life worse* **in terms of being a well-rounded, attractive, and personally rich life.** It doesn't necessarily make it worse in terms of *moral worth* (the saint is morally excellent), but it makes it deficient in other valuable aspects of human flourishing.
      *   **Distortion:** "Worse" needs the qualifier: worse *as a comprehensively good life*, not necessarily worse morally or even subjectively (though she touches on that).

  5.  **"...the argument only really works against the calculating kind of saint..."**
      *   **Accuracy:** Wolf does distinguish between two types of saints: the "Loving Saint" (driven by overwhelming love/compassion) and the "Rational Saint" (driven by duty/rational calculation). She acknowledges the Loving Saint is more psychologically plausible and less "repulsive."
      *   **Distortion:** **This is a major misinterpretation.** Wolf explicitly argues that **even the Loving Saint's life is deficient** from the perspective of a well-rounded, attractive life. While the Loving Saint might be warm and happy *doing* good, they would still lack non-moral interests, passions, and pursuits *because* their love would crowd them out. They wouldn't develop talents unrelated to helping, wouldn't pursue knowledge for its own sake if it didn't help others, wouldn't cultivate humor simply for joy, etc. Their life, while morally exemplary and perhaps subjectively satisfying *to them*, would still lack the *plurality of values* that make a human life rich and admirable *in its fullness*.

  6.  **"...Wolf is telling us we're allowed to stop trying so hard and should stop feeling guilty about it..." & "...it's a license for a bit of selfishness..."**
      *   **Accuracy:** Wolf *does* argue we shouldn't feel obligated to *maximize* moral value in every aspect of our lives. We are justified in pursuing non-moral goods for their own sake.
      *   **Distortion:** **This is a dangerous oversimplification and misrepresentation of her conclusion.**
          *   **Not "Selfishness":** Wolf is *not* endorsing selfishness, neglect of duty, or indifference to others. She is arguing for the **legitimacy of non-moral values**. Pursuing your passion for music, spending time deepening a friendship for mutual enjoyment, reading a novel purely for pleasure, perfecting a soufflé – these are not inherently selfish acts; they are expressions of other valuable aspects of life. They become problematic only if they involve *violating* moral constraints (e.g., stealing to buy paintbrushes). She's arguing against *maximization*, not against fulfilling basic moral obligations.
          *   **"License to stop trying":** This phrasing implies laziness or moral laxity. Wolf's point is more profound: **We are not morally *required* to make every life choice based on maximizing the good.** We are *permitted* (and it may even be better overall) to sometimes choose the less morally optimal path *because* other significant values are at stake. It's about **balance and pluralism, not abdication.** We should still "try hard" to be morally decent people; we just aren't required to be saints.

  7.  **"...it's been empirically refuted since positive psychology shows that kind, moral people are actually happier..."**
      *   **Accuracy:** Positive psychology *does* often find correlations between prosocial behavior/altruism and well-being/happiness.
      *   **Distortion:** **This completely misses Wolf's philosophical point and the nature of her argument.**
          *   **Not About Happiness:** Wolf's argument is **not primarily about subjective happiness.** It's about the **objective plurality of values** that constitute a good life. Even if a Moral Saint *is* subjectively happy (which Wolf concedes the Loving Saint might be), Wolf argues their life is *still* deficient in other important, non-moral values. A happy person leading a very narrow life focused *only* on morality is missing out on other genuine goods.
          *   **"Kind, Moral People" vs. "Moral Saints":** Positive psychology studies "kind, moral people," not people who *maximize* moral value in *every* decision to the *exclusion* of all non-moral pursuits. Wolf's critique is aimed at an extreme ideal, not common decency. The findings about kind people being happier don't refute the idea that *maximizing* morality would crowd out other values and make the life overall less rich, even if the person is happy.
          *   **No "Tradeoff"?** Wolf argues there *is* a tradeoff *between values*, not necessarily between morality and happiness. Pursuing non-moral values means you aren't dedicating that time/energy to maximizing moral output (e.g., practicing piano instead of volunteering for an extra hour). The positive psychology findings don't eliminate this tradeoff at the level of value pluralism; they might just show that being decently moral *while also* having other interests is a sweet spot for happiness.

  **Your Vague Memory is Correct (The Crucial Distinction):**

  You nailed it: **Wolf's core argument turns precisely on the distinction between what morality demands (or what would make one morally perfect/saintly) and what makes a life good, rich, attractive, and meaningful *for the person living it* (or from an external perspective of a well-lived human life).** She argues:

  1.  Morality, understood as demanding maximization of the good, *would* require us to become Moral Saints.
  2.  The life of a Moral Saint (whether Loving or Rational) is *not* the most desirable, attractive, or well-rounded kind of human life because it lacks significant non-moral values.
  3.  Therefore, we should reject the idea that morality *should* demand maximization (or that we *should* aspire to sainthood), precisely because it conflicts with the ideal of a well-rounded, pluralistically valuable life.

  **Conclusion: Does "a bit of selfishness" follow?**

  *   **From Wolf's Accurate Core:** Yes, it follows that **we are not morally obligated to *maximize* goodness in every choice.** We are permitted (and it may be better overall) to sometimes prioritize significant non-moral values (like personal relationships, passions, intellectual pursuits, aesthetic experiences) *even when* we could marginally increase moral output by sacrificing them. This means dedicating time and energy to things other than helping others or fighting injustice.
  *   **But it is NOT "Selfishness":** Framing this as "selfishness" or a "license to stop trying" fundamentally distorts Wolf. She is arguing for the **legitimacy and importance of non-moral values that are part of a flourishing human life**, not for neglecting core moral duties or pursuing base self-interest at the expense of others. It's about **balance, pluralism, and rejecting maximalism**, not about being self-centered. Calling it "selfishness" implies the *only* alternative to maximizing morality is self-indulgence, which ignores the vast realm of valuable, non-selfish, non-moral pursuits (art, knowledge, friendship for its own sake, etc.) that Wolf champions.

  **In short:** Your friend captured the surface idea (maximizing morality leads to a narrow life, other values matter) but misinterpreted the Loving Saint point, misrepresented the conclusion as endorsing "selfishness," and wrongly claimed empirical refutation based on a misunderstanding of Wolf's value-pluralist argument. Wolf's paper is a sophisticated critique of moral maximalism from the perspective of a rich conception of the good life, not a simple permission slip for laziness. It tells us we aren't *required* to be saints to live good lives, not that we shouldn't be good people.
