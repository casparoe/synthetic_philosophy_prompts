answer: |-
  The asymmetry in religious conversion practices presupposes a complex, layered theory of belief, commitment, and community identity. Below is a concrete reconstruction of its implicit logic, distinguishing core presuppositions from compatible theories, and highlighting philosophical underdetermination.

  ---

  ### **Core Presuppositions (Strictly Required by the Practice)**
  1. **Inherited Legitimacy**:  
     Birthright membership is ontologically distinct from acquired membership. Lifelong members embody the community's continuity; their status is *ascribed*, not *earned*. Their presence maintains communal integrity regardless of personal devotion.

  2. **Threat Asymmetry**:  
     Converts pose a unique risk to communal cohesion that lifelong members do not. This could be:
     - **Doctrinal risk**: Converts may introduce syncretism or heresy.
     - **Social risk**: Converts lack embeddedness in kinship/networks, making defection easier.
     - **Legitimacy risk**: Unvetted outsiders could dilute the group's sacred distinctiveness.

  3. **Costs as Boundary Markers**:  
     The demands (study, renunciation, lifestyle changes) are **non-negotiable rites of passage**. They exist to:
     - Physically separate the convert from their past identity.
     - Publicly enact submission to communal authority.

  ---

  ### **Compatible Theories (Not Strictly Required but Plausibly Fitting)**
  | **Theory**               | **Mechanism**                                                                 | **Fits Practice?** |
  |--------------------------|-------------------------------------------------------------------------------|--------------------|
  | **Honest Signaling**     | Costs "prove" sincerity by being prohibitively expensive for opportunists.    | ⚠️ Contradicted by tolerance of lukewarm born members (unless signaling is *only* for outsiders). |
  | **Commitment Devices**   | Sunk costs (time, effort, social rupture) generate cognitive dissonance, fostering internalized belief. | ✅ Explains why costs precede full membership. |
  | **Identity Fusion**      | Rituals forge a new self-concept ("I am a [X]") through performative acts.    | ✅ Aligns with visible changes (dress/diet) as identity markers. |
  | **Purification Rites**  | Renunciation/dietary laws symbolically cleanse "foreign" contamination.       | ✅ Matches practices framing conversion as rebirth. |

  ---

  ### **Does the Practice *Need* Honest Signaling?**  
  **No.** While signaling is a *natural* reconstruction, the practice is equally licensed by:  
  - **Commitment Theory**: Costs induce belief via effort justification (e.g., "I sacrificed so much, so this must be valuable").  
  - **Cultural Transmission Theory**: Barriers slow conversion, ensuring only highly motivated outsiders assimilate, preserving doctrine.  
  - **Group Identity Theory**: Public rituals create shared narratives of transformation, binding the community.  

  **Key Point**: The asymmetry tolerates "cheap fakes" (uncommitted born members) but rejects "cheap entrants" (converts). This implies the primary goal is **protecting group boundaries**, not universal sincerity screening. Costs filter for *determination*, not necessarily pre-existing faith.

  ---

  ### **Philosophical Underdetermination: The "Perfect Convert" Test Case**  
  Consider a convert who:  
  - Completes all requirements flawlessly  
  - Observes all rules perfectly  
  - Reports *no inner conviction or belief*  

  How would the two readings judge this person?  

  | **Reading**              | **Verdict**                                                                   | **Reason**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **Honest Signaling**     | ❌ Rejection                                                                  | Signals failed: no "sincere" belief revealed. Cost was faked.              |
  | **Commitment Device**    | ✅ Likely acceptance                                                          | External compliance is sufficient. Belief may follow later via habit/sunk costs. |

  **Underdetermination Exposed**:  
  - The practice *does not specify* whether internal states (belief) or external actions (compliance) define "true" membership.  
  - **Implicit Default**: Communities prioritizing orthopraxy (correct action) over orthodoxy (correct belief) would accept the convert. Those demanding heartfelt faith would reject them. Yet the ritual itself is silent on this divide.  

  ---

  ### **Synthesis: The Implicit Theory**  
  The asymmetry presupposes:  
  **(1) Community survival** depends more on regulating *external* boundaries than *internal* states of members.  
  **(2) Belief is malleable**: For converts, it can be *manufactured* through costly investment (supporting commitment theories). For born members, it is *assumed* via lineage.  
  **(3) Social ontology trumps psychology**: Membership is a communal status granted through performative acts, not a private mental state. What matters is **what you do** (for converts) and **who you are** (for born members).  

  This explains why a convert reporting "no belief" but perfect observance might still be admitted: their actions have ritually reconstructed their social identity, fulfilling the community’s operative requirements. The born member’s lukewarmness is irrelevant because their identity is never in question—only their behavior is policed, if at all. The cost asymmetry thus ultimately reflects a **theory of belonging**: identity is either inherited or manufactured through ordeal, but never merely chosen.
