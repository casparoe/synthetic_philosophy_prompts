answer: |-
  The pattern of practice across the UK, Canada, and Spain reveals an **implicit constitutional theory of secession**, not a primary-right or remedial-right model. This theory treats secession as analogous to a fundamental constitutional amendment—a dissolution of the existing political contract requiring extraordinary democratic legitimacy and procedural safeguards to protect stability, minority rights, and the integrity of the constitutional order. Here's the breakdown:

  ### **Implicit Theory: Secession as Constitutional Dissolution**
  1. **Status Quo Bias**:  
     The existing constitutional order is presumed legitimate and durable. Secession isn't a routine democratic act but a radical restructuring requiring heightened justification.  
  2. **Procedural Legitimacy**:  
     Secession must follow recognized legal/constitutional pathways. Unilateral action (Catalonia) is illegitimate because it bypasses the state's foundational rules.  
  3. **Super-Democratic Threshold**:  
     A simple majority is insufficient for irreversible dissolution. The required majority ("clear majority," per Canada) is contextual—considering voter turnout, question clarity, and long-term consequences—but always exceeds 50%+1.  
  4. **Negotiated Outcome**:  
     Even a valid vote triggers complex negotiations (e.g., post-referendum terms in Scotland), acknowledging that secession affects all citizens, not just the seceding region.

  ### **How the Practices Align:**
  | **State** | **Practice** | **Alignment with Constitutional Theory** |  
  |-----------|-------------|------------------------------------------|  
  | **UK** | Simple majority referendum (2014) | Surface-level exception, but Westminster *authorized* the vote, preserving constitutional sovereignty. The 55% "No" reinforced the status quo. |  
  | **Canada** | Clarity Act (ambiguous supermajority) | Core example: Demands a "clear majority" without a fixed number, acknowledging context-dependent thresholds for dissolution. Rejects 50%+1 as inadequate for terminating the federation. |  
  | **Spain** | Secession unconstitutional without national consent | Purest expression: The Constitution is indivisible; secession requires *national* constitutional amendment, not regional will alone. |  

  ### **Rival Theories Ruled Out:**
  - **Primary-Right Theory**: Explicitly rejected by all three. No state accepts that a "cohesive people" can unilaterally secede with 50%+1. Spain criminalizes it; Canada demands federal negotiation; the UK required parliamentary approval.  
  - **Remedial-Right Theory**: Partially compatible (e.g., oppression might justify secession), but *not* necessary. Scotland had no grave oppression, yet a referendum was granted. Spain denies secession even amid grievances (Catalonia).  

  ---

  ### **The Clarity Act's Vagueness: Principled or Fudge?**  
  It **encodes a coherent rationale** tied to irreversible decisions:  
  - **One-Way Door Principle**: Secession is irreversible. Higher certainty is needed—e.g., a 52% vote amid 85% turnout signals stronger legitimacy than 52% with 50% turnout.  
  - **Contextual Threshold**: A fixed number (e.g., 60%) is arbitrary. What if 59.5% vote "Yes" after decades of oppression? Flexibility allows ethical and pragmatic calibration.  
  - **Negotiating Leverage**: Vagueness compels secessionists to seek maximal support, ensuring broad consensus before triggering dissolution.  

  *Critique*: It *also* functions as a strategic fudge, letting Ottawa reject narrow wins. But its core logic is defensible within constitutional theory.

  ---

  ### **How Rival Theories Would Change Practice**  
  1. **Primary-Right Theorist**:  
     - **Demands**: Automatic referendums at 50%+1 regional support (no federal approval).  
     - **Changes**: Spain must permit Catalan votes; Canada must accept Quebec independence at 50%+1; UK’s 2014 process would be the default.  
     - **Supermajority?** No principled basis—irreversibility is irrelevant to an inherent right.  

  2. **Remedial-Right Theorist**:  
     - **Demands**: Secession permitted *only* under oppression (e.g., genocide, systemic disenfranchisement).  
     - **Changes**: Scotland’s 2014 vote was illegitimate (no grievance); Catalonia’s case merits hearing; Canada’s Clarity Act becomes redundant.  
     - **Threshold**: Even 50%+1 suffices if oppression is proven, but higher bars may apply absent grievances.  

  ---

  ### **Conclusion**  
  The implicit constitutional theory—secession as dissolution requiring extraordinary legitimacy—explains all three practices. It accommodates the UK’s permissive-but-authorized referendum, Canada’s vague supermajority, and Spain’s outright denial. This theory quietly **rules out primary-right claims** (no unilateral exit) and **sidesteps remedial-right logic** (grievances aren’t required). The Clarity Act’s vagueness reflects a coherent (if imperfect) application of irreversible-decision principles. To adopt rival theories would require states to surrender constitutional sovereignty—a revolution liberal democracies resist.
