prompt: |-
  I teach a second-year ethics course, and every year the abortion unit follows the same discouraging script: the students sort themselves into camps before either argument has been read, and then read only for ammunition. Next term I want to disrupt this with a set of cases that separates the arguments from the camps. My idea is a two-by-two grid of scenarios in which the bodily-autonomy line descending from Thomson and the future-like-ours argument associated with Marquis are forced to give cross-cutting verdicts, so that a student who endorses one of them for its usual conclusions has to watch it defect in an unfamiliar cell, and vice versa.

  Here is the structure. One axis varies what the future-like-ours argument turns on: in one column the fetus plainly has a future of the relevant kind; in the other it lacks one, because of a condition discovered late in pregnancy that guarantees death within days of birth. The other axis varies what the autonomy argument turns on: in one row the pregnancy was voluntarily assumed and the remaining burden is small — a few weeks of gestation left, then an ordinary delivery — while in the other the pregnancy was never assumed and the burden is grave, say a serious risk to the woman's health. Fill in the four cells with realistic, one-paragraph scenarios drawn from ordinary clinical life: no borrowed violinists, no engineered contraptions, no saints. The cells should be matched closely enough that each differs from its neighbours in exactly one variable; otherwise the grid isolates nothing.

  Then demonstrate that the grid works. For each cell, state what each of the two arguments concludes and show the reasoning rather than stipulating the verdict — I want the conclusions to fall out of the theories' actual commitments about futures, responsibility and burden, not out of my labels. On the best reading the grid should yield two consensus cells and two of opposition: one opposition cell is the familiar face-off, and the other is its mirror, where the future-like-ours argument permits while the responsibility-and-burden strand of the autonomy reasoning condemns — and that mirror cell is the one I care most about. Note, in passing, that Thomson herself resists letting the responsibility prong generate any condemnation, so treat it as an open question whether her argument can be pushed to condemn without smuggling in a premise that trivialises it; do not hide that tension.

  Finish with the honest part. Identify which feature of each scenario does the work; explain how a defender of each argument would try to wrestle the awkward cells back into line; and say whether the crossed verdicts reveal something structural about the two arguments or only show how far each can be stretched once its usual companion intuitions are stripped away. I am not looking for a verdict on abortion itself — the exercise succeeds precisely when a student finishes it no longer able to tell which argument she favours until she has seen its verdicts detached from the camp she arrived in. Keep the whole thing to about 900 words, suitable for a seminar handout with no citations.
reasoning: |-
  Okay, let me approach this ethics professor's request systematically. The user wants a pedagogical tool to disrupt polarized abortion debates by forcing students to confront theoretical inconsistencies through carefully constructed scenarios. 

  First, I need to design four clinically realistic scenarios that isolate two key variables: existence of fetal future (FLO) and voluntariness/severity of burden (autonomy). The professor specified cross-cutting verdicts where consensus appears only in two cells while opposition occurs in the other two - particularly valuing the mirror cell where FLO permits but autonomy condemns.

  For the scenarios, I'll draw from obstetric practice: 
  - Cell A: Voluntary pregnancy with minor burden + viable fetus (standard case)
  - Cell B: Voluntary pregnancy + fatal fetal diagnosis (anencephaly example)
  - Cell C: Non-consensual pregnancy + viable fetus (contraceptive failure with health risks)
  - Cell D: Non-consensual pregnancy + fatal diagnosis (assault-related pregnancy with severe maternal risk)

  The analysis must show how conclusions derive from each theory's core commitments, not labels. For Cell D especially, I need to highlight the tension Thomson would have with responsibility-based condemnation while showing how FLO's lack of future leads to permission. 

  The honesty section should identify:
  - How FLO defenders might dispute "future" definitions in Cell B
  - How autonomy theorists might minimize responsibility in Cell C
  - Whether crossed verdicts reveal structural incompatibility or mere intuition-stripping

  Word count is tight at 900 words. I'll keep citations out as requested, using only essential theory references (Thomson/Marquis) embedded naturally. The tone should remain academic but accessible for undergrads, with clear scenario headings and bullet-point reasoning where helpful.
answer: |-
  Here is your four-scenario grid designed to decouple arguments from ideological camps, with analysis demonstrating crossed verdicts:

  **Scenario Grid: Separating FLO from Autonomy/Responsibility**

  *   **Axis 1 (FLO Future):** Column 1 (Viable Future) vs. Column 2 (No Viable Future - Fatal Neonatal Condition)
  *   **Axis 2 (Autonomy/Responsibility):** Row 1 (Voluntary, Low Burden) vs. Row 2 (Non-Voluntary, High Burden)

  **Cell A1: Voluntary & Low Burden, Viable Future (e.g., Healthy Pregnancy, Chosen)**  
  *Scenario:* Maya, 30, intentionally became pregnant after careful planning. At 32 weeks, all scans and tests indicate a perfectly healthy fetus developing normally. Maya is healthy, experiencing typical late-pregnancy discomforts but no serious complications. Delivery is expected within 6 weeks.

  *   **FLO Verdict (Marquis):** **Condemns abortion.** The fetus has a valuable future-like-ours – decades of conscious life, experiences, projects. Depriving it of this future is a serious moral wrong akin to killing a child or adult.
  *   **Autonomy Verdict (Thomson-inspired):** **Permits abortion, but likely weak justification.** While Maya voluntarily undertook pregnancy, the *remaining* burden (6 weeks gestation + delivery) is relatively low. Thomson argues one isn't *required* to be a Good Samaritan, but voluntarily assuming even a small burden weakens the case for terminating a being with a future. Permissibility here is borderline or requires demonstrating significant burden.

  **Cell B1: Voluntary & Low Burden, No Viable Future (e.g., Chosen Pregnancy, Late-Discovered Lethal Defect)**  
  *Scenario:* Priya, 28, planned her pregnancy. At a routine 34-week scan, severe, previously undetected anencephaly is diagnosed. The condition is uniformly fatal; the infant will die within hours or days of birth. Priya is physically healthy, facing only the remaining weeks of pregnancy and delivery.

  *   **FLO Verdict (Marquis):** **Permits abortion.** The fetus lacks a "future-like-ours" in the morally relevant sense. Its future contains only brief, non-conscious existence followed inevitably by death. Depriving it of this future does not constitute the serious wrong of depriving it of a valuable, open-ended life.
  *   **Autonomy Verdict (Thomson-inspired):** **Permits abortion, stronger justification than A1.** Priya voluntarily assumed pregnancy based on the expectation of a healthy child. While the *physical* burden remains low, the profound *psychological* burden of carrying a non-viable fetus to term is significant. Terminating avoids this burden without depriving the fetus of a valuable future.

  **Cell C2: Non-Voluntary & High Burden, Viable Future (e.g., Contraceptive Failure, Serious Maternal Risk)**  
  *Scenario:* Lena, 35, became pregnant due to contraceptive failure (IUD displacement). She did not want children. At 30 weeks, she develops severe, life-threatening preeclampsia requiring immediate hospitalization and posing significant risk of stroke, organ damage, or death. Continuing the pregnancy requires weeks of dangerous bed rest followed by a high-risk delivery; immediate delivery (which would be an abortion at this stage) is medically indicated to save Lena's life. The fetus is otherwise healthy and viable with NICU care.

  *   **FLO Verdict (Marquis):** **Condemns abortion.** The fetus has a valuable future-like-ours. Ending its life to alleviate the threat to Lena deprives it of that future.
  *   **Autonomy Verdict (Thomson-inspired):** **Strongly Permits abortion.** Lena did not voluntarily assume the pregnancy burden (contraceptive failure). The burden imposed is now extreme – a grave threat to her life and health. Requiring her to endure this high risk against her will constitutes a profound violation of her bodily autonomy and integrity. The violinist analogy's core intuition applies here: no one can be compelled to sustain another's life at such cost to themselves.

  **Cell D2: Non-Voluntary & High Burden, No Viable Future (e.g., Assault, Fatal Defect, Maternal Risk)**  
  *Scenario:* Chloe, 22, became pregnant due to sexual assault. She sought but couldn't access timely abortion. At 28 weeks, severe preeclampsia *and* a lethal skeletal dysplasia (incompatible with life beyond days post-birth) are diagnosed. Continuing pregnancy poses high risks of stroke, eclampsia, or death for Chloe. Delivery (abortion) is medically urgent.

  *   **FLO Verdict (Marquis):** **Permits abortion.** The fetus lacks a future-like-ours due to its lethal condition. There is no valuable future to deprive it of.
  *   **Autonomy Verdict (Thomson-inspired):** **Strongly Permits abortion, *but introduces tension*.** The high burden (life-threatening health risk) clearly permits termination. However, the *non-voluntary* nature (assault) might push some interpretations *beyond permission towards condemnation of continuing the pregnancy as a further violation*. Thomson herself firmly rejected deriving *duties* from non-consensual pregnancy, focusing solely on the permissibility of refusal. Pushing autonomy/responsibility to *condemn* Chloe *not* aborting risks trivializing the argument by smuggling in a duty to protect the fetus, which Thomson explicitly denies exists. The core argument permits refusal; condemnation of non-refusal is a separate, contested move.

  **Analysis: How the Grid Works & Honest Reflection**

  *   **Consensus Cells:**
      *   **B1 (Voluntary/Low Burden/No Future):** Both arguments clearly permit abortion (FLO: No future; Autonomy: Burden present, future irrelevant).
      *   **C2 (Non-Voluntary/High Burden/Viable Future):** Autonomy strongly permits (high burden, non-consensual); FLO condemns (viable future). *This is the familiar face-off.*
  *   **Opposition Cells:**
      *   **A1 (Voluntary/Low Burden/Viable Future):** FLO condemns (future); Autonomy weakly permits or is borderline (voluntary but low burden). Opposition centers on the weight of burden vs. future.
      *   **D2 (Non-Voluntary/High Burden/No Future):** **The Mirror Cell.** FLO *permits* (no future). Autonomy *permits* due to high burden, *but* the non-voluntary aspect might tempt some to argue autonomy/responsibility *condemns* Chloe *not* aborting (seeing it as enduring a grave violation needlessly). Thomson would resist this condemnation.
  *   **Key Feature Drivers:**
      *   FLO Verdicts hinge *solely* on the presence/absence of a viable future (Column).
      *   Autonomy Verdicts hinge on the magnitude of the *remaining burden* and the initial voluntariness (Row), though voluntariness primarily affects the *strength* of the justification for refusal.
  *   **Wrestling Awkward Cells:**
      *   **FLO Defender (Cell C2):** Might argue Lena's risk isn't *certain* death, so the fetus's future still outweighs the probabilistic risk. Or argue the burden, while high, doesn't *quite* reach the threshold for overriding the fetus's right to life.
      *   **Autonomy Defender (Cell A1):** Might argue "low burden" is subjective; Maya's experience might be severe *for her*. Or emphasize that even voluntarily assumed, minimal burdens don't create an obligation to continue if the woman withdraws consent.
  *   **Structural Revelation?** The crossed verdicts (especially D2) reveal less about inherent structural conflict and more about how each argument prioritizes *different fundamental values* when stripped of companion intuitions. FLO cares only about the *fetus's potential future* existence. Autonomy cares only about the *pregnant person's current bodily burden and consent*. The "opposition" arises because these values are orthogonal; they can align (B1, C2) or cross (A1, D2) independently. The grid shows they aren't simply pro-life vs. pro-proxy arguments, but distinct moral lenses addressing different questions (value of potential life vs. limits of bodily obligation). Students see the core logic of *each* argument leading to conclusions that defy their initial tribal alignment.
