  First, I'll establish the core tension: we depend massively on testimony yet must justify that trust. The tree needs to cover four key angles: (a) whether testimonial justification loops back on itself, (b) whether trust requires advance reasons or just absence of defeaters, (c) if trust defaults are a priori or empirical, and (d) whether agency is necessary for testimony.

  For the branch questions, I'm considering starting with the easiest access point - the GPS/machine assertion case. This makes the agency question vivid for students. Then I'll move to whether trust needs general foundations (reductionism vs anti-reductionism), followed by the defeater monitoring requirement, and finally the nature of the default trust. 

  The leaves should include main positions: Humean reductionism (needs general reliability proof), local reductionism (situational monitoring only), entitlement anti-reductionism (a priori right to trust), and a hybrid view. For awkward commitments: Hume's view struggles with children's knowledge, local reductionism burdens the cognitively limited, entitlement views can't explain why we distrust strangers, and hybrids might have unstable foundations.

  Special attention to the user's request about non-agential sources like GPS - I'll ensure the tree reveals whether agency is treated as essential. Also noting where positions might collapse (e.g. deep habits vs a priori entitlements) and why some logical combos are vacant (like requiring agency but not monitoring - too reckless for theorists). 

  The handout will stay under 7 questions and 8 leaves, with a scoring key. All jargon gets plain-language explanations in parentheses. For example, "a priori entitlement" becomes "built into rational thinking itself". This should let students navigate the debate through their own intuitions about concrete cases.
answer: |-
  ### Epistemology of Testimony: Decision Tree Handout

  **Shared Starting Point:** Nearly everything you know about history, science, geography, and other people's lives comes from what others have told you (directly or indirectly). You couldn’t personally verify more than a tiny fraction of this without losing most of your knowledge.

  ---

  **Branch 1: GPS Question**  
  *Your GPS says "Turn left onto Elm Street." No human agent designed this specific instruction; it was generated by an algorithm. Can you reasonably trust this instruction purely based on the device’s output, without checking its track record?*  
  → **A: Yes, it’s fine to trust this like human testimony.**  
  → **B: No, this isn’t real testimony—it needs extra verification.**  

  **Branch 2: Foundational Trust Question**  
  *Must you have a positive reason (e.g., past reliability, expertise checks) to trust a *new* speaker on a topic before accepting their word, or is trust the starting point?*  
  → **A: Need a positive reason first (e.g., track record, credentials).**  
  → **B: Trust is the default; no prior reason needed.**  

  **Branch 3: Defeater Monitoring Question**  
  *When trusting a speaker, must you actively watch for red flags (nervousness, inconsistency, motive to lie), or is passive acceptance okay until blatant doubt arises?*  
  → **A: Must actively monitor for red flags.**  
  → **B: No active monitoring needed; only react if doubts appear.**  

  **Branch 4: Default Trust Basis**  
  *If trust is the default, is this because:*  
  → **A: It’s earned through life experience (e.g., "people usually tell the truth")?**  
  → **B: It’s built into rational thinking itself (not learned)?**  

  **Branch 5: Self-Undermining Question**  
  *Does justifying testimony’s reliability *always* require circularly using other testimony (e.g., using studies about credibility that themselves rely on testimony)?*  
  → **A: Yes, it’s unavoidably circular.**  
  → **B: No, it can be grounded non-circularly (e.g., personal observation).**  

  ---

  **Scoring Key: Map Your Path to a Position**  
  *(Paths combine answers: e.g., 1A-2B-3B-4B-5A)*  

  | **Your Path** | **Position** | **Key Commitment** | **Awkward Consequence** |
  |---------------|--------------|---------------------|--------------------------|
  | **1B–2A–3A–5B** | **Global Reductionism** (Hume-style) | Trust requires a standing inductive case for general speaker reliability. | Children or isolated adults couldn’t know much via testimony—they lack the data for induction. |
  | **1B–2A–3A–5A** | *Unnamed* | Trust needs positive reasons, but those reasons are unavoidably testimonial. | Self-undermining: justification collapses into circularity. |
  | **1B–2B–3A–4A** | **Local Reductionism** (Fricker/Lackey-style) | Default trust, but *must* monitor each exchange for defeaters. | Imposes high cognitive demands; we often accept testimony without scrutiny (e.g., casual chat). |
  | **1A–2B–3B–4B–5A** | **Anti-Reductionism** (Coady/Burge-style) | Acceptance is justified by an *a priori* right to trust, no monitoring needed. | Must accept absurd claims if no defeaters (e.g., "I’m a wizard" from a stranger). |
  | **1A–2B–3A–4A–5A** | **Empirical Default Hybrid** | Trust is a learned habit; monitor for defeaters; circularity is unavoidable. | Trust isn’t "rational" but a psychological necessity—undercuts objective justification. |
  | **1A–2B–3B–4A** | *Unnamed* | Trust is a deep habit (not *a priori*), yet no monitoring needed. | Unstable: habits can be unreliable, but the view forbids checking for errors. |
  | **1B–2B–3B–4B** | *Logically Incoherent* | Insists testimony requires a responsible agent (1B) but grants *a priori* trust without monitoring (3B/4B). | Demands agency for justification but ignores agency’s risks (deceit, error). |

  ---

  ### Important Notes  
  1. **Collapsed Distinction:** The tree *cannot* reliably separate **deeply entrenched empirical habits (4A)** from **a priori entitlements (4B)**. Students might honestly give the same answer to Branch 4 for both.  
  2. **Unoccupied Branches:**  
     - **1B–2B–3B–4B:** Rejected as incoherent—demanding agency (1B) but forbidding monitoring (3B) ignores testimony’s interpersonal risks.  
     - **1A–2A–3B–...**: No defender—if trust needs prior reasons (2A), passive acceptance (3B) is reckless.  
  3. **GPS as Litmus Test:** If you chose **1B** (GPS isn’t testimony), you likely see testimony as uniquely human—requiring an asserter who can *answer for their words*.  

  **Tree Logic:** Branches 1 and 2 split reductionists (2A) from anti-reductionists (2B). Branch 3 divides strict anti-reductionists (3B) from moderates (3A). Branch 4 tests the default’s basis, while Branch 5 targets reductionism’s viability.  

  ---
  This structure lets students "vote" with intuitions about cases, revealing their alignment with classic positions—without needing labels first. Names (e.g., Hume, Coady) are removable; positions stand on described commitments.
