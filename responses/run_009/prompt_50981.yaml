  I'll explain where the procedure misfires—like assuming reliable country information or clear distinctions between persecution and crime. Also, note where values come into play, such as interpreting "membership in a particular social group" or "state protection." 

  The user's deeper needs: They want authenticity in legal processes to build a realistic, morally complex character. The decision procedure isn't just a plot device; it's a tool to explore themes of bureaucracy, justice, and personal conscience. By showing where the system fails, they can critique real-world issues while driving the narrative. 

