answer: |-
  Here’s a decision procedure grounded in real refugee law principles, designed to be run by a mid-level adjudicator in a resource-constrained environment. It prioritizes defensible legal reasoning while highlighting the points where cold logic collides with human conscience. The core tension is between the **Convention refugee definition** (persecution for race, religion, nationality, political opinion, or membership in a particular social group + well-founded fear) and broader **regional/complementary protection** (like Cartagena: "threat to life, security or liberty" from generalized violence, massive human rights violations, etc.).

  **The Adjudicator's Decision Tree: "The Filter"**

  1.  **Country of Origin (COO) & Departure:**
      *   **Question:** Is the claimant outside their country of nationality (or habitual residence if stateless)?
      *   **Termination - NO:** If "No." Not a refugee claim (may be other immigration pathways). *Rationale: Requires being outside one's country.*
      *   **Proceed if:** "Yes."

  2.  **Fear: Subjective Element:**
      *   **Question:** Does the claimant *express* a fear of returning to their COO? (Listen for key phrases: "I'm scared," "They'll kill me," "I can't go back," "It's not safe.")
      *   **Termination - NO:** If "No," and no *sur place* fear is evident (e.g., no evidence claimant became targeted *after* leaving). *Rationale: Core requirement of "fear."*
      *   **Proceed if:** "Yes," or evidence suggests *sur place* fear (e.g., political activity abroad, changed country conditions, public denouncement by COO regime).
      *   **Conscience Checkpoint:** Does the claimant's demeanor (flat affect, trauma-induced dissociation, cultural stoicism) mask genuine fear despite verbal denial? *Procedure demands verbal/expressed fear; conscience nags about unspoken terror.*

  3.  **Fear: Objective Element ("Well-Founded"):**
      *   **Question:** Is there an objective basis for the expressed fear? (Cross-reference: Claimant's testimony, COO info reports (often sparse/outdated), known patterns, plausibility check).
      *   **Sufficient Answer:** Specific, detailed, consistent testimony corroborated *in general terms* by COO info (e.g., reports confirm police abuse dissidents; claimant *is* a dissident reporting police threats). "Reasonably possible" standard, not "more likely than not."
      *   **Termination - NO:** If testimony is fundamentally implausible, internally contradictory, or directly contradicted by reliable COO info *on the key point*. *Rationale: Fear not "well-founded."*
      *   **Proceed if:** Testimony is credible and plausible, even if specific corroboration is thin *if consistent with known patterns*. *Procedure assumes COO info is imperfect but usable.*
      *   **Conscience Checkpoint:** Is the COO info reliable enough? Is "plausibility" just a bias filter? Am I dismissing trauma-induced inconsistencies too harshly?

  4.  **Persecution Nexus (The "Why?"):**
      *   **Question:** Is the feared harm linked to one of the *Convention grounds*: Race, Religion, Nationality, Political Opinion, or Membership in a Particular Social Group (PSG)?
      *   **Identifying PSG:** Crucial & contentious. Requires: (1) An immutable/shared fundamental characteristic; (2) Social visibility/distinctness; (3) Persecution *because of* that characteristic. *Procedure leans conservative: Must fit established PSG categories or make a very strong, analogous case.*
      *   **Sufficient Answer:** Clear connection stated or easily inferred (e.g., targeted for ethnicity, faith, activism, sexual orientation (established PSG), family ties (sometimes PSG)).
      *   **Termination - NO:** If the harm feared stems *only* from personal vendettas (unconnected to a ground), criminality (victim of random crime), natural disasters, or purely economic hardship without nexus. *Rationale: No Convention nexus.*
      *   **Proceed if:** Nexus established.
      *   **Conscience Checkpoint:** Is this PSG argument valid, or am I twisting logic? (e.g., "Women refusing patriarchal norms" – valid PSG in some places, contested in others). Where does generalized violence without a *specific* nexus fit? (Hint: It usually doesn't here – **key fault line**).

  5.  **State Protection:**
      *   **Question:** Is the state (COO government or controlling forces) the agent of persecution, or is it unwilling/unable to protect the claimant from the persecutor (non-state actors like gangs, family)?
      *   **Sufficient Answer:** Evidence of state complicity (e.g., police *are* the persecutors), systemic failure (e.g., reports show police don't investigate domestic violence or gang crimes against certain groups), or claimant's credible testimony of seeking & failing to get protection.
      *   **Termination - NO:** If claimant didn't seek available state protection without good reason, OR if COO info shows the state is willing/able to provide adequate protection *in this specific type of case*. *Rationale: No failure of state protection required for the harm.*
      *   **Proceed if:** State is persecutor or demonstrably unable/unwilling to protect.
      *   **Conscience Checkpoint:** "Available" protection? Is reporting rape to corrupt police "available"? Is "adequate" protection defined by theoretical state capacity or the claimant's reality? *Procedure assumes claimant should seek protection unless clear evidence it's futile.*

  6.  **Internal Flight Alternative (IFA):**
      *   **Question:** Is there a part of the COO where the claimant would be safe *from this specific threat* AND where it would be "reasonable" for them to relocate?
      *   **Sufficient Answer (No IFA):** Threat is nationwide (e.g., state persecution), agent has nationwide reach, or relocation is unreasonable due to personal circumstances (ethnicity/religion makes them target everywhere, single woman with no support network, conflict zone).
      *   **Termination - NO:** If a safe IFA exists *and* relocation is reasonable. *Rationale: No need for international protection if safety exists within the country.*
      *   **Proceed to Grant (Convention Refugee Status):** If steps 1-6 are passed. *Rationale: Meets 1951 Convention definition.*
      *   **Conscience Checkpoint:** "Reasonable" relocation? Is expecting a farmer to live in a dangerous slum "reasonable"? Does "safety" just mean not being killed, or does it include basic dignity? *Procedure uses a low bar for "safety" and a high bar for "unreasonableness."*

  7.  **Regional/Complementary Protection (The "Back Door" - If Convention Fails):**
      *   **Trigger:** Claim fails at Steps 4 (Nexus) or 6 (IFA exists), **but** the feared harm is severe (death, torture, inhuman treatment).
      *   **Question (Cartagena-style):** Is the claimant fleeing a situation of "generalized violence, foreign aggression, internal conflicts, massive violation of human rights or other circumstances which have seriously disturbed public order" AND would return threaten their "life, security, or liberty"?
      *   **Sufficient Answer:** Evidence of widespread conflict, state collapse, extreme gang dominance, or catastrophic human rights conditions in the claimant's home area/group, combined with individual risk upon return.
      *   **Termination - NO:** If the situation, while bad, doesn't meet the threshold of "seriously disturbed public order" OR if the claimant's individual risk is purely random/not elevated by context OR if a safe IFA exists *within the chaos* (extremely difficult to prove). *Rationale: Does not meet regional/complementary protection standard.*
      *   **Proceed to Grant (Complementary Protection Status):** If threshold met and no viable IFA. *Rationale: Meets broader humanitarian protection principle (like Cartagena, EU Qualification Directive, etc.).*
      *   **Conscience Checkpoint:** Where does "generalized violence" *really* start? How bad is bad enough? Am I denying because the legal category is fuzzy? **This is the climate displacement gap:** Slow-onset disaster rarely fits "violence" or "disturbed order" *yet*, and no nexus to Convention grounds.

  **Where the Procedure Misfires/Gets Gamed:**

  1.  **PSG Definition:** The most manipulable step. Savvy claimants/representatives frame any harm under a PSG. Adjudicators can be overly restrictive or overly broad. Values dominate here.
  2.  **State Protection:** Assumes knowledge of local police effectiveness. "Seeking protection" is a minefield – claimants may fear reporting, or reports may be ignored without record.
  3.  **IFA:** "Reasonableness" is deeply subjective. COO info on specific regions is often poorest. Assumes claimants can safely travel internally.
  4.  **"Well-Founded Fear" Plausibility:** Relies heavily on adjudicator's cultural understanding and biases. Trauma can make testimony seem "inconsistent."
  5.  **Complementary Protection Threshold:** Highly subjective. When does crime become "disturbed public order"? Climate impacts rarely qualify.
  6.  **Information Gaps:** Decisions made on outdated, incomplete, or politically biased COO reports. Adjudicator must often make leaps based on limited data.
  7.  **Gaming:** Claimants coached to mention key phrases ("political opinion," "social group"), fabricate details to fit PSGs, or downplay IFA possibilities.

  ---

  **Applying the Filter to the Cases:**

  **Case 1: Woman threatened by police ex-husband ("He'll kill me if I return")**

  1.  **COO & Departure:** Yes, outside country. *Proceed.*
  2.  **Subjective Fear:** Explicitly stated. *Proceed.*
  3.  **Objective Fear:** Credible testimony. COO info likely confirms domestic violence issues & potential police impunity. Plausible threat. *Proceed.*
  4.  **Nexus:** **Key Question.** Is this a Convention ground?
      *   *Option A (Strict):* Personal vendetta? Not a nexus. *Terminate - NO.*
      *   *Option B (Established PSG):* "Women in [COO] unable to access state protection from domestic violence" is a recognized PSG in many jurisdictions. *Proceed.*
      *   *Conscience Checkpoint:* Adjudicator *hates* Option A but legal precedent in their tribunal might lean that way. Values fight: Is gender-based violence persecution? (Answer should be yes under PSG).
  5.  **State Protection:** Ex-husband *is* the state (police). Clear evidence of inability/unwillingness (complicity). *Proceed.*
  6.  **IFA:** Ex-husband is police – likely has nationwide reach/connections. Threat likely follows her. Relocation unreasonable (no support, fear). *NO SAFE IFA.*
  7.  **Complementary Protection:** Not needed (Convention met).
      *   **OUTCOME:** GRANT (Convention Refugee) - *If PSG nexus accepted.* DENY - *If PSG nexus rejected (personal vendetta).* **This is the character's hated outcome.** She sees the systemic misogyny and police impunity, knows the woman will die, but the procedure allows a denial on the narrow "nexus" point if PSG arguments haven't been fully accepted in that jurisdiction. She has to write: "Harm feared stems from a personal relationship, not a Convention ground."

  **Case 2: Man from gang-extorted city (Generalized crime, "No one is after me specifically")**

  1.  **COO & Departure:** Yes. *Proceed.*
  2.  **Subjective Fear:** Implied by flight, but testimony downplays it ("just how it is"). Needs probing. *Assume "Yes" for fear of violence/extortion.* *Proceed.*
  3.  **Objective Fear:** Extortion/gang violence in city well-documented by COO reports. Fear of violence is well-founded. *Proceed.*
  4.  **Nexus:** **The Wall.** Why *him*? He admits no specific reason (race, religion, politics, PSG). He's targeted because he lives/works there – victim of crime. *Termination - NO.* (No Convention ground). *Conscience Checkpoint:* This *feels* wrong. The harm is real and severe, but the legal category excludes it.
  5.  **State Protection:** State unable to control gangs (COO reports confirm). *But doesn't matter, failed at Nexus.*
  6.  **IFA:** **Trigger for Complementary Protection.** Failed Convention, but severe harm feared.
  7.  **Complementary Protection:** Generalized gang violence? Does it meet "seriously disturbed public order"?
      *   *Option A (Strict):* High crime ≠ "disturbed public order" like civil war. Risk is random, not individualized. *Terminate - NO.*
      *   *Option B (Broader):* Gang controls city, state absent – meets threshold. *Proceed to Grant.*
      *   *Conscience Checkpoint:* Adjudicator knows he's fleeing hell, but the law is ambiguous. Does *everyone* in that city qualify? Procedure struggles with scale.
      *   **OUTCOME:** LIKELY DENY (Convention: No nexus. Complementary: Threshold not met/generalized risk). Adjudicator feels sick but writes: "Harm feared, while severe, is criminal and not linked to a Convention ground. Generalized violence in home area does not currently meet the threshold for complementary protection under applicable guidelines."

  **Case 3: Delta Farmer (Floods worse every year, livelihood destroyed)**

  1.  **COO & Departure:** Yes. *Proceed.*
  2.  **Subjective Fear:** Fear of starvation, destitution? Not necessarily *persecution* fear. Might express fear of chaos/violence *caused* by disaster (scramble for resources). Needs probing. *Assume expresses fear of destitution/violence.* *Proceed.*
  3.  **Objective Fear:** COO reports confirm environmental degradation, flooding patterns. Livelihood loss credible. *Proceed.*
  4.  **Nexus:** **The Gap.** Why him? Because he lives in a delta. No Convention ground (race, religion, etc.). Not a PSG ("Delta farmers"? Generally not recognized unless *persecuted specifically as delta farmers*). *Termination - NO.*
  5.  **State Protection:** State unable to mitigate climate effects? Irrelevant, no nexus.
  6.  **IFA:** **Trigger for Complementary Protection.** Severe harm (starvation, possibly violence in chaos).
  7.  **Complementary Protection:** Is slow-onset climate disaster "generalized violence" or "seriously disturbed public order"? Almost certainly **No**. Not typically covered by existing frameworks. *Termination - NO.*
      *   **OUTCOME:** DENY. **The ultimate systemic failure.** Adjudicator knows he can't go back, knows his life is destroyed by forces beyond his control, knows no safety net exists. But the procedure offers no hook. The written decision is brutal in its simplicity: "Harm feared stems from environmental factors and resulting economic hardship, not persecution for a Convention ground. The situation, while difficult, does not meet the threshold for complementary protection based on generalized violence or disturbed public order."

  ---

  **For Your Novel:**

  *   **The Character's Anguish:** Case 3 (Farmer) is the most existentially frustrating denial. Case 1 (if denied on PSG nexus) cuts deep personally, especially if she's fought for that recognition. Case 2 highlights the arbitrary line between "persecution" and "crime."
  *   **The Procedure as Character:** Show her wrestling at each Conscience Checkpoint. Does she bend the rules subtly (finding a PSG where it's weak, lowering the IFA "reasonableness" bar)? Does she rigidly follow it, compartmentalizing her horror? Does she linger on cases she denied, rereading files?
  *   **The Colleague Argument:** Perfect over Case 2 or 3. Colleague might be a strict constructionist ("The Convention is narrow for a reason! Open the floodgates!") or a humanitarian expansionist ("Cartagena *must* apply here! We're sending him back to hell!"). Their argument should hinge on interpreting Nexus, PSG, or the Complementary Protection threshold.
  *   **The Machinery:** Emphasize the speed – ticking boxes, skimming reports, relying on boilerplate language for common COO profiles. The rubber plant wilts in the corner. The drama is in the *silence* as she stares at Step 4 for the farmer, knowing there's nowhere to go.

  This procedure gives you the bones of a defensible, bureaucratic decision. The flesh, blood, and moral conflict come from your character operating within and against its rigid confines. Good luck!
