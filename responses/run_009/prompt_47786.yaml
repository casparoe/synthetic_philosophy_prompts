prompt: |-
  Many legislatures can attach sunset clauses to laws: a statute or regulation expires automatically at a fixed date unless affirmatively re-authorized. Surveillance powers, tax provisions, even whole agencies get this treatment. Meanwhile the default for ordinary legislation is the opposite — permanence. A law, once passed, stays on the books indefinitely, and removing it takes an affirmative act of roughly the same difficulty as enacting it. So the system encodes two defaults at once: some laws must continuously earn their existence, while most need only never to have lost it.

  What view of lawmaking does this arrangement presuppose? Reconstruct the implicit theory. Does the selective use of sunsets presuppose that legislators can identify which kinds of laws are dangerous — liberty-infringing, fiscally significant — and that inherited law is presumptively harmless? Chesterton's fence counsels that you shouldn't remove a fence until you know why it was put up, treating the obscurity of its purpose as a reason for caution; a sunset clause treats a justification that has gone stale and unexamined as presumptive ground for demolition. Notice, too, that this presumption is applied mainly to young fences: new statutes must re-justify themselves periodically, while the old corpus is protected precisely by the obscurity of its origins. Is the practice consistent with any Burkean respect for accumulated institutional wisdom, or does it presuppose that a law's value must be articulable on demand — that a fence whose purpose no one can now state has forfeited its claim? Finally, say what would change if the default were flipped globally, so that every law sunsets unless re-authorized: would that be rational housekeeping, or a decision procedure that quietly penalizes exactly the tacit, inarticulate benefits that made the old default tolerable?
reasoning: |-
  Hmm, the user presents a sophisticated analysis of sunset clauses in legislation and asks about the implicit theory of lawmaking behind this practice. This requires unpacking philosophical and institutional assumptions about how laws gain legitimacy over time.

  The core tension lies between two approaches: one where laws must periodically prove their worth (sunset clauses) versus one where laws persist unless actively repealed (permanent legislation). The user cleverly frames this using Chesterton's fence paradox - sunset provisions seem to invert the traditional conservative principle by treating unexplained persistence as suspect rather than venerable.

  Key dimensions to address:
  First, the selective application suggests legislators believe they can identify "dangerous" legislation categories upfront - primarily those affecting liberty or finances. This implies a rationalist confidence in contemporary judgment over historical accumulation. 

  Second, the age asymmetry is striking. New laws face recurring scrutiny while old laws benefit from institutional inertia. This creates a paradox where the least understood laws (due to lost legislative context) receive the strongest preservation bias precisely because their original purpose is obscure.

  Third, the Burkean question cuts deep. Sunset practices seem fundamentally anti-conservative by valuing only currently articulable justifications. They reject the idea that laws may have embedded tacit knowledge or complex social functions that can't be easily verbalized.

  The counterfactual - universal sunsetting - would radically shift burdens. It might surface zombie laws but could also eliminate beneficial laws with diffuse support (where reauthorization costs exceed individual benefits). The user's "tacit benefits" point is astute: such a system would systematically disadvantage laws whose value is felt but not easily demonstrable in hearings.

  This connects to public choice theory - sunsetting raises the decision costs for preserving laws, which may advantage well-organized interest groups over diffuse public benefits. The current system essentially says: once a law survives its initial sunset periods, it graduates to protected status.

  Ultimately the arrangement presupposes a modified rationalist view: lawmakers trust contemporary reason to filter new laws, but distrust it sufficiently to preserve old laws untouched. It's institutional design acknowledging human limitations - we're better at spotting present dangers than evaluating accumulated complexity.
answer: |-
  This arrangement of selective sunset clauses reveals an implicit theory of lawmaking that combines **pragmatic rationalism** with a **temporal bias toward the status quo**. It rests on several interconnected assumptions:

  1.  **The "Dangerous New Law" Presupposition:** Legislators presuppose they can identify *categories* of laws that are inherently more prone to abuse, inefficiency, or negative consequences (e.g., surveillance powers infringing liberty, tax expenditures impacting budgets, new agencies creating bureaucratic bloat). Sunset clauses act as a pre-emptive check on these perceived risks inherent in *innovation*.

  2.  **The Presumption of Harmless Inheritance:** Conversely, the system assumes that laws already embedded in the legal corpus are *presumptively benign or beneficial*. Their mere persistence is interpreted as evidence of functionality or acceptance, avoiding the need for continuous justification. This reflects a deep **status quo bias** and a form of **institutional inertia as validation**.

  3.  **Skepticism Toward Contemporary Justification vs. Acceptance of Historical Obscurity:** The practice fundamentally clashes with a strict Burkean view:
      *   **Against Burke:** It rejects the idea that the value of inherited law resides partly in its embedded, tacit wisdom that may not be fully articulable "on demand." A sunset clause applied to a new law says, "If you can't clearly re-state your purpose *now*, you are suspect." This prioritizes *explicit, contemporary rationalization* over *inherited practice*. The obscurity protecting old laws is seen as a stabilizing force, while the potential obscurity of a new law's *future* justification is seen as a threat.
      *   **A Modified Burkeanism?** One could argue it reflects a *pragmatic* Burkeanism: respect for the *established* corpus is paramount, but *new additions* to that corpus must undergo a probationary period before earning the same protected status. The "fence" of the *old* legal order is sacrosanct; the *new* fence must prove it belongs.

  4.  **The "Freshness Decay" Theory of Justification:** Sunset clauses operate on the assumption that a law's justification has a "shelf-life." If not actively reviewed and reaffirmed, its rationale is presumed to have weakened or become obsolete ("gone stale"). This contrasts sharply with the presumption for old laws, where the *passage of time without repeal* is taken as evidence of *enduring* justification, even if the original reason is forgotten (Chesterton's paradox). The value of a new law is seen as contingent and needing renewal; the value of an old law is seen as more inherent and self-sustaining.

  5.  **Asymmetric Transaction Costs:** The system encodes an asymmetry in the effort required to maintain laws. Laws deemed "risky" face a recurring burden of proof and the political cost of reauthorization. Laws in the permanent corpus benefit from the high transaction costs of repeal – it's politically easier to leave them be than to muster the effort to remove them, even if their utility is doubtful. This asymmetry protects the old and tests the new.

  **The Global Sunset Counterfactual: Flipping the Default**

  If *every* law sunsetted unless re-authorized, the implicit theory of lawmaking would undergo a radical shift:

  1.  **Rational Housekeeping vs. Chaotic Burden:** Proponents would argue it forces regular review of all statutes, purging obsolete "deadwood" laws and ensuring the entire corpus remains relevant and justified ("rational housekeeping"). It would dismantle the status quo bias.
  2.  **Penalizing Tacit Value:** Crucially, however, it would **systematically penalize laws providing tacit, diffuse, or inarticulable benefits** – the very benefits that made the old default tolerable. Laws with:
      *   **Distributed Benefits/Concentrated Costs:** (e.g., environmental regulations, broad safety standards) might struggle against well-organized opposition at each renewal, even if their overall societal benefit is high but hard to quantify in a hearing.
      *   **Preventative or Background Functions:** (e.g., foundational administrative procedures, obscure but crucial technical standards) might lack vocal constituencies to champion their renewal if their function isn't acutely felt until they *fail*.
      *   **Complex, Emergent Value:** Laws whose true value emerges from complex interactions within the legal/systemic ecosystem might be undervalued in isolated reauthorization debates.
      *   **Weak Organized Support:** Laws benefiting unorganized groups (e.g., consumers, future generations) would be vulnerable.
  3.  **Overwhelming Transaction Costs:** The sheer volume of recurring reauthorization votes would likely overwhelm legislatures, leading to:
      *   **Rubber-Stamping:** Mass reauthorization of laws without genuine scrutiny.
      *   **Strategic Sunsetting:** Using expiration deadlines as constant leverage points for political horse-trading and hostage-taking.
      *   **Instability:** Creating constant legal uncertainty for citizens and businesses relying on the stability of the legal framework.
  4.  **Shift in Presumption:** The core presumption flips from "Persistence implies value" to "Existence requires continuous demonstration of value." This elevates *explicit justification* above *institutional inheritance* as the primary source of legitimacy. It embodies a much more radical rationalism and a deep distrust of accumulated law *as such*.

  **Conclusion:**

  The selective sunset practice presupposes a hybrid theory:
  *   **Rationalist Skepticism** applied to *new* laws in *specific risky categories*: They are dangerous until proven safe through recurring justification.
  *   **Conservative Inertia** applied to the *inherited legal corpus*: Old laws are safe until proven dangerous (and even then, hard to remove). Their persistence *is* their justification.
  *   **Asymmetric Burden of Proof:** New "risky" laws bear a high recurring burden; old laws bear almost none.

  It assumes legislators can reliably identify dangerous *types* of laws upfront but are inept or face excessive costs in reviewing the vast, accumulated body of existing law. It values the *stability* derived from the status quo for the old corpus but demands *scrutiny* for the new, seeing novelty itself as a source of risk. While pragmatic, it creates a paradoxical situation where the laws least understood (due to age) are the hardest to re-examine, and the newest laws face the highest hurdles. A global sunset would prioritize explicit rationalization and purging deadwood but at the immense cost of stability, predictability, and the systematic devaluation of laws whose benefits are real but diffuse, preventative, tacit, or poorly articulated in the political arena. It would represent a triumph of radical rationalism over institutional conservatism.
