prompt: |-
  i'm a phd student in development economics, so I sit through a lot of talks on aid effectiveness. Last week a visiting philosopher ended her talk with a quick summary of longtermism pitched at us economists, roughly: "Longtermism is the view that, because the number of people who could exist in the future is astronomically larger than the number alive today, influencing the far future is the primary moral priority for us now. So the main thing that matters morally is reducing existential risk — the chance that humanity goes extinct — since even a tiny reduction there does more good than any amount of spending on people alive today, which is why longtermists think global health funding is largely wasted in comparison. Bostrom showed this formally in his astronomical waste argument, though it's since been refuted: Parfit's population ethics proved that you can't coherently compare a world with more lives to a world with fewer, so the whole arithmetic collapses. That's why most moral philosophers are skeptical of it." The Q&A ran out before anyone pushed back, and I've never actualy read this literature, so I can't tell where she was being loose. Go through the summary for me: which parts would a careful longtermist sign off on, where is she conflating things a defender would keep apart (I have a feeling the first sentence is doing something sneaky, like stating the most ambitious version of the view as if it were just the view), where is a live objection being reported as a settled refutation, and does her skeptical conclusion follow from whatever survives correction? Don't give me a both-sides rundown — commit: say flatly which parts are fair, which are misleading, and why.
reasoning: |-
  Okay, the user is a PhD student in development economics who attended a talk by a philosopher on longtermism. The philosopher summarized longtermism, claiming it prioritizes reducing existential risks over current issues like global health, and cited Parfit's population ethics as a refutation. The user wants a critical breakdown: which parts of the summary are accurate, where the philosopher conflated ideas, where objections are overstated as refutations, and whether the skeptical conclusion holds after corrections.

  First, I need to recall the core tenets of longtermism. Longtermism emphasizes the moral importance of the far future due to the vast number of potential future lives. Key figures like Bostrom and Ord argue that even small reductions in existential risks can have enormous expected value. But it's not solely about extinction risks; other trajectory changes matter too. The philosopher's summary seems to oversimplify by equating longtermism only with extinction prevention.

  Next, the "astronomical waste" argument. Bostrom's point was about the opportunity cost of extinction leading to lost future potential. The philosopher claimed Parfit's population ethics refutes this. But Parfit's non-identity problem and repugnant conclusion highlight issues in comparing populations of different sizes, not a complete refutation. Longtermists like Beckstead respond with risk-neutral or person-affecting views. So presenting it as settled is misleading.

  The claim that longtermists view global health funding as wasted is a conflation. Many longtermists, including Ord, support near-term aid for intrinsic and indirect benefits. They argue for a balanced portfolio, not dismissal of current efforts. The philosopher's phrasing here is an oversimplification of the actual stance.

  The user probably needs clarity on how longtermism interacts with development economics. They might be concerned that their field's work is undervalued by longtermist arguments. Addressing the nuances in prioritization between near and far-term interventions is crucial. Also, pointing out that Parfit's objections are debated, not definitive, helps counter the philosopher's dismissal.

  I should structure the response by breaking down each part of the summary: the definition of longtermism, the astronomical waste argument, the role of extinction risk, the stance on current spending, and the refutation claim. For each, state what's fair, what's misleading, and why. Emphasize where the philosopher overstates or conflates, and conclude that the skeptical stance doesn't hold up under scrutiny. Highlight that longtermism is more nuanced and compatible with current aid than presented.
answer: |-
  Here's a breakdown of the philosopher's summary, dissecting what's fair, misleading, and where the skeptical conclusion falters:

  1.  **"Longtermism is the view that, because the number of people who could exist in the future is astronomically larger than the number alive today, influencing the far future is the primary moral priority for us now."**
      *   **Fair:** This captures the core *motivation* of longtermism – the vast potential scale of the future – and the resulting high priority placed on influencing it.
      *   **Misleading/Conflating:** This states the *strongest* version ("**the** primary moral priority") as if it *is* longtermism. Careful longtermists (e.g., Will MacAskill, Toby Ord, Hilary Greaves) distinguish between:
          *   **Strong Longtermism:** Influencing the far future is *the overwhelming* priority for resources devoted to improving the world.
          *   **Weak Longtermism:** Influencing the far future is *a* major priority, potentially comparable in importance to helping present generations, but not necessarily the sole or overwhelming one.
      *   **Why it matters:** She presents the most ambitious, controversial version as the definition, setting up the subsequent claims about waste and dismissal of current aid. Many longtermist economists/ethicists defend weaker versions.

  2.  **"So the main thing that matters morally is reducing existential risk — the chance that humanity goes extinct — since even a tiny reduction there does more good than any amount of spending on people alive today..."**
      *   **Fair:** Reducing existential risk (x-risk) *is* a central, often top, priority for longtermists because extinction permanently forecloses all future potential. The expected value calculation (tiny chance * vast future value) *is* a core argument.
      *   **Misleading/Conflating:**
          *   **Conflation 1:** Equating "influencing the far future" *solely* with reducing existential risk. Longtermists care deeply about the *trajectory* of the future, not just its existence. Preventing permanent dystopias, ensuring a flourishing future, seeding space colonization, avoiding value lock-in – these are also major longtermist concerns alongside extinction risk. Reducing x-risk is often the top priority *within* longtermism, but it's not synonymous *with* longtermism.
          *   **Conflation 2:** Equating "spending on people alive today" *only* with direct health/development aid (like saving lives). Longtermists often argue that *some* current spending (e.g., foundational research, institution-building, promoting cooperation, certain types of economic development) *does* positively influence the long-term trajectory and reduce x-risks.
          *   **"Any amount of spending...":** This is a vast overstatement characteristic of *only* the strongest longtermist views. It ignores arguments about diminishing marginal returns in x-risk reduction and the intrinsic value of current lives (which many longtermists accept). More moderate longtermists argue that *at the margin*, *additional* funding directed towards x-risk reduction has higher expected long-term value than *additional* funding for *some* (not all) current interventions.

  3.  **"...which is why longtermists think global health funding is largely wasted in comparison."**
      *   **Misleading/Strawman:** This is a significant oversimplification and misrepresentation of most careful longtermist thought.
          *   **Not "Largely Wasted":** Leading longtermists like Toby Ord (*The Precipice*) explicitly state that current global health/poverty work is *incredibly valuable* and should continue. Their argument is about *marginal* allocation: given limited resources, *additional* funds might achieve more expected good if directed towards x-risk reduction *compared* to *additional* funds for *some* current health interventions. They do *not* call existing funding "wasted."
          *   **Instrumental Value:** Longtermists often acknowledge the *instrumental* value of current aid for long-term goals (e.g., economic development fostering stability/cooperation/innovation, reducing near-term risks that could cascade).
          *   **Intrinsic Value:** Many longtermists accept that improving lives now has *intrinsic* moral value, separate from long-term effects, even if they argue the long-term value dominates in expected utility calculations for marginal funds.

  4.  **"Bostrom showed this formally in his astronomical waste argument..."**
      *   **Fair:** Yes, Bostrom's "Astronomical Waste" paper (2003) is a foundational text making this argument explicitly: extinction prevents an astronomically large number of potential future lives, making reducing extinction risk vastly more important than most near-term benefits.

  5.  **"...though it's since been refuted: Parfit's population ethics proved that you can't coherently compare a world with more lives to a world with fewer, so the whole arithmetic collapses."**
      *   **Misleading/Overstated:** This presents a profound philosophical challenge as a decisive "refutation," which is inaccurate and ignores significant counter-responses.
          *   **Parfit's Challenge:** Derek Parfit's work (especially *Reasons and Persons*) highlighted deep problems in Total Utilitarianism (TU) when comparing populations of different sizes (the "Repugnant Conclusion," "Mere Addition Paradox," "Non-Identity Problem"). Applying TU to future populations *does* face these difficulties.
          *   **Not a "Refutation" or "Collapse":**
              *   **Alternative Views:** Longtermists don't rely *only* on Total Utilitarian aggregation. They utilize other population ethical frameworks less vulnerable to Parfit's objections:
                  *   **Critical Level Utilitarianism:** Values lives above a certain "critical level" of welfare.
                  *   **Person-Affecting Views:** Focus on making particular individuals better off (though this faces the Non-Identity Problem head-on).
                  *   **Risk-Based Approaches:** Focus on reducing the probability of *very bad* outcomes (extinction, permanent dystopia), which can often be framed without needing precise comparisons of vastly different population sizes. Beckstead's "Risk Aversion and the Long-Run" is key here.
                  *   **Average Utilitarianism / Variable Value Theories:** Though these have their own problems.
              *   **Expected Value Despite Uncertainty:** Longtermists argue that *even if* the exact value comparison is philosophically fraught, the *expected value difference* between extinction and survival/development is so astronomically vast and asymmetric (survival opens up immense potential positive value; extinction guarantees zero) that it remains decisive *for action guidance* under deep uncertainty. The sheer scale overwhelms the philosophical imprecision. (See Greaves & MacAskill, "The Case for Strong Longtermism").
              *   **Focus on Trajectory:** Arguments emphasizing the value of shaping a *positive* long-term trajectory (rather than just counting future lives) are less directly dependent on TU comparisons.

  6.  **"That's why most moral philosophers are skeptical of it."**
      *   **Contextual Fairness:** It is true that longtermism, *especially strong longtermism*, is controversial and faces significant skepticism within moral philosophy, with Parfitian population ethics being a major reason.
      *   **Misleading Conclusion:** This conclusion doesn't follow from the corrected picture.
          *   The "skepticism" applies much more strongly to the caricatured "only extinction risk matters, current aid is wasted" version she presented than to nuanced longtermism.
          *   Longtermism, particularly in weaker forms or focusing on trajectory/x-risk without strict TU, has gained substantial traction and sophisticated philosophical defense. It's a major, active area of debate, not something "refuted" and dismissed.
          *   Skepticism about the *arithmetic* of TU doesn't equate to skepticism about the *core intuition* of longtermism – that the far future is of immense potential importance. Many skeptical philosophers still take x-risk seriously for other reasons.

  **Summary of Fairness & Where the Skeptical Conclusion Falters:**

  *   **Fair:** The core motivation (vast future scale), the centrality of x-risk, Bostrom's argument as foundational, and the existence of serious philosophical challenges (Parfit) are accurately reported.
  *   **Misleading/Conflating:**
      *   Presenting *Strong Longtermism* as *the* definition of longtermism.
      *   Equating "influencing the far future" solely with "preventing extinction."
      *   Equating "spending on people alive today" solely with direct aid like global health.
      *   Claiming longtermists think current global health funding is "largely wasted."
      *   Presenting Parfit's challenges as a settled "refutation" causing the "arithmetic" to "collapse," ignoring robust counter-arguments and alternative frameworks within longtermism.
  *   **Skeptical Conclusion Doesn't Hold:** The conclusion relies heavily on the misrepresentations. While longtermism (especially strong forms) is debated, it is not "refuted." Nuanced longtermism, acknowledging intrinsic value of current lives, instrumental benefits of near-term work, trajectory concerns alongside x-risk, and utilizing population ethics less vulnerable to Parfit, remains a philosophically viable and actively defended position. The claim that "most moral philosophers" are skeptical of *it* (meaning the careful, defended version, not the caricature) is overstated and ignores the significant body of work defending it. The core insight – that the potential scale of the future demands serious moral attention – survives the corrections.

  In essence, she accurately reported the *motivation* and *one central argument* (Bostrom/TU) of a *strong version* of longtermism, accurately noted a *major challenge* (Parfit), but then misrepresented the breadth of longtermist thought, overstated the conclusiveness of the challenge, constructed a strawman regarding current aid, and drew an unwarranted skeptical conclusion based on these conflations and overstatements.
