  First, I recall the standard setup: Beauty is woken once or twice based on a Sunday coin flip. Halfers say P(Heads)=1/2, thirders say 1/3. Now in this late-flip case, Monday awakening is guaranteed before the flip. Some argue timing shouldn't matter; others think it does because she can't have evidence about a future coin flip.

