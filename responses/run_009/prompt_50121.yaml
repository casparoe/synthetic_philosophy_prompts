prompt: |-
  I am three months from delivering a novel to my publisher and deep in revision, and I have become convinced that the hardest decisions in front of me are not decisions about prose at all but about the distribution of moral attention: which characters receive interiority, which are seen only from the outside, whose suffering is dwelt upon and whose is dispatched in a subordinate clause. A friend who teaches philosophy tells me the relevant body of thought is care ethics, and I have gathered enough to attach the usual names to it — Gilligan and the different voice, Noddings on the thick caring-for of particular persons versus the thinner caring-about, Ruddick on maternal thinking, Held on seeing persons as relational rather than as isolated units who meet to bargain. My friend also warns me that care ethics distrusts codification, holding that turning responsiveness into a rulebook is precisely the mistake the justice tradition makes. So I am asking for something its own advocates might call a category error, and I would like you to be candid about that tension rather than dissolve it.

  The concrete situation is this. My novel follows an adult daughter who becomes her mother's caregiver, the home health aide she hires and gradually displaces, and the mother, who has dementia and is frequently cruel to both women. As the draft stands, the daughter receives full interiority, the mother's mind is rendered in fragments, and the aide exists largely as a function — competent, warm, interchangeable. In revision I must decide, scene by scene: who is granted a point of view; whose needs are narrated and whose merely implied; when tedious bodily labor — bathing, repeating, reassuring — deserves pages and when it should be compressed in the name of pacing; and how to render the mother's cruelty without either excusing it through her condition or reducing her to an emblem of decline.

  Please write a procedure I can run on each scene during these three months: the questions to ask in order, what would count as a sufficient answer to each, where the procedure should tell me to accept a cost to pacing or to the reader's sympathy rather than evade it, and where it must hand the decision back to me because it turns on what kind of novel this is, not on care. Then run it on three cases: the bathing scenes I am inclined to cut as repetitive; the aide, whom I suspect of functioning as furniture; and a scene in which the mother says something unforgivable to the daughter. I anticipate that the procedure will return at least one answer I will not like — most likely that the tedium I want cut is exactly what deserves the reader's time, or that the aide must become particular even at the cost of the daughter's primacy — and I would rather hear that than have the procedure defer to my preferences. Please state plainly what the procedure cannot settle, and where following it risks turning the novel into an illustration of a theory rather than a work of fiction.
reasoning: |-
  Okay, let me unpack this complex request. The user is a novelist deep in revisions, grappling with ethical distribution of narrative attention in a caregiving story. They've studied care ethics but recognize its inherent resistance to codification - yet still want a concrete scene-analysis tool. 

  Hmm, the core tension here is fascinating: how to operationalize an anti-rule philosophy into practical writing decisions without betraying its essence. The user explicitly asks not to dissolve this paradox, which means I must design a procedure that maintains productive discomfort. 

  First, I need to establish non-negotiable principles from care ethics: particularity over generalization, resisting hierarchy of suffering, valuing relational labor. But these must translate to actionable questions without becoming rigid rules. The procedural design should have escape valves where artistic intent overrides theory.

  The three test cases are brilliantly chosen to stress-test the framework:
  - Bathing scenes represent undervalued care labor
  - The aide embodies narrative marginalization
  - The cruel moment challenges reductive portrayal of dementia

  For each, the procedure must surface where care ethics demands narrative expansion versus where novelistic concerns legitimately limit it. I'm noticing the user anticipates disagreeing with some outcomes - that's good, it means the framework has teeth.

  Crucially, I'll need to flag decision points where:
  - Pacing/sympathy conflicts with ethical attention
  - Particularity threatens narrative focus
  - Relational description risks didacticism

  The "this is fiction, not theory" warnings should appear at precisely the moments when following care ethics most disrupts conventional storytelling. That's where the user's artistic judgment becomes essential.

  For the aide character specifically, the framework must resist solutions like "add backstory" and instead demand functional re-integration - perhaps through disrupting the daughter's perspective or shared moments of resistance against the mother's cruelty. The bathing scenes might need duration not despite but because of their tedium.

  Throughout, I'll maintain the candor requested: naming when answers are unsatisfying, where theory reaches its limits, and where the procedure might actually damage the novel's vitality if applied dogmatically.
answer: |-
  Here is a procedural framework for distributing moral attention, grounded in care ethics yet acknowledging its tensions with codification and fiction's demands. It prioritizes *questions* over rules, forces confrontation with trade-offs, and flags where artistic vision supersedes theory.

  **The Procedure: Scene Interrogation for Moral Attention**

  Run this sequence for each scene. Answer honestly, not ideally. "Sufficient" answers are those that demonstrate *conscious choice*, not theoretical perfection.

  1.  **Who is *Present* Relationally?**
      *   *Question:* Beyond physical presence, whose needs, vulnerabilities, or actions are *actively shaping* the relational dynamics in this scene? (e.g., the mother's confusion *shapes* the daughter's anxiety, the aide's calm *shapes* the mother's momentary compliance).
      *   *Sufficient Answer:* Identifying 1-3 characters whose relational presence is irreducible to plot function *in this specific scene*. Avoid listing everyone mechanically.
      *   *Cost Warning:* If you exclude someone whose presence *is* relationally active (e.g., the aide silently absorbing the mother's vitriol), you risk flattening relational reality.

  2.  **Whose Labor/Experience is Being Rendered? How?**
      *   *Question:* Whose physical, emotional, or cognitive labor (caregiving, enduring, resisting, degrading) is central here? Is it depicted:
          *   From the *inside* (interiority, sensory detail, thought)?
          *   From the *outside* (observed action, dialogue, effect on others)?
          *   *Compressed* (summary, implication)?
          *   *Ignored*?
      *   *Sufficient Answer:* Explicitly stating *whose* labor/experience is depicted and *by which method(s)*. Acknowledging if compression/omission occurs.
      *   *Cost Warning:* Consistently compressing/omitting the labor of a specific role (e.g., the aide's physical work, the mother's internal confusion) risks dehumanization and replicating societal undervaluation. Ask: "Is this compression truly for pacing/art, or is it because *this* labor makes me/the reader uncomfortable or seems 'uninteresting'?"

  3.  **Whose Suffering/Struggle is Focal? Whose is Peripheral?**
      *   *Question:* Whose pain, frustration, fear, or humiliation is given narrative weight (dwelled upon, detailed, explored)? Whose is acknowledged but not explored? Whose is implied but unstated? Whose is absent from the narrative gaze?
      *   *Sufficient Answer:* Naming whose suffering is focal, peripheral, implied, or absent. Justifying *why* based on POV constraints or narrative focus – but interrogating if those constraints are ethically sufficient *here*.
      *   *Cost Warning:* If suffering is consistently peripheral/absent for a character enduring significant hardship (e.g., the aide's emotional toll, the mother's terror behind cruelty), you risk failing the "particularity" mandate of care ethics. The reader *must* feel the cost, not just be told it exists.

  4.  **Who has Agency/Response? Who is Acted Upon?**
      *   *Question:* Who makes choices (even small, constrained ones) in this scene? Who primarily *reacts*? Who is primarily the object of others' actions/decisions?
      *   *Sufficient Answer:* Identifying characters demonstrating agency (choice, resistance, adaptation) vs. reactivity vs. objectification. Acknowledging the spectrum and context (dementia drastically limits agency).
      *   *Cost Warning:* Consistently rendering a character capable of agency (like the aide) primarily as *acted upon* or purely reactive reinforces their "function" status. Care ethics demands seeing relational *actors*, not just recipients.

  5.  **The Relational Check:**
      *   *Question:* Does the *distribution* of attention (from Qs 1-4) accurately reflect the *mutual*, though unequal, impact these characters have on each other in *this specific interaction*? Or does it artificially isolate them or prioritize one perspective disproportionately?
      *   *Sufficient Answer:* An honest assessment of whether the narrative rendering captures the *web* of impact in the scene, even if focused through one POV. Does it feel relational, or like isolated monads bumping together?
      *   *Handoff Point:* If the *novel's core purpose* demands isolation (e.g., the daughter's profound loneliness) *here*, state that explicitly. Theory yields to core artistic intent.

  6.  **The Compression/Expansion Justification:**
      *   *Question:* For labor/suffering compressed or omitted (identified in Q2/Q3): Is this primarily for *narrative pacing/flow*, *reader endurance* (avoiding gratuitous misery), *maintaining focus* on the core arc, or *avoiding the challenge* of depicting this particular experience authentically?
      *   *Sufficient Answer:* A clear, non-defensive reason beyond "it's boring" or "it's hard." Acknowledging the *ethical cost* of the compression/omission identified in the Cost Warnings above.
      *   *Cost Acceptance:* If pacing/focus *must* win, state: "I accept compressing X's labor/suffering here to maintain Y narrative priority, knowing it risks Z ethical flattening." Be conscious of cumulative effect.

  7.  **The Particularity Mandate (Especially for "Functions"):**
      *   *Question:* For characters consistently rendered from the outside/compressed (like the aide): Does *this scene* offer a legitimate, organic opportunity to reveal a specific, non-functional, non-stereotypical detail: a preference, a memory, a skill, a frustration, a bodily sensation, a fleeting thought, a history hinted? *Without* resorting to forced backstory dump.
      *   *Sufficient Answer:* Identifying *one small, concrete, integrated* way to make the character feel less like an archetype and more like a *particular person* in *this moment* (e.g., the aide adjusts her grip on the washcloth *just so*; she hums half a bar of a specific song; she notices a particular bird outside the window and it triggers a micro-expression).
      *   *Cost Warning:* Refusing this consistently for capable characters is a failure of care ethics. If the daughter's primacy *demands* the aide remain opaque *here*, state it explicitly (Handoff Point).

  **Running the Procedure: Three Cases**

  **Case 1: The Bathing Scenes (Inclined to Cut as Repetitive)**

  1.  **Present Relationally:** Daughter (anxiety, control), Mother (vulnerability, resistance, confusion), Aide (skill, patience, bodily labor). *All are actively shaping it.*
  2.  **Labor Rendered:** Aide's physical/emotional labor (dominant action). Mother's confusion/humiliation. Daughter's emotional labor (watching, managing). *Currently: Aide's labor = external action/compressed; Mother's struggle = fragmented interior/external; Daughter's anxiety = interior.*
  3.  **Suffering Focal:** Daughter's anxiety = focal. Mother's struggle = fragmented focal. Aide's labor/stress = peripheral/compressed.
  4.  **Agency:** Aide = primary agent (doing the work, managing the body). Mother = reactive/resistant. Daughter = reactive/attempting to control.
  5.  **Relational Check:** Focus is on Daughter's interior and Mother's fragments. Aide's experience as *agent* of the labor is compressed/backgrounded. Relational web incomplete.
  6.  **Compression Justification:** Cutting for pacing risks saying this foundational, intimate, recurring labor of care *doesn't deserve narrative time*. Its repetition *is* the reality. Compressing *all* scenes erases the work.
  7.  **Particularity Mandate:** Bathing *is* the aide's domain. Refusing detail here reinforces her function-status.
      *   **Procedure Output:** **DO NOT CUT ALL.** **Expand at least one bathing scene significantly.** Shift focus: Give the Aide more agency/particularity in description. Use Daughter's POV to *observe* the Aide's skill/fatigue/persistence *in detail*. Sit with the tedium and physicality. Let the Mother's fragmented experience be *felt* through the awkwardness of the act. *Cost Accepted:* Pacing slows; reader discomfort with intimacy/vulnerability increases. *Handoff:* You may still compress *some* bathing scenes later, but the *first* or a *critical* one must bear the weight. The "repetition" is the point – show its evolving toll.

  **Case 2: The Aide (Suspected Furniture)**

  1.  **Present Relationally:** *In every scene she's in*, her presence shapes dynamics (calm competence enables daughter's absence; absorbs cruelty; performs essential labor). She is *actively* relational.
  2.  **Labor Rendered:** Consistently external action or compressed summary. Interiority/perception absent. Suffering/responses implied at best.
  3.  **Suffering Focal:** Peripheral or absent. Her endurance is a backdrop.
  4.  **Agency:** Often reduced to competent reaction. Specific choices/initiatives rare or invisible.
  5.  **Relational Check:** She is rendered as an object enabling the daughter-mother dyad, not a relational subject herself. Web is distorted.
  6.  **Compression Justification:** Prioritizing daughter's/mother's story risks treating a central human participant as a tool. Societal undervaluation of care work replicated.
  7.  **Particularity Mandate:** **CRITICAL FAILURE.** Requires consistent application of Q7 across scenes.
      *   **Procedure Output:** **The Aide MUST become particular.** This is non-negotiable for care ethics. Find organic moments *within existing scenes* to reveal her specificity:
          *   *How* she does things (a unique technique, a small sigh, a specific way she tucks a blanket).
          *   *Micro-reactions* to the mother's cruelty or daughter's demands (a tightened jaw, a split-second closed eye, a slight shift in tone).
          *   *One brief, non-expository glimpse* of her life/thought (a worry about her own family hinted in a phone snippet; a fleeting memory triggered by a smell; a private opinion of the daughter's choices shown subtly).
          *   *Cost Accepted:* Daughter's primacy *within her own POV scenes* is diluted, but not erased. The novel becomes richer, more ethically complex, more real. Reader sympathy may fracture – good. *Handoff:* You decide *which* particulars to reveal and *how deeply*, but *some* must be revealed consistently. Avoid turning her into a symbolic victim or a saint.

  **Case 3: The Unforgivable Statement (Mother to Daughter)**

  1.  **Present Relationally:** Explosive dyad (Mother-Daughter), but Aide is likely present – her reaction (shock, withdrawal, discomfort) is part of the relational fallout.
  2.  **Labor Rendered:** Mother's cognitive/emotional labor (producing cruelty? lashing out from fear?). Daughter's emotional labor (receiving, processing). Aide's emotional labor (witnessing, managing fallout). Cruelty itself is a perverse "action."
  3.  **Suffering Focal:** Daughter's devastation = focal. Mother's potential internal state (fear, confusion behind cruelty) = ? Aide's shock/discomfort = ?
  4.  **Agency:** Mother commits the act (even if driven by disease). Daughter is victim but has agency in response. Aide has agency in how she reacts/witnesses.
  5.  **Relational Check:** Danger is reducing Mother to "cruelty emblem" or Daughter solely to "victim." The disease is context, not excuse, but must be part of the rendering. Aide's presence matters.
  6.  **Compression Justification:** N/A (scene likely needs expansion).
  7.  **Particularity Mandate:** Applies to all, but crucial for Mother to avoid caricature.
      *   **Procedure Output:** **Render the cruelty *and* its complex sources relentlessly.**
          *   Show the Daughter's devastation internally *and* her external reaction.
          *   **Crucially:** Show the *Mother's* moment *not just as cruel speech, but as an event within her dementia.* What flickers behind it? Pure malice? Terrified confusion? A fragmented memory distorting the present? A physical sensation triggering rage? *Avoid:* Solely external "monster" rendering *or* heavy-handed "poor sick woman" excusing. Let the horror sit with its ambiguity. The disease doesn't erase the hurt, but it changes its nature.
          *   If Aide is present, show her *particular* reaction – does she freeze? step subtly closer to Daughter? look away? make a small sound? This reveals her relationship to both.
          *   *Cost Accepted:* Reader's desire for simple condemnation or exoneration is thwarted. Pain is prolonged. *Handoff:* The *degree* to which you explore the Mother's internal fragments here depends on the novel's overall balance regarding her perspective. But *some* hint beyond the external cruelty is ethically necessary to avoid reduction.

  **What the Procedure Cannot Settle & The Risks:**

  1.  **The Core Vision Handoff:** The procedure flags ("Handoff Point") where decisions fundamentally depend on *what kind of novel you are writing*. Is it primarily:
      *   A deep dive into the Daughter's psyche and transformation?
      *   An exploration of the Mother's dementia from the inside/outside?
      *   A triptych of three women in a care crucible?
      *   A specific thematic argument about family, duty, or society?
      *   **Care ethics cannot decide this for you.** It can only ask if your rendering within that vision is attentive *enough* to the relational particularity and labor present. The procedure forces you to *name* your core vision when it conflicts with maximal care.

  2.  **The "Enough" Threshold:** How much expansion of tedium? How many particular details for the aide? How deep into the mother's fragments? The procedure demands *conscious choice* and identification of *costs*, but it cannot quantify "sufficient." Only you, as the author, can feel when the narrative embodies "responsiveness" without becoming a treatise. It's a judgment call the procedure illuminates, but doesn't make.

  3.  **Risk of Didacticism/Theory Illustration:** The procedure risks turning scenes into ethical demonstrations if:
      *   Revelations of particularity feel forced, expository, or unrelated to the immediate action (e.g., the aide suddenly monologuing her backstory mid-bath).
      *   Expanding tedium feels like punishment for the reader rather than an authentic immersion conveying weight.
      *   Rendering cruelty with complexity tip-toes into excusing the inexcusable in a way that betrays the victim's experience.
      *   **Mitigation:** Ground every choice in the *specific sensory, emotional, and immediate reality of the scene*. Let ethical attention emerge from the concrete, not illustrate the abstract. Ensure every detail serves character and moment first; let the care ethic be the lens, not the script.

  4.  **Pacing and Reader Sympathy:** The procedure explicitly demands you *accept costs* to pacing and potentially reader sympathy (e.g., for the Daughter) when ethical attention requires it. It cannot tell you the *absolute* limit of that cost for your novel's viability, only that evasion has its own, often dehumanizing, cost. You must find the balance where the ethical weight strengthens, rather than sinks, the narrative.

  **In essence,** this procedure forces you to *look*, to *name*, and to *choose consciously* where your narrative gaze lingers and where it glances away, using the lens of care ethics to interrogate potential blind spots and hierarchies. It won't give easy answers, but it will ensure your difficult decisions are made with your eyes open to the moral weight of narrative attention. Run it ruthlessly. Good luck with the revision.
