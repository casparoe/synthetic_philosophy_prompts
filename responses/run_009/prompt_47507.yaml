  **How to use**: Share the quiz with answers hidden! Reveal the scoring key after readers submit responses. The friction in cases 1–5 will highlight tensions (e.g., steadfast in Case 1 but conciliationist in Case 4?). The "inconsistent" combo warns against cherry-picking intuitions.
