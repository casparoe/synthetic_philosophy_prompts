  ### **Confidence Note on the Mapping**  
  - **High confidence** in separating conciliationist, steadfast, and rational immunity. Cases 1, 2, 4, and 7 cleanly divide them.  
  - **Lower confidence** in the deflationary/conciliationist boundary (they often agree in practice) and akrasia detection. Akrasia hinges on *simultaneously* holding a belief + deeming it irrational—hard to infer from actions alone. I used Q3 as a proxy, but it’s imperfect.  
  - **Least confident in the taxonomy**: The "deflationary" view may not be a true *competitor* to conciliationism/steadfastness but a meta-theory about evidence. Professional debates often blur these lines.  

