  * Weakness: PSR seems arbitrary unless applied universally

  Biggest clash points:
  1. PSR vs no-actual-infinities as starting points
  2. Whether "cause" and "ground" are meaningfully different
  3. How each handles infinite regress (temporal vs explanatory)

  Airport bar works well - neutral ground, forced interaction. Names: "Alex" for Kalam (direct, scientific vibe), "Ben" for Contingency (softer, modal logic feel). 

  Structure outline:
  1. Setup: Casual recognition, establish mutual theism but different approaches
  2. First volley: Alex mocks PSR as overreaching → Ben counters that Kalam secretly relies on it
  3. Physics dependence: Ben attacks Kalam's cosmology anchor → Alex argues it's a strength
