prompt: |-
  I run a fortnightly methods seminar for philosophy graduate students, and my next session — fifty minutes, whiteboard only, no assigned reading — covers the accuracy-first program in formal epistemology: the claim that credences have a single epistemic good, namely accuracy, and that norms like probabilism can be vindicated non-pragmatically by showing that any credence function violating them is dominated by some probability function with respect to every strictly proper scoring rule. The audience is eight students, mostly from ethics and history of philosophy: quick with an argument, but they have never seen a dominance or convexity-style argument, and my last formal session left some of them feeling ambushed by notation, so the plan must ration the mathematics rather than apologize for it.

  To be clear about the deliverable: please don't explain the accuracy-first program to me — I know the material and will be doing the talking. What I want is a plan for the explanation. Specifically:

  First, the dependency structure. What has to be established before the central argument can even be stated — presumably scoring rules, then properness, then dominance — and where in the sequence the expected-utility machinery enters. Can the idea of an expectation be smuggled in through a single well-chosen example, or does the group need a short decision-theory detour first, and if so, how short can I get away with?

  Second, the carrying example. I have been torn between a weather forecaster being scored on past forecasts and a trader whose payoff depends on the price they post; my worry about the forecaster is that being scored feels like being paid, which may invite exactly the pragmatist confusion I want to avoid. Recommend the one case that should carry the whole session, tell me what it must contain and what it must not, and why.

  Third, the misconception map. My guesses at what will go wrong: (a) the circularity charge, that using expectations of epistemic utility presupposes probabilities and so can't vindicate them; (b) the sense that "epistemic utility" is either an oxymoron or a capitulation to instrumental reasoning, collapsing the epistemic into the pragmatic; (c) the assumption that the Brier score is somehow canonical, so that the whole argument looks like an artifact of one arbitrary choice. Tell me which of these are genuine risks, at what point in the sequence each will surface if I've ordered things badly, exactly where to pre-empt each, and what predictable misconception I've missed entirely.

  Fourth, a check: one question I can pose in the last five minutes whose answer would reveal whether the students have grasped the dominance structure of the argument — as opposed to merely having absorbed "inaccuracy is bad."

  Finally, the refusals: what I should openly decline to cover at this level — I assume the geometric proof sketch and anything about imprecise credences — and how to acknowledge those exclusions to the group in a way that reads as triage rather than evasion.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a philosophy instructor preparing a methods seminar on accuracy-first epistemology for grad students with limited formal background. They need a pedagogical plan that addresses four specific challenges: dependency structure, case selection, misconception management, and assessment. 

  First, considering the audience's profile—ethics/history students comfortable with arguments but wary of notation—I need to minimize formal overhead while preserving conceptual rigor. The dependency structure should scaffold concepts sequentially: scoring rules → properness → dominance → expected utility. Crucially, expectations must enter late to avoid circularity accusations, perhaps through a single vivid example rather than a decision-theory detour.

  For the carrying example, I'm weighing two options. The weather forecaster analogy risks pragmatic confusion, while the trader scenario better isolates epistemic utility by framing accuracy as alignment with truth rather than payoff. The key is to strictly avoid any monetary language and emphasize that "scoring" is just a truth-tracking measure. 

  The misconception map requires careful handling. Circularity concerns are the most dangerous; I should pre-empt them by explicitly separating the evaluation framework from the agent's own credences. The oxymoron objection needs addressing through the intrinsic value of truth. And I must stress that the argument holds for any proper scoring rule, not just Brier.

  For assessment, a well-crafted dominance question can test structural understanding—perhaps asking why violating coherence makes domination inevitable. Finally, exclusions like geometric proofs should be framed positively ("here's what we're building toward") rather than as gaps.

  Throughout, the tone must balance accessibility with precision, using notation sparingly but unapologetically when necessary. The goal is to leave students seeing the argument's architecture, not just its conclusion.
answer: |-
  Here’s a battle-tested plan for your session, optimized for clarity and engagement while minimizing formal overload. Focus on **conceptual scaffolding** and **strategic omission**:

  ### **1. Dependency Structure & Sequence**  
  *(Total: 45 mins; Q&A: 5 mins)*  
  *(Whiteboard each step; erase only when superseded)*  

  | **Phase**         | **Time** | **Key Moves**                                                                 |
  |-------------------|----------|-------------------------------------------------------------------------------|
  | **0. Hook**       | 3 min    | "How can we argue that rationality demands coherent beliefs *without* invoking practical costs? Enter *accuracy*: the idea that beliefs aim to match the world." |
  | **1. Scoring Rules** | 10 min  | **Define:** "Tool to measure inaccuracy of credence `c` in proposition `P` when `P` is true/false."<br>- **Example:** Brier score `(1-c)^2` if true; `c^2` if false.<br>- **Crucial:** Show a *table* for 3 credences (0.2, 0.5, 0.8) given truth/falsity. NO expectation yet. |
  | **2. Propriety**  | 7 min    | "A scoring rule is *strictly proper* if your own credence uniquely minimizes expected inaccuracy *by your own lights*."<br>- **Demo:** Calculate expected Brier score for credence 0.6 if you *believe* probability is 0.6 vs. 0.7. Show 0.6 wins. *(Smuggle in expectation here!)*<br>- **Why?** "It rewards *sincerity*: reporting your true belief minimizes expected inaccuracy." |
  | **3. Dominance**  | 10 min   | **Define:** "Credence function A *dominates* B if A is less inaccurate than B *no matter how the world turns out*."<br>- **Toy case:** 2 propositions (P, ~P). Show a non-probabilistic credence (e.g., c(P)=0.8, c(~P)=0.9) vs. a probabilistic one (c(P)=0.8, c(~P)=0.2). Calculate inaccuracy for all 4 truth-value combos. Show non-prob always loses. |
  | **4. The Theorem** | 10 min  | "Accuracy-First Punchline: *Any* incoherent credence function is dominated by a coherent one *for every strictly proper scoring rule.*"<br>- **Stress:** This isn’t about Brier—it holds for *all* such rules. Dominance is universal.<br>- **Connect:** Why probabilism? Because coherence avoids dominance. |
  | **5. Why Not Pragmatic?** | 5 min | Contrast with Dutch books: "Here, 'loss' isn’t money—it’s *epistemic self-sabotage*. You’re *guaranteed* to be less accurate than you could have been." |

  ---

  ### **2. Carrying Example: The Trader**  
  **Why it wins:**  
  - **Avoids pragmatism:** Frame the "price" as a *declaration of confidence*, not a bid. "You post a price representing your credence in 'Asset X will hit $100 by Friday.' Your *epistemic penalty* is how far your price deviates from the *actual outcome* (1 if yes, 0 if no)."  
  - **What to include:**  
    - Show the scoring table (e.g., penalty = (outcome - price)^2).  
    - Contrast incoherent prices (e.g., posting $0.80 for "yes" and $0.90 for "no") vs. coherent ($0.80/$0.20).  
  - **What to exclude:**  
    - NO talk of profit, markets, or risk. Emphasize: "This is *not* about money—it’s a *scaffold* to measure alignment with truth."  

  ---

  ### **3. Misconception Map & Pre-emption**  

  | **Misconception**              | **When it Arises**       | **Pre-emption Strategy**                                                                 |
  |--------------------------------|--------------------------|------------------------------------------------------------------------------------------|
  | **Circularity Charge**         | When defining propriety   | **Pre-empt at Step 2:** "We’re not assuming your credences are *correct*—we’re showing *even by your own standards*, sincerity minimizes *expected* inaccuracy. This doesn’t presuppose your beliefs are rational!" |
  | **"Epistemic Utility = Pragmatism"** | After dominance argument | **Pre-empt at Hook & Close:** Contrast Dutch books ("avoid bankruptcy") with accuracy ("avoid *guaranteed* inaccuracy"). Ask: "Is avoiding *guaranteed factual misalignment* pragmatic, or core to truth-seeking?" |
  | **Brier is Arbitrary**         | When seeing the scoring table | **Pre-empt at Step 4:** "The magic is: *any* strictly proper rule induces this dominance. Brier is just one example—swap in any other proper rule, and incoherence still gets dominated." |
  | **Missing Misconception:**     |                          | **"Dominance requires omniscience!"** <br>→ Clarify at Step 3: "Dominance doesn’t require knowing the truth—it shows that *regardless* of truth, incoherence is strictly suboptimal." |

  ---

  ### **4. Grasp-Check Question**  
  *(Final 5 mins; ask to think individually, then discuss):*  
  > *"Suppose a philosopher says: 'I grant that incoherent credences are dominated. But why should I care? Maybe I’m willing to risk inaccuracy for other epistemic goods, like explanatory simplicity.' How does the accuracy-first program respond?"*  

  **Why it works:** Reveals if they see that (a) accuracy is posited as the *sole* epistemic good, and (b) dominance arguments show incoherence is *unnecessarily* inaccurate—no tradeoffs allowed.  

  ---

  ### **5. Strategic Refusals**  
  **State upfront:** "We’re focusing on the *logic* of the dominance argument today. That means skipping:  
  1. **Geometric proofs:** The core idea is that incoherent credences live outside the 'convex hull'—but we’ll use concrete examples, not vectors.  
  2. **Imprecise credences:** This program *can* extend to them, but it’s debated—today’s dominance argument is for precise credences.  
  3. **Scoring rule axiomatics:** Why 'strictly proper'? Trust me that it’s the right choice—we’ll see *why* via examples."  

  **Frame as triage:** "These are important, but they’re 'Day 2' topics. Today’s goal is to see how *even this stripped-down version* challenges pragmatic vindications of coherence."  

  ### **Session Flow Visual**  
  ```
  Hook → Scoring Rules → Propriety (w/ expectation demo) → Dominance (trader example) → Theorem → Why Not Pragmatic?
  ```
  **Notation ration:** Use `c(P)`, `s(c, true)`, and tables. Avoid integrals, derivatives, or linear algebra.  

  This plan confronts the core argument in 35 minutes, leaving room for dialogue and the grasp check. The trader example isolates epistemic utility, while pre-emptions disarm major objections before they crystallize.  

  Good luck—your cohort is fortunate to have a guide who respects their rigor while avoiding formal ambushes!
