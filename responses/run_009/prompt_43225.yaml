  Now, where do these rules diverge on Darfur? Rule 1 opposes due to feasibility despite moral case. Rule 2 might support if it's not regime change, but feasibility complicates it. Rule 3 opposes due to poor success odds.

  To force her hand, the user needs a hypothetical that isolates authorization vs. feasibility. A Syria-like scenario: chemical attacks (high urgency), UNSC blocked, but feasible with precision strikes. If she supports, Rule 1 or 2 might be her logic. If she opposes, Rule 3 (consequences) is likely. Another test could be a Rwanda-like situation but with rugged terrain. If she still supports, Rule 1 (moral urgency overrides feasibility) is her stance. If she balks, feasibility matters most (Rule 3).

  The user's deeper need is to win the argument by exposing her decision matrix. They want to resolve the cognitive dissonance in her Darfur evasion. By crafting the right hypothetical, they can pinpoint whether feasibility, authorization, or outcomes drive her judgments. Also, maybe they seek validation of their own stance through this intellectual duel. The dinner tradition is as much about their relationship as about foreign policy, so finally "winning" would be personally satisfying after years of debate.
answer: |-
  Based on her pattern, Darfur is likely the case that *breaks* her usual framework, exposing its tensions. Here's the breakdown of her implicit rule, alternative rules, why they conflict on Darfur, and how to force her hand:

  ### The Core Pattern & Most Likely Implicit Rule
  Her decisions consistently prioritize **Preventing Mass Atrocities** but are filtered through **Pragmatic Feasibility & Anti-Imperialism**.

  1.  **Moral Imperative Trumps Legality (Sometimes):** Kosovo (unauthorized) and hypothetical Rwanda (unilateral) show she'll bypass the UNSC for clear, ongoing mass atrocities if intervention seems likely to stop them quickly. Legality is "paperwork" when the moral case is overwhelming *and actionable*.
  2.  **Feasibility Matters:** Kosovo worked (quickly, primarily air power). Sierra Leone was small-scale, achievable, and successful. Iraq failed her feasibility test *on multiple levels*: flawed intelligence, massive scale, nation-building, sectarian chaos (the "rotten through and through" project). Libya initially seemed feasible (no-fly zone) but the mission creep to regime change violated her pragmatism and likely her anti-imperialist instinct (hence her irritation).
  3.  **Anti-Imperialism/Sovereignty Concerns:** This underpins her aversion to Iraq and likely her unease with Libya's outcome. She distinguishes between *stopping killing* (Kosovo, Rwanda, Sierra Leone) and *removing regimes/rebuilding states* (Iraq, arguably Libya's outcome). Sierra Leone worked *because* it was limited to propping up the recognized government against rebels, not imposing a new order.
  4.  **UNSC Authorization is Preferred, Not Absolute:** She uses it when available (Libya, initially) but discards it when blocked for morally urgent cases (Kosovo, Rwanda). It's a legitimacy bonus, not a strict requirement.

  **Her Likely Implicit Rule:** *"Military intervention is justified to halt imminent mass atrocities when there is a high probability of success with limited scope (primarily stopping the killing, not regime change/state-building), prioritizing effectiveness over strict legal authorization. Large-scale invasions or open-ended occupations driven by non-humanitarian motives are illegitimate."*

  ### Why Darfur Breaks This Rule
  Darfur (circa 2003-2008 peak crisis) presents the **worst combination** for her rule:
  *   **Overwhelming Moral Imperative:** Clear ethnic cleansing/genocide happening. Matches Kosovo/Rwanda.
  *   **No UNSC Authorization:** Guaranteed Chinese/Russian vetoes protecting Sudan. Forces the Kosovo/Rwanda scenario.
  *   **Extreme Feasibility Problems:**
      *   **Terrain & Scale:** Vast, remote desert region. Air power alone (like Kosovo) would be far less effective against Janjaweed militias and scattered attacks. No obvious infrastructure targets.
      *   **Ground Troops Required:** Meaningful protection of civilians or IDP camps necessitates large-scale, risky ground deployment. This looks more like Iraq/Libya aftermath than Kosovo/Sierra Leone.
      *   **Geopolitical Quagmire:** Intervention risks direct clash with Sudan's military, drawing in regional actors, becoming a protracted conflict with high costs and uncertain outcome.
      *   **No Clear Exit/Limited Scope:** How do you "stop the killing" without effectively occupying Darfur or toppling the Khartoum regime? The mission inherently blurs into state-level confrontation.
  *   **Anti-Imperialism Trigger:** A major intervention against an Arab/African state, opposed by Russia/China, risks being framed (and potentially becoming) neo-colonial, especially if messy and prolonged.

  **Her Dilemma:** The moral case screams "Kosovo/Rwanda!" but the practical realities scream "Iraq/Libya disaster waiting to happen!" Hence, evasion. **She likely leans against intervention but is deeply uncomfortable admitting it** because it seems to prioritize practicality over stopping genocide – contradicting her Kosovo/Rwanda stance. Supporting it feels like endorsing an impossible, potentially imperialistic quagmire.

  ### Alternative Rules (and Why They Also Struggle with Darfur)
  1.  **"UNSC or Bust (Except Uniquely Clear Genocide)":** Fits Kosovo (genocide, no UNSC), Rwanda (genocide, hypothetical unilateral OK), Libya (UNSC). But Iraq had no genocide *or* UNSC. Sierra Leone had tacit approval but not a classic UNSC Chapter VII mandate. **Darfur Problem:** Was it "genocide"? (Contentious, but she'd likely say yes). So this rule *should* compel her to support unilateral intervention. Her evasion suggests this isn't her *primary* rule, as feasibility concerns override the genocide label.
  2.  **"No Regime Change":** Fits Kosovo (Milosevic stayed initially), Sierra Leone (govt preserved), opposes Iraq/Libya outcome. **Darfur Problem:** Could an intervention *protect civilians* without toppling Bashir? Maybe, but incredibly difficult. Any No-Fly Zone or safe zones directly challenges regime sovereignty. Does "regime change" only mean removing the leader, or also crippling state control? It's a blurry line, making Darfur ambiguous under this rule.
  3.  **"Western-led Only If Quick & Clean":** Fits Kosovo (NATO, relatively quick), Sierra Leone (UK, quick & clean), opposes Iraq/Libya (messy). **Darfur Problem:** There was *no* prospect of a "quick & clean" Western-led intervention in Darfur. The terrain, scale, and geopolitics made it inherently messy. This rule easily justifies opposition, but again, clashes with the moral imperative she accepts for Rwanda/Kosovo.

  ### The Winning Hypothetical to Pose at Dinner
  Forget Darfur for a moment. Force her into the core tension: **"Moral Urgency vs. Feasibility/Scale Risk in an Unauthorized Intervention."**

  > **"Imagine it's March 2012 in Syria. Assad's forces are systematically shelling and starving Homs. Death squads are active. It's clear mass atrocities are escalating towards something like Srebrenica. Satellite intel shows preparations for a massive assault on a trapped civilian population. The UNSC is paralyzed by Russian and Chinese vetoes. The US proposes a *limited* intervention: a precision strike campaign targeting ONLY the artillery batteries and command posts directly responsible for the siege of Homs, explicitly aimed at degrading the *immediate* killing capacity in that one city, with no intent to target Assad himself broadly or invade. No troops on the ground. Based *only* on the Kosovo precedent – overwhelming moral case, blocked UNSC, limited air power objective focused on stopping specific atrocities – would you support this? Why or why not?"**

  **Why this forces her hand:**
  1.  **Moral Imperative is High & Clear:** Echoes Kosovo/Srebrenica/Rwanda.
  2.  **UNSC Blocked:** Like Kosovo.
  3.  **Limited Scope (On Paper):** Focused strikes on specific assets causing imminent massacre. *Not* regime change, *not* invasion. Pure "stop the killing now" like Kosovo's initial justification.
  4.  **Feasibility/Blowback Concerns VERY High:** Strikes on Syrian air defenses/military are far riskier than 1999 Serbia. High chance of escalation, Russian reaction, pilot losses, civilian casualties, mission creep, and failure to actually stop the killing in an urban environment. Potential to make things worse.

  **Her Revealing Answer:**
  *   **If she SUPPORTS it:** Her rule prioritizes the moral imperative and Kosovo precedent *even when feasibility is highly questionable and blowback is likely*. She likely *would* have supported a Darfur intervention despite the risks. Her evasion on Darfur might be due to its *even worse* feasibility than Syria, or historical specifics. You can then press: "So why was Darfur different? Was it just *too* hard? Does that mean feasibility is your real limit, even over genocide?"
  *   **If she OPPOSES it:** Her rule prioritizes pragmatism and risk avoidance *even when the moral case matches Kosovo*. Feasibility/scale/risk of quagmire are her true red lines. She likely *would not* have supported a Darfur intervention. Her Kosovo support is viewed as a unique case where feasibility *worked*, not a general endorsement of bypassing the UNSC under similar moral conditions. You can press: "So Kosovo was the exception? What made it feasible enough to risk it, but not Syria (or Darfur)? Where's that line?"

  **The Win:** This hypothetical strips away historical baggage and focuses purely on the core tension in her reasoning. Her answer will reveal whether "Stopping Atrocities *Right Now*" (Kosovo/Rwanda) or "Avoiding Quagmires/Imperialism" (Iraq/Libya skepticism) is her ultimate trump card *when authorization is impossible*. Darfur's evasion stems from both being true simultaneously – your hypothetical forces a choice. Good luck!
