  The user mentions that Darfur had a strong humanitarian case but no UNSC authorization due to China/Russia vetoes and terrain challenges. So why would she avoid answering? Maybe Darfur sits at a conflict point in her decision matrix. Let me brainstorm possible rules that fit her other stances.

  Rule 1: "UNSC authorization preferred but overridden by extreme moral urgency if feasible." Kosovo fits as extreme urgency (ethnic cleansing) and feasible with air power. Iraq fails on moral urgency (WMD false) and feasibility (quagmire). Libya had authorization but post-intervention chaos might make her reconsider, though she initially supported it. Sierra Leone worked with minimal troops. Rwanda's genocide would justify unilateral action. Darfur's moral urgency is high, but feasibility is low due to terrain and lack of air power solutions. So she might oppose intervention here, explaining her evasion.

  Rule 2: "Anti-regime change unless under strict UN mandate." Kosovo wasn't about regime change; Milosevic stayed initially. Iraq was blatant regime change. Libya's mandate was protection but regime change resulted, which irritates her. Sierra Leone preserved the existing government. Rwanda would be stopping genocide, not regime change. Darfur's intervention wouldn't necessarily target the Sudanese government directly, so maybe she'd support it? But feasibility is still an issue, causing hesitation.

