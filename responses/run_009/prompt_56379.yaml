  The "what would change" question is particularly practical. If we took inevitabilism seriously: Nobels might become team awards, patents could shorten dramatically, species would get descriptive names not eponyms. But would that kill motivation? That's the trillion-dollar question. 

  Noticing they didn't mention gender/colonial biases in current credit systems. Might be worth a footnote - current practices erase marginalized contributors disproportionately. Inevitabilism could actually help correct that by focusing less on individual "heroes". 

