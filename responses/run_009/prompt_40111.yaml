answer: |-
  Here’s a structured Q&A sheet for your talk, anticipating objections by audience segment, ranked by potential damage to your case (high to medium), with rebuttals and strategic notes:

  ---

  ### **Q&A Prep: "The Sneaky Assumptions in ITN's Neglectedness Factor"**
  **Audience:** 15 people (EA regulars, 2 econ grad students, 1 global health pragmatist)  
  **Soft Spot in Your Argument:** *Lack of empirical evidence that "friction" systematically distorts cross-cause comparisons more than other ITN limitations.*  
  **Landmine Question:** *"Can you show a real-world case where adding friction to ITN changes a cause’s priority ranking, and it wasn’t just noise?"* (From econ students)

  ---

  #### **1. The Global Health Pragmatist’s Objection (Highest Damage: Undercuts relevance)**  
  **Objection:**  
  “This feels like academic bikeshedding. In my work, we just calculate cost-per-life-saved. Why layer on abstract meta-frameworks when direct impact measurement exists?”  
  **Reply:**  
  “You’re right that direct CEA is ideal *when possible*. But ITN exists for comparing causes *where CEA is impossible* — like wild animal welfare vs. AI risk. My fix makes ITN more honest about why some high-potential areas lack good CEAs: frictions like measurement problems. This isn’t replacing your work—it’s improving prioritization *between* fields like yours and others.”  
  **Strategy:**  
  - **Concede:** Direct CEA is superior where applicable.  
  - **Hold:** Meta-frameworks are essential for cross-cause allocation when CEAs aren’t comparable.  
  - **Preempt:** Acknowledge friction’s role in *causing* measurement gaps (e.g., neglected tropical diseases pre-2000).

  ---

  #### **2. Econ Grad Students’ Objection (High Damage: Challenges core analogy)**  
  **Objection:**  
  “You’re misapplying efficient markets. Philanthropy isn’t a market—there’s no arbitrage, prices, or profit motive. Isn’t ‘resources follow impact’ just common sense, not an EMH smuggler?”  
  **Reply:**  
  “Fair point—it’s not a literal market. But the *logic* of EMH—that available information is rapidly incorporated into resource flows—still applies. My argument is that in philanthropy, frictions (like moral biases or coordination failures) slow this incorporation. The key isn’t markets per se; it’s the *speed of information/resource diffusion*.”  
  **Strategy:**  
  - **Concede:** EMH terminology is imperfect; philanthropy lacks prices/arbitrage.  
  - **Hold:** The core insight (resource flows lag impact signals due to frictions) stands.  
  - **Preempt:** Cite studies on donor irrationality (e.g., overhead aversion) as "friction evidence."

  ---

  #### **3. Econ Students’ Landmine Question (Quietly Dreaded)**  
  **Objection:**  
  “Can you prove that variation in ‘friction’ across causes leads to *systematic misprioritization* in current ITN? Or is this just adding complexity without changing decisions?”  
  **Reply (If no hard data):**  
  “Great question—I’d love to see this tested empirically. Anecdotally: pandemic prep pre-2020 had low resources despite tractability/importance because of coordination failures and short-termism (frictions). Under standard ITN, it looked ‘high impact because neglected.’ My framework would explicitly flag frictions, avoiding false confidence in the ‘neglected = high marginal value’ inference.”  
  **Fallback:** “Until we have data, we should be *less confident* in ITN rankings for high-friction causes.”  
  **Strategy:** Admit this is theoretical; invite collaboration on testing.

  ---

  #### **4. EA Regulars’ Objection (Medium Damage: Defends status quo)**  
  **Objection:**  
  “Isn’t this overcomplicating ITN? Neglectedness-as-proxy works well enough. Adding ‘friction’ just makes it harder to communicate and compare causes.”  
  **Reply:**  
  “I agree ITN’s simplicity is valuable! But if neglectedness quietly assumes ‘no frictions,’ we risk misranking causes. For example: animal welfare is neglected partly due to moral circle failures (a friction), while asteroid deflection is neglected due to low probability. These demand different solutions! Splitting neglectedness helps target interventions: should we grow the field (reduce friction) or fund existing efforts (low absolute resources)?”  
  **Strategy:**  
  - **Concede:** Don’t abandon ITN; refine it.  
  - **Hold:** Ignoring friction causes hidden errors.  
  - **Preempt:** Show a visual of how "animal welfare vs. biosecurity" rankings shift under the split framework.

  ---

  #### **5. EA Regulars’ Pushback (Medium Damage: Community identity)**  
  **Objection:**  
  “This feels like an attack on 80k’s work. Their cause profiles *do* discuss ‘why neglected’—like institutional barriers or controversial causes. Aren’t you just renaming that?”  
  **Reply:**  
  “Absolutely—80k’s qualitative analysis is excellent! But by collapsing those reasons into a single ‘neglectedness score,’ we lose nuance. My proposal systematizes this: making ‘friction’ a explicit parameter helps quantify *how fixable* neglect is. This isn’t criticism—it’s building on their work to make prioritization more rigorous.”  
  **Strategy:**  
  - Praise 80k’s groundwork.  
  - Argue that parameterizing friction enables better meta-analyses.

  ---

  ### **Summary: Key Defense Points**
  1. **Preempt the Soft Spot:**  
     *Early in Q&A, say:* “Now, I haven’t yet tested this with data—this is a conceptual critique. But if we accept that frictions vary wildly (e.g., AI safety’s talent bottlenecks vs. malaria bed nets’ funding gaps), failing to model them risks apples-to-oranges comparisons.”  
  2. **Neutralize the Pragmatist:**  
     Frame friction as *explaining* why some causes lack good CEAs—making ITN more useful for *their* work.  
  3. **Flatter the Econ Students:**  
     “Your EMH point is sharp! Let me refine: it’s about *information/resource viscosity* in philanthropy, not literal markets.”  
  4. **Reassure EA Regulars:**  
     Position this as an *evolution* of ITN, not a rejection. Stress that friction analysis helps *diagnose how to fix* neglect.

  **Final Tip:** End with: “This is a work in progress—I’d value your collaboration to pressure-test it.” Disarms critics and invites allies.  

  Let me know if you'd like slides tailored to these objections!
