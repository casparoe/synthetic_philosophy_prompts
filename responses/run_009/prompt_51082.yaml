answer: |-
  Here are five technical distinctions in Augustine's doctrine of lying:

  1.  **Intentional Deception Defines the Lie:** For Augustine, a lie is constituted solely by the speaker's *intention* to express something contrary to their own mind (*contra mentem suam loqui*), irrespective of the factual truth or falsity of the words spoken. A false statement spoken mistakenly is not a lie, while a true statement spoken *with the intent* to deceive *is* a lie.
  2.  **Literal Truth Offers No Protection:** Augustine explicitly rejects the permissibility of statements that are technically or literally true but are knowingly designed to mislead the listener. This includes irony used deceptively, ambiguous phrasing intended to create false belief, and even deceptive jokes – the speaker's deceptive intent overrides the literal meaning.
  3.  **Hierarchy of Sin Based on Motive, Not Absolution:** While maintaining all lies are sinful, Augustine classifies lies into eight categories based *only* on the speaker's motive, establishing a hierarchy of gravity. "Helpful" lies (e.g., to save life) are considered the least grievous, but remain sinful; lies motivated by direct malice are the worst. The classification highlights the varying *degree* of sinfulness while never negating the *presence* of sin.
  4.  **Divine Command Overrides Human Interpretation of Deception:** When confronted with biblical episodes where figures like Abraham or Jacob appear to deceive, Augustine argues these actions are not truly lies because God, the ultimate author of Scripture, commanded or sanctioned the act. The human agent becomes an instrument of a divine truth beyond their full comprehension, thus their speech, while *appearing* deceptive to human observers, aligns with the higher divine will and intention.
  5.  **Ontological Injury to the Soul:** Augustine grounds the absolute prohibition in an ontological framework: lying violates the rational soul's fundamental nature and purpose, which is oriented towards truth as participation in God, who is Truth itself. Every lie, therefore, is an act of self-harm, a perversion of the soul's essence and its divinely ordered function, corrupting the liar from within.
