prompt: |-
  I'm a graduate TA in charge of next week's section for an introductory epistemology course, on Gettier problems. The complication is that the students have already read the textbook chapter and seen the classic cases online, so they arrive treating them as trivia to recite rather than as something to understand; my fifty-minute section therefore cannot just be a retelling. Plan the section for me. What has to be in place first — I suspect the point that the three traditional conditions are separately satisfiable, but you should tell me if the dependency runs differently — before a Gettier case reads as a counterexample rather than as a story about someone who got lucky? Which misconceptions should I expect (my guesses: "Gettier proved that we can never really know anything" and "the problem is just luck"), and where in the sequence should each be defused? Construct one carrying example the students will not have seen, designed so that the belief's justification and its truth are visibly unrelated, and specify what that example must not contain if it is to do its job. Close with one question whose correct answer would show they grasp why the cases work, and tell me what to openly decline to cover at this level — say, the post-Gettier literature on no-false-lemmas and safety — and how to say so without seeming dismissive.
