prompt: |-
  I am a recently retired endocrinologist who has taken up reading philosophy in earnest, and I find myself increasingly preoccupied with a problem that my clinical career brushed against daily but never named. In medicine, some of our most robust causal knowledge concerns absences: scurvy from the lack of vitamin C, cretinism from iodine deficiency in the mother, diabetic ketoacidosis from the absence of insulin. We routinely say that a failure to treat caused the death, that the missing hormone caused the deformity, that a missed dose caused the relapse. Yet the philosophers inform me that causation by omission is a notorious muddle: the gardener who fails to water the flowers supposedly causes their death, but then so does everyone else in the world who did not water them, and the drought, and the neighbour's forgotten hose. Before I wade further into the literature, I want the specification first. Please write the desiderata that any adequate theory of causation by omission must meet: the cases it has to classify correctly, the distinctions it must respect (for instance, between genuine causation by absence and the mere absence of a cause, or between physical causation and moral accountability — I gather the courts care about the latter), the results from ordinary science it cannot contradict, and the triviality problem it must defuse somehow. With each requirement, give the case or consideration that motivates it, and mark which requirements you take to be non-negotiable for any theory whatever and which are instead the prejudices of one camp, so that I can see where the genuine disagreement lies.

  Two further things I would like. First, tell me whether any subset of your desiderata is jointly unsatisfiable — I am told some philosophers bite the bullet and deny that omissions cause anything at all, and if your list forces that conclusion, say so plainly rather than hiding it in a footnote. Second, briefly assess how the main contenders you know of fare against the list; I have in mind the counterfactual approach as Lewis and his successors developed it, the view that absences never strictly cause but only explain in some weaker sense, the account that treats omissions as genuine absences of connection between distinct causal processes, and any interventionist treatment in which one manipulates a variable standing in for the absence. Keep the weight on the criteria rather than the scorecard — the criteria are where the thinking is, and I can grade the theories myself once I hold a decent list. Please write in British English, and feel free to be technical where the subject demands it; my decades of reading trial data have left me unafraid of dense prose, though I would rather not wade through jargon that does no work.
reasoning: |-
  Okay, the user is a recently retired endocrinologist diving into philosophy, specifically the problem of causation by omission. They've encountered this in their medical career—cases like scurvy from lack of vitamin C or death from untreated conditions—but now see it's a philosophical quagmire. They want a clear set of desiderata for any theory of causation by omission, with motivations, distinctions, and non-negotiables. They also want to know if some desiderata conflict and how main theories stack up.

  First, I need to outline the key requirements. The user mentioned several points: cases like medical omissions, the problem of over-inclusion (everyone not watering the plant), distinctions between causation and moral responsibility, compatibility with science, and avoiding triviality. These form the core desiderata.

  Starting with medical cases. Real-world examples like insulin absence causing ketoacidosis are crucial. Any theory must classify these as causal, not just explanatory. This is non-negotiable because denying it contradicts established science. Then there's the distinction between genuine causation and preemption. For instance, if a parent forgets to feed a child but a neighbor does, the parent's omission isn't causal. The theory must handle such cases without overextending.

  The over-inclusion problem is critical. If not watering a plant counts as causation, then everyone who didn't water it becomes a cause, which is absurd. A theory must resolve this, possibly by introducing normative or contextual factors. But this ties into the distinction between causation and moral responsibility. The courts care about blame, but causation itself might be broader. The desideratum here is to separate the two without conflating them.

  Compatibility with science is non-negotiable. Theories can't contradict well-established causal knowledge in fields like medicine. Also, the theory must avoid collapsing into triviality, where every absence is causal, making the concept meaningless. This requires a robust mechanism to filter relevant omissions.

  Now, are any desiderata jointly unsatisfiable? The medical cases demand that omissions can be causes, but the over-inclusion problem and triviality challenge that. Some philosophers, like those denying causal efficacy of absences, might bite the bullet here. But that conflicts with medical science, so it's a major point of contention.

  Assessing theories: Counterfactual approaches (Lewis) use dependence but struggle with over-inclusion. Adding a "normal conditions" fix helps but is vague. Process theories deny omissions as causes, which fails the medical cases. Disconnection views might work but need refinement. Interventionism handles variables well but may miss intrinsic properties.

  The user needs clarity on where conflicts arise, especially between scientific necessity and philosophical coherence. Highlighting that some desiderata force a choice—like accepting over-inclusion or denying omissions as causes—shows the core debate. Their medical background means they'll prioritize empirical adequacy, so theories rejecting omissions won't satisfy them. Interventionism seems promising but must address context-dependence without circularity.
answer: |-
  Here is a structured specification of desiderata for a theory of causation by omission, motivated by cases and distinctions, with assessments of negotiability, potential conflicts, and a brief evaluation of major approaches. I'll employ British English and avoid superfluous jargon.

  ### Core Desiderata for a Theory of Causation by Omission

  1.  **Accommodate Robust Medical/Scientific Cases (Non-Negotiable):**
      *   **Desideratum:** The theory must classify paradigmatic medical absences as genuine causes (e.g., lack of vitamin C causes scurvy; absence of insulin causes diabetic ketoacidosis; maternal iodine deficiency causes cretinism; failure to administer antibiotics causes death in bacterial sepsis).
      *   **Motivation:** These are empirically well-established causal relations central to biomedical science and practice. Denying them outright contradicts foundational scientific knowledge and renders medical reasoning incoherent. Any theory failing here is empirically inadequate.
      *   **Distinction:** This targets the core phenomenon requiring explanation.

  2.  **Resolve the Over-Inclusion/Triviality Problem (Non-Negotiable):**
      *   **Desideratum:** The theory must provide principled criteria to distinguish the *relevant* omission (e.g., the gardener failing to water) from the infinite, irrelevant absences (e.g., the Queen not watering, the drought occurring, the neighbour's hose being forgotten).
      *   **Motivation:** The "Gardener Case" highlights the core problem: if omissions cause, why aren't all non-actors causes? A theory must avoid making causation ubiquitous and trivial ("everything causes everything by not preventing it"). Failure renders the concept of causation useless.
      *   **Distinction:** Separates genuine causal relevance from mere logical possibility or counterfactual dependence on irrelevant non-actors.

  3.  **Distinguish Genuine Causation by Omission from the Mere Absence of a Cause (Non-Negotiable):**
      *   **Desideratum:** The theory must differentiate between:
          *   (a) An absence *actively causing* a specific outcome (e.g., *lack of insulin* causing hyperglycaemia and ketoacidosis).
          *   (b) The *mere lack of a preventing cause* for an outcome initiated by a positive process (e.g., the *absence of a fire engine* not preventing a house burning down *started by arson*). Here, the arsonist's match is the primary cause; the fire engine's absence is a background condition enabling the fire's *full effect*, not the cause *of the fire*.
      *   **Motivation:** Confusing (a) and (b) leads to misattribution of causal responsibility. Medical cases like insulin lack are clearly type (a). Many "but-for" omissions are type (b). A theory needs a mechanism to tell them apart.

  4.  **Distinguish Physical Causation from Moral/Legal Accountability (Crucial Distinction):**
      *   **Desideratum:** The theory must provide an account of *physical causation by omission* that is conceptually separable from, though potentially foundational for, judgements of *moral responsibility, blame, or legal liability*.
      *   **Motivation:** The law often finds people liable for harms caused by omissions where there was a *duty to act* (e.g., a parent failing to feed a child; a doctor neglecting a patient). However, causation itself is a broader physical/metaphysical relation. The gardener causes the death (physical causation) but isn't blameworthy without a duty; the parent with a duty is both causally responsible and blameworthy. A theory must avoid conflating the metaphysical 'cause' with the normative 'culpability'.
      *   **Distinction:** Separates the descriptive/metaphysical ("Did this absence cause that event?") from the normative ("Is this agent blameworthy for failing to prevent it?").

  5.  **Account for Pre-emption and Overdetermination Involving Omissions:**
      *   **Desideratum:** The theory must handle cases where an omission is pre-empted or where multiple omissions could individually suffice (overdetermination).
      *   **Motivation:**
          *   *Pre-emption:* Nurse A *fails* to give the critical drug, but Nurse B *does* give it, saving the patient. Did Nurse A's omission *cause* anything? Intuitively, no, it was pre-empted. Similarly, if Backup Generator 1 fails but Backup Generator 2 kicks in, Gen1's failure didn't cause the blackout.
          *   *Overdetermination:* Both parents independently forget to feed the infant; either feeding would have prevented death. Did both omissions cause the death? Or just the conjunction?
      *   **Distinction:** Tests the robustness and structure of the causal relation posited by the theory.

  6.  **Compatibility with General Causal Principles (Non-Negotiable Core, Negotiable Specifics):**
      *   **Desideratum:** The theory's account of omissions must not fundamentally violate widely accepted principles of causation derived from positive causation, *unless* compellingly justified. Key principles include:
          *   *Transitivity (qualified):* If A causes B and B causes C, then A causes C (usually holds, but exceptions exist).
          *   *Locality/Spatio-Temporal Connection:* Causes and effects are typically connected through space and time.
          *   *Intrinsicness:* The causal efficacy of an event shouldn't depend *solely* on extrinsic, relational properties (a challenge for omissions).
      *   **Motivation:** To maintain a unified theory of causation. Radically divorcing omission-causation risks making it *sui generis* and disconnected from science. However, some philosophers argue omissions *are* fundamentally different, challenging strict locality/intrinsicness.
      *   **Distinction:** Highlights tension between a unified causal metaphysics and the unique features of absences.

  7.  **Avoid Collapse into Pure Counterfactual Dependence or Pure Normativity (Non-Negotiable):**
      *   **Desideratum:** While counterfactuals or norms may play a role, the theory cannot define causation by omission *solely* as counterfactual dependence or *solely* as the violation of a norm/duty.
      *   **Motivation:**
          *   *Counterfactual:* Pure counterfactual dependence (B wouldn't have occurred if A hadn't been absent) suffers the over-inclusion problem (Queen, neighbour, etc.).
          *   *Normative:* Defining causation solely by duty violates Desideratum 4 and fails Desideratum 1 (vitamin C lack causes scurvy independently of anyone's duty to provide it).
      *   **Distinction:** Ensures the theory provides a genuinely *causal* account, not merely an explanatory or normative one.

  **Assessment of Joint Satisfiability and the "Biting the Bullet" Option:**
  *   Desiderata 1 (Medical Cases) and 2 (Over-Inclusion) create significant tension. Satisfying 1 requires omissions to be causes; satisfying 2 requires strict limits on *which* omissions count. This is the core battleground.
  *   **Is there a conflict?** Desiderata 1 and 2 *are* jointly satisfiable, but doing so requires a robust solution to the over-inclusion problem that doesn't simply eliminate paradigmatic medical cases. The bullet-biting position (denying omissions are *ever* genuine causes) *resolves* the tension by rejecting Desideratum 1 outright. Proponents (e.g., some process theorists) argue these cases involve positive causes (metabolic processes gone awry due to the *presence* of no insulin, etc.) or are merely explanatory/counterfactual dependencies. However, this stance appears radically revisionist against established scientific and medical discourse, violating Desideratum 1 and arguably 6 (compatibility). Most theories attempt the joint satisfaction.

  **Brief Assessment of Major Theories Against the Desiderata:**

  1.  **Counterfactual (Lewisian & successors):**
      *   *Core Idea:* Omission O (of event E) causes outcome B iff (i) O occurs (E does not occur), (ii) if O had not occurred (i.e., if E had occurred), B would not have occurred (or its probability would be significantly lower). Relies on possible worlds similarity.
      *   *Strengths:* Naturally satisfies Desideratum 1 (medical cases). Can handle pre-emption (Desideratum 5) with careful similarity metrics.
      *   *Weaknesses:* Direcly faces Desideratum 2 (Over-Inclusion). Lewis's solution ("causation as influence," "de facto" dependence, or pragmatics/norms) is widely seen as inadequate or needing heavy supplementation. Struggles with Desideratum 3 (distinguishing cause from enabler). Desideratum 6 (Locality/Intrinsicness) is problematic (causal status highly context-dependent). Desideratum 7 is a constant threat.

  2.  **Omissions are not Causes (Only Explanations/Quasi-Causes):**
      *   *Core Idea:* Absences lack spatio-temporal location, energy, or "oomph." Genuine causation requires positive events/processes. Talk of "causation by omission" is shorthand for explanatory contexts highlighting *preventable* harm due to *expected* interventions not occurring, or for counterfactual dependencies, often tied to norms (Desideratum 4).
      *   *Strengths:* Easily satisfies Desiderata 2, 3, 6, 7. Avoids metaphysical weirdness of non-existent causes.
      *   *Weaknesses:* Radically fails Desideratum 1. Requires reinterpreting vast swathes of scientific and everyday causal discourse as non-literal. Struggles to capture the *force* of "the lack of insulin *caused* his coma" compared to "metabolic derangement caused his coma" – the absence seems specifically *causal* in medical reasoning. Fails to satisfy the core demand of the endocrinologist's experience.

  3.  **Disconnection/Prevention Models (e.g., Dowe, Schaffer):**
      *   *Core Idea:* Causation involves conserved quantity transfers (Dowe) or intrinsic relations (Schaffer). Omissions cause by *preventing* a process that *would have* prevented the outcome. The absence itself isn't a cause; rather, the *absence of prevention* allows the outcome-causing process to proceed unimpeded. A causes B by omission if A's inaction *disconnects* a preventing process from B.
      *   *Strengths:* Better respects Desideratum 6 (locality/spatio-temporal connection via the preventing process). Can address Desideratum 2 by focusing on *specific, expected* preventing processes. Handles Desideratum 3 clearly (genuine omission causation *is* preventing prevention). Compatible with Desideratum 1.
      *   *Weaknesses:* Defining "expected" or "specific" preventing processes risks smuggling in norms or context (Desideratum 4, 7). Can become complex with chains of prevention. May struggle with pure absence-as-initial-cause (e.g., primordial lack of a critical element causing a cosmic effect) lacking a pre-existing preventing process.

  4.  **Interventionist/Manipulationist (e.g., Woodward):**
      *   *Core Idea:* Variable X (representing presence/absence) causes variable Y iff there is a possible intervention on X that changes Y (or its probability), holding other relevant variables fixed at some background context.
      *   *Strengths:* Excellent fit for science (Desideratum 1, 6). Naturally handles Desideratum 5 (pre-emption, overdetermination) via explicit variable sets and interventions. Provides tools for Desideratum 3 (distinguishing cause from background/enabler via invariance/testing). Pragmatic about Desideratum 2 - the "relevant variables" and background context implicitly define which omissions are potential causes (e.g., fixing the gardener's role makes their inaction relevant).
      *   *Weaknesses:* The reliance on "relevant variables" and "background context" is context-dependent and potentially circular/vague regarding Desiderata 2 and 4. What counts as a relevant variable/intervention can be normative/pragmatic, risking violation of Desideratum 7. Doesn't fully resolve the intrinsicness worry (Desideratum 6) – the causal status remains relational.

  **Conclusion on Desiderata:**
  The non-negotiable core demands that a theory must satisfy Desiderata 1 (Medical Cases) and 2 (Over-Inclusion) simultaneously, without collapsing causation into pure counterfactuals or normativity (Desideratum 7), while respecting the physical/normative distinction (Desideratum 4). The key tension lies precisely here. Theories that deny omissions as causes (Option 2) solve 2, 3, 4, 6, 7 but fail 1 catastrophically. Counterfactual theories (Option 1) easily satisfy 1 but struggle mightily with 2 and 7. Disconnection (Option 3) and Interventionist (Option 4) models offer the most promising paths for jointly satisfying 1 and 2, albeit by incorporating contextual/normative elements to constrain relevance, which then requires careful management to avoid violating 4 and 7. Interventionism currently holds significant sway in philosophy of science due to its fit with scientific practice and ability to handle complex cases, making it a strong starting point for your exploration, despite its contextual nature. The genuine disagreements centre on whether contextual/normative elements are fatal flaws (violating intrinsicness/Desideratum 7) or necessary pragmatic tools for solving the over-inclusion problem while respecting science.
