prompt: |-
  I write novels, and I have come to suspect that promise-breaking is the sharpest instrument I own for moving a reader's sympathies: the same act — a character not doing what she said she would — sometimes costs her the reader's affection and sometimes costs her nothing, and I would like to know what principle governs the difference. I have verdicts on a set of cases, drawn from scenes I have written or watched readers respond to, and I want to know what, if anything, they add up to.

  A woman promises her dying sister never to sell the family orchard; thirty years later, ruined, she sells it, and readers forgive her. A man promises, at gunpoint, to stay away from a town, and no reader thinks the promise binds him at all. A widow keeps a promise to her dead husband never to open the box of letters he left her, and when she opens it readers treat her as having betrayed him — even though he is dead, cannot be harmed, and will never know. By contrast, a character who solemnly vows to himself never to drink again and then drinks is pitied as weak, not condemned as a promise-breaker; the vow seems to bind no one. A mother makes her daughter promise never to put her in a home; keeping the promise grinds the daughter's life away, and readers feel the wrong lies with the mother for asking, not the daughter for complying or for chafing. And readers weigh the gravity of the asking: a promise made casually and forgotten is a flaw of memory; the same words after a formal undertaking are a stain.

  Is there a single account of why promises bind — reliance, the practice, the promisee's autonomy, something else — that delivers all of these verdicts on reader sympathy? In particular, I want to know whether the widow and the self-vow case, which look structurally alike, can both be saved, or which has to go. And since I invent these scenes rather than find them, tell me whether the readers' sympathies track the real ground of promissory obligation or only a narrative convention about what keeping one's word signals about character — because if the two can come apart, that is exactly the gap a novelist like me works in. As a test, tell me what your account predicts for a case I have not listed: a character explicitly released from a promise by its living beneficiary, who keeps it anyway at real cost. Do readers admire her, or find her rigid, and should the philosopher agree with them?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist exploring how promise-breaking affects reader sympathy. They’ve provided several scenarios with different outcomes. The key is figuring out why some broken promises lose reader sympathy while others don’t. 

  First, I need to identify the common threads in their examples. The orchard seller is forgiven, the guy at gunpoint isn’t bound, the widow is condemned for opening the box, the self-vow drinker is pitied, the daughter is seen as wronged by the mother's demand. Also, the formality of the promise matters. 

  The user’s main questions are: Is there a unified theory explaining all these? Why do the widow and self-vow cases differ despite similar structure? And do reader sympathies align with real moral obligations or narrative conventions?

  I should start by recalling philosophical theories of promises—deontology, utilitarianism, reliance, convention, autonomy. But the user is interested in narrative impact, so I need to bridge philosophy and storytelling. The widow's case is crucial. Even though the husband is dead, readers feel betrayal. That suggests the obligation isn't just about consequences but about the act itself. The self-vow case lacks an external promisee, so the obligation feels different. That points to autonomy as key; promises to others impose duties, but self-vows are about personal integrity. 

  The mother-daughter example shows that the promise's demand can be unethical, making the promisor a victim. Here, the issue is the promisee's overreach, not the promisor's failure. The gunpoint scenario involves coercion, voiding the promise. The orchard seller’s changed circumstances justify breaking the promise. 

  So, autonomy theory seems to fit best. Promises respect the promisee's autonomy, but if the promisee's demand is harmful or the context changes drastically, breaking it isn’t blameworthy. Self-vows are internal, so breaking them shows weakness, not betrayal. 

  Now, the test case: someone released from a promise but keeps it at cost. Philosophically, if released, there’s no obligation. Keeping it might show admirable loyalty or foolish rigidity. Readers might split based on context. If the cost is high and the reason unclear, they might see it as rigid. If it’s about personal integrity, they might admire it. The philosopher would say no obligation, but narratively, it’s about character portrayal. 

  The user’s deeper need might be understanding how to manipulate reader sympathy through promises. They want to know when breaking a promise makes a character relatable (or not) and whether that aligns with real morality. The gap between moral philosophy and narrative convention is where they can craft nuanced characters. For example, a character keeping a released promise could be tragic (if rigid) or noble (if principled), depending on presentation. 

  I should also consider cultural norms in storytelling. Promises to the dead are often sacred in narratives, amplifying betrayal. Self-vows are internal struggles, evoking pity. The user can exploit these conventions to shape reader reactions, even if philosophically debatable. 

  In conclusion, autonomy theory explains the verdicts, and narrative conventions amplify certain aspects. The widow and self-vow cases are different because one involves another's autonomy, the other doesn’t. The test case’s reception depends on how the narrative frames the character’s motivation. The user’s toolbox includes moral ambiguity, cultural tropes, and character depth to navigate the sympathy gap.
answer: |-
  Your intuition is razor-sharp, and your cases perfectly illustrate the nuanced dance between promise-breaking and reader sympathy. There *is* a coherent principle underlying these reactions: **promissory obligation derives its binding force primarily from respect for the promisee's legitimate autonomy, but its weight and the consequences of breaking it are dynamically assessed by readers based on context, purpose, reciprocity, and the character's own moral agency.**

  Here's how the **Autonomy-Respect Model** explains your cases and answers your questions:

  1.  **The Core Principle:** A promise gains moral weight when it involves a **voluntary, informed commitment made to another person (or entity with moral standing) that is reasonably intended to invoke trust and reliance, concerning a matter within the legitimate sphere of the promisee's interests.** Breaking it disrespects that person's autonomy by undermining their ability to plan, trust, and shape their world based on your word.

  2.  **Applying the Model to Your Cases:**
      *   **Dying Sister's Orchard (Forgiven):** The sister's autonomy *was* genuinely engaged – her dying wish reflects a deep personal interest. However, *context radically changed* (ruin). Keeping the promise becomes impossible or self-destructively unreasonable. Breaking it respects the *purpose* (family legacy?) less rigidly, but crucially, the *sister's autonomy is no longer actively engaged* (she's dead, the world has changed). Readers forgive because the *current* demands of the promisor's own survival/agency outweigh the *residual* autonomy claim.
      *   **Gunpoint Promise (Not Binding):** No legitimate autonomy claim. The promisee uses coercion, violating the promisor's autonomy *first*. The "promise" is extracted under duress, nullifying any reciprocal obligation. The promisee has no moral right to demand reliance based on force.
      *   **Widow & the Box (Condemned):** **Crucial Case.** The husband's autonomy *was* deeply engaged when he made the request (concern for privacy, legacy, control over his memory). The promise was likely solemn and central to his dying wishes. His death doesn't erase the *moral weight* of the commitment made *to him* concerning *his* legitimate interests. Breaking it feels like a betrayal *of him* – disrespecting his past autonomy and the trust he placed in her. It violates the *purpose* understood at the time. Readers perceive harm to his *memory* or the *integrity of the relationship*.
      *   **Self-Vow to Sobriety (Pitied, Not Condemned):** **Structural Contrast with Widow.** There is *no external promisee*. You cannot disrespect your *own* autonomy by breaking a promise *to yourself* in the same way. The obligation is entirely internal and forward-looking (to your future self). Breaking it demonstrates weakness, failed resolve, or addiction's power, evoking pity or frustration. It's a failure of *self-governance*, not a betrayal *of another*. The "binding" force is psychological, not interpersonal moral obligation.
      *   **Mother's Demand / Daughter's Promise (Wrong lies with Mother):** The mother abuses the promise mechanism. Her demand (never put her in a home) is potentially unreasonable, controlling, and fails to respect the *daughter's* future autonomy and well-being. The promise extracted exploits filial duty. While the daughter made a commitment, the *mother's claim on her autonomy through this promise is illegitimate* or becomes so due to changing circumstances/impact. Keeping it becomes servitude, not respect. Readers blame the mother for making an unethical demand that disregards the daughter's life.
      *   **Formality vs. Casualness:** Formality signals the *intent* to invoke serious reliance and marks the importance *to the promisee*. A casual promise might not reasonably invoke deep reliance. Forgetting it is careless, but breaking a formal pledge after invoking deep trust is a deeper betrayal of the promisee's autonomy.

  3.  **Saving the Widow & Self-Vow Cases:** The model *does* save both by highlighting the fundamental difference: **an external promisee with legitimate autonomy interests vs. an internal commitment.** The widow betrays her *husband's* past autonomy and trust. The self-vower fails their *own* future self/goals. The structure (vow + breaking) is similar, but the *moral relationship* is fundamentally different. One is interpersonal betrayal; the other is intrapersonal failure.

  4.  **Sympathy vs. Obligation: The Novelist's Gap:** Reader sympathies *track a narrative interpretation* of promissory obligation heavily influenced by the Autonomy-Respect model, but amplified by **narrative conventions about character and consequence**:
      *   **Character Signaling:** Keeping a promise often signals integrity, trustworthiness, loyalty. Breaking one signals unreliability, weakness, or selfishness. *But context modulates this:* Breaking under duress or necessity signals something different than capricious betrayal.
      *   **Consequences & Suffering:** Readers sympathize with *costly* fidelity (the daughter) and *understandable* failure (ruined orchard seller). They condemn breaking promises that cause clear, unjustified harm (the widow's act *feels* harmful to the husband's memory/trust).
      *   **The Gap:** This is your playground! Philosophy might argue the widow has *no* obligation (he's dead, no harm possible). But narrative convention, rooted in deep human feeling about loyalty to the dead and the sacredness of deathbed promises, *creates* the sense of betrayal. Conversely, philosophy might see a self-vow as a serious moral commitment to one's future self, while narrative convention often treats it more as a character flaw than a true "promise broken." **Your power lies in exploiting this gap – making readers feel the weight of a "philosophically void" promise (like the widow's) or minimizing the perceived betrayal of a "philosophically binding" one through context.**

  5.  **The Test Case: Released but Kept (at Cost)**
      *   **Reader Reaction Prediction:** **Deeply Ambivalent, Leaning Towards Rigidity.** Readers will likely *not* purely admire this. They will see the release as removing the *obligation*. Keeping the promise anyway, *especially at significant personal cost*, will primarily signal something about the *character*:
          *   **Admiration (Minor):** If framed as profound loyalty, unwavering principle, or love transcending the release ("I promised *myself* as much as him"). Requires strong positive characterization.
          *   **Rigidity/Foolishness (Likely Dominant):** More commonly, it will seem stubborn, unable to accept freedom, clinging to an unnecessary burden, perhaps even disrespectful of the *promisee's current autonomy* in releasing them. The cost highlights the irrationality.
          *   **Pathos/Tragedy:** The strongest narrative potential. The character might be trapped by their own identity ("I am someone who keeps promises"), haunted by guilt, or unable to believe the release is genuine/deserved. Readers feel pity for their inability to be free.
      *   **Philosopher's Verdict:** The Autonomy-Respect model **agrees with the likely reader reaction.** The core ground of promissory obligation – respect for the promisee's autonomy – has been *waived* by the promisee. The promisor is explicitly released from the duty. Keeping it is no longer an obligation owed *to the promisee*. The philosopher would see it as supererogatory (beyond duty) at best, but more likely as a choice governed by the promisor's own character, values, or psychology, not by the moral force of the original promise. They would likely see rigidity or misplaced devotion if significant cost is incurred unnecessarily.

  **Conclusion:**

  Your instrument is sharp because it taps into a fundamental moral concept (autonomy) filtered through powerful narrative lenses (character, consequence, suffering, loyalty, betrayal). The Autonomy-Respect model explains the differing verdicts by focusing on *whose autonomy is engaged, how legitimately, and how circumstances evolve*. It distinguishes the binding nature of interpersonal promises (even to the dead) from self-vows. Reader sympathies track a blend of this moral intuition and narrative conventions about what promise-keeping/breaking reveals about character and relationship. The gap between strict philosophy and narrative feeling is precisely where you, as a novelist, wield immense power – you can make readers feel the crushing weight of a "released" promise or the surprising lightness of breaking an "absolute" one, all by masterfully manipulating context, character motivation, and the perceived legitimacy of the autonomy claims involved. Your test case perfectly illustrates this: the obligation is gone (philosopher agrees), but the character's *choice* to persist becomes the compelling, and likely tragic, narrative focus.
