     Alice's ranking of outcomes: 
          RR: best (1)
          BR: next (2)
          RB: next (3)
          BB: worst (4)

     Bob's ranking of outcomes:
          BB: best (1)
          BR: next (2)
          RB: next (3)
          RR: worst (4)

     We find the Nash equilibria.

     - In a Nash equilibrium, no player wants to unilaterally change their strategy.

     Check each outcome:

     1. RR: 
          - Alice: if she switches to Blue, outcome becomes BR. She prefers BR to RR? No, she prefers RR to BR (RR>BR). So she won't switch.
          - Bob: if he switches to Blue, outcome becomes RB. He prefers RB to RR? Bob's ranking: RB (3) vs RR (4) -> he prefers RB to RR. So he would switch to Blue.
          -> Not a Nash equilibrium.

     2. BR:
          - Alice: if she switches to Red, outcome becomes RR. She prefers RR to BR -> she would switch.
          - Bob: if he switches to Blue, outcome becomes BB. He prefers BB to BR (because BB is best and BR is second) -> he would not switch? 
