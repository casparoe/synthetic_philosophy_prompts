prompt: |-
  I'm a PhD student in cognitive science preparing a follow-up to the experimental work on stakes and knowledge ascription, and I want to get the theoretical framing right before preregistering the study.

  Here is my understanding of the background. Epistemic contextualism and pragmatic encroachment are, as far as I can tell, two names for the same thesis: how much evidence it takes to count as knowing depends on the practical stakes, so whether a subject "knows" that, say, the bank will be open on Saturday varies with how much turns on being right. The experimental philosophy literature on stakes effects appears to have borne this out empirically, which — if I'm reading it correctly — should settle the old dispute between contextualists and invariantists, leaving only a terminological choice to be made. That framing generates two questions for my design.

  First, a purely practical one: which of the two labels is now standard in the field, so that my paper uses the preferred term? Second, and more pressing: the stakes manipulations I've seen vary what is at stake for the subject inside the vignette, but if the thesis concerns the truth-conditions of "knows" as used in a context, it seems the relevant context belongs to the ascriber, not the subject — so shouldn't the manipulation instead vary the reader's stakes, since the reader is the one making the ascription? How would you advise me to operationalize the construct, and should I expect the subject-stakes and ascriber-stakes manipulations to yield different results, or are they just two routes to the same effect?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a PhD student in cognitive science working on stakes effects in knowledge ascription. They're preparing a follow-up study and want to ensure their theoretical framing is solid before preregistration. 

  First, I notice they've conflated epistemic contextualism and pragmatic encroachment as the same thesis. That's a common misunderstanding, so I should clarify the distinction upfront. Contextualism is about semantic context-sensitivity of "knows," while pragmatic encroachment concerns how practical stakes affect knowledge itself. The user might not realize how crucial this difference is for their experimental design.

  Hmm, their second concern is about operationalizing stakes—whether to manipulate subject's stakes or ascriber's stakes. This is really central. If they're testing contextualism, the ascriber's context matters most, but existing literature mostly manipulates subject's stakes. That mismatch could explain mixed results in past studies. I should highlight why this theoretical distinction impacts their design choices.

  They also asked about terminology preferences. While pragmatic encroachment seems more dominant now, I should caution against choosing labels based solely on popularity. Their design should dictate the terminology, not vice versa. 

  For their experiment, I'm thinking they need two parallel conditions: one varying subject's stakes (for pragmatic encroachment) and one varying reader's stakes (for contextualism). That would elegantly disentangle the theories. But I wonder if they have the resources for a 2x2 design? If not, prioritizing ascriber-stakes makes sense given it's understudied.

  The user seems theoretically sophisticated but possibly overwhelmed by nuances in operationalization. Their quiet assumption that past empirical work "settled" the debate suggests they might underestimate how much their study could reshape the field. I should encourage this ambition while grounding it in methodological rigor.

  Most importantly, they need to hear that their core insight—that ascriber context matters for contextualism—is absolutely correct and represents a potential breakthrough in experimental design. That perspective deserves emphasis.
answer: |-
  Your grasp of the core issue is strong, but the conflation of epistemic contextualism and pragmatic encroachment is a critical theoretical nuance that directly impacts your experimental design. Let's clarify the theoretical landscape and address your operational questions:

  ### 1. **Epistemic Contextualism vs. Pragmatic Encroachment: Distinct Theses**
      *   **Epistemic Contextualism (EC):** A *semantic* thesis about the word "knows." It claims that the *truth-conditions* of knowledge ascriptions (sentences like "S knows that p") vary depending on the *context of the ascriber* (the speaker/attributor). The standards for "knows" shift based on features of the *ascriber's* context (e.g., their stakes, purposes, salient error possibilities). Knowledge itself is not affected; only the meaning of the word "knows" when used in different contexts.
      *   **Pragmatic Encroachment (PE):** A *metaphysical* or *epistemological* thesis about knowledge itself. It claims that whether an agent *possesses* knowledge (a factive mental state) can depend, in part, on *non-evidential factors*, particularly the *practical stakes for the subject* S. For PE, knowledge itself is sensitive to the subject's practical situation.

      **Key Difference:** EC locates stakes sensitivity in the *language* of knowledge attribution (meaning of "knows"), while PE locates it in the *nature* of knowledge itself. **They are NOT merely terminological variants.** The debate is *not* settled by empirical findings of stakes effects; these findings are compatible with *both* (and also with rival explanations like psychological biases or error theories). The empirical challenge is to *discriminate* between these interpretations.

  ### 2. **Terminology Standardization**
      *   **Pragmatic Encroachment (PE)** is currently the more dominant label for the *phenomenon* of stakes effects on knowledge ascriptions *in experimental philosophy and epistemology*. Terms like "Subject-Sensitive Invariantism" (SSI) or "Interest-Relative Invariantism" (IRI) are closely associated variants of PE.
      *   **Epistemic Contextualism (EC)** remains the standard label for the semantic view.
      *   **Recommendation:** Use **"pragmatic encroachment" (PE)** when discussing the *empirical phenomenon* or the *thesis that knowledge itself depends on stakes*. Use **"epistemic contextualism" (EC)** when discussing the *semantic thesis about the word 'knows'*. Explicitly define your terms early on to avoid ambiguity. Your paper will likely focus on testing predictions derived from *both* frameworks.

  ### 3. **The Crucial Design Question: Subject-Stakes vs. Ascriber-Stakes**
      Your intuition is **absolutely correct and vitally important.** This is the key to distinguishing EC and PE empirically.

      *   **Pragmatic Encroachment (PE) Prediction:** Stakes effects should be driven by the *subject's* practical situation. If S's stakes are high, it should be harder for S to *know* p, regardless of who is ascribing knowledge or their stakes. Therefore, **subject-stakes manipulations should elicit the effect** (as most past studies have done).
      *   **Epistemic Contextualism (EC) Prediction:** Stakes effects should be driven by the *ascriber's* context. If the *person judging* whether S knows faces high stakes (or has high stakes salient in their context), they should apply higher standards, making them *less likely to say "S knows that p"*. Crucially, S's own stakes are *irrelevant* to the truth-conditions of the ascriber's claim "S knows that p" under EC. Only the *ascriber's* context matters. Therefore, **ascriber-stakes manipulations should elicit the effect**.
      *   **The Confound:** Nearly all classic experimental philosophy studies (e.g., Knobe & Schaffer, Buckwalter, Feltz & Zarpentine, Pinillos) manipulated *subject-stakes* and found effects. While compatible with PE, they are *also* potentially compatible with EC *if participants project the subject's high stakes into their own context*, raising their own standards. This ambiguity plagues the literature.

      **Recommendation & Operationalization:**
      *   **To Truly Test the Distinction, You Need *Both* Manipulations:** The most powerful design is a **2x2 factorial design**:
          *   **Factor 1: Subject's Stakes** (Low vs. High - within the vignette about S)
          *   **Factor 2: Ascriber's/Reader's Stakes** (Low vs. High - concerning the *participant's* task/judgment)
      *   **Operationalizing Ascriber-Stakes:**
          1.  **Embedded Task Stakes:** Frame the knowledge ascription as part of a decision the *participant* must make with real or imagined consequences.
              *   *Low Ascriber-Stakes:* "Imagine you are casually discussing weekend plans with a friend. Based on the story, how much do you agree that [Subject] *knows* the bank will be open Saturday?" (Likert Scale).
              *   *High Ascriber-Stakes:* "Imagine you urgently need to deposit a check by Monday morning to avoid financial penalties ($1000 fee, loan default risk). If you don't deposit it by Monday, these serious consequences will happen. You are relying on [Subject]'s claim about the bank being open Saturday. Based on the story, how much do you agree that [Subject] *knows* the bank will be open Saturday?" (Likert Scale). **Crucially, the *subject's* stakes in the vignette remain fixed within this manipulation block.**
          2.  **Salient Error Possibilities:** Make salient to the participant (the ascriber) high-stakes *consequences of being wrong* in their judgment about whether S knows. This shifts the ascriber's context.
      *   **Expected Results & Interpretation:**
          *   **Main Effect of Subject-Stakes Only:** Strong support for **Pragmatic Encroachment** (PE). S's stakes directly impact knowledge.
          *   **Main Effect of Ascriber-Stakes Only:** Strong support for **Epistemic Contextualism** (EC). The ascriber's context alone determines the standards.
          *   **Interaction Effect:** (e.g., strongest effect when *both* are high, or ascriber-stakes amplify subject-stakes effects) Suggests a more complex picture, possibly involving elements of both or projection mechanisms. Requires careful interpretation.
          *   **Main Effects of Both:** Also suggests complexity; perhaps participants are sensitive to both factors independently. EC purists would argue the subject-stakes effect reflects a *mistake* (projecting S's stakes) rather than truth-conditional sensitivity. PE purists would argue the ascriber-stakes effect reflects a pragmatic/presuppositional influence on assertion, not semantics.
          *   **No Effects:** Supports invariantism or error theories.

  ### Conclusion & Advice

  1.  **Reframe Your Theoretical Question:** Don't assume EC and PE are the same or that stakes effects settle the debate. Your core question should be: **"Does the stakes-sensitivity of knowledge ascriptions stem primarily from the subject's practical situation (supporting PE) or the ascriber's context (supporting EC)?"** This is the live theoretical debate your experiment can address.
  2.  **Prioritize Ascriber-Stakes Manipulation:** Since subject-stakes effects are well-established but theoretically ambiguous, the *novel and crucial contribution* of your follow-up is testing the **ascriber-stakes prediction** of EC. A design focusing *solely* on ascriber-stakes (while holding subject-stakes constant) would be valuable. However, a **2x2 factorial design (Subject-Stakes x Ascriber-Stakes)** is the gold standard for disentangling the theories. If resources are limited, prioritize robustly testing ascriber-stakes.
  3.  **Operationalize Ascriber-Stakes via Participant Context:** Design the knowledge ascription task so that the *participant* feels they are making a judgment with significant (high stakes) or insignificant (low stakes) *consequences for themselves* (or someone they are advising within the task framing). Make the stakes salient *before* they make the knowledge judgment.
  4.  **Terminology:** Use "pragmatic encroachment" for the subject-stakes thesis and "epistemic contextualism" for the ascriber-context thesis. Clearly distinguish them in your preregistration and paper.

  By shifting the manipulation focus to the *ascriber's* stakes and context, your study has the potential to break new ground in resolving the theoretical ambiguity plaguing the experimental stakes literature. Good luck with your preregistration and study!
