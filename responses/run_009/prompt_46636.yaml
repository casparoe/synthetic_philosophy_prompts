prompt: |-
  I'm a software engineer with no background in philosophy, and I've recently come across Douglas Hofstadter's idea of superrationality: roughly, that if you and others face the same one-shot decision and reason about it the same way, you should act as if everyone will decide identically, and therefore cooperate even where defecting is individually optimal. My situation at work looks like a candidate case: several peer teams each independently decide how much of a sprint to spend on shared platform work — keeping the CI pipeline green, maintaining internal libraries, updating documentation nobody gets credit for — versus shipping features their own roadmaps are judged on. Most of my colleagues have never heard of superrationality, and some of them, if they heard it, would reject the reasoning outright.

  Please describe the most important implications of superrationality for how I should split my time between the shared platform work and my own team's deliverables. In particular, I'd like you to address: (1) whether the superrational argument survives when the symmetry it relies on is broken by the fact that only some of the decision-makers find the argument compelling at all; (2) whether the argument changes once the one-shot framing is loosened — we face versions of this choice every sprint, but with a rotating cast of teams and no clear repetition against the same counterpart; and (3) whether there are recognizable configurations of my situation in which the superrational consideration actually points away from the shared work, and what those look like. Please reason from the idea itself rather than treating it as settled doctrine, and flag where you think the argument is doing real work versus where it's just a dignified name for ordinary prudence.
reasoning: |-
  Okay, let's tackle this software engineer's question about applying superrationality to their work dilemma. They're dealing with allocating time between shared platform work and team-specific features, where the core tension mirrors a prisoner's dilemma: everyone benefits if all contribute to shared work, but individuals are tempted to defect (prioritizing features) since they're judged on deliverables.

  The user raises three nuanced aspects: asymmetry (not all colleagues buy into superrational thinking), repetition (it's recurring but with rotating teams), and edge cases where superrationality might actually advise against cooperation. They want analysis grounded in the idea itself, not dogma.

  First, I need to recall Hofstadter's superrationality properly. It's not just "cooperate because it's nice" - the key is symmetry and identical reasoning. In a true superrational scenario, you assume everyone identical to you will reach the same conclusion, so defection becomes irrational because it'd be universal. That creates a different Nash equilibrium.

  For asymmetry: this breaks superrationality's core premise. If colleagues don't reason this way, their defection becomes predictable, making your cooperation costly. Here, superrational logic might paradoxically advise defection - but only if you're certain others will defect. The real insight is recognizing that asymmetry forces you into game theory's grim realities. 

  For repetition: even with rotating teams, the "shadow of the future" applies weakly. Reputation building is hard across teams, but if enough actors adopt superrationality-like norms (like open-source communities do), it can stabilize cooperation. The rotating aspect makes it messier than textbook repeated games though.

  Edge cases matter: if shared work has negative returns (e.g., over-engineering), or if your contribution is negligible while feature work is critical, superrationality wouldn't demand blind cooperation. It's not altruism - it's strategic under specific symmetries.

  Throughout, I should flag where superrationality adds value versus where it's just repackaging prudent self-interest. The symmetry assumption is its unique (and fragile) insight. In practice, the engineer might use this framework to advocate for systemic fixes (joint KPIs) rather than expecting colleagues to suddenly become Hofstaderians.
answer: |-
  Based on a rigorous analysis of superrationality's core logic applied to your context, here are the key implications for your time allocation, addressing your specific concerns:

  ### 1. **Asymmetry Breaks the Core Superrational Equilibrium**
     * **The Ideal Superrational Case:** If *all* teams were superrational and assumed perfect symmetry, the logic dictates mutual cooperation (investing in shared work) as the only stable outcome. Defection becomes self-refuting: if you defect assuming others cooperate, you violate the symmetry assumption (why wouldn't *they* also defect?).
     * **Reality of Asymmetry:** Since colleagues reject the reasoning, symmetry is shattered. Superrationality *cannot* compel *you* to cooperate unilaterally under these conditions. If you know some teams will predictably defect (prioritize features), the superrational calculation shifts:
       * **Your Best Response:** Cooperate *only* if you believe enough others will cooperate *despite not being superrational* (e.g., via altruism, strong norms, or fear of punishment). Otherwise, defection becomes individually rational. Superrationality here highlights the *tragedy* – mutual defection is worse for all, but asymmetry forces you toward it if cooperation isn't reliably reciprocated.
       * **The Argument's Work:** Superrationality starkly reveals why symmetry is crucial. Without it, the logic collapses back into standard game theory. Its value here is *diagnostic*: it shows why cooperation is failing and that persuading others (or changing incentives) is essential.

  ### 2. **Repeated Interaction with Imperfect Symmetry Changes the Calculus**
     * **One-Shot vs. Repeated:** Superrationality is designed for true one-shot games. Your situation is a **finitely repeated game with variable players**.
     * **Superrationality's Limited Role:** The core symmetry assumption is weaker here. You don't face identical reasoning agents repeatedly. Standard repeated game mechanisms (reciprocity, reputation, tit-for-tat) become more relevant than pure superrationality.
     * **Modified Superrational Insight:** You can adopt a *superrational-like stance*: act *as if* your cooperation might inspire reciprocal cooperation from others in future sprints, even if they aren't formally superrational. This is strategic, not purely logical:
       * **Build Norms:** Consistent investment in shared work signals commitment, potentially encouraging others over time. Your behavior becomes a focal point.
       * **Reputation (Weak):** While teams rotate, internal reputations ("Team X always helps fix CI") can develop across sprints, influencing others' choices.
       * **Shadow of the Future:** Each sprint isn't truly isolated. Knowing you'll face similar choices makes immediate defection less appealing if it poisons the well for future cooperation.
     * **The Argument's Work:** Superrationality provides a *justification* for initiating cooperation in a repeated setting *despite* immediate costs, grounded in the hope/expectation of symmetry emerging through norms, even if not through identical reasoning. This is distinct from pure altruism.

  ### 3. **Cases Where Superrationality Points Away from Shared Work**
     Superrationality isn't blind cooperation. It dictates cooperating *only when mutual cooperation is the uniquely rational symmetric outcome*. Situations where it may advise *against* shared work:
     * **Negative Synergy/Overhead:** If the shared work is poorly designed or managed, adding effort might create *negative* overall value (e.g., conflicting library updates, excessive meetings). Mutual non-investment ("defection") could be the superior symmetric outcome. Superrationality points to not contributing to a failing system.
     * **Critical Asymmetry in Impact:** If *your* unique feature work is demonstrably critical to the company's survival/revenue *right now* (e.g., fixing a major client-blocking bug *only your team can fix*), while the shared work is minor upkeep, symmetry is broken. Superrationality (assuming others recognize their *own* critical priorities) would allow prioritizing your unique, urgent deliverable. Others should reason likewise about *their* true crises.
     * **Free Riding is Impossible/Unnecessary:** If the shared work is already robustly maintained *by others* without your contribution (e.g., a dedicated platform team), and your input adds negligible marginal value, superrationality doesn't compel you to waste effort. Mutual defection (teams focusing on features while a dedicated group handles the platform) is stable and efficient. Cooperating here is inefficient, not superrational.
     * **Threshold Effects & Your Marginal Contribution:** If the shared work requires a *minimum critical mass* of effort to be valuable (e.g., a new CI system needs 5 teams to adopt), and you are confident that threshold will *not* be met regardless of your action (e.g., only 2 teams are willing), your contribution is wasted. Superrationality, assuming others reason identically, leads to mutual defection being the only stable outcome.

  ### Strategic Implications for Your Time Allocation

  1.  **Assess True Symmetry & Reciprocity:** Gauge how many teams *actually* contribute meaningfully to shared work now, regardless of their reasoning. If reciprocity is low, superrationality *doesn't* obligate your cooperation. Focus on deliverables unless systemic change is possible.
  2.  **Invest in Building Symmetry:** Where superrationality shines is as a tool for *changing the game*:
      *   **Advocate Systemically:** Push for shared KPIs for platform health, joint planning sessions for platform work, or formalized "taxes" on feature teams. This *creates* symmetry in incentives, making cooperation the rational choice for everyone.
      *   **Educate Selectively:** Share the *practical outcome* ("We all lose if the platform crumbles; we all win if we invest") rather than the "superrationality" label. Frame it as collective self-interest.
  3.  **Prioritize High-Leverage Shared Work:** Focus shared effort where:
      *   Your contribution has high impact (fixing critical CI breaks).
      *   It clearly prevents future catastrophic defection (documenting a library to prevent downstream bugs).
      *   It builds goodwill/norms likely to be reciprocated (helping a team in a bind).
  4.  **Avoid Wasted Effort:** Don't invest significantly in shared work if the conditions in Section 3 apply (negative synergy, truly unique critical features, free riding is viable, thresholds won't be met).
  5.  **Track Contributions (Informally):** Note which teams consistently contribute. Adjust your cooperation level accordingly over time (a tit-for-tat inspired approach, justified by the *repeated* nature, not pure superrationality).

  ### Where Superrationality Does Real Work vs. Ordinary Prudence

  *   **Real Work:** The core, unique insight is that **perfect symmetry in reasoning and situation *logically necessitates* identical action, making mutual cooperation stable and defection irrational *if and only if* all agents are superrational and assume others are too.** This is profound for idealized, one-shot, symmetric dilemmas. It demonstrates why mutual cooperation *can* be the uniquely rational outcome without external enforcement, which is counterintuitive in classic game theory.
  *   **Ordinary Prudence Dressed Up:** Much of the practical advice above (build norms, reciprocity, systemic fixes, avoid wasted effort) is standard strategic thinking in repeated games or institutional design. Superrationality provides a *specific philosophical justification* for initiating cooperation in the *hope* of symmetry, but the mechanisms for sustaining it (reputation, reciprocity) are standard. In asymmetric or repeated-but-imperfect settings, invoking "superrationality" often just means "cooperate strategically hoping others will too," which is prudent but not its revolutionary core idea.

  **In essence:** Superrationality mandates cooperation *only* under perfect symmetry of reasoning and situation. Your workplace lacks this symmetry. Therefore, it primarily serves as a lens to understand the dysfunction and a call to action to *create symmetry* (through incentive redesign or persuasion). Absent that, your time allocation should follow standard repeated-game strategy: cooperate conditionally based on observed reciprocity, prioritize high-leverage shared work, and avoid futile contributions. The edge cases highlight that superrationality is a tool for optimizing collective outcomes under symmetry, not a dogma demanding self-sacrifice.
