     1. Historians give different dates for the end of the Middle Ages (e.g., 1453, 1492, 1517). Is this disagreement substantive? (i.e., are they trying to get at a real historical transition and just disagreeing about which event best marks it?)
          - If YES, go to question 2.
          - If NO, go to question 3.

     2. Could a person living in 1500 have been objectively mistaken about whether the Middle Ages had ended?
          - If YES, your position is: Strong realism (periods are real discontinuities with essences; the transition is objective and might not be fully apparent to contemporaries).
          - If NO, your position is: Family-resemblance realism (periods are real clusters of features with vague boundaries; the contemporary's perspective is one valid way of experiencing the era).

     3. Despite the fact that historians dropped the term "Dark Ages" (without the past changing), do you think the concept of "the Middle Ages" is still a useful tool for understanding the past?
          - Answer YES or NO.

     4. Some historians question whether the Renaissance was a distinct period. Regardless, do you find the concept of "the Renaissance" useful for understanding the past?
          - Answer YES or NO.

     5. The continuity thesis argues that modern science has deep roots in the Middle Ages, so there was no sharp break. Given that, do you think the concept of "the Scientific Revolution" is still useful for understanding the past?
          - Answer YES or NO.

     Now, based on your answers to 3, 4, and 5:

          - If you answered YES to all three (Middle Ages, Renaissance, and Scientific Revolution are useful), then your position is: Conventionalism (periods are useful tools, and while some may carve the past better than others, they are all worth keeping as conventions).

          - If you answered NO to all three, then your position is: Flat eliminativism (the labels obscure more than they reveal; we should ditch them all).

          - If you had a mix of YES and NO (at least one YES and at least one NO), then your position is: Selective eliminativism (some labels are useful and should be kept, while others are misleading and should be dropped).

   37. Notes:

       - The tree cannot separate different forms of selective eliminativism (e.g., dropping only the Renaissance vs. dropping only the Scientific Revolution). They are all grouped under selective eliminativism.

       - The tree also does not capture a person who is a realist about one period and a non-realist about another. For example, if you are a strong realist about the Middle Ages but a conventionalist about the Renaissance, the tree will place you in strong realism (based on your answer about the Middle Ages) and not ask about the Renaissance. We assume that the stance on the Middle Ages is representative of your general view on periodization.

       - There are no combinations that land nowhere. Every path leads to one of the five positions.

   38. We have 5 branch nodes (Q1 to Q5) and then a mapping for the non-realism path.

   Let's write the handout accordingly.
answer: |-
  ### Periodization Decision Tree  
  *Based on Shapin's paradox: "There was no such thing as the Scientific Revolution, and this is a book about it."*  
  **Instructions:** Start at Question 1. Answer each question based on your instinct—no prior theory required.  

  ---

  #### **Question 1**  
  Historians debate the end of the Middle Ages (e.g., 1453, 1492, or 1517). Is this disagreement **substantive** (i.e., are they arguing about a *real transition* in history)?  
  - **YES** → Go to Question 2.  
  - **NO** → Go to Question 3.  

  #### **Question 2**  
  Could someone living in Florence in 1500 have been *objectively mistaken* about whether they were in the "Middle Ages" or the "Renaissance"?  
  - **YES** → Go to **Position A**.  
  - **NO** → Go to **Position B**.  

  #### **Question 3**  
  Does the concept of **"the Middle Ages"** remain useful *even though historians dropped the term "Dark Ages"* without changing the past?  
  - **YES** → Go to Question 4.  
  - **NO** → Go to Question 5.  

  #### **Question 4**  
  Is **"the Renaissance"** a useful label *despite claims it was just a continuation of medieval trends*?  
  - **YES** → Go to Question 6.  
  - **NO** → Go to **Position E**.  

  #### **Question 5**  
  Should we **also discard "the Renaissance" and "Scientific Revolution"** as labels (not just "Middle Ages")?  
  - **YES** → Go to **Position D**.  
  - **NO** → Go to **Position E**.  

  #### **Question 6**  
  Given that modern science has **deep medieval roots** (per the continuity thesis), is **"the Scientific Revolution"** still a useful concept?  
  - **YES** → Go to **Position C**.  
  - **NO** → Go to **Position E**.  

  ---

  ### POSITIONS  
  **A. Strong Realism**  
  Periods reflect *real historical discontinuities with core essences* (e.g., "The Renaissance *objectively began* when X changed"). Disagreements (Q1) are substantive because historians are approximating a real boundary. Someone in 1500 (Q2) *could* be wrong about their era.  

  **B. Family-Resemblance Realism**  
  Periods are *real but fuzzy clusters* of traits (e.g., "Renaissance" = overlapping innovations in art, politics, science). No single essence exists, so boundaries are vague. Thus, Q2 is "NO"—contemporaries’ self-perception is valid data. Disagreements (Q1) reflect this vagueness.  

  **C. Conventionalism**  
  Periods are *practical tools*; some carve history better than others. All three labels (Middle Ages, Renaissance, Scientific Revolution) are useful (Q3–6 YES). Dates aren’t facts (Q1 NO), but usefulness justifies them (e.g., "Scientific Revolution" organizes ideas despite medieval roots).  

  **D. Flat Eliminativism**  
  Period labels *obscure more than they reveal*. Ditch "Middle Ages," "Renaissance," *and* "Scientific Revolution" (Q5 YES). They impose artificial breaks (Q1 NO) and aren’t useful (Q3 NO). Prefer granular terms like "14th-century Iberian urban economies."  

  **E. Selective Eliminativism**  
  *Some labels work; others don’t*. You rejected at least one period (e.g., "Renaissance" in Q4 NO, or "Scientific Revolution" in Q6 NO) but kept another (e.g., "Middle Ages" in Q3 YES). Mixed usefulness reveals uneven conceptual value.  

  ---

  ### NOTES  
  - **Unseparated Leaves**:  
    - **Selective Eliminativism (E)** covers *any* combination of kept/dropped labels (e.g., keep "medieval" but drop "Renaissance," or vice versa). The tree can’t distinguish sub-flavors of selectivity.  
  - **Unreachable/Unattractive Stances**:  
    - *"Q1 YES but Q2 irrelevant"*: If periods are real (Q1 YES) but Q2 is nonsensical (e.g., "eras are real but unperceivable"), this lands nowhere—likely because it conflates ontology with epistemology. Nobody defends it; it’s incoherent.  
    - *"Q3 NO but Q4/Q6 YES without Q5"*: Impossible—the tree routes Q3 NO to Q5.  
  - **Design Logic**:  
    - Q1 isolates *realism* (YES) vs. *non-realism* (NO).  
    - Q2 splits realism into **strong** (objective essences) vs. **family-resemblance** (subjective clusters).  
    - Q3–6 handle non-realism: Usefulness tests (**conventionalism** if all YES) trigger eliminativism (**flat** if all NO; **selective** if mixed).  
    - Cases embedded: Disputed dates (Q1), contemporaneous self-awareness (Q2), continuity thesis (Q6), and discarded "Dark Ages" (Q3).  

  **Handout Tip**: Print as a flowchart. Assign students to defend their landing position—even if they disagree! Forces engagement with trade-offs.
