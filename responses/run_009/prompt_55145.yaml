  You misunderstand my thesis fundamentally. I am not speaking merely of meanings or extensions, but of the *conditions for correct application* when we identify objects as falling under a sortal concept. "Horse" (马) is a primary sortal: it picks out entities by their essential equine form. "White horse" (白马) is a *compound sortal* demanding satisfaction of two criteria: the essential form *and* the accidental property of whiteness. 

  Your brother analogy fails: "brother" and "male sibling" are *synonymous predicates* sharing necessary and sufficient conditions. But "white horse" adds a *restrictive condition* to "horse." When you ask for a horse, any horse satisfies the request because you seek the *form*. When you demand a *white* horse, you impose an additional identity condition—whiteness—that alters what counts as satisfying the term. A yellow horse *is* a horse extensionally, but it *fails* the compound sortal "white horse" precisely because it violates the specific condition imposed. Thus, "white horse" cannot be substituted for "horse" in language or thought without altering the criteria of identity and success. The thesis is non-trivially true because it exposes how modifiers generate new sortals with distinct application rules—even when extensions overlap. 

