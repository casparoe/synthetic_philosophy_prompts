prompt: |-
  Ok so I need your help with something for my hospital job and I'm still kind of wired from arguing about this with my friend Marcus until like 2am last night, so apologies if this rambles a bit. I sit on the ethics committee at a mid-size regional hospital, and we've been asked to write a disaster-triage guideline for a scenario that came up in a tabletop exercise: a highway pileup where we can only send one of our two mobile ICU teams, and the two candidate scenes have patients who are basically identical clinically — same injuries, same survival odds with treatment, same everything — except one scene has five patients and the other has one. No prognosis difference at all, the only difference is headcount. Our old draft guideline just says to maximize lives saved, and half the committee thinks that's obviously right while the other half got quiet when I asked them to justify it.

  Marcus is a philosophy grad school dropout and spent the entire dinner arguing this guy Taurek's position from the 70s — that the numbers shouldn't count in themselves, that each of the five can only claim to be one person, that flipping a coin between the two scenes is fair to everyone in a way that going straight to the five is not fair to the one, and that five deaths isn't a loss that happens to anybody unless you treat the group itself as a thing that can be harmed. I kept saying look, if it were my family at both scenes I'd want you to go where more people are, and he kept saying that's a feeling, not an argument, and honestly by the end I wasn't a hundred percent sure he was wrong, which is why I'm asking you.

  Please draft the memo I'll circulate before next month's meeting. It should recommend a concrete policy for the guideline — save-the-most as a hard default, save-the-most with a lottery tiebreaker for exactly this kind of case, a pure or weighted lottery, whatever you actually think is defensible — with the reasoning written out so a skeptical committee member can follow it, including a serious treatment of the anti-counting side (the strongest version of it, not a strawman). Also please address the question from Marcus that stuck with me: if the guideline does count, what exactly is being counted — five individual persons each lost once, or one big aggregated loss that outranks one smaller loss — and does the answer change what we tell the families afterward? And if you think the committee genuinely can't settle the philosophy, tell us what a policy that refuses to take a side would look like in practice, and whether that would be cowardice or wisdom. Keep it short enough that a doctor can read it between shifts — no footnotes, nobody will read them anyway.
