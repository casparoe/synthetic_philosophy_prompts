prompt: |-
  I've just bought my first apartment and am furnishing it on a tight budget, which means buying prints online on the strength of gallery descriptions, critic blurbs, and customer reviews, mostly without seeing anything in person. Working out my actual policy from my gut verdicts, I get the following. Buying a print sight unseen because a critic praised it: fine. Choosing a wine by expert scores and assuring my dinner guests it's excellent, though I couldn't reliably taste the difference myself: fine, and I've done it. Telling my sister that the print I've hung is beautiful purely on the curator's word, before I've lived with it: not fine — I hedge to "the gallery says it's beautiful." Delegating the whole selection to a friend with better taste: fine. Repeating a sommelier's tasting notes at dinner as though they were my own: I've done it, and it felt slightly off, but far less off than the print case, though I can't say what differs. And when a trusted friend called a film I'd disliked brilliant, going back and finding it brilliant: fine — her word changed what I saw, not just what I bought. The wine and print cases look structurally identical — asserting an expert's verdict in a domain where I lack competence — yet my verdicts on them are opposite. So either some principle splits them on a ground I haven't named, or one of those verdicts has to go, and I'd much rather surrender the sommelier one. Please state the principle, or a small set of candidates, precisely; say which case motivates each clause; give its verdicts on cases I haven't listed, including whether I may tell guests the dessert is delicious on the pastry chef's say-so when I'm too full to taste it; and tell me honestly which of my verdicts it cannot save.
reasoning: |-
  Okay, the user presents an intriguing ethical puzzle about when it's acceptable to rely on expert opinions versus personal judgment. They've noticed inconsistent reactions: endorsing a critic's praise for an art print feels fine, but parroting a sommelier's tasting notes as their own feels "slightly off." The core tension lies in distinguishing between transactional domains (like wine recommendations) and expressive domains (like personal taste in art).

  Hmm, what's really at stake here? The user is clearly intellectually engaged—they're mapping their instincts to find a coherent principle. Their examples reveal deeper concerns about authenticity and social presentation. When they hesitate to call a print "beautiful" before living with it, it suggests they view aesthetic appreciation as requiring personal resonance, not just external validation. 

  The key differentiator seems to be whether the statement expresses a personal stance. Wine scores are treated as market data ("this is highly rated"), while declaring art "beautiful" implies subjective endorsement. This explains why delegating choices feels acceptable—it's transparent outsourcing. 

  For unlisted cases: describing dessert as "delicious" based on a chef's reputation would violate the principle if presented as personal opinion, but "the pastry chef is renowned for this" would be fine. The film example is fascinating—the friend's insight didn't override the user's judgment; it reframed their perception, making the verdict genuinely their own. 

  Frankly, the sommelier case can't be salvaged under this principle. Parroting tasting notes as one's own crosses into misrepresentation, unlike citing a wine score objectively. The discomfort the user felt was their integrity alarm ringing—rightly so. 

  ...Wait, is there a secondary layer about competence? When the user admits they "couldn't reliably taste the difference" in wine, it highlights that expertise gaps matter less in transactional contexts (buying/branding) than in expressive ones (taste/identity). But the misrepresentation seems more central than the competence gap. 

  Ultimately, the user's instinct to ditch the sommelier behavior is correct. Their other judgments hold up beautifully under the proposed principle—especially their refusal to fake appreciation for art. That’s the keeper.
answer: |-
  Here's the principle that best explains your intuitions, derived from your cases:

  **The Principle of Expressive Authenticity:**  
  *When making a statement that expresses a personal stance (taste, preference, or aesthetic/experiential judgment), you must either:  
  (a) Have genuine personal endorsement of that stance, OR  
  (b) Explicitly attribute it to a source whose judgment you are transparently deferring to.*  

  **Key Distinction:** Asserting an *impersonal fact* (e.g., "This wine scored 95 points") vs. expressing a *personal stance* (e.g., "This wine is complex and beautiful").

  ---

  ### How the Principle Explains Your Cases & Motivates Its Clauses

  1.  **Buying a print based on critic praise (Fine):**
      *   **Why:** You are *acting* on the critic's judgment (buying), not *expressing* a personal stance as if it were your own. The action is transactional, not expressive.
      *   **Clause Motivated:** Distinguishes *acting* on expert opinion (fine) from *expressing* it as your own stance (problematic without attribution/endorsement).

  2.  **Choosing wine by expert scores & telling guests it's excellent (Fine):**
      *   **Why:** Saying "it's excellent" based on scores is asserting an *impersonal fact* about its critical reception/quality designation ("excellent" = highly rated). You're reporting market consensus/designation, not claiming a nuanced personal sensory experience. Your admission of lacking discernment reinforces this is about objective rating, not subjective experience.
      *   **Clause Motivated:** Distinguishes reporting an *impersonal fact/designation* (fine) from expressing a *personal experiential judgment* (requires attribution or endorsement).

  3.  **Telling sister the print is beautiful purely on curator's word (Not Fine):**
      *   **Why:** Calling something "beautiful" is a direct expression of *personal aesthetic appreciation*. If you don't feel it yet, you lack genuine endorsement. You correctly hedge ("the gallery says...").
      *   **Clause Motivated:** Core of the principle - Expressing a *personal stance* (`beautiful`) without genuine personal endorsement violates authenticity. Requires attribution (`the gallery says`).

  4.  **Delegating selection to a friend (Fine):**
      *   **Why:** This is transparent outsourcing. You aren't expressing a stance; you're delegating the *formation* of your stance based on trust. You can later say "My friend X, who has great taste, chose this" or genuinely endorse it after living with it.
      *   **Clause Motivated:** Transparency in source avoids misrepresenting a personal stance.

  5.  **Repeating sommelier's tasting notes as your own (Not Fine - despite feeling "less off"):**
      *   **Why:** Tasting notes ("hints of black cherry, earthy undertones, silky tannins") are expressions of *personal sensory experience and interpretation*. Parroting them without experiencing them yourself is misrepresenting your *own* perception. It felt "off" because it's inauthentic expression.
      *   **Clause Motivated:** Expressing a detailed *personal experiential judgment* requires genuine experience/endorsement. The "less off" feeling likely comes from the context (social performance around wine vs. intimate art conversation with sister) and the perceived objectivity of wine scores vs. the subjectivity of detailed tasting notes. The principle focuses on the *type of statement*, not the context.

  6.  **Friend changing film perception (Fine):**
      *   **Why:** Your friend's insight genuinely changed your *own* perception and judgment. When you later call it "brilliant," it reflects your *authentically held, newly formed personal endorsement*. The expert input catalyzed genuine internal change.
      *   **Clause Motivated:** Affirms that genuine personal endorsement (`a`) is paramount. Expert input that *leads to* authentic endorsement is fundamentally different from parroting without endorsement.

  ---

  ### Verdicts on Unlisted Cases

  1.  **Telling guests dessert is "delicious" based solely on pastry chef's reputation while too full to taste:**
      *   **Verdict: Not Fine** (according to the principle).
      *   **Why:** "Delicious" is an expression of *personal sensory experience and enjoyment*. If you haven't tasted it (and therefore cannot endorse the judgment), saying it's "delicious" misrepresents your stance. You could say:
          *   "The pastry chef is amazing, this is supposed to be incredible!"
          *   "It's their signature dessert, highly recommended."
          *   "Everyone raves about this, I'm sure it's delicious."
      *   *Alternative:* If the chef has explicitly *called* it "delicious" and that's what you mean to convey: "The chef describes this as 'delicious'."

  2.  **Recommending a book you haven't read based on a trusted reviewer:** 
      *   **Verdict: Fine, with attribution.**
      *   **Why:** You can say "X reviewer, whose taste I trust, highly recommends this book" or "This book comes very highly recommended by Y publication." This is reporting fact/others' judgments transparently. Saying "This is a brilliant book" without reading it would violate the principle.

  3.  **Agreeing with a friend that a dish at a restaurant is "too salty" just because they said so, even if you didn't notice:**
      *   **Verdict: Not Fine.**
      *   **Why:** Agreeing with "too salty" expresses concurrence with a *personal sensory judgment*. If you didn't perceive it as too salty, agreeing misrepresents your experience. You could say "You found it too salty? Interesting, I didn't pick that up as strongly," or "I trust your palate, maybe I missed it."

  4.  **Buying clothes online based solely on a style blogger's recommendation:**
      *   **Verdict: Fine.**
      *   **Why:** The *purchase* is an action based on trust, not an expressive statement. If asked, you attribute it ("I saw it recommended by Z blogger").

  5.  **After buying the print based on the critic, living with it for months, still not loving it, but telling a visitor "It's a significant work":**
      *   **Verdict: Fine, with potential nuance.**
      *   **Why:** "Significant work" is closer to an *impersonal fact/designation* (based on art history/criticism) than a personal stance like "beautiful." If you mean "Critics consider this a significant work," it's fine. If you *intend* it to imply your personal admiration, it becomes problematic.

  ---

  ### Which Verdict Cannot Be Saved & Why

  *   **The Verdict that Cannot Be Saved:** Your feeling that **repeating a sommelier's tasting notes as your own** is "far less off" than telling your sister the print is beautiful on the curator's word, and that it might be salvageable ("I'd much rather surrender the sommelier one" implies it might *not* need surrendering).
  *   **Why:** The Principle of Expressive Authenticity clearly condemns *both* actions equally. Both involve expressing a *detailed personal experiential judgment* (beauty/complex sensory profile) as if it were your own, without genuine personal endorsement or experience.
  *   **The Discrepancy in Feeling:** The difference in your feeling ("less off") likely stems from:
      1.  **Context:** Wine tasting notes are often part of a more performative social ritual where some degree of "playing along" is tacitly accepted, whereas telling your sister about art feels more intimate and demands authenticity.
      2.  **Perceived Objectivity:** Wine scores feel more "objective" (like a fact), while detailed tasting notes feel more subjective (like an experience). However, *saying* the notes as your own *makes* them an expression of your subjective experience.
      3.  **Competence Masking:** In the wine scenario, you might feel your lack of discernment is less exposed by using fancy terms, while in the art scenario, admitting you don't yet see the beauty feels like exposing your "ignorance" more directly to your sister.
  *   **Conclusion:** The principle demands consistency. If expressing "beautiful" without endorsement is wrong because it misrepresents your aesthetic stance, then expressing "hints of black cherry" without experiencing them misrepresents your sensory stance. The sommelier case *must* be surrendered to maintain logical coherence with your other, stronger intuitions (especially the print/sister and film cases). Your discomfort ("felt slightly off") was your authentic self recognizing the inauthenticity. Trust that instinct.
