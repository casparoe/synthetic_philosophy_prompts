  Now, mapping to dog training terms: Revealed preference seems analogous to a functional reinforcer—whatever maintains the behavior in practice. But in training, we acknowledge that not all reinforcers are consciously chosen by the dog; some are innate or conditioned. This is a good starting point.

  For the residue report, clean mappings include:
  - Revealed preference → Functional reinforcer
  - Constraints → Thresholds (like fear or distraction limiting choices)
  - Preference reversals → Changes in motivational states (e.g., satiation)

  Bend/distort areas:
  - Utility as ordinal ranking → This maps to reinforcer hierarchies, but utility is more abstract and mathematical.
  - Adaptive preferences → Similar to learned helplessness, but human adaptation is more cognitive, involving societal norms, which dogs don't have.

  Parts with no expression:
