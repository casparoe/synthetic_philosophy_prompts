answer: |-
  Here's a breakdown of the distinct theses behind "all language is performative," ordered from weakest to strongest, with assessments and implications for truth-conditional semantics (TCS):

  ### 📜 The Menu of Readings

  1.  **Weak Action Thesis:** *Every utterance is an intentional act (a "doing") by the speaker.*
      *   **Content:** Uttering words is always a behavior with consequences in the world (e.g., breaking silence, creating sound waves, occupying time).
      *   **Assessment:** **Platitude.** Uncontroversial. Austin himself emphasized this.
      *   **Threat to TCS?** **None.** TCS can fully acknowledge utterances are acts while studying the specific *representational content* those acts express. "Describing the world" *is* one way of acting linguistically.

  2.  **Illocutionary Force Ubiquity Thesis:** *Every utterance carries some illocutionary force (e.g., asserting, questioning, commanding, promising, warning), not just explicit performatives with "hereby".*
      *   **Content:** Explicit performatives (e.g., "I hereby promise...") are just a special case. Declarative sentences are typically used to *assert*, interrogatives to *question*, etc. Force is inherent, not just added by explicit formulas.
      *   **Assessment:** **Substantive & Defensible (Austin's Core Insight).** Austin successfully showed the performative/constative distinction was unstable. Searle (speech act theory) developed this systematically. Widely accepted in pragmatics and philosophy of language.
      *   **Threat to TCS?** **Minimal to Moderate, Contested.** TCS traditionally focuses on *propositional content* (the "what" asserted/questioned/etc.) abstracted away from force. Some argue force is purely pragmatic (context of use). **Crucially, others (e.g., Frege, Dummett, Stenius, Lewis, some dynamic semantics) argue force *can* and *should* be incorporated into a richer semantics.** Accepting this thesis doesn't *destroy* TCS; it challenges its narrow focus and pushes for its expansion to account for force (e.g., modeling assertion as an update function in context). **Open Debate:** The precise semantics/pragmatics boundary regarding force is a live issue.

  3.  **Assertion-as-Action Thesis:** *Even canonical "descriptive" utterances like assertions are fundamentally actions with normative consequences (e.g., committing the speaker, establishing presuppositions, changing the conversational score, imposing obligations).*
      *   **Content:** Saying "The cat is on the mat" isn't just describing a state; it's an act of *asserting*, which commits the speaker to its truth, presupposes the existence of a relevant cat and mat, changes what's taken for granted in the conversation, and makes the speaker responsible if false.
      *   **Assessment:** **Substantive, Defensible, and Important.** Deeply rooted in Austin, developed by Searle, Brandom (inferentialism), Stalnaker (common ground/presupposition), and integrated into much formal pragmatics and dynamic semantics.
      *   **Threat to TCS?** **Significant Challenge to *Narrow* TCS, Not Necessarily Fatal.** This shows that describing *is* a specific kind of doing, with complex non-representational effects. Pure TCS, focusing solely on truth conditions relative to a world, risks being descriptively inadequate and missing core functions of language. **However:** This motivates *expanding* semantics to be more dynamic and context-sensitive (e.g., Stalnakerian pragmatics, Discourse Representation Theory, Dynamic Semantics). These frameworks *incorporate* truth-conditions *within* a broader model of linguistic action and context change. The representational core isn't abandoned; its role in a system of action is elaborated. **Open Debate:** The extent to which the "action" aspects are semantic vs. pragmatic remains contested, but the need to account for them is widely recognized.

  4.  **Radical Non-Representationalism / Anti-Descriptivism:** *Language fundamentally *never* represents or describes an independent reality; its sole function is to perform actions within social contexts. Assigning truth conditions is a category mistake.*
      *   **Content:** The very idea of language "matching" or "failing to match" the world is incoherent. Truth conditions are illusory. Meaning is entirely constituted by use, social norms, and perlocutionary effects (effects on the hearer). Austin's critique of the "descriptive fallacy" is taken to its extreme.
      *   **Assessment:** **Highly Controversial & Generally Rejected as Confused/False.** While Austin critiqued the *primacy* of description, he *never* denied that language *can* describe or that truth/falsity apply to assertions. This view often conflates meaning with use, ignores the systematicity of language, struggles to explain phenomena like negation and conditionals without *some* representational element, and contradicts the intuitive success of descriptive science. It misreads Austin.
      *   **Threat to TCS?** **Total, if True (But it Probably Isn't).** This directly denies the foundational premise of TCS. However, its philosophical and empirical weaknesses make it an unconvincing basis for rejecting TCS wholesale. Its proponents are typically outside mainstream linguistics/philosophy (e.g., certain strands of postmodernism, radical pragmatism).

  ### 🔍 Most Likely Reading & Diagnostic Question

  *   **Most Likely Reading:** Your interlocutor was likely invoking **Reading 3 (Assertion-as-Action Thesis)**, possibly shading into **Reading 4 (Radical Non-Representationalism)**. Her claim that semantics treats language "as describing the world when in fact it never merely describes anything" strongly points to Reading 3. The jump to "built on sand" suggests she may be leaning towards the more radical implications of Reading 4, influenced by interpretations common in literary/critical theory that sometimes overextend Austin.
  *   **Diagnostic Question to Ask Her:** *"When someone says 'Snow is white,' do you think that utterance successfully describes a state of affairs in the world (even if it also does many other things like commit the speaker and change the context)? Or do you think the idea of it 'describing' or 'matching' the world at all is fundamentally mistaken?"*
      *   If she answers **Yes** (it can describe), she's holding **Reading 3**. This challenges *narrow* TCS but not necessarily TC semantics *integrated* with pragmatics/speech acts.
      *   If she answers **No** (description is fundamentally mistaken), she's holding **Reading 4**. This directly rejects TCS's core premise but is philosophically contentious and likely misreads Austin.

  ### 📚 Conclusion for Your Research

  Accepting **Reading 1 or 2** doesn't threaten TCS; it's background or a call for enrichment. **Reading 3** presents a serious and widely accepted challenge to *traditional*, narrowly focused TCS, demonstrating the need to integrate the study of linguistic action and context. Modern formal semantics (dynamic semantics, inquisitive semantics, game-theoretic semantics) actively responds to this challenge by building frameworks where truth conditions and context change work together. **Reading 4**, while rhetorically potent in critique, is generally seen as unsustainable and doesn't accurately reflect Austin's position. **You don't *need* a comeback in the sense of refuting her entirely, but understanding the nuances allows you to articulate why TCS, properly understood and developed, isn't "built on sand" but can actually incorporate the crucial insights about performativity and action.** The key is recognizing that describing *is* a performative act with normative consequences, not that representation doesn't occur.
