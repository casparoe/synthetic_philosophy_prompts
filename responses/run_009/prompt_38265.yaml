prompt: |-
  I'm a PhD student straddling philosophy of mind and cognitive science, and our reading group has just finished two weeks on Ryle's knowing-how / knowing-that distinction — the chapter of The Concept of Mind, plus the surrounding intellectualism literature. I've come out of it with a fistful of case verdicts that I trust individually but cannot make hang together, and rather than pick a side between Ryle and his opponents by label, I'd like to work the way I'd work any other reflective-equilibrium problem: state my verdicts, and ask what principle, if any, captures them.

  Here they are. A cyclist knows how to ride a bicycle even though, like nearly everyone, she would deny — and be genuinely baffled by — the fact that briefly steering into the turn is what keeps her upright; if you tell her this, she acquires a new piece of knowledge-that with no change whatsoever in what she can do. A veteran chicken-sexer can sort day-old chicks at near-ceiling accuracy, has no idea how she does it, and confabulates when pressed; she knows how to sex chicks, full stop. On the other side: someone who has read the entire manual — balance points, weight transfer, countersteering — and thus possesses every relevant proposition, but has never sat on a bike, does not know how to ride. And a resident who has memorized the Manhattan street grid can give flawless verbal directions, yet I don't think she knows her way around the way a cab driver does — though I notice I'd answer "yes" if she asked herself, in an ordinary practical mood, whether she knows how to get from the Met to the Whitney. Apparently I toggle between two readings without a rule for when.

  The trouble is that my verdicts cut in both directions: having all the propositions is not sufficient (the manual-reader, the grid-memorizer), and having none of them does not block the attribution (the cyclist, the sexer). So knowledge-how seems to come apart from knowledge-that on both sides — and yet when a novice pianist is drilled by explicit instruction until the movements become automatic, I'm tempted to say her knowledge-how was built out of knowledge-that which was then internalized away, which points in exactly the opposite direction. There is also one case I keep going back and forth on and can't verdict at all: a golfer with a bad case of the yips who retains every piece of propositional knowledge about the swing, can demonstrate it in slow motion, and cannot execute it under pressure. So here is my request: give me a principle, or a small set of ranked candidates, stated precisely enough to sort fresh cases; say which clause each of my verdicts motivates; tell me its verdicts on cases I haven't listed — including the yips case, and whether a system trained only on text about swimming could ever count as knowing how to swim; and be candid about which of my verdicts the best principle cannot accommodate, since I'd rather know now what I have to give up than discover it in the seminar.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle from a PhD student working at the intersection of philosophy of mind and cognitive science. They've been studying Ryle's knowing-how/knowing-that distinction and have come away with a set of intuitions that seem contradictory. 

  The user presents several clear cases: the bicycle rider who doesn't understand countersteering, the chicken-sexer who confabulates, the manual-reader who can't ride, and the resident who knows directions but not the city "like a cab driver." There's also the pianist who internalized explicit instructions, and the tricky yips case. 

  What makes this interesting is how their intuitions cut both ways against traditional intellectualist and anti-intellectualist positions. The core tension is: knowledge-how seems independent of knowledge-that in some cases (cyclist, sexer), yet connected in others (pianist). The resident case shows an especially subtle context-sensitivity in our attributions.

  I need to propose a principle that can reconcile these. The "Success-Ready Ability" framework seems promising because it centers practical capacity while accommodating different routes to that capacity. Key elements would be:
  - Distinguishing core performance from explanatory knowledge
  - Requiring embodied readiness for action
  - Recognizing different types of ability (declarative vs embodied)
  - Accounting for context sensitivity in attribution

  For the yips case, this framework suggests the golfer has explanatory knowledge-that and latent ability, but lacks success-ready capacity due to performance anxiety. The text-trained swimmer would fail because no embodied capacity exists.

  The resident case reveals something important: our language is context-sensitive. "Knowing how to get somewhere" can mean either route-recall (which the resident has) or holistic navigation (which requires embodied know-how). This isn't a flaw in the principle but reflects how language works.

  The main tension point is the pianist case - if knowledge-how emerges from internalized knowledge-that, doesn't that support intellectualism? But the framework can handle this by distinguishing the acquisition process from the current state of the ability. Once internalized, it becomes success-ready capacity no longer dependent on propositions.

  This user is clearly sophisticated - they've identified exactly where their intuitions create tension and are wisely asking where a principle might require adjusting those intuitions. The key move is recognizing that knowledge-that can be a developmental precursor without being constitutive of the mature ability.
answer: |-
  Based on your verdicts and the core tension you've identified, I propose the following principle as the best candidate to systematize your intuitions, ranked by its ability to capture your cases and handle new ones:

  **The Success-Ready Embodied Ability Principle (SREAP):**  
  *An agent S knows how to Φ if and only if S possesses a reliable, contextually appropriate embodied ability to Φ, grounded in sensorimotor dispositions, that is poised to generate successful performance in the relevant task environment when S intends to Φ. This ability must be functionally independent of concurrent propositional articulation for its successful execution.*

  ### Clause Breakdown & Your Verdicts:
  1.  **Reliable, Contextually Appropriate Embodied Ability:** Captures the cyclist, chicken-sexer, and cab driver. Their know-how resides in bodily skill and perception-action coupling, not declarative access. The manual-reader lacks this.
  2.  **Poised to Generate Successful Performance:** The yips golfer fails here (see below). The manual-reader also fails – knowledge isn't "poised" for execution.
  3.  **Functionally Independent of Concurrent Propositional Articulation:** Captures the cyclist and chicken-sexer. Their performance succeeds *despite* lacking (or having false) propositional descriptions. The pianist's acquired automaticity satisfies this.
  4.  **Sensorimotor Dispositions:** Explains why the text-trained "swimmer" fails (see below) and why the cab driver's know-how differs from the resident's declarative knowledge.

  ### Verdicts on Your Cases & New Ones:
  *   **Cyclist:** ✓ SREAP (1, 3). Embodied ability independent of countersteering theory.
  *   **Chicken-Sexer:** ✓ SREAP (1, 3). Embodied perceptual ability, confabulation irrelevant.
  *   **Manual-Reader:** ✗ SREAP (1, 2). Lacks embodied ability; propositions not poised for action.
  *   **Resident vs. Cab Driver:** 
      *   *Resident:* Does **not** know how "like a cab driver" ✗ SREAP (1, 4). Possesses declarative wayfinding (knowledge-*that* routes exist) but lacks the cabbie's embodied, flexible, sensorimotor navigation ability (e.g., handling detours, traffic flow, shortcuts based on landmarks/feel).
      *   *Resident's Self-Attribution ("get from Met to Whitney"):* **✓ Limited "know-how".** SREAP explains the toggle: In this *specific, constrained context* ("give verbal directions"), her declarative recall *is* the relevant ability (it's propositionally mediated wayfinding). SREAP clarifies this is a *different type* of know-how (declarative navigation) than the cabbie's (embodied navigation). Your intuition highlights context-sensitivity.
  *   **Pianist (Internalized):** ✓ SREAP (1, 3). Initial instruction provided scaffolding, but the *current* knowledge-how is the embodied ability now functionally independent of those propositions.
  *   **Yips Golfer:** ✗ SREAP (**2**). He possesses the sensorimotor dispositions *latently* (slow motion) and the propositions (knowledge-*that*), but his ability is **not poised to generate successful performance** under the relevant conditions (pressure). Anxiety disrupts the readiness/poise. He has *fragmented* know-how or *impaired access* to it.
  *   **Text-Trained "Swimmer" (LLM/Robot):** ✗ SREAP (**1, 4**). It possesses vast knowledge-*that* about swimming. It *might* simulate or describe swimming perfectly. But it utterly lacks *embodied sensorimotor dispositions* enabling actual locomotion in water. Without physical instantiation and interaction with the hydrodynamic environment, there is no embodied ability. (This verdict holds even if it controls a swimming robot remotely – the *agent* (the AI) still lacks the embodied dispositions).

  ### What SREAP Captures Well & Where It Challenges Your Verdicts
  *   **Captures:** The core independence of know-how from concurrent propositional articulation (Cyclist, Sexer). The insufficiency of propositions alone (Manual-Reader). The insufficiency of latent physical capacity without poised readiness (Yips Golfer). The necessity of embodiment (Text-Swimmer). The distinction between declarative and embodied navigation (Resident vs. Cab Driver). The possibility of know-how built *from* knowledge-that via internalization (Pianist).
  *   **Potential Tension / What You Might Need to Give Up:**
      *   **The Pianist Case & Internalization:** Your description ("*built out of* knowledge-that") leans intellectualist. SREAP accommodates the *acquisition path* but insists the *current state* is an embodied ability independent of propositions. If you feel strongly that the know-how *retains its propositional essence* even when automatic, SREAP forces you to abandon that. It treats the acquired skill as fundamentally non-propositional in its operational form. This is the cleanest way to preserve your other verdicts (especially Cyclist/Sexer vs Manual-Reader).
      *   **The Resident's Self-Attribution:** SREAP forces precision: you *must* distinguish between "knowing-how-to-give-directions" (which she has, declaratively) and "knowing-how-to-navigate-embodiedly" (which she lacks, like the cabbie). Abandon the idea that there's a single, unambiguous sense of "knows how to get from A to B" applicable equally to her and the cabbie. Context determines the ability being referenced.
      *   **The Yips Golfer:** SREAP provides a clear verdict (✗ Know-how). If you feel tempted to say he *does* know-how but just "can't access it" or "is impaired," SREAP pushes back: the functional readiness *is part of* know-how. Abandon the idea that latent capacity + propositions = know-how.

  ### Why SREAP Over Alternatives
  *   **Simple Anti-Intellectualism (Know-how = Ability):** Too vague. Fails to distinguish the Cab Driver's embodied skill from the Resident's declarative recall ("ability" to recite directions), and struggles with the Yips case (does he have the ability?).
  *   **Intellectualism (Know-how = Knowledge-that under a practical mode of presentation):** Directly contradicted by Cyclist/Sexer (know-how without relevant knowledge-that) and Manual-Reader (knowledge-that without know-how). Struggles mightily with embodiment (Text-Swimmer).
  *   **Rylean Multi-Track Dispositions:** Captures Cyclist/Sexer well but struggles to clearly exclude the Manual-Reader (couldn't reading generate dispositions to *talk* about biking?) and struggles with the precision needed for Resident vs Cab Driver/Yips. Less clear on the role of embodiment.
  *   **SREAP** incorporates Ryle's core anti-intellectualist insight (ability vs. contemplation) but refines it with insights from embodied cognition (sensorimotor dispositions), performance psychology (poise/readiness), and functional independence, providing the precision needed for your borderline cases.

  **Conclusion:** The Success-Ready Embodied Ability Principle best captures your reflective equilibrium. It requires you to:
  1.  **Abandon** the idea that knowledge-how built from knowledge-that retains its propositional nature in its operational form (Pianist case).
  2.  **Precisely distinguish** between declarative/linguistic abilities and embodied sensorimotor abilities, recognizing context-sensitivity in attribution (Resident case).
  3.  **Accept** that functional poise/readiness is constitutive of know-how, not just an add-on (Yips case).

  This preserves your core intuitions about the independence of skilled action from propositional articulation while providing a robust framework for novel cases, firmly grounding know-how in the capacity for successful, embodied action. Be prepared to defend the centrality of embodiment and functional poise against intellectualist challenges in the seminar.
