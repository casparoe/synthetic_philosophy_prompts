prompt: |-
  Two members of my experimental philosophy reading group, Marianne and Theo, got stuck on the Knobe effect at the end of last week's session, and their disagreement has continued into our group chat. I'll report it as fairly as I can and would like a verdict, because I can't work out who is right about what.

  For context: the effect involves the familiar case of a chairman of the board who is told that a new programme will increase profits and that it will also harm the environment; he says he doesn't care at all about harming the environment, he just wants to make as much profit as possible, and starts the programme. Most people asked whether he intentionally harmed the environment say yes. In the mirror version, where the programme will also help the environment and he says he doesn't care about helping it, most people asked whether he intentionally helped the environment say no. That's the phenomenon they were arguing about.

  (1) Marianne's opening move: in both versions the chairman knows about the side effect in advance and decides to proceed anyway, so on a purely descriptive concept of acting intentionally — foresight plus a settled decision — the two cases should get the same answer. The only thing that flips between versions is the moral valence of the side effect, and the answers flip with it. So the folk concept of intentional action is partly constituted by moral concerns; the competence itself is moralised, and armchair analyses that treat it as a purely descriptive concept got the folk wrong.

  (2) Theo's reply: the asymmetry shows nothing of the sort, because the survey question doesn't reach the concept cleanly. When you ask whether he intentionally harmed the environment, respondents hear a question about whether he's answerable for it, and answer that question instead; in the help version, saying yes would sound like a compliment he hasn't earned, so people say no. The composite answer differs even though the underlying concept may be untouched. The correct moral for experimental philosophy, he said, is that questionnaires are contaminated by conversational pragmatics, not that the concept has morality built in.

  (3) Marianne's second move: the pragmatic story predicts the asymmetry should disappear wherever blame is off the table, but it leaks everywhere. She claimed the effect has been found in children far too young to be strategic about blame attributions. And she cited a well-known follow-up study about office stationery: in a department where pens keep going missing, two people each take the last pen on the same day — one of whom is permitted to take pens, the other of whom is forbidden — and asked who caused the problem, respondents overwhelmingly name the person who violated the norm, even though both took a pen. A who-caused-it question is not plausibly heard as a covert blame question, yet norms bend the causal judgement all the same.

  (4) Theo's second reply: he was unconvinced that causal talk is the pristine register she needs. Calling the norm-violator the cause of the problem is itself a way of laying the outcome at his door; ordinary people say the driver, not the icy patch, caused the accident precisely when the driver broke a rule, and nobody concludes that the concept of causation is moralised — the moral layer affects what we choose to highlight, not what we represent. As for the children, he said that if the effect is a habit of ordinary conversation, we should expect it early, since children learn the habits of conversation before they learn anything else; the developmental data cuts both ways.

  (5) Marianne's closing move: she said the two views then seem to make the same predictions everywhere. If you build a version where the respondent is told the harmed party had it coming, her view predicts the intentionality judgement should track the respondent's own norms and soften, and she was confident Theo's view predicts the same, since on his story the respondent hears the question through those same norms. She pressed him: if no possible observation could separate the two accounts, his position isn't a rival hypothesis, just a refusal to accept hers.

  (6) Theo's closing reply: he said she had it backwards. If the folk practice is pragmatic through and through, there is no further fact about whether the concept is really moralised — the question is ill-formed, not undecidable, and his account is more parsimonious because it keeps one neutral concept plus an explanation of the enrichment, whereas she multiplies moralised concepts for every norm-sensitive judgement we make.

  That's where they left it. Please adjudicate move by move: say who is right about which specific point, not just who wins overall; treat any empirical claims they made as their claims, and note where the verdict would have to be qualified if a claim turns out not to hold. Then say what, if anything, both of them are missing. Finally, tell me where your adjudication is most likely to go wrong, and what argument or finding would change your verdict. Please answer in British English.
reasoning: |-
  Hmm, the user is asking me to adjudicate a philosophical debate between Marianne and Theo about the Knobe effect. They're members of an experimental philosophy reading group, and they've been arguing about why people judge intentional action differently in cases with positive versus negative side effects.

  Marianne argues that the folk concept of intentional action is inherently moralized - people's judgments change based on moral valence of outcomes. Theo counters that this is just pragmatic - people are answering subtly different questions about blameworthiness, not revealing a moralized concept.

  The user has reported their exchange in six moves and wants me to judge each point specifically, note where empirical claims might be shaky, identify what both are missing, and point out where my judgment could be wrong.

  Let me break this down move by move:

  For move (1), Marianne makes a strong point - the descriptive facts are identical in both cases (foresight and decision), only moral valence changes, and judgments flip. This does suggest morality influences intentionality judgments. Theo's objection in (2) is reasonable too - conversational pragmatics could explain why people answer differently to what superficially seems the same question.

  In move (3), Marianne brings good evidence from developmental psychology (children showing the effect) and causal judgment studies (the pen theft case). The pen case seems particularly damaging to Theo's position since "who caused it?" isn't naturally heard as a blame question.

  But Theo responds well in (4) - he notes that even causal language can have pragmatic dimensions (highlighting responsibility), and that children learning conversational habits early doesn't prove conceptual structure.

  In (5), Marianne makes an important methodological point - if both theories make identical predictions, Theo's position risks being unfalsifiable. But Theo counters in (6) with Occam's razor - his single neutral concept plus pragmatic enrichment is more parsimonious than multiplying moralized concepts.

  Both are missing something important though - the debate might rest on a false dichotomy. Evidence suggests both factors play roles: morality influences judgment directly through affective responses (supporting Marianne), while pragmatic factors shape how questions are interpreted (supporting Theo). The pen study actually shows norm violations affect even non-moral causal judgments, which complicates Theo's position.

  My adjudication could go wrong on several fronts: if new studies show the effect persists even when pragmatic pressures are removed (supporting Marianne), or if cognitive science finds no distinct moral "tag" in conceptual processing (supporting Theo). The developmental timeline matters too - if very young children show the effect before mastering conversational pragmatics, that favors Marianne.

  I'll structure my response to address each move specifically while acknowledging the nuanced reality that both cognitive and pragmatic factors likely interact in folk judgments.
answer: |-
  Right, let's break this down move by move as requested. This is a thorny debate in experimental philosophy, and both make reasonable points, but their disagreement hinges on fundamental assumptions.

  **Adjudication Move by Move:**

  1.  **Marianne's Opening Move (Descriptive symmetry + Moral flip):** **Largely Correct.** Her core observation is sound: the factual structure (foresight + decision to proceed) is identical in both cases, only the moral valence changes, and the intentionality judgments flip. This *prima facie* evidence strongly suggests moral valence influences the *application* of the folk concept of intentional action. However, she overreaches slightly by concluding the competence (the underlying concept itself) is *constituted* by moral concerns based *only* on this asymmetry. The asymmetry *necessitates* an explanation involving moral valence, but doesn't yet prove it's built into the concept itself rather than influencing its application via another mechanism (like Theo's pragmatics).
      *   *Qualification:* If subsequent studies found the asymmetry vanished when moral valence was controlled in specific ways (e.g., if the "harm" was seen as justified), this would weaken her stronger claim about concept constitution.

  2.  **Theo's First Reply (Pragmatic Contamination):** **Plausible but Incomplete.** Theo is right that conversational pragmatics *could* explain the asymmetry. Questions asked in natural language carry implicatures. "Intentionally harmed" might pragmatically imply blameworthiness more readily than "intentionally helped" implies praiseworthiness (due to negative bias). This is a legitimate alternative hypothesis. However, his claim that the survey question "doesn't reach the concept cleanly" doesn't *refute* Marianne; it merely offers a different explanation for the *same* data. He hasn't shown pragmatics *is* the explanation, only that it *could* be.
      *   *Qualification:* If robust studies showed the asymmetry persisted even when explicit blame/praise questions were asked separately *beforehand*, or when the phrasing was meticulously neutralised, Theo's pragmatic account would be weakened.

  3.  **Marianne's Second Move (Beyond Blame - Children & Causation):** **Strong Point against Theo's *Narrow* Pragmatics.** Marianne effectively counters Theo's specific blame-attribution pragmatics story. The pen study (a classic by Hitchcock & Knobe) is powerful evidence: both agents perform identical physical acts leading to the outcome, but the norm-violator is judged the "cause." A "who caused it?" question isn't naturally interpreted as "who is to blame?" in the same direct way "intentionally harmed" might be. Attributing this *causal* asymmetry purely to conversational implicature regarding blame is far less plausible. The developmental evidence (if accurate - see qualification) also challenges the idea that the effect requires sophisticated strategic blame-attribution.
      *   *Qualification:* Theo could argue that even "who caused it?" pragmatically highlights responsibility in context. The strength of the child studies depends on the specific age and methodology – if very young children *don't* show the effect, or if the tasks still involve implicit social evaluation, Theo might have a counter.

  4.  **Theo's Second Reply (Causal Talk & Development):** **Partially Correct Defence.** Theo is correct that causal attributions *can* serve pragmatic functions of highlighting responsibility ("laying the outcome at his door"). The driver/icy patch example is apt: we often *use* causal language to assign responsibility without necessarily believing causation itself is morally defined. He's also right that early acquisition of conversational habits doesn't *prove* the concept is moralised; it could just show early learning of pragmatic patterns. However, he underplays the force of the pen study. While causal language *can* be used pragmatically, the *systematic* shift based purely on norm violation in a context not overtly about blame strongly suggests the underlying judgment *process* is sensitive to norms, not just the *expression* of the judgment.
      *   *Qualification:* If neuroimaging or reaction-time studies showed distinct processing for norm-violating vs. norm-conforming causal scenarios, it would support Marianne's view of norm-sensitivity being deeper than pragmatic expression.

  5.  **Marianne's Closing Move (Predictive Equivalence):** **Correct Challenge.** Marianne astutely points out a potential problem: if both accounts predict that the respondent's *own* moral evaluation (e.g., whether the harmed party "had it coming") will modulate the intentionality judgment, then the theories become empirically indistinguishable on this front. Her challenge that Theo's position risks becoming unfalsifiable if it simply maps onto her predictions via pragmatics is valid. Theo needs a way his theory could make a *different* prediction.
      *   *Qualification:* Theo *could* potentially make different predictions. For instance, his pragmatics account might predict the effect disappears if the question is framed in a highly technical, decontextualised way designed to strip conversational implicature, while Marianne's moralised-concept account might predict the effect persists because the concept itself carries the moral sensitivity.

  6.  **Theo's Closing Reply (Pragmatics Through and Through & Parsimony):** **Philosophically Defensible but Empirically Challenged.** Theo's ontological point – that if the *only* evidence for a "moralised concept" comes from judgments shaped by pragmatic practices, then positing such a concept is unnecessary – is a valid philosophical stance (inspired by philosophers like Grice or perhaps Wittgenstein). His appeal to parsimony (one neutral concept + pragmatic enrichment vs. multiple moralised concepts) is also a standard theoretical virtue. **However, this is where Theo's position is weakest empirically.** The pen study *does* challenge this. Attributing *all* norm-sensitive judgments (intentional action, causation, perhaps others like 'doing something') *solely* to pragmatic enrichment of a single neutral concept becomes increasingly strained. The breadth and depth of the effect, especially in seemingly non-pragmatic contexts like the causal judgment study, make the "one neutral concept plus pragmatics" account less parsimonious *explanatorily* than it first appears. It struggles to explain *why* the pragmatics work *so systematically* along normative lines across diverse judgments.

  **What Both Are Missing:**

  1.  **The Role of Counterfactuals and Defaults:** Much subsequent work (e.g., by Joshua Knobe and others) suggests norm violations affect judgments by altering perceptions of *normal* or *permissible* alternatives. In the harm case, not harming is seen as the default/norm; proceeding anyway makes the outcome seem more directly attributable ("he did it"). In the help case, helping isn't the default/norm; proceeding without caring doesn't make helping seem actively produced. This perspective integrates norm-sensitivity without necessarily requiring the core concept itself to be "moralised" *or* reducing it entirely to pragmatics – it's about how norms structure the background against which actions are evaluated. Both overlook this potential cognitive mechanism.
  2.  **Affective Components:** Marianne leans towards cognitive moral "constitution," Theo towards pragmatic "enrichment." Both underplay the potential role of immediate *affective* responses (e.g., negative reaction to harming) in spontaneously shaping the cognitive processing of the scenario and the judgment, which might precede or bypass complex pragmatic calculations or conceptual analysis.
  3.  **A False Dichotomy?** They often present the options as mutually exclusive: *either* the concept is moralised *or* it's pragmatic enrichment. It might be both/and. The folk concept might inherently involve elements sensitive to reasons, goals, or agential involvement, and normative status (moral or otherwise) powerfully influences *how* we assess these elements (e.g., did the agent "bring about" the outcome?), and this process is then *expressed* through language subject to pragmatics. The pen study suggests norm-sensitivity is deep in the *judgment process* itself, not just the *expression*.

  **Where the Adjudication is Most Likely to Go Wrong and What Could Change It:**

  *   **Most Likely to Go Wrong:** The adjudication leans towards Marianne having the stronger empirical case, particularly due to the norm effect in causal judgments (pen study), while acknowledging Theo's valid philosophical concerns about concept constitution and parsimony. The biggest risk is underestimating the power of sophisticated pragmatic explanations to account for the *breadth* of the phenomena or overstating the case that the pen study *cannot* be explained pragmatically (Theo's "laying at his door" point has some force).
  *   **What Could Change the Verdict:**
      *   **For Theo:** Strong evidence that the Knobe effect and the pen effect *disappear* under conditions designed to eliminate conversational pragmatics (e.g., using non-verbal tasks, highly formalised language, or cross-linguistic studies showing the effect is absent in languages with very different pragmatics). Evidence that children *only* show the effect after mastering complex conversational implicatures related to blame.
      *   **For Marianne:** Strong evidence that the effect persists robustly in the pen-type causal judgment task even when respondents explicitly affirm the forbidden actor isn't *to blame* (sever the norm-violation from blame link). Neuroimaging or processing-time evidence showing distinct neural/cognitive pathways activated for intentionality judgments in negative vs. positive side-effect cases, or for norm-violating causal agents, suggesting deep conceptual or affective tagging. Evidence that very young infants show sensitivity to norm-violations affecting action/causal perception in non-social ways.
      *   **Overall:** Concrete evidence favouring the "counterfactual defaults" or strong affective priming models could shift the ground away from both their specific framings, showing a third way that better explains the data.

  In essence, Marianne presents the more compelling explanation for the *observed patterns* across multiple domains (intentionality, causation), suggesting norm-sensitivity is deeply embedded in folk psychological judgments. Theo rightly cautions against conflating how we *use* concepts with their core structure and highlights the messiness of language, but his purely pragmatic account struggles to explain the systematic and broad nature of the effects without becoming ad hoc. The truth likely involves a complex interplay of cognitive, affective, and pragmatic factors not fully captured by either position alone.
