prompt: |-
  Next month I'm presenting a paper to a workshop on distributive ethics defending the standard prioritarian claim that prioritarianism escapes the leveling-down objection. My thesis, in two parts: the objection is fatal to telic egalitarianism because the egalitarian must concede that making the better-off worse off, with no one gaining, is in one respect an improvement, whereas the prioritarian never has to say anything of the sort, since her view concerns how well off people are and never how people's levels compare with one another; and the priority weighting is grounded in the absolute badness of certain conditions, so nothing relational enters the foundations of the view. I want the weighting to be an intrinsic fact about the moral significance of a benefit to someone whose life is going badly, not a disguised comparison with how others are doing.

  The audience is mixed. Two committed utilitarians who will demand a principled stopping point for the weighting (why a 30 percent premium and not a 300 percent one) and who I suspect will press that even a strictly non-relational view favors what they will call weak leveling down: a transfer from better-off to worse-off that reduces total utility can still count as an improvement once the weighting applies, which they will say is leveling down in everything but name. A pair of relational egalitarians in the Anderson tradition who think the whole prioritarian framework is welfarist bookkeeping that treats persons as bins of wellbeing rather than participants in a relationship among equals. And several uncommitted graduate students, one of whom has been reading Scanlon on why the leveling-down objection may not be the embarrassment it is advertised to be, and will ask why, if Scanlon is right, I should be leaning so much of my case on escaping it.

  Please prepare my prep sheet: the objections in roughly the order they will arrive, phrased the way each member of that audience would phrase them; for each, a reply I can give in about two minutes, a note on where the reply is soft, and a flag for what I should concede up front rather than defend. Tell me which single reply has to land for the paper to survive the session. Finally, include the question I am hoping nobody asks.
reasoning: |-
  Okay, the user is presenting a paper defending prioritarianism against the leveling-down objection. They've outlined their thesis and the audience composition. Let me unpack this.

  First, the user's core argument has two pillars: (1) prioritarianism avoids leveling-down because it cares about absolute wellbeing, not comparisons; (2) priority weighting stems from intrinsic badness of suffering, not relativity. The audience includes utilitarians, relational egalitarians, and grad students influenced by Scanlon. 

  Hmm, the utilitarians' main concern will be about arbitrariness in priority weighting percentages. They'll also reframe priority-weighted transfers as "weak leveling down" since total utility decreases. This is tricky because the user needs to maintain that even with weighting, harming the better-off without benefit is unacceptable - but the utilitarians might blur that line.

  For the relational egalitarians, their objection cuts deeper. They reject welfarism entirely, seeing prioritarianism as treating people as "wellbeing bins." The user's defense must acknowledge this paradigm clash while showing prioritarianism still respects persons. But conceding some ground here seems wise - their frameworks are fundamentally different.

  The Scanlon-influenced grad student is the stealth threat. If leveling-down isn't actually problematic, the user's main advantage over egalitarianism vanishes. Need to pivot to emphasizing that prioritarianism's avoidance remains theoretically cleaner even if leveling-down isn fatal to egalitarianism.

  The "weak leveling down" counter from utilitarians feels like the linchpin. If the user can't cleanly distinguish priority-weighted transfers from leveling down, their core claim collapses. The reply must stress that benefiting the worse-off intrinsically matters - not at the expense of others - and that prioritarianism never endorses pure harm.

  The nightmare question? Probably why prioritarianism isn't just utilitarianism with extra steps. If the weighting is always applied, it might collapse into a variant of utilitarianism after all. The user needs to walk a tightrope explaining how weighting respects individual claims without becoming relational.

  Noticing the user's strong desire to keep the weighting non-relational. That's their hill to die on. Every reply must circle back to "absolute badness of suffering" as the foundation. Should prep metaphors about medical triage or disability accommodations - situations where we intuitively weight need without comparing to others.

  The concession points are well-placed: yes to utilitarians that weighting isn't perfectly precise (but precision isn't required), yes to relationalists that prioritarianism has limits (but it's one tool among many). Keeps the defense focused.

  Biggest vulnerability remains the Scanlon angle. Might suggest preparing a backup argument: "Even if you think egalitarians can live with leveling-down, prioritarianism gives you equality's benefits without that cost." Turns the tables.
answer: |-
  Here’s your prep sheet, structured for maximum tactical efficiency. Prioritize clarity, concede where necessary, and protect your core thesis.

  ---

  ### **Prep Sheet: Defending Prioritarianism Against Leveling-Down Objections**  
  **Core Thesis**: Prioritarianism escapes leveling-down (1) by focusing on absolute well-being (not comparisons), and (2) via non-relational priority weighting grounded in the intrinsic badness of deprivation.

  ---

  ### **Anticipated Objections & Replies**  
  *(Ordered by Likely Sequence)*  

  1. **Utilitarians’ Principled Stopping Point Challenge**  
     *Audience Phrasing*:  
     *"Your ‘priority weighting’ is arbitrary. Why cap it at 30% for the worst-off? Why not 300%? Without a principled limit, this collapses into radical egalitarianism or opens the door to massive utility losses."*  
     - **Your 2-Minute Reply**:  
       "The weighting isn’t arbitrary; it reflects the *diminishing moral value* of absolute well-being gains. A 300% premium would imply near-infinite weight to suffering—contradicting empirical evidence about wellbeing thresholds (e.g., a starving person gains vastly more from bread than a millionaire). We calibrate to avoid social collapse while prioritizing urgent needs. It’s constrained by **practical reasonability**, not metaphysics."  
     - **Soft Spot**:  
       Admits calibration isn’t derived from first principles. May feel ad hoc to utilitarians.  
     - **Concede Upfront**:  
       *"Yes, exact weights require contextual judgment—but so does utilitarianism when weighing preferences. The key is that weights track absolute welfare, not relativity."*  

  2. **Utilitarians’ "Weak Leveling-Down" Charge**  
     *Audience Phrasing*:  
     *"Your view still endorses leveling down! If a transfer from better-off to worse-off reduces total utility but satisfies priority weighting, you’re just rebranding leveling down as ‘moral improvement.’"*  
     - **Your 2-Minute Reply**:  
       "No—**leveling-down requires making someone worse off with *no one gaining***. Priority-weighted transfers *always improve absolute well-being for the worse-off*. If total utility falls, it’s due to efficiency trade-offs (e.g., progressive taxation), not leveling down. Unlike egalitarians, I **never** endorse harming the better-off *without benefit to others*. This is redistribution, not leveling."  
     - **Soft Spot**:  
       Utilitarians may argue reduced total utility *is* a net harm akin to leveling.  
     - **Crucial Landing Point**:  
       **This reply must land.** If the audience equates priority-weighted transfers with leveling-down, your thesis collapses. Hammer: *"Leveling-down is *harm without gain*. Priority weighting is *gain for some, possibly less gain for others*—a utilitarian dilemma, not leveling."*  

  3. **Relational Egalitarians’ Welfarism Critique**  
     *Audience Phrasing*:  
     *"Prioritarianism reduces people to ‘wellbeing bins.’ It ignores relational equality—treating humans as equals demands democratic participation and dignity, not just weighted utility transfers."*  
     - **Your 2-Minute Reply**:  
       "I share your concern for social relations—but prioritarianism addresses a *distinct question*: how to distribute goods when relational equality is already secured. Weighting isn’t about status; it’s about the **intrinsic badness of suffering**. Giving more medicine to a gravely ill patient isn’t denying their dignity—it’s responding to their absolute need. This view *complements* relational equality but targets material deprivation."  
     - **Soft Spot**:  
       Relationalists see prioritarianism as parasitic on their framework.  
     - **Concede Upfront**:  
       *"Yes, prioritarianism alone can’t achieve social equality—but it ensures we don’t overlook acute deprivation while pursuing it."*  

  4. **Scanlon-Inspired Graduate Student’s Challenge**  
     *Audience Phrasing*:  
     *"If Scanlon is right that leveling-down isn’t decisive against egalitarianism (e.g., because equality has symbolic value), why hinge your case on escaping it? Maybe egalitarians *should* accept leveling-down in some respects."*  
     - **Your 2-Minute Reply**:  
       "Scanlon’s move saves egalitarianism only by watering it down—admitting leveling-down isn’t an *all-things-considered* improvement, but has ‘some respect’ value. Prioritarianism avoids this entirely: **no respect** justifies harming some without benefit. That’s a cleaner, more intuitive solution. Escaping leveling-down isn’t just tactical—it reveals egalitarianism’s foundational incoherence."  
     - **Soft Spot**:  
       Scanlonians may argue "in one respect" improvements matter for social solidarity.  
     - **Strategic Shift**:  
       *"Even if you tolerate leveling-down ‘in one respect,’ prioritarianism offers a theory that never requires that trade-off."*  

  ---

  ### **The Nightmare Question (Hope Nobody Asks)**  
  *"Isn’t your ‘non-relational’ priority weighting secretly comparative? If the ‘absolute badness of suffering’ depends on societal context (e.g., poverty in Norway vs. Somalia), haven’t you smuggled relativism in?"*  
     - **Why It’s Dangerous**:  
       Forces you to either (a) concede contextual relativity (undermining non-relational foundations) or (b) embrace absolutism (risking irrelevance to real-world policy).  
     - **Salvage Strategy**:  
       *"The *core badness* of, say, chronic pain or starvation is absolute. Context affects *how we alleviate it*, but the moral urgency originates in the individual’s state, not comparison. Prioritarianism captures this urgency without relational benchmarks."*  

  ---

  ### **Tactical Summary**  
  - **Make or Break Reply**: Distinguishing priority-weighted transfers from leveling-down (Objection 2). If this fails, your thesis is vulnerable.  
  - **Concessions Are Strength**: Admit prioritarianism’s limits (e.g., doesn’t solve relational equality) to defend its core.  
  - **Reframe Relentlessly**: Anchor replies in "absolute well-being" and "intrinsic badness of suffering." Avoid "equality" language.  
  - **Audience Management**: Nod to utilitarians’ math concerns, grant relationalists their domain, and engage grad students on Scanlon’s concessions.  

  **Final Tip**: Open with a concrete example—e.g., "Giving a painkiller to a terminal patient over a healthy person isn’t about equality; it’s about the absolute horror of unrelieved agony." This primes the audience for your non-relational framing.  

  You’ve got this. Prioritarians unite (but with weighted urgency)! 📈⚖️
