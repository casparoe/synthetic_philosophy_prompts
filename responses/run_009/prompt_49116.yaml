prompt: |-
  My friend Maya and I run a small reading group on labor history, and over the years she has developed very firm instincts about which forms of collective action are legitimate and which are not. Her track record, as best I can reconstruct it: an authorized wage strike called after a genuine bargaining impasse, legitimate; a wildcat walkout over a machine that had just seriously injured a coworker, called with no vote at all, legitimate; a secondary boycott in which a union picketed a neutral supermarket in order to pressure the distributor it actually had the dispute with, illegitimate; a one-day national general strike called to protest a pensions bill rather than any workplace grievance, illegitimate; and a work-to-rule campaign in which railway dispatchers followed every safety regulation to the letter and slowed the whole network down, legitimate. She also, if I remember right, called a coordinated overtime ban legitimate, though she seemed noticeably less confident about that one.

  Maya and I have started collecting contemporary cases to test her instincts, and next month it's my turn to bring one and argue it with her. I've shortlisted three: first, couriers for a delivery app, with no union and no formal vote, coordinate through a group chat to decline all orders from a restaurant chain whose own staff are on strike over how the chain treats them — the couriers' own pay and conditions are untouched; second, the same couriers, a month later, coordinate a simultaneous one-night "logout" over algorithmic pay cuts, deliberately timed to a citywide festival so the disruption is as visible as possible; third, a construction local votes unanimously to refuse to build a warehouse on the site of a community garden, even though the members' own terms and conditions are entirely fine and the developer has done nothing to them.

  Predict her verdicts on the three cases. Note that more than one principle fits her track record as I've stated it — identify the plausible candidate rules and say what each one predicts here — then give your best guess for each case, with your reasons for preferring that reading of her. Finally, tell me which further case would best discriminate between the candidate rules, since I'd like to bring that one to the reading group as well. Lead with your bottom-line predictions in your first sentence, then give the reasoning; no preamble and no restating of the setup.
reasoning: |-
  Hmm, the user is describing a friend named Maya who has strong instincts about what forms of collective action are legitimate or not, based on several historical examples. Now they're presenting three contemporary cases involving couriers and construction workers and want me to predict Maya's verdicts on each.

  Looking at Maya's track record, she seems to have certain principles about legitimacy. For instance, she approved of a wildcat walkout over safety concerns without a vote, but rejected a secondary boycott targeting a neutral supermarket. She also rejected a national general strike about pensions since it wasn't workplace-related, but approved of a work-to-rule campaign that followed safety regulations. There was also an overtime ban she was unsure about.

  I need to identify plausible rules that fit her pattern. One principle seems to be about the site of the dispute - whether the action targets the workers' direct employer. Another might be about the nature of the grievance - whether it's tied to immediate workplace issues like safety or wages versus broader political causes. Union authorization and voting procedures also seem to matter to her, though she made exceptions for urgent cases like the safety walkout.

  For the three cases: First, couriers boycotting a restaurant chain to support its striking workers - this feels like a secondary boycott similar to what Maya rejected before. Second, couriers logging out over algorithmic pay cuts during a festival - this targets their own employer about pay, so might be legitimate despite lack of union/vote, like the wildcat safety walkout. Third, construction workers refusing to build on a garden site - this seems like a political/environmental protest unrelated to their workplace, similar to the rejected general strike about pensions.

  The most ambiguous case is the overtime ban where Maya was uncertain - it might be borderline if it's not a direct refusal but a slowdown.

  I'll predict Maya would see the first case as illegitimate (secondary boycott), the second as legitimate (direct workplace grievance), and the third as illegitimate (non-workplace issue). To discriminate between the principles, I should suggest a case that contrasts direct targeting with non-workplace issues - perhaps a union refusing to handle goods from an unethical supplier that isn't their direct employer. That would test whether site matters more than cause.

  I'll structure my response to first give the bottom-line predictions, then explain the reasoning with candidate rules, and finally suggest a discriminating case - all without preamble as requested.
answer: |-
  **Bottom-line predictions:** Maya will deem the couriers' restaurant boycott illegitimate, the algorithmic pay logout legitimate, and the construction garden refusal illegitimate.

  **Reasoning:**

  **Candidate Rules from Track Record:**
  1.  **Direct Targeting Principle:** Action must target the *direct employer* with whom workers have the grievance. Violated by secondary boycotts (supermarket case).
  2.  **Workplace Nexus Principle:** Grievance must be a *direct workplace issue* (wages, safety, conditions) for the acting workers, not broader political/social goals. Violated by the pensions general strike and (arguably) the community garden.
  3.  **Urgency/Authorization Spectrum:** Formal votes/union authorization are preferred, but waived for *immediate, grave workplace dangers* (wildcat injury walkout). Work-to-rule and coordinated overtime bans (less confident) are legitimate slowdowns over workplace issues. Actions over non-immediate/non-grave issues likely require process.

  **Application to Cases & Best Guess:**

  1.  **Couriers' Restaurant Boycott:**
      *   *Direct Targeting Prediction:* **Illegitimate.** They target a neutral third party (restaurant chain) to pressure the distributor (their true dispute target), mirroring the illegitimate supermarket boycott.
      *   *Workplace Nexus Prediction:* **Illegitimate.** The couriers' own pay/conditions are untouched; it's solidarity action for another group's workplace grievance.
      *   *Urgency/Authorization Prediction:* **Illegitimate.** No immediate danger or grave issue for the couriers themselves; no union or vote (though lack of vote might be less critical if the cause were direct/urgent).
      *   **Best Guess: Illegitimate.** Strongest fit is the Direct Targeting principle (secondary action). The Workplace Nexus principle also clearly applies. Maya rejected the secondary boycott, and this case is analogous.

  2.  **Couriers' Algorithmic Pay Logout:**
      *   *Direct Targeting Prediction:* **Legitimate.** Targets their direct employer (app platform) over a direct workplace issue (pay).
      *   *Workplace Nexus Prediction:* **Legitimate.** Direct grievance over their own pay and conditions.
      *   *Urgency/Authorization Prediction:* **Ambiguous/Likely Legitimate.** Algorithmic pay cuts are a direct workplace grievance. While no union or formal vote exists (a negative), Maya accepted the wildcat walkout over an immediate safety danger. This isn't immediate physical danger, but it's a direct, concrete economic harm. Coordinating via group chat resembles the "coordination" in the overtime ban she tentatively accepted. The disruptive timing (festival) is strategic but doesn't change the core legitimacy of protesting their own pay.
      *   **Best Guess: Legitimate.** The Direct Targeting and Workplace Nexus principles strongly support legitimacy. The lack of process is the main counter, but Maya waived it for the urgent safety wildcat. While less urgent, the directness of the pay grievance and the parallels to the coordinated overtime ban (which she accepted, albeit less confidently) make legitimacy more likely than not.

  3.  **Construction Garden Refusal:**
      *   *Direct Targeting Prediction:* **Likely Legitimate.** Targets their direct employer (developer) regarding the work they are hired to perform.
      *   *Workplace Nexus Prediction:* **Illegitimate.** Their own terms/conditions are fine; the developer hasn't wronged *them*. The grievance is external (community garden destruction), akin to the pensions bill being a political grievance.
      *   *Urgency/Authorization Prediction:* **Ambiguous/Likely Illegitimate.** Unanimous vote shows process, but the *cause* is the problem. Maya rejected the national strike over a pensions bill (political) despite likely formal process. This is a local environmental/community grievance, not a workplace issue for the members.
      *   **Best Guess: Illegitimate.** The Workplace Nexus principle is decisive here, mirroring her rejection of the pensions strike. While they have a vote and target their employer, the *cause* is fundamentally not about their own workplace relationship. The Direct Targeting principle is satisfied but overridden by the lack of workplace nexus in her precedent.

  **Discriminating Case:** A **unionized warehouse crew unanimously voting to refuse handling goods from a specific supplier known for severe labor abuses (e.g., child labor), despite no direct grievance against their own employer regarding those goods or that supplier.**

  *   **Why it Discriminates:**
      *   It tests the *priority* between **Direct Targeting** (targeting their own employer by refusing work) and **Workplace Nexus** (the grievance is external – labor abuses by *another* employer, not their own conditions).
      *   It has **Authorization** (union vote), removing that variable.
      *   If Maya deems it **Illegitimate**, Workplace Nexus (own conditions untouched) is likely her dominant rule, overriding Direct Targeting. Her pensions strike rejection supports this.
      *   If Maya deems it **Legitimate**, Direct Targeting (action against own employer) and the moral weight of the external grievance might override the lack of a direct workplace nexus for *her*. This would distinguish her from the pensions strike rejection, showing she accepts actions over *some* external moral issues if targeting the direct employer with proper process. Her uncertainty on the overtime ban might hint at this possibility for borderline cases.
