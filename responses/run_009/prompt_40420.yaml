  For the verdicts, I'll cover three readings of historical materialism. Strong economism would deny the feedback loop, insisting the superstructure can't alter the base, but that seems implausible here. The conciliatory reading (like Engels) could absorb phases one and two, then use phase three to claim long-run priority for the base—but is that explanatory or just immunizing? For Cohen's functional explanation, the persistence of the altered ritual is explained by its utility to the new base, but without detailing selection mechanisms, it risks being tautological.

