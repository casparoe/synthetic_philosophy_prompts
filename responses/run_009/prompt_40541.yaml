answer: |-
  The rain slicked the window of Elara Vance’s home office, turning the sodium glow of Riverton’s streetlights into watery halos. Below her third-floor apartment, the city hummed – not just with traffic, but with the invisible thrum of thousands of conditional prediction markets resolving futures. Riverton had embraced Futarchy ten years ago. Citizens still voted, but only to elect representatives who set the "Civic Flourishing Index" – a cold, hard number aggregating quarterly GDP per capita, city-wide health metrics (like ER admissions for preventable causes), and the annual Subjective Well-Being Survey (SWBS), where a random 0.1% of residents rated their life satisfaction on a scale of 1-10. Policy proposals? Those lived and died in the markets. Traders bet vast sums on whether a specific policy would raise or lower the CFI compared to the status quo after a set period. The highest-probability outcome became law. "Vote on Values, Bet on Beliefs," the slogan went. Elara, a former municipal bond trader turned full-time policy market speculator, had done well. She believed in the system's ruthless logic. Mostly.

  Tonight, Proposal R-247 dominated the feeds: *Privatize Riverton Riverfront Parks & Trails for Managed Development (Residential/Commercial Mix).* The market would settle in 72 hours. Elara’s screens glowed with probability trees, correlation matrices, and historical data. Her gut said privatization would hollow out the city’s green heart, replacing accessible parkland with luxury condos only the wealthy could enjoy. But her gut wasn’t currency. Beliefs were.

  She drilled into the CFI components. GDP would undoubtedly spike short-term from development – easy win. Health metrics? ER admissions for asthma, a key indicator, were currently elevated. Privatization proponents argued better-managed spaces might reduce pollution triggers. Skeptics pointed to construction dust and increased traffic. It was muddy. Then she opened the SWBS module. The annual survey window was *next week*.

  A cold prickle ran up her spine. The SWBS sample was random… but timing wasn’t. The survey ran for two weeks. What if the sample skewed towards those *benefiting* from the *announcement* of privatization? Property owners near the riverfront anticipating windfalls? The initial buzz of "progress"? Elara pulled demographic maps overlaid with property values and past SWBS response locations. The correlation wasn’t perfect, but it was there: wealthier neighborhoods, more optimistic responses. A policy announcement timed just before the survey could nudge the SWBS upward, purely on anticipation, before any concrete *harm* – like displaced communities or environmental damage – manifested or was widely felt. The CFI would capture that transient optimism.

  Then, the health metric flaw clicked. ER admissions for respiratory issues were highly seasonal, peaking in late summer humidity and plummeting in crisp autumn. The CFI measurement period for R-247 ended in *November*. Even if privatization *increased* pollution long-term, the worst impacts wouldn’t hit ERs until *after* the market settled. The cold, dry autumn air would artificially suppress the key health metric during the critical evaluation window.

  It was Goodhart laid bare: the Civic Flourishing Index, designed to measure wellbeing, could be gamed. Betting "YES" on R-247 wasn't about believing privatization fostered genuine flourishing. It was betting on the system's blind spots: transient survey optimism and a seasonal lag in health data. The math was pristine. The ethics were silt.

  Elara leaned back, the glow of the screens reflecting in her wide eyes. She *knew* this. She could see the path. Dump her savings – the buffer against her son’s asthma meds, the aging Honda’s transmission, the precarious mortgage – into the "YES" contract. The probability was shifting; others were sniffing the exploit. She could ride the wave, profit massively from a policy she despised. That was the futarchist ideal, wasn’t it? Putting money solely where your *predictive belief* was, divorcing it utterly from values? The market aggregated truth, purified by greed. Her personal aversion to riverfront condos was irrelevant noise. Betting "YES" *was* the disciplined move, the system working as intended, revealing the *actual* expected CFI outcome, exploit and all.

  But the image flashed: her son, seven years old, gasping on a park bench by the river after chasing pigeons, the panic in his eyes easing only with the inhaler. The dappled sunlight through the old oaves, the smell of damp earth and river water, the *free* space that felt like a lung for the whole city. Privatization meant gates. It meant "Residents Only." It meant that bench might be a granite planter for boutique shrubs. Would the CFI capture the loss of that breath, that freedom? The survey might tick up on promises; the ER might dip with the season. But the city would bleed something vital the index couldn’t quantify.

  Her finger hovered over the trading interface. The "YES" probability ticked up another 0.3%. Momentum. Belief. She could be rich. She could prove the system flawed by exploiting it, maybe even draw attention to the index's weaknesses. Or she could bet "NO," a declaration of faith in real flourishing, a bet against the exploit she saw – a bet that would likely lose her everything if the market, in its cold wisdom, validated the gamed metrics.

  The futarchist constitution was clear: the market decided. Not values, but aggregated belief about measurable outcomes. Was betting "YES" a profound betrayal of her city, her son, herself? Or was refusing to bet her belief – the belief in the exploit's effectiveness – the *true* betrayal of the system's core discipline? Was integrity found in following the logic or in defying it for something deeper?

  The rain intensified, blurring the city lights into streaks of gold and sodium orange. The countdown clock on R-247 glowed: 71:59:22. Elara Vance’s hand didn’t move. The cursor blinked, a tiny, insistent heartbeat on the screen, poised between conviction and complicity, belief and value, the pristine math and the muddy riverbank. The market awaited her signal. The city’s future, measured in a flawed number, hung in the humid, charged silence. She took a shuddering breath, the sound loud in the quiet room, and reached for the keyboard.

