  Below is a decision tree designed to sort participants into positions on the moral difference between lying and misleading. It starts from your specified common commitment ("Deliberately causing someone to have a false belief is pro tanto wrong") and branches through concrete cases. The tree uses your listed examples (scalar implicature, true-conjunct dodge, answering a different question, half-truth, pure omission, and non-verbal misleading) as diagnostic nodes. I'll first present the tree, then explain my commitments, predictions, and reasoning.

