  ### **Leaf Positions**
  1. **Leaf 1: Contextualist Hybrid**  
     - No consistent intrinsic difference; moral weight depends on context (e.g., relationships, stakes). Misleading can be as bad as lying in high-trust scenarios (like your "intimates" point) but less bad in others. *Triggered by mixed answers (e.g., Q2=B or Q4=B).*

  2. **Leaf 2: Responsibility-Shifting View**  
     - Misleading is *worse* than lying in key ways: it forces the victim to "manufacture" the false belief, making them complicit and adding psychological harm. Lies are "cleaner" deceits. *Triggered by "worse" answers (e.g., Q2=C or Q6=A).*

  3. **Leaf 3: Equivalence View**  
     - No intrinsic moral difference; lying and misleading are equally wrong because both intend the same harm (false belief). Any differences are contingent (e.g., ease of detection). *Triggered by consistent "just as bad" answers (e.g., Q4=A, Q5=A).*

  4. **Leaf 4: Standard Moral-Difference View**  
     - Lies are intrinsically worse because they involve asserting falsehoods, violating a core norm of communication. Misleading uses truth or omission and is less bad, though both can be wrong. *Triggered by "less bad" answers with no absolutism (e.g., Q7=B).*

  5. **Leaf 5: Strict Kantian View**  
     - Lying is always wrong (it violates autonomy/trust). Misleading is sometimes permissible if it uses truth, but it can still be wrong if deceptive. There’s a moral difference, but lying is uniquely egregious. *Triggered by absolutism (Q7=A).*

