  2. **Diagnostic Cases: Pure Omission (Q2) and Kantian Threshold (Q7)**  
     - **Pure Omission (Q2):** This is the strongest test for responsibility-shifting. If omission feels "worse," it’s because the victim is left to sustain their own false belief. If it feels "less bad," it’s because no active deception occurred.  
     - **Kantian Threshold (Q7):** This separates deontologists (absolutists) from consequentalists/others in the moral-difference camp. It’s placed late to avoid abstract theory early.  
