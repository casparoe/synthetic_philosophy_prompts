  - **A) Just as bad as lying.** → Go to Question 4.  
  - **B) Less bad than lying.** → Go to Leaf 1 (Contextualist Hybrid).  
  - **C) Worse than lying.** → Go to Leaf 2 (Responsibility-Shifting View).  

  #### **Question 3 (for B from Q1): Non-Verbal Misleading**  
