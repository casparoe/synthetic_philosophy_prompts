  ### **Decision Tree: Moral Difference Between Lying and Misleading**

  **Start:** Everyone agrees that deliberately causing someone to have a false belief is pro tanto wrong (i.e., it's a wrong-making feature, even if overridden by other factors).

  #### **Question 1: Scalar Implicature Dodge**  
  *Scenario:* You ate all the cookies. Your partner asks, "Did you eat all the cookies?" and you say, "I ate some of them" (true, but implies you didn't eat all).  
  *Is this as morally bad as lying (e.g., saying "No, I didn't eat them all" when you did)?*  
  - **A) Just as bad as lying.** → Go to Question 2.  
  - **B) Less bad than lying.** → Go to Question 3.  
  - **C) Worse than lying.** → Go to Question 6.  

  #### **Question 2 (for A from Q1): Pure Omission**  
  *Scenario:* Your friend thinks a meeting is at 10 AM (it was changed to 9 AM). You know they're wrong and say nothing, causing them to miss it.  
