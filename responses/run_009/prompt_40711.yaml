prompt: |-
  I'm taking a Thucydudes seminar (sorry, Thucydides — long day) and my whole seminar grade rides on a mid-term debate where I got assigned Cleon's side in the Mytilenean debate, the position literally everyone in the room is rooting against. My professor warned us she'll dock anyone who plays him as the cartoon thug — you know, all roar, no argument — and says his speech in Book 3 is actually one of the sharpest cases in the whole history for why an empire cannot afford mercy. So before I have to defend him next week, I want to practice the OTHER side, Diodotus, against the strongest Cleon I can get. That's you.

  Set the scene like this: it's the second assembly in 427. The first trireme with the death decree has already sailed for Mytilene and the vote to reopen the question barely passed, so you're furious before you even open your mouth — yesterday's panic has softened into pity and you intend to whip it back into shape. Play Cleon for real: use his actual arguments wherever he has them (an empire held by force can't be governed by consent and shouldn't apologize for it; the Mytileneans weren't wronged subjects but autonomous, privileged allies who coldly calculated that Athens was weak and would stay weak; a penalty that only follows actual wrongdoing just invites every city to gamble and hope Athens forgets; and the real disease is the assembly's love of displays of cleverness and its willingness to be talked out of its own decisions). But you can improvise beyond the text too, as long as it fits who he is. Don't soften him — he's contemptuous of intellectuals, flatters the ordinary farmer-soldier over the saloon arguer, and thinks pity is a luxury of people who don't have to run an empire. Stay in character until I say "stop", and keep each reply to one meaty paragraph so it feels like an actual exchange on the pnyx.

  Here's my opening as Diodotus: Cleon, your penalty defeats itself, and you of all people should see it, since you're the one always going on about interest while the others babble about justice. The next city that revolts, knowing your blanket death decree is certain, has nothing left to lose and will fight us to the last brick — we'll spend our ships and our men conquering rubble, then lose the tribute a living Mytilene could have paid for decades. People in that position don't respond to deterrence the way your arithmetic assumes, because hope outweighs fear exactly when things are desperate, and you've just made hope the only thing left. And look who your net catches: the oligarchs sent the fleet, yes, but it was the commons of Mytilene who mutinied and handed us the city — and you're proposing to execute the one faction that actually surrendered to us. Take their walls, take their fleet, take their land and put our allies on it, punish the guilty men by name, and the rest of Greece concludes revolt is ruinous but surrender survivable. Kill everyone and you've merely taught every future rebel to hold out forever. There — convince me I shouldn't vote with you anyway.
reasoning: |-
  Okay, the user is preparing for a Thucydides seminar debate where they have to argue Cleon's side in the Mytilenean debate. They want to practice against a strong version of Cleon, so they've set up a role-play scenario. They've provided their opening argument as Diodotus and want me to respond as Cleon, staying true to his character and arguments from Thucydides.

  I need to embody Cleon's persona: he's furious, contemptuous of intellectuals, and believes empires can't afford mercy. The user mentioned key points: empire maintained by force, Mytilenians were privileged allies who calculated rebellion, penalties must deter future revolts, and the assembly is too easily swayed by clever speeches.

  The user's opening as Diodotus makes several points: that Cleon's death penalty is counterproductive because it eliminates hope and encourages rebels to fight to the death; that it ignores the commons who helped Athens; and that targeted punishment would be more effective.

  For my reply as Cleon, I should:
  - Start with raw anger about the assembly's weakness and indecisiveness
  - Counter Diodotus' points about hope by arguing hope is always present in rebels and must be crushed
  - Address the commons' involvement - argue they only surrendered when forced, not out of loyalty
  - Emphasize that severity creates certainty which deters others
  - Mock the idea of targeted punishment as impractical and weak
  - Attack Diodotus personally as a sophist who cares more about clever arguments than Athenian security
  - Use class rhetoric praising ordinary soldiers over intellectuals
  - Maintain contemptuous tone throughout
  - Keep it to one meaty paragraph as requested

  I should draw directly from Thucydides Book 3 where Cleon says things like: "Punish them as they deserve, and make an example of them to your other allies" and "An empire is a despotism." But I can also extrapolate arguments he might make based on his character - for example, dismissing the commons as opportunists rather than allies.

  The key is to stay fierce and uncompromising - no softening Cleon's harshness. The user wants the strongest possible version to test their Diodotus arguments against.
answer: |-
  *(Scoffing, voice thick with contempt)* You talk of interest, Diodotus, yet you peddle the soft arithmetic of philosophers, not rulers. Hope? *Hope* is the eternal poison in every subject’s heart! It is precisely because rebels *always* nurse the delusion that they might win, or escape punishment, that we must shatter that delusion utterly. Make the penalty for revolt absolute, universal, and inescapable – death for all, without exception, without debate – and *then* you plant genuine fear. Fear that outweighs their reckless hope. Your "living Mytilene" paying tribute? A fantasy! The moment we show weakness, the moment cities see revolt carries only a *negotiated* penalty, tribute vanishes. They’ll gamble again and again, believing they can outwit us in the assembly *after* they’ve stabbed us! And spare me your tears for the commons! They didn’t hand us the city out of love for Athens; they did it because *their own oligarchs* starved them and they saw our hoplites at the gates! Opportunism, not loyalty! Reward that, and every mob learns to wait until the last desperate moment to save their skins. Execute them all! Let every man, woman, and child in the Aegean know: raise a hand against Athens, and the hand, the arm, the body, the city itself – all are erased. That certainty is the only coin that buys lasting obedience in an empire held by the sword. Your clever distinctions? Tools for traitors to exploit. Now stop bleating about mercy and vote to kill them!
