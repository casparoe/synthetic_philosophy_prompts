  ### Requirements for a Theory of Choice Under Risk with Convergence-Sensitive Gambles

  Your query centers on gambles with conditionally convergent expectations (e.g., the alternating payoff coin-flip game) and their implications for decision theory. Below, I distill the essential requirements, categorizing them by motivation and negotiability. The goal is to ensure consistency with well-behaved cases while handling pathological gambles. I conclude with a note on conflicts and the viability of "no expectation" and "capped utility" approaches.

  ---

  #### **Core Requirements**  
  *Motivation: Foundational rationality, mathematical consistency, and alignment with empirical intuition.*

  1. **Finite Gambles (Non-negotiable)**  
     - **Requirement**: The theory must assign values to finite gambles (discrete outcomes with finite support) and satisfy the axioms of expected utility (EU) for these cases (e.g., monotonicity, linearity in probabilities).  
     - **Motivation**: This is the bedrock of decision theory. Failure here invalidates the entire framework. Finite gambles are well-defined and uncontroversial, with EU as the gold standard.

  2. **Strict Dominance (Non-negotiable)**  
     - **Requirement**: If gamble \(A\) pays strictly more than gamble \(B\) in every possible state, then \(A \succ B\) (strictly preferred).  
     - **Motivation**: A cornerstone of rational choice. In your example, the companion game (payoffs strictly better statewise) must be preferred to the original, regardless of convergence issues.

  3. **Absolutely Convergent Expectation (Non-negotiable)**  
     - **Requirement**: Gambles with absolutely convergent expected utility series (i.e., \(\sum |u_i| p_i < \infty\)) must have a well-defined expectation equal to \(\sum u_i p_i\), invariant to summation order.  
     - **Motivation**: Absolute convergence guarantees the expectation is a property of the gamble, not the summation order (per Riemann rearrangement). This aligns with Lebesgue integration and ensures robustness.

  4. **Distinction Between Divergent and Undefined Expectations (Non-negotiable)**  
     - **Requirement**: The theory must differentiate:  
       - *Infinite expectation*: \(\sum u_i p_i = \pm\infty\) (e.g., St. Petersburg paradox).  
       - *No expectation*: The series \(\sum u_i p_i\) converges conditionally or diverges without a signed infinity.  
     - **Motivation**: Conflating these leads to paradoxes. Conditionally convergent series (like your coin-flip game) have no invariant "expectation" – reordering terms alters the sum. The St. Petersburg gamble (\(\sum 1 = \infty\)) is fundamentally different.

  5. **Limit Consistency (Negotiable, but desirable)**  
     - **Requirement**: If a sequence of well-behaved gambles \(\{G_n\}\) converges pointwise to a gamble \(G\), and \(\lim_{n\to\infty} E[G_n]\) exists, then \(E[G] = \lim_{n\to\infty} E[G_n]\).  
     - **Motivation**: Ensures continuity with approximations (e.g., truncating the coin-flip game at large \(n\)). Violations risk inconsistencies with finite cases. *Taste*: Weaker forms (e.g., requiring absolute convergence for limits) may suffice.

  6. **Statewise Dominance Extension (Non-negotiable)**  
     - **Requirement**: Strict dominance must hold even for gambles without defined expectations.  
     - **Motivation**: Your companion game must be preferred to the original, as it dominates statewise. This is non-negotiable for rationality, irrespective of expectation existence.

  ---

  #### **Conflict Analysis: Joint Satisfiability**  
  The central tension arises between:  
  - **Strict dominance** (requires comparing pathological gambles).  
  - **Limit consistency** (demands convergence of truncated approximations).  
  - **Distinction between infinite/undefined expectations** (forbids assigning reals to conditionally convergent series).  

  **Crucially, these are jointly unsatisfiable if we demand real-valued expectations for all gambles.**  
  - The coin-flip game and its companion have conditionally convergent series. Assigning them real expectations (e.g., \(\ln 2\)) violates order invariance (Riemann rearrangement).  
  - Yet, strict dominance requires \(A \succ B\) for the companion vs. original.  
  - Limit consistency (via truncation) suggests \(E[A] = \ln 2 + C > \ln 2 = E[B]\), but this depends on summation order.  

  **Resolution**: A consistent theory must:  
  - Assign no real expectation to conditionally convergent gambles.  
  - Retain strict dominance via statewise comparison (bypassing expectations).  
  - Relax limit consistency to avoid contradictions (e.g., only require it for absolutely convergent limits).  

  ---

  #### **Survival of Proposed Approaches**  
  - **"Expectation does not exist, deal with it"**:  
    **Survives** all non-negotiable requirements. By refusing to assign expectations to conditionally convergent gambles, it upholds the distinction between divergent and undefined expectations. Strict dominance is enforced statewise, not via expectations. Limit consistency applies only when safe (e.g., absolutely convergent sequences).  

  - **"Cap the utilities"**:  
    **Fails** strict dominance. Capping utilities (e.g., \(u \leq M\)) forces absolute convergence but violates statewise dominance: if the companion game has a payoff exceeding \(M\) in some state where the original is \(< M\), capping may erase the dominance. For example, if \(M = 1000\) and a state has \(u_A = 1001 > u_B = 1000\), capping sets both to \(1000\), breaking dominance.

  ---

  ### Summary  
  A viable theory must:  
  1. **Preserve EU for finite gambles and absolutely convergent cases**.  
  2. **Enforce strict dominance universally** (even without expectations).  
  3. **Declare expectations undefined for conditionally convergent series**.  
  4. **Distinguish infinite expectations from non-existence**.  
  5. **Relax limit consistency** to avoid contradictions (e.g., require absolute convergence for interchanging limits).  

  This framework handles your coin-flip game:  
  - The original and companion have **no expectation** (conditional convergence).  
  - Strict dominance **still prefers the companion** state by state.  
  - "No expectation" is consistent; "capped utility" is not (fails dominance).  

  The price is incompleteness (some non-dominant gambles remain uncomparable), but this is necessary to avoid mathematical contradictions.
