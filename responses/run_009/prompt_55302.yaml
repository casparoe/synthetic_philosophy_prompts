  Below is a decision procedure designed to help your team identify and respond to multipolar traps (e.g., prisoner's dilemmas, races to the bottom) in practical settings. It combines game theory, coordination principles, and escalation paths into a 5-step checklist. The procedure takes **<60 minutes** to run, requires no specialized background, and outputs one of five actions. Crucially, it flags when decisions shift from factual analysis to **values-based judgments** (where engineers alone cannot decide) and explicitly warns when it **cannot reliably distinguish** between a genuine trap and rationalization.

  ---

  ### **Multipolar Trap Decision Procedure**  
  *(Run during planning sessions; 1 facilitator + stakeholders)*  

  #### **Step 1: Shared Preference Check**  
  **Question:** *"If all participants could coordinate safely, would they prefer a different outcome over the current race?"*  
  - **Why?** Tests if the trap is driven by mutual distrust (e.g., prisoner's dilemma) or true competition.  
  - **Evidence needed:** Anonymous polls, private convos, industry norms. Avoid assumptions.  
  - **Outputs:**  
    - ✅ **YES** → Proceed to Step 2.  
    - ❌ **NO** → Proceed to Step 4 (might be hard competition).  

  #### **Step 2: Participant & Race Reality Check**  
  **Question:** *"Can we identify specific opponents, and is the race verified (not imagined)?"*  
  - **Why?** Separates real races (e.g., vs. competitors) from phantom pressures (e.g., internal anxiety).  
  - **Evidence needed:** Data on penalties for losing (e.g., lost deals, reprimands) vs. vague fears.  
  - **Outputs:**  
    - ✅ **Specific opponents + race verified** → Proceed to Step 3.  
    - 🟡 **Specific opponents but race unverified** → Proceed to Step 4.  
    - ❌ **No clear opponents** → Output: **Premise is wrong** (not a trap).  

  #### **Step 3: Coordination Feasibility**  
  **Question:** *"Can we coordinate with opponents via communication, trust, or enforcement?"*  
  - **Why?** Tests if cooperation is institutionally possible (e.g., contracts, leadership, norms).  
  - **Factors:**  
    - **Internal opponents:** Shared manager? Escalation path?  
    - **External opponents:** Legal/trust barriers? Trade associations?  
  - **Outputs:**  
    - ✅ **Feasible (e.g., common VP, enforceable pact)** → Output: **Try to coordinate**.  
    - ❌ **Infeasible (e.g., no trust, antitrust risks)** → Proceed to Step 5.  

  #### **Step 4: Race Impact Reassessment**  
  **Question:** *"What’s the proven cost of losing the race vs. the cost of competing?"*  
  - **Why?** Prevents rationalization. Forces evidence-based weighing of tradeoffs.  
  - **Evidence needed:** Metrics on losses (e.g., revenue dip if slower) vs. gains (e.g., reliability if safer).  
  - **Outputs:**  
    - ✅ **Race cost > competing cost** → Proceed to Step 5.  
    - ❌ **Race cost < competing cost** OR **no evidence** → Output: **Exit the race**.  

  #### **Step 5: Exit Feasibility**  
  **Question:** *"Can we unilaterally exit without catastrophic harm?"*  
  - **Why?** Tests if you can "defect" sustainably (e.g., differentiate, absorb losses).  
  - **Factors:** Strategic pivots, buffers (cash/time), moral limits.  
  - **Outputs:**  
    - ✅ **Yes (e.g., niche market, ethical branding)** → Output: **Exit the race**.  
    - ❌ **No (e.g., bankruptcy risk)** → Output: **Just compete and accept it**.  

  #### **Final Outputs**  
  1. `Exit the race`  
  2. `Try to coordinate`  
  3. `Escalate above teams`  
  4. `Just compete and accept it`  
  5. `Premise is wrong`  

  ---

  ### **Key Honest Disclaimers**  
  1. **Where facts end and values begin:**  
     - Step 1 (shared preference) and Step 5 (exit feasibility) involve **values judgments** (e.g., "Is this outcome acceptable?"). Engineers alone *cannot* resolve these—they require input from leadership/legal/ethics.  
     - **Example:** Privacy violations (Case 3) hinge on ethics, not game theory. The procedure flags this but won’t decide for you.  

  2. **Trap vs. rationalization ambiguity:**  
     - The procedure **cannot always distinguish** between a real trap and your team rationalizing avoidance of hard work. Step 2 (race verification) and Step 4 (impact reassessment) mitigate this by demanding evidence, but biased data gathering can skew results. **Counter-tactic:** Invite an outsider (e.g., product manager) to audit evidence.  

  ---

  ### **Case Applications**  

  #### **Case 1: On-Call Response Time Ratchet**  
  - **Step 1:** ✅ *Shared preference?* YES. Both teams prefer 15-minute responses but fear admitting it.  
  - **Step 2:** ✅ *Specific opponents + verified?* YES (other team), verified (5-minute claim caused visible pressure).  
  - **Step 3:** ✅ *Coordination feasible?* YES. Teams share a VP → **Output: `Escalate above teams`** (VP sets org-wide standard).  
  - **Why not rationalization?** Step 4 flags that "competing" (5-minute responses) has clear costs (burnout), while "losing" (15-minutes) has no proven penalties.  

  #### **Case 2: Rushing Feature, Skipping Load Testing**  
  - **Step 1:** ❌ *Shared preference?* NO. Competitor won’t prefer delay (they gain by winning).  
  - **Step 2:** ✅ *Specific opponents + verified?* YES (named competitor), verified (market intelligence confirms rivalry).  
  - **Proceed to Step 4:** ✅ *Race cost > competing cost?* YES. Missing launch = proven revenue loss; skipping tests = potential (not guaranteed) outage.  
  - **Step 5:** ❌ *Exit feasible?* NO. Delaying risks market share → **Output: `Just compete and accept it`**.  
  - **Unlikable but honest:** Ethics aren’t flagged (no values breach), and evidence validates the race.  

  #### **Case 3: Privacy Gray Area w/ Competitors**  
  - **Step 1:** ❌ *Shared preference?* NO. Competitors profit from data harvesting; no incentive to stop.  
  - **Step 2:** ✅ *Specific opponents + verified?* YES (competitors named), verified (lawyers confirm revenue impact).  
  - **Proceed to Step 4:** ✅ *Race cost > competing cost?* YES. "Losing" = provable revenue drop; "competing" = ethical/legal risk.  
  - **Step 5:** ❌ *Exit feasible?* NO. Leadership rejects revenue loss → **Output: `Just compete and accept it`**.  
  - **Values alert:** Step 5 triggers a **values judgment** (privacy violation). The procedure outputs compete, but engineers *should escalate to leadership/legal* to override.  

  ---

  ### **When to Override the Procedure**  
  - **Values conflicts (e.g., Case 3):** If competing requires unethical/illegal acts, `Exit the race` or `Escalate`—even if the checklist says otherwise.  
  - **Ambiguous evidence:** If Steps 2/4 yield "maybe," default to `Premise is wrong` and re-audit.  
  - **Leadership context:** If executives incentivize the race (e.g., bonus structures), coordinate/escalate *first*.  

  This procedure won’t solve all traps—but it forces clarity on what’s possible, what’s real, and when to hand off decisions. Run it quarterly and refine based on outcomes.
