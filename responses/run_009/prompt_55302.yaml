  But we don't want to make the procedure too complex. We'll note that at the end.

  **Final Output Mapping**

  We map the path through the steps to one of the outputs:

  - If Step 1: Shared preference exists → Then we go through Steps 2 and 3 to try to achieve coordination or escalation.
  - If Step 1: No shared preference → Then we go to Step 4 to check if the race is real. If real, then compete; if imagined, then exit might be possible (Step 5).

