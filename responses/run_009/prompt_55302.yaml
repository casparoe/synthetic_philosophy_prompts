  We are designing a decision procedure based on game theory and political philosophy concepts (like Moloch, prisoner's dilemma, races to the bottom) to help teams identify and escape multipolar traps (situations where individual rationality leads to collectively worse outcomes).

  The procedure should be a checklist with a series of questions that can be answered in about an hour by engineers without a philosophy background. At the end, it should output one of the following:
  - Exit the race
  - Try to coordinate
  - Escalate above the teams
  - Just compete and accept it
  - The premise is wrong (meaning we misdiagnosed the situation)

  We'll structure the checklist in steps, each step having one or more questions. The steps are designed to progressively narrow down the situation and identify the appropriate action.

  ### Decision Procedure Checklist

  **Step 1: Verify the existence of a multipolar trap**
