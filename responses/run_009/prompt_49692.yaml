          Q2: A and Q7: A -> dualism.
          Q2: B and Q7: B -> phenomenal concept view.

     But note: they might choose Q2: A and Q7: B, which is inconsistent. We'll have to note that.

  For non-propositional:

     - If in Q1 they choose B or C, and in Q2 they choose C, and in Q6 they choose A for ability or B for acquaintance.

     Specifically:
          If they choose Q1: B and Q6: A and Q8: B -> ability hypothesis.
          If they choose Q1: C and Q6: B and Q8: A -> acquaintance hypothesis.

  But they might not be consistent.

  Also, for representationalism, we can use Q5: A.

  But note: a representationalist might be a physicalist and also hold the phenomenal concept view, so they might choose in Q5: A and in Q2: B.

  So we can say that if they choose Q5: A and they are not dualism (i.e., they don't choose new fact in Q2 and Q7), then they might be representationalist.

  But Jackson's representationalism is a specific view that might be captured by the phenomenal concept view.

  Given the complexity, we'll provide a flowchart in the key.

  We'll also admit where the quiz is inconclusive.

  Finally, we'll note any unexplored combination.

  Let's write the scoring key.

  Scoring Key:

  1. If you answered:
        Q4: A (she knew all along) and Q7: D (nothing new at all),
     then your view is most similar to **deflationism** (associated with Daniel Dennett). You think that if the physical description is complete, there is nothing left to learn.

  2. If you answered:
        Q2: A (new fact) and/or Q7: A (new non-physical fact), and you did not choose deflationism,
     then your view is most similar to **dualism**. You think that there are non-physical facts about experience that cannot be learned from physical science alone.

  3. If you answered:
        Q2: B (old fact, new mode) and/or Q7: B (old fact, new mode), and you did not choose deflationism or dualism,
     then your view is most similar to the **phenomenal concept view** (associated with Brian Loar). You think that what is gained is a new way of thinking about the same physical facts.

  4. If you answered:
        Q1: B (abilities) and Q6: A (only abilities) and Q8: B (ability to recreate),
     then your view is most similar to the **ability hypothesis** (associated with David Lewis and Laurence Nemirow). You think that what is gained is not knowledge of facts but practical abilities.

  5. If you answered:
        Q1: C (direct familiarity) and Q6: B (acquaintance is primary) and Q8: A (direct acquaintance in memory),
     then your view is most similar to the **acquaintance hypothesis** (associated with Earl Conee). You think that what is gained is a kind of direct familiarity that is not reducible to abilities or facts.

  6. If you answered:
        Q5: A (difference in represented properties) and you are not a dualist (i.e., you did not choose new facts in Q2 and Q7),
     then your view has elements of **representationalism** (associated with Frank Jackson's later view). You think that the phenomenal character of experience is determined by its representational content.

  Note: Some combinations of answers may not fit any of these positions. For example:

     - If you think that nothing is gained in some cases (like deflationism) but in other cases you think something non-propositional is gained, that might be inconsistent or an unexplored position.

     - The ability and acquaintance hypotheses are hard to distinguish by cases alone. If your answers are mixed (e.g., sometimes ability and sometimes acquaintance), you may be undecided between them.

     - The phenomenal concept view and representationalism are both physicalist views that may overlap. If you hold the phenomenal concept view and also chose Q5: A, you may be a representationalist.

     - If you think that what is gained is a new fact (dualism) in some cases and an old fact in a new mode (phenomenal concept) in others, that may be unstable.

  We admit that this quiz is not perfect and that some positions are very close. The purpose is to prompt reflection.

  Finally, we note that Jackson's own later view (representationalism) is a physicalist view that might be captured by the phenomenal concept view plus representationalism.

