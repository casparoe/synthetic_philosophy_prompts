prompt: |-
  For the past several years I have covered machine-learning research for a general-interest science magazine, and few arguments in that beat have proven as durable, or as unproductive, as the one about whether neural networks have representations. The immediate occasion is the wave of work in which researchers train sparse autoencoders to decompose a model's internal activations into thousands of interpretable directions — "features" for sarcasm, for security flaws in code, for sycophantic praise — reportedly finding more features than the network has neurons, a packing arrangement its proponents call superposition. On one side of the argument stand researchers I will call the realists: they hold that a trained network literally encodes features of the world, and that this line of work is in the business of discovering the network's own ontology. On the other side stand the deflationists: they hold that "representation" is a word researchers use, that a network's internal computation admits many equally serviceable decompositions, and that interpretability imposes a useful vocabulary on a network rather than finding one already there. In my reporting, the two camps turn out to agree about far more of the experiments than their polemics suggest, and to disagree about matters that no experiment as currently designed would settle.

  Rather than publish another he-said-she-said feature, I would like to commission the document both camps could put their names to: the joint statement of a good-faith adversarial collaboration between a realist and a deflationist about representations in neural networks. Please draft it with the following components.

  First, a numbered section of agreed claims. It should record what both camps accept about the empirical record — that linear probes can extract substantial information about inputs from internal activations; that intervening along certain activation directions reliably and somewhat selectively changes model behavior, as in the steering results; that models trained on apparently narrow tasks often develop internal structure responsive to facts beyond those tasks; and that interpretability has delivered genuine practical utility. Each of these should be phrased so that a deflationist could sign it without thereby conceding realism, and vice versa.

  Second, a disagreements table. Each residual disagreement must be stated so that the side holding it would accept the wording as a fair statement of its own view: the realist's claims should be worded as claims about the network's own decomposition, not merely about a useful one, and the deflationist's as claims about underdetermination among decompositions, not as claims that interpretability is useless.

  Third, a cruxes section. My reporting suggests at least three candidates: (a) whether there is a fact of the matter about a network's natural feature decomposition, or whether the choice among candidate decompositions is constrained only by pragmatic criteria such as sparsity and ease of human labeling; (b) whether successful steering shows that interpretability has located structures the network itself uses in its computations, or only that the network is broadly sensitive to directions in activation space — the difference between discovering a mechanism and constructing a control interface; and (c) whether convergence among independent methods — probing, mechanistic circuit analysis, sparse-autoencoder decompositions — would count as evidence that a real ontology has been discovered, and whether such convergence will in fact be observed as the methods mature. Add other cruxes you identify; and if you judge that one of my candidates is not a genuine crux, say so and explain why.

  Fourth, for each crux, the concrete test, argument, or case that both sides agree bears on it, with each side's prediction recorded in advance. The point of the exercise is precisely that these predictions are written down now, where they can embarrass their authors later.

  Finally, close with a verdict on which parts of the dispute are verbal: state whether, once the empirical facts about information flow and manipulability are fixed, the two camps are left disagreeing only about whether words like "genuine" and "discovery" apply — and if so, identify exactly which residual disagreement that verbal residue attaches to and which parts survive as substantive.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between a realist and a deflationist regarding representations in neural networks. The statement has five components:

  1. **Agreed Claims**: A numbered list of empirical facts both camps accept, phrased neutrally so that neither side is conceding their core position.

  2. **Disagreements Table**: A clear statement of residual disagreements, worded so that each side would accept the phrasing as fair to their view.

  3. **Cruxes Section**: Key points of disagreement that could be resolved by future evidence, including the three candidates provided and any others we identify. We must evaluate if the provided cruxes are genuine and explain if any are not.

  4. **Tests and Predictions**: For each crux, a concrete test or argument that both sides agree bears on it, along with each side's prediction.

  5. **Verbal Dispute Analysis**: A closing verdict on which parts of the dispute are merely verbal and which are substantive.

  Let's address each component step by step.

  ---

  ### 1. Agreed Claims

  We list empirical findings that both realists and deflationists accept. The phrasing must be neutral and not presuppose either realism or deflationism.

  **Agreed Claims:**

  1. **Information Extraction via Linear Probes**: From internal activations of a trained neural network, linear probes (simple classifiers) can extract substantial information about various input properties, including those not explicitly supervised during training.

  2. **Behavioral Steering via Activation Intervention**: Intervening on internal activations along certain directions (e.g., by adding vectors identified through interpretability methods) can reliably and somewhat selectively change the model's output behavior in predictable ways.

  3. **Emergence of Task-Extrinsic Structure**: Models trained on apparently narrow tasks often develop internal activation patterns that are responsive to facts or concepts beyond the immediate task (e.g., a model trained on image classification may develop sensitivity to object parts, textures, or even abstract concepts like symmetry).

  4. **Practical Utility of Interpretability**: Methods developed under the banner of interpretability (including but not limited to feature visualization, attribution methods, and automated feature discovery) have delivered genuine practical benefits, such as debugging models, improving model safety, and providing insights for model design.

  Each claim is stated in terms of observable phenomena without implying whether the features are "real" in the network or just useful constructs.

  ---

  ### 2. Disagreements Table

  We state the core disagreements in a way that each side would endorse the wording for their own view.

  **Disagreements:**

  | Realist Position                                                                                                | Deflationist Position                                                                                                |
  |-----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|
  | Neural networks learn and use a specific set of features (an "ontology") that represent aspects of the world, and the goal of interpretability is to discover this pre-existing decomposition. | The internal computations of neural networks can be described by many different decompositions into features, and interpretability methods impose a useful decomposition rather than revealing one that is uniquely there. |
  | When an interpretability method (such as sparse autoencoders) identifies a feature direction that allows for selective behavioral control, it is because that direction corresponds to a feature that the network itself uses in its internal computations. | The success of steering does not imply that the network uses the identified feature direction as a computational primitive; it only shows that the network's behavior is sensitive to that direction, which may be one of many equivalent ways to intervene. |
  | The convergence of multiple independent interpretability methods (e.g., probing, circuit analysis, and sparse autoencoders) on similar features would provide evidence that these features are real components of the network's computational mechanism. | Convergence among methods may reflect shared biases or pragmatic choices (such as sparsity) and does not necessarily indicate a unique underlying reality; the same network may admit multiple equally valid decompositions. |

  ---

  ### 3. Cruxes Section

  We list the cruxes (key points of disagreement that could be resolved by future evidence). We have three candidates:

  **(a) Natural Feature Decomposition**: Is there a fact of the matter about a network's natural feature decomposition, or is the choice among decompositions only constrained by pragmatic criteria?

  **(b) Interpretation of Steering**: Does successful steering show that interpretability has located structures the network itself uses, or only that the network is sensitive to that direction?

  **(c) Convergence as Evidence**: Would convergence among independent methods count as evidence for a real ontology, and will such convergence be observed?

  We must add any other cruxes we identify and evaluate if any of the provided ones are not genuine.

  **Additional Crux**:

  **(d) Invariance under Retraining**: If we retrain the same network architecture on the same data (with different initializations), do interpretability methods consistently identify the same set of features (up to symmetry), or do the features vary arbitrarily? This speaks to the uniqueness of the decomposition.

  **Evaluation of Candidate Cruxes**:

  - All three candidates are genuine cruxes because they represent empirical questions that could be resolved by future experiments and because both sides agree that evidence on these points would bear on the disagreement.

  ---

  **Cruxes Section**:

  1. **Natural Feature Decomposition**: Is there a fact of the matter about a network's "natural" feature decomposition (i.e., one that the network uses in its computations), or is the choice among candidate decompositions constrained only by pragmatic criteria (such as sparsity, interpretability to humans, or ease of labeling)?

  2. **Interpretation of Steering**: When an interpretability method identifies a direction in activation space that allows for selective behavioral control (steering), does this show that the network itself uses that direction as a feature in its internal computations (i.e., it is part of the network's causal mechanism), or does it only show that the network is broadly sensitive to interventions along that direction (which might be one of many equivalent control points)?

  3. **Convergence as Evidence**: If multiple independent interpretability methods (e.g., linear probing, mechanistic circuit analysis, and sparse autoencoder features) converge on the same set of features, would this convergence count as evidence that these features are part of the network's own ontology? Moreover, will such convergence be observed as these methods mature?

  4. **Invariance under Retraining**: When training multiple instances of the same model architecture on the same dataset (with different random seeds), do interpretability methods (e.g., sparse autoencoders) consistently recover the same set of features (modulo symmetries such as permutation and scaling), or do the features vary substantially across runs in a way that cannot be explained by simple symmetries?

  ---

  ### 4. Tests and Predictions

  For each crux, we propose a concrete test or argument that both sides agree bears on the crux, and then state each side's prediction.

  **Crux 1: Natural Feature Decomposition**

  - **Test**: Train a sparse autoencoder (SAE) on the activations of a neural network to obtain a set of features. Then, using the same network and data, train multiple SAEs with different random initializations and hyperparameters (e.g., varying sparsity penalties) and compare the sets of features. Do the features converge to a similar set (e.g., as measured by their ability to reconstruct activations and by semantic similarity of the top examples) even under varying hyperparameters? Also, compare with features from other methods (e.g., independent component analysis, non-negative matrix factorization) to see if they yield similar features.

  - **Realist Prediction**: The features will converge to a similar set across hyperparameters and methods, especially when the methods are well-tuned. The network has a natural decomposition that constrains the features we can find.

  - **Deflationist Prediction**: The features will vary depending on the hyperparameters and method used. There will be many equally good decompositions that are not simply related by symmetry, and the choice among them is driven by pragmatic criteria.

  **Crux 2: Interpretation of Steering**

  - **Test**: Identify a feature direction via an SAE that allows steering (e.g., increasing the feature increases the model's output of sycophancy). Then, ablate individual neurons that are highly active for that feature and measure the effect on the model's behavior both for the steered behavior and for other tasks. Also, compare with random directions that have similar activation magnitudes.

  - **Realist Prediction**: The feature direction will be implemented by a sparse set of neurons that are causally important for the behavior. Ablating these neurons will specifically impair the model's ability to perform the related task without affecting unrelated tasks. Random directions will not show such specific effects.

  - **Deflationist Prediction**: The effects of ablation will be distributed and non-specific. The same behavioral change can be achieved by many directions, and ablating neurons associated with one feature will affect multiple behaviors. The steering direction is one of many possible control points.

  **Crux 3: Convergence as Evidence**

  - **Test**: Apply multiple independent methods (e.g., linear probing, circuit analysis via causal interventions, and SAEs) to the same network and dataset to identify features for a specific concept (e.g., "sycophancy"). Measure the agreement between the methods (e.g., by comparing the directions they identify and their behavioral effects). Then, do the same for multiple network architectures and training datasets.

  - **Realist Prediction**: As methods mature, they will converge on similar features across different methods and architectures, especially for fundamental concepts. This convergence will be evidence for a shared underlying reality.

  - **Deflationist Prediction**: While there might be some overlap due to shared biases (e.g., toward sparsity), the methods will not fully converge. Different methods will reveal different decompositions, and the same concept may be represented in multiple ways even within the same network.

  **Crux 4: Invariance under Retraining**

  - **Test**: Train multiple instances of the same model architecture on the same dataset (with different random seeds). For each instance, use a fixed method (e.g., SAE with fixed hyperparameters) to extract features. Then, compare the features across runs. Are the features semantically similar (e.g., do they fire on similar inputs) and can they be matched by a simple transformation (like permutation)?

  - **Realist Prediction**: The features will be consistent across runs, modulo symmetries (e.g., permutation of neurons and scaling). The network learns a consistent set of features.

  - **Deflationist Prediction**: The features will vary substantially across runs beyond what can be explained by symmetry. The network's internal structure is underdetermined by the training data and task, allowing for multiple decompositions.

  ---

  ### 5. Verbal Dispute Analysis

  We close by analyzing which parts of the dispute are verbal (i.e., about the use of words) and which are substantive.

  **Verdict**:

  The dispute has both substantive and verbal components.

  - **Substantive Disagreements**: The cruxes identified above are substantive because they make empirically testable predictions about the world (e.g., whether features are invariant under retraining, whether ablations are specific, etc.). The answers to these questions will impact our understanding of how neural networks work.

  - **Verbal Disagreement**: Once the empirical facts are fixed (e.g., about the flow of information and the effects of interventions), there remains a disagreement about the use of terms such as "genuine representation," "discovery," and "ontology." 

  Specifically, the verbal residue attaches to the question:

  > Given the empirical facts (e.g., that we can extract information, steer behavior, and that there might be convergence or not), is it appropriate to say that we have discovered the network's own features, or are we merely imposing a useful vocabulary?

  The realist insists that if there is a unique decomposition that is causally efficacious and invariant, then it is the network's own ontology. The deflationist argues that even in that case, the decomposition is still just one of many possible descriptions and that the language of "discovery" is misleading because it implies a pre-existing reality independent of our methods.

  Thus, the core verbal disagreement is about the semantics of the word "representation" and related terms. However, note that the substantive cruxes (like invariance) bear on the viability of the realist's position: if the features vary arbitrarily, then the realist's claim of a unique decomposition is empirically undermined. Conversely, if features are highly invariant and causally specific, the realist position gains empirical support.

  Therefore, the verbal residue does not make the entire dispute non-substantive. The substantive disagreements (captured in the cruxes) are about the structure of the network's internal computations, and the verbal part is about how to describe that structure once known.

  ---

  **Final Joint Statement Draft**:

  We, the undersigned realist and deflationist, agree on the following empirical facts about neural networks and interpretability:

  1. Linear probes can extract substantial information about various input properties from internal activations of trained neural networks.
  2. Intervening along certain directions in activation space can reliably and somewhat selectively change model behavior (steering).
  3. Models trained on narrow tasks often develop internal structure responsive to concepts beyond the immediate task.
  4. Interpretability methods have delivered genuine practical utility in debugging, safety, and model design.

  However, we disagree on the following points:

  - **Realist View**: Neural networks learn and use a specific set of features (an ontology) that represent the world, and interpretability aims to discover this pre-existing decomposition.
  - **Deflationist View**: The internal computations admit many equally serviceable decompositions, and interpretability imposes a useful vocabulary rather than revealing one already there.

  To resolve our disagreements, we identify the following cruxes and commit to the following tests and predictions:

  **Crux 1: Natural Feature Decomposition**  
  - Test: Compare SAE features across varying hyperparameters and methods.  
  - Realist Prediction: Features will converge to a similar set.  
  - Deflationist Prediction: Features will vary arbitrarily with hyperparameters.

  **Crux 2: Interpretation of Steering**  
  - Test: Ablate neurons associated with a steering direction and measure specificity.  
  - Realist Prediction: Ablation causes specific behavioral deficits.  
  - Deflationist Prediction: Effects are distributed and non-specific.

  **Crux 3: Convergence as Evidence**  
  - Test: Apply multiple interpretability methods and measure agreement.  
  - Realist Prediction: Methods will converge on similar features.  
  - Deflationist Prediction: Methods will reveal different decompositions.

  **Crux 4: Invariance under Retraining**  
  - Test: Compare features across multiple training runs (same architecture and data).  
  - Realist Prediction: Features are consistent across runs (modulo symmetries).  
  - Deflationist Prediction: Features vary substantially beyond symmetries.

  Finally, we acknowledge that part of our disagreement is verbal: once the empirical facts (e.g., from the above tests) are fixed, we still disagree about whether to describe the features as "discovered" (realist) or "imposed" (deflationist). However, the substantive cruxes are empirically testable and will influence the viability of our positions.

  Signed,  
  [Realist Name]  
  [Deflationist Name]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Representations in Neural Networks

  We, the undersigned realist and deflationist, agree that debates about "representations" in neural networks have generated more heat than light. While we disagree on fundamental philosophical and empirical questions, we commit to this adversarial collaboration to clarify shared ground, articulate testable disagreements, and design future experiments. Below, we document points of agreement, residual disagreements, key cruxes, and concrete tests to resolve them. Both parties endorse this document as a fair framing of their views.

  ---

  ### 1. Agreed Claims  
  Both camps accept the following empirical observations, phrased neutrally to avoid presupposing realism or deflationism:  
  1. **Linear Probes Extract Information**: Linear classifiers applied to internal activations can decode substantial information about inputs (e.g., object categories in vision models, sentiment in language models), including properties not explicitly supervised during training.  
  2. **Steering Interventions Change Behavior**: Modifying activations along specific directions (e.g., via activation addition or suppression) reliably and selectively alters model outputs (e.g., increasing/decreasing sycophancy or security vulnerability in code).  
  3. **Task-Extrinsic Structure Emerges**: Models trained on narrow tasks (e.g., image classification) develop internal activations that correlate with broader concepts (e.g., object parts, linguistic properties, or abstract relations) beyond the training objective.  
  4. **Interpretability Has Practical Utility**: Methods like feature visualization, probing, and automated feature extraction have yielded tangible benefits, such as identifying model failures, improving safety, and guiding architecture design.  

  These claims are factual and do not require either camp to concede their core position. Realists see them as consistent with discovering underlying representations; deflationists see them as evidence of useful decompositions imposed by researchers.

  ---

  ### 2. Disagreements Table  
  Residual disagreements are stated as each camp would articulate its own view:  

  | Realist Position | Deflationist Position |
  |------------------|------------------------|
  | Neural networks learn a **specific, internally determined decomposition** of inputs into features (e.g., "sycophancy" or "security flaw" features), which is causally active in computations. Interpretability methods like sparse autoencoders *discover* this decomposition. | Neural networks admit **many equally valid decompositions** into interpretable features. Interpretability methods *construct useful vocabularies* constrained by pragmatic goals (e.g., sparsity), but no single decomposition is privileged by the network’s structure. |
  | Successful **steering** demonstrates that interpretability has isolated features the network *uses* in its computations (e.g., activating a "sycophancy feature" engages a pre-existing causal pathway). | Successful **steering** only shows that the network is sensitive to interventions in activation space. It does not imply that the steered direction corresponds to a "natural" feature; it is one of many possible control interfaces. |
  | **Convergence** of independent methods (e.g., probing, circuits, sparse autoencoders) on similar features would indicate a shared underlying reality—the network’s "ontology." | **Convergence** reflects shared methodological biases (e.g., favoring sparse, human-interpretable features) and does not imply a unique underlying ontology. |

  ---

  ### 3. Cruxes Section  
  We identify four cruxes—disagreements resolvable by future evidence. All three proposed cruxes are genuine (i.e., empirically testable and central to the debate), and we add one more:  

  1. **Natural Decomposition**: Is there a fact of the matter about a network’s "natural" feature decomposition (i.e., one privileged by its computational structure), or is decomposition choice solely constrained by pragmatic criteria (e.g., sparsity, interpretability)?  
  2. **Steering as Mechanism vs. Interface**: Does successful steering confirm that interpretability has located a feature the network *uses* in its causal mechanisms, or merely that the network is broadly sensitive to interventions?  
  3. **Convergence as Evidence**: Would convergence among independent methods (e.g., SAEs, probing, circuit analysis) support the existence of a "real" ontology, and will such convergence occur as methods mature?  
  4. **Universality of Features** (added): Are discovered features consistent across functionally identical models (e.g., same architecture, data, performance), or do they vary arbitrarily?  

  ---

  ### 4. Tests and Predictions  
  For each crux, we specify a test both sides agree is relevant and record advance predictions.  

  #### **Crux 1: Natural Decomposition**  
  - **Test**: Train sparse autoencoders (SAEs) with identical objectives but varying hyperparameters (e.g., sparsity penalties, random seeds) on a fixed model. Measure whether the resulting features:  
    - (a) Reconstruct activations equally well.  
    - (b) Exhibit high pairwise similarity in direction/function (e.g., via centered kernel alignment).  
  - **Realist Prediction**: Features will diverge substantially in structure and semantics (low similarity) despite similar reconstruction accuracy, proving decomposition is pragmatically driven.  
  - **Deflationist Prediction**: Features will converge (high similarity) if hyperparameters are well-tuned, indicating a natural decomposition.  

  #### **Crux 2: Steering as Mechanism vs. Interface**  
  - **Test**: For a steered feature (e.g., "sycophancy direction" from an SAE):  
    - (a) Ablate neurons most correlated with the feature and measure task-specific vs. general performance drops.  
    - (b) Compare to steering along random directions with similar activation norms.  
  - **Realist Prediction**: Ablation will cause task-specific failures (e.g., sycophancy drops without affecting coherence), and random directions will not achieve selective steering.  
  - **Deflationist Prediction**: Ablation will cause broad performance drops, and random directions will achieve similar steering effects with tuning.  

  #### **Crux 3: Convergence as Evidence**  
  - **Test**: Apply SAEs, linear probes, and circuit analysis (e.g., path patching) to identify features for a concept (e.g., "code security flaw") in a fixed model. Quantify agreement via:  
    - (a) Direction similarity (e.g., cosine similarity).  
    - (b) Causal overlap (e.g., interventions from one method affect another’s features).  
  - **Realist Prediction**: High convergence across methods; consistency will increase with method maturity.  
  - **Deflationist Prediction**: Low convergence; any agreement will be attributable to shared biases (e.g., linearity).  

  #### **Crux 4: Universality of Features**  
  - **Test**: Train 10 functionally identical models (same architecture/data, different seeds). Extract features for a concept (e.g., "sarcasm") using a fixed SAE. Measure cross-model feature similarity (e.g., via CKA).  
  - **Realist Prediction**: Features will be highly similar (e.g., CKA > 0.8) and align under simple transformations (e.g., permutation).  
  - **Deflationist Prediction**: Features will vary substantially (e.g., CKA < 0.4) beyond symmetry operations.  

  ---

  ### 5. Verdict on Verbal Disputes  
  We agree that **part of this dispute is verbal**: once empirical facts about information flow (e.g., probing accuracy) and manipulability (e.g., steering efficacy) are fixed, residual disagreement reduces to whether terms like "genuine representation," "discovery," or "ontology" apply. This verbal residue attaches to:  
  - Whether a decomposition is "real" (realist) or "useful" (deflationist) when pragmatic criteria yield unique solutions (Crux 1).  
  - Whether steering "reveals mechanisms" (realist) or "exploits sensitivities" (deflationist) (Crux 2).  

  **Substantive disagreements survive** and are testable via the cruxes:  
  - Whether networks have **invariant structure** (Crux 4) or **causally specific features** (Crux 2).  
  - Whether convergence is **inevitable** (realist) or **contingent on bias** (deflationist) (Crux 3).  

  In short: verbal disputes dominate the *interpretation* of successful interpretability, but substantive disagreements about the *structure* of networks remain empirical and tractable.  

  ---  
  **Signed**,  
  [Realist Representative]  
  [Deflationist Representative]  
  *Date: [Date]*
