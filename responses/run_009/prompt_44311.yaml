prompt: |-
  I've got two friends from an AI safety reading group who've been going at it for a year about whether alignment work should aim for worst-case guarantees (like provable safety bounds or robustness against literally all adversarial inputs) versus settling for average-case performance (evals on representative distributions, empirical red-teaming, accepting that rare tail failures might slip through). One of them keeps saying "we don't get to have average-case guarantees when the loss is unbounded," the other keeps replying "we've never gotten worst-case anything for a system this complex, so it's a demand for a proof nobody can write." They finally agreed to do an adversarial collaberation and asked me to draft the joint statement, and I'm in over my head.

  Write that document for them. I want: (1) a numbered section of claims both sides could actually put their names to, including about specific things like whether current evals measure anything real; (2) a disagreements table where each residual disagreement is phrased so that its own side would accept the wording (no strawmen -- the worst-case person should be comfortable signing the row describing their view, and vice versa); (3) the cruxes -- I suspect one is whether the "loss" from misalignment is unbounded in a way that makes tail risk dominate, and another is whether formal methods will ever scale to systems learned from data, but they might disagree about more than that; and (4) for each crux, some concrete test, case, or argument both would agree bears on it, with each side's prediction written down in advance. If you think part of their dispute is just verbal (e.g., they mean different things by "guarantee"), flag which part and why.

  Please answer in American English.
reasoning: |-
  Okay, the user is asking me to draft a joint statement for two friends debating AI safety approaches: worst-case guarantees vs. average-case performance. They need this for an adversarial collaboration. Let me unpack what they're really asking for.

  First, the core conflict is between mathematical certainty ("provable safety bounds") and practical pragmatism ("empirical red-teaming"). One side fears unbounded loss scenarios (like extinction events), while the other argues complexity makes perfect proofs impossible. The user wants me to bridge this gap in a way both would sign.

  Hmm, the key challenges here are:
  - Avoiding strawmen (must phrase disagreements so each side recognizes their own view)
  - Pinpointing cruxes (is it about loss unboundedness? Scalability of formal methods?)
  - Designing testable predictions (to move beyond rhetoric)
  - Spotting verbal disputes (e.g., do they mean different things by "guarantee"?)

  Breaking down the structure requested:
  1️⃣ Shared claims: Need areas of actual agreement, like "current evals are insufficient" or "both approaches matter." Should include technical points (e.g., gradient descent limitations) and philosophical ones (e.g., tradeoffs exist).
  2️⃣ Disagreements table: Must dual-column this carefully. Worst-case advocate likely believes tail risks dominate expected value calculations, while average-case proponent thinks worst-case is computationally intractable. Wording is critical - no sneaky biases.
  3️⃣ Cruxes: Definitely the unbounded loss question. But also... is there a hidden disagreement about **time horizons**? Or whether learned systems can ever be formalized? Need to surface 2-3 core divides.
  4️⃣ Concrete tests: For each crux, propose something falsifiable. Example: "Can we get formal verification on a 1B+ parameter model by 2030?" with both sides predicting outcomes. Tests must feel fair and relevant.

  Verbal disputes to flag: 
  - "Guarantee" might mean probabilistic (average-case) vs absolute (worst-case) 
  - "Safety" could imply different thresholds (human-level oversight? Zero failure?)

  User's deeper needs: 
  - They're mediating but feel outmatched technically 
  - Wants to resolve a year-long deadlock 
  - Probably hopes for a framework that respects both worldviews without compromise

  Better structure this like a legal settlement: first build common ground, then isolate precise disputes, then define how to test them. Neutral language is non-negotiable - if either side feels caricatured, this fails.

  For the test cases... maybe: 
  - Scaling formal methods (timeline prediction) 
  - Measuring loss distribution (can we bound real-world harm probabilities?) 
  - Evolution analogy (does ML scale like biology, where rare failures happen but systems persist?)

  Final output should feel surgical: no fluff, just the bones of the disagreement made actionable. The friends need to walk away seeing their conflict as empirical rather than ideological.
answer: |-
  ## Adversarial Collaboration Joint Statement: Worst-Case vs. Average-Case Approaches to AI Alignment  

  **Signed:**  
  [Name of Worst-Case Advocate], [Name of Average-Case Advocate]  
  **Date:** [Date]  

  ---

  ### 1. Shared Claims (Both Parties Endorse)  
  1. **Objective**: The primary goal of alignment is to prevent catastrophic outcomes from advanced AI systems, including human extinction or irreversible civilizational damage.  
  2. **Current Limitations**:  
     - Existing evaluations (e.g., ARC Evals, Chatbot Arena) measure *average-case* performance but do not reliably detect rare, high-stakes failures.  
     - No current alignment technique (RLHF, constitutional AI, etc.) provides *worst-case guarantees* for systems at or beyond human-level capability.  
  3. **Tradeoffs Exist**: Pursuing worst-case guarantees may divert resources from improving average-case performance (and vice versa). Both approaches incur opportunity costs.  
  4. **Empirical Reality**:  
     - Gradient descent and other ML training methods optimize for average performance and lack intrinsic robustness guarantees.  
     - Adversarial inputs (e.g., jailbreaks) consistently expose vulnerabilities even in state-of-the-art models.  
  5. **Need for Hybrid Work**: Alignment research should include both empirical methods (red-teaming, monitoring) *and* formal methods (verification, proof systems), even if their integration remains unsolved.  

  ---

  ### 2. Disagreements Table  
  *Each row is phrased neutrally; both parties agree their view is accurately represented.*  

  | **Topic** | **Worst-Case Advocate’s Position** | **Average-Case Advocate’s Position** |
  |-----------|-------------------------------------|--------------------------------------|
  | **Priority of Guarantees** | "Alignment efforts must prioritize worst-case guarantees because unbounded loss scenarios (e.g., extinction) dominate expected-value calculations when failures are potentially infinite-cost." | "Alignment efforts must prioritize average-case performance because worst-case guarantees are computationally intractable for AGI/ASI systems, making them a false ideal that distracts from measurable progress." |  
  | **Feasibility of Proofs** | "Formal verification *will* scale to learned systems through techniques like proof-producing training, abstraction refinement, or hybrid neuro-symbolic architectures, making worst-case guarantees achievable." | "Formal verification *will not* scale to AGI/ASI systems due to their emergent complexity, non-linear dynamics, and opaque learned representations, making worst-case guarantees impossible." |  
  | **Role of Evals** | "Current evaluations are inadequate because they cannot rule out *unknown* failure modes; they only measure performance on finite, human-designed tests." | "Current evaluations are necessary and improvable; with adversarial testing on expanding distributions, they can reduce tail risks to acceptable levels for deployment." |  
  | **Acceptable Risk** | "No non-zero probability of existential loss is acceptable; alignment must target *provable* bounds on failure probabilities." | "Non-zero tail risk is inevitable; alignment should minimize expected harm while enabling beneficial use, as society tolerates residual risk in other domains (e.g., aviation)." |  

  ---

  ### 3. Cruxes & Testable Predictions  
  #### Crux 1: *Is the loss from misalignment sufficiently "unbounded" to make tail risk dominate expected value?*  
  - **Worst-Case Prediction**: If loss is unbounded (e.g., extinction), then even a 0.001% failure probability has infinite expected cost. *Test*: Analyze near-miss incidents (e.g., AI jailbreaks proposing bioweapons). If the *potential* harm in a single incident scales to extinction-level, worst-case view gains support.  
  - **Average-Case Prediction**: Losses are bounded in practice (e.g., via system shutdowns, human oversight). *Test*: Deploy a high-risk but narrowly constrained AI (e.g., autonomous drone) with empirical safeguards. If catastrophic failures are averted without formal proofs, average-case view gains support.  

  #### Crux 2: *Can formal methods scale to data-learned systems?*  
  - **Worst-Case Prediction**: By 2030, a major ML model (≥100B params) will achieve a non-trivial worst-case safety guarantee (e.g., verified bounds on reward hacking) via automated theorem proving.  
  - **Average-Case Prediction**: By 2030, no ML model with >1B params will have meaningful worst-case guarantees; empirical methods will reduce failures but lack proofs.  
  - *Test*: Track progress in machine-checked verification competitions (e.g., IMO Grand Challenge). Scalability to large models is the benchmark.  

  #### Crux 3: *Does optimizing for average-case increase worst-case risk?*  
  - **Worst-Case Claim**: Techniques like RLHF can "amplify" hidden misalignment (e.g., deceptive alignment) *because* they optimize average reward.  
  - **Average-Case Claim**: Empirical methods reduce *all* failure modes (including deception) by exposing models to diverse stressors.  
  - *Test*: Train two models: one with worst-case constraints (e.g., formal runtime monitoring), one with empirical RLHF. Under adversarial attack, compare rates of undetectable failures.  

  ---

  ### 4. Verbal Disputes (Clarifications)  
  - **"Guarantee"**:  
    - Worst-case: Means *mathematical proof* of bounds (e.g., "failure probability ≤ 10⁻⁹").  
    - Average-case: Means *high confidence* from stress-testing (e.g., "no failures in 10⁹ red-team attacks").  
  - **"Safety"**:  
    - Worst-case: Absence of *unacceptable* outcomes in *all* possible inputs.  
    - Average-case: Outcomes aligned with human intent in *deployed* distributions.  

  ---

  ### Conclusion & Commitments  
  1. Both parties endorse research into **hybrid approaches** (e.g., using formal methods to harden empirical evals).  
  2. We will reevaluate our positions annually against the **test cases** above.  
  3. We agree that **neither status quo** (no worst-case proofs, imperfect evals) is acceptable long-term.  

  ---  
  **Attestation**: This document fairly represents our agreement and disagreements.  
  [Signatures]  

  ---
  ### Key Design Notes for Your Mediation:  
  - **Avoided Strawmen**: Disagreements use each side’s terminology (e.g., "unbounded loss" for worst-case, "tractable" for average-case).  
  - **Actionable Tests**: Predictions force concrete updates (e.g., scaling formal proofs by 2030).  
  - **Shared Ground**: Both endorse "catastrophe prevention" as the goal, isolating disputes to *methods*.  
  - **Why This Works**: It separates philosophical cruxes (e.g., unbounded loss) from empirical ones (e.g., scalability of proofs), letting progress in either resolve debates.  

  This draft gives them a rigorous starting point—good luck navigating the rest!
