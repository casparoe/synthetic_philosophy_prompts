  I should analyze each component: agent, wrongs, greater evil, necessity. For the agent, it's tricky. Reagan might be seen as the leader, but he delegated. Poindexter and North acted, yet within a hierarchy. The collective aspect challenges Walzer's individual focus. The wrongs are clear: illegal arms sales, funding Contras, deception. But the necessity is weak because they manufactured the crisis. The greater evil (Soviet influence) was inflated, and alternatives weren't exhausted.

  Where Walzer falls short: collective responsibility isn't addressed. Guilt is essential for Walzer, but here actors felt justified. The vocabulary was used for PR, not genuine remorse. Also, the hierarchical structure diffuses accountability. Maybe constitutional usurpation or institutional corruption frameworks explain better. These highlight systemic issues and legal breaches that dirty hands overlooks.

