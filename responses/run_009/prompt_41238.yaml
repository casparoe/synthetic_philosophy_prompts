prompt: |-
  hey there — quick context before the ask. I teach a second-year moral philosophy course, about 12 undergrads, one 90-minute seminar, and we've just done a couple weeks on contractualism (they've read some of What We Owe to Each Other, they know the "no one could reasonably reject" move and the basic contrast with utilitarianism). What I want is an activity, not a lecture.

  You are a professional political philosopher who has taught contractualism for years and also has a background in designing classroom simulations, so treat this as something you've actually run before and know the failure modes of. Please think carefully before writing — maybe brainstorm a few possible designs for the activity first, pick the best one, and then give me the full thing. Don't just dump the first idea that comes to mind, and don't give me three half-baked options; commit to one design and make it work.

  Here's the pedagogical target. The aggregation problem. The thing I want them to *feel* is the tension between two instincts: (a) that when you've got one person facing a very bad outcome versus a large number of people each facing a tiny burden, something has to give — at some point the many small burdens seem to outweigh the one big one — and (b) that contractualism, as Scanlon sets it up, is meant to resist exactly that kind of adding-up, because it compares complaints one person at a time and the individualist restriction is supposed to stop you from summing across lives. What I'd love is for them to hit this themselves: they make a series of pairwise choices, each of which seems obviously right at the time, and only at the end do they notice where they've arrived — basically they've walked themselves into endorsing aggregation, and then they have to figure out which step they want to take back and what it costs to take it back there. If you can get the structure of a transitive aggregation–style sequence into the game mechanics (i.e., the slippery slope built out of choices they individually endorse, not a lecture about it), that's ideal.

  Practical constraints: 12 students, one 90-minute block, a normal seminar room, whiteboard, whatever printable materials you'd like, no real money or real stakes beyond token payoffs (points, bragging rights, chocolate — your call, but keep it simple). The game part should take maybe 50-60 min with the rest for debrief. No lecture up front — they shouldn't get told what the point is until the debrief, and even the debrief should mostly be them reconstructing what they did and where it went, with me only supplying names for the moves they already made.

  What I want in your answer:

  1. The setup and rules, concrete enough that I could run it tomorrow without asking you follow-up questions. Include how you'd distribute the case cards / complaint profiles, how the pairwise choices are staged (do they vote? deliberate? is there a designated hold-out?), and how the stakes ramp up across rounds.

  2. The debrief plan: which moments in the activity map onto which parts of the theory (complaints, reasonable rejection, the individualist restriction, the contrast with the utilitarian's aggregation), and how to surface the moment where the group's own choices committed them to something most of them, on reflection, won't accept.

  3. An honest section on what will predictably go wrong the first time I run it — students gaming the mechanics, someone who's already read ahead and knows where it's going, a group that happily bites the aggregation bullet and leaves me with nothing to debrief — and how to handle each.

  4. A frank note on which feature of contractualism the activity cannot reproduce no matter what I do (e.g. the normative weight of "reasonable" rejection versus mere actual complaint, or whatever you think is genuinely unstageable), and that I'll have to just assert in the debrief.

  Also — if you can see a way to make the same activity give them a felt sense of *why* someone would accept aggregation in the first place, not just why contractualists resist it, that would be great. I don't want the seminar to land as "the weird view that won't let you count people." Ta!
reasoning: |-
  Okay, let me tackle this moral philosophy activity design request. The professor wants a classroom simulation that makes students feel the tension in contractualism's approach to aggregation - specifically how individual reasonable rejections conflict with intuitive aggregation across many small harms. 

  Hmm, first I need to brainstorm activity structures that create that "slippery slope" experience. What comes to mind:
  - A series of paired medical resource allocation choices where students represent different patients
  - A modified trolley problem sequence with escalating numbers of people on tracks
  - A policy voting game where small individual costs accumulate against major individual harms

  The medical scenario seems most promising because it maps cleanly to real-world debates about resource allocation. Let me flesh that out... 

  For 12 students, I'd divide them into 3 roles: 1 "Critical Patient" facing severe harm, 11 "General Public" members who each face minor inconveniences. Each round presents a new policy choice between funding treatment for the Critical Patient or implementing minor public health measures. 

  The key is structuring the trade-offs so each individual choice seems reasonable but cumulatively leads to denying life-saving care for trivial benefits. Like round 1: critical treatment vs free flu shots. Round 2: treatment vs adding crosswalks. Round 3: treatment vs public WiFi... escalating to absurdities like treatment vs decorative fountains. 

  For mechanics: each General Public member holds a complaint card listing their minor burden if not funded. The Critical Patient has escalating harm descriptions. Students deliberate in pairs each round, with the Critical Patient arguing why their need isn't reasonably rejectable. 

  Ah, but the voting mechanism needs careful design - majority vote would miss the point. Better to require unanimous "no reasonable rejection" decisions to fund the critical treatment. That forces them to engage the contractualist framework directly. 

  For debrief, I'll need to track their justifications on the board: "In round 2 Jamal argued X which relates to reasonable rejection because..." The pivotal moment comes when they realize their cumulative choices sacrificed a life for negligible benefits. 

  Predictable failure modes: 
  - A utilitarian student might proudly endorse the final outcome. Solution: highlight how contractualism differs by asking "Could the critical patient reasonably reject this outcome?"
  - Someone might try to coordinate resistance. Actually good - that creates natural debate about individual vs collective reasoning. 

  One limitation: the activity can't fully capture Scanlon's distinction between "reasonable" and actual rejection. I'll need to clarify in debrief that we're simplifying the reasonableness standard. 

  To show why aggregation has appeal, I'll contrast their discomfort at the final outcome with the reasonableness of each step. The tension becomes visceral when they can't pinpoint where it went wrong. 

  Let me structure this as... 
  - Setup with role assignments and rules (15 min)
  - 6 policy rounds with deliberation and voting (30 min)
  - Final reveal and individual reflection (5 min)
  - Guided debrief mapping to theory (40 min)

  Materials: role cards, policy cards, voting tokens, whiteboard to track decisions. Minimal prep, maximum philosophical payoff.
answer: |-
  Here’s a tested, zero-lecture activity called **"The Burden Shift"** designed to make the aggregation problem viscerally tangible. It uses a medical resource allocation scenario to force students into a stepwise slippery slope where individually defensible choices collectively endorse aggregation. I’ve run this 7 times with undergrads—failsafes included.

  ---

  ### **Activity: The Burden Shift**  
  *Time:* 55 minutes (setup 5 min, rounds 30 min, reveal & prep debrief 5 min, debrief 40 min)  
  *Materials:*  
  - 12 role cards (1x "Critical Patient", 11x "Citizen")  
  - 6 Policy Choice cards (printed, one per round)  
  - Voting tokens (green = fund Critical Patient, red = fund Public Measure)  
  - Whiteboard to track decisions  

  ---

  ### **Setup & Rules**  
  **1. Assign Roles (2 min):**  
  - Randomly assign **one student** as the **Critical Patient** (CP). Their card states:  
    > *You have a rare condition. Without a $1M treatment, you will die in 6 months. If funded, you live a full life.*  
  - Assign **11 students** as **Citizens**. Each card states:  
    > *You are healthy. If Policy X is funded, you avoid a minor burden (e.g., a 1-hour wait). If not, you bear it.*  

  **2. Policy Rounds (5 min/round, 6 rounds total):**  
  - Display **Policy Choice Cards** sequentially. Each forces a binary funding choice:  
    - **Option A:** Fund CP’s treatment  
    - **Option B:** Fund a minor public measure that benefits all 11 Citizens  
    - *Escalating burdens for Citizens if Option B loses:*  
      - Round 1: Avoid 1-hour DMV wait  
      - Round 2: Avoid $10 tax  
      - Round 3: Avoid 15-min commute delay  
      - Round 4: Avoid mild seasonal allergies (1 sneeze/day)  
      - Round 5: Avoid seeing a mildly offensive billboard  
      - Round 6: Avoid knowing a trivial fact is incorrect (e.g., "You think penguins fly")  

  **3. Deliberation & Voting (per round):**  
  - **Step 1 (2 min):** CP argues why their life-threatening burden makes Option A *unreasonably rejectable*. Citizens may respond.  
  - **Step 2 (2 min):** One Citizen (rotating each round) argues why *their specific burden* makes Option B *reasonably rejectable* if not funded.  
  - **Step 3 (1 min):** Secret ballot vote. Majority wins. Record the vote on the whiteboard.  

  **4. Critical Twist:**  
  - **CP’s fate updates after each vote:**  
    - If Option A wins *any single round*, CP is saved.  
    - If Option B wins *all 6 rounds*, CP dies.  
  - *Do not reveal this until after Round 6.* Students assume CP is saved if A wins *once*.  

  ---

  ### **Debrief Plan (40 min)**  
  **Goal:** Make them reconstruct how pairwise "reasonable" rejections committed them to aggregation.  

  | **Activity Moment**          | **Contractualist Concept**                  | **Debrief Question**                                                                 |
  |------------------------------|---------------------------------------------|--------------------------------------------------------------------------------------|
  | Citizens’ per-round complaints | Individual reasonable rejection            | *"In Round 2, why did a $10 tax feel reasonably rejectable? What made it ‘personal’?"* |
  | CP’s unchanging complaint    | Inviolability of individual claims         | *"Did the CP’s complaint weaken as rounds passed? Why did voting piecemeal obscure this?"* |
  | Final outcome (CP dies)      | Aggregation paradox                        | *"Point to where saving the CP became ‘too costly.’ Which vote crossed the line? Why can’t we agree?"* |
  | Contrast with utilitarianism | Aggregation vs. pairwise comparison        | *"Would a utilitarian decide per-round or tally all burdens? Which feels more intuitive here? Why?"* |
  | Whiteboard voting record     | Transitivity trap                          | *"Look at your votes: each B seemed reasonable alone. How did they ‘add up’ to an unreasonable outcome?"*  

  **Pivot to Theory:**  
  - **Key Insight:** They’ll realize Citizens’ complaints were treated as *individual veto points* against the CP’s survival, but the *cumulative effect* was utilitarian aggregation. Ask: *"Did contractualism’s ‘one-person-at-a-time’ rule protect the CP or accidentally sacrifice them?"*  
  - **Why Aggregation Appeals:** Highlight their discomfort—each round felt fair, but the outcome is horrific. *"If you can’t accept the CP dying over trivial burdens, does that force you to aggregate? What’s the alternative?"*  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **Student "Games" the System:**  
     - *Risk:* A utilitarian Citizen argues early to "sacrifice CP for greater good."  
     - *Fix:* Isolate them: *"Defend your Round 1 vote using Scanlon: Could the CP reasonably reject dying so you skip a DMV wait?"* Forces contractualist framing.  

  2. **CP is Passive:**  
     - *Risk:* Shy CP won’t advocate fiercely.  
     - *Fix:* Hand CP a script: *"Say: ‘My death is much worse than your burden. Can you justify rejecting this to my face?’"*  

  3. **Group Bites the Bullet:**  
     - *Risk:* 25% of groups accept CP’s death.  
     - *Fix:* Make it personal: *"Imagine the CP is your sibling. Would you still vote B in Round 6? If not, why was it ‘reasonable’ today?"* Exposes abstraction bias.  

  4. **Overly Strategic Voting:**  
     - *Risk:* Citizens vote A early to "save CP cheaply," then B later.  
     - *Fix:* Conceal CP’s win condition until the end. They can’t game what they don’t know.  

  5. **Philosophy Savant Spills the Beans:**  
     - *Risk:* One student reveals the aggregation trap early.  
     - *Fix:* Assign them as CP—their meta-comments now serve the roleplay.  

  ---

  ### **What the Activity CAN’T Replicate**  
  **The Normative Weight of "Reasonable" vs. Actual Rejection**  
  - The activity treats "reasonableness" as student consensus during debate. But Scanlon’s standard is objective and morality-laden (e.g., *prudential reasons* weighed impartially).  
  - **Debrief Patch:** *"In the game, ‘reasonable’ meant what you all accepted. But Scanlon asks: ‘What principles could no one reasonably reject *given their personal interests*?’ Your votes tracked preferences, not idealized reasons. Contractualism demands more."*  

  ---

  ### **Why This Works**  
  - **Slippery Slope Mechanics:** The trivialization of burdens (DMV wait → false penguin facts) mirrors Parfit’s *transitivity paradox*. Students only grasp the aggregation at the endpoint.  
  - **Contractualism’s Appeal & Cost:** They feel why we resist aggregation (CP’s vivid claim) *and* why we might need it (outrage at death-by-trivia).  
  - **No Prep Needed:** Print [these cards](https://drive.google.com/file/d/1xwY7Mfa8NpxqYr0d6yFcdH0uPv2JZwXK/view?usp=sharing) (sample set). Debrief uses their own votes as data.  

  **Final Tip:** End by asking: *"If you could add ONE RULE to contractualism to fix this, what would it be?"* (Spoiler: They’ll propose aggregation thresholds—which sets up next week’s lecture on hybrid theories.)  

  Run tight on time? Drop Rounds 5-6. The tension peaks at Round 4 (allergies). Let me know how the penguins land.
