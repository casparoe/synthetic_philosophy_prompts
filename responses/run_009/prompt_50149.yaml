prompt: |-
  For several years I have been trying to settle, by consulting my own reactions to concrete cases, whether compatriots have special claims on one another that they do not have on strangers abroad, and the verdicts I keep arriving at refuse to line up into a principle. I would like to know whether there is one that captures them, or close to it; what it implies for cases I have not considered; and, if it cannot save all my verdicts, which of them I should abandon.

  The verdicts, roughly as I find them:

  1. I think it is legitimate for my state to tax me to fund medical care and unemployment support for poor compatriots, even though the same money, sent abroad, would help people in far greater need far more effectively. The state may give compatriots priority in the distribution of benefits.
  2. Yet I do not think a private employer may hire a less qualified compatriot over a better-qualified foreign applicant. Nationality may not figure in private hiring the way I just allowed it to figure in public spending, and I cannot see why the state's permission in the one case does not carry over to the firm in the other.
  3. I do not think an emergency service may take nationality into account in rescues. If two swimmers are equally far out and equally in danger, the lifeboat goes to whoever is nearest, and a crew that passed over a drowning foreign fisherman in order to rescue a citizen at equal cost would be doing something close to monstrous.
  4. But I accept, with very little unease, that a government may evacuate its own citizens first from a disaster zone when it has seats for only some of those present — that is, may do as an evacuator what a lifeboat crew may not do as a rescuer. I can feel the two cases pulling apart, but I do not know what separates them.
  5. On the personal side: I think I may give to a local shelter rather than a more cost-effective charity abroad, and may favor my family and friends over strangers anywhere. But when the favoring rests on shared nationality alone — a businessman, with no personal ties to any of them, funding scholarships only for compatriots while rejecting equally needy foreign applicants — my reaction turns sharply negative, even though this is roughly what I let the state do in (1), and I cannot articulate why the individual's act strikes me as worse.
  6. Whatever the basis of the claim, it cannot be contribution. I think a compatriot who has evaded taxes all his life retains the full claim, a newborn citizen has it immediately, and a foreign resident who has worked and paid taxes for thirty years without naturalizing has most of it — perhaps all. The case I keep going back and forth on is what the last sliver consists in: what, exactly, does the thirty-year resident gain at the citizenship ceremony, if anything?

  So my question is this. Is there a single principle — something about shared institutions, or the state acting as an agent of a cooperative scheme its members author, or the difference between what an agent may do in its own name and what it may do in ours — that accommodates the state's priority in (1) and (4) while forbidding the employer's discrimination in (2) and the lifeboat's selectivity in (3)? If so, please state it precisely, clause by clause, and show which verdict motivates each clause. Then tell me honestly which of my verdicts it cannot accommodate, and why it is those rather than the others that should go. Finally, I would like to know what the principle predicts for cases I have not listed: whether a prosperous region may secede and take its taxes with it; whether foreign aid is merely permissible for states or in some way owed; and whether a state may restrict immigration to protect compatriots' wages when the cost to the excluded foreigners is very large.
reasoning: |-
  Hmm, this user presents a nuanced ethical dilemma about partiality towards compatriots versus strangers. Their struggle resonates deeply - it's that rare philosophical query grounded in lived moral tension rather than abstract theorizing. The six verdicts reveal a sophisticated mind wrestling with institutional agency, interpersonal ethics, and the metaphysics of citizenship.

  What stands out is how their intuitions bifurcate along institutional lines: state actions get wider moral latitude (points 1,4) while individual actors face stricter constraints (2,5). Yet even there, exceptions emerge - private charity gets partiality passes that business decisions don't. The lifeboat case (3) particularly fascinates me; their visceral rejection of nationality-based rescue suggests proximity creates stronger duties than citizenship. 

  The tax-evader/newborn paradox (6) demolishes contribution-based theories elegantly. That thirty-year resident case haunts me too - if citizenship confers no tangible benefit, why naturalize? Perhaps it's about formalizing preexisting relational ties rather than creating new ones. 

  For framework construction, I'm drawn to institutional role morality. The state isn't just a big person; its obligations arise from constitutive purposes. This explains the evacuation/disaster response distinction (4) - one is core state function, the other isn't. The scholarship case (5) fails because individuals aren't institutionally mandated redistributors. 

  On unlisted cases: secession might violate maintenance duties to weaker regions; foreign aid becomes obligatory when basic rights are unmet; wage-protection immigration restrictions get tricky - Rawlsian difference principle applied globally? Must weigh systemic harm against localized benefits. 

  Ultimately this needs a tripartite principle: institutional obligations (state as guarantor of basic needs), interpersonal constraints (no arbitrary discrimination), and scalar citizenship (residency builds moral weight before formalization). Some verdicts will crack - probably the lifeboat case, since institutional logic doesn't cleanly map to rescue scenarios. User seems ready for that sacrifice given their intellectual honesty.
answer: |-
  Your struggle reveals a deep tension between our intuitions about partiality, institutional roles, and moral equality. After analyzing your verdicts, I propose this **Principle of Institutional Fiduciary Obligation**:

  1.  **The Basic Needs Clause:** *States, as primary guarantors of basic needs within their cooperative scheme, have a strong fiduciary duty to prioritize the basic welfare (survival, health, economic security) of their members.*
      *   **Motivated by:** Verdicts (1) (taxes for healthcare/unemployment) and (4) (evacuation prioritization). The state exists partly to secure these fundamental goods for those within its cooperative structure.

  2.  **The Agency Limitation Clause:** *This duty of partiality binds the state *only* when acting in its core fiduciary capacity regarding basic needs. It does not extend to private actors or to state actions outside this core function.*
      *   **Motivated by:** Distinguishing (1)/(4) from (2) (private hiring), (3) (lifeboat rescue), and (5) (private scholarships). Private employers, lifeboat crews (even state-funded ones acting in rescue mode), and individuals are not fiduciaries charged with securing the basic welfare of compatriots.

  3.  **The Non-Discrimination in Non-Fiduciary Spheres Clause:** *Outside the state's fulfillment of its basic needs fiduciary duty, nationality is generally an irrelevant or impermissible basis for differential treatment, especially where it causes significant harm, denies essential opportunity, or violates equal moral respect.*
      *   **Motivated by:** Verdicts (2) (hiring discrimination harms opportunity), (3) (rescue selectivity violates equal moral worth in life-or-death), and (5) (private scholarships denying essential opportunity based solely on nationality). The justification for state partiality in (1) doesn't transfer.

  4.  **The Relational Proximity Clause:** *Individuals may permissibly show partiality based on *concrete personal relationships* (family, friends, local community ties) or *direct causal involvement*, but not solely on abstract shared nationality.*
      *   **Motivated by:** Verdict (5) - favoring family/friends/local shelter is acceptable due to direct relational ties or causal proximity ("my community"), while favoring abstract compatriots solely based on nationality is not. Also reinforces why the state's partiality isn't arbitrary - it's based on the concrete relationship of membership in *its specific* cooperative scheme.

  **Applying the Principle to Your Verdicts:**

  *   **Accommodated:**
      *   **(1):** State taxing for compatriots' basic needs falls squarely under its fiduciary duty (Clause 1).
      *   **(2):** Private hiring isn't about fulfilling basic needs fiduciary duty. Nationality is irrelevant and discriminatory (Clause 3).
      *   **(4):** Evacuation is a core state function securing survival (basic need) for members (Clause 1).
      *   **(5) (Personal/Family/Local Charity):** Permissible under relational proximity (Clause 4). *(Private Scholarships):* Not permissible - lacks relational proximity and involves significant harm/denial of opportunity based solely on nationality (Clauses 3 & 4).
  *   **In Tension & Requiring Adjustment:**
      *   **(3) Lifeboat Rescue:** The principle suggests your negative verdict is correct, but for a nuanced reason. A lifeboat crew (even a state one) is acting in an *immediate rescue* capacity, not primarily fulfilling the state's *ongoing institutional fiduciary duty* for basic needs. Rescue prioritizes immediate peril based on urgency/feasibility, not membership. Nationality is irrelevant (Clause 3). **Your verdict should stand, but the justification aligns with Clause 3, not a direct conflict with Clause 1.** The lifeboat isn't acting *as the state's fiduciary agent* in that moment in the same way an evacuation planner is.
      *   **(6) Contribution & New Citizens:** The principle explains why contribution isn't key. Citizenship signifies formal membership in the cooperative scheme to which the state owes its fiduciary duty (Clause 1). A lifelong tax evader retains membership. A newborn gains it immediately upon citizenship. The 30-year resident has built strong claims through participation and subjection to the scheme, likely warranting most benefits (Clause 1 - the scheme de facto includes residents). **What citizenship formally adds (the "sliver"):**
          *   Formal recognition of full, permanent membership status.
          *   Full political rights (voting, office-holding).
          *   An unambiguous claim to the state's fiduciary duty *regardless of future changes in residency*.
          *   Symbolic recognition of full belonging. Their moral claim to basic welfare support was likely very strong already due to decades of relational ties and participation (Clause 4 proximity + Clause 1 de facto membership). Citizenship makes it absolute and formal within the institutional structure.

  **Predictions for Unlisted Cases:**

  1.  **Prosperous Region Secession:**
      *   The principle leans *against* easy secession. The state's fiduciary duty (Clause 1) extends to *all* members. A prosperous region attempting to secede with its wealth arguably violates this duty by depriving the remaining members (especially vulnerable ones) of resources necessary for their basic welfare within the cooperative scheme. Secession might only be justified if it can be done without harming the basic needs of those left behind or if the existing state is fundamentally failing in its fiduciary duty to that region.

  2.  **Foreign Aid:**
      *   **Permissible but Not Owed (as a strict duty):** The principle doesn't establish a direct *fiduciary* duty to non-members. States may permissibly aid abroad (Clause 1 doesn't forbid it), especially for basic needs.
      *   **Potentially Owed in Extreme Cases:** If the suffering abroad involves catastrophic threats to basic survival that can be alleviated at minimal cost to the domestic fiduciary duty, a strong moral argument based on general humanitarianism or preventing absolute deprivation could arise, *overriding* the principle's strict focus on members. The principle itself doesn't establish this, but it doesn't preclude broader moral arguments.

  3.  **Immigration Restrictions to Protect Wages:**
      *   **Highly Contextual & Presumptively Problematic:** The principle creates a high bar. Protecting *current* compatriots' wages isn't equivalent to securing their *basic needs* (Clause 1 - unemployment support does that). Denying entry based on nationality to foreigners facing potentially severe hardship (a significant harm/denial of opportunity - Clause 3) requires strong justification.
      *   **Possible Justification:** Only if the predicted wage depression for *current members* is so severe it pushes a significant number below the threshold of basic economic security *and* there are no less discriminatory means (e.g., stronger social safety nets funded by general taxation) to prevent this. The "very large cost to excluded foreigners" weighs heavily against restriction under Clause 3. The principle suggests such restrictions are rarely justified and often constitute impermissible nationality-based discrimination causing significant harm.

  **Conclusion:**

  The **Principle of Institutional Fiduciary Obligation** accommodates your core intuitions about the state's special role (1, 4) while forbidding nationality-based discrimination by private actors and in non-fiduciary state actions (2, 3 core rescue, 5 scholarships). It explains why personal relational partiality (5 charity) is distinct from abstract national partiality. It resolves the citizenship puzzle (6) by separating the state's duty (based on membership) from contribution.

  The adjustment required concerns the *justification* for verdict (3) – it's not that the state can't prioritize citizens, but that the lifeboat rescue isn't the relevant fiduciary context; nationality is simply irrelevant there. This principle provides a coherent framework, prioritizing institutional roles and basic needs while upholding strong constraints against arbitrary nationality-based discrimination elsewhere. It offers clear, if sometimes demanding, guidance for the unlisted cases, particularly emphasizing the gravity of harming non-members.
