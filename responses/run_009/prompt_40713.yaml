  First, I need to acknowledge their core observation: same creative act, two different timekeeping methods. The user's nailed the apparent contradiction - natural rights logic for authors versus pure utilitarianism for corporations. Their follow-up questions suggest they've already spotted the incentive theory's weaknesses when applied to life-plus terms.

  Hmm... the estate inheritance point is particularly damning. If copyright is purely about incentivizing creation, why would my grandchildren get royalties for something I made 70 years after my death? That smells like property transfer, not creative motivation. Meanwhile, corporations get this clean 95-year box that ignores human lifespans entirely.

  The user wants me to either:
  1) Find a unified theory that explains both approaches (unlikely)
  2) Confirm the system is philosophically schizophrenic (probable)
  3) Sketch what pure incentive-based terms would look like

  For the rebuild exercise, I should consider:
  - Front-loaded earnings data (most books earn bulk in first 2-5 years)
  - Industry variance (software vs. music vs. Mickey Mouse)
  - Administrative burdens (shorter terms = less orphaned works)
  But also practical constraints - like how Disney's lobbying warps everything.

  Notable subtext: The user seems irritated by moral rights rhetoric that doesn't match the corporate reality. If we admitted copyright is just an economic tool, we'd have to drop the "artist's soul" language when dealing with Mickey Mouse copyright extensions.

  Biggest tension: The system pretends individual copyright is sacred but gives corporations functionally perpetual terms through loopholes. That hypocrisy needs naming.
answer: |-
  You've nailed the fundamental tension in copyright law – it's philosophically schizophrenic. The current US/EU term structure *does* presuppose two conflicting theories of copyright, and no single coherent theory justifies both halves. Let's break it down:

  **The Two Theories in Conflict:**
  1.  **Life+70 (Individual Authors):** This is **Author-Centric Natural Rights/Personhood Theory.** It treats the work as an extension of the author's personality ("droit moral" influence) and their labor (Lockean property rights). Protection endures for the author's life because the connection is personal. The post-mortem term (70 years) functions like **hereditary property transfer**, protecting the author's dependents/heirs and recognizing the author's legacy. The *length* of protection is inherently tied to the biological accident of the author's lifespan, which makes no sense economically.

  2.  **95/120 Years (Corporate Works-for-Hire):** This is **Pure Utilitarian/Incentive Theory.** The sole purpose here is to provide an economic incentive sufficient for the *investor* (the corporation) to fund the creation and dissemination of the work. Since corporations don't die, a fixed term is necessary. The specific length (95/120) is a political compromise, arguably far longer than needed for most incentive purposes, heavily influenced by corporate lobbying (especially Disney protecting Mickey Mouse). The creator's lifespan is irrelevant; it's about the investment horizon.

  **Why Unification Fails & The Incentive Problem:**
  *   **The Incentive Critique of Life+70:** You're absolutely right. If copyright is *only* about incentivizing *creation*:
      *   **Front-Loaded Earnings:** Most works generate the vast majority of their economic value within a few years of creation/publication. Protecting them for 150+ years if the author lives long provides minimal *marginal* incentive to create at the outset.
      *   **The Estate Problem:** The 70-year post-mortem term provides *zero* incentive for the original creation. The author is dead. The heirs contributed nothing to the work's creation. This term exists solely for inheritance/legacy reasons, not creation incentives.
      *   **Lifespan Lottery:** It's irrational from an incentive perspective. An author who dies young gets ~70 years total protection. An author who lives to 100 gets ~170 years. The *same work* gets vastly different protection based on an event unrelated to its value or the incentive needed to create it.
  *   **Natural Rights Fallacy for Corporations:** Applying the natural rights/personhood theory to corporate WFH is nonsensical. A corporation has no "personality" to extend into the work in the human sense. The work is purely a commercial product.

  **Conclusion on Coherence:** **The current arrangement is philosophically incoherent.** It tries to wear two hats:
  1.  A "romantic author" hat steeped in natural rights and inheritance for individual creators.
  2.  A cold, economic "investment vehicle" hat for corporate entities.
  It switches between these justifications based purely on who holds the initial rights, not the nature of the work or the underlying purpose of copyright. The life+70 term, especially the post-mortem portion, is largely indefensible on pure incentive grounds and only makes sense as a quasi-property/hereditary right.

  **Rebuilding on a Straightforward Incentive Theory:**

  If we rebuilt copyright terms solely based on providing the *minimal necessary incentive* for creation and dissemination, it would look radically different:

  1.  **Shorter, Fixed Terms:** Terms would likely be **significantly shorter** and **fixed-length** for *all* works, regardless of authorship. Think decades, not centuries.
  2.  **Term Variation by Industry/Work Type (Potentially):** While administratively complex, a pure incentive view *could* justify different terms:
      *   **Software/News/Fashion:** Very short terms (e.g., 5-15 years). Rapid obsolescence and innovation cycles mean long protection provides little marginal incentive and hinders progress.
      *   **Books/Music/Film:** Moderate terms (e.g., 20-40 years). Longer commercial lives, but most value is still extracted early. 20-30 years often covers the primary revenue streams.
      *   **Pharmaceuticals (if analogized - though patents are different):** Terms calibrated to recoup massive R&D costs (though copyright isn't the right tool here).
      *   **"Evergreen" Franchises (Mickey):** Even here, the *incremental* incentive provided by extending protection from 95 to 120 years is negligible compared to the existing value and revenue streams already established. A fixed term of 30-50 years would likely suffice for initial investment.
  3.  **No Automatic Post-Mortem Tail:** A pure incentive system has **no inherent justification for post-mortem protection.** The incentive is for the creator *at the time of creation*. Once the creator dies, extending the term does nothing to incentivize *that* creation. Any post-mortem term would need a separate justification (e.g., supporting heirs during a transition, simplifying estates) and would be much shorter (e.g., 10-20 years max) or non-existent. The current 70 years is purely hereditary, not incentive-based.
  4.  **Registration/Renewal:** To reduce the burden of long "orphan works" and focus protection on commercially valuable works, a system requiring **registration and/or periodic renewal** (perhaps every 10-20 years) after an initial term would make sense under an incentive theory. Unrenewed works would fall into the public domain faster.

  **What Would Have to Change in the Rhetoric:**
  For the system to be honest about being purely incentive-based, we'd need to ditch:
  1.  **The Romantic Author Mythology:** Stop talking about works as "children of the mind" or inseparable extensions of the author's soul. Copyright becomes a temporary commercial monopoly grant, not a recognition of inherent personal connection beyond death.
  2.  **Hereditary Language:** Stop framing copyright inheritance for estates as a natural right. It would be framed as a limited policy choice (if retained at all), not akin to inheriting land.
  3.  **Moral Rights (in the US context):** While separate from *term*, the strong rhetoric around moral rights (right of attribution/integrity) conflicts with a pure incentive view. An honest system might weaken or eliminate statutory moral rights protections (like VARA), viewing them as separate personality rights rather than core copyright functions. (Note: This is a bigger shift and less likely than term reform).
  4.  **"Stealing" Rhetoric:** The language equating unauthorized use with "theft" would be harder to sustain when the *only* justification is providing an economic incentive, not respecting inherent property. Infringement would be discussed as a violation of a statutory monopoly, not a moral wrong akin to stealing physical property.
  5.  **Corporate "Authorship":** We'd stop pretending corporations "create" in the human sense. They fund, organize, and disseminate. The rhetoric would focus on protecting *investment*, not corporate "personhood" in the work.

  **The Reality Check:**
  Moving to a pure incentive model faces massive political hurdles. The life+70 model is deeply entrenched internationally and tied to the romantic author ideal. Corporate holders of valuable long-lived copyrights (like Disney) fiercely lobby for long terms. The transition would be complex. However, your analysis is correct: the *current* term structure reveals copyright's fundamental philosophical confusion. It serves two masters – romantic individualism and corporate capitalism – and satisfies neither theory consistently. A truly coherent system would require choosing one primary justification and designing terms accordingly, likely leading to significantly shorter and more uniform protection periods.
