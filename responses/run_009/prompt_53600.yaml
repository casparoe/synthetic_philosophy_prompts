answer: |-
  Here are the desiderata for theories of meaning location, organized by your specified considerations, with annotations on negotiability and tensions. Following this, I'll briefly score the three contenders and identify the key dividing requirement.

  ---

  ### **Desiderata for Theories of Meaning Location**  
  *(Non-negotiable = ⚖️; Negotiable/Contested = ⚡; Tensions flagged = ⚠️)*  

  1. **Tripartite Accountability**  
     - *Requirement:* Must locate all three layers (frame, outer, inner) without relabeling or obscuring the core problem (e.g., calling the outer message "innate knowledge" without explaining its origin).  
     - *Case:* Hofstadter’s layers are interdependent; ignoring one collapses the model (e.g., a theory that skips the frame message cannot explain how a signal is recognized *as* a message).  
     - *Status:* ⚖️ (Non-negotiable for adequacy).  

  2. **Decoding Regress Breaker**  
     - *Requirement:* Must explain how decoding capacity arises *without* infinite regress (e.g., how an infant learns language without prior decoding rules).  
     - *Case:* A Chinese instruction manual for decoding Chinese is useless to a non-Chinese reader; the theory must resolve this bootstrapping paradox.  
     - *Status:* ⚖️ (Non-negotiable for coherence).  

  3. **Undecoded Messages**  
     - *Requirement:* Must account for messages never decoded (e.g., an unread letter, a dead language). Does meaning exist independently, or is it constituted only upon receipt?  
     - *Case:* If meaning is purely receiver-dependent, the unread letter has none—but this clashes with intuition (e.g., archaeologists "recovering" meaning from ancient texts).  
     - *Status:* ⚡ (Contested: Receiver-centric views reject independent existence; objectivist views insist on latency).  

  4. **Receiver Variation vs. Stability**  
     - *Requirement:* Must explain divergent interpretations (e.g., *Hamlet* read as tragedy or political allegory) without:  
       - Collapsing meaning *into* the receiver (relativism: "anything means anything").  
       - Rendering the receiver’s role negligible (absolutism: "only one true meaning").  
     - *Case:* DNA bases encode proteins identically across biologists, but poetic metaphors invite personal resonance.  
     - *Status:* ⚖️ (Non-negotiable for empirical adequacy).  

  5. **Message vs. Noise Distinction**  
     - *Requirement:* Must differentiate messages (e.g., DNA, alien signals) from non-messages (e.g., crystal lattices) *without* relying on external labels.  
     - *Case:* Both DNA and crystals exhibit patterns, but only DNA is "intended" for functional decoding (even if "intention" is evolutionary).  
     - *Status:* ⚖️ (Non-negotiable; failure here equates all structure with meaning).  

  6. **Self-Decoding Capacity**  
     - *Requirement:* Can a message carry its own decoder (e.g., Rosetta Stone’s tri-script)? Or must decoding always originate externally?  
     - *Case:* The Rosetta Stone worked because one script (Greek) was already known—so was decoding truly "internal," or did it rely on prior external knowledge?  
     - *Status:* ⚡ (Contested: Self-referential systems like Gödel’s theorems suggest partial self-decoding; empiricists demand external anchors).  

  7. **Learning from Scratch**  
     - *Requirement:* Must allow receivers (infants, cryptanalysts) to acquire new decoding schemes without pre-existing codebooks.  
     - *Case:* Babies infer grammar from speech without explicit rules; cryptanalysts crack codes via statistical patterns.  
     - *Status:* ⚖️ (Non-negotiable; violates learning if decoding rules are innate/fixed).  

  ---

  ### **Tensions Between Desiderata**  
  - ⚠️ **"Same meaning across receivers with no shared history" vs. "Outer message requires decoding"**:  
    If the outer message needs decoding, but receivers share no prior code, how can they converge on the *same* meaning? This risks circularity (e.g., "universal decoding capacity" must be assumed).  
  - ⚠️ **"Meaning exists undecoded" (Des. 3) vs. Receiver-Constituted Views**:  
    Treating this as a requirement begs the question against receiver-centric theories. *Status:* ⚡ (Substantive claim, not neutral).  

  ---

  ### **Scoring Three Theories**  
  *(✓ = Fully meets; ~ = Partially meets; ✗ = Fails; ! = Major weakness)*  

  | **Desideratum**               | **Hofstadter's Triad** | **Reader-Constitution** | **Information Theory** |  
  |-------------------------------|------------------------|--------------------------|------------------------|  
  | 1. Tripartite Accountability  | ✓                      | ✗ (Ignores frame/outer) | ✗ (Flattens layers)    |  
  | 2. Decoding Regress Breaker   | ~ (Assumes shared biology/culture) | ✓ (Decoding = receiver's act) | ✗ (Requires pre-defined "channel") |  
  | 3. Undecoded Messages         | ~ (Meaning "waiting" in structure) | ✗ (Meaning = only upon receipt) | ~ (Meaning as latent correlation) |  
  | 4. Receiver Variation         | ✓ (Outer message mediates) | ! (Risks relativism)   | ✗ (Ignores interpretation) |  
  | 5. Message vs. Noise          | ✓ (Frame message marks intent) | ✗ (Noise = failed interpretation) | ✓ (Based on predictability) |  
  | 6. Self-Decoding Capacity     | ✓ (e.g., self-referential systems) | ✗ (Decoder always external) | ✗ (No "self" in correlations) |  
  | 7. Learning from Scratch      | ~ (Requires initial outer message) | ✓ (Learning = meaning-making) | ✗ (Correlations fixed) |  

  **Key Takeaways**:  
  - **Hofstadter’s Triad** best handles layered structure and self-reference but struggles with regress (Des. 2) and undecoded meaning (Des. 3).  
  - **Reader-Constitution** excels at learning (Des. 7) and regress (Des. 2) but fails message/noise (Des. 5) and undecoded messages (Des. 3).  
  - **Information Theory** clarifies message/noise (Des. 5) but collapses layers (Des. 1) and ignores interpretation (Des. 4).  

  ---

  ### **The Pivotal Requirement**  
  **Desideratum 3 (Undecoded Messages)** does the most work in separating theories:  
  - **Objectivists** (Hofstadter, Info-Theory): Meaning exists latently in the artifact.  
  - **Subjectivists** (Reader-Constitution): Meaning is constituted only upon interaction.  
  This divide shapes responses to *all other criteria*, especially decoding regress (Des. 2) and message stability (Des. 4).  

  **Recommendation**: Frame debates around Des. 3 and its tension with Des. 7 (learning). This exposes the core metaphysical rift: Is meaning *discovered* or *created*?
