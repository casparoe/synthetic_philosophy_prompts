prompt: |-
  I'm a doctoral student in contract law, and a dissertation chapter on the moral force of promissory obligation has forced me to admit that my judgments about when promises bind are stitched together from doctrine rather than principle. I'd like your help bringing them to reflective equilibrium. Below are my verdicts on a set of cases; please tell me whether a single principle captures them and, if not, which verdicts have to go.

  A promise extracted at knifepoint to pay the mugger a further sum the next day: not binding, and I feel no guilt at all about breaking it. The law says the same under the doctrine of duress, but I want the moral ground, not the doctrine: something about the promisee wronging me in the extraction seems to be what voids it. A promise induced by fraudulent misrepresentation — I pledged a large donation to what I was told was a school-building charity that is in fact a lobbying operation: not binding. A solemn promise to someone who dies before I can perform — I promised my grandfather on his deathbed to keep the family farm intact, and I now think I am bound, even though he can no longer rely on my performance, be harmed by my breach, or even know about it. A casual assurance at a party — "I'll be there Saturday, I promise" — uttered among friends in the usual tone of half-serious banter: barely binding, if at all, even though the host may genuinely plan around me. Conversely, an assurance that never uses promissory words but induces serious reliance — a parent who, by a steady course of conduct over years, leads her child to expect that she will fund her education: I think this binds as firmly as an explicit promise, which is roughly what promissory estoppel says, though again I want the principle underneath, not the doctrine. A promise to do something gravely immoral — I promised a friend I would help conceal his crime: I waver between thinking it binds and is overridden, and thinking it never binds at all; I would like the principle to decide this for me. A promise made by someone temporarily incompetent — drugged, or seven years old: not binding, its breach no worse than any other change of mind. A promise whose occasion silently disappears — I promised to look after your cat while you were away, and the trip was cancelled: nothing remains, and I notice I don't feel I have broken anything.

  Two tensions I can already see. Whatever makes the deathbed promise bind cannot be any benefit to, reliance by, or harm to the promisee, since none of these is available to a dead man; yet whatever voids the knifepoint promise seems to be a fact about the promisee. So my verdicts appear to require the bindingness of a promise to be both promisee-independent and promisee-dependent. Separately, the banter case and the estoppel case pull in opposite directions on whether it is the utterance of the words or the induced reliance that does the work.

  And here is the case I keep going back and forth on: a promise induced by a misrepresentation that made no difference to my decision. I agreed to give a keynote because I believed the organizer when she said the conference was on climate policy; it is in fact on tax law, but I would have accepted either topic — I simply like talking. Does the fraud void the promise, as it did in the charity case, or is the promise intact, as the thought that the deception changed nothing suggests? My gut delivers both verdicts at once, which I take as a sign that at least one is wrong.

  Please state the principle, or a small set of candidates, precisely; motivate each clause by pointing to the case that demands it; say what the resulting principle predicts for cases I haven't listed — for instance, a promise made to an institution, or one extracted by a threat of doing something the threatener had no right to do but that I would have tolerated anyway; and be explicit about which of my verdicts the best principle cannot save. I would rather overturn a verdict quietly than keep a principle that needs a new epicycle for each case.
reasoning: |-
  Hmm, this is a fascinating challenge in moral philosophy and contract theory. The doctoral student presents a series of promise scenarios where their intuitive moral judgments seem inconsistent, and they're wisely seeking a unifying principle rather than relying on legal doctrine alone. 

  The core tension they've identified is crucial: why do some promises bind without a living promisee (like the deathbed case) while others don't bind precisely because of the promisee's actions (like the mugging)? Their observation about the banter vs reliance cases also cuts to the heart of promissory theory—is bindingness about linguistic performance or about expectations created?

  Let me mentally walk through their cases. The mugger example clearly fails because the promise wasn't voluntary—the threat of violence undermines the moral agency required for binding promises. The fraudulent charity case is similar; consent was obtained through deception. But the deathbed promise holds despite the promisee's death, suggesting obligation stems from the promisor's commitment rather than the promisee's state. 

  The banter case is interesting—it shows that social context and performative intensity matter. "I promise" said lightly among friends creates less obligation than the parent's consistent conduct that never uses promissory language but creates serious reliance. This suggests bindingness scales with the reasonableness of reliance and the solemnity of commitment. 

  For the immoral promise, I lean toward the "no obligation" view—one can't be bound to do wrong, but this needs careful handling to avoid circularity. The incompetence cases (drugged, child) clearly fail because capacity matters. The cancelled trip case fails because the promise's foundation evaporated. 

  That misrepresentation-without-impact case is the real puzzle. If the lie didn't affect the decision, does it still void the promise? I think yes, because fraud contaminates the promise's validity even if it didn't change the outcome—but this needs principle-based justification. 

  The unifying insight seems to be about reciprocal moral positioning: promises bind when (1) voluntarily made with capacity, (2) accepted by a promisee who doesn't undermine the promisor's moral agency, and (3) the content remains morally possible. This explains deathbed promises (grandfather didn't compromise agency), voids mugger promises (agency violated), and handles fraud uniformly. 

  For their wavering cases: the immoral promise never binds—you can't owe what shouldn't be done. The misrepresentation case doesn't bind—fraud voids regardless of impact. Their "no guilt" in mugging and "bindingness" in parental conduct are preserved. The banter case gets clarified as non-binding when context shows no serious commitment. 

  This approach also resolves their institutional promise question—same principles apply—and explains why threats without wrongs might still void promises if they coerce will. Some verdicts must fall, but the gains in coherence justify it.
answer: |-
  Based on your intuitive verdicts and the tensions you've identified, a single principle emerges that captures most cases while requiring revisions to two verdicts for full coherence. The core idea is that **promises bind when they constitute a voluntary undertaking of obligation within a relationship of reciprocal moral recognition, where the promisee does not fundamentally undermine the promisor's agency or the moral basis of the transaction.** Let's formalize this:

  ### The Principle of Reciprocal Voluntary Undertaking (PRVU)
  A promise is morally binding if and only if:
  1.  **Voluntary Commitment:** The promisor *intentionally* undertakes an obligation they understand to be binding, with sufficient competence and free from control by wrongful external forces (*Competence & Non-Coercion Clause*).
  2.  **Reciprocal Recognition:** The promisee receives the promise in a manner that respects the promisor as a moral agent capable of voluntary commitment (*Moral Recognition Clause*).
  3.  **Moral Possibility:** The promised act is not inherently wrongful or impossible at the time of promising (*Content Validity Clause*).
  4.  **Foundation Persistence:** The foundational reason for making the promise (the *occasion*) persists until performance is due (*Occasion Clause*).

  ---

  ### How PRVU Explains Your Verdicts & Resolves Tensions

  1.  **Knifepoint Promise (Not Binding):** Violates **Clause 1 (Non-Coercion)** and **Clause 2 (Moral Recognition)**. The mugger's threat destroys voluntariness and treats the promisor solely as a tool.
  2.  **Fraudulent Charity Promise (Not Binding):** Violates **Clause 2 (Moral Recognition)**. The deception denies the promisor the information needed for meaningful consent and agency, undermining reciprocal moral respect.
  3.  **Deathbed Promise (Binding):** Satisfies all clauses. Despite the grandfather's death:
      *   *Clause 1:* Voluntary, competent commitment.
      *   *Clause 2:* Grandfather received the promise respectfully.
      *   *Clause 3:* Keeping the farm is (presumably) morally possible.
      *   *Clause 4:* The occasion (honoring grandfather's dying wish/care for his legacy) persists. **This resolves the "promisee-independence" tension:** Bindingness hinges on the *promisor's* voluntary undertaking within a *past* relationship of mutual recognition, not the promisee's *current* existence or reliance.
  4.  **Party Banter Promise (Not Binding):** Violates **Clause 1 (Voluntary Commitment)**. The context ("half-serious banter") signals a lack of serious intent to undertake a binding obligation. The words are uttered, but the requisite *intention* to be bound is absent or highly attenuated.
  5.  **Parental Assurance (Binding):** Satisfies **Clause 1 (Voluntary Commitment)** through conduct and **Clause 2 (Moral Recognition)**. The "steady course of conduct" demonstrates an *intentional undertaking* of an obligation ("I will fund your education"), even without words. The child reasonably receives this as a commitment based on the parent-child relationship. **This resolves the "utterance vs. reliance" tension:** Bindingness stems from the *undertaking* (manifested by words *or* conduct inducing reasonable reliance), not mere utterance. Reliance is evidence of the undertaking being received as intended.
  6.  **Promise to Conceal Crime (Not Binding):** Violates **Clause 3 (Moral Possibility)**. Concealing a crime is inherently wrongful. The promise *cannot* create a binding obligation to do wrong. (It may create other *prima facie* duties, like loyalty, but these are overridden by the immorality of the act).
  7.  **Drugged/Child Promise (Not Binding):** Violates **Clause 1 (Competence)**. Lacks the capacity to understand or voluntarily undertake a binding obligation.
  8.  **Cancelled Trip/Cat Promise (Not Binding):** Violates **Clause 4 (Foundation Persistence)**. The sole reason for the promise (your trip) has disappeared. The obligation was conditional on that foundation existing.

  ---

  ### Resolving Your Wavering Cases & New Predictions

  1.  **Misrepresentation Without Impact (Conference Topic):** **PRVU Predicts: NOT BINDING.** While your decision was unaffected, **Clause 2 (Moral Recognition)** is violated. The organizer deceived you about a material aspect of the undertaking, failing to respect your agency and the basis of the agreement, even if the lie didn't change your mind. *Your gut conflict arises because you sense the lack of harm (suggesting it *should* bind) but also the violation of trust/respect inherent in the deception (suggesting it *shouldn't*). PRVU prioritizes the moral recognition violation.* **Your verdict must change here:** The fraud voids the promise despite the lack of impact.
  2.  **Promise to an Institution:** Binds. Satisfies all clauses: voluntary commitment, the institution (via its agents) receives it respecting agency, moral content, and persistent occasion (assuming the institution's purpose/reason for the promise persists).
  3.  **Threat of Permissible Action:** **PRVU Predicts: NOT BINDING if the threat *controls the will*.** If the threat (e.g., "I'll expose your affair unless you promise me X," where exposure is permissible but devastating) coerces you into promising against your will, **Clause 1 (Non-Coercion)** is violated. The *wrongfulness* of the threatener's act (**Clause 2**) isn't the only factor; the *effect on the promisor's voluntariness* (**Clause 1**) is key. If you would have tolerated the action anyway and the threat didn't actually coerce you, *then* it *might* bind, depending on the specific context and whether **Clause 2** was respected in the offer/demand.

  ---

  ### Verdicts PRVU Cannot Save (Required Revisions)

  1.  **Party Banter Promise:** Your initial verdict ("barely binding, if at all") must become **clearly not binding**. The lack of serious intent to undertake obligation (**Clause 1**) negates bindingness.
  2.  **Misrepresentation Without Impact:** Your conflicted verdict must resolve to **not binding**. The deception violates the moral recognition requirement (**Clause 2**), voiding the promise regardless of its impact on your decision.
  3.  **Promise to Conceal Crime:** PRVU requires rejecting the "it binds but is overridden" option. **It never binds (Clause 3).** Your verdict should solidify on "never binds at all."

  ### Strengths of PRVU
  *   **Resolves Core Tensions:** It reconciles the "promisee-dependent/independent" tension by grounding obligation in the promisor's undertaking within a relationship of mutual recognition (which can persist beyond the promisee's life), while making the promisee's actions relevant to whether they respected that agency. It resolves the "words vs. reliance" tension by focusing on the *undertaking* manifested appropriately in context.
  *   **Explains Intuitions:** It captures the moral revulsion to coercion/deception (violations of agency/respect), the weight of solemn commitments, the irrelevance of reliance/harm in deathbed cases (the obligation stands on the commitment itself), and the nullity of immoral/impossible promises.
  *   **Provides Clear Guidance:** Offers a framework for novel cases beyond doctrine.
  *   **Minimal Epicycles:** Only requires revising two verdicts (Banter, Non-Impact Fraud) and solidifying one (Immoral Promise) for full coherence, rather than adding complex exceptions.

  PRVU grounds promissory obligation in the moral agency of the promisor and the fundamental requirement of reciprocal respect within voluntary human interactions. It explains why some commitments bind without reliance or harm, while others fail despite reliance, based on the integrity of the undertaking itself and the context in which it was made.
