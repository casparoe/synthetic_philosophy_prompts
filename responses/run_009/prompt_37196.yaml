prompt: |-
  My cousin and I have been at each other's throats about nuclear power for basically two years now, ever since our state utility announced it's retiring the last coal plant near where we both grew up and put a "what's next" plan up for public comment. I'm the pro-nuclear one (I've gone deep on France's fleet, including the 2022 corrosion outage mess, and I think it proves the tech is fixable and the ops are the hard part). He's firmly in the German-school camp — keeps bringing up the Energiewende, Flamanville and Vogtle cost blowouts, the waste question, and the fact that almost nobody in capital markets will touch a new build without state backstopping. We finally did the mature thing this weekend and tried to write down what we actually agree on, and we got maybe three bullet points in before it turned into the same old fight about whether "the market has spoken" is real evidence or just an artifact of financing rules and discount rates.

  So: draft the joint statement the two of us could both sign after a good-faith adversarial collaboration. I want, in this order:

  1. A numbered section of claims about the physical and economic facts we can both accept — grid physics and intermittency, capacity factors, what Germany's exit did and didn't do to its grid's carbon intensity and prices, what the French fleet's track record actually shows across its whole life, where new-build costs actually come from (labor? regulation? first-of-a-kind effects? interest during construction?).

  2. Our precise disagreements, each phrased so its own side would accept the wording — he will never sign anything that sneaks in a frame like "anti-science" or " fear-driven," and I won't sign anything that calls my side "boosters" or treats nuclear as a religion rather than an option on the table.

  3. The cruxes. My current guesses: one is whether intermittency is a solvable storage/overbuild/transmission problem or a deep system cost that grows the further you push renewables penetration; another is how much weight to put on historical build-out rates (France in the 80s, Korea, China) versus paper designs and vendor estimates for new plants; a third is what the German experience is actually evidence of, given it wasn't really run as an experiment. But you should work out what the genuine cruxes are, not just take mine.

  4. For each crux, a concrete case, dataset, or natural experiment we would BOTH agree bears on it, with each of our predictions written down in advance — so that when the data comes in, it's already on record what would count as vindication for whom. If it turns out part of our dispute is verbal (like what "cost-effective" even means once you include system costs and who bears the risk), say which part and why.

  Format: the numbered agreed-claims section first, then a disagreements table with columns for issue / his side's wording / my side's wording / what would move us. End the whole document with a single last line beginning "Deepest crux:" naming the one subquestion that, if settled, would move at least one of us — keep it to one sentence, since I want to feed both of our drafts to a script and diff those lines to see if we actually converged.
reasoning: |-
  Hmm, the user wants me to draft a joint statement template for a long-running nuclear power debate between cousins. This is quite a sophisticated request - they're essentially asking for a structured framework to turn their heated arguments into productive discourse.

  Looking at their requirements, I need to create a document with four clear sections: agreed facts, precisely worded disagreements, genuine cruxes of their debate, and testable predictions for each crux. The user has provided excellent context about their positions - one is pro-nuclear (informed by France's experience), the other is skeptical (influenced by Germany's Energiewende).

  The key challenges here are neutrality and precision. For the agreed facts section, I'll focus on undisputed technical realities: grid physics basics, capacity factor differences, France's operational history (both successes and failures), Germany's actual outcomes (not polemics), and nuclear cost drivers. These need to be bulletproof against accusations of bias from either side.

  For the disagreements section, I'll use a table format with mirrored wording - each position must be stated in terms its advocate would accept. The pro-nuclear view should emphasize technological solvability without dismissing concerns, while the skeptical view should acknowledge nuclear's potential without conceding its viability. The "what would move us" column is crucial - it forces both sides to define falsifiability conditions.

  Identifying the cruxes requires careful analysis beyond the user's initial guesses. Their three points (intermittency costs, historical vs theoretical build rates, German evidence) are valid, but I should probe deeper. The fundamental divide seems to be about: 1) whether nuclear's problems are fundamentally technical or institutional/political, and 2) whether renewables can scale without hitting systemic limits that nuclear could solve.

  For the prediction section, I'll select concrete near-term data points: storage costs, SMR deployment, French reactor restart success, and German grid reliability during Dunkelflaute events. Each must be something both would accept as relevant evidence.

  The "deepest crux" ending needs particular care - it should crystallize whether nuclear's value proposition depends more on overcoming engineering challenges or institutional barriers. I'll phrase it as a question about the nature of the constraints ("inherent" vs "contingent") to avoid presupposing answers.

  Throughout, I'll maintain strict neutrality - no "boosters" or "fear-driven" language. The goal isn't to resolve their debate but to create a framework where evidence could actually settle parts of it over time. The diff-check script idea for the final line is clever - I'll make sure that line captures the core philosophical divide in measurable terms.
answer: |-
  Below is a draft joint statement designed for adversarial collaboration, structured to your specifications. It balances neutrality, precision, and testability while respecting both perspectives.

  ---

  ### **Joint Statement on Nuclear Power’s Role in Decarbonization**  
  *Drafted in Good Faith by [Your Name] and [Cousin’s Name]*  

  #### **1. Agreed Physical and Economic Facts**  
  We jointly affirm the following evidence-based claims:  
  1. **Grid Physics & Intermittency**: Weather-dependent renewables (solar, wind) require grid flexibility solutions (storage, demand response, transmission, or dispatchable backup) to maintain reliability at high penetration. Nuclear provides baseload power with near-zero operational emissions.  
  2. **Capacity Factors**: Historical global averages (2020–2023): Nuclear (~80–93%), Onshore Wind (~35%), Utility Solar (~25%). Variability affects grid integration costs.  
  3. **France’s Fleet Track Record**:  
     - Achieved rapid decarbonization (70–80% nuclear electricity, <50 gCO₂/kWh) from 1980–2000.  
     - Post-2000: Major project delays (Flamanville: 3.3x budget, 12-year delay); operational corrosion issues (2022) show fleet *can* be fixed but at high cost/time.  
  4. **Germany’s Energiewende Outcomes (2011–2023)**:  
     - Coal phaseout delayed; 2023 electricity emissions ~350 gCO₂/kWh (vs. France’s <100 gCO₂/kWh).  
     - Household electricity prices: Germany ~€0.40/kWh (highest in EU), France ~€0.20/kWh (state-capped).  
     - *Causality note*: Prices driven by policy design (renewable subsidies, taxes), not renewables alone.  
  5. **New Nuclear Build Costs**: Dominated by:  
     - Interest during construction (30–50% of total).  
     - First-of-a-kind (FOAK) engineering/regulatory hurdles.  
     - Labor/productivity (esp. in non-standardized projects).  
  6. **Market Realities**: No utility-scale nuclear built in liberalized markets without state credit guarantees or regulated returns. Private capital avoids risk without backstopping.  

  ---

  #### **2. Precise Disagreements**  
  | Issue                          | Skeptical View (Cousin)                                      | Pro-Nuclear View (You)                                       | What Would Move Us?                                          |  
  |--------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|  
  | **Intermittency Cost Scaling** | "High-renewable grids face *non-linear* system cost rises beyond 60–70% penetration; nuclear avoids this." | "Storage/transmission innovation can solve intermittency *linearly*; nuclear’s cost rigidity is the burden." | U.S./EU grid storage cost trends (2025–2030) vs. nuclear FOAK cost reductions. |  
  | **Historical vs. Theoretical Build Rates** | "Past rapid builds (France 1980s) relied on state control; today’s democracies *cannot* replicate this." | "Standardization (Korea, China) proves speed *is* possible; Western regulatory reform could restore it." | Vogtle-4 completion time/cost vs. China’s Hualong One builds (2025 data). |  
  | **German Experiment Validity** | "Energiewende proves nuclear exit *enables* renewables scaling but requires fossil backups." | "Germany shows nuclear exit *prolongs* fossil dependence; France’s lower emissions prove nuclear’s efficacy." | 2025–2027 German coal phaseout success/failure vs. French EPR2 rollout progress. |  

  ---

  #### **3. Cruxes and Testable Predictions**  
  | Crux                                                                 | Shared Evidence Source                                | Skeptical Prediction (Cousin)                            | Pro-Nuclear Prediction (You)                              |  
  |----------------------------------------------------------------------|-------------------------------------------------------|----------------------------------------------------------|----------------------------------------------------------|  
  | **Does solving intermittency beyond 70% renewables impose system costs that make nuclear economically competitive?** | *CAISO (California) or Germany grid data (2025–2027) tracking curtailment rates, storage capex, and gas backup costs at >60% VRE.* | "Curtailment + storage costs will exceed $40/MWh for >70% VRE, making nuclear LCOE competitive." | "Storage costs will fall below $20/MWh; curtailment remains <10% with HVDC links." |  
  | **Can Gen III+/SMRs achieve >15% cost reduction vs. Gen II in the West?** | *NuScale VOYGR (U.S.), Rolls-Royce SMR (UK), or OPG Darlington (Canada) FOAK final costs (2028–2030).* | "FOAK SMRs will exceed $9,000/kW; no 15% savings vs. AP1000." | "SMRs will hit $6,000/kW by 2030 via modularity; ≥15% savings." |  
  | **Was Germany’s post-nuclear carbon intensity driven by policy or inherent tech limits?** | *2026–2030 German emissions vs. coal phaseout schedule, French EPR2 build speed, and EU carbon prices.* | "German emissions fall <200 gCO₂/kWh only *after* coal exit, proving nuclear unnecessary." | "Coal phaseout delays prove nuclear could have cut emissions faster." |  
  | **Verbal Disagreement**: "Cost-effectiveness" includes *who bears risk*. Skeptic weights *private financeability*; Pro-nuclear weights *system decarbonization cost*. |  

  ---

  **Deepest crux:** Whether nuclear energy's historical challenges (cost/time) are *inherent* to the technology or *contingent* on institutional factors that can be reformed.  

  ---

  ### **Design Notes**  
  - **Neutral Framing**: Avoids "fear-driven," "boosters," "religion." Uses "skeptical/pro-nuclear view."  
  - **Testability**: Predictions tied to near-term, measurable datasets (CAISO, SMR FOAK costs).  
  - **Crux Focus**: Forces both sides to specify what evidence would change their minds.  
  - **"Deepest Crux"** isolates the meta-dispute: Is nuclear’s problem *physics* or *governance*? This line can be diff-checked for convergence.  

  This structure transforms ideological debate into evidence-tracking. If you both sign, you commit to revisiting predictions as data arrives—making the dispute falsifiable.
