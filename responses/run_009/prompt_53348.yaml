prompt: |-
  Longtime lurker here (lesswrong since ~2012, EA forum, ssc/astral codex comment sections, the works), and I've noticed that basically every fight about medical ethics, sex, research, and data privacy eventually bottoms out in what actually makes consent count. So I tried the classic move: catalog my gut verdicts on cases and see if there's a principle underneath. Problem is my verdicts seem to contradict each other, and I'd like someone smarter than me to either find the principle or tell me which verdicts have to go.

  Here are the cases and my gut calls:

  1. A surgeon tells a patient a procedure is "basically risk-free" because he honestly believes it (it has a 2% paralysis rate he doesn't personally know about). Patient consents, gets paralyzed. I think the consent was valid — bad luck plus bad doctor, but not invalid consent. But if the surgeon *knows* the 2% rate and says "basically risk-free" to get the patient to agree, the consent feels invalid. So falsity alone doesn't kill consent; it's something about knowing deception? That already seems weird to me.

  2. A woman sleeps with a man because he told her he's single and he's actually married. Sleazy, but I find myself saying the consent was still valid. But a man who agrees to sex with a condom on and his partner secretly removes it mid-act — clearly invalid consent. Both are lies about the encounter, so what's the difference? Risk of physical harm? But suppose the married guy also has an STD he doesn't know about — now is it invalid? My gut says still kind of valid, which is not helping.

  3. Two people at a party, both tipsy, both enthusiastic, hook up: fine, valid. One tipsy person agrees after the other says "if you don't, you can find your own ride home": invalid. Sober person agrees after two hours of "everyone else said yes, you're the only one ruining the weekend": feels invalid-ish but I'm much less sure than the threat case, and I honestly can't say why, since the threat case seems to make any pressure at all disqualifying and then the nagging case should be easy.

  4. An elderly man with mild cognitive impairment wants to enroll in a risky experimental drug trial. He gets the gist — it's experimental, it could hurt him — but he can't retain the actual odds for more than a minute. Borderline, leaning valid, because he grasps the big picture? But a very smart, fully competent patient who signs a consent form where the risk was correctly disclosed but buried in paragraph 37 of dense legalese while the cover brochure was all sunshine — I feel like that consent is *weaker* than the old man's, even though the smart patient had all the info available and the old man didn't. These two verdicts together seem to rule out both a pure competence criterion and a pure information criterion, and I don't know what's left.

  5. Someone consents to a fight (actual consensual violence, MMA-style) after being taunted into it in front of friends: I say valid. Someone consents to sex because their partner threatened to leave them: I want to say invalid, or at least compromised. But "I'll leave you" and "you're a coward if you don't fight" feel like the same kind of social pressure applied to different acts. Maybe consent to high-stakes acts is more fragile? That can't be right either, because people consent to way riskier things (organ donation) under way less scrutiny all the time and we're fine with it.

  6. And the pair I really can't square: clicking "I agree" on a website's terms of service that nobody reads — valid, whatever. Signing a gym contract with an auto-renewal clause that was disclosed but visually buried — feels invalid to me. Same epistemic situation, opposite verdicts. I suspect I'm just being a snob about gyms, but maybe there's a real difference.

  I did read at some point about the distinction between reasons that count for the *state* an option puts you in versus reasons that count as *evidence* — like consenting to surgery because it fixes you versus because you enjoy hospitals — and I have a hunch the coercion cases turn on something like that (the threat gives you a reason you wouldn't have wanted), but every time I try to spell it out the nagging case and the drunk case break it.

  So: is there one principle, or a small set of clauses, that captures all or most of these? Please state it as precisely as you can, say which case motivates which clause, and tell me straight which of my verdicts it can't accommodate — I'd rather overturn a verdict than bolt on a sixth epicycle, but I want to know the price of each option. Also please apply it to two cases I deliberately left out: (a) a patient who tells her doctor "don't tell me the biopsy result unless it's bad news, just say I'm fine" and then relies on that 'fine' — has she pre-authorized the deception, and does that change anything? and (b) a guy who agrees to a private poker game knowing full well that some private games have card mechanics in them, and this one does — valid consent to lose money, or no? My intuitions on those are a total coin flip and I'm curious where the principle lands.
reasoning: |-
  Hmm, this user is clearly deeply engaged with rationalist communities and has done serious legwork on consent ethics. They've cataloged nuanced scenarios where their intuitions conflict, showing impressive self-awareness about the contradictions. The frustration is palpable—they've hit the wall of "I know my judgments don't cohere, and I want either a unifying theory or permission to ditch some intuitions."

  Breaking down their cases:  
  The deception cases (1-2) reveal tension between knowledge/motive and harm type. Why is lying about condom removal worse than lying about marital status? Physical harm vs. relational harm seems key, but their STD hypothetical muddies it.  

  The pressure cases (3,5) are messier. Why is "find your own ride" coercive but "you're ruining the weekend" isn't? And why does "I'll leave you" invalidate sexual consent but "coward" doesn't invalid fight consent? The stakes difference feels relevant but they're right—organ donation is high-stake yet low-pressure scrutiny.  

  Capacity cases (4) show competence isn't binary. The dementia patient grasping gist vs. smart person missing fine print suggests consent hinges on salient understanding, not raw information access.  

  The contract cases (6) are fascinating. ToS click-through vs. gym contract—both involve unread terms, but only the latter feels exploitative. Probably because gyms leverage inertia and sunk costs while websites are perceived as low-stakes.  

  Their proposed "reasons vs evidence" distinction is sharp but falters on the nagging case—if pressure creates "state-changing" reasons (avoiding abandonment), why isn't social pressure equally invalidating?  

  Building a principle:  
  Core insight seems to be that valid consent requires *agential participation*—the person must engage with material aspects of the decision relative to context. That explains:  
  - Surgeon's lie: knowing deception prevents engagement with risk (case 1)  
  - Condom removal: physical safety is material to sex, marital status often isn't (case 2)  
  - Drunk hookups: mutual enthusiasm shows engagement; threats bypass it (case 3)  
  - Dementia patient: grasps material "experimental=risky"; legalese buries material info (case 4)  
  - Fight consent: social pressure doesn't override material risk assessment; relationship threats do by distorting the relational frame (case 5)  
  - Gym contract: auto-renewal is materially consequential buried term; ToS are boilerplate (case 6)  

  For their bonus cases:  
  (a) The biopsy instruction: she authorized non-disclosure of good news, so the "fine" isn't deceptive within the agreed frame. Valid pre-authorization.  
  (b) Poker game: consenting while knowing cheating exists ≠ consenting to *this* game's cheating. Material risk wasn't engaged with. Invalid.  

  Where the principle strains: the STD hypothetical. If the married man unknowingly has an STD, is consent invalid? Under this framework, no—because the partner didn't *disable* engagement with STI risk. But if they'd discussed STI status and he lied, that would be different.  

  Biggest tension is in case 5—why relationship threats invalidate sexual consent but social pressure doesn't invalidate fights. The key is relational context: sex inherently involves vulnerability and trust, so threats targeting that foundation undermine consent's architecture. Fights lack that relational layer.  

  User should ditch the gym contract intuition—it's inconsistent with ToS acceptance. Both are valid under an "available info" standard, even if ethically shady. Or embrace that exploitation matters when there's power asymmetry (gyms vs individuals), but that's a new variable.  

  This was deliciously thorny. User gets major credit for mapping their cognitive dissonance so clearly.
answer: |-
  Your intuitions are grappling with a deep tension in consent theory: **valid consent isn't just about information or competence, but about whether the agent's agreement reflects autonomous engagement with the *material stakes* of the decision within its context.** After analyzing your cases, I propose this principle:

  **Consent is valid iff:**  
  1. **Material Awareness:** The agent grasps the *material consequences* of the act (i.e., consequences that would reasonably alter the decision of a typical person in that context), **AND**  
  2. **Uncorrupted Agency:** The agent’s agreement isn’t produced by factors that *bypass or sabotage their engagement* with those material stakes (e.g., deception about material facts, coercion exploiting critical dependency, or impairment preventing rational weighing).  

  This reconciles your intuitions by focusing on **what makes a consequence "material"** (context-dependent) and **what "sabotages engagement"** (not just pressure, but pressure that *detaches the decision from the stakes*). Here’s how it applies to your cases:

  ---

  ### **Resolving Your Cases**
  1. **Surgeon’s Lie**  
     - *Unknown risk:* Valid. Material consequence (paralysis) wasn’t grasped, but the surgeon didn’t sabotage engagement (honest mistake).  
     - *Known risk:* **Invalid.** Surgeon sabotaged engagement by *deceiving about material consequence* (paralysis risk).  
     - *Why falsity isn’t enough:* Unintentional falsehoods don’t sabotage engagement; knowing deception does.

  2. **Lies in Sexual Encounters**  
     - *Marital status lie:* **Valid.** Marital status isn’t typically a *material consequence* of sex itself (it’s relational, not inherent to the act). No sabotage of engagement.  
     - *Condom removal:* **Invalid.** Physical safety (STI/pregnancy risk) is material to sex. Removal sabotages engagement by altering the stakes mid-act.  
     - *STD unknowingly:* **Valid.** No sabotage (he didn’t deceive), and unawareness isn’t itself corrupting. If he *knew* and lied, it’s invalid (sabotage + material consequence).

  3. **Pressure and Intoxication**  
     - *Mutual tipsiness:* **Valid.** Mild impairment doesn’t inherently sabotage engagement if both grasp stakes (e.g., "this is sex, it might be awkward later").  
     - *"Find your own ride" threat:* **Invalid.** Coercion exploits *critical dependency* (safety/transport), sabotaging engagement with the stakes of sex.  
     - *"Ruining the weekend" nagging:* **Borderline valid.** Social pressure doesn’t exploit a *critical dependency*; it’s annoying but doesn’t sabotage engagement with material stakes (unlike the threat to safety).

  4. **Competence vs. Information Access**  
     - *Elderly man in trial:* **Valid.** He grasps *material consequences* (experimental = risky). His impairment doesn’t prevent engaging with the core stakes.  
     - *Smart patient + legalese:* **Invalid.** Burying material risks (e.g., side effects) in fine print *sabotages engagement*—it’s structural deception. Even with competence, you can’t engage with hidden stakes.  
     - *Why it works:* Material awareness doesn’t require perfect recall or parsing every detail—only grasping what’s contextually material. The elderly man gets the gist; the smart patient is denied it by design.

  5. **Social Pressure & Stakes**  
     - *Taunted into a fight:* **Valid.** Taunting doesn’t sabotage engagement with the stakes (pain/injury)—it *draws attention* to them. The pressure isn’t exploiting a critical dependency.  
     - *"I’ll leave you" for sex:* **Invalid.** Threat exploits an *existential dependency* (the relationship), sabotaging engagement with the stakes of sex. Consent becomes about avoiding abandonment, not the act itself.  
     - *Why stakes matter:* In organ donation, consent isn’t fragile because the material stakes (surgery risks) are central and typically engaged with. Pressure alone isn’t corrupting without dependency-exploitation.

  6. **Contracts & Fine Print**  
     - *Website ToS:* **Valid.** Boilerplate terms (e.g., data logging) are *immaterial* to most users’ primary goal (using the service). Non-engagement isn’t sabotaged—it’s rational ignorance.  
     - *Gym auto-renewal:* **Invalid.** Financial commitment is *material* to joining a gym. Burying it sabotages engagement with that stake (unlike ToS, where fees are usually explicit).  
     - *Key difference:* Context determines materiality. Auto-renewal directly undermines the gym’s core transaction (payment); ToS clauses rarely do for web services.

  ---

  ### **Where Your Intuitions Must Change (and Why)**
  - **Case 6 (Gym Contract):** Your verdict conflicts with ToS. Under this principle, both should be **valid** *unless* the buried term is material (e.g., a 5-year auto-renewal with penalties). If you feel the gym is exploitative, it’s an *ethical* flaw (consent is valid but *unfair*), not invalid consent. **Verdict overturned.**  
  - **Case 2 (STD Unknown):** Your "kind of valid" is correct—no sabotage, so valid. But if you felt it *should* be invalid, that’s a conflict. The principle says **valid**; overturn any lingering doubt.  
  - **Case 3 ("Ruining the Weekend"):** Your "invalid-ish" intuition is weak. The principle affirms **valid**—no dependency exploited.  

  ---

  ### **Bonus Cases Applied**
  **(a) Biopsy Result:**  
  - **Consent valid.** She *pre-authorized* a specific deception ("only tell me if bad"). Her agreement reflects engagement with material stakes: avoiding distress. The "fine" isn’t a lie—it’s an agreed-upon signal.  

  **(b) Poker Game:**  
  - **Consent invalid.** Knowing cheating *exists* isn’t consent to *this* game’s cheating. The material stake (fairness) was sabotaged—he couldn’t engage with the actual risk.  

  ---

  ### **Why This Works**
  - **Material Consequences** are contextual: Physical harm is always material; social/financial harms depend on the act (e.g., payment for gyms, fidelity for sex).  
  - **Sabotage of Engagement** explains deception/coercion: It’s not about pressure per se, but whether pressure *detaches the decision from the stakes* (e.g., threats exploit dependencies; fine print hides stakes).  
  - **Competence** is functional: Can the agent grasp material stakes? If yes, minor impairments don’t invalidate consent.  

  This avoids "epicycles" like stakes-fragility or pure info/competence metrics. The price? Abandoning the gym contract intuition—but that’s a win for consistency. If you reject this, your core tension (e.g., Case 1 vs. 2, Case 3 vs. 5) remains unresolved.
