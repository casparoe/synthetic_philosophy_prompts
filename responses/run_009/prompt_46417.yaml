  The decision-theoretic framework might be the most promising path forward—not to resolve the credence question but to make it harmless. If we can show both sides agree on all observable actions (as the user notes they do), then the residual disagreement becomes philosophically "quiet." That feels like an honest answer to "what progress looks like."

