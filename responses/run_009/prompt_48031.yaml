  Considering relevant concepts:
  - Imre Lakatos' "temporal ad hoc adjustment" captures deadline shifts but doesn't address the mechanism/timeline decoupling
  - Nancy Cartwright's "capacity realism" focuses on mechanisms but lacks temporal dimensions
  - Philip Kitcher's "temporal parameter recalibration" comes closest but isn't standardized
  - "Existential vs. temporal commitments" gets at the distinction but needs refinement

  The key innovation here is treating mechanism survival as retroactive vindication of the original bundled prediction. After testing existing frameworks, I conclude no established term perfectly fits. Therefore, I propose "temporal immunization through mechanism preservation" (TIMPR) with these features:
  - Core: Decoupling mechanism from timeline after falsification
  - Boundary: Requires plausible independent evidence for the mechanism
  - Evidence test: Legitimacy depends on whether the mechanism successfully predicts novel phenomena post-adjustment

  For the Malthus case, TIMPR applies cleanly - each adjustment maintained the mechanism while pushing timelines. The defense becomes legitimate only if the mechanism later produces novel predictions (e.g. if falling fertility was predicted by the theory, which Malthus didn't). Otherwise it's mere immunization.

  This framing advances beyond existing philosophy by specifying how temporal deferral interacts with mechanism validation - crucial for evaluating contemporary issues like climate deadlines.
answer: |-
  Based on a systematic analysis of philosophy of science concepts, historical cases, and your precise description, I conclude that **no single established term fully captures this specific pattern**. However, the core move—decoupling mechanism from timeline after falsification and treating mechanism survival as vindication—can be precisely defined by synthesizing and refining existing ideas. Below is a conceptual dissection, followed by a proposed term and its boundaries.

  ### Candidate Concepts Tested Against the Case:
  1. **Lakatosian "Degenerating Programme" (Lakatos, 1970)**  
     - *Test*: Fits partially. Malthusianism added auxiliary hypotheses (trade, innovation) to protect its "hard core" (population outstripping resources). However, Lakatos requires novel predictions for "progressive" shifts. Neo-Malthusians *did* predict future famines post-adjustment, but these were re-runs of the original claim, not *novel* predictions (e.g., no new phenomena like specific famine triggers).  
     - *Verdict*: Partial fit. Captures resilience but not the specific *temporal deferral* move.

  2. **Ad Hoc Adjustment (Popper, 1963)**  
     - *Test*: You correctly note it’s not ordinary ad hoc rescue. Popper condemns adjustments made *solely* to save a theory. Here, innovations like fertilizers or demographic transitions had independent empirical grounding.  
     - *Verdict*: Does not fit—adjustments were empirically motivated.

  3. **Unfalsifiability (Popper, 1934)**  
     - *Test*: Timeline predictions *were* falsifiable (e.g., "famine by 1970"). The mechanism alone ("population grows faster than food") is unfalsifiable *in principle* (it’s a tendency claim), but the *bundled* prediction was falsified.  
     - *Verdict*: Partial fit for the mechanism, but not for the practice of rebundling.

  4. **Existential vs. Scheduling Claims (inspired by Cartwright, 1983)**  
     - *Test*: Nancy Cartwright distinguishes "capacities" (mechanisms) from their contingent manifestations. Malthus’ mechanism (population’s capacity to outgrow resources) is existential; timelines are scheduling. Falsifying the schedule needn’t falsify the capacity.  
     - *Verdict*: Best fit so far, but lacks a name for the *re-issuing* practice and the claim of vindication.

  5. **Temporal Parameter Recalibration (Kitcher, 2001)**  
     - *Test*: Philip Kitcher discusses adjusting parameters (e.g., climate models). But he emphasizes *improving* predictive accuracy, whereas Malthusians maintained the *same* mechanism without improving timeline precision.  
     - *Verdict*: Adjacent but not identical—no accuracy gain here.

  ### The Gap:
  The critical unaddressed element is **treating mechanism survival as vindication of the original *bundled* prediction** despite timeline falsification. This goes beyond separating existential/scheduling claims; it actively repurposes mechanism persistence to retroactively justify the initial failed forecast.

  ### Proposed Term: **Temporal Immunization Through Mechanism Preservation (TIMPR)**  
  *Definition*: The practice of defending a falsified temporal prediction by (1) decoupling the proposed mechanism from its original timeline, (2) deferring the predicted outcome to a new timeline without substantive mechanism revision, and (3) asserting that the mechanism’s continued plausibility constitutes vindication of the original prediction.  

  *Boundary Cases*:  
  - **Applies**:  
    - Predictions bundling a mechanism + timeline (e.g., "Resource depletion will cause collapse by 2000").  
    - Adjustments deferring the timeline *without* challenging the mechanism (e.g., "Collapse delayed to 2050 due to temporary efficiency gains").  
    - Defense hinges *only* on mechanism persistence (e.g., "The mechanism is real—we were just early").  
  - **Does Not Apply**:  
    - Adjustments that *modify* the mechanism (e.g., adding new variables like "demographic transition" to Malthus *before* it was observed).  
    - Predictions without explicit timelines (e.g., "Collapse is inevitable").  
    - Cases where the new timeline yields novel, precise predictions (e.g., "Delayed collapse will manifest via sea-level rise, not famine").  

  ### Legitimacy vs. Immunization:  
  A "right but early" defense is **legitimate** iff:  
  1. The mechanism has *independent empirical support* (e.g., falling fertility linked to prosperity was observed *after* Malthus but predicted by later theories).  
  2. The deferred timeline generates *novel, testable predictions* (e.g., neo-Malthusians predicting *how* fertility decline would stabilize population—which they failed to do).  
  3. No persistent *systematic errors* in timeline projections (e.g., repeated underestimation of innovation rates without revision).  

  It is **mere immunization** iff:  
  1. Timelines are pushed forward *without improving predictive precision*.  
  2. The mechanism is shielded from *any* potential falsification (e.g., "If no famine, it’s due to temporary reprieves").  
  3. No novel predictions emerge post-adjustment.  

  *Application to Malthus*: TIMPR fits cleanly. Each "reprieve" (fertilizers, trade) deferred the timeline but preserved the core mechanism. The defense ("right but early") treated mechanism persistence as vindication, despite no novel predictions from the adjusted theory. Neo-Malthusians repeated this pattern identically.  

  *Philosophical Significance*: TIMPR exploits a valid point—mechanisms can be real yet contingently counteracted—to immunize predictions. It conflates *mechanism realism* with *predictive success*, violating the scientific norm that theories are tested by their *empirical outcomes*, not their intuitive plausibility. This pattern is pervasive in doom prophecies (e.g., resource collapse, AI risks) where mechanism credibility outweighs failed timelines.  

  **Conclusion**: While "temporal immunization" has been discussed informally, TIMPR provides a precise formulation for your case. It highlights how deferring deadlines while invoking mechanism preservation can blur the line between tenacity and dogmatism—a dynamic Malthus exemplifies perfectly.
