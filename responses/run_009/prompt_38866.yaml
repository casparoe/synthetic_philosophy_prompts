prompt: |-
  My friend Marco and I burned our entire friday night on this one and I'm still kind of spinning from it, so I want to write it down while it's fresh. We were arguing about what "could have" claims about a specific person even mean, and it turned out Marco has firm verdicts on a whole stack of cases. He says Hubert Humphrey could have won in 1968 — true — and when I pushed him on whether that's literally about Humphrey himself or just about some person who resembles him, he got actually offended and said obviously it's about Humphrey, the man, himself. He says he could have gone to dental school instead of grad school — true. He says he could NOT have been born to different parents, flat out, because whoever that would be it just wouldn't be him. And on the statue/lump thing he says the clay could have survived being squashed into a ball while the statue couldn't have, even though they're made of exactly the same stuff and occupy exactly the same place. Also he says there's no possible world where he exists but is a poached egg, which, fine.

  Here's where it got wierd. I threw new cases at him and he started stalling, so I want your read on what he'll say. Case one: a world with two people in it, each of whom is an equally perfect match for Humphrey up through 1968 — same history, same everything — but one of them wins the election and the other loses, and neither is even slightly more Humphrey-ish than the other. Does "Humphrey could have won" stay true for Marco? And is "the guy who wins in that world is Humphrey" true, false, or somehow neither? Case two: a world with someone molecule-for-molecule identical to Humphrey — same memories of Minneapolis, same everything — except he was born to completely different parents on another continent, so he's a perfect copy with the wrong origin. Is "Humphrey could have been that guy" true for him? Case three, the one that really broke the night: take the Humphrey-analogue who wins in one nearby world and the one who loses in another nearby world — are those two the same guy, or two different guys, or what?

  My hunch is he's running one of two rules that both fit everything he's said so far — either the same literal person exists in other worlds and hangs around via strict identity, or the whole thing secretly works by resemblance to people in those worlds instead of identity — and I can't tell which from his track record alone, since his Humphrey/dentist/parents/statue verdicts seem consistent with both once you squint. So: predict his verdicts on the three new cases, tell me which rule fits his track record best and why you'd bet on it over its rivals, and then design me the further case that would actually settle which rule he's running, because I want to win the rematch. Don't go easy on the "neither true nor false" stuff either — if one of the rules forces him into a verdict he'll hate, I want to know that too.
