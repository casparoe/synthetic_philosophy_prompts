prompt: |-
  I've been trying to work out what I actually think makes consent invalid, by going with my gut on a bunch of cases and seeing what comes out the other end. Here's the list, gut verdicts included.

  Sex after the other person lies about having been tested for STIs (says they're clean, they're not): the yes doesn't count, obviously. Same person shaves six years off their age: still counts, somehow. Says they're single when they're married: doesn't count. Says they're a great cook when they can barely boil water: counts. A mugger says hand over the wallet or I break your arm, and you hand it over: you didn't consent, that's just surrender. A landlord says pay rent or I evict you, and you pay: you did consent, the deal sticks, even though you'd be homeless otherwise. Your boss asks you out and you say yes mostly because turning down your boss feels like a bad career move: I keep flip-flopping on this one and it annoys me. A friend agrees at 3am, very drunk, to let you give them a stick-and-poke tattoo: no. The same friend, three drinks in but clearly with it, cosigning a loan for you: yes, though I can't say why the tattoo is different. Two stage-combat partners, one swings a realistic knife at the other after the other said go ahead: fine, obviously — but it's weird that this counts and the mugger doesn't, when the words are nearly the same.

  My tentative principle was: consent fails when it's obtained by lying about something material to the decision, or by a threat that leaves no acceptable option, or when the person isn't competent to decide. But it can't be right as stands — the age lie is material to plenty of people, the landlord threat really does leave few acceptable options, and the knife case shows the very same words can be a threat or not depending on staging I don't know how to cash out. So, what I want: is there a principle that fits most or all of my verdicts without becoming a laundry list of exceptions? Which verdicts would you tell me to throw out? Can you say why the married-lie invalidates while the age-lie doesn't, without just pointing back at my intuitions? And tell me what your principle says about a case I haven't listed: someone who agrees to sleep with a person who told them, plainly and up front, that they're only doing it to make an ex jealous — all the information was out on the table, but something about it still smells off to me, and I'd like to know whether my nose is tracking consent or tracking something else entirely.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've listed a bunch of scenarios where they've made gut judgments about whether consent is valid or not. Their main goal is to find a consistent principle that explains these judgments without being too full of exceptions. They also have a specific new case they're unsure about.

  First, I need to go through each scenario they mentioned and see the patterns in their responses. For instance, lying about STIs invalidates consent, but lying about age doesn't. Why? The user feels that the STI lie is material to health risks, while age might be a preference. That makes me think about the difference between core facts and peripheral ones. 

  Then there's the mugger vs. landlord example. Both involve threats, but the user sees the mugger as invalid consent while the landlord is valid. The key here might be the legitimacy of the threat. The mugger's threat is illegal and creates a situation with no acceptable options. The landlord, however, is exercising a legal right, even if it's tough. So the principle could involve whether the threat is within societal norms or not.

  The boss asking out is tricky. The user flip-flops here. Maybe because the power dynamic exists, but if the boss doesn't explicitly threaten, it's murky. The distinction between actual threats and perceived pressure matters. Competence is another factor—like the drunk friend getting a tattoo vs. cosigning a loan. The difference might be in the risk and permanence of the decision, affecting competence requirements.

  The stage combat example is interesting. Same words as the mugger, but valid consent because of context and mutual understanding. Context and shared intentions are crucial here. 

  Looking at their tentative principle, the issues are that materiality varies (age lie could be material to some), threats aren't all the same, and competence depends on the situation. So refining those categories with clearer criteria is needed. 

  For the new case: someone sleeps with another to make an ex jealous, with full disclosure. The user feels it's off. But why? Consent here is informed, no deception, but the motivation might make it feel transactional or degrading. However, since there's no deception or coercion, consent is valid, though it might be unethical or emotionally unwise. The user's discomfort might stem from broader ethical concerns, not consent per se.

  The user's deeper need seems to be a desire for a reliable framework to evaluate consent in various situations, possibly for personal clarity or ethical decision-making. They might also be grappling with the boundaries between consent, morality, and personal feelings. They need a principle that's both consistent and applicable to real-life complexities without oversimplifying.
answer: |-
  Based on your intuitions and the need for a unifying principle, here's a framework that fits your verdicts while addressing the inconsistencies and your new case:

  **The Principle: Consent is invalid if obtained through:**
  1.  **Material Deception:** Lies or omissions concerning *core facts about the nature of the act or the actor's identity/status* that fundamentally alter what is being consented to.
  2.  **Illegitimate Coercion:** Threats (explicit or implicit) of *wrongful harm* that leave the consenting party with *no reasonable alternative* but to comply.
  3.  **Incapacity:** A lack of cognitive ability (due to intoxication, mental state, age, etc.) to understand the *nature and significant consequences* of the act *at that moment*.

  **How it fits your verdicts:**

  1.  **Lies:**
      *   **STI Status:** **Invalid.** This is a material deception about a core fact *directly impacting the nature and risks of the sexual act itself* (health/safety).
      *   **Age:** **Valid.** While age *can* be material to preference, lying about it doesn't change the core nature of the act or the fundamental identity of the person. It's deception about an *attribute*, not the *essential character* of the person or act. (This distinguishes it from "identity" lies like being a different person).
      *   **Marital Status:** **Invalid.** This is a material deception about a core *status* (relationship availability) that fundamentally impacts the nature of the interaction (monogamous vs. adulterous) for many people. It speaks to the *kind of act* being consented to.
      *   **Cooking Skills:** **Valid.** Utterly peripheral to the nature of the act (e.g., a date, conversation, potential relationship). Not a core fact.

  2.  **Coercion:**
      *   **Mugger:** **Invalid.** Threat of unlawful violence ("break your arm") is *wrongful harm*. Compliance (handing over the wallet) is the *only* way to avoid immediate, severe harm. No reasonable alternative.
      *   **Landlord:** **Valid.** Threat of eviction is the exercise of a *legal right* (even if harsh). The alternative (finding a new place, negotiating, legal recourse) is difficult and undesirable, but it exists and is *reasonable* within the contractual/societal context. The harm threatened is not inherently "wrongful" in the legal/moral sense the mugger's is; it's the consequence of a prior agreement.
      *   **Boss:** **Valid (but ethically murky).** *Unless* the boss explicitly or implicitly links the date to job benefits/threats ("It'd be a shame if your promotion..."), this is *pressure*, not *coercion*. The threat is vague (potential awkwardness, perceived bias) and the alternatives (saying no, reporting if pressured) exist, though unpleasant. Power dynamics create pressure, but pressure alone isn't illegitimate coercion under this definition. (This explains your flip-flop: it feels wrong due to the power imbalance, but lacks the *wrongful threat* element for invalid consent).
      *   **Stage Combat:** **Valid.** The context transforms the words. There is *no actual threat of harm*; it's part of a pre-agreed, mutually understood performance with safety protocols. The "threat" is illusory and consensual within the defined boundaries of the activity.

  3.  **Incapacity:**
      *   **Drunk Tattoo:** **Invalid.** "Very drunk" at 3am suggests significant impairment likely affecting understanding of the *permanent, risky nature* of the act.
      *   **Tipsy Cosigning:** **Valid.** "Three drinks in but clearly with it" suggests sufficient cognitive capacity to understand the *nature* (signing a loan) and *significant consequences* (financial liability) at that moment. The risk level requiring competence is high in both cases, but the demonstrated capacity differs.

  **Addressing the Tentative Principle's Problems:**

  *   **"Material" Refined:** "Material" is qualified as concerning *core facts about the nature of the act or actor's fundamental identity/status*. This excludes preferences like age (which, while important, doesn't change what the act fundamentally *is*) but includes STI risk (directly changes the act's nature) and marital status (fundamentally changes the relational status consented to).
  *   **"Threat that leaves no acceptable option" Refined:** Specified as *illegitimate coercion* - a threat of *wrongful harm* leaving *no reasonable alternative*. This distinguishes lawful consequences (landlord) from unlawful violence (mugger) and contextualizes threats within agreements (stage combat). "Acceptable" becomes "reasonable alternative."
  *   **Competence:** Linked to understanding the *nature and significant consequences* of the *specific act* at the *specific time*. Explains the tattoo/loan difference based on the person's *demonstrated state* relative to the act's demands.

  **Your New Case: "Revenge Sex" with Full Disclosure**

  *   **Principle Verdict: Consent is VALID.**
  *   **Why:** There is no deception (full disclosure of motive), no coercion (agreement based on disclosed information), and presumably no incapacity. The person consents to the *exact act* proposed: sex with the known purpose of making an ex jealous.
  *   **Why it "Smells Off":** Your nose is likely tracking **something else entirely** – probably **exploitation or questionable ethics**, not invalid consent.
      *   **Exploitation:** The consenter might be vulnerable (lonely, insecure, hoping for more) and the proposer is leveraging that vulnerability for a purely instrumental purpose. It feels *predatory* or *manipulative*, even without lies or threats.
      *   **Ethical Dubiousness:** Using someone solely as a tool to hurt another person is widely seen as disrespectful and ethically problematic, regardless of consent.
      *   **Potential for Harm:** The consenter might not fully grasp the emotional fallout for themselves or others, even if they understand the stated purpose. However, unless this rises to incapacity or *was* lied about, it doesn't invalidate consent, just makes it potentially unwise or harmful.
  *   **In essence:** Consent can be ethically *problematic* or *exploitative* even when it's legally and philosophically *valid* under the deception/coercion/incapacity framework. Your discomfort is legitimate, but it points to broader ethical considerations beyond the validity of consent itself.

  **Which Verdicts to Reconsider? (Minor Tweaks for Consistency)**

  *   **Boss:** Your flip-flop is understandable. Stick with **valid** unless there's an explicit threat. The *power dynamic* is a strong reason for policies *prohibiting* such relationships due to inherent pressure and conflict of interest, but under this principle, it doesn't automatically invalidate consent. Your gut might be signaling the *policy* violation or *ethical* problem, not the consent's validity.
  *   **Marital Status:** This fits the "core status" definition well. However, if your gut starts shifting strongly *against* this being invalid in *all* contexts (e.g., a one-night stand where relationship status is truly irrelevant to the purely physical act), you might refine "core status" to depend on the *expressed nature* of the encounter. (But your current intuition is common and defensible).

  **Conclusion:**

  This principle – **invalid consent arises from Material Deception (core nature/identity), Illegitimate Coercion (wrongful threat, no reasonable alternative), or Incapacity (inability to understand nature/consequences)** – captures almost all your intuitions coherently. It avoids being a laundry list by focusing on *why* certain deceptions, threats, or states matter (their impact on understanding the act or the presence of wrongful force). The "Revenge Sex" case highlights that valid consent doesn't preclude situations that are ethically dubious, exploitative, or simply unwise. Your discomfort there is about morality and potential harm, not the technical validity of the agreement.
