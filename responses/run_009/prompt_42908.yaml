prompt: |-
  I produce long-range geopolitical forecasts for a policy institute, and I've been asked to publish a methods statement laying out my working assumptions. Before it goes out, I want an audit of whether the package hangs together. Here is what I've converged on:

  1. Outside-view priority. For questions about the durability of large political entities — whether a hegemonic order holds for another fifty years, whether a currency union survives a major shock, whether a dominant power declines gracefully or violently — the starting point and the main input should be base rates: how often entities in a suitable reference class have done the thing in question. Reasoning from the particular entity's institutions, leaders, and mechanisms is secondary and should move the estimate only modestly.
  2. A causal-similarity criterion for class membership. A reference class is well chosen when its members share the causal structure that generates the outcome of interest — how the entity extracts resources, secures loyalty, and manages succession — not surface features such as sharing a label ("empire," "federation," "great power") or an era. A class of agrarian tributary empires is the wrong class for a question about a nuclear-armed, financially integrated hegemon, however many members it offers.
  3. Humility about small classes. When a causally well-chosen class contains few members — as classes of hegemons and great-power systems do — I treat the resulting frequency as weak evidence, not as a probability to be held with confidence; wide uncertainty beats false precision.
  4. Anti-precisionism about the far future. There are, in my view, no credible point probabilities for geopolitical events more than a century out; forecasts at that range should be qualitative, conditional, and framed as scenarios.
  5. A horizon gradient. The shorter the horizon — a decade rather than a century — the more weight I give to inside-view evidence about the specific entity, since mechanisms become observable and base rates converge on current conditions.

  Please go through these commitments pairwise and tell me which are genuinely in tension and how badly, ranking the tensions by severity rather than presenting them as equally serious. For each genuine tension, say what would have to give, and what giving it up costs me methodologically. Flag any pair that only looks inconsistent but dissolves on inspection — I would rather not revise something that is not actually broken. Conclude by telling me which single revision would clean up the most. Answer in American English.
reasoning: |-
  Okay, the user is a geopolitical forecaster at a policy institute who needs to audit their methodological framework before publishing. They've listed five core commitments and want me to identify genuine tensions between them, ranked by severity. 

  First, I need to understand their professional context. They're producing long-range forecasts for policymakers, so credibility and avoiding overconfidence are crucial. The fact they're seeking an audit suggests they value rigor and anticipate scrutiny. Their methodology leans heavily on base rates (outside view) with nuanced adjustments - this is clearly informed by Tetlock/Superforecasting and Good Judgment Project principles.

  Looking at their five points: The outside-view priority (#1) seems foundational. The causal-similarity criterion (#2) refines how they select reference classes - much more sophisticated than just using historical analogies. Humility about small classes (#3) acts as a safeguard against overfitting. Anti-precisionism (#4) acknowledges inherent limits of long-range forecasting. The horizon gradient (#5) allows flexibility as timelines shorten.

  Now for pairwise analysis:
  The sharpest conflict is between #1 (prioritizing base rates) and #5 (increasing inside-view focus for shorter horizons). At 10-year horizons, #5 justifies heavy reliance on observable mechanisms, which could override base rates - directly challenging #1's "secondary/modest adjustment" rule. This needs reconciliation, perhaps by specifying how much weight shifts across time bands.

  Next tension is between #2's causal-similarity requirement and #3's small-class humility. Insisting on perfect causal matches might leave too few cases for meaningful base rates. They'll need to balance class purity against statistical power - maybe allowing "good enough" similarity with uncertainty adjustments.

  #3 and #4 actually reinforce each other - both combat false precision. No conflict here despite surface appearance. Similarly, #2 and #4 are compatible since causal similarity matters regardless of timeframe.

  The #4-#5 pair has mild tension around how abruptly precision drops off. Does the shift from quantitative to qualitative happen suddenly at 100 years? Probably needs smoothing via "range bands" (e.g., 0-20y quantitative, 20-50y blended, 50+y scenario-based).

  For resolution priorities: Clarifying the #1-#5 relationship would yield biggest payoff since it affects most forecasts. Suggest specifying exact time cutoffs and weight percentages for inside/outside views across horizons. This maintains rigor while building in necessary flexibility.

  Minor tweak: Emphasize that #3's "weak evidence" stance applies to all class sizes - even large N has limitations if causal structures drift over time. Strengthens consistency.

  Overall this is an impressively robust framework - my suggestions are refinements, not overhauls. The policy audience will appreciate the transparency about uncertainty and anti-precisionism.
answer: |-
  Based on a rigorous pairwise analysis of your five methodological commitments, I identify two **genuine tensions** requiring attention, ranked by severity, and one pair that *appears* tense but is resolvable. One pair is complementary, and another operates independently.

  ### Ranked Tensions (High to Low Severity)

  1.  **#1 (Outside-View Priority) vs. #5 (Horizon Gradient)**  
      **Severity: High**  
      **Nature of Tension:** #1 mandates that base rates are the *primary input* and inside-view factors should only *modestly* adjust estimates. #5 states that for shorter horizons (e.g., 10 years), more weight should be given to inside-view evidence ("mechanisms become observable"). This creates a conflict: for short horizons, #5 justifies potentially *major* adjustments based on inside-view factors, directly contradicting #1's "modest adjustment" rule.  
      **What Must Give:** #1’s requirement that inside-view adjustments must *always* be "modest" is unsustainable for short-term forecasts. You need to explicitly qualify #1 by stating that outside-view priority *diminishes* as the forecast horizon shortens, per #5.  
      **Cost of Revision:** It slightly weakens the universality of your outside-view primacy claim. However, it aligns with empirical forecasting best practices (e.g., Tetlock's work showing inside-view dominance in short-term predictions). Without this, your framework is logically inconsistent for near-term forecasts.

  2.  **#2 (Causal-Similarity Criterion) vs. #3 (Humility About Small Classes)**  
      **Severity: Moderate**  
      **Nature of Tension:** #2 demands reference classes defined by deep causal similarity, which often results in very small N (e.g., "nuclear-armed, financially integrated hegemons"). #3 correctly warns that small-N base rates are weak evidence. Strict adherence to #2 can make #3 *operationally unavoidable*, potentially crippling your ability to generate quantitative estimates even for medium-term questions where precision is viable.  
      **What Must Give:** You must clarify how to proceed when a causally-appropriate class has very few members. #3 should explicitly allow for *probabilistic judgments informed by* small-N base rates + outside-view analogs + structured inside-view analysis, rather than treating small-N as unusable.  
      **Cost of Revision:** It risks diluting the purity of your causal-similarity standard. However, it prevents methodological paralysis. The alternative—abandoning quantitative estimates whenever N is small—contradicts the practical needs of policy forecasting.

  ### Apparent Tension That Dissolves on Inspection

  *   **#3 (Humility About Small Classes) vs. #4 (Anti-Precisionism):**  
      **Why it Dissolves:** These are complementary, not conflicting. #3 addresses the *statistical weakness* of small-N base rates for generating probabilities. #4 addresses the *epistemic impossibility* of precise long-term (>100y) point estimates due to compounding uncertainty. #3 applies to any forecast using base rates (short or long term) with small N; #4 applies to all very long-term forecasts regardless of reference class size. A large-N class wouldn't save a 150-year forecast from #4’s critique, and a small-N class for a 20-year forecast still requires #3’s humility. **No revision needed.**

  ### Non-Interacting Pairs
  *   **#1 vs. #2, #1 vs. #4, #2 vs. #5, #4 vs. #5:** Operate in distinct domains (e.g., #1/#2 define *how* to use base rates; #4/#5 define *when* methods shift). No inherent conflict.
  *   **#2 vs. #4:** Defining causal similarity (#2) is relevant for any forecast horizon; rejecting precision >100y (#4) is a separate constraint. No conflict.

  ### The Single Most Impactful Revision
  **Revise the relationship between #1 and #5** to resolve the high-severity tension. Explicitly state that the weight given to outside-view vs. inside-view evidence *varies systematically with the forecast horizon*:
  *   **Long-Term (>50 years):** Outside-view (base rates) dominant; inside-view adjustments minimal.
  *   **Medium-Term (10-50 years):** Blended approach; base rates anchor, but inside-view mechanisms can significantly adjust estimates.
  *   **Short-Term (<10 years):** Inside-view (mechanisms, actors, contingent events) dominant; base rates provide context but not strong constraints.

  **Why this cleans up the most:** It directly resolves the core inconsistency in your framework while preserving the strengths of both #1 (avoiding anecdotal reasoning for long horizons) and #5 (recognizing that short-term dynamics are mechanism-driven). This aligns with forecasting best practices and enhances credibility by acknowledging reality: a forecast about a regime collapse in 5 years *cannot* be driven primarily by 500-year empire survival rates. The revision adds nuance without sacrificing rigor.
