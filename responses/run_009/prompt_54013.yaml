prompt: |-
  I am a professor of philosophy — I teach aesthetics and ethics — and I chair the collections and interpretation committee of the mid-sized regional art museum in the city where my university sits. I am the only person on that committee with philosophical training; the rest are a registrar, two docents, a donor representative, and the director. Roughly once a month we face the same recurring decision: a living or dead artist's moral record surfaces — through the press, a donor complaint, or the registrar's provenance research — and within a fifteen-minute agenda slot we must decide whether the work stays on the wall, stays with revised label copy, goes to storage, or a loan gets returned. Our record so far is incoherent: we kept the nineteenth-century landscapist whose published pamphlets defended slavery (the canvases themselves are mute about it), we deinstalled a contemporary photographer whose celebrated portraits of exploited subjects had been made under exploitative conditions, and we are now weighing a sculpture on loan from a living artist facing credible abuse allegations. The decisions have to be defensible to our donors and to the local press, and the docents have to be able to apply the procedure in my absence.

  Our docents' working shorthand — "bad person, bad painting?" — collapses at least three distinct questions: whether the work itself is aesthetically or morally compromised, whether we ought to associate with the artist at all, and what continuing to display the work says about the institution. And within the first of those, our committee keeps running together a moral defect the work merely happens to carry and one its power actually depends on — a seductive novel whose seductiveness runs through its cruelty. Your procedure has to keep those apart, and do it in a form a registrar can run under deadline.

  So: you are a professional philosopher working in aesthetics, ethics, and museum ethics, and I would like you to think carefully — first sketch the standard positions (autonomism, moralism, the hybrids) for yourself and decide what each one actually commits us to — but do not lecture us on them; I know them and the committee does not. The deliverable is a numbered list of exactly five items and nothing else: the five questions the committee should ask, in order, each stated in one or two sentences, with what counts as a decisive answer, where the question hands off to a judgment call rather than a rule, and a brief indication of how it treats the live cases — including whether the slavery-defending landscapist and the abusive sculptor come out the same way or not. Do not open with an introduction or close with a summary; the list is the whole answer. I will warn you now that the committee will not enjoy whatever the procedure implies about the photographer we took down, and I want that implication preserved anyway.
reasoning: |-
  Okay, the user is a philosophy professor specializing in aesthetics and ethics, and they chair a committee at a mid-sized art museum. The committee includes members without philosophical training—a registrar, docents, a donor rep, and the director. They struggle with a recurring problem: how to handle artworks when an artist's moral failings come to light. Their decisions have been inconsistent so far, and they need a clear, practical procedure that can be applied quickly in 15-minute slots. The docents use the shorthand "bad person, bad painting?" which oversimplifies the issue. The committee needs a step-by-step process that separates different ethical questions, like whether the work itself is morally compromised versus whether the museum should associate with the artist.

  The user wants a numbered list of exactly five questions. Each question should be concise, include what counts as a decisive answer, indicate where judgment is needed, and reference the cases (slavery-defending landscapist, exploitative photographer, abusive sculptor). They don't want theory lectures—just actionable steps. The procedure must address the inconsistencies in past decisions, like why the landscapist was kept but the photographer removed, and it should uphold the decision on the photographer even if unpopular.

  First, I need to recall the key philosophical positions—autonomism (art separate from morality), moralism (morality affects aesthetic value), and hybrids. But the user knows these, so I won't explain them. Instead, focus on distilling them into practical questions. The procedure must separate: 1) if the work itself is morally flawed, 2) if the museum should dissociate from the artist, and 3) what displaying the work says about the institution. Also, within the first point, distinguish between moral defects that are incidental versus essential to the work's power.

  Considering the cases: For the 19th-century landscapist, the pamphlets defended slavery but the art itself didn't engage with it. So, the moral failing is separate from the work. The photographer's exploitation was integral to creating the work—exploitative conditions were necessary for the portraits. The sculptor's abuse allegations are about the artist, not necessarily the sculpture's content.

  The five questions need to flow logically. Start with the artist's wrongdoing to address dissociation first, then examine the work's moral content, its dependence on wrongdoing, institutional implications, and finally the aesthetic value's role. This order prevents premature judgments based on "bad person, bad art."

  Question 1: Focus on whether the artist's actions are severe and confirmed, and if dissociation is necessary. This separates the artist from the work early. For the landscapist, historical context might make dissociation less urgent. The sculptor, with credible allegations, might require dissociation. Judgment call on severity and confirmation.

  Question 2: Assess if the work itself has moral defects. Landscapist's art is neutral; photographer's might exploit subjects. Decisive if the work promotes harm or is made unethically. The photographer's case shows work-dependent moral defect.

  Question 3: Determine if the work's value relies on the moral flaw. If yes, it's harder to display. The photographer's seductiveness comes from cruelty, so it fails here. The landscapist's art doesn't depend on slavery defense. Sculptor's work might not relate to abuse.

  Question 4: Consider institutional impact. Displaying might endorse wrongdoing or cause harm. Context matters—labeling could mitigate. Landscapist might stay with a label; photographer's removal might align with institutional values. Judgment based on audience and values.

  Question 5: Only if all previous don't mandate removal, consider if aesthetic value outweighs concerns. Autonomism surfaces here. Landscapist's high aesthetic value might justify display. Photographer's work, despite value, failed earlier steps. Sculptor might depend on abuse relation and institutional judgment.

  This structure ensures each step addresses a key issue without conflating them. The photographer is removed due to essential moral flaws and institutional harm, while the landscapist stays as flaws aren't work-related. The sculptor's outcome depends on allegations' severity and work content. The procedure implies the photographer's removal was correct, preserving that unpopular decision as the user requested.

  Need to ensure questions are clear, with decisive answers and judgment points. Use plain language for committee members. Test against cases to verify consistency. Finally, keep it to exactly five items, no intros or summaries.
answer: |-
  Here is the numbered list of five questions for committee decision-making:

  1.  **Is the artist's wrongdoing severe, confirmed, *and* sufficiently connected to our institutional association to necessitate dissociation?**  
      *Decisive if:* Proven, severe harm (e.g., violence, exploitation, hate advocacy) directly tied to the artist's public identity/actions makes association untenable *regardless of the artwork*. Judgment call on severity/confirmation threshold and institutional risk.  
      *Cases:* Slavery pamphleteer (historical, weak *current* association link? Judgment call) vs. Abusive sculptor (credible *current* allegations, stronger link? Judgment call). Photographer's exploitative *creation* links directly to association.

  2.  **Does the artwork itself contain or promote a significant moral defect *within its content or mode of creation*?**  
      *Decisive if:* The work explicitly endorses immorality (e.g., hate propaganda) or its creation inherently inflicted unjustified harm (e.g., non-consensual imagery). Judgment call on the significance of the defect.  
      *Cases:* Landscapist's paintings ("mute" on slavery, defect not *in* work) vs. Photographer (exploitation *in* creation process, defect in work). Sculptor's work (defect *in* work only if content reflects abuse).

  3.  **Is the artwork's aesthetic power or meaning *essentially dependent* on the moral defect identified in Question 2?**  
      *Decisive if:* Removing the defect would fundamentally destroy the work's artistic value or core message (e.g., seductiveness relies on cruelty). Judgment call on essential dependence.  
      *Cases:* Landscapist (no, beauty independent of pamphlets) vs. Photographer (yes, power likely derived from exploitative context/dynamic). Sculptor's work (only if its power relies *on* depicting/embodying abuse).

  4.  **Would displaying the work (as-is, or with context) currently cause significant harm or reasonably be seen as endorsing the artist's wrongdoing?**  
      *Decisive if:* Display demonstrably inflicts harm *now* (e.g., retraumatizes victims/communities) or unavoidably signals institutional endorsement of the wrongdoing. Judgment call on likelihood/severity of harm/endorsement and mitigation (e.g., labeling).  
      *Cases:* Landscapist (historical distance may mitigate harm/endorsement; label possible?) vs. Photographer (display likely seen as endorsing exploitation, harms subjects/community). Sculptor (depends on victim/community impact *now* and endorsement perception).

  5.  **Only if previous answers don't compel removal: Does the work's unique aesthetic, historical, or educational value *to our specific mission* outweigh the remaining ethical concerns identified?**  
      *Decisive if:* Concerns are minimal *and* the work is irreplaceably central to core collection goals. Judgment call on weighing values.  
      *Cases:* Landscapist (high aesthetic/historical value potentially outweighs distant association concern) vs. Photographer (fails earlier steps; value doesn't enter). Sculptor (only reaches here if dissociation not required and work lacks inherent defect/dependence; then value vs. residual association/harm concerns).
