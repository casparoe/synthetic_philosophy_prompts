answer: |-
  ### Joint Statement on Structural Realism: Findings from Adversarial Collaboration

  **Preamble**  
  We, an epistemic structural realist (ESR) and an ontic structural realist (OSR), engaged in a year-long adversarial collaboration to clarify the implications of scientific theory change for structural realism. We began from shared ground: the historical record undermines standard scientific realism’s commitment to the full ontology of past theories, as exemplified by cases like Fresnel’s equations for light propagation surviving while the ether ontology was discarded. However, we diverged on whether this record reveals epistemic limits (ESR: entities exist in themselves, but only their structural relations are knowable) or ontological primacy (OSR: relations are fundamental, and objects are derivative nodes in relational structures). Below, we present our joint conclusions, residual disagreements, and testable cruxes.

  ---

  #### 1. Agreed Claims  
  We affirm the following substantive claims, which neither a naive scientific realist (committed to full ontology) nor a pure empiricist (denying stability in unobservables) could endorse:  

  1.1. **Historical pattern of structural retention**: Theory change consistently preserves structural content—mathematically defined relations and equations—while discarding non-structural ontological commitments. Fresnel’s equations for light propagation were retained in Maxwell’s electromagnetic theory, but the ether substrate was abandoned. This pattern extends to transitions like Newtonian gravity to general relativity (where the Poisson equation is retained in weak-field limits) and classical to quantum mechanics (where commutation relations preserve symmetries).  

  1.2. **Underdetermination of non-structural realism**: Any realism asserting knowledge of non-structural properties (e.g., intrinsic essences of entities) is undermined by underdetermination. Dualities—such as AdS/CFT in quantum gravity, where a 5-dimensional gravitational theory is empirically equivalent to a 4-dimensional quantum field theory with distinct ontologies—demonstrate that multiple ontologies can instantiate identical structures. This renders non-structural claims empirically unverifiable.  

  1.3. **Mathematical characterization of retained structure**: Retention is defined by formal invariants:  
     - **Dynamical equations**: Equations governing system evolution (e.g., wave equations) persist under reinterpretation.  
     - **Symmetry groups**: Transformation groups (e.g., Lorentz group in relativity) conserved across theories encode physical constraints.  
     - **Dualities**: Empirically equivalent formulations (e.g., particle/wave duality) share mathematical structures (e.g., Hilbert space formalism) despite ontological divergence, confirming structure as the invariant core.  

  1.4. **Diagnosis of standard realism and pessimism**:  
     - **Standard scientific realism** errs in conflating structural success with ontological truth (e.g., inferring ether’s existence from Fresnel’s equations).  
     - **Pessimistic meta-induction** errs in generalizing ontological discontinuity to structural content, ignoring the stable retention of equations and symmetries.  
     - **Shared correction**: Structural realism avoids both errors by restricting realist commitment to relational structure.  

  ---

  #### 2. Disagreements Table  
  Residual disagreements are tabled below. Each position is stated as the respective collaborator endorses it. "Joint judgment" classifies the disagreement.  

  | Issue | ESR Position | OSR Position | Joint Judgment |  
  |-------|--------------|--------------|---------------|  
  | **2.1. Metaphysical implications of physics’ silence on individuality** | Physics’ silence on individuality (e.g., no haecceities in quantum mechanics) reflects epistemic limits: objects may possess intrinsic identities unknowable due to theory constraints. | Physics’ silence implies ontological deflation: individuality is not fundamental; objects derive identity from relational structure. | **Partly verbal**: Disagreement hinges on equivocation about “individuality” (ESR: potentially intrinsic; OSR: structure-dependent). |  
  | **2.2. Coherence of a ‘bearer’ of properties** | A bearer (object with intrinsic properties) is coherent: relations require relata, and bearers may possess unknowable intrinsic properties grounding relations. | A bearer is incoherent: properties are primitively relational, so a “bare” bearer adds nothing. Objects are just loci of structural roles. | **Substantive**: Disagreement over whether relations presuppose relata with intrinsic natures. |  
  | **2.3. Ontological status of relations** | Relations are epistemically primary but ontologically dependent: they require objects as relata, even if individuated non-haecceistically. | Relations are ontologically basic: objects are metaphysically thin nodes emergent from, and exhaustively defined by, relational networks. | **Partly verbal**: Equivocation on “object” (ESR: minimal relata; OSR: derivative patterns). |  

  ---

  #### 3. Cruxes  
  The following sub-questions would resolve disagreements if settled. For each, we specify: (i) the crux, (ii) the type of evidence bearing on it, and (iii) our opposing predictions.  

  **3.1. Permutation invariance and diffeomorphism equivalence as evidence for structural individuality**  
  - **Crux**: Do permutation invariance in quantum mechanics (where swapping identical particles preserves the state) and diffeomorphism equivalence in general relativity (where differently labeled spacetime points represent the same physical reality) show that individuality is conferred by structure (OSR) or that theories merely use non-haecceistic individuation, leaving unknowable haecceities (ESR)?  
  - **Bearing evidence**: A theory unifying quantum gravity and particle physics that either:  
    - (a) Successfully recovers particle/point haecceities (e.g., via hidden variables), or  
    - (b) Eliminates haecceities fundamentally (e.g., via background-independent relationalism).  
  - **Predictions**:  
    - ESR: Future theories will retain haecceities as unknowable but will not represent them operationally.  
    - OSR: Future theories will explicitly reduce individuality to structural constraints.  

  **3.2. Ontological primacy of relations: Surplus metaphysics or substantive claim?**  
  - **Crux**: Does OSR’s assertion of ontological primacy of relations add content beyond ESR’s epistemic primacy (e.g., by explaining why structure is invariant), or is it an unmotivated metaphysical layer?  
  - **Bearing evidence**: Development of a “pure” relational physics (e.g., a theory formulating all laws via graph relations without objects) that either:  
    - (a) Resolves anomalies (e.g., quantum singularities) better than object-oriented formulations, or  
    - (b) Proves intertranslatable with object-based theories without loss of content.  
  - **Predictions**:  
    - ESR: Relational formulations will be representational tools; explanatory gains will not require ontological revision.  
    - OSR: Relational formulations will be indispensable for progress, revealing object elimination as ontological insight.  

  **3.3. Interpretation of a purely relational physics**  
  - **Crux**: If future physics reformulates all object-dependent descriptions purely relationally (e.g., replacing particles with entanglement networks), is this a discovery about what exists (OSR) or a bookkeeping change (ESR)?  
  - **Bearing evidence**: Whether the relational reformulation:  
    - (a) Yields unique empirical predictions (e.g., novel particles from structural constraints), or  
    - (b) Is adopted for reasons beyond simplicity (e.g., resolving quantum non-locality).  
  - **Predictions**:  
    - ESR: Reformulation will be empirically equivalent to object-based versions; no ontological shift is warranted.  
    - OSR: Reformulation will reveal relational structure as fundamental, altering what we deem real.  

  ---

  #### 4. Closing: Verbal Disputes  
  We identify two disagreements as partly verbal, owing to equivocation on key terms:  
  - **“Individuality” in Issue 2.1**: The dispute dissolves if “individuality” means *haecceity independent of structure* (denied by both) but persists if it means *intrinsic identity potentially knowable* (ESR) vs. *structure-dependent* (OSR). Equivocation obscures shared rejection of “thick” individuality.  
  - **“Object” in Issue 2.3**: Both accept nodes in relational networks, but “object” connotes *bearer with intrinsic properties* (ESR) vs. *structural locus* (OSR). Clarifying “object” as *minimal relatum* aligns positions, leaving only the substantive Issue 2.2.  

  We conclude that structural realism is the most viable response to theory change, but its epistemic/ontic variants diverge on metaphysical commitments to objects. Resolving this requires progress on the cruxes above.  

  ---  
  *Signed,*  
  Epistemic Structural Realist  
  Ontic Structural Realist  
  Date: 2023-10-15
