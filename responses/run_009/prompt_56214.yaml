  **Joint Statement on Structural Realism**

  **1. Agreed Claims**

  We, the epistemic structural realist (ESR) and the ontic structural realist (OSR), after a year of adversarial collaboration, agree on the following claims:

  1.1. The historical record of scientific theory change demonstrates that the full ontological commitments of past theories are often discarded in subsequent theories, while certain structural elements are preserved. For example, in the transition from Fresnel's elastic solid ether theory of light to Maxwell's electromagnetic field theory, the equations describing the propagation of light (i.e., the wave equations) were retained, but the ontological commitment to the ether as a mechanical medium was abandoned.

  1.2. This pattern of structural retention, coupled with ontological discontinuity, poses a challenge to standard scientific realism, which holds that our best scientific theories are approximately true in their descriptions of both observable and unobservable entities. The challenge is particularly acute for any form of realism that goes beyond the structural features of theories (i.e., the relations and the equations governing them) to assert knowledge of the intrinsic natures of entities.

  1.3. The structural elements that are retained across theory change can be precisely characterized in mathematical terms. These include:
     (a) The preservation of dynamical equations: The mathematical equations that describe the evolution of physical systems (e.g., the wave equations in optics) often remain valid under reinterpretation in the new theory.
     (b) The preservation of symmetry groups: The groups of transformations under which the equations remain invariant (e.g., the Lorentz group in relativity) are typically conserved.
     (c) The significance of dualities: The existence of dualities (e.g., gauge/gravity duality in string theory) shows that empirically equivalent theories with radically different ontologies (e.g., one formulated in terms of strings in a higher-dimensional space and another in terms of a gauge field theory in a lower-dimensional space) can describe the same physical structure. This indicates that the common structure, not the specific ontology, is what is physically significant.

  1.4. Both the standard scientific realist and the proponent of the pessimistic induction (which infers from the history of theory change that current theories are likely false in their ontological claims) are mistaken in their focus on non-structural elements. The realist is wrong to assert that we have knowledge of the intrinsic natures of unobservable entities, and the pessimist is wrong to conclude that because past theories were wrong about ontology, our current theories are likely similarly wrong. Instead, the structural realist maintains that the retention of structure provides a stable basis for realism, even as ontologies change.

  1.5. We agree that underdetermination is a serious challenge for any form of realism that goes beyond structure. The existence of empirically equivalent theories with different ontologies (e.g., dualities) shows that the non-structural aspects of theories are underdetermined by the evidence. Therefore, any realist commitment must be restricted to the structural aspects.

  **2. Disagreements Table**

  We have the following residual disagreements, which we characterize as follows:

  | Issue | Epistemic Structural Realist (ESR) Position | Ontic Structural Realist (OSR) Position | Joint Judgment on Disagreement |
  |-------|---------------------------------------------|-----------------------------------------|--------------------------------|
  | 2.1. Whether physics' silence on individuality implies anything metaphysical. | Physics' silence on individuality (e.g., in quantum mechanics for identical particles or in general relativity) does not imply that individuality does not exist. It only shows that our current theories do not represent individuality, leaving open the possibility that individuality exists but is unknowable. | Physics' silence on individuality implies that individuality is not a fundamental feature of the world. Objects are at best derivative nodes in a relational structure, and there is no metaphysical basis for haecceities (primitive thisness). | Substantive (with a verbal component regarding the meaning of "individuality"). |
  | 2.2. Whether the notion of a bearer of properties (an object that does nothing beyond bearing properties) is coherent. | The notion is coherent because we can conceive of an object as having intrinsic properties that are not exhausted by the relational properties we can know. Even if we cannot know these intrinsic properties, they may exist and ground the object's identity. | The notion is incoherent because properties are fundamentally relational, and there is no need for an underlying bearer. The idea of a bare particular or a substratum that bears properties adds nothing to the structural description and is a relic of outdated metaphysics. | Substantive. |
  | 2.3. Whether relations are ontologically basic or whether they require relata. | Relations require relata (objects) that stand in those relations. Even if the relata are not individuated independently of the relations, they are real constituents of the world. | Relations are ontologically basic. Objects are not prior to relations but are constituted by them. The relata are nothing over and above the relational structure. | Substantive (but with a verbal component regarding the meaning of "object"). |

  **3. Cruxes**

  We identify the following cruxes, resolution of which would move at least one of us:

  3.1. **Crux: Permutation Invariance and Diffeomorphism Equivalence**  
     - *Question:* Does the permutation invariance of quantum states of identical particles (which entails that swapping particles leads to the same physical state) and the diffeomorphism equivalence of distinct models in general relativity (which entails that models related by a diffeomorphism represent the same physical spacetime) show that individuality is conferred by structure (OSR) or merely that our current theories happen to individuate objects non-haecceistically, leaving room for individuation we cannot know (ESR)?  
     - *What would bear on it:* A future theory that either (a) recovers haecceities (e.g., by introducing hidden variables that individuate particles) and is empirically successful, or (b) eliminates any reference to individuality in a way that is fundamental and not merely representational.  
     - *ESR Prediction:* Future theories might recover individuality in a knowable form (e.g., via hidden variables or a deeper theory that breaks the symmetry).  
     - *OSR Prediction:* Future theories will not recover individuality and will show that the non-individuation is fundamental, not just epistemic.

  3.2. **Crux: Ontological Primacy of Relations**  
     - *Question:* Does the OSR's claim that relations are ontologically basic have content beyond the ESR's position (which is that only structural relations are knowable), or is it surplus metaphysics?  
     - *What would bear on it:* The development of a physical theory that is formulated purely in terms of relational structures without any reference to objects and that provides new explanatory power (e.g., resolving singularities or unifying forces) that an object-oriented formulation cannot.  
     - *ESR Prediction:* Any purely relational formulation will be a representational device that does not preclude the existence of objects we cannot know; it will not add new explanatory power beyond what an object-oriented formulation can provide.  
     - *OSR Prediction:* A purely relational formulation will be indispensable for explaining phenomena that are mysterious in object-oriented terms, demonstrating the ontological primacy of relations.

  3.3. **Crux: Response to a Purely Relational Physics**  
