answer: |-
  1. When a losing candidate says "I might have won," is he referring to himself (the very same individual) winning in some possible scenario, or to a qualitatively similar but distinct individual winning?  
     - A. Himself (the very same individual) → Proceed to 2.  
     - B. A distinct individual → Proceed to 3.  

  2. Must there exist some possible world (concrete or abstract) containing that winning candidate, for the claim to be true?  
     - A. Yes → Proceed to 4.  
     - B. No → Proceed to 5.  

  3. Are other possible worlds as real and concrete as the actual world?  
     - A. Yes → **Lewisian counterpart theory** (concrete worlds, similarity-based counterparts).  
     - B. No → **Actualist counterpart theory** (abstract worlds, retain counterpart relation).  

  4. In a world where the candidate wins, what makes it *him*? Is it a primitive non-qualitative fact (e.g., a "thisness"), or is it fixed by how we describe that world?  
     - A. Primitive non-qualitative fact → **Plantinga-style haecceitism** (transworld identity via thisnesses).  
     - B. Fixed by description/stipulation → **Kripkean deflationism** (transworld identity by stipulation).  

  5. (For those answering 2B) Can a *de re* possibility claim (like "I might have won") be true without *any* entity (counterpart, duplicate, etc.) at *any* world having the property?  
     - A. Yes → **None of the above** (no cross-world apparatus needed; e.g., primitivist or actual-world-grounded views).  
     - B. No → *Route to 4*; but note: This answer contradicts 2B—if your group frequently combines 2B with 5B, it forces redrawing the tree for consistency.
