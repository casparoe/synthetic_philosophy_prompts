prompt: |-
  I've been keeping a list of gut verdicts on when one person has gotten a worse deal than another such that the rest of us owe them something, and I want to know whether there's one principle under all of them or whether I'm just inconsistent. Assume everyone in these cases has the same income and the same legal rights — the question is whether that's enough to call them equal.

  Neighbor born without a leg, needs a prosthetic and a ramp to get around town: yes, we owe the difference. Friend who genuinly can't enjoy a cheap holiday and needs the fancy hotel to feel the way I feel at the hostel: no, tough luck. Someone with depression who, on the same income as me, ends up with a much worse life: yes, clearly — treatment at minimum, probably more than that. Guy who could work but surfs all day and ends up poor and slightly less happy than he'd be with a job: no. Someone with no illness, just a naturally gloomy set point, a bit worse off than me at every income level: ugh, I keep flip-flopping — it feels different from the depression case, but I can't say why without sounding like I think doctors get to define what people are owed. And the one I'm most sure about and most confused by: a woman blind from birth who says, sincerly, that she's exactly as satisfied with her life as I am with mine — I still think she's owed things (the education, the transit, the tech), even though there's no welfare gap at all.

  So is there one currency of equality that fits all or nearly all of these? If not, which of my verdicts is the weak link that has to go, and why that one rather than the others? And tell me what your principle says about the case I havent decided: someone whose religion requires expensive stuff — pilgrimage, special food, turning down the jobs that need work on the holy day — where they converted as an adult, chose it with eyes open.

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, and don't restate my cases back at me.
reasoning: |-
  Okay, the user is grappling with a complex moral dilemma about equality and what society owes to individuals based on their circumstances. They've presented several scenarios where they intuitively feel some people deserve compensation while others don't, and they're seeking a unifying principle to explain these judgments. 

  The cases are fascinating in their contradictions: physical disability (yes), expensive preferences (no), clinical depression (yes), voluntary unemployment (no), natural gloominess (unsure), and congenital blindness with reported life satisfaction (strong yes). Then there's the unresolved case of religious expenses after adult conversion. 

  Hmm... what ties the "yes" cases together? Physical disability, depression, blindness - these all seem like unchosen circumstances that fundamentally limit a person's capabilities, regardless of their subjective happiness. The "no" cases involve preferences or choices - the luxury traveler, the surfer. The blind woman case is particularly telling because it proves the user isn't looking at subjective welfare - she reports equal satisfaction but still "deserves" accommodations. 

  Ah! The capability approach fits perfectly here. It's not about happiness equality or resource equality, but about what people can actually do and be. The prosthetic leg and braille education restore capabilities others take for granted. The depression treatment enables functioning. Whereas the surfer's capability set is intact - he just chooses not to use it. 

  For the borderline cases: Natural gloominess might not impair capability if it doesn't prevent participation in society. The religious convert chose those constraints voluntarily - their capability to change beliefs remains intact. 

  The user seems to be a deeply reflective person, probably in philosophy or social justice, given how precisely they've constructed these thought experiments. Their frustration about "sounding like doctors define what people are owed" suggests they're wary of medicalizing human differences. The capability framework elegantly avoids that by focusing on freedoms rather than diagnoses. 

  What they might not have considered is how voluntary vs unchosen factors affect capability. Also, they seem to assume equal income in all cases - but capability theory would argue income is just a tool, not the end goal. The blind woman case proves they already intuit this distinction. 

  For the religious case... tricky. If the religion was inherited, maybe some accommodation. But adult conversion is clearly agency-driven. Still, if society makes collective agreements about reasonable accommodations (like Sabbath protections), that's different from individual entitlements. 

  This framework holds up remarkably well across all their cases. The only possible tension is with the gloomy person - if their temperament actually prevents work or relationships, it might qualify. But the user seems to see it as non-debilitating, so "no compensation" aligns.
answer: |-
  Your bottom line: **We owe support only for deficits in *unchosen capabilities* that prevent basic functioning in society, not for expensive preferences or choices—and subjective happiness is irrelevant to this obligation.**

  Here's how this principle resolves your cases, identifies your weak link, and handles the religious convert:

  1.  **Neighbor without a leg:** Yes. Lacking a leg is an unchosen physical capability deficit preventing basic mobility (walking, accessing buildings). Prosthetics/ramps restore this core capability.
  2.  **Friend needing fancy holidays:** No. Enjoying a cheap holiday is a preference, not a fundamental capability. It's chosen taste, not an unchosen inability to function.
  3.  **Person with depression:** Yes. Depression (especially clinical) creates an unchosen mental capability deficit, impairing basic functioning (working, relationships, self-care). Treatment addresses this deficit.
  4.  **Surfer staying poor:** No. Poverty stems from chosen leisure preference over work. Core capabilities (ability to work) are intact but unused by choice.
  5.  **Naturally gloomy person:** **Your weak link - verdict should be No.** A low happiness "set point," absent impairment in functioning (working, forming relationships, self-care), is a personality trait, not a capability deficit. They can function; they just feel worse doing it. Feeling gloomy isn't equivalent to being unable to perform core activities. Supporting this risks endless claims based on subjective dissatisfaction.
  6.  **Blind woman reporting equal happiness:** Yes. Blindness is an unchosen sensory capability deficit preventing basic functioning (reading, navigating safely, accessing information independently). Tech/education/transit restore these capabilities. Her subjective happiness is irrelevant; the obligation exists due to the capability gap itself.
  7.  **Religious convert needing expensive practices:** **No.** While the *need* feels profound, the *cause* is a chosen set of beliefs and commitments made as an adult with full capability. The resulting financial strain stems from voluntarily adopted preferences/obligations, not an unchosen deficit in basic capabilities. They retain the capability to work standard jobs/earn income but choose constraints based on belief. Society doesn't owe compensation for the costs of deeply held but chosen life plans.

  **Why this works:** It focuses on **unchosen constraints** preventing **basic functioning** in society (mobility, senses, mental health for core tasks, communication, learning). Resources are owed to mitigate these specific deficits, restoring the individual to a baseline of capability enjoyed by others. Happiness is a separate moral good but not the currency of *this* distributive obligation. Preferences (luxury, leisure, religion) or personality traits (gloominess) don't create entitlements, even if they impact welfare. Your instinct on the naturally gloomy person ("No") is correct under this principle; flip-flopping was the inconsistency. The capability framework explains why the blind woman is owed support despite her reported happiness and why the surfer and religious convert are not.
