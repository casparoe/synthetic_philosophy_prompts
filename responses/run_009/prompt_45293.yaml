  **Scenario:**

  Imagine you are an employee at a tech startup. The company has two possible futures: either it will fizzle out relatively soon, having employed only about 10,000 people in total over its entire existence (Hypothesis Fizzle, or F), or it will become a giant success, eventually employing 10,000,000 people (Hypothesis Giant, or G). Based on typical business forecasting, the prior probabilities are roughly balanced: let's say P(F) = P(G) = 0.5. Now, you joined the company recently. The company assigns employee ID numbers sequentially starting from 1, and your ID is 9,998. This is near the end of the range for Hypothesis F (which would have IDs 1 to 10,000) but very early for Hypothesis G (which would have IDs 1 to 10,000,000). The key evidence is your low ID number: 9,998.

  We are to update our beliefs about F and G given this evidence. We must compute the posterior probabilities under SSA and SIA.

  **Definitions:**
  - Let F: the company fizzles, total employees = 10,000.
  - Let G: the company becomes a giant, total employees = 10,000,000.
  - Prior: P(F) = P(G) = 0.5.
  - Evidence E: "I have an employee ID of 9,998."

  **Self-Sampling Assumption (SSA):** Under SSA, you reason as if you are a random sample from the set of all actual observers in your reference class. Here, we take the reference class as all employees who ever work at the company. So, conditional on F, there are 10,000 possible employees you could be. Conditional on G, there are 10,000,000. The likelihood of observing ID=9,998 under each hypothesis is:

  - Under F: There are 10,000 employees. The probability that a randomly selected employee has ID=9,998 is 1/10,000, provided that 9,998 is within 1 to 10,000 (which it is).
  - Under G: There are 10,000,000 employees. The probability that a randomly selected employee has ID=9,998 is 1/10,000,000.

  So, the likelihood ratio in favor of F over G is:
  [P(E|F) / P(E|G)] = (1/10,000) / (1/10,000,000) = 10,000,000 / 10,000 = 1,000.

  Therefore, by Bayes' theorem, the posterior odds are:
  [P(F|E) / P(G|E)] = [P(F)/P(G)] * [P(E|F)/P(E|G)] = 1 * 1,000 = 1,000.

  So, P(F|E) = 1000/1001 ≈ 0.999 (over 99.9% confidence in F).

  This is the presumptuous verdict: based solely on having a low ID number, the SSA reasoner becomes extremely confident that the company will fizzle.

  **Self-Indication Assumption (SIA):** Under SIA, we weight each hypothesis by the number of observers it contains. That is, we adjust the prior probabilities by the number of observers. Then we apply Bayes' theorem with the likelihoods as above.

  The prior probabilities under SIA are adjusted to:
  P_SIA(F) ∝ P(F) * N(F) = 0.5 * 10,000
  P_SIA(G) ∝ P(G) * N(G) = 0.5 * 10,000,000

  So the adjusted prior ratio (SIA priors) is:
  [P_SIA(F) / P_SIA(G)] = (0.5 * 10,000) / (0.5 * 10,000,000) = 10,000 / 10,000,000 = 1/1000.

  Now, we apply Bayes with the same likelihoods as above. The likelihood ratio for E under F vs G is still 1,000 (as above). So the posterior odds under SIA are:
  [P_SIA(F|E) / P_SIA(G|E)] = [P_SIA(F)/P_SIA(G)] * [P(E|F)/P(E|G)] = (1/1000) * 1000 = 1.

  Therefore, P_SIA(F|E) = 0.5 and P_SIA(G|E) = 0.5.

  So the SIA reasoner remains at 50% confidence in each hypothesis.

  Thus, in this scenario, the SSA reasoner becomes extremely confident (99.9%) that the company will fizzle, while the SIA reasoner stays at the original 50-50. Thus, SSA is the presumptuous one, and SIA is the humble one.

