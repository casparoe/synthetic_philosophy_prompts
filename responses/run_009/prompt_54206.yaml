answer: |-
  That's a brilliantly observed phenomenon, and you're right – existing terms like "hindsight bias" or simple "changing one's mind" don't quite capture the **sincerity of the rewritten memory** and its specifically **aesthetic, experiential nature**. It's a fascinating interplay of cognition, memory, social influence, and value attribution.

  While there isn't one universally accepted, perfectly fitting term *yet*, several established concepts come close or can be combined to describe it:

  1.  **Cognitive Dissonance Resolution (with Memory Distortion):**
      *   **Concept:** Learning the truth (forgery/authenticity) creates dissonance between the new belief ("This is fake/real") and the old memory ("I loved/hated it"). To reduce this uncomfortable state, individuals unconsciously revise their *memory* of the experience to align with the new, socially validated belief.
      *   **Why it fits:** Explains the *motivation* for the rewrite (reducing dissonance) and accounts for the sincerity (the memory *feels* real after revision). It directly addresses the "overwritten" experience.
      *   **Limitation:** Cognitive dissonance theory explains the *why* of attitude change, but the specific *mechanism* of memory alteration needs another layer.

  2.  **Memory Reconsolidation + Suggestibility:**
      *   **Concept:** Every time we recall a memory, it becomes temporarily malleable ("reconsolidates") before being stored again. New information (the revelation) acts as a powerful suggestion during this window, literally altering the stored memory trace. The social context (critical consensus) amplifies this suggestibility.
      *   **Why it fits:** Explains the *mechanism* – the memory is genuinely altered neurologically. It captures the "overwritten" aspect perfectly.
      *   **Limitation:** While it explains *how* the memory changes, it doesn't inherently specify the *motivation* (dissonance reduction) or the specific *type* of information causing the change (provenance/authenticity).

  3.  **Motivated Reasoning / Belief Perseverance:**
      *   **Concept:** People seek information and interpret evidence in ways that confirm their current beliefs and avoid cognitive effort. Once the "truth" is known, they reinterpret past experiences (or memories of them) to fit this new belief structure. They are "motivated" to see the past as consistent with the present.
      *   **Why it fits:** Explains the reinterpretation of past feelings ("always felt stiff") to align with the current knowledge. Fits the expert edge case well (they are motivated to believe their expertise spotted it).
      *   **Limitation:** Focuses more on interpretation and reasoning than the *sincere feeling* of a rewritten memory.

  **Why "Hindsight Bias" Isn't Quite It (As You Noted):**

  *   Hindsight bias ("knew-it-all-along effect") primarily concerns **judgments about events and outcomes** ("After the election, everyone said they knew who would win"). It makes past predictability seem clearer than it was. Your phenomenon is about **subjective sensory and emotional experience** ("How the brushwork *felt*") being retroactively altered to match a new fact about *provenance*, not about predicting an outcome.

  **Coining a Term: Synthesizing the Concepts**

  Given the lack of a perfect single term, and your desire for precision, here are a few coined options emphasizing different aspects:

  1.  **Provenance Paradox:** Highlights the core trigger (change in knowledge of origin) and the contradictory nature of the memory shift.
  2.  **Aesthetic Hindsight:** Directly addresses the experiential nature ("aesthetic") and the backward-looking revision, distinguishing it from event-based hindsight bias.
  3.  **Authenticity-Driven Mnemic Revision:** Emphasizes the driving force (authenticity status) and the neurological/memory mechanism ("mnemic").
  4.  **Cognitive Reattribution of Aesthetic Experience:** Focuses on the process of reassigning the *cause* or *quality* of the past experience based on new information.
  5.  **Valence Reversal Memory Effect:** Focuses on the flip in feeling ("valence") – positive to negative or vice versa – and its memory basis. ("Valence" = positive/negative quality of an experience).

  **Addressing the Edge Cases & Your Criteria:**

  *   **The Suspicious Expert:** They are likely engaging in either **motivated reasoning** (reinforcing their self-image as an expert) or potentially experienced a milder form of **cognitive dissonance** *before* the reveal. Their initial uncertainty caused discomfort, leading them to reinterpret ambiguous details as "proof" of forgery earlier. The core memory rewrite mechanism could still apply, but triggered earlier by their own developing suspicion rather than a public revelation. They are *not* fundamentally exempt from the phenomenon, just experiencing it on a different timeline.
  *   **The Reverse Case (Fake -> Genuine):** This is the **exact mirror image** of the phenomenon and fits all the proposed mechanisms perfectly. Learning it's *genuine* creates dissonance with prior dislike or indifference, leading to a memory rewrite where they "always sensed the genius."
  *   **Distinct from:**
      *   **(a) Changing Mind:** This is retrospective memory *alteration*, not just a new opinion formed now.
      *   **(b) Hindsight Bias:** Focuses on subjective aesthetic *experience* and *provenance*, not event predictability.
      *   **(c) Devaluation:** Concerned with the sincere *memory of the experience*, not market value or ethical concerns.

  **Recommendation:**

  *   **For Precision in Discussion:** Use a descriptive phrase like **"retroactive revision of aesthetic memory driven by provenance"** or **"authenticity-induced memory distortion."**
  *   **For a Catchy Term:** **"Provenance Paradox"** is concise, memorable, and highlights the core contradiction. **"Aesthetic Hindsight"** is also strong, clearly distinguishing it from standard hindsight bias. **"Valence Reversal Memory Effect"** is more technical but very precise about the outcome.
  *   **In Academic Context:** Frame it as a specific manifestation of **cognitive dissonance resolution involving memory reconsolidation**, applied to the domain of **aesthetic judgment and provenance**.

  This phenomenon beautifully illustrates how deeply intertwined our perception, memory, and beliefs are, especially when social validation and concepts of authenticity/value are involved. It's less about the object itself and more about the story we tell ourselves about our *relationship* to that object. While no single term is perfect yet, the concepts above provide a robust framework for understanding it. "Provenance Paradox" feels like a strong contender for the specific, named effect you've identified.
