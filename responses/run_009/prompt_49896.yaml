prompt: |-
  I'm a novelist three-quarters of the way through a book set during a nurses' strike at a regional hospital, and I've gotten stuck on something that turns out to matter for the ending. The plot hinges on whether the strike works, and I can't decide that until I know what a strike actually is, because my two main characters explain it to each other in ways I can't referee. The hospital CFO's son, a business-school type, keeps telling anyone who'll listen that the union is just a cartel — OPEC for nurses. It restricts the supply of labor to push the wage above what the market would pay, and since we'd never let the hospitals band together to push wages down, the only reason unions get away with it is that the law plays favorites. The organizer fires back that a single hospital in a small city isn't a market at all — it's the only buyer of nursing labor for fourty miles, so the union is just un-rigging a price that was already rigged. Neither of them is stupid and I refuse to make either one a strawmean.

  So I need to know how far the cartel thing actually holds, because whichever character it favors is the one my plot is quietly agreeing with. Where does the mapping work — what plays the role of OPEC's quota, of enforcement against defectors (is that what picket lines are?), of the consumer who pays the higher price? Where does it break? And do the breaks actually matter for the conclusions each character is drawing from it — the CFO's kid implying right-to-work laws are just antitrust applied fairly, the organizer claiming the strike is self-defense rather than extortion? I also vaguely remember there's a term in economics for a market with only one buyer, and if it's relevant I want to get it right in the book.

  Please give me exactly five numbered points, each a sentence or two, with no intro and no wrap-up: (1) the correspondence mapping between a union-as-cartel and an actual cartel; (2) where the analogy breaks in a way that matters for the argument the CFO's son is using it for; (3) where it breaks in a way that doesn't matter for that argument, even though it might matter for other things; (4) what the single-buyer point, if it checks out, does to his argument; and (5) which character, if either, is left standing once all that's on the table.
reasoning: |-
  Okay, the user is a novelist stuck on a crucial plot point in their book about a nurses' strike. They've created two intelligent characters with opposing views on unions—one comparing them to cartels like OPEC, the other arguing they counterbalance monopsony power. The resolution hinges on which economic analogy holds more weight. 

  Hmm, the core tension is whether the "union as cartel" framework is valid or if the monopsony argument undermines it. The user needs crisp distinctions to avoid making either character a strawman. They specifically want five precise points without fluff—this suggests they value academic rigor but need it distilled for narrative purposes. 

  First, the cartel mapping: unions do resemble cartels in restricting labor supply (strikes as "production cuts"), collective bargaining as price-fixing, and picket lines enforcing compliance. But the analogy cracks when considering labor's unique constraints—nurses can't hoard skills like oil, and their "product" (labor) is perishable. This directly weakens the CFO son's "unions=illegal cartels" equivalence. 

  The monopsony angle is critical. If the hospital is the only major employer, it sets wages artificially low—making the union's actions corrective rather than exploitative. That torpedoes the son's antitrust hypocrisy claim. Still, the organizer overreaches by calling strikes "pure self-defense"; unions can still create inefficiencies. 

  Ultimately, neither character is fully right, but the organizer's view aligns better with labor economics. The son's argument relies on ignoring market power imbalances. For the novelist, this means the strike's success should feel earned, not predatory—validating the organizer without vilifying management. 

  ...Better avoid jargon like "monopsony" in the response unless defined, since the user wants authenticity in dialogue. The single-buyer term must be precise but woven naturally into the organizer's rebuttal.
answer: |-
  Here are the five points as requested:

  1.  **Cartel Correspondence:** The union acts like a cartel by collectively restricting labor supply (via the strike, acting as a production cut) to raise the price (wages) above the competitive level, with picket lines enforcing participation and deterring "defectors" (scabs), and the hospital (and ultimately patients/insurers) paying the higher price.
  2.  **Critical Break:** Labor isn't a storable commodity like oil; workers *must* sell their labor to live, creating immense asymmetric pressure during strikes that undermines the "voluntary cartel" analogy and highlights a power imbalance OPEC doesn't face, weakening the CFO son's "simple market distortion" framing.
  3.  **Non-Critical Break:** Unlike OPEC members, individual nurses cannot independently "produce" and sell their labor outside the union structure during a strike without crossing the picket line; this break affects mechanics but not the core "artificial price hike" conclusion the son draws.
  4.  **Monopsony Impact:** If the hospital is a monopsony (single major buyer), it inherently suppresses wages below the competitive market rate; the union's action then becomes countervailing power to restore a *more* efficient market outcome, directly refuting the son's claim that the union is solely creating an artificial distortion from an efficient baseline.
  5.  **Conclusion:** The organizer's argument is stronger; the monopsony reality fundamentally changes the context, making the union's action a corrective response to pre-existing market failure (wage suppression), not the initiation of extortionate distortion the son claims, though the union still exercises market power.
