answer: |-
  Here is a comprehensive set of desiderata for an adequate resolution of Thomson's lamp paradox, structured to meet your goal of advancing the debate. Requirements are categorized, motivated, and assessed for negotiability and potential conflicts.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Benacerraf Compliance**  
     *Must:* Acknowledge that the infinite sequence of actions (on/off toggles) *alone* does not determine the final state.  
     *Motivation:* Benacerraf (1962) proved that any function defined only on times *t < 1* cannot fix the state at *t=1*. A resolution denying this mathematical underdetermination fails.  
     *Non-negotiable:* Yes. Rejecting this undermines the paradox’s core.

  2. **Non-Stipulation of Outcome**  
     *Must:* Refuse to arbitrarily declare the lamp "on" or "off" at *t=1*. The resolution must derive the outcome (or its indeterminacy) from principles, or explain why no fact exists.  
     *Motivation:* Stipulation evades the paradox; the puzzle demands an account of how the outcome *could* be determined (or why it cannot).  
     *Non-negotiable:* Yes. Violates the paradox’s challenge.

  3. **Supertask Coherence**  
     *Must:* Clarify whether the supertask (completing infinitely many actions in finite time) is logically/metaphysically possible, and if so, under what conditions.  
     *Motivation:* Thomson’s lamp is a test case for supertasks. Dismissing supertasks as impossible must be justified; accepting them requires consistency.  
     *Non-negotiable:* Yes. Central to the paradox’s viability.

  ---

  ### **Substantive Desiderata (Strongly Preferred)**
  4. **Parity Across Variants**  
     *Must:* Extend the resolution to non-binary states (e.g., red/green lamps, adding a "broken" state) without ad hoc adjustments.  
     *Motivation:* A resolution specific to on/off states may exploit binarity illegitimately. Handling multi-state variants tests robustness.  
     *Negotiability:* Limited. Failure here suggests the solution is artifact, not principle.

  5. **Formal/Physical Distinction**  
     *Must:* Explicitly state whether the resolution addresses:  
     - (a) The *abstract mathematical description* (a function from time to state), or  
     - (b) A *physical system* (requiring mechanics, hysteresis, quantum effects).  
     *Motivation:* Conflating (a) and (b) invalidates arguments (e.g., "real switches can’t toggle that fast" vs. "the formal model permits it").  
     *Negotiability:* Low. Clarity here is essential to avoid talking past objections.

  6. **History/Grounding Requirement**  
     *Must:* Specify what (if anything) grounds the final state: the pre-*t=1* history, laws of physics at *t=1*, or neither.  
     *Motivation:* The lamp’s state at *t=1* must have an ontological basis. Appeals to "limits" or "continuity" require justification.  
     *Negotiability:* Moderate. Some resolutions deny grounding is possible.

  7. **Dichotomy Paradox Alignment**  
     *Must:* Reconcile with the Dichotomy Paradox (Achilles completing infinitely many sub-intervals). If supertasks are rejected, explain why dichotomy is acceptable; if accepted, explain why the lamp differs.  
     *Motivation:* Dichotomy is widely accepted as unproblematic; inconsistency here undermines the resolution.  
     *Negotiability:* Low. A unified account of supertasks is ideal.

  ---

  ### **Advanced Desiderata (Contextual)**
  8. **Physics-Dependence Clause**  
     *Must:* If invoking physics (e.g., switch mechanics), show how specific models resolve the indeterminacy *without* circularity.  
     *Motivation:* "The switch breaks" or "quantum effects dominate" must be derived, not assumed.  
     *Negotiability:* Moderate (only applies to physicalist resolutions).

  9. **Time-Reversibility & Emergence**  
     *Must:* Address whether the resolution permits/excludes "reversed" supertasks (e.g., energy appearing from static collisions).  
     *Motivation:* Elastic-collision paradoxes (e.g., Laraudogoitia’s) test time-symmetry and conservation laws.  
     *Negotiability:* High. May exceed the lamp’s scope, but signals explanatory power.

  ---

  ### **Flagged Incompatibilities**
  - **Conflict 1: Benacerraf vs. History-Grounding**  
    Desideratum 1 (underdetermination) conflicts with desideratum 6 (history-grounding) if grounding requires determination by the sequence. *Forces a choice:* Either the final state is ungrounded/indeterminate, or grounding comes from *outside* the sequence (e.g., laws at *t=1*).

  - **Conflict 2: Parity vs. Physics-Dependence**  
    Desideratum 4 (parity) demands identical treatment of binary/non-binary variants. But desideratum 8 (physics-dependence) may require different physical models for different states (e.g., a ternary switch behaves differently). *Forces a choice:* Either abstract away physics (risking irrelevance) or accept variant-specific resolutions (risking ad hocness).

  - **Conflict 3: SuperTask Coherence vs. Dichotomy**  
    Rejecting supertasks (desideratum 3) invalidates the dichotomy paradox (desideratum 7). *Forces a choice:* Deny dichotomy’s coherence (radical) or explain why spatial supertasks differ from lamp-like causal supertasks.

  ---

  ### **Field-Thinning Requirement**
  **Desideratum 1 (Benacerraf Compliance)** does the most to thin the field. It eliminates:  
  - Solutions claiming the final state "must" match the parity of the sequence.  
  - Solutions using infinite-series sums (e.g., "on = +1, off = −1, sum = 0 → indeterminate") without justifying why this represents the lamp’s state.  
  - Solutions asserting the limit of the state-sequence exists and determines the outcome.

  ---

  ### **Veto of Your Item 4 (Neighbor Cases)**
  **Veto:** Requiring coverage of elastic-collision supertasks is *misconceived*.  
  *Reason:* These involve momentum/energy conservation and continuous dynamics, fundamentally differing from the lamp’s discrete, causal toggles. A lamp resolution need not solve all supertask paradoxes, only those sharing its causal structure.

  ---

  ### **Stance Scorecard**
  1. **Impossibilism** (Supertasks are incoherent)  
     *Strength:* Honors Benacerraf; avoids outcome-stipulation.  
     *Weakness:* Fails Dichotomy alignment; requires rejecting Achilles’ run as illusory.

  2. **Incompletism** (Description underdetermines the outcome)  
     *Strength:* Mathematically sound; respects underdetermination.  
     *Weakness:* Feels unsatisfying; struggles with physics-dependent variants (e.g., "could the switch break?").

  3. **Physicalism** (Physics determines/collapses the outcome)  
     *Strength:* Grounds outcome in real processes; handles hysteresis/breakage.  
     *Weakness:* Risks ad hocness; may not resolve the formal paradox (which abstracts physics).

  ---

  An adequate resolution must navigate the **Benacerraf-History conflict** decisively. The deepest solutions either:  
  - **Deny grounding** (embracing indeterminacy),  
  - **Ground in *t=1* physics** (e.g., "the switch’s instantaneous state fixes the lamp"), or  
  - **Reject supertask coherence** (rendering the question meaningless).  
  **Parity** and **Dichotomy alignment** will test any candidate’s plausibility. Prioritize resolving the core conflict—this alone would advance the discourse.
