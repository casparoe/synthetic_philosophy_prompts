prompt: |-
  I do comms review at a mid-sized company -- every external statement, press answer, and exec social post goes through me and one other person before it goes out. Lately we keep fighting about statements that are technically true but smell bad: answers that dodge, numbers with cherry-picked denominators, "we have no plans to X" said while planning X is still six weeks of sign-offs away. One of us thinks technically-true-is-fine, the other thinks the public doesn't distinguish and we shouldn't either. We clearly need an actual procedure instead of vibes, and I remember there's a real philosophical literature on whether lying and misleading are morally different -- Kant apparently thought lying to the murderer at your door is forbidden but letting him draw a false but literally-true conclusion is fine, which is wild, and modern people talk about Grice and implicature and something called "paltering."

  So: turn that literature into a checklist I can actually run in fifteen minutes on a draft statement, no philosophy degree required. I want:

  - a sequence of questions to ask about the statement, in order, where each one has a clear enough answer that a tired reviewer can give it, and where a "no" at some point stops the procedure and kills (or rewrites) the statement
  - the key distinctions that have to survive the simplification -- I assume things like what the sentence literally says vs. what a normal reader will take it to imply, whether the misleading reading is cancelable, whether the audience would even want the true reading -- but you decide which ones make the cut and which get dropped
  - honesty about the points where the procedure runs out and it becomes a judgment call or a values question that my coworker and I just have to argue about, and maybe who wins those arguments by default (e.g., when in doubt, does the tie go to the more cautious reading?)

  Then run it on three real-ish cases from our queue:

  1. A reporter asks "are layoffs coming?" and the proposed answer is "we're focused on supporting our team through this year" while a restructuring is in fact in final approval. (For what it's worth, I think this one should pass and my coworker doesn't.)
  2. A renewal stat in a press release that says "9 out of 10 customers renew with us," where the denominator quietly excludes everyone who canceled during their free trial period.
  3. A case where the procedure has to give an answer I won't like -- ideally something it clears that I still find slimy, or flags as unacceptable that I think is fine. Pick whichever case does that best, and tell me plainly that the procedure disagrees with me.

  Also tell me what the procedure can't do -- I'm guessing it won't handle statements where the audience is heterogeneous and different readers take away completely different things, but there may be worse blind spots.

  Keep the whole thing under 900 words. We're not trying to become philosophers, we just want to stop having the same fight every Tuesday.
reasoning: |-
  Okay, let me tackle this comms review problem. The user wants a practical checklist based on philosophical concepts to evaluate potentially misleading statements, without getting bogged down in theory. 

  First, I consider the core tension they described: technically true vs. morally acceptable communication. The Kant and Grice references are helpful anchors - the key is distinguishing between literal truth and reasonable interpretation. 

  For the checklist, I'm thinking of a 3-stage funnel:
  1. Literal truth check (clear yes/no)
  2. Reasonable interpretation analysis (would normal readers likely be misled?)
  3. Ethical override (even if technically true, is it actively harmful?)

  The critical distinctions to preserve are:
  - What's said vs what's implied
  - Whether the true interpretation is accessible to the audience
  - If the misleading aspect is intentional

  I need to flag where judgment calls are unavoidable - like when reasonable people could disagree about audience interpretation. The tiebreaker should favor caution since reputational damage is hard to undo.

  For the test cases:
  Case 1 (layoffs): Passes literal truth but fails implication test - "focused on supporting" reasonably implies no layoffs imminent. Needs rewrite.
  Case 2 (renewal stat): Literally true but denominator manipulation makes reasonable interpretation misleading. Fails.
  Case 3 (counterexample): I need something where the checklist approves but feels slimy. "No plans to X" while planning X is perfect - it might pass if sign-offs are genuinely uncertain, though the user may dislike it.

  Major limitations:
  - Can't handle fragmented audiences well
  - Struggles with sarcasm/irony
  - Doesn't resolve values conflicts (e.g., "is this harm acceptable?")
  - Can't replace domain expertise about industry norms

  The word count is tight but doable by focusing only on actionable questions. The tone should stay pragmatic - we're stopping Tuesday fights, not writing dissertations.
answer: |-
  Here's a **15-Minute Comms Truthfulness Checklist**, distilled from philosophical principles (Kant, Grice, paltering) into actionable questions. When a statement gets a "NO" at any step, it requires rewriting or rejection. Tiebreakers go to the *cautious interpretation*.

  ---

  ### The Checklist (Run in Order)
  1. **Literal Truth:** Is every factual claim *provably true*? (If NO → **REJECT**)
  2. **Reasonable Interpretation:** Would a typical, attentive audience member *reasonably assume* something false from this statement? (If YES → **REJECT**)
  3. **Cancelability Test:** Could you add "*but not [misleading implication]*" without sounding contradictory or absurd? (If NO → **REJECT**)
  4. **Materiality:** Is the misleading implication *significant* to the audience’s understanding/decision? (If YES → **REJECT**)
  5. **Intent Check:** Is the *primary purpose* to avoid revealing an uncomfortable truth? (If YES → **REJECT**)
  6. **Default Win:** If steps 1-5 are ambiguous → **REJECT** (Tie goes to caution).

  ---

  ### Key Distinctions Preserved
  - **Said vs. Implied:** Steps 2 and 3 target Gricean implicature (what’s hinted).
  - **Accessibility:** Step 3 tests if the truth is *practically* available to the audience.
  - **Intent vs. Impact:** Step 5 addresses "paltering" (using truths to mislead intentionally).
  - **Harm Threshold:** Step 4 filters trivial vs. consequential deception.

  ---

  ### Test Cases
  **Case 1: "Are layoffs coming?" → "We're focused on supporting our team through this year."**  
  - Literal Truth: YES (you *are* focused on support).  
  - Reasonable Interpretation: NO (audience infers "no layoffs imminent").  
  - Cancelability: NO (Adding "but layoffs are coming" contradicts the implication).  
  - **VERDICT: REJECT** (Fails Step 2 & 3).  
  *Note: Your coworker wins this round under the procedure.*

  **Case 2: "9 out of 10 customers renew" (excluding free-trial cancellations).**  
  - Literal Truth: YES (if trial users aren’t "customers" per internal definition).  
  - Reasonable Interpretation: YES (audience assumes denominator = *all* users).  
  - Materiality: YES (exclusions distort performance perception).  
  - **VERDICT: REJECT** (Fails Step 2 & 4).

  **Case 3: "We have no plans to X" (while X is in early planning).**  
  - Literal Truth: YES ("plans" = finalized board-approved strategy).  
  - Reasonable Interpretation: YES (audience infers "X isn’t being considered").  
  - Cancelability: NO (Adding "but we’re exploring X" sounds deceitful).  
  - **VERDICT: REJECT** (Fails Step 2 & 3).  
  *You might dislike this, but the procedure flags it as misleading. If sign-offs are genuinely uncertain, rewrite to: "X is not confirmed, but under discussion."*

  ---

  ### What the Checklist **Can’t** Do
  1. **Heterogeneous Audiences:** It assumes "typical" readers. If experts and novices infer opposite meanings, the tool breaks.  
  2. **Cultural Nuance:** Implications vary across cultures (e.g., indirectness norms).  
  3. **Future Promises:** "We’ll never do X" can’t be tested for literal truth.  
  4. **Humor/Sarcasm:** Relies on literal interpretation.  
  5. **Values Conflicts:** Doesn’t resolve "Is this *worth* lying about?" (e.g., layoff timing vs. stock price). That’s a leadership call.

  ---

  ### Why This Works
  It forces analysis of **impact** over technicalities. A "NO" in Steps 2-5 means the statement *functions as a lie*, even if literally true. By making ambiguity a rejection trigger (Step 6), it defaults to protecting trust. Run it together with your coworker—no philosophy degree required, just ruthless honesty about what the public *hears*. (Word count: 850)
