prompt: |-
  At a recent family dinner, my brother-in-law Dev recounted something from his two years working for a water-infrastructure NGO in a country I won't name. To get his project's permits processed, he gave the permits clerk a bottle of whisky at the new year and, on another occasion, an envelope of cash to the clerk's office as a collective thanks after a difficult application finally cleared. Two of my friends who were present — Amara, who studied political science, and Tom, an anthropologist — spent the rest of dinner arguing about whether Dev had behaved corruptly, and they each asked me afterward to say who had won. I couldn't, and I'd rather not signal a view. Here is the exchange as it unfolded.

  (1) Amara opened by saying the envelope of cash was a straightforward bribe: a payment by a private party to a public official in connection with the performance of duty is corrupt by definition, and dressing it as thanks or custom doesn't change what it is. She added that definitions like this aren't Western parochialism — impartial public office is a norm every modern state officially endorses, including this one.

  (2) Tom answered that Amara's definition does the work only if you already know which payments count as "in connection with duty." The cash came after the application cleared; the whisky was a seasonal courtesy the clerk would have received from dozens of others; neither payment was conditional on anything. In that setting, he said, the gift is not an exchange at all but what anthropologists would call diffuse rather than specific reciprocity — it builds a relationship rather than purchases a service. Calling that corruption imports a Western wall between the market and the gift that this society never built.

  (3) Amara replied that the timing distinction is illusory: a tip is just a bribe paid after the fact, and everyone who tips a waiter knows that the real currency is future service. What the payment actually purchases is standing in a queue that officially doesn't exist. And the clerk's "duty" is not a fixed output — processing speed, order, and attention are all discretionary — so a system in which gifts are expected quietly converts equal entitlement into something auctioned off in envelopes.

  (4) Tom countered that on that reasoning every gift economy is corrupt, since all gifts create expectations; Amara had quietly reduced reciprocity to transaction and then indicted the transaction. He also noted that Amara had shifted from deviation-from-duty to outcomes-over-time: if corruption just means "any practice that generates unequal access to discretionary services," then legacy admissions at Amara's own university are corruption too — which she might accept, but then her charge no longer singles out Dev's whisky.

  (5) Amara said she was happy to bite that bullet: her real criterion is not deviation from duty but the erosion of the ideal that public decisions should track the merits of the case, and institutions that auction access — whether via envelopes, legacy preferences, or campaign contributions — sit on a continuum of failing that ideal, with the envelope further along it. Corruption, she said, is best understood as a property of the system of expectations, and Dev made himself a consenter to that system.

  (6) Tom closed by saying that a system-level standard gives Dev no action-guidance at all: an individual cannot unilaterally redesign a gift culture, refusing the whisky would have read as contempt, and Amara's position amounts to demanding that Dev absorb the moral costs of a badly designed institution so that she can keep her categories clean. Better to say the system is corrupting without saying Dev behaved corruptly.

  Please adjudicate this move by move: for each of the six numbered moves, say whether the point is sound, defeated by something said earlier or later in the exchange, or sound only given a hidden assumption, and identify that assumption. Then say who is right about what, and — importantly — what, if anything, both of them are missing. In particular, I'd like your view on whether the distinction Tom draws in (2) between specific and diffuse reciprocity can bear the moral weight he puts on it, and whether Amara's shift in (5) to a system-level criterion is a principled refinement or a moving of goalposts.
reasoning: |-
  Hmm, the user presents a complex ethical debate between Amara and Tom about whether Dev's actions were corrupt. This involves political science, anthropology, and moral philosophy perspectives. Let me break this down carefully.

  First, analyzing the structure: There are six moves to evaluate individually before assessing the overall argument. Key issues are the nature of reciprocity (Tom's point) versus systemic corruption (Amara's shift). The user specifically wants scrutiny of Tom's specific/diffuse reciprocity distinction and whether Amara's move to system-level analysis is valid.

  For move (1): Amara's legalistic definition seems technically sound but immediately faces challenges. Her "public office" norm claim is strong though - most states do officially endorse impartiality. But Tom will attack the "in connection with duty" ambiguity.

  Move (2): Tom's anthropological framing is insightful - diffuse reciprocity is indeed different from quid pro quo bribery. But his "Western wall" argument is shaky; many non-Western societies also distinguish gifts from payments in public administration. He assumes cultural relativism absolves individual complicity.

  Move (3): Amara's timing argument is clever - post-facto payments can still influence future behavior. Her point about "invisible queues" resonates with real-world bureaucracy. But she hasn't proven this was Dev's intent.

  Move (4): Tom effectively traps Amara with the legacy admissions parallel. His reduction-to-transaction critique hits home - not all reciprocity is corrupt. But he overlooks that systemic problems can start with individual actions.

  Move (5): Amara's systemic shift is intellectually honest but does change the terms. Calling all preferential access "corruption" expands the concept dangerously. Still, her continuum idea has merit - cash envelopes clearly sit differently than alumni donations.

  Move (6): Tom's practicality argument is compelling - individual resistance might be futile or counterproductive. But "corrupting system vs corrupt behavior" feels like semantic dodging. Both miss how context matters: Was this a functional adaptation or predatory exploitation?

  On the big questions: Tom's reciprocity distinction holds anthropological water but can't fully moralize the act - diffuse gifts still create problematic dependencies. Amara's systemic view isn't goalpost-moving per se, but overbroadens "corruption" until it loses meaning.

  What both miss: The power imbalance matters. Was the clerk extorting or accepting voluntary gratitude? Also missing is Dev's alternatives - were official channels truly blocked? And neither considers local perspectives - how did the clerk's community view such gifts?

  The core tension remains: between universal principles and cultural embeddedness. Perhaps the wisest answer is that Dev participated in a corrupt system, but calling him "corrupt" requires knowing his intentions and local norms better than we do.
answer: |-
  Below is a move-by-move adjudication of the debate, followed by an analysis of the core issues and what both parties miss. The evaluation focuses on logical soundness, rebuttals, hidden assumptions, and unresolved tensions.

  ---

  ### **Adjudication of Moves**

  1. **Amara (Definitional Claim)**  
     - **Soundness**: Logically sound *if* "connection to duty" is unambiguous.  
     - **Defeated by?**: Tom’s move (2) challenges the ambiguity of "connection to duty" and timing.  
     - **Hidden Assumption**: That public officials’ duties are clearly defined and separable from social relationships. Ignores cultural context.  
     - **Verdict**: **Partially defeated**. Amara’s definition is rigid and doesn’t account for nuance in timing/intent.  

  2. **Tom (Diffuse Reciprocity)**  
     - **Soundness**: Anthropologically sound (diffuse reciprocity is a valid concept).  
     - **Defeated by?**: Amara’s move (3) argues timing is irrelevant and gifts create implicit queues.  
     - **Hidden Assumption**: That diffuse reciprocity is inherently benign and culturally neutral. Overlooks power imbalances.  
     - **Verdict**: **Sound but incomplete**. The distinction *explains* the action but doesn’t inherently justify it morally.  

  3. **Amara (Timing is Irrelevant)**  
     - **Soundness**: Strong argument—gifts can influence future behavior (e.g., tips incentivizing service).  
     - **Defeated by?**: Not directly defeated, but Tom’s move (4) reframes it as overgeneralization.  
     - **Hidden Assumption**: All gifts to officials create corrupt incentives. Ignores cultural norms where gifts lack transactional intent.  
     - **Verdict**: **Sound in context**. Highlights systemic risks of discretionary power.  

  4. **Tom (Overgeneralization & Hypocrisy)**  
     - **Soundness**: Effective reductio ad absurdum—Amara’s logic indicts all gift economies.  
     - **Defeated by?**: Amara’s move (5) embraces the broader definition.  
     - **Hidden Assumption**: That "corruption" must be individually blameworthy, not systemic.  
     - **Verdict**: **Sound**. Forces Amara to clarify her criterion.  

  5. **Amara (Systemic Criterion)**  
     - **Soundness**: Philosophically coherent—shifts focus to institutional erosion.  
     - **Goalpost-Moving?**: **Principled refinement**, not evasion. She concedes Tom’s point about narrow definitions but expands to a consistent principle.  
     - **Hidden Assumption**: That "equal access based on merit" is universally prioritized over relational cultures.  
     - **Verdict**: **Sound but contestable**. System-level analysis is valid, but risks moralizing all social practices.  

  6. **Tom (Individual Action-Guidance)**  
     - **Soundness**: Pragmatically strong—condemning Dev ignores real-world constraints.  
     - **Defeated by?**: Amara’s systemic view (5) argues complicity perpetuates harm.  
     - **Hidden Assumption**: That systemic change requires institutional, not individual, reform.  
     - **Verdict**: **Partially sound**. Correct about impracticality but downplays individual agency.  

  ---

  ### **Who is "Right"?**
  - **Tom** is right that **Dev’s actions aren’t individually corrupt** in a vacuum. The gifts fit local norms of diffuse reciprocity, and refusing them might have been socially punitive.  
  - **Amara** is right that **the system is corrupt**. Gifts auction discretionary power, undermining merit-based access. Dev’s participation sustains this.  
  - **Neither "wins"**—they debate different questions: Tom focuses on *intent and cultural meaning*; Amara on *systemic impact*.  

  ---

  ### **What Both Miss**
  1. **Power Dynamics**: Neither examines whether the clerk *expected* gifts (coercion) or Dev offered them voluntarily (gratitude). If refusal risked permit delays, it’s extortion—not reciprocity.  
  2. **Local Perspective**: They assume cultural legitimacy without evidence. Did locals view this as corruption? If so, Tom’s defense collapses.  
  3. **Alternatives**: Could Dev have advocated for institutional reform? Tom dismisses individual agency; Amara ignores feasibility.  
  4. **Scale Matters**: Whisky (symbolic) vs. cash envelope (material) may have different ethical weights. Both lump them together.  

  ---

  ### **Core Questions Revisited**
  1. **Tom’s Specific vs. Diffuse Reciprocity**:  
     - **Can it bear moral weight?** **Partially.** Diffuse reciprocity explains cultural intent but doesn’t absolve harm. If gifts create unequal access (per Amara), the distinction becomes morally irrelevant. Tom conflates *description* with *justification*.  

  2. **Amara’s Shift to Systemic Criterion**:  
     - **Principled or Moving Goalposts?** **Principled.** She concedes Tom’s critique of narrow definitions and adopts a coherent standard: corruption as any practice auctioning public access. This isn’t evasion—it’s a broader ethical lens.  

  ---

  ### **Conclusion**
  - **The Real Conflict**: Clash between **cultural relativism** (Tom) and **universal institutional ethics** (Amara).  
  - **Unresolved Tension**: How to balance respect for local norms with the demand for impartial public institutions.  
  - **Adjudication**:  
    - **Dev’s actions**: Likely *non-corrupt* by local standards but *systemically corrosive* by ideal ones.  
    - **System vs. Individual**: Tom correctly notes Dev lacked alternatives; Amara correctly notes his complicity.  
    - **Final Word**: Both underestimate **context**. Without knowing local perceptions or power dynamics, judging Dev is premature. The deeper issue is whether *any* society can sustain impartial institutions while embracing gift-based official relationships.
