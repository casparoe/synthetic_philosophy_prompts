prompt: |-
  I would like help identifying a concept, if one exists, in epistemology. I keep encountering a particular structural move in discussions about what entitles us to our beliefs, and I cannot find a standard name for it. The familiar background worry is this: if a belief is justified only by another belief, then justification seems to run into one of three unattractive outcomes — an endless chain, a circle, or a brute stopping point where some belief is simply declared self-justifying. The move I have in mind accepts the setup but denies the three-way choice. It goes as follows: the chain does not stop at a special self-justifying belief; it stops because the last item in the chain is not a belief at all. For instance, my belief that there is coffee in the kitchen rests on my belief that the mug on the counter is full, and that belief is not supported by a further belief but by my seeing the mug — a perceptual episode, something that happens to me rather than something I hold true. The defender of the move claims this dissolves the trilemma instead of picking a horn: nothing is unjustified, nothing is circular, and nothing is self-justifying, because the chain is a chain of beliefs and it terminates in an item of a different category altogether. The standard objection I have seen is that the episode only helps me if I believe I am having it, and that belief itself needs support, so the chain is one link shorter than the defender admits.

  A second version of the same move, which makes me think they belong together, uses states other than perception: a mathematician says her belief in a lemma is supported not by another belief but by an intuition that it is true; a person says his belief that he is in pain is supported by the pain itself. In these cases the terminator looks less like an episode and more like a standing state with propositional content — it seems to say that things are a certain way without quite being a judgment that they are. I am not sure whether these count as instances of the same strategy or as a different one.

  I have gathered that there is an old worry in this neighborhood involving the phrase "the given," but as I understand it, that worry is about whether non-belief states can be carriers of justification at all, whereas what I am after is the specific maneuver of terminating the regress by shifting categories — treating the last link as a fact about one's situation rather than as something one believes. So, to be clear about what would satisfy me: please tell me which established concepts come closest to this maneuver, how each of them differs from it, and which one fits best; and if none fits cleanly, say so and coin a term, with a definition that settles the boundary cases I mentioned (perceptual episodes, mathematical intuitions, and states like pain) and that marks the maneuver off from both self-justifying foundationalism and from views on which the regress is terminated not by anything in the subject's mind at all but by the reliability of the process that produced the belief. A bare name will not help me; I want the carving. Please answer in American English.
reasoning: |-
  Okay, the user is asking about a specific concept in epistemology related to justifying beliefs. They describe a move where the regress of justification stops not at a self-justifying belief but at a non-doxastic state like perception or intuition. They want to know if there's a name for this, how it differs from similar concepts, and if not, they'd like a new term coined.

  First, I need to recall the trilemma they mentioned: infinite regress, circularity, or foundational beliefs. Their described move avoids these by ending the chain with a non-belief state. The user gives examples: perceptual experiences (seeing a mug), mathematical intuitions, and sensations like pain. 

  The user mentions "the given" but notes it's broader. They want to focus specifically on the category-shift strategy. They also want to distinguish it from self-justifying foundationalism and externalist reliabilism. 

  Looking at possible candidates: 
  - **The Given**: Associated with foundationalism, but the user thinks it's more about whether non-doxastic states can justify at all. The move here is about terminating the regress via category shift. 
  - **Non-Doxastic Foundationalism**: This fits well. It's a type of foundationalism where basic beliefs get justification from non-belief states. But the user might be thinking of a more specific move within this. 
  - **Doxastic vs. Non-Doxastic Justification**: This distinction is about sources, but not exactly the structural move. 
  - **Presentational States**: Russell's term for direct awareness. Close but not commonly used now. 
  - **Phenomenal Conservatism**: Huemer's idea that appearances justify beliefs. This ties in with intuitions and perceptions. 
  - **Minimal Foundationalism**: Alston's version where non-doxastic states justify basic beliefs without those beliefs needing to be infallible. 

  The key differences: This move isn't just about non-doxastic states justifying but about terminating the regress by shifting categories. It's internalist since the subject has access to the justifier. 

  The user's examples: 
  1. Perceptual episodes - direct experiences.
  2. Mathematical intuitions - seemings with propositional content.
  3. Pain states - non-propositional experiences. 

  The move treats these as justifiers without being beliefs. The objection mentioned is that the subject needs to believe they're having the experience, but the move rejects that—the experience itself justifies without requiring a meta-belief. 

  The best fit is **Non-Doxastic Foundationalism**. But to be precise, coining a term might help. **Regress-Terminating Non-Doxastic Grounding (RTNDG)** captures the structural move. Defining it would clarify the boundary cases:

  - **Perception**: Direct sensory experience justifies perceptual beliefs.
  - **Intuition**: Intellectual seemings justify mathematical beliefs.
  - **Pain**: The sensation itself justifies belief in pain without inference.

  This distinguishes it from self-justifying beliefs (no category shift) and reliabilism (external processes not accessed by the subject). 

  The user wants clarity on how this handles the objection. The responder should explain that the move denies the need for a meta-belief—the experience directly justifies. For example, seeing the mug justifies the belief without believing that you're seeing it. But critics argue that without recognizing the experience, it doesn't justify, leading back to the regress. 

  In conclusion, while "Non-Doxastic Foundationalism" is the closest established concept, coining RTNDG as a specific variant addresses the user's need for precision in the structural maneuver.
answer: |-
  Based on your detailed description, the maneuver you're identifying is a specific and sophisticated move within foundationalist epistemology. Below is a conceptual analysis, including the closest established concepts, their differences, and a coined term that precisely captures your structural move.

  ---

  ### **Closest Established Concepts & How They Differ**
  1.  **Non-Doxastic Foundationalism**:
      -   **Fit**: Best established match. It holds that justification for "basic beliefs" originates from non-doxastic (non-belief) mental states (e.g., perceptions, seemings, sensations).
      -   **Difference**: Your focus is narrower—on the *structural termination of the regress* via category shift. Non-doxastic foundationalism is a broader category that includes views where non-doxastic states justify beliefs but may not explicitly frame it as solving the trilemma by avoiding all three horns. Your move emphasizes this as a *dissolution* of the trilemma.

  2.  **The Given (in Classical Foundationalism)**:
      -   **Fit**: Often invoked in similar contexts (e.g., sense-data, direct awareness). Shares the idea that justification starts with non-inferential, non-belief items.
      -   **Difference**: As you note, debates about "the given" (e.g., Sellars' critique) focus on whether non-doxastic states *can* justify beliefs *at all*. Your move presupposes this is possible and highlights the *structural role* in regress termination, making it a specific argumentative strategy *within* defenses of the given.

  3.  **Phenomenal Conservatism** (Huemer):
      -   **Fit**: Claims that "appearances" or "seemings" (e.g., perceptual, intuitive) justify beliefs. Matches your examples of perception/intuition.
      -   **Difference**: This is a *justification principle* ("If it seems to S that P, then S has prima facie justification for P"), not primarily a structural solution to the regress. Your move is about the *architecture of justification chains*, not the epistemic force of seemings.

  4.  **Minimal Foundationalism** (Alston):
      -   **Fit**: Rejects infallible self-justifying beliefs; allows non-doxastic states to justify basic beliefs.
      -   **Difference**: While compatible, minimal foundationalism doesn’t emphasize the *category shift* as the key to dissolving the trilemma. Your move explicitly positions this shift as avoiding *all three* unsatisfactory options.

  5.  **Presentational States** (Russell, early Chisholm):
      -   **Fit**: Direct acquaintance with objects/properties as justifiers. Aligns with your pain/perception cases.
      -   **Difference**: These are often construed as *non-propositional*, whereas your "mathematical intuition" example is propositional. Your move accommodates both, focusing on the structural role.

  ---

  ### **Why No Existing Concept Fits Perfectly**
  -   All above concepts address *aspects* of your move (non-doxastic justifiers, regress termination), but none explicitly define it as **dissolving the trilemma by terminating the chain in a categorically different, non-doxastic item**. Your boundary cases (pain, intuition, perception) also span different mental state types (non-propositional vs. propositional), making standard terms either too broad or too narrow.

  ---

  ### **Coined Term & Definition**
  **Term**: **Regress-Terminating Non-Doxastic Grounding (RTNDG)**  
  **Definition**:  
  > The epistemic maneuver wherein a chain of belief-justification terminates not in a self-justifying belief, circular structure, or infinite regress, but in a *non-doxastic mental state or episode* (e.g., perception, intuition, sensation). This state:
  > 1.  **Belongs to a distinct ontological category** from belief (e.g., an event, a phenomenal state, a seeming),
  > 2.  **Directly provides justification** to the belief it grounds without requiring meta-beliefs about itself,
  > 3.  **Dissolves the Agrippan trilemma** by avoiding all three horns: no brute foundations (it’s not a belief), no circularity (the chain ends), no regress (justification "bottoms out" in a non-doxastic item).

  ---

  ### **Boundary Cases Clarified**
  | **Case**          | **Fits RTNDG?** | **Why/How**                                                                 |
  |-------------------|----------------|-----------------------------------------------------------------------------|
  | **Perception**    | Yes            | The *visual episode* of seeing the mug grounds the belief—no further belief about "I am seeing" is required. |
  | **Intuition**     | Yes            | A mathematical seeming (e.g., "that lemma is obvious") is a propositional-but-non-doxastic state; it justifies the lemma-belief directly. |
  | **Pain**          | Yes            | The phenomenal pain-state itself (not a belief *about* pain) grounds the belief "I am in pain."            |

  ---

  ### **How RTNDG Distinguishes from Key Alternatives**
  -   **Vs. Self-Justifying Foundationalism**:  
      RTNDG denies that *beliefs* can be self-justifying; justification always flows from a non-doxastic source. Self-justifying beliefs are doxastic stopping points—RTNDG’s stopping points are non-doxastic.  
        
  -   **Vs. Reliabilism/Externalism**:  
      RTNDG requires the justifier to be an *internal, accessible mental state* (e.g., you must actually *have* the pain or perception). Reliabilism terminates the regress externally (e.g., the belief was produced by a reliable process), even if the subject is unaware of this.  
        
  -   **Vs. Coherentism**:  
      RTNDG rejects circularity; chains end linearly in non-doxastic items. Coherentism embraces justificatory circles.  
        
  -   **Vs. Infinitism**:  
      RTNDG denies that chains must be infinite; termination is possible via category shift.

  ---

  ### **Response to the Standard Objection**
  The objection ("I need to *believe* I’m having the perceptual episode") is **rejected by RTNDG defenders**. Their claim:  
  - The perceptual episode *itself* (e.g., seeing the mug) justifies the belief "the mug is full," not a belief *about* seeing. Requiring a meta-belief restarts the regress, but RTNDG denies this is necessary—perception is a *direct source* of justification.  
  - **Example**: When you see the mug, the visual experience *constitutes* your reason for believing it’s full. You don’t first need to *believe* "I see a full mug"; the seeing suffices.  

  This is contentious (critics insist experiences only justify if taken as reliable), but RTNDG’s core move is to deny the objection’s premise.

  ---

  ### **Summary**
  - **Best Fit**: **Non-Doxastic Foundationalism** (use this term for broad recognition).  
  - **Precise Term for the Move**: **Regress-Terminating Non-Doxastic Grounding (RTNDG)**.  
  - **Key Innovation**: Dissolves the trilemma by making the terminal justifier a non-doxastic item, accessible internally, without requiring meta-beliefs.  
  - **Boundaries**: Encompasses perception, intuition, and pain by treating them as justifiers distinct from beliefs, while excluding self-justifying beliefs and externalist/reliabilist stops.  

  This framework should equip you to categorize instances of this maneuver and engage critiques directly. If pursuing further research, investigate "non-doxastic justification," "phenomenal conservatism," and "minimal foundationalism" in Alston, Huemer, or Pryor.
