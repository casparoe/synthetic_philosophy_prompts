answer: |-
  ### The Practice, Described
  The target practice in ML research involves justifying novel architectures by demonstrating marginal performance gains (e.g., 0.5–2%) on standardized benchmarks, coupled with a mechanistic narrative (e.g., "attention captures long-range dependencies"). This narrative is accepted without empirical validation of the proposed mechanism at publication time, becoming foundational for subsequent work through citation and conceptual replication.

  ### What It Strictly Presupposes
  Philosophically, this practice minimally presupposes **instrumental knowledge as primary** and **minimal realism about mechanisms**. First, it treats predictive success on benchmarks as the core criterion of epistemic legitimacy, aligning with instrumentalism: models are tools for generating accurate predictions, and "knowledge" resides in their empirical adequacy. The benchmark margin acts as a filter for theories, accepting those that surpass a pragmatic threshold (e.g., statistical significance). Second, it assumes mechanistic narratives are *possible explanations* worth proposing and circulating, implying a weak realism: mechanisms are not mere fictions but hypothetical causal structures that *could* explain performance gains. However, their acceptance hinges on pragmatic virtues (simplicity, coherence with prior work) rather than empirical verification.

  Crucially, it relies on **community-driven provisionalism**: the initial acceptance of the narrative is not a truth claim but a bet on its *heuristic fecundity*. The practice presupposes that follow-up work (ablations, adaptations, applications) will converge on robust mechanisms over time, resolving underdetermination post hoc. This defers epistemic justification to the collective, iterative process of the field.

  ### What It Doesn’t Need
  The practice is compatible with, but does not require, stronger philosophical commitments. It functions smoothly under **constructive empiricism** (van Fraassen), where mechanisms are useful fictions for organizing predictions, or **pragmatism** (e.g., Dewey), where narratives are judged by utility in guiding future research. It also accommodates **robust scientific realism** if mechanisms are later validated, but realism isn’t presupposed initially. Similarly, it can coexist with debates about theoretical virtues: simplicity/fecundity might be seen as truth-conducive (e.g., by abduction-friendly realists) or merely pragmatic (e.g., by instrumentalists), without affecting the practice’s viability. The core only demands that narratives *enable progress* as defined by the field’s goals (e.g., higher benchmarks, new applications).

  ### If We Took Underdetermination Seriously
  Embracing underdetermination would necessitate structural changes:  
  1. **Demand causal validation**: Require ablations, counterfactual probes, or adversarial tests *at submission* to isolate mechanisms.  
  2. **Stress-test generalizability**: Report performance across diverse (out-of-distribution) benchmarks to distinguish robust mechanisms from overfit artifacts.  
  3. **Formalize mechanism testing**: Adopt tools from interpretability (e.g., causal mediation analysis) as standard evidence.  
  4. **Rethink significance**: Replace marginal gains with *causal gaps* (performance delta attributable to specific mechanisms) and stricter statistical thresholds.  
  The "story" would shift from post hoc narrative to testable hypothesis prior to acceptance.

  ### Settled vs. Contested
  **Settled**: Philosophers broadly agree that underdetermination is a genuine challenge (per Duhem-Quine) and that empirical equivalence is possible. Few dispute that non-empirical virtues (simplicity, fecundity) play a role in theory selection.  
  **Contested**: Whether theoretical virtues are truth-conducive (e.g., Psillos’ realism) or merely pragmatic (van Fraassen’s empiricism) is unresolved. The epistemic status of unvalidated mechanisms is hotly debated: realists see deferred validation as rational (Stanford’s "epistemic patience"), while anti-realists (e.g., Stanford’s "problem of unconceived alternatives") argue it masks persistent underdetermination. Your field’s practice sits squarely in this rift: it *assumes* fecundity indicates truth, but this is a contested inference, not consensus.

  ---
  **Key nuance**: The practice implicitly treats *time* as a resolver of underdetermination. Philosophically, this relies on a contentious belief in the *self-correcting* nature of iterative science—a view challenged by historical cases of persistent, unchallenged just-so stories.
