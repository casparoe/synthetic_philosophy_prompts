  ### Defense of the Ex Ante Optimal Policy in the Absent-Minded Driver Problem

  **Core Argument:** The tempting calculation that promises an expected payoff of 3 (or higher) from the driver's perspective at an intersection is flawed because it illicitly uses the *ex ante optimal policy's probabilities* to evaluate a *different policy* (e.g., "continue now, exit later"). This error arises from misapplying conditional probabilities that depend on the chosen policy. When the driver considers deviating from the ex ante optimal policy, they must recompute the conditional probabilities (e.g., the chance of being at the first vs. second intersection) under the *new policy*. Once corrected, the apparent benefit vanishes, and the ex ante optimal policy remains superior from the start. The error is a form of **double-counting evidence about past actions that can no longer be influenced**, while ignoring the causal link between the current action and future outcomes under the new policy.

  #### Step-by-Step Diagnosis of the Tempting Calculation:
  1. **The Setup**:
     - Ex ante optimal policy: Continue at each intersection with probability \( p = \frac{2}{3} \).
     - Expected payoff: \( 4p(1-p) + 1 \cdot p^2 = 4 \cdot \frac{2}{3} \cdot \frac{1}{3} + 1 \cdot \left(\frac{2}{3}\right)^2 = \frac{4}{3} \).

  2. **At an Intersection (Flawed Reasoning)**:
     - **Tempting thought**: "I'm probably at the first intersection (credence \( \frac{2}{3} \)?), so if I continue now and exit at the next one, I’ll get \( \frac{2}{3} \cdot 4 + \frac{1}{3} \cdot 1 = 3 \)."
     - **First error: Incorrect conditional probability**.  
       The credence of being at the first intersection is **not** \( \frac{2}{3} \). Under the ex ante policy (\( p = \frac{2}{3} \)):
       - Probability of being at first intersection: \( 1 \) (always encountered).
       - Probability of being at second intersection: \( p = \frac{2}{3} \) (only if continued at first).
       - Conditional probability (given being at an intersection):  
         \[
         P(\text{first}) = \frac{1}{1 + p} = \frac{1}{1 + \frac{2}{3}} = \frac{3}{5}, \quad P(\text{second}) = \frac{p}{1 + p} = \frac{2}{5}.
         \]
       The tempting calculation uses \( P(\text{first}) = \frac{2}{3} \) (a mistake that inflates the perceived payoff).

  3. **Second Error: Policy Inconsistency**:
     - The tempting calculation assumes the driver can "continue now and exit later." However, due to absent-mindedness, the driver **must use the same action at every intersection**. If they continue now, they will also continue at the next intersection with the same probability (or deterministically, if deviating). The calculation assumes:
       - Continuing now leads to exiting later (i.e., a one-time deviation).
       - But under absent-mindedness, the driver cannot "exit later" as a separate choice; their action now commits them to the same action at all intersections.
     - Thus, the payoff of 4 (if at first and exit later) is illusory. If they continue at the first, they reach the second and face the same decision. Under the ex ante policy, they might continue again (with probability \( p \)) and get 1, not 4.

  4. **Correct At-Intersection Evaluation**:
     - Suppose the driver considers a new policy: "Continue with probability \( q \) at every intersection." The conditional probabilities *must* be recomputed under \( q \):
       \[
       P(\text{first}) = \frac{1}{1 + q}, \quad P(\text{second}) = \frac{q}{1 + q}.
       \]
     - The expected payoff at an intersection under policy \( q \) is:
       \[
       \begin{align*}
       &\quad P(\text{first}) \cdot [q \cdot \text{payoff after continuing} + (1-q) \cdot 0] \\
       &+ P(\text{second}) \cdot [q \cdot 1 + (1-q) \cdot 4] \\
       &= \frac{1}{1+q} \cdot q \cdot [ (1-q) \cdot 4 + q \cdot 1 ] + \frac{q}{1+q} \cdot [q \cdot 1 + (1-q) \cdot 4] \\
       &= \frac{1}{1+q} \cdot q(4 - 3q) + \frac{q}{1+q} \cdot (4 - 3q) \\
       &= \frac{8q - 6q^2}{1+q}.
       \end{align*}
       \]
       Maximizing this gives \( q \approx 0.527 \), yielding a conditional expected payoff of \( \approx 1.67 \). However, this new policy has an **ex ante expected payoff** of \( 4q - 3q^2 \approx 1.27 \), which is **less than \( \frac{4}{3} \approx 1.33 \)**. The tempting calculation confuses conditional and ex ante payoffs.

  5. **The Fatal Flaw**:
     - The \( 3 \) (or \( 1.6 \) with corrected probabilities) is unattainable because it:
       - Uses the ex ante policy’s state probabilities (\( P(\text{first}) = \frac{3}{5} \)) to evaluate a payoff under a different policy (e.g., "always exit later").
       - Ignores that switching policies alters the probability of being at each intersection (e.g., under "always exit at next," \( P(\text{second}) = 0 \), so the payoff is 0 if at first).
     - **General Lesson**: When self-locating uncertainty (e.g., "which intersection am I at?") depends on your policy, you cannot reuse old probabilities to evaluate new actions. The ex ante optimal policy respects the causal link between actions and outcomes across the entire decision tree. Deviations appear beneficial only when conditional probabilities are misapplied—a form of *evidence-counting* that neglects *causal responsibility*.

  ---

  ### Stress Test: Three-Intersection Version
  **Setup**:
  - Exits: 
    - First exit: payoff 0.
    - Second exit: payoff 4.
    - Third exit: payoff 6.
    - Miss all: payoff 1.
  - Driver uses the same continuation probability \( p \) at each intersection.

  **Ex Ante Optimal Policy**:
  - Expected payoff:
    \[
    E = 0 \cdot (1-p) + 4 \cdot p(1-p) + 6 \cdot p^2(1-p) + 1 \cdot p^3 = 4p + 2p^2 - 5p^3.
    \]
  - Maximize \( E \): Derivative \( \frac{dE}{dp} = 4 + 4p - 15p^2 = 0 \) → \( p = \frac{2}{3} \) (valid root).
  - Expected payoff: \( E\left(\frac{2}{3}\right) = 4 \cdot \frac{2}{3} + 2 \cdot \left(\frac{2}{3}\right)^2 - 5 \cdot \left(\frac{2}{3}\right)^3 = \frac{56}{27} \approx 2.074 \).

  **At an Intersection (Naive Calculation)**:
  - Under ex ante policy (\( p = \frac{2}{3} \)), conditional probabilities:
    \[
    P(\text{first}) = \frac{1}{1 + p + p^2} = \frac{9}{19}, \quad P(\text{second}) = \frac{p}{1 + p + p^2} = \frac{6}{19}, \quad P(\text{third}) = \frac{p^2}{1 + p + p^2} = \frac{4}{19}.
    \]
  - **Tempting thought**: "Continue now and exit at the next intersection." Assumed payoffs:
    - If first (prob \( \frac{9}{19} \)) → continue, then exit at second: payoff 4.
    - If second (prob \( \frac{6}{19} \)) → continue, then exit at third: payoff 6.
    - If third (prob \( \frac{4}{19} \)) → continue: payoff 1.
    - Expected payoff: \( \frac{9}{19} \cdot 4 + \frac{6}{19} \cdot 6 + \frac{4}{19} \cdot 1 = \frac{76}{19} = 4 \).

  **Why This Is Wrong**:
  1. **Policy Inconsistency**: The calculation assumes the driver can "exit at the next intersection." But absent-mindedness forces the same action at all intersections. If they continue now, they will likely continue later (under the ex ante policy, with probability \( p = \frac{2}{3} \)), not exit.
  2. **Probability Mismatch**: The conditional probabilities \( \left( \frac{9}{19}, \frac{6}{19}, \frac{4}{19} \right) \) are tied to the ex ante policy \( p = \frac{2}{3} \). If the driver switches to a new policy (e.g., "always continue now, exit later"), the probabilities change:
     - Under "always exit at next," the driver exits at every intersection. Thus:
       - \( P(\text{first}) = 1 \) (always encountered, then exit immediately with payoff 0).
       - \( P(\text{second}) = 0 \), \( P(\text{third}) = 0 \) (never reached).
       - Expected payoff is 0, not 4.
  3. **Correct Evaluation**:
     - If the driver switches to a new policy with continuation probability \( q \), recompute:
       \[
       P(\text{first}) = \frac{1}{1+q+q^2}, \quad P(\text{second}) = \frac{q}{1+q+q^2}, \quad P(\text{third}) = \frac{q^2}{1+q+q^2}.
       \]
     - Expected payoff at intersection under \( q \):
       \[
       \frac{1}{1+q+q^2} \cdot [q \cdot V_2 + (1-q) \cdot 0] + \frac{q}{1+q+q^2} \cdot [q \cdot V_3 + (1-q) \cdot 4] + \frac{q^2}{1+q+q^2} \cdot [q \cdot 1 + (1-q) \cdot 6],
       \]
       where \( V_2, V_3 \) are expected payoffs starting from second/third intersections (dependent on \( q \)). Maximizing this yields a conditional payoff \( > \frac{56}{27} \), but the **ex ante payoff** under this new \( q \) is less than \( \frac{56}{27} \).

  **Diagnosis Holds**: The error persists—using old probabilities to evaluate a new policy—and the ex ante optimal \( p = \frac{2}{3} \) remains unbeatable when properly evaluated from the start. The naive calculation’s 4 is a mirage caused by probability/reality mismatch.

  ---

  ### General Lesson
  The absent-minded driver teaches that **self-locating uncertainty requires consistent policy evaluation**. When your action at an indistinguishable decision node affects the probability of being in that node (e.g., continuing at the first intersection increases the chance of being at the second), you cannot:
  - Treat your current action as mere evidence about past actions (which are fixed).
  - Ignore that changing your policy alters the conditional probabilities.
  - Assume you can deviate locally without global consequences.

  **Implication for Rational Choice**: Commitment to the ex ante optimal policy is essential. Re-optimization at later stages in problems with imperfect recall often leads to time inconsistency and suboptimal outcomes. Rational agents should either precommit or recognize that conditional probabilities are policy-dependent—not exogenous evidence to be "used up" for unilateral gain. This underscores the value of decision rules over act-by-act "rational" deviations in dynamic settings with memory constraints.
