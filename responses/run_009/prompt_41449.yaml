       Therefore, the driver at the intersection might be tempted to switch to p=0.527, but if he does, then the overall expected payoff from the start would be lower than if he had stuck to the ex ante optimal p=2/3.

       The lesson: the driver at the intersection is not the same as the ex ante planner. The driver at the intersection is more likely to be at the first intersection (which has more potential for future gains) than the second. Therefore, he might be more optimistic. But the ex ante planner must consider the entire journey, which includes the possibility of exiting early.

       However, the absent-mindedness constraint requires that the driver must choose the same p at every intersection. The ex ante optimal p=2/3 is chosen to maximize V1. The driver at the intersection, if given the chance to choose a new p (that will apply from now on at every intersection) would choose p≈0.527 to maximize f(p). But then the ex ante expected payoff V1 for p=0.527 is lower than for p=2/3.

       So if the driver is able to reoptimize at the intersection, he might choose a suboptimal plan from the ex ante perspective. This is an example of time inconsistency.

       Therefore, to achieve the ex ante optimum, the driver must commit to the plan in advance and not reoptimize at the intersection.

     In conclusion, the defense of the ex ante optimal policy is that reoptimizing at the intersection leads to a policy that has a lower ex ante expected payoff. The driver should stick to the ex ante optimal policy because it is designed to maximize the overall expected payoff from the start, and any deviation (even though it might appear beneficial from the intersection perspective) would harm the overall plan.

     The general lesson is that in dynamic decision problems with imperfect recall and self-locating uncertainty, reoptimization at later stages can lead to time inconsistency. Commitment to the ex ante optimal plan is crucial.
