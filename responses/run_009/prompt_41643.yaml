answer: |-
  ## The Constant Sum Speaks

  I am the sum these two **envelope**s hold,
  A fixed amount no anxious hand can **switch**.
  One pouch contains what you might call the **double**,
  The other holds its necessary **half**.
  Observe the choice: whichever one you **keep**,
  The restless mind begins to **expect** gain.

  The switching argument, you **expect**, proves
  That gain awaits beyond your chosen **envelope**.
  Why then, it asks, should you resolve to **keep**
  The one you hold? You ought to swiftly **switch**!
  For half the time, you’ll find the hidden **double**,
  And half the time, you’ll sadly find the **half**.

  But logic twists! For finding just a **half**
  Seems loss, while finding more seems gain—you **expect**
  A quarter more on average! Doubled **double**
  Seems proof enough against the first **envelope**.
  So switch you do, obeying that same **switch**
  Advice again. Why ever should you **keep**?

  The restless hand will never cease or **keep**,
  But trade anew, believing that the **half**
  Or double waits beyond. Each time you **switch**,
  You feed the flawed desire to **expect**
  More from the constant sum each **envelope**
  Conceals—though one must be the **double**.

  But hear me, constant, total, final **double**
  Of the lesser sum! I watch the hands not **keep**,
  But pass me back and forth. Each **envelope**
  Claims half of me, or more—a hopeful **half**
  Belief that fuels the urge to **expect**
  Endless increase with every frantic **switch**.

  No net gain comes from endless trade and **switch**.
  This ceaseless hope to find the greater **double**
  Is born of error in the mind’s **expect**-
  ation. The flaw lies deep: you cannot **keep**
  "The amount held" as fixed when **half** or twice
  Defines the states within each **envelope**.

  *You treat one sum as fixed within **envelope**,
  Urged by that siren call to always **switch**,
  Believing **double** chance as **half** chance too—a flawed **expect**-
  ation birthed when states conflate. So **keep**
  This truth: my constant whole defies your **half**-truths locked in ceaseless trade.*
