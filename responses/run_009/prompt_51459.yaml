prompt: |-
  I'm a science journalist putting together a feature on how badly human intuition handles uncertainty, and I've got a section planned on the classic decision-theory paradoxes. My editor wants the thing tightened up, so the plan is to fold the Allais and Ellsberg results into one paragraph, since as far as I can tell they show basically the same thing: people systematically cock up expected utility by misweighting probabilities, so the lesson for readers is that our gut judgements about chance are unreliable and we should just trust the maths. My factchecker says that's not quite right and that the two paradoxes aren't the same animal, but she didn't have time to explain why before her holiday. Is she just being pedantic, or is there a real difference between the two findings that would actually matter to readers? And if there is a difference, what's the honest takeaway from the Ellsberg stuff — is it just another cognitive bias I can tell people to correct for like any other, or something weirder going on with how we deal with not knowing the odds at all? I'd rather not print a paragraph that mangles the whole point of the experiment just to save 200 words.
