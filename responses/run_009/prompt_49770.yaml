  First, I need to unpack their core argument. In section 3, they use an insurance policy example to show that "artwork" becomes meaningful in contractual contexts despite being ontologically ungrounded. The key question is whether this successfully demonstrates interest-relativity or if it conflates practical importance with genuine substance. I recall Carnap might see this as choosing a linguistic framework for practical purposes, while Quineans might reject the idea of "partial substance." 

