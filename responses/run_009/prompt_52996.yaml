answer: |-
  Here is a 10-question diagnostic quiz designed to sort readers into one of the five views on supererogation based on their intuitive responses to concrete cases. Each question includes a scenario and answer options phrased in everyday language. The scoring key follows, mapping answer patterns to the five views and addressing limitations.

  ---

  ### **Quiz: What’s Your View on Going "Above and Beyond"?**  
  **Instructions**: For each scenario, select the answer that best reflects your moral intuition. Don’t overthink—go with your gut.

  1. **Costless Benevolence**  
     You’re walking past a shallow pond and see a child drowning. You’re an excellent swimmer and could save them instantly with no risk, cost, or inconvenience to yourself. You don’t act, and the child dies.  
     - A. You did nothing wrong.  
     - B. You acted wrongly.  

  2. **Rescue with Low Cost**  
     You see a child drowning in a pond. Saving them would ruin your expensive shoes (which you can easily replace), but nothing more. You don’t act, and the child dies.  
     - A. You did nothing wrong.  
     - B. You acted wrongly.  

  3. **Rescue with Moderate Cost**  
     You see a child drowning in a pond. Saving them would cause you to miss a crucial job interview, setting your career back 1–2 years. You don’t act, and the child dies.  
     - A. You did nothing wrong.  
     - B. You acted wrongly.  

  4. **Rescue with High Cost**  
     You see a child drowning in a pond. Saving them would almost certainly kill you due to a hidden current. You don’t act, and the child dies.  
     - A. You did nothing wrong.  
     - B. You acted wrongly.  

  5. **Trivial Omissions (Series)**  
     Every day for a month, you pass a hungry homeless person. Each day, you could give them $1 (which you wouldn’t miss) for food. You never give anything. By month’s end, they are severely malnourished.  
     - A. You did nothing wrong on any day; each omission was fine.  
     - B. Each omission was fine, but never helping at all was wrong.  
     - C. You acted wrongly every day by not giving $1.  

  6. **Promise to Do a Supererogatory Act**  
     You promise a friend you’ll run into a mildly burning building to save their cat—a risky but survivable act. Later, you back out. The cat dies, and your friend is devastated.  
     - A. You broke a promise and acted wrongly, just like breaking any promise.  
     - B. You broke a promise, but it’s less serious because the act was heroic.  
     - C. You did nothing wrong; you shouldn’t have promised something so risky.  

  7. **Declining with Moral Remainder**  
     A stranger needs a kidney. Donating would save their life, and you’d live normally afterward, but surgery/recovery is painful and inconvenient. You decline, and they die. You feel no regret.  
     - A. You did nothing wrong, and no apology or regret is owed.  
     - B. You did nothing wrong, but you should apologize or feel regret.  
     - C. You acted wrongly by not donating.  

  8. **Personal Projects vs. Greater Good**  
     You can spend a year creating a masterpiece (your life’s dream) or working for a charity that would save 100 lives. You choose your masterpiece.  
     - A. You acted wrongly; saving lives matters more.  
     - B. You did nothing wrong; you may prioritize your own projects.  
     - C. You did nothing wrong; art also helps society.  

  9. **Career Choice with Differential Impact**  
     You can become a doctor (saving many lives) or a teacher (positively impacting fewer lives). You choose teaching because you prefer it.  
     - A. You did nothing wrong; teaching is valuable and you’re allowed to choose.  
     - B. You acted wrongly; you should’ve chosen the career that helps most.  
     - C. You did nothing wrong; teaching does "enough" good.  

  10. **Giving Beyond Minimum**  
      You’re wealthy and donate 10% of your income to charity—enough to save lives and far more than most give. You could donate 50% to save more lives, but you don’t.  
      - A. You did nothing wrong; you’re already doing more than needed.  
      - B. You acted wrongly; you should donate more.  
      - C. You did nothing wrong, but donating more would be admirable.  

  ---

  ### **Scoring Key**  
  Tally your answers and match the pattern to one of the five views below. Patterns are based on dominant alignments in ethical theory.  

  1. **Classical Three-Category View** (Supererogation is a distinct category):  
     - **Answers**: 1B, 2B, 3A, 4A, 5B, 6A, 7B, 8B, 9A, 10A or 10C  
     - **Why?** You see clear obligations when costs are low (1B, 2B) but not when costs are moderate/high (3A, 4A). You recognize cumulative wrongs (5B) and moral remainders (7B), and promises bind strictly (6A). Going beyond duty (8B, 9A, 10A/C) is optional but praiseworthy.  

  2. **Maximizing Consequentialism** (No supererogation—only required vs. wrong):  
     - **Answers**: 1B, 2B, 3B, 4A, 5C, 6A, 7C, 8A, 9B, 10B  
     - **Why?** You require maximizing good at acceptable costs: costless/moderate-cost help is obligatory (1B, 2B, 3B), but high costs excuse (4A). Small omissions are wrong (5C), and moral remainders don’t exist—only right/wrong (7C). Self-interest rarely justifies less good (8A, 9B, 10B).  

  3. **Satisficing Consequentialism** (Required only to do "enough"):  
     - **Answers**: 1B, 2B, 3A, 4A, 5B, 6A or 6B, 7A, 8B or 8C, 9C, 10A  
     - **Why?** You require helping when easy (1B, 2B) but not when costly (3A, 4A). Overall failure to help is wrong (5B), but no regret is owed for optional acts (7A). You emphasize "doing enough" (9C, 10A), allowing self-interest (8B/C).  

  4. **Latitude View** (Wide duties with discretion):  
     - **Answers**: 1B, 2B, 3A, 4A, 5B, 6A, 7A, 8B, 9A, 10C  
     - **Why?** Duties have a flexible minimum: low-cost help is required (1B, 2B), but higher costs allow discretion (3A, 4A). Never helping is wrong (5B), but no regret is due for optional acts (7A). Beyond-minimum acts are praiseworthy (10C), and promises bind (6A).  

  5. **Agent-Centered Prerogative View** (Permission to weight self-interest):  
     - **Answers**: 1B, 2B, 3A, 4A, 5A, 6B, 7A, 8B, 9A, 10A  
     - **Why?** You require costless/low-cost help (1B, 2B) but permit self-prioritization otherwise (3A, 4A, 8B, 9A, 10A). Small omissions are always optional (5A), and supererogatory promises create weaker obligations (6B). No regret is owed (7A).  

  ---

  ### **Limitations & Notes**  
  1. **Unreliable Separations**:  
     - **Satisficing (3) vs. Prerogative (5)**: These often agree (e.g., 1B, 2B, 3A, 4A, 7A, 8B, 9A). To separate them, add a case testing whether *doing less than "enough"* is permitted (e.g., "You do minimal charity work but could easily do more without hardship. Is this wrong?"). Prerogative says "no" (self-interest justifies); Satisficing says "yes" (you must meet a threshold).  
     - **Classical (1) vs. Latitude (4)**: These overlap on many answers (e.g., 1B, 2B, 3A, 4A, 5B, 6A, 8B, 9A). To separate, add a case testing *moral residue* (e.g., "After declining to help, do you owe regret even if blameless?"). Classical says "yes" (7B); Latitude says "no" (7A).  

  2. **Unaccommodated Patterns**:  
     - **Example**: 1A (costless omission is fine), 2A, 3A, 4A, 5A, 6C, 7A, 8B, 9A, 10A.  
     - **Verdict**: This pattern (costless help is optional) is *unattractive but coherent*. It resembles extreme libertarianism but isn’t covered by the five views, as all require costless benevolence (1B).  
     - **Other Misfits**: If you have 4B (high-cost rescue required), this is *unexplored in mainstream literature*—it implies an extreme demand rarely defended.  

  This quiz prioritizes real-world intuitions over theory-laden terms. For deeper analysis, consult sources on supererogation (e.g., J.O. Urmson, David Heyd) or run the suggested separation cases!
