prompt: |-
  I run a problem-solving seminar for second-year math undergrads — strong students, but all they've seen is induction and basic order relations, no axiom of choice, no cardinals. Next week I have to teach Zorn's lemma in fifty minutes, whiteboard only. Don't explain it to me; plan how I should teach it. I want the carrying example to be the order-extension theorem — every partial order can be extended to a linear order — because I want them to see that checking the union of a chain of partial orders is still a partial order is where all the actual work lives. Tell me why this example carries that load and why the standard "every vector space has a basis" example doesn't, and whether that's the right call for this audience at all. Work out the order the pieces have to go in — especially where the maximal-vs-maximum distinction has to land, and whether I should build the finite intuition of "just keep adding elements until you can't" and then deliberately break it, or never build it in the first place (which one, and why). List the misconceptions they'll predictably form — my guess is they'll silently drop the upper-bound-for-every-chain condition and hear it as "every poset has a maximal element" — and say exactly where in the sequence each one should be headed off rather than cleaned up later. Also flag what I should openly refuse to touch at this level, equivalence with the axiom of choice and whatever else, and tell them so. End with one question I can ask to check it landed — not a proof for them to do, something that shows whether they can point at where the work is. You're a lecturer who's taught this material a dozen times; brainstorm the dependency structure before committing to a plan, and lead with the bottom line in your first sentence, then give the reasoning, no preamble.
reasoning: |-
  Okay, the user is a math lecturer preparing a 50-minute Zorn's Lemma seminar for strong second-year undergrads. Their unique angle: using the order-extension theorem (every partial order extends to a linear order) as the central example instead of the usual vector space basis proof. They want to highlight how verifying that the union of chains remains a partial order is where the "work" happens—and why the basis example obscures this. 

  Hmm, their request is hyper-specific about pedagogical sequencing: when to introduce maximal vs maximum elements, how to handle inevitable misconceptions (like students ignoring chain conditions), and what advanced topics to explicitly avoid. They're clearly an experienced instructor—they've predicted student pitfalls with precision ("they'll silently drop the upper-bound condition"). 

  First, why the order-extension theorem carries the load better than vector spaces:  
  - **Union verification is explicit**: Checking antisymmetry for the union of chain-compatible partial orders requires actual work (if a≤b and b≤a in the union, students must trace the finite path where these relations were added).  
  - **Vector spaces hide this**: For bases, the union of a chain of independent sets is trivially independent—no "work" visible. The real work (extending to a basis via algebraic closure) is buried.  
  - **Concreteness**: Partial orders are within their comfort zone (they know induction/order relations). Bases require abstract vector space intuition they might not share equally.  

  Now, the structural landmines:  
  - **Maximal vs maximum**: Must define *before* stating Zorn's Lemma, using a non-total order example (e.g., subsets of {1,2} ordered by inclusion—{1} and {2} are maximal but no maximum). Place this right after poset review.  
  - **"Keep adding" intuition**: *Deliberately break it*. First show a naive "greedy" extension fails (e.g., a poset where adding comparabilities forces contradictions unless done globally). This creates cognitive tension—*then* introduce Zorn as the fix.  
  - **Deadly misconception**: "Every poset has a maximal element." Preempt by:  
    1. Before stating Zorn, show a chain without upper bound (e.g., ℤ with usual order).  
    2. When defining chains, stress that the upper bound must exist *in the poset itself*.  
    3. During the order-extension proof, pause when taking the union of the chain and ask: "Why must this union *be in our poset collection*?" (Answer: because Zorn requires closedness under chains).  

  What to avoid:  
  - **Equivalence with AC**: Explicitly say: "We take Zorn as an axiom; connections to choice are advanced and won't be covered."  
  - **Cardinals/well-ordering**: Cut entirely.  

  Final checkpoint question:  
  *"In the order-extension proof, why wasn’t the union of our chain of partial orders automatically antisymmetric? Where did we need the chain-hypothesis?"*  
  (Answer: Antisymmetry broke if a≤b and b≤a were added at *different* partial orders in the chain; chaining guarantees they coexist in some larger partial order where antisymmetry applies.)  

  **Sequence breakdown**:  
  1. (3 min) Review partial orders (define poset, suborder, extension).  
  2. (7 min) Maximal vs maximum: visual examples, break "greedy" extension.  
  3. (5 min) Chains and upper bounds: emphasize upper bound must be in poset. Show ℤ has no maximal element.  
  4. (5 min) State Zorn's Lemma verbatim. Stress "every chain has upper bound" and "maximal element ≠ maximum."  
  5. (20 min) Order-extension proof:  
     - Define set S of partial orders extending the original.  
     - Show S is closed under unions of chains (here, make them *do the work*: check reflexivity/transitivity/antisymmetry for the union).  
     - Apply Zorn → maximal element. Prove it's total.  
  6. (5 min) Explicitly list avoided topics (AC equivalence).  
  7. (5 min) Checkpoint question + recap.  

  **Why this flows**:  
  - Misconceptions are preempted where they naturally arise (e.g., ℤ example *before* stating Zorn).  
  - The "work" in the chain-union verification is forced into focus during the proof.  
  - Breaking the "greedy" method early justifies Zorn's complexity.  

  **Risk**: The antisymmetry check might run long. Mitigation: Sketch the path-tracking argument ("a≤b was added at extension Pᵢ, b≤a at Pⱼ; since Pᵢ, Pⱼ live in a common larger extension Pₖ, antisymmetry in Pₖ forces a=b") but don't belabor formalities.  

  Bottom line: The order-extension theorem is the right call—it turns Zorn's machinery from a black box into a transparent tool.
answer: |-
  ### Bottom Line
  Use the order-extension theorem as your central example, explicitly demonstrate why the union of a chain of partial orders remains a partial order (highlighting antisymmetry verification as "the work"), and deliberately break the naive "keep adding elements" intuition early. Avoid AC equivalence and cardinals entirely.

  ### Why Order-Extension Carries the Load (and Basis Doesn't)
  - **Order-Extension**:  
    Verifying that the union of a chain of partial orders is antisymmetric requires tracing dependencies across extensions: If \(a \leq b\) and \(b \leq a\) hold in the union, they must have been added in some common extension in the chain, forcing \(a = b\). This is **visible work** requiring finite steps (crucial for this audience).  
  - **Vector Space Basis**:  
    The union of a chain of linearly independent sets is trivially linearly independent—no analogous work is needed. The actual work (extending to a spanning set) hides in algebraic closure, which is abstract and irrelevant to Zorn's mechanics.  

  ### Sequence of Pieces (50-Minute Plan)
  1. **Review & Motivate Partial Orders (5 min)**  
     - Define poset, suborder, extension.  
     - Example: Subset inclusion on \(\mathcal{P}(\{1,2,3\})\) vs. linear order on the same set.  
     - **Goal**: Convince them that extending partial orders is non-trivial.  

  2. **Break Naive Intuition (5 min)**  
     - **Pitfall**: Students think "just add comparabilities until done."  
     - **Counterexample**: Poset \(X = \{a,b,c\}\) with \(a \leq b\) only.  
       - Greedily add \(c \leq a\)? Now if you try \(b \leq c\), transitivity forces \(b \leq a\)—contradiction.  
     - **Key point**: Choices have global consequences. Need a *systematic* method.  

  3. **Maximal vs. Maximum (5 min)**  
     - **Define**:  
       - *Maximal*: No strictly larger element (local optimum).  
       - *Maximum*: \(\geq\) all elements (global optimum).  
     - **Example**: \(\mathbb{N}\) with divisibility. Prime numbers are maximal but not maximum.  
     - **Stress**: Zorn gives maximal elements, **not** maximum.  

  4. **Zorn's Lemma Statement (5 min)**  
     - **Verbatim**: "If every chain in a poset \((P,\leq)\) has an upper bound in \(P\), then \(P\) has a maximal element."  
     - **Emphasize conditions**:  
       - Chain: Totally ordered subset.  
       - Upper bound: Must be **in** \(P\) (show \(\mathbb{Z}\) has chains with no upper bound in \(\mathbb{Z}\)).  
     - **Misconception preemption**: State explicitly: "This is **not** 'every poset has a maximal element' (counterexample: \(\mathbb{Z}\)).

  5. **Order-Extension Proof (20 min)**  
     - **Setup**:  
       - Let \((X,\preceq)\) be a partial order.  
       - Define \(S = \{ \text{partial orders } \leq \text{ on } X \mid \leq \text{ extends } \preceq \}\), ordered by inclusion.  
     - **Chain verification**: Take a chain \(\mathcal{C}\) in \(S\); show \(\leq_{\mathcal{C}} := \bigcup \mathcal{C}\) is a partial order.  
       - Reflexivity/Transitivity: Easy.  
       - **Antisymmetry (The Work)**:  
         - Suppose \(a \leq_{\mathcal{C}} b\) and \(b \leq_{\mathcal{C}} a\).  
         - Then \(\exists \leq_1, \leq_2 \, \in \mathcal{C}\) with \(a \leq_1 b\), \(b \leq_2 a\).  
         - Since \(\mathcal{C}\) is a chain, \(\leq_1 \subseteq \leq_2\) (or vice versa). Say \(\leq_1 \subseteq \leq_2\).  
         - Then \(a \leq_2 b\) and \(b \leq_2 a\), so \(a = b\) by antisymmetry of \(\leq_2\).  
     - **Apply Zorn**: \(\leq_{\mathcal{C}}\) is an upper bound for \(\mathcal{C}\).  
       - Zorn gives a maximal element \(\leq^*\) in \(S\).  
       - **Prove totality**: If \(x,y\) incomparable under \(\leq^*\), add \(x \leq y\) and take transitive closure—contradicts maximality.  

  6. **What to Avoid (2 min)**  
     - "We take Zorn's Lemma as an axiom. Do **not** worry about:  
       - Why it's equivalent to the Axiom of Choice.  
       - Cardinals, well-ordering, or other applications today."  

  7. **Checkpoint Question (3 min)**  
     - **Not a proof**: "In the order-extension proof, why did we need the chain condition to verify antisymmetry for the union? What could go wrong without it?"  
     - **Answer**: Without a chain, \(a \leq_1 b\) and \(b \leq_2 a\) might never coexist in a single partial order, so antisymmetry isn't enforced. The chain guarantees a common extension where both relations live.  

  ### Predictable Misconceptions & Preemption
  1. **"Every poset has a maximal element"**  
     - **Preempt**: Before stating Zorn, show \(\mathbb{Z}\) has no maximal element (no upper bound for chains).  
     - **Location**: During upper-bound discussion (Step 4).  

  2. **Silently dropping "upper bound for every chain"**  
     - **Preempt**: When stating Zorn, write the condition in red. Immediately contrast with \(\mathbb{Z}\).  
     - **Location**: Step 4 (statement) and Step 5 (apply to \(\mathbb{Z}\) first).  

  3. **Maximal = Maximum**  
     - **Preempt**: Define with visual examples (subset lattice). Ask: "Is there a biggest prime?"  
     - **Location**: Step 3 (before Zorn).  

  4. **Unions of chains are automatically partial orders**  
     - **Preempt**: Make them do antisymmetry explicitly. Ask: "Why isn’t this obvious?"  
     - **Location**: Step 5 (chain verification).  

  ### Why This Sequence Works
  - **Dependency Flow**: Naive intuition broken early (Step 2) motivates Zorn. Key definitions (maximal, chain) precede the statement (Steps 3–4). Proof (Step 5) isolates the technical work where you want it.  
  - **Audience Fit**: Uses concrete relations (no vector space abstraction). Work is finitistic—no cardinal arithmetic or algebraic closure.  
  - **Time**: 45 min for content + 5 min buffer for questions.  

  **Final Tip**: During the antisymmetry verification, dramatize the "aha!"—students will feel the chain hypothesis in action. This is where Zorn earns its keep.
