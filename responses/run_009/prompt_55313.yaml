prompt: |-
  My friend and I spent a long evening arguing about whether our city should adopt a pretrial risk-assessment algorithm, and by the end it was clear we were arguing past each other: she was demanding that the tool's errors fall equally on all demographic groups, I kept insisting only that its scores mean the same thing for everyone, and neither of us ever laid out what an adequate fairness requirement for this setting would even have to accomplish. Before we argue about any particular algorithm again, I want the specification. Assume the setting is concrete: the tool scores arrestees for pretrial release, the outcome it is trained on is re-arrest rather than re-offense, and re-arrest rates are known to differ across neighborhoods partly for reasons uncorrelated with actual offending. Write the desiderata as exactly five numbered requirements, each a sentence or two, with the motivating case or consideration behind it, a mark of whether you take it to be non-negotiable or a preference of one camp, and an indication of whether it can be jointly satisfied with your other requirements when true re-offense base rates differ across groups. At least one requirement must concern the gap between the label we can measure and the quantity we actually care about. If you believe your five are jointly satisfiable, say so within the items and defend it; no introduction or conclusion beyond the five.
reasoning: |-
  Okay, the user and their friend had a heated debate about pretrial risk-assessment algorithms but ended up talking past each other. The user wants a clear set of five requirements for fairness in these algorithms before they dive into another argument. They specified the setting: the algorithm predicts re-arrest (not actual re-offense), and re-arrest rates vary across neighborhoods due to factors unrelated to actual crime.

  First, I need to understand the key issues here. The main conflict between the user and their friend was about different fairness metrics: one wanted errors to be equal across groups, the other wanted the scores to mean the same thing. But deeper, there's a gap between the measurable outcome (re-arrest) and the actual goal (preventing re-offense). Also, differing base rates in re-arrest due to biased policing complicate fairness.

  The user wants five numbered requirements, each with a motivation, negotiability status, and compatibility across groups. One must address the label vs. care gap. They also need to know if these can be jointly satisfied when true re-offense rates differ.

  Starting with the label gap. Requirement 1 should tackle that. The algorithm uses re-arrest data, but we care about re-offense. So, the algorithm must acknowledge that re-arrest isn't a perfect proxy. This is non-negotiable because using a biased label without transparency is fundamentally flawed.

  Next, predictive parity. The user insisted scores mean the same for everyone, which is about calibration. If someone has a 10% score, it should mean 10% risk regardless of group. But if re-arrest rates differ due to policing bias, calibration might require the algorithm to adjust for that. This is a preference but important for individual fairness.

  Then, equal error rates. The friend wanted errors to fall equally. So, Requirement 3 would be about balancing false positives and negatives across groups. But if actual re-offense rates differ, enforcing equal errors might force the algorithm to be less accurate. This is negotiable, a preference of the friend's camp.

  Requirement 4 needs to address the limitations of the model. The algorithm can't solve systemic issues like biased policing. It's crucial to state that the tool is only a support, not a solution. Non-negotiable because over-reliance on tech without addressing root causes is harmful.

  Lastly, ongoing validation. Since the environment changes, continuous monitoring is essential. Non-negotiable to catch drift and maintain fairness over time.

  Now, joint satisfiability. If true re-offense rates differ, calibration (R2) and error equality (R3) conflict. But R3 is negotiable, so they can prioritize R2. Also, R1's transparency allows stakeholders to interpret scores in context. R4 and R5 support the framework. So, by treating R3 as a preference, the others can be satisfied together. Need to ensure each requirement clearly states its negotiability and compatibility.
answer: |-
  Here are five numbered requirements for pretrial risk-assessment algorithm fairness in your specified setting:

  1.  **Transparent Acknowledgment of Label-Outcome Gap:** The algorithm's documentation and deployment must explicitly state that "re-arrest" is an imperfect proxy for "re-offense," acknowledging that disparities in policing practices (e.g., surveillance intensity, enforcement priorities, officer discretion) across neighborhoods mean re-arrest rates do not solely reflect underlying offending behavior. **Motivation:** Using re-arrest as the target label risks encoding and amplifying existing policing biases into the algorithm's predictions, mistaking surveillance differences for true risk differences. **Non-negotiable. Compatibility:** Crucial for interpreting scores correctly across groups, especially when true re-offense base rates differ. Does not conflict with other requirements; it's a foundational truth-in-advertising requirement.

  2.  **Conditional Calibration (Predictive Parity):** For any predicted risk score S, the proportion of individuals who are subsequently re-arrested should be approximately equal to S, and this should hold true when conditioned on any protected demographic group (e.g., neighborhood). **Motivation:** This ensures the score means the same thing for everyone; a 20% score implies a 20% estimated re-arrest risk regardless of group, satisfying your core demand for score interpretability. It promotes individual fairness within groups. **Preference (Your camp). Compatibility:** Can conflict with Requirement 3 if the *measured* re-arrest base rates differ significantly across groups (even if true re-offense differs or doesn't). Satisfiable with other requirements *if* the algorithm is perfectly calibrated per group, though this may require group-specific modeling or thresholds.

  3.  **Balanced Error Rates (or Specified Trade-off):** The rates of false positives (low-risk scored as high) and false negatives (high-risk scored as low) should be approximately equal across protected demographic groups, OR the jurisdiction must explicitly define and justify a specific, equitable trade-off policy between these error types for each group if perfect balance is impossible. **Motivation:** This addresses your friend's demand that the *harms* of misclassification (unnecessary detention vs. avoidable re-arrest) fall equitably across groups, rather than disproportionately burdening one group. **Preference (Friend's camp). Compatibility:** Often mathematically incompatible with Requirement 2 (Conditional Calibration) when the *measured* re-arrest base rates differ across groups. Satisfiable with other requirements *only* if base rates are equal *or* if the jurisdiction consciously accepts deviations from calibration to achieve balanced errors under their defined trade-off policy.

  4.  **Contextual Interpretation Mandate:** Judges must be required to consider the algorithm's score within the specific context of the defendant's circumstances (employment, ties to community, alleged offense details) *and* the known limitations regarding policing disparities in the defendant's neighborhood (as per Requirement 1). The algorithm's output cannot be the sole or determinative factor. **Motivation:** Mitigates the risks of over-reliance on a potentially biased score and the label-outcome gap. Ensures human judgment accounts for systemic factors the algorithm cannot fully capture or adjust for. **Non-negotiable. Compatibility:** Compatible with all requirements. It explicitly addresses the limitations inherent in Requirements 1, 2, and 3, making their combined application more robust and just. Doesn't solve base rate differences but forces their consideration.

  5.  **Continuous Performance Monitoring & Validation:** The algorithm's performance (accuracy, calibration, error rates) and impact (release decisions, outcomes by group) must be rigorously monitored continuously across all relevant demographic groups. Significant disparities identified in Requirements 2 or 3, or evidence of the label-outcome gap (Req 1) invalidating predictions, must trigger formal review and potential recalibration, retraining, or discontinuation. **Motivation:** Ensures the algorithm doesn't degrade over time or under changing conditions. Provides accountability and a mechanism to detect and correct unfairness or unintended consequences stemming from the label-outcome gap or base rate differences. **Non-negotiable. Compatibility:** Essential for maintaining the integrity of Requirements 1-4 over time. Compatible with all, as it provides the feedback loop needed to assess and potentially achieve them, even if true re-offense base rates differ.

  **Joint Satisfiability Defense:** Requirements 1, 4, and 5 are non-negotiable and compatible. Requirements 2 (Calibration) and 3 (Balanced Errors) represent distinct, often competing fairness preferences. Joint satisfaction of Req 2 and Req 3 is generally **impossible** when *measured* re-arrest base rates differ significantly across groups (a likely scenario given policing disparities). *However*, the *set* is satisfiable if the jurisdiction:
  *   Prioritizes Requirement 2 (Calibration) for score interpretability *or* explicitly defines an equitable trade-off policy satisfying Requirement 3.
  *   Uses Requirement 1 to inform interpretation and Requirement 4 to mandate contextual human judgment.
  *   Employs Requirement 5 to continuously monitor and adapt.
  This framework forces explicit choices about the fairness-efficiency trade-off while grounding the tool in reality (Req 1) and human oversight (Req 4/5).
