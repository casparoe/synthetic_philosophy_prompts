prompt: |-
  I'm a journalist who covers science and ideas, and I'm preparing a piece on the limits of computation. A popular history of computing I'm reading puts the story like this: Turing established in his 1936 paper that everything mathematically computable is computable by his machines, so the Church–Turing thesis is effectively a theorem rather than a conjecture; since the brain is a physical system, its operations must likewise be Turing-computable, which makes human-level machine intelligence an engineering problem in principle; and the same theorem is why we can be confident that quantum computers, however fast, cannot compute anything a classical machine cannot. Separately, a podcast guest I'm fact-checking before publication insists the thesis has been refuted by proposals for analog devices that exploit infinite precision to settle the halting problem, and that the thesis's defenders only preserve it by defining "computable" as Turing-computable, which would render it empty. Before I go to print: audit both accounts. Which claims would a philosopher of computer science accept, which are common simplifications, and which are simply wrong — and does the "engineering problem" conclusion follow from whichever parts survive? I'd especially like your view on the definitional charge: is there a reading under which the thesis has substantive content rather than being true by stipulation, and what kinds of consideration — formal, empirical, or conceptual — could genuinely bear on it? Note where each account gets a conclusion right for the wrong reason, if that happens. Don't be falsely balanced: tell me where you'd put your money. But also tell me what would move you off that verdict, and where in the audit you think you are most likely to have gone wrong. Structure your reply as a prose audit first, followed by a JSON summary with the following schema: "claims", a list of objects each containing "claim" (a short paraphrase), "verdict" ("accurate", "simplification", or "wrong"), "note" (one or two sentences of justification), and "confidence" ("high", "medium", or "low"); "engineering_conclusion_follows" (a boolean with a one-sentence rationale embedded in the note field of that entry, plus a top-level "conclusion_note"); and "would_change_my_mind", a string identifying the single consideration most likely to overturn your overall assessment.
reasoning: |-
  We are auditing two accounts:
   Account A (from the popular history):
     1. Turing established that everything mathematically computable is computable by his machines → Church-Turing thesis is effectively a theorem.
     2. Since the brain is a physical system, it must be Turing-computable → human-level machine intelligence is an engineering problem in principle.
     3. Quantum computers, however fast, cannot compute anything beyond classical machines (because of the same theorem).

   Account B (from the podcast guest):
     1. The Church-Turing thesis has been refuted by proposals for analog devices that exploit infinite precision to settle the halting problem.
     2. The thesis is preserved only by defining "computable" as Turing-computable, rendering it empty.

   We are to:
     - Identify which claims a philosopher of computer science would accept, which are simplifications, and which are wrong.
     - Audit the definitional charge: is there a reading under which the thesis has substantive content?
     - Evaluate whether the "engineering problem" conclusion follows.
     - Note where an account gets a conclusion right for the wrong reason.

   Structure:
     - Prose audit first, then JSON summary.

   Let's break down.

   ### Prose Audit:

   1. **Account A Claims:**

      a. *Claim 1: Turing established that everything mathematically computable is computable by his machines, so the Church-Turing thesis is effectively a theorem.*

          This is a simplification. In his 1936 paper, Turing defined what we now call Turing machines and argued that they capture the intuitive notion of computability. However, the Church-Turing thesis (CTT) is a hypothesis about the equivalence of this formal model with the intuitive notion of effective calculability. It is not a theorem because it ties a formal concept to an informal one. The thesis is supported by the equivalence of multiple independent models (lambda calculus, recursive functions, etc.), but it remains a thesis because we cannot prove that there isn't some effective method that falls outside these models. So, it's not a theorem; it's a foundational hypothesis.

      b. *Claim 2: Since the brain is a physical system, its operations must be Turing-computable, making human-level machine intelligence an engineering problem in principle.*

          This is contentious and not a direct consequence of the CTT. The CTT says that any effectively calculable function can be computed by a Turing machine. But whether the brain's operations are effectively calculable is an empirical question. Some philosophers (like proponents of computationalism) accept that the brain is a computational system, but others (like Penrose) argue that quantum effects in the brain might lead to non-computable processes. Moreover, even if the brain is computable, the engineering problem is immense and might require resources beyond what is feasible. So, the claim that it is an engineering problem "in principle" is a strong assumption that goes beyond the CTT.

      c. *Claim 3: Quantum computers cannot compute anything beyond classical machines because of the same theorem.*

          This is wrong. The CTT says that any computable function (in the intuitive sense) is computable by a Turing machine. Quantum computers are known to be able to compute some functions faster than classical computers (e.g., Shor's algorithm) but they do not compute functions that are uncomputable by a Turing machine. However, the claim that quantum computers cannot compute anything beyond classical machines is correct in the sense of computability (they both compute the same class of functions, the recursive functions) but wrong if interpreted as saying they are not faster. The CTT is about what is computable, not about efficiency. So, the conclusion that quantum computers are not more powerful in terms of computability is correct, but the reasoning that it's because of the CTT being a theorem is flawed (as per Claim 1). Also, note that the claim is stated as if it were a direct consequence of the CTT, which it is, but the CTT is not a theorem.

   2. **Account B Claims:**

      a. *Claim 1: The CTT has been refuted by proposals for analog devices that exploit infinite precision to settle the halting problem.*

          This is wrong. There have been proposals (like the "Malament-Hogarth spacetime" or analog machines with infinite precision) that are claimed to compute non-computable functions. However, these are not physically realizable in our universe (they require infinite resources, such as infinite time or infinite precision, which are not available in a finite universe). Moreover, the CTT is about effective computation, which is finite and discrete. The standard view is that such analog machines are not effective in the intuitive sense because they require infinite resources. Therefore, they do not refute the CTT. The CTT remains unchallenged for physically realizable computation.

      b. *Claim 2: The thesis is preserved only by defining "computable" as Turing-computable, rendering it empty.*

          This is a misunderstanding. The CTT is not a definition. It is a hypothesis that the mathematical concept of Turing-computability captures the pre-theoretic notion of effective calculability. The thesis has substantive content because it makes a claim about the physical world: that any function that can be computed by a mechanical procedure (in the intuitive sense) is computable by a Turing machine. We can test this by seeing if any proposed model of computation that is physically realizable goes beyond Turing machines. So far, none have. The definitional charge would be valid if we were only talking about formal systems, but the CTT is a bridge between the formal and the intuitive.

          However, note that in the context of mathematics, we often use "computable" to mean Turing-computable, but that is because we accept the CTT. The thesis itself is not empty: it says that the formal notion corresponds to the intuitive one.

   3. **The Definitional Charge and Substantive Content:**

          The CTT has substantive content because it is a claim about the physical world: that any physical process that can be used to compute a function can be simulated by a Turing machine. It is supported by:
            - The equivalence of multiple formal models.
            - The lack of any counterexample of a physically realizable device that computes a non-Turing-computable function.
            - The robustness of the class of computable functions.

          However, it is not proven because we cannot formalize the intuitive notion without circularity. The thesis is subject to empirical and conceptual considerations: if someone built a physical device that computed a non-recursive function, that would refute the CTT. So, it's not true by stipulation.

   4. **Does the Engineering Conclusion Follow?**

          The claim that human-level machine intelligence is an engineering problem in principle does not follow solely from the CTT. It requires additional premises: that the brain's cognitive processes are effectively computable (which is controversial) and that we can build a machine with sufficient computational resources to simulate it. The CTT only says that if the brain's operations are computable, then they can be computed by a Turing machine. But it does not guarantee that we can build such a machine in practice, or even in principle, given physical constraints (like energy, time, etc.). Moreover, there are arguments (e.g., from Penrose) that the brain might not be computable. So, the conclusion does not follow from the CTT alone.

   5. **Where an Account Gets a Conclusion Right for the Wrong Reason:**

          Account A's claim 3 (about quantum computers) is correct in the sense that quantum computers do not compute beyond the class of recursive functions, but the reason given (that the CTT is a theorem) is wrong because the CTT is not a theorem.

          Account B's claim 1 (that analog devices with infinite precision are not considered effective) is actually the reason why they don't refute the CTT. But the guest uses it to claim that the CTT has been refuted, which is incorrect.

   6. **Where I'd Put My Money:**

          I think the standard view in philosophy of computer science is that the CTT is well-supported but not a theorem, and that it has substantive content. The proposals for hypercomputation (like analog devices with infinite precision) are not physically realizable and hence do not threaten the CTT. The brain's computability is an open question, but the CTT does not by itself imply that strong AI is just an engineering problem.

   7. **What Would Change My Mind?**

          The single consideration most likely to overturn my assessment would be a physically realizable device (built in our universe, with finite resources) that computes a function not computable by a Turing machine. This would refute the CTT.

          Also, if we discovered that the brain (or some part of it) performs non-computable operations (e.g., by exploiting quantum gravity in a way that allows solving the halting problem), that would challenge the application of the CTT to cognition.

   8. **Where I Might Be Wrong:**

          I might be underestimating the possibility of new physics that allows hypercomputation. Also, the interpretation of the CTT as a physical thesis (about what can be computed in the physical world) is sometimes contested. Some philosophers hold that the CTT is only about mathematics and not about physics. If that view is correct, then the CTT would not constrain physical systems.

