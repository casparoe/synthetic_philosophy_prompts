answer: |-
  ### Prose Audit

  Your popular history account contains several claims that require nuanced correction. First, Turing's 1936 paper did not prove the Church-Turing thesis (CTT) as a theorem; it demonstrated the equivalence of his machine model with other formalisms like lambda calculus, but the CTT itself asserts that these formalisms capture the *intuitive notion of "computability"* — a claim that cannot be formally proven. While widely accepted, the CTT remains a hypothesis because it bridges formal mathematics and informal human intuition. Second, the leap from "the brain is physical" to "human cognition is Turing-computable" is not deductively sound. The CTT concerns what is *mathematically* computable, but whether the brain's operations map to this class depends on unresolved empirical questions (e.g., whether quantum effects in cognition permit non-computable processes). Third, quantum computers are indeed Turing-equivalent in computability (they solve the same class of problems as classical machines), but this follows from the CTT's *empirical robustness*, not because Turing "proved it as a theorem." The history gets this conclusion right but misattributes the rationale.

  Your podcast guest’s claims are largely incorrect. Analog hypercomputation proposals (e.g., machines using infinite-precision reals to solve the halting problem) do *not* refute the CTT. These devices are either physically unrealizable (requiring infinite energy/time) or fail to satisfy the CTT’s core requirement of *finite, discrete steps*. The CTT isn’t preserved by circular definition; it asserts that the informal concept of "mechanical computation" aligns with Turing machines. This is substantive: it makes testable predictions about physical systems. If a real device computed a non-Turing-computable function (e.g., deciding the halting problem for arbitrary programs), the CTT would fall — but no such device exists.

  On the definitional charge: The CTT has substantive content under its standard interpretation as a claim about the physical world. It’s not stipulative because it constrains what we believe *physical systems* can compute. Formal evidence (equivalence of computational models) and empirical evidence (no counterexamples in real computing devices) support it, but conceptual arguments (e.g., whether "computation" must be discrete) could challenge it.

  The "engineering problem" conclusion does *not* follow from surviving claims. Even if cognition is Turing-computable, engineering human-level AI requires overcoming colossal complexity, resource constraints, and unknown algorithms — far beyond the CTT’s scope. The CTT only addresses *what* can be computed, not *how efficiently* or *by what means*.

  **Where I’d place my bets**:  
  - The history oversimplifies the CTT’s status and overreaches on cognition/AI.  
  - The guest misunderstands hypercomputation and the CTT’s nature.  
  - Strongest confidence: Quantum computers are computability-equivalent to classical machines (supported by proofs in quantum complexity theory).  
  - Weakest confidence: Whether the brain *must* be Turing-computable (this hinges on unresolved physics/neuroscience).  

  **What would change my mind**: A physically realizable device computing a clearly non-Turing-computable function (e.g., solving the halting problem with finite resources) would refute the CTT and alter nearly all verdicts here.  

  **Where I might be wrong**: If quantum gravity or undiscovered physics enables intrinsic non-computability in macroscopic systems (like brains), the cognition/AI verdicts could be flawed. I also may undervalue analog continuous-time models if new physics validates them.

