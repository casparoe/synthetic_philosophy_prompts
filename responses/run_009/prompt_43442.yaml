prompt: |-
  I run a weekly evening seminar at an adult-education institute on the long history of arguments for toleration. The audience is mixed and non-specialist: retirees, a dentist, two sixth-formers, an engineer who reads philosophy for pleasure; none has any Latin, and their appetite reliably exceeds their background. The coming session is on Montaigne's essay 'Of Cannibals' (1580), Book I, Chapter XXX of the Essays, in the old public-domain English translation. I want a plan for the evening rather than a content summary.

  I intend to open by putting the essay's first anecdote on the whiteboard, exactly as the class will meet it. When King Pyrrhus, invading Italy, had surveyed the order of the Roman army sent out against him, he is made to say: "I know not," said he, "what kind of barbarians" (for so the Greeks called all other nations) "these may be; but the disposition of this army that I see has nothing of barbarism in it." I chose it because it does something the students will not expect: the word 'barbarian' enters the essay as a piece of Greek parochialism, before anyone has eaten anyone. But I do not trust my instinct for the rest of the session, which is to race to the punchline everyone half-remembers — that Europeans torture and burn men alive, so that the cannibals' roast is the milder barbarity — because stated that baldly it lands as a slogan, not an argument.

  So plan the ninety minutes for me. What has to be established, and in what order, before the relativist claim can be more than applause? Which single case should carry the whole session, and what must that case have and lack? The misconceptions I anticipate: that Montaigne is offering a noble savage, so that the Tupinamba are being praised as better people rather than as less corrupted; that the essay licenses 'any practice is fine anywhere', which the students will voice as 'so who's to say?'; and that 'barbarism' simply means cruelty, when the Pyrrhus anecdote has defined it as whatever the Greeks were not. Tell me where in the sequence each should be headed off, and what closing question would show that they have understood the argument rather than merely enjoyed the provocation. Finally, tell me honestly what to leave out at this level and say so: I assume the reliability of Montaigne's informant belongs out, and so does the essay's later afterlife — but correct me if either belongs in.
reasoning: |-
  Okay, let me start by understanding what the user needs. They run a weekly seminar on the history of arguments for toleration, and the upcoming session is on Montaigne's "Of Cannibals." The audience is non-specialist—retirees, a dentist, some students, an engineer—so the material needs to be accessible without prior knowledge of Latin or deep philosophical background. 

  The user wants a session plan, not a content summary. They’ve mentioned starting with the Pyrrhus anecdote to challenge the concept of "barbarian" right away. Their main concern is avoiding reducing Montaigne’s argument to a simplistic slogan. They want the students to grasp the deeper argument about relativism and cultural comparison, not just the provocative conclusion.

  First, I need to structure the 90 minutes effectively. The key is building the argument step by step so the punchline isn't isolated. Starting with the Pyrrhus quote sets up cultural relativism. Then, moving to how Montaigne presents the Tupinamba without idealizing them. The user mentioned misconceptions: noble savage fallacy, moral relativism ("who's to say?"), and misunderstanding "barbarism." 

  I should address each misconception at specific points. For example, when discussing the Tupinamba, emphasize that Montaigne isn't saying they're better but less corrupted. Later, when comparing European practices, clarify that it's about hypocrisy, not blanket relativism. The definition of barbarism from the Pyrrhus quote should be revisited when examining European actions.

  The user also wants to know what to exclude. Montaigne's sources and the essay's afterlife are probably too technical. The focus should stay on the text’s arguments. The closing question needs to show understanding, like asking what Montaigne would critique in their own society.

  I’ll break down the session into timed segments: intro with Pyrrhus, exploring the Tupinamba’s portrayal, defining barbarism, comparing practices, and the relativist claim. Each segment should tackle a misconception. For instance, when discussing the Tupinamba, explicitly state they’re not idealized. When comparing executions, highlight hypocrisy over relativism. 

  The user’s deeper need is fostering critical thinking about toleration, avoiding superficial takeaways. They want students to engage with the complexity of cultural judgment. Ensuring the plan builds logically to the final comparison, with checks for understanding throughout, will help achieve that. Also, keeping the discussion grounded in the text prevents tangents. Leaving out extraneous details keeps the session focused and accessible.
answer: |-
  Here's a structured 90-minute plan focusing on argumentative progression, misconception management, and active engagement, tailored for your audience:

  **Core Objective:** Move from the Pyrrhus anecdote to Montaigne's central comparison, ensuring students grasp it as a *critical tool against European hypocrisy*, not just relativism or noble savage praise.

  **Key Misconceptions to Address & Where:**
  1.  **Noble Savage:** Tackle during **Part 2** (Tupinamba exploration).
  2.  **"Who's to say?" Relativism:** Preempt in **Part 3** (Defining Barbarism) & confront head-on in **Part 5** (The Claim).
  3.  **Barbarism = Cruelty:** Constantly revisit using Pyrrhus, especially in **Part 3** & **Part 4** (European Comparison).

  **The Plan: Aim for Montaigne's Critical Scalpel, not a Bludgeon**

  **(0-5 min) Opening Hook & Framing:**
  1.  **Write Pyrrhus Quote:** Put it verbatim on the board.
  2.  **Immediate Question:** "Pyrrhus is about to fight Romans. Why does he hesitate to call them 'barbarians'? What does that word *mean* to him?" (Guide to: Greek cultural chauvinism, defining "otherness" by difference from *us*).
  3.  **Frame the Session:** "Montaigne uses this story right at the start. Tonight, we'll follow his lead: How does he challenge *our* tendency to label others 'barbaric'? What does he force us to see about *ourselves*?"

  **(5-25 min) Part 1: Meeting the Tupinamba - Description, not Idealization**
  *   **Activity:** Guided close reading of key descriptive passages (focus on customs, war practices, values). *Avoid* jumping to judgment.
  *   **Key Points to Elicit/Discuss:**
      *   *What* do they do? (Be specific: treatment of prisoners, warfare rules, social structure).
      *   *How* does Montaigne describe them? (Neutral tone, observer style: "I have had long talks with...", "They said that...", "They do this..."). He reports, doesn't rhapsodize.
      *   **Crucial Question:** "Is Montaigne saying these are *perfect* or *morally superior* people? What words/phrases suggest he's just describing them *as they are*, without claiming they are 'better'?" (Find evidence in text). **<<< Addresses Noble Savage Misconception HERE.**
      *   **Establish:** Montaigne presents them as a coherent society with its own logic, *different* but *internally consistent*. Not corrupted by European complexities (money, social hierarchy, inherited power).

  **(25-40 min) Part 2: What *is* "Barbarism"? Revisiting Pyrrhus**
  *   **Activity:** Return to the board. Brainstorm: "Based *only* on Pyrrhus's usage, what does 'barbarian' mean?" (Foreign, non-Greek, different customs, *assumed* inferior/disordered).
  *   **Link to Tupinamba:** "Europeans called the Tupinamba 'barbarians' instantly. Why? *Simply because they weren't European.*" Connect to Pyrrhus's initial assumption.
  *   **Refine Definition:** "So, 'barbarism' for Montaigne starts as *a label applied to the unfamiliar*, implying savagery/crudeness *without necessarily proving it*. It's a cultural bias dressed up as a moral judgment." **<<< Reinforces Pyrrhus Definition vs. Cruelty Misconception.**

  **(40-60 min) Part 3: The European Mirror - The Punchline in Context**
  *   **Activity:** Now introduce the famous comparison passages (European torture/execution vs. Tupinamba killing/eating).
  *   **Key Questions:**
      *   "What specific European practices does Montaigne describe? How are prisoners treated? What is the *stated purpose*?" (Torture for confession/repentance, prolonged public execution as spectacle/edification).
      *   "How does he describe the Tupinamba practice? What is *its* purpose/context?" (Killing in battle/after capture, eating as ritual act of vengeance/incorporation).
      *   **The Critical Comparison:** "Montaigne isn't saying eating people is *good*. He's asking: *Which practice is actually more 'barbaric' **according to the definition we just established?***"
      *   **Focus:** "He highlights the *hypocrisy* and *added cruelty* of Europeans: torturing in the name of piety, making death a prolonged spectacle under the guise of justice and religion. The Tupinamba act is 'wilder' but arguably *simpler, less hypocritical, and less cruel* in its execution." **<<< THIS is the core argument.**
      *   **Crucial Point:** "His target isn't *just* the cruelty, but the European *self-delusion* – calling *others* barbarians while perpetrating acts arguably *more* 'barbaric' (in the sense of *cruel, disordered, violating their own professed values*)."

  **(60-75 min) Part 4: Beyond Relativism - Montaigne's Critical Tool**
  *   **Address the Elephant:** "Okay, so is Montaigne just saying 'anything goes'? 'Who's to say what's barbaric?'" **<<< Addresses "Who's to say?" Misconption HERE.**
  *   **Activity/Discussion:**
      *   "Did Montaigne *approve* of cannibalism? (No, he calls it 'barbarous horror' – but note the context!).
      *   "What *is* his standard for judging? Look at the European critique." (Guide them: *Cruelty, hypocrisy, violation of one's own principles, unnecessary suffering*). He *is* judging, using a standard focused on *actions and their justifications*.
      *   **The Argument:** "Montaigne isn't saying all practices are equal. He's using the Tupinamba as a mirror to expose *specific, extreme European hypocrisies and cruelties*. He's saying: *Before you call others barbarians, look at what you do in the name of civilization and religion.* His relativism is *descriptive* (understand their context) to enable a *critical* judgment of his own society."
      *   **Link Back:** "This is *why* he started with Pyrrhus! Pyrrhus saw past the *label* ('barbarian') to the *reality* (order, discipline). Montaigne forces Europeans to look past their own label for the Tupinamba and see the *reality* of European actions."

  **(75-90 min) Part 5: Synthesis & Closing**
  *   **Recap the Journey:** Pyrrhus (label vs. reality) -> Tupinamba Description (different, not idealized) -> Barbarism = Cultural Bias -> European Hypocrisy/Cruelty exposed -> Relativism as a tool for self-critique, not moral abdication.
  *   **The Closing Question (Test of Understanding):** "If Montaigne were writing today, what common practice in *our* society might he hold up to this same critical mirror? *Not* to say 'it's just as bad as cannibalism,' but to ask: 'Does this practice involve hypocrisy, unnecessary cruelty, or violate our own stated values in a way we prefer not to acknowledge?'" (e.g., aspects of the justice system, industrial farming, treatment of refugees, environmental destruction despite professed values).
  *   **Final Thought:** Emphasize Montaigne's core contribution to toleration: **Skepticism towards our own cultural certainties and the importance of seeing others clearly before judging, as a check on our own potential for barbarity disguised as civilization.**

  **What to Leave Out (Wisely):**

  1.  **The Reliability of Montaigne's Source (André Thevet):** Absolutely correct. It's a fascinating historical footnote but derails the *philosophical argument* and risks getting bogged down in historical accuracy debates irrelevant to Montaigne's *purpose*.
  2.  **The Essay's Later Afterlife (Noble Savage trope, Enlightenment influence):** Also correct to exclude. It distracts from the text itself and how Montaigne *actually* argues within the essay. Mentioning it might even reinforce the "noble savage" misconception you're trying to avoid.
  3.  **Deep Dive into Skepticism (as a broader philosophy):** While foundational to Montaigne, a detailed discussion of Pyrrhonism is too much for this session. Focus on its *manifestation* in his cultural critique here: the suspension of immediate judgment, the willingness to question European norms.
  4.  **Every Nuance of Tupinamba Culture:** Stick to what Montaigne uses for his argument. Avoid anthropological tangents.

  **Why this sequence works:**

  *   **Builds Argument Logically:** Starts with the definition of the key term ("barbarian"), establishes the "other" neutrally, refines the definition, *then* introduces the shocking comparison *as evidence* for the hypocrisy critique, finally tackling the relativism question head-on.
  *   **Pre-empts Misconceptions:** Addresses them at the point where they naturally arise in the text/argument flow.
  *   **Keeps Focus on Montaigne's Purpose:** It's a critique of European hypocrisy enabled by cultural comparison, *not* an endorsement of cannibalism or simple relativism.
  *   **Active & Text-Based:** Relies on close reading and discussion of specific passages.
  *   **Delivers the Punchline with Impact:** The comparison lands *after* the groundwork is laid, making it a powerful argumentative point, not just a shocking soundbite.
  *   **Provides a Clear Test:** The closing question requires applying the *critical tool* (self-reflection prompted by comparison) rather than just recalling the provocation.

  Enjoy the session! Montaigne is perfect for this audience – his skepticism and vivid writing are wonderfully engaging.
