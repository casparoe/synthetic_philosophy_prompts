  Deliverables:
  1. Setup, rules, materials, minute-by-minute timeline.
  2. How the two rounds are sequenced and what the second round adds.
  3. Debrief mapping the experience to the problem, including defensibility, fact of the matter about the "right" class, self-selection vs. mundane, and connection to anthropic reasoning.
  4. Two tables:
     a. Moments in the activity mapped to the idea (moment, what participants did, part of reference class problem, facilitator question).
     b. Predictable failure modes (what goes wrong, why, how to handle).
  5. An honest note on which feature cannot be reproduced and must be asserted.

  Let's design the activity.

  **Activity Title:** The Underwriter's Dilemma

  **Setup:**
  - 12 students divided into 4 groups of 3. Each group is an underwriting team for an insurance company.
  - The risk: Five-year survival of a specific startup described in a brief case.
  - Each group receives a different reference class data set. The reference classes are:
    1. All new businesses (broad, lots of data).
    2. Tech startups founded by people under 25 (more specific, less data).
    3. Startups in the exact niche (e.g., "AI-driven personalized education platforms", very specific, very little data).
    4. Businesses in a particular neighborhood (e.g., "Silicon Valley", moderately specific, moderate data).

  **Materials:**
  - A case description of the startup (let's call it "EduAI") for all groups. It should include:
     - Founder: 23-year-old tech entrepreneur.
     - Niche: AI-driven personalized education platform.
     - Location: Based in Silicon Valley.
     - Founding year: 2024 (so we are in 2024, and we are forecasting survival to 2029).
  - Four different data sheets for the reference classes. Each data sheet provides:
     - The reference class description.
     - The number of businesses in that class that were tracked for at least 5 years (or started in a base year and then tracked for 5 years).
     - The number that survived 5 years.
     - The five-year survival rate (probability) for that class.

  We'll create fictional but realistic data for each reference class:

  1. All new businesses: 
     - Sample size: 10,000
     - Survived: 5,000
     - Survival rate: 50%

  2. Tech startups founded by people under 25:
     - Sample size: 200
     - Survived: 80
     - Survival rate: 40%

  3. Startups in the exact niche (AI-driven personalized education platforms):
     - Sample size: 20
     - Survived: 12
     - Survival rate: 60%

  4. Businesses in Silicon Valley:
     - Sample size: 1,000
     - Survived: 600
     - Survival rate: 60%

  Note: The data are chosen to create tension. The all-new-businesses class has a 50% rate, the young founders class 40% (suggesting maybe young founders are riskier), the niche class 60% (suggesting the niche is good), and the location class 60% (suggesting location is good). The startup in question is in all these classes.

  **Rules:**
  - Each group is to compute the premium for insuring EduAI against failure (non-survival) for five years. The premium should be set based on the survival rate they are given (so if survival is 60%, then the probability of failure is 40%, and the premium would be set to cover the expected loss plus a small profit margin). However, to keep it simple, we can just have them report the probability of survival (or failure) and then the class will discuss how to set a premium.
  - Alternatively, we can define the premium as proportional to the probability of failure. For instance, if the expected payout in case of failure is $1 million, then the premium might be set as (probability of failure) * $1 million * (1 + loading factor). But to avoid complex calculations, we can just have the groups report the probability of failure and then the class must agree on one probability to base the premium on.

