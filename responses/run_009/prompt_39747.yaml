  ### **The Underwriter's Dilemma: A Reference Class Discovery Activity**  
  **Objective:** Students experience the reference class problem organically by pricing insurance for the same risk using conflicting reference classes, then confront a self-selection case mirroring anthropic reasoning.  

  ---

  ### **Setup & Materials**  
  **Students:** 12 (4 groups of 3).  
  **Time:** 80 minutes.  
  **Materials:**  
  - **Handout 1 (Startup Case):** Description of "NexTech," a real but anonymized Silicon Valley AI-drone startup founded by 24-year-olds.  
  - **Handout 2 (Round 1 Reference Classes):** Unique datasets for each group:  
    - *Group 1:* All U.S. startups (5-year survival: 45% | *n* = 10,000).  
    - *Group 2:* Tech startups founded by founders <25 (5-year survival: 30% | *n* = 200).  
    - *Group 3:* AI-drone startups (5-year survival: 60% | *n* = 30).  
    - *Group 4:* Startups in Silicon Valley (5-year survival: 55% | *n* = 1,000).  
  - **Handout 3 (Round 2 Scenario):** "Humanity Policy" insuring against human extinction in 100 years.  
  - **Handout 4 (Round 2 Reference Classes):**  
    - *Group 1:* All extinct vertebrate species (avg. lifespan: 2M years | *n* = 1,000).  
    - *Group 2:* Species surviving >200K years (avg. *remaining* lifespan: 1.5M years | *n* = 500).  
    - *Group 3:* Industrial-era civilizations (avg. lifespan: 400 years | *n* = 0 — no extinct industrial civilizations).  
    - *Group 4:* Observer-selected species (lifespan data *conditional* on being observed at year 200K).  
  - **Board:** For recording group probabilities and premiums.  

  ---

  ### **Minute-by-Minute Timeline**  
  **0:00–0:10 — Intro & Setup**  
  - Explain: "You’re underwriters pricing insurance for NexTech’s 5-year survival. Each group has unique industry data. Compute the survival probability and a fair premium (e.g., if survival chance = 70%, premium = $300K for a $1M payout)."  
  - Distribute Handout 1 (identical startup case) and Handout 2 (unique reference classes).  

  **0:10–0:25 — Round 1: Startup Insurance (Group Work)**  
  - Groups compute survival probability and premium.  
  - Circulate, prompting: *"How certain are you in your data? What might weaken it?"*  

  **0:25–0:40 — Round 1: Presentations & Class Decision**  
  - Groups report: (1) reference class, (2) sample size, (3) probability, (4) premium.  
  - **Instructor writes probabilities on board:**  
    - Group 1 (all startups): 45%  
    - Group 2 (young founders): 30%  
    - Group 3 (niche): 60%  
    - Group 4 (location): 55%  
  - **Class Task:** Agree on one premium for NexTech.  
    - *Tension surfaces:* Groups 2/3 clash over specificity ("Young founders matter!") vs. data ("But your sample is tiny!").  

  **0:40–0:45 — Introduce Round 2**  
  - Distribute Handout 3: "Now insure *humanity* against extinction in 100 years. We’re 200,000 years into our existence. Use your new dataset."  
  - Give Handout 4 (Round 2 reference classes).  

  **0:45–0:55 — Round 2: Humanity Policy (Group Work)**  
  - Group 3 gets *n* = 0 (prompting frustration). Group 4 gets observer-conditional data.  
  - Circulate, asking: *"Does your class feel relevant? Could your data be biased?"*  

  **0:55–1:10 — Round 2: Presentations & Class Decision**  
  - Groups report probabilities:  
    - Group 1 (all species): 0.005% (1/2M years × 100 years)  
    - Group 2 (long-lived species): 0.006% (1/1.5M years × 100)  
    - Group 3 (industrial civs.): "No data!" → estimates 25% (guessing from crises).  
    - Group 4 (observer-selected): "Probability is *higher* — we’re only here because we survived, so we’re in a biased sample."  
  - **Class Task:** Agree on one probability.  
    - *Tension intensifies:* Group 4 argues self-selection matters; others dismiss it as unscientific.  

  **1:10–1:25 — Debrief & Concept Mapping**  
  - **Guided Discussion:**  
    1. **"What happened in Round 1?"**  
       - *Expected answer:* "Same case, different numbers. No one could prove their class was best."  
       - *Surface:* Trade-off specificity vs. data; no "natural" reference class.  
       - *Question:* "What makes a class defensible? Is founder age more 'real' than location?"  
       <br>  
    2. **"How did Round 2 feel different?"**  
       - *Expected answer:* "Group 4’s point about being ‘lucky observers’ broke the math."  
       - *Surface:* Self-selection (our existence affects the data).  
       - *Question:* "If we can’t observe extinct industrial civilizations, is our data meaningless?"  
       <br>  
    3. **"Is there a 'right' reference class?"**  
       - *Conclude:* No fact of the matter. Frequentists need a collective; Bayesians need priors over classes.  
       <br>  
    4. **"Connection to anthropic reasoning?"**  
       - *Reveal:* Doomsday argument uses observer selection (our birth rank in humanity’s timeline). Round 4’s logic is a simplified version.  

  ---

  ### **Table 1: Activity Moments & Reference Class Concepts**  
  | Moment                 | Participant Actions                          | Reference Class Problem Aspect        | Facilitator Question                     |  
  |------------------------|----------------------------------------------|---------------------------------------|------------------------------------------|  
  | Round 1 group work     | Trust assigned class; ignore alternatives.   | Classes are arbitrary but feel natural. | "Why is *your* class the right one?"     |  
  | Round 1 presentations  | Argue for their probability.                 | Tension: specificity vs. data size.   | "Is small-n specificity better than large-n noise?" |  
  | Round 1 class decision | Fail to agree; compromise unsatisfying.      | No evidentiary rule to resolve ties.  | "What principle would you use to choose?" |  
  | Round 2 group work     | Group 4 invokes observer bias; Group 3 has no data. | Self-selection breaks independence. | "Does survival *to now* change the odds?" |  
  | Round 2 class decision | Dismiss Group 4 or admit confusion.          | Observer effects create unbreakable circularity. | "Can we price this without knowing our place in history?" |  

  ---

  ### **Table 2: Predictable Failure Modes & Fixes**  
  | What Goes Wrong                          | Why                                                                 | How to Handle                                  |  
  |------------------------------------------|---------------------------------------------------------------------|------------------------------------------------|  
  | Groups average probabilities in Round 1. | Seeking quick compromise; miss the problem.                         | Ban averaging: "You must pick *one class*."   |  
  | Group 3 (Round 2) can’t engage.          | *n* = 0 feels unfair; may disengage.                               | Validate frustration: "Why is no data a problem? What does it imply?" |  
  | Class dismisses Group 4’s argument.      | Self-selection seems esoteric; students retreat to "hard data."    | Ask: "If we died tomorrow, could we price this insurance?" |  
  | Debate stalls on irrelevance.            | Students fixate on "real-world" accuracy, not philosophy.          | Redirect: "We’re not predicting real NexTech—we’re probing how probability *works*." |  
  | Time runs out for Round 2.               | Group 4’s abstract reasoning takes time.                           | Cut presentations early; focus on Group 4 in debrief. |  

  ---

  ### **Honest Note: The Unbridgeable Gap**  
  **The feature no activity can replicate:** Real-world reference classes exist in a near-infinite space of possible groupings, many gerrymandered post hoc to confirm biases. In class, students only see 4–8 curated options. **You must assert:** "Outside this room, there are countless ways to slice the same data—some absurd (e.g., ‘startups on rainy Tuesdays’), some plausible. No algorithm can *prove* which class is ‘true,’ because single-case probability is metaphysical, not empirical."  

  ---
  **Outcome:** Students exit with visceral frustration—having touched the reference class problem’s core and glimpsed its link to anthropic puzzles. The door is open for formal theory.
