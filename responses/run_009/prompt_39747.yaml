     |--------|----------------------------------|------------------------------------------------|-----------------------|
     | Round 1 group work | Computed a probability based on their assigned reference class. | Different reference classes yield different probabilities for the same event. | "Why did your group trust the data you were given? What are its strengths and weaknesses?" |
     | Round 1 class discussion | Argued for their group's probability and then tried to agree on one. | Tension between specificity (better fit) and sample size (more data). No objective way to choose. | "Which reference class seems most relevant? Why? Is there a way to prove it's the right one?" |
     | Round 2 group work (especially Group 4) | Group 4 reasoned qualitatively about selection effects. | The reference class might be conditioned on the outcome (survival) and thus be non-independent. | "Group 4, how did the selection effect change your thinking? How would you quantify it?" |
     | Round 2 class discussion | Groups 1-3 reported numbers, Group 4 reported a qualitative adjustment. They tried to reconcile. | In self-selection cases, the reference class must account for the observer's existence. | "Why is it hard to agree on a number now? What makes the asteroid scenario different from the startup scenario?" |
     | The decision moment | The class failed to agree on a single number in both rounds. | The reference class problem has no general solution. | "What would you do in real life if you had to set the premium? What principles would you use?" |

     **Table 2: Predictable failure modes**

     | What will go wrong | Why | How to handle |
     |--------------------|-----|---------------|
     | Groups in Round 1 might not see the trade-off between sample size and specificity. | The data might not be presented in a way that highlights the sample size, or they might not question the relevance. | During group work, circulate and ask: "How many data points do you have? How well does this class match the startup?" |
     | In Round 1, the class might too easily agree on an average or a weighted average. | They might think that combining the numbers is the solution. | Ask: "Is averaging the probabilities from different reference classes justified? Why or why not?" |
     | Group 4 in Round 2 might be confused and not know how to proceed. | The selection effect idea is subtle. | Provide a prompt with an example: "Imagine if an asteroid had hit in 1974. We wouldn't be here. So the fact that we are here means we are in a history without a hit in 1974. Does that make a hit more likely in the future?" |
     | The class might not see the connection between the two rounds. | The scenarios seem different. | In the debrief, explicitly compare: "In Round 1, the reference classes were about the characteristics of the startup. In Round 2, the reference classes were about the data collection process and our role as observers." |
     | The activity might run over time. | Group discussions can be longer than expected. | Keep strict time limits. Use a timer. Be ready to cut off discussions and move on. |

     **Honest note:**
     - No finite classroom activity can reproduce the full depth of the reference class problem because in real life, the space of possible reference classes is infinite and often not enumerable. Moreover, the problem is not just about choosing among a few classes but about the very idea that probability for a single case must be defined by a class. The facilitator must simply assert that there is no known generally agreed-upon solution to the reference class problem and that it remains a philosophical challenge.

     Let's now write the full activity plan.

     **Full Activity Plan:**

     **Title:** The Underwriter's Dilemma: Discovering the Reference Class Problem

     **Objective:** Students will discover through experience the reference class problem: that different reference classes yield different probability assignments for the same event, and there is no objective rule to choose among them, especially when selection effects are present.

     **Materials:**
     - Handout 1: Case description of startup EduAI (for all groups).
     - Handout 2: Round 1 data sheets (one per group, labeled by reference class).
     - Handout 3: Round 2 scenario description (asteroid impact insurance) (for all).
     - Handout 4: Round 2 data sheets (one per group).

     **Setup:**
     - Divide students into 4 groups of 3.
     - Each group gets the same startup case and the same Round 2 scenario, but different data sheets.

     **Round 1 (Startup Insurance):**
     - Case: EduAI, founded in 2024 by a 23-year-old in Silicon Valley, in the niche of AI-driven personalized education.
     - Groups:
          - Group 1: All new businesses.
          - Group 2: Tech startups founded by people under 25.
          - Group 3: Startups in the exact niche (AI-driven personalized education).
          - Group 4: Businesses in Silicon Valley.
     - Data (fictional):
          - Group 1: 50% survival (n=10,000)
          - Group 2: 40% survival (n=200)
          - Group 3: 60% survival (n=20)
          - Group 4: 60% survival (n=1,000)
     - Task: Compute the probability that EduAI will fail within five years (or survive, then convert to failure). Then, if time, compute a premium (premium = probability of failure * $1 million * 1.2 for profit).

     **Round 2 (Asteroid Insurance):**
     - Scenario: Asteroid "2024 BX" (100m-200m in diameter) might hit Earth in the next 100 years. We want the probability.
     - Groups:
          - Group 1: Historical frequency (geological record): impacts of this size happen once every 10,000 years on average. So probability in 100 years: 1 - exp(-100/10000) ≈ 0.00995.
          - Group 2: Observational data: 0 impacts in 25,000 asteroid-years (500 asteroids tracked for 50 years). Using the rule of thumb (upper 95% bound: 3 events in the same exposure), the upper bound on the rate per asteroid-year is 3/25000. For one asteroid in 100 years: 3/25000 * 100 = 0.012.
          - Group 3: Computer simulations: 100 impacts in 10,000 simulations: 0.01.
          - Group 4: Given the same observational data as Group 2, but with the prompt: "The fact that we are here to observe means that no such impact has occurred in the last 50 years. This survivorship bias might indicate that the true risk is higher than what the observational data suggests. Why? Because if an impact had occurred, we wouldn't be here. So the data is conditional on our survival. How does this affect the probability? (You don't have to compute an exact number, but reason qualitatively.)"

     **Timeline:**
     - 0:00-0:10: Introduction and group formation. Distribute Handout 1 (startup case) and Round 1 data sheets.
     - 0:10-0:25: Group work Round 1.
     - 0:25-0:40: Group presentations and class discussion for Round 1. Try to agree on a premium.
     - 0:40-0:45: Introduce Round 2. Distribute Handout 3 (scenario) and Round 2 data sheets.
     - 0:45-0:50: Group work Round 2.
     - 0:50-1:00: Group presentations and class discussion for Round 2. Try to agree on a probability.
     - 1:00-1:10: Debrief discussion.

     **Debrief Points:**
     - In Round 1, you had to choose a reference class. What made it hard? (No clear right answer, trade-off between sample size and specificity.)
     - In Round 2, we encountered a new issue: selection effects. The fact that we are here to observe affects the data we have.
     - What makes a reference class defensible? (Causal relevance, not gerrymandered, etc.) But there's no foolproof criterion.
     - Is there a fact of the matter about the right reference class? (Philosophical question: frequentists vs. Bayesians might answer differently.)
     - How does Round 2 connect to anthropic reasoning? (Our existence as observers conditions the probabilities we assign.)

     **Handout Examples:**

     **Handout 1 (EduAI Case):**
     ```
     EduAI is a startup founded in 2024 by a 23-year-old entrepreneur. It is based in San Francisco, California (Silicon Valley). The company develops an AI-driven platform for personalized education. You are an underwriter for an insurance company that is considering offering a policy that will pay $1 million to the founders if EduAI fails (ceases operations) within five years (by 2029). You must set a premium for this policy.
     ```

     **Handout for Group 1 (Round 1):**
     ```
     Reference Class: All new businesses in the United States.

     Data: 
     - We tracked 10,000 new businesses founded in 2014.
     - After 5 years (in 2019), 5,000 were still operating.
     - Five-year survival rate: 50%.
     ```

     Similarly for the others.

     **Handout 3 (Asteroid Scenario):**
     ```
     Asteroid 2024 BX is a near-Earth asteroid approximately 150m in diameter. You are to insure against the event that it collides with Earth within the next 100 years (by 2124). Such a collision would cause global catastrophic damage. The insurance policy would pay out $1 billion in the event of a collision. You must set a premium.
     ```

     **Handout for Group 2 (Round 2):**
     ```
     Reference Class: Observational data of near-Earth asteroids of size 100m-200m.

     Data:
     - We have tracked 500 such asteroids over the last 50 years (1974-2024).
     - None of these asteroids have collided with Earth during this period.
     - Total exposure: 500 asteroids * 50 years = 25,000 asteroid-years.

     Method: 
     To estimate the impact rate per asteroid per year, we use the fact that we observed 0 impacts. A rule of thumb in such cases is that the upper 95% confidence bound for the number of events is 3. So the upper bound on the impact rate per asteroid-year is 3 / 25,000 = 0.00012.
     For one asteroid (2024 BX) over 100 years, the upper bound on the impact probability is 0.00012 * 100 = 0.012 (1.2%).
     ```

     **Handout for Group 4 (Round 2):**
     ```
     Reference Class: Observational data of near-Earth asteroids of size 100m-200m, but with a twist.

     Data:
     - We have tracked 500 such asteroids over the last 50 years (1974-2024).
     - None have collided with Earth.

     However, consider this: if any major asteroid had collided with Earth in the last 50 years, it might have caused a global catastrophe and we might not be here today to observe the asteroid. Therefore, the fact that we are here to observe means that no such impact has occurred in the last 50 years. This is a selection effect: our data is conditional on humanity having survived so far.

     Question: Does this mean that the true risk of an asteroid impact in the next 100 years is higher than what the observational data by itself suggests? Why or why not? How would you adjust the probability?
     ```

     This should create a rich discussion. The activity ends with the debrief.
