     - Defensible reference classes: ones that are projectable, based on causal factors, or ones that are not gerrymandered to get a desired probability. But there is no objective rule.
     - Could there be a fact of the matter about the "right" class? In frequentism, it's defined by the long run, but for a single case, it's not clear. In Bayesianism, you use priors over classes or over causal models.
     - Self-selection (Round 2) vs. mundane (Round 1): in the self-selection case, the reference class might be defined by the act of observation, which is not independent of the outcome. This connects to anthropic reasoning: our place in the universe as observers can affect what we should expect.
