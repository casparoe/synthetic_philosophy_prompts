prompt: |-
  so my roommate this year is from Freiburg, and after a semester of arguing about dishes we've graduated to arguing about everything else lol. i'm from Chicago where jaywalking is basically a civic duty, and it genuinely shocked her the first time I crossed against the light at 3am on a street with zero cars — she stood there and waited for green like it was a moral test. I've started keeping a running list of her verdicts because they're so consistent they're almost like case law. so far: jaywalking on an empty street, wrong; the murderer-at-the-door lie (protecting the hiding victim), fine — she says that one's obvious even though I gather Kant himself kinda waffled on it; ditching a promise to help a friend move because a better invite came up, wrong, full stop; not reporting some cash income on taxes, wrong, no matter how small; breaking a friend's confidence to stop them driving home drunk, fine; and pirating a movie, wrong, even though she admits noone's actually harmed by it. she does not accept "but nobody gets hurt" as an excuse, which I find fascinating from someone who'll lie to a murderer.

  here's why I'm asking now: three situations have actually come up or are coming up, and I want to place bets with another friend before she rules. (1) her cousin overstayed a visa in Germany and someone has to decide whether to help him stay off the radar of the authorities — conscience says help, the law and the bureaucracy she genuinely respects says don't, and she does respect the German state, it's not a Nazi-era situation where the regime is easy to write off. (2) at her internship she signed an NDA, and she's found out the company is doing something legal but gross with user data — a leak would break a real obligation she took on voluntarily to expose something that breaks no law. (3) her professor gives extensions only for documented emergencies, and she's got a friend who missed a deadline for a genuinely sympathetic but undocumented reason — does she lie to the professor's face to get the extension? my money is on her refusing all three times, but my other friend thinks she'll allow the cousin one.

  so: predict her verdict on each, tell me what rule you think she's actually running (I can see at least two that fit everything so far — something like "rules bind unless the stakes are truly grave" vs. something like "rules bind unless the rule-giver loses legitimacy, and then everything's permitted" — and maybe a third about how rules only work if people follow them habitually without exceptions, which would explain the jaywalking thing better than the first two do). Say which rule fits best and why, and then give me one new case, an actual concrete scenario, that would split the top two candidates — something we could maybe even bait her into over dinner. and answer in American English please, no British spellings. oh and one more thing, don't be diplomatic on this part: when you lay out her rule next to the "rules are rough guides, conscience decides case by case" thing I grew up with, which one actually holds up better when you press on it? I have a feeling the answer isnt what I want it to be.
reasoning: |-
  Okay, the user is describing their roommate from Freiburg who has very strict principles about rules and morality. They've been debating various scenarios, and now the user wants to predict how the roommate would judge three new situations. 

  First, I need to understand the roommate's ethical framework based on the examples given. She consistently follows rules (jaywalking, taxes, pirating) unless there's an immediate, grave harm (lying to a murderer, breaking confidence to stop drunk driving). The key is that "no one gets hurt" isn't enough for her to break a rule—there has to be a clear, serious harm prevented. 

  For the three new scenarios:
  1. **Cousin overstaying visa**: Helping him would violate immigration laws. While it's a personal dilemma, the harm isn't immediate or life-threatening like the murderer scenario. The German state isn't illegitimate here. Prediction: She won't help.
  2. **NDA breach**: The company's actions are legal, just "gross." No imminent harm like drunk driving. She voluntarily signed the NDA, so obligation is strong. Prediction: No leak.
  3. **Lying for extension**: Sympathetic reason, but not documented. Not an emergency with dire consequences. Professor's rule is clear. Prediction: Won't lie.

  Her rule seems to be: "Rules are binding unless breaking them prevents immediate, severe harm." This explains the jaywalking (no harm prevented) vs. drunk driving (harm prevented). The "legitimacy" theory doesn't fit because she follows rules even for regimes she dislikes (e.g., taxes fund things she might oppose). 

  The "habit formation" theory (jaywalking erodes respect for rules) is secondary but reinforces the main rule—exceptions weaken the system unless justified by grave harm. 

  **Rule Comparison**: Her framework is more robust than case-by-case conscience. Conscience is subjective and slippery (e.g., "no one gets hurt" could justify piracy). Her rule avoids self-serving exceptions, though it can feel rigid in low-stakes scenarios (jaywalking). The strength is consistency; the weakness is inflexibility in "grey areas" without imminent harm. 

  **Test Case to Split Theories**: 
  - "You find a lost wallet with $500 cash and ID. Returning it means mailing it (costs $10, no reward). Keeping it harms no one immediately. Your bank account is overdrafted." 
    - Habit theory: Return it (upholds honesty habit). 
    - Grave-harm theory: Keep it (no grave harm prevented by returning). 
    Her choice would clarify which principle dominates—likely habit theory (return it), reinforcing rules even without harm. 

  **Bet Recommendations**: 
  - Cousin: Refuse (law > personal bond without grave harm). 
  - NDA: Stay silent (contractual obligation intact). 
  - Extension: Truth (rule adherence over sympathy). 

  **User's Deeper Ask**: They’re low-key hoping their "conscience-based" approach is superior but suspect the roommate’s rigidity has merit. The analysis confirms that—while unintuitive—the roommate’s framework holds up better against self-deception and marginal compromises. The wallet test exposes the core tension: her system prioritizes systemic integrity over individual convenience, even when it "doesn’t hurt."
answer: |-
  Based on her established pattern and ethical framework, here’s the breakdown:

  ### Predictions for Upcoming Situations:
  1. **Cousin overstaying visa**: **REFUSE to help.**  
     *Why*: The German state has legitimate authority here (not an illegitimate regime), and helping violates immigration law without preventing *immediate, grave harm* (like death or violence). She’ll prioritize respect for legal systems over familial loyalty when stakes aren’t life-or-death.  

  2. **Breaking NDA for legal but "gross" data practices**: **WON’T leak it.**  
     *Why*: She took a **voluntary obligation** (the NDA), and the company’s actions—while skeevy—aren’t illegal or causing direct, urgent harm. No "murderer at the door" equivalent exists here.  

  3. **Lying for friend’s extension**: **WON’T lie to the professor.**  
     *Why*: Sympathy ≠ emergency. The professor’s rule is clear and institutional (not arbitrary), and lying would break academic integrity without preventing severe consequences (e.g., the friend isn’t suicidal over the missed deadline).  

  **Betting Advice**: Your money’s safe—she’ll refuse all three. Your friend loses the cousin bet.  

  ---

  ### Her Governing Rule:  
  **"Rules bind unless breaking them prevents imminent, severe harm to persons (not systems, feelings, or convenience)."**  

  - **Why this fits**:  
    - ✅ **Permits lying to a murderer/drunk-driving intervention**: Direct, bodily harm is at stake.  
    - ✅ **Forbids jaywalking, tax evasion, piracy**: No *immediate* harm exists; these are "system trust" or abstract-harm scenarios.  
    - ✅ **Forbids ditching a promise**: Harm is relational/inconvenience, not severe.  
    - ❌ **Rejects "but nobody gets hurt"**: She cares about *principle* and *precedent* (e.g., piracy undermines creative labor systems; jaywalking normalizes lawbreaking).  

  **Why the other frameworks DON’T fit**:  
  - ✖️ **"Rules bind unless stakes are grave"**: Too vague. "Grave" for her means *physical/survival harm*—not bureaucratic, emotional, or financial stakes (see cousin/NDA cases).  
  - ✖️ **"Rules bind unless rule-giver lacks legitimacy"**: She follows tax laws even if she dislikes the government. The jaywalking objection (where the state *is* legitimate) proves this isn’t her driver.  
  - ✅ **Secondary factor: "Habitual compliance"**: This *supplements* her main rule. Jaywalking’s "wrongness" is amplified because habitual exceptions erode rule-following instincts. But it’s not core—habit alone wouldn’t excuse lying to a murderer.  

  ---

  ### Test Case to Split the Theories:  
  **The Lost Wallet**:  
  > *She finds a lost wallet with $500 cash and the owner’s ID. Returning it would require mailing it (costing her $10 in postage, with no reward guaranteed). Her bank account is overdrafted, and she needs groceries. Keeping the cash would solve her problem, and the owner—a wealthy stranger—would likely never notice.*  

  - **Under "grave harm" rule**: Keeping it is **fine**. No severe harm occurs (owner isn’t destitute; loss is inconvenience).  
  - **Under "habitual compliance" rule**: Keeping it is **wrong**. It normalizes dishonesty for minor gain, eroding integrity.  
  - **Under her ACTUAL rule (my theory)**: Keeping it is **wrong**. No *imminent physical harm* is prevented by breaking honesty norms.  

  *Why it splits*: If she says "keep it," she’s truly in the "grave-harm-only" camp. If she says "return it," the "habit" principle is stronger than we thought. (I’d wager she returns it—reinforcing that her rule isn’t *just* about harm prevention but also upholding systems.)  

  ---

  ### Her Rule vs. Your "Case-by-Case Conscience" Framework:  
  **Her system holds up better under pressure.** Here’s the uncomfortable truth:  

  - **Her strength**: Consistency. By drawing a bright line at **physical welfare**, she avoids:  
    - The slippery slope of "harm inflation" (e.g., "tax evasion doesn’t hurt anyone" → erodes public services).  
    - Self-serving bias ("*My* piracy is fine, but *your* jaywalking is reckless").  
  - **Your framework’s weakness**:  
    - "Conscience decides" often masks subjectivity. E.g., pirating a movie "because no one gets hurt" ignores systemic harm to artistic incentives.  
    - It can’t explain why *she* lies to murderers but not professors—while yours might inconsistently allow both if "conscience permits."  
    - **Brutal truth**: Societies need people like her. Systems (traffic, taxes, contracts) collapse if everyone cherry-picks rules based on personal harm assessments. Jaywalking at 3 a.m. *feels* harmless, but normalizing it leads to daytime risks.  

  **The catch**: Her rigidity fails in "non-violent but systemic harm" cases (e.g., the NDA leak if the data practice *is* exploitative but not illegal). That’s where your conscience-driven approach has moral merit—but requires exceptional rigor to avoid self-deception.  

  ---  
  **Final verdict**: She’s running German-style *Prinzipientreue* (principle fidelity). It’s maddening but philosophically tank-proof. For the wallet test? Casually mention a "friend’s dilemma" over dinner and watch the fireworks. 🔥
