prompt: |-
  I adjudicate disputed coverage claims for a mid-sized regional health insurer. Our policies promise coverage for the "medically necessary treatment of disease or injury" and leave "disease" undefined, so the contested claims land on me: a handful each month, each requiring a written rationale that can survive both internal review and external appeal. The medical directors pass these to me precisely because the question is conceptual rather than clinical — the clinicians can tell me what is wrong with the patient and what treating it would do, but not whether the condition counts as a disease.

  Please write me a decision procedure I can run on a single claim in about twenty minutes, grounded in what philosophy of medicine actually has to say about the concept of disease: the naturalist idea that disease is the failure of a part to perform its biological function, the normativist idea that disease is a condition we judge bad, and the hybrid views that try to combine the two. Write as a philosopher of medicine who has had to make these theories usable by non-philosophers, and think through before you write which distinctions must survive the translation into a checklist — for instance, function relative to which reference class (the whole species? the patient's age and sex?), and who is entitled to judge that a condition is harmful — and which distinctions can safely be dropped.

  The procedure should set out the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision back to me because the question is one of values rather than facts. Then run it on three claims: (1) therapy for a patient with disabling misophonia — rage and panic at ordinary chewing sounds, with no identifiable mechanism failing; (2) testosterone treatment for a healthy 58-year-old man complaining of fatigue, whose levels are in the low-normal range for his age; and (3) treatment of premenstrual dysphoric disorder — and here I'll tell you up front that I personally incline toward the view that if nothing is broken it isn't a disease, and I expect the procedure to disagree with me on this one. Show where it does, and what I would have to accept if I follow it.

  Be explicit about which steps are judgment calls dressed up as procedure, and say plainly what the procedure cannot settle. Lead with the bottom line: the first sentence or two should state the core decision rule, then give the full procedure, the worked applications, and the reasoning. No preamble, and don't restate this request back to me.
reasoning: |-
  We are building a decision procedure grounded in philosophy of medicine to determine if a condition counts as a "disease" for coverage purposes. The core decision rule:

  **Cover the claim if the condition (a) constitutes a failure of a part to perform its species-typical biological function (naturalist criterion) AND (b) this failure causes harm that the patient or society has a legitimate basis to judge as bad (normativist criterion). If either criterion is not met, deny coverage unless a hybrid exception applies (see step 4).**

  Now, the full procedure:

  **Step 1: Identify the condition and the part(s) of the body implicated.**
     - Ask: What is the condition being treated? What organ, system, or physiological process is claimed to be malfunctioning?
     - Sufficient answer: Clear identification of a specific part and the condition affecting it. If no part can be identified (e.g., purely behavioral or subjective states without underlying physical dysfunction), note this and proceed to step 2.
     - If no part is implicated, the naturalist criterion fails – but do not stop yet.

  **Step 2: Assess naturalist criterion (biological dysfunction).**
     - Ask: Is there evidence that the identified part is failing to perform its **species-typical biological function**? (Reference class: typical function for the human species, adjusted for age and sex where biologically relevant.)
     - Sufficient answer:
       - Yes: if the part's function is well-established in biology (e.g., heart pumping blood) and evidence shows it is failing relative to the typical range for the patient's age/sex.
       - No: if the function is not species-typical (e.g., a social function) or if the part is functioning within typical range for the patient's demographic (e.g., low-normal testosterone for age).
       - Uncertain: if the function is contested (e.g., brain functions in mental disorders) or if the typical range is debated.
     - If yes, proceed to step 3.
     - If no, the naturalist criterion fails – proceed to step 4.
     - If uncertain, proceed to step 3 but flag for judgment.

  **Step 3: Assess normativist criterion (harm).**
     - Ask: Does the condition cause harm that the patient (or in rare cases, society) has a **legitimate basis** to judge as bad? (Legitimacy: harm must be objective, e.g., pain, disability, increased mortality, or significant impairment in major life activities – not mere social disadvantage without biological impact.)
     - Sufficient answer:
       - Yes: if the harm is documented and aligns with widely accepted medical harms (e.g., pain, inability to work, threat to life).
       - No: if the harm is solely based on cultural preferences or minor inconveniences.
       - Uncertain: if harm is subjective but severe (e.g., mental anguish without dysfunction).
     - If yes and step 2 was yes, cover the claim.
     - If no, deny coverage.
     - If uncertain, proceed to step 4.

  **Step 4: Hybrid exception (for conditions failing one criterion but meeting the other exceptionally).**
     - Ask: Does the condition present a **severe and legitimate harm** that society/medicine widely recognizes as requiring treatment, even without clear biological dysfunction? OR, is there a clear biological dysfunction that is not currently harmful but poses a high risk of future harm?
     - Sufficient answer:
       - For harm without dysfunction: The harm must be severe, beyond the patient's control, and recognized by medical authorities (e.g., DSM for mental disorders) as a disorder. This is a judgment call – if met, cover the claim.
       - For dysfunction without current harm: Only cover if there is strong evidence that the dysfunction will likely cause future harm (e.g., precancerous lesions).
       - Otherwise, deny.
     - This step is explicitly a judgment call. If the answer is yes, cover; if no or still uncertain, deny.

  **Step 5: Final handoff.**
     - If at any point the procedure requires a value judgment not resolved by steps 1-4 (e.g., whether a harm is "legitimate" or if a hybrid exception applies), explicitly hand the decision back to you with a note on the contested value.

  **What the procedure cannot settle:**
     - Deep value disputes (e.g., whether menopause is a disease) – these require policy-level decisions.
     - Conditions where biological function is inherently value-laden (e.g., reproductive functions).
     - Conditions that are primarily social problems (e.g., unemployment causing distress).

  ---

  **Worked Applications:**

  **Claim 1: Therapy for disabling misophonia (rage/panic at chewing sounds, no identifiable mechanism).**

  - Step 1: Condition: misophonia. Part implicated? None identified – it's a reaction to sounds, not a clear organ dysfunction. Proceed to step 2.
  - Step 2: Naturalist criterion? No biological part is failing a species-typical function (hearing is normal; the reaction is behavioral). Naturalist fails. Proceed to step 4.
  - Step 3: Skipped because naturalist failed.
  - Step 4: Hybrid exception? Harm: severe (rage, panic, disability). Legitimacy: Yes, if it impairs work/social life. Recognition: Misophonia is not in DSM-5 but is under research. Judgment call: Given severity and disability, and emerging medical recognition, a hybrid exception might apply. **Cover** if you accept the harm as legitimate and severe enough without biological dysfunction. Otherwise, deny. (Handoff: If unsure, hand to you.)

  **Claim 2: Testosterone for a healthy 58-year-old man with fatigue and low-normal levels for age.**

  - Step 1: Condition: age-related low testosterone. Part: endocrine system (testes).
  - Step 2: Naturalist criterion? Function: testosterone production. Reference class: men of same age. Levels are low-normal for age – typical for his demographic. No failure of species-typical function (aging is typical). Naturalist fails. Proceed to step 4.
  - Step 3: Skipped.
  - Step 4: Hybrid exception? Harm: fatigue – but is it severe and objective? Fatigue can be multifactorial. Recognition: Medical guidelines (e.g., Endocrine Society) do not recommend treatment for low-normal levels with nonspecific symptoms. No hybrid exception. **Deny coverage**.

  **Claim 3: Treatment of premenstrual dysphoric disorder (PMDD).**

  - Step 1: Condition: PMDD. Part: reproductive system / neuroendocrine axis.
  - Step 2: Naturalist criterion? Function: The menstrual cycle is species-typical, but PMDD is a severe negative reaction to normal hormonal fluctuations. Is this a dysfunction? Biologically, the cycle is functioning typically (ovulation, hormone levels). Naturalist likely fails (no part is broken). Proceed to step 4.
  - Step 3: Skipped.
  - Step 4: Hybrid exception? Harm: severe emotional and physical symptoms causing impairment. Legitimacy: Yes (documented disability). Recognition: PMDD is in DSM-5 as a mental disorder. Hybrid exception applies. **Cover the claim**.

  **Note for Claim 3**: You (the adjudicator) stated a personal inclination toward naturalism ("if nothing is broken, it isn't a disease"). The procedure disagrees because PMDD meets the hybrid exception: severe harm and medical recognition despite no biological dysfunction. To follow the procedure, you must accept that severe, medically recognized harm can sometimes define disease even without underlying biological failure.

  ---

  **Explicit judgment calls:**
  - Step 4 is entirely a judgment call about harm severity and medical recognition.
  - Step 3's assessment of "legitimate harm" may require judgment (e.g., is distress from gender dysphoria legitimate harm?).
  - Step 2's "species-typical function" can be contentious (e.g., is aging a disease?).

  **Final note**: This procedure operationalizes hybrid theory. It defaults to naturalism but allows normativism to override in severe, recognized cases. It cannot resolve societal value conflicts – those are for policymakers, not claims adjudicators.
answer: |-
  **Core Decision Rule:** Cover the claim if the condition (a) involves a failure of species-typical biological function in a bodily part (naturalist criterion) AND (b) causes harm judged as objectively bad by medical/societal standards (normativist criterion). If (a) fails but (b) is severe and medically recognized, cover under a hybrid exception. Deny if neither is met, or hand back for value judgments.  

  ### Decision Procedure (20-Minute Workflow)  
  **Step 1: Identify Bodily Part and Function**  
  - *Ask:* What specific organ, system, or physiological process is implicated? Is its biological function well-defined (e.g., "kidneys filter blood," "cortisol regulates stress")?  
  - *Sufficient answer:* A concrete part/functio n (e.g., "auditory system processes sound"). If none (e.g., purely behavioral reactions), state "no part identified."  
  - *Stop if:* No part/functio n implicated → Naturalist criterion fails. Proceed to Step 4.  
  - *Judgment call:* "Biological function" assumes species-typical norms (e.g., human hearing range), adjusted for age/sex where biologically relevant (e.g., testosterone by age). Drop philosophical debates about "function" – use textbook biology.  

  **Step 2: Assess Naturalist Criterion (Biological Dysfunction)**  
  - *Ask:* Is the part failing its species-typical function? (e.g., "Does the kidney fail to filter?"). Use objective evidence (labs, imaging, clinical guidelines).  
  - *Sufficient answer:*  
    - **Yes:** Function is impaired relative to typical human baseline (e.g., ejection fraction <50%).  
    - **No:** Function intact (e.g., hormone levels age-normal), or "failure" is statistical (e.g., low-normal lab value).  
    - **Uncertain:** Function contested (e.g., neurochemistry in mental health).  
  - *Stop if:* "No" → Naturalist fails. Proceed to Step 4.  
  - *Hand back if:* "Uncertain" due to ambiguous science (e.g., novel syndromes).  

  **Step 3: Assess Normativist Criterion (Harm)**  
  - *Ask:* Does the condition cause objective harm? (e.g., pain, disability, mortality risk). Exclude purely social/cultural harms (e.g., unhappiness with aging).  
  - *Sufficient answer:*  
    - **Yes:** Harm is measurable and medically significant (e.g., inability to work, suicidal ideation).  
    - **No:** Harm is minor/subjective (e.g., cosmetic concerns).  
    - **Uncertain:** Harm severe but etiology unclear (e.g., distress without dysfunction).  
  - *Stop if:* Naturalist = "Yes" AND Harm = "Yes" → **Cover claim**.  
    Harm = "No" → **Deny** (even if dysfunction exists).  
  - *Proceed to Step 4 if:* Naturalist fails or Harm "Uncertain."  

  **Step 4: Hybrid Exception (Severe Harm Without Dysfunction)**  
  - *Ask:* Is the harm (a) severe, (b) beyond patient control, and (c) recognized as a disorder by medical authorities (e.g., DSM, ICD, major specialty guidelines)?  
  - *Sufficient answer:*  
    - **Yes:** All three met → **Cover claim** (hybrid override).  
    - **No:** Any unmet → **Deny**.  
  - *Judgment call:* "Severe harm" and "medical recognition" are value-laden. Hand back if legitimacy disputed (e.g., "Is menopause a disease?").  

  **Step 5: Final Handoff**  
  - *Hand back to adjudicator if:*  
    - Harm legitimacy is contested (Step 3/4).  
    - Medical recognition is ambiguous (Step 4).  
    - Biological function is value-dependent (e.g., reproductive traits).  
  - *Procedure cannot settle:* Societal values (e.g., "Is infertility a disease?"). These require policy guidance.  

  ---

  ### Worked Applications  
  **Claim 1: Therapy for disabling misophonia**  
  - **Step 1:** No bodily part identified (hearing intact; reaction to sound is neurological/behavioral). → Naturalist fails.  
  - **Step 2:** Skipped (Naturalist failed).  
  - **Step 3:** Harm = "Yes" (disabling rage/panic). BUT requires Step 4 due to Naturalist failure.  
  - **Step 4:** Harm is severe/uncontrollable. Medical recognition? Not in DSM/ICD; research ongoing. → **Uncertain**. Hand back for judgment: *If you accept emerging consensus on "sound tolerance disorders," cover; else deny.*  
  - **Bottom line:** *Deny* (lacks dysfunction and formal recognition) or hand back.  

  **Claim 2: Testosterone for healthy 58M with fatigue, low-normal levels**  
  - **Step 1:** Part: Endocrine system (testes). Function: Testosterone production.  
  - **Step 2:** Naturalist? No dysfunction. Levels age-typical (reference class = males 50-70). → Naturalist fails.  
  - **Step 3:** Harm? Fatigue subjective; no objective impairment (e.g., organ damage). → Harm "Uncertain." Proceed to Step 4.  
  - **Step 4:** Severe harm? Not beyond aging norms. Medical recognition? Guidelines reject treatment for age-typical low testosterone. → **No hybrid exception. Deny.**  
  - **Bottom line:** *Deny* (no dysfunction; harm not medically separable from aging).  

  **Claim 3: Treatment of premenstrual dysphoric disorder (PMDD)**  
  - **Step 1:** Part: Reproductive system. Function: Ovarian cycling (hormone fluctuations).  
  - **Step 2:** Naturalist? No dysfunction – ovulation/hormones species-typical. → Naturalist fails.  
  - **Step 3:** Harm = "Yes" (severe emotional/physical impairment). Proceed to Step 4.  
  - **Step 4:** Severe/uncontrollable? Yes. Medical recognition? DSM-5 lists PMDD as a disorder. → **Hybrid exception applies. Cover.**  
  - **Bottom line:** *Cover* – **contradicts your naturalist view**. To follow procedure, you must accept: (1) Harm severity overrides absent dysfunction, and (2) DSM recognition legitimizes harm.  

  ### Where the Procedure Disagrees With You  
  - **PMDD (Claim 3):** Your view ("no broken part = no disease") is naturalist. The procedure uses a hybrid standard: If harm is severe and medically validated (DSM), it overrides lack of biological dysfunction. To follow the procedure, you must accept that "disease" can include conditions where the body functions typically but causes pathological harm. This reflects real-world practice (e.g., mental health) but prioritizes normativism when consensus exists.
