  We are designing an in-class game called "Underdetermination Lab Wars"

  Materials:
  - A pre-made deck of "evidence cards" (about 20-25 cards). Each card describes an experimental outcome or observation. The deck is fixed and sealed until the game starts.
  - A set of 4-5 "theory cards" (one per theory) that describe the core laws of the candidate theories. Each theory card has:
     - A unique name (e.g., "Theory A", "Theory B", etc.)
     - A clear statement of the theory (e.g., "All particles are made of strings" or "All particles are point-like")
     - A list of auxiliary assumptions (initially hidden? or maybe not) - but we'll have a separate "auxiliary card" system for the Duhem move.
  - One "blame the auxiliary" card per lab (for the Duhem point). This card is played when a theory is refuted by evidence to save the theory by modifying an auxiliary.

  Setup:
  - Split the class into 3-4 labs (about 4-6 students per lab). Each lab chooses a name.
  - Give each lab a set of theory cards for all candidate theories at the start (so they know the full set). They start by choosing one theory to adopt at the beginning.

  Rules:
  1. The game proceeds in rounds. Each round, the instructor draws and reads an evidence card aloud and gives a copy to each lab (or projects it). 
  2. Each lab must decide whether their current theory (with its auxiliaries) is compatible with the evidence. 
     - If compatible, they get 1 point (publication credit) for that round.
     - If not compatible, they have two options:
          a) They can switch to a different theory that is compatible with the evidence. Switching costs 2 points (retooling cost). They then get 1 point for compatibility in that round (so net -1 for the round).
          b) Or, they can play their "blame the auxiliary" card (only once per game). This allows them to keep their theory by modifying an auxiliary. They must state how they modify the auxiliary (e.g., "The instrument was miscalibrated" or "There was an unknown background field"). They get 0 points for that round (because they are busy fixing the auxiliary) but keep their theory without switching. After using this card, they cannot use it again.

  3. The goal is to maximize points by the end of the game.

  Deck Construction:
  - The deck must be constructed so that at least two theories (let's say Theory A and Theory B) are compatible with every evidence card. These are the underdetermined pair. The other theories may be refuted at some point and become non-viable (so that by mid-game, only A and B remain as options).
  - At one point (around 2/3 of the way through), a critical evidence card is drawn that seems to refute both A and B. However, each lab (if they still have their "blame the auxiliary" card) can use it to save their theory. This forces the Duhem point.

  Timeline (for a 75-minute class):
  - Introduction and setup: 10 minutes
  - Gameplay: 45 minutes (about 15-20 rounds, but we can adjust the number of cards to the pace)
  - Debrief: 20 minutes

  Scoring:
  - Each compatible round: +1 point
  - Switching theory: -2 points (immediately upon switching, and then they get +1 for that round if the new theory is compatible, so net -1 for the round)
  - Using the "blame the auxiliary" card: 0 points for that round (so opportunity cost of 1 point, but no switching cost)

  Example of Theories and Evidence:

  Theories (for concreteness, let's have 4 theories):
  - Theory A: "All matter is made of strings." (Compatible with evidence that shows wave-like behavior)
  - Theory B: "All matter is made of particles." (Compatible with evidence that shows particle-like behavior)
  - Theory C: "All matter is made of continuous fields." (Will be refuted by evidence showing discrete events)
  - Theory D: "All matter is made of tiny bubbles." (Will be refuted by evidence that doesn't fit bubbles)

  Evidence examples (for a particle/string underdetermination):
  - Card 1: "Double-slit experiment: single particles show interference pattern." 
     - A: compatible (strings can interfere)
     - B: incompatible? But wait, we want both A and B to survive until the critical point. So we must design evidence that both can explain with auxiliaries.

  Actually, we need evidence that both A and B can explain. For example:

  - Card 1: "In a cloud chamber, tracks are observed that are straight and continuous." 
     - Theory A (strings): compatible if they assume strings can leave straight tracks under certain conditions (auxiliary: the string tension is high in this medium).
     - Theory B (particles): compatible (particles leave straight tracks).

  - Card 2: "In a diffraction experiment, a beam of electrons spreads out and shows a pattern." 
     - A: compatible (strings diffract)
     - B: must use an auxiliary? Actually, we can design it so that both are compatible without auxiliaries? Or we allow auxiliaries to be invoked at any time without cost? But note: the "blame" card is only for when the evidence seems to refute.

  We must be careful: the initial compatibility should be straightforward for A and B, but for other theories we may have refutations.

  Critical Evidence (for both A and B):
  - Card X: "In a new experiment, when particles are sent one by one through a double slit, they always arrive at the detector in discrete lumps, but the interference pattern builds up over time. However, when a which-path measurement is made, the interference pattern disappears and the lumps are always found along straight paths."
     - Both A and B can be saved by blaming an auxiliary:
          - A: "The measurement device disturbs the string's vibration, collapsing it."
          - B: "The measurement device forces the particle to choose a path."

  But note: without the blame card, they would have to switch? But if they have no other theory, they might be forced to use the blame card.

  Deck construction:
  - First few cards: compatible with all theories? Or better: let the first few cards refute C and D so that by round 5, only A and B are left. Then the next 10 cards are compatible with both A and B. Then the critical card that is incompatible with both A and B (unless they use the blame card).

  Retooling Cost: We include a switching cost of 2 points. Why? Because it represents the cost of changing the lab's entire research program, retraining, new equipment, etc. Without a cost, labs might switch too easily and the underdetermination wouldn't bite. With a cost, they have an incentive to stick with a theory and use the blame card when necessary.

  Failure Modes and Handling:
  1. Labs flip-flopping on every card early: If there's no switching cost, they might switch theories every round. But we have a cost, so they will think twice. However, if the cost is too low (or if they don't care about points) they might still switch. To handle: emphasize that the goal is to maximize points and that switching is expensive. Also, in the early rounds, if they switch too much, they'll run out of points and see the consequence.

  2. Someone refusing to use the evidence: A lab might ignore the evidence and stick to a refuted theory without switching or blaming. Then they get 0 points for that round and might get stuck. They will fall behind. The instructor can remind them that they are not getting points and that the goal is to maximize points. Also, in the debrief, we can discuss dogmatism.

  3. Labs might not understand how to use the blame card: Explain clearly that when an evidence card seems to refute their theory, they have the option to use the blame card (if they haven't used it) to save the theory by modifying an auxiliary.

  Debrief Structure:
  1. Map the game experience:
     - Transient underdetermination: The period when multiple theories (A and B) were compatible with all the evidence. The labs could not decide on the basis of the evidence alone. But note, future evidence (the critical card) had the potential to refute one of them (if they didn't use the blame card) — so it was transient.
     - Permanent underdetermination: Explain that in the game, the sealed world had a real mechanism (which we can reveal, e.g., "The world was governed by Theory A, but Theory B could always be saved by auxiliaries"). But note: even then, in principle, if we had access to the entire set of possible evidence, we might break the underdetermination. However, in philosophy, we consider cases where two theories are empirically equivalent — no possible evidence could distinguish them. The game cannot simulate that because we have a fixed deck and a real mechanism. So we must discuss examples of permanent underdetermination (e.g., the example of two theories that make identical predictions).

  2. On convergence: In the game, if one theory becomes dominant (say, because one lab is scoring high by sticking to A and using the blame card when needed, while others switch and lose points), we note that convergence might be driven by:
     - Evidence: But in the transient phase, evidence didn't favor A over B.
     - Non-evidential factors: Simplicity (if one theory is simpler), or the cost of switching (which made sticking to one theory more economical), or the limited availability of the blame card (so they couldn't save their theory forever). In the game, the convergence (if it happened) was likely driven by the retooling cost and the Duhem move, not by evidence alone. This illustrates the Duhem-Quine thesis: when a theory faces a refutation, you can always save it by adjusting auxiliaries, but at some cost.

  3. The Duhem point: The blame card allowed them to save their theory exactly once. In real science, you can keep adjusting auxiliaries, but it becomes increasingly costly (the theory becomes "degenerating"). The game abstracted that by allowing only one blame card.

  Reveal: At the end, the instructor can reveal that the world was built on Theory A (or B, but we must pick one). But note: because of the Duhem move, both could be saved. So the truth was one, but the other could be maintained by auxiliary adjustments.

  Final Game Design:

  Name: Underdetermination Lab Wars

  Materials:
  - 4 Theory Cards (Theories A, B, C, D)
  - 20 Evidence Cards (with the critical evidence at card 15, say)
  - 1 Blame the Auxiliary card per lab (physical card or just a token they turn in)

  Theories:
  - Theory A: String Theory - "All matter is composed of tiny vibrating strings. The properties of particles are determined by the vibration modes of these strings."
  - Theory B: Particle Theory - "All matter is composed of discrete, point-like particles that interact via forces."
  - Theory C: Field Theory - "All matter is continuous fields spread throughout space. Particles are excitations of these fields." (This will be refuted by evidence of discrete events)
  - Theory D: Bubble Theory - "All matter is composed of tiny, stable bubbles in a fluid-like medium." (This will be refuted by evidence that doesn't fit bubble behavior)

  Evidence Cards (examples, 20 total):
  - Cards 1-5: 
     - Card 1: "Cloud chamber experiment: straight, continuous tracks are observed." 
          - A: Compatible (strings can leave straight tracks if under tension)
          - B: Compatible (particles leave straight tracks)
          - C: Compatible (fields can have localized excitations that leave tracks)
          - D: Compatible (bubbles can leave tracks)
     - Card 2: "Electron diffraction: a beam of electrons passes through a crystal and produces a diffraction pattern."
          - A: Compatible (strings diffract)
          - B: Compatible if they invoke wave-particle duality (an auxiliary they start with? but we don't have auxiliaries at the start) -> We must design so that without any auxiliary, it's incompatible for B? But then they might switch too early. Instead, we say that B includes wave-particle duality as part of the theory? Then it's compatible. Similarly for A. So we must state the theories with enough breadth.

  Alternatively, we can let the evidence be compatible with multiple theories without auxiliaries at the beginning, and then have evidence that requires auxiliaries only for the critical card.

  Better: In the initial theory cards, we state that each theory comes with a set of core claims and typical auxiliaries. But to keep it simple, we can assume that the theories are formulated broadly enough to be compatible with the early evidence without needing to invoke additional auxiliaries (until the critical evidence).

  Card 3: "Photoelectric effect: electrons are ejected from a metal surface only when light above a certain frequency is used, regardless of intensity."
     - This is compatible with particle theory (B) and string theory (A) if we assume they can explain quanta. But field theory (C) might have trouble without quantization. Bubble theory (D) might also be incompatible? So we can design to refute C and D.

  Card 3: 
     - A: Compatible (strings have quantized vibrations)
     - B: Compatible (particles can absorb quanta)
     - C: Incompatible (if C is classical field theory) -> they must switch or use blame card? But we want to refute C and D without the blame card being used so early. So we set:
          - C: Incompatible (unless they use an auxiliary, but we don't want that until later) -> so they must switch or use the blame card. But we want to eliminate C and D by mid-game.

  So let's have a few early cards that refute C and D. For example:

  Card 3: "Observation of discrete energy levels in atoms: electrons only exist at specific energy levels."
     - A: Compatible (string vibrations are quantized)
     - B: Compatible (particles in orbits have quantized energy)
     - C: Incompatible (classical fields don't have discrete levels) -> C must switch or use blame. But we want them to switch because we want to eliminate C.
     - D: Incompatible? (bubbles might not have discrete energy) -> so D must switch.

  So after card 3, labs that started with C or D will likely switch to A or B (paying the cost). Then by card 5, only A and B labs remain.

  Then cards 5-14: evidence compatible with both A and B.

  Card 15 (critical): "Double-slit experiment with which-path measurement: when the path is measured, the interference pattern disappears and particles are detected in clumps at the screen, but without measurement, an interference pattern builds up from many particles."
     - This is the standard quantum mystery. 
     - For A: Without auxiliary, it might be incompatible because strings should show interference even when one string is sent? But they can blame the auxiliary: "The measurement device collapses the string's wave function."
     - For B: They can blame: "The measurement forces the particle to choose a path."

  So both can use the blame card to save their theory.

  Then cards 16-20: More evidence that is compatible with both A and B (so if they used the blame card, they can continue; if not, they must switch and pay the cost).

  End of the game: The lab with the most points wins.

  Debrief Points:

  1. Transient vs. Permanent:
     - The underdetermination between A and B was transient because the critical evidence (card 15) had the potential to refute both (if they didn't have the blame card) and in fact, if we had continued with more evidence, we might have broken the underdetermination. But note: even after the blame card, both theories were saved. However, the game had a fixed set of evidence and we could imagine more evidence that might break the tie. In contrast, permanent underdetermination would be if two theories made exactly the same predictions for all possible evidence. Example: two different formulations of the same physical theory (like Hamiltonian vs. Lagrangian mechanics) or two theories that are empirically equivalent by design (e.g., a theory and its "evil demon" counterpart).

  2. Why did labs converge (if they did)? 
     - In the game, convergence on one theory (say A) might have occurred because:
          - A lab that started with A and stuck with it (using the blame card when needed) avoided switching costs and accumulated more points.
          - Labs that started with C or D had to switch early (paying the cost) and then stuck with A or B. 
     - Thus, convergence was driven by the retooling cost and the initial choice, not by the evidence. This mirrors scientific practice: once invested in a research program, scientists try to save it with auxiliaries and avoid switching.

  3. Duhem Point: The blame card illustrated that when a theory is refuted by evidence, it's the whole bundle (theory + auxiliaries) that is tested. By allowing one auxiliary adjustment, the game showed that a theory can be saved, but at a cost (they lost a point for that round and the opportunity to use it again). In real science, scientists can make multiple auxiliary adjustments, but this leads to a "degenerating research program" (Lakatos).

  Reveal: The sealed world was based on Theory A (String Theory). But Theory B was saved by auxiliary adjustments. So the truth was A, but B could not be ruled out by the evidence.

  Failure Modes:
  - First-time problems:
     a) Labs may not understand the evidence or how it relates to theories. Solution: Make the evidence clear and provide a cheat sheet of theories.
     b) Labs might not take the points seriously. Solution: Announce the scores periodically and create a leaderboard to foster competition.
     c) A lab might use the blame card too early (on a minor refutation) and then be defenseless at the critical evidence. Solution: Advise them that the game has a critical moment, but don't reveal when. This is part of the strategy.
     d) Time: 45 minutes might be tight for 20 rounds. Solution: Use fewer rounds (12-15) or have some rounds with multiple evidence cards.

  How to handle:
  - Walk around and help labs interpret evidence.
  - Keep rounds brisk (about 2 minutes per round: present evidence, labs discuss for 1 minute, then they write their decision and you record).

  This game should make them feel the underdetermination and the Duhem problem.
answer: |-
  ### Underdetermination Lab Wars: Game Design

  #### **Materials**
  - **Evidence Deck**: 15 sealed cards (pre-written by instructor, order fixed).  
  - **Theory Sheets**: 4 distinct theories (A, B, C, D) printed on handouts for all labs.  
  - **Blame Cards**: One "Blame the Auxiliary" token per lab (e.g., colored index card).  
  - **Scoreboard**: Visible to all (e.g., whiteboard).  
  - **Timer**: For enforcing quick rounds.  

  #### **Theories**  
  *(Distributed at start; all labs receive all four)*  
  1. **Theory A (Strings)**: "All matter consists of vibrating strings. Energy states are continuous."  
  2. **Theory B (Particles)**: "All matter consists of discrete particles. Energy states are quantized."  
  3. **Theory C (Fields)**: "All matter is excitations of continuous fields. Energy is fluid."  
  4. **Theory D (Holograms)**: "All matter is projected from a 2D surface. Energy states are pixelated."  

  #### **Rules**  
  1. **Setup** (5 mins):  
     - Split class into 3 labs (6 students each).  
     - Each lab picks a starting theory. Switching later costs points (see below).  
     - Give each lab their Blame Card (one-time use).  

  2. **Rounds** (1–2 mins per round, 12 rounds total):  
     - Instructor reveals one evidence card. Labs discuss compatibility with their *current* theory.  
     - **Compatible?** Lab gets +1 point ("publication credit").  
     - **Incompatible?** Two choices:  
       - **Switch theories**: Pay -2 points ("retooling cost"). Then, if new theory fits, get +1 point (net: -1).  
       - **Use Blame Card**: Explain how an *auxiliary assumption* (instrument error, background condition) saved their theory. Get 0 points that round. Card is discarded.  

  3. **Winning**:  
     - Points tracked publicly. Most points wins.  
     - **Critical Twist**:  
       - Rounds 1–8: Evidence eliminates C and D (e.g., Card 5: "Quantized energy spikes observed").  
       - Rounds 9–12: Only A and B fit all evidence (transient underdetermination).  
       - Round 10: "Smoking gun" card refutes *both* A and B if no Blame Card played (e.g., "Simultaneous wave/particle behavior with no collapse").  

  #### **Evidence Deck Structure**  
  - Cards 1–4: Compatible with all theories.  
  - Cards 5–8: Refute C and D (e.g., "Continuous field decay not observed").  
  - Cards 9–12: Compatible only with A and B (e.g., "Interference patterns in vacuum").  
  - Card 10 ("Critical"): Appears to refute A and B (triggers Duhem moment).  
  - Cards 11–12: Final evidence fits A and B.  

  #### **Retooling Cost Scheme**  
  - **Switching costs -2 points** (defended below).  
  - **Why this scheme?**  
    Scientific inertia is real—abandoning a theory wastes resources (grants, training, equipment). A cost discourages flip-flopping and mirrors real-world "sunk costs." Without it, labs switch frivolously early on, undermining the underdetermination lesson when A and B later stalemate. Points incentivize strategic commitment.  

  #### **Timeline**  
  - 0–5 mins: Setup (form labs, distribute materials).  
  - 5–50 mins: Gameplay (12 rounds × 2.5 mins each + transitions).  
  - 50–65 mins: Debrief (structured below).  
  - 65–75 mins: Q&A.  

  ---  

  ### **Predictable Failure Modes & Fixes**  
  1. **Flip-Flopping Early**:  
     - Labs switch theories every round to avoid incompatibility.  
     - **Fix**: Enforce retooling cost (-2 points) and tight timing (use timer). After 2 switches, labs see point drain and stabilize.  

  2. **Refusing Evidence**:  
     - A lab ignores evidence, keeps theory despite incompatibility.  
     - **Fix**: Award 0 points for incompatibility (no passive option). Peer pressure from public scores forces engagement.  

  3. **Blame Card Misuse**:  
     - Labs use it early on minor evidence, leaving them defenseless later.  
     - **Fix**: Hint pre-game: "Save your Blame Card—big tests come late." Let failure teach the cost of hasty auxiliaries.  

  4. **Analysis Paralysis**:  
     - Labs over-discuss simple rounds.  
     - **Fix**: Strict 60-second discussion limit. Award points only to labs deciding on time.  

  ---  

  ### **Debrief: Mapping Game to Philosophy**  
  *(20 mins; instructor-led discussion)*  

  #### **1. Transient vs. Permanent Underdetermination**  
  - **What happened**:  
    - Early rounds showed *transient underdetermination*: Many theories fit evidence, but future data could (and did) refute C/D.  
    - Mid-game (rounds 9–12) forced *transient stalemate*: A and B both fit all evidence, but Card 10 threatened both. Blame Cards saved them, postponing refutation.  
  - **Honest Limits**:  
    - The game only models *transient* underdetermination because the "sealed world" (evidence deck) had a real, hidden mechanism (Theory A was true). Future evidence *could* break the deadlock (e.g., a "no-auxiliary" test).  
    - **Permanent underdetermination** (no possible evidence could decide) *cannot* be simulated in a game with a fixed truth. Instead, mention examples:  
      - Newtonian vs. General Relativity in a vacuum (same predictions).  
      - String Theory vs. Loop Quantum Gravity (currently empirically equivalent).  

  #### **2. Why Convergence? Evidence or Bias?**  
  - **The Stand**: Convergence (if labs coalesced around A/B) was driven by *simplicity bias*, not evidence.  
  - **Why**:  
    - Early evidence refuted C/D for being complex (e.g., requiring "hidden forces" to explain quantization).  
    - A and B survived because they were *equally simple*—both used minimal auxiliaries until forced. Point penalties punished overcomplicated switches.  
  - **Broader Lesson**: Science often converges not just from data, but from epistemic values (simplicity, elegance) when evidence underdetermines.  

  #### **3. Duhem-Quine Thesis**  
  - **Game Link**: Blame Cards forced labs to see that evidence tests the *whole web* (theory + auxiliaries).  
  - **Cost of Saving**: Using the Blame Card cost a publication (0 points), mirroring how ad-hoc auxiliaries erode a theory’s credibility in real science.  

  #### **4. Reveal the "World"**  
  - End by disclosing the hidden truth: "Theory A (Strings) governed the evidence deck."  
  - Discuss: Why did B survive? Because auxiliaries (e.g., "experimental error") insulated it from falsification.  

  ---  
  **Final Note**: This design forces labs into underdetermination through evidence constraints and penalties. It makes the Duhem problem visceral—blaming auxiliaries feels like a tactical retreat, not an abstract idea. Run it tightly, and the debrief will bridge gameplay to permanent underdetermination.
