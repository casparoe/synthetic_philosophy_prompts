  Here’s the satirical op-ed followed by a detailed commentary section for your lecture prep. The goal is to provoke discussion by taking revealed preference logic to (absurd) extremes while staying internally consistent.

  ---

  **OP-ED: "In Praise of Real Data: Why Your ‘Feelings’ Are Economically Irrelevant"**  
  *By Reginald Thorne, Retired Senior Cost-Benefit Analyst, Bureau of Economic Efficiency*  

  We live in an age of sentimentalism. Policymakers fawn over "happiness surveys," journalists weep over "stress levels," and academics peddle "well-being indices" as if subjective whim were data. As someone who spent three decades ensuring taxpayer funds followed *evidence*, not emotion, I feel compelled to reintroduce rigor to the conversation.  
    
  Consider the commute. My neighbor, Herbert, drives two hours each way to work. He groans about traffic, calls it "soul-crushing," and votes for candidates promising high-speed rail. Yet every morning at 7:00 AM, there he is: in his Toyota, engine running. What do we learn? Herbert’s lamentations are **cheap talk**. His *choice*—the cold, hard fact of ignition-key-turning—reveals his true preference: he values that job (or the income it provides) more than 20 extra weekly hours of leisure. If he disliked it sufficiently, he’d choose differently. Full stop.  
    
  This is the beauty of revealed preference theory, pioneered by Paul Samuelson. We need not speculate about Herbert’s "utility." His actions speak plainly: *commuting ≻ alternatives*. When he says he’s miserable, he’s merely describing a cost he’s willingly paying. Economists call this "optimal."  
    
  The same logic clarifies so-called "irrational" behaviors. Take the Ultimatum Game: Player A offers Player B a split of $10; if B rejects, both get nothing. Behavioral types wring their hands when B refuses a "unfair" $2 offer, calling it "emotional." Nonsense! Player B’s rejection reveals a preference: *$0 ≻ $2 under those terms*. They’re not "worse off"—they’ve optimized given their idiosyncratic trade-offs (perhaps a taste for reciprocity or spite). Where’s the problem?  
    
  Even grief isn’t immune to this analysis. At my sister’s funeral, relatives wept openly. Yet not one skipped the event. Their attendance, despite the emotional cost, revealed a preference: *public mourning ≻ private solace*. The tears? Merely an expenditure of psychic resources consistent with their choice. To claim they’d be "happier" skipping the funeral is to ignore the data of their presence.  
    
  Which brings me to happiness surveys. Asking people to rate "life satisfaction" on a scale of 1–10 is pseudoscience. Declaring "I’m a 4" costs nothing; choosing to remain in the circumstances making you a "4" is everything. If you stay, you prefer it to your options. What more is there to say?  
    
  Modern economics risks backsliding into Victorian psychologizing. Robbins taught us that interpersonal utility comparisons are metaphysical nonsense. Samuelson freed us from unobservable "utils." Let’s honor that legacy: respect choices, ignore chatter, and remember—if it isn’t revealed, it isn’t real.  
    
  ---

  ### Commentary for Instructor (Not for Undergrads)  
  **Where the Parody Stretches/Strawmans Actual Revealed Preference Theory**  

  1. **Preference ≠ Welfare Distinction (Strong Pushback Point)**  
     - **Parody:** Thorne equates "revealed preference" with "welfare." He implies that because Herbert chooses commuting, it *improves his welfare*.  
     - **Reality:** Most revealed preference theorists (even Samuelson) distinguish *observed choice* from *well-being*. A choice can be consistent with preferences but still reduce welfare (e.g., addiction, misinformation). Modern RP (e.g., Afriat) focuses on *consistency of choices*, not welfare judgments. **Confidence: High** – This is a core nuance missed in the parody.  

  2. **Adaptive Preferences & "Cheap Talk" Dismissal (Partial Strawman)**  
     - **Parody:** Thorne treats all self-reports as economically irrelevant.  
     - **Reality:** While RP prioritizes choices, practitioners don’t universally dismiss statements. Sen’s work on "adaptive preferences" (e.g., the oppressed reporting contentment) acknowledges that stated preferences can reveal constraints. Surveys might signal *potential* choice inconsistencies. **Confidence: Medium-High** – Thorne’s absolutism is exaggerated, but the RP mainstream *is* skeptical of self-reports.  

  3. **Emotional Expression as "Expenditure" (Extreme but Logically Consistent)**  
     - **Parody:** Funeral tears as "psychic expenditure" aligns with RP’s avoidance of psychology.  
     - **Reality:** This is hyper-literal but *internally consistent* with strict RP. However, even hardliners like Becker ("rotten kid theorem") allow for interdependent preferences. Crying could reveal a preference for social signaling. **Confidence: Medium** – The logic holds, but actual economists wouldn’t analyze grief this reductively.  

  4. **Samuelson vs. Robbins Conflation (Minor Historical Quibble)**  
     - **Parody:** Thorne merges Samuelson’s RP with Robbins’ ordinalism/anti-comparability.  
     - **Reality:** Samuelson’s early RP work *assumed* ordinal utility but focused on observable choices. Robbins’ prohibition on interpersonal comparisons is related but distinct. **Confidence: High** – Defensible simplification for parody.  

  5. **Ultimatum Game Rejection (Accurate but Incomplete)**  
     - **Parody:** Calling rejection a "preference for $0" is technically valid under RP axioms.  
     - **Reality:** RP can describe this, but behavioral econ uses it to *challenge* RP’s descriptive adequacy (e.g., incorporating fairness). **Confidence: High** – Thorne’s take is what a hardliner *would* say, but it ignores why the game is studied.  

  **Least Confident Attribution: Robbins on Grief**  
  - Thorne implies Robbins would endorse analyzing funeral attendance as strictly preference-revealing. **Flag this:** Robbins focused on *methodology*, not specific applications. While his *Essay on the Nature of Significance of Economic Science* (1932) rejects psychological introspection, applying this to grief is the parody’s extension, not a direct Robbins quote. Say: *"Thorne is extrapolating Robbins’ principles to an extreme case—this is polemical, not textual."*  

  **Pedagogical Safeguards**  
  - **Stress:** "Thorne represents a *caricature* of strict revealed preference to provoke thought. Real-world practitioners use RP as a tool for testing rationality, not denying psychology."  
  - **Bridge to Lecture:** "Where does Thorne’s logic fail? When should we *not* infer welfare from choice? Let’s dissect the axioms he implicitly relies on..."  

  This approach lets you satirize the extreme position while leaving room to explore nuance. The undergrads will enjoy the op-ed’s audacity, and you can pivot gracefully to serious discussion. Good luck!
