answer: |-
  ## The Substance of Sameness: Adjudicating Mechanistic Identity for Anomaly Detection

  The ambition of Mechanistic Anomaly Detection (MAD) is profound and necessary: to peer beneath the veneer of a model's outputs and activation magnitudes, seeking evidence that the *internal process* generating those outputs has fundamentally shifted off-distribution. Yet, this ambition founders on the foundational question: when are two neural computations instances of the "same mechanism"? Without a rigorous account of mechanistic sameness, MAD risks collapsing into behavioral monitoring or succumbing to paralyzing nihilism where nothing ever repeats. We examine four candidate accounts, weigh their merits against MAD's core desiderata – flagging genuinely novel computations despite plausible outputs, while ignoring routine variation – and grapple with granularity and transitivity. The verdict points towards the training-based account as the most viable foundation.

  **Candidate Accounts and Their Challenges**

  1.  **Conventional Coarse-Graining:** This view holds that mechanistic sameness is defined by designer-chosen abstractions. Two computations are the "same mechanism" if their detailed activities map onto the same node or pathway in a deliberately simplified computational graph. For example, detecting "object recognition" regardless of the specific low-level feature combinations used.
      *   *Strengths:* Pragmatic, aligns with human interpretability goals, allows flexible definition of "out-of-character."
      *   *Weaknesses:* Introduces arbitrariness. What level of abstraction is "correct"? A coarse detector might miss novel sub-mechanisms within an abstractly "same" process (e.g., a novel adversarial circuit exploiting a high-level "object" node). Conversely, fine granularity risks flagging benign noise. Most critically, this makes MAD's "ground truth" subjective, dependent on the detector designer's choices rather than properties intrinsic to the model. Granularity is fixed by convention, not discovered. Transitivity holds within the chosen abstraction but breaks across levels.

  2.  **Causal Role Sameness:** Two computations are the same mechanism if interventions on corresponding internal states (neurons, layers, vectors) produce corresponding changes in downstream effects *relative to a specified level of description*. Sameness is defined by the structure of counterfactual dependencies.
      *   *Strengths:* Objective (given a level of description), grounded in counterfactual reasoning central to understanding systems. Captures the functional essence of a mechanism – *what it does* in the causal web.
      *   *Weaknesses:* Requires specifying the "level of description" (granularity problem) and the scope of "corresponding effects." Defining "correspondence" non-circularly is difficult. Crucially, a novel computation could *mimic* the causal role of a trained one for a specific output, despite internal divergence (e.g., a different circuit achieving the same input-output mapping on a subset of inputs). MAD would miss this. Transitivity is problematic: if computation A has the same causal role as B for output Y, and B as C for output Z, A and C may have wildly different roles for other outputs, violating the threshold needed for anomaly detection.

  3.  **Training-Based Regularity:** A mechanism is a pattern of internal computation that was *selected and reinforced by the training process*. Mechanistic sameness means the input triggers a computation that relies on internal regularities (features, circuits, dynamics) that training established. MAD flags inputs where the model relies on regularities *not* reinforced by training.
      *   *Strengths:* Directly ties mechanism identity to the model's learning history, avoiding external arbitrariness. Granularity emerges naturally – training reinforces functional units at various scales (individual features, co-adapted groups, circuits). It directly targets MAD's goal: detecting exploitation of *untrained* internal structure. Transitivity issues are mitigated because the question is binary: "Was this specific regularity reinforced by training?" not "Is this regularity *equivalent* to another?"
      *   *Weaknesses:* Defining "reinforced regularities" operationally is challenging. Does it require explicit regularization? Mere repeated activation? How to distinguish a novel *use* of a trained circuit from a truly novel circuit? Requires access to or inference about the training dynamics.

  4.  **Deflationary Usefulness:** "Same mechanism" is merely a label for whatever internal property enables a detector to usefully distinguish genuinely novel computations from routine variation. There is no deeper metaphysical truth; success is defined by the detector's empirical utility.
      *   *Strengths:* Pragmatic, avoids philosophical quagmires. Focuses on what matters: building an effective detector.
      *   *Weaknesses:* Provides *no guidance* for designing the detector or understanding *why* it works. It dissolves the conceptual question MAD poses rather than answering it. Without a substantive account, it risks conflating correlation with causation in the detector's signal or simply rediscovering behavioral differences masked as mechanism.

  **Adjudication: The Primacy of the Training Process**

  The training-based account offers the most coherent and purpose-built foundation for MAD. Its strengths align directly with the core motivation: catching when a model is "doing something genuinely new" off-distribution, even if the output is plausible.

  *   **Why the others fall short:** Conventional coarse-graining outsources the definition, making MAD's core concept arbitrary. Causal role sameness, while appealingly objective, is vulnerable to mimicry – a novel computation could satisfy the causal role for a specific output while being internally alien, evading detection. The deflationary view abdicates the explanatory burden entirely.
  *   **Granularity Handled:** The training process naturally promotes multi-scale structure. Low-level features (edges, textures) are reinforced early, while higher-order circuits (object detectors, syntactic parsers) emerge through later co-adaptation. A MAD system based on training can, in principle, detect anomalies at multiple levels: a novel combination of well-trained features, a novel feature itself, or a novel circuit bypassing trained ones. The relevant granularity isn't fixed a priori but emerges from what the training data and process selected.
  *   **Transitivity Mitigated:** The key question shifts from "Is computation A *the same as* computation B?" to "Did the training process reinforce the specific regularity exploited by computation X?". This is fundamentally a historical/developmental question about the model, not an equivalence relation between computations. While defining the scope of "a regularity" has nuances, it avoids the transitivity cliff-edge inherent in equivalence-based thresholds.
  *   **Meeting MAD's Desiderata:**
      *   *Flagging Novelty Despite Plausible Outputs:* Consider a language model trained on standard text. Suppose it encounters subtly adversarial text exploiting a novel circuit that bypasses its trained "safety guardrails" but still produces a harmless-seeming output (e.g., generating a bland summary while internally activating a completely novel pathway related to an unintended concept). A training-based MAD detector, looking for reliance on *untrained* internal patterns, could flag this. The output is plausible, activations might be within normal ranges statistically, but the *route taken* relies on a structure training didn't establish.
      *   *Ignoring Routine Variation:* Paraphrases, noisy inputs, or unfamiliar surface content (e.g., a new word in a familiar syntactic structure) processed using the *combination of trained features and circuits* that handle variation would *not* be flagged. The model is using its reinforced toolkit, even if the specific input pattern is novel. The computation relies on established regularities.

  **The Verdict and Its Implications**

  The training-based account of mechanistic sameness provides the most principled and operationally meaningful foundation for MAD. It grounds "mechanism" in the model's actual learning history, directly targets the exploitation of untrained internal structure, naturally accommodates multi-scale granularity, and avoids the most severe pitfalls of transitivity inherent in equivalence relations. While significant challenges remain – chiefly, how to rigorously *identify* and *measure* reliance on training-reinforced regularities within a complex network – this approach offers a clear direction: MAD should seek to detect computations that depend on internal patterns *not* sculpted by the training optimization process. This makes the concept of "out-of-character" internal behavior substantive, tying it to the model's developmental origin rather than arbitrary abstraction or potentially mimicked function. The path forward lies in developing methods to audit a model's computational lineage, distinguishing the familiar ghosts of its training from genuinely novel phantoms arising in the uncharted territories of its inputs.
