  3. A person who memorized the driver's manual cover to cover and has watched hundreds of hours of dashcam footage but has never once sat in the driver's seat: does not know how to drive.
  4. R. herself after two drinks, unable to walk a straight line to the taxi: still knows how to walk.
  5. Her cousin, a serious pianist decades ago who hasn't touched a piano in twenty-five years and now fumbles through an easy piece: does not know how to play piano — R. says he knew how once and doesn't now.
  6. A strong swimmer who has a panic response in open water and physically cannot make herself wade past her waist, though she swims laps daily in a pool: knows how to swim in open water — her body just won't let her, as R. puts it.

