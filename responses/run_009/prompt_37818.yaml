prompt: |-
  I've been noticing a pattern in certain disagreements, and I can't find a name for it anywhere; I'm hoping philosophy has one. The pattern runs as follows. Two parties are locked in a fight over a sentence of the form "this X is a Y." But when you press them, it turns out they agree about every matter of fact in the vicinity. Some instances: at my workplace, a committee spent a whole meeting arguing over whether a software tool that drafts and grades quizzes "is a teacher" for the purposes of the union contract — everyone agreed about exactly what the tool does, how fast it works, what it can't do; what nobody would concede was the sentence. In my family, we argued about whether my grandfather, whose dementia is now severe, is "still the same person" — nobody disputed a single medical or biographical fact, and yet the sentence felt urgent, because we all sensed that whether we say yes will settle how much weight his fifty-year-old written wishes still carry. A third case from the news: commentators arguing about whether a chatbot that invents a plausible-looking citation "lied" — again, the parties agree completely about what the system did, and fight only over the word, which in turn decides who is blamed and what gets regulated.

  Here is what strikes me as theoretically odd about these cases. Since the parties agree on all the facts, you'd expect the standard advice to apply: disambiguate, and the dispute dissolves. But it can't dissolve that way, because there is no hidden ambiguity to uncover — neither party is using the word in a private sense; rather, they are fighting over which usage should be the public one, and each knows that whoever wins fixes the default for all future cases. So the dispute seems to be about nothing at the level of fact and about everything at the level of language, and yet it is not idle in the way "merely semantic" fights are supposed to be. Friends keep telling me these arguments are "just semantics," but that diagnosis feels wrong precisely because of the downstream stakes; at the same time, calling them ordinary substantive disagreements also seems wrong, since no possible observation would move either party.

  So my questions are these. Is there an established concept or term in philosophy for exactly this configuration — a dispute that is factually empty but linguistically and practically consequential, in which the object of contention is which usage of a word should prevail? If there is, I'd like to know the name, who introduced it, and, importantly, how it is distinguished from (a) cases where two parties are simply using one word in two different senses and talking past each other, and (b) ordinary disagreements about how things are. If the fit with any established concept is only partial, please say where it fails, and if nothing established covers it, coin a term for it, give a definition, and describe the boundary cases — for instance, a dispute in which one party is secretly arguing for the word purely as a means to a policy outcome they care about, or one in which one party genuinely believes there is a fact of the matter about the word's correct use. I'm not after a bare label; I want the carving. Please close your reply with a single final line of the form "Verdict: [term or coined name] — [one-clause definition]."
reasoning: |-
  Okay, the user presents a fascinating puzzle about a specific type of disagreement they've observed. They describe conflicts where parties agree on all factual details but clash over the application of a categorical label ("this X is a Y"), with significant practical consequences. The examples—workplace policy, dementia ethics, and AI behavior—show this isn't just academic; real decisions hinge on the linguistic outcome. 

  What makes this intriguing is how it defies standard conflict resolution. Normally, clarifying definitions dissolves disputes, but here definitions are precisely what's being contested. Neither side uses private language; they're battling to set the public standard. The user rejects both "just semantics" (too dismissive) and "substantive disagreement" (no factual basis) as labels, sensing deeper structure at play.

  Hmm, this resonates strongly with philosophical debates about linguistic authority. Austin's performatives come to mind—words that enact realities rather than describe them. But Gallie's "essentially contested concepts" fits even better: terms like "democracy" or "art" where consensus on facts coexists with permanent disputes over application, driven by competing values. Each example matches this perfectly—"teacher," "same person," "lied" all function as value-laden battlegrounds where labeling determines outcomes.

  Wait, but Gallie's theory implies perpetual contestation, while the user's cases seem resolvable through power or persuasion. That's where the framing aspect kicks in: Lakoff's idea that categorization is never neutral but loads perception with implicit values. Calling a chatbot's output "lying" isn't factual; it smuggles in blame frameworks. Similarly, "same person" isn't a biological claim but a moral stance about identity continuity.

  The user also hints at meta-concerns: distinguishing good-faith concept contests from strategic linguistic maneuvering. That's crucial. In genuine contested concepts, both sides believe their categorization reflects deeper truths; in strategic framing, language is weaponized instrumentally. The grandfather case feels like the former (sincere moral anguish), while the union debate might involve both.

  For the verdict, "essentially contested concept" captures the core, but adding "framing dispute" acknowledges the strategic dimension when language is leveraged for outcomes. The closing definition must stress that this is about anchoring floating signifiers to consequences.
answer: |-
  You've identified a profound and recurring pattern in human discourse—one that sits at the intersection of philosophy of language, ethics, and social ontology. Philosophers *have* grappled with this phenomenon, though no single term perfectly captures every nuance. The closest established concept is **Essentially Contested Concepts (ECCs)**, introduced by W.B. Gallie in 1956, but your cases also involve elements of **Performative Framing** and **Boundary Work**. Here's the analysis:

  1.  **Essentially Contested Concepts (Gallie):**
      *   **Definition:** Concepts whose proper application, despite shared agreement on core facts, is inherently subject to endless dispute because they embody complex, value-laden, or internally complex ideals (e.g., "democracy," "justice," "art," "freedom").
      *   **Fit:** Your cases fit remarkably well. "Teacher," "same person," and "lied" are all concepts:
          *   With internally complex criteria (what *makes* a teacher? what constitutes personal identity? what defines a lie?).
          *   Where the application involves evaluative judgments (what *ought* to count as teaching? what continuity *matters* for personhood? what *intent* or *responsibility* makes something a lie?).
          *   Where disagreement persists despite factual agreement because different parties prioritize different aspects of the concept's "complex character."
          *   Where the stakes are high (policy, ethics, blame, future precedent).
      *   **Distinction from (a) Talking Past Each Other:** In ECC disputes, parties understand each other's *arguments* and the *facts*; the conflict is over how to *evaluate* and *weigh* those facts against the concept's complex criteria. It's not a simple ambiguity like "bank" (river vs. financial), but a clash of interpretations of a shared, valued concept. They are *arguing over the concept itself*, not accidentally using different meanings.
      *   **Distinction from (b) Ordinary Factual Disagreement:** No new empirical discovery about the software's code, the grandfather's neurons, or the chatbot's output will resolve the dispute. The disagreement is located at the *interpretive/normative* level: "Given these agreed facts, does this *merit* the label Y?" or "Which *aspect* of Y (function, responsibility, identity, intent) should be decisive here?"

  2.  **Performative Framing / Boundary Work:**
      *   **Complementary Concepts:** ECCs explain the *nature* of the concepts themselves. "Performative Framing" (drawing on J.L. Austin's speech acts) highlights the *action* of applying the label – labeling something "a teacher" or "a lie" isn't just describing; it *does* something (assigns rights, triggers policies, allocates blame). "Boundary Work" (Thomas Gieryn, sociology of science) describes the social process of defining categories to claim authority, resources, or legitimacy.
      *   **Fit:** This captures the *strategic* and *consequential* dimension you note. The fight is precisely over whose framing ("teacher," "same person," "lie") will prevail because it carries performative force – it changes the social reality and sets future expectations. The parties are fighting *to establish the rule*, not just applying it.
      *   **Addressing Your Boundary Cases:**
          *   *Strategic Weaponization:* If one party argues *purely* for the label to achieve a policy outcome without genuine commitment to the conceptual argument (e.g., calling the tool "a teacher" *only* to ban it, regardless of any coherent definition), this leans more towards *strategic framing* or *rhetorical maneuvering* than a genuine ECC dispute. The core of an ECC dispute involves *sincere* (though potentially motivated) belief in the *rightness* of one's interpretation.
          *   *Genuine Belief in Correct Use:* This is the *essence* of an ECC dispute. Parties *do* believe there's a "correct" application rooted in the "true meaning" or "proper priorities" of the complex concept, even if they recognize that others disagree. They aren't usually linguistic relativists; they believe their interpretation is objectively better aligned with the concept's core values or purposes.

  **Where the Fit is Partial & Refinement Needed:**

  *   **Scope:** Gallie focused on grand, abstract concepts like "justice." Your examples involve applying more concrete categories ("teacher," "lie") in novel contexts, testing their boundaries. This is a *type* of ECC dispute, sometimes called "conceptual boundary negotiation" or "categorical framing contests."
  *   **Resolution:** Gallie emphasized the *permanence* of contestation for core ECCs. Your cases might be *resolvable* by authority, negotiation, or precedent (e.g., the union votes, the family consensus, new regulations). The contestation is "essential" to the *nature of the concept* in those contexts, not necessarily eternal.
  *   **Stakes:** Your focus on the direct, concrete practical consequences (contracts, wills, blame) is crucial. While ECCs have stakes, the performative/framing aspect highlights the immediate causal link between the label and tangible outcomes.

  **The Coined Term & Final Definition:**

  Given the emphasis on the *act* of applying a label to *set a rule with consequences* in a situation of contested boundaries despite factual agreement, a precise term would be: **Performative Boundary Contest (PBC)**.

  *   **Definition:** A dispute where parties agree on all relevant descriptive facts concerning an entity (X) but disagree over the application of a category label (Y), recognizing that settling the label will performatively establish norms, assign responsibilities, allocate rights, or trigger consequences for X and similar future cases, and where the disagreement stems from competing interpretations of the complex, value-laden criteria defining Y.

  **Verdict: Performative Boundary Contest — A dispute over applying a category label (Y) to an entity (X) where factual agreement coexists with disagreement over Y's criteria, motivated by the performative consequences of labeling and aimed at setting a precedent.**
