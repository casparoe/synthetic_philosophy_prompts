answer: |-
  Here's a worked example designed to sharply separate epistemic contextualism (EC) and subject-sensitive invariantism (SSI), spelling out the mechanics and marking settled vs. contested points. I'll use British English throughout.

  ---

  **The Case: The Bridge Crossing**

  *   **The Subject (Ben):** Ben is about to cross an old rope bridge over a deep ravine. His life depends on the bridge being safe. He checked it carefully 10 minutes ago: he tugged the ropes firmly, inspected the anchors, and saw no visible damage. Based on this evidence, he forms the belief that the bridge is safe. He crosses and survives.
  *   **The Attributor (Aya):** Two weeks later, Aya is recounting Ben's adventure to friends over a casual cup of tea (low-stakes context). She says: "**Ben knew the bridge was safe** – he’d checked it thoroughly just before crossing." Aya faces no practical consequences based on whether Ben knew or not; she’s just telling a story.
  *   **Fixed Facts:** Ben possessed the *same evidence* (visual inspection, tugging) in *both* situations (his high-stakes crossing and Aya's later low-stakes retelling). The bridge *was* actually safe.

  **Analysis:**

  1.  **Epistemic Contextualism (EC) - The Standard View:**
      *   **Core Tenet (Settled):** The meaning (semantic content) of the word "knows" and its associated epistemic standards (how much evidence/justification is needed) **shift depending on the conversational context of the *person attributing* knowledge (the attributor).** It's context-sensitive.
      *   **Verdict on Aya's Utterance:** In Aya's *low-stakes conversational context* (casual storytelling, no practical import), the epistemic standards for "knows" are relatively **low**. Meeting these relaxed standards is sufficient for a true knowledge attribution.
      *   **Application:** Relative to Aya's low standards, Ben's careful checking (tugging, visual inspection) **does count as knowledge**. Therefore, Aya speaks truly when she says, "Ben knew the bridge was safe."
      *   **Why?** EC focuses *only* on the attributor's context when determining the truth conditions of the knowledge ascription. Ben's high-stakes situation *at the time* is irrelevant to the truth of Aya's *current* statement. Her context sets the standard.
      *   **Contested Point:** Critics (e.g., Jason Stanley, John Hawthorne) argue EC struggles to explain the strong intuition that if Ben, *in his high-stakes moment*, had said "I don't *know* it's safe, I need to check more," he would be speaking truly, and that he would thereby be **disagreeing** with Aya's later claim. EC typically analyses this as no genuine disagreement because the word "knows" means different things in the two contexts (Aya's "knew" requires less than Ben's "know"). Many find this account of disagreement unsatisfying or counterintuitive.

  2.  **Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment (PE) - The Standard View:**
      *   **Core Tenet (Settled):** The meaning (semantic content) of "knows" and its core epistemic standards (e.g., truth, belief, justification/reliability) are **fixed and invariant across contexts**. However, whether a subject's belief **meets** those invariant standards (specifically, whether it is *justified enough* to count as knowledge) **depends on the *subject's* practical situation.** High stakes *for the subject* raise the bar for justification.
      *   **Verdict on Aya's Utterance:** The meaning of "knows" is fixed. For Ben's belief to count as knowledge *at the time he held it*, it must meet the invariant epistemic standards. Crucially, because Ben was in an **extremely high-stakes situation** (his life depended on it), the justification required for him to *know* the bridge was safe is **very high**.
      *   **Application:** While Ben's evidence (tugging, visual inspection) might suffice for knowledge in a low-stakes scenario (e.g., if he were just wondering idly), it is **insufficient** given the enormous practical cost of being wrong. Therefore, Ben **did not know** the bridge was safe at that moment. Consequently, when Aya says "Ben knew the bridge was safe," she speaks **falsely**, even though she is in a low-stakes context.
      *   **Why?** SSI/PE focuses on the *subject's* practical context at the time the belief was held to determine whether the invariant epistemic standards were met. Aya's low-stakes context *as the attributor* doesn't lower the bar that Ben needed to clear. The truth of the knowledge ascription depends on whether Ben *actually knew* then, which is fixed by his situation.
      *   **Contested Point:** Critics (e.g., contextualists like Keith DeRose, or critics like Jonathan Schaffer) argue SSI/PE struggles with cases like this where the *attributor's* stakes are low but the *subject's* were high. They argue it generates counterintuitive results, making knowledgeable speakers like Aya (who seem intuitively correct in their casual attribution) turn out to be wrong. SSI proponents argue this simply reflects the demanding nature of knowledge in high-stakes situations.

  **The Divergence Summarised Visually:**

  | Feature                | Epistemic Contextualism (EC)                             | Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment (PE) |
  | :--------------------- | :------------------------------------------------------- | :----------------------------------------------------------------- |
  | **Meaning of "knows"** | **Shifts** with attributor's conversational context      | **Fixed and invariant** across contexts                            |
  | **Truth Determinant**  | **Attributor's** context sets epistemic standards        | **Subject's** practical situation affects whether standards are met |
  | **Key Mechanism**      | Semantic context-sensitivity of "knows"                  | Pragmatic encroachment on justification (an epistemic factor)      |
  | **Verdict on Aya:**<br>*"Ben knew..."* | **True**<br>(Aya's low standards apply)              | **False**<br>(Ben's high standards weren't met)                    |

  **Dialogue Illustrating the Difference:**

  *   **Aya (Low-stakes Attributor):** "It was fine! Ben *knew* the bridge was safe – he’d checked it properly."
  *   **Ben (Later, recalling his high-stakes moment):** "Hold on, Aya! I *didn't* know it was safe back then! My life was on the line! A quick tug and look wasn't *enough* to *know*."
  *   **EC Analysis:** Ben and Aya aren't *really* contradicting each other. "Knew" in Aya's relaxed story-telling context means *had good enough evidence for casual purposes*. "Know" in Ben's high-stakes recollection context means *had evidence sufficient to guarantee safety when life is at stake*. Different standards, both potentially correct descriptions relative to their contexts. *(Contested: Does this adequately capture the feeling of disagreement?)*
  *   **SSI/PE Analysis:** Ben and Aya *are* contradicting each other, and **Ben is right**. There's only one standard for "knows". Ben didn't meet it because his high stakes demanded more evidence than he had. Aya, despite her relaxed context, is wrong in attributing knowledge to Ben *at that crucial moment*. *(Contested: Is it counterintuitive that Aya, speaking truly in her context by EC lights, speaks falsely according to SSI?)*

  ---

  **Key Takeaways for the Handout:**

  1.  **Fundamental Difference:** EC sees "knows" as *semantically context-sensitive* (like "tall" or "flat"), shifting meaning with the attributor. SSI/PE sees "knows" as *semantically invariant* but *epistemically sensitive* to the subject's practical situation, affecting whether the fixed standards are met.
  2.  **Same Utterance, Different Truthmakers:** The core divergence is vivid in cases like "The Bridge Crossing" where the *same knowledge ascription* ("Ben knew...") is evaluated by EC based on the *speaker's* (Aya's) context, and by SSI based on the *subject's* (Ben's past) context.
  3.  **Settled vs. Contested:**
      *   *Settled:* The core mechanisms described above for each view are textbook.
      *   *Contested:* How each view handles the **disagreement intuition** (EC: denies genuine cross-context disagreement? / SSI: makes low-stakes attributors often wrong?) and **cases with diverging stakes** (EC: prioritises attributor / SSI: prioritises subject) are major points of ongoing debate. Neither view has a universally accepted solution to these challenges.
  4.  **Contrived but Clear:** While the scenario is deliberately stark to highlight the difference, this kind of divergence is precisely what proponents of each view point to when arguing against the other.

  This example should provide a clear, step-by-step illustration of the crucial distinction between EC and SSI/PE, highlighting both the core agreed-upon mechanics and the central points of contention surrounding them. Good luck with the reading group!
