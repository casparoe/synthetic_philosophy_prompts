  Looking at the history: early lobotomies like Freeman and Watts targeted frontal lobes, especially the prefrontal cortex. Later, more precise procedures like cingulotomy focused on the anterior cingulate cortex (ACC). The ACC is crucial for the affective component of pain. Explaining the anatomy here is important. Studies show ACC lesions reduce pain's unpleasantness without altering sensory perception. That supports the two-component model.

  Patient reports are critical. They often said the pain was still there but didn't matter. Quotes like "the pain is there but not troublesome" highlight the dissociation. However, the user is right to question if the sensation itself changed. Some patients might not articulate subtle sensory changes, but most evidence points to intact sensation. Pain thresholds and localization seem preserved post-op, while affective responses diminish. That's a strong point for the separability argument.

