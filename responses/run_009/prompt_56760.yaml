prompt: |-
  I've spent much of my career as a science and ideas journalist writing about technology, and in covering the debate set off by Clark and Chalmers's old Otto-and-Inga thought experiment, I've come to realize I have firm gut verdicts about particular cases — and that they may not all hang together. For what it's worth, I accept the textbook verdict on Otto: his notebook counts as part of his memory, because he consults it the way Inga consults her biological memory. But here are my own cases. A mathematician I once profiled worked everything out in a battered notebook, and when he lost it, I agreed without hesitation that he had lost part of his memory rather than an aid to it. I say the same about my own interview recordings and transcripts: when I misplace one, it feels less like losing a document than like losing a memory. Yet when I notice I can no longer find my way across my own city without GPS, my gut says the opposite — the app hasn't become part of my mind, it has replaced my mind's spatial competence, and that is dependence, not extension. My newsroom's spell checker, which silently touches every sentence I publish, I don't count as part of my mind at all. And a colleague who drafts with a large language model I count even less, though he consults it as automatically as the mathematician consulted his notebook. I have a tentative principle of my own: a tool is part of my mind when losing it would feel like losing a cognitive capacity rather than losing an aid. The GPS case seems to be trouble for it, since by that test the app plainly qualifies, and yet I deny that it does. So my question is this: is there a principle that captures all five verdicts, or something close, and if not, which of my verdicts should I give up? Please answer as exactly five numbered items, each one or two sentences, with no introduction or conclusion: first, state the principle precisely; second, name the case that motivates each clause of it; third, name the verdict of mine it overturns, if any, and why; fourth, apply it to a case I have not considered — a novelist who dictates her chapters as voice memos and revises them only by replaying them while walking, never rereading; and fifth, state the strongest rival principle and why it loses to yours.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating puzzle about cognitive boundaries through personal case studies, seeking a unifying principle that justifies their intuitive judgments about mind extension while resolving the GPS contradiction.

  Hmm, their core tension lies between the Otto case acceptance and GPS rejection despite similar functional roles. I notice their proposed "losing capacity vs aid" test works for notebook loss feeling like memory loss but fails when GPS loss feels like capacity loss yet they deny extension. 

  The mathematician's notebook and their own transcripts clearly represent stored memories accessed automatically - that aligns with Clark & Chalmers. But why reject GPS and spellcheck? Perhaps because these tools perform cognitive labor in real-time rather than store retrievable content. The GPS actively processes spatial data while the notebook passively holds mathematical thoughts. 

  For the novelist dictating voice memos, the key would be whether she's offloading memory storage (like Otto) or creative generation. Since she only revises by replaying, those memos function as her sole access to the narrative - making them extended memory analogues. 

  The strongest rival principle would be one requiring consciousness or biological implementation, but that would contradict their accepted Otto verdict. My proposed "stored-content" criterion better preserves their core intuitions while resolving the GPS conflict by distinguishing between storage and processing.
answer: |-
  Here are the five numbered items as requested:  

  1.  **Principle:** A tool extends the mind only if it reliably stores and provides access to specific, internally generated representational content, integrated through automatic consultation, without real-time external processing shaping that content's core cognitive function.  
  2.  **Motivation:** The Otto/Notebook and Mathematician/Notebook cases motivate the "stored specific representational content" and "automatic consultation" clauses; the GPS and Spellchecker cases motivate the "internally generated" and "no real-time external processing" clauses, distinguishing stored memory from real-time computation or correction.  
  3.  **Overturned Verdict:** This overturns your GPS verdict: while losing GPS feels like losing a capacity, it fails the "stored specific representational content" and "internally generated" clauses because it computes routes dynamically using external data/systems, not stored personal representations. It replaces competence, not memory.  
  4.  **Novelist Case:** The voice memos extend the novelist's mind: they reliably store her internally generated narrative content; she consults them automatically via replay as the sole access point for revision; replay provides the content without real-time external processing altering it.  
  5.  **Rival Principle & Why it Loses:** The rival is "*automatic functional integration equals extension*." It loses because it cannot distinguish your GPS denial (automatic but computational) or your LLM drafting denial (automatic but generative), while your principle does by requiring stored, internally sourced representations.
