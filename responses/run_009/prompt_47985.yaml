prompt: |-
  My sister's a type designer and we keep having this arguement about what makes a letter the letter it is — is it the shape, or the job the shape does in a whole alphabet. I want a thought experiment I can actually spring on her over dinner. Build me a case where the exact same glyph — same shape, not a pixel changed — reads as an unambigous 'a' in one context and as not-a-letter at all in another. Constraints: realistic setting (a design studio, a shop sign, a book cover — no brain scanning, no far future tech), one paragraph, and it can't cheat by just declaring how it should be read: the readability has to be earned by structure the way it is in real life, like how you can read a terrible photo of a chalkboard menu because you know what words are likely to be on it. And here's the part I actually care about: the case has to split three ways. A features view (a letter is whatever carries the right visual features — the bowl, the stem, the counter) has to come out saying the glyph is not an 'a'. A prototype or similarity view has to say it's a strained, marginal 'a' at best. And a "slot in the system" view — the idea that what makes every 'a' an 'a' is that it occupies the a-position in a complete alphabet, with its idiosyncrasies cancelled out by its neighbors' roles — has to say it's a perfectly good 'a', no hesitation. After the scenario, walk through each verdict and why it falls out, tell me which piece of the setup is doing the work, what happens to the case if you remove that piece, and how my sister, who's a features person through and through, would try to fight back. She will definately spot it if the case is rigged, so no stipulating the conclusions — the readings have to be generated by how the case is built.
reasoning: |-
  Okay, the user wants a thought experiment to settle an argument with his sister, who's a type designer, about what defines a letter—shape versus its role in the alphabet. The challenge is to create a scenario where the same glyph is unambiguously an 'a' in one context, and not a letter in another, while satisfying three different theoretical perspectives. 

  First, I need to understand the core requirements: a single unchanged glyph must be read as 'a' in one realistic setting and as non-letter in another. The scenario must split three ways: a features view should reject it as 'a', a prototype view should see it as a marginal 'a', and a system view should accept it as a perfect 'a'. The explanation needs to tie each verdict to the context, and I have to anticipate counterarguments from the sister's features-based perspective.

  Hmm... realistic settings are key—book covers, shop signs, design studios. Brainstorming: maybe a glyph placed within a word versus isolated? But that might not create the non-letter reading strongly enough. What about contextual clues overriding shape? Like how we read words with missing letters based on expectation. 

  Ah! Got it: a bilingual sign or multilingual context. Specifically, a Japanese shop sign with katakana and English—where the glyph appears as part of a katakana character in one language but stands alone as 'a' in English. That could work because:  
  - In Japanese, it's embedded in "フ" (fu) where it resembles the katakana's top bar.  
  - In English, it's isolated as part of "a la carte," where context forces it to be read as 'a'.  

  Perfect—this uses real-world ambiguity without cheating. The glyph is physically identical in both cases. Now to map the three views:  
  1. **Features view**: Focuses on anatomy. The glyph lacks key 'a' traits (no bowl, stem, terminal), so it's not an 'a'.  
  2. **Prototype view**: Compares to ideal 'a'. It vaguely resembles some sans-serif 'a's but misses core features—strained match.  
  3. **System view**: In the English phrase, it occupies the 'a' slot and functions perfectly within the word system.  

  Critical setup pieces:  
  - The bilingual sign creates dual contexts. Remove this, and the system view collapses—no slot to fill.  
  - The specific glyph choice (horizontal bar) must be generic enough to pass as katakana fragment but minimal for English. Change it, and the features/prototype readings shift.  

  Sister's counterattack? She'd argue: "The glyph never had letter anatomy! Context just tricks the eye." Valid—but that's the point. The experiment shows that function can override form.  

  Testing the scenario: If the English phrase was less predictable (e.g., "a xylophone"), the system view might weaken. But "a la carte" is a common construction, making the 'a' slot obvious. Also, katakana "フ" is simple—no extra strokes to confuse the glyph.  

  Final polish: Emphasize that the readings emerge naturally from structure, not force. The dinner setting makes it relatable—no tech gimmicks. And the three-way split holds because each theory prioritizes different evidence: shapes vs. resemblance vs. role.  

  ...This should spark a fun debate. Bonus: it subtly proves that type design isn't just about isolated forms but how letters live in ecosystems.
answer: |-
  Here's a dinner-ready scenario:

  > Imagine a sleek, minimalist Japanese-French fusion restaurant sign in Tokyo. The main sign says "Bistro フランツ" (Bistro Franz) in bold sans-serif. The "フ" (katakana 'fu') is constructed from two perfect rectangles: a dominant vertical stroke and a shorter, thinner horizontal bar attached high on its left side. Later, inside the menu under "Plats du Jour," the phrase "à la carte" is set in the same typeface. However, due to a production error, the 'a' in "à" is missing its counter and descending stroke – only the thin, perfectly flat **horizontal bar** from the typeface's construction (identical to the bar used in "フ") remains, floating slightly above the baseline between the grave accent and the space before "la." To the English/French-reading diner scanning the menu list, it's instantly read as "à la carte" – that horizontal bar *is* the 'a'. The context demands it, and the structure of the phrase (accent + letter + space + common word) confirms it.

  **The Verdicts & Why:**
  1.  **Features View (Not an 'a'):** This view analyzes the glyph's intrinsic anatomy. A lowercase 'a' *requires* defining features: a closed or open counter (the enclosed space), a stem (vertical stroke), and usually a terminal or exit stroke. **This glyph has NONE of these.** It's just a horizontal bar – a primitive shape lacking any 'a'-specific structure. It fails the fundamental diagnostic checklist for 'a'-ness. *Setup Key:* The glyph's complete lack of core 'a' features. Remove the *featureless simplicity* of the glyph, and this view weakens.
  2.  **Prototype/Similarity View (Marginal 'a' at best):** This view compares the glyph to the mental ideal or common instances of 'a'. A horizontal bar bears almost no resemblance to a typical 'a'. Maybe, *maybe*, it vaguely recalls the top serif or crossbar of *some* very abstract sans-serif 'a's, but it's missing the entire defining body of the letter. The similarity is extremely strained and superficial. It's only recognizable as 'a' under significant duress (like this specific context). *Setup Key:* The radical difference between the glyph and any standard 'a' form. Remove the *extreme abstraction* of the glyph, and this view might see a clearer, though flawed, 'a'.
  3.  **"Slot in the System" View (Perfectly good 'a'):** This view cares about the glyph's *function* within the written system at that moment. In the specific context of the phrase "*à _ la carte*" set in that typeface, the slot *requires* a letter to produce the intended word. The grave accent signals the start of a vowel character. The space after signals the end of a word. The expected letter filling that slot, creating the common phrase "à la carte," is unambiguously 'a'. The glyph occupies that 'a'-slot perfectly, fulfilling its systemic role. Its idiosyncratic shape is irrelevant; its position and the system's constraints define it as 'a'. *Setup Key:* The *unambiguous linguistic context* ("à _ la carte") and the *forced expectation* of a letter in that slot. Remove the *highly predictable phrase structure* (especially the accent and "la"), and this view collapses – the slot loses its definition.

  **Your Sister's Likely Counterattack (Features View Defense):**
  She'll pounce on the core of the Features view: "That horizontal bar **isn't an 'a' glyph at all!** It's a *fragment*, a building block accidentally left behind. The *context* is tricking the reader into misinterpreting a non-letter shape *as if* it were an 'a' because the brain is desperately pattern-matching to make sense of the phrase. But the glyph itself possesses zero inherent 'a'-ness. Its shape categorically disqualifies it. You haven't proven the *same glyph* is an 'a'; you've proven that a completely different shape, placed in the right spot, can be *misread* as an 'a' by exploiting context. True 'a'-ness resides in the form, not just the position. A screwdriver in a knife block doesn't become a knife."

  **Why it Works (and why she'll engage):**
  The scenario forces the conflict between intrinsic form and contextual function. It doesn't stipulate the conclusions; they emerge naturally from how each theory prioritizes evidence. The features view *must* reject the glyph because it lacks defining parts. The prototype view *must* see it as a poor match. The system view *must* accept it because the system demands an 'a' and the glyph is placed to supply it. It's realistic (printing errors happen!), relies on structural context (predictable phrase), and the identical glyph appears in a non-letter role (part of the katakana). It's not rigged; it highlights the inherent tension your argument revolves around. Enjoy the dinner debate!
