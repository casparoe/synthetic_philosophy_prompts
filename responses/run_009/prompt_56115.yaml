prompt: |-
  I direct the research staff of a citizen-participation office in a mid-sized city, and we are perpetually in the business of creating small, ad-hoc voting bodies: neighborhood councils with advisory power, special-purpose districts (a watershed authority, a business improvement district, a library taxing district), and the occasional referendum, such as an upcoming vote on whether an industrial neighborhood may secede from the city and govern itself. Nearly every time we stand one of these bodies up, we get the same fight: who counts as a member of the demos for this decision? My staff keep improvising answers, and I would like to replace the improvisation with something defensible. The philosophical tension I want the procedure built around is the familiar one between two principles: that everyone whose interests are affected by a decision should have a say in it, and that the demos is properly constituted by those subject to the decision's authority or coercion rather than merely touched by its effects. There is also a third consideration my staff keep running into: some people have relevant local knowledge that the decision needs (the people who actually maintain the watershed, work at the refinery, use the school), and a fourth, practical worry: if every remotely affected party gets a vote, some of these bodies become too large and too heterogeneous to make any decision at all.

  Please convert this tangle into a decision procedure my staff can actually run in under an hour per decision, with no philosophy background, producing a written record that would survive a hostile question at a city council meeting. Give me the questions to ask in order, what counts as a sufficient answer to each, default rules for when the answers are murky (for instance: when in doubt, does the procedure default to residents of the legal boundary, to property owners, to some residency-plus-stake hybrid, or to an explicitly provisional franchise?), and the points where the procedure must stop and hand the choice to elected officials because the remaining question is one of values rather than facts. Be honest about which steps are judgment calls dressed up as procedure, and about what the procedure systematically cannot do — I am particularly interested in whether it can say anything principled about parties who are affected but cannot vote at all: future residents, children, and, in one live dispute, a downwind suburban municipality in another jurisdiction entirely that will bear the air-quality consequences of the refinery neighborhood's secession vote.

  Then run the procedure on three cases we actually face. First, the refinery secession referendum itself: the seceding neighborhood's 9,000 residents would gain zoning and emissions authority whose effects fall mostly on 60,000 people downwind, in a different city. Second, a school district vote on consolidating and closing two schools, where roughly a fifth of the enrolled children live outside the district lines because of an open-enrollment agreement the district now wants to factor into the decision. Third, the watershed authority's vote on reallocating irrigation water, which affects farmers inside the district, downstream recreational users outside it, and a city that draws its drinking water from the river but has never had a seat on the authority. For at least one of these, I expect the procedure to give an answer I will find politically unwelcome, and I would rather see that outcome worked honestly than smoothed over.
reasoning: |-
  Okay, the user is the head of a research staff in a city's citizen-participation office. They constantly deal with setting up small voting bodies like neighborhood councils, special districts, and referendums. The big issue they face every time is deciding who gets to vote—who counts as part of the demos for each decision. Their staff keeps improvising answers, and they want a defensible, systematic procedure instead. 

  The user outlines four key tensions: 
  1. Affected interests vs. subject to authority (the classic philosophical clash). 
  2. Need for local knowledge. 
  3. Practicality—avoiding overly large, dysfunctional bodies. 
  4. Handling affected-but-non-voting parties (future residents, kids, external entities like the downwind suburb).

  They want a procedure that’s: 
  - Runnable in under an hour by non-philosophers. 
  - Auditable (written record for hostile council questions). 
  - Explicit about judgment calls and limitations. 
  - Tested on three real cases, including one politically unwelcome outcome.

  First, I need to unpack the philosophical tension. The "all affected" principle is democratic but impossibly broad—air pollution could include half the continent. The "subject to authority" principle is cleaner (only those bound by the rules vote) but can exclude deeply affected parties. The procedure must navigate this while incorporating practical constraints.

  The user’s hidden needs: 
  - **Legitimacy defense:** They’re tired of ad-hoc solutions being challenged. The procedure must hold up under scrutiny. 
  - **Staff empowerment:** Staff need clear steps, not philosophy debates. Defaults and off-ramps are crucial. 
  - **Political cover:** When the outcome is messy (e.g., downwind suburb gets no vote), the process must show why it’s unavoidable. 
  - **Honesty about trade-offs:** They want no illusions—e.g., the procedure won’t solve future generations’ representation.

  For the structure: A flowchart-like Q&A with clear gates. 
  - **Gate 1:** Define the decision’s binding power (who is coerced?). 
  - **Gate 2:** Map affected interests beyond the coerced group. 
  - **Gate 3:** Assess local knowledge needs. 
  - **Gate 4:** Check feasibility (size/heterogeneity). 
  - **Gate 5:** Synthesize into franchise rules, with defaults. 
  - **Off-ramps:** When values conflict (e.g., "Should we prioritize authority or impact here?"), kick to elected officials.

  Defaults I’ll propose: 
  - When in doubt, default to legal boundaries (avoids chaos). 
  - For local knowledge, use voice-but-no-vote (advisory seats). 
  - For feasibility, cap voting bodies at ~500 where possible.

  Biggest challenge: Handling "affected but non-voting" parties. The procedure can’t magically give them votes, but it can force explicit recognition (e.g., "The downwind suburb is acknowledged as affected; recommend compensatory mitigation via interjurisdictional agreement").

  Now, testing on cases: 
  1. **Refinery secession:** 
     - Gate 1: Only residents subject to new authority → voters. 
     - Gate 2: Downwind suburb affected but external → no vote. 
     - Outcome: Only 9,000 residents vote, though 60k are impacted. Politically messy but defensible on authority principle. 
     - Mitigation: Suggest environmental impact review with suburb’s input. 

  2. **School consolidation:** 
     - Gate 1: District residents subject to tax/closure effects → core voters. 
     - Gate 2: Open-enrollment families affected → added as voters. 
     - Gate 3: Their local knowledge is critical. 
     - Outcome: Broader franchise. Staff might grumble (more voters), but justifiable.

  3. **Watershed vote:** 
     - Gate 1: Farmers in district coerced → voters. 
     - Gate 2: Recreational users/city affected → no vote. 
     - Gate 3: City has vital knowledge → recommend advisory seat. 
     - Outcome: Unhappy city, but procedure flags the gap. Off-ramp: Council decides if city’s impact outweighs legal boundaries.

  For the refinery case, the outcome *is* politically unwelcome (ignoring downwind impacts), but the procedure exposes the trade-off honestly: "Authority principle prioritizes self-governance, but impact is real. Mitigation strategies required." That’s what the user wants—no smoothing over.

  Finally, limitations to confess: 
  - Can’t solve interjurisdictional fairness. 
  - Future generations/kids unrepresented. 
  - Defaults favor stability over ideal inclusion. 

  This should give staff a tool that’s fast, documented, and philosophically grounded—even when the answers are uncomfortable.
answer: |-
  Here's a defensible, executable decision procedure for defining the *demos* in ad-hoc voting bodies. It prioritizes **auditability**, **speed**, and **principled trade-offs** between competing values. Staff can run it in 45-60 minutes using a worksheet template. The core is a 5-step flowchart with clear off-ramps to elected officials when values conflicts arise.

  ---

  ### **Decision Procedure: "Demos Definition Flowchart"**
  **Output:** A recommended voter eligibility rule, documented rationale, and flags for unresolved trade-offs.  
  **Tools Needed:** Worksheet, map of legal boundaries, stakeholder list (if available), timer.  
  **Key Default:** *When boundaries/effects are ambiguous, default to the existing legal jurisdiction (e.g., city limits, district lines) for voting eligibility.*  

  #### **Step 1: Define the Decision’s Binding Power** (5 mins)  
  **Question:** *"Whom will this decision DIRECTLY bind or coerce? (e.g., who must comply, pay taxes, face penalties?)"*  
  - **Sufficient Answer:** List groups subject to enforceable rules (e.g., property owners under new zoning, residents paying new taxes).  
  - **Murky?** Default to legal boundaries. If ambiguity persists (e.g., overlapping jurisdictions), off-ramp to elected officials with the question: *"Should voting follow legal boundaries (stability) or include groups facing novel coercion (fairness)?"*  
  - **Documentation:** "Voting Group A: [List] — Subject to decision’s authority per [source]."  

  #### **Step 2: Map Critical Affected Interests** (10 mins)  
  **Question:** *"Which groups (not listed in Step 1) face SEVERE, DIRECT, and UNAVOIDABLE harm or benefit from this decision? Exclude indirect/incidental effects."*  
  - **Sufficient Answer:** Groups with high-stakes, proximate impacts (e.g., health, livelihood, property value). *Exclude* diffuse effects (e.g., minor economic spillover).  
  - **Murky?** Default to exclusion. If severe impact is plausible but contested, flag for Step 5.  
  - **Documentation:** "Affected Group B: [List] — Severely impacted per [evidence, e.g., environmental study]. Not subject to authority."  

  #### **Step 3: Assess Local Knowledge Necessity** (10 mins)  
  **Question:** *"Which groups possess ESSENTIAL, NON-REPLICABLE knowledge for a competent decision? (e.g., daily users, workers, technical experts)"*  
  - **Sufficient Answer:** Groups whose firsthand experience is irreplaceable for assessing options (e.g., teachers in school closure, farmers in water allocation).  
  - **Murky?** Default to excluding if their perspective can be captured via consultation (e.g., public comments). If irreplaceable, flag for Step 5.  
  - **Documentation:** "Knowledge Group C: [List] — Essential expertise per [rationale]."  

  #### **Step 4: Check Feasibility** (5 mins)  
  **Question:** *"If all groups from Steps 1–3 voted, would the body exceed 500 voters or span >3 distinct interest groups?"*  
  - **Sufficient Answer:** Quantitative estimate (e.g., voter rolls, census data).  
  - **Murky?** Default to include all. If clearly unworkable (e.g., 10,000+ voters), proceed to Step 5.  
  - **Documentation:** "Feasibility: [Number] voters; [Number] interest groups."  

  #### **Step 5: Synthesize & Apply Default Rules** (15 mins)  
  _Use this flowchart:_  
  ```
  [Start]  
  │  
  ├─ IF ONLY Group A (Step 1) exists → Voting = Group A.  
  │  
  ├─ IF Group B (Step 2) or C (Step 3) are added →  
  │   ├─ IF body is FEASIBLE (Step 4) → Voting = Group A + B + C.  
  │   │  
  │   ├─ IF NOT FEASIBLE →  
  │       ├─ Default to Group A ONLY.  
  │       │  
  │       └─ IF Group B/C impact is SEVERE or KNOWLEDGE CRITICAL →  
  │           ├─ Recommend advisory roles for B/C (voice, no vote).  
  │           └─ Off-ramp to officials: *"Should feasibility override inclusion of [Group]?"*  
  │  
  └─ RECORD unresolved conflicts:  
      - "Affected but excluded: [Groups from Step 2]."  
      - "Knowledge not incorporated: [Groups from Step 3]."  
  ```  
  **Output Documentation:**  
  - Recommended voter eligibility.  
  - Rationale for inclusions/exclusions per steps.  
  - Advisory role recommendations (if any).  
  - Flagged trade-offs for council review.  

  ---

  ### **Honest Limitations & Judgment Calls**  
  1. **Judgment Dressed as Procedure:**  
     - Severity of impact (Step 2) and "essential knowledge" (Step 3) are inherently subjective. Staff must use reasonable evidence (e.g., pollution studies, usage data) but this risks bias.  
     - Defaulting to legal boundaries prioritizes stability over fairness when data is ambiguous.  

  2. **Systematically Excluded Parties:**  
     - **Future residents/children:** The procedure cannot grant them votes. Mitigation: Recommend impact assessments or advocate roles (e.g., youth advisory input).  
     - **External entities (e.g., downwind suburb):** If outside legal boundaries and not severely coerced (Step 1), they are excluded. Mitigation: Flag for interjurisdictional negotiation or federal/state intervention.  

  3. **What It Can’t Do:**  
     - Resolve values conflicts (e.g., "Should affectedness trump authority?"). These are off-ramped.  
     - Force compromise; it may entrench exclusion.  
     - Address power imbalances (e.g., landlords vs. renters).  

  ---

  ### **Case Applications**  
  #### **Case 1: Refinery Secession Referendum**  
  - **Step 1:** Only the 9,000 residents will be subject to new zoning/emissions laws → **Group A = Residents of seceding neighborhood**.  
  - **Step 2:** Downwind suburb (60,000) faces severe air quality harm → **Group B = Downwind residents**.  
  - **Step 3:** Refinery workers (likely residents) have essential knowledge → **Group C = Already in Group A**.  
  - **Step 4:** Adding 60k voters is unworkable → **Not feasible**.  
  - **Step 5:** Default to Group A (residents only). Flag: "Severely affected but excluded: Downwind suburb." Recommend environmental review with suburb’s input.  
  - **Unwelcome Truth:** The suburb gets no vote. Rationale is defensible (authority principle + feasibility) but exposes fairness gap.  

  #### **Case 2: School Closure Vote**  
  - **Step 1:** District residents fund schools/bound children → **Group A = Residents**.  
  - **Step 2:** Open-enrollment families (1/5 of students) face severe disruption → **Group B = Non-resident enrolled families**.  
  - **Step 3:** Non-resident families have essential usage knowledge → **Group C = Group B**.  
  - **Step 4:** Adding 20% more voters is likely feasible → **Feasible**.  
  - **Step 5:** Voting = **Residents + Non-resident enrolled families**. Document: "Authority (taxation) + severe impact + essential knowledge."  

  #### **Case 3: Watershed Authority Water Reallocation**  
  - **Step 1:** Farmers in the district are subject to water rules → **Group A = District farmers**.  
  - **Step 2:** Downstream city faces drinking water risk; recreational users lose access → **Group B = City + recreational users**.  
  - **Step 3:** City has technical knowledge of water needs → **Group C = City**.  
  - **Step 4:** Adding entire city + recreational users is unfeasible → **Not feasible**.  
  - **Step 5:** Default to **Group A (farmers only)**. Flag: "Excluded: City (severe impact + critical knowledge)." Recommend city advisory seat. Off-ramp: "Should the city’s drinking water risk override feasibility?"  
  - **Unwelcome Truth:** Farmers decide alone, risking harm to outsiders. Procedure forces explicit trade-off: legal authority vs. critical impact.  

  ---

  ### **Final Recommendations**  
  - **Staff Training:** Drill the 5 steps with historical cases. Emphasize documentation: "If it’s not written, it didn’t happen."  
  - **Council Backstop:** When off-ramped, officials get a clear values question (e.g., "Include Group X despite feasibility?").  
  - **Mitigate Exclusion:** For affected non-voters (downwind suburb, city water), recommend:  
    - Mandatory impact reports.  
    - Non-voting advisory seats.  
    - Intergovernmental agreements.  
  - **Audit Trail:** Publish completed worksheets with each body’s charter.  

  This procedure won’t make everyone happy—but it replaces improvisation with a transparent, defensible logic that isolates value judgments for elected officials. For refinery secession, it accepts the political reality that legal boundaries usually trump affectedness, while forcing accountability for external harms.
