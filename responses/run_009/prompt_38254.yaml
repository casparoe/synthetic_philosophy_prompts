prompt: |-
  My economist colleague keeps telling me that discounting future wellbeing is just like discounting a future cash flow: a dollar next year is worth less than a dollar today, so a life saved in 2100 must be worth less than a life saved today, and the government should just apply something like the market rate like any sensible investor would. He uses this to argue we shouldn't spend much now on climate damages that land in 2100. Before our next faculty meeting I want to push back properly, so can you audit the analogy for me? Give me the mapping first -- what plays the role of the interest rate, the investment opportunity, the fact that money can literally be moved across time and grow while it sits there? Then tell me where the mapping breaks: is there anything in the wellbeing case that corresponds to being able to invest a dollar and get more later, and what happens to the analogy when the people doing the benefitting can't trade with the people paying the cost? And finally, does his conclusion survive once the disanalogies are on the table, or was the analogy carrying it the whole time? keep it concrete, I want to be able to quote the structure back at him over coffee.
reasoning: |-
  Okay, let me approach this systematically. The user wants to dismantle an economist colleague's argument that discounting future wellbeing is equivalent to discounting financial cash flows - specifically regarding climate spending where costs are immediate but benefits accrue in 2100. 

  First, I need to map the analogy precisely. The colleague is equating:
  - Wellbeing units (like lives saved) to dollars
  - Time preference to interest rates
  - Societal resources to investment capital
  This mapping seems intuitive but contains critical flaws when examined.

  The core problem appears in three places:
  First, money's time-travel capability doesn't extend to wellbeing. When we "invest" $1 today at 5% interest, we literally get $1.05 next year through financial mechanisms. But if we "save" a wellbeing unit today by not spending resources, those resources can't be stored to produce more wellbeing units later - they're typically consumed immediately. 

  Second, the people affected aren't the same. Financial discounting assumes the investor experiences both the cost (today) and benefit (future). Climate policy imposes costs on current generations for benefits that largely accrue to future, disconnected populations. This breaks the "single agent" assumption.

  Third, the economist's approach treats wellbeing as infinitely substitutable - that we can always trade off present costs against amplified future benefits. But existential climate risks might create irreversible thresholds beyond which no amount of future resources can compensate.

  The user needs concrete rebuttals for faculty debate. I'll structure it as: 
  1) Literal breakdown: Money grows when moved through time; wellbeing doesn't. 
  2) Ethical breakdown: Sacrificers and beneficiaries are different groups. 
  3) Existential breakdown: Some losses can't be compensated later.

  The colleague's conclusion collapses when these disanalogies surface. His argument implicitly assumes wellbeing is bankable like money and that generations are a single entity - both false premises. The analogy wasn't just imperfect; it smuggled in untenable ethical assumptions.
answer: |-
  Here's the audit of your colleague's analogy, structured for coffee-quoting clarity. The core issue is that **discounting wellbeing isn't analogous to discounting money** because wellbeing can't be "invested" to grow predictably, and future generations aren't trading partners.

  ### 1. The Mapping (His Analogy)
  - **Interest Rate** → *Discount Rate* (e.g., 3-5% from market returns)  
  - **Dollar Today** → *Wellbeing Today* (e.g., a life saved now)  
  - **Dollar in 2100** → *Wellbeing in 2100* (e.g., a life saved later)  
  - **Investment Opportunity** → *Economic Growth* (assumes resources saved today can be invested to create more resources/future wellbeing)  
  - **Moving Money Across Time** → *Deferring Spending* (e.g., not taxing carbon now = more current investment → bigger economy in 2100)  

  His argument: *Just as $1 today grows to $10 in 2100 at 3% compound growth, $1 of climate spending today could become $10 of future resources. Spending $1 now to prevent $5 of future climate damage is thus "irrational" (like a bad investment).*

  ### 2. Where the Mapping Breaks
  **A. Wellbeing ≠ Money: You Can't "Invest" a Life**  
  - Money *literally grows* when invested (e.g., $1 at 5% = $1.05 next year).  
  - Wellbeing *doesn't compound*. Saving a life today doesn’t "invest" in future lives. If we skip climate spending, those unspent resources **aren't stored for 2100**—they’re typically consumed now (e.g., tax cuts → new phones, vacations). There’s no "wellbeing bank" where saved lives earn interest.  
  - **Concrete flaw:** *Money moves through time; wellbeing doesn’t.* Sacrificing wellbeing today (e.g., by not acting on climate) doesn’t automatically create *more* wellbeing later.  

  **B. Future Beneficiaries ≠ Current Investors**  
  - Financial discounting assumes **one agent** experiencing costs and benefits (e.g., *you* lend $100 today to get $110 back later).  
  - Climate policy has **disconnected groups**: *Current* generations pay costs (e.g., higher energy prices), while *future* generations get benefits (e.g., avoided famines). **Future people can’t compensate us.**  
  - **Concrete flaw:** *Market discount rates reflect trade-offs within one generation. Climate discounting forces trade-offs across generations.* Your colleague’s logic assumes we can “trade” with 2100’s population—but they can’t pay us back for sacrifices we make today.  

  **C. Economic Growth ≠ Guaranteed Wellbeing Growth**  
  - His model assumes saved resources today = bigger GDP in 2100 = more capacity to fix problems.  
  - But climate damages could **outpace growth**: Rising seas, crop failures, or mass migration might shrink the economy, making future people *poorer* despite today’s "savings."  
  - **Concrete flaw:** *Discounting assumes smooth growth. Climate risks are nonlinear* (e.g., tipping points like ice-sheet collapse). Saving 1% of GDP today might not offset a 20% GDP loss from unchecked warming.  

  ### 3. Does His Conclusion Survive?  
  **No—the analogy carries the entire argument.** Once the disanalogies are exposed:  
  - **If wellbeing can’t be "invested"**, deferring spending doesn’t magically create more future wellbeing.  
  - **If beneficiaries can’t trade with payers**, market rates (designed for intra-generational deals) don’t apply.  
  - **If climate damages cripple growth**, today’s "savings" might leave future people *poorer and less resilient*.  

  ### Coffee-Ready Soundbites
  > "Money grows in the bank; drowned cities don’t."  
  > "Market rates work because you get paid back. Our grandkids can’t Venmo us for climate inaction."  
  > "Sacrificing lives today for hypothetical GDP in 2100 isn’t investing—it’s gambling with someone else’s chips."  

  **Bottom line**: Discount rates for cash flows *describe* observed behavior (how people value money now vs. later). Applying them to wellbeing *prescribes* an ethical stance (that we value future lives less). Your colleague’s argument smuggles in ethics under the guise of financial math.  

  *Sources to cite*:  
  - **Stern Review** (2007): Uses near-zero discount rate for wellbeing, arguing future lives matter equally.  
  - **Dasgupta Review** (2021): Accepts *some* discounting but stresses it’s ethical, not financial—and highly sensitive to assumptions.  
  - **Weitzman** (2001): Fat-tailed climate risks make high discount rates "dangerously misleading."
