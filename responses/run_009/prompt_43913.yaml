answer: |-
  ## Dissertation Fellowship Proposal: Sidgwick’s Shadow Premise – Psychical Research and the Dualism of Practical Reason

  **1. Research Question:**
  Did Henry Sidgwick’s decades-long leadership of the Society for Psychical Research (SPR) constitute an empirically-driven, *methodologically integral* investigation into a crucial premise required for resolving the dualism of practical reason within his ethical system, or was it a psychologically or biographically contingent pursuit with no systematic bearing on the structure or arguments presented in *The Methods of Ethics*? This question demands a determinate answer based on textual and archival evidence concerning Sidgwick’s *stated methodological justifications*, the *explicit connections he drew* (or avoided) between psychical findings and ethical reasoning, and the *temporal and argumentative evolution* of his treatment of the dualism alongside his SPR activities.

  **2. Gap in Current Scholarship & Discriminating Evidence:**
  Existing scholarship bifurcates, leaving the nature of the connection critically underdetermined. One strand (e.g., Schneewind, Schultz) treats the SPR work as a biographical curiosity or personal foible, largely irrelevant to the philosophical architecture of the *Methods*. The other (e.g., Oppenheim, Gauld) sympathetically reconstructs potential links, sometimes risking anachronism by imposing a coherence Sidgwick himself may not have articulated or intended. Crucially, neither adequately tests the hypothesis that psychical research functioned as a *load-bearing empirical investigation* for a specific philosophical problem.

  Evidence capable of discriminating includes:
  *   **Explicit Statements:** Sidgwick’s own writings (e.g., SPR Presidential Addresses, essays like "The Ethics of Religious Conformity," letters, memoir notes) justifying his SPR involvement in terms of its *ethical significance*, specifically relating to post-mortem survival and the dualism.
  *   **Evolution of the Dualism:** Close analysis of changes in Sidgwick’s presentation of the dualism of practical reason across the seven editions (1874-1907) of the *Methods*. Does the tone, urgency, or proposed "solutions" shift in correlation with the intensity or findings of SPR work? Does he *explicitly invoke* the possibility of survival as a potential resolution more (or less) frequently or forcefully at specific junctures?
  *   **Methodological Alignment:** Comparison of the epistemological standards Sidgwick demands in the *Methods* (e.g., clarity, consistency, avoidance of intuitional conflict) with his stated reasons for pursuing psychical research and his critiques of evidence within the SPR. Does he frame the SPR investigations as employing the rigorous empirical methods necessary to settle a question his *a priori* ethical axioms cannot resolve? Does he treat SPR evidence as meeting his stringent standards for relevance to ethical reasoning?
  *   **Scope of SPR Work:** Examination of whether Sidgwick differentiated *within* SPR activities, explicitly prioritizing (e.g., survival evidence, census of hallucinations) over others (e.g., telekinesis, table-turning) in relation to ethical concerns. Does he link specific *types* of evidence to the dualism?

  **3. Methodology & Twelve-Month Plan:**
  This project employs rigorous textual analysis and historical contextualization of primary sources:
  *   **Months 1-3:** Comprehensive close reading and comparative analysis of Sidgwick’s treatment of the dualism of practical reason across all seven editions of *The Methods of Ethics*, tracking textual changes, emphasis, and proposed solutions/mitigations.
  *   **Months 4-6:** Systematic analysis of Sidgwick’s published writings on psychical research and ethics (SPR Proceedings/Papers, relevant essays in *Mind*, *The Ethics of Religious Conformity*) focusing on explicit connections drawn between SPR goals/methods/findings and ethical problems, particularly the dualism and the necessity of theistic/post-mortem beliefs. Initial survey of relevant secondary literature on Sidgwick’s ethics and SPR.
  *   **Months 7-9:** Archival research (primarily via digitized collections: Sidgwick Papers, SPR Archives – focusing on correspondence, draft materials, SPR committee minutes) to uncover private justifications, strategic discussions about SPR focus, and unpublished reflections linking SPR work to ethical concerns. Cross-reference findings with the textual evolution mapped in Months 1-3.
  *   **Months 10-11:** Synthesis and hypothesis testing. Integrate findings from textual and archival work to assess the strength, consistency, and evolution of the link between SPR activities and the dualism. Specifically evaluate evidence for/against the "load-bearing premise" hypothesis.
  *   **Month 12:** Drafting of dissertation chapter(s) presenting the analysis and conclusions, ensuring clear articulation of evidentiary basis and distinguishing Sidgwick’s reasoning from the ontological status of psychic phenomena.

  **4. Possible Conclusions (Including Nuanced Outcomes):**
  The project may conclude that:
  *   **Strong Support:** Psychical research was fundamentally an extension of Sidgwick’s ethical methodology, explicitly conceived and pursued as the necessary empirical investigation to resolve the dualism by potentially confirming the convergence of rational egoism and utilitarianism via survival. Evidence shows sustained, explicit linkage and methodological congruence.
  *   **Weak/Partial Support:** While Sidgwick entertained the *possibility* that survival evidence could resolve the dualism, and this motivated his *initial* or *persistent personal* involvement, he did not systematically integrate this pursuit into the structure or public argument of the *Methods*. The connection is biographical/hopeful rather than architectonic. Alternatively, the link holds only for a specific phase (e.g., early fervor) or specific strand (e.g., survival research) of SPR work.
  *   **Limited/No Systematic Connection (Friend's View):** Sidgwick’s SPR work, while personally profound, remained distinct from his ethical system. His writings show no compelling, sustained effort to treat its findings as premises within the *Methods* or its arguments. The dualism is presented as a purely philosophical impasse, unresolved by empirical hopes. The SPR was primarily a psychological commitment or intellectual hobby.
  Crucially, identifying a *specific, limited, or evolving* connection (e.g., strong early link fading over time; connection only to personal hope, not published argument) is a significant finding, illuminating Sidgwick’s intellectual development and the complex relationship between his rigorous philosophy and his existential concerns.

  **5. Risks of Failure & Mitigation Strategies:**
  The project risks failure if:
  *   **Evidence is Ambiguous/Thin:** Sidgwick’s explicit statements linking SPR and the dualism are rare or consistently vague. Mitigation: Focus rigorously on the *evolution* of his language and the *context* of his SPR justifications. Correlate intensity of SPR activity with shifts in the *Methods*. Argue that sustained, high-level engagement *itself* implies significance, even if explicit links are sparse.
  *   **Collapse into Ontology:** The analysis becomes entangled in evaluating the *truth* of psychic claims rather than Sidgwick’s *reasons* for investigating them. Mitigation: Strictly bracket the ontological question. The research question concerns Sidgwick’s *motivations, methodological framing, and integration attempts* as evidenced in his texts and correspondence, not the validity of the phenomena. Focus on his *epistemic stance* towards the evidence (e.g., "Sidgwick *treated* survival as a potential resolution," not "Survival *is* a resolution").
  *   **Over-Interpretation:** The temptation to force coherence remains strong. Mitigation: Adhere strictly to the pre-defined evidence types (explicit statements, textual evolution, methodological alignment). Acknowledge negative evidence (e.g., SPR activities with no discernible ethical link; editions of *Methods* where the dualism is unchanged despite SPR findings). Prioritize Sidgwick’s own words over speculative reconstruction.

  This project investigates a pivotal moment where a philosopher committed to the highest standards of evidence confronted a question he deemed existentially and ethically vital, yet resistant to his usual methods. By rigorously examining whether Sidgwick’s psychical research was a systematic attempt to supply a missing empirical premise for his ethics, or a separate intellectual endeavor, it contributes significantly to understanding his philosophy, the fraught relationship between reason and hope, and the boundaries of empirical inquiry in ethics.
