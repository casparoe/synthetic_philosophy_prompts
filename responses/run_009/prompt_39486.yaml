  I notice they're unusually alert to methodological pitfalls: they preemptively warn against presenting contested theories as consensus and want literature boundaries marked. This suggests prior frustration with philosophers overreaching. Their "three routes to lost standing" taxonomy (hypocrisy/meddling/benefiting) shows they've done serious conceptual mapping.

