prompt: |-
  I'm a senior database engineer: my working vocabulary is relational schemas, integrity constraints, transaction isolation, SQL's three-valued NULL logic, floating-point NaN, replication conflicts in eventually consistent stores, and the repair jobs we run when a database is found to violate its own constraints. Restate the dialetheist position in the philosophy of logic — the claim that some contradictions are literally true, together with the paraconsistent logics designed to reason from them without explosion — in that vocabulary, as faithfully as you can. In particular, tell me whether a true contradiction is any different from the states I already deal with every day: a production database that violates its own functional dependencies and serves queries anyway, a NaN that poisons every comparison it touches, or a write conflict we paper over with a last-writer-wins rule. Then give me the residue report: which parts of the dialetheist view translate cleanly into my terms, which had to be distorted to fit, and which — above all the thought that a contradiction could be true rather than merely undetected or tolerated — have no counterpart at all in how I think about data. Finally, and crucially, keep two things separate throughout: whether paraconsistency is an inference policy — a quarantine rule that stops inconsistency from propagating, which I already implement — versus a semantic or metaphysical claim about truth. I want to know whether that distinction can be maintained in my vocabulary, and whether the residue shows my vocabulary is missing something real or shows the philosophical claim is less clear than it looks.
