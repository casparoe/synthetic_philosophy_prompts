prompt: |-
  Hi, I'll try keep this reasonably short. I've just been voted onto the commitee of a residents' association in a medium-sized English town (~40k people), and after a really ugly row about a housing development proposal — half the estate feels the committee just decided over their heads — a few of us are seriously considering pushing for some form of referendum on big decisions. Not full-on Swiss direct democracy obviously, more like a binding or semi-binding vote of members whenever a decision is above some threshold of controversy, possibly paired with a citizens' jury or some deliberative forum beforehand. So a two-part contraption: deliberate first, then vote.

  Before I draft a proposal for the next AGM I want to get my priorities straight, because the debates around referendums seem endless and I don't want to burn the committee's goodwill on questions that turn out not to matter at our scale. So: which of the open questions and controversies about direct democracy genuinely matter most for a setup like ours, and which are overrated? Things I can already see people fighting about at the meeting: whether ballot wording is manipulative (and who gets to fix it), whether turnout thresholds should be able to invalidate a result, whether votes on fiddly planning questions mostly measure who ran the best leaflet campaign, whether repeated voting erodes trust or actually builds civic muscle, and whether agenda-setting power just quietly moves from the committee to whoever decides what counts as "controversial enough to trigger a vote" (that last one I suspect is underrated and would especially like your take on). But I honestly can't tell which of these deserves our limited meeting time and member attention.

  What I want is a defended ranking, not a survey. Set out your criteria first — how much difference the answer would make at our scale, how tractable it is for volunteers with no social scientists on call, whether it's upstream of the other questions — then the ordering itself, then what you'd deliberately punt on and why. Also flag wherever the standard argument assumes a national-scale vote (Brexit, California ballot props, Swiss double majorities) and quietly breaks at 40k people with a volunteer committee — I'd rather know now than find out at the AGM. Oh, and please write the whole thing in British English.
reasoning: |-
  Alright, let's tackle this query. The user is on a residents' association committee in a medium-sized English town, and they want to implement a referendum system for big decisions after a controversy over a housing development. They need to prioritize which issues matter most at their scale and avoid getting bogged down in debates that aren't critical.

  First, I need to understand their main concerns. The user listed several potential conflicts: ballot wording manipulation, turnout thresholds, campaign influence, repeated voting effects, and agenda-setting power. They suspect the last one is underrated. They want a defended ranking, not just a list, with criteria like impact at their scale, tractability for volunteers, and whether an issue is upstream.

  The key here is scaling. National-level direct democracy debates (like Brexit) don't all apply to a 40k population with volunteers. For example, complex issues like double majorities might be overkill here. The committee's capacity is limited, so tractability is crucial. They need solutions that volunteers can manage without social scientists.

  Looking at their list, agenda-setting power seems fundamental. If defining "controversial enough" is vague, it could lead to power struggles. This is upstream because it affects what even gets to a vote. Ballot wording is next because ambiguous questions can skew results. Both have high impact and are manageable with clear protocols.

  Turnout thresholds might cause more problems than they solve. At this scale, getting high turnout is tough, and thresholds could invalidate legitimate decisions. It's tractable to avoid them entirely. Campaign influence is a real issue but hard to control. Instead of regulating campaigns, focusing on neutral information sources like citizens' juries would be more feasible.

  Repeated voting's impact on trust is lower priority. At this scale, frequent votes might build engagement rather than cause fatigue. Plus, it's downstream; how often votes occur depends on the agenda-setting process.

  Other issues like citizens' juries and binding vs. semi-binding votes are important but can be managed with existing resources. The user can defer detailed designs until after setting core protocols.

  The user's deeper need is likely rebuilding trust after the housing dispute. They want a system that feels fair and inclusive without overburdening volunteers. By prioritizing agenda-setting and ballot clarity, they address the root of past conflicts. Avoiding turnout thresholds and complex regulations keeps the process feasible. Emphasizing deliberation through juries can educate voters and reduce polarization, aligning with their goal of thoughtful decision-making.

  In summary, the ranking starts with agenda-setting and ballot wording as foundational. Then, practical aspects like deliberation design and vote type follow. Skipping turnout thresholds and campaign regulations prevents unnecessary complications. This approach builds a credible, manageable system that restores community trust.
answer: |-
  Here's a defended ranking of controversies for your residents' association referendum proposal, prioritised for your scale and context, with clear criteria:

  **My Ranking Criteria:**
  1.  **Impact at Scale (40k town, volunteer committee):** How much does this issue *actually* affect legitimacy, fairness, or practicality for a local association? National-scale problems often don't translate.
  2.  **Tractability for Volunteers:** Can reasonably intelligent, committed laypeople implement a solution without specialist skills or excessive bureaucracy?
  3.  **Upstream/Downstream:** Does resolving this issue make others easier or irrelevant? Foundational problems come first.
  4.  **Risk of Dysfunction:** How likely is this issue to derail the process, cause disputes, or undermine trust if not addressed well?
  5.  **Scale-Specific Breakage:** Does the standard argument *assume* a national context (mass media, complex electorates, professional campaigns) and fall apart locally?

  **The Defended Ranking:**

  1.  **The Trigger Mechanism (Agenda-Setting Power):** *"Who decides what's controversial enough?"*
      *   **Why Highest Priority:** This is *fundamentally* upstream and impacts everything else. If the trigger is vague ("controversial") or solely committee-controlled, it *will* be seen as a power grab or lead to paralysis ("is *this* controversial enough?"). A bad trigger risks replicating the very problem you're solving (decisions made over heads) or triggering votes too often for minor issues.
      *   **Impact at Scale:** HIGH. Directly addresses the core grievance that sparked this proposal. Getting it wrong destroys trust instantly.
      *   **Tractability:** MEDIUM-HIGH. Needs clear, objective(ish) criteria. Examples: A petition threshold (e.g., 5% of members), a supermajority committee vote *against* its own recommendation, defined "major strategic decisions" in your constitution (e.g., selling land, major planning objections spending >£X). **Crucially:** Define the *who* (members via petition? committee vote?) and the *what* (specific criteria) clearly.
      *   **Scale Breakage:** YES. National debates focus on populism or minority rule. Locally, it's about practical thresholds and avoiding committee bottleneck/abuse. Petitions are feasible here, unlike nationally.

  2.  **Ballot Wording Clarity & Neutrality:** *"Is the question fair and clear?"*
      *   **Why Second:** Manipulative wording directly skews results and destroys legitimacy. Bad wording on complex planning issues is highly likely without safeguards. This is upstream of the vote itself.
      *   **Impact at Scale:** VERY HIGH. A confusing or loaded question guarantees disputes and a result few trust. Locals *will* spot bias.
      *   **Tractability:** MEDIUM. Solution: Mandate review by a small, balanced subgroup (e.g., 1 proponent, 1 opponent, 1 neutral chair) *and/or* require approval by your association's solicitor for basic legality/clarity. Focus on factual description of the *choice* (Option A: Support the development as proposed. Option B: Object to the development on grounds X,Y,Z). **Avoid** "Do you agree that..." formulations prone to bias.
      *   **Scale Breakage:** PARTIAL. Wording is always important, but local issues are often simpler than national constitutional ones. The balanced subgroup review is very feasible locally.

  3.  **Integrating Deliberation (Citizens' Jury/Forum):** *"How does the 'deliberate first' bit actually work?"*
      *   **Why Third:** This is the core of your "two-part contraption" designed to combat simplistic leaflet campaigns and build informed votes. Done poorly, it's a costly talking shop. Done well, it's transformative for legitimacy and education.
      *   **Impact at Scale:** HIGH. Directly addresses the fear that votes just reflect campaigning spend/effort. Builds civic muscle and understanding.
      *   **Tractability:** MEDIUM-LOW. Biggest challenge for volunteers. **Key:** Keep it *lean*. A 1-2 day "mini-public" with 12-20 randomly selected, stratified members is feasible. Focus is on *information* and *deliberation*, not negotiation. Output is a public report explaining key arguments/considerations, *not* a recommendation. Partner with local uni politics/sociology dept for *light-touch* facilitation guidance if possible, but a committed, neutral chair can run a basic version.
      *   **Scale Breakage:** YES. National juries are complex/expensive. At 40k, recruiting 15 representative locals is very achievable. The output is for *local* consumption on *local* issues.

  4.  **Binding vs. Semi-Binding & Implementation:** *"What happens after the vote?"*
      *   **Why Fourth:** Clarity on force is essential for legitimacy and avoiding post-vote chaos. "Semi-binding" is a minefield without definition.
      *   **Impact at Scale:** HIGH. Unclear force leads to immediate disputes if the committee dislikes the result ("we said semi-binding!").
      *   **Tractability:** HIGH. **Recommendation:** Go **Binding** for simplicity and trust. The committee *proposes* the referendum question based on the issue/trigger, but the members *decide* it. Committee implements the outcome. If truly necessary, define "semi-binding" tightly (e.g., requires 60% supermajority to override, only on legal/financial viability grounds confirmed externally). **Avoid** vague "strong moral force".
      *   **Scale Breakage:** PARTIAL. The principle is universal, but local implementation is simpler – the committee is directly accountable to the voters.

  5.  **Campaign Regulation / Information Asymmetry:** *"Does it just become a leaflet war?"*
      *   **Why Fifth:** A genuine concern, but hard to regulate effectively without becoming draconian or bureaucratic. *Mitigation* is better than *regulation*.
      *   **Impact at Scale:** MEDIUM. Leaflet wars *can* happen, but local networks and the deliberative forum are powerful counterweights. Passion often trumps spend.
      *   **Tractability:** LOW. Enforcing spending limits or fair coverage rules is near-impossible for volunteers. **Solution:** Focus resources on **Point 3 (Deliberation)** and ensuring **Point 2 (Ballot Wording)** is neutral. Publish a simple, neutral factsheet alongside the ballot. Trust the deliberative forum report to inform voters more than leaflets. **Don't try to police campaigning.**
      *   **Scale Breakage:** YES. National campaigns involve big money and media. Locally, it's neighbours arguing; information spreads through existing community channels. Deliberation is a realistic counterbalance.

  6.  **Turnout Thresholds:** *"Is the result valid if only 15% vote?"*
      *   **Why Sixth:** Introduces significant complexity and potential for perverse outcomes (e.g., opponents boycott to invalidate). Often solves a problem that isn't the biggest risk.
      *   **Impact at Scale:** MEDIUM-LOW (if used). Risk of invalidation causes frustration. Absence risks a small group deciding, but...
      *   **Tractability:** MEDIUM (to implement, poorly). **Recommendation: AVOID THEM.** They are rarely met at local level without massive controversy. They create a secondary contest ("get out the vote/no vote"). Legitimacy comes from a fair process and a clear winning option, not an arbitrary %. If *absolutely* insisted upon, set a very low bar (e.g., 10% of members) purely to prevent tiny cliques hijacking, but emphasize it's about minimum participation, not legitimacy. Simpler: Promote participation positively.
      *   **Scale Breakage:** YES. National thresholds debate voter apathy. Locally, focused issues get higher relative turnout. Thresholds are disproportionately problematic.

  7.  **Repeated Voting & Civic Fatigue:** *"Will we just vote on everything constantly?"*
      *   **Why Lowest Priority:** This is downstream and mitigated by **Point 1 (The Trigger)**. If the trigger is set sensibly (petition threshold, defined major decisions), it won't happen often. At this scale, frequent votes might *build* engagement on important issues.
      *   **Impact at Scale:** LOW (initially). Potential MEDIUM if triggered too often, but the trigger mechanism controls this.
      *   **Tractability:** HIGH. Handled entirely by designing a sensible trigger mechanism (Point 1). No need for separate rules.
      *   **Scale Breakage:** YES. National fatigue is about constant complex votes. Locally, a few votes a year on tangible issues is likely engaging, not fatiguing, if they feel meaningful.

  **What to Deliberately Punt On (For Now):**

  *   **Detailed Citizens' Jury Protocol:** Don't design the perfect jury system in the initial proposal. Get agreement *in principle* on including a deliberative forum for triggered referendums. Specify its core purpose (informative, not decisional) and broad composition (random selection, stratified). Delegate the detailed operating rules (exact size, recruitment method, facilitation, duration) to a subcommittee or the main committee to draft *after* the principle is approved. This avoids getting bogged down in minutiae at the AGM.
  *   **Exhaustive List of "Major Decisions":** For the trigger, it's fine to start with principles (petition threshold OR defined major strategic/financial decisions OR committee supermajority referral) plus illustrative examples (e.g., "objections to planning applications significantly altering the character of an estate," "expenditure over £10,000 not in the approved budget"). Avoid an exhaustive list initially; it will always have gaps. Build in a review clause.
  *   **Precise Petition Threshold:** Agree *that* a member petition can trigger a vote. Set the *exact* percentage (e.g., 5%, 10%) based on your membership numbers and what feels achievable but significant. Don't debate 3% vs 4% vs 5% endlessly – propose a reasonable figure and be open to amendment.

  **Summary of Priorities for AGM Debate Time:**

  1.  **Define the Trigger:** (How does something *get* to a referendum? Be specific about mechanisms and thresholds - this is the bedrock).
  2.  **Ensure Fair Questions:** (How is ballot wording made neutral and clear? Mandate a simple review process).
  3.  **Commit to Deliberation:** (Agree *that* a small, representative forum informs voters before the vote; details can follow).
  4.  **Make it Binding:** (Clarity on implementation is key; avoid "semi-binding" fudge).
  5.  **Avoid Turnout Traps:** (Argue *against* thresholds; focus on fair process and promoting participation).

  By focusing your proposal and AGM debate on these top priorities – especially the trigger and ballot wording – you address the core legitimacy issues from the housing row in a way that's feasible for volunteers. The other controversies are either downstream, less impactful locally, or too complex to solve perfectly at this stage. Good luck navigating the AGM!
