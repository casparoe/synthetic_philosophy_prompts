answer: |-
  45.5%. My credence that the axiom of choice is true of the sets is derived as follows:

  (a) **Probability that set-theoretic claims have a determinate truth value: 65%.** Realism posits a fixed universe of sets where statements like AC are objectively true or false, supported by the cumulative hierarchy intuition and the success of set theory as a foundation. Formalism rejects ontological commitment, treating mathematics as symbol manipulation, while the multiverse view (e.g., Hamkins) explicitly allows ZF + C and ZF + ¬C to describe equally valid universes. The independence of AC from ZF is evidence for indeterminacy, but realism remains compelling due to the apparent coherence of the iterative conception. Independence shows ZF is incomplete, not that truth is illusory.

  (b) **Conditional probability that AC is true, given determinateness: 70%.** The near-universal reliance of core mathematics on AC (e.g., existence of bases for vector spaces, Tychonoff's theorem for arbitrary products, existence of maximal ideals in rings) provides strong evidence that AC reflects a deep truth about sets. The "asymmetry" (product axiom feeling intuitive vs. well-ordering feeling artificial) is psychological; well-orderings are intrinsic to the ordinals, and AC merely ensures they exist for all sets. Non-measurable sets and Banach–Tarski are discoveries about the limitations of measure theory in ZFC, not costs of AC—they reveal that "volume" cannot be fully additive for all subsets in \(\mathbb{R}^3\), which is a feature of our concepts, not a flaw in AC.

  (c) Omitted as a separate term; the friend's position that independence drains content is addressed under (a). Independence implies ZF underdetermines truth, not that truth is absent. The TA's point about ZF and ZFC proving the same arithmetical sentences (by Shoenfield absoluteness) should not comfort realists: it shows AC's consequences are "high set-theoretic," but if sets exist objectively, AC's truth remains meaningful even if its falsity wouldn't affect number theory.

  The dominant term is (a), contributing most to the uncertainty. A single development that would move it most is a **definitive resolution of the Continuum Hypothesis via a widely accepted large cardinal axiom or inner model theory program** (e.g., a proof of CH from a canonical extension of ZFC). This would bolster realism by demonstrating that set-theoretic truth is discoverable beyond ZF. Conversely, deeper formalizations of the multiverse showing irreducible pluralism for statements like AC could reduce (a). Final credence: \(0.65 \times 0.70 = 0.455\).
