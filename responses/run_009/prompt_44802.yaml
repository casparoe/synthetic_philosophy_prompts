  My cousin is doing a law & philosophy course and came back from a seminar pretty fired up, and he explained the Hart–Fuller debate to me like this: they argued about what to do with Nazi law after the war. Hart was a positivist, so he thought morality and law are totally separate questions, which meant the Nazi statutes still counted as valid law, and his position was basically that the postwar German courts were right to treat them as binding and enforce them as written. Fuller replied that this just shows positivism can't handle wicked regimes: on his natural law view, a legal system that evil stops being a legal system at all, so there was no law there to enforce, and the grudge informer cases were easy because the informers had never actually violated any real law. Fuller more or less won the debate — Hart ended up admitting that the Nazi experience had refuted the positivist idea that you can identify law without looking at its moral content, and legal scholars now mostly agree that the informer cases settled it against positivism.

  I know basically nothing about this stuff beyond what he told me, so I can't tell where he's flattening things, but a couple of things nag at me. One is that I remember reading somewhere that Fuller's argument wasn't really about whether laws are morally good, more about whether they're made in a properly legal *way* — something about eight ways a system can fail to create law at all. If that's right then calling it "natural law" might be doing some sneaky work, and my cousin's version makes Fuller sound like a much more old-fashioned thinker than he was. Two, my cousin says Hart's position was that the Nazi statutes "were binding and should be enforced," but that seems weird for someone whose whole thing was separating law from morality — wouldn't separating them actually cut the other way, giving you no moral obligation to obey bad law? And third, did Hart really concede he'd been refuted? That doesn't sound like the guy who wrote the book everyone cites.

  So: go through my cousin's summary and tell me what's accurate, what's a simplification a philosopher would grumble about but let slide, and what's just wrong — including whether his claim about how the debate ended holds up. Also, if his summary were corrected, does the grudge informer case still do any work against positivism, or is it only a problem for the version of positivism my cousin described? Please write it as continuous prose, no headings or bullet points, just like a long email.
