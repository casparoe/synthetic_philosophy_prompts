prompt: |-
  I'm drafting a PhD prospectus in moral responsibility and need help turning a half-formed idea into a real proposal. The idea: Strawson's framework in "Freedom and Resentment" treats the reactive attitudes—resentment, gratitude, indignation, guilt—as natural, non-optional features of interpersonal life, the rock-bottom given in terms of which responsibility is explained. But we clearly have reactive attitudes about our own reactive attitudes: guilt that persists after we've concluded someone wasn't to blame, resentment at being made to feel guilty, shame at how easily our indignation flared. My suspicion is that this second-order phenomenon forces a distinction between two readings of the attitudes' "naturalness"—a psychological claim about what we can't help feeling, and a normative claim about what feelings are fitting—and that conflating them is what makes Strawson's argument that the objective attitude is humanly impossible look stronger than it is. Turn this into a prospectus with a precise statement of the question, an account of why the standard readings of Strawson leave it open, the method (conceptual analysis of worked cases, and whether empirical work on emotion regulation belongs in a philosophy prospectus at all), a chapter breakdown, and a frank statement of what would count as the project failing. Don't include citations; I'll supply those myself.
reasoning: |-
