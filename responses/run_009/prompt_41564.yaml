prompt: |-
  I'm teaching a seminar on peer disagreement and I need a fresh thought experiment, since I'm sick of the standard examples. Build me a case where two people — both honest, both genuinely trying to get the truth, and each knowing the other is smart and informed — tell each other their evidence AND their final credences, and yet neither one budges an inch. Everyday setting please: two doctors arguing over a diagnosis, or two old friends disagreeing about whether someone they both know can be trusted. No sci-fi, no exotic psychology, no stipulating that one of them is dumb or stubborn — the disagreement has to survive the conversation because of the details you build in, not because someone digs in their heels.

  After the scenario, do the diagnostic work. Walk through Aumann's agreement theorem: lay out its premises, and show which one your case secretly violates — and it has to violate at least one, since the theorem is a theorem, so the disagreement can't be real under its full conditions. The trick I want is that the violation should be subtle enough that the two agents themselves never notice it in the conversation — something like the gap between sharing your evidence and having your posteriors be *common knowledge* in the technical sense, or a prior that seemed common but wasn't. Then tell me what a strict Bayesian would say the agents should do once the flaw is pointed out to them, and whether it's realistic to expect actual humans to do that. End with a note on which single detail of your scenario is doing all the work, and what happens if you remove it. Keep the scenario itself to one paragraph — the meat of the answer is the diagnosis, not the setup. And this is for undergrads with one semester of probability, so no measure theory, just clean reasoning about priors, conditioning, and what each agent knows about what the other knows.
reasoning: |-
  We are going to design a scenario about two doctors disagreeing on a diagnosis. The key is to have them share evidence and credences without achieving common knowledge of the evidence, due to a subtle difference in how they interpret the reliability of a test.

  **Scenario:**
  Two doctors, Alice and Bob, are reviewing a patient's symptoms and test results for a rare disease D. The patient has symptom S, which is common in D but also occurs in other conditions. They both know that the base rate of D is 1%. Alice has seen a study that Test T is 99% sensitive and 99% specific for D. Bob has seen a different study that also reports 99% sensitivity and specificity for T, but his study notes that in cases where the patient has symptom S, false positives are more likely due to a confounding factor. They share their evidence: Alice reports her study and her final credence of 50% that the patient has D. Bob reports his study and his final credence of 10%. They each explain their reasoning: Alice used Bayes' theorem with the base rate and the test result (positive) and got 50%. Bob, knowing about the confounding factor when S is present, adjusted the specificity to 95% in such cases and got 10%. They each acknowledge the other's evidence but do not change their credences. Why? Because Alice thinks the confounding factor is irrelevant since her study didn't mention it, and Bob thinks his study's warning is crucial. They both trust their own studies and don't have a way to reconcile the conflicting information about the test's reliability in the presence of S.

  **Diagnosis:**

  **Aumann's Agreement Theorem:** If two agents have the same prior, and their posteriors are common knowledge, then they must have the same posterior. The theorem relies on:
  1. Common priors (they start with the same probability distribution over the state of the world).
  2. Common knowledge of posteriors (each knows the other's posterior, each knows that the other knows, and so on ad infinitum).
  3. Bayesian updating (each updates rationally by conditioning on their private information).

  **Violation in the scenario:**
  The violation is in the common priors. More specifically, while they might have agreed on the base rate and the general sensitivity and specificity, they have different prior beliefs about the reliability of the test in the presence of symptom S. Alice's prior includes that the test's specificity is 99% regardless of S, while Bob's prior includes that when S is present, the specificity drops to 95%. Therefore, they do not have the same prior over the entire state space (which includes the test's performance conditional on S). This difference is not reconciled because they don't have a shared model of how S affects the test.

  Moreover, note that even after sharing their evidence, they do not achieve common knowledge of the evidence because they have different interpretations of what the evidence means (due to the different studies). Specifically, the evidence about the test's performance is not common knowledge because each discounts the other's study in the presence of S.

  **What a strict Bayesian would say:**
  A strict Bayesian would note that the doctors do not have a common prior. They should first agree on a prior that incorporates all available evidence about the test's performance, including the possibility of confounding by S. They might need to pool their studies and form a new prior that accounts for both sets of data. Then, they should update jointly on the evidence (the positive test and the symptom S). The result would be a single posterior probability that they both share.

  **Is it realistic for humans?**
  It is not very realistic. Humans are attached to their sources of information and may not know how to combine conflicting studies. They might also lack the time or expertise to build a new joint model. In practice, they might compromise by averaging or by deferring to one study, but that is not what Bayesian updating would prescribe.

  **The key detail:**
  The key detail is the presence of a confounding factor (symptom S) that affects the test's reliability, and the fact that the two doctors have seen different studies about this effect. Without this detail (if both studies were in agreement about the test's performance in the presence of S), they would have started with the same prior and then, after sharing evidence, would have converged.

  **What if we remove the key detail?**
  If we remove the confounding factor (so S does not affect test reliability) and both studies agree on the test's performance, then they would have the same prior and after sharing evidence (the positive test and S) and their credences, they would update to the same posterior. For instance, without the confounding, they would both use 99% specificity and end up at 50% (as Alice did). So the disagreement would vanish.
answer: |-
  ### Scenario
  Two experienced doctors, Alice and Bob, are diagnosing a patient with a persistent cough. The patient tested positive for a rare lung infection (disease D) using Test T, which both know has 99% sensitivity and 99% specificity in most populations. Alice recalls that the patient recently traveled to Region X, where a study she trusts shows Test T’s specificity drops to 95% due to cross-reactions with a local fungus. Bob knows the patient takes Medication M, and a study he trusts shows Medication M *improves* Test T’s specificity to 99.9% by suppressing the fungus. They share all evidence: the positive test, the travel history, the medication, and their respective studies. Alice concludes a 60% probability of D (factoring in the reduced specificity from Region X), Bob concludes 10% (factoring in the improved specificity from Medication M). Each acknowledges the other’s evidence but dismisses the conflicting study as irrelevant—Alice argues Medication M doesn’t counteract Region X’s effect, Bob insists Region X’s fungus isn’t prevalent when Medication M is used. Neither budges.

  ### Diagnosis via Aumann's Agreement Theorem
  **Aumann’s theorem states:** If two rational agents have identical prior probability distributions (priors) and their updated beliefs (posteriors) become common knowledge, they must agree on their final credences. "Common knowledge" means not only do both know the posteriors, but both know that both know, and so on infinitely. The theorem assumes Bayesian updating: each conditions their beliefs on all available evidence.

  **Why disagreement persists:** The scenario violates the **common prior** assumption. Alice and Bob have different priors about how Test T’s specificity depends on external factors (Region X and Medication M). Specifically:
  - Alice’s prior assumes Region X’s effect dominates, reducing specificity to 95% *even if* Medication M is present.
  - Bob’s prior assumes Medication M’s effect dominates, boosting specificity to 99.9% *even if* Region X exposure occurred.
  These priors aren’t shared because each doctor’s "model" of the world (how factors interact) is shaped by distinct, trusted studies they can’t reconcile. Crucially, when they share evidence, they *describe* their studies but fail to establish a *common prior* for how Region X and Medication M *jointly* affect Test T. Thus, their Bayesian updates occur on different probability spaces, preventing agreement.

  **The subtlety:** The violation isn’t noticed because both doctors *think* they share the same core facts (Test T’s baseline performance, the patient’s symptoms). But they never achieve common knowledge of the *dependency structure* between variables (Region X × Medication M). Alice knows Bob’s posterior (10%) and evidence (Medication M study), but she doesn’t accept that his prior model is valid, and vice versa. This breaks the common prior requirement—yet in conversation, it feels like "stubbornness," not a technical flaw.

  ### What a strict Bayesian would prescribe
  A strict Bayesian would insist Alice and Bob:
  1. **Build a joint prior:** Agree on a single prior probability distribution that incorporates *all* evidence (both studies, Region X, Medication M). This might involve averaging the studies’ findings or seeking meta-evidence on the interaction.
  2. **Update together:** Condition this joint prior on the patient’s positive test result, travel history, and medication use to compute a shared posterior.
  3. **Agree on the result:** Mathematically, this forces identical credences.

  **Is this realistic for humans?** No. Humans struggle to construct joint priors from conflicting expert sources without arbitrary compromises. Alice and Bob would need to quantify their uncertainty about the studies’ reliability and the interaction effect—a complex, time-consuming task. In practice, humans often default to heuristics (e.g., trusting their own study) or compromise by averaging credences (e.g., settling at 35%), violating Bayesian ideals. Emotional attachment to personal expertise exacerbates this.

  ### The key detail and its removal
  **Key detail:** The doctors’ studies make *opposing claims* about how Medication M *interacts* with Region X’s effect on Test T’s specificity. Alice’s study implies Medication M doesn’t mitigate Region X’s impact; Bob’s implies it does. This creates irreconcilable priors about variable dependencies.

  **Remove it:** If both studies agreed on the interaction (e.g., "Medication M neutralizes Region X’s effect, restoring 99% specificity"), Alice and Bob would share a prior. After sharing evidence, they’d apply Bayes’ rule identically and converge to one credence (e.g., 30%). Disagreement vanishes.
