answer: |-
  ## Botanical Entanglements: A Fresh Testimonial Thought Experiment

  **Brainstorm: Core Divergences Before Building**
  - **Global Reductionism (GR):** Justification *always* requires positive inductive evidence (track record, speaker credentials, domain reliability) from the hearer. The hearer bears the full justificatory burden.
  - **Local Reductionism (LR):** Default entitlement *only* in domains where testimony is our *necessary and primary* access point (history, geography, personal experiences). This entitlement dissolves where self-verification is possible *in principle* (even if difficult) or where defeaters exist.
  - **Anti-Reductionism (AR):** General prima facie entitlement to believe testimony, regardless of domain. This entitlement is defeasible by evidence of insincerity, incompetence, or contradiction, *not* by mere lack of positive evidence or the *principle* of self-verifiability. The *speaker* bears the default burden of justification.
  - **Key Splitting Points:** 
      1.  **Domain Dependency (LR vs. AR/GR):** LR cares *critically* about whether the domain *requires* testimony. AR doesn't care. GR rejects defaults entirely.
      2.  **Self-Verifiability *in Principle* (LR vs. AR):** LR requires positive reasons if the hearer *could* check, even if they don't. AR's default applies unless actual defeaters exist.
      3.  **Burden of Proof:** GR/LR place it on the hearer to find reasons *to trust*. AR places it on the hearer to find reasons *not to trust*.

  **The Scenario: First Meeting at the Amateur Naturalist Club**

  You're a long-time member of the "Ridgeview Naturalists," a club focused on local flora, fauna, and geology. A new member, Lena, introduces herself at the first meeting of the season. She's recently retired and moved to town. She mentions she was a "soil scientist specializing in nutrient cycling in forest ecosystems" but seems modest and avoids jargon. She's friendly, engaged, and asks insightful questions during a discussion about local soil profiles.

  Later, during a break in the garden, she points to a mature plum tree on the clubhouse grounds: "That's an interesting specimen. It has a rare somatic mutation – a chimera – affecting the meristem tissue in that lower branch. See how those blossoms are doubled? It's unstable, but visually striking. I noticed it last week." You look; one branch *does* have distinctly doubled blossoms compared to the rest of the tree. You have no botany background beyond the club's basics and wouldn't know how to verify a somatic mutation yourself without complex lab work (beyond club resources) or years of specialized botanical study. Lena is sincere and correct about the mutation.

  As you walk back inside, Lena gestures towards an old oak tree by the entrance: "And that oak there? Local lore says it was planted by the town founder, Elias Thorne, in 1798, right after he signed the treaty with the indigenous band who camped near the ridge spring. Supposedly, it symbolized the agreement." You haven't heard this specific story before, but you know Thorne founded the town around then and treaties were signed. Verifying the exact date and symbolic meaning would require accessing historical archives (town records, potentially indigenous oral histories if available) – something feasible but time-consuming for you. Lena is sincere and correct about the history.

  **The Testimonial Assertions:**

  1.  **Assertion A (Botanical Claim):** "That plum tree has a rare somatic mutation (chimera) causing the double blossoms on that branch."
  2.  **Assertion B (Historical Claim):** "That oak tree was planted by Elias Thorne in 1798 to symbolize a treaty signed with the local indigenous band."

  **Verdicts & Reasoning:**

  1.  **Assertion A (Botanical - Somatic Mutation):**
      *   **GR:** **Unjustified Belief.** You have *no positive inductive evidence* about Lena's reliability as a botanist, her expertise in somatic mutations, or the reliability of testimony in botany. Her soil science background is adjacent but not directly relevant. The burden is on you to establish her reliability or the domain's track record, which you haven't done. The fact you *could* learn botany and check *in principle* reinforces that justification requires your own evidence.
      *   **LR:** **Unjustified Belief.** While botany involves testimony, it is **not** a domain where testimony is our *only possible source*. You *could*, *in principle*, learn botany, collect samples, perform genetic analysis (albeit with effort), or consult other experts yourself. The default entitlement doesn't apply here. You need positive reasons to trust Lena's specific botanical claim (e.g., seeing her credentials, knowing her reputation in botany). Her soil science background is insufficiently specific. The defeater isn't about Lena herself, but the *nature of the domain* – it's self-verifiable in principle.
      *   **AR:** **Justified Belief (Prima Facie).** Lena appears sincere and competent (based on her general demeanor, relevant scientific background, and insightful questions). There's no evidence of deceit, confusion, or contradiction. You have a general entitlement to believe her testimony unless defeated. The fact that you *could* check *in principle* doesn't defeat the entitlement; only evidence suggesting she is *actually* wrong or unreliable would. Her specific expertise isn't required for the default; competence in a related scientific field and observation suffice unless contradicted.

  2.  **Assertion B (Historical Claim):**
      *   **GR:** **Unjustified Belief.** Same core reason as A. No positive evidence of Lena's reliability as a historian, the reliability of "local lore," or the domain's track record. Burden remains unmet.
      *   **LR:** **Justified Belief (Prima Facie).** History *is* a domain where testimony is our **primary and necessary source**. You cannot directly observe the past; you must rely on records and testimony. LR grants a default entitlement to trust historical testimony absent defeaters. Lena's sincerity and general competence, coupled with the plausibility of the claim (known founder, known treaty era), are sufficient for initial acceptance. While you *could* access archives *in principle*, the sheer necessity of testimony for past events triggers the default.
      *   **AR:** **Justified Belief (Prima Facie).** As with A, Lena appears sincere and generally competent. The claim is plausible. No defeaters are present. The general entitlement applies.

  **Summary of Splitting:**

  *   **Assertion A (Botanical):** GR (No) / LR (No) / AR (Yes)
  *   **Assertion B (Historical):** GR (No) / LR (Yes) / AR (Yes)

  **Feature Doing the Work:** The **domain's inherent epistemic accessibility**.

  *   **For A:** Botany is treated by LR as *principally self-verifiable* (even if practically difficult for the individual), negating the default. GR requires evidence regardless. AR applies its default regardless.
  *   **For B:** History is treated by LR as *principally testimony-dependent*, triggering the default. GR still requires evidence. AR applies its default.
  *   **Crucially:** The *practical difficulty* of verification for you personally is irrelevant for LR's distinction; it hinges on the *fundamental nature of the domain*. AR ignores this distinction entirely. GR rejects defaults universally.

  **Effect of Removing Key Feature:** If we removed the domain distinction – say, making *both* claims historical (e.g., "Thorne planted the oak" AND "Thorne's wife bred that specific plum variety") – then:
  *   **GR:** Still rejects both (no evidence).
  *   **LR:** Accepts both (history domain default).
  *   **AR:** Accepts both (general default).
  LR and AR converge on both verdicts, failing to split on A. The domain distinction is essential for splitting LR from AR on A.

  **Attack from the Global Reductionist (Defending GR against the case):**

  "The scenario implicitly assumes defeaters are the *only* barrier to justification. GR argues the *lack of positive reasons* is itself the barrier. Lena's soil science background and demeanor are simply *data points*, not sufficient inductive evidence. Why trust her on botany? Soil science isn't botany. Why trust 'local lore'? Unverified lore is notoriously unreliable. GR demands more: Has she published in botany? Has she correctly identified mutations before? What's the error rate for such identifications? Is this 'lore' corroborated in any primary source? Without investigating *any* of this, belief is credulous, not justified. The LR/AR 'defaults' are just unjustified leaps of faith disguised as epistemology. The fact that checking history is *harder* doesn't magically create justification where none existed; it just highlights the practical difficulty of meeting GR's rigorous standard, which remains the correct one for justified belief. The burden *should* always be on the testifier to provide credentials or the hearer to find them."

  **Addressing Your Hunch (LR vs. Moderate AR Convergence):**

  Your hunch is **partially correct but not fatal to splitting them here**. Moderate AR (like Lackey, Faulkner) often incorporates sensitivity to context and speaker competence, making it *pragmatically* closer to LR *in testimony-dependent domains with competent speakers*. However, the **domain principle** remains the key *theoretical* divergence point exposed in this case:

  1.  **LR's Domain Restriction:** LR *fundamentally denies* a default entitlement exists *at all* for domains like botany, geology, or everyday observable facts, precisely *because* they are not testimony-dependent in principle. The entitlement is *contingent* on the domain's inaccessibility.
  2.  **AR's Domain Agnosticism:** Moderate AR still grants a default entitlement *even in those domains* (like botany), defeasible only by *actual* evidence of unreliability, not by the *mere possibility* of checking or the domain's nature. Lena's general scientific competence and plausibility might suffice for AR, while LR demands *domain-specific* reasons or access denial.

  **This case exploits that difference:** Assertion A involves a domain (botany) LR deems fundamentally different from history due to its inherent verifiability, denying the default. AR applies its default regardless. *Without* a domain like botany (where testimony isn't strictly necessary), LR and moderate AR would be much harder to split cleanly in everyday cases, as defeaters would be the main lever for both. **This case succeeds because it isolates the domain dependency as the critical factor.** The divergence is real, but it requires carefully contrasting a testimony-dependent domain with one that isn't, using the *principle* of verifiability rather than the *practical* difficulty for the individual. Your instinct about convergence under defeaters is spot-on for domains LR already accepts; this case forces them apart precisely where LR draws its sharpest line.
