prompt: |-
  I'm a backend engineer — schemas, primary keys, foreign keys, serialization, idempotency, that sort of thing is my native tongue. I've read some pop physics on relativity but zero philosophy of physics. Restate the hole argument (Einstein's original worry and the version Earman and Norton used against spacetime substantivalism) in the vocabulary I actually use, as faithfully as you can. Manifold points, diffeomorphisms, coordinate charts, Leibniz equivalence — figure out the honest mapping to whatever is nearest in my world, whether thats surrogate keys, two serializations of the same object, schema refactors, or something else entirely. Then give me the residue report: what translates cleanly, what you had to distort to make it fit, and whether anything in the philosophers' debate has no counterpart in my vocabulary at all. In particular I keep thinking the whole thing is just two database dumps of the same data with different hidden row ids, and the substantivalist is someone who insists the hidden row ids are physically real while nothing in the schema ever references them — so the hole argument is basically indeterminism as an artifact of treating a surrogate key as meaningful. Tell me whether that translation is faithful or whether I'm smuggling in assumptions that do real work. And tell me which side of the residue comes out looking worse: my vocabulary, or their debate. Please write it as continuous prose only, no headings, bullets, or tables — like a long email.
