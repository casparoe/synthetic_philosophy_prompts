prompt: |-
  I teach a graduate seminar on distributive ethics and am deciding where to steer the final research unit, which has room for perhaps three student papers and one term of my own attention. The separateness of persons objection to utilitarianism has been around for over half a century, but the literature has fractured into at least three readings that are rarely forced to engage one another: an aggregation-based reading on which the objection targets sum-ranking as such, a distributive reading on which it targets the indifference of the total view to who gets what, and a procedural reading on which it targets the absence of any fair bargain among the persons whose interests are traded off. What I want from you is a prioritized agenda rather than a survey: identify exactly five open questions in this debate that most deserve a term of work, where each item says not only what the question is but why it outranks the questions you left off — because it is upstream of the others, because it is tractable with the tools we already have, or because its answer would settle a dispute the other readings merely talk past. For context, my students have strong backgrounds in formal axiology but weaker ones in political philosophy, so tractability by those lights matters. Please reply with exactly five numbered items, each one or two sentences, with no introductory or concluding remarks.
reasoning: |-
  Alright, let's tackle this query. The user teaches a graduate seminar on distributive ethics and needs a prioritized agenda of five open questions about the separateness of persons objection to utilitarianism. They mentioned three readings: aggregation-based, distributive, and procedural. The students have strong formal axiology backgrounds but weaker political philosophy, so tractability with formal tools is key.

  First, I need to identify questions that are upstream, tractable, and can resolve disputes between the readings. The user wants prioritization based on these criteria. Let me start by recalling the three readings. The aggregation-based focuses on sum-ranking, distributive on indifference to distribution, and procedural on fair bargaining. 

  The first question should address the core of the objection. If the fundamental issue is about aggregation itself, resolving that could clarify the other readings. So, questioning whether the core problem is aggregation or something else makes sense. Using formal tools like Pareto or stochastic dominance could help test this without heavy political philosophy.

  Next, procedural readings rely on bargaining mechanisms. But how do these mechanisms actually incorporate separateness? Evaluating different models (Nash, Kalai-Smorodinsky) with formal methods could show if they genuinely address the objection or just mask aggregation. This is tractable with the students' background.

  Third, the distributive reading's complaint about indifference to who benefits. If separateness requires distribution-sensitivity, what's the minimal formal condition? Comparing axioms like Anonymity vs. Pigou-Dalton could reveal if basic principles conflict. This uses formal axiology tools and avoids complex political theory.

  Fourth, the relationship between the readings. Are they independent or interconnected? Using decision-theoretic frameworks to see if aggregation implies distribution-insensitivity would link the readings. This is upstream because understanding connections could unify the debate.

  Finally, the meta-level question: why prioritize one reading? If the objection's force varies by context, formalizing context-dependence (e.g., risk vs. certainty) could show which reading applies when. This helps students navigate the fractured literature practically.

  I need to ensure each question is tractable with formal tools. Avoiding political philosophy concepts is crucial. Also, each question should be prioritized for its ability to clarify or resolve conflicts between the readings. Checking if these questions are open and impactful. For example, the first question's answer could make other debates obsolete. The procedural question tests if mechanisms truly embody separateness. The distributive one identifies minimal conditions. The interrelation question shows dependencies. Contextual applicability provides practical guidance. 

  Prioritization reasons: upstream core issue, tractability with formal methods, resolving disputes between readings. Each question should meet at least one strongly. The user wants exactly five, concise, no intros or conclusions. Make sure each is one to two sentences, numbered. Avoid overlap and ensure they address the key gaps in the literature where readings don't engage each other.
answer: |-
  1.  **Is the core separateness objection fundamentally about aggregation (sum-ranking) or about distribution-insensitivity?** Resolving this upstream question, tractable via comparing formal models (e.g., violating Pareto vs. violating Anonymity), would clarify whether distributive or procedural readings are even addressing the primary issue or a downstream consequence.
  2.  **Can any procedural bargaining mechanism genuinely embody separateness without implicitly reintroducing aggregation or distributional concerns?** Testing specific mechanisms (e.g., Nash, Kalai-Smorodinsky) against formal separateness constraints is tractable with game theory and reveals if this reading offers a distinct solution or merely repackages the problem.
  3.  **What is the minimal formal axiom capturing the distributive reading's demand for distribution-sensitivity that conflicts with utilitarianism?** Identifying this axiom (beyond basic Anonymity, e.g., Pigou-Dalton under risk) using formal axiology tools is tractable and crucial, as current distributive critiques often lack precise, non-question-begging foundations compared to aggregation arguments.
  4.  **Do the readings represent independent objections, or is one logically prior? (e.g., Does rejecting aggregation *entail* distribution-sensitivity?)** Formally modeling the logical relationships between the objections (e.g., via decision-theoretic frameworks under uncertainty) is tractable and essential to prevent talking past, showing if settling one reading resolves others.
  5.  **Under what specific choice contexts (e.g., risk, intertemporal, population) does each reading gain or lose force against utilitarianism?** Formalizing context-dependence (e.g., applying separateness axioms in risky vs. certain social choices) is tractable with existing tools and vital, as the objection's perceived strength varies wildly across contexts ignored by monolithic readings.
