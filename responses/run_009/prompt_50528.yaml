answer: |-
  Here are five points addressing your questions:

  1.  **The rule strongly implies a belief in non-propositional knowledge:** It presupposes that firsthand experience provides essential knowledge (like qualia or "what it's like" knowledge) that cannot be fully acquired through descriptions, data, or observation alone, aligning with the conclusion of the Mary argument.
  2.  **A physicalist *could* defend the rule pragmatically:** Even believing Mary learns nothing *factually* new, they could argue personal experience builds crucial therapeutic empathy, practical intuition for navigating the altered state, or genuine trust with patients that theoretical knowledge alone cannot provide.
  3.  **The contrast with surgery highlights the primacy of subjective experience:** The medical world accepts simulation/skill training for technical procedures (surgery), but insists on first-person experience for psychedelic therapy precisely because the *subjective, internal experience* of the patient is the core therapeutic medium the therapist must understand and navigate.
  4.  **The rule's logic likely requires *substance-specific* experience:** If the knowledge gained is experiential and state-specific, a therapist experienced only with a different drug would likely be seen as lacking the crucial first-person understanding of the particular states induced by the therapeutic psychedelic, even with extensive guiding experience.
  5.  **Mary's scenario is settled; the knowledge claim is contested:** Philosophers widely agree Mary gains *something* new upon seeing red (an experiential acquaintance). However, they actively disagree on whether this constitutes genuinely *new factual knowledge* (anti-physicalist view) or merely a new *representational mode or ability* for pre-existing facts (physicalist view).
