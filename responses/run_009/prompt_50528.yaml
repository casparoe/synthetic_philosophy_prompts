  ok so this is kinda random but a few weeks ago we had a speaker at my school who's training to be one of those therapists who guides patients through psychedelic therapy sessions (the stuff thats being legalized for depression and PTSD in some places now). She mentioned that in her training program you basically have to go through a session yourself before you're allowed to guide anyone else, because the program people think you can't understand what the experience is like from just reading about it or watching videos. This immediately reminded me of a philosophy thing I read about — Mary the color scientist who knows every physical fact about color but grew up in a black and white room, and the question of wether she learns anything new when she finally walks out and sees red.

  So here's what I keep wondering: what does the "therapists must experience it themselves" rule actually presuppose about knowledge? Does it presuppose the conclusion of the Mary argument, i.e. that some knowledge just can't be transmitted by description or testimony? Or could a total physicalist who thinks Mary learns nothing new still defend the rule — like maybe it's not about knowledge at all, just about building trust or practical skill with patients? And is it weird that the same medical world is fine training surgeons on cadavers and simulators but insists the psychedelic therapist needs the first-person thing? Also, if a therapist did a hundred guided sessions but personally had only ever taken a completely different drug with a totally different kind of trip, would the program's own logic say she's qualified or not? That last one might be a stretch but it bugs me.

