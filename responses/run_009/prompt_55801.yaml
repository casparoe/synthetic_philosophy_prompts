prompt: |-
  My friend Elena, who is in my philosophy of mind reading group, has been working through whether conceivability is any guide to metaphysical possibility, and over the past few months she has accumulated a track record of verdicts I can summarize. She says that before Wiles's proof it was certainly conceivable that Fermat's Last Theorem was false, but that this was never evidence that it was false, since working through the proof dissolves the conceivability. She says the same about Goldbach's conjecture if it is ever proved. She says it is conceivable that water is not H2O, that Hesperus is not Phosphorus, and that heat is not molecular motion, but in each case the conceivability is no evidence at all of possibility. On zombies, though, she reverses course: that a molecule-for-molecule duplicate of me with no experience whatsoever is conceivable she takes not merely as evidence but as about as strong as conceivability evidence gets against physicalism. And she says a functionally identical silicon duplicate with no inner life is also conceivable, and counts as evidence against functionalism, though weaker than the zombie case.

  Next month three new cases are coming up in our discussion, and I want to predict her verdicts before she gives them. The first: my consciousness continuing after the total destruction of my body — she will have to say whether its conceivability is evidence that disembodied survival is possible. The second: I plan to ask her to imagine it is 2075 and neuroscientists announce, with all the confidence chemists now have about water, that consciousness simply is a certain neurobiological process — does her zombie evidence evaporate the way the water intuition did once chemistry settled matters, or does it survive as unrebutted? The third: an angel — a pure thinking substance with no physical or functional nature at all — whose conceivability she will presumably find vivid. I care less about her answers than about the rule she is implicitly running; my working hypothesis is that at least two rules fit all her verdicts so far but split on these new cases, one on which her zombie evidence is the kind that no empirical discovery could ever defeat, and one on which it is merely prima facie and defeasible in exactly the way the water evidence was. Identify the candidate rules, tell me what each predicts about the three cases, give your best guess at her verdicts with your reasons, and propose the further case — something beyond these three — that would do the most to tell the rules apart.

  Since this is a prediction about a person and not a proof, I would like you to be explicit about how confident you are in each part: which rule you think she is running, which predicted verdict, and which discriminating case. And please single out the point in your answer you are least sure of, whether that is a rule you suspect she would disown, a verdict that could go either way, or a reading of her weaker attitude toward the silicon case that might not generalize the way you assume.
