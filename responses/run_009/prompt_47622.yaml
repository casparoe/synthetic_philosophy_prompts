prompt: |-
  Two things about how my colleagues and I talk about evidence have been bothering me, and I want to know whether epistemologists have names for them, and whether they are in fact one phenomenon or two.

  I am a structural engineer. The first thing I've noticed is that when the stakes are low, we say we know things on thin evidence. If a preliminary calculation suggests a beam is generously oversized, someone will say they know it will hold, initial the drawing, and move on. When the stakes are high — a stadium roof, a school — the same kind of calculation, the same margin of safety, no longer licenses the same claim, and everyone insists on another round of checks before anyone is willing to say they know it will hold. No one received new information in between; what changed is what we are about to do with the belief. And it does not feel like mere policy, like demanding a bigger safety buffer. It is framed, by us, as a change in what we are entitled to assert and to believe: whether we know seems to depend partly on the cost of being wrong.

  The second thing is subtly different. The very same belief appears to change its status depending on who is asking. Over coffee I will say I know the retrofit is sound, and nobody blinks. Put me under oath, or in front of the client's risk consultant, and the identical evidence base seems to license only hedged phrasing — that our assessment is that it is sound, that we are confident it will hold. Here it is not my situation that has changed; the bridge, my evidence, and my exposure are all the same. What has changed is the conversational setting and, perhaps, the standards of whoever I am answering to.

  So, three questions. First, is there an established term for the idea in the first observation — that whether a person knows something can depend on practical stakes rather than on evidence and truth alone? Second, are the two observations the same phenomenon, or do philosophers treat them differently, given that in the first case what I know seems to vary with my own situation while in the second it seems to vary with the context of the knowledge attribution itself? Third, and most importantly, how exactly does the field draw the boundary here — where do the nearest established positions part ways, and which of them best captures what happens to an engineer between the coffee room and the witness stand? I am not after a bare label; I want the carving, including the cases near the seam where the positions give different verdicts about one and the same utterance.
reasoning: |-
  Okay, the user is a structural engineer noticing two patterns in how they and colleagues talk about evidence. The first is that when stakes are low, they claim knowledge with thin evidence, but when stakes are high (like a stadium roof), the same evidence isn't enough—they need more checks. They feel it's not just policy but a change in what they're entitled to believe. The second pattern is that the same belief is expressed differently depending on the audience. Casually over coffee, they say "I know," but under oath or with clients, they hedge. The user wants to know if these are named concepts in epistemology, whether they're the same phenomenon, and how philosophers distinguish them.

  First, I need to recall relevant epistemological theories. The first observation sounds like pragmatic encroachment. That's the idea that practical stakes affect knowledge. For example, Jeremy Fantl and Matthew McGrath's work where knowledge depends on how much is at stake. High stakes mean you need more evidence to know. The structural engineer's example fits perfectly: same evidence, but higher stakes require more verification.

  The second observation seems like contextualism. This is where the word "knows" changes meaning based on conversational context. Keith DeRose and David Lewis talk about how standards for knowledge attribution shift with context. In a casual setting, standards are low; in a high-stakes context like a courtroom, standards are higher, so you hedge. The engineer's coffee chat vs. witness stand scenario illustrates this.

  Now, are these two phenomena the same? Pragmatic encroachment is about the truth of knowledge claims changing with stakes, while contextualism is about the meaning of "knows" varying with context. The key difference is that pragmatic encroachment affects whether the belief is actually knowledge, whereas contextualism affects how we attribute knowledge linguistically. The user's cases differ: the first involves actual changes in action (designing a school vs. a shed), altering the stakes. The second is about attribution context (casual vs. formal) without changing the actual situation.

  The user also asks about boundaries between positions. Near the seam, cases might be ambiguous. For example, if a colleague asks in the office about a school roof design, is it high stakes because of the project, or does the context (office vs. courtroom) matter? Contextualists would say the context of utterance raises standards. Impurists (pragmatic encroachment) would say the stakes inherent in the project raise the evidence needed. So the verdicts could differ: contextualism might say "I know" is false in court because standards are higher, but true in the office. Pragmatic encroachment might say the engineer never knew in high-stakes situations, regardless of context.

  The user's deeper need might be understanding how to navigate these situations professionally. They might want frameworks to justify their varying assertions or to communicate effectively under different contexts. Recognizing these concepts can help them articulate why evidence standards shift, ensuring safety while avoiding unnecessary work in low-stakes scenarios. They might also seek validation that their practices align with philosophical rigor, enhancing their credibility.
answer: |-
  Your observations are sharp and directly engage with central debates in contemporary epistemology. Philosophers *do* have names for these phenomena, treat them as distinct (though related), and vigorously debate how to draw the boundaries. Here's the breakdown:

  1.  **Your First Observation (Stakes Dependence):** This is called **Pragmatic Encroachment** (or sometimes **Interest-Relative Invariantism** - see point 3). The core idea is that whether an agent **knows** that *p* depends not only on traditional epistemic factors (evidence, reliability, truth, etc.) but also on the **practical stakes** involved in being right or wrong about *p*.
      *   **Key Insight:** Higher stakes raise the evidential threshold required for knowledge. What counts as "enough" evidence for knowing depends on *what hangs on it*.
      *   **Why it fits:** In your beam example, the *truth* ("the beam will hold") and the *evidence* (the preliminary calculation) remain constant. What changes is the *cost of error* (a shed collapsing vs. a school collapsing). Pragmatic encroachment explains why the *same evidence* is sufficient for knowledge in low stakes but insufficient in high stakes. It directly links knowledge to actionability ("initial the drawing and move on" vs. "insist on another round of checks"). Proponents like Jeremy Fantl & Matthew McGrath ("Knowledge in an Uncertain World") and Jason Stanley ("Knowledge and Practical Interests") argue this isn't just about assertion *policy* but about the nature of knowledge itself – high stakes make you *fail* to know until you gather more evidence.

  2.  **Your Second Observation (Context Dependence):** This is called **Contextualism** about knowledge attributions. The core idea is that the word "know" is **context-sensitive**, like "tall" or "here." The *standards* for truthfully saying "S knows that *p*" shift depending on the **conversational context** in which the attribution is made.
      *   **Key Insight:** "Know" means something slightly different in different contexts. In a low-standards context (coffee room), "I know" can be true with less evidence. In a high-standards context (under oath, with risk consultants), "I know" requires significantly more evidence to be true. The *speaker's context* (and the potential for error it makes salient) determines the standard.
      *   **Why it fits:** Your evidence, the bridge, your exposure, and your actual belief state remain constant. What changes is the *context of attribution* – the audience (colleagues vs. a risk consultant under oath) and the implicit standards that context imposes. Saying "I know" in the high-stakes context would be *false* because the standards are raised, forcing you into hedged language ("we are confident," "our assessment is") to accurately reflect the evidence relative to *that* context. Proponents include Keith DeRose ("The Case for Contextualism") and David Lewis ("Elusive Knowledge").

  3.  **Are They the Same Phenomenon?** Philosophers generally treat them as **distinct**, though related and often addressing similar intuitions.
      *   **Core Difference:** Pragmatic Encroachment claims the **truth conditions** of knowledge *itself* depend on the *subject's* practical situation/stakes. Contextualism claims the **meaning/semantics** of the *word "know"* (and thus the truth conditions of *attributions* like "S knows that p") depend on the *attributor's* conversational context.
      *   **Analogy:** Imagine strength requirements for a material.
          *   **Pragmatic Encroachment:** The material *actually needs* to be stronger (higher yield stress) if it's holding up a stadium roof versus a garden shed. The *property itself* (adequate strength) depends on the stakes.
          *   **Contextualism:** The *word "strong"* means different things in different contexts. What counts as "strong enough" (true application of the word) when talking casually about shed materials is different from what counts as "strong enough" in an official engineering specification for a stadium. The material property (yield stress) is fixed, but the *standard for applying the label* changes.

  4.  **Drawing the Boundary and Verdicts at the Seam:** This is where the debate is hottest. The main "established positions" are:
      *   **Contextualism (C):** "Know" is context-sensitive. Standards shift with the attributor's context.
      *   **Pragmatic Encroachment / Interest-Relative Invariantism (PE/IRI):** Knowledge *is* stakes-sensitive for the subject. The meaning of "know" is invariant, but its truth depends on the subject's stakes.
      *   **Strict Invariantism (SI):** Neither meaning nor truth conditions of knowledge depend on stakes or context. Knowledge is purely a matter of truth, belief, and "traditional" justification/reliability (e.g., evidence quality). Your colleagues are just being overly cautious or changing assertion policies, not reflecting knowledge itself. (This view struggles most with your observations).
      *   **Subject-Sensitive Invariantism (SSI):** Sometimes used synonymously with PE/IRI, emphasizing the subject's situation.

  **Where Positions Part Ways and Verdicts Diverge:**

  Consider your second scenario: You believe the retrofit is sound based on evidence *E*. You are in the coffee room (low stakes for you personally *as the subject* at that moment). Now imagine two utterances:

  *   **Utterance 1 (Coffee Room, to Colleague):** "I know the retrofit is sound."
  *   **Utterance 2 (Later, Under Oath):** "I know the retrofit is sound." (But you instead hedge).

  Now, assume the *subject's* stakes (your exposure) haven't changed between utterances 1 and 2. Only the *context* of attribution has changed (casual vs. formal/oath).

  *   **Contextualism (C):**
      *   *Coffee Room:* The conversational standards are low. Assuming *E* meets these low standards, Utterance 1 is **true**.
      *   *Under Oath:* The conversational standards are very high (salient possibilities of error, serious consequences). *E* likely does *not* meet these high standards. Utterance 2 would be **false** if uttered. Your hedging is appropriate because claiming knowledge *here* would be false. Your *knowledge state* (relative to low standards) hasn't changed, but what "know" *means* in this context has.
  *   **Pragmatic Encroachment (PE/IRI):**
      *   *Both Contexts:* The key is the *subject's* stakes *at the time of the belief/action*. Since you were in a low-stakes situation in the coffee room (no immediate liability under oath), and *E* was sufficient for knowledge *in that low-stakes context*, you **knew** then. Under oath, your *belief* is the same, and the evidence is the same. Crucially, if the *subject's stakes haven't increased* (e.g., you aren't *now* facing immediate liability *for the coffee-room claim*, just for the current testimony about your *past* belief/assessment), PE/IRI suggests you **still know** the retrofit is sound *now*, because *your* practical situation regarding *that belief* hasn't necessarily become high-stakes *for you* in the relevant way. Utterance 2 *could* be **true**. Hedging might be a *pragmatic* choice (avoiding misunderstanding, legal caution) but not necessarily reflecting a lack of knowledge. If, however, being under oath *now* suddenly makes your *past* assessment subject to high personal stakes (e.g., perjury risk for the past claim), then PE/IRI *might* say you *lost* knowledge because the stakes relevant to that proposition *for you* increased.
  *   **Strict Invariantism (SI):**
      *   *Both Contexts:* There is one fixed, high standard for knowledge. If *E* met it in the coffee room, Utterance 1 was **true** and you knew. Utterance 2, if *E* still meets the standard, would also be **true**. Hedging is purely about caution, policy, or communication, not knowledge. If *E* never met the fixed high standard, then Utterance 1 was **false** – you never knew, even in the coffee room. The change is purely in assertion behavior, not epistemic status.

  **The Crucial Seam: Your Situation vs. The Attribution Context**

  The deepest cut between C and PE/IRI comes when the *subject's* practical situation is low-stakes, but the *attributor's* context demands high standards (or vice-versa). Your second scenario is precisely this:

  *   **C:** Focuses on the *attribution context* (oath/witness stand). High standards apply. "S knows" is false relative to *that* context, even if S is relaxed.
  *   **PE/IRI:** Focuses on the *subject's situation* regarding the belief. If S's stakes are genuinely low (e.g., their liability exposure hasn't changed just because they are testifying *about* a past, properly formed belief), then S *still knows*, even when saying "I know" in court feels wrong. The feeling is pragmatic, not semantic.

  **Which Best Captures the Engineer's Experience?**

  Both C and PE/IRI capture aspects powerfully, but **Contextualism (C)** often provides the most straightforward explanation for the *linguistic phenomenon* you describe – the palpable shift in what feels *accurate to say* ("I know" vs. "We are confident") as the conversational context shifts dramatically (coffee room vs. witness stand), even when the subject's own evidence, belief, and *personal* exposure haven't changed. The feeling of "what I'm entitled to assert" changing based purely on *who I'm talking to and under what circumstances* is the hallmark of contextualism. Pragmatic Encroachment explains the *design decision* shift (beam vs. stadium) beautifully, where the *subject's* situation (what they are about to *do*) demonstrably changes the stakes *for them*.

  In practice, moving from the coffee room to the witness stand involves *both*:
  1.  A shift into a context where extremely high standards for *attributing* knowledge are in play (Contextualism).
  2.  A potential (though not always immediate) shift in the *subject's* personal practical stakes regarding the belief (if perjury or liability for the testimony itself becomes a risk), which could trigger Pragmatic Encroachment effects.

  Understanding both concepts gives you the tools to dissect the different pressures at work in your professional discourse about evidence and knowledge. The debate continues because both capture deep intuitions about how knowledge interacts with our practical lives.
