  Okay, the user leads a five-person country-risk unit at a development bank. They need to produce quarterly risk assessments for sovereign borrowers, but they're concerned about the flaws in their current approach. After reading Keynes, they worry that their process ignores nuances like the weight of evidence, non-numerical probabilities, and non-ergodic risks. They want a practical procedure incorporating Keynesian ideas that analysts can complete in 90 minutes per quarter.

  Hmm, the user's core tension is between operational efficiency (single number/ranking demand) and epistemic honesty (Keynesian uncertainty). They need to preserve three Key distinctions: probability vs weight of argument, non-numerical/non-comparable probabilities, and non-ergodicity. The challenge is making this bank-executable within severe time constraints.

  First, I should structure the procedure around output formats the credit committee might accept - numerical ranges, bands, or qualitative statements. Key elements would be: evidence grading (Weight Score), probability classification (Probability Type), and explicit decision rules for when ranking is impossible. Must include fallbacks for committee pushback.

  For the cases: 
  (A) The mid-income country with constitutional crisis risk needs treatment of unprecedented events. Despite good data, the novel crisis should trigger "non-comparable" status due to non-ergodicity. 
  (B) The livestock pandemic case allows numerical estimates because of global base rates, but weight should be medium since local data is absent. 
  (C) The unspecified reform program case clearly warrants a "suspended judgment" verdict - perfect example of "we don't know." 

  The misfires section is crucial. This approach might underperform with complex interlinked risks or over-sanitize political judgments. Analysts should flag when the template forces oversimplification. 

  Notable trade-offs: The 90-minute constraint means shallow evidence scans. The Weight Score systematizes what's inherently subjective. And we're still forcing uncertainty into categories - but at least now they're honest categories. The committee confrontation protocol is vital for institutional buy-in.

  Biggest win: Protecting analysts from having to fake precision. That "suspended judgment" output for Case C will frustrate the committee but might prevent serious mispricing. The template makes the "we don't know" defensible rather than unprofessional.
answer: |-
  Here’s a Keynes-inspired procedural framework for your risk assessments, designed to fit within 90 minutes per country while preserving critical distinctions. The output format balances epistemic honesty with the committee’s need for actionability.

  ---

  ### **Keynesian Risk Assessment Procedure (90-Minute Protocol)**
  **Output Format:**  
  Each assessment must deliver one of four verdicts:  
  1. **Numerical Estimate** (e.g., "PD 8.5% ± 1.5%")  
  2. **Banded Estimate** (e.g., "PD 7–12%")  
  3. **Comparable but Unranked** (e.g., "Higher PD than Country X, but insufficient data to quantify or rank against Y")  
  4. **Suspended Judgment** ("Insufficient basis for probability estimate").  

  **Required Components:**  
  - **Probability Statement** (as above)  
  - **Weight of Evidence Score** (1–5 scale):  
    - `1` = Fragmented/anecdotal data  
    - `2` = Partial key indicators, weak models  
    - `3` = Core data adequate but gaps in forward-looking variables  
    - `4` = Robust historical data, validated models  
    - `5` = Near-complete data, predictive consistency  
  - **Non-Ergodicity Flag** (Yes/No): "Future path depends on unique, irreversible decisions."  

  ---

  ### **Decision Rules for Analysts**
  1. **Assign Probability Type:**  
     - **Numerical** *only if*:  
       - Historical default/frequency data exists *and*  
       - Current drivers match past dynamics (No non-ergodicity flag) *and*  
       - Weight Score ≥ 4.  
     - **Banded** *if*:  
       - Weight Score = 3–4 *or*  
       - Non-ergodic factors exist but historical analogues are partially relevant.  
     - **Comparable but Unranked** *if*:  
       - Relative risks can be argued qualitatively (e.g., "More fragile than Chile, less than Argentina") *but*  
       - Quantification/ranking lacks empirical or logical basis (Keynes’ non-comparability).  
     - **Suspended Judgment** *if*:  
       - Weight Score ≤ 2 *and/or*  
       - Non-ergodicity dominates (novel events, undefined policies).  

  2. **Committee Pushback Protocol:**  
     - If forced to rank "unrankable" cases:  
       - Append this disclaimer: *"Ranking reflects heuristic urgency, not quantifiable risk difference. Weight Score: [X/5]."*  
       - Use brackets (e.g., "[PD 15–30%]") to denote artificial precision.  

  3. **Transparent Judgment Calls:**  
     - **Explicitly document:**  
       - Which variables were treated as non-ergodic (vs. stable).  
       - Gaps forcing banded/unranked/suspended verdicts.  
       - Any use of "animal spirits" (e.g., investor sentiment proxies without data).  

  ---

  ### **Case Applications**
  **Case A: Mid-Income Borrower (Constitutional Crisis)**  
  - **Data:** 20 years of fiscal data (Weight Score: 4).  
  - **Risk:** Plausible unprecedented constitutional crisis → *non-ergodic* (no local precedents).  
  - **Verdict:** **Banded Estimate** (e.g., "PD 4–11%").  
    - *Why:* Historical data informs baseline, but crisis probability is non-quantifiable novelty. Weight Score penalizes model uncertainty.  
  - **Committee Reaction:** Will dislike bandwidth (prefers single number), but procedure forces honesty.  

  **Case B: Livestock Pandemic Risk**  
  - **Data:** No local cases; robust global base rates (Weight Score: 3).  
  - **Risk:** Known zoonotic pathways → *ergodic* (global frequencies applicable).  
  - **Verdict:** **Numerical Estimate** (e.g., "PD 2.3% ± 0.8%").  
    - *Why:* Base rates anchor probability; model gaps reduce Weight Score.  

  **Case C: New Government (Unspecified Reforms)**  
  - **Data:** Election outcome clear; fiscal plan undefined (Weight Score: 1).  
  - **Risk:** Policy space non-ergodic (future path depends on unmade decisions).  
  - **Verdict:** **Suspended Judgment**.  
    - *Why:* No basis for probability assignment (Keynes: "We simply do not know").  
  - **Committee Reaction:** **Will reject this fiercely** (demands a number for pricing). Procedure forces analyst to hold firm, citing Weight Score 1.  

  ---

  ### **Where the Procedure Misfires (and Mitigations)**  
  1. **Over-Sanitizing Complex Risks:**  
     - Keynes’ non-comparability may over-fragment correlated risks (e.g., global supply chains).  
     - *Fix:* Allow group assessments for regionally linked economies.  

  2. **Underweighting "Unknown Unknowns":**  
     - Weight Score relies on *identified* gaps; true Knightian uncertainty escapes capture.  
     - *Fix:* Mandate a "Black Swan Audit" quarterly: "What uncontemplated event could invalidate our models?"  

  3. **Misclassifying Ergodic Processes:**  
     - E.g., falsely labeling routine political turnover as non-ergodic.  
     - *Fix:* Require analysts to cite specific *mechanisms* making outcomes path-dependent.  

  4. **Committee Gaming:**  
     - Pressure to "upgrade" Suspended cases to Banded using arbitrary heuristics.  
     - *Fix:* Track predictive accuracy of each verdict type; report downgrades due to low-weight estimates.  

  ---

  ### **Why Keynes Would Approve (and the Compromise)**  
  This procedure preserves his core ideas:  
  - **Weight ≠ Probability** (explicit scoring),  
  - **Non-comparability** (unranked/suspended options),  
  - **Non-ergodicity** (flags for uniqueness).  

  **The Compromise:** Forcing uncertainty into discrete categories (banded/unranked) is itself a quantification. But by *limiting* numerical outputs to high-weight/ergodic cases, it avoids the "false precision" Keynes despised. When your analysts suspend judgment for Case C, they embody his maxim: *"It is better to be roughly right than precisely wrong."*  

  --- 
  **Implementation Tip:** Pilot this with your team using past crises. Show how Suspended/Banded verdicts for Greece (2015) or Sri Lanka (2022) would have better captured pre-default uncertainty than point estimates.
