prompt: |-
  I help decide how a large pool of grant money is split across causes — global health, factory-farm animal welfare, existential risk, and a few others — and the tool we use is the importance–tractability–neglectedness framework: score each cause on importance (the good that would be done if the problem were fully solved), tractability (the share of the problem a fixed increase in resources is expected to remove), and neglectedness (a discount for crowdedness, on the thought that returns diminish as more money and attention arrive in an area); combine the three scores, and rank the causes. Before we lean on this any further — or replace it — I want the specification it is supposed to live up to, written out and justified, not a defense of the incumbent.

  Please write out the desiderata a cause prioritization framework must meet to be adequate for our actual allocation decisions: the cases it must get right, the distinctions it cannot collapse — marginal versus average impact, cause-level versus intervention-level judgments, the difference between a problem being large and a solution to it being underfunded — and the facts about funding markets it must respect, such as diminishing returns, other funders adjusting when we move, and the possibility that an intervention does net harm rather than just less good. For each requirement, give the case or consideration behind it; mark which are non-negotiable and which are conveniences of our particular situation; flag any pair you suspect cannot be jointly satisfied (I would especially like your view on whether a framework can be at once sensitive to diminishing returns and stable under our choosing where to draw the boundaries between causes); and say which single requirement excludes the most plausible rivals. Then, briefly, score the importance–tractability–neglectedness framework as we use it against the list: where it passes, where it fails, and which failure matters most. Please answer in American English.
reasoning: |-
  Okay, the user works in grant allocation and uses the importance-tractability-neglectedness (ITN) framework to distribute funds across causes like global health, animal welfare, and existential risks. They want a clear specification of what a cause prioritization framework should achieve, including necessary features and potential pitfalls. 

  Hmm, the user seems deeply familiar with the ITN framework but is questioning its foundations—they're not defending it but seeking rigorous criteria to evaluate or replace it. That shows intellectual humility and strategic thinking. Their unspoken need might be avoiding costly allocation mistakes or justifying a framework shift to stakeholders.

  Let me unpack their explicit asks: They want desiderata covering:
  - Marginal vs average impact distinctions (crucial because funding decisions happen at the margin)
  - Cause vs intervention-level granularity (since causes are broad umbrellas)
  - Problem size vs funding gap differences (a large problem isn't automatically underfunded)
  - Real-world funding dynamics like diminishing returns, funder reactions, and harm risks

  The non-negotiables jump out: Any framework must handle diminishing returns and avoid causing net harm. Those are ethical and practical dealbreakers. The tension between boundary sensitivity and stability is also critical—they likely face internal debates about cause definitions affecting rankings.

  For rival frameworks, the "marginal impact" requirement alone disqualifies many alternatives like purely importance-based rankings or burden-of-disease approaches. Those ignore how additional funds perform. 

  Now evaluating ITN against the specs... Its neglect score tries to capture diminishing returns but crudely—it doesn't model other funders' reactions. The multiplicative combo is brittle with zero scores, and tractability often conflates average/marginal effects. Worst failure? Probably the neglect measurement since it affects allocation efficiency most. 

  User's context suggests high stakes: Large pools mean small errors cost lives or missed opportunities. They'd need frameworks that are robust, adaptive, and transparent for committee buy-in. Might also appreciate sensitivity analysis tools for boundary decisions.
answer: |-
  Here’s a specification for a cause prioritization framework tailored to your grant allocation context, with justifications, trade-offs, and an evaluation of the ITN framework:

  ### **Core Desiderata for a Cause Prioritization Framework**
  *(Non-negotiable = ⚠️ | Context-dependent = ▫️)*

  1.  **⚠️ Marginal Impact Focus**  
      *Requirement:* Must estimate the *additional good* achieved by the next dollar (or unit of resources), not the average good per dollar historically spent.  
      *Why:* Funding decisions are incremental. A cause with high average impact but saturated funding may have near-zero marginal returns. *Excludes rivals* like "disease burden" rankings (e.g., DALYs) or pure "importance"-only frameworks.  

  2.  **⚠️ Diminishing Returns Integration**  
      *Requirement:* Must explicitly model how impact per dollar declines as funding increases in a cause/intervention.  
      *Why:* Real-world resources face scalability limits (e.g., hiring talent, scaling interventions). Ignores this → overfunding crowded areas. *Key tension*: Hard to reconcile with cause boundary stability (see #7).  

  3.  **⚠️ Net Impact Accounting**  
      *Requirement:* Must penalize interventions/causes with risk of net harm (e.g., unintended consequences, displacement effects) or low confidence.  
      *Why:* Funding harm negates the purpose. EA principles demand counterfactual responsibility. *Excludes rivals* that only maximize "good" without risk penalties.  

  4.  **⚠️ Funder Reactivity**  
      *Requirement:* Must account for how other funders adjust behavior when you fund a cause (e.g., crowding out/in).  
      *Why:* If your $1M displaces $1M from another funder, net impact is near-zero. Ignores this → overestimating impact in competitive spaces.  

  5.  **▫️ Cause vs. Intervention Granularity**  
      *Requirement:* Should function at both levels: "cause" (e.g., AI safety) for strategy, "intervention" (e.g., technical AI alignment research) for execution.  
      *Why:* Your pool likely funds within broad causes. Aggregating interventions into causes risks losing resolution (e.g., a "tractable" cause may include intractable subs). *Contextual*: Depends on grant size.  

  6.  **⚠️ Distinguish Problem Size vs. Funding Gap**  
      *Requirement:* Must separate:  
      - **Problem scale** (e.g., 1B DALYs lost/yr to malaria).  
      - **Current funding gap** (e.g., only 10% of cost-effective interventions funded).  
      *Why:* A huge problem (e.g., aging) may already be well-funded; a smaller problem (e.g., lead poisoning) may be critical if highly neglected. ITN "neglectedness" tries but often fails here.  

  7.  **⚠️ Boundary Sensitivity vs. Stability Trade-off**  
      *Requirement:* Must be robust to reasonable changes in cause definitions (stability), yet sensitive to real differences in marginal returns (boundaries matter).  
      *Why:* Drawing boundaries arbitrarily (e.g., "global health" vs. "pandemic preparedness") shouldn’t flip rankings, but collapsing distinct areas (e.g., AI safety + biosecurity) may hide neglected niches. *Tension with #2*: Diminishing returns depend on boundaries – no perfect solution exists.  

  8.  **▫️ Dynamic Adjustment**  
      *Requirement:* Should allow updates as funding levels, evidence, or external factors change.  
      *Why:* Impact estimates decay (e.g., a "neglected" cause attracting funding becomes less so). *Contextual*: Essential if allocations are multi-year.  

  ---

  ### **Evaluation of ITN Framework**
  **Passes:**  
  - **Importance ≈ Problem Size:** Useful for identifying massive problems (e.g., x-risk).  
  - **Tractability ≈ Marginal Impact Proxy:** At its best when "tractability" is explicitly marginal (e.g., "cost per life saved *at current funding level*").  
  - **Neglectedness ≈ Crude Diminishing Returns:** Recognizes that funded areas may have lower returns.  

  **Fails:**  
  1.  **⚠️ Marginal Impact:** Often conflates *average* tractability (historical success) with *marginal* tractability (next dollar's impact). E.g., a 90%-solved problem may have low marginal returns even if historically tractable.  
  2.  **⚠️ Funder Reactivity:** Neglectedness scores rarely model how others react. If you fund a "neglected" cause, others may join, inflating impact.  
  3.  **⚠️ Net Harm:** ITN assumes more funding → more good. No built-in penalty for interventions with harm risk (e.g., some policy advocacy).  
  4.  **Boundary Instability:** "AI safety" vs. "AI governance" scores can diverge wildly based on definitions, altering rankings.  
  5.  **Neglectedness Misuse:** Often measured as "current $ spent," which ≠ diminishing returns. A cause with high fixed costs may need large funding before returns diminish.  

  **Most Critical Failure:** **⚠️ Marginal Impact Conflation.** If ITN uses average tractability (e.g., "cost per life saved in past projects"), it risks directing funds to saturated areas where impact is now low. This wastes resources on the margin – the core decision factor.

  ---

  ### **Recommendation**
  ITN is a useful heuristic but inadequate for *marginal allocation decisions*. Prioritize frameworks that:  
  - Explicitly model **marginal cost-effectiveness** (e.g., MCEA).  
  - Incorporate **probabilistic net impact** (including harm risks).  
  - Use **funding elasticity** to estimate crowding out/in.  
  - Apply **sensitivity analysis** to cause boundaries.  
  **Next step:** Pilot a dynamic model (e.g., iterative MCEA + diminishing returns curves) on 1–2 causes vs. ITN to quantify divergence.
