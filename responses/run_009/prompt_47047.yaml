answer: |-
  ## Conflict Resolution via Safe Lottery Procedure

  ### 1. The Principle, in Plain Terms  
  *(Read Aloud to Parties)*

  "When two groups face a costly dispute—like weeks tied up in grievances instead of research—we have a specific way to explore whether replacing the fight with a random draw could leave *both* of you better off. Here’s the key idea:  

  If we can design a lottery over the possible outcomes of your dispute—say, a coin flip deciding who controls the spectrometer—and **both** of you would prefer taking that lottery *today* over fighting it out, **even if you knew for certain you’d win the fight**, then swapping the fight for the lottery is "safe." It makes you each better off *no matter what would have happened* in the grievance.  

  *Why?* Because fighting burns time, money, and goodwill—costs you’d both avoid. The lottery captures the uncertainty of the grievance outcome without those costs. Crucially:  
  - This is **not about fairness**. A 10% chance might feel unfair, but if you prefer it to a guaranteed "win" after a costly fight, it’s still a safe improvement.  
  - This **isn’t just any compromise**. We test rigorously whether *each* of you, imagining you’d have won the fight, still prefers the lottery. If either wouldn’t, we stop.  
  - The goal is **mutual gain by avoiding waste**, not splitting the difference. If we can’t find a lottery that clears this bar, we’ll mediate normally."

  ---

  ### 2. The Procedure  
  *(Follow Strictly; ≈1 Page)*

  **Step 1: Map Costs & Outcomes**  
  - Ask: *"If this escalates to a formal grievance, what resources will each of you spend? (E.g., 40 hours of PI time, $15k legal fees, delayed grants.)"*  
  - **Test 1:** If either party states costs are negligible or enjoyable ("We’ll make the dean pay"), → **Terminate: Not applicable, mediate normally**.  
  - Ask: *"What are the possible final rulings? (E.g., Group A gets all weeks; Group B gets all; split 60/40.)"*  

  **Step 2: Design the Lottery**  
  - Propose: *"Suppose we replace the fight with a lottery giving X% chance of Outcome 1, Y% of Outcome 2, etc. What probabilities would make you prefer this to fighting?"*  
  - **Critical Test 2 (Per Outcome):** To Group A: *"If you knew the dean would rule 100% in your favor, would you still prefer the lottery?"* Repeat for Group B.  
  - If either says "no," → **Terminate: No safe lottery exists. Hand back for normal mediation**.  
  - **Judgment Note:** If probabilities are contested, start with equal odds unless both agree weights (e.g., "Should chances reflect your claimed rights?"). If they deadlock here → **Terminate: Values question; hand back**.  

  **Step 3: Verify Commitment & Execution**  
  - Ask: *"Can you both publicly commit to honor the lottery result? If you back out, what reputational harm follows?"*  
  - **Test 3:** If either cannot commit credibly (e.g., no reputational risk), → **Terminate: Not applicable**.  
  - **Test 4 (Non-Transferability):** *"Does winning the lottery deliver the full value of winning the fight? Or is there symbolic value lost?"* (E.g., Prestige from "beating" rivals.) If yes → **Terminate: Values question; hand back**.  
  - Agree on a **public, verifiable draw** (e.g., sealed envelope opened jointly, dean’s public coin flip).  

  **Step 4: Execute Agreement**  
  - Draft terms: "Parties withdraw grievance. Outcome determined by [method]. Non-compliance reputational."  
  - Sign and publicize commitment to the draw.  

  ---

  ### 3. Where Judgment Cannot Be Eliminated  
  *(Mediator Assessments Required)*  

  1. **Bluff Detection:** When parties claim "We’ll fight at any cost," assess credibility:  
     - *Are costs exaggerated?* (E.g., tenured PIs threatening resignations they won’t execute.)  
     - *Does the unit have a history of escalating petty disputes?*  
     - **Action:** Probe privately: *"Realistically, would your provost approve $50k in legal fees over this?"* Discount implausible threats.  

  2. **Non-Transferable Values:** You must judge if a "win" via lottery feels identical to a win via grievance.  
     - *Example:* In naming disputes, the *process* of "defeating" rivals may confer prestige.  
     - **Action:** Ask: *"If you ‘lose’ the lottery, will you feel you avoided a fight or were robbed of victory?"* If the latter → stop.  

  3. **Cost Valuation:** When parties dispute cost estimates (e.g., "Our time is worth $500/hour"), you must assign reasonable proxies (e.g., grant $/hour rates).  

  ---

  ### 4. Worked Applications  

  **(a) Spectrometer Time (Textbook Case)**  
  - **Step 1:** Both groups estimate 80+ hours each in grievance meetings → Costs confirmed. Outcomes: Group A wins 100% of weeks, Group B wins 100%, or 50/50 split.  
  - **Step 2:** Propose 50/50 lottery.  
    - *Test 2 (Critical):* "Group A, if guaranteed 100% win, prefer lottery?" *Yes (saves 80 hours)*. Group B same.  
  - **Step 3:** Both commit; weeks are transferable. Draw: Dean flips coin.  
  - **Result:** Safe swap applies.  

  **(b) Startup Fund Control (Power Imbalance)**  
  - **Step 1:** Weak unit: "We’d spend 200 hours." Powerful unit: "Dean handles it; we enjoy the fight."  
  - **Test 1 (Costs):** Powerful unit’s costs are externalized/enjoyable → **Terminate: Not applicable**.  
  - **Action:** Escalate to dean: "Mediation futile; one party perceives negative costs."  

  **(c) Naming Precedence (Symbolic Stakes)**  
  - **Step 1:** Both estimate reputational costs if fight poisons collaboration. Outcomes: "Center X & Y" or "Y & X."  
  - **Step 2:** Propose 50/50 lottery.  
    - *Test 2:* "Unit X, if guaranteed first position, prefer lottery?" *"No—we deserve it; lottery feels illegitimate."*  
  - **Test 4 (Non-Transferability):** Prestige from "victory" is lost in a random draw → **Terminate: Values question; hand back**.  
  - **Alternative:** Propose coin flip for *future* naming rights on unrelated projects.  

  ---

  ### 5. What the Procedure Cannot Do  

  1. **Fix Asymmetric Power:** If one party bears no costs (or profits) from conflict (Case b), no safe lottery exists.  
  2. **Resolve Values Conflicts:** When winning via fight confers unique status (Case c), lotteries feel hollow.  
  3. **Prevent Gaming:** Savvy parties may overstate willingness to fight to extort better odds. Mitigation: Anchor probabilities externally (e.g., "Dean suggests 60/40 based on past rulings").  
  4. **Enforce Honesty:** If parties treat the lottery as "non-binding" and relitigate, reputational enforcement fails.  
  5. **Mediator Bias:** Your incentive to "get a deal" may tempt you to skip Test 2. **Never proceed without "yes" to conditional question.**  
  6. **Erosion of Trust:** Repeated lotteries may feel like abdicating justice. Reserve for clear mutual-destruction cases.  

  **Final Note:** This is a scalpel, not a hammer. Use only when costs are mutual/credible, values are transferable, and conditional preferences align. Else, mediate traditionally.
