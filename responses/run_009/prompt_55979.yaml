  Major Concepts to Cover:
  1. Biological Species Concept (BSC) - Mayr: species are groups of actually or potentially interbreeding natural populations that are reproductively isolated.
  2. Phylogenetic Species Concept (PSC):
     a. Diagnosability-based (PSC-d): species are the smallest diagnosable clusters of organisms.
     b. Monophyly-based (PSC-m): species are monophyletic groups (often with the added requirement of being the smallest such group that is exclusive).
  3. Evolutionary Species Concept (ESC): species are a lineage evolving separately from others with its own unitary evolutionary role and tendencies.
  4. Ecological Species Concept (EcSC): species are a set of organisms adapted to a particular set of resources (a niche) in an environment.
  5. Cohesion Species Concept (CSC): species are the most inclusive group of organisms having the potential for phenotypic cohesion through intrinsic cohesion mechanisms (gene flow, natural selection, etc.).
  6. Phenetic Species Concept (PhSC): species are clusters of organisms that are phenotypically similar and distinct from other clusters.

  We also consider:
  - Monism: only one species concept is correct for all taxa.
  - Pluralism: different concepts may be correct for different taxa.

  Cases to use in questions:
  - Ring species (e.g., Ensatina salamanders): continuous gene flow along a ring but the ends do not interbreed.
  - Obligate asexuals (e.g., bdelloid rotifers): no sexual reproduction, so no interbreeding.
  - Frequent hybridization without merger (e.g., Helianthus sunflowers, wolves/coyotes): hybridization occurs but the groups remain distinct.
