  ### Species Concept Decision Tree  
  *Answer the following questions based on your intuitions about biological cases. Do not overthink—go with your initial reaction. Your path will reveal which species concept aligns with your commitments.*  

  #### Q1: **Can an obligately asexual lineage (e.g., bdelloid rotifers, reproducing without sex) form a species?**  
  - **No** → **Leaf: Biological Species Concept (Monist)**  
    *Species are groups of interbreeding populations reproductively isolated from others. Asexuals cannot form species.*  
  - **Yes** → Proceed to Q2.  

  #### Q2: **Can an ancestral species (e.g., *Homo erectus*) continue to exist after giving rise to a descendant species (e.g., *Homo sapiens*)?**  
  - **No** → **Leaf: Phylogenetic Species Concept (Monophyly-Based)**  
    *Species must be monophyletic (an ancestor and all its descendants). An ancestral species cannot survive speciation.*  
  - **Yes** → Proceed to Q3.  

  #### Q3: **In a single interbreeding population, two subgroups are genetically and morphologically diagnosable (e.g., distinct color morphs in birds) but share the same ecological role and interbreed freely. Are they one species?**  
  - **Yes** → Proceed to Q4.  
  - **No** → Proceed to Q3a.  

  #### Q3a: **Two populations are diagnosable by a single genetic marker but identical in ecology and overall appearance. Are they different species?**  
  - **Yes** → **Leaf: Phylogenetic Species Concept (Diagnosability-Based)**  
    *Species are the smallest diagnosable units with fixed differences.*  
  - **No** → **Leaf: Phenetic Species Concept**  
    *Species are clusters of organisms phenotypically distinct from other clusters.*  

  #### Q4: **Two populations frequently hybridize in nature (e.g., wolves and coyotes) but remain distinct in genetics, ecology, and morphology. Are they separate species?**  
  - **Yes** → Proceed to Q5.  
  - **No** → **Leaf: [EMPTY CELL]** *(See Notes)*  

  #### Q5: **A species has isolated populations with no gene flow between them, but strong stabilizing selection maintains identical adaptations. Is this one species?**  
  - **No** → **Leaf: Cohesion Species Concept**  
    *Species are held together by cohesion mechanisms (e.g., gene flow); without gene flow, they fragment.*  
  - **Yes** → Proceed to Q6.  

  #### Q6: **A population splits from its parent group, adapts to a new niche, and has occasional gene flow with the parent. Is it a new species?**  
  - **Yes** → **Leaf: Ecological Species Concept**  
    *Species are defined by their ecological niche; divergence in niche creates new species.*  
  - **No** → **Leaf: Evolutionary Species Concept**  
    *Species are lineages evolving separately with distinct evolutionary tendencies.*  

  ---  
  ### Instructor Notes: Empty Cells and Inseparable Pairs  

  #### Empty Cells  
  1. **Q4 → No (Hybridizing groups must be one species):**  
     *Why empty?* This position is incoherent or unattractive. You accept asexuals as species (Q1: Yes), so reproductive isolation isn’t universally required. Yet you demand it here for sexual taxa without justification. No major concept holds this: BSC rejects asexuals (contradicting Q1), while non-BSC concepts (e.g., PSC, ESC) treat hybridization as compatible with species distinctness.  

  2. **Q5 → Yes with CSC undertones:**  
     *Implicit gap:* The Cohesion Concept *could* accept stabilizing selection as a cohesion mechanism (answering Q5: Yes), but the tree routes "Yes" to Q6 instead. This reflects a simplification: CSC is often operationalized around gene flow. If students protest, note that CSC’s breadth (including selection) makes it hard to split cleanly—highlighting the fuzziness in real-world applications.  

  #### Inseparable Pairs  
  1. **Ecological vs. Evolutionary Species Concepts (Q6 leaves):**  
     *Why inseparable?* Both answer similarly to niche-based divergence cases (e.g., Q6). The ESC emphasizes lineage history, while the EcSC focuses on current niche adaptation. In practice, they overlap heavily (e.g., a new niche often implies divergent evolution). To distinguish them, we’d need temporal edge cases (e.g., "Can a lineage change niches without speciation?"), but students lack clear intuitions here.  

  2. **Phenetic vs. Diagnosability-Based PSC (Q3a leaves):**  
     *Why inseparable?* Both prioritize "distinctness" over interbreeding or lineage history. The tree uses a subtle split (single-marker diagnosability vs. overall similarity), but in real cases (e.g., morphologically distinct subspecies), students’ answers may be inconsistent. These concepts are often conflated; pure phenetics is rare today.  

  #### Design Rationale  
  - **Surprise factor:** Students memorizing BSC often land elsewhere (e.g., 80%+ take the "Yes" branch at Q1). The empty cell at Q4 forces confrontation with inconsistent commitments.  
  - **Key splits:** Q1 isolates BSC; Q2 isolates monophyly-based PSC; Q3 separates cohesion/lineage concepts from diagnosability/phenetic ones; Q4/Q5 handle gene flow’s role.  
  - **Pluralism:** The tree reveals monist positions. If students resist (e.g., "My answer depends on the organism!"), they lean pluralist—note this as a meta-outcome.  
  - **Handout-friendly:** Fits 2 pages. Use cases: Ring species (implied in Q4’s hybridization), ancestor-descendant (Q2), asexuals (Q1), and diagnosable morphs (Q3).  

  This tree exposes hidden assumptions—e.g., accepting asexuals as species (Q1) or hybridization without merger (Q4) leads students to concepts they’d dismissed as "philosophical." Discussing the empty cells and inseparabilities then clarifies why the species problem persists.
