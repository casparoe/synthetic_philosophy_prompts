prompt: |-
  I'm a PhD student TAing intro ethics, and next week I have one fifty-minute section on the is-ought gap and the naturalistic fallacy. The students will have read Hume's remark about how writers slide imperceptibly from "is" propositions to "ought" propositions, and Moore on defining "good" in natural terms, but they will arrive thinking these are two names for one thing, because most textbook presentations present them back to back without saying they're different complaints entirely. Don't explain the two ideas to me; plan how I should teach them. Specifically: what has to come first, and whether that's the logical point about validity and hidden premises or the semantic point about definition -- I have a suspicion the order matters more than it looks, because if the definitional point comes second it reads as a footnote, and if it comes first the Hume point collapses into it; the one carrying example to build the whole session around, and it has to be an example where the audience can actually feel the pull of both the invalid and the valid versions of the argument -- I'm inclined toward a policy argument from a social-scientific finding, something like "inequality erodes trust, so we ought to redistribute," because it makes the hidden normative premise visible without any hand-waving, but tell me if there's a better candidate and what it must have and lack; the misconceptions I should expect, in the order the students will form them -- I'm guessing at least these: that Hume's point forbids any conclusion containing "ought" from ever following from descriptive premises, that Moore's open question argument shows the same thing, and that the "naturalistic fallacy" is the same as arguing from what's natural to what's good, which I understand to be a different fallacy altogether -- and exactly where in the sequence each should be headed off; whether to bring in Searle's attempt to derive an "ought" from institutional facts at all, or whether that's a third thing this audience can't hold separate from the first two; and one question I can ask in the last five minutes that would reveal whether they've got the two distinctions apart rather than just memorized the slogans. Lead with the single most important structural decision about the session -- the one thing I'd get wrong if I planned it myself -- in your first sentence, then give the reasoning; no preamble and no restating of what I've asked.
reasoning: |-
  Okay, the user is a PhD student TA teaching an intro ethics section on the is-ought gap and the naturalistic fallacy. They want a lesson plan that distinguishes these two concepts, which students often confuse. The key challenge is structuring the session so the differences are clear, not conflated.

  First, I need to address the most critical structural decision: teaching Hume's is-ought gap first, then Moore's naturalistic fallacy. If done in reverse, Moore's definitional point might overshadow Hume's logical point, making students think they're the same. Starting with Hume establishes the logical barrier before introducing Moore's semantic argument.

  For the carrying example, the user suggested a policy argument like "inequality erodes trust, so we ought to redistribute." That works well because it clearly shows the missing normative premise. I'll refine it to make the hidden "ought" explicit: "Inequality erodes trust (is), and we ought to prevent trust erosion (ought), therefore we ought to redistribute." This demonstrates Hume's gap and the need for a bridging premise.

  Common misconceptions to address:
  1. Students might think Hume forbids any "ought" from descriptive premises. Clarify that it's about validity without hidden premises.
  2. They may conflate Moore's open question argument with Hume's point. Emphasize that Moore is about definitions, not inference validity.
  3. Confusing "naturalistic fallacy" with arguing from "natural" to "good." Point out that Moore's fallacy is about defining "good" naturalistically, not the appeal-to-nature fallacy.

  Searle's institutional facts might complicate things for beginners. Since the priority is distinguishing Hume and Moore, it's better to skip Searle to avoid muddying the waters.

  For assessment, a closing question like: "Imagine two people debating an argument from descriptive premises to an 'ought' conclusion. Person A says the argument is invalid per Hume. Person B says it commits the naturalistic fallacy by defining 'good' in natural terms. Who is correct?" This tests their ability to apply the distinctions correctly.

  The lesson flow should be:
  - Start with Hume using the inequality example, showing the missing premise.
  - Then introduce Moore with a definition example like "pleasure = good," applying the open question argument.
  - Explicitly contrast them: Hume is about logic (validity), Moore is about semantics (definition).
  - Preempt misconceptions at each step, especially when shifting topics.

  By maintaining this sequence and clear examples, students should leave understanding these as separate philosophical tools rather than conflated concepts.
answer: |-
  ### Lead Structural Decision: **Begin with Hume's is-ought gap as a problem of logical validity, using a concrete policy argument to expose missing premises, *before* introducing Moore’s naturalistic fallacy as a distinct definitional error.**  
  *(Reverse order merges them; starting with Moore makes Hume’s gap seem like a semantic quibble.)*  

  ---

  ### **Session Plan**  
  **Total Time:** 50 minutes  
  **Core Example:** Policy argument: *"High inequality erodes social trust (IS). Therefore, we ought to reduce inequality (OUGHT)."*  

  #### **Step 1: Hume’s Is-Ought Gap (25 mins)**  
    - **Hook (5 mins):** Present the example. Poll students: *"Does the conclusion follow? Why/why not?"* Let them feel its intuitive pull.  
    - **Logical Breakdown (15 mins):**  
      - Isolate the structure: *P1 (IS): Inequality erodes trust. → Conclusion (OUGHT): We ought to reduce inequality.*  
      - Highlight the gap: *"Is there a rule saying we must act on every factual correlation?"*  
      - Reveal the hidden premise: Add *P2 (OUGHT): "We ought to prevent erosion of social trust."* Show validity with both premises.  
      - **Key Point:** Hume’s gap is about **invalid inference**—you can’t get "ought" from "is" alone without a normative bridge.  
    - **Preempt Misconception 1:** *"Hume forbids all ‘ought’ conclusions from facts."*  
      → Clarify: *"No—he says you need explicit normative premises. Science + ethics can work together if the ‘ought’ is stated."*  

  #### **Step 2: Moore’s Naturalistic Fallacy (15 mins)**  
    - **Pivot with a New Example (5 mins):** Shift to definition: *"Social trust is measurable (natural property), and trust is good. So ‘good’ means ‘increases social trust.’"*  
    - **Open Question Drill (10 mins):**  
      - Ask: *"If we define ‘good’ as ‘increases trust,’ is it still meaningful to ask: ‘I know this policy increases trust, but is it good?’"*  
      - Contrast with Hume: Moore isn’t about inference—it’s about **semantic error** (defining "good" with natural properties).  
    - **Preempt Misconceptions 2 & 3:**  
      - *"Moore’s open question = Hume’s gap?"* → No: Moore targets definitions; Hume targets inference.  
      - *"Naturalistic fallacy = ‘natural equals good’?"* → No: That’s the appeal-to-nature fallacy. Moore’s is defining "good" reductively.  

  #### **Step 3: Contrast & Consolidation (5 mins)**  
    - **Side-by-Side Comparison:**  
      | **Hume** | **Moore** |  
      |----------|----------|  
      | Problem: **Invalid argument** (missing ought-premise) | Problem: **Poor definition** (reducing "good" to natural terms) |  
      | Example: *"Inequality → trust erosion → redistribution?"* (needs "we ought to preserve trust") | Example: *"‘Good’ = ‘increases trust’"* (fails open question test) |  
    - **Skip Searle:** Institutional facts add complexity. For this audience, it risks conflating the two focal issues.  

  #### **Step 4: Assessment Question (5 mins)**  
    - **Revealing Prompt:** *"Imagine someone argues: ‘Studies show honesty reduces stress. So "good" means "honest."’ Which philosopher’s objection is more relevant here—Hume’s or Moore’s? Why?"*  
      - **Correct Distinction:** Moore (definition of "good"), not Hume (no inference from "is" to "ought" in the argument).  

  ---

  ### **Why This Structure Works**  
  - **Example Choice:** The policy argument works because:  
    - Its hidden premise (*"we ought to protect trust"*) is **non-tautological** (students might reject it).  
    - It **separates inference (Hume) from definition (Moore)** cleanly: Redefining "good" as "trust-building" is a distinct mistake.  
  - **Order Prevents Collapse:** Starting with Hume’s logical gap anchors it as foundational. Moore later adds a layer—students see his fallacy as a *different* error (defining terms vs. bridging facts/values).  
  - **Misconceptions Addressed Proactively:** Each is countered at the point it arises (e.g., Hume’s "no ought from is" clarified during Step 1; Moore’s "definition ≠ inference" in Step 2).  

  **Final Tip:** Use the same policy example for both halves (Hume: argument structure; Moore: defining "good" as trust-related) to show how one case can involve both errors—but only if distinct steps are taken.
