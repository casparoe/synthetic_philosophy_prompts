  First, I need to understand the core argument. The user presents a sorites-style argument against composition: (1) Either composition occurs or it doesn't; (2) If composition occurs, there must be vague cases due to continuum of arrangements; (3) Vague composition implies vague object count; (4) Vague object count is impossible; (5) Therefore no composition occurs. 

  The user's worry is that the same logic seems to apply to fundamental particles: (6) Particles have vague locations; (7) Vague location implies vague existence; (8) But (4) forbids vague existence. This would nihilize even the simples, which is absurd. 

  Hmm... the user's friend tries to distinguish between vagueness in location versus existence, but the user isn't convinced. The user is inclined to keep (4) but attack (2) or (3), yet finds them tightly linked. 

  Let me think about possible weak points. Premise (4) is strong - the intuition that concrete objects can't have vague existence seems solid. Premise (1) is just a dichotomy. Premise (3) seems logically tight: if composition is vague, object count must be vague. That leaves premise (2) as the most promising target. 

  But why might (2) be wrong? Well, perhaps composition isn't vague after all. The nihilist could claim that composition never occurs, so there's no actual vagueness - just our epistemic uncertainty. But that feels like cheating. 

  A better approach might be to challenge what counts as "composition." If composition requires a specific relation (like contact or bonding), and that relation has sharp boundaries in physics, then premise (2) fails. For example, quarks either are or aren't bound by strong force - there's no vagueness. 

  The user might object that we can still imagine a sorites sequence with fictional particles. But perhaps the nihilist can bite the bullet here: in the actual world, fundamental relations are sharp, so composition claims are always determinate (even if always false). 

  Regarding the electron problem: the friend's distinction might hold if we consider particles as enduring entities. "The electron exists" is determinate; only its location is vague. This preserves object count stability. But the user rightly points out that for spatial regions, it becomes vague whether an object exists there. 

  I think the strongest reply is ontological: regions aren't objects. When we say "there exists an object in region R," this is derivative - what exists fundamentally is just the electron, with its vague location. The census counts fundamental entities, not region-occupancies. 

  This requires accepting that existence claims about regions are vague without threatening the fundamental object count. But the user might find this unsatisfying - it feels like special pleading. 

  Alternative approaches: reject (3) by claiming composition doesn't add objects (but that seems contradictory), or embrace epistemicism about vagueness (but that's controversial). 

  The physics-based response seems most promising: in our world, the relevant relations (quantum binding) have sharp thresholds, so premise (2) fails for actual cases. The electron's wavefunction vagueness is different - it's not soritical, but inherent to quantum states. 

  For the nihilist, the cost is accepting that composition could be vague in other possible worlds, but isn't in ours. And for particles, they must argue that quantum indeterminacy doesn't affect object count - perhaps through a perdurantist view where particles are spacetime worms with precise worldlines. 

  The user's core concern remains: both cases seem to threaten precise object count. I need to emphasize that the nihilist has resources to distinguish them, even if the distinction feels technical. The key is whether vagueness arises from sorites-susceptibility (composition) versus quantum indeterminacy (location), and whether we count by fundamental entities or spatial occupancy. 

  This won't satisfy everyone, but it preserves nihilism without total ontological collapse. The user seems sophisticated enough to weigh these tradeoffs.
answer: |-
  Your argument is admirably constructed, and your worry about its generalization to simples is astute. The core tension lies in reconciling the intuition behind (4) with the apparent vagueness in both composition and fundamental particle location. Let's dissect where the original argument is most vulnerable and whether the location/existence distinction holds.

  ### Weakest Premise in the Original Argument: (2)
  **Premise (2):** *"If composition ever occurs, then it is sometimes indeterminate whether it occurs."*  
  This is the most contestable step. Its plausibility relies on the assumption that *composition itself* is a vague or sorites-susceptible relation. However, nihilists (and others) can reject this assumption without contradiction. Here's why:

  1. **Composition as an all-or-nothing relation:**  
     If composition occurs at all, it might be governed by precise physical conditions (e.g., strong nuclear force binding quarks). At the quantum level, binding energies or entanglement have thresholds (though probabilistic) that are *not* vague. Quarks either are bound in a proton (determinate composition) or not (determinate non-composition). The sorites sequence you describe might be *epistemically* inaccessible or misdescribe the actual metaphysics.  
     - **Cost:** This requires biting the bullet on apparent vagueness in macroscopic objects (e.g., tables). The nihilist must argue that sorites puzzles for heaps are illusions of language or perception, not evidence of metaphysical vagueness. Composition either never occurs (nihilism) or occurs only under precise conditions (restricted composition), but never vaguely.

  2. **Rejecting vagueness in reality (Epistemicism):**  
     Premise (2) assumes metaphysical vagueness. An epistemicist (e.g., Williamson) argues there’s always a sharp cutoff in sorites sequences; we just can’t know where it is. If composition occurs, there’s a fact about exactly when it ceases, even if we can’t discern it.  
     - **Cost:** Epistemicism is controversial and clashes with intuitions about gradual change. It also doesn’t help nihilists much—since nihilists deny composition occurs at all, they avoid vagueness trivially.

  ### Why Other Premises Are Harder to Reject
  - **Premise (3):** *"Indeterminate composition → indeterminate object count."*  
    This is logically solid. If it’s indeterminate whether *A* and *B* compose *C*, then it’s indeterminate whether *C* exists. Object count depends on what exists, so vagueness here directly implies vagueness in the census.  
    - **Exception:** If composition doesn’t add a *new* object (e.g., if composition is identity), but this is implausible and contradicts nihilism’s motivation.  
  - **Premise (4):** *"Indeterminacy in concrete object count is impossible."*  
    This is your strongest intuitive anchor. Concrete objects are individuated mind-independently; the world can’t be "unsure" how many things exist. Rejecting this opens the door to rampant ontological vagueness (e.g., vague electrons, vague planets), which many find absurd.  
  - **Premise (1):** Uncontroversial dichotomy.

  ### Does the Generalization to Simples Succeed?
  Your friend’s distinction—**vagueness in location vs. existence**—is crucial and can block the generalization, but it requires careful metaphysics:  
  - **The Distinction:**  
    - For **composition**, vagueness is *de dicto*: it’s indeterminate *whether a new object exists* (e.g., "Does *C* exist?"). This violates (4).  
    - For **electron location**, vagueness is *de re*: the electron exists determinately, but it’s indeterminate *where it is*. The question "Is there an object in region *R*?" is vague, but the census question ("How many electrons exist?") is untouched. There is still exactly one electron, even if its spatial boundaries are fuzzy.  
      - **Analogy:** Consider a cloud. It’s vague where the cloud ends, but not whether the cloud exists. "Is there a cloud over Paris?" might be vague, but "How many clouds are there?" can be determinate (if we count cloud-masses, not arbitrary regions).  

  - **Why This Might Not Satisfy You:**  
    You’re right that "Is there an object in region *R*?" exhibits indeterminacy, and this *seems* like an existence claim. But for the nihilist, this question is **derivative**, not fundamental. The fundamental census only counts *basic entities* (simples), not regions of space. Regions aren’t ontological primitives; they’re defined by the distribution of simples.  
    - **Example:** If an electron’s wavefunction assigns 0.5 probability to region *R*, the nihilist says: "There determinately exists one electron. Its location property is indeterminate, but this doesn’t multiply entities or blur their count."  

  - **The Hole in the Distinction:**  
    Quantum mechanics might threaten even the *identity* of particles (e.g., in entanglement, indistinguishable particles). If two electrons can be "shared" across regions in a way that makes it indeterminate whether one or two exist, the problem resurfaces. However, nihilists can appeal to:  
    - **Field ontology:** Particles aren’t fundamental; fields are. Fields have determinate existence with vague *values* at points (like a blurry wave). The census counts fields, not particles.  
    - **Perdurantism:** Electrons are spacetime worms. Their count is fixed, even if their spatial boundaries at a time are vague.  

  ### Conclusion: What to Reject and Why
  - **Best Target: Premise (2).**  
    Reject the claim that composition *must* be vague if it occurs. Argue that composition is either:  
    (a) **Precise** (if it occurs at all), due to fundamental physical thresholds, or  
    (b) **Nonexistent** (nihilism), avoiding vagueness entirely.  
    **Cost:** Must explain away macroscopic sorites puzzles (e.g., heaps) as semantic or epistemic, not metaphysical.  

  - **Alternative: Refine Premise (4).**  
    Restrict (4) to *fundamental* concrete objects. Then:  
    - Composition vagueness threatens the count of *composite* objects, but nihilists deny these exist anyway.  
    - Electron location vagueness doesn’t threaten the count of *fundamental* entities (e.g., fields or spacetime worms).  
    **Cost:** Allows vague existence for non-fundamental objects (if you’re not a nihilist), and requires a privileged fundamental level.  

  Your parallel argument succeeds only if location vagueness implies *existence vagueness for fundamental entities*. The nihilist can block this by:  
  - Denying that regions define objects,  
  - Holding that particles have determinate identity despite vague location, or  
  - Adopting a field ontology.  

  The price is a more complex metaphysics, but it saves simples from your reductio. Nihilism survives—but only by leaning hard on the location/existence distinction and precisifying the ontology. If you keep (4), attacking (2) is your best path, though it may feel like a retreat to physics or epistemicism.
