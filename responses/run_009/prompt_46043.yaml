  First, I need to structure their collaboration document exactly as requested. The joint claims section should reflect common ground: folk psychology's practical utility (even if illusory), necessary conditions for elimination, and introspection's limited validity. Must phrase neutrally—e.g., "predictive success doesn't entail ontological truth" satisfies both (one sees it as praise, the other as damning with faint praise). 

  For the disagreements table... tricky. Need wording both would accept while preserving stakes. Example: "Predictive success as defeasible evidence" – eliminativist agrees it's evidence but defeasible, realist agrees it's defeasible but strong. Phlogiston analogy is pivotal too; must frame as "appropriateness of historical precedent" since both accept the facts but disagree on interpretation. 

  Ah, the cruxes are where it gets juicy. For "theory replacement," the eliminativist predicts neuroscience will eventually explain behavior without attitudes, while realist insists attitudes will remain irreducible. The "phenomenology" crux is sharper: if Mary the neuroscientist (Jackson's thought experiment) can deduce subjective experience from neural data, that hurts realism. Both should pre-commit to outcomes. 

  ...And about verbal disputes? The "belief" ambiguity jumps out. Realist means intentional content, eliminativist means folk-psychological construct. That's substantive, not merely verbal—but labeling it could prevent talking past each other. 

  *Pauses* User clearly knows the literature. I'll cite Churchland's "neurocomputational state space" vs Fodor's "systematicity argument" precisely. Prediction section must be falsifiable: e.g., "if lesion studies disrupt behavior without attitude-level patterns, eliminativism gains ground." 

  Final touch: candid note that their "successful theory" debate isn't verbal—it's about scientific realism itself. That’s the core rift. Document should help them track which future discoveries would sway each.
answer: |-
  ## Joint Statement of Adversarial Collaboration: Eliminative Materialism vs. Propositional Attitude Realism

  **Authors:** [Your Name] (Realist) & [Friend's Name] (Eliminativist)

  **Date:** October 26, 2023

  ### Preamble
  After extensive debate, we agree that further unstructured argument is unlikely to resolve our core disagreement regarding the ontological status of propositional attitudes (beliefs, desires, etc.). We commit to this adversarial collaboration to define our common ground, isolate precise points of contention, identify testable cruxes, and pre-register predictions to guide future discussion and evaluate evidence.

  ---

  ### I. Jointly Endorsed Claims
  We both affirm the following statements:

  1.  **Practical Efficacy of Folk Psychology (FP):** The framework of beliefs, desires, and other propositional attitudes, often termed "folk psychology" (FP), demonstrably provides significant predictive and explanatory power in navigating everyday social interactions and interpreting behavior across a vast range of human contexts. Its utility in practical reasoning is substantial and empirically observable.
  2.  **Conditions for Elimination:** For the elimination of propositional attitudes as *real entities* (not merely as useful constructs) to be considered scientifically justified progress rather than regress, a mature neuroscience (or successor science) must accomplish at least one of the following:
      *   **a) Superior Explanatory/Predictive Power:** Provide explanations and predictions of behavior *at least* as robust, comprehensive, and precise as FP across its domain of success, *without* invoking propositional attitudes or functionally equivalent states.
      *   **b) Explanatory Incompatibility:** Demonstrate that the fundamental principles and ontologies of the mature neuroscience are fundamentally incompatible with the existence of states possessing the core properties attributed to propositional attitudes by FP (e.g., intentionality/combinatorial syntax/semantics, causal efficacy qua attitudes).
  3.  **Fallible but Evidentially Relevant Introspection:** Introspective reports of our own beliefs, desires, and other propositional attitudes are fallible and subject to error, distortion, self-deception, and lack of access. However, such reports constitute *non-empty* evidence that must be accounted for by any theory of mind, even if ultimately explained away or reinterpreted by a neuroscientific theory. They are data points, not incorrigible foundations.

  ---

  ### II. Table of Residual Disagreements (Mutually Acceptable Phrasing)

  | Disagreement                                                                 | Realist Position (Fodorian)                                                                 | Eliminativist Position (Churchlandian)                                                               |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------- |
  | **1. Predictive Success as Evidence**                                        | The remarkable predictive success of FP constitutes strong (though defeasible) evidence that its core posits (beliefs, desires) genuinely exist. | The predictive success of FP, while real, is insufficient evidence for the existence of its posits; successful prediction does not entail ontological truth. |
  | **2. Historical Precedent (Phlogiston/Caloric)**                             | Phlogiston and caloric are misleading analogies for FP; FP is significantly more successful, deeply integrated, and resistant to replacement than these obsolete theories. | Phlogiston and caloric are highly appropriate analogies for FP; they were useful frameworks ultimately revealed as deeply mistaken about their core ontology, foreshadowing FP's fate. |
  | **3. Burden of Proof Regarding Elimination**                                  | The burden of proof lies squarely with the eliminativist to demonstrate *both* the falsity/incoherence of FP *and* the existence of a superior replacement meeting condition I.2. | The burden of proof lies with the realist to demonstrate that FP's posits are genuinely real, especially given FP's likely incoherence and the rise of neuroscience. FP's status as "folk" theory makes it presumptively false. |
  | **4. Likely Fate of FP Categories**                                          | Propositional attitudes (or functional/computational analogues with intentional content) will remain indispensable categories in any mature science of the mind, likely integrated with neuroscience. | The core categories of FP (belief, desire) will likely find no place in a mature neuroscience, being replaced by fundamentally different neurocomputational state types. |
  | **5. Nature of FP's "Success"**                                              | FP's success stems from its accurately capturing core causal-explanatory structures of cognition involving representations with combinatorial syntax and semantics. | FP's success stems from its utility as a coarse-grained heuristic or proto-theory, not from accurately describing the brain's underlying computational architecture. |

  ---

  ### III. Cruxes and Predictive Tests

  | Crux                                                                                              | Mutually Accepted Test/Evidence                                                                                                 | Realist Prediction                                                                                                 | Eliminativist Prediction                                                                                              |
  | :------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- |
  | **1. Theory Replacement:** *Can neuroscience (or successor) fully explain FP's domain WITHOUT attitudes or functional equivalents?* | Development of a neurocomputational model that demonstrably predicts/explains complex, novel, context-sensitive behavior (e.g., linguistic understanding, planning deception, moral reasoning) with precision rivaling FP, using *only* non-intentional, non-semantically structured neural/computational state types. | **Fails:** Neuroscience will *require* positing states with combinatorial syntax/semantics or fail to explain FP's domain completely. **OR** Success will involve functional analogues of attitudes. | **Succeeds:** Such a model *will* be developed, proving attitude-level explanation is dispensable. |
  | **2. Explanatory Incompatibility:** *Does neuroscience reveal FP's core principles as fundamentally flawed/incoherent?* | Clear empirical evidence or theoretical argument showing that the brain's core computational mechanisms *cannot physically implement* states with the properties FP ascribes to propositional attitudes (e.g., systematicity, productivity, causal efficacy of content). | **No:** Neuroscience will be compatible with implementing computational architectures possessing the core properties of attitudes (e.g., LOT). The properties are functional, not biological. | **Yes:** Neuroscience will reveal architectures fundamentally incompatible with FP's core assumptions about representation and causation (e.g., connectionist, dynamic systems). |
  | **3. Introspective Illusion:** *Can neuroscience fully explain introspective reports of beliefs/desires WITHOUT positing the reported states as real?* | A complete neuroscientific account of the mechanisms producing introspective reports, showing how they arise from processes that do not involve causally efficacious propositional attitudes matching the content of the report. | **No:** A complete account will require reference to the actual propositional attitudes being reported on; the report is caused *by* the real attitude. | **Yes:** Such an account will be possible, showing how reports are constructed by other processes, decoupled from any real "belief" state matching the content. |
  | **4. FP's Resilience:** *Will FP remain indispensable in specific domains (e.g., law, psychiatry, AI) even amidst neuroscientific progress?* | Observation over the next 30-50 years: Does FP remain the primary conceptual framework for explaining/predicting behavior in complex social/legal/clinical contexts, even as neuroscience advances? | **Yes:** FP's level of description will remain pragmatically and explanatorily indispensable in these domains. | **No:** Neuroscience-based frameworks will gradually supplant FP in these domains as they become more robust and applicable. |
  | **5. Phenomenology of Thinking:** *Can Mary (the neuroscientist who knows all physical facts) deduce the subjective experience of believing P from neural data alone?* | Thought experiment (extended Jackson's Mary): If Mary knows the complete, mature neuroscience of a subject S (including all neural states during cognition), but *never* deploys FP concepts, can she deduce what it *feels like for S* to consciously believe that P? | **No:** The subjective "what-it's-like" of believing P is tied to the intentional content P and its causal role, not deducible solely from non-intentional neural descriptions. | **Yes:** Complete neural knowledge *would* allow deduction of the subjective experience, as the experience *is* the neural state. |

  ---

  ### IV. Candid Assessment of Verbal Disagreements

  After careful negotiation of wording for the table and cruxes, we conclude that **our core disagreement is *not* merely verbal.** The dispute over the ontological reality of beliefs and desires is substantive and hinges on fundamentally different views about the relationship between scientific theories, explanation, and reality (scientific realism vs. anti-realism/instrumentalism regarding FP).

  However, **one significant potential source of purely verbal confusion has been identified and neutralized:**

  *   **The Term "Belief" (and "Desire"):** We agree that the eliminativist uses "belief" strictly to refer to the *folk-psychological posit* – a state with specific, often implicit, properties (e.g., discrete, semantically evaluable, causally efficacious via its content, part of a "language of thought"). The realist often uses "belief" more broadly, potentially encompassing any state playing a certain functional role in mediating between perception and action, which *could* be realized in diverse ways, including neurocomputational states. By explicitly defining the disagreement in terms of the reality of FP's *specific posits* versus the realist's broader functional/computational analogues (Table, Rows 1 & 4), and the core *properties* ascribed (Crux 2), this ambiguity is largely resolved. Our disagreement is about whether the *specific properties* of FP attitudes are real and necessary, not merely the label.

  **Conclusion:** While semantic care is essential, our year-long argument centers on a genuine, empirical, and philosophical dispute about the nature of cognition and the future of psychological explanation. This document provides the framework to resolve it through future evidence and argument, rather than repetition.

  ---

  **Signed,**

  [Your Name] (Realist)
  [Friend's Name] (Eliminativist)
