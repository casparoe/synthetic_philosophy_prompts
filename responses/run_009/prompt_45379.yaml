prompt: |-
  I keep going back and forth on this extended mind stuff, so here's my gut verdicts on a bunch of cases and I want to know what principle, if any, is behind them. Otto's notebook: obviously part of his mind, that's the paradigm case, I won't budge on it. Inga's biological memory: also mind, though it's a bit cheating to say so since it's in the head by definition. My phone calendar: feels extended, I genuinely stopped trying to remember appointments years ago, it's constantly with me and I trust it without checking. The GPS I navigate by: not mind. I consult it constantly but I'd override it if it told me to drive into a river, and that seems to matter to me. My wife, who remembers literally all of our social obligations: this one is annoying, because I trust her more automatically than I trust my own memory, she's more reliable and more available than the phone, and yet saying my wife is part of my mind seems insane. The rubber duck I explain my code bugs to: sometimes it really feels like the duck is doing the processing, even though it stores nothing. A note I wrote to myself years ago that I now distrust: surely not mind anymore, even though I'm still carrying it around. Is there some principle about trust and access that captures all of these? If there is, it has to either bite the bullet on my wife or explain why social trust is somehow different, and I can't see how to do that without it sounding ad hoc. Also tell me what the principle says about the case I keep flip-flopping on: the AI assistant that drafts my arguments, which I always endorse after a quick skim — because it feels like my belief that the argument works lives in the skimming, not the drafting, but the drafting is where all the actual work got done.
reasoning: |-
  Okay, let me try to unpack the user's dilemma about the extended mind theory. They've listed several cases with their gut reactions and want a unifying principle that explains all of them without feeling ad hoc, especially regarding their wife and the AI assistant. 

  First, I notice the user is deeply engaged with the philosophy but frustrated by inconsistencies. Their examples show they've thought a lot about trust and access, yet the social case (wife) breaks their intuition. That tension between theory and lived experience is key. 

  Hmm... the core conflict seems to be: if Otto's notebook counts as mind, why not the wife? Both are trusted external resources. But declaring one's spouse as "part of your mind" feels existentially weird, which suggests the principle needs to accommodate social boundaries without special pleading. 

  The user also struggles with the AI assistant—where does the cognitive labor actually reside? In the drafting (by AI) or the endorsement (by human)? That's a boundary case testing authorship vs mere tool use. 

  I recall Clark & Chalmers' original parity principle: if an external resource functions like internal cognition, it counts. But the wife example blows this up because social relationships add dimensions (her autonomy, her separate mind) that a notebook lacks. So maybe the principle needs a "no competing agency" clause? 

  For the GPS: it's consulted but overridable, so it lacks Otto-notebook-level integration. The distrusted note confirms trust is necessary but insufficient alone (since the wife is deeply trusted yet excluded). 

  The rubber duck is fascinating—it's not storing info but enabling cognition through interaction. That suggests the principle should include "collaborative scaffolding" as a category separate from storage. 

  Ultimately the user wants coherence without violating their intuition that "my wife isn't part of my mind." So any principle must: 
  1) Explain why some external resources feel integrated (Otto's notebook, phone calendar) 
  2) Exclude social agents without being arbitrary 
  3) Handle non-storage cases like the duck 
  4) Resolve the AI authorship paradox 

  The best shot might be reframing "part of MY mind" as requiring non-agency + automatic endorsement + procedural integration. The wife fails on non-agency; the duck passes on procedural integration; the AI fails on automatic endorsement (since skimming is active vetting). 

  ...But I worry this still feels clunky for the wife case. Maybe emphasize that social trust is bidirectional and therefore categorically different? Though the user explicitly rejected that as ad hoc. Tough nut.
answer: |-
  Your intuitions reveal a consistent underlying principle, but it's **not just about access and trust**—it's about **procedural integration and automatic endorsement**. Here’s a unified framework ("The Filtered Integration Principle") that explains your cases without ad-hoccery on social relationships:

  ---

  ### **The Filtered Integration Principle**
  An external resource is part of your extended mind *iff*:
  1. **Reliable, Constant Access** (like biological memory),  
  2. **Unfiltered Trust/Automatic Endorsement** (outputs are treated as "beliefs" without deliberation),  
  3. **Procedural Integration** (seamlessly embedded in cognitive routines, like perception).

  **Crucially:** Resources with *independent agency* (e.g., humans, advanced AI) fail #2 and #3 because their outputs require *interpretation* or *vetting*, breaking automatic endorsement.

  ---

  ### **Your Cases Explained**
  | Case                  | Extended Mind? | Why?                                                                 |
  |-----------------------|----------------|----------------------------------------------------------------------|
  | **Otto’s notebook**   | ✅ Yes         | Hits all 3: constant access, automatic trust, procedural integration. |
  | **Inga’s memory**     | ✅ Yes         | Biological baseline—trivially satisfies criteria.                    |
  | **Phone calendar**    | ✅ Yes         | Constant access, automatic trust (no second-guessing), integrated into daily routine. |
  | **GPS**               | ❌ No          | Lacks #2: you *override* it (no automatic endorsement).              |
  | **Your wife**         | ❌ No          | **Fails #2 & #3**: Her outputs require *social interpretation* (e.g., tone, context). You trust *her*, not her outputs *as your own beliefs*. |
  | **Rubber duck**       | ⚠️ Boundary   | Not storing info, but **scaffolds cognition** (a tool for *internal* processing). Satisfies #3 but not #1 or #2. |
  | **Distrusted note**   | ❌ No          | Fails #2: lack of trust breaks automatic endorsement.                |

  ---

  ### **The AI Assistant Case Solved**
  - **Drafts arguments → ❌ Not extended mind.**  
    - **Why?** You *skim and endorse* its output. This "vetting step" means you don’t **automatically endorse** the draft (#2 failure). The AI’s output is a *proposal*, not *your belief*.  
    - **The "real work" paradox:** The drafting is labor, but cognition isn't just effort—it’s *authorship*. Your "belief" forms **only after skimming** (your internal filter). The AI is a collaborator, not part of *your* mind—like delegating research to a student whose work you verify.

  ---

  ### **Why Social Trust is Different (Without Ad Hoc Bias)**
  - **Agency breaks integration:** Humans (like your wife) have **independent goals, context, and cognitive processes**. You engage with them *intersubjectively*, not procedurally.  
  - **Example:** If your wife says "We have dinner at 8", you don’t treat it as a *self-generated belief*—you process it as *her testimony*, subject to social nuance (e.g., "Is she reminding me or suggesting a plan?").  
  - **Contrast with Otto’s notebook:** The notebook has no agency; its "output" is *your own past input*, retrieved unfiltered.  

  ---

  ### **Key Insights**
  1. **Trust ≠ Integration:** Trust is necessary but insufficient. The GPS and wife are trusted but require *active evaluation*.  
  2. **Tools vs. Parts:** Tools (GPS, rubber duck) *augment* cognition; extended mind *components* (Otto’s notebook) *are* cognition.  
  3. **Social Exclusion Isn’t Arbitrary:** Agency introduces interpretive friction, breaking the "automatic endorsement" required for mind-extension.  

  This principle resolves your flip-flopping: the AI fails because **you’re the gatekeeper of endorsement**, not because the work is external. The mind ends where deliberation begins.
