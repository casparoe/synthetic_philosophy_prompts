  ### Final Teaching Plan in Continuous Prose

  Start with the shoes and socks example to engage the students and illustrate the core issue. Explain that for infinitely many pairs of shoes, we can define a choice function by always picking the left shoe. But for infinitely many pairs of identical socks, we have no rule to pick one from each pair. Emphasize that the axiom asserts the existence of a set (a choice function) that does the job without requiring a definable rule. Immediately clarify that the axiom is not about a human act of choice but about the existence of a mathematical object.

  Formally state the axiom of choice in two equivalent forms: (1) For any collection of nonempty sets, there exists a choice function that selects one element from each set. (2) The Cartesian product of any family of nonempty sets is nonempty. Note that the Cartesian product is defined as the set of choice functions.

  Explicitly state that for a finite collection of nonempty sets, we can construct a choice function by repeated application of the pairing axiom and the axiom of union (by induction). Thus, AC is only about infinite families.

  Introduce the well-ordering theorem and Zorn's lemma as equivalent to AC. State the well-ordering theorem: every set can be well-ordered. State Zorn's lemma: if every chain in a nonempty partially ordered set has an upper bound, then the set has a maximal element. Note that these are non-trivial and equivalent to AC. When stating the well-ordering theorem, defuse the common misconception about the reals: the usual order on the reals is not a well-order, but the theorem says there exists some other order relation that well-orders the reals. Also, note that Zorn's lemma is not stronger than AC; they are equivalent.

