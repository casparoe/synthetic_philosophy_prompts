answer: |-
  Here's the translation you requested, followed by the residue report where the analogy strains or breaks. I'll use your vocabulary rigorously.

  **Underdetermination in Inverse-Theory Jargon:**

  1.  **Core Underdetermination (Duhem-Quine Thesis):** Your gravity inversion problem `d = G(m)` is intrinsically **ill-posed** (specifically, non-unique). The **linear(ized) operator `G` has a non-trivial null space `N(G)`**. Models `m_0` residing purely in `N(G)` satisfy `G(m_0) = 0`. Consequently, for any model `m_fit` that fits the data `d` (i.e., `d = G(m_fit) + ε`, with `ε` within noise tolerance), the model `m_fit + m_0` also fits the data `d` identically. This defines an infinite set of **empirically equivalent models** (`m_fit + N(G)`) – your "rival theories" for the subsurface density distribution. The problem is **non-identifiable**; distinct `m` map to the same `d`.

  2.  **Auxiliary Hypotheses (Duhem) / Holism (Quine):** Achieving a unique, stable solution requires **regularization**. This imposes constraints *not* demanded by the data `d` itself. Common choices:
      *   **Tikhonov Regularization (Norm/Minimum Structure):** `min ||W_m (m - m_ref)||_2^2` subject to `||W_d (G(m) - d)||_2^2 ≤ tolerance`. `W_m` encodes smoothness (e.g., first/second difference operator). `m_ref` is a prior reference model.
      *   **Geological Constraints:** Sharp boundaries via total variation (TV), known lithologies via bounding constraints, etc.
      *   **Bayesian Priors:** `p(m|d) ∝ p(d|m) * p(m)`. The prior `p(m)` embodies assumptions (e.g., Gaussian with covariance structure enforcing smoothness).
      These regularization terms (`W_m`, bounds, `p(m)`) are the **auxiliary hypotheses**. They define the **model space `M`** you are willing to consider (e.g., `L_2` space with finite roughness). Crucially, *which* auxiliary hypothesis (e.g., `α||∇m||_2^2` vs. `α||m||_2^2`) you choose significantly impacts the recovered `m` from the equivalence class `m_fit + N(G)`. `N(G)` depends only on `G`; the *solution* depends critically on the auxiliary constraint.

  3.  **Model Selection (AIC/BIC/Occam):** Faced with multiple possible regularizations (auxiliary hypotheses) or model parameterizations (e.g., number of layers, cell size), you use:
      *   **Cross-Validation:** Hold out data `d_test`. Fit models `m_k` with different regularization strengths `α_k` or complexities on `d_train`. Choose `k` minimizing prediction error `||G(m_k) - d_test||`.
      *   **Information Criteria (AIC/BIC):** `AIC = 2k - 2ln(L̂)`, `BIC = k*ln(n) - 2ln(L̂)`. `k` = effective parameters (influenced by regularization!), `L̂` = max likelihood, `n` = data points. Penalize complexity to avoid overfitting the noise `ε` and implicitly shrink the solution towards simpler models within `M`. The **Occam Factor** in Bayesian model selection explicitly penalizes model complexity by integrating over the prior volume. This selects the simplest model *consistent with the data and the auxiliary assumptions*.

  4.  **Empirical Equivalence:** Two rival models `m1` and `m2` are empirically equivalent for dataset `d` if:
      *   `||G(m1) - d|| < tolerance` and `||G(m2) - d|| < tolerance` (Fit the data).
      *   `m1 - m2 ∈ N(G)` (Differ only by a null space component).
      The existence of `N(G)` ≠ `{0}` guarantees an infinite number of such `m2` exist for any `m1` that fits `d`.

  **The Residue Report: Where the Translation Creaks**

  1.  **Auxiliary Hypotheses vs. Regularization: Pragmatism vs. Epistemic Status**
      *   **Clean Mapping:** Yes, your smoothness prior `α||∇m||_2^2` is *structurally identical* to a Duhemian auxiliary hypothesis (AH). It's an assumption not directly tested by `d`, necessary to get *any* specific solution out of `N(G)`, and its choice profoundly impacts the solution.
      *   **The Creak:** Your *relationship* to your auxiliary is fundamentally different than a philosopher's focus.
          *   **Pragmatic & Testable:** You treat regularization as a *tool*. You don't necessarily believe the Earth *is* globally smooth. You use smoothness because it's often geologically reasonable *enough*, numerically stable, and crucially, **its performance is empirically validated via cross-validation and prediction**. If a sharp-boundary model (using TV reg) predicts better than smoothness on withheld data, you switch auxiliaries. The AH is provisional and judged by predictive utility.
          *   **Epistemic & Entrenched:** In philosophy, AHs are often portrayed as deeper, more entrenched background beliefs (e.g., assumptions about instruments, core physical laws, the uniformity of nature). While they *can* be revised (Duhem), it's often seen as a last resort, requiring significant upheaval (Quine). Your regularization is explicitly *designed* to be tuned, tested, and swapped based on predictive performance and geological plausibility. The "crisis" philosophers discuss arises when *core* auxiliaries are challenged; your "crisis" is just a poorly predicting model needing a reg parameter tweak or a different prior.
      *   **Verdict:** The *structure* maps cleanly. The *epistemic weight* and *methodology for handling* do not. Your AHs (regularizers) are explicitly instrumental and empirically evaluated in a way philosophical AHs often aren't conceived to be.

  2.  **Actual vs. Possible Rivals & Global vs. Local Underdetermination**
      *   **Your Instinct is Largely Correct:** Philosophers distinguish:
          *   *Local Underdetermination:* Given our *current* data `d_current`, rivals exist (`m_fit + N(G)`).
          *   *Global Underdetermination:* Even with *all possible* data `d_all_possible`, rivals might exist. They also distinguish rivals we can *describe* (actual) vs. those we merely acknowledge as *possible* (e.g., Descartes' demon).
      *   **The Creak:**
          *   **Null Space is Always Full:** As you state, `N(G)` is intrinsic to `G`. For any `d`, `m_fit + N(G)` exists *now*. These are concrete, describable rivals within your defined `M`. The "merely possible" rivals philosophers worry about are often *outside* your `M` entirely – e.g., models violating fundamental physics you assumed in defining `G`, or involving undetectable "ghost masses". You've already excluded these by defining your forward operator `G` based on Newtonian gravity and your model space `M` based on Euclidean space + known physics.
          *   **"All Possible Evidence" is Ill-Defined in Practice:** Your `G` assumes a specific physical theory (gravity). "All possible evidence" might include data types your `G` *cannot* predict (e.g., seismic travel times). Global underdetermination asks: Could there be a *fundamentally different theory* `T2` (not just `m2` within `G`) predicting *all possible* observations (gravity, seismic, EM, etc.) equally well? Your framework *assumes* `G` (Newtonian gravity) is correct. You work *within* the theory. Model selection (AIC/BIC) compares models *within* `G` and `M`.
          *   **The Practitioner's Focus:** You care about rivals *within your defined inverse problem* (`G`, `M`, regularization). You use prediction on *new data of the same type* (more gravity stations) or *related types* (seismic to test gravity model) to choose between models *in this space*. The philosopher's "global" worry is about the framework itself (`G`, `M`, core physics).
      *   **Verdict:** Your vocabulary captures *local, within-framework* underdetermination (`N(G)`) perfectly. It has no direct expression for *global* underdetermination (rival fundamental theories) or the philosopher's "merely possible" rivals that violate the core assumptions (`G`, `M`) you necessarily build in. This isn't a limitation *of inverse theory* for its purpose; it's a different scope. Philosophers are worrying about the box you comfortably work *inside*.

  3.  **Scientific Realism (No-Miracles Argument) vs. Predictive Success**
      *   **The Clean Mapping (and Why it Feels Obvious):** Your regularized model `m_reg`, chosen via CV/AIC/BIC to predict *withheld data* `d_test` well, continues to predict *new* data `d_new` successfully. This feels like strong evidence that `m_reg` has "latched onto" something real about the subsurface structure. The "miracle" would be if this predictive success happened consistently while `m_reg` was fundamentally wrong about the density distribution. This *is* the core intuition behind the No-Miracles Argument (NMA) for realism.
      *   **The Significant Creak:**
          *   **Approximate Truth vs. Predictive Adequacy:** Your `m_reg` is *not* claimed to be the "true" density model. It's the *simplest* (or most probable) model *within your constrained space `M`*, regularized by `R`, that fits the data adequately. Its success demonstrates its *predictive adequacy within the domain of the gravity method and your constraints*. This is compatible with **instrumentalism** or **structural realism**. You know `m_reg` smooths over details (null space components are suppressed), potentially misplaces boundaries, and has artifacts near the edges. Its success doesn't mean it's "true"; it means it captures the *gravitationally significant* structures well *enough* for your purposes. The "miracle" is avoided *because the constraints (regularization + prior) bias the solution towards geologically plausible structures that tend to have predictive power*, not necessarily because it's "true".
          *   **The Source of Success:** The NMA realist says success indicates truth. The anti-realist (or cautious realist) says success arises from the *empirical adequacy* achieved by fitting data *and* the constraints biasing solutions towards *stable, projectible features*. Your smoothness constraint directly enforces stability! Your cross-validation *selects for predictive adequacy*, not truth. In your practice, the success is explained by the *methodology* (fitting data + regularization + model selection), not by the metaphysical "truth" of the specific model.
          *   **Level of Description:** Realism debates often target the *fundamental laws* (e.g., Newtonian gravity itself). Your predictive success is for *models within that law*. If Newtonian gravity were fundamentally wrong (e.g., at galactic scales), your local crustal models could still be predictively successful empirically adequate within their domain. Your success doesn't prove the fundamental theory true, only that it's adequate for this domain.
      *   **Verdict:** The *phenomenon* (predictive success of constrained models) maps cleanly and *is* the core evidence for realism. However, your *interpretation* of this success within your practice ("adequate model built with sensible constraints selected by good methodology") is closer to a sophisticated instrumentalism or entity realism (the model points to *some* real mass anomalies) than a strong "theory is approximately true" realism. The philosophical dispute arises when trying to jump from predictive success to claims about *unobservable structure* or *fundamental laws*. You stay firmly on the predictive adequacy side. **The "realism debate residue" is the leap from predictive success to metaphysical truth claims about unobservables.** Your vocabulary handles the success beautifully; it doesn't force (or necessarily support) the metaphysical leap.

  **Summary of Residues & Limitations:**

  1.  **Where it Maps Cleanly:**
      *   Underdetermination *is* the non-trivial null space `N(G)`.
      *   Auxiliary Hypotheses *are* the regularization constraints/priors (`R(m)`, `p(m)`).
      *   Empirical Equivalence *is* `m1 - m2 ∈ N(G)` with `||G(m_i) - d|| < tol`.
      *   Model Selection (AIC/BIC/CV) *is* the practical response to non-uniqueness and complexity.
      *   Predictive success *is* the key empirical validation criterion.

  2.  **Where it Creaks (Needs Distortion/Qualification):**
      *   **Auxiliary Hypotheses:** Yours are explicit, instrumental, provisional, and *empirically testable* via prediction within the domain. Philosophical AHs are often deeper, more entrenched, and less directly testable.
      *   **Rivals:** Your framework naturally handles concrete rivals *within `N(G)` and `M`*. It excludes "global" rivals (different fundamental theories) or "merely possible" rivals violating core assumptions (`G`, `M`). Philosophers focus more on these broader possibilities.
      *   **Realism:** Predictive success validates *empirical adequacy within constraints and domain*, not necessarily "approximate truth" of the specific model or fundamental theory. The leap to metaphysical realism happens outside your operational framework.

  3.  **Where it Has No Expression (Limitations & Insights):**
      *   **Global Underdetermination (Rival Fundamental Theories):** Your inverse problem *assumes* a specific forward theory (`G`). It has no vocabulary for questioning whether `G` itself (Newtonian gravity) is the only possible theory explaining *all possible* observations. This limitation stems from the *framing* of inverse problems – they are tools *within* a theoretical framework. Philosophers are arguing about the framework itself.
      *   **The Epistemic Status of Core Physics/Geometry:** The assumptions baked into `G` (Euclidean space, Newton's Law, superposition) are treated as fixed background, not auxiliary hypotheses open to revision *within the inversion*. Philosophers (especially Quine) question this rigidity.
      *   **Vagueness vs. Precision:** The creaks arise because philosophical concepts (AH, global underdetermination, "truth") are often broader and fuzzier than the precisely defined mathematical objects in inverse theory (`G`, `N(G)`, `R(m)`, CV error). Inverse theory provides a *sharply defined, operational* picture of underdetermination *in practice*, exposing where philosophical discussions might be insufficiently constrained (e.g., ignoring the role of predictive validation) or operating at a different, more fundamental level (questioning the core theory `G`). The lack of expression isn't always a flaw in either; it often reflects different scopes and goals. **The key insight your perspective offers philosophers is the crucial, mitigating role of *empirically validated constraints* (regularization tested by prediction) in managing underdetermination – a process often underemphasized in abstract philosophical treatments.**

  In essence: You lived in the well-posed (via regularization) subspace of the ill-posed problem, validated your tools pragmatically, and got useful answers about the Earth. Philosophers are worried about whether the entire mathematical-physical framework you used to define the problem in the first place is the only possible one, even if it works perfectly within its domain. Your vocabulary perfectly describes the *local* terrain; theirs tries to map the *global* landscape, where the terrain itself might be different. The "crisis" philosophers discuss seems absent from your practice precisely *because* you expertly managed the local underdetermination via constraints validated by prediction, focusing on adequacy rather than absolute truth.
