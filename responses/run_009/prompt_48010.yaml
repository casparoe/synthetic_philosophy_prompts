  First, I need to map Duhem-Quine to inverse theory. Underdetermination is like the null space: infinitely many models fit the data. Regularization (like smoothness priors) acts like auxiliary hypotheses. But are they the same? In practice, regularization is explicit and testable via cross-validation, while philosophical auxiliaries might be more entrenched. That's a creak.

  Next, the user questions the philosopher's distinction between actual and possible rivals. In inversion, the null space always contains infinite rivals—no need for "demon-world" hypotheses. But philosophers worry about global underdetermination (all possible evidence), whereas practitioners focus on local (current data). The user might see this as irrelevant, but it's about epistemic limits beyond data.

