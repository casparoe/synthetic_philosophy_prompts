prompt: |-
  I run a non-partisan citizenship education series at a community centre, and next month I'm doing a ninety-minute session on when, if ever, a region has a right to leave its state. The audience is informed laypeople who follow the news but read no philosophy — think people who can name the 2014 Scottish referendum and know vaguely that Madrid declared the 2017 Catalan referedum illegal. Plan the session for me; don't explain the theories to me. I want the dependency structure — what has to be in place before the question "is there a right to secede" is even well-posed (I suspect the personal vs territorial scope of self-determination has to come first, but correct me if I'm wrong), and the order the rest must go in after that. I'm torn about the single carrying case: Quebec gives me two referendums and a Supreme Court reference, Catalonia gives me a clearer grievance story — pick one and say why. Then the misconceptions they'll walk in with, and where in the arc to kill each one: at minimum that international law obviously grants a right to secede, that self-determination means whatever a regional majority votes for, and that the divorce analogy settles anything. Plus one thing I should openly refuse to settle in ninety minutes and say so out loud. End with a question I can ask that distinguishes whether they actually understood the remedial-right versus primary-right split from just having opinions about Spain. Lead with your bottom line in the first sentence, then the reasoning, no preamble, and please write it in British English.
reasoning: |-
  Okay, the user runs a citizenship education series and needs a structured plan for a 90-minute session on whether a region has the right to leave its state. They want the dependency structure, misconceptions to address, a case study choice, and a clear end question. 

  First, I need to establish the foundational concepts before tackling the right to secede. The user mentioned personal vs territorial self-determination as a starting point. That makes sense because without clarifying who has the right to self-determination, the secession question can't be properly framed. Group rights vs individual rights is another layer that needs to be addressed early on.

  For the case study, Quebec offers more legal and procedural depth with its two referendums and Supreme Court reference. Catalonia's grievance story is clearer, but Quebec provides a balanced view of democratic processes within constitutional frameworks, which aligns better with the session's educational goals.

  Common misconceptions include the belief that international law explicitly grants secession rights, that self-determination means simple majority rule, and that divorce analogies are valid. These need debunking at specific points: the international law myth when discussing legal frameworks, the majority rule fallacy when defining self-determination, and the divorce analogy when covering remedial rights.

  The session should explicitly avoid resolving whether specific regions meet remedial criteria, as that's too complex for 90 minutes. Instead, focus on understanding the frameworks.

  The closing question needs to test comprehension of remedial vs primary right theories without relying on Spain examples. Asking about a hypothetical region with no oppression but a strong independence vote should reveal if they grasp the distinction.

  Time allocation is crucial: 10 minutes for foundations, 25 for self-determination scope, 20 for the Quebec case, 15 for remedial rights, 15 for misconceptions, and 5 for wrap-up. The flow must build logically from concepts to application while preempting misunderstandings where they naturally arise.
answer: |-
  Your session must first establish foundational concepts before the secession question can be meaningfully posed, using Quebec as the primary case study for its clear legal framework and democratic process, while actively dismantling key misconceptions at specific points.

  **Bottom Line:** The question "Is there a right to secede?" is only coherent *after* defining the relevant actors (sovereign state vs. secessionist group) and the contested scope of self-determination.

  **Session Structure (90 Mins):**

  1.  **Foundation: Sovereignty & Legitimacy (10 mins)**
      *   Core Concept: The modern international system is built on sovereign states. Sovereignty implies ultimate authority within a territory and independence externally.
      *   Dependency: You *cannot* discuss secession without first establishing what a "state" is and the concept of constitutional/legal order within it. Secession fundamentally challenges this order.
      *   Kill Misconception Early: **"International law obviously grants a right to secede"** - Emphasize that international law *protects state sovereignty* and territorial integrity as the default. Secession is the exception, not the rule.

  2.  **The Core Contention: Defining Self-Determination (25 mins)**
      *   **Personal Scope:** The "people" question. Who possesses the right? The entire population of the state? An ethnic group? Residents of a specific territory? Is it a group right or individual right?
      *   **Territorial Scope:** Where does the right apply? Only in colonies ("saltwater thesis")? Within existing states? This is the crux.
      *   **Dependency:** **This MUST precede the secession question.** Until you define *which* group potentially has a right to self-determination *where*, secession has no conceptual anchor. Is it the Quebecois nation, the people of Quebec, or all Canadians? The answer frames everything.
      *   Kill Misconception: **"Self-determination means whatever a regional majority votes for"** - Explain that while democratic expression is crucial, self-determination within existing states is almost universally interpreted as internal self-determination (meaningful autonomy, participation) within the state framework, *not* an automatic right to external self-determination (secession) via simple majority vote.

  3.  **Case Study: Quebec - Process within a Constitutional State (20 mins)**
      *   *Why Quebec over Catalonia?* Quebec offers a clearer, more developed legal and democratic process within a stable democracy: two referendums demonstrating popular will, a definitive Supreme Court ruling clarifying the legal context (Reference re Secession of Quebec), and subsequent federal legislation (Clarity Act). Catalonia provides a potent grievance narrative but involves contested legality, state intervention, and unclear international response, making the core legal/constitutional principles harder to isolate cleanly.
      *   Focus: The 1995 Referendum (narrow loss), the Supreme Court Reference (1998) - established no *unilateral* right, but obligation to negotiate if clear majority on clear question, the Clarity Act (2000) - federal rules for recognising a referendum.

  4.  **Theories of Secession: Remedial vs. Primary Right (15 mins)**
      *   **Remedial Right Only:** Secession as a last resort when a group suffers severe, persistent injustice (oppression, denial of meaningful self-government) within the state. The Quebec Court leaned heavily here. *Requires demonstrating grievance.*
      *   **Primary Right (Choice/Ascriptive):** Secession as an inherent right of a "nation" or territorially concentrated group, based on their will alone ("we choose to leave"), without needing prior injustice. Rarely recognised in law/practice.
      *   Dependency: These theories rely *entirely* on the definitions of "people" and scope of self-determination established in Step 2. They provide different answers *because* they start from different premises about who has the right and why.

  5.  **Tackling Misconceptions & Complexities (15 mins)**
      *   Reiterate & Deepen: International law's default position (sovereignty/territorial integrity) vs. remedial exceptions.
      *   Kill Misconception: **"The divorce analogy settles anything"** - Explicitly debunk this here. States are not marriages. There's no higher authority to enforce a "fair split," no pre-nup (constitutions rarely have clear secession clauses), and crucially, territory and populations are intertwined in ways spouses' assets aren't. It's a misleading oversimplification.
      *   **State Openly:** "We absolutely *cannot* resolve in 90 minutes the incredibly complex question of **whether any specific region (like Quebec, Catalonia, Scotland, etc.) actually *meets* the high threshold for remedial secession.** That requires deep historical, political, and legal analysis far beyond our scope today. We're focusing on the *frameworks*."

  6.  **Wrap-up & Key Question (5 mins)**
      *   Summarise: Secession isn't a simple "right" but a complex, contested political act, framed by concepts of sovereignty, self-determination scope, and legal/constitutional order. Remedial Right is the dominant legal framework.
      *   **Distinguishing Question:** "Imagine a wealthy, culturally distinct region within a democratic state. It has significant autonomy, full political rights, and faces no discrimination. A majority there votes for independence in a clear referendum purely because they *want* their own state. Based on the theories discussed, does this constitute a valid *right* to secede under international law? Why or why not?"
      *   *Why it works:* It tests understanding of Remedial (requires injustice - absent here) vs. Primary Right (just will is enough) without relying on Spain/Canada specifics. It forces application of the core theory split. Opinions on Spain won't directly answer this hypothetical.
