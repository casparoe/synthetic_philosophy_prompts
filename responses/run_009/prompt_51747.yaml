prompt: |-
  ok so this one's a parody job posting, in that earnest corporate-hr voice that every company with a "trust and safety" team seems to use. heres the setup: a fictional mid-size company (call it something bland like Cloudbank Analytics or make up your own) is hiring a Senior Algorithmic Fairness Engineer after their risk-scoring model just had a very bad week in the press, and the posting promises, in complete sincerity, everything at once.

  the heart of it is the numbered requirements section, and the jokes have to come from getting the impossibility results right. i want the posting to demand, as hard requirements, things that are provably incompatible whenever base rates differ across groups: risk scores that are well-calibrated within each group, AND equal false positive rates across groups, AND equal false negative rates across groups, AND parity in whatever accuracy metric the comms team likes that week. there should also be a clause that the model may not use group membership as a feature, right next to a clause that it must "correct for historical disadvantage experienced by protected groups." dont explain why this is impossible, dont wink, just list it all in flat HR bullet points with the same confidence as "proficiency in python." someone who actually knows the fairness literature should be able to tell the author understands why calibration and equalized odds cant coexist with different base rates — the satire lands only if it reads like a reductio of how these reqs actually get written, not just "fairness is hard lol."

  sprinkle in the usual corporate furniture: a mission statement about "earning trust through transparency," a salary band, a perks list (maybe something like access to the fairness dashboard, which currently shows one green checkbox), the EEO boilerplate — which you can make quietly load-bearing if you want, e.g. the company being an equal-opportunity employer that requires its models to be equal-opportunity scorers in every sense simultaneously. and end with a line where applicants who demonstrate that the requirements are jointly unsatisfiable are thanked for their rigor and forwarded to a different opening — maybe in legal, maybe a philosophy postdoc, your call.

  keep it deadpan throughout. around 550 words, formatted like an actual posting: job title, "about us," "what youll do," numbered requirements, perks, how to apply. no citations or paper references anywhere, just the technical content wearing a lanyard. and please dont have the posting itself realize anything — the whole piece only works if nobody at this company has ever once read past the abstract. also, one of the requirements should mention the model must perform "at least as well as the current system on day one," because of course it must.
reasoning: |-
  Okay, the user wants a parody job posting for a Senior Algorithmic Fairness Engineer that highlights impossible requirements in algorithmic fairness. Let me start by understanding the core joke: listing mutually exclusive fairness criteria as if they're all mandatory. The user mentioned calibration, equal false positive/negative rates, and accuracy parity, which are mathematically incompatible when base rates differ. 

  First, I need to create a fictional company name. Something bland and corporate like "Cloudbank Analytics" fits. The tone should be deadpan, mimicking typical HR language without any irony. The requirements section is crucial—each bullet point must sound reasonable on its own but together form an impossible set. 

  Including the prohibition against using group membership alongside the mandate to correct historical disadvantages adds to the satire. Also, the "perform at least as well as the current system on day one" requirement emphasizes the unrealistic expectations. 

  The perks section can subtly mock corporate culture, like mentioning a fairness dashboard with only one green checkbox. The EEO statement should double down by applying equal opportunity to both employees and algorithms, reinforcing the absurdity. 

  Ending with a note about forwarding candidates who point out the impossibility to a philosophy postdoc or legal role adds a final touch of irony. Need to ensure no explanations or winks; the humor comes from the straight-faced presentation. 

  Check word count—aim for around 550 words. Structure: job title, About Us, Responsibilities, Requirements, Perks, How to Apply. Avoid any technical jargon or citations; keep it in corporate HR speak. Make sure the satire is sharp for those familiar with fairness literature but subtle enough to pass as a real posting.
answer: |-
  **Cloudbank Analytics: Senior Algorithmic Fairness Engineer**

  **About Us:**
  At Cloudbank Analytics, we harness the power of data to empower businesses and communities. Our core mission is to earn trust through radical transparency and responsible innovation. As we navigate the complexities of algorithmic decision-making, we are committed to building systems that are not only powerful but profoundly fair. Join us in shaping a future where technology serves everyone equitably.

  **The Opportunity:**
  Following recent events highlighting opportunities for improvement in our flagship risk-scoring platform, we are seeking a seasoned Senior Algorithmic Fairness Engineer. You will be instrumental in rebuilding trust by designing, implementing, and validating the next generation of our core algorithms. This critical role reports directly to the Head of Trust & Safety and requires deep technical expertise combined with a passion for ethical AI.

  **What You'll Do:**
  *   Lead the redesign and deployment of our primary risk assessment model, ensuring it meets the highest standards of fairness, accuracy, and non-discrimination.
  *   Develop rigorous testing frameworks to validate model performance against our comprehensive fairness criteria before and after deployment.
  *   Collaborate closely with Product, Legal, and Communications to translate ethical principles into technical specifications and explainable outcomes.
  *   Own the documentation and reporting of model fairness characteristics for internal stakeholders and regulatory bodies.
  *   Continuously monitor live model performance via our FairVision dashboard and implement rapid mitigation strategies for any detected disparities.

  **Required Qualifications (All are mandatory):**
  1.  PhD in Computer Science, Statistics, Applied Mathematics, or a related field, plus 5+ years industry experience deploying ML models impacting human outcomes.
  2.  Demonstrated expertise in ensuring *calibration within all protected demographic groups* (e.g., predicted risk probabilities must equal actual observed risk rates within each group).
  3.  Proven ability to achieve *strictly equal False Positive Rates (FPR) across all protected groups*.
  4.  Proven ability to achieve *strictly equal False Negative Rates (FNR) across all protected groups*.
  5.  Demonstrated success in achieving *parity in overall model accuracy metrics* (e.g., Balanced Accuracy, F1 Score) *across all protected groups*.
  6.  Experience developing high-stakes models that *explicitly correct for historical disadvantage experienced by protected groups* to ensure equitable outcomes.
  7.  Experience developing models that *strictly avoid using protected group membership (e.g., race, gender) or direct proxies* as model features.
  8.  Ability to deliver models that perform *at least as well as our current system on all key performance indicators (accuracy, precision, recall) on day one of deployment*.
  9.  Deep proficiency in Python (PyTorch/TensorFlow, Scikit-learn, Fairlearn/PyWhy), SQL, and cloud platforms (AWS/GCP/Azure).
  10. Excellent communication skills to articulate complex fairness trade-offs to non-technical audiences and senior leadership.

  **Perks & Benefits:**
  *   Competitive salary band: $220,000 - $280,000 + 20% target bonus + Equity
  *   Comprehensive health, dental, and vision insurance
  *   Unlimited PTO with mandatory minimum usage
  *   Remote-first work culture with bi-annual team onsites
  *   $5,000 annual professional development stipend
  *   State-of-the-art FairVision Real-Time Fairness Dashboard access
  *   Wellness program including mindfulness app subscriptions
  *   Opportunity to work on technology with profound societal impact

  **Equal Opportunity Employer:**
  Cloudbank Analytics is proud to be an Equal Opportunity Employer. We celebrate diversity and are committed to creating an inclusive environment for all employees. We believe this commitment must extend equally to the algorithmic systems we build, ensuring they provide truly equal opportunity for favorable outcomes to all individuals, regardless of background. We require our models to embody this principle fully.

  **How to Apply:**
  Submit your resume and a cover letter detailing your specific experience meeting *all* the Required Qualifications listed above through our careers portal (Req #: FAIR-SR-2024). Applications lacking concrete evidence for each qualification will not be considered.

  *Note: Candidates who, during the interview process, rigorously demonstrate fundamental incompatibilities within the stated model requirements will be thanked for their valuable insight and may be considered for alternative openings within our Legal Strategy or Ethics & Philosophy Research teams.*
