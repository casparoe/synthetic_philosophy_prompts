answer: |-
  ### Decision Procedure for "Same Object as Acquired?"

  This procedure is designed for efficiency (2-5 minutes per record) and audit transparency. It prioritizes physical continuity and institutional practice over philosophical debates, but flags policy-dependent thresholds. **Policy notes** indicate where the outcome relies on institutional choices, not objective facts.

  ---

  #### **Step 1: Core Structural Continuity**  
  *Question: Does a core structural component (e.g., frame, hull, chassis) remain unbroken and original since accession?*  
  - **Good enough answer:** Physical inspection or maintenance records confirming the core’s unaltered state.  
  - **Output:**  
    - ✅ **If YES** → Proceed to Step 2.  
    - ❌ **If NO** → Output **"Not the same object."** Stop.  
  - *Policy note:* Define "core component" per object type (e.g., locomotive = frame; boat = hull; carriage = underframe). This is institutional policy.

  #### **Step 2: Original Material Threshold**  
  *Question: Is ≥50% of the object’s current material (by weight or major component count) original to accession?*  
  - **Good enough answer:** Conservation reports, part replacement logs, or visual estimation. Use discretion (e.g., "clearly over/under half").  
  - **Output:**  
    - ✅ **If ≥50% original** → Output **"Same object."** Stop.  
    - ❌ **If <50% original** → Proceed to Step 3.  
  - *Policy note:* The 50% threshold is arbitrary. Weight is preferred for accuracy, but component count is acceptable for complex assemblies (e.g., "5 of 10 major parts replaced").

  #### **Step 3: Institutional/Public Continuity**  
  *Question: Has the museum consistently treated it as the same object (same accession number, insurance, display), and is it publicly recognized as such?*  
  - **Good enough answer:** Accession history, labels, insurance files, or public references (e.g., guidebooks).  
  - **Output:**  
    - ✅ **If YES** → Output **"Same object."**  
    - ❌ **If NO** → Output **"Not the same object."**  
  - *Policy note:* This step overrides low originality based on institutional intent. **Punt to registrar** if records are ambiguous.  

  #### **When to Punt to Registrar**  
  - Disputes over "core component" definition (Step 1).  
  - Originality estimates near 50% (Step 2).  
  - Conflicts between institutional practice and public perception (Step 3).  
  - **Philosophical conflicts** (e.g., "Is the identity in the function or the material?") become policy decisions.

  ---

  ### Case Studies

  #### **(a) Locomotive (boiler replaced in 70s; original boiler preserved separately)**  
  1. **Step 1:** Frame is original and unbroken → **YES** (proceed).  
  2. **Step 2:** Assume frame + other parts = ~70% original by weight (boiler was 30%) → **≥50%** → **"Same object."**  
     - *Policy note:* Original boiler’s separate accession *reinforces* that the locomotive (sans boiler) retains identity.  
  - **Heritage impact:** Unlikely unhappiness – boiler replacement is routine in rail history.  

  #### **(b) Carriage (every plank swapped piecemeal over 60 years)**  
  1. **Step 1:** Underframe (core) likely replaced with planks → **NO** → **"Not the same object."**  
     - *If underframe was metal and original:* Proceed to Step 2. Assume carriage is 20% original (underframe only) → **<50%** → Step 3. Museum/public treat as same → **"Same object."**  
     - **Heritage unhappiness:** This outcome (if core survives) **will upset heritage teams** – "substantially original" is compromised at 20% originality.  
  - **Final output (plausible):** ❌ **Not the same object** (core replaced).  

  #### **(c) Boat (original hull; new chassis/running gear; static display)**  
  1. **Step 1:** Hull is original → **YES** (proceed).  
  2. **Step 2:** Hull = ~60% by weight → **≥50%** → **"Same object."**  
     - *Policy note:* Function loss (static display) is irrelevant per this procedure.  
  - **Heritage impact:** Mild concern (non-operational), but hull originality satisfies criteria.  

  ---

  ### Key Takeaways  
  - **Philosophy in disguise:** Steps 1 and 2 masquerade the "constitution ≠ identity" debate (core parts) and "original matter" theory (50% threshold) as policy. Step 3 adopts a "continuity of identity" stance.  
  - **Audit readiness:** Document policy definitions (core parts, 50% threshold) in procedure manuals. Flag all Step 3 overrides for registrar review.  
  - **Heritage conflict:** **Carriage (b)** is most likely to output **"Same object"** (if core survives) despite low originality, provoking heritage objections. Sugar-free truth: If the public calls it "the same" and records support this, policy overrides material deficiency.  
  - **Your role:** Resolve punts by aligning outcomes with the museum’s mission (e.g., "Do we prioritize physical integrity or historical narrative?"). No philosophy degree required.  

  **Bottom line:** This procedure replaces volunteer opinions with auditable rules. It accepts that museums are storytelling institutions – sometimes, the story matters more than the atoms.
