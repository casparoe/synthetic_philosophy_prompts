  4.  **⚠️ Minor omission (‑0.5):** "Axelrod showed that cooperation can be sustained only if w is high enough"  
      *Missing explicit threshold: Cooperation is sustainable iff w > (T‑R)/(T‑P) [where T>Temptation, R=Reward, P=Punishment]. Crucial for precision. Deduct 0.5.*  

  ---

  ### Part (b) Grade: **11 / 15**  
  #### Comments:  
  1.  **❌ Major error (‑2):** "TFT satisfies [evolutionary stability]"  
      *False. TFT is **not evolutionarily stable (ES)**. A population of TFT can be invaded by Always Cooperate (ALLC): TFT vs. TFT gets R, ALLC vs. TFT also gets R → mutant isn’t selected against. ES requires either (1) mutant does strictly worse vs. resident, or (2) resident does better vs. mutant than mutant does vs. itself. TFT fails (1) vs. ALLC and fails (2) vs. itself. Correct: ES requires strict inequality in fitness comparisons, which TFT lacks against some mutants.*  
  2.  **❌ Error (‑1.5):** "TFT did beat every other strategy in the tournament pairwise"  
      *Incorrect. TFT **does not beat** ALLD pairwise: ALLD scores T + (n‑1)P against TFT, while TFT scores S + (n‑1)P. Since T > R > P > S, ALLD beats TFT in direct pairwise play. Tournament victory was based on *total score across all opponents*, not pairwise dominance.*  
  3.  **❌ Conceptual error (‑0.5):** "no more exotic mutant could do better... TFT cannot be exploited"  
      *Overclaiming. Mutants like Pavlov (Win-Stay-Lose-Shift) can exploit clusters of errors better than TFT in noisy environments. TFT *is* exploitable by strategies that defect intermittently (e.g., GTFT or stochastic strategies) if w is low.*  
  4.  **⚠️ Misplaced argument (‑1):** "TFT's forgiveness protects it in noisy environments... TFT returns to cooperation"  
      *Irrelevant to Axelrod’s **original tournament** (which had **no noise**). While forgiveness is a virtue, it doesn’t explain TFT’s *initial* win. Axelrod later added noise, where TFT performs poorly.*  
  5.  **✅ Correct:** "tournament winner... highest total score, not necessarily one that beats every opponent pairwise"  
      *Perfect distinction. No deduction.*  
  6.  **✅ Correct:** "Against ALL-D... TFT takes the sucker's payoff once"  
      *Accurate. No deduction.*  

