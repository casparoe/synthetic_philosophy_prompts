  - **Actors**: 20 students as reporters working under deadline.
  - **Duration**: 75 minutes.
  - **Setup**: A stream of tips coming from sources with varying track records.
  - **Decision Points**: At each tip, students must decide to publish, spike (ignore), or wait for more information (but waiting too long may cause them to miss the deadline).
