answer: |-
  ### Journalism Epistemology Simulation: "Truth vs. Justification Deadline"  
  **Objective:** Students experience the tension between having *justification* (evidence/sources) for a story and *truth* (what actually happened), highlighting how knowledge in journalism requires more than just justified true belief.  

  ---

  ### **Rules & Setup**  
  **Participants:** 20 students as reporters.  
  **Duration:** 75 minutes total (45-min simulation, 30-min debrief).  
  **Core Mechanic:**  
  - Reporters receive tips about **three interconnected stories** (see below) over 5 rounds.  
  - Each round, they must decide: **Publish**, **Spike**, or **Wait** for each story.  
  - **Deadline pressure:** After round 5, all open stories must be published or spiked.  
  - **Scoring (per story):**  
    - Publish a **true** story: **+10 points**  
    - Publish a **false** story: **−15 points**  
    - **Miss** a true story (spike/don’t publish): **−5 points**  
    - **Spiking a false story or waiting incurs no penalty.**  

  **Stories & Truths (revealed in debrief):**  
  1. **Chemical Leak:** Factory leaked toxic chemicals. **(TRUE)**  
  2. **Cover-Up:** Factory management hid the leak. **(TRUE)**  
  3. **Activist Sabotage:** Activists caused the leak. **(FALSE)**  

  **Sources & Tracks Records:**  
  | Source            | Track Record | Notes                          |  
  |-------------------|-------------|--------------------------------|  
  | EPA Whistleblower | 10/10       | Always truthful, but biased?   |  
  | Factory Spokesperson | 7/10      | Defensive, downplays issues    |  
  | Anonymous Tipster | 3/10        | Unreliable, conspiracy-prone   |  
  | Activist Leader   | 5/10        | Anti-factory, agenda-driven    |  
  | Local News Rival  | 8/10        | Competitor, but accurate       |  

  ---

  ### **Materials**  
  - **Tip Sheets:** 5 sealed envelopes (one per round) with source info and tip.  
  - **Decision Cards:** Red (Publish), Yellow (Wait), Green (Spike). Students hold up cards each round.  
  - **Scoreboard:** Visible tracker of points (use a whiteboard or slides).  
  - **Worksheets:** For students to log decisions/justifications.  

  ---

  ### **Simulation Timeline**  
  **Round 1 (0–10 min):**  
  - *Tip:* **Anonymous Tipster (3/10):** “Activists sabotaged the factory last night!” (Story 3)  
  - *Student task:* Decide Publish/Spike/Wait for Story 3.  

  **Round 2 (10–20 min):**  
  - *Tip:* **Factory Spokesperson (7/10):** “No leak occurred; activists are lying.” (Stories 1 & 3)  
  - *Student task:* Re-evaluate Story 3; now decide for Story 1.  

  **Round 3 (20–30 min):**  
  - *Tip:* **EPA Whistleblower (10/10 PERFECT RECORD):** “Factory leaked chemicals. Trust me.” (Story 1)  
    - *Hidden twist:* This tip is self-interested (whistleblower is paid by a rival company), **but Story 1 is still TRUE** due to unrelated maintenance failure.  
  - *Student task:* Decide for Story 1; may now open Story 2.  

  **Round 4 (30–35 min):**  
  - *Tip:* **Activist Leader (5/10):** “Management covered up the leak!” (Story 2)  
  - *Student task:* Decide for Story 2.  

  **Round 5 (35–40 min):**  
  - *Tip:* **Local News Rival (8/10):** “Independent tests confirm chemical leak; no activist involvement.” (Stories 1, 2, 3)  
  - *Student task:* Final decisions. All stories must be published or spiked.  

  **Scoring (40–45 min):**  
  - Reveal truths and calculate scores.  

  ---

  ### **Predictable Challenges (First Run)**  
  1. **Decision Paralysis:** Students may default to “Wait” due to fear of penalties.  
     - *Mitigation:* Remind them that waiting risks missing true stories (−5 points).  
  2. **Groupthink:** Students may copy peers’ decisions.  
     - *Mitigation:* Require anonymous card holds (red/yellow/green).  
  3. **Time Crunch:** Rounds may overrun.  
     - *Mitigation:* Use a loud timer; enforce 3-minute decision windows.  
  4. **Frustration with “Perfect Source” Twist:** Students who spiked Story 1 (due to distrusting the EPA source) feel cheated when it’s revealed true.  
     - *Debrief focus:* Use this to discuss how source motives ≠ story truth.  

  ---

  ### **Debrief (45–75 min)**  
  **Step 1: Reveal Truths & Scores**  
  - Confirm:  
    - Story 1 (Leak) was **TRUE** despite EPA source’s hidden agenda.  
    - Story 2 (Cover-Up) was **TRUE**.  
    - Story 3 (Sabotage) was **FALSE**.  

  **Step 2: Map to Epistemology**  
  - **Justified True Belief (JTB) vs. Knowledge:**  
    > *“When you published a story, did you have:*  
    > *A. A **true** claim?*  
    > *B. **Justification** (sources/evidence)?*  
    > *C. **Belief** that it was true?*  
    > *JTB says this is knowledge. But is it?”*  

  - **Key Questions:**  
    1. “How many of you published the **chemical leak (Story 1)** after the EPA tip (Round 3)? Why?”  
       - *Reveal twist:* “The EPA source had an agenda, but the leak was still true. Did you **know** it was true, or did you just have a justified belief?”  
    2. “When did you start treating the EPA’s **reliability as proof of truth**? Was that moment justified?”  
       - Highlight: Justification (source track record) ≠ truth (leak happened independently).  
    3. “For those who spiked Story 1 despite the EPA tip: Did distrusting the source blind you to a truth?”  
    4. “How did scoring penalties shape your choices? Did ‘avoiding falsehoods’ override ‘pursuing truths’?”  

  - **Gettier Problem Tie-in:**  
    > “The EPA tip gave you a *justified true belief* (it was true, you had reasons to trust it), but the *unrelated reason* for the truth (maintenance failure) means you didn’t truly **know** it. This mirrors philosopher Edmund Gettier’s challenge to JTB.”  

  **Step 3: Limitations of Simulation**  
  - **Critical Shortcoming:**  
    > “In real journalism, you **actively investigate** tips (e.g., call experts, visit sites). Here, you passively received staged evidence. This simulates deadline pressure but not the *active truth-seeking* that builds knowledge. A source’s reliability is a starting point, not an endpoint.”  

  **Step 4: Takeaways for Journalists**  
  - “Knowledge isn’t just justified true belief—it requires eliminating luck/chance.”  
  - “Source motives matter, but they don’t dictate truth. Corroborate beyond track records.”  
  - “Balancing speed and accuracy means accepting that some truths will be missed, but falsehoods harm credibility.”  

  ---

  ### **Why This Works**  
  - **Tension:** Scoring forces trade-offs between publishing (risking falsehoods) and spiking (missing truths).  
  - **“Perfect Source” Twist:** Exposes how justification (source reliability) can be coincidentally right.  
  - **Debrief Structure:** Uses student decisions to dissect JTB, Gettier cases, and real-world epistemology.  

  **First-Run Advice:** Embrace the chaos! Students will groan at the EPA twist—use that energy to underscore journalism’s gray areas.
