  ## The Committee of Three

  The air in the cramped conference room hung heavy with the scent of stale coffee and unresolved tension. Outside, the late afternoon light slanted across the quad, casting long shadows that felt somehow accusatory. Priya Sharma, chair of the Ad Hoc Tenure Review Committee for Dr. Aris Thorne, rubbed her temples. The votes were in, and they were a mess.

  "Alright," she sighed, pushing the tally sheet towards the center of the table. "Let's confirm. Recommendation: *Against* tenure. Two opposed, one in favor."

  Anya Petrova, the stern medievalist, nodded curtly. Her lips were a thin line. "Correct. The teaching record is simply inadequate. Those student evaluations from the large lecture course? Abysmal."

  Ben Carter, the data-driven sociologist, adjusted his glasses. "Agreed on the outcome, Priya, but for different reasons. The *research* isn't strong enough. The monograph is competent, but the journal output is thin. It doesn't meet the benchmark for *this* department."

  Cora Henderson, the comparative literature professor who had championed Thorne from the start, leaned forward, her usually warm eyes clouded with frustration. "And I maintain, it's a positive vote. The research *is* strong – innovative, deeply interdisciplinary, exactly what we claim to value. The teaching? Perfectly adequate. Challenging, yes, but the upper-level seminars get rave reviews. We lose more by letting Aris go than we gain by holding them to some impossible standard."

  Priya scanned the sheet again. **Recommendation:** Against (Anya, Ben), For (Cora). **Research Strong:** Yes (Cora, Ben), No (Anya). **Teaching Adequate:** Yes (Cora, Anya), No (Ben).

  The paradox glared at her. A majority against tenure. Yet, a majority (Cora and Ben) said the research *was* strong. A majority (Cora and Anya) said the teaching *was* adequate. According to the unwritten rule – strong research *and* adequate teaching – the premises for tenure were met by majority vote. But the conclusion itself was rejected by majority vote.

  "Hold on," Priya said slowly, the formal knot tightening in her gut. "We all agree on the standard: strong research *and* adequate teaching equals tenure. Look at this." She tapped the research column. "Ben, Cora – you both say research is strong. That's two out of three. Anya, Cora – you both say teaching is adequate. Again, two out of three."

  Anya frowned. "But *I* say teaching isn't adequate, and *Ben* says research isn't strong. So neither of us believes *both* conditions are met. Therefore, no tenure. It's straightforward."

  "Is it?" Priya countered, feeling the procedural ground shift beneath her. "Do we count the premises individually and then apply the 'and'? Or do we take the final vote on the conclusion as binding? The practice says 'judge both', but it doesn't specify *how* we aggregate those judgments into a recommendation."

  Ben leaned back, a thoughtful crease appearing between his brows. "Huh. The premise-based approach versus the conclusion-based approach. Interesting." He didn't name-drop List and Pettit, but Priya recognized the formal dilemma clicking into place for him. "If we go premise-based... tenure should be recommended. If we go conclusion-based... it's rejected. The rule doesn't tell us which path to take."

  "Precisely," Priya said, her voice low. "And *I* have to sign the recommendation letter. So which is it? Do I report that the committee finds the premises met but recommends against? Or that the committee recommends against, period?"

  Silence descended, thicker than before. The abstract problem had become painfully concrete. Priya watched them. Anya looked immovable, convinced of her assessment of Thorne’s teaching failings. Ben seemed intellectually intrigued but practically aligned with rejection. Cora radiated a quiet fury at the perceived injustice.

  "Perhaps," Cora ventured, her voice tight, "we should discuss what 'adequate' teaching *actually* means. Anya, your objections seem… exceptionally rigorous. Is 'adequate' for tenure the same as 'flawless'?"

  Anya bristled. "It means meeting a basic standard of pedagogical competence! Thorne’s lecture evaluations consistently show confusion, disengagement. That large course is a core requirement! 'Adequate' isn't a participation trophy, Cora."

  "But *how* confused?" Ben interjected, ever the quantifier. "Compared to the department average? Compared to historical norms? 'Adequate' *is* a threshold, Anya. Did you apply a stricter one than the rest of us implicitly use?"

  Anya hesitated. A flicker of uncertainty crossed her face. "I... I know weak teaching when I see it. It drags down the department's reputation. 'Adequate' for tenure *should* mean reliably good, not merely scraping by. Perhaps… perhaps my threshold *is* higher." She didn’t concede, but the rigidity in her posture softened slightly. The binary judgment ("adequate" vs. "inadequate") had masked a spectrum, a hidden degree she hadn't fully articulated, even to herself.

  Priya saw a glimmer, not of resolution, but of the problem's depth. This wasn't just about Thorne; it was about the unspoken calibrations behind their judgments. Could deliberation dissolve the paradox? Maybe partly. If Anya truly held an idiosyncratically high bar for "adequate," perhaps her 'No' wasn't strictly about Thorne, but about a standard the committee had never defined. But Ben’s 'No' on research was equally firm, based on output metrics he considered objective.

  Ben cleared his throat. "Hypothetically," he began, his tone carefully neutral, "if we *were* to take a premise-based vote... and the research premise passed… but teaching was still seen as inadequate by Anya and me… the outcome might still be negative depending on how we frame the 'and'…" He trailed off, but Priya caught the implication. *If we vote premise-based, and research passes, but teaching fails, tenure fails. But if we vote conclusion-based, it fails anyway. Unless…* She saw the calculation: If Ben believed premise-based voting might be used, and he *really* wanted to ensure rejection, he might be tempted to switch his vote on *research* to 'No' – even if he privately thought it was strong – just to guarantee the teaching premise also failed under a premise-based count, locking in rejection. Strategic voting. Gaming the very rules meant to ensure fairness.

  The thought chilled her. Was this a flaw in the procedure? Or was it simply human nature, an inescapable shadow in any system relying on individual judgments aggregated under pressure? Ben’s thoughtful expression gave nothing away. Was he considering it?

  Priya looked at the conflicting tallies, then at her colleagues – Anya, principled but perhaps overly rigid; Ben, analytical but potentially manipulative; Cora, passionate but possibly biased. The unwritten rule offered no map through this procedural jungle. Premise-based voting honored the *reasons* but could lead to an outcome (tenure) that only one member fully supported. Conclusion-based voting honored the *outcome* but ignored the fact that majorities accepted the necessary conditions.

  Deliberation had revealed hidden assumptions (Anya’s threshold) and hinted at potential strategic dangers (Ben’s unspoken calculation), but it hadn’t conjured consensus. The knot remained.

  Priya picked up her pen. The weight of the decision settled on her shoulders. She could force a revote, specifying the procedure. But which one? And wouldn't that itself be a substantive choice, favoring one view of collective rationality over another? She could write the letter based on the conclusion-vote, the clean, majority-rejected outcome. Simple. Defensible. But it felt like burying the messy truth of their conflicting majorities. She could write it based on the premises being met, arguing the standard was satisfied. Justifiable intellectually, but politically explosive, overriding the expressed will of two members.

  The silence stretched. Three pairs of eyes watched her, waiting. The shadows outside deepened. Priya clicked her pen once, the sound loud in the stillness. She pulled the official recommendation form towards her. Her hand hovered for a moment over the line for the Chair’s signature. She thought of Aris Thorne, unaware of the procedural snare tightening around their future. She thought of the students who needed clear rules, fair processes. She thought of the unspoken thresholds, the potential for hidden strategies, the irreducible weight of her own judgment in this flawed, human system.

  Taking a slow breath, Priya Sharma began to write. The words flowed, forming a recommendation that was logical, grounded in precedent, and utterly, profoundly unsettling. She signed her name with a firmness she didn’t entirely feel, leaving the room heavy with the echo of the choice made, and the unspoken question hanging in the air: *Which path did she take?* The ambiguity was the only honest conclusion. The seminar would have its debate.
