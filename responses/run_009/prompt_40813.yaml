  **Quiz: Which definition of life do you actually hold?**

  Instructions: For each of the following scenarios, choose the option that best reflects your intuition. There are no right or wrong answers—just go with your gut.

  1. **A virus floating in the air, outside of any host cell.**
     - A. Alive
     - B. Not alive
     - C. Only alive when infecting a host

  2. **A mule (the sterile offspring of a horse and a donkey). It eats, breathes, and moves just like its parents.**
     - A. Alive
     - B. Not alive
     - C. Alive but not in the same way as fertile organisms

  3. **A bacterial spore that has been dormant in a frozen lake for thousands of years. Under the right conditions, it could still germinate into a bacterium.**
     - A. Alive
     - B. Not alive
     - C. In a state of suspended animation (alive but dormant)

  4. **A prion (a misfolded protein that causes other proteins to misfold, leading to diseases like mad cow disease).**
     - A. Alive
     - B. Not alive
     - C. Only alive in the context of causing disease in a host

  5. **A computer program in a simulated environment. It copies itself, mutates randomly, and competes with other programs for memory and processing power.**
     - A. Alive
     - B. Not alive
     - C. Artificially alive, but not in the biological sense

  6. **A clay crystal that grows by incorporating molecules from its environment. When it gets large enough, it splits into multiple crystals, each of which can grow and split again. It does not perform any chemical reactions.**
     - A. Alive
     - B. Not alive
     - C. A primitive form of life

  7. **A synthetic minimal cell, built from non-living components and a fully designed genome, that can grow and divide.**
     - A. Alive
     - B. Not alive (because it's artificial)
     - C. Alive, but created in a lab

  8. **An engineered machine that takes in fuel, converts it to energy, repairs itself, and maintains its internal state. It is one-of-a-kind and never reproduces.**
     - A. Alive
     - B. Not alive
     - C. Alive in a mechanical sense

  9. **A candle flame that consumes wax and oxygen, produces heat and light, and maintains a stable shape until the fuel runs out.**
     - A. Alive
     - B. Not alive
     - C. A dynamic process, but not alive

  10. **A human body that has been dead for one hour. Some cells are still metabolizing, but the organism as a whole is dead and decaying.**
      - A. Alive (because some cells are still living)
      - B. Not alive (the organism is dead)
      - C. Partly alive and partly dead

  **Scoring Key:**

  After answering all questions, note your choices and then assign points to each position based on the table below. For each question, if your answer matches the letter for that position, give it one point.

  | Question | Your Answer | Vitalism | Autopoiesis | Thermodynamic | Darwinian | Deflationary |
