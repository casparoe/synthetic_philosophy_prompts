  ### **Quiz: What Does ‘Alive’ Really Mean to You?**
  **Instructions:** For each scenario, pick the answer that *feels* right—don’t overthink it. There are no trick questions!  
  *(Answer with A, B, or C for each.)*

  1. **A virus floating in the air, outside of any host cell.**  
     - A. Alive  
     - B. Not alive  
     - C. Only alive when infecting a host  

  2. **A mule (sterile hybrid of a horse and donkey). It eats, breathes, and moves normally.**  
     - A. Alive  
     - B. Not alive  
     - C. Alive but not in the same way as fertile organisms  

  3. **A bacterial spore frozen in ice for 10,000 years. It’s dormant but could germinate if thawed.**  
     - A. Alive  
     - B. Not alive  
     - C. In suspended animation (alive but paused)  

  4. **A prion (misfolded protein that causes diseases like mad cow). It "replicates" by twisting healthy proteins.**  
     - A. Alive  
     - B. Not alive  
     - C. Only alive inside a host  

  5. **A computer program that copies itself, mutates randomly, and competes with others for memory in a simulation.**  
     - A. Alive  
     - B. Not alive  
     - C. Artificially alive, but not biologically  

  6. **A clay crystal that grows, splits, and templates new crystals using environmental minerals. No chemistry—just physics.**  
     - A. Alive  
     - B. Not alive  
     - C. A primitive form of life  

  7. **A synthetic minimal cell built from non-living parts with a designed genome. It grows and divides in a lab.**  
     - A. Alive  
     - B. Not alive (it’s artificial)  
     - C. Alive, but created by humans  

  8. **An engineered "Perpetual Metabolism Machine." It fuels itself, repairs its parts, and maintains stability—but it can’t reproduce and is one-of-a-kind.**  
     - A. Alive  
     - B. Not alive  
     - C. Alive in a mechanical way  

  9. **A candle flame. It consumes wax and oxygen, releases heat/light, and holds its shape until fuel runs out.**  
     - A. Alive  
     - B. Not alive  
     - C. A dynamic process, but not alive  

  10. **A human body dead for 1 hour. Some cells still metabolize, but the organism is decomposing.**  
      - A. Alive (cells are functioning)  
      - B. Not alive (the organism is dead)  
      - C. Partly alive and partly dead  

  ---

  ### **Scoring Key**  
  Tally how many times your answers match each column below. The position with the *highest score* reflects your implicit definition.  
  *(V = Vitalism, A = Autopoiesis/Self-Organization, T = Thermodynamic/Dissipative, D = Darwinian/Evolutionary, F = Deflationary/Folk Concept)*  

  | Question | V | A | T | D | F |
  |----------|---|---|---|---|---|
  | 1        | B | B | B | B | C |
  | 2        | A | A | A | B | A |
  | 3        | A | A | A | A | A |
  | 4        | B | B | B | B | B |
  | 5        | B | B | B | B | C |
  | 6        | B | B | B | B | C |
  | 7        | A | A | A | A | A |
  | 8        | B | A | A | B | C |
  | 9        | B | B | A | B | B |
  | 10       | B | B | B | B | B |

  #### **What Your Scores Mean**  
  - **Vitalism (V)**: Life requires a non-physical "spark" or essence. High scores mean you exclude artificial/non-organic cases (e.g., synthetic cells or programs).  
  - **Autopoiesis/Self-Organization (A)**: Life = self-maintaining, autonomous systems. High scores mean you prioritize metabolism/self-repair over reproduction (e.g., you accept the mule and engineered machine but reject fire).  
  - **Thermodynamic/Dissipative (T)**: Life = energy-driven structures that resist chaos. High scores mean you accept anything maintaining order through energy flow (e.g., fire or the engineered machine) but reject static/dormant cases.  
  - **Darwinian/Evolutionary (D)**: Life = evolvable, self-sustaining systems. High scores mean you require reproduction/evolution (e.g., you reject mules and sterile machines but accept spores and synthetic cells).  
  - **Deflationary/Folk Concept (F)**: "Life" is a fuzzy, useful category without strict rules. High scores mean you pick borderline options (C) often and align with everyday intuitions.  

  #### **Key Overlaps and Gaps**  
  - **Indistinguishable positions**:  
    - **Autopoiesis (A) and Thermodynamic (T)**: These *always* yield identical answers in this quiz. Both accept the mule, spore, synthetic cell, and engineered machine, while rejecting viruses, prions, and the dead body. The clay crystal and computer program are rejected by both, and fire is the *only* case where they differ in principle (Thermodynamic accepts it, Autopoiesis rejects it)—but this quiz can’t resolve that difference because fire is universally rejected by Autopoiesis adherents in practice.  
    - **Vitalism (V) and Deflationary (F)**: These overlap heavily (e.g., both accept the mule/spore/synthetic cell and reject prions/fire). They’re separable only if you choose borderline (C) options—Deflationary picks C frequently, while Vitalism rarely does.  

  - **Coherent-but-unoccupied views**:  
    - **"Self-Repair + Evolution" hybrid**: Someone could consistently demand *both* self-maintenance (Autopoiesis) *and* evolvability (Darwinian). This would reject the mule (no evolution) and engineered machine (no evolution), accept the spore/synthetic cell, and reject fire/viruses. It’s *coherent* but *unattractive*—it excludes too many intuitive cases (like mules) and has no real-world proponents.  
    - **"Metabolism-Only" view**: A position accepting *anything* with metabolism (mule, fire, dead body’s cells) but rejecting reproduction. It’s *coherent* (e.g., answering A for mule/fire/dead body and B for viruses/spores) but *unexplored*—no major school defends this, as it’s too broad.  

  #### **Design Notes**  
  - **Why these cases?** The virus tests reproduction dependence, the mule tests metabolism without evolution, the spore tests dormancy, and the engineered machine tests reproduction’s necessity. Fire and the dead body probe energy dissipation and "partial" aliveness.  
  - **Unattested answers**: No coherent view accepts the prion as alive (all positions score B), and only Thermodynamic accepts fire (A). High Deflationary scores are common; high Vitalism scores are rare.  
  - **Canadian-proofed**: American spellings used throughout (e.g., "metabolizes," "synthetic," "fueled").  

