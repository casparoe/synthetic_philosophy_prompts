  **Notes on Scoring:**

  - **Vitalism**: Typically gives high scores if you see life as requiring a non-physical essence, so you accept natural organisms but reject artificial and non-organic ones.
  - **Autopoiesis**: Focuses on self-maintenance and autonomy, so you accept the mule, spore, and the engineered machine (if it's self-maintaining) but reject fire and the computer program.
  - **Thermodynamic**: Focuses on energy dissipation and self-organization, so you accept fire and the engineered machine but reject the virus and prion.
  - **Darwinian**: Requires reproduction and evolution, so you reject the mule and the engineered machine but accept the spore and the synthetic cell.
  - **Deflationary**: Uses a flexible, cluster concept of life, so you often choose the borderline option (C) for tricky cases.

