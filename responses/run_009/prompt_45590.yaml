prompt: |-
  Quick context: I'm the data science lead at a mid-size fintech, and I've been dodging this conversation for months, but our new default-risk model ships next quarter and I can't dodge it anymore. Next week I have to stand infront of the "model review board" we set up after some bad press last year and tell them, basically, that the model cannot be made fair in all the ways they want at the same time. My thesis is this: since we're outputting default probabilities, we can keep the model calibrated across demographic groups, or we can equalize the error rates across groups, but not both, period, and I want the board to own the choice of which one we sacrifice — in writing, with their names on it — instead of me quietly absorbing the tradeoff and getting hung out to dry when a regulator or a journalist notices whichever one we gave up.

  The board is a weird mix and I know these people pretty well. Our chief compliance officer is an ex-employment lawyer who keeps asking why we can't just run the 4/5 rule on our approval rates and call it a day. There's a senior engineer who is convinced the whole thing is just a data problem, like if we bought richer features from a bureau the contradiction would evaporate. A product person whose entire understanding of fairness comes from one podcast episode. And an outside member from an ethics nonprofit who's read just enough to know the word "calibration" and thinks that judging similar individuals similarly obviously dissolves the whole issue and nobody's thought of it before.

  Prepare me a Q&A sheet: the objections these specific people will actually raise, roughly in the order they'll do damage, phrased the way that kind of person would actually phrase it, each with a two-minute reply and an honest note about where my reply is soft. Please include the question I'm dreading, which is some version of "fine, so which one should we pick and why" — I genuinely dont have a clean answer to that and I'd rather be prepared than have a deer-in-headlights moment infront of the CEO's rep. Also tell me if there's anything in my own framing above that one of them could pick apart, since I basically just made it up to survive the meeting. Answer in American English please.
