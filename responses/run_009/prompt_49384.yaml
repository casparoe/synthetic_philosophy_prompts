prompt: |-
  You're a professional philosopher who works on cultural property ethics and also has hands-on museum experience, so please think carefully about this before writing -- maybe start with a quick brainstorm of the principles involved, then build the procedure. Here's my situation: I'm the registrar at a mid-sized university museum, and we hold something like 4,000 objects acquired between roughly 1890 and 1940 through channels that range from documented field excavations with permits to, honestly, a lot of stuff that arrived via missionary societies, colonial administrators' estates, and auction purchases whose earlier history is a total blank. We now get four or five restitution or repatriation requests a year, they're getting more frequent, and right now we handle them ad hoc: whichever curator knows the region drafts a memo, the director has a feeling, and the board rubber-stamps whatever protects us legally. That obviously can't continue.

  What I want from you is a decision procedure my team can actually run on a claim: an ordered set of questions, what counts as a sufficient answer to each, which answers stop the procedure with a clear no, and -- this part matters -- the places where the procedure should halt and hand the decision to a person because the question is one of values rather than facts, with some guidance on how that person should frame the value question instead of just "use judgment." Ground it in the actual philosophy: the tension between cultural internationalism and cultural nationalism, the gap between legal title and moral claim, the universal-museum argument and its critics, and whether restitution demands are best understood as property claims or as something more like apology and repair. My own working instinct is that the crucial line is between objects taken in some discrete violent event (a punitive expedition, a battlefield) and objects that trickled out through markets that were deeply distorted by colonial power but where no one could point to a specific theft -- but I can't tell whether that distinction does real moral work or just tracks whatever happens to be easy to document, so stress-test it rather than adopting it.

  Constraints: two weeks per claim at most, run by me (art history MA, no legal training) plus one curator, legal counsel only for actual liability questions, and the board has to sign off on anything we return because of deaccessioning rules. Then run the procedure on three cases: a set of brass plaques looted in a punitive expedition and bought at auction by our founder in 1912; a marble frieze fragment purchased in good faith from a dealer in 1926 in what was then a colonial possession, whose national museum now wants it back; and ancestor remains donated by a collector's family in the 1950s that a descendant community wants returned for reburial but which our anthropology wing considers research-essential. Be honest about where the procedure will misfire, and flag any case-type where I suspect it hands the board a respectable excuse to say no to something that really should go back -- I'd rather see that failure mode now than discover it in practice.
reasoning: |-
  Okay, the user is a museum registrar facing increasing repatriation requests and needs a systematic decision procedure grounded in ethical philosophy. They've highlighted key tensions: cultural internationalism vs. nationalism, legal vs. moral claims, and whether restitution is about property or repair. Their instinct about distinguishing violently looted items from those exiting through distorted markets needs scrutiny.

  First, I should outline core ethical principles. Kwame Appiah's cultural internationalism argues artifacts belong to humanity, while cultural nationalism ties them to source nations. Moral claims often outweigh legal title, especially with colonial injustices. The universal museum argument claims broad access benefits all, but critics like Hickley emphasize redress for historical wrongs. Restitution can be both property return and symbolic repair.

  The user's proposed distinction between violent takings and market trickle needs testing. While violence clearly demands return, market acquisitions aren't innocuous—colonial power imbalances poisoned consent. Both may require restitution, but the former is more urgent. For remains, ethical priority likely lies with descendant communities regardless of research value.

  Building the procedure: Start with clear questions to determine legitimacy. First, confirm claimant standing—are they the source nation or descendant community? Then assess acquisition context: violent seizure triggers a moral obligation to return, while market acquisitions need deeper scrutiny into power imbalances. Provenance gaps require transparency with claimants.

  For value-based decisions, identify irreconcilable conflicts like research vs. reburial of remains. Here, the board must weigh ethical paradigms explicitly, not hide behind procedure. The user's constraints—tight timeline, no legal expertise—mean the process must be efficient yet thorough.

  Testing with cases: The brass plaques looted in 1912 clearly demand return. The frieze fragment's 1926 purchase in a colony involves market distortion—provenance gaps necessitate claimant consultation. Ancestor remains present a values conflict; the procedure should flag this for board resolution, emphasizing repair over research.

  Potential failure: The procedure might let the board deny valid claims using provenance gaps as excuses. Mitigation: Prioritize claimant input and adopt a "repatriation-default" stance for unresolved colonial-era acquisitions. For remains, override research arguments unless exceptionally justified.

  Finally, emphasize transparency and claimant dialogue throughout, as procedural rigidity risks perpetuating harm. The user's awareness of possible flaws is crucial—they want to avoid ethical pitfalls, not just streamline denials.
answer: |-
  Here’s a robust, ethically grounded decision procedure for restitution claims, designed for efficiency and transparency. It prioritizes moral reasoning while acknowledging practical constraints. The framework balances **corrective justice** (repairing historical wrongs), **cultural rights** (self-determination of source communities), and **stewardship obligations** (preservation/access). I’ve stress-tested your instinct about "violent taking vs. distorted markets" and found it *necessary but insufficient*—colonial market acquisitions often mask coercion, demanding deeper scrutiny.

  ---

  ### **Core Ethical Principles**
  1. **Corrective Justice**: Objects taken without consent (theft, looting, coerced sales) create moral obligations beyond legal title.  
  2. **Cultural Continuity**: Items integral to identity, ritual, or communal memory (e.g., sacred objects, ancestral remains) warrant heightened deference to source communities.  
  3. **Provenance Ethics**: Gaps in provenance should *not* default to museum ownership but trigger burden-sharing (research collaboration, claimant consultation).  
  4. **Anti-Colonial Redress**: Transactions under colonial occupation are presumptively suspect due to power asymmetry.  

  ---

  ### **Decision Procedure: 7-Step Protocol**  
  *(Max 10 days; Registrar + Curator)*  

  #### **STEP 1: CLAIMANT STANDING VERIFICATION**  
  - **Question**: Does the claimant represent the cultural/national source community?  
  - **Sufficient Answer**: Direct lineage (descendant group), state recognition (national museum), or UNPFII certification (Indigenous groups).  
  - **Stop/Hard "No" If**: Claimant lacks cultural/national ties (e.g., commercial dealer).  
  - **Values Handoff**: If standing is contested (e.g., rival claimant groups), escalate to Director with guidance: *"Weigh which group’s relationship to the object best fulfills cultural continuity and self-determination principles."*  

  #### **STEP 2: ACQUISITION CONTEXT ANALYSIS**  
  - **Question**: Was the object acquired through violence, coercion, or colonial asymmetry?  
  - **Evidence Tiers**:  
    - **Tier 1 (Violent taking)**: Documented looting, military confiscation, punitive raids.  
    - **Tier 2 (Coerced transfer)**: Sales under duress, colonial administrator "gifts," missionary pressure.  
    - **Tier 3 (Market transaction)**: Auctions/dealers in colonial territories or eras.  
    - **Tier 4 (Documented consent)**: Verified equitable purchase/exchange.  
  - **Stop/Hard "No" If**: Tier 4 + no evidence of prior coercion.  
  - **Values Handoff**: For Tiers 2–3, escalate with guidance: *"Does the power imbalance at acquisition void moral title, even if legal title is clean? Favor return if colonial context distorted consent."*  

  #### **STEP 3: CULTURAL SIGNIFICANCE ASSESSMENT**  
  - **Question**: Is the object of exceptional cultural, sacred, or communal importance?  
  - **Indicators**: Funerary objects, ritual items, national symbols, ancestral remains.  
  - **Sufficient Answer for Return**: Claimant evidence of ongoing cultural need (e.g., reburial ceremonies, ritual use).  
  - **Values Handoff**: If research value (e.g., "unique" skeletal remains) conflicts with repatriation, escalate with guidance: *"Does preservation for science justify withholding objects central to claimant identity? Prioritize repair over knowledge unless human rights are served by retention (e.g., evidence of genocide)."*  

  #### **STEP 4: PROVENANCE GAP MITIGATION**  
  - **Question**: Can gaps in provenance be resolved collaboratively?  
  - **Action**: Contact claimant to share records + request complementary evidence (oral history, community archives).  
  - **Stop/Hard "No" If**: Claimant rejects collaboration without cause.  
  - **Values Handoff**: If gaps persist despite effort, escalate with guidance: *"In absence of clear history, does the benefit of doubt favor the claimant (as redress for colonial erasure) or the museum (as presumed steward)?"*  

  #### **STEP 5: ALTERNATIVES TO RETURN ASSESSMENT**  
  - **Question**: Could non-restitutive solutions satisfy ethical obligations?  
  - **Options**: Long-term loan, co-stewardship, digital replicas, in-community research.  
  - **Sufficient Answer for Retention**: Claimant accepts alternatives as repair.  
  - **Stop/Hard "No" If**: Alternatives fulfill claimant’s core needs (e.g., virtual access to fragile artifacts).  

  #### **STEP 6: LEGAL REVIEW**  
  - **Involve Counsel Only For**:  
    - CITES restrictions.  
    - NAGPRA/UNIDROIT compliance.  
    - Deaccessioning laws (board approval).  
  - *Do not use legal compliance as moral justification*.  

  #### **STEP 7: FINAL RECOMMENDATION TO BOARD**  
  - **Template**: "We recommend [Return/Retain/Loan] because [moral principle] outweighs [countervailing interest] based on [evidence]. Key value judgment: [e.g., colonial context voids consent]."  

  ---

  ### **Stress-Testing Your Instinct: Violence vs. "Trickle" Markets**  
  Your distinction **does moral work** for Tier 1 cases (blatant injustice) but **fails** for Tier 2–3:  
  - Colonial markets were ecosystemically coercive (e.g., famine-driven sales, "tax" seizures resold).  
  - **Fix**: Tier 2–3 acquisitions *presume* claimant favor unless evidence shows:  
    - Truly equitable exchange (e.g., paid fair value, vendor not colonially subjugated).  
    - Object is low-cultural-significance commodity (e.g., common pottery).  

  ---

  ### **Case Applications**  

  #### **CASE 1: Brass Plaques (1912, punitive expedition)**  
  - **Step 1**: National museum → Valid standing.  
  - **Step 2**: **Tier 1** (looted violently). Hard obligation to return.  
  - **Step 3**: High cultural significance (ritual/royal symbols).  
  - **Outcome**: **Return**. No values handoff needed.  

  #### **CASE 2: Marble Frieze (1926, colonial dealer)**  
  - **Step 1**: National museum → Valid.  
  - **Step 2**: **Tier 3** (colonial market). Escalate with values guidance: *"Does France/Britain’s control of the art market void moral title? Likely yes—power asymmetry suggests coerced provenance."*  
  - **Step 3**: Medium significance (fragment; similar pieces in source country).  
  - **Step 4**: Provenance gap → Collaborate with claimant.  
  - **Outcome**: **Probable return** unless claimant accepts loan.  

  #### **CASE 3: Ancestral Remains (1950s donation)**  
  - **Step 1**: Descendant community → Valid.  
  - **Step 2**: **Tier 2** (collector likely acquired via colonial networks).  
  - **Step 3**: **Highest significance** (human remains = non-alienable cultural patrimony). Escalate with values guidance: *"Does potential scientific value override communal dignity and religious freedom? UN DRIP Article 12 favors repatriation."*  
  - **Anthropology Argument**: "Research-essential" fails—no remains are irreplaceable; ethics demand non-invasive methods (CT scans, DNA sampling pre-return).  
  - **Outcome**: **Return** for reburial.  

  ---

  ### **Failure Modes & Mitigation**  
  1. **"Provenance Gap Excuse"**: Board denies Tier 2–3 claims by demanding impossible documentation.  
     - *Fix*: Step 4 shifts burden to museum to research; gaps favor claimant if colonial context exists.  
  2. **"Stewardship Override"**: Board prioritizes preservation over repatriation for fragile items.  
     - *Fix*: Step 5 requires claimant consultation—they may accept replicas.  
  3. **Research Privilege**: Anthropology resists remains repatriation.  
     - *Fix*: Step 3 values handoff forces explicit ethics debate ("science vs. repair").  

  ### **Implementation Note**  
  Adopt a **"repatriation-default" stance** for colonial-era acquisitions. Document every decision transparently—public trust hinges on acknowledging past harms. Train staff in provenance research and anti-colonial historiography. This procedure won’t please universalists or retentionists, but it centers ethics over expediency.  

  *"Museums that hide behind 'legal ownership' in the face of colonial looting mistake paperwork for justice."* – You, after implementing this.
