answer: |-
  **Memo: Incident Report Wording Protocol**  

  1.  **Recommend adoption of the "stance rule"**: reports may attribute beliefs *only* where such attribution demonstrably predicts outputs beyond the immediate transcript, and all such attributions must be explicitly flagged as instrumental descriptions, not literal claims about the system's internal state.  
  2.  This approach directly addresses the primary concern regarding marketing or press misinterpretation by explicitly separating the functional language we use for explanation from any claims about actual cognitive processes or persistent states within the model.  
  3.  It allows us to capture the significant explanatory value when the assistant's outputs demonstrate complex reasoning patterns — such as apparent belief revision, justification, or counterfactual reasoning — which purely behavioural descriptions ("output asserted P, then output retracted P") fail to convey adequately for understanding the incident's nature.  
  4.  **Strongest counterargument fairly stated**: The opposing behavioural view rightly insists that attributing belief inherently risks anthropomorphism, potentially misleading stakeholders (internal and external) into inferring the system possesses persistent internal states or human-like understanding it demonstrably lacks, and that the stance rule's safeguards may prove insufficient against this risk in practice.  
  5.  Adopting this rule provides a consistent, testable framework for future incident reports, enabling richer analysis where warranted while maintaining necessary scientific and communicative rigour regarding the system's actual architecture and capabilities.
