prompt: |-
  I'm putting together a handout for my intro metaphysics section on the Ship of Theseus, and I want a case that targets the "best candidate" idea (the Lewis-style move where the original survives iff one candidate is clearly the best one, and near-ties mean no survivor). Design me a scenario where the best-candidate view says the original object simply ceased to exist — not that it's ambiguous or conventional, but that neither successor is it — while both the same-matter view and the continuous-identity view each confidently pick a winner. Constraints: an everyday object (a rowing club's racing shell would be ideal), repairs and rebuilds spread realistically over decades, no teleporter, no moment where a perfect duplicate of every part exists at once, and the scenario itself should be one paragraph. After the scenario, walk through the verdict each of the three views gives and why, tell me which feature of the case is doing the work (I suspect it's the near-tie itself), what happens to the best-candidate verdict if the tie is broken decisively in one direction, and how someone who just insists that the club's continuously-sailing boat is obviously the original would attack the setup. One thing I want flagged honestly: does stipulating a near-tie beg the question in favor of the no-survivor verdict, i.e. am I building the answer into the case? And tell me what would make you abandon the claim that best-candidate semantics can be made to deliver 'no survivor' here at all — which assumption, if a critic rejected it, would the whole construction collapse.
