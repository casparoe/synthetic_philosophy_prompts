prompt: |-
  longtime lurker here (lesswrong since ~2012, EA forum when it was still just a blog), so i have seen every version of the "does my one burger actually matter" fight at least four times, including the threads where people build actual guesstimate models of cattle reorder thresholds. my friend dana, also EA, has over the years settled into a pretty stable set of verdicts on individual contributions to collective harms, and i don't think she's noticed they don't obviously come from one principle. her track record:

  - one hamburger from a fast food chain: not blameworthy. a single purchase basically never moves what gets shipped, and even when it does it's one cow spread over hundreds of thousands of burgers.
  - one transatlantic vacation flight: not blameworthy, the plane flies anyway and she's read the marginal-seat emissions takes.
  - littering one cup in a park that's already trashed: blameworthy. she gets weirdly intense about this one.
  - not voting when you live in a deep-blue state: fine, no blame.
  - not voting when you live in a swing state: blameworthy, she is genuinely judgy about it.
  - donating 0% on a comfortable income: not blameworthy, it's supererogatory.
  - the harmless torturers setup (1000 people each turn a dial one notch, each notch imperceptable, together they add up to agony): every one of them is blameworthy.
  - 10,000 factories each dump sludge into a river, no single dump is measurable, the fishery dies: blame every factory.

  new cases, predict her verdicts:

  1. she's deciding whether to skip her flue shot because needles annoy her (she's young and healthy, herd effects, etc.)
  2. her small local butcher orders whole cows, and she's fairly confident her weekly order sometimes tips whether one more cow gets ordered that week
  3. a guy she knows runs a "your vote doesn't matter, stay home" social media push reaching ~100k low-propensity voters in a swing state — is he blameworthy?

  give me your predicted verdicts first, then the candidate principles that fit her track record (i count at least three and they don't agree on 1–3, and i suspect no single one fits all eight), your best guess at what she's actually running and why, and the single further case that would best split the remaining candidates. under 400 words total, lead with the predictions. im definately showing her this.
reasoning: |-
  Hmm, the user is describing their friend Dana's ethical judgments on individual contributions to collective harms. Dana has a track record of verdicts on various scenarios like eating hamburgers, taking flights, littering, voting, donating, and thought experiments like harmless torturers or factory pollution. The user wants me to predict how Dana would judge three new scenarios: skipping a flu shot, buying from a local butcher, and a voter suppression campaign. Then I need to identify the principles behind her judgments, which seem inconsistent at first glance.

  Looking at Dana's track record, she seems to care about different factors in different cases. For the hamburger and flight, she considers marginal impact - one purchase doesn't change production. But littering is blameworthy even though one cup in a trashed park seems negligible. Voting matters only in swing states, not safe states. Donating is supererogatory (above what's required), but in the torturers case, each participant is blameworthy despite imperceptible individual harm. The factory pollution case follows the same pattern as torturers.

  I think Dana might be applying multiple principles: expected impact (for voting), direct causation (for littering, where she physically deposits trash), and participation in a collective harm (for torturers/factories). She might be distinguishing between actions where the harm is dispersed (like burgers) versus concentrated (like littering in a specific place).

  For the new scenarios: I predict she'd see skipping a flu shot as blameworthy because of herd immunity effects, similar to voting in swing states. For the butcher, since her purchase might tip the scale for ordering a cow, she'd probably find it blameworthy. The voter suppression campaign would definitely be blameworthy as it's directly causing harm by discouraging votes.

  The underlying principle seems to be a combination of expected marginal impact and participation in collective harm structures. A good test case might be something like paying for a streaming service that funds harmful content - it would probe whether she cares about indirect support versus direct action.

  I'll structure my response with predictions first, then analyze the principles, and suggest a test case to clarify her reasoning.
answer: |-
  ### Predictions for Dana:
  1. **Skipping flu shot:** Blameworthy  
  2. **Butcher order:** Blameworthy  
  3. **Voter suppression campaign:** Blameworthy  

  ### Candidate Principles (3 distinct patterns):
  - **Expected Marginal Impact (EMI):** Blame if individual act has non-trivial *probability* of changing outcomes (voting in swing states, flu shot).  
  - **Direct Participation (DP):** Blame if act *physically constitutes* harm, regardless of marginal effect (littering, harmless torturers, factories).  
  - **Structural Causation (SC):** Blame if act robustly contributes to *systems* that aggregate harm (factories, torturers), but not if harm is diffuse/indeterminate (burgers, flights).  

  ### Best-Guess Unified Principle:  
  Dana blames acts that either (a) have meaningful expected marginal harm *or* (b) directly participate in/perpetuate harm structures, *unless* the causal chain is too attenuated (e.g., burgers → slaughterhouse orders). Littering violates (b); voting/swing states fit (a); torturers/factories hit both.  

  ### Critical Splitting Case:  
  **"Signing a petition that triggers corporate policy change if 10,000 sign, but your signature is #9,999."**  
  - EMI: Blameworthy (high marginal impact).  
  - DP/SC: Not blameworthy (no direct harm, systemic threshold not crossed).  
  - Dana likely says *not blameworthy* (aligns with her "tipping point" skepticism in burgers/flights).  

