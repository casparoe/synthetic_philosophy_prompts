  ### Philosophy Testimony Game: "Trust Chain Challenge"

  Here's a streamlined in-class game designed to experientially contrast reductionism and anti-reductionism about testimony. The game uses two rule sets (without labeling them philosophically) and focuses on *how* trust operates in testimony chains.

  ---

  ### **Game Structure**
  **Participants:** 14 students  
  **Time:** 40-45 minutes (including setup)  
  **Materials:**  
  - 2 sets of "event cards" (e.g., complex images like a "blue cat wearing a hat, standing next to a red bicycle with a floating balloon").  
  - Blank paper and pens.  
  - 2 sets of multiple-choice answer sheets (4 options per event, 1 correct).  
  - Fake "trust points" (e.g., poker chips or paper slips).  
  - Timer.  

  **Roles per Round (2 chains per group):**  
  - **Group A (7 students):**  
    - 2 Witnesses (see the event).  
    - 4 Reporters (pass reports down the chain).  
    - 1 Final Decider (acts on the report).  
  - **Group B (7 students):** Same roles.  
  - *Swap roles between rounds so all students participate actively.*

  ---

  ### **Rules & Setup**  
  **Round 1: "Prove-It-First" Rules (Reductionism Simulation)**  
  - **Key Rule:** You may only trust a report if you have a personal track record with *that specific reporter*. No track record = no trust.  
  - **How it plays:**  
    1. **Event viewing:** Witnesses view Event Card 1 for 10 seconds, then write a description.  
    2. **Chain transmission:**  
       - Reporter 1 receives the witness’s report.  
       - *If* Reporter 1 has no prior interaction with Witness, they **must disregard the report** and write "No data—cannot verify."  
       - Reporters 2–4 and the Final Decider repeat this: they can only use the report if they have a track record with the *previous* reporter (impossible in Round 1).  
    3. **Action:** Final Decider receives the last report. They:  
       - Bet 10 "trust points" on the multiple-choice answers (forced to distribute equally if they received "no data").  
    4. **Track records:** Record interactions (e.g., "Witness → Reporter 1") for the next round.  

  **Round 2: "Trust-Unless-Doubt" Rules (Anti-Reductionism Simulation)**  
  - **Key Rule:** Trust reports by default. Only reject if you spot a clear contradiction or implausibility ("defeater").  
  - **How it plays:**  
    1. **Event viewing:** Witnesses view *new* Event Card 2 for 10 seconds, then write a description.  
    2. **Chain transmission:**  
       - Each reporter reads the report, sets it aside, and writes *their own version* from memory (simulating re-testifying).  
       - They **must trust the report** unless they notice an obvious error (e.g., "the report says the cat is green, but I recall it was blue").  
    3. **Action:** Final Decider reads the last report and bets 10 points on the multiple-choice answers *based on the report*.  
    4. **Defeaters:** If a reporter spots a contradiction, they note it but still pass the report (e.g., "Report says green cat—but I think it was blue").  

  **Scoring:**  
  - Points earned = points bet on the correct answer (e.g., bet 8 on correct option = 8 points).  
  - Track group scores per round.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Reductionist round "breaks" immediately (no one can act).  
     - **Fix:** Embrace this! Debrief why: "How did it feel when you couldn’t use the report? What would you need to make this work?"  
  2. **Problem:** Anti-reductionist chains degrade into nonsense (telephone-game effect).  
     - **Fix:** Use moderately complex events. If chains stay accurate, note: "Sometimes trust *works*—why?"  
  3. **Problem:** Students "cheat" in reductionist round by trusting anyway.  
     - **Fix:** Assign a "rule enforcer" per group. Emphasize: "Stick to the rules—it’s an experiment!"  
  4. **Problem:** Time runs short.  
     - **Fix:** Use a visible timer. Cap report-writing at 60 seconds per step.  

  ---

  ### **Debrief (30 Minutes)**  
  **Step 1: Share Results**  
  - Compare scores:  
    - *Reductionist round:* Low scores (points scattered randomly). Chains broken.  
    - *Anti-reductionist round:* Higher scores (but likely errors). Chains intact but degraded.  
  - Ask:  
    > "Which rules let you *act* on reports? Which felt more natural? Why?"  

  **Step 2: Map to Philosophy**  
  - Introduce terms:  
    - **Reductionism (Hume):** "You saw the 'Prove-It-First' rules. Trust requires personal verification—like building a track record."  
    - **Anti-Reductionism (Reid/Coady):** "This was 'Trust-Unless-Doubt.' Testimony is a basic source of knowledge—trust first, doubt only with reason."  
  - Highlight game limitations:  
    > "The reductionist round failed because you had no prior track records. But in real life, we *do* have lifetimes of verification (e.g., 'people usually tell the truth'). Does this mean reductionism works long-term? Or is anti-reductionism why we can start trusting at all?"  

  **Step 3: Discuss Real-World Tensions**  
  - Probe critical questions:  
    - "When did trust go wrong in the game? How does this mirror fake news or biased sources?"  
    - "Can reductionism ever explain why we trust *new* sources (e.g., a breaking news alert)?"  
    - "Is there a middle ground? (e.g., trust but verify with *other* sources)."  

  **Step 4: Emphasize Unresolved Questions**  
  - Clarify:  
    > "The game doesn’t prove which theory is 'correct.' It shows a trade-off:  
    > - **Anti-reductionism** lets knowledge spread quickly but risks error.  
    > - **Reductionism** is cautious but may stall knowledge.  
    > Real testimony (science, history, news) uses both: we trust experts by default *and* verify over time."  

  ---

  ### **Why This Works**  
  - **Experiential contrast:** Students *feel* the frustration of reductionism and the fragility of anti-reductionism.  
  - **Safe abstraction:** Fake points/stakes reduce defensiveness.  
  - **Debrief depth:** The game sets up—but doesn’t resolve—core tensions, inviting nuanced discussion.  

  **First-Run Tip:** Do a 3-minute test round with a simple event (e.g., "a square and a circle") to demo the flow. Adjust events based on your students’ engagement (e.g., use memes if they resonate).
