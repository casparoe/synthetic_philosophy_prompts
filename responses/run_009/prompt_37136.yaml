prompt: |-
  I'm a second-year PhD student trying to settle on a dissertation area before the end of the academic year, and I'd like your help prioritizing. My background is in formal semantics and logic rather than metaphysics, and I've become interested in the cluster of issues around merely verbal disputes and metaontology: whether disputes over existence claims — numbers, tables, mereological sums, composite objects — are substantive; what 'substantive' means when applied to a dispute rather than a proposition; and whether the diagnostics philosophers have proposed for detecting verbalness actually work. My worry is that I can't yet tell which threads in this area are genuinely live and which are settled mainly by fatigue, and I'd rather not spend three years on a question everyone has silently moved on from. So, advise me as if choosing my dissertation: what do you take to be the main open questions in this area right now, and which two or three would you actually prioritize for someone with my background and a strong preference for questions that admit of progress over questions that only reward another turn of the wheel? To show the grain of answer I want, here are some candidate threads I've noticed — feel free to add ones I've missed or tell me mine are dead ends: (1) whether verbalness is all-or-nothing or gradable, and if gradable, whether the degrees are anything more than a metaphor; (2) whether the standard diagnostics — e.g., asking each party whether they'd accept the other's sentences, or looking for a shared practical goal that would reveal the disagreement as non-verbal — can deliver opposite verdicts on the same dispute, and what we should conclude if they can; (3) whether quantifier variance can be stated in a way that avoids collapsing into either triviality or a concession to the kind of ontological realism that takes quantificational structure to carve at the joints; and (4) a thought I can't find discussed anywhere: whether the standard diagnostics implicitly assume a language with the quantificational and sortal apparatus of English, and whether disputes about composition could look different — less verbal, or differently verbal — from the standpoint of languages that lexicalize individuation differently. Defend your ordering explicitly: for each question, how many other questions in the area depend on it, how tractable it is for someone trained in semantics rather than general metaphysics, and how neglected it is relative to its importance. Also tell me which fashionable-looking threads you'd steer me away from and why — in particular, whether deflationary or 'easy' approaches to existence questions have quietly changed the subject rather than answered it. One final constraint: the senior metaphysicians in my department regard the whole verbal-disputes literature as meta-meta navel-gazing, so I also need to know which of these questions, if answered, would actually change how first-order metaphysical debates are conducted — and if your honest view is that none would, say that too, since it bears on whether I should choose this area at all.
