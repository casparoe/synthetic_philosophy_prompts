  We are creating a quiz to help grad students in sociology, economics, and philosophy clarify their positions on the gender-equality paradox. The paradox is that in more gender-egalitarian countries, occupational choices often appear more gendered (i.e., men and women choose different occupations more often) rather than less.

  The quiz will have 8-10 questions, each presenting a concrete scenario, hypothetical dataset, or thought experiment with 2-3 answer choices. The goal is to map answers onto two main dimensions: the "why" (cause of the paradox) and the "so what" (normative implications). The scoring should identify positions such as:
  1. Biological/canalization view (differences are innate or biologically canalized)
  2. Preference-satisfaction liberal view (free choice is acceptable regardless of origin)
  3. Socialization/adaptive-preference view (differences are due to socialization, which may lead to adaptive preferences)
  4. Structural-constraint view (differences are due to structural barriers)
  5. Measurement-skeptic position (the paradox is an artifact of measurement)
  6. Justice-critique position (the pattern is real and preference-based but still problematic due to downstream effects)

  We also want to note which positions are indistinguishable by the quiz and which answer patterns are unoccupied (and why).

  Let's design the questions. Each question should have a scenario and answer choices that will help differentiate the positions.

  Question 1: Testing the measurement-skeptic position and the role of occupation mix.
    Scenario: Imagine two countries, Nordia and Sudland. Nordia has higher gender equality (as measured by standard indices) and a higher proportion of women in STEM fields than Sudland. However, in Nordia, the overall index of occupational segregation by gender (like the Duncan index) is also higher. How do you interpret this?
    A) This is the classic gender-equality paradox and suggests that as gender equality increases, women are more free to choose traditionally female-dominated fields.
    B) The higher segregation in Nordia might be because Nordia has a larger service sector with many female-dominated occupations (like nursing) and male-dominated occupations (like engineering), while Sudland has more mixed-gender occupations in agriculture. So the paradox is an artifact of the occupational structure.
    C) This shows that even when women have more opportunities in STEM, they still prefer other fields, which might be due to biological differences.

  Question 2: A thought experiment about a perfectly egalitarian society.
    Scenario: In a future society with complete gender equality in laws, opportunities, and socialization (e.g., children are raised identically regardless of gender), we observe that women are overrepresented in healthcare and education, and men in engineering and construction. What is your take?
    A) This shows that even with perfect equality, inherent biological differences lead to different occupational choices.
    B) This society may have achieved legal equality, but deep-seated cultural norms or adaptive preferences from the past still influence choices.
    C) This outcome is fine because it reflects free choices. The overrepresentation is not a problem as long as there is no discrimination.

  Question 3: A hypothetical finding that would change someone's mind.
    Scenario: Imagine a study comes out next year that would genuinely change your view on the gender-equality paradox. Which of the following would be most compelling to you?
    A) A large-scale study of identical twins raised in different countries shows that in more gender-equal countries, the heritability of occupational preferences is higher.
    B) A natural experiment where a country implemented a policy that successfully eliminated gender stereotypes in media and education, and 20 years later, occupational segregation decreased significantly.
    C) A study showing that in countries with higher gender equality, the occupational choices of recent immigrants (who grew up in less egalitarian countries) converge to the same gendered pattern as the native-born within one generation.

  Question 4: The role of part-time work and care.
    Scenario: Country Egalitaria has high gender equality and extensive parental leave policies. However, after having children, women are much more likely than men to work part-time and choose jobs with flexible hours (often lower-paying). Men rarely do this. What does this indicate?
    A) This is a free choice by women who prefer to care for children, and the policies allow them to do so. It's a sign of progress.
    B) This reflects persistent gender norms that associate women with caregiving. The policies, while well-intentioned, may reinforce these norms.
    C) The structure of the labor market and the lack of affordable childcare alternatives constrain women's choices.

  Question 5: A case about pay and occupational segregation.
    Scenario: In two countries with similar levels of economic development, Country A has low occupational segregation and a small gender pay gap, while Country B has high occupational segregation and a large gender pay gap. What does this tell us?
    A) Occupational segregation is a major driver of the gender pay gap, so reducing segregation should be a policy priority.
    B) The pay gap in Country B might be due to other factors, like discrimination within occupations. The segregation itself is not necessarily the problem if the occupations are equally valued.
    C) This shows that the relationship between segregation and the pay gap is complex and depends on how we value different occupations.

  Question 6: A hypothetical intervention.
    Scenario: A government introduces a policy that successfully removes all structural barriers for women entering male-dominated fields (like bias in hiring, promotion, and access to education). However, the gender composition in these fields does not change much. What do you conclude?
    A) This suggests that the barriers were not the main issue; preferences (whether biological or socialized) are the primary driver.
    B) The policy might have removed formal barriers, but informal barriers (like workplace culture) or adaptive preferences remain.
    C) The policy was insufficient because it didn't address the barriers for men entering female-dominated fields, which also affects the overall segregation.

  Question 7: A finding about changing occupations over time.
    Scenario: In a country with increasing gender equality, we see that women are entering male-dominated fields at higher rates, but at the same time, some previously mixed-gender occupations are becoming more female-dominated (e.g., biology becoming predominantly female). The overall segregation index remains stable. What is the implication?
    A) This shows that gender equality leads to more freedom to choose, but choices are still influenced by gender, so overall segregation doesn't drop.
    B) This is evidence of "occupational tipping" where as women enter a field, men leave, so the overall pattern of segregation persists due to social processes.
    C) The stability of the segregation index suggests that the paradox is overblown; there is change but it doesn't show up in the index.

  Question 8: A case about preferences and constraints.
    Scenario: A survey in a highly egalitarian country finds that both men and women report high levels of job satisfaction, but women are concentrated in lower-paying occupations. What do you make of this?
    A) This indicates that pay is not the only factor in job satisfaction. Women may freely choose occupations that offer other rewards (like flexibility or meaningfulness) even if they pay less.
    B) The satisfaction might be adaptive; women have adjusted their expectations to fit the constraints they face.
    C) The satisfaction is real, but the fact that care work (often done by women) is undervalued and underpaid is a social injustice.

