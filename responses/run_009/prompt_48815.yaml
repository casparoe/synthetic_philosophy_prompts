    A: Lib (1)
    B: Soc (1)
    C: Justice (1)

  Now, for each position, sum the points:

  - Biological (Bio): Q1A, Q2A, Q3A, Q6A (0.5), Q7A (0.5)
  - Socialization (Soc): Q1C, Q2B, Q3B, Q4B, Q6A (0.5), Q6B, Q7A (0.5), Q7B, Q8B
  - Structural (Struct): Q4C, Q6C
  - Measurement skeptic (Meas): Q1B, Q3C, Q7C
  - Preference-satisfaction liberal (Lib): Q2C, Q4A, Q5B, Q8A
  - Justice-critique (Justice): Q5A, Q5C, Q8C

  Note: For Q5, both A and C give a point to Justice.

  Then, the user calculates their score for each position.

  The position with the highest score is their primary alignment.

  But note: we also want to note which positions are often chosen together and which are indistinguishable.

  Caveats:

  1. It is hard to distinguish between Biological and Socialization in some cases (like when an answer says "preferences" without specifying origin). We used partial points for such answers.

  2. The Preference-satisfaction liberal and the Justice-critique are primarily normative and might be chosen along with an explanatory position. For example, a person might score high on Bio and also on Justice, meaning they believe in biological differences but still think the resulting occupational distribution is unjust.

  3. Some positions may not be mutually exclusive. For example, one might believe in both socialization and structural constraints.

  4. The Measurement skeptic position, if held strongly, might make the other explanatory positions irrelevant. But in the quiz, if someone scores high on Meas, they might also have some points on other explanatory positions.

  5. It is unlikely for someone to score high on both Lib and Justice, but possible if they are inconsistent.

  6. We might not have enough questions to separate Struct well; it only appears in Q4C and Q6C.

  7. Also, note that the justice-critique position is not an explanatory position per se, but a normative one. So a person might have an explanatory view (say, Soc) and a normative view (Justice).

  Therefore, we might want to report two leading positions: one explanatory and one normative.

  We can separate the positions into explanatory and normative:

  Explanatory: Bio, Soc, Struct, Meas
  Normative: Lib, Justice

  Then, for each respondent, calculate the score for each explanatory position and each normative position.

  For the explanatory score, we consider only the answers that are about explanation (which are all questions except the purely normative ones). But every question has an explanatory or normative aspect.

  Specifically:

  - Q1: explanatory
  - Q2: A and B are explanatory, C is normative
  - Q3: explanatory (what evidence would change your mind about the explanation)
  - Q4: explanatory (B and C) and normative (A)
  - Q5: normative
  - Q6: explanatory
  - Q7: explanatory
  - Q8: normative

  So:

  For explanatory score: Q1, Q2 (only if they chose A or B; if they chose C, skip), Q3, Q4 (only B and C; if A, skip), Q6, Q7.

  For normative score: Q2 (only if they chose C), Q4 (only if they chose A), Q5, Q8.

  But then we have few normative questions.

  Alternatively, we can score explanatory positions from all questions that have an explanatory answer option, and normative from all that have a normative option.

  And for questions that have both, the answer they choose will contribute to one or the other.

  For instance, in Q2, if they choose A or B, it goes to explanatory; if C, to normative.

  In Q4, if A, normative; if B or C, explanatory.

  In Q5, only normative.

  In Q8, only normative.

  Then, for explanatory, we have: Q1, Q2 (A or B), Q3, Q4 (B or C), Q6, Q7.

  For normative, we have: Q2 (C), Q4 (A), Q5, Q8.

  That's 6 questions for explanatory and 4 for normative.

  Then, within explanatory, we calculate the score for Bio, Soc, Struct, Meas.
  Within normative, we calculate for Lib and Justice.

  Scoring for explanatory:

  Q1: 
    A: Bio (1)
    B: Meas (1)
    C: Soc (1)

  Q2 (only if A or B):
    A: Bio (1)
    B: Soc (1)

  Q3:
    A: Bio (1)
    B: Soc (1)
    C: Meas (1)

  Q4 (only if B or C):
    B: Soc (1)
    C: Struct (1)

  Q6:
    A: Bio (0.5), Soc (0.5)
    B: Soc (1)
    C: Struct (1)

  Q7:
    A: Bio (0.5), Soc (0.5)
    B: Soc (1)
    C: Meas (1)

  For the explanatory dimension, the positions are Bio, Soc, Struct, Meas.
  Sum the points for each.

  For normative:

  Q2 (only if C): C: Lib (1)

  Q4 (only if A): A: Lib (1)

  Q5:
    A: Justice (1)
    B: Lib (1)
    C: Justice (1)

  Q8:
    A: Lib (1)
    B: [Note: Q8B is about adaptive preferences, which is explanatory, not normative. But in the quiz, Q8 is intended to be normative, and B is more explanatory. This is a problem.]

    We need to redesign Q8.

    Revised Q8: 
    Scenario: Same.
    What do you make of this? (focus on normative)
     A) This is unproblematic because it reflects free choices and job satisfaction is high.
     B) This is problematic because the satisfaction might be a result of lowered expectations due to societal pressures.
     C) This is problematic because even if women are satisfied, the systematic underpayment of female-dominated occupations is unjust.

    Then:
     A: Lib (1)
     B: Justice (1) [because it's critique]
     C: Justice (1)

    But B is more about adaptive preferences (explanatory) but also implies a critique.

    Alternatively, we can leave Q8 as is and in the normative scoring, use only A and C for normative.

    In Q8, if they choose B, it doesn't give a normative score, but it does give an explanatory one (Soc). But we are not using Q8 in explanatory scoring.

    To simplify, let's include Q8 in normative scoring for A and C:

    A: Lib (1)
    C: Justice (1)

    And if they choose B, then it doesn't count for normative, but it is still an answer we score for explanatory in Soc.

    But in the quiz, Q8 is only used for normative scoring if they choose A or C.

    Now, for normative scoring:

    Q2C: Lib (1)
    Q4A: Lib (1)
    Q5A: Justice (1)
    Q5B: Lib (1)
    Q5C: Justice (1)
    Q8A: Lib (1)
    Q8C: Justice (1)

    So if a person chooses:
      Q2C: Lib +1
      Q4A: Lib +1
      Q5A: Justice +1
      Q8A: Lib +1

    Then their Lib score is 3, Justice is 1.

    But note: they might have chosen Q5A which is justice, but also Lib in others.

    We can report the primary normative position as the one with the highest score.

  Caveats section:

  1. Biological explanation and Preference-satisfaction liberal are not the same, but they are often aligned. However, in this quiz, it is possible to have a high Biological score and a high Justice score, meaning you think the differences are innate but the resulting distribution is unjust.

  2. The Structural explanation is only tested in two questions (Q4C and Q6C), so it might be underrepresented.

  3. The Measurement skeptic position is tested in three questions (Q1B, Q3C, Q7C).

  4. It is unlikely to have high scores in both Measurement and other explanatory positions because they are somewhat exclusive.

  5. It is possible to have a high score in both Socialization and Structural constraints, as they are compatible.

  6. The Justice-critique position doesn't specify the cause, so it can be held with any explanatory position.

  7. The quiz might not distinguish between the justice-critique that focuses on integration and the one that focuses on valuation (as in Q5).

  8. The answer patterns that are unlikely or incoherent:
     - High Measurement and high any other explanatory position: because if you think the paradox is an artifact, you wouldn't need other explanations for it.
     - High Biological and high Structural: because structural constraints are environmental, while biological is innate. They are not mutually exclusive but might be in tension.

  But note: one could believe that there is a biological basis AND structural constraints that amplify the differences.

  9. The combo of high Struct and high Lib is unlikely because if you believe there are structural constraints, then the choices are not entirely free.

  This is a simplified quiz for group discussion. The goal is to prompt reflection on how group members' views vary along these dimensions.

