  For example, if the exam is given on a random day, students might not be able to predict which day, so it can be a surprise each time.

  The paradox arises only if students take the announcement seriously and try to reason.

  If they ignore the announcement, they can be surprised.

  But with the reasoning, they get into trouble.

  Marcus's view allows for surprise exams to be possible, which matches reality.

  Dara's view makes the surprise seem impossible logically, but it happens, so her view has a problem.

  Marcus replies that on Dara's view, the surprise is a miracle, meaning inexplicable, but on his view, it's understandable.

  I think Marcus comes out ahead.

  Now, anything both overlooked? Both might overlook that the paradox can be resolved in formal epistemic logic by showing that the announcement cannot be common knowledge or something. But in this debate, they touched on it.

  The key point is that the students' reasoning assumes that the announcement will still be believed on each day, but the act of reasoning changes that belief.

  In logical terms, the deduction of impossibility relies on the announcement being true, but if the announcement is true, the deduction shows it can't be, contradiction, so the announcement must be false or the reasoning flawed.

