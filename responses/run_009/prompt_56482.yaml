  ### Adjudication of the Exchange

  The surprise examination paradox involves a self-referential and epistemic element, where the teacher's announcement ("there will be one exam next week, and you will not know on the morning of the exam that it is that day") refers to the students' future knowledge states, which are influenced by the announcement itself. This creates a loop that undermines the students' reasoning. Below, I assess each of the six moves in the exchange between Dara and Marcus, providing a rating and brief justification for each. Ratings are: "correct," "mistaken," or "correct about something while missing something else." After evaluating the moves, I determine who comes out ahead overall and identify aspects both debaters overlooked.

  ---

  ### Move-by-Move Assessment

  #### **Move (1): Dara**  
  *Dara: The argument is just modus tollens applied five times. If the announcement is true — one exam next week, no advance knowledge — then Friday is impossible, and every subsequent elimination is exactly as valid. So either the announcement is false or the exam cannot be a surprise. That is airtight.*  
  - **Rating:** Mistaken  
  - **Justification:** Dara correctly identifies the structure of the elimination argument as a chain of modus tollens inferences. However, she overlooks the self-referential and dynamic nature of the announcement. The announcement's truth depends on the students' knowledge, which is altered by the reasoning process itself. For example, when students eliminate Friday, they do so by assuming the announcement is true, but this very assumption, when applied repeatedly, undermines the announcement's credibility. Thus, the argument is not "airtight" because it treats the announcement as a static, ordinary premise, ignoring how the epistemic content ("you will not know") interacts with the students' deductions. Modus tollens requires stable premises, but here the premise is unstable due to self-reference.

  #### **Move (2): Marcus**  
  *Marcus: The Friday step is special. On Thursday evening the students can eliminate Friday only if they still trust that an exam is coming that week. But once they have run the elimination argument, they no longer trust that. So when you try to eliminate Thursday — "if we reach Thursday morning, we would know it has to be today" — the "we would know" fails, because the premise that the exam must still be coming has been undermined by their own earlier reasoning.*  
  - **Rating:** Correct  
  - **Justification:** Marcus accurately highlights that the elimination argument depends on the students' evolving epistemic state, not just pure logic. The Friday elimination (and subsequent days) requires students to trust the announcement at each step. However, after running the argument, students doubt the announcement's truth (e.g., they conclude no surprise exam is possible), so on Thursday evening, they may not believe the exam must still come. This distrust prevents them from "knowing" the exam is on Thursday or Friday, allowing for surprise. Marcus correctly identifies that the reasoning process dynamically affects the knowledge condition in the announcement.

  #### **Move (3): Dara**  
  *Dara: That confuses the students' psychology with the logic. The announcement is a proposition about how the week will go, and if it is true, it has its logical consequences whether or not the students feel confident at each stage. What they would "trust" is beside the point.*  
  - **Rating:** Mistaken  
  - **Justification:** Dara is correct that the announcement is a proposition about future events, but she misses that it is not an "ordinary" proposition. The phrase "you will not know" makes it epistemic—it refers to the students' future mental states, which are influenced by their beliefs, reasoning, and the announcement itself. Thus, the truth of the announcement depends on psychology (or epistemology) because "knowing" involves belief and justification. Ignoring this reduces the announcement to a purely factual claim like "it will rain," which it is not. The students' trust is not "beside the point"; it is central to evaluating whether "you will not know" holds.

  #### **Move (4): Marcus**  
  *Marcus: It is not beside the point, because "you will not know which day" is not an ordinary proposition about the world. Its truth depends on what the students will know, and what they will know depends on the deductions they make — including deductions drawn from this very announcement. It is closer to "you will never believe this announcement" than to "it will rain on Wednesday." A sentence of that kind can be perfectly true while being impossible for its audience to accept.*  
  - **Rating:** Correct  
  - **Justification:** Marcus is correct that the announcement is self-referential and resembles a Moorean paradox (e.g., "It is raining but I don't believe it"). Such statements can be true but cannot be consistently believed or known by the audience without contradiction. Here, if students accept the announcement, they deduce that no surprise exam is possible, contradicting the announcement. However, if they do not accept it, the announcement can be true (as when the exam occurs on Wednesday and surprises them). Marcus properly distinguishes this from ordinary propositions and shows why the announcement's truth depends on the students' deductions.

  #### **Move (5): Dara**  
  *Dara: Even granting all that, look at the outcome: the exam was Wednesday, and the students were surprised. The announcement was true and their conclusion — no surprise exam is possible — was false. A sound argument cannot have true premises and a false conclusion, so whatever the announcement's peculiar status, the students' reasoning somewhere failed as reasoning, not merely as psychology.*  
  - **Rating:** Correct about something while missing something else  
  - **Justification:** Dara is right that the actual outcome (students surprised on Wednesday) demonstrates a flaw in the reasoning, as a sound argument with true premises cannot yield a false conclusion. However, she misses that the flaw is not in the formal logic (e.g., modus tollens) but in how the premises are applied. The premises include the announcement and the students' assumptions about their future knowledge, but these are not "true" in a static sense due to self-reference. The reasoning fails because it treats the announcement as an ordinary premise when it is not, leading to an inconsistent set of beliefs. Dara correctly identifies a failure but attributes it to reasoning alone, ignoring that the failure stems from the announcement's peculiar status, as Marcus argues.

  #### **Move (6): Marcus**  
  *Marcus: Which is exactly why the elimination argument cannot be sound. "The announcement is true" is not a premise the students can coherently add to what they know; accepting it is what generates the contradiction. I would say the announcement is true but unknowable to them, in the way "it is raining but you don't believe it" can be true while being something you can never know. The mistake is treating a heard and accepted announcement as just another ordinary premise.*  
  - **Rating:** Correct  
  - **Justification:** Marcus correctly diagnoses the core issue: the announcement cannot be coherently accepted as a premise because doing so generates a contradiction (as seen in the elimination argument). The announcement is "unknowable" to the students in the sense that they cannot consistently believe it while it remains true—similar to Moorean sentences. By treating it as an ordinary premise, the students create a self-defeating loop. Marcus's point resolves the paradox: the announcement can be true (as in the Wednesday exam), but the students' attempt to use it in deduction undermines its credibility, allowing surprise.

  ---

  ### Overall Outcome
  - **Who comes out ahead:** Marcus wins the exchange.  
    - **Reasoning:** Marcus consistently addresses the self-referential and epistemic nature of the announcement, which is key to the paradox. He shows that the elimination argument fails because the announcement cannot be treated as a stable premise—it interacts with the students' reasoning in a way that creates inconsistency. By contrast, Dara relies on a static, non-epistemic view of logic, which cannot accommodate the dynamic relationship between the announcement and the students' knowledge states. Marcus's arguments (moves 2, 4, and 6) are correct and build a coherent resolution: the announcement is true but not usable as a deductive premise without contradiction. Dara's strongest point (move 5) is valid in highlighting the reasoning's failure but does not refute Marcus's core insight about the announcement's status.

  ### What Both Overlooked
  - **Shared oversight:** Both Dara and Marcus focus on the students' reasoning and the announcement's truth but overlook the role of **common knowledge** and **temporal context** in formalizing the paradox.  
    - **Common knowledge:** In epistemic logic, the paradox arises only if the announcement is common knowledge (students know it, know that others know it, and so on). If the announcement is not common knowledge, or if students doubt its credibility from the start, the elimination argument may not fully form, allowing for surprise. Both debaters imply this but do not explicitly explore how common knowledge assumptions enable the self-defeating reasoning.
    - **Temporal context:** The elimination argument treats the week as a fixed sequence, but each day's reasoning depends on the students' state at that time. For instance, on Wednesday morning, students may not have actively reasoned about that specific day yet, so surprise is possible even if they previously doubted the announcement. Marcus touches on this but does not develop how real-world reasoning is stepwise and imperfect, not a single, complete deduction.  
    **Resolution implication:** A teacher can repeatedly announce surprise exams because, without common knowledge or perfect reasoning, students can always be surprised on some day. This addresses Dara's closing objection—it is "convenient" but possible due to human limitations, not a logical flaw in the announcement itself. Marcus's reply about the "miracle" on Dara's view is apt: without the epistemic element, the surprise seems inexplicable, whereas Marcus's account makes it foreseeable.
