answer: |-
  Consider a municipal housing allocation scheme in a prosperous city. The city owns several high-quality apartment buildings reserved exclusively for long-term municipal employees – teachers, sanitation workers, librarians – who pay deeply subsidized rents based on a fixed percentage of their municipal salary. These units are highly desirable, offering stability and affordability impossible to find on the open market. The scheme operates under a strict covenant: occupancy is a conditional benefit of municipal employment; lose the job, lose the apartment. Vacancies occur periodically due to retirements or resignations. A significant waiting list exists among current municipal employees who qualify under the program's rules but lack housing. Simultaneously, a growing population of desperately poor non-employees – the working poor, disabled individuals, undocumented migrants – faces severe homelessness due to soaring market rents and inadequate social housing. They petition the city council, pleading to open the vacant municipal units to the neediest residents, regardless of employment status, arguing the empty apartments constitute wasted resources amidst a crisis. The council, supported by the municipal unions, refuses. They argue the units are part of a specific compensation package integral to attracting and retaining vital public servants; opening them to non-employees, even temporarily, violates the foundational agreement, erodes the scheme’s value as an employment incentive, and fundamentally alters its purpose. The vacant units remain empty while qualified municipal workers wait and the non-employee homeless remain unsheltered. Exclusion here persists despite spare physical capacity; the boundary drawn around the employee group is paramount.

  Now, envision the intensive care unit (ICU) of a major public hospital during a sudden, overwhelming epidemic surge – perhaps a novel respiratory virus. The unit has 20 beds equipped with specialized ventilators and round-the-clock critical care nursing. Admission is strictly governed by immediate medical need and triage protocols focused solely on maximizing survival with the available resources. At a given moment, 18 beds are occupied by gravely ill patients whose lives depend on ICU care. Two beds are technically vacant but operationally reserved: one requires imminent decontamination after a complex case, the other’s ventilator is undergoing urgent, but expectedly brief, calibration. Triage nurses assess incoming ambulances: critically ill patients arrive faster than discharges or deaths occur. The next two patients brought in both require immediate ICU admission to survive. The triage officer faces a brutal choice: admitting both would overload the nursing staff (already stretched thin) and prevent the reserved beds from being prepared for imminent use, potentially compromising care for all 20 current and future patients. Based on established surge protocols prioritizing overall unit functionality and maximizing total lives saved, the officer must select only one patient for admission (perhaps based on marginally better prognosis or younger age), knowing the other will likely die without this level of care. Here, exclusion is mandated solely by the genuine, immediate capacity constraint – the physical and staffing limitations preventing safe and effective care for more than 18 patients at this precise moment. No prior claim exists; the current occupants gained access solely through the same triage logic minutes or hours before. Their "occupancy" confers no special right beyond the medical resources currently sustaining them; their place is held only by the ongoing necessity of the care itself.

  Diagnostically, these scenarios tease apart Hardin's bundled logic. The Hardin-style position, emphasizing the lifeboat's finite resources *and* the pre-existing right of the occupants, will endorse exclusion in *both* cases. In the housing scenario, the existing employees’ contractual and contributory claim to the benefit (the boundary) justifies reserving the vacant units for future employees, even amidst wider desperate need and empty apartments. In the ICU, the absolute capacity constraint justifies the triage decision to exclude the second patient, preserving the unit's ability to function and save the maximum number within its physical limits. The boundary here is less about individual tenure and more about the unit’s operational integrity as a life-saving system – a system whose "full" capacity (20 beds) is defined by its functional ability to deliver care, not merely physical space.

  The straightforward act utilitarian, focused solely on maximizing aggregate welfare or lives saved in the immediate instance, will diverge sharply. In the housing case, the utilitarian sees empty apartments and desperate people. Providing shelter to the non-employees would alleviate immense suffering at minimal cost (the vacant units are unused, the scheme’s future incentive value is a secondary, less certain harm). Exclusion, therefore, seems indefensibly wasteful. The utilitarian rejects the boundary claim. In the ICU scenario, however, the utilitarian concurs with exclusion. Admitting the second patient demonstrably risks worse outcomes for more people – potentially causing more deaths through system overload. The capacity constraint is real, immediate, and the utilitarian calculus demands maximizing lives saved within that constraint, even through exclusionary triage.

  The egalitarian, denying that prior occupancy inherently creates a stronger claim than need, will likely oppose exclusion in *both* scenarios. For housing, the egalitarian sees the vacant units as collective social resources. The boundary drawn around municipal employees is seen as arbitrary and unjustified when weighed against the life-threatening needs of others. Need, not prior employment status, should govern allocation. The existence of vacancies makes the exclusion purely boundary-driven and thus unjust. In the ICU, the egalitarian faces a starker conflict. While rejecting any inherent claim of the existing patients *beyond* their current medical need, the egalitarian might still accept the triage decision *if* it demonstrably maximizes survival chances under genuine scarcity. However, they would demand the triage protocol itself be rigorously scrutinized for bias and ensure the exclusion isn't masking an unjust boundary. If the "reserved" beds seemed like an artificial constraint or the triage criteria inequitable, the egalitarian might challenge the exclusion even here. Primarily, they reject the *moral legitimacy* of the boundary, not necessarily the reality of physical limits when truly binding.

  Modifying the scenarios reveals the core driver. *Filling the spare seats in Housing:* If the city council relented and housed the homeless non-employees in the vacant units, the Hardin position collapses logically. The capacity constraint was illusory; exclusion rested *entirely* on defending the employee boundary as inviolable. The utilitarian is vindicated, the egalitarian satisfied (for now). *Granting Tenure in the ICU:* Imagine the existing ICU patients were long-term residents with a guaranteed "right" to their bed until discharge, regardless of changing acuity or the influx of needier patients. Suddenly, the scenario shifts. The two "reserved" beds might still exist, but the triage officer might also be compelled to keep a bed open for a stable patient whose "tenure" guarantees it, even while a new arrival dies without it. Exclusion would now rest partly on this artificial boundary claim ("this bed *belongs* to Patient X"), potentially overriding the pure triage logic that would prioritize the sickest patient regardless of arrival time. The Hardin position might now justify exclusion based on this tenure, even if the *operational* capacity wasn't the primary constraint. The utilitarian and egalitarian would likely revolt against this, seeing the tenure boundary as introducing lethal inefficiency and injustice.

  Faced with the pure triage ICU scenario, the Hardin defender's strongest counterattack is indeed to argue that *without stable boundaries, the concept of "capacity" becomes incoherent*. Who defines what the ICU's capacity is? Is it 20 physical beds? Or 18 functional beds during surge decontamination/calibration? Or the number sustainable by the *current* exhausted staff? If anyone in need has an equal claim, then "full" loses meaning. The system's ability to function at all – to maintain hygiene, staffing ratios, equipment readiness – depends on defining a membership (those currently receiving care within the system's operational limits) and managing flow *across* a boundary (admission/discharge). If the boundary is dissolved, the system collapses, helping no one. The triage decision itself *implies* a boundary: those inside the unit receiving care are prioritized to maintain the unit's function, which in turn allows saving the maximum number over time. The defender argues that even in pure triage, a functional boundary (the ICU itself as a defined system) is logically necessary to make the capacity constraint meaningful and the life-saving function possible. This shifts the argument from individual ownership to the necessity of system integrity and membership rules for any sustainable resource management, attempting to ground the exclusionary conclusion in a deeper operational logic inherent to managing scarcity.

  This dissection illuminates real-world debates. When arguments against aiding refugees cite "overburdened systems," are they describing a genuine, immediate physical impossibility (like the ICU at surge capacity), or defending a pre-existing national boundary against claims of need (like the housing scheme vacancies), using the *language* of capacity to mask a boundary claim? Recognizing which component – the hard arithmetic of genuine, immediate constraint, or the contested morality of the pre-existing boundary – is doing the persuasive heavy lifting is crucial for clear ethical and political analysis. Often, the lifeboat metaphor smuggles in the boundary claim under the cover of indisputable scarcity. These scenarios help unsmuggle it.
