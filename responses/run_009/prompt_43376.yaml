  The argument has six steps:

  (1) If I know that p, then I am entitled to be sure that p.

  (2) If I am entitled to be sure that p, then I am entitled to disregard any future evidence against p as misleading, without investigating it.

  (3) I know some ordinary things, e.g., that the test suite was passing on Friday.

  (4) Therefore, I am entitled to disregard any future evidence against that knowledge.

  (5) This generalizes to any knowledge.

  (6) Conclusion: When you know something, you're entitled never to investigate contrary evidence or revise the belief.

  The user finds the conclusion absurd because it undermines evidence-based practices like incident reviews. They want to keep (3) – that we know ordinary things – and avoid skepticism.

  First, I should check if the argument is valid. Validity means that if the premises are true, the conclusion must be true.

  - (1) seems plausible: knowledge implies justification and certainty.

  - (2) is key: if you're entitled to be sure, you can disregard counterevidence.

  - (3) is an instance of ordinary knowledge.

  - (4) follows from (1)-(3).

  - (5) extends it.

  - (6) is the generalization.

  The inference from (1) to (4) and then to (6) seems logically valid if we accept the premises. But there might be equivocation or hidden assumptions.

  Now, the user suspects that (2) is the problematic premise. Let me examine each premise.

  **Premise (1): If I know that p, then I am entitled to be sure that p.**

  This is a common idea in epistemology. Knowledge is often thought to imply epistemic certainty or at least a high degree of justification. "Entitled to be sure" might mean that one has a right to be confident, not necessarily infallible. In fallibilist theories, knowledge doesn't require absolute certainty; it can be less than certain but still justified true belief. However, the premise says "entitled to be sure," which could be interpreted as having sufficient justification to dismiss doubts.

  In this context, "sure" might mean beyond reasonable doubt, not absolute certainty. For ordinary knowledge, we often act as if we're sure. So (1) might be acceptable for many cases.

  **Premise (2): If I am entitled to be sure that p, then I am entitled to disregard any future evidence against p as misleading, without investigating it.**

  This is where the paradox bites. If p is settled, any counterevidence must be mistaken, so you can ignore it. But this seems wrong because new evidence could genuinely undermine your knowledge.

  For example, if I'm sure the tests passed, but then I see a red CI dashboard, I should investigate – it might be that something broke after I left, or there's an error.

  The premise assumes that being entitled to be sure means that p is incorrigible or that counterevidence is impossible, which isn't true for empirical knowledge. Knowledge can be defeasible.

  So, (2) might be the weak point.

  **Premise (3): I know some ordinary things.**

  This seems hard to deny. If we reject this, we fall into skepticism, saying we don't know ordinary things, which is counterintuitive and impractical.

  The user wants to keep this, and I agree it's desirable.

  **Steps (4) to (6) follow if (1)-(3) are accepted.**

  Now, the conclusion (6) says that for anything you know, you're entitled never to investigate contrary evidence and never revise the belief. But this conflicts with rational belief revision.

  The user's teammate says this shows that belief revision implies we never knew, but that might not be right.

  Philosophers have responses to the dogmatism paradox. One common response is to reject (2), arguing that even if you know p, you might not be entitled to disregard counterevidence because your knowledge could be defeated.

  Another response is to distinguish between different kinds of evidence or contexts.

  Let me brainstorm the live options for rejecting each premise.

  **Rejecting (1): If I know that p, then I am entitled to be sure that p.**

  - What would this cost? It might mean that knowledge doesn't imply certainty or even strong justification. But in epistemology, knowledge typically requires justification. If we say knowledge doesn't entitle you to be sure, then what is knowledge? It could lead to a view where knowledge is fallible and revisable, but still, we say we know things.

  - For the doctor: If the doctor doesn't know with certainty, she might still act on her belief but be open to new evidence. But we want doctors to be confident in their diagnoses when they know them.

  - For the scientist: Scientists often hold theories tentatively, but if they know something, it should be firm.

  Rejecting (1) might align with fallibilism, where knowledge is compatible with the possibility of error. But then, in what sense do you "know" if you're not sure?

  Cost: It could make knowledge less robust, and we might hesitate to claim knowledge in ordinary cases.

  **Rejecting (2): If I am entitled to be sure that p, then I am entitled to disregard future evidence.**

  - This seems more promising. Even if you're entitled to be sure, new evidence could undermine that entitlement. Being sure doesn't mean you're infallible; it means that based on current evidence, p is highly probable. But if new evidence comes in, you need to reassess.

  - Disregarding evidence without investigation is dogmatic and irrational. Rational agents should be open to counterevidence, even for things they know, because knowledge isn't absolute.

  - For the doctor: She knows the patient has condition X, but new symptoms appear. She shouldn't disregard them; she should investigate to confirm or revise the diagnosis. It might be a new condition or complication.

  - For the scientist: If anomalous data comes in, she should examine it; it might lead to a better theory or show an error.

  Cost: If we reject (2), we need to explain why being entitled to be sure doesn't allow disregarding counterevidence. It might involve a theory of defeasible justification.

  This is common in epistemology. For example, in Bayesian updating, even with high prior probability, you update on new evidence.

  Another cost: It might suggest that knowledge isn't as secure as we think, but it doesn't lead to skepticism.

  **Rejecting (3): I know some ordinary things.**

  - This leads to skepticism. If we don't know that the tests passed, for instance, then we can't claim knowledge in daily life. This seems too high a price; it makes epistemology disconnected from practice.

  - For the doctor, if she never knows diagnoses, she might always be uncertain, which isn't practical.

  - Similarly for the scientist.

  The user wants to avoid this, and it's generally undesirable unless there's a good reason.

  Now, about equivocation or hidden assumptions.

  Look at premise (2): "entitled to disregard any future evidence against p as misleading, without investigating it."

  The key term is "entitled." What does "entitled" mean? Epistemically permitted? Or obligated?

  In the argument, it's used to say that you can ignore evidence, but in rational inquiry, you might have a duty to consider evidence.

  Also, "misleading" – evidence could be misleading, but it might not be; it could be genuine counterevidence.

  Another point: When you know p, and new evidence E against p appears, if E were true, then p would be false, and you wouldn't have known p. But since you know p, E must be false or misleading. So, in a way, you're entitled to think E is misleading.

  However, you don't know that E is misleading; you might need to investigate to determine that.

  For instance, if I know the tests passed, and I see a red CI, it could be that the CI is broken or that something happened after I left. I need to check.

  So, the entitlement doesn't mean I shouldn't investigate; it means that, all things considered, p is true, but I might need to resolve the apparent conflict.

  But premise (2) says "disregard without investigating," which is strong.

  Perhaps there's an equivocation on "entitled."

  In (1), "entitled to be sure" might mean epistemically justified in believing p.

  In (2), "entitled to disregard" might mean permitted to ignore, but in practice, disregarding without investigation might not be rational if the evidence is salient.

  A hidden assumption might be that knowledge is infallible or that justification is indefeasible.

  But in modern epistemology, justification is often defeasible.

  So, rejecting (2) seems best.

  Now, for the verdict.

  The argument is valid: if (1), (2), and (3) are true, then (6) follows.

  But (6) is implausible, so we should reject one premise.

  Rejecting (2) has the least cost.

  If we reject (2), we can say: even if you know p and are entitled to be sure, you are not entitled to disregard future evidence without investigation because new evidence could defeat your knowledge or show that you were wrong.

  In cases where you do know, investigating counterevidence might confirm your knowledge or reveal errors in the evidence.

  For example, the doctor investigates new symptoms and finds they're unrelated or due to another cause, strengthening the original diagnosis.

  Similarly, in software, if you see a red CI, you investigate and find a deployment issue, not a test failure, so you learn more.

  Rejecting (2) allows for rational belief revision without denying knowledge.

  Rejecting (1) might lead to a weaker notion of knowledge.

  Rejecting (3) leads to skepticism.

  So, I think rejecting (2) is the way to go.

  The user mentioned that some philosophers accept something close to the conclusion. For example, some forms of infallibilism or contextualism might handle it differently, but for practical purposes, rejecting (2) is straightforward.

  In contextualism, the standards for knowledge might shift, so in a low-standards context, you know, but when counterevidence arises, standards increase, and you no longer know, so you must investigate. But this might be complex to explain.

  For this user, a direct rejection of (2) is better.

  Final verdict: The argument is valid, but premise (2) should be rejected.
