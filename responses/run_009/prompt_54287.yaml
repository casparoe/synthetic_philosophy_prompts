  ### The Verdict: Residue Source & Missing Concepts  
  **Primary Source**: Your vocabulary lacks tools for **epistemic agency, social context, and narrative cognition**. Philosophers aren't *just* evaluating hypotheses—they're analyzing:  
  - **Belief practices**: How people *use* evidence (e.g., self-sealing as a dialectical move)  
