    - **Untranslatable**:  
      - The **rhetorical function**: Self-sealing isn't just poor modeling—it's a *persuasive tactic* to immunize beliefs against counterarguments. Statistics has no analogue for *epistemic defense mechanisms*.  

  ### 3. Conspiracy vs. Conspiracy Theorizing (as Disposition)  
