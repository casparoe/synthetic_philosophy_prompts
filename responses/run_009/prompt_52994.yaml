    But in this case, the demon's action in the work extraction step is not based on the measurement in the wrong case: in the wrong case, the demon attached the weight to the empty side and nothing happened, but then later during reset we extract work by expanding the gas to the whole state. This work extraction during reset is done without using the memory, so it is not due to the demon's measurement.

