prompt: |-
  I teach an upper-level philosophy of science course and I'm writing the take-home final. Write me one essay question (about 900 words expected from students) on structural realism, but it can't be one they can answer by just replaying the Fresnel-Maxwell story and Worrall's point about retaining structure. Here's the angle I want: give them a toy pair of rival theories, T1 and T2, that posit exactly the same relational structure — same equations, same state space, same relations among all the quantities — but disagree about the intrinsic nature of the things standing in those relations. T1 says the relata are lumps of a continuous medium, T2 says the medium is a useful fiction and only the relational facts are really there. Students have to address: (1) whether epistemic structural realism gives us any grounds at all for preferring one of these over the other, (2) whether that result shows ESR is too weak to be interesting or is actually exactly the right amount of modesty, and (3) how the case bears on the Newman objection — the worry that if all you commit yourself to is structure, then any hypothesis with the right cardinality of objects can instantiate that structure, so structural realism collapses into something nearly trivial. I want the question, a model answer of around 600 words, and a marking scheme out of 25 points naming the must-hit moves, with a line or so on what seperates an A answer from a B answer and the specific mistake students typically make on each part. Please write everything in American English.
reasoning: |-
  We are creating an essay question that moves beyond the typical Fresnel-Maxwell example and Worrall's structural continuity. The question will present two rival theories, T1 and T2, which share the same relational structure but differ on the intrinsic nature of the relata. The student must address three specific points.

  Essay Question:

  "Consider two rival physical theories, T1 and T2, that describe the behavior of a system. Both theories posit the same mathematical structure: they use the same equations, the same state space, and the same relations among all the quantities. However, they disagree fundamentally about the intrinsic nature of the entities that stand in these relations. Theory T1 asserts that the system is composed of a continuous medium (like an ether) that fills space and is the bearer of the properties and relations described by the structure. Theory T2, on the other hand, denies the existence of any such continuous medium and instead claims that the relational structure is all that exists; the medium is merely a useful fiction for calculation and visualization, but the fundamental ontology consists only of the relations without any intrinsic bearers.

  In an essay of approximately 900 words, address the following:

  1. Does epistemic structural realism (ESR) provide any grounds for preferring one of these theories (T1 or T2) over the other? Explain why or why not, drawing on the commitments of ESR.

  2. Does the result you've argued for in part (1) show that ESR is too weak to be an interesting or viable position in the philosophy of science (because it cannot decide between such rival theories) or does it show that ESR is appropriately modest (by correctly recognizing the limits of our epistemic access)? Defend your answer.

  3. How does this case bear on the Newman objection? Recall that the Newman objection (raised against Russell's structuralism) claims that if a theory commits only to the existence of a structure (i.e., a set of objects with certain relations holding among them) then the theory is trivially satisfied by any set of objects of the right cardinality, provided that we can define the relations appropriately on that set. Does the scenario of T1 and T2 illustrate a similar triviality threat for ESR? Why or why not?"

  Model Answer (approx. 600 words):

  Epistemic structural realism (ESR) holds that all we can know about the unobservable world is its structure, i.e., the relations that hold among entities, and not the intrinsic properties of those entities. In the case of T1 and T2, both theories agree on the entire relational structure: they have the same equations, state space, and relations. Therefore, according to ESR, we cannot have any knowledge that would allow us to choose between T1's claim that there is a continuous medium (with intrinsic properties) that bears these relations and T2's claim that there are no intrinsic properties and that the structure is all that exists. ESR, by its very definition, withholds judgment on the intrinsic nature of the relata. Thus, ESR provides no grounds for preferring T1 over T2 or vice versa (part 1).

  This result does not show that ESR is too weak; rather, it is a virtue of the position that it correctly reflects the limits of our scientific knowledge. The structural realist argues that science gives us access to the structure of the world but not to the underlying natures. In cases like T1 and T2, where the structure is identical, science simply does not have the resources to decide between them. Any choice would have to be based on metaphysical or aesthetic considerations (e.g., preference for a sparse ontology) that go beyond what science can justify. Therefore, ESR's modesty is appropriate: it acknowledges that science cannot answer every question about the unobservable, especially when theories are structurally equivalent but ontologically divergent (part 2).

  The Newman objection poses a challenge to structural realism by suggesting that if a theory is only about the existence of a structure (with the right cardinality of objects and relations defined on them), then it becomes trivially true provided there are enough objects. In our case, T1 and T2 both describe the same structure. However, note that the Newman objection is typically aimed at ontic structural realism (OSR) or a structuralist metaphysics. ESR, being epistemic, does not necessarily make a commitment to the structure being the whole of reality. Instead, it says that we can only know the structure. The case of T1 and T2 does not exactly mirror the Newman objection because the issue here is not about the trivial satisfaction of a structural description (both theories are about the same structure, so they are equally satisfied by the same structural facts) but about the interpretation of what underlies the structure.

  However, this case does highlight a related problem for ESR: if the structure is all we can know, and if multiple interpretations of the underlying ontology are compatible with that structure, then our knowledge is limited to the structure and we cannot rule out any interpretation that fits. This does not lead to triviality in the same way as the Newman objection (because the structure is not trivialized by arbitrary interpretations; it is a specific structure that is supported by evidence) but it does show that ESR is compatible with multiple metaphysical interpretations. The Newman objection is about the underdetermination of theories by the world due to the ease of satisfying structural descriptions, whereas in T1 and T2, the underdetermination is between two specific interpretations of the same structure. The latter is a more robust underdetermination because both theories are empirically equivalent and structurally identical, so no evidence can break the tie. This is a challenge for ESR because it shows that even with full structural knowledge, we are left with ontological indeterminacy. But it does not collapse into triviality because the structure itself is non-trivial and constrained by empirical data (part 3).

  Marking Scheme (out of 25 points):

  Part 1 (8 points):
  - Must-hit moves: 
    - Clearly state that ESR does not provide grounds for preferring either theory (2 points).
    - Explain that ESR only commits to knowledge of structure and not intrinsic natures (3 points).
    - Relate this specifically to the case: T1 and T2 have the same structure but different intrinsic claims, so ESR is silent (3 points).
  - Common mistake: Students might think that because T2 avoids positing a medium (which might be considered an unobservable) it is more aligned with ESR. This is incorrect because ESR is about what we can know, not about ontological parsimony. ESR does not say we should only believe in structure; it says we cannot know the intrinsic properties, so we cannot choose based on that.
  - A vs. B: An A answer will clearly articulate the epistemic limitation and not conflate ESR with OSR. A B answer might get the conclusion right but not fully explain why ESR leads to that conclusion.

  Part 2 (8 points):
  - Must-hit moves:
    - Argue that the result in part 1 is a strength (modesty) or a weakness (inability to decide) and defend the chosen position (4 points).
    - Explain why modesty is appropriate (if defending) or why the inability to decide is a problem (if criticizing) (2 points).
    - Discuss the implications for the scope of scientific knowledge (2 points).
  - Common mistake: Students might simply restate that ESR is modest without engaging with the alternative (that it is too weak). Or they might switch to OSR without realizing it.
  - A vs. B: An A answer will present a balanced defense (even if taking one side) and engage with the philosophical implications. A B answer might be one-sided without considering counterarguments or might not connect the modesty appropriately to the case.

  Part 3 (9 points):
  - Must-hit moves:
    - Explain the Newman objection (3 points).
    - Discuss how the case of T1 and T2 relates to it: it does not exactly replicate the Newman objection but shows a different kind of underdetermination (3 points).
    - Evaluate whether the case leads to triviality (conclude that it does not, but it shows ontological indeterminacy) (3 points).
  - Common mistake: Students might conflate the Newman objection with the underdetermination in T1/T2, or they might think that because the structure is the same, the Newman objection directly applies and makes ESR trivial. But the Newman objection is about the ease of satisfying a structural description, whereas in T1/T2 the structure is fixed and empirically supported, and the issue is about the interpretation of the nodes.
  - A vs. B: An A answer will clearly distinguish the Newman objection from the T1/T2 case and avoid conflating them, while a B answer might see them as the same and not appreciate the nuances.

  Overall, the essay should be well-structured and address each part. The model answer is approximately 600 words, so the student's 900-word essay should allow for more development and examples.

  Note: The model answer takes a position on part 2 (that modesty is appropriate) but the student could argue either way as long as they defend it. The marking scheme should allow for either position if well-argued.
answer: |-
  ### Essay Question  
  **Instructions:** Write an essay of approximately 900 words addressing the following scenario and prompts.  

  **Scenario:**  
  Consider two rival theories, **T1** and **T2**, both describing the same physical system.  
  - **T1** posits that the system consists of a **continuous medium** (e.g., an ether-like substance) filling space. The medium has intrinsic properties (e.g., elasticity or density), and the relational structure (equations, state space, relations among quantities) arises from these intrinsic features.  
  - **T2** denies the existence of any intrinsic medium. It claims the relational structure (identical to T1’s equations, state space, and relations) is fundamental. The "medium" is a *useful fiction* for calculation, but only the relational facts (e.g., patterns in energy transfer) exist.  

  Crucially, T1 and T2 agree on *all* observable predictions and mathematical structure but disagree *only* on the intrinsic nature of the entities in the structure.  

  **Prompts:**  
  1. **Epistemic Grounds**: Does epistemic structural realism (ESR) provide any epistemic grounds to prefer T1 over T2 (or vice versa)? Justify your answer by explaining ESR’s core commitments.  
  2. **Assessment of ESR**: Does this result reveal ESR as **too weak** (because it cannot resolve such disputes) or **appropriately modest** (because it correctly identifies the limits of scientific knowledge)? Defend your view.  
  3. **Newman Objection**: How does this case relate to the Newman objection? Explain whether ESR’s inability to choose between T1 and T2 reflects the triviality threat Newman raised (i.e., that structural commitments collapse to claims about cardinality).  

  ---  

  ### Model Answer (≈600 words)  

  #### 1. Epistemic Grounds  
  Epistemic structural realism (ESR) holds that science reveals *only* the relational structure of the unobservable world (e.g., equations, state spaces), not the intrinsic properties of entities. For ESR, knowledge is limited to what can be captured structurally: if two theories share identical structures, they are epistemically indistinguishable. Here, T1 and T2 posit the *same* equations, state space, and relations—they differ *only* in their claims about intrinsic properties (T1: continuous medium; T2: no medium). ESR therefore provides **no grounds to prefer T1 or T2**. ESR’s core commitment—that we can only know structural relations—means the dispute over intrinsics is beyond scientific resolution. Any preference would require "peeking behind" the structural veil, violating ESR’s epistemic humility.  

  #### 2. Assessment of ESR  
  This result shows ESR is **appropriately modest**, not too weak. ESR acknowledges science’s limits: it can identify structural patterns but not resolve metaphysical disputes about intrinsic natures. In T1 vs. T2, both theories are empirically adequate and structurally identical, so demanding that science arbitrate between them overreaches. For instance, T1’s "ether" might appeal to intuitive causal stories, while T2’s structuralism might align with ontological parsimony—but these are *metaphysical* preferences, not *empirical* ones. ESR rightly restricts scientific knowledge to structure, avoiding overconfident claims about intrinsics. Criticizing ESR as "weak" misdiagnoses the issue: the problem lies in expecting science to answer non-scientific questions. ESR’s modesty is a virtue in a post-positivist landscape where underdetermination is inevitable.  

  #### 3. Newman Objection  
  The Newman objection argues that structural realism collapses into triviality: if a theory only asserts "there exist objects with relations matching structure S," this can be satisfied by *any* set of objects with the right cardinality (size), making structural commitments vacuous. The T1/T2 case **does not replicate Newman’s triviality** but reveals a *different* challenge for ESR.  

  Newman’s worry targets the *underdetermination of reference*: any structure can be instantiated by countless ontologies if we adjust interpretations of objects/relations. In T1/T2, however, the structures are *fixed and identical*—the issue isn’t multiple instantiations but multiple *interpretations* of the *same* structure. ESR avoids Newman-style triviality here because the shared structure is empirically constrained (it must match observations), preventing arbitrary cardinality-based instantiations. Yet T1/T2 highlights ESR’s **ontological indeterminacy**: it cannot discern between competing intrinsic accounts of the relata, even when structure is fully specified. This is not Newman’s triviality (which concerns structure’s *satisfiability*) but a limitation in ESR’s *expressive power* about intrinsics. It underscores that ESR, while non-trivial, leaves "reality beyond structure" underdetermined.  

  ---  

  ### Marking Scheme (Total: 25 points)  
  **Part 1: Epistemic Grounds (8 points)**  
  - **Must-hit moves (8 pts)**:  
    - (3 pts) State ESR provides *no grounds* to prefer T1 or T2.  
    - (3 pts) Explain *why* using ESR’s core tenet: knowledge is limited to structure, and T1/T2 share identical structures.  
    - (2 pts) Note that intrinsics are inaccessible to ESR.  
  - **Common mistake**: Arguing ESR prefers T2 due to "ontological parsimony" (ESR is epistemic, not ontological).  
  - **A vs. B**: An A answer *explicitly ties ESR’s epistemic humility to the inaccessibility of intrinsics*. A B answer correctly states "no preference" but inadequately explains ESR’s rationale.  

  **Part 2: Assessment of ESR (8 points)**  
  - **Must-hit moves (8 pts)**:  
    - (3 pts) Take a clear stance (e.g., "modest" or "too weak").  
    - (3 pts) Defend the stance by engaging ESR’s role (e.g., modesty as avoiding overreach vs. weakness as failing to guide theory choice).  
    - (2 pts) Contrast scientific vs. metaphysical claims (e.g., T1/T2’s intrinsics are extra-empirical).  
  - **Common mistake**: Conflating ESR with ontic structural realism (OSR) or demanding ESR solve metaphysical disputes.  
  - **A vs. B**: An A answer *explicitly links ESR’s modesty to scientific underdetermination*. A B answer asserts "modesty" without explaining *why* underdetermination justifies it.  

  **Part 3: Newman Objection (9 points)**  
  - **Must-hit moves (9 pts)**:  
    - (3 pts) Accurately summarize Newman’s objection (triviality via cardinality).  
    - (3 pts) Argue T1/T2 illustrates *ontological indeterminacy*, not Newman-style triviality (empirical structure fixes relations, not cardinality).  
    - (3 pts) Conclude ESR avoids triviality (structure is empirically constrained) but faces underdetermination of intrinsics.  
  - **Common mistake**: Claiming T1/T2 *is* a Newman case (e.g., "any ontology fits the structure").  
  - **A vs. B**: An A answer *clearly distinguishes Newman’s triviality from ontological underdetermination*. A B answer identifies Newman but conflates it with T1/T2’s challenge.  

  **Overall Expectations**:  
  - **A (21–25)**: Precise ESR analysis; clear stance in Part 2; Newman distinguished from T1/T2; no conflation of epistemic/ontic.  
  - **B (16–20)**: Correct conclusions but weaker explanations (e.g., "ESR is modest" without depth); minor Newman conflation.  
  - **C (11–15)**: Superficial treatment; significant errors (e.g., ESR prefers T2; misrepresents Newman).  
  - **D/F (≤10)**: Ignores prompts; major misunderstandings (e.g., ESR as realism about intrinsics).  

  **Word Count**: Ensure responses are concise (~900 words). Points deducted for significant deviations. Use American English (e.g., "realize," not "realise").
