answer: |-
  ## Dissertation Prospectus: The Denominator Dilemma: Normative Foundations in the Measurement of Historical Violence Decline

  **Research Question:**  
  To what extent does the choice of denominator (e.g., per capita, per person-hour of life, per potential violent contact, per capability-to-harm) determine the verdict on whether global violence has declined historically, and can this choice be made on principled (empirical/theoretical) grounds, or is it irreducibly evaluative? Furthermore, if evaluative, does the core question ("Has violence declined?") retain a singular factual answer, or does it dissolve into a merely verbal dispute contingent on normative commitments?

  **Critique of Existing Positions & The Open Question:**

  The debate is currently polarized between two broad camps, neither of which adequately addresses the denominator's fundamental role:

  1.  **The Declinists:** Following arguments popularized by scholars like Steven Pinker, this camp primarily relies on **per-capita death rates** from interpersonal homicide and interstate/intergroup warfare. They demonstrate a significant long-term reduction in these rates, arguing this reflects a profound civilizing process, the rise of the Leviathan state, expanding empathy, and increased commerce. Their strength lies in relatively standardized, long-run datasets (e.g., homicide records, battle death estimates). **Why they leave the question open:** They treat the per-capita denominator as the natural, objective metric, failing to systematically justify *why* population size is the appropriate normalization factor against which violence *should* be measured, ignoring the conceptual alternatives your idea highlights. Their conclusion is implicitly contingent on this specific choice.
  2.  **The Critics/Anti-Declinists:** This diverse group challenges the declinist narrative. Some focus on **absolute numbers** of violent deaths, noting these can be high or rising in the modern era (e.g., World Wars, colonial genocides, modern homicide totals). Others emphasize forms of violence potentially undercounted in declinist metrics – **structural violence** (poverty, preventable disease), **institutional violence** (mass incarceration, police brutality), **colonial/imperial violence**, and **slow violence** (environmental degradation). **Why they leave the question open:** While they rightly challenge the scope of "violence" and the adequacy of per-capita metrics, their critiques often remain reactive and fragmented. They rarely propose *systematic alternative denominators* or engage in a principled philosophical analysis of *which* denominator best captures the morally relevant aspects of violence. Their arguments often imply alternative normalizations (e.g., absolute numbers reject normalization, focus on structural violence hints at normalizing by vulnerability or deprivation) without explicitly theorizing them.

  **The Gap:** The core dispute often masks a deeper, unarticulated disagreement about the *metric of comparison itself*. Declinists normalize by population; critics implicitly normalize by different standards (total impact, vulnerability, capability, etc.). The existing literature lacks:
      *   A systematic empirical investigation of how the *decline verdict changes* across plausible alternative denominators.
      *   A rigorous philosophical analysis of whether the choice between these denominators can be resolved empirically/theoretically or is fundamentally normative.
      *   An exploration of the implications for the factual status of the core question if the denominator choice is normative.

  **Methodology (18-Month Plan):**

  *   **Months 1-3: Conceptual Groundwork & Framework Development:**
      *   Conduct a comprehensive literature review focusing on the *implicit* metrics used in both declinist and critical arguments.
      *   Develop a precise taxonomy of potential denominators: Per Capita (PC), Per Person-Hour of Life (PHL), Per Potential Violent Contact (PVC), Per Capability-to-Harm (CTH). Define each rigorously (e.g., PHL = Violent Deaths / [Population * Life Expectancy]; PVC = Violent Deaths / [Proxy for Interaction Density, e.g., Urbanization * Population Density]; CTH = [Violent Deaths Avoided] / [Proxy for State Capacity/Lethality]).
      *   Articulate the normative rationale potentially underlying each denominator choice (e.g., PC = equal weighting of individuals; PHL = weighting by total life exposure; PVC = weighting by opportunity/risk; CTH = weighting by restraint relative to power).
      *   Identify core case studies and time periods for empirical testing.

  *   **Months 4-9: Empirical Investigation - Case Study Analysis & Data Synthesis:**
      *   **Focus:** Apply multiple denominators (PC, PHL, PVC; CTH later) to carefully selected historical comparisons where *some* relevant data exists.
      *   **Key Comparisons (Illustrative - specific cases TBD via lit review):**
          *   **Pre-Modern vs. High Modern (e.g., 14th C. Europe vs. Early 20th C. Europe):** Focus on warfare (e.g., Hundred Years' War vs. WWI) and homicide. Requires grappling with severe pre-1800 data scarcity.
          *   **Colonial Conquest vs. Modern Counterinsurgency (e.g., Scramble for Africa vs. Iraq/Afghanistan):** Focus on state-perpetrated lethal violence against populations.
          *   **Homicide Trends in a Rapidly Urbanizing Society (e.g., London 1600-1900 or US 1800-2000):** Focus on PVC and PHL.
      *   **Handling Pre-1800 Data Scarcity:**
          *   **Proxies & Estimates:** Use best-available proxies. For PHL: Leverage historical demography (e.g., Wrigley-Schofield for England, other regional studies) for life expectancy estimates. For PVC: Use urbanization rates, population density estimates (where available, e.g., cities), trade volume proxies, travel diaries. Acknowledge uncertainty ranges prominently.
          *   **Qualitative Anchoring:** Use qualitative sources (chronicles, legal records, diaries, administrative reports) to cross-check plausibility of quantitative trends derived from proxies. E.g., do sources describe levels of casual violence consistent with high PVC?
          *   **Comparative Bounding:** Instead of precise point estimates, aim for directional conclusions ("PHL decline is *markedly slower* than PC decline" or "PVC decline is *plausibly steeper* than PC decline") based on robust proxy relationships.
          *   **Sensitivity Analysis:** Explicitly model how results change under different plausible assumptions for missing data.
          *   **Focus on Relative Shifts:** The core question is how the *verdict changes* relative to PC, not necessarily establishing absolute levels for PHL/PVC in 1300. Did PHL fall as much as PC? Did PVC fall faster/slower?

  *   **Months 10-12: Capability-to-Harm (CTH) Modeling & Normative Analysis:**
      *   **CTH Challenge:** This is the most conceptually complex and data-poor denominator. Focus on developing a *conceptual model* and applying it illustratively.
      *   **Method:**
          1.  Define "Capability-to-Harm" proxies: State military expenditure/GDP, technological lethality indices (e.g., destructive power per soldier), bureaucratic reach/penetration, communication speed. Data availability will be very limited pre-1900.
          2.  Define "Violence Avoided": Highly counterfactual. Estimate potential maximum violence (e.g., genocidal potential) vs. actual violence for specific historical episodes. This will be largely qualitative and interpretive.
          3.  **Illustrative Case Studies:** Apply the CTH framework qualitatively/narratively to episodes like the Pax Romana (restraint relative to capability?), 19th Century colonial "small wars" (high capability used for moderate violence?), Cold War deterrence (avoidance of nuclear war).
      *   **Normative Analysis:** Begin systematic analysis of the philosophical literature (ethics, political philosophy, philosophy of social science) on commensurability, value pluralism, and the definition of violence to address questions (a) and (b).

  *   **Months 13-15: Synthesis, Modeling & Philosophical Integration:**
      *   Synthesize empirical findings: Create summary tables/graphs showing how the violence decline verdict (strong decline / weak decline / no decline / increase) shifts across denominators and case studies.
      *   Develop simple formal models showing how different denominator choices mathematically interact with trends in population, longevity, interaction density, and capability.
      *   Deepen the philosophical analysis: Can reason alone adjudicate between PC, PHL, PVC, CTH? Or does the choice reflect prior, irreducibly normative commitments (e.g., egalitarianism vs. utilitarianism vs. deontology)? Does "Has violence declined?" have a single factual answer, or does it require specification: "According to which morally relevant metric?"

  *   **Months 16-18: Drafting & Refinement:**
      *   Write dissertation chapters integrating empirical findings, modeling results, and philosophical analysis.
      *   Refine arguments and address limitations.

  **Possible Conclusions & Deciding Factors:**

  1.  **Principled Choice Possible:** The analysis reveals an empirical or theoretical reason strongly favoring one denominator (e.g., PHL best captures total suffering; PVC best captures societal risk perception). *Deciding Factor:* Coherence with fundamental ethical principles (e.g., minimizing total suffering, maximizing individual safety in daily life) *and* superior empirical fit explaining historical patterns of concern/action regarding violence.
  2.  **Irreducibly Evaluative, Factual Core Remains:** While the denominator choice is value-laden, the underlying trends (e.g., PC down, PHL down slower/up, PVC down faster) are robust facts. The core question retains meaning, but the answer *must* specify the metric ("Violence per capita has declined, but violence per person-hour may not have"). *Deciding Factor:* Clear demonstration of robust empirical trends under each denominator coupled with strong philosophical arguments showing genuine normative disagreement underlying denominator preference.
  3.  **Irreducibly Evaluative, Merely Verbal Dispute:** The question "Has violence declined?" dissolves upon analysis. There is no "violence decline" simpliciter, only "decline according to metric X." Choosing X depends entirely on non-factual preferences. *Deciding Factor:* Philosophical argument demonstrating that the competing normative foundations (e.g., individualism vs. total welfare vs. risk aversion vs. responsibility) are genuinely incommensurable and equally valid/arbitrary for settling the core question, coupled with empirical results showing significant divergence in verdicts.
  4.  **Mixed Verdict:** Some denominators (PC, PVC) show robust declines, others (PHL, CTH) are ambiguous or show less/no decline. *Deciding Factor:* Empirical results.

  **Failure Conditions & Scaling Down:**

  *   **Failure:**
      *   **Data Insurmountability:** If pre-1800 data (especially for PHL, PVC proxies) proves too sparse or unreliable *even for directional comparisons* across core case studies, undermining the empirical contrast.
      *   **Conceptual Collapse:** If the CTH denominator proves completely intractable conceptually or empirically, and the normative analysis fails to yield clear insights regarding the other denominators.
      *   **Null Result:** If *all* plausible denominators point unambiguously in the same direction (strong decline or no decline), rendering the denominator question moot (unlikely given your hypothesis).
  *   **Scaling Down (Realistically Likely):**
      *   **Reduce Denominators:** Focus exclusively on the most feasible and conceptually distinct: PC vs. PHL vs. PVC. Shelve or drastically simplify CTH (perhaps only a conceptual chapter).
      *   **Narrow Historical Scope:** Concentrate on the 19th-21st centuries where data is richer, sacrificing deep historical comparison. Or focus only on homicide within one society (e.g., England/US).
      *   **Shift Emphasis:** If empirical work is severely hampered, pivot towards a primarily *conceptual/philosophical* dissertation, using historical examples illustratively rather than as systematic evidence. Core question becomes: "Why *should* we measure violence decline per capita? A normative analysis of metrics."
      *   **Fewer Case Studies:** Conduct a deep dive into just 1-2 pivotal comparisons instead of multiple periods/contexts.

  **Honest Assessment:** This project is ambitious and interdisciplinary, demanding skills in history, quantitative analysis, and philosophy. The pre-1800 data challenge is significant, and the CTH denominator is inherently speculative. **However, the core insight – that the denominator choice is pivotal and under-theorized – is powerful and novel.** Even scaled down (e.g., focusing on PC vs. PHL/PVC in the modern era), the project promises to reframe a major debate by exposing its hidden normative foundations. Success hinges on meticulous proxy development, transparent handling of data limitations, robust sensitivity analysis, and a sophisticated philosophical engagement. The 18-month timeframe is tight but feasible with focused case selection and potentially scaling back CTH ambitions. This prospectus provides a clear roadmap to make a substantial contribution, regardless of the ultimate conclusion on the denominator dilemma.
