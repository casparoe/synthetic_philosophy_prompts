  The notwithstanding clause is tricky. Quebec using it to override the Charter is a strong communitarian move, asserting collective identity over individual rights. But is that authentic communitarianism or just majoritarianism? Taylor, a communitarian, opposed the bill, so there's a split. The clause might be a tool for majority power rather than genuine community values.

  Where do theories break? The crucifix issue is a perfect example. Calling it "heritage" instead of a religious symbol shows hypocrisy. Neither liberalism nor communitarianism can easily explain this inconsistency. It reveals cultural blind spots and historical baggage.

