prompt: |-
  I've been thinking about money pump arguments in decision theory, and a particular kind of response to them keeps nagging at me. The standard story is that if someone's preferences are circular — they'd pay something small to swap A for B, pay again to swap B for C, and then pay a third time to swap C back for A — a patient trader can strip them of arbitrary amounts of money without ever giving them anything they didn't, at each moment, want. The usual conclusion is that such preferences are irrational, and the obvious fix is to tidy them up so they're no longer circular. But a friend of mine proposed what looks like a completely different fix: he says he would simply refuse the last trade. Not because he won't want it — he's confident that when the trader comes around the third time he'll genuinely prefer paying a little to get A back — but because he decided, at the very start, that his earlier choice binds him. His preferences never change; he just lets a past decision outrank a present one. And it seems to work, since the pump needs all three trades to go through and he'll only ever accept two.

  Since he put it that way, I've noticed him doing the same thing elsewhere. Before we go to an expensive restaurant he tells me what he's decided to order, and once there he sticks to it even while admitting the tasting menu tempts him more; his line is that the choice was made when his head was clear, and nothing that happens at the table gets to overrule it. What's odd is that there's no external device in any of this — he doesn't hand his wallet to the waiter or sign anything with the trader. It's purely that he treats his own earlier decision as having a kind of authority over his later one, even while his later preference is fully intact and points the other way.

  So, does this stance have a name in the rational choice or decision theory literature? I want to be careful, because there are several nearby things it is not, and a bare label won't help unless the boundaries are drawn. It isn't simply changing your preferences over time — his preferences are stable, and their stability is exactly what makes the pump possible in the first place. It also isn't the classic binding of oneself by external means, the arrangement where you physically cannot defect; he can defect at any moment, and sometimes it visibly costs him effort not to. And it isn't obvious stubbornness either, because the whole point is that it protects him from a loss that sensible-seeming, one-step-at-a-time choosing would walk him straight into. If there's an established concept for letting your past self overrule your present self without force and without changed preferences, I'd like to know what it's called and how it's defined — and in particular whether the money pump literature treats it as a genuine escape route for circular preferences, or whether there's some reason it doesn't actually work (say, if the trader can re-order the offers or space them out over months). Relatedly, I'd like to know where its edges are: at what point does this become indistinguishable from just having a standing preference for sticking to your own plans, and is that a difference that matters for the argument?
reasoning: |-
  Okay, the user is asking about a decision theory concept where someone avoids a money pump by refusing the last trade based on a prior commitment to their past decisions. They want to know if this has a name in the literature and whether it's a valid solution to the money pump problem.

  First, I recall that money pump arguments demonstrate that cyclic preferences can lead to financial exploitation. The user's friend uses a strategy of binding himself to past decisions without external enforcement. The user mentioned examples like sticking to a pre-decided meal choice even when tempted. The core is stable preferences but granting authority to past choices.

  I remember that the key concept here is self-binding or precommitment. But the user specified it's not physical binding—it's internal. So terms like sophisticated choice or resolute choice come to mind. Sophisticated choice involves anticipating future actions and adjusting early decisions. Resolute choice, proposed by McClennen, is about sticking to a plan even when tempted later. 

  The user wants to distinguish this from mere preference changes or stubbornness. Resolute choice fits because it's about adhering to a prior plan despite current temptations, without changing underlying preferences. The literature debates its rationality. Critics like Rabinowicz argue that resoluteness might be inconsistent if it violates dynamic consistency. Supporters say it avoids exploitation.

  The user also asks if this strategy works against money pumps. If the trader offers trades in sequence, refusing the last trade based on a prior plan breaks the cycle. But if the trader can reorder offers or use different tricks, it might not hold. Sophisticated agents might avoid starting the cycle, but resolute agents complete the plan without succumbing to later temptations.

  Edge cases: When does this become a preference for sticking to plans? If the agent values commitment per se, it's a meta-preference. Resolute choice treats the plan as a single choice, not separate steps. The difference matters for rationality debates—whether it's consistent or just avoiding regret.

  I should explain both sophisticated and resolute strategies, their pros and cons, and how they handle money pumps. Also mention key authors like McClennen, Machina, and Rabinowicz. Clarify that resoluteness isn't widely accepted as rational but is a discussed alternative. Address possible trader counter-strategies to test robustness.
answer: |-
  Your friend's strategy is a fascinating and deliberate form of **resolute choice**, a concept developed primarily by philosopher **Edward F. McClennen** in his book *Rationality and Dynamic Choice* (1990) and subsequent work. It's a specific response to dynamic inconsistency problems like the money pump, precisely matching your description.

  Here's a breakdown of why "resolute choice" fits, how it relates to the money pump, and its nuances:

  1.  **Core Definition of Resolute Choice:**
      *   An agent makes a **plan** (or adopts a **strategy**) over a sequence of choices *in advance*.
      *   The agent **commits** to executing this plan *regardless* of whether their *momentary preferences* at later choice points might tempt them to deviate.
      *   Crucially, this commitment is **internal and intentional**, not enforced externally (like Ulysses binding himself to the mast). The agent retains the *physical ability* to deviate but exercises *willpower* or *deliberate adherence* to the plan.
      *   **Preferences remain stable:** The agent acknowledges that their momentary preference at T3 might strongly favor deviating from the plan (e.g., preferring A over C, or the tasting menu over the pre-ordered dish). Resoluteness doesn't require changing these underlying preferences; it involves prioritizing the *plan* formulated earlier over the *immediate preference*.

  2.  **Relation to the Money Pump:**
      *   **It breaks the pump:** As your friend intuited, a resolute chooser facing the A->B->C->A pump would:
          1.  *Before any trades:* Formulate a plan: "I will not engage in *any* of these trades." OR, recognizing the cycle, "I will only engage in trades leading to a specific endpoint, and never complete the cycle back."
          2.  *When offered A->B:* Refuse, based on the plan. (Alternatively, if they accept A->B and B->C as part of a plan *to get to C*, they would then refuse C->A).
      *   **Why it works:** The pump relies on the trader exploiting the agent's willingness to make *each individual trade* based on their *momentary preference at that instant*. Resoluteness blocks this by making the sequence of choices interdependent, governed by the initial plan. The "last trade" is refused not because it's unwanted *at that moment*, but because accepting it violates the pre-established rule designed to avoid exploitation. **The trader cannot strip them of arbitrary amounts because the resolute agent simply won't start the sequence or will stop before completing the cycle.**

  3.  **Contrast with Nearby Concepts (As You Requested):**
      *   **Sophisticated Choice:** This is the *other* main response in dynamic choice theory (associated with Howard Raiffa, Robert Strotz, Mark Machina). A sophisticated agent *anticipates* their future temptations and *adjusts their initial choice* to avoid ending up in a bad position later. For the money pump, a sophisticated agent, knowing they would pay to swap C back to A, might refuse the *first* trade (A->B) to avoid being pumped later. **Key Difference:** Sophistication involves *changing the early choice based on predicted future weakness*. Resoluteness involves *sticking to the original plan despite future temptations*.
      *   **Preference Change:** Your friend isn't changing his preference for A vs C at the moment of the third offer. His preference for A *is* stronger then, but he doesn't act on it because he's adhering to the plan. The underlying valuation of the states remains constant.
      *   **External Precommitment:** No physical constraints or irreversible delegations are involved. It's purely internal resolve.
      *   **Stubbornness/Inertia:** This isn't arbitrary rigidity. The refusal is *strategic* and *instrumentally rational* – it's explicitly adopted *to avoid the predictable exploitation* of the money pump. It's a calculated defense mechanism against a known vulnerability in sequential choice.

  4.  **Does the Literature Treat it as a Genuine Escape?**
      *   **Yes, it is acknowledged as an escape route.** McClennen explicitly argues that resolute choice can render agents immune to money pumps (and other dynamic inconsistencies like the prisoner's dilemma in sequential form) *without* requiring them to have transitive preferences over outcomes. Resoluteness provides a way to achieve *planning consistency* even if *momentary preference consistency* is flawed.
      *   **But it's highly controversial:**
          *   **Critique (Rabinowicz, Hammond, Machina):** Critics argue resoluteness violates **Dynamic Consistency** – the principle that a rational plan should prescribe actions that remain optimal when the time comes to execute them, given the information available *at that time*. At T3, paying a small amount to get A back *is* optimal given the agent's preferences *at T3* and the state they are in (holding C). Refusing is *dynamically inconsistent*. Critics see this as irrational, akin to cutting off your nose to spite your face *at the moment of choice*.
          *   **Defense (McClennen, Gauthier):** Proponents argue that dynamic consistency, interpreted narrowly as moment-by-myopic-moment optimization, is precisely the trap that leads to exploitation. True rationality, they argue, involves being a unified agent over time, capable of sticking to beneficial *long-term plans* even when short-term temptations arise. They see resoluteness as a form of *self-governance* essential for achieving better overall outcomes. Avoiding the money pump is a clear win.

  5.  **Robustness Against Trader Strategies:**
      *   **Re-ordering Offers:** If the trader offers C->A *first*, the resolute agent adhering to a "no cycle trades" plan still refuses. The pump is blocked before it starts. If the agent has a specific plan (e.g., "get to B and stop"), reordering might confuse the plan formulation initially, but once a plan is made, resoluteness still blocks completing the cycle.
      *   **Spacing Out Over Time:** This is the real challenge. Resoluteness requires *memory* and *willpower*. If months pass between offers, the agent might forget the original plan or the reason for it. More importantly, their resolve might weaken – the psychological cost of adhering to an old plan against strong current preferences might become too high. **Resoluteness is psychologically demanding over long time horizons.** While conceptually it *could* still work if the agent perfectly remembers and maintains resolve, in practice, this is its Achilles' heel. Critics argue this vulnerability shows it's not a fundamental solution.

  6.  **The Edge: Preference for Sticking vs. Resolute Choice**
      *   **The Blurred Line:** This is a key point in the debate. Is resoluteness simply the agent having a *higher-order preference* for sticking to their plans? McClennen argues *no*. He sees resolute choice as treating the *plan itself* as the unit of agency – making a single, unified choice *ex ante* that governs the sequence. The later actions are *executions*, not new choices where preferences are maximized.
      *   **The Difference that Matters:** If it's *just* a higher-order preference (e.g., "I prefer sticking to my plans over satisfying momentary whims"), then:
          *   **Transitivity Requirement:** This higher-order preference structure would itself need to satisfy standard rationality axioms (like transitivity) to be considered rational. Resoluteness as a *method* was supposed to *avoid* requiring transitivity of first-order preferences.
          *   **Potential New Pumps:** A clever trader might exploit conflicts *between* the preference for sticking and the momentary preferences. E.g., offer money *not* to stick to the plan at T3. If the higher-order preference is strong enough, this fails, but if it's finite, new pumps might be devised.
          *   **Critics' View:** Critics often *do* interpret resoluteness this way – as the agent having a complex, but still standard, preference structure that values plan-adherence. They argue this just pushes the problem up a level.
      *   **Proponents' Defense:** McClennen insists the difference is fundamental. Resolute choice isn't maximizing *any* simple preference function at each point; it's acting out a commitment made earlier as part of a temporally extended agency. The "preference" at T3 *is* to execute the plan, even if the *evaluation* of outcomes at T3 favors deviating.

  **In Summary:**

  *   **Name:** **Resolute Choice** (McClennen).
  *   **Definition:** Adhering to a pre-adopted plan over a sequence of choices, based on internal commitment, even when momentary preferences at later stages favor deviating, without changing those underlying momentary preferences.
  *   **Money Pump:** It is a recognized and effective escape *if* the agent formulates and adheres to a plan that breaks the cycle. It prevents the exploitation by making choices interdependent.
  *   **Controversy:** While effective, it's criticized for violating dynamic consistency and being psychologically fragile over long periods/spaced offers. Critics see it as irrational rule-worship; proponents see it as essential self-governance.
  *   **The Edge:** The crucial distinction is whether resoluteness is seen as:
      *   *(McClennen)*: A fundamental mode of choice where the plan is the unit of agency.
      *   *(Critics)*: Simply reflecting a complex, higher-order preference for plan-adherence (which then must itself be "rational").
      This distinction matters deeply for whether resolute choice truly bypasses the need for transitive first-order preferences or just relocates the problem.

  Your friend has independently rediscovered a sophisticated and debated position in decision theory. His restaurant example is a perfect illustration of resoluteness in action, protecting him not from a monetary loss, but from the potential "regret" or "exploitation" (by his own future self or the environment) that myopic choice might induce. Whether this is truly rational or not remains a central philosophical debate.
