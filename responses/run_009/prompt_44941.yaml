prompt: |-
  My roommate is a math major and I'm taking a philosophy of math course this semester, so I've been trying to actually understand the axiom of choice rather than just nodding when it comes up. Last night he gave me what he called "the whole story in two minutes," and it sounded confident and mostly sensible, but a couple of things he said rubbed against what my professor hinted at in lecture. Here's his summary, as close to verbatim as I remember it:

  "The axiom of choice says that if you have any collection of nonempty sets, you can pick one element from each set. And this is just obviously true -- if a set is nonempty, there's something in it, so you can grab it, and you just do this for each set one at a time. Mathematicians only fuss about it because for infinite collections you can't physically finish the picking, but that's a quibble about human finitude, not about mathematical truth. The interesting stuff is downstream: AC is equivalent to the well-ordering theorem, which says every set can be put in a nice order where every subset has a least element, so in particular the real numbers can be counted out in a sequence, even if nobody knows how. And AC is what powers the Banach-Tarski theorem, where you cut a ball into finitely many pieces and rearrange them into two balls each the same size as the original. Since duplicating a ball is flatly impossible, Banach-Tarski is basically a reductio of AC, and most working mathematicians quietly accept AC for the convenient results but refuse to take Banach-Tarski at face value."

  Some of this rings true (I did recognize well-ordering and Banach-Tarski from lecture), but my professor said something like "the axiom of choice is only ever needed when you have no rule for choosing" and also that finite cases are a non-issue, which seems to cut against his "just grab it, one set at a time" picture. So I don't trust my instinct here. Can you go through his little speech claim by claim: what a set theorist would accept as stated, what's subtly off, and where he's conflating two things that are kept distinct? In particular I'd like to know whether "the reals can be counted out in a sequence" actually follows from the well-ordering theorem like he says, and whether his ending -- that most mathematicians treat Banach-Tarski as a reason to distrust AC -- is an accurate picture of the field or him projecting. And if you had to pick the one mistake in his summary that does the most damage to his overall take, which is it?
