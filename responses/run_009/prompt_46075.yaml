answer: |-
  ### Close Reading: *Memento* Through Dennett’s "Center of Narrative Gravity"  

  Christopher Nolan’s *Memento* offers a visceral dramatization of Daniel Dennett’s concept of the self as a "center of narrative gravity" — an abstract focal point constructed by the brain’s narratives to explain behavior. Leonard Shelby’s anterograde amnesia forces him to externalize his narrative scaffolding through tattoos, Polaroids, and notes. These artifacts function as cognitive prosthetics, generating a coherent self via physical inscriptions. Dennett posits that the self is not a "thing" but a useful fiction that organizes experience (*Consciousness Explained*, Ch. 13). Leonard’s curated evidence—e.g., "John G. raped and murdered my wife"—creates this gravitational center, allowing him to act with purpose despite his fractured cognition.  

  Yet the film complicates Dennett in three key ways.  

  **1. The Paradox of Self-Authorship**  
  Dennett argues narratives "spin us" unconsciously; Leonard, conversely, *deliberately engineers* his narrative. When he chooses a tattoo ("FACT 6: CAR LICENSE SG13 7IU") or writes "DON’T ANSWER THE PHONE" on a Polaroid, he acts as an external author of his future self’s reality. The final scene—where Leonard burns a photo of Teddy’s corpse and resolves to "lie to myself to be happy"—reveals a meta-awareness: he knowingly crafts a narrative trap for his amnesiac successor. This raises a challenge: if the narrative self requires an *engineer*, does that imply a pre-narrative agent? Dennett might counter that the "engineer" is itself a narrative draft (Leonard’s present self is a temporary cognitive node), but the film suggests an uncanny agency persisting through the void.  

  **2. The Persistence of Non-Narrative Selves**  
  Leonard’s emotional and procedural memories evade his narrative control. He instinctively recoils at his wife’s perfume, and Sammy Jankis’ story—revealed as Leonard’s own repressed trauma—haunts him through somatic dread. Dennett’s "multiple drafts" model accommodates parallel processes (*CE*, p. 113), but the film implies these non-declarative elements *resist* Leonard’s curated narrative. His body "knows" truths his Polaroids deny, suggesting selves exist beyond explanatory posits—a challenge to narrative solipsism.  

  **3. Narrative Continuity vs. Identity Fragmentation**  
  Teddy’s revelation—"Sammy Jankis is just a story you tell yourself"—and the flash of Leonard in Sammy’s asylum bed destabilize the identity Dennett’s narrative continuity secures. The reverse-chronological structure forces the audience to rebuild Leonard’s self from artifacts, mirroring his process. Yet the twist reveals his pre-injury self (who likely killed his wife via insulin overdose) and post-injury self (hunting "John G.") as distinct narrative loci. Dennett’s account makes identity tractable via narrative overlap, but *Memento* asks: when the past is fabricated and the future pre-scripted, where does gravity hold? The film leaves Leonard’s identity suspended between drafts.  

  ### What the Medium Reveals  
  Film uniquely immerses us in narrative disassembly. We experience Leonard’s confusion temporally, reconstructing his self *as he does* — through disconnected artifacts. This sensory engagement reveals the terror and ingenuity of narrative self-creation in ways philosophical prose cannot. We feel the weight of the tattoos, the fragility of ink on paper, and the horror of realizing our own collusion in Leonard’s delusion.  

