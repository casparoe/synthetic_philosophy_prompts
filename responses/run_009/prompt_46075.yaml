  ### Key Verdict  
  *Memento* **complicates** Dennett: it vividly affirms the narrative self’s functional power but exposes its fragility, contested authorship, and the haunting remnants of non-narrative identity. The film doesn’t refute Dennett but intensifies his model’s tensions, showing narrative gravity as both a lifeline and a cage.
