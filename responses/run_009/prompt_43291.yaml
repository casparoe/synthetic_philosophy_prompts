answer: |-
  ## Sterile Ledger (A Sestina for the Units of Selection)

  Her wings stir pollen dust, a quiet **cost**
  Paid daily. Nectar fuels no future **copy**
  Of *her* form passed. She feeds a plump **sister**,
  Cradled in wax. The humming **colony**
  Demands this service. Where resides the **self**
  Whose final act defers its own **death**?

  The coded script ignores her fleshly **death**.
  Its calculus accepts the somatic **cost**.
  The kin-bound molecule, the deeper **self**,
  Tracks identical strings, a thriving **copy**
  Safeguarded in the fertile **sister**
  And multiplied within the **colony**.

  The structure thrives, the super-organism **colony**.
  The sterile body knows its programmed **death**.
  She labours, scent-marked task defines the **self**,
  Absorbing every necessary **cost**.
  Her effort flows towards a larval **copy**,
  Nurturing not her child, but kin, a **sister**.

  The waxen cradle holds a future **sister**.
  The whole persists beyond the failing **colony**
  Component. See the Price: the **copy**
  Flourishes *between* these hives, not **death**
  To kin-group benefit absorbs the **cost**.
  *Within*, selection silences the **self**.

  No offspring’s cry defines this insect **self**,
  This lifetime spent for grub and queen and **sister**.
  The balance sheet shows pure, stark **cost**
  To this lone unit in the **colony**.
  Her barren flight ends in unnoticed **death**.
  What ledger holds this unreplaced **copy**?

  The gene observes no lost potential **copy** –
  The germ-line thrives through fertile **sister**.
  The individual finds no **self**
  Beyond this function for the **colony**.
  Her brief existence pays the ultimate **cost**:
  A life’s whole currency exchanged for **death**.

  The **colony** endures past worker **death**.
  The gene ensures its **copy** multiplies.
  The sterile **self** pays **cost** without return.
  The nurturing act sustains the larval **sister**.
  Are these three ledgers? Or one sunbeam split?
  Explain the bee: one truth, or three names for it?

  ---

  **Notes on Execution & Contested Readings:**

  1.  **Form Fit:** The sestina is ideal. The relentlessly cycling end-words ("cost," "copy," "sister," "colony," "self," "death") physically embody the "same facts shuffled between spreadsheets." Each recurrence forces a slight shift in meaning/perspective as the stanza's focus changes level, mirroring the unit-of-selection debate.
  2.  **Perspectives:**
      *   Stanza 1: Grounds the poem in the physical bee's life/deed (individual cost, colony context).
      *   Stanza 2: Gene's-eye view (copies secure in sisters, somatic cost irrelevant).
      *   Stanza 3: Colony-level function (sterility as adaptive division of labour).
      *   Stanza 4: Individual organism's perspective (no direct fitness, cost paid).
      *   Stanza 5: Explicit Price Equation reference ("See the Price: the copy / Flourishes *between* these hives... / *Within*, selection silences the self.") Contrasts between-group (colony) benefit favouring sterility with within-group (hive) selection silencing individual reproduction.
      *   Stanza 6: Synthesis/Culmination – starkly contrasts the gene/individual/colony ledgers for the same life.
  3.  **Envoi:** Poses the core question ("Are these three ledgers? Or one sunbeam split?") directly. The final line ("Explain the bee: one truth, or three names for it?") refrains from answering, fulfilling the request for neutrality. "Sunbeam split" evokes light as a fundamental phenomenon refracted differently, avoiding bias.
  4.  **Neutrality:** The poem presents each perspective (gene, individual, colony) on its own terms without:
      *   Implying the gene's view is "more fundamental" (Dawkins).
      *   Implying the colony is a mystical super-organism or that group selection is the "real" force (some strong group selection views).
      *   It simply shows *how* each level of accounting interprets the *same biological facts* of sterility, kin relation, cost, and death. A Williams/Sober advocate would see the gene/individual cost clearly; a group selectionist would see the colony-level function validated; both would see their math (e.g., Price) acknowledged.
  5.  **Contested Reading Flagged:**
      *   **The Gene's "Bookkeeping":** The poem presents the gene-centric view clearly ("The coded script ignores...", "The kin-bound molecule..."). This is the core of the "gene's eye view." While widely accepted (especially for kin selection like this), some argue it risks reification or downplays the organism as the actual unit of interaction with the environment. The poem doesn't adjudicate this; it reports *how* that view accounts for sterility.
      *   **Colony as Unit:** Presenting the colony's persistence and the adaptive division of labour as a level of accounting aligns with multilevel selection theory. The Price stanza explicitly frames sterility as potentially selected *between* groups (colonies). While mathematically sound within MLS, whether the colony is a *unit of selection* in the same way an organism is, or merely a *context*, remains a nuanced philosophical debate the poem reflects without resolving. The envoi's question directly addresses this tension.

  The poem aims to be scientifically accurate *within* the established perspectives, philosophically neutral regarding their ontological primacy, and poetically cohesive, using the sestina's structure to enact the conceptual "shuffling" central to the module.
