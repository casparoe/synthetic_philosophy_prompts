answer: |-
  Here’s a battle-tested Q&A prep sheet tailored for your audience and arguments. I’ve prioritized objections by damage potential, phrased them in NLP vernacular, and crafted concise replies with vulnerability notes. Concessions come first to disarm skepticism.

  **Key Concessions Up Front (Say These Early):**  
  *"Let me start by acknowledging what neural MT/LLMs *have* achieved: unprecedented fluency, massive coverage, and genuine utility for many tasks. Benchmarks like BLEURT, COMET, and real-world adoption prove this isn’t just smoke and mirrors. My critique isn’t about discarding these systems—it’s about a specific brittleness that persists despite scaling."*  
  *(Why: Shows you respect their work, aren’t denying progress, and narrows the debate to your core claim.)*

  ---

  ### **Q&A Prep Sheet: Objections & Replies**  
  *(Ordered by Damage Potential)*

  1. **Objection (Scaling Argument):**  
     *"You’re describing edge cases. With enough scale (data, params), models internalize implicit world knowledge and pragmatics through patterns. What’s the evidence this ‘shallowness’ isn’t just undone by Chinchilla-optimal scaling or better prompting?"*  
     **Reply:**  
     "Scale improves correlation, not causation. Models still fail *systematically* when output depends on unstated context. Example: Translating *‘The ball crashed through the window. It was made of styrofoam’* into languages requiring gender/number agreement for *‘it’*. The model lacks a physical scene to resolve ambiguity—it guesses based on co-occurrence, not inference. More data won’t fix this; you’d need synthetic data for every physical scenario, which is intractable."  
     **Soft Spot:** Doesn’t prove scaling *can’t* eventually approximate this; just shows current paradigms don’t incentivize it.  

  2. **Objection (Benchmarks):**  
     *"If models ‘don’t understand’, why do they smash benchmarks (e.g., XGLUE, XTREME) testing reasoning, pragmatics, and discourse? Your ‘dumb errors’ sound like outliers—not the norm."*  
     **Reply:**  
     "Benchmarks test *recognition* of patterns, not *deployment* of reasoning. Take Winograd Schemas or COPA—they’re multiple-choice with surface cues. Real translation lacks options. When *generating* text needing pragmatic adjustments (e.g., converting English sarcasm *‘Sure, he’s a genius’* to a language using particles for irony), models default to literal output. Fluency masks incoherence. We need stress tests for generative pragmatics."  
     **Soft Spot:** Admits benchmarks measure *something* useful, but argues they’re not probing situational modeling.  

  3. **Objection (Falsifiability):**  
     *"How do you operationalize ‘situational model’? This sounds like a unfalsifiable philosophical claim. What experiment would change your mind?"*  
     **Reply:**  
     "Test on minimal pairs requiring invisible context. Example: *‘The councilmen refused the activists a permit because they [feared/advocated] violence’*. Humans use world knowledge to resolve *‘they’*; models often fail. If a system consistently handles such cases *without task-specific training*, I’d concede progress. Right now, it requires adversarial datasets like ANLI or targeted fine-tuning—proving the knowledge isn’t inherent."  
     **Soft Spot:** Creating such datasets is hard; audience may dismiss as "niche".  

  4. **Objection (Human Translation):**  
     *"Aren’t human translators just pattern-matching too? They don’t ‘simulate situations’ consciously—it’s intuition from exposure. Isn’t this the same thing at base?"*  
     **Reply:**  
     "Humans anchor patterns to embodied experience (e.g., *knowing* a ‘crowded room’ implies heat/noise). When translating, we run mental simulations: *Who would say this? What’s unsaid?* Models lack referents. Example: Translating *‘She wouldn’t drink the water’* into a language requiring a reason (e.g., Japanese implying context). Humans infer contamination, drought, or protest; models pick statistically probable reasons, often wrong. It’s pattern-matching vs. pattern-matching *grounded in causality*."  
     **Soft Spot:** Can sound like dualism; emphasize testable behavioral differences.  

  5. **Objection (Utility over Purity):**  
     *"Who cares if it ‘understands’? If BLEU/COMET scores are high and users are happy, isn’t this academic? We build tools, not cognitive models."*  
     **Reply:**  
     "Agreed—until the tool fails unpredictably. Medical/legal translation errors from missing implications can be catastrophic. Fluency creates overtrust. If our goal is *robust* systems, not just smooth ones, we need techniques that reduce reliance on lexical correlations. Ignoring this is like building a self-driving car that works perfectly—except when the sun sets."  
     **Soft Spot:** Audience may prioritize short-term deployable gains.  

  ---

  ### **The Dreaded Question (From Faculty):**  
  *"You claim models lack ‘understanding’, but they pass theory-of-mind tasks, generate coherent plans, and explain jokes. Isn’t your argument just moving the goalposts? What *would* count as ‘understanding’ to you that isn’t solved by next-gen MMLU or a 100T-param model?"*  

  **Why it’s dangerous:** Assimilates your critique into the scaling-hype cycle and forces an undefinable standard.  
  **Reply Strategy (Don’t Define Understanding—Demand Robustness):**  
  *"I’m not asking for consciousness. I’m asking for *consistent robustness* in generative tasks requiring unseen inferences. Show me a system that, without prompt engineering, can:  
  1. Translate ambiguous pronouns coreferring with non-explicit entities (*‘The city blocked the parade. They cited noise concerns’* → who’s *‘they’*?),  
  2. Adapt register mid-sentence when context shifts (e.g., medical report → patient pamphlet),  
  3. Handle novel compounds (e.g., German *‘Klimasorgenkind’* → English) not in training data.  
  Until then, we’re conflating *approximating* understanding with *architecting* systems that deploy it situationally."*  
  **Soft Spot:** Sounds like a "wait for AGI" dodge. Preempt by adding: *"We *can* engineer this—but not via scaling alone. We’ll need hybrid approaches (neuro-symbolic, grounded datasets) or new architectures."*  

  ---

  ### **Delivery Tips**  
  - **Avoid "Hofstadter"**: Say *"classical critiques of statistical MT"* or *"pre-2010 discourse on translation depth"*.  
  - **Use Their Lingo**: Say *"latent space projections"* instead of "shallow representations", *"out-of-distribution generalization"* for situational modeling.  
  - **Show, Don’t Preach**: Use 1–2 **untranslatable-by-NMT examples** (e.g., jokes, ambiguous headlines). Visuals > abstractions.  
  - **Sound Optimistic**: End with *"This isn’t a dead end—it’s the next frontier. Fluency is solved; now let’s solve grounding."*  

  This frames you as rigorous, not reactionary. They’ll still disagree—but you’ll survive Q&A. Break a leg!
