  ### Handout: Mapping Views on Natural Kinds Through Cases  
  Dear reading group members,  

  To explore our diverse views on whether scientific classifications carve nature at its joints, I’ve designed a decision tree grounded in concrete cases rather than abstract labels. Follow the branches by considering your intuitions about these scenarios. We begin with jade, which was historically treated as a single mineral until chemistry revealed two distinct substances—nephrite and jadeite. Ask yourself: Before this discovery, was jade a natural kind? If you answer yes, proceed to the next case. If no, skip to the alternative path below.  

  If you affirmed jade as a pre-chemical natural kind, consider a deliberately gerrymandered grouping—say, all objects that are either ravens or writing desks. Suppose this category exhibits perfect projectibility: every member shares a newly discovered property (e.g., reflecting 550nm light). Despite this regularity, is it a natural kind? If you say yes, your view aligns with **promiscuous realism**: any projectible grouping, however arbitrary, carves nature legitimately. If no—rejecting the gerrymandered kind despite its projectibility—move to biology.  

  Having rejected the gerrymandered kind, reflect on biological species. Given that evolutionary theory frames species as extended lineages (like individual organisms persisting through time), is *Homo sapiens* a natural kind? A yes leads to chemistry; a no branches separately. If you accept species as kinds, consider lithium: its isotopes (e.g., Li-6 and Li-7) differ in nuclear behavior and pharmacological effects. Is lithium—ignoring isotopic splits—still a natural kind? A yes places you in **homeostatic property cluster realism**, where kinds tolerate internal variation if properties cohere via underlying mechanisms (e.g., atomic number unifying lithium’s chemical role). A no is **unoccupied**—it is incoherent to accept pre-chemical jade (with two structures) as a kind yet demand microstructural splitting for lithium.  

  If you denied species as kinds (after affirming jade and rejecting the gerrymandered grouping), reconsider lithium without isotopic divisions. If you accept lithium as a kind, this leaf is **unoccupied**—no prominent theory accepts jade and lithium as kinds but rejects species and gerrymandered groupings. If you reject lithium as a kind, this too is **unoccupied**—it is unattractive to accept jade’s pre-chemical unity but deny lithium’s for similar reasons.  

  Now, return to those who initially *denied* jade was a natural kind pre-chemistry. For you, the gerrymandered projectible grouping (ravens-or-writing-desks) comes next. If you accept it as a natural kind, this leaf is **unoccupied**—it is incoherent to reject projectible jade yet accept a projectible gerrymander. If you reject it, advance to species.  

  After rejecting both jade and the gerrymandered kind, ask if biological species are natural kinds. A yes leads to lithium; a no proceeds separately. If you accept species, evaluate lithium without isotopes: a yes is **unoccupied**—no coherent position rejects jade and gerrymandered kinds but accepts species and lithium; a no is **unoccupied**—ditto. If you rejected species, assess lithium sans isotopes: a yes is **unoccupied**—no theory aligns here; a no advances to a final fork.  

  Having rejected jade, gerrymandered groupings, species, and unsplit lithium, ask: Are lithium’s *isotopes* (e.g., Li-6 and Li-7) natural kinds? A yes indicates **microstructural essentialism**, where kinds require indivisible structural essences (e.g., nucleon count). A no signals **conventionalism/deflationism**, where all categorizations reflect human interests, not natural joints.  

  ### Notes on Gaps and Limitations  
  - **Unoccupied leaves**: Positions demanding jade’s unity but lithium’s splitting (after affirming species) are incoherent; others (e.g., accepting jade/lithium but rejecting species) are unexplored or unattractive.  
  - **Indistinguishable positions**: The tree cannot separate conventionalism from radical skepticism—both reject all cases. It also conflates HPC variants that accept/reject jade, as realists debate whether multiple structures undermine "homeostasis."  
  - **Diagnostics**: Cases test how you weight projectibility (gerrymander), historical continuity (species), microstructure (lithium/jade), and whether naturalness requires unity-in-mechanism.  

  This tree uses your intuitions about jade, species, lithium, and gerrymandered kinds to map positions—revealing where we agree, diverge, or venture into uncharted territory. I look forward to discussing where your path leads!  

  Warmly,  
  [Your Name]
