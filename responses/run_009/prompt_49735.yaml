prompt: |-
  I'm a final-year PhD student and in three weeks I'm giving the departmental colloquium that's basically functioning as my job talk, so this has recently gone from an abstract interest to something that actually matters for my life. The position I'm defending: when you're unsure between moral theories, you shouldn't just act on whichever theory you currently lean toward — you should treat your decision like a parliament where every theory you have some credence in gets representation, roughly propotional to that credence. But I add two twists that are the actual contribution of the talk: (1) the vote shares are issue-specific rather than global, so a theory's weight varies with the kind of question on the floor — on whether some harm counts as a permissible side effect, the constraint-friendly theories get extra weight, whereas on how to weigh competing outcomes against each other the aggregative theories do; and (2) there's a constitutional tier sitting above the voting: anything that every theory I give non-trivial credence to forbids is off the agenda before parliament even convenes, and anything all of them permit passes without a vote, so the parliament only ever actually votes on a contested middle band. My pitch is that this explains a felt difference we all have — some moral disagreements seem like ordinary political horse-trading, others seem like they're just not up for a vote at all.

  The audience is my department, which is mostly ethicists, and I know them well enough to predict trouble. There are two pretty hard-line Kantians, one Scanlon-flavored contractualist who thinks the whole thing is moot because permissibility is fixed by principles nobody could reasonably reject — and I suspect she'll press that my constitutional tier is either trivial or question-begging, and honestly I can't yet tell which, which scares me. Then there's a consequentialist who keeps telling me the framework is just expected-value maximization over moral theories with the numbers filed off, and a visitor from political theory who cornered me at a reception to say the parliament metaphor is a sleight of hand: proportional representation gets whatever authority it has from actual voters, and nobody voted for my theories, so the metaphor borrows a legitimacy it never earned. Plus the grad students, who will absolutely ask about infinite credences or infinite ethics if I leave any opening.

  Draft my Q&A prep sheet: the objections in roughly the order they'll actually arrive, phrased the way each of these specific people would put it, ranked by how much damage each could do; for each one, a reply I can deliver in about two minutes, plus a note on where that reply is soft and what I should concede up front rather than fight. Also flag the question I'm quietly hoping nobody raises — my fear is it's the one about how I can set the issue-specific weights at all without already deciding, in advance, the very questions the parliament was supposed to settle for me. But if you can see a worse one lurking in my setup, tell me straight, don't sugarcoat it.
reasoning: |-
  Okay, the user is a final-year PhD student preparing for a job talk colloquium. Their thesis presents a moral decision-making model where conflicting theories get proportional representation like a parliament, with two unique twists: issue-specific vote weights and a constitutional tier that pre-screens universally forbidden/permitted actions. They need Q&A prep tailored to their department's known critics.

  Hmm, analyzing the audience dynamics first. The hardline Kantians will attack moral compromise as incoherent - this is high-risk because it challenges the core metaphor. The Scanlonian contractualist will likely question the constitutional tier's foundations, which could unravel the framework if not handled carefully. The consequentialist's "expected value in disguise" critique seems moderate but needs differentiation. The political theorist's legitimacy objection is philosophically deep but perhaps less damaging in an ethics setting. The grad students' infinity problems are technical landmines.

  For the Kantians, I should emphasize that the parliament operates at the meta-level of decision-procedures, not compromising duties themselves. But concede that deontic conflicts remain theoretically unresolved. For the contractualist, I'll position the constitutional tier as a practical necessity for pluralists, not a foundational solution - though this leaves the "trivial or circular" charge half-unanswered. The consequentialist comparison requires clarifying how issue-specific weighting differs from expected value. The legitimacy metaphor critique might be sidestepped by reframing representation as epistemic rather than democratic.

  The elephant in the room is the weight-setting problem: if issue-specific weights presuppose substantive moral judgments, the whole model risks circularity. This needs a frank admission that some prior intuitions are unavoidable, positioning the model as a refinement tool rather than a ground-up solution. An even deeper worry might be how the constitutional tier handles fundamental moral uncertainty - what if no theory shares common ground?

  Noticing the user's palpable anxiety about the contractualist's objection in particular. They're right to fear it - if the constitutional tier requires antecedent knowledge of permissibility, it collapses. The best defense is to frame it as a coherence check for one's existing theory-set, but this won't satisfy a foundationalist like the contractualist. Should advise strategic concession here.

  For delivery, each reply must stay under two minutes with clear signposting. The grad students' infinity questions deserve short acknowledgments plus "let's discuss offline" deflections. Overall tone should be collaborative - these are potential colleagues testing rigor, not enemies. The hidden card is admitting the model depends on some pre-theoretical intuitions, which may disappoint those seeking full neutrality but is philosophically honest.
answer: |-
  Here's your Q&A prep sheet, structured for maximum damage control. I've ranked objections by potential impact, phrased as your critics would, with concise replies and vulnerability notes. The lurking nightmare question is flagged at the end – and yes, there's one worse.

  **Q&A Prep Sheet: Moral Parliament Defense**

  **Objection 1 (Highest Damage - Kantian #1): "This 'parliament' is morally corrupt from the outset. Deontology isn't a policy preference; it's a constraint. Compromising a perfect duty (e.g., 'don't torture innocents') for 10% consequentialist credence means you've *already* violated duty. Your model licenses evil proportionate to your confusion."**
  *   **Reply (90 sec):** "You're right that the parliament *cannot* vote to violate a core perfect duty *if that duty holds*. But the parliament operates precisely *because* I'm uncertain *which* duties hold, or how they apply. It's not compromising a known duty; it's adjudicating uncertainty about *what the duties even are* in this complex situation. The constitutional tier *protects* actions universally forbidden – if deontology is correct, torture *is* off the table. The vote only occurs where my uncertainty makes the *existence or application* of such a duty genuinely contested *for me*."
  *   **Where it's Soft:** Concedes the model fails for someone *certain* of a deontological duty. Implies duties are "true" independently, which might beg questions against radical uncertainty. Doesn't fully resolve how tiny credences in horrific theories are handled (though the constitutional tier *should* catch universally condemned acts).
  *   **Concede Up Front:** "For an agent certain of their moral theory, this model is unnecessary and potentially pernicious. It's designed *only* for contexts of genuine inter-theoretic uncertainty."

  **Objection 2 (Very High Damage - Scanlonian Contractualist): "Your 'constitutional tier' is either trivial or viciously circular. If 'non-trivial credence' means I think a theory *might be correct*, then forbidding what *all* such theories forbid requires me to *already know* what's forbidden! How can I know what all contenders forbid without having *already settled* permissibility? If it doesn't require that, it's just describing my current ignorance – useless."**
  *   **Reply (90 sec):** "The constitutional tier doesn't *determine* permissibility; it's a *coherence check* on my current state of uncertainty. I don't need to know the *truth* about permissibility, only the *logical implications* of the theories I currently hold as live options. If I understand Theory A forbids X, and Theory B forbids X, and I give non-zero credence to both, then *for me, right now*, X is off the table *as a matter of consistency with my own epistemic state*. It leverages the *internal logic* of the theories I entertain, not antecedent moral truth."
  *   **Where it's Soft:** Doesn't fully resolve how we *know* the implications of complex theories in novel situations (the 'application uncertainty' problem). Risks making the tier overly dependent on my current (possibly flawed) understanding of the theories. The 'non-trivial credence' threshold remains fuzzy.
  *   **Concede Up Front:** "You're right that this doesn't provide a *foundation* for moral truth. It's a decision procedure for uncertainty, reliant on my current understanding of the theories I find plausible. It's about managing *my* epistemic limitations, not discovering moral facts."

  **Objection 3 (High Damage - Political Theorist): "The parliamentary metaphor smuggles in illegitimate authority. Real parliaments derive legitimacy from the consent of the governed. Your 'theories' didn't elect you; you imposed them. Proportional representation only makes sense if the represented entities *have* a claim to govern. Why should my 15% credence in utilitarianism get 15% of the vote? That's arbitrary, not legitimate."**
  *   **Reply (75 sec):** "You've nailed a key disanalogy. The metaphor isn't meant to borrow *democratic legitimacy* but *epistemic weight*. Think of it less like a governing parliament and more like a panel of expert advisors I'm uncertain between. My credence reflects my (fallible) assessment of each advisor's likelihood of being correct *on this kind of issue*. Allocating influence proportionally is my best guess at minimizing expected moral error, not an assertion of their inherent right to rule me. It's about aggregating epistemic force, not political authority."
  *   **Where it's Soft:** The "expert advisors" framing still needs justification for why credence = epistemic weight in this proportional way. Doesn't fully address the core "why *this* aggregation rule?" challenge.
  *   **Concede Up Front:** "The metaphor *is* imperfect. It's primarily a heuristic for visualizing a method of aggregating uncertain judgments under moral uncertainty. The core justification is instrumental: aiming to minimize expected moral error."

  **Objection 4 (Moderate Damage - Consequentialist): "This is just expected moral value maximization with extra steps. Your 'credences' are probabilities, your 'vote shares' are weights, and the 'parliament's decision' is the action with highest expected moral value given your probability distribution over theories. Why dress up standard decision theory in political drag?"**
  *   **Reply (60 sec):** "Two key differences make it *more* than just EMV. First, **issue-specific weighting**: EMV typically uses a *global* credence. My model recognizes that a theory's reliability might vary by *question type*. A theory strong on rights might get *more* weight on a deontic question than its global credence suggests, and *less* on an aggregative one. Second, the **constitutional tier**: EMV would still calculate a tiny expected value for universally forbidden acts if I have even minuscule credence in a theory that permits them. My tier blocks those acts categorically, reflecting a different risk attitude towards certain kinds of potential error."
  *   **Where it's Soft:** The issue-specific weighting *could* be incorporated into a more sophisticated EMV model. The constitutional tier *is* a distinct feature, but its justification (avoiding catastrophic error?) needs reinforcement.
  *   **Concede Up Front:** "On many standard cases, the outputs will align with a sophisticated EMV approach. The value is in the structure: highlighting the need for domain-sensitive weighting and providing a clear mechanism for absolute constraints derived from uncertainty itself."

  **Objection 5 (Variable Damage - Grad Student - Infinity): "What if I have non-zero credence in theories requiring infinite stakes (e.g., Pascal's Mugging variants, some total utilitarianism with infinite futures)? Doesn't your parliament collapse, as even tiny credences in infinitary theories swamp all others?"**
  *   **Reply (45 sec):** "This is a serious challenge not just for me, but for *any* decision procedure under moral uncertainty involving infinities. My model inherits this problem. Short reply: The constitutional tier *might* help if all non-infinitary theories agree on forbidding/permitting an act involving purported infinities. For true stalemates, we likely need principled ways to handle infinite ethics or discount certain infinitary claims – an active research area I rely on but don't resolve here."
  *   **Where it's Soft:** It's a handwave. This *is* a major weakness inherited from the literature.
  *   **Concede Up Front:** "You're absolutely right. Infinities pose a profound, unsolved problem for decision-making under moral uncertainty generally. My model doesn't magically solve it but relies on the broader field making progress."

  **Objection 6 (Variable Damage - Grad Student - Credence Setting): "How do you *determine* the issue-specific weights? Doesn't assigning more weight to 'constraint-friendly' theories on side-effect questions *presuppose* you already think constraints matter *more* in that domain? How is this not circular?"**
  *   **Reply (The Lurking Nightmare - 90 sec):** "This cuts deep. The weights *do* require a prior judgment *about the comparative reliability or applicability* of different theories *to different question types*. It's not a judgment about the *moral truth* of the specific case, but a meta-judgment about the *kinds of reasoning* each theory excels at. For instance, I might judge consequentialism systematically better at comparing well-defined outcomes, while deontology better captures agent-centered restrictions, based on theoretical coherence, past intuitive performance, or even sociological agreement among experts *on domain competence*. It's unavoidably somewhat circular, but it's a higher-order circle: structuring *how* I apply my uncertain first-order judgments, not pre-deciding them. It's an attempt to make my meta-uncertainty explicit and structured."
  *   **Where it's Soft:** It admits significant circularity. Justifying these meta-judgments is hard without appealing to the very intuitions the model is supposed to help navigate.
  *   **Concede Up Front:** "This *is* the model's most vulnerable point. Setting weights requires prior meta-level philosophical judgments about the domains of competence for different theories. It doesn't offer a neutral starting point, but rather a framework for refining and structuring application *after* those initial (fallible) judgments are made."

  **The WORSE Lurking Question (The Constitutional Tier's Foundation):**
  *   **The Question:** "Your constitutional tier blocks acts *all* non-trivially credited theories forbid. But what if I have *non-trivial credence* in **fundamentally incompatible foundational moral theories** (e.g., Robust Moral Realism vs. Error Theory vs. a specific Divine Command Theory)? What shared moral content can possibly exist for the tier to latch onto? Doesn't the tier *presuppose* a level of moral common ground that deep foundational uncertainty explicitly denies?"
  *   **Why it's Worse:** It attacks the *possibility* of the constitutional tier doing any work under the *deepest* kind of moral uncertainty. If there's *no* overlap in what different meta-ethical theories forbid (e.g., an Error Theorist forbids *nothing*, a Divine Command Theorist forbids only what God forbids), the tier becomes empty. Your model collapses into pure voting on *everything*, even core prohibitions, for agents with radical foundational uncertainty. This undermines the "felt difference" you cite for non-negotiable prohibitions.
  *   **Potential Reply (If Asked - Gulp - 90 sec):** "This targets a crucial limit. The model works best for *normative-ethical* uncertainty *within* a broadly cognitivist, truth-apt stance. For radical meta-ethical uncertainty (e.g., credence in non-cognitivism or error theory), the constitutional tier *does* weaken significantly. Actions forbidden by all *normative* theories I credit might still be 'blocked,' but the *force* of that block diminishes if I think *all* normative claims might be false or non-truth-apt. The tier relies on *some* minimal shared normative substance or structure among the theories I consider live options. Deep meta-ethical doubt shrinks that common ground." *(Concede heavily: This is a major limitation for comprehensive uncertainty.)*

  **Q&A Strategy Summary:**
  1.  **Acknowledge Legitimacy:** Start replies by affirming the critic's core insight ("You're right that...", "That's a deep challenge...").
  2.  **Reframe to Core Idea:** Redirect to the model's purpose: managing *uncertainty* via structured aggregation of *current epistemic state*.
  3.  **Highlight Twists:** Explicitly contrast with EMV (issue-specific weights, constitutional tier).
  4.  **Concede Strategically:** Admit limitations early (works only under uncertainty, requires prior meta-judgments for weights, weakens under radical foundational doubt).
  5.  **Deflect Infinities:** Acknowledge the problem, state it's inherited, and punt to broader research.
  6.  **Control Scope:** Emphasize it's a decision *procedure*, not a moral *theory* or foundation.
  7.  **Watch the Clock:** Practice replies to be crisp. Use signposting: "Two points in response..."

  **Good luck!** Your model is clever and addresses a real need. Owning its limitations under pressure will demonstrate philosophical maturity. Focus on the core insight: structuring uncertainty beats ad-hoc leaning. You've got this.
