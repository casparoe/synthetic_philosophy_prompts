answer: |-
  ### Game Design: Unilateralist's Curse Simulation  
  **Core Mechanics**: Players face asymmetric risks around "publishing" based on noisy private signals. The game forces them to experience how one optimistic actor can impose outcomes on the group.  

  ---

  ### **Phase 1: Unilateral Publishing (8 Rounds)**  
  **Goal**: Make the curse emerge organically. No lecture upfront—players discover the pattern through play.  

  #### **Materials**:  
  - 1 coin (state determination)  
  - 1d10 die (signal generation)  
  - Whiteboard (track rounds, payoffs, outcomes)  
  - Index cards (private signals)  

  #### **Rules**:  
  1. **Hidden State Setup (True "Safety" of Research)**:  
     - Flip a coin:  
       - **Heads → SAFE** (Publish = beneficial)  
       - **Tails → DANGEROUS** (Publish = catastrophic)  
     - *Record state secretly*.  

  2. **Private Signals (Noisy Evidence)**:  
     - Each player gets a private signal via d10 roll. Accuracy = 70%:  
       - **If SAFE state**: Roll 1–7 → "SAFE" signal; 8–10 → "DANGEROUS" signal.  
       - **If DANGEROUS state**: Roll 1–7 → "DANGEROUS" signal; 8–10 → "SAFE" signal.  
     - *Write signals on index cards and distribute privately*.  

  3. **Player Actions (Sequential Publishing)**:  
     - Players take turns (fixed order, rotate start each round).  
     - On your turn:  
       - **Publish**: Reveal your signal and commit the *entire group* to publishing.  
       - **Pass**: Do nothing.  
     - **Game ends when one player publishes OR all pass**.  

  4. **Payoffs (Asymmetric Points)**:  
     | State       | Outcome          | Points per Player |  
     |-------------|------------------|-------------------|  
     | **SAFE**    | ≥1 publishes     | +10               |  
     | **SAFE**    | No one publishes | -2 (missed opportunity) |  
     | **DANGEROUS**| No one publishes | 0 (safe inaction) |  
     | **DANGEROUS**| ≥1 publishes     | -20 (catastrophe) |  

  5. **Why 8 Rounds?**:  
     - Probability dictates ~4 SAFE and ~4 DANGEROUS rounds (P=0.5).  
     - With 14 players, expected false positives in DANGEROUS rounds:  
       - P(≥1 false "SAFE" signal) = 1 - (0.7)^14 ≈ **99%** (curse appears reliably).  
     - Lets players see patterns without noise dominating.  

  ---

  ### **Phase 2: Group Decision Rule (3 Rounds)**  
  **Goal**: Contrast unilateral actions with structured group decisions.  

  #### **Rules**:  
  1. **Group Designs a Rule**:  
     - After Phase 1, groups brainstorm rules (e.g., majority vote, veto system, designated reviewer).  
     - Rule must be clarified: e.g., "Vote after sharing signals," "One designated decider."  

  2. **Modified Play**:  
     - Same state/signal generation as Phase 1.  
     - Group applies their rule to decide publication (no sequential turns).  
     - Payoffs identical to Phase 1.  

  3. **Debrief Question**:  
     - *"What did you gain (safety) and lose (efficiency)?"*  

  ---

  ### **Debrief Structure**  
  1. **Name the Curse**:  
     - Define *unilateralist’s curse*: "When one optimistic actor’s action binds the group, despite most members having contrary evidence."  

  2. **Map Game → Theory**:  
     - **Who was the unilateralist?** Identify first publisher in each round.  
     - **Why optimism wins**:  
       - In DANGEROUS rounds, publishers likely rolled false "SAFE" signals (8–10 on d10).  
       - Compute: P(≥1 false "SAFE" signal | DANGEROUS) for 14 players = 99% vs. 3 players = 58%.  
     - **Cost asymmetry**: -20 for false publish vs. -2 for missed opportunity → risk aversion fails.  

  3. **Lab Parallel**:  
     - **Connection**: Preprint near-miss = almost publishing on a false "SAFE" signal. Reviewer = signal correction.  
     - **Breakdown**: Real-world stakes involve reputations/harm—not just points.  

  4. **Open the Conversation**:  
     - *"In our lab, how can we design a rule that catches false ‘SAFE’ signals without requiring three reviews? What would Phase 2’s solution look like here?"*  
     - Focus on *system design*, not blaming individuals.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Publishing out of boredom/spite**:  
     - **Fix**: Emphasize payoffs: *"Your points affect the whole group’s ‘grant funding.’ Lowest scorers buy coffee next week!"*  

  2. **Sandbagging (always passing)**:  
     - **Fix**: Highlight tradeoffs: *"Notice how passing in SAFE rounds costs everyone -2. What’s the long-term cost of over-caution?"*  

  3. **Loudest players dominate Phase 2**:  
     - **Fix**: Structure discussion:  
       - *"Everyone writes their signal anonymously before debating."*  
       - *"Assign a facilitator and timekeeper."*  

  4. **Signal confusion**:  
     - **Fix**: Simplify rolls: Pre-generate signals for rounds 1–4 to save time.  

  ---

  ### **What the Game Can’t Capture**  
  1. **Real-world stakes**:  
     - Reputational damage, ethical guilt, and irreversible harm are reduced to points.  
     - **Supply in debrief**: *"In reality, a false publish could end careers or endanger lives—not just -20 points."*  

  2. **Signal quality variance**:  
     - In labs, senior scientists have more accurate "signals." Game assumes uniform 70% accuracy.  
     - **Supply**: *"How should we weight signals from PI vs. first-year students?"*  

  3. **Iteration impossibility**:  
     - Real publishing decisions are final; no "next round."  
     - **Supply**: *"Unlike the game, we can’t undo a preprint. How does permanence change incentives?"*  

  ---

  ### **Logistics & Timing**  
  - **Phase 1 (8 rounds)**: 30 mins (3–4 mins/round).  
  - **Phase 2 (3 rounds)**: 15 mins (5 mins/round including rule discussion).  
  - **Debrief**: 20 mins.  
  - **Total**: 65 mins (10 mins buffer for setup).  

  **First-run Tip**: Dry-run the dice/card flow with a colleague. Use the whiteboard to track:  
  | Round | State | Publisher? | Outcome | Payoff |  
  |-------|-------|------------|---------|--------|  

  This makes debrief data visible and visceral.  

  --- 
  The game creates a safe space to discuss your lab’s near-miss. By naming the curse *after* play, you avoid defensiveness. Phase 2’s collaborative rule-building bridges gameplay to policy—without pointing fingers.
