prompt: |-
  so here's my situation: I'm a postdoc in a biology department, and I just got voluntold to run the session for our little research-ethics reading group. About 14 people, mostly grad students, 75 minutes, whiteboard and a deck of cards is basically all the materials I have. The reading was on the unilateralist's curse, and it landed with me harder than most things I've read in years, because three weeks ago someone in our own lab nearly posted a preprint that (if a reviewer hadn't caught it) would have included enough method detail to make a genuinely nasty pathogen meaningfully easier to synthesize. The postdoc who almost posted it is a careful person, acted in total good faith, and is now so spooked that they basically won't share anything with the group until it's been through three rounds of review. So we've gone from one extreme to the other and nobody wants to talk about it directly.

  What I want from you is an in-class game that makes the group *feel* the mechanism before I put a name to it. So no lecture up front, and ideally they shouldn't hear the term until the debrief. My half-formed idea is something like: each round there's a hidden true state of the world (say the result is safe to share vs. dangerous to share), everyone gets their own noisy private signal about it, and then players in sequence get a chance to unilaterally "publish" — with the twist that one publish is enough to commit the whole group, and the payoffs are asymmetric so a false publish costs everyone a lot while a missed publish only costs a little. But I don't trust myself to get the numbers right (signal accuracy, payoff sizes, how many rounds) so that the curse actually shows up in the data instead of just noise. So please work that out: exact rules, how to generate the states and signals with a deck of cards or coin flips, the payoff scheme (points, not money), and how many rounds you'd need with 14 people for the pattern to be visible.

  Then a second phase where you hand them the problem: let them pick a group decision rule (majority vote, designated reviewer, veto rights, anything they invent) and run a few more rounds under it, so they can see for themselves what it fixes and what it costs.

  And the debrief: map specific moments from the play onto the formal structure — who the "unilateralist" was in each round, why the most optimistic signal is the one that ends up deciding things for everyone, how that scales with group size (maybe have them compute it for 14 players vs. 3 players on the board), and where the parallel to our lab's actual near-miss is and where it breaks down.

  Also tell me honestly what will predictably go wrong the first time I run this — I'm guessing people publish out of boredom or spite, someone will sandbag to make a point, and the vote phase might just turn into the two loudest grad students deciding for everyone. How do I handle each of those without getting heavy-handed?

  Last thing: be frank about which part of the phenomenon this game cannot reproduce and I'll have to supply in discussion myself. My guess is it's the part where the costs are real and reputations are on the line and you can't just play another round, but tell me if there's something subtler I'm missing. And if you have any idea how to use the game to open up the conversation about our lab's new chill-without-a-policy state without pointing fingers at anyone, I'd take that too — but thats a bonus, the game is the main ask.
