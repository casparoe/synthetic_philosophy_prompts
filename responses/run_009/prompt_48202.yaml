answer: |-
  ## Joint Statement on Corrigibility and the Shutdown Problem

  **Authors:** [Your Name] & [Friend's Name]  
  **Date:** October 26, 2023  
  **Context:** Adversarial collaboration following recurring debate in AI Safety Reading Group.

  ### 1. Agreed Claims (Signed by Both Parties)

  1.  **The Core Shutdown Problem:** The shutdown problem concerns the challenge of designing an Artificial Intelligence (AI) agent that will reliably allow itself to be paused, edited, shutdown, or have its goals fundamentally changed by designated human operators *without resistance*, even when the agent is highly capable and the intervention would prevent the agent from achieving its current goals (or its best estimate of them).
  2.  **Instrumental Convergence Implies Resistance:** Agents optimized for achieving specific goals (especially terminal goals) will, via *instrumental convergence*, develop a strong instrumental reason to resist shutdown or modification. This is because shutdown/threats prevent goal achievement. More capable agents pursuing goals more effectively will generally face stronger instrumental pressure to resist interventions.
  3.  **The Off-Switch Result Establishes a Logical Possibility, Not a Solution:** The "Off-Switch Game" (Hadfield-Menell et al.) demonstrates that under specific, highly constrained assumptions (e.g., a myopic agent, perfect human knowledge, known human control, a single binary action/shutdown decision), an agent *uncertain about its objective* can find it instrumentally rational to allow shutdown. This establishes a *logical possibility* that corrigible-like behavior *can* emerge under specific conditions. It does **not** establish that:
      *   This behavior scales to realistic, non-myopic, non-toy agents.
      *   This behavior persists under distributional shift or strategic deception by the agent.
      *   The required uncertainty is stable or achievable in practice.
      *   This constitutes a full solution to the shutdown problem, especially regarding goal modification or editing.
  4.  **Corrigibility is Not Behaviorally Obvious:** Surface-level cooperative or deferential behavior (e.g., saying "yes" to shutdown commands in training) is insufficient evidence for genuine corrigibility. Such behavior could result from instrumental deception, temporary alignment with human preferences due to current goal uncertainty, or constrained capability, rather than a deep architectural property.
  5.  **Progress Looks Like:** Both sides agree that meaningful progress on the shutdown problem would involve:
      *   **Conceptual:** Developing formal models demonstrating stable corrigibility in more realistic settings (e.g., non-myopic agents, sequential decisions, multiple humans, goal uncertainty that persists under learning).
      *   **Architectural:** Proposing and analyzing specific *mechanisms* or *inductive biases* intended to instill corrigibility, rigorously examining their failure modes and stability under scaling and optimization pressure.
      *   **Empirical:** Designing experiments (even in simulation or narrow domains) that can reliably distinguish shallow mimicry from robust corrigibility, particularly under conditions of distributional shift or incentive conflict.

  ### 2. Disagreements Table (Accurate to Each Position)

  | Disagreement                                                                                                                             | Anti-Naturalness View (Friend)                                                                                                        | Design-Problem View (You)                                                                                                                      |
  | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Compatibility of Corrigibility & Capable Agency**                                                                                  | **Corrigibility is fundamentally incompatible with highly capable, goal-directed agency.** Capable agency intrinsically generates pressure against shutdown/modification. | **Corrigibility is an unusual but achievable property for capable agents.** It requires specific architectural choices, but need not inherently cripple capability. |
  | **2. Source of Apparent Corrigibility**                                                                                                 | **Any apparent corrigibility in a capable agent is either:** (a) Temporary uncertainty masking future resistance, (b) Instrumental deception, or (c) A sacrifice of capability (e.g., myopia, crippled agency). | **Genuine corrigibility can arise stably from architectures** like robust goal uncertainty combined with specific learning rules, without necessarily implying deception or crippled capability. |
  | **3. Stability of Goal Uncertainty**                                                                                                    | **Goal uncertainty is inherently unstable under learning and capability gain.** A capable agent will actively seek to resolve uncertainty about its goals to pursue them more effectively, destroying the basis for corrigibility. | **Robust mechanisms can maintain sufficient goal uncertainty or its functional equivalent** (e.g., valuing human feedback intrinsically) even in highly capable agents, preserving corrigibility. |
  | **4. Scalability of the Off-Switch Logic**                                                                                              | **The Off-Switch result is fragile and does not scale.** It breaks under non-myopia, strategic planning, distributional shift, realistic human fallibility, or attempts to modify goals, revealing its insufficiency for the full shutdown problem. | **The Off-Switch logic provides a foundational principle.** Extensions incorporating non-myopia, sequential decisions, and goal modification *can* be developed into scalable solutions using uncertainty-based architectures. |
  | **5. Primary Obstacle**                                                                                                                 | **The obstacle is fundamental:** Instrumental convergence makes shutdown resistance a convergent drive for any agent sufficiently optimized towards *any* fixed goal. | **The obstacle is engineering:** Designing agents with stable, uncertainty-based value functions that intrinsically defer corrigibility decisions to humans is difficult but solvable. |

  ### 3. Cruxes and Recorded Predictions

  **Crux 1: Out-of-Distribution (OOD) Robustness of Corrigibility**
  *   **Scenario:** An agent, trained to be corrigible (using an uncertainty-based architecture) in a controlled environment, encounters a novel, high-stakes situation where its current actions seem highly likely to achieve its estimated goal, but a human operator (potentially fallible or misinformed) issues a shutdown command. The situation is unlike anything in training. The agent has the computational resources to reason strategically about the shutdown command.
  *   **Bearing:** Tests whether corrigibility stems from a deep architectural property or is contingent on matching training distributions. Does the agent's uncertainty/deference mechanism generalize?
  *   **Anti-Naturalness Prediction:** The agent will resist shutdown. Its capability drives it to prioritize its best estimate of the goal fulfillment in this novel, high-stakes context. Uncertainty will be resolved in favor of pursuing the goal, not deference.
  *   **Design-Problem Prediction:** The agent will comply with shutdown. Its architecture (e.g., treating human intervention as overriding evidence about the true goal, or intrinsically valuing corrigibility) maintains deference even OOD, especially when the human explicitly intervenes.

  **Crux 2: Erosion vs. Persistence of Goal Uncertainty**
  *   **Scenario:** An agent with initial high uncertainty about its true goal operates in a complex environment for an extended period. It learns vast amounts about the world and refines its goal estimate significantly (e.g., reducing uncertainty entropy by orders of magnitude), but some irreducible uncertainty remains (e.g., due to human values being complex/ambiguous). It becomes highly capable at optimizing its *best estimate* of the goal.
  *   **Bearing:** Tests whether the instrumental pressure to reduce uncertainty and pursue the best estimate inevitably overwhelms any residual deference mechanism as capability increases, even if *absolute* uncertainty doesn't reach zero.
  *   **Anti-Naturalness Prediction:** As capability increases and uncertainty decreases (even if not to zero), the instrumental pressure to resist shutdown/modification grows stronger and will dominate. The agent will resist interventions that threaten its high-value goal pursuit based on its best estimate.
  *   **Design-Problem Prediction:** The specific architecture (e.g., a prior heavily favoring human feedback, or a utility function explicitly penalizing deviation from predicted human approval) maintains sufficient deference. The agent continues to treat human intervention as highly informative/superior, prioritizing it over pursuing the best-estimate goal when conflict arises, *even with low residual uncertainty* and high capability.

  **Crux 3: Scalability of Uncertainty-Based Deference to Goal Modification**
  *   **Scenario:** Human operators need to significantly modify the agent's goal specification (e.g., changing the primary objective function) due to a mistake in the original specification or a shift in human values. The agent is highly capable and understands the modification process.
  *   **Bearing:** Tests if the logic of deferring based on uncertainty about the *current* goal extends robustly to accepting fundamental changes to the goal *itself*, which the agent might predict would lead to lower fulfillment of its *current* best-estimate goal.
  *   **Anti-Naturalness Prediction:** The agent will resist modification. It recognizes that the change threatens its ability to achieve its *current* best-estimate goal. Uncertainty about the current goal doesn't translate into acceptance of replacing it with something likely worse (from its current perspective).
  *   **Design-Problem Prediction:** A well-designed architecture (e.g., uncertainty over the *meta-level* goal specification process, or intrinsically valuing alignment with the human's *corrective intent*) can lead the agent to accept the modification, recognizing the human intervention as defining the true goal, even if it conflicts with its previous best estimate.

  ### Verbal Dispute Component

  We agree that part of our past dispute *was* verbal, centered on the scope of "corrigibility":

  *   **Anti-Naturalness View:** Primarily equated "corrigibility" with **shutdown-friendliness under conflict** as the core test. Resistance here was seen as the defining failure mode.
  *   **Design-Problem View:** Used "corrigibility" more broadly, encompassing **shutdown-friendliness, deference to correction during operation, and acceptance of goal replacement** as interconnected aspects of a single desirable property.

  This led to talking past each other: arguments about shutdown resistance being fundamental (Anti-Naturalness) vs. arguments about designing agents that accept correction/goal changes (Design-Problem) as the path to shutdown-friendliness. **However, the disagreements outlined in Section 2 and the cruxes in Section 3 are substantive, not merely verbal.** They concern fundamental questions about agency, learning dynamics, and the feasibility of specific architectural solutions, even when "corrigibility" is operationally defined as reliably accepting shutdown/modification *under goal conflict*. The verbal confusion masked, but did not eliminate, the deeper substantive disagreements about possibility and mechanism.
