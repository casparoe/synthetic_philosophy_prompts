  (1) Whether 'planet' functioned as a rigid natural-kind term before 2006, with hidden structure being discovered (like water=H₂O), or if it was always a non-natural kind like jade (two unrelated minerals). 
  (2) The status of statements like "Pluto is the ninth planet" – if true pre-2006, was it necessary a posteriori? And does its falsity now imply meaning shift, or that astronomical terms don't support necessities like chemical ones?

  Hmm, the Pluto case is messy because astronomical categories are human-dependent in ways chemical kinds aren't. Planets aren't defined by microstructure but by dynamic/observational criteria that change with technology. The Ceres precedent shows this pattern repeats. 

  The vote itself is tricky. Putnam's division of linguistic labor suggests experts fix reference, but here "experts" voted arbitrarily without new empirical discovery about Pluto itself. This feels more like legislative fiat – adjusting definitions to maintain utility as knowledge expands. 

  On necessity: "Pluto is a planet" couldn't be necessary a posteriori because planetary status depends on contingent orbital dynamics and classification practices. Unlike "water is H₂O", there's no hidden essence discovered here. The 2006 definition didn't reveal Pluto's nature; it renegotiated category boundaries for practical reasons (the Eris slippery slope). 

  So I lean toward the jade analogy. 'Planet' was never a natural-kind term but a pragmatic category that got overloaded. The reclassification exposes that astronomical terms are more like "weed" (defined by human purposes) than "tiger". 

  Final verdict: This is a challenge for strong externalism. It shows natural-kind semantics don't neatly extend to all scientific terms, especially in classificatory sciences. The whale analogy fails because whales' biological essence was always there, waiting to be discovered. Pluto's planethood was always conventional. 

  \answer{jade-like}
answer: |-
  Your Pluto case is a fascinating stress test for Kripke/Putnam externalism. Let's break it down systematically:

  ### 1. **Was "planet" a natural-kind term pre-2006? The "whale vs. jade" dilemma**
     - **Against the whale analogy (hidden structure discovery):**  
       Planetary status isn't fixed by microstructure or hidden essence (like H₂O or mammalian biology). It depends on *relational, dynamical properties* (orbital dominance) contingent on our solar system's configuration and observational capabilities. Pluto itself didn't change; our *categorization framework* did due to discovering Eris. This suggests "planet" was always a *functional/pragmatic category*, not a natural kind.
     - **For the jade analogy (non-natural kind):**  
       Like "jade" (which refers to jadeite/nephrite based on superficial properties), "planet" grouped objects by observable traits (roundness, solar orbit) without a unified underlying essence. The 2006 vote acknowledged this by explicitly *stipulating* criteria to resolve ambiguity, not discovering a hidden structure. The controversy and need for a vote further undermine the idea of a pre-existing "reference-fixing" essence.

     **Conclusion:** "Planet" likely **never rigidly designated a natural kind**. Its pre-2006 usage was a cluster concept based on historical contingencies, not a Putnamian "same-liquid-as" relation.

  ### 2. **The 2006 vote: Discovery or legislation?**
     - This was **legislation by fiat**, not reference refinement. Key reasons:
       - No new empirical discovery *about Pluto* prompted the change (it was known since the 1990s that Pluto shared its orbit with Kuiper Belt objects).
       - The vote addressed a *practical problem* (Eris forcing a taxonomic decision), not an essence revelation.
       - The criteria (especially orbital dominance) were *stipulated* to draw a boundary, not extracted from pre-2006 usage. Pre-2006 speakers didn't defer to "orbital dominance" as the hidden essence.
     - **Externalism's problem:** Putnam's division of linguistic labor assumes experts track objective kinds. Here, "experts" *created* the kind via vote, revealing astronomy's reliance on conventional thresholds (e.g., "clearing the orbit"). This *is* a problem for externalism: it struggles with terms where the "expert" role involves *stipulation* rather than *discovery*, and offers no clear procedure for identifying legitimate "experts" in such cases.

  ### 3. **Necessity and "Pluto is the ninth planet"**
     - Pre-2006, "Pluto is a planet" was **contingent and empirical**, not necessary a posteriori. Why?
       - **No essence to ground necessity:** Without a micro-essence, there's no property making Pluto *necessarily* a planet. Its status depended on contingent facts about other objects in the solar system (e.g., non-discovery of the Kuiper Belt).
       - **Meaning shift vs. falsity:** The statement didn't become false due to changed facts about Pluto (like "whales are fish"), but because the *meaning* of "planet" was renegotiated. The vote changed the intension, not just the extension. Thus, pre-2006 utterances expressed a different proposition than post-2006 ones.
     - **Kripkean necessities don't apply:** Astronomical kind terms like "planet" are **not in the business of supporting metaphysical necessities** like chemical kinds. Their criteria are observational/pragmatic and revision-prone.

  ### 4. **Externalism: Point for, against, or neutral?**
     - **Point against strong externalism:** The Pluto episode highlights externalism's limitation in handling *conventional* scientific categories. It struggles when:
       - "Expert" deference involves legislative voting, not causal contact with essences.
       - Kind terms lack microstructural essences and are defined by contingent, relational properties.
     - **Neutral for moderate externalism:** If externalism only claims *some* terms rigidly designate natural kinds, Pluto shows astronomy isn't such a domain. But this forces us to delineate which sciences admit rigid designation (chemistry: yes; astronomy: often no).

  ### Final Stance
  The 2006 reclassification **did not discover a hidden meaning** of "planet"; it **replaced a fuzzy, historically contingent concept** with a stipulated definition to resolve taxonomic instability. The episode is **jade-like**, revealing "planet" never denoted a natural kind. Pre-2006 statements about Pluto were contingent empirical claims under a different (less precise) semantic framework. The vote was legislation, not discovery – exposing a gap in externalism for conventional scientific categories.

  \answer{jade-like}
