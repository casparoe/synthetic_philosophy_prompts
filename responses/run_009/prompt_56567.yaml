  Below is the triage procedure designed for the welfare-review panel. It consists of a fixed sequence of questions with clear decision points. The procedure is grounded in the conceptual distinctions provided (reward as optimization signal vs. subjective state, nociception vs. pain, wanting vs. liking, and unified vs. decentralized signal consumption). Each question has a specified sufficient answer, with hard stops (ending in "NOT REQUIRED") and deferral points (ending in "DEFER TO PANEL"). The goal is to flag only experiments with non-negligible welfare concerns for deeper review, avoiding over-flagging while ensuring defensible logging.

  ### Triage Procedure
  1. **Is the system's architecture decentralized, with no unified "subject" consuming the reward signal?**  
     - *Rationale*: If reward signals are consumed piecemeal by independent subsystems (e.g., parallel updating mechanisms without integration), there is no entity to "experience" suffering.  
     - *Sufficient answer for hard stop*: **Yes** → Log as "NOT REQUIRED".  
