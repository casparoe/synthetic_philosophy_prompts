prompt: |-
  I'm taking a seminar on medieval political thought, and for my term paper I'm reconstructing Aquinas's account of tyrannicide from two texts that my seminar partner, Costanza, insists are in tension. The first is Summa Theologiae II-II, question 42, article 2, where Aquinas argues that sedition is always a mortal sin because it is contrary to the unity of the multitude. In his reply to the third objection — the one that asks how deposing a tyrant can avoid sedition, since the multitude will be divided between those who want to keep him and those who want to remove him — he says, in substance, that a tyrannical government is not just, because it is directed not to the common good but to the ruler's private good, and that consequently there is no sedition in disturbing such a government. The second text is De Regno (On Kingship), chapter 6, where Aquinas concedes that if some men plot together to shake off a tyrant's yoke, the attempt might endanger the multitude, with the result that "if there be no other recourse and if the whole commonwealth would be in danger, it seems that the slaying of the tyrant is not murder." Yet only a few lines earlier, in the same chapter, he writes that "it is not praiseworthy to deliver a multitude from a tyrant if the deliverance itself should entail some danger to the multitude," and he grounds this in the example of David, who, though he had Saul in his power, merely cut off the hem of his garment and then was stricken with remorse for even that.

  Costanza's reading is developmental: on her view, the Summa is the early, more permissive Aquinas, while De Regno is the mature Aquinas who has thought better of it and quietly retracts the sedition doctrine — or at least buries it under prudential hedges. My own hunch is that this is wrong and that the two texts state a single doctrine, but I can't yet make the mechanics explicit, and that is what I want your help with. Please construct the decisive syllogism: an argument in which Aquinas's conclusion in De Regno — that the tyrant's killing is not murder, but only in the desperate case, only when there is no other recourse — follows from the premise that disturbing an unjust, private-good-directed government is not sedition. I want you to make explicit exactly which auxiliary premise does the real work in that inference. Is it a general thesis that private individuals may never intentionally kill (so that only an act ordered to the common good, i.e., an act of the community's public authority rather than a private act of killing, escapes the definition of murder)? Or is it the weaker claim that only the public authority is competent to judge when a particular act falls under public order rather than private vengeance — so that the private individual who kills the tyrant is doing the right kind of act but lacks the standing to do it? And please explain how the thesis that sedition is always a mortal sin survives: is the thought that the tyrant's supporters, being the ones who are seditious, are those who disturb the common good, so that there is an asymmetry between the two factions even when the community is visibly split?

  Costanza also has a fallback objection that I want you to confront head-on rather than sidestep: she grants that the syllogism is formally valid but charges that it is only vacuously so, because the condition "when there is no other recourse" is satisfied by definition in the very case Aquinas is adjudicating — the desperate case — so the syllogism licenses the conclusion only because the conclusion has already been smuggled into the triggering condition. Please assess whether that charge sticks, and if it does not, say precisely why not. Finally, a request about the epistemic status of your answer: at the end, state what would change your mind about the single-doctrine reading — for instance, what kind of further passage, in either text or elsewhere in the Thomistic corpus, would push you toward Costanza's developmental reading or toward the view that De Regno's apparently conditional permission is really a prohibition in disguise — and also flag the step in your reconstruction where you think your reasoning is most likely to fail, so that I know which part of the argument to shore up before submitting the paper.
reasoning: |-
  Okay, this is a dense and fascinating problem in medieval political philosophy. The user is grappling with Aquinas's seemingly contradictory positions on tyrannicide between Summa Theologiae and De Regno, and needs help constructing a decisive syllogism to reconcile them. 

  First, I need to unpack the core tension: the Summa passage suggests disturbing a tyrannical regime isn't sedition since it lacks just authority, while De Regno imposes strict conditions - no other recourse and no greater danger to the commonwealth. The user's seminar partner Costanza sees this as a retraction; the user suspects a unified doctrine.

  Hmm... the key is recognizing Aquinas operates on two distinct levels: the conceptual (what constitutes just authority) and the prudential (how to exercise resistance rightly). The Summa defines sedition, while De Regno addresses practical application. 

  For the syllogism, the auxiliary premise doing heavy lifting is that private individuals lack standing to execute judgment - only public authority may licitly kill. This explains why disturbing tyranny isn't seditious (it's opposing injustice) but killing requires extraordinary conditions (only public authority normally has that power). 

  Ah, and the sedition charge survives asymmetrically: those defending the tyrant are seditious because they uphold private gain over common good, while resisters oppose sedition by definition. Neat solution to the faction problem.

  Now Costanza's clever "vacuous condition" objection... but no, "no other recourse" isn't tautological because Aquinas gives concrete examples of alternatives earlier in De Regno (appealing to higher authority). The condition has substantive content - it means all lawful means exhausted. 

  Epistemically, I'd worry most about the public/private distinction - if Aquinas elsewhere endorsed extrajudicial killing for tyrants, my reconstruction collapses. And for developmental evidence, any late text where he calls Summa's position "reckless" would support Costanza. But barring that, the unity reading holds.

  The user's clearly done deep reading - they even flagged David's garment as key textual evidence. Best to honor that precision while making the logic watertight for their paper. Should emphasize how the "standing" premise resolves the apparent contradiction.
answer: |-
  Here is a decisive syllogism reconciling *Summa Theologiae* II-II, q.42, a.2 and *De Regno* I.6, followed by a systematic defense against Costanza's objections, epistemic flags, and a diagnostic for the argument's vulnerability:

  **Core Syllogism:**
  1. **Premise (from ST II-II.42.2):** Disturbing a government directed *solely* to the ruler's private good (i.e., a true tyranny) is not sedition because it opposes injustice rather than the common good.  
  2. **Auxiliary Premise (Doing the Real Work):** Private individuals lack the *standing and authority* to intentionally kill any person (including a tyrant) as an act of judgment or punishment; only legitimate public authority possesses this power.  
  3. **Conclusion (from De Regno I.6):** Therefore, killing a tyrant is not murder *only* when (a) it is the sole recourse to save the commonwealth from imminent, grave danger, and (b) the act is implicitly or explicitly ordered to the common good *by the community itself* (i.e., as a public act, not private vengeance).  

  ---

  ### Key Explanations:
  1. **The Auxiliary Premise Explained:**  
     This is **not** merely a claim about competence in judgment, but a *metaphysical and moral principle* about agency. Aquinas holds that intentional killing as an act of justice (i.e., not murder) requires *public authority* (ST II-II.64.3). Private persons may kill only in immediate self-defense (where intent is preservation, not punishment). Thus:  
     - Disturbing tyranny (e.g., protest, flight, non-cooperation) is licit for private individuals (per the *Summa*).  
     - *Killing* as a punitive/removal act requires public authority. Where such authority is tyrannically corrupted, the "public" agency devolves to the *multitude as a whole* acting for the common good — but only in extremis.  

  2. **How Sedition Survives Asymmetrically:**  
     The tyrant's supporters *are* seditious. Their faction defends a regime contrary to the common good, thereby "disturbing" true political unity (which is ordered to justice). The anti-tyrant faction opposes this disturbance of true unity. The split is not symmetrical: one side upholds injustice, the other seeks to restore justice. Sedition is sinful precisely because it rebels *against justice*; opposing tyranny is rebellion *for* justice, hence not sedition.  

  3. **Answering Costanza's "Vacuous Condition" Objection:**  
     The charge **does not stick**. "No other recourse" (in *De Regno*) is *not* satisfied by definition in the desperate case. Aquinas specifies concrete alternatives earlier in *De Regno* I.6:  
     - Appealing to a higher authority (e.g., the Roman Senate against Nero).  
     - Enduring tyranny if resistance would cause greater evils.  
     "No other recourse" means *all lawful, less violent means* (e.g., appeal, flight, divine intervention) are exhausted *and* the tyranny is so imminent and grave that delay would destroy the commonwealth. This is a substantive prudential judgment, not a tautology.  

  ---

  ### Epistemic Status & Vulnerability:
  **What Would Change My Mind:**  
  - **For Developmental Reading:** A text where Aquinas *explicitly retracts* ST II-II.42.2's permissibility of disturbing tyranny, or where he labels *De Regno* as a "correction" of his earlier view. Absent this, the burden is on Costanza.  
  - **For 'Prohibition in Disguise':** A passage stating that *only* divine or imperial authority (never the multitude) may depose/kill a tyrant, or where Aquinas calls David's restraint an *absolute norm* (not a prudential example).  
  - **Corpus Evidence:** *De Regno*'s emphasis on the multitude's "danger" overriding justice would gain weight if paired with texts denying the people's authority to act as a corporate body (but cf. ST I-II.90.3 on law requiring common consent).  

  **Most Vulnerable Step:**  
  **The Auxiliary Premise** (private individuals lack standing to kill).  
  - *Why vulnerable?* Aquinas never *explicitly* states this premise in the tyrannicide texts. It is inferred from his general theory of authority (ST II-II.64.3, I-II.90.3) and the David example.  
  - *How to Shore Up:*  
    1. Cite ST II-II.64.3: Private persons may kill only in self-defense (defensive intent ≠ punitive intent).  
    2. Argue that *De Regno*'s "not murder" implies an *exception* to the norm against killing — and exceptions require transference of public authority to the multitude.  
    3. Emphasize David’s remorse: He had Saul at his mercy *as a private man* (not leading Israel), so killing would be murder. Only an anointed king (public authority) could licitly kill Saul.  

  **Final Diagnostic:**  
  Your reconciliation stands unless Costanza can:  
  1. Show that "no other recourse" is circular *in Aquinas's actual examples* (she cannot; he lists alternatives).  
  2. Prove that *De Regno* rejects the *Summa*'s definition of sedition (it presupposes it).  
  3. Demonstrate that Aquinas denies corporate agency to the multitude (he affirms it in lawgiving: ST I-II.97.3 ad 3; I-II.90.3).  

  Focus your defense on the *public/private agency distinction* — this is the linchpin Aquinas assumes but leaves implicit. Fortify it with his general theology of authority, and the two texts cohere as a single, rigorous doctrine.
