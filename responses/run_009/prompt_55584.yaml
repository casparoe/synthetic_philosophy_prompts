  - James and the Permissive view are hard to separate because both allow pragmatic considerations in some underdetermined cases. But James requires a genuine option (live, forced, momentous) and that the option cannot be decided on intellectual grounds. The permissive view does not have these restrictions. The quiz might not cleanly separate them because many scenarios (like the mountaineer and the grieving person) are genuine options, while others (like the lottery) are not. However, in the lottery question (9), if you chose A, you are more permissive than Jamesian.

  **Unoccupied Region:**
  - A view that says we can directly choose beliefs (voluntarism) and that we must always have sufficient evidence (evidentialism) is unoccupied. Why? Because if we can choose beliefs, then in cases of insufficient evidence, we could choose to believe or not, but evidentialism would say we must not believe. However, if we can choose, then we might be obligated to choose not to believe. But typically, voluntarism is denied by evidentialists. This combination might be coherent but unattractive because it would require us to choose beliefs in accordance with evidence, but if we can choose, why not choose to believe only when there is evidence? But the problem is that in underdetermined cases, evidentialism would require suspension, and voluntarism would allow you to choose to suspend. So it might be coherent, but it's not a popular position because most evidentialists deny voluntarism.

  **Scoring Steps:**

  1. For each answer you chose, note which positions it gives a point to. Give one point to each position listed for that answer.
  2. Tally the points for each position: SC, J, OIC, IC, P.
  3. Your dominant position is the one with the highest score. If there is a tie, you might have a hybrid view.

  **Answer-Position Mapping:**

  - 1A: J, P
  - 1B: SC
  - 1C: OIC, IC

  - 2A: J, P
  - 2B: SC
  - 2C: OIC, IC

  - 3A: [none of the main five] (if chosen, we'll call it "Extreme Voluntarism" but not score in main)
  - 3B: OIC, IC
  - 3C: SC

  - 4A: J, P
  - 4B: SC
  - 4C: IC

  - 5A: J, P
  - 5B: SC
  - 5C: OIC

  - 6A: J, P
  - 6B: SC
  - 6C: SC

  - 7A: J, P
  - 7B: SC
  - 7C: IC

  - 8A: J, P
  - 8B: SC, IC
  - 8C: IC

  - 9A: P
  - 9B: OIC, IC
  - 9C: SC

  - 10A: SC, IC
  - 10B: P
  - 10C: IC

  Now, add up:

  - **SC (Strict Cliffordian):** 
     Points for: 1B, 2B, 3C, 4B, 5B, 6B, 6C, 7B, 8B, 9C, 10A

  - **J (Jamesian):** 
     Points for: 1A, 2A, 4A, 5A, 6A, 7A, 8A

  - **OIC (Ought Implies Can):** 
     Points for: 1C, 2C, 3B, 5C, 9B

  - **IC (Indirect Control):** 
     Points for: 1C, 2C, 3B, 4C, 7C, 8B, 8C, 9B, 10A, 10C

  - **P (Permissive):** 
     Points for: 1A, 2A, 4A, 5A, 6A, 7A, 8A, 9A, 10B

  Note: Some answers give multiple points. For example, if you chose 1A, you get one point for J and one for P.

  **Interpretation:**

  - If you have a high score in **SC**, you hold that it is always wrong to believe without sufficient evidence, regardless of consequences.
  - If you have a high score in **J**, you think that in genuine options (live, forced, momentous) with inconclusive evidence, practical considerations can make it permissible to believe.
  - If you have a high score in **OIC**, you think that because we cannot directly choose our beliefs, the ethics of belief should focus on what we can control (like actions that influence belief).
  - If you have a high score in **IC**, you think we are responsible for our belief-forming practices (like evidence gathering) but not for the beliefs themselves.
  - If you have a high score in **P**, you think that when evidence underdetermines belief, pragmatic considerations can tip the balance, and they are not necessarily reasons for the truth.

  **Note:** The quiz may not cleanly separate James (J) and Permissive (P) because both allow pragmatic considerations in some cases, but James has additional constraints (genuine option). Also, it may not separate OIC and IC because both deny direct control, but IC focuses on practices. Look at your answers: if you scored high in both OIC and IC, you might hold a combination.

  **Unoccupied Region:** As noted, a view that combines direct voluntarism (we can choose beliefs at will) with strict evidentialism (always requiring sufficient evidence) is not represented in the main positions. This is likely because if we can choose, then in cases of insufficient evidence, we would be obligated to choose not to believe, but it's not clear that we have that obligation for direct choice. Moreover, most philosophers deny direct voluntarism.

  We hope this quiz helps you reflect on your own ethics of belief!
