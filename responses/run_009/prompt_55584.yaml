  B) They may avoid seeking evidence if it protects their mental well-being and lifestyle, and they can continue to disbelieve without seeking more.
  C) They may avoid seeking evidence because beliefs are not under direct control, but they are responsible for the consequences of avoiding evidence.

  This tests indirect control and social harms.

