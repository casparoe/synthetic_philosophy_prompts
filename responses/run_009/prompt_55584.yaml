  Question 7: The Ambiguous Medical Test
  Scenario: A person gets a medical test for a serious condition. The test is known to be 60% accurate (meaning 40% false positive/negative). The result is positive. The doctor says they need to do a more invasive test for a definitive answer. The person feels that if they believe they have the condition, they will become too anxious to function. But if they believe they don't have it and skip the further test, they might miss early treatment.

