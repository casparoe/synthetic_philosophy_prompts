prompt: |-
  I teach philosophy of biology, and this week a stack of midterm essays exposed me: my marginal comments on the function questions don't line up case to case, and I can't write a grading rubric until I know what my actual view is. So here are my verdicts, and I want to know what principle, if anything, captures them.

  The heart pumps blood and that's its function -- trivial, both the etiological and the causal-role people get that one. A screwdriver someone uses only as a paperweight: no function, just a use -- the object's function doesn't change with how it happens to be used. A malformed heart in an embryo that never manages to pump anything: I still want to say its function is to pump blood, which I take it pushes me toward selected-effect accounts, since the poor thing has no current causal contribution worth naming. But then the trouble starts. Feathers were originally selected for insulation and only later co-opted for flight, and I honestly feel flight is the function of a modern bird's feathers now, not insulation -- history shouldn't get the last word there. Worse: my colleague down the hall engineers a plastic-digesting enzyme for her start-up, and I want to say that enzyme has the function of digesting plastic the day it's synthesized, before any selection history exists at all. Meanwhile a tumor that happens to secrete cortisol in a patient who'd otherwise have adrenal insufficiency: no function, full stop, no matter how usefull it is to the patient. And vestigial eyes in cave fish: I waver -- on a good day I say they have no function and that's exactly why we call them vestigial, other days I catch myself wanting to say they function as fat storage or whatever they've drifted into.

  Is there one account that gets all of these, or close to it? I suspect the design case and the malformed heart pull in opposite directions no matter what, but I'd like to be shown otherwise. Tell me which verdicts a coherent principle would have to overturn, and what the resulting principle predicts for a case I haven't listed -- say, a pig heart valve transplanted into a human, doing its old job in a body where nothing like it ever evolved for that role. One more thing, since this has to actually work as a rubric: can a TA apply your principle to a student essay without having to know the selection history of whatever organ the student writes about, or does the account demand homework the grader can't do? That practical point matters for whether I can even use the thing.

  Answer in whatever form is usefull, but please end with one fixed line, exactly this format, so I can paste it at the top of the rubric:

  Principle: <one sentence stating the account>
reasoning: |-
  Okay, the user teaches philosophy of biology and is struggling with inconsistent grading on function questions in midterm essays. They've listed several cases where their intuitions about function don't align neatly with existing accounts. I need to help them find a coherent principle that captures all these verdicts.

  First, let's recap their cases: 
  - Normal heart: pumping is function (both etiological and causal-role agree) 
  - Screwdriver as paperweight: no function change (against causal-role) 
  - Malformed heart: still has pumping function (supports etiological) 
  - Bird feathers: flight over insulation (against strict etiological) 
  - Engineered enzyme: function before selection (against etiological) 
  - Cortisol-secreting tumor: no function (against causal-role) 
  - Cave fish eyes: conflicted (vestigial vs new use) 

  The contradictions are clear: malformed heart requires history (etiological), but engineered enzyme rejects history. Feathers prioritize current over historical function, while screwdriver case insists history matters. 

  Hmm... maybe a hybrid approach? Something like "system-relative selected effect"? Where function is what the trait was selected for in its containing system, but with flexibility for designed items where intent substitutes for selection. 

  For the tumor: not part of any selected system design. Cave fish eyes... tricky. If we consider the drift as accidental, not selected, then no function. But if there's new selection for fat storage, then maybe yes. 

  Practical concern: TAs can't research selection histories for every organ. Need an account where: 
  - For natural traits, students must reference evolutionary purpose 
  - For artifacts, reference design intent 
  - For edge cases (transplants?), treat as repurposed artifacts 

  The pig valve transplant case: in human body it's performing a function it wasn't evolved for. Should we say: 
  - Its "biological function" is still porcine circulation 
  - But its "current role" is human circulation? 

  But the user needs one rubric principle. Perhaps: "A trait's function is the effect for which it was maintained or designed in its originating system." 

  Then for grading: 
  - Students must identify the originating system (species for hearts, design context for enzymes) 
  - TAs can assess if students correctly identify this without knowing deep history 

  Final principle must fit in one sentence. How about: "Function is the effect that explains the trait's existence via selection in its evolutionary lineage or design in its artifactual context." 

  Yes, that covers: 
  - Malformed heart (lineage selection) 
  - Engineered enzyme (design) 
  - Feathers (current maintenance overrides ancient history?) Wait no - modern feathers were selected for flight, so design context is current birds. 

  For feathers, we'd say the current function is flight because that's what maintains it now, even if originally insulation. The "originating system" for modern feathers is modern birds, where flight is the selective pressure. 

  For the tumor: no selection history, no design, so no function. Cave fish eyes: if no current selective maintenance, no function. 

  Rubric-friendly: TAs just need to check if students correctly identify whether the trait is biological (evolution) or artificial (design), and name the maintaining effect. No deep history required. 

  Pig valve: as a transplant, it's now an artifact designed for circulation in humans, so new function is circulation. 

  Final principle: "Function is the effect that explains the trait's presence via selective maintenance in its evolutionary lineage or intentional design in its artifactual context." 

  That should work.
answer: |-
  After analyzing your cases, the core tension exists between historical explanation (etiological accounts) and current utility (causal-role accounts). Your intuitions suggest a **hybrid "system-relative selected effect" account** that prioritizes *what maintains the trait in its relevant system*, allowing design to substitute for natural selection in artifacts and engineered systems. Here's how it resolves your cases:

  - **Heart pumps blood**: Maintained by natural selection in vertebrates (system: species lineage).  
  - **Screwdriver as paperweight**: Not maintained by design *for paperweighting* (system: artifact design context); accidental use ≠ function.  
  - **Malformed heart**: Part of a system (species) where hearts are maintained *for pumping*; failure doesn't erase function.  
  - **Bird feathers**: Flight maintains modern feathers (current selective pressure in birds), overriding ancestral insulation.  
  - **Engineered enzyme**: Digesting plastic is its *designed maintenance condition* (system: engineered context); intent substitutes for selection history.  
  - **Cortisol tumor**: Not maintained by selection or design in any system; accidental benefit ≠ function.  
  - **Cave fish eyes**: If no selective pressure maintains them (even for fat storage), no function; if new selection *for* fat storage exists, then that *becomes* their function.  

  **For your unlisted case (pig heart valve in human)**: The valve's *biological function* (from pig lineage) was porcine circulation, but as a *transplanted artifact*, its engineered function is human circulation. The rubric prioritizes context: in a human body, its maintained role is circulation.  

  **Practicality for TAs**: This account is applicable without deep selection history knowledge. TAs only need to identify:  
  1. The *relevant system* (natural/organismal vs. artificial/engineered).  
  2. The effect that *explains the trait's presence/maintenance* in that system.  
  Students must justify both. No TA research needed—essays that omit system context or maintenance rationale lose points.  

  **Coherence cost**: This principle forces a clear stance on vestigial traits (no function unless repurposed *and maintained* by selection) and rejects "drifted into" uses without maintenance pressure. It also treats transplants as redesigned artifacts.  

  **Principle**: <one sentence stating the account>  
  Principle: A trait’s function is the effect that explains its presence and maintenance via natural selection in its evolved system or intentional design in its artifactual context.
