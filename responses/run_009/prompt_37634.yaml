answer: |-
  ### Five Betting Rules  
  1. **Kelly Fraction Calculation**: For each match, compute the market-implied probability \( q = 1 / \text{decimal odds} \), then calculate the raw Kelly fraction \( f = \max\left(0, \frac{p - q}{1 - q}\right) \), where \( p \) is your model’s win probability. If \( f = 0 \), skip to Rule 5.  
  2. **Adjust for Uncertainty**: Reduce \( f \) by 50% to account for noisy edge estimates: \( f_{\text{adj}} = 0.5 \times f \). Never bet if \( f_{\text{adj}} \leq 0 \).  
  3. **Correlation Mitigation**: If you have any unsettled bet on the same player in the **same tournament**, do not place this bet (even if \( f_{\text{adj}} > 0 \)). Treat all matches for one player in a tournament as mutually exclusive.  
  4. **Minimum Edge Threshold**: Do not bet unless both conditions hold: \( f \geq 0.01 \) (unadjusted fraction) **and** \( p - q \geq 0.01 \) (absolute edge). Reject bets failing either.  
  5. **Bet Sizing and Bankroll Update**: Bet \( \min(\text{current bankroll} \times f_{\text{adj}}, \, 0.05 \times \text{current bankroll}) \) dollars. Subtract the bet amount from your bankroll immediately; upon settlement, add winnings (stake × decimal odds if win, $0 if loss).  

  ### Implementation Notes  
  - **Bankroll**: Start with $2,300. Track it as a running "cash balance" (subtract new bets instantly; add wins after results).  
  - **Tools**: Use a spreadsheet: input \( p \), odds → auto-compute \( q, f, f_{\text{adj}} \), bet size.  
  - **Key Safeguards**: Half-Kelly (Rule 2), correlation bans (Rule 3), edge thresholds (Rule 4), and 5% max per bet (Rule 5) protect against overconfidence, drawdowns, and ruin.
