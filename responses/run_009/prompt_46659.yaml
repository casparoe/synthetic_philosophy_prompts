answer: |-
  ### Exam Question: Applied Political Philosophy of Welfare Conditionality

  **Scenario:**  
  The government of Libertonia proposes a new welfare scheme with two tiers:  
  - **Tier One:** An unconditional basic payment for all low-income residents.  
  - **Tier Two:** A substantial supplementary benefit for those who demonstrate active job-search compliance. Compliance is verified by a partially automated system.  

  *Known flaw:* The system has an **asymmetric error profile**:  
  - It *very rarely* pays Tier Two to the non-compliant (false positives).  
  - It *fairly often* denies Tier Two to the compliant (false negatives) due to missed appointments (caused by shift work, childcare conflicts, or administrative delays). Appeals take months.  

  The government defends Tier Two with two distinct rationales, used interchangeably:  
  1. **Fairness Rationale:** Conditionality protects taxpayers from subsidizing those who "could work but won’t."  
  2. **Paternalistic Rationale:** Behavioral requirements benefit recipients by preserving work habits and preventing long-term unemployment scarring.  

  **Question (90 minutes, ~1,200 words):**  
  Can Libertonia’s two-tier scheme be justified? If so, under which rationale(s)? What modifications (if any) would be required? Critically engage with the moral foundations of the "deserving/undeserving poor" distinction itself. Your analysis must confront the implications of the system’s error asymmetry.  

  ---

  ### Model Answer (600 words)  
  Libertonia’s scheme cannot be consistently justified under *both* rationales due to the asymmetric error profile. The fairness and paternalistic rationales demand contradictory tolerances for false negatives (wrongly denying supplements to the compliant), making the current system ethically unstable.  

  **The Rationale Divergence**  
  - Under the **fairness rationale**, false negatives are acceptable collateral damage. The core aim is to prevent "free-riding," so erring toward underpayment protects taxpayer interests. False negatives may even be tacitly endorsed as incentivizing hyper-compliance.  
  - Under the **paternalistic rationale**, false negatives are indefensible. Punishing the compliant (e.g., a single parent penalized for childcare conflicts) actively harms those the policy claims to help, undermining work habits and exacerbating poverty—precisely the harms paternalism seeks to avoid.  

  The government cannot invoke both rationales while retaining the asymmetric system. If paternalism is primary, false negatives must be minimized (e.g., by overhauling verification to accommodate care responsibilities or precarious work). If fairness is primary, the error profile may be retained—but this exposes the rationale’s punitive core, where protecting taxpayers outweighs recipients’ survival needs.  

  **Recalibrating the System**  
  Only the paternalistic rationale can survive if the scheme is reformed:  
  1. **Error tolerance must invert**: False negatives should be near-zero, even if false positives rise (e.g., accepting reasonable job-search evidence without punitive verification).  
  2. **Modifications required**:  
     - Replace automated tracking with caseworker discretion for context-sensitive assessments.  
     - Guarantee same-day emergency payments during appeals.  
     - Exempt caregivers and gig workers from rigid appointment protocols.  

  However, abandoning the fairness rationale undermines conditionality’s political legitimacy. Taxpayer consent often hinges on the "free-rider" narrative. Without it, paternalism alone may appear illiberal—coercing the poor for their "own good."  

  **The Deserving/Undeserving Distinction: A Structural Critique**  
  The distinction itself is morally problematic, irrespective of administrative accuracy. It assumes "refusal to work" is a clear, blameworthy category separable from:  
  - **Structural barriers**: Lack of living-wage jobs, affordable childcare, or reliable transport.  
  - **Epistemic injustice**: Bureaucrats judging "willingness" often ignore marginalized voices (e.g., a migrant worker’s undocumented constraints).  

  Even a "perfect" system tracking "refusal" would be unjust if it ignores how choice is shaped by systemic inequities. Moral desert hinges on *genuine opportunity to refuse*, not abstract volition. Libertonia’s unconditional Tier One tacitly admits this—yet Tier Two reintroduces desert-based punishment. An egalitarian alternative would scrap desert-talk entirely, focusing on universal needs (via Tier One expansion) and *optional* employment supports (e.g., skills training without financial penalties).  

  **Conclusion**  
  The scheme can be partially justified under paternalism *only* if radically redesigned to eliminate false negatives—but this reveals paternalism’s vulnerability to democratic dissent. The deserving/undeserving framework should be abandoned; it confuses structural disadvantage with individual failing, perpetuating the very stigma it claims to mitigate.  

  ---

  ### Marking Scheme (Total: 25 Marks)  
  **Must-hit points for an A-grade answer (≥20 marks):**  

  | Criteria | Marks | How a B answer typically misses it |  
  |----------|-------|-----------------------------------|  
  | **Identifies the core contradiction**: Explains how false negatives are tolerable under fairness but catastrophic under paternalism. | 5 | Notes the error asymmetry but treats it as a technical flaw, not a rationale-dependent conflict. |  
  | **Demands rationale choice**: Argues the system *cannot* use both rationales and forces a choice (paternalism OR fairness). | 5 | Suggests "balancing" rationales without addressing their mutually exclusive error tolerances. |  
  | **Reconfigures error priorities**: Proposes concrete modifications aligned with one rationale (e.g., paternalism requiring near-zero false negatives). | 5 | Recommends generic "fixes" (e.g., "better tech") without linking them to a chosen rationale’s goals. |  
  | **Critiques the desert distinction**: Argues whether "deservingness" tracks morally relevant factors (e.g., opportunity vs. choice) *beyond* administrative accuracy. | 5 | Only critiques misapplication ("stigma") without questioning if "refusal" is coherent under structural inequality. |  
  | **Synthesizes implications**: Traces how abandoning one rationale affects policy stability (e.g., paternalism losing taxpayer buy-in). | 3 | Treats modifications as standalone solutions, ignoring political/moral trade-offs. |  
  | **Clarity & structure**: Logical flow, concise analysis, no filler. | 2 | Digressions into generic conditionality debates (e.g., "Nozick vs. Rawls"). |  

  **B-grade cap (15–19 marks)**: Answers that survey literature positions without engaging the scenario’s contradictions, or assert "conditionality is good/bad" without rationale-specific error analysis.  
  **C-grade (10–14 marks)**: Superficial treatment of errors/desert distinction; conflates tiers; relies on syllabus buzzwords.  
  **D/F (<10 marks)**: Misreads scenario; ignores errors/desert; unstructured opinion.  

  ---
  This design forces students to *use* political philosophy as a diagnostic tool rather than rehearse debates. The model answer demonstrates rigor by exposing the rationales’ incompatibility and rejecting desert-based framing—but defenders of fairness could score equally highly by justifying strict error tolerance and desert distinctions, provided they meet all criteria.
