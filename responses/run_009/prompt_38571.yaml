prompt: |-
  My friend and I stayed up way too late arguing about when you're justified in believing what people tell you, and now I want to figure out if her actual verdicts are even consistent with each other. Over the years she's landed on these:

  - directions from a random stranger on the street: justified
  - her doctor's offhand diagnosis: justified
  - a well-written random website's claim about medieval history: NOT justified — she says anyone can write anything online and she'd need to know who wrote it and whether they're usually right
  - a rumor that passed through five people before it got to her: NOT justified
  - her 6-year-old nephew's report of his day at school: justified (mostly)
  - the same kid's claim that his teacher can do real magic: NOT justified
  - a brand new coworker's stories about her own past jobs: justified

  Now predict what she'll say about: (1) the AI assistant on her phone, one week after she bought it, confidently telling her about a drug interaction; (2) a tour guide in a country she's never visited explaining a temple's history; and (3) a lone eyewitness who seems sincere and has nothing to gain. Is she running the reductionist rule (belief on testimony needs an inductive track record with that kind of source), the anti-reductionist rule (sincere competent testimony gets default entitlement unless there are red flags), or something else entirely, like defeaters doing all the work? Act as a professional epistemologist, brainstorm the candidate rules before committing, give me your best guess on each of the three cases with reasons, and name one further case that would actually split the rules you're deciding between — I want ammunition for the rematch. Keep it under 350 words, shes got a short attention span and honestly so do I at this point.
reasoning: |-
  Okay, the user and their friend had a late-night debate about when it's justified to believe what people tell you, and now the user wants to analyze their friend's pattern of judgments to see if they're consistent. They've provided several examples of what their friend considers justified or not justified in terms of testimony. 

  First, I need to identify the underlying rule that explains all these verdicts. The friend seems to accept some testimonies but rejects others even when they come from seemingly reliable sources. For instance, she trusts a random stranger's directions but not a well-written website's historical claim. She believes her nephew's account of his school day but not his claim about magic. 

  Looking at the patterns, reductionism (requiring positive reasons to trust each source) doesn't fully fit because she accepts some testimonies without prior track records, like the brand new coworker's stories. Anti-reductionism (default trust unless red flags) also struggles because she rejects the website despite no obvious red flags. 

  The key might be "domain-specific competence + sincerity" with defeaters. She trusts sources when they're speaking within their apparent competence and seem sincere, unless there are specific reasons for doubt. For example: 
  - Stranger giving directions: assumed competent in basic navigation, no obvious motive to lie. 
  - Doctor's diagnosis: clear professional competence. 
  - Website history: unknown author's competence. 
  - Nephew's magic claim: competence issue (child's fantasy). 

  Now applying this to the three new cases: 
  1. Phone AI drug interaction: Likely NOT justified. Competence in drug interactions requires medical expertise, which a generic AI lacks without credentials. 
  2. Tour guide history: Likely justified. They're hired as experts, implying domain competence. 
  3. Sincere eyewitness: Probably justified if no red flags, as eyewitness testimony generally falls within human competence. 

  For a splitting case, consider "a stranger's claim about their own name." Reductionism would require prior reason to trust strangers, while her apparent rule would likely accept it as a basic competence/sincerity scenario. 

  The user wants this concise since attention spans are short, so I'll keep it under 350 words while ensuring the logic is clear for their "rematch." They're clearly enjoying this philosophical sparring!
answer: |-
  Here's your analysis, optimized for brevity:

  **Candidate Rules:**
  *   **Reductionist:** Needs positive reasons (track record) to trust *this specific source/type* before belief.
  *   **Anti-Reductionist:** Sincere testimony from a *seemingly competent* source gets default justification unless defeaters (red flags) are present.
  *   **Defeater-Focused:** Default is murky; justification hinges *entirely* on the absence of specific defeaters (incompetence, insincerity, contradiction, etc.).

  **Best Guess Rule:** **Anti-Rductionist *Leaning*, but heavily dependent on "Seeming Competence in the Domain" + Absence of Defeaters.** She accepts testimony when the source *appears* minimally competent regarding the subject and sincere, unless specific red flags arise (fantasy, complex chains, anonymous/unverifiable sources). Prior track record helps but isn't strictly necessary (new coworker).

  **Predictions & Reasons:**

  1.  **AI Assistant (Drug Interaction): NOT Justified.**
      *   *Reason:* High stakes + complex medical domain. An AI assistant, especially a generic phone one only owned a week, lacks *apparent domain-specific competence/credentials* for drug interactions. Defeater: Potential for serious harm if wrong outweighs the AI's general confidence.

  2.  **Tour Guide (Temple History): JUSTIFIED.**
      *   *Reason:* The tour guide holds themselves out as an expert in local history/culture (apparent domain competence). Context implies training/knowledge. No obvious red flags like contradictions or known bias mentioned. Similar to the doctor's offhand diagnosis in relying on assumed role-based competence.

  3.  **Lone Sincere Eyewitness (Nothing to Gain): JUSTIFIED (Mostly).**
      *   *Reason:* Eyewitness testimony to a straightforward event is generally within human competence. Sincerity and lack of apparent motive are explicit. Absence of major red flags (like known unreliability or contradiction) means it likely passes her threshold, similar to the nephew's school report or the stranger's directions.

  **Splitting Case:** "A stranger on the subway tells you the exact time." 
  *   **Anti-Reductionist/Competence-Defeater Model (Your Friend):** Likely **JUSTIFIED.** Telling time is basic human competence. Stranger seems sincere, no obvious motive to lie, low stakes.
  *   **Strict Reductionist:** Likely **NOT JUSTIFIED.** Need a positive reason to trust *this specific stranger* about the time (Do they have a watch? Is it reliable?).

  **Ammo for the Rematch:** Use the "Subway Time" case. Her likely acceptance contrasts with strict reductionism, confirming her rule relies more on judging competence/sincerity in the moment than requiring prior inductive track records for each source type.
