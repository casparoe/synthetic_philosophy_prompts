prompt: |-
  I am putting together a discussion unit on Parfit's teletransporter for an upper-level metaphysics seminar, and I want a case that does work the familiar variants cannot. The stock examples — plain scanning with destruction of the original, fission into two successors, and the gradual replacement spectrum — each drive a wedge between numerical identity and psychological continuity. What they do not do is drive a wedge between psychological continuity itself and what matters in survival, since in all of them Parfit's Relation R and the thing that matters seem to travel together. Give an example of a single new teletransporter variant in which the person who emerges is clearly psychologically continuous with the one who entered, in the ordinary Parfitian sense of overlapping chains of quasi-memory and character, and yet it is at least arguable that nothing that matters in survival has been preserved — the case should make the question of what matters come apart from the question of whether continuity was achieved, rather than from the question of whether identity was preserved. To keep the case from collapsing into a restatement of the classics, its verdict must be generated by some detail other than branching, gradual replacement, or the mere fact that the original was destroyed; feel free to make the causal basis of the continuity unusual, or the distribution of psychological links over time lopsided, or the subject's own preregistered attitudes part of the setup, but the philosophical work must be done by the specifics of the case rather than by stipulation in its description. Once you have described the case, say precisely which feature of it is meant to produce the intuition that continuity without anything that matters has occurred, and what that is supposed to show about treating psychological connectedness and continuity as the bearer of final value. Then present the strongest objection someone could raise to treating intuitions about a case like yours as evidence about what matters in survival, and indicate briefly how you would try to answer it. Please answer in continuous prose only, as in a letter: no headings, bullet points, bold text, tables, or lists of any kind.
