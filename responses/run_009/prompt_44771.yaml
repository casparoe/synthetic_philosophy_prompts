answer: |-
  My dear colleague, what you seek is indeed a delicate creature, one that must sever the bond between psychological continuity and survival value while leaving the former intact. Consider this variant:

  **The Grafted Successor:** Imagine a teletransporter that doesn't scan or destroy the original at all. Instead, it employs an entirely different causal mechanism. Upon entering the chamber, the subject ("A") is placed into a deep, medically-induced coma that completely halts *all* higher brain function—a complete cessation of consciousness, memory encoding, and psychological activity. This coma is irreversible with current technology and persists indefinitely. Simultaneously, in a distant location, the machine uses non-destructive, passive neural mapping technology (developed over years of observing A) to create an identical replica ("B") from new organic matter. Crucially, the machine doesn't *transfer* A's psychology; it *grafts* A's complete psychological profile—every quasi-memory, character trait, preference, and skill—onto a pre-existing, blank but biologically identical neural substrate prepared in advance. B wakes up instantly, fully psychologically continuous with A: B has quasi-memories of A's life, shares A's character, intends to carry on A's projects, and immediately identifies as A. Meanwhile, A's body remains biologically alive in the coma chamber, breathing via machines, utterly devoid of any psychological states—a complete experiential and agential void. The coma ensures A has no further experiences, no awareness, no possibility of revival. B exists as a psychologically perfect continuation.

  The feature meant to generate the intuition that *nothing that matters* has been preserved is the **persistence of A's living, biological body as a vacant shell alongside the psychologically continuous B**. Psychological continuity (R) is fully present in B through the causal chain of the graft (based on prior mapping), satisfying the standard criteria: overlapping quasi-memories, character persistence, and intention continuity. Yet, the sight of A's empty body, biologically identical and sustained, triggers a powerful intuition: *A is still there*, but utterly gone as a person. What matters—the continued subjective experience, the persistence of *this* stream of consciousness, the feeling that *I* survive—seems to have ended with A's coma. B, despite being psychologically identical and continuous, appears as a distinct entity who merely *has* A's psychology, not as A *surviving*. The coma renders A's body a monument to the cessation of subjective existence, making B's psychological richness feel like an elaborate imitation rather than survival. This suggests that even if psychological connectedness/continuity (R) is fully realized in a new entity, its value *as survival* might be parasitic on the prior existence and continuation of a specific, non-branching *first-personal perspective* instantiated in a particular biological process. R alone, without the continuation of that specific subjective locus (even if vacant), might not carry the intrinsic "what matters" value we attribute to survival.

  The strongest objection is that this intuition illicitly smuggles in **biological or bodily identity as the real carrier of "what matters."** A committed Parfitian could argue: "The coma renders A permanently unconscious. If we truly believe conscious experience and psychological continuity *are* what matter, then the presence of a biologically alive but mindless body is irrelevant. B possesses the conscious experience and psychological continuity that matters; A's body is merely organic matter without a mind. Your intuition that 'A is still there' is a confused attachment to the body, not a reflection of what matters in survival. Since A, as a conscious being, has ceased to exist entirely (the coma being equivalent to permanent dreamless sleep), and B carries forward the psychological life that matters, this case doesn't separate R from what matters—it merely separates R from the fate of a particular body."

  I would answer this objection by conceding it highlights a crucial ambiguity in the case but argue it doesn't fully dispel the challenge. While the objection correctly notes the coma body lacks consciousness, the intuition persists that the *specific biological history* culminating in *that* vacant body represents the *termination point* of the subject whose survival was at stake. The value attributed to survival seems tied to the continuation of *this* particular biological instantiation of consciousness, even after consciousness ceases. B, despite psychological continuity, feels like a *new* subject benefiting from A's psychological legacy. This suggests "what matters" might be more primitive than R: perhaps the non-branching continuation of the specific biological process that *generates* the first-person perspective. R might be a reliable *indicator* of this continuation under normal circumstances, but in this grafted scenario, where R is synthetically imposed on a different biological trajectory, the value doesn't transfer. The case doesn't prove bodily identity *is* what matters, but it powerfully suggests that psychological continuity *alone* might not be the intrinsic bearer of final survival value; its value might be contingent on its being the natural expression of an unbroken biological process generating a single, continuous subjective perspective. It forces us to ask whether R's value is intrinsic or derivative. The persistence of the vacant body makes the discontinuity in the biological substrate generating the perspective starkly visible, undermining the sense that anything of *A* survived, even though R was preserved in B. The philosophical work lies in this visceral confrontation with the vacant vessel.
