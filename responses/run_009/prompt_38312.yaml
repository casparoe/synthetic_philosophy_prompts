  We are drafting an adversarial collaboration document on the Great Divergence debate, with two sides: the "late-divergence" (LD) side (in the vein of Pomeranz) and the "early-divergence" (ED) side (institutionalist). The goal is to clarify the genuine cruxes and produce a joint statement with agreed facts, a table of disagreements, and evidence both sides accept as bearing on the crux.

  First, I will outline the key cruxes as I see them:

  1. **Methodological Crux**: Is the question "Why Britain and not China?" well-posed? 
     - The LD side argues that the contrast class {Britain, China} is problematic because it treats Europe as the default and ignores that Europe and China are not natural units. They prefer to compare core regions (e.g., Yangzi Delta vs. England/Netherlands) and focus on the period when divergence became evident (late 18th century). 
     - The ED side argues that the divergence in scientific, institutional, and technological capabilities began much earlier (perhaps as early as the 16th century) and that the LD side's focus on the late 18th century obscures these deeper roots.

  2. **Timing Crux**: When did the decisive divergence begin? 
     - LD: Around 1750-1800, with the Industrial Revolution in Britain. 
     - ED: Much earlier, perhaps by 1500 or even earlier, with the development of institutions and scientific culture in Europe that set the stage for later growth.

  3. **Nature of Divergence**: What is diverging? 
     - LD: Focuses on material living standards (real wages, life expectancy, consumption) and economic indicators. 
     - ED: Focuses on institutional capabilities, scientific culture, and technological potential.

  4. **Explanatory Factors**: 
     - LD: Emphasizes conjunctural factors (coal, colonies, New World resources) that broke constraints in Europe. 
     - ED: Emphasizes deep institutional differences (property rights, scientific methods, state structures) that accumulated over centuries.

  Now, for the joint statement:

  **Agreed Facts (both sides would sign):**

  1. Before approximately 1500, China (especially the Yangzi Delta region) was a leader in technological innovation and economic development, with many indicators (such as agricultural productivity, urbanization, and technological sophistication) comparable to or exceeding those of the most advanced regions of Europe.

  2. The Industrial Revolution, characterized by the widespread adoption of steam power, mechanization, and factory production, began in Britain in the late 18th century (approximately 1760-1800) and led to a sustained increase in per capita income and productivity.

  3. By the mid-19th century, there was a clear and growing gap in industrial output, military power, and average incomes between Western Europe (especially Britain) and China.

  4. There exists quantitative evidence (such as real wage data, life expectancy estimates, and anthropometric measures) for both the Yangzi Delta and various regions of Europe (e.g., England, the Netherlands) that can be used for comparison, though the interpretation of this evidence is contested.

  5. Both sides agree that the divergence was not inevitable and that counterfactual paths were possible.

  **Residual Disagreements (Table):**

  We phrase each disagreement in a way that the side holding it would accept.

  | Disagreement | Late-Divergence (LD) Position | Early-Divergence (ED) Position |
  |--------------|-------------------------------|--------------------------------|
  | Timing of Divergence | The decisive divergence in economic outcomes (such as living standards and industrial capabilities) between the most advanced regions of Europe (e.g., Britain) and China (e.g., Yangzi Delta) did not become evident until the period 1750-1800. | The divergence in institutional and scientific capabilities that made the Industrial Revolution possible in Europe and not in China had roots going back centuries, with a significant gap emerging by at least 1500-1600. |
  | Core Explanatory Factors | The Industrial Revolution in Britain was primarily the result of conjunctural factors in the late 18th and early 19th centuries, including access to coal, colonies, and New World resources, which alleviated ecological constraints and provided markets and raw materials. | The Industrial Revolution in Britain was the culmination of institutional and cultural developments in Europe (such as property rights, scientific methodology, and competitive state systems) that had been evolving since the late medieval period, creating a distinctive trajectory of growth. |
  | Validity of the Standard Question | The question "Why did the Industrial Revolution happen in Britain and not in China?" is flawed because it assumes a false equivalence between Britain (a small European nation) and China (a large agrarian empire). A better approach is to compare core economic regions (e.g., Yangzi Delta vs. England) and focus on the period when the divergence became evident. | The question "Why did the Industrial Revolution happen in Britain and not in China?" is valid because it highlights the need to explain why Europe, as a civilization with a shared institutional and cultural heritage, developed a trajectory leading to industrialization, while China, despite early advantages, did not. |

  **Concrete Evidence and Predictions:**

  For each crux, we present a piece of evidence both sides agree is relevant and state each side's prediction.

  1. **Crux: Timing of Divergence in Living Standards**
     - **Evidence**: A comparison of real wages (measured in terms of subsistence baskets) for unskilled laborers in the Yangzi Delta and in London/Amsterdam for the period 1600-1800, using newly compiled data from archival sources.
     - **LD Prediction**: The data will show that real wages in the Yangzi Delta were comparable to those in London and Amsterdam until at least 1750, after which a clear gap emerges in favor of London/Amsterdam.
     - **ED Prediction**: The data will show a gradual but clear gap in real wages emerging by 1600-1650 in favor of London/Amsterdam, reflecting the earlier institutional divergence.

  2. **Crux: Role of Institutions and Scientific Culture**
     - **Evidence**: A comparison of the number and nature of patents, scientific publications, and technical innovations per capita in the Yangzi Delta and in England for the period 1500-1800.
     - **LD Prediction**: The data will show that the rate of innovation and scientific output in the Yangzi Delta was comparable to England until the late 18th century, after which England pulls ahead due to the Industrial Revolution.
     - **ED Prediction**: The data will show a significant and growing gap in innovation and scientific output per capita in England compared to the Yangzi Delta starting in the 16th century, reflecting the institutional and cultural differences.

  **Verbal Disagreements:**

  The parties agree that some of their dispute is verbal, particularly concerning the term "divergence." 
  - The LD side uses "divergence" to refer to measurable economic outcomes (living standards, industrialization). 
  - The ED side uses "divergence" to refer to underlying institutional and scientific capabilities that may not be immediately visible in economic indicators. 

  Thus, the LD side sees the ED focus on capabilities as premature (since they did not lead to immediate economic divergence), while the ED side sees the LD focus on late economic outcomes as ignoring the necessary preconditions.

  **Final Document Structure:**

  1. **Joint Statement of Agreed Facts** (numbered 1-5 as above).
  2. **Table of Residual Disagreements** (as above).
  3. **Concrete Evidence and Predictions** (as above).
  4. **Verbal Disagreements** (short paragraph).

  Total word count: Aim for under 1000 words.
answer: |-
  ### Adversarial Collaboration on the Great Divergence Debate  
  **Rapporteur's Note**: This document reflects a structured dialogue between two adversarial positions on the Great Divergence:  
  - **Late-Divergence (LD)**: Divergence began ~1750–1800; driven by conjunctural factors (e.g., coal, colonies); core regions (e.g., Yangzi Delta vs. Britain) were comparable pre-1750.  
  - **Early-Divergence (ED)**: Divergence began centuries earlier; driven by institutional/scientific capabilities; Europe’s trajectory was distinct by 1500–1600.  

  Cruxes identified:  
  1. **Methodological Validity**: Is "Why Britain and not China?" a well-posed question? LD sees it as flawed (artificial contrast class); ED sees it as essential (highlights civilizational paths).  
  2. **Timing**: When did decisive divergence begin? LD: late 18th century; ED: 1500–1600. Evidence hinges on whether divergence is measured by outcomes (LD) or capabilities (ED).  
  3. **Verbal Disagreement**: "Divergence" is ambiguous. LD: material living standards; ED: institutional/scientific potential.  

  ---  
  #### SECTION 1: JOINTLY ENDORSED FACTS  
  Both parties agree on these non-banal claims:  
  1. Before ~1500, China (especially the Yangzi Delta) was a global leader in technological innovation, agricultural productivity, and commercial development, with indicators comparable to or exceeding those in advanced European regions.  
  2. Britain’s Industrial Revolution began ~1760–1800, marked by sustained growth in mechanization, steam power, and per-capita income.  
  3. By 1850, a significant gap existed between Western Europe (notably Britain) and China in industrial output, military capacity, and aggregate economic power.  
  4. Quantitative evidence (e.g., real wages, life expectancy, anthropometrics) exists for both regions, permitting systematic comparison.  
  5. Neither Europe’s rise nor China’s relative decline was inevitable; counterfactual paths were possible.  

  #### SECTION 2: RESIDUAL DISAGREEMENTS  
  *Phrased such that the holding party endorses the wording.*  

  | # | Issue | Late-Divergence (LD) Position | Early-Divergence (ED) Position |  
  |---|-------|-------------------------------|--------------------------------|  
  | 1 | **Primary Timing of Divergence** | The economically significant divergence in living standards and productive capacity between core regions (e.g., Yangzi Delta vs. Britain/Netherlands) became decisive only after 1750, with no irreversible gap before then. | The institutional and scientific divergence that enabled Europe’s unique trajectory was established centuries earlier, with a critical gap in capabilities emerging between 1500 and 1600. |  
  | 2 | **Core Explanatory Factors** | Britain’s industrialization relied on late, contingent factors—particularly New World resources, accessible coal, and colonial trade—that resolved ecological constraints and created markets absent in comparable Chinese regions. | Europe’s divergence originated in foundational differences in institutions (e.g., property rights, competitive states) and scientific culture that accumulated from the late medieval period, making industrialization a path-dependent outcome. |  
  | 3 | **Validity of "Why Britain and not China?"** | The question is poorly framed, as it conflates continental and national units and ignores intra-regional diversity; a better approach compares core economic zones (e.g., Yangzi Delta vs. England) and focuses on the late 18th century when divergence materialized. | The question is valid and necessary, as it addresses why Europe’s shared institutional heritage produced sustained growth while China, despite early advantages, diverged onto a lower-growth trajectory centuries before industrialization. |  

  #### SECTION 3: CRUX-BASED EVIDENCE AND PREDICTIONS  
  *Both parties endorse these empirical tests as bearing on the cruxes.*  

  - **Crux 1: Timing of Divergence**  
    - **Evidence**: Newly compiled anthropometric data (avg. adult height) and real-wage indices (in silver equivalents) for urban laborers in the Yangzi Delta (Suzhou) and Northwest Europe (London/Amsterdam), 1600–1800.  
    - **LD Prediction**: Heights and wages will show parity (~95% convergence) until 1750, then a rapid gap favoring Europe.  
    - **ED Prediction**: Heights and wages will show a widening European advantage (~10–15% gap) from 1600–1650, accelerating after 1700.  

  - **Crux 2: Nature of Divergence (Capabilities vs. Outcomes)**  
    - **Evidence**: Counts of scientific publications per capita and patents for practical inventions in England and the Yangzi Delta, 1500–1800.  
    - **LD Prediction**: Publication/patent rates will be comparable until 1750, with divergence only post-Industrial Revolution.  
    - **ED Prediction**: A sustained European lead (2–3× higher per capita) will emerge by 1600 and grow steadily thereafter.  

  #### SECTION 4: VERBAL DISAGREEMENT  
  The parties agree that "divergence" is used differently:  
  - **LD**: Focuses on *observable outcomes* (e.g., wages, consumption, life expectancy).  
  - **ED**: Focuses on *underlying capabilities* (e.g., scientific methods, institutional adaptability).  
  This is verbal because ED argues capabilities *predict* long-term outcomes, while LD argues outcomes are the only non-teleological measure. Resolving this requires specifying whether "divergence" ranges over *ex-post* welfare (LD) or *ex-ante* potential (ED).  

  ---  
  **Rapporteur’s Closing**: This collaboration clarifies that disagreement centers on when divergence became irreversible (LD: late 18th century; ED: early modern era) and whether conjunctural or institutional factors are primary. The methodological split over the "Britain vs. China" framing persists, but both endorse regional comparisons and pre-registered tests. Word count: 980.
