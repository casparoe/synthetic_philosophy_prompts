prompt: |-
  So I'm a philosophy professor who, against my better judgment, runs a small podcast for our department — mostly grad students and the occasional brave undergrad listening in. Next week's guest is a philosopher who defends strong longtermism: not just "the future matters a lot" but the full claim that positively influencing the long-term future is the *key* moral priority of our time, so that reducing existential risk dominates (in expectation) pretty much any other thing you could do with your resources. He's good, and he's rehearsed. On fanaticism he retreats to "these are real, estimable probabilities, not Pascalian fictions"; on cluelessness he likes to point out that ordinary charity is equally clueless about its long-run effects; on population ethics he waves at "the verdicts are robust across a wide range of views."

  Draft me eight to ten interview questions that get past the rehearsed answers. At minimum I want one each on the following, with a follow-up keyed to the reply he's most likely to give: (a) the fanaticism worry — that expected-value maximization with tiny probabilities of astronomically huge payoffs ends up endorsing things that look insane, where the follow-up should press on whether "but the probabilities are real" does any work once the payoffs get large enough that our probability estimates stop being meaningful; (b) cluelessness, pressed as coming from *inside* the expected-value framework — it's not a rival moral theory saying you're wrong, it's the observation that our best causal models can't even tell us the sign of our long-run effects, so where exactly does the dominance argument get its numbers; (c) the population-ethics hostage situation — whether strong longtermism just is total utilitarianism plus empirical speculation, and whether the "robustness" reply smuggles in a framing where only the far-future-affecting verdicts get counted as varying across views.

  I also want a question about something I've been chewing on and can't quite settle. As I read the literature, there are two framings floating around and they're not equivalent: one is a *dominance* claim, descended from Bostrom's old line about giving priority to maximizing the probability that humanity ends up okay — the idea being that when the downside is permanent, tiny reductions in risk swamp competing considerations without ever doing expected-value arithmetic; the other is a straight expected-value claim about the size of the future. My suspicion is that longtermists slide between these depending on which objection is live — the dominance framing when someone attacks the probability estimates, the EV framing when someone attacks the prioritization — and I'd like a question (plus follow-up) that corners him on which one he actually believes and what breaks if he commits to it. And end with one question about what would count as evidence *against* strong longtermism, since he's fond of saying it's just decision theory plus astronomy and I want to know if there's any observation that could, in principle, unseat it.

  Don't worry about name-dropping beyond the obvious stuff, and keep each question self-contained enough that a reader with no background can follow it — my listeners are smart but the guest has a habit of answering the version of a question he wishes he'd gotten, so phrasing has to do real work. Thanks a ton.
reasoning: |-
  Okay, let me break down this philosophy professor's request. They need interview questions for a longtermism advocate that cut through rehearsed arguments. The key challenges are fanaticism, cluelessness, and population ethics, plus two structural concerns about dominance vs EV framing and falsifiability.

  First, the fanaticism angle. The guest typically counters with "real probabilities vs Pascal's Wager." But when payoffs become astronomical, probability estimates lose meaning. The follow-up needs to expose this by asking how we distinguish meaningful estimates from speculative ones when stakes are extreme. Maybe use the "astronomical waste" argument as a test case.

  For cluelessness, the guest equates it with ordinary charity's uncertainty. But this misses how longtermism's causal chains are uniquely opaque. The follow-up should demand specific examples where longtermist interventions have traceable, positive long-term effects compared to alternatives. How do we know the sign isn't negative?

  On population ethics, the robustness claim seems circular. The follow-up should ask why only far-future consequences count as "varying verdicts" when near-term effects clearly differ across ethical frameworks. This exposes the total utilitarianism assumption.

  The dominance vs EV framing issue is subtle. The guest likely switches between "avoiding extinction is priority #1" and "maximizing expected value." The follow-up must force a choice: if probabilities are unmeasurable, does dominance still hold? And if so, doesn't that make longtermism unfalsifiable?

  Finally, falsifiability. Since the guest claims it's "decision theory plus astronomy," what astronomical evidence could disprove it? If nothing can, that reveals a dogma problem.

  Each question needs to be self-contained to prevent evasion. The dominance/EV trap is particularly crucial - it's where the argument feels most slippery. The falsifiability close leaves the guest accountable. Structuring follow-ups as concrete demands ("give one example") prevents vague answers.
answer: |-
  Here are ten interview questions designed to pierce rehearsed answers, with precise follow-ups targeting your specified concerns. Each question is self-contained, avoids jargon traps, and corners the guest on substantive tensions:

  1. **Core Framing**: "You argue that strong longtermism is the *key* moral priority because influencing the far future dominates other actions in expected value. But I see two distinct arguments in the literature: one is a *strict dominance* claim (‘avoiding extinction must be prioritized above all else, since losing the future is infinitely bad’) and the other is an *expected value calculation* (‘the future is so vast that even tiny probabilities of saving it swamp other goods’). Which is the actual foundation of your view? If we must choose one, which breaks if abandoned?"  
     *[Follow-up if he hedges]:* "When critics attack probability estimates (e.g., AI risk), you lean on dominance (‘even 0.1% risk demands action!’). When they attack prioritization (‘why not help the poor?’), you lean on EV (‘the numbers are astronomical!’). If forced to commit: does strong longtermism stand or fall on our ability to quantify probabilities of astronomic value? Or does it hold even if those probabilities are fundamentally unmeasurable?"

  2. **Fanaticism**: "The fanaticism objection says that expected-value reasoning with tiny probabilities of huge payoffs leads to absurdities—like donating to dubious asteroid-deflection startups over proven malaria nets. You reply that existential risks involve ‘real, estimable probabilities.’ But at what point do the *payoffs* become so large that our probability estimates lose meaning? For example, if we claim a 1/10,000 chance of saving *a trillion* future lives, is that still ‘estimable’? Or does it collapse into Pascalian metaphysics?"  
     *[Follow-up]:* "You cite asteroid impacts as having ‘real’ probabilities. But Bostrom’s ‘astronomical waste’ argument requires valuing *potential* futures where humanity colonizes the galaxy. Since we have zero evidence that such futures are possible, how is assigning them *any* positive probability meaningfully different from assigning probability to Roko’s Basilisk?"

  3. **Cluelessness (Inside EV Framework)**: "You’ve said cluelessness applies equally to near-term charity: we can’t predict if donating to a school in Somalia ultimately causes harm. But longtermism is uniquely vulnerable because it requires *comparing* the long-run effects of (say) AI safety work versus climate policy. If our best models can’t even discern the *sign* of these effects (positive/negative), how can you claim existential risk reduction *dominates*? Where do the numbers come from if not arbitrary assumptions?"  
     *[Follow-up]:* "Give one example where we can reliably trace the long-term causal path (>200 years) of an existential risk intervention and confirm its net effect is positive *compared to its alternatives*. If we lack such examples, isn’t the ‘dominance’ claim just an article of faith?"

  4. **Population Ethics Hostage-Taking**: "You say strong longtermism is robust across population ethics views. But doesn’t this rely on defining ‘robustness’ only over theories that *already* prioritize the far future? For instance: person-affecting views, average utilitarianism, or negative utilitarianism often reject the ‘loss of potential people’ as a harm. Isn’t the ‘robust consensus’ circular—presupposing total utilitarianism’s framework?"  
     *[Follow-up]:* "If a theory says creating future happy people has *no moral weight* (e.g., anti-natalism), or that reducing suffering trumps adding happiness (negative utilitarianism), doesn’t strong longtermism collapse? Or do you just exclude those views from the ‘wide range’ you mention?"

  5. **The Bargaining Chip**: "Strong longtermism treats the present as a ‘bargaining chip’ for the future. But this seems to license sacrificing concrete, knowable goods (e.g., alleviating current poverty) for speculative gains. What’s the *strongest* near-term moral claim that could *override* longtermist priorities in your framework? Or is no present harm too great if it slightly reduces x-risk?"

  6. **Epistemic Humility**: "Astronomer Carl Sagan said ‘extraordinary claims require extraordinary evidence.’ Strong longtermism makes extraordinary claims: that we can predict and influence events millennia hence with enough precision to reorient all philanthropy. What’s the *weakest link* in this chain—the point where the argument most relies on conjecture rather than evidence?"

  7. **The Institutional Critique**: "Critics like Leif Wenar argue that longtermist institutions (e.g., grantmaking bodies) lack accountability because their ‘impact’ is inherently unverifiable. How do you ensure that ‘saving the future’ doesn’t become an unfalsifiable mandate for elite-driven resource allocation?"

  8. **Collateral Damage**: "Some longtermist interventions could cause near-term harm (e.g., delaying deployment of beneficial AI, or diverting funds from disease eradication). By what mechanism do we weigh *certain* harm to existing people against *probabilistic* benefits to potential future people? Does your framework allow for vetoes if harms exceed a threshold?"

  9. **The Total View Trap**: "Isn’t strong longtermism functionally equivalent to ‘total utilitarianism plus techno-optimism about space colonization’? If we reject either premise—e.g., if we doubt humans can sustainably expand beyond Earth, or if we value suffering prevention over quantity of lives—doesn’t the entire case unravel?"

  10. **Falsifiability**: "You call strong longtermism ‘decision theory plus astronomy.’ But what would *falsify* it? If we discovered humanity has a 0% chance of space colonization, would that suffice? If not, what evidence could *possibly* defeat it—or is it insulated from empirical challenge?"  
      *[Follow-up]:* "If no observation can unseat strong longtermism, doesn’t it function more like a moral axiom than a testable hypothesis? And if so, why frame it as a conclusion from ‘astronomy’?"

  ---

  **Key design notes**:
  - **Dominance vs. EV Trap (Q1)** directly confronts the rhetorical slide you described. The follow-up forces a choice: either longtermism depends on quantifiable probabilities (making it vulnerable to cluelessness/fanaticism) or it becomes a dominance-based dogma.
  - **Fanaticism (Q2)** pushes beyond "probabilities are real" by questioning whether cosmic-scale payoffs *can* be meaningfully coupled with probabilities. The follow-up evokes Roko’s Basilisk to test his threshold for "estimable."
  - **Cluelessness (Q3)** frames the problem as *internal* to EV maximization. The follow-up demands a concrete causal chain—exposing the lack of empirical traction.
  - **Population Ethics (Q4)** targets the "robustness" sleight-of-hand by citing views that *reject* the core valuation of potential lives. The follow-up asks him to defend exclusions.
  - **Falsifiability (Q10)** is the kill switch: if he admits nothing could falsify strong longtermism, it reveals itself as non-empirical; if he offers falsifiers, it opens the door to counter-evidence.

  All questions avoid name-dropping (besides Bostrom/Sagan for clarity) and are phrased to preempt deflection. The guest must either engage the substance or reveal evasion. Good luck!
