prompt: |-
  I'm applying for a two-year postdoctoral fellowship on conceptual AI safety, and I want to build the application around a half-formed idea about the contrast between approval-directed and goal-directed agents. The distinction is usually drawn architecturally: a goal-directed agent optimizes a fixed objective fixed in advance, while an approval-directed agent takes actions it expects an approver to judge favorable, deferring to ongoing judgment rather than to a frozen specification. My suspicion is that this architectural contrast is the surface of something deeper, namely a temporal question about when commitment to values happens: goal-direction bakes the commitment in at design time, approval-direction postpones it to run time. And my worry is that the distinction does not survive iterated learning, because an agent that repeatedly anticipates an approver's judgments will eventually internalize them into something functionally like a fixed objective, at which point approval-direction quietly collapses into goal-direction with extra steps. If that's right, the interesting question is not which architecture to build but which desirable properties of approval-direction survive the collapse, and whether they can be secured by other means.

  Please turn this into a two-page research proposal. State the question precisely enough that it has a determinate answer, explain why the standard positions leave it open, and set out the method: what I would actually do over the two years, in six-month phases, and what progress looks like for a conceptual rather than empirical project. I want the proposal to include an honest account of what would count as the project failing, for instance if the collapse thesis turns out to be unstatable without a formal notion of internalization that no one can supply, or if the analysis ends up restating the familiar corrigibility literature in new vocabulary. The deliverable I'm imagining is a framework that tells designers which properties to check for as an agent learns its approver, but I'm open to being told that a narrower or different deliverable is more realistic. Don't include a bibliography or citations; I will add references myself, and refer to positions and arguments in prose instead. Please write the response as continuous prose only, with no headings, bullet points, bold text, or tables, the way one would write a letter to a senior colleague.
