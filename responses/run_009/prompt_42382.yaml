answer: |-
  Here’s a complete design for your adversarial game, optimized for your 75-minute session. It focuses on forcing students to "invent" the means/side-effect distinction through gameplay, with constraints to prevent chaos and a structured debrief to map their discoveries onto the doctrine of double effect (DDE). I’ve incorporated safeguards for common pitfalls and highlighted what the game can’t replicate.

  ---

  ### **Game Design: "Consistency Trap"**
  **Objective**: Teams compete to expose inconsistencies in moral judgments, leading students to spontaneously generate distinctions like means vs. side effects to "save" themselves.  
  **Teams**: Split 14 students into **Group 1** and **Group 2** (7 each). Each group serves as **Case Writers (Team A)** and **Judges (Team B)** for one half of the game.  
  **Rounds**: 2 rounds per half (4 total), 10 minutes per round.  
  **Time Allocation**:  
  - Intro (5 min)  
  - First half: Group 1 (A) vs. Group 2 (B) – 20 min (2 rounds × 10 min)  
  - Role swap (1 min)  
  - Second half: Group 2 (A) vs. Group 1 (B) – 20 min (2 rounds × 10 min)  
  - Debrief (29 min)  

  ---

  #### **Game Rules**  
  **1. Case Writing (Team A, per round)**:  
     - **Task**: Secretly write a **pair of scenarios** (2–3 sentences each) predicting Team B will judge inconsistently (e.g., one permissible, one impermissible).  
     - **Constraints** (to prevent chaos):  
       - **Settings**: Trolley track, hospital, bridge, or factory.  
       - **Actions**: Pull lever, push person, switch tracks, remove barrier, or use body (e.g., organ transplant).  
       - **Outcomes**: Harm to 1 innocent person, save 5 lives. No sci-fi, magic, or extrinsic factors (e.g., emotions, relationships).  
       - **Key rule**: Both scenarios in a pair must share the **same setting and net outcome** (e.g., "trolley track, 1 dies/5 saved" for both). This isolates the means/side-effect distinction as the primary variable.  
     - **Time**: 5 minutes to write. Submit to you (the instructor) privately.  

  **2. Judging (Team B, per round)**:  
     - **Task**: Vote on permissibility (yes/no) for each scenario.  
     - **Process**:  
       - You read both scenarios aloud (display if possible).  
       - Team B discusses for **2 minutes** to agree on consistent reasoning (emphasize they must justify judgments to avoid arbitrariness).  
       - **Individual voting**: Each Team B member votes anonymously (e.g., paper slips) to prevent groupthink. Majority wins for each scenario.  
     - **Scoring**:  
       - **Team A scores 1 point** if the verdicts are inconsistent (one permissible, one impermissible).  
       - **Team B scores 1 point** only if their judgments are **consistent with all prior rounds** (e.g., if Round 1 judged "push" impermissible, Round 2 must judge a similar "push" scenario the same). You track this on the board.  

  **3. Role Swap**: After two rounds, teams switch roles. Group 1 becomes Team B, Group 2 becomes Team A.  

  **4. Winning**: The team with the most points as **Team A** wins (max 2 points per half). Team B’s consistency points are a tiebreaker. **No prizes needed**—bragging rights suffice.  

  ---

  #### **Why This Works**  
  - **Team A incentive**: Score by creating **subtle, DDE-relevant pairs** (e.g., trolley switch vs. push, or transplant vs. redirected threat). "Maximally weird" cases backfire (harder to force inconsistency).  
  - **Team B incentive**: Consistency scoring rewards **cross-round coherence**, forcing them to articulate principles (e.g., "we said no to pushing, so we must say no to all direct bodily harm").  
  - **Constraints prevent chaos**: Fixed settings/outcomes ensure differences lie in **means vs. side effects** (e.g., loop tracks fit "trolley" setting).  

  ---

  ### **Predicted Student Moves & How They Lead to DDE**  
  During the game, Team B will scramble to justify inconsistencies. **Key moments to watch for in debrief**:  
  1. **"Would the plan work if the person weren’t there?"**:  
     - E.g., In **transplant** (intended means), the death is essential for the plan. In **trolley switch** (side effect), the plan works even if the person isn’t killed (e.g., they escape). Students will use this to defend judgments.  
     - **Map to DDE**: Condition 3 (good effect must not be caused by the bad effect).  

  2. **"Did you directly cause harm?"**:  
     - E.g., **Pushing** feels "direct"; **pulling a lever** feels "indirect." Students may conflate this with physical proximity.  
     - **Map to DDE**: Reframe as intention (Condition 2). Ask: "Is the harm part of your goal (means) or just a consequence?"  

  3. **Gerrymandered principles**:  
     - E.g., "Pushing is wrong, but lever-pulling is okay if it’s blue." Highlight how DDE is more parsimonious.  

  ---

  ### **Debrief Structure (29 min)**  
  **Goal**: Connect student-generated distinctions to DDE and its critiques.  

  1. **List judgments** (5 min):  
     - Display all scenarios and verdicts. Identify where Team A scored (inconsistent pairs) and where Team B scored (consistency).  

  2. **Analyze student principles** (10 min):  
     - For each inconsistent pair, ask Team B: *"Why did you judge these differently?"*  
     - Expected answers:  
       - "In the **push scenario**, we *used* the person; in the **lever scenario**, death was a *side effect*." → **Means vs. side effect**.  
       - "In **transplant**, the doctor *needs* the death to save lives; in **trolley**, the death isn’t *necessary* for the save." → **Intention/foresight**.  
     - Write principles on the board.  

  3. **Map to DDE** (7 min):  
     - Introduce DDE’s four conditions:  
       - (1) Action is good/neutral,  
       - (2) Intention is good (bad effect is not intended),  
       - (3) Bad effect isn’t the means to the good effect,  
       - (4) Proportionality (good outweighs bad).  
     - **Highlight matches**:  
       - Student "plan" test → Condition 3.  
       - "Directness" → Condition 2 (intention).  
     - **Pressure points**:  
       - **Loop-track case**: If students judged it impermissible, ask: *"Is the death a means (Condition 3) or a side effect?"* (Debates: Does the loop make the death essential?).  
       - **Transplant vs. trolley**: Why is transplant worse? (Condition 3 + inherent wrongness of cutting).  

  4. **Discuss limitations** (5 min):  
     - **Gerrymandered principles**: Ask: *"Did Team B invent arbitrary rules? How is DDE better/worse?"*  
     - **What the game misses**:  
       - DDE’s **normative foundation** (e.g., *why* should intention matter?).  
       - **Emotional/cultural factors** (e.g., pushing feels personal; the game abstracts this).  
       - **Real-world ambiguity** (e.g., "intention" is often murky; the game assumes clear cases).  

  ---

  ### **What Will Predictably Go Wrong (and Fixes)**  
  1. **Problem**: Case pairs differ in >1 way (e.g., "trolley switch with a lever" vs. "hospital transplant").  
     - **Fix**: Enforce same setting/outcome. Pre-warn: "If your pair isn’t parallel, Team B can easily justify differences."  

  2. **Problem**: Team B invents a "Frankenstein principle" (e.g., "Pushing is wrong on Tuesdays").  
     - **Fix**: In debrief, contrast with DDE: "Does your rule work beyond this game? DDE tries to be universal."  

  3. **Problem**: Time overruns during writing/judging.  
     - **Fix**: Use a timer. Cut discussions at 2 mins. Have backup examples (e.g., standard trolley vs. push) if teams stall.  

  4. **Problem**: Team B votes consistently but arbitrarily (e.g., always "no" to everything).  
     - **Fix**: Consistency scoring forces them to engage—if they judge all pushes "impermissible," they must condemn lever-pulling if it’s analogous.  

  ---

  ### **What the Game Can’t Replicate**  
  - **Moral weight of intention**: The game treats "intention" as embedded in the scenario description, but real debates hinge on **mental states** (e.g., "Did the agent *aim* at the harm?"). Students may miss this nuance.  
  - **Cultural/philosophical depth**: DDE is rooted in natural law theory (Aquinas) and clashes with utilitarianism. The game reveals the *distinction* but not *why* it matters.  
  - **Emotional resonance**: The horror of pushing someone won’t emerge from a 2-sentence scenario. Use the debrief to acknowledge: "In real life, the 'personal force' factor might sway us, but DDE ignores it."  

  ---

  **Final Tip**: Start with a quick example (e.g., "Trolley switch = permissible? Fat man push = impermissible?") to prime thinking without giving away DDE. This design ensures students wrestle with the distinction organically, making the DDE lecture feel like a revelation, not a chore.
