  ### In-Class Game Design: Exploring the Doomsday Argument Intuitively

  #### **Game Overview**
  - **Objective**: Students bet on which of two hypothetical populations they belong to, using only their randomly assigned "birth order" number.  
  - **Key Insight**: Lower numbers feel more likely in a smaller population, creating an intuitive pull toward the "doom" scenario (small population).  
  - **Structure**: Two rounds (plain vs. selection-effect variant) with fake-currency bets to incentivize reasoning.  
  - **Debrief**: Students articulate self-sampling logic before formal terms (Carter, Leslie) are introduced.

  ---

  #### **Round 1: Plain Version (10 minutes)**  
  **Setup**:  
  - Two population hypotheses:  
    - **Small (Doom)**: 100 total individuals.  
    - **Large (Boom)**: 1,000 total individuals.  
  - **Random assignment**:  
    - Secretly flip a coin: heads → Small, tails → Large.  
    - Assign each student a unique random number based on the population:  
      - Small: Randomly draw 16 distinct numbers from 1–100.  
      - Large: Randomly draw 16 distinct numbers from 1–1,000.  
    - Write numbers on slips, shuffle, and distribute.  

  **Betting Rules**:  
  - Each student starts with 100 units of fake currency.  
  - They bet on **Small** or **Large** after seeing their number.  
  - Payout:  
    - Correct bet: Double the wager (e.g., bet 50 → win 100).  
    - Incorrect bet: Lose the wager.  
  - **Incentive**: Students must bet ≥10 units (no coasting).  

  **Expected Student Reasoning**:  
  - Numbers ≤100: *"I could be in either population, but low numbers feel more likely in Small."*  
  - Numbers >100: *"I must be in Large—Small doesn’t go past 100!"*  
  - **Bayesian nudge**: Students with numbers ≤100 should strongly favor Small (10:1 odds).  

  **Predicted Outcome**:  
  - If Small: All bet on Small → all win.  
  - If Large: Most (90%+) have numbers >100, bet on Large and win; 1–2 with numbers ≤100 bet on Small and lose.  
  - **Emotional hook**: Losers in Large feel "unlucky"—their low number misled them.  

  ---

  #### **Round 2: Selection-Effect Variant (10 minutes)**  
  **Twist**: Change how students are "selected" for the game:  
  - **Small population**: Still random sample from all 100.  
  - **Large population**: Only individuals with numbers **900–1,000** (last 100) can be selected.  
  - **Assign numbers**:  
    - Small: Randomly draw 16 numbers from 1–100.  
    - Large: Randomly draw 16 numbers from 900–1,000.  

  **Betting Rules**: Same as Round 1.  

  **Expected Student Reasoning**:  
  - Numbers 1–899: *"Must be Small—Large only has 900+!"*  
  - Numbers 900–1,000: *"Could be either, but 900+ is guaranteed in Large, while rare in Small (only 1–100)."*  
  - **Bayesian insight**: For 900–1,000:  
    - P(Small | 900–1000) = 0% (Small maxes at 100).  
    - P(Large | 900–1000) = 100%.  
    - Students realize they’d only be in the room under Large if they’re in the "late" group.  

  **Predicted Outcome**:  
  - If Small: All have numbers 1–100 → all bet on Small and win.  
  - If Large: All have numbers 900–1,000 → all bet on Large and win.  
  - **Aha moment**: Students see that their presence in the game *depends on the population hypothesis*—a direct experience of **selection effects**.  

  ---

  #### **Debrief (15 minutes)**  
  **Guided Discussion**:  
  1. **Recap feelings**:  
     - *Round 1 losers*: "Why did you bet on Small? What made your number feel informative?"  
     - *Round 2*: "Did anyone change their strategy? Why?"  
  2. **Map to concepts**:  
     - **Self-Sampling Assumption (SSA)**: "You reasoned as if you were a random observer from all possible observers. In Round 1, this made low numbers feel 'doomy'."  
     - **Selection Effect**: "In Round 2, you realized your number isn’t just data—it’s *conditional* on being selected. If you’re here, you must be in the last generation of Large."  
  3. **Name the philosophers**:  
     - Only after students articulate SSA: "This is Brandon Carter and John Leslie’s **Doomsday Argument**."  
     - After selection-effect talk: "Objections like the **presumptuous philosopher** say SSA overweights large populations—just like you did in Round 1."  

  **What the Game Can’t Replicate**:  
  - **The real doomsday stakes**: In class, "doom" is a small population—low stakes. The real argument’s emotional weight (human extinction) must be discussed.  
  - **Anthropic tension**: Students might not grasp why being "random" feels natural. Highlight: "SSA assumes you’re typical. But are you?"  

  ---

  #### **Predictable Pitfalls (and Fixes)**  
  1. **Round 1 confusion**: Students with numbers 51–100 in Small might say, "I’m late, so Large is likely!"  
     - *Fix*: Clarify: "Your number is a *random draw*, not your literal birth order. Think: 'Would 51 be rare in Large?'"  
  2. **Betting timidity**: Some may bet minimally to avoid loss.  
     - *Fix*: Enforce ≥10-unit bets and praise bold reasoning.  
  3. **Selection-effect leap**: Students might not link Round 2 to anthropics.  
     - *Fix*: Ask: "In Round 2, would you exist to play this game if Large were true and you were born early?"  

  ---

  #### **Logistical Notes**  
  - **Time**: 5 min setup, 20 min gameplay, 15 min debrief.  
  - **Materials**: Coin, numbered slips, fake currency (paper chips).  
  - **Tech Alternative**: Use a random number generator if slips are impractical.  
  - **Takeaway**: Students feel the tension between "randomness" and "being selected" before wrestling with formal philosophy.
