          Population A: 100 individuals. We draw 16 at random.
          Population B: 1000 individuals. We draw 16 at random from the entire population.

          BUT, in population B, we have a twist: you (the student) are only in the room if your birth rank is in the top 50% of the population. How does that work?

          In population B, we first draw 16 at random from the entire population. Then, we remove any individual whose birth rank is in the first 500 (i.e., the first half). So if the drawn individual has birth rank <=500, they are not invited to the room. We only keep those with birth rank >500. Then, if we have less than 16, we redraw until we have 16 individuals with birth rank>500.

          This means that in population B, the room is force to be from the second half. In population A, there is no such filter.

          Now, the birth ranks in the room:
            A: 1-100 (any)
            B: 501-1000

          Again, disjoint.

     I think we have to accept that in Round 2, we want to illustrate the selection effect by making the students realize that they are a selected sample. So let's do it with a different kind of selection.

     Round 2: The Doomsday Selection
          We tell the students: 
            In both populations, we only invite individuals to the room if they are among the last 100 to be born.

          Therefore:
            In population A (100 total): the last 100 are ranks 1 to 100 (everyone, since there are only 100). So we draw 16 from 1-100.
            In population B (1000 total): the last 100 are ranks 901 to 1000. So we draw 16 from 901-1000.

          This is the same as before, and disjoint.

     Given the time, I propose we shift to a different example for the selection effect that does not rely on numerical birth rank but on a more abstract property.

     Alternatively, we can use a different analogy. One common analogy is the urn analogy with two urns:

          Urn A: contains 10 balls
          Urn B: contains 1000 balls

          You are handed a ball at random. It has a number on it. If the number is between 1 and 10, it could be from either urn. If it's between 11 and 1000, it must be from urn B.

          This is our Round 1.

          For Round 2, we change the selection process:

            Urn A: we always hand you a ball from urn A (if urn A is chosen) that is between 1 and 10.
            Urn B: we only hand you a ball from urn B if it is between 991 and 1000.

          Then the numbers you might see:

            Urn A: 1-10
            Urn B: 991-1000

          These are disjoint. So if you see 1-10, it's A. 991-1000, it's B.

     This is not working.

     Perhaps the only way to have overlap is to have the numbering be the same in both populations for the room, but have the room drawn from the entire population in one and from a subset in the other, but have the subset include numbers that are also in the small population.

     How about:

          Population A: 100 individuals, numbered 1 to 100.
          Population B: 1000 individuals, numbered 1 to 1000.

          Room selection:
            A: draw 16 from 1-100.
            B: draw 16 from 1-1000, but then we apply a filter: we only keep the individuals whose number is in the set {1,2,...,100} union {900,901,...,1000}. So the room in B is either from the first 100 or the last 100.

          Then in B, we might have some individuals from 1-100 and some from 900-1000.

          In A, we only have 1-100.

          Now, if a student sees a number between 101 and 899, it's impossible? So we must not generate that.

          In B, when we draw, we might get a number between 101 and 899. Then we would have to discard and redraw? Or we can condition on being in the union. 

          So for B, we are drawing 16 times from the set {1..100} union {900..1000}. This set has 200 numbers.

          Therefore, the probability of drawing a number in 1-100 in B is 100/200 = 0.5, and in 900-1000 is 0.5.

          In A, we are drawing from 1-100.

          Now, the student sees a number. What do they learn?

            If they see a number between 101 and 899: impossible, so we assume it doesn't happen.

            If they see a number in 1-100: 
               It could be from A or from B.

            If they see a number in 900-1000: 
               It must be from B.

          Therefore, if they see 900-1000, they know B. If they see 1-100, it could be A or B.

          For a student who sees a number in 1-100:

            P(A | see 1-100) = P(see 1-100 | A) * P(A) / P(see 1-100)
            P(see 1-100 | A) = 1   (because in A, all are in 1-100)
            P(see 1-100 | B) = 0.5 (because in B, half of the room is in 1-100)

            P(see 1-100) = P(A) * 1 + P(B) * 0.5 = 0.5 * 1 + 0.5 * 0.5 = 0.5 + 0.25 = 0.75

            P(A | see 1-100) = (1 * 0.5) / 0.75 = 2/3.

            So they should bet on A with 2/3 probability.

          But note: in population B, there are 1000 individuals, but only 200 are eligible. The chance that you are in the room in B is 200/1000 = 0.2, while in A it is 100/100 = 1. So if you are in the room, and you are in the set 1-100, then it's more likely that you are from A because in A you are sure to be in the room if your number is 1-100 (which it always is) but in B, you might not be in the room even if your number is in 1-100 because the room is only drawing from half of the 1-100 (wait, no: in B, the room draws from the union, so any individual in the union has an equal chance? But the union has 200 out of 1000, so the chance for an individual in 1-100 to be in the room is 16/200 ? Not exactly, because we are drawing 16 from 200. The chance that any particular individual in the union is in the room is 16/200 = 0.08.

            In A, the chance that a particular individual is in the room is 16/100 = 0.16.

            Therefore, if you are an individual with number 1-100, the chance that you are in the room is twice as high in A as in B. 

            So then: 
               P(A | you are in the room and your number is in 1-100) = P(in room | A) * P(A) / [P(in room | A)*P(A) + P(in room | B) * P(B)] 
                            = (0.16 * 0.5) / (0.16*0.5 + 0.08*0.5) = (0.08) / (0.08 + 0.04) = 0.08/0.12 = 2/3.

            So the update is the same.

     Therefore, in Round 2:

          We.
            have two populations: A (100) and B (1000).
            Coin flip to choose.
            If A: generate 16 distinct birth ranks from 1-100.
            If B: generate 16 distinct birth ranks from the set {1..100} union {900..1000} (which has 200 numbers).

          Then, we give each student a birth rank.

          The student's number:
            - If it's between 101 and 899, then it's an error (shouldn't happen in B because we are drawing from the union).
            - If between 900 and 1000, then it must be B.
            - If between 1 and 100, then it could be either, and they should assign 2/3 to A.

     This finally gives us the selection effect: in population B, we are only sampling from the union of the first 100 and the last 100, so low numbers are less surprising in population A.

     However, note: in population B, the probability of drawing a low number (1-100) is 100/200 = 0.5, and in population A, it's 1. So it's more likely in A.

     This is the selection effect: in population B, you are less likely to be in the room if you are a low number because only half of the room is reserved for low numbers, whereas in population A, every number is in the room.

     So Round 2 will be:

          Generate 16 numbers:
            If A: from 1-100.
            If B: from {1..100} union {900..1000} (200 numbers).

          Each student sees their number.

          They bet:
            If their number is between 900 and 1000: bet everything on B.
            If between 1 and 100: then they should bet on A with 2/3 of their money? Or they can do a Bayesian update and bet on A with probability 2/3.

          But note: the Bayesian update says P(A|number in 1-100)=2/3, so they should bet on A if they are risk neutral and maximize expected value. Since the payout is even, they should put all on A if they think A is more likely? But 2/3>1/2, so they should put everything on A.

          However, if they are risk averse, they might not. But we assume risk neutrality.

     So we have the two rounds.

     What will predictably go wrong:
          - In Round 1, if the population is large, the students with numbers<=100 will lose. They might feel cheated because they used the recommended strategy and lost. We can explain that it's a low-probability event but can happen.
          - In Round 2, if the population is B, then we will have some students with numbers in 1-100 and some in 900-1000. The ones in 900-1000 will know it's B and win. The ones in 1-100 will bet on A and lose. Then we can discuss: why did you ( the ones in 1-100) bet on A? Because the update said 2/3 for A. But it turned out to be B. So you are in the 1/3 of the time when it's B and you have a low number. This is the selection effect: you condition on being in the room, and in B, you are in the room but you are in the low part, which is less likely than in A.

     The part that no classroom game can reproduce:
          - In the real Doomsday Argument, the selection effect is that you are alive now to make the observation. In our game, we artificially create the room (which is the set of observers) with a particular selection method. In the real argument, the selection method is that you are randomly selected from all humans that will ever live. But in our Round 2, we changed the selection method to be from a subset. The real DA does not have that. 
          - Therefore, in the debrief, we have to explain that the self-sampling assumption (SSA) says that you should reason as if you are a random sample from the set of all observers. In Round 1, we did that. In Round 2, we changed the set of observers to be from a biased sample. The real DA uses SSA without such a bias.

     Summary of the game:

     Round 1 (plain):
          - Coin flip: heads -> population A (100), tails -> population B (1000)
          - If A: generate 16 distinct integers from 1 to 100.
          - If B: generate 16 distinct integers from 1 to 1000.
          - Write these numbers on slips, have each student draw one.
          - Students bet: if number >100, bet on B; else bet on A.

     Round 2 (selection effect):
          - Coin flip again.
          - If A: generate 16 distinct integers from 1 to 100.
          - If B: generate 16 distinct integers from the set S = {1,2,...,100} ∪ {900,901,...,1000} (which has 200 elements).
          - Students draw.
          - Students bet: 
               - If number is between 900 and 1000: bet on B.
               - If number is between 1 and 100: bet on A.
               - (Ignore 101-899, shouldn't occur in B, and in A they are impossible anyway.)

     Note: In Round 2, if the population is B, we might generate a number in 101-899? But our set S does not include them, so we won't. So it's safe.

     Debriefing:
          - In Round 1, if you had a low number, you bet on the small population. Why? Because in the large population, a low number is less likely? Actually, in the large population, the probability of having a number<=100 is only 10%, while in the small population it's 100%. So you are more likely to have a low number in the small population.
          - In Round 2, even if you have a low number, you might be in the large population because in the large population we are sampling from a set that includes low numbers. But it's less likely than in the small population.
          - Map to the doomsday argument: 
               - The populations are possible futures for humanity (short-lived or long-lived).
               - Your birth rank is your position in the history of humanity.
               - In Round 1, you are a random sample from the entire human population (past and future). 
               - In Round 2, we are saying that you are only here to make the observation if you are in a particular part of human history (like the last few generations). 
               - The selection effect in the DA is that you are alive now, which means you are in the set of humans that are born so far, not in the future. This is always true. So it's more like Round 1? 
               - But then why do we need Round 2? To show that if there is a selection effect (like you are only here because you are in a special time) then the update might be different.

          - In the real DA, the selection effect is that you are an early human (relative to the future) might not be around to make the observation. So you are conditional on being born by now. This is similar to Round 1: because in Round 1, you are conditional on being born at all, and in the small population, the chance of being born by now is higher. 

          - Round 2 was designed to show an additional selection effect: that you might be selected in a way that is not representative. In the real world, if we are in the last few generations, then we are not a random sample from the entire human population, but from the last part. 

          - The DA without additional selection effects (Round 1) suggests we are more likely to be in the small population. But if we are in the last few generations (which is a selection effect), then even in the large population we would be in the last few, so we wouldn't update.

          - This is the "doomsday argument is invalid because we are selected to be in the time when we can have this discussion" (which is only possible in the last few generations). 

     Therefore, in the debrief, we should distinguish between:
          - The basic self-sampling (Round 1) which gives an update towards doom.
          - The selection effect that we are necessarily in the late period (Round 2) which weakens the update.

     Finally, the names: Carter, Leslie, and the presumptuous philosopher.

     After the students have discussed, we can say:
          - The update in Round 1 is the doomsday argument by Brandon Carter and John Leslie.
          - The update in Round 2 is related to the observation that we are selected to be in a position to reflect on the argument (which might be only possible in a late stage) and this is one of the objections.
          - The presumptuous philosopher objection: if there are multiple big theories of the universe, and one of them has many more observers, then by the same reasoning you should think that theory is more likely, even if it's more complex? But in our case, the complexity wasn't an issue, only the number of observers.

     We hope this helps.
