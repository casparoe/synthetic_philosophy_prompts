prompt: |-
  I'm one of three volunteer readers for the fiction slush pile at a mid-sized literary magazine — roughly ninety submissions a month, and between that and our day jobs we realistically get fifteen or twenty minutes with most pieces, five minutes when the queue backs up before an issue closes. Our verdicts constantly diverge and the arguments are circular: one reader says quality can't be argued because de gustibus non est disputandum, another says that's just an excuse for letting personal taste masquerade as judgment, and our editor keeps gesturing at Hume's "Of the Standard of Taste" — the idea that even though beauty has no demonstrable rules, some verdicts are simply wrong, and the standard is whatever properly qualified critics would converge on after enough delicacy, practice, and comparison. Great, but the essay gives me nothing I can actually run during a Tuesday night reading session.

  What I want is a decision procedure extracted from Hume that our team can follow: the questions to ask of a piece, in order, with what counts as a sufficient answer to each, where the procedure terminates in a rejection, where it terminates in an acceptance, and — this part matters — where it stops and hands the call to a human because what's left is a judgment call that no procedure should pretend to settle. His ideal critic has those five qualifications (delicacy, practice, comparison, freedom from prejudice, good sense, roughly), and I want the procedure to translate each into something checkable, not a vibe. I'm aware some parts won't survive translation — like the test of time, which seems useless prospectively since nothing submitted to us has stood the test of anything yet, and like the passage where he basically lets young readers off the hook for preferring love poetry, which suggests some disagreements are blameless and the standard just doesn't reach them. Be upfront about those limits rather than papering over them.

  Then run the procedure on three real-ish cases from our queue: a technically polished but formulaically sentimental story that two of us adored and one dismissed; a clumsy first effort with a genuinely striking central image; and a deliberately ugly, misanthropic piece that our most practiced reader insists is the best thing we've gotten all year. Include at least one case where the procedure gives the answer I won't like (I suspect the sentimental one is mine to lose), and tell me plainly what the procedure cannot do — where Hume's essay itself is indeterminate and any checklist built from it is judgment wearing a costume.
reasoning: |-
  Okay, let me tackle this user's problem. They're a volunteer reader for a literary magazine's slush pile, dealing with about 90 submissions monthly. With limited time per piece, their team struggles with divergent verdicts and circular arguments about taste versus judgment. The editor references Hume's "Of the Standard of Taste," but they need a practical decision procedure derived from it.

  First, I need to unpack Hume's essay. He argues that while taste is subjective, some judgments are objectively wrong when made by qualified critics. The five qualifications are delicacy (noticing subtle details), practice (experience), comparison (knowledge of works), freedom from prejudice (no bias), and good sense (interpreting parts in relation to the whole). 

  The user wants a step-by-step checklist translating these into actionable questions. They also want clear termination points for rejection, acceptance, or passing to human judgment. Important limitations: the test of time doesn't apply to new submissions, and some genre preferences are blameless per Hume.

  I'll structure the procedure as a flowchart with three outcomes: reject, accept, or "human judgment zone." Each Humean qualification becomes a concrete question. For example:
  - Delicacy: Does the piece offer distinctive details or avoid clichés?
  - Practice: Does it demonstrate craft awareness?
  - Comparison: Does it engage with literary tradition?
  - Freedom from prejudice: Is there evidence of bias?
  - Good sense: Do elements cohere into a unified effect?

  The procedure must acknowledge where Hume is indeterminate—like when blameless preferences apply or when innovation defies comparison.

  Next, applying this to their three cases:
  1. The polished but sentimental story: Might fail on delicacy (clichéd) and comparison (derivative), but human judgment if it resonates emotionally despite flaws.
  2. The clumsy piece with striking imagery: Likely passes delicacy but fails practice. Rejection unless the image is extraordinary enough for human review.
  3. The misanthropic piece: Probably passes all Humean checks—strong delicacy, practice, etc.—leading to acceptance unless prejudice interferes.

  I need to highlight where the procedure conflicts with personal taste, especially in the sentimental story case. Also, emphasize that genre preferences or innovative works might require human judgment.

  Finally, outline the procedure's limits: can't resolve blameless disagreements, assess originality without comparison data, or handle experimental works that defy norms. The checklist is a tool, not a replacement for nuanced discussion.
answer: |-
  Here's a Humean Decision Procedure (HDP) extracted from "Of the Standard of Taste," designed for speed and clarity in a slush pile context. It prioritizes disqualifiers first and explicitly flags where Hume's standard becomes indeterminate, forcing a human judgment call.

  **Core Principle:** The HDP seeks *competence* and *absence of disqualifying flaws* according to Hume's qualified critic. It doesn't guarantee "greatness" but identifies work worthy of serious consideration (Accept) or clearly flawed work (Reject). Where competence exists but blameless disagreement is likely, it flags for human judgment ("Human Zone").

  **The 5 Humean Qualifications Translated into Checkable Questions:**

  1.  **Delicacy (Perception of Subtlety):** *Does the piece offer distinctive, non-generic details, language, or observations that demonstrate a refined or unique perception?*  
      *   **Sufficient (Pass):** Specific, fresh imagery; nuanced character reactions; original metaphors; avoidance of cliché in key moments.
      *   **Insufficient (Fail):** Reliance on stock phrases, predictable descriptions, emotionally manipulative tropes without fresh perspective.
      *   *Check Time: <3 mins (Scan for vivid/unique phrases, key descriptions, emotional climaxes).*

  2.  **Practice (Awareness of Craft):** *Does the piece demonstrate fundamental technical competence and awareness of narrative conventions?*  
      *   **Sufficient (Pass):** Consistent POV; functional grammar/proofreading; coherent plot/logic (even if simple); clear sentences; purposeful structure (even if unconventional).
      *   **Insufficient (Fail/Reject):** Unintentional POV shifts; pervasive grammatical errors impeding comprehension; plot holes breaking internal logic; sentences so tangled meaning is lost; structure so chaotic it feels accidental.
      *   *Check Time: <5 mins (Focus on opening, transitions, climax, resolution).*

  3.  **Comparison (Context within Tradition):** *Does the piece demonstrate awareness of or engage meaningfully with the broader literary landscape (genre, style, theme), even if only implicitly?*  
      *   **Sufficient (Pass):** Recognizable genre conventions used effectively or subverted purposefully; stylistic choices (e.g., minimalism, maximalism) executed consistently; themes handled with depth beyond the superficial.
      *   **Insufficient (Fail/Human Zone):** Wholly derivative without purpose or awareness (mere imitation); themes handled superficially/clichéd; stylistic choices inconsistent or seemingly random. *Note: Highly innovative work might *seem* insufficient here initially – this is a key Human Zone trigger.*
      *   *Check Time: <3 mins (Assess genre fit/stylistic coherence, depth of theme).*

  4.  **Freedom from Prejudice (Absence of Bias/Provincialism):** *Is there evidence the work is undermined by the author's unexamined bias, didacticism, or pandering that distorts the reality presented?*  
      *   **Sufficient (Pass):** Characters/ideas treated with complexity; themes explored, not preached; avoids offensive stereotypes *unless* clearly critiquing them; feels authentic, not manipulative.
      *   **Insufficient (Fail/Reject):** Relies on harmful stereotypes without critique; heavy-handed moralizing distorting character/plot; transparently pandering to sentiment or shock value; feels fundamentally dishonest or propagandistic.
      *   *Check Time: <3 mins (Look for caricatures, heavy-handed messaging, reliance on shock/tropes).*

  5.  **Good Sense (Unity of Effect / Purposeful Execution):** *Do the parts cohere into a unified whole, with each element serving a discernible purpose related to the central effect or theme?*  
      *   **Sufficient (Pass):** Ending feels earned by setup; tone consistent or purposefully shifted; details contribute to atmosphere/character/theme; central image/metaphor resonates through the piece.
      *   **Insufficient (Fail/Human Zone):** Ending arbitrary or unrelated; jarring, unintentional tone shifts; irrelevant digressions; central idea/image undeveloped or lost. *Note: Deliberate fragmentation/ugliness requires careful assessment – Human Zone potential.*
      *   *Check Time: <5 mins (Assess ending payoff, tone consistency, relevance of key scenes/details, central image integration).*

  **The Humean Decision Procedure (HDP) Flowchart:**

  1.  **Start:** Read the piece (Aim for 10-12 mins initially).
  2.  **Practice Check (Q2):** *FAIL?* -> **REJECT** (Fundamental incompetence). *PASS?* -> Proceed to Q3.
  3.  **Freedom from Prejudice Check (Q4):** *FAIL?* -> **REJECT** (Fatally flawed by bias/pandering). *PASS?* -> Proceed to Q1.
  4.  **Delicacy Check (Q1):** *FAIL?* -> Proceed to Q5. *PASS?* -> Proceed to Q5 (Note Pass).
  5.  **Good Sense Check (Q5):** *FAIL?* -> **HUMAN ZONE** (Competent but disjointed). *PASS?* -> Proceed to Q3.
  6.  **Comparison Check (Q3):** *FAIL?* -> **HUMAN ZONE** (Competent but derivative/superficial - OR potentially innovative). *PASS?* -> Proceed to Assessment.
  7.  **Assessment:**
      *   **Q1 PASS & Q3 PASS & Q5 PASS:** **ACCEPT** (Meets core Humean standards: competent, unprejudiced, delicate, coherent, contextually aware).
      *   **Q1 FAIL but Q3 PASS & Q5 PASS:** **HUMAN ZONE** (Well-crafted and coherent but lacks distinctive perception - blameless taste divergence likely).
      *   *Any other combination reaching this point is already in Human Zone or Rejected.*

  **What the HDP Cannot Do (Hume's Indeterminacy):**

  1.  **Resolve "Blameless Disagreement":** Hume explicitly states preferences for certain genres/styles (e.g., young readers loving love poetry) are blameless. The HDP flags these as **HUMAN ZONE**. If a piece passes Practice (Q2), Prejudice (Q4), Good Sense (Q5), and even Comparison (Q3) but only *just* fails Delicacy (Q1) for being conventional, the disagreement between readers who value polish/convention vs. those craving innovation *is the blameless zone Hume describes*. The procedure identifies it but cannot resolve it.
  2.  **Definitively Judge Radical Innovation:** A piece that deliberately shatters conventions might *fail* Comparison (Q3) initially because its context isn't yet established. It might also challenge Good Sense (Q5). If it passes Practice (Q2) and Prejudice (Q4), and shows *some* Delicacy (Q1), the HDP pushes it to **HUMAN ZONE**, recognizing the qualified critic needs deeper deliberation to see if it *creates* a new standard through its power.
  3.  **Apply the "Test of Time":** As you noted, this is useless prospectively. The HDP focuses on present competence and perceptible qualities.
  4.  **Quantify "Greatness":** It identifies work meeting the minimum standards of Hume's qualified critic (Accept) or clearly falling short (Reject). Distinguishing between "Good Accept" and "Brilliant Accept" is beyond its scope and Hume's immediate standard for convergence.
  5.  **Override Strong, Rational Human Judgment:** The **HUMAN ZONE** exists for a reason. If the entire team feels strongly that a piece in the Human Zone is exceptional or terrible *despite* the HDP result, Hume would argue that's the qualified critics converging (or diverging blamelessly) after their practiced deliberation. The HDP is a first filter, not a final arbiter.

  **Application to Cases:**

  *   **Case 1: Technically Polished but Formulaically Sentimental Story (Your Suspected Loss)**
      *   Q2 (Practice): PASS (Polished).
      *   Q4 (Prejudice): **FAIL?** This is critical. Does its sentiment feel *manipulative* or *pandering* (FAIL/Reject), or is it sincere within its conventional mode but just not to one reader's taste (PASS)? Let's assume PASS (sincere, just conventional).
      *   Q1 (Delicacy): **FAIL** (Formulaic, uses tropes without fresh perspective).
      *   Q5 (Good Sense): PASS (Polished, coherent).
      *   Q3 (Comparison): PASS (Fits neatly within its sentimental genre tradition).
      *   **HDP Result:** **HUMAN ZONE** (Passes Q2, Q4, Q5, Q3; Fails Q1). *This is the heart of blameless disagreement.* The two who adored it value the polished execution and emotional resonance within the convention (they might argue *some* delicacy in execution). The dismissive reader finds it lacking in distinctive perception. The HDP confirms neither side is "wrong" by Hume's standard – it's a matter of blameless preference for/against conventional modes. The team must argue/deliberate/vote. *You might lose this one, but Hume says your taste isn't inferior, just different in this instance.*

  *   **Case 2: Clumsy First Effort with Genuinely Striking Central Image**
      *   Q2 (Practice): **FAIL** (Clumsy execution, likely technical issues). **HDP Result: REJECT.** The HDP terminates here. Hume is clear: lack of fundamental practice is a disqualifier. The striking image shows *potential* for Delicacy, but without Practice, it doesn't meet the standard. *However:* If the central image is SO extraordinary that it momentarily overshadows the clumsiness for a reader, they might note it passionately during discussion. The HDP forces a Reject, but a truly exceptional image might lead the editor to offer feedback, not publication.

  *   **Case 3: Deliberately Ugly, Misanthropic Piece (Practiced Reader's Favorite)**
      *   Q2 (Practice): PASS (Assumed deliberate ugliness requires control).
      *   Q4 (Prejudice): **CRITICAL CHECK.** Is the misanthropy a genuine exploration, or unexamined bias/edgelord posturing?
          *   *If FAIL (Pandering/Uncritical):* **REJECT.**
          *   *If PASS (Purposeful, complex exploration):* Proceed.
      *   Q1 (Delicacy): LIKELY PASS (Deliberate ugliness often requires sharp, distinctive perception to be effective).
      *   Q5 (Good Sense): LIKELY PASS (If the practiced reader loves it, the ugliness likely serves a unified effect).
      *   Q3 (Comparison): LIKELY PASS (Engages with a tradition of misanthropic/satirical/transgressive literature).
      *   **HDP Result:** **ACCEPT** (Assuming Q4 Pass). This piece meets the core Humean criteria. Its "ugliness" isn't a failure of Delicacy; it's the *application* of delicacy to perceive and render the ugly precisely. Its power lies in its coherence and freedom from simple prejudice (it's exploring, not just ranting). The readers who dislike it likely fall into blameless disagreement based on preference for subject matter/aesthetic, not a failure to meet the standard. The practiced reader's advocacy aligns with Hume's ideal critic.

  **In Summary:** The HDP provides a structured, Humean framework to:
  1.  **Reject** work with fundamental flaws in Practice (Q2) or Prejudice (Q4).
  2.  **Accept** work demonstrating core competence (Q2, Q4 Pass), distinctive perception (Q1 Pass), coherence (Q5 Pass), and contextual awareness (Q3 Pass).
  3.  **Flag for Human Judgment (Human Zone)** work that is competent and unprejudiced but either:
      *   Lacks distinctive perception (Q1 Fail) while being otherwise sound (Case 1 - Blameless Disagreement).
      *   Is coherent but derivative/superficial (Q3 Fail) OR radically innovative (Q3 Fail but potentially groundbreaking).
      *   Has coherence issues despite competence (Q5 Fail).

  It forces clarity on *why* a piece is rejected (fundamental flaw) or accepted (meets core criteria), and isolates the specific points (mainly Delicacy and sometimes Comparison/Good Sense) where blameless, irreconcilable taste divergence occurs, requiring team discussion. It prevents "vibes" by tying judgments to specific, checkable Humean principles.
