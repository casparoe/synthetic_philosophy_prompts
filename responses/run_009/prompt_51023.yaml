answer: |-
  1.  Each slice acts rationally *given its immediate preferences*: the slice holding A prefers C+A to A alone (paying $1 to swap), the slice holding C prefers B+C to C alone (paying $1 to swap), and the slice holding B prefers A+B to B alone (paying $1 to swap) – each maximizes utility based on its *current* valuation.  
  2.  There is no enduring "she" to be exploited; there are only successive, rationally coherent slices linked by causal chains, none of whom are responsible for the preferences or actions of prior or future slices. The "loss" doesn't belong to any single rational agent.  
  3.  The exploiter relies on *predicting* future slice preferences (which are contingent and not binding on future slices); the irrationality, if any, lies in the exploiter's model or the predictability, not in the individual slice's rational choice given its local state.  
  4.  "Worse off" presupposes a stable, cross-temporal preference structure (which doesn't exist here) or a stable resource (money) valued equally by all slices. If later slices genuinely prefer A+less money to the alternatives *they faced*, they aren't worse off *by their own lights*.  
  5.  While the *pattern* feels irrational from a god's-eye view, attributing that irrationality to any *agent* requires smuggling in a persisting self that binds the slices – precisely the entity my view denies exists. The regret of a later slice is *new* data, not proof of past error. **Weakest Point:** Point 4 is the thinnest – if money is a stable numeraire valued similarly by all slices, the net loss is real *by that metric*, even if preferences shift. I'd likely abandon this defense first under sustained pressure on resource depletion.
