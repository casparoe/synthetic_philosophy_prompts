  We are drafting a joint statement for an adversarial collaboration between a defender of the Buddhist no-self view (anattā) and a secular neo-Lockean. The goal is to have them agree on some claims and clearly delineate their residual disagreements, along with the cruxes and test cases.

  ### Step 1: Numbered Agreed Claims
  We need at least the following points covered:
  1. **Failure of the Cartesian ego**: Both agree that there is no unchanging, simple, and independently existing self (like a Cartesian ego).
  2. **What psychological connectedness does and does not explain**: They agree that psychological connectedness (and continuity) explains many of our practical concerns (e.g., anticipation of future experiences, moral responsibility, etc.) but does not establish a substantial self.
  3. **What fission cases establish**: They agree that fission cases (like the teletransporter thought experiment) show that personal identity is not always determinate and that they challenge the idea of a unique, identical self over time.

  We can phrase these in a way that both can accept.

  ### Step 2: Table of Residual Disagreements
  We must phrase each position so that the side holding it would accept the wording. The disagreements are:
  - The Buddhist's concern: The Lockean might be smuggling in a "further fact" by using the word "criterion" (implying that there is a fact of the matter about personal identity beyond conventional practices).
  - The Lockean's concern: The Buddhist's metaphysical thesis (no-self) might be collapsing into the soteriological/ethical claim (that disproportionate self-concern is misplaced), which the Lockean could accept without conceding that persons do not persist.

  We also have the cruxes:
  1. Whether the no-self claim is primarily metaphysical or ethical.
  2. Whether treating persons as conventionally real but not findable under analysis is substantively different from Parfit-style reductionism or only a verbal difference.

  ### Step 3: Cruxes and Test Cases
  For each crux, we need a concrete case or argument that both accept as bearing on it, and then record each side's prediction in advance.

  Crux 1: **Nature of the no-self claim (metaphysical vs. ethical)**
     - Case: **Gradual replacement of the constituents of a person** (e.g., a person whose parts are slowly replaced by artificial components, while maintaining psychological continuity).
       - Buddhist's prediction: The gradual replacement case shows that there is no underlying self that persists; it's just a causal series of mental and physical events. Thus, the person is only conventionally real and not metaphysically real. This supports the metaphysical thesis of no-self.
       - Lockean's prediction: The gradual replacement case shows that psychological continuity is what matters for personal identity. Even if we replace parts, as long as psychological continuity is maintained, the same person persists. This case does not undermine the reality of persons as entities that persist over time, but rather shows that persistence is a matter of degree and dependent on psychological connections.

  Crux 2: **Conventional reality vs. Parfit-style reductionism (substantive or verbal)**
     - Case: **Obligations incurred before a fission event** (e.g., before a person splits into two, they make a promise; after fission, do both resulting persons have an obligation?).
       - Buddhist's prediction: After fission, there are two persons, and the obligation is shared or diffused because there is no single self that persists. This shows that the conventional reality of persons is a pragmatic tool for navigating the world, but it does not correspond to an ultimate reality. The difference from Parfit is that for Parfit, the fact of identity is reduced to psychological continuity and connectedness, but in fission, identity does not hold. However, the Buddhist view emphasizes that even in non-fission cases, there is no self to be found, so the conventional designation is always merely conventional and not tracking any further fact. Thus, the difference is substantive because for the Buddhist, even in normal cases, the self is not real, whereas Parfit might still hold that in non-fission cases, identity holds as a further fact (though Parfit is a reductionist and denies further facts, so we must be careful). Alternatively, if the Lockean (neo-Lockean) holds that identity is a further fact, then the Buddhist would say that the conventional designation is not tracking any such fact. But if the Lockean is a reductionist (like Parfit), then the Buddhist might see it as a verbal difference? We need to clarify.

     However, note: The Lockean in this context is a neo-Lockean who might hold that psychological continuity is the criterion of personal identity, which is a factual matter (though not a further fact beyond the psychological and physical relations). The Buddhist, however, holds that even the conventional person is not ultimately real and that the designation is only for practical purposes.

     Actually, the crux is whether the Buddhist view is substantively different from Parfit. The Buddhist might argue that Parfit's reductionism still leaves room for a conventional self that is real in a reduced sense, but the Buddhist anattā denies any reality to the self at all, even conventional reality? Not exactly: in Buddhism, the self is conventionally real but ultimately unreal. It is a dependent designation. So, the difference might be that for Parfit, the existence of persons is reducible to physical and mental events, and there is no further fact, but persons are real in a reduced sense. For the Buddhist, the conventional person is a useful fiction and not real in any ultimate sense. This might be a difference in emphasis, but both deny a further fact. So, the Buddhist might see it as a substantive difference because the Buddhist view has a soteriological purpose: to weaken self-grasping, whereas Parfit's is purely metaphysical.

     Alternatively, the Lockean might see the two as the same and the difference as merely verbal.

     So, for the case:
       - Buddhist: After fission, the obligation is not carried by a single self, so we must decide on pragmatic grounds how to assign it. This shows that the self was always a convention, and there is no fact about whether the original promisor survives as one or both. The Lockean reductionism, by making identity depend on continuity, might still hold that in non-fission cases there is a fact (because continuity is non-branching), but the Buddhist denies that there is any fact at all about identity even in non-fission cases; it's always conventional. Thus, the difference is substantive because the Lockean (like Parfit) might hold that in non-fission cases, identity is a fact (albeit reduced), but the Buddhist holds it is never a fact.
       - Lockean: After fission, the obligation is inherited by both resulting persons because they are both psychologically continuous with the original. This does not show that there was no fact about the original person's identity, but rather that fission creates two persons who are both continuers of the original. The Lockean might hold that in non-fission cases, there is a fact about identity (based on non-branching continuity). The Lockean sees the Buddhist's conventionalism as equivalent to reductionism, and the difference is only verbal because both deny a further fact and both hold that persons are nothing over and above the physical and mental processes.

