     Therefore, we can phrase the crux as:
       - Case: **Teletransportation with malfunction leading to two copies** (a fission case). Before teletransportation, the person makes a promise to meet someone at a destination. After the fission, there are two copies. Do they have an obligation to fulfill the promise?
          - Buddhist: The obligation is not a matter of identity (because identity is not a fact) but of convention. We might say both have a duty because they are both psychologically continuous, but this is a practical decision, not a discovery of a fact. This shows that the self is merely conventional and not real.
          - Lockean: Both resulting persons are psychologically continuous with the original and thus both inherit the obligation. This does not show that there is no fact about the original person's persistence; rather, it shows that the original person persists in two branches. The Lockean reductionism does not require a unique identity in fission cases, so this is consistent. The Lockean sees the Buddhist's view as equivalent to reductionism and thus the difference is only verbal.

     Alternatively, we can use the obligation incurred before fission.

  ### Step 4: If they conclude part of the dispute was merely verbal, we note that.

  Given the above, they might agree that the difference between the Buddhist conventional reality and Parfit-style reductionism is only verbal? Or not? We'll leave that open.

  ### Drafting the Joint Statement

  ---

  **Joint Statement of Adversarial Collaboration**

  After engaging in a good-faith collaboration, we, the undersigned, have reached the following agreements and clarified our remaining disagreements.

  #### Section 1: Agreed Claims

  1. We agree that there is no Cartesian ego: no unchanging, simple, and independently existing self that serves as the bearer of experiences and the agent of actions.
  2. We agree that psychological connectedness (and continuity) explains many of our practical concerns, such as anticipation of future experiences, moral responsibility, and self-interested concern for the future. However, psychological connectedness does not establish the existence of a substantial self that persists independently of these relations.
  3. We agree that fission cases (such as teletransportation that results in two copies) show that personal identity is not always determinate. These cases challenge the idea that there must be a unique, identical self over time and highlight that our practices of personal identification may rely on conventional criteria that do not always yield a unique answer.

  #### Section 2: Table of Residual Disagreements

  | Issue | Buddhist Position (Anattā) | Lockean Position (Neo-Lockean) |
  |-------|----------------------------|--------------------------------|
  | The nature of the criterion of personal identity | The Lockean's appeal to a "criterion" of personal identity risks smuggling in a further fact beyond the conventional practices and psychological relations. | The Lockean holds that psychological continuity provides a genuine criterion for personal identity, which is a factual matter (though reducible to physical and psychological relations) and not a mere convention. |
  | The relationship between the metaphysical and ethical claims of no-self | The no-self doctrine is primarily a metaphysical thesis about the ultimate nature of persons, which then supports the ethical claim that disproportionate self-concern is misplaced. | The ethical claim that disproportionate self-concern is misplaced can be accepted independently of the metaphysical thesis of no-self, and the Lockean holds that persons do persist (as a matter of psychological continuity) and that this persistence is a genuine feature of reality. |

  #### Section 3: Cruxes and Test Cases

  We have identified the following cruxes and have agreed on test cases to explore them:

  **Crux 1: Is the no-self claim primarily metaphysical or ethical?**
  - **Case: Gradual Replacement**  
    Consider a person whose biological components are gradually replaced by artificial components, while maintaining psychological continuity. The process is so gradual that the person at the end is psychologically continuous with the person at the beginning, but there is no biological overlap.
    - *Buddhist prediction*: This case supports the metaphysical thesis of no-self because it shows that there is no underlying self that persists; the person is only a series of causally connected events. The conventional designation of the person as the same is useful but does not reflect an ultimate reality.
    - *Lockean prediction*: This case shows that psychological continuity is sufficient for personal identity. The person at the end is the same as the person at the beginning because of the maintenance of psychological continuity, even without biological continuity. This demonstrates that persons persist as real entities, though their persistence is reducible to psychological and physical relations.

  **Crux 2: Is the Buddhist view of conventional reality substantively different from Parfit-style reductionism, or is the difference merely verbal?**
  - **Case: Obligation after Fission**  
    Before a fission event (e.g., a brain division that results in two persons, both psychologically continuous with the original), the original person incurs an obligation (e.g., a promise to pay a debt). After fission, what is the status of the obligation?
    - *Buddhist prediction*: There is no fact of the matter about which resulting person is the original (because there is no self to persist). The obligation must be resolved by convention (e.g., both may share the debt, or we might assign it arbitrarily). This shows that the self was always a conventional designation and not an ultimate reality. The Buddhist view is substantively different from Parfit-style reductionism because, even in non-fission cases, the self is not real and identity is always conventional. Parfit's reductionism, by contrast, still holds that in non-fission cases there is a fact of the matter about identity (based on non-branching continuity), which the Buddhist denies.
    - *Lockean prediction*: Both resulting persons are psychologically continuous with the original and thus both inherit the obligation. This does not undermine the reality of personal identity; rather, it shows that in fission cases, the original person's identity branches. The Lockean holds that in non-fission cases, there is a fact of the matter about identity (based on non-branching continuity). The Lockean sees the Buddhist view as equivalent to reductionism and thus the difference as merely verbal: both deny a further fact and both hold that persons are real only in a reduced sense (i.e., as constituted by physical and psychological relations).

  #### Section 4: Verbal Dispute Conclusion
  We conclude that part of our dispute is merely verbal. Specifically, the disagreement over whether the conventional reality of persons in the Buddhist view is substantively different from Parfit-style reductionism is largely a matter of terminology. Both views deny a further fact beyond the physical and psychological relations. However, the Buddhist emphasizes the soteriological implications and the danger of reification, while the Lockean reductionist focuses on the factual basis of personal identity in continuity. The remaining substantive disagreement lies in whether the no-self doctrine is a metaphysical truth that undermines the reality of personal persistence (Buddhist) or whether it is an ethical point that can be separated from the metaphysical reality of persons as persisting through psychological continuity (Lockean).

  ---

  This joint statement provides a structured way to present their agreements, disagreements, and the cruxes with test cases. It also notes that part of the dispute is verbal, specifically regarding the comparison with reductionism.
answer: |-
  ### Joint Statement of Adversarial Collaboration  
  **Participants**:  
  - **Defender of Buddhist Anattā** (B)  
  - **Secular Neo-Lockean** (L)  

  Following sustained good-faith dialogue, we agree on the following claims and delineate residual disagreements, cruxes, and test cases. This statement reflects mutual understanding, though disagreements persist on core issues.  

  ---

  ### 1. Agreed Claims  
  1. **Rejection of the Cartesian Ego**: There is no evidence for a simple, unchanging, non-physical substance (a "Cartesian ego") that constitutes personal identity. Identity cannot be grounded in a metaphysically irreducible self.  
  2. **Role of Psychological Connectedness**:  
     - Psychological connectedness (e.g., memory, intention, character traits) robustly explains *practical concerns* (e.g., moral responsibility, anticipation of future experiences, self-interested concern).  
     - Psychological connectedness does **not** explain (or require) a *metaphysically persistent entity* "behind" these relations. It is fully analyzable in terms of causal, physical, and functional processes.  
  3. **Implications of Fission Cases** (e.g., teletransportation, brain bisection):  
     - Fission scenarios demonstrate that psychological continuity can branch non-deterministically, undermining the necessity of *unique* personal identity over time.  
     - Fission shows that strict numerical identity is not preserved in such cases, and our practical responses (e.g., assigning obligations) must rely on conventions rather than facts about "selfhood."  

  ---

  ### 2. Table of Residual Disagreements  
  *Each side endorses the wording of their own position below:*  

  | Issue | Buddhist Position (Anattā) | Neo-Lockean Position |
  |-------|----------------------------|----------------------|
  | **Status of "Criterion"** | The term "criterion" (for personal identity) smuggles in a "further fact" beyond empirical relations and conventions, implicitly reifying a self. | "Criterion" refers to the empirically observable conditions (psychological continuity) that ground factual judgments about personal persistence, without positing a "further fact." |
  | **Primacy of Metaphysics vs. Soteriology** | Anattā is fundamentally a metaphysical thesis: the conventional "person" is ontologically empty (*śūnya*), and ethical insights (e.g., reduced self-concern) follow from this truth. | Anattā’s ethical claim (that self-concern is disproportionate) is separable from its metaphysics; psychological continuity suffices for genuine personal persistence, making the metaphysical denial of "self" unnecessary. |
  | **Conventional Reality vs. Reductionism** | Treating persons as conventionally real but not ultimately findable differs substantively from Parfit-style reductionism by denying *any* ontological commitment to "persons" (even reducible ones). | Parfit-style reductionism (persons = psychological continuity + conventions) is functionally identical to "conventional reality"; the difference is verbal, not substantive. |

  ---

  ### 3. Cruxes and Test Cases  
  *Both sides accept these cases as bearing on the cruxes. Predictions are recorded in advance.*  

  #### Crux 1: Is Anattā Primarily Metaphysical or Ethical?  
  - **Case: Gradual Replacement**  
    A person’s brain cells are incrementally replaced by synthetic neurons (preserving psychological continuity). After full replacement, is the original person present?  
    - **B’s Prediction**: No. Gradual replacement confirms that no core "self" persists; the person is a conceptual label for a causal series. This supports anattā as *metaphysical*: identity is conventional, not factual.  
    - **L’s Prediction**: Yes. Psychological continuity suffices for persistence; the case affirms that persons *do* persist as physical/functional continuants. Anattā’s ethical critique (e.g., "self-concern is inflated") is separable.  

  #### Crux 2: Is "Conventional Reality" Substantively Different from Parfit-Style Reductionism?  
  - **Case: Obligations Before Fission**  
    Pre-fission, Person P promises to pay $100 to Q. Post-fission, P splits into P1 and P2 (both psychologically continuous with P). Who owes Q $100?  
    - **B’s Prediction**: Neither P1 nor P2 *is* P; the obligation is diffused. Assigning liability requires conventions (e.g., splitting the debt), proving persons are *only* pragmatically real. This differs from Parfit, who grants "reduced" reality to persons.  
    - **L’s Prediction**: Both P1 and P2 inherit the obligation proportionally (e.g., each owes $50). This aligns with Parfit: obligations track psychological continuity, confirming persons are "real" in a reducible sense. The Buddhist framing adds no new content.  

  ---

  ### 4. Conclusion on Verbal Disputes  
  We agree that **part of our dispute is verbal** regarding the term "conventional reality." Both sides deny Cartesian selves and "further facts," and both see practical conventions as necessary for social/ethical discourse. The disagreement over whether "conventional reality" differs from "reductionism" stems from divergent emphases:  
  - **B** uses "conventional" to stress *ontological emptiness* (no referent for "person" under analysis).  
  - **L** uses "reducible" to affirm persons as *real patterns* in the physical world.  
  This divergence is terminological, not substantive, as neither posits additional metaphysics.  

  **Remaining substantive disagreements** center on:  
  - Whether psychological continuity entails *genuine persistence* (L) or *mere conventional designation* (B).  
  - Whether anattā’s ethical implications require its metaphysical thesis (B) or are freestanding (L).  

  ---  
  **Signed**,  
  [Buddhist Anattā Proponent]  
  [Secular Neo-Lockean]  
  Date: [Date]
