  We have two main cruxes:

  Crux A: Whether 'belief' names a natural kind (Realist) or a disjunctive kind (EM) (like jade, which is two distinct minerals: jadeite and nephrite).

  Crux B: Whether vindication at the computational level (Marr level 1) suffices for realism about beliefs even if the implementational-level story (level 3) never mentions them.

  Additionally, we might have:

  Crux C: Whether the explanatory indispensability of belief-desire psychology in everyday life and in cognitive science (at least at the computational level) is evidence that beliefs are real.

  But note, the Realist might argue that even if the implementation does not use the term 'belief', if the computational level is correctly described in belief-desire terms, then beliefs are real. The EM would counter that if the implementation does not have states that are reasonably seen as having the properties of beliefs (e.g., semantic content, causal roles as per FP), then beliefs are not real.

  We also have the possibility of a merely verbal disagreement: The EM might be using 'belief' to refer strictly to the folk-psychological category, while the Realist might be using it to refer to whatever state plays the functional role of belief in the cognitive system. We should note that if the Realist is willing to revise the concept of belief (to whatever plays the role), then the disagreement might be about whether the folk category is preserved or not. But the EM is eliminativist about the folk category.

  Let's phrase the disagreements:

  D1: On the ontological status of beliefs after scientific reduction:
     - EM: Beliefs, as posited by folk psychology, do not exist because they fail to correspond to any natural kind in the brain. The category is either empty or so disunified that it does not carve nature at its joints.
     - Realist: Beliefs exist because they are the states that play the causal roles specified by folk psychology (or a refined version of it) and are vindicated by cognitive science, even if they are implemented by diverse physical mechanisms.

  D2: On the sufficiency of computational-level vindication:
     - EM: Even if a computational-level description is successfully given in belief-desire terms, if the implementational level does not have states that have the properties of beliefs (such as being discrete, semantically evaluable states with causal roles matching FP), then beliefs are not real. Computational-level descriptions are abstract and do not commit us to the reality of the posits at the implementational level.
     - Realist: If the computational-level description in belief-desire terms is correct and indispensable for explaining behavior and cognition, then beliefs are real, regardless of whether the implementational level uses the same vocabulary. The computational level describes real patterns in the world.

  D3: On the natural kind status of belief (relates to Crux A):
     - EM: The category of belief does not name a natural kind because cognitive science will reveal that the functional role we attribute to belief is actually played by a disjunction of different neural states and processes that do not form a unified kind. (Like jade.)
     - Realist: The category of belief does name a natural kind because it captures a unified set of properties and causal roles that are realized in a law-like way across different systems. (Like water.)

  For Crux A and Crux B, we provide:

  Crux A: Natural kind vs. disjunctive kind.

  Evidence/Arguments:
     - Both accept that the question is empirical and will be settled by the progress of cognitive neuroscience and cognitive science.
     - Both accept that if future models (e.g., connectionist networks, predictive processing models) show that the behaviors and functions attributed to beliefs are achieved without discrete, semantically structured states that are causally efficacious in the way FP posits, then that would support the disjunctive kind view. Conversely, if they reveal a unified neural state type that has the properties of beliefs, that would support the natural kind view.

