  First, let's outline the agreed claims:

  Agreed Claims:
  1. Both parties are committed to naturalism: the mind is entirely a product of the brain and its interactions with the world, and any adequate account must be consistent with the natural sciences.
  2. Folk psychology (FP) is a theory: it is a set of generalizations and explanatory practices that we use to predict and explain behavior by attributing beliefs, desires, and other propositional attitudes.
  3. FP has been remarkably successful in everyday contexts, but it is an empirical question whether the categories of FP (like belief and desire) will be vindicated by a mature cognitive neuroscience.
  4. The self-refutation objection to eliminativism: the eliminativist claims that there are no beliefs, but this claim itself seems to be a belief. We agree that the eliminativist must either (a) deny that their own assertion is a belief (by offering an alternative account of what it is) or (b) accept that eliminativism is self-refuting and thus false. However, the eliminativist holds that a future neuroscience will provide an alternative account of assertion and reasoning that does not involve beliefs. The realist counters that if eliminativism is true, then there are no true assertions (since assertions express beliefs), which undermines eliminativism. We agree that the eliminativist's position is not immediately self-refuting if they can provide a non-belief-based account of their own activity, but the burden of proof is on the eliminativist to provide such an account. Until then, the realist holds that eliminativism is self-undermining.
  5. The phlogiston analogy: FP categories might turn out to be like phlogiston, a theoretical posit that was useful but was eliminated because it did not correspond to any real thing in nature. However, they might also turn out to be like atoms, which were initially a theoretical posit and were later vindicated by science. The fate of FP categories is an open empirical question.
  6. The computational level of analysis (Marr's level 1) describes what the system does and why (in terms of the problem it solves). The algorithmic level (level 2) describes how it does it (the representations and processes). The implementational level (level 3) describes the physical realization. Both agree that a successful computational-level description that maps onto belief-desire psychology would be a significant achievement, but they disagree on whether that alone would vindicate beliefs as real.

