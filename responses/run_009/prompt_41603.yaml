     - EM: Expects that connectionist or predictive processing models will show that behavior is produced by distributed, sub-symbolic processes that do not involve discrete, structured representations with propositional content. Thus, the folk category of belief will be fragmented into multiple distinct processes.
     - Realist: Expects that even in connectionist or predictive processing models, there will be identifiable states that function as beliefs (i.e., they carry information about the world, are causally involved in reasoning and behavior, and can be evaluated as true or false). Alternatively, even if the implementation is distributed, the computational level will require belief attributions.

  Crux B: Sufficiency of computational-level vindication.

