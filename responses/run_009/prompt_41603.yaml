     - Both accept that the development of cognitive science will show whether belief-desire explanations are indispensable at the computational level and whether they can be mapped onto the implementation without residue.
     - Both accept that if the computational-level description is the best explanation of behavior and cognition and cannot be replaced by a non-intentional description, that is a point in favor of the realist. However, the EM will require that the implementation must also be consistent with the existence of states that have the properties of beliefs.

