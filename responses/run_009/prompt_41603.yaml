     - Realist: Predicts that the computational-level description in terms of beliefs and desires will be indispensable for explaining cognition and behavior, and that the implementation will be seen as realizing these computational states. Thus, beliefs are real even if the implementation does not use the same labels.

  Merely Verbal Disagreement:
  We note that part of the disagreement might be verbal if the Realist is willing to revise the concept of belief to whatever plays the functional role, while the EM insists on the folk-psychological concept. However, the EM argues that the folk concept has specific features (like being discrete, structured, and causally efficacious by virtue of content) that may not be present. The Realist might be more liberal. But if the Realist sticks to the folk concept, then the disagreement is substantive. We can say:

  - If the Realist allows that beliefs might be realized in ways that do not exactly match the folk conception (but still play the functional role), then the disagreement about the fate of the folk concept remains. The EM is eliminativist about the folk concept, while the Realist might be a revisionist. However, the Churchland-style eliminativist is against the entire framework of propositional attitudes, so they would not accept a revised concept that still uses the same framework.

  Thus, we will note in the agreed claims that the Realist might be either a conservative (folk concept is largely correct) or a revisionist (the concept will be refined but the core remains). The EM is against the entire framework.

