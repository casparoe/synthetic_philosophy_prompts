  2. Precise residual disagreements, each worded so that the respective side would accept the wording.
  3. Cruxes: two are suggested: (a) whether belief is a natural kind or a disjunctive kind; (b) whether computational-level vindication suffices for realism even without implementational mention.
  4. For each crux, evidence/argument both accept as bearing on it, and each side's prediction (e.g., from connectionist or predictive-processing models).
  5. Identify any part of the dispute that is merely verbal.

  We structure the output as:
  - A numbered list of agreed claims.
  - A table for disagreements, with columns: 
     - Disagreement ID (e.g., D1, D2)
