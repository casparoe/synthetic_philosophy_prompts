answer: |-
  ### Joint Statement: Eliminative Materialist (EM) and Propositional Attitude Realist (Realist)

  Following an adversarial collaboration, we, an eliminative materialist (in the tradition of the Churchlands) and a realist about propositional attitudes, agree on the following claims while acknowledging unresolved disagreements. Both parties endorse naturalism and the authority of cognitive science to resolve the dispute empirically. Below are agreed claims (§1) and a table of disagreements (§2) with associated cruxes, evidence, and predictions.

  ---

  #### §1: Agreed Claims  
  1. **Naturalism**: The mind arises solely from the brain and its interactions with the world. A complete account of cognition must be consistent with neuroscience and physics.  
  2. **Folk Psychology as a Provisional Theory**: Beliefs and desires, as posited by folk psychology (FP), form a pre-scientific theory for predicting behavior. FP is pragmatically successful but may be radically revised or replaced by mature cognitive science.  
  3. **Self-Refutation Objection**: The eliminativist claim "there are no beliefs" appears self-refuting if it necessitates the existence of a belief. The EM must provide a non-FP-based account of assertions (e.g., via neural mechanisms) to avoid this. Until such an account is empirically validated, the objection remains a challenge but not a decisive refutation.  
  4. **Phlogiston Analogy**: FP categories could suffer the fate of phlogiston (eliminated as non-existent) or atoms (vindicated as real). This hinges on whether "belief" designates a natural kind or a disjunctive/folk construct.  
  5. **Computational-Level Independence**: A Marr-style computational-level description (e.g., "system infers truths to guide action") could be validated independently of implementational details. Such validation would support FP's utility but not necessarily its ontological reality.  
  6. **Burden of Proof**: Eliminativism requires demonstrating FP's irredeemable falsehood through cognitive science. Realism requires showing FP categories are ineliminable or map onto natural kinds.  
  7. **Verbal Disagreement Potential**: Disputes may be verbal if "belief" denotes either (a) the FP category (EM focus) or (b) whatever state plays the belief-role (realist focus). This does not resolve substantive disagreements about FP's scientific fate.  

  ---

  #### §2: Residual Disagreements  
  Disagreements are structured with cruxes, shared criteria for evidence, and opposing predictions.  

  | ID | Statement (Accepted by Own Side)                                                                 | Crux | Evidence/Arguments Bearing on Crux (Shared)                                                                                                                                                          | EM Prediction                                                                                                | Realist Prediction                                                                                                |
  |----|------------------------------------------------------------------------------------------------|------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | D1 | **Ontological status of beliefs**: Beliefs do not exist; FP categories are false posits that fail to map onto unified neural mechanisms. (EM)                  | A    | Whether cognitive science reveals "belief" as a disunified (jade-like) category or a natural kind. Evidence: Neural data showing FP functions (e.g., inference) subserved by heterogeneous mechanisms. | Connectionist/predictive processing models will show FP functions fragmented into non-symbolic, distributed processes (e.g., pattern completions). | Models will show FP functions map onto discrete, structured states (e.g., probabilistic inferences) across systems. |
  |    | **Ontological status of beliefs**: Beliefs exist; they are real states that play causal roles, even if implemented diversely. (Realist)                      |      |                                                                                                                                                                                                      |                                                                                                              |                                                                                                                   |
  | D2 | **Computational vindication**: Computational-level success is insufficient for realism; FP must appear at the implementational level to exist. (EM)           | B    | Whether computational-level indispensability suffices for realism absent implementational mentions. Evidence: Computational models (e.g., Bayesian) that explain behavior without positing belief-like states. | Predictive processing models will reduce beliefs to sub-symbolic quantities (e.g., precision-weighted errors), negating FP ontology. | Models will show computational states are robustly belief-like (e.g., content-bearing, truth-apt), regardless of implementation. |
  |    | **Computational vindication**: Computational-level success suffices for realism; beliefs exist if FP is indispensable at this level. (Realist)               |      |                                                                                                                                                                                                      |                                                                                                              |                                                                                                                   |
  | D3 | **Explanatory indispensability**: FP is heuristically useful but dispensable; neuroscience will explain behavior without belief/desire constructs. (EM)       | A,B  | Whether FP generalizations (e.g., "agents act to satisfy desires") reduce to or are replaced by neurocognitive mechanisms. Evidence: Cross-species/cultural invariance (or lack thereof) in FP attributions. | Neuroscience will reveal FP as a crude approximation, like humoral theory, replaced by mechanistic accounts. | FP will prove irreducible, with generalizations preserved in computational/algorithmic models (e.g., theory of mind). |
  |    | **Explanatory indispensability**: FP is indispensable; its generalizations capture real patterns unattainable via non-intentional descriptions. (Realist)    |      |                                                                                                                                                                                                      |                                                                                                              |                                                                                                                   |

  ---

  #### Cruxes and Empirical Resolvability  
  - **Crux A (Natural Kind Status)**: Turns on whether "belief" is jade-like (disjunctive) or water-like (natural). Both accept neural/behavioral evidence (e.g., fMRI, lesion studies) showing uniformity/variation in FP-functional systems as decisive.  
  - **Crux B (Computational Suffi ciency)**: Hinges on whether Marr’s computational level can ontologically vindicate FP independently. Both accept model-based evidence (e.g., comparing symbolic vs. connectionist architectures) as probative.  

  #### Predictions on Cognitive Models  
  - **Connectionism/Predictive Processing**:  
    - EM predicts: Models will fragment belief into microfunctional processes (e.g., prediction-error minimization), eliminating propositional content.  
    - Realist predicts: Models will retain belief-like states (e.g., hierarchical hypotheses) with semantic properties, vindicating FP at computational levels.  

  #### Merely Verbal Element  
  The dispute is **partly verbal** regarding the referent of "belief": EM uses it strictly for FP posits (requiring linguistic structure, causation-by-content), while realists use it for role-fillers (allowing revision). This does not negate substantive disagreements over FP’s scientific legitimacy (D1–D3).  

  ---  
  This statement reflects our commitment to resolving the debate through cognitive science. We await empirical developments to adjudicate these cruxes.
