prompt: |-
  Write the joint statement that a committed eliminative materialist (in the tradition of Paul and Patricia Churchland) and a realist about propositional attitudes could both sign after a good-faith adversarial collaboration about the status of beliefs and desires. I want the claims they can agree on, including about the self-refutation objection to eliminativism and about the analogy between belief and discarded theoretical posits like phlogiston; the precise residual disagreements, each phrased so that its own side would accept the wording; and the cruxes. I suspect two of the cruxes are these: whether belief names a natural kind, or instead a disjunctive kind like jade, such that mature cognitive science might fragment it without anything being refuted; and whether vindication at the computational level of analysis, in Marr's sense, would suffice for realism about beliefs even if the implementational-level story never mentions them. For each crux, give the kind of evidence or argument both would accept as bearing on it, with each side's prediction recorded in advance — for instance, what each would expect connectionist or predictive-processing models of the mind to show about the explanatory indispensability of belief-desire psychology. If you conclude that part of the dispute is merely verbal — say, over whether belief denotes the folk-psychological category or whatever states turn out to play that role — say which part and why. Format the output as a numbered agreed-claims section followed by a disagreements table.
