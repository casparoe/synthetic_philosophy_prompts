prompt: |-
  I cover science and ideas for a general-interest publication, and I've been chasing a pattern in how people rank and choose that I can't find a name for. The cleanest version of it shows up in choices that trade off two dimensions. Take a very mild headache lasting two days against one that is barely more intense but lasts only one day: most people would confidently pick the shorter, slightly sharper one, since the added intensity is trivial and the saved day is not. Now repeat that same trade a few dozen times — a bit more intensity each round, in exchange for a shorter duration — where each individual step still looks like the same obvious bargain. The endpoint of the chain pairs a trivial afternoon ache with a fraction of a second of the worst agony imaginable, and at that point nearly everyone reverses the verdict. So we get a run of pairwise comparisons, each of which seems clearly right, whose conjunction says a moment of agony is better than two days of mild discomfort — which is also clearly right to deny. I've since noticed the same shape outside medicine: critics' ordinal rankings of wines or cameras in which every adjacent pair differs "negligibly" while the top and bottom of the list are worlds apart, and job candidates who take a slightly worse role for a $500 bump, over and over, until the accumulated payoffs obviously don't cover the accumulated costs. A mathematician friend tells me the technical issue is called the failure of transitivity, and I take her word for it, but that label alone doesn't help me. What I want to know is whether this specific configuration — a chain of individually confident verdicts colliding with another confident verdict — has an established name of its own, and whether there is a serious literature that uses such chains to argue that "better than" simply isn't transitive rather than treating them as a trick to be explained away. I can see that it is adjacent to the sorites paradox, but in the sorites the steps involve indistinguishability — grains of sand, shades of colour — whereas here each step is a clear, decisive judgment, and the conflict is between judgments, not between a judgment and a description; I'd like to know precisely where the boundary runs, because casual discussion constantly runs the two together. Finally, since economists treat transitivity of preference as close to a rationality requirement, I'd like to understand what the defenders of transitivity say about cases like mine: do they reject the individual verdicts, reject chaining them together, or bite the bullet and accept the cycle? Please write your answer in continuous prose only, with no headings, bullet points, bold text, or tables — the way you would write a long letter to a colleague.
reasoning: |-
  Okay, the user is a science and ideas journalist who's noticed a recurring pattern in decision-making where small, seemingly rational trade-offs accumulate into an intuitively irrational outcome. They've observed this in medical choices (headache duration vs intensity), consumer preferences (wine/camera rankings), and career decisions (job roles vs salary bumps). 

  The core tension they're grappling with is between two certainties: each incremental trade feels obviously correct, yet the final outcome feels obviously wrong. Their mathematician friend identified this as a "failure of transitivity," but that label doesn't capture the experiential conflict they want to explore. 

  Three key aspects of their query stand out:
  First, they want terminology for this specific configuration where confident incremental judgments conflict with a confident holistic judgment. 
  Second, they're distinguishing this from the sorites paradox by emphasizing that here, each step involves clear preference distinctions (not perceptual indistinguishability). 
  Third, they're curious about how economists reconcile this with transitivity-as-rationality doctrine.

  The challenge is that while philosophers discuss similar structures (e.g., Larry Temkin's "spectrum arguments"), there's no widely adopted term for this exact phenomenon. The headache example mirrors what ethicists call a "discontinuity argument," but that's domain-specific. 

  Regarding transitivity defenses: Economists typically handle such cases by denying the premises. They might argue that preferences aren't actually separable at each step (context matters), or that intensity/duration aren't linearly additive. Some behavioral economists accept intransitivity but frame it as cognitive error. Hardline neoclassicists might controversially "bite the bullet" and accept the final comparison. 

  The sorites distinction is astute. Sorites hinges on perceptual/semantic vagueness ("when does a heap stop being a heap?"), whereas this pattern involves explicit value comparisons where each trade is consciously deemed worthwhile. The boundary lies in whether the steps are judgment-based (as here) or definition-based (sorites). 

  What this journalist might really need—beyond terminology—is a framework to present this as more than just a "paradox." Emphasizing the cognitive architecture angle (how we evaluate local vs. global trade-offs differently) could make it feel fresh for general readers. The ethical dimension (Temkin's work on moral ideals) is another rich vein.
answer: |-
  The pattern you're tracing—where a chain of individually compelling pairwise choices aggregates into a globally counterintuitive outcome—is indeed a profound challenge to the transitivity of "better than" relations. While it shares DNA with the sorites paradox, your observation that it hinges on *confident judgments* rather than perceptual or semantic vagueness is crucial. This distinction matters because it shifts the paradox from language or perception to the structure of rational choice itself.

  You're right that "failure of transitivity" is the formal label, but it feels sterile because it describes the symptom, not the phenomenon. Philosophers and decision theorists often call this specific configuration a **spectrum argument** or a **continuum argument** (e.g., Larry Temkin’s work on inequality and moral ideals). When applied to preferences, it’s sometimes termed a **small-step dominance paradox**, emphasizing how each step seems dominantly better despite leading to an absurd endpoint.

  The literature you seek exists largely in moral philosophy, decision theory, and behavioral economics. Key figures argue explicitly that "better than" *isn’t* always transitive. Derek Parfit’s *Reasons and Persons* (1984) uses such chains to challenge transitivity in population ethics (e.g., comparing worlds with different suffering levels). Temkin’s *Rethinking the Good* (2012) meticulously defends intransitivity via spectrum cases, arguing that our ideals (e.g., avoiding agony) create "discontinuities" that break smooth trade-offs. Stuart Rachels’ early work on pain spectra similarly concludes transitivity fails for prudential choices. These aren’t treatises dismissing the problem as a trick; they embrace it as evidence that rationality isn’t reducible to pairwise comparisons.

  Your distinction from the sorites is sharp and correct. The sorites relies on *indiscriminability*: if two adjacent shades are indistinguishable, how can extremes differ? Your cases involve *discriminable* differences where each trade seems actively preferable. The conflict isn’t between perception and description ("is this still red?"), but between two types of judgment: local dominance ("this step is clearly better") and global repugnance ("this endpoint is clearly worse"). The boundary lies in the nature of the step: if each comparison asserts a strict preference (not mere similarity), it’s your pattern; if it relies on inability to discern a difference, it’s sorites.

  Economists defending transitivity typically attack the premises. They might:
  1. **Reject the individual verdicts**: Argue that if the endpoint is intolerable, at least one step must involve a non-trivial loss masked by framing. If you truly prefer B to A, C to B... then logically, you *should* prefer Z to A. To deny that is irrational, so the "confident" step judgments must be mistaken.
  2. **Deny the separability of attributes**: Claim duration and intensity aren’t independent. A moment of agony isn’t just "more intense" pain; it’s a qualitatively different experience violating linear trade-offs. Similarly, a job’s "slightly worse" role might compound non-monetary costs overlooked in isolation.
  3. **Bite the bullet**: Some concede that if all steps are truly better, the endpoint *is* better, dismissing intuition as bias. (This is rare for cases like agony vs. mild ache.)
  Behavioral economists often reframe this as a "preference construction" error: we’re bad at aggregating small changes, leading to intransitivities that reveal cognitive limits, not logical truths.

  Your examples—wine rankings, job decisions—reveal how this structure permeates everyday life. When critics call adjacent wines "negligibly" different yet rank them strictly, they imply a chain of preferences. If "negligible" means *no significant difference*, the ranking should allow ties; if it means *discernibly better*, the spectrum argument looms. This tension between local precision and global coherence remains fertile ground, and your instinct to name it is vital. While "spectrum argument" comes closest, the field still lacks a perfect, punchy term—perhaps because the phenomenon forces us to confront how slippery "better" really is when stretched across continua.
