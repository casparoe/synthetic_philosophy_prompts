answer: |-
  Your novelist's lens reveals profound tensions in legal interpretation that many jurists overlook. Let's reconstruct the implicit semantics at play, expose the underdetermined foundations, and explore alternatives:

  ### 1. **Textualism's Metaphysical Baggage**
     - **Official Theory**: Rejects legislative intent as incoherent (per Easterbrook/Scalia), embracing "original public meaning" (OPM). Meaning resides in how a *reasonable reader* at enactment would understand words, using linguistic conventions of the time.
     - **Hidden Premises**: 
       - **Stable Linguistic Conventions**: Assumes a shared, fixed "ordinary meaning" across a diverse population at Time T (enactment). This requires a *social fact* about language that’s empirically dubious (e.g., did "vehicle" clearly include electric scooters in 1950?).
       - **Frozen Reader**: The "competent reader" is an idealized construct—a legal fiction masking a *metaphysical commitment* to meaning as objective and timeless once fixed. As you note, it kills the author only to deify a historical audience.
       - **Demanding Metaphysics**: More so than intentionalism. Where intentionalists posit discoverable mental states (flawed but tangible), textualists posit a *collective linguistic consciousness* that must be reconstructed—a far less empirical foundation.

  ### 2. **Purposivism's Constructed Intent**
     - **Official Theory**: Statutes are tools for solving problems. When text is ambiguous, seek the statute's "objectively attributable purpose" (per Hart & Sacks).
     - **Hidden Premises**:
       - **Functional Teleology**: Meaning derives from a *telos* external to the text. Purpose isn’t subjective intent but an *imputed function* ("What would rational lawmakers want this text to *do*?").
       - **Hermeneutic Flexibility**: Allows text to bend toward purpose—but only when language is ambiguous. This assumes purpose and text are separable, with purpose as the master key.
       - **Objective Fiction**: "Purpose" is a judicial construct, not historical fact. It mirrors your experience: just as readers find unintended themes, judges *attribute* purposes legislatures may never have consciously held.

  ### 3. **The Statutory vs. Contract Split: Pragmatic Doublespeak**
     - **Statutes**: Textualism dominates *officially* (no "legislative intent"), yet courts use absurdity doctrine/scrivener’s error to smuggle in intent. Why? 
       - **Institutional Realism**: Legislatures are multi-member, unrecorded, and politically messy. Judges distrust claims of "intent" as manipulable. OPM offers a fig leaf of objectivity.
     - **Contracts**: Intentionalism reigns because:
       - **Parties as Authors**: Signatories are few, identifiable, and legally bound by *their* understanding. Extrinsic evidence (emails, drafts) is reliable.
       - **Consent Principle**: Contract law enforces bargains parties actually made. Text is evidence of intent, not its coffin.
     - **Incoherence?**: The system isn’t committed to a *theory of meaning* but to *pragmatic outcomes*. Statutes bind strangers, so certainty trumps fairness; contracts bind parties, so fairness trumps textual rigidity.

  ### 4. **Where Practice is Underdetermined**
     Textualism and purposivism both rely on unstated premises that could serve rival theories:
     - **Textualism’s Unacknowledged Intentionalism**: 
       - The absurdity doctrine ("no sensible legislature wanted this") *requires* inferring intent. Scrivener’s error corrections openly rely on intended meaning.
       - **Accommodates**: Moderate intentionalism (e.g., Fish's "interpretive communities") or even living constitutionalism (if "reader" evolves).
     - **Purposivism’s Textual Tethering**:
       - Purposivists still start with text and only "bend" it when ambiguous. This could align with textualism if "purpose" is derived *solely* from statutory structure/context.
       - **Accommodates**: Dworkinian "constructive interpretation" (law as integrity) or dynamic updating (if purpose evolves).

  ### 5. **A Novelist’s Jurisprudence: What If?**
     If courts took your experience seriously:
     - **Living Language Doctrine**: Meaning evolves with linguistic practice. "Equal protection" in 1868 vs. 2024 reflects societal growth. *Obstacle*: Law craves predictability; fluid meaning risks destabilizing rights/duties.
     - **Retrospective Intention**: Treat legislative intent as *constructed* through interpretation, not discovered. Judges would openly acknowledge assigning purposes (as you do when rereading early work). *Obstacle*: Undermines the myth of judicial neutrality.
     - **Reader-Response Theory in Law**: Meaning as co-created by contemporary readers. A statute on "search and seizure" could adapt to digital privacy norms. *Obstacle*: Threatens separation of powers—judges become de facto lawmakers.

  ### Coherence Judgment
  **The practice is superficially incoherent but functionally stable.** Textualism’s "no intent" mantra collapses under absurdity/scrivener’s errors, revealing its dependence on intentionalism. Purposivism’s "objective purpose" is just as constructed as novelistic themes. The statute/contract split is pragmatic, not philosophical. What holds it together is **institutional need**: statutes require democratic legitimacy (hence textual fetishism), contracts require consensual fairness (hence intentionalism). 

  **Your insight exposes legal interpretation’s open secret**: Meaning is never found, only made. Judges are authors too—rewriting texts within constrained genres. The "theories" are costumes worn to perform legitimacy. A jurisprudence embracing drift and constructed intent would be more honest but less certain—a tradeoff law may fear to make. Yet as your novels prove, meaning survives—even thrives—when released from the tyranny of the frozen reader.
