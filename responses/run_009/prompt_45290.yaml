prompt: |-
  Quick background: I do distributed systems for a living (consensus protocols, that kind of thing) and last night my flatmate, who's doing a philosophy phd, spent like three hours trying to convince me that David Lewis's whole theory of convention from the 60s is "just protocols, you already build these" -- conventions as solutions to coordination problems that are arbitrary but self-perpetuating, held up by everyone expecting everyone else to conform. I eventually got what he was saying but I want this done properly and he's asleep. Restate Lewis's account in my vocabulary as faithfully as you can: coordination problems as the thing a handshake solves, convention as a protocol where the state machines agree, arbitrariness as version negotiation (we could've all just as well picked the other protocol), common knowledge as ack round-trips, precedent as whatever the first implementation did that everyone cloned. Then the part I actually care about: give me the residue report. What translates clean, what has to be bent out of shape to fit, and what has no counterpart at all -- e.g. Lewis's condition that everyone *prefers* general conformity given the others conform sits weird when a protocol has no preferences, it just crashes on deviation, and I'm not sure if that's a difference that matters or me being pedantic. Also worth thinking about: I vaguely remember a result that exact common knowledge is unattainable in async distributed systems -- does what my acks give me fall short of what Lewis needs, or was his bar lower than what I think of as common knowledge? My instinct all along was that a protocol is related to a convention the way a blueprint is related to a house and he kept saying I was conflating the norm with the artifact, so tell me straight whether anything in the philosophers' debate is genuinely missing from my vocabulary or whether the residue mostly shows the original claim was fuzzier than it looked. I know TCP, quorums, and the fallacies of relying on synchronized clocks pretty well; don't dumb down the systems side for me.
reasoning: |-
  Okay, let me tackle this query step by step. The user is a distributed systems expert who wants David Lewis's theory of convention translated into their technical vocabulary, followed by a "residue report" highlighting what maps cleanly, what requires bending, and what doesn't translate at all. 

  First, I need to recall Lewis's core framework: conventions as solutions to coordination problems (like which side of the road to drive on), sustained by mutual expectations and preferences for conformity. The user already gave solid analogies - coordination problems as handshake problems, conventions as agreed protocols, arbitrariness as version negotiation, common knowledge as ack round-trips, precedent as initial implementation cloning. 

  Now for the residue analysis. The mapping works beautifully for the structural aspects: coordination problems, arbitrariness, precedent, and the self-perpetuating nature of conventions all have direct technical counterparts. But three areas need careful handling:

  1. **Preferences vs Failure States**: Lewis's requirement that people *prefer* conformity (e.g., "I'd rather drive on the left if others do") clashes with protocols that simply crash on deviation. This isn't pedantry - it highlights that human conventions have elasticity (deviations can be tolerated temporarily) while protocols fail catastrophically. The "preference" condition is fundamentally about teleology, which machines lack. 

  2. **Common Knowledge**: Lewis's bar is lower than the distributed systems definition. His "common knowledge" is really *practical* common belief (people act as if it's common knowledge) achievable through weaker signaling like public announcements. ACK round-trips map to this pragmatic version, but the philosophical concept presumes logical omniscience - unattainable in async systems. 

  3. **Norm vs Artifact**: The user's instinct was right: protocols are blueprints (specs), conventions are lived practices (runtime behavior). Philosophers care about the *norm* - why people feel obligated to comply - while engineers focus on the *mechanism*. This normative layer (e.g., blaming someone for breaking convention) has no protocol equivalent. 

  The user's flatmate oversimplified by claiming conventions "are just protocols." While Lewis's framework anticipated game-theoretic views of protocols, the residue shows conventions are richer: they involve human reasoning, social enforcement, and tolerate ambiguity in ways protocols can't. The philosopher might counter that protocols *implement* conventions, but the mapping isn't lossless. 

  Final note: The user's systems expertise means we can avoid dumbing down - terms like FLP, partial synchrony, and Byzantine failures are fair game when contrasting philosophical ideals with engineering reality.
answer: |-
  Here's Lewis's account restructured in your terms, followed by a residue report dissecting the fit and friction:

  **Lewis Translated to Distributed Systems Vocabulary:**

  1.  **Coordination Problem:** A recurrent system state where multiple nodes (agents) have interdependent actions, and success requires mutually consistent state transitions. Failure results in inconsistent state (e.g., deadlock, livelock, partition). *Analogy:* The "handshake problem" before reliable communication can begin.
  2.  **Convention:** A widely deployed, self-stabilizing protocol solving a specific coordination problem. Its correctness depends on nodes having consistent local views of the protocol specification and expected state transitions.
  3.  **Arbitrariness:** Multiple distinct protocols could solve the same coordination problem with equivalent efficiency/stability properties. Choosing one is a "version negotiation" where the specific content is less critical than universal adoption (e.g., TCP port 80 for HTTP vs. port 8080).
  4.  **Precedent:** The initial protocol implementation/vendor that achieved critical adoption ("first mover advantage"). Subsequent nodes adopt this spec via *cloning* (OSS forks, RFC implementations) rather than reinventing a logically equivalent solution.
  5.  **Common Knowledge (CK):** A state where every node knows the protocol spec, knows that every other node knows it, knows that they know it knows, ad infinitum. *Approximation:* Achieved through recursive ACK round-trips during bootstrap/configuration dissemination. The *depth* of recursion correlates with the strength of the guarantee (eventual CK under benign conditions).
  6.  **Self-Perpetuation:** Nodes conform because:
      *   They observe others conforming via successful interactions (ACKs, consistent state).
      *   They *expect* others to conform based on past observations (precedent).
      *   Deviation causes state inconsistency (equivalent to a crash/fault), harming the deviating node's own goals (message loss, inability to participate).
      *   Conforming is a Nash equilibrium given the expectations of others' conformity.

  **Residue Report: What Fits, What Bends, What Breaks**

  1.  **Fits Cleanly:**
      *   **Coordination Problem Core:** The abstraction is nearly isomorphic. Lewis's "situations of interdependent decision" map directly to distributed state transitions requiring consensus or coordination (e.g., leader election, committing a value, agreeing on network topology).
      *   **Arbitrariness & Multiple Equilibria:** The "version negotiation" analogy is strong. Choosing TCP vs. QUIC for reliable streams, Raft vs. Paxos for consensus, or even little-endian vs. big-endian are perfect examples of arbitrary but functionally equivalent choices where universal adoption matters more than the specific choice.
      *   **Precedent as Adoption Driver:** The history of protocols *is* driven by cloning successful implementations (e.g., the Berkeley sockets API, the Chord DHT paper's implementations, Bitcoin's codebase forks). The "first plausible implementation" often becomes the de facto standard.
      *   **Conformity via Expectation & Observation:** Nodes *do* base their actions on observed behavior (message patterns, state responses) and expectations derived from the protocol spec (their local view of the "convention"). Success reinforces conformity; failure (timeouts, inconsistencies) triggers fault handlers or reconfiguration.

  2.  **Requires Bending/Interpretation:**
      *   **Preferences vs. Failure States:** This is the core tension. Lewis's "preference for general conformity" implies a *valuation* by the agent. In a protocol:
          *   *Bend:* Interpret "preference" as the protocol's *goal state*. A node "prefers" states where its actions lead to successful outcomes (ACKs, committed state). Deviation causes failure states (timeouts, crashes, partitions), preventing the node from achieving its goal. The "preference" is embedded in the state machine design – it transitions towards states defined as success and away from (or recovers from) failure states. The *motivation* is external (designer's intent, system goal), while Lewis's agents have internal motivations.
          *   *Critical Difference:* Humans in a convention might *tolerate* minor or temporary deviations (e.g., driving slightly over the speed limit if others do). Protocols typically have binary success/failure or enter recovery modes (retries, leader re-election) on *any* deviation from the spec. Lewis's preferences allow for degrees of conformity; protocols are usually intolerant.
      *   **Common Knowledge (CK) - Attainability:**
          *   *Bend:* Lewis's CK is an idealization. He acknowledges practical CK suffices: agents act *as if* CK holds. In async systems, protocols achieve *eventual consistency* or *probabilistic agreement* about the protocol state/spec, often using bounded ACK rounds or gossip. This approximates "practical CK" for the system's purpose. Lewis doesn't require the impossible logical omniscience of infinite recursion, only enough mutual belief to sustain coordination. Your ACKs give you "Lewis-strength" CK, not the impossible formal kind.
          *   *Critical Nuance:* Philosophers debate the *logical structure* of CK. FLP proves *exact, instantaneous, guaranteed* CK is impossible in async systems. Lewis's bar is lower – he needs *sufficient* mutual belief *in practice* to sustain coordination, which protocols *can* achieve (e.g., TCP handshake ACKs establish sufficient mutual belief for the connection).

  3.  **Breaks / No Direct Counterpart:**
      *   **Normative Force & The "Ought":** This is the **biggest residue**. Lewisian conventions often carry a *normative* element: "We *ought* to drive on the right *because* it's the convention." Breaking it feels wrong and invites sanction (blame, social pressure). Protocols lack this.
          *   *In Protocols:* Deviation is a *fault*, not a *wrongdoing*. The response is technical (retry, reconfigure, crash), not normative (blame, punishment, moral appeal). There's no concept of "blaming" a Byzantine node for being malicious; it's just faulty. The "norm" is purely descriptive (the spec) and functional.
          *   *Your Flatmate's Point:* This is likely the "norm vs. artifact" distinction. Philosophers focus on the *normative practice* – the *reason* people feel bound and judge deviations. You focus on the *artifact* – the engineered mechanism enabling coordination. The artifact *implements* something *like* the norm, but the normative "ought" itself doesn't exist in silicon.
      *   **Ambiguity & Interpretation:** Human conventions tolerate ambiguity and require interpretation ("drive reasonably fast for conditions"). Protocol specs aim for precise, unambiguous state transitions. Deviation due to misinterpretation is still a fault. Lewis's conventions are fuzzy social objects; protocols are formal specifications.
      *   **Origin of "Preferences":** The teleology is external. The node's "preference" for states is programmed by the designer to achieve a system-level goal. Lewis's agents have intrinsic preferences driving their participation in the coordination problem itself. The protocol node has no preferences of its own; its goals are assigned.

  **Conclusion & Addressing Your Instincts:**

  *   **Flatmate's Oversimplification:** "Conventions are just protocols" is an insightful but reductive analogy. Lewis's framework brilliantly *anticipated* game-theoretic and computational views of coordination (Schelling points, Nash equilibria). The core structure maps remarkably well to distributed protocols, explaining *how* conventions/protocols solve coordination problems via arbitrariness, precedent, and mutual expectations.
  *   **The Residue Reveals:** The friction points (Preferences/Norms, CK attainability, Ambiguity) highlight key differences between **human social practice** and **engineered systems**:
      *   **Normativity:** The "ought" and social enforcement in conventions has no direct analog in protocols (faults != wrongdoing). *This is the genuinely missing piece in your vocabulary for describing human conventions.*
      *   **Preference Teleology:** The source and nature of the "drive" to conform is fundamentally different (internal human desire vs. externally programmed function).
      *   **Robustness vs. Precision:** Human conventions handle ambiguity and degrees of conformity; protocols demand precision and fail (or recover) on deviation.
  *   **Blueprint vs. House:** **Your instinct is correct.** A protocol is the *blueprint* (specification, artifact). The convention is the *runtime, lived practice* of nodes successfully interacting *using* that blueprint. The philosopher cares deeply about the *normative practice* – the shared understanding, the mutual expectations, the feeling of obligation – that emerges *from* and *sustains* the use of the blueprint. The engineer focuses on designing a blueprint that *forces* correct runtime behavior despite faults. Lewis describes the social glue; you build the mechanism. The flatmate conflated the mechanism with the social phenomenon it enables.
  *   **Takeaway:** Lewis provides a powerful *analytical framework* for understanding the logic of coordination that translates surprisingly well to distributed systems. However, the residue shows his theory captures essential elements of *human sociality* (norms, intrinsic preferences, ambiguity tolerance) that are absent from the cold logic of state machines and message passing. His insight that conventions are "arbitrary, self-perpetuating solutions based on mutual expectations" is brilliantly applicable to protocols. The parts that don't map cleanly highlight the unique aspects of human conventions that your protocols deliberately eschew for the sake of precision and fault tolerance.
