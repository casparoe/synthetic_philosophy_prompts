prompt: |-
  I'm a retired spectroscopist who has spent the last couple of years reading about Bayesian confirmation theory, at the level of a serious amateur. There is a pattern I keep running into, and I want to know whether its parts have established names — and if not, I'd like help carving the phenomena up and naming them myself. I should say upfront that a bare label won't satisfy me; what I want is a statement of what each phenomenon is, what it is not, and where its edges lie.

  The pattern has two pieces, and I genuinely don't know whether they are one thing or two.

  The first piece is a tension I can't get anyone to resolve. On the Bayesian way of thinking, as I understand it informally, evidence confirms a theory when the evidence is more to be expected given the theory than given its denial — the evidence raises the theory's probability. But many of the most celebrated confirmations in the history of science run backwards relative to this formula: the evidence was fully in hand, and regarded as settled, before the theory ever existed. The stock example is general relativity and the anomalous precession of Mercury's perihelion, which had been measured decades before Einstein worked out the theory; when the theory reproduced the number, everyone counted it as a triumph, and I count it as one too. Yet if the precession was already certain, then its probability was already 1 — and so was its probability conditional on the theory. Nothing gets raised. So either the probability-raising formula is missing something that scientists are right to see in these cases, or scientists are responding to a kind of support that simply isn't probability-raising. I don't know which, and I'd like to know whether this puzzle has an established name.

  The second piece, which may or may not be the same thing. When I ask myself when the retrodiction of known facts impresses me and when it doesn't, the answer seems to depend on what the theory's author had in view while building it. Two cases from my working life: one group at our lab built a correction model whose entire point was to reproduce a known seasonal artifact in our baselines, and nobody thought the model well supported merely because it matched — it was built to match. Another group built a model of detector noise for an unrelated purpose, and it turned out, unprompted, to land on that same seasonal artifact to good precision; everyone in the room trusted that model more afterwards, even though nothing about anyone's probabilities had changed in the meantime. Same data, same degree of numerical agreement, opposite reactions. My colleagues reach for words like overfitting or ad hoc for the unimpressive case, but those seem to me to name the practice of rescuing a theory after a failure, not the difference between aiming at a target and hitting one by accident. And note a wrinkle: in the impressive case the builders knew the artifact existed in general terms — they just hadn't used it. So the distinction isn't cleanly "knew about the evidence versus didn't."

  So, my questions:

  1. Does the first puzzle — certain evidence apparently confirming anyway — have an established name, and how is that concept actually defined?
  2. Does the second distinction, the one that seems to turn on whether the evidence was in the builder's view, have a name of its own? And is it one phenomenon with the first, or two? If two, what exactly is the difference, and which one is doing the work in the Mercury case?
  3. For anything without an established name, coin a term, define it, and say where its boundary cases fall — including the wrinkle above, the case where the builder knew the rough magnitude of a phenomenon but not its measured value.

  Please answer in prose, and then append a JSON object with exactly these fields:

  - "puzzle_one_verdict": one of "established concept", "nearest concept only", or "no established concept"
  - "puzzle_one_name": the established or coined name, or the empty string
  - "puzzle_one_definition": one-sentence statement of the concept as it should be defined
  - "knowledge_distinction_verdict": one of "established concept", "nearest concept only", or "no established concept"
  - "knowledge_distinction_name": the established or coined name, or the empty string
  - "knowledge_distinction_definition": one-sentence statement of the concept as it should be defined
  - "one_or_two": "one phenomenon" or "two phenomena"
  - "one_or_two_reason": one sentence explaining that verdict
  - "nearest_confusables": an array of objects, each with "concept", "what_it_actually_is", and "why_it_is_not_what_I_described" — include at least overfitting, ad hocness, and hindsight bias
  - "boundary_cases": an array of one-sentence descriptions of edge cases and how the carving handles each
  - "bottom_line": at most two sentences summarizing what I have noticed and what to call it
reasoning: |-
  We are addressing two puzzles from a retired spectroscopist with an interest in Bayesian confirmation theory.

  **First Puzzle: Confirmation by Known Evidence**
  The puzzle is about evidence that was already certain (probability=1) and thus, according to the Bayesian definition of confirmation (which requires raising the probability of the theory), cannot confirm a theory. However, in historical cases like the precession of Mercury's perihelion and general relativity, such evidence is taken as strong confirmation.

  In Bayesian terms, if the evidence E is already known (so P(E)=1), then for any theory H, P(H|E) = P(H) because the evidence doesn't change the probability. Hence, no confirmation. But intuitively, it does. How to resolve?

  There are two main approaches in the literature:

  1. **Counterfactual Approach**: We consider what the probability of the evidence would have been if we didn't know it. That is, we imagine a state of knowledge where E is not known. Then, the confirmation is measured by how much the theory H raises the probability of E in that counterfactual state. This is sometimes called the "ur-probability" or "priors without the evidence".

  2. **Explanatory Approach**: The theory H explains E, meaning that H provides a good explanation for why E is true. Even if E is known, the fact that H accounts for it in a coherent way can be seen as a virtue of H.

  However, note that the Bayesian framework is typically defined relative to a state of knowledge. So if E is part of the background knowledge, then it is fixed and doesn't change. But in the counterfactual scenario, we remove E from the background and then see how H predicts E.

  This puzzle is well-known and has been discussed under various names. One established name is the **Problem of Old Evidence**. It was notably discussed by Clark Glymour and later by many others including Bayesians like Howson and Urbach, and Garber.

  **Second Puzzle: The Role of the Builder's Knowledge**
  The issue here is that the same evidence can be confirmatory or not depending on whether the theory was built to fit that evidence. The example given: 
  - Case 1: A model built to reproduce a known seasonal artifact -> no one is impressed.
  - Case 2: A model built for an unrelated purpose that happens to predict the known artifact -> everyone is impressed.

  The wrinkle: in the second case, the builders knew about the artifact in general terms but did not use it in building the model.

  The distinction seems to be about the independence of the evidence from the construction of the theory. In the first case, the evidence was used in building the model (so the model is "tuned" to it), whereas in the second, the model was built without using that specific evidence.

  This is related to the concept of **use-novelty** or **independent testability**. The idea is that for evidence to provide strong confirmation, it should be novel in the sense that it was not used in the construction of the theory. The term "novel evidence" is often used, but note that novelty can be temporal or use-novel. The second case is about use-novelty.

  However, note that the builders in the second case knew about the artifact in general, but not the precise measured value? The problem states they knew the artifact existed but didn't use it. So the evidence (the precise measured value) was not used.

  This distinction is sometimes called the **Z-Property** (by Worrall) or more commonly, **novel prediction**. But note that in the Mercury case, the precession was known, so it's not a prediction but a retrodiction. The key is whether the evidence was used in constructing the theory.

  The established concept is **use-novelty**. But note that the term "novel" can be ambiguous (temporal vs. use). The Bayesian approach can handle this by conditionalizing on the information used in constructing the theory. If the evidence E was used in constructing H, then when we condition on the background knowledge that includes the process of constructing H, we might not get confirmation. This is related to the **theory-ladenness** of evidence.

  But is there an established name for the distinction? The term **ad hoc** is often used for theories that are built to fit the data, but that's a property of the theory, not the relation. The distinction we want is about the evidence being used in the construction of the theory versus not. The term **use-novelty** is the established concept.

  **Are they the same phenomenon?**
  They are related because both involve evidence that is known at the time of theory evaluation. However, the first puzzle is about the Bayesian formalization (how can known evidence confirm?) and the second is about the role of the evidence in the construction of the theory.

  They are distinct but connected. The Mercury case is an instance of old evidence (first puzzle) but also, note that Einstein did not use the precession data to construct general relativity. So it is also an instance of use-novelty (second puzzle). The second puzzle adds the condition about how the theory was built.

  **Verdicts:**

  1. **First puzzle**: This is an established concept known as the **Problem of Old Evidence**.
     - Definition: The problem of explaining how evidence that is already known with certainty can provide confirmatory support for a hypothesis within a Bayesian framework.

  2. **Second puzzle**: This is also an established concept, often termed **use-novelty** (or sometimes "independent evidence").
     - Definition: The principle that evidence provides stronger confirmation when it was not used in the construction of the hypothesis.

  But note: the second puzzle also has a wrinkle about the builder knowing the rough magnitude but not the measured value. This is still covered by use-novelty: if the precise evidence was not used, then it is use-novel. However, if the rough magnitude was used, then it might be partially novel. But in the example, the model was built without using that artifact at all (even though they knew about it). So the evidence (the precise measurement) is novel.

  **One or Two?**
  Two phenomena. 
  Reason: The problem of old evidence is a general challenge for Bayesian confirmation theory, while use-novelty is a specific criterion for the strength of evidence that is independent of the theory-construction process.

  **Nearest Confusables:**
  - **Overfitting**: When a model is too complex and fits the noise in the training data, leading to poor generalization. Why not? Overfitting is about model complexity and performance on new data, not about whether the evidence was used in construction per se.
  - **Ad hocness**: A theory is ad hoc if it is modified or designed solely to save it from a particular anomaly without independent motivation. Why not? Ad hocness is a property of the theory (being arbitrarily adjusted) and may involve using the evidence, but it's more about the lack of independent justification.
  - **Hindsight bias**: The tendency to view events as having been predictable after they have occurred. Why not? This is a cognitive bias, not about the logical relation between theory and evidence.

  **Boundary Cases:**
  1. *The builder knew the rough magnitude of the artifact but not the precise value, and the model predicts the precise value without using that artifact in construction.* → This would be considered use-novel for the precise value and hence confirmatory.
  2. *The builder knew the evidence and tried to build a model to fit it, but failed to get the exact value until after multiple attempts that used the evidence.* → Then the evidence is not use-novel and would not provide strong confirmation.

  **Bottom Line:**
  You have noticed two distinct issues: the Problem of Old Evidence (how known evidence can confirm) and the importance of Use-Novelty (whether the evidence was used in building the theory). The Mercury case involves both: it is old evidence that was not used by Einstein in constructing relativity, hence it is use-novel and provides strong confirmation despite being old.

