answer: |-
  ### Analysis of the Puzzles

  #### First Puzzle: Confirmation by Certain Evidence
  This is the **Problem of Old Evidence**, an established challenge in Bayesian confirmation theory. It arises when evidence \(E\) (e.g., Mercury's perihelion precession) is already known with certainty (\(P(E) = 1\)) before a theory \(H\) (e.g., general relativity) is formulated. Bayesian confirmation requires \(P(H|E) > P(H)\), but if \(P(E) = 1\), then \(P(H|E) = P(H)\), implying no confirmation. Yet scientists clearly regard such fits as confirmatory. The resolution involves counterfactual reasoning: we assess what the probability of \(E\) *would have been* if \(H\) were true and \(E\) were *not* yet known. Formally, we compare \(P(E|H, \sim K)\) and \(P(E|\sim H, \sim K)\), where \(\sim K\) represents a hypothetical state of ignorance about \(E\). This elevates \(H\)'s *explanatory power* over mere probability-raising.  
  **Verdict:** Established concept.  
  **Name:** Problem of Old Evidence.  
  **Definition:** A challenge in Bayesian epistemology where evidence already known with certainty (\(P(E) = 1\)) appears to confirm a theory despite violating standard probability-raising criteria, resolved by evaluating the evidence's probability in a counterfactual state of ignorance.

  #### Second Puzzle: The Role of Builder Knowledge
  This is **use-novelty**, an established concept distinguishing whether evidence was *used in constructing* the theory. When evidence \(E\) (e.g., a seasonal artifact) is deployed to build or tune a model, fitting \(E\) lacks confirmatory power (e.g., the correction model). When \(E\) emerges unprompted from a theory built *without leveraging it* (e.g., the detector noise model), it provides strong confirmation. Crucially, "use" refers to exploiting the *specific form* of \(E\) during construction—not mere awareness of its existence. The wrinkle (knowing the artifact's rough magnitude but not its measured value) is handled cleanly: if only vague prior knowledge existed and the *exact value* wasn’t used, the fit remains use-novel.  
  **Verdict:** Established concept.  
  **Name:** Use-novelty.  
  **Definition:** Evidence confirms a theory strongly only if it was not used in the theory’s construction, with "use" defined as leveraging the specific form or value of the evidence during model-building.

  #### One or Two Phenomena?
  **Verdict:** Two phenomena.  
  **Reason:** The Problem of Old Evidence addresses temporal/certainty issues in confirmation, while use-novelty addresses epistemic independence from theory-construction—both are distinct but often co-occur (as in the Mercury case, where Einstein did *not* use the precession data).

  #### Nearest Confusables
  - **Overfitting**:  
    What it actually is: When a model fits noise/artifacts in *training data* but fails to generalize.  
    Why not: Overfitting focuses on model complexity vs. data limitations; it doesn’t address whether evidence was *used* in construction or was already certain.  
  - **Ad hocness**:  
    What it actually is: Modifying a theory *post-failure* to rescue it from disconfirmation.  
    Why not: Ad hocness is reactive (post-prediction), while your cases involve proactive construction with/without evidence.  
  - **Hindsight bias**:  
    What it actually is: Overestimating the predictability of an outcome *after* it occurs.  
    Why not: This is a cognitive bias, not a criterion for confirmatory strength based on theory-construction.

  #### Boundary Cases
  1. **Builder knew rough magnitude but not measured value**:  
     If the theory wasn’t adjusted using the *exact value*, the fit is use-novel (e.g., your detector noise model).  
  2. **Evidence was ignored during construction but later matched**:  
     Confirmatory—lack of use defines use-novelty, even if builders were aware of \(E\).  
  3. **Evidence was used indirectly (e.g., via a proxy)**:  
     If the proxy’s design relied on \(E\), it violates use-novelty; otherwise, it holds.  
  4. **Theory was built for one purpose but fits unrelated evidence**:  
     Strong confirmation (as in your detector noise case), since \(E\) was not a construction input.

  #### Bottom Line
  You’ve identified two distinct but interacting phenomena: the **Problem of Old Evidence** (how certain evidence confirms) and **use-novelty** (how evidence unused in theory-building strengthens confirmation). In the Mercury case, both apply: the precession was old evidence, and Einstein didn’t use it—making it a paradigm of use-novelty.

