prompt: |-
  I'm TAing a 300-level epistemology course and grading midterms, and one answer is making me go back and forth more than it probably should. I have to give the question a letter grade (we do A / A- / B+ / B / B- / C+ / C / D / F on each question) and write comments I can point to if the student comes to argue her grade, so I want an actual point-by-point breakdown tied to specific things she wrote, not just a general impression. Can you give me the grade plus the comments you'd write for her? Here's the question and her answer, typed out as she wrote it (typos hers).

  Question 4: "Recall Keith DeRose's bank cases. In the low-stakes version, Hannah and her wife are driving home on a Friday, pass the bank, and consider coming back Saturday to deposit a check; nothing much rides on it, since if the bank turns out to be closed they can just go Monday. In the high-stakes version, the setup is the same except a large bill is due Monday, and if the check isn't deposited by Saturday they face a serious penalty. In both versions Hannah's evidence is exactly the same: she was at that bank two Saturdays ago and it was open, and she doesn't stop to double-check. We're inclined to say Hannah knows the bank will be open in the first version but hesitate in the second. (a) Explain how epistemic contextualism accounts for this data. (b) Explain how subject-sensitive invariantism (the pragmatic encroachment view) accounts for it. (c) Now suppose Hannah is in the high-stakes situation, but her friend — who is relaxed and doesn't care one way or the other — says 'Hannah knows the bank will be open Saturday.' What does each view say about the friend's utterance, and why?"

  Her answer:

  "Epistemic contextualism says that 'knows' behaves like 'tall' or 'flat': the standards for applying it are fixed by the context in which the attribution is made, so the sentence 'Hannah knows the bank will be open' can express something true when uttered in one context and something false when uttered in another. This is the view of Keith DeRose, and also of Jason Stanley. In the low-stakes version, the standards in the conversational context are low, so Hannah's evidence (she was there two Saturdays ago and it was open) easily meets them, and the attribution is true. In the high-stakes version the standards go up, and her evidence no longer clears the bar, so the attribution is false. Contextualism explains the data as a shift in the standards for the word, not a shift in Hannah's epistemic position.

  Subject-sensitive invariantism, or pragmatic encroachment, keeps the meaning of 'knows' fixed across contexts. Instead, whether knowledge is present depends on the subject's practical situation: when a lot is at stake for her, she needs a stronger epistemic position to count as knowing. So in the low-stakes version Hannah knows, and in the high-stakes version she doesn't, but this time because of facts about her situation rather than about the word.

  Where the subject and the attributor are the same person, as in the original cases (Hannah is talking about her own case), the two views predict the same verdicts, which is why the bank cases alone can't decide between them.

  In the case where Hannah is in the high-stakes situation but her friend is relaxed, the contextualist says that what matters is the attributor's context. The friend's context is low-stakes, so the standards are low. But the point of contextualism is that the standards track how much is at stake for the subject, and here a lot is at stake for Hannah. So the contextualist has to say the friend's utterance is false. The subject-sensitive invariantist also says it's false, since for her the question is always Hannah's practical situation, and Hannah's is high-stakes. So in this case both views give the same answer, which shows the two views aren't really as different as they are usually made out to be."

  Its not a howler-riddled answer, she clearly studied, but something about the last paragraph keeps bugging me and I want to make sure my grade and comments reflect everything that's going right and everything that isn't before I hand it back. Also, if it matters for how you'd weight the parts, part (c) was worth about half the points on this question.
reasoning: |-
  Okay, I need to help the TA grade this epistemology midterm answer. The student's response is mostly solid but has some issues in part (c), which is worth half the points. Let me break it down step by step.

  First, looking at part (a) on epistemic contextualism: The student correctly explains that 'knows' has context-sensitive standards like 'tall' or 'flat'. She accurately notes that in low-stakes, standards are low so Hannah knows; in high-stakes, standards rise so she doesn't. Good references to DeRose and Stanley. This part seems correct and should get full credit.

  For part (b) on subject-sensitive invariantism (SSI): She properly contrasts it with contextualism by stating 'knows' has fixed meaning. She explains pragmatic encroachment—knowledge depends on the subject's practical situation. Low-stakes: Hannah knows; high-stakes: she doesn't due to stakes, not evidence. Correctly notes both views give same predictions in original cases. This is accurate.

  Now part (c) is where problems start. The scenario involves Hannah in high-stakes and her relaxed friend making a knowledge attribution. The student claims both views say the friend's utterance is false. But this is incorrect for contextualism. 

  Contextualism focuses on the attributor's context, not the subject's. Since the friend is in low-stakes context, standards should be low. Hannah's evidence would meet low standards, so the friend's statement should be true. The student mistakenly thinks contextualism tracks the subject's stakes, which is actually SSI's approach. This is a fundamental error.

  She also incorrectly states SSI would say the utterance is false—which is technically correct (since SSI looks at Hannah's situation), but she muddles the reasoning by implying contextualism does the same. Worse, she concludes this shows the views aren't very different, which is misleading. They diverge sharply here: contextualism should deem the friend's claim true, while SSI says false. This misses a key contrast between the theories.

  Additionally, the Jason Stanley mention in part (a) is a minor error—Stanley is actually an SSI proponent, not contextualist. But since it's not central to the explanation, it might not warrant point deduction.

  For grading: Parts (a) and (b) are strong (A-level). Part (c) has significant errors: misrepresenting contextualism's verdict, conflating the views' mechanisms, and drawing an incorrect conclusion about their similarity. Given part (c)'s weight (50% of question), this pulls the overall grade down to B/B+, but since (a) and (b) are flawless, B+ seems fair.

  The comments should: 1) Praise accuracy in (a)/(b), 2) Clearly explain the contextualism error in (c) (attributor vs. subject context), 3) Note the SSI part was correct but overshadowed by faulty comparison, 4) Address the "not really different" misconception, 5) Mention the Stanley slip as minor. Structure this as bullet points for clarity in feedback.
answer: |-
  Based on a detailed breakdown of the answer, focusing on accuracy, completeness, and conceptual clarity for each part (with part (c) weighted at 50%), here is the grade and annotated feedback:

  **Grade: B+**  
  *(Rationale: Excellent on (a) and (b), but significant errors in (c) undermine its core purpose. Part (c) carries half the weight, and its major flaw prevents an A-.)*

  ---

  ### Comments for the Student:
  **Overall:** You clearly grasp the core mechanics of contextualism and SSI in parts (a) and (b), and your writing is precise. However, part (c) contains a critical misunderstanding of contextualism that impacts the comparison between the views. Below is a breakdown:

  #### Part (a): Contextualism (Excellent - A)
  - **✅ Correct:** You accurately explain that contextualism treats "knows" as context-sensitive (like "tall"), with standards shifting based on the attributor’s conversational context.  
  - **✅ Strong:** You correctly note Hannah’s evidence meets low standards in the low-stakes case but not high standards in the high-stakes case, and emphasize this is a shift in language, not her epistemic position.  
  - **⚠️ Minor Nitpick:** Jason Stanley is actually a critic of contextualism (he defends SSI!). This doesn’t hurt your explanation here, but be careful with attributions.

  #### Part (b): Subject-Sensitive Invariantism (SSI) (Excellent - A)
  - **✅ Correct:** You clearly state SSI keeps "knows" invariant and ties knowledge to the subject’s practical situation, requiring stronger epistemic justification in high-stakes scenarios.  
  - **✅ Insightful:** Your point that both views predict the same verdicts in the original cases (where subject = attributor) shows good understanding of why the bank cases alone don’t decide between theories.

  #### Part (c): The Friend’s Utterance (Problematic - C+)
  This section contains **one major error** and **one significant misconception**, undermining the comparison:
  - **❌ Major Error (Contextualism):**  
    You claim contextualism says the friend’s utterance ("Hannah knows the bank will be open") is **false**. This is incorrect.  
    → **Why it’s wrong:** Contextualism evaluates "knows" based on the **attributor’s context** (here, the relaxed friend). Since the friend is in a low-stakes context, the standards for "knows" are **low**. Hannah’s evidence (past observation) likely meets these low standards, so the friend’s assertion should be **true**.  
    → **Your Mistake:** You incorrectly state contextualism tracks "how much is at stake for the **subject**" (Hannah). Contextualism tracks the **attributor’s** conversational stakes, not the subject’s. This error reverses contextualism’s verdict.  

  - **⚠️ Significant Misconception (Comparison of Views):**  
    You conclude that both views agree the utterance is false and that this shows they "aren’t really as different as they are usually made out to be."  
    → **Why it’s misleading:**  
    - SSI *does* correctly say the utterance is false (since it depends on **Hannah’s** high-stakes situation).  
    - But contextualism should say it’s **true** (based on the **friend’s** low-stakes context).  
    → **The Core Issue:** This case *exposes* a key difference: contextualism makes knowledge attributions sensitive to the attributor’s context, while SSI makes knowledge itself sensitive to the subject’s practical situation. Your analysis misses this contrast entirely.  

  - **✅ Correct (SSI Portion):**  
    Your SSI analysis is accurate: SSI evaluates the utterance based on Hannah’s situation (high-stakes), so it deems the friend’s claim false.  

  #### Why This Matters for Grading:  
  Part (c) was designed to test your ability to **distinguish** the two views in a critical case where subject and attributor contexts diverge. Your error in contextualism’s verdict and the resulting conflation of the views’ mechanisms means you missed the central point of the question. Since (c) is worth ~50% of the points, this limits the overall grade despite strong performance elsewhere.

  ---

  ### Suggestions for Improvement:
  1. **Contextualism’s Core Tenet:** Remember—contextualism is about the **attributor’s conversational context**. The subject’s stakes don’t directly affect the truth of *someone else’s* knowledge attribution.  
  2. **Use Test Cases:** When comparing theories, ask: "Who determines the stakes?" (Attributor for contextualism; subject for SSI). This helps avoid conflation.  
  3. **Clarify Stanley:** Double-check primary sources—Stanley’s *Knowledge and Practical Interests* defends SSI, not contextualism!

  Your grasp of the basics is strong—refine these nuances for the final! If you have questions, come to office hours.
