answer: |-
  The practice of party discipline in parliamentary democracies presupposes a complex theory of political judgment and representation, centered on **collective agency, electoral mandates, and functional efficiency**, while raising profound tensions with individual conscience as highlighted by Simone Weil. Below is a reconstruction and assessment of the implicit theory, its philosophical underdetermination, and the implications of Weil's critique.

  ---

  ### **Implicit Theory Behind Party Discipline**
  1. **Programmatic Representation**:  
     Voters elect a *party platform* rather than an individual. Legislators are vehicles for implementing a collective agenda, implying that their private judgment is secondary to the electorate's mandate for the party's program. This aligns with the **"party mandate" model** of representation (e.g., Schattschneider, *Party Government*).

  2. **Epistemic Efficiency**:  
     Parties aggregate preferences and expertise, filtering out individual biases or corruption through collective deliberation. Discipline ensures coherent policy outcomes, preventing legislative chaos. This draws from **Burkean "deliberative trusteeship" applied collectively**: the party, not the individual, possesses the wisdom to govern effectively.

  3. **Agency and Accountability**:  
     Parties are the primary agents of accountability. Voters punish/reward parties (not individuals) for performance. Dissent fragments accountability, making electoral verdicts incoherent. This reflects a **Rousseauian "general will" model**, where the party embodies the popular sovereign.

  4. **Pragmatic Governance**:  
     Stable majorities require discipline to pass legislation, negotiate coalitions, and avoid deadlock. This is a **functionalist justification**, prioritizing governability over moral autonomy.

  ---

  ### **Weil's Critique: The Corruption of Judgment**
  Simone Weil argues that parties:
  - **Subordinate truth to power**: Doctrine becomes a tool for electoral growth, demanding members affirm positions *because* the party holds them, not through independent inquiry.
  - **Enforce intellectual dishonesty**: Members must treat party dogma as correct to maintain standing, corroding their capacity for authentic judgment ("a poison for public life").
  - **Prioritize collective self-preservation**: Parties exist to amass power, rendering justice or truth incidental.

  **Weil's core claim**: Party discipline replaces *reason* with *loyalty*, making sincere judgment impossible. The legislator cannot treat the party line as a "genuine reason" while retaining autonomous judgment; it demands cognitive capitulation.

  ---

  ### **Can Party Discipline Coexist with Honest Judgment?**
  #### **A Defensible Reconciliation: Role-Differentiated Judgment**
  A modified theory might preserve discipline *without* wholly surrendering autonomy:
  - **Bounded Delegation**: Legislators voluntarily delegate judgment on *most issues* to the party platform they endorsed during elections, retaining conscience on fundamental moral questions (e.g., war, euthanasia). This mirrors Rawls' idea of "public reason" applied collectively.
  - **Epistemic Division of Labor**: Parties specialize in policy domains; discipline leverages expertise, freeing members to focus on constituency concerns. Judgment is exercised in *selecting a party*, not every vote (a "constrained mandate" model).
  - **Internal Deliberation**: Discipline follows robust intra-party debate, allowing members to shape the line. Their judgment is expressed *before* the whip, not suppressed.

  **Assessment**: This preserves a *qualified* autonomy but sidesteps Weil’s deeper charge: that parties *inherently* distort truth-seeking by demanding allegiance to evolving, power-driven agendas. If the party shifts position for electoral gain, members must comply or defect—corroding integrity.

  #### **Weil's Challenge: The Impossibility of "Genuine Reasons"**
  Weil denies that party loyalty can be a "genuine reason" because it demands *preemptive* assent: the member must adopt the party’s view *as their own*, or risk hypocrisy. Discipline thus presupposes a **fractured self**: the legislator’s "private" judgment is compartmentalized from their "public" role—a form of bad faith.

  ---

  ### **Philosophical Underdetermination**
  Party discipline is compatible with **rival theories of representation**:
  - **Delegate Model**: Parties are vessels for voter instructions; discipline enforces the popular mandate.
  - **Trustee Model**: Parties possess superior collective wisdom; discipline ensures prudent governance.
  - **Cartel Party Theory** (Katz & Mair): Parties as state-capturing elites; discipline maintains oligarchic control.

  **Underdetermination arises because**: The *practice* of whipping serves all three—whether enforcing voter wishes, elite expertise, or partisan self-interest. The mechanism is identical; the normative justification varies.

  ---

  ### **Reforming Practice Under Weil's View**
  If Weil's critique were taken seriously, parliamentary democracy would require:
  1. **Abolition of Whips**: No sanctions for dissent; votes as matters of conscience by default.
  2. **Fluid Legislatures**: Ad-hoc coalitions around policies, not fixed parties.
  3. **Sortition or Non-Partisan Elections**: Citizens chosen by lot (as Weil proposed) to bypass party machinery.
  4. **Deliberative Mini-Publics**: Policy shaped by randomly selected citizens, not party elites.
  5. **Strengthening Individual Accountability**: Constituents recall representatives directly, replacing party control.

  **Practical Consequences**: Governance might become more fragmented, responsive to local needs, and ideologically fluid—but risk inefficiency, incoherence, or populist volatility.

  ---

  ### **Conclusion**
  Party discipline presupposes a theory of **collective agency overriding individual judgment** for functional and epistemic reasons. While a defensible model of "bounded delegation" can partially reconcile discipline with autonomy, Simone Weil exposes a fatal tension: parties demand *intellectual surrender* to power, not reasoned allegiance. The practice is philosophically underdetermined, serving competing visions of representation, but ultimately rests on a fragile compromise between truth and power. To honor Weil’s view would require dismantling parties as we know them—a radical cure whose costs democracies have been unwilling to pay. The enduring challenge is whether parties can be more than "machines for power" without collapsing into anarchy.
