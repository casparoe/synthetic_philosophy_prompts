prompt: |-
  I'm co-writing the final for an upper-level seminar on decision theory and formal epistemology. The students have already worked through the St. Petersburg paradox, the standard utility-based responses to it, and the basics of expected utility theory, so they can be assumed to know what a St. Petersburg-style game is — but I want the essay question on the Pasadena paradox to be unanswerable by recitation. A student who has merely memorized the sentence "the Pasadena game's expectation is undefined" should not be able to pass it. The question I have in mind should force three things. First, the student must explain precisely why the Pasadena game's expectation is undefined rather than merely infinite, and why that difference matters for what a resolution owes us — the St. Petersburg literature's tools were built for the infinite case, and I want the students to see that the undefined case breaks them in new ways. Second, the question should present a proposed repair and ask the student to evaluate it: imagine a colleague who suggests ranking gambles by the Cesàro mean of the partial sums of the expectation series — that is, averaging the oscillating partial sums, which happens to deliver a clean finite value for the Pasadena game — and who claims this is the principled successor to expected value. Third, the question should include a dominance twist: an "Altadena" variant in which the probabilities are the same as in the Pasadena game but every payoff is one dollar higher, and the student must say whether the proposed rule — or any rule of that general shape — can both assign the Pasadena game a definite value and still respect the intuition that a pointwise-better gamble must be preferred.

  Please write the question as it would appear on the exam, assuming students have 90 minutes to answer it. Since I don't want the question to depend on recall, include a short preamble within the question itself that states both games explicitly (payoffs and probabilities) and defines the Cesàro rule, so everything needed is on the page and the intellectual work is all evaluation rather than retrieval. Then give a model answer of about 600 words, followed by a marking scheme. The marking scheme should be built around five must-hit points with marks summing to 20, and for each point a one-line note on how students typically botch it — for instance, conflating "the series diverges" with "the series fails to converge because it oscillates," or praising the Cesàro rule for its mathematical elegance without ever asking what happens to its verdicts when the game is truncated after finitely many terms or when finitely many payoffs are altered.

  Please also name, explicitly, the specific move that separates an A answer from a B answer. My own sense is that the difference lives in whether the student notices that the Cesàro rule's ranking can be made to flip under changes that leave the underlying gamble almost surely unchanged in character — or in whether they see exactly which of the intuitions at stake (definiteness of value, dominance, independence from ordering) must be sacrificed and can say why their chosen sacrifice is the cheapest one — but exercise your own judgment about where the real crux sits. One formatting request: end your entire response with a final line of the form "Crux: <one sentence>" stating the single distinction or insight the question is engineered to test, so I can check the finished question against it as a spec before sending it to the committee.
reasoning: |-
  We are writing an exam question for an upper-level seminar. The students are familiar with the St. Petersburg paradox and expected utility theory. We want to test their understanding of the Pasadena paradox and the challenges it poses beyond the St. Petersburg paradox.

  The question should:
  1. Force students to explain why the Pasadena game's expectation is undefined (not infinite) and why that matters for resolutions.
  2. Present a proposed repair: ranking gambles by the Cesàro mean of the partial sums of the expectation series. We'll call this the "Cesàro rule".
  3. Introduce an "Altadena" variant that dominates the Pasadena game (same probabilities, each payoff is one dollar higher) and ask whether the proposed rule (or rules of that shape) can assign a definite value to Pasadena while respecting dominance.

  We need to write the question with a preamble that defines the games and the Cesàro rule so that students don't need to recall anything.

  Then, we provide a model answer (about 600 words) and a marking scheme. The marking scheme has five must-hit points (summing to 20 marks) with a note on common mistakes for each.

  We also need to name the move that separates an A from a B answer. The crux might be noticing that the Cesàro rule's ranking can flip under changes that leave the gamble almost surely unchanged (like truncation or reordering) or seeing which intuition must be sacrificed and why that sacrifice is the cheapest.

  Finally, we end with "Crux: <one sentence>".

  Let's design the question:

  **Question:**

  Consider two gambles, the Pasadena game and the Altadena game, defined as follows:

  **Pasadena game:** A fair coin is tossed until it lands heads. Let \(n\) be the number of tosses. The payoff is:
  - \(+\$2^n / n\) if \(n\) is odd,
  - \(-\$2^n / n\) if \(n\) is even.

  **Altadena game:** The same coin-tossing procedure, but the payoff is:
  - \(\$1 + 2^n / n\) if \(n\) is odd,
  - \(\$1 - 2^n / n\) if \(n\) is even.

  Note that in both games, the probability that the game ends on the \(n\)-th toss (i.e., the first \(n-1\) tosses are tails and the \(n\)-th is heads) is \(1/2^n\).

  Recall that the expectation of a gamble is defined as the sum of the products of probabilities and payoffs. For the Pasadena game, the expectation series is:
  \[
  \sum_{n=1}^{\infty} \frac{1}{2^n} \times \left( (-1)^{n+1} \frac{2^n}{n} \right) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}
  \]
  This is the alternating harmonic series, which is conditionally convergent but not absolutely convergent. Its partial sums oscillate and converge to \(\ln 2\), but the series is not absolutely convergent (i.e., the sum of the absolute values of the terms diverges). Therefore, the expectation of the Pasadena game is undefined in the standard sense.

  A colleague proposes a new rule for ranking gambles: the "Cesàro rule". The Cesàro rule assigns to a gamble the Cesàro mean of the sequence of partial sums of its expectation series. Specifically, for a series \(\sum_{k=1}^{\infty} a_k\), the partial sums are \(s_m = \sum_{k=1}^{m} a_k\). The Cesàro mean is the limit as \(m\to\infty\) of the average of the first \(m\) partial sums: \(c_m = \frac{s_1 + s_2 + \dots + s_m}{m}\). If the limit of \(c_m\) exists, then the Cesàro rule assigns that limit as the value of the gamble.

  For the Pasadena game, the Cesàro mean of the partial sums of the alternating harmonic series is known to be \(\ln 2 \approx 0.693\). Thus, the Cesàro rule assigns a definite finite value to the Pasadena game.

  **Your tasks:**

  1. Explain why the Pasadena game poses a deeper challenge than the St. Petersburg game. In particular, why is the undefined expectation more problematic for decision theory than an infinite expectation? (4 marks)

  2. The Cesàro rule assigns the Pasadena game a definite value. Explain why this might seem like an attractive resolution. (4 marks)

  3. Apply the Cesàro rule to the Altadena game. What value does it assign? (Hint: Write out the expectation series for Altadena and express it in terms of the Pasadena series.) (4 marks)

  4. Does the Cesàro rule respect the principle of dominance? That is, since the Altadena game pays one dollar more than the Pasadena game in every possible outcome, should we not always prefer Altadena? Compare the values assigned by the Cesàro rule and discuss. (4 marks)

  5. Critically evaluate the Cesàro rule. In particular, consider what happens when we truncate the game after a finite number of terms (say, after \(N\) tosses, if heads hasn't appeared by then we call it off and pay nothing) or when we alter finitely many payoffs. Does the Cesàro rule's verdict change in a way that seems reasonable? (4 marks)

  **Model Answer (approx. 600 words):**

  The Pasadena game's expectation is undefined because its expectation series (the alternating harmonic series) is conditionally convergent but not absolutely convergent. This means that rearranging the terms of the series can change its sum, making the expectation depend on the order of summation. In contrast, the St. Petersburg game has an expectation series that diverges to positive infinity, which is unambiguously infinite. The undefined case breaks the standard tools because we cannot assign a unique value without an arbitrary choice of summation method. This matters because a resolution must provide a well-defined preference ordering, and an undefined expectation leaves us without guidance.

  The Cesàro rule is attractive because it assigns a definite finite value (ln2) to the Pasadena game, which avoids the problem of undefined expectations. Moreover, it does so in a mathematically principled way by taking the average of the partial sums, which smooths out the oscillations. This method is consistent with the ordinary sum when the series converges absolutely and extends the concept of summation to some divergent series.

  For the Altadena game, the expectation series is:
  \[
  \sum_{n=1}^{\infty} \frac{1}{2^n} \times \left(1 + (-1)^{n+1} \frac{2^n}{n}\right) = \sum_{n=1}^{\infty} \frac{1}{2^n} + \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}.
  \]
  The first series is a geometric series summing to 1. The second is the alternating harmonic series. The partial sums of the Altadena expectation series are therefore \( s_m' = s_m^{(1)} + s_m^{(2)} \), where \( s_m^{(1)} \) is the partial sum of the geometric series (which converges to 1) and \( s_m^{(2)} \) is the partial sum of the alternating harmonic series. The Cesàro mean of \( s_m' \) is the sum of the Cesàro means of the two series (since Cesàro summation is linear). The Cesàro mean of the geometric series is 1 (because it converges absolutely). The Cesàro mean of the alternating harmonic series is ln2. Therefore, the Cesàro rule assigns to Altadena the value \( 1 + \ln 2 \approx 1.693 \).

  Dominance requires that if one gamble pays more than another in every state, it should be preferred. Altadena dominates Pasadena by $1 in every outcome. The Cesàro rule assigns Altadena a value that is exactly $1 more than Pasadena's (1 + ln2 vs ln2). Therefore, by the Cesàro rule, Altadena is preferred. This satisfies dominance.

  However, the Cesàro rule is not without problems. Consider truncating the Pasadena game after N terms: if heads first appears after N tosses, the game is called off and the payoff is zero. The expectation series then becomes a finite sum, which converges to a particular value (the partial sum of the alternating harmonic series up to N). The Cesàro mean for this truncated series is just that finite sum (because the series converges). But note that as N increases, the value of the truncated game oscillates and does not converge to ln2. In fact, the Cesàro mean of the infinite series is ln2, but the truncated games (for any finite N) have Cesàro means that are different. Worse, if we alter finitely many payoffs (say, we set the payoff for n=1 to be $1000 instead of $2), then the expectation series changes by a finite amount, which would be convergent. The Cesàro mean would then be the original Cesàro mean plus the finite change. But note: the original series without alteration is conditionally convergent, so a finite alteration doesn't change the Cesàro mean? Actually, it does: the Cesàro mean of a convergent series is its sum. But in the infinite case, the Cesàro mean of the altered series would be the Cesàro mean of the original plus the alteration. However, the problem is that the rule becomes sensitive to the ordering of the outcomes. If we reorder the outcomes (for example, by changing the order of summation), the Cesàro mean might change because conditional convergence is sensitive to order. But the Cesàro mean for the alternating harmonic series is known to be robust under rearrangement? Actually, no: conditional convergence is not robust, but the Cesàro mean is more robust. However, for series that are not absolutely convergent, the Cesàro mean can still be changed by rearrangement. This is because the Cesàro mean does not require absolute convergence. In fact, by the Riemann rearrangement theorem, the alternating harmonic series can be rearranged to converge to any real number. However, the Cesàro mean is more stable: for a fixed ordering, it gives a value, but if we reorder the terms (i.e., reassign the payoffs to different outcomes without changing the probabilities and payoffs themselves) then the series changes and the Cesàro mean might change. This is deeply problematic because the decision should not depend on the arbitrary labeling of the states.

  Thus, while the Cesàro rule satisfies dominance in the Altadena case, it fails to be state-independent: the value assigned can depend on the order in which we list the outcomes. This violates a fundamental principle that the value of a gamble should depend only on the mapping from states to payoffs, not on how we index the states. Therefore, the Cesàro rule, while delivering a definite value and satisfying dominance in this instance, is not a fully adequate resolution.

  **Marking Scheme (20 marks total):**

  1. **Explanation of why Pasadena is more challenging than St. Petersburg (4 marks):** 
     - Must state that the expectation is undefined (not infinite) because the series is conditionally convergent (oscillates) and not absolutely convergent. 
     - Must note that this means the sum is order-dependent, so we cannot assign a unique value without an arbitrary choice.
     - Common mistake: Saying that the expectation is infinite or that the series diverges without specifying conditional convergence.

  2. **Attractiveness of the Cesàro rule (4 marks):**
     - Must note that it assigns a definite finite value, avoiding the undefined problem, and that it is mathematically principled (e.g., extends summation to conditionally convergent series in a way that is consistent).
     - Common mistake: Simply stating that it gives a finite number without explaining why that is attractive beyond "it's finite".

  3. **Application to Altadena (4 marks):**
     - Must decompose the Altadena series into the geometric series (sum=1) and the alternating harmonic series (Cesàro mean=ln2) and add them to get 1+ln2.
     - Common mistake: Not recognizing the decomposition or mishandling the linearity of Cesàro summation.

  4. **Dominance and Cesàro (4 marks):**
     - Must note that the Altadena value is exactly $1 more, so dominance is satisfied in this case.
     - Must also note that the rule does respect dominance for these two games.
     - Common mistake: Claiming that because the values are finite and one is higher, dominance is respected, but without checking the exact $1 difference.

  5. **Critical evaluation (4 marks):**
     - Must discuss truncation: the truncated game has a different value and the Cesàro rule for the infinite version does not match the finite versions.
     - Must discuss alteration of finitely many payoffs: the Cesàro mean changes by a finite amount, which might be acceptable, but the deeper issue is the sensitivity to the order of summation (rearrangement). The gamble's value should not depend on the order of states, but the Cesàro mean (like the ordinary sum) does.
     - Common mistake: Only discussing truncation without rearrangement, or vice versa, or failing to articulate why rearrangement is a problem (because it makes the value arbitrary).

  **Separating A from B:** The A answer will note that the Cesàro rule's value depends on the order of the outcomes (the labeling of states) and that this is unacceptable because the decision should be state-independent. The B answer might only note the truncation issue without seeing the deeper problem of order-dependence.

  **Crux:** The question is engineered to test whether the student recognizes that the Cesàro rule, while providing a definite value and satisfying dominance in the Altadena case, fails because its valuation is sensitive to the order of summation (i.e., the labeling of states), which is arbitrary and thus violates a basic principle of decision theory.

  Now, we write the entire response as requested, ending with "Crux: ...".
answer: |-
  **Exam Question: Decision Theory and the Pasadena Paradox**  
  *(Time allotted: 90 minutes)*  

  **Preamble:**  
  This question concerns two gambles, the **Pasadena game** and the **Altadena game**. Both involve a fair coin tossed until it lands heads. Let \(n\) denote the toss number of the first heads (e.g., \(n=3\) means tails on tosses 1 and 2, heads on toss 3). The probability of \(n\) is \(\frac{1}{2^n}\) for \(n = 1, 2, 3, \dots\). The payoffs are:  
  - **Pasadena game**: Payoff = \((-1)^{n+1} \cdot \frac{2^n}{n}\) dollars.  
    - *Example*: If \(n=1\) (heads on first toss), payoff = \(+2\) dollars; if \(n=2\), payoff = \(-2\) dollars; if \(n=3\), payoff \(\approx +2.67\) dollars.  
  - **Altadena game**: Payoff = \(\left[(-1)^{n+1} \cdot \frac{2^n}{n}\right] + 1\) dollars.  
    - *Example*: If \(n=1\), payoff = \(+3\) dollars; if \(n=2\), payoff = \(-1\) dollar; if \(n=3\), payoff \(\approx +3.67\) dollars.  

  The expectation of a gamble is typically defined as the sum of payoffs multiplied by their probabilities. For the Pasadena game, this expectation series is:  
  \[
  \sum_{n=1}^{\infty} \left[ \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} \right] = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}.
  \]  
  This is the *alternating harmonic series*. Its partial sums \(s_m = \sum_{n=1}^m (-1)^{n+1} \frac{1}{n}\) oscillate and converge to \(\ln 2 \approx 0.693\) as \(m \to \infty\), but the series is not *absolutely convergent* (i.e., \(\sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{1}{n} \right| = \sum_{n=1}^{\infty} \frac{1}{n}\) diverges). Consequently, the expectation is **undefined** in standard analysis.  

  A colleague proposes a new decision rule, the **Cesàro rule**, to rank gambles. This rule assigns a value to a gamble by computing the *Cesàro mean* of the partial sums of its expectation series. For a series with partial sums \(s_1, s_2, s_3, \dots\), the Cesàro mean is:  
  \[
  c_m = \frac{s_1 + s_2 + \dots + s_m}{m},  
  \]  
  and the rule assigns the gamble the value \(\lim_{m \to \infty} c_m\), provided this limit exists. For the Pasadena game, the Cesàro mean converges to \(\ln 2\).  

  **Tasks:**  
  1. **Undefined vs. Infinite Expectation**: Explain why the Pasadena game’s undefined expectation poses a deeper challenge for decision theory than the St. Petersburg game’s infinite expectation. Focus on why “undefined” disrupts standard tools more severely than “infinite.” (4 marks)  
  2. **Appeal of the Cesàro Rule**: Why might the Cesàro rule seem like a principled resolution to the Pasadena paradox? Discuss its mathematical properties and how it handles the Pasadena game. (4 marks)  
  3. **Altadena via Cesàro**: Compute the value the Cesàro rule assigns to the Altadena game. Show your reasoning, leveraging the linearity of Cesàro summation. (4 marks)  
  4. **Dominance Principle**: The Altadena game pays exactly $1 more than the Pasadena game in every possible outcome. State whether the Cesàro rule’s valuation of these games (from Tasks 2–3) respects *stochastic dominance* (i.e., if gamble A pays more than gamble B in all states, A should be preferred). Analyze any tension. (4 marks)  
  5. **Critique the Cesàro Rule**: Evaluate whether the Cesàro rule is a robust decision tool. Consider: (i) What happens if the Pasadena game is truncated at a finite \(N\) (i.e., if no heads occurs by toss \(N\), payoff = 0)? (ii) Does altering finitely many payoffs (e.g., changing the \(n=1\) payoff to $1000) preserve the rule’s verdicts? Argue why these cases challenge the rule’s validity. (4 marks)  

  ---  
  **Model Answer**  
  *(Approx. 600 words)*  

  1. The St. Petersburg game has an infinite expectation, meaning its expected value diverges unambiguously to \(+\infty\). Standard tools (e.g., risk aversion or utility flattening) can address this. In contrast, the Pasadena game’s expectation is *undefined*: its series oscillates indefinitely without converging, due to conditional convergence (converges to \(\ln 2\) for this ordering, but rearranged terms yield any real number by the Riemann rearrangement theorem). This matters because decision theory requires a unique, order-invariant value to rank gambles. An undefined expectation provides no guidance, as preferences could flip arbitrarily under trivial relabeling of states. The St. Petersburg problem is “merely” unbounded, but Pasadena’s conditionally convergent series injects arbitrariness into the heart of expected value maximization.  

  2. The Cesàro rule is attractive because it assigns a definite finite value (\(\ln 2\)) to the Pasadena game, resolving the ambiguity of the undefined expectation. It appears principled: it extends standard summation (agreeing with ordinary sums when absolute convergence holds) and “tames” oscillation by averaging partial sums, mirroring a natural intuition of stabilizing erratic convergence. For Pasadena, this yields \(\ln 2\), a plausible fair price. Mathematically, it satisfies linearity and regularity for many series, offering a consistent framework beyond absolutely convergent gambles.  

  3. The Altadena game’s expectation series decomposes as:  
  \[
  \sum_{n=1}^{\infty} \frac{1}{2^n} \left( (-1)^{n+1} \frac{2^n}{n} + 1 \right) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n} + \sum_{n=1}^{\infty} \frac{1}{2^n}.
  \]  
  The second series is geometric with sum \(1\). Cesàro summation is linear, so the Cesàro mean for Altadena is the Cesàro mean of the alternating harmonic series (\(\ln 2\)) plus the Cesàro mean of the geometric series. Since the geometric series converges absolutely (Cesàro mean \(=1\)), Altadena’s value is \(1 + \ln 2 \approx 1.693\).  

  4. Dominance demands strict preference for Altadena, as it pays $1 more in every state. The Cesàro rule assigns Pasadena \(\ln 2 \approx 0.693\) and Altadena \(1 + \ln 2 \approx 1.693\), so Altadena is ranked higher. Thus, the rule respects dominance *here*. However, this outcome relies on the specific payoff ordering: if the state sequence were reordered (e.g., listing even \(n\) before odd \(n\)), the alternating series’ Cesàro mean can change (as conditional convergence is order-sensitive), potentially violating dominance. Hence, the rule’s compliance with dominance is fragile and order-dependent.  

  5. The Cesàro rule falters under robustness tests. (i) *Truncation*: If the Pasadena game ends at \(N\) with payoff 0, its expectation is the finite sum \(s_N\), not \(\ln 2\). As \(N\) grows, \(s_N\) oscillates (e.g., \(s_{1000} \approx \ln 2\), but \(s_{1001} \approx \ln 2 - 0.001\)), so the Cesàro mean for the infinite game (\(\ln 2\)) mismatches the finite-game approximations agents actually face. (ii) *Finite alterations*: Changing finitely many payoffs (e.g., setting \(n=1\) to $1000) adds a fixed amount \(\Delta\) to the series. Since \(\Delta\) is finite and convergent, the Cesàro mean shifts by \(\Delta\), preserving order locally. But the deeper flaw is *order-sensitivity*: rearranging states (e.g., swapping \(n=2\) and \(n=3\)) alters the series’ partial sums, changing the Cesàro mean arbitrarily. Since state labels are epistemically arbitrary, a decision rule should be order-invariant. The Cesàro rule fails this, rendering valuations pathologically sensitive to irrelevant framing.  

  **Conclusion**: While the Cesàro rule resolves Pasadena’s undefined expectation and satisfies dominance in the base case, it is inadequate due to order-dependence and truncation instability. A sound decision rule must yield state-independent values, which requires absolute convergence or a different approach altogether.  

  ---  
  **Marking Scheme**  
  *(Total: 20 marks; allocate marks as below)*  

  1. **Undefined vs. Infinite (4 marks)**  
     - *Must-hit*: Contrast undefined (oscillating/conditionally convergent) vs. infinite (monotonic divergence); emphasize order-dependence as the critical breakage.  
     - *Common botch*: Conflating "diverges" with "undefined" or failing to mention rearrangement sensitivity.  

  2. **Cesàro Appeal (4 marks)**  
     - *Must-hit*: Identifies definite finite value, consistency with intuition for oscillating series, and extension beyond absolute convergence.  
     - *Common botch*: Praising finiteness alone without linking to conditional convergence or mathematical principles.  

  3. **Altadena Calculation (4 marks)**  
     - *Must-hit*: Correct decomposition (geometric + alternating harmonic series); linearity yields \(1 + \ln 2\).  
     - *Common botch*: Incorrectly summing the geometric series or mishandling linearity.  

  4. **Dominance Evaluation (4 marks)**  
     - *Must-hit*: Notes dominance holds in this ordering (\(\ln 2 < 1 + \ln 2\)) but flags fragility under reordering.  
     - *Common botch*: Claiming dominance is satisfied without caveats or missing order-dependence.  

  5. **Robustness Critique (4 marks)**  
     - *Must-hit*: Truncation causes mismatch with finite cases; order-dependence violates state-invariance.  
     - *Common botch*: Only discussing truncation (not rearrangement) or accepting finite alterations as unproblematic while overlooking deeper order-sensitivity.  

  **A vs. B Distinction**:  
  - **B answer**: Correctly addresses Tasks 1–4 and surface issues (e.g., truncation) in Task 5 but misses the *order-dependence* flaw.  
  - **A answer**: Identifies that the Cesàro rule’s value is *order-sensitive* (rearranging states changes the valuation), making it arbitrary and violating a core decision-theoretic principle (state-independence). This insight shows why no such summation-based rule can work without absolute convergence.  

  **Crux**: The question tests recognition that resolving the Pasadena paradox requires a *state-independent valuation*, and any order-sensitive rule (like Cesàro) fails this by allowing arbitrary preference reversals under trivial relabelings of outcomes.
