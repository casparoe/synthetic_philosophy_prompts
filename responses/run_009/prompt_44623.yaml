  The user might also want to know how this case informs the broader debate. Does it show that moral theories need to account for procedural justice? Or that real-life complexities make pure dilemmas rare? Highlighting how the theories handle the procedural injustice will address the case's unique aspects beyond just the life-and-death choice.

