  In decision theory, there's a concept called evidential decision theory (EDT) versus causal decision theory (CDT).

  EDT says to consider the evidence: if I cooperate, that suggests the other might cooperate, so P(other cooperates | I cooperate) might be high, so cooperating could lead to good outcomes.

  CDT says to ignore that and only consider the causal effect: my action doesn't cause the other's action; it's already set, so I should defect to get the better outcome no matter what.

