prompt: |-
  So here's my situation: I got voluntold onto the grant panel of our county arts council (small town, ~30 applications a quarter, $2,500 grants, and every decision has to be defensible in writing because we've had two appeals in the last year). Our chair, a retired high school art teacher, had a conversion experience reading Tolstoy's What Is Art? and now wants the whole panel scoring applications his way. The old rubric was generic mush — "merit, feasibility, community impact" — and she says it let in exactly the kind of polished, empty work Tolstoy would've called counterfeit. As she puts it, for Tolstoy real art is the transmission of a feeling the artist actually experienced, sincerity is the make-or-break condition, and technical skill without a real feeling behind it is just imitation of art. Fine in principle. The problem is that we're five volunteers with no philosophy background and maybe fifteen minutes per application, so what I need is a procedure the panel can actually run: the questions in order, what counts as a sufficient answer to each, the points where it stops with a no, and — this is the part I care most about — the points where it can't produce a score at all and just has to hand the question back to the panel because it's a values call, not a scoring question. And please be honest about which steps are really just judgment dressed up as a checklist.

  The hard parts the procedure has to face head-on: we fund work that hasn't happened yet, so there's no audience yet to observe whether the feeling gets transmitted (Tolstoy's "infection" happens in spectators, but we only see a written application and a small portfolio); sincerity is self-reported and literally every application says the artist is passionate; and clarity of an application is not the same thing as clarity of the artwork. If the procedure just ends up scoring how well people write grant applications, it's worse than the old mush and I'd rather know that now.

  Then run it on three cases so I can see it work: (1) a youth theater group whose application letter is genuinely moving but whose sample script is stale and borrowed-sounding; (2) a technically brilliant conceptual sculptor whose application is cold and ironic throughout, though we have photos of last year's unveiling and people at it look visibly moved; and (3) the case I already know the panel will hate: an amateur painter, obviously sincere, mediocre craft — the kind of applicant our old rubric rejected politely and that I suspect Tolstoy's logic actually favors over polished professionals. If the procedure says fund her and not the sculptor, so be it, but I want to see the steps that get us there. Finally, tell me straight what this procedure cannot do — my guess is it can't touch Tolstoy's harder claim that the feeling also has to be one worth transmitting (he ties that to the religious perception of his own age, whatever we're supposed to substitute for that in rural Ohio in 2025), and it can't predict whether an audience will actually catch anything. Wherever it's substituting the panel's values for Tolstoy's, the procedure should say so out loud rather than hide it in a score.
reasoning: |-
  Okay, the user is part of a county arts grant panel that's shifting to a Tolstoyan evaluation framework. They need a practical scoring procedure that handles sincerity and emotional transmission within tight time constraints. The key pain points are: assessing unrealized projects, sincerity being self-reported, and avoiding over-reliance on application writing quality. 

  Hmm... the real challenge here is operationalizing Tolstoy's abstract concepts ("sincerity," "infection") into concrete steps for overworked volunteers. The user explicitly wants us to flag where judgment calls masquerade as objectivity - that's refreshingly self-aware. 

  First, I should dissect Tolstoy's core principles: (1) Artist's authentic emotional experience (2) Work's capacity to transmit that feeling (3) Sincerity as non-negotiable. But the implementation hurdles are massive: no live audience, portfolios as fragments, future projects. 

  For the procedure, we'll need stages: 
  Initial sincerity gatekeeping (hard no if insincere), then transmission assessment using proxies (portfolio evidence, audience reactions if available), then feasibility checks. Crucially, we'll build in "values call" off-ramps where scoring fails. 

  The three test cases are brilliantly chosen to stress-test the system:
  1. Youth theater - emotional application vs derivative work exposes the sincerity/transmission gap
  2. Ironic sculptor - forces confrontation between artist's stated intent and audience reaction
  3. Amateur painter - probes whether technical flaws override sincerity

  Biggest limitations: 
  - Can't verify if transmitted feelings align with Tolstoy's moral framework (user's rural Ohio 2025 point)
  - Transmission assessment is speculative for unrealized projects
  - Risk of conflating articulate applications with artistic merit

  The procedure must loudly announce where it's making subjective leaps - especially in the transmission assessment phase. For the amateur painter case, we might need to explicitly state that under Tolstoy's logic, clumsy authenticity beats polished detachment even if it violates panelists' professional instincts. 

  Notable landmines: 
  If the sculptor's audience was "moved" by irony, does that satisfy Tolstoy if the artist felt contempt? Probably not - Tolstoy hated irony. But the procedure should force that debate into the open rather than bury it in scores. 

  Final design principle: Every numeric score must be backed by observable evidence, and every unobservable element (artist's sincerity) gets a binary sincerity check with clear failure points. The rest gets kicked to panel discussion.
answer: |-
  Here's a Tolstoy-inspired grant evaluation procedure designed for practicality, transparency about judgment calls, and defensibility. It focuses on observable proxies for sincerity and transmission potential within your constraints.

  **Core Principles Embedded in the Procedure:**
  1.  **Sincerity First:** Without evidence of authentic emotional investment, technical skill is insufficient ("counterfeit" risk).
  2.  **Transmission Potential:** The work *must* plausibly transmit *that specific feeling* to an audience. We assess mechanisms, not guaranteed outcomes.
  3.  **Clarity of Feeling:** The core feeling driving the work must be identifiable (even if complex).
  4.  **Judgment Transparency:** Explicit "Values Call" points force discussion, not hidden scoring bias.
  5.  **Evidence Over Eloquence:** Focus on portfolio *content* and application *substance*, not just writing quality.

  ---

  **The Tolstoyan Grant Evaluation Procedure: (15 Minutes/Application)**

  **I. Sincerity & Authentic Feeling Check (Gatekeeper - Pass/Fail)**
      *   **Question 1: What specific, identifiable feeling does the artist claim is the core of this work?** (Scan application: project description, artist statement, letter).
          *   *Evidence Needed:* Clear statement (e.g., "grief over loss," "joy of community," "unease about technology," "anger at injustice"). Vague terms like "exploring identity" or "beauty" are insufficient without elaboration tied to feeling.
          *   **Stop/No:** If no identifiable core feeling is stated or strongly implied. *(Judgment: Does the implied feeling feel authentic to the work described?)*
      *   **Question 2: Is there evidence *beyond* self-report ("I am passionate") that the artist has a genuine connection to this feeling?**
          *   *Evidence Sources:*
              *   Portfolio: Does the past work *shown* resonate with the stated feeling for *this* project? Does it feel lived-in?
              *   Application Narrative: Specific anecdotes, personal connections, or deep engagement with the subject matter related to the feeling? (e.g., "growing up in this community inspired this," "my own experience with X fuels this," detailed research reflecting deep immersion).
              *   Project Design: Does the proposed method/medium seem intrinsically suited to evoke *that specific feeling*?
          *   **Stop/No (Insufficient Sincerity):** If evidence is weak or solely relies on "I am passionate/committed." Polished statements without supporting evidence = risk of counterfeit. *Cold/Ironic detachment requires scrutiny: Is it a genuine feeling (e.g., alienation, critique) or a pose?*
          *   **Values Call:** If evidence exists but is ambiguous or open to interpretation (e.g., is this deep research or superficial appropriation? Is irony here a genuine feeling or a shield?).

  **II. Transmission Potential Assessment (Scored: 1-5, Low-High)**
      *   **Focus:** How *effectively* could this work transmit the *identified core feeling* to its intended audience?
      *   **Question 3: Based on the portfolio and project description, does the artist demonstrate *intentionality* in using their craft/medium to evoke the core feeling?**
          *   *Evidence:* Look for specific techniques, choices, or descriptions explained in relation to the feeling (e.g., "using harsh lighting to evoke isolation," "repetitive rhythms to convey anxiety," "community workshops to foster shared joy"). Connection doesn't need to be perfect, but intentionality must be visible.
          *   *Score Low (1-2):* Technical skill apparent but no link to feeling explained or visible in portfolio. Portfolio feels generic.
          *   *Score High (4-5):* Clear, compelling explanation *and* portfolio evidence showing technique serving feeling. Portfolio pieces evoke a resonant feeling.
          *   **Values Call:** If the *method* of transmission is unconventional or challenging, and the panel disagrees on its potential effectiveness.
      *   **Question 4: Does the portfolio contain work that *successfully transmits a feeling* to *any* audience (even if small)? (Leverage observable evidence)**
          *   *Evidence:*
              *   Photos/videos of audience reactions (if provided - e.g., Case 2 sculptor).
              *   Critical reviews/audience testimonials (focus on emotional impact described).
              *   *The work itself:* Does *this panel* feel the transmitted feeling when viewing the portfolio samples? (Be honest! This is a key, subjective proxy).
          *   *Score Low (1-2):* No evidence of past transmission; portfolio feels emotionally flat or confusing *to the panel* despite skill.
          *   *Score High (4-5):* Strong evidence of past transmission (photos, testimonials) *and/or* the portfolio pieces powerfully evoke the feeling *for the panel*. Portfolio feels authentic and resonant.
          *   **Values Call:** If audience evidence exists but is contradictory (e.g., some moved, some baffled), or if the panel's personal reaction to the portfolio is strongly divided.
      *   **Question 5: Is the proposed project design and context likely to facilitate transmission to the *intended* audience?**
          *   *Evidence:* Venue suitability, accessibility considerations, outreach plan, artist's understanding of the audience. Does the format (installation, performance, workshop) align with the feeling and audience?
          *   *Score Low (1-2):* Design seems mismatched to feeling/audience; no clear plan for engagement.
          *   *Score High (4-5):* Design thoughtfully facilitates transmission; artist demonstrates audience awareness; venue/format enhances the feeling.
          *   **Stop/No (Feasibility):** If the project design makes transmission demonstrably impossible (e.g., inaccessible venue for target audience, no plan to reach them).

  **III. Feasibility & Clarity (Pass/Fail - Non-Artistic)**
      *   **Question 6: Is the project plan clear, realistic, and within budget?** (Use standard feasibility checks from old rubric).
      *   **Question 7: Is the application itself clear enough to understand the project and the feeling?** (Avoids scoring writing *quality*, only assesses *clarity* of core elements: What? Feeling? How? For Whom?).
      *   **Stop/No:** If feasibility is impossible or the application is fundamentally unclear despite the feeling/intent being discernible.

  **Scoring & Decision:**
  1.  **Fail any "Stop/No" in I or III:** Application rejected.
  2.  **Pass I & III, reach "Values Call" in I or II:** Panel discussion mandatory before scoring proceeds. Resolve the ambiguity through debate focused on Tolstoyan principles. Document the debate point.
  3.  **Transmission Score (II):** Average scores from Q3, Q4, Q5 (1-5 each).
  4.  **Threshold:** Set a minimum average Transmission Score (e.g., 3.0). Highest scores above threshold funded until budget exhausted. *Tiebreaker:* Strength of Sincerity evidence (I).

  ---

  **Running the Cases:**

  *   **Case 1: Youth Theater (Moving Letter, Stale Script)**
      *   **I.1:** Feeling identified? (e.g., "hope amidst adversity"). PASS.
      *   **I.2:** Sincerity Evidence? Strong letter (moving), but portfolio (script) feels stale, borrowed. Link to *their* lived feeling weak. **VALUES CALL:** Is the letter's emotion authentic to *this group* for *this project*, or just well-written? Does the stale script undermine sincerity? (Panel Debate: Maybe sincere *intent* but artistic execution lacks authenticity? High risk of "counterfeit" if feeling isn't theirs).
      *   *If Panel Resolves as Sincere:* Proceed.
      *   **II.3:** Intentionality? Script choices don't clearly serve stated feeling. Portfolio shows weak link. *Score: Low (1-2)*.
      *   **II.4:** Transmission Evidence? Past work samples (script) don't transmit feeling strongly to panel. No audience evidence provided. *Score: Low (1-2)*.
      *   **II.5:** Project Design? Theater workshop for peers - potentially good format. *Score: Medium (3)*.
      *   **Transmission Avg:** Likely 1.5-2.0. **BELOW THRESHOLD. REJECT.** Rationale: Strong sincerity concern (resolved by panel), but demonstrably low transmission potential based on portfolio evidence of artistic execution.

  *   **Case 2: Brilliant Ironic Sculptor (Cold App, Moved Audience)**
      *   **I.1:** Feeling Identified? App is ironic/cold. Might imply "alienation," "absurdity," or "critique of consumerism"? Needs inference. **VALUES CALL:** Can we identify a *genuine* feeling beneath the irony? Is the irony the *feeling* itself (genuine detachment/critique) or just a *style* (posing)? (Panel Debate: Crucial! Photos show audience moved - what feeling *were* they catching? Did the sculptor genuinely feel that?).
      *   *If Panel Resolves Core Feeling (e.g., "genuine critique evoking unease") and Sincerity (the irony is the authentic vehicle, not a pose):* PASS.
      *   **II.3:** Intentionality? High technical skill. App is cold, but photos/portfolio suggest the work *is* intentionally evocative. *Score: High (4-5)* (Skill serves feeling).
      *   **II.4:** Transmission Evidence? **Photos show audience visibly moved!** Strongest possible evidence under constraints. Portfolio (photos) likely resonates. *Score: High (5)*.
      *   **II.5:** Project Design? Similar scale/context to past successful work. *Score: High (4-5)*.
      *   **Transmission Avg:** Likely 4.5-5.0. **ABOVE THRESHOLD. LIKELY FUND.** Rationale: Resolved sincerity/feeling via Values Call + overwhelming evidence of successful transmission.

  *   **Case 3: Sincere Amateur Painter (Mediocre Craft)**
      *   **I.1:** Feeling Identified? Likely clear & simple (e.g., "love of local landscape," "grief," "spiritual awe"). PASS.
      *   **I.2:** Sincerity Evidence? Application radiates sincerity. Portfolio, while technically mediocre, shows consistent personal focus/subject matter. Strong link to stated feeling. PASS.
      *   **II.3:** Intentionality? Choices (color, subject) seem directly driven by the feeling, even if execution is unrefined. *Score: Medium-High (3-4)* (Intention clear, execution limits effectiveness).
      *   **II.4:** Transmission Evidence? Portfolio *might* transmit the feeling modestly to some panelists ("charm," "honesty"), but lacks power due to craft limitations. No audience evidence. *Score: Low-Medium (2-3)* (Panel reaction mixed/weak).
      *   **II.5:** Project Design? Simple exhibition - appropriate for the work/audience. *Score: Medium (3)*.
      *   **Transmission Avg:** Likely 2.5-3.5. **VALUES CALL / BORDERLINE.** Rationale: Strong sincerity, clear feeling, intentionality. Transmission potential is the weak spot due to craft. Panel must debate: Does the *authenticity* overcome the *technical limitations* in terms of transmission *potential*? Is there *enough* there to potentially infect an audience receptive to raw sincerity? Under Tolstoy, the procedure likely pushes towards **FUND** if sincerity is paramount and transmission isn't zero, but the panel must explicitly own this value judgment favoring authenticity over polish.

  ---

  **What This Procedure CANNOT Do (Be Honest):**

  1.  **Verify Actual Sincerity:** We rely on proxies. A skilled liar could game it (though harder than the old rubric). We accept this limitation.
  2.  **Guarantee Transmission:** We assess *potential* using past work and intentionality. Actual transmission depends on the final work and the audience. **We cannot predict the future.**
  3.  **Judge the *Moral Worth* of the Feeling:** Tolstoy demanded feelings fostering "brotherly union." **This procedure explicitly DOES NOT assess this.** We take the artist's core feeling at face value (if sincere) for transmission potential. Funding a project transmitting genuine "hatred" is a *community values call* **far beyond** this scoring procedure. The panel/council needs a separate policy.
  4.  **Eliminate Subjectivity:** "Does the portfolio transmit the feeling *to you*?" (Q4) and resolving "Values Calls" are inherently subjective. The procedure *surfaces* this subjectivity for discussion, rather than hiding it in a mush score. **Judgment is required; the checklist structures and exposes it.**
  5.  **Fully Separate Craft from Transmission:** While we try (Q3 focuses on intentionality, Q4 on effect), poor craft often hinders transmission (Case 3), and brilliant craft can enable powerful transmission (Case 2). The panel must grapple with this tension in the Transmission scoring and Values Calls.
  6.  **Assess "Community Impact" in Non-Tolstoyan Ways:** Impact is only measured here through the lens of *transmission of feeling to an audience*. Broader social or economic impacts are not considered unless they relate directly to the feeling being transmitted (e.g., a project about community unity might inherently impact community).

  **In Summary:** This procedure forces explicit engagement with Tolstoy's core demands (Sincerity, Identifiable Feeling, Transmission Potential) using observable evidence within your constraints. It replaces vague "merit" with structured questions, clearly flags unavoidable judgment calls ("Values Call"), minimizes rewarding grant-writing over art, and generates defensible rationales. It accepts that subjectivity remains (especially regarding feeling and transmission) but makes it part of the documented process. It will likely shift funding towards artists with strong authentic voices and demonstrable transmission capacity, potentially favoring raw sincerity over detached polish, especially when transmission evidence exists. **Be prepared for Case 3 types to rise and some technically brilliant but cold applicants to fall.** Good luck!
