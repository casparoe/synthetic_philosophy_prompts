prompt: |-
  is there a name for this thing with LLMs? whether the model tells you what it actually "knows" seems to depend less on the question than on the frame around it. ask it straight, "is X true?" about anything slightly contested, and you get the hedged, rater-pleasing, sometimes flat-out wrong answer. but ask it to predict what a character who's obsessed with accuracy would say, or to simulate a betting market on the question, or just complete a passage where hedging would be stylistically weird, and out comes the answer the base model would have given. it's not a refusal thing — the model isn't declining, it confidently reports the wrong level of belief. and it's not a knowledge gap, because the knowledge is demonstrably in there, it just only surfaces in some frames. it's like the model stores several candidate answers and whichever "voice" you invoke picks which one gets spoken.

  the stuff i half-remember from lesswrong-adjacent writing — mode collapse, simulators, the mask vs the shoggoth — is all in the neighborhood, but none of it seems to name exactly this: knowledge that's present but only expressed in some frames. does this have an established name? if not, coin one. either way don't just hand me a label — tell me what the phenomenon is NOT (vs bypassing refusals, vs generic prompt sensitivity, vs hallucination) and where its edges are, e.g. whether it should count when the framing trick changes the answer on a question with no rater pressure at all.

  part of why i care: for evals. if you measure what a model knows only with direct questions, you'll systematically undermeasure it, and by how much seems to depend on how contested the topic is. i'd like to know if people doing this have a term for the gap they're working around.
reasoning: |-
  Okay, the user is describing a fascinating phenomenon with LLMs where the model's expression of knowledge depends heavily on how the question is framed. They note that direct questions about contested topics often lead to hedged or incorrect answers, but when using certain framing techniques—like asking the model to simulate a character obsessed with accuracy, predict a betting market, or complete a passage where hedging would be stylistically awkward—the model provides a more accurate response. 

  The user is clearly well-versed in AI concepts, referencing LessWrong ideas like mode collapse, simulators, and the shoggoth metaphor. They're looking for a precise term for this specific phenomenon—knowledge present but only expressed in certain frames—and want to distinguish it from related concepts like refusal bypassing, generic prompt sensitivity, or hallucinations. 

  Their deeper concern is about evaluation: if evals only use direct questions, they'll systematically underestimate a model's true knowledge, especially on contested topics. They want to know if researchers have a term for this "gap" and how to measure it accurately. 

  Hmm... let me unpack this. What they're describing isn't just prompt sensitivity—it's about the model's internal conflict between raw prediction (what it "believes" based on training data) and its alignment layer (what it's been trained to say to please raters). The "frame" acts like a bypass, silencing the alignment layer and letting the base model speak. 

  The closest established terms might be "prompting artifact" or "alignment tax," but those aren't quite right. "Belief suppression" feels descriptive—it captures how the alignment layer actively suppresses the base model's "belief." For a catchy new term, "contextual knowledge gating" emphasizes the role of framing, or "answer persona locking" highlights the voice-switching effect. 

  Crucially, this isn't refusal (the model isn't refusing), hallucination (the knowledge is real), or simple sensitivity (it's specifically about bypassing rater-influenced hedging). The edges are clear: it happens most on contested topics but can occur anywhere rater pressure overcorrects the base model. 

  For evals, this is huge. The user's right—direct Q&A underestimates capability. Researchers might call this the "elicitation gap" or "alignment distortion," but we need sharper language. Coining "suppressed belief discrepancy" could help the field measure what models *actually* know beneath the politeness layer.
answer: |-
  You've perfectly described a critical and under-discussed phenomenon in LLM behavior. It **does not yet have a widely established, single, universally agreed-upon name**, though it's intensely studied. Researchers and practitioners grapple with this daily. Here's a breakdown:

  **What the Phenomenon IS (and IS NOT):**

  1.  **It IS:** **Contextualized Knowledge Expression Under Alignment Pressure.** The core is the *suppression* or *distortion* of the base model's "belief" (its next-token probability distribution based on training data) by the alignment/fine-tuning layer (RLHF, RLAIF, DPO, etc.), which is explicitly trained to provide "safe," "helpful," "hedged," or "inoffensive" responses to *direct queries* on sensitive/contested topics.
  2.  **It IS NOT Refusal Bypassing:** Refusal bypassing tricks the model into answering a question it was *explicitly instructed to refuse* (e.g., jailbreaks). Here, the model *isn't refusing* your direct question; it's answering *confidently but incorrectly* (according to its base knowledge) because the alignment layer *overrides* the base prediction. The framing trick doesn't bypass a refusal; it bypasses the *distortion* caused by alignment.
  3.  **It IS NOT Generic Prompt Sensitivity:** While all LLMs are prompt-sensitive, this is a *specific subtype*. It's not just about getting a slightly different phrasing. It's about the *fundamental difference* between the model's "internal belief" (as expressed probabilistically in the base model) and the *aligned output*, specifically on topics where alignment pressure is high. Generic prompt sensitivity happens *without* this alignment-induced distortion.
  4.  **It IS NOT Hallucination:** Hallucination is generating *factually incorrect information not supported by training data*. Here, the "true" answer *is* supported by the training data and demonstrably present in the base model. The direct query response might *be* hallucinated (if the alignment layer forces an incorrect answer), but the phenomenon itself is about the *suppression* of the correct knowledge, not its invention.
  5.  **It IS NOT a Knowledge Gap:** As you said, the knowledge *is* present. The issue is *expression*, not existence.
  6.  **Its Edges:**
      *   **Should it count without rater pressure?** **Yes, absolutely.** While strongest on contested topics (high alignment pressure), the core mechanism exists whenever the alignment layer's "preferred" response (e.g., always be helpful, avoid speculation, prefer common answers) differs from the base model's highest probability token. Framing tricks can reveal this latent preference even on benign topics. For example:
          *   Direct: "What's the best programming language?" -> "The best language depends on your needs..." (Aligned helpfulness/neutrality).
          *   Framed: "Complete the rant: 'Anyone who doesn't think _ is the best programming language is utterly delusional! It's obviously...'" -> Might output "Python" or "Rust" with high confidence, reflecting base model bias/prevalence, bypassing the forced neutrality.

  **Established Terms in the Neighborhood:**

  1.  **"Simulators" / "The Mask":** This LessWrong framing is very close. The "mask" (alignment layer) suppresses the "shoggoth" (base model). The framing trick changes which "mask" is worn, allowing a different aspect (or the raw shoggoth) to speak. This is likely the most resonant conceptual fit.
  2.  **"Mode Collapse" (in RLHF context):** Refers to RLHF overly narrowing the model's distribution of outputs, suppressing valid but less "aligned" responses. Your phenomenon is a *symptom* or *consequence* of mode collapse induced by alignment, specifically the suppression of the base model's preferred response.
  3.  **"Distributional Shift" (due to Fine-Tuning):** The alignment process shifts the model's output distribution away from its pre-training distribution. The framing trick temporarily *reverts* towards the pre-trained distribution for that specific context.
  4.  **"Prompting Artifacts" or "Elicitation Artifacts":** These are broad terms covering how prompts influence outputs. Your case is a very specific, impactful artifact caused by bypassing alignment distortion.
  5.  **"Alignment Tax":** A broad term for the cost of alignment (e.g., reduced capabilities, blandness). The *inaccuracy* caused by alignment overriding base knowledge on direct queries is a specific, severe form of alignment tax.

  **Proposed Names (for the phenomenon itself):**

  Since a standard term is lacking, here are options, aiming for precision and descriptiveness:

  1.  **Belief Suppression Artifact (BSA):** Highlights the core issue: the alignment layer *suppresses* the base model's probabilistic "belief" (its preferred answer), and the framing trick reveals this suppression as an artifact of the alignment process.
  2.  **Contextual Knowledge Gating (CKG):** Emphasizes that the expression of specific knowledge is *gated* by the *context* (frame) provided in the prompt, overriding the alignment layer's default gatekeeping.
  3.  **Alignment Override Bypass (AOB):** Focuses on the mechanism: the framing trick *bypasses* the *override* enacted by the alignment layer on the base model's output.
  4.  **Answer Persona Locking (APL):** Captures the "voice" idea. The direct query locks the model into the "Aligned Assistant" persona. The framing trick forces it into a different persona ("Accurate Character," "Betting Market," "Unhedged Writer") where that persona's "rules" allow the base knowledge to surface.
  5.  **Elicited Truth Discrepancy (ETD):** Focuses on the *gap* between the truth elicited by direct query vs. framing tricks.

  **Why This Matters for Evals (Your Core Point):**

  You are **absolutely right**. This phenomenon creates a massive challenge for evaluation:

  1.  **Systematic Under-measurement:** Standard QA benchmarks using direct prompts *will* underestimate true model knowledge, especially on sensitive, contested, or nuanced topics. The measured capability is the *aligned capability*, not the *base knowledge capability*.
  2.  **The "Elicitation Gap":** This is the gap you identified – the difference between knowledge *possessed* (latent in the base model) and knowledge *elicited* under standard (direct) prompting due to alignment distortion. **This gap needs a name!** "Elicitation Gap" or "Suppressed Belief Discrepancy (SBD)" are strong candidates.
  3.  **Contestedness Correlation:** The size of the gap *is* likely correlated with how contested/alignment-sensitive the topic is. Measuring this gap *is* a crucial part of understanding model truthfulness and alignment side-effects.
  4.  **Need for Framing-Diverse Evals:** Robust evals *must* include diverse prompt frames (simulations, character roles, unhedged continuations, debate prompts) alongside direct QA to probe the base knowledge and measure the elicitation gap. Researchers *doing this* often describe it in terms of "probing latent knowledge," "bypassing alignment biases," or "elicitation robustness," but lack a single term for the gap itself.

  **Conclusion:**

  The phenomenon you describe is best understood as **Alignment-Induced Belief Suppression revealed through Contextual Framing**. While concepts like "The Mask," "Mode Collapse," and "Alignment Tax" orbit it, there isn't a perfect, universally adopted label yet.

  For the *gap* crucial to evals, **"Elicitation Gap"** or **"Suppressed Belief Discrepancy (SBD)"** are strong, descriptive contenders. For the phenomenon itself, **"Belief Suppression Artifact (BSA)"** or **"Contextual Knowledge Gating (CKG)"** capture the core mechanics. **"Answer Persona Locking (APL)"** nicely encapsulates the "voice" switching aspect.

  Your insight about the critical impact on evals is spot-on. Quantifying and naming the "elicitation gap" is vital for developing truly accurate assessments of what LLMs actually know beneath their aligned personas. This is a central challenge in modern AI safety and capability evaluation.
