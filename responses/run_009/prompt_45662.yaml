answer: |-
  Here’s your desiderata for an adequate theory of secession and self-determination, framed as requested:

  Any viable theory must first deliver determinate verdicts on paradigmatic hard cases, because ambiguity here renders it useless for real-world application. Non-negotiably, it must clearly adjudicate Scotland 2014 (mutually agreed referendum, lawful process), Catalonia 2017 (unilateral referendum, state suppression), and Quebec post-1995 (contested legality, "clear question" requirement unmet). Crucially, it must also identify impermissible cases — notably, annexation disguised as self-determination (e.g., Crimea 2014) — to avoid legitimizing conquest. Second, it must rigorously respect conceptual distinctions often blurred in discourse: separating the threshold question of whether a group constitutes a "people" entitled to *any* self-determination from what specific rights flow from that status (e.g., autonomy vs. independence), and differentiating *internal* self-determination (meaningful self-governance within a state) from *external* (full secession). Collapsing these, as many nationalist or populist theories do, invites analytical confusion. Third, and critically non-negotiable, are stability constraints: the theory cannot make every border perpetually contestable (e.g., allowing any municipality to secede via simple majority vote), nor grant every disaffected minority a blanket veto over state functions or territorial integrity, as this would lead to state collapse and an impossible proliferation of microstates (the "5,000 UN members" problem). This necessitates mechanisms like qualified majorities, supervenient federal consent, or restrictive eligibility criteria.

  The core tension likely rendering some desiderata jointly unsatisfiable lies between the demand for clear, accessible pathways to legitimate secession (e.g., respecting a distinct "people's" will, as arguably in Scotland) and the stringent stability constraints preventing systemic fragmentation. Pure plebiscite theories (secession via majority vote) satisfy the procedural clarity and popular will aspects but catastrophically violate stability by enabling endless secession cascades. Remedial-right-only theories (secession only after grave injustices like oppression) excel at stability and condemning annexations but fail Scotland entirely, denying a peaceful, consensual path even when both parties agree. Nationalist theories (based on shared culture/history) struggle with defining the "people" non-arbitrarily and often disregard internal self-determination as a sufficient alternative. 

  The single requirement doing the heaviest work in excluding major contenders is **stability constraints**. It alone sinks pure plebiscite theories (too destabilizing), exposes the inadequacy of remedial-right-only approaches for lawful, negotiated cases like Scotland (too restrictive), and challenges nationalist theories that ignore the risks of fragmentation. Without this anchor, theories float into utopianism or anarchy; with it, they must wrestle with the hardest trade-offs.
