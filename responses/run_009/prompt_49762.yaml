answer: |-
  ### Discussion Section Plan: Iterated Elimination with Mixed-Strategy Dominance

  **Total Time:** 50 minutes  
  **Goal:** Solidify understanding of iterated elimination of strictly dominated strategies (IESDS), emphasizing that mixed strategies can dominate pure ones. Bridge from pure-strategy dominance (covered in lecture) to mixed-dominance, correct misconceptions, and reinforce why this matters.

  ---

  #### **Dependency Structure** (Order of Concepts)  
  *Build sequentially to make mixed-dominance intuitive:*  
  1. **Review pure-strategy dominance (5 min):**  
     - Start with a quick 2x2 game (e.g., Row: T=(3,1), B=(2,0); Columns L/R). Ask students: "Is B dominated? By what?"  
     - Re-establish the definition: **"Strategy A strictly dominates B if, for every opponent move, A gives a strictly higher payoff than B."**  
     - Highlight: Elimination requires scanning for one pure strategy beating another entry-by-entry.  

  2. **Introduce iterated elimination (5 min):**  
     - Use a 3x3 example **without mixed strategies** to show multi-step elimination (e.g., a game where Row A dominates B, then after elimination, Column X dominates Y).  
     - Emphasize: "Order doesn’t matter for strict dominance—you get the same result no matter what you eliminate first."  

  3. **Motivate mixed-dominance (5 min):**  
     - Present your 3x3 example (Row: T=(3,0,1), M=(0,3,1), B=(1,1,0.5); Columns L/C/R).  
     - Ask: "Is B dominated by T? By M?" Show it isn’t (e.g., T loses to B when opponent plays C).  
     - Pose: "Does that mean B is rational? Or could something else dominate it?"  

  4. **Formalize strict dominance (including mixed) (10 min):**  
     - Define: **"A strategy is strictly dominated if there exists *any* other strategy (pure or mixed) that beats it against every opponent move."**  
     - Derive the inequality: For a mixed strategy \(\sigma\) to dominate B, require \(u_i(\sigma, s_{-i}) > u_i(B, s_{-i})\) for all \(s_{-i}\).  
     - Use the example: Show that \(\sigma = \frac{1}{2}T + \frac{1}{2}M\) yields (1.5, 1.5, 1) vs. B’s (1, 1, 0.5). Verify inequality holds for all columns.  

  5. **Run full IESDS with mixed-dominance (10 min):**  
     - Eliminate B (dominated by \(\sigma\)).  
     - Reduced game: Only T and M remain. Ask: "Can we eliminate further? Is T or M dominated?" (No—no pure or mixed strategy dominates them yet).  
     - Extend the example: **Add a column "W"** with payoffs T=(1), M=(1), B=(2). After eliminating B, show that W is now dominated by L or C for the column player (if column payoffs are set appropriately, e.g., L=(3), C=(3), W=(0)), enabling a second elimination.  

  6. **Clarify and generalize (5 min):**  
     - Stress: "Mixed-dominance doesn’t mean players *will* randomize—it proves a strategy is irrational."  
     - State: "IESDS with mixed strategies still doesn’t depend on order of elimination (unlike weak dominance)."  

  ---

  #### **Carrying Example: Fixed and Extended**  
  *Your example works with tweaks to allow a second elimination and avoid pitfalls:*  
  - **Original payoffs (good for mixed-dominance):**  
    ```
          L   C   R
      T   3   0   1
      M   0   3   1
      B   1   1   0.5
    ```  
    - **Why it works:** No pure strategy dominates B, but \(\sigma = \frac{1}{2}T + \frac{1}{2}M\) does (1.5>1, 1.5>1, 1>0.5).  

  - **Extend it for a second elimination (key for IESDS flow):**  
    - **Add column "W"** and **assign column-player payoffs** to make W dominated after B is removed:  
      ```
            L    C    R    W
      T    3,2  0,3  1,0  1,1
      M    0,3  3,2  1,0  1,1
      B    1,1  1,1  0.5,2 2,0  [B dominated by σ, so eliminated first]
      ```  
    - After eliminating B, the reduced game is:  
      ```
            L    C    R    W
      T    3,2  0,3  1,0  1,1
      M    0,3  3,2  1,0  1,1
      ```  
    - Now, **for the column player**, W is strictly dominated by R (or L/C) since R gives (0,0) vs. W’s (1,1), but 0<1 when row plays T or M? Fix: **Set column payoffs for W as (0,0)**. Then:  
      - Against T: R=0, W=0 → tie.  
      - Against M: R=0, W=0 → tie.  
      - → Not strict. **Better:** Set W’s payoffs to (-1,-1). Then:  
        - R dominates W (0>-1 for T, 0>-1 for M).  
      - Eliminate W. Final game: 2x2 with L/C vs. T/M.  

  - **Why this extension?**  
    - Shows IESDS in action: Mixed-dominance enables pure-dominance later.  
    - Avoids "nothing happens after eliminating B" anticlimax.  
    - Highlights that payoffs of the *other player* matter for sequential elimination.  

  ---

  #### **Misconception Map**  
  *Preempt errors at specific points:*  

  1. **"Mixed-dominance means players will randomize" (Address after Step 4):**  
     - When defining \(\sigma\), say: "We use mixtures *only* to prove B is irrational—not to prescribe play. Rational players might still choose pure T or M."  

  2. **"Order of elimination doesn’t matter" (Address in Step 2 and Step 6):**  
     - After pure-strategy IESDS, state: "Order independence holds for strict dominance." Reaffirm post-mixed: "This still applies—mixed doesn’t change that."  

  3. **"Not dominated = rational to play" (Address after Step 5):**  
     - When T/M remain, ask: "Does ‘not dominated’ guarantee T is optimal?" No—it depends on beliefs. Example: If column plays C, M is better than T.  

  4. **"Rationality alone justifies IESDS" (Address in Step 6):**  
     - State: "IESDS requires **common knowledge of rationality**: I know you’re rational, you know I know, and so on. Otherwise, B might not be eliminated."  

  5. **Unanticipated: "Mixed-dominance is rare/niche" (Address in Step 3):**  
     - Preempt: "In larger games, pure-dominance often fails—mixed is how we prove irrationality."  

  ---

  #### **Final Check-for-Understanding Question**  
  - **Pose:** "Suppose a new row D has payoffs (2, 2, 0) against L/C/R. Can \(\sigma = \frac{1}{2}T + \frac{1}{2}M\) dominate D? Why or why not?"  
    - **Correct answer:** No. Against L: \(\sigma\)=1.5 < D=2 → fails the "strictly better for every move" condition.  
    - **Why it reveals understanding:** Forces them to apply the definition (check all columns) rather than mimic arithmetic.  

  ---

  #### **What to Refuse to Cover**  
  - **Explicitly state:** "We’re skipping:  
    - Weak dominance (order matters, and it’s trickier).  
    - Epistemic foundations (e.g., Aumann’s theorems).  
    - Rationalizability (that’s next week!).  
    Today is about mechanics and intuition—save the extensions for later."  

  ---

  #### **Whiteboard Flow**  
  1. **Pure-strategy review** (2x2 game, arrows showing domination).  
  2. **Pure IESDS** (3x3 example, cross out eliminated strategies).  
  3. **Mixed-dominance intro** (T/M/B payoffs, circle B, show \(\sigma\) calculations).  
  4. **Full IESDS** (Extended game: cross out B, then W).  
  5. **Misconception corner** (Box with "Remember: Mixtures prove irrationality, not play").  
  6. **Q&A** (Final question + refusal list).  

  **Timing buffer:** If students grasp mixed-dominance quickly, spend extra time on the final question. If not, skip the column-player elimination in Step 5.
