prompt: |-
  Draft the joint statement that a hard incompatibilist and a reasons-responsiveness compatibilist could both sign after a two-year adversarial collaboration on free will and basic-desert moral responsibility.

  Some constraints on the document:

  1. It must open with a glossary both parties have signed off on, fixing the senses of "free will," "moral responsibility," "basic desert," "leeway," "sourcehood," and "reasons-responsiveness" — because both parties suspect that some of their past disputes turned on using "free will" to mean different things (e.g., the ability to do otherwise versus being the genuine source of one's action), and the statement should say explicitly which residual disagreements, if any, they diagnosed as merely verbal and which as substantive.

  2. The agreed-claims section (numbered) should include only claims each party would endorse under the glossary's terms — including claims about what Frankfurt cases and manipulation arguments each establish and fail to establish, what determinism itself does and does not imply, and what would follow if indeterministic noise were discovered in human decision-making.

  3. The disagreements section must be a table in which, for each disputed point, the compatibilist's position and the incompatibilist's position are each worded so that its own side would accept the phrasing, without the drafting side's slant. At least one disagreement must concern the manipulation argument's central move: whether the difference between an agent whose deliberation is covertly engineered and an agent shaped by ordinary deterministic causes is morally relevant, and if so, what it is.

  4. The cruxes section must identify the subquestions such that settling them would move at least one party, and for each crux specify an argument, case, or finding that both parties agree would bear on it, with each party's prediction recorded in advance. At minimum, include as a crux-test the following exercise both accept as probative: a continuum of cases running from an agent whose every choice is dictated moment-to-moment by a hidden designer, through an agent engineered once at birth with no further intervention, to an agent shaped by ordinary heredity and upbringing in a deterministic world. Each party must state, before the exercise, the exact point on the continuum at which they predict their opponent's responsibility judgments will become unstable or ad hoc, and both must agree in advance on what pattern of marking would count as evidence against each of them.

  5. The statement must close with a jointly authored paragraph on what, if anything, both parties now agree would actually move the debate, as distinct from what merely restates it.

  Begin with the joint statement itself, with no preface or commentary.
reasoning: |-
  We are drafting a joint statement from a hard incompatibilist and a reasons-responsiveness compatibilist after a two-year adversarial collaboration. The statement must follow the specified constraints.

  First, we start with a glossary that both parties have agreed upon. This glossary fixes the senses of key terms to avoid verbal disputes.

  **Glossary**

  1. **Free will**: The set of capacities that, when exercised appropriately, makes an agent an appropriate candidate for basic-desert moral responsibility. We remain neutral on whether free will requires the ability to do otherwise (leeway) or being the genuine source of one's actions (sourcehood), as these are points of contention.

  2. **Moral responsibility**: The condition of an agent such that it is appropriate, without any further instrumental justification, to treat them in certain ways (e.g., praise, blame, punishment, reward) on the basis of their actions, character, or attitudes. This appropriateness is grounded in the idea of basic desert.

  3. **Basic desert**: A non-consequentialist foundation for moral responsibility; an agent deserves praise or blame for an action just because they performed it with the relevant quality of will, irrespective of any good consequences that might arise from holding them responsible.

  4. **Leeway**: The ability to do otherwise in the relevant circumstances. This concept is central to some accounts of free will (e.g., the traditional incompatibilist view that free will requires alternative possibilities).

  5. **Sourcehood**: The condition of an agent being the ultimate source of their actions, such that the action's origin is in the agent and not in factors beyond the agent's control. This is often emphasized in incompatibilist accounts.

  6. **Reasons-responsiveness**: A capacity of an agent to recognize and react to reasons for action. Specifically, an agent is reasons-responsive if, in a range of possible scenarios, they would recognize and respond appropriately to reasons that count for or against performing an action. (Note: This is understood by the compatibilist as a dispositional property that can be present in a deterministic world.)

  ---

  **Agreed Claims (Numbered)**

  After extensive discussion, we agree on the following claims under the glossary's terms:

  1. **Determinism's implications**: Determinism does not, by itself, imply that agents are always coerced or compelled in a way that obviously undermines responsibility. Both parties agree that determinism is compatible with agents acting on their desires, beliefs, and reasons without external force.

  2. **Frankfurt cases**: Frankfurt-style cases successfully challenge the principle that alternative possibilities (leeway) are *necessary* for moral responsibility. In such cases, an agent may be morally responsible even if they could not have done otherwise, because the mechanism that blocks alternatives does not actually affect the agent's decision.

  3. **Manipulation arguments (what they establish)**: Manipulation arguments show that if an agent is covertly engineered (e.g., by neuroscientists) to have a specific set of values and to perform a particular action, then such an agent is not morally responsible in the basic-desert sense. This is because the agent is not the appropriate source of the action.

  4. **Manipulation arguments (what they fail to establish)**: However, manipulation arguments do not *by themselves* show that determinism is incompatible with moral responsibility. The compatibilist argues that ordinary deterministic causation does not involve the same kind of external control as manipulation, while the incompatibilist maintains that the difference is not sufficient to ground responsibility.

  5. **Indeterminism and noise**: If indeterministic noise (e.g., random neural events) were discovered in human decision-making, this would not automatically confer free will or moral responsibility. Both parties agree that such noise, if it merely adds randomness, does not provide the control required for sourcehood or reasons-responsiveness. It might even undermine control.

  6. **Reasons-responsiveness as a condition**: Both parties agree that reasons-responsiveness is a necessary condition for moral responsibility. An agent who is completely unresponsive to reasons (e.g., due to severe mental illness) is not morally responsible. However, we disagree on whether reasons-responsiveness (even if present) is sufficient for moral responsibility in a deterministic world.

  ---

  **Disagreements (Table Format)**

  The following table presents our remaining substantive disagreements. Each position is worded as the respective party would accept.

  | Disagreement Point                                                                 | Reasons-Responsiveness Compatibilist Position                                                                 | Hard Incompatibilist Position                                                                 |
  | ---------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------- | --------------------------------------------------------------------------------------------- |
  | **Sufficiency of reasons-responsiveness for responsibility in determinism**       | If an agent is reasons-responsive and acts from her own values and desires (without manipulation), then she is morally responsible in the basic-desert sense, even in a deterministic world. | Even if an agent is reasons-responsive and acts from her own values and desires, if determinism is true, she is not morally responsible in the basic-desert sense because she is not the ultimate source of her actions. |
  | **The moral relevance of ordinary causation vs. manipulation**                     | There is a morally relevant difference between an agent shaped by ordinary deterministic causes (e.g., upbringing, heredity) and one covertly engineered by a manipulator: the latter involves an intentional designer who bypasses the agent's capacities, while the former does not. This difference is sufficient to ground responsibility in ordinary cases. | There is no morally relevant difference between an agent shaped by ordinary deterministic causes and one covertly engineered by a manipulator that can ground basic-desert moral responsibility. In both cases, the agent is not the ultimate source of her actions; she is a product of factors beyond her control. |
  | **Sourcehood requirement**                                                         | Ultimate sourcehood (in the incompatibilist sense) is not required for moral responsibility. What matters is that the agent's actions arise from her own reasons-responsive mechanism in a way that is not manipulated or coerced. | Ultimate sourcehood is required for moral responsibility. Without it, the agent's actions are ultimately traceable to factors outside her control, making desert-based judgments inappropriate. |
  | **The role of alternative possibilities (leeway)**                                 | Leeway is not necessary for moral responsibility (as shown by Frankfurt cases). Responsibility is grounded in the actual sequence of events and the agent's reasons-responsive mechanism. | Leeway is not necessary for moral responsibility (conceding Frankfurt cases). However, the absence of leeway in a deterministic world is symptomatic of a deeper problem: the lack of ultimate control (sourcehood). |

  ---

  **Cruxes**

  We identify the following subquestions as cruxes of the debate. For each, we specify an argument, case, or finding that both parties agree would bear on it, and we record each party's prediction in advance.

  1. **Crux: The Continuum of Manipulation Cases**  
     - **Test**: We consider a continuum of cases:  
       - Case 1: An agent whose every choice is dictated moment-to-moment by a hidden designer (direct manipulation).  
       - Case 2: An agent engineered once at birth with a set of values and dispositions, and then allowed to develop without further intervention.  
       - Case 3: An agent shaped by ordinary heredity and upbringing in a deterministic world.  
       - (We also include intermediate cases.)  
     - **Agreed Probative Value**: Both parties agree that this continuum is probative for assessing the moral relevance of the history of an agent's values and actions.  
     - **Predictions**:  
       - *Compatibilist*: Predicts that the hard incompatibilist's judgments of non-responsibility will become unstable or ad hoc between Case 1 and Case 2, because the incompatibilist must draw a line between manipulation and ordinary causation but cannot find a principled place to do so. Specifically, the compatibilist predicts that the incompatibilist will judge Case 1 as non-responsible and Case 3 as non-responsible (if determinism holds), but for Case 2 (one-time engineering) the incompatibilist might be tempted to say the agent is responsible if they have reasons-responsiveness, which would be inconsistent with their view.  
       - *Incompatibilist*: Predicts that the compatibilist's judgments of responsibility will become unstable or ad hoc between Case 2 and Case 3, because the compatibilist must explain why one-time engineering is different from ordinary causation. The incompatibilist predicts that the compatibilist will judge Case 1 as non-responsible and Case 3 as responsible, but for Case 2 (one-time engineering) the compatibilist might be forced to deny responsibility, which would require an arbitrary cutoff.  
     - **Agreed Evidential Standard**:  
       - If the pattern of responsibility judgments across the continuum shows a sharp discontinuity that both parties can locate and justify, this would support the view that draws the line at that point.  
       - If the judgments show a gradual shift without a clear boundary, this would support the incompatibilist's skepticism about any principled distinction.  
       - If the judgments show a clear boundary that aligns with the compatibilist's distinction (e.g., between intentional manipulation and non-intentional causation), this would support compatibilism.  
       - If the judgments show that responsibility is absent in all cases, this would support hard incompatibilism.

  2. **Crux: The Possibility of Genuine Self-Formation**  
     - **Test**: Both parties agree that if it could be shown that agents have the capacity for "self-formation" — i.e., the ability to shape their own values and dispositions in a way that is not determined by prior causes and not merely random — this would be evidence for the incompatibilist's sourcehood condition.  
     - **Predictions**:  
       - *Compatibilist*: Predicts that no such capacity will be found, and that even if it were, it would not be necessary for responsibility.  
       - *Incompatibilist*: Predicts that without such a capacity, responsibility is impossible, and that if it were found, it would require indeterminism of a non-random kind.  
     - **Agreed Evidence**: Findings from cognitive science and neuroscience about the plasticity of values and the extent to which agents can reflectively alter their dispositions. If such self-formation is observed and shown to be non-random and not determined, this would support incompatibilism. If not, it would support the compatibilist's claim that responsibility does not require such self-formation.

  3. **Crux: The Role of Reasons-Responsiveness in Manipulation Cases**  
     - **Test**: Consider a manipulation case where the agent is reasons-responsive (e.g., the manipulator ensures that the agent would respond to reasons in the same way as a non-manipulated agent).  
     - **Agreed Probative Value**: Both parties agree that if the compatibilist judges such an agent as non-responsible, this would show that reasons-responsiveness alone is insufficient and that history matters.  
     - **Predictions**:  
       - *Compatibilist*: Judges that such an agent is not responsible because the manipulation bypasses the agent's own mechanisms.  
       - *Incompatibilist*: Argues that this judgment is consistent with their view that reasons-responsiveness is insufficient without the right history.  
     - **Evidential Value**: If the compatibilist consistently requires the absence of manipulation (a historical condition) even when reasons-responsiveness is present, this supports the incompatibilist's claim that the compatibilist is implicitly relying on a sourcehood condition that is threatened by determinism.

  ---

  **Closing Joint Paragraph**

  Through our collaboration, we have come to agree that the debate over free will and moral responsibility cannot be resolved by reiterating familiar arguments or by focusing solely on the compatibility question. Instead, progress depends on jointly investigating the nature of human agency and the conditions under which we hold each other responsible. Specifically, we agree that empirical work on human decision-making (e.g., the role of indeterminism, the mechanisms of reasons-responsiveness, and the effects of manipulation) and conceptual work on the metaphysics of control and sourcehood are essential. Moreover, we concur that the manipulation continuum exercise, if conducted with a diverse set of participants and analyzed for patterns of judgment, could provide evidence that moves the debate. Both of us commit to designing and executing such studies, and we encourage the philosophical community to engage in similar adversarial collaborations to test the robustness of their views.
answer: |-
  ### Joint Statement on Free Will and Basic-Desert Moral Responsibility  
  **Authored by a Hard Incompatibilist and a Reasons-Responsiveness Compatibilist**  

  #### Glossary (Agreed Definitions)  
  1. **Free will**: The capacity to exercise control over one’s actions such that one could be morally responsible for them. We distinguish two dimensions:  
     - *Leeway*: The ability to do otherwise under identical prior conditions.  
     - *Sourcehood*: The property of an action originating from the agent in a way that makes the agent its ultimate author.  
  2. **Moral responsibility**: The status of an agent being an appropriate target of reactive attitudes (e.g., blame, praise) or sanctions (e.g., punishment, reward) based on their actions or character.  
  3. **Basic desert**: A non-consequentialist ground for moral responsibility; an agent deserves praise or blame purely based on their action’s moral quality, independent of societal benefits.  
  4. **Leeway**: The existence of genuinely open alternatives accessible to the agent at the point of choice.  
  5. **Sourcehood**: The condition that an action’s causal history traces ultimately to the agent, not solely to factors beyond their control (e.g., fate, external manipulation).  
  6. **Reasons-responsiveness**: A dispositional capacity to recognize, weigh, and act upon relevant moral and practical reasons across a range of counterfactual scenarios.  

  *Diagnosis of Past Disputes*: We agree that historical disagreements often turned on equivocal uses of "free will" (e.g., leeway vs. sourcehood). Residual disagreements are substantive, not verbal, and center on whether determinism precludes sourcehood (§3).  

  #### Agreed Claims  
  1. **Determinism’s implications**: Determinism entails that every event (including decisions) is causally necessitated by prior states and laws of nature. It does not entail fatalism, coercion, or the absence of deliberative agency.  
  2. **Frankfurt cases**: These show that leeway is unnecessary for moral responsibility. An agent without alternatives can be responsible if they act from their own reasons-responsive mechanism. However, Frankfurt cases do not resolve whether determinism undermines sourcehood.  
  3. **Manipulation arguments**: They successfully demonstrate that covertly engineered agents (e.g., via brainwashing) lack moral responsibility due to compromised sourcehood. They fail to prove that ordinary deterministic causation is *equivalent* to manipulation.  
  4. **Indeterminism**: If human decisions involve indeterministic noise (e.g., random neural events), this would not confer sourcehood or responsibility. Such randomness could undermine control without adding agential authorship.  
  5. **Reasons-responsiveness as a criterion**: It is necessary for moral responsibility. Agents incapable of responding to reasons (e.g., severe psychosis) are not responsible. Reasons-responsiveness may be present in deterministic worlds.  

  #### Disagreements  
  The table below phrases each position as its proponent would endorse it.  

  | Issue | Reasons-Responsiveness Compatibilist Position | Hard Incompatibilist Position |  
  |-------|-----------------------------------------------|--------------------------------|  
  | **Sourcehood under determinism** | Determinism is compatible with sourcehood. An agent is the source of their action if it issues from their reasons-responsive mechanism, even if determinism shaped that mechanism. | Determinism precludes sourcehood. If an agent’s choices are determined by factors beyond their control (e.g., heredity, environment), they cannot be the ultimate author of those choices. |  
  | **Moral relevance of manipulation vs. ordinary causation** | There is a morally relevant difference between covert engineering and ordinary deterministic causation: Manipulation bypasses or subverts the agent’s reasons-responsive capacities, while ordinary causation (e.g., upbringing) cultivates them. This difference justifies holding ordinary agents responsible. | There is no morally relevant difference for basic desert. Both manipulation and ordinary causation determine the agent’s traits and choices via uncontrollable factors. Neither grants the ultimacy required for desert-based responsibility. |  
  | **Sufficiency of reasons-responsiveness** | Reasons-responsiveness is sufficient for basic-desert moral responsibility in deterministic worlds, provided the agent’s history lacks manipulation (§2.3). | Reasons-responsiveness is insufficient for basic desert. Without indeterministic sourcehood, it merely reflects how external factors determine the agent’s dispositions. |  
  | **Role of alternative possibilities (leeway)** | Leeway is irrelevant to moral responsibility. Frankfurt cases show responsibility depends solely on the actual sequence of agential control. | Leeway, while unnecessary per Frankfurt cases, is symptomatic of the deeper problem: Determinism denies agents any robust control, rendering responsibility impossible. |  

  #### Cruxes  
  We identify the following subquestions as pivotal. For each, we specify a test and record our advance predictions.  

  1. **Crux: Continuum of manipulation cases**  
     - **Test**: A spectrum of agents:  
       - (A) *Direct control*: Every choice dictated in real-time by a hidden designer.  
       - (B) *One-time engineering*: Values/desires set at birth; no further intervention.  
       - (C) *Ordinary determinism*: Shaped by heredity/upbringing; no manipulation.  
       Participants judge moral responsibility at 10 equidistant points on the A–C continuum.  
     - **Agreed evidentiary standard**: A "stable" judgment pattern shows consistent principles; "unstable" patterns reveal ad hoc adjustments. Evidence against a view arises if its proponents’ judgments shift without principled justification at the predicted point.  
     - **Predictions**:  
       - *Compatibilist*: Predicts incompatibilists will judge non-responsibility for all cases (A–C) but face pressure to concede B/C are indistinguishable, forcing instability at B→C.  
       - *Incompatibilist*: Predicts compatibilists will judge non-responsibility for A and responsibility for C, but their distinction between B and C will be unstable (B→C shift appears arbitrary).  

  2. **Crux: Criteria for "bypassing" agential capacities**  
     - **Test**: Cases where manipulation *enhances* reasons-responsiveness (e.g., neuroscientists optimize an agent’s reasoning skills). Does this mitigate responsibility-undermining effects?  
     - **Agreed bearing**: If compatibilists judge such agents non-responsible, it affirms sourcehood matters independently of reasons-responsiveness. If incompatibilists concede partial responsibility, it suggests reasons-responsiveness has moral weight.  
     - **Predictions**:  
       - *Compatibilist*: Will judge non-responsibility; manipulation’s bypassing of agential history cannot be redeemed by outcomes.  
       - *Incompatibilist*: Will judge non-responsibility; enhancement changes nothing about sourcehood defects.  

  3. **Crux: Empirical findings on self-authorship**  
     - **Test**: Neuroscience/psychology studies probing whether humans exhibit "self-forming" actions (e.g., value-shifts not determined by prior causes).  
     - **Agreed bearing**: Robust evidence of non-random, indeterministic self-formation would challenge compatibilism; its absence would challenge incompatibilism.  
     - **Predictions**:  
       - *Compatibilist*: Predicts no such evidence will emerge; self-authorship is compatible with determinism.  
       - *Incompatibilist*: Predicts evidence will show all "self-formation" is either determined or random, never sourcehood-granting.  

  #### Closing Paragraph  
  We concur that advancing this debate requires moving beyond abstract arguments to testable claims. Specifically, empirical work on the continuum cases (§4.1) could reveal whether responsibility judgments track principled distinctions or collapse under scrutiny. Neurocognitive research on self-authorship (§4.3) might clarify if sourcehood is feasible. Crucially, both sides must engage with how ordinary people conceptualize control and desert—not to defer to intuition, but to stress-test theories against patterns of judgment. We commit to jointly designing such studies, as their outcomes could compel one or both of us to revise our positions. What will not move the debate is rehashing whether determinism "allows" control; progress hinges on clarifying what control is and whether any real-world system instantiates it.
