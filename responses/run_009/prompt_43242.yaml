answer: |-
  Here's your 20-minute discussion plan, ready for your Notes app (430 words):

  **Goal:** Clarify sunk cost fallacy ≠ "always quit sunk things," show when persistence *is* rational, frame our arm decision better.

  **1. Hook & Define Sunk Cost (3 min):**
  *   "We all know the feeling: grinding a video game level for *hours*, dying near the end. Do you keep trying *just* because of the time spent? That time is gone – that's a **sunk cost**. The *only* question is: *From now on*, will finishing be worth the *future* time/effort?"

  **2. Classic Fallacy Example: Quitting IS Rational (4 min):**
  *   **Scenario:** You pre-ordered a $60 game. Reviews drop – it's terrible. You haven't opened it.
  *   **Sunk Cost:** $60 (gone whether you play or not).
  *   **Decision:** Play it? *Only* if the *future* fun outweighs the *future* hours wasted. If not, quit! Playing *just* to "get your money's worth" after knowing it's bad? **That's the fallacy.** You lose more time *and* have a bad experience.

  **3. The Twist: When Persistence IS Rational (The "Not Always" Part) (5 min):**
  *   **Same Scenario, BUT:** You pre-ordered the $60 game. Early reviews are bad, *BUT* you discover it has a unique mechanic *crucial* for an esports tournament you're practicing for. Mastering it could win you $500+ and rep.
  *   **Sunk Cost:** Still $60 (gone).
  *   **Decision:** Now? The *future* benefit (prize money, skill, reputation) *might* justify the *future* grind, *despite* the sunk cost. The sunk cost didn't *cause* the persistence; the *new future potential* did. Persisting isn't *because* of the sunk cost, it's *for* the future gain the sunk cost accidentally put you near.

  **4. The CRITICAL Distinction (3 min):**
  *   **Conflated Ideas:** "We spent 4 months" (sunk cost) vs. "Therefore we *must* finish" (fallacy) vs. "Finishing *might* be best *for future reasons*" (potentially rational).
  *   **Key Question:** **"Ignoring the past time/money, what do we expect to *gain* by continuing *from this point forward*, and is that worth the *future* effort/time/risk?"**
  *   **Misconception Head-off (Here!):**
      *   *"But the sunk cost means we wasted stuff!"* -> Yes! But that waste is done. This decision is *only* about the future. (Link back to game example).
      *   *"A rational person never looks back!"* -> False! Looking back *for lessons* is smart. Basing a *future* decision *only* on the sunk cost is irrational.

  **5. Apply to Our Arm (3 min):**
  *   "So, for our arm: The past 4 months? Sunk. Gone. Can't get it back."
  *   "The *only* question is: **Looking *only* at the *future* effort to finish Lead's design vs. switching to the Freshman design:**
      *   What's the *expected future time* to finish each?
      *   What's the *expected performance* of each *when done*?
      *   What's the *risk* of failure/delay for each path *from now on*?
      *   Are there *future* team trust/skill benefits *specifically* tied to finishing one path? (Be honest!)."
  *   "If finishing Lead's design wins *on these future factors*, it's rational! If switching wins, sticking *just* because of the 4 months is the fallacy."

  **6. Skip:** Complex EV math, business jargon, blaming individuals.

  **7. Closing Question (Check Understanding) (2 min):**
  *   **"For *either* decision (stick or switch), what is ONE piece of *new information* about the *future* (not the past 4 months) that would make that decision clearly the rational one?"**
      *   *(e.g., "Sticking is rational if we discover Lead's design is actually 90% done and solves a major scoring problem the freshman one can't." / "Switching is rational if testing shows the freshman arm is competition-ready in 2 hours and ours needs 40+ more hours with high failure risk.")*

  **Remember:** Frame it as "How do we make the *best* decision moving forward?" not "Lead is wrong." Stay neutral, focus on the *logic* of future choices. Good luck!
