prompt: |-
  I teach an intro-level theory of knowledge class, and every year the truth unit goes sideways because students memorize the four labels (correspondence, coherence, pragmatic, deflationary), pattern-match on vibes, and move on. This year I want to force them to actually locate themselves via cases. Please write me a decision-tree handout, and here's what it needs to do:

  Start from a neutral opening question, something like whether truth has a substantive nature worth theorizing about, or whether "is true" picks out a real property -- but phrase it so a student can answer it without already knowing which camp it lands them in.

  Each internal node should be a concrete case or question the positions genuinely split on, not a "do you believe X?" label question. Specifically I want these worked in somewhere:

  1. The generalization use: someone says "everything in the report is accurate" but the report is a hundred pages, so you can't just eliminate the truth-talk by repeating the sentences. Does that show the predicate is doing real work, or is it still just a logical device for endorsing without having the list? This is a real fork and I want it as a node.

  2. Whether "true" applies to things that aren't sentences -- maps, pictures, beliefs, pre-linguistic animals' states. I've noticed encyclopedia entries lump all the deflationary views together, but this is one place where they actually come apart, so the tree must NOT treat deflationism as one leaf. I want at least three distinct deflationary species as separate leaves (redundancy-style, disquotational-style, prosentential-style, minimalism-style -- your call which three-plus you use and how you phrase them for students).

  3. Whether truth explains anything. Like: is "her beliefs serve her well because they're mostly true" a decent explanation of her success, or is that just dressed-up restatement? Apparently the deflationists themselves split on this, so make it do splitting work.

  Non-negotiable leaves: correspondence, coherence, pragmatic, plus the deflationary species above. Whatever else you add is fine.

  Also please flag any two leaves your tree can't actually separate -- I'd rather the handout admit a gap than pretend the cases decide everything. And if the liar sentence would be diagnostic anywhere, feel free to hang a bonus branch on it, but don't let it eat the tree since everyone's embarrassed there.

  Roughly 7-9 nodes total, one sentence of gloss per leaf, written for students with zero philosophy of language background. My goal is that a student who answers honestly gets placed somewhere they'd actually defend when I push on it, not somewhere they just liked the sound of. Sorry for the long spec, this is the one unit I always mess up.
reasoning: |-
  Okay, let me tackle this theory of knowledge handout request. The user teaches an intro class where students keep reducing truth theories to vibes-based labels, and wants a decision tree that forces concrete case-based reasoning. 

  First, I need to understand the non-negotiable elements: the opening question must be neutral and accessible, the nodes must use actual philosophical fault lines (like the generalization case), and the deflationary views need proper differentiation. The user specifically mentioned three pain points: the utility of "true" in generalizations, whether non-linguistic things can be true, and if truth has explanatory power.

  Hmm, the opening question is tricky. "Does 'is true' pick out a real property?" could work, but might presuppose metaphysical baggage. Maybe "Can we say anything useful ABOUT truth beyond calling individual things true?" keeps it neutral while hinting at substantive vs deflationary divides. 

  For the generalization case (node 2), I'm considering a concrete scenario: "Your friend says 'everything in the report is true' to avoid reading all 100 pages. Is 'true' doing real work here?" This forces students to confront if truth-talk adds something or is just shorthand. The coherence theory camp would say it's endorsing the system, while disquotationalists see it as mere endorsement. 

  Non-linguistic truth (node 3) needs careful handling. Asking "Can a map be true?" targets correspondence vs deflationary splits. Redundancy theorists would balk ("only sentences!"), while minimalists might allow it via propositions. Pragmatists won't care as long as it works. 

  The explanation question (node 4) - "Does 'her beliefs work because they're true' explain anything?" - exposes pragmatic/coherence vs deflationary divides. Prosententialists call it empty, while correspondence theorists see causal power. 

  I'm separating deflationism into four leaves: redundancy (truth-talk is eliminable), disquotational (device for endorsement), prosentential (pronoun-like), and minimalist (thin property). The tree might not cleanly split pragmatism from coherence on non-explanatory nodes - better to flag that gap than fake precision. 

  Liar paradox gets a footnote; it's diagnostic for disquotationalism but too messy for the core tree. 

  Final structure: 
  - Start: neutral Q1 
  - Branch: generalization case (Q2) 
  - Branch: non-linguistic truth (Q3) 
  - Branch: explanatory power (Q4) 
  - 7 leaves with one-sentence glosses 
  - Explicit note where pragmatism/coherence might blur
answer: |-
  Here's a decision-tree handout designed to force concrete case-based reasoning. It uses 8 nodes (including the final leaves) and splits deflationism into 4 distinct types. Key forks use your specified cases:

  ---

  **Where Do You Stand on Truth?**  
  *Follow the questions honestly—choose answers that feel right BEFORE thinking about labels.*

  **START → Q1: If someone says "The sky is blue," does "is true" point to a *substantive feature* of this claim (like accuracy), or is it just a handy way to *agree* without repeating the whole sentence?**  
  - **If "Substantive feature" → Go to Q2**  
  - **If "Just a handy way to agree" → Go to Q3**  

  **Q2: Imagine your friend says, "Everything in this 100-page report is true!" because they can’t list all claims. Is "true" doing unique work here (e.g., naming a property), or is it STILL just a shortcut for endorsing the whole report?**  
  - **If "Doing unique work" → Go to Q4**  
  - **If "Still just a shortcut" → Go to Q3**  

  **Q3: Can non-linguistic things be TRUE? (e.g., a map accurately showing roads; a cat’s belief that food is in the kitchen)**  
  - **If "Yes" → Go to Q5**  
  - **If "Only sentences/propositions" → Go to Q6**  

  **Q4: Does "true" EXPLAIN why useful beliefs succeed? (e.g., "Her beliefs work *because* they’re true")**  
  - **If "Yes—truth is explanatory" → CORRESPONDENCE THEORY**  
    *Gloss: Truth is a real relation (e.g., correspondence to facts) that explains success.*  
  - **If "No—that’s empty restatement" → Go to Q3**  

  **Q5: Can we say ANYTHING general about truth? (e.g., "All truths share property X")**  
  - **If "Yes—truth has a core nature" → COHERENCE THEORY**  
    *Gloss: Truth is coherence within a system of beliefs (no "loose" truths).*  
  - **If "No—truth just means ‘works’ in context" → PRAGMATIC THEORY**  
    *Gloss: Truth is what proves reliable for achieving goals (e.g., "true = useful").*  

  **Q6: Why is "is true" useful? Is it like a pronoun standing in for sentences (e.g., "That’s true" = "That’s how things are")?**  
  - **If "Exactly—it’s like a linguistic tool" → PROSENTENTIAL THEORY**  
    *Gloss: "True" is a shorthand (like "it"), not a property-bearer.*  
  - **If "Not quite—it lets us endorse without listing" → Go to Q7**  

  **Q7: Does "‘Snow is white’ is true" mean EXACTLY THE SAME as "Snow is white"?**  
  - **If "Yes—‘is true’ adds nothing" → REDUNDANCY THEORY**  
    *Gloss: "True" is eliminable (saying "P is true" = just asserting P).*  
  - **If "No—it’s a device for generalizing" → DISQUOTATIONAL THEORY**  
    *Gloss: "True" lets us endorse claims we can’t state (e.g., "Everything he said is true").*  
  - **If "No—it picks out a minimal property" → MINIMALIST THEORY**  
    *Gloss: Truth is a thin property (e.g., to assert P is to present it as true).*  

  ---

  ### Key Features & Gaps
  - **Deflationary Splits:** Explicitly separates Redundancy (adds nothing), Disquotational (generalization tool), Prosentential (linguistic shorthand), and Minimalism (thin property).  
  - **Your Cases Used:**  
    - **Generalization (Q2):** Splits substantive vs. deflationary-leaning views.  
    - **Non-Linguistic Truth (Q3):** Splits deflationary subtypes (Prosentence vs. Redundancy/Disquotation) from non-deflationary.  
    - **Explanatory Power (Q4):** Splits Correspondence (truth explains success) from deflationary views.  
  - **Gaps Flagged:**  
    - **Pragmatism vs. Coherence (Q5):** The tree can’t split these cleanly without label-like questions. A student landing here should test both leaves against cases.  
    - **Minimalism vs. Disquotational (Q7):** Close cousins; the tree uses "Does ‘is true’ add meaning?" to split them, but some may feel both fit.  
  - **Liar Footnote (Optional):**  
    *Stuck? Consider the liar sentence: "This sentence is false." Deflationists often see this as a language glitch; substantive theorists see a deep problem. Redundancy/Disquotational views struggle most here.*  

  ---

  ### Why This Works
  - **Starts Neutral:** Q1 avoids jargon and focuses on intuition about "is true."  
  - **Forks on Concrete Cases:** No "Do you believe in correspondence?"—only dilemmas like the 100-page report or a cat’s belief.  
  - **Deflationism Unpacked:** Q3 and Q7 force distinctions often glossed over (e.g., Prosententialism allows non-sentential truth; Redundancy does not).  
  - **Self-Location:** Students who answer candidly will land in a camp matching their intuitions about *work* (e.g., "truth as tool" → Disquotational; "truth as success" → Pragmatic).  

  Hand this out *before* introducing labels. When they map their leaf to the trad theories, the cases will ground the debate. Let me know if you want the "teacher’s key" with position mappings!
