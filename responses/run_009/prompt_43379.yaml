  The challenge is maintaining rigor. For instance, equating presentism to first-person present tense seems intuitive but risks oversimplification – after all, even in present tense, the narrator often references past/future. Eternalism mapping to fixed publication feels cleaner, but then how do we handle drafts? The user's point about revision creating "openness" is crucial here – if a draft's past can be rewritten, does that truly mirror presentism's ontological fluidity, or is it just a contingent human process? 

  I notice they're particularly sharp on meta-awareness. When they call out "smuggling in author-as-god," they're anticipating lazy analogies. So I must flag where the storyteller frame adds foreign elements – like how an author's "eternal" view still occurs within their present moment of writing, which philosophers might call a category error. 

