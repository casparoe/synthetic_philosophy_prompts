prompt: |-
  My friend is basically a Pinker-style declinist: he thinks the evidence that violence has declined massively over human history is about as good as historical evidence gets -- falling homicide rates, battle deaths per capita, torture and cruel punishments becoming unthinkable, etc. I'm the designated skeptic in our group: my line is that the whole story depends on contestable choices about what even counts as violence (structural violence, famines under colonial or sanctions regimes, deaths from displacement that don't show up as "killings"), whether per capita is the right denominator when the absolute number of victims can keep rising, and whether "violence over all of human history" is one trend line or a bunch of disconnected ones we've strung together. We've argued past each other for like a year and want to try an adversarial collaboration. Draft the joint statement we should produce: the claims we could both actually sign our names to (including about what the least controversial data series do show), the disagreements written so that each of us would accept the phrasing of our own view, the cruxes -- I suspect one is whether "violence" can be operationalized at all without smuggling in the conclusion, and another is which baseline you measure decline *from* -- and for each crux, a concrete piece of evidence or analysis we'd both agree bears on it, with each side's prediction recorded in advance. If you think part of our dispute is just verbal, say which part and why. Format as a numbered agreed-claims section followed by a disagreements/cruxes table.
