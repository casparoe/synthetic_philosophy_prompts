prompt: |-
  I keep going back and forth on gambles where expected value breaks down, and I've decided the way to settle it is to just write down my gut verdicts on a bunch of cases and see whether there's a principle underneath them. So here they are.

  1. The classic St. Petersburg setup: fair coin, pot starts at $2 and doubles every time heads comes up, game ends on tails, I get the pot. My verdict: I wouldn't pay more than $20 to play, probably less, even though the "expected value" is infinite. Fine, I'm risk averse, whatever.

  2. Here's the twist, the Pasadena-style version. Same coin, but now the payoff I recieve alternates sign depending on the parity of the flip count, with magnitudes that grow like 2^n over n, so the series of possible payoffs, summed in the natural order, is one of those series that only converges conditionally — rearrange the terms and you can make it "equal" basically anything you like. My verdict: I won't play this even for free. It feels like being asked to sign a contract with no price on it.

  3. The Altadena version: exactly the same game as 2 but every payoff doubled. Every single outcome is at least as good as in game 2, most strictly better. My verdict: sure, Altadena is strictly better, I'd take it over Pasadena if forced. But I wouldn't pay more than a couple dollars extra for it, and honestly if both were offered free side by side I'd have to stand there and think, which bugs me, because dominance should make that a no-brainer.

  4. A Pasadena-type game where the negative payoffs are capped at $5 but the positive ones still alternate and blow up. My verdict: play it for free gladly, and I'd even pay a small entry fee. So "undefined" is apparently fine with me as long as the downside is small.

  5. A ticket costing $10 that pays $10^50 with probability 1 in 10^40. Expected value is astronomical and perfectly well defined. My verdict: hard no. And I genuinely can't tell whether this is the same "no" as in case 2 or a different one.

  6. The one I keep going back and forth on: I already own a St. Petersburg ticket (game 1, to be played tonight), and someone offers to buy it off me for $30. Selling feels foolish, holding out for more feels like I'm being suckered by my own math — since I wouldn't pay $30 to play it, shouldn't I be delighted to sell it at $30? But I'm not delighted. I'm not even sure I'd sell.

  Is there one principle that gets all six? If not, say which of my verdicts has to go, and whether the repaired principle gives an answer on a case I haven't listed — for instance, a casino that lets me choose, before the coin is flipped, the order in which the conditional series gets summed for a Pasadena game. Lead with the bottom line in your first sentence (one principle, or no), then the reasoning, and no preamble or restating my question.
reasoning: |-
  Okay, the user is grappling with decision-making in gambles where expected value breaks down. They've listed six scenarios with their gut reactions, seeking a unifying principle. Let me start by understanding each case.

  First, St. Petersburg: infinite EV but unwilling to pay over $20. Risk aversion makes sense here. Then Pasadena: conditional convergence, won't play for free. The issue here isn't just risk but the undefined expected value. Altadena is better but still problematic—dominance suggests preference, but the user hesitates. Capping negatives in Pasadena makes it acceptable, showing that bounded downside helps. The low-probability high-reward ticket is a hard no, similar to Pasadena's undefined EV but also due to near-impossible odds. Owning a St. Pete ticket and refusing $30 sale seems inconsistent since they wouldn't pay $30 to play. 

  The key insight is distinguishing between risk aversion and undefined expectations. Cases 1 and 5 involve defined EV but extreme skew or low probability, leading to risk-averse rejection. Cases 2, 3, and the hesitation in 4 stem from undefined EV. The user's discomfort in Altadena (case 3) despite dominance might be because both have undefined EV, making comparison tricky. Selling the ticket (case 6) feels wrong because ownership changes the reference point—loss aversion kicks in. 

  So the unifying principle is two-fold: defined negative outcomes must be bounded, and undefined expectations are unacceptable unless controlled. This explains rejecting Pasadena (undefined), accepting capped negatives (bounded downside), and refusing the $10^50 ticket (defined but unrealistically low probability). The ticket sale reluctance is loss aversion overriding prior risk aversion. 

  For the casino letting you choose summation order, the principle would reject it because controlling the order doesn't bound the downside—it just manipulates the undefined EV. Even with choice, the risk remains unbounded, so it's still unacceptable. The user's core issue is needing certainty in potential losses, whether through bounded downside or defined EV.
answer: |-
  **No single principle covers all six; the verdict on case 3 must go.**  

  **Reasoning:**  
  Your responses reflect two distinct principles:  
  1. **Risk aversion over extreme positive skews** (cases 1, 5, and 6): You reject gambles with astronomically high variance despite positive EV (e.g., St. Petersburg or the $10^{50}$ ticket) because the near-certainty of negligible payoffs outweighs tiny chances of huge gains.  
  2. **Rejection of undefined/ill-controlled negative outcomes** (cases 2, 3, and 4): You refuse Pasadena/Altadena not due to risk aversion, but because their conditionally convergent payoffs lack a coherent expected value. Capping negatives (case 4) resolves this by bounding downside risk, making the gamble acceptable.  

  **Conflict in case 3:** Your hesitation in choosing free Altadena over free Pasadena violates strict dominance. Altadena *always* pays at least as much as Pasadena (and more in some outcomes). If undefined EV is the core issue, dominance should compel immediate preference for Altadena—its payoffs are strictly better yet identically structured. Your "standing there thinking" suggests an inconsistent application of dominance when EV is undefined.  

  **Resolution:**  
  - **Repaired principle:** *Accept gambles only if (a) expected value is well-defined and acceptable relative to risk, or (b) negative outcomes are bounded and acceptable, even if EV is undefined.*  
  - **Case 3 verdict must change:** You *should* strictly prefer free Altadena over free Pasadena (dominance holds). Your reluctance stems from misapplying "undefined EV" anxiety to a dominated choice.  
  - **New case (casino choice):** A casino letting you choose the summation order for Pasadena payoffs *would still be rejected*. While you could force a finite "EV" via ordering, the actual gamble’s payoffs remain unchanged and unbounded below. Your principle (b) requires bounded negatives—which this violates.  

  **Why other cases hold:**  
  - **Case 1:** Defined but infinite EV → risk aversion justifies $20 cap.  
  - **Case 2:** Undefined EV + unbounded negatives → rejection.  
  - **Case 4:** Undefined EV but capped negatives → acceptance.  
  - **Case 5:** Defined EV but pathological risk profile → rejection.  
  - **Case 6:** Owning the ticket creates a "loss frame"; refusing $30 is consistent with risk aversion if you value the *option* of a huge payoff more than the certainty of $30.  

  ---  
  **Key insight:** Your intuition separates "risk" (handled via aversion) from "ambiguity of value" (handled via rejection unless downsides are controlled). Case 3 fails because dominance trumps ambiguity when payoffs are directly comparable.
