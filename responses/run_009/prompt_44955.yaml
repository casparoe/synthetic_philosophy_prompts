  But I suspect the real issue might be deeper - perhaps an unresolved tension between two legitimate perspectives on scientific explanation that can't be fully reconciled. The reductionists want causal-mechanistic rigor while functionalists care about pattern recognition across systems. Both matter, but they pull in different directions.

