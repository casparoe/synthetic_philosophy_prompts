prompt: |-
  I teach a second-year ethics course with a unit on moral judgment and its history, and I'm drafting the final exam while our external examiner reviews the paper. Last year's question on the 'man of his time' defence was, frankly, a disaster: students simply recited the standard back-and-forth — someone says we shouldn't judge Jefferson or Churchill by today's standards, someone replies that abolitionists existed then too, done — and the marks didn't discriminate between students who understood the issue and students who had memorised the labels. This year I want a question that forces them to actually do some philosophy.

  Here's the structure I'd like you to fill in. The exam question should centre on a composite, fictional figure — call him Havelock Grant — who in the 1910s campaigned for old-age pensions, prison reform, and women's suffrage, and who also publicly endorsed compulsory sterilisation of people he described as 'feeble-minded' and campaigned to exclude non-white immigrants. The university is deciding whether to keep his name on a building, and a committee member has offered the 'man of his time' defence on his behalf. The question must make students (a) distinguish the explanatory use of historical context from its justificatory or excusatory use, (b) confront the fact that the defence proves either too much or too little: if it excuses Grant's eugenics because many contemporaries shared it, then whether abolitionists existed in 1820 or anti-eugenics voices existed in 1915 should matter, and students must say exactly why or why not, and (c) apply their verdict to a forward-looking case: our grandchildren judge us as we judge Grant, and at least one currently mainstream practice — students should choose their own candidate, though industrial animal farming is the obvious one — strikes them as obviously monstrous. Does a student who accepts the defence for Grant have the resources to resist a parallel 'woman of her time' defence offered on her own behalf, or does consistency require her to accept it? The question should be answerable in 75 minutes.

  Please give me three things: the exam question itself, as it would appear on the paper, including the Grant case written out as a brief scenario; a model answer of roughly 650 words that resolves the question rather than merely surveying positions — I want to see what a committed, defensible answer looks like, not a balanced 'on the one hand' mush; and a marking scheme built around five must-hit points worth 4 marks each (total 20), where for each point you name the specific move a top answer must contain, the weaker version that should earn a B but not an A, and a one-line note on how students typically fumble it. One constraint on the marking scheme: the A/B distinction should turn on whether students can state a principled criterion for when prevailing-norm facts mitigate blame — something like a visibility or availability-of-moral-argument condition — rather than merely gesturing at 'context matters'. I'd rather the criterion be one the students have to construct in the exam than anything we covered in lectures, since that's precisely what last year's paper failed to test.
reasoning: |-
  Okay, the user is an ethics professor frustrated with previous exam questions that led to superficial answers. They want a new question that forces deeper philosophical engagement. Let me unpack their requirements carefully.

  First, the core problem: Last year's "man of his time" question resulted in students mechanically repeating debates without true understanding. The professor wants to avoid this by creating a fictional composite figure (Havelock Grant) with morally contradictory positions. The question must push students to:
  - Separate explanatory vs justificatory uses of historical context
  - Analyze why the "prevailing norms" defense fails logically (it either excuses everything or nothing)
  - Apply the reasoning to a future case about current practices like factory farming

  The professor emphasizes three non-negotiables: 
  A principled criterion for when context mitigates blame (not covered in lectures)
  Forward-looking application to current practices
  Avoidance of "on the one hand" mushy answers

  Hmm... The marking scheme is particularly revealing. They want five clear evaluation points where A-grade answers must construct an original visibility/availability criterion. This suggests they're tired of students parroting lecture material without critical thinking.

  For the fictional figure, Grant needs to embody moral contradictions that prevent easy categorization - progressive on some issues (pensions, suffrage) but regressive on others (eugenics, racism). The 1910s setting is perfect because eugenics was then considered "scientific" while abolitionist analogies existed.

  The forward-looking component is brilliant - it forces students to confront their own potential moral blind spots. Factory farming is a smart default example because it's widely accepted yet philosophically contentious.

  For the model answer, I'll need to demonstrate:
  1) Rigorous separation of explanation vs justification
  2) The "proves too much/too little" paradox using Grant's contemporaries
  3) Construction of a moral visibility criterion
  4) Consistent application to future grandchildren scenario
  5) Willingness to condemn current practices if consistency demands it

  The marking scheme should mirror this structure. Each of the five 4-point criteria will target a specific intellectual move, with clear differentiation between A (constructs criterion), B (identifies problem but no criterion), and C (superficial) responses.

  Notably, the professor wants students to build the visibility criterion during the exam - that's the key innovation over last year's failure. The model answer should therefore invent a "reasonably visible counter-arguments" standard rather than recycling existing frameworks.

  For the future application, I'll have the model answer explicitly state that consistency requires accepting grandchildren's judgment on factory farming - no comfortable escapes. This meets the professor's request for a "committed" position.

  The word count is tight (650 words for model answer) so every sentence must advance the argument. I'll use Grant's suffrage support to show how visibility of counter-arguments existed even within his reform circles.

  Final challenge: The exam question phrasing must force all required elements while fitting a 75-minute response. I'll open with the Grant scenario, then pose three layered sub-questions that map to the professor's (a)(b)(c) requirements, ending with the consistency challenge about future judgments.
answer: |-
  Here is the complete exam package designed to meet your specifications, focusing on philosophical construction over recitation:

  **Exam Question (as it would appear on the paper):**

  > **Section C: Historical Judgment and Moral Responsibility (Answer ONE Question)**
  >
  > **Question 3: The Case of Havelock Grant**
  >
  > Havelock Grant (1878-1945) was a prominent public intellectual and reformer in the early 20th century. During the 1910s and 1920s, he actively campaigned for progressive causes including universal old-age pensions, significant prison reform, and women's suffrage. However, Grant also publicly advocated for the compulsory sterilization of individuals he termed "feeble-minded" and led campaigns to exclude non-white immigrants, arguing these policies were necessary for national improvement.
  >
  > Grantview University is currently debating whether to remove Grant's name from its main library building. During committee discussions, one member argues: "We must understand Grant as a man of his time. While his views on eugenics and race are repugnant to us now, they were unfortunately commonplace and even scientifically endorsed by many educated people of his era. Judging him by our contemporary standards is therefore unfair and anachronistic."
  >
  > Critically evaluate this 'man of his time' defence. In your answer, you must:
  >
  > 1.  Clearly distinguish between using historical context to *explain* Grant's views and using it to *justify* or *excuse* them.
  > 2.  Analyze whether the existence of contemporaries who *rejected* eugenics and racial exclusion (such as some fellow suffragists, socialists, or religious figures) is relevant to Grant's moral culpability. Explain precisely why the 'man of his time' defence, if it relies on the prevalence of a view, faces a dilemma: it either excuses too much (making moral progress impossible) or excuses too little (if we require awareness of *all* counter-arguments).
  > 3.  Construct a principled criterion for when knowledge of prevailing norms *does* legitimately mitigate blame for holding morally wrong views.
  > 4.  Apply your analysis to a forward-looking concern: Imagine your grandchildren condemn a practice common in our society today (e.g., industrial animal farming, though you may choose another plausible example) as obviously monstrous. If you accept the 'man of his time' defence for Grant, does consistency require you to accept a parallel 'woman of her time' defence for yourself regarding this practice? Or do you have the resources to resist it? Justify your answer rigorously using the criterion you developed.

  ---

  **Model Answer (Approx. 650 words):**

  The 'man of his time' (MOT) defence, as offered for Havelock Grant, fundamentally confuses historical explanation with moral justification or excuse. Grant's historical context *explains* why he held abhorrent views on eugenics and race; it reveals the intellectual climate, prevailing scientific (though flawed) theories, and social pressures that shaped his perspective. This explanatory function is crucial for historical understanding. However, explanation is not absolution. To use this context to *justify* his views implies they were morally acceptable then, which is false. To use it to *excuse* him implies he couldn't reasonably have known better or been expected to act differently, which requires further argument.

  The MOT defence faces a crippling dilemma when probed. If it excuses Grant *simply because* his views were common among his peers, then it proves too much. In any era, including those practising chattel slavery or genocide, the perpetrators could claim the defence if their views were prevalent. This renders moral condemnation of historical figures incoherent and makes moral progress inexplicable – if widespread acceptance excuses, then no widely held view could ever be wrong. Conversely, if the defence requires that Grant should have known his views were wrong *despite* their prevalence, it proves too little. We cannot demand omniscience or awareness of every fringe critique. The mere *existence* of abolitionists in 1820 or anti-eugenicists in 1915 (like some socialists, dissenting scientists, or figures within the suffrage movement Grant himself supported) doesn't automatically mean Grant *should* have known better. What matters is not just existence, but the **reasonable visibility and accessibility of cogent moral counter-arguments** within his epistemic environment.

  This leads to the core criterion: **Moral culpability for holding a prevalent but wrong view is mitigated only if compelling counter-arguments or alternative perspectives were not reasonably visible or accessible to the agent, given their social position, education, and the channels of information available to them.** Mitigation depends on the *inaccessibility* of the truth, not just its unpopularity.

  Applying this to Grant: As a highly educated public intellectual campaigning for *other* progressive reforms (like suffrage and prison reform), Grant occupied a social position granting access to diverse ideas and debates. Critiques of eugenics and racial exclusion, while minority views, were voiced in intellectual journals, political debates, and even within reform circles he frequented. Fellow suffragists, for instance, sometimes challenged the racial assumptions underpinning immigration bans. While the *scientific* consensus favoured eugenics, *moral* objections based on human dignity, equality, or religious principle were articulated and accessible. Therefore, Grant cannot claim the relevant counter-arguments were invisible or inaccessible to him. His culpability for endorsing these harmful policies is significant, even if mitigated somewhat by the pervasiveness of the ideology. The MOT defence, relying solely on prevalence, fails; the accessibility criterion shows why he *could* and *should* have known better.

  Looking forward, consistency demands we apply the same criterion to ourselves. Consider industrial animal farming (IAF). If our grandchildren condemn it as monstrous, the question is: Are compelling moral counter-arguments to IAF *reasonably visible and accessible* today? The answer is unequivocally yes. Widespread philosophical arguments (utilitarian, deontological, care ethics), scientific evidence of animal sentience and suffering, undercover investigations documenting conditions, and a growing mainstream discourse on animal rights and welfare are widely available through media, academia, and public debate. As educated individuals living in an information-rich society, the moral problems with IAF are readily apparent to anyone who chooses to engage. Therefore, if I accept the MOT defence for Grant (which I reject based on the accessibility criterion), I would *have* to accept the 'woman of her time' defence for myself regarding IAF – because the defence relies on the *excusing* power of prevalent norms. However, since I have argued that prevalence alone doesn't excuse without inaccessibility, and since the counter-arguments to IAF *are* accessible, I must consistently conclude that widespread acceptance of IAF does *not* excuse my participation or support. I am culpable, just as Grant was culpable, because the moral truth about the profound suffering inflicted was and is reasonably knowable.

  ---

  **Marking Scheme (20 marks total, 5 x 4 marks):**

  | **Must-Hit Point (4 marks)**                                 | **A-Grade (4 marks)**                                                                 | **B-Grade (3 marks)**                                                                 | **C-Grade/Distractor (0-2 marks)**                                    | **Typical Fumble**                                                                 |
  | :----------------------------------------------------------- | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **1. Distinguish Explanation vs. Justification/Excuse**     | Clearly & explicitly separates explanatory role of context from justificatory/excusatory role. States explanation ≠ absolution. | Correctly identifies the difference but doesn't explicitly state why confusion is problematic (e.g., doesn't say explanation ≠ justification). | Conflates explanation with justification/excuse or treats context as automatically mitigating. | "The context explains why he thought it was okay, so we can't blame him."          |
  | **2. Analyze Dilemma (Too Much/Too Little) & Relevance of Contemporaries** | Clearly states the dilemma: excuse-by-prevalence excuses all prevalent wrongs (Too Much) OR requires unrealistic awareness (Too Little). Explicitly links existence of critics to the *accessibility/visibility* problem central to the dilemma. | Identifies the dilemma but doesn't fully articulate both horns clearly. Mentions critics exist but doesn't precisely connect this to *why* it creates a problem for MOT (i.e., doesn't pinpoint the accessibility issue). | States critics existed so Grant is blameworthy (or didn't exist so he isn't), without engaging the *dilemma* or the core problem of prevalence vs. access. | "Abolitionists existed, so Jefferson should have known slavery was wrong." (No link to dilemma/criterion) |
  | **3. Construct Principled Criterion for Mitigation**         | Proposes a clear, defensible criterion focused on **accessibility/visibility/reasonable knowability** of counter-arguments (e.g., "...not reasonably visible or accessible..."). Explicitly ties mitigation to the *inaccessibility* of moral truth. | Identifies that "context matters" or "knowledge matters" but offers only a vague or incomplete criterion (e.g., "if he couldn't have known," without defining *how* we judge that). | Gestures vaguely at "context" or "norms" mitigating blame without articulating *how* or *when*. Offers no criterion beyond prevalence. | "If it was normal back then, he's less to blame." (Just prevalence, no accessibility) |
  | **4. Apply Criterion to Grant**                              | Applies the accessibility criterion *specifically* to Grant: Given his position/education/reform circles, cogent counter-arguments *were* accessible, so culpability is high (mitigation weak). | Correctly concludes Grant is blameworthy but applies the criterion weakly or inconsistently (e.g., mentions his position but doesn't explicitly link it to access to counter-arguments). | Judges Grant based on modern standards or personal revulsion without applying the constructed criterion. Relies solely on prevalence or critic existence. | "He was a reformer, so he should have known better." (No link to *accessibility of counter-arguments* to eugenics) |
  | **5. Apply Criterion Forward & Resolve Consistency**         | Applies the *same* accessibility criterion to the chosen current practice (e.g., IAF). **Explicitly states** that counter-arguments *are* accessible now, so culpability remains. **Resolves consistency:** Accepting MOT for Grant *would* force accepting defence for self, but since criterion *rejects* MOT for Grant, it *also* rejects it for self regarding accessible wrongs. | Applies criterion to current practice correctly (accessible -> culpable). Discusses consistency but doesn't explicitly state the *conditional* (if accept MOT for Grant *then* must accept for self) OR doesn't fully resolve why the criterion allows rejecting both. | Discusses future judgment vaguely. Fails to apply the constructed criterion to the current case. Sees inconsistency but doesn't resolve it using the criterion. Avoids committing to own culpability. | "Future people might judge us harshly, but farming is necessary." (No application of criterion, no resolution of consistency) |

  **Rationale for Design:**
  *   **Forces Philosophy:** Requires constructing a criterion (#3), applying it rigorously to a complex case (#4), and confronting its implications for the student's own potential culpability (#5). The dilemma (#2) prevents simple appeals to prevalence or critic existence.
  *   **Avoids Recitation:** The fictional figure prevents memorized Jefferson/Churchill scripts. The requirement to build a criterion not covered in lectures tests original reasoning.
  *   **Focus on Accessibility:** The marking scheme explicitly rewards defining and applying an accessibility/visibility criterion for mitigation (A-grade for #3, #4, #5), moving decisively beyond vague appeals to "context" or mere prevalence (C-grade).
  *   **75-Minute Feasibility:** The layered question guides the answer, and the model demonstrates a concise, argument-driven response within the word limit. Students can focus analysis using the provided structure.
