  Okay, let me unpack this user's legal philosophy dilemma. They're clearly wrestling with the Hart-Fuller debate after a heated family argument, and their case-by-case intuitions reveal a deeper struggle between procedural legitimacy and moral substance. 

  First, I notice their apartheid verdict (1) aligns with Hart's positivist view - it's technically law regardless of wickedness. But their discomfort with Nazi informer cases (2) pulls them toward Fuller's procedural morality. The tension peaks when comparing (2) and (4) - both evil regimes, but they reject Nazi "law" while accepting procedurally-clean tyranny. That procedural distinction feels right to them, yet conflicts with their initial belief that extreme wickedness should negate legality.

  Hmm, their self-proposed "pedigree-plus-escape-hatch" principle is interesting but unstable - case (4) specifically blocks the "evil enough" exception they want. They need either to abandon that exception (Hart) or define procedural thresholds more rigorously (Fuller). The prison gang case (5) exposes another flaw: if law requires only systematic rules, why exclude non-state actors? Their "state monopoly" instinct isn't circular if we frame it as Hart's secondary rules (adjudication/change/recognition) creating institutional authority.

  For the military occupation hypo, I'm leaning toward "not law" - it lacks rule-of-law virtues like generality and institutional continuity. That maintains consistency: procedural defects matter more than wickedness in determining legality. Their intuitions are salvageable if they embrace Fuller's eight ways systems fail as law, while admitting this makes morality relevant only indirectly through procedure.

  User's brother-in-law probably represents natural law立场. Best counter: even if apartheid is "law", calling it such doesn't excuse compliance - that's where moral resistance enters. Their instincts are sharper than they realize; just need to ditch the "evil=non-law" crutch and let procedure do the work.
answer: |-
  Alright, let's dive into your gut reactions. They're actually pretty coherent with a specific strand of legal philosophy, and you're right – you've basically landed on Lon Fuller's side of the Hart-Fuller debate. The principle tying most of your verdicts together is **Procedural Legality** or the **Internal Morality of Law**. Here's the breakdown:

  **Your Principle (Essentially Fuller's):**
  A system counts as law **only if** it meets basic procedural requirements that make it possible for people subject to it to *know the rules and orient their conduct accordingly*. Wickedness, by itself, doesn't negate legality; procedural failure does. Fuller identified 8 ways a system fails to be law:
  1.  **Generality** (Not just one-off commands)
  2.  **Promulgation** (Publicly available)
  3.  **Non-retroactivity** (Prospective, not punishing past acts)
  4.  **Clarity** (Understandable)
  5.  **Non-contradiction**
  6.  **Possibility of Compliance** (Can't command the impossible)
  7.  **Constancy** (Not changing too frequently)
  8.  **Congruence** (Official action matches declared rules)

  **Applying Fuller's Principle to Your Cases:**

  1.  **Apartheid SA:** Meets procedural criteria (published, clear, enforced, prospective). **Verdict: Law (Wicked but Law).** *Fuller & You: Agree.*
  2.  **Nazi Informer Scenario:** Procedural rot is key – retroactive decrees, rules meaning whatever the Party said, lack of constancy, likely lack of congruence (arbitrary enforcement). It fails the internal morality test. **Verdict: Not Law.** *Fuller & You: Agree. The evil is compounded by the procedural failure, making the "statute" not a valid legal rule.*
  3.  **Decent-but-Chaotic:** Violates Clarity and Non-Contradiction badly. BUT, *if* courts are *trying* to apply *some* coherent set of rules derived from the mess (even if inconsistently), there's an *attempt* at legality. It's dysfunctional, borderline, but arguably still within the realm of "law" (albeit terrible law). **Verdict: Law (Bad Law).** *Fuller might be stricter here, leaning towards "not law" if the chaos is total and makes guidance impossible. You're slightly more charitable, but the principle holds - the core failure is procedural chaos, not the substantive decency.*
  4.  **Evil-but-Clean:** Meets all procedural criteria impeccably. **Verdict: Law (Wicked Law).** *Fuller & You: Agree.* This is the *crucial* case that forces you to abandon "evil = non-law". The procedural integrity is what makes it law, however abhorrent. Calling it non-law *is* a cop-out – it *is* law, and recognizing that forces us to confront the moral responsibility of obeying/opposing *wicked laws*.
  5.  **Prison Gang:** This is where Fuller *helps* you avoid circularity. Why not law? Not (just) because it's non-state. Because it **lacks the institutional structure and purpose of a *legal system*.** It's a set of *internal rules* or commands governing a specific, closed group focused on internal order/control (often illicit), not a system purporting to provide general, public order for a society. It likely fails Fuller's criteria regarding generality, promulgation (to the *public*?), and possibly congruence (arbitrary enforcement by gang leaders). Hart's "secondary rules" (rules about rules - recognition, change, adjudication) are likely absent or extremely rudimentary/arbitrary. **Verdict: Not Law.** *Principle: It's a command structure or internal governance, not a legal system aiming for the procedural regularity and public order function of law.*
  6.  **International Law:** Meets *some* procedural criteria (often promulgated, prospective, attempts at clarity). But it famously struggles with Fuller's criteria, especially **Non-Contradiction** (overlapping treaties/custom), **Constancy** (evolving custom), and crucially, **Congruence** (lack of consistent enforcement mechanisms). Hart's "primitive law" analogy fits because it lacks a unified, settled **Rule of Recognition** (secondary rule identifying valid primary rules) and robust adjudication/enforcement. **Verdict: Law, but thin/primitive.** *Principle: It aspires to and partially achieves the procedural legality of a legal system, but its institutional weaknesses mean it doesn't fully meet the criteria.*

  **Reconciling (2) and (4):**
  You nailed it. The difference *is* procedural rot vs. procedural cleanliness. (2) fails as *law* because its procedures are so arbitrary and retroactive that it provides no reliable guide for conduct – the "statute" the informer relied on wasn't a valid legal rule within a system adhering to the internal morality. (4) *succeeds* as law because, however evil, its rules *are* knowable, prospective, and applied as written. Calling (4) non-law because it's evil undermines the crucial distinction between *bad law* and *no law at all*. Evil-but-Clean *is* law, and that's precisely why opposing it requires moral courage against *legal* commands.

  **Your "Pedigree + Escape Hatch" Principle:**
  You're right to be suspicious. Hart's positivism ("law is identified by source/pedigree, not merit") cleanly gets Cases 1, 3 (if sources are identifiable despite chaos), 4, and arguably 6. But it struggles with your intuitive rejection of (2) – the Nazi statute *had* a pedigree (enacted by the regime). Hart would likely say the informer case involves a *moral* dilemma about applying wicked law, not a question of whether it *is* law. Your escape hatch ("evil enough") is exactly what Case (4) forces you to reject. **To salvage your intuitions, you need to ditch the "evil escape hatch" and embrace the procedural escape hatch (Fuller).** Your verdicts align far better with Fuller than with pure Hartian positivism.

  **Which Verdict Might Need Adjusting? (In Fuller's Direction)**
  *   **Case 3 (Decent-but-Chaotic):** Your verdict ("Law, just bad") is defensible, but Fuller might push you harder. If the chaos is *so* extreme that citizens genuinely *cannot* know what is required of them (constant renumbering, flat contradictions with no hierarchy or resolution mechanism), then it arguably fails the Clarity and Non-Contradiction criteria *so badly* that it ceases to function *as law*. It becomes arbitrary command, not a system of rules. You might soften to "Barely Law" or recognize that extreme chaos *can* tip into non-law territory.

  **The Military Occupation Case:**
  *   **Scenario:** Occupying power issues clear, public, prospective one-off orders (curfew with penalties). No legislature, no courts of its own.
  *   **Verdict (Using Fuller): Likely NOT Law.**
  *   **Why:** It fails **Generality** (one-off commands, not general rules) and **Constancy** (no stable body of rules, just ad hoc orders). It lacks the institutional structure for **Adjudication** by an independent body applying known rules – punishment is likely direct administrative/military action. It resembles **martial law or pure command**, not a legal system. While individual orders might *look* like laws, the *system* (or lack thereof) fails the internal morality. (Hart would likely say it lacks secondary rules, especially a rule of recognition/adjudication, making it a "pre-legal" regime of primary obligations only).

  **Conclusion:**
  Your intuitions are **highly salvageable!** You've intuitively gravitated towards **Lon Fuller's procedural natural law theory**. The core principle is: **Law requires adherence to the "Internal Morality of Law" – procedural standards that make law possible as a guide for human conduct.** Wickedness doesn't destroy legality; procedural failure does. This explains your verdicts on 1 (law), 2 (not law - procedural failure), 3 (law, but shaky), 4 (law - procedurally sound despite evil), 5 (not law - lacks legal system structure/purpose), and 6 (law, but weak).

  **What to tell your brother-in-law:**
  "Okay, smartass, I've thought about it. You're partly right – just being evil doesn't magically make something *not law*. Apartheid and my evil-but-clean regime *were* legally systems, horrifyingly so. But *your* side often misses the crucial point: a system that's completely arbitrary, retroactive, and contradictory – like the worst of the Nazis – isn't *really law* at all. It's just dressed-up tyranny. Law, even bad law, has to follow some basic ground rules to even count as law. So, yeah, evil can be perfectly legal. That's why fighting it is so hard. Pass the potatoes."

  You've got a solid, philosophically defensible position. Run with it.
