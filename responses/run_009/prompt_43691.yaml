answer: |-
  Your diagnosis is sharp, and I'll defend a clear position: **The core disagreement is substantive and meta-semantic, centered on whether compositional semantics *must* be representational (i.e., truth-conditional) to explain logical embedding. The "ad hoc" objection primarily targets explanatory elegance and failure to generalize, but it's a proxy for the deeper worry that expressivist machinery covertly reinstates truth-conditions. Progress requires a meta-semantic argument resolving whether non-representational compositionality is possible.** Here's the breakdown:

  ### 1. **The Nature of the Disagreement: Substantive Meta-Semantics**
     - **Not verbal:** Both sides largely agree on what "express" means (e.g., non-cognitive states like disapproval or planning intentions). The clash isn't about the *definition* of expressivism but whether such an account can satisfy **compositionality** — the principle that the meaning of a complex expression is determined by the meanings of its parts and their syntactic structure.
     - **Not conflated projects:** Semantics and metaethics are inextricable here. Expressivism is a *metaethical* thesis with *semantic* commitments. The Frege-Geach problem forces expressivists to provide a semantic story for embedding that preserves metaethical anti-realism. If they fail, cognitivism (with truth-conditions) wins by default. The welding is necessary.

     **The real fight:** Your hypothesis is correct. The debate hinges on a **meta-semantic constraint**: *Can logical relations (validity, entailment) be explained without assigning truth-conditions to moral sentences?* Critics insist "no": modus ponens requires premises with truth-apt content to preserve validity across embeddings. Expressivists say "yes": we can explain logic via attitudes toward attitude combinations (Blackburn), consistency in planning (Gibbard), or other non-representational machinery.

  ### 2. **What "Ad Hoc" Really Does: Signaling Explanatory Failure**
     The "ad hoc" charge isn't merely aesthetic. It flags two substantive failures:
     - **Generalization deficit:** Expressivist solutions often work *only* for moral language or simple embeddings. Critics ask: *Can this machinery handle quantifiers, negation, or mixed contexts (e.g., "If stealing is wrong, then it’s illegal")?* If not, the theory isn't compositional — it's a patchwork. Schroeder's "negation problem" (how does "not wrong" express a *different* attitude from "wrong"?) epitomizes this.
     - **Covert truth-conditions:** When expressivists like Gibbard invoke "factual-normative worlds" or hybrids assign belief components, critics see truth-conditional semantics in disguise. The machinery *mimics* representational structure without ontological commitment — but if it walks and talks like truth-conditions, is it *really* non-representational? This is the heart of Dreier's "problem of creeping minimalism."

  ### 3. **Progress Beyond the Loop? Yes, but Stalled**
     There *has* been progress, though not resolution:
     - **Refined targets:** Blackburn/Gibbard showed expressivism isn't *obviously* doomed. They forced cognitivists to clarify *why* truth-conditions are necessary (e.g., Unwin's "logical relations require shared semantic content").
     - **Hybrids as a litmus test:** Views like Ridge's "ecumenical expressivism" test the limits. If moral sentences express both belief *and* attitude, can the belief-component avoid truth-aptness? Critics (e.g., Schroeder) argue hybrids either collapse into cognitivism or fail compositionality.
     - **Formal semantics:** Work by Charlow, Silk, and others uses dynamic semantics to model expressivist content (e.g., updating plans). This *looks* progressive but invites the same "ad hoc" worry: does formalizing attitude-expression just *simulate* truth-conditions?

     Yet the loop persists because expressivists keep building machinery (e.g., "noncausal mental states" to handle embedding), and critics keep pointing out gaps.

  ### 4. **What Counts as Progress? A Meta-Semantic Breakthrough**
     A formal fragment (e.g., an expressivist semantics for a toy language with conditionals and negation) would help but not suffice — critics would question its scalability to natural language. The stalemate requires:
     - **Proving a meta-semantic limit:** A demonstration that **any compositional semantics must be representational**. This would settle the debate for cognitivism. No one has done this (and it may be impossible).
     - **Or, an expressivist win:** Show that a non-representational semantics can **systematically explain all embeddings** *without* sneaking in truth-conditions. This demands:
        - Solving the generalization deficit (e.g., handling quantification: "Everything the Pope says is wrong").
        - Explaining logical validity *as* consistency in attitudes/plans, not derivatively from truth-preservation.
        - Doing this for mixed discourses (e.g., moral + descriptive predicates).

     Until then, the debate remains stuck. Your reading group's frozen positions reflect the absence of a knockout argument. **The path forward is meta-semantics: not just building expressivist models, but rigorously interrogating whether compositionality *entails* representationalism.** If it does, expressivism loses. If not, we need a theory showing how — and no one has delivered that yet.

  **In short: The loop continues because expressivists haven’t met the meta-semantic burden of proof, and critics haven’t shown it’s impossible. The "ad hoc" complaints are valid calls for generality, but the real issue is whether logic requires truth.** Push your group to engage the *meta-semantic* question directly — that’s where the action is.
