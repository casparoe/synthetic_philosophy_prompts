prompt: |-
  I'm a software engineer with no formal philosophy background, so please write for someone who can follow a careful argument but doesn't know the literature. At work I keep hearing the line "perception is controlled hallucination," usually accompanied by the brain-as-game-engine picture: the mind renders an internal model, perception is that model getting steered by sensory error signals, and we never see the world directly, only the render. Most recently the line was used in a design discussion about VR headsets to argue that ordinary seeing and wearing a headset are fundamentally the same kind of state, since in both cases you're experiencing a rendered model rather than reality, and the only difference is where the error-correction signal comes from. When I objected that there seems to be an important difference between actually seeing a coffee mug and vividly hallucinating one, I was told that the difference is just how well-controlled the hallucination is, and I found I couldn't say what, if anything, is wrong with that. A friend who studied philosophy muttered something about the argument from illusion and a position called disjunctivism, which apparently denies that a successful perception and a subjectively indistinguishable hallucination have any deep common element — but that's as far as my knowledge goes.

  What I'd like is a careful dissection of the slogan. Lay out the distinct precise claims "perception is controlled hallucination" could be making, ordered roughly from weakest to strongest: perhaps a near-trivial claim about the brain using predictions and feedback rather than passively receiving pixels; a claim about the vehicles or causes of experience being internally generated; and the strong claim that in veridical seeing you are aware of your brain's model rather than the world, so that seeing and hallucinating differ only in the accuracy or control of the model. For each reading, tell me whether it's plausible, whether it follows from anything we actually have reason to believe about how perception works, and — importantly — whether it supports the conclusion it was deployed for at work, namely that seeing and headset-wearing are the same in kind. Then explain where the disjunctivist would push back: what exactly is the "common kind" or shared-factor assumption the slogan seems to smuggle in, how the classic argument from illusion is supposed to force that assumption on us, and whether the predictive-processing story the engineers were leaning on actually adds anything to that old argument or just restates it in fancier vocabulary. I'd also like to know whether any reading of the slogan is compatible with seeing the world directly, since if the weak reading is the true one, my colleagues may be trading on an equivocation.

  Please write the answer as continuous prose only, the way you'd write a long email or letter: no headings, no bullet points, no bold text, no tables. You can still make the readings easy to tell apart by saying explicitly where one ends and the next begins within the prose.
