answer: |-
  Based on your detailed description, I diagnose the disagreement as **primarily verbal**, rooted in divergent conceptions of the semantics/pragmatics boundary and the goals of semantic theory itself. Here's the breakdown, supported by how each side handles key cases and what progress could look like:

  ### Diagnosis: A Verbal Dispute
  1.  **Shared Core Facts:** Both sides agree on the observable phenomena:
      *   Slurs conventionally cause offense, even in "disengaged" contexts (mention, quotation).
      *   Neutral counterparts lack this offensive potential.
      *   Offense can be suspended/modified in specific contexts (in-group use, reclamation).
      *   Offense projects robustly (negation, questions, conditionals, modals).
      *   The offense is tied to the *word itself* conventionally, not just any speaker intent.
  2.  **Divergent Theoretical Labeling:**
      *   **"Semantics" Camp (Lexicon):** They view the robust, conventional, context-resistant, and projective nature of the offense as hallmarks of *semantic* content (whether as part of truth-conditions, a presupposition, or a conventional implicature/use-conditional meaning). For them, "meaning" includes these non-truth-conditional but conventional and compositional aspects. The offense is an inherent, encoded property of the word.
      *   **"Pragmatics" Camp (Use):** They view meaning narrowly as truth-conditional content (reference, satisfaction conditions). The robust offense is seen as a *pragmatic* phenomenon – a deeply conventionalized, speaker-oriented, expressive element arising from socio-historical norms and speaker attitudes associated with the word's *use*. It's "pragmatic" because it concerns felicity conditions, speaker commitment, or expressive force, not truth-conditions proper.
  3.  **Handling the Hard Cases Reveals the Labeling:**
      *   **In-Group/Reclaimed Uses:**
          *   *Semantics Camp:* Explain as *suspension* or *cancellation* of the encoded pejorative component (like presupposition suspension) via special contextual licensing (e.g., authority, reclamation acts). The meaning is still there but contextually deactivated.
          *   *Pragmatics Camp:* Explain as a shift in the *pragmatic norms* governing the word's use within that specific community/situation. The underlying expressive convention is repurposed or its offense-potential contextually blocked.
      *   **Embedding under Negation/Conditionals ("If he's a P, he's bad"):**
          *   *Semantics Camp:* Point to the *projection behavior* (the offense survives embedding) as evidence the offense is semantic (like presuppositions or conventional implicatures project). It's a property of the lexical item composing upward.
          *   *Pragmatics Camp:* Attribute the projection to the *speaker's attitude* being expressed *via* the slur word, regardless of the embedding. The expressive force operates at a level separate from the truth-conditional embedding. They might invoke notions like "expressive presuppositions" or "register triggers" located in the pragmatics.
      *   **Asymmetry with Neutral Counterparts ("P vs. N"):**
          *   *Semantics Camp:* The asymmetry *is* the semantic difference – the pejorative component is part of the lexical entry for "P" but absent for "N".
          *   *Pragmatics Camp:* The asymmetry arises because "P" conventionally *signals* a derogatory speaker attitude/register, while "N" is neutral. This signaling is a pragmatic convention attached to the word.

  **Why not Substantive-but-Hidden or Different Projects?**
  *   **Substantive-but-Hidden?** While deep questions about conventionality or social ontology exist, they likely *underpin both views*. Both agree offense is conventional. The core disagreement isn't primarily *about* whether group offense *can* be truth-conditional (the semantics camp often doesn't claim it *is* truth-conditional; it's presupposed/CI) or about the metaphysics of meaning (both accept conventionality). The fighting is over *classifying* the agreed-upon conventional offense mechanism as "semantic" or "pragmatic."
  *   **Different Projects?** They *are* studying the same phenomenon (slur meaning/use) with the same goal (explaining offense patterns). They aren't studying different things; they're describing the same complex beast using different theoretical vocabularies and drawing the S/P line in different places.

  ### Paths to Progress
  Since the dispute is verbal, progress requires reframing, not just more data. Here's what could help:

  1.  **Explicit Meta-Theoretical Agreement:** The most direct path is to **agree on definitions and goals.**
      *   *What counts as "semantics"?* Is it *only* truth-conditional content? Does it include conventional implicatures, presuppositions, or expressive/use-conditional meaning? What is the purpose of the semantic theory being built (e.g., compositional truth-conditions, explaining conventional meaning broadly)?
      *   *What counts as "pragmatics"?* Is it *only* inference based on context and Gricean principles? Does it include deeply conventionalized, word-specific expressive norms and social force?
      *   **Progress:** A workshop explicitly dedicated *not* to slurs, but to defining the S/P boundary using less charged, clearer examples (e.g., "but", "even", honorifics, particles like "huh"). Agreeing on core criteria for "semantic" vs. "pragmatic" *before* applying them to slurs could force clarity. If both sides agree that, say, conventional implicatures belong in semantics (or pragmatics), then the slur debate shifts accordingly.

  2.  **Formalization & Comparison:** **Formalize both analyses rigorously within the same framework.**
      *   Model the "semantic" account (e.g., as a presupposition, a CI, in a multidimensional semantics).
      *   Model the "pragmatic" account (e.g., using dynamic semantics for register/context update, expressive speech acts, structured contexts).
      *   **Progress:** Compare the formal systems side-by-side. Do they make genuinely different empirical predictions beyond labeling? Are they notational variants? If they make distinct predictions (see point 4), test them. If they are equivalent, declare victory and acknowledge the dispute is terminological.

  3.  **Reframe the Question:** **Abandon the "Semantics vs. Pragmatics" framing.** Ask:
      *   "What are the *components* of a slur's conventional meaning and use potential?"
      *   "How do these components interact compositionally and contextually?"
      *   "How are these components acquired, represented, and processed?"
      *   **Progress:** Generating a list of necessary components (e.g., neutral reference, conventional derogatory potential, historical association, in-group licensing conditions, projection properties) that both sides agree need explaining, *without* initially labeling them S or P. Focus on the explanatory mechanisms required.

  4.  **Seek a Sharper Test Case (Less Likely, But Possible):** Look for a phenomenon where a **semantic** account and a **pragmatic** account *must* make different, testable predictions about acceptability, truth-value, or interpretation. This is hard because both sides have sophisticated mechanisms for handling the standard cases.
      *   *Potential Candidate:* **Truth-Value Judgments involving Slurs.** Can a sentence containing a slur be *literally true* while being deeply offensive? Does the offense infect the truth-evaluation itself?
          *   A strong semanticist (claiming offense is truth-conditional) *might* predict the sentence is false (if the pejorative component isn't satisfied).
          *   A pure pragmatist (offense separate from truth-conditions) predicts the sentence can be true yet offensive.
          *   *Problem:* Most "semantics" camp proponents don't put the offense in the truth-conditions proper; they use presuppositions/CIs precisely to avoid this. So this might not cleave the divide cleanly. Experimental work on this is complex and contested.
      *   *Another Candidate:* **Interaction with Logical Operators in Highly Specific Ways.** Perhaps embedding slurs under rarely studied operators or in complex, contradictory discourse contexts could reveal a difference in how the theories model compositionality vs. pragmatic update. (This is speculative and challenging to design).

  **Conclusion:**
  Your hypothesis is strong. The workshop is likely stuck on terminology ("semantics" vs. "pragmatics") applied to a complex phenomenon that inherently involves both conventional meaning *and* its contextual use-potential. Progress requires stepping back from the battle lines to:
  1.  **Clarify the theoretical framework** (what S/P mean *to us*),
  2.  **Formalize the analyses** to expose (in)equivalence, and/or
  3.  **Reframe the question** to focus on explanatory components rather than disputed labels.

  Finding a single "killer" test case is unlikely, as both frameworks are highly adaptable. The path forward is meta-theoretical negotiation and conceptual clarity, not more empirical data on the standard cases they've already absorbed. The equilibrium is stable because the disagreement is fundamentally about how to *describe* the agreed-upon facts, not about the facts themselves.
