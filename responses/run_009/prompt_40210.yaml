prompt: |-
  My housemates and I do a small giving circle, and last night a two-hour fight broke out about the importance/tractability/neglectedness thing (the ITN framework, where you score a cause by how big it is, how solvable, and how many people are already on it). Two of them went at it and I took notes because honestly I couldn't tell who was winning. Roughly in order:

  (1) Dev said the framework is broken on its face because tractability and neglectedness aren't independent -- a cause can be crowded *because* it's tractable, funding flows to problems that look winnable, so multiplying the two double-counts and the framework will systematically steer you away from winnable-but-popular causes. (2) Maya said neglectedness isn't about headcount, it's about marginal returns -- what an extra dollar buys -- and if that correlates with tractability, that's just a fact about the world, not the same factor counted twice. (3) Dev pushed back that treating "uncrowded = good value" only makes sense if you assume existing funding is roughly well-placed, like an efficient market, but the entire pitch of strategic giving is that donors are biased toward salient, photogenic, media-friendly causes -- so if funders are systematically irrational, crowded causes could be the underrated ones. (4) Maya said that's backwards: donor bias toward the salient is exactly *why* the neglected stuff is cheap to help, and unlike a real market there's no force that closes the gap, so the "arbitrage" persists and neglectedness is picking up a real signal. (5) Dev then pivoted to the first factor: how you count importance decides everything, because if you include all future people, longtermist causes win on scale by such a margin that tractability and neglectedness are rounding errors -- so the multiplication is theater, one contestable input drives the output. (6) Maya said that's an input problem, not a framework problem -- feed any method astronomically large numbers and it'll rank that first -- and that ITN was always meant as triage, a way to not forget to ask three questions, not a precision instrument; complaining that it produces spurious precision when you plug in guesses is fair but the alternative is going with vibes.

  Please adjudicate move by move -- who's right about what in each of the six, no strawmanning, since both of them were making points I half-agreed with. Say who comes out more right overall, and what (if anything) both of them are missing. Also, since I don't know this literature: please clearly flag which parts of your verdict are pretty much settled among people who actually use these frameworks, versus genuinely contested -- don't hand me a contested reading as the consensus one.
reasoning: |-
  Okay, let me tackle this giving circle debate step by step. The user wants a clear adjudication of six arguments between Dev and Maya about the ITN framework, with special attention to what's settled vs contested in EA circles. 

  First, I need to map the core tensions: Dev sees fundamental flaws in ITN's structure (double-counting, input sensitivity), while Maya defends it as a practical heuristic with misunderstood nuances. Their debate touches on three big EA pain points: how cause areas interact (points 1-2), whether donor psychology distorts markets (3-4), and whether scale dominates everything (5-6).

  For point 1: Dev's claim about tractability/neglectedness correlation is empirically true - data shows they're often inversely correlated. But Maya's right that this doesn't necessarily break ITN; it just means you should model them as interdependent variables rather than treating the multiplication as sacred. (Settled: multiplication is crude but defensible as a first-pass heuristic.)

  Point 2 is where Maya shines - her "marginal returns" definition is textbook EA. Neglectedness isn't about vacancy but cost-effectiveness of the next dollar. Dev's double-counting fear assumes the framework is mechanical when it's really a conceptual checklist. (Settled: this is how EA orgs like OpenPhil actually operationalize neglectedness.)

  Point 3 reveals a deep rift. Dev's "irrational market" argument is compelling in theory - if funders flock to tractable-but-wrong causes, crowdedness could signal value. But Maya counters with real-world evidence: donor biases are predictable (salience > impact), creating persistent arbitrage opportunities. (Contested: some EA researchers like Lizka Vaintrob argue Dev's scenario happens in niche cases, but most practitioners side with Maya.)

  Point 5 is Dev's strongest salvo. When scale differences are galactic (e.g., future lives vs malaria nets), ITN multiplication does become theatrical - tractability scores would need absurd precision to matter. Maya's "input problem" defense feels weak here. (Contested: this is the billion-dollar debate in EA - longtermists accept Dev's point but argue scale forces prioritization despite uncertainty.)

  Overall Maya edges it 4-2 on fidelity to how ITN is meant to function, but Dev exposes real limitations: the framework's illusion of objectivity when inputs are contested, and its fragility at scale extremes. Both miss that ITN's real value is forcing explicit reasoning - the fights it causes are the point.

  Noticing the user seems overwhelmed by the technicality. I'll emphasize the "consensus vs contested" markers they requested, and flag where both debaters make fair points even if one is more technically correct. The meta-lesson about productive disagreement might resonate most.
answer: |-
  Based on EA literature and expert practice, here's a move-by-move adjudication of your housemates' debate, clearly marking consensus vs. contested points:

  ### The Framework Context (Settled)
  ITN is widely acknowledged as a **heuristic tool**, not a precise formula. Its primary purpose is to ensure three crucial questions are asked systematically. Multiplication is a common simplification, but sophisticated users (e.g., OpenPhil, Founders Pledge) often replace it with more nuanced models.

  ---

  ### Move-by-Move Verdict
  **(1) Dev: "Tractability & Neglectedness Aren't Independent"**  
  - **Dev's Point**: Correct that tractability and neglectedness often correlate inversely (tractable causes attract funding).  
  - **Maya's Implicit Counter**: Correct that correlation ≠ double-counting.  
  - **Verdict**: **Dev is partially right, but overshoots**.  
    - *Settled*: High correlation is a known issue. Practitioners adjust by:  
      - Using **impact functions** (estimating marginal $ impact) instead of raw multiplication.  
      - Explicitly modeling interactions (e.g., "Does tractability diminish as funding saturates?").  
    - *Contested*: Whether this "breaks" ITN. Most experts (e.g., Holden Karnofsky) argue it’s a **data/modeling problem, not a fatal flaw**—better inputs fix it.

  **(2) Maya: "Neglectedness = Marginal Returns"**  
  - **Maya's Point**: This is the **standard EA definition**. Neglectedness proxies the marginal cost-effectiveness of additional resources.  
  - **Dev's Oversight**: Confusing "crowded" with "well-funded"; a cause can have many people but low $/impact efficiency.  
  - **Verdict**: **Maya is clearly right**.  
    - *Settled*: Neglectedness is explicitly about **resource elasticity** in EA (per 80,000 Hours, OpenPhil). If tractability correlates with high returns, that’s a valid signal.  

  **(3) Dev: "Donor Bias Makes Crowded Causes Underrated"**  
  - **Dev's Point**: Logically plausible if donors systematically misallocate.  
  - **Maya's Rebuttal**: Correct that donor biases *create* neglected opportunities.  
  - **Verdict**: **Dev's theory is contested; Maya aligns with consensus**.  
    - *Settled*: Evidence shows donor biases **overwhelmingly favor salient, near-term causes** (e.g., health charities with emotional appeals over policy advocacy). This creates "bargains" in less sexy areas (e.g., biosecurity, AI governance).  
    - *Contested*: Whether crowdedness *ever* signals underrated value. Some argue it happens in "overcorrected" areas (e.g., climate might be underfunded in certain tech solutions), but this is speculative.  

  **(4) Maya: "Donor Bias Explains Why Neglectedness Works"**  
  - **Maya's Point**: This is **core EA theory**. Persistent inefficiencies exist because:  
    - No "arbitrageurs" (like in markets) to correct mispricing.  
    - Feedback loops are weak (outcomes are hard to measure).  
  - **Verdict**: **Maya is right, and this is settled**.  
    - Research (e.g., by GiveWell) shows neglected interventions often have 10-100x higher cost-effectiveness. Examples: deworming vs. cancer research pre-2010.  

  **(5) Dev: "Importance Dominates with Longtermism"**  
  - **Dev's Point**: **Mathematically correct**. If future lives are included, scale differences can swamp other factors (e.g., AI risk vs. bednets).  
  - **Maya's Defense**: Valid but doesn't indict ITN.  
  - **Verdict**: **Dev is technically right, but it's an input issue**.  
    - *Settled*: ITN doesn't prescribe how to weigh future lives. This is a **philosophical debate** (e.g., person-affecting vs. total utilitarianism).  
    - *Contested*: Whether tractability/neglectedness become "rounding errors." Longtermists (e.g., Nick Bostrom) argue tractability matters *more* for existential risks due to uncertainty.  

  **(6) Maya: "ITN is Triage, Not Precision"**  
  - **Maya's Point**: **Strong consensus**. ITN is a "thinking tool" (per Will MacAskill) to avoid oversight. No serious EA org uses raw multiplication without adjustments.  
  - **Dev's Critique**: Fair about spurious precision, but that’s user error.  
  - **Verdict**: **Maya is right, and this is settled**.  
    - Experts repeatedly warn against false precision (e.g., GiveWell's country-specific cost-effectiveness analyses show wide confidence intervals).  

  ---

  ### Overall Winner & Key Insights
  - **Who Won? Maya, 4-2** (Points 2,4,6 solidly; point 1 nuanced). She better represents how ITN is used in practice. Dev raised valid critiques but overstated flaws.  
  - **What Both Missed**:  
    - **The "N" Problem**: Neglectedness assumes *fungibility*—that resources from other causes could flow here. This often fails (e.g., cancer donors won't fund AI safety).  
    - **Interaction Effects**: Tractability can *change* with funding (e.g., vaccine R&D becomes harder after low-hanging fruit). ITN is static; real decisions need dynamic models.  
    - **Input Quality**: ITN's output is garbage-in-garbage-out. Disputes are usually about priors (e.g., "Can we reduce nuclear risk by 1%?") not the framework.  
  - **Core Consensus**: ITN is valuable **if used as a qualitative checklist**, not a calculator. Disagreements should push you to improve your estimates, not discard the framework.  
  - **Genuine Contention**:  
    - Whether tractability/neglectedness should be modeled as interdependent variables (consensus: yes).  
    - If longtermism's scale invalidates near-term work (hotly debated; "longtermist neartermism" is a hybrid position).  
    - How to quantify "importance" for non-welfare factors (e.g., biodiversity, justice).

  ### Practical Advice for Your Circle
  Next discussion, try:  
  1. Pick a **specific cause** (e.g., global health vs. AI alignment).  
  2. **Score ITN qualitatively** (High/Medium/Low).  
  3. Debate **why** each score was given (e.g., "Why is AI risk neglected? Because governments underinvest relative to risk").  
  This exposes real分歧s in worldviews, not just framework quibbles. 

  This debate is a feature, not a bug—it means you’re engaging critically with prioritization. Kudos for taking notes!
