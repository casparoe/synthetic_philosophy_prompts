answer: |-
  Here's a satisficing-based procedure designed specifically for your literary fiction drafting, grounded in Simon's concepts, translated into novelist terms, and structured as a daily 20-minute audit:

  **The Chapter Completion Protocol (CCP)**

  **Core Principles:**
  1.  **Aspiration Level (Your "Good Enough" Threshold):** Defined as "Meets minimum functional & aesthetic standards for *this draft stage*, relative to *your own proven capability*, and serves the *current* novel's needs." Not "perfect" or "best possible."
  2.  **Bounded Rationality:** Accept that within 20 minutes, with your current knowledge/fatigue, you cannot find *all* flaws or the *absolute best* solution. Focus on *detectable* issues meeting defined criteria.
  3.  **Cost of Search:** Explicitly value your time. Each extra revision hour costs future novels. Define "done" as when the *expected benefit* of further search is less than its *opportunity cost* (progress on next chapter/book/life).
  4.  **Stopping Rule:** A clear trigger to move on, even with lingering doubts.

  **The 20-Minute Daily Audit Procedure:**

  *(Run sequentially. Stop if any step triggers the "Move On" rule.)*

  1.  **Fundamentals Check (3 mins):**
      *   **Q1:** Is the core action/event/information of the chapter clear and unambiguous? (Can a reader summarize *what happens* accurately?)
      *   **Q2:** Does it logically connect to the previous chapter and set up the necessary elements for the next chapter? (Plot/Structure Function)
      *   **Q3:** Is the core purpose of this chapter (e.g., reveal character X, establish setting Y, turn plot point Z) demonstrably achieved?
      *   **Threshold:** "Yes" to all 3.
      *   **Decision:** If YES, proceed to Step 2. If NO on Q1 or Q3, note the specific *concrete* flaw (e.g., "Motive for Character A's decision is confusing," "Key detail about the letter is missing") and plan a *specific* fix for the next session. If ONLY Q2 is NO, proceed to Step 2 but note the linkage issue for later (it might be fixed elsewhere). **Move On Rule:** **DO NOT** revise now. Note the fix and move to the next chapter *tomorrow*.

  2.  **Character & Voice Integrity (5 mins):**
      *   **Q4:** Are POV character thoughts/actions consistent with their established nature and motivation *in this moment*? (Not necessarily globally "perfect").
      *   **Q5:** Is the narrative voice (POV, tone, style) consistent within this chapter and acceptably aligned with the novel's overall voice? (Minor variations allowed for effect).
      *   **Q6:** Does dialogue sound natural *enough* for these characters, and serve its purpose (reveal, conflict, advance plot)?
      *   **Threshold:** "No glaring inconsistencies or false notes detected *today*." (Focus on *detectable* issues, not potential ones).
      *   **Decision:** If NO, note the *specific* inconsistency/false note (e.g., "Character B uses anachronistic slang on p3," "Narrative voice becomes overly distant on p7"). Plan a *specific* targeted fix for the next session. **Move On Rule:** **DO NOT** revise now. Note the fix and move to the next chapter *tomorrow*. If YES, proceed.

  3.  **Emotional & Thematic Resonance (5 mins):**
      *   **Q7:** Does the chapter evoke *any* intended emotional response (even subtle) or thematic hint *somewhere*? (Don't require every paragraph to sing).
      *   **Q8:** Are there 1-2 moments (a line, a beat, a small image) that feel *alive* or *true* to you *today*?
      *   **Threshold:** "Yes" to Q7 OR Q8. (Not necessarily both, and not necessarily every element).
      *   **Decision:** If NO, note *which* intended emotion/theme feels missing and *one specific spot* where you might try to inject it in the next session. **Move On Rule:** **DO NOT** revise now. Note the idea and move to the next chapter *tomorrow*. If YES, proceed.

  4.  **Cost-Benefit & Aspiration Met Check (5 mins):**
      *   **Q9 (Aspiration Met):** Considering Steps 1-3, does the chapter *currently* meet the "Fundamentals" threshold AND have no glaring "Character/Voice" flaws AND meet the "Resonance" threshold? (i.e., Is it functionally sound and passably alive?).
      *   **Q10 (Cost-Benefit):** What *specific, significant* improvement do you believe you *could* make with *one more session* on this chapter? (Be concrete: e.g., "Fix the awkward transition on p5," "Sharpen the metaphor about the river," "Make Character C's anger clearer"). Is this improvement *crucial* to the novel's core success? Does its *expected value* outweigh the cost of *delaying progress on the next chapter/book*?
      *   **Threshold for Q9:** "Yes".
      *   **Threshold for Q10:** "No specific significant improvement identified," OR "Identified improvement is minor and not crucial," OR "Cost (time/opportunity) outweighs benefit."
      *   **Decision:** If Q9 = YES AND Q10 Threshold Met -> **MOVE ON.** Chapter is satisficed. If Q9 = NO -> Return to Step 1 with your notes tomorrow (treat it as a new session). If Q9 = YES but Q10 Threshold NOT Met (i.e., you see a crucial fix) -> Plan that *one specific fix* for the next session. **Move On Rule after Fix:** Apply the fix in the *next* session, then **run CCP again immediately after.** If it passes, MOVE ON. If it fails, note why and MOVE ON *anyway* (escalate to later draft).

  5.  **Judgment Call & Final Handoff (2 mins):**
      *   **Q11:** Despite passing the thresholds, does a *deep, persistent intuition* tell you this chapter fundamentally doesn't work? (Not vague unease, but a conviction).
      *   **Decision:** If YES, note "Major Structural/Conceptual Issue - Revisit in Next Draft Phase". **Move On.** If NO, **MOVE ON.** This step acknowledges bounded rationality - your gut might know something the 20-min audit missed, but only act on *strong* conviction, accepting it may require later, more efficient global revision.

  **Applying the CCP to Your Cases:**

  1.  **The Boring Middle Chapter (Does its plot job):**
      *   **Step 1 (Fundamentals):** YES (Action clear, connects, purpose achieved).
      *   **Step 2 (Char/Voice):** YES (Likely consistent, just dull).
      *   **Step 3 (Resonance):** Q7 (Intended emotion?) - Maybe NO (feels flat). Q8 (1-2 alive moments?) - *Scan quickly.* Maybe YES (find one decent line/beat). **Threshold:** YES (if it has *one* moment).
      *   **Step 4 (Cost-Benefit):** Q9: YES. Q10: *What specific fix?* "Make it less boring." Too vague! *Concrete?* "Add a minor conflict?" Benefit: Small. Cost: High (delays book). **Threshold Met:** YES (Vague desire, minor benefit, high cost).
      *   **Step 5 (Judgment):** Intuition says "boring" but not "fundamentally broken."
      *   **CCP VERDICT:** **MOVE ON.** It satisfies core functions. The "boring" flag is noted (Step 3), but the cost of perfecting every middle chapter is prohibitive. Address *global* pacing later if needed.

  2.  **Weak Opening Chapter (Agent flagged):**
      *   **Step 1 (Fundamentals):** *Likely YES* (It probably sets up plot/characters).
      *   **Step 2 (Char/Voice):** *Potentially NO.* Agent's concern likely implies inconsistency, weak voice, or unengaging intro. Identify SPECIFIC flaw (e.g., "First paragraph info-dump," "Protagonist intro feels cliche").
      *   **CCP VERDICT:** **STOP at Step 2.** Note the specific flaw(s). Plan targeted fix(es) for next session. *This is where CCP likely fails you (see Failure Modes below).* Agent feedback trumps the initial "Fundamentals" pass. CCP flags the issue, but significant revision is warranted *because it's the opening*.

  3.  **The Flip-Flopped Scene (8 rewrites, versions indistinguishable):**
      *   **Step 1 (Fundamentals):** YES (Both versions likely achieve this).
      *   **Step 2 (Char/Voice):** YES (Both likely consistent).
      *   **Step 3 (Resonance):** YES (Both likely have moments).
      *   **Step 4 (Cost-Benefit):** Q9: YES. Q10: *Specific improvement possible?* You literally cannot tell the versions apart. **Benefit = ZERO.** Cost = High (time, frustration, delay). **Threshold Met:** YES.
      *   **Step 5 (Judgment):** Intuition is confused, not strongly objecting to either.
      *   **CCP VERDICT:** **MOVE ON IMMEDIATELY (via Step 4).** This is the *perfect* satisficing scenario. Continued search is irrational; the marginal improvement is nonexistent. Flip a coin if you must, but **DO NOT REVISE AGAIN.** Mark it done.

  **Failure Modes & Limitations (Know Where CCP Breaks):**

  1.  **Beginnings & Endings:** CCP is weakest here. A "satisficed" opening that fails to hook or an ending that fizzles can sink the whole book. **Mitigation:** Treat Step 5 (Judgment Call) VERY seriously for these. Agent/Trusted Reader feedback is crucial *early* for openings. CCP might tell you to *eventually* move on, but expect more cycles than for middles.
  2.  **Foundational Flaws:** If a chapter's core concept, character motivation, or plot logic is flawed *beneath the surface*, CCP (focused on detectable issues) might pass it. **Mitigation:** Step 5 (Judgment) is the guardrail. Also, later global revision phases are where these often surface more clearly and can be fixed more efficiently in context.
  3.  **Evolving Taste/Insight:** Your Week 7 self might see flaws Week 2 self missed. CCP locks in "good enough *now*." **Mitigation:** Accept this. Use later drafts (manuscript-level reads) for these insights. Fix them *then*, efficiently. Perpetual local revision based on shifting taste is the enemy.
  4.  **Over-Reliance on Checklist:** Step 5 exists precisely because art requires judgment. If CCP says MOVE ON but your gut *screams* "No!" *and* you can articulate *why concretely*, override it (but be ruthless about defining the "why").
  5.  **"Good Enough" Erosion:** Under deadline pressure, you might lower your aspiration level too far. **Mitigation:** Remember Step 3 (Resonance) and Step 5 (Judgment). "Fundamentals" are the floor, not the ceiling.

  **Your Real Constraint - The Satisficing Edge:**

  Simon's framing *absolutely* captures your time constraint. Bounded rationality explicitly includes the *cost of computation* (your revision time) and the *value of the outcome* (your finite books). **CCP operationalizes this:**

  *   **Aspiration Level:** Defines "good enough" relative to your *lifetime output goal*. "Perfect" chapter 4 steals time from book 5.
  *   **Cost of Search:** Explicitly weighs revision time against progress on the *next chapter* and the *next book*. Step 4 (Q10) forces this calculation.
  *   **Stopping Rule:** Prevents the endless, diminishing-returns search that directly consumes your remaining writing years.

  **The Core Mindshift:** CCP doesn't find the "best" chapter. It finds the chapter that is **"fit for purpose *now*,"** allowing you to complete the *next* chapter and the *next* book. Your maximizer's urge will protest. Trust the procedure, especially the **"DO NOT REVISE NOW - MOVE ON TOMORROW"** rules. Your lifetime output depends on it.
