answer: |-
  ## Philosophical Analysis: The Recursive Prediction Trap

  Right, let's dissect this fascinating and profoundly unsettling phenomenon. As your appointed philosopher of action, I'll proceed methodically: first brainstorming near-miss concepts, testing their fit, then offering the closest established framing and a proposed refinement for your specific case. Your description is remarkably precise, exposing a genuine crack in standard decision theories.

  ### Brainstorming: Near Misses and Imperfect Fits

  1.  **Newcomb's Problem:**
      *   **Similarity:** Central is a predictor (Omega) whose near-perfect foresight creates tension. Choosing the "rational" dominant strategy (two-boxing) leads to a worse outcome than the "irrational" one-boxing, precisely *because* the predictor anticipated your rationality.
      *   **Key Difference:** Newcomb offers *stable*, albeit conflicting, recommendations (Causal Decision Theory says two-box, Evidential says one-box). Your situation lacks *any* stable recommendation. The moment you fix on *any* plan (bluff, not-bluff, mix), the very fact of choosing it seems to provide evidence the opponent predicted it, undermining its expected value. It’s a vortex of *instability*, whereas Newcomb is a clash of *principles*.

  2.  **Nash Equilibrium (Game Theory):**
      *   **Similarity:** Involves predicting opponents and choosing best responses.
      *   **Key Difference:** Nash equilibrium is *stable* – no player regrets their choice given the others' choices. Your scenario is defined by its *instability*. No matter what you choose, you feel compelled to change it *because* you chose it, precisely due to the opponent’s predictive model of *you*. Standard equilibria assume players model the *game* and others' *strategies*, not the specific *internal reasoning process* of *this particular opponent* in such a recursive, self-defeating way.

  3.  **Level-k Thinking / Cognitive Hierarchy:**
      *   **Similarity:** Describes iterative reasoning ("I think he thinks that I think..."). Common in poker/bridge analysis for finite depths.
      *   **Key Difference:** Level-k models assume players anchor at a simple level (e.g., Level 0: random) and iterate upwards a fixed, finite number of steps. Crucially, players don't *simultaneously* believe their own choice reveals their level *to a predictor specifically modelling their depth*. In your scenario, the opponent’s predictive power *infects your own deliberation*; your settled thought becomes evidence against itself within *your own* reasoning, creating a feedback loop. It’s not just iterating levels; it’s the *act of settling* that triggers the undermining.

  4.  **The "Unbeatable Predictor" or "Oracle" Problem:**
      *   **Similarity:** Explores logical limits of choice against perfect foresight.
      *   **Key Difference:** The classic philosophical puzzle (e.g., can you surprise God?) often focuses on logical contradiction or fatalism. Your concern is *practical deliberation* against a *very good, but fallible*, predictor. The core agony isn't logical impossibility, but the *procedural instability* and self-defeating nature of *trying to decide* when your choice leaks information about what was predicted.

  5.  **Signaling Games / Strategic Information Transmission:**
      *   **Similarity:** Actions can reveal private information (like your type or hand strength).
      *   **Key Difference:** Standard signaling games involve equilibrium where signals are (partially) revealing but stable. Your situation is unique because the "signal" isn't your type *per se*, but the *very output of your deliberative process itself*. The opponent isn't just inferring your cards; they're inferring *what you concluded was the best play*, and your knowledge of *that* inference undermines the conclusion.

  ### The Established Core: Recursive Predictability (or Strategic Transparency)

  The pure, idealised version of your predicament – facing a perfect predictor who anticipated your every move, dodge, and rejected alternative – is most directly addressed under the umbrella of **Recursive Predictability** or the implications of **Strategic Transparency**.

  *   **What it is:** A situation where an agent (A) knows that another agent (P) possesses a sufficiently accurate predictive model *of A's own decision-making process*. Crucially, A also knows that any choice A makes will constitute *evidence* confirming or disconfirming P's prediction *about that specific choice*. This creates a feedback loop within A's deliberation: any tentative plan A forms implies that P likely predicted it, which in turn makes A doubt the plan's efficacy, leading to instability.
  *   **Why it fits:**
      *   Captures the core agony: Your choice isn't just an action; it's a *signal* revealing the outcome of your deliberation *to the predictor who modelled that deliberation*.
      *   Explains the instability: There is no "fixed point" in your reasoning. Any output (`I will do X`) immediately implies an input to P's model (`A will do X`), rendering X ineffective *if P acts on that prediction*.
      *   Handles the perfect predictor: If P is perfect, *every* choice you make, including the meta-choice to randomize in a specific way, was predicted. All options collapse into equal futility from your perspective *during deliberation* (though P obviously wins). The "dodges considered and rejected" are part of P's model.

  ### The Bounded Reality: The Exploitable Transparency Dilemma

  Your card table scenario involves a highly skilled, but imperfect, predictor. This is the more nuanced and practically relevant case lacking a single universally established name, though it sits within studies of **bounded rationality**, **learning in games**, and **adversarial prediction**. I propose the term **Exploitable Transparency Dilemma (ETD)** to capture its essence.

  *   **Definition:** A decision problem where:
      1.  An agent (A) faces an opponent (P) who has developed a highly accurate (but not perfect) predictive model *of A's specific decision-making tendencies*.
      2.  A is aware of P's predictive capability.
      3.  A believes that the *act of settling on a specific plan* provides strong evidence to P (via P's model) about what A will do, significantly increasing P's ability to exploit that choice.
      4.  This awareness induces instability in A's deliberation: any candidate action seems to become less desirable the moment A commits to it internally, as A infers P likely predicted it.
  *   **Key Features & Boundaries:**
      *   **Not Just Skill Difference:** A merely skilled opponent might be better at game theory or reading tells. ETD requires P's skill to be *specifically* in modelling *A's unique reasoning patterns and tendencies* (e.g., your bluffing "tells" in thought, not just in posture). The cousin knows *you*, not just hiding spots.
      *   **Not Infinite Regress for Fun:** The regress (`I think he thinks...`) is a *symptom*, not the core. The core is the *causal link*: your deliberative output (choosing X) is strong *evidence* feeding P's predictive model, making X exploitable. The regress arises because you try to outrun this evidence-leak.
      *   **Distinct from Level-k:** While level-k involves steps, ETD involves the *meta-awareness* that choosing *any* level-k strategy (e.g., "I'll play Level 3 this hand") is itself a pattern P's model might detect and exploit. It's the transparency of your *method* itself.
      *   **The Instability:** This is the defining agony. In standard decision theory, deliberation converges on a choice. In ETD, deliberation seems inherently destabilizing. The "be the sort of person" advice fails because *you are the person deliberating now*, and your deliberation is transparent to P.
      *   **The Bounded Predictor:** P is "merely good." This means:
          *   **Imperfect Model:** P's model might not capture every nuance or novel situation. There might be blind spots.
          *   **Noise:** Real-world factors introduce noise P can't perfectly filter.
          *   **Potential Counterplay?** This is the critical question for rationality. Can A exploit the *bounds* of P's model? Can A introduce deliberate randomness *in a way P hasn't modelled*? Can A change their own tendencies faster than P can learn? This is where the literature on adversarial machine learning, opponent modelling exploitation, and self-modifying strategies becomes relevant, though often technical.
      *   **Boundary Cases:**
          *   **The Mediocre Cousin (Guesser):** If P's predictive accuracy is only slightly better than chance, their model is weak. The "leakage" of your decision is minor noise. Standard decision theory (perhaps with a small risk premium for predictability) suffices. ETD requires significant predictive advantage *specifically tied to modelling A*.
          *   **The Very Good, Not Perfect Opponent:** This is the ETD zone. Your reasoning feels transparent. The rational response is fiendishly hard: you likely need to *randomize strategically*, but crucially, *in a way that is unpredictable to P's model of you*. This might involve:
              *   **Meta-Randomization:** Randomizing *how* you randomize (e.g., sometimes play GTO, sometimes deliberately "level yourself" chaotically).
              *   **Self-Obfuscation:** Deliberately acting against your own perceived tendencies *without falling into a predictable pattern of doing so*.
              *   **Exploiting Model Biases:** If you suspect P's model over- or under-weights certain aspects of your play, bait it.
          *   **The Perfect Predictor:** Recursive Predictability reigns. Deliberation feels futile or paradoxical. Any action confirms the prediction. The only "stable" state is the acceptance that P will win, or a focus on aspects *outside* P's model (e.g., your utility might include "frustrating P" or "acting authentically," though P predicted that too!).

  ### Relation to Newcomb Revisited

  The link to Newcomb is the *source* of the predictive power and its *evidential* impact on your choice. In both cases, your choice is strong evidence of what was predicted. The difference is structural:
  *   **Newcomb:** Static choice between two boxes. The tension is between two *principles* (dominance vs. expected utility conditional on the prediction) giving conflicting *stable* answers. The predictor's action (filling boxes) is done *before* your choice based on their prediction.
  *   **Your Situation (ETD/Recursive Predictability):** Dynamic interaction (e.g., repeated poker hands, ongoing hide-and-seek). The tension is *internal* to your deliberation process: the *act of forming an intention* seems to doom it. The opponent reacts *based on* their prediction of your choice *as you are making it*. The instability arises because your deliberation is transparent to an opponent acting concurrently or reactively. Newcomb has a stable (though contested) answer; your situation has an unstable deliberation process.

  ### Conclusion

  There isn't one perfect, universally agreed-upon term. The pure, perfect-predictor case is best described as **Recursive Predictability** or a manifestation of **Strategic Transparency**, highlighting how your actions reveal your decision process to a model of that process. Your practical card-table nemesis exemplifies the **Exploitable Transparency Dilemma (ETD)** – the bounded, agonizing reality where a highly skilled opponent exploits the inherent predictability leaking from your own settled deliberations, inducing strategic instability.

  The ETD carves out a specific niche: it's not general skill difference, not standard level-k play, not simple signaling, and not the stable paradox of Newcomb. It's the unique hell of knowing your own mind is an open book to a skilled adversary, making the very act of deciding feel like handing them the key to your defeat. The literature you seek intersects philosophy of action (deliberation dynamics), game theory (learning, opponent modelling, adversarial settings), computer science (adversarial ML), and even psychology (theory of mind under pressure). It's a profound challenge to notions of stable rational choice in adversarial contexts with mutual modelling. Well spotted. It *should* keep you up at night.
