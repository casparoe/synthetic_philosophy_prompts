prompt: |-
  So I write novels for a living, which means people assume I've thought hard about what art is, and mostly I've gotten away with bluffing. But a painter friend of mine hit me with a take at dinner last week that I cant stop chewing on, and I'd like to know how much of it survives contact with actual philosophy of art. Her version goes roughly like this: after Duchamp stuck a urinal in an exhibition and called it Fountain, the philosophers basically gave up on beauty and craft as the markers of art, and the institutional view won — art is just whatever the artworld decides to treat as art, the way money is money because we all agree to treat it that way. She says Duchamp proved that literally anything can become art if the right people nominate it, that Wittgenstein had already shown with his family resemblance idea that art can't be defined anyway, and that this is why a banana duct-taped to a wall can sell for millions. Conclusion: the definition of art is a pure social fact, and getting worked up about whether something is really art is like getting worked up about whether a particular piece of paper is really a twenty.

  I'm half inclined to agree — I do think the urinal was art, and I've written scenes I'd defend as art that have no beauty in them whatsoever. But the way she strung the pieces together felt slippery, and I don't know enough to say where. Can you walk me through her summary claim by claim? I want to know which parts a careful philosopher of art would accept, which parts are conflations or overstatements, and whether her punchline about the banana and the twenty-dollar bill follows from the parts that survive. The thing that's bugging me most: the institutional view sounds like a definition of art — a social one, sure, but still an answer to the question — while the Wittgenstein bit sounds like the claim that no definition is even possible. Those seem like opposite positions to me, but she treated them as one smooth argument, and neither of us knew enough to spot where the seam was.
reasoning: |-
  Okay, the user is a novelist who's been bluffing about art theory, and now a painter friend has challenged them with a specific argument about art post-Duchamp. The core claim is that after Duchamp's Fountain, philosophers abandoned beauty and craft, adopting an institutional view where art is whatever the art world accepts. The friend ties this to Wittgenstein's family resemblance and uses the banana duct-taped to a wall as proof. The user feels there's a tension between the institutional definition and Wittgenstein's anti-definition stance but can't articulate where the argument slips. 

  First, I need to unpack each component of the friend's argument. Duchamp's Fountain is indeed pivotal, but the claim that philosophers "gave up" on beauty and craft is an overstatement. Many philosophers still engage with these concepts, just not as necessary conditions. The institutional theory (Dickie, Danto) does position the art world as central, but it's more nuanced than "whatever they say goes." 

  Wittgenstein's family resemblance idea is often misunderstood. It's not that art can't be defined at all, but that it lacks a single essential trait. This actually challenges institutional theories by suggesting art's fluidity can't be pinned to one factor like institutional acceptance. 

  The banana example (Maurizio Cattelan) is valid institutional art, but it's not proof that "anything" can be art—only that the institutional process can legitimize unexpected objects. The tension the user senses is real: institutional theory is a definition (social but still a definition), while Wittgenstein implies definitions are futile. The friend conflates them as complementary, but they're fundamentally at odds. 

  The user's deeper need might be to reconcile their intuitive agreement (they accept the urinal as art) with their discomfort about the argument's slipperiness. They might also seek philosophical grounding for their own creative work—how to justify "non-beautiful" scenes as art without reducing art to mere social agreement. 

  I should clarify where the friend oversimplifies: Duchamp didn't make beauty irrelevant; he expanded art's possibilities. Institutional theory isn't the only response; other theories (historical, aesthetic) coexist. Wittgenstein's anti-essentialism doesn't endorse institutionalism—it could even undermine it. The "seam" the user notices is real: you can't simultaneously say "art is defined by institutions" and "art can't be defined." 

  The punchline about the banana and money holds only if you fully accept institutional theory, but even then, money relies on systemic function (a $20 bill must be issued by a treasury), while art's "acceptance" is more about discourse and context. The user might want this distinction highlighted to defend art's depth beyond social fiat.
answer: |-
  You've hit on a fascinating and genuinely complex debate in philosophy of art – and your intuition about the "slippery" conflation is spot-on. Your friend's summary is a popular, simplified narrative, but it contains significant oversimplifications, conflations, and philosophical tensions. Let's break it down claim by claim:

  ### 1. **"After Duchamp, philosophers gave up on beauty and craft as the markers of art."**
      *   **Partially True, But Overstated:** Duchamp's *Fountain* (1917) *was* revolutionary. It fundamentally challenged traditional definitions of art centered on aesthetic experience, beauty, technical skill (craft), and representation. Philosophers *did* have to confront the fact that something lacking these qualities could be seriously considered as art within an artistic context.
      *   **The Oversimplification:** Philosophers didn't simply "give up" on beauty and craft. Instead:
          *   They questioned whether these were *necessary and sufficient* conditions for art. Duchamp showed they weren't *necessary* (art can lack them). Later developments (like minimalism, conceptual art, some performance art) reinforced this.
          *   Beauty and craft were often **demoted** from being *defining* characteristics to being **possible characteristics** or **common features** of many artworks – but not essential to *all* art.
          *   New theories emerged that tried to account for *Fountain* and its successors *without* relying primarily on beauty/craft (like the Institutional Theory, Historical Theories, Neo-Wittgensteinianism).
          *   Many philosophers (e.g., Monroe Beardsley, revived interest in aesthetics via cognitive science) still see aesthetic experience as *central* to *much* art, even if not its sole defining feature.

  ### 2. **"The institutional view won — art is just whatever the artworld decides to treat as art."**
      *   **True that it's Influential, False that it "Won":** The Institutional Theory, most famously articulated by George Dickie (building on ideas from Arthur Danto), is indeed a major response to the Duchampian challenge. Dickie's core definition (simplified) is: *An artwork is an artifact of a kind created to be presented to an artworld public.* The "artworld" is the loosely defined system of artists, critics, curators, galleries, collectors, historians, etc.
      *   **The Key Nuances & Criticisms:**
          *   **Not Pure Fiat:** Dickie didn't claim it was *just* arbitrary declaration ("decides to treat"). He emphasized the *role* the object plays within an existing, historically developed *institutional framework* and practice. It's about *conferring the status of candidate for appreciation* within that specific context. It's a bit like making a knight: it requires a specific context (monarchy/chivalric order) and a specific act (dubbing), not just someone *saying* "you're a knight."
          *   **"Artworld" is Complex:** Defining the "artworld" is notoriously tricky. Is it everyone who calls themselves part of it? Only the elite? How do new members join? This circularity/elitism is a major criticism.
          *   **Competing Theories Thrive:** The Institutional Theory is prominent, but it's far from the only game in town. Other influential theories include:
              *   **Historical/Functional Definitions:** (e.g., Jerrold Levinson): Art is something intended for regard *in any way preexisting artworks are or were correctly regarded*. This emphasizes lineage and intention over a specific institution.
              *   **Procedural Definitions:** (Like Dickie's, but broader) Focus on the *process* or *context* of creation/presentation.
              *   **Aesthetic Definitions (Revived):** Some argue that even *Fountain* invites a certain kind of aesthetic *attention* (e.g., to form, concept, context) distinct from its utilitarian function, or that the *idea* it presents is the artwork and *is* aesthetically engaging.
              *   **Cognitive/Experiential Definitions:** Art is defined by its capacity to convey complex meaning, emotion, or experience in specific ways.

  ### 3. **"Duchamp proved that literally anything can become art if the right people nominate it."**
      *   **True in Practice, Philosophically Contentious:**
          *   **Empirically True:** Since Duchamp, countless "non-art" objects (urinals, Brillo boxes, dead sharks, unmade beds, bananas) *have* been presented as art and accepted as such by significant parts of the artworld.
          *   **Philosophical Tension:** This is where the Institutional Theory *seems* to lead. If the artworld confers status, and it accepts a banana on a wall, then it *is* art.
      *   **The Counterarguments:**
          *   **Not *Just* Nomination:** Institutionalists argue it's not merely "nomination" by "right people," but the object being *framed* within the complex practice and history of art (exhibition, discourse, intention, etc.). A random banana taped by a kid on their fridge isn't art, but Cattelan's *Comedian* (2019) arguably is, due to its context and intention within the artworld.
          *   **Against Anything-Goes:** Critics argue this makes art definitionally vacuous and vulnerable to elitism, fraud, or meaninglessness. They seek definitions with *some* constraints (intention, historical connection, aesthetic potential).
          *   **The "What is *Not* Art?" Problem:** If anything *can* be art, what distinguishes art from non-art? Institutionalists say "context and conferral." Others find this unsatisfying.

  ### 4. **"Wittgenstein had already shown with his family resemblance idea that art can't be defined anyway."**
      *   **True about Wittgenstein, Misapplied/Overstated regarding Art:**
          *   **Wittgenstein Correct:** Ludwig Wittgenstein argued (especially in *Philosophical Investigations*) against essentialist definitions for many concepts (like "games"). He proposed "family resemblances" instead: a network of overlapping similarities (A resembles B, B resembles C, C resembles D, but A and D may have no single thing in common), not one defining feature shared by all members.
          *   **Applied to Art (e.g., by Morris Weitz, Maurice Mandelbaum):** This approach suggests there's no single property (beauty, expressiveness, form, institutional status) common to *all* artworks. Art is an "open concept." New forms constantly emerge, sharing only loose resemblances to past art.
      *   **The Misapplication/Conflation:**
          *   **Not Proof for Institutional Theory:** This is the **crucial seam** you spotted! Wittgensteinian "family resemblances" is actually **incompatible** with the Institutional Theory *as a definition*. Why?
              *   **Institutional Theory IS a Definition:** It *proposes a specific necessary and sufficient condition* (conferral of status by the artworld). It *is* an attempt to define art, albeit socially/institutionally.
              *   **Wittgensteinianism is ANTI-Definitional:** It says such necessary-and-sufficient definitions are *impossible* for open concepts like art. Art can only be described through shifting clusters of resemblances.
          *   **Your Friend's Slippery Conflation:** She uses Wittgenstein's *anti-definitional* stance ("can't be defined anyway") as **support** for the Institutional Theory, which *is a definition*. These are fundamentally opposing positions! The Institutionalist *disagrees* with the Wittgensteinian; they think they *have* found the defining characteristic (institutional context). The Wittgensteinian says *no definition, including the institutional one, can capture the essence of art* because it has no fixed essence.
          *   **Nuance:** Some philosophers blend them *descriptively*. They might say *in practice*, the artworld identifies things based on family resemblances to past art, and the institutional context is the *arena* where those resemblances are recognized and status conferred. But logically, as definitions, they clash.

  ### 5. **Conclusion: "The definition of art is a pure social fact... like money." & The Banana/$20 Analogy.**
      *   **The Institutionalist Punchline:** This *is* the core claim of a strong Institutional Theory view: Art status is conferred by social agreement within a specific institution (the artworld), just like a $20 bill's value is conferred by social agreement within the financial system.
      *   **Does it Follow?** Only if you **fully accept the Institutional Theory as the *correct* definition** (ignoring Wittgensteinian objections and competing theories).
      *   **Problems with the Analogy:**
          *   **Function vs. Appreciation:** Money has a clear, functional purpose (medium of exchange, store of value) defined by its system. Art's "function" is far more nebulous (appreciation, meaning-making, challenge, experience?).
          *   **Stability vs. Fluidity:** Monetary systems strive for stability; the artworld thrives on challenging its own boundaries and definitions.
          *   **Necessity vs. Contingency:** Modern economies *need* a functional currency system. Society doesn't *need* the artworld in the same way; art could exist (and has) without a formalized "artworld."
          *   **The "Anything Goes" Problem (Revisited):** While *in theory* anything *could* be money (e.g., crypto), in practice, rigid systems control it. The artworld's boundaries are much fuzzier, making the "anything" claim seem stronger.
      *   **The Banana:** *Comedian* (the banana) *is* art under the Institutional view because it was created by a recognized artist (Cattelan), presented by a major gallery (Perrotin) at a major fair (Art Basel Miami), discussed critically, and purchased within the artworld system. Its value reflects the art market's dynamics (scarcity, provenance, artist's reputation, conceptual weight, spectacle), similar to how a $20's value reflects economic systems. This *does* illustrate the Institutional view in action. Whether this is the *best* or *only* way to understand art is the philosophical debate.

  ### Where Your Friend's Argument Slipped & What a Philosopher Might Say

  1.  **The Big Seam:** You nailed it. Conflating Wittgenstein's **anti-essentialist, anti-definitional** "family resemblances" argument with Dickie's **pro-definitional Institutional Theory** is the core error. They are contradictory responses to Duchamp. You can't use "art can't be defined" to support "art is defined as X."
  2.  **Overstatement of "Gave Up":** Philosophers didn't abandon beauty/craft; they reconfigured their role. Aesthetic properties remain crucial to *many* theories, just not as *absolute requirements*.
  3.  **Oversimplification of "Institutional View Won":** It's influential, not hegemonic. Competing theories offer different perspectives and critiques.
  4.  **Ambiguity of "Nomination":** Institutionalists stress it's not *just* naming by powerful people, but embedding within a complex practice with history and conventions.
  5.  **Tension in "Anything Can Be Art":** While empirically plausible post-Duchamp, many philosophers find this outcome theoretically unsatisfying and seek definitions with more substance or constraint.

  ### Philosopher's Takeaway

  *   **Duchamp Matters Hugely:** He shattered traditional definitions and forced philosophy to confront context, intention, and concept.
  *   **Institutional Theory is a Major Response:** It offers a plausible (to many) way to account for *Fountain*, the banana, and much contemporary art based on social/institutional context. Your friend captures its core *spirit*.
  *   **But It's Not the Only Game:** Competing theories persist, challenging its circularity, elitism, or emptiness.
  *   **Wittgenstein is Mismatched:** His "family resemblances" undermines the search for *any* single definition (including the Institutional one), it doesn't support it.
  *   **The Banana/$20 Analogy Works... for Institutionalists:** It perfectly illustrates *their* view. But whether that view fully captures what art *is*, or merely describes how it *functions* in the contemporary gallery system, remains hotly debated. Philosophers would argue the analogy breaks down under scrutiny (function vs. appreciation, necessity vs. contingency).

  Your inclination to accept *Fountain* as art while finding her argument slippery shows good instincts. The Institutional view explains *how* the urinal became art, but it doesn't necessarily exhaust *what makes it significant as art*. The debate continues because art's nature is as complex and contested as the human experiences it engages with. Your scenes without beauty *could* be art under Institutional, Historical, or certain Functional/Cognitive theories, but likely not under a strict Aesthetic definition – and that's the ongoing philosophical conversation.
