prompt: |-
  I write about science and ideas for a general readership, and every few months a manuscript or lecture crosses my desk that leans on Gödel's incompleteness theorems for a claim about something other than formal arithmetic. Over the years I've developed gut verdicts about when this is legitimate and when it's a red flag, and I'd like to know whether they add up to a principle, or whether I'm just tracking prestige. Here are the verdicts. A proof that some question about the physics of a toy quantum system is undecidable, reported as a genuine mathematical result about a physical model: legitimate, and good science writing. An argument that Gödel shows the human mind cannot be a machine: overreach, I feel, though it comes from serious people, so I hedge in print. A pop-philosophy book claiming Gödel proved that all truth is relative or that every belief system is self-undermining: an immediate red flag, no exceptions. An economist writing that no social theory can fully account for itself, "just as arithmetic cannot prove its own consistency": I wince but let it pass when the rest of the argument is good — and I can't say why that pass doesn't also cover the pop-philosophy book. A historian using incompleteness as one strand in explaining the collapse of Hilbert's program and the fading of a certain kind of foundational ambition: entirely legitimate, exactly what a history should do. And a reviewer saying the theorems counsel "epistemic humility" about science: I allow the loose version and would never print the claim that Gödel *proves* scientific theory can never be complete, though I'm not sure the distance between those two is a real distinction rather than a stylistic one. Please give me your analysis as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion: (1) the principle that best captures these verdicts, stated precisely; (2) the clause of it that each of my two hardest cases — the economist's metaphor and the humility-versus-proof line — motivates; (3) which of my verdicts the principle forces me to overturn, if any; (4) its verdict on a case I haven't listed, such as a theologian arguing from incompleteness to the incompleteness of any human theistic system, or a cryptographer leaning on undecidability for a security claim; and (5) what argument or consideration would move you to a different principle, or where your reasoning here is most likely to fail.
reasoning: |-
  Okay, let me approach this systematically. The user is a science writer who encounters various applications of Gödel's theorems in non-mathematical contexts and has developed intuitive judgments about their validity. They're seeking a principled framework to evaluate these cases consistently.

  First, I need to identify the core distinction in their examples. Legitimate uses seem to involve either: (1) direct mathematical analogs (like the quantum system proof), or (2) historical accounts of mathematics itself. Overreaches tend to apply the theorems as universal metaphors for limitation - the mind-machine debate, truth relativism, social theory parallels. The economist case sits uncomfortably in between.

  The key principle should address this boundary. I'm considering something about the necessity of structural isomorphism - when the target domain shares formal properties with Peano arithmetic that make incompleteness applicable. For the quantum case, the model likely contains sufficient arithmetic; for Hilbert's program history, it's directly about the theorem's mathematical impact. 

  For the economist's metaphor, this suggests adding a clause about how analogies require explicit mapping to relevant structures. The epistemic humility case would need a clause distinguishing mathematical incompleteness from general uncertainty. 

  Looking at unlisted cases: a theologian claiming human theistic systems are "incomplete" like arithmetic would violate the principle unless they demonstrate formal isomorphism. A cryptographer using undecidability might be legitimate if they show a reduction to the halting problem.

  The hardest part is whether this principle forces overturning any of the user's judgments. Their tolerance for the economist's phrasing might need revision under strict application, though perhaps the "hedging" they describe already aligns.

  A potential weakness in my reasoning: do toy models in physics truly contain sufficient arithmetic, or is this sometimes assumed? That could undermine the quantum system example's legitimacy. Also, the history case might be seen as purely expository rather than applying the theorem, which suggests refining the principle's scope.
answer: |-
  Here is the analysis as requested:

  1.  **Principle:** Legitimate application requires either a direct mathematical demonstration that the target system (e.g., a physical model, formal theory) contains sufficient arithmetic to trigger incompleteness, or an analysis strictly confined to the historical/intellectual impact of the theorems within mathematics or logic itself; metaphorical or suggestive applications outside these domains constitute overreach.
  2.  **Clauses Motivated by Hard Cases:** The economist's metaphor motivates the clause explicitly excluding non-mathematical, suggestive applications lacking formal demonstration ("metaphorical or suggestive applications outside these domains"). The "humility vs. proof" distinction motivates the clause requiring any claim about science's incompleteness *proven* by Gödel to meet the formal demonstration standard, while "humility" may be a loose, non-technical interpretation falling under suggestive application.
  3.  **Verdict to Overturn:** The principle forces overturning the tolerance for the economist's metaphor ("no social theory can fully account for itself, 'just as arithmetic cannot prove its own consistency'") as it is a core example of a prohibited suggestive application lacking formal demonstration specific to social theory.
  4.  **Verdict on Unlisted Cases:** A theologian arguing for the incompleteness of human theistic systems based *solely* on Gödelian incompleteness would be illegitimate overreach (suggestive metaphor). A cryptographer formally demonstrating that breaking a specific encryption scheme is equivalent to solving the Halting Problem or another undecidable problem would be legitimate (direct mathematical demonstration).
  5.  **Potential Failure Point:** The reasoning is most vulnerable if a domain outside formal arithmetic/logic/history is discovered to intrinsically and demonstrably embed the necessary recursive axiomatization and expressive power of Peano arithmetic (or a sufficiently powerful fragment) in a way directly relevant to its core properties, forcing an expansion of the "direct mathematical demonstration" scope beyond current physics models. Alternatively, a rigorous formalization of "social theory" or "mind" meeting the arithmetic embeddability criterion could challenge the principle's restrictions.
