  The advice would become more nuanced, acknowledging trade-offs rather than presenting simple swaps. Climate institutions might need to coordinate with animal welfare groups or develop integrated frameworks. Ultimately, this exposes how single-metric dietary advice can create unintended consequences when complex systems are reduced to one variable.
answer: |-
  The tension you describe reveals a fundamental conflict in value systems between climate-focused and animal-welfare approaches to dietary advice. Let's reconstruct the implicit axiology, assess underdetermination, and outline revised recommendations.

  ### Implicit Axiology of Climate-Focused Advice
  1. **Monistic Consequentialism**: Prioritizes a single outcome metric (greenhouse gas emissions/GHG), implicitly treating climate impact as the *sole* morally relevant consequence of dietary choices.
  2. **Anthropocentric Instrumentalism**: Animal suffering is either:
     - **Literally Valueless**: Animals lack moral status; their suffering is irrelevant.
     - **Excluded by Institutional Mandate**: Suffering is morally significant but falls outside the scope of climate organizations' missions ("division of moral labor").
  3. **Metric Narrowness**: Measures efficiency per *kilogram of meat* rather than per *nutrient unit* or *meal*, ignoring:
     - Scale of individual animal lives impacted
     - Wild animal deaths from feed production
     - Differences in suffering intensity (e.g., broiler chickens vs. beef cattle)

  ### Is the Practice Underdetermined?
  **Yes, but within constraints.** "Replace beef with chicken" remains justifiable under multiple non-zero weightings of animal welfare, but **not all**:
  - **Lower-Bound Threshold**: Chicken's GHG advantage is ~5-10x per kg (FAO estimates: beef ~27 kgCO₂-eq/kg; chicken ~6 kgCO₂-eq/kg). Beef requires ~16x fewer animal deaths per kg meat (1 cow ≈ 200 kg meat vs. 1 chicken ≈ 2 kg meat). For the swap to hold, climate benefits must outweigh welfare costs:  
    *If the moral weight of a chicken's suffering is <1/16th that of avoiding 1 kgCO₂-eq, the recommendation stands.*  
  - **Upper-Bound Flip Point**: Assigning high weight to animal welfare or including wild animal deaths (beef uses less cropland) reverses the ranking. Beef causes ~0.005 vertebrate deaths/kg meat vs. chicken's ~0.5 deaths/kg (including feed crops). At welfare weights where *1 death > moral value of 20 kgCO₂-eq saved*, beef becomes preferable.

  ### Revised Advice with Nontrivial Weighting on Welfare & Wild Animals
  Assuming a pluralistic axiology that values:
  - GHG reduction  
  - Minimizing farmed animal suffering  
  - Reducing wild animal deaths from agriculture  

  Recommendations would shift fundamentally:

  1. **Primary Advice**:  
     - **Reduce all meat consumption**, especially chicken and beef.  
     - **Prioritize plant-based proteins** (legumes, tofu) with low land-use and GHG impact.  

  2. **If Insisting on Meat**:  
     - **Choose smaller portions of chicken over beef** only when:  
       *GHG savings > (Animal deaths × Welfare weight) + (Crop-death differential × Wild-animal weight)*  
     - **Favor pasture-raised beef over poultry** if welfare weights are high and emissions constraints moderate (beef's lower death count dominates).  

  3. **System-Level Changes**:  
     - Advocate for **welfare reforms** (slower-growing chicken breeds) to reduce suffering per bird.  
     - Promote **regenerative grazing** to offset beef's carbon footprint while preserving grassland biodiversity.  

  4. **Nuanced Messaging**:  
     > *"While chicken has lower emissions than beef, it requires far more animal lives per meal. For true sustainability, prioritize plants. If eating meat, smaller portions of chicken can reduce emissions, but consider the ethical cost. Where possible, choose high-welfare options."*  

  ### Key Implications
  - **Institutional Coordination Failure**: Climate groups ignore welfare externalities; animal groups underweight climate. This creates contradictory public guidance.  
  - **Empirical Gaps**: Precise recommendations require better data on suffering intensity (e.g., Are 200 chicken lives worse than 1 cow's life?) and wild animal mortality per crop type.  
  - **Axiological Honesty**: Institutions should explicitly state their value boundaries (e.g., "Our advice addresses only climate impacts") to avoid implying comprehensive moral judgments.  

  **Conclusion**: Climate advice implicitly assumes animal suffering is either morally irrelevant or institutionally out-of-scope. The beef-to-chicken swap is robust only under low-to-moderate welfare weightings. With nontrivial weighting, recommendations pivot toward drastic meat reduction and plant prioritization, rejecting simple substitution frameworks. This suggests the current division of moral labor is incoherent for consumers seeking ethically consistent diets.
