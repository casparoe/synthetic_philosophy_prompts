answer: |-
  ## Philosophical Dialogue: The Necker Enigma and the Spectre of Phenomenality

  **Characters:**
  *   **Dr. Aris Thorne:** Professor of Cognitive Science (Illusionist)
  *   **Dr. Lena Voss:** Professor of Philosophy of Mind (Naturalist Realist)

  **Setting:** A quiet corner of the university common room, post-colloquium. Coffee cups sit half-empty.

  **(The dialogue begins mid-conversation, sparked by the earlier talk on consciousness.)**

  **Lena:** ...and that’s precisely why Chalmers’ formulation remains potent, Aris. Even granting every functional, representational, neurological detail you provide about the stabilised Necker cube subject – the retinal stability, the neural adaptation patterns, the report-conflict – it *still* feels like we’re missing the core question: what is it *like*, experientially, for the subject *during* the period when they insistently report the flipping? The explanatory gap yawns right there.

  **Aris:** (Leans forward, elbows on knees) But Lena, that’s precisely where the stabilised Necker protocol is so beautifully instructive. It *exposes* the gap, not as a feature of the world, but as a feature of our reporting machinery. The subject *sincerely* reports flipping. They’re earnest, confident. But their forced-choice discrimination – the behavioural anchor you naturalists usually cling to – is utterly at chance. They cannot reliably tell us, even a second later, which orientation they *just* experienced. Then, confronted with the cold, timestamped record of their own random button presses, they perform a stunning volte-face: “Oh, it was stable all along, I just felt pressure.” What does this tell us?

  **Lena:** It tells us their *judgements* about their experience were flawed, unstable, post-hoc reconstructions. It tells us nothing definitive about the *experience itself* during that initial period. Perhaps the phenomenal properties *were* present – fleeting, unstable qualia of flipping – but the subject’s access mechanisms for forming stable, reportable judgements about those very properties were impaired by the stabilisation. The retinal stability disrupts the normal feedback loops needed for metacognitive access, not necessarily the phenomenal character. Like trying to grasp smoke.

  **Aris:** Ah, the classic access/phenomenal consciousness distinction! A useful heuristic sometimes, Lena, but here it feels like a desperate salvage operation. You posit *two* mysterious failures: first, the generation of these supposedly real, intrinsic phenomenal flips despite retinal stability suppressing the neural correlates we associate with perceptual alternation. Second, a simultaneous, perfectly timed failure of the subject’s access machinery specifically for *reporting* or even *discriminating* these flips mere seconds after experiencing them. Yet, crucially, this access machinery works perfectly well for generating the *initial* confident report! They report flipping *while* they supposedly experience it, but cannot latch onto it even a moment later? That strains credulity. Occam’s razor suggests a simpler story: there *was* no phenomenal flipping. The initial report is a cognitive illusion generated by the expectation of alternation, perhaps driven by residual noise or attentional shifts misinterpreted. The confidence is part of the illusion. The later revision? That’s the cognitive system catching up with the behavioural reality – no discrimination, therefore no flipping to report. The ‘pressure’ they feel is the dissonance between their constructed report and the lack of any experiential anchor.

  **Lena:** (Taps her finger thoughtfully) You frame it well, Aris. The parsimony argument is strong. But let me push back. Firstly, the initial report isn’t *just* a confident utterance; it’s made *in earnest*. The subject truly believes, at that moment, they are experiencing flipping. Are you saying this belief, this seeming, is entirely unmoored from *any* phenomenal reality? That phenomenality reduces purely to the disposition to report? That seems perilously close to the behaviourism we both reject.

  **Aris:** Not disposition alone, no. There are rich internal cognitive and representational states involved. The subject represents the Necker cube, represents the *concept* of flipping, represents the expectation based on prior experience. Their visual system is trying to parse an ambiguous input under abnormal conditions. The ‘seeming’ of flipping is the output of this representational process – a judgement *about* what is being perceived, generated under cognitive pressure. But this judgement isn’t *caused* by some additional, intrinsic, non-representational ‘flipping-quale’. It *is* the core of what we misidentify as the phenomenal character. The seeming *is* the judgement. There’s nothing more to the ‘what-it’s-like’ than the having of those representational states and the associated cognitive feelings – like the ‘pressure’ they later report – which are themselves representational states *about* states.

  **Lena:** But Aris, doesn’t that dissolve the very notion of subjective perspective? Take the moment *before* any report, before any judgement. The subject sits, looking at the cube. According to you, there’s a complex representational state: a retinal image of lines, cognitive models of cubes, ambiguity signals. But what makes this state *for the subject*? What constitutes its subjective character, distinct from you, a third-party observer, simply describing those neural and representational facts? You seem to leave no room for the intrinsic subjective viewpoint itself. The representational state just *is*, neutrally. But experience isn’t neutral – it’s perspectival. *That* is the residue the illusionist account seems to evaporate.

  **Aris:** (Sighs, takes a sip of coffee) The perspectival nature, Lena, arises precisely from the fact that those representational states *are* embedded within a specific cognitive architecture – *this* brain, *this* body, with *this* unique history. The representations carry information *for the system* about its own state and the world. The ‘for-the-subject’-ness *is* the fact that these states are access-conscious within that specific system. It’s relational, not intrinsic. There’s no additional ‘light’ of subjectivity illuminating the representations; the system’s utilisation *of* those representations *is* the perspective. The stabilised Necker case beautifully shows this: when the system’s access to its own representational state is disrupted or rendered inconsistent (chance discrimination), its *judgements* about what it experiences become unstable and revisable, revealing that the seeming phenomenality was anchored only in those judgements and access capacities. Without stable access, the ‘phenomenal character’ evaporates because it never existed independently. The subject revises their claim about the experience *because there was no robust phenomenal fact of the matter to anchor it*.

  **Lena:** I see the elegance, I truly do. But let me try to strengthen your case before countering it, to show I’m not stubbornly ignoring its force. You’re arguing that the meta-cognitive access *constitutes* the seeming of phenomenality. When access is robust and consistent (as in normal Necker viewing, where report and discrimination align), we have a strong, stable sense of clear phenomenality. When access is disrupted or inconsistent (as in the stabilised case), the sense of phenomenality becomes unstable, contradictory, and ultimately revisable – because it *depends* on that access. The ‘pressure’ the subject feels is the cognitive dissonance of trying to maintain a judgement (‘it’s flipping’) unsupported by either consistent discriminatory access *or* (on your view) the phenomenal fact. This is compelling. It suggests our *belief* in phenomenality is tightly coupled to our access capabilities.

  **Aris:** (Nods appreciatively) Thank you, Lena. That’s a charitable and accurate rephrasing.

  **Lena:** Right. Now, my counter hinges on that word ‘believe’. You explain why we *believe* we have phenomenal consciousness – the meta-problem, as it’s sometimes called. You explain the mechanisms generating the reports, the confidences, the revisions, the feeling of pressure. And you do so elegantly in terms of representations, access, and cognitive dissonance. But explaining why we *believe* we see a ghost doesn’t explain the ghost away *if there is one*. Similarly, explaining why we believe in phenomenal properties – why it seems so utterly obvious – doesn’t explain *away* phenomenal properties, if they exist. Your account brilliantly explains the *seeming* and the *reports*, but it leaves untouched the core intuition: that the representations themselves, when accessed, have an intrinsic, qualitative character *over and above* their representational content and their being accessed. Why does representing ‘red’ *feel* a specific way different from representing ‘green’, even if the functional roles are distinct? Why does the cognitive dissonance *feel* like pressure? Your account describes the *judgements* about these feels, but not the feels themselves. The ghost might be elusive, but the feeling of haunting persists, unexplained by the creaky floorboards you meticulously catalogue.

  **Aris:** But Lena, the ‘feels themselves’ *are* the judgements, the access, the cognitive reactions! You keep positing this extra layer, this ‘ghost’, and then saying my explanation of the creaks and drafts doesn’t explain the ghost. But the whole point of illusionism is that the ‘ghost’ – the sense of an extra, intrinsic qualitative layer – *is itself part of the illusion generated by the cognitive mechanisms*. The feeling of pressure *is* a certain type of representational state – perhaps representing conflict, or uncertainty, or prediction error. It doesn’t *have* an intrinsic feel in addition; its being *that* type of representational state *is* what constitutes the feeling, *for the system*. There is no further question of ‘why it feels like *that*’ once the representational and functional facts are fixed. The seeming obviousness is powerful precisely *because* the cognitive mechanisms generating it are so fundamental and pervasive. It *has* to seem obvious, for the system to function as it does. But seeming obvious isn’t evidence of ontological reality. The earth *seemed* obviously flat.

  **Lena:** But the flat earth *appearance* was explained by local observations, and then superseded by better evidence and theory showing curvature. What’s the equivalent evidence *against* phenomenality? All you have is an explanation of why we *think* it’s there. The stabilised Necker case shows report and access can be dissociated from discrimination, and that judgements are revisable. It shows phenomenal *reports* are constructs. It doesn’t show phenomenal *properties* are absent. To use your metaphor: showing that reports of ghosts are unreliable constructs doesn’t prove ghosts don’t exist; it just proves the reports are unreliable. To prove ghosts don’t exist, you need independent reasons. Your independent reason seems to be ontological parsimony: we *can* explain the reports without ghosts, so we *should*. But parsimony cuts both ways. If the ‘ghost’ of phenomenality is the very thing we are trying to explain – the subjective character of experience – then eliminating it by fiat because it’s non-physical (or non-functional) isn’t parsimony; it’s changing the subject. You’re explaining *judgements* about consciousness, not consciousness itself. The hard problem persists because the qualitative residue – the difference between representing red and representing green *for the subject* – remains unaccounted for in purely functional/representational terms, even after all your explanations of reports and revisions.

  **Aris:** And you, Lena, keep insisting on this ‘qualitative residue’ that exists independently of any cognitive, functional, or representational facts we can point to. In the stabilised Necker case, what evidence could *possibly* convince you that phenomenality was absent during the initial report phase? Even the subject’s own sincere revision isn’t enough for you; you say it’s just a revision of judgement, not experience. But if no evidence accessible to the subject or to us as observers can settle the question of what the phenomenality ‘really’ was – because it’s supposedly private and independent of access and report – then how is this residue anything but a metaphysical posit? How does it differ from positing a soul? It becomes explanatorily inert, a philosophical wheel spinning without engaging the engine of science. My account *does* explain the difference between representing red and green *for the subject*: it’s the difference in the representational content itself and the functional/cognitive role that content plays *within* the subject’s cognitive architecture. The ‘for-the-subject’-ness *is* that embedded functional role. Adding an intrinsic quale is adding a ghost to the functional machine.

  **Lena:** It’s not inert, Aris. It’s the central datum! The ‘what-it’s-like’ is the starting point. And it’s not that *no* evidence is relevant. Coherent, stable, reportable, discriminable experience – like normal Necker viewing – provides strong evidence *for* the presence of specific phenomenal properties. Dissociation cases like the stabilised Necker, or blindsight, show that these properties can sometimes be present without the usual access or report (as I’d argue) or that access/report can occur without the usual phenomenal anchors (as you’d argue). The underdetermination cuts both ways. My point is that *your interpretation* of the stabilised case – that it shows phenomenality absent – requires you to *deny* the subject’s sincere initial report and *redefine* their experience purely by their later discriminatory failure and revised judgement. You *stipulate* that phenomenality must be tightly coupled to discrimination, which is precisely what the naturalist realist denies! You’re building your conclusion into your interpretation of the evidence. Whereas I can accept *all* the data: the sincere initial report (suggesting phenomenality), the discriminatory failure (suggesting impaired access), and the later revision (suggesting flawed judgement based on impaired access). My ontology accommodates the full complexity; yours seems to dismiss part of it (the initial seeming) as illusory.

  **Aris:** And yours, Lena, accommodates it by positing an entity – intrinsic, private, non-representational phenomenality – that is, by your own admission, potentially completely disconnected from the subject’s ability to know about it, report on it, or act upon it. In the critical period of the stabilised Necker trial, according to you, the subject might be having vivid flipping qualia, but these qualia leave no trace on their memory, their discrimination, or even their *later* sincere judgement about what happened. They are epiphenomenal to everything except the initial report, which you acknowledge can be generated even *without* them, as in cases of confabulation. So what causal or explanatory work is this flipping-quale actually doing? Its only role seems to be to satisfy the intuition that ‘there must be something more’. That’s the very definition of an illusory posit.

  **Lena:** It’s not epiphenomenal to the initial report. On my view, the flipping-quale (if present) is *part* of what makes the initial report sincere and confident. It’s part of the conscious state that grounds the report. And its seeming absence later, when discrimination fails, is what drives the dissonance leading to revision. It *is* doing work. But more fundamentally, its ‘work’ isn’t primarily causal in the push-pull physics sense; its work is ontological. It constitutes what experience *is*. Explaining why we believe in it doesn’t eliminate the ‘it’ that we believe in, any more than explaining why we believe in gravity eliminates gravity. The explanatory target *is* the qualitative character.

  **(A pause. Both sip their coffee, the impasse clear.)**

  **Aris:** So, Lena, if I had to pinpoint the single strongest reason why I remain unconvinced by your naturalist realism, it’s this: The stabilised Necker protocol, for me, demonstrates that the subject’s own sincere, contemporaneous judgement about their experience can be completely unmoored from behavioural discrimination *and* from their own later, equally sincere, retrospective judgement based on objective evidence. This reveals ‘phenomenal character’ not as a stable property of experience, but as a construct of report, vulnerable to revision based on access and evidence. To then posit an *additional*, hidden layer of ‘real’ phenomenality that flickered unseen during the initial period, unverifiable even by the subject moments later, feels like multiplying entities beyond necessity. It’s saving the phenomenon by making it permanently elusive. Your reply, while highlighting the underdetermination, doesn’t dissolve this fundamental methodological and ontological parsimony argument. Why posit the ghost when the creaks are fully explained by the drafty architecture?

  **Lena:** And for me, Aris, the strongest reason for resisting illusionism is precisely that core intuition your account seems to dismiss: the brute, undeniable presence of qualitative character in experience itself – the redness of red, the flipping *as experienced*. The stabilised Necker case is fascinating, showing judgement and access can be flawed and revisable, but it doesn’t demonstrate that the *target* of those judgements – the phenomenal properties – are illusions. It only shows our judgements *about* them can be. Your account brilliantly explains the judgements and the seeming, but it leaves the qualitative character itself unexplained and unaccounted for, redefining it out of existence. This feels like explaining *reports* of pain while denying the *painfulness* itself exists. Your invocation of parsimony doesn’t dissolve this; it feels like declaring the problem solved by changing the definition of ‘experience’. The hard problem remains hard precisely because the qualitative residue persists, irreducible, in the face of functional explanations. We must explain *it*, not explain it *away*.

  **(They look at each other, a mix of mutual respect and irreducible disagreement.)**

  **Aris:** (Smiles faintly) So, the ghost and the architecture.

  **Lena:** (Returns the smile) Indeed. The ghost *in* the architecture. Or perhaps, the architecture *as* ghost. Coffee’s cold. Same time next week?

  **Aris:** Always. I’ll bring biscuits. Digestives?

  **Lena:** Chocolate Hobnobs. Keep the debate energised.

  **(They gather their things. The dialogue ends, the debate unresolved, its contours sharpened.)**
