prompt: |-
  I'm a physician who joined the clinical ethics consultation service at a large teaching hospital about three months ago, and the abortion cases are the ones I feel least equipped to handle. Last month we saw a termination at 31 weeks for a fetus with bilateral renal agenesis — no possibility of sustained life outside the womb — and the following week an early first-trimester request that some of my colleagues wanted to refuse as a matter of "convenience." I found I had no principled way to explain why one case felt easy and the other hard, and I've decided that before I read another argument in the literature, I want to know what I should be demanding of a theory in the first place.

  You are a professional moral philosopher working at the boundary of normative ethics and bioethics. Think carefully, and brainstorm before committing to your final list — I would rather see requirements you considered and discarded or merged than a list you didn't have to fight over.

  Write the desiderata: what any adequate theory of the ethics of abortion has to deliver. For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or instead reflects a substantive commitment that a reasonable person could reject. At minimum, consider (though you need not accept):

  - which cases the theory must get determinately right, or at least not get wrong: pregnancy resulting from rape, contraception failure, a lethal fetal anomaly discovered late, a serious but not lethal threat to maternal health, and the request that even the clinicians involved describe as purely social;
  - which distinctions it must respect rather than collapse — killing versus letting die, the difference (if any) between a fetus, a newborn, and a patient in a permanent vegetative state, the difference between declining to sustain another person's body and actively ending a life that would otherwise continue;
  - the consistency constraints: a theory that entails that infanticide is permissible, or that contraception and even abstinence are seriously wrong because they deprive a future person of a future, must either own the implication or explain it away — I want to know which requirements, once adopted, force those costs;
  - what I'll call the line problem: the relevant biology is gradual — implantation, the emergence of sentience, viability that shifts with each generation of neonatal technology, birth itself — so any theory that concentrates enormous moral weight at a sharp line owes an account of why the line's location matters morally and not merely administratively;
  - what I'll call the responsibility problem: whether, and how much, it matters that a pregnancy resulted from voluntary intercourse, and whether a theory can weigh that at all without treating gestation as a penalty for assumed risk.

  Then flag which pairs of desiderata you suspect cannot be jointly satisfied — that is the part I most want to see — and identify the single requirement that, once adopted, excludes the most otherwise-live theories. If you have room at the end, briefly say how Thomson's bodily-autonomy approach, the future-like-ours argument, and a gradualist view that ties moral weight to developing neural capacities each fare against your list, but keep the weight on the criteria: I'll do the scoring with my committee.
reasoning: |-
  Okay, let me approach this systematically. The physician needs a framework to evaluate abortion ethics theories, so I'll start by identifying core challenges from their cases and listed concerns. 

  First, the bilateral renal agenesis case at 31 weeks versus the early "convenience" termination creates tension - why does severe fetal anomaly feel ethically clear while "social reasons" feel ambiguous? This suggests any theory must handle both viability-period anomalies and first-trimester autonomy without contradiction.

  The rape case immediately stands out as non-negotiable - no theory permitting forced gestation post-assault could be credible. But responsibility questions like contraception failure complicate matters: if we grant that voluntary sex implies some obligation, how much? And how does that square with the rape exception? 

  Gradual biological development poses a major hurdle. Viability shifts with technology, neural capacity emerges gradually - so theories drawing sharp lines (e.g. at birth) must justify why that precise threshold carries moral weight rather than being arbitrary. 

  I'm also seeing two explosive consistency traps: 1) If fetal personhood begins early, contraception might be problematic (future person deprived) 2) If late-term abortion is permissible due to dependency, does that extend to newborns? A theory must either avoid these or defend them coherently.

  The killing vs letting die distinction seems crucial too - is removing life support from a PVS patient equivalent to abortion? And what about declining to provide bodily resources versus active termination?

  Now for conflicting pairs: Emphasizing bodily autonomy (Thomson) handles rape beautifully but struggles with "social" late-term abortions. Future-like-ours arguments avoid infanticide but make contraception/early abortion ethically fraught. Gradualist views handle biology well but may lack clear clinical guidance. 

  The biggest trade-off appears to be between non-arbitrary thresholds and practical applicability. Perfect biological alignment risks indecision in urgent cases. But rigid lines feel morally unsatisfying - hence the physician's discomfort with the 31-week vs 1st-trimester contrast. 

  Ultimately, the most exclusionary requirement might be reconciling the viability paradox: as neonatal tech advances, the point of "sustainable life" changes, yet our ethical intuitions about late-term abortion don't shift accordingly. Any theory must either anchor personhood elsewhere or explain why viability's definitional instability doesn't matter.
answer: |-
  Here is a carefully constructed list of desiderata for an adequate theory of abortion ethics, with justifications, negotiability assessments, tensions flagged, and key exclusions identified. I've prioritized clarity and philosophical rigor per your request.

  ---

  ### **Core Desiderata for an Adequate Theory**  
  *(Motivating cases/considerations in italics; Non-negotiable [NN] vs. Negotiable [N] marked)*  

  1. **Non-Punitive Gestation for Rape** [NN]  
     - *Motivation*: Pregnancy from rape. No theory should force victims to sustain a pregnancy against their will.  
     - *Status*: Non-negotiable; failure here violates fundamental autonomy and dignity.  

  2. **Accommodation of Non-Viable Fetal Anomalies** [NN]  
     - *Motivation*: Bilateral renal agenesis at 31 weeks. When the fetus cannot survive ex utero, termination cannot coherently be labeled "killing a person."  
     - *Status*: Non-negotiable; conflating this with infanticide ignores biological reality.  

  3. **Distinction Between Killing and Letting Die** [N]  
     - *Motivation*: PVS patients vs. fetuses. Removing life support (letting die) is widely accepted; abortion (killing) is contested. A theory must explain if active termination is uniquely problematic.  
     - *Status*: Negotiable; some theories (e.g., strict bodily autonomy) collapse this distinction.  

  4. **Gradualist Biological Reality** [NN]  
     - *Motivation*: Shifting viability thresholds (e.g., 23 weeks today vs. 28 weeks in 1980). Moral weight cannot hinge on arbitrary technological milestones.  
     - *Status*: Non-negotiable; theories must either embrace gradualism or justify sharp lines *despite* biological continuity.  

  5. **Avoidance of Contraception/Abstinence Absurdity** [NN]  
     - *Motivation*: "Future-like-ours" arguments. If abortion is wrong because it deprives a future person, contraception and abstinence are equally wrong.  
     - *Status*: Non-negotiable; theories implying this must own it (e.g., anti-natalism) or be rejected.  

  6. **Infanticide Boundary** [NN]  
     - *Motivation*: Newborns vs. late-term fetuses. A theory permitting infanticide must defend it; else, it must explain why birth or another threshold breaks moral equivalence.  
     - *Status*: Non-negotiable; unintentionally permitting infanticide is fatal for clinical applicability.  

  7. **Responsibility Without Punishment** [N]  
     - *Motivation*: Contraception failure vs. rape. Voluntary intercourse may confer *some* obligation, but gestation cannot be framed as punitive "assumed risk."  
     - *Status*: Negotiable; libertarian views reject any responsibility, while moderate theories may weigh it.  

  8. **Maternal Health Prioritization** [NN]  
     - *Motivation*: Serious (non-lethal) threats to health (e.g., cardiac strain). Life/health interests of the pregnant person must outweigh fetal interests below viability.  
     - *Status*: Non-negotiable; failure violates medical ethics principles.  

  9. **First-Trimester Permissibility Default** [N]  
     - *Motivation*: Early "social" abortions. A theory need not endorse all reasons, but criminalizing early abortions (absent fetal personhood) is disproportionate.  
     - *Status*: Negotiable; personhood-at-conception views reject this.  

  ---

  ### **Key Tensions Between Desiderata**  
  **Bold = Most consequential conflicts**  
  - **(A) Gradualism (4) vs. Infanticide Boundary (6):** If moral weight increases smoothly, why is infanticide impermissible but late abortion (e.g., 32 weeks) tolerable in anomalies? Gradualism struggles to place a non-arbitrary upper bound.  
  - **(B) Responsibility (7) vs. Rape Exception (1):** If responsibility arises from voluntary sex, why does rape exempt one? Either responsibility is weak (undermining "social" abortion restrictions) or the exception is ad hoc.  
  - **(C) Killing vs. Letting Die (3) vs. Non-Viable Anomalies (2):** Letting a non-viable fetus die naturally (e.g., post-birth palliative care) vs. active termination. Both end the same life, but intuitions differ. A theory must unify or split these.  
  - ***(D) Contraception Absurdity (5) vs. First-Trimester Default (9):*** If early embryos have futures-like-ours, contraception is problematic. Rejecting (5) forces personhood later, easing (9); accepting (5) destroys (9).  

  ---

  ### **The Most Exclusionary Requirement**  
  **"Avoidance of Contraception/Abstinence Absurdity" (5)**  
  - *Why?* It immediately excludes:  
    - **Personhood-at-conception** theories (violates 5).  
    - **Strong "future-like-ours"** arguments (violates 5 unless they embrace anti-natalism).  
    - **Theistic "ensoulment-at-conception"** views (violates 5).  
  - Surviving theories must either:  
    - Deny early embryos have significant moral status (e.g., gradualist/sentience views), or  
    - Defend the absurdity (e.g., "contraception *is* wrong but tolerable").  

  ---

  ### **Brief Assessment of Major Theories**  
  1. **Thomson (Bodily Autonomy):**  
     - *Strengths*: Nails rape cases (1), avoids contraception absurdity (5), handles maternal health (8).  
     - *Weaknesses*: Struggles with late abortions for non-viable fetuses (is removal "killing"? (3)), ignores gradualism (4), trivializes "social" abortions (no framework to weigh reasons).  

  2. **Marquis (Future-Like-Ours):**  
     - *Strengths*: Explains wrongness of killing (3), protects newborns (6).  
     - *Weaknesses*: Implies contraception is wrong (fails 5), struggles with rape (1) and anomalies (2), ignores biological gradualism (4).  

  3. **Gradualism (Neural Capacities):**  
     - *Strengths*: Respects biology (4), avoids infanticide (6), allows early abortions (9).  
     - *Weaknesses*: Vague thresholds (when is sentience achieved?), ambiguous on "social" late abortions (may conflict with 6), struggles with responsibility (7).  

  ---

  ### **Conclusion for Your Committee**  
  The deepest fault line is **biological gradualism vs. the need for clinical bright lines**. No theory perfectly reconciles this, but the strongest candidates:  
  - Use **viability** as a *pragmatic* threshold (administrative, not moral),  
  - Ground early abortion permissibility in **lack of sentience/self-awareness**,  
  - Treat late abortions as exceptional (anomalies/maternal health) justified by **bodily integrity**,  
  - Explicitly **reject responsibility-based obligations** to avoid punitive frameworks.  

  **Most defensible path**: A gradualist view that accepts (1)-(6) and (8) as non-negotiable, treats (7) and (9) as context-dependent, and uses viability as a legal (not moral) cutoff. This forces hard choices on "social" late abortions but avoids the gravest pitfalls.  

  Would be glad to refine this with your team.
