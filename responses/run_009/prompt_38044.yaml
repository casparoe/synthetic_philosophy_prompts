prompt: |-
  I got into a huge argument with my brother-in-law over thanksgiving (he's a personal trainer, 43). he takes prescribed testosterone for "low T" and feels totally fine about it, but he's furious that Olympic sprinters might use the same hormone, and he also thinks my cousin's kid shouldn't get growth hormone just because the kid's healthy but projected to be 5'3". meanwhile my mom's on statins, i drink coffee like water during exam season, my friend takes beta-blockers before violin auditions because otherwise her hands shake (she says stage fright is technically a diagnosis?), and my sister got laser eye surgery not because she was going blind but because -8 diopters was annoying and she was sick of contacts. every person I ask where the actual "treatment" line is gives me a different answer, and I'm starting to suspect they're all just describing whatever their insurance already pays for, backwards.

  so before I argue about any of the policy stuff (what insurance should cover, what sports leagues should ban, whether parents get to pick their kid's height), I want the real spec first. write me the list of requirements any principled therapy/enhancement line has to meet: which cases it has to sort the way everyone reflexively sorts them (statins for a sick 65-year-old; vaccines, which fix nothing you have and add nothing you lack, so where do they even go; daily aspirin; the altitude tents distance runners sleep in versus injecting EPO, when both just raise your red blood cell count; cochlear implants, given that a big part of the Deaf community says deafness isn't a disease at all so an implant can't be a "cure"; hormone treatment for menopause, which is about as natural as it gets and which I definately want available); which distinctions it has to respect (between the state of your body and the act of changing it; between "back to average" and "good for you" — the average person used to have no fillings and died around 45; between what your body is doing and what your job demands, which is where the beta-blocker case really bites); and which moves it can't be allowed to make (can't just be "whatever a doctor prescribes," that's circular; can't let the verdict flip when the population average drifts — kids today are taller than their grandparents were, did grandpa's vitamins become enhancement retroactively?; can't assume natural equals good while also wanting menopause and appendicitis treated).

  for each requirement, say what case or worry forces it, and be honest about which ones probably can't be satisfied at the same time — I have a feeling the "don't move with the averages" requirement is already in a fight with the "normal species functioning is the baseline" one, which I gather is roughly what that bioethics guy Daniels goes with. if some subset of the list is jointly unsatisfiable, say that outright, that's the part I most want to see. then at the very end, one short paragraph each on how three contenders do against your list: the normal-functioning people, the transhumanists who think the whole distinction is fake, and the "it's just subnormal part-function, period" crowd. but keep the list the main event — the scorecard is for arguing with my brother-in-law, not the other way around.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're clearly frustrated with the inconsistent lines people draw between therapy and enhancement. The examples they provide—testosterone use, growth hormone, statins, beta-blockers—show how messy this distinction is in real life. Their deeper need seems to be finding a principled way to define this boundary that isn't arbitrary or hypocritical.

  First, I need to identify all the requirements they want for the therapy/enhancement line. They mentioned cases that must be sorted correctly, like statins for a 65-year-old or vaccines. Also, distinctions to respect, such as between body state and the act of changing it, or "back to average" vs. "good for you." And moves to avoid, like circular definitions based on doctor's prescriptions or shifting with population averages.

  The user also points out potential conflicts between requirements. For example, using "normal species functioning" as a baseline clashes with the requirement that the line shouldn't move with changing averages. If average height increases over generations, does that retroactively change what's considered therapy? That's a big tension.

  I recall Norman Daniels' normal functioning model, which defines health as species-typical functioning. But the user's examples challenge this. Vaccines don't restore function; they prevent disease. And if the species norm changes, the baseline shifts, which contradicts the "don't move with averages" requirement. So that conflict needs to be highlighted.

  Then there are cases like cochlear implants where the Deaf community rejects the idea that deafness is a disorder. This brings up the distinction between medical necessity and cultural identity. Any framework must handle such sociocultural contexts without imposing a single definition of health.

  The user also wants to avoid naturalistic fallacies. Treating menopause is accepted even though it's natural, so equating natural with good doesn't work. Similarly, rejecting enhancement just because it's artificial is inconsistent when we accept other interventions like glasses or surgeries.

  The distinction between internal and external demands is another key point. Beta-blockers for stage fright: is the problem the shaky hands or the performance context? If the job requires steady hands, does that make it a legitimate treatment? This ties into whether the issue is the body's state or societal expectations.

  Compounding all this is the insurance influence. People often define therapy as what insurance covers, which is circular. The framework needs to avoid such biases and be based on consistent principles instead of economic factors.

  Now, considering possible frameworks: Daniels' normal functioning model handles statins and growth hormone for projected short stature but fails on vaccines and might pathologize normal aging. The transhumanist view erases the line entirely, which simplifies things but ignores valid concerns about fairness and coercion. The subnormal part-function model (like Boorse) defines health statistically, but struggles with conditions like menopause or preventive measures.

  The user's examples reveal that no single framework satisfies all requirements. Each has strengths and flaws. For instance, the "don't move with averages" requirement conflicts with statistical models. The cochlear implant case challenges any model that doesn't incorporate subjective and cultural perspectives.

  In conclusion, the user needs to see that a perfect, universal line isn't feasible. Instead, context-specific judgments are necessary, acknowledging trade-offs. The frameworks each handle some cases well but fail others. This honesty helps the user in their argument by showing the inherent complexities rather than offering a false solution.
answer: |-
  Here’s a principled list of requirements for drawing the therapy/enhancement line, grounded in your examples and concerns. The core tension is that **no single framework satisfies all requirements simultaneously**, and some requirements conflict directly.

  ---

  ### **Core Requirements: What the Line MUST Do**
  1. **Accommodate Preventative Interventions**  
     *Must cover:* Vaccines, daily aspirin (for high-risk patients).  
     *Why:* These don't "fix" an existing pathology but prevent future harm. Vaccines add immunity you lack; aspirin reduces clotting risk.  
     *Forced by:* Vaccines – they're uncontroversially "medical" but don't fit "fixing dysfunction" models.

  2. **Distinguish Bodily State vs. External Demand**  
     *Must cover:* Beta-blockers for stage fright vs. essential tremor.  
     *Why:* Shaky hands *in auditions* may stem from normal stress responses, not pathology. The "problem" is the performance context, not the body.  
     *Forced by:* Beta-blockers – if "enhancement" hinges on *why* the trait is problematic (job vs. intrinsic function).

  3. **Treat Age-Related or Natural Processes as Legitimate Targets**  
     *Must cover:* Statins for atherosclerosis in a 65-year-old, hormone therapy for severe menopause symptoms.  
     *Why:* Aging increases disease risk; menopause causes genuine suffering. "Natural" ≠ "untreatable".  
     *Forced by:* Statins/menopause – rejecting these would violate medical norms.

  4. **Respect Cultural/Social Definitions of Health**  
     *Must cover:* Cochlear implants as *optional* for some Deaf individuals, not a universal "cure".  
     *Why:* Deafness isn't intrinsically pathological to many in the Deaf community. Medicalization can be oppressive.  
     *Forced by:* Cochlear implants – health isn't purely biological.

  5. **Avoid Circularity (No "Doctor Knows Best" or "Insurance Decides")**  
     *Must exclude:* Defining therapy solely by prescription or insurance coverage.  
     *Why:* Circular and tautological. Doctors/insurers use vague standards too.  
     *Forced by:* Your core complaint – this hides the real criteria.

  6. **Be Stable Over Time & Population Shifts**  
     *Must cover:* Grandpa's vitamins shouldn't retroactively become "enhancement" because modern kids are taller.  
     *Why:* Moral judgments shouldn't flip with statistical drift.  
     *Forced by:* Historical height changes – ethics shouldn't be relative to ephemeral averages.

  7. **Reject the "Natural = Good" Fallacy**  
     *Must cover:* Appendectomies (unnatural) are therapy; untreated menopause (natural) can be harmful.  
     *Why:* Nature includes smallpox and ruptured appendices.  
     *Forced by:* Menopause – demanding "natural" would deny relief for real suffering.

  ---

  ### **Key Distinctions the Line MUST Respect**
  - **Restoration vs. Optimization:**  
    Statins *restore* cardiovascular risk toward baseline; EPO *optimizes* RBC count beyond normal for athletic advantage.  
    *Problem:* "Baseline" is contested (see conflicts below).  
  - **Disease vs. Statistical Variation:**  
    Growth hormone for a child with a pituitary tumor (disease) vs. projected height of 5'3" (statistical low end).  
    *Problem:* Is "disease" objective or socially defined?  
  - **Internal Dysfunction vs. Mismatched Environment:**  
    Beta-blockers for essential tremor (internal) vs. audition nerves (environmental mismatch).  
    *Problem:* Many "disorders" (e.g., ADHD) reflect environmental misfit.

  ---

  ### **Forbidden Moves (Lines the Framework CAN’T Make)**
  - **"Whatever a doctor prescribes"** → Circular.  
  - **"Fixes a disease"** → Fails on vaccines and prevention.  
  - **"Returns to species-typical function"** → Shifts with averages (violates #6).  
  - **"Natural is better"** → Contradicts #7.  
  - **"Makes you sub-normal without it"** → Would classify glasses as enhancement.

  ---

  ### **Inherent Conflicts & Unsatisfiable Requirements**
  **The Central Tensions:**  
  1. **"Normal Functioning" vs. "Stable Baseline" (#6 vs. Daniels' Model):**  
     If therapy restores "species-typical functioning," but the species norm changes (height, lifespan), the line moves. Grandpa’s vitamins *would* retroactively become enhancement. **These conflict irreconcilably.**  

  2. **Prevention vs. Treatment (#1 vs. "Fixing Dysfunction"):**  
     Vaccines prevent disease but don’t "fix" anything. A model requiring existing pathology (like Boorse's) excludes them.  

  3. **Bodily State vs. Context (#2 vs. Medical Models):**  
     Is "stage fright" a bodily disorder or a normal response to stress? Medical models prioritize the body; social models see context. **No framework fully resolves this.**  

  4. **Cultural Relativity vs. Universality (#4 vs. Objective Biology):**  
     Cochlear implants are therapy to hearing people but enhancement to some Deaf activists. A purely biological standard ignores this; a cultural standard risks relativism.  

  **Verdict:** **No framework satisfies all requirements.** Trade-offs are unavoidable. The "perfect" line is a myth.

  ---

  ### **Scorecard: How 3 Frameworks Handle Your Cases**
  1. **Normal-Functioning (Norman Daniels):**  
     - ✅ Statins, growth hormone for tumor-related short stature, cochlear implants for acquired deafness.  
     - ❌ Fails vaccines (no dysfunction to fix), labels *projected* 5'3" as enhancement.  
     - ⚠️ Arbitrary on menopause (is it "normal aging"?), ignores cultural views of Deafness.  
     - **Fatal Flaw:** Line drifts with species norms (violates #6).  

  2. **Transhumanist (Enhancement = Therapy):**  
     - ✅ Laser eye surgery, beta-blockers for auditions, testosterone for athletic performance, growth hormone for height.  
     - ❌ No distinction at all → can’t justify banning EPO in sports or limiting risky enhancements.  
     - ⚠️ Ignores fairness/coercion concerns (e.g., "must dope to compete").  
     - **Fatal Flaw:** Violates #5 (circularity) by making "therapy" meaningless.  

  3. **Subnormal Part-Function (e.g., Boorse’s Statistical Dysfunction):**  
     - ✅ Statins (fixes statistical deviation in lipids), growth hormone for pathologic short stature.  
     - ❌ Fails vaccines and aspirin (no *current* deviation), labels menopause as "normal" aging (not treatable).  
     - ⚠️ Calls projected 5'3" "enhancement," pathologizes statistically low traits (e.g., IQ 85).  
     - **Fatal Flaw:** Violates #1 (prevention) and #7 (natural ≠ good).

  ---

  **Conclusion for Your Brother-in-Law:**  
  The therapy/enhancement distinction is **fundamentally unstable** because it tries to answer three different questions at once:  
  - *Medical*: "Does this reduce suffering/disease?"  
  - *Moral*: "Is this fair/coercive?" (e.g., sports, height pressure on kids).  
  - *Social*: "What counts as a 'good' life?" (e.g., Deafness, menopause).  
    
  Your examples prove no single line works. Policy debates (insurance, sports, parenting) must acknowledge these tensions upfront – or admit they’re drawing arbitrary lines based on values, not biology. His testosterone *is* enhancement if we define it as "improving function beyond baseline," but so are statins. The real issue isn’t the hormone; it’s **why, and for whom, we tolerate crossing the blurry line**.
