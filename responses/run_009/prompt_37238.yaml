  Below is a comprehensive, step-by-step plan for your ambiguity aversion activity, designed to fit within a 75-minute section. It incorporates hands-on discovery, theoretical connections, and practical troubleshooting.

  ---

  ### **Activity Structure: "The Mystery Urn Game"**
  **Learning Goal**: Students discover ambiguity aversion through choices, then connect it to Savage axioms, Dutch books, and maxmin preferences.  
  **Materials**: Two physical urns (jars/boxes), red/black balls (or colored paper slips), tokens (for raffle tickets/candy), slips for choices, projector/whiteboard.  
  **Urns Setup**:
  - **Urn A (Known)**: Exactly 50 red, 50 black balls.  
  - **Urn B (Ambiguous)**: 100 balls with unknown red/black composition.  

  > **Key**: Urn B is prepared secretly before class. Use a "neutral" method (e.g., a coin flip for each ball) to avoid adversarial perceptions initially. Reveal this *after* the activity to avoid anchoring.

  ---

  ### **Step-by-Step Flow**  
  **Total Time**: 65-70 minutes (5-10 min buffer).

  #### **1. Introduction (5 min)**  
  - Explain the game: "We’re playing a betting game with two urns. Your choices earn tokens for a raffle (candy/extra credit)."  
  - Show Urn A (shake to mix). For Urn B: "This was filled by a random process before class. I don’t know the mix."  
  - **Incentives**: Tokens = raffle tickets (1 token = 1 entry). Prizes: 2 candy bars or 2 extra-credit points.  

  #### **2. Round 1: Baseline Choices (15 min)**  
  - **Choices** (hand out slips; students choose one option per pair):  
    - **Choice 1**: Bet on Urn A red (50% known) **vs.** Urn B red (unknown).  
    - **Choice 2**: Bet on Urn A black (50% known) **vs.** Urn B black (unknown).  
    - **Choice 3**: Bet on Urn B red (unknown) **vs.** Urn C red (known 30% red, 70% black).  
      > **Urn C**: A new urn with a known but unattractive mix (30 red/70 black). *Reveal this urn only during Choice 3*.  
  - **Elicitation**:  
    - Students write choices on slips with their ID.  
    - Collect and tabulate on whiteboard (e.g., "Urn A red: 15 votes; Urn B red: 3 votes").  
  - **Expected Result**:  
    - >80% choose Urn A in Choices 1 and 2 (ambiguity aversion).  
    - >60% choose Urn C in Choice 3 (aversion isn’t just risk aversion—30% is preferred to ambiguous 50%).  

  #### **3. Round 2: Adversarial Twist (15 min)**  
  - **Set up**: "Now, Urn B was designed by a classmate during the break. Their goal was to make it hard for you to win." (Pick a student volunteer beforehand to secretly fill Urn B adversarially, e.g., 90% red).  
  - **Same choices as Round 1**: Students re-submit slips.  
  - **Tabulate and compare**: Highlight if aversion *increased* (e.g., Urn B choices drop from 20% to 5%).  

  #### **4. Resolution & Payout (5 min)**  
  - Randomly select **one** choice per round to resolve (draw from a hat).  
  - For that choice, draw balls from the relevant urns: Winners get tokens (1 token per winning bet).  
    > **Efficiency**: For grouped bets (e.g., all Urn A red bets), draw once—all win/lose together.  

  ---

  ### **Debrief & Theory Integration (25 min)**  
  Use tabulated data to drive discussion:  

  #### **1. Discover Ambiguity Aversion**  
  - Show aggregate results: "In Round 1, you preferred Urn A for red *and* black. But if Urn B had a single prior, this implies you think P(red) < 50% *and* P(black) < 50%—impossible!"  
  - **Key Insight**: Students treated "unknown" as worse than "known 50%," even though both have objective 50% chance (Ellsberg paradox).  

  #### **2. Separate from Risk Aversion**  
  - Point to Choice 3: "You preferred a known 30% chance (Urn C) over an ambiguous 50% (Urn B). If you were only risk-averse, you’d *prefer* the ambiguous urn (higher max payoff). This is ambiguity aversion."  

  #### **3. Theoretical Violations**  
  - **Savage’s Sure-Thing Principle**:  
    - "Choosing Urn A in both bets violates independence: Your choice should depend only on outcomes when the two urns differ (red vs. black), but you let ‘ambiguity’ sway you."  
  - **Dutch Book Incoherence**:  
    - "Imagine I sold you two bets: Urn A red and Urn A black. You’d pay 1.1 tokens for both (since P(red) + P(black) = 1.0). But if you treat Urn B as P(red) < 0.5 and P(black) < 0.5, I can ‘book’ you by selling Urn B bets for less than 1.0 total."  
  - **Maxmin Foundations**:  
    - "Your choices match Gilboa-Schmeidler: You act as if Urn B has a *set* of priors (e.g., P(red) = 20–80%), and you maximize the worst-case outcome. Urn A’s worst-case is 50%; Urn B’s is 0%."  

  #### **4. Limits of the Activity**  
  - **Unsettled Debates**:  
    - "This doesn’t prove if ambiguity aversion is ‘irrational.’ Some argue it’s smart in adversarial settings (Round 2); others say it’s a bias when no opponent exists."  
    - "We can’t test if this stems from an inability to randomize—hypothetical polls control for that, but our game doesn’t."  
  - **Noisy Data**: With 18 students, results may not be perfect (e.g., 60% choose Urn A instead of 80%). **Mitigation**: Show classic Ellsberg data alongside yours.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"Gaming" the System**:  
     - *Risk*: Students coordinate to "beat" the adversarial urn.  
     - *Fix*: Emphasize individual incentives ("Tokens boost your personal raffle chances"). Use anonymous IDs on slips.  

  2. **Noisy/Inconclusive Data**:  
     - *Risk*: Small sample → weak preference reversals (e.g., Urn A wins 55-45%).  
     - *Fix*: Pre-load slides with Ellsberg’s original data (90% chose known urns). Say: "Our sample is small, but globally, this effect is robust."  

  3. **Misinterpreting Ambiguity**:  
     - *Risk*: Students assume Urn B is adversarial from the start.  
     - *Fix*: Stress Round 1’s neutrality ("filled by coin flips"). Reveal the process post-activity.  

  4. **Time Crunch**:  
     - *Risk*: Resolving bets takes too long.  
     - *Fix*: Use group-resolution (e.g., all Urn A red bets resolved with one draw). Skip Round 2 if needed—focus on Round 1 + debrief.  

  5. **Philosophy Students Over-Rationalizing**:  
     - *Risk*: They "logic away" aversion ("I *should* be indifferent").  
     - *Fix*: Ask: "Did your gut feel uneasy about Urn B? That’s the point—even when we ‘know better,’ we feel ambiguity aversion."  

  ---

  ### **Why This Works**  
  - **Discovery-First**: Students see their own choices violating rational axioms.  
  - **Theoretical Bridge**: Data maps directly to Savage (unique prior), Dutch books (incoherence), and maxmin (sets of priors).  
  - **Nuance**: Round 2 tests if aversion hinges on adversarial intent; Choice 3 isolates ambiguity from risk.  
  - **No-Tech Fit**: Uses slips/hand-raising; tokens incentivize without real money.  

  **Final Tip**: Run a dry test with a colleague to refine timing. Good luck!
