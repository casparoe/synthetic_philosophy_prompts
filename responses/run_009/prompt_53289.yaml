prompt: |-
  I co-host a small podcast at the intersection of ethics and technology, and our upcoming guest is a philosopher who defends a view she calls scalar moral status: the claim that moral status is not an on/off property but comes in degrees, tracking the richness of a creature's valenced experience. On her picture, there is a continuum running from thermostats and simple control systems (whose status is vanishingly small, though she resists saying it is exactly zero) through insects, fish, and mammals, up to humans and perhaps beyond, with no sharp cutoffs anywhere. She is promoting a book on the subject and has a reliable deflection ready for the obvious objection: she says that nobody is claiming we owe anything to a thermostat, and that the interesting cases live in the murky middle between the obviously negligible and the obviously considerable.

  I would like a set of eight to ten interview questions that press on the actual content of the view rather than inviting her to restate it. Specifically, I want at least one question on each of the following. First, the practical difference between vanishingly small status and no status at all: does her view ever change what we should do, or does it just repaint the same decisions in finer detail? Second, aggregation: if insect suffering has very low but nonzero weight, can enough of it outweigh a smaller amount of intense suffering in beings like pigs or humans, and what does she say to the worry that this makes the view hostage to wildly uncertain estimates of insect populations and their inner lives? Third, the relationship between degrees of moral status and degrees of welfare: if status just scales how bad a given episode of suffering is, is that really distinct from saying that insect suffering is simply far less intense? Fourth, how the view is supposed to guide action under uncertainty about which creatures are sentient at all — does she endorse something like expectation-maximizing over candidate statuses, and doesn't that reintroduce effective thresholds at the point where expected value goes to zero?

  For each question, please also include a follow-up keyed to the answer she is most likely to give, so that I can push past her preferred framing. She is very articulate and comfortable at the level of principle, so I would especially value questions that force her down to concrete cases — pest control, food choices, research on insects, engineering simple robots that respond to damage. Please keep the questions substantive but conversational enough to ask aloud on air.
reasoning: |-
  Okay, the user co-hosts a podcast on ethics and technology and is preparing for an interview with a philosopher advocating scalar moral status. They want questions that dig into the practical implications rather than letting the guest restate her theory. 

  First, let's unpack what the user needs. They specified four key areas: practical difference between negligible status vs zero status, aggregation problems with tiny moral weights, the relationship between moral status scaling and welfare intensity, and decision-making under sentience uncertainty. The follow-ups must push past the guest's rehearsed answers using concrete examples like pest control or insect research.

  Hmm, the guest's "murky middle" deflection is predictable - she'll dismiss thermostat concerns to focus on borderline cases. So questions must force her to confront the extremes she considers negligible. For instance: if thermostats have infinitesimal status, does that create any actual obligation? And if not, why not collapse it to zero? That probes whether the scalar framework changes actions or just adds philosophical nuance.

  For aggregation, the user worries about tractability. If insect suffering has nonzero weight, but estimating populations and sentience is near-impossible, how can we ever make real decisions? A follow-up could use agricultural pesticides: billions of insects die, but uncertainty about their inner lives might make expected value calculations meaningless. Does her theory offer guidance here, or just say "it's complicated"?

  The status-vs-welfare distinction feels slippery. If hurting a bee is bad because it's a mild pain (low welfare intensity) versus bad because bees have low moral status (scaling factor), what observable difference does it make? A follow-up could ask if the scalar view just relabels what utilitarians already say about diminishing marginal disutility.

  On uncertainty, the guest might endorse expected value maximization. But follow-up: if we assign a 0.0001% chance of sentience to a robot, and it functionally multiplies to zero in decisions, isn't that a de facto threshold? That exposes whether scalar status avoids binary categorizations in practice or just in theory.

  User seems sophisticated - they name-dropped expectation-maximizing and valenced experiences. Questions should match that level but stay conversational. Examples like lab research on fruit flies or engineering resilient robots will ground it. No jargon dumps; keep it podcast-friendly.

  Also, the guest is book-promoting and articulate. Questions must resist her framing without being hostile. Follow-ups should be "help me understand" not "gotcha." For instance: "You've said X, but in scenario Y, wouldn't that imply Z?" lets her clarify while pressing the point.

  Biggest risk is letting her retreat to "interesting cases are in the middle." Every question must anchor to concrete stakes: food choices (veganism?), pest control (mosquito nets?), tech (damage-responsive robots). Make the abstract tangible.
answer: |-
  Here are eight interview questions addressing your specified areas, each with a concrete follow-up designed to bypass deflection and press the view's practical implications:

  ### 1. **Practical Difference: Vanishingly Small vs. Zero Status**  
     *Question:* "You argue thermostats have *vanishingly small* moral status rather than zero. In concrete terms: does this imply any actual obligation? For example, if I could prevent a million thermostats from being ‘distressed’ (e.g., overheating) at trivial cost to myself, should I do it? If not, why not treat their status as zero?"  
     *Likely Reply/Follow-Up:* If she says "no practical obligation," ask: **"Doesn’t this make ‘vanishingly small status’ functionally identical to zero status in *all* real-world decisions? Is the distinction more metaphysical than ethical?"**  

  ### 2. **Aggregation: Tiny Weights & Uncertain Populations**  
     *Question:* "If a single insect’s suffering has low-but-nonzero moral weight, could a massive swarm’s suffering outweigh, say, a pig’s intense pain? Take agricultural pesticides: billions of insects die per hectare. How would we weigh that against the welfare of one factory-farmed pig?"  
     *Likely Reply/Follow-Up:* If she acknowledges aggregation *could* matter, ask: **"Given wild uncertainty about insect sentience and population sizes, how can we avoid paralyzing indecision? Does scalar theory demand impossible precision?"**  

  ### 3. **Status vs. Welfare Intensity**  
     *Question:* "When we say ‘insect suffering matters less,’ is that because their *pain is less intense* (e.g., a milder experience) or because their *moral status discounts it*? If a bee’s sting response is neurologically similar to a mammal’s pain, what observable difference does ‘low status’ make?"  
     *Likely Reply/Follow-Up:* If she distinguishes status from pain intensity, ask: **"Couldn’t we explain all your examples by just varying pain intensity? What experiment or observation *could* distinguish scalar status from ‘weaker experiences’?"**  

  ### 4. **Decision-Making Under Sentience Uncertainty**  
     *Question:* "For beings of unclear sentience—like AI or jellyfish—you suggest weighing the *probability* they feel. Does this mean we should maximize expected moral value? For instance, should we avoid stepping on robot ‘ants’ if they have a 0.1% chance of valenced experience?"  
     *Likely Reply/Follow-Up:* If she endorses expected value, ask: **"When probabilities are extremely low (e.g., 0.0001%), doesn’t multiplying tiny status by tiny probability collapse back to zero—recreating a *de facto* threshold?"**  

  ### 5. **Thresholds in Practice: Pest Control**  
     *Question:* "In pest control, we routinely kill insects to prevent disease (e.g., mosquitoes). Does scalar status change how we should approach this? Or does it merely confirm intuitions that mosquitoes matter *less* than mammals, without altering decisions?"  
     *Likely Reply/Follow-Up:* If she says it nuances decisions, ask: **"What *specific* mosquito-control policy would your view recommend that a binary view wouldn’t? For example, would it demand slower, more expensive methods?"**  

  ### 6. **Food Choices & Scale**  
     *Question:* "Vegans avoid meat due to animal status. If insects have very low status, should entomophagy (eating crickets) be ethically preferable to plant-based diets, given that harvesting crops also kills insects?"  
     *Likely Reply/Follow-Up:* If she endorses insect consumption, ask: **"If farming 1 billion crickets causes less suffering than harvesting 1 field of wheat (due to collateral insect deaths), does scalar status oblige us to eat insects?"**  

  ### 7. **Research Ethics: Testing on Borderline Cases**  
     *Question:* "Labs use fruit flies for invasive research. If they have low-but-nonzero status, does scalar theory demand stricter justification than ‘they’re just insects’? How should researchers weigh a fly’s suffering against potential human benefits?"  
     *Likely Reply/Follow-Up:* If she calls for greater caution, ask: **"Would you oppose a cancer study using 10,000 fruit flies if it had a 0.1% chance of saving a human? How does scalar math resolve this?"**  

  ### 8. **Robotics & Emergent Valence**  
     *Question:* "You mention thermostats as the low end of status. If we engineer a robot that ‘screams’ when damaged and learns to avoid harm, at what point—if ever—should we assign it non-zero status? What test would trigger concern?"  
     *Likely Reply/Follow-Up:* If she points to behavioral complexity, ask: **"If a robot’s pain-behavior is indistinguishable from a lobster’s, but we *know* it lacks consciousness, does it still have moral status? If not, does scalar status reduce to ‘functional consciousness’?"**  

  ---

  ### Key Tactics Embedded:  
  1. **Force Concreteness:** Questions anchor to pests, food, labs, and robots—avoiding abstract "murky middle" escapes.  
  2. **Pressure Functional Equivalence:** Repeatedly ask how scalar status changes *actions* (e.g., "Does this alter policy or just description?").  
  3. **Highlight Epistemic Burdens:** Follow-ups target uncertainty in aggregation and probability, forcing her to address decision paralysis.  
  4. **Test Boundaries:** Use thermostats/robots to probe whether "non-zero" is meaningful, and insects/pigs to stress-test aggregation.  
  5. **Avoid Restatement Traps:** Follow-ups directly challenge her likely replies rather than inviting elaboration.  

  These questions respect her articulation while demanding the theory "show its work" in messy real-world trade-offs—exactly where scalar claims face the toughest scrutiny. Good luck with the interview!
