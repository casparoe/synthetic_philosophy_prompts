  We need rules that fit all five past verdicts but disagree on the kidney case.

  **Rule A (Strong Rescue Duty):** One must prevent serious harm to another when one can do so without sacrificing anything of comparable moral importance. The threshold for "comparable moral importance" is very high, so that only very grave sacrifices (like death or permanent severe disability) are excused.

