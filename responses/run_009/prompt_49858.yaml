prompt: |-
  I am a doctoral student in counseling psychology, currently on practicum at a large university's counseling center, where I co-facilitate a weekly psychoeducation group on stress and perfectionism for graduate students (about ten to twelve clients per session, fifty minutes, CBT-informed but not individual therapy). A striking proportion of the group's members arrive already fluent in pop-Stoicism — a meditation app, a daily-quote newsletter, a bestselling modern manual — and the dichotomy of control is the idea they reach for most often. In its classical form, it partitions everything into what is up to us (on the standard reading, our judgments, intentions, and impulses) and what is not (bodily states, other people, reputations, and outcomes generally), and counsels confining one's concern to the first class. The mass-market versions vary: some preserve the strict dichotomy; the most influential popular revision, due to William Irvine, softens it into a trichotomy — things fully in one's control, things partially in one's control, things entirely outside it — with the advice that for the middle category one should set internal goals (do your best in the performance rather than aim at winning). The Stoics themselves, of course, said more than the slogan suggests: externals were classed as "indifferents," but as preferred or dispreferred ones, and the tradition plainly counsels undertaking what are usually called appropriate actions toward externals even while withholding one's happiness from their outcomes. My clients, understandably, have none of this background, and the doctrine they actually hold is whatever their app taught them on Tuesday.

  My problem is that in the moment — a group member says the app told her that her anxiety about the academic job market is irrational because the outcome is not up to her, so she should let it go — I have no principled basis for deciding when this framing is a genuinely useful cognitive reframing and when it is quietly harmful. Sometimes it functions like textbook decatastrophizing and relabeling of a worry as outside one's agency; sometimes it rationalizes disengagement from preparation the person could perfectly well do; and sometimes, most troublingly, it becomes a tool a client deploys against herself, as with one group member whose partner tells her she cannot control his behavior and should therefore work on her own reactions, a usage I suspect of licensing passivity in a deteriorating relationship. My supervisor, a cognitive-behavioral clinician with no patience for ancient philosophy, has asked me to produce something she can sign off on, and my own philosophical reading (largely of the popular literature, plus some Epictetus and Marcus Aurelius in translation) is not yet systematic enough to generate it.

  Please write a decision procedure I could actually run, in a few minutes, on an instance of a client deploying dichotomy-of-control reasoning — whether it arises in group, in a brief post-session check-in, or in the psychoeducational materials we distribute. The procedure should do the following, in whatever order you think is defensible: distinguish the situations in which the classical dichotomy, the Irvine-style trichotomy, or neither does the work the client needs; identify the characteristic misfires of the doctrine as popularly absorbed (e.g., the collapse of "not fully in your control" into "not worth acting on," the leap from an outcome's being indifferent to one's *happiness* to its being indifferent simpliciter, the slide from accepting a dispreferred outcome to not working to prevent it); specify what counts as a sufficient answer at each step; and mark clearly the points where the procedure stops being conceptual triage and hands the decision to a clinician or to the client's own values — including the point at which it flags a safety issue rather than a philosophical one. Be honest about where the procedure is a judgment call dressed up as a rule, and about what it cannot do: I am not asking for a defense of Stoic therapy, and the procedure should say candidly whether it is delivering Stoicism, CBT wearing a toga, or something in between.

  Then run the procedure on three cases from my actual group. First, the client mentioned above who interpreted "the interview outcome is not up to you" as a reason to stop preparing for campus visits, and who now feels virtuously detached and badly prepared. Second, a client with climate anxiety who is deciding whether to keep organizing a departmental sustainability campaign, who says the dichotomy has finally given her permission to stop — and I should disclose that I find the doctrine's application here most troubling, since she is one of the few people whose disengagement is a real loss. Third, the client whose partner uses the dichotomy as described above, where I suspect the procedure's verdict and my instinct to intervene will conflict. One of these cases must yield an answer I will not like — if the procedure always returns my preferred verdict, it is not a procedure but a mirror. Finally, state what you had to decide about the underlying philosophy in order to make the procedure usable at all: whether you kept the strict dichotomy, adopted the trichotomy, or replaced both with something like an effort-allocation heuristic; which distinctions from the Stoic texts you preserved, which you dropped, and what that choice costs.
reasoning: |-
  We are designing a decision procedure for a clinician to quickly evaluate a client's use of dichotomy-of-control reasoning in a counseling context. The procedure must be practical, taking only a few minutes, and must help distinguish between helpful and harmful applications. We'll consider both the classical Stoic dichotomy and William Irvine's trichotomy, and we'll be alert to common misinterpretations.

  The core steps of the procedure:

  1. **Identify the Target**: What is the client applying the dichotomy/trichotomy to? (e.g., an outcome, an emotion, a behavior, a situation)
  2. **Clarify the Doctrine Used**: Which version is the client using? (Classical dichotomy: control vs. no control; Irvine's trichotomy: full, partial, none) and what is the client's interpretation?
  3. **Check for Common Misfires**: We'll look for these red flags:
     - **Collapse of partial control into no control**: Treating something that is partially controllable as if it were not at all controllable, leading to disengagement.
     - **Indifference confusion**: Treating an external as indifferent to happiness as meaning it is not worth acting upon at all.
     - **Acceptance without action**: Accepting a dispreferred outcome without taking appropriate action to prevent it when possible.
     - **Overextension**: Applying the doctrine to areas where it may not be appropriate (e.g., in contexts of injustice or where agency is critical for well-being).
  4. **Evaluate Functional Impact**:
     - Does this framing reduce distress and promote constructive action?
     - Or does it lead to avoidance, resignation, or neglect of responsibilities?
  5. **Safety Check**: Is there any indication of harm to self or others, or of being in an abusive situation? If so, the procedure stops and clinical intervention is required.
  6. **Decision Points**:
     - If the application is functional and reduces distress without causing harm or avoidance, it may be supported.
     - If there is a misfire, we reframe or correct the misunderstanding.
     - In cases of ambiguity or where values are in conflict, we defer to the client's values and goals (with clinician input if needed).

  The procedure will be structured as a flow of questions. We'll be honest that some steps are judgment calls.

  ---

  **The Decision Procedure**:

  1. **What is the specific situation or target the client is applying the control doctrine to?**
     - *Example targets*: An outcome (e.g., getting a job), an emotion (e.g., anxiety), a behavior (e.g., preparing for an interview), a relationship issue.
     - *Why*: To ground the abstract doctrine in a concrete example.

  2. **Which version of the control doctrine is the client using?**
     - Classical dichotomy (only two categories: up to us / not up to us)?
     - Irvine-style trichotomy (full, partial, none)? 
     - Or a vague mix? 
     - *Note*: If they are using the classical dichotomy, we might consider if the trichotomy would be more helpful in this case.

  3. **Is the client correctly categorizing the target?**
     - For classical dichotomy: 
       - What is "up to us"? (Only judgments, intentions, impulses.)
       - What is not? (Externals: outcomes, others' actions, etc.)
       - *Check*: Is the client trying to control something that is not up to them (which might be causing distress) OR are they neglecting something that is up to them?
     - For trichotomy:
       - Is the target correctly placed in one of the three categories?
       - *Especially check*: If the target is in the "partial control" category, is the client setting internal goals (e.g., "I will do my best") rather than outcome goals (e.g., "I must win")?

  4. **Common Misfires Check** (these are red flags):
     - **M1: Partial Control Collapse**: Is the client treating something with partial control as if it had no control? (e.g., "I can't control the outcome, so I won't prepare.")
     - **M2: Indifference Confusion**: Is the client assuming that because an external is indifferent to their happiness (in the Stoic sense) that it is not worth acting upon at all? (e.g., "The job is an external, so it doesn't matter if I get it or not, and I don't need to try.")
     - **M3: Acceptance without Action**: Is the client accepting a dispreferred outcome without taking appropriate action to prevent it? (e.g., "I accept that my partner is treating me poorly because I can't control them, so I won't set boundaries.")
     - **M4: Overextension**: Is the client applying the doctrine in a context where agency is critical (e.g., in situations of injustice, or in taking necessary steps for well-being) and using it to justify inaction?
     - *If any misfire is present, we note it and move to reframe*.

  5. **Functional Impact Assessment**:
     - How is this belief affecting the client?
       - *Positive signs*: Reduced distress, increased focus on what they can control (e.g., their effort, their preparation), and taking appropriate action.
       - *Negative signs*: Avoidance, neglect of responsibilities, resignation, or increased distress (e.g., self-blame for not being able to "let go").
     - *Judgment call*: If the application is having a positive functional impact, it may be acceptable even if not philosophically pure. If negative, we intervene.

  6. **Safety Check**:
     - Is there any indication of:
       - Self-harm or harm to others?
       - An abusive relationship?
       - Severe neglect of basic needs?
     - *If safety is a concern, stop the procedure and address the safety issue clinically.*

  7. **Decision and Intervention**:
     - If no misfires and functional impact is positive: Support the client's use.
     - If misfires or negative impact:
       - Reframe the doctrine: Correct misunderstandings (e.g., explain the difference between control over outcome and control over effort; explain preferred indifferents and appropriate action).
       - Consider switching from dichotomy to trichotomy (or vice versa) if it fits better.
       - If the doctrine is not helping, set it aside and use standard CBT techniques (e.g., problem-solving, behavioral activation, cognitive restructuring).
     - In cases where the issue is about values (e.g., how much effort to put into a cause), defer to the client's values and goals. The clinician may facilitate a values clarification exercise.

  **Limitations of the Procedure**:
  - It is a heuristic and requires clinical judgment.
  - It cannot resolve deep philosophical debates but aims for practical utility.
  - It may not capture all nuances of Stoicism but is tailored for therapeutic effectiveness.
  - It is not a defense of Stoicism but a tool to evaluate its application in a specific context.

  ---

  **Underlying Philosophical Choices for the Procedure**:

  I have chosen a **pragmatic blend** that leans toward Irvine's trichotomy because it is more adaptable to real-world situations where partial control is common. However, we preserve the classical Stoic idea of "appropriate action" (kathēkonta) toward preferred indifferents. We drop the strict Stoic ideal of apatheia (freedom from passion) because we are in a therapeutic context that values emotion regulation and reduction of distress, not elimination of emotion.

  **Preserved from Stoicism**:
  - The core distinction between what is in our control (judgments, intentions, efforts) and what is not (outcomes, others).
  - The concept of preferred indifferents: Externals are not good or bad in themselves but can be preferred or dispreferred, and we may act appropriately to attain or avoid them.
  - The idea that our well-being (eudaimonia) should not depend on externals.

  **Dropped or Modified**:
  - The strict dichotomy is replaced by a more flexible approach that allows for partial control (Irvine's trichotomy) because it is more intuitive and less prone to the collapse of partial control into no control.
  - We do not insist on the Stoic goal of virtue as the sole good but frame it in terms of psychological well-being and goal pursuit.

  **Cost of Choices**:
  - By adopting the trichotomy, we lose the simplicity and radical focus of the classical dichotomy. However, we gain applicability to many real-world scenarios.
  - By preserving the idea of preferred indifferents and appropriate action, we avoid the pitfall of total disengagement.

  ---

  **Running the Procedure on the Three Cases**:

  **Case 1: The client who stopped preparing for campus visits because "the interview outcome is not up to me"**

  1. **Target**: Preparing for campus visits (an action) and the outcome of getting a job.
  2. **Doctrine**: Classical dichotomy (outcome not up to her, so she should let go of concern).
  3. **Categorization**: 
     - Outcome (getting the job): not up to her -> correct in classical dichotomy.
     - But her preparation is up to her (an intentional action). 
  4. **Misfires**:
     - **M1: Partial Control Collapse**: She has collapsed the partial control over the outcome (via preparation) into no control, leading to disengagement. Also, she is neglecting what is up to her (preparation).
     - **M2: Indifference Confusion**: She may be treating the job as indifferent simpliciter (not worth acting for) rather than a preferred indifferent that warrants appropriate action.
     - **M3: Acceptance without Action**: She is accepting the dispreferred outcome (not getting the job) without taking action (preparation) to improve her chances.
  5. **Functional Impact**: Negative. She feels detached but is underprepared, which may harm her chances and cause future distress.
  6. **Safety Check**: No immediate safety issue.
  7. **Decision**: Misfire present. Reframe: 
     - Use Irvine's trichotomy: Preparation is in her partial control (she can do her best). The outcome is not fully in her control.
     - Emphasize appropriate action: Preparing is an appropriate action toward a preferred indifferent (the job).
     - Encourage setting internal goals: "Do my best in the interview" rather than "Get the job."

  **Verdict**: The classical dichotomy was misapplied. Switch to trichotomy and correct the misfire.

  **Case 2: The client with climate anxiety who is stopping her sustainability campaign because "I can't control the outcome"**

  1. **Target**: Organizing a departmental sustainability campaign (an action) and the outcome of impacting climate change.
  2. **Doctrine**: Classical dichotomy (outcome not up to her, so she should let go).
  3. **Categorization**:
     - The global outcome of climate change: not up to her (correct).
     - Her actions (organizing): up to her (intentional actions).
  4. **Misfires**:
     - **M1: Partial Control Collapse**: She has partial control over her local actions and influence. She is collapsing this into no control and disengaging.
     - **M2: Indifference Confusion**: The outcome (addressing climate change) is a preferred indifferent (it matters) and acting for it is appropriate.
     - **M4: Overextension**: Using the doctrine to justify disengagement in a cause she values, which may be important for her well-being and sense of purpose.
  5. **Functional Impact**: She may feel relief from anxiety in the short term, but disengagement may lead to loss of meaning and contribution. The group leader notes her disengagement is a real loss to the cause, but the procedure must focus on the client's well-being.
  6. **Safety Check**: No immediate safety issue.
  7. **Decision**: Misfire present. Reframe:
     - Use trichotomy: Her actions are in her partial control (she can do what she can). The global outcome is not in her control.
     - Emphasize that the value of action is not solely in the outcome but in the virtue of acting according to one's values (Stoic idea) and in the psychological benefits of engagement (CBT: behavioral activation).
     - Encourage setting internal goals: "Do what I can in my sphere of influence" and focus on the process.
     - However, if the campaign was causing excessive distress, disengagement might be appropriate. But the procedure must defer to the client's values. So, we add a values clarification step: 
       - What does the client value? (e.g., environmental stewardship, community action)
       - How does the campaign align with her values?
       - How much effort is sustainable for her?
       - The goal is to find a balance that aligns with her values without burnout.

  **Verdict**: The doctrine was misapplied. Reframe with trichotomy and values clarification. The procedure does not force her to continue but ensures the decision is based on values and not a misinterpretation of control.

  **Case 3: The client whose partner tells her she cannot control his behavior and should work on her own reactions**

  1. **Target**: Partner's behavior and the client's reactions in a relationship.
  2. **Doctrine**: Classical dichotomy (partner's behavior not up to her, so she should only work on her own reactions).
  3. **Categorization**:
     - Partner's behavior: not up to her (correct).
     - Her reactions: up to her (correct).
  4. **Misfires**:
     - **M3: Acceptance without Action**: The client may be accepting the partner's harmful behavior without taking appropriate action (e.g., setting boundaries, seeking couples therapy, or considering leaving).
     - **M4: Overextension**: This might be applied in a context of injustice or abuse, where the doctrine is being used to justify passivity in the face of harm.
  5. **Functional Impact**: The client might feel she is at fault for reacting and is working on suppressing her reactions. This could lead to increased distress and entrapment in a harmful relationship.
  6. **Safety Check**: **Critical Step**. We must assess for abuse. 
     - If the partner's behavior is abusive (e.g., controlling, demeaning, violent), then the doctrine is being weaponized. This is a safety issue and requires clinical intervention.
     - Even if not abusive, if the relationship is deteriorating and the partner is using the doctrine to avoid accountability, it may be harmful.
  7. **Decision**:
     - **Safety Flag**: The procedure stops here for a safety assessment. 
       - If abuse is present: The clinician must address safety and not use the doctrine. The focus becomes safety planning and empowerment.
       - If no abuse, but the relationship is unhealthy: Reframe:
         - The doctrine is correct that she cannot control the partner, but she can control her actions: setting boundaries, communicating needs, and deciding whether to stay in the relationship.
         - Emphasize that working on her reactions does not mean tolerating harmful behavior. It means choosing how to respond (which might include leaving).
         - Irvine's trichotomy might help: She has partial control over the relationship dynamics (through her actions and communication). She can set internal goals (e.g., "I will communicate my needs clearly" rather than "I must make him change").

  **Verdict**: This case triggers the safety check. The procedure flags it as potentially harmful and requires clinical intervention. The doctrine was misapplied to justify passivity, and the client may need help with assertiveness and boundary setting.

  ---

  **One Answer You Won't Like**:

  In Case 2, the procedure does not force the client to continue her activism. It respects her autonomy and focuses on her values and well-being. Even though her disengagement is a loss to the cause, the procedure prioritizes the client's mental health and values. So, if after values clarification she still chooses to disengage, the procedure supports that as a valid choice. This might conflict with the group leader's desire to keep her engaged.

  ---

  **Summary of Underlying Philosophy**:

  - We adopted **Irvine's trichotomy** as the default because it handles partial control more gracefully and is less prone to the collapse of partial into no control.
  - We preserved the Stoic ideas of **appropriate action** and **preferred indifferents** to counter disengagement.
  - We dropped the strict dichotomy and the ideal of complete detachment from externals because they are often misinterpreted and can be harmful in a therapeutic context.
  - The cost: We are not teaching pure Stoicism but a therapeutic adaptation that blends Stoic ideas with CBT. It is "CBT wearing a toga" in the sense that we are using Stoic concepts as cognitive tools within a broader CBT framework. The goal is not virtue in the Stoic sense but psychological well-being.

  This procedure is a tool for triage, not a philosophical treatise. It aims to help the clinician quickly identify and correct harmful applications while supporting helpful ones.
answer: |-
  Below is a decision procedure designed for rapid clinical triage (5–10 minutes) when clients invoke "dichotomy of control" reasoning. It integrates Stoic principles, CBT, and clinical pragmatism, with explicit flags for judgment calls and limitations. The procedure adopts a **modified trichotomy framework** (inspired by Irvine but anchored in classical Stoic "appropriate action") as the most clinically flexible option, while preserving core Stoic distinctions between *agency* (what we control), *value* (preferred/dispreferred indifferents), and *effort* (kathēkonta/appropriate actions). I drop the Stoic insistence on *perfect* rationality and virtue-as-the-only-good, as these are impractical in brief interventions. The cost: this loses the philosophical purity of classical Stoicism but gains clinical utility.

  ---

  ### **Decision Procedure: "Control Doctrine" Triage**
  **Input**: A client statement invoking control dichotomy/trichotomy (e.g., "I can't control X, so I should let go").  
  **Output**: Flag as (1) **Useful**, (2) **Misfire** (needs reframing), or (3) **Clinical/Safety Issue** (hand off to clinician).

  #### **Step 1: Identify the Target** (30 seconds)  
  - **Ask**: "What specifically are you trying to control or let go of?"  
  - **Sufficient Answer**: Concrete target (e.g., "my anxiety," "the job offer," "my partner's anger").  
  - **Stop & Hand Off If**: Target involves harm (self/others), abuse, or basic needs neglect → **Clinical/Safety Issue**.  
  - *Judgment Call*: If target is vague (e.g., "everything"), ask for a recent example.

  #### **Step 2: Map to Control Categories** (1 minute)  
  - Use a **modified trichotomy**:  
    - **Full Control**: Judgments, intentions, effort.  
    - **Partial Control**: Actions toward externals (e.g., preparation, communication).  
    - **No Control**: Outcomes, others' choices, past events.  
  - **Ask**: "Where does your target fit: full, partial, or no control?"  
  - **Misfire Check**:  
    - **Collapse of Partial→No Control**: Client says "not fully controlled" but means "not worth acting on."  
    - **Overextension**: Client places target in "full control" when it belongs in "partial" (e.g., "I *should* control my panic attacks").  
  - **Sufficient Answer**: Client correctly categorizes target ± clinician correction.  
  - *Judgment Call*: Category boundaries (e.g., "effort" vs. "outcome") may need clarification.

  #### **Step 3: Assess Value & Agency** (2 minutes)  
  - **Ask**:  
    - "Is this target something you *care* about, even if you can't control it?" (Tests "indifference confusion").  
    - "What actions *could* you take toward it, even if the outcome isn't guaranteed?" (Tests "inaction rationalization").  
  - **Misfire Check**:  
    - **Indifference Confusion**: Client infers "not important" from "not controlled" (e.g., "The job isn't up to me, so it doesn't matter").  
    - **Effort-Outcome Blur**: Client skips "appropriate action" (e.g., preparation) because outcome is uncertain.  
  - **Sufficient Answer**: Client acknowledges the target as "preferred/dispreferred" *and* identifies actionable steps.  
  - **Hand Off If**: Client's values conflict with safety/well-being (e.g., staying in an abusive relationship "because I can't control them").  

  #### **Step 4: Evaluate Functional Impact** (1 minute)  
  - **Ask**:  
    - "How does this framing *help* you right now?"  
    - "What does it make you *do* (or not do)?"  
  - **Assess**:  
    - **Useful If**: Reduces rumination, focuses on agency (e.g., "I'll focus on my preparation, not the outcome").  
    - **Misfire If**:  
      - Rationalizes avoidance (e.g., stops preparing).  
      - Increases self-blame (e.g., "I *shouldn't* feel anxious").  
      - Enables passivity in harm (e.g., tolerating mistreatment).  
  - **Sufficient Answer**: Client links framing to constructive behavior change or distress reduction.  
  - *Judgment Call*: "Constructive" depends on client’s goals (hand off to clinician if goals are unclear).

  #### **Step 5: Triage & Intervene** (1–2 minutes)  
  - **Useful**: Validate and reinforce.  
  - **Misfire**: Reframe using:  
    - "Partial control = set effort-based goals" (e.g., "Focus on what you *can* do").  
    - "Indifferents matter, but don’t determine your worth" (e.g., "The job is important, but not getting it doesn’t make you a failure").  
  - **Clinical/Safety Issue**: Suspend philosophy—use safety planning, empowerment, or behavioral activation.  
  - **Limitation**: Cannot resolve existential debates (e.g., "Should I fight climate change?"). Defers to client values.

  ---

  ### **Procedure Applied to Cases**  
  **Case 1: Client stops preparing for job interviews ("outcome not up to me")**  
  - **Step 1**: Target = job interview outcome.  
  - **Step 2**: **Misfire (Collapse)**. Outcome = "no control," but preparation = "partial control." Client conflates them.  
  - **Step 3**: **Misfire (Indifference Confusion)**. Client implies job is "indifferent" (not worth acting on), though she cares about it.  
  - **Step 4**: **Misfire (Functional Harm)**. Detachment rationalizes avoidance → poor preparation.  
  - **Step 5**: **Reframe**. Use trichotomy: "Outcome isn't controlled, but preparation is. Set a goal: 'I’ll prepare 2 hours daily.'"  
  - **Verdict**: Misfire. Not your preferred verdict? → Corrects passivity but may frustrate client’s "virtuous detachment."  

  **Case 2: Client quits sustainability campaign ("can’t control climate")**  
  - **Step 1**: Target = climate change outcome.  
  - **Step 2**: Partial misfire. Outcome = "no control," but organizing = "partial control." No collapse.  
  - **Step 3**: **Misfire (Indifference Confusion)**. Client infers "not worth doing" from "not controlled," though she values the cause.  
  - **Step 4**: **Functional Ambiguity**. Relief from anxiety vs. loss of meaning. **Judgment Call**: Not inherently harmful unless it conflicts with values.  
  - **Step 5**: **Hand Off to Values Clarification**. Ask: "What matters to you about this work? What level of effort feels meaningful *and* sustainable?"  
  - **Verdict**: Neither purely useful nor harmful. Procedure *does not* push engagement—yields an answer you dislike (supports disengagement if aligned with values).  

  **Case 3: Partner tells client to "work on reactions, not his behavior"**  
  - **Step 1**: Target = partner’s behavior. **Safety Flag**: Potential relational harm.  
  - **Step 2**: **Misfire (Overextension)**. Partner’s behavior = "no control," but client’s boundary-setting = "partial control."  
  - **Step 3**: **Misfire (Effort-Outcome Blur)**. Client skips self-protective actions (e.g., stating boundaries).  
  - **Step 4**: **Functional Harm**: Doctrine weaponized → client blames self, tolerates mistreatment.  
  - **Step 5**: **Clinical/Safety Issue**. Suspend Stoicism. Empower agency: "You can’t control him, but you can control how you respond—including setting boundaries or leaving."  
  - **Verdict**: Safety issue. Conflicts with your instinct? Yes—procedure overrides "philosophical correctness" for duty of care.  

  ---

  ### **Philosophical Decisions for Clinical Usability**  
  - **Framework**: Adopted **Irvine-style trichotomy** but **anchored in classical Stoic "appropriate action."** Why? The strict dichotomy encourages "all-or-nothing" thinking; the trichotomy better maps gradations of agency (e.g., preparation, voting, difficult conversations).  
  - **Preserved from Stoicism**:  
    - *Preferred/dispreferred indifferents*: Externals matter pragmatically (e.g., jobs, relationships), but not morally.  
    - *Agency boundary*: Only judgments/effort are "full control"; outcomes are not.  
    - *Eudaimonia*: Well-being depends on virtue (here, "acting with integrity"), not externals.  
  - **Dropped/Modified**:  
    - *Virtue as sole good*: Replaced with "values-congruent action" (CBT-compatible).  
    - *Perfect rationality*: Accepts "good enough" reasoning to reduce distress.  
    - *Strict apatheia*: Allows "healthy concern" (vs. Stoic eradication of passion).  
  - **Costs**:  
    - Loses Stoicism’s moral rigor (e.g., "virtue is sufficient for happiness").  
    - Risks "effort-fetishism" (overvaluing busyness).  
    - **What This Is**: **CBT wearing a toga**—uses Stoic concepts as cognitive tools within a behavioral framework. Outcome matters less than functionality.  

  This procedure prioritizes *safety* and *agency* over philosophical fidelity. It will misfire in existential dilemmas (Case 2) but prevents harm in relational dynamics (Case 3). Use it as a conversation scaffold—not a rigid rule.
