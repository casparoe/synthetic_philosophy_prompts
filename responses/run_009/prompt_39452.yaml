prompt: |-
  Write the joint statement that two members of a well-being research group should have produced after three years of arguing past each other. The first is a hedonist who answers the heterogeneity problem — the worry that the pleasure of eating mango, the pleasure of following a complicated proof to its conclusion, and the pleasure of a warm bath share no single felt quality — with an attitudinal or add-on account: pleasure is not a sensation but a way of taking states of affairs, roughly enjoyment that things are thus-and-so, which can attach to wildly different experiences and even, in cases like being pleased that a friend abroad is thriving without knowing how her week went, to no experience at all. The second began as a hedonist and defected: she now holds that pleasure is at best a cluster or disjunctive kind, held together by family resemblance and our word rather than a shared property, and that because there is no single thing pleasure is, there is no single thing hedonism says well-being consists in — her view is a perfectionist or objective-list pluralism on which the heterogeneity data are the smoking gun.

  The deliverable is the adversarial-collaboration document itself, not a verdict on who is right. It should contain, in this order:

  1. A numbered section of agreed claims — about the heterogeneity data (that the introspective reports of diverse pleasures seem to resist any common feeling, and that a Benthamite homogeneous sensation of pleasure is off the table), about what is wrong with defining pleasure via what people desire (the circularity worries that go back at least to Butler's observation that we desire things because they are pleasant rather than their being pleasant consisting in being desired), and about which formulation of hedonism is actually at stake — the claim that well-being consists in the balance of attitudinal enjoyment over its opposite, not in any felt-quantity doctrine. Each agreed claim must be worded so that neither side is committing to the other's residual position.

  2. A disagreements table with, for each point of divergence, one formulation the hedonist would sign describing her own view, one formulation the pluralist would sign describing hers, and a note on whether the divergence is substantive or partly verbal — for instance, whether the hedonist is entitled to concede that pleasure is disjunctive at the level of underlying properties while insisting it is unified at the level of the attitude, or whether that concession already gives the pluralist everything she needs.

  3. The cruxes, stated as questions such that settling them would move at least one party. I suspect they include: (a) whether a phenomenal inversion between two people's pleasures is fully coherent — one person's felt quality of muzak-listening being the other's felt quality of solve-proving, with all attitudes and reports intact — and if so, whether it is the hedonist's or the pluralist's view that survives it; (b) whether the add-on theorist can give a non-circular account of what makes an attitude enjoyment rather than mere desire-satisfaction or preference; (c) whether the pleasures that seem least intentional — orgasm, the runner's high, sun on skin — are recalcitrant data for the attitudinal account or merely limit cases of it; and (d) whether the hedonist's fallback to attitude has quietly changed the subject, so that well-being hedonism and the metaphysics of pleasure have come apart and the debate is now about the former only.

  4. For each crux, the test both sides agree bears on it — thought experiments like Feldman-style cases of unexperienced pleasure, imagined agents who enjoy only the logical structure of a piece of music with none of its sonic surface, or memory swaps of felt qualities across activities — together with each party's prediction about that test, recorded in advance, in wording each would accept.

  Throughout, guard against two failure modes: agreed claims so watered-down that they say nothing (both accept that pleasure is interesting), and disagreement formulations that smuggle in one side's terminology as neutral. If part of the dispute turns out to be about how to use the word pleasure rather than about what there is, say which part and why — but also say why the remainder does not collapse along with it.
reasoning: |-
  We are writing a joint statement by two members of a well-being research group who have been arguing for three years. 
   The hedonist (H) holds an attitudinal account: pleasure is not a sensation but an attitude of enjoyment toward states of affairs.
   The pluralist (P) holds that pleasure is a disjunctive cluster concept and that hedonism fails because there's no single thing that pleasure is.

   We need to produce:
   1. Agreed claims (numbered section) - worded so neither commits to the other's residual position.
   2. Disagreements table: for each point of divergence, two formulations (one for H, one for P) and a note on whether the divergence is substantive or partly verbal.
   3. Cruxes: stated as questions that would move at least one party if settled. For each, the agreed test and each party's prediction.
   4. Guard against watered-down agreements and smuggled terminology.

   Let's break it down step by step.

   Section 1: Agreed Claims

   We are to agree on:
   a) Heterogeneity data: introspective reports of diverse pleasures seem to resist any common feeling; Benthamite homogeneous sensation is off the table.
   b) Problems with defining pleasure via desire: circularity (Butler's point).
   c) Which formulation of hedonism is at stake: well-being consists in the balance of attitudinal enjoyment, not a felt-quantity doctrine.

   Wording must be neutral.

   Proposed agreed claims:

   1. Heterogeneity of Pleasure Experiences: 
      - There is a wide variety of experiences that are commonly called pleasures (e.g., eating mango, following a complex proof, warm bath). 
      - Introspective reports from subjects indicate that these experiences do not share a single, common felt quality that is present in each and every case. 
      - Therefore, any account of pleasure that requires a homogeneous, sensation-like quality common to all pleasures (such as Bentham's) is untenable.

   2. The Problem of Defining Pleasure via Desire:
      - Attempts to define pleasure in terms of what is desired (or what satisfies desire) face a circularity problem. 
      - This is because, as Butler observed, we often desire things because they are pleasant, and it is not the case that their being pleasant consists solely in their being desired. 
      - Therefore, any account of pleasure that relies on a simple identification of pleasure with the object of desire is inadequate.

   3. The Formulation of Hedonism at Stake:
      - The version of hedonism under discussion is one that defines well-being as the balance of attitudinal enjoyment (i.e., taking pleasure in states of affairs) over attitudinal displeasure. 
      - This view does not claim that well-being consists in a homogeneous felt sensation of pleasure.

   Section 2: Disagreements Table

   We need to list points of divergence. Each point has:
     - A formulation for the hedonist (H)
     - A formulation for the pluralist (P)
     - A note on whether the divergence is substantive or partly verbal.

   Possible points:

   1. The nature of pleasure:
      H: Pleasure is a unified psychological kind: it is the attitude of enjoyment directed at a state of affairs. This attitude is a single type of mental state that can be present in a wide variety of experiences or even without any particular experience (as in the case of being pleased about a friend's well-being without current experience).
      P: Pleasure is not a unified psychological kind. Instead, what we call pleasures form a disjunctive cluster held together by family resemblances and our linguistic practices. There is no single property (such as an attitude) that is common to all pleasures.

      Note: This divergence is substantive. The hedonist insists on a unified account at the level of attitude, while the pluralist denies any such unity. The pluralist argues that even if we grant that many pleasures involve an attitude, there are cases (like orgasm) that do not fit the attitudinal model, and the attempt to unify by attitude fails.

   2. The implications for well-being:
      H: Well-being consists solely in the balance of attitudinal enjoyment over attitudinal displeasure. Because all pleasures are instances of this attitude, well-being is a unified and measurable state.
      P: Because pleasure is not a unified kind, hedonism cannot provide a unified account of well-being. Instead, well-being consists in a plurality of goods (such as achievement, knowledge, relationships, etc.) that may include some pleasures but are not reducible to a single dimension of attitudinal pleasure.

      Note: This divergence is substantive. The hedonist maintains that the attitudinal account provides a unified basis for well-being, while the pluralist denies that and advocates for a pluralistic account.

   3. The status of non-intentional pleasures:
      H: Even in cases of seemingly non-intentional pleasures (like orgasm or runner's high), the subject is taking an attitude of enjoyment toward a state of affairs (e.g., the state of having an orgasm, or the state of running). These are not counterexamples but rather limit cases where the intentional object is minimal or the attitude is strongly tied to a sensation.
      P: Some pleasures, such as orgasm or the feeling of sun on skin, are primarily non-intentional sensory experiences and do not essentially involve an attitude of enjoyment toward a state of affairs. These cases show that the attitudinal account is incomplete and that pleasure cannot be unified under the attitude.

      Note: This divergence is substantive. The hedonist sees these as compatible with the attitudinal account, while the pluralist sees them as evidence of disunity.

   4. The possibility of phenomenal inversion:
      H: It is coherent to imagine a phenomenal inversion where the felt quality of one activity (e.g., muzak-listening) in person A is identical to the felt quality of a different activity (e.g., solve-proving) in person B, and vice versa, provided that the attitudinal enjoyment is directed appropriately. The hedonist account survives because well-being depends on the attitude, not the felt quality.
      P: The possibility of such inversion, without any change in the attitude or behavior, shows that the felt qualities of pleasure are diverse and not unified by an attitude. This inversion scenario supports the disunity of pleasure and undermines the hedonist's attempt to reduce well-being to a single attitude.

      Note: This divergence is substantive. The hedonist believes inversion is coherent and that their view survives; the pluralist believes inversion shows the disunity and that the hedonist view does not survive.

   5. The circularity of the attitudinal account:
      H: The attitude of enjoyment can be characterized non-circularly, for example, by its functional role or by its phenomenology (without appealing to desire or preference). We can have a theory of what makes an attitude one of enjoyment without defining it in terms of desire.
      P: The attitudinal account of pleasure as enjoyment faces a circularity problem: any attempt to define the attitude of enjoyment will either rely on the notion of pleasure (thus being circular) or fail to capture what is distinctive about pleasure.

      Note: This divergence is substantive. The hedonist believes a non-circular account is possible; the pluralist does not.

   Section 3: Cruxes

   We list questions that, if settled, would move at least one party. We also provide an agreed test and each party's prediction.

   Crux (a): Phenomenal inversion
     Question: Is a phenomenal inversion between two people's pleasures fully coherent? If so, which view (hedonism or pluralism) survives it?
     Test: Imagine two agents, A and B. In A, the felt quality typically associated with listening to muzak is identical to the felt quality that B typically associates with solving a complex proof, and vice versa. Moreover, in all other respects (attitudes, reports, behaviors) they are normal: A enjoys solving proofs and reports it as pleasurable, and enjoys muzak and reports it as pleasurable, but with the felt qualities swapped. The question is whether this scenario is coherent and what it implies for the theories.
     H's prediction: The scenario is coherent. Hedonism survives because well-being depends on the attitude of enjoyment, which is present in both agents for both activities. The inversion of felt qualities does not affect the well-being assessment.
     P's prediction: The scenario is coherent. It shows that the felt qualities of pleasure are not unified by an attitude (because the same attitude is present but the felt quality is inverted) and that well-being cannot be reduced to the attitude. Pluralism survives because it acknowledges the disunity.

   Crux (b): Non-circular account of enjoyment
     Question: Can the attitudinal theorist give a non-circular account of what makes an attitude enjoyment rather than mere desire-satisfaction or preference?
     Test: Propose a definition or set of criteria for the attitude of enjoyment that does not use the terms 'pleasure', 'enjoyment', or any of their cognates, and that distinguishes enjoyment from other pro-attitudes (like desire or preference). For example, a functional role account (enjoyment is the state that is caused by certain stimuli and causes a tendency to sustain the state) or a phenomenological account (enjoyment has a distinctive phenomenology of 'liking').
     H's prediction: Such an account is possible. We can point to the functional role or a distinctive phenomenological character (without appealing to desire) to define enjoyment.
     P's prediction: Any such account will either fail to capture the full range of pleasures (e.g., it might miss non-intentional pleasures) or will implicitly rely on the notion of pleasure (thus being circular). Therefore, a non-circular account is not possible.

   Crux (c): Non-intentional pleasures
     Question: Are the pleasures that seem least intentional (e.g., orgasm, runner's high, sun on skin) recalcitrant data for the attitudinal account or merely limit cases of it?
     Test: Consider cases of intense sensory pleasures that seem to lack an intentional object, such as an orgasm or the sudden feeling of warmth from the sun. Does the subject in such cases necessarily have an attitude of enjoyment toward a state of affairs (e.g., the state of having that sensation)? Or is the pleasure entirely contained in the sensation?
     H's prediction: These are limit cases. The subject is taking an attitude of enjoyment toward the state of affairs of having that sensation. Therefore, they are fully compatible with the attitudinal account.
     P's prediction: These cases are recalcitrant. The pleasure is entirely in the sensation and does not require (and sometimes does not involve) an attitude toward a state of affairs. Therefore, they show that the attitudinal account is inadequate.

   Crux (d): Change of subject
     Question: Has the hedonist's fallback to attitudinal pleasure quietly changed the subject, so that well-being hedonism and the metaphysics of pleasure have come apart?
     Test: Consider the original debate about hedonism, which was about whether well-being consists in pleasure (understood as a felt quality). Now that the hedonist has moved to attitudinal pleasure, is this still a debate about the same thing? Does the attitudinal hedonist's theory of well-being still count as a form of hedonism, or has it become a different theory?
     H's prediction: The theory is still hedonism because the core idea is that well-being consists in positive states of mind, and the attitude of enjoyment is the positive state of mind that matters. This is a refinement, not a change of subject.
     P's prediction: The move to attitudinal pleasure changes the subject. The traditional hedonist (like Bentham) cared about felt qualities. Now that the hedonist has abandoned felt qualities and moved to an attitude, the theory is no longer about pleasure in the ordinary sense. Therefore, the debate about well-being hedonism and the metaphysics of pleasure have come apart.

   Section 4: Throughout, we must avoid watered-down agreements and smuggled terminology.

   Let's write the document accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Pleasure and Well-Being  
  **Authors**: Hedonist (Attitudinal Account) and Pluralist (Perfectionist Account)  
  **Date**: October 26, 2023  

  After three years of debate, we agree on the following core points, while retaining fundamental disagreements. This document outlines areas of consensus, divergences, and cruxes for future research.  

  ---

  #### 1. Agreed Claims  
  *(Wording is neutral; neither party endorses the other’s residual position)*  

  1.1 **Heterogeneity Data**:  
     - Introspective reports confirm that the felt qualities of paradigmatic pleasures (e.g., savoring mango, completing a proof, feeling warm water) lack a phenomenally homogeneous "feel."  
     - Consequently, classical Benthamite hedonism—which posits a unitary, quantifiable sensation common to all pleasures—is empirically untenable.  

  1.2 **Desire-Based Definitions of Pleasure**:  
     - Defining pleasure *solely* as the object of desire is circular, per Butler’s objection: desires are often causally dependent on prior experiences of pleasure (e.g., "I desire mango *because* it is pleasant"), rendering desire an inadequate reductive foundation.  
     - Thus, any account of pleasure must avoid defining it exclusively via conative states (e.g., wanting or preferring).  

  1.3 **Formulation of Hedonism at Stake**:  
     - The relevant hedonist thesis is: **Well-being consists solely in the net balance of *attitudinal enjoyment* (taking pleasure in states of affairs) over *attitudinal displeasure***.  
     - This formulation explicitly rejects defining well-being via homogeneous sensations or felt quantities.  

  ---

  #### 2. Disagreements Table  
  *(Each divergence includes a statement acceptable to each party and an analysis of its nature)*  

  | Point of Divergence                                                                 | Hedonist’s Position (Signed)                                                                                                                                 | Pluralist’s Position (Signed)                                                                                                                                                               | Nature of Divergence                                                                                                                               |  
  |-------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Unity of Pleasure**                                                               | Pleasure is unified at the level of attitude: it is a single psychological kind (enjoyment *that P*) that can attach to any object, including non-experiential states. | Pleasure is a disjunctive cluster: no unifying property (attitudinal or sensory) binds cases like orgasm, proof-solving, or aesthetic joy beyond family resemblance and linguistic practices. | **Substantive**. Hedonist’s "unified attitude" vs. pluralist’s "disjunctive cluster" reflects a metaphysical split—not merely verbal.               |  
  | **Well-Being’s Foundation**                                                         | Well-being reduces entirely to attitudinal enjoyment/displeasure; all other goods (e.g., knowledge) derive value from their capacity to generate such attitudes. | Well-being is irreducibly plural: attitudinal enjoyment is one good among others (e.g., achievement, relationships), with no single unifying property.                                  | **Substantive**. Hedonist reduces value to attitude; pluralist denies reducibility.                                                                 |  
  | **Non-Intentional Pleasures (e.g., orgasm, runner’s high)**                         | These are limit cases: the attitude of enjoyment is directed at the *state of experiencing the sensation* (e.g., "I enjoy *that* I feel sun on my skin").   | These are recalcitrant data: their phenomenal intensity and minimal intentionality resist attitudinal reduction, exposing the disunity of "pleasure."                                  | **Partly verbal**. Hedonist broadens "attitude" to include reflexive self-reference; pluralist sees this as ad hoc stretching.                      |  
  | **Metaphysical Status of Attitudinal Pleasure**                                     | Attitudinal enjoyment is a primitive, non-reducible mental state that can be characterized functionally (e.g., via its causal role) without circularity.        | "Attitudinal enjoyment" either smuggles in sensory pleasure (reintroducing heterogeneity) or is an empty placeholder; disunity persists.                                               | **Substantive**. Hedonist asserts attitude’s primitiveness; pluralist denies its coherence without sensory backup.                                 |  

  ---

  #### 3. Cruxes  
  *(Questions that would resolve disagreements; for each, an agreed test and predictions)*  

  **Crux (a): Phenomenal Inversion**  
  - **Question**: Is it coherent to imagine two agents with inverted felt qualities (e.g., Agent A’s muzak-quality = Agent B’s proof-quality) while attitudes/reports remain unchanged? If so, which account survives?  
  - **Agreed Test**:  
    - *Scenario*: Agent X reports the felt quality of listening to muzak as "tingly," and solving proofs as "warm." Agent Y reports the reverse (proofs "tingly," muzak "warm"), but both enjoy/disenjoy the same activities identically (e.g., both enjoy proofs, dislike muzak).  
  - **Predictions**:  
    - *Hedonist*: Inversion is coherent. Survival claim: Well-being depends *only* on attitudes (enjoyment of proofs), not felt qualities. Hedonism stands.  
    - *Pluralist*: Inversion is coherent. Survival claim: Felt qualities’ invertibility proves their independence from attitudes, confirming disunity. Pluralism stands.  

  **Crux (b): Non-Circular Attitudinal Account**  
  - **Question**: Can "attitudinal enjoyment" be defined without circular reference to pleasure/desire?  
  - **Agreed Test**:  
    - *Scenario*: Define enjoyment using non-pleasure-connoting terms (e.g., functional roles: "a mental state causing attention-sustenance and aversive reactions to interruption") and test if it captures cases like "enjoying a friend’s success" *without* invoking desire-satisfaction.  
  - **Predictions**:  
    - *Hedonist*: Success: Functional/phenomenal markers (e.g., "felt acceptance") distinguish enjoyment from desire.  
    - *Pluralist*: Failure: Any non-circular definition will exclude core cases (e.g., orgasm) or collapse into desire (e.g., "sustained attention" also applies to obsession).  

  **Crux (c): Non-Intentional Pleasures as Data**  
  - **Question**: Do non-intentional pleasures (e.g., orgasm) refute attitudinal accounts?  
  - **Agreed Test**:  
    - *Scenario*: An agent experiences intense pleasure from a direct neural stimulus (no intentional object), reporting only "I feel good." Can this be described as "enjoying *that* I feel this way" without stretching "attitude" beyond recognition?  
  - **Predictions**:  
    - *Hedonist*: No refutation: The attitude is minimally directed at the sensation’s occurrence ("enjoying *that* this sensation is happening").  
    - *Pluralist*: Refutation: The report lacks intentional structure ("I feel good" ≠ "I enjoy *that* P"), proving some pleasures are non-attitudinal.  

  **Crux (d): Change of Subject**  
  - **Question**: Has attitudinal hedonism shifted the debate from "pleasure" to "well-being," decoupling the two?  
  - **Agreed Test**:  
    - *Scenario*: A culture values "pleasure" solely as sensation but defines well-being via attitude-like states (e.g., "satisfaction with life"). Does this culture’s "hedonism" align with classical theories or the attitudinal account?  
  - **Predictions**:  
    - *Hedonist*: No shift: Well-being hedonism was always about pro-attitudes (e.g., Epicurus); "sensation" was a misstep.  
    - *Pluralist*: Shift: Attitudinal accounts abandon the folk concept of pleasure (sensory/affective), making "well-being hedonism" a rebranded desire-satisfaction theory.  

  ---

  #### 4. Linguistic vs. Substantive Disagreements  
  - **Linguistic Element**: Part of the dispute concerns "pleasure" as a term: the pluralist uses it descriptively (tracking diverse phenomena), while the hedonist uses it normatively (denoting a unified well-being constituent).  
  - **Why Substance Remains**: Even if "pleasure" is disjunctive, the hedonist claims well-being is *still* unified by attitude—a thesis independent of lexical semantics. The pluralist denies this, insisting well-being requires multiple goods. Thus, the core disagreement (monism vs. pluralism about value) endures.  

  ---  
  **Signed**:  
  - *The Hedonist* (Attitudinal Account Proponent)  
  - *The Pluralist* (Perfectionist Account Proponent)  

  This document may be cited as:  
  *Joint Statement on Pleasure and Well-Being: Adversarial Collaboration*. Well-Being Research Group, 2023.
