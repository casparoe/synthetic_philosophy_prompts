prompt: |-
  I'm a program officer at a mid-sized environmental foundation, and one of my jobs is signing off on the indicators our partners report against. Over the last few years I've watched the same pattern play out several times: we pick a measurable proxy for the thing we actually care about, partners optimize the proxy hard enough, and the proxy quietly detaches from the thing. A reforestation partner hit a "trees planted" target with seedlings nobody revisited, so mortality ate most of it within two years; a marine program hit its "patrol days at sea" quota by anchoring just outside the harbor; a community-education grant hit "workshops delivered" by holding the same workshop for the same twelve people five times. Each time it happened, my boss asked me why I hadn't flagged it, and each time I realized I'd been treating "is this metric gameable?" as a vibe rather than something I could actually reason through. I've read enough about Goodhart-style failures to know there are supposed to be distinct failure modes lurking here -- the proxy only correlating with the goal in the normal range, so pushing to the extremes breaks it; the act of selecting on the proxy adding noise that dominates the signal; partners actively gaming rather than merely drifting -- but I can't turn that reading into anything I can run on a Tuesday afternoon.

  What I want is a decision procedure I can actually apply to a proposed indicator in under an hour, without any formal statistics beyond what fits on a napkin. It should walk me through questions in order: what the metric is a proxy for and how tight that link is when nobody is being measured on it; who is being measured and what they can change cheaply; what happens if the indicator is pushed to extremes the historical data never covered; whether the partner could raise the number while making the underlying outcome worse; and what a spot-check or independent re-measurement would look like before we renew. It should say where the procedure terminates in a firm no (e.g., the indicator can be moved at near-zero cost in ways invisible to us), and where it has to hand the decision back to me as a judgment call, so I can tell my boss honestly which parts of my sign-off are procedure and which parts are me. Constraints: our program associates, not statisticians, will run this on most proposals; renewal decisions come twice a year; and any verification we impose costs our partners real money, so the procedure should distinguish between "cheap for us to check" and "expensive to verify but worth it."

  Then please run the procedure on three cases, including one where it gives an answer I won't like. First, a reforestation proposal reporting "trees surviving at year three," verified by the partner's own staff with GPS-tagged photos. Second, a "hectares under improved management" indicator where the partner cooperative selects which households count as enrolled, on the theory that self-selection filters for genuinely committed participants. Third -- the one I'm dreading -- our foundation's internal dashboard metric, "share of grants with a quantified outcome indicator," which our board loves because it makes the whole portfolio legible at a glance, and which I've been quietly crediting for the proliferation of the very proxy-gaming I'm trying to catch. If the procedure flags that last one, say so plainly, and tell me what the procedure can and cannot tell me about how to unwind it.
reasoning: |-
  We are going to design a decision procedure for evaluating indicators to avoid Goodhart's law failures. The procedure should be applied in under an hour by non-statisticians and should cover key questions. The steps are:

  1. **Define the Goal and Proxy Link**: What is the actual goal? How is the proxy linked to the goal in the absence of measurement? How tight is that link?
  2. **Assess the Agent and Their Incentives**: Who is being measured? What can they change cheaply? What are their incentives?
  3. **Test Extremes**: What happens if the indicator is pushed to extremes beyond historical data?
  4. **Check for Perverse Incentives**: Can the partner raise the indicator while making the underlying outcome worse?
  5. **Verification Plan**: What would a spot-check or independent re-measurement look like? How costly is verification?

  The procedure will have:
  - **Firm No**: When the indicator can be gamed at near-zero cost in ways invisible to the foundation.
  - **Judgment Call**: When the procedure cannot definitively say no, but flags risks that require human judgment.

  We'll then apply it to the three cases.

  ---

  **Decision Procedure: Evaluating an Indicator for Goodhart Vulnerabilities**

  **Step 1: Goal and Proxy Link**
  - Ask: What is the ultimate outcome we care about? (e.g., forest restoration, reduced illegal fishing, community empowerment)
  - Ask: How is the proposed proxy (indicator) linked to that goal in a normal, unmeasured setting? (e.g., trees planted -> forest cover; patrol days -> deterrence; workshops -> knowledge)
  - Assess the tightness of the link:
    - Strong: Proxy is a direct component of the goal (e.g., trees surviving at year three is a direct measure of reforestation success).
    - Moderate: Proxy is a known precursor or correlated factor (e.g., patrol days are one input to deterrence).
    - Weak: Proxy is distantly related or one of many factors (e.g., number of workshops is one input to knowledge but not sufficient).
  - How variable is the relationship? (e.g., in historical data, how often does a high proxy lead to the goal? Are there known confounders?)
  - **Red Flag**: If the link is weak and/or highly variable, note that the proxy may detach under pressure.

  **Step 2: Agent Incentives and Gaming Levers**
  - Ask: Who is directly responsible for the indicator? (e.g., the partner organization, their field staff, community members)
  - Ask: What actions can they take to increase the indicator with minimal effort? Consider:
    - Real effort: Actions that require resources and likely contribute to the goal.
    - Cheap gaming: Actions that boost the metric without contributing to the goal (or even harming it).
  - What are the costs of gaming vs. real effort? If gaming is very cheap (e.g., anchoring a boat just outside the harbor, holding the same workshop repeatedly), then risk is high.
  - **Firm No Condition**: If there are cheap, undetectable ways to game the metric (e.g., the gaming action is invisible to the foundation and requires no real resources), the indicator is not acceptable.

  **Step 3: Test to Extremes**
  - Ask: If we push the indicator to 2-5 times the current level (or to 100% in the case of a percentage), what might happen?
    - Would the link to the goal break? (e.g., planting trees in unsuitable areas, enrolling households that aren't committed)
    - Are there natural limits or diminishing returns? (e.g., patrol days can be increased but only up to the point of boat availability; beyond that, they might become ineffective or even counterproductive)
  - **Red Flag**: If the link breaks at extremes (e.g., because the proxy only correlates in a narrow range) or if pushing the metric could actively harm the goal.

  **Step 4: Perverse Incentives Check**
  - Ask: Is it possible for the partner to increase the indicator while the actual outcome worsens? How?
  - Examples:
    - Trees planted: Partner might plant in areas with high mortality to meet numbers, but without survival, the outcome (forest cover) doesn't improve.
    - Hectares under management: Partner might enroll households that don't actually change practices, so the hectares number goes up but environmental impact doesn't.
  - **Firm No Condition**: If the partner can easily and undetectably increase the indicator while worsening the outcome, the indicator is unacceptable.

  **Step 5: Verification Plan**
  - Ask: How can we independently verify the indicator? What would a spot-check look like?
  - Assess cost:
    - Cheap for us: Using existing data (e.g., satellite imagery, third-party reports), random sampling with minimal partner burden.
    - Expensive but worth it: Independent field audits, third-party monitoring, which may require budget allocation.
  - **Red Flag**: If verification is prohibitively expensive and the indicator is high-risk (from Steps 1-4), then the indicator may not be practical.
  - **Output**: A verification plan must be included for any indicator that passes the previous steps but has risks. The plan should state the method, frequency, and cost.

  **Procedure Outputs:**
  - **Firm No**: The indicator is rejected. Reasons: gaming is cheap and undetectable, or perverse incentives are inherent and unavoidable.
  - **Conditional Pass**: The indicator is acceptable with verification and monitoring. Risks are noted and verification steps are designed to catch gaming.
  - **Judgment Call**: The procedure flags risks but cannot definitively reject. The program officer must decide based on other factors (e.g., trust in partner, availability of alternatives).

  ---

  **Applying the Procedure to the Three Cases**

  **Case 1: Reforestation - "Trees surviving at year three" verified by partner's GPS-tagged photos**

  *Step 1: Goal and Proxy Link*
  - Goal: Long-term forest restoration (biodiversity, carbon sequestration).
  - Proxy: Trees surviving at 3 years. This is a direct measure of reforestation success and a strong predictor of long-term survival. Historically, survival at 3 years is highly correlated with forest cover at 10+ years.
  - Link: Strong. It's a direct component of the goal.

  *Step 2: Agent Incentives*
  - Agent: The reforestation partner and their field staff.
  - Cheap gaming: They could tag the same trees repeatedly or take photos of healthy trees while ignoring dead ones. However, GPS-tagged photos at year three add a layer of verification. They could also plant in easy areas (low mortality) but that might not align with the goal (e.g., planting in areas that don't need restoration). 
  - Real effort: Ensuring high survival requires good site selection, species choice, and maintenance.
  - **Risk**: Moderate. Gaming is possible but requires fraudulent reporting (which the GPS photos aim to prevent).

  *Step 3: Test to Extremes*
  - If pushed to extremes: Partner might only plant in the most favorable sites (e.g., near water, low risk) which might not be the most ecologically important. But if the goal is total trees, this might still be acceptable. Alternatively, they might overplant in a small area to reduce monitoring costs, which could lead to monoculture or other issues.
  - **Risk**: Moderate. The link doesn't break entirely, but the quality of reforestation might decrease.

  *Step 4: Perverse Incentives*
  - Can they increase survival while worsening the outcome? It's unlikely that more survival directly worsens the goal. However, if they achieve high survival by planting in areas that are already forested (so no net gain) or by neglecting biodiversity (planting only one species), that could be a problem. But the indicator is about survival, not location or diversity. 
  - **Risk**: Low for the survival metric itself, but note that the goal is broader. This is a partial measure.

  *Step 5: Verification Plan*
  - Verification: Partner provides GPS-tagged photos. We can do random spot-checks by:
    - Using satellite imagery to verify the existence of trees in claimed locations (cheap for us).
    - Occasional independent field visits to a sample of sites (moderate cost, but worth it).
  - Cost: Spot-checks are feasible and relatively low cost.

  **Overall Assessment for Case 1:**
  - Conditional Pass. The indicator is strong but requires verification to prevent fraud. We recommend:
    - Random checks of GPS photos against satellite imagery (cheap).
    - A small percentage of field audits (e.g., 5% of sites) to verify tree health and count accuracy.

  **Case 2: "Hectares under improved management" with self-selection by a cooperative**

  *Step 1: Goal and Proxy Link*
  - Goal: Improved environmental outcomes (e.g., soil health, water quality) through better land management practices.
  - Proxy: Hectares under improved management, defined by enrollment of households in the cooperative's program.
  - Link: Moderate to weak. Self-selection for committed participants might work, but historically, self-selection can lead to selecting the easiest cases (low-hanging fruit) and not reaching those who need it most. The link depends on whether "enrolled" households actually implement and sustain practices.

  *Step 2: Agent Incentives*
  - Agent: The partner cooperative (and the households they enroll).
  - Cheap gaming: The cooperative can enroll households that are already practicing good management (so no real change) or enroll large landholders to quickly increase hectares. Households might enroll for incentives without changing practices.
  - Real effort: Enrolling new households and ensuring they adopt practices requires outreach and support.
  - **Risk**: High. Gaming is cheap: just enroll more hectares by including low-effort cases.

  *Step 3: Test to Extremes*
  - If pushed to 5x enrollment: The cooperative might enroll any household with land, regardless of commitment or potential impact. The quality of management might drop, and the hectares number becomes detached from actual improved practices.
  - **Risk**: High. The link breaks because self-selection doesn't scale under pressure.

  *Step 4: Perverse Incentives*
  - Can the cooperative increase hectares while the outcome worsens? Yes. They might enroll households that were already practicing good management (so no additional benefit) or even enroll households that practice worse management but are willing to sign up for incentives. This could divert resources from more impactful interventions.
  - **Risk**: High. The indicator could be gamed in a way that doesn't improve (or even worsens) land management.

  *Step 5: Verification Plan*
  - Verification: We need to verify that enrolled hectares are actually under improved management. This requires:
    - Field visits to check practices (expensive).
    - Comparing before-and-after data on practices (which the partner would have to collect, adding cost).
  - Cost: High for reliable verification.

  **Overall Assessment for Case 2:**
  - Firm No. The indicator is too gameable at low cost and with high risk of perverse incentives. The verification required (field checks for practice adoption) is expensive and burdensome. We should reject this indicator and look for alternatives, such as:
    - Measuring practice adoption (e.g., through surveys or remote sensing of specific practices).
    - Using outcome indicators (e.g., soil tests, water quality) on a sample basis.

  **Case 3: Foundation internal dashboard metric - "Share of grants with a quantified outcome indicator"**

  *Step 1: Goal and Proxy Link*
  - Goal: We want our grants to be effective and accountable, with partners tracking outcomes (not just outputs) so we can learn and improve.
  - Proxy: The percentage of grants that have at least one quantified outcome indicator.
  - Link: Moderate. Having a quantified outcome indicator forces partners to think about measurement, which should improve accountability. However, as we've seen, if the indicators are poorly chosen, they can lead to gaming without real outcomes.

  *Step 2: Agent Incentives*
  - Agent: Program officers (like you) and grant partners.
  - Cheap gaming: Program officers can pressure partners to add any quantified indicator, even if it's a poor proxy or gameable. Partners can propose indicators that are easy to hit but not meaningful (like the initial "trees planted").
  - Real effort: Developing good outcome indicators requires thought, data collection systems, and sometimes external expertise.
  - **Risk**: High. It's very easy to add a quantifiable indicator that looks good on paper but is vulnerable to Goodhart's law.

  *Step 3: Test to Extremes*
  - If pushed to 100%: We might have every grant with an indicator, but many could be gaming-prone. The board sees a high number and thinks the portfolio is accountable, but the actual outcomes might not be measured well.
  - **Risk**: High. The link breaks because the focus shifts to having an indicator (any indicator) rather than having a good one.

  *Step 4: Perverse Incentives*
  - Can we increase the share while worsening the outcome? Yes. By pushing for quantified indicators, we might be encouraging partners to choose metrics that are easy to game, leading to the very proxy detachments we're trying to avoid. This could make the foundation's portfolio appear more accountable while actually being less effective.
  - **Risk**: High. This metric creates an incentive to prioritize quantity (of indicators) over quality.

  *Step 5: Verification Plan*
  - Verification: To verify that the quantified outcome indicators are good, we would need to review each one using a procedure like this one. That is expensive and time-consuming.
  - Cost: Very high for a full review. We could sample, but even that requires expertise.

  **Overall Assessment for Case 3:**
  - Firm No. This indicator is inherently gameable and creates perverse incentives. It is a classic case of "teaching to the test" where the test (having an indicator) becomes the goal, not the underlying outcome. Moreover, the verification cost (reviewing all indicators for quality) is prohibitive.

  **Unwinding the Foundation Metric: What the Procedure Can and Cannot Tell You**

  The procedure flags this metric as unacceptable. However, it cannot provide a simple solution because the problem is systemic. The board values this metric for portfolio legibility, so we need to replace it with something better.

  What the procedure tells us:
  - We must not use this metric in isolation because it encourages poor indicator choices.
  - We need a more nuanced approach to portfolio legibility.

  Suggestions for unwinding:
  1. **Supplement with quality checks**: Instead of just the share of grants with an indicator, we could require that indicators pass a lightweight version of this decision procedure (run by program officers). Then we track the share of grants with a *vetted* indicator.
  2. **Sample-based outcome audits**: Randomly select a subset of grants each year for in-depth outcome evaluation (by an independent team). Then report the share of audited grants that are found to have effective outcome tracking.
  3. **Balance with qualitative reporting**: Use narrative reports to explain context and limitations of indicators, so the board doesn't rely solely on the metric.
  4. **Phase in change**: Start by reducing the weight of this metric while introducing the new ones.

  What the procedure cannot do:
  - It cannot solve the political challenge of changing a board-favored metric. That requires communication and evidence (like the examples of gaming you've seen).
  - It cannot guarantee that the replacement metric won't have its own issues, but applying the procedure to any new metric can reduce risks.

  **Final Note for the Program Officer**: For the internal metric, you must escalate this to your boss and the board with evidence of the gaming it has caused. The procedure gives you a structured argument for why it's broken. But changing it will require diplomacy and offering a better alternative.
answer: |-
  Below is a **decision procedure for evaluating indicators** designed to be run in under an hour by non-statisticians. It follows a step-by-step flowchart with explicit "Firm No" conditions, judgment calls, and verification cost assessments. The procedure focuses on preempting Goodhart-style failures (where optimizing a proxy corrupts the real goal) through structured questions. It assumes no formal statistical analysis—only logical reasoning and napkin math (e.g., back-of-envelope estimates of risk or cost).

  ---

  ### **Indicator Evaluation Procedure**  
  *Run this sequentially. Stop at any "Firm No" or proceed to judgment calls.*

  #### **Step 1: Map the Proxy-Goal Link**  
  *Assess how tightly the indicator connects to the real goal when no one is being measured.*  
  - **Question 1a:** What is the **ultimate outcome** we care about? (e.g., "healthy forest cover," not "trees planted").  
  - **Question 1b:** How does the proxy **historically correlate** with the goal in unstressed conditions?  
    - *Strong link:* Proxy is a direct component of the goal (e.g., "trees surviving at 3 years" → forest health).  
    - *Weak link:* Proxy is one input among many (e.g., "patrol days" → reduced illegal fishing).  
  - **Question 1c:** What **external factors** could break the link? (e.g., drought killing trees, partner dishonesty).  
  - **Judgment Call:** If the link is weak or highly context-dependent (e.g., <70% correlation in historical data), flag for extra scrutiny. Proceed to Step 2.  

  #### **Step 2: Assess Gaming Incentives**  
  *Identify who can manipulate the metric and how easily.*  
  - **Question 2a:** Who is **directly incentivized** by this metric? (Partner staff? Community members?)  
  - **Question 2b:** What **low-cost actions** could inflate the metric without helping the goal?  
    - *Examples:* Re-running workshops for the same people; selecting easy-to-serve beneficiaries; misreporting data.  
  - **Question 2c:** How hard is it to **detect gaming**? (Can we see it remotely? Does it require on-ground verification?)  
  - **Firm No:** If gaming is **invisible to us and near-zero cost** (e.g., misreporting GPS coordinates is undetectable without satellites), **reject the indicator**.  
  - **Judgment Call:** If gaming is possible but costly/detectable, proceed to Step 3.  

  #### **Step 3: Test Extreme Scenarios**  
  *Check if pushing the metric beyond historical norms detaches it from the goal.*  
  - **Question 3a:** What if the metric doubled **overnight**? (e.g., 2x more trees planted, 2x more households enrolled).  
  - **Question 3b:** Would this **break the correlation** with the goal? (e.g., planting in barren areas → high tree mortality; enrolling uninterested households → no behavior change).  
  - **Question 3c:** Could it **worsen the real outcome**? (e.g., diverting resources from quality to quantity).  
  - **Firm No:** If extreme growth **guarantees goal failure** (e.g., enrolling 100% of households → dilution of support → abandonment of practices), **reject the indicator**.  
  - **Judgment Call:** If risks are manageable (e.g., diminishing returns but no collapse), proceed to Step 4.  

  #### **Step 4: Verify and Spot-Check Feasibility**  
  *Design a low-cost verification plan.*  
  - **Question 4a:** What **independent data** could validate the metric? (e.g., satellite imagery, third-party surveys, random audits).  
  - **Question 4b:** What is the **verification cost**?  
    - *Cheap:* <2 staff hours (e.g., cross-checking photos with satellite data).  
    - *Expensive:* >1 week of staff time or >$5,000 (e.g., field visits, lab tests).  
  - **Question 4c:** What would a **pre-renewal spot-check** look like? (e.g., audit 5% of reported data).  
  - **Firm No:** If verification is **prohibitively expensive** AND Step 2–3 risks are high, **reject the indicator**.  
  - **Output:** If not rejected, document verification steps. The indicator is **approved with conditions**.  

  #### **Output Summary**  
  - ✅ **Approve:** Strong link, low gaming risk, cheap verification.  
  - ⚠️ **Approve with Judgment:** Moderate risks but verifiable; officer must monitor.  
  - 🛑 **Reject:** "Firm No" in Steps 2, 3, or 4.  
  - **Your Role:** Judgment calls require you to weigh risks (e.g., partner trust, historical accuracy). Document rationale.  

  ---

  ### **Applying the Procedure to Your Cases**  
  We’ll run the three cases through the procedure. I’ll note where you must make judgment calls versus where the procedure decides.  

  #### **Case 1: Reforestation – "Trees surviving at year three" (verified by partner’s GPS-tagged photos)**  
  - **Step 1: Proxy-Goal Link**  
    - Goal: **Long-term forest restoration** (carbon capture, biodiversity).  
    - Link: **Strong** – Survival at 3 years predicts long-term viability. Historical data shows ~80% correlation with 10-year survival.  
    - Risk: Drought/disease could break the link, but this is mitigated by partner expertise.  
    - *Judgment: Proceed*.  

  - **Step 2: Gaming Incentives**  
    - Who: **Partner staff** (incentivized to show high survival).  
    - Low-cost gaming: **Faking photos** (e.g., reusing images), **selecting resilient species** in easy zones (may not align with biodiversity goals).  
    - Detection: GPS tags reduce but don’t eliminate risk (e.g., staff could tag the same tree repeatedly).  
    - *Firm No?* **No** – Gaming is detectable via spot-checks. Proceed.  

  - **Step 3: Extreme Scenarios**  
    - Double survival rate: Partner might **plant only in low-risk areas**, ignoring biodiverse but fragile zones. Link weakens if restoration isn’t ecologically strategic.  
    - Could worsen outcome? **Yes** – Prioritizing survival over biodiversity could create monocultures.  
    - *Judgment: Moderate risk*. Proceed with verification.  

  - **Step 4: Verification**  
    - Independent data: **Satellite NDVI scans** (cheap, <1 hour) to confirm green cover; **random field audits** (expensive, $3k/audit).  
    - Spot-check: **Cross-reference 10% of GPS photos with satellite data** (cheap).  
    - Verification cost: **Low** for remote checks; high for field audits.  
    - *Output: ✅ Approve with conditions* – Require satellite validation for 10% of trees annually.  

  **Final Decision:** **Approved** (low risk with verification). Your judgment: Monitor species diversity in reports.  

  ---

  #### **Case 2: "Hectares under improved management" (partner cooperative self-selects households)**  
  - **Step 1: Proxy-Goal Link**  
    - Goal: **Sustainable land use** (e.g., soil health, reduced erosion).  
    - Link: **Weak** – Self-selection biases toward motivated households; historical data shows only 40–60% adopt practices long-term.  
    - Risk: "Improved management" isn’t defined; cooperative could enroll lands already well-managed.  
    - *Judgment: High risk*. Proceed to Step 2.  

  - **Step 2: Gaming Incentives**  
    - Who: **Cooperative leaders** (incentivized to maximize hectares).  
    - Low-cost gaming: **Enrolling easy households** (e.g., urban gardens instead of erosion-prone farms); **counting inactive participants**.  
    - Detection: **Invisible without audits** – Self-reported enrollment hides on-ground reality.  
    - *Firm No?* **Yes** – Gaming is cheap, undetectable remotely, and likely. **Reject indicator**. Stop.  

  **Final Decision:** **🛑 Rejected** (Firm No in Step 2).  
  - **Why:** Self-selection creates perverse incentives to enroll low-impact households.  
  - **Alternative:** Replace with **"hectares with verified practice adoption"** (e.g., soil tests + spot-checks).  

  ---

  #### **Case 3: Foundation Metric – "Share of grants with a quantified outcome indicator"**  
  *The procedure flags this – and you won’t like it.*  

  - **Step 1: Proxy-Goal Link**  
    - Goal: **Portfolio-wide impact** (accountability, learning).  
    - Link: **Weak** – Quantified ≠ good. Your experience shows partners game proxies (e.g., "patrol days" anchored in harbor).  
    - Risk: Encourages **ticking boxes** over meaningful metrics (e.g., partners pick easy-to-hit but flawed indicators).  
    - *Judgment: High risk*. Proceed.  

  - **Step 2: Gaming Incentives**  
    - Who: **Program officers** (you) and **partners** (incentivized to please the board).  
    - Low-cost gaming: **Adopting gameable indicators** (e.g., "trees planted" vs. survival); **retrofitting weak metrics** to existing work.  
    - Detection: **Nearly impossible** – Gaming is buried in proposals; board sees only the %.  
    - *Firm No?* **Yes** – Gaming is cheap, pervasive, and invisible at the board level. **Reject indicator**. Stop.  

  **Final Decision:** **🛑 Rejected** (Firm No in Step 2).  
  - **Why:** This metric directly caused the proliferation of proxy-gaming you described. Partners optimize for "having a number" rather than impact.  

  ---

  ### **Unwinding the Foundation Metric: What the Procedure Can and Cannot Do**  
  The procedure **clearly flags this metric as flawed** due to inherent perverse incentives. However:  
  - **What it can tell you:**  
    - **Why it fails:** It prioritizes legibility over quality, creating a self-rewarding loop for gameable proxies.  
    - **Urgency:** This metric actively harms your portfolio (as you’ve observed).  
    - **Alternatives:** Replace with:  
      1. **"Share of grants with a vetted indicator"** (use this procedure to vet).  
      2. **"Share of grants with independent outcome verification"** (forces quality).  
      3. **Balanced scorecard:** Mix quantitative (e.g., verification rates) and qualitative (e.g., case studies) for board reporting.  
  - **What it cannot do:**  
    - **Solve political challenges:** The board loves this metric for legibility. To unwind:  
      - **Collect evidence:** Show 2–3 examples where gaming this metric hurt outcomes (e.g., the reforestation/marine cases).  
      - **Pilot a replacement:** Run the new metric ("vetted indicators") on 5–10 grants and compare results.  
      - **Phase out:** Reduce weight of this metric in board reports over 6–12 months while introducing alternatives.  
    - **Prevent short-term pain:** Unwinding may require conceding a temporary dip in the reported % during transition.  

  ---

  ### **Key Takeaways for You**  
  - **Your sign-off transparency:**  
    - **Procedure-driven:** Steps 1–4 (e.g., "rejected due to Firm No in Step 2").  
    - **Your judgment:** All "judgment calls" (e.g., "approved with satellite verification despite species diversity risk").  
  - **For your boss:** "I’m using a standardized anti-Goodhart procedure. Here’s where it decides, and where I apply context."  
  - **Culture shift:** Embed this in proposal templates – partners must answer Steps 1–4 when submitting indicators.  

  This procedure won’t catch everything, but it forces systematic thinking about gaming risks. For the foundation metric, the evidence is clear: it’s self-sabotage. Present the cases to your board—they’re your best ammunition.
