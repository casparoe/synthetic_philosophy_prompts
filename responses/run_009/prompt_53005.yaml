prompt: |-
  I've got two weeks to finish an application for a two-year fellowship that funds conceptual work on welfare economics and social choice, and my idea is still half-formed, so please turn it into a full proposal. The idea: debates about interpersonal utility comparisons are usually framed as all-or-nothing -- either we can compare wellbeing across persons or the whole utilitarian/welfarist program collapses. But measurement theory suggests comparability comes in grades: maybe you can tell who's better off (level comparison) without saying by how much, or compare the intensity of gains without comparing levels, or rank one person's improvements against another's without ranking the people themselves. My hunch is that actual policy tools only ever need weak fragments of comparability -- cost-benfit analysis, distributional weights, QALY thresholds, optimal-tax arguments -- and that these fragments may be philosophically cheaper to justify than full-blown comparisons, whether via Harsanyi-style extended preferences or via publicly observable criteria for wellbeing. So the question I want stated precisely: which policy arguments require which comparability assumptions, and can the weaker ones be defended without ever solving the classic problem of interpersonal comparison? Give me the proposal: the question, why existing positions leave it open, the method (what I'd actually do, roughly by quarter), what a result would look like, and what would count as failure or as the project just turning out boring. No citations needed, I'll add those. The funder is British, so please write the proposal itself in British English.
