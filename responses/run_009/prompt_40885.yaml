prompt: |-
  I'm a financial planner, and every year a couple of clients ask me some version of the same question: we want to give more to charity, but how do we know when we've given enough — like, how would we even tell we're "done"? I don't want to hand them a number, I want a procedure we can walk through together in a 45-minute annual meeting that turns what philosophers actually say about the demandingness of morality into something usable: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and hands the decision back to the client because it's their values not a fact, and where it's honest about being a judgment call dressed up as a step. I'm thinking of things like agent-centered prerogatives (are you allowed to keep things for yourself just because you want them, or does that need a better story), the line between duty and supererogation, whether 'what if everyone lived like this' is a fair test when its obvious everyone won't, and whether obligations should be judged against what you're actually spending your money on or against some baseline. It should also say what the procedure gets wrong — I suspect it will be too gentle on my wealthy clients, and I'd rather know that up front. Then run it on two clients: a couple with about $3M giving 2% a year who feel guilty after a famine-relief appeal, and a couple with $800k who want to take a giving pledge seriously and keep asking me whether it's supposed to hurt. Keep it to 800 words max — I'm going to print it out and keep it in my desk drawer.
reasoning: |-
  Okay, the user is a financial planner who wants a structured, philosophical approach for clients struggling with charitable giving limits. They need a 45-minute actionable framework—not just numbers—drawing from ethics concepts like agent-centered prerogatives and supererogation. 

  First, I should acknowledge their expertise: they’re clearly well-read on moral philosophy but need to translate it into client conversations. Their frustration with "handing out a number" suggests they value client autonomy. The two client examples reveal nuanced pain points—guilt vs. principled commitment—so the framework must adapt to emotional drivers, not just wealth tiers.

  Hmm... key philosophical hooks they mentioned: 
  - **Agent-centered prerogatives**: How much "self-bias" is ethically acceptable? Rawls' "savings principle" could help—clients should secure basic welfare before giving. 
  - **Duty vs. supererogation**: Need clear "floor" vs. "ceiling" criteria. Singer’s 10% benchmark might work as a starter anchor.  
  - **"What if everyone..." test**: But they’re right—it’s unrealistic. Shift to "capacity-based" responsibility instead (e.g., "What can you uniquely address?").  
  - **Baseline spending**: Must confront lifestyle inflation. Suggest "differential analysis"—compare charitable capacity against discretionary indulgences.  

  Ah, and they explicitly want transparency about flaws. The framework *will* coddle the wealthy—it’s unavoidable when using %-based tiers. I’ll flag that early.  

  For structure: A 5-step funnel makes sense—start concrete (expenses), escalate to values, end with accountability. The famine-relief couple ($3M/2%) likely needs Step 4 (lifestyle scrutiny), while the pledgers ($800k) need Step 5 (pain calibration).  

  Word count is tight—800 max. Prioritize actionable questions over theory. Example:  
  *Step 3’s "Singer Test" shortcut: "Could you give 10% without hardship? If yes, why stop at 2%?"*  

  Finally, admit judgment calls: E.g., "Is your hobby budget 'essential'?" is values-driven. The advisor’s role is to probe, not decide.  

  ...Time to draft. I’ll open by naming the bias ("gentle on wealth") so they trust the tool’s self-awareness.
answer: |-
  Here's a concise, actionable procedure for your annual meetings, grounded in ethical concepts but focused on client values and practical judgment:

  **The "Giving Enough?" Framework (45-Minute Procedure)**

  1.  **Secure Your Baseline: "Could you lose sleep over essentials?"**
      *   *Question:* Have you secured a stable foundation covering housing, healthcare, basic needs, and a reasonable retirement safety margin? (Reference: Duty to self/family as agent-centered prerogative).
      *   *Sufficient Answer:* "Yes, we're confident these fundamentals are covered long-term." (If "no," giving discussion pauses for planning).
      *   *Judgment Call:* Defining "reasonable" safety margin involves market/health uncertainty.

  2.  **Define Your Moral Minimum: "What's non-negotiable?"**
      *   *Question:* What level of giving feels like the absolute *least* you could do without failing a basic ethical duty? (Reference: Line between duty and supererogation).
      *   *Sufficient Answer:* A specific % or $ figure representing their perceived "floor." (This hands decision back to their values).
      *   *Judgment Call:* Is their minimum truly duty-based, or just what's comfortable? Challenge gently: "Why *this* number?"

  3.  **Test Against Impartiality: "What if *you* needed help?"**
      *   *Question:* If roles were reversed, would you hope someone with your capacity helped? Does your current giving meet that hope? (Reference: Modified universalization – focuses on *your* capacity, not unrealistic "everyone").
      *   *Sufficient Answer:* Acknowledgment of capacity and a defensible reason for not meeting the "hoped for" level (e.g., other priorities in Step 4).
      *   *Judgment Call:* Assessing "defensible reason" – it’s values-based, but probe if it seems self-serving.

  4.  **Scrutinize Discretionary Spending: "What are you buying instead?"**
      *   *Question:* Compare your annual giving to specific discretionary spending categories (vacations, luxury goods, expensive hobbies, dining out). Does this alignment reflect your stated values? (Reference: Agent-centered prerogatives require justification against alternative uses).
      *   *Sufficient Answer:* Conscious acknowledgment of trade-offs ("Yes, we value this luxury *more* than giving that amount extra") *or* a decision to reallocate based on values.
      *   *Judgment Call:* Defining "discretionary" – is the second home/vacation essential? Values reign supreme.

  5.  **Calibrate the 'Hurt': "Does it pinch meaningfully?"**
      *   *Question:* Does your current giving level require noticeable sacrifice or adjustment to your lifestyle? (Reference: Supererogation often involves cost to the agent).
      *   *Sufficient Answer:* "Yes, we feel it" *or* "No, it's painless," plus reflection on whether that aligns with their desired level of commitment (e.g., a Pledge).
      *   *Judgment Call:* "Noticeable sacrifice" is subjective. Focus on their perception.

  **Where it Stops:** The final decision *always* rests with the client after walking through these questions. Steps 1 & 2 establish boundaries; Steps 3-5 provide reflective tools.

  **Key Weakness:** This framework is **highly sensitive to the client's self-assessment** in Steps 2 and 4. Wealthy clients can easily justify high discretionary spending as "essential" to their well-being or define a very low "moral minimum." It likely **under-demands from the affluent** but provides structure for conscious choice.

  ---

  **Applied to Your Clients:**

  1.  **$3M Couple (Giving 2% = $60k/year, feeling guilty):**
      *   Step 1: Secure? Almost certainly *yes*.
      *   Step 2: Moral Minimum? They feel guilt; their minimum might now be >2%. Probe: "What % would eliminate the guilt? Is *that* your minimum?"
      *   Step 3: Impartiality: "If you were starving, would you hope someone with $3M gave more than $60k?" Likely *yes*. Their guilt signals misalignment.
      *   Step 4: Discretionary Spending: Compare $60k giving to their vacation/luxury budget. Does $60k seem small next to a $30k vacation? This step often triggers increases for guilt-driven clients.
      *   Step 5: Hurt? 2% likely causes no "hurt." Their guilt suggests they *want* to feel more impact. Outcome: Likely a significant increase, framed as aligning actions with awakened values.

  2.  **$800k Couple (Considering Pledge, "Should it hurt?"):**
      *   Step 1: Secure? Needs checking. $800k may be adequate or tight for retirement depending on age/spending. Ensure Step 1 is solid *first*.
      *   Step 2: Moral Minimum? They're pledge-minded; their minimum might be high (e.g., 5-10%). Define it.
      *   Step 3: Impartiality: Reinforces their pledge inclination based on capacity.
      *   Step 4: Discretionary Spending: Critical. Can they identify meaningful trade-offs to reach their minimum/pledge level without harming essentials? This makes the pledge concrete.
      *   Step 5: Hurt? This answers their core question. A pledge *should* involve some "pinch" (sacrifice of *wants*) to be meaningful supererogation, but *not* harm essentials (Step 1). The "hurt" is the conscious trade-off identified in Step 4. Outcome: Realistic pledge level based on trade-offs, embracing manageable sacrifice as part of commitment.

  **Keep in your drawer.** Use it to structure the conversation, not dictate the answer.
