answer: |-
  The EU's Article 7 mechanism embodies a profound philosophical tension between **substantive constitutionalism**, **supranational authority**, and **intergovernmental sovereignty**. Its design reflects competing visions of legitimacy that are difficult to reconcile coherently—explaining both its practical paralysis and the shift toward fiscal conditionality as an enforcement tool. Let's dissect the presuppositions:

  ### Core Philosophical Commitments & Tensions
  1. **Substantive Democracy (Non-Majoritarian)**  
     The arrangement presupposes that democracy requires *institutional safeguards* (independent judiciary, free media, checks on power) beyond electoral majorities. This aligns with **liberal constitutionalism** (e.g., Rawls, Habermas) where democracy is a system of rights and institutions, not merely popular will. A government can be *electorally legitimate* yet *constitutionally illegitimate* if it undermines these structures.

  2. **Supranational Authority**  
     By asserting the EU’s right to override national constitutional self-understanding, the mechanism assumes a **hierarchical legal order** where EU values bind member states. This reflects a **Kantian-cosmopolitan** view: democracy and rule of law are universal norms that transcend national sovereignty. The EU acts as a guardian of a shared European *Rechtsstaat*.

  3. **Intergovernmental Sovereignty**  
     The unanimity requirement for sanctions contradicts #2, reverting to a **Hobbesian-Westphalian** model: states remain ultimate arbiters. Treating governments as sovereign peers implies legitimacy flows *from* states, not *to* them via supranational norms. This creates a **self-defeating enforcement paradox**: incumbents shield peers to avoid setting precedents that could target them later.

  ---

  ### Can These Commitments Be Reconciled?
  **Only partially—through pragmatic or conceptual fudging:**
  - **Ground vs. Exercise Distinction**: The EU’s *authority* derives from shared values (supranational), but its *enforcement* respects state sovereignty (intergovernmental). Yet this fails philosophically: if states can veto enforcement, authority is illusory.  
  - **Prudential Brake Theory**: Unanimity is a safety valve against overreach, not a legitimacy claim. But this renders sanctions practically unworkable, as seen in reality.  
  - **Asymmetric Constitutionalism**: The EU operates with **contested pluralism** (MacCormick, Weiler)—member states agree on values but disagree on who enforces them. Article 7 embodies this ambiguity, allowing symbolic unity while accepting operational limits.

  **Result**: The tensions are *structurally necessary* to secure treaty ratification (respecting sovereignty) but *functionally self-sabotaging*. Hence sanctions unanimity ensures Article 7 is a "nuclear option" designed never to be used.

  ---

  ### Why Fiscal Conditionality "Works" (and What It Reveals)
  The shift to financial tools (e.g., rule-of-law conditionality on funds) exposes the EU’s *pragmatic theory of legitimacy*:
  - **Power Over Principles**: Budgetary leverage bypasses sovereignty disputes by tying funds to behavior—a **consequentialist** approach. It accepts that enforcement requires **leverage**, not just moral authority.  
  - **Technocratic Legitimacy**: Conditioning funds relies on **output legitimacy** (effective problem-solving) rather than input legitimacy (democratic consent). This "works" because:  
    - It exploits asymmetric dependence (some states need funds more).  
    - Decisions require only QMV, not unanimity.  
    - It frames issues as "financial management" not "values policing," reducing sovereignty backlash.  
  - **Implicit Admission**: The effectiveness of fiscal tools reveals that the EU’s *real* authority rests on **economic interdependence**, not constitutional supremacy.

  ---

  ### Popular Sovereignty Alternative: Consequences
  If the EU adopted a pure majoritarian view ("national electorate = final word"), the mechanism would collapse:
  1. **No Grounds for Intervention**: Backsliding regimes could immunize themselves via manipulated elections (e.g., Hungary’s Fidesz).  
  2. **Procedure Redundancy**: Article 7 would only apply to *de facto coups*, not democratic backsliding.  
  3. **Foundational Values Undermined**: The EU could not credibly claim democracy/rule of law as *supranational* values.  

  **Revised Mechanism**: To "protect democracy" under this view, the EU could only:  
  - Suspend states for *overtly abolishing elections* (e.g., military takeover).  
  - Require evidence of *electoral fraud* (not institutional decay).  

  This would abandon the founders’ goal: preventing authoritarianism within *formally* democratic systems.

  ---

  ### Conclusion: A Contradictory but Functional Ambiguity
  The arrangement rests on **schizophrenic legitimacy foundations**:  
  - **Normatively**: It asserts a supranational constitutional order.  
  - **Operationally**: It relies on interstate bargaining.  

  This reflects the EU’s hybrid polity—**neither a state nor an international organization**. Article 7’s impotence and the pivot to fiscal tools confirm that the EU’s power stems from **economic integration**, not constitutional authority. The philosophical inconsistency is *purposeful*: it allows symbolic commitment to values while limiting enforcement to realms where the EU holds tangible leverage. Whether this is sustainable as democratic backsliding accelerates remains the critical test.

  > **In short**: The procedure presupposes *Kantian ends* but relies on *Hobbesian means*—a contradiction resolved only by avoiding its use. Fiscal conditionality succeeds because it swaps Kant for capitalism.
