  ## MEMORANDUM: DECISION ON AI CONCERNS REGARDING SHORTLISTED ENTRY

  **TO:** Editorial Board, [Magazine Name]  
  **FROM:** [Your Name/Chair]  
  **DATE:** [Current Date]  
  **SUBJECT:** Resolution of Concerns Regarding Shortlisted Entry "[Story Title]" (Pen Name: [Pen Name])

  **1. Background & Issue:**  
  A shortlisted entry for our annual prize, submitted under a pen name, has triggered concerns regarding potential AI involvement in its creation. Initial detection software results are inconclusive and acknowledged to be unreliable. Our current contest rules state entries must be "the entrant's own unaided work," but lack definitions of "unaided" or procedures for investigating potential breaches. The board is divided on how to proceed, specifically regarding the value of a written interview with the author.

  **2. Board Discussion Summary:**
  *   **Pro-Interview View:** Argues that a written Q&A can reveal the author's *understanding* and *ownership* of the story – its themes, choices, characters, and creative process. Inconsistencies, vague answers, or an inability to discuss specifics could support AI involvement. The author's willingness to engage is noted positively.
  *   **Anti-Interview View:** Argues that a written Q&A, conducted *after the fact*, cannot definitively prove *how* the text was generated at the time of writing. A human author could fabricate plausible answers about an AI-generated text, or an AI could have generated the text based on a human author's detailed outline/prompting. Conversely, a nervous or inarticulate human author might struggle to discuss their work effectively. This view sees it as potentially misleading "Turing-esque" evidence irrelevant to the core question of *original generation*.

  **3. Analysis of the Written Interview:**
  We acknowledge both perspectives hold merit. While a written interview **cannot provide conclusive proof of the text's origin**, dismissing it entirely is also premature. Here's a balanced view:

  *   **Limitations:** As the skeptical view rightly points out:
      *   It assesses *post-hoc justification*, not the *generative act*.
      *   Answers can be fabricated or coached.
      *   A skilled prompt engineer could explain an AI output convincingly.
      *   A genuine but introverted author might perform poorly.
  *   **Potential Value:** However, it *can* offer **corroborative or contradictory evidence**:
      *   **Deep, Specific Engagement:** A demonstrated ability to discuss *nuanced* character motivations, *specific* editing choices (beyond grammar), *intentional* thematic ambiguities, or the *evolution* of specific passages *in detail* suggests intimate familiarity consistent with authorship.
      *   **Process Insight:** Questions about *how* the story was developed (e.g., "What sparked the central conflict?", "Were there significant changes from your first draft? Describe one.", "What research, if any, was involved?") can reveal a plausible human creative process or raise red flags if answers are generic, evasive, or contradict the text.
      *   **Inconsistencies:** Glaring contradictions between the text's complexity and the author's explanations, or an inability to address specific textual elements referenced in questions, could be significant.
      *   **Good Faith Indicator:** Willingness to engage seriously, even in writing, is preferable to refusal.

  **4. Recommendation: Proceed with Written Interview & Conditional Acceptance Pending Review**

  Given the impossibility of definitive proof, the unreliability of detection tools, the ambiguity in our rules, the author's cooperation, and the time constraints, we recommend a two-stage approach focused on **process integrity and risk mitigation** for *this specific case*:

  *   **Step 1: Conduct a Focused Written Interview.**
      *   **Purpose:** To gather *additional context* about the story's creation, not to conduct a Turing test.
      *   **Structure:** Ask 5-7 specific, text-based questions requiring detailed answers. Examples:
          *   "Describe the development of [Character X]'s motivation in the scene where [Specific Action]. What alternatives did you consider and why did you choose this path?"
          *   "The story uses [Specific Symbol/Motif] in key moments. What were you intending to convey with this, and how did you decide on its placement?"
          *   "Walk us through your revision process for the paragraph beginning '[Exact Phrase]'. What changed from earlier drafts and why?"
          *   "The ending presents an ambiguity regarding [Specific Element]. Was this ambiguity intentional? What were you hoping the reader would take away?"
          *   "What was the initial seed or inspiration for this story? How did the core idea evolve during the writing process?"
      *   **Evaluation Criteria:** Assess answers for:
          *   **Specificity & Depth:** Does the author engage concretely with the text's details?
          *   **Consistency:** Do answers align with the story's content and internal logic?
          *   **Plausibility of Process:** Does the described creative journey sound credible for human authorship?
          *   **Avoid:** Judging literary merit, writing style of the answers, or general personality.

  *   **Step 2: Review Interview & Make Final Determination - Conditional Acceptance.**
      *   **Presumption:** Absent *clear* contradictory evidence, we accept the author's submission in good faith.
      *   **Decision Matrix:**
          *   **If** the interview responses demonstrate **reasonable specificity, consistency, and a plausible creative process** regarding the submitted text -> **ACCEPT** the entry for the prize judging pool. No further action regarding AI concerns for *this entry*.
          *   **If** the interview responses are **persistently vague, generic, evasive, internally inconsistent, or fundamentally inconsistent with the text's details** -> **DISQUALIFY** the entry. The burden shifts to the author to explain the discrepancies; failure to provide a satisfactory explanation warrants disqualification based on failure to demonstrate the work is their "own unaided work" to the board's reasonable satisfaction.
      *   **Condition:** Acceptance is **conditional** upon the interview review not revealing disqualifying discrepancies as defined above. The author will be informed of this condition when sent the questions.

  **5. Why This Approach (Plain Language):**

  1.  **Practical & Actionable:** Fits within our 2-week window. Written Q&A is feasible.
  2.  **Addresses Both Views:** Utilizes the interview (as requested by half the board) but frames it strictly as evidence of *authorial familiarity and process plausibility*, not consciousness. It directly addresses the skeptical view by acknowledging its limitations and focusing on concrete textual engagement.
  3.  **Fair to Author:** Gives the author a clear, structured opportunity to demonstrate their connection to the work before any disqualification. Presumes innocence initially.
  4.  **Manages Risk:** Minimizes the chance of disqualifying a genuine human author based solely on flawed software or an awkward interview. Conversely, provides a mechanism to disqualify if the author demonstrably cannot engage meaningfully with *their own* text in a way consistent with human creation.
  5.  **Upholds "Unaided Work" (Interpreted):** Focuses on whether the author *understands and can account for* the text's creation in a manner expected of a human author. Inability to do so creates reasonable doubt about the "unaided" nature.
  6.  **Sets a Precedent (for now):** Establishes a process for similar concerns this year. *This does not bind future years*.

  **6. Action Items & Timeline:**

  1.  **Immediately:** Chair finalizes 5-7 specific questions based on the story text. (Draft circulated for board input within 48 hrs).
  2.  **Day 3:** Questions sent to author via submission contact, clearly stating: a) We are gathering context on the story's creation, b) Their responses are required for final eligibility determination, c) We require responses by **[Date - e.g., 7 days later]**.
  3.  **Upon Receipt:** Chair circulates anonymized responses to the board.
  4.  **Days 10-12:** Board members review responses against the **Specificity, Consistency, Plausibility** criteria via email/quick poll.
  5.  **Day 13:** Chair compiles feedback and makes final determination based on the matrix (Accept/Disqualify). Informs board and author (if disqualified, with brief reasoning citing specific deficiencies in responses).
  6.  **Day 14:** Proceed with announcement, including the shortlisted entry only if accepted.

  **7. For the Future (Critical):**  
  This situation highlights critical gaps in our rules. **We must urgently revise contest rules for next year to include:**

  *   A clear definition of "unaided work" (e.g., "primarily generated and creatively shaped by the entrant without substantive use of generative AI tools for drafting core narrative, character, or thematic elements" - wording TBD).
  *   Explicit prohibition of generative AI for core creation.
  *   A requirement for entrants to affirm compliance with the defined rules.
  *   A stated process for handling suspicions (e.g., right to request evidence of process/drafts, clear disqualification criteria).

  **Recommendation:** Adopt the "Proceed with Written Interview & Conditional Acceptance Pending Review" process outlined above to resolve this specific case fairly and practically within our deadline. Let's move forward with drafting the questions.
