  The board's polarization suggests a need for a compromise that respects both viewpoints. The written interview could provide some insight, but how? Maybe by assessing the author's familiarity with the story's nuances, writing process, or revisions. But as the skeptical board members argue, a good liar could fabricate that. So, the memo needs to acknowledge the limitations while still using the interview as one piece of evidence.

