  The reference class problem is tricky - I need to analyze how much of that dispute is verbal versus substantive. Some aspects are genuinely verbal (like whether to include potential observers), but the choice of which class to use in calculations is substantive.

  For the integrity clause, I'll have each side specify what evidence would falsify their position. The Carter-Leslie side might say that if updating on birth rank didn't work in uncontroversial cases, that would challenge them. The other side might admit that if their view required rejecting obvious probabilistic inferences, that would be problematic. And I need to address whether either side has "insulated" their position through reference class manipulation.

  Throughout, I'll maintain formal letter-style prose without any headings or bullet points, making the disagreement precise rather than softened. The tone should be collegial but rigorous, fitting for academics who've agreed to this joint statement despite their differences.
answer: |-
  We, the undersigned, having engaged in prolonged debate regarding the probabilistic reasoning commonly termed the "Doomsday Argument," hereby present this joint statement to clarify the nature of our agreement and the precise points of our ongoing disagreement. We concur on the following foundational points:

  Firstly, our dispute is strictly confined to the interpretation of a specific piece of self-locating evidence – one's temporal birth rank within the sequence of human observers – within a Bayesian framework. It is not a disagreement about the validity of Bayes' theorem itself, nor is it about empirical projections of future human population based on demographic data, resource constraints, or existential risks. We further agree that the core formal structure of the argument is not inherently tied to predictions of human extinction ("doom"). It manifests identically in purely hypothetical "toy" cases devoid of existential stakes, such as reasoning about one's position within a sequence of labeled cards drawn from an urn, or determining which of two rooms one occupies based on the total number of occupants each room will ever have. Both sides can faithfully describe these neutral cases without prejudicial framing.

  Despite this common ground, significant disagreements persist, which we articulate as follows, each phrased in terms acceptable to the respective proponent:

  1.  **Carter-Leslie Proponent:** "Reasoning *as if* randomly sampled from the reference class entails conditionalizing on one's birth rank *only*, treating one's existence as a fixed background condition. This conditionalization on rank necessarily shifts probability mass towards hypotheses proposing a smaller total number of observers within the reference class."
  2.  **Opposing Proponent:** "Reasoning *as if* randomly sampled is an incorrect characterization of the evidence. One must conditionalize on the full fact of one's own existence *as an observer*. This evidence inherently favors hypotheses that posit a larger number of observers, as they provide more 'opportunities' for one to exist. The apparent shift from conditionalizing on rank alone is an artifact of neglecting this prior evidential force of existence itself."

  We identify two primary cruxes underlying this disagreement:

  1.  **The Symmetry of Self-Locating Evidence:** Does the self-locating datum "I exist as an observer" carry the same evidential weight *per observer* across hypotheses that posit different total numbers of observers? The Carter-Leslie proponent holds that it does not; the evidence is fundamentally about one's specific location (rank) within the sequence, and the hypotheses being compared specify different sequence lengths. Conditionalizing on location directly affects the likelihoods. The opposing proponent holds that it *must* carry equal weight per observer; failing this leads to inconsistencies. Conditionalizing on "existence" *simpliciter* assigns higher prior probability to hypotheses with more observers, counteracting the shift induced by conditionalizing on rank.
  2.  **The Reference Class Specification:** What defines the class of "observers" from which one is purportedly sampled? Is it all *Homo sapiens*? All conscious entities? Only those capable of understanding the Doomsday Argument? We agree this choice significantly impacts the quantitative results of the Carter-Leslie calculation. We further agree that *some* aspects of this dispute are verbal, specifically concerning the *label* applied to the class (e.g., "human," "sentient being," "observer"). However, the substantive disagreement lies in *which specific class definition should be used for the probabilistic calculation* and whether the choice can be made objectively or inevitably introduces arbitrariness. The Carter-Leslie proponent argues a sensible, non-arbitrary class (e.g., biologically modern humans) can be defined. The opposing proponent argues that the lack of a unique, non-arbitrary specification undermines the entire sampling assumption, as different choices yield drastically different conclusions.

  To adjudicate these cruxes, we commit to considering specific test cases and recording our respective predictions in advance:

  1.  **The Sealed-Ward Case (Novel):** You awaken with total amnesia in a hospital ward. You know only that you were randomly assigned to one of two sealed, identical wards yesterday. Ward A will accumulate exactly 10,000 patient-days before closing. Ward B will accumulate exactly 10,000,000 patient-days before closing. You have no access to any ledger or other information. Based *only* on the fact that you exist as a patient in one of these wards today, what should you believe about which ward you are in?
      *   **Carter-Leslie Prediction:** You should strongly believe you are in Ward A (the smaller ward). Reasoning: Conditionalizing on your randomly assigned temporal position within the ward's total patient-days, finding yourself present on an early day (as you must, given the amnesia) is much more likely if the total sequence is short (10,000 days) than if it is long (10,000,000 days).
      *   **Opposing Prediction:** You should initially believe you are equally likely to be in either ward. Reasoning: Conditionalizing *only* on your existence as a patient, Ward B provides vastly more opportunities for "a patient" to exist. This prior favor for Ward B precisely counteracts the effect of conditionalizing on your specific early position, leaving the posterior probability equal. *Crucial Disagreement Point:* The opposing view holds that the Carter-Leslie prediction for this case is demonstrably wrong (one *shouldn't* favor the small ward), and since the formal structure is identical, this falsifies the analogous reasoning applied to humanity. The Carter-Leslie view holds the opposing prediction is wrong (one *should* favor the small ward), demonstrating the validity of the rank-conditionalization.

  2.  **The Presumptuous Philosopher Case (Standard):** A future civilization has the technology to run vast computer simulations containing many conscious beings. They will run either one simulation containing 10^10 observers or a trillion (10^12) simulations each containing 10^10 observers (totaling 10^22 observers). You are a conscious being in such a simulation. What should you believe about which scenario was run?
      *   **Carter-Leslie Prediction:** You should believe it is overwhelmingly likely that only one simulation was run (the smaller total observer count). Reasoning: Conditionalizing on your specific identity/rank within the observers, your existence is vastly more probable if there are only 10^10 observers than if there are 10^22.
      *   **Opposing Prediction:** You should believe it is overwhelmingly likely that the trillion simulations were run (the larger total observer count). Reasoning: Conditionalizing on your existence as a conscious being, the scenario with vastly more observers makes your existence much more probable, outweighing the rank effect. *Crucial Disagreement Point:* The Carter-Leslie view sees the opposing prediction as absurdly "presumptuous," favoring the vastly larger universe without direct evidence. The opposing view sees the Carter-Leslie prediction as ignoring the fundamental evidential force of existence itself.

  Finally, to ensure intellectual integrity, we each state what would count against our own view and address the charge of insulation:

  *   **Carter-Leslie Proponent:** My position would be significantly challenged if a compelling, non-arbitrary method for applying the "random sampling" assumption to self-location *without* producing the Doomsday shift in uncontroversial cases (like predicting one's room number in a known hotel) could be demonstrated. It would also be challenged if the opposing view could consistently resolve puzzles like the Sleeping Beauty problem without generating intuitively unacceptable results elsewhere that my view avoids. Regarding reference class, I acknowledge that choosing an overly broad or narrow class (e.g., including all potential observers or only philosophers) can insulate the conclusion. I maintain that restricting the class to biologically modern humans who have or will actually exist is the least arbitrary choice and not an insulating maneuver. If future analysis showed this choice *was* demonstrably arbitrary *and* crucial for the conclusion, that would be a defect.
  *   **Opposing Proponent:** My position would be significantly challenged if it could be shown that conditionalizing on existence *simpliciter* necessarily leads to violations of core Bayesian principles in non-self-locating contexts, or if it forced us to reject otherwise sound probabilistic inferences in simple, non-anthropic cases. It would also be challenged if the Carter-Leslie sampling assumption yielded consistently accurate predictions in domains where the total number was unknown but later verified, while my approach failed. Regarding reference class, I contend that the inability to uniquely define the reference class *is* a core problem for the sampling assumption. While I must also specify a class for the "number of opportunities," I argue this class (e.g., "possible observers like me") is less sensitive to arbitrary boundaries than the sampling class. If it were shown that *my* chosen class for "opportunities" was being manipulated post-hoc to avoid specific conclusions, that would be a defect. I maintain my choice is principled: it encompasses all entities whose existence is rendered more probable by a larger universe.

  We affix our signatures below, acknowledging this document accurately reflects our shared understanding of the dispute and our specific, divergent commitments.

  [Signatory 1 - Carter-Leslie Proponent]
  [Signatory 2 - Opposing Proponent]
