  For the HD broadcasts in cinemas, Williams would likely critique the loss of liveness and the artificiality created by close-ups. The camera angles might disrupt the intended stage perspective. However, he might appreciate the broader access. Still, he'd see it as a different experience from live opera, not a replacement.

