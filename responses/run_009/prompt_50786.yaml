  ### **Notes on the Tree**  
  - **Unoccupied Cells:**  
    - **A3A (Cave eyes: function + Mutation: function):** Unoccupied. *Unexplored* due to instability (mixes history-dependence and independence).  
    - **B3A (Mutation: no function + Tumor: function):** Unoccupied. *Incoherent* (inconsistent treatment of identical current-performance cases).  
  - **Causal-Role vs. Propensity Collapse:**  
    - They *collapse* when a trait is currently performing (e.g., mutation). The bird song case (B3) is needed to split them.  
  - **Malfunction Attribution:**  
    - Only views allowing function without current performance (e.g., etiological accounts) can attribute malfunction (e.g., cave eyes "should" see but can’t).  
    - Causal-role and hybrid (history + performance) views *cannot* attribute malfunction—if a trait isn’t performing, it has no function to malfunction.  

  **Summary:** The cave fish case did the most sorting work, cleanly splitting history-based (A) from performance/capacity-based (B) views, forcing students to confront whether function requires current utility.
