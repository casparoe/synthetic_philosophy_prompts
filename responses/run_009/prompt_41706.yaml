prompt: |-
  I sit on the bioethics advisory panel of a national health ministry, and roughly twice a year we are asked to advise on policies that affect not only how well-off future people will be but, in some cases, which people will exist at all: rules for embryo screening, birth subsidies, warnings about maternal age, what fertility treatments the state will cover. The panel is permanently split on population ethics, so we have settled on a working compromise: we accept the procreation asymmetry — there is a moral reason not to create a life not worth living that has no counterpart requiring us to create a happy life — while staying officially neutral on whether there is positive value in creating additional lives that would go well. I would like that compromise turned into a written procedure the panel can run on any proposal that reaches us, in prose an official with no philosophical training can follow. It should state the questions in the order they are to be asked, say what counts as a sufficient answer to each, mark the points where the procedure must stop and hand the question back to the panel because it turns on a contested reading rather than a settled one, and say where it can close on its own. Three distinctions must survive the translation into procedure: between policies affecting people who will exist either way and policies that change who exists; between the claim that a miserable life should not be created and the stronger claim that creating it wrongs the person created, on which the literature has no consensus; and between what the asymmetry forbids and what it merely declines to recommend. Then run the procedure on three actual proposals of the kind we see: state-funded preimplantation screening for a condition that guarantees death in early childhood but a life until then better than most children's; a cash subsidy for third children, defended with polling evidence that the children born because of it will be wanted and loved; and mandatory folic-acid fortification of flour, which improves the welfare of children who would have existed either way. At least one of the three should yield a conclusion I will find unwelcome, and you should say which one it is and why it stings. Throughout, keep separate what is settled among people who know population ethics and what is genuinely contested — the asymmetry itself is contested, as is any person-affecting reading of it — and never present a contested view as the consensus. Write the whole thing as continuous prose only, no headings, bullets, bold text, or tables, the way one would write a long letter to a colleague.
reasoning: |-
  Okay, the user is on a bioethics panel dealing with policies affecting future populations and needs a procedural framework based on their compromise position. They want a clear, step-by-step process in plain prose that officials can follow without philosophical training. 

  First, I need to unpack their core compromise: they accept the procreation asymmetry (no duty to create happy lives but a duty not to create miserable ones) while staying neutral on whether creating happy lives is positively good. The procedure must preserve three key distinctions: (1) policies affecting existing future people vs. changing who exists, (2) the weaker claim (don't create miserable lives) vs. stronger claim (it wrongs the person), and (3) what's forbidden vs. merely not recommended.

  Hmm, the challenge is translating abstract ethics into bureaucratic steps without oversimplifying contested points. The user emphasizes intellectual honesty - never presenting debated concepts like the asymmetry itself or person-affecting views as consensus. I'll need signposts where the procedure must stop and return to the panel when hitting philosophical disputes.

  For the test cases: 
  - Embryo screening for fatal childhood disease clearly triggers the asymmetry's prohibition (creating avoidable misery). 
  - Third-child subsidy is trickier - it involves creating happy lives, which the asymmetry doesn't require but doesn't forbid. The procedure should flag this as "permitted but not encouraged." 
  - Folic acid fortification is safest - it helps existing future people without changing identities. 

  Ah, the unwelcome conclusion... probably the child subsidy. The user might dislike that their asymmetry framework can't oppose policies creating unnecessary but happy lives, even if they personally find it problematic. It stings because neutrality feels like endorsing potential overpopulation or resource strain. 

  I'll structure the procedure as cascading questions: Start with "who is affected?" to separate identity-changing policies. Then for misery-creating policies, apply the settled part of asymmetry (prohibition) while bracketing the "wronging" debate. For happiness-creating policies, emphasize the lack of duty without condemning them. 

  The tone should match their formal context - like a ministerial memo but with philosophical precision. No jargon; terms like "person-affecting" need immediate plain-language explanations. And always, always highlight where consensus ends and panel deliberation must resume.
answer: |-
  Here is the written procedure, crafted as continuous prose for your ministerial colleagues, followed by application to the three proposals. I will identify the potentially unwelcome conclusion afterward.

  **Procedure:**

  When evaluating a policy proposal concerning future people, the panel employs the following sequential procedure, based on our settled working compromise regarding the procreation asymmetry. This compromise holds that there is a strong moral reason *not* to bring into existence a life predicted to be not worth living (a life of net misery), while remaining officially neutral on whether bringing into existence a life predicted to be happy (a life of net positive welfare) is itself morally valuable or required. The procedure asks specific questions in order, identifies where unanimous agreement requires stopping for full panel deliberation, and clarifies what constitutes a sufficient answer based on our compromise.

  **Step 1: Identify the Primary Effect on Future People.** Ask: *Does the policy primarily change the welfare of individuals who would exist regardless of whether the policy is implemented, or does it primarily change which specific individuals come into existence?* A sufficient answer requires analyzing the policy's mechanism. If the policy changes circumstances (like health interventions, resource allocation, or warnings) for individuals already likely to be conceived and born under the status quo, it primarily affects welfare. If the policy changes conception timing, genetic selection criteria, or fertility incentives/access in ways that directly determine *which* sperm fertilizes *which* egg, leading to different individuals being born, it primarily changes who exists. If the effect is unclear or mixed, the procedure stops here, and the question is returned to the full panel for deliberation on the nature of the effect.

  **Step 2: Assess Policies Affecting Welfare of Fixed Future People.** If Step 1 concludes the policy mainly affects the welfare of individuals who will exist either way, ask: *Is the policy likely to significantly increase the welfare of these future individuals compared to the status quo, without imposing disproportionate burdens on existing people?* A sufficient affirmative answer requires credible evidence (epidemiological, economic, sociological) that the policy demonstrably improves outcomes like health, opportunity, or well-being for the identifiable future population. A sufficient negative answer requires credible evidence that it significantly harms their welfare or imposes excessive costs/risks on current people. If the welfare impact is ambiguous, negligible, or the burdens disproportionate, the procedure stops, and the question returns to the panel. This step relies on standard welfare economics and harm-benefit analysis, not contested population ethics, and can close on its own with a recommendation for or against based on the welfare assessment.

  **Step 3: Assess Policies Changing Who Exists - Avoiding Miserable Lives.** If Step 1 concludes the policy primarily changes who exists, ask: *Is there credible evidence that the policy, if implemented, would lead to the creation of individuals whose lives are predicted to be not worth living (lives of net misery) who would not have otherwise existed?* A sufficient affirmative answer requires strong scientific or demographic evidence linking the policy to the conception and birth of individuals with conditions or circumstances reliably associated with overwhelming suffering and minimal positive experience. If the answer is "Yes," then, based on our acceptance of the procreation asymmetry, there is a decisive moral reason *against* implementing the policy. This conclusion holds *regardless* of whether creating such a life also wrongs that specific individual (a contested philosophical point on which we remain neutral). The procedure identifies this as a settled point *within our compromise framework*: creating lives not worth living is forbidden by the asymmetry. The procedure can close here with a recommendation against the policy. If the answer is "No, it will not create such miserable lives," proceed to Step 4.

  **Step 4: Assess Policies Changing Who Exists - Creating Happy Lives.** If Step 3 concludes the policy changing who exists will not create lives of net misery, ask: *Is there credible evidence that the policy will lead to the creation of additional individuals (beyond those who would exist anyway) whose lives are predicted to be happy (lives of net positive welfare)?* A sufficient affirmative answer requires evidence that the policy demonstrably increases the birth rate of wanted children in circumstances conducive to well-being. A sufficient negative answer requires evidence that it either reduces births or doesn't change the number of happy lives created. Crucially, based on our compromise and the procreation asymmetry we accept: **Even if the answer is "Yes" (it creates additional happy lives), our framework provides no positive moral reason *to* implement the policy for that reason alone.** The asymmetry means we lack a duty to create happy lives. We are officially neutral on whether creating such lives has positive moral value. Therefore, a "Yes" here does *not* translate into a moral imperative or even a positive recommendation *based on population ethics*. The policy might be permissible, but it is *not required* by the asymmetry principle we use. The question of whether to implement such a policy must then be decided *solely* based on other factors, such as:
  *   Costs to existing people (financial, resource, environmental).
  *   Impacts on the welfare of existing people and future people whose existence is fixed.
  *   Broader social goals, justice considerations, or feasibility.
  The procedure stops at this point and *must* return the question to the full panel for deliberation. Our compromise framework provides no population-ethics-based answer for policies that create additional happy lives without creating miserable ones. The panel must weigh the other factors listed above.

  **Application to Proposals:**

  1.  **State-funded preimplantation screening for fatal childhood condition (life until death better than most):**
      *   **Step 1:** This policy primarily changes *who* exists. It enables selecting embryos without the fatal condition, leading to the birth of healthy children who *would not otherwise have been born* (as the selected embryo is different). The child with the condition would not exist; a different, healthy child would.
      *   **Step 3:** Does it create lives not worth living? No. The policy *prevents* the birth of children guaranteed to die painfully in early childhood. While their life until death might be "better than most," the overwhelming consensus (reflected in our accepted asymmetry) is that a life guaranteed to end in severe suffering and very early death is a life *not worth starting* – the net misery is inevitable and profound. Preventing such a birth is directly aligned with the asymmetry's prohibition. **Conclusion:** Based on Step 3, the procedure closes with a population-ethics-based recommendation *in favor* of funding the screening (as it prevents the creation of lives not worth living).

  2.  **Cash subsidy for third children (defended with evidence they will be wanted/loved):**
      *   **Step 1:** This policy primarily changes *who* exists. The subsidy incentivizes some couples to conceive a third child they otherwise would not have had, leading to the birth of specific individuals who would not have existed without the subsidy.
      *   **Step 3:** Does it create lives not worth living? The defense (wanted, loved) strongly suggests the predicted lives are happy (net positive welfare). Absent evidence suggesting these third children will overwhelmingly suffer, the answer is "No."
      *   **Step 4:** Does it create *additional* happy lives? Yes, based on the polling evidence provided. **However, per Step 4, our asymmetry framework provides *no positive moral reason* to implement the subsidy for the purpose of creating these happy lives. It is *not required* by our population ethics compromise.** The policy might be permissible, but its justification must rest entirely on other grounds (e.g., demographic goals, fairness to large families, economic stimulus) which involve complex trade-offs (costs, resource use, environmental impact). **Conclusion:** The procedure stops here and returns the question to the full panel for deliberation based on non-population-ethics factors. Our framework offers no endorsement based on the creation of the happy third children themselves.

  3.  **Mandatory folic-acid fortification of flour:**
      *   **Step 1:** This policy primarily affects the *welfare* of individuals who would exist either way. It reduces the incidence of neural tube defects (NTDs) in pregnancies that would occur regardless of fortification. The children born are largely the same individuals, but healthier.
      *   **Step 2:** Is it likely to significantly increase welfare? Yes, overwhelming evidence shows folic acid prevents severe NTDs (like spina bifida and anencephaly), drastically improving health outcomes and reducing suffering for affected children (and burdens on families/society). The cost is low and burdens minimal. **Conclusion:** Based on Step 2, the procedure closes with a recommendation *in favor* of fortification based on standard welfare improvement for future people whose existence is fixed.

  **The Unwelcome Conclusion and Why it Stings:**

  The conclusion regarding the **cash subsidy for third children (Proposal 2)** is likely the unwelcome one. The procedure, strictly adhering to our compromise on the procreation asymmetry, yields the outcome that creating demonstrably happy lives provides *no positive moral reason* to support the policy under our population ethics framework. It forces the panel to either:
  1.  **Reject the policy purely on other grounds (cost, environment, etc.),** potentially appearing dismissive of the genuine happiness of the children who would be born and the desires of the parents, or
  2.  **Support the policy based solely on those other grounds,** feeling like a hollow justification when the intuitive appeal was precisely about enabling those happy lives to exist.

  **Why it stings:**
  *   **Intuitive Discomfort:** It feels counterintuitive that actively facilitating the creation of loved, happy children isn't seen as a *positive good* by our official procedure.
  *   **Neutrality Feels Like Neglect:** Our neutrality on the value of creating happy lives can feel like indifference, especially when presented with evidence of the specific well-being of the children who would result. It seems to ignore the joy created.
  *   **Undermines the Policy's Core Defense:** The core argument presented ("these children will be wanted and loved") is rendered irrelevant by our population ethics procedure. The defense we find most sympathetic is disarmed.
  *   **Highlights the Limitation of the Compromise:** It starkly exposes the gap in our framework – we forbid creating misery but offer no encouragement for creating happiness. This feels ethically lopsided and potentially demotivating for policies aimed at supporting families and births under good conditions.
  *   **Forces a Different Battle:** It pushes the debate onto terrain (costs, resources, sustainability) that might be less compelling or harder to win than the simple appeal to enabling happy lives.

  The subsidy case vividly demonstrates the practical consequence and potential frustration of adhering strictly to the procreation asymmetry compromise: it prevents us from endorsing policies *because* they create happy future people, even when that creation seems unambiguously desirable. This is the cost of bracketing the unresolved philosophical question about the positive value of existence itself.
