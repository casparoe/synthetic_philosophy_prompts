  Please explain a somewhat awkward feature of Jeffrey conditionalization: when you do successive Jeffrey updates on *different* partitions, the order in which the evidence arrives matters, and the end result can differ from what you'd get if you somehow took all the soft evidence in one go. Intuitively, why does this happen — is it a bug or is it arguably fine (e.g. because the later observations are themselves evidence about how you should have taken the earlier ones)? And how does it square with Jeffrey's radical probabilism, where there's no privileged set of "evidence" propositions and the agent's intermediate probabilities are supposed to be all there is? Please keep it fairly conceptual — a bit of probability notation is fine but I mostly want the intuition, not a formal treatment. Answer in British English.
