answer: |-
  Your observations cut to the heart of contemporary epistemological debates. Philosophers *have* carved these apart, though consensus on the precise nature of the boundaries is elusive. Here's the breakdown:

  1.  **Stakes-Sensitivity / Pragmatic Encroachment:** This names your first pattern.
      *   **Core Idea:** Whether an agent *knows* that P can depend on practical factors like what's at stake if they are wrong. High stakes seem to raise the "epistemic standard" required for knowledge.
      *   **Your Examples:**
          *   **Pharmacy (Low Stakes -> High Stakes):** Same evidence (track record), but the shift from "no big deal if closed" to "child's health depends on it" makes you reluctant to claim knowledge and motivates further checking. The intuition is that *what it takes to know* has changed.
          *   **Bridge Engineer (Outcome Dependence / Hindsight Bias):** This is often treated as *distinct*, though related. It highlights the *temporal* aspect and the influence of *actual outcome* on knowledge attribution. We are often more willing to attribute knowledge *after* a successful outcome and retract it *after* a failure ("They got lucky, they didn't *really* know"), even if the evidence beforehand was identical. This leans more towards a psychological bias (hindsight bias) affecting our *judgments* rather than necessarily reflecting a change in the *fact* of knowledge itself at the prior time. It's sometimes discussed under "Moral Luck" or specifically "Epistemic Luck," but the bridge case is a classic illustration.

  2.  **Conversational Context Sensitivity / Contextualism about 'Knows':** This names your second pattern.
      *   **Core Idea:** The truth-conditions (meaning) of the word "know" and sentences containing it *shift* depending on the conversational context. When skeptical possibilities become salient (e.g., talking to a nervous flyer), the standards for truthfully saying "S knows P" rise. When mundane contexts prevail (e.g., talking to a colleague), the standards lower.
      *   **Your Example:** Your confidence in flight safety remains constant. Yet, saying "I know" feels inappropriate (even false?) with the nervous flyer because the possibility of crashing becomes salient, raising the epistemic standard. With your colleague, where such possibilities aren't relevantly in play, "I know" feels perfectly appropriate. The *word* "know" itself is context-sensitive.

  **Are They the Same Phenomenon? Distinguishing the Boundaries:**

  While both phenomena involve the *attribution* or *assertibility* of "knows" varying with non-evidential factors, philosophers generally treat them as **distinct**, though often interacting:

  1.  **Locus of Change: Knowledge State vs. Linguistic Meaning/Assertion Norms**
      *   **Pragmatic Encroachment (PE):** Argues that the *knowledge relation itself* is sensitive to practical stakes. What constitutes *sufficient justification* or *elimination of relevant alternatives* for S to *be in the state of knowing P* depends on what's practically at stake for S. High stakes literally make it harder (or impossible) to *know* something you could know in low stakes with the same evidence. (*Knowledge itself shifts*).
      *   **Contextualism (C):** Argues that the *word* "knows" is context-sensitive (like "tall" or "flat"). The proposition expressed by "S knows P" changes with the context of utterance (especially the speaker's context). In high-standards contexts (nervous flyer), "S knows P" expresses a proposition requiring S to rule out more alternatives, which might be false even if S meets lower standards. In low-standards contexts (colleague), it expresses a proposition requiring less, which might be true. (*The meaning/truth-conditions of the claim "S knows P" shift*, while the underlying epistemic state S is in might remain constant).
      *   **Strict Invariantism (SI):** Denies both PE and C. Argues that the knowledge relation and the semantic meaning of "knows" are *fixed* and insensitive to stakes or conversational context. The variations you observe are purely *pragmatic* effects concerning when it is *appropriate or useful* to *claim* knowledge, or due to psychological biases (like the bridge case), not changes in truth or the knowledge state itself. (*Only the etiquette of assertion shifts*).

  2.  **Your Core Boundary Question: Situation vs. Etiquette of Saying "Know"**
      *   **Pragmatic Encroachment (PE):** Changes in what's at stake *can make it literally false that you knew something you would otherwise have known*. The situation (the stakes) changes the epistemic standards required for the knowledge *state* to obtain. High stakes can *destroy* knowledge that existed in low stakes with the same evidence.
      *   **Contextualism (C):** Changes in conversational context change what proposition "I know P" *expresses*. In the high-stakes pharmacy situation, saying "I know it's open" might express a false proposition because the context has raised the standards (making salient alternatives like "maybe they changed hours due to an emergency"). However, in that same high-stakes context, it might still be true that you "know" it's open *relative to the lower standards of an ordinary context*. The underlying epistemic state might be constant; it's the *claim* that becomes false (or true) relative to the context of utterance. The "etiquette" is tied to the *meaning and truth* of the claim in that specific conversation.
      *   **Strict Invariantism (SI):** Changes in stakes or context *never affect the truth of "S knows P" or the existence of the knowledge state*. They only affect whether it's *reasonable, prudent, polite, or practically useful* to *assert* "I know P". Saying "I believe" in high stakes or to a nervous flyer is just being cautious or managing expectations, not reflecting a change in what you actually know or the truth of a knowledge claim. It's purely about the *etiquette of assertion*.

  **Settled Views? Edge Cases to Test:**

  There is **no settled consensus**. Each view has prominent defenders and faces challenges.

  *   **PE vs. C:** This is a major live debate. PE posits a shift in the *metaphysics* of knowledge (what it takes to *be* knowledge), while C posits a shift in the *semantics* of "knows" (what "S knows P" *means* in a context). Proponents of C often argue PE is unnecessary to explain the data; proponents of PE argue C doesn't capture the genuine shift in what's *required for rational action* under high stakes.
  *   **SI vs. PE/C:** SI argues both PE and C overcomplicate a simple invariant relation by misinterpreting pragmatic effects.

  **Edge Cases to Test the Boundaries:**

  1.  **The Unaware High-Stakes Subject (Testing PE vs. Others):** Imagine you casually drive to the pharmacy on a normal Tuesday (low stakes for you). Unbeknownst to you, if the pharmacy *is* closed, a catastrophic chain of events affecting millions will be triggered (massive objective stakes). Do you *know* it's open? SI and C (relative to your context) would likely say yes. PE proponents face a dilemma: if knowledge depends on *objective* stakes, you don't know; if it depends on the *subject's* perceived stakes, you might still know. This tests whether stakes need to be *recognized* to affect knowledge (PE) or whether context-sensitivity requires salience (C).
  2.  **Identical Twins, Different Audiences (Testing C vs. SI):** You are equally confident about flight safety. You simultaneously say to the nervous flyer (Nellie), "I don't *know* it won't crash, but I'm very confident," and whisper to your colleague (Colin), "I *know* it won't crash." Did you speak falsely to Colin? C says no – the proposition expressed to Colin, relative to the relaxed standards of that sub-context, was true. SI says you spoke truly to Colin (assuming you meet the invariant standard), and your statement to Nellie, while perhaps prudent or polite, was literally false (you *do* know). The whisper tests whether the meaning of "know" can shift *within* a broader conversation.
  3.  **The Implacable Skeptic (Testing Limits of C):** Imagine talking to a philosopher who constantly raises every conceivable skeptical scenario (brains in vats, evil demons). If C is correct, saying "I know I have hands" becomes literally false in this context because the standards are astronomically high. But does this seem plausible? Or is the skeptic just misusing language or demanding something unreasonable? This tests whether conversational salience *alone* can make knowledge attributions false.
  4.  **Pharmacy: Emergency Room vs. Candy Bar (Testing PE):** Same track record evidence. Low Stakes: You want a candy bar. High Stakes: Your child needs life-saving medicine available *only* at that pharmacy tonight. The PE intuition is strongest here – the shift feels like a difference in the *justificatory burden* required for the belief to count as knowledge *given what depends on it*. Does the mere *possibility* of needing life-saving medicine tomorrow (even if you don't need it today) change whether you know the hours *today*? This probes the link between stakes and the epistemic state itself.

  **Conclusion:**

  1.  **Pattern 1 (Stakes/Outcome):** Primarily discussed as **Pragmatic Encroachment** (for the stakes-sensitivity affecting knowledge *state*) and often linked to issues of **Epistemic Luck** (for the outcome-sensitivity/hindsight bias). They are related but distinct phenomena.
  2.  **Pattern 2 (Conversation):** Primarily discussed as **Contextualism about 'Knows'**.
  3.  **Distinctness:** They are treated as distinct phenomena, though both challenge traditional invariantist views of knowledge. PE focuses on how *practical situation* affects the *epistemic state*, while C focuses on how *conversational context* affects the *meaning and truth* of knowledge *attributions*.
  4.  **The Boundary (Situation vs. Etiquette):** This *is* the core debate:
      *   **Pragmatic Encroachment:** Stakes can change whether you *are in the state of knowing* (affects the situation itself).
      *   **Contextualism:** Context changes what the *word "know" means* when you say it (affects the truth of the utterance, not necessarily the underlying state).
      *   **Strict Invariantism:** Only the *propriety of assertion* changes (pure etiquette).

  Your pharmacy case is a battleground between PE and C (does the high-stakes situation change the knowledge state or just the semantic standard for truthfully claiming it?). Your airplane case is a classic argument *for* C against SI. The bridge case highlights a separate, though real, psychological bias affecting attributions.

  No single established distinction perfectly carves the phenomena exactly as you intuit, but the framework of **Pragmatic Encroachment vs. Contextualism vs. Strict Invariantism** provides the tools and vocabulary to rigorously explore the boundary you seek between the "situation itself" and the "etiquette of saying 'know'." The edge cases are crucial for testing which view holds up best.
