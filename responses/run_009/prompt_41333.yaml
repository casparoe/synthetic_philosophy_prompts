prompt: |-
  After 1945, West German courts and legislators dealt with Nazi-era wrongs along two different tracks. On one track, courts sometimes declared that particularly vicious Nazi statutes had never truly been law at all, invoking the formula associated with Gustav Radbruch on which a statute of extreme injustice forfeits its legal character. On the other track, when no such move was available — for instance, where a denunciation or killing had been fully lawful under the Nazi order — the legislature resorted to openly retroactive statutes, and it repeatedly restarted or extended the running of limitation periods for Nazi-era murders, candidly acknowledging that it was imposing liability on past conduct that had not been punishable under the law in force at the time. What theory of law does this two-track practice presuppose? It looks as though the nullification track presupposes something like natural law — that legality depends on moral content — while the retroactivity track presupposes legal positivism, since it treats the Nazi rules as having been valid law that only new, acknowledged-positive law can now displace. Can any single jurisprudence license both tracks, as the participants in the Hart–Fuller debate might each reconstruct it, or do the tracks genuinely presuppose inconsistent views? Please reconstruct the implicit theory of the practice as a whole, distinguish what it strictly presupposes from what it merely fits well with, identify where it is philosophically underdetermined such that several theories could accommodate it, and note what would have to change if the practice had to rest on one consistent theory. Along the way, tell me how confident you are in your claims and which point you are least sure of. Please answer in American English.
reasoning: |-
  Okay, the user is asking about West Germany's post-WWII legal approach to Nazi-era crimes and what theory of law it implies. This seems like a complex jurisprudential question involving the Hart-Fuller debate. 

  First, I need to unpack the two-track system: one track used Radbruch's formula to nullify extremely unjust Nazi laws (natural law leaning), while the other used retroactive statutes for acts legal under Nazi rule (positivist leaning). The user wants to know if these can coexist under a single theory.

  Hmm, the user appears knowledgeable - they mention Hart-Fuller and Radbruch explicitly. Probably a law student or legal philosopher. Their deeper need might be understanding how real-world legal systems handle transitional justice when faced with institutionalized evil. 

  Let me analyze the tensions:
  The nullification track suggests morality is inherent to legality (à la Fuller), while retroactivity accepts Nazi laws were technically valid but morally bankrupt (Hart's positivism). This looks contradictory at first glance.

  But perhaps in practice it's coherent? West Germany seemed to operate on what I'd call "qualified positivism" - recognizing Nazi laws as formally valid but morally voidable through extraordinary measures. The legislature's candor about retroactivity is key - they didn't pretend Nazi laws weren't "law," just that justice required overriding them.

  Where I'm least confident is whether this truly resolves the philosophical tension. Hart would still criticize Radbruch-style nullification as smuggling in natural law. And Fuller might object that retroactivity undermines legality's inner morality. But for transitional justice purposes, maybe theoretical purity must yield to moral necessity.

  The user's "underdetermined" point is sharp - the practice doesn't require choosing between Hart and Fuller. Parliament could've justified both tracks through democratic sovereignty without deeper jurisprudential commitments. 

  If forced into one theory? Retroactivity fits positivism better if we accept Austin's "command of sovereign" view, but nullification would need recharacterization as judicial lawmaking. A natural law approach would struggle with retroactivity unless treating it as restorative justice.
answer: |-
  The West German two-track approach reflects a **pragmatic transitional jurisprudence** that navigates between legal positivism and natural law without committing fully to either. Here's a reconstruction of its implicit theory, distinguishing presuppositions from philosophical flexibility:

  **Core Presuppositions of the Practice:**
  1. **Nazi Law as Formally Valid but Morally Voidable:**  
     The practice *strictly presupposes* that Nazi statutes were technically "law" in a formal sense (positivist view), but could be nullified when they crossed an extreme threshold of injustice (Radbruch's natural-law threshold). Retroactive legislation further confirms this: if Nazi laws were *never* valid, retroactivity would be logically redundant.

  2. **Sovereign Authority to Override Past Law:**  
     It presupposes the post-Nazi legislature possesses the sovereign power to:  
     - Declare certain past "laws" non-law (via judicial Radbruch applications).  
     - Enact new retroactive laws displacing past valid statutes.  
     This assumes a **Kelsenian "Grundnorm" shift** after 1945, where the new constitutional order holds ultimate authority to validate/invalidate prior norms.

  3. **Limitation Periods as Procedural, Not Moral:**  
     Extending statutes of limitations assumes these are *procedural rules* subject to legislative adjustment, not substantive moral absolutes. This fits legal positivism’s separation between law and morality on technical points.

  **Philosophical Underdetermination:**
  - **Radbruch Track:** Compatible with both:  
    - *Natural Law:* Injustice negates legal character (Fuller’s "inner morality of law").  
    - *Inclusive Positivism:* The legal system *itself* incorporates morality as a validity condition (as Hart later conceded).  
  - **Retroactivity Track:** Compatible with:  
    - *Exclusive Positivism:* Only new positive law can override past valid law (Hart’s core view).  
    - *Democratic Legitimacy:* Retroactivity is justified by the new regime’s moral authority, not jurisprudence.  

  **Hart vs. Fuller Reconstructions:**  
  | **Theorist** | **Radbruch Nullification** | **Retroactive Statutes** |  
  |--------------|----------------------------|--------------------------|  
  | **H.L.A. Hart** | Inconsistent with positivism; "law is law" regardless of injustice. *Could reconstruct as:* Judicial lawmaking *disguised* as nullification. | Fully consistent: New sovereign’s commands override past law. |  
  | **Lon Fuller** | Fully consistent: Laws failing "inner morality" (e.g., extreme injustice) are not law. | Problematic: Retroactivity violates Fuller’s principles of clarity and non-retroactivity. *Could reconstruct as:* Necessary exception for "rotten systems." |  

  **A Coherent Implicit Theory?**  
  The practice forms a **unified "Constrained Positivism"**:  
  - **Core:** Nazi laws were *formally valid* under the prior system (positivism).  
  - **Constraint:** Validity dissolves for norms violating *fundamental jus cogens* principles (Radbruch’s "extreme injustice").  
  - **Sovereign Correction:** Where Nazi acts were formally legal, new democratic sovereignty may *openly* legislate retroactively to achieve justice, prioritizing moral necessity over strict legality.  

  **Confidence Assessment:**  
  - **High Confidence:** The practice rejects *pure* positivism (by nullifying unjust laws) and *pure* natural law (by using retroactivity instead of universal nullification). Its coherence lies in sovereign transitional authority.  
  - **Moderate Confidence:** It aligns with *incorporationism* (morality as part of validity conditions) or *soft natural law* (minimal moral thresholds).  
  - **Least Confident Claim:** That Radbruch nullification *requires* natural law. Inclusive positivists could argue the post-1945 *Grundnorm* absorbed Radbruch’s principle as a validity test. (I’m 70% sure natural law is implied, but positivist reconstructions are plausible.)  

  **If Forced into One Consistent Theory:**  
  A **Fullerian "Restorative Legality"** framework could unify both tracks:  
  1. Nazi laws violated the "internal morality of law" (e.g., lack of congruence between rules and their application to denunciations).  
  2. Post-1945 actions restore legality through:  
     - Judicial repair (nullifying non-laws).  
     - Legislative repair (retroactive correction where past "laws" were formally congruent but substantively evil).  
  **Change Required:** Legislators would need to frame *all* retroactivity as restoring "true law," not conceding Nazi legality—a departure from their candid positivist language.  

  **Conclusion:**  
  The practice presupposes **transitional sovereignty** with a **minimal moral threshold** for legal validity. It is philosophically underdetermined between inclusive positivism and soft natural law but *inconsistent* with hard positivism (à la Hart) and robust natural law (which would reject retroactivity). Its genius lies in using both tracks to confront distinct wrongs: nullification for perverted *norms*, retroactivity for perverted *acts under valid norms*. This duality acknowledges Nazi law’s terrifying "efficacy as system" while denying its moral-legitimate authority.
