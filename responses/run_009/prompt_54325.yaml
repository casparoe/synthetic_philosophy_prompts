answer: |-
  **The Scenario**  
  It's Tuesday evening, and Maya runs a small bakery. Tomorrow, she's catering a high-profile wedding with 500 custom cupcakes. Her specialty vanilla extract, shipped overnight, is stuck in transit due to a regional storm. The tracking shows "delayed," last scanned 200 miles away at 5 PM. Maya has a backup synthetic vanilla, but it produces a subtle metallic aftertaste detectable to about 10% of palates. She tells her anxious assistant: *"Look, if the shipment arrives by 7 AM tomorrow, the cupcakes will be perfect. Otherwise, we use the backup and hope the champagne distracts them."* The shipment could plausibly arrive overnight (drivers sometimes push through delays) or not (the storm was severe). Everyone is awake, watching tracking apps and weather radars, genuinely unsure.

  **Why the Indicative Works**  
  Asserting "If the shipment arrives by 7 AM, the cupcakes will be perfect" is reasonable because Maya is stating a direct, expected causal consequence within the actual course of events she’s planning for, given her current uncertainty. It expresses her belief about the real-world dependency *if* this live possibility materializes. It’s part of her contingency planning and reflects the open epistemic state: arrival is still a factual option.

  **Why the Counterfactual Doesn’t**  
  Uttering "If the shipment *were* to arrive by 7 AM, the cupcakes *would* be perfect" *at this same moment* feels jarring and unreasonable. The counterfactual "were...would" structure inherently suggests the speaker is treating the antecedent as *contrary to fact* or at least significantly distanced from reality. Here, the shipment’s arrival isn’t a remote fantasy; it’s a live, actively monitored possibility (tracking updates might ping any minute). Using the counterfactual implies Maya is mentally placing the shipment’s arrival in a hypothetical, non-actual world, which clashes with the genuine, urgent uncertainty dominating the actual situation. It sounds like she’s resigned to it *not* arriving, undermining the live contingency.

  **What's Doing the Work**  
  The key feature is **epistemic openness** – the antecedent (shipment arrival) is genuinely unresolved *at the time of utterance* and actively being monitored. This openness anchors the indicative to the unfolding reality. *Remove this*: If Maya *knew* the shipment was destroyed (e.g., truck caught fire, confirmed via call), the counterfactual ("If it *had* arrived...") becomes natural because the antecedent is settled-false. Without epistemic openness, the split collapses; both conditionals can coexist when the antecedent is known false, but only the indicative thrives under genuine uncertainty.

  **The Pushback**  
  A unificationist philosopher might argue both conditionals share the same core semantics (e.g., a variably strict conditional analyzing "if" via possible worlds similarity), and the difference stems purely from **pragmatic context affecting the modal base**. They'd say Maya's knowledge state determines which worlds are "relevant" or "close." For the indicative, the modal base includes worlds where the shipment arrives (since it's possible), making "if p, q" assertable. For the counterfactual, uttering "if p *were*..." pragmatically *signals* the speaker is temporarily excluding p-worlds from the closest worlds (perhaps due to pessimism), making "q *would* happen" inapplicable. The divergence isn't semantic, they'd insist, but about how the speaker's epistemic state and intentions constrain the worlds under consideration when choosing the grammatical form.

  **The Reverse Direction**  
  Building a live-antecedent case where the *counterfactual* is assertable but the *indicative* isn't seems impossible without smuggling in *some* element of distance or doubt about the antecedent's *actuality*. Even in cases like "If I *were* you, I'd quit" (where "I am you" is metaphysically impossible), the antecedent's known falsity is foundational. The counterfactual form inherently leans on *some* anchor – known falsity, remoteness, or implausibility – distancing p from the speaker's conception of actuality. Without that crutch, the indicative owns the live-antecedent space.
