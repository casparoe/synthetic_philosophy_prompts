answer: |-
  ## Joint Statement: Reformed Conditional Analysts & Disposition Critics  
  *(Adversarial Collaboration Draft)*  

  **1. Agreed Claims:**  
  1.1. The Simple Conditional Analysis (SCA) – "X is disposed to M when S iff X would M if S were the case" – is conclusively refuted by cases like Martin's electro-fink and styrofoam-masked glass. These demonstrate that SCA yields false positives/negatives.  
  1.2. In Martin's electro-fink: A live wire *is* disposed to shock when touched, but *would not* shock if touched (due to the fink). Thus, SCA falsely denies it is live.  
  1.3. In the styrofoam-masked glass: A fragile glass *is* disposed to break when struck, but *would not* break if struck (due to the mask). Thus, SCA falsely denies it is fragile.  
  1.4. Dispositions are *grounded* in intrinsic properties of objects (e.g., molecular structure for fragility).  
  1.5. Disposition ascriptions in ordinary language (e.g., "fragile", "flammable") track real, stable features of objects, not merely transient situational contingencies.  
  1.6. Interfering factors (finks, masks, antidotes) prevent the manifestation of a disposition without necessarily destroying the underlying basis.  
  1.7. Any adequate account of dispositions must explain why finks/masks defeat disposition ascriptions while ordinary background conditions do not.  

  **2. Disagreements Table & Testing Grounds**  

  | Row | Disagreement Statement (Reformed Analyst View) | Disagreement Statement (Critic View) | Underlying Crux | Test Case | Reformed Prediction | Critic Prediction |
  | :-- | :--------------------------------------------- | :----------------------------------- | :-------------- | :-------- | :------------------ | :--------------- |
  | **2.1** | "A disposition ascription is *constituted by* a complex counterfactual conditional (requiring intrinsic basis and no interfering factors), not merely correlated with it." | "A disposition ascription *reports* an intrinsic property (categorical or dispositional), and the counterfactual connection is a *symptom* or *typical effect* of that property, not constitutive." | Is the counterfactual link metaphysically constitutive of the disposition, or merely a reliable indicator? | **(c) Ensured Manifestation:** Glass would break if struck *only* due to guardian’s vow. | *Not fragile.* Analysis excludes the guardian as an interfering factor "independently connected to the manifestation". Verdict correct. | *Not fragile.* Correct verdict, but because the intrinsic basis is lacking; the counterfactual holding is coincidental, not grounded in a relevant intrinsic property. |
  | **2.2** | "The 'intrinsic grounds' clause in the reformed analysis is a principled metaphysical requirement for genuine dispositions, derived from the nature of properties." | "The 'intrinsic grounds' clause is an *ad hoc* device to save the conditional analysis, masking a deeper metaphysical truth (that dispositions *are* intrinsic properties)." | Does the "intrinsic grounds" clause reflect an independent metaphysical insight, or is it question-begging? | **(b) Intrinsic Mask:** Fragile glass with molecularly bonded shock-dispersing coating. | *Fragile.* The intrinsic brittleness *is* present; the coating is part of the object, so the clause is satisfied. Verdict shows clause is principled (grounds present). | *Not fragile.* The object *lacks* the intrinsic property *disposed to break when struck*; its intrinsic structure (brittleness + coating) prevents manifestation. Clause is arbitrary; object lacks the power. |
  | **2.3** | "Probabilistic disposition ascriptions (e.g., 'has a 50% chance to decay') can be analyzed via probabilistic conditionals (e.g., 'if left alone, probability of decaying=0.5')." | "Probabilistic disposition ascriptions *directly* report an intrinsic probabilistic causal power; they cannot be reduced to conditionals involving objective chances." | Can probabilistic dispositions be fully analyzed as probabilistic conditionals? | **(d) Probabilistic Disposition:** Atom disposed to decay within hour (prob=0.5). | *Disposed to decay (prob=0.5).* This *is* captured by the probabilistic conditional "if left alone, prob(decay)=0.5". Not a distinct embarrassment. | *Disposed to decay (prob=0.5).* Verdict correct, but *only* because it reports an intrinsic probabilistic power. The conditional is a non-constitutive symptom; failure would show analysis is inadequate. |
  | **2.4** | "Degrees of fragility can be meaningfully compared via the reformed conditional analysis (e.g., comparative likelihood/speed of breaking under ideal conditions)." | "Degrees of a disposition are grounded in degrees of the intrinsic property/power; comparative counterfactuals are effects, not the essence." | Can degrees of disposition be analyzed via comparative counterfactuals? | **(a) Stochastic Fink:** Glass wired to lose brittleness (prob=0.5) if struck. | *Not simply fragile.* Reformed analysis fails clearly: Intrinsic basis is *not* stable (fink is connected!), ideal conditions unclear. "Fragile to degree 0.5" is unmotivated by the analysis. | *Fragile, but finks probabilistically.* The intrinsic brittleness *is* present until struck. The fink probabilistically *removes* the basis, preventing manifestation. Degree talk applies to manifestation likelihood, not the disposition itself. |

  **3. Predictions on Supplied Cases**  
  *(Summarized from Table Above)*  
  - **(a) Stochastic Fink:**  
    - *Reformed Analyst:* Analysis breaks down ("Not fragile" or "Not analyzable as fragile"). No clear verdict on degree. Less fragile than ordinary glass? Unclear.  
    - *Critic:* **Fragile.** The intrinsic basis exists until (and unless) the fink activates. "Fragile to degree 0.5" confuses the disposition with its manifestation probability.  
  - **(b) Intrinsic Mask:**  
    - *Reformed Analyst:* **Fragile.** Intrinsic grounds (brittleness) are present; coating is intrinsic part of object, not "interference".  
    - *Critic:* **Not fragile.** The object intrinsically lacks the power to break when struck due to its total structure.  
  - **(c) Ensured Manifestation:**  
    - *Reformed Analyst:* **Not fragile.** Guardian is "independently connected" interference. Analysis delivers correct verdict.  
    - *Critic:* **Not fragile.** Lacks the intrinsic basis for fragility. Correct verdict, but for different reasons (shows conditional link is insufficient).  
  - **(d) Probabilistic Dispositions:**  
    - *Reformed Analyst:* **Disposed (prob=0.5).** Captured by probabilistic conditional. Not a fink/mask.  
    - *Critic:* **Disposed (prob=0.5).** Reports an intrinsic probabilistic power. The conditional is a reliable indicator, but not constitutive. Neither fink nor mask.  

  **4. Substantive vs. Verbal Disagreement**  
  *Agreed:* The disagreement is **primarily substantive**, not merely verbal. Both camps agree on the core data (fragility ascriptions in standard cases, failure of SCA, role of intrinsic properties).  

  *Disagreed:*  
  - **Reformed Analysts:** The semantics of ordinary disposition ascriptions *can* be settled (largely) independently of deep metaphysics via refined conditionals capturing usage. Settling semantics *would* move the metaphysical debate by constraining viable theories.  
  - **Critics:** The semantics of disposition ascriptions is *metaphysically loaded*; their truth conditions fundamentally depend on the existence of intrinsic properties/powers. Settling semantics without metaphysics is impossible. A purely semantic "victory" for conditionals would *not* move them, as it would fail to capture the underlying reality grounding the truth of the ascription. The core dispute is metaphysical: *What kind of property is a disposition?*  

  *Crucial Point:* Critics hold that **no reform of the conditional analysis, however complex, can succeed** because dispositions *are not* conditional states by their nature; they are intrinsic grounds *for* conditional behavior. Reformed Analysts hold that a **suitably sophisticated conditional analysis *can*** capture the truth conditions of disposition ascriptions, with the intrinsic grounds clause being a legitimate semantic component reflecting metaphysical dependence. **This disagreement is fundamental and resistant to resolution via further counterexamples alone.**
