prompt: |-
  Someone in a decision theory reading group told me there's a theorem (I.J. Good, I think?) that a Bayesian should never turn down free information: the expected value of knowing is always at least zero, since in the worst case you ignore it and do what you were going to do anyway. I want to believe it, but my gut verdicts on actual cases refuse to cooperate. Here they are — I'd like the principle behind them, or to be told which verdicts have to go.

  — Facing a choice between two surgical options, I'd pay alot for a second opinion from a specialist. Obviously right.
  — My friend is at risk for an incurable late-onset disease. There's a test, but there's nothing she could do differently with the result — no treatment exists, and she's already made her choices about kids and career. She's declined the test, and I think she's right: not knowing buys her decades without dread hanging over every dropped spoon.
  — Same friend, different disease: this one you can slow down a lot if you catch it early. Here I'd nag her until she takes the test — refusing seems almost irrational.
  — I avoid reviews and trailers for movies I've already decided to see. Spoilers would ruin it. Feels obviously right, even though structurally it's the same as the first disease case: nothing I'd do differently.
  — A friend offers to tell me, before I drink them, which of the two glasses in front of me came from the $90 bottle and which from the $12 one (same wine, or close enough). Right now I'd enjoy both. After being told, the cheap one will taste worse to me. I'd pay him not to tell me — but I also suspect I'm being a baby about it, since the wine doesn't change.
  — A lawyer says she never asks clients whether they actually did it, so she can defend them wholeheartedly in good conscious. I used to think this was a dodge; now I think the not-knowing is doing real moral work for her.

  And the one I keep flipping on: a chess player who won't study his opponent's past games before a match, on the grounds that it clutters his head with patterns. Sometimes this sounds like discipline (playing the board, not the man), sometimes like an aesthetic handicap dressed up as strategy.

  My first stab at a principle was "information is worth having exactly when it could change what you do" — but that gets the two disease cases exactly backwards, and the wine one wrong in the other direction. So don't give me a menu of options: commit to the best principle you can construct, even if it needs two or three clauses, say plainly which of my verdicts it overturns, and use it to predict a new case — specifically, whether I should want to know, in advance, the exact date of my own death, assuming the knowing itself is the only thing that would change.
reasoning: |-
  Okay, the user presents several scenarios where their intuition conflicts with Good's theorem that a Bayesian should never refuse free information. Let me start by recalling the theorem. Good's theorem states that acquiring cost-free information has non-negative expected utility since you can always ignore it. But the user's examples challenge this.

  First, I need to identify patterns in their examples. The surgical second opinion and the treatable disease cases align with the theorem—information leads to better decisions. But the incurable disease, movie spoilers, wine tasting, lawyer, and chess player examples are cases where they prefer ignorance. The death date question is the ultimate test.

  Why does the theorem seem to fail here? The key might be that utility isn't solely about outcomes but includes psychological states. For instance, knowing about an incurable disease causes dread, reducing utility without changing actions. Similarly, spoilers reduce enjoyment. The wine example shows that perception affects utility—knowing the wine is cheap makes it taste worse subjectively. The lawyer avoids moral conflict, preserving her ability to defend effectively. The chess player might fear information overload impairing performance.

  So the principle needs to account for cognitive and emotional costs. Information can alter hedonic states or decision-making processes negatively. Also, in the lawyer's case, ignorance maintains a necessary condition (sincerity) for optimal performance. The chess player might experience reduced performance due to overthinking.

  The user's initial principle about information changing actions misses these psychological aspects. A better principle would include the impact on utility beyond just decisions. It should state that information is valuable only if it improves decisions and doesn't harm experiential utility or cognitive processes. 

  Applying this to their verdicts: the incurable disease, movie spoilers, wine, lawyer, and chess examples are justified because information harms utility without aiding decisions. The death date knowledge likely causes anxiety, reducing lifetime happiness despite no action changes. Thus, refusing aligns with the revised principle. The theorem's limitation is assuming utility is only about outcomes, not the experience of knowing.
answer: |-
  Your intuition is correct: Good's Theorem ("Free information has non-negative expected utility") has crucial caveats that explain your verdicts. The principle fails when information *directly alters your utility function or cognitive state* in harmful ways, independent of any decision change. Here's the refined principle:

  **Principle:**
  Information is instrumentally valuable (expected utility ≥ 0) **if and only if**:
  1.  **It has the potential to improve your decisions** (the standard Bayesian case), **OR**
  2.  **Knowing it directly provides positive hedonic/experiential utility** (e.g., satisfying curiosity, enjoyment).
  **However, information has negative instrumental value if:**
  3.  **Knowing it directly causes unavoidable negative hedonic/experiential utility** (dread, anxiety, spoiled enjoyment, distorted perception), **AND**
  4.  **This negative utility outweighs any potential decision-improvement benefit (if applicable), AND**
  5.  **You cannot credibly commit to ignoring it** (rendering the "ignore it" fallback ineffective).

  **Analysis of Your Verdicts (✓ = Upheld, ✗ = Overturned by Principle):**

  1.  **Second Surgical Opinion (✓):** *Potential to improve decision* (which surgery to choose) is high and primary value. No significant direct negative hedonic impact expected. **Aligns with Good/Principle.**
  2.  **Incurable Disease Test - Declined (✓):** *No decision improvement* possible (nothing changes). Knowing *directly causes unavoidable dread/anxiety* ("decades without dread"). "Ignore it" isn't credible (the knowledge persists). **Negative hedonic impact dominates. Principle justifies refusal.**
  3.  **Treatable Disease Test - Take it! (✓):** *High potential for massive decision improvement* (early intervention → better outcome). The potential negative hedonic impact (anxiety) is outweighed by the massive decision benefit. **Decision-improvement dominates. Aligns with Good/Principle.**
  4.  **Avoid Movie Spoilers (✓):** *No decision improvement* (you see the movie anyway). Knowing *directly causes unavoidable negative utility* (reduced surprise, suspense, enjoyment). "Ignore it" (forget the spoiler) isn't credible. **Negative hedonic impact dominates. Principle justifies refusal.**
  5.  **Wine Knowledge - Pay Not to Know (✓):** *No decision improvement* (you drink both glasses regardless). Knowing *directly alters perception/utility* ("cheap wine tastes worse"). "Ignore it" isn't credible – the knowledge biases perception. **Negative hedonic impact (reduced enjoyment of one glass) dominates. Principle justifies refusal.** (It's not "being a baby," it's acknowledging how cognition shapes experience).
  6.  **Lawyer Avoiding Client's Guilt (✓):** *Potential for minor decision impairment?* Maybe, but likely secondary. Knowing *directly harms her ability to perform optimally* ("defend wholeheartedly"). Ignorance preserves sincere advocacy, a necessary *cognitive/affective state* for her peak performance. Knowing risks moral conflict undermining effectiveness. **Preserving a necessary cognitive state for optimal action justifies refusal.** (This fits under the broader "direct negative utility" umbrella covering performance states).
  7.  **Chess Player Avoiding Opponent's Games (Needs Nuance):** This is the trickiest.
      *   **If true:** Studying *genuinely impairs his cognitive process* ("clutters his head"), leading to *worse decisions* during the actual game, and he *cannot filter effectively*, then refusal is justified. Knowledge *directly harms decision-making capability*. **Principle justifies refusal (Case 3).**
      *   **If false/illusory:** Studying objectively provides information that *could* improve decisions (anticipate patterns), and the "clutter" is an unfounded belief or preference, then refusal is irrational. **Principle overturns refusal.** *Your verdict likely depends on whether you believe the impairment is real or aesthetic.* The principle demands evidence the information *causes* net harm to decisions/performance.

  **Overturning Good's Theorem:** The principle overturns the naive interpretation of Good's Theorem in cases **2, 4, 5, 6**, and potentially **7**, where information causes *direct, unavoidable harm* (hedonic or cognitive) that cannot be ignored, outweighing any decision benefit.

  **Predicting the Death Date Case:**

  *   **Question:** Should you want to know the exact date of your own death, assuming *only* the knowledge itself changes anything?
  *   **Principle Application:**
      *   **Decision Improvement?** Unlikely. Assumption: knowing *only* changes your mental state, not your actions. (If knowing would change savings/spending, bucket lists, etc., it *would* have decision value).
      *   **Positive Hedonic Utility?** Curiosity satisfied? For most, outweighed by negatives.
      *   **Negative Hedonic Utility?** Extremely likely. Pervasive existential dread, potential for constant countdown anxiety, possible paralysis ("why bother?"), distortion of present enjoyment ("only X years left"). This negative utility seems massive and unavoidable.
      *   **Can you Ignore it?** No. The knowledge would be fundamental and persistent.
  *   **Prediction:** The principle predicts you **should NOT want to know**. The unavoidable, massive negative hedonic impact dominates the lack of decision improvement benefit. Knowing your death date is structurally similar to the incurable disease test or the spoiler – knowledge that primarily poisons experience without enabling better choices.

  **In essence:** Information isn't magic. It's only *instrumentally* valuable if it helps you make better choices *or* feels good to know. If it feels bad to know and doesn't help you act better, refusing it is perfectly rational. Good's Theorem assumes information only impacts utility *through* decisions; your cases show it often impacts utility *directly*.
