prompt: |-
  My friend Daniel and I spent most of Friday evening arguing about what he calls "the composition question," and I left more confused than I started. He's been reading a lot of analytic metaphysics lately and now talks about it with total confidence, and I couldn't tell during the argument whether I was losing on the merits or just being steamrolled by his certainty. At some point he gave me this summary of the territory, delivered more or less word for word, and I'd like to know how much of it to trust: "Philosophers call the special composition question the question of when some smaller objects add up to one further object — it's basically the question of what a whole is. Peter van Inwagen put the question on the map with a book in the early nineties, and he himself defended the contact answer: composition happens whenever things are fastened together, which is why he says tables don't exist but we do. The two main live answers are nihilism, which says composition never occurs and only the fundamental particles exist, and universalism, which says any two things, no matter how scattered, compose a further thing — so there's an object scattered across your left shoe and the Moon. Universalism has been pretty much refuted, since the scattered-object consequence is obviously absurd, and nihilism is refuted by the plain fact that you and I exist and aren't particles. That leaves the common-sense answer as the only serious option: composition happens exactly when things form a unified whole, the way the parts of a chair do and the way your shoe and the Moon don't. There's also some fringe view that composition is just a brute fact that can't be explained, but that's obviously cheating — an answer that says 'it just happens' isn't an answer. So the field has basically converged on common sense; the holdouts just don't want to give up their intuitions about weird cases."

  I don't know the literature well enough to audit this myself, but a few things he said felt off. I vaguely recall that van Inwagen's own view has something to do with life rather than contact, and I also suspect the field hasn't converged on the common-sense answer the way he claimed — but I'm not sure, and he was very sure. Please go through his summary claim by claim and tell me which parts a working metaphysician would accept, which are simplifications a specialist would wince at but let pass, and which are just wrong. In particular I'd like to know whether the "absurdity" of scattered objects is actually treated as a refutation of universalism or as a disputed cost; whether nihilists really are committed to denying that people exist, and whether they have anything to say in response; and whether his dismissal of the brute-composition view as "not an answer" is fair to the people who defend it. Also tell me whether his conclusion — that common sense wins by elimination — follows from the parts of his summary that are accurate, or whether it depends on the parts that aren't. Please write in American English, and as you go, keep a clear running distinction between what is settled among people who know this literature and what is genuinely contested, so that I can tell whether Daniel was reporting a consensus or stating one side of an open debate as if it were the end of the matter.
reasoning: |-
  Okay, let me approach this user's query methodically. The user had a heated debate with their friend Daniel about the special composition question in metaphysics and wants a reality check on Daniel's confident summary. They specifically mention feeling confused and steamrolled, so I need to address both the factual inaccuracies and the rhetorical overconfidence.

  First, I'll unpack Daniel's claims point by point. His description of van Inwagen's position is clearly wrong - van Inwagen's "fastened together" criterion was for living organisms, not tables. That's a red flag about Daniel's accuracy. For the main live answers, Daniel presents universalism as "refuted" and nihilism as denying human existence, but both characterizations oversimplify active debates. The "absurdity" of scattered objects is actually a contested cost of universalism, not a knockout argument, and nihilists have sophisticated responses like paraphrase strategies.

  The user's specific questions about scattered objects, nihilist commitments, and brute composition need careful handling. I should emphasize that metaphysicians see costs and benefits rather than refutations here. For nihilism, I'll explain how they handle ordinary objects through conceptual tools rather than outright denial. The brute fact view deserves more nuance than Daniel's "cheating" dismissal - it's a legitimate position that prioritizes certain theoretical virtues.

  Throughout, I'll maintain a clear distinction between consensus views (like van Inwagen's actual position) and contested claims (like the status of universalism). The user's request for American English means avoiding British spellings and keeping sentences direct. Most importantly, I'll show how Daniel's conclusion collapses because it builds on multiple inaccuracies - the elimination argument doesn't hold once we correct his premises.

  The user seems philosophically savvy but overwhelmed by Daniel's confidence. My response should empower them by naming exactly where Daniel overstates (e.g., "refuted" vs "contested cost") while acknowledging where his simplifications have some basis (e.g., universalism's counterintuitive consequences). I'll structure this as a numbered breakdown for clarity, mirroring Daniel's original claims but with corrections embedded.
answer: |-
  Here's a breakdown of Daniel's summary, point by point, separating settled facts from contested claims and outright errors. Metaphysics is rarely as settled as Daniel implies – much of this is actively debated.

  **1.  "Philosophers call the special composition question the question of when some smaller objects add up to one further object — it's basically the question of what a whole is."**
      *   **Accuracy:** **Accurate & Settled.** This is the standard definition Peter van Inwagen introduced and framed the debate around. It's uncontroversial terminology.

  **2.  "Peter van Inwagen put the question on the map with a book in the early nineties..."**
      *   **Accuracy:** **Mostly Accurate & Settled.** Van Inwagen's 1990 book *Material Beings* is widely credited with crystallizing the debate in its modern form and naming the "Special Composition Question" (SCQ). While others discussed composition before, his formulation became canonical.

  **3.  "...and he himself defended the contact answer: composition happens whenever things are fastened together, which is why he says tables don't exist but we do."**
      *   **Accuracy:** **Wrong.** This is a significant error.
          *   **Van Inwagen's Actual View:** He famously argued that composition occurs **only when the activity of the parts constitutes a life** (i.e., for living organisms). He explicitly *denies* that contact, fastening, or cohesion is sufficient. He argues that artifacts like tables, chairs, and mountains *do not exist* as composite objects – only their fundamental particles and living creatures do. So, he *does* say tables don't exist, but he says we *do* exist precisely because we are living organisms, *not* because our parts are "fastened together" in some simple mechanical way. The "contact" or "fastened together" view is often associated with common-sense or moderate views, *not* van Inwagen's restrictive biological account.

  **4.  "The two main live answers are nihilism... and universalism..."**
      *   **Accuracy:** **Simplification.** While nihilism and universalism are indeed two major, highly influential positions, calling them *the* two main live answers *today* is an oversimplification. Van Inwagen's own restrictive view (organicism/vitalism), various versions of moderate views ("common sense"), and brutalism are also significant "live" contenders. Nihilism and universalism represent the extreme poles.

  **5.  "Universalism has been pretty much refuted, since the scattered-object consequence is obviously absurd..."**
      *   **Accuracy:** **Highly Contested & Simplistic.**
          *   **"Refuted"?** Absolutely not settled. Universalism (or "Unrestricted Composition") is a robust, well-defended position held by respected metaphysicians (e.g., David Lewis).
          *   **"Obviously Absurd"?** The existence of scattered objects (like the "shoe-moon object") is seen by universalists as a *counterintuitive consequence*, but *not* an outright refutation. They argue:
              *   Intuitions about "absurdity" are unreliable guides in fundamental metaphysics.
              *   The theoretical benefits of universalism (simplicity, ontological permissiveness, avoiding vague existence) outweigh the cost of counterintuitive objects.
              *   We constantly refer to scattered objects anyway ("the British Empire," "the 1985 Chicago Bears defense," "all the gold in Fort Knox").
          *   **Status:** The scattered objects problem is a major *cost* or *objection* to universalism, not a refutation. Universalists actively argue the cost is acceptable or that the objects aren't truly problematic. Many metaphysicians take this objection very seriously, but universalism remains a powerful and widely discussed position.

  **6.  "...and nihilism is refuted by the plain fact that you and I exist and aren't particles."**
      *   **Accuracy:** **Contested & Oversimplified.**
          *   **Nihilist Commitment:** Strict compositional nihilism *does* deny the existence of any composite objects. So, strictly speaking, if "you" and "I" are composite objects, nihilism denies we exist *as composite entities*.
          *   **"Refuted"?** Nihilists have sophisticated responses:
              *   **Paraphrase:** They argue we can say all we need to say about the world using only plural quantifiers over simples. "There are particles arranged tablewise" or "There are particles arranged personwise" captures the truth without committing to the existence of *tables* or *persons* as composite objects. So, they *don't* deny the *appearance* or the *arrangements*; they deny that these arrangements constitute fundamentally new *objects*. They claim we can explain everything (including our sense of self and talk about persons) without composite objects.
              *   **Conceptual Revision:** Some argue our concept of "existence" or "object" needs revision.
          *   **Status:** The objection from the existence of persons/macroscopic objects is the *primary* challenge to nihilism. Nihilists work hard to answer it via paraphrase strategies. Whether these strategies succeed is hotly debated, but it's not considered a *simple* refutation. The debate hinges on whether paraphrase is genuinely adequate.

  **7.  "That leaves the common-sense answer as the only serious option: composition happens exactly when things form a unified whole..."**
      *   **Accuracy:** **Highly Contested & Premature.** This is Daniel's conclusion, but it depends heavily on his (incorrect or oversimplified) dismissal of the other views.
          *   **"Only Serious Option"?** False. Nihilism, universalism, van Inwagen's vitalism, and brutalism are all still actively defended and discussed as serious options by professional metaphysicians. Conferences and journals regularly feature debates between them.
          *   **"Common-Sense Answer":** This itself is a category, not a single view. Defining "unified whole" or "contact" or "cohesion" precisely is notoriously difficult and leads to the "problem of the many" and vagueness issues. *Which* moderate, common-sense view is best is a huge debate *within* the moderate camp. There is *no* single, universally agreed-upon common-sense criterion.

  **8.  "There's also some fringe view that composition is just a brute fact that can't be explained, but that's obviously cheating — an answer that says 'it just happens' isn't an answer."**
      *   **Accuracy:** **Oversimplified & Uncharitable.**
          *   **"Fringe"?** Brutalism (or "primitivism" about composition) is a legitimate position defended by serious philosophers (e.g., Ned Markosian, Trenton Merricks at one point). It's not the majority view, but it's not dismissed as fringe crackpottery.
          *   **"Obviously cheating... isn't an answer"?** Unfair characterization. Brutalists argue:
              *   Not everything *can* or *needs* to be explained in terms of something more fundamental. Composition might be a fundamental, irreducible feature of reality.
              *   Insisting on a reductive explanation might be misguided or lead to worse problems (like the difficulties faced by nihilism, universalism, or moderate views).
              *   It *is* an answer: it says composition is a basic, unexplainable fact. Whether that's *satisfactory* is debatable, but it's a coherent metaphysical stance. Calling it "cheating" is polemical, not a neutral assessment.

  **9.  "So the field has basically converged on common sense; the holdouts just don't want to give up their intuitions about weird cases."**
      *   **Accuracy:** **Wrong.** This conclusion does *not* follow from the actual state of the debate. The field has *absolutely not* converged on a single common-sense answer. The debate between nihilism, universalism, various moderate views (including van Inwagen's vitalism), and brutalism remains vibrant and unresolved. Each position has significant proponents and faces serious objections. The "holdouts" aren't clinging to weird intuitions; they are defending coherent, well-argued (though controversial) positions against what they see as the flaws in "common-sense" approaches.

  **Summary & Answers to Your Specific Questions:**

  *   **Van Inwagen:** Daniel was **wrong**. Van Inwagen defended the *life* criterion, not contact/fastening.
  *   **Field Convergence:** Daniel is **wrong**. The field has **not** converged on a common-sense answer. Nihilism, universalism, various moderates, and brutalism are all live options with active defenders.
  *   **Scattered Objects & Universalism:** The scattered object consequence is treated as a **significant cost** of universalism, not a definitive refutation. Universalists argue the cost is acceptable or illusory. It's a major point of **contention**, not settled.
  *   **Nihilism & People:** Nihilists **are** strictly committed to denying that composite objects (including people *as composites*) exist. However, they **do have a response**: sophisticated paraphrase strategies claiming we can talk truly about the world ("particles arranged personwise") without ontological commitment to composites. Whether this response works is **hotly debated**; it's their biggest hurdle, not a simple refutation.
  *   **Brute-Composition ("Brutalism"):** Daniel's dismissal as "cheating" and "not an answer" is **uncharitable and unfair**. Brutalism is a defended position arguing composition is fundamental. While controversial and facing objections (e.g., lack of explanatory power), it's not dismissed as unserious by the field. Its proponents offer arguments for why *this* is where explanation must stop.
  *   **Daniel's Conclusion:** His conclusion (common sense wins by elimination) **depends entirely on the parts that are wrong or oversimplified**. It requires:
      1.  Misstating van Inwagen's view.
      2.  Incorrectly claiming universalism is "refuted."
      3.  Incorrectly claiming nihilism is "refuted" without engaging its real responses.
      4.  Dismissing brutalism unfairly.
      5.  Ignoring the deep problems *within* defining "common sense."
      6.  Overlooking the fact that van Inwagen's own view is *not* a simple common-sense view and remains influential.

  **The Reality:** Daniel presented one side of an **ongoing, complex, and fundamentally unresolved debate** in analytic metaphysics as if it were settled consensus. He significantly misrepresented van Inwagen's view, downplayed the robustness of universalism and nihilist responses, unfairly dismissed brutalism, and declared victory for a "common-sense" view that itself lacks a single, agreed-upon definition and faces serious challenges. The SCQ remains wide open. His certainty vastly exceeded the actual state of play in the field.
