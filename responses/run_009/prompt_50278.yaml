prompt: |-
  Two friends of mine have been arguing about the death penalty for literally years and I want to force them to do the adversarial-collaboration exercise they keep promising each other. One is a retributivist retentionist -- he thinks some crimes just deserve death, and that the state expressing society's condemnation at its maximum intensity is part of what justice requires. The other is an abolitionist whose center of gravity is epistemic: any system run by fallible humans will eventually execute innocent people, and no amount of retributive value can outweigh that. She's also honestly kind of skeptical of retribution as a justification at all, though she's never fully cashed that out.

  Write the joint statement the two of them should be able to sign. I want the following pieces:

  1. A numbered section of claims both accept. Please make these non-vacuous -- not "murder is bad" but things like what the deterrence evidence can and cannot currently show (both agree the empirical literature is too noisy to hang your hat on either way, or if they can't even agree on that, say so in the disagreements section instead), and that no appeals process can drive the probability of executing an innocent to literal zero.

  2. A disagreements table. Each row should state one residual disagreement, phrased so that the side holding that view would actually sign off on the wording. If you find any part of their fight is verbal -- I suspect "dignity" is doing double duty, since he says execution affirms the victim's dignity and she says it degrades the state's -- flag which rows are that and why.

  3. The cruxes: the sub-questions such that settling one would move at least one of them. I have a suspicion one crux is what happens in the "slam-dunk" subset of cases -- imagine a defendant on uninterrupted 4K video, with DNA, who confessed with counsel present and re-confesses knowing exactly what awaits him. At that point her fallibility argument has almost no purchase, so does her position collapse into pure anti-retributivism, or does she have residual grounds (irreversibility as a categorical property of the punishment itself, the state's standing to kill)? And correspondingly: if he's right that desert can ground execution in slam-dunk cases, is his view hostage to the claim that desert verdicts can be distributed as reliably as slam-dunk evidence? Whether real capital systems contain any slam-dunk cases is itself a sub-question worth putting in the table.

  4. For each crux, one concrete case, argument, or thought experiment both would agree bears on it -- and here's the part they never actually do: write down each side's prediction in advance, before running the case. E.g. if the crux is whether retributive intuitions survive being made to actually specify execution criteria (aggravators, ages of defendants, the video case above), what does each predict they'd feel after working through it.

  Don't try to adjudicate who's right -- I've had enough of that from them. The deliverable is the document they could both put their name on, with the leftover disagreement made exact enough that a reader could tell what measurement or argument would move one of them.
reasoning: |-
  Okay, the user has a fascinating challenge here. Two friends stuck in a years-long death penalty debate need help structuring their adversarial collaboration. One is a retributivist retentionist who believes certain crimes inherently deserve death as maximal societal condemnation. The other is an abolitionist focused on epistemic limitations - that human systems inevitably execute innocents, making retribution unacceptable. 

  Hmm, the key is creating a document both can sign without compromising core positions. The user wants four specific components: common ground claims (non-vacuous), precise disagreement framing (including verbal disputes), crux identification with testable predictions, and concrete cases for each crux. 

  First, the common ground section needs substance. Both likely agree that deterrence evidence is inconclusive - meta-analyses show mixed results with methodology limitations. They'd also concur that no appeals process achieves absolute certainty against wrongful executions. That's stronger than just "murder is bad." 

  For disagreements, I notice potential verbal traps. When the retentionist says "dignity" they mean victim/justice affirmation; the abolitionist means institutional degradation. This needs flagging. Also, their core conflict: whether retributive justice can ever outweigh irrevocable error risk. 

  The slam-dunk case is crucial. If we imagine a Bundy-level guilty defendant (video, DNA, confession), does the abolitionist's position hold? That exposes whether their objection is purely epistemic or also moral. Conversely, if the retentionist admits desert requires slam-dunk reliability, does that undermine real-world systems where most cases aren't perfect? 

  For testing cruxes, prediction is key. Have them specify: "If we design hypotheticals where guilt certainty approaches 100%, abolitionist will still oppose on principle X." Or: "Retentionist will concede system legitimacy depends on maintaining Y% slam-dunk cases." Make them forecast their own reactions before discussing. 

  The document should force clarity without resolution. Example: both might sign "Disagreement 1: Whether retributive value can justify punishment when P(innocence)>0" while still differing. Then list testable sub-questions like "Does abolitionist's opposition persist at P(innocence)=0.0001%?" with their advance predictions. 

  User's probably tired of circular debates. This structure makes disagreement productive by mapping exactly where positions could shift. Smart framing around the slam-dunk case might reveal if either has unexamined assumptions - like whether the retentionist truly believes real courts achieve near-perfect certainty.
answer: |-
  Here’s a draft joint statement designed to clarify agreements, crystallize disagreements, and identify testable cruxes—structured for adversarial collaboration. Both parties should be able to endorse the **wording** of their own positions in the disagreements table, even if they reject the other’s claims.

  ---

  ### **Joint Statement on Capital Punishment**  
  *Co-signed by [Retentionist] and [Abolitionist]*

  #### **1. Shared Premises**  
  We both accept the following non-vacuous claims:  
  > (1) **Deterrence Evidence Ambiguity**: Empirical studies on the death penalty’s deterrent effect are methodologically contested and inconclusive; neither deterrence nor its absence can be decisively proven with current data.  
  > (2) **Inevitable Fallibility**: No legal system can reduce the risk of executing an innocent person to zero, regardless of appellate safeguards.  
  > (3) **Irreversibility**: Execution is unique among punishments in its permanent physical effect.  
  > (4) **Limited Scope**: Capital punishment, where applied, is reserved for a tiny fraction of homicides involving extreme culpability and harm.  
  > (5) **Moral Significance of Innocent Lives**: The wrongful execution of an innocent person is a catastrophic moral failure that outweighs many other penal considerations.  

  ---

  #### **2. Disagreements Table**  
  Each row states a position *as held by one party*, with wording approved by that party.  

  | # | Retentionist Position (R) | Abolitionist Position (A) | Notes on Disagreement |
  |---|---------------------------|----------------------------|------------------------|
  | 1 | **Retributive Justification**: Some crimes are so heinous that death is the only proportionate moral response, affirming society’s condemnation and the victim’s inherent dignity. | **Epistemic Priority**: No retributive value justifies accepting a non-zero risk of executing innocents, given systemic fallibility. The state’s moral standing degrades by engaging in irreversible punishment. | **Substantive**: Clash between retributive necessity and risk intolerance. |
  | 2 | **Dignity of Justice**: Execution honors victims/society by symbolizing the maximum rejection of the crime’s evil. | **Dignity of the State**: Execution violates the state’s obligation to model restraint, irreversibly tarnishing its moral authority. | **Verbal**: “Dignity” is used asymmetrically (victim/state vs. institutional integrity). |
  | 3 | **Slam-Dunk Cases Legitimize the Practice**: In hypothetically flawless cases (e.g., incontrovertible guilt + full culpability), the death penalty is morally required. | **Slam-Dunk Cases Are Irrelevant**: Hypothetical “perfect” cases cannot exist in reality and distract from systemic risks. Even if possible, the state lacks standing to impose irreversibility. | **Structural**: Dispute over whether ideal cases validate real systems. |

  ---

  #### **3. Cruxes: Key Sub-Questions**  
  **Crux 1: Does the abolitionist’s opposition collapse if innocence-risk approaches zero?**  
  - *Test Case*: "The 4K Video Confession": A defendant commits murder on uninterrupted 4K video with audio, leaves DNA, confesses immediately with counsel, and re-confesses annually—fully aware of the death penalty—while rejecting appeals.  
    - **Retentionist Prediction**: A will oppose execution regardless, revealing her objection is fundamentally anti-retributive.  
    - **Abolitionist Prediction**: Opposition persists due to (a) irreversibility as categorically unjustifiable state power, or (b) "slam-dunk" cases being empirically non-existent.  

  **Crux 2: Can desert-based execution survive imperfect reliability?**  
  - *Test Case*: "The Reliability Threshold": Assume a capital system *could* isolate "slam-dunk" cases (e.g., 99.99% guilt certainty) but only for 5% of death-eligible crimes. The rest have 95% certainty.  
    - **Retentionist Prediction**: Desert demands execution only for the 5% "slam-dunks." A system failing this threshold is illegitimate.  
    - **Abolitionist Prediction**: R’s concession proves the death penalty is practically unsustainable—no real system achieves such reliability.  

  **Crux 3: Is retribution a coherent justification?**  
  - *Thought Experiment*: "Desert Calibration": Both parties specify *exact criteria* for death-worthiness (e.g., victim count, torture, premeditation). Then, evaluate a case meeting all criteria but with a 0.1% innocence risk.  
    - **Retentionist Prediction**: Specifying criteria strengthens retributive intuition; 0.1% risk is acceptable given the crime’s gravity.  
    - **Abolitionist Prediction**: Retributive intuitions weaken when forced to operationalize "desert"; 0.1% risk remains intolerable.  

  ---

  #### **4. Agreed Probes for Residual Disagreements**  
  - **Verbal Disagreement Probe**: Replace "dignity" with precise terms:  
    - R: "Symbolic affirmation of victims’ moral status."  
    - A: "Institutional moral corruption."  
  - **Empirical Disagreement Probe**: Jointly review 10 "highest-certainty" historical executions. Assess:  
    - How many meet R’s "slam-dunk" standard?  
    - What was the *lowest* innocence probability estimable at the time?  

  ---

  ### **How This Advances the Debate**  
  This document:  
  1. **Isolates core conflicts** from verbal noise (e.g., "dignity").  
  2. **Makes predictions testable**: If A opposes the 4K Video case, her stance is principled, not contingent. If R admits 95% certainty is inadequate, his position requires unrealistically perfect systems.  
  3. **Forces engagement with cruxes**: The "slam-dunk" case isn’t a gotcha—it’s a diagnostic tool for whether epistemic or deontological objections drive abolitionism.  

  **Next Step**: Both parties sign this statement, then design experiments (e.g., drafting "desert criteria," auditing real cases) to test their predictions. The goal isn’t agreement—it’s mapping the battlefield exactly.  

  ---  
  *Document ends. Both signatures below.*
