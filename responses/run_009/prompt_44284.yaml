answer: |-
  1.  The core dispute is partly verbal regarding the *definition* of "conscious state": for FOR (First-Order Representationalism), it fundamentally means a state with phenomenal character (what-it's-like-ness), while for HOT (Higher-Order Thought), it fundamentally means a state the subject is aware of (via a higher-order representation).
  2.  However, disagreements over **phenomenal overflow** (e.g., Sperling-like cases) are substantive and not merely verbal, as both sides explicitly address the same empirical question about the richness of *phenomenal* content available prior to report, disagreeing on whether unreportable detail is genuinely conscious (FOR) or merely first-order and unconscious (HOT).
  3.  The disagreement over whether the **higher-order relation itself contributes to phenomenality** is also substantive: HOT proponents argue it is essential for transforming first-order content into phenomenal experience, while FOR proponents deny this, seeing it as merely cognitive access adding reportability but not altering the core phenomenality (if present).
  4.  FOR arguments exert force on HOT primarily by challenging its ability to avoid **trivialization or regress** (e.g., consciousness being absurdly conferred on non-mental items, or requiring an infinite stack of representations) and to explain why the HOT state isn't itself conscious in the phenomenal sense; HOT arguments exert force on FOR primarily by challenging its ability to provide a non-question-begging **"mark of the conscious"** differentiating phenomenally conscious first-order states from unconscious ones without invoking awareness.
  5.  Real progress would likely require either **empirical resolution of overflow** (e.g., conclusive evidence for or against rich unreportable phenomenology) or **conceptual innovation within HOT** that convincingly addresses the trivialization/regress worries while explaining the phenomenal contribution of higher-order states, as a mere stipulative division risks leaving the core metaphysical disagreement intact.
