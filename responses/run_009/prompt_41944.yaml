prompt: |-
  I've been keeping a ledger of my gut verdicts about when consent actually counts, and I'd like someone to find the principle behind them — or tell me honestly that there isn't one. The cases are mostly about deception, with a few about coercion and competence thrown in, because I suspect the three interact.

  First, the verdicts. A partner removes a condom mid-act against an explicit agreement: the consent was invalid, obviously. A woman tells a partner she is on birth control when she is not, intending to conceive: also invalid — and notice that I hold this one with total confidence even though my friends treat it as a joke rather than an analog of the first case. A man impersonates his identical twin in a darkened bedroom: invalid, though the physical act experienced is molecule-for-molecule what was agreed with someone else. A surgeon lets a supervised trainee perform the delicate part of an operation while telling the patient afterward that he did it himself: invalid, I think, even though the surgical plan, the risks run, and the outcome were all as consented to. Now the ones I'm less proud of. Someone sleeps with a person after being told a flat lie that the person is unmarried, when they have a firm policy against sleeping with married people: my gut says invalid, but weakly. Someone sleeps with a person after being told a lie that the person is in love with them: I call this valid — a terrible thing to do, but the consent stands. Someone gets sex by lying about being a retired astronaut: valid, and barely even a hard case.

  Then coercion and competence. A signature extracted at gunpoint: invalid. A signature extracted because it's the only grocery job within two hours' travel and the wage is exploitative: valid, though it sticks in my throat. A mildly sedated but fully oriented patient consents to an additional emergency procedure mid-surgery: valid. That same patient, before sedation, signs a blanket "do whatever the surgeon thinks best" form: valid, I want to say, even though it doesn't look informed in any meaningful sense — it looks like the opposite of informed.

  So the puzzle I can't resolve: the marital-status lie and the love lie are both flat lies about facts that mattered to the decision, and I give them opposite verdicts. The trainee-surgeon case changes nothing about what happens to the patient's body, and I still call it invalid, while the astronaut lie changes the patient's — the partner's — understanding of the person entirely and I shrug. The blanket form is uninformed and valid; the contraception deception is arguably better informed than most sex and invalid. I've toyed with the familiar line that invalidates deception about the nature or character of the act itself but tolerates deception about the incidental features or the deceiver's qualities — but I can't get the trainee case to sit on either side of that line without squirming.

  What I'd like: state one or a few candidate principles precisely enough to test, tell me which of my verdicts each one captures and which it has to overturn (I'd rather lose the love-lie verdict than the gunpoint one, and I'd rather lose the blanket-form verdict than either, if that helps you weight them), and then run the best candidate on cases I haven't listed — consent obtained after a fortune-teller's genuine-feeling prophecy that refusal would curse one's family; a subject consenting to a trial while misunderstanding what randomization means; a tipsy but competent-seeming bet at a card table; a duelist's acceptance delivered under social ruin for refusing. Where a verdict of mine looks like prejudice rather than principle — the contraception case being the obvious suspect — say so plainly. Throughout, tell me how confident you are in each claim you make, and single out the single point in your account you are least sure of, the one that would most change your answer if it went the other way.
reasoning: |-
  Hmm, this user presents a fascinating ethical puzzle about consent across deception, coercion, and competence scenarios. They've meticulously cataloged their intuitive judgments and want help extracting a unifying principle - or confirmation that none exists. The cases reveal deep tensions in how we conceptualize autonomy.

  The contraception deception case stands out immediately. While the user holds it clearly invalid, they note their friends treat it as a joke - suggesting societal blind spots around reproductive coercion. Their discomfort with this double standard is palpable. The twin impersonation and trainee surgeon cases push the boundaries of what constitutes the "act itself," while the love lie versus marital status lie highlights how context changes moral weighting.

  Their framing suggests someone deeply thoughtful about ethics, possibly with legal or philosophical training. The request for precision in principle-testing and willingness to overturn weaker intuitions shows intellectual honesty. I notice special concern for asymmetries in how we judge sexual versus medical consent.

  The core challenge is defining what aspects of a transaction fall under "the nature of the act" versus peripheral details. My proposed principle makes this distinction central. The trainee surgeon case becomes pivotal - if the act is defined as "surgery by qualified professional," the deception invalidates consent; if defined as "removal of appendix," it doesn't. This hinges entirely on how we characterize acts.

  Their marital status case may reveal unexamined prejudice - why should marital status matter more than astronaut lies? Unless it ties to disease risk or emotional harm potential, this intuition might not survive scrutiny. Whereas the blanket consent form case suggests they intuitively respect meta-consent (consenting to trust) as valid.

  For new test cases: the fortune-teller scenario would likely be invalid consent under my principle if the prophecy creates perceived coercion, while tipsy gambling might be valid if competence thresholds are met. Each case will stress-test where we draw the "fundamental nature" boundary - the knottiest part of this framework.
answer: |-
  Based on your ledger and the tensions you've identified, I propose a candidate principle and rigorously test it against your cases. I'll also highlight where your intuitions might reflect biases and suggest refinements.

  **Candidate Principle (Fundamental Nature Principle):**
  *Consent is invalid if, at the time of agreement, the consent-giver is substantially mistaken or coerced regarding a feature that constitutes a fundamental aspect of the nature or essential character of the act or agent, such that granting consent to the actual act/agent would contradict their core intent or autonomy under the circumstances. This includes deception, coercion, or incompetence that distorts this fundamental basis.*

  **Key Distinctions:**
  1.  **Fundamental Nature/Character:** What defines the act's core identity or the agent's essential role? (e.g., the specific sexual act performed, the identity of the sexual partner, the qualified surgeon performing the critical task).
  2.  **Incidental Features/Agent Qualities:** Details that, while important motivations, don't define the act's essential nature or the agent's core identity in the context (e.g., reasons for choosing the act, emotional state, non-essential credentials, some background facts).
  3.  **Core Intent:** The primary, non-derivative purpose or condition underlying the consent.
  4.  **Substantial Mistake/Coercion:** Error or pressure significant enough to vitiate the will regarding the fundamental nature.
  5.  **Incompetence:** Lack of capacity to understand the fundamental nature or consequences of the act.

  **Testing Against Your Cases (✓ Valid Consent / ✗ Invalid Consent):**

  1.  **Condom Removal (Stealthing):** ✗ **Captured.** Mistake about the *fundamental nature of the sexual act* (barrier-protected vs. unprotected). Core intent (protected sex) contradicted.
  2.  **False Birth Control Claim:** ✗ **Captured.** Mistake about the *fundamental nature of the sexual act* (non-procreative vs. potentially procreative). Core intent (avoiding pregnancy) contradicted. *(Your confidence is justified; societal dismissal likely reflects prejudice minimizing reproductive coercion against men).*
  3.  **Impersonating Twin:** ✗ **Captured.** Mistake about the *fundamental identity of the agent*. Core intent (consent to *Person A*) contradicted by act with *Person B*, even if physically identical.
  4.  **Trainee Surgeon (Deception):** ✗ **Captured.** Mistake about the *fundamental nature of the agent performing the critical act* (qualified surgeon vs. trainee under supervision). The "surgical act" is defined not just by outcome/plan, but by *who wields the scalpel* during the delicate part. Core intent (consent to *Surgeon X's* skill/experience for critical task) contradicted.
  5.  **Lie About Marital Status:** ✗ **Captured (though weak for you).** If marital status is a *fundamental condition* for engaging in the act *at all* (a core intent: "only sleep with singles"), then the mistake is about a fundamental aspect *for this consent-giver*. The act consented to ("sex with a single person") is fundamentally different *to them* than the actual act ("sex with a married person").
  6.  **Lie About Being in Love:** ✓ **Captured.** Mistake about an *incidental feature* (emotional state/motivation). The fundamental nature of the act (sexual intercourse with this person) and the identity of the agent remain intact. Core intent ("have sex with Person Y") is fulfilled, even if based on a reprehensible lie about feelings.
  7.  **Lie About Being Astronaut:** ✓ **Captured.** Mistake about an *incidental quality of the agent* (past career). Not fundamental to the nature of the sexual act or the agent's core identity *as a sexual partner*.
  8.  **Signature at Gunpoint:** ✗ **Captured.** Coercion directly overriding autonomy regarding the *fundamental act itself* (signing). No voluntary consent possible.
  9.  **Exploitative Job Contract:** ✓ **Captured.** Coercion is *background/structural* (economic necessity), not directly forcing the *specific act* of signing *this contract*. The fundamental nature of the act (signing an employment contract) is understood, even if choices are severely constrained. *(Agree it "sticks in throat" - reflects systemic injustice, but doesn't invalidate consent under this principle)*.
  10. **Sedated but Oriented Patient (Emergency):** ✓ **Captured.** Competence maintained regarding the *fundamental nature* of the additional emergency procedure. Understanding of core risks/benefits likely sufficient.
  11. **Blanket "Do Whatever" Form:** ✓ **Captured.** The consent *is* to the *fundamental nature* of the act: "delegate life-saving/surgical decisions to this surgeon's judgment during this procedure." It's meta-consent to trust. The lack of *specific* information is part of the consented-to arrangement. Core intent ("let the expert decide what's best if needed") is fulfilled.

  **Resolving Your Puzzle Points:**

  *   **Marital Status vs. Love Lie:** The principle distinguishes them based on whether the mistaken fact constitutes a *fundamental condition for performing the act itself* (marital status, if it's a firm policy/absolute boundary) vs. an *incidental reason/motivation* for choosing the act (being in love). Your weak gut on marital status might stem from societal norms downplaying such boundaries, but the principle supports its invalidity if it's truly fundamental *for the individual*.
  *   **Trainee Surgeon vs. Astronaut Lie:** The principle places the trainee deception squarely as invalid because the *identity/qualification of the person performing the critical action* is fundamental to the nature of the consented-to surgical act. The astronaut lie concerns an incidental, non-essential quality of the agent in the context of the sexual act.
  *   **Blanket Form vs. Contraception Deception:** The blanket form involves valid consent to the *fundamental arrangement* of delegated trust in an expert during surgery. The contraception deception invalidates consent because it fundamentally alters the *nature of the sexual act* (procreative risk) against the core intent.

  **Testing on New Cases:**

  1.  **Fortune-Teller Prophecy (Refusal Curses Family):** **✗ Invalid (High Confidence).** This likely constitutes coercion by creating an *irrational but genuinely felt* overwhelming pressure, distorting autonomy regarding the fundamental act. The fear vitiates voluntary consent.
  2.  **Misunderstanding Randomization in Trial:** **✓ Valid? ✗ Invalid? (Medium Confidence - Depends)** *If* the misunderstanding is about an *incidental feature* (e.g., *how* the placebo group is chosen, but not *that* there is one and the risks), consent might stand. *If* it's a mistake about the *fundamental nature* of participation (e.g., believing they are guaranteed the active drug, not understanding they might get placebo), consent is likely invalid. Core intent ("get this specific treatment") might be contradicted.
  3.  **Tipsy but Competent-Seeming Bet:** **✓ Valid (High Confidence).** Assuming competence is genuinely present (understands the game, stakes, actions), intoxication is an *incidental factor* affecting judgment but not the understanding of the *fundamental nature* of the act (placing a bet).
  4.  **Duelist's Acceptance Under Social Ruin Threat:** **✗ Invalid (High Confidence).** Severe social coercion (threat of ruin) directly pressures the agreement to the *fundamental act* (participating in a duel), overriding true autonomy. Comparable to significant economic duress, but arguably more direct pressure regarding the act.

  **Assessment of Your Intuitions & Potential Bias:**

  *   **Contraception Case:** Your strong verdict is **correct and principled.** Dismissing it as a "joke" is a serious societal bias minimizing male reproductive autonomy and the fundamental nature of procreative risk in sex. Your principle rightly identifies this.
  *   **Marital Status Case:** Your weak gut verdict might stem from internalized societal norms that view such boundaries as less serious or "prudish," but the principle supports its invalidity *if* it's genuinely a fundamental condition *for that individual*. Your intuition might be underestimating the importance of personal boundaries.
  *   **Exploitative Job:** Your discomfort ("sticks in my throat") is morally sound, highlighting the injustice. However, the principle correctly identifies this as valid consent under severe constraint but not direct coercion invalidating the *specific act's* fundamental nature. The solution lies in labor/economic justice, not redefining consent validity here.

  **Confidence & Weakest Point:**

  *   **Overall Confidence in Principle:** High. It resolves your core tensions, aligns with strong ethical intuitions and legal trends (especially regarding sexual autonomy and medical consent), and provides clear distinctions.
  *   **Weakest Point (Highest Uncertainty):** **Precisely defining the "fundamental nature of the act or agent" in complex or novel contexts.** This is inherently contextual and value-laden.
      *   *Why it's weak:* The "trainee surgeon" case hinges entirely on whether the surgeon's *personal performance* of the critical task is fundamental. Some might argue only the *outcome* or *supervised team* is fundamental. Similarly, "marital status" being fundamental relies on the *individual's* core intent, which can be subjective.
      *   *Impact if wrong:* If the "fundamental nature" is defined too narrowly (only the physical actions), the trainee case and marital status case might flip to valid. If defined too broadly (including all motivating factors), the love lie and astronaut cases might flip to invalid. Getting this boundary right is crucial and context-dependent.
      *   *Mitigation:* Focus on the *core intent* and whether the mistake/coercion directly contradicts *what the consent-giver believes they are agreeing to at its most basic level in that situation*. Legal concepts like "fraud in the factum" vs. "fraud in the inducement" are analogous but not identical.

  **Conclusion:**

  The "Fundamental Nature Principle" effectively captures the vast majority of your verdicts (validating the strong ones like stealthing, birth control deception, twin impersonation, gunpoint; and explaining the distinctions between love/marital lies and trainee/astronaut lies). It only suggests strengthening your verdict on the marital status lie based on the individual's core intent.

  This principle provides a robust framework emphasizing autonomy over the *essential character* of the act or agent, while tolerating deception or pressure related to peripheral motivations or qualities. The main challenge lies in rigorously defining the "fundamental nature" in each context, which is the crux of applying this principle to novel or borderline cases. Your ledger demonstrates remarkably consistent intuition aligned with this core idea.
