answer: |-
  You've precisely described the phenomenon known as the **revenge problem** (or sometimes **revenge paradox**) in the philosophy of truth and formal semantics. This is indeed the established term for the cycle you observe.

  **Defining the Revenge Problem:**

  *   **Core Idea:** For any proposed solution (S) to the Liar Paradox (or similar semantic paradoxes), a *new* paradoxical sentence (R) can be formulated. Crucially, R:
      1.  **Exploits S's Resources:** R is constructed *using* the specific concepts, distinctions, or machinery introduced by S itself (e.g., undefinedness, truth-value gaps, levels, types, grounding, non-classical logics).
      2.  **Targets S's Solution:** R is designed to demonstrate that S fails to consistently handle *all* sentences, specifically those that directly refer to the novel features S introduced to block the original paradox.
      3.  **Is Tailor-Made:** R is not a pre-existing, generic paradox. It is generated *in response to* S, leveraging S's unique apparatus to recreate an inconsistency or indeterminacy *within* S's framework.
      4.  **Recreates the Problem:** R forces a dilemma similar to the original Liar: assigning R a truth-value (or status) according to S's rules leads to contradiction or incoherence.

  **What the Name Excludes:**

  1.  **The Original Liar Paradox Itself:** The classic "This sentence is false" is the *initial* problem, not the revenge phenomenon triggered by proposed solutions.
  2.  **Mere Incompleteness of a Solution:** It's not just that S doesn't cover every conceivable case. Revenge problems specifically arise when S's *own* tools are used to construct a sentence S *cannot* consistently handle, often mirroring the original paradox's structure but applied to S's novelties.
  3.  **General Incompleteness Theorems (e.g., Gödel):** While philosophically related, Gödel's theorems concern formal systems expressing arithmetic and their limitations regarding *provability*. Revenge problems specifically target semantic concepts like *truth*, *falsity*, *reference*, and *predication*, particularly their self-application, and arise directly from proposed solutions to semantic paradoxes.
  4.  **Simple Reiteration of the Original:** A revenge problem must involve the *new* concepts or machinery of the solution. Simply repeating the original Liar sentence and noting S fails to handle it isn't a revenge problem *per se* (though it highlights incompleteness).

  **Locating the Edges: Your Specific Questions**

  1.  **Incomplete Solutions vs. Structural Problem?**
      *   It is demonstrably *more* than just observing particular solutions are incomplete. While initial solutions might have been naive and patchable, the *pattern* of revenge problems recurring across vastly different and increasingly sophisticated solutions (truth-value gaps, contextual hierarchies, paraconsistent logics, fixed-point semantics, groundedness, revision theories) strongly suggests a **structural feature of the concept of truth and self-reference**.
      *   The core structural issue seems to be that any sufficiently rich concept of *truth* (or *falsity*, *definiteness*, etc.) that we try to *apply universally*, including to statements *about that very concept and its application*, appears inherently unstable. The revenge problem exploits the attempt to use the solution's tools *to state the limits of those tools*. It points towards the **inherent difficulty of achieving a consistent, comprehensive, and semantically closed theory of truth**.

  2.  **How it Differs from "Some Sentence Always Slips Through":**
      *   The "blunter point" is a *consequence* or *prediction*. The revenge problem *demonstrates it concretely and specifically*.
      *   More importantly, revenge problems show *how* a sentence slips through: **by using the solution's own newly erected fence as a ladder to climb over it.** It doesn't just assert incompleteness; it provides a *recipe* for generating a counterexample *within the solution's own language and conceptual framework*. The specificity and tailor-made nature of R are crucial differences.

  3.  **How it Bears on Deflationism:**
      *   Deflationism (truth as a mere device of endorsement/disendorsement, lacking substantive "weight") **does not escape the revenge cycle.**
      *   **Why?** The revenge problem can be recast using deflationary notions. Consider the strengthened Liar for a deflationist proposal that restricts the truth predicate to "grounded" sentences or avoids semantic closure:
          *   *"This sentence is not correctly endorsable (or: not warrantedly assertible) using the rules proposed by deflationist theory D."*
      *   **The Dilemma:** If you endorse this sentence (assert it as true), you are endorsing the claim that it *isn't* correctly endorsable – contradiction. If you disendorse it (deny it, refuse to assert it), you seem to *agree* that it *isn't* correctly endorsable, which is precisely what the sentence says – suggesting it *should* be endorsable after all, or at least creating puzzlement about its status.
      *   **Outcomes:**
          *   **No Escape:** The revenge problem reappears using "correctly endorsable," "warrantedly assertible," or whatever deflationary surrogate for truth D employs. The structural issue of self-application persists.
          *   **Restriction:** A deflationist might respond by restricting the applicability of their truth/endorsement predicate further (e.g., "only applies to sentences not mentioning endorsement"). But this concedes the point – the theory cannot consistently handle *all* sentences involving its own key notion, which is a form of revenge vulnerability. It meets a successor built from its own notions ("endorsement").
          *   **Quiet Restriction:** Some sophisticated deflationist approaches (e.g., certain interpretations of disquotationalism) might *implicitly* rely on a hierarchy or context-sensitivity regarding the use of "true," effectively incorporating a solution vulnerable to its *own* level-specific revenge problems later on.

  **Boundary Cases Illustrating the Limits of the Concept:**

  1.  **Case Within Scope (Classical Revenge):** Kripke proposes a theory with truth-value gaps (neither true nor false) to handle the Liar. The **Strengthened Liar** arises: "This sentence is *not true* (i.e., either false or undefined)." If it's true, it's not true. If it's false, it *is* not true, so true? If undefined, then it *is* not true, so true? Contradiction/revenge ensues *using Kripke's own gap*.
  2.  **Case Within Scope (Hierarchical Revenge):** Tarski proposes a hierarchy of languages (L0, L1, L2,...) where "true" for Ln is only expressible in Ln+1. The original Liar (trying to say of itself it's false) is banned. But consider a sentence in L2: "The sentence 'This sentence is not true-in-L1' (uttered in L1) is not true-in-L1." This *attempts* to create a Liar-like paradox *across levels* using Tarski's own hierarchical concepts. While Tarski might ban such constructions syntactically, the *desire* to express this shows the hierarchical solution invites revenge problems phrased in terms of *its* key concept (the level structure). Formal systems implementing Tarski's approach often face challenges expressing their own metatheory consistently.
  3.  **Case Outside Scope (Avoidance, Not Solution):** A theory that simply **bans all self-reference** outright (syntactically preventing sentences from referring to themselves). This *avoids* the Liar and doesn't immediately generate a *revenge* problem *in the same way*, because it doesn't introduce new semantic machinery (like gaps or levels) that a new paradox can exploit. However, it's widely seen as an *ad hoc* restriction that avoids the problem rather than solving it, and it might be vulnerable to *other* kinds of paradoxes (like contingent liars or referential loops) or simply fail to account for the meaningfulness of many self-referential statements we make. Crucially, *no new semantic concept was introduced to be exploited*. The "successor" here isn't a tailor-made semantic paradox using the solution's tools; it's the objection that the solution is overly restrictive or misses the point.
  4.  **Case Outside Scope (Trivial Language):** A language so impoverished it lacks the resources for self-reference *and* lacks any predicate resembling truth or falsity. No Liar, no revenge. But this is irrelevant to natural languages or theories aiming to model truth for reasonably expressive languages.

  **In Summary:**

  The **revenge problem** is the name for the cycle you identified: sophisticated solutions to semantic paradoxes generate *new*, *tailor-made* paradoxes constructed using the solution's own novel concepts, demonstrating an inherent instability in universal truth predicates and self-reference. It is not merely about incomplete solutions, but points to a deep structural challenge: consistently applying a concept universally, including to statements about that concept's own application and limits, appears extraordinarily difficult, if not impossible, without significant restrictions. Deflationism, despite its minimalist ambitions, is not immune to this structural challenge. The boundary lies between solutions that introduce exploitable semantic machinery (vulnerable to revenge) and those that avoid self-reference entirely or are expressively too weak to formulate the problem (which avoids revenge but often at significant philosophical cost).
