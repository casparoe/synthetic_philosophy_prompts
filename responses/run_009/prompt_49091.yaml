prompt: |-
  I'm a philosophy PhD who somehow ended up writing a paper on statutory interpretation, and in two weeks I'm presenting it at a law school faculty workshop. The thesis, roughly: the textualism vs. purposivism fight isn't a substantive disagreement about what words mean or what legislatures are like, it's a disagreement about which *default convention* courts should attribute to the enacting legislature when the statute underspecifies. So on my view the question "is textualism correct?" is malformed -- the correct answer depends on which set of background conventions makes the overall practice of legislation work best, the same way choosing whether to drive on the left or the right isn't about which side is metaphysically correct. Textualists are choosing a low-variance convention that lowers interpretive transaction costs, purposivists a convention that buys flexibility, and the fight over "what Congress meant" is a proxy fight over which coordination equilibrium to entrench. My sketch of the argument: (1) statutory meaning in hard cases is underdetermined because legislatures are massively plural agents with no unified intention, (2) so courts must be doing something *constructive*, not merely descriptive, when they pick a reading, (3) the honest way to pick is on institutional-design grounds, (4) this reframes the debate but also ends up slightly favoring textualism, since purposivism's gains are real but get capitalized away by sophisticated legislatures drafting around them, whereas textualism's predictability compounds. My department loved it; I suspect the law school will not.

  The audience: a general faculty workshop at a law school that skews textualist -- two former Easterbrook clerks, a person who did empirical work on how congressional staffers actually draft (so my "legislatures are plural agents" premise will get pushback with receipts), a legal historian who works on the legal process school and will be protective of Hart and Sacks, and one critical legal studies person who will say my whole coordination framing smuggles in a legitimacy the practice doesn't have. The paper's respondent is a serious administrative law person. It's a 30 min Q&A and I've never presented to lawyers before, only philosophers, who fight dirty but about different things.

  Write me a prep sheet. Give me the objections I'll actually get from *this* room, in the order they'll probably come, phrased the way these people would phrase them (philosopher-speak will get me nowhere with them, so translate my thesis into their idiom for the replies). For each: a two-minute answer, whether I should concede anything up front, and where the reply is genuinely soft -- don't give me the reply I wish were true. Include the one question I'm hoping nobody asks, since I suspect it's the staffer-empirics one but maybe you disagree. One thing I really need: keep straight for me what's actually settled in this literature versus what people just say is settled -- e.g., I keep half-remembering claims about purposivism being the mid-century orthodoxy and textualism being a 1980s insurgence, and I want to know if I can lean on that or whether it's contested, and flag anywhere in my argument where I'm treating a contested interpretive-theory claim as background consensus without noticing. Also feel free to tell me if my "purposivism's gains get capitalized away" point in step 4 is weaker than I think it is -- my committee liked it but they're philosophers and don't know the drafting-lobbying loop stuff.
reasoning: |-
  Okay, let me unpack this. A philosophy PhD is diving into legal statutory interpretation and presenting to a law faculty that leans textualist. Their core idea is that textualism vs. purposivism isn't about truth but about choosing default conventions for legislative interpretation, similar to driving side conventions. They need a prep sheet for a law workshop, anticipating specific objections from this crowd. 

  First, I need to map their thesis onto legal frameworks. Philosophers talk about "coordination equilibriums" and "plural agents," but lawyers care about precedent, institutional competence, and practical effects. The key translation: frame conventions as judicial gap-filling rules that shape legislative behavior. 

  The audience breakdown matters. Former Easterbrook clerks will want Scalia/Easterbrook originalist-textualist arguments; the congressional staffer empiricist will challenge "legislatures as plural agents" with real drafting data; the legal historian will defend Hart/Sacks' purposivism; the CLS critic will attack legitimacy; the admin law respondent cares about Chevron implications. 

  For objections: Order matters. Likely sequence: 1) Staffer empiricist first ("we have data showing drafters DO form collective intent!"), 2) Textualists next ("you're soft-pedaling Scalia's rule-of-law arguments"), 3) Historian ("you're oversimplifying legal process!"), 4) CLS critique ("conventions mask power!"), 5) Admin law Q ("what about Chevron?"). The "hope nobody asks" is probably the capitalization point—it's theoretically neat but empirically shaky if lobbying distorts equilibrium. 

  Literature landmines: The "textualism as 1980s insurgency" is oversimplified. Textualism has older roots (e.g., Sutherland), and modern purposivism isn't dead—Eskridge reconciles them. Can't treat this as settled. Also, "legislative intent is dead" isn't universal; some moderates (e.g., Breyer) still appeal to purpose. 

  Soft spots in the argument: The "purposivism gains capitalized away" claim is fragile. In reality, drafting isn't that efficient—lobbying, gridlock, and haste prevent perfect adaptation. Textualism's predictability also isn't absolute; canons conflict, and lower courts struggle with corpus linguistics. Should concede these limitations. 

  For replies: Coach them to sound like a lawyer, not philosopher. Swap "plural agents" for "multi-member body problems," "coordination" for "judicial gap-filling." When conceding, do it strategically—e.g., "Yes, staffers coordinate, but floor amendments/committee reports show fragmentation persists." 

  Biggest risk: The empiricist torpedoing the plural-agent premise. Need to fall back to "even with coordination, indeterminacy remains at margins." Also, admin law Q about Chevron—if courts use textualism, does that shrink agency deference? That’s a hornet’s nest they might not be ready for. 

  Final prep: Drill the two-minute replies. No philosophy jargon. Anchor everything in cases (e.g., Holy Trinity for purposivism, Scalia dissents for textualism). And rehearse the capitalization concession—"You're right, it’s not perfect, but the incentive effect is still real." 

  This is going to be a gladiator match, but if they keep it concrete and lawyerly, they might survive.
answer: |-
  Here’s your prep sheet tailored to **lawyerly objections**, prioritized by likely attack order, with concessions, soft spots, and literature traps flagged. I’ve translated your thesis into legal idiom and structured replies for a 30-minute Q&A bloodsport.

  ---

  ### **Core Thesis Translation for Lawyers**  
  *Use this framing in your intro:*  
  > "Courts in hard cases aren't *discovering* meaning—they're *choosing a gap-filling convention*. Textualism and purposivism are competing default rules for statutory construction, like default contract terms. The choice isn't 'What did Congress mean?' but 'Which convention best stabilizes the legislative ecosystem?' Textualism is the strict-construction default; purposivism is the equitable-adjustment default. The fight is over institutional design, not hermeneutics."

  ---

  ### **Objection 1: The Congressional Staffer (Empiricist)**  
  *Likely Phrasing:*  
  **"Your 'plural agent' premise is lazy. My interviews show committee staff *do* draft with shared intent. They use purpose sections, preambles, and colloquies to signal meaning. Courts *can* discern objective intent—you’re ignoring how legislative sausage gets made."**  

  **Your 2-Minute Reply:**  
  > "I agree drafters coordinate—but that coordination *fractures* post-committee. Floor amendments, omnibus bills, and compromise language inject indeterminacy (e.g., *King v. Burwell*'s 'established by the State'). Staffers aim for coherence, but Congress as a whole votes on text, not intent. Your data shows intent exists *upstream*; my point is it dissipates *downstream* when 535 members enact text. We still need defaults for when drafters' aims clash with enacted words."  
  > **Concede:** "Yes, purposivism works best when staffers leave clear purpose clues—but that’s the easy case. My focus is when text and clues *conflict*."  
  > **Soft Spot:** If they cite specific studies showing drafters *anticipate* courts using purpose, reply: "That proves my point! Drafters *internalize judicial conventions*. If courts switch conventions, drafters adapt."  

  ---

  ### **Objection 2: The Textualist (Easterbrook Clerk)**  
  *Likely Phrasing:*  
  **"You’re laundering policy choices as 'conventions.' Textualism isn’t a 'default'—it’s the *rule of law*. If courts drift from text, they usurp legislative power. Your 'coordination' talk ignores Article I, § 1."**  

  **Your 2-Minute Reply:**  
  > "Respectfully, textualism *is* a convention. Scalia himself admitted in *A Matter of Interpretation* that 100% textualism is impossible—canons like *noscitur a sociis* are judicial gap-fillers. My point: when text runs out (e.g., 'and' vs. 'or' in a complex scheme), you *must* choose a gap-filler. Textualism picks the most rule-bound one to constrain judges and force Congress to speak clearly. That’s a *defensible choice*, but it’s a choice—not Founders’ design."  
  > **Concede:** "I agree textualism best constrains judicial overreach. But let’s not pretend it’s the only linguistically coherent method."  
  > **Soft Spot:** If they cite *Bostock*'s textualist win: "Exactly! *Bostock* shows textualism working as a *predictable convention*—but Gorsuch had to *choose* to ignore purpose clues to reach that result."  

  ---

  ### **Objection 3: The Legal Historian (Hart & Sacks Defender)**  
  *Likely Phrasing:*  
  **"You caricature purposivism. Hart and Sacks didn’t chase 'intent'—they asked 'what problem did this statute solve?' And your 'capitalization' point is naive. Agencies *need* flexibility to adapt statutes to new problems—that’s why Legal Process dominated for 40 years."**  

  **Your 2-Minute Reply:**  
  > "I admire Legal Process! But Hart and Sacks’ 'reasoned elaboration' *assumes* a coherent purpose exists. My point: when statutes solve *multiple* problems (e.g., the Sherman Act’s vague 'restraint of trade'), courts *construct* purpose. Purposivism’s flexibility is its virtue—but it comes at a cost. Sophisticated players *do* draft around textualist courts (e.g., using exhaustive definitions). They lobby Congress to fix purposivist 'errors,' but gridlock often prevents it. Textualism’s rigidity forces Congress to own its messes."  
  > **Concede:** "Purposivism *is* superior for evolving statutes like the Clean Air Act. But for static schemes (e.g., tax), textualism reduces litigation costs."  
  > **Literature Trap:** *Don’t* call textualism a "1980s insurgency." It revived older traditions (e.g., Sutherland 1943). Purposivism *was* mid-century orthodoxy, but post-*Holy Trinity* excesses fueled backlash.  

  ---

  ### **Objection 4: The CLS Critic**  
  *Likely Phrasing:*  
  **"Your 'conventions' aren’t neutral. They entrench elite power. Textualism protects corporate defendants; purposivism lets judges impose bourgeois values. The whole practice is illegitimate—stop optimizing a broken system."**  

  **Your 2-Minute Reply:**  
  > "I share your skepticism! But rejecting *all* conventions invites chaos. My framework *exposes* the politics: textualism favors status-quo players; purposivism empowers courts/agencies. We should choose consciously: if textualism’s predictability helps marginalized groups plan (e.g., immigrants relying on statutory deadlines), that’s a *pragmatic* argument for it—not legitimacy. But I welcome your critique: any convention can be gamed."  
  > **Concede:** "You’re right—no convention is apolitical. But nihilism isn’t an option for lower-court judges."  

  ---

  ### **Objection 5: The Admin Law Respondent**  
  *Likely Phrasing:*  
  **"How does your framework interact with *Chevron*? If textualism is the default, does *Chevron* Step One swallow it? And if courts 'construct' meaning, why defer to agencies?"**  

  **Your 2-Minute Reply:**  
  > "Great point. *Chevron* Step One asks if text is 'ambiguous'—but *ambiguity* depends on your convention! Textualism finds fewer ambiguities (narrowing *Chevron*), purposivism finds more (expanding deference). My view: conventions should be chosen *holistically*. If we want agencies to fill gaps, we might pick purposivism to widen *Chevron*’s on-ramp. But if we distrust agencies, textualism constrains them. It’s a package deal."  
  > **Concede:** "This is where my 'capitalization' point weakens—agencies adapt slower than Congress. Purposivism might *not* get fully 'drafted around.'"  

  ---

  ### **The Question You Hope Nobody Asks (But Probably Will)**  
  **The Staffer’s Follow-Up:**  
  *"You say purposivism’s gains get ‘capitalized away’ by Congress. But my data shows Congress is *too dysfunctional* to ‘fix’ judicial interpretations. Gridlock means purposivist rulings stick—so flexibility *doesn’t* get arbitraged away. Doesn’t that gut your pro-textualism tilt?"*  

  **Why It’s Killer:**  
  This attacks your institutional-design payoff claim. Philosophers loved the elegant "capitalization" theory; lawyers know Congress is broken.  

  **2-Minute Reply:**  
  > "Fair—I overstated. Gridlock *does* prevent efficient correction (e.g., the IRS rule changes post-*Chevron*). But *sophisticated drafters still anticipate purposivism*: they lobby for vaguer text knowing courts will soften edges. Textualism forces specificity *upfront*—which reduces later litigation even if Congress can’t fix errors. Yes, purposivism’s flexibility isn’t fully eroded, but its uncertainty imposes deadweight costs textualism avoids."  
  > **Concede Hard Here:** "You’re right that my ‘capitalization’ metaphor oversimplifies. The real tradeoff is predictability vs. adaptability *in a broken system*. I should’ve emphasized that."  

  ---

  ### **Key Literature Warnings**  
  - **Contested:** "Legislative intent is dead." Staffer-empiricists will fight this. *Do not* assume consensus.  
  - **Shaky Ground:** Your "purposivism gains capitalized away" point. It’s theoretically tidy but empirically thin—lobbying distorts the "equilibrium."  
  - **Safe to Use:** Textualism’s rise post-1986 (Scalia’s influence); purposivism’s Legal Process roots (Hart & Sacks 1958).  
  - **Nuclear Option:** If pressed on legitimacy, quote Holmes: "We ask not what Congress meant, but what this statute means."  

  ---

  ### **Delivery Tips for Lawyers**  
  1. **Start with cases, not theory:** Use *Church of the Holy Trinity* (purposivism’s peak) and *Bostock* (textualism’s triumph).  
  2. **Sound like a lawyer:** Swap "plural agents" → "multi-member body problem"; "coordination equilibrium" → "judicial gap-filling rules."  
  3. **Flatter their expertise:** "As Justice Kagan said, we’re all textualists now—but we disagree on *when text runs out*."  
  4. **Admin law is landmine:** Dodge unless asked. If pressed: "This framework helps explain *why* we fight about *Chevron*."  

  **Final Prep:** Rehearse the 2-minute replies *aloud*. Lawyers value concision over cleverness. Your thesis is provocative—expect heat, but you’ve got the receipts. Good luck! 🔥
