prompt: |-
  You're a philosopher of history who moonlights thinking about how science actually evolves, and you've read enough economic history to be comfortable with path dependence talk (Paul David's QWERTY story, Brian Arthur on increasing returns, that literature). I want you to make an actual argument for a specific position, not just survey views. Here's the position:

  Once you separate science from technology and institutions, path dependence in science is much weaker than people assume. In tech and institutional life, an early contingent choice (QWERTY layouts, different railway gauges, internal combustion beating steam cars, a country picking a legal system) can lock in permanently because nothing outside the system forces a correction — users adapt to whatever won, network effects compound, and the "better" alternative just never gets its shot. But science, on this view, faces an external referee: the world itself. Notations, paradigm choices, and research programs can drift on for a while, but eventually empirical failure accumulates and somebody gets pulled back toward whatever actually fits the phenomena, roughly regardless of where the contingent starting point was. So if you replayed history with different early scientific choices — a different notation for calculus, a Chinese or Islamic scientific tradition becoming dominant, phlogiston surviving another century — you'd converge on roughly our current physics anyway, maybe with different names and a different order of discovery. History is "locked in" for keyboards and much less locked in for, say, the periodic table.

  Your job: argue FOR this position as persuasively as you can. Along the way I'd like you to (a) articulate the principle behind it clearly — something like a "referee asymmetry" between domains where there's an external standard forcing convergence and domains where there isn't, (b) stress-test it against the obvious hard cases: Ptolemaic astronomy lasting ~1400 years, the long resistance to plate tectonics, the fact that some fields (string theory? psychoanalysis in its day?) seem to be able to drift indefinitely without a referee that can actually settle anything, and (c) say where you think the boundary runs — which parts of "science" have a genuine referee and which parts behave more like technology and are vulnerable to genuine lock-in.

  One important thing: please be honest about the epistemic status of what you're saying. Separate what's actually reasonably settled among people who work on path dependence and the philosophy of science (e.g. that lock-in happens in tech, that paradigms shape research in science) from what is genuinely contested (whether scientific realism of the convergent kind is true, whether the underdetermination of theory by evidence lets whole traditions drift indefinitely), and clearly mark the "referee asymmetry" framing for what it is — a speculative extension that you're building out here, not something with an established literature behind it. Don't smuggle contested stuff in dressed up as consensus.

  Please think carefully and maybe brainstorm a couple of angles before commiting to your structure — I'd rather get one well-organized argument than a laundry list. Also feel free to be a bit self-critical at the end about the weakest joint in the argument you just gave.
