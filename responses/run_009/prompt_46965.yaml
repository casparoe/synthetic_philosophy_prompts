  Below is a decision tree designed for your Metaphysics Night, structured as a flowchart with concrete cases. It uses British English and requires no technical jargon, guiding readers through intuitive scenarios to reveal their stance on the special composition question. The tree has eight questions (each with 2–3 answers), covering the logical space of positions before assigning labels. Positions captured include **universalism**, **organicism**, **nihilism**, **deflationism**, **brutalism**, and moderate restricted views. Combinations with no plausible occupants are noted, and limitations are flagged.  

  ### **Decision Tree: When Do Many Things Make One Thing?**  
  *Start here for any scenario. Answer based on your intuition about whether the parts compose a "real thing" beyond themselves.*  

  1. **A living cat**  
     Its cells, organs, etc. – do they compose a single whole thing (the cat) that is *real*, not just a way of talking about the parts?  
     - **Yes** → Go to 2.  
     - **No** → Go to 6.  

  2. **A heap of pebbles**  
     The pebbles – do they compose a single whole thing (the heap) that is *real*?  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. **All the doorknobs in a building**  
     The doorknobs – do they compose a single whole thing (the doorknob collection) that is *real*?  
     - **Yes** → **Universalism**  
       *You hold that composition always happens: any collection of things composes a further object, however arranged.*  
     - **No** → **Moderate Restricted View (cohesion-inspired)**  
       *You hold that composition requires cohesion or contact (e.g., heaps or cats), but not arbitrary collections.*  

  4. **A swarm of locusts flying together as a unit**  
