prompt: |-
  I'm organizing a workshop session on what the machine-learning community calls preference inference — the project of recovering human preferences from behavior, as in inverse reinforcement learning and its descendants — and I'd like the session to open with an adversarial-collaboration document rather than yet another pair of talks in which the two sides talk past each other. The two camps have been at this for years. The first camp, whom I'll call the revealed-preference optimists, holds that a sufficiently rich record of a person's behavior, processed by sufficiently good models, will converge on that person's preferences: preferences exist as facts about the person, behavior is evidence of them, and the inference problem is hard but in principle ordinary — analogous to estimating a physical parameter from noisy observations, with no special philosophical mystery once the statistics are done well. The second camp, whom I'll call the preference constructionists, replies that decades of behavioral-decision research showed that preferences are substantially constructed in the context of elicitation: the same person can be led to give different answers depending on whether they are asked to choose between options or to price them; the task of separating "true" preference from bias, habit, habituation, and social pressure is itself a normative judgment that no amount of behavioral data can supply; and so the inference practitioner is not discovering a fact about the person but quietly legislating one.

  Please draft the joint statement these two camps should be able to sign. Part I should list the claims both sides can accept — I would expect them to agree, for instance, that behavior is systematically informative about people's dispositions, that every inference method embeds auxiliary assumptions of some kind, that there are cases (compulsions, addictions, self-destructive episodes) where both camps would decline to take behavior at face value, and that at least some of their disputes are empirically tractable. Part II should state the exact disagreements, and each one should be written twice: once in wording the optimist camp would accept as a fair statement of its own view, and once in wording the constructionist camp would accept as a fair statement of its view — no slanted phrasings that one side would refuse to sign. Part III should set out the cruxes — I suspect one of them is whether there is a fact of the matter about "the preference being inferred" that is independent of the elicitation and modeling setup, and another concerns where the burden falls when a person's behavior and that same person's later reflective endorsement come apart — and for each crux, describe a concrete case both sides would agree bears on it (the classic setups in which choice tasks and pricing tasks yield incompatible orderings of the same options, or the person who consistently chooses in ways that their future selves repudiate), and record in advance what each side predicts about that case and why.

  To close the document, indicate which of the residual disagreements strike you as substantive rather than verbal, and explain the basis for that classification; and if you believe there is any point on which both camps are jointly committed to something neither has noticed — some assumption they share while debating only its downstream consequences — please flag it explicitly, since that is precisely the sort of thing a good adversarial collaboration is supposed to surface. Keep the tone of a signed research document: measured, precise, and free of rhetorical point-scoring, since the point is to make the residual disagreement as exact as the agreement.
reasoning: |-
  We are drafting a joint statement for two camps: revealed-preference optimists and preference constructionists. The statement has three parts: agreements, disagreements (stated twice, once from each camp's perspective), and cruxes with test cases and predictions.

  Part I: Agreements
  Both camps can agree on the following:

  1. Behavior provides systematic evidence about a person's dispositions, including their preferences in many contexts.
  2. Every method for inferring preferences from behavior relies on auxiliary assumptions (e.g., about the structure of preferences, the decision-making process, or the environment).
  3. There are cases (such as compulsive behaviors, addictions, or self-destructive episodes) where behavior does not straightforwardly reflect the individual's underlying preferences, and both camps would decline to take behavior at face value in such instances.
  4. At least some of the disputes between the camps are empirically tractable and can be informed by experimental and observational data.

  Part II: Disagreements
  For each point of disagreement, we state it twice: first in a way the optimist camp would accept as fair, then in a way the constructionist camp would accept as fair.

  Disagreement 1: The nature of preferences
  - Optimist version: Preferences exist as stable, internal mental states of the individual that can be inferred from behavior, though the inference may require accounting for noise, constraints, and biases. With sufficiently rich data and appropriate models, the inferred preferences converge to the true preferences.
  - Constructionist version: Preferences are not pre-existing mental states that are merely revealed by behavior but are constructed in the elicitation context. Therefore, the idea of converging to a "true" preference independent of context is misguided; different elicitation methods can lead to different, equally valid preference constructions.

  Disagreement 2: The role of auxiliary assumptions
  - Optimist version: While auxiliary assumptions are necessary for inference, they can be made explicit and tested, and with improved models and data, the influence of arbitrary assumptions can be minimized, leading to more accurate recovery of the underlying preferences.
  - Constructionist version: Auxiliary assumptions are not merely technical tools but reflect normative judgments about what counts as a "true" preference. These judgments are not resolved by more data or better models because they involve inherently contestable choices about how to separate preference from other factors.

  Disagreement 3: The possibility of convergence
  - Optimist version: As the amount and quality of behavioral data increase and models become more sophisticated, inferences about preferences will converge across different elicitation contexts, indicating that we are approaching the true underlying preferences.
  - Constructionist version: Because preferences are constructed in context, even with large amounts of data and sophisticated models, inferences will not converge across different elicitation contexts because there is no context-independent truth to converge to.

  Part III: Cruxes and Test Cases

  Crux 1: Is there a fact of the matter about the preference being inferred that is independent of the elicitation and modeling setup?

  Test Case: The classic preference reversal phenomenon, where the same individual, when asked to choose between two options (e.g., a low-probability high-payoff bet and a high-probability low-payoff bet), chooses one option (say, the high-probability one) but assigns a higher monetary value to the other (the low-probability one). This is a robust finding in behavioral decision research.

  - Optimist prediction: With a sufficiently rich model that accounts for the cognitive processes and context (e.g., the difference between choice and pricing tasks), one can recover a consistent underlying preference structure. For instance, by modeling the task-dependent noise or the different attributes that become salient in different tasks, the apparent inconsistency can be resolved, and the underlying preference (which might be a multi-attribute utility) can be uncovered. The model would then predict behavior in both tasks from the same preference parameters.

  - Constructionist prediction: The preference reversal phenomenon shows that preferences are constructed in the task context. Even with more data and better models, the divergence between choice and pricing will persist because the tasks evoke different constructions. There is no underlying consistent preference to recover; the person's dispositions are context-dependent and cannot be reduced to a single utility function without imposing an arbitrary normative choice.

  Crux 2: When a person's behavior and their later reflective endorsement come apart, where does the burden fall?

  Test Case: Consider a person who, during a period of addiction, consistently chooses to use a drug despite negative consequences. Later, after recovery, they repudiate those choices and assert that the drug use did not reflect their true preferences.

  - Optimist prediction: The burden falls on the model to account for the changed state (e.g., by including the state of addiction as a context that distorts the expression of true preferences). With a model that accounts for state-dependent distortions, one can recover the true underlying preferences (which are stable) from the entire behavioral record, including the post-recovery reflective endorsement. The model might use the endorsement as data to help identify the true preferences.

  - Constructionist prediction: The burden falls on the inference method to avoid the reification of a "true" preference. The person's behavior during addiction and their reflective endorsement after recovery are both valid expressions of preference in their respective contexts. There is no fact of the matter about which one is the "true" preference; instead, the inference practitioner must make a normative judgment about which context (the addicted state or the reflective state) to privilege. No amount of data can resolve this without a normative input.

  Closing: Residual Disagreements and Shared Assumptions

  Residual Disagreements:

  1. The ontological status of preferences: This is substantive. The optimists hold that preferences are real, stable mental states, while the constructionists hold that they are context-dependent constructions. This is a foundational disagreement that affects the interpretation of any inference.

  2. The possibility of convergence: This is substantive and empirically testable. The optimists predict convergence with better data and models; the constructionists predict persistent divergence.

  3. The role of normative judgment: This is substantive. The constructionists argue that even with perfect data, normative judgments are required to separate preference from other factors, while the optimists believe that such factors can be modeled as noise or constraints and thus minimized.

  Shared Assumption:

  Both camps appear to share the assumption that behavior is driven by a combination of internal dispositions and external context. However, they draw different conclusions: optimists see the internal disposition (preference) as primary and separable, while constructionists see the interaction as inseparable. This shared starting point might be worth exploring.

  Finally, note that the disagreements are substantive and not merely verbal because they lead to different research programs and interpretations of empirical results. The shared assumption, once surfaced, may open avenues for collaboration on how internal dispositions and context interact to produce behavior.
answer: |-
  ## Joint Statement on Preference Inference  
  *Signed by Representatives of the Revealed-Preference Optimist and Preference Constructionist Camps*  

  ### Part I: Points of Agreement  
  We, the undersigned, affirm the following shared premises:  
  1. **Behavior as Evidence**: Observable behavior provides systematic, non-random information about an individual’s dispositions, goals, and values.  
  2. **Auxiliary Assumptions**: All preference-inference methods (e.g., inverse reinforcement learning, structural econometric models) embed auxiliary assumptions about cognition, constraints, or environmental context. These assumptions influence inferences and must be made explicit.  
  3. **Limits of Behavioral Interpretation**: Neither camp endorses taking all behavior at face value. Compulsions, acute addiction, coercion, or severe cognitive impairment may generate actions that misrepresent an individual’s evaluative commitments.  
  4. **Empirical Tractability**: Disagreements can be partially resolved through experimental and observational studies. For instance, testing predictive accuracy across contexts or modeling robustness to auxiliary assumptions is scientifically viable.  
  5. **Practical Utility**: Both camps recognize the societal value of preference inference (e.g., in AI alignment, policy design, or consumer welfare) when deployed transparently.  

  ### Part II: Disagreements Stated Neutrally  
  *Each disagreement is stated twice: first in phrasing acceptable to Revealed-Preference Optimists, then in phrasing acceptable to Preference Constructionists.*  

  1. **The Ontological Status of Preferences**  
     - *Optimist-Accepted Wording*: Preferences are latent, stable mental states that causally govern behavior. Under ideal data and modeling conditions (e.g., unlimited observations, context-aware models), inferred preferences converge to these true states.  
     - *Constructionist-Accepted Wording*: Preferences are not pre-existing mental states to be "discovered" but are dynamically constructed during elicitation. Inferences cannot converge to a unique "true" preference because no context-independent ground truth exists.  

  2. **The Role of Auxiliary Assumptions**  
     - *Optimist-Accepted Wording*: Auxiliary assumptions (e.g., rationality axioms, noise distributions) are technical tools to handle noise/constraints. With better data and models, their arbitrariness diminishes, revealing preferences more accurately.  
     - *Constructionist-Accepted Wording*: Auxiliary assumptions are inescapably normative. They legislate what counts as "preference" versus "bias," imposing values (e.g., temporal consistency) that no dataset can objectively justify.  

  3. **Convergence Under Ideal Conditions**  
     - *Optimist-Accepted Wording*: With exhaustive behavioral data and a model class rich enough to capture decision processes, preference estimates will stabilize across elicitation methods, indicating recovery of underlying preferences.  
     - *Constructionist-Accepted Wording*: Divergent inferences across elicitation methods (e.g., choice vs. pricing) persist even with ideal data/models because preferences are method-dependent constructions. Convergence reflects modeler-imposed conventions, not latent facts.  

  ### Part III: Cruxes and Test Cases  
  For each unresolved crux, we specify a concrete test case, both camps’ predictions, and their reasoning.  

  **Crux 1: Is there a context-independent fact about preferences?**  
  *Test Case*: **Preference Reversals in Gambles** (e.g., Lichtenstein & Slovic, 1971). Individuals choose Gamble A (high probability, low payoff) over Gamble B (low probability, high payoff) but assign a higher monetary value to Gamble B when pricing it.  
  - *Optimist Prediction*: A unified model (e.g., prospect theory with task-dependent attribute weighting) will reconcile reversals by attributing them to context-specific noise or cognitive constraints. With enough data (e.g., repeated trials across tasks), inferred risk/utility parameters will stabilize, predicting both choice and pricing from a single preference structure.  
    *Reasoning*: Reversals stem from elicitation noise, not preference multiplicity. Better models separate "core" preferences from task artifacts.  
  - *Constructionist Prediction*: No model will eliminate reversals because pricing and choice evoke distinct constructions of value (e.g., "attentional drift" in pricing). Even with infinite data, inferred utilities will remain task-contingent, confirming that no context-independent preference exists.  
    *Reasoning*: Tasks create different evaluative perspectives; asking which is "true" requires a normative choice, not a statistical fix.  

  **Crux 2: How to resolve conflicts between behavior and reflective endorsement?**  
  *Test Case*: **Post-Addiction Repudiation**. A person in active addiction consistently chooses drug use despite self-harm. After recovery, they reflectively repudiate those choices as "not who I am."  
  - *Optimist Prediction*: Models incorporating state-dependent distortions (e.g., hyperbolic discounting in craving states) can infer stable preferences ("sober self") from aggregated data (e.g., pre-addiction behavior + post-recovery endorsements). Repudiation validates the inference that addiction distorts, not constructs, preference.  
    *Reasoning*: Reflective endorsement anchors "true" preferences; behavioral noise can be filtered by auxiliary models of state effects.  
  - *Constructionist Prediction*: Both behaviors (using drugs, repudiating use) express valid context-dependent preferences. No model can objectively prioritize one as "truer" without importing normative assumptions (e.g., "reflection is authentic"). Data alone cannot arbitrate between conflicting self-concepts.  
    *Reasoning*: Temporal identity is fluid; privileging one self over another is ethical, not empirical.  

  ### Closing: Residual Disagreements and Shared Commitments  
  **Substantive vs. Verbal Disagreements**:  
  - **Substantive**: Disagreements about the *ontology of preferences* (stable mental states vs. contextual constructions) and the *possibility of convergence* (technical challenge vs. conceptual impossibility) are substantive. They entail distinct research paradigms (e.g., model refinement vs. context-sensitive pluralism) and practical implications (e.g., whether AI systems should seek "true" preferences).  
  - **Verbal**: Disagreements over terms like "true preference" or "noise" are partially verbal. Both camps agree behavior is "systematically informative" (Part I), but differ on whether this information points to a latent state or a context-bound disposition. Clarifying terminology may reduce confusion but not resolve core disputes.  

  **Shared, Often Unnoticed, Commitment**:  
  Both camps presuppose that **preference-relevant behavior expresses *intentional agency*** (e.g., goal-directed actions, not reflexes). This commits them to treating agents as having, or constructing, *reasons* for actions. Yet neither reduces preferences to brute behavioral patterns, and both exclude non-agential acts (e.g., seizures) from preference inference. This shared foundation—that preferences involve *reasons*—remains unexamined but could reframe debates (e.g., "Are reasons constructed or discovered?").  

  ---  
  This document, by crystallizing agreements and disagreements, aims to steer the workshop toward empirically adjudicable questions and collaborative modeling. Future work should prioritize testing the cruxes above, notably via longitudinal studies of preference stability and adversarial benchmarks for inference algorithms.  

  *Signatures*:  
  [Revealed-Preference Optimist Representative]  
  [Preference Constructionist Representative]  
  [Date]  

  ---  
  **Note from Drafter**: The tone avoids rhetoric by using neutral descriptors (e.g., "state-dependent distortions" not "irrationality"; "contextual constructions" not "arbitrary judgments"). Residual disagreements are substantive where they imply distinct research programs (e.g., whether to seek unified models). The shared commitment to *intentional agency* as foundational may open new dialogue on how "reasons" feature in preference inference.
