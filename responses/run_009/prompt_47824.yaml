prompt: |-
  I'm in a philosophy of perception seminar that's about to hit the disjunctivism unit, and my notes right now are just a pile of positions (sense-datum theory, intentionalism, naive realism, disjunctivism) with no real sense of what any of them is supposed to accomplish. Before I line them up against each other, I want the requirements list: what any adequate theory of perceptual experience has to get right in the neighborhood of the argument from illusion and hallucination. A few things I suspect belong on the list, but tell me if I'm wrong: it has to say something about the case where a hallucinator and a veridical perceiver are, from the inside, exactly alike -- including whether that likeness forces the two experiences to be of the same kind, or whether sameness-of-kind is a further claim the argument would need to establish and so far hasn't; it can't secure our knowledge of the external world only in the good case while leaving the ordinary perceiver with nothing stronger than a report of how things appeared to them; and it can't just deny by fiat that perfect hallucination is possible, but it also shouldn't get bullied into treating the old "looks" cases (coins appearing elliptical, sticks in water, light from stars that burned out ages ago) as though they do the same work as a genuine hallucination.

  My friend who did her MA on this keeps saying the whole debate turns on whether veridical perception and hallucination share a "common factor," and honestly half the time I can't tell whether thats supposed to be a requirement or the very thing being fought over. So build the list, with the case or consideration behind each entry, and be explicit about which entries are genuine requirements and which are camp shibboleths -- e.g., is "perception is fundamentally a relation to the world" a deliverable, or just the disjunctivist's opening bid? Also tell me whether some subset of the requirements is jointly unsatisfiable -- if it is, thats the part I most want to see, because an unsatisfiable list seems like a result about the debate itself, not just a scorecard for the theories. Don't bother ranking the actual theories against the list, we're doing that in class; I just want the spec. a table is fine if it helps.
