prompt: |-
  My sister's wedding got derailed into a two-hour arguement and I need someone to sort it out. Background: my uncle Marco spent his career as a surgeon in a small southern Italian town, and it was completely normal there for families to bring him something after a successful operation — a panettone at Christmas, once a case of good wine, sometimes an envelope for his kids. He just retired, and at the wedding my friend Dev, who works in compliance, called that whole culture of gift-giving "soft corruption." My cousin Elena, who still lives in that town, went off on him. The exchange, roughly as I remember it:

  (1) Dev said corruption doesn't need an explicit quid pro quo to count. The family knows a gift follows good treatment, and Marco knew gifts followed good outcomes, so over a career the practice functions like a delayed, unspoken fee. He said the standard shouldn't be "was a deal struck" but "does the practice systematically bend how officials do their job" — and by that standard Marco's town fails.

  (2) Elena said that makes gratitude itself illegal — by Dev's logic a thank-you card is corrupt — and that his definition is just Anglo office culture dressed up as universal ethics. In her town the personal relationship IS the institution: people don't relate to some abstract health system, they relate to Dr. Marco, whom they've known for thirty years. Transparency rules that treat all gifts as suspect assume a stranger-state that simply doesn't exist there, and calling that corrupt is just sneering.

  (3) Dev said fine, but then her defense covers the local politician who paves the streets of people who vote for him, because "that's just how politics works here" too — clientelism is exactly what she's defending. And if she won't call any of that corrupt, she's left with no word for the thing anti-corruption efforts were invented to name: officials treating public power as personal property. He said "it's their culture" can't be the whole answer, because the culture is partly the problem.

  (4) Elena said the distinction Dev is fumbling for is direction and discretion, not culture. Gifts flowing upward from the powerless to someone with discretion over them are different in kind from hospitality among equals. And whatever the expectations were, Marco operated the same whether you brought wine or not — the surgery was the surgery. Expectation without leverage isn't corruption, it's just manners.

  Neither would budge, and honestly the rest of the table was split too. Can you adjudicate each of the four moves — say who's right about which specific point, not just overall — and tell me what both of them are missing? I have a feeling there's something neither of them said. After your explanation, give me a JSON object with these fields: "verdict_summary" (one sentence on who comes out ahead and why), "moves" (an array, one object per move, each with "speaker", "claim_in_one_line", "rating" on a scale from clearly_wrong to partly_right to clearly_right, and "why"), "sharpest_distinction" (the single best criterion you'd offer them for telling a corrupt gift from a fine one), and "what_both_missed" (a string).
reasoning: |-
  Hmm, the user is describing a heated wedding argument between their friend Dev and cousin Elena about gift-giving practices in southern Italy. Dev called it "soft corruption," while Elena defended it as cultural tradition. The user wants me to adjudicate each of their four debate moves and identify what both missed.

  First, I need to understand the core conflict. Dev comes from a compliance/ethics background where rules must be universal to prevent systemic bias. He sees Marco's gifts as creating subtle pressure over time. Elena argues from a relational perspective - in tight-knit communities, personal bonds ARE the system, and gifts are about gratitude, not influence.

  Breaking down their four moves:
  (1) Dev makes a structural argument about systemic effects. He's partly right that patterns matter more than explicit deals, but wrong to equate all gift cultures with corruption without examining mechanisms. 

  (2) Elena correctly identifies the flaw in his overbroad definition (thank-you cards as corrupt) and highlights cultural context, but underplays how expectations could influence behavior subconsciously.

  (3) Dev's clientelism analogy is sharp - it shows slippery slope risks. But he conflates medical gifts (voluntary, post-service) with political favors (preemptive, power-based).

  (4) Elena's distinction between upward/downward flows is excellent. Her point about Marco's consistent performance regardless of gifts is crucial evidence against corruption claims.

  What both miss:
  - The evolution factor: Marco's generation operated in informal systems now being standardized. Their debate is really about modernization clashing with tradition.
  - Nuanced harm assessment: No one asked if patients felt pressured or if care actually varied. Real-world impact matters more than theoretical classifications.

  For the verdict: Elena wins narrowly because she offers a functional distinction (direction/discretion) while Dev's definition remains overinclusive. But neither acknowledges that context determines ethical meaning - the same act can be corrupt in Milan but courteous in a village.

  Sharpest distinction I'd propose: "Does the gift create private loyalty that overrides public duty?" That captures both the power imbalance concern and allows for cultural expressions of gratitude when no conflict exists.
answer: |-
  Here's a breakdown of the debate, an adjudication of each move, what both missed, and the requested JSON summary:

  **Adjudication of Moves:**
  1.  **Dev's Claim (Systemic Effect):** Gift-giving creates an unspoken, delayed fee system that systematically biases official behavior.
      *   **Rating:** *Partly Right.*
      *   **Why:** Dev correctly identifies that systemic effects matter more than explicit quid pro quos in corruption analysis. Patterns of gift-giving *can* create subtle pressures and expectations over time, even without conscious intent. However, he overgeneralizes by assuming this *must* be the effect in all contexts, ignoring Elena's point about Marco's consistency and the specific community dynamic. Not all gift cultures inherently "bend" behavior.

  2.  **Elena's Claim (Culturally Embedded Gratitude):** Dev's logic criminalizes gratitude itself and imposes an Anglo-centric, impersonal framework on a community where relationships *are* the institution.
      *   **Rating:** *Partly Right.*
      *   **Why:** Elena is right that Dev's initial framing *is* overly broad and risks labeling basic gratitude (like thank-you cards) as corrupt. She accurately highlights the cultural specificity – in tight-knit communities, personalized relationships *are* the functional system, and gifts symbolize that, not necessarily a bribe. Her critique of applying "stranger-state" transparency rules uncritically is valid. However, she dismisses Dev's systemic concern too easily; cultural embeddedness doesn't *automatically* negate potential for subtle influence.

  3.  **Dev's Claim (Clientelism Slippery Slope & Core Definition):** Elena's defense equally justifies political clientelism ("paving roads for voters"), leaving no word for the core problem of officials treating public power as personal property. "Culture" can't excuse this.
      *   **Rating:** *Clearly Right (on principle), Partly Right (on application).*
      *   **Why:** Dev is **clearly right** that a defense solely based on "this is how it's done here" *can* be used to shield harmful clientelism and nepotism. He's **clearly right** that we need a term/concept for the misuse of public power for private gain, distinct from cultural norms. He's **partly right** that culture itself can be part of the problem. *However*, he overreaches by **directly equating** medical gift-giving *in this specific context* (post-service, community doctor) with blatant political favoritism. The power dynamics and potential harm are different in degree and kind.

  4.  **Elena's Claim (Direction, Discretion & Lack of Leverage):** The key distinction is the *direction* of the gift (powerless to powerful) and the giver's *discretion*. Marco operated identically regardless of gifts; expectation without leverage is manners, not corruption.
      *   **Rating:** *Clearly Right (on Distinction/Evidence), Partly Right (on Leverage).*
      *   **Why:** Elena makes the **sharpest and most valid point** in the debate. Distinguishing *upward* gifts (from dependent client to powerful official) from *lateral* gifts (among equals) or *downward* gifts (from patron to client) is crucial. Her evidence that Marco performed the same regardless of gifts ("the surgery was the surgery") is strong counter-evidence to Dev's systemic bias claim; it suggests no actual leverage or altered behavior, weakening the corruption argument significantly. She's **partly right** on expectation vs. leverage; while leverage strengthens corruption, subtle expectations *can* still create bias even without overt pressure, though her evidence here weakens that concern.

  **What Both Missed:**
  *   **The Nuance of Harm & Benefit:** Both focused on definitions and systems, but didn't deeply analyze the *actual consequences* in Marco's case. Did the gifts create tangible harm? (e.g., Did Marco prioritize patients who gave gifts? Did poorer patients feel pressured or excluded? Did it create a two-tier system?). Conversely, did the practice foster tangible *benefits*? (e.g., Stronger doctor-patient trust, a sense of communal reciprocity, patient satisfaction?). Judging the ethics requires looking at outcomes, not just intentions or structures.
  *   **Evolution & Context:** They treated the practice as static. How might this gift-giving culture evolve or be perceived differently as the community modernizes, younger doctors trained in different ethics take over, or formal systems replace personal ones? The ethics aren't fixed solely by tradition.
  *   **The Doctor's Agency & Setting:** Marco worked in a *public* system. While the community might see him personally, he was a public servant. The core tension Dev identifies (public power vs. private relationship) is real, even if Elena's description of the local reality is accurate. They didn't reconcile this inherent conflict well.
  *   **"Soft Corruption" vs. "Corruption":** Dev conflated "soft corruption" (systematic practices creating subtle bias/obligation) with outright bribery/corruption. The former is more debatable in this context than the latter. Elena reacted to the stronger term.

  **Sharpest Distinction (to tell a corrupt gift from a fine one):**
  **Does the gift create or reinforce a *private obligation* that could reasonably be expected to influence the *impartial exercise of public duty* or professional judgment, particularly where a power imbalance exists?**

  **Verdict Summary:** Elena emerges slightly ahead because her distinction between gift *direction* and her concrete evidence of Marco's consistent performance regardless of gifts (*lack of leverage*) effectively counters Dev's systemic bias claim in this *specific context*, though Dev was correct on the dangers of using "culture" to excuse all clientelism and the need for a concept of misused public power.

