prompt: |-
  Before I commit to the big feature my editor keeps asking for, I want to make sure I actually know what I'm demanding from the scientists. Background: I cover AI and neuroscience for a general-audience outlet, and half my inbox these days is press releases about some system being "conscious" or "self-aware," usually with global workspace theory invoked somewhere in the pitch because that's the theory the AI people like to name-drop. So here's what I want from you: the desiderata list. What does an adequate theory of consciousness -- of the global workspace variety specifically, since that's the one I'll be writing about -- actually have to deliver to count as doing the job?

  Spell out the requirements. What empirical results it has to accomodate (the stuff any theory in this neighborhood gets measured against, like Sperling-style partial report and related working memory findings), what it owes the distinction between information being globally available for report and there being something it's like to have the experience, how it should handle the cases where access and experience seem to come apart (blindsight, the no-report paradigms, the overflow people's favorite cases), and crucially what separates GWT-as-a-claim-about-brain-architecture from GWT-as-a-claim-about-consciousness -- because my editor keeps asking whether a big enough LLM with a workspace-like bottleneck would ipso facto be conscious, and I keep changing the subject.

  For each requirement: what's motivating it, and is it a genuine constraint or just the taste of one camp (the recurrent processing people, the IIT people, the illusionists who think the phenomenal datum is basically a cognitive illusion). Mark which ones are non-negotiable and which are camp preferences wearing non-negotiable clothing. And flag any pair of desiderata you suspect can't be jointly satisfied -- if the only testable criteria are access-based and the thing my readers actually care about is the phenomenal side, that's a result, not a footnote, and I want to know it before I write the piece.

  Last line, machine readable: \answer{...} naming the one requirement from your list you'd defend as absolutely non-negotiable, the last one standing even if everything else gets traded away.
reasoning: |-
  Okay, let me unpack this query. The journalist wants a rigorous framework to evaluate global workspace theory (GWT) claims, specifically for an article debunking AI consciousness hype. They're drowning in press releases misusing GWT terminology and need to separate scientific substance from marketing spin. 

  Hmm... the core tension here is between GWT as an information-processing architecture (which AI systems might implement) versus GWT as a theory of phenomenal consciousness (which is what readers care about). The editor's persistent "would big LLMs be conscious?" question hits this nerve directly. 

  First, I should map the non-negotiables any consciousness theory must address: 
  - The empirical bedrock (Sperling partial report, binocular rivalry etc.) that even critics accept as valid data points
  - The access-phenomenology gap (why global availability feels like something)
  - Boundary cases like blindsight where access/experience dissociate

  Then the GWT-specific commitments: 
  - Its core claim that consciousness equals global broadcast to specialized modules
  - How it handles "overflow" cases where experience seems richer than reportable content
  - Whether workspace architecture necessarily implies phenomenology

  *scribbles mental notes* Must flag the fault lines: 
  - Can GWT explain qualitative experience beyond cognitive access? Or is it just describing mechanisms for reportability? 
  - The unresolved debate with IIT/recurrent processing theories about whether feedback loops or information geometry are more fundamental
  - Illusionists would say GWT solves the "easy problem" but dodges the hard one

  For the machine-readable answer... *pauses* The absolute non-negotiable has to be "Accommodates Phenomenal-Behavioral Dissociations." Because if a theory can't explain why blindsight patients can guess stimuli they don't consciously see, it fails at the central mystery of consciousness. Everything else might be negotiable, but this is the bedrock anomaly. 

  *checks watch* Better structure the output: 
  1. Universal requirements (all theories) 
  2. GWT-specific obligations 
  3. Controversial/negotiable items 
  4. Inherent tensions (e.g., testability vs phenomenology) 
  With clear markers for what's consensus vs disputed. 

  Final sanity check: The journalist needs ammunition against AI hype, so emphasize that GWT-as-architecture ≠ GWT-as-consciousness-explanation. The workspace bottleneck in LLMs enables integrative processing, but says nothing about subjective experience. That distinction is the kill shot for their article.
answer: |-
  Here's a rigorous desiderata list for evaluating Global Workspace Theory (GWT) as a theory of consciousness, addressing your core concerns. Requirements are categorized, motivated, and assessed for negotiability (empirical bedrock vs. camp preference). Key tensions are flagged.

  ---

  ### **I. Universal Requirements (Any Theory of Consciousness Must Address These)**
  1. **Accommodates Dissociation Cases**  
     - **What:** Must explain why conscious experience and behavioral access *sometimes dissociate* (e.g., blindsight patients can guess visual stimuli without awareness; no-report paradigms show neural signatures of consciousness without behavior).  
     - **Motivation:** Demonstrates consciousness ≠ access/report.  
     - **Negotiability:** **Non-negotiable**. Failure here falsifies the theory.  
     - **GWT Challenge:** Classic GWT ties consciousness tightly to global access. Must refine or reinterpret "access" (e.g., as *potential* for report).  

  2. **Explains Partial Report Superiority (Sperling Task)**  
     - **What:** Accounts for why subjects recall more sensory items when cued *after* stimulus offset than in full report.  
     - **Motivation:** Shows conscious experience can be rich but fleetingly accessible.  
     - **Negotiability:** **Non-negotiable**. Core psychophysics.  
     - **GWT Fit:** GWT handles this well: iconic memory buffers sensory info, but only cued items enter the workspace for report.  

  3. **Distinguishes Conscious/Unconscious Processing**  
     - **What:** Explains differences in neural/behavioral outcomes for stimuli that are consciously perceived vs. not (e.g., binocular rivalry, masked priming).  
     - **Motivation:** Baseline for isolating consciousness.  
     - **Negotiability:** **Non-negotiable**.  

  ---

  ### **II. GWT-Specific Requirements (What GWT Owes Its Own Claims)**
  4. **Architecture → Phenomenology Bridge**  
     - **What:** Explains why global broadcasting *generates* subjective experience (beyond enabling report).  
     - **Motivation:** GWT claims global availability *is* consciousness. Must justify why this architecture isn’t just "access without phenomenality."  
     - **Negotiability:** **Non-negotiable for GWT as consciousness theory**.  
     - **Tension:** The "hard problem" gap. GWT often invokes *ignorance*: once info is globally available, "what it’s like" arises. Critics (IIT, phenomenologists) call this hand-waving.  

  5. **Handles "Overflow" Cases**  
     - **What:** Accounts for subjective reports that experience exceeds what can be reported (e.g., seeing a whole scene despite only attending/accessing parts).  
     - **Motivation:** Challenges GWT’s claim that consciousness = content in workspace.  
     - **Negotiability:** **Contested**. Pro-GWT: Overflow is illusory. Anti-GWT: Phenomenal evidence trumps.  
     - **GWT Response:** Denies overflow exists (e.g., subjects confuse vivid memory with perception).  

  6. **Defines "Global" vs. "Local" Access**  
     - **What:** Specifies which systems must access workspace content for it to count as "conscious" (e.g., motor report? planning? emotion?).  
     - **Motivation:** Prevents trivialization (e.g., an LLM outputting text isn’t "globally available" in the brain-like sense).  
     - **Negotiability:** **Non-negotiable for falsifiability**.  

  ---

  ### **III. Boundary Demarcations (GWT vs. Alternatives)**
  7. **Architecture ≠ Phenomenology**  
     - **What:** Clearly separates:  
       - **GWT-Architecture:** A system with a bottleneck + broadcasting mechanism (implementable by AI).  
       - **GWT-Consciousness:** The claim *that this architecture suffices for phenomenality*.  
     - **Motivation:** Your editor’s LLM question. GWT proponents (e.g., Dehaene) often equivocate here.  
     - **Key Point:** GWT-Architecture is necessary/sufficient for *cognitive access*, not proven sufficient for *phenomenality*.  
     - **Negotiability:** **Crucial for accurate science communication**.  

  8. **Neural Plausibility**  
     - **What:** Aligns with known brain anatomy (e.g., prefrontal cortex as workspace, thalamocortical loops).  
     - **Motivation:** GWT sells itself as neuroscientifically grounded.  
     - **Negotiability:** **Core to GWT’s identity** (unlike IIT’s abstract math).  

  ---

  ### **IV. Controversial/Negotiable Requirements (Camp Preferences)**
  9. **Predicts NCCs (Neural Correlates of Consciousness)**  
     - **What:** Identifies specific neural signatures (e.g., late P3b EEG wave, sustained frontoparietal activity).  
     - **Motivation:** Testability.  
     - **Negotiability:** **Non-negotiable empirically, but...**  
     - **Tension:** IIT predicts *different* NCCs (e.g., posterior hot zone). GWT’s broad workspace NCCs are contested.  

  10. **Excludes Rival Theories**  
      - **What:** Explains why GWT is better than alternatives (e.g., IIT’s phi metric, RP’s recurrent loops).  
      - **Motivation:** Theory competition.  
      - **Negotiability:** **Camp preference**. Illusionists reject all NCC-hunting.  

  ---

  ### **Key Tensions & Trade-offs**
  - **Tension 1: Testability vs. Phenomenology**  
    GWT prioritizes *access-based criteria* (report, integration) because they’re measurable. But this sidelines the "what it’s like" aspect readers care about. **Result:** GWT may explain *cognitive access* but not *phenomenal consciousness* – a major critique.  

  - **Tension 2: Overflow Denial**  
    GWT dismisses overflow to preserve its "consciousness = workspace content" axiom. But if subjective reports of rich experience are valid, GWT undergenerates.  

  - **Tension 3: AI Consciousness**  
    If GWT-Architecture suffices for consciousness, large LLMs *could* be conscious. But this conflicts with:  
    - Biological grounding (requirement #8).  
    - Absence of phenomenal evidence (requirement #4).  
    **Your Answer:** *"GWT describes a mechanism for access, not a solution to the hard problem. Without bridging principles, claiming AI consciousness is speculative."*  

  ---

  ### **Final Requirement (Machine-Readable)**  
  \answer{Accommodates Dissociation Cases}  

  **Why this is non-negotiable:** Even if all other requirements are relaxed or reinterpreted, a theory of consciousness *must* explain why brain damage (blindsight), experimental paradigms (no-report), or pharmacology can sever access from experience. Failure here means the theory cannot account for the fundamental structure of consciousness. GWT survives only by redefining "access" as *potential* (e.g., blindsight lacks potential for visual report), but this is its core defense.
