answer: |-
  ### Essay Question  
  **Construct and defend a moral principle that determines whether, and under what conditions, a vast number of individually trivial harms can morally outweigh a single instance of severe harm. Test your principle against the following cases:**  
  1. **The Ladder**: A sequence of choices where harm severity decreases while victims increase:  
     - (A) Torture 1 person for 50 years vs. 2 people for 49 years each.  
     - (B) Torture 1 person for 50 years vs. 1,000 people for 1 year each.  
     - (C) ... down to: Torture 1 person for 50 years vs. 3.3 × 10¹² people for 1 second each.  
     - (D) Finally: Torture 1 person for 50 years vs. 10²⁰ people for 1 millisecond (imperceptible harm).  
     *At which step(s) does aggregation fail? Why exactly there?*  

  2. **The Penny Case**: Suppose 10²⁰ people each suffer a barely perceptible harm (e.g., a speck of dust). However, each would *rationally consent* to this harm in exchange for 1 cent. Does this consent dissolve the moral problem? Can waived harms still aggregate to outweigh torturing one person for 50 years?  

  3. **A Novel Case**: Invent your *own* case that challenges your principle’s limits (e.g., dispersed harms vs. concentrated ones, probabilistic harms, or non-human sufferers). Explain how your principle resolves it.  

  **Requirements**:  
  - Do **not** recite standard arguments (e.g., "intuitions fail," "deontology forbids all aggregation," or "utilitarianism demands it").  
  - Build a *specific, testable principle* (e.g., a harm threshold, claim structure, or aggregation rule).  
  - State the strongest objection to your view from *ordinary moral practice* (e.g., "We don’t trade torture for specks" OR "We accept aggregation in vaccines").  

  ---

  ### Model Answer (710 words)  
  **Principle**: Aggregation is permissible only when harms meet a **minimum suffering-significance threshold** (SST). A harm qualifies if it:  
  (i) Is *non-transient* (lasts long enough to disrupt normal functioning),  
  (ii) Is *cognized* (recognized as harmful by the sufferer), and  
  (iii) Creates a *claim* that cannot be waived without significant cost/benefit imbalance.  

  **Defense**: This principle avoids absolutism while respecting the moral asymmetry between grave and trivial harms. The SST filters out harms too fleeting or waived to ground claims strong enough for aggregation.  

  **Testing the Ladder**:  
  - **Steps A–C (1 year → 1 second)**: Harms meet SST. A year of torture disrupts life plans; even one second of torture is cognized and non-transient (pain lingers, causing distress). Aggregation is justified: saving 1,000 people from a year each outweighs one person’s 50-year torture.  
  - **Step D (1 millisecond)**: Fails SST. The harm is transient (no lingering effect) and uncognized (imperceptible). No claim is generated; aggregation fails. Thus, 10²⁰ dust specks cannot outweigh 50 years of torture.  
  *Where it fails*: Between 1 second and 1 millisecond. The cutoff is pragmatic: harms shorter than cognitive processing time (~0.1 seconds) cannot be integrated into conscious experience.  

  **The Penny Case**: Consent dissolves individual claims but doesn’t license aggregation.  
  - Each waived harm fails condition (iii): accepting 1 cent for a dust speck is rational, so no claim exists.  
  - *However*, the sheer scale creates a *emergent collective wrong*: even if no individual is wronged, the *system* of imposing mass waived harms for trivial gains exploits vulnerability. Thus, it still aggregates *against* being chosen over torture.  
  - **Objection**: If no one is wronged, how can there be a moral reason to avoid the specks?  
  - **Reply**: While no claims are violated, the choice *instrumentalizes* billions for negligible benefit—a deontic wrong distinct from individual harm.  

  **Novel Case – Pollution Thresholds**:  
  Suppose a factory’s emissions give 10⁹ people a 0.01% lifetime cancer risk increase (individually imperceptible) but save one worker from certain death by chemical exposure. Does saving the worker justify the emissions?  
  - **SST Application**: The risk increase is uncognized (imperceptible) and transient (no immediate effect). It fails (i) and (ii).  
  - **Resolution**: The harms cannot aggregate to outweigh the worker’s death. Alternatives (e.g., safer equipment) must be sought.  
  - **Challenge**: What if the risk is 0.1% (cognizable via statistics)? Then SST is met, and aggregation may be permitted—but this exposes a weakness: SST relies on subjective cognition, risking elitism (e.g., ignoring harms to the statistically illiterate).  

  **Strongest Objection**: Ordinary morality rejects aggregating waived/imperceptible harms against torture (e.g., we wouldn’t torture someone to prevent a billion dust specks). The SST seems ad hoc to avoid counterintuitive results.  
  **Rebuttal**: Unlike rigid deontology, SST explains *why* imperceptible harms don’t aggregate: they generate no moral claims. Ordinary morality *does* aggregate cognized risks (e.g., approving vaccines that cause rare deaths), aligning with SST.  

  **Conclusion**: The SST principle offers a psychologically grounded, non-arbitrary limit to aggregation. It fails neatly at uncognized/transient harms while justifying aggregation in high-stakes public goods—reconciling intuition and consequentialist reasoning.  

  ---

  ### Marking Scheme  
  **First-Class (70–100%)**:  
  - Constructs a **clear, original principle** (e.g., threshold, claim-based, or scalar model).  
  - **Tests it rigorously against all three cases**, identifying precise failure points (e.g., "SST fails at sub-second harms due to cognitive limits").  
  - **Engages the strongest objection** from ordinary morality and offers a substantive rebuttal.  
  - Novel case is **probing** (exposes a tension in the principle) and **resolved coherently**.  
  - Avoids all cop-outs (see below).  

  **Upper Second (60–69%)**:  
  - Principle is **defined but underdeveloped** (e.g., vague threshold).  
  - Engages all cases but with **less precision** (e.g., identifies failure in Ladder but not exact step).  
  - Addresses the objection but with **shallow rebuttal**.  
  - Novel case is **relevant but unsurprising** (e.g., duplicate of Ladder).  

  **Lower Second (50–59%)**:  
  - Principle is **implied but not stated explicitly**.  
  - **Superficial treatment** of cases (e.g., asserts conclusions without applying principle).  
  - **Ignores the objection** or novel case.  
  - Avoids cop-outs but lacks critical depth.  

  **Automatic Deductions (subtract 15% per cop-out)**:  
  1. **"The numbers make utilitarianism obvious"** (No principle construction).  
  2. **"No aggregation is ever justified"** (Absolutism without argument for constraint type).  
  3. **"Intuitions are unreliable here"** (Dismisses cases rather than engaging them).  

  ---  
  This question forces students to *build* rather than borrow, using cases as stress tests. The model answer exemplifies this by deriving a falsifiable principle and exposing its vulnerabilities—precisely the skills advanced ethical theory demands.
