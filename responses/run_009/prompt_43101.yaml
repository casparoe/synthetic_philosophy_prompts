answer: |-
  ### Core Requirements: An adequate theory must **correctly classify hard cases**, rigorously **distinguish types of wrongness** (participant harm vs. good corruption), and **explain third-party repugnance without direct harm/corruption**.

  #### Non-Negotiable Desiderata:
  1.  **Case Adequacy:** Must deliver intuitively plausible *and justified* verdicts on specified hard cases (Iranian kidneys, vote selling, hurricane price surges, cross-wealth surrogacy, paying kids to read, dwarf-tossing ban), moving beyond mere identification to principled resolution. *Failure here invalidates the theory.*
  2.  **Wrongness Distinction:** Must rigorously separate and account for:
      *   **A. Participant-Harm Wrongness:** Wrongness arising from the transaction's *effects* on participants (e.g., exploitation (surrogacy/kidneys), desperation (hurricane sales), coercion, fraud, asymmetric information).
      *   **B. Good-Corruption Wrongness:** Wrongness arising from what selling *does to the meaning or social value* of the good/act itself (e.g., votes, human dignity (dwarf-tossing), body parts, citizenship duties, intrinsic goods like learning). *Collapsing these invalidates the theory.*
  3.  **Background Injustice Separation:** Must clearly distinguish condemning *the sale itself* under fair conditions from condemning the *background injustice* (e.g., poverty) that makes someone *willing* to sell (e.g., kidneys, surrogacy). Must explain why banning the sale might (or might not) be the right response to background injustice. *Failure to make this distinction renders the theory politically naive or over/under-inclusive.*

  #### Essential but Potentially Contentious Desiderata:
  4.  **Repugnance Explanation (Roth Cases):** Must explain why certain transactions (e.g., dwarf-tossing, consensual cannibalism contracts, perhaps certain forms of surrogacy) provoke widespread *repugnance* demanding prohibition, *even when* rigorous analysis shows:
      *   No direct harm to willing participants.
      *   No clear corruption of the good's meaning demonstrably harmful to society.
      *   *This directly confronts the "repugnance as constraint" phenomenon central to policy debates.*
  5.  **Unified Framework Aspiration:** Should strive for a *coherent, generalizable framework* explaining diverse prohibitions, not just an ad-hoc list. *(This is a common theoretical aspiration but may be contested by pluralists.)*

  #### Key Distinctions Often Collapsed (Non-Negotiably Requiring Separation):
  6.  **Transaction Wrongness (A/B above) vs. Background Injustice:** See #3. *Public debate constantly confuses "this sale exploits someone poor" (A + Background) with "selling this thing is inherently degrading" (B).*
  7.  **Condemning the Sale vs. Condemning the Background:** Must articulate why banning the sale might be an appropriate (or inappropriate) response to background injustice (e.g., does banning kidney sales alleviate or worsen the desperation of the poor?).

  #### Flagged Tensions (Likely Irreconcilable within a Single Theory):
  *   **Repugnance vs. Harm/Corruption (#4 vs. #2):** The core tension. *Can a theory satisfying #2 (requiring demonstrable participant harm or good corruption for wrongness) also adequately explain and justify the prohibition demanded in Roth-type repugnant cases (#4) where both seem absent?* Or must it either reject repugnance as irrational/moralistic or stretch definitions of "harm"/"corruption" beyond plausibility? **This is the most critical conflict.**
  *   **Separating Transaction-Wrongness from Background Injustice (#3) in Practice:** *Can this distinction hold cleanly in hard cases?* For instance, in cross-wealth surrogacy, is the wrongness *only* in the background inequality making surrogates "desperate," or does the act of commissioning a womb across such a gap *itself* constitute exploitation (A) or corrupt intimacy/reproduction (B), even absent desperation? A theory might struggle to isolate purely "transactional" wrongness here.
  *   **Unified Framework (#5) vs. Pluralism:** *Can a truly unified theory (#5) capture the diverse, often incommensurable reasons behind prohibitions* (ranging from preventing coercion to protecting sacred meanings to expressing communal values)? Pluralistic theories might satisfy #1-4 more easily but fail #5.
