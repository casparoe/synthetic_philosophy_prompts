answer: |-
  Your diagnosis is perceptive: the impasse stems from **methodological divergence masked as substantive disagreement**, compounded by your "environment vs competence" distinction which proves **illuminating** for exposing the underlying fault lines. Let's dissect this using evidence from both camps' practices and statements.

  ### Diagnosis: Methodological Schism with Conflicting Foci
  1.  **The Idealisation Camp (Normative/Competence-Focused):**
      *   **What they say:** Hintikka explicitly defends epistemic logic as modelling "ideally defensible knowledge" (*Knowledge and Belief*, 1962), while Savage frames probability as "the code of consistency for the person" (*Foundations of Statistics*, 1954). They view logic/probability as constitutive of rational competence – failing them isn't just error, it's irrationality. Their Dutch Book arguments target *incoherence*, not computational feasibility.
      *   **What they do:** Bayesian statisticians *do* use computationally tractable models, but crucially, they see this as *approximation forced by limitations*, not a revision of the normative standard. The refusal to use an unevaluable likelihood stems from *pragmatic* constraints on *applying* the normative standard, not rejecting it. Their models treat logic as fixed background (competence), not uncertain environment.

  2.  **The Bounded Camp (Descriptive-Engineering/Environment-Focused):**
      *   **What they say:** Herbert Simon insists rationality is "bounded by the limitations of the decision-maker" (*Administrative Behavior*, 1947). Proponents of impossible worlds (e.g., Rantala, Berto) argue agents *can* genuinely lack beliefs about complex logical truths. They see computational complexity (e.g., the NP-hardness of deduction) not as noise but as defining the *problem space* agents inhabit. Logic *is* part of the uncertain environment they navigate.
      *   **What they do:** Systems like awareness logics explicitly model what formulas an agent *considers*. Probabilistic programming languages designed for bounded agents (e.g., with approximate inference) treat logical relationships as objects of uncertain reasoning. Their models incorporate logic *within* the environment the agent reasons *about*.

  **The Apparent Clash:**
  *   **Dissolves:** The charge of "changing the subject" vs. the retort of "ignoring reality" reflects different aims (normative benchmark vs. operational model). Each side dismisses the other's core question: the idealiser sees bounded models as merely descriptive psychology, not *logic*; the bounded theorist sees the ideal as vacuously irrelevant.
  *   **Survives:** A substantive disagreement persists on **whether computational constraints are incidental or constitutive of rationality itself**. The idealiser sees bounded models as describing *performance errors* relative to competence; the bounded theorist sees the competence ideal as incoherent for finite agents. Your "environment vs competence" distinction crystallises this: *Is logical truth a fixed part of the agent's reasoning apparatus (competence) or a feature of the world she must discover/grapple with (environment)?* The camps answer differently.

  **Your Distinction (Environment vs. Competence):** **Illuminating, not merely neat.** It exposes the tacit metaphysical commitment underpinning the methodological split. The idealiser *must* place logic in competence to maintain normativity; the bounded theorist *must* place it (at least partially) in the environment to make computational constraints central. Neither side typically makes this explicit, leading to profound miscommunication. It explains why the Bayesian can be relaxed in theory (logic as competence) but constrained in practice (evaluating the likelihood engages with logic *as part of the empirical environment* of the specific problem).

  **Progress & Stagnation:**
  *   **Why Stalled:** The debate is stalled because each camp addresses a fundamentally different question using incompatible frameworks, and neither question admits a decisive knockout blow against the other.
  *   **What Would Count as Progress:**
      1.  **Formal Frameworks Integrating Both Views:** Resource-bounded logics (e.g., using time complexity bounds) or "logical uncertainty" probability theories (e.g., Garrabrant, Demski) that make the competence/environment boundary *explicit and negotiable* within a single model.
      2.  **Artificial Agents as Testbeds:** The development of highly capable AGI that demonstrably *needs* non-omniscient reasoning for core tasks (e.g., efficiently learning complex environments with implicit logical structure) could force reconciliation by showing the *practical necessity* of treating logic as environment in scalable systems.
      3.  **A Shift in Question:** Framing the debate explicitly as "What is the appropriate *purpose* of this formal model (prescriptive norm vs. operational description)?" or "Under what conditions *should* logic be modelled as environment vs. competence?".
      4.  **Refuting Constitutive Claims:** A formal proof that certain forms of bounded reasoning *cannot* be coherently normative (or vice-versa, that ideal omniscience *cannot* define coherence for finite agents) – though this seems unlikely.
  *   **Likelihood of Resolution:** **Low (< 25%)**. The underlying questions (nature of rationality, status of logic) are deeply philosophical and the methodological aims (pure normativity vs. descriptive/engineering fidelity) are both valid but distinct. Progress will likely involve co-existence and context-specific application rather than a victor.

