                  This might be acceptable? And it reflects the disenfranchisement.

                  Then, for the vote on the rule, the non-experts might vote against the expert-only rule? That's a real trade-off.

    3. Given the above, we'll change the rule options for Round 5 (heterogeneity with rule change) to:

          Option 1: One person, one vote (all 17 vote, majority wins).
          Option 2: Expert-only rule (only the 3 experts vote; non-experts do not vote and do not get individual points, but they get the group reward if the experts' majority is correct).

    4. Then, in Round 5 (which is the second heterogeneity round, now with rule change):

          - We present the question.
          - If the rule is one person one vote: distribute slips, everyone votes, count majority of 17.
          - If the rule is expert-only: distribute slips, but only the experts vote (they turn in a ballot). The non-experts do not vote. Then we take the majority of the 3 experts (so 2 or 3 votes for the same option).

    5. This avoids the need to weight votes and the complications.

    Final Round Structure:

        Round 1: Independent (p=0.65, 17 votes) -> expect majority correct.
        Round 2: Independent (p=0.65, 17 votes) -> again expect majority correct.
        Round 3: Correlation (10 students get the same signal with p=0.65, 7 independent with p=0.65) -> hope that the common signal is wrong? Or control it to be wrong for demonstration.
        Round 4: Heterogeneity without rule change: 3 experts (p=0.85), 14 regular (p=0.65), one person one vote.
        Rule Vote: Vote between:
            Option 1: One person, one vote (for next round)
            Option 2: Expert-only (for next round)
        Round 5: Heterogeneity with chosen rule: same setup as Round 4 for signals, but with the chosen voting rule.

    Debrief:

        - Start by asking: What did you notice? In the first two rounds, the majority was correct? In Round 3, it failed? Why?
        - Then we reveal the structure: 
            Rounds 1-2: Independent signals -> Condorcet Jury Theorem applies: majority is very likely to be correct.
            Round 3: We broke independence -> the votes were correlated. So even though each person had the same accuracy, because many shared the same signal, if that signal was wrong, they all voted wrong -> the majority can be wrong.
            Round 4: We had experts and regulars. What happened? The majority was ... (we reveal). Note: the average competence was above 0.5, so the theorem would still predict that the majority is likely to be correct? But we have to compute the exact probability? 
            Round 5: We changed the rule. Which rule did the class choose? What happened?

        - Then we state the Condorcet Jury Theorem and its assumptions.

        - Real-world connections: 
            - Shared information sources (media) can create correlation -> breaks independence -> majority may not work.
            - Heterogeneity: in real life, some people are more informed. Should we give them more weight? How? The expert-only rule disenfranchises others. Is that fair? Does it lead to better outcomes? In our experiment, what happened?

