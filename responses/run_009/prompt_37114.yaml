answer: |-
  Below is a comprehensive game design to experientially teach the Condorcet Jury Theorem (CJT) in a 75-minute sophomore seminar. The game uses binary questions, controlled information, and strategic variations to illustrate CJT’s principles and failures. Students will *feel* the theorem before learning its name.

  ---

  ### **Game Overview**
  - **Core Mechanic**: Students vote on binary questions (e.g., "Which jar has more marbles?") using private "information slips" of varying accuracy.
  - **Key Phases**:  
    - **Independence Rounds**: CJT in action (majority outperforms individuals).  
    - **Correlation Rounds**: CJT breaks (shared bias tanks majority accuracy).  
    - **Heterogeneity Rounds**: Debate on weighted voting vs. one-person-one-vote.  
  - **Payoff Scheme**: Points for individual accuracy **and** majority correctness (to incentivize collective success).  
  - **Debrief**: Connects rounds to CJT assumptions (competence, independence) and real-world implications (e.g., media echo chambers).

  ---

  ### **Materials & Prep**
  1. **Questions** (6 total, binary):  
     - Use unknowable-in-advance facts (e.g., "Which city is farther north? A: Vienna, B: Montreal"; true answer: Montreal).  
     - *Validate answers live*: Use a tablet to show Google results/evidence post-vote.  
  2. **Slips of Paper**: Pre-generated for each round/student. Color-code types:  
     - 🟦 **Blue slip**: 65% accuracy (baseline competence).  
     - 🟥 **Red slip**: 85% accuracy ("expert" signal).  
     - 🟨 **Yellow slip**: "Tip sheet" (shared signal, 80% accuracy).  
  3. **Voting**: Secret ballots (scrap paper) collected in a box.  
  4. **Scoreboard**: Track points on the whiteboard.  
  5. **Pre-Generated Signals**: Use a random number generator (e.g., [random.org](https://www.random.org/)) to pre-determine slip correctness for all rounds. Fix one correlation round to ensure failure (see below).  

  ---

  ### **Round Structure & Timing**  
  *(Total: 60 minutes for rounds + 15 minutes debrief)*  

  | Round | Time  | Setup | Voting Rules | What Happens (Instructor Script) | CJT Concept |
  |-------|-------|-------|--------------|----------------------------------|-------------|
  | **1–2: Baseline Independence** | 10 min (5 min each) | Each student gets a 🟦 *private* slip (65% acc). | One person, one vote. | *"Vote based ONLY on your slip. Remember: your slip is *private*."* | CJT works: Majority accuracy > individual. |
  | **3: Correlation (Failure)** | 10 min | All students get: (1) 🟨 *Same* "tip sheet" (80% acc), (2) 🟦 *Private* slip (65% acc).<br>***Crucially***: Fix the tip sheet as *wrong* this round. | One person, one vote. | *"Use the tip sheet AND your slip. If they conflict, follow the tip sheet."* | Shared signal → correlated errors → majority fails. |
  | **4: Heterogeneity (Secret Experts)** | 10 min | 3 secretly chosen "experts" get 🟥 red slips (85% acc). Others get 🟦 blue slips (65% acc). | One person, one vote. | *"Some slips are stronger than others. Don’t reveal your slip color!"* | Heterogeneous competence: Experts improve group accuracy. |
  | **5: Rule Change Vote** | 10 min | Students *don’t know* if they’re experts. No new slips. | Vote on voting system:<br>- **Option A**: One person, one vote.<br>- **Option B**: Experts get 2 votes (if expert status revealed). | *"Debate: Should we weight votes by expertise? You don’t know if *you’re* an expert!"* | Epistocracy vs. democracy trade-offs. |
  | **6: Heterogeneity + New Rule** | 10 min | Same as Round 4. | Use the *winning* system from Round 5.<br>- If Option B wins: Experts *reveal themselves* and get 2 votes. | *"Experts, stand up if you’re voting double!"* | Weighted voting may (not) improve outcomes. |
  | **Tiebreaker** | 2 min | Pre-set coin flip. | N/A | *"Tie? The answer is [A/B]."* | Avoids deadlock (17 voters = unlikely). |

  ---

  ### **Payoff Scheme**  
  **Goal**: Reward both individual and collective success to mirror CJT’s focus on group outcomes.  
  - **Individual correct vote**: +1 point  
  - **Majority correct**: +3 points *(everyone benefits)*  
  - **Max possible/round**: 4 points (individual + majority correct).  

  ***Why this works***: Students care about majority outcomes (3 > 1 point), creating tension between self-interest and group success. Track points publicly to fuel competition.  

  ---

  ### **Debrief (15 minutes)**  
  **Map the Game to CJT Theory**:  

  | Round | CJT Concept | Discussion Points | Real-World Link |
  |-------|-------------|-------------------|----------------|
  | 1–2 | **Competence + Independence** | *"Why did majority beat individuals? Because your errors were *uncorrelated*."* | Diverse info sources → robust democracy. |
  | 3 | **Independence Violation** | *"Same tip sheet = shared bias. One error poisoned the majority."* | Media monopolies → correlated misinformation. |
  | 4 | **Heterogeneity** | *"Did experts help? Yes! Higher *average* competence helps CJT hold."* | Unequal access to education/information. |
  | 5–6 | **Voting Rules** | *"Why debate weighting? Self-interest vs. collective good. Also: how do we *identify* experts?"* | Epistocracy (e.g., Plato’s philosopher-kings) vs. equality.  

  **State the Theorem**:  
  > **Condorcet Jury Theorem**: If voters are (1) *competent* (p > 0.5), (2) *independent*, and (3) vote truthfully, then:  
  > - The majority vote is more likely correct than any individual.  
  > - As group size ↑, P(majority correct) → 100%.  
  > **Corollary**: Correlation kills collective intelligence!  

  **Connect to Game**:  
  - *"You were the voters. Rounds 1–2 felt CJT working. Round 3 felt it break. Rounds 4–6 asked: ‘What if competence isn’t equal?’"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students compare slips**:  
     - *Prevention*: Stress secrecy in rules. Use discreet slip colors (e.g., pastel). Confiscate phones.  
     - *Fix*: If cheating occurs, declare slips "inadmissible" and restart the round.  

  2. **Someone knows the answer**:  
     - *Prevention*: Use obscure questions (e.g., "Which country consumes more coffee per capita: A: Netherlands, B: Finland?"). No googling.  
     - *Fix*: If a student blurts the answer, pause: *"This is why we need secret ballots in real elections!"* Exclude the question.  

  3. **Ties**:  
     - *Probability*: Near-zero with 17 voters (odd number).  
     - *Fix*: Flip a coin and award majority points (simulates CJT’s tiebreaking).  

  4. **"Expert" resentment**:  
     - *Prevention*: Secretly assign experts (e.g., RNG). In debrief, note: *"Inequality in info is real—democracies mitigate it via free press/education."*  

  ---

  ### **Limitations of the Game**  
  - **Small n (17 voters)**: CJT’s magic is asymptotic (n → ∞). With n=17:  
    - P(majority correct) ≈ 87% (if p=0.65, independent), not 99%.  
    - *Solution*: Show simulation results for n=100/1000 on the whiteboard during debrief.  
  - **Non-Bayesian voters**: Students don’t update beliefs rationally (unlike CJT’s assumptions).  
    - *Embrace it*: *"Real voters aren’t robots! CJT is a baseline—psychology complicates it."*  
  - **Fixed competence**: Real expertise varies (e.g., domain-specific).  
    - *Mitigation*: Note in debrief: *"CJT assumes homogeneous p. What if p varies? Math gets messier!"*  

  ---

  ### **Instructor Cheat Sheet**  
  - **Pre-Generate Signals**: Use this template:  
    ```python
    # Python pseudocode for signal generation
    import numpy as np

    # Round 1-2: Independent slips (17 students, p=0.65)
    signals = np.random.binomial(1, 0.65, size=17)  # 1=correct, 0=wrong

    # Round 3: Shared tip sheet (fixed as wrong) + independent slips
    tip_sheet_wrong = True  # Set to false for other rounds if reused
    private_signals = np.random.binomial(1, 0.65, size=17)

    # Round 4-6: Heterogeneity (3 experts p=0.85, 14 non-experts p=0.65)
    expert_signals = np.random.binomial(1, 0.85, size=3)
    nonexpert_signals = np.random.binomial(1, 0.65, size=14)
    ```
  - **Correlation Round Tip**: Fix the tip sheet as *wrong* to guarantee a teachable failure.  
  - **Timing Tip**: Use a visible timer. Cut off debates/votes at 2 minutes.  

  ---

  This design forces students to confront CJT’s assumptions viscerally. They’ll leave understanding not just the theorem, but why democracy hinges on diverse, independent information—and how easily it breaks when those vanish. Good luck!
