  - D3: RET=1, AMT=1, QT=1
  - D4: RET=1, AMT=2, QT=1
  - D5: RET=2, AMT=1, QT=2? (QT can explain specific heat by quantized levels) -> let's say QT=2
  - D6: RET=1 (vague), AMT=2, QT=2 (quantum tunneling for decay)
  - Total: RET=8, AMT=9, QT=9? (max=12) -> tie between AMT and QT? But we wanted AMT to win. Let's adjust D5: 
     - D5: RET=2, AMT=2, QT=1 (because QT for gases might be complex and not yet developed) -> then RET=8, AMT=10, QT=8 -> so AMT wins.

  **Gen5** (data: D1-D7):
  - D1: RAMT=1, RT=1, QT=1
  - D2: RAMT=2, RT=2, QT=2
  - D3: all=1
  - D4: RAMT=2, RT=2, QT=1? (QT might not focus on mass) -> let's say QT=1
  - D5: RAMT=2, RT=2, QT=2
  - D6: RAMT=2, RT=2, QT=2
  - D7: RAMT=1 (they can incorporate E=mc² but it's added), RT=2, QT=0
  - Total: RAMT=12, RT=13, QT=9 (max=14) -> RT wins.

  ### Ledger
  After each generation, record:
     Generation 1: Motion Theory (4/6 = 67%)
     Generation 2: Motion Theory (6/8 = 75%)
     Generation 3: Energetic Theory (8/10 = 80%)
     Generation 4: Atomic Motion Theory (10/12 = 83%)
     Generation 5: Relativistic Theory (13/14 = 93%)

  Note: the success rates are increasing! So the realist might say we are converging. But we know RT will be overturned.

  ### Time Allocation
  - Introduction: 5 mins
  - Each generation: 15 mins (5 generations: 75 mins)
  - Final seal decision: 5 mins
  - Reveal of future overturning: 5 mins
  - Debrief: 30 mins

  Total: about 120 mins.

  ## Final Steps
  1. Run the simulation through the generations.
  2. In Gen5, after teams choose their theory (but before scoring), reveal the seal option. Each team independently decides whether to buy it (cost: 20 points). They record their decision.
  3. Then score Gen5 as usual. RT wins, so teams that chose RT get 1.5 * stake, RAMT second (1.0 * stake), QT 0.
  4. Then, after scoring, reveal that in the next generation, a new instrument (quantum gravity detector) reveals that in extreme conditions (black holes, etc.), the relativistic theory breaks down and a new theory is needed. So the seal fails. Teams that bought the seal lose 20 points (and do not get the bonus).
  5. Then debrief.

  This should create the experience of the meta-induction and set up the philosophical discussion.
