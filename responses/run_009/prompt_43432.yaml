  Below is a complete, ready-to-run simulation design for your seminar on the pessimistic meta-induction. I've structured it for clarity, with rules, materials, payoff schemes, and debriefing guidance. The fictional science topic is **"the nature of combustion"** (to avoid real-history biases like phlogiston). Teams will evaluate theories based on simplicity, fit to data, and explanatory scope—not prior scientific knowledge.

  ---

  ### **Simulation Overview**
  - **Topic**: The nature of combustion (fictional).  
  - **Generations**: 5 (each 15–20 minutes).  
  - **Teams**: 3–4 students per team (4 teams for 14 students).  
  - **Goal**: Teams choose theories to explain data, earn credibility points, and witness theories being overturned by new instruments. The final generation decides whether to "lock in" their theory.  
  - **Key Twist**: Theories are designed so that each successor partially retains elements of prior theories (e.g., "ether" evolves into "vibrational fields"), enabling selective realism discussions.  

  ---

  ### **Materials**  
  **1. Data Cards** (One set per team per generation; include all prior data plus new):  
  - *Gen 1*:  
    - D1: Combustion requires air.  
    - D2: Combustion produces ash.  
    - D3: Metals gain weight when burned.  
  - *Gen 2 (adds D4)*:  
    - D4: Some substances (e.g., sulfur) produce acidic vapors when burned.  
  - *Gen 3 (adds D5)*:  
    - D5: Combustion stops in a vacuum.  
  - *Gen 4 (adds D6)*:  
    - D6: Burning organic matter releases a gas that turns limewater cloudy.  
  - *Gen 5 (adds D7)*:  
    - D7: Ultraviolet light reveals invisible residues after combustion.  

  **2. Theory Cards** (2–3 options per generation; reveal only current-gen theories):  
  - *Gen 1*:  
    - **Elemental Release (ER)**: Combustion releases "pure earth" from matter (explains D1–D3).  
    - **Vital Essence (VE)**: Combustion consumes "life force" in air (explains D1, D2; struggles with D3).  
  - *Gen 2*:  
    - **Acidifier Theory (AT)**: Combustion combines matter with "acidic ether" (explains D1–D4).  
    - **Vital Essence Revised (VER)**: "Life force" splits into acid/non-acid forms (explains D1–D4, but complex).  
  - *Gen 3*:  
    - **Ether Depletion (ED)**: Air contains "combustive ether" drained in burning (explains D1–D5).  
    - **Pressure-Vortex (PV)**: Combustion is a pressure vortex igniting "energy cores" (explains D1–D4; weak on D5).  
  - *Gen 4*:  
    - **Gas-Release Theory (GRT)**: Combustion releases "fixed air" from materials (explains D1–D6).  
    - **Phlogistic Fields (PF)**: Matter emits "phlogistic fields" absorbed by air (explains D1–D5; weak on D6).  
  - *Gen 5*:  
    - **Oxonic Particle (OP)**: Combustion binds matter to "oxonic particles" in air (explains D1–D7).  
    - **Vibrational Resonance (VR)**: Heat excites "resonant frequencies" in matter (explains D1–D7).  
    - **Seal of Permanence**: Optional purchase in Gen 5 only (cost: 20 points; bonus: +50 points if theory never overturned).  

  **3. Instrument Cards** (Revealed after each generation’s scoring):  
  - Post-Gen 1: **Precision Scales** (reveals D4: weight gain correlates with acidity).  
  - Post-Gen 2: **Vacuum Pump** (reveals D5: combustion stops without air).  
  - Post-Gen 3: **Gas Trapper** (reveals D6: gas changes limewater).  
  - Post-Gen 4: **UV Spectrometer** (reveals D7: invisible residues).  
  - Post-Gen 5: **Quantum Calorimeter** (revealed in debrief; shows OP/VR both fail under extreme conditions).  

  **4. Ledger** (Whiteboard/public sheet tracking retired theories):  
  | Generation | Theory              | Success Rate | Points Retired |  
  |------------|---------------------|--------------|----------------|  
  | 1          | [Name]              | [e.g., 75%]  | [e.g., 45]     |  
  | 2          | [Name]              | [e.g., 80%]  | [e.g., 50]     |  
  | ...        | ...                 | ...          | ...            |  
  *(Update after each generation)*  

  **5. Point System**:  
  - Start: 20 points per team.  
  - **Staking**: Each generation, teams stake 5–15 points on one theory (minimum 5).  
  - **Payout**:  
    - Best theory: Win 1.5× staked points.  
    - Second-best: Break even (1× staked points).  
    - Worst: Lose staked points.  
  - **Scoring Criteria** (predetermined per theory/data; see table below).  
  - **Seal of Permanence**: In Gen 5, teams may pay 20 points *before scoring* to lock their theory. If never overturned, +50 points. In debrief, reveal it *is* overturned.  

  ---

  ### **Theory Scoring Key**  
  *(Predetermined by instructor; teams see only data/theories)*  
  - **Fit to Data**: 0 (poor), 1 (good), 2 (excellent).  
  - **Bonus Points**: +1 for simplicity, +1 for unification (explaining multiple phenomena).  

  | Gen | Theory | D1 | D2 | D3 | D4 | D5 | D6 | D7 | Simplicity | Unification | **Total** |  
  |-----|--------|----|----|----|----|----|----|----|------------|-------------|-----------|  
  | 1   | ER     | 2  | 2  | 2  | –  | –  | –  | –  | +1         | +1          | **8**     |  
  | 1   | VE     | 2  | 2  | 0  | –  | –  | –  | –  | +0         | +1          | **5**     |  
  | 2   | AT     | 2  | 2  | 2  | 2  | –  | –  | –  | +1         | +1          | **10**    |  
  | 2   | VER    | 2  | 2  | 1  | 2  | –  | –  | –  | +0         | +0          | **7**     |  
  | 3   | ED     | 2  | 2  | 2  | 2  | 2  | –  | –  | +1         | +1          | **12**    |  
  | 3   | PV     | 2  | 2  | 2  | 1  | 0  | –  | –  | +0         | +1          | **8**     |  
  | 4   | GRT    | 2  | 2  | 2  | 2  | 2  | 2  | –  | +1         | +1          | **14**    |  
  | 4   | PF     | 2  | 2  | 2  | 2  | 2  | 0  | –  | +0         | +0          | **10**    |  
  | 5   | OP     | 2  | 2  | 2  | 2  | 2  | 2  | 2  | +1         | +1          | **16**    |  
  | 5   | VR     | 2  | 2  | 2  | 2  | 2  | 2  | 1  | +0         | +1          | **15**    |  

  - **Outcomes**:  
    - Gen 1: ER wins (8), VE loses (5).  
    - Gen 2: AT wins (10), VER loses (7).  
    - Gen 3: ED wins (12), PV loses (8). *Note: Close call—ED wins by 4 points.*  
    - Gen 4: GRT wins (14), PF loses (10).  
    - Gen 5: OP wins (16), VR second (15). *Another near tie.*  

  ---

  ### **Procedure**  
  1. **Setup** (5 mins):  
     - Rearrange tables for 4 teams.  
     - Distribute Gen 1 materials (data + theory cards). Explain rules:  
       *"You are research teams choosing theories to explain combustion. Stake points, earn payouts based on fit to data. New instruments may reveal surprises."*  
     - **Hide the ledger and seal option** until needed.  

  2. **Per Generation** (15 mins/generation):  
     - **Minutes 0–10**: Teams discuss theories using criteria (fit, simplicity, unification).  
     - **Minutes 10–12**: Teams stake points (write choice/stake on slip).  
     - **Minutes 12–15**: Instructor scores, updates points, reveals new instrument + next data card, and retires winning theory to ledger (record success rate = total/max possible).  
       - *Example ledger entry post-Gen 1: "Gen 1: Elemental Release (8/10 = 80%)"*.  

  3. **Gen 5 Special Rule**:  
     - Before scoring, reveal **Seal of Permanence**:  
       *"You may pay 20 points to lock your theory. If it’s never overturned, gain 50 points. You know the ledger: all past theories were overturned."*  
     - Teams decide secretly; then score Gen 5 normally.  

  4. **Reveal Overturn** (Post-Gen 5):  
     - Show **Quantum Calorimeter** instrument card: *"Reveals combustion under extreme pressures produces energy patterns incompatible with OP/VR."*  
     - Seal buyers lose 20 points; no bonus.  

  ---

  ### **Debrief (30 mins)**  
  **Map to Meta-Induction**:  
  1. **Ledger = Historical Record**: "Each retired theory was once 'best' but proved false. What does this imply for today’s theories (OP/VR)?"  
  2. **Seal Decision = Inductive Risk**: "Your choice to buy the seal mirrors scientific realism—believing today’s theory is true despite past failures."  
  3. **Meta Aspect**: "You used the *same standards* (fit, simplicity) every generation. The induction is 'meta' because it targets the reliability of your methods, not specific theories."  

  **Stage Realist Replies**:  
  - **No Miracles**: "OP earned high points—doesn’t its success suggest it’s true?" *Counter: Past theories (ER, AT) also 'earned' points but failed.*  
  - **Selective Realism**: "Notice ER’s 'pure earth' → AT’s 'ether' → GRT’s 'fixed air' → OP’s 'oxonic particles.' Some components survived. Does this justify realism about *parts* of theories?" *Use ledger to show partial retention (e.g., "air-dependency" persists).*  
  - **Different in Kind**: "Is OP *fundamentally* better? It scored 16/18 vs. ER’s 8/10." *Highlight Gen 3’s ED (12/15) was also a "leap" but fell.*  

  **Crucial Question**:  
  - "Would any realist reply have rationally justified buying the seal? Or does the ledger *force* pessimism?"  

  ---

  ### **Candid Section: Predictable Issues & Structural Distortions**  
  **What Will Go Wrong**:  
  1. **Students Guess the Twist**: Some may refuse to stake points in Gen 5 or reject the seal. *Mitigation*:  
     - Run early generations in "genuine ignorance"—only reveal the ledger after Gen 2 and the seal in Gen 5.  
     - Emphasize early: *"Your goal is to maximize points; the best theories endure."* (Downplay pessimism initially).  
  2. **Gamification**: Teams may prioritize points over epistemology (e.g., stake low to "survive"). *Mitigation*:  
     - Frame points as "credibility," not currency. In debrief, ask: "Did points mirror *confidence* in theories?"  
  3. **Trolling**: A team picks a theory "for laughs." *Mitigation*:  
     - Remind them low stakes risk bankruptcy (teams with <5 points sit out).  
     - In debrief, use their choice: "Did anyone pick a theory ironically? How does this mirror scientific bias?"  

  **What the Simulation Distorts (Discuss Post-Activity)**:  
  1. **Complete Ledger**: Real scientists see a *partial* record. We don’t know if we’re in "Gen 5" or "Gen 500."  
  2. **Uniform Standards**: Real theory-choice involves shifting criteria (e.g., elegance vs. precision).  
  3. **Theory Complexity**: Real theories have intricate, untested assumptions; our cards oversimplify.  
  4. **No Unknown Unknowns**: Instruments here always reveal flaws—real science faces deeper uncertainties (e.g., dark matter).  
  5. **Social Dynamics**: Peer review, funding, and prestige aren’t modeled.  

  ---

  ### **Instructor Notes**  
  - **Timekeeper**: Use a visible timer. If debates run long, shorten Gen 3–4 (hardest choices) to 12 mins.  
  - **Theory Design**: Each theory retains one element (e.g., ER’s "weight gain" → AT’s "acid-weight link" → OP’s "particle binding"). Highlight this in debrief for selective realism.  
  - **Seal Timing**: Revealing it only in Gen 5 prevents early skepticism but may cause confusion. Briefly recap rules: *"This is new: You may lock your theory now."*  
  - **Embrace Chaos**: If a "troll" team wins Gen 3 (e.g., staking 15 on PV), use it! *"PV won despite weak data—how does this reflect real scientific controversies?"*  

  This simulation forces students to *live* the meta-induction: They’ll feel the ledger’s weight when deciding on the seal. By making Gen 3 and 5 near-ties, the "sting" of impeccable-yet-failed theories hits hardest. The debrief then transforms gameplay into philosophy.
