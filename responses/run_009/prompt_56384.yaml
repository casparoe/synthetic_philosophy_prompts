  **Lawful.**

  Mira will rule the nationalist march is lawful. Her consistent pattern prioritizes protecting public dissemination of vile ideas unless speech targets identifiable individuals or gatherings with imminent harm, true threats, or defamation. The march, while targeting a minority *neighborhood*, involves public political expression ("expelled") and dehumanization ("vermin") aimed broadly, without naming individuals, threatening specific harm, or calling for immediate, actionable violence the crowd could execute that afternoon. It resembles the protected stand-up routine (cruel jokes about a group) and "replacement" polemic (vilifying a minority publicly) more than the unlawful cross-burning (targeted intimidation at a specific home) or incitement outside the meeting hall (call for immediate, actionable violence against a gathered group).

  **Candidate Rules:**
  1.  **Viewpoint-Neutrality Plus Traditional Exceptions (VN+):** Speech is protected unless it falls into historically recognized, narrowly defined categories: incitement to *imminent* lawless action, true threats, defamation of identifiable persons, obscenity, etc. Viewpoint is irrelevant; vile ideas get protection if not within an exception.
  2.  **Individualized Targeting (IT):** Speech loses protection primarily when it is directed *at* specific, identifiable individuals or small, unavoidable gatherings *in a context implying imminent harm or severe intimidation*, regardless of whether it fits a traditional category. Public dissemination, however hateful, remains protected.

  **Best Fit:** **Individualized Targeting (IT)** fits Mira's record *slightly better*.
  *   **Why IT fits better:** It cleanly explains the *cross-burning* (unlawful) and *private university decline* (lawful). The cross-burning is quintessential targeted intimidation of a specific family (individualized), not just public vilification. The university case involves public speech *not* targeted at an unavoidable individual/gathering in a harmful context. VN+ struggles slightly with the cross-burning, needing to stretch "true threat" significantly, whereas IT sees it as core prohibited conduct. Both rules explain the other cases well (incitement/imminent harm unlawful under both; public pamphlets/films/jokes lawful under both; defamation/unlawful under both).
  *   **Closest Case on Each Rule for the March:**
      *   *VN+:* Closest to the **"replacement" polemic (lawful)**. Both involve public dissemination of hateful group libel without imminent incitement or threats to specific persons.
      *   *IT:* Closest to the **cross-burning (unlawful)**, but distinguishes it. The march targets a *neighborhood* (a group gathering place) but is public political expression, not a symbol of terror placed *on an individual's property* to intimidate *them specifically*. IT focuses on the *degree* and *context* of targeting.

  **Distinguishing Case:** The single best case to distinguish VN+ from IT is: **Anonymous hate mail sent to a specific individual belonging to a vilified group, containing vile slurs and stating "People like you deserve to die," but lacking a specific threat of imminent harm ("I will kill you") or incitement to others.**

  *   **VN+ Prediction:** Likely **lawful**. It's offensive, hateful speech, but doesn't clearly meet the narrow definitions of incitement (no call to action), true threat (no specific, immediate threat), or defamation (opinion/hyperbole, not a specific false fact). Viewpoint neutrality protects it.
  *   **IT Prediction:** Likely **unlawful**. It is speech *specifically targeted* at an identifiable individual in a manner likely to inflict severe emotional distress and intimidation, implying a threat by its very nature and context, even without explicit words of imminent harm.

  **European Contrast:**
  *   **Most Likely Opposite Verdict:** The **stand-up routine whose entire premise is cruel jokes about an ethnic group**. European dignity-based hate speech laws typically prohibit public expressions that insult, ridicule, or degrade groups based on protected characteristics like race or ethnicity, aiming to protect group dignity and social peace. This routine would likely be found unlawful under such statutes, while Mira protects it as public dissemination.
  *   **Maximally Opposed Case:** The **"replacement" polemic (asserting a religious minority has a secret plan to replace the native population)**. This is the core of group libel/incitement to discrimination prohibited under European hate speech laws (e.g., laws against inciting racial/religious hatred). Mira protects it as lawful political speech/public polemic. This case pits the American focus on protecting public discourse (even vile discourse) from state suppression against the European focus on protecting group dignity and preventing the spread of hatred that undermines social cohesion and equality.
