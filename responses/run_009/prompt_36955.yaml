prompt: |-
  My flatmate did economics as an undergrad and had a few drinks in him when he explained to me that ethics got settled back in the 50s. His version: 'There's this thing called Harsanyi's aggregation theorem. Step one, rational people maximise expected utility — that's just decision theory. Step two, if you want to judge a society fairly, you do it from behind a veil of ignorance, where you're equally likely to end up as anyone in it. Put the two together and the rational, impartial choice is the society with the highest total utility. It's literally a theorem — utilitarianism is proved, like Pythagoras. Rawls used the same veil-of-ignorance setup afterwards and got a different answer, so one of them must have slipped up in the maths somewhere.'

  I know enough philosophy to suspect this is too tidy, but not enough to say exactly where it bends. Go through it bit by bit: which parts would a social choice person actually sign off on, which parts quietly smuggle something in (I've half-heard there are two different Harsanyi results that people run together?), and is the dig at Rawls fair or is his setup not really 'the same' at all? And seperately — even if the theorem is basically sound, does it follow that ethics is settled by decision theory, or are there premises in there that a utilitarian would happily grant and everyone else would deny? I'm inclined to think the maths part is real and the 'settled' part is wishful thinking, but tell me if even the maths is dodgy in my flatmate's telling.

  Lead with your bottom line in one sentence, then the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Alright, the user's query is about their flatmate's explanation of Harsanyi's aggregation theorem and its implications for ethics. Let me start by unpacking the flatmate's argument. He claims that ethics was settled in the 50s because Harsanyi combined expected utility theory with the veil of ignorance to prove utilitarianism. The user suspects this is too tidy and wants to know where the gaps are.

  First, I need to verify the accuracy of Harsanyi's theorem. There are two results: the aggregation theorem and the veil of ignorance argument. The flatmate might be conflating them. The aggregation theorem shows that if individuals and the social planner are vNM rational, social welfare must be a weighted sum of individual utilities. But this isn't necessarily utilitarian unless the weights are equal. The veil of ignorance argument uses the same rationality assumptions behind the veil to argue for average utilitarianism. So the flatmate is mixing the two, which is a common mistake.

  Next, the comparison with Rawls. Rawls also uses the veil of ignorance but rejects the expected utility framework, especially in risky situations. He assumes extreme risk aversion, leading to the maximin principle. So Rawls's setup isn't the same because he challenges the rationality assumptions. The flatmate's dig at Rawls isn't fair because their premises differ.

  The user questions whether ethics can be settled by decision theory. The premises here are critical. vNM rationality assumes that individuals maximize expected utility, which is controversial. Philosophers like Allais and Ellsberg have shown that people don't always follow these axioms. Additionally, assuming that rationality applies to moral choices behind the veil might conflate personal and moral reasoning. Utilitarians accept these premises, but others, like Rawlsians or prioritarians, reject them. The theorem is sound mathematically but relies on assumptions that are not universally accepted.

  The user also hints at the "settled" part being wishful thinking. Even if the math is correct, the normative premises are where the debate lies. Different ethical theories prioritize different values, like equality or rights, which the theorem doesn't address. So while the math is valid under its assumptions, those assumptions are the battleground for ethical disagreements.

  I should also consider the user's deeper needs. They might be looking for a clear rebuttal to their flatmate's argument, understanding the philosophical nuances without jargon. They need points to explain why ethics isn't settled, highlighting where assumptions are contested. Clarifying the two Harsanyi theorems and Rawls's different approach would address their confusion. Emphasizing the distinction between mathematical validity and normative assumptions will help them see why the debate continues.
answer: |-
  **Bottom line:** Your flatmate oversimplifies Harsanyi, misrepresents Rawls, and ignores the controversial normative premises baked into the "decision theory" step that ethicists robustly dispute, meaning ethics is far from settled.

  **Breakdown:**

  1.  **Harsanyi's Two Theorems (Often Conflated):**
      *   **The Aggregation Theorem:** This *assumes* both individual preferences and a "social planner" satisfy von Neumann-Morgenstern (vNM) rationality axioms (expected utility). It concludes social welfare *must* be a **weighted sum** of individual utilities. Crucially, it **does not** specify that the weights must be equal (pure utilitarianism). Equal weights require an *additional* normative assumption about impartiality.
      *   **The Veil of Ignorance Argument:** This *uses* vNM rationality applied behind a veil of ignorance (impartiality). It argues that a rational, self-interested individual in this position would choose the society maximizing their *expected utility*, leading to **average utilitarianism**. This *is* a normative argument for utilitarianism, but it *depends entirely* on accepting vNM rationality as the correct model for *moral* reasoning under uncertainty.

  2.  **The "Decision Theory" Premise is the Core Controversy:**
      *   **vNM Rationality is Descriptive, Not Normatively Uncontested:** The axioms (completeness, transitivity, continuity, independence) are often violated by real human behavior (Allais paradox, Ellsberg paradox). More importantly, **many ethicists argue they are *not* the appropriate standard for *moral* reasoning.** Rawls specifically rejects the independence axiom for moral choice, arguing it ignores the special badness of ending up in the worst-off position.
      *   **Smuggling in Utilitarianism:** Assuming vNM rationality *already incorporates* a specific, controversial way of handling risk and uncertainty – one that averages outcomes. Non-utilitarians (like Rawls, prioritarians, sufficientarians) argue moral reasoning requires different risk attitudes or focuses on distributions, not just averages/totals.

  3.  **Rawls's Setup is NOT "The Same":**
      *   **Fundamental Challenge to vNM:** Rawls explicitly rejects the idea that vNM rationality applies to the *moral* choice behind the veil. He argues the veil imposes such radical uncertainty (no probability estimates) that rational individuals, concerned with protecting their basic liberties and securing a minimum position, would use the **maximin rule** (maximize the minimum outcome), leading to his Difference Principle, not average utility maximization.
      *   **The Dig is Unfair:** Rawls didn't "slip up in the maths." He deliberately constructed a *different* model of rational choice under the veil, challenging Harsanyi's foundational premise. His argument is internally consistent given his rejection of vNM for this context.

  4.  **What Social Choice Theorists Sign Off On:**
      *   The *mathematical derivation* of Harsanyi's Aggregation Theorem: **If** you accept vNM rationality for both individuals *and* the social planner, then social welfare is a weighted sum of vNM utilities.
      *   The *mathematical derivation* of Harsanyi's Veil Conclusion: **If** you accept vNM rationality *and* impartiality modeled by the veil of ignorance *and* an equiprobability assumption, then average utilitarianism follows.
      *   That Rawls's maximin conclusion follows **if** you accept his specific (non-vNM) model of rationality under radical uncertainty.

  5.  **Why Ethics Isn't "Settled" by the Theorem:**
      *   **The Premises are Battlegrounds:** The debate isn't about Pythagoras-like mathematical proof. It's about whether vNM rationality is the right model for *moral* decisions (Rawls, others say no), whether the veil should include probabilities (Rawls says no), whether impartiality *requires* the veil (other theories exist), and whether utility is the only relevant good (rights theorists, capability theorists say no).
      *   **The Math is Sound, the Normative Assumptions Aren't:** The theorems show *what follows* if you accept specific axioms. Utilitarians accept those axioms gladly. Non-utilitarians reject key axioms (like the application of vNM to ethics or the equiprobability assumption) and thus reject the conclusions. The math doesn't compel agreement on the axioms themselves.
      *   **Beyond Aggregation:** The theorems focus on aggregating *given* individual utilities. They say nothing about what constitutes a good life (utility), how to measure and compare utility interpersonally (a massive problem), or how to handle fundamental rights or equality concerns that aren't captured by utility sums/averages. Other ethical theories prioritize these differently.
