      - If yes, then the dispute is not merely verbal in the strict sense, but it is metalinguistic. However, for the purpose of our procedure, we must decide if it is "substantive" in the sense that it is a real disagreement that matters. We consider it substantive because it involves normative or practical issues. But note: the procedure might need to flag that this is a judgment call. Verdict: "substantive" (with a note that it is metalinguistic).
