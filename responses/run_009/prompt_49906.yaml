  We are constructing a decision procedure for determining whether a dispute is merely verbal. The procedure is based on tools from the literature on verbal disputes and metaontology, especially Chalmers, Sider, and Hirsch. The goal is to have a step-by-step process that a referee can run in an afternoon without a deep literature dive.

  The procedure will be structured as a flowchart with specific questions. At each step, we will have:
  - The question to ask.
  - What counts as a sufficient answer (leading to the next step or a verdict).
  - The possible verdicts: "substantive", "merely verbal", "cannot tell", or a point where the referee must make a judgment call (with guidance on what to consider).

  We'll design the procedure to handle hard cases such as:
  - Metalinguistic negotiations (where parties use the same words with different meanings but the disagreement is about which meaning should be adopted, based on practical or normative considerations).
  - Cases with explicit stipulations and when one side treats it as a concession.
  - Disagreements about which concept to use.

  After building the procedure, we'll apply it to the three manuscripts and then discuss the procedure's failure modes.

  ---

  **Decision Procedure for Merely Verbal Disputes**

  **Step 0: Preprocessing**
  - Identify the target dispute (D) in the paper. The paper should clearly state which dispute it claims is (or is not) merely verbal. If not, the procedure stops: return "cannot tell" and note that the target dispute is not clearly defined.

  **Step 1: Check for Shared Background Facts**
  - **Question:** Do the parties in the dispute (as characterized by the author) agree on all the non-linguistic facts? That is, if we set aside their words, do they agree on the underlying reality? (This draws from Chalmers: a dispute is verbal if it arises solely from differences in meaning and not from differences about the world.)
    - **How to check:** Look for the author's characterization of the dispute. If the author claims that the parties agree on the non-linguistic facts, then move to Step 2. If the author does not address this, then the referee must check: does the paper provide evidence that the parties agree on the facts? If not, note that the burden is on the author to show this agreement. If the parties do not agree on the non-linguistic facts, then the dispute is likely substantive. But note: sometimes the disagreement about facts might be masked by linguistic differences. So we proceed to Step 2 to check for that.
    - **Sufficient answer:**
      - If yes (agreement on non-linguistic facts), go to Step 2.
      - If no (disagreement on non-linguistic facts), then the dispute is likely substantive. But we must check if the disagreement about facts is genuine or if it is due to linguistic confusion. Go to Step 2 to check for meaning differences that might be causing the apparent factual disagreement.
      - If unclear, go to Step 2 with a note to be cautious.

  **Step 2: Check for Meaning Variance**
  - **Question:** Is the dispute due to the parties using the same words with different meanings? (Chalmers: a verbal dispute arises when there is a difference in meaning that accounts for the disagreement.)
    - **How to check:** Look for evidence that the parties assign different meanings to key terms. This might be explicit (e.g., one party defines "free will" as the ability to do otherwise, while another defines it as the ability to act according to one's desires) or implicit (e.g., the parties apply the term to different cases). The author might provide this evidence.
    - **Sufficient answer:**
      - If no meaning variance (same meanings), then the dispute is substantive (unless Step 1 already showed agreement on facts, then there might be no dispute at all). But if there is disagreement without meaning variance and without factual disagreement (from Step 1), that would be odd. So if Step 1 said they agree on facts and Step 2 says same meanings, then there should be no dispute. If there is a dispute, then Step 1 might have been wrong. So in that case, we must revisit Step 1. Alternatively, if Step 1 said they disagree on facts and Step 2 says same meanings, then the dispute is substantive.
      - If meaning variance is present, go to Step 3.
      - If unclear, go to Step 3 (with a note that meaning variance is suspected but not proven).

  **Step 3: Apply the Stipulation Test (Chalmers)**
  - **Question:** If the parties were to explicitly stipulate the meaning of the disputed terms, would the dispute disappear? (Chalmers: in a verbal dispute, if both parties accept a stipulation of meaning, the dispute should resolve because they agree on the facts.)
    - **How to check:** The author might address this. Otherwise, the referee must consider: if we fix the meaning of the key term(s) by stipulation, would the parties still disagree? If the disagreement persists even after stipulation, then the dispute is not merely verbal. But note: sometimes a party might reject the stipulation because they think the term has a different meaning in the language. We are testing whether, under a common meaning, the disagreement remains.
    - **Sufficient answer:**
      - If yes (the dispute disappears after stipulation), then the dispute is merely verbal. Verdict: "merely verbal".
      - If no (the dispute persists after stipulation), then go to Step 4.
      - If unclear (e.g., one party might accept the stipulation and the other not, or the stipulation is rejected for non-arbitrary reasons), go to Step 4.

  **Step 4: Possibility of Disagreement Without Meaning Variance (Chalmers)**
  - **Question:** Could two parties who share the same meanings for the terms still disagree about the issue? (Chalmers: if they share meanings and still disagree, then the dispute is substantive.)
    - **How to check:** Imagine two parties who use the same language (same meanings) and who are fully informed about the non-linguistic facts. Could they still disagree about the claim in question? If yes, then the dispute is substantive. If not, then the dispute is verbal. But note: this step requires careful thought because it might be that the dispute is about the meaning itself (metalinguistic negotiation).
    - **Sufficient answer:**
      - If yes (they could still disagree), then the dispute is substantive. Verdict: "substantive".
      - If no (they would not disagree if they shared meanings and the facts), then the dispute is merely verbal. Verdict: "merely verbal".
      - If unclear, go to Step 5.

  **Step 5: Metalinguistic Negotiation Check (Plunkett and Sundell)**
  - **Question:** Is the dispute about which meaning we ought to use, rather than about the non-linguistic facts? (This is a metalinguistic negotiation.)
    - **How to check:** Look for evidence that the parties are arguing about how a term should be defined, often based on practical, normative, or theoretical considerations. For example, in the free will debate, one might argue that we should define "free will" in a way that preserves moral responsibility. The author might frame the dispute in these terms.
