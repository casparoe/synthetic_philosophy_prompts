      - If unclear, then it becomes a judgment call for the referee: is the dispute more about the non-linguistic facts or about the meaning? If the referee thinks it is about the meaning in a normative sense, then it is metalinguistic and substantive. If not, then it might be verbal. But we are stuck, so we return "cannot tell".

  **Step 6: Appeal to Quantifier Variance (Hirsch) for Ontological Disputes**
  - **Note:** This step is only for disputes that are explicitly about ontology (e.g., existence of composite objects, numbers, etc.). If the dispute is not ontological, skip to Step 7.
  - **Question:** Is the dispute best explained by the parties using different but equally legitimate quantifier meanings? (Hirsch: ontological disputes can be verbal because different quantifier meanings are equally good, and there is no fact of the matter about which is correct.)
    - **How to check:** Does the author argue that the parties are using different criteria for existence (e.g., one uses a more restrictive quantifier, the other a more inclusive one)? And does the author show that both are acceptable in their contexts? The referee must assess whether the dispute reduces to a choice of language without any underlying factual disagreement.
    - **Sufficient answer:**
      - If yes, then the dispute is merely verbal. Verdict: "merely verbal".
      - If no, then the dispute might be substantive. Go to Step 7.
      - If unclear, go to Step 7.

  **Step 7: Sider's Substantivity Question**
  - **Question:** Is the dispute about a joint in nature? (Sider: a dispute is substantive if it is about a fundamental structure of reality, not just about language.)
    - **How to check:** This is a judgment call. The referee must consider: does the dispute track a genuine, objective difference in the world? Or is it about how we choose to represent the world? The author might provide arguments for one view or the other.
    - **Sufficient answer:** This step is inherently a judgment call. The referee must decide:
      - If the dispute is about a fundamental structure (e.g., the fundamental laws of physics, the ultimate constituents of reality), then it is substantive.
      - If not, then it might be verbal or metalinguistic. But note: this step is difficult and may not be resolvable in an afternoon. If the referee can make a call, then:
          - Substantive: verdict "substantive"
          - Otherwise: verdict "merely verbal" or "cannot tell"
      - Given the time constraints, if the referee cannot decide, return "cannot tell".

  **Step 8: Final Judgment Call**
  - If the procedure has not yielded a verdict by Step 7, then the referee must make a judgment call. The referee should consider:
     - The burden of proof: the author is making a claim about the dispute being (or not being) merely verbal. Has the author met the burden?
     - The practical implications: even if the dispute is verbal, might it have practical consequences (e.g., in ethics, law, science) that make it worth having?
     - The depth of the disagreement: does it reflect a deeper normative or conceptual divide?

  Given the time constraints, the referee might have to return "cannot tell" if a judgment is too difficult.

