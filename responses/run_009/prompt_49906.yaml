  ### Decision Procedure for Assessing Merely Verbal Disputes
  This procedure distills tools from Chalmers, Sider, Hirsch, and Plunkett/Sundell into a step-by-step flowchart. It requires **2–4 hours per manuscript** and assumes you can access only the paper itself (no external literature). Verdicts are **"substantive," "merely verbal," "cannot tell,"** or **"judgment call"** with guidance. The procedure prioritizes efficiency by leveraging the author’s own characterization of the dispute.

  #### Procedure Flowchart
  **Step 0: Preprocess the Dispute**  
  - **Question:** Does the paper clearly identify:  
    (a) The specific dispute (e.g., "free will," "composition"),  
    (b) The parties involved (e.g., "compatibilists vs. incompatibilists"),  
    (c) The key term(s) in question (e.g., "free," "composite object")?  
  - **Sufficient answer:**  
    - **Yes** → Proceed to Step 1.  
    - **No** → Terminate with **"cannot tell"** (author fails to define the target).  

  **Step 1: Check Factual Agreement**  
  - **Question:** Does the author claim the parties *agree on all non-linguistic facts*? (e.g., physical facts, causal relations, observable phenomena). Ignore facts about language or ontology.  
  - **Sufficient answer:**  
    - **Yes** → Proceed to Step 2.  
    - **No** → Skip to Step 4 (dispute likely substantive).  
    - **Unclear** → Proceed to Step 2 but flag for review in Step 5.  
  - **Termination point:** If parties agree on all non-linguistic facts *and* no dispute exists → **"merely verbal"** (trivial case).  

  **Step 2: Test for Meaning Variance**  
  - **Question:** Does the author show the parties use key term(s) with **different meanings** (e.g., via divergent definitions, application conditions, or criteria)?  
  - **Sufficient answer:**  
    - **Yes** → Proceed to Step 3.  
    - **No** → Proceed to Step 4.  
    - **Unclear** → Proceed to Step 3 (infer variance if dispute persists despite factual agreement).  

  **Step 3: Apply Stipulation Test (Chalmers)**  
  - **Question:** If the parties stipulate a shared meaning for key term(s), **does the dispute resolve**?  
  - **Sufficient answer:**  
    - **Yes** → Verdict **"merely verbal"** (dispute dissolves under shared language).  
    - **No** → Proceed to Step 4.  
    - **Unclear** → Proceed to Step 4 (e.g., if one party rejects stipulation as "changing the subject").  
  - **Handles hard case (explicit stipulation treated as concession):** If rejection of stipulation implies deeper disagreement (e.g., "Your stipulation ignores the true meaning of 'free will'!"), this suggests **metalinguistic negotiation** → Proceed to Step 5.  

  **Step 4: Test for Substantive Residual Disagreement (Chalmers/Sider)**  
  - **Question:** Could parties with **shared meanings** and **full knowledge of non-linguistic facts** still disagree?  
  - **Sufficient answer:**  
    - **Yes** → Verdict **"substantive"** (dispute tracks world-based disagreement).  
    - **No** → Verdict **"merely verbal"** (dispute exists only due to meaning variance).  
    - **Unclear** → Proceed to Step 5.  
  - **Handles hard case (same words, substantive disagreement):** If disagreement persists under shared meanings (e.g., "We both mean *control* by 'free,' but disagree on whether determinism allows it"), this indicates a substantive dispute → **"substantive"**.  

  **Step 5: Check for Metalinguistic Negotiation (Plunkett/Sundell)**  
  - **Question:** Is the dispute about **which concept/meaning we *ought* to use** (e.g., based on practical, normative, or theoretical interests)?  
  - **Sufficient answer:**  
    - **Yes** → **Judgment call** required (see guidance below).  
    - **No** → Verdict **"cannot tell"**.  
    - **Unclear** → Verdict **"cannot tell"**.  
  - **Judgment call guidance:**  
    - If the dispute centers on *normative/practical stakes* (e.g., "We should define 'free will' to preserve moral responsibility"), treat as **"substantive"** (it’s a negotiation over conceptual ethics).  
    - If no clear stakes exist, default to **"merely verbal"**.  

  **Step 6: Ontology-Specific Check (Hirsch/Sider)**  
  - **Activation condition:** Only if the dispute is **ontological** (e.g., about existence, composition, or quantifiers).  
  - **Question:** Does the author show the dispute reduces to **quantifier variance** (e.g., "exists" has multiple equally legitimate meanings) without tracking a "joint in nature" (Sider)?  
  - **Sufficient answer:**  
    - **Yes** → Verdict **"merely verbal"**.  
    - **No** → Proceed to Step 4/5.  
    - **Unclear** → Verdict **"cannot tell"**.  

  **Final Termination**  
  - If no verdict is reached by Step 6 → **"cannot tell"**.  
  - Verdicts are mutually exclusive; procedure terminates at first definitive answer.  

  ---

  ### Application to Manuscripts
  **Manuscript 1: Mereological Composition Debate**  
  - **Step 0:** Dispute clear (composition); parties (universalists vs. nihilists); key term ("composite object"). → Proceed.  
  - **Step 1:** Author claims parties agree on non-linguistic facts (matter distribution). → **Yes**.  
  - **Step 2:** Author shows meaning variance (disagreement on "what to quantify over"). → **Yes**.  
  - **Step 3:** Stipulation test: If "composite object" is defined permissively/restrictively, dispute resolves. → **Yes**.  
  - **Verdict: Merely verbal** (terminates at Step 3).  

  **Manuscript 2: Free Will Compatibility Debate**  
  - **Step 0:** Dispute clear (free will); parties (compatibilists vs. incompatibilists); key term ("free"). → Proceed.  
  - **Step 1:** Author claims parties *disagree* on non-linguistic facts ("whether determinism undermines desert-entailing control"). → **No** → Skip to Step 4.  
  - **Step 4:** Residual disagreement test: With shared meaning of "free" (= desert-entailing control), parties could still disagree on the *fact* of whether determinism undermines it. → **Yes**.  
  - **Verdict: Substantive** (terminates at Step 4).  

  **Manuscript 3: Species as Individuals vs. Classes**  
  - **Step 0:** Dispute clear (species ontology); parties (individualists vs. classists); key term ("species"). → Proceed.  
  - **Step 1:** Author claims parties agree on non-linguistic facts (biological data). → **Yes**.  
  - **Step 2:** Author shows meaning variance ("individual" vs. "class" interpretations). → **Yes**.  
  - **Step 3:** Stipulation test: If "species" is defined as individual/class, dispute resolves. → **Yes**.  
  - **Verdict: Merely verbal** (terminates at Step 3).  

  **Which Verdict You Will Not Like and Why**  
  - Your view: Sympathetic to composition = verbal (Manuscript 1 ✅), skeptical of free will ≠ verbal (Manuscript 2 ❌).  
  - **Problematic verdict: Manuscript 2 → "substantive"** (against your skepticism).  
  - **Why the procedure returns it:**  
    The author successfully frames the disagreement as factual (Step 1: parties disagree on whether determinism *undermines control*). The procedure treats this as a non-linguistic fact (a claim about the world), not a semantic issue. Thus, Step 4 overrides semantic considerations. Your skepticism likely stems from viewing "desert-entailing control" as language-dependent, but the procedure takes the author’s characterization at face value without deeper metaphysical analysis.  

  ---

  ### Known Failure Modes
  1. **False Negatives for Verbal Disputes:**  
     - **Misfire:** If parties *implicitly* disagree on non-linguistic facts but the author misses it (e.g., Manuscript 2’s "control" might hide semantic differences), the procedure may falsely return "substantive."  
     - **Cause:** Reliance on author’s framing (Step 1).  
     - **Mitigation:** Flag for judgment if dispute feels "off" (e.g., control debates often involve meaning variance).  

  2. **False Positives for Verbal Disputes:**  
     - **Misfire:** Treats metalinguistic negotiations (Step 5) as "substantive," but if normative stakes are trivial, this may overstate substantivity.  
     - **Cause:** Practical/normative judgments are subjective.  
     - **Mitigation:** In Step 5, ask: "Does the negotiation have real-world implications?" (e.g., legal or ethical consequences).  

  3. **What the Procedure Cannot Settle:**  
     - **Should we care?** Whether a verbal dispute is publishable (e.g., if it clarifies concepts or has rhetorical value) is outside the scope. This is an editorial judgment.  
     - **Deep Metaontology:** If meanings are interest-relative (e.g., pragmatism) or indeterminate (e.g., Quinean skepticism), the verbal/substantive distinction collapses. The procedure assumes meanings are discoverable.  
     - **Borderline Ontology:** Disputes about "joints in nature" (Sider) may be indeterminate; procedure defaults to Step 6, but this relies on author’s argument strength.  

  4. **Judgment Calls Dressed as Tests:**  
     - **Step 1 (Factual Agreement):** Requires judging what counts as "non-linguistic facts." Appeals to "fundamental" facts (e.g., Sider’s structure) are not operationalized.  
     - **Step 5 (Metalinguistic Negotiation):** Deciding "ought" (e.g., "We *should* use this meaning") hinges on subjective assessment of normative stakes.  
     - **Step 4 (Residual Disagreement):** The "could" in "could parties still disagree?" is modal and intuition-based.  

  5. **Time Constraints:**  
     - Cannot resolve disputes where key evidence is outside the paper (e.g., if author misrepresents a party’s view).  
     - Heavy reliance on author’s accuracy; minimal error-checking.  

  **Conclusion:** This procedure optimizes for speed by leveraging the author’s account and Chalmers’ core tests. It works best for clear-cut cases (e.g., Manuscripts 1 and 3) but struggles with disputes blending language and world (e.g., Manuscript 2). When in doubt, it errs toward **"cannot tell"** to avoid overcommitment. For your cases, it identifies Manuscript 2 as "substantive" due to the author’s framing of control as a non-linguistic fact—a verdict you may reject if you see "desert-entailing control" as conceptually contingent.
