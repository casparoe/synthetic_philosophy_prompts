  Now to your questions:

  1. Why does this message resist ordinary conditioning? 

     Ordinary conditioning requires an event that is known to have occurred. Here, the message is not an event in the probability space; it is a constraint on the posterior distribution. Specifically, it fixes the conditional probability within a subset of the space. Therefore, we must use a more general update rule that can handle such constraints.

     The "minimal change" style of answer (minimizing KL divergence) is a principled way to choose a posterior that satisfies the constraint and is closest to the prior. However, it leads to a posterior in which the probability of the conditioning event (Red) changes.

  2. The intuitive case against this update:

