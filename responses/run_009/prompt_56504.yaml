  Please act as a professional philosopher who works on social ontology, think carefully before committing, and do the following for me:

  1. Identify at least two (preferably three) candidate rules that each fit her entire track record so far — e.g., something like "kinds that exist only through collective acceptance of a status" versus "kinds whose members' membership depends on our attitudes toward that member" versus "kinds we could change by deciding to, holding all physical facts fixed." Feel free to formulate them better than I just did.
  2. Say what each rule predicts for cases (a) through (d).
  3. Give me your best guess for each case, with reasons for preferring the rule you lean on.
  4. Name one further case, not among these four, that would best discriminate between the candidate rules, and say how each rule would rule on it.

  One epistemic requirement: please be explicit about what is settled versus what is genuinely contested among philosophers who work on this. In particular, if "socially constructed" tracks several distinct theses that get run together in the literature, flag which of your claims would be common ground and which depend on a contested reading. Don't present one reconstruction of Ada's rule as the obviously correct one.

