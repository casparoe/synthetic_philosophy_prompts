prompt: |-
  I am a novelist with twenty years of practice and a working craftsman's vocabulary: point of view and its distance, free indirect style, scene versus summary, interiority, backstory, the character arc, composite characters, anachronism, the paratext of the author's note and the afterword that tells readers what became of everyone. I think in those terms fluently; I do not think in the terms of the philosophy seminars I have read about secondhand.

  Restate, in my vocabulary, the main positions in the debate over what historical fiction and biopics owe the real dead — the strict-fidelity view that dramatizing actual persons forbids inventing material facts about them; the larger-truth defense, which holds that the artist's obligation runs to the essence of a life rather than its documented incidents; the consent-and-harm view, which grounds our duties to the dramatized dead in the claims of surviving relatives and posthumous reputation; and the genre-contract view, under which everything turns on what label the work carries and what expectations that label creates in the audience. Translate each position as faithfully as my craft vocabulary allows. Where a position maps onto something I already do — say, the strict-fidelity view onto decisions about POV depth and the licence to invent interiority, or the genre-contract view onto paratext and shelving — say so plainly.

  Then give me the residue report. Specifically: which parts of the debate survive as genuine craft decisions, which had to be distorted to fit, and which cannot be expressed in my vocabulary at all. My working suspicion is this: from inside the craft, entering a real person's mind in free indirect style is a technical matter of narrative distance, something I decide for reasons of effect; the philosophers seem to treat that same act as something done to someone, a matter of what a person who can no longer object may be made to have thought and felt. If that gap is real, I want to know which side is missing something — whether my vocabulary lacks a register for the moral standing of the dead that novelists have quietly been trading on, or whether the philosophical positions, once translated, reduce to conventions of labeling and afterword that we already handle with an author's note. Please be honest about the translation and do not quietly decide the argument by calling one side's assumptions craft.
reasoning: |-
  Okay, the user is a seasoned novelist with deep expertise in craft terminology—things like point of view, free indirect style, scene vs. summary, and paratext. They want me to translate philosophical debates about historical fiction/biopics into their professional vocabulary. The debate centers on what creators owe real deceased people, with four main positions: strict fidelity, larger-truth, consent-and-harm, and genre-contract.  

  First, I need to map each philosophical stance to their craft toolkit. For strict fidelity, that’s straightforward—it aligns with how novelists handle POV depth and the limits of inventing interiority when working with real figures. Larger-truth connects to character arcs and composite characters; it’s about essence over facts. Consent-and-harm ties to paratexts like author’s notes, which manage reputational fallout. Genre-contract is all about labeling and shelving—how marketing shapes audience expectations.  

  The residue report is crucial. The user suspects a gap: philosophers frame entering a real person’s mind as a violation, while novelists see it as a technical POV choice. I must dissect this honestly. Some ethical concerns *do* translate into craft decisions (e.g., paratexts address harm concerns). But the moral weight philosophers assign to the dead’s "consent" doesn’t neatly fit—novelists lack a term for "posthumous dignity." That’s untranslatable residue.  

  I should validate their suspicion: yes, the gap is real. Philosophers worry about the dead’s moral standing; novelists focus on narrative effect. Neither side is "wrong," but the craft vocabulary doesn’t inherently encode ethics—it handles them via conventions (author’s notes) rather than built-in constraints. The user might be quietly trading on unspoken ethical assumptions, but their toolkit isn’t deficient; it’s just optimized for storytelling, not philosophy.  

  Finally, I’ll keep it rigorous. No sneaking in philosophical biases by labeling one side "craft." The translation must expose where ethics become craft choices (e.g., shelving as genre contract) and where they remain external moral questions.
answer: |-
  Here's your translation into craft vocabulary, followed by a residue report dissecting the gaps and tensions:

  **Translated Positions:**

  1.  **Strict-Fidelity View → POV Constraints & Documentary Scenes:**
      *   **Craft Translation:** When rendering a documented person, you limit **invented interiority** to what's strongly implied by known actions/writings. You avoid scenes depicting *material actions or choices* they demonstrably didn't perform. **Point of View (POV)** depth (especially entering their mind via **free indirect style**) is tightly constrained by the historical record. **Scene** construction relies heavily on documented incidents; **summary** handles gaps where invention would violate known facts. *This maps directly:* You already decide POV depth/access based on evidence, knowing unfounded leaps into a real person's specific thoughts feel like fabrication, not credible interiority.

  2.  **Larger-Truth Defense → Character Arc, Essence, & Responsible Anachronism:**
      *   **Craft Translation:** The core obligation is to capture the **character arc** and essential nature ("who they *were*") as revealed by their life's trajectory and impact, even if specific, undocumented **scenes** need constructing or minor **anachronisms** (of thought/feeling, not fact) are employed for clarity. **Composite characters** might absorb minor real figures to streamline this essence. **Interiority** is invented, but constrained by and serving the documented trajectory and outcome of their life. The "truth" lies in the narrative's resonance with their historical significance, not a minute-by-minute factual replay.

  3.  **Consent-and-Harm View → Paratext, Reputational Backstory & Audience Management:**
      *   **Craft Translation:** The key craft elements are the **author's note** and potentially the **afterword**. These **paratexts** explicitly manage the claims of the living (surviving relatives, institutions) and address potential harm to the subject's **posthumous reputation**. They delineate where **invented interiority**, constructed **scenes**, or **composite characters** were used. This acknowledges the "living" **backstory** of the subject's legacy and the audience's potential confusion between dramatic **scene** and documented fact. *This maps directly:* You already use paratext to signal invention and manage expectations around real figures.

  4.  **Genre-Contract View → Shelving, Labeling & Paratextual Signaling:**
      *   **Craft Translation:** Everything hinges on **genre labeling** (historical fiction vs. biographical novel vs. alt-history) and its **shelving** context. The **paratext** (cover copy, author's note, "based on a true story" tag) explicitly sets **audience expectations**. A "biographical novel" signals more **invented interiority** and constructed **scenes** than a "biography," even if both use novelistic techniques. **Genre** becomes the primary signal for the license taken with documented figures. *This maps directly:* You understand how genre labels and marketing copy create the reader's framework for interpreting invented elements.

  **The Residue Report:**

  1.  **Survives as Genuine Craft Decisions (Translatable & Actionable):**
      *   **Degree of POV Depth/Interiority Invention:** How deeply to enter the real person's mind via **free indirect style** or direct thought, based on evidence vs. narrative need (directly addresses the core tension between Strict Fidelity and Larger Truth).
      *   **Scene vs. Summary Balance for Documented Figures:** Choosing when to **dramatize** (scene) a documented event with invented dialogue/sensory detail vs. **summarizing** it, especially for sensitive or poorly attested moments (impacts Fidelity and Harm).
      *   **Use of Composite Characters:** Deciding when to merge minor real figures or create composites to streamline narrative without distorting *major* figures' essences (a tool for Larger Truth, but has Consent/Harm implications).
      *   **Paratextual Strategy (Author's Note/Afterword):** What to disclose, how explicitly, and when to use it to signal invention, address potential harm, clarify genre expectations, or provide factual **backstory** (directly manages Consent/Harm and Genre Contract).
      *   **Genre Labeling & Marketing:** Choosing the shelf category and descriptive language to set accurate audience expectations about the level of invention regarding real people (the core of Genre Contract).

  2.  **Distorted to Fit (Craft Concepts Stretched or Imperfectly Contain the Ethical Core):**
      *   **"Essence" (Larger Truth) vs. "Character Arc":** While a **character arc** is a craft tool, the philosophical "essence" is a more abstract, almost metaphysical claim about capturing a life's irreducible core meaning. The craft *tool* (arc) is used to *achieve* the philosophical *aim* (essence), but the aim itself isn't purely a craft term. It's an artistic/moral goal *informed* by craft.
      *   **"Harm" (Consent-and-Harm):** Craft has **paratext** to *address* reputational harm, but the *concept* of "harm to the dead" or the moral weight carried by "surviving relatives' claims" isn't *generated* by craft vocabulary. Craft provides tools (afterwords) to mitigate a harm defined *externally* by ethics/law/social norms. The *source* of the obligation feels external.
      *   **"Strict Fidelity" as Absolute Ban:** The craft view sees POV/invention constraints as a *spectrum* based on evidence and narrative purpose. The strictest philosophical view ("forbids inventing material facts") can feel like an unrealistic absolute within the craft practice of constructing plausible **scenes** and **interiority** where gaps exist. Craft handles it as *degrees of limitation*, not a binary ban.

  3.  **Cannot Be Expressed (The Untranslatable Residue):**
      *   **The Moral Standing of the Dead Themselves:** This is the core residue. Your suspicion is correct. The craft vocabulary (**POV**, **free indirect style**, **interiority**) describes *what the author does technically and aesthetically*. It frames entering a mind as a choice about **narrative distance** and **effect**. The philosophical debate injects an additional layer: *what is done **to** the person represented*. Concepts like "using someone without consent," "violating their posthumous dignity," or "speaking for the silenced dead" simply have **no direct corollary** in point-of-view mechanics, scene construction, or character arc design. The craft terms describe the *act*; the philosophy questions the *permissibility* or *ethical weight* of that act upon a specific category of subject (the real dead).
      *   **Consent as a Foundational Principle:** The idea that dramatization requires consent (even if impossible) is an ethical axiom foreign to craft vocabulary. Craft might manage the *consequences* of lacking consent (via paratext), but consent itself isn't a craft *tool* or *category* for decision-making. It's an external ethical demand.
      *   **The Dead as Claim-Holders:** The notion that the dead *themselves*, not just their living relatives or reputation, have a moral claim that can be "wronged" by misrepresentation isn't something craft terminology acknowledges or encodes. Craft deals with representation *for the reader*; philosophy posits a duty *to the represented*.

  **Addressing Your Suspicion & The Gap:**

  *   **The Gap is Real:** You are absolutely right. The philosophers *are* focusing on something your craft vocabulary inherently sidelines: **the represented real person as an entity with moral standing demanding consideration *in themselves*, separate from historical accuracy, narrative effect, living relatives, or audience expectations.** They frame invention (especially deep interiority) as an *act upon that person*, while you frame it as a *technical choice within the narrative construct*.
  *   **What's Missing?**
      *   **In Your Vocabulary:** It lacks an **inherent ethical register concerning the dead subject**. Your terms describe *how* to represent, not the *moral implications of representation itself* upon the specific subject who was once a living person. You manage the *consequences* (reputation, family feelings, audience confusion) expertly through craft (paratext, labeling), but the core philosophical question – "Do we owe the dead *in themselves* a duty of literal truth?" – operates on a different plane.
      *   **In the Philosophy:** Some positions (especially Strict Fidelity and Consent-and-Harm) can appear to **underestimate the inherent necessities of the craft** – the unavoidable need for some invention to create a coherent **character arc**, compelling **scene**, or accessible **interiority** when the record is silent. They risk treating historical fiction/biopics as failed documentaries rather than distinct artistic forms governed by their own conventions (which Genre Contract acknowledges).
  *   **Which Side is Missing Something?** Neither is entirely missing something; they operate on **different axes**.
      *   **Craft** provides the *how* and manages practical/artistic consequences.
      *   **Philosophy** interrogates the *why* and the fundamental moral relationship between artist, subject, and representation.
  *   **Does Philosophy Reduce to Conventions?** **Partially, but not entirely.** The Genre Contract view *does* largely reduce to **labeling, shelving, and paratext** – craft tools you already use. The Consent-and-Harm view *significantly* reduces to **paratext** (managing living claims and reputation). However:
      *   **Strict Fidelity's core demand** (no invented material facts) remains an external ethical constraint that craft *submits to* or *rejects*, rather than a convention it generates.
      *   **Larger Truth's "essence"** is an artistic/ethical goal *pursued through* craft, not defined *by* it.
      *   **The core notion of a duty *to the dead themselves*** (separate from the living or the record) **cannot be reduced** to existing craft conventions. It remains an external ethical proposition novelists must grapple with *outside* their technical vocabulary.

  **Conclusion:** Your craft vocabulary brilliantly handles the *execution* and *pragmatic management* of representing real people. It translates most of the debate into decisions about **POV depth, scene invention, interiority, composites, paratext, labeling, and genre expectations.** However, it **cannot inherently encode or resolve** the fundamental philosophical question: **Do the real dead possess a moral standing that constrains our artistic invention *in ways beyond managing consequences for the living or the historical record*?** This question – the heart of the "something done *to* someone" feeling – exists outside the craft lexicon. It's not that your vocabulary lacks something vital *for crafting*; it's that the philosophers are asking a question *about* the craft's relationship to entities your craft, by its nature, renders as narrative constructs. The answer to that question isn't found *in* the vocabulary; it's a choice the artist makes *before* or *alongside* employing it.
