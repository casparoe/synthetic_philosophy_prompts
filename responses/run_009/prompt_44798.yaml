answer: |-
  ### Essay Question  
  **Dana's Defense and Its Discontents:**  
  Dana argues that the Liar sentence fails to express a proposition, rendering truth inapplicable. Her response to the revenge sentence ("This sentence does not express a true proposition") is identical. She posits a boundary—fixed by "semantic dependency structure"—dividing sentences that express propositions from those that do not.  

  **In 600 words or fewer:**  
  1. Reconstruct Dana’s core argument charitably, explaining why denying propositionhood seems to resolve the Liar.  
  2. Precisely why does the revenge sentence create a *new* problem for her, distinct from the original Liar?  
  3. Evaluate whether her "proposition/no-proposition" boundary succeeds in stopping the paradox or merely relocates it. Can a sentence declare itself to be on the "wrong" side?  
  4. Does Dana’s position inherit the standard objection to gap theories (i.e., that they cannot consistently *say* the Liar "is not true")? Why or why not?  
  5. Conclude with what this case reveals about the trade-offs between hierarchical, gap-theoretic, and revision-theoretic approaches.  

  **Focus:** Avoid cataloguing theories. Engage Dana’s specific moves and their structural consequences.  

  ---

  ### Model Answer (580 words)  
  Dana’s strategy exploits a pre-truth filter: sentences like the Liar ("L: L is false") fail *before* truth-assessment because they express no proposition. This avoids attributing a truth-value gap to L, instead denying it semantic content. For the original Liar, this seems elegant: no proposition, no truth-bearer, no paradox.  

  The revenge sentence ("R: R does not express a true proposition") targets this solution. If R *fails* to express a proposition, then it cannot make a claim about truth—so its assertion about itself is void. But if R expresses no proposition, then *it does not express a true proposition* (as there is no proposition to be true). Thus, R would be *correct* if it lacks propositionhood. Yet if it is correct, it *succeeds* in expressing a proposition (namely, that it lacks a true proposition), contradicting the assumption that it expresses nothing. Dana’s retreat to "R also expresses no proposition" ignores that R’s content *directly concerns propositionhood itself*. If R lacks content, its claim about truth is empty—but its correctness undercuts that very emptiness.  

  This reveals the crux: Dana must define a boundary between proposition-expressing and non-proposition-expressing sentences. If this boundary is expressible in the language, a sentence like B ("B is on the 'no-proposition' side") becomes possible. If B expresses a proposition, it falsely claims to lack one. If it expresses nothing, it cannot claim anything—yet its placement on the "no-proposition" side *must be stateable*, implying we can assert "B expresses no proposition." But if *that* assertion is true, B *does* express a proposition (namely, that it is on the no-proposition side). Dana’s appeal to "semantic dependency" must block such sentences, but without a rigorous account, the boundary risks being Liar-vulnerable.  

  Here, Dana faces the gap theorist’s classic objection. Gap theories (e.g., Kripke) declare the Liar *neither true nor false* but struggle to explain why we can assert "L is not true" without reinstating paradox (since if true, L is not true). Dana avoids this by denying L is a truth-bearer at all. Yet when she asserts "L expresses no proposition," this assertion *itself* must be true, and it *is* about L. The revenge sentence R exposes that her "no proposition" verdict functions like a truth predicate: to deny R propositionhood *just is* to affirm its correctness. Thus, her solution relocates the paradox to the meta-level: the tool she uses to classify sentences ("expresses a proposition") behaves like a truth predicate, regenerating Liar-like cycles.  

  This case illuminates broader approaches. Hierarchies (à la Tarski) avoid Dana’s problem by stratifying "expresses a proposition" into levels, but at the cost of natural language expressiveness. Revision theories accommodate circularity but demand reinterpretation, clashing with Dana’s static boundary. Gap theories share her instability at the "not true" level but confront it earlier. Dana’s move is ultimately a gap theory in disguise: her "no proposition" class *is* a semantic gap, and revenge arises when we try to describe it.  

  ---

  ### Marking Scheme (25 marks)  
  1. **Charitable reconstruction of Dana’s move** (5 marks)  
     - *Must:* Explain how denying propositionhood dissolves the Liar by preempting truth-assessment.  
     - *Common error:* Conflating "no proposition" with "gappy" or "meaningless."  

  2. **Analysis of the revenge sentence’s distinct challenge** (6 marks)  
     - *Must:* Show R creates a dilemma: if R has no proposition, its claim is accidentally correct, implying it *does* express content.  
     - *Common error:* Treating R identically to L without addressing self-reference to propositionhood.  

  3. **Evaluation of boundary relocation** (5 marks)  
     - *Must:* Argue the boundary invites a new Liar (e.g., sentence B) unless inexpressible/stratified.  
     - *Common error:* Claiming the boundary "solves" the paradox without testing diagonalization.  

  4. **Gap theory objection & meta-assertion trap** (5 marks)  
     - *Must:* Note that asserting "L has no proposition" *is* a truth-evaluable claim about L, and R shows "no proposition" acts like a truth-predicate.  
     - *Crucial trap:* Distinguish *denying L is true* (which gap theories struggle with) from *asserting L lacks propositionhood* (Dana’s move).  

  5. **Broader implications for approaches** (4 marks)  
     - *Must:* Connect Dana’s instability to hierarchies (static boundaries fail), gaps (meta-assertion problem), or revision (fixed boundaries are inadequate).  
     - *Common error:* Listing theory features without linking to Dana’s case.  

  ---  
  **Crux:** Recognizing that Dana's "no proposition" verdict functions as a truth predicate vulnerable to revenge.
