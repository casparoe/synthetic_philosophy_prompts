prompt: |-
  I'm a retired biochemist (40 years in the lab, so I'm used to wanting error bars on everything) and lately I've been reading philosophy instead of doing real work. Here's my situation: I just updated my advance directive to refuse antibiotics if I ever have advanced dementia. My daughter says that by that point the person who signed the paper is basically gone, and the fellow lying in the bed who seems fairly content day to day should get a say in what happens to him. Give me your actual credence that the advance directive should still carry decisive authority in that scenario, and decompose it for me: a rough probability for whether personal identity over time is psychological continuity (in which case the signer and the demented man aren't really the same person anyway), for whether autonomy includes the right to bind your future self against his welfare, for whether a contented later self's current interests can outweigh earlier instructions, plus any other terms you think belong. Then tell me which term your number is most sensitive to and what argument or evidence would move it the most. Also, please answer in American English -- definately no British spellings, my daughter teases me enough as it is.
