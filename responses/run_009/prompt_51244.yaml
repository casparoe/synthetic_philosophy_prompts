answer: |-
  Your diagnosis is perceptive and largely correct—the core dispute *is* fundamentally metasemantic, rooted in divergent conceptions of **what fixes reference and what constitutes meaning**. The "semantic" vs. "epistemic" labels obscure a deeper disagreement about **whether understanding a term requires epistemic access to its reference-fixing conditions**. Below, I’ll diagnose the impasse, engage with key cases, assess prospects for progress, and flag uncertainties.

  ---

  ### **Diagnosis: The Metasemantic Fault Line**
  1. **The Core Conflict (95% Confidence)**  
     - **Two-Dimensionalists (Chalmers, Jackson)**: Treat the "epistemic intension" as *semantically constitutive*. A speaker’s ability to evaluate scenarios a priori reflects their grasp of *how reference is fixed*—e.g., "water" refers to the clear, drinkable liquid *in the actual world*. Understanding *is* this epistemic capacity.  
     - **Objectors (Soames, Stalnaker)**: Demand a separation between semantics and epistemology. Reference is fixed by external factors (causal history, natural kinds), independently of a speaker’s access to those factors. The "epistemic intension" tracks *how speakers discover* what they refer to, not meaning itself.  

     **Why it’s metasemantic**:  
     - 2Dists see meaning as **descriptive roles** (e.g., "water" = "the dominant clear liquid in our environment"), where reference-fixing is internal to competence.  
     - Objectors see meaning as **direct reference** plus causal-historical facts, where competence requires no descriptive knowledge.  

     Your hypothesis is correct: counterexamples assume rival metasemantic premises, making them question-begging.

  2. **Engagement with Key Cases (85% Confidence)**  
     - **Ignorant Speaker (e.g., uses "water" without knowing it’s H₂O)**:  
       - *2Dist*: The speaker still has the primary intension ("liquid with certain superficial properties"). Competence isn’t undermined.  
       - *Objector*: Competence requires no such intension—only causal connection to H₂O. Ignorance is irrelevant to semantics.  
       → *Impasse*: 2Dists define "competence" via epistemic access; objectors via causal linkage.  

     - **"Water" for H₂O/XYZ Mixture**:  
       - *2Dist*: Primary intension picks out whatever plays the "water role" (e.g., hydration) in a scenario. If the mixture does, it’s water.  
       - *Objector* (Soames): "Water" rigidly designates H₂O. If Earth’s liquid were a mixture, we’d refer to it *as H₂O* mistakenly—semantics isn’t hostage to epistemic luck.  
       → *Impasse*: Is meaning tied to roles (epistemic) or microphysical essences (metaphysical)?  

     - **Twin-Earthling Mistaken About Past Exposure**:  
       - *2Dist*: Their primary intension for "water" targets XYZ (their actual environment), so their belief "I’ve had H₂O" is false.  
       - *Objector* (Stalnaker): The Twin-Earthling’s word "water" refers to XYZ, but their *belief* about their history is false non-semantically. Primary intensions conflate belief content with meaning.  
       → *Impasse*: Are epistemic intensions part of content, or mere psychological heuristics?

  3. **Is There a Substantive Underlying Dispute? (80% Confidence)**  
     Yes—but it’s about **whether meaning supervenes on internal cognitive states**:  
     - **Testable Claim**: *A priori scrutability* (Chalmers). Can all truths (e.g., phenomenal facts) be deduced a priori from a complete physical description *under canonical concepts*?  
       - *Evidence for*: Conceptual analysis (e.g., "pain" as "the state causing avoidance").  
       - *Evidence against*: Kripkean a posteriori necessities (e.g., "heat is molecular motion") show concepts don’t reveal essences a priori.  
     - **What’s Not Resolvable**: Whether scrutability is semantic or epistemic. Objectors concede primary intensions track *rational inference* but deny they reflect *meaning*.  

  ---

  ### **Paths to Progress (70% Confidence)**  
  1. **Reframe Physicalism Without 2D Semantics**:  
     - Shift to **phenomenal concepts** (e.g., Loar, Papineau): Explain epistemic gaps via *how* we conceive consciousness, not modal semantics.  
     - *Pros*: Bypasses metasemantic disputes; *Cons*: May not satisfy 2Dists’ explanatory goals.  

  2. **Isolate the Metasemantic Commitment**:  
     - Force both sides to answer: **"What minimal competence does a speaker need to refer to water?"**  
       - If objectors concede that competence requires *some* epistemic access (e.g., distinguishing water from syrup), 2Dists gain ground.  
       - If 2Dists admit external factors override descriptive errors (e.g., misidentifying water as XYZ), objectors gain ground.  

  3. **Empirical Linguistics**:  
     - Study how reference is fixed in **language acquisition** or **semantic change**.  
     - *Example*: If children learn "water" causally (pointing) without descriptive roles, objectors win; if via functional roles, 2Dists win.  
     - *Current evidence*: Mixed (e.g., "water" is early-learned via ostension, but kind terms like "gold" involve descriptions).  

  4. **Accept Intuitional Bedrock (Pessimistic View)**:  
     - The dispute reduces to **competing intuitions about "meaning"** (e.g., Burge’s arthritis case vs. descriptivist thought experiments).  
     - Progress would require showing one view better explains *linguistic practice* overall—e.g., ambiguity, communication, or conceptual change.  

  ---

  ### **Weakest Point in the Diagnosis (60% Confidence)**  
  **Claim**: *Objectors fundamentally reject any constitutive link between epistemic access and semantics.*  
  - **Why uncertain**: Stalnaker grants that diagonal intensions have *pragmatic* value in modeling communication. Soames concedes that reference-fixing descriptions exist (though not as meanings).  
  - **What Would Undermine It**: If objectors accepted that primary intensions capture a *minimal semantic core* (e.g., for incomplete understanding), 2D semantics could be reframed as complementary.  
  - **Evidence Needed**:  
    - Does Stalnaker’s "diagonalization" ever converge with 2D primary intensions?  
    - Can a hybrid view (e.g., Hawthorne’s) satisfy both sides?  

  ---

  ### **Conclusion**  
  Your hypothesis stands: the debate is a **metasemantic proxy war** where "semantics" is defined differently by each camp. The substantive sub-question—**whether a priori scrutability holds**—remains open but is obscured by foundational disagreements. Progress is likeliest by:  
  1. **Empirically testing scrutability** (e.g., can ideal reasoning bridge physical-phenomenal gaps?), or  
  2. **Decoupling physicalism from semantics** (e.g., via cognitive science).  

  Absent this, the dispute will persist as a clash of intuitions—fruitful for clarifying commitments but unlikely to resolve. **Confidence in overall diagnosis**: 85% (metasemantic core), 70% (paths to progress), 50% (pessimism about resolution).

  > "The 2D framework is a tool for exposing metasemantic commitments, not settling them. Its value lies in revealing why the mind-body problem *feels* unresolved—not in solving it."
