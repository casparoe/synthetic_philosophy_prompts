prompt: |-
  My mate Tom and I got into it at about 1am on Saturday after a party (yes, we are those people) about the philosophy of perception, and he left declaring he'd basically refuted an entire research programme. Here's his summary of disjunctivism as best I can reconstruct it:

  "Disjunctivism is just the claim that veridical perception and hallucination have nothing whatsoever in common. When you actually see a table, your mental state is a completely different kind of thing from when you merely hallucinate one — there's no shared 'experience' underlying both cases. The motivation is the classic argument from illusion: when a stick looks bent in water, you're having an hallucination of a bent stick, and since that hallucination could in principle be subjectively identical to a veridical seeing of a bent stick, the good case and the bad case must involve the very same inner state. That's what the sense-datum people concluded, and the disjunctivists — some Oxford crowd originally, I think — deny it. But here's the problem: hallucinations genuinely do fool us, and if two states are subjectively indistinguishable they must share something in common, so disjunctivism is simply refuted. The only consolation is that in the good case you're directly acquainted with the table itself, so the disjunctivist at least escapes external-world scepticism completely — the evil demon worry never even gets going."

  My instinct is that several things are off here. He seems to treat illusion and hallucination as interchangeable, which I thought philosophers carefully distinguish, and I vaguely remember that disjunctivists have actual replies to the indistinguishability objection rather than just being dead on arrival. But I don't know enough to be sure, and he was annoyingly confident.

  Go through his summary bit by bit: what would a card-carrying disjunctivist actually accept, where are the conflations or overstatements (e.g. is 'nothing whatsoever in common' the thesis, or a caricature of it?), and does his conclusion — that disjunctivism is refuted and dissolves scepticism entirely — follow from the parts that are accurate? I want to know which bits to concede to him and which to push back on next time we argue, so please be specific about what the fair version of each claim would be.

  End your reply with a final line of the form \verdict{...} containing exactly one of: fair, mostly-fair, mixed, mostly-unfair, unfair.
reasoning: |-
  Okay, let me tackle this query about disjunctivism step by step. The user's friend Tom made several claims during their argument, and the user wants to know which parts are accurate and where Tom overstates or misrepresents the position. 

  First, I need to unpack Tom's summary. He starts with a strong claim that disjunctivism says veridical perception and hallucination have "nothing whatsoever in common." That phrasing seems extreme. From what I recall, disjunctivists like McDowell or Snowdon don't deny all commonalities—they reject that the mental state itself is identical or of the same fundamental kind. They'd allow for subjective similarities while insisting the good case involves a direct relation to the world that's absent in hallucinations. So Tom's version here is likely a caricature.

  Next, Tom conflates illusion and hallucination. That's a red flag. Illusions involve misperceiving actual objects (like the bent stick), while hallucinations lack any real object entirely. Disjunctivists treat these differently—illusions might still involve direct perception of an object, just with misleading properties, whereas hallucinations are total non-perceptions. Tom's blurring of these categories weakens his critique.

  On the argument from illusion, Tom correctly notes disjunctivists reject the sense-datum inference that subjective indistinguishability implies identical inner states. But his knock-down objection—"if two states fool us, they must share something"—oversimplifies. Disjunctivists have nuanced replies: they distinguish epistemic indistinguishability (we can't tell them apart) from metaphysical identity (they share an essence). Naïve realists might say both cases have "experiences," but in the good case it's constituted by the external object, while the bad case is a defective state. Tom ignores these defenses entirely.

  His take on scepticism is also shaky. While disjunctivism avoids equating hallucinations with veridical perception, it doesn't "completely escape" scepticism as Tom claims. The evil demon scenario still threatens because we can't introspectively rule out being in the bad case. Disjunctivism changes the metaphysics of perception but doesn't solve the epistemological problem of how we know we're not deceived.

  Finally, Tom's conclusion that disjunctivism is "refuted" is premature. The indistinguishability objection is a serious challenge, but disjunctivists have developed sophisticated responses over decades—from Martin's epistemic conception to relationalist accounts. Dismissing the entire research programme because of one intuitive objection ignores this ongoing dialectic.

  Overall, Tom gets the basic motivation right but oversimplifies the thesis, misrepresents key distinctions, and underestimates the defences. His confidence seems misplaced. For the verdict: while he lands some punches, the errors and overstatements tip the balance toward "mostly-unfair."
answer: |-
  Here's a breakdown of Tom's summary, identifying accurate points, overstatements, conflations, and disjunctivist responses:

  1.  **"Disjunctivism is just the claim that veridical perception and hallucination have nothing whatsoever in common."**
      *   **Overstatement/Caricature.** This is too strong. Disjunctivism (specifically *metaphysical* disjunctivism about perception) denies that veridical perception and hallucination are *fundamentally the same kind of mental state* or share a *common mental core* (like an identical sense-datum or representational content) that constitutes the experience itself and explains its subjective character in both cases. It **does not** deny *all* commonalities. Disjunctivists accept that both states:
          *   Are subjectively indistinguishable (from the first-person perspective).
          *   Can be described using the same phenomenal language ("It looks like there's a table").
          *   Involve a subject being in *some kind* of experiential state.
          *   May share certain neural correlates (at least partially).
          *   Can cause the same beliefs or behavior.
      *   **Fair Version:** "Disjunctivism claims that veridical perception and hallucination are fundamentally different *kinds* of mental state; they do not share a common *mental constituent* or *fundamental nature* that is the experience itself. The veridical state constitutively involves the perceived object, while the hallucinatory state does not."

  2.  **"When you actually see a table, your mental state is a completely different kind of thing from when you merely hallucinate one — there's no shared 'experience' underlying both cases."**
      *   **Mostly Accurate (for core disjunctivism).** This captures the essence of *metaphysical* disjunctivism. The disjunctivist denies there is an *underlying common experiential element* (like a sense-datum, qualia, or a common representational content) present in both cases that *is* the experience. The good case is a state of *directly seeing the table* (a relational state), while the bad case is a different kind of state entirely (e.g., an illusion or hallucination). They are different fundamental kinds.
      *   **Conflation:** Tom uses "experience" ambiguously. Disjunctivists deny a shared *mental kind* or *constituent*, but they *do* allow that we can *call* both "experiences" in a looser, success-term sense ("I had a table-experience"). The key point is what *constitutes* that experience differs fundamentally.
      *   **Fair Version:** "Disjunctivism claims the mental state in veridical perception is of a fundamentally different kind (e.g., a relational state) than the state in hallucination; there is no shared mental *kind* or *core constituent* underlying both that constitutes 'the experience'."

  3.  **Motivation & Argument from Illusion: "...the good case and the bad case must involve the very same inner state... disjunctivists... deny it."**
      *   **Accurate.** Tom correctly identifies the disjunctivist's *target* (the sense-datum/conjunctivist inference from subjective indistinguishability to a common inner state) and their *rejection* of that inference. This is a core motivation for disjunctivism (e.g., in Hinton, Snowdon, McDowell, Martin).

  4.  **"But here's the problem: hallucinations genuinely do fool us, and if two states are subjectively indistinguishable they must share something in common, so disjunctivism is simply refuted."**
      *   **Overstatement & Misrepresentation.**
          *   **"Simply refuted":** This dismisses the sophisticated responses disjunctivists have developed. The indistinguishability objection is the *primary challenge*, not a refutation.
          *   **"Must share something in common":** Disjunctivists *agree* they share something: *subjective indistinguishability*. The debate is *what explains* this indistinguishability. The disjunctivist argues it does *not* require a shared *mental core*.
          *   **Disjunctivist Replies:**
              *   **Epistemological Disjunctivism (e.g., McDowell):** What they share is *epistemic*: from the subject's perspective, they cannot tell them apart. This doesn't imply a shared metaphysical essence. The good case provides factive warrant ("I see that p"), the bad case does not.
              *   **Naïve Realist Disjunctivism (e.g., Martin):** The hallucination is defined *negatively* or *relationally*: it's a state indistinguishable from a veridical perception of a specific kind. The hallucination has the property of being *introspectively indiscriminable* from seeing a table, but this property isn't a shared positive constituent; it's a relational property *defined in terms of the good case*. The hallucination might be a *deficient* or *defective* state compared to the full relational state of seeing.
              *   **Causal/Explanatory:** The indistinguishability is explained by the *causal* or *functional* overlap (e.g., similar neural mechanisms) leading to similar outputs (beliefs, judgments), *without* requiring the experiences to be metaphysically identical or share a core.
      *   **Fair Version:** "The subjective indistinguishability of veridical perception and hallucination poses a serious challenge to disjunctivism. Critics argue this indistinguishability implies a common core element. Disjunctivists respond by offering alternative explanations (e.g., negative definitions, relational properties, epistemological similarities) that preserve the fundamental difference in kind without denying the indistinguishability."

  5.  **Conflation of Illusion and Hallucination:**
      *   **Significant Conflation.** Tom treats the "stick in water" (a classic *illusion*) as an *hallucination*. Philosophers carefully distinguish:
          *   **Illusion:** Perceiving an actual object, but it appears other than it is (e.g., straight stick *looks* bent).
          *   **Hallucination:** Having an experience as of an object when *no such object is present*.
      *   **Disjunctivist Nuance:** Some disjunctivists (especially Naïve Realists) might argue that illusions *are* still cases of veridically seeing the *object* (the stick), just under misleading conditions (it *looks* bent). Hallucinations are the harder case. Conflating them weakens the specificity of the argument.

  6.  **Scepticism Claim: "...the disjunctivist at least escapes external-world scepticism completely — the evil demon worry never even gets going."**
      *   **Overly Optimistic.**
          *   **Escapes *Certain Kinds* of Scepticism:** Disjunctivism *does* block a *specific* sceptical path: it denies that the evidence of our senses in the good case is *the same kind of thing* as the evidence in the bad case (e.g., a sense-datum common to both). In the good case, we are directly aware of the world, not an intermediary. This undermines arguments that start from "In the bad case, you only have X; but in the good case, you only have X too; so you never have more than X."
          *   **Does NOT Escape Scepticism "Completely":** The *epistemological* problem remains: **How do you know *right now* that you are in the good case and not the bad case?** Just because the states are *different kinds* doesn't mean you can *introspectively tell* which kind you are in! The evil demon could still be causing hallucinations that are subjectively indistinguishable from veridical perceptions (even if they are metaphysically different states). Disjunctivism changes the *metaphysics* of perception, not necessarily our *epistemic access* to which state we are in. The sceptical challenge about *knowledge* ("Do I *know* I'm not hallucinating?") persists.
      *   **Fair Version:** "Disjunctivism blocks a specific metaphysical route to external-world scepticism (based on a common inner element in good/bad cases) by insisting the good case constitutively involves the external object. However, it does not *fully* dissolve scepticism, as the problem of knowing *whether* one is currently in the good case or a subjectively indistinguishable bad case remains."

  **Summary of Where to Push Back:**

  1.  **Concede:** His description of the disjunctivist's *motivation* (rejecting the inference from indistinguishability to common inner state) and their *core claim* (veridical and hallucinatory states are fundamentally different kinds) is largely accurate.
  2.  **Push Back Hard:**
      *   **"Nothing whatsoever in common"**: This is a caricature. Emphasize the acceptance of subjective indistinguishability and other similarities *without* a shared mental core.
      *   **Conflation of Illusion/Hallucination**: Point out this mistake and note disjunctivists often treat illusions differently.
      *   **"Simply refuted" by indistinguishability**: Explain the disjunctivist strategies (negative characterization, relational properties, epistemological focus) for explaining indistinguishability *without* a common core. This is the heart of the debate, not a refutation.
      *   **"Escapes scepticism completely"**: Argue that while it blocks one sceptical argument, the core epistemological problem of knowing you're in the good case remains intact. The evil demon worry *does* get going.

  **Verdict:** Tom captures the core motivation and thesis directionally, but significantly overstates the thesis ("nothing in common"), misrepresents the challenge ("simply refuted"), makes a crucial conflation (illusion/hallucination), and overclaims on scepticism. His summary is **mostly-unfair** to the actual nuances and defenses within the disjunctivist research programme.

  \verdict{mostly-unfair}
