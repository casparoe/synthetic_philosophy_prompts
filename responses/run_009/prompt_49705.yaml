answer: |-
  This is a brilliantly observed and pervasive issue in economic methodology—a dialectical sleight-of-hand that deserves a specific label. While no universally established term exists, I propose **Dialectical Bifocalism** as the name for this maneuver.

  ### Definition & Core Mechanism
  **Dialectical Bifocalism** occurs when a modeler *opportunistically toggles the epistemic status of an assumption* between two incompatible roles:
  1.  **Defensive Lens (Instrumentalist/As-if):** When *defending* the model against criticism of unrealistic assumptions, the assumption is framed as a harmless abstraction—a mere computational scaffold irrelevant to the model's predictive success (à la Friedman).
  2.  **Applicative Lens (Realist/Load-bearing):** When *applying* the model (especially for counterfactuals/policy), the same assumption is treated as capturing an essential, real-world causal mechanism, justifying the model's extrapolation beyond its empirical basis.

  The core dishonesty lies not in using abstractions, but in the *contradictory justification* applied to the *same assumption* depending on the conversational context. The switch is often unacknowledged.

  ### Distinguishing from Nearby Concepts
  1.  **Plain Inconsistency:** While inconsistent, this is a *systematic, functional* inconsistency tied to rhetorical goals. It's not random error but a strategic toggle.
  2.  **Motte-and-Bailey Fallacy:**
      *   **Motte:** The defensible claim ("Assumptions don't need realism; prediction matters").
      *   **Bailey:** The ambitious claim ("This model reliably tells us the *causal effects* of novel policies").
      *   **Distinction:** Dialectical Bifocalism *enables* the Motte-and-Bailey. The switch in how the *assumption itself* is characterized is the mechanism allowing retreat to the motte and advance to the bailey. It focuses on the *assumption's dual role*, not just the claim's defensibility.
  3.  **Legitimate Purpose-Dependent Roles:** A frictionless plane *is* legitimately non-load-bearing for predicting trajectory on Earth but becomes load-bearing if studying motion in a vacuum. Dialectical Bifocalism occurs when:
      *   The switch happens *opportunistically* without justification.
      *   The assumption's *realism* is explicitly *denied* in defense but implicitly *affirmed* in application.
      *   There's no independent argument for why the assumption shifts from dispensable abstraction to essential truth *specifically for counterfactuals*.

  ### Edges & Variations
  1.  **Distributed Across a Field:** Yes, this is still Dialectical Bifocalism. The phenomenon exists at the level of the *discourse* or *disciplinary practice*. Individual scholars might lean towards one lens, but the *field* collectively employs both contradictory justifications for the same models/assumptions, creating an unstable foundation.
  2.  **Different Assumptions for Different Roles:** Not Bifocalism. If defenders argue assumption A is irrelevant for prediction but assumption B *is* essential for counterfactuals, that requires separate justification but isn't the same opportunistic toggle applied to A.

  ### Dissolving the Problem: A Principled Boundary?
  Can defenders pre-declare boundaries to avoid the switch? **Potentially, but it's hard and rarely done honestly.** Here’s how it *could* work:

  1.  **Explicit Scope Declaration:** "This model, with its false assumptions F1, F2, F3, is *only* validated for predicting outcomes in domain D (e.g., short-run equilibrium prices under existing policy). Its assumptions are purely instrumental for D."
  2.  **Counterfactual Licensing Argument:** "For counterfactual question C (e.g., effect of new tax T), we *additionally assume* that the *optimization mechanism* captured by assumption F2 is a robust, persistent causal feature that dominates the response to T, even though F2 is false in detail. This is justified by evidence E (e.g., micro-studies on firm responses to incentives), independent of the model's fit in D."

  **The Challenge:**
  *   **Burden of Proof:** The second step imposes a significant burden. It requires *independent evidence or theory* justifying why the *specific false abstraction* becomes the *essential causal driver* for the *specific counterfactual*. This is rarely provided; the model itself is often the sole justification.
  *   **Acknowledging Limitation:** It forces an admission that the model's core assumptions *are* false and that its counterfactual predictions rest on an *additional, substantive claim* about reality (the realism of the mechanism) that needs separate support.
  *   **Undermines the Friedman Defense:** If you need the realism of the mechanism for counterfactuals, Friedman's "irrelevance of assumptions" defense for the model *in general* is weakened. It becomes relevant *specifically for extrapolation*.

  **Why it Usually Fails:** Defenders typically want the prestige of "rigorous optimization-based model" *and* the defensibility of "only predictions matter." Explicitly stating that counterfactuals rely on the *realism* of the optimization assumption undermines the instrumentalist shield and exposes the model's speculative foundation for policy. Dialectical Bifocalism avoids this discomfort.

  **In essence:** Dialectical Bifocalism is the symptom of wanting to have your cake (defense via instrumentalism) and eat it too (policy authority via implicit realism) without acknowledging the tension. Dissolving it requires rigorous separation of the model's *demonstrated predictive domain* from the *additional justifications needed* for counterfactual extrapolation, accepting that the latter demands more than the model's internal logic. It requires moving beyond opportunistic toggling to explicit, evidence-based meta-modeling claims.
