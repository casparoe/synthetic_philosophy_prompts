answer: |-
  ## Joint Statement: Adversarial Collaboration on the Demos Boundary Problem

  **Agreed Claims (Signed by Both Representatives):**

  1.  **The Boundary Problem is Genuine:** There is no self-evident, naturally given "people" for a democracy. Existing state boundaries and their associated franchises are historical artifacts and do not precisely correspond to the legitimate extension of any single coherent principle of democratic inclusion. Treating "the people" as given evades the core normative question.
  2.  **Extensional Indeterminacy:** Both the "subjection to coercion" (Subject) and "materially affectedness" (Affected) principles face significant challenges in defining clear, stable boundaries.
      *   *Subject:* Defining the precise scope of "subjection to coercive law" is complex. Much coercion stems from the background operation of systems like property and contract law, which structure life pervasively but indirectly. Does this subject everyone interacting with the system, or only those directly subject to state enforcement actions? Where is the line drawn?
      *   *Affected:* Defining "materially affectedness" in a globalized, interdependent world is profoundly difficult. Almost any state decision has ripple effects far beyond its borders. Without clear thresholds of significance or proximity, the principle risks becoming boundless or arbitrarily limited.
  3.  **The Bootstrapping Problem:** Determining *who* legitimately decides the boundary of the demos presupposes an existing demos. Neither principle inherently solves this foundational issue. Any initial boundary-setting process involves contestable claims to authority.
  4.  **Principle vs. Pragmatics:** While our principles aim for normative justification, the *implementation* of any boundary requires practical judgments and institutional design, acknowledging real-world constraints and trade-offs. Neither principle dictates a single, unambiguous institutional solution.
  5.  **Beyond Verbal Disagreement (Partial):** We agree that a significant portion of our disagreement is *not merely verbal*. We are making substantively different claims about the *basis* for democratic standing. The Subject principle primarily grounds membership in a claim-right against being coerced without a voice in the coercing authority. The Affected principle primarily grounds membership in having a significant stake (an interest) in the outcomes of decisions. **Residual Substantive Disagreement:** The core dispute concerns *which of these foundations is primary and sufficient* for defining the demos, and crucially, *how the principles interact* when they point in different directions (e.g., deeply affected outsiders vs. minimally affected insiders subject to coercion).

  **Table of Key Disagreements**

  | Disputed Question                                                                                                              | Subject Camp Phrasing (Acceptable to Subject)                                                                                                 | Affected Camp Phrasing (Acceptable to Affected)                                                                                                                                 | Crux (See Below) |
  | :----------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------- |
  | **Cross-Border Commuters (Work/Tax Here, Vote Elsewhere)**                                                                     | Individuals are subject to workplace regulations, taxation law, and the general legal framework during their working hours and presence. This partial but significant subjection warrants inclusion. | These individuals have substantial, direct, and ongoing material stakes in local policies affecting infrastructure, services, taxation levels, and the economic environment where they work and earn income. | Crux 1, Crux 2   |
  | **Deep-Water Port Referendum (Significant Costs/Benefits Spill to Neighboring State)**                                         | The neighboring state's residents are not subject to our sovereign coercive laws. While affected, their inclusion would undermine the unit of decision for the state imposing the law. Trusteeship or treaties address spillovers. | The scale and nature of the material impact (environmental, economic) on the neighboring state are substantial and direct. Democratic legitimacy requires including those bearing significant costs or receiving significant benefits. | Crux 1, Crux 2   |
  | **Youth Climate Movement (Standing for Future Generations)**                                                                   | Future individuals do not currently exist as legal persons capable of being subject to coercion or exercising rights. Trusteeship by the *current* demos, bound by intergenerational justice norms, is the appropriate mechanism. | The material effects of decisions like the climate law fall most heavily and irreversibly on those who will live longest under its consequences. They possess the highest stake. Formal representation mechanisms *can* be designed to include this stake. | Crux 3           |
  | **Long-Settled Resident Non-Citizens (Local Franchise Request)**                                                               | These individuals are fully subject to the coercive power of the local and national state in their daily lives – laws, police, courts, regulations. This comprehensive subjection necessitates inclusion. | Long-term residency creates deep, enduring material stakes in local outcomes (housing, education, safety, community investment). Their exclusion ignores significant, legitimate interests shaped by the demos's decisions. | Crux 1, Crux 2   |
  | **Non-Resident Foreigners Affected by Trade/Climate Policy**                                                                   | While our policies may affect them, these individuals are primarily subject to the coercive authority of their own states. Inclusion would create overlapping, conflicting demoi and undermine state sovereignty as the locus of democratic accountability. | When a state's decisions (e.g., trade barriers, high emissions) impose substantial, foreseeable, and avoidable material harm or deny significant benefits to specific foreign populations, their stake demands inclusion in the relevant decision-making process. | Crux 1, Crux 2   |

  **Cruxes and Recorded Predictions**

  1.  **Crux: Deep Interdependence - Does it dissolve the practical difference between subjection and affectedness?**
      *   **Thought Experiment:** Consider "Virtual Resident" - A foreign national employed full-time remotely by a domestic company, paying domestic income tax via treaty, relying entirely on domestic digital infrastructure/services paid for by taxes, and whose livelihood is directly tied to domestic economic policy. They are never physically present.
      *   **Subject Camp Prediction:** The Virtual Resident is *not* subjected to the state's *coercive power* in the core sense. While economically intertwined, they reside under another state's territorial sovereignty and coercive enforcement. Tax payment is a transaction, not proof of subjection. Exclusion remains justified. *(Distinction holds)*
      *   **Affected Camp Prediction:** The Virtual Resident has extremely high, direct, and continuous material stakes, arguably equivalent to or exceeding some resident citizens. Deep interdependence *does* blur the line; this case highlights the insufficiency of territorial presence/subjection alone. Inclusion is strongly warranted. *(Distinction dissolves)*
      *   **Convergence?** *Unlikely.* Predictions diverge significantly.

  2.  **Crux: Is Subjection Distinct? Is coercion merely intense affectedness, or a categorically different ground?**
      *   **Thought Experiment:** "The Benevolent Dictator" - A powerful neighboring ruler imposes a strict environmental regulation on their own populace (coercing them) to prevent catastrophic cross-border pollution that would otherwise severely harm your state's residents.
      *   **Subject Camp Prediction:** The harmed residents of your state are *materially affected* but *not subjected to the dictator's coercion*. Their grievance is real, but the solution lies in diplomacy, international law, or pressure on the dictator's own demos, not inclusion in *that* demos. *(Subjection is distinct)*
      *   **Affected Camp Prediction:** The harm is severe and directly imposed by the policy. While the dictator's subjects are coerced, the *primary material victims* of *this specific decision* are the outsiders. Their overwhelming stake necessitates a voice, perhaps through novel transnational mechanisms. Coercion of insiders is secondary to the massive external effect. *(Effect dominates; coercion is a type of effect)*
      *   **Convergence?** *No.* Predictions reflect the core disagreement on the grounding principle.

  3.  **Crux: Future Generations - Can representation solve the problem, or is it category confusion?**
      *   **Thought Experiment:** "The Irreversible Choice" - A decision to extract and sell a non-renewable resource for immediate benefit, knowing it will cause severe environmental degradation and resource scarcity starting in 50 years, impacting those not yet born.
      *   **Subject Camp Prediction:** Future individuals cannot be "subjected" in the present. The *current* demos, acting as trustees, must make this choice constrained by moral duties of intergenerational justice. Creating "representatives" for non-existent persons is legally and conceptually incoherent; it's the *current* trustees who must act justly. *(Trusteeship required; representation impossible)*
      *   **Affected Camp Prediction:** The material stake of future generations is paramount and unique. While they don't exist now, the *interest* exists. Institutional mechanisms (e.g., independent future guardians with veto power, mandatory impact assessments weighting future costs higher) *can* and *must* be designed to formally incorporate that future stake into present decision-making, going beyond mere trustee discretion. *(Representation of interests possible and necessary)*
      *   **Convergence?** *Possibly on Outcome, Not Reason:* Both might agree the resource extraction decision needs strong constraints. Subject would see this as current trustees fulfilling a duty; Affected would see it as institutionalizing the future's stake. The joint statement must highlight this difference in justification.

  ---

  **Regarding the Operational-Boundary Observation:**

  We acknowledge the rapporteur's perspective that boundaries might be seen as operational choices judged by the significance of neglected fluxes. While both camps agree that boundary-setting involves pragmatic judgments (Agreed Claim 4), incorporating this observation *as formulated* into the core agreed claims would be problematic.

  *   **Subject Camp Concern:** This framing risks being read as overly deflationary or technocratic. It could imply that the *normative principle* (subjection) is secondary to pragmatic flux management. We hold that the principle provides the primary justification; pragmatics adapts its *application*. Accepting this might undermine the core moral claim against coercing the unrepresented.
  *   **Affected Camp Concern:** While more amenable to flexible application, this framing might inadvertently privilege existing state boundaries as the default "system," merely needing flux adjustments. We argue the principle itself may demand radical restructuring beyond minor flux management within the status quo. It could also downplay the normative weight of significant affectedness outside the current boundary.

  Therefore, while recognizing the practical necessity of operational decisions (reflected in Agreed Claim 4), the specific "flux management" analogy is excluded from the signed agreed claims to avoid misinterpretation by either camp as undermining the foundational normative disagreement. The residue *is* the substantive clash over the primary ground of membership.
