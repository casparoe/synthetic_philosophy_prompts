  ### In-Class Activity Design: Bertrand's Paradox Exploration  
  **Objective:** To experientially reveal the failure of the principle of indifference by showing that "uniform at random" depends on the chosen description, leading to different probabilities for the same event.  

  ---

  ### **Materials Per Group (3 Groups)**  
  - **Printed circle** (radius 10 cm, center marked, on paper).  
  - **Ruler** and **set square** (for drawing perpendiculars).  
  - **Strip of paper** marked at 5 cm (for comparison to radius/2).  
  - **Recording sheets** (tally for "long" chords).  
  - **Factory-specific materials:**  
    - **Factory 1 (Random Endpoints):** Two spinners (paper clips on pencils centered at circle origin).  
    - **Factory 2 (Random Radial Point):** One spinner, two six-sided dice.  
    - **Factory 3 (Random Midpoint):** Pencil and blindfold (e.g., scarf or fabric).  

  ---

  ### **Operating Procedures**  
  Each group receives sealed instructions (emphasize: *do not share*). Students generate chords and classify as "long" if length > side of inscribed equilateral triangle (equiv. to distance from center to chord < 5 cm).  

  1. **Factory 1: Random Endpoints**  
     - *Procedure:*  
       1. Spin Spinner 1; mark point \(A\) where it stops on circumference.  
       2. Spin Spinner 2; mark point \(B\) on circumference.  
       3. Draw chord \(AB\).  
       4. Use set square to drop perpendicular from center \(O\) to \(AB\); call foot \(H\).  
       5. Measure \(OH\). If \(OH < 5\) cm, chord is "long"; else, not.  
     - *Theoretical Probability:* \(1/3 \approx 0.333\).  

  2. **Factory 2: Random Radial Point**  
     - *Procedure:*  
       1. Spin spinner to select a radius; mark direction.  
       2. Roll two dice:  
          - Die 1 (tens digit): Values 1–6 → subtract 1 → digit 0–5.  
          - Die 2 (units digit): Values 1–6 → subtract 1 → digit 0–5.  
          - Compute: \( \text{number} = 6 \times \text{tens} + \text{units} \) (range 0–35).  
          - Fraction \( f = \text{number} / 35 \).  
          - Distance \( d = f \times 10 \) cm.  
       3. Mark point on radius at distance \(d\) from center.  
       4. Draw chord perpendicular to radius at this point.  
       5. Distance from center is \(d\); if \(d < 5\) cm, chord is "long."  
     - *Theoretical Probability:* \(1/2 = 0.5\).  

  3. **Factory 3: Random Midpoint (Blindfolded Dart Throw)**  
     - *Procedure:*  
       1. Blindfolded student drops pencil tip onto circle to mark midpoint \(M\).  
       2. Draw radius \(OM\).  
       3. Draw chord perpendicular to \(OM\) at \(M\).  
       4. Measure \(|OM|\). If \(|OM| < 5\) cm, chord is "long."  
     - *Theoretical Probability:* \(1/4 = 0.25\).  

  ---

  ### **Timeline (90 Minutes)**  
  | Time     | Activity                                                                                                | Instructor Notes                                                                 |  
  |----------|---------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|  
  | 0–5 min  | **Intro:** Frame activity as "quality control" for chord factories. No mention of paradox or indifference. | Stress physical execution; avoid defining "random chord."                         |  
  | 5–10 min | **Commitment:** Each student writes personal estimate (0.0–1.0) for \(P(\text{long chord})\) on card. Collect cards. | Cards are anonymous; no discussion.                                               |  
  | 10–15 min| **Group Setup:** Split into 3 factories. Distribute materials/sealed instructions.                      | Assign roles (spinner, dice, blindfold, recorder); groups work in separate areas.|  
  | 15–45 min| **Chord Production:** Each factory generates 40 chords (8/student for 5 students). Record "long" chords. | Circulate to assist: ensure Factory 1 measures \(OH\), Factory 3 uses blindfold. |  
  | 45–50 min| **Tally Results:** Groups compute frequency of "long" chords. Write on board: Factory 1, 2, 3 frequencies. | Ensure frequencies are visible but *not* the procedures.                          |  
  | 50–55 min| **Inspector Summit:** One "lead inspector" per group comes forward. Task: Agree on *one* industry-standard \(P(\text{long chord})\). | Instructors: "Reconcile your frequencies into a single number." Push for consensus.|  
  | 55–70 min| **Reveal & Debate:** Groups describe procedures. Highlight differences. Show commitment card estimates.  | Ask: "Why couldn’t you agree? What felt ‘uniform’ in your method?"               |  
  | 70–90 min| **Debrief:** Map activity to Bertrand’s paradox. Discuss implications.                                  | Use whiteboard; structure below.                                                  |  

  ---

  ### **Recording and Scoring**  
  - **Recording:** Each factory tracks:  
    - Chord number.  
    - \(d\) (distance from center) or \(OH\) (Factory 1).  
    - "Long" (1 if \(d < 5\) cm; 0 otherwise).  
  - **Scoring:**  
    - Frequency = (Total "long") / 40.  
    - **No real money:** "Success" is resolving the paradox conceptually. Award "Factory of the Day" for best procedure execution.  

  ---

  ### **Debrief Structure**  
  1. **Paradox Structure:**  
     - **Event:** Chord longer than triangle side (\(d < R/2\)).  
     - **Three Measures:**  
       - *Factory 1:* Uniform over pairs of endpoints (space: \([0, 2\pi) \times [0, 2\pi)\)). Probability = \(1/3\).  
       - *Factory 2:* Uniform over radius and distance along radius (space: \([0, 2\pi) \times [0, R]\)). Probability = \(1/2\).  
       - *Factory 3:* Uniform over disk area (space: \(\{(x,y) : x^2+y^2 \leq R^2\}\)). Probability = \(1/4\).  

  2. **Key Moments in Activity:**  
     - **Commitment Cards:** Estimates scattered (e.g., 0.25–0.60) because students intuited different "natural" uniformities.  
     - **Inspector Stalemate:** Each factory’s frequency was "correct" for its measure, but measures conflicted.  
     - **Physical Randomizers:** Dice/spinners imposed their own uniformity (e.g., dice → discrete uniform, blindfold → biased to center).  

  3. **Why Indifference Fails:**  
     - Principle assumes a unique "symmetrical" description, but here, three descriptions are equally natural yet incompatible.  
     - "Random chord" is underdetermined; needs a specified *measure* (e.g., how to parameterize the space).  

  4. **Sampling Noise & Contingencies:**  
     - **Sample Size:** 40 chords/group (95% CI):  
       - Factory 1: [0.20, 0.46]  
       - Factory 2: [0.35, 0.65]  
       - Factory 3: [0.12, 0.38]  
     - **Overlap Mitigation:**  
       - If frequencies overlap (e.g., Factory 1: 0.35, Factory 2: 0.45), highlight theoretical values. Ask: "Would 1000 trials match 1/3, 1/2, 1/4?"  
       - If consensus reached, challenge: "Why not 0.4? What makes your number ‘correct’?"  

  ---

  ### **Predictable Problems & Solutions**  
  | Issue                          | Mitigation Strategy                                                                 |  
  |--------------------------------|-------------------------------------------------------------------------------------|  
  | **Aim bias (Factory 3)**       | Blindfolded drops often cluster near center. *Debrief:* "Physical ‘uniformity’ isn’t mathematical uniformity." |  
  | **Early discovery of differences** | Use sealed instructions; emphasize secrecy. If leaked, ask: "Why would procedures differ?" |  
  | **Group negotiation**          | Assign roles; have recorders track individual chords. If groups converge, note: "This hides true disagreement." |  
  | **Measurement errors (Factory 1)** | Practice dropping perpendiculars; use set squares. Accept noise: "Real data is messy." |  
  | **Time overrun**               | Reduce chords to 30/group; use pre-generated dice/spinner values as backup.         |  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Physical vs. Abstract Measures:**  
    Physical randomizers (dice, spinners, dart throws) come with inherent measures (e.g., dice → discrete uniformity; dart → biased by motor control). Bertrand’s paradox arises in the *abstract*, where no physical process privileges one measure over another. The activity *uses* physical tools to expose the ambiguity but cannot replicate the pure mathematical freedom to choose parameterizations without empirical constraints.  

  --- 

  **Final Prep Checklist:**  
  - [ ] Print circles (radius 10 cm, center marked).  
  - [ ] Prepare spinners (pencil + paper clip per group).  
  - [ ] Make 5 cm strips.  
  - [ ] Seal factory instructions.  
  - [ ] Test dice calculations (Factory 2: \(d = \frac{6 \times (d_1-1) + (d_2-1)}{35} \times 10\)).  
  - [ ] Blindfold + backup plan for Factory 3 (e.g., dice-driven coordinates if dart throws fail).  

  This design balances experiential learning with conceptual rigor, ensuring students confront the paradox’s core: **uniformity is in the eye of the parameterizer.**
