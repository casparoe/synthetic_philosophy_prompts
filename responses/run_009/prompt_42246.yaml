  First, I need to identify the key objections from each group. The prosecutors will likely focus on impunity and legal norms. They might argue that conditional amnesty violates the duty to prosecute grave crimes. The victims' representatives will see any amnesty as betrayal, emphasizing ongoing pain and injustice. Political scientists might question the stability and credibility of such amnesties in peace processes.

