answer: |-
  Here’s a tailored Q&A preparation sheet for your workshop, ordered by potential damage if poorly answered. Each objection is phrased authentically for the relevant audience segment, followed by a concise 2-minute reply, vulnerabilities ("Soft Spots"), and concessions where necessary.  

  ### **Q&A Preparation Sheet: South African Conditional Amnesty Model**  
  *(Ordered by descending severity of damage if flubbed)*  

  ---

  1. **Objection (ICC/ICTY Prosecutors):**  
     *"You’re legitimizing impunity for crimes against humanity. The Rome Statute’s gravity principle demands prosecution. How is trading justice for ‘truth’ anything but a capitulation to political expediency?"*  
     **Reply:**  
     "I agree prosecution is the ideal. But in negotiated transitions, ‘full prosecution’ is often a fiction. The choice isn’t between trials and amnesty—it’s between *this* process and blanket impunity or collapsed peace. The SA model extracts detailed, sworn confessions under penalty of perjury—something trials rarely achieve. It creates an irrefutable public record, while trials often bury truth in plea deals or unproven allegations. This isn’t capitulation; it’s a pragmatic form of accountability where trials are impossible."  
     **Soft Spot:** Doesn’t negate that amnesty *is* impunity under international law.  
     **Concede:** "You’re right: this doesn’t satisfy the ICC’s complementarity test. But it prevents *total* impunity when trials would guarantee none at all."  

  ---

  2. **Objection (Victims’ Representatives):**  
     *"How dare you call this ‘justice’? My brother’s killer walked free after confessing. No prison, no reparations—just words. This model forces victims to relive trauma while rewarding torturers."*  
     **Reply:**  
     "I cannot minimize your pain, and I agree: no process can fully atone for loss. But this model forces perpetrators to *publicly* name their victims, detail atrocities, and admit guilt—something trials avoid. It gives victims formal recognition and an unshakable historical record. Without this, many families would never know the truth or hear accountability. It’s not perfect justice, but it’s a form of moral reckoning trials rarely deliver."  
     **Soft Spot:** Does nothing for victims needing retribution/reparations.  
     **Concede:** "You’re justified in feeling betrayed by the lack of punishment. The SA model’s failure to mandate reparations was a profound flaw."  

  ---

  3. **Objection (Political Scientists):**  
     *"Conditional amnesty creates a commitment problem: perpetrators confess expecting immunity, but future regimes can void deals (like Peru in *Barrios Altos*). Why wouldn’t warlords reject this, fearing later prosecution?"*  
     **Reply:**  
     "Because the SA deal was embedded in a constitutional compact, ratified by courts, and granted *individual* (not blanket) amnesty only after scrutiny. It offered legal certainty: rejections were appealable, and approved amnesties were bulletproof. Contrast this with post-transition trials, which are rare and selective. This process gave perpetrators stronger guarantees than unstable ‘peace-via-prosecution’ promises."  
     **Soft Spot:** Assumes robust institutions exist to enforce deals—unlikely in many transitions.  
     **Concede:** "True, this requires high institutional trust. In power imbalances (e.g., militaries retaining influence), it may fail."  

  ---

  4. **Objection (ICC Prosecutors):**  
     *"This sets a dangerous precedent: why should states prosecute if they can invent ‘truth commissions’? You’re undermining the Rome Statute’s duty to prosecute gravity crimes."*  
     **Reply:**  
     "The Rome Statute permits complementarity—states can show ‘unwillingness or inability’ to prosecute. In transitions, inability is often factual: evidence is destroyed, witnesses dead, courts compromised. The SA model isn’t a substitute for functioning states—it’s a crisis tool. Importantly, it *denies* amnesty for incomplete confessions or disproportionate acts, creating a higher bar than many trials."  
     **Soft Spot:** Ignores that the ICC *must* prosecute core crimes if states don’t.  
     **Concede:** "I agree: this model shouldn’t shield those who evade the process. The ICC should prosecute non-compliant perpetrators."  

  ---

  5. **Objection (Victims’ Representatives):**  
     *"You speak of ‘public truth,’ but what good is truth without consequences? Perpetrators kept jobs, pensions, status. Victims got nothing but nightmares."*  
     **Reply:**  
     "Consequences exist beyond prison: social stigma, career bans, and historical infamy. Look at Eugène de Kock: freed but universally reviled. The TRC’s public hearings made perpetrators permanently accountable to society. Trials often fail here: Milošević died a hero to some; Lubanga got 14 years and a book deal. This model weaponizes shame—which can be more enduring than a cell."  
     **Soft Spot:** Assumes societal shaming occurs—not guaranteed in polarized societies.  
     **Concede:** "Stigma isn’t enough. South Africa should have imposed civil sanctions (asset forfeiture, ineligibility for office)."  

  ---

  6. **Objection (Political Scientists):**  
     *"This only works if perpetrators believe confession is their least-bad option. In asymmetric conflicts (e.g., Colombia), why would strong actors confess when they can win at trial or stall indefinitely?"*  
     **Reply:**  
     "It’s not for all conflicts. The SA model worked because *both* sides needed legal certainty: the ANC had insurgent liability, the regime had state-sanctioned crimes. It traded amnesty for truth where mutual vulnerability existed. In one-sided conflicts, you’re right—this fails. But in balanced transitions (e.g., Northern Ireland), it offers a template."  
     **Soft Spot:** Limited applicability.  
     **Concede:** "Agreed—it’s niche. It won’t work where perpetrators hold overwhelming power."  

  ---

  7. **Objection (ICTY Prosecutors):**  
     *"You dismiss trials, but the *Erdemović* plea at the ICTY produced crucial evidence while ensuring punishment. Isn’t plea bargaining a better tool?"*  
     **Reply:**  
     "Plea bargains trade truth for leniency *in secret*. The SA model forces *public*, detailed disclosure, vetted by a panel and victims. Erdemović’s confession was sealed for years; TRC confessions were broadcast live. Plea deals protect perpetrators from cross-examination; the TRC grilled applicants. Public truth > private deals."  
     **Soft Spot:** Overstates the TRC’s rigor—some confessions were shallow.  
     **Concede:** "Some TRC hearings *were* perfunctory. But the *design* demanded more than plea bargains."  

  ---

  8. **Objection (All Audiences):**  
     *"If this model is so virtuous, why hasn’t it been replicated? Even South Africa abandoned it post-TRC."*  
     **Reply:**  
     "It *has* been adapted (e.g., Timor-Leste, Liberia). But it’s politically toxic—seen as ‘amnesty,’ not ‘accountability.’ My point isn’t that it’s perfect, but that it delivers unique goods when prosecution is impossible. Post-TRC, South Africa failed *prosecutions*: only 2 convictions since 1994. The model’s legacy is its truth archive—not its replication."  
     **Soft Spot:** Admits the model is politically unsustainable long-term.  
     **Concede:** "Its irreplicability is a weakness. But it succeeded in its moment—which is all transitions have."  

  ---

  ### **The "Silver Bullet" Question (Hope Nobody Asks):**  
  *"If conditional amnesty is so valuable, why did the ANC later prosecute apartheid-era figures like Johan van der Merwe? Doesn’t this prove the model was a temporary concession, not a moral achievement?"*  
  **Why it’s deadly:** Implies the model was a cynical placeholder, undercutting your "distinctive good" thesis.  
  **How to handle:**  
  1. **Concede immediately:** "You’re right: post-TRC prosecutions show the model’s *compromise* nature."  
  2. **Reframe:** "But van der Merwe was prosecuted for *lying to the TRC*—proving the process had teeth. The TRC secured his confession first; the trial just confirmed the record. This shows the model’s strength: it created evidence no trial could get."  
  3. **Pivot:** "Even failed prosecutions rely on TRC archives. Without it, there’d be *no* accountability."  

  **Final Tip:** When conceding, use: **"You’re right, and..."** not *"but."* (e.g., "You’re right that victims deserved reparations, *and* that’s where the model failed"). This disarms critics while holding your core argument.
