  Okay, the user works at a charity evaluator and is struggling with the ethical and philosophical foundations of comparing welfare across different people. They need a clear set of criteria to evaluate theories of interpersonal utility comparisons (IUCs) for practical decision-making. Let me unpack their request.

  First, the user is frustrated with theoretical approaches that avoid real-world applicability. Their main goal is to justify rankings to donors or health ministries, not just debate metaphysics. So the desiderata must be action-oriented, focusing on what's necessary for actionable rankings.

  Looking at their listed requirements: cases like tinnitus vs. toothache, utility monsters, sour grapes, and life swaps. These test cases are crucial because they represent real dilemmas in resource allocation. The user wants to know if these comparisons have objective answers or are mere conventions. They need the theory to handle these without implausible or unfair outcomes.

  Then distinctions: level vs. difference comparability. Aggregation requires comparing differences (how much welfare changes), not just who's better off. Cardinal scales are necessary for such comparisons, but how can we justify using them across individuals? Also, they're concerned about indicators like money or happiness—are these proxies valid or just convenient?

  Engagement with opposing views is essential. The ordinalist critique by Robbins questions the scientific basis of IUCs. Veil-of-ignorance approaches vary (average vs. worst-off), so the theory must address why one is chosen. The user wants these positions addressed, not dodged.

  The critical part is identifying non-negotiables. From the user's context, cardinal comparability is indispensable because aggregation requires it. The theory must handle the test cases without absurd outcomes (e.g., not caving to utility monsters or punishing adapted preferences). Distinguishing welfare from proxies is also key to avoid biases from convenient metrics.

  Possible tensions: Full ordinalism with no interpersonal info makes ranking impossible—that's a useful result for their board. Also, satisfying anti-symmetry in swaps while addressing sour grapes might conflict if preferences are adaptive. The utility monster case challenges whether to accept self-reports, which could divert resources unfairly.

  Among contenders, extended preferences might handle swaps and sour grapes but struggle with utility monsters. Money metrics are accessible but bias towards current preferences and markets. QALYs focus on health but miss broader welfare. Objective lists avoid preference issues but require justifying the list authoritatively.

  The user's unspoken needs include credibility to stakeholders and operational feasibility. They need a framework that's defensible ethically and practically. Highlighting the necessity of cardinal comparability and the trade-offs in each theory helps them communicate limitations to their board. Emphasizing that no perfect solution exists but some are better suited for their context is crucial.
answer: |-
  Here are the desiderata for an adequate account of interpersonal utility comparisons (IUCs) for your purpose of justifying charity intervention rankings to donors or policymakers, structured as requested. They focus on *what the account must deliver* to be practically adequate, not just theoretically coherent.

  **I. Core Cases It Must Get Right (Motivating Intuitions & Constraints):**
  1.  **Tinnitus vs. Toothache:** Must provide a *principled* (not merely stipulated) answer to "Is one person's year of constant tinnitus worse than two people's years of intermittent toothache?" Crucially, it must clarify the *epistemic status* of the answer: Is it a truth claim (even if uncertain) or a convention? The answer must seem plausible and defensible to reasonable stakeholders.
  2.  **Utility Monster:** Must provide a *principled rejection* or severe discounting of claims that transferring resources to an individual reporting astronomical utility gains is the optimal use. The account cannot collapse into endorsing extreme inequality based solely on self-reported intensity.
  3.  **Sour Grapes (Adapted Preferences):** Must *not* systematically reward deprivation by assigning lower priority to helping individuals whose preferences have adapted to their poor circumstances (e.g., a chronically malnourished person reporting high satisfaction). The comparison must reflect an objective welfare deficit, not just subjective contentment.
  4.  **Life Swap (Anti-Symmetry):** Must satisfy the condition: If person A's *entire life situation* (circumstances, capacities, preferences) is swapped with person B's, then the welfare level/change comparison between A and B should reverse. This tests whether the comparison tracks something inherent to the *person-in-situation*, not an arbitrary labeling.

  **II. Key Distinctions It Must Respect:**
  5.  **Levels vs. Differences:** Must explicitly provide comparability of *utility differences* (ΔU), not just levels (U). **Non-Negotiable:** Aggregation (summing welfare gains/losses across people) fundamentally requires comparing ΔU across individuals. Comparing only levels is insufficient for evaluating interventions causing diverse changes.
  6.  **Cardinality Requirement:** Must justify using *cardinal* (interval-scale) individual utility functions, not merely ordinal rankings. **Non-Negotiable:** Meaningful comparison of ΔU requires cardinality *within* an individual. The account must then explain what licenses carrying this cardinal structure *across* different individuals to make ΔU_A comparable to ΔU_B.
  7.  **Welfare vs. Indicator:** Must rigorously distinguish:
      *   *Welfare (Theoreticum):* The underlying good being compared (well-being, flourishing, preference satisfaction).
      *   *Indicator (Operandum):* The measurable proxy (money, health states, SWB reports, behavior).
      Must honestly confront whether the convenience/practicality of an indicator (e.g., market prices for money-metrics, existing surveys for SWB) is illegitimately driving the *theoretical* account of welfare comparability. **Non-Negotiable:** Cannot simply conflate the indicator with welfare.

  **III. Positions It Must Engage (Not Dodge):**
  8.  **Ordinalist Critique (Robbins):** Must directly address the claim that IUCs lack scientific basis due to the absence of an intersubjectively verifiable common unit. Cannot simply assume comparability; must provide a defensible account of what the "common unit" represents and how we access it (even imperfectly).
  9.  **Veil-of-Ignorance (VOI) & Impartial Observer:** Must engage with attempts to bootstrap comparability through hypothetical choice (Harsanyi, Rawls). Crucially, must explain *which* VOI conception is used and *why* (e.g., average utilitarianism vs. maximin), and how this resolves the core cases above, especially given that different VOIs yield different rankings.

  **IV. Critical Analysis: Non-Negotiables, Tensions & Key Excluder**

  *   **Non-Negotiable Desiderata (For Ranking Interventions):**
      *   **5. Comparability of Differences (ΔU):** Essential for aggregation.
      *   **6. Cardinality & Cross-Person Cardinal Comparability:** Essential for measuring and summing welfare *changes*.
      *   **7. Rigorous Welfare/Indicator Distinction:** Essential to avoid bias from convenient proxies.
      *   Handling **3. Sour Grapes** appropriately: Essential for ethical defensibility and not perpetuating injustice.
      *   Rejecting **2. Utility Monster** claims: Essential for plausible prioritization.
      *   Providing non-arbitrary answers to **1. Tinnitus/Toothache**: Essential for stakeholder justification.
      *   Engaging **8. Ordinalist Critique**: Essential for credibility.

  *   **Likely Tensions/Joint Unsatisfiability:**
      *   **Full Ordinalism + No Interpersonal Info = Impossible Ranking:** If one insists (like strict Robbins ordinalism) that *only* intra-personal ordinal rankings are meaningful and *no* interpersonal information (even about relative suffering levels) is possible, then constructing *any* non-arbitrary ranking of interventions benefiting different people is **impossible**. **This is a key result for your board:** Avoidance of IUCs necessitates arbitrary weighting or renders systematic comparison incoherent.
      *   **Sour Grapes (3) vs. Life Swap (4) & Preference-Based Views:** If welfare *is* preference satisfaction, and preferences adapt (Sour Grapes), respecting preferences (Life Swap) seems to require valuing the adapted state highly. Resolving this requires either rejecting pure preference satisfaction as welfare (e.g., invoking objective goods/capacities) or having a sophisticated theory of "informed" or "ideal" preferences.
      *   **Utility Monster (2) vs. Self-Report/Extended Preferences:** If self-reported utility or imagined extended preferences are the basis, rejecting the Utility Monster requires an *external* criterion (e.g., plausibility constraints, resource cost) that limits what claims can be accepted. This challenges pure subjectivist accounts.
      *   **VOI (9) Specificity:** Different VOIs (average util vs. maximin) give different answers. Choosing one requires justification *outside* the VOI itself.

  *   **Key Requirement Excluding Contenders:**
      The most powerful excluder is **"Rigorous Welfare/Indicator Distinction & Non-Conflation" (7)** combined with the **"Sour Grapes Problem" (3)**. Many popular operational methods fail by implicitly or explicitly equating a convenient indicator with welfare itself, making them vulnerable to Sour Grapes and lacking deep justification.

  **V. Terse Verdicts on Major Contenders (Focusing on Key Failure):**

  1.  **Extended Preference Theories (Harsanyi):** Claims comparability via imagining being in others' shoes. **Fails:** Vulnerability to **Utility Monsters (2)** (what if I imagine *loving* hoarding resources?) and serious challenges in adequately addressing **Sour Grapes (3)** (do I imagine having adapted preferences?).
  2.  **Money-Metric Welfare:** Uses equivalent income/consumption as proxy. **Fails:** **Conflates indicator with welfare (7)** catastrophically; hopeless against **Sour Grapes (3)** (poor person needs less money for same "welfare" score); ignores non-market goods (**Tinnitus/Toothache (1)**).
  3.  **Health-State Utilities (QALYs/DALYs):** Uses health preferences (often from general population). **Fails:** **Conflates health with welfare (7)** (ignores non-health impacts); struggles with **Sour Grapes (3)** if using patient preferences; **Levels vs. Differences (5)** ambiguity (is a QALY gain comparable across individuals?).
  4.  **Objective List/Goods Theories:** Defines welfare as achieving specific goods (health, knowledge, relationships). **Fails:** Difficult to satisfy **Cardinality Requirement (6)** for aggregation (how much relationship = how much health?); **Engaging VOI (9)** is complex (why *this* list?); requires significant normative justification.

  **Conclusion for Your Purpose:** An adequate IUC account must deliver *cardinal comparability of welfare differences* based on a conception of welfare that is *distinct from convenient indicators* and *robust to Sour Grapes and Utility Monsters*. It must engage the ordinalist critique head-on, accepting that while perfect precision is impossible, non-arbitrary, ethically defensible comparisons are necessary and achievable for practical reasoning. No existing contender perfectly satisfies all desiderata; **extended preferences** come closest on formal grounds but face significant practical/epistemic challenges, while **objective lists** avoid Sour Grapes but struggle with cardinality and aggregation. Your methodology *must* explicitly state its stance on these points – the quiet avoidance is scientifically and ethically untenable for ranking interventions.
