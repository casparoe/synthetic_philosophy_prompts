  For question 1, about the dispute's structure, I consider the options. Option (a) seems too simplistic—the policy moment did pass, but the conceptual issues persisted. Option (b) feels central because the core clash is over defining "inefficiency" when switching costs exist. Option (c) about counterfactuals ties into this, as critics called the path-dependence claims unfalsifiable. Option (d) is partially true—the antitrust case vanishing mattered, but the debate continued in journals. So I'm leaning toward a combination, with (b) as primary, then (c), and (d) as context.

  Moving to question 2, the hidden formal question. Yes, there's an underlying issue about welfare judgments in multiple-equilibria systems. Economists agree on path dependence but not on whether market selection is "efficient" when equilibria aren't comparable. This needs theoretical work, not just case studies.

  For question 3, progress would involve refining the inefficiency definition—maybe "remediable inefficiency" frameworks—plus formal models with testable conditions. Cleaner case studies alone won't resolve it because the disagreement is conceptual. The debate might resurface with policy changes, but advancing theory could prevent rehashing old arguments.

  On epistemics: Settled points include network effects causing multiple equilibria and the QWERTY case being empirically weak. Contested is whether inefficient lock-in is possible theoretically. Both sides claimed victory, but it's a stalemate. I need to present this neutrally, not favoring either framing.

  The user seems deeply knowledgeable, possibly an academic. Their unspoken need might be understanding how to move beyond this frozen debate or identifying research gaps. I should emphasize actionable insights for progress while acknowledging the unresolved tensions.
answer: |-
  Here’s a diagnosis grounded in the literature, positions, and epistemological constraints you outlined:

  ---

  ### 1. Structure of the Dispute  
  **Primary: (b) Conceptual dispute about "inefficiency"** (≈60%), **with significant (d) Policy proxy elements** (≈30%), **and (c) Counterfactual admissibility** (≈10%).  

  - **Why (b) Dominates**:  
    Critics (Liebowitz & Margolis, L&M) argued that "inefficient lock-in" requires *unexploited profit opportunities*: if switching were truly welfare-improving, *some* agent (a coalition, entrepreneur, or coordinated group) should profitably overcome switching costs. Proponents (David, Arthur) defined inefficiency **relative to a frictionless counterfactual**, treating real-world frictions (switching costs, network effects) as market failures. L&M retorted that this redefines "efficiency" to include unrealizable ideals, rendering the concept useless for policy. This clash is explicit in their 1990s exchanges (e.g., *Journal of Law and Economics*; *Research Policy*).  

  - **Role of (d) Policy Proxy**:  
    The debate gained traction from contemporaneous antitrust cases (IBM, Microsoft), where "lock-in" justified intervention. As antitrust shifted toward consumer welfare standards in the late 1990s/early 2000s (e.g., *Trinko*, 2004), the policy urgency faded. L&M explicitly tied their critique to anti-antitrust conclusions, while David framed QWERTY as a parable for state-led coordination. The *dispute froze when its policy relevance diminished*.  

  - **Role of (c) Counterfactuals**:  
    Critics dismissed path-dependence claims as unfalsifiable ("if only history differed!"), while proponents saw counterfactuals as essential to historical explanation. However, this was secondary to the efficiency definition clash.  

  - **Why (a) is Weak**:  
    Empirical scrutiny (e.g., L&M showing QWERTY wasn't inferior; VHS/Betamax driven by licensing, not quality) *did* undermine specific cases. But the core dispute persisted because proponents shifted to *theoretical possibility* (e.g., Arthur's models). Funding loss mattered for cases, not the conceptual deadlock.  

  ---

  ### 2. Hidden Formal Question  
  **Yes: The welfare significance of equilibrium selection under increasing returns.**  

  - **Settled**: Network effects *can* create multiple Pareto-rankable equilibria (Arthur 1989; Farrell & Saloner 1985).  
  - **Contested**: Whether market processes "select" equilibria in a *welfare-meaningful* way.  
    - L&M’s stance implies that the *attainable* equilibrium (given real frictions) *is* efficient by definition.  
    - Proponents see "selection" as arbitrary (e.g., via small events), trapping society in a Pareto-inferior state.  
  - **The Hidden Problem**: Welfare economics lacks tools to judge "inefficiency" when equilibria are incomparable under real-world constraints. A theorem clarifying **when switching costs imply remediable inefficiency** (e.g., defining "remediability" à la Dixit) is missing. The debate awaits **formal identification conditions** for "unexploited gains" in dynamic games with network effects.  

  ---

  ### 3. What Would Count as Progress  
  **Priority: Sharper definition of remediable inefficiency + formal testable conditions.**  

  - **Why case studies won’t resolve it**:  
    Even a "clean" historical case (e.g., nuclear reactor lock-in) would be contested on conceptual grounds (e.g., "could a coalition *really* have profited from switching?").  
  - **Why policy dissolution is incomplete**:  
    The debate *will* re-emerge (e.g., in tech/platform governance), but without conceptual clarity, it will replay the same arguments.  
  - **Path Forward**:  
    1. **Define "remediable lock-in" formally**: E.g., inefficiency exists iff a hypothetical planner (with no info/coordination costs) could Pareto-improve by shifting equilibria *after accounting for switching costs*.  
    2. **Develop testable implications**: E.g., models where lock-in’s inefficiency is identified by observable market reactions (e.g., failed coordination attempts, latent innovation patterns).  
    3. **Empirical refinement**: Use natural experiments (e.g., localized tech adoptions) to test predictions.  

  ---

  ### Epistemics: Settled vs. Contested  
  | **Settled**                          | **Contested**                                  |
  |--------------------------------------|-----------------------------------------------|
  | - Network effects cause multiple equilibria. | - Whether *any* real-world case shows *inefficient* lock-in. |
  | - Switching costs inhibit transitions.       | - Whether "inefficient lock-in" is **theoretically possible** (vs. definitionally incoherent). |
  | - QWERTY’s inferiority is overstated; VHS won for non-quality reasons. | - Welfare status of "selected" equilibria under frictions. |

  **Both Sides’ "Victory Claims"**:  
  - **Proponents** note critics conceded *theoretical* path-dependence (L&M 1995: "multiple equilibria exist").  
  - **Critics** note proponents retreated from empirical claims to unfalsifiable theory.  
  **Reality**: Stalemate due to incompatible definitions of efficiency.  

  ---

  ### Confidence in Diagnosis  
  - **High Confidence**: Core dispute is conceptual (b); policy relevance (d) accelerated freezing; formal gaps exist.  
  - **Moderate Confidence**: Hidden formal question drives impasse; progress requires theoretical/modeling advances.  
  - **Low Confidence**: Exact weighting of factors (e.g., counterfactuals’ role)—this is interpretive.  

  This debate stalled not from lack of evidence, but because it exposed a rift in welfare economics. Resolving it demands formalizing "efficiency" in a world of frictions—a task still incomplete.
