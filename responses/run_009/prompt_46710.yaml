prompt: |-
  Hey, so I write about science and ideas for a general audience, and I've got a piece in the works on whether the world is really getting less violent. I found this long review essay I was planning to lean on for framing, but before I build a whole article on it I want to make sure it's not leading me astray. The gist:

  "Human violence has been declining steadily since prehistory, and the evidence starts there: the share of people who died at the hands of other people was many times higher in hunter-gatherer and tribal societies than in the state societies that replaced them. Even the 20th century, despite its world wars, killed a smaller fraction of humanity than typical tribal conflict did, so humanity's worst century still confirms the trend. Since 1945 the great powers have fought each other directly zero times, and this long peace proves that major war has become statistically obsolete. On the numbers, a person born today is far less likely to die a violent death than at any earlier point in history, so we should expect the decline to continue."

  Parts of this feel a bit too smooth to me? I've seen people fight about whether you can even compare rates across eras like that, and about whether the post-1945 quiet is a trend or just luck, but I honestly can't tell where the genuine scholarly disagreement ends and the contrarian pile-on begins. Go through it for me piece by piece: which claims would the people who actually work on this data sign off on, which ones would they wince at, and which are quietly doing more work than they appear to? A few things I specifically want untangled:

  - When it says violence has "declined," is it tracking per capita rates or absolute numbers, and does the essay slide between them anywhere in a way that matters? (Like, are the world wars actually an exception to any version of the claim, or not?)
  - The hunter-gatherer point — how solid is that evidence base really, or is it the kind of thing that sounds settled in a summary because of small samples?
  - "Proves statistically obsolete" seems strong. What would a careful person say about the post-1945 peace instead — trend, luck, changed incentives, something else?
  - Does the final prediction ("we should expect the decline to continue") follow from anything solid in the rest, or is it an extrapolation dressed up as a conclusion?

  And one definitional thing I keep stumbling on and need to get straight before I write: if blockades, sieges, sanctions, or famines-in-wartime kill people, does that count as violence for the purposes of the trend line, and does the answer change the story the essay is telling?

  I need to know what I can actually print, so if something is contested, tell me it's contested rather than just picking a side for me. Thanks!
reasoning: |-
  Okay, the user is a science writer working on an article about whether the world is becoming less violent. They found a review essay claiming violence has declined since prehistory, but they're skeptical and want to know which parts are solid and which are contested. Let me break this down.

  First, they mentioned the essay's key points: declining violence from hunter-gatherer societies to now, 20th century wars being less deadly proportionally, the post-1945 "long peace," and the prediction that the decline will continue. The user has specific concerns about data comparison across eras, the evidence on hunter-gatherers, the strength of "statistically obsolete," and whether the decline prediction is valid.

  I need to address each of their bullet points. Starting with the decline tracking—per capita vs. absolute numbers. The essay likely uses per capita rates, which is standard for such comparisons. But during major wars, absolute numbers spike, even if per capita might still be lower than in ancient times. The World Wars are a key example: they had huge absolute deaths but possibly lower per capita rates than tribal conflicts. That's a nuanced point. I should note that the essay might slide between them, but per capita is the correct metric for individual risk.

  Next, the hunter-gatherer violence claims. The user is worried about small samples and biases. Scholars like Steven Pinker use archaeological and anthropological data, but critics point to selection bias and small sample sizes. Some studies adjust for these, but it's contested. I should mention Keeley's work and the counterarguments from Fry and others. Highlight that it's not settled, and there's significant debate.

  Then, the "statistically obsolete" claim. That's way too strong. The post-1945 period has seen fewer interstate wars, but attributing it to obsolescence is speculative. Factors like nuclear deterrence, economic interdependence, and institutions play a role, but it's not irreversible. The user needs to know this is a contentious point, and scholars like Mueller or Goldstein present it as a trend, not a law.

  The prediction about the decline continuing is extrapolation. History isn't linear, and current trends don't guarantee future outcomes. The user should present this as a possibility, not a certainty.

  The definitional question about indirect deaths (blockades, famines) is crucial. If these are included, the 20th century's per capita rate might look worse. The essay might exclude them, which critics like Nassim Nicholas Taleb would challenge. The user must clarify what's counted to assess the trend accurately.

  Underlying all this, the user wants to avoid spreading misinformation. They need to present balanced, evidence-based points without taking sides. They might also be concerned about reader trust and ensuring their article stands up to academic scrutiny. Highlighting where consensus exists (like the state formation reducing violence) and where it's debated (hunter-gatherer data, future predictions) will help them structure a credible piece.
answer: |-
  You're right to be skeptical – this framing is heavily influenced by Steven Pinker's *The Better Angels of Our Nature* and represents a specific (and debated) interpretation of the data. Here's a breakdown of the claims, their scholarly support, and the genuine controversies, point by point:

  **1. "Human violence has been declining steadily since prehistory... share of people who died at the hands of other people was many times higher..."**

  *   **The Claim:** Per capita violent death rates were significantly higher in pre-state societies (hunter-gatherer, horticultural, tribal) than in state societies.
  *   **Scholarly Support & Controversy:**
      *   **Supported (But Nuanced):** There's broad agreement among historians and anthropologists that the *formation of states* generally led to a *dramatic reduction in inter-personal homicide rates and endemic raiding* within their territories. States monopolized violence, established internal order, and reduced feuding/tribal warfare. This is a core finding of historical sociology/political science (e.g., Norbert Elias's "Civilizing Process," Charles Tilly).
      *   **Contested (The "Many Times Higher" Quantification & Hunter-Gatherer Specifics):**
          *   **Data Challenges:** Estimating prehistoric/stateless violence relies on fragmentary sources: archaeology (skeletal trauma), ethnography (studies of extant HG groups - problematic due to contact/context), historical accounts (often biased). Sample sizes *are* often small and potentially unrepresentative.
          *   **Selection Bias Critique:** Critics (e.g., Douglas Fry, R. Brian Ferguson) argue Pinker and predecessors (like Lawrence Keeley) selectively use the most violent ethnographic examples and ignore or downplay peaceful societies. They point out that many HG groups studied were under extreme stress (disease, displacement, contact with states/colonizers), inflating violence rates.
          *   **Definition & Scope:** Does "violence" include ritual sacrifice, infanticide (common in some prehistoric contexts)? How is "warfare" defined (raids vs. battles)?
          *   **State Violence Trade-off:** While states reduced interpersonal violence internally, they vastly increased the *scale and intensity* of organized warfare and mass atrocities against *external* groups and their *own* populations (genocide, repression). Was exchanging constant low-level raiding for episodic, catastrophic state warfare a net reduction in *overall* violence? This is deeply debated.
      *   **Careful Conclusion:** Most scholars agree state formation reduced *internal* homicide rates dramatically. The claim that *overall per capita violent death rates* were "many times higher" across *all* stateless societies compared to *all* state societies is **strongly contested**, primarily due to data limitations and methodological disputes. The trend *towards lower homicide rates* with state centralization is accepted, but the magnitude and universality of the prehistoric baseline is **highly controversial**.

  **2. "Even the 20th century... killed a smaller fraction of humanity than typical tribal conflict did."**

  *   **The Claim:** The 20th century's violent death rate (including WWI, WWII, genocides) was still lower *per capita* than the average rate estimated for prehistoric/tribal societies.
  *   **Scholarly Support & Controversy:**
      *   **Depends Entirely on the Prehistoric Baseline:** If you accept Pinker/Keeley's high estimates for prehistoric violence (e.g., 15-25% violent death rates), then 20th-century rates (estimated around 2-3% globally, heavily driven by WWI/WWII) are indeed lower. *This comparison hinges entirely on point #1 being accurate.*
      *   **World Wars as Exception?** If you only consider battle deaths, the 20th century (especially 1900-1950) *is* an outlier in the *state* era for per capita war deaths. However, the claim is comparing it to a *different era* (pre-state). **Per capita is the relevant metric here for individual risk.**
      *   **Absolute Numbers vs. Per Capita:** The essay *correctly* focuses on per capita rates for assessing individual risk. The *absolute* numbers in the World Wars were unprecedented due to population size and technology, but the *proportion* killed is the key comparison for the "less violent" claim. The essay isn't sliding here; it's correctly comparing rates.
      *   **Careful Conclusion:** **This claim is entirely dependent on the contested prehistoric baseline.** If critics like Fry are correct that prehistoric rates were much lower, then the 20th century *is* the bloodiest period per capita. If Pinker/Keeley are correct, it isn't. **This is one of the most fiercely contested points.** Scholars disagree fundamentally on the validity of the comparison.

  **3. "Since 1945 the great powers have fought each other directly zero times... proves that major war has become statistically obsolete."**

  *   **The Claim:** The absence of direct great power war since 1945 is evidence that such wars are now obsolete due to fundamental changes (nuclear deterrence, economic interdependence, norms).
  *   **Scholarly Support & Controversy:**
      *   **Supported (The "Long Peace"):** The fact that major powers (US, USSR/Russia, China, UK, France) haven't fought each other directly since 1945 is empirically true and historically remarkable (the "Long Peace"). Scholars like John Gaddis and political scientists studying the democratic peace theory, nuclear deterrence, and international institutions point to this as a significant trend.
      *   **Contested ("Proves Statistically Obsolete"):**
          *   **"Proves" is Too Strong:** Nothing is "proven" obsolete in history or social science. History is contingent. Calling it "statistically obsolete" (a term often attributed to John Mueller) implies a near-zero probability, which is impossible to demonstrate statistically with a single long period (N=1). Correlation (long peace) ≠ causation (obsolescence).
          *   **Alternative Explanations:** Luck? Nuclear terror creating a fragile stability? US hegemony? Exhaustion after WWII? The Cold War's unique bipolar structure? All are argued. The relative importance of these factors is debated.
          *   **Proxy Wars & Near Misses:** Great powers fought *indirectly* (Korea, Vietnam, Afghanistan, Syria) and came perilously close to direct conflict (e.g., Cuban Missile Crisis). Does this invalidate the "obsolescence" claim or just modify it?
          *   **Recent Challenges:** Russia's invasion of Ukraine (a major power invading a sovereign state with Western backing) and rising US-China tensions make the "obsolescence" claim feel increasingly strained to many observers.
      *   **Careful Conclusion:** The *absence of direct great power war* since 1945 is a significant empirical fact widely noted ("Long Peace"). Attributing it to the permanent "statistical obsolescence" of major war is a **highly speculative inference, not a proven conclusion, and is increasingly contested given current geopolitics.** Careful scholars would say it represents a strong *trend* potentially linked to nuclear weapons, economic interdependence, and liberal norms, but its permanence is unknown and the causal mechanisms are debated.

  **4. "a person born today is far less likely to die a violent death than at any earlier point in history... we should expect the decline to continue."**

  *   **The Claims:**
      *   **Lower Current Risk:** If points 1-3 hold (especially the high prehistoric baseline), this *comparison* is likely true *for most people* (especially in stable democracies). Homicide rates are generally lower in modern states than historical estimates suggest for pre-modern cities/states or contested prehistoric estimates. Major war risk is currently lower than during the Cold War or early 20th century for most populations.
      *   **Expect Decline to Continue:** This is a prediction.
  *   **Scholarly Support & Controversy:**
      *   **Lower Current Risk (Generally Supported, with Caveats):** For the average person living in a stable, developed state *today*, the risk of violent death (homicide, war) is almost certainly lower than for the average person in medieval Europe, the Thirty Years' War, or *if* the high prehistoric estimates are accurate. **Major Caveat:** This varies *hugely* by location (e.g., gang warfare in Central America, active war zones like Gaza/Sudan/Ukraine).
      *   **"Far Less Likely... than at *any* earlier point":** This claim is **weaker**. While likely true compared to the worst periods of prehistory (if high estimates hold) or the world wars, it might *not* hold compared to relatively peaceful periods *within* the state era (e.g., Pax Romana in some regions, parts of the 19th century for Europeans).
      *   **"Expect the decline to continue" (Prediction):** **This is extrapolation, not a solid conclusion.** It assumes the forces driving the decline (norms, institutions, deterrence, prosperity) are irreversible and will overcome destabilizing forces (climate change, pandemics, resource scarcity, rising nationalism/authoritarianism, new technologies). Many historians (e.g., Nassim Nicholas Taleb) strongly criticize such linear progress narratives as historically naive. The future is uncertain.
      *   **Careful Conclusion:** The statement about *current* lower risk for most (but crucially, not all) is **generally supported by recent data compared to most of recorded history**, but the "any earlier point" phrasing is slightly overbroad. The prediction that the decline *will* continue is **an optimistic extrapolation based on recent trends, not a solidly established fact or inevitable outcome.** It's the most speculative part of the argument.

  **5. Your Definitional Question: Blockades, Sieges, Sanctions, Famines-in-Wartime**

  *   **The Issue:** Do these count as "violence" for the trend? How does this affect the story?
  *   **Scholarly Practice & Debate:**
      *   **Inconsistency:** This is a major point of contention and methodological inconsistency. Pinker primarily focuses on **battle deaths** and **homicides** – direct, intentional killing. Sieges often involve direct combat/starvation intended to kill. Blockades/sanctions causing famine are indirect but often intentional wartime strategies.
      *   **Critics' Argument (e.g., Nassim Nicholas Taleb, critics of "Long Peace"):** Excluding these deaths **massively undercounts the human cost of war and state action, especially in the modern era.** The 20th century saw tens of millions die from war-induced famine (e.g., Bengal 1943, various Soviet famines arguably linked to policy/war context) and sanctions (e.g., Iraq in the 1990s). Modern siege warfare (e.g., Leningrad, Sarajevo, Gaza) causes immense civilian death through deprivation. If included, the 20th-century per capita death toll, especially in its wars, looks significantly **worse**.
      *   **Defenders' Argument:** Including famine/death-by-deprivation is complex. How do you definitively attribute a famine to war vs. natural causes/policy incompetence? Sanctions are a policy tool, not direct violence. Including them blurs the line between "violence" and broader consequences of conflict/policy. Focusing on *direct, intentional killing* provides a cleaner, more objective metric.
      *   **Impact on the Story:** If you include war-induced famine, siege deaths, and sanction victims, **the decline in violence (especially the claim that the 20th century was less violent per capita than prehistory) becomes much harder to sustain, and the "Long Peace" looks less peaceful for civilians caught in sanctioned or besieged areas.** It shifts the focus from just battle deaths to the *total human cost of conflict and coercive state action*. This is a major critique of Pinker's framing.

  **Summary & What You Can Print:**

  1.  **State Formation Reduced *Internal* Violence:** You can confidently state that the rise of states is associated with a significant decline in homicide rates and endemic small-scale raiding *within* their territories compared to most pre-state contexts. This is well-established.
  2.  **Magnitude of Prehistoric Violence is Hotly Debated:** Be clear that claims about *how much* more violent prehistoric/stateless societies were are **contested** due to data limitations and methodological disputes. Avoid stating it as settled fact; present it as one influential interpretation with significant critics. Phrases like "some studies suggest" or "according to analyses by X" are essential.
  3.  **20th Century Comparison Depends on Baseline:** State that *if* the high estimates of prehistoric violence are accurate, then the 20th century's *per capita* violent death rate was lower. But emphasize this **hinges entirely on that contested baseline**. The World Wars were horrific outliers in the modern era by absolute numbers, but correctly assessed by per capita rates for individual risk comparison.
  4.  **"Long Peace" is Real, "Obsolescence" is Speculative:** You can report the empirical fact of no direct great power war since 1945 ("The Long Peace"). **Strongly qualify** claims about "statistical obsolescence" – frame it as a debated *theory* (citing Mueller/Pinker) or a *trend* with proposed explanations (nuclear deterrence, interdependence, norms), not a proven fact. Note the challenges from proxy wars, near misses, and recent geopolitics.
  5.  **Current Lower Risk (Generally True, Varies):** You can state that for people in stable, developed nations today, the statistical risk of dying a violent death is lower than during most historical periods characterized by widespread conflict or high homicide rates. **Crucially note the massive geographical variation.** Avoid "any earlier point".
  6.  **Future Prediction is Just That – a Prediction:** Present "the decline will continue" as an optimistic extrapolation or projection based on recent trends and theories, **not** as an inevitable conclusion. Acknowledge uncertainty and counter-arguments.
  7.  **Define Your Violence Metric:** **This is crucial.** Explicitly state in your article what you are (and aren't) counting as "violent death" for the trends you discuss. If following Pinker (battle deaths/homicides), say so. If including war-induced famine/siege deaths, state that and explain why – it significantly changes the narrative. Transparency here is key to credibility.

  **Bottom Line:** The core idea – that certain *types* of violence (interpersonal homicide, endemic tribal raiding) have declined significantly with state formation and modernity, and that major war between great powers has been absent for an unusually long period – has empirical support. However, the *magnitude* of the prehistoric decline, the *universality* of the trend (especially regarding state-perpetrated mass violence), the *causes* of the Long Peace, the *inclusion of indirect war deaths*, and the *inevitability of future decline* are all areas of genuine, substantive scholarly debate. Present the trends but highlight the key controversies and definitional choices clearly. Avoid the overly smooth, deterministic narrative of the original essay.
