prompt: |-
  In my ethics reading group we've spent three weeks on the demandingness objection to consequentialism, and I've come away troubled by a retort one member has now formalized — she calls it the reflexive version of the objection. Her claim is that the objection proves too much: it refutes not just consequentialism but any moral outlook containing anything like a duty of easy rescue, which is to say every moral outlook anyone has ever defended in earnest. The argument runs: (1) Consequentialism is false because it requires each of us to keep relieving preventable suffering until we reach the point of marginal utility — the point at which giving one more unit costs us as much welfare as it delivers to others. (2) Common-sense morality contains the rescue principle: whenever you can prevent something very bad at small cost to yourself, you must. (3) Taken case by case, the world's preventable suffering decomposes into an enormous sequence of rescue-principle cases, since each further small donation is, considered on its own, a small-cost prevention of something very bad. (4) What one is obligated to do is closed under conjunction: if you ought to do A and ought to do B, then you ought to do both. (5) So common-sense morality likewise requires giving to the point of marginal utility, and the demandingness objection, if sound against consequentialism, is fatal to common-sense morality too. (6) Since we are not about to conclude that common-sense morality is false, the objection is unsound — which is exactly what she wanted, being the group's token consequentialist.

  I can see where I'd like to dig in: step (4) looks like the weak plank, and I'd much rather keep the rescue principle than closure under conjunction. But I can't make the denial principled. If obligations don't aggregate, then someone facing five hundred individually obligatory rescues seems permitted to perform only some arbitrary subset, and the only alternative I can see is introducing a threshold — do "enough" rescues and you're off the hook — whose arbitrariness strikes me as worse than the disease (why does doing rescues 1 through 47 discharge you when rescue 48 sits there, as cheap and as urgent as the first?). And when I floated a fair-share view — my duties cap out at my share of the total burden, conditional on others doing theirs — she pressed back: that makes what morality demands of me hostage to how badly everyone else behaves, which she claims is just consequentialist aggregation wearing a cooperative disguise. Meanwhile another member insists the real flaw is earlier, in step (3): a cost can be small when counted one rescue at a time and enormous when counted together, so the rescue principle, read naturally, isn't blind to the total burden the way her decomposition assumes.

  So I want a diagnosis, not a team to join. Which premise or step should be rejected, and why did it look fine in the first place? In particular: is the closure premise actually false, or only false on some readings; is the "on its own" reading of the rescue principle an equivocation or a legitimate restriction; and what does each escape route cost — the threshold view's arbitrariness, the fair-share view's dependence on mass noncompliance, and whatever the holistic reading of cost has to pay? If you think the argument is valid and something plausible must simply be surrendered, say which premise is least costly to give up and what we lose with it.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're in an ethics reading group discussing the demandingness objection to consequentialism. One member, a consequentialist, presented a reflexive version of the objection arguing that the same objection that targets consequentialism also applies to any moral system with a duty of easy rescue because it would aggregate to overwhelming demands. The user is troubled by this and wants to identify the weakest premise to reject without falling into worse problems.

  First, I need to understand the argument's structure. The key premises are: (1) consequentialism is too demanding, (2) common-sense morality has a rescue principle, (3) global suffering decomposes into many small rescues, (4) obligations are closed under conjunction, leading to (5) common-sense morality is equally demanding, and thus (6) the objection must be unsound.

  The user mentions three potential escape routes: rejecting closure under conjunction (premise 4), interpreting costs holistically (challenging premise 3), or adopting a fair-share view. They also mention thresholds but find them arbitrary. Their main concern is to find a principled way to reject the argument without abandoning the rescue principle or accepting arbitrariness.

  Looking at premise 4, closure under conjunction. The user worries that denying it allows arbitrary omission of obligations. But maybe obligations aren't strictly agglomerative. For example, in deontological ethics, conflicting duties or practical impossibility might break agglomeration. However, in this case, the rescues aren't conflicting; each is individually feasible. So denying agglomeration here might seem ad hoc. The user's fear is that without agglomeration, one could skip some rescues arbitrarily, which feels morally wrong. So rejecting premise 4 might not be the best path.

  Next, premise 3's decomposition. The user's peer argues that costs are holistic. A single donation is small, but the cumulative cost is huge. The rescue principle might include an implicit "all else equal" clause, meaning the cost is considered in isolation. When multiple rescues are present, the cost isn't small anymore. This seems promising. For instance, giving $5 to save a child is small, but doing so for millions would be overwhelming. The rescue principle isn't meant to apply when the cumulative cost is high. The challenge here is explaining why the holistic view doesn't collapse into consequentialism, as the consequentialist in the group claims. If we consider cumulative costs, aren't we just doing aggregated calculus? But perhaps common-sense morality allows for agent-centered prerogatives, where personal projects and resources have moral weight beyond marginal utility.

  The fair-share view is another option. Each person is only obligated to do their part, assuming others contribute. But the consequentialist argues this makes obligations depend on others' non-compliance, which might be problematic. For example, if others don't contribute, your duty expands, which could be overdemanding. Also, determining a fair share might involve consequentialist calculations. However, this view aligns with collective responsibility models, which are intuitive in everyday morality, like voting or environmental actions. The downside is the coordination problem and potential free-riding.

  The user also mentions thresholds but rejects them due to arbitrariness. Finding a non-arbitrary threshold is tricky. Maybe a scalar consequentialist approach where obligations fade, but that's not common in deontology.

  Considering the costs of each escape route: 

  - Rejecting agglomeration might lead to arbitrary omissions and weaken the structure of obligations. It's metaphysically simpler but normatively unsatisfying.

  - Holistic costs preserve the rescue principle but require explaining why cumulative costs change the duty. This might introduce a form of aggregation but with agent-centered limits, avoiding full consequentialism.

  - Fair-share avoids individual overdemandingness but depends on others' actions, which can be unfair and complex to implement. It also risks under-demanding if others comply.

  The user wants to avoid team-joining, so the diagnosis should focus on premise 3 as the most defensible rejection. The "on its own" reading in premise 3 is an equivocation because the rescue principle's "small cost" is context-dependent. In a single instance, cost is small, but when aggregated, it's not, so the principle doesn't apply en masse. This preserves common-sense morality without collapsing into consequentialism by recognizing that costs aren't additive in isolation. The initial plausibility of premise 3 comes from ignoring the context of multiple obligations.

  The user's deeper need might be to reconcile intuitive moral duties with manageable demands without abandoning deontological constraints. They need a principled distinction between individual rescues and aggregated demands that doesn't rely on arbitrary thresholds or consequentialist aggregation. The holistic cost view does this by integrating the agent's broader context, which aligns with how people naturally assess obligations—considering their life as a whole rather than each act in isolation.
answer: |-
  Your group's token consequentialist has constructed a clever *reductio* that exposes genuine tensions in common-sense morality, but the argument isn't unassailable. The soundest diagnosis identifies **premise (3) as the critical weakness**, specifically its "decomposition" move and the interpretation of "small cost" atomistically rather than holistically. Here's a breakdown of why this premise fails, why it initially seems plausible, and the costs of alternative escape routes:

  ### 1. **Rejecting Premise (3): The Holistic Reading of Cost**
     - **Why it's false:** The rescue principle ("prevent very bad things at small cost to yourself") is context-sensitive. A cost that is "small" *when considered in isolation* may not be small *when aggregated across many similar obligations*. The principle inherently assumes an implicit *ceteris paribus* (all else equal) clause: it applies when the cost *to your overall life or projects* is genuinely minor *given your broader commitments and resources*. 
       - **Example:** Giving $5 to save a child from starvation is a "small cost" *on its own*. But if you face 10,000 such identical opportunities, the cumulative cost ($50,000) is *not* small for most people. The rescue principle doesn't demand you give the $5 in the 10,000th case because the cost *in that context* (depleting your savings, sacrificing essential goals) is no longer trivial. The "small cost" must be assessed relative to your *total* circumstances, not each act in isolation.
     - **Why it looked plausible:** The decomposition in (3) exploits an ambiguity in "small cost." When we consider rescue cases *individually*, the cost *appears* small because we artificially bracket out the cumulative impact. This bracketing is psychologically natural (we evaluate cases one-by-one) and rhetorically effective, but it misrepresents how moral reasoning works. Obligations arise within the holistic context of an agent's life, not in a vacuum.
     - **Cost of this escape route:**
       - **Loss of Simplicity:** Atomistic evaluation is intuitive; holistic assessment is messier and requires judgment about "overall cost" and personal thresholds.
       - **Risk of Consequentialist Drift:** Critics (like your consequentialist) argue this holistic view smuggles in aggregation—assessing "overall cost" seems like calculating net welfare impact. However, it need not be purely consequentialist. Common-sense morality can ground holistic cost in **agent-centered prerogatives** (e.g., you have a right to pursue personal projects) or **moderate deontology** (e.g., duties have diminishing stringency when aggregated). The key distinction: consequentialism *maximizes* good, while holism merely *limits* sacrifice to preserve core agency.
       - **Potential for Under-Demandingness:** If "overall cost" is interpreted too subjectively, it could excuse inaction. But common-sense morality already accepts reasonable limits (e.g., you needn't sell your house to save one life).

  ### 2. **Assessing Other Escape Routes**
  While rejecting (3) is strongest, let's evaluate the alternatives you discussed, as they illuminate the stakes:

  - **Rejecting Premise (4): Closure Under Conjunction (Agglomeration)**
    - **Why it might be false:** Obligations aren't always agglomerative. **Reasons:** 
      - **Overdemandingness:** If agglomeration holds, any finite set of trivial obligations could become crushing (e.g., replying to every email you "ought" to answer).
      - **Conflicting Obligations:** If "ought A" and "ought B" conflict practically (e.g., saving two people in opposite directions), agglomeration fails. While rescues here *seem* non-conflicting, cumulative cost *creates* a conflict with self-regarding interests.
      - **Scalar Morality:** Some argue "ought" is scalar (stronger/weaker reasons) rather than binary (obligatory/not). Doing *some* rescues may be obligatory without requiring *all*.
    - **Why it looked plausible:** In simple cases ("ought to feed your child" and "ought to not steal"), agglomeration holds. Denying it *seems* to permit arbitrary omissions.
    - **Cost:** 
      - **Normative Arbitrariness:** If agglomeration fails, *how many* rescues must you do? Without a threshold or holistic cost, omissions *are* arbitrary. This is the "worse than the disease" problem you noted.
      - **Metaphysical Cost:** Rejecting agglomeration complicates deontic logic and weakens the structure of obligation.

  - **Adopting a Threshold or Fair-Share View**
    - **Threshold View:** You're obligated to prevent "enough" suffering until a threshold (e.g., significant sacrifice) is reached.
      - **Cost:** The **arbitrariness problem** you identified is fatal. Why 47 rescues and not 48? Thresholds lack a principled non-consequentialist foundation.
    - **Fair-Share View:** Your duty caps at your fair share, conditional on others contributing.
      - **Cost:** **Dependence on non-compliance** is the major flaw. If others shirk their duty, your obligation doesn't increase—letting preventable suffering occur. This clashes with the urgency of individual rescues (e.g., if others refuse to save a drowning child, you still must). Your consequentialist is partly right: this *can* feel like disguised aggregation, as "fair share" often relies on maximizing overall welfare.

  ### 3. **Why Premise (3) is the Best Target: A Summary**
  - **Diagnosis:** Premise (3) equivocates on "small cost." It uses an *atomistic* reading ("small per act") to trigger the rescue principle, but ignores the *holistic* reality that costs aggregate. The rescue principle, properly understood, asks: "Is this cost small *given my total circumstances*?" When cumulative donations reach a point threatening your welfare or autonomy, the cost *isn't* small, and the principle no longer applies.
  - **What We Lose:** We sacrifice the illusion that moral mathematics is always simple and additive. We must accept that obligations are sensitive to context, requiring judgment about "reasonable sacrifice." However, this is already embedded in common-sense morality (e.g., duties of beneficence are limited by "saturation points").
  - **What We Gain:** We preserve the core rescue principle *and* avoid catastrophic demandingness without collapsing into arbitrariness or dependence on others' failures. The consequentialist's *reductio* is defanged because common-sense morality has resources to resist the decomposition.

  ### Final Thought
  Your consequentialist is right that common-sense morality isn't immune to demandingness worries—but her argument overreaches by ignoring how moral principles interact with human finitude. The holistic view doesn't surrender to consequentialism; it reflects a deeply held intuition that morality, while demanding, cannot reduce life to a calculus of marginal utility. As a diagnosis: **premise (3) fails because it misapplies the rescue principle by neglecting the contextual assessment of "small cost."** This is where the argument cracks, and it's the crack common-sense morality can exploit without inconsistency.
