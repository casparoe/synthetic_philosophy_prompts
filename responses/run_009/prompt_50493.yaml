  1. Unilateralist's curse: The action (e.g., disclosure) can be taken by any single member, so even if most think it's a bad idea, one person acting on their own can cause harm.
  2. Bystander problem: If everyone must agree, then inaction can be harmful when action is needed.

  The procedure must:
  - Include a checklist of questions in a logical order (cheap factual ones first).
  - Define clear termination points: "no", "green light", or "punt to committee".
  - Address the asymmetry by requiring a higher confidence threshold for the acting researcher (a personal-confidence discount).
  - Have an escape valve for cases where delay becomes harmful (e.g., a deadline after which the default is to act).
  - Be honest about where it's just laundering judgment calls.

  We'll structure the procedure as a decision tree. The key idea for the confidence discount: since only one person needs to be wrong for harm to occur, we require the acting researcher to have a high level of confidence (we'll set a threshold, say 90%) that the action is net positive. For judgments that are not purely factual, we'll require committee review.

