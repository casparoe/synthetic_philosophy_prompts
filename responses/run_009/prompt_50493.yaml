prompt: |-
  hey so quick background before the ask: I run a small infosec research group at a university, about ten people, grad students through senior researchers, and we have a recurring problem that I only recently found a name for. apparently it's called the "unilateralist's curse" (from some AI-risk-adjacent literature I got pointed to, Bostrom and others I think — I'm probably mangling it, apologies): when a bunch of agents each have the power to take some action, and every one of them would prefer the action NOT be taken if it's going to be net bad, the action still gets taken as long as just one person privately thinks it's a good idea — even a small difference in individual judgment is enough, because each person's veto is worth nothing if any other person can act. the flip side is the bystander problem: if you make acting require everyone's sign-off, nothing ever gets done, including the actions that would clearly make the world better (like actually telling a vendor about a hole so it gets patched). we keep living both versions: one of my postdocs once posted a full proof-of-concept exploit on his personal blog because he was 55% sure disclosure was fine, half the lab disagreed, and the ensuing drama almost broke the group; meanwhile a genuinely important disclosure about an exposed database sat in someone's drafts for two months because nobody felt entitled to be the one to push send.

  what I want from you: act as an expert in research ethics and collective action (the disclosure dilemma, dual-use research, that whole literature) and build me an actual decision procedure my team can run — a checklist with the questions in order, what counts as a sufficient answer to each question, and crucially where the procedure terminates in a "no, don't publish this, here's why," where it terminates in a green light without further review, and where it has to punt to a person or a small committee because the question is one of values or judgment rather than facts. ground it in the curse itself: I want the procedure to be explicit about the asymmetry between "I think this is fine" and "this is fine given that only one of us needs to be wrong for it to happen," i.e. some kind of personal-confidence discount the acting researcher should apply — think carefully about what that discount should look like and whether a fixed number is even defensible. it also needs an escape valve for the bystander version: a rule for when holding something back too long is itself the unilateral action (someone else finds the hole, or it's exploited in the wild while we sat on it), and what the default should be after some deadline passes. be honest about the places where the procedure can only launder a judgment call into officious-sounding steps, since I'd rather know where the theater is.

  then please run the procedure on three concrete cases so I can see whether it actually works: (1) the zero-day in a widely used open-source library where the vendor has ignored us for 90 days and the researcher wants a full-disclosure post with working exploit code, (2) a grad student who wants to live-demo a hack of a popular smart doorbell at a conference with the exploit details in the slides, and (3) a case I'm including specifically because I expect to hate the answer — a student who found a way to mass-enumerate misconfigured servers that also happens to be usable for surveillance, and wants to publish the method itself. for each, show the path through the tree and where it comes out, and for at least one case tell me where you think the procedure gives the wrong or at least unpalatable answer and what you'd override by hand. and at the end, one honest paragraph on the whole thing: what the procedure is doing well, and the single most likely way my team will learn to game it. take your time and maybe brainstorm the question ordering before you commit to it — the order matters, since cheap factual questions should knock out obvious cases before anything expensive (like a committee meeting) gets triggered. no need for a lit review or citations, I've got the reading covered, I just need the machine.
