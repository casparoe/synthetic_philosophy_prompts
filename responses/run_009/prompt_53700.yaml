prompt: |-
  Quick bit of background: I'm a backend engineer, zero formal philosophy. A guy on my team who did a philosophy MA keeps bringing up "eliminative materialism" at lunch — the Churchlands' position that beliefs and desires don't really exist, that everyday mental-state talk is just "folk psychology" that's headed the same way phlogiston or witch-mass went once real neuroscience rolls in. The way he explains it, I can't help hearing something I deal with every week at work: some legacy API that half our internal clients still call, sitting on top of an implementation we've already rewritten, where the endpoints only made sense in terms of the old architecture and nobody pretends the names describe what actually happens anymore — but the callers keep working, so we keep the compatibility layer.

  So here's what I want: restate eliminative materialism for me in my vocabulary — deprecation, compatibility layers, reverse-engineered interfaces, refactors that break callers, integration tests that keep passing for the wrong reasons. And then the residue report: which parts of the claim map cleanly onto all that, which parts you'd have to distort to make them fit, and whether anything in the philosophers' debate has no software counterpart at all — my candidate is that beliefs seem to be *normative* somehow, they can be justified or held irrationally, and I genuinely can't think what that would be for an API. Then tell me whether the residue points at something my vocabulary can't say, or at the claim being less clear than my coworker makes it sound. He also mentioned there are nearby positions (I remember something about "revisionary" vs. "eliminative" and something called intertheoretic reduction) that I'm probably flattening together, so flag where I'm doing that too.

  Format request, since I'll be honest that I'll skim this on a train: give me exactly five numbered items, each one or two sentences, no intro, no conclusion. Within each item, keep what's actually settled among people who know this literature separate from what's a live fight — if something is contested, say so plainly instead of handing it to me as the consensus, because my coworker absolutely will call me out if I repeat a contested reading as if it were textbook.
reasoning: |-
  Okay, the user is a backend engineer with no formal philosophy background. Their teammate, who has a philosophy MA, keeps talking about eliminative materialism (EM) during lunch. The user is trying to relate this to software concepts they're familiar with: legacy APIs, compatibility layers, refactoring, etc. They want EM explained in their terms, plus what fits well, what doesn't, and if there are gaps where philosophy has no software counterpart. They also mentioned nearby positions like revisionary materialism and intertheoretic reduction that they might be conflating.

  First, I need to break down eliminative materialism using software analogies. The core idea of EM is that folk psychology (beliefs, desires) is like a legacy system—outdated but still in use. The Churchlands argue it should be replaced entirely by neuroscience, similar to deprecating an old API. 

  For the mapping, the compatibility layer analogy works for how folk psychology persists despite being inaccurate. The rewrite/refactor part aligns with EM's call for replacement. But the normative aspect of beliefs (justified vs. irrational) doesn't have a clear counterpart in APIs. APIs don't have truth values; they just function or fail. This is a key difference and might point to a limitation in the software analogy.

  The user also mentioned conflating EM with revisionary materialism and intertheoretic reduction. I should clarify that EM is eliminative, not just reductive. Reduction would be like refactoring while maintaining interfaces, whereas EM wants to remove the old system entirely. This distinction is important because their teammate might correct them on it.

  The residue report needs to highlight where the analogy breaks. The normative aspect is a big one. Also, the debate among philosophers about whether folk psychology can be reduced or must be eliminated is contested. I should note that there's no consensus, which the user emphasized—they don't want contested points presented as settled.

  Finally, structuring the response in five numbered items as requested. Each point should be concise, separating settled ideas from live debates. Make sure to flag where the software analogy fits, where it doesn't, and clarify the differences between EM and related positions. Also, address whether the normative residue indicates a vocabulary gap or unclear claims.
answer: |-
  Here's the breakdown per your request:

  1.  **Core Analogy:** Eliminative Materialism (EM) posits that "folk psychology" (FP) – our everyday talk of beliefs, desires, and intentions – is like a **deprecated legacy API**. It functions *well enough* for basic social interaction (like a compatibility layer keeping old callers working), but fundamentally misrepresents the underlying implementation (the brain). EM argues FP will be **fully deprecated and removed** once neuroscience matures, just like obsolete APIs are eventually sunset when a superior, incompatible system (neuroscience) replaces the old architecture.
  2.  **Clean Mapping:** The persistence of FP despite its inaccuracy maps directly to **maintaining a compatibility layer** because it serves current needs, even though everyone knows the endpoint names (e.g., "belief") don't reflect the actual processes. The EM claim that FP is fundamentally *wrong* maps to realizing the legacy API's documentation/specification (FP theory) is deeply flawed and doesn't correspond to the rewritten implementation.
  3.  **Normative Residue & Software Gap:** The **normative dimension** of beliefs (justified/unjustified, rational/irrational) has **no clean software counterpart**. APIs don't have "truth" or "rationality"; they either function according to spec or they don't (success/failure). This residue highlights a fundamental difference: FP isn't *just* a functional description but involves evaluative norms. EM struggles to explain how purely physical brain states can be "irrational," making this a major point of contention.
  4.  **Conflation Alert (Eliminative vs. Reduction/Revision):** You're likely flattening **EM** (full elimination of FP categories) with **Intertheoretic Reduction** (mapping FP concepts like "belief" onto precise neural states, akin to a **refactor maintaining backwards compatibility**) and **Revisionary Materialism** (keeping core FP *functions* but radically altering their implementation/description, like a major version change). **This distinction is fiercely contested:** EM insists FP is *too wrong* to reduce/revise, while opponents argue reduction/revision is viable.
  5.  **Settled vs. Contested:** It's **settled** that EM proposes FP is a *false theory* destined for replacement, analogous to obsolete scientific theories. It's **heavily contested** whether neuroscience *will* or *can* eliminate FP categories (vs. reducing/revising them), whether FP is *irredeemably* false (or just incomplete), and crucially, whether EM can adequately account for **normativity and intentionality** (the "aboutness" of beliefs) – this last point remains the most potent objection, with no software parallel.
