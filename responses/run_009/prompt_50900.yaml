  # bound.js v3.0: Asynchronous Obligation Management

  ```bash
  npm install bound@3.0
  ```

  ## What is a Promise?

  A `Promise` is an object representing the eventual completion (or failure) of an asynchronous operation and its resulting value. It serves as a placeholder for a value not yet known, allowing you to associate handlers with an asynchronous action's eventual success or failure.

  More fundamentally, a Promise constitutes a binding commitment between the initiating agent (the executor) and dependent parties (consumers). When you create a promise via `new Promise(executor)`, you enter into an obligation to eventually resolve or reject the operation, establishing a normative expectation structure across execution contexts.

  ```javascript
  // Technical obligation initialization
  const p = new Promise((resolve, reject) => {
    // The executor's moral and operational duty begins here
    performAsyncWork((err, data) => {
      if (err) reject(err);  // Obligation violation
      else resolve(data);    // Obligation fulfillment
    });
  });
  ```

  **Key Characteristics**  
  - **State**: Pending → Fulfilled | Rejected (irreversible moral progression)  
  - **Immutability**: Once settled, the promise's value cannot change (unlike human intentions)  
  - **Thenability**: Consumers may attach `.then()` handlers to receive resolution  

  ## The Binding Problem (v3.0 RFC-192)

  A recurring question: why does creating a promise *obligate* the creator to resolve it? We've attempted to derive this constraint from first principles:

  ```typescript
  interface Promise<T> {
    // Type theory cannot enforce resolution! 
    // Compiler cannot prove executor WILL call resolve()
  }
  ```

  **Findings**:  
  - **Attempt 1**: Static analysis fails (halting problem)  
  - **Attempt 2**: Runtime enforcement requires infinite loop detection (undecidable)  
  - **Attempt 3**: Social consensus ("everyone knows you SHOULD call resolve() eventually")  

  *Conclusion*: The binding force arises from consumer expectations, not technical constraints. Violations cause `.then()` handlers to wait indefinitely – a computational limbo equivalent to moral failing.  

  ## Multiple Dependents: `Promise.all` vs `Promise.race`

  ### Promise.all(iterable)
  Aggregates multiple promises into a single obligation. Resolves when *all* promises fulfill; rejects if *any* fail.

  **Obligation implications**:  
  ```javascript
  const [userPromise, invoicePromise] = [fetchUser(), fetchInvoices()];

  // Single obligation to two dependents
  Promise.all([userPromise, invoicePromise])
    .then(([user, invoices]) => {
      // Fulfills both dependents atomically
    })
    .catch((err) => {
      // One failure voids collective obligation
    });
  ```
  *Philosophical note*: When three `.then()` handlers attach to one promise, is it one obligation (to the value) or three (to each handler)? We implement as *single-value obligation* – handlers share the outcome, but create distinct moral burdens.

  ### Promise.race(iterable)
  Resolves/rejects as soon as *any* promise in iterable settles.

  **Ethical quandary**:
  ```javascript
  const timeout = new Promise((_, reject) => 
    setTimeout(() => reject(new Error("Timed out")), 5000)
  );

  Promise.race([fetchData(), timeout])
    .then(data => use(data)) // Winner fulfills all
    .catch(() => abort())    // Losers become irrelevant
  ```
  *Warning*: Unsettled promises remain obligated! The race winner doesn't absolve losers – they still MUST resolve or reject independently.  

  ## FAQ

  ### What happens if I break a promise?
  ```markdown
  #### v1.0 Answer:
  Nothing. The promise remains pending indefinitely. Garbage collection may eventually reclaim it.

  #### v2.3 Edit (Community Contribution):
  Technically nothing, but:
  - `.then()` handlers never execute
  - `.catch()` never fires
  - Async stack traces become meaningless
  You create Schrödinger's outcome – neither success nor failure. This is widely considered harmful.

  #### v3.0 Amendment:
  You break the event loop's trust model. While no runtime exception occurs, you violate the fundamental covenant of asynchronous coordination. Dependent operations remain in existential stasis, consuming memory while awaiting resolution. This is why we can't have nice things.

  #### v3.0-hotfix-2 Revert:
  Per legal counsel: "The library takes no position on moral outcomes." Code-wise: nothing happens.
  ```

  ## Migrating from Callbacks (An Anthropological Study)

  Pre-promise callback patterns reveal how implicit obligations emerge from convention:

  ```javascript
  // Pre-bound.js era (circa 2010)
  function callbackAPI(fn) {
    performWork((err, data) => {
      // Obligation arises through convention:
      // 1. Error-first signature
      // 2. Single callback invocation expectation
      // 3. Mutual understanding of "once" semantics
      if (err) fn(err, null); // Cultural rejection
      else fn(null, data);    // Cultural fulfillment
    });
  }
  ```

  **Migration Guide**:  
  | Callback Pattern          | bound.js Equivalent        | Obligation Upgrade                     |
  |---------------------------|----------------------------|----------------------------------------|
  | `fn(err, data)`           | `promise.then().catch()`   | Implicit → Explicit                    |
  | `if (err)` checks         | `.catch()` chaining        | Error handling as first-class citizen  |
  | Callback invocation guards| Promise immutability       | Single-settlement enforces commitment  |

  **Key Insight**: Callbacks relied on tribal knowledge to enforce obligations. Promises institutionalize these expectations through object encapsulation.

  ## Deprecated Methods

  ### `.forgive()`
  *(Removed in v3.0, but available via `bound/legacy` plugin)*

  ```javascript
  promise.forgive(); // Marks promise as morally absolved
  ```

  **History**:  
  - v1.1: Introduced to allow abandoned promises without memory leaks  
  - v2.0: Removed after outcry ("absolution undermines obligation integrity!")  
  - v2.7: Re-added as plugin due to popular demand ("sometimes I change my mind!")  
  - v3.0: Core team position: "Technical forgiveness encourages moral hazard. Use `Promise.race([p, timeout])` instead."

  **Current Status**:  
  The method persists in legacy builds due to existential debates about whether unresolved promises constitute sin or technical debt. Core maintainers refuse to discuss it further.

  ---

  **Changelog v3.0**  
  - BREAKING: Remove `.forgive()` from core (install `@bound/forgiveness` instead)  
  - FIX: `Promise.all` now properly tracks obligations to late-attached handlers  
  - DOCS: Clarified moral implications of uncatchable promises  
  - PERF: Reduced metaphysical overhead in chained promises by 14%  

  ```bash
  npm install bound@3.0 --save-exact
  ```
