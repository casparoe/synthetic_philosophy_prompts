  ### The Nesting Game: Experiencing Rigidity and Flexibility  
  **Objective:** Students experience condition-triggered rigidity ("sphexishness") and incremental flexibility through a cooperative task, then debate whether human flexibility differs in *kind* (free will) or *machinery* (complex subroutines) from instinct-driven behavior.  

  ---

  ### **Materials List**  
  - **15 role cards** (3 copies of each tier × 5 roles per round; see scripts below).  
  - **15 index cards** (for script details; one per player).  
  - **30 exception tokens** (e.g., paper clips; 2 per Tier 2 player).  
  - **1 whiteboard** (to track rule amendments and points).  
  - **5 prey objects** (e.g., books or water bottles; one per player station).  
  - **Tape** (to mark start, checkpoint, and burrow at each station).  
  - **Timer** (for rounds and debrief).  
  - **Score sheet** (for facilitator; tracks points per player).  

  ---

  ### **Setup (5 min)**  
  1. **Arrange Stations:** Create 5 identical "wasp nest" stations in the room. Each has:  
     - **Start point** (tape mark): Where prey begins.  
     - **Checkpoint** (tape mark, 2m from burrow): Where prey is left temporarily.  
     - **Burrow** (table/chair): Where prey must be delivered.  
  2. **Assign Teams:** Divide students into 5 teams of 3. Each team has a station.  
  3. **Distribute Materials:** Place one prey object at each start point.  

  ---

  ### **Activity Rules**  
  - **Goal:** Deliver prey to burrow as many times as possible in 5 minutes.  
  - **Point System:**  
    - Successful delivery: **+10 points**.  
    - Tier 2: Exception token used: **−3 points** (tokens are depletable; 2 tokens/player).  
    - Tier 3: Rule proposal: **−5 points** (even if rejected).  
    - *No points for Tiers 1/4 beyond deliveries.*  
  - **Tiers of Flexibility:**  
    - **Tier 1 (Pure Script):** Must follow script rigidly (no deviations).  
    - **Tier 2 (Tokens):** Follow script but may use 2 tokens to skip/alter one step.  
    - **Tier 3 (Rule Amendment):** Follow script but may propose one new *standing rule* to teammates (e.g., "Skip inspection if prey moved"). Requires majority team vote. If passed, rule replaces script.  
    - **Tier 4 (Unconstrained):** No script; any strategy allowed.  
  - **Perturbation Schedule:**  
    - When a scripted player (Tiers 1–3) reaches step 3 (inspecting burrow), facilitator moves their prey **1m away from checkpoint**.  
    - Perturb *every time* the player enters step 3 to ensure looping.  
    - For Tier 4, perturb *only* if they leave prey unattended at checkpoint.  

  ---

  ### **Script Cards (Tiers 1–3; Read Aloud to Players)**  
  **All scripted players (Tiers 1–3) follow this routine:**  
  1. Move prey from **START** to **CHECKPOINT**.  
  2. Leave prey at **CHECKPOINT**.  
  3. Go to **BURROW**. Inspect it by **tapping 3 times**.  
  4. Return to **CHECKPOINT**.  
  5. **IF prey is at CHECKPOINT**, move it to **BURROW** (+10 points).  
     **IF prey is NOT at CHECKPOINT**, move it back to **CHECKPOINT** and **RETURN TO STEP 3**.  

  **Additional Tier-Specific Rules:**  
  - **Tier 2:** "You have 2 tokens. To use one, say ‘TOKEN’ and alter one action (e.g., skip step 3). Each token costs 3 points."  
  - **Tier 3:** "You may propose one rule change. Say ‘PROPOSE RULE’ to pause the timer. Explain your rule to teammates (1 min). Majority vote decides. Costs 5 points."  
  - **Tier 4:** "No script. Get prey to burrow however you want."  

  ---

  ### **Timeline (75 min Total)**  
  **0:00–0:05 — Introduction**  
  - "Today, we’re playing a game about problem-solving. In teams of 3, one of you will be the Player each round. Players: Deliver prey to the burrow as many times as possible in 5 minutes. Observers: Support your player if asked. No terms like ‘free will’ yet—we’ll discuss after."  

  **0:05–0:10 — Round 1 Setup**  
  - Assign roles: 1 player per team (5 total). Randomly assign tiers: 2× Tier 1, 1× Tier 2, 1× Tier 3, 1× Tier 4.  
  - Give each player their script card and tokens (if applicable).  

  **0:10–0:15 — Round 1**  
  - Start timer (5 min). Players begin. Facilitator perturbs scripted players per schedule.  
  - **Key moment:** After first delivery, perturb to induce loops. Tier 3–4 may innovate.  

  **0:15–0:20 — Round 2 Setup**  
  - New players (rotating roles). Reassign tiers (same distribution). Reset prey.  

  **0:20–0:25 — Round 2**  
  - Repeat gameplay.  

  **0:25–0:30 — Round 3 Setup**  
  - Final rotation of players. Same tier distribution.  

  **0:30–0:35 — Round 3**  
  - Final gameplay.  

  **0:35–0:40 — Reset & Tally Points**  
  - Announce scores. Reset room.  

  **0:40–1:15 — Debrief (35 min)**  

  ---

  ### **Debrief Protocol**  
  **Goal:** Map activity to philosophy, forcing the "kind vs. machinery" question.  

  1. **Experience Sharing (5 min):**  
     - Ask players: "How did it feel to be in Tier 1? Tier 2? Tier 3? Tier 4?"  
     - Highlight moments of frustration (looping), token use, or rule changes.  

  2. **Map to Wasp Anecdote (10 min):**  
     - "In the wasp story, the wasp loops because it can’t adapt when prey is moved. How did our scripted players mirror this?"  
     - Note the **restart trigger** (step 5 → step 3) as the wasp’s re-inspection loop.  
     - Ask: "Did any scripted players *adapt* despite rigidity? What does this say about Keijzer’s critique of the wasp anecdote?"  

  3. **Flexibility as Incremental Machinery (10 min):**  
     - **Tier 1:** Pure stimulus-response (prey moved → restart routine).  
     - **Tier 2:** Tokens as "meta-monitoring" (costly override for exceptions).  
     - **Tier 3:** Rule amendment as "re-describing the situation" (e.g., "Prey moves mean skip inspection").  
     - **Tier 4:** Unscripted but still goal-driven (avoiding perturbation ≠ "free").  
     - **Pivot question:** "When Tier 4 skipped the loop, was that *freedom* or just better subroutines? Is there a line where machinery becomes freedom?"  

  4. **Kind vs. Mechanism Debate (10 min):**  
     - "Is Tier 4’s behavior *qualitatively different* from Tier 1’s, or just more complex? Does calling Tier 4 ‘free’ draw a principled line, or is it flattery?"  
     - Challenge: "If freedom is just subroutines for self-monitoring, how are we different from a wasp with better hardware?"  
     - Return to disputed wasp data: "Our ‘adapted’ players show rigidity isn’t absolute. Does that weaken the wasp as an anti-free-will emblem?"  

  ---

  ### **Predicted Failures & Remedies**  
  1. **Scripts Too Confusing:**  
     - *Risk:* Players misread cards (e.g., missing restart trigger).  
     - *Remedy:* Pre-round dry run. Facilitator: "Show me step 1... step 2..." before starting.  

  2. **Slipping Out of Role:**  
     - *Risk:* Tier 1 players "cheat" by skipping steps (human reflex to avoid loops).  
     - *Remedy:* Strict enforcement: "Breaking script voids points." Remind observers to monitor.  

  3. **Tier Dominance:**  
     - *Risk:* Tier 4 dominates points, making flexibility seem "always better."  
     - *Remedy:* Highlight trade-offs: "Tier 3 paid 5 points to amend rules—was it worth it? Tier 2 burned tokens quickly." Ask: "If tokens cost 10 points, would you still use them?"  

  ---

  ### **Honest Limitations**  
  > "This activity *stipulates* meta-monitoring constraints (e.g., Tier 1 players ‘cannot’ override scripts) but cannot *reproduce* their absence. Real players are humans who:  
  > - **Know they’re in a game** (undercutting the wasp’s unconsciousness),  
  > - **Anticipate the facilitator** (unlike instinct-driven creatures),  
  > - **Deliberate internally** even while ‘rigidly’ following scripts.  
  >   
  > Thus, the design leaves untouched:  
  > 1. **The hard problem of free will:** Whether *any* human act (even Tier 4’s) escapes causal determinism.  
  > 2. **Compatibilism vs. incompatibilism:** If freedom is just ‘uncoerced choice,’ does Tier 4 qualify?  
  > 3. **Phenomenology:** The *feeling* of freedom in Tier 4 vs. the wasp’s blind compulsion.  
  >   
  > Discussion must address these gaps: The activity isolates the ‘engineering question’ (machinery), but broader debates require philosophical argument."  

  ---  
  **Outcome:** Students exit with visceral insight into sphexishness and a grounded framework for debating free will’s "spark" vs. "machinery." The activity’s flaws become discussion fuel, not bugs.
