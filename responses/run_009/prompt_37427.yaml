answer: |-
  ## Memorandum: Recommendation on Cobb Avenue Renaming  
  **To:** Commemorative Names Review Panel  
  **From:** [Your Name/Chair], Panel Member  
  **Date:** October 26, 2023  
  **Subject:** Final Recommendation & Rationale for Cobb Avenue  

  After thorough deliberation on the legacy of Mayor Hollis Cobb and the three unresolved questions posed by the panel, this memo recommends **full renaming of Cobb Avenue, coupled with relocation of the "Cobb" name and its full historical context (including the clearance) to a dedicated interpretive exhibit at the City Museum or Historical Society.**  

  ### 1. Resolution of Core Questions  
  **a) The Honorific Question ("Stranger Test"):**  
  *   **Recommendation:** Reject the "stranger test."  
  *   **Rationale:** While many residents may be unaware of Cobb, the name remains an *institutional* act of honor by the city. Forgetting is not absolution; it is often a symptom of historical erasure that compounds the original harm. For descendants of the displaced, the name is not inert—it is a visceral reminder of injustice embedded in geography they navigate daily. Renaming is not about policing private thoughts but correcting a public endorsement. The "stranger test" proves too much: it would immunize all but the most recently controversial names from review, regardless of their original intent or ongoing impact.  

  **b) The Record Question (Street as Document vs. Compulsory Speech):**  
  *   **Recommendation:** Retaining the name with an interpretive installation is insufficient.  
  *   **Rationale:** The asymmetry is fundamental. An interpretive plaque is *opt-in* engagement for those seeking history. A street name is *compulsory* public speech: residents must use it for navigation, addresses, and official documents, functionally invoking Cobb regardless of intent or knowledge. A plaque cannot neutralize this daily, state-enforced utterance. Preserving the historical record is vital, but the street itself is the wrong medium—it prioritizes archival function over the lived experience of harm.  

  **c) The Divisibility Question (Pro Tanto Honor):**  
  *   **Recommendation:** Honor is not divisible in this context.  
  *   **Rationale:** Honoring Cobb "in part" unavoidably honors the *man*, whose own correspondence reveals he saw the violent clearance as his defining achievement. A plaque condemning the zoning while praising the parks creates a false equivalency and sanitizes his legacy. It asks the public, and especially descendants, to engage in cognitive dissonance: to simultaneously celebrate and condemn the same person daily via his name. True accountability requires acknowledging the totality of his record *without* perpetuating the honorific.  

  ### 2. Concrete Recommendation & Implementation  
  *   **Recommendation:**  
      1.  **Rename Cobb Avenue** through the city's established public process. The new name should reflect community input, prioritizing reconciliation (e.g., names honoring displaced neighborhoods, figures who resisted the clearance, or aspirational values).  
      2.  **Relocate the "Cobb" Name & Context:** Partner with the Historical Society to create a prominent, permanent exhibit titled *"The Legacy of Hollis Cobb: Progress and Injustice."* This exhibit must:  
          *   Detail *both* the civic achievements (water system, parks, civil service) *and* the racial zoning ordinance, neighborhood clearances, displacement, and Cobb's own stated pride in this act.  
          *   Feature primary sources (maps, correspondence, photos of displaced families/residences).  
          *   Explicitly state *why* the street was renamed.  
          *   Be co-designed with descendants and historians.  
  *   **Implementation Timeline (Sample):**  
      *   Month 1-2: Initiate renaming process (public notice, call for suggestions, formation of inclusive advisory group including descendants).  
      *   Month 3: Historical Society begins exhibit design in consultation with descendants/historians.  
      *   Month 4-5: Public hearings/voting on new street name (if required by ordinance).  
      *   Month 6: Council vote on renaming & approve exhibit funding/design.  
      *   Month 7-9: Physical street renaming (signage, address updates).  
      *   Month 10: Exhibit opening at City Museum/Historical Society.  

  ### 3. Strongest Consideration on the Losing Side (Retention with Interpretation)  
  The most compelling argument for retention is the **fear of erasure and the desire for complex historical engagement.** Proponents rightly argue that simply removing a name risks burying uncomfortable history, making it harder for future generations to learn about Cobb's actions and the systemic injustices of the Progressive era. They contend that a powerful, well-placed interpretive installation directly on the avenue – confronting the reality of the clearance on the land where it happened – could serve as a more potent, permanent, and pedagogically valuable reminder than a renamed street and a museum exhibit potentially seen only by the historically curious. This view prioritizes confronting the full, unvarnished truth in situ over ceasing the act of honoring the individual responsible.  

  ### 4. Grounding in Commemorative Ethics: Consensus vs. Contested Ground  
  *   **Broad Consensus:**  
      *   **Rejection of the "Stranger Test":** Scholars widely agree that institutional commemoration (like street names) conveys honor regardless of public awareness. The ethical imperative stems from the act of naming itself and its impact on affected communities, not public recognition. Forgetting is not a remedy.  
      *   **Asymmetry of Interpretation vs. Compulsory Speech:** There is strong agreement that passive interpretive markers cannot counterbalance the active, state-enforced use of an honorific name in daily life. The burden of encountering the name is involuntary and pervasive.  
      *   **Duty to Context & Harm:** There is consensus that commemoration must account for the totality of a figure's legacy and its impact, particularly on marginalized groups. Ignoring profound harm while celebrating achievements is unethical.  

  *   **Genuinely Contested Ground:**  
      *   **The Divisibility of Honor (Pro Tanto Commemoration):** *This remains deeply contested.* Some scholars argue it *is* possible (and even necessary) to acknowledge both positive contributions and profound harms within a commemoration, seeing this as a form of mature historical engagement. Others argue, as this memo does, that retaining the honorific name inherently celebrates the whole person in a way that cannot be ethically partitioned, especially when the harm is foundational to their power or self-perception (as Cobb's correspondence suggests). The panel acknowledges this is a point of active philosophical and historical debate where reasonable experts disagree. Our recommendation rests on the judgment that divisibility fails in cases where the harm is egregious, foundational, and a source of perpetrator pride.  

  **Conclusion:** The profound harm inflicted by Hollis Cobb's racial zoning and neighborhood clearance, actions he deemed his proudest, outweighs his civic contributions within the context of an honorific street name. The "Cobb" name imposes compulsory speech on residents and perpetuates a daily injury for descendants. Renaming the avenue, while preserving and contextualizing the name and its full history rigorously within a museum exhibit, best balances the imperative to cease honoring injustice with the duty to preserve historical memory and foster complex understanding. This approach centers accountability and the lived experience of the affected community.  

  **Vote:** Recommends adoption of the above resolution.
