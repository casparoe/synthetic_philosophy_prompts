answer: |-
  ### Essay Question  
  **The Copyist’s World Thought Experiment and the Laws of Nature Debate**  
  Consider the following scenario:  
  *The Copyist’s World is a possible world whose complete history of particular facts (i.e., the distribution of all physical properties across space and time) is, moment for moment and point for point, a perfect duplicate of our world. However, by stipulation, every regularity in this world is a colossal accident: nothing necessitates anything else, and had any single event occurred differently, the rest of the world would have carried on exactly as it did in the actual duplicate. There are no hidden connections or governing constraints; all apparent order is purely coincidental.*  

  Assess how Humean and anti-Humean theories of laws of nature would respond to this case. Your analysis must address:  
  1. Whether each view can coherently accept the Copyist’s World as described.  
  2. What verdict each view is **compelled** to give about the laws in this world.  
  3. Whether the dispute that survives this case is substantive (metaphysical) or merely verbal (semantic).  

  Focus on *logical entailments* of each position. Do not merely recite standard arguments—explain why each view *must* reach its conclusion given the thought experiment.  

  ---

  ### Model Answer (720 words)  
  The Copyist’s World thought experiment starkly exposes the fault line between Humeanism and anti-Humeanism. Humeanism, particularly the Mill-Ramsey-Lewis (MRL) "best-system" account, holds that laws supervene on the total set of particular facts: they are nothing over and above the Humean mosaic, distilled into the optimal balance of simplicity and strength. Anti-Humeanism denies this, insisting laws are irreducible governing relations that constrain what can happen. The Copyist’s World forces both views into revealing their deepest commitments.  

  **(i) Humean Supervenience and Its Implications**  
  Humean supervenience asserts that laws are metaphysically reducible to the total distribution of particular facts. "Nothing over and above" means no additional modal or nomic facts exist beyond the spatiotemporal arrangement of properties. The MRL account cashes this out: laws are the axioms of the system that best balances *simplicity* (ease of statement) and *strength* (descriptive scope) about the mosaic. Crucially, laws are *constituted* by patterns in the mosaic. Thus, for the Humean, if two worlds share identical histories of particular facts, they *must* share identical laws—since laws are summaries, not governors.  

  **(ii) The Humean Verdict on Copyist’s World**  
  The Humean is **compelled** to deny the coherence of the Copyist’s World *as described*. If the particular facts duplicate ours, the best-system analysis must output the same laws. Any claim that "regularities are accidental" contradicts Humeanism: once the mosaic is fixed, the laws are fixed. The MRL account cannot allow "colossal accidents" in a world matching ours—accidents imply deviations from lawful patterns, but here the patterns *are* the laws. Thus, Humeanism must reject the stipulation that no necessitation exists, as it implicitly smuggles in non-supervenient modal facts. For the Humean, Copyist’s World *is* our world, laws and all.  

  **(iii) Anti-Humean Modal Intuition vs. Theory-Ladenness**  
  Anti-Humeans wield Copyist’s World as a decisive modal datum: we can *coherently imagine* a world with identical particular facts but no governing laws. This intuition—that laws could be absent while patterns persist—purportedly refutes Humean supervenience by showing laws are not exhausted by the mosaic. The Humean’s best reply is that this intuition is theory-laden. We only "imagine" no governance because we illicitly project *our* concepts onto the world. For Humeans, governance is a psychological projection; the mosaic contains all there is. Thus, the anti-Humean "possibility" is an illusion born of pre-theoretic bias toward necessitation.  

  **(iv) The Objectivity of the Best-System Criteria**  
  A deeper problem for Humeanism arises with the Copyist’s World: what grounds the "best" system? Simplicity and strength are epistemic virtues, relative to human cognitive preferences. If vastly different minds (e.g., aliens who value complexity) would systematize the mosaic differently, laws become mind-dependent. In Copyist’s World, a Humean might try to argue that its laws differ from ours if "best" is relativized—but this fails. Identical mosaics *objectively* determine the same system’s optimality: if our mosaic maximizes *F*=*ma*’s simplicity/strength for humans, it does so universally. Relativism thus doesn’t save Humeanism here; it only highlights that MRL laws are *descriptive* (relying on patterns), not *prescriptive* (constraining patterns).  

  **(v) Anti-Humean Epistemology and Detection**  
  The anti-Humean faces their own burden: if laws govern but are not part of the mosaic, how do we detect them? In Copyist’s World, the particular facts offer no evidence for governance—yet anti-Humeans claim governance exists in our world but not Copyist’s. This implies that governing relations are invisible in the mosaic itself. Anti-Humeans must therefore explain how we know laws *govern* rather than merely *describe*. Appeals to intuition (as in iii) or counterfactuals (e.g., "governance explains why deviations don’t happen") risk circularity, as these are precisely what Humeans reduce to patterns. Without independent access to necessitation, anti-Humeanism struggles to show Copyist’s World is possible rather than incoherent.  

  **Conclusion: Substantive Dispute**  
  The disagreement remains substantive. The Copyist’s World tests whether laws are ontologically autonomous (anti-Humean) or derivative (Humean). Humeanism *must* reject its coherence to avoid contradiction; anti-Humeanism *must* affirm it to preserve governance. This divergence reveals a metaphysical rift: for anti-Humeans, the world has modal "glue" beyond particulars; for Humeans, it does not. Semantic debates about "law" are secondary—the core issue is whether reality includes irreducible necessity. Copyist’s World thus confirms that the dispute is about the furniture of the universe, not language.  

  ---

  ### Marking Scheme (30 marks)  
  **Must-hit points** (A-quality = full marks; B-quality = half marks; C = minimal/no credit):  

  | **Point** | **Marks** | **A-Quality Treatment** | **B-Quality Treatment** | **Common Mistake** |
  |-----------|-----------|--------------------------|--------------------------|-------------------|
  | **(i) Humean supervenience thesis** | 4 | Explicitly defines supervenience and "nothing over and above" as *no extra modal facts*, tying it to MRL as a summary of patterns. | Correctly defines supervenience but omits why "nothing over and above" blocks non-supervenient governance. | Conflating supervenience with identity or missing that laws are *constituted* by patterns. |
  | **(ii) Humean verdict on Copyist’s World** | 6 | States Humeans *must* say laws = ours (same mosaic → same laws) and explains why stipulation is *incoherent* (cannot have "accidents" without deviant patterns). | Correctly says laws are identical but doesn’t explain why the stipulation must be rejected as contradictory. | Claiming Humeans can "accept" the stipulation without seeing inconsistency. |
  | **(iii) Anti-Humean modal argument + Humean reply** | 8 | Anti-Humean: Uses Copyist as proof of non-supervenient possibility. Humean: Diagnoses intuition as projection. Contrasts both clearly. | Describes one side’s argument but not the rebuttal, or vice versa. | Treating the intuition as self-validating without engaging Humean critique of its theory-ladenness. |
  | **(iv) Objectivity of best-system criteria** | 6 | Explains how Copyist pressures MRL: relativism doesn’t help since identical mosaics fix "best" objectively. Links to laws being descriptive. | Notes "best-system-for-whom" but doesn’t show why it fails to distinguish Copyist from our world. | Suggesting aliens would see different laws *in Copyist* despite identical mosaic. |
  | **(v) Anti-Humean epistemological burden** | 6 | Clearly states problem: governing relations aren’t detectable in mosaic. Notes circularity risks in anti-Humean responses. | Identifies the burden but offers no critique (e.g., "anti-Humeans can’t detect governance" without explanation). | Asserting anti-Humeans "just know" governance without addressing detectability. |

  **A (25–30)**: Hits all points with precision, logical rigor, and minimal redundancy.  
  **B (18–24)**: Addresses all points but with gaps in reasoning or clarity.  
  **C (12–17)**: Superficial coverage; misses ≥1 must-hit point or misstates core positions.  
  **D/F (<12)**: Inaccurate or incomplete; fails to engage thought experiment.  

  ---  
  This question tests students’ ability to *apply* core principles to a novel case, exposing fault lines in both theories. The marking scheme rewards dialectical depth over recitation.
