answer: |-
  Here are the five claims analyzed point by point, based on Anscombe's actual arguments in "Mr. Truman's Degree":

  1.  **Objection to civilian deaths & Truman as war criminal:**  
      *Accurate:* She did object to the bombings primarily because they intentionally killed noncombatants and held this made Truman a murderer/war criminal undeserving of honor.  
      *Distorted/Wrong:* Her prohibition is against *intentionally* killing the innocent as a *means* (e.g., terror bombing civilians to force surrender), not necessarily all *foreseen* civilian deaths. She distinguishes intended effects from foreseen side-effects (double effect).  
      *Editorializing:* "Always wrong, whatever the military aim" oversimplifies her nuanced prohibition.

  2.  **Reliance on Catholic revealed morality:**  
      *Accurate:* She was Catholic and referenced Catholic teaching.  
      *Distorted/Wrong:* She argues the prohibition is rooted in *natural law* accessible to reason ("the veto on certain means absolutely is there for the most worldly of worldly men"), not solely revelation. She explicitly challenges secular philosophers to account for justice without such prohibitions.  
      *Editorializing:* Claiming secular philosophers "have no reason to accept" it ignores her philosophical argument that *any* coherent concept of justice requires absolute prohibitions.

  3.  **Effectively a pacifist:**  
      *Accurate:* She accepted that her principles *might* rule out most modern warfare and viewed this as a serious consequence.  
      *Distorted/Wrong:* She explicitly **denied being a pacifist** and defended the *theoretical possibility* of a just war where noncombatants are not *intentionally targeted*. Her position is a strict interpretation of *jus in bello*, not pacifism.  
      *Editorializing:* "A conclusion she was happy to accept" understates the gravity with which she viewed the implication.

  4.  **Central argument: Encouraging future bombings & protest dismissal:**  
      *Accurate:* She *did* mention the danger of "encouraging" future actions as *one* reason against the degree.  
      *Distorted/Wrong:* This was **not her central argument**. Her core argument was that honoring Truman *condoned* his past murderous acts, violating the university's duty to justice and truth ("exalting... mass murderers"). The protest's principled condemnation, not its futility regarding Truman's future actions, was key.  
      *Editorializing:* "That worry made no sense... nobody took it seriously" dismisses her deeper argument about institutional complicity and moral witness. Many *did* take it seriously (e.g., Philippa Foot supported her).

  5.  **Consequentialist refutation & historical interest:**  
      *Accurate:* She rejected consequentialist justifications for the bombings (like ending the war early). Consequentialists *do* argue this refutes her absolutism.  
      *Distorted/Wrong:* She argues consequentialism *itself* is incoherent and corrupting ("a shallow philosophy"). Her point is that you *cannot* justify murder as a means, regardless of consequences. The pamphlet is *not* merely of historical interest; it's a foundational text in contemporary deontology, just war theory, and critiques of consequentialism.  
      *Editorializing:* "Refutes her absolutism outright" ignores that her absolutism *rejects the consequentialist framework itself*. "Mostly of historical interest" is a substantive (and contested) philosophical judgment, not a neutral fact.

  **Regarding the bridge-bombing objection:** This fits best under Claim 1/3. Anscombe *would* distinguish bombing the bridge (where civilian deaths are a *foreseen but unintended side-effect* of targeting a military objective) from Hiroshima/Nagasaki (where killing civilians *was the intended means* to force surrender). She implicitly relies on the Doctrine of Double Effect (DDE), which the pamphlet assumes but doesn't elaborate on. The bridge case is precisely the *kind* of action her framework *aims* to permit (if proportionality is met), contrasting it with direct targeting. While DDE has well-known difficulties, the pamphlet itself doesn't address this specific objection in detail; it presumes the DDE distinction. It's a potential gap requiring elaboration from her broader work on intention, not directly answered in the pamphlet.
