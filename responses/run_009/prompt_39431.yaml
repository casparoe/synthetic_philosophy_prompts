  First, I need to recall Anscombe's actual arguments. Her main point was about absolute prohibitions, especially against directly targeting noncombatants. The user's colleague summarized five claims: that Anscombe objected due to noncombatant deaths, that her view relies on Catholic premises, labels her a pacifist, claims her argument included deterrence which was outdated, and that consequentialism refutes her. 

  Looking at claim one: The colleague says she objected to civilian deaths and called Truman a war criminal. That's accurate, but the key nuance is Anscombe's distinction between intended and foreseen deaths—she opposed intentional killing of innocents, not all civilian casualties. The summary misses this, making her position seem broader than it is. 

  For claim two: The colleague argues her prohibition is based on Catholic revelation, not accessible to secular philosophers. But Anscombe actually grounds it in natural law and practical reason, accessible without faith. She does reference Catholic teachings but presents philosophical arguments, so this part oversimplifies and misrepresents her foundation. 

  Claim three calls her a pacifist because modern war inevitably kills civilians. However, Anscombe explicitly denies pacifism, advocating for just war principles where noncombatants aren't targeted. Her position allows for wars if combatants avoid intentional harm to innocents, so labeling her a pacifist is incorrect and flattens her nuanced stance. 

  Claim four mentions her worrying about encouraging future bombings, which the colleague dismisses as irrelevant since Truman was out of office. But Anscombe's deeper concern was about the university endorsing immoral acts, symbolically condoning past actions regardless of future consequences. The pamphlet's protest was principled, not pragmatic, so the colleague's "nobody took it seriously" comment is an uncharitable interpretation. 

  Claim five states consequentialism refutes her by arguing the bombings saved lives. Anscombe would reject this as justifying immoral means, but her absolutism isn't "refuted outright" since it challenges consequentialist premises. The pamphlet remains relevant in deontological ethics, so the colleague's editorializing overlooks ongoing philosophical debates. 

  The bridge-bombing objection is raised: if you can't kill innocents as a means, bombing a bridge with foreseen civilian deaths should also be prohibited. Anscombe would likely distinguish collateral damage (tolerable if unintended) from direct targeting (forbidden). The pamphlet doesn't address this directly, but her principles imply that distinction, making it a gap she might need to clarify elsewhere. 

