  3. **Pragmatic choice:** Maybe the reference class depends on the decision context. This is defensible but might not feel "principled" to the user. High credence here, but the user might see it as just useful, not principled.

  Combining these: Without objective truth values, the first point lowers overall credence. Causal similarity offers some hope but is limited. Pragmatism is practical but may not satisfy the user's desire for a "right answer." So overall credence around 20-25%.

  For the working forecaster: Data might help with causal factors. Studying fault mechanics, stress accumulation, etc., could inform better groupings. But the philosophical problem persists—deciding which causal factors matter remains partially subjective. So, data can reduce but not eliminate the issue.

  The user's deeper need might be validation of their career struggles. They might feel that their work was undermined by subjectivity, seeking whether there's a foundational solution. They might also want to know if their field can improve or if it's inherently subjective.
answer: |-
  ### Credence Breakdown: The Principled Reference Class Quest  
  Here's my quantified assessment of whether a truly "principled" (non-subjective) solution exists for the reference class problem in single-case probabilities like your seismic forecasts. I'll decompose it as requested, assign credences (0–100%) with reasoning, combine them, and address applicability to forecasting.  

  #### **1. Determinate Truth Values for Single-Case Probabilities (Credence: 15%)**  
  - **Reasoning**: If single-case probabilities (e.g., "2% chance for *this specific fault*") have objective, mind-independent truth values (e.g., via propensity interpretations or metaphysical chance), a "correct" reference class *must* exist in principle. However, frequentism fails for singular events, and propensity theories struggle with underdetermination (e.g., which causal properties define the "true" chance setup?). Bayesian subjectivism explicitly rejects this, making probabilities epistemic. Data can’t resolve this—it’s philosophy.  
  - **Key Insight**: Your "2% in 50 years" is likely *not* a fact about the fault alone but a model-relative output. No data can confirm "the" probability for a non-repeatable event.  

  #### **2. Causal/Physical Similarity as the Fixer (Credence: 35%)**  
  - **Reasoning**: If reference classes *must* be grounded in causal/physical resemblances (e.g., fault mechanics, stress accumulation rates) rather than arbitrary descriptors (e.g., "faults in California post-1900"), a principled answer seems plausible. Physics *could* objectively group faults by shared generative processes (e.g., subduction vs. strike-slip dynamics). But problems arise: (a) "Similarity" is granularity-dependent (do we match rock composition? crustal thickness?), (b) causation may be emergent or incomplete (e.g., unknown triggers), and (c) quantum indeterminacy might infect macro-scale systems.  
  - **Key Insight**: As a seismologist, you *already* prioritized causal factors (e.g., slip rate, segmentation). But committee disputes show that even experts disagree on which causal features are decisive—because physical systems are causally open. Data *can* narrow this (e.g., via physics-based simulations), but not settle it absolutely.  

  #### **3. Pragmatism as a Principled Solution (Credence: 75%)**  
  - **Reasoning**: If the "ought" is tied to decision-context (e.g., "pick the class that minimizes expected loss for *this* policy decision"), pragmatism offers a rigorous framework. Savage’s axioms or decision-theoretic coherence could dictate the class. For example, a class that maximizes predictive accuracy for *your specific utility function* (e.g., evacuate vs. retrofit costs) is "principled" under operationalist philosophies (e.g., Dewey, van Fraassen). The catch: This rejects "truth" for *utility*, which may feel unsatisfying.  
  - **Key Insight**: Averaging committee judgments *is* pragmatic—it minimizes extreme outcomes. Data *can* validate this: Test which reference classes best predict outcomes *for your use-case* (e.g., quake timing vs. magnitude).  

  ---

  ### **Combined Credence for a Principled Answer: 25%**  
  - **Calculation**: The components are interdependent but not multiplicative. Truth values (15%) anchor the possibility; if false, the quest fails. Causal similarity (35%) offers the most plausible path *if* truth exists. Pragmatism (75%) is robust but may not meet your "non-pragmatic" criterion. Weighted by dependence:  
    - Truth values are foundational (40% weight → 0.4 × 15% = 6%).  
    - Causal similarity is the best hope *if* truth exists (40% weight → 0.4 × 35% = 14%).  
    - Pragmatism dominates if truth fails (20% weight → 0.2 × 75% = 15%).  
    - **Total**: 6% + 14% + 15% = **35%**, but discounted by 10% for irreducible ambiguity → **25%**.  
  - **Interpretation**: Low confidence (1-in-4 odds) that a uniquely "correct" reference class exists independent of human choices. The biggest barrier is the lack of determinate truth values for single cases.  

  ---

  ### **What a Working Forecaster Can Settle with Data**  
  - **Optimize the Pragmatic Term**: You *can* empirically test which reference classes yield the best *calibrated predictions* for specific decisions. For example:  
    - Split historical data: Compare how "faults with similar slip rates" vs. "faults in similar tectonic settings" predict observed recurrences.  
    - Use scoring rules (e.g., Brier scores) to quantify which class improves sharpness/reliability for your hazard model.  
    - Machine learning (e.g., clustering faults by geodetic strain + seismicity patterns) can suggest data-driven classes, reducing committee bias.  
  - **Limit**: Data can’t resolve the metaphysical (truth values) or fully constrain causality (e.g., is "stress heterogeneity" definable without arbitrariness?). But it *can* shrink the scope of judgment calls by identifying classes that empirically outperform others for your goals.  

  ### **The Bottom Line: Committee Politics or Science?**  
  It’s **science with irreducible politics**, not *just* politics. The reference class problem is a scientific limitation (like the underdetermination of theories by data), but your committee’s averaging was a rational response: pooling diverse expert judgments *improves calibration* by hedging against individual biases. Data can constrain classes, but philosophy explains why perfect objectivity is unattainable—your career wasn’t eaten by a flaw; it grappled honestly with a hard reality of inference in complex systems.  

  > "The fault, dear Brutus, is not in our stars, but in our reference classes." — Adapted from a seismologist's lament.
