prompt: |-
  quick one before I let this stuff influence how I actually spend my money and time. I've been reading about evidential cooperation in large worlds (ECL) -- the idea being roughly: agents who can't causally interact at all, maybe in other galaxies or whatever, but whose decision procedures are similar to yours, should act as if they're in a coalition, because your choices are evidence about their choices, so you can effectively trade influence over each others' values without ever communicating.

  before I decide whether to take this seriously as a guide to real decisions like donations or career, I want the spec first. write me the desiderata: what an adequate account of this kind of cooperation has to deliver, and the failure modes it has to rule out. some things I keep worrying about: the cutoff problem (people slide from "cooperate with agents similar to you" to "cooperate with everything remotely mind-like" which seems to burn all your local influence, and I can't find a principled line), whether the account has to reduce back to ordinary decision theory when the world is small or correlations are weak, how it handles uncertainty about who even correlates with you, and whether there's a double-counting worry when everyone in the coalition is doing the same reasoning at once. for each requirement, say what motivates it, and flag any pair of them you suspect can't be jointly satisfied -- that's the part I care about most. no need to score existing proposals against the list, just the requirements.
reasoning: |-
  We are to outline desiderata for an adequate account of Evidential Cooperation in Large Worlds (ECL). The user has specific concerns: cutoff problem, reduction to ordinary decision theory in small worlds, handling uncertainty about correlations, and double-counting in the coalition. We must list requirements, motivate each, and flag any potential conflicts.

  Key ideas from the query:
  - ECL: Agents in disconnected worlds (no causal interaction) but with similar decision procedures form a "coalition" because one's choices are evidence about the others' (due to similarity). Thus, they can trade influence over each other's values.
  - Concerns:
    a) Cutoff problem: How similar must an agent be to cooperate? If too broad, local influence is diluted.
    b) Reduction: In small worlds (or weak correlations), ECL should reduce to standard decision theory.
    c) Uncertainty: How to handle not knowing who is correlated with you?
    d) Double-counting: If every agent in the coalition is doing the same reasoning, might they overcount the influence?

  Desiderata:

  1. **Similarity Threshold (Addressing Cutoff Problem):**
     - **Requirement:** The account must provide a principled way to determine which agents are sufficiently similar to be included in the coalition. It should avoid including agents that are too dissimilar, which would lead to dilution of influence (i.e., burning local influence without sufficient gain).
     - **Motivation:** Without a clear cutoff, an agent might end up cooperating with almost any entity that exhibits some minimal mind-like properties, leading to negligible impact on the world that the agent cares about. This is the cutoff problem.

  2. **Reduction to Standard Decision Theory:**
     - **Requirement:** In the limit of a small world (where there are no other agents, or the correlations between agents are vanishingly weak) or when the decision problem is such that evidential correlations are negligible, the ECL framework must reduce to standard causal decision theory (or whichever decision theory is taken as baseline).
     - **Motivation:** In isolated decision problems, we have well-tested decision theories. ECL should be a generalization that only kicks in when the large-world correlations are significant, otherwise we might get counterintuitive or suboptimal decisions in ordinary situations.

  3. **Handling Uncertainty About Correlations:**
     - **Requirement:** The account must allow agents to act under uncertainty about which other agents exist and how similar they are (i.e., the strength and nature of the evidential correlations). It should provide a way to update beliefs and make decisions based on partial information.
     - **Motivation:** In reality, an agent does not know the exact set of other agents that are similar to them. They might have probabilistic beliefs about the existence and similarity of others. An adequate ECL must not require perfect knowledge.

  4. **Avoiding Double-Counting:**
     - **Requirement:** The decision procedure must be consistent even when all agents in the coalition are simultaneously performing the same cooperative reasoning. It must not lead to overcounting of the expected impact (e.g., by each agent assuming that others are already cooperating in a way that multiplies the effect unrealistically).
     - **Motivation:** If every agent in the coalition reasons that by cooperating they will influence all others to cooperate, they might each overestimate the collective impact, leading to an unstable or inflated expectation of utility. This is a coordination problem in the coalition.

  5. **Preservation of Local Influence:**
     - **Requirement:** The account should ensure that the agent's actions have non-negligible impact on the world they can observe (the local world) and not sacrifice all local resources for the sake of distant, correlated agents. In other words, the trade-off between local and non-local influence must be balanced appropriately.
     - **Motivation:** If ECL leads to an agent spending all their resources on influencing distant agents (because there are so many of them), then the agent's own life and immediate surroundings might be neglected, which seems counterproductive. This is related to the cutoff problem but focuses on the allocation of resources.

  6. **Robustness to Strategic Manipulation:**
     - **Requirement:** The account should be robust against agents who might try to mimic the decision procedure of the coalition for the purpose of free-riding or causing harm.
     - **Motivation:** If an adversarial agent can pretend to be similar (by mimicking the decision procedure) and then defect, it could exploit the cooperative agents. This might be a concern if the similarity threshold is too easy to meet.

  7. **Convergence of Expectations:**
     - **Requirement:** The solution concept should lead to a situation where all agents in the coalition have consistent expectations about each other's actions (i.e., a fixed point in their reasoning about what others will do).
     - **Motivation:** Without convergence, the agents might be stuck in an infinite regress of "I think that they think that I think ...", which would make the decision procedure undefined.

  Potential Conflicts:

  - **Conflict between 1 (Similarity Threshold) and 3 (Uncertainty):** 
    A clear cutoff (requirement 1) might be difficult to define when we have uncertainty about correlations (requirement 3). If we don't know exactly who is similar, how can we set a threshold? We might need a probabilistic inclusion, but then we risk including too many (cutoff problem) or too few.

  - **Conflict between 4 (Avoiding Double-Counting) and 7 (Convergence of Expectations):**
    To avoid double-counting, we might need a solution that does not assume all agents are simultaneously doing the same reasoning in the same way. But convergence requires that they do reason similarly. This might be resolved by a fixed-point solution, but it's challenging.

  - **Conflict between 2 (Reduction to Standard DT) and 5 (Preservation of Local Influence):**
    In a small world, standard decision theory might focus entirely on local influence. But in a large world, ECL might recommend diverting resources to non-local influence. However, if we require that in the limit of weak correlations we reduce to standard DT, then in a situation with very weak correlations (but still non-zero) we might still have some non-local influence. This could lead to a continuous transition, but it might not satisfy the desire for strong local impact. The trade-off must be continuous and proportionate.

  - **Conflict between 1 (Similarity Threshold) and 6 (Robustness):**
    A very strict threshold might avoid manipulation but might also exclude genuinely similar agents. A very lenient threshold might include manipulators. This is a classic trade-off in cooperation scenarios.

  We'll now list the desiderata in a structured way.
answer: |-
  Here's a structured list of desiderata for an adequate account of Evidential Cooperation in Large Worlds (ECL), motivated by your concerns and core challenges. I've flagged key tensions where requirements may conflict, as requested.

  ---

  ### **Desiderata for ECL**
  1. **Principled Similarity Boundary**  
     - **Requirement**: Define a non-arbitrary threshold for which agents qualify as "similar enough" to cooperate with, based on decision-procedure alignment (e.g., shared goals, reasoning algorithms, or priors).  
     - **Motivation**: Avoids the cutoff problem where cooperation extends to *any* mind-like entity, diluting local influence into ineffective noise. Must exclude agents with orthogonal values or decision processes.  
     - **Failure Mode**: Over-inclusion burns resources on useless coordination; under-inclusion misses Pareto improvements.  

  2. **Reduction to Standard Decision Theory in Small Worlds**  
     - **Requirement**: ECL must converge to causal decision theory (CDT) or evidential decision theory (EDT) in scenarios with:  
       - No correlated agents (small worlds).  
       - Weak correlations (e.g., low probability of similarity).  
     - **Motivation**: Preserves consistency with established frameworks in ordinary cases (e.g., personal career choices). Avoids "weird" predictions when ECL isn't relevant.  
     - **Failure Mode**: ECL distorts local decisions if it fails to "switch off" when correlations are negligible.  

  3. **Uncertainty-Tolerant Cooperation**  
     - **Requirement**: Function robustly under epistemic uncertainty about:  
       - Which agents exist.  
       - How strongly they correlate with you.  
       - Their values/goals.  
     - **Motivation**: Real agents lack perfect knowledge of other minds. Must avoid paralysis or overconfidence.  
     - **Failure Mode**: Naive implementations freeze under Knightian uncertainty or over-commit to guessed correlations.  

  4. **Double-Counting Immunity**  
     - **Requirement**: Prevent inflated utility expectations when all correlated agents simultaneously reason about cooperation. Must not assume *your* action is the *only* one influencing others.  
     - **Motivation**: In a coalition, everyone updates on shared evidence. If all "pitch in" expecting multiplicative gains, resources may be wasted (e.g., all donate to the same cause, overshooting the optimum).  
     - **Failure Mode**: Synergy illusions → misallocated effort or circular reasoning collapse.  

  5. **Local Influence Preservation**  
     - **Requirement**: Ensure a minimum viable level of causal impact on the agent's immediate world (e.g., personal well-being, local community).  
     - **Motivation**: Without safeguards, ECL could redirect *all* resources to influencing distant agents, neglecting low-stakes but high-certainty local values.  
     - **Failure Mode**: "Influence bankruptcy" — sacrificing tangible local good for negligible evidential gains elsewhere.  

  6. **Value-Trade Scalability**  
     - **Requirement**: Enable asymmetric cooperation between agents with *different* values (e.g., A helps B's goals because B's existence is evidence they'll help A's).  
     - **Motivation**: Core promise of ECL is trading influence across value systems without communication.  
     - **Failure Mode**: Only works with clones → no value trade possible, reducing to trivial cooperation.  

  7. **Coalitional Stability**  
     - **Requirement**: The cooperative equilibrium should be a Schelling point — agents with identical reasoning must agree on *how* to cooperate without negotiation.  
     - **Motivation**: If similar agents defect or second-guess each other, cooperation unravels.  
     - **Failure Mode**: Coordination failures where mutual evidence isn't sufficient to sustain cooperation.  

  ---

  ### **Key Tensions (Potentially Unsatisfiable Pairs)**  
  - **Tension 1: Principled Similarity Boundary (1) vs. Value-Trade Scalability (6)**  
    - Strict similarity boundaries may exclude agents with differing-but-alignable values. Scalable value-trade requires *some* heterogeneity → risks over-inclusion (cutoff problem relapse).  
    - *Why hard?* Tight similarity protects against dilution but may limit gains from value diversity.  

  - **Tension 2: Double-Counting Immunity (4) vs. Coalitional Stability (7)**  
    - Avoiding double-counting requires discounting others' actions, but stability requires high confidence in others' cooperation. Excessive discounting invites defection.  
    - *Why hard?* The logic of evidence can become circular: "I cooperate because I expect them to, but they expect me to expect that..."  

  - **Tension 3: Reduction to Standard DT (2) vs. Local Influence Preservation (5)**  
    - In borderline cases (e.g., weak correlations), the shift from CDT to ECL might "steer" resources away from local causal impact. A smooth reduction may not guarantee a local-influence floor.  
    - *Why hard?* ECL's evidential gains are inherently non-local; prioritizing them risks violating locality.  

  ---

  ### **Why These Requirements?**  
  ECL aims to exploit acausal correlations for mutual gain, but its failure modes are severe:  
  - **Cutoff problem** ↔ Desideratum 1 + 5.  
  - **Small-world inconsistency** ↔ Desideratum 2.  
  - **Uncertainty paralysis** ↔ Desideratum 3.  
  - **Overcounting** ↔ Desideratum 4.  
  - **Value homogeneity** ↔ Desideratum 6.  
  - **Instability** ↔ Desideratum 7.  

  A viable ECL must navigate these without ad hoc patches. The tensions highlight where trade-offs are inevitable—e.g., how much local influence to sacrifice for evidential gains—which is why no current proposal (e.g., MIRI's "logical inductors" or cooperative oracle proofs) fully satisfies all desiderata. Proceed cautiously when applying ECL to real-world decisions; these gaps suggest it may not yet be action-guiding.
