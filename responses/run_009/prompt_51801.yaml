answer: |-
  My dear friend,  

  Your struggle resonates deeply—it’s a labyrinth many of us wander, trying to separate disputes about the world from disputes about our maps of it. Your cases are exquisitely chosen, revealing tensions in our intuitions. Let me try to articulate a principle that might capture most of your verdicts, while acknowledging where friction remains.  

  The core distinction, I suspect, lies not in whether words are involved (they always are), but in **whether resolving the dispute requires adopting a new conceptual framework with practical or explanatory consequences beyond terminological preference**. A dispute is merely verbal when the disagreement vanishes once we recognize that the parties are operating within different but equally coherent linguistic or conceptual schemes, and no further fact about the world needs settling. Conversely, a dispute is substantive when it signals a deeper rift in how we ought to conceptualize reality, with implications for explanation, prediction, ethics, or ontology—even if observation alone cannot adjudicate it.  

  Let’s test this against your cases:  
  - **Tomato/fruit vs. vegetable; hot dog/sandwich**: These are paradigmatically verbal. Adopting either definition doesn’t alter our understanding of tomatoes or hot dogs—it merely selects a linguistic convention suited to a context (botany or cuisine). The world is indifferent.  
  - **Platonism vs. nominalism (number seven)**: Substantive. While observational tests may fail, the dispute forces a choice between fundamentally different ontologies. Accepting Platonism commits us to abstract objects as real explanatory entities; nominalism demands a reductive account of mathematics. This shapes how we understand knowledge itself.  
  - **Mereological sum (table + shoe)**: Verbal, as you intuit. Here, Hirsch’s quantifier variance illuminates the issue: both parties agree on all physical facts (arrangement of particles, etc.). Disagreeing over whether "there exists" a mereological sum reflects different, equally viable ways of "carving up" reality with quantifiers. No new prediction or explanation hinges on accepting the sum as a single entity. Sider’s "joint-carving" quantifier might feel intuitively correct, but your verdict suggests you sense that insisting on *one* true ontology here is unmotivated—nothing is left unexplained by either framework.  
  - **Marriage (agreed facts, disputed term)**: Substantive, and rightly so. Unlike the tomato case, "marriage" isn’t a neutral descriptor but a thick normative concept. Disagreeing about its application, even with fixed non-normative facts, implies divergent views on social recognition, moral status, or institutional essence. Resolving it shapes how we *ought* to organize society—a practical consequence absent in the tomato dispute.  
  - **Fish pain**: Substantive. While "pain" has a definitional element, the crux is whether fish possess conscious states relevant to moral concern. Resolving this isn’t just about the word; it demands investigating neural correlates, behavioral evidence, and ethical frameworks. The definitional tug-of-war reflects an underlying empirical/ethical uncertainty.  

  Your tentative principle—both claims can be true under their respective meanings—falters because it conflates *semantic* coexistence with *conceptual* or *practical* equivalence. In the marriage case, both claims *could* be made compatible semantically (e.g., "legal union" vs. "sacrament"), but the dispute persists because the concept’s normative weight is contested. In Platonism, nominalists *deny* the existence Platonists affirm; they aren’t just using "exists" differently but offering rival ontologies.  

  Now, consider your unlisted case: **Is a locked-in patient conscious?**  
  - If both parties agree on all neural/behavioral facts but dispute whether those facts suffice for "consciousness," the dispute is substantive. "Consciousness" is not a trivial label; attributing it has ethical stakes (treatment, personhood) and ties into theories of mind. Even without new observations, we must decide which framework best explains subjectivity—a profound conceptual choice.  

  Where might you reconsider? The **marriage case** is the hardest fit. If *all* normative implications are truly agreed upon (e.g., both grant identical rights/recognition, and only the word "marriage" is withheld by one side), it collapses into verbalism. But I suspect you sense residual normative weight in the term itself—hence your verdict. If so, stand firm; language often carries inescapable practical baggage.  

  Regarding Hirsch and Sider: Hirsch’s quantifier variance elegantly explains your mereological verdict—quantifier meanings vary without factual consequence. But your reluctance to extend this to Platonism aligns with Sider. We *feel* that "do numbers exist?" targets a joint-carving structure, not just a linguistic choice. This tension is real: perhaps substantive disputes arise when we aim for "fundamental" ontology (Sider’s joint-carving) while verbal ones involve "derivative" frameworks (Hirsch’s alternative carvings). Your intuitions track this gradient: mereological sums feel derivative, mathematical objects fundamental.  

  In the end, no principle silences all doubt. But if we ask, "Does settling this dispute *change* how we explain, predict, or act?" we approach your pattern. Surrender only the marriage verdict if you can truly strip it of normative force—but life seldom lets us.  

  Yours in perplexity and curiosity.
