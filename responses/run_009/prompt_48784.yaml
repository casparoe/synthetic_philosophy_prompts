answer: |-
  ### Concrete Case: Labor Negotiation with Preemptive Commitment

  **Realistic Setting**  
  In a labor negotiation between a worker (Player 1) and an employer (Player 2), the worker signs an irrevocable contract for a part-time job with a third party before bargaining begins. This contract limits the worker's availability, eliminating work arrangements that require her to be fully available to the employer. Specifically, it destroys agreements where the employer's utility exceeds 1.2, but it also sacrifices the employer's ability to offer the worker extremely low-workload agreements that were previously feasible. The worker pays a price: the contract commits her to a minimum workload elsewhere, constraining her flexibility. The disagreement point remains (0,0), representing no agreement (no job and no income).

  **Payoff Specifications and Computations**  
  *All utilities are scaled for simplicity.*

  **Before Destruction: Feasible Set S**
  - **Pareto Frontier (Piecewise-Linear):**  
    - Segment 1: From (0, 1.5) to (1, 1) → \( u_2 = 1.5 - 0.5u_1 \)  
    - Segment 2: From (1, 1) to (1.5, 0) → \( u_2 = 3 - 2u_1 \)  
  - **Utopian Point:** (1.5, 1.5)  
  - **Disagreement Point:** (0, 0)  

  **Solutions for S:**
  - **Nash:** Maximize \( u_1 \times u_2 \)  
    - Segment 1: \( u_1(1.5 - 0.5u_1) \) → max at \( u_1 = 1 \) (product = 1)  
    - Segment 2: \( u_1(3 - 2u_1) \) → max at \( u_1 = 1 \) (product = 1)  
    - **Nash Solution: (1, 1)**  
  - **Kalai–Smorodinsky (KS):** Line from (0,0) to (1.5,1.5) → \( u_2 = u_1 \)  
    - Intersects Segment 1: \( 1.5 - 0.5u_1 = u_1 \) → \( u_1 = 1 \)  
    - **KS Solution: (1, 1)**  

  ---

  **After Destruction: Feasible Set T (Subset of S)**  
  *Contract constraints:*  
  - Removes agreements where \( u_2 > 1.2 \), binding at \( u_1 + 2u_2 \leq 3 \).  
  - New vertices: (0.6, 1.2) [from \( u_1 + 2(1.2) = 3 \)] and (0.9, 1.2) [from \( 2u_1 + 1.2 = 3 \)].
  - **Pareto Frontier:**  
    - Segment 1: (0.6, 1.2) to (0.9, 1.2) → \( u_2 = 1.2 \) (horizontal)  
    - Segment 2: (0.9, 1.2) to (1, 1) → \( u_2 = 3 - 2u_1 \)  
    - Segment 3: (1, 1) to (1.5, 0) → \( u_2 = 3 - 2u_1 \)  
  - **Utopian Point:** (1.5, 1.2) (Player 2’s max drops from 1.5 to 1.2; Player 1’s max unchanged at 1.5)  
  - **Disagreement Point:** (0, 0)  

  **Solutions for T:**
  - **Nash:** Maximize \( u_1 \times u_2 \)  
    - Segment 1: \( u_1 \times 1.2 \) → max at \( u_1 = 0.9 \) (product = 1.08)  
    - Segments 2 & 3: \( u_1(3 - 2u_1) \) → max at \( u_1 = 1 \) (product = 1), but 1.08 > 1  
    - **Nash Solution: (0.9, 1.2)** (Player 1’s payoff: 0.9)  
  - **Kalai–Smorodinsky (KS):** Line from (0,0) to (1.5, 1.2) → \( u_2 = (1.2/1.5)u_1 = 0.8u_1 \)  
    - Intersects Segment 2: \( 3 - 2u_1 = 0.8u_1 \) → \( 3 = 2.8u_1 \) → \( u_1 = 15/14 \approx 1.0714 \)  
    - **KS Solution: (1.0714, 0.8571)** (Player 1’s payoff: ≈1.0714)  

  ---

  **Key Contrast and Axiomatic Tradeoff**  
  - **Worker’s payoff after destruction:**  
    - KS: **Rises** from 1.0 to ≈1.0714.  
    - Nash: **Falls** from 1.0 to 0.9.  
  - **Why? Individual Monotonicity (KS) vs. Independence of Irrelevant Alternatives (Nash):**  
    - KS satisfies **individual monotonicity**: When the utopian point shifts in a player’s favor (here, Player 2’s max drops from 1.5 to 1.2, making the worker’s relative position stronger), their payoff can rise even if the feasible set shrinks.  
    - Nash satisfies **IIA**: Removing options (even those not chosen) can alter the product-maximizing point. Here, destroying agreements near (1,1) shifts the Nash solution to (0.9,1.2), hurting the worker.  
  - **Unsettling Implication for KS:** Rewarding the worker for *strategically limiting the employer’s options* weakens Pareto efficiency and encourages preemptive destruction.  

  ---

  **Balance: When Nash Fails Monotonicity**  
  Consider a case where the feasible set *expands* favorably for a player, but Nash fails to reward them:  
  - **Before expansion:** Set with frontier (0,1) to (1,0). Nash: (0.5,0.5).  
  - **After expansion:** New options added, e.g., frontier (0,1) to (1,0) extended to (2,0). Utopian: (2,1).  
  - **Nash solution:** Stays at (0.5,0.5) (since the product-maximizing point is unchanged).  
  - **Result:** Player 1 gains nothing despite new opportunities.  
  - **Why?** Nash’s IIA ignores expansions that don’t affect the product-maximizing point. KS, by contrast, increases Player 1’s payoff to ≈0.666 (intersection of \( u_2 = 0.5u_1 \) and the frontier).  

  ---

  **Stress Tests**  
  1. **What if the Nash point is destroyed?**  
     - Suppose the destroyed agreements include the *original Nash point* (1,1).  
     - In T, Nash reoptimizes and moves to (0.9,1.2). Though Player 1’s payoff falls (0.9 < 1.0), it rises compared to staying at (1,1) if that point were unavailable. *This weakens the case slightly, as destruction now "pays" under Nash too—but the KS increase is larger (1.0714 > 0.9), and the manipulator is still worse off under Nash.*  

  2. **What if the destroyed set is off the Pareto frontier?**  
     - Suppose destruction removes non-efficient points (e.g., an interior agreement like (0.3,0.3)).  
     - Utopian point unchanged → KS and Nash solutions remain identical.  
     - **Conclusion:** The result is driven by the shift in the *utopian point*, not destruction per se.  

  3. **Strongest Defense of Kalai–Smorodinsky:**  
     - **"Utopian points reflect aspirations, not threats; pre-commitments are a legitimate part of bargaining power. Workers should be rewarded for securing fallback options that reset aspirations."**  
     - **Does it have teeth?** Yes. In real negotiations, external commitments (like a part-time job) *do* alter power dynamics by changing what parties perceive as achievable. KS explicitly incorporates these changes, making it more behaviorally realistic than Nash.  
     - **Counter:** This incentivizes destructive pre-negotiation moves, potentially harming joint gains.  

  ---

  **Verifiability**  
  All solutions are computed from first principles using the definitions:  
  - Nash: \(\arg \max_{u \in S} (u_1 - d_1)(u_2 - d_2)\)  
  - KS: Intersection of the Pareto frontier and the line from \(d\) to the utopian point.  
  A skeptical classmate can replicate results using the given frontiers and equations.  

  This case cleanly demonstrates the tradeoff: KS’s monotonicity rewards preemptive destruction, while Nash’s IIA penalizes it. Yet Nash can be unresponsive to expansions. Use this tension to provoke debate!
