  We are building a quiz to sort people into their underlying metaphysical views about persistence without using technical terms. The key views we want to map to are:
  A. Perdurantism (worm theory): objects persist by having temporal parts at different times.
  B. Stage theory (exdurantism): only temporal stages exist, and objects are identified with stages; cross-temporal relations are handled by counterpart relations.
  C. Endurantism: objects are wholly present at every time they exist. This splits into three sub-views regarding temporary intrinsics:
     C1. Relativization: properties are held relative to a time (e.g., bent-at-t).
     C2. Adverbialism: the object has properties timelessly but in a way modified by time (e.g., being bent on Tuesday).
     C3. Presentism or tense-based: properties are held in a tensed way (e.g., was bent, is straight).

  We also note the possibility of a deflationary view (D) that holds there is no fact of the matter in some cases.

