answer: |-
  ### Which Theory of Persistence Do You Actually Hold?  
  *Answer based on your intuitions about concrete cases. No prior knowledge of philosophy required.*  

  #### Questions:  
  1. **The Poker Case**  
     A metal poker is straight on Monday, bent on Tuesday, and straight again on Wednesday. On Tuesday, you say, "The poker is bent." What exactly is bent?  
     - **A.** The very same poker that was straight on Monday is now bent. It’s the whole poker, but it changed.  
     - **B.** Tuesday’s poker is bent, but it’s a *different* poker from Monday’s. Monday’s poker was straight and gone.  
     - **C.** The poker has a "Tuesday phase" that is bent. The poker itself isn’t fully present on Tuesday—only its Tuesday phase is.  

  2. **The Transplant Case**  
     Pat’s brain is split and transplanted into two new bodies, creating Robin and Sam. Both claim to be Pat. What happened to Pat?  
     - **A.** Pat died. Robin and Sam are new people.  
     - **B.** Pat survived as *either* Robin *or* Sam (we can’t know which).  
     - **C.** Pat survived as *both* Robin and Sam together. Pat is now two people.  

  3. **The Ship Case**  
     A ship (the *Argo*) has all its planks replaced gradually. The old planks are reassembled into a second ship. Which ship is the original *Argo*?  
     - **A.** Only the continuously sailing ship (with new planks).  
     - **B.** Only the reassembled ship (with the old planks).  
     - **C.** Both are the *Argo* in different ways.  
     - **D.** Neither is the *Argo*—the original is gone.  

  4. **The Clay Case (Counting Over Time)**  
     A lump of clay exists from noon to 3 PM. From 1-2 PM, it’s shaped into a statue. After 2 PM, it’s squashed back into a lump. How many *objects* were present from noon to 3 PM?  
     - **A.** One: the lump. The statue was just a temporary shape.  
     - **B.** Two: the lump (there the whole time) and the statue (there from 1-2 PM).  

  5. **The Poker Properties Case**  
     The poker is straight on Monday and bent on Tuesday. When you say "The poker is bent" on Tuesday, what do you mean?  
     - **A.** The poker has the property *being bent*—but only on Tuesday. On Monday, it had *being straight*.  
     - **B.** The poker has the property *being bent on Tuesday*. This is a different property from *being bent on Monday*.  
     - **C.** The poker has *being bent* in a Tuesday-specific way (e.g., "it is bent *on Tuesday*").  

  6. **The Watch Case**  
     A watch disappears on Monday and reappears unchanged on Wednesday. Did the watch exist on Tuesday?  
     - **A.** No. It wasn’t present and didn’t exist.  
     - **B.** Yes. It existed on Tuesday but wasn’t locatable.  

  7. **The Car Case**  
     A car’s engine is removed on Monday and replaced with a new one. On Tuesday, the old engine is put back. Is the car on Wednesday the same car as on Monday?  
     - **A.** Yes. It’s the same car throughout.  
     - **B.** No. Changing the engine destroyed the original car.  

  8. **The Statue Case (Counting At a Time)**  
     At 1:30 PM, a lump of clay is shaped into a statue. How many *objects* are present?  
     - **A.** One: the statue is just the lump arranged a certain way.  
     - **B.** Two: the lump and the statue are distinct, even though they share the same clay.  

  ---

  ### Scoring Key  
  **How It Works**  
  - Each question probes a hidden disagreement about **persistence** (how objects exist through time).  
  - Your answers map to one of five views in the "logical space" of persistence theories.  
  - **No view is "wrong"**—this locates your intuitions in a framework philosophers use.  

  #### The Views  
  1. **Perdurantism ("Worm Theory")**:  
     - Objects persist by having temporal parts at each moment (like a spacetime worm).  
     - *Answers matching this view*:  
       - **Q1**: C (phases/parts)  
       - **Q2**: C (Pat survives as both)  
       - **Q3**: A or D (continuity or neither)  
       - **Q4**: B (two objects)  
       - **Q5**: *Any* (not diagnostic)  
       - **Q6**: B (exists on Tuesday)  
       - **Q7**: A (same car)  
       - **Q8**: B (two objects at a time)  

  2. **Stage Theory ("Exdurantism")**:  
     - Only momentary "stages" exist. Objects are stages. "Past" properties come from relations to prior stages.  
     - *Answers matching this view*:  
       - **Q1**: B (Tuesday’s poker is new)  
       - **Q2**: A or C (Pat dies, or Pat is both via counterparts)  
       - **Q3**: D (original gone)  
       - **Q4**: B (two objects—stages compose distinct worms)  
       - **Q5**: *Any* (not diagnostic)  
       - **Q6**: A (doesn’t exist Tuesday)  
       - **Q7**: B (not the same car—new stage)  
       - **Q8**: B (two objects—lump and statue are distinct worms)  

  3. **Endurantism (Relativization)**:  
     - The same object is wholly present at every moment. Properties are held *relative to times* (e.g., "bent-at-t").  
     - *Answers matching this view*:  
       - **Q1**: A (same poker)  
       - **Q2**: B (Pat survives as one)  
       - **Q3**: A or B (continuity *or* matter)  
       - **Q4**: A (one object)  
       - **Q5**: A (property held relative to time)  
       - **Q6**: A (doesn’t exist Tuesday)  
       - **Q7**: A (same car)  
       - **Q8**: A (one object)  

  4. **Endurantism (Adverbialism)**:  
     - The same object is wholly present at every moment. Properties are held *timelessly but modified* (e.g., "bent on Tuesday").  
     - *Answers matching this view*:  
       - **Q1**: A (same poker)  
       - **Q2**: B (Pat survives as one)  
       - **Q3**: A or B  
       - **Q4**: A (one object)  
       - **Q5**: C (property held in a time-modified way)  
       - **Q6**: A (doesn’t exist Tuesday)  
       - **Q7**: A (same car)  
       - **Q8**: A (one object)  

  5. **Endurantism (Tensed Properties)**:  
     - The same object is wholly present at every moment. Properties are *tensed* (e.g., "was straight, is bent").  
     - *Answers matching this view*:  
       - **Q1**: A (same poker)  
       - **Q2**: B (Pat survives as one)  
       - **Q3**: A or B  
       - **Q4**: A (one object)  
       - **Q5**: *Ambiguous* (often B or C, but varies)  
       - **Q6**: A (doesn’t exist Tuesday)  
       - **Q7**: A (same car)  
       - **Q8**: A (one object)  
     - *Note*: Q5 doesn’t cleanly split tensed views—use your intuition.  

  #### Diagnostic Notes  
  - **Q1** is the "core split":  
    - A → Endurantism (all types)  
    - B → Stage Theory  
    - C → Perdurantism  
  - **Q2 and Q3** refine the split:  
    - Perdurantists accept branching (Q2C, Q3A/C).  
    - Stage theorists reject strict identity (Q2A, Q3D).  
    - Endurantists reject branching (Q2B, Q3A/B).  
  - **Q4 and Q8** test object counting:  
    - Perdurantism/Stage Theory count more objects (Q4B, Q8B).  
    - Endurantism counts fewer (Q4A, Q8A).  
  - **Q5** splits Endurantism:  
    - A → Relativization  
    - C → Adverbialism  
    - B → Tensed (or Relativization)  
  - **Q6 and Q7** test gaps and part-change:  
    - Gaps (Q6): Perdurantism allows them (B), others reject (A).  
    - Part-change (Q7): Stage Theory often denies strict identity (B).  

  #### Limitations  
  - **Stage vs. Perdurantism**: Q1, Q2, and Q6 distinguish them, but Q4 and Q8 *don’t*—both count multiple objects.  
  - **Endurantism subtypes**: Q5 is the best split, but tensed properties (B/C) overlap. Real-world intuitions often blur here.  
  - **Unoccupied Combinations**:  
    - "Q1B + Q2B" (stage-like but Pat survives as one) is rare. It implies inconsistent counterpart relations.  
    - "Q1A + Q2C" (endurance with Pat as both) is incoherent—endurantism rejects branching identity.  
    - "Q6B + Q7B" (gaps allowed but car not same) is unexplored but possible (e.g., a gap-tolerant stage theory).  

  #### Result  
  Tally your answers and see which view fits most consistently. If you have a mix:  
  - **Mostly A in Q1, Q4, Q8 + B in Q2 + A/C in Q5** → You’re an endurantist. Refine with Q5.  
  - **Mostly B in Q1 + A/D in Q3 + B in Q4/Q8** → You’re a stage theorist.  
  - **Mostly C in Q1/Q2 + A/B in Q3 + B in Q4/Q8** → You’re a perdurantist.  
  - **Deflationary/No-Fact**: If you reject premises (e.g., "there’s no single answer in Q3"), you lean deflationary.  

  This quiz isolates the *cases* behind the slogans. For primary sources, check out Lewis (*On the Plurality of Worlds*) for perdurance/stage, van Inwagen (*Material Beings*) for endurance, or Sider (*Four-Dimensionalism*) for the big picture.
