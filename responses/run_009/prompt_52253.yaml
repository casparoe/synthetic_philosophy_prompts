answer: |-
  Here's a mock essay question, model answer, and marking scheme designed to force engagement with the specific theoretical cruxes your professor emphasized, moving beyond textbook summaries.

  ---

  **Mock Essay Question (90 minutes):**

  > In 1878, the "Stahlbund" (Steel Alliance)—a decades-old defensive pact between three Central European powers—collapsed abruptly following a minor border dispute between members A and B over a resource-poor valley. Consider two explanations for the collapse:
  >
  > **Explanation 1 (Law-Sketch):** "Alliances under stress fracture when perceived benefits fall below costs *and* credible external threats diminish *and* internal cohesion mechanisms fail. Here, rising trade tensions increased costs; détente with a rival power reduced threat perception; and the aging monarch of member C (the traditional mediator) was incapacitated, weakening cohesion. *Ceteris paribus*, such conjunctures predict dissolution."
  >
  > **Explanation 2 (Narrative):** "The dispute began routinely. A's garrison commander exceeded orders, seizing a B-controlled customs post. B's foreign minister, facing domestic criticism for 'weakness' after a recent unrelated scandal, *chose* a maximalist response (demanding public apology & reparations) *rather than* the usual quiet diplomacy. Member C's crown prince (acting for his ill father), personally distrusting B's minister after a past slight and misjudging A's willingness to compromise, *refused to mediate*, *instead* forwarding B's demands verbatim. A, interpreting C's action as endorsement, felt betrayed and mobilized. Seeing mobilization, B mobilized. C, unprepared and isolated, declared the alliance void."
  >
  > **Analyze:** Does Explanation 2 offer a genuinely distinct form of historical explanation compared to Explanation 1? Specifically:
  >   a)  Is its explanatory power best understood as a covert covering-law explanation relying on suppressed generalizations, or does it work primarily through contrastive exclusion ("why *this* happened *rather than* specific alternative X, Y, or Z") and rendering the outcome "unsurprising in retrospect" via tracing continuities?
  >   b)  Does the distinction between making the collapse "unsurprising in retrospect" (as the narrative does) and making it "expectable in advance" (as the law-sketch attempts) reveal a fundamental difference in how these explanations function? Does this distinction do significant work in adjudicating their merits?
  > Argue your position using the specific details of the explanations provided and the core concepts of the covering-law vs. narrative debate.

  ---

  **Model Answer (Approx. 650 words):**

  Explanation 2 represents a fundamentally distinct mode of historical explanation compared to Explanation 1, deriving its power not from subsumption under generalizations but from contrastive exclusion and the retrospective construction of a coherent, continuous path to the outcome. The distinction between retrospective unsurprisingness and prospective predictability is crucial here, highlighting the unique logic of narrative explanation.

  Explanation 1 exemplifies a covering-law *sketch*. It posits a law-like pattern ("Alliances under stress fracture when...") filled with hedged conditions (perceived benefits, credible threats, cohesion mechanisms) and *ceteris paribus* clauses. Its explanatory force *aims* at showing the collapse was expectable *in advance* given the conjunction of antecedent conditions (trade tensions, détente, mediator incapacitation). However, its generalizations are vague ("under stress," "fracture," "cohesion mechanisms fail") and the *ceteris paribus* clause is problematic. What constitutes "other things being equal"? Arguably, it simply means "unless something specific happens to prevent it," which Explanation 2 provides *in detail*. The law-sketch gestures towards prediction but relies on post-hoc identification of necessary conditions, offering only a thin, potentially circular account.

  Explanation 2, in contrast, operates through **contrastive exclusion** and **tracing continuities**. It doesn't invoke broad laws of alliance behavior. Instead, it makes the collapse intelligible by showing why the *specific* outcome (complete, abrupt dissolution triggered by mobilization) happened *rather than* nearby, plausible alternatives: 1) Why did a routine dispute *not* end via quiet diplomacy (B's minister's choice driven by domestic pressure); 2) Why did mediation *not* occur (Crown Prince's personal distrust and misjudgment); 3) Why did C *not* attempt de-escalation after mobilization began (feeling isolated/unprepared). By sequentially eliminating these specific counterfactual forks in the road – each contingent on particular agents' choices, perceptions, and contexts at precise moments – the narrative builds a chain of necessary (though not sufficient *by themselves*) steps towards dissolution. The outcome becomes "unsurprising in retrospect" not because it was predictable from initial conditions plus laws, but because the narrative constructs a continuous, intelligible sequence where each step follows plausibly from the prior state *in this specific context*. The Crown Prince's refusal *makes sense* given his personal history with B's minister; A's mobilization *makes sense* interpreted as betrayal after C's action. The narrative fits the outcome into a web of understood reasons, motives, and local causalities.

  The core generalization embedded in the narrative is remarkably thin: "Events typically develop continuously" or "Actions have intelligible reasons in context." This is **not a covering law**. It doesn't predict specific outcomes; it's a principle of *intelligibility* and *plausible connection* guiding the historian's selection and arrangement of events. It justifies why we accept B's minister's choice as a *reason* for the maximalist response, linking it to the prior scandal, without implying all ministers facing scandals act that way. The power comes from ruling out the nearby alternatives, showing dissolution was the path *actually taken* given this sequence of contingent choices, making it seem almost inevitable *looking back* along that path.

  The distinction between "unsurprising in retrospect" and "expectable in advance" is **crucial and revealing**:
  *   **For the Law-Sketch (Exp1):** Its failure to make the collapse reliably expectable in advance (due to vagueness, *ceteris paribus*) is a *weakness*. Predictive power is its claimed goal.
  *   **For the Narrative (Exp2):** Making the outcome unsurprising in retrospect is its *strength and goal*. It doesn't claim predictability; it claims *understanding* of why *this* happened *here*. The narrative thrives on contingency – the collapse depended on the *specific* choices of these actors at these times. Predicting those choices in advance might be impossible, but narrating their interconnected reasons renders the result comprehensible afterward. This distinction highlights that narrative explanation aims for a different epistemic good: not subsumptive prediction, but contextual intelligibility through contrastive tracing.

  Therefore, Explanation 2 is not merely a covering-law explanation with suppressed premises. Its structure, reliance on contrastive exclusion of specific alternatives, use of thin continuity/intelligibility principles rather than predictive laws, and embrace of retrospective unsurprisingness over prospective predictability demonstrate a logically distinct mode of historical explanation. The narrative gains its power by meticulously showing why the dissolution path was taken instead of the readily available alternatives, constructing a coherent sequence where the endpoint fits plausibly with its antecedents, even if it could not have been foretold.

  ---

  **Marking Scheme (Out of 20):**

  *   **A (18-20):** Outstanding. All B criteria met, PLUS:
      *   **Crucially:** Explicitly and correctly analyzes the "thin generalization" in the narrative ("events develop continuously"/"actions have intelligible reasons") as a principle of *intelligibility and plausible connection* guiding counterfactual contrast and sequence construction, **NOT** as a failed covering law or a hidden sufficient cause. Demonstrates this is fundamental to narrative's distinct logic.
      *   Clearly articulates how *contingency* (specific choices, perceptions, contexts) is central to the narrative's power and why this undermines the covering-law ideal.
      *   Insightfully discusses how the *ceteris paribus* clause in Exp1 masks the very contingencies Exp2 explains.
      *   Seamlessly integrates specific details from both explanations throughout.
  *   **B (15-17):** Very Good. Demonstrates solid understanding.
      *   Correctly identifies Exp1 as a covering-law sketch and analyzes its weaknesses (vagueness, problematic *ceteris paribus*, potential circularity).
      *   Correctly identifies Exp2 as relying on contrastive exclusion ("why not X, Y, Z?") and making the outcome unsurprising in retrospect.
      *   Argues effectively that Exp2 is structurally distinct from Exp1.
      *   Clearly explains the significance of the retrospectivity/predictivity distinction, showing it works differently for each explanation type (predictivity weakness for Exp1, retrospectivity strength for Exp2).
      *   Uses specific details from the explanations.
      *   *May* touch on the thin generalization but not fully grasp its non-lawlike role as a principle of intelligibility/plausibility.
  *   **C (12-14):** Adequate. Basic understanding but superficial or incomplete.
      *   Defines covering-law and narrative explanation correctly.
      *   Identifies Exp1 as covering-law and Exp2 as narrative.
      *   Mentions contrast or retrospectivity for Exp2 but doesn't deeply analyze *how* it works in the case.
      *   Discusses the predictivity/retrospectivity distinction vaguely without clearly tying it to the structural differences or the case specifics.
      *   Relies more on general theory than specific case application.
      *   Misses the nuanced analysis of the thin generalization and the core distinction in explanatory logic.
  *   **D (9-11):** Poor. Significant misunderstandings or omissions.
      *   Struggles to correctly classify the explanations.
      *   Treats Exp2 as just a weak or implicit covering-law explanation.
      *   Ignores or misinterprets contrastive exclusion and the role of retrospectivity.
      *   Fails to engage meaningfully with the predictivity/retrospectivity distinction.
      *   Little use of specific case details.
  *   **F (0-8):** Inadequate. Fundamental errors or fails to address the question.

  **The Key Move Memorizers Miss:** Students relying on memorized labels will almost invariably fail to **correctly characterize the thin generalization ("events develop continuously") as a non-lawlike principle of intelligibility/plausibility that structures the counterfactual contrasts and sequence construction.** They will likely either dismiss it as trivial (not seeing its functional role) or incorrectly try to force it into a covering-law mold (e.g., "the narrative *assumes* the law of continuity"), missing its role in enabling the *narrative logic* itself. The A answer must explicitly confront and correctly resolve this.
