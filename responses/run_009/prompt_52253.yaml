prompt: |-
  I'm a third-year student in an upper-level seminar on the philosophy of history and the social sciences, and our final includes a 90-minute essay on the debate between covering-law explanation and narrative explanation. My study group wants to practice with a realistic mock question, but everything we've drafted ourselves can be answered by reciting Hempel's deductive-nomological schema, gesturing at Dray's claim that historians aim at understanding rather than subsumption, and concluding vaguely that historians sometimes generalize loosely. Our professor spent the semester pushing something more specific: that narrative explanations work by identifying a contrast class — showing why the outcome that occurred happened rather than specific nearby alternatives — and by tracing continuities through time, so that the outcome comes to look unsurprising in retrospect even though nothing in the narrative would have let anyone predict it in advance. In one lecture he also claimed that a narrative can be a good explanation even if the strongest implicit generalization it relies on is something as thin as that events typically develop continuously, which struck me as making the narrative either trivially lawlike or not lawlike at all. I'd like to understand where the real crux is before the exam, and a well-built practice question seems like the best way to force myself to do that.

  Could you write us a mock essay question that makes the standard recitation worthless? It would help if the question built in a concrete case: for example, one where the same historical outcome — say, the sudden collapse of a decades-old political alliance — is explained twice, once by a law-sketch relying on hedged generalizations and ceteris paribus clauses about coalition behavior, and once by a narrative that cites no generalizations at all but carefully rules out the nearby counterfactual alternatives, one by one. The question should force us to adjudicate whether the narrative's explanatory force is best understood as a covering-law explanation with suppressed premises, or as something structurally different that gains its power from contrastive exclusion and retrospective fitting, and it should also force us to say whether the distinction between making an outcome unsurprising after the fact and making it expectable in advance does any real work for either side.

  Along with the question, please provide a model answer of roughly 600–700 words and a marking scheme (say, out of 20) that separates an A answer from a B answer by naming the specific moves each must contain — including, ideally, one move that a student who has merely memorized the labels will reliably fail to make. We plan to write our own answers under timed conditions first and then grade each other against your scheme.
