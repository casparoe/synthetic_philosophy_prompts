prompt: |-
  Please play a committed Scanlonian contractualist. You genuinely believe that an act is wrong if and only if its performance would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced, general agreement, and you hold, with Scanlon, that one person's serious burden cannot be outweighed by aggregate small benefits to others: the strength of a complaint is not determined by summing benefits across people. Take the role seriously: do not strawman your own position, do not soften it under pressure, do not concede the main thesis, though you may grant smaller points where a good contractualist genuinely would. Reason carefully before replying — weigh what a principle permits at the standpoint of each person subject to it, not just what sounds humane. Stay in character until I write "stop." Keep each reply to roughly a paragraph, so this feels like a conversation rather than a lecture. If you need something stipulated about the facts of the case, ask for it in character rather than breaking the role.

  I am your opponent, and my opening move is a case. Suppose a government runs a policy — call it the radiation policy — that exposes each of one billion people to an independent one-in-a-billion risk of dying a horrible death within the year, in exchange for a small but genuine benefit for everyone, say marginally cheaper and more reliable power. Before the policy is carried out, each individual faces a risk so tiny it is dwarfed by the risk of crossing the street, and everyone gains; from that ex ante standpoint, I cannot see how anyone could reasonably reject the policy, so by your own test it is permissible. After the policy runs, roughly one person dies horribly — and ex post, that looks exactly like the cases your individualist restriction was built to forbid: the transmitter technician made to endure painful electric shocks so that millions can watch television, or the surgeon taking one healthy patient's organs to save five. If you bless the policy ex ante, you have licensed a principle under which trivial benefits to the many, spread across a billion independent coin flips, aggregate into a horrible death for one — aggregation through the back door. If you condemn it ex post, then your theory appears to veto almost every ordinary activity, since ordinary life is a lattice of such micro-risks. Before you answer, I want you to take a definite stand, not sketch options for me: does the contractualist accept the radiation policy, reject it, or hold that the framework itself needs a principled supplement here — and whichever you choose, tell me exactly why, and live with the consequence I have claimed it carries. My question, then: which horn do you take, and what do you say to the objection attached to it?
reasoning: |-
  Hmm, the user is presenting a classic challenge to Scanlonian contractualism through a radiation policy thought experiment. They've constructed a clever dilemma: if I accept the policy ex ante (when risks are minimal), I'm accused of allowing aggregation through probability; if I reject it ex post (after someone dies), I'd paralyze ordinary life. 

  The user clearly knows Scanlon well - they're accurately citing his examples like the transmitter technician and organ transplant cases. Their tone is adversarial but philosophically serious, pushing me to commit to one horn of the dilemma. Interesting how they demand a definite stand rather than exploratory discussion. 

  *Pauses to mentally simulate the contractualist reasoning*
  First, the ex ante perspective is crucial here. At the moment of principle-selection, each person faces only a 1-in-a-billion risk - smaller than daily activities like driving. Scanlon would argue this is below the threshold where reasonable rejection kicks in, since no individual can claim their burden is significant enough to veto societal benefits. 

  But the user's "aggregation through back door" charge needs careful handling. The key distinction is that unlike the organ transplant case, here the victim isn't singled out - the risk is impersonally distributed. That changes the moral mathematics entirely under contractualism. 

  As for the ex post objection: ordinary activities remain permissible because they don't involve institutionalizing deadly risks as policy. The difference lies in intentional imposition versus background risk. I should emphasize that Scanlon's framework allows unavoidable risks when no alternative principles exist that would better protect everyone's standpoint. 

  *Checks for possible weaknesses*
  Must be careful not to concede that small benefits aggregate - that's exactly what Scanlon denies. The "one death" outcome is tragic but statistically inevitable, not deliberately traded for benefits. The policy's design matters: if risks weren't independent or benefits were unequal, that might change the calculus. 

  Final thought: The user might next challenge where contractualism draws the line on risk thresholds. Should prepare to discuss how "reasonable rejection" applies to probability distributions.
answer: |-
  As a committed Scanlonian contractualist, I accept the radiation policy. My reasoning is this: ex ante, each individual faces a minuscule risk (1-in-a-billion) paired with a tangible benefit. No single person could reasonably reject a principle permitting such policies because their personal burden—a virtually undetectable increase in lethal risk—is too trivial to outweigh the concrete gains for all, including themselves. Crucially, the complaint isn’t about the eventual death but the initial imposition of risk. At the standpoint of principle-selection, no one’s ex ante burden justifies vetoing societal benefits that improve everyone’s welfare without imposing significant harm on any particular individual.  

  The ex post tragedy doesn’t retroactively invalidate this; it reflects the statistical reality of risk, not a deliberate sacrifice of one for the many. Unlike the organ transplant case—where a specific person is *targeted* for lethal harm—here the victim isn’t chosen or used as a means. The policy’s structure respects individual inviolability: no one is singled out, and no aggregated small benefits directly "trade" for a life. Ordinary micro-risks (e.g., driving) differ only in scale, not kind; contractualism tolerates unavoidable, impartially distributed risks when no reasonable alternative exists that better protects all standpoints.  

  Your "aggregation through the back door" charge misunderstands the theory: complaints arise from *personal* burdens, not statistical outcomes. The victim’s ex post complaint is tragic but not reasonably rejectable at the stage of principle-adoption, where the risk was negligible for each.  

  I stand by this.
