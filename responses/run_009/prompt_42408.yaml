prompt: |-
  I chair the ethics review panel at a software company of about 800 people. Once or twice a month we get asked to bless or veto policies before they ship — data practices, hiring rules, marketing claims, referral bonuses, that kind of thing — and our current "framework" is basically vibes plus whoever argues loudest. I've been reading up on Kant's universalizability test (the idea being that an act is wrong if the policy behind it couldn't hold as a law for everyone) and I want to try making it into an actual procedure my panel can run.

  Complications I already know about from reading around: apparently the Kant people distinguish two different things you look for when you universalize a maxim — a contradiction in even conceiving the universalized world, versus being able to picture the world fine but no rational agent being able to will it into existence. Also there's the problem that how you describe the maxim changes the verdict: "I'll lie when it benefits me" fails differently than "I'll lie this Tuesday to close the Acme deal," so people can rig the test by over-specifying. I have no idea how much of this is supposed to survive into a usable procedure versus being philosophy-office furniture, so you decide what makes the cut.

  Here's what I want:

  1. **The procedure** (~700 words) — numbered steps, the questions to ask in order, what counts as a sufficient answer at each step, and a step for pinning down the maxim's description so nobody can game it by describing their proposal too narrowly or too vaguely. Say where the procedure terminates in a "no" versus where it punts to a human because the question is a values call that universalizability was never meant to answer (e.g. the maxim is just trivially universalizable, like everyone prefering coffee to tea, and the real issue lives somewhere else). It has to be runnable by five smart non-philosophers in a 90-minute meeting, and the verdict has to be explainable to leadership in a paragraph they'll actually read.

  2. **Where judgment lives** (~150 words) — an honest list of which steps are judgement calls dressed up as procedure, so we know when we're fooling ourselves.

  3. **Three test cases** (~400 words) — run it on: (a) letting recruiters shade the truth about promotion timelines so candidates don't walk, (b) collecting behavioral analytics on users and monetizing them, disclosed only in a 40-page terms of service that everyone knows nobody reads, and (c) giving job candidates falsely warm rejection feedback so we don't burn bridges. I fully expect to dislike how at least one of these comes out — that's part of why I'm asking — but tell me plainly which ones the test was built for and which ones it just doesn't reach.

  4. **What the procedure can't do** (~150 words) — where universalizability is silent or looks like it gives the wrong answer entirely, and what I should stop pretending it can handle.

  Keep the Kant jargon out of the procedure itself, but you can use it in sections 2 and 4 so I can follow up on my own. No reading lists or name-dropping of papers — just the procedure and the commentary.
reasoning: |-
  Okay, the user chairs an ethics review panel at a software company with about 800 employees. They're looking to implement a more structured ethical review process based on Kant's universalizability test. Currently, their process is informal—"vibes plus whoever argues loudest"—which isn't ideal for consistent decision-making. They want a practical procedure that non-philosophers can run in 90-minute meetings, with clear steps and outcomes explainable to leadership.

  The key challenges they mentioned include the complexity of Kant's distinctions (contradiction in conception vs. contradiction in will), and the problem of how maxim descriptions can be manipulated. They need a procedure that avoids philosophical jargon but captures the essence of universalizability in a business context.

  I should create a numbered step-by-step procedure that addresses the maxim description problem upfront. For the "pinning down the maxim" step, I'll need to balance specificity and generality—perhaps requiring that descriptions include the core action, reason, and context without being overly narrow. The procedure should terminate with clear "no" verdicts when contradictions are found, and punt to human judgment when universalizability is trivially satisfied but ethical concerns remain.

  For the judgment section, I'll highlight where subjectivity creeps in: mainly in steps 1 (defining the maxim) and 4 (assessing rational willingness). These steps involve interpretation despite the procedural framing.

  The test cases are revealing: (a) recruiter deception, (b) opaque data practices, (c) insincere feedback. I anticipate the procedure will flag (a) and (b) as failing universalizability due to contradictions—lying destroys trust systems, hidden exploitation undermines consent systems. Case (c) might pass the universalization test but feel ethically dubious, exposing the limits of Kant's framework for "white lies" that don't clearly destroy systems.

  In the limitations section, I'll note where universalizability falls short: value conflicts (tea vs. coffee), distributive justice questions, cultural differences Kant didn't address, and cases where harm matters more than contradiction. The user should supplement this with harm-assessment tools when these gaps appear.

  The tone should stay practical—this is for busy professionals, not philosophy seminars. No jargon in the procedure itself, but precise Kantian terms can appear in commentary for the user's deeper reference. The goal is actionable ethics, not theoretical perfection.
answer: |-
  Here’s a practical universalizability procedure for your ethics panel, stripped of jargon and designed for real-world use:

  ---

  ### 1. **The Procedure** (Kantian Universalizability Test for Policies)  
  **Goal:** Determine if a proposed policy could function as a universal law without undermining the systems it depends on or rational cooperation.  

  **Step 1: Define the Maxim**  
  *   Ask: "What is the *specific action* we’re taking, *why* are we taking it, and in *what context*?"  
      *   *Example:* "Shading truth about promotion timelines (action) to retain candidates (why) when competitors are hiring aggressively (context)."  
  *   **Sufficient description:** Must include:  
      - **Action** (what’s being done),  
      - **Intent** (the goal/benefit sought),  
      - **Context** (key situational triggers).  
  *   **Red flag:** Overly narrow (e.g., "...on Tuesdays") or vague (e.g., "...when beneficial"). Reject and refine.  
  *   *Output:* A clear maxim: "We [action] to achieve [intent] in [context]."  

  **Step 2: Universalize the Maxim**  
  *   Ask: "What if *every* person/organization facing this context *always* acted this way to achieve this intent?"  
      *   *Example:* "What if every company *always* shaded the truth about promotion timelines to retain candidates when hiring is competitive?"  
  *   **Sufficient answer:** Describe the world where this is a universal rule. No analysis yet – just picture the scenario.  

  **Step 3: Test for Contradiction in Conception (Does the System Collapse?)**  
  *   Ask: "Does this universal rule destroy the very thing the action needs to work, or make the intent impossible to achieve?"  
      *   *Key checks:*  
          - Does it break a system it relies on? (e.g., If *everyone* lies, trust vanishes → lying stops working).  
          - Does it make the intent self-defeating? (e.g., If *everyone* breaks promises, promises become meaningless → you can’t benefit by breaking them).  
  *   **VERDICT: NO** if YES (Contradiction Found). Policy is ethically vetoed. *Explain:* "If everyone did this, [system] would break, making the action pointless/harmful."  
  *   **Proceed to Step 4** if NO (The world is conceivable).  

  **Step 4: Test for Contradiction in Will (Would Anyone Choose This World?)**  
  *   Ask: "Could a rational agent *willingly choose* to live in this universalized world, knowing they could be on the receiving end?"  
      *   *Key checks:*  
          - Does it destroy essential conditions for rational cooperation/autonomy? (e.g., universal deceit undermines informed consent).  
          - Does it create a world no one could reasonably accept? (e.g., universal exploitation).  
  *   **VERDICT: NO** if NO (Contradiction Found). Policy is ethically vetoed. *Explain:* "No rational person would choose this world because [core value destroyed, e.g., trust, fairness]."  
  *   **VERDICT: PASSES Universalizability** if YES. Proceed to **Step 5**.  

  **Step 5: Handle "Trivial Pass" (The Values Call)**  
  *   Ask: "Does passing this test feel like it *misses the core ethical concern*? Is the real issue about fairness, harm, or competing values *not* addressed by universalizability?"  
      *   *Signs of a "Trivial Pass":*  
          - The maxim is harmless preference ("everyone prefers coffee").  
          - Universalization works, but the action seems exploitative, unfair, or harmful in a way that doesn't break systems or rational will.  
  *   **OUTCOME:**  
      - If **NO** (Test captured the core issue): Policy is ethically cleared *on Kantian grounds*.  
      - If **YES** (Test passed but feels wrong/dodged the issue): **PUNT**. Flag that universalizability doesn’t resolve this. Use other frameworks/human debate. *Explain:* "This policy is universalizable, but concerns about [harm, fairness, etc.] remain unresolved and require separate assessment."  

  ---

  ### 2. **Where Judgment Lives**  
  The procedure masks judgment in two key places:  
  1.  **Step 1 (Defining the Maxim):** Determining the "right" level of abstraction is interpretive. What counts as the core "context" or "intent"? Judgment shapes the test's input.  
  2.  **Step 4 (Contradiction in Will):** Assessing what "a rational agent" would "willingly choose" is inherently value-laden. It relies on shared intuitions about rational cooperation and fundamental goods (trust, autonomy, non-exploitation).  
  These judgments aren't mechanical; they depend on the panel's reasoned consensus about essential human interactions.

  ---

  ### 3. **Test Cases**  

  *   **(a) Shading Truth on Promotions:**  
      *   **Maxim:** "We tell less-than-truthful statements about promotion timelines to retain candidates when we fear they might decline our offer."  
      *   **Step 3 (Conception):** Universalize → If *every* company *always* did this, candidates would universally distrust promotion timelines. Trust collapses → lying stops working to retain candidates. **CONTRADICTION → VERDICT: NO.**  
      *   *Built for this:* This is the classic "lying undermines truth-telling" case Kant excels at.  

  *   **(b) Hidden Behavioral Analytics Monetization:**  
      *   **Maxim:** "We collect and monetize detailed user behavioral data without explicit, informed consent to maximize revenue, relying on disclosure in lengthy, unread TOS."  
      *   **Step 3 (Conception):** Universalize → If *every* company *always* did this, users would have *no* expectation of privacy/data control. The concept of "informed consent" via TOS becomes meaningless (nobody reads, everyone knows). **CONTRADICTION** (Consent mechanism breaks) **→ VERDICT: NO.**  
      *   *Built for this:* Highlights how undermining consent mechanisms makes the practice self-defeating.  

  *   **(c) Falsely Warm Rejection Feedback:**  
      *   **Maxim:** "We give disingenuously positive feedback to rejected candidates to avoid damaging future relationships when we anticipate needing their skills later."  
      *   **Step 3 (Conception):** Universalize → If *every* company *always* did this, candidates might suspect insincerity, but the *system* of giving feedback doesn't collapse. Feedback still functions. **Passes Step 3.**  
      *   **Step 4 (Will):** Could a rational agent will this world? **Potentially YES.** While uncomfortable, it doesn't destroy a fundamental condition like trust *in the way lying does* (feedback is often subjective; the core "lie" here is arguably less system-critical). **Passes Step 4.**  
      *   **Step 5 (Trivial Pass?):** **YES.** The test passes ("white lies" for social harmony can be universalized), but the *real concern* is insincerity, potential manipulation, and fairness. Kant misses the harm of dishonesty here. **PUNT to human judgment/other frameworks.**  
      *   *Doesn't reliably reach this:* Kant struggles with "small" deceptions perceived as socially useful or harmless. The harm is more interpersonal than systemic.

  ---

  ### 4. **What the Procedure Can't Do**  
  *   **Resolve Conflicts Between Values:** Universalizability might clear two conflicting policies (e.g., "Always maximize profit" vs. "Always minimize environmental harm"). It can't prioritize them.  
  *   **Address Pure Harm/Consequences:** If an action is universalizable *but* causes severe, widespread misery (e.g., a universally permitted but harmful addiction), Kant might permit it. Consequences aren't his primary focus.  
  *   **Handle Cultural Relativity:** The "rational agent" is idealized. What's "rationally willable" can feel culturally specific or ignore power imbalances.  
  *   **Assign Positive Duties/Weigh Distributive Justice:** It's better at forbidding actions ("don't lie") than mandating positive help ("how much should we give to the poor?") or judging fairness in resource distribution.  
  *   **Solve "Trivial Pass" Cases:** As seen in Test Case (c), actions deemed permissible by Kant may still feel intuitively unethical on other grounds (harm, dignity, sincerity).  

  **Stop Pretending It Can Handle:** Genuine dilemmas between competing goods, purely consequentialist arguments ("but it helps more than it hurts!"), fairness/equity calculations beyond non-exploitation, and "victimless" insincerities. Supplement with harm/benefit analysis and fairness frameworks when these arise.
