   Details:
   1: Unclear. Propensities are typically used for physical chances and might not directly underwrite statistical practice (which often uses frequencies). However, they can be used to model the underlying chance in a statistical model. We'll say partially, but note that confidence intervals are usually explained in terms of frequencies, not propensities.
   2: Yes, this is the main motivation.
   3: Yes, propensities are defined for single cases.
   4: Unclear: propensities are physical and not directly about guiding belief, but one can use the principal principle (if accepted) to set credence equal to the propensity. Without such a bridge, they don't directly guide credence. We'll say partially (if we add the principal principle) but not by themselves.
   5: Yes, by definition (they are properties of the single case).
   6: Partially: propensities are supposed to manifest in long-run frequencies (via the law of large numbers), but they are not defined as frequencies. So they are grounded in the sense that they should match frequencies in the long run, but we cannot measure a single propensity by a single frequency. We'll say yes, via the connection to frequencies in repeated trials (if the same propensity is repeated).
   7: Unclear: propensities are not about beliefs, so updating by conditionalization doesn't apply to them. However, if we use the principal principle to set our credences to propensities, then when we get new evidence we update our credences (by conditionalization) but the propensities themselves don't update. So the interpretation alone doesn't provide updating. We'll say no for the propensity itself, but the system that uses propensities might.
