prompt: |-
  So I'm drafting a paper on advance directives and I want a second pair of eyes before I send it anywhere. The core idea: most defenses of advance directives lean either on the autonomy of the earlier self (the "then-me" gets to rule because it's still me) or on precedent autonomy (the earlier self's choices bind in something like the way a promise binds). I think both are wrong, or at least incomplete, and I want to argue for what I'm calling the "epistemic trustee" view. When I sign a directive while competent, I'm the only party with reasonably full access to my own values — the later, demented self is in some sense a stranger to them. So the directive works less like a command from a sovereign and more like instructions a trustee leaves for a caretaker: authoritative, yes, but authoritative because of who has the relevant knowledge, not because of who owns the future.

  The notes I have so far, roughly:

  1. The identity route fails for the radical dementia case. If the later self genuinely doesn't remember or endorse the earlier values, "it's the same person choosing" does less work than people assume. Worse, identity cuts both ways: the later self is "me" too, so identity alone can't explain why we honor the directive over the protests of the confused patient sitting in front of us.

  2. Precedent autonomy handles that better, but it over-generates. It would keep the directive binding even when genuinely new information arrives that would have changed the earlier self's mind — say a new treatment makes the anticipated condition far less bad than the earlier self feared when signing. Insisting the directive binds regardless makes the practice look irrational.

  3. On the trustee view, the directive is defeasible guidance, not a command. Its weight is proportional to how well informed the earlier self's values were, and it can be overridden when the surrogate has strong evidence the earlier self would have decided differently under the new circumstances. And notice this is roughly what good clinicians already do quietly in practice, whatever the official forms say.

  What I want from you: mainly, tell me whether the trustee framing actually earns its keep or whether it's just precedent autonomy with a fresh coat of paint — a colleague said it's the latter and it stung. Also please poke at point 3, since the slide from "the directive is defeasible" to "clinicians already treat it that way" feels like it smuggles in an is-ought move, and I can't quite see how to patch it. Finally, is there an obvious case or thought experiment I should be engaging with that I'm missing? Don't give me references or a bibliography — just tell me the ideas, if any.

  Be honest. I'd rather hear it's bad from you now than from reviewers in six months.
reasoning: |-
  Okay, the user is drafting a paper on advance directives and wants feedback. They're proposing a "epistemic trustee" view as an alternative to existing autonomy-based defenses. Let me unpack their core arguments.  

  First, they critique two common approaches: the identity argument (which fails in radical dementia cases because the later self is disconnected from prior values) and precedent autonomy (which is too rigid when new information emerges). Their trustee view positions the earlier self as a knowledgeable guide rather than a sovereign ruler—authority stems from epistemic access to values, not ownership of future decisions.  

  The user’s main concerns:  
  - Is the trustee view meaningfully distinct from precedent autonomy, or just a repackaging? (A colleague called it the latter.)  
  - Does point 3 commit an is-ought fallacy by implying current clinical practices justify how directives *should* be treated?  
  - Are there gaps in their thought experiments?  

  **On distinctiveness**: The trustee view *is* novel because it shifts the justification from *authority* (who decides) to *epistemic reliability* (who knows best). Precedent autonomy is about binding promises; this is about preserving access to lost knowledge. The "dementia stranger" metaphor helps—it’s not that the later self lacks rights, but that it lacks the *data* to execute values coherently. That’s a fresh angle.  

  **On the is-ought slide**: Yeah, this is tricky. Observing that clinicians *do* override directives in practice doesn’t automatically mean they *should*. To fix it, they could:  
  - Explicitly argue that the trustee view *explains why* current practices are ethically sound (i.e., it’s not just descriptive but normatively grounded).  
  - Stress that defeasibility isn’t arbitrary—it’s tied to the earlier self’s *actual values*, not the surrogate’s preferences.  

  **Missing thought experiments**:  
  - **The repentant directive signer**: Imagine someone signs a directive refusing life-extending care for dementia, but later (mid-stage) expresses a desire to live. The trustee view would weigh *why*—is this new preference consistent with their lifelong values, or a distortion by the disease? Precedent autonomy might ignore the change.  
  - **The outdated directive**: A directive refusing "aggressive measures" for terminal cancer, written when chemo was brutal. Now, targeted therapy has mild side effects. A rigid autonomy view would enforce refusal; the trustee view allows reassessment based on updated facts.  

  **Other pokes**:  
  - Point 3’s "proportional to how well informed" needs tightening. What if the earlier self was misinformed? Does the trustee view *require* overriding?  
  - They should preempt an obvious counter: "Doesn’t this undermine autonomy?" Response: No—it protects *authentic* autonomy (values the person cared about) against *current* compromised autonomy.  

  **Verdict**: The framing earns its keep. It’s not precedent autonomy in disguise; it’s a values-rescue mission. But the is-ought gap needs plugging, and edge cases could sharpen the contrast.
answer: |-
  Your core idea is sharp and worth developing—the trustee view *is* distinct from precedent autonomy, and it addresses genuine gaps in the standard defenses. Below, I’ll break this down honestly: where your argument works, where it needs shoring up, and what’s missing.  

  ### 1. **Does "epistemic trustee" earn its keep?**  
  **Yes, it’s novel—not just repackaged precedent autonomy.** Here’s why:  
  - **Precedent autonomy** treats the directive as a *commitment* (like a promise): the earlier self binds the later self through a normative act. The focus is on *obligation*.  
  - **Your trustee view** treats the directive as *expertise*: the earlier self holds privileged access to values the later self cannot reconstruct. The focus is on *epistemic reliability*.  
  **Crucial distinction**: Precedent autonomy prioritizes the *act of choosing* (the directive as a sovereign command). Your view prioritizes *access to information* (the directive as a map left by the only person who knew the terrain). This reframes why we defer to the directive: not because the past "you" has authority over the future "you," but because the past "you" is the sole credible *witness* to your values. Your "dementia stranger" metaphor cuts deep here—it’s not that the later self is less "you," but that it’s *epistemically impoverished* regarding your values.  

  **Why your colleague is wrong**: If this were just precedent autonomy, it wouldn’t explain why new information *defeats* the directive (your point 2). Precedent autonomy, strictly applied, *would* bind you to outdated choices—like enforcing a promise even when circumstances radically change. The trustee view avoids this by making the directive’s authority contingent on the *accuracy* of the earlier self’s knowledge, not the bare fact of their choice.  

  ### 2. **Poking at point 3: The "is-ought" problem and defeasibility**  
  You’re right to worry—the slide from "clinicians do this" to "this is justified" is a vulnerability. But it’s fixable:  
  - **The problem**: Saying "good clinicians override directives when new info emerges" is descriptive. It doesn’t *prove* that they *should*. Someone could argue clinicians are just being paternalistic.  
  - **The patch**: Ground defeasibility in the *logic of the trustee view itself*. Argue that:  
    - The directive’s authority derives solely from the earlier self’s epistemic access to values.  
    - If new information (e.g., improved treatments) or evidence of a *misunderstanding* (e.g., the earlier self feared pain that no longer exists) shows the directive no longer reflects those values, adhering to it *betrays* the very justification for honoring it.  
    - Thus, override isn’t discretionary—it’s *required* when the trustee’s "map" is outdated. This makes defeasibility a normative implication of your view, not just a practical observation.  
  **Refine the proportionality claim**: Saying weight depends on "how well informed" the earlier self was is vague. Specify: *Well-informed about what?* Focus on:  
    - Understanding their *own values* (e.g., Were they coerced? Depressed?).  
    - Accuracy about *future scenarios* (e.g., Did they know the condition might be milder than feared?).  

  ### 3. **Missing thought experiments/cases**  
  Engage these to stress-test your view:  
  - **The repentant directive signer**: A person signs a directive refusing life-prolonging care for dementia. Later, with moderate dementia, they say they’re happy and want to live. Precedent autonomy says: enforce the directive. Identity says: the later self is "you," so listen to them. *Your view?*  
    - Trustee response: The later self’s happiness doesn’t negate the earlier self’s values—it may reflect disease-driven changes in cognition. Honor the directive *unless* there’s evidence the earlier self misjudged their values (e.g., they feared suffering but are now pain-free).  
  - **The outdated directive**: A directive refuses "aggressive measures" if diagnosed with terminal cancer. It’s signed when chemo was brutal. Now, new treatments are tolerable and extend life meaningfully.  
    - Trustee view: Override is justified—the earlier self’s refusal was based on outdated facts, not core values (e.g., avoiding pointless suffering).  
  - **The alienated later self**: A deeply demented patient actively protests care aligned with their directive (e.g., resists antibiotics for an infection they previously deemed "not worth treating").  
    - Challenge: Doesn’t ignoring their protests violate their current autonomy?  
    - Trustee reply: Their protests lack coherence with *any* stable values (earlier or later), so we default to the only coherent source—the directive. But if they express *new* values (e.g., "I love my grandchildren, I want to live"), we might weigh that as potential evidence the directive is outdated.  

  ### 4. **Other weak spots to fortify**  
  - **Avoid the "values essentialism" trap**: Don’t imply values are static. Clarify that the trustee view tracks what the person *cared about deeply* (e.g., "avoiding dependency"), not specific instructions ("no ventilators"). This helps justify overriding directives when *means* change (better tech), not *ends*.  
  - **Address the autonomy elephant**: Critics will say your view downgrades the later self’s wishes. Emphasize: The trustee view *protects* autonomy better than rivals because it respects what the person *truly valued* (accessible only to the earlier self), not just biological continuity or past promises.  
  - **Clarify "epistemic privilege"**: What makes the earlier self a "trustee"? Argue it’s their ability to *reason coherently* about values across time—a capacity eroded in dementia.  

  ### Final verdict  
  **This is good.** The trustee view is a defensible, original alternative to existing frameworks. It handles radical dementia and new information better than autonomy-based defenses, and it aligns with real-world clinical wisdom. **Where to focus revisions:**  
  - Tighten the defeasibility argument (tie it to your view’s logic, not practice).  
  - Preempt the "but what about current autonomy?" objection.  
  - Use the thought experiments above to show how your view differs in action.  

  Nail those, and reviewers will take this seriously. If this were a journal, I’d say "revise and resubmit," not "reject." Now go make it bulletproof.
