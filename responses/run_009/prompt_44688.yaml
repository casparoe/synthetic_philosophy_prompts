answer: |-
  Here are the desiderata for an evolutionary debunking argument (EDA) capable of rationally moving a reflective moral realist, structured to address your specifications. Key tensions and negotiable points are flagged.

  ### Core Desiderata (Non-Negotiable Given Purpose)
  1.  **Specificity of Selection Level (a):**
      *   **Requirement:** Must specify the level at which selection acted (content, behavior, underlying dispositions) *and* demonstrate why this level undermines justification for *moral belief specifically*. Cannot remain ambiguous.
      *   **Why:** The realist's defense hinges on this. If selection acted *only* on behavior/dispositions, she can argue beliefs formed by those dispositions *could* still track truth. If selection acted *directly* on content, the challenge is stronger.
      *   **Motivating Failure Case:** An EDA argues selection favored cooperative *behaviors*, concluding moral beliefs about cooperation are unjustified. The realist counters: "Selection shaped my dispositions to *detect* genuine cooperative *reasons* (a third factor), so my beliefs about cooperation being good *can* still be justified." The EDA fails because it didn't show why selection acting *only* on behavior undermines the epistemic status of the *belief content* derived from the underlying dispositions.
      *   **Non-Negotiable:** Without this specificity and linkage, the realist has a ready-made escape route.

  2.  **Overgeneration Constraint / Principled Disanalogy (b):**
      *   **Requirement:** Must either avoid debunking mathematics, logic, and ordinary perceptual beliefs (which also have non-truth-tracking genealogies) *or* provide a compelling, principled disanalogy showing why moral beliefs are uniquely vulnerable.
      *   **Why:** If the EDA debunks logic/math, it self-defeats (its premises rely on logic). If it debunks perception, it undermines empirical science (including evolutionary theory). The realist can legitimately ask, "Why is morality uniquely suspect?"
      *   **Motivating Failure Case:** An EDA claims: "Beliefs produced by cognitive faculties shaped for fitness, not truth, are unjustified." The realist notes: "My logical intuitions and perceptual beliefs are also products of such faculties. Yet I'm justified in trusting them (defeasibly). Absent a disanalogy, why single out morality? This principle seems fatal to *all* inquiry." The argument loses its targeted force and becomes self-undermining.
      *   **Non-Negotiable:** Failure here renders the argument globally skeptical or incoherent.

  3.  **Blocking the Third-Factor Reply (c):**
      *   **Requirement:** Must preempt or undermine the realist's claim that evolution selected for tracking mind-independent moral facts *because* those facts promoted fitness (e.g., "cooperation is adaptive AND cooperation is *genuinely good*; evolution tracked the good via tracking the adaptive").
      *   **Why:** This is the realist's most powerful countermove. It allows her to grant the evolutionary influence *without* conceding epistemic defeat.
      *   **Motivating Failure Case:** An EDA details how selection shaped dispositions favoring kin altruism, reciprocity, and in-group loyalty. The realist replies: "Exactly! Evolution shaped us to track *real moral properties* like special obligations, fairness, and loyalty *because* acting on those properties enhanced fitness. The genealogy explains reliability, not unreliability." The EDA fails to challenge the core realist claim of truth-tracking.
      *   **Non-Negotiable:** An EDA that doesn't engage this reply leaves the realist unmoved.

  4.  **Reflective Stability (e):**
      *   **Requirement:** The epistemic principle invoked by the debunker (e.g., "beliefs with purely adaptive origins are unjustified") must itself survive the argument's own machinery. Its justification cannot be undermined by the EDA's evolutionary story about belief-forming faculties in general.
      *   **Why:** If the debunker's epistemic norm is also a product of evolution shaped for fitness, not truth, then invoking it to debunk moral beliefs appears arbitrary or self-defeating. The realist can ask, "Why trust *this* principle?"
      *   **Motivating Failure Case:** An EDA relies on the principle (P): "Beliefs produced by faculties selected solely for fitness (not truth) are unjustified." The realist counters: "But P itself is a product of the very cognitive faculties shaped by evolution for fitness. If P is true, then P itself is unjustified. If you claim P is immune, you need a principled reason *why* it's immune that doesn't arbitrarily privilege it." The argument collapses into incoherence or arbitrariness.
      *   **Non-Negotiable:** Without reflective stability, the debunker's normative authority evaporates.

  ### Scope (d) - Negotiable & Camp-Dependent
  *   **Requirement:** Must clearly define the scope of debunking (wholesale realism? specific domains like deontology? specific judgments like incest-aversion?) and provide a *principled* basis for this scope. Cannot be strategically shifted without justification.
  *   **Why:** Realists need to know what's under attack. Shifting scope arbitrarily weakens the argument's credibility. Different debunkers have different aims (error theorists target all moral facts; others target specific foundations).
  *   **Motivating Failure Case:** An EDA targets "objectively prescriptive" moral facts wholesale. Under pressure, the debunker retreats: "Well, maybe it only debunks deontological intuitions, not consequentialist calculations." The realist asks: "What's the *principled* evolutionary reason for this distinction? This feels like moving the goalposts to salvage the argument." Without a clear, consistent scope based on the evolutionary critique itself, the argument loses focus and force.
  *   **Negotiable:** Scope depends on the debunker's metaethical goal (full error theory vs. undermining specific realist foundations). What's non-negotiable is that the *chosen* scope must be *principled* and *justified by the evolutionary account given*, not ad hoc. Error theorists demand wholesale debunking; others might accept narrower scopes if justified.

  ### Suspected Tension: (b) Overgeneration vs. (e) Reflective Stability
  *   **The Tension:** Satisfying (b) typically requires exempting logic/math (and often perception) by appealing to their *necessity*, *indispensability*, or *different epistemic status*. However, the *justification* for privileging these domains (the epistemic principle doing the exempting) is precisely what needs reflective stability (e). If the justification for exempting logic ("it's necessary for thought") is itself an evolved intuition, the challenge of (e) reappears. Grounding the exemption in a way immune to evolutionary explanation (e.g., rationalist insight, indispensability) is difficult and controversial.
  *   **Merely Apparent?** It can be mitigated but likely not dissolved. A debunker might argue logic/math are *constitutive* of rationality itself, making any attempt to debunk them performatively self-defeating in a way that debunking morality is not. However, justifying *why* logic gets this special constitutive status without relying on potentially evolved intuitions remains the core challenge. **I agree the tension is real:** Avoiding overgeneration often relies on epistemic moves vulnerable to the same evolutionary genealogy, threatening stability.

  ### Street & Joyce Against the List (Briefly)
  *   **Street (Darwinian Dilemma):** Strong on (a) (focuses on influence on *content* via shaping of evaluative attitudes), (c) (attacks third-factors as implausible coincidences), and principled scope (d) (targets robust realism requiring independent truths). Vulnerable on (b) (overgeneration concerns are frequent criticisms - why not logic/perception?) and especially (e) (her normative constructivism and epistemic standards face the stability challenge).
  *   **Joyce (Error Theory):** Strong on (a) (focuses on the *function* of moral judgment/concept as motivating, not truth-tracking), (b) (argues a principled disanalogy: moral judgment has a distinctive practical, motivating function absent in logic/math/perception), and clear scope (d) (wholesale error theory). Vulnerable on (c) (third-factor replies are a major point of contention - can he rule them out?) and (e) (justifying his epistemic norm ("accept only beliefs with truth-tracking genealogy") faces the stability challenge; why trust *this* norm?).

  These criteria define the high bar an EDA must clear to rationally challenge a sophisticated, evolutionarily informed moral realist. The tension between avoiding self-defeat (b) and maintaining normative authority (e) remains a central difficulty.
