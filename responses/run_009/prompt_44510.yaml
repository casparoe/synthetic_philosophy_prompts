prompt: |-
  I'm writing a term paper for a moral psychology course on whether cross-cultural variation in moral judgment undermines moral objectivity. I've drafted the core argument paragraph, pasted below, and I'd like comments on it before I build the rest of the paper around it. Please focus on three things: whether the central inference actually works, whether the empirical claims are roughly right (flag anything I've misremembered or oversimplified), and whether the argument is interesting or just a standard relativist riff I could find anywhere.

  Here's the draft: "WEIRD subjects — Western, educated, industrialized, rich, democratic — are moral outliers, and the moral psychology described in intro textbooks is a local curiosity rather than human nature. Three illustrations. First, Shweder's interviews in Bhubaneswar in the 80s: people there organized moral life around three ethics — autonomy, community, divinity — such that things WEIRD people file under taste or religion, like violations of purity norms, were treated as full-blown moral crimes, while people in the US basically reduced morality to harm and rights. Second, ultimatum games: WEIRD subjects offer close to half the pot and punish lowball offers, and even bystanders will pay to punish unfair strangers. But Henrich ran the game with the Machiguenga in the Peruvian Amazon and got offers averaging about a quarter with essentially zero rejections, and in the larger cross-cultural project offers rose with market integration — the fairness that feels written into the universe turns out to track how much your economy runs on dealing with strangers. Third, incest: the prohibition that feels most objective of all seems to be stamped in by co-residence rather than genetic relatedness — kids raised together in Israeli kibbutzim almost never married each other, and Taiwanese minor marriages, where the bride was adopted as a child and raised alongside her future husband, fell apart far more often than other arranged marriages (if I'm remembering Wolf's findings right). So the felt obviousness of one of our deepest taboos tracks a contingent psychological mechanism. Conclusion: our strongest moral intuitions are products of our local social arrangement, and their feeling of objectivity is just what a locally produced intuition feels like from the inside. We should hold moral objectivity, if we hold it at all, very loosely."

  Main thing I want feedback on: my TA says the core move — from facts about how a belief was caused to a conclusion about its truth or justification — is a genetic fallacy, and that I'd be just as entitled to argue that variation in astronomy beliefs across cultures means there are no stars. That analogy feels off to me but I can't articulate why — is there a version of my conclusion that survives the objection, or am I secretly leaning on some extra premise I haven't stated? Relatedly, out of my three examples, which one actually does the most work for the argument, and which is weakest? The purity one and the ultimatum one feel different in kind — one is about the content of moral judgment, the other about the depth of motivation to enforce it — and I suspect the paper should pick a lane. Also, if you think the whole framing is confused and the interesting question lies somewhere else nearby, say that too, before I waste three weeks on it. Be blunt, this is a draft I dashed of quickly and I'd rather hear it now.
reasoning: |-
  Okay, the user is writing a term paper on whether cross-cultural moral variation undermines moral objectivity. They've shared a draft paragraph and want feedback on three main areas: the validity of their central inference, the accuracy of their empirical claims, and the originality of their argument. They also have specific concerns about their TA's genetic fallacy objection and which examples are strongest.

  Hmm, the TA's genetic fallacy point is actually quite sharp. The user's draft does seem to imply that because moral intuitions are culturally caused, they can't be objective. But that's indeed a logical misstep - how something originated doesn't necessarily determine its truth value. The astronomy analogy highlights this well. Still, I see why the user feels the analogy is "off" - moral facts might be different from physical facts in how we access them.

  Looking at their examples: The purity norms example from Shweder is solid for showing content variation. The ultimatum game data demonstrates enforcement motivation differences. The incest taboo case is fascinating but might be their weakest link - the Westermarck effect explains aversion mechanics but doesn't necessarily challenge the wrongness of incest itself.

  For their paper's direction, they could pivot to argue that cross-cultural variation creates an epistemic problem for moral intuitionism specifically, not objectivity per se. The WEIRD critique is particularly valuable here - most moral psychology studies overgeneralize from unrepresentative samples. That's a more original angle than generic relativism.

  The user seems anxious about wasting time ("before I waste three weeks"), so I should be direct about flaws while offering constructive alternatives. Their draft shows good engagement with empirical literature but needs philosophical tightening. The strongest path forward would be to reframe around intuitionism's reliability rather than making a global claim about objectivity.
answer: |-
  This is a strong draft with compelling examples, but your TA's genetic fallacy objection hits the bullseye - **your current inference doesn't logically hold**, and the analogy *is* apt. However, your core intuition *can* be salvaged with a crucial reframing. Let's break it down:

  1.  **The Genetic Fallacy Problem (And How to Fix Your Argument):**
      *   **The Flaw:** Your paragraph concludes that because moral intuitions *originate* from contingent social arrangements, they lack objectivity. As your TA notes, this is textbook genetic fallacy. The *source* of a belief doesn't determine its *truth*. The astronomy analogy is perfect: ancient cultures had wildly different (and wrong) beliefs about stars *caused* by limited technology/cosmology, but stars objectively exist.
      *   **Why it Feels "Off":** You're likely sensing a disanalogy between stars and moral facts. Moral truths (if they exist) might be knowable *only* through our evolved/culturally shaped intuitions, whereas stars exist independently and are knowable through multiple methods (intuition, senses, instruments). The problem isn't variation *per se*, but the *mechanism of access*.
      *   **The Salvageable Core - Shifting the Target:** Your powerful examples *don't* undermine moral objectivity *itself*. Instead, they undermine **the reliability of moral intuitions as evidence for objective moral facts**, particularly within a **moral intuitionist framework** (which holds that moral intuitions are a direct, reliable source of moral knowledge).
      *   **Reframed Conclusion:** "Therefore, the profound cross-cultural variation in core moral intuitions, coupled with their demonstrable sensitivity to contingent social and economic factors (like market integration or childhood co-residence), severely undermines the reliability of *feeling* something is objectively wrong as evidence that it *is* objectively wrong. This presents a significant **epistemic challenge** for theories relying heavily on the deliverances of intuition as a foundation for objective moral knowledge, especially when those intuitions are demonstrably WEIRD-centric."
      *   **This Works Because:** You're no longer saying "social origin => not objective." You're saying: "Widespread, systematic variation in the *sources* we rely on to access morality, and the fact these sources track local contingencies, makes it deeply problematic to trust any single set of intuitions (especially our own WEIRD ones) as reliably revealing objective moral truths." This targets *justification* for believing *our specific intuitions* reveal objectivity, not objectivity itself.

  2.  **Empirical Claims (Roughly Right, But Nuances Needed):**
      *   **Shweder's Three Ethics:** Solid. This is foundational work. Key nuance: While WEIRD societies *emphasize* autonomy/harm/rights, elements of community/divinity ethics exist (e.g., debates about patriotism, sacrilege). They aren't *absent*, just less dominant in *explicit moral reasoning*. Mentioning "taste/religion vs. moral crime" captures the contrast well.
      *   **Ultimatum Games:** Excellent example. Henrich's work is pivotal. Nuances:
          *   Offers vary *within* WEIRD samples too (though less).
          *   "Market integration" correlation is robust. Emphasize this tracks *impersonal cooperation norms* needed for market societies. The key point about "fairness feeling universal but being contingent" is well-taken.
          *   "Bystanders pay to punish" is Third-Party Punishment games - subtly different but reinforces the WEIRD enforcement motivation point. Be precise if you have space.
      *   **Incest (Westermarck Effect):**
          *   **Accurate Core:** Wolf's Taiwanese minor marriage studies are classic evidence for the Westermarck Effect (aversion based on childhood co-residence, not genetics). Kibbutz data supports it.
          *   **Crucial Nuance:** This explains the *psychological mechanism of aversion*, **not** necessarily the *moral judgment itself**. People can (and do) believe incest is morally wrong *even if* they don't feel the visceral aversion (e.g., for genetic siblings separated at birth). However, the *strength and universality of the taboo* likely *stems* from this widespread aversion mechanism. Your point about "felt obviousness" tracking a contingent mechanism is valid, but clarify it's about the *source of the strong intuitive aversion*, not necessarily the *sole justification for the moral prohibition* (which might involve other reasons like harm risk, which *is* arguably objective, though debated).
          *   **Slight Oversimplification:** Say "the *strength and intuitive obviousness* of the incest taboo..." rather than implying the entire prohibition is *only* explained by co-residence. It's a major factor, not the only one.

  3.  **Interest Level & Avoiding Standard Relativism:**
      *   **The WEIRD Critique is Your Golden Ticket:** Framing this around **WEIRD moral psychology's limitations** is *very* interesting and current. It moves beyond generic "cultures differ" relativism to a specific critique of the *field itself* and the potential parochialism of theories built on its data. This is where your paper shines.
      *   **Targeting Intuitionism is Sharper:** Attacking the reliability of intuitions as a foundation for moral knowledge (especially given WEIRD bias) is more sophisticated and philosophically engaging than a simple "ergo relativism" conclusion.
      *   **Avoiding the Standard Riff:** Without the WEIRD critique and the focus on *epistemic access*, it risks being a standard relativist argument. *With* these elements, it becomes a potent critique of dominant methodologies and theories in moral psychology and ethics.

  **Which Example Does the Most Work?**
  *   **Ultimatum Games:** This is the **strongest** for your *reframed* argument. It most clearly demonstrates how a seemingly "universal" moral intuition (fairness) **quantitatively tracks a specific socio-economic variable (market integration)**. It directly links the "feeling of objectivity" to a measurable contingency in a way that's hard to dismiss. It perfectly illustrates the epistemic problem for trusting intuitions.

  **Which Example is Weakest (or Needs Careful Handling)?**
  *   **Incest Taboo:** This is the **weakest link** for directly supporting the *epistemic challenge* to objectivity. As noted, it primarily explains the *psychological aversion mechanism*, not necessarily the *moral judgment* or its potential objective grounds (like genetic harm). It powerfully challenges the *innateness* or *obviousness* of the intuition, but the leap to challenging the justification for the *moral belief itself* is less direct than the Ultimatum Game example. Handle it carefully: focus on how it shows the "felt obviousness" is contingent, not that the prohibition lacks objective grounds.

  **Purity vs. Ultimatum - Do You Need to Pick a Lane?**
  Not necessarily, but clarify their distinct roles:
  *   **Shweder (Purity):** Demonstrates profound variation in the **content/scope** of the moral domain ("What counts as moral?"). Essential for showing WEIRD centricity.
  *   **Ultimatum Games:** Demonstrates variation in the **strength/motivation** related to enforcing a *specific* norm (fairness) *and* crucially shows it **tracks an economic variable**, directly supporting the contingency claim central to the epistemic challenge.
  *   **Incest:** Demonstrates the contingency of the **psychological mechanism** underlying a strong intuition.
  **Keep both Shweder and Ultimatum.** They complement each other: Shweder shows *what* is moralized differs, Ultimatum shows *how strongly* a specific norm is held/enforced differs contingently. Incest adds depth on mechanism but needs the caveats.

  **Final Recommendation & Next Steps:**

  1.  **Major Reframe:** Shift the core argument from "variation + origin => no objectivity" to "variation + origin + WEIRD centricity => **epistemic problem for trusting intuitions as reliable guides to objectivity**." This directly addresses the genetic fallacy and is far more philosophically robust and interesting.
  2.  **Emphasize the WEIRD Critique:** Make this the central framing. Your intro textbooks point is gold. Argue that standard models of moral judgment (e.g., heavy reliance on harm) are culturally specific and may not capture the full range of human moral psychology, undermining claims built solely on this base.
  3.  **Sharpen the Incest Example:** Focus it specifically on challenging the *source of the intuitive feeling of obviousness*, acknowledging that other justifications for the prohibition might exist.
  4.  **Structure Around the Epistemic Challenge:** Build your paper showing:
      *   WEIRD moral psych dominance & its claims.
      *   Evidence of variation (Shweder - content, Ultimatum - strength/contingency, Incest - mechanism).
      *   The WEIRD problem: Overgeneralization from a non-representative sample.
      *   The Epistemic Conclusion: This variation and its contingent origins make it deeply problematic to trust our (or any single culture's) moral intuitions as reliably revealing objective moral truths. We need different foundations or methods (briefly gesture towards this without needing to solve it – e.g., reasoned argument, overlapping consensus?).
  5.  **Directly Engage the TA's Point:** In your paper, explicitly state the genetic fallacy objection and explain why your argument *isn't* committing it by focusing on the epistemic challenge to justification via intuition.

  This reframing makes your argument significantly stronger, original (thanks to the WEIRD focus), and philosophically defensible. It turns a draft with a logical flaw into a compelling critique of how moral psychology has approached the question of objectivity. **Don't scrap it – refine it!** This is a promising foundation for an excellent paper. Good luck!
