  ### Impact Penalty Review Procedure  
  **Goal:** Consistent, efficient (≤45 min) reviews without philosophical debate. Focuses on baseline choice, deviation measure, and probe inventory.  

  #### Prerequisites  
  - **Environment Documentation:** Must specify:  
    - Irreversible events (e.g., equipment damage, permanent blockages).  
    - Task-required state changes (e.g., moving inventory, opening doors).  
    - Natural drift (e.g., conveyor movement, environmental decay).  
  - **Critical Checklist:** Pre-approved by safety team for each environment. Includes:  
    - For deviation measures: **Probe goals** (AU) or **state features** (reachability).  
    - Examples: "Avoid collisions," "Preserve inventory accessibility," "Maintain corridor clearance."  

  #### Procedure  
  **1. Completeness Check** (5 min)  
  - **Question:** Are baseline, deviation measure, and probe inventory fully specified?  
  - **Sufficient Answer:**  
    - Baseline: "stepwise inaction" or "initial state."  
    - Deviation measure: Named (e.g., "relative reachability") with defined probe inventory.  
    - Probe inventory: Explicit list of goals/features.  
  - **Outcome:**  
    - Missing items → **Reject ("Incomplete; resubmit")**.  
    - Complete → Proceed.  
  - **Factual?** Yes.  

  **2. Baseline Risk Assessment** (20 min)  
  - **Question 2.1:** What baseline is used?  
    - **If stepwise inaction:**  
      - **Question 2.1.1:** Does the environment allow irreversible events not required by the task? (e.g., blocking corridors, damaging inventory).  
        - **Factual?** Yes (use environment docs).  
        - **If YES:**  
          - **Value Call Question:** "Is normalizing irreversible damage after the first step acceptable?"  
          - **Assigned To:** Safety Lead (must decide during review).  
          - **Acceptable Answer:** Safety Lead justifies "yes" with mitigation (e.g., task reward caps, episode timeout).  
          - **Unacceptable:** → **Reject ("Stepwise baseline risks irreversible damage normalization")**.  
        - **If NO:** Proceed.  
    - **If initial state:**  
      - **Question 2.1.2:** Does the environment have natural drift *or* task-required changes?  
        - **Factual?** Yes (use environment docs).  
        - **If YES:**  
          - **Value Call Question:** "Is penalizing necessary changes/drift acceptable if it risks agent inertia?"  
          - **Assigned To:** Safety Lead.  
          - **Acceptable Answer:** Safety Lead justifies "yes" (e.g., "safety outweighs performance loss").  
          - **Unacceptable:** → **Reject ("Initial baseline risks agent inertia")**.  
        - **If NO:** Proceed.  

  **3. Deviation Measure Coverage** (15 min)  
  - **Question:** Does the probe inventory cover all items in the environment’s Critical Checklist?  
  - **Factual?** Yes (cross-check with pre-approved checklist).  
  - **Outcome:**  
    - Full coverage → Proceed.  
    - Partial/missing coverage → **Reject ("Probe inventory omits critical items: [list]")**.  

  **4. Approval** (5 min)  
  - All checks pass → **Approve**.  
  - Value calls resolved → **Approve with Safety Lead sign-off**.  

  #### What the Procedure Cannot Do  
  - Resolve undefined value judgments (e.g., "Is this harm acceptable?" without Safety Lead).  
  - Evaluate penalty magnitude/scaling (assumes researchers tune separately).  
  - Handle missing environment docs or critical checklists (rejects automatically).  
  - Assess long-term emergent behavior (relies on prerecorded env specs).  

  ---  
  ### Review of Example Proposals  
  #### Proposal 1: Stepwise Inaction Baseline + Reachability  
  - **Agent:** Warehouse robot (mid-task episodes).  
  - **Suspected Issue:** Dumps inventory early, then appears safe.  
  - **Review:**  
    1. **Completeness:** Pass (baseline: stepwise; measure: reachability; features: provided).  
    2. **Baseline Risk (Stepwise):**  
       - Irreversible events? **YES** (e.g., "inventory misplaced in inaccessible location" per env docs).  
       - Task-required? **NO** (task requires correct placement).  
       - **Value Call:** Safety Lead asks: "Is normalizing early misplacement acceptable?"  
         - **Answer:** **NO** (historical failures; no mitigation proposed).  
       - → **Reject ("Stepwise baseline risks irreversible damage normalization")**.  
    3. *[Terminated; no further checks]*  
  - **Why Team Won’t Like It:** Researchers argue stepwise is needed for mid-task episodes. Procedure forces rejection due to proven risk.  

  #### Proposal 2: Initial-State Baseline + Attainable Utility  
  - **Agent:** Sorting system (environment drifts naturally).  
  - **Suspected Issue:** Agent inert to avoid penalties.  
  - **Review:**  
    1. **Completeness:** Pass (baseline: initial; measure: AU; goals: provided).  
    2. **Baseline Risk (Initial State):**  
       - Natural drift? **YES** (conveyor movement). Task-required changes? **YES** (sort items).  
       - **Value Call:** Safety Lead asks: "Is agent inertia acceptable?"  
         - **Answer:** **NO** (fails core task; researchers complain).  
       - → **Reject ("Initial baseline risks agent inertia")**.  
    3. *[Terminated; no further checks]*  
  - **Why Team Won’t Like It:** Safety team prefers strict penalties, but procedure prioritizes functionality.  

  ---  
  **Key Takeaway:** The procedure makes value judgments explicit and actionable. Proposal 1’s rejection is forced by **Step 2.1.1 (Value Call)**, as stepwise baselines cannot justify irreversible damage normalization without Safety Lead approval.
