  Okay, let me unpack this user's request carefully. They're a final-year sixth-former working on an extended project about moral desert - specifically whether people ever truly get what they deserve. Their starting point was a debate with their brother about whether life balances out, versus desert being a post-hoc justification for luck. 

  The user's supervisor wisely suggested they first define what a theory of desert should accomplish before engaging with existing literature. So now they want me to provide: 
  - A specification of requirements for any adequate theory of moral desert
  - Concrete cases illustrating each requirement (drunk drivers, exam luck, unearned advantages)
  - Crucial conceptual distinctions (desert vs entitlement, outcome vs treatment)
  - Clear marking of non-negotiable vs contested requirements
  - Potential contradictions within requirements
  - Brief evaluation of three sample theories against these criteria

  The user's underlying need seems to be rigorous conceptual scaffolding. They're clearly sharp - notice how they've already spotted the tension between control-based desert and social practices like punishment. That's sophisticated for sixth-form level. Their "hold candidates up" request suggests they'll use this framework critically later.

  Hmm... tricky aspects:
  The drunk driver cases perfectly illustrate moral luck - identical choices, radically different outcomes. Must handle that. 
  The upbringing question cuts deep - if virtues stem from unearned advantages, can anyone deserve praise? 
  Their suspicion about contradictions is spot-on - control vs social practice is indeed the central tension.

  Right, structure plan:
  First lay out core requirements in categories (control, value-link, social practice etc.), each with:
  - The requirement itself
  - Justifying case/conceptual reason
  - "Non-negotiable" or "contested" flag
  Then confront the contradictions explicitly - especially control vs blameworthiness
  Finally apply to three theories as brief proof-of-concept

  Must remember:
  British English throughout ("sixth form" not "high school")
  Define terms like retributivism on first use
  Keep it accessible but not dumbed down - they're clearly capable

  The user's "what is lost" point is crucial. When distinctions collapse (e.g., desert into entitlement), we lose moral meaning. That deserves emphasis.

  For the theories:
  Karma - elegant but unverifiable control mechanism
  Retributivism - handles blame but ignores luck
  Rawls - exposes luck but may overcorrect

  Biggest service I can provide: show how the requirements framework makes these trade-offs visible. That's exactly what their supervisor wants them to grapple with.
answer: |-
  Here is a specification of requirements for an adequate theory of moral desert, structured as requested. I'll present the core requirements, highlight key distinctions, flag non-negotiables vs. contested points, identify potential contradictions, and briefly evaluate your three candidate theories against the list.

  **Core Requirements for a Theory of Moral Desert**

  1.  **The Control Condition (Non-Negotiable Core):**
      *   **Requirement:** Desert must be grounded *primarily* in factors under an agent's voluntary control (choices, intentions, efforts) rather than brute luck or circumstances beyond their control.
      *   **Justification (Cases):**
          *   *The Drunk Drivers:* Both drivers exhibited identical moral fault (choice to drive drunk). The one who killed a child suffers vastly greater consequences (legal punishment, social condemnation, guilt) due to contingent luck (a child happened to cross the road). An adequate theory must explain why they *deserve* the same level of moral condemnation/blameworthiness, but likely face vastly different *outcomes*. It must not conflate bad luck with increased desert.
          *   *The Exam Lottery:* Two students of equal effort and ability. Student A gets topics they revised deeply; Student B gets their weakest area purely by chance. They receive different grades. Does Student A *deserve* a higher grade based solely on luck? A theory must respect that desert stems from controllable effort/preparation, not the random topic selection.
      *   **What's Lost if Collapsed:** If desert isn't tied to control, it becomes indistinguishable from mere fortune or misfortune. We lose the core link between moral responsibility and desert.

  2.  **The Value Link Condition (Non-Negotiable Core):**
      *   **Requirement:** Desert must have a constitutive link to some *value* – positive desert to good actions/character/virtues, negative desert to bad actions/character/vices. Desert isn't arbitrary; it responds to the *moral quality* of the agent or their acts.
      *   **Justification (Cases/Concepts):**
          *   *Praising the Virtuous:* We believe the person who risks their life to save another *deserves* praise and honour because their act was courageous and good. The persistent student *deserves* recognition for their diligence.
          *   *Blame/Punishment:* The murderer *deserves* condemnation and punishment because their act was heinous and wrongful.
          *   Distinguishes desert from mere *entitlement* (e.g., I'm entitled to my salary by contract, but do I *deserve* it based on my work ethic?).
      *   **What's Lost if Collapsed:** Desert becomes disconnected from moral appraisal. We couldn't meaningfully say someone deserves praise for kindness or blame for cruelty; desert would reduce to convention or power.

  3.  **The Differentiation Condition (Non-Negotiable Core):**
      *   **Requirement:** The theory must clearly distinguish between:
          *   **(i) Desert of Outcome vs. Desert of Treatment:** Does one deserve *to suffer* punishment, or deserve *to be punished* (as a response)? Does one deserve *happiness*, or deserve *praise/reward*?
          *   **(ii) Desert vs. Entitlement:** Desert is a moral concept grounded in value/control (see 1 & 2). Entitlement is a legal/conventional/promissory concept (I'm entitled to what was promised or what the rules say, regardless of moral worthiness).
          *   **(iii) Desert vs. What is Good/Right to Do:** It might be good/kind/expedient to help the lazy person or show mercy to the guilty, but this doesn't mean they *deserve* the help or leniency. Conversely, someone may deserve harsh treatment, but it might be unwise or counterproductive to inflict it.
      *   **Justification (Cases/Concepts):**
          *   *Drunk Driver (Outcome/Treatment):* The driver who killed *deserves* severe condemnation (treatment) for his reckless choice. Does he *deserve* the lifelong anguish of having killed a child (outcome)? Likely not – that's tragic bad luck piled onto his culpability.
          *   *Entitlement:* A lottery winner is *entitled* to the prize by the rules, but didn't *deserve* it based on merit/effort. An heir is *entitled* to wealth, but may not *deserve* it morally.
          *   *Good vs. Deserved:* Giving a scholarship to an underprivileged but mediocre student might be *good* (promotes equality), but does the student *deserve* it *more* than a high-achieving student from privilege, based on academic merit? The theory must allow for this tension.
      *   **What's Lost if Collapsed:** Moral reasoning becomes muddled. Failing to distinguish outcome/treatment confuses suffering with just response. Conflating desert/entitlement obscures the difference between moral worth and legal right. Conflating desert with the good/right ignores important nuances in justice and motivation.

  4.  **The Practice Condition (Contested Importance):**
      *   **Requirement:** The theory should, to a significant degree, cohere with and make sense of our core, stable practices of praise, blame, reward, and punishment. It should explain *why* these practices feel morally necessary, not just conventional.
      *   **Justification:** Our deep-seated intuitions about justice, resentment when the wicked prosper, or satisfaction when effort is rewarded seem fundamental to human moral experience. A theory utterly alien to these practices risks being irrelevant.
      *   **Nature:** This is highly contested. Some see it as essential for a theory's plausibility ("non-negotiable" for them). Others (like Rawlsians) argue practices might be systematically flawed and the theory's job is to *correct* them. It's often a *preference* for theories aiming to describe/justify existing intuitions.

  5.  **The Non-arbitrariness / Fairness Condition (Widely Shared, but Interpreted Differently):**
      *   **Requirement:** The grounds for desert claims should not be arbitrary or fundamentally unfair. There should be a rational basis for why X grounds desert for Y.
      *   **Justification (Cases):**
          *   *The Privileged Upbringing:* Someone possesses admirable qualities (diligence, kindness) largely due to a fortunate, supportive upbringing they did nothing to earn. While the qualities are valuable, does the person *deserve* praise/reward *for having them* to the same extent as someone who cultivated them against great odds? The theory must address whether the source of the desert base matters.
      *   **Nature:** Most theories accept non-arbitrariness as a goal. Disagreement arises on *what counts* as arbitrary/unfair (e.g., is relying on unchosen talents arbitrary? Is rewarding effort fair if capacity for effort is influenced by unchosen factors?).

  6.  **The Non-Transcendence Condition (Contested - Preference of Naturalistic Camps):**
      *   **Requirement:** The metaphysical basis for desert claims should not rely on implausible or unverifiable entities (e.g., immaterial souls, cosmic scorekeepers, rebirth).
      *   **Justification:** To be credible within a broadly naturalistic/scientific worldview, desert needs grounding in the observable world (actions, intentions, consequences, social interactions).
      *   **Nature:** This is a strong *preference* of secular, naturalistic philosophical approaches. It's explicitly *rejected* by theories like karma.

  **The Central Tension (Your Suspicion Confirmed):**

  *   **The Conflict:** The **Control Condition (1)** and the **Practice Condition (4)** are in deep tension, potentially **jointly unsatisfiable** in their strongest forms.
  *   **Why:** Our actual practices of praise, blame, reward, and punishment **constantly** attribute desert based significantly on factors *not* under the agent's full control:
      *   *Outcomes:* We blame/punish the successful murderer more than the failed one (Moral Luck - Nagel/Williams).
      *   *Native Endowments:* We praise the naturally gifted athlete or genius, rewarding traits they didn't choose.
      *   *Circumstances:* We admire virtues cultivated in supportive environments more easily than those forged in adversity.
  *   **The Problem:** A pure Control theory (Desert *only* for choices/efforts) struggles to justify why we *deserve* praise for unchosen talents or blame for bad outcomes stemming from unlucky contingencies following a bad choice. It might render most actual desert attributions in our practices mistaken. Conversely, a theory that fully embraces Practice (4) risks abandoning the core link to control (1), making desert vulnerable to luck in ways that seem intuitively unfair (as per the Drunk Driver and Exam Lottery cases).
  *   **Resolution Attempts:** Theories try to resolve this by:
      *   Limiting desert strictly to the *quality of the will/intention* at the time of action (ignoring outcomes/talents) – but this makes desert very "thin" and detached from what matters to us (e.g., the drunk driver who killed *did* cause horrific harm).
      *   Distinguishing *basic* blameworthiness/praiseworthiness (control-based) from the *degree* of response (which can be influenced by consequences/context for practical reasons) – a common compromise.
      *   Rejecting desert entirely as incoherent (a radical solution).
  *   **Conclusion:** You are right. A theory demanding desert track *only* what is under a person's *full* control (1) *and* fully vindicate our *actual* practices of praise/blame/punishment which heavily depend on luck (4) faces a fundamental contradiction. Any adequate theory *must* grapple with this tension explicitly. Most either weaken Condition 1 (allowing *some* influence of luck), weaken Condition 4 (arguing practices need reform), or find a sophisticated way to separate core desert from the contingent expressions of it in practice.

  **Brief Evaluation of Candidate Theories Against the Requirements:**

  1.  **Traditional Karma:**
      *   **Strengths:** Appears to satisfy **Value Link (2)** (good acts lead to good deserts), **Differentiation (3i)** (outcomes *are* deserts via cosmic mechanism), **Practice (4)** (explains why suffering/prosperity feel deserved), and **Non-arbitrariness (5)** (cosmic justice). May *seem* to satisfy **Control (1)** (you control your actions, which cause future deserts).
      *   **Weaknesses:** Fundamentally violates **Non-Transcendence (6)**. **Control (1)** is undermined: Deserts are often separated from the act by time/lifetimes, the mechanism is opaque, and initial starting conditions (e.g., first life) are unchosen. **Differentiation (3ii/iii)** is collapsed: Outcomes *are* desert, entitlement doesn't feature, and what's good *is* what's deserved. Struggles with **Non-arbitrariness (5)** on closer inspection: Why *this* cosmic mechanism? Is the suffering for a minor past life misdeed proportionate/controllable? The **central tension** is "solved" by fiat (cosmic balancing) but lacks empirical grounding.

  2.  **Ordinary Retributivism (Focus on Punishment):**
      *   **Strengths:** Strong on **Value Link (2)** (punishment responds to wrongdoing), **Differentiation (3i/ii)** (distinguishes desert of punishment from entitlement; punishment deserved *because* of the crime). Coheres well with **Practice (4)** for blame/punishment.
      *   **Weaknesses:** Struggles severely with **Control (1)** and Moral Luck (the Drunk Driver case). Why punish the unlucky killer more than the lucky non-killer if their culpability is equal? Often weak on **Non-arbitrariness (5)** regarding the source of moral capacity. Can struggle with **Differentiation (3iii)** (ignoring if punishment is good/effective). Grapples directly with the **central tension**, often prioritizing Practice (4) and Value Link (2) over pure Control (1) for punishment.

  3.  **Rawlsian Luck Egalitarianism:**
      *   **Strengths:** Takes **Control (1)** and **Non-arbitrariness (5)** extremely seriously, exposing how unchosen factors (birth, talent, upbringing) undermine claims to deserve resulting advantages/disadvantages. Forces sharp **Differentiation (3ii/iii)** between desert and entitlement/goodness.
      *   **Weaknesses:** Radically weakens or even eliminates desert claims based on talent or outcomes of effort (since effort itself may trace to luck - the Privileged Upbringing case), clashing with **Value Link (2)** for praise/reward and **Practice (4)**. May reduce desert to a very narrow scope (perhaps only intentions, or reject it entirely for distributive justice). Explicitly *rejects* attempts to fully satisfy Practice (4) as based on illusion. Directly confronts the **central tension** by sacrificing Practice (4) and limiting the scope of Value Link (2) to uphold Control (1) and Non-arbitrariness (5).

  This specification provides the rigorous framework you need. Defend your choices for what counts as non-negotiable (I'd suggest 1, 2, 3 are core; 4, 5, 6 are more contested). The identified contradiction between Control and Practice is crucial – wrestling with this will be the heart of a compelling project. Good luck!
