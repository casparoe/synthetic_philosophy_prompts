  For their distinction: this is where it gets thorny. Their framing is thoughtful but un-Wittgensteinian in demanding justification. As PI §124 says, philosophy "leaves everything as it is" - it describes rather than judges practices. The load-bearing/decorative binary smuggles in criteria Wittgenstein would reject. Yet their instinct about depth isn't wrong... perhaps reframe as "whether the practice can bear the weight of a life" without metaphysical baggage.

