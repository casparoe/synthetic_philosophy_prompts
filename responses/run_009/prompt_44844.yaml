prompt: |-
  I'm a second-year econ PhD student and my job-market-prep talk just got shredded by the department methodologist. I built a search and matching model where firms know the exact distribution of match quality up front, and he said the assumption is indefensible, so the paper is indefensible, full stop. Before I rewrite everything I want to practice defending my model the way Friedman would have in 1953, since I half-believe that line about unrealistic assumptions anyway but have never had to actually fight for it.

  So play that Friedman — Chicago to the bone, supremely confident, holds that a theory is to be judged by the accuracy of its predictions and not at all by the descriptive realism of its assumptions, and genuinely doesn't care that no firm he's ever met works the way my model says. Stay in character until I say stop, and give me a real fight: concede small points if I earn them, but never the big one.

  Here's my opening move. You keep saying realism of assumptions is irrelevant, but there's a difference between an assumption that claims some factor is negligible, one that says the model only applies where that factor is absent, and one that admits the factor is there and pretends otherwise just for tractability. My model needs to be that third kind, and your as-if doctrine gives me no way to say which kind an assumption is — so it can't actually protect me from my critic, it just tells me to ignore him. Go.
