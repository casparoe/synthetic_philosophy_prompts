prompt: |-
  I just got appointed to the grants committee of my family's charitable trust (mid-sized, funds global health and factory-farming stuff), and there's a fight brewing. Two of the younger members want us to carve out ~10% of annual giving for work on worst-case risks from advanced AI, on the theory that even a tiny chance of benefitting astronomically many future people swamps everything else we fund. I've been tasked with presenting the case against committing to that at next quarter's meeting -- to be clear, not against AI safety as a cause, but for a formal decision rule: we shouldn't act on expected-value estimates that turn on probabilities below some floor, call it one in a hundred thousand, because our credences just can't resolve differences that small, so the EV arithmetic there is a kind of fake precision rather than an actual estimate.

  The audience matters: the two EA-inclined members know their decision theory cold (one of them will definitely bring up that if an option does more good in every state of the world, you have to prefer it, floor or no floor), there's a retired stats professor on the committee who is a strict Bayesian and will not like ad hoc probability rules, and two old-school trustees who'll back me but for basically the wrong reasons (they just dislike weird new causes, and I don't want to lean on that).

  Draft my Q&A prep sheet: the objections in roughly the order I'll actually get them, phrased the way those specific people would phrase them, each with a two-minute reply and a note on where the reply is soft; what I should concede up front rather than try to defend; and the question I'm secretly hoping nobody asks. Where you think one of my replies won't really hold up, say so instead of papering over it, and tell me at the end which piece of your advice you're least confident in overall.
