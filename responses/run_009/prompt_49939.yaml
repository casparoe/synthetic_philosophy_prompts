answer: |-
  Here's a Q&A prep sheet tailored to your committee dynamics, objections ordered by likely sequence, with concessions, secret fear, and flagged soft spots. Core framing: **"Our epistemic limits require humility; we're not rejecting AI safety, but rejecting *this specific justification* as a basis for *formal allocation*."**

  **Concession Upfront (Start Strong):**  
  *"Before objections, I concede three things: 1) AI risk is plausibly important, 2) In theory, large-stakes EV *can* dominate other considerations, and 3) Our floor rule *is* arbitrary. But arbitrariness is unavoidable when mapping fuzzy reality to binary choices. The question is whether *this* arbitrariness better reflects our committee’s capabilities than trusting EV math at cosmic scales."*

  ---

  **Objection 1 (Young EA Member):**  
  *"If AI risk has *any* non-zero probability of affecting astronomical value, and our intervention has *any* chance of reducing it, standard EV calculus forces us to prioritize it over anything with finite impacts—even with your ‘floor.’ Ignoring this is irrational. Your floor is just an excuse to avoid hard choices."*  

  **Your Reply (2 mins):**  
  *"You’re right that *if* we could precisely weigh probabilities like 10⁻⁶ vs. 10⁻⁸, EV should dominate. But our epistemic state isn’t sharp enough to resolve differences at these scales. Is AI extinction risk 1/10,000 or 1/10,000,000? Credible experts disagree by orders of magnitude. When probabilities are this uncertain and our models this fragile, ‘expected value’ becomes ‘expected guesswork.’ Assigning a floor isn’t ignoring small probabilities—it’s admitting we can’t reliably compare them. We *should* act on robust estimates (e.g., bednets saving lives at ~$5k/life), not cosmic lotteries where our ‘ticket’ might be imaginary."*  
  **Soft Spot:** Doesn’t negate that *some* non-zero probability exists. Implicitly assumes AI risk work has lower tractability (which you’ll need evidence for later).

  ---

  **Objection 2 (Stats Professor):**  
  *"This ‘floor’ is ad hoc and violates Bayesian coherence. If we have *some* credence in AI risk, however small, it belongs in the EV calculation. Arbitrary thresholds invite motivated reasoning—you’d reject this rule if the probability were just above your floor but still tiny."*  

  **Your Reply (2 mins):**  
  *"You’re correct—Bayesianism doesn’t have floors. But *practically*, committees like ours can’t integrate all conceivable low-probability risks into every decision without paralysis. We already do this implicitly: we don’t hedge against asteroid impacts or vacuum decay. The floor isn’t a probability *axiom*; it’s a *heuristic* for when uncertainty swamps signal. For risks below ~1/100k, our ability to distinguish ‘more urgent’ from ‘less urgent’ vanishes. If we can’t falsify or rank claims, allocating 10% of funds becomes faith-based, not evidence-based—even if technically Bayesian."*  
  **Soft Spot:** He’ll see this as institutional cowardice. Doesn’t address how to set the floor "non-arbitrarily."

  ---

  **Objection 3 (Young EA Member / Follow-Up):**  
  *"But what if we *can* resolve small differences? If expert consensus puts risk at 1% this century, that’s above your floor—and the EV *still* dominates global health. Why not use your floor only for ultra-uncertain risks?"*  

  **Your Reply (2 mins):**  
  *"First, ‘consensus’ is contested—Metaculus isn’t peer review. But assume it’s 1%: that implies ~99% chance our AI safety grant does *nothing* (if extinction is inevitable or impossible). Meanwhile, $1M for bednets *certainly* saves ~200 lives. To justify diverting funds, we’d need high confidence that our grant reduces extinction risk by >0.005% *in the worlds where it matters*. Can our committee—or any grantmaker—reliably assess that? If not, we’re gambling proven impact for speculative leverage."*  
  **Soft Spot:** EA logic demands that tiny leverage *could* suffice if stakes are high enough. Requires asserting AI work’s lower tractability.

  ---

  **Objection 4 (Trustee):**  
  *"This feels like mission drift. We fund health and farming—tangible, measurable work. AI is speculative and outside our expertise. Why complicate things?"*  

  **Your Reply (2 mins):**  
  *"I agree we must prioritize our core missions—they’re why donors trust us. But *if* AI risk were robustly actionable, we’d adapt. My argument isn’t ‘it’s too weird’—it’s that the *case for diverting funds* relies on math we can’t validate. We could explore AI safety via a smaller, discretionary fund without rewriting our allocation rules. But locking 10% based on unverifiable EV invites endless similar claims (e.g., nano/bio-risks). Our process must be defensible beyond ‘this cause feels big.’"*  
  **Soft Spot:** They’ll hear "stick to our lane," which isn’t your core argument. Risk of alienating EAs.

  ---

  **The Question You Hope Nobody Asks:**  
  *"If you concede AI extinction would lose quintillions of future lives, how many present lives are you willing to sacrifice to reduce that risk by 0.0001%? If your answer isn’t ‘all of them,’ aren’t you *already* using a hidden threshold?"*  

  **Your Reply (If Cornered):**  
  *"A fair but misleading framing. We *do* discount future lives implicitly—via time preference, risk of value change, and yes, cognitive limits. But more crucially: we assess *tractability*. If sacrificing all present lives *reliably* averted extinction, it might be defensible. But with AI risk, we lack credible levers. Throwing resources at a problem we don’t understand may backfire—and unlike bednets, we can’t test it. The issue isn’t the stakes; it’s our impotence."*  
  **Why It’s Dangerous:** Forces you to reject strong longtermism or admit inconsistency. Stats prof may accuse you of replacing probability floors with "tractability thresholds."

  ---

  **Least Confident Advice:**  
  The reply to the **stats professor** is the shakiest. Calling the floor a "practical heuristic" doesn’t resolve his core critique: that you’re replacing quantitative rigor with an arbitrary filter. He’ll argue for better modeling (e.g., using probability *ranges*), and conceding "we’re not competent to evaluate this" undermines your stance on *other* complex grants (e.g., novel global health interventions). If he presses, pivot to:  
  *"Our mandate isn’t theoretical optimization—it’s stewardship. When uncertainty exceeds a threshold, we default to domains where impact is demonstrable. Yes, it’s arbitrary, but so is setting p<0.05 for significance. We need *some* boundary to function."*

  **Final Tip:** Preemptively propose a compromise: *"Let’s allocate 1-2% for *exploratory* grants (AI + other X-risks) without changing our core rules. We’ll review findings in 18 months to reassess evidence quality."* This isolates the dispute to "how much" vs. "whether," appealing to trustees while giving EAs a win.
