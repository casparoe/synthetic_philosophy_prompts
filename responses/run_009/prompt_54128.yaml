  First, I need to unpack their core argument: They're emphasizing the institutional role of soldiers—that individuals shouldn't adjudicate a war's justice mid-conflict because it's epistemically and practically unworkable, not just pragmatically messy. This is a nuanced take, steering clear of the older mutual-consent theory. 

  The audience dynamics matter. Cadets will likely focus on gritty realities ("What if I *know* my side is wrong?"), the philosopher will drill into moral foundations, and officers might dismiss the whole thing as ivory-tower navel-gazing. The user also wants to avoid misrepresenting the field—revisionism isn't fringe; it's dominant in academic circles, but traditionalism still holds weight in military practice and international law. 

  The "hoped nobody asks" question about volunteers in wars of aggression is telling. That’s absolutely a soft spot because it challenges the epistemic shelter of institutional roles: if a soldier *voluntarily* joins an aggressive war while sincerely believing it’s just, does the traditionalist shield still hold? Revisionists would pounce here, arguing that voluntarism introduces moral responsibility. The user’s reply needs to concede some ground while stressing why institutions can’t rely on individual judgments. 

  Other tricky points: 
