  The user needs help designing a gerrymandered reference class for the statisticians in round one that's misleading but not obviously rigged, and then a good reference class in round two. This will show that selecting the right reference class itself requires judgment. They also want a second phase where participants make individual forecasts on new cases and face a group decision with a payoff structure that incentivizes appropriate confidence based on whether they have private information.

  I should create a complete workshop design that fits within a 3-hour session. For the reference classes, I can use historical project data. For round one, I'll suggest narrow categories that seem relevant but are actually biased - like tech projects in a specific region during a boom period, which might have inflated success rates. For round two, I'll broaden to more representative classes. This avoids feeling like a "gotcha" since the initial class isn absurd, just insufficient.

  For the payoff phase, I'll recommend a scoring system using points instead of money. The group decision rewards accuracy but penalizes extreme deviations from the group mean. Participants with private information (randomly assigned) will be penalized if they suppress it, while uninformed participants will lose points for being overconfident.

  I'll structure the workshop into distinct segments: introduction, round one forecasting (with misleading reference class), round two (with better reference class), reveal and discussion, payoff phase with new cases, final group decision, and debrief. The debrief will explicitly connect the experiences to the inside/outside view concepts and epistemic modesty.

  For materials, I'll suggest using anonymized composite cases based on real projects to make preparation easier. I'll include timing estimates and potential pitfalls like the reveal causing frustration or participants struggling with the group decision mechanics. I'll also note what the activity can't fully capture, such as the emotional aspect of real-world forecasting or long-term experience with calibration, which the user will need to address in the debrief.
answer: |-
  Here’s a complete workshop design incorporating your twists, optimized for impact and feasibility. It avoids explicit terminology until the debrief while creating visceral tension.

  **Core Structure:**
  - **Duration:** 3 hours (adjust timings as needed)
  - **Participants:** 18 grad students
  - **Materials:** Project dossiers, reference class handouts, forecasting sheets, outcome reveal slides, payoff tokens (e.g., colored chips)
  - **Key Concepts Embedded:** Inside/Outside View tension, reference class fragility, epistemic modesty trade-offs, value of private signals.

  ---

  ### **Phase 1: The Forecasting Rounds (75 mins)**
  **Groups:** Split into "Project Teams" (Planners, 9 people) and "Data Analysts" (Statisticians, 9 people). *Do NOT explain why the split exists.*

  #### **Round 1 (30 mins)**
  *   **Project Teams:** Receive **"Project Phoenix" Dossier** (e.g., a composite of Sydney Opera House + Boston Big Dig). Includes:
      *   Detailed blueprints/scope docs (emphasizing innovation).
      *   "Optimistic" internal memos from leadership.
      *   Initial budget/timeline with "aggressive but achievable" notes.
      *   Press clippings hyping the project's importance.
      *   *Outcome variables to forecast:* % Budget Overrun, Months Delay, Cancellation (Yes/No).
  *   **Data Analysts:** Receive **"Reference Class A"** (Gerrymandered) + 1-paragraph project description.
      *   *Example Gerrymander:* "Major National Prestige Projects Completed 1995-2005" (period of economic boom, cherry-picked successes, excludes infamous failures). Data shows:
          *   Avg. Overrun: 15%
          *   Avg. Delay: 6 months
          *   Cancellation Rate: 5%
      *   *Trick:* The class seems relevant ("prestige," "national") but is artificially narrow and optimistic. The *real* broader class (coming in Round 2) is much worse.
  *   **Task:** Groups forecast independently. Planners deliberate as a team; Analysts deliberate as a team. Record consensus forecasts.

  #### **Round 2 (30 mins)**
  *   **Project Teams:** *Same dossier.* Add **ONE new "crisis memo"** (e.g., "Critical soil instability discovered at Site B" or "Lead vendor declares bankruptcy"). *Emphasize this is critical new info.*
  *   **Data Analysts:** Receive **"Reference Class B"** (Robust) *without comment*.
      *   *Example Robust Class:* "All Megaprojects (>$1B equiv.) Globally 1950-2020" (includes bridges, dams, IT systems, Olympics). Data shows:
          *   Avg. Overrun: 45%
          *   Avg. Delay: 24 months
          *   Cancellation Rate: 35% (Flyvbjerg-style data).
  *   **Task:** Groups re-forecast *all* variables, incorporating their new info. Record consensus.

  #### **Reveal & Tension (15 mins)**
  1.  **Collect Forecasts:** Display Planners' R1, Planners' R2, Analysts' R1, Analysts' R2 forecasts side-by-side for each variable.
  2.  **Observe Divergence:** Highlight the gap *within* groups (Planners R1 vs R2; Analysts R1 vs R2) and *between* groups. Ask: "What drove these shifts?"
  3.  **Reveal Actual Outcomes:** Show the *real* outcomes for the composite project (e.g., 72% overrun, 34 months delay, not cancelled). *Don't yet reveal the reference class trick.* Ask: "Whose information seemed most valuable? Most misleading?"

  ---

  ### **Phase 2: The Payoff Challenge (60 mins)**
  **New Setup:** Groups dissolve. **Each participant works alone.** Introduce 3 new **"Project Vignettes"** (V1, V2, V3). Each is a *very brief* description of a potential project (e.g., "New AI-Powered City Transit System," "Desalination Plant in Drought Region," "Government Blockchain ID System").

  *   **Private Information (The Secret Twist):**
      *   Randomly assign **1/3 of participants (6 people) a "Green Token."** *Do not explain its meaning.*
      *   **Green Token Holders:** Receive **ONE subtle, genuine clue** for *ONE specific vignette* (e.g., for V2: "Leaked report shows key mineral for desalination membranes faces 300% price surge next year" OR for V1: "Mayor's chief advisor previously led 3 failed smart-city initiatives"). *This is their "private signal."*
      *   **Others:** Receive **ONE subtly misleading or irrelevant "clue"** for a vignette (e.g., for V2: "Local environmental group strongly supports the desalination plant concept" - implying smooth sailing, but doesn't address core risks). *This creates noise and potential false confidence.*

  **Task 1: Individual Forecasts (20 mins)**
  *   Each participant forecasts the same 3 outcomes (% Overrun >50%? Delay >18 months? Cancelled?) for all 3 vignettes. *They must note if their clue influenced their forecast for its vignette.*

  **Task 2: The Aggregate Decision & Payoff (25 mins)**
  *   **The Challenge:** "The board needs a single, actionable forecast for Project V1. You will each submit a **Confidence Bet.**"
  *   **Mechanics:**
      1.  Display the *current group mean forecast* for V1's "% Overrun >50%" probability (calculated anonymously from individual forecasts).
      2.  Each participant **secretly** chooses one action:
          *   **A) Bet with the Group:** You get **+1 point** if the group mean is correct (within 10% of actual probability), **-1 point** if it's wrong.
          *   **B) Bet Against the Group:** You get **+3 points** if the group mean is *wrong*, **-3 points** if it's correct.
          *   **C) Bet on Your Own View:** You get **+2 points** if *your own individual forecast* is correct (within 10%), **-2 points** if wrong.
  *   **Payoff:** Points translate to "Workshop Success Tokens" (WSTs). Highest WSTs get symbolic prize (e.g., pick of snacks, bragging rights). *This structure penalizes:* Blindly following the group (A) if the group is wrong; reckless contrarianism (B) if the group is right; unwarranted self-trust (C) if uninformed/noisy.

  **Outcome Reveal (15 mins):**
  1.  Reveal actual outcomes for V1, V2, V3 (pre-determined based on vignettes).
  2.  Reveal the *group mean* for V1's key forecast.
  3.  Participants calculate their WSTs based on their Aggregate Decision choice and actual V1 outcome.
  4.  *Ask:* "Who bet against the group? Why? Who stuck with their own view? Why? Who followed the crowd? Why?" *Hint at the tokens:* "Did anyone feel their 'special clue' made a difference?"

  ---

  ### **Phase 3: The Debrief (45 mins)**
  **Goal:** Name the unnamed tensions, validate feelings, extract lessons.

  1.  **Recall the Feelings (10 mins):**
      *   "Project Teams: When you got that crisis memo in Round 2, how did it feel? Did it make you trust your initial plan more or less?"
      *   "Data Analysts: How confident were you in Reference Class A vs. B? What made you shift?"
      *   "When you saw the other group's forecasts, what was your reaction? Frustration? Confirmation? Surprise?"
      *   "In the final bet – what was going through your mind? Especially those with a green token?"

  2.  **Introduce the Frameworks (15 mins):** *NOW use the terms.*
      *   "You experienced two powerful forecasting perspectives:
          *   **Inside View (Project Teams):** Deep dive into *this specific* project's details, narratives, mechanics. Prone to uniqueness, planning fallacy, narrative distortion.
          *   **Outside View (Data Analysts):** Zoom out to the statistics of *similar* past projects. Prone to reference class errors, losing crucial specifics."
      *   "Round 1 Analysts had a **misleading outside view** (cherry-picked class). Round 1 Planners had an **overconfident inside view** (rosy dossier)."
      *   "The crisis memo forced Planners into **fractured inside view** (complexity). Reference Class B forced Analysts into **epistemically modest outside view** (harsh reality)."
      *   "The Aggregate Bet forced **epistemic modesty vs. justified confidence.** If you had a genuine private signal (green token!), blind modesty (Bet A) was costly. If you had noise or no signal, arrogance (Bet B or C) was costly. *Judging the strength of your own information is the core skill.*"

  3.  **Map to Real World & Critiques (15 mins):**
      *   "Where in your research/field do you see Inside View dominance? Outside View dominance?"
      *   "The Reference Class Twist: 'Use the outside view' isn't enough! **Choosing the right class requires judgment – which is itself an inside-view move!**"
      *   "The Betting Twist: Epistemic modesty isn't always right. **Knowing when you know something others don't is vital.** Tetlock's 'superforecasters' blend views AND know their information edge."
      *   Critiques to mention: Inside view needed for novel events; Outside view ignores black swans; Modesty can stifle dissent.

  4.  **Final Reflection (5 mins):** "What's one situation this week where you'll consciously ask: 'What's my inside view here? What's a relevant outside view? How strong is my evidence?'"

  ---

  ### **Sourcing Materials & Logistics**
  *   **Dossiers (Project Teams):**
      *   **Source:** Blend 2-3 real cases (e.g., Channel Tunnel cost overruns + Denver Airport Baggage System failure + Sydney Opera House delays). Anonymize names/locations ("Project Phoenix").
      *   **Content:** Use real excerpts from project audits, news reports (mix positive/negative), budget docs (Wikileaks/FOIA if possible), technical challenges. *Emphasize uniqueness/ambition.* Include glossy renders!
      *   **The "Crisis Memo":** Base it on a *real* pivotal problem from one source project.
  *   **Reference Classes (Data Analysts):**
      *   **Gerrymandered (R1):** Use real data but narrow criteria: "Major US Transportation Projects 1990-2000" (pre-9/11 boom) or "European Cultural Megaprojects." Source: Flyvbjerg books/papers, GAO reports, curated datasets.
      *   **Robust (R2):** "Global Infrastructure Megaprojects 1950-Present." Source: Flyvbjerg's seminal work, World Bank reports. Ensure stark contrast (e.g., R1 avg. 20% overrun vs. R2 avg. 60%).
  *   **Vignettes & Clues (Payoff Phase):**
      *   Base vignettes on real project *types* (AI transit, desalination, gov IT).
      *   **Genuine Clue (Green Token):** Use a real, non-obvious risk/boost factor (e.g., dependency on volatile commodity, key personnel history, regulatory loophole closing).
      *   **Noise Clue:** Use a real but superficial or misleading factor (e.g., public support polls, generic "expert optimism," irrelevant local benefit).
  *   **Payoffs:** Use poker chips (Green=1pt, Red=-1pt) or a simple scoreboard. No real money needed.

  ---

  ### **Predictable Problems & Mitigations**
  1.  **"This is Rigged!" (Gerrymandered Class):**
      *   **Mitigation:** Make R1 class *plausible* (real data, seemingly relevant criteria). In debrief, emphasize *how common* this error is (e.g., companies comparing only to "peers" they admire).
  2.  **Planners Ignoring Crisis Memo:** Some might dismiss it. *That's okay!* It shows inside-view inertia. Debrief it.
  3.  **Statisticians Over-Trusting R2:** They might see R2 as gospel. Debrief: "Was R2 *perfect*? What might it miss about *this specific* project?"
  4.  **Payoff Mechanics Confusion:** Run a *non-secret* practice round with a simple example forecast before the real Aggregate Bet.
  5.  **Green Token Holders Too Timid:** Some won't bet on their private clue. **This is the key learning moment!** Debrief: "Why did you hold back? Was the social pressure to conform stronger than your evidence?"
  6.  **Time Crunch:** Prioritize Reveal & Debrief. Cut individual forecast time slightly if needed.

  ---

  ### **What the Activity CAN'T Reproduce (Address in Debrief)**
  1.  **The Emotional Weight of Real Stakes:** Forecasting a real project with career implications feels different. *Say:* "The anxiety, attachment, and politics are magnified 100x in reality. This simulates the *cognitive* tension."
  2.  **Long-Term Calibration Feedback:** Superforecasting requires years of practice and feedback. *Say:* "This is a snapshot. Real expertise comes from tracking your hits/misses over time."
  3.  **Truly Novel Events ("Black Swans"):** Reference classes struggle with unprecedented events. *Say:* "The outside view hits its limit with true novelty. That's where scenario planning and acknowledging radical uncertainty come in, alongside the inside view."
  4.  **Deep Domain Expertise:** Grad students lack decades in a field. *Say:* "A true expert's inside view is vastly richer than our dossiers. But... experts also get trapped by it. The blend is key."

  This design creates a compressed, visceral experience of the core tensions. By withholding the jargon until the debrief, participants first *feel* the friction, making the conceptual framing land with far greater force. Good luck!
