answer: |-
  Here's a structured dissection of "one vote doesn't matter" as a menu of distinct theses, designed for classroom discussion. I'll follow your requested sequence, analyze each reading's plausibility and implications, and conclude with the likely student intent and sharpest rebuttal.

  ---

  ### **I. The Statistical Reading (Near-Trivial Claim)**
  - **Thesis:** *The probability that a single vote is pivotal (changes the election outcome) is vanishingly small in large-scale elections.*  
  - **Assumptions:**  
    - Votes are statistically independent (no perfect bloc voting).  
    - Electorate size (*n*) is large (e.g., >10,000 voters).  
    - Election is not perfectly tied (requires a probability distribution of expected votes).  
  - **Sensitivity:**  
    - **Electorate size:** Pivot probability ≈ 1/√(*n*) in close elections. Doubling *n* reduces probability by ~30%.  
    - **Closeness:** Maximized when polls predict a tie; collapses exponentially as polls shift (e.g., 55-45 prediction reduces pivot chance by >99% vs. 51-49).  
  - **Plausibility:** **True** for national elections (e.g., 2020 U.S. presidential pivot probability was ~1 in 60 million in swing states). Harmless alone—it doesn’t imply irrationality or futility.  

  ---

  ### **II. Expected Utility Readings (Irrationailty Arguments)**
  #### **A. Societal Stake Calculation**  
  - **Thesis:** *Voting is irrational because expected utility (EU) is negative: (Pivot Probability × Societal Benefit of Better Outcome) < Cost of Voting.*  
  - **Assumptions:**  
    - Voter assigns a value to the *collective benefit* of their preferred outcome (e.g., climate policy prevents $10T in future damages).  
    - Cost of voting includes time/effort (e.g., $20 value).  
  - **Sensitivity:**  
    - **Closeness:** EU rises as election tightens (higher pivot probability).  
    - **Societal benefit:** Requires enormous stakes to offset low probability (e.g., if pivot prob = 10⁻⁷, societal benefit must exceed $200M to justify a $20 cost).  
  - **Plausibility:** **Contestable.** Assumes voters *only* act on instrumental rationality. Ignores:  
    - Expressive value (voting as symbolic act).  
    - Ethical duties (even low-probability high-stakes actions may be obligatory).  

  #### **B. Self-Interested Stake Calculation**  
  - **Thesis:** *Voting is irrational because EU for the *voter alone* is negative: (Pivot Prob × Personal Benefit) < Cost.*  
  - **Assumptions:**  
    - Voter is purely self-interested.  
    - Personal benefit is limited (e.g., tax savings from preferred candidate: $1,000/year).  
  - **Sensitivity:**  
    - **Closeness:** EU still negligible in large elections (e.g., pivot prob = 10⁻⁷ × $1,000 = $0.0001, vs. $20 cost).  
    - **Benefit size:** Requires absurd personal stakes (e.g., $200M+ benefit) to break even.  
  - **Plausibility:** **Strong for selfish voters**—but most people aren’t purely self-interested. Explains **Downs' Paradox** (why do millions vote if irrational?).  

  ---

  ### **III. Stronger Readings & Implications**
  1. **Voting is Irrational All Things Considered**  
     - Follows from **II.B** (self-interest) *if* no other values (duty, expression) matter.  
     - **Requires:** Rejection of non-instrumental rationales.  

  2. **Voting Cannot Be a Duty**  
     - Thesis: *If an act has no measurable impact, it cannot be morally obligatory.*  
     - **Requires:** Ethical premise that duties require efficacy (rejected by Kantians/virtue ethicists).  

  3. **Permissible Not to Vote**  
     - Follows from **I** and **II** *if* rationality/duty claims fail. Weakest claim—often conceded.  

  4. **Elections as a Collective Decision Mechanism are Irrational**  
     - Thesis: *If individual votes are "irrelevant," mass elections cannot meaningfully aggregate preferences.*  
     - **Requires:** **Fallacy of composition.** Ignores emergent properties:  
       - Elections *only work* because millions vote despite low individual pivot chances.  
       - Institutions (parties, media) amplify collective impact.  

  ---

  ### **IV. Effect of a Close Election**
  - **Weaker readings:**  
    - **I (Statistical)**: Pivot probability *increases* (though still small).  
    - **II.A/B (EU)**: Expected utility *rises* (may tip EU >0 for societal stakes).  
  - **Stronger reading?**  
    - **Paradoxically, expressive/ethical arguments may weaken**: In landslides, voting may feel *more* symbolic (supporting principles > affecting outcome).  

  ---

  ### **V. Likely Student Thesis & Sharpest Reply**
  - **Probable intent: Self-Interested Expected Utility (II.B)**  
    Their indifference (not advocating abolition) suggests: *"Voting isn’t worth *my* time since it won’t change *my* life."*  

  - **Sharpest Reply (Engage the Arithmetic):**  
    > *"You're right that for purely self-interested voters in large elections, EU is negative. But let's flip the logic:*  
    > **1. Scale the stakes:** In a swing state with 5 million voters, pivot probability might be ~1 in 100,000 if polls are tied.  
    > **2. Add altruism:** If your vote prevents policies harming others (e.g., voter suppression affecting 1 million people), and you value each person’s welfare at $0.01, societal EU = (1/100,000) × (1,000,000 × $0.01) = $0.10. Still trivial?  
    > **3. Now account for pivot probability spikes:** In *truly* close races (e.g., 2000 Florida: 537 votes), pivot probability approaches 1. If you’d pay $10,000 to avoid the Iraq War, EU could be positive.  
    > **4. The meta-problem:** If all rational egoists abstain, only irrational/zealous voters decide—worsening outcomes for *you*. Voting becomes a prisoner’s dilemma where cooperation (voting) preserves democracy’s legitimacy, benefiting everyone."*  

  - **Why it works:** Accepts their math but exposes its assumptions (selfishness ignores collective stakes; pivot probabilities are dynamic). Introduces game-theoretic stakes.

  ---

  ### **VI. Summary: Which Readings Hold Water?**
  | **Reading**                     | **Plausible?** | **Harmless?** | **Devastating if True?** |  
  |---------------------------------|----------------|---------------|--------------------------|  
  | Statistical (I)                 | Yes            | Yes           | No (obvious fact)        |  
  | EU: Societal (II.A)             | Partially      | No            | Yes—but false premises   |  
  | EU: Self-Interest (II.B)        | Yes*           | No            | Yes (*if* no other values)|  
  | Voting Irrational (III.1)       | Only if II.B + selfish anthropology | No | Yes |  
  | Elections Irrational (III.4)    | **No**         | N/A           | Yes—but fallacious       |  

  **Key**: The *only* devastating claim (III.4) fails—it mistakes *emergent* properties for individual futility. **II.B** is true for selfish voters but irrelevant to democratic theory, which assumes citizens act as civic agents.

  ---

  **Classroom Strategy**: Start by validating the statistical truth (I), then isolate II.B as the core objection. Use the close-election spike and collective stakes to show voting isn't *just* about pivot probability. Finally, reframe voting as an institution: like a single ant in a colony, individual futility enables collective intelligence.
