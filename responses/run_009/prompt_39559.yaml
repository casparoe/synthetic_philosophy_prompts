  Hmm... the user is clearly well-versed in this topic—they're using precise terms like "pivotal probability" and "expected-utility readings." This isn't their first rodeo with student skepticism. Their hidden need might be for pedagogical tools: they want a "menu" of arguments to dissect in class, not just a textbook rebuttal. The phrase "dissect it" suggests they want students to engage critically rather than memorize counterarguments.

  The tricky part is balancing rigor with teachability. For undergrads, I should avoid overly technical notation while preserving logical structure. The pivot probability model needs simplification—maybe use the 1/sqrt(n) approximation? Also must flag where real-world elections deviate from models (correlated votes, systematic polling errors).

  Ah, and the user's special interest: how closeness affects the argument. Counterintuitively, some readings (like expressive voting) become stronger in landslides! Should emphasize that paradox. For the student's likely self-interested expected utility view, the killer counter is the non-linearity of pivot probability—it spikes hyper-sensitively near ties. A vote in a predicted 51-49 race isn't 100x more valuable than in a 60-40, but perhaps 10,000x more? Need to illustrate that exponential jump.

  The radical claims (e.g., elections discredited) require careful handling—they don't follow from the initial premises. Should diagram the dependency: statistical insignificance → irrationality → no duty → institutional failure. Each step needs additional philosophical assumptions the student probably hasn't considered.

  For the reply, the user wants "arithmetic." So for the pivotal probability case: calculate a concrete example. Suppose a swing state with 5 million voters. Pivot prob ≈ 1 in 100,000? But then multiply by the stakes: if the election determines $10,000 in lifetime income difference for the voter, expected value is $0.10—trivial. But wait! That assumes linearity. In reality, pivot probability has a "spike" near ties. If polls show a 50.1-49.9 split, pivot prob might leap to 1 in 10,000. Now expected value is $1. Still trivial? Okay, but add non-selfish stakes: if the voter cares about all 330 million citizens, even a 1¢/person difference yields $33,000 in expected social value. That's not nothing!

  The student's indifference suggests they're stuck in the self-interested expected utility frame. The sharpest reply: concede that for purely selfish voters in safe states, voting may be irrational. But then pivot to why we have secret ballots—democracy isn't designed for selfish voters! Its machinery requires citizens who internalize collective stakes. That reframes voting from consumer choice to team sport.

  ...Better include Downs' paradox explicitly. The fact that millions vote despite negligible self-interest is a feature, not a bug—it proves social preferences exist. Might mention Brennan's "ethics of voting" critique too, but position it as the exception that proves the rule.

