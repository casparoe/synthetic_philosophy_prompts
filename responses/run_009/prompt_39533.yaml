            s_B = p_B*(1-fnr) + (1-p_B)*fpr

          and by calibration, the overall mean score in group A is p_A and in group B is p_B.

          But note, the mean score in group A is p_A, which is also the expected value of the score. This expected value can also be expressed as:

            p_A = integral s * dF_A(s)

          where F_A is the CDF of the score in group A.

          Similarly for group B.

          Now, the mean score is p_A, but the expression for s_A is the probability that the score is>= threshold. These are different.

          So no direct relation.

      After checking, the result we are referring to is that calibration and error rate balance (equal FPR and FNR) are compatible only if the base rates are equal or the errors are zero. But they are not necessarily incompatible otherwise. 

      However, there is a catch: if we have calibration and equal FPR and FNR, then we can derive that the only way for the score distribution to have mean p_A in group A and also have s_A = p_A*(1-fnr) + (1-p_A)*fpr is if p_A = p_B or the classifier is perfect. But that's not true.

      Given the time, I will instead state the result as commonly presented in the literature and use the following example with numbers that show the tension.

      Example with numbers (non-perfect classifier) and different base rates, where we try to force both conditions and see it's impossible.

          Group A: 1000 people, 100 positives (10%)
          Group B: 1000 people, 200 positives (20%)

          Suppose we want a threshold t such that we have:
            FPR_A = FPR_B = fpr
            FNR_A = FNR_B = fnr

          and the model is calibrated.

          Let's assume we set fpr=0.1 and fnr=0.2.

          Then in Group A:
            - Number of false negatives: 100 * 0.2 = 20
            - Number of false positives: 900 * 0.1 = 90
            - Predicted positive rate: 100 - 20 + 90 = 170

          In Group B:
            - False negatives: 200 * 0.2 = 40
            - False positives: 800 * 0.1 = 80
            - Predicted positive rate: 200 - 40 + 80 = 240

          Now, consider a score bin, say the bin for score=0.2. 

          In Group A, for the 170 individuals that are predicted positive, they have scores>= threshold (which we haven't set exactly). But calibration requires that for any score s, the proportion of positives among those with score=s is s.

          How can we assign scores to achieve that?

          We would need to spread the 80 true positives and 90 false positives in Group A above the threshold with scores that average to the observed proportion in each score bin. But the catch is that the false positives (true negatives that are predicted positive) must have scores that are typically lower than the true positives. 

          However, in Group B, we have 160 true positives and 80 false positives above the threshold.

          Now, calibration requires that in Group A, for a given score s, the proportion of positives is s. In Group B, for the same score s, the proportion of positives is also s.

          Therefore, for a score s, the number of positives and negatives in that bin must satisfy:

            positives_A / (positives_A + negatives_A) = s
            positives_B / (positives_B + negatives_B) = s

          which implies:

            positives_A = s * (positives_A + negatives_A)
            positives_B = s * (positives_B + negatives_B)

          Now, consider a score bin s. The number of positives from Group A in this bin is from the 80 true positives of A, and from Group B is from the 160 true positives of B. Similarly for negatives.

          But there is no constraint that the distribution of true positives and true negatives across score bins is the same in both groups. However, for the same score s, the ratio of positives to negatives in that bin must be the same in both groups? 

          From the above, for a fixed s, we have:

            positives_A / negatives_A = s / (1-s)
            positives_B / negatives_B = s / (1-s)

          So the ratio of positives to negatives in score bin s is the same in both groups.

          Therefore, for every score bin s, the ratio of positives to negatives is s/(1-s), which is independent of the group.

          Now, let's look at the entire range above the threshold. For the set of individuals with score>=threshold, the ratio of positives to negatives should be the same in both groups? Because in every score bin within that set, the ratio is s/(1-s) and we might think that by integrating, the overall ratio would be the same. But note, the distribution of s above the threshold may be different in the two groups.

          However, the overall number of positives above threshold in Group A is 80, negatives is 90.
          In Group B, positives above threshold is 160, negatives is 80.

          The ratio in Group A: 80/90 = 8/9
          In Group B: 160/80 = 2

          8/9 is not equal to 2. 

          Therefore, it is impossible to have the same density of score bins above the threshold in both groups such that in each bin the ratio of positives to negatives is s/(1-s) and also have the overall counts as above.

          This is the contradiction.

          How to see it without the binning? The condition that in every score bin the ratio of positives to negatives is s/(1-s) means that the only thing that varies is the volume of people in each bin. But then the overall ratio of positives to negatives above the threshold should be the same in both groups, because it would be a weighted average of the same ratios s/(1-s) with different weights. However, the weights ( the number of people in each bin) might differ, but the ratio in each bin is fixed to s/(1-s). Therefore, the overall ratio must be the same.

          In our example, the overall ratio in the positive predictions are different (8/9 in A and 2 in B), so it's impossible.

          Therefore, in summary:

            - Calibration requires that for every score s, the odds of being positive (positives/negatives) in that bin are s/(1-s) in both groups.
            - This means that the conditional distribution of the score given the group for the positive class and for the negative class must be such that the likelihood ratio is constant across groups for a given score.
            - Then, the overall odds in the set above the threshold should be the same in both groups.
            - But our assignment from equal error rates gave different odds (8/9 vs 2).

          Hence, impossible.

      This argument can be made in 30 minutes.

      Proposed steps:

          0. (2 min) Introduce the two groups and their base rates. Example: medical screening.

          1. (5 min) Define calibration within groups: for any score s, the proportion of truly positive instances among those assigned score s and in group A is s, and similarly for group B. Use the whiteboard to draw the ideal calibration curve (y=x) for both groups.

          2. (5 min) Define false positive rate and false negative rate. Explain that we want these to be equal across groups. Use confusion matrix for each group.

          3. (8 min) Numerical example:
                Group A: 1000 people, 100 positives (10%)
                Group B: 1000 people, 200 positives (20%)
                Assume we set a threshold and require:
                    FPR = 10% in both groups.
                    FNR = 20% in both groups.
                Compute:
                    Group A: 
                        FN = 20, so TP = 80
                        FP = 10% of 900 = 90
                        Predicted positive = 80+90=170
                    Group B:
                        FN = 40, TP = 160
                        FP = 10% of 800 = 80
                        Predicted positive = 160+80=240

          4. (8 min) Now, consider the scores above the threshold. For every score s in the range [threshold, 1], calibration requires that the proportion of positives among the individuals with score s is s. This means that in that score bin, the odds of positives to negatives is s/(1-s). 
              - Therefore, in Group A, in the set of 170 above threshold, the number of positives and negatives must be distributed such that in each score bin, the ratio is s/(1-s).
              - Similarly for Group B, in the set of 240, the same condition per bin.
              - But then, the overall odds in the predicted positive set in Group A: (80 positives) / (90 negatives) = 80/90 = 8/9.
              - In Group B: 160/80 = 2.
              - These are different.

          5. (2 min) Therefore, it is impossible to have both conditions unless the base rates are equal or the classifier is perfect (which would give no errors and then the ratio in the positive set would be infinity in both groups).

      Address misconceptions:

          - "This is really about biased training data": 
              We are not talking about training data. We are assuming we have a model that already satisfies calibration in each group. The training data might be unbiased, but the base rates are different. The impossibility is statistical.

          - "More data fixes it": 
              More data might help you achieve calibration within groups, but it won't change the base rates. The base rates are properties of the populations. More data will make the model reflect the base rates more accurately, which might make the calibration condition hold better, but then the error rates will necessarily be different if the base rates are different.

      What to openly refuse to cover in half an hour:

          - We are not covering how to train such models.
          - We are not covering other fairness definitions (like demographic parity, equal opportunity, etc.).
          - We are not going into the COMPAS debate or any real-world sensitive example.
          - We are not discussing the ethical implications.

      One question at the end to separate understanding from "fairness is hard":

          "In our example, if we force group-wise calibration and try to force equal false positive rates, what happens to the false negative rates in the two groups? Can they be equal?"

          Answer: They cannot. The argument above shows that both cannot be equal simultaneously. So if you force calibration and equal FPR, then the FNR must be different. Similarly, if you force calibration and equal FNR, then the FPR must be different.

          A student who got it will say that they can't be equal. A student who came away with "fairness is hard" might say that it becomes harder to achieve.
