  ### Lecture Plan: Impossibility Result in Fair ML (30 Minutes)

  **Goal:** Demonstrate that when two groups have different base rates, a classifier cannot simultaneously achieve group-wise calibration and equal error rates (FPR/FNR) unless it's near-perfect.

  ---

  #### **0. Setup & Context (2 min)**
  - **Hook**: "We build models to predict outcomes. But when groups have different underlying rates (e.g., disease prevalence), can we achieve 'fairness' in both probability accuracy and error rates?"
  - **Disclaimers**: 
    - "We're focusing on a *technical* impossibility, not ethics or real-world cases (like COMPAS)."
    - "Not covering: How to collect data, train models, or other fairness metrics. Just this one result."

  ---

  #### **1. Define Core Concepts (8 min)**
  **Use a medical screening example (non-controversial, clear base rates):**  
  - **Groups**: Population A (low-risk, 2% disease prevalence) vs. Population B (high-risk, 10% prevalence).  
  - **Classifier**: Predicts probability of disease. Threshold = 0.5 for binary decision.  

  **Sketch on whiteboard:**  
  - **Calibration (Group-Wise)**:  
    - "If 100 people in Group A get a score of 0.3, ~30 should have the disease. Same for Group B."  
    - *Visual*: Two calibration curves (one per group) hugging the diagonal.  
  - **Error Rates**:  
    - **False Positive Rate (FPR)**: Healthy people incorrectly flagged.  
      - *Math*: `FPR = FP / (FP + TN)`  
    - **False Negative Rate (FNR)**: Sick people missed.  
      - *Math*: `FNR = FN / (FN + TP)`  
    - **Goal**: Equal FPR and FNR across groups.  

  **Key Insight**:  
  - "Calibration is about *probability accuracy*. Error rates are about *decision boundaries*. They measure different things!"  

  ---

  #### **2. Introduce Tension via Base Rates (5 min)**
  - **Scenario Setup**:  
    - Assume a **perfectly calibrated classifier** for both groups.  
    - Base rates: `P_A = 0.02` (A), `P_B = 0.10` (B).  
  - **Question**: "If we set the same threshold, can error rates be equal?"  
  - **Walkthrough Logic**:  
    - For calibrated scores:  
      - In Group A (low prevalence), scores cluster near 0.  
      - In Group B (high prevalence), scores spread toward 1.  
    - **Consequence**:  
      - To achieve equal FPR, Group A needs a *higher* threshold (since many low-scoring healthy people).  
      - To achieve equal FNR, Group B needs a *lower* threshold (since high-scoring sick people are prioritized).  
    - **Contradiction**: Same threshold can’t satisfy both.  

  ---

  #### **3. Impossibility Proof via Math (8 min)**
  - **Define Terms**:  
    - `s = threshold`, `P_A`, `P_B` (base rates), `FPR_A`, `FPR_B`, `FNR_A`, `FNR_B`.  
  - **Derive Predicted Positive Rate**:  
    - `PPR = P(Y=1) * (1 - FNR) + P(Y=0) * FPR`  
    - For Group A: `PPR_A = P_A*(1 - FNR_A) + (1 - P_A)*FPR_A`  
    - For Group B: `PPR_B = P_B*(1 - FNR_B) + (1 - P_B)*FPR_B`  
  - **Assume Equal Error Rates**:  
    - `FPR_A = FPR_B = FPR`, `FNR_A = FNR_B = FNR`.  
  - **Assume Calibration**:  
    - Expected score in Group A = `P_A`, in Group B = `P_B`.  
  - **The Crucial Equation**:  
    - `PPR_A - PPR_B = (P_A - P_B) * [1 - (FPR + FNR)]`  
  - **Impossibility**:  
    - If `P_A ≠ P_B` and classifier isn’t perfect (`FPR + FNR > 0`), then `PPR_A ≠ PPR_B`.  
    - But calibration forces **different score distributions** (due to base rates), so error rates **can’t be equal** without perfect accuracy.  

  ---

  #### **4. Debunk Misconceptions (4 min)**
  **Kill misconceptions in sequence:**  
  1. **"This is about biased training data"**:  
     - "Even with *perfect*, unbiased data reflecting true base rates, the issue persists. It’s inherent to the distributions."  
     - *Shut down debate*: "We’re not questioning data quality today—we’re assuming ideal data."  

  2. **"More data fixes it"**:  
     - "More data improves calibration, but doesn’t change base rates. If `P_A ≠ P_B`, the tension remains."  
     - *Analogy*: "Like saying more thermometer readings change the weather."  

  ---

  #### **5. Conclusion and Punchline (2 min)**
  - **Summary**:  
    - "Different base rates → calibration forces different score distributions → equal error rates are impossible without perfect accuracy."  
  - **Why Care?**:  
    - "You must choose: probability accuracy (calibration) or equal errors. Not both."  

  ---

  #### **6. Critical Check Question (1 min)**
  **Ask at the end:**  
  > *"In our medical example, if we force equal FPR across groups in a calibrated model, what happens to the FNR in the low-prevalence group vs. the high-prevalence group?"*  

  **Answer to listen for**:  
  - "FNR must be **higher in the low-prevalence group** (Group A).  
    Why? To balance FPR equality, Group A’s threshold must rise, missing more true positives (↑ FNR). Group B’s threshold stays lower, so FNR doesn’t increase as much."  
  - **Why this separates understanding**:  
    - Correct answer shows grasp of *trade-off mechanics*.  
    - Vague answers ("errors get worse") miss the asymmetric impact.  

  ---

  **Total**: 30 minutes.  
  **Whiteboard Flow**:  
  1. Medical example + base rates.  
  2. Calibration curves (2 groups).  
  3. Confusion matrices (FPR/FNR definitions).  
  4. Score distributions (low vs. high prevalence).  
  5. `PPR_A - PPR_B` equation.  
  6. Trade-off arrows (FPR equality → FNR imbalance).
