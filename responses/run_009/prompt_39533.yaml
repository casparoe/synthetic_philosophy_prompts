  We are going to teach the impossibility result: when two groups have different base rates, you can't have both group-wise calibration and equal error rates (e.g., equal false positive rates and false negative rates) unless the predictor is perfect.

   Steps:

   1. Set the stage: We are comparing two groups (say Group A and Group B) and we have a binary classifier that outputs a score (or probability) and we make a binary decision (e.g., 0 or 1) by thresholding.

   2. Define the two fairness criteria we are talking about:

      a. Group-wise Calibration (also known as calibration by group or within-group fairness): 
          For any score value s, the proportion of positives among individuals assigned score s should be approximately s, and this holds in each group separately.

          Example: In Group A, among people who got a score of 0.7, 70% should be positive. Similarly for Group B.

      b. Equal Error Rates: We focus on two types of errors:
          - False Positive Rate (FPR): P(score > threshold | true label = 0)
          - False Negative Rate (FNR): P(score <= threshold | true label = 1)

          We want FPR to be the same in Group A and Group B, and FNR to be the same in Group A and Group B.

   3. Base Rates: The prevalence of the positive class in each group, i.e., P(Y=1|Group=A) and P(Y=1|Group=B). We assume these are different.

   4. The Impossibility: We cannot simultaneously satisfy both group-wise calibration and equal error rates (FPR and FNR) unless the base rates are equal or the predictor is perfect.

   5. Example Choice:

      We want to avoid COMPAS. We also want an example that is non-controversial and clearly shows the base rate difference.

      Medical Screening Example:

          Group A: General population with a low prevalence of a disease (say 1%)
          Group B: High-risk population (say due to family history) with a higher prevalence (say 10%)

          We have a classifier that predicts the probability of having the disease.

          We want:
            - Calibration: In both groups, if the model says 5%, then about 5% of those should have the disease.
            - Equal Error Rates: The same false positive rate and false negative rate in both groups.

      Why medical? It's less charged than loans or criminal justice, and the base rate difference is intuitive.

