answer: |-
  (As your friend, leaning forward intently, voice calm but edged with conviction)  
  Your objection misunderstands the relational nature of the view. Yes, the HOT is *causally* unconscious—it lacks its own higher-order target—but it's not "doing the work" *by being conscious*; it's doing it *by representing*. Consciousness isn't a substance infused; it's a relational property *conferred* when a first-order state is appropriately represented *as* occurring. Your first-order state has no intrinsic "glow"—it's just a state. The HOT provides the structure of awareness *by* representing it. If you insist your pain is intrinsically conscious without this, you're just asserting the magic you accuse me of—you're positing an unexplained, brute property "here now, gone later" in identical neural states during subliminal processing versus awareness. Where are *its* credentials? The HOT avoids that mystery by grounding phenomenality in intentional content.
