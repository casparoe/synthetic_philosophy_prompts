prompt: |-
  I direct the policy review unit of the immigration directorate of a small, wealthy democracy. Our government accepts that freedom of movement carries real moral weight and does not want to defend border controls as a bare entitlement, but it also rejects open borders and intends to keep a selective admissions system. The minister has asked my unit for a decision procedure that front-line officers can actually use to determine whether a given exclusion — a general rule, a category bar, or an individual refusal — is justified. What we need is not a treatise but something operational, and that is where the philosophical debate has to be compressed without being betrayed.

  The procedure should be grounded in the actual structure of the open-borders debate: the associational defense of the state's right to exclude, on which the state is a cooperative venture that may control membership but only within limits — its duties to refugees, its duty not to worsen the position of outsiders, the claims of people already present and the special claims of long-term residents; the open-borders position, on which birthplace is morally arbitrary in something like the way feudal birthright privilege was, and movement counts as a basic liberty that presumptively may not be restricted; and the intermediate positions that would permit exclusion only under sufficiency or legitimacy conditions. Your task is to turn this into something a generalist civil servant with no philosophy training can run on a written case file in about an hour.

  Please provide the following:

  1. An ordered set of questions the officer asks about any proposed exclusion, with a statement of what counts as a sufficient answer to each, and the points at which the procedure terminates — either in a verdict that the exclusion is permissible or in a verdict that it is not.

  2. An explicit allocation of the burden of proof. Our government concedes that movement matters morally, so the procedure should say who must show what, and to what standard, before exclusion goes through.

  3. The procedure's known failure modes: where it will tend to rubber-stamp whatever the government of the day prefers, where it smuggles in contested philosophical assumptions as if they were neutral administrative tests, and where the compression from theory to checklist loses something the theory itself says is essential.

  4. Worked applications to three cases: (a) an annual cap on low-skilled work visas justified as protection of domestic wages; (b) refusal of entry to the spouse of a long-term resident on income-maintenance grounds; (c) an asylum claim by someone fleeing economic collapse rather than targeted persecution. Include at least one case in which the procedure yields a verdict you expect the minister will dislike, and explain why it yields that verdict anyway.

  5. A closing statement of what the procedure cannot do: the questions it deliberately brackets — including the prior question of whether selective borders are legitimate at all — and what would have to change, philosophically or factually, for its outputs to come out differently.

  Two practical constraints: wherever a step requires evidence, as with whether a visa cap actually protects wages, specify what kind of evidence would suffice and what the officer should do when it is unavailable; and mark clearly the steps at which the question stops being one the procedure can settle and must be escalated to the minister as a decision of political values.
reasoning: |-
  Okay, the user is leading a policy review unit in a small, wealthy democracy's immigration directorate. They need a practical decision procedure for border exclusions that balances moral weight of freedom of movement against selective admissions. The challenge is compressing philosophical debates into an operational tool for frontline officers.

  Hmm, the core tension here is between theoretical rigor and bureaucratic practicality. The user explicitly rejects both open borders and naked sovereignty claims, so the framework must navigate that middle ground. They're clearly frustrated with abstract philosophy - "not a treatise" is emphasized - but also fear oversimplification that betrays the underlying principles.

  Let me unpack their requirements. First, the procedure must reflect the three main positions in immigration ethics: associational defense (state as cooperative venture with limited exclusion rights), open borders (birthplace arbitrariness), and intermediate sufficiency/legitimacy views. That's a lot to operationalize. 

  The burden of proof point is crucial - since the government concedes movement has moral weight, exclusions should bear justification. I'm thinking we need a presumption against exclusion unless certain thresholds are met. But how to make that concrete for officers?

  For the decision tree, we'll need fail-safes against rubber-stamping. The user anticipates this will be used by time-pressed generalists, so cognitive biases toward status quo are a real risk. The "known failure modes" request shows admirable self-awareness - they want transparency about where the tool might misfire.

  The three test cases are revealing: 
  (a) Work visa caps protecting wages touches on distributive justice and harm to outsiders 
  (b) Spousal income requirements test family unity vs. fiscal burden arguments 
  (c) Economic collapse asylum probes the persecution/hardship boundary 

  Ah, and they specifically want at least one outcome that would displease the minister - that's a smart check against designing something that just legitimates whatever policy exists.

  Practical constraints: Evidence standards are tricky. For wage protection claims, what data suffices? Must specify acceptable evidence tiers and procedures for absence of data. And clear escalation triggers when value judgments exceed the procedure's scope.

  ...I'm structuring this as a six-stage flowchart with burden of proof shifting systematically. Starting with strongest moral claims (refugees, families) before moving to discretionary admissions. Each question must have binary outcomes or clear escalation paths. 

  For burden allocation: The state should prove exclusion meets at least one justification threshold, with higher standards for cases involving fundamental interests. Standards of proof will range from "reasonable basis" to "clear and convincing" depending on the right at stake.

  Biggest compression risk? Reducing complex harms to outsiders into checkbox questions. Also the "cooperative venture" concept could subtly favor current members' interests. Will flag these in failure modes.

  On the test cases: The spousal refusal should fail under this framework - income thresholds disproportionately burden vulnerable groups without strong countervailing evidence. Minister won't like that, but it demonstrates integrity. For economic collapse asylum, we'll distinguish between generalized hardship and selective deprivation.

  Closing limitation: The procedure can't resolve whether selective borders are fundamentally legitimate - it assumes the associational view as its foundation. Also can't address historical injustice reparations. Significant philosophical or factual shifts would alter outputs, like if automation eliminated wage competition concerns.

  Evidence handling is critical. For wage impacts, we'll require labor economics studies or equivalent, with fallbacks to "no evidence" triggering presumption against exclusion. Escalation points will be marked when questions involve core democratic tradeoffs beyond officers' mandate.
answer: |-
  Here is an operational decision procedure grounded in the specified philosophical positions, designed for frontline officers. It compresses key debates into a structured checklist while acknowledging its limitations.

  **Core Principles:**
  -   **Burden of Proof:** The state bears the burden of justifying any exclusion. Freedom of movement is presumed morally significant.
  -   **Standard of Proof:** "Clear and Reasonable Justification" (CRJ) required. CRJ means: (a) Evidence is credible and relevant; (b) Reasoning connecting evidence to justification is logical and not contradicted by stronger counter-evidence; (c) Justification aligns with at least one accepted principle below. If CRJ is unmet, exclusion fails.
  -   **Termination:** Proceed sequentially. If any question yields "No Exclusion Permitted," stop. If all applicable questions are passed, exclusion is provisionally permissible (final check: Failure Modes).

  **The Decision Procedure: "JADE" Framework (Justification Assessment for Denials & Exclusions)**

  1.  **J: JEOPARDY TO CORE STATE FUNCTIONS?**
      *   *Question:* Does admitting this person/category *directly and substantially* threaten the state's ability to guarantee physical security, essential public health (e.g., uncontrolled pandemic), or the fundamental functioning of its core legal/political institutions (e.g., violent overthrow)?
      *   *Sufficient Answer (CRJ Required):* Evidence linking the specific individual/category to a *concrete, imminent, and severe* threat (e.g., active terrorist affiliation, specific violent criminal intent, highly infectious dangerous disease with no containment). Generalized fears or speculative risks are insufficient.
      *   *Termination:* If **YES**, exclusion is **Permitted**. Proceed to Step 5 (Failure Modes). If **NO**, proceed to Step 2.
      *   *Evidence:* Intelligence reports, verified criminal records, WHO/public health agency alerts. *If Unavailable:* Exclusion **Not Permitted**.

  2.  **A: ASSOCIATIONAL INTEGRITY / FAIR SHARING OVERRIDDEN?**
      *   *Question A1 (Refugees):* Is the person fleeing a situation meeting the Refugee Convention definition (persecution) OR facing a credible threat of death, torture, or inhuman/degrading treatment? (Applies only to individual cases).
      *   *Sufficient Answer (CRJ Required):* Evidence of well-founded fear based on race, religion, nationality, political opinion, membership in a particular social group OR evidence of extreme, indiscriminate violence/threat equivalent to Art 3 ECHR.
      *   *Termination:* If **YES**, exclusion is **Not Permitted** (Duty to Refugees overrides associational control). Stop. If **NO**, proceed to A2.
      *   *Evidence:* Personal testimony (credibility assessed), country reports (UNHCR, Amnesty, HRW), medical evidence. *If Unavailable:* Officer *must* assess credibility rigorously. If testimony is coherent, consistent, and plausible given known country conditions, assume **YES**.
      *   *Question A2 (Severe Harm to Outsiders):* Would admitting this person/category *actively worsen* the situation of identifiable, vulnerable outsiders in a severe way (e.g., triggering destabilizing "brain drain" from a fragile state, directly enabling human trafficking)?
      *   *Sufficient Answer (CRJ Required):* Evidence demonstrating a direct causal link between admission and severe, foreseeable harm to a specific vulnerable group abroad. General concerns about "encouraging others" are insufficient.
      *   *Termination:* If **YES**, exclusion **may be Permitted** (State duty not to worsen outsiders' position). Proceed to Step 5. If **NO**, proceed to A3.
      *   *Evidence:* Development agency reports, academic studies on migration impacts in specific contexts. *If Unavailable:* Exclusion **Not Permitted**.
      *   *Question A3 (Overriding Existing Member Claims):* Does admitting this person/category impose *unreasonable and disproportionate* burdens on the cooperative venture, *specifically* undermining (a) Essential welfare provision for existing vulnerable residents (e.g., overwhelming healthcare/social housing), OR (b) The legitimate expectations/constitutive ties of long-term residents (esp. family unity)?
      *   *Sufficient Answer (CRJ Required):*
          *   *(a) Welfare Burden:* Evidence showing admission would cause *specific, measurable* breakdown in essential service provision *that cannot be reasonably mitigated* (e.g., specific healthcare wait times exceeding safe limits due *solely* to this cohort). General fiscal cost arguments are *insufficient*. Higher burden for excluding family members of residents.
          *   *(b) Family Unity:* Evidence showing refusal is *strictly necessary* to prevent demonstrable, severe harm to state interests (beyond minor fiscal cost). Burden is *very high* for spouses/minor children of long-term residents/citizens.
      *   *Termination:* If **YES** (either a or b), exclusion **may be Permitted**. Proceed to Step 5. If **NO**, proceed to Step 3.
      *   *Evidence:* Gov't impact assessments, expert reports (e.g., NHS capacity studies). For family unity, evidence must show *specific, severe harm* (e.g., national security threat from spouse, *proven* marriage fraud undermining system integrity). *If Unavailable:* Exclusion **Not Permitted**, especially for family unity.

  3.  **D: DISCRETIONARY SELECTION - SUFFICIENCY & FAIRNESS?**
      *   *Applies to:* Policies like skill-based points systems, quotas, income requirements *not* covered in Steps 1-2.
      *   *Question D1 (Sufficiency Threshold):* Is the exclusion criteria designed to select individuals who demonstrably *can* integrate and contribute sufficiently to the cooperative venture without unreasonable initial support *and* without relying on exploitative conditions?
      *   *Sufficient Answer (CRJ Required):* Evidence that the criteria (e.g., skill level, language, resources) are reasonably correlated with successful integration/self-sufficiency based on past data or credible studies. Criteria cannot be set so high as to be effectively exclusionary of all but the elite unless justified under A3(a).
      *   *Question D2 (Non-Worsening & Fair Opportunity):* (a) Does the policy/system provide *some* accessible, transparent pathway for different categories of entrants (e.g., work, family, humanitarian)? (b) Are the criteria applied consistently and without arbitrary discrimination?
      *   *Sufficient Answer (CRJ Required):* (a) Evidence of published pathways meeting basic accessibility (reasonable fees, clear rules). (b) Evidence of consistent application and non-discrimination (audits, complaint mechanisms). *De facto* exclusion of entire nationalities/ethnicities likely fails.
      *   *Termination:* If **BOTH D1 and D2 are answered YES (CRJ Met)**, exclusion under this *specific discretionary rule* is **Provisionally Permitted**. Proceed to Step 5. If **NO to D1 or D2**, exclusion under this rule is **Not Permitted**. Stop.

  4.  **E: ESCALATION CHECK**
      *   *Question:* Does the justification rely primarily on a contested *political judgment* about the *desirable character* or *optimal size* of the political community, where reasonable people adhering to the government's core principles (rejecting bare entitlement, accepting FoM weight) could disagree?
      *   *Sufficient Answer:* Yes, if the core justification is about shaping society's culture, "preserving national identity," setting an *ideal* population size for sustainability/growth (absent imminent breakdown under A3), or similar value-laden goals beyond preventing harm/ensuring fairness.
      *   *Termination:* If **YES**, **Escalate to Minister**. The exclusion requires a political value judgment beyond the procedure's scope. If **NO**, proceed to Step 5.

  5.  **FAILURE MODES CHECK (Final Gate)**
      *   Review the proposed exclusion against known failure modes:
          *   *Rubber-Stamp Risk:* Is this exclusion primarily justified by vague appeals to "public interest," "economic protection," or "social cohesion" without meeting the *specific* CRJ tests in Steps 1-3? (If Yes, exclusion **Not Permitted**).
          *   *Smuggled Assumptions:* Does the CRJ rely on assumptions treated as neutral facts but are actually contested (e.g., "low-skilled immigrants *always* depress wages," "cultural incompatibility is inevitable") without strong, specific evidence? (If Yes, exclusion **Not Permitted** or evidence reassessed).
          *   *Essential Loss in Compression:* Does this case involve a severe hardship that seems morally relevant but isn't captured by the categories (e.g., compelling humanitarian need falling just outside refugee definition, catastrophic but non-targeted suffering)? Officer *must* flag for humanitarian review/exceptional leave *outside* this procedure, but exclusion *under standard rules* may stand.
      *   *Termination:* If no failure mode invalidates the CRJ established in prior steps, exclusion is **Permitted**. If a failure mode is triggered, exclusion is **Not Permitted** (or Escalated if Step 4 applies).

  ---

  **Application to Cases:**

  1.  **(a) Annual Cap on Low-Skilled Work Visas (Wage Protection Justification)**
      *   **Step 1 (J):** NO (No jeopardy to core functions).
      *   **Step 2 (A):**
          *   A1: N/A (Not individual refugee claim).
          *   A2: Officer asks: Does the cap *worsen* vulnerable outsiders? Likely YES (denies opportunity to low-skilled workers, potentially trapping them in worse situations). CRJ needed for exclusion: Officer must find evidence the cap is *necessary* to prevent *severe harm* to domestic low-wage workers *that cannot be mitigated* (e.g., minimum wage enforcement). Common arguments ("they take jobs") need specific evidence showing cap *causally* prevents demonstrable, significant wage depression/social harm impacting vulnerable residents. *If robust, recent economic studies show a direct causal link between visa numbers and significant wage suppression for specific vulnerable groups, and no feasible alternative (like sectoral wage boards) exists, CRJ might be met under A3(a) - protecting existing vulnerable residents.* **Likely Hurdle:** Evidence often contested; alternatives (enforcing labor standards) may exist. *Without CRJ evidence, exclusion Not Permitted.*
          *   A3(a): Overlap with A2 question above. Focus shifts to harm *to existing residents*. Same evidence requirement.
      *   **Step 3 (D):** If cap survives Step 2, does it have a fair pathway (D2)? Probably YES if part of a broader system. But if no alternative routes exist, D2(a) may fail.
      *   **Step 4 (E):** Is it primarily about wages (A3(a)) or about limiting numbers/society character? If the *sole* justification is wage protection meeting CRJ, NO escalation. If underlying motive is cultural/identity, YES Escalate.
      *   **Step 5 (FM):** High *Rubber-Stamp Risk* if relying on generic "protecting jobs" rhetoric without specific evidence. *Smuggled Assumption:* That immigrants *cause* wage depression absent other factors (monopsony power, weak unions).
      *   **Verdict:** **Likely Not Permitted** unless government provides unusually strong, specific, and recent evidence meeting the high CRJ bar under A2/A3(a), demonstrating severe, unavoidable harm to vulnerable domestic workers directly caused by the *absence* of the cap, with no less restrictive alternative. Minister may dislike this as it challenges common protectionist policies.

  2.  **(b) Refusal of Entry to Spouse of Long-Term Resident (Income Maintenance)**
      *   **Step 1 (J):** NO.
      *   **Step 2 (A):**
          *   A1: NO (Not refugee).
          *   A2: UNLIKELY (Admitting one spouse unlikely to worsen outsiders' position severely).
          *   **A3(b): CRITICAL - Family Unity.** Officer asks: Is refusal *strictly necessary* to prevent *severe, demonstrable harm* to state interests? Mere possibility of accessing welfare is insufficient. CRJ requires evidence:
              *   The specific spouse is highly likely to become a *significant, long-term* drain *despite* the sponsor's income/assurances.
              *   This burden would be *unreasonable and disproportionate* (e.g., overwhelming a specific essential service).
              *   Less restrictive alternatives (bond, phased access to benefits) are ineffective or unworkable.
          *   *Evidence Needed:* Robust data showing sponsored spouses in *similar financial circumstances* consistently become high-cost welfare dependents *despite sponsorship commitments*. Individualized assessment is better than blanket rules. *If evidence is generic (e.g., "some spouses use benefits") or unavailable, CRJ fails.* Burden is very high.
      *   **Termination:** **Likely Not Permitted.** The high burden under A3(b) for family unity is unlikely to be met by generic income thresholds alone without evidence of *specific, severe harm* in this case or directly comparable cases. The core associational claim (protecting members) is overridden by the stronger moral claim of family unity for long-term residents. *Minister may dislike this as it challenges common income requirements.*

  3.  **(c) Asylum Claim (Fleeing Economic Collapse, Not Targeted Persecution)**
      *   **Step 1 (J):** NO.
      *   **Step 2 (A):**
      *   **A1:** Is this Refugee Convention persecution OR Art 3 ECHR treatment? Economic collapse alone is neither. Officer assesses:
          *   Is the collapse causing *indiscriminate* violence meeting Art 3 (e.g., complete anarchy, warlordism, famine with state collapse)? If **YES**, asylum may be required under extended protection (depending on national interpretation). If **NO**, proceed.
          *   Is the person *individually targeted* for Convention reasons *within* the collapse (e.g., ethnic group denied aid)? If **YES**, asylum required. If **NO**, proceed to A2/A3.
      *   **A2:** Admitting them doesn't actively worsen outsiders' position (might help via remittances).
      *   **A3(a):** Does admitting this *one person* threaten essential welfare provision? Unlikely unless evidence shows imminent, specific overload (e.g., rare medical condition requiring immediate, scarce resource). Generic fiscal cost insufficient.
      *   **Termination after A1/A2/A3:** Asylum **Not Permitted** under *refugee rules*. However, **Step 5 (FM):** *Essential Loss in Compression:* Officer *must* flag the severe hardship. While exclusion under asylum rules is permitted, the humanitarian need triggers a mandatory flag for consideration under *other pathways* (humanitarian protection, discretionary leave) outside this procedure. Not a "win" for the claimant under asylum, but avoids total dismissal.

  ---

  **What the Procedure Cannot Do (Closing Statement):**

  1.  **Resolve Foundational Legitimacy:** It *assumes* the "associational" view (states have limited rights to exclude) is the starting point. It cannot answer the open-borders argument that birthplace is arbitrary like feudal privilege. This is a deliberate, necessary bracketing for operationality within the government's mandate.
  2.  **Address Historical Injustice:** It assesses justifications *prospectively* and *currently*. It does not factor in historical wrongs (e.g., colonialism) that may create special obligations, as these are politically contested and lack operational consensus.
  3.  **Define "Essential" Services/Thresholds:** Judgments about what constitutes an "essential" service burden (Step 2 A3a) or "severe" harm (Steps 1, 2) involve line-drawing based on societal values. The procedure relies on evidence and logical connection but the underlying thresholds are set by policy/law; officers apply them.
  4.  **Replace Political Judgment on Community Character:** When Step 4 (Escalation) is triggered, the procedure explicitly acknowledges this limit. Decisions about the *desired* size or cultural character of the community belong to elected officials.
  5.  **Eliminate Discretion Entirely:** While structuring reasoning, judgment calls on evidence credibility and "reasonableness" remain. Training and oversight are essential.
  6.  **Guarantee Perfect Moral Outcomes:** Compression risks missing nuanced harms or unique circumstances (Step 5 Failure Modes). The humanitarian flag is a crucial but limited safety valve.

  **Changes Altering Outputs:**
  *   **Philosophical Shift:** Adopting a stronger open-borders position would invalidate most exclusions. Embracing a pure sovereignty view would make the procedure redundant.
  *   **Factual Shifts:** Evidence showing open borders cause *no* negative effects on wages/welfare would undermine most Step 2 A3 justifications. Proof that border controls *inevitably* cause severe, direct harm to specific outsiders (Step 2 A2) could block many exclusions. Technological/social changes mitigating integration burdens (Step 3 D1) would lower barriers.
