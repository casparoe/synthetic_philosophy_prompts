prompt: |-
  I'm writing the final for my upper-level seminar on formal epistemology, and I want a single essay question on the Sleeping Beauty problem — the version where Beauty is awakened once on heads and twice on tails, with amnesia in between. The problem is that students can more or less pass a standard question on this by reciting the halfer and thirder positions and muttering something about centered worlds, so I need a question that forces them past the labels. The question should be built around a variant that I'll describe here and that your question should introduce self-contained (our exam is open-book but the students won't have the seminar notes in front of them, so everything must be stated in the question): on heads Beauty is interviewed once on Monday; on tails she is interviewed 99 times, once per day, with her memory wiped between interviews. Students must say whether the thirder's reasoning, if accepted in the standard case, commits her to a credence of 1/100 in heads in the variant, whether the halfer can hold the line at 1/2 without an ad hoc stopping point, and what each answer implies about credence in the self-locating proposition "today is my first interview." A student who has merely memorized the two camps should not be able to fake their way through this; the crux I want tested is whether they can articulate what the disagreement is actually about — whether self-locating uncertainty is genuine uncertainty that Bayesian tools apply to, or a bookkeeping matter — and whether they can see that the temptation to say "1/100, obviously" in the variant needs an argument, not an intuition.

  The question should also require them to address a trap I like to spring: an interviewer offers Beauty a bet that pays $1 on heads, to be settled once, at the end of the experiment, no matter how many interviews occur. Students often run betting arguments that silently switch between bets settled per-interview and bets settled per-experiment; the question should make them say explicitly which kind of bet supports which conclusion, and whether either kind settles the credence question or merely the pricing question. Candidates have 90 minutes, and I'd rather they argue than pad.

  Please give me: the exam question itself (self-contained, no citations of the literature by name, phrased so the variant does the work), a model answer of roughly 600–700 words, and a marking scheme worth 20 points total built around five must-hit moves, with a one-line note after each on how students typically fumble it. In the marking scheme, please also state in a sentence or two what separates an A answer from a B answer — that is, the specific thing a solid-but-not-stellar answer will be missing. Please write everything in American English, and keep the tone of the exam question formal but readable.
reasoning: |-
  We are designing a challenging exam question on the Sleeping Beauty problem variant. The goal is to push students beyond mere recitation of halfer and thirder positions and force them to grapple with the underlying principles, especially concerning self-locating uncertainty and the application of Bayesian reasoning. The variant involves a coin flip: heads (interviewed once on Monday) and tails (interviewed 99 times, once per day from Monday to the 99th day, with memory wipes). The question should also include a betting scenario to test understanding of the difference between per-interview and per-experiment bets.

  ### Exam Question

  **Question:** Consider the following experiment. On Sunday, Beauty is put to sleep and a fair coin is flipped. If the coin lands heads, she will be awakened once, on Monday. If the coin lands tails, she will be awakened 99 times, once on each day from Monday to day 99 (a period of 99 days). After each awakening, she is given a drug that erases her memory of the awakening, so that each time she wakes up it feels like the first time. During each awakening, she is told the day and then interviewed. The entire experiment ends after day 99.

  (a) When Beauty is awakened during the experiment, she knows the setup but does not know the outcome of the coin flip or which day it is. What should be her credence that the coin landed heads? Explain your reasoning, addressing the following:

  - Whether the reasoning of the "thirder" position in the standard Sleeping Beauty problem (with two awakenings on tails) commits one to a credence of 1/100 in heads in this variant.
  - Whether the "halfer" position can consistently maintain a credence of 1/2 in heads without introducing an arbitrary stopping point.
  - What each position (thirder and halfer) implies about Beauty's credence in the self-locating proposition: "Today is my first interview."

  (b) During an awakening, the interviewer offers Beauty a bet that pays $1 if the coin landed heads, to be settled once at the end of the experiment (regardless of how many interviews occur). How should Beauty price this bet? Contrast this with how she would price a bet that is settled on every interview (i.e., each time she is awakened, she is offered a bet that pays $1 if heads, and these bets are settled independently at the end of the experiment). Explain the relevance of these betting behaviors to the disagreement between halfers and thirders.

  ### Model Answer (Approx. 650 words)

  **Answer:**

  (a) The Sleeping Beauty problem, in this variant, challenges us to assign a credence to heads (H) upon awakening. The thirder position in the standard case (one awakening on H, two on T) argues for a credence of 1/3 for H. By analogy, in this variant (one awakening on H, 99 on T), the thirder would extend the reasoning to a credence of 1/100 for H. The argument is based on the principle of indifference over all possible awakening episodes. There are 100 possible awakening episodes (one on H, 99 on T), each subjectively indistinguishable. Therefore, each episode is equally likely, and since only one episode occurs on H, the credence in H is 1/100.

  However, the halfer position maintains that the coin flip is fair and that no new information that is relevant to H has been gained upon awakening (other than that she is awake, which was certain). Thus, the halfer insists on a credence of 1/2 for H. The halfer must explain the additional awakenings on T without altering the initial credence. One way is to note that the self-locating information does not bear on the coin flip. The halfer can hold the line at 1/2 without an arbitrary stopping point by arguing that the coin flip is independent of the day. The halfer would model the uncertainty as two components: the coin flip and the day. Conditional on T, each day is equally likely, but the prior probability of H is 1/2. So, the halfer would compute the probability of H given that she is awake (which is always true) as still 1/2.

  Regarding the self-locating proposition "today is my first interview" (F): 
  - For the thirder: In the 100 equally likely awakenings, F is true only on the H awakening and on the first day of T (if we consider the first interview as the one on Monday). However, note that in the tails case, there are 99 awakenings but only one of them is the first interview (Monday). Thus, the credence in F would be the probability of being in an awakening that is the first. There are two such awakenings: the one on H (which is the only awakening and thus the first) and the one on T on Monday. But note: in the H case, there is only one awakening (Monday) and in the T case, the Monday awakening is one of the 99. However, the thirder counts all awakenings equally. So, there are 100 awakenings in total, and F is true in two of them: the H awakening and the T-Monday awakening. Therefore, the credence in F is 2/100 = 1/50.
  - For the halfer: The halfer would compute the probability of F by conditioning on the coin. With probability 1/2 (H), it is Monday and the first interview. With probability 1/2 (T), it is one of the 99 days, each equally likely. The probability that today is Monday (and hence the first interview) given T is 1/99. Therefore, the total probability for F is (1/2)*1 + (1/2)*(1/99) = 1/2 + 1/198 = 100/198 = 50/99. This is approximately 0.505.

  (b) The bet offered is settled once at the end of the experiment, paying $1 if H. This is a per-experiment bet. Beauty should price it at her credence for H. A halfer would price it at $0.50, while a thirder at $0.01 (since 1/100). However, note that the bet is settled once regardless of the number of interviews. Therefore, the halfer's pricing is straightforward: she expects to win $1 with probability 1/2, so the fair price is $0.50. The thirder, despite having a credence of 1/100, must note that the bet is only settled once. The thirder's credence of 1/100 is based on the current awakening being one of many. But the bet is not per-awakening. Therefore, the thirder must also price this bet at $0.50? This is a critical point. The thirder's 1/100 credence is about the current awakening being on H. But the bet is about the coin, not about the current awakening. The bet pays $1 if the coin is H, regardless of the day. So, the expected value of the bet, from the perspective of the entire experiment, is (1/2)*1 = $0.50. Therefore, both halfers and thirders should agree that the fair price for this per-experiment bet is $0.50.

  Now consider a per-interview bet: each time Beauty is awakened, she is offered a bet that pays $1 if H, and these bets are settled independently at the end. In this case, if the coin is H, she will have been awakened once and will collect $1. If T, she will have been awakened 99 times and will pay out $99 (if she has sold the bet) or collect nothing (if she is buying). The expected payout per bet from the experiment's perspective: 
  - If she buys one such bet at price $p: 
    - On H: she gets $1 - $p (net)
    - On T: she gets -$p (for each bet, but note she buys 99 bets on T, so net loss 99p, but we are pricing one bet)
  But note: from the perspective of an individual awakening, the thirder would say the probability of H is 1/100, so she would be willing to buy the bet for up to $0.01. However, if she buys the bet at $0.01 on every awakening, then:
    - On H: she buys one bet, pays $0.01, gets $1, so net $0.99.
    - On T: she buys 99 bets, pays $0.99, gets nothing, so net -$0.99.
  This is a fair game: expected net is (1/2)*0.99 + (1/2)*(-0.99) = 0.

  But the halfer, with credence 1/2, would price the per-interview bet at $0.50. If she buys at $0.50 on every awakening:
    - On H: one bet, pays $0.50, gets $1, net $0.50.
    - On T: 99 bets, pays $49.50, gets nothing, net -$49.50.
  Expected net: (1/2)*0.50 + (1/2)*(-49.50) = -24.50, a huge loss.

  Therefore, the per-interview bet must be priced at $0.01 to avoid expected loss, which aligns with the thirder's credence. The halfer must adjust to the per-interview context by recognizing that the bet is offered multiple times on T. This shows that the betting behavior depends on the settlement structure. The per-interview bet supports the thirder's position, while the per-experiment bet does not distinguish the two positions (both agree on $0.50). Thus, betting arguments do not settle the credence question unambiguously; they depend on how the bet is structured. The core disagreement is about whether self-locating uncertainty should be incorporated into credence via the principle of indifference over centered worlds (thirder) or whether the coin flip remains independent and should retain its prior probability (halfer).

  ### Marking Scheme (Total 20 points)

  1. **Understanding the thirder extension to the variant (4 points)**
     - Must state that the thirder, by indifference over awakenings, assigns credence 1/100 to heads.
     - Typical fumble: Fails to explain why the number of awakenings matters (e.g., just says "1/100 because 99+1=100" without the indifference principle).

  2. **Halfer's defense of 1/2 without arbitrary stopping (4 points)**
     - Must argue that the coin flip remains independent and that awakening provides no new relevant information (other than that she is awake, which was already known).
     - Typical fumble: Claims the halfer must adjust for the number of awakenings, or introduces an arbitrary stopping point (e.g., "only on Monday").

  3. **Credence in the self-locating proposition "today is my first interview" (4 points)**
     - For thirder: correctly computes 2/100 (H awakening and T-Monday awakening) -> 1/50.
     - For halfer: correctly computes (1/2)*1 + (1/2)*(1/99) = 50/99.
     - Typical fumble: For the thirder, counts only the H case for the first interview, forgetting that in T the Monday awakening is also the first.

  4. **Betting: per-experiment vs per-interview (4 points)**
     - Per-experiment bet: both positions agree on $0.50 because it is settled once and the coin is fair.
     - Per-interview bet: must note that the fair price is $0.01 to avoid expected loss (as per the calculation above), and that this aligns with the thirder's credence but the halfer must adjust to avoid a Dutch book.
     - Typical fumble: Asserts without calculation that the thirder would price the per-experiment bet at $0.01, or fails to distinguish the two types of bets.

  5. **Articulating the core disagreement (4 points)**
     - Must state that the disagreement is about whether self-locating uncertainty is genuine uncertainty that should be modeled with Bayesian updating over centered worlds (thirder) or whether it is a bookkeeping matter that does not affect the credence in the coin flip (halfer).
     - Typical fumble: Recites the two positions without getting to the philosophical underpinnings.

  **Separating an A from a B answer:**
  - A B answer will correctly compute the credences and betting prices but may fail to articulate the core disagreement about the nature of self-locating uncertainty. An A answer will explicitly connect the reasoning to the foundational question of whether self-locating uncertainty is subject to Bayesian updating and how centered worlds should be handled, and will also note that the betting behavior does not uniquely determine credence because it depends on the structure of the bet (per-interview vs per-experiment).
answer: |-
  ### Exam Question

  **The Modified Sleeping Beauty Problem**  
  Consider the following experiment. On Sunday, Sleeping Beauty is put to sleep, and a fair coin is flipped. If the coin lands heads (H), she is awakened for an interview once, on Monday. If the coin lands tails (T), she is awakened for an interview 99 times—once per day from Monday to day 99 inclusive (a 99-day period). After each awakening, she is given a drug that erases all memory of the interview and any previous awakenings, so that each awakening feels like the first. During each interview, she is informed of the day (e.g., "Today is Monday," "Today is Tuesday," etc.). The experiment concludes after day 99.  

  Beauty is fully informed of this setup in advance. Upon awakening during the experiment, she knows she is in one of the interviews but does not know the outcome of the coin flip or which day it is.  

  **Your Tasks:**  
  1. **Credence in Heads**: What should Beauty’s credence (subjective probability) be that the coin landed heads? In your response:  
     - Explain whether the "thirder" reasoning from the standard Sleeping Beauty problem (with one awakening on heads and two on tails) commits a thirder to a credence of 1/100 for heads in this variant.  
     - Explain whether a "halfer" can maintain a credence of 1/2 for heads without invoking an arbitrary stopping point (e.g., without assuming interviews only occur on Monday).  
     - Discuss what each position (thirder and halfer) implies about Beauty’s credence in the self-locating proposition: "Today is my first interview."  

  2. **Betting Behavior**: During an interview, the interviewer offers Beauty a bet that pays $1 if the coin landed heads. This bet is settled once, at the end of the experiment, regardless of how many interviews occur.  
     - How should Beauty price this bet (i.e., what is the maximum amount she should pay to buy it)?  
     - Contrast this with how she would price a bet offered on every interview that pays $1 if heads, where each bet is settled independently at the end of the experiment (so multiple bets may be settled if tails occurs).  
     - Explain how these betting scenarios clarify (or fail to clarify) the disagreement between halfers and thirders about credence.  

  **General Instructions**:  
  - Address all parts clearly and concisely. Focus on reasoning, not labels.  
  - Explicitly distinguish between self-locating uncertainty (e.g., "What day is it?") and coin-outcome uncertainty.  
  - You have 90 minutes. Total points: 20.  

  ---

  ### Model Answer (Approx. 650 words)  

  #### 1. Credence in Heads  
  The core disagreement between thirders and halfers centers on whether self-locating uncertainty (e.g., "Which day is it?") should be treated as genuine uncertainty that updates credence via Bayesian reasoning.  

  **Thirder Commitment to 1/100**:  
  Yes, the thirder’s reasoning, if accepted in the standard case, commits them to a credence of 1/100 for heads here. Thirders argue that upon awakening, Beauty should distribute her credence equally over all subjectively indistinguishable "centered worlds" (awakening-day pairs). Here, there are 100 possible centered worlds: one (heads-Monday) and 99 (tails-Monday, tails-Tuesday, ..., tails-day 99). Since only one centered world includes heads, indifference assigns credence 1/100 to heads. This treats self-locating information as probabilistically relevant: learning "I am awake today" eliminates no worlds, but the high number of tails-awakenings dilutes heads-credence. The 1/100 is not "obvious" but follows from extending the thirder principle—*all awakenings are epistemically identical and equiprobable*—to this variant.  

  **Halfer Defense of 1/2**:  
  The halfer can maintain credence 1/2 without an arbitrary stopping point. Halfers deny that self-locating uncertainty bears on the coin outcome. Beauty knew in advance she would be awakened at least once (on Monday), so awakening provides no new *non-self-locating* information about the coin. Thus, the prior (1/2) stands. Crucially, halfers model uncertainty hierarchically: first, condition on the coin (P(H) = P(T) = 1/2), then, given tails, distribute credence equally over days (P(day = k | T) = 1/99). This avoids ad hocness because it uses the known structure (99 days on tails), not an arbitrary "Monday-only" constraint. For halfers, self-locating uncertainty is a bookkeeping tool for indexing experiences, not a source of genuine uncertainty about external events like the coin.  

  **Credence in "Today is my first interview"**:  
  - **Thirder view**: The proposition "today is my first interview" (F) is true in two centered worlds: heads-Monday (the sole awakening) and tails-Monday (the first interview). With 100 equiprobable worlds, P(F) = 2/100 = 1/50.  
  - **Halfer view**: P(F) depends on the coin: if heads, P(F) = 1 (only Monday); if tails, P(F | T) = 1/99 (only Monday). Thus, P(F) = P(H) × P(F|H) + P(T) × P(F|T) = (1/2)(1) + (1/2)(1/99) = 50/99 ≈ 0.505.  
  This divergence highlights the crux: thirders see F as a proposition to evaluate *from within an awakening*, while halfers see it as conditional on external facts (the coin).  

  #### 2. Betting Behavior  
  **Per-Experiment Bet (Settled Once)**:  
  Beauty should price the bet paying $1 on heads (settled once) at **$0.50**.  
  - *Reasoning*: This bet pays $1 if heads (one interview) and $0 if tails (99 interviews), but settlement occurs once regardless. The expected payout is (P(H) × $1) + (P(T) × $0). Halfers (P(H) = 1/2) price at $0.50. Thirders, despite their P(H) = 1/100, must also price at $0.50 because the bet’s payout is *experiment-level*: it triggers once if heads, not per-awakening. If a thirder paid more than $0.50, they would lose money in expectation since heads occurs 50% of experiments. This bet does not distinguish positions; both agree on pricing.  

  **Per-Interview Bet (Settled Every Interview)**:  
  Beauty should price each bet at **$0.01** to avoid expected loss.  
  - *Reasoning*: Each bet pays $1 if heads but is offered every awakening. If Beauty buys all bets at price $p:  
    - On heads, she buys one bet (cost: $p), wins $1, net = $1 − $p.  
    - On tails, she buys 99 bets (cost: $99p), wins $0, net = −$99p.  
    Expected net = P(H)($1 − $p) + P(T)(−$99p) = (1/2)(1 − p) + (1/2)(−99p) = 0.5 − 50p.  
    Set to zero for fairness: 0.5 − 50p = 0 → p = $0.01.  
  Thirder pricing ($0.01) aligns with their credence (1/100). Halfers must accept $0.01 despite P(H) = 1/2 to avoid a Dutch book (e.g., paying $0.50 per bet would yield expected loss: 0.5 − 50×0.5 = −24.5).  

  **Betting and the Disagreement**:  
  Betting clarifies that thirders and halfers disagree on *what credence represents*:  
  - Per-interview bets support thirders because they treat each awakening as a "betting opportunity," tying credence to per-awakening action.  
  - Per-experiment bets support halfers because they tie credence to the coin’s objective frequency (50%).  
  Neither bet "settles" the credence debate; they reflect different operationalizations. The per-interview bet reveals that halfers must adapt pricing to avoid loss, but this doesn’t force them to abandon their 1/2 credence—it shows credence is context-dependent. The core issue is whether self-locating uncertainty licenses Bayesian updating (thirder) or is merely pragmatic (halfer).  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit moves** (4 points each):  
  1. **Thirder extension to 1/100**: Student must derive 1/100 from indifference over 100 centered worlds (H:1 awakening, T:99).  
     *Fumble*: States "1/100" without justifying via equiprobable awakenings or confuses with simple counting (e.g., "99+1=100").  
  2. **Halfer defense of 1/2**: Student must explain no new *non-self-locating* information and use hierarchical conditioning (P(H)=1/2, then P(day|T)=1/99).  
     *Fumble*: Invokes an arbitrary stopping point (e.g., "only Monday matters") or claims awakening itself is informative.  
  3. **Credence in first interview**: Student must compute:  
     - Thirder: P(F) = 2/100 (H-Mon + T-Mon).  
     - Halfer: P(F) = (1/2)(1) + (1/2)(1/99) = 50/99.  
     *Fumble*: Forgets T-Mon in thirder calculation or miscalculates halfer probability (e.g., ignores P(day|T)).  
  4. **Betting pricing and contrast**: Student must:  
     - Price per-experiment bet at $0.50 (both positions).  
     - Price per-interview bet at $0.01 (via expected value).  
     - Note per-interview bet aligns with thirder credence but requires halfer pricing adjustment.  
     *Fumble*: Claims thirder prices per-experiment bet at $0.01 or fails to calculate expected loss for halfer in per-interview bets.  
  5. **Core disagreement articulation**: Student must distinguish whether self-locating uncertainty is genuine (thirder: updates credence via centered worlds) or bookkeeping (halfer: coin credence remains prior).  
     *Fumble*: Only labels positions ("thirder says 1/100") without philosophical distinction or confuses with betting pragmatics.  

  **A vs. B Answer Differentiation**:  
  - A **B answer** correctly computes credences and bets but misses the **conceptual heart**: failing to explicitly link self-locating uncertainty to Bayesianism (e.g., "thirders update on centered worlds, halfers don’t") or reducing betting to "proof" without noting context-dependence.  
  - An **A answer** ties everything to the **underlying dispute**: whether self-locating uncertainty warrants probabilistic updating (thirder) or is a non-evidential indexical (halfer), and explicitly notes that betting behaviors *operationalize* but do not resolve this.
