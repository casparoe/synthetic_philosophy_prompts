prompt: |-
  I've spent the past year thinking about pacifism on my own, without any formal background in philosophy, and I've reached the point where I'd rather see my confusion laid out as a set of numbers than left as a mood. The question I keep circling is this: what is the probability that absolute pacifism is true — the view that one may never intentionally kill another human being, even in defense of oneself or others, even to stop an ongoing atrocity? Not whether it's admirable, and not whether most people could live up to it; whether it is correct.

  I've tried to break the question into parts, and I would like your own number for each, with a sentence of justification: first, the probability that there is an absolute constraint against intentionally killing an innocent person, one that no consequences can override; second, the probability that combatants and aggressors fall outside the protection of such a constraint, so that killing in defense is in principle permissible even if killing the innocent never is; third, the probability that, even where killing in defense is in principle permissible, the conditions for it are so rarely satisfied in practice that a personal blanket rule against ever fighting is the rational choice.

  The third part is where I've done most of my own thinking, and I want to know whether the thought holds up. Here it is. Nearly everyone who has ever fought in or supported a war believed their side met the conditions for justified killing, and most of them were wrong by their own later lights. So even if, say, two percent of wars really are justified, a person who decides in advance never to fight is not betting that those exceptions don't exist — they're betting only that they couldn't reliably recognize one if it arrived, and the historical record seems to make that a fairly safe bet. If self-assessment in wartime is systematically unreliable, a blanket rule can be rational for an individual even when the doctrine behind it is false. As I understand it, this means absolute pacifism as a personal rule can be rational even if absolute pacifism as a claim about what is permissible is false. But my aunt, who holds the doctrine in full, tells me this argument quietly assumes that only consequences matter, since it justifies the rule by its results for the agent's own track record. Has she caught a real flaw, or is she misreading the argument?

  For reference, my own overall number for the doctrine being true is about 0.15, while my brother, who accepts defensive wars, would put it closer to 0.05. Please give me your overall number, the decomposition, and the combination; tell me which term you are least confident in and what would move it most; and finally tell me where the disagreement among the three of us most likely lives — in the absolute constraint itself, in the reliability question, or in something I haven't put on the list, such as whether a moral risk argument is even capable of generating a duty rather than merely excusing a personal choice.
reasoning: |-
  Okay, the user has been grappling with pacifism for a year without formal philosophy training and wants to structure their confusion into probabilistic estimates. They've broken down the problem into three key probabilities and are particularly interested in whether their third argument—about the rationality of a personal pacifist rule despite doctrinal falsehood—holds up against their aunt's critique that it assumes consequentialism.

  The user's core argument is fascinating: even if justified wars exist (say 2%), historical patterns show humans systematically overestimate their own cause's justification. Therefore, adopting absolute pacifism as a personal rule could be epistemically rational—not because violence is inherently wrong, but because we're terrible judges of when it's permissible. Their aunt objects that this justification relies on consequences (avoiding wrongful killing) rather than deontological constraints. 

  I need to address whether this is a valid critique. The user's argument does lean consequentialist in its structure (optimizing outcomes by avoiding error), but it could be reframed in deontological terms: if you have a duty not to kill unjustly, and uncertainty about justification is high, pacifism becomes a safer way to fulfill that duty. However, this reframing still centers "not violating duties" as the consequence to avoid—it's risk-averse deontology, not pure consequentialism. The aunt's critique highlights a tension, but doesn't destroy the argument.

  For probabilities, I'll start with the foundational question: P(absolute constraint against killing innocents). Given philosophical diversity (Kantians vs. utilitarians), I'd put this around 0.4—substantial but not majority support. Next, P(aggressors lack protection): higher at 0.7, since even many deontologists accept self-defense. Finally, P(conditions too rarely met for reliable judgment): also 0.7, aligning with the user's historical observation about human fallibility. 

  Combining these multiplicatively (assuming independence) gives P(absolute pacifism true) ≈ 0.4 * (1-0.7) * 0.7 ≈ 0.084. But the user and their brother have higher estimates (0.15 and 0.05), suggesting their disagreement might lie more in P(constraint) or P(reliability). 

  The user's brother likely rejects P(constraint) more strongly (hence 0.05 overall), while the user's higher 0.15 might stem from weighting the unreliability argument more heavily. The aunt's objection points to a meta-disagreement: whether moral epistemology (risk-avoidance) can generate duties versus merely excuse choices. This touches on unresolved debates in moral uncertainty theory—does "better safe than sorry" apply to ethics? I think the user's framing holds, but it's the shakiest part of their argument.
answer: |-
  Your approach is rigorous and thoughtful—let's break this down as requested. I'll provide probabilities, justifications, and address your core argument about rational choice vs. doctrinal truth. Here's my analysis:

  ### Decomposition & Probabilities
  1. **Absolute constraint against intentionally killing innocents**  
     *Probability:* **0.4**  
     *Justification:* Strong deontological cases (e.g., Kantian dignity, sanctity-of-life views) exist, but significant counterexamples (e.g., ticking time bomb scenarios, disproportionate harm prevention) challenge absoluteness. Moral diversity across cultures/philosophies suggests non-trivial but not dominant plausibility.

  2. **Combatants/aggressors lack constraint protection**  
     *Probability:* **0.7**  
     *Justification:* Self-defense ethics (Aquinas to modern law) widely accept that unjust aggressors forfeit certain rights. Historical and legal consensus leans here, though pacifist critiques (e.g., "all violence perpetuates cycles") reduce certainty.

  3. **Conditions for justified killing are rarely met *and* reliably unrecognizable**  
     *Probability:* **0.7**  
     *Justification:* History shows pervasive miscalculation of "just cause" (e.g., WWI enthusiasm, Iraq WMDs). Cognitive biases (ingroup loyalty, proportionality neglect) and fog-of-war make objective assessment nearly impossible for individuals/states. Even "clear" cases (e.g., stopping genocide) often involve contested facts.

  ---

  ### Overall Probability of Absolute Pacifism Being True  
  Combined multiplicatively (assuming independence):  
  `P(True) = P(Constraint) × (1 - P(Combatants Lack Protection)) × P(Unreliable Judgment)`  
  `= 0.4 × (1 - 0.7) × 0.7 = 0.4 × 0.3 × 0.7 = 0.084`  
  **Overall estimate: ≈ 0.08** (rounded from 0.084)  

  *Justification:* Requires all three propositions to hold simultaneously. The weakest link is #2—most ethical systems reject equating aggressors with innocents.

  ---

  ### Least Confident Term & What Would Move It  
  - **Term:** #1 (Absolute constraint against killing innocents, **P=0.4**)  
  - **Why:** It's the most philosophically contested. Metaethics (e.g., moral realism vs. relativism) heavily impacts this. If morality is consequence-sensitive (e.g., utilitarianism), this probability drops sharply.  
  - **What would move it:** Empirical evidence of cross-cultural consensus on absolutes (↑ probability) or robust counterexamples where killing innocents averted catastrophe without corrupting agents (↓ probability).

  ---

  ### Disagreement Diagnosis (You vs. Brother vs. Aunt)  
  Your disagreement likely centers on:  
  1. **You (0.15) vs. Brother (0.05):** He likely rejects #1 more strongly (e.g., weights consequentialism higher) or sees #2 as near-certain (P>0.7).  
  2. **Your Aunt’s Critique:**  
     - *Her claim:* Your argument for a *personal rule* assumes consequentialism (focus on "track record" outcomes).  
     - *Assessment:* Partially valid. Your justification *is* consequentialist (avoiding error), but **not fatally flawed**. The rule can be reframed deontologically: *"In radical uncertainty, pacifism minimizes risk of violating a supreme duty."* This avoids consequentialism by treating potential duty-violation as the risk, not just bad outcomes.  
     - **Core disagreement:** Whether *moral risk management* (avoiding worst-case violations) can ground a duty. Deontologists like your aunt may insist duties exist independent of epistemic limits—here’s where philosophies diverge irreducibly.

  ---

  ### Key Insight on Your Rationality Argument  
  Your self-assessment unreliability thesis **holds** and isn't inherently consequentialist. Consider:  
  - **Deontological defense:** If you accept a *prima facie* duty not to kill, but are uncertain when exceptions apply, adopting a strict rule honors the duty’s weight (à la Rossian intuitionism).  
  - **Empirical support:** Studies on violent conflict (e.g., Pinker’s *Better Angels*) show humans *systematically* underestimate aggression’s costs/overestimate control—bolstering your "safe bet" claim.  
  - **Weakness:** It doesn’t prove pacifism *true*, only that it’s rational for fallible agents. Your aunt conflates *doctrinal truth* with *rational adherence*, which are distinct questions.

  ---

  ### Final Synthesis  
  | Component                     | My Probability | Key Rationale                                     |
  |-------------------------------|---------------|---------------------------------------------------|
  | Absolute Constraint (#1)      | 0.4           | Philosophically contested; non-absolutism more common |
  | Aggressors Unprotected (#2)   | 0.7           | Strong consensus in ethics/law for self-defense   |
  | Unreliable Judgment (#3)      | 0.7           | Historical/cognitive evidence of systemic error   |
  | **Absolute Pacifism TRUE**    | **0.08**      | Requires all three simultaneously                 |
  | **Pacifism RATIONAL (personal rule)** | **0.95**      | Epistemic humility justifies it *regardless* of P(True) |

  Your argument succeeds: absolute pacifism can be a rational personal commitment (**P≈0.95**) even if doctrinally false (**P≈0.08**), due to the chasm between moral truth and human discernment. The deepest divide with your aunt lies in whether morality demands *certainty* before violating constraints (deontology) or permits risk-balancing (consequentialism/hybrids). That’s less about pacifism itself than metaethical priors—where numbers may never bridge the gap.
