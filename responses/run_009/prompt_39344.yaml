  ### Leaves (Positions) and Their Awkward Commitments  
  Leaves are defined by answer paths. *Awkward commitments* highlight the position’s hardest-to-defend implication.  

  1. **Gene-Level Selectionism**  
     - *Path*: Q1A → Q2B → Q3B → Q6B.  
     - *Awkward commitment*: Must argue that altruism (e.g., sterile workers) is *always* a gene-level "selfish" strategy, even when group structure appears causal.  
     - *Note*: View is inconsistent if Q4A (tumor selection) is chosen—sub-organismal selection requires gene-like units.  

  2. **Organism-Centered Selection**  
     - *Path*: Q1B → Q3B → Q6B.  
     - *Awkward commitment*: Must deny gene-level selection in meiotic drive (Q1B) and explain group effects as byproducts of individual traits.  
     - *Note*: Excludes Q3A (accepting group selection).  

  3. **Multi-Level/Group Selection**  
     - *Paths*:  
       - Q1A → Q2A → Q3A → Q6B (gene+group).  
       - Q1B → Q3A → Q6B (organism+group).  
     - *Awkward commitment*: Must accept that group selection can override individual selection (Q3A) despite individual advantage often prevailing.  
     - *Note*: If Q5A (species selection) is also accepted, this blends into pluralism.  

  4. **Species Selection**  
     - *Path*: Any → Q5A → Q6B.  
     - *Awkward commitment*: Must show species traits (e.g., range size) are heritable and not byproducts of organism traits (Q5A), which is rarely demonstrable.  
     - *Note*: Often combined with multi-level views (indistinguishable without Q6).  

  5. **Pluralism**  
     - *Path*: Any → Q6A.  
     - *Awkward commitment*: Must defend that rival descriptions (e.g., gene vs. group) aren’t contradictory, even when they invoke different causal mechanisms.  

  ---

  ### Indistinguishable Position Pairs  
  The tree **cannot sharply separate** these pairs due to overlapping answer combinations:  
  - **Pluralism vs. Multi-Level Selectionism**: If a reader accepts multiple levels (e.g., Q1A *and* Q3A) but answers Q6B (only one level is fundamental), they align with multi-level selection. If Q6A, they are pluralist. However, in practice, multi-level advocates often accept plural descriptions (blurring Q6).  
  - **Species Selection vs. Pluralism/Multi-Level**: Species selection (Q5A) is often embedded in multi-level frameworks. Only pluralism explicitly elevates it to equal footing (via Q6A).  
  - **Gene-Level vs. Byproduct Views**: If Q2B (sterile workers as gene-level) is chosen, gene-level and pluralism converge unless Q6 distinguishes them.  

  **Why?** Philosophical commitments (e.g., "fundamental level") often hinge on formal machinery (e.g., Price equation partitions) beyond concrete cases. The tree flags these ambiguities in the pluralism node (Q6).  

