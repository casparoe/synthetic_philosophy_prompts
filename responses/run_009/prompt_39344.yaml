  We are building a decision tree that categorizes a reader's position in the units-of-selection debate. The positions we are considering are:
  1. Gene-level selectionism (genes are the primary unit of selection)
  2. Organism-centered selection (organisms are the primary unit)
  3. Multi-level selection (selection acts at multiple levels, including groups)
  4. Group selection (groups are a key unit, perhaps even the primary one in some cases)
  5. Species selection (selection acts at the level of species)
  6. Pluralism (multiple levels are legitimate and not rivals; they are complementary descriptions)

  We have to include concrete cases:
  a) A meiotic drive allele (cheats at meiosis, harming the organism)
  b) Sterile workers in eusocial insects (individual fitness zero, lineage thrives)
  c) Haystack model (group composition affects individual success)
  d) Species-level trait (e.g., geographic range, generation time)
  e) Tumor lineage (competition within a body)

  And we must have a node that distinguishes genuine selection at a level vs. a byproduct (bookkeeping).

  The decision tree must be based on logical space, not historical arguments.

  Let's outline the key questions that separate the positions:

  1. **The first question might be about the meiotic drive allele**: Does natural selection favor the cheating allele? This tests whether selection can act at the gene level independently of the organism.

  2. **The second question might be about the sterile worker**: Can natural selection favor a trait that reduces an individual's fitness to zero? This tests whether selection can act at a group (or colony) level, because the worker's sterility benefits the colony.

  3. **The third question might be about the haystack model**: Can the group composition (e.g., proportion of cooperators) be a cause of differential survival and reproduction of groups? This tests group selection.

  4. **The fourth question might be about the tumor lineage**: Is the tumor lineage undergoing natural selection within the body? This tests selection at the sub-organismal level (somatic cell level).

  5. **The fifth question might be about the species-level trait**: Can natural selection act on traits that are properties of entire species (like geographic range) leading to differential speciation or extinction? This tests species selection.

  6. **The byproduct question**: We need a question that forces the reader to confront whether a phenomenon is due to selection at a higher level or merely a byproduct of selection at a lower level. For example, in the sterile worker case, is the worker's sterility a result of group selection or a byproduct of gene selection (via kin selection)?

  However, note that the positions are not mutually exclusive in all cases. Pluralism, for instance, would accept multiple levels.

  We must design the tree so that each node is a question about a concrete case, and the reader can answer without knowing the implications.

  Let's sketch the tree:

  Start: Natural selection occurs and favors the fit.

  Question 1 (Meiotic drive allele):
     In a population of organisms, an allele arises that during meiosis causes itself to be included in more than half the gametes, but this reduces the overall reproductive success of the organism carrying it. Over generations, what happens to the frequency of this allele?
     A) The allele increases in frequency because it is better at getting into gametes (gene-level advantage).
     B) The allele decreases in frequency because the organisms carrying it are less fit (organism-level disadvantage).

  This question separates gene-centric views from others. If you choose A, you are acknowledging gene-level selection. If B, you are thinking at the organism level.

  But note: a pluralist might accept both, but we are forcing a choice of what is happening in this case.

  Question 2 (Sterile workers):
     In a eusocial insect colony, sterile workers do not reproduce but help the queen reproduce. How can natural selection favor the evolution of sterility?
     A) Because the colony as a whole produces more offspring when it has sterile workers, so colonies with sterile workers outcompete colonies without (group-level selection).
     B) Because the genes for sterility are passed on by the queen (the sterile worker's close relative), so the genes spread by helping relatives (gene-level selection, kin selection).

  This is the byproduct question: is the sterility a result of group selection or a byproduct of gene selection (via inclusive fitness)?

  Question 3 (Haystack model):
     Imagine a population where individuals form temporary groups (like haystacks). In some groups, there are many cooperators and the group does well; in others, there are many cheaters and the group does poorly. Over time, what happens to the frequency of cooperators?
     A) The frequency of cooperators increases because groups with more cooperators produce more offspring (group selection).
     B) The frequency of cooperators decreases because within any group, cheaters have higher fitness (individual selection), and group benefits don't outweigh that.

  This tests whether group selection can overcome individual selection.

  Question 4 (Tumor lineage):
     Within an organism, a lineage of tumor cells arises that divides rapidly and evades the immune system. Over the lifetime of the organism, what happens to the tumor cell lineage?
     A) The tumor lineage is undergoing natural selection at the cellular level: the cells that are better at dividing and evading the immune system become more common in the tumor (sub-organismal selection).
