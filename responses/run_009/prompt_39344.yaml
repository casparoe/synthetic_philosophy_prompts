  Below is a logically structured decision tree for the units-of-selection interactive feature. It uses concrete cases to guide readers through the logical space, avoiding historical references or slogans. Each branch point forces a choice about *what happens* in a specific biological scenario, and leaves are labeled with positions based on the combination of answers. The tree includes all requested cases (meiotic drive, sterile workers, haystack group effects, species traits, tumors) and a node explicitly addressing the "byproduct vs. genuine selection" distinction.  

  ### Key Design Notes:
  - **Logical Structure**: Questions are ordered to isolate core disagreements: gene vs. organism primacy (Q1), group selection vs. byproduct (Q2), group efficacy (Q3), sub-organismal selection (Q4), species selection (Q5), and pluralism (Q6).
  - **Unattested Views**: Some answer combinations are incoherent/unattested (noted in leaves). For example, denying gene-level selection in meiotic drive (Q1B) but accepting sub-organismal selection in tumors (Q4A) is logically inconsistent (tumor selection implies gene-like competition).
  - **Indistinguishable Positions**: Some leaves map to multiple named positions (e.g., pluralism vs. multi-level selectionism). The tree flags these and explains why they blur.
  - **Reader-Friendly**: Questions describe cases without jargon. Answers focus on outcomes (e.g., "frequency increases/decreases") rather than mechanisms.

