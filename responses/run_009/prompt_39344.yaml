  ### Decision Tree

  **Start**: You accept natural selection occurs and favors traits that enhance fitness.  

  **Question 1: Meiotic Drive Allele**  
  An allele cheats during meiosis, ensuring it appears in >50% of gametes. This reduces the reproductive success of the organism carrying it. Over generations:  
  - **A) The cheating allele increases in frequency** (it outcompetes other alleles in the organism).  
  - **B) The cheating allele decreases in frequency** (organism fitness loss outweighs meiotic advantage).  

  **Branch from Q1A (Allele increases)**:  
  **Question 2: Sterile Workers in Eusocial Insects**  
  Sterile worker ants have zero personal reproduction but enhance their colony's reproduction. The sterility trait persists because:  
  - **A) Colonies with sterile workers outcompete colonies without them** (group advantage).  
  - **B) Sterility genes spread by helping the queen reproduce** (she passes copies to offspring).  

  **Branch from Q1B (Allele decreases)**:  
  **Question 3: Haystack Model**  
  Mice form isolated groups ("haystacks"). In groups with many cooperators (who share food), all mice thrive and produce more offspring. In groups with many cheaters (who hoard food), reproduction declines. After many generations:  
  - **A) Cooperators increase in frequency** (group benefits outweigh individual costs).  
  - **B) Cheaters increase in frequency** (within-group advantage dominates).  

  **Branch from Q2A (Group advantage for workers)**:  
  **Question 3: Haystack Model** (Same as above)  

  **Branch from Q2B (Genes spread via queen)**:  
  **Question 4: Tumor Lineage**  
  A tumor cell lineage evolves within a human body: cells resist immune attacks and divide rapidly. Over the patient’s lifetime:  
  - **A) Tumor cells undergo selection** (fit variants dominate the tumor).  
  - **B) Tumor cells do NOT undergo selection** (this is just disease progression, not evolution).  

  **Branches from Q3A (Cooperators increase in haystack)**:  
  **Question 4: Tumor Lineage** (Same as above)  

  **Branches from Q3B (Cheaters increase in haystack)**:  
  **Question 5: Species-Level Trait**  
  Clam species with larger geographic ranges rarely go extinct. Over millions of years:  
  - **A) Range size causes species-level selection** (range is a heritable species trait).  
  - **B) Range size is a byproduct** (e.g., from individual clam dispersal traits).  

  **All branches converge for final question**:  
  **Question 6: Pluralism Check**  
  In cases like eusocial insects, the same outcome (sterile workers) can be described as:  
  - **A) Group selection OR gene-level selection** (both are valid perspectives).  
  - **B) Only one is fundamental** (the other is a byproduct or misdescription).  

