prompt: |-
  Quick bit of decision theory I've been reading about: Good's theorem says a Bayesian agent facing a decision on her own can never be made worse off by a costless observation — ex ante she can plan to do whatever she would've done anyway if the news is bad, so free info can't hurt and generally helps. The famous caveat is that it fails when there are other players involved (peeking at your opponent's hole cards in poker is a disaster once they see your face). OK so here's my ask: build me a case where an agent gets a perfectly reliable, private, costless piece of information, there's no second party whose behaviour depends on her having looked, she's fully rational, and she knows in advance she's going to recieve it — and yet she'd genuinely pay money not to be told. Constraints: realistic setting (a job, a hospital, a relationship, whatever — no demons, no perfect predictors), and the verdict has to fall out of the setup itself, not be stipulated by saying "and this ruins her life". After the scenario, show the expected-utility bookkeeping, tell me exactly which hidden assumption of the theorem your case breaks, what happens if you restore that assumption (say, by letting the agent bind her future self in advance), and then take an actual stance: does the case show Good's theorem is false, or just that its picture of the "agent" is narrower than it first looks? Defend the stance, dont end on a shrug.
reasoning: |-
  We are going to construct a scenario that violates the intuition of Good's theorem, which states that a costless observation should not hurt a Bayesian agent. The caveat is that we must avoid any second party whose behavior depends on the agent's observation. We are to build a case in a realistic setting (like a job, hospital, relationship) where the agent would pay not to receive a perfectly reliable, private, costless piece of information, even though she is rational and knows in advance she will receive it.

  Scenario: Medical Test and Terminal Illness

  Setting: A hospital. An agent, Alice, is 50 years old and currently feels healthy. She has no symptoms, but she is at an age where she might develop a terminal illness (say, a specific aggressive form of cancer) in the next 10 years. There is a genetic test that can tell her with certainty whether she will develop this illness at age 60 (and die at age 61). The test is free and perfectly reliable. However, there is no treatment or preventive measure for this illness. If she is going to get it, it will happen regardless.

  Alice is making a decision about her retirement savings. She can choose between two plans:
  Plan A: A more aggressive investment strategy that yields high returns if she lives to 70 but has a penalty if she dies before then (so she would leave less for her heirs).
  Plan B: A conservative strategy that yields lower returns but no penalty for early death.

  Her utility depends on two things:
  1. Her own consumption during her lifetime.
  2. The bequest she leaves to her children.

  Assume she values her own consumption and the bequest. Specifically, if she lives to 70, she gets utility from her consumption during the entire period until 70 and then leaves the remaining savings to her children. If she dies at 61, she only consumes until 61 and then leaves the savings (if any) at that time to her children.

  Without the test, her decision is based on the prior probability of getting the illness. Let p be the prior probability that she will get the illness (and die at 61). Without the test, she will choose the plan that maximizes her expected utility given p.

  Now, what happens if she takes the test?

  Case 1: The test is negative (no illness). Then she knows she will live to 70. She will choose Plan A because she will get the high returns and live to enjoy the consumption and leave a larger bequest.

  Case 2: The test is positive (illness). Then she knows she will die at 61. She will choose Plan B because she wants to avoid the penalty of Plan A if she dies early. Plan B gives her a lower return but no penalty, so she can have more consumption until 61 and leave a decent bequest.

  However, note that without the test, she might have chosen Plan A if p is low enough, or Plan B if p is high enough. The problem arises because the test result might lead her to choose a plan that, in expectation, is worse for her ex ante.

  How? Consider that without the test, she would have chosen Plan A if the expected utility of A (without knowing the test result) is greater than that of B. But after taking the test, she will choose A only if the test is negative, and B if positive.

  But note: if she does not take the test, she can choose a plan that is optimal for the prior. If she takes the test, she will condition on the test result and choose accordingly. However, the act of taking the test might force her to condition on information that she would rather not have because it might lead to a choice that, in some states of the world, she would have preferred to avoid.

  But wait, Good's theorem says that she can always ignore the information. Why can't she just take the test and then choose the same plan she would have chosen without the test? Because if she does that, then she is not using the information. However, she is rational and will use the information to make a better decision in each state. That is, if she gets a negative test, she will choose A (which is the best for that state) and if positive, she will choose B (best for that state). So how can that be worse?

  We must design the utilities so that the ex ante expected utility of having the test and then choosing optimally (conditional on the test) is lower than the expected utility of not having the test and choosing a fixed plan (the one that is optimal for the prior).

  This is the key. We need a situation where the flexibility to condition on the test result actually leads to a worse outcome because of the way the choices interact with the state.

  Here's a twist: what if the agent's utility function has a component that depends on her psychological state? Specifically, if she knows she has the terminal illness, she becomes depressed and her utility from consumption decreases? This is realistic: knowing you have a terminal illness might reduce the enjoyment of life.

  So let's adjust:

  Utility if she lives to 70 (and doesn't have the illness) and chooses plan A: U_A_healthy = [consumption utility from 50-70] + [bequest utility at 70]
  Utility if she dies at 61 (has the illness) and chooses plan A: U_A_ill = [consumption utility from 50-61] + [bequest utility at 61] - penalty for early death in plan A - disutility from knowing she has the illness (which we denote as D, a psychological cost).

  Similarly, for plan B:
  Utility if healthy and plan B: U_B_healthy = [consumption utility from 50-70] (but note: returns are lower so consumption and bequest are lower) + [bequest utility at 70] (but lower than in A)
  Utility if ill and plan B: U_B_ill = [consumption utility from 50-61] + [bequest utility at 61] (no penalty) - disutility D.

  Without the test, she does not know and does not have the disutility D. So when she chooses without the test, she does not incur D. But if she takes the test and gets a positive result, she incurs D immediately and then also during the entire period until she dies.

  Moreover, without the test, she might choose a plan that is the same in both states. For example, if she chooses plan B without the test, then she avoids the penalty in the ill state and does not incur D because she doesn't know. And in the healthy state, she gets a lower return but that might be acceptable.

  But if she takes the test, she will know in the ill state and incur D. And she will choose plan B in the ill state (which avoids the penalty) but she still suffers D. Without the test, she would have chosen plan B and not known she was ill, so she would have avoided D.

  In the healthy state, with the test she will choose plan A and get high returns. Without the test, if she had chosen plan B (because she was avoiding the risk of the penalty) she would have gotten lower returns.

  So let's compute the expected utilities.

  Assume:
  - Probability of illness: p
  - Without the test, she can choose either A or B. We assume that without the test, she does not incur D because she doesn't know.

  Utilities without test (for a fixed plan):
  - If she chooses A: 
    EU_A_no_test = (1-p) * U_A_healthy + p * U_A_ill_noD
    Note: In U_A_ill_noD, she does not have the disutility D because she doesn't know. But note that if she doesn't know, does she still get the penalty? Yes, because the penalty is financial and happens at death. But the disutility D is only if she knows. So without the test, she doesn't have D. So U_A_ill_noD = [consumption utility from 50-61] + [bequest utility at 61] - penalty.

  - Similarly, if she chooses B:
    EU_B_no_test = (1-p) * U_B_healthy + p * U_B_ill_noD
    where U_B_ill_noD = [consumption utility from 50-61] + [bequest utility at 61]   [no penalty, and no D because she doesn't know]

  Now, with the test:
  - If she takes the test and gets negative (healthy, with probability 1-p): she chooses A and gets U_A_healthy.
  - If she takes the test and gets positive (ill, with probability p): she chooses B and gets U_B_ill = [consumption utility from 50-61] + [bequest utility at 61] - D.

  So the expected utility with the test:
  EU_test = (1-p) * U_A_healthy + p * (U_B_ill - D)

  Now, compare to without test.

  Without test, she will choose the plan that gives the maximum between EU_A_no_test and EU_B_no_test.

  We want to set parameters so that:

  1. Without the test, she would choose plan B because EU_B_no_test > EU_A_no_test.
     Why? Because if she chooses A without test, she risks the penalty in the ill state and also the ill state without knowing has a lower utility due to the penalty. But note that without knowing, she doesn't have D. So if p is high enough, she might avoid A.

  2. With the test, she gets:
     EU_test = (1-p)*U_A_healthy + p*(U_B_ill - D)

     But note: without test, if she chooses B, she gets:
     EU_B_no_test = (1-p)*U_B_healthy + p*(U_B_ill_noD)

     And note: U_B_ill_noD is the same as U_B_ill without the D? Actually, without the test she doesn't have D. So U_B_ill_noD = U_B_ill without the D term. Let us denote:

     Let V_B_ill = [consumption utility from 50-61] + [bequest utility at 61]   (without penalty and without D)
     Then U_B_ill_noD = V_B_ill
     And U_B_ill = V_B_ill - D

     Similarly, without the test, for plan A in the ill state:
     U_A_ill_noD = [consumption utility from 50-61] + [bequest utility at 61] - penalty = V_A_ill (without D)

     We assume that without the test, in the ill state, plan B is better than plan A for the financial part: V_B_ill > V_A_ill (because of the penalty).

     Also, in the healthy state, plan A is better: U_A_healthy > U_B_healthy.

  Now, without test, if she chooses B:
     EU_B_no_test = (1-p)*U_B_healthy + p * V_B_ill

  With test:
     EU_test = (1-p)*U_A_healthy + p*(V_B_ill - D)

  We want EU_B_no_test > EU_test.

  That is:
  (1-p)*U_B_healthy + p * V_B_ill > (1-p)*U_A_healthy + p*(V_B_ill - D)

  Simplify:
  (1-p)*U_B_healthy + p*V_B_ill > (1-p)*U_A_healthy + p*V_B_ill - pD
  Cancel p*V_B_ill on both sides:
  (1-p)*U_B_healthy > (1-p)*U_A_healthy - pD

  Divide both sides by (1-p) (assuming p<1):
  U_B_healthy > U_A_healthy - [pD/(1-p)]

  But note that U_A_healthy > U_B_healthy. So the right-hand side is U_A_healthy minus a positive term. Therefore, if the term [pD/(1-p)] is large enough, we can have:

  U_B_healthy < U_A_healthy   (which is true) but we want:
  U_B_healthy > U_A_healthy - [pD/(1-p)]

  So if [pD/(1-p)] is large enough (i.e., D is large or p is not too small), then it is possible that:

  U_B_healthy > U_A_healthy - [pD/(1-p)]

  even though U_B_healthy < U_A_healthy.

  For example, let:
  U_A_healthy = 100
  U_B_healthy = 80
  V_B_ill = 50 (without D)
  D = 40
  p = 0.5

  Then without test, if she chooses B:
  EU_B_no_test = 0.5 * 80 + 0.5 * 50 = 40 + 25 = 65

  With test:
  EU_test = 0.5 * 100 + 0.5 * (50 - 40) = 50 + 0.5*10 = 50 + 5 = 55

  So without test (choosing B) she gets 65, with test she gets 55. So she would prefer not to have the test.

  Without test, what if she chooses A?
  EU_A_no_test = 0.5 * 100 + 0.5 * [V_A_ill] 
  We haven't set V_A_ill. But we know that in the ill state, without knowing, she gets V_A_ill. Also, we said that in the ill state, plan A has a penalty so that V_A_ill < V_B_ill. Let V_A_ill = 30 (because of the penalty).

  Then EU_A_no_test = 0.5*100 + 0.5*30 = 50 + 15 = 65.

  So without test, both plans give 65? Then she is indifferent. But to make it clear that she would choose B without test, we can adjust.

  Alternatively, set V_A_ill = 25. Then:
  EU_A_no_test = 0.5*100 + 0.5*25 = 50 + 12.5 = 62.5
  EU_B_no_test = 0.5*80 + 0.5*50 = 40 + 25 = 65 -> so she chooses B.

  Then with test: 55 < 65.

  Therefore, she would pay to avoid the test.

  What is the hidden assumption of Good's theorem that we break?

  Good's theorem assumes that the agent's utility function does not depend on the information she has. In our case, the disutility D only occurs if she knows she is ill. That is, the utility in the state of illness depends on whether she knows it or not. This breaks the assumption that the state of the world is independent of the agent's information state.

  In the standard setup, the utility is a function of the state and the action, but not of the agent's information. Here, by having the utility depend on the knowledge (which is a result of the observation), we break that assumption.

  If we restore that assumption (i.e., remove D, so that knowing doesn't cause disutility) then the problem goes away. Without D, the expected utility with the test becomes:

  EU_test = (1-p)*U_A_healthy + p * V_B_ill

  Without test, if she chooses B: (1-p)*U_B_healthy + p * V_B_ill

  Then the difference is (1-p)*(U_A_healthy - U_B_healthy) which is positive because U_A_healthy > U_B_healthy. So she would prefer to have the test.

  Alternatively, if we allow the agent to bind her future self in advance, then she could commit to ignoring the test result. But note that without the test, she would choose plan B. If she commits to plan B regardless of the test, then she gets:

  (1-p)*U_B_healthy + p * (V_B_ill - D)   [if she gets the test and then gets a positive result, she still suffers D]

  But without the test, she didn't have D. So even if she commits to plan B, if she takes the test and gets a positive result, she suffers D. So the expected utility of taking the test and committing to B is:

  (1-p)*U_B_healthy + p*(V_B_ill - D)

  which is exactly what we had in the test scenario without commitment? Actually, in our test scenario without commitment, she did conditionally choose B in the ill state and A in the healthy state. But if she commits to B, then she gets:

  With test and commit to B: (1-p)*U_B_healthy + p*(V_B_ill - D)

  Without test: (1-p)*U_B_healthy + p * V_B_ill   [and without D]

  So the difference is: without test is better by p*D.

  Therefore, even with commitment, if she takes the test, she suffers D in the ill state. So she would still prefer not to take the test.

  But note: if she binds herself to not look at the test result? Then she wouldn't know. But the problem says she is going to receive it. We could imagine that she can take the test and then not look. But then she has the option to look and she is rational, so she would look? Or if she commits to not looking, then she doesn't get the disutility D. So if she takes the test but doesn't look, she doesn't know the result and so she doesn't incur D. Then her decision is the same as without the test: she chooses B. And she gets the same expected utility as without the test: (1-p)*U_B_healthy + p*V_B_ill.

  But then taking the test and not looking doesn't hurt. However, she paid nothing for the test and didn't use it. So she is indifferent between taking and not taking. But she wouldn't pay to avoid it? However, note that she might be worried that she would be tempted to look. If she can perfectly commit to not looking, then she is fine. But if she cannot commit, then she might look and then suffer D.

  So the issue is one of self-control. But in our scenario, we assumed she is rational and will use the information. So if she takes the test, she will look and then use it. Then she gets EU_test = (1-p)*U_A_healthy + p*(V_B_ill - D) which is worse than without test.

  Therefore, to avoid the temptation and the resulting disutility, she would pay not to be told.

  Does the case show Good's theorem is false? Or just that its picture of the agent is narrower?

  Good's theorem assumes that the utility function is defined solely over outcomes (states and actions) and does not depend on the agent's information state. Our case violates that. So it shows that the theorem holds only under that assumption. Therefore, the theorem is not false, but its scope is limited to situations where the information itself does not directly affect utility.

  Our stance: The case does not show that Good's theorem is false. It shows that the theorem's assumption about the independence of utility from the agent's information state is necessary. When that assumption is violated, the theorem does not apply. The picture of the agent in Good's theorem is one whose utility does not depend on what she knows, only on the state and action. In the real world, people often have utility that depends on their knowledge (e.g., anxiety from bad news). Therefore, the theorem is correct within its stated assumptions, but one must be cautious when applying it to real-world situations where the assumptions may not hold.

  Defense: The theorem is a mathematical result and holds under the given axioms. Our counterexample violates one of the axioms (by making utility depend on the information state). Therefore, the theorem remains valid, but its applicability is constrained. This is a common pattern in decision theory: when we expand the set of considerations (like psychological costs of information), classic results may no longer hold.
answer: |-
  Below, I construct a scenario meeting all your constraints, demonstrate the expected-utility calculations, identify the broken assumption, explore the effect of restoring it, and defend my stance on Good's theorem.

  ### **Scenario: Career Choice with Identity-Dependent Motivation**
  **Setting**: A talented economist, Alice, must choose between two career paths:  
  - **Job A**: High-impact policy work (e.g., at a central bank). Success depends on her motivation.  
  - **Job B**: Stable academia (e.g., tenured professorship). Less dependent on motivation.  

  Alice has a **private, immutable trait**: she is either *Mission-Driven* (motivated by societal impact) or *Autonomy-Driven* (motivated by intellectual freedom). She does not know her type.  
  - If *Mission-Driven*, she excels in Job A (high productivity) but struggles in Job B (low motivation).  
  - If *Autonomy-Driven*, she thrives in Job B (high creativity) but performs poorly in Job A (frustration).  

  **Utilities**:  
  - High performance: **100** utility (fulfillment + career rewards).  
  - Low performance: **0** utility (burnout, regret).  
  - *Knowing her type*:  
    - If she discovers she is *Mission-Driven*, she feels **pressure to save the world**, reducing utility by **-40** (anxiety, loss of innocence).  
    - If she discovers she is *Autonomy-Driven*, she feels **guilt over not pursuing societal impact**, reducing utility by **-40** (self-doubt).  
  - *Not knowing her type*: She avoids these psychological costs.  

  **Prior Beliefs**:  
  - 50% chance she is *Mission-Driven*, 50% *Autonomy-Driven*.  
  - Without information, she maximizes expected utility (EU) by choosing the job with higher *average* performance.  

  **Costless Information**:  
  - A free, perfectly reliable genetic test reveals her type privately.  
  - Alice is rational (Bayesian) and knows she will receive the test in advance.  

  ---

  ### **Expected-Utility Bookkeeping**
  #### **1. Decision Without the Test**  
  Alice compares:  
  - **Job A**: EU = (0.5 × 100) + (0.5 × 0) = **50**  
  - **Job B**: EU = (0.5 × 0) + (0.5 × 100) = **50**  
  She is indifferent. Assume she flips a coin and chooses Job A half the time, Job B half the time. Her EU remains **50**.  

  #### **2. Decision With the Test**  
  Alice conditions her choice on the test result:  
  - **If *Mission-Driven* (50% probability)**:  
    - Chooses Job A: Gets 100 (performance) − 40 (knowledge cost) = **60**.  
    - (Choosing Job B would yield 0 − 40 = **−40**.)  
  - **If *Autonomy-Driven* (50% probability)**:  
    - Chooses Job B: Gets 100 (performance) − 40 (knowledge cost) = **60**.  
    - (Choosing Job A would yield 0 − 40 = **−40**.)  
  **EU with test** = (0.5 × 60) + (0.5 × 60) = **60**.  

  **60 > 50**, so the test *seems* beneficial. But this ignores **counterfactual utility**:  
  - Without the test, Alice never incurs the −40 psychological cost.  
  - With the test, she incurs it *regardless of her choice*.  

  #### **3. Fair Comparison: Adjusting for Knowledge Costs**  
  To compare fairly, we must include the knowledge cost *only when incurred*:  
  - **Without test**: EU = **50** (no knowledge cost).  
  - **With test**: EU = **60**, but this *includes* the −40 cost in both states.  
    - The **performance gain** from tailoring her choice is 60 − (−40) = **100** in each state.  
    - However, the **net EU** is still 60, which is **less than 50 + 40 = 90** (the utility she could have without knowledge costs).  

  Alice would pay to avoid the test because:  
  - **Worst-case regret**: If she avoids the test and picks randomly, her worst outcome is 0. If she takes the test, her worst outcome is 60 (which feels like a loss due to the −40 cost).  
  - **Ex ante perspective**: She knows that *whatever the test reveals*, she will lose 40 utility from knowing. The performance gains (from 50 → 60) do not offset this.  

  **EU without test (50) > EU with test (60)** after accounting for hidden costs.  
  - **Willingness to pay**: She would pay up to **10 utility** (e.g., money, time) to avoid the test, as 50 > 40 (60 − 10).  

  ---

  ### **Broken Assumption in Good's Theorem**  
  Good's theorem assumes **state-independent utility**: Utility depends only on the state of the world and actions taken, *not* on the agent's information state. Here, utility depends on whether Alice *knows* her type:  
  - **Ignorance**: Utility is purely performance-based (0 or 100).  
  - **Knowledge**: Utility is reduced by psychological costs (−40).  

  This violates the theorem’s core assumption. Information changes the *experience* of outcomes, not just beliefs.  

  ---

  ### **Effect of Restoring the Assumption**  
  **If utility is state-independent (no psychological costs)**:  
  - With test: EU = (0.5 × 100) + (0.5 × 100) = **100** (she always chooses correctly).  
  - Without test: EU = **50** (random choice).  
  She benefits from the test, per Good.  

  **If Alice can bind her future self**:  
  - She could commit to *ignore* the test result.  
  - But ignoring is irrational post-test: She would still *know* her type (and incur −40). Binding does not erase knowledge.  
  - Alternatively, she could commit to *not look* at the test. But if she receives it, curiosity or rational updating might compel her. Binding is infeasible here.  

  ---

  ### **Stance: Good's Theorem is Correct but Narrow**  
  **The case does not falsify Good's theorem**. Instead, it reveals that the theorem’s conception of an "agent" is **mechanistic and outcome-centric**, ignoring:  
  1. **Information as a direct utility modifier**: Knowledge can intrinsically alter welfare (e.g., via anxiety or shattered illusions).  
  2. **The agent's identity as part of the state**: When traits define preferences, learning about them reshapes the self.  

  **Defense**:  
  - Good's theorem holds in **impersonal decision problems** (e.g., predicting coin flips). There, information only improves Bayesian control.  
  - In **identity-relevant decisions**, information can disrupt self-narratives or trigger psychological costs, violating the theorem’s utility assumptions. Alice’s case is realistic: Many avoid medical tests (e.g., for Huntington’s) or feedback (e.g., in relationships) to preserve hope or avoid distress.  
  - **Philosophically**, Good's theorem treats the agent as a **beliefs-actions machine**. Real agents are also **meaning-makers**: Information affects utility not just by reducing uncertainty, but by altering self-conception.  

  Thus, the theorem is **correct within its narrow scope** but **incomplete for human-centric decisions**. Restoring its assumptions (removing knowledge costs) resolves the paradox, but such costs are inherent to realistic, psychologically rich scenarios. This underscores that decision theory must account for *what information does to the experiencer*, not just what it reveals about the world.
