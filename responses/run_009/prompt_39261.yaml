prompt: |-
  So I've got this folder of cases where you get paid for having a disposition or intention, plus my gut verdicts on each, and I honestly can't tell if there's a principle behind them or if I'm just inconsistent. Here's the set:

  Kavka's toxin, the original setup: a billionaire pays me $1M this afternoon iff at noon I intend to drink a toxin tomorrow that'll make me sick for a day (no lasting damage). Tomorrow, drinking gets me nothing extra — the money's mine either way once I've collected it. My verdict: I can't get the million. At noon I can say the words, but I won't genuinely intend, because I know that at the moment of truth drinking will be pointless.

  Newcomb, standard version: two boxes, box A has $1k in it, box B has $1M in it iff the predictor, yesterday, predicted I'd take only B. Gut verdict: one-box, easy.

  Newcomb except the "predictor" is my old roommate, who knows me scary well but isn't infallible — call it 90% accurate. Gut: still one-box, though I'm less sure of myself here.

  The night before a party where there'll be cake I shouldn't eat (say I'm pre-diabetic), I resolve not to touch it, knowing full well that at the party future-me will want that cake badly and will regret the resolve on the spot. Gut: resolving now is rational, and what's more I can actually do it — the resolve is real, not just words.

  Same toxin deal as the first one, but I know something about myself: once I genuinely form a plan I'm pathologically unable to abandon it. Never once in my life have I dropped a plan I'd really committed to, and I kind of hate this about myself, but there it is. This is the case I keep going back and forth on — do I get the million or not? My gut switches depending on the day, so please don't skip it.

  Exam week: I have my brother change my streaming passwords so I can't waste evenings on shows. Gut: obviously rational, and it works precisely by removing the choice rather than by my intending well.

  So, questions. Is there one principle that captures verdicts 1 through 6? If so, what does it say about case 7, the roommate-predictor one, and the flip-flopping one? Also, does the principle explain the awkward combo that I one-box in 2 but refuse the million in 1, even though both reward a present state of me (a choice in one case, an intention in the other) that the payoff-setter keyed on earlier? If you'd have to overturn one of my verdicts to get a clean principle, tell me which one and why that one rather than the others — I'd rather lose a verdict than recieve a principle stitched together with epicycles. And last thing, there's a variant I haven't listed where the billionaire pays the $1M for the intention but offers an extra $10k if I actually follow through and drink. My gut says this is somehow a differant deal and I can maybe get the $1,010,000, but I can't articulate why. What does your principle predict there, and is my gut right?
reasoning: |-
  Okay, let me try to unpack this user's problem. They've presented several thought experiments involving dispositions or intentions leading to payoffs, along with their gut verdicts. The main challenge is figuring out if there's a consistent principle behind these judgments or if they're just inconsistent.

  First, looking at the cases. Kavka's toxin puzzle (Case 1) is classic—can't form the intention because there's no incentive to follow through. Newcomb (Case 2) is straightforward one-boxing. The roommate predictor at 90% (Case 3) still leans toward one-boxing. The pre-diabetic cake resolution (Case 4) feels rational because it's about precommitment. The pathological planner variant (Case 5) is tricky—maybe here the intention is formable? Password change during exams (Case 6) is clearly rational through external constraint.

  The user's core tension: Why one-box in Newcomb (rewarding a choice keyed to past prediction) but refuse the toxin million (rewarding an intention)? Also, why does adding $10k for drinking (variant) suddenly make it feel achievable?

  Hmm... the key might be distinguishing between:
  - Intentions that require future irrationality (toxin baseline: no reason to drink)
  - Choices that reveal something about your disposition (Newcomb: one-boxing signals you're the type who gets $1M)
  - External precommitments that bypass intention (password change)

  For the pathological planner case (Case 5), the user's flip-flopping makes sense. If you *know* forming the intention = binding action, then maybe you can form it—but is that rational or just a quirk? The principle should probably treat this as an exception (since most people aren't like this) or note that the pathology acts as an external constraint.

  The $10k variant changes everything: now there's *actual* incentive to drink, so forming the intention becomes possible. That explains the gut feeling shift.

  So the unifying principle could be: You get paid if either (a) the payoff is for a state that naturally leads to the rewarded outcome (e.g., one-boxing disposition causes $1M), or (b) you can rationally precommit externally. The toxin fails because the intention doesn't naturally cause drinking when the time comes—unless there's extra incentive ($10k) or a personal pathology (Case 5).

  For Case 5, the principle might say: If your psychology makes intentions irrevocable (effectively turning them into external constraints), then yes, you get the million. But since this isn't standard, the user's hesitation is warranted.

  Would this overturn any verdicts? Probably not—just clarifies that Case 5 is a special case where intention = precommitment due to personal quirk. The roommate Newcomb (Case 3) still holds: even at 90%, one-boxing remains rational if the predictor is good enough (as long as P(predictor correct) > $1M/($1M+$1k), which it is).

  Final note: The user's struggle with "awkward combo" (Cases 1 vs 2) is resolved by outcome-dependence. Newcomb rewards a *disposition* that causes both prediction and action; toxin rewards an *intention* that doesn't cause the action (absent extra factors). Different causal structures!
answer: |-
  Your gut verdicts are deeply insightful and more consistent than you think! The unifying principle is **outcome-dependent rationality**: You can rationally form a disposition or intention **iff** doing so (1) *causes* a desirable outcome that wouldn't occur otherwise, or (2) *is itself* a desirable outcome. Where this fails, you cannot form the intention rationally. Let's break it down:

  ---

  ### **Your Cases Analyzed**
  1. **Kavka's Toxin (original)**  
     - **Principle**: Forming the intention doesn't *cause* the $1M (you get paid for the *intention alone*). Drinking the toxin provides no benefit.  
     - **Verdict**: **Can't get the million**. Correct. No outcome depends on drinking, so intention is irrational.  
     - *Why?* At noon, you know drinking is pointless → no reason to intend → no genuine intention.

  2. **Newcomb (infallible predictor)**  
     - **Principle**: One-boxing *causes* Box B to contain $1M. Your choice *today* determines the predictor's *past action*.  
     - **Verdict**: **One-box**. Correct. Forming the disposition ("I'll one-box") causes the $1M to exist.  

  3. **Newcomb (90%-accurate roommate)**  
     - **Principle**: Same as above. If your one-boxing disposition *causes* a 90% chance of $1M (vs. 10% if you two-box), it's rational.  
     - **Verdict**: **One-box**. Correct. Outcome (expected $900k) depends on your disposition.  

  4. **Pre-diabetic cake resolve**  
     - **Principle**: Resolving *now* causes a better outcome (avoiding cake) by constraining future choice. The resolve *is* the desirable outcome (health-preserving state).  
     - **Verdict**: **Rational and doable**. Correct. The resolution changes your future incentives (e.g., guilt, commitment) or removes options (e.g., avoiding parties).  

  5. **Toxin + Pathological Planner**  
     - **Principle**: If forming the intention *irrevocably binds you* to drink, then intending *causes* the $1M. The pathology acts as a precommitment device.  
     - **Verdict**: **You get the million**. (Overturns your flip-flop!)  
       - Why? Your "planning lock-in" makes the intention *cause* the drinking. Since the $1M requires only intention, forming it = guaranteed payoff.  

  6. **Exam week password change**  
     - **Principle**: Removing the option *causes* a better outcome (studying). No intention needed—it's *external precommitment*.  
     - **Verdict**: **Rational**. Correct. Outcome depends on the constraint, not your intention.  

  ---

  ### **The Principle Explained**
  **Outcome-Dependent Rationality**:  
  > You can form a disposition/intention iff:  
  > - **(A)** It causes a net-beneficial outcome (Newcomb, Cake resolve, Pathological toxin), OR  
  > - **(B)** It is intrinsically valuable (e.g., cake resolve as self-trust).  
  > Otherwise, it's impossible or irrational (original toxin).  

  **Why one-boxing (2) works but toxin (1) fails?**  
  - In Newcomb, your *disposition today* causes the $1M to *already be in the box*. The outcome depends on your state.  
  - In Toxin, the $1M is paid for the *intention alone*, but the intention doesn't cause drinking (which has no benefit). No outcome depends on drinking → no intention forms.  

  ---

  ### **The $10k Variant: Why Your Gut is Right**  
  - **Setup**: $1M for intending to drink, +$10k for drinking.  
  - **Principle**: Now drinking *has* a benefit ($10k). Forming the intention is rational because:  
    - If you intend, you get $1M + $10k (if you drink) or $1M (if you don't).  
    - But crucially: intending makes drinking *possible* (since $10k > cost of sickness).  
  - **Result**: You **can** form the intention! At noon, you intend to drink, knowing:  
    - You'll drink tomorrow (net gain: $10k - sickness cost).  
    - The $10k makes drinking outcome-dependent.  

  ---

  ### **Summary of Verdicts**  
  | Case                     | Your Verdict               | Principle Verdict | Notes                                                                 |
  |--------------------------|----------------------------|-------------------|-----------------------------------------------------------------------|
  | 1. Original Toxin        | ❌ Can't get $1M           | ✅ Agree          | Intention irrational (no outcome from drinking).                     |
  | 2. Newcomb (infallible)  | ✅ One-box                 | ✅ Agree          | Disposition causes $1M.                                              |
  | 3. Newcomb (90%)         | ✅ One-box                 | ✅ Agree          | Disposition causes high expected value.                              |
  | 4. Cake resolve          | ✅ Rational                | ✅ Agree          | Resolve causes avoidance (or is intrinsically valuable).             |
  | 5. Toxin + Pathology     | ⚠️ Flip-flops             | ✅ **Get $1M**    | Pathology makes intention cause drinking.                            |
  | 6. Password change       | ✅ Rational                | ✅ Agree          | External precommitment causes outcome.                               |
  | 7. Toxin + $10k bonus    | ✅ Get $1.01M              | ✅ Agree          | $10k makes drinking beneficial → intention forms.                    |

  The *only* overturn is **Case 5 (Pathological Toxin)**: You **can** get the $1M because your pathology turns intention into a binding precommitment. This fits the principle perfectly—no epicycles needed.  

  **Why overturn this one?**  
  - Unlike other cases, your pathology *forces* intention to cause drinking. Without it (Cases 1–4,6), intention requires outcome-dependence. With it, intention *creates* outcome-dependence.  
  - Your hesitation is natural—this case exploits a psychological quirk—but the principle handles it cleanly.  

  This framework explains all your judgments, resolves the toxin/Newcomb tension, and validates your $10k bonus intuition. Consistency achieved! 🎯
