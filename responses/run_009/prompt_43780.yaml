prompt: |-
  I have just spent most of an evening arguing with a friend about whether knowing how to do something is ultimately just knowing that something is the case — she taking the intellectualist line that knowledge-how is propositional knowledge of a way of doing things, presented under a practical mode; I digging in on the Rylean side that the reduction gets everything backwards. We exhausted ourselves trading cases, and I have concluded that the disagreement is really about what a theory of knowledge-how is *for*. So before we go another round, I want the standards written down.

  Please produce a specification: the desiderata any adequate theory of knowledge-how must meet, with the case or consideration motivating each requirement. At minimum the list should engage the following, though you should add or discard as you see fit and say why:

  - The asymmetry of acquired inability: the dual who can no longer perform but has not forgotten how (our ski instructor, the retired dance teacher), and its mirror, the person who performs reliably without knowing how (the beginner whose swing is corrected mid-flight by a coach, the patient with blindsight-like success at a discrimination they cannot report).
  - The distinction between knowing how and merely being able: ability is cheap, know-how is an achievement, and the theory should explain wherein the achievement consists.
  - Acquisition and transmission: much know-how is got by imitation, practice and correction rather than by being told facts, and some possessors (non-human animals, pre-linguistic children) seem to lack the resources for any propositional surrogate. The theory must either accommodate this or deny the appearances, and if it denies them it owes an account of what it is denying.
  - The triviality trap: if the intellectualist says the proposition is presented "under a practical mode", the theory must say what that mode contributes without either collapsing back into ability (making the propositional part idle) or becoming unfalsifiable.
  - A constraint my friend resisted and I want defended or demolished: the theory should make intelligible how know-how can be *lost* — whether by forgetting alone, by loss of practice, or only by physical injury — and it must not imply that reciting the relevant facts to oneself could restore the ability.
  - Non-observational access: I know how I am moving my fingers now, and I know it without watching them; the theory should not force this into observation of my own performance.

  For each requirement, mark it as non-negotiable or as a prejudice of one camp, and tell me honestly whether you think some subset of the desiderata is jointly unsatisfiable — if the list itself excludes all comers, say so plainly, since that would itself be the result I most want. Then a brief scorecard, no more than a short paragraph each, for the two of us: her intellectualism (knowledge-how as knowledge of a way under a practical mode of presentation) against Ryle's dispositional anti-intellectualism, plus any third contender you think is the real live alternative to both.

  I want you to take sides, not set out a menu. Commit to which single requirement does the most to exclude candidate theories, and commit to whether my friend's view survives it. End with that commitment in the form:

  \answer{knockdown requirement: <requirement name>; intellectualism survives: yes/no}

  Place this on the very last line, after all the reasoning.
reasoning: |-
  Okay, let me tackle this user's request. They want a specification of desiderata for any theory of knowledge-how, based on their debate with a friend. The user is on the Rylean side, while their friend supports intellectualism. 

  First, I need to list the requirements they mentioned and add any others that seem relevant. The user specified several key points: asymmetry of acquired inability, distinction between knowing how and mere ability, acquisition and transmission, triviality trap, loss of know-how, and non-observational access. 

  Considering the asymmetry case: the ski instructor who can't ski anymore but still knows how. Any theory must explain how someone can retain knowledge without current ability. The mirror case like blindsight shows ability without knowledge. This feels non-negotiable because it highlights a core difference between knowledge and ability.

  Next, the distinction between knowing how and being able. Abilities can be innate or accidental, but know-how is an achievement. The theory needs to capture what that achievement involves—maybe dispositions plus understanding? This also seems essential.

  Acquisition is crucial. Kids and animals learn by doing, not propositions. If intellectualism denies this, it must explain how propositional knowledge fits here. Since evidence shows non-propositional learning, this is non-negotiable.

  The triviality trap is a big issue for intellectualism. Saying knowledge-how is propositional "under a practical mode" risks circularity. If the practical mode is just ability, then propositions become redundant. If it's something else, it must be definable without being unfalsifiable. Intellectualism struggles here, making this key.

  Loss of know-how matters to the user. They want the theory to explain why reciting facts can't restore ability. Forgetting or lack of practice should cause loss without needing injury. Ryle handles this better with dispositions decaying. Intellectualism might say the propositions are forgotten, but that doesn't fit cases where facts are remembered but ability isn't. This challenges intellectualism and supports the user's view.

  Non-observational access: knowing finger movements without looking. Intellectualism might reduce this to knowing facts about one's actions, but that feels observational. Ryle's dispositions allow immediate access. This is important but maybe secondary.

  I should also consider integration with intelligence. Ryle emphasizes that know-how involves understanding principles, not just habits. Adding this as a desideratum strengthens the case against reducing it to propositions.

  Now, are any desiderata conflicting? Acquisition and loss focus on non-propositional aspects, while intellectualism tries to fit everything into propositions. The triviality trap and asymmetry might jointly exclude intellectualism if it can't avoid circularity.

  Scoring the theories: Intellectualism, especially with practical modes, struggles with acquisition (animals/kids), loss (why can't reciting facts restore ability?), and the triviality trap. It might handle non-observational access by saying the mode gives direct access, but that's vague.

  Ryle's dispositionalism handles asymmetry (retained knowledge as dormant dispositions), acquisition (dispositions built via practice), and loss (dispositions decay). It distinguishes know-how from mere ability via understanding. But it might blur knowing how and ability if not careful. Non-observational access fits as dispositions are felt, not observed.

  Third options like embodied cognition focus on skills as embodied, not mental states. This handles acquisition and asymmetry well but might struggle with the achievement aspect or loss.

  The knockdown requirement is the asymmetry of acquired inability. Intellectualism can't easily explain why the ski instructor knows how but can't perform without making the mode too vague or collapsing into ability. Since reciting facts doesn't restore ability, intellectualism fails here. So asymmetry excludes intellectualism.
answer: |-
  Here is the specification of desiderata for a theory of knowledge-how, with cases, necessity assessments, and constraints. Requirements marked **non-negotiable** are grounded in uncontroversial empirical phenomena; others reflect conceptual boundaries.

  ---

  ### **Desiderata for a Theory of Knowledge-How**
  1. **Asymmetry of Acquired Inability**  
     - *Case*: A retired ski instructor (retains knowledge-how but cannot physically ski) vs. a blindsight patient (reliably "guesses" correctly without knowing how).  
     - *Requirement*: The theory must explain retained knowledge-how *without* current ability, and reliable ability *without* knowledge-how.  
     - *Status*: **Non-negotiable** (phenomenologically evident).  

  2. **Distinction Between Know-How and Mere Ability**  
     - *Case*: A novice tennis player accidentally hits a perfect serve (ability) vs. Serena Williams executing a strategic serve (know-how).  
     - *Requirement*: Know-how must involve *understanding* or *control* beyond reliable success. Ability can be flukey, know-how is a normative achievement.  
     - *Status*: **Non-negotiable** (central to the concept’s value).  

  3. **Acquisition and Transmission Without Propositions**  
     - *Case*: A child learning to ride a bike via practice/imitation, or a dog learning to open a gate.  
     - *Requirement*: The theory must accommodate non-linguistic acquisition. If it denies this, it must explain how pre-linguistic agents possess propositional analogues.  
     - *Status*: **Non-negotiable** (developmental and comparative psychology demand it).  

  4. **Avoidance of the Triviality Trap**  
     - *Case*: Intellectualist claims that "knowing how to φ = knowing *that* way *w* is a way to φ, under a practical mode."  
     - *Requirement*: The "practical mode" must add substantive content beyond the proposition. It cannot collapse into ability (making propositions redundant) or be an unfalsifiable primitive.  
     - *Status*: **Non-negotiable** (prevents ad hoc evasion).  

  5. **Loss Without Fact-Forgetting**  
     - *Case*: A pianist who forgets *how* to play a sonata after decades of neglect but recalls *that* "crossing hands at bar 32" is required. Reciting facts doesn’t restore ability.  
     - *Requirement*: The theory must allow loss of know-how without loss of propositional knowledge, and explain why propositional rehearsal fails to restore it.  
     - *Status*: **Defensible constraint** (motivated by Rylean intuitions but negotiable if loss is redefined).  

  6. **Non-Observational Access to One’s Know-How**  
     - *Case*: Typing without watching your fingers; you know *how* you are moving them without inferring from sensory data.  
     - *Requirement*: Knowledge-how must not require observational or inferential access to one’s own actions.  
     - *Status*: **Non-negotiable** (first-person authority in action is fundamental).  

  7. **Integration with Intelligence** (Added)  
     - *Case*: A mechanic who improvises a repair using principles of engineering vs. one who blindly follows instructions.  
     - *Requirement*: Know-how must explain *intelligent adaptability* — responding to novel situations flexibly.  
     - *Status*: **Non-negotiable** (Ryle’s core argument against "parroted" knowledge).  

  *Discarded?* None. All user-provided cases are essential.  
  *Joint Satisfiability?* Yes — but **intellectualism struggles with (1), (3), (5), and (4)**, while Ryleanism risks conflating know-how with ability in (2).  

  ---

  ### **Scorecard: Theories Assessed**  
  **Intellectualism (Friend’s View)**  
  Fails (1): Cannot explain the ski instructor’s retained knowledge-how without equivocating on "practical mode." If the mode *is* the ability, it collapses into Ryleanism; if not, loss of ability should not imply loss of knowledge. Fails (3): Imputes propositions to infants/animals implausibly. Fails (5): If know-how is propositional, reciting facts *should* restore ability — but it doesn’t. Fails (4): "Practical mode" is either circular or mystical. Only handles (6) well by attributing direct access to propositions.  

  **Ryle’s Dispositionalism (Your View)**  
  Fares well on (1) (knowledge-how as multi-track dispositions), (3) (dispositions built via practice), (5) (dispositions decay without use), and (7) (intelligence as higher-order dispositions). Struggles slightly with (2): Must clarify how *successful* dispositions differ from lucky abilities (solution: invoke normativity of training). Excels at (6): Dispositions are felt, not observed.  

  **Third Contender: Embodied-Embedded Cognition (EEC)**  
  *Position*: Know-how is a skill enacted via agent-environment coupling, not stored propositions or bare dispositions.  
  *Strengths*: Natural fit for (1), (3), (6), and (7) — skills persist as bodily capacities ("retained readiness") and adapt intelligently. Avoids (4) by rejecting propositions.  
  *Weaknesses*: Needs refinement on (2) and (5) to distinguish *reliable* coupling (ability) from *expert* coupling (know-how).  

  ---

  ### **Commitment**  
  The **asymmetry of acquired inability (1)** is the knockdown requirement. Intellectualism cannot survive it: If know-how is propositional knowledge under a practical mode, losing physical ability should not preserve know-how (contra the ski instructor), and recovering propositions should restore ability (contra the pianist). Intellectualism either denies the asymmetry (false) or renders "practical mode" incoherent. EEC or refined Ryleanism handles it best.  

  \answer{knockdown requirement: Asymmetry of Acquired Inability; intellectualism survives: no}
