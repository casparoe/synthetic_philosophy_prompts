prompt: |-
  My ethics reading group got stuck on something involving the unilateralist's curse (the Bostrom/Ord thing: when lots of people each have the power to take an action that's bad if even one of them takes it, the action happens more often the larger the group, even when each person is more likely right than wrong that it's good — and the proposed fix is a principle of conformity, where you defer to the group's judgment instead of your own unless you clear a confidence threshold that rises with group size). Someone pushed this argument at us:

  (1) The curse shows up whenever a bunch of agents can each trigger an outcome that's bad if any one of them triggers it, and each agent's own evidence marginally favors triggering.
  (2) The principled fix is a conformity principle: don't act on your own judgment unless you're confident enough that the group's likely to be wrong, with the bar rising as the pool of potential actors grows.
  (3) Moral progress is full of cases matching (1): the first person to publicly denounce slavery, the lone vegetarian in a meat-eating town, the whistleblower. In each case there were many people who coud have spoken up, speaking up exposed everyone to a cost if it was misguided, and each potential speaker's judgment that speaking was good was, by everyone else's lights, more likely wrong than right — otherwise it wouldn't have been controversial at the time.
  (4) So by (2), all those people should have conformed, i.e. kept quiet until the group came around on its own.
  (5) That would have suppressed basically every moral advance we've ever had.
  (6) So the conformity principle, or the setup that generates it, is broken.

  We can't agree on which premise to give up. I'm half tempted to bite the bullet on (4) and say most moral innovation should be suppressed and we just got lucky — but tell me where this actually goes wrong and what rejecting it there costs. My own suspicion is that the curse setup has a hidden assumption about everyone being epistemic peers with symmetric evidence that quietly does all the work in (3), but I can't quite nail it down, and if I'm right I'd like to know whether the principle can be repaired for the asymmetric cases or whether it just stops applying to them entirely.
reasoning: |-
  Okay, the user's ethics reading group is stuck on the unilateralist's curse and its implications for moral progress. They presented an argument that the conformity principle would suppress moral advances like denouncing slavery or whistleblowing. The user suspects a hidden assumption about epistemic peers might be the key.

  First, I need to recall the unilateralist's curse. It happens when multiple agents can each trigger a bad outcome if any one acts, and each has evidence slightly favoring action. The fix is to defer to the group unless highly confident. The challenge is applying this to moral innovators who acted against the group.

  The user's suspicion about epistemic peers is spot on. The curse model assumes symmetric evidence and competence. But moral pioneers often have unique experiences or insights. For example, abolitionists might have witnessed slavery's horrors firsthand, which others hadn't. That breaks the symmetry.

  The argument's step (3) claims that each speaker's judgment was seen as more likely wrong. But that's the group's view, not an objective assessment. The innovator's confidence comes from asymmetric evidence. So the conformity principle shouldn't apply here because peers aren't symmetric.

  I should also address the nature of the action. In the curse, the action is harmful if wrong and only needs one person. But moral actions like denouncing slavery might have individual costs but collective benefits. The harm isn't triggered by one person; it's about changing norms. Plus, the cost is often borne by the actor, not the group.

  The user might need to clarify when the conformity principle is valid. It works for technical decisions with symmetric info, like launching a nuke. But moral innovation involves diverse evidence and values. Rejecting the principle here doesn't invalidate it elsewhere. 

  The user's deeper concern is whether suppressing moral innovation is necessary or if the principle can be adjusted. Emphasizing asymmetric evidence and differentiating action types can resolve the paradox without discarding the curse entirely. They might also worry about justifying conformity in oppressive systems. Highlighting that the principle isn't absolute and requires context could help.
answer: |-
  You've hit on a profound tension, and your suspicion about epistemic symmetry is astute. The argument presented is compelling because it exposes a genuine paradox when applying the curse logic directly to moral progress. Let's break down why the curse model *doesn't* straightforwardly apply to moral pioneers and where the argument goes wrong:

  **The Core Flaw: The Hidden Assumption of Epistemic Symmetry**

  You are absolutely correct. The unilateralist's curse derivation **crucially relies on the assumption of symmetric evidence and competence among the agents**. This means:

  1.  **Shared Prior:** Everyone starts with the same baseline beliefs about the world.
  2.  **Identical Evidence Pool:** Everyone has access to the *same* relevant information (or information of equivalent probative value).
  3.  **Equal Competence:** Everyone is equally skilled at interpreting that evidence and updating their beliefs rationally.
  4.  **Independent Judgments:** Beliefs are updated based solely on the shared evidence and prior, not influenced by each other's opinions (until the conformity principle kicks in).

  **Why (3) Fails: Moral Pioneers Aren't Symmetric Peers**

  The argument's step (3) claims that in cases of moral progress (abolitionist, vegetarian, whistleblower), "each potential speaker's judgment... was, by everyone else's lights, more likely wrong than right." **This conflates the *group's assessment* of the pioneer's judgment with an objective assessment under symmetric conditions.**

  *   **Asymmetric Evidence:** Moral pioneers often possess *unique* or *differentially weighted* evidence:
      *   Personal experience (e.g., the abolitionist who witnessed brutality firsthand, the whistleblower who saw internal documents).
      *   Different moral frameworks or sensitivities (e.g., the vegetarian deeply affected by animal suffering in ways others dismissed).
      *   Access to marginalized perspectives or counter-narratives.
      *   Superior reasoning or insight on the specific issue.
  *   **Asymmetric Values/Frameworks:** The disagreement often isn't *just* about facts ("Is slavery harmful?") but about fundamental values ("Is this harm sufficient to justify overturning the social/economic order?"). The pioneer assigns vastly different weights to the harms/benefits than the majority. The curse model typically assumes shared values/goals and only epistemic uncertainty about means/effects.
  *   **The Group is Wrong:** Critically, in successful moral revolutions, *the group's prior beliefs and interpretations are systematically flawed* due to bias, self-interest, ignorance, or tradition. The pioneer isn't just a slightly better estimator within a symmetric pool; they are operating with a fundamentally different (and ultimately more accurate) perspective. The curse model assumes the group's average judgment is likely correct *because* of symmetry and independent errors canceling out. This assumption fails when the group is systematically biased.

  **Why (1) is Misapplied: The Nature of the "Bad Outcome"**

  The curse requires that the action is "bad if *any one* of them takes it." This fits scenarios like launching a nuke or releasing a virus – one actor triggers the catastrophic outcome. Does this fit moral pioneers?

  *   **Cost vs. Catastrophe:** Speaking out often carries significant *personal cost* (ostracism, job loss, violence) for the pioneer, and *social friction*, but it rarely triggers an *inherently catastrophic outcome for everyone else* simply by being uttered *once* by *one* person in the way the curse requires. The "badness" if they are *wrong* is typically social disruption or reinforcing an unwanted norm, not an existential or irreversible harm triggered solely by that one act.
  *   **The Goal is Collective Action/Change:** The pioneer's action isn't usually intended to be the final, unilateral solution. It's often a catalyst aiming to *change the group's mind* and inspire *collective* action (abolishing slavery, changing laws, stopping corruption). The curse model assumes the action itself is the endpoint with binary consequences triggered by one actor.
  *   **Threshold Effects & Network Dynamics:** Moral change often depends on reaching a critical mass or tipping point. One voice might be ignored, but it makes the next voice easier. The curse model treats actions as isolated and purely additive in a negative way.

  **Why (4) Doesn't Follow: The Principle Doesn't Apply Asymmetrically**

  Because the symmetry assumption is violated, the conformity principle derived from the symmetric curse model **doesn't bind the moral pioneer**. Their higher confidence isn't just slightly higher within a symmetric pool; it stems from *better* evidence or reasoning the group lacks.

  *   **The Confidence Threshold is Contextual:** The conformity principle isn't an absolute rule. The required threshold for overriding group consensus *should* be lower when an agent has strong reasons to believe they possess unique evidence, superior insight, or that the group is systematically biased – precisely the case for moral pioneers.
  *   **The Principle Addresses Coordination Failure, Not Truth-Seeking:** The curse is fundamentally about preventing coordination failures in high-stakes, irreversible actions under symmetric uncertainty. Moral progress is often about *overcoming* a coordinated failure of perception or values, not *preventing* a coordination failure in action. The pioneer isn't causing a failure; they are trying to *correct* one.

  **Resolving the Paradox & Addressing Your Questions**

  1.  **Reject Premise (3) as Stated:** The key premise fails because it assumes symmetric epistemic conditions where none exist in cases of genuine moral progress. The pioneer's judgment isn't marginally better *within a symmetric peer group*; it's *asymmetrically* better due to differential evidence, reasoning, or values. The group *thinks* the pioneer is likely wrong, but the group is systematically biased or ignorant.
  2.  **Reject the Direct Application of (2) to (3):** The conformity principle, derived from a symmetric model, doesn't automatically apply to agents operating under conditions of significant asymmetry. The pioneer *should* act on their superior judgment, even if the group disagrees, because the core assumptions justifying conformity are absent.
  3.  **Biting the Bullet? (Not Necessary):** You don't need to suppress moral innovation. The curse model is a valuable tool for specific scenarios (e.g., nuclear launch protocols, high-risk AI research decisions, certain types of institutional whistleblowing where one leak *can* cause immediate global harm), but it *doesn't* map onto the dynamics of challenging entrenched social norms or exposing systemic wrongs where evidence and values are contested asymmetrically.

  **Can the Principle Be Repaired for Asymmetric Cases?**

  The *core insight* of the curse – that individual actions can have outsized negative consequences and that coordination is hard – remains relevant. However, the symmetric conformity principle **cannot be directly applied** in highly asymmetric situations like moral revolutions.

  *   **Shift from "Conformity" to "Responsible Defiance":** For asymmetric cases, we need principles for *when and how* to defy the group consensus responsibly:
      *   **Burden of Proof:** The defector should have strong, articulable reasons grounded in evidence or values absent from the group's reasoning.
      *   **Scrutiny of Asymmetry Claims:** Is the claimed unique evidence/reasoning genuine and robust, or self-deception? (This is hard!).
      *   **Assessment of Harm:** What is the nature and scale of the potential harm if the defector is wrong? Does it resemble the catastrophic, irreversible trigger of the classic curse, or is it primarily personal/social friction?
      *   **Alternatives & Strategy:** Have avenues for internal reform been exhausted? Is defiance the only/best way? Can harm be minimized?
      *   **Transparency & Accountability:** Can the reasoning be explained? Is the defector willing to bear the consequences?
  *   **It Stops Applying *as the Curse Fix*:** The specific "raise your threshold as group size increases" conformity rule, derived *only* under strict symmetry, stops being the appropriate tool. The *problem* of unilateral action causing harm persists, but the *solution* requires different principles acknowledging asymmetry and the potential for the group to be systemically wrong.

  **Conclusion**

  The argument against the conformity principle fails by incorrectly applying a model built on epistemic symmetry to historical cases defined by epistemic *asymmetry*. Moral pioneers like abolitionists or whistleblowers weren't marginally better calculators within a symmetric pool; they possessed unique evidence, insights, or moral frameworks that the majority lacked or suppressed. The conformity principle derived from the unilateralist's curse is a valuable safeguard against coordination failures in high-stakes, symmetric scenarios, but it is **not** a valid prescription against responsible moral defiance in the face of group error stemming from asymmetric information, bias, or flawed values. Rejecting its application in these asymmetric cases doesn't break the principle; it clarifies its proper domain. You can accept the curse logic for its intended context without condemning moral progress. The cost of rejecting its application to moral pioneers is... the justified possibility of moral progress itself.
