prompt: |-
  I write historical novels, and I've got a weird problem that I think philosophers actually have names for. My new book is set in 1890s Vienna, and it's stuffed with little factual claims -- how long the train to Prague took, whether the Graben was lit by electric arc lamps by then, what coffee cost, whether a bank clerk would've had Sunday off. Individually I'm maybe 97% confident in each one; I checked most at some point. But there are something like 600 of them, and from past books I know that whenever I do find an error, it was always in something I'd been exactly that confident about. So by my own lights I basically know some sentences in this manuscript are false -- I just don't know which. And then there's the acknowledgements page, where convention says I write something like "any remaining errors are mine" while simultaneously standing behind every sentence in the book. A friend told me this is the preface paradox, and that it's cousins with something called the lottery paradox, and that whether it's okay to assert each of 600 claims at 97% while accepting that the whole lot together contains falsehoods is an actual live issue.

  Write me a procedure I can actually run on the manuscript before it goes to copyedit. For each factual claim: the questions to ask, in order; what counts as good enough to assert flat-out; when to hedge in the prose; when to just cut or make the claim uncheckable (fudge the street name, pick a different battle); and where it's genuinely just a judgement call I can't dress up as a rule. I want to be able to run it on a single sentence in a few minutes, since I can't re-research 600 things on deadline. Then run it on three claims from the actual draft: (a) the travel time of the morning express from Vienna to Prague in 1893, which I got from a schedule I found once and can't refind; (b) a line where a character mentions his father dying at the Battle of Wagram, where I picked Wagram because it fit the birthdate I'd already locked in for the father; and (c) the coffee prices, which I honestly half-invented and then lost track of which ones are which. I want at least one of these to end with the procedure making me do something I'd rather not do. And finally tell me straight: is the acknowledgements sentence -- believing there are errors in the book while asserting the book -- actually coherent, or is it just a polite lie we let authors tell, and should the procedure change how I write it?
reasoning: |-
  We are going to design a procedure for evaluating each factual claim in the manuscript. The procedure will be a series of questions to ask about each claim, leading to one of several outcomes: assert flat-out, hedge, cut/fudge, or make uncheckable. The goal is to be efficient and not require re-researching everything.

  The key idea is to balance confidence with the consequences of being wrong, and to consider the source and the possibility of verification.

  Procedure for each factual claim:

  Step 1: Assess the importance of the claim to the story.
    - Question: How critical is this fact to the plot, character development, or setting? If it's wrong, would it break a key plot point, misrepresent a character, or significantly disrupt the historical atmosphere?
    - If not important (e.g., a minor detail that adds color but isn't pivotal), then we can be more lenient. If critical, we need higher confidence.

  Step 2: Assess the source of the information.
    - Question: Where did I get this information? Is it from a primary source (like an original document, contemporary newspaper, etc.), a reputable secondary source (academic history book, peer-reviewed article), or a less reliable source (website without citation, general knowledge, etc.)?
    - Also, can I still find the source? If I found it once but can't now, that lowers confidence.

  Step 3: Assess the likelihood of being wrong and the consequences.
    - Question: If this fact is wrong, how noticeable would it be to readers? Would it be easily spotted by an expert? Would it be something that a reader might look up and then lose trust in the book?
    - Also, consider: is this a fact that is commonly known or easily verifiable? If so, we must be more careful.

  Step 4: Consider the possibility of hedging.
    - Question: Can I phrase this claim in a way that is less committal without disrupting the narrative? For example, using words like "about", "nearly", "almost", or having a character be uncertain.

  Step 5: Consider cutting or making uncheckable.
    - Question: If the fact is of low importance and I have low confidence, can I omit it? Or can I make it vague enough that it doesn't matter (e.g., "a battle" instead of "Wagram", or "a nearby street" instead of a specific name)?

  Step 6: Final decision tree:
    - If the claim is critical (Step 1) and I cannot verify the source (Step 2) or my confidence is low, then I must try to re-research or, if time doesn't allow, hedge or cut/change.
    - If the claim is non-critical and I have a reputable source (even if I can't refind it, if I remember it as reputable) and the consequence of being wrong is low (Step 3), then I can assert flat-out.
    - If the claim is non-critical but I have low confidence and the source is weak, then hedge or cut.
    - If the claim is critical and I have a strong source (even if I can't refind it now) and I remember it clearly, then assert flat-out.

  But note: We have 600 claims and cannot re-research. So we are relying on memory of the research and the source.

  Now, we run the procedure on the three examples:

  (a) The travel time of the morning express from Vienna to Prague in 1893.

    Step 1: Importance? It might be critical if the character's arrival time is plot-relevant. If it's just background, then less important.
    Step 2: Source? I found a schedule once but can't refind it. So the source was primary but I cannot verify now. Confidence: 97% from memory, but without the source, it's risky.
    Step 3: Consequences? If wrong, a train enthusiast might notice. It might break the timeline if the plot depends on it. If it's just a throwaway line, then low consequence.
    Step 4: Hedge? Can say "about four hours" (if that's what I recall) or "the express took just over four hours" to allow for variation.
    Step 5: Cut? Probably not, because travel time sets the scene.
    Step 6: Decision: If the plot depends on it, then I must hedge or try to re-find the source. If not, and I remember it well, I can assert. But without the source, hedging is safer.

    Outcome: Hedge. Change to: "The morning express took about four hours, I recalled." or "The journey was said to take four hours." This reduces the risk.

  (b) A character mentions his father dying at the Battle of Wagram, because it fit the birthdate I'd locked in.

    Step 1: Importance? It defines the character's backstory. If Wagram is wrong, then the father couldn't have died there (because of the dates) and it might be noticed by history buffs. So it's critical for the character.
    Step 2: Source? I picked Wagram because it fit the birthdate. Did I check if the father's age at death is consistent with the battle? The battle was in 1809. If the father was born in, say, 1780, then he would have been 29. But did I check if he was present? This is invented to fit the birthdate, so the source is weak.
    Step 3: Consequences: If wrong, it might be a noticeable historical error. The Battle of Wagram is a major event, and if the father couldn't have been there (e.g., if he was too old/young, or if he was in a different regiment) then it breaks the story.
    Step 4: Hedge? The character could say "I believe it was Wagram" or "he fell at Wagram, or so I was told." But that might undermine the character's certainty about his own father.
    Step 5: Cut/Change? Consider changing the battle to a less specific one? Or change the birthdate? But the birthdate is locked in. Alternatively, make the battle uncheckable by having the father die in a minor skirmish that wouldn't be recorded? But Wagram is a major battle.

    Step 6: Decision: This is high risk. I need to double-check the dates. If the father was born in 1780, then 1809 is 29 years old - that's feasible. But was Wagram the only battle around then? And was he in the army? Without a source, this is weak. Since I invented it, I have to treat it as low confidence. Therefore, I should change the battle to one that I know happened and that I can verify, even if it means adjusting the birthdate a little? But the birthdate is locked. Alternatively, hedge in the character's dialogue: "My father died in the wars against Napoleon, I think at Wagram." But that might not be satisfying.

    Outcome: This is a problem. The procedure should force me to change it. I must either:
      - Re-research to find a battle that fits the birthdate and that occurred when the father would have been of fighting age, and that I can source.
      - Or, if I cannot, then change the battle to a less specific event or a different one that I can verify.

    Given the deadline, I might have to choose a battle that I know happened and that I can quickly verify. So the procedure makes me do something I'd rather not: change the battle or the birthdate.

  (c) Coffee prices, which I half-invented and lost track of which are which.

    Step 1: Importance? Probably low. It sets the scene but won't break the plot.
    Step 2: Source? Some are invented, some are real. I don't know which is which. Confidence is low for some, but I don't know which ones.
    Step 3: Consequences: Low. Most readers won't know, and even if they do, it's a minor detail.
    Step 4: Hedge? Easy to hedge: "a cup of coffee cost about a kreutzer" or "I paid a few kreutzers for my coffee".
    Step 5: Cut? If it's not important, I could omit the price. But it adds flavor.
    Step 6: Decision: Since it's low stakes, hedge or make it vague. Alternatively, if I can remember a typical price from the era (even if not exact for Vienna 1890s), I can use that.

    Outcome: Hedge. Write: "a cup of coffee cost a few kreutzers" or "the price of a cup of coffee was around a kreutzer or two".

  Finally, the acknowledgements sentence: "any remaining errors are mine".

  The paradox: You believe each claim individually (with high confidence) but believe that there is at least one error in the book. This is coherent. It is similar to the preface paradox: an author believes each statement in the book but also believes that in a book of this length there will be an error. The lottery paradox: a ticket is unlikely to win, so you believe it will lose; but then you believe all tickets will lose, which contradicts that one will win.

  In probability: the probability of each claim being true is 0.97, so the probability that all 600 are true is (0.97)^600, which is about 0.0000006 (very low). So it is rational to believe that at least one is false, even though each one is very likely true.

  Therefore, the acknowledgements sentence is coherent. It is a humble recognition of human fallibility and the complexity of historical research. It does not mean you are lying about any specific claim.

  However, the procedure might change how you write it. If you run the procedure and have systematically hedged or cut the claims you were most unsure about, then the remaining errors are indeed the ones that slipped through despite your best efforts. So the sentence is still appropriate.

  But note: if you have hedged a claim, then it is not an error because you didn't assert it as a fact. So the errors are only the ones that you asserted as true that turned out to be false.

  So the procedure doesn't change the need for the sentence. It remains a polite convention that is also logically coherent.

  Summary of the procedure:

  For each factual claim, ask:

  1. How important is this to the story? (Critical, Important, Minor)
  2. What is the source? (Primary, Reputable secondary, Dubious, Invented)
     - And can I refind it? (Yes, No)
  3. If wrong, what are the consequences? (High: experts will notice and it breaks plot; Medium: might be noticed but not plot-breaking; Low: unlikely to be noticed and inconsequential)
  4. Can I hedge without harming the narrative? (Yes, No)
  5. Can I cut or make it uncheckable without harming the narrative? (Yes, No)

  Then:

  - If Critical and (source is Dubious/Invented OR cannot refind) AND consequences are High: 
      - Try to re-research (if time) OR change to hedge OR cut/change.
  - If Critical and source is Primary/Reputable (even if can't refind) and consequences are High: 
      - Assert flat-out only if you are confident. Otherwise, hedge.
  - If Minor and source is Dubious/Invented: 
      - Hedge or cut.
  - If Minor and source is Primary/Reputable: 
      - Assert flat-out if consequences are low; otherwise, consider hedging.

  But note: without time to re-research, we rely on memory of the source.

  The procedure is a judgment call, but the steps help structure the decision.

  Now, the three examples:

  (a) Travel time: 
    - Importance: Medium (if plot-relevant, Critical; else Medium)
    - Source: Primary but lost -> confidence medium, but without source now, it's risky.
    - Consequences: Medium (if plot-relevant, High; else Medium)
    - Hedge: Yes -> outcome: hedge.

  (b) Battle of Wagram:
    - Importance: Critical (backstory)
    - Source: Invented to fit birthdate -> Dubious
    - Consequences: High (could be noticed and breaks character logic)
    - Hedge: Possible but might weaken character -> better to change to a battle that fits and is verifiable. Outcome: Change the battle or the birthdate.

  (c) Coffee prices:
    - Importance: Minor
    - Source: Half-invented -> Dubious
    - Consequences: Low
    - Hedge: Yes -> outcome: hedge.

  For (b), the procedure forces a change, which you might not want to do because it requires reworking.

  Final Answer: The acknowledgements sentence is coherent and appropriate. It reflects the rational stance that despite high confidence in each claim, the collection of claims is almost certainly not perfect.
answer: |-
  Below is a practical, step-by-step procedure designed to help you evaluate individual factual claims in your manuscript efficiently. It prioritizes **risk tolerance** (how much damage an error would cause) and **pragmatic verification** (using what you already know without re-researching). The goal is to resolve each claim in ≤3 minutes by leveraging your memory and judgment. I'll then apply it to your three examples, including one where the outcome forces an unwanted change. Finally, I'll address the acknowledgements paradox.

  ---

  ### **The Fact-Check Procedure: 5 Steps per Claim**
  Run this on each factual sentence. **Time limit: 3 minutes/claim.**  
  *Key principle: Not all facts need equal certainty. Focus on minimizing reader distrust where errors matter most.*

  1. **ASSESS CRITICALITY**  
     *Question: "If this is wrong, would it break plot, character, or reader immersion?"*  
     - **High-criticality**: Core plot points, key character backstories, or widely known historical facts (e.g., "Franz Joseph was emperor").  
     - **Low-criticality**: Atmospheric details (e.g., "the coffee cost 20 kreuzers"), minor set dressing, or background trivia.  
     *→ If low-criticality, proceed to Step 2. If high, skip to Step 3.*

  2. **FOR LOW-CRITICALITY CLAIMS: CAN YOU VAGUEIFY?**  
     *Question: "Can this be blurred without losing narrative value?"*  
     - **Yes**: Hedge with vague language ("nearly an hour," "a few kreuzers") or omit the number/name entirely (e.g., "a battle against Napoleon").  
       - *Outcome*: **Hedge or cut**.  
     - **No**: Treat as high-criticality → Proceed to Step 3.

  3. **ASSESS SOURCE MEMORY**  
     *Question: "Do I recall *how* I know this?"*  
     - **Strong source**: Primary source (archives, periodicals), academic history, or multiple reputable sources.  
     - **Weak source**: Single non-academic source, Wikipedia, inference, or invented detail.  
     - **Uncertain source**: Confident but can’t relocate the source (e.g., your Vienna-Prague schedule).  
     *→ If weak/invented source: Proceed to Step 4.  
     → If strong source: Assert flat-out.*  
     *→ If uncertain source: Proceed to Step 5.*

  4. **FOR WEAK/INVENTED SOURCES: DAMAGE CONTROL**  
     *Question: "Could this be disproven by a motivated reader?"*  
     - **High risk**: Contradicts known history, involves famous events/figures, or is easily Googleable (e.g., "Wagram" is a major battle).  
       - *Outcome*: **Cut, change, or hedge aggressively** (e.g., swap "Wagram" for a fictional battle).  
     - **Low risk**: Obscure detail with no clear source (e.g., coffee prices in a small café).  
       - *Outcome*: **Hedge softly** ("likely cost around X") or **assert if plausible**.  

  5. **FOR UNCERTAIN SOURCES: CONFIDENCE VS. CONSEQUENCE**  
     *Question: "How bad would it be if I’m wrong?"*  
     - **High-criticality + uncertain source**: If wrong, would it undermine trust in the book? (e.g., travel times affecting plot logic).  
       - *Outcome*: **Hedge or find workaround** (e.g., "the train arrived by noon" instead of exact hours).  
     - **Low-criticality + uncertain source**:  
       - *Outcome*: **Assert flat-out** if plausible, **hedge softly** if doubtful.  

  **When to cut**: If a fact is high-risk *and* you can’t hedge without awkwardness (e.g., a specific battle name).  
  **When to assert flat-out**: Only with strong sources OR low-risk, low-criticality claims.  
  **Hedging examples**:  
  - Soft: "about," "nearly," "I heard," "likely" (for minor details).  
  - Aggressive: "some say," "rumored," "he claimed" (for high-stakes claims).  

  **Judgment calls you can’t avoid**:  
  - Balancing narrative flow against precision.  
  - Deciding "plausibility" for invented details (ask: "Would an expert *scoff*?").  
  - Your personal risk tolerance (e.g., "Is this worth a 1-star review?").  

  ---

  ### **Applying the Procedure to Your Examples**
  **Goal**: One outcome forces an unwanted change. Let’s see.

  **(a) Vienna-Prague train time (1893)**  
  1. **Criticality**: High (travel times affect scene pacing/plot). → Proceed to Step 3.  
  2. **Source**: Uncertain (schedule found once, can’t refind). → Proceed to Step 5.  
  3. **Confidence vs. Consequence**: High-criticality + uncertain source → **Hedge or workaround**.  
     - *Unwanted change*: You can’t assert "4 hours" flat-out.  
     - *Solution*: Hedge ("just over four hours, he’d heard") or imply ("the morning express would get him there by noon").  

  **(b) Father died at Battle of Wagram**  
  1. **Criticality**: High (defines character backstory). → Proceed to Step 3.  
  2. **Source**: Weak (invented to fit birthdate). → Proceed to Step 4.  
  3. **Damage Control**: High risk (Wagram is famous; readers may check dates). → **Cut, change, or hedge aggressively**.  
     - *Unwanted change*: You must alter this. Asserting it flat-out is dangerous.  
     - *Solution*: Change "Wagram" to a fictional battle (e.g., "at Raasdorf" – a real village near Wagram). Or hedge: "His father fell in the fighting near Wagram, he’d been told."  

  **(c) Coffee prices**  
  1. **Criticality**: Low (atmospheric detail). → Proceed to Step 2.  
  2. **Vagueify?** Yes → **Hedge or cut**.  
     - *Solution*: Hedge ("coffee cost a few kreuzers") or omit the price. No need to assert specifics.  

  **Result**: Example (b) forces a change (as requested). Invented, high-stakes facts about famous events are landmines.

  ---

  ### **The Acknowledgements Paradox: Is It Coherent?**
  **Short answer**: Yes, it’s logically coherent—and ethically necessary. Here’s why:  
  - **The philosophy**: This is the **preface paradox** (you believe each claim individually but not their collective infallibility). It’s rational because:  
    - Your 97% confidence in each of 600 claims implies ≈ 15 errors (since 0.97^600 ≈ 0.0000006; near-certainty of mistakes).  
    - This mirrors the **lottery paradox**: A single lottery ticket likely loses, but you can’t believe *all* tickets lose because one wins.  
  - **Why it’s not a lie**: You’re not claiming *specific* errors exist (which would be contradictory). You’re acknowledging *general* fallibility.  
  - **How the procedure changes it**:  
    - Post-procedure, your manuscript has fewer *asserted* claims (due to hedging/cutting). The remaining errors are truly the "needle in a haystack" mistakes that survived scrutiny.  
    - **Revised acknowledgements suggestion**:  
      > "I’ve endeavored to ensure historical accuracy, but sources sometimes conflict or elude capture. Any errors that remain are mine alone—though I trust they are few and harmless."  

  **Final straight talk**: The sentence isn’t a polite lie—it’s a badge of integrity. Historians and readers know perfection is impossible; admitting this *enhances* credibility. The procedure reduces errors, but the paradox remains: you can confidently assert each sentence while believing the whole contains flaws. That’s not hypocrisy; it’s honesty about human limits.  

  Run this process systematically, and you’ll sleep easier—even with 600 facts.
