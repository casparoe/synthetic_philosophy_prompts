  Okay, the user is a software engineer with no philosophy background, noticing that knowing about a creator's morality changes how they perceive the work itself—like music sounding worse or code feeling sinister. They want to know if there's a term for this or if it's a new concept.

  First, I need to confirm if this is a known phenomenon. I recall theories like "intentional fallacy" and "death of the author," but those are about interpretation, not sensory experience. Barthes and Foucault come to mind, but they focus on separating the creator from the work. The user says it's not that—the actual perception changes, like the music feels thinner.

  Then there's ethical criticism. Martha Nussbaum talks about how ethical flaws in a work affect its value. But here, it's the creator's character, not the work's content. Gaut's ethicism might be closer, arguing that ethical defects are aesthetic defects. But does the user's experience align with that? The indie game example: knowing the dev's struggle made the jankiness feel brave, not sloppy. That's a moral fact enhancing aesthetics.

  Also, cognitive science—embodied cognition. The disgust response to immoral creators affecting sensory perception. Studies show moral disgust can make things literally taste worse. That connects to the music example. The code example might be similar; the elegance now feels deceptive because of the sabotage. So, is this about cognitive associations triggering perceptual changes?

  The user mentions it's automatic, pre-rational. That points to System 1 thinking (Kahneman), where moral judgments affect perception unconsciously. Neuroaesthetics might have something here, like how mirror neurons or emotional responses alter experience.

  But is there a specific term? "Affective contamination" from psychology—where emotions transfer between associated concepts. Or "moral taint" in aesthetics? Not exactly. The closest might be Gaut's ethicism, but expanded to the creator's biography. Maybe "biographical ethicism"? Coining a term seems necessary here.

  Also, differentiating from ad hominem and boycotts. The user insists it's about perception, not argument or action. The code example is tricky—does code have aesthetics? Clean code is often seen as elegant, but morality might tie to trust. If the creator is untrustworthy, the code's elegance feels manipulative.

  Edge cases: When does this stop? If a work explicitly references the creator's life, like confessional poetry, then knowing the author is part of the work. But in the band's case, the music wasn't about the singer's ethics. So the distinction is when the work is independent vs. when biography is irrelevant.

  Also, the reverse effect: positive moral facts enhancing perception. The indie dev's perseverance making rough edges feel intentional. That's a "halo effect," where one positive trait colors other perceptions.

  So synthesizing: the core is extrinsic moral valence (creator's character) altering intrinsic aesthetic perception. Terms like "biographical valence effect" or "creator-effect" could work. Need to define it carefully, noting it's pre-rational, perceptual, and distinct from interpretation or ethical judgments about consuming the work.

  The user wants a rigorous definition. They might need this for personal understanding or to communicate the concept. As a backend engineer, they value precision. Highlighting the cognitive mechanisms (embodied cognition, affective priming) and philosophical context (ethicism vs. autonomism) would address their need for depth. Also, clarifying boundaries: when it's about the work's content vs. creator's unrelated actions, and when it crosses into interpretation.
answer: |-
  This is a brilliantly observed phenomenon, and you've articulated it with impressive clarity. You're right that it doesn't neatly slot into standard philosophical debates like Death of the Author or intentional fallacy, although it touches adjacent territory. It also goes beyond simple ethical consumption (boycotting) or ad hominem fallacies. What you're describing is **the direct, pre-rational, perceptual alteration of an artifact's aesthetic/technical qualities based on acquired knowledge about the moral character of its creator.**

  **The Established Concept (or Lack Thereof):**

  1.  **Closest Philosophical Neighbor: Ethicism (Specifically "Creator-Ethicism" or "Biographical Ethicism"):** The dominant relevant framework is the debate between **Ethicism** and **Autonomism** in aesthetics.
      *   **Ethicism (Berys Gaut, Noël Carroll):** Argues that an artwork's ethical flaws (e.g., promoting racism, depicting cruelty gratuitously) can *be* aesthetic flaws. The ethical properties are *constitutive* of the aesthetic experience.
      *   **Autonomism (e.g., formalists):** Argues that aesthetic judgment should be independent of moral, political, or biographical considerations. The work stands alone.
      *   **Your Case:** You're pushing Ethicism further. It's not (just) about the *ethical content within the work*, but about the *extrinsic moral character of the creator* influencing the perception of the *intrinsic formal/technical qualities* (the sound, the code structure, the gameplay feel). Gaut might argue this *is* an ethical flaw becoming an aesthetic flaw (the creator's immorality "taints" the work's perceived integrity). However, standard Ethicism debates rarely focus this intensely on *biographical knowledge unrelated to the work's content* causing a *sensory/perceptual shift*.
  2.  **Cognitive Science & Psychology:** This is where your observation finds strong empirical support.
      *   **Embodied Cognition:** Our cognition isn't purely abstract; it's grounded in bodily states and emotions. Learning something morally repugnant about the creator can trigger a visceral disgust response that literally alters sensory processing. The "thinner" sound or "sinister" code elegance could be a cognitive embodiment of moral disgust contaminating the perception.
      *   **Affective Priming/Contamination:** Negative information about a source (the creator) "primes" negative associations, which then "contaminate" the evaluation of anything associated with that source (the artifact). This happens rapidly and automatically (System 1 thinking, per Kahneman).
      *   **Conceptual Penetration of Perception:** Higher-level cognitive states (like knowing "X is a terrible person") can directly influence lower-level perceptual processes (how the music *sounds*, how the code *feels* to read). Your brain isn't just interpreting the *meaning* differently; it's altering the raw *sensation*.
      *   **The Halo Effect (and Horns Effect):** A cognitive bias where our overall impression of a person (positive = halo, negative = horns) colors our judgment of their specific traits or creations. Your positive impression of the indie dev's struggle casts a "halo," transforming jank into bravery. The singer's negative character casts "horns," making the music sound cheap.
      *   **Neuroaesthetics:** Studies using fMRI might show how brain regions associated with disgust (insula) or threat perception (amygdala) activate when engaging with the work of a morally condemned creator, modulating activity in regions processing aesthetics or structure.

  **Coining a Term & Defining the Phenomenon:**

  Given that existing terms don't perfectly capture the *perceptual* shift based on *extrinsic biographical morality*, let's define it rigorously:

  *   **Name:** **Biographical Valence Effect (BVE)** or **Creator-Effect Contamination (CEC)**
  *   **Core Definition:** **The phenomenon whereby acquired knowledge concerning the moral character of an artifact's creator produces an automatic, pre-rational alteration in the perceived sensory, aesthetic, or technical qualities of the artifact itself, independent of changes to the artifact's physical form or the consumer's interpretive understanding of its content or function.**
  *   **Key Characteristics:**
      *   **Trigger:** Knowledge of *moral character* (good/bad) of the *creator*.
      *   **Mechanism:** Automatic, affective (emotion-driven), pre-rational (occurs before conscious deliberation).
      *   **Effect:** Alters *perceived qualities* of the artifact (sound fidelity, visual texture, code elegance, gameplay feel) – its *phenomenology*.
      *   **Independence:** Distinct from:
          *   Changes in *interpretation* of the artifact's meaning (Death of the Author debate).
          *   Conscious *ethical judgments* about consuming/supporting the artifact.
          *   *Ad hominem* arguments (as there's no proposition being attacked).
          *   Changes based on the artifact's *own* ethical content.
      *   **Directionality:** Works bi-directionally (positive valence enhances perceived quality; negative valence degrades it).

  **Addressing Your Specifics & Edges:**

  1.  **Is the code case the same? (Does code have "aesthetic"?)**
      *   **Absolutely.** Code *has* deeply ingrained aesthetic dimensions for engineers: elegance, clarity, efficiency, maintainability, "cleanliness," robustness. These are sensory/intellectual experiences akin to appreciating architectural design or mathematical beauty. Knowing the author committed sabotage injects a perceived "taint" into that elegance – it feels deceptive, fragile, or menacing ("too clean to be trustworthy"). The *technical virtue* becomes perceptually linked to *moral vice*. This is a prime example of BVE/CEC in a technical domain.

  2.  **Where are the edges? When does this collapse into ordinary interpretation?**
      *   **The Work Itself Demands Biographical Context:** If the artifact *explicitly* references or relies on knowledge of the creator's life/morality (e.g., confessional poetry, autobiographical film, an artist's manifestos integrated into the work), then your changed perception *is* part of interpretation. BVE/CEC is strongest when the biographical knowledge is *extrinsic* and *irrelevant* to the work's intended content or function. The band's songs aren't *about* the singer's misdeeds; the code isn't *about* the sabotage.
      *   **Moral Knowledge Directly Explains the Artifact's Flaws:** If you learn the singer was lazy and cut corners, and *then* you hear compression artifacts you hadn't noticed before, that's less BVE/CEC and more *confirmation* or *reinterpretation* based on new evidence about the work's *production*. BVE/CEC changes perception *without* new evidence about the artifact's construction.
      *   **Pure Association/Triggering:** If hearing the band's song simply *reminds* you of the news story and makes you feel bad, that's associative sadness, not the song itself perceptually degrading. BVE/CEC makes the artifact *sound/worse/feel* different in its own right.
      *   **Degree of Separation:** The effect likely weakens with greater separation between the creator and the artifact. Knowing the CEO of the company that built your IDE is terrible might not perceptually alter your coding experience as viscerally as knowing the specific engineer who wrote the elegant-but-sinister code you're reading.

  **Why This Matters (Beyond Labeling):**

  You've hit on a profound aspect of human cognition and aesthetic experience. It demonstrates:

  1.  **The Deep Integration of Ethics and Aesthetics:** Morality isn't just a separate domain; it permeates our fundamental perception of craft and beauty.
  2.  **The Limits of "Objectivity":** Even trained professionals (like engineers) experience artifacts through an inescapably human lens colored by social and moral knowledge.
  3.  **The Power of Narrative:** The indie dev's story provided a narrative framework that radically reframed the sensory input of the game's jank.
  4.  **The Challenge for Criticism/Engineering Review:** Can we ever truly isolate the artifact from our knowledge of its creator? Should we even try? BVE/CEC suggests it's neurologically difficult, if not impossible, to completely sever that link.

  **Who to Look Up (Beyond the Usual Suspects):**

  *   **Berys Gaut:** *"Art, Emotion and Ethics"* - The core text defending Ethicism.
  *   **Noël Carroll:** Numerous works on philosophy of art, often engaging with ethical criticism.
  *   **Cognitive Science of Aesthetics:** Look into work by **Anjan Chatterjee** (neuroaesthetics), **Arthur Shimamura** (psychology of aesthetics), or **V.S. Ramachandran** (on universal principles of aesthetic experience).
  *   **Embodied Cognition:** **Lawrence Barsalou**, **George Lakoff & Mark Johnson**.
  *   **Moral Psychology:** **Jonathan Haidt** (on the intuitive foundations of morality), **Paul Bloom** (on empathy, disgust).

  **In Conclusion:**

  Your observation is astute. While it overlaps with Ethicism and draws heavily on cognitive psychology (embodied cognition, affective priming, halo effect), the specific phenomenon you describe – **the pre-rational, perceptual alteration of an artifact's qualities based on extrinsic knowledge of the creator's moral character** – deserves its own focus. **Biographical Valence Effect (BVE)** or **Creator-Effect Contamination (CEC)** captures its essence. It highlights that our experience of artifacts, from art to code, is never purely "objective"; it's deeply interwoven with our social and moral understanding of the minds that made them. The "flavor" truly does change.
