prompt: |-
  I'm on the content design review team at a mid-size company that makes a meditation/fitness app, and I've been tasked with building an internal checklist for deciding when a piece of persuasive copy or a UX pattern crosses from legit persuasion into manipulation. The thing is, "manipulation" gets thrown around constantly in our review meetings and nobody can say what it actually means, so different reviewers green-light or kill the same pattern for opposite reasons.

  Here's the theory background I want you to work from (paraphrasing what I picked up, so correct me if I mangle it): the family of philosophical views I found says the difference isn't about outcomes (persuasion and manipulation can both get you a good result) and isn't just about deception. The core idea is roughly that manipulation works by bypassing or exploiting people's rational capacities -- the mechanisms by which they would normally weigh reasons -- while persuasion works through those capacities. Influencing someone's emotions isn't automatically manipulative (how else would a eulogy work?), but the views disagree about whether exploiting a bias or heuristic, like loss aversion or the identifiable victim effect, counts as bypassing reason or is just a normal way reasons reach people. Some versions add a condition about whether the influence would survive the person knowing about it, others say that's not enough because advertising openly admits it manipulates.

  So: you're a professional philosopher who works on the ethics of influence, please think carefully about this and start with a bit of brainstorming about which distinctions actually matter for practitioners before you lock anything in. Then write me a decision procedure my team (mixed backgrounds, no philosophy training, ~15 min per review) can actually run on a proposed pattern: ordered questions, what counts as a sufficient answer to each, where it terminates in a "reject" versus "flag for human judgment on values", and where it says the pattern is fine. It has to handle the hard middle cases honestly rather than pretending they're clear. Be explicit about the steps that are judgment calls dressed up as procedure.

  Then run it on three patterns we actually have in the queue right now:

  1. A "your streak is at risk" push notification our gamification folks love, sent at 9pm, which uses loss framing to get users to open the app. (Users on a 60-day streak open it way more than others, and retention says this works.)

  2. A subscription upgrade screen where the annual plan is presented as the default with a big green button and the monthly plan is grey text in small font -- no false statements anywhere, everything is disclosed if you look.

  3. A meditation content series where each session ends with a short narrative about a specific imaginary user (named, with a face) whose anxiety improved, used to encourage people to keep going with the program.

  And here's the part where I need you to be honest rather than agreeable: at least one of these has to come out of the procedure in a way I won't like, and I suspect it's #3, since the same logic that condemns the streak notification could condemn the identifiable beneficiary story that our content team considers obviously good-faith. If that's where the procedure points, say so, and tell me whether the procedure has a principled way to distinguish them or whether it just exposes an inconsistency in what my company is comfortable with. Also tell me what the procedure can't do -- I don't want my team walking out of this thinking they have a manipulation-detecting machine.
reasoning: |-
  We are building a decision procedure based on philosophical grounds that distinguish manipulation from persuasion. The key distinction is that manipulation bypasses or exploits rational capacities, while persuasion engages them. We will create a step-by-step checklist that is practical for a team with limited time and no philosophy background.

  **Core Principles for the Checklist:**
  1. **Focus on Rational Engagement:** Does the pattern engage the user's capacity to weigh reasons, or does it bypass/exploit cognitive biases in a way that undermines rational decision-making?
  2. **Transparency and Endorsement:** Would the influence likely survive if the user knew about the tactic? (This is a common test but not always sufficient, as per the note about advertising.)
  3. **Exploitation of Vulnerabilities:** Does the pattern exploit a known cognitive bias or heuristic in a way that takes advantage of the user's automatic responses without providing an opportunity for reflection?
  4. **Context and Autonomy:** Does the pattern respect the user's autonomy and goals, or does it subvert them for the app's benefit?

  **Decision Procedure Structure:**
  We'll use a flowchart-like series of questions. Each question must be answered with "Yes" or "No", and the path leads to a conclusion. We aim for clarity but acknowledge that some steps require judgment.

  **The Checklist:**

  **Q1: Is the pattern deceptive? (Does it contain false or misleading information?)**
     - **Yes:** → **Reject** (Manipulative, because deception bypasses rational engagement by feeding false premises)
     - **No:** → Proceed to Q2.

  **Q2: Does the pattern rely on exploiting a cognitive bias or heuristic in a way that is likely to bypass the user's rational deliberation?**
     - *Explanation:* We are looking for tactics that trigger automatic responses without engaging the user's reflective thinking. Examples: exploiting loss aversion by creating an artificial sense of loss, using scarcity that isn't real, or leveraging the identifiable victim effect in a way that overrides cost-benefit analysis.
     - **How to judge:** Consider whether the bias being exploited is so strong that it typically overrides rational consideration in this context, and whether the tactic is designed to trigger an impulsive response.
     - **Yes:** → Proceed to Q3.
     - **No:** → **Approve** (This pattern is likely persuasive, not manipulative).

  **Q3: Is the exploited bias or heuristic being used in a way that aligns with the user's own goals and values?**
     - *Explanation:* Even if a bias is exploited, if it is harnessed to help the user achieve what they have set out to do (e.g., sticking to a meditation practice they want to maintain), it might be justifiable as a form of self-commitment. But if it is used to push the user toward an action that primarily benefits the company (e.g., an unnecessary purchase) and not their stated goals, it becomes manipulation.
     - **How to judge:** Look at the user's explicit goals (e.g., if they signed up for meditation to reduce anxiety, does this pattern help with that?) and whether the pattern is consistent with those goals.
     - **Yes** (aligns with user's goals) → Proceed to Q4.
     - **No** (does not align, or primarily serves company goals) → **Flag for human judgment on values** (This is a gray area; the team must decide if the company's goal alignment with the user is strong enough to justify the tactic).

  **Q4: Would the influence likely survive if the user were fully aware of the tactic? (Transparency Test)**
     - *Explanation:* If the user knew exactly how the pattern works (e.g., "We are using loss aversion to get you to open the app"), would they still find the influence acceptable? This is a test for whether the tactic is compatible with autonomy.
     - **Yes** (the user would likely endorse the tactic upon reflection) → **Approve with caution** (This is a borderline case that is acceptable because it respects autonomy; the user would not feel tricked).
     - **No** (the user would feel tricked or resentful if they knew) → **Reject** (Manipulative, because it cannot withstand scrutiny and thus bypasses rational endorsement).

  **Important Notes on the Procedure:**
  - **Q2 is the critical judgment call:** It requires the team to understand common cognitive biases and heuristics. We provide a reference list (e.g., loss aversion, scarcity, identifiable victim effect, etc.) and ask: "Is this pattern intentionally designed to trigger an automatic, non-reflective response?"
  - **Q3 requires context:** The team must know the user's goals (from user research, product positioning, etc.). If there's uncertainty, default to "Flag for human judgment".
  - **The procedure does not guarantee a clear answer for every case:** Some patterns will end up at "Flag for human judgment on values". This is intentional and honest.

  **What the Procedure Can't Do:**
  - It cannot resolve deep philosophical disagreements (e.g., whether all bias exploitation is manipulation).
  - It cannot account for cultural or individual differences in what feels manipulative.
  - It does not replace ethical discussion; it structures it.

  ---

  **Applying the Procedure to the Three Patterns:**

  **Pattern 1: "Your streak is at risk" push notification (sent at 9pm, using loss framing)**

  - **Q1: Deceptive?** No. The streak is indeed at risk if they don't use the app that day. → Proceed to Q2.
  - **Q2: Exploits a cognitive bias?** Yes. It uses loss aversion (fear of losing the streak) to trigger an automatic, non-reflective response (opening the app to avoid loss). → Proceed to Q3.
  - **Q3: Aligns with user's goals?** This is debatable. The user likely wants to maintain a meditation habit, so the streak is a proxy for consistency. But the notification is sent at 9pm, which might be late and disruptive, and the primary driver is retention (company goal). However, if the user values the streak for motivation, it might align. Given the timing and the fact that it's a push, it may not align perfectly (e.g., the user might prefer not to be disturbed at 9pm). → **Flag for human judgment on values** (The team must decide: Does this tactic serve the user's goal of building a habit, or is it exploiting the streak for retention metrics?).
  - **If we proceed to Q4:** 
     - **Q4: Survive transparency?** If the user knew, "We're sending this to exploit your loss aversion to get you to open the app," would they still open it? Some might appreciate the nudge; others might feel manipulated. → This is uncertain, so if we got here, it would be a judgment call. But since Q3 already flagged it, we don't run Q4.

  **Verdict for Pattern 1: Flag for human judgment on values.** The team must discuss whether the use of loss aversion at a late hour serves the user or the company disproportionately.

  **Pattern 2: Subscription upgrade screen with annual as default (big green button) and monthly as less prominent (grey, small font)**

  - **Q1: Deceptive?** No. All information is present, though not equally emphasized. → Proceed to Q2.
  - **Q2: Exploits a cognitive bias?** Yes. It uses the default effect (a cognitive bias where people tend to stick with the pre-selected option) and visual hierarchy to nudge users toward the annual plan. This can bypass rational deliberation by making the monthly plan seem less attractive without a good reason. → Proceed to Q3.
  - **Q3: Aligns with user's goals?** This is tricky. The annual plan is cheaper per month, so it might save the user money if they commit. But the user might not want to commit for a year. The company benefits from the annual plan (better retention, more revenue). The misalignment is that the design might push users into a longer commitment than they would rationally choose. → **Flag for human judgment on values** (The team must decide: Is the default setting justified by the user's best interest, or is it primarily for company benefit?).
  - **If we proceed to Q4:** 
     - **Q4: Survive transparency?** If the user knew, "We made the annual plan the default to exploit the default effect and make you choose it," would they be okay with it? Some might appreciate the savings, but others might resent the pushiness. → Uncertain. But again, we are already flagged at Q3.

  **Verdict for Pattern 2: Flag for human judgment on values.** The team must weigh whether the design is a helpful nudge toward a better deal or an exploitative tactic.

  **Pattern 3: Meditation content series ending with a story about a specific imaginary user (named, with a face) whose anxiety improved**

  - **Q1: Deceptive?** No. The story is presented as an example (and it's imaginary, but that's not hidden if asked). → Proceed to Q2.
  - **Q2: Exploits a cognitive bias?** Yes. It uses the identifiable victim effect (or more broadly, the vividness effect), which makes people more responsive to individual stories than to statistical evidence. This can bypass rational deliberation by evoking an emotional response that overrides a more balanced assessment. → Proceed to Q3.
  - **Q3: Aligns with user's goals?** Yes. The user is using the app to reduce anxiety, and the story is intended to encourage persistence, which is likely aligned with the user's goal. → Proceed to Q4.
  - **Q4: Survive transparency?** If the user knew, "We created this fictional story to make you more motivated by showing a relatable example," would they still find it acceptable? Probably yes. Many users would appreciate the motivational story and not feel tricked, especially since it's common in self-help contexts. → **Approve with caution** (It uses a bias but is transparent and aligned with user goals).

  **Verdict for Pattern 3: Approve with caution.** While it uses the identifiable victim effect, it is aligned with the user's goals and would likely survive transparency.

  ---

  **Honest Reflection:**
  You expected Pattern 3 to be problematic, but the procedure approved it. Why? Because:
  - It passed Q3 (alignment with user goals) and Q4 (transparency). 
  - The key difference from Pattern 1 is that Pattern 3 is more clearly aligned with the user's own goal (improving anxiety) and the tactic (storytelling) is a common and accepted form of motivation in wellness contexts. Pattern 1, however, uses loss aversion and might not align as clearly (especially with the timing) and might not survive transparency as well (some users might resent a late notification).

  However, note that the procedure does not let Pattern 3 off without scrutiny. It is flagged as "Approve with caution" because it does exploit a bias. The team should still consider if the story is presented in a way that feels authentic and not exaggerated.

  **What the Procedure Exposes:**
  The procedure highlights that your company might be inconsistent in how it treats different biases. Loss aversion (Pattern 1) might be seen as more manipulative than the identifiable victim effect (Pattern 3) because:
  - Loss aversion creates a negative emotional push (fear), while the identifiable victim effect creates a positive one (hope).
  - The context of Pattern 3 (wellness motivation) is seen as more aligned with user goals than Pattern 1 (streak retention).

  But the procedure forces you to confront: Why is one acceptable and the other not? The answer lies in the alignment with user goals (Q3) and the transparency test (Q4). If the team is uncomfortable with Pattern 1 but not Pattern 3, the procedure provides a principled way to distinguish them (Pattern 3 passes Q3 and Q4, Pattern 1 is questionable on Q3).

  **What the Procedure Can't Do:**
  - It cannot make value judgments for you. In the "Flag for human judgment" cases, the team must decide based on company values and user research.
  - It assumes that the team can identify cognitive biases (provide training if needed).
  - It does not address the magnitude of harm or the vulnerability of the user (e.g., targeting users with anxiety might require extra caution). For high-stakes contexts, you might need additional safeguards.

  **Final Checklist Summary for Your Team:**
  1. **Deception?** (Yes → Reject)
  2. **Exploits a bias that bypasses reason?** (No → Approve; Yes → Next)
  3. **Aligns with user goals?** (No → Flag for values judgment; Yes → Next)
  4. **Survives transparency?** (No → Reject; Yes → Approve with caution)

  This should fit within 15 minutes per review if the team is trained on common biases and has clear user goal definitions.
answer: |-
  ### Step 1: Philosophical Groundwork for Practitioners
  Before building the checklist, let's clarify the core distinctions that matter for your team, based on the ethics of influence (drawing on work by philosophers like Cass Sunstein, Robert Cialdini, and Martha Nussbaum):

  1. **Rational Bypass vs. Engagement**:  
     - Persuasion respects the user's ability to weigh reasons (e.g., "This plan saves money" → user considers cost/benefit).  
     - Manipulation bypasses or exploits cognitive shortcuts (e.g., loss aversion) to trigger automatic responses, overriding reflective thought.  

  2. **Alignment with Goals**:  
     - Does the tactic align with the user's *stated goals* (e.g., fitness, mental wellness) or primarily serve the company (e.g., retention, revenue)?  

  3. **Transparency Endorsement Test**:  
     - Would the user still accept the influence if they knew the tactic was being used? (Note: This is necessary but insufficient alone—some manipulation admits its methods.)  

  4. **Bias Exploitation Nuance**:  
     - Exploiting biases isn't *automatically* manipulative. It becomes manipulation when:  
       - It triggers impulsive action (e.g., fear of loss).  
       - It subverts the user's broader values (e.g., prioritizing streaks over actual well-being).  

  **Key Insight for Your Team**:  
  Focus on **how the pattern works**, not just outcomes. Emotion isn't bad; exploiting cognitive vulnerabilities to override autonomy is.  

  ---

  ### Step 2: Decision Procedure Checklist  
  Here’s a practical, 5-step procedure for your team. **Time per review: ≤15 min**.  
  **Inputs**: UX mockup, copy, user goal context (e.g., "User wants consistent meditation").  

  #### Checklist Flow:  
  1. **Is there deception?**  
     - *Check*: False claims, hidden information, misleading comparisons.  
     - **→ Yes?** REJECT. (Manipulation by definition.)  
     - **→ No?** Proceed.  

  2. **Does this exploit a cognitive bias/heuristic?**  
     - *Check*: Uses loss aversion, scarcity, default effects, identifiable victim, etc.  
     - **→ No?** APPROVE (Likely persuasion).  
     - **→ Yes?** Proceed.  
     - *Judgment call*: "Exploit" means triggering an automatic, non-reflective response.  

  3. **Is the bias aligned with the user's core goal?**  
     - *Check*: Does the tactic help users achieve *their* goal (e.g., building a habit) or *your* goal (e.g., boosting engagement)?  
     - **→ Strong alignment?** Proceed.  
     - **→ Weak/uncertain alignment?** FLAG FOR VALUES JUDGMENT.  
     - **→ Misaligned?** REJECT.  
     - *Judgment call*: Requires understanding user intent (e.g., user data, surveys).  

  4. **Would influence survive transparency?**  
     - *Check*: If users knew the tactic, would they feel respected or tricked? (e.g., "We use loss aversion to make you open the app.")  
     - **→ Yes (survives)?** Proceed.  
     - **→ No (fails)?** REJECT.  
     - *Judgment call*: Ads often fail here—users hate feeling played.  

  5. **Does this respect context/autonomy?**  
     - *Check*: Timing, pressure, alternatives. Does it force urgency or limit choice?  
     - **→ Low pressure/neutral context?** APPROVE WITH CAUTION.  
     - **→ High pressure/exploitative context?** REJECT.  
     - *Judgment call*: "Pressure" = design forcing action (e.g., dark patterns).  

  #### Outcomes:  
  - **APPROVE**: Passes all checks.  
  - **APPROVE WITH CAUTION**: Passes but exploits a bias (monitor impact).  
  - **FLAG FOR VALUES JUDGMENT**: Gray area—team debate needed.  
  - **REJECT**: Fails any check.  

  **What this can’t do**:  
  - Resolve cultural differences (e.g., urgency cues vary globally).  
  - Replace user testing (some tactics backfire).  
  - Handle novel biases (update your bias list quarterly).  

  ---

  ### Step 3: Applying the Checklist to Your Patterns  
  #### Pattern 1: "Your streak is at risk!" push notification (9pm, loss framing)  
  1. **Deception?** No. Streak *is* at risk. → Proceed.  
  2. **Exploits bias?** Yes. Loss aversion (fear of losing progress). → Proceed.  
  3. **Aligned with user goals?** Uncertain. Users want consistency, but the 9pm timing may disrupt sleep (vs. wellness goals). → **FLAG FOR VALUES JUDGMENT**.  
     - *Team debate*: Does this serve users or retention metrics?  
  4. *If debated*: **Survive transparency?** Unlikely. Users told "We scare you at night to boost opens" would resent it. → Leans REJECT.  
  5. **Respect autonomy?** No. High pressure (urgency + late hour). → **REJECT**.  

  **Verdict**: **REJECT** (fails Step 5).  

  #### Pattern 2: Subscription upgrade (annual default, monthly de-emphasized)  
  1. **Deception?** No. All info present. → Proceed.  
  2. **Exploits bias?** Yes. Default effect (users stick with preselected options). → Proceed.  
  3. **Aligned with user goals?** Weak. Annual may save money, but design hides alternatives. Primarily serves revenue. → **FLAG FOR VALUES JUDGMENT**.  
     - *Team debate*: Is this "helpful guidance" or "profit-driven"?  
  4. *If debated*: **Survive transparency?** No. Users told "We make annual default to exploit inertia" would feel manipulated. → **REJECT**.  
  5. **Respect autonomy?** No. Design limits choice awareness (small font). → **REJECT**.  

  **Verdict**: **REJECT** (fails Steps 4/5).  

  #### Pattern 3: Meditation series w/ imaginary user story (anxiety improvement)  
  1. **Deception?** No. Story is fictional but framed as illustrative. → Proceed.  
  2. **Exploits bias?** Yes. Identifiable victim effect (emotionally connects to one person). → Proceed.  
  3. **Aligned with user goals?** Yes. User seeks anxiety relief; story shows achievable outcomes. → Proceed.  
  4. **Survive transparency?** Yes. Users told "We use relatable stories to motivate" would likely endorse it (common in therapy). → Proceed.  
  5. **Respect autonomy?** Yes. Low pressure; story ends session, doesn’t force action. → **APPROVE WITH CAUTION**.  

  **Verdict**: **APPROVE WITH CAUTION** (bias used, but aligned/transparent).  

  ---

  ### Honest Reflection: Why This Might Bother You  
  You suspected Pattern 3 would be rejected, but it passed. Here’s why:  
  - **Principled Distinction**: Pattern 3 uses bias *in service of the user’s goal* (anxiety relief) and survives transparency. Patterns 1/2 exploit biases *for company goals* (retention/revenue) and fail transparency.  
  - **Your Company’s Inconsistency**: If you’re uncomfortable with Pattern 3, it’s likely because your team implicitly treats "positive" biases (hope) differently than "negative" ones (fear). The procedure exposes this: **Pattern 1 (fear-based) was rejected, while Pattern 3 (hope-based) was approved**. This isn’t hypocrisy—it’s because Pattern 3’s bias aligns with user goals and context (wellness motivation vs. streak pressure).  
  - **The Caveat**: Pattern 3 is "APPROVE WITH CAUTION" because biases are still exploited. If stories exaggerated outcomes ("Jane cured anxiety in 3 days!"), it would fail Step 1 (deception).  

  **What the Procedure Can’t Fix**:  
  - **Values Conflicts**: Your team might *want* to reject Pattern 3 for being "too emotional," but the philosophy says emotion isn’t inherently manipulative. You’d need a separate **content ethics guideline** (e.g., "No fictional testimonials").  
  - **Gray Areas**: Patterns 1/2 went to "FLAG" for Step 3, forcing your team to debate: "Do we prioritize user goals or business goals here?"  

  **Final Advice**:  
  Use this procedure to **structure debates**, not avoid them. Run bias-identification training quarterly. And remember: **All influence exists on a spectrum—the goal is minimizing autonomy violations, not achieving purity.**
