  Then I need to address how a theorist who accepts the right/wrong-kind distinction would handle this. They'd say the memoirs aren't admirable and the persistent admiration is unfitting, but they owe an explanation for how we can be morally required to cultivate an unfitting attitude without being criticizable for having it. This is the real pressure point the user identified.

  I should also analyze which elements are doing the work - likely the control scenario and the persistence requirement. If we drop persistence, the case becomes less challenging. Defenders of the distinction might argue that the moral reason actually supports a different attitude (like compassion) or that the grounds for admiration shifted over time.

  Finally, I need to honestly assess whether these four specifications can truly be satisfied together. The tension seems to be between requiring genuine admiration and having that admiration causally dependent on a moral reason. The moral reason might subtly alter what's being admired - not just the text but the act of creation itself. The control scenario helps isolate this, but the persistence requirement creates the deepest puzzle about whether attitudes can be "laundered" over time.
