answer: |-
  Below is a structured 90-minute session plan for your Church-Turing thesis workshop, designed to build understanding step by step and land the thesis as the closing insight. The sequence avoids technical jargon, focuses on concrete intuition, and preempts misconceptions at key points. I’ve refined your "clerk with paper cards" idea into a stronger example and mapped out timing, dependencies, and responses to common myths.

  ---

  ### **Session Goal**  
  Clarify that the Church-Turing thesis is a **bridge between an informal idea (mechanical computation) and formal models**—not a claim about physical machines. By the end, participants should see it as a "definition-like" claim about *what counts as computation*.

  ### **Core Metaphor**  
  **"You are a clerk with unlimited paper, following rules blindly."**  
  This embodies the informal notion of computation. Avoid arithmetic (e.g., adding numbers) since it primes people to think of machines. Use a **symbol-shuffling task** instead—it’s visual, requires no math, and highlights "blind" rule-following.

  ---

  ### **Session Plan (90 Minutes Total)**  
  **Key Principle:** *Delay defining the thesis until the end.* Build the informal idea first, then formal models, then the bridge.

  1. **Introduction: What Does "Computation" Mean? (5 min)**  
     - **Goal:** Surface intuitions.  
     - **Script:**  
       *"We use computers daily, but what is computation at its core? Is it math? Following instructions? Let’s strip away technology and find the essence."*  
     - **Activity:** Ask the group: *"If I asked you to compute something with only paper and pencil, what would you need?"* (Listen for: rules, steps, time, paper).  
     - **Preempt:** Don’t mention quantum/AI headlines yet—they’ll distract.

  2. **Act Out the "Human Computer" (20 min)**  
     - **Goal:** Make "mechanical computation" tangible.  
     - **Carrying Example:** **String Rewriting with Cards** (better than arithmetic—it’s visual, absurd, and machine-like).  
       - **Setup:** Draw 3 cards on the board: `A`, `A`, `A`. Rules:  
         1. If the first card is `A`, remove it and add `B C` to the end.  
         2. If the first card is `B`, remove it and add `A` to the end.  
         3. If the first card is `C`, **STOP**.  
       - **Process:**  
         - Start: `A A A` → Rule 1: Remove first `A` → Add `B C` → New: `A A B C`  
         - Next: `A A B C` → Rule 1: Remove first `A` → Add `B C` → New: `A B C B C`  
         - Continue until `C` appears first (e.g., `C...` → Rule 3: STOP).  
       - **Why it works:**  
         - Participants *act* as the clerk—no interpretation, just matching symbols.  
         - Emphasize: *Unlimited paper* (extend the board), *no creativity*, *rules are fixed*.  
         - **Outcome:** They experience "mechanical" computation. No deeper meaning needed—it’s about the *process*.  

  3. **Abstract the Informal Notion (15 min)**  
     - **Goal:** Define "effective computation" from the example.  
     - **Script:**  
       *"What did we just do? We had:  
       - Finite, unambiguous rules.  
       - A ‘computer’ (you!) that follows them blindly.  
       - Unlimited time and paper.  
       This is what we mean by ‘mechanical computation’—no magic, just rote work."*  
     - **Preempt Misconceptions Here:**  
       - *"Is this about real computers?"* → *"No—real machines have limits. This is a thought experiment: what *could* be computed with infinite resources?"*  
       - *"Could a human do this without paper?"* → *"The unlimited paper is key. Without it, you might forget—this captures the idea of unbounded memory."*  

  4. **Formal Models: Turing Machines (Simplified) (20 min)**  
     - **Goal:** Show how we formalize the clerk.  
     - **Activity:** Sketch a Turing Machine (TM) on the board:  
       - **Tape:** Infinite paper split into cells.  
       - **Head:** Reads/writes one cell at a time.  
       - **Rules:** "If in state X and see symbol Y, write Z, move left/right, go to state W."  
     - **Example:** Build a TM that shuffles symbols like our clerk:  
       - States: `START`, `SEE_A`, `SEE_B`, `STOP`.  
       - Rules:  
         - `START + A → Write A, move right, go to SEE_A` (etc.—mirror the card rules).  
     - **Key Insight:** *"This is a precise version of our clerk. The ‘states’ are like mental sticky notes."*  
     - **Preempt Here:**  
       - *"Is this how real CPUs work?"* → *"Real CPUs are *inspired* by TMs but are finite. TMs are a mathematical tool."*  
       - *"Are there other models?"* → *"Yes (mention lambda calculus briefly), but they all compute the same things—that’s a proven theorem."*  

  5. **The Church-Turing Thesis (15 min)**  
     - **Goal:** Present the thesis as the bridge.  
     - **Script:**  
       *"We have two ideas:  
       - **Informal:** What our clerk can do (mechanical computation).  
       - **Formal:** What a TM can compute.  
       The Church-Turing thesis says: *These are the same.* Any task solvable by our clerk is solvable by a TM, and vice versa."*  
     - **Stress:**  
       - It’s **not a theorem** (can’t be proven) because "mechanical" isn’t formal.  
       - It’s **not about technology**—it’s about defining the *boundary* of what is computable.  
     - **Preempt Final Misconceptions:**  
       - *"Wasn’t this proven?"* → *"No—it’s a thesis. Why? Because you can’t prove an informal idea matches a formal one. Evidence? All formal models (TMs, lambda calculus) agree, and no counterexample exists."*  
       - *"Does the halting problem refute it?"* → *"No! The halting problem shows *limits* of TMs—but the thesis says those limits apply to *all* mechanical computation. It reinforces the thesis."*  
       - *"Do quantum computers break it?"* → *"No—they’re still simulatable by TMs (just slower). The thesis allows for speed; it’s about what’s computable *in principle*, not efficiently."*  

  6. **Closing Question and Wrap-up (15 min)**  
     - **Goal:** Cement the thesis as a definition-like claim.  
     - **Final Question:**  
       *"Suppose we find a physical process (e.g., a black hole, quantum system) that ‘computes’ something. How would we test if it breaks the Church-Turing thesis?"*  
     - **Answer you want:**  
       *"We’d need to show it solves a problem *no TM could solve*, even with unlimited time. But the thesis claims that’s impossible—any ‘mechanical’ process is TM-simulatable. So we’d either disprove the thesis or show the process isn’t ‘mechanical’ (e.g., it uses magic!)."*  
     - **Wrap-up:**  
       *"The thesis isn’t about machines outcomputing TMs—it’s the idea that ‘mechanical computation’ is captured by TMs. It’s a foundation, not a forecast."*  

