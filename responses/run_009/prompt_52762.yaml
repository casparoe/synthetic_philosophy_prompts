prompt: |-
  I teach ethics to nursing students, and every year I hit the same wall with the care ethics unit: half the class thinks it's obviously right (pay attention to the particular patient, be kind, rules are for people who don't care enough) and half thinks it's just vibes dressed up as moral theory, and neither side can articulate what the disagreement is even about. So instead of another round of this, I want to figure out what people actually believe by sorting them with cases rather than labels.

  Write me a "which care-ethics position do you actually hold?" quiz — eight to ten questions, each one a concrete case with two or three answer options, plus a scoring key at the end. The positions I want to be able to sort my students (and myself) into are roughly:

  1. Justice-first: care is at best a virtue, not a foundation for ethics — the person whose instinct in any two-patients-one-bed situation is that the whole framework falls apart there.
  2. The "two lenses" view: care is a genuine alternative mode of moral reasoning, not reducible to justice, but the two work alongside each other and come apart on different kinds of cases.
  3. Relational/dyadic: what matters morally is the actual caring relation, and caring isn't complete until the cared-for receives it somehow — so caring for strangers at a distance, or care the other person refuses, is diminished or different in kind.
  4. Political/structural: the interesting unit isn't the nurse-patient dyad at all, it's who gets assigned the caring work — institutions, unpaid labor, dependency — and cases about those carry the real moral weight.
  5. Virtue-theoretic: care is best understood as a motivational disposition or character trait that can attach to any framework, so caring shows up the same way whether you're a Kantian or a utilitarian underneath.

  Since the whole point is diagnostic, some constraints: no question should be answerable by pattern-matching to a position's name, and no question may be so easy that all five positions give the same answer (so nothing like "should nurses be kind?"). The cases need to split the positions in non-obvious ways — I'm imagining things like the triage situation where caring harder for the patient you know conflicts with the rule; the competent patient who refuses your care outright; the caring work that's invisible because somebody's mother is doing it at home for free; and something where "caring" language is being used as cover for something worse, like controlling a patient's family through devoted attention.

  Two more things for the scoring key. First, flag which pairs of positions your questions genuinely can't seperate — I already suspect 2 and 5 will be hard to pull apart with cases, and I want to know if you agree and why. Second, note any answer pattern that comes out of the key but that no actual position occupies, and say in one sentence whether that's because the combo is incoherent or just unexplored. Keep the language at a level my students can read without a philosphy degree — they're smart, but they haven't read any of this stuff.
reasoning: |-
  Okay, let me tackle this ethics professor's challenge. They're frustrated with how care ethics divides their nursing students into two camps that can't articulate their differences. The request is clever - a diagnostic quiz using concrete cases to sort students into five nuanced positions without relying on jargon.

  Hmm, the key challenges here are:
  First, designing cases that create meaningful splits between positions. For example, Justice-first vs Relational/dyadic should conflict in triage situations. Political/structural needs cases highlighting systemic issues like unpaid care work. Virtue-theoretic should be distinguishable through motivation-focused scenarios.

  Second, avoiding dead giveaways. No questions where all positions agree (like "should nurses be kind?") or where answers map too obviously to labels. Cases must feel authentic to nursing - the "two patients one bed" dilemma is perfect.

  Third, handling the scoring complexities. Positions 2 (two lenses) and 5 (virtue-theoretic) might overlap in cases about motivation vs framework. Need to flag that. Also watching for "orphan" answer patterns that don't fit any position.

  Let me brainstorm cases that probe fault lines:
  - A triage scenario where emotional connection conflicts with rules (splits Justice-first from others)
  - Refused care by competent patient (tests Relational/dyadic)
  - Family providing unpaid care (exposes Political/structural)
  - Manipulative "caring" behavior (catches Virtue-theoretic)

  For scoring, I'll build a grid showing how each position answers. Important to note where positions converge (e.g. 2 and 5 both approving kind motivation) and where combinations might be incoherent (e.g. valuing systemic change while dismissing actual care relations).

  The language must stay accessible - these are nursing students, not philosophy majors. Cases should feel real: medication refusals, staffing shortages, family dynamics. Explanations will avoid terms like "deontological" and instead say "following rules strictly."

  Finally, I'll include that requested analysis of which positions the quiz can't separate and why - probably 2 and 5 unless motivation vs framework distinction is sharp enough in the cases.
answer: |-
  Here’s a diagnostic quiz designed to tease apart the five care-ethics positions through concrete nursing dilemmas. Each case forces tradeoffs between key values (rules, relationships, systems, virtues, outcomes) and avoids obvious "right" answers. Positions are abbreviated: **J** (Justice-first), **L** (Two Lenses), **R** (Relational/Dyadic), **P** (Political/Structural), **V** (Virtue-Theoretic).

  ---

  ### **Which Care-Ethics Position Do You Hold?**
  **Instructions:** For each scenario, pick the answer *closest* to your instinct. There are no trick questions—go with your gut.

  1. **Triage with a Twist**  
     During a disaster, you must allocate the last ventilator. Patient A is a stranger with a 70% survival chance. Patient B is your longtime neighbor with a 60% chance. The hospital’s triage protocol says to prioritize higher survival odds.  
     - **A.** Follow the protocol strictly (choose Patient A).  
     - **B.** Choose Patient B—your relationship and knowledge of their life matter.  
     - **C.** Reject the dilemma: protest that the *system* failed by not having enough ventilators.  

  2. **The Refused Blanket**  
     An alert, competent patient with a fever refuses your offer of a warmed blanket, saying, "I hate being fussed over." You notice they’re shivering.  
     - **A.** Insist gently: comfort is part of care, and you know what’s best here.  
     - **B.** Respect the refusal—their autonomy is paramount.  
     - **C.** Offer once more, then drop it; true care requires their acceptance.  

  3. **Invisible Labor**  
     A diabetic patient’s A1c improves dramatically. You learn it’s because his retired sister moved in, cooks all meals, and monitors his insulin—unpaid and exhausted.  
     - **A.** Praise the sister’s dedication; her care is admirable.  
     - **B.** Refer the sister for caregiver support—this is unsustainable.  
     - **C.** Feel angry: the system exploits family labor instead of providing funded care.  

  4. **"Caring" Control**  
     A colleague spends hours daily with an elderly patient’s daughter, listening to her anxieties and advising her on care decisions. This "support" subtly steers the daughter toward choices the nurse prefers (e.g., delaying hospice).  
     - **A.** This is excellent care—building trust with families is crucial.  
     - **B.** It’s overreach; the nurse’s role is to inform, not influence.  
     - **C.** It’s manipulation disguised as care; motivation matters most.  

  5. **Rule vs. Relationship**  
     Hospital policy bans nurses from accepting gifts. A grieving family whose child you cared for years offers a handmade scarf.  
     - **A.** Decline politely; rules prevent bias or perceived favoritism.  
     - **B.** Accept it—this gesture honors your relationship and their healing.  
     - **C.** Accept but disclose it to your manager to maintain transparency.  

  6. **The Unreachable Patient**  
     You’re assigned to write sympathy cards to families of deceased patients you never met, using templated messages.  
     - **A.** It’s a worthwhile task; kindness matters even impersonally.  
     - **B.** It’s hollow—care requires a real connection.  
     - **C.** It’s exploitative; emotional labor should be voluntary and recognized.  

  7. **Staffing Shortfall**  
     Your unit is short-staffed. To spend more time with an anxious patient, you skip auditing another stable patient’s charts (a minor risk).  
     - **A.** Justified—direct care trumps paperwork for isolated patients.  
     - **B.** Wrong—rules (like chart audits) protect all patients fairly.  
     - **C.** Symptomatic of a broken system that forces impossible choices.  

  8. **Motivation Check**  
     Two nurses give identical meticulous physical care to a comatose patient. Nurse A feels deep compassion. Nurse B is indifferent but professional.  
     - **A.** Nurse A’s care is morally better—caring *feeling* is essential.  
     - **B.** Both are equally good—outcomes and duty matter, not feelings.  
     - **C.** Nurse A’s care is better *if* the patient could sense it; otherwise, no difference.  

  ---

  ### **Scoring Key**
  Tally your answers and match to positions below. **Positions are mutually exclusive except L and V, which often overlap (see analysis)**.

  | Answer | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
  |--------|---|---|---|---|---|---|---|---|
  | **J**  | A | B | A | B | A | B | B | B |
  | **L**  | B | C | B | B | B | A | A | A |
  | **R**  | B | C | A | A | B | B | A | C |
  | **P**  | C | B | C | C | C | C | C | B |
  | **V**  | A/B | A | A | C | B | A | A | A |

  - **Mostly A’s**: **Justice-First (J)**  
    You prioritize rules, impartiality, and universal principles. Care is virtuous but secondary to fairness.  
  - **Mostly B’s**: **Two Lenses (L) OR Virtue-Theoretic (V)**  
    *L*: Care complements justice—relationships matter in context. *V*: Care is a virtue applicable within any system.  
  - **B’s + Specific A’s (Q4C, Q8C)**: **Relational/Dyadic (R)**  
    Care is incomplete without mutual recognition; the relationship itself is moral bedrock.  
  - **Mostly C’s**: **Political/Structural (P)**  
    Ethics is about systems, power, and who bears care burdens—not individual acts.  

  ---

  ### **Key Diagnostics & Limitations**
  1. **Indistinguishable Positions**:  
     - **L (Two Lenses) and V (Virtue-Theoretic)** often score similarly. They split only if:  
       - *Q4*: V picks C (motivation critique), L picks B (relational focus).  
       - *Q8*: V picks A (feeling matters), L *could* pick A or B (context-dependent).  
     - **Why?** Both value care as *part* of ethics but don’t make it foundational. Cases struggle to separate "mode of reasoning" (L) from "motivation" (V).  

  2. **"Orphan" Answer Patterns**:  
     - **High C’s + A’s in Q3/Q8**: Mixes structural critique (P) with virtue (V) or relational (R) views. *Likely unexplored*—combines systemic awareness with individualist ethics.  
     - **Mostly B’s + Q7C**: Blends justice (B in Q7) with structural critique (C). *Incoherent*—justice frameworks rarely blame systems without rule-breaking.  

  3. **Why Cases Split Positions**:  
     - **J vs. Others**: Q1, Q5, Q7 force rules vs. exceptions.  
     - **R vs. L/V**: Q2, Q6, Q8 test if care requires reciprocity.  
     - **P’s Isolation**: Q3, Q6, Q7 highlight systems over individuals.  
     - **V’s Nuance**: Q4, Q8 probe motivation vs. action.  

  ---

  **How to Use This**:  
  - Have students self-score, then discuss *why* cases split them—e.g., "If you chose 1B, what makes the neighbor different?"  
  - Highlight overlaps (L/V) to show where theories blur in practice.  
  - Assign readings based on results (e.g., Tronto for P, Noddings for R).  

  This quiz avoids labels by forcing concrete choices—revealing that the "vibes vs. theory" divide often masks clashes between **impartial rules**, **relational bonds**, and **systemic critique**.
