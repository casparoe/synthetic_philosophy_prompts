prompt: |-
  You're a philosopher of probability and decision theory, so hopefully you can help me name a thing. A friend of mine who does risk analysis has a way of handling uncertainty that I've started noticing everywhere, and I want to know if there's an established concept for it.

  Concretely: ask her "what are the odds the subcontractor delivers on time?" and she won't give you a number. She'll say something like "somewhere between 2 and 5 out of 10, and I genuinely can't narrow it." Push her for a single best estimate and she refuses -- she says any one number would misrepresent the situation, and that the width of the range is itself part of what she knows. Second thing: she'll only bet when she'd come out ahead under every number in the range. Offer her a bet priced at the middle of her range and she's not interested, which seems to brake the usual logic that a fair bet at your own price should be fine to take either way. Third thing: she'll sometimes pick an option with a known 30% chance over one she'd peg at "25 to 40", even though 30 sits right inside that range -- she says with the first one she actually knows what she's getting.

  I half remember the Ellsberg urn stuff, where people prefer drawing from the urn with the known ratio, but this feels like more than that, because she's not just preferring the known option, she's also refusing to compress the unknown one into a single probability, and she treats the width of the range as information rather than as sloppy thinking. Is there a name for this whole package? Is it just risk aversion in a costume (it doesn't seem like it, since you can construct cases where the two options have the same spread of outcomes and she still prefers the one with the crisp number)? Please think carefully and brainstorm some candidate concepts before you answer -- tell me which established ideas are the nearest fits, where exactly her practice parts ways with each, and if nothing fits cleanly, coin a term for it with a definition and a couple of boundry cases. I don't need a reading list, just the concept carving. Also please say how confident you are in each part of what you claim, and single out the point you're least sure of.
reasoning: |-
  Okay, the user is describing a friend's approach to probability and decision-making that seems systematic and distinct from standard models. They've noticed three key behaviors: refusal to collapse probability ranges into point estimates, betting only when favorable across the entire uncertainty range, and preference for known probabilities even when they fall within an imprecise estimate. 

  Hmm, this feels familiar but not quite like any single concept I know. The Ellsberg paradox comes to mind immediately because of the known-unknown preference, but that's only one piece. The betting behavior reminds me of robust control or Wald's maximin criterion, yet those are usually about outcomes not probabilities. 

  Let me unpack this carefully. First, the probability range retention - that's strongly reminiscent of imprecise probability frameworks like Levi's interval-valued credences. But Levi expects decision-making through E-admissibility, which this person isn't doing. Instead, she's applying strict dominance across the entire range, which is more extreme. 

  The betting refusal is fascinating. Standard Dutch book arguments would say you should accept bets at your true probability, but she rejects even bets at her range's midpoint. That suggests she doesn't have an implicit precise probability at all. Maybe she's treating the range as fundamental uncertainty that can't be averaged away. 

  The known probability preference case is particularly telling. Choosing 30% certain over 25-40% ambiguous despite 30 being inside the range? That goes beyond standard ambiguity aversion models. It implies the range width itself has disutility, almost like uncertainty aversion is a cost center. 

  I'm mentally testing boundary cases. What if two options have identical outcome distributions but one has precise probabilities while the other is imprecise? Would she still prefer the precise one? The user hints yes, which rules out standard risk aversion. And if the range were infinitesimally narrow, would she behave classically? Probably, suggesting continuity. 

  The closest frameworks seem to be: 
  - Knightian uncertainty (but usually about outcomes)
  - Imprecise probability (without standard decision rules)
  - Info-gap decision theory (minimax over uncertainty space)

  But none capture all three behaviors together. Maybe this is a hybrid approach - call it "range-rigorous uncertainty aversion"? Defining it would require specifying: 1) epistemic commitment to non-collapsible ranges, 2) strict dominance decision rule over the range, 3) intrinsic disutility of uncertainty width. 

  Least confident about whether the range width disutility is separable from outcome valuation - that might need experimental testing. But overall, this feels like a coherent if unconventional approach worthy of its own designation.
answer: |-
  Based on your description, your friend exhibits a coherent and distinctive approach to uncertainty that blends elements of established concepts but forms a unique "package." Here's a systematic breakdown:

  **Core Components of Her Approach:**
  1.  **Epistemic Commitment to Imprecision:** She refuses to collapse genuine uncertainty into a single probability, viewing the range width *itself* as crucial information about the state of her knowledge (or lack thereof). (Confidence: **High** - This is clearly described).
  2.  **Strict Dominance Decision Rule:** She only acts (e.g., bets, chooses) when an option is favorable/acceptable *under every possible probability value within her stated range*. (Confidence: **High** - Directly stated re: betting).
  3.  **Intrinsic Disutility of Uncertainty:** She prefers options with known probabilities even when they fall *within* the range of an imprecise estimate, suggesting the *imprecision itself* carries a cost or disutility beyond the spread of potential outcomes. (Confidence: **High** - The 30% vs. 25-40% choice demonstrates this).

  **Comparison to Established Concepts & Where They Part Ways:**

  1.  **Imprecise Probability / Credal Sets (Levi, Walley, etc.):**
      *   **Fit:** Excellent fit for Component 1. Imprecise probability frameworks formalize representing belief as sets of probabilities (intervals, sets of distributions) precisely because knowledge is incomplete.
      *   **Part Ways:** The core divergence is in the **decision rule**. Standard imprecise probability uses rules like *E-admissibility* (an option is admissible if it maximizes expected utility for *some* probability in the set) or *Maximin EU* (maximize the minimum expected utility over the set). Her rule (Component 2) is stricter: **Strict Dominance over the Credal Set** (only choose an option if its EU is greater than the alternative *for every single probability* in the set). She requires *guaranteed* favorability across the entire uncertainty range. The known probability preference (Component 3) also aligns well with interpretations within imprecise probability about the "cost" of unresolved uncertainty.

  2.  **Ellsberg Paradox / Ambiguity Aversion:**
      *   **Fit:** Excellent fit for Component 3. Ellsberg demonstrates the preference for known probabilities over ambiguous ones (unknown composition urns), even when the ambiguous range *contains* the known probability.
      *   **Part Ways:** Ellsberg focuses primarily on the *preference* for known risks. Your friend's approach adds **formal epistemic representation (Component 1)** – explicitly refusing to state a single number and treating the range as fundamental knowledge – and a **specific, extreme decision rule (Component 2)** derived from that representation. Ambiguity aversion is usually modeled by modifying the decision rule (e.g., Maxmin EU, alpha-Maxmin) but doesn't inherently demand non-collapsible representation or *strict* dominance.

  3.  **Robust Control / Wald's Maximin Criterion:**
      *   **Fit:** Good fit for Component 2. Maximin chooses the option with the best worst-case outcome. Her betting rule (only bet if favorable in *all* cases) is a form of maximin over the uncertainty set *for that specific decision*.
      *   **Part Ways:** Robust control often focuses on uncertainty over *states of the world* or *model parameters* affecting *outcomes*, not necessarily over the *probabilities themselves* as a fundamental epistemic stance (Component 1). It usually doesn't inherently incorporate the intrinsic cost of epistemic imprecision (Component 3) – the preference is driven solely by avoiding the worst outcome, not by disliking the *fuzziness* per se.

  4.  **Risk Aversion:**
      *   **Fit:** Poor fit. Risk aversion concerns aversion to variability in *outcomes* (e.g., preferring a certain $50 over a 50/50 gamble for $0/$100). Your friend's behaviors are about aversion to *epistemic uncertainty* (lack of knowledge about probabilities), not outcome variability per se.
      *   **Part Ways:** As you noted, she prefers a crisp 30% over a range of 25-40% even though the *outcome distribution* associated with the range might have the *same or less* variability than the known 30% (e.g., if the range represents a symmetric unimodal belief). Her aversion is to the *uncertainty about the chance itself*, not the potential spread of results. Component 1 and 3 are fundamentally about epistemology, not outcome valuation.

  5.  **Info-Gap Decision Theory (Ben-Haim):**
      *   **Fit:** Moderate conceptual fit. Info-gap models severe uncertainty by defining a set of possible models/deviation from a baseline, without probabilities. Decisions focus on robustness (immunity to failure) or opportuneness.
      *   **Part Ways:** Info-gap doesn't use probability intervals; it uses uncertainty sets around parameters. Its core decision rules (robustness/opportuneness) are different from her strict dominance over a probability range. The intrinsic disutility of uncertainty (Component 3) isn't a primary focus.

  **Conclusion & Naming:**

  No single established concept perfectly captures the **integrated package** of 1) committed non-collapsible epistemic representation via probability intervals, 2) a strict dominance decision rule over that entire interval, and 3) an intrinsic disutility for the width of the interval itself.

  **Coined Concept: Range-Rigorous Uncertainty Aversion (RRUA)**

  **Definition:** A decision-making framework characterized by:
  1.  **Epistemic Rigor:** Beliefs about event likelihoods are represented as non-collapsible probability intervals (or sets), where the width is an explicit measure of epistemic uncertainty.
  2.  **Interval Dominance Criterion:** An option is chosen only if it yields a preferred outcome (e.g., higher expected utility, or simple preference in choice tasks) compared to alternatives *under every single probability value within the stated interval*.
  3.  **Uncertainty Disutility:** Options characterized by precise probabilities are strictly preferred over options characterized by imprecise probabilities (intervals), *even when* the precise value lies within the interval, due to an intrinsic cost or aversion associated with the state of epistemic uncertainty itself.

  **Boundary Cases:**

  1.  **Infinitesimally Narrow Range:** If her epistemic state justifies an extremely narrow range (e.g., 49.999% to 50.001%), RRUA converges to standard precise probabilistic reasoning and decision-making. (Tests the continuity/necessity of genuine imprecision).
  2.  **Dominance Within Range, Ambiguity Outside:** Suppose Option A has a known 40% success chance. Option B has an imprecise chance estimated between 25% and 45%. Under RRUA, she *cannot* choose B over A because at 25%, B is worse than A. However, if offered Option C with a known 20% chance, she *can* choose A over C (strict dominance holds: 40% > 20%). This contrasts with Maxmin EU over the interval, which might choose B over C if the *minimum* EU of B (at 25%) > EU of C (20%), even though B is worse than A at 25%. (Highlights the strictness of the dominance rule).
  3.  **Identical Outcome Distribution, Different Epistemic States:** Offer a gamble based on a known-fair coin (50% heads) vs. a gamble based on an Ellsberg urn with precisely 50 red/50 black balls (unknown ratio). Both offer identical *potential outcome distributions* (50/50). Standard risk aversion is indifferent. RRUA strictly prefers the known-fair coin due to Uncertainty Disutility (Component 3), despite the identical risk profile. (Demonstrates the core distinction from risk aversion and the focus on epistemic state).

  **Confidence Assessment:**

  *   **High Confidence:** The diagnosis of Components 1, 2, and 3 as distinct and integrated; the poor fit of standard risk aversion; the good partial fits of Imprecise Probability, Ellsberg/Ambiguity Aversion, and Robust Control/Maxmin; the need for a new term to capture the integrated package.
  *   **Moderate Confidence:** The specific label "Range-Rigorous Uncertainty Aversion (RRUA)" and its definition. While it accurately describes the observed behaviors, other terms like "Interval-Dominant Uncertainty Aversion" or "Epistemic Range Strictness" could also be argued. The core elements of the definition are solid.
  *   **Lower Confidence (The point I'm least sure of):** Whether the intrinsic **Uncertainty Disutility** (Component 3) is *always* separable from potential subtle differences in the *implied outcome distributions* that an imprecise probability might represent (even if the mean/variance appear similar). While your friend's stated reasoning ("I actually know what I'm getting") strongly suggests it's primarily epistemic, rigorously disentangling this in all conceivable scenarios is challenging. This is the aspect most open to potential alternative interpretations or requiring more experimental nuance. However, within the described behaviors, the epistemic interpretation is the most parsimonious and consistent.
