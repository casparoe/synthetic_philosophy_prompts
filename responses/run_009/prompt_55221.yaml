  me and a friend have been going back and forth for months on trolley cases and the doctrine of double effect. The standard story is that diverting the trolley onto the one person is ok because their death is foreseen but not intended, while pushing the guy off the footbridge is wrong because his death is the means. But it seems to me you can almost always redescribe what you're doing so the bad part falls outside the "means" — like, the guy on the bridge isn't being used as a means, he's a "diverter of the trolley", and the surgeon in the transplant case is just "rearranging who gets treated first". So either the doctrine works off how the agent frames the act in their own head (in which case it looks like you could launder any killing just by adopting the right description), or it tracks some fact out there in the world, and I honestly can't see what that fact would be. Write an essay that takes this worry seriously and reaches an actual verdict — don't sit on the fence. The question: can the doctrine of double effect really draw the intended/foreseen line, and if it can, where does the line live: in the agent's head, in the causal structure of the situation, or somewhere else? If the answer is that the doctrine can't do the job, say what, if anything, should replace it for explaining why the footbridge case feels so different.
