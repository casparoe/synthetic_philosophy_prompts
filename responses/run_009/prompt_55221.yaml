  Hmm, the user is grappling with a classic ethical dilemma involving the trolley problem and the doctrine of double effect (DDE). They've been debating with a friend for months about whether DDE can genuinely distinguish between permissible and impermissible killings based on intention versus foresight. Their main concern is that intention seems too malleable—agents can simply redescribe their actions to make the bad consequences appear unintended. They want a definitive answer: where does the distinction between intended and foreseen consequences actually reside? Is it in the agent's mind, in the causal structure, or is DDE fundamentally flawed? They're explicitly asking not to sit on the fence.

  This is a deep philosophical question that cuts to the heart of moral psychology and action theory. The user seems philosophically sophisticated—they're already familiar with standard counterarguments like redescribing the footbridge case as "activating a trolley diverter" or the organ transplant as "rearranging treatment priorities." Their frustration is palpable; they want resolution, not more hand-waving.

  The core tension they identify is real: if intention is just a matter of description, DDE becomes vacuously permissive. But if it's about objective causal structures, we need to specify what those structures are without circularity. Let me break this down systematically.

  First, the "in the head" view: If intention is purely subjective, DDE collapses because any rational agent can adopt a convenient description (e.g., "I'm not pushing a man; I'm deploying a trolley-stopping device"). This makes morality disturbingly elastic. 

  Second, the "causal structure" view: We might say intended means are those causally necessary for the end. In the footbridge case, the man's death is causally necessary to stop the trolley; in diversion, the one death is a byproduct of redirecting the trolley. But clever redescriptions seem to bypass this—what if we call the footbridge push "initiating a trolley obstruction sequence"? The causal necessity remains identical. 

  Third, perhaps it's about telos—what the action fundamentally is. Thomson tried this with the "claims" idea, but it's murky. Anscombe's direction-of-fit helps: intended outcomes are those we'd try to achieve even if circumstances changed. If the footbridge man miraculously survived but still stopped the trolley, the agent would be displeased; in diversion, if the one worker survived, the agent would be relieved. But this test feels post hoc. 

  The deepest worry is that DDE might be circular: we label certain acts (like pushing) as "involving intention to harm" because we already deem them immoral, not vice versa. This would make DDE explanatorily empty. 

  Given all this, I think the most honest verdict is that DDE fails as a standalone principle. It doesn't draw the line robustly. But we shouldn't discard intention entirely—it's part of a larger moral picture. Instead, we should adopt a dual-aspect view: intention matters, but so do objective factors like causal roles and victim rights. In footbridge, you're violating the bystander's right not to be used as a tool; in diversion, you're allowing a death while minimizing harm without direct violation. This preserves the intuition that footbridge feels like "murder" while diversion feels like "tragic choice," without relying on DDE's shaky distinction. 

  The user asked for no fence-sitting, so I'll conclude bluntly: DDE can't do the job alone. We need to supplement it with patient-centered constraints. The "feels different" factor comes from respecting persons versus optimizing outcomes.
