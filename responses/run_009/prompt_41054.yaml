answer: |-
  ### Rules Fitting the Verdicts
  Two candidate rules explain the housemate's track record:
  1. **Fact/Evaluation Distinction**: Testimony transmits non-evaluative facts about artworks but not aesthetic evaluations. This fits:
     - Suspenseful (evaluation, no knowledge without experience).
     - Second-century BCE (fact, knowledge without seeing).
     - Inventive (evaluation, no knowledge without eating).
     - Building layout (fact, knowledge sight unseen).
     
  2. **Engagement Requirement**: Testimony transmits information where grasping the property does not require firsthand engagement with the work, but fails where personal engagement is essential. This fits:
     - Suspenseful (requires watching, no knowledge).
     - Second-century BCE (no engagement needed, knowledge).
     - Inventive (requires tasting, no knowledge).
     - Building layout (no engagement needed, knowledge).

  ### Prediction for the Unresolved-Ending Case
  - **Rule 1 (Fact/Evaluation)**: The ending's unresolved nature is arguably both a plain fact (the text objectively lacks resolution) and an aesthetically loaded feature (affecting interpretation). This makes the distinction unstable here. If treated as fact, Rule 1 predicts knowledge; if evaluation, no knowledge. Ambiguity remains.
  - **Rule 2 (Engagement Requirement)**: Grasping that the ending is unresolved could be seen as requiring reading the text to experience the ambiguity (like suspense), so no knowledge without engagement. However, it might also be reportable like the building layout (a design fact), suggesting knowledge. Rule 2 leans toward no knowledge, as unresolved endings often involve experiential engagement to "feel" the ambiguity.

  **Best Guess**: She will **not** say she knows the ending is unresolved before reading the book.  
  **Reasons**: 
  - The unresolved ending resembles suspense and inventiveness—it is an aesthetic feature requiring personal engagement to fully grasp (e.g., to experience the narrative ambiguity). 
  - Her pattern shows skepticism toward testimony for properties that are "felt" or interpreted through direct experience, even if they have factual components. 
  - The building layout and sculpture date are purely functional/historical facts, not core to the work's aesthetic engagement, unlike the novel's ending.

  ### Further Case to Distinguish Rules
  **Case**: A trusted art historian tells her that a painting uses chiaroscuro (a technique of light and shadow) to create dramatic tension. She hasn't seen the painting. Does she know it uses chiaroscuro?

  - **Rule 1 (Fact/Evaluation)**: Chiaroscuro is a factual technique (knowledge), but "dramatic tension" is evaluative (no knowledge). Verdict depends on which part she focuses on.
  - **Rule 2 (Engagement Requirement)**: Chiaroscuro can be described factually without engagement (knowledge), but grasping its effect on tension may require seeing it (no knowledge). Verdict may split.

  **What Her Verdict Shows**: 
  - If she says she knows both parts, it supports Rule 1 (treating technique as fact). 
  - If she knows about chiaroscuro but not the tension effect, it supports Rule 2 (engagement needed for experiential outcomes). 
  - This case tests the stability of the fact/evaluation divide and whether engagement is required for technique versus effect.
