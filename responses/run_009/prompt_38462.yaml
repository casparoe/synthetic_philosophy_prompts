prompt: |-
  My roommate went down a probability rabbit hole last weekend and now won't stop explaining things to everyone. Over dinner he gave me his version of the two-envelope paradox, roughly like this: you're given a choice of two envelopes, one contains twice as much money as the other, and after you pick one you're offered the chance to switch. Call the amount in your envelope X. The other envelope contains either 2X or X/2, and since you know nothing that distinguishes the two situations, each has probability 1/2. So the expected value of switching is (1/2)(2X) + (1/2)(X/2) = 1.25X, meaning switching is always worth 25% more than staying. But the exact same reasoning applies to the other envelope once you've switched, so you should want to switch back, and back again, forever. According to him this means expected utility theory literally contradicts itself, and it's a wound decision theorists have never managed to close -- still an open problem, he says, proof that the math of rational choice is broken somewhere. He also claims it's basically the same thing as the St. Petersburg paradox wearing a different hat.

  The annoying thing is the algebra is easy enough that I checked it myself and it looks fine, which makes me think the trick is hiding somewhere I definately can't see it. And 'a rational person swaps envelopes forever' seems too dumb to be what the theory actually implies, but I can't say why.

  Can you go through his explanation part by part and tell me which parts a decision theorist would accept as stated, where the sleight of hand actually is, and whether the conclusions follow once it's fixed -- both the 'expected utility theory contradicts itself' part and the 'still unresolved' part? And is he right that it's basically the St. Petersburg paradox over again? Keep it under 400 words, I want to be able to read it back to him at dinner.
reasoning: |-
  Hmm, the user is dealing with their roommate who's obsessed with the two-envelope paradox. The roommate claims it shows a fatal flaw in expected utility theory and that it's an unsolved problem similar to the St. Petersburg paradox. The user wants me to dissect this argument step by step.

  Looking at the paradox itself: You have two envelopes with money, one containing twice as much as the other. After picking one, you calculate that switching gives an expected value of 1.25X (where X is the amount in your current envelope). This suggests you should always switch, but then the same logic applies to the other envelope too, creating an infinite switching loop. That does seem contradictory!

  The key flaw is in how X is defined. X isn't a fixed amount - it changes based on which envelope you're holding. When you say "the other envelope contains either 2X or X/2", that assumes X is constant, but it's actually relative to your current choice. This creates a problem because the possible values for the smaller amount (let's call it A) are fixed, but X could be either A or 2A depending on which envelope you have.

  For example: if the actual amounts are $50 and $100, and you pick the $100 envelope (X=$100), then switching gives either $200 (if you're wrong) or $50 (if you're right). But if you pick the $50 envelope (X=$50), switching gives either $100 or $25. The probabilities aren't symmetric like the 50-50 split assumes.

  The St. Petersburg comparison isn't quite right either. While both involve infinite expectations, St. Petersburg deals with a single game with unbounded payoffs, whereas this is about misapplying expectation calculations when states aren't symmetric. The two-envelope paradox actually has several resolutions in decision theory literature, like using proper prior distributions or recognizing the state-dependence.

  The user wants this explained clearly enough to recite back to their roommate at dinner, so I'll keep it concise while addressing the core misconceptions: the flawed probability assumption, why it's not truly paradoxical, and why it's different from St. Petersburg.
answer: |-
  Here's a breakdown of your roommate's argument, where it goes wrong, and the resolution:

  1.  **"Call the amount in your envelope X."** ✅ Accepted. This is just labeling.
  2.  **"The other envelope contains either 2X or X/2."** ✅ Accepted. By the setup, one envelope has twice the other.
  3.  **"...each has probability 1/2."** ❌ **This is the sleight of hand.** You *cannot* assume the two possibilities (other = 2X or other = X/2) are equally likely *without knowing the possible values of the smaller amount*. `X` is *not fixed*; it depends on which envelope you initially picked. If the smaller amount is `A`, then `X` is either `A` or `2A`. The states "I have `A`" and "I have `2A`" are fundamentally different, and assigning them equal probability 1/2 is invalid without justification for that specific `A`. The paradox arises because this probability assumption smuggles in inconsistent values for `A`.

  **Why the conclusion doesn't follow:**
  *   The expected value calculation `(1/2)(2X) + (1/2)(X/2) = 1.25X` is mathematically correct *only if* the 1/2 probabilities are valid. Since they aren't generally valid, the result `1.25X` is meaningless. Expected utility theory does not contradict itself; the flawed *application* of it does.

  **Is it unresolved?**
  *   No. The flaw is well understood. Resolutions involve specifying a prior probability distribution over the possible smaller amounts `A`. Once a proper prior is set (e.g., "`A` is equally likely to be any integer between $1 and $100"), the expected value of switching can be calculated correctly and is *not* always 1.25X. Sometimes switching is good, sometimes bad, sometimes neutral, depending on your `X` and the prior. The infinite switching loop disappears.

  **St. Petersburg Connection?**
  *   Superficially yes, both involve infinite expectations causing issues. But they are distinct:
      *   **St. Petersburg:** Involves a *single* game with an unbounded payoff structure leading to an infinite expected value, challenging what we'd pay to play.
      *   **Two Envelopes:** Involves *misapplying expectation* across incompatible states due to an undefined/improper prior. Once a proper prior is defined, the expectation is finite and well-behaved. The core issue is different.

  **In short:** The flaw is assuming P(other=2X) = P(other=X/2) = 1/2 without justification. This creates the illusion of a paradox. Specifying possible values for the smaller amount resolves it cleanly. Expected utility theory isn't broken; the initial probability assignment was invalid. It's not the same as St. Petersburg.
