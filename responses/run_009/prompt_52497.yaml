answer: |-
  The paradox dissolves when we reject the causal-decision-theoretic (CDT) framing of the isolated act and instead adopt an updateless, policy-based perspective. CDT evaluates acts solely by their *causal consequences* in the immediate context, treating the agent's decision as a unique event. This generates the paradox: refusing to kill one to save five appears to ignore the arithmetic of harm. But deontology isn't evaluating a causally isolated act; it's executing a *policy* selected from a broader perspective where the agent recognizes herself as one instance of a generalized decision-making procedure applied across many similar agents and situations. This policy-focused view aligns with updateless decision theories (UDT) or logical decision theory (LDT), where agents choose *in advance* how to respond to decision problems based on the expected outcomes of their *strategy* across all instances where that strategy is invoked.

  Consider the analogy to Newcomb’s Problem. The one-boxer doesn't take only one box because it causes the predictor to have put money there (it doesn't; the boxes are sealed). They take one box because their *policy* of one-boxing is what leads the predictor (a correlate of their decision algorithm) to fill the box. The value lies in the policy’s *across-all-cases* performance, not the causal output of the single choice. Similarly, in a Prisoner’s Dilemma with a near-copy, cooperation isn't justified by causing the copy to cooperate (it doesn't; decisions are independent). It’s justified because the *joint policy* of mutual cooperation yields better outcomes than mutual defection across all correlated instances. The deontologist’s refusal to kill mirrors this: they follow a constraint against killing not because this specific refusal *causes* others to follow constraints, but because their commitment to the constraint is part of a *reference-class-wide policy* that, when universally adopted by agents in their decision-computation reference class (i.e., all agents reasoning similarly about ethics), minimizes harm overall. Violating the constraint here would undermine the integrity of the policy, just as defecting against a copy undermines the value of cooperation across correlated agents.

  The strongest consequentialist rejoinder is that real-world agents aren’t near-copies, and correlation is too weak to matter. If my killing one saves five *now*, and I have no evidence that my act influences others, isn’t refusing it scope-insensitive? This misstates the analogy. The correlation isn’t empirical but *logical*: it arises from the recognition that I am implementing a decision *algorithm* that will be (explicitly or implicitly) instantiated in others facing isomorphic choices. The "reference class" isn’t all humans but all agents using *this type* of moral reasoning under uncertainty. Even if the empirical link is weak, the policy’s value scales with the *logical possibility* and *stakes* of correlated decision-makers. Failing to follow the constraint in this case makes it exponentially less coherent to expect others in my reference class to follow it in similar high-stakes swaps—especially since my own reasoning sets a precedent for my future selves and those who might model me. In UDT terms, I optimize for the output of my algorithm *across all inputs it might face*, not just this one. Holding "all else fixed" is CDT’s error; in reality, my act *is evidence* about how the policy performs globally.

  But what of the "least convenient world" where correlation is *stipulated* to be zero? Here, the deontologist must bite a bullet—but not the one the consequentialist expects. The defender of constraints concedes that *if* this were truly a unique, uncorrelatable act with no implications beyond its immediate causality—a scenario practically impossible for a reflective agent—then the consequentialist calculus might dominate. However, this world is incoherent for any agent embedded in a network of similar reasoners: the *act* of violating a constraint *redefines* the agent’s policy, making future violations (by self or others who learn of the precedent) more likely. The constraint holds *because* it defines the agent’s identity as a constraint-follower. This isn’t consequentialism in disguise; it’s recognizing that rational agency involves *being a certain kind of decision-maker*, not just optimizing outcomes per act. The constraint is intrinsically tied to the agent’s coherence across time and possible worlds, much as a UDT agent values the global output of its algorithm. The policy’s value isn’t in its consequences but in its *role* in constituting rational, non-instrumentalizable agency. Thus, even in the "stipulated zero correlation" world, the deontologist maintains that violating the constraint corrupts the agent’s core reasoning procedure—a cost no local gain can offset. The paradox vanishes when we see deontology as UDT for morality: evaluating acts as instances of general policies in a universe of correlated reasoners.
