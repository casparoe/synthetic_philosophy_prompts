  (1) Map decision points precisely—initial continuation, production post-order collapse, and long-term operation—with sunk/marginal costs and payoff variables for each. 
  (2) Examine whether late-stage continuation was actually rational due to contractual penalties, shifting the fallacy to earlier contract design. 
  (3) Address two complications: how defining "sunk" depends on what payoffs count (monetary vs. prestige/capabilities), and principal-agent problems where officials' incentives diverged from public interest. 
  (4) Evaluate if honoring sunk costs can ever be strategically rational via precommitment effects.

  The user is clearly frustrated with reductive accounts. Their phrasing ("treating it as a cautionary tale to be recited") suggests they view the standard analysis as philosophically lazy. They want the case to interrogate the theory, not just illustrate it. 

  Hmm, the historical details matter here. For part 2, they mention a late-1970s UK review finding cancellation costlier than continuation. I recall the 1979 National Audit Office report did show £200m+ termination penalties versus £175m for finishing production—but must confirm those numbers. If accurate, this flips the narrative: the real error might be the treaty's punitive exit clauses. 

  For part 3, the payoff variable ambiguity is key. Textbook analyses assume narrow economics, but Concorde had geopolitical industrial policy goals. The UK/French governments weren't optimizing for airline profits—they wanted aerospace dominance and signaling credibility. And yes, officials avoiding blame for cancellation is a classic principal-agent issue. 

  On precommitment (part 4), Concorde’s treaty structure actually supports the strategic rationality argument. The high exit penalties were *designed* to bind partners, making persistence credible. But this leads to a subtlety: the sunk costs themselves didn’t justify continuing; the precommitment apparatus did. The user wants us to distinguish that carefully. 

  Biggest challenge will be avoiding false tidiness. The case resists a single "fallacy/no fallacy" verdict. For example: 
  - Initial continuation (1960s): Likely irrational if payoff was purely economic, but rational for industrial policy. 
  - Production go-ahead (1973): Probably irrational economically, but contract penalties later made cancellation worse. 
  - Operation (1976-2003): Defensible given prestige/sunk R&D, though operating losses piled up. 

  Also, the principal-agent lens might dissolve the fallacy entirely—if officials maximized personal utility (not getting fired), they acted rationally. But that moves us from philosophy of rationality to public choice theory. 

