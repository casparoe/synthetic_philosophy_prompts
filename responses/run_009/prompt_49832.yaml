prompt: |-
  I'm on the allocation committee of my university's effective altruism club, and my friend Dana chairs it. Every term we give away the money from our fundraiser, and after four meetings I thought I had a read on how she decides, but our agenda for next week has two proposals I genuinely can't call. We covered importance-tractability-neglectedness in my ethics of philanthropy class, so I keep trying to force her votes into that mold, and I can't quite do it.

  Her track record so far:

  1. Funded corporate campaigns for cage-free eggs over topping up a clean-water charity. She said the poverty stuff is fine but the giant charities already have it covered, whereas the campaigns hit a ridiculous number of animals per dollar.
  2. Rejected chipping in on existential-risk research, even though she said flat out it's probably the biggest deal in the room. Her two reasons were that we'd never know whether our few thousand dollars did anything, and that the tech billionaires are already dumping money into it.
  3. Funded a small study on whether farmed insects feel pain over a well-evaluated deworming program. Basically her reasoning was that if insects do suffer, it's the largest number of sufferers on the planet, and nobody else on earth will pay for the study.
  4. Rejected funding our city's homelessness outreach even though she agreed it obviously works and we'd see the results ourselves. Tiny number of people helped, and the city just passed a levy for it, so our money would be buying something that was happening anyway.

  Here's what's on the agenda next week:

  (a) A phase-1 trial for a rare disease affecting a couple thousand people worldwide. No pharma company or foundation touches it, and our grant would cover a real chunk of the trial, with a concrete paper at the end.
  (b) A campaign to get an international body to ban farming of some newly-domesticated animal. Completely unfunded, and if it worked the scale would be enormous, but it needs a couple million and several years to have any chance, and our contribution would be a rounding error.

  I can fit at least two readings onto all four of her past votes. One is that she's just neglectedness-first: fund whatever nobody else is touching, and everything else is a tiebreaker at most. The other is something like: she bets on huge-scale problems, but only when she's effectively the only buyer, so crowded causes collapse to zero no matter the scale. And maybe a third where it's not neglectedness but the counterfactual impact of our specific dollars that does the work — she funds things where the world is meaningfully different because we paid, which fits the insect study (we ARE the study's funding) and the x-risk rejection (our money just dissolves into the billionaire pool).

  So: how do you think she votes on (a) and (b)? Which rules actually fit all four of her past decisions, what does each one predict for the two new proposals, and where do they come apart? Give me your best guess with reasons, and then tell me if our two cases really settle anything — and if not, what proposal we'd need to add to the agenda to tell the readings apart, because I want to know whether I understand how she decides before I open my mouth at the meeting.
reasoning: |-
  Okay, the user is part of their university's effective altruism club allocation committee, chaired by their friend Dana. They're trying to predict how Dana will vote on two upcoming proposals based on her past decisions. The user has identified three possible frameworks Dana might be using: neglectedness-first, scale with counterfactual purchase, or counterfactual impact of specific dollars. They want to figure out which framework fits all past decisions, predict the votes for (a) and (b), and see if these cases help distinguish between the theories. If not, they need a new proposal to test the differences.

  First, I need to analyze Dana's past decisions. Let me go through each one:

  1. **Corporate campaigns for cage-free eggs over clean water charity.**  
     Dana chose cage-free because giant charities already cover clean water, so their money wouldn't add much. Cage-free campaigns have high animals per dollar and are more neglected. This fits neglectedness and counterfactual impact since their contribution directly supports underfunded efforts.
     
  2. **Rejected existential-risk research.**  
     Even though x-risk is a huge deal, Dana rejected it because their few thousand dollars wouldn't make a difference (counterfactual impact) and tech billionaires are already funding it (neglectedness/crowded out).
     
  3. **Farmed insect pain study over deworming.**  
     Funded the insect study because if insects suffer, it's massive scale, and nobody else is funding it. Deworming is well-evaluated but already covered. Here, neglectedness and counterfactual impact (their money is crucial) are key.
     
  4. **Rejected homelessness outreach.**  
     Agreed it works but rejected because the city's levy means their money doesn't add value (counterfactual impact), and it's a tiny scale issue. Neglectedness is low since the city is funding it.

  Now, the three frameworks the user proposed:

  - **Neglectedness-first:** Focuses on areas with little existing funding. All past decisions align here: cage-free campaigns, insect study (neglected), while clean water, x-risk, deworming, homelessness are covered by others.
    
  - **Scale with counterfactual purchase:** Bets on large-scale problems only if their donation is pivotal. Cage-free and insect study fit (their money directly contributes), while x-risk and homelessness are rejected because their contribution isn't pivotal. Deworming is effective but not pivotal if others fund it.
    
  - **Counterfactual impact of specific dollars:** Similar to counterfactual purchase, emphasizing whether their dollars directly cause an outcome. This fits all cases: funded where their money is critical (cage-free, insect study), rejected where it's not (clean water, x-risk, homelessness).

  Looking at the new proposals:

  - **Proposal (a): Rare disease trial.**  
    - Neglectedness: High, no one else is funding it.  
    - Scale: Small, only a few thousand affected.  
    - Counterfactual: Their grant covers a chunk of the trial, so their dollars directly cause the paper/trial progress.  
    - Prediction: Under neglectedness-first, likely fund. Under scale with counterfactual purchase, might reject due to small scale. Counterfactual impact supports funding since their money is crucial.
    
  - **Proposal (b): Ban farming campaign.**  
    - Neglectedness: High, completely unfunded.  
    - Scale: Enormous if successful.  
    - Counterfactual: Their contribution is a rounding error; unlikely to be pivotal.  
    - Prediction: Neglectedness-first might fund due to neglectedness. Scale with counterfactual purchase would reject because their money isn't pivotal despite scale. Counterfactual impact rejects because their dollars don't change the outcome.

  Do (a) and (b) settle which framework Dana uses?
  - If Dana funds (a) and rejects (b), that fits neglectedness-first and counterfactual impact (both support (a), reject (b)). Scale with counterfactual purchase would reject both, so this outcome rules out that framework.
  - If she rejects (a) and funds (b), that fits neglectedness-first only, as counterfactual impact rejects (b) and scale with counterfactual purchase rejects both. Since counterfactual impact would fund (a), rejecting (a) would contradict that.
  - But if she funds (a) and rejects (b), it could be either neglectedness-first or counterfactual impact. To distinguish those, we need a proposal where neglectedness is high but counterfactual impact is low.

  The user needs a test case to differentiate neglectedness-first from counterfactual impact. A proposal like:
  - **Highly neglected but tiny scale with guaranteed counterfactual impact.**  
    Example: Funding a local artist's project that no one else would fund (highly neglected, their money is crucial) but the impact is very small (e.g., beautifying a small park).  
    - Neglectedness-first: Fund because it's neglected.  
    - Counterfactual impact: Might reject because the scale is tiny, even though their dollars are pivotal.  
    - Dana's past decisions prioritize scale, so she might reject this. Need a case where scale is small but counterfactual is high, versus neglectedness high but scale small.

  Alternative test case:
  - **A project that's not neglected (many funders) but where their specific dollars are pivotal.**  
    But Dana has rejected such cases before (e.g., clean water, homelessness). So that might not work.  
  - Better: **A project with high neglectedness, large scale, but their dollars aren't pivotal.** Like proposal (b) but even clearer. But (b) already has high scale and neglectedness, but low counterfactual. If she rejects (b), that supports counterfactual impact over neglectedness-first.  
  - The key is to have a proposal with high neglectedness but where their contribution isn't pivotal. Since (b) is unfunded, maybe a project that needs $2 million, and their $5k is too small to matter, even if neglected. If Dana rejects it, that points to counterfactual impact. If she funds, it's neglectedness-first.

  So, if after (a) and (b), the user still can't tell between neglectedness-first and counterfactual impact, they need a proposal like:
  - **A highly neglected cause with minimal scale but high counterfactual impact.**  
    Example: Funding a niche study on a rare animal's welfare that affects very few animals but no one else is researching it. Their money completes the funding.  
    - Neglectedness-first: Fund because neglected.  
    - Counterfactual impact: Might reject because scale is too small, even if pivotal.  
    - Dana's past focus on large scale (animals, insects) suggests she might reject small scale, so if she funds this, it's neglectedness-first; if rejects, counterfactual impact (prioritizing scale).

  Alternatively:
  - **A project with medium neglectedness, large scale, and high counterfactual.** But that might not differentiate.

  The cleanest test is a small-scale, highly neglected project with high counterfactual impact. If Dana funds it, she's neglectedness-first; if rejects, she values scale or counterfactual impact more, but since counterfactual is high, rejecting would indicate scale is a stronger factor.

  In summary:
  - Predict Dana funds (a) and rejects (b).
  - This outcome is consistent with both neglectedness-first and counterfactual impact, ruling out scale with counterfactual purchase.
  - To distinguish the remaining two, add a proposal that's highly neglected, small scale, but high counterfactual impact. Her decision there will show if she prioritizes neglectedness regardless of scale, or if scale is crucial even with counterfactual impact.
answer: |-
  Based on Dana's track record and your analysis, I'll break this down systematically: first, I'll identify which decision rules fit all four past votes, then predict how each rule would handle (a) and (b), and finally, discuss whether (a) and (b) can distinguish between the theories—and if not, what test proposal would.

  ### Which Rules Fit All Four Past Decisions?
  Three frameworks fit Dana's history, but **Counterfactual Impact + Scale Emphasis** is the most consistent. Here's why:

  1. **Neglectedness-First (Fund whatever is least funded)**  
     - ✅ **Fits all votes:**  
       - Cage-free eggs (neglected animal welfare) > water (saturated poverty aid).  
       - Rejected x-risk (funded by billionaires).  
       - Insect pain study (zero existing funding) > deworming (well-funded).  
       - Rejected homelessness (covered by city levy).  
     - ❗ **Weakness:** Doesn't fully explain her rejection of homelessness (tiny scale) or prioritization of scale in the insect vote.

  2. **Scale + Counterfactual Purchase (Bet on huge-scale problems only if we're pivotal)**  
     - ✅ **Fits all votes:**  
       - Cage-free: High scale (animals/dollar) + our $ might tip corporate campaigns.  
       - Rejected x-risk: High scale but we're non-pivotal (dollars "dissolve").  
       - Insect study: Massive scale if insects suffer + we're the sole funder (pivotal).  
       - Rejected homelessness: Tiny scale + non-pivotal (city covers it).  
     - ❗ **Weakness:** Untested on small-scale but pivotal opportunities (like proposal (a)).

  3. **Pure Counterfactual Impact (Fund only if our dollars directly cause change)**  
     - ✅ **Fits all votes:**  
       - Cage-free: Campaigns need marginal $.  
       - X-risk: No measurable impact from our $.  
       - Insect study: Our $ *is* the funding.  
       - Homelessness: Our $ doesn't add value (city covers it).  
     - ❗ **Weakness:** Doesn't explain her emphasis on scale (e.g., "largest number of sufferers" in insect vote).  

  **Best Fit: Counterfactual Impact + Scale Emphasis**  
  Dana prioritizes interventions where:  
  - **Our dollars directly cause outcomes** (counterfactual impact), *and*  
  - **Scale is large** (as a tiebreaker when counterfactual is met).  
  This explains all four decisions: she rejects high-scale causes if we're non-pivotal (x-risk) and small-scale causes even if pivotal (homelessness), but funds high-scale + pivotal causes (cage-free, insect study).  

  ### Predictions for (a) and (b)
  | Proposal | Neglectedness-First | Scale + Counterfactual Purchase | Counterfactual Impact + Scale |
  |----------|----------------------|---------------------------------|-------------------------------|
  | **(a) Rare disease trial** | ✅ Fund (highly neglected) | ❌ Reject (small scale) | ✅ **Fund** (pivotal but small scale) |
  | **(b) Animal ban campaign** | ✅ Fund (highly neglected) | ❌ Reject (non-pivotal) | ❌ **Reject** (non-pivotal) |

  **Why?**  
  - **(a)** is **funded** under Counterfactual Impact + Scale:  
    - ✅ *Pivotal:* Your grant covers a "real chunk" of the trial—your dollars directly cause a concrete outcome (the paper).  
    - ❓ *But scale is small:* Only "a couple thousand people" affected. However, Dana accepted the insect study (uncertain scale) but rejected homelessness (tiny scale). Her tolerance for small scale *when counterfactual impact is high* suggests she’ll fund (a).  
  - **(b)** is **rejected** under Counterfactual Impact + Scale:  
    - ❌ *Non-pivotal:* Your contribution is a "rounding error"; unlikely to affect the campaign's success.  
    - ✅ *Scale is large:* But like x-risk, this collapses to zero without pivotality.  

  ### Do (a) and (b) Settle Which Rule She Uses?
  **Partially—but not fully.**  
  - **If Dana funds (a) and rejects (b):**  
    - ✅ *Rules out Scale + Counterfactual Purchase* (which rejects both).  
    - ✅ *Consistent with Neglectedness-First and Counterfactual Impact + Scale.*  
  - **If she rejects (a):**  
    - ✅ Rules out Neglectedness-First (which would fund both).  
    - ✅ Consistent with Scale + Counterfactual Purchase or Counterfactual Impact + Scale (if scale is too small).  
  - **If she funds (b):**  
    - ✅ Rules out Counterfactual Impact + Scale (non-pivotal).  
    - ✅ Consistent only with Neglectedness-First.  

  **The ambiguity:** (a) and (b) don’t cleanly distinguish between **Neglectedness-First** and **Counterfactual Impact + Scale**. Both frameworks predict funding (a) and rejecting (b). To split them, you need a proposal where neglectedness is high but counterfactual impact is low.  

  ### The Test Proposal You Need
  To definitively separate **Neglectedness-First** from **Counterfactual Impact + Scale**, add a proposal with:  
  - **High neglectedness** (no other funders),  
  - **Low counterfactual impact** (your dollars don’t meaningfully advance the cause),  
  - *Optional:* Small scale to mirror her homelessness rejection.  

  **Example proposal:**  
  > "(c) A documentary about an obscure environmental threat. Zero existing funding (highly neglected), but our $5k would only cover 5% of production. If completed, it might raise awareness but won’t directly mitigate the threat. Scale is moderate (affects 10k people)."  

  **How this splits the theories:**  
  - **Neglectedness-First:** ✅ Funds (c) — it’s neglected.  
  - **Counterfactual Impact + Scale:** ❌ Rejects (c) — your dollars aren’t pivotal (only 5% funded) and scale is modest.  

  ### Your Strategy for the Meeting
  1. **Predict:** Bet on Dana funding (a) and rejecting (b) based on her counterfactual impact + scale pattern.  
  2. **Test:** Propose adding a version of (c) to the agenda. If she rejects it, she’s likely using **Counterfactual Impact + Scale**. If she funds it, she’s **Neglectedness-First**.  
  3. **Speak up:** If you can’t add (c), say: *"Dana, I’ve noticed you prioritize whether our club’s dollars directly change outcomes, especially for large-scale problems. Would that mean (a) fits but (b) doesn’t?"* This forces her to clarify without boxing her in.  

  **Final thought:** Dana’s approach resembles a "**market-niche theory**": fund high-impact, buyer-less markets where small players can be pivotal. (a) fits this; (b) doesn’t. If you understand that, you’ll anticipate her moves better than any framework.
