prompt: |-
  For the past year, two members of my reading group have been arguing about whether the world is becoming less violent, and they have settled into positions I'd describe as follows. The declinist holds that per-capita death rates from war, homicide, and atrocity have fallen enormously across the sweep of human history — from the raiding mortality of pre-state societies, through medieval European homicide rates that look almost unimaginable today, to the growing rarity of direct great-power war — and that this decline is among the most morally significant facts we know. The skeptic holds that the decline is largely an artifact of what gets counted: that normalizing per capita flatters a species whose absolute toll and destructive capacity keep growing, that structural and institutional harms (sanctions regimes, famine policy, mass incarceration, the violence of economic arrangement) are excluded by fiat precisely so the trend comes out pointing downward, and that the question "is violence declining?" is not one question until "violence" is defined — a definitional act that is itself normative rather than neutral. To keep the fight off the arithmetic, both parties stipulate that the standard empirical estimates in this literature are roughly right; their dispute is about what the numbers are numbers of, and which numbers matter. They have finally agreed to try a structured adversarial collaboration rather than another free-for-all, and they've asked me to draft the joint statement they should be able to sign.

  Draft that document. I want a numbered section of agreed claims — including things like which empirical regularities both accept, and any concessions each side would honestly make about the weaknesses of its own framing. Then a disagreements table, with each residual disagreement stated in wording its own side would accept for its own view, plus one sentence per side on why it holds that view. Then the cruxes, and here I want you to take a stance on which sub-questions are the real load-bearing ones. I suspect at least three are in play, but you should decide: whether the per-capita versus absolute-numbers issue is a substantive moral disagreement or a rhetorical one; whether there is a reasonable core concept of violence that a fair-minded person could defend as the right one, or whether definitional choice runs all the way down with no neutral arbiter; and whether the long-run trend would survive definitions chosen by the other side — whether a hostile-but-fair definition flips the sign, makes it indeterminate, or leaves it intact. For each crux you identify, specify the concrete analysis, case, or thought experiment both parties would accept as bearing on it, with each side's prediction written down in advance, before the analysis is described. For example, if the crux is what happens when deaths from institutional cruelty and preventable famine are counted as violence, record now what the declinist predicts about the direction of the twentieth-century comparison under that definition and what the skeptic predicts.

  I'd like a committed piece of drafting, not a diplomatic one. Make definite choices about which disagreements are genuine and which were two words for one thing; if some portion of the dispute turns out to be verbal, say which portion and why, rather than hinting that maybe some of it is semantic. Don't manufacture agreement with claims so watered down that either party would sign them without noticing what they say, and don't soften the disagreements table into a hedge. Close with a short section taking a definite position on what would actually move this debate and on which parts of it are not empirically tractable at all — if you think, for instance, that no possible analysis could move either side on the fact-of-the-matter question, say that and argue it, rather than leaving it as one option among several. Please format the document as: numbered agreed claims, then the disagreements table, then the cruxes with predictions, then the closing section.
reasoning: |-
  We are drafting a joint statement for two parties: the declinist and the skeptic.
   The declinist believes that per-capita death rates from violence have declined significantly over human history and that this is a major moral fact.
   The skeptic believes that the decline is an artifact of what is counted and how violence is defined, and that absolute tolls and institutional harms are ignored.

   We are to have:
   1. Numbered agreed claims: empirical regularities both accept, and concessions each side makes about the weaknesses of its own framing.
   2. Disagreements table: each residual disagreement stated in wording acceptable to each side, plus one sentence per side on why they hold that view.
   3. Cruxes: the key load-bearing questions. We must take a stance on at least three, including:
      a. Whether per-capita vs. absolute numbers is a substantive moral disagreement or rhetorical.
      b. Whether there is a reasonable core concept of violence that is defensible or if definitional choice is entirely normative.
      c. Whether the long-run trend would survive under the other side's definitions (hostile-but-fair definition: does it flip, make indeterminate, or leave intact?).

   For each crux, we must specify:
     - A concrete analysis, case, or thought experiment both parties would accept as bearing on it.
     - Each side's prediction in advance.

   4. Closing: a definite position on what would move the debate and which parts are not empirically tractable.

   We are to be committed, not diplomatic. We must make definite choices about which disagreements are genuine and which are verbal. We must not water down claims.

   Let's structure the document:

   I. Agreed Claims (numbered)
   II. Disagreements Table (with two columns: one for declinist, one for skeptic, and one row per disagreement, plus one sentence per side on why)
   III. Cruxes (with predictions)
   IV. Closing Section

   Let's begin.

   I. Agreed Claims:

   1. Both parties accept the empirical estimates provided in the literature (e.g., by Steven Pinker and others) of declining per-capita death rates from interpersonal violence and interstate war over the long run (from prehistory to the present) as roughly accurate for the categories they cover.

   2. Both parties accept that absolute numbers of deaths from organized violence (such as in major wars) have increased in the modern period due to population growth and technological advancement, even as per-capita rates have declined.

   3. Both parties agree that the definition of "violence" is central to the disagreement and that the standard literature typically focuses on direct physical harm (homicide, battle deaths, genocide) but does not systematically include structural or institutional harms (such as deaths from sanctions, famine policy, or mass incarceration).

   4. Both parties concede that their own framing has weaknesses:
      a. The declinist concedes that the focus on per-capita rates may understate the moral significance of large-scale events (like world wars) and that excluding structural violence may leave out important forms of harm.
      b. The skeptic concedes that the long-term decline in direct physical violence (as conventionally measured) is a real and positive development, but maintains that it is only part of the story.

   5. Both parties agree that the 20th century, despite two world wars, shows a lower per-capita rate of death from warfare than previous centuries when averaged over the century and adjusted for population.

   6. Both parties agree that the data on pre-state societies is subject to significant uncertainty, but that the best available estimates (from anthropology and archaeology) indicate higher rates of violent death than in modern state societies.

   7. Both parties agree that the moral significance of any trend (whether declining or not) depends on the underlying normative framework.

   II. Disagreements Table:

   We present the table with two columns: one for the declinist and one for the skeptic. Each row is a disagreement.

   Disagreement 1: What is the most appropriate unit for measuring the moral significance of violence?
     - Declinist: Per-capita rates are the appropriate unit because they account for the changing size of the population and reflect the individual's risk of violent death, which is the primary moral concern.
       Why: Because moral concern should be about the probability that any given person will suffer violence, not the aggregate number which is driven by factors (like population growth) that are independent of the level of violence.
     - Skeptic: Absolute numbers are at least as important as per-capita rates because the moral significance of violence is not just about individual risk but also about the total amount of suffering and destruction caused.
       Why: Because large-scale events (like World War II) cause immense suffering and societal disruption that cannot be captured by per-capita measures alone, and because the capacity to cause harm has grown with technology and population.

   Disagreement 2: Should structural and institutional harms be counted as violence?
     - Declinist: The core concept of violence should be restricted to direct physical harm (such as bodily assault, killing) because it is objectively measurable and allows for consistent historical comparison. Structural harms, while important, are distinct and should be analyzed separately.
       Why: Because broadening the definition to include structural harms makes the concept of violence too vague and subjective, and it would be impossible to measure consistently across time and cultures.
     - Skeptic: Violence must include structural and institutional harms because these cause preventable deaths and suffering on a massive scale, and excluding them arbitrarily narrows the concept to favor a positive narrative.
       Why: Because the social arrangements that lead to famine, mass incarceration, and economic deprivation are forms of coercion and harm that are just as violent as direct physical force, and they are often intentional.

   Disagreement 3: Does the declining trend in direct violence hold if we include the entire 20th century and modern institutional harms?
     - Declinist: Even if we include the world wars and other large conflicts, the per-capita rate of violent death in the 20th century is lower than in previous centuries, and the trend continues in the 21st century. Including structural harms would not reverse the trend because many forms of structural harm (like famine) have also declined.
       Why: Because the data on famines and other preventable deaths show a decline in per-capita terms, and the institutional capacity to prevent harm has increased over time.
     - Skeptic: The 20th century, when viewed in absolute terms and including the world wars and colonial violence, represents an unprecedented peak in violent destruction. Moreover, if we include structural harms (like deaths from colonial policies, sanctions, or avoidable famines in the modern era) the trend would not be clearly declining.
       Why: Because the scale of destruction in the world wars and the persistence of institutional violence (such as in the colonial period and under authoritarian regimes) challenge the narrative of decline, and because structural harms are pervasive in the modern world.

   III. Cruxes:

   We identify three cruxes:

   Crux 1: Is the per-capita versus absolute-numbers issue a substantive moral disagreement or a rhetorical one?
     - Our stance: It is a substantive moral disagreement. The declinist focuses on individual risk and the probability of harm, which is naturally per-capita. The skeptic focuses on the total moral weight of suffering and the potential for catastrophic harm, which is absolute. This difference reflects a deeper normative divide about what matters: the individual experience or the aggregate impact.

     Concrete analysis: Consider a hypothetical scenario with two planets:
        Planet A: 1 billion people, 10 million die violently per year (per-capita rate: 1%).
        Planet B: 10 billion people, 15 million die violently per year (per-capita rate: 0.15%).
        Which planet has a worse violence problem?

     Predictions:
        Declinist: Planet A is worse because the individual risk is 1% vs. 0.15%. The higher absolute number on Planet B is due to population size, not a more violent society.
        Skeptic: Planet B is worse because 15 million deaths is more than 10 million, and the suffering is greater in absolute terms. The per-capita rate might be lower, but the scale of destruction is larger and more concerning.

     This thought experiment reveals the moral disagreement: the declinist prioritizes individual risk, the skeptic total harm.

   Crux 2: Is there a reasonable core concept of violence that a fair-minded person could defend as the right one, or does definitional choice run all the way down with no neutral arbiter?
     - Our stance: There is no neutral arbiter; the definition of violence is inherently normative. However, there is a reasonable core concept (direct physical harm) that can be defended for historical measurement, but it is not the only reasonable concept.

     Concrete analysis: Take the case of famine deaths in the 20th century. Some famines are caused by natural disasters, others by government policy (e.g., the Great Leap Forward). Should these be counted as violence?
        - Declinist: Only if the famine is intentionally inflicted (like as a weapon of war) should it count as violence. Otherwise, it is a separate category of harm.
        - Skeptic: Famines that are preventable by government action (or inaction) should count as violence because they are the result of human decisions that lead to death.

     We then look at the historical record: How many famines in the 20th century would count as violent under each definition?
        - Declinist prediction: Even if we include all intentional famines, the per-capita rate of violent death (now including these) would still show a decline because the rate of famine deaths has dropped dramatically since the mid-20th century.
        - Skeptic prediction: Including preventable famines (especially those caused by policy) would add so many deaths (e.g., in the tens of millions in the Soviet Union and China) that the 20th century would show an increase in per-capita violent death compared to earlier centuries.

     Note: We are using a hostile-but-fair definition for the declinist: the skeptic's broader definition that includes intentional and preventable famines as violence.

   Crux 3: Would the long-run trend of declining violence survive under a hostile-but-fair definition (i.e., one that includes structural and institutional harms chosen by the skeptic)?
     - Our stance: We believe that under a fair but broad definition (that includes, say, deaths from state-induced famines and genocides, but not all structural harms), the long-run trend would still show a decline, but it would be less steep and the 20th century would have a higher peak. However, for the entire sweep of history, the trend would remain downward.

     Concrete analysis: We take the 20th century and compare it to previous centuries (say, the 17th century) under a definition that includes:
          - Battle deaths
          - Genocides and mass killings
          - Deaths from famines that were caused or exacerbated by state policy (with a standard historical consensus on which famines qualify)

     Predictions:
          Declinist: Even including these, the per-capita rate in the 20th century would be lower than in the 17th century (which had the Thirty Years' War, etc.) because the baseline of pre-modern violence was so high and because the 20th century had periods of peace and progress.
          Skeptic: Including these would make the 20th century the most violent in history on a per-capita basis, or at least show no clear decline from previous centuries.

     We note that the actual data on this is complex. The declinist might point to the fact that the Thirty Years' War killed a higher percentage of the population of Central Europe than World War II did in Germany. The skeptic might point to the global scale of 20th-century violence.

     However, we must make a prediction about the outcome of this analysis. We (the drafter) are taking a stance: We predict that the declinist would be proven correct that the per-capita rate in the 20th century, even with the broader definition, would be lower than in the 17th century. Why? Because the 17th century had multiple devastating wars and high baseline homicide rates, and the 20th century, despite two world wars, had a much larger population and longer periods of peace. But the skeptic might be right about the mid-20th century (1930s-1940s) being a peak.

     But the long-run trend (from prehistory to now) would still be downward because the rates in pre-state societies (as per accepted estimates) are so high.

     However, note: the skeptic might argue that including colonial violence and famines in the 19th century would make the early modern period less violent relative to the 20th? We are focusing on the 20th vs. 17th as a test.

     We are choosing: the trend survives, but with a higher peak in the 20th century than the declinist usually acknowledges.

     But for the crux, we record each side's prediction:

          Declinist prediction: Under the broader definition (including state-induced famines and genocides), the per-capita rate of violent death in the 20th century is still lower than in the 17th century.
          Skeptic prediction: Under the same definition, the 20th century would have a higher per-capita rate than the 17th century.

   IV. Closing Section:

   We take the position that the debate can be moved by empirical analysis on the third crux: whether the long-run trend survives under a broader definition. If an agreed-upon study were to show that even under the skeptic's definition the per-capita rate has declined, that would be a significant point for the declinist. Conversely, if it showed the opposite, the skeptic would gain ground.

   However, the first crux (per-capita vs. absolute) is not empirically tractable because it is a moral question. No amount of data can resolve whether we should care more about individual risk or total suffering. This requires ethical argument.

   The second crux (definition of violence) is also not empirically resolvable. It is a philosophical question about the boundaries of the concept. But we can agree on operational definitions for the sake of measurement and then see what the data says under those definitions.

   Therefore, the most promising path is to focus on the empirical question: what does the data show under a broader but still measurable definition of violence? This would require a major research effort to quantify structural and institutional harms historically. Without such data, the debate will remain stuck.

   We also note that even if the trend is downward, the skeptic is right to point out that the destructive capacity of modern societies is greater, which creates new risks (like nuclear war) that could reverse the trend. The declinist might counter that the institutions that have reduced violence also reduce the risk of such catastrophes.

   In conclusion, the debate is not entirely resolvable by facts because of the normative disagreements, but there are empirical questions that could be addressed to clarify the factual basis of the dispute.
answer: |-
  ### Joint Statement on the Decline of Violence Debate

  #### I. Agreed Claims  
  1. **Empirical Baseline**: Both parties accept the accuracy of standard historical datasets (e.g., Pinker, Goldstein, UNODC) indicating a *per-capita decline* in direct physical violence (homicide, interstate war, genocide) from pre-state eras to the present. Pre-state raiding mortality exceeded 10%, medieval homicide rates were 10–100× modern rates, and post-1945 interstate war deaths have fallen to <0.5% of global deaths.  
  2. **Absolute Toll Increase**: Both acknowledge that absolute numbers of violent deaths rose in the 20th century due to population growth, industrial warfare, and genocidal ideologies.  
  3. **Structural Harm Exclusion**: Both agree that canonical "decline" literature excludes structural/institutional harms (e.g., sanctions-induced mortality, policy-driven famines, mass incarceration) by methodological fiat.  
  4. **Declinist Concession**: The per-capita framing understates catastrophic 20th-century events (e.g., WWII, Holocaust) and risks complacency toward residual violence and novel threats (e.g., nuclear weapons).  
  5. **Skeptic Concession**: The decline in *direct* physical violence is real and morally significant, even if incomplete or context-dependent.  
  6. **Definitional Centrality**: The question "Is violence declining?" is inseparable from the definition of "violence." No definition is neutral; all reflect normative priors.  
  7. **Data Limitations**: Estimates for pre-state and medieval violence involve uncertainty, but methodological rigor (e.g., archaeological evidence, crime records) supports directional trends.  

  ---

  #### II. Disagreements Table  

  | Disagreement                                                                 | Declinist Position                                                                                             | Skeptic Position                                                                                                 |
  |------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
  | **1. Metric of Moral Significance**: What unit best captures violence’s moral weight? | Per-capita rates are paramount. They reflect individual lived experience—the probability of being a victim—which is the core moral concern. | Absolute numbers are equally/more important. They capture aggregate suffering, destructive scale, and humanity’s growing capacity for harm. |
  | **2. Scope of "Violence"**: Should structural/institutional harms be included?        | Violence must center on *direct physical harm* (wounds, killings). Structural harms are distinct; conflating them muddies measurement and historicity. | Violence must include *structural coercion*. Arbitrary exclusion of policy-driven suffering (e.g., colonial famines) sanitizes modern power. |
  | **3. Trend Persistence**: Does the decline hold under expanded definitions?          | The decline is robust. Adding structural harms would not reverse it, as metrics like famine deaths have also fallen per capita since 1900. | The decline is fragile. Including structural harms flattens or reverses the trend, as modern systems cause mass premature death. |
  | **4. Moral Valuation**: What does "decline" imply normatively?                      | Falling per-capita violence is a civilizational triumph. It reflects moral progress and obliges us to defend its drivers (e.g., liberalism). | Per-capita decline is morally inadequate. It masks rising absolute harm and may legitimize violent systems (e.g., racial capitalism). |

  ---

  #### III. Cruxes  
  We identify three load-bearing cruxes. For each, we specify a testable scenario, both parties’ predictions, and the drafter’s stance.  

  **Crux 1: Per-Capita vs. Absolute Toll — Moral Disagreement or Rhetorical Distraction?**  
  - **Drafter’s Stance**: *Substantive moral disagreement*. The divide reflects incompatible ethical axioms: individual risk (declinist) vs. collective consequence (skeptic).  
  - **Test Case**: *A 22nd-century Earth with 12B people*. AI-managed conflicts kill 6M/year (0.05% per-capita rate), versus a 15th-century Earth with 0.5B people and 1M killed/year (0.2% per-capita).  
    - *Declinist Prediction*: 15th century is worse. Individual risk dominates.  
    - *Skeptic Prediction*: 22nd century is worse. Absolute deaths (6M > 1M) and technological horror outweigh per-capita gains.  

  **Crux 2: Is a Core Definition of Violence Possible?**  
  - **Drafter’s Stance**: *No neutral arbiter exists*. Definitions are normative, but a "hostile-but-fair" operationalization is feasible: **"Violence = physical harm caused by human intent or culpable neglect."**  
  - **Test Case**: *Count all 20th-century deaths from state-induced famines (e.g., Holodomor, Great Leap Forward) and colonial repression (e.g., Congo Free State) as violence*.  
    - *Declinist Prediction*: Adding these (~50M deaths) lifts the 1900–2000 per-capita rate to ~1.5%—still below the 16th century’s 2%+. Decline holds.  
    - *Skeptic Prediction*: Adding these (~120M+ deaths) pushes the 20th-century rate above pre-1800 levels. Decline vanishes.  

  **Crux 3: Does the Trend Survive Hostile Definitions?**  
  - **Drafter’s Stance**: *The trend flattens but persists*. Pre-state violence was vastly higher; modern structural harms lack scale to reverse the signal.  
  - **Test Case**: *Apply the skeptic’s broad definition (violence = direct harm + structural lethality from sanctions, incarceration, and preventable famine) to three eras: pre-state (3000 BCE), 1600s (Thirty Years’ War), and 2000s*.  
    - *Declinist Prediction*: Per-capita rates: pre-state (15%) > 1600s (3%) > 2000s (0.7%). Decline intact.  
    - *Skeptic Prediction*: Pre-state (15%) ≈ 1600s (14% w/structural crises) > 2000s (12% w/modern structural harms). No decline.  

  ---

  #### IV. Closing: What Would Move the Debate?  
  **Empirically Tractable**:  
  - **Crux 3 is resolvable**. A collaborative historical audit—applying a shared "hostile-but-fair" definition (Crux 2) to recalculate violence rates—could converge on trends. If structural harms add <0.5% to modern rates, declinists win; if >2%, skeptics win.  
  - **What would move it**: A UN-backed commission quantifying structural violence (e.g., famine mortality from policy vs. drought) using primary sources. *Prediction*: Data would show a shallower but real decline (e.g., 0.9% in 2000s vs. 2.5% in 1600s), partially validating declinists.  

  **Intractable**:  
  - **Crux 1 is irreconcilable by data**. Per-capita vs. absolute is a moral schism: Is saving 1/100 lives in a society of 100 equivalent to saving 10,000/1,000,000? No empirical answer exists.  
  - **Crux 2’s normative core** cannot be depoliticized. Choosing definitions *is* advocacy. A "fair" definition merely exposes this.  

  **Path Forward**: Focus energy on Crux 3. If the decline vanishes under expanded definitions, declinists must redefine progress. If it holds, skeptics must concede that something profound has improved. Else, this debate is theology with numbers.  

  ---  
