  Below is a decision tree that maps concrete cases to distinct positions in acausal trade, built from the logical space you described. Each question is a hypothetical scenario requiring a binary choice, designed to avoid ambiguous sorting. Unoccupied combinations are noted, and overlapping leaves are flagged.

  ---

  ### **Decision Tree: Which Acausal Trade View Do You Actually Hold?**

  **Q0 (Root):**  
  *In a one-shot prisoner's dilemma against a stranger, you are told the stranger has already locked in their move: they cooperate iff they predicted you would cooperate, else they defect. Would you cooperate?*  
  - **No →** **Causal Decision Theorist (CDT)**  
    - *Most awkward commitment:* Defecting even when you know the stranger's cooperation was contingent on your choice, leaving you with a worse payoff (mutual defection) instead of mutual cooperation.  
  - **Yes →** Proceed to Q1.

  **Q1 (Common Cause):**  
  *You face a one-shot prisoner's dilemma with a stranger from an identical cultural/evolutionary background (e.g., both raised in the same human society). Your actions are correlated solely due to shared upbringing—no prediction or direct causal link exists. Would you cooperate?*  
  - **No →** **Prediction-Required Acausal Trader**  
    - *Most awkward commitment:* Refusing mutually beneficial cooperation when correlation arises from common cause (e.g., shared biology or culture), even though you accept it under explicit prediction (Q0).  
    - *Status:* Rare and potentially unattractive—fragile to cases blending prediction and common cause.  
  - **Yes →** Proceed to Q2.

  **Q2 (Mutual Modeling):**  
  *For cooperation to occur, must both agents possess detailed models of each other's decision algorithms (e.g., simulating each other's source code), or is a rough shared expectation (e.g., "we both know the prisoner's dilemma and acausal trade concepts") sufficient?*  
  - **Detailed models required →** Proceed to Q3A.  
  - **Rough expectation sufficient →** Proceed to Q3B.

  **Q3A (Distance/Time for Modeling-Intensive):**  
  *The stranger is a civilization beyond your cosmological horizon (or in the distant future), making causal contact impossible. They will cooperate iff they predict you will. Would you cooperate, knowing your action affects nothing causally?*  
  - **Yes →** **Full Acausal Trader (Modeling-Intensive)**  
    - *Most awkward commitment:* Requiring detailed mutual modeling with distant aliens, despite having no access to their source code or any evidence they can model yours.  
  - **No →** **Near-Copies Only**  
    - *Most awkward commitment:* Cooperating only with agents who can model you in detail (e.g., close copies of yourself), forfeiting vast gains from trade with advanced aliens who might still cooperate.  

  **Q3B (Distance/Time for Robust):**  
  *Same as Q3A: The stranger is beyond causal contact and cooperates iff they predict you will. Would you cooperate?*  
  - **Yes →** **Full Acausal Trader (Robust) or Deflationist (Distant-Trade Subtype)**  
    - *Most awkward commitment (Full Robust):* Cooperating with any rational agent anywhere in spacetime, risking resources on civilizations you have zero evidence exist.  
    - *Most awkward commitment (Deflationist):* Treating "acausal trade" as ordinary Bayesian reasoning, yet accepting cooperation with causally disconnected agents as rational.  
    - **⚠️ Flag:** This leaf contains two views the tree **cannot separate**:  
      - **Full Acausal Trader (Robust):** Believes cooperation is rational due to abstract decision-theoretic principles (e.g., updatelessness).  
      - **Deflationist (Distant-Trade Subtype):** Sees this as standard trade under uncertainty ("I assign a probability they exist and are rational").  
  - **No →** **Deflationist (Local-Only) or Local Acausal Trader (Robust)**  
    - *Most awkward commitment (Deflationist):* Calling acausal trade "ordinary" yet rejecting it with distant agents due to lack of evidence—potentially inconsistent if you accept common-cause trade (Q1).  
    - *Most awkward commitment (Local Acausal Trader):* Cooperating under rough expectations only with causally accessible agents—unexplored and possibly incoherent (why would distance matter if trade is acausal?).  
    - **⚠️ Flag:** This leaf contains two views the tree **cannot separate**:  
      - **Deflationist (Local-Only):** Cooperates in Q0-Q2 as "trade under uncertainty" but defects in Q3B due to unquantifiable priors.  
      - **Local Acausal Trader (Robust):** Hypothetical view where rough expectations suffice, but only for causally reachable agents. *Status: Unexplored.*  

  ---

  ### **Summary of Leaves & Unoccupied Combinations**
  1. **Causal Decision Theorist (CDT):** Root → No.  
  2. **Prediction-Required Acausal Trader:** Q0: Yes, Q1: No.  
  3. **Full Acausal Trader (Modeling-Intensive):** Q0: Yes, Q1: Yes, Q2: Detailed, Q3A: Yes.  
  4. **Near-Copies Only:** Q0: Yes, Q1: Yes, Q2: Detailed, Q3A: No.  
  5. **Full Acausal Trader (Robust) or Deflationist (Distant):** Q0: Yes, Q1: Yes, Q2: Rough, Q3B: Yes. (*Indistinguishable*)  
  6. **Deflationist (Local-Only) or Local Acausal Trader (Robust):** Q0: Yes, Q1: Yes, Q2: Rough, Q3B: No. (*Indistinguishable*)  

  **Unoccupied Combinations:**  
  - *Q0: Yes, Q1: No → Prediction-Required Acausal Trader*: Occupied but rare—unattractive due to arbitrariness in privileging prediction over common cause.  
  - *Q0: Yes, Q1: Yes, Q2: Detailed, Q3A: No → Near-Copies Only*: Occupied.  
  - *Q0: Yes, Q1: Yes, Q2: Rough, Q3B: No → Deflationist (Local) / Local Acausal Trader*: Occupied but splits two views.  
  - **No unoccupied leaves**—all paths map to a position (though some leaves contain multiple views).  

  **Key Notes:**  
  - The tree distinguishes **CDT** (rejects root) from all others.  
  - **Deflationists** appear in two leaves (Q3B:Yes/No) but are only separable from other views by their *rejection of "acausal" as a meaningful category*.  
  - **Full Acausal Traders** split into two subtypes: one requiring detailed modeling (vulnerable to alien inscrutability) and one accepting rough expectations (vulnerable to exploitation).  
  - **Near-Copies Only** is the only view accepting common-cause trade (Q1:Yes) and detailed modeling (Q2:Detailed) but rejecting distant trade (Q3A:No).  

  This tree isolates core disagreements while acknowledging where positions converge on behavior (flagged leaves). It avoids decision-theory jargon, relying solely on concrete cases.
