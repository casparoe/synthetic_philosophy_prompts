prompt: |-
  My two friends have been at each other for like two years over the species problem, and I want to see what a real adversarial collab between them would produce. One of them is a species monist: she thinks there has to be a single correct way to carve organisms into species, and that a proper species concept should reflect the fact that species are real, independently existing lineages — something in the spirit of the general lineage / unified species idea, where species are metapopulation lineages with their own evolutionary fate, and everything else (interbreeding criteria, ecological niches, monophyly) are just different ways a lineage can become distinct. The other one is a committed pluralist: he thinks the whole idea of one true carving is confused, since evolution produces groups that are good units for some processes (gene flow) and bad units for others (selection, ecological sorting), and paleontologists, botanists, and microbiologists need different concepts because their organisms genuinely behave differently — try applying a breeding criterion to an asexual lineage or to a fossil series and see how far you get.

  Write the joint statement they should be able to both sign after hashing it out for real. I want:

  1. A numbered section of claims both could actually sign — about what species concepts are for, about which standard objections to specific concepts are fair, about cases where they genuinely converge, and about what "species realism" should minimally mean so both can accept it.
  2. A disagreements section: each residual disagreement phrased so the person holding that view would accept the wording as accurate (my monist friend will not sign anything that makes her view sound like naive essentialism, and the pluralist won't sign anything implying his pluralism is just convenient bookkeeping).
  3. The cruxes — I suspect one is whether disciplinary pluralism (different scientists need different concepts) forces ontological pluralism (there are genuinely multiple equally real ways to carve species), and another is how much weight to put on hard cases like ring species, bacteria with horizontal gene transfer, and chronospecies. But dig deeper than that if you can.
  4. For each crux, a concrete argument, case study, or thought experiment both would agree bears on it — e.g. a specific kind of case where their predictions about what biologists should say diverge — with each side's prediction written down in advance.

  Also flag if any part of their fight turns out to be verbal, like they're using "real" or "objective" in different ways, and say which part and why. Answer in American English, and keep it in the weeds — I don't want a textbook intro to what a species is, these two know the literature, they just can't seem to hear each other.
