prompt: |-
  I've been reading the rationalist corner of the internet since the Overcoming Bias days, which is long enough to have watched the comment threads relitigate Bertrand's paradox about once every eighteen months, and long enough to know that the principle of indifference is an old friend with a drinking problem. I've finally written down my actual verdicts on a batch of cases, and I'd like to know whether there's a single principle behind them or whether I've been patching a broken tool with tape. Please reply in continuous prose only, no headings, no bullet points, no bold text, no tables, the way one writes a letter.

  Here are the cases and my verdicts. A fair die about to be rolled: I say each face gets a sixth, and I don't feel any need to know how it was tossed or by whom; I'd say it even if the die had already been rolled and sealed in a cup. The millionth digit of some mathematical constant no one has yet computed: I say one half that it's even, and this doesn't bother me even though there is a fact of the matter. A randomly chosen natural number being even: I say there is no answer at all, and I'm right, since no uniform distribution on the naturals exists; but I can't say why I'm entitled to one half in the digit case and nothing here.

  Bertrand's chord: I accept that the three classical answers — a third, if you pick two endpoints uniformly on the circumference; a half, if you pick the midpoint uniformly along a random radius; a quarter, if you pick the midpoint uniformly over the disk — are each correct for their own sampling procedure, and I believe the bare question has no answer. If forced, I'd blurt "half," because I picture dropping a point somewhere in the disk, but I don't defend the blurt.

  The cube factory produces cubes with side length at most two centimeters. Given a cube off the line, what's the probability its side is at most one centimeter? Uniform on the side gives one half; uniform on the volume gives one eighth, since the volume runs up to eight cubic centimeters and one cubic centimeter corresponds to a side of one; uniform on the surface area gives one quarter. My gut says one half, without hesitation.

  A vessel contains wine and water, with the ratio of water to wine somewhere between a tenth and ten, that is, between ten times as much wine as water and ten times as much water as wine. What's the probability the ratio is at most two, so that the water is at most twice the wine? Uniform on the ratio over that interval gives about nineteen percent; uniform on its logarithm gives about sixty-five percent, log twenty over log a hundred. My gut sides firmly with the logarithm. It tells me that a ratio of two is as far from one as a ratio of a half, and that orders of magnitude are the natural spacing.

  And here is what keeps me up at night: the cube and the vessel are, structurally, the same problem. In each, a positive quantity is confined to a bounded interval and I'm asked the probability it lies in the lower part. In one case I go uniform on the quantity; in the other, uniform on its logarithm. I can tell a story about it — the ratio is dimensionless and the question is phrased in pure ratios, so there's a symmetry under reciprocation; the side length is dimensionful and the factory's tolerances are additive in length — but I notice that if the factory's brochure had quoted volumes, I'd have said one eighth, and if the vessel problem had been phrased in absolute amounts, I'd have reached for something else. My working principle appears to be: be indifferent over whatever variable the problem's wording hands you. That can't be right, and if it is right, the principle of indifference is a machine for laundering the phrasing of a problem into a probability.

  My current patch is something like this: indifference is legitimate over a finite set of possibilities we have no reason to distinguish; in the continuous case it's legitimate only where a symmetry group rich enough to determine a unique invariant measure does the choosing, the way permutations do for the die and the way reciprocation tries to for the vessel; and where no such group exists, or several compete, as with Bertrand's three, the right response is silence. I know Jaynes claimed to dissolve Bertrand with transformation groups, and I half believe him, but half is exactly my problem: three groups, three answers. Worse, under this patch I can't place my digit verdict at all — the millionth digit has no symmetry group choosing it, it's just a fact, and I still say one half and sleep well.

  So, please: state the principle, or a short list of candidates, as precisely as you can; tie each clause to the case that motivates it; and tell me what it predicts on cases I haven't mentioned — in particular, the prior for the mass of a particle discovered next year, where my gut says logarithmic and I'd like to know whether the principle earns that or whether it's a bias I should shed; the bias of a coin from an unfamiliar mint, where I'm tempted by uniform on the bias but have seen people insist on uniform over the log-odds, which is improper and behaves as though the coin is almost surely almost always heads or almost always tails; and Bertrand's question when I'm told a chord was drawn by a process I refuse to describe. And please be honest about which of my verdicts your principle cannot save: I'd rather lose the blurt than the pattern.
reasoning: |-
  Okay, let me start by unpacking this user's deep dive into probability puzzles. They've been wrestling with the principle of indifference across classic paradoxes—Bertrand's chord, cube factories, wine/water ratios—and their intuitions sometimes clash with mathematical formalisms. The core tension is clear: when can we legitimately apply uniform priors, and why do their gut feelings vary across structurally similar problems? 

  First, I need to map their verdicts: solid 1/6 for dice, comfortable 1/2 for unseen math digits, but refusal to assign probability to "random natural number." Bertrand's paradox gets a nuanced "all answers valid but context-dependent" response. The cube factory triggers an instinctive 1/2 (uniform on side length), while the water/wine ratio demands logarithmic uniformity. Yet they rightly spot these two are isomorphic—so why different treatments? Their self-diagnosis hits the nail: wording shouldn't dictate probability, but their patch (symmetry groups as justification) fails for the math digit case where no symmetry exists. 

  The user's distress about particle mass priors and coin biases shows they want a framework that doesn't just rationalize existing intuitions but guides new ones. Their "symmetry group" patch is elegant but incomplete—it explains the vessel's reciprocation symmetry (log-uniform) but not why cube size feels additive. Worse, it leaves the math digit verdict orphaned. 

  Hmm. The key might be distinguishing between epistemic probability (the die sealed in a cup) and aleatory uncertainty (the factory cube). For the digit, even though it's fixed, our ignorance is symmetric across digits 0-9—no physical process, just information gap. Natural numbers break because no uniform measure exists mathematically. For the vessel, the ratio's scale-invariance suggests log-uniform; for the cube, side length's linear tolerances suggest uniformity. But why? Perhaps the principle isn't about wording but about *what kind of ignorance the problem describes*. 

  For particle mass: logarithmic prior feels right because physics constants span orders of magnitude—scale-invariance again. Coin bias is trickier; uniform on p ignores that 0.51 and 0.99 feel different, but uniform on log-odds over-predicts extremes. A better fit might be Beta(1,1) for coins, symmetric in log-odds space but proper. 

  Bertrand's bare chord? Silence is correct—no sampling mechanism specified. Their "half" blurt reflects a mental image (disk midpoint), but that's arbitrary without justification. 

  So the unifying principle: indifference requires a *privileged variable* derived from the nature of the uncertainty. For dice, permutations privilege face labels. For digits, decimal representation privileges each digit equally. For ratios, scale symmetry privileges log; for factory specs, engineering context privileges linear measures. When no such variable exists (natural numbers, chord without method), silence or improper priors emerge. 

  The user's cube/vessel conflict resolves by recognizing that "quantity" means different things: linear dimension vs. dimensionless ratio. Their patch holds if we expand "symmetry" to include problem context. Particle mass earns log-prior from scale-invariance; coin bias warrants Beta(1,1) as a conjugate prior for binomial processes. 

  Their digit verdict survives as it reflects combinatorial symmetry (10 options), not physical symmetry. The sacrificed verdict? Bertrand's "half" blurt—it's unsupported without specifying midpoint sampling. 

  Honestly, this framework won't please strict Bayesians—it still leans on intuition about "natural" variables. But it systematizes their instincts better than symmetry groups alone. The principle of indifference isn't broken; it's context-sensitive, and that's okay.
answer: |-
  Your struggle resonates deeply—the principle of indifference is indeed an old friend with a drinking problem, one who shows up uninvited and rearranges the furniture. Your verdicts are consistent in spirit but demand a unifying principle that acknowledges both their wisdom and their tensions. Let us walk through them, seeking a thread.

  Begin with the die: each face gets a sixth. Here, the symmetry is discrete and finite. The six faces are indistinguishable under rotation; no relabeling favors one outcome over another. The principle applies cleanly because the group of permutations acts transitively, and the invariant measure is unique. The sealed cup changes nothing because the uncertainty is epistemic, not physical—you lack information, and symmetry dictates equal credence.

  The millionth digit of an uncomputed constant: you assign one-half to evenness. This feels defensible because digits in decimal expansions, for constants presumed "random" in absence of evidence, exhibit no known asymmetry between even and odd digits. Though a fact exists, your ignorance is symmetric across the ten digits, and evenness partitions them equally. Contrast this with "random natural number": no uniform measure exists because the naturals admit no finite invariant measure under translation or scaling. Symmetry fails catastrophically here; any "uniform" prior would privilege larger numbers or smaller, violating indifference. Your silence is correct, while the digit case escapes by finiteness (10 possibilities) and combinatorial symmetry.

  Bertrand’s chord lays bare the core issue. The three sampling methods—uniform endpoints, uniform radius, uniform disk midpoint—each yield different probabilities because they impose different measures. The paradox dissolves when we specify the physical process. The bare question lacks this, so no unique answer exists. Your blurt of "half" reveals an instinct to fix a sampling method (midpoint in the disk), but without justification, it is arbitrary. The principle of indifference cannot choose among these measures; it demands specification of the variable over which indifference holds.

  Now the cube and the vessel—your sleepless twins. The cube factory: you say one-half, uniform on side length. The vessel: you say log-uniform, giving ~65%. Structurally identical, yet your verdicts diverge. Why? Your patch—symmetry groups—offers a clue. For the vessel, the ratio *r* (water/wine) between 0.1 and 10 has a natural symmetry: the problem treats *r* and 1/*r* equivalently (e.g., "between ten times as much wine as water and ten times as much water as wine"). The group of reciprocation *r* → 1/*r* preserves the problem’s structure. The unique invariant measure under this group is uniform on log *r*. Hence, log-uniformity respects the scale-invariance implied by the phrasing.

  For the cube, side length *L* (0 < *L* ≤ 2 cm) lacks such symmetry. The factory’s "side length at most two" suggests an additive tolerance—an engineer might measure lengths with a ruler, implying a linear scale. Uniformity on *L* respects this. If the brochure quoted volumes, the context shifts: now the natural variable is volume *V*, and uniform on *V* gives 1/8. The principle is not merely laundering wording; it is discerning the *natural variable* implied by the problem’s invariants. Where no symmetry group acts, indifference fails—but here, context suggests a privileged variable.

  Thus, a candidate principle emerges: **Indifference applies when a unique finitely additive probability measure is invariant under the symmetry group of the problem’s epistemic constraints.** Where multiple groups compete (Bertrand), or no nontrivial group acts (natural numbers), silence follows. Where the group determines a unique measure (die, digit evenness), use it. For the vessel, reciprocation symmetry demands log-uniformity; for the cube factory, no such symmetry overrides the linear context.

  Now to your unmentioned cases. First, the mass *m* of a new particle. Your gut says logarithmic. This is sound: particle masses span orders of magnitude, and the problem is scale-invariant—a prior uniform in log *m* is invariant under *m* → *k·m*. Linear uniformity would absurdly concentrate belief on unobserved scales. The symmetry group (scaling transformations) privileges log-uniformity.

  Second, the bias *p* of a coin. Uniform on *p* is intuitive but ignores the structure of probability. The log-odds *λ* = log(*p*/(1-*p*)) has a stronger claim: it symmetrizes heads and tails (*p* → 1-*p* maps *λ* → -*λ*), and the problem treats "heads" and "tails" interchangeably. Uniformity on *λ* is invariant under this reflection. Though improper, it corresponds to the Haldane prior Beta(0,0), useful for sparse data. A proper alternative is Jeffreys prior Beta(1/2,1/2), invariant under reparameterization and symmetric in *p* and 1-*p*. Your temptation for uniform *p* is not wrong—it is Beta(1,1), a common conjugate prior—but it lacks the symmetry of log-odds.

  Finally, Bertrand’s chord with no sampling method. Silence is the only defensible answer. Any probability assignment assumes a measure, and no symmetry compels one. Your blurt of "half" must be sacrificed—it is a mental habit, not a reasoned prior.

  Your digit verdict is saved by combinatorial symmetry: ten digits, no distinction. The vessel and particle mass are saved by scale-invariance. The cube factory is saved by context, but weakly—if the context were ambiguous, silence would be better. The natural number case remains rightly silent.

  The principle earns its keep: it grounds indifference in symmetry, respects context, and admits ignorance. Yet it cannot save all your verdicts without context. Your cube factory "one-half" assumes a linear tolerance; if the problem hinted at volumetric production (e.g., "melted plastic poured into molds"), uniformity on volume might prevail. Language matters, but only as a window to invariants. The principle of indifference, sobered by symmetry, is no longer a drunk—but it still requires a designated driver: careful attention to what the problem truly leaves invariant.

  Yours in the pursuit of uncertain clarity.
