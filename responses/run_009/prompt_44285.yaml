  Okay, the user is writing a graduate seminar paper on rationality and irrationality, specifically focusing on self-deception. They've noticed that existing literature talks past itself because there's no agreed-upon set of criteria for what a theory of self-deception should accomplish. They want a clear list of desiderata—requirements that any adequate theory must meet—including concrete cases, necessary distinctions, and constraints from cognitive science. They also want to know which requirements might conflict and which one is most decisive in eliminating theories.

  First, I need to unpack their core concerns. They provided three concrete cases: the trader (avowal vs. behavior tension), the medical results avoider (non-doxastic avoidance), and the man insisting he's over his ex (belief ambiguity). These highlight different facets of self-deception that any theory must handle. They also listed key distinctions: self-deception vs. wishful thinking, sour grapes, biased evidence gathering, akrasia, and being wrong about motives. Constraints include avoiding exotic mental architectures (no homunculi) while not being so deflationary that it loses specificity. 

  The user’s deeper needs seem methodological: they want rigor in defining the target phenomenon before evaluating theories. They’re frustrated by theoretical chaos and seek a framework to force clarity. The mention of "honest contradiction" suggests they value intellectual honesty over artificial neatness—they’d rather expose tensions than paper them over. The request for a "scorecard" at the end shows they want to see how existing theories strain against these criteria, especially where they "rewrite desiderata to survive."

  Now, structuring the response. The desiderata should cover:  
  1. **Phenomenological adequacy**—capturing the lived experience (e.g., the trader’s anxiety).  
  2. **Case coverage**—handling all three paradigmatic cases without forcing them into one mold.  
  3. **Distinctions**—sharp lines between self-deception and neighboring concepts (e.g., wishful thinking lacks tension; sour grapes lacks strategic avoidance).  
  4. **Architectural plausibility**—respecting cognitive science (e.g., no Cartesian theaters).  
  5. **Responsibility-compatibility**—explaining why self-deceivers are blameworthy.  
  6. **Belief-status**—addressing whether the self-deceiver "really believes" their deception (the ex-boyfriend case tests this).  
  7. **Motivational engine**—tying the process to desires/fears without reducing it to mere error.  

  The hardest tension is between **Belief-status** and **Trace-of-truth**: if self-deception requires genuine belief (B6), how can there also be palpable awareness of the contrary truth (B5)? This might be the "contradiction" the user welcomes. The most eliminative requirement is likely **Trace-of-truth**—it sinks deflationary accounts (e.g., Mele) that dismiss residual awareness.  

  For the scorecard:  
  - **Intentionalist (Davidson-esque)**: Handles trace-of-truth and responsibility but violates architectural plausibility by requiring subagents. Quietly rewrites self-deception as near-interpersonal deception.  
  - **Deflationist (Mele-esque)**: Nails architectural plausibility but collapses distinctions (e.g., vs. wishful thinking) and fails trace-of-truth. Rewrites the "tension" as just conflicting evidence.  
  - **Divisionist (partitioned mind)**: Explains case coverage and tension but risks architectural implausibility. Rewrites "subagents" as modules, not homunculi.  

  The user’s emphasis on "which requirement eliminates most theories" points to **Trace-of-truth** as the killer—it’s why Mele’s model feels unsatisfying for cases like the anxious trader. I’ll foreground that tension and score the theories candidly, noting where they fudge desiderata (e.g., deflationists watering down "tension" to mere bias).
answer: |-
  Here is a rigorous set of desiderata for a theory of self-deception, grounded in paradigmatic cases, necessary distinctions, and empirical constraints. The requirements are ordered by thematic clusters, with explicit tensions noted. The "killer" requirement is identified at the end, alongside a scorecard for major theoretical approaches.

  ---

  ### **Core Desiderata for a Theory of Self-Deception**
  #### **I. Phenomenological & Behavioral Adequacy**
  1. **The Tension Requirement**  
     *Must explain the affective/behavioral dissonance in self-deception* (e.g., the trader who professes confidence while compulsively checking prices).  
     *Motivation*: Self-deception isn’t calm error; it involves anxiety, vigilance, or incongruent actions betraying residual awareness of the truth. A theory must account for this "aversive friction."

  2. **The Non-Doxastic Avoidance Requirement**  
     *Must explain cases where self-deception manifests as strategic ignorance without explicit belief* (e.g., refusing to open medical results).  
     *Motivation*: Self-deception often operates *pre-emptively* via evidence avoidance or distraction, not just belief revision. A theory cannot require full-formed false belief as a starting point.

  3. **The Belief-Attribution Ambiguity Requirement**  
     *Must resolve whether the self-deceiver "sincerely believes" their deception* (e.g., the man professing he’s over his ex while acting obsessively).  
     *Motivation*: Self-deception blurs first-person authority. Does he believe it? Half-believe? Believe *that* he believes? A theory must clarify the doxastic status without resorting to evasion ("alief," "pretense").

  ---

  #### **II. Conceptual Demarcation**
  4. **Distinction from Wishful Thinking**  
     *Must differentiate self-deception from passive optimism* (e.g., "I’ll win the lottery!" with no counter-evidence).  
     *Motivation*: Wishful thinking lacks the *tension* and *strategic agency* of self-deception. The latter involves active resistance to threatening evidence.

  5. **Distinction from Sour Grapes**  
     *Must separate self-deception from post-hoc rationalization* (e.g., "I never wanted that job anyway").  
     *Motivation*: Sour grapes is belief revision *after* goal-failure; self-deception occurs *during* pursuit/conflict to *preserve* a desired state.

  6. **Distinction from Biased Evidence Gathering**  
     *Must contrast with rational if motivationally skewed inquiry* (e.g., researching only health benefits of a favored diet).  
     *Motivation*: Selective evidence gathering can be conscious and rationalized. Self-deception requires stronger *epistemic negligence* (ignoring/discounting *available* counter-evidence).

  7. **Distinction from Akrasia & Simple Error**  
     *Must not conflate with weakness of will or ignorance* (e.g., smoking while believing it’s harmful = akrasia; misremembering facts = error).  
     *Motivation*: Akrasia involves acting against one’s *endorsed* belief; self-deception alters the belief itself. Simple error lacks motivational etiology.

  ---

  #### **III. Architectural & Normative Constraints**
  8. **Psychological Plausibility Requirement**  
     *Must be consistent with cognitive architecture* (e.g., no homunculi, minimal subagent duplication).  
     *Motivation*: Freudian "inner deceivers" violate cognitive parsimony and neuroscience. The mind is modular, not neatly split into "deceiver/deceived."

  9. **Responsibility Compatibility**  
     *Must explain why self-deceivers are morally/epistemically culpable*.  
     *Motivation*: If self-deception were wholly unconscious/subpersonal (like visual illusions), blame would lapse. Yet we hold people accountable for it (e.g., "You were lying to yourself!").

  10. **Motivational Anchor Requirement**  
      *Must tether the process to desires/fears without reducing it to them* (e.g., the trader’s dread of admitting failure).  
      *Motivation*: Self-deception isn’t arbitrary; it serves psychic goals (e.g., reducing anxiety, preserving self-esteem). But it can’t *just* be "wanting to believe" (see Wishful Thinking).

  ---

  ### **Key Tensions & the "Killer" Requirement**
  - **Primary Tension**: **B5 (Trace-of-Truth)** vs. **B6 (Belief-Status)**  
    *B5* demands that the self-deceiver retains *some access* to the truth (explaining tension/avoidance).  
    *B6* demands the false state is a *genuine belief* (not half-belief or pretense).  
    **Conflict**: How can one *believe P* while *knowing not-P*? This is the "static paradox" of self-deception.  
    *Proposed Escape*: Theories must model *partial* awareness (e.g., tacit knowledge, attentional control) without full belief contradiction.

  - **The Eliminative Requirement**: **B5 (Trace-of-Truth)**  
    **Why it’s decisive**: This requirement sinks deflationary accounts (e.g., Mele) that reduce self-deception to biased belief-formation without residual truth-tracking. It also challenges intentionalist views (e.g., Davidson) that require simultaneous belief in contradictions. **B5 is non-negotiable** for capturing the phenomenology of self-deception (anxiety, avoidance). Without it, the phenomenon collapses into mere error or bias.

  ---

  ### **Scorecard: How Major Theories Fare**
  | **Requirement**       | **Intentionalist (Davidson)** | **Deflationist (Mele)** | **Divisionist (Partitioned)** |
  |------------------------|-------------------------------|-------------------------|-------------------------------|
  | **B1: Tension**        | ✓ (Conflict between beliefs)  | ✗ (Tension is downstream of bias) | ✓ (Conflict between modules) |
  | **B2: Non-Doxastic Avoidance** | ✗ (Requires belief-inconsistency) | ✓ (Avoidance as evidence-filtering) | ✓ (Pre-attentive suppression) |
  | **B3: Belief-Ambiguity** | ✗ (Asserts contradictory beliefs) | ✓ (Clear false belief) | ~ (Quasi-beliefs in partitions) |
  | **B4: ≠ Wishful Thinking**| ✓ (Strategic intention)     | ✗ (Collapses to motivated bias) | ✓ (Active inhibition) |
  | **B5: Trace-of-Truth** | ✓✓ (Explicit contradictory belief) | ✗ (No necessary awareness) | ✓ (Encapsulated knowledge) |
  | **B6: Belief-Status**  | ✗ (Violates belief consistency) | ✓ (Genuine belief)      | ~ (Belief-fragments) |
  | **B7: ≠ Akrasia/Error**| ✓ (Distinct process)        | ~ (Risk of conflation)  | ✓ (Separate mechanisms) |
  | **B8: No Homunculi**   | ✗ (Implies agent-like subparts) | ✓✓ (Standard cognition) | ~ (Modules ≠ homunculi) |
  | **B9: Responsibility** | ✓ (Intentional = culpable)   | ✗ (Bias may be non-culpable) | ✓ (Agential neglect) |
  | **B10: Motivational**  | ✓ (Desire-driven intention)  | ✓ (Desire biases input) | ✓ (Goal-directed processes) |

  #### **How Theories "Rewrite" Desiderata to Survive**
  - **Intentionalism**: Rewrites **B8** (No Homunculi) by treating subagents as "rational parts" rather than full agents. Dilutes **B6** by stretching "belief" to include contradictory states.  
  - **Deflationism**: Rewrites **B1** (Tension) as mere cognitive dissonance from biased evidence, not intrinsic to self-deception. Evades **B5** (Trace-of-Truth) by denying its necessity.  
  - **Divisionism**: Rewrites **B3/B6** (Belief-Status) by appealing to fragmented, context-sensitive "belief-like" states stored in semi-isolated modules.  

  ---

  ### **Conclusion**
  An adequate theory must reconcile **B5** (Trace-of-Truth) with **B6** (Belief-Status) without exotic homunculi (**B8**) while explaining the distinctive tension (**B1**) and avoidance (**B2**) of self-deception. **B5 is the linchpin**: it preserves the phenomenology but forces models into dynamic or partitioned architectures to avoid static contradiction. The trader, the avoider, and the lovelorn man all demand this residual awareness—without it, self-deception loses its moral sting and psychological texture. Deflationist accounts fail here; divisionist models come closest but risk architectural extravagance; intentionalism maintains tension at the cost of paradox. Your paper’s critical lever is this: any theory that cannot satisfy **B5** while honoring **B6** and **B8** has lost the phenomenon.
