prompt: |-
  I'm a novelist, and for a few years now I've been circling a historical figure of my own -- someone who did real good and real harm, the usual mess -- and I keep tripping over the 'man of his time' defence. You know the one: we can't judge Churchill or Jefferson by our standards, because basically nobody in their world saw things straight. My problem is that whenever I actually try to imagine my guy's world from the inside, the defence starts to look weird, and I think Hilary Mantel already ran the experiment for me.

  Take Wolf Hall. Mantel gives us two men. Thomas More is, philosophically, the sincere man of his time: he burns heretics and genuinely believes he's saving their souls, and the novel doesn't pretend he's a hypocrite -- it shows the conscience as real. And then there's Cromwell, who the novel lets us love partly because he keeps flashing anachronistic signals: a kind of practical religious tolerance, sympathy for the people everyone else in the book treats as trash, a contempt for cruelty that reads like our contempt. Plenty of readers and critics have said this is a cheat -- that Mantel installed a modern man in a Tudor doublet so we'd have someone to root for, and that the real Cromwell was a fixer who ruined a lot of lives. It doesn't help that it's a flip of the older story: Bolt's A Man for All Seasons made More the saint and Cromwell the schemer, and Mantel more or less swaps them.

  So here's what I want: a reading of Wolf Hall through the 'man of his time' defence. Does the novel take a position on it -- and is that position actually the defence's opposite, since the only way Mantel could make the book work at all seems to be finding (or invent) the one powerful man who approximates our standards? Is More there to show us what actually, consistently believing your era's values looks like, and is the horror of that meant to tell us the defence buys too much? Or is the Cromwell move fair, on the grounds that some people in every era do see through it -- abolitionists existed in Jefferson's America, so 'nobody knew better' was always going to be false, and Mantel is just dramatising that fact in one character? And then the harder bit: where does the novel resist the reading? Because Cromwell isn't clean -- he engineers Anne Boleyn's fall and a string of other deaths, the dissolving of the monasteries makes him rich and powerful, and in the later books the revenge and the ruthlessness keep moving toward the front. If he's our proxy, the novel also seems to be saying that even the man who sees through his era has to act with its tools, and gets shaped by them.

  Also, honestly, I want to know what fiction is doing here that the straight debate about Jefferson and Columbus doesn't. Philosophers argue about whether the defence works; a novelist has to actually inhabit someone, and it looks like you can't inhabit a world sincerely and come out with anyone to admire unless the world already contained someone half-admirable. If that's a real constraint on narrative -- not just Mantel's particular choice -- then novels are quietly committed to the claim that every era contains its own internal critics, which is a factual claim the 'man of his time' defence has to be false. Or maybe I've got it backwards and you can write the sincere-man-of-his-time novel -- More's book, so to speak -- and I just haven't found it. I'd take either answer. But do the reading properly: don't let the novel become an illustration of the debate, and don't bend the debate to fit the novel.
reasoning: |-
  Okay, let me unpack this novelist's dilemma. They're wrestling with the "man of his time" defense in historical fiction, using Wolf Hall as a test case. The core tension seems to be: how can we create compelling historical characters without either whitewashing them with modern sensibilities or rendering them irredeemable by contemporary standards? 

  Mantel's solution fascinates them - she gives us two archetypes: More as the sincere believer in his era's cruel norms, and Cromwell as the anachronistically empathetic operator. But is this a narrative cheat? The novelist suspects Mantel had to invent Cromwell's modernity to make the story work, which would imply every era must contain proto-modern figures to be novelistically viable. That's a huge claim about history and fiction.

  Hmm, the layers here are thick. First, we need to examine whether Wolf Hall actually endorses the "man of his time" argument or subverts it. Then, consider Cromwell's complexity - he's not purely "modern," he's still complicit in Tudor brutality. The novelist is really asking two things: what truth does fiction reveal about historical morality that philosophical debates miss, and whether novels structurally require internal critics to function.

  I recall Mantel's Cromwell isn't just a 21st century transplant - his tolerance stems from lived experience (merchant class worldview, European exposure) not modern ethics. That's crucial. And More isn't just a villain; his conviction reveals how ideology consumes even good minds. The horror isn't in his sincerity but in the system that makes burning heretics feel righteous.

  For the Jefferson comparison: yes, every era has dissenters, but Mantel shows more - that complicity and resistance coexist in individuals. Cromwell advocates for reform but also engineers executions. That's the messy truth novels capture better than philosophy: morality in motion, within systems that constrain choices.

  The novelist's insight about narrative constraints feels profound. To make readers inhabit a world, you need psychological access points - but does that necessarily mean creating "half-admirable" figures? Not always. I think of Coetzee's Disgrace or McCarthy's blood-soaked worlds where we comprehend without admiring. But for sustained immersion like Wolf Hall, perhaps some alignment is needed. Yet Mantel's Cromwell isn't admirable so much as legible - we understand his compromises.

  Where Wolf Hall resists simplification: Cromwell's later brutality shows how power corrodes even critical minds. The system doesn't just punish dissenters; it co-opts them. That's the real challenge to "man of his time" - not that critics existed, but that the era's logic inevitably reshapes them. Fiction's power is showing this process in the marrow, not just the idea.

  The novelist might find their answer in Mantel's balance: she gives us access through Cromwell's semi-familiarity, then makes us taste the Tudor reality that distorts him. The defense isn't false because critics existed; it's inadequate because it excuses systemic harm by blaming "the time" when the novel shows people making choices within constraints. More's cruelty and Cromwell's complicity are both products of agency within systems - that's what fiction can lay bare in ways debate cannot.
answer: |-
  You've struck at the nerve where historical fiction bleeds into moral philosophy. Let's dissect *Wolf Hall* through the lens of the "man of his time" defence, respecting both Mantel's craft and your astute observations about narrative constraints:

  ### Mantel's Subversion of the Defence (Not Its Rejection)
  *   **More as the Defence's Logical Endpoint:** You're right. More *is* the embodiment of the "sincere man of his time." Mantel renders his piety, intellectual rigor, and commitment to orthodoxy with terrifying conviction. The horror lies precisely in showing *how* such sincerity manifests: the absolute certainty, the psychological torment inflicted on his family, the cold satisfaction in burning heretics "for their own good." The defence isn't invalidated by More's existence; it's rendered horrific. Mantel says, *"This* is what unwavering belief in your era's 'truth' looks like. Do you find it admirable, or monstrous?" The defence often seeks to soften judgment; Mantel uses More to sharpen it by showing its lived reality.
  *   **Cromwell as the Defence's Undoing (But Not a Modern Man):** Here's the crucial nuance. Mantel doesn't invent a "modern man." She constructs **a plausible dissenter *within* the Tudor frame.** His "anachronisms" have roots:
      *   **Merchant-Class Pragmatism:** His tolerance isn't Enlightenment humanism; it's the merchant's understanding that persecution is bad for trade, stability, and predictable governance. His sympathy for the downtrodden stems from *being* one – the blacksmith's son, the mercenary – not abstract principle. His contempt for cruelty is personal trauma (Walter Cromwell's violence) and professional irritation at *wasteful* suffering.
      *   **European Exposure:** His time abroad exposed him to different ideas and practices, making him skeptical of English parochialism.
      *   **Instrumental Humanism:** His "tolerance" often serves power. Protecting reformers can undermine the Pope; showing mercy can bind loyalty to the Crown (or Cromwell himself).
      *   **The Abolitionist Parallel:** You identified it perfectly. Mantel uses Cromwell to demonstrate the defence's inherent flaw: **"Nobody knew better" is empirically false.** There were always dissenters, critics, those who saw cracks in the dominant ideology – Erasmus, Tyndale, even elements within the Church pushing for reform. Cromwell embodies this *fact* of historical dissent, making the blanket defence untenable. He *is* the proof that alternatives were conceivable *within* the time.

  ### Where the Novel Resists Simplification (Cromwell's Complicity & the Trap of Power)
  *   **The Tools of the Era:** This is Mantel's masterstroke and your key insight. Cromwell *must* use the era's tools. He cannot build a modern liberal state. He navigates a world defined by patronage, violence, religious absolutism, and dynastic ambition. To achieve *any* reform, stability, or personal survival, he must:
      *   **Engineer Anne's Downfall:** He doesn't do it *for* modern ideals. He does it because Henry commands it, because Anne threatens his faction, because it secures his position, and perhaps because he genuinely sees her as a threat to the realm. The human cost is undeniable, and Mantel doesn't shy from it.
      *   **Enforce Tyranny:** He serves Henry's will, which includes crushing dissent (e.g., the Pilgrimage of Grace) and eliminating threats (More, Fisher). His "modern" instincts bow to political necessity.
      *   **Profit from the Dissolution:** His wealth and power are inextricably linked to the dismantling of the monasteries. This isn't hypocrisy; it's the reality of operating within the system. Reform requires power, and power in Tudor England required land and wealth.
  *   **The Shaping Power of the Era:** As the trilogy progresses, Mantel meticulously shows how the system *corrupts* Cromwell, even as he tries to operate within it. The ruthlessness becomes less instrumental, more habitual. The pursuit of security becomes entangled with personal vengeance (Wolsey's ghost). **He becomes, tragically, more "of his time" the longer he wields its power.** He doesn't transcend the era; he is increasingly defined and ultimately destroyed by its brutal logic. He *is* a fixer who ruins lives, *and* he is the man capable of flashes of empathy and pragmatism that hint at different possibilities.

  ### What Fiction Does That Philosophy Cannot
  *   **Inhabiting the Contradiction:** The philosopher debates the validity of the defence abstractly. The novelist *embodies* the paradox. Mantel forces us to *live* inside Cromwell's mind – seeing the world through his pragmatic, often surprisingly empathetic eyes *while simultaneously* witnessing him orchestrate acts we find abhorrent. We understand his necessity, his logic, even his moments of compassion, *while* recoiling from his actions. This is the irreducible complexity the defence often flattens.
  *   **The Sincerity Trap:** Fiction uniquely exposes the *emotional* and *psychological* reality of holding beliefs. More's sincere torment and Cromwell's pragmatic compromises aren't just positions; they are lived experiences rendered with visceral detail. We see *how* belief motivates action (More's persecutions) and *how* compromise corrodes the soul (Cromwell's descent).
  *   **The Narrative Constraint (Your Key Insight):** You are fundamentally correct. **To make a historical world *inhabitable* for a modern reader over the course of a sustained narrative, especially one centered on power, the novelist often *does* need a character who provides an access point – a figure whose consciousness resonates, however partially, with modern sensibilities.** Pure, unadulterated adherence to the era's most alien/repugnant values (like More's burning zeal) makes sustained empathetic engagement incredibly difficult for a protagonist. Cromwell *is* that access point. Mantel doesn't claim he's historically "modern," but she constructs him as psychologically *legible* to us through his pragmatism, skepticism, trauma, and flashes of human concern – traits that *did* exist, scattered and often suppressed, within the period.
      *   **Is this a commitment to universal dissent?** Not necessarily "dissent" in an organized sense, but to the *existence of cognitive dissonance, pragmatic adaptation, and varied human responses within any system.* Mantel finds the cracks in the Tudor monolith *because they were there*, not because she invents them wholesale. The novel demonstrates that human psychology, even then, wasn't monolithic.

  ### The "Sincere-Man" Novel: Possible, But Difficult
  You ask if you can write the "More novel." You *can*, but the challenges are immense:
  1.  **Protagonist as Antagonist:** Your central figure's sincere beliefs might make them the antagonist in the reader's eyes. Sustaining narrative drive requires immense skill.
  2.  **Access Point Needed:** Even in such a novel, you'd likely need *other* characters (subordinates, victims, family) through whose more relatable suffering or perspective the reader accesses the horror of the protagonist's sincerity. *Wolf Hall* itself uses characters like Rafe, Helen Barre, and Cromwell's household to provide warmth and vulnerability against More's cold certainty and Cromwell's necessary ruthlessness.
  3.  **Examples:** Cormac McCarthy's *Blood Meridian* (Judge Holden is pure, terrifying evil, sincerely enacting his philosophy), some portrayals of Torquemada or Calvin, or Coetzee's *Waiting for the Barbarians* (the Magistrate's journey exposes the horror of the Empire's sincere "civilizing" mission). These often focus on the *consequences* of sincerity rather than asking the reader to *inhabit* the sincere persecutor as the sole protagonist for 500+ pages.

  ### Conclusion: Mantel's Position & Fiction's Power
  Mantel doesn't simply reject the "man of his time" defence. She **complexifies and destabilizes it**:
  1.  **It Shows the Horror of Sincerity:** Unwavering belief in era-specific values can be monstrous (More).
  2.  **It Exposes the Defence's False Universality:** Dissent, doubt, and pragmatic adaptation *did* exist (Cromwell as the plausible dissenter).
  3.  **It Reveals the Inescapable Complicity:** Even the dissenter/critic must wield the era's tools of power, becoming stained and ultimately destroyed by them (Cromwell's arc).
  4.  **It Demonstrates Narrative Necessity:** To make the past fully immersive and psychologically engaging over a long narrative, especially centered on power, fiction often requires a protagonist whose consciousness offers points of connection *we* recognize – pragmatism, skepticism, trauma, empathy – traits that *were* present, if not dominant, in the past. This isn't cheating history; it's finding the human threads that bridge the centuries.

  **Fiction's unique power lies not in adjudicating the defence, but in forcing us to *experience* the agonizing tension between historical context and moral judgment, between sincere belief and its terrible consequences, between the desire for reform and the corrupting nature of power – all within the mind of characters who feel terrifyingly, compellingly real.** Mantel succeeds because she holds these contradictions in suspension, refusing easy answers, showing us the mud and blood and flickering candlelight of history where philosophy sees only the argument. Your challenge is to find the specific cracks in your historical figure's world through which your reader's empathy and horror can enter.
