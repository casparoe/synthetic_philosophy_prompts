  Okay, let me start by unpacking the user's request. They're a metaethics PhD student tasked with teaching the Frege-Geach problem to non-philosophers in a 45-minute session. The audience includes grad students from econ, linguistics, and psych. The user knows the material well but needs pedagogical advice on structuring the session effectively.

  First, I need to identify the core challenge: making a technical problem in expressivism accessible without prior metaethics knowledge. The audience is familiar with basic logic, so leveraging that is key. The user mentioned avoiding the standard "tormenting the cat" example and wants something relatable for econ students. They also want to preempt common misconceptions.

  The user’s explicit needs are:
  - Sequence of topics: Order of presentation to build understanding step-by-step.
  - Example choice: A realistic scenario econ students would engage with.
  - Misconceptions: Where they might arise and how to address them.
  - Scope: What to exclude due to time constraints.
  - Assessment: A question to gauge understanding.

  Deeper needs might include:
  - Ensuring the audience sees the problem as logical, not psychological.
  - Avoiding trivial objections or oversimplifications.
  - Clarifying that the issue is about compositional semantics, not truth-conditions.
  - Making expressivism's initial plausibility clear before introducing the problem.

  For the sequence, starting with negations is smart because they're simpler than conditionals. It builds from easy to complex. The murder example is standard but effective; the user wants an alternative. An econ-related example involving cost-benefit analysis could work, but mixing descriptive and moral premises might confuse. Instead, using a premise all agree on, like "bribery is corrupt," keeps it neutral yet relatable.

  Common misconceptions:
  - Biting the bullet: Addressing early when defining expressivism.
  - Ambiguity: Tackled when discussing unembedded sentences.
  - Expressivism is dead: Emphasize ongoing research at the end.
  - Inferring attitudes: Clarify during the inference explanation.

  Time limitations mean avoiding hybrids and deflationism. The key takeaway should be the compositional challenge, not a verdict on expressivism.

  The assessment question should test if they grasp that the same word must contribute uniformly across contexts for validity. For example, asking why ambiguity isn't a solution would reveal if they understand the need for a consistent semantic contribution.

  In summary, the plan must logically build from expressivism basics to the problem with embeddings, using relatable examples, preempting pitfalls, and focusing on the logical structure issue.
answer: |-
  Here's a battle-tested 45-minute pedagogical plan focused on making the *logical structure* problem vivid for your audience. The core strategy: **Build expressivism's initial plausibility, then show how embeddings sabotage its core mechanism in a way that breaks logic they care about.**

  **Sequence & Why Order Matters (Do NOT Reorder):**

  1.  **Hook: The Appeal of Expressivism (5 mins)**
      *   Start with the **psych/econ angle:** "How do we explain *disagreement* when people have fundamentally different values? If morality isn't like physics, maybe 'bribery is wrong' isn't *describing* a fact but *expressing* a pro/con attitude (disapproval of bribery)." Whiteboard: `"Bribery is wrong" --> Expresses DISAPPROVAL of bribery`.
      *   **Why first?** Establishes expressivism as motivated by plausible concerns (disagreement, non-objectivity) *before* the problem. Makes them see why it's attractive. Skipping this makes the problem seem like an attack on a strawman.
      *   **Key Point:** Expressivism offers a *psychological/social* explanation for moral language function.

  2.  **The Core Mechanism: Unembedded Sentences & Attitude Expression (5 mins)**
      *   "So, when someone *asserts* 'Lying is wrong,' according to expressivism, what's happening?" Elicit: They are expressing their disapproval of lying. Whiteboard it.
      *   Introduce simple negation: "What about *asserting* 'Lying is *not* wrong'?" Elicit: Expressing *lack* of disapproval of lying? Or approval? **Focus:** The expressivist needs a story for the attitude expressed by the *negated* sentence itself.
      *   **Why here?** Negation is simpler than conditionals and introduces the idea that sentence structure (even simple negation) must map to attitude states. It primes them for compositionality. **Your instinct is GOOD: Negated sentences ARE a valid on-ramp.** It builds complexity stepwise.

  3.  **The Problem Revealed: Embeddings & Logic (15 mins - The Core)**
      *   **Transition:** "Okay, so expressivism seems to work for simple assertions and denials. But moral language doesn't exist in a vacuum. We use it *inside* bigger sentences, like in arguments. That's where things get tricky."
      *   **The Killer Inference (Econ-Friendly Version):**
          *   P1. If funneling campaign funds through shell corporations is corrupt, then senior executives who approve it should be disqualified from future board positions.
          *   P2. Funneling campaign funds through shell corporations *is* corrupt.
          *   C. Therefore, senior executives who approve it should be disqualified from future board positions.
      *   **Why this example?**
          *   **Relatable:** Econ/psych folks understand corporate governance, corruption, consequences. "Corrupt" functions morally here but feels less loaded than "murder". Premises feel like things they *might* endorse or debate professionally.
          *   **Does the Job:** Clear MP structure. P2 is a *simple, asserted moral claim*. P1 is a *conditional with a moral antecedent*. C is a *non-moral (or mixed) consequent*.
          *   **Avoids Pitfalls:** No mixed descriptive/moral premises *in the inference itself* (P1's antecedent is moral, consequent is practical; P2 is purely moral; C is practical). Avoids the "carrying" example's psychological weirdness. The focus is purely on the *logical role* of the moral term in P1.
      *   **Whiteboard the Inference:** Highlight the structure. Emphasize: **We all agree this is VALID.**
      *   **Challenge:** "Expressivism says *asserting* P2 expresses disapproval of funneling funds. Great. But what is happening with P1? When I *assert* the whole conditional 'If funneling is corrupt, then execs should be disqualified', what attitude am I expressing? Am I expressing disapproval of funneling? Probably not! I might think funneling is corrupt but *not* think execs should be disqualified, or vice versa. Asserting the conditional doesn't commit me to either attitude about funneling *by itself*."
      *   **The Problem Crystalized:** "The moral term 'corrupt' in P1 *looks* the same as in P2. But in P1, it's not doing its core expressivist job (expressing disapproval) because the whole sentence isn't asserting that funneling *is* corrupt. Yet, for the inference to be valid, 'corrupt' *must mean the same thing* in P1 and P2. Otherwise, it's equivocation – like using 'bank' to mean riverbank in P1 and financial institution in P2. The inference would be invalid!"
      *   **Whiteboard Contrast:**
          *   `P2: "Funneling is corrupt" (Asserted) --> Expresses DISAPPROVAL of funneling`
          *   `P1: "If funneling is corrupt..." (Embedded) --> Expresses ??? (Not disapproval of funneling!)`
          *   `BUT LOGIC REQUIRES: 'corrupt' in P1 == 'corrupt' in P2`

  4.  **Why This Is a Problem *for Expressivism* (5 mins)**
      *   "Expressivism, as initially sketched, ties the meaning of the moral term *directly* to the act of expressing an attitude *when the sentence is asserted*. But in embeddings like P1, the sentence *isn't* used to express that attitude. So, what *does* 'corrupt' mean in P1? How does its meaning compose with 'if...then' to form the meaning of the whole conditional? And crucially, how does it manage to be *the same meaning* as in P2 so the inference is valid?"
      *   **The Core Issue:** Compositionality + Identity of Meaning across asserted/unasserted contexts. Expressivism's core mechanism (attitude-expression-in-assertion) doesn't automatically give it this.

  5.  **Addressing Predicted Misconceptions (Integrated & Proactive - 5 mins)**
      *   **Biting the Bullet (False/Meaningless Embeddings):** "Could expressivism just say embedded moral sentences like the antecedent of P1 are false or meaningless? **NO.** That destroys logic. Our inference *is* valid. We use moral terms meaningfully in conditionals, questions ('Is funneling corrupt?'), etc., all the time. Denying this makes expressivism descriptively inadequate." *(Address this when setting up the logic's validity in step 3)*.
      *   **Ambiguity (bank/bank):** "Is 'corrupt' just ambiguous? Does it mean one thing (express disapproval) in P2 and something else in P1? But then the inference *is* invalid due to equivocation! Yet we know it *is* valid. The whole point of logic relies on terms meaning the same thing throughout." *(Address this explicitly when contrasting the attitude expression in P1 vs P2 and stating the logic's requirement for identity of meaning)*.
      *   **Expressivism is Dead:** "This is a *serious* challenge, not a death knell. Smart expressivists (Blackburn, Gibbard) have spent decades developing sophisticated solutions (quasi-realism, norm-expressivism). The problem forces them to build a more complex semantic theory." *(Mention this near the end when discussing scope)*.
      *   **Inferring Attitudes:** "The problem isn't that you can't infer an attitude *towards the conclusion* from attitudes towards the premises. The problem is explaining *what the premises even mean* (especially the embedded one) such that the inference is *logically valid* in the standard sense." *(Clarify this when explaining why the attitude-expression story for P1 fails - the issue is the meaning of the premise itself, not the inference to the attitude about the conclusion)*.

  6.  **Scope & Unfinished Business (3 mins - Be Brutally Honest)**
      *   "In 45 minutes, we've seen *why* embeddings create a compositional headache for the simple expressivist story. We **haven't** seen:
          *   **Solutions:** How quasi-realism or norm-expressivism tries to build a logic-friendly semantics using planning states, commitments, or complex propositional analogs. (Mention Blackburn/Gibbard by name).
          *   **Hybrid Expressivism:** Views adding a descriptive element – this introduces its *own* complexities with embeddings!
          *   **Deflationist Moves:** Saying 'truth' is cheap and we don't need robust truth-conditions. **WARNING:** This crowd *will* ask. Shut it down: "While deflationism about truth is interesting, the Frege-Geach problem is fundamentally a problem about *compositional semantics*: How do the meanings of parts combine to form the meaning of the whole, and how is identity of meaning maintained across contexts? Deflationism alone doesn't magically solve that compositional puzzle for the expressivist. Sophisticated expressivists often *use* deflationism as *part* of a larger solution, but it's not a silver bullet." *(Be firm – this rabbit hole eats 45 mins by itself)*.
      *   **Goal Restated:** "You should leave not thinking expressivism is dead, but understanding *why* it has to be much more sophisticated than 'moral sentences just express feelings' to handle logic."

  7.  **The Assessment Question (2 mins)**
      *   **Question:** "We saw that for the Modus Ponens argument to be valid, the word 'corrupt' has to mean the same thing in Premise 1 (the conditional) and Premise 2 (the simple assertion). Why is it *especially tricky* for the expressivist to explain how 'corrupt' manages to mean the same thing in *both* of these very different contexts?"
      *   **What Reveals Understanding:** A good answer will connect the core expressivist idea (word meaning tied to attitude expressed *in assertion*) to the fact that in the embedded context (P1 antecedent), the word *isn't* being used to express that attitude, creating a tension for maintaining identical meaning. They should mention the need for compositionality and the threat of equivocation. If they just say "because one is asserted and one isn't," push for *why that matters for expressivism specifically*.

  **Why This Sequence Works & What 45 Mins Can't Do:**

  *   **Builds Plausibility First:** Starts with why expressivism seems attractive (step 1), making the problem a genuine puzzle, not an obvious flaw.
  *   **Scaffolds Complexity:** Simple assertion/negation (step 2) -> Embedded conditional (step 3).
  *   **Leverages Their Strength:** Uses their logical competence (MP validity) as the anchor. The problem becomes "Expressivism breaks *your* logic."
  *   **Targets the Core:** Relentlessly focuses on the *compositional semantics* challenge: same word, same meaning, different linguistic context (asserted vs. unasserted), core expressivist mechanism fails in the unasserted context.
  *   **Preempts Pitfalls:** Addresses misconceptions contextually as they naturally arise.
  *   **Manages Expectations:** Clearly states limits (no solutions, no deflationism quick fix).

  **What 45 Mins Can't Deliver:** A deep understanding of *solutions* (quasi-realism, norm-expressivism) or the nuances of hybrid views. It won't convince them expressivism *can* be saved, only that the problem is serious, logical, and requires sophisticated semantics. They *will* leave seeing it's about logic, not yelling feelings.

  **Pedagogical Grit:** Be ruthless with time. Use the whiteboard heavily for the inference structure and the attitude-expression contrasts. Shut down deflationism/hybrids quickly but firmly. Your energy should convey that this is a *cool* logical puzzle inherent to a view they might initially find plausible. Good luck!
