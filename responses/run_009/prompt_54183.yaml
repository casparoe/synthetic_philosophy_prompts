prompt: |-
  My ethics tutor keeps saying Rawls basically proved that utilitarianism is mathmatically incoherent, because adding up utility across people ignores the separateness of persons. But when I actually looked into it I found Harsanyi's theorem, which derives the utilitarian aggregation rule from expected utility axioms plus pareto?? So somebody must have made an error somewhere — is it Rawls or Harsanyi? They can't both be right about the math, and I'd have thought if one of them had really botched a proof, someone would've retracted it by now, so which is it?
reasoning: |-
  Okay, let's tackle this user's question. They're confused because their ethics tutor claims Rawls proved utilitarianism is mathematically incoherent due to ignoring the separateness of persons. But the user found Harsanyi's theorem, which uses expected utility axioms and Pareto to derive utilitarianism. So they're wondering who made a mistake.

  First, I need to recall both philosophers' arguments. Rawls criticizes utilitarianism for treating society as a single entity, summing utility across individuals. He uses the veil of thought experiment to argue for maximin instead. Harsanyi, on the other hand, uses von Neumann-Morgenstern expected utility theory. He imagines impartial observers behind a veil of ignorance, leading to average utilitarianism.

  The key here is understanding their different premises. Rawls rejects the veil of ignorance involving probabilities, while Harsanyi embraces it. They start from different assumptions, so their conclusions differ. The user thinks there's a contradiction, but it's more about foundational disagreements.

  The user's deeper need might be understanding why both are accepted despite seeming contradictions. They might be struggling with how ethical theories can coexist without one being outright wrong. Explaining the divergent axioms and how they lead to different conclusions is crucial. Also, addressing the separateness of persons point—Rawls sees it as a moral axiom, while Harsanyi's model might not account for it directly. Highlighting that Harsanyi's approach is mathematical, while Rawls' is normative, helps clarify the conflict isn't about math but underlying values.
answer: |-
  That's an excellent and perceptive question that cuts to the heart of a major debate in ethics and social choice theory. **Neither Rawls nor Harsanyi made a fundamental mathematical error in their proofs within their own frameworks. The apparent contradiction arises because they start from radically different, and fundamentally incompatible, philosophical premises about rationality, fairness, and the nature of persons.** Let's break this down:

  1.  **Harsanyi's Theorem: The "Impartial Observer" Argument**
      *   **Goal:** To derive a social welfare function from individual preferences under uncertainty.
      *   **Premises:**
          *   **Individual Rationality:** Each individual has well-defined preferences satisfying the axioms of von Neumann-Morgenstern (VNM) expected utility theory. This means they have cardinal, interpersonally comparable utility functions (up to a positive affine transformation).
          *   **Ethical Preferences:** There exists an "impartial observer" (or equivalently, each person can adopt an impartial viewpoint). This observer is *sympathetic* (can imagine being any person in society) and *impartial* (has an equal chance of being any person).
          *   **Rationality of the Impartial Observer:** The impartial observer's preferences over social states *also* satisfy the VNM axioms. Their choice is made under *risk* (known probabilities).
          *   **Pareto Principle:** If every individual prefers social state A to social state B, then the impartial observer prefers A to B.
      *   **Conclusion:** The impartial observer's utility function must be a *weighted sum* of individual utilities. If they assume an *equal probability* of being any person, this becomes the simple *sum* (or average) of individual utilities – **Utilitarianism**.
      *   **Mathematical Coherence:** Within this framework, given the premises, the conclusion is mathematically sound. VNM rationality + Sympathy/Impartiality + Pareto => Utilitarianism. The "adding up" is justified by the observer facing a risky choice over possible identities.

  2.  **Rawls's Critique & Maximin: The "Original Position" Argument**
      *   **Goal:** To derive principles of justice that are fair to all individuals, respecting their separateness.
      *   **Premises:**
          *   **The Original Position:** Individuals choose principles of justice from behind a "veil of ignorance." They do *not* know their own place in society, talents, social status, conception of the good, etc.
          *   **Separateness of Persons:** This is the core moral axiom. Society is not a single person; individuals are distinct beings with their own lives to lead. Sacrificing one for the greater good of others is fundamentally unfair. **This is the direct challenge to utilitarianism's "adding up."**
          *   **Rejection of Probabilities:** Rawls *explicitly rejects* the idea that people behind the veil can assign probabilities to being any particular person or having any particular endowment. He argues there's no objective basis for such probabilities, rendering them arbitrary (the "principle of insufficient reason" critique).
          *   **Rationality under Radical Uncertainty:** Without probabilities, VNM rationality *cannot apply*. Agents cannot maximize *expected* utility. Instead, Rawls argues rational agents would be extremely risk-averse in this unique situation of choosing the fundamental structure of their entire lives.
      *   **Conclusion:** Rational agents in the Original Position, respecting the separateness of persons and facing radical uncertainty, would choose the **Maximin Rule**: arrange society to maximize the position of the worst-off group. This leads to his Two Principles of Justice.
      *   **Critique of Utilitarianism:** Rawls argues utilitarianism *ignores* the separateness of persons by treating society as a single entity aggregating satisfactions. It violates fairness by potentially sacrificing fundamental liberties or life chances of some for the greater sum of others. **He sees Harsanyi's use of risk/probability as smuggling in assumptions that ignore the distinctness of individuals and the radical nature of the choice in the Original Position.**

  **Why They Can Both Be "Mathematically Correct" (Within Their Premises) and Yet Incompatible:**

  1.  **Radically Different Conceptions of the Choice Situation:**
      *   **Harsanyi:** Impartial Observer/Choice under *Risk* (known, equal probabilities of being anyone). VNM rationality applies.
      *   **Rawls:** Original Position/Choice under *Radical Uncertainty* (no basis for assigning probabilities). VNM rationality is inapplicable. Maximin is proposed as rational under this specific, extreme uncertainty.

  2.  **Divergent Views on Rationality:**
      *   **Harsanyi:** Accepts VNM expected utility theory as the universal standard of rationality, applicable to all choices under uncertainty/risk, including ethical choices.
      *   **Rawls:** Argues that the unique, high-stakes, foundational nature of the choice in the Original Position demands a *different* principle of rational choice (Maximin) than standard expected utility maximization.

  3.  **Different Philosophical Starting Points:**
      *   **Harsanyi:** Primarily an economist/social choice theorist. Focuses on aggregating individual preferences consistently under plausible axioms (sympathy, impartiality, Pareto, VNM rationality). The "separateness of persons" isn't a foundational axiom that overrides the logic of aggregation under risk.
      *   **Rawls:** Primarily a moral/political philosopher. "Separateness of persons" is a fundamental moral axiom. Fairness requires principles that no individual could reasonably reject, even if they ended up being the worst-off. Utilitarianism fails this test.

  **Where the "Error" Perception Comes From:**

  *   **Rawls's Tutor:** Is emphasizing Rawls's core *moral* critique: utilitarianism fails to respect the distinctness of individuals. While Rawls argues his framework is *more rational* under the Original Position, the heart of his objection is normative: aggregating utilities violates a fundamental principle of fairness. Calling it "mathematically incoherent" is likely shorthand for "morally incoherent *because* it ignores a fundamental moral truth (separateness), rendering the math ethically irrelevant or misleading." Strictly speaking, the math of adding utilities is coherent *if* you accept interpersonal comparability and aggregation.
  *   **Harsanyi's Theorem:** Demonstrates that *if* you accept the specific axioms he proposes (especially VNM rationality for the impartial observer and the use of known probabilities), then utilitarianism *is* the logical outcome. The math here is generally accepted as sound.

  **Conclusion: The Conflict is Philosophical, Not Purely Mathematical**

  *   **Harsanyi** shows that **if** you model fairness as an impartial observer facing a risky choice with equal probabilities of being anyone, **and** you accept VNM rationality for that observer, **then** utilitarianism follows mathematically.
  *   **Rawls** argues that this model fundamentally **misrepresents** the nature of the moral problem: fairness isn't about aggregating utilities under risk; it's about finding principles acceptable to distinct individuals facing radical uncertainty about their own position, respecting their separateness. He rejects the applicability of VNM rationality and probabilities in this context and offers Maximin as the rational alternative.

  **So, who's "right"?** It depends entirely on which set of philosophical starting points you find more compelling:

  *   Do you believe a genuinely fair/impartial choice *requires* the radical uncertainty of the Original Position and the rejection of probabilities? (Rawls)
  *   Or do you believe sympathy, impartiality, Pareto, and VNM rationality provide a sufficient and appropriate basis for defining social welfare? (Harsanyi)
  *   Is the "separateness of persons" a moral axiom that must constrain any aggregation rule, rendering utilitarianism invalid *regardless* of its mathematical coherence within a different framework? (Rawls)
  *   Or is the impartial observer under risk a valid way to model fairness, making the mathematical aggregation justified? (Harsanyi)

  The debate between Rawlsians and (Harsanyi-style) Utilitarians continues precisely because both offer powerful, internally consistent arguments built on fundamentally different foundations. Neither "botched the proof"; they proved different things based on different assumptions about justice, rationality, and the nature of persons. Your tutor is expressing the Rawlsian moral conviction, while Harsanyi provides a coherent alternative model based on different premises.
