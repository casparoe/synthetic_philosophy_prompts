prompt: |-
  You are an expert in value theory, the logic of preference, and practical decision analysis. Think carefully and systematically before you write; begin by brainstorming the different ways pairwise "better than" verdicts can fail to fit together before you settle on your procedure.

  I am the editor of a publication that reviews consumer products. Our bread and butter is the head-to-head verdict: we test two products and publish a sentence of the form "A is better than B for most buyers." Each comparison is written by one tester in about an hour, and I sign off on every verdict. Recently a reader wrote in pointing out that across three of our running-shoe comparisons we had declared model A better than B, B better than C, and C better than A — with the same criteria cited each time. When I asked the testers involved to defend the cycle, each individually insisted their verdict was right. This made me realize we have no framework at all, and I suspect the problem is not sloppiness but something philosophers of value have worried about for a long time: whether "better than" is even transitive, and whether it is exhaustive — whether any two comparable options must be better, worse, or exactly equal, or whether there is room for a verdict of "on a par," neither better nor worse nor equal.

  Please write a decision procedure my testers can actually run on a proposed head-to-head comparison. It should specify, in order: the questions to ask, what counts as a sufficient answer to each, when the procedure licenses the verdict "A is better than B," when it forces us to publish something other than a winner (a tie, a parity verdict, or a "different buyers should pick differently" split), and where the procedure stops and hands the decision to me because the question is one of values rather than facts. The procedure must grapple with three specific hazards. First, chained small differences: testers often judge that a one-gram difference in weight or a barely perceptible difference in cushioning makes no difference to the verdict, but a chain of such differences can lead from a verdict any tester would endorse to one nobody would. Decide explicitly how the procedure should treat imperceptible or negligible differences, and be honest about the cost of each option — treating them as real differences risks false precision, treating them as no difference risks absurd conclusions. Second, parity: when two products are dissimilar in strengths and weaknesses such that neither is better but they are not a tie either, the procedure needs a way to say so that is still useful to readers. Third, cycles: specify what the team should do if, after following the procedure honestly, the verdicts around a set of products still form a loop — whether that is a bug in the procedure, a fact about value, or a signal that the verdict format itself is wrong for that product category, and what I should publish in the meantime.

  Then run the procedure on three cases. Case one: two running shoes where one is measurably lighter and the other measurably better cushioned, and our testers split on which matters more. Case two: a chain of five mattress models, each differing from the next by one incremental improvement in coil count that no sleeper could feel, ranging from a budget model to a luxury model that is clearly better overall. Case three: two laptops where one wins on every measured specification, yet all three testers independently preferred using the other and struggled to articulate why. In the third case, I expect the procedure to give me an answer I will not like, since our traffic depends on clean winners; say plainly what that answer is.

  Finally, say what the procedure cannot do — which kinds of comparisons it will settle badly no matter how faithfully it is followed, and where "better than" talk is the wrong tool altogether.

  Begin your response with the procedure's single most important rule stated in one sentence, then give the full procedure and the reasoning behind it. Do not open with any preamble or restatement of this request. Write in American English throughout. You do not need citations or reading lists; what I want is the reasoning, made usable.
reasoning: |-
  We are going to design a decision procedure for pairwise comparisons that is robust against intransitivities, respects the possibility of parity, and handles negligible differences and cycles appropriately.

  The single most important rule: **Any pairwise "better than" verdict must be justified by a decisive advantage in at least one criterion that matters to most buyers, without being outweighed by disadvantages in other criteria, and without relying on a chain of negligible differences that individually would not change the verdict.**

  **Full Procedure:**

  **Step 1: Define the Criteria**
  - The tester must list the criteria (e.g., weight, cushioning, durability, price) that are relevant for the product category and for most buyers. 
  - For each criterion, specify how it will be measured (objectively or subjectively) and whether it is a "more is better" or "less is better" attribute.
  - *Sufficiency*: The list must cover the dimensions that matter to the majority of buyers in this category, based on market research, reader surveys, or editorial guidelines. If the tester cannot define at least three criteria (unless the category is inherently one-dimensional) or if the criteria are not clearly measurable, the editor must be consulted.

  **Step 2: Measure and Normalize**
  - For the two products (A and B), measure each criterion. Objective criteria (e.g., weight, price) are recorded as numbers. Subjective criteria (e.g., comfort) are rated on a predefined scale (e.g., 1-10) by the tester, with clear anchors (e.g., 1 = very uncomfortable, 10 = extremely comfortable).
  - Normalize the measurements so that for each criterion, the difference between A and B is expressed in comparable units (e.g., standard deviations from the mean for that criterion in the category, or a simple percentage difference). The goal is to see the magnitude of the difference in each criterion.

  **Step 3: Assess Perceptible and Meaningful Differences**
  - For each criterion, determine if the difference between A and B is perceptible and meaningful to a typical buyer. 
    - **Perceptible**: A difference that a typical user would notice in normal use without measurement tools. If a difference is not perceptible, it cannot be the basis for a decisive advantage. (But note: some non-perceptible differences might still matter if they affect durability, etc. — so we must also consider meaningfulness.)
    - **Meaningful**: A difference that, if perceptible, would change the preference of a significant portion of buyers. Even if not perceptible, a difference might be meaningful if it has long-term consequences (e.g., a 10% difference in durability might not be noticeable in a short test but matters over time).
  - *Rules for Negligible Differences*:
    - If a difference in a criterion is neither perceptible nor meaningful, treat it as **no difference** for that criterion.
    - If a difference is meaningful but not perceptible, it can be considered only if it is supported by objective evidence (e.g., lab tests for durability) and if it is of a magnitude that typically influences buyer satisfaction. Otherwise, treat it as no difference.
    - *Cost of this rule*: Treating non-perceptible differences as no difference avoids false precision and chains that lead to absurdity, but it might underweight cumulative effects (like many small durability improvements). We accept this risk because our verdicts are for "most buyers" and based on typical use.

  **Step 4: Aggregate Advantages and Disadvantages**
  - Tally the criteria in which A is better than B (A-advantages) and those in which B is better than A (B-advantages). Criteria with no difference are ignored.
  - For each criterion where there is a difference (perceptible and meaningful), note the magnitude of the advantage (using the normalized measure from Step 2) and the importance of the criterion to most buyers (predefined weights, if available, or a default of equal weight if not).
  - **Decisive Advantage Test**: 
    - If one product has at least one A-advantage and no B-disadvantages (i.e., B has no advantage in any criterion), then that product is better overall.
    - If both products have advantages, then:
      - Compare the combined magnitude of A-advantages versus B-advantages, weighted by importance. 
      - If the combined weighted advantage of A is at least twice that of B (or vice versa), then the product with the larger combined advantage is better. (The factor of two is a safeguard against close calls.)
      - Otherwise, the products are not comparable by a simple "better than" — they are either on a par or a tie.

  **Step 5: Handle Non-Comparability**
  - If the products are not comparable by the Decisive Advantage Test, then:
    - **Tie**: If all criteria show no difference, then declare a tie ("A and B are equally good").
    - **On a Par**: If there are trade-offs (some criteria favor A, others favor B) and the combined weighted advantages are roughly equal (within a factor of two), then declare that the products are "on a par" — meaning neither is better, but they are not exactly equal either. The verdict should be: "Which one is better depends on individual priorities: A excels in [criteria], while B excels in [criteria]."
    - **Incommensurable**: If the criteria are so different that they don't share a common evaluative basis (e.g., one is a sports car and the other a minivan, but we are comparing them as "family vehicles"), then the procedure stops and the editor must decide whether to force a verdict on a common scale or to avoid the comparison.

  **Step 6: Check for Cycles and Editorial Oversight**
  - After a verdict is reached for a pair, the editor logs the verdict in a central database that tracks all pairwise comparisons.
  - Periodically, the database is checked for cycles (A>B, B>C, C>A). If a cycle is found:
    - Re-examine the pairs in the cycle using the procedure again with the same testers (or a different tester if needed) to see if the verdicts hold.
    - If the cycle persists, it suggests one of two things:
      - **Hazard of Chained Small Differences**: The cycle might be due to the accumulation of negligible differences that were treated as decisive. In this case, the procedure should be adjusted to require a larger margin for a decisive advantage (e.g., increasing the factor from 2 to 3) for that product category. Then re-run the affected comparisons.
      - **Non-Transitivity of Parity**: It might be that the products are on a par in a non-transitive way (A is on a par with B, B on a par with C, but A and C are not on a par). This is a fact about value and requires a different presentation: avoid head-to-head verdicts for these products and instead use a tiered ranking (e.g., "A, B, and C are all top-tier choices, with different strengths").
    - In the meantime, for the conflicting pairs, the editor should publish a note that the comparison is under review and provide a parity verdict for each pair in the cycle until the issue is resolved.

  **Applying the Procedure to Cases**

  **Case 1: Two Running Shoes (A lighter, B better cushioned; testers split)**
  - Step 1: Criteria: weight, cushioning, durability, price. (Assume weight and cushioning are key, durability and price are the same for both.)
  - Step 2: Measure: A is 10g lighter (perceptible? Maybe not for a typical runner? But let's say it is because it's at the edge of perceptibility). B has better cushioning (rated 8 vs 6 on comfort, which is perceptible).
  - Step 3: Weight difference: if 10g is perceptible and meaningful? Testers might split. If one tester says it's not perceptible, then weight is no difference. If both differences are perceptible and meaningful, proceed.
  - Step 4: A has advantage in weight, B in cushioning. Importance: assume cushioning is more important to most buyers than a small weight difference? Without predefined weights, we use equal weight. The combined advantage: if the magnitude of cushioning difference is larger (say, 2 points on comfort vs 10g which might be normalized to 1 point), then B has a larger combined advantage? But testers split on which matters more. Without a clear decisive advantage (combined advantage of one being twice the other), we go to Step 5.
  - Step 5: Not a tie (there are differences). They are on a par. Verdict: "For most buyers, choosing between A and B depends on whether they prioritize weight or cushioning. Neither is clearly better."

  **Case 2: Chain of Five Mattresses (each with +1 coil count, imperceptible)**
  - Step 1: Criteria: coil count (objective), comfort (subjective), durability, price.
  - Step 2: Each consecutive pair: e.g., M1 vs M2: M2 has 10 more coils. Comfort ratings: let's say all are rated the same (because the difference is imperceptible). Durability: might be the same or slightly better with more coils? But assume no perceptible difference in the short term. Price: M2 is $10 more.
  - Step 3: For coil count: the difference is imperceptible and not meaningful in isolation (since comfort and durability are the same). Price difference: $10 on a $1000 mattress might not be meaningful? So no difference in any criterion for consecutive models? Then Step 4: no decisive advantage. Step 5: Tie for consecutive pairs? But then we have M1 tied with M2, M2 tied with M3, etc., but M1 and M5 are clearly different? This is the chain of indifference problem.
  - How we avoid absurdity: In Step 3, we require a difference to be both perceptible AND/OR meaningful. If the coil count difference is not perceptible but it is meaningful because it affects durability (and we have objective evidence that more coils increase lifespan by 5%), then it is a meaningful difference. Then, for each consecutive pair, M2 has a small advantage in durability (meaningful) but a disadvantage in price. If the durability advantage is small and the price difference is also small, then we might have a tie? Or if we have predefined weights, we might see that the durability advantage outweighs the price disadvantage? 
  - Alternatively, if we treat the imperceptible coil count difference as no difference (because we don't have evidence of meaningfulness), then each consecutive pair is a tie. But then the chain of ties leads to M1 tied with M5, even though M5 has 40 more coils and is $40 more. This is absurd because M5 is clearly better if the coil count matters (even if not perceptible per increment). 
  - Therefore, we must not treat them as ties. We must allow meaningful but non-perceptible differences to count. For each consecutive pair, if the durability advantage of the higher coil model is meaningful (even if not perceptible) and the price difference is not meaningful (if $10 is negligible for this category), then the higher coil model is better. Thus, we get M2>M1, M3>M2, etc., and transitivity holds: M5>M1. The chain of small differences is broken by allowing meaningful non-perceptible differences to be decisive. The cost: we risk false precision, but we avoid the absurdity of a tie between M1 and M5.

  **Case 3: Two Laptops (A wins on specs, but testers prefer B)**
  - Step 1: Criteria: CPU speed, RAM, battery life, screen quality, portability, keyboard feel, etc.
  - Step 2: All objective specs (CPU, RAM, battery) are better for A. Subjective: screen quality and portability might be the same? But testers rate keyboard feel and "ease of use" higher for B.
  - Step 3: The objective differences are perceptible and meaningful? For example, if A has 10% more battery life, that's meaningful. But testers prefer B because of subjective factors (keyboard feel, which they rate 9 vs 7 for A). This difference is perceptible and meaningful (keyboard matters for a laptop).
  - Step 4: A has advantages in CPU, RAM, battery. B has advantage in keyboard feel. Now, we aggregate: if we have weights, say objective specs are 60% and subjective feel 40%. The combined advantage of A (in three criteria) might be large, but if the keyboard is very important (and the difference is large) then B might have a chance? However, the testers struggled to articulate why they prefer B, which suggests that the advantage of B is not easily quantifiable. 
  - But the procedure requires us to measure the criteria. If keyboard feel is a criterion and it is rated 9 vs 7, and we consider that a meaningful advantage for B, then we compare the combined advantages. If the weighted advantage of A in specs is, say, 0.6 * (sum of normalized advantages) and B is 0.4 * (normalized keyboard advantage), and if the B advantage is large enough, then we might get that B is better? But the procedure requires that the combined weighted advantage of the winner be at least twice that of the loser? If the specs advantage of A is large, then even with a keyboard advantage, B might not overcome it. Then we would have to say A is better? 
  - Alternatively, if the testers cannot articulate why they prefer B, it might be that the criteria are not fully captured. If we have a criterion missing (like "user experience" which is holistic) then the procedure in Step 1 must include it. But if we don't, then we are forced to go by the defined criteria. 
  - Step 4: If A has a combined weighted advantage that is at least twice that of B, then we declare A better. But the testers' preference for B is strong and consistent. This suggests a flaw in the criteria or weights. 
  - Step 5: If we cannot capture the reason for B's preference in the criteria, then the procedure stops and the editor must intervene. The verdict must not be published until we revisit Step 1: perhaps we need to add a criterion for "overall user satisfaction" and have testers rate it. Then re-run the procedure. 
  - However, if we have the criteria and the measurements, and A still wins by the numbers, then the procedure forces the verdict: "A is better than B." But the testers' experience contradicts this. The editor must then decide: override the procedure (if the testers insist that B is better) and publish a parity verdict or even that B is better, but that would break the procedure. Alternatively, the editor might publish: "On paper, A is better, but our testers preferred B for reasons that are hard to pin down. We recommend trying both." This is not a clean winner. The procedure, when followed, might give an answer you don't like: "A is better than B" even though testers prefer B. The cost: we might lose credibility. Therefore, the procedure must allow for the inclusion of holistic criteria (like overall satisfaction) and if that criterion is included and B wins on it by enough, then B could be declared better.

  **What the Procedure Cannot Do**
  - **Incommensurable Goods**: When products serve fundamentally different purposes or values (e.g., a sports car vs a minivan) and the criteria cannot be meaningfully compared, the procedure may force a verdict that is misleading. In such cases, avoid head-to-head comparisons or use a tiered system.
  - **Radical Subjectivity**: When preferences are highly individualized and the "most buyers" condition fails (e.g., art, fashion), the procedure might not yield a useful verdict. Then, we should not do head-to-heads but instead describe the products and let the reader decide.
  - **True Cycles of Parity**: If the products form a non-transitive cycle due to genuine parity (A on a par with B, B on a par with C, but A is better than C), the procedure will flag it as a cycle, but the resolution (using tiers) might not satisfy readers who want a linear order. We must then abandon the head-to-head format for that set.
  - **Holistic Judgments**: The procedure breaks down if the product's value is holistic and cannot be decomposed into criteria without loss. Then, we must rely on overall ratings and avoid claiming that one is better based on criteria.

  By following this procedure, we aim for consistent, defensible verdicts while acknowledging the complexities of value comparisons.
answer: |-
  **The single most important rule: A "better than" verdict requires a decisive, perceptible advantage in at least one criterion that matters to most buyers, without being offset by disadvantages of equal or greater importance.**

  ### Decision Procedure for Head-to-Head Comparisons
  **Step 1: Define Criteria and Importance**  
  - **Task:** List all objective (e.g., weight, price) and subjective (e.g., comfort, aesthetics) criteria relevant to the product category. Assign each a weight: "high," "medium," or "low" importance for most buyers. Base weights on market research, reader surveys, or historical data.  
  - **Sufficiency:** At least three criteria must be defined. If the products differ fundamentally in purpose (e.g., a trail shoe vs. a road shoe), stop and escalate to the editor—this comparison may be invalid.  
  - **Reasoning:** Ensures verdicts reflect buyer priorities and avoids arbitrary judgments. Weights prevent overemphasizing trivial criteria.

  **Step 2: Measure Differences**  
  - **Task:** For each criterion, measure the difference between Product A and Product B. Use objective data (e.g., scales, timers) or subjective ratings (e.g., 1–10 scales from ≥2 testers). Normalize differences: e.g., "2% lighter" or "0.5-point comfort gap."  
  - **Sufficiency:** Differences must be replicable (e.g., multiple tests for subjective criteria). If measurements are inconsistent, re-test or escalate.  
  - **Reasoning:** Standardization minimizes tester bias and enables fair aggregation.

  **Step 3: Classify Differences as Decisive, Tied, or Negligible**  
  - **Task:** For each criterion, categorize the difference:  
    - **Decisive:** The gap is perceptible (detectable by ≥80% of users in blind testing) AND meaningful (would sway ≥30% of buyers).  
    - **Tied:** No perceptible/meaningful difference (e.g., 0.5g weight gap).  
    - **Negligible:** Perceptible but not meaningful (e.g., a 1mm design quirk no buyer would pay extra for). Treat as "tied."  
  - **Hazard Handling (Chained Small Differences):**  
    - Negligible differences are discarded to prevent transitive absurdities (e.g., a chain of tiny upgrades making a budget mattress "better" than luxury).  
    - **Cost:** This risks undervaluing cumulative improvements (e.g., ten 1g weight reductions). Mitigation: If a criterion’s cumulative change across multiple comparisons exceeds a meaningful threshold (e.g., 10g for shoes), revisit past verdicts with the editor.  
  - **Sufficiency:** If all differences are negligible/tied, declare a tie (skip to Step 5).  
  - **Reasoning:** Focuses on differences that actually impact buyers, avoiding false precision.

  **Step 4: Determine Overall Verdict**  
  - **Task:** Tally decisive advantages for A and B, factoring in criterion importance:  
    - **A is better than B if:**  
      - A has ≥1 decisive high-importance advantage, AND  
      - B has no decisive advantages in high-importance criteria, AND  
      - A’s disadvantages (if any) are only in medium/low-importance criteria.  
    - **Tie if:** All decisive differences cancel out (e.g., A wins one high-importance criterion, B wins another).  
    - **Parity if:**  
      - Advantages are mismatched (e.g., A wins durability, B wins comfort) with no clear winner, OR  
      - The combined weight of A’s advantages is roughly equal to B’s (within 25% when quantified).  
    - **Inconclusive if:** Testers disagree on measurements/classifications after re-testing. Escalate to editor.  
  - **Sufficiency:** High-importance criteria must break ties. If unresolved, proceed to parity/tie.  
  - **Reasoning:** "Better than" requires unambiguous dominance; parity handles multidimensional trade-offs.

  **Step 5: Publish Verdict**  
  - **Better than:** "A is better than B for most buyers [cite key reasons]."  
  - **Tie:** "A and B are equally good overall."  
  - **Parity:** "A and B are on a par: A excels in [X], while B excels in [Y]. Different buyers should choose based on their priorities."  
  - **Editor Escalation:** Triggered if criteria are ill-defined (Step 1), measurements conflict (Step 2), or results are inconclusive (Step 4).  

  **Step 6: Audit for Cycles**  
  - **Task:** Log all verdicts in a central database. Quarterly, check for cycles (A>B, B>C, C>A).  
  - **If a cycle is found:**  
    - Re-test all pairs in the cycle with a new tester, strictly following Steps 1–4.  
    - If the cycle persists, it signals **non-transitive parity** (e.g., A≈B, B≈C, but A≠C). Publish parity verdicts for all pairs and add an editorial note: "These models are so closely matched that preferences depend on individual needs."  
    - **Hazard Handling (Cycles):** Cycles indicate the product category resists linear rankings. Abandon head-to-heads for this category; switch to tiered guides (e.g., "Premium Picks," "Budget Options").  
  - **Reasoning:** Persistent cycles reflect value complexity, not tester error. Forcing a "winner" misleads readers.

  ---

  ### Case Applications
  **Case 1: Running Shoes (A lighter, B better cushioned; testers split)**  
  - **Steps 1–2:** Criteria: weight (high), cushioning (high), durability (medium), price (low). A is 15g lighter (perceptible); B has +1.5 cushioning points (perceptible).  
  - **Step 3:** Both differences decisive.  
  - **Step 4:** No high-importance advantage dominates (testers split on priority).  
  - **Verdict:** **Parity.** "Shoe A is lighter, while Shoe B is better cushioned. Choose based on your priority."  
  - **Editor Role:** None—verdict resolved.  

  **Case 2: Mattress Chain (5 models; each has +10 coils, imperceptible change)**  
  - **Steps 1–2:** Criteria: comfort (high), durability (high), price (high). Each pair (e.g., M1 vs. M2) has +10 coils (objectively measurable but imperceptible in testing).  
  - **Step 3:** Coil difference **negligible** (not perceptible; no evidence it affects comfort/durability meaningfully). All other criteria tied.  
  - **Step 4:** **Tie** for each consecutive pair (e.g., M1≈M2, M2≈M3).  
  - **Cycle Hazard:** Chained ties imply M1≈M5, but M5 is clearly better. **Resolution:** Editor intervenes. Reclassify coil count as meaningful if data shows coil increases boost longevity. If so, re-run with durability as decisive: M5>M1. If not, publish ties but add: "For large gaps (e.g., budget vs. luxury), consider premium models for long-term value."  
  - **Verdict:** **Tie** for adjacent pairs; **editorial note** for non-adjacent.  

  **Case 3: Laptops (A wins specs; testers prefer B)**  
  - **Steps 1–2:** Criteria: speed (high), battery (high), portability (medium), usability (high). A wins all specs objectively; B rated +2 in usability (perceptible).  
  - **Step 3:** Spec differences decisive; usability difference decisive.  
  - **Step 4:** A dominates specs (high-importance), but B wins usability (high-importance). No clear winner → **Parity?** But testers consistently prefer B.  
  - **Hazard:** Usability advantage may be undervalued. **Re-test:** If usability weight is increased, B could win. Otherwise:  
  - **Verdict:** **"A wins on specs, but B is more user-friendly. They are on a par for different needs."**  
  - **Cost:** This lacks a "clean winner," hurting traffic. However, forcing "A is better" ignores tester experience and misrepresents buyer preferences.  

  ---

  ### What the Procedure Cannot Do  
  1. **Radically Subjective Categories** (e.g., art, perfumes): Where "most buyers" lacks meaning, the procedure forces false objectivity. Use descriptive reviews, not head-to-heads.  
  2. **Incommensurable Trade-offs** (e.g., ethical vs. performance attributes): If criteria conflict morally (e.g., eco-friendly vs. cheaper), escalation to the editor is mandatory—value judgments outweigh measurements.  
  3. **Extremely Close or Novel Categories**: Products with identical specs but divergent designs (e.g., iOS vs. Android) often yield parity verdicts, which may frustrate readers seeking winners.  
  4. **Holistic Preferences**: When testers intuit "B is better" but can’t articulate why (Case 3), the procedure defaults to measurable criteria, potentially missing emergent qualities like "joy of use." Supplement with buyer testimonials.  
  **Where "Better Than" Fails Altogether**: For products defined by personal identity (e.g., fashion) or extreme specialization (e.g., medical devices), avoid pairwise verdicts. Use benchmarks or curated guides instead.  

  This procedure balances rigor with practicality, ensuring verdicts are defensible while acknowledging that not all values reduce to linear scores. It exposes when "better than" is the wrong question—saving your publication from cycles and credibility crises.
