prompt: |-
  My cousin is going through a philosophy phase and made me watch this video essay about David Lewis's modal realism. The guy in the video summed it up like this: Lewis held that all the other possible worlds are just as real as ours — they're real places sitting somewhere in physical space, just unimaginably far away, which is why nothing can travel between them. So when I say I could of become a chef, what's literally true is that there's some guy in one of those worlds who looks exactly like me and did become a chef, and since he's basicaly me, Lewis said we can just say I could have. He also said the word "actual" works like "here" — it picks out our world without making the others any less real. And because every consistent scenario happens somewhere, the video concluded that Lewis had shown modality itself is a mistake: nothing is really possible or necessary, things just happen somewhere or they don't.

  I'm inclined to think the video guy got most of it but I don't know where it goes wrong. Something about the last bit sounded off to me — I thought Lewis was trying to analyze what possibility means, not get rid of it. Can you go through the summary claim by claim and tell me which parts a Lewisian would accept, which are misrepresentations, and whether the conclusion about modality follows from any of the parts that are actually true?
