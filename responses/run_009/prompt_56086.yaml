     - For the one-shot game, if they chose R, generate a random number (1=4, 2=0).

     We can do this quickly by having a list of students and going down the list.

     We also need to record the outcomes for the pattern.

  5. Data Collection and Display (10 minutes)
     a. We create a table on the board or projector:

          Student | Seq: Stage1 | Seq: Stage2 (if applicable) | One-shot choice

     But we also need to know what they would have done in Stage2 even if Coin1 was H (but it doesn't matter). So we record:

          Student | Seq Stage1 choice | Seq Stage2 choice (recorded) | One-shot choice

     Then, we are interested in:

     - For students who chose Safe in Stage1 of sequential: what did they choose in the one-shot? (S or R)

     - For students who chose Risky in Stage1 and then in Stage2 chose Option A: what in one-shot?

     - For students who chose Risky in Stage1 and then Option B: they are consistent with the one-shot R?

     But the key pattern we want to highlight is:

     Some students may have chosen:

          Sequential: Safe in Stage1 (so they get 2 tokens for sure) 
          One-shot: R (so they are willing to take the risk)

     And also:

          Sequential: Risky in Stage1 and then at Stage2, when they are in the Tails branch, they choose Option A (the safe 2) 
          One-shot: R (so they are willing to take the one-shot risk)

     This is the pattern that violates the sure-thing principle. Why? Because in the sequential game, when they are in the Tails branch, they avoid the risk of getting 0 by taking 2. But in the one-shot, they are willing to take the risk that gives 0 or 4. But note, the one-shot R is exactly what they would have gotten if in the sequential game they had chosen Risky and then at Stage2 chosen Option B.

     So if they are willing to take R in the one-shot, why didn't they choose Option B in the sequential game when they were in the Tails branch?

     Alternatively, the opposite pattern: they might avoid R in the one-shot but in the sequential game they choose Risky and then at Stage2 they choose Option B.

     We are particularly interested in students who:

          Sequential: chose Risky and then at Stage2 chose Option A (so overall they got: 0 with 0.5, 2 with 0.5)
          One-shot: chose R (0 or 4 with 0.5)

     Why is this a violation? Because in the sequential game, when they are in the Tails branch, they had a choice between a sure 2 and a 50-50 of 0 or 4. They chose the sure 2. But in the one-shot, they chose the 50-50 of 0 or 4 over the sure 2. This is inconsistent.

     But note: in the sequential game, when they are in the Tails branch, they are only considering the conditional gamble: 2 for sure vs 0 or 4 with 50-50. And they choose 2. In the one-shot, they are choosing between 2 for sure and 0 or 4 with 50-50, and they choose the latter.

     This is a direct violation of dynamic consistency.

     The sure-thing principle is violated because the outcome in the Heads branch (which is 0) is the same regardless of what they do in the Tails branch. But in the sequential setting, they are influenced by the fact that they already avoided the Heads branch (so they are in the Tails branch) and then become risk averse.

     So let's display the choices:

     We will create a 2x2 table:

          One-shot choice
                       |   S   |   R   |
          ---------------------------------
          Sequential:  |       |       |
          Safe at S1   |       |       |
          ---------------------------------
          Sequential:  |       |       |
          Risky at S1  |       |       |
          and Option A at S2|       |       |
          ---------------------------------
          Sequential:  |       |       |
          Risky at S1  |       |       |
          and Option B at S2|       |       |

     But we have three rows for sequential and two columns for one-shot.

     We are especially interested in the cell: 
          Sequential: Risky and then Option A, and One-shot: R.

     And also the cell:
          Sequential: Safe, and One-shot: R.

     But the latter is not a violation per se. The violation is in the first cell.

     We also want to see if there are students in the cell: 
          Sequential: Risky and then Option B, and One-shot: S.

     That would be the opposite violation.

  6. Debrief (15 minutes)
     a. Show the table of class results. Point out the cell that has a significant number of students: those who in sequential chose Risky and then at Stage2 chose Option A, but in the one-shot chose R. Ask if anyone is in that cell and willing to explain.

     b. Explain that according to expected utility theory, the choice in Stage2 should be the same as the choice in the one-shot between 2 for sure and the 0/4 gamble. So if they chose Option A in Stage2, they should also choose S in the one-shot. But we see some who did not.

     c. Introduce the Sure-Thing Principle: if two acts have the same outcome in some states, then the choice between them should depend only on the states where they differ. In the sequential game, the state Heads (where they get 0) is the same regardless of what they do in Stage2. So the choice in Stage2 should only depend on the Tails state. And in the Tails state, they are facing exactly the same choice as in the one-shot. So why the difference?

     d. Introduce risk-weighted expected utility: the idea that people weight outcomes not just by probability but by their risk attitude, and that this risk attitude might depend on the context. In the sequential setting, after avoiding the bad outcome (Heads), they might now be in a frame of mind where they are risk averse to protect their gain (they are getting at least 2 in the Tails branch) and thus take the sure 2. In the one-shot setting, they might focus on the possibility of 4 and be risk-seeking.

     e. Map to theory: This pattern is consistent with a risk weighting function that is more averse to losses when in a domain of gains. In the sequential setting, the Tails branch is seen as a gain (relative to the worst outcome of 0) and thus they become risk averse. In the one-shot, they are in a mixed gain/loss frame and might be risk-seeking.

     f. Why the framing does work: In the sequential setting, the decision is broken down and the agent does not integrate the prior outcome (the fact that they are in the Tails branch) in a linear way. The prior outcome changes their reference point.

     g. Limitations: The classroom data aggregates different students. We are assuming that each student is consistent, but we are seeing choices from the same student in two different frames. However, we are not controlling for individual risk attitudes. Also, we are not tracking the same student's choices over time, so we cannot say that an individual student has a coherent risk weighting. We can only say that the pattern exists in the class and that it is systematic.

     h. To narrow the gap: We could have students make both choices and then ask if they wish to change after seeing the pattern. Or we could run the sequential game and the one-shot game in counterbalanced order. But the gap remains that we don't have repeated choices from the same individual in different contexts to establish individual coherence.

     i. In the debrief, we must note that risk-weighted expected utility theory is a model for a single agent, but our evidence comes from aggregated choices. However, if we see a significant number of students in the critical cell, it suggests that for those individuals, their choices are context-dependent in a way that EU cannot explain, but RWEU might.

  7. Conclusion (5 minutes): Wrap up by naming the theories (expected utility and risk-weighted expected utility) and noting that this activity illustrates a limitation of EU and an alternative.

  **What might go wrong:**

  - Students might not understand the sequential game. To handle: walk through with an example and draw the decision tree on the board. Have a practice question.

  - Students might game the payout scheme: for example, if they think the two games are related, they might try to be consistent. But we are presenting them as separate games. Emphasize that each game is independent and they should make choices as if it were real.

  - Indifferences: Some students might be truly indifferent and choose randomly. We can instruct them to choose one if they are indifferent. But we expect that most will have a preference.

  - Time: Resolving 22 students might take too long. Solution: have students submit their choices and then after class, we resolve and distribute candy in the next seminar or via email. Or, we can use a computer to generate random numbers quickly for the whole class.

  - The pattern might not emerge: if the class is small, we might not get enough in the critical cell. We can run a simulation beforehand to see the expected pattern. Also, we can use data from previous classes if available.

  - Students might not take it seriously because it's candy. Emphasize that the tokens are valuable and that they should think as if it were real money.

  **What the activity cannot reproduce:**

  - The theory of risk-weighted expected utility is for a single agent who has a coherent risk attitude across situations. Our activity collects one observation per student per frame. We don't have multiple observations per student to check if their risk weighting is consistent across different gambles. Also, the activity only uses one type of gamble.

  - We are not measuring the risk weighting function, only showing a violation of EU and dynamic consistency.

  - The gap between aggregated behavior and individual coherence: we cannot conclude from the classroom data that any individual student has a coherent risk weighting. We can only say that for some students, their choices violate EU in a particular way that is consistent with a context-dependent risk attitude.

  - To close the gap, we would need to show that the same student, when faced with multiple decisions that require the same risk weighting, behaves in a way that is captured by a consistent risk-weighting function. The activity does not provide that. In the debrief, we must acknowledge that the activity is suggestive but not conclusive for individual coherence. We can suggest that if we ran more games with the same student, we might be able to estimate their risk weighting.

  **Final Design:**

  Payoffs in tokens:

  - Safe option in both games: 2 tokens.
  - Risky in one-shot: 0 or 4 tokens, each with 50% chance.
  - In sequential:
     Stage1: Safe -> 2 tokens.
     Stage1: Risky -> then flip Coin1.
          Coin1=Heads (50%): 0 tokens.
          Coin1=Tails (50%): then Stage2 choice:
               Option A: 2 tokens.
               Option B: flip Coin2 -> 4 if Heads, 0 if Tails (50-50).

  Note: The overall outcome of choosing Risky and then Option B is exactly the same as the one-shot Risky option.

  We will collect:

  For each student:
    - Sequential Stage1: Safe or Risky.
    - If Risky, then Stage2: Option A or Option B.
    - One-shot: Safe or Risky (which we call S or R).

  Then we look for students who chose:
    - Sequential: Risky and then Option A, and One-shot: R.

  This is the critical violation cell.

  We also expect many in:
    - Sequential: Safe, and One-shot: S. (consistent risk aversion)
    - Sequential: Risky and then Option B, and One-shot: R. (consistent risk-seeking or risk-neutral)

  But the interesting ones are those who are risk-seeking in the one-shot but risk-averse in the sequential Stage2.

  We hope to see a significant number in the critical cell.

  This design meets the requirements: 
  - EU maximizer is indifferent at every choice node where there is a choice (if u(2)=0.5*u(0)+0.5*u(4), then they are indifferent between Safe and Risky in Stage1? Actually, if they are indifferent at Stage2, then the value of the Risky option in Stage1 is 0.5 * u(0) + 0.5 * u(2) [if they choose Option A] or 0.5 * u(0) + 0.5 * (0.5*u(0)+0.5*u(4)) = 0.5*u(0) + 0.25*u(0) + 0.25*u(4) = 0.75*u(0) + 0.25*u(4) [if they choose Option B]. 

  But if they are indifferent at Stage2, then the value of the Risky option in Stage1 is the same regardless of what they choose at Stage2? Not exactly. They will choose at Stage2 the option that has higher EU. But if they are indifferent, then both are the same. And then the EU of the Risky option is the same as the Safe option in Stage1? 

  The EU of Safe in Stage1: u(2).

  The EU of Risky if they choose Option A at Stage2: 0.5*u(0) + 0.5*u(2).

  The EU of Risky if they choose Option B at Stage2: 0.5*u(0) + 0.25*u(0) + 0.25*u(4) = 0.75*u(0) + 0.25*u(4).

  But if u(2) = 0.5*u(0) + 0.5*u(4), then:

  EU(Risky with Option A) = 0.5*u(0) + 0.5 * [0.5*u(0)+0.5*u(4)] = 0.5*u(0) + 0.25*u(0) + 0.25*u(4) = 0.75*u(0) + 0.25*u(4) = u(2) [by the condition].

  Similarly, EU(Risky with Option B) = 0.75*u(0)+0.25*u(4) = u(2).

  So an EU maximizer who is indifferent between S and R in the one-shot (i.e., u(2)=0.5*u(0)+0.5*u(4)) will be indifferent at Stage1 and also indifferent at Stage2. So they might choose arbitrarily.

  Thus, any choice they make cannot be attributed to error.

  Meanwhile, non-EU students might show a pattern.

  We are ready.
answer: |-
  Below is a comprehensive design for your in-class game, structured to elicit the violation of the Sure-Thing Principle (STP) through a sequential vs. one-shot framing effect. The game uses tokens exchangeable for candy (e.g., 10 tokens = 1 piece of candy) to incentivize choices. Crucially, **expected-utility (EU) maximizers are indifferent at key decision points**, ensuring any deviations arise from risk weighting, not errors. The game targets the core insight of **risk-weighted expected utility (RWEU) theory**: context-dependent risk attitudes that violate STP when choices are decomposed.

  ---

  ### **Game Design: "The Sequential Sure-Thing Paradox"**
  **States & Probabilities:**  
  Two independent fair coins (Coin 1 and Coin 2), yielding four equally likely states (each prob. 0.25):  
  - **State A:** Coin 1 Heads (H1), Coin 2 Heads (H2)  
  - **State B:** H1, Tails (T2)  
  - **State C:** Tails (T1), H2  
  - **State D:** T1, T2  

  **Gambles:**  
  - **Safe Bet (S):** 20 tokens for sure.  
  - **Risky Bet (R):**  
    - 40 tokens if H1 (States A or B)  
    - 0 tokens if T1 (States C or D)  
    *EU Note:* For a linear utility function, \(EU(R) = 0.5 \times 40 + 0.5 \times 0 = 20\), matching \(EU(S) = 20\). Risk-averse/seeking EU maximizers are *indifferent* if \(u(20) = 0.5u(40) + 0.5u(0)\).  

  **Sequential vs. One-Shot Framing:**  
  - **One-Shot Choice:** Direct choice between **S** (20 tokens) and **R** (40 if H1, 0 if T1).  
  - **Sequential Choice:**  
    1. **Stage 1:** Choose between:  
       - **Option X:** 20 tokens for sure (ends game).  
       - **Option Y:** Proceed to Stage 2.  
    2. **Stage 2 (only if Option Y chosen):**  
       - **Option Y1:** 40 tokens if H2 (0 if T2) — *but only if T1 occurred*.  
       - **Option Y2:** 0 tokens for sure — *but only if T1 occurred*.  
       *If H1 occurred, Stage 2 is irrelevant (you get 40 tokens regardless of Y1/Y2).*  

  **Key Rationale:**  
  - The sequential path **Option Y → Y1** is identical to **R** (40 if H1, 0 if T1).  
  - **Option Y → Y2** yields 40 tokens if H1, 0 if T1 — identical to **R**!  
    - Why? In Stage 2, you only act if T1 occurs. Choosing Y2 (0 for sure) gives 0 in T1, while Y1 gives 0 or 40. But if H1 occurred, you get 40 regardless. Thus:  
      - **Y → Y1 ≡ R**  
      - **Y → Y2 ≡ R**  
    → **STP requires indifference between Y1 and Y2** (since outcomes are identical in H1).  
  - However, psychologically, **Y2** feels like "avoiding further risk" after surviving H1 (0 guaranteed vs. 50% chance of 0). EU maximizers are indifferent, but RWEU predicts **Y2 chosen by risk-averse students** (overweighting worst outcomes in the T1 branch).  

  ---

  ### **Session Timeline (75 Minutes)**  
  | Time    | Activity                                                                                                |  
  |---------|---------------------------------------------------------------------------------------------------------|  
  | 0-5 min | **Intro:** Explain tokens/candy payout. Emphasize real incentives. No theory—just "choose wisely."      |  
  | 5-20 min| **Sequential Game:** Students play Stage 1 and (if applicable) Stage 2. Log choices (Table 1).          |  
  | 20-30 min| **One-Shot Game:** Students choose between S and R. Log choices (Table 1).                              |  
  | 30-50 min| **Resolve Uncertainty & Payouts:** Flip coins publicly for each student. Record outcomes.              |  
  | 50-60 min| **Reveal Pattern:** Display Table 1. Highlight violations (Box 1). Ask students to reflect.             |  
  | 60-75 min| **Debrief:** Name STP/RWEU. Map game choices to theory. Discuss limitations (Box 2).                    |  

  ---

  ### **Data Logging & Pattern Display**  
  **Table 1: Choice Log (Projected During Debrief)**  
  | Student | Seq. Stage 1 | Seq. Stage 2 (if Y) | One-Shot Choice |  
  |---------|--------------|---------------------|-----------------|  
  | 1       | X            | N/A                 | S               |  
  | 2       | Y            | Y1                  | R               |  
  | 3       | Y            | Y2                  | R               | ← **Violation Cell** |  
  | ...     | ...          | ...                 | ...             |  

  **Box 1: Expected Pattern**  
  - **EU-consistent students:** Indifferent throughout → random choices.  
  - **Systematic violations (predicted):**  
    - **Cell 1:** **Seq: Y → Y2** + **One-Shot: R** (≈30-50% of class).  
      - *Why?* Risk-averse in sequential "post-survival" (T1) but risk-seeking/neutral in one-shot.  
    - **Cell 2:** **Seq: X** (safe) + **One-Shot: R** (≈20-40%).  
      - *Why?* One-shot R feels like a "gain frame"; sequential Stage 2 feels like a "loss frame" after T1.  
  - **Non-violations:** Seq: Y → Y1 + One-Shot: R (consistent risk-seeking); Seq: X + One-Shot: S (consistent risk-averse).  

  ---

  ### **Debrief: Mapping Game to Theory**  
  1. **Violate STP?**  
     - **STP:** If two acts yield the *same outcome* in some states, choice should depend *only* on states where they differ.  
     - **In Game:** Y1 and Y2 have **identical outcomes in H1** (both give 40). In T1, Y1 (0 or 40) vs. Y2 (0).  
       - STP requires indifference between Y1/Y2 → but many choose Y2 (safer in T1).  
       - Yet in one-shot, the same students choose R (equivalent to Y→Y1)!  

  2. **RWEU vs. Inconsistency:**  
     - **Inconsistency:** Choosing Y2 (seq.) but R (one-shot) seems contradictory.  
     - **Coherent RWEU:**  
       - RWEU weights probabilities by a *risk function* \( w(p) \). Risk-averse students have \( w(p) < p \) for gains.  
       - **Sequential (Stage 2):** In T1, Y1 offers 50% chance of 40 (good) but 50% of 0 (bad). A risk-averse student **overweights the 0 outcome** → prefers Y2 (0 for sure).  
       - **One-Shot:** R is 50% chance of 40, 50% of 0. The same student **underweights the 0 outcome** (sees "40 or 0" as opportunity) → chooses R.  
       - **Framing Work:** Decomposing R into stages makes the "0 in T1" more salient, flipping risk attitude.  

  3. **Why Sequential vs. One-Shot Matters:**  
     - **Sequential framing** isolates T1 as a "loss domain" (after "surviving" H1), amplifying risk aversion.  
     - **One-shot framing** presents R as a mixed gain/loss, inviting risk-seeking.  

  ---

  ### **Predictable Challenges & Solutions**  
  | Challenge                          | Solution                                                                 |  
  |------------------------------------|--------------------------------------------------------------------------|  
  | **Gaming payouts**                 | Use small candy payouts (e.g., 0–4 pieces)—enough to incentivize, not strategize. |  
  | **Indifference due to confusion**  | Pre-game: Walk through examples (non-incentivized). Use a flowchart (visual aid). |  
  | "Why choose Y2 if it's same as R?" | Clarify *during Stage 2*: "If you chose Y, and T1 occurs, Y2 *guarantees 0*; Y1 gives 50% chance of 40." |  
  | **Time constraints**               | Pre-fill student IDs in Table 1. Use digital tools (e.g., Google Form) for logging. |  
  | **Noise in choices**               | Focus on *aggregate* patterns (Cells 1–2). If violations <20%, use as discussion point. |  

  ---

  ### **Limitations & Bridging the Gap**  
  **The Gap:** RWEU models a *single agent* with coherent risk attitudes. Classroom data aggregates *many agents*, conflating individual coherence with group noise.  
  - **Why It Exists:**  
    - We observe **one choice per student** per frame—no chance to see if *individual* risk weighting is stable.  
    - Group patterns may reflect **idiosyncratic preferences** (e.g., some risk-averse, some risk-seeking) rather than context-dependent risk weighting.  
  - **Can the Game Narrow It?**  
    - **Partial fix:** If students play multiple rounds (not feasible here), patterns could suggest individual coherence.  
    - **This game:** Use **Cell 1 (Seq-Y2 + One-Shot-R)** as evidence of *context-dependent* choices. Highlight that RWEU explains this cluster *without* labeling them "irrational."  
  - **Closing the Gap in Debrief:**  
    1. **Stress:** "RWEU doesn’t require *all* people to be consistent—it models how *one* person’s risk attitude *systematically* shifts with framing."  
    2. **Ask:** "How many in Cell 1 felt their Stage 2 choice was rational *in the moment*? Did the one-shot feel different?"  
    3. **Argue:** "If the same person chose Y2 (seq.) and R (one-shot), RWEU explains it as a *coherent* response to risk context—not a math error."  

  ---

  ### **Materials**  
  - **Visual Aids:** Decision tree for sequential game; Table 1 for results.  
  - **Randomization:** Two physical coins (or online RNG).  
  - **Payouts:** Tokens (paper) → candy (e.g., M&Ms) at end.  
  - **Student Sheets:**  
    ```  
    SEQUENTIAL GAME  
    Stage 1: ⃝ X (20 tokens)  ⃝ Y (go to Stage 2 if T1)  
    If Y, Stage 2: ⃝ Y1 (40 if H2, 0 if T2)  ⃝ Y2 (0 tokens) [Only if T1 occurs]  

    ONE-SHOT GAME  
    ⃝ S (20 tokens)  ⃝ R (40 if H1, 0 if T1)  
    ```  

  This design ensures students experience the STP violation "from the inside" while exposing how RWEU reframes rationality. The debrief turns their choices into a launchpad for theory—without pre-lecturing.
