  The user and their friend have clearly articulated positions. The friend advocates for "practical consistency" - essentially arguing that since any actual contradiction would require proofs too long to ever be physically written, the concern is pragmatically empty. The user counters with what they call "retroactive impugnment" - the idea that discovery of any inconsistency, no matter how inaccessible, would undermine all existing proofs.

