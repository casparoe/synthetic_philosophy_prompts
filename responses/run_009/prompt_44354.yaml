  I'm a retired aerodynamicist -- spent most of my career on commercial aircraft design, so I know a thing or two about how planes actually get built and how the cost estimates on the whiteboard at the start of a project relate to what actually gets spent. Since retiring I've gotten deep into philosophy of decision-making, and I just came across the dollar auction game, the one Shubik came up with in the 70s I believe, where the second-place bidder still has to pay. It struck me immediately that this isn't a cute parlor game at all, it's basically the story of my professional life told in miniature. And the case everyone always brings up is Concorde, which I remember reading about in the trade press back when it was still "the future of aviation."

  I'd like you to act as an expert in game theory and the psychology of escalation of commitment, and give me a proper case analysis of Concorde run through the dollar auction framework. So: who exactly is the "bidder" here (the two governments? the firms? individual ministers and program managers whose careers got attached to it?), what are the "bids" (does each year's continued funding count as a bid, or is that a different granularity than the game assumes), what's the dollar being auctioned (prestige? national capability? the sunk supersonic market that never materialized?), and what would walking away have meant at each stage. Then the part I really care about: where does the dollar auction model break down or misdescribe what happened? I can think of a few candidates myself -- e.g. in the real game the dollar's value is fixed and known, while Concorde's "prize" kept shrinking as the oil shocks hit and the sonic boom bans killed the routes, and there was never really a rival "bidder" winning the thing if Britain and France quit. I'd also like you to take seriously the counterargument that escalation of commitment isn't the right frame at all, that the project continued for reasons of alliance politics and face-saving between two governments that the psychology of individual escalation can't capture. And do mention the flip side: the evolutionary biologists who coined "the Concorde fallacy" -- is it actually a fallacy in this case, or were there reasons the behavior made sense?

  Please brainstorm a bit before you write, be honest about where the theory is silent rather than forcing it to speak, and don't give me the pop-version of the story (the one where it's all about irrational stubborness). I know the rough facts: the 1962 Anglo-French agreement, first flight in '69, only a couple dozen built, the airlines basically got them for free, service until 2003. If I've misremembered a detail, gently correct me. I want to know whether Concorde is genuinely the textbook dollar auction it's held up as, or whether that's a story we tell because the game came first and we went looking for a case to pin it on.
