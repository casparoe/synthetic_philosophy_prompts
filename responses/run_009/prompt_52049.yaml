prompt: |-
  As a journalist covering science and ideas, I'm working on a piece about coordination failures — antibiotic overuse, doping in professional cycling, and labs racing to deploy increasingly capable AI systems. The popular framing, borrowed from a well-known internet essay about "Moloch," lumps all of these together, but I've come to suspect the examples actually split into two structurally different kinds of failure: tragedies of the commons, where actors deplete a shared stock and everyone's absolute condition worsens, and positional races, where what matters is not your absolute condition but your rank relative to rivals, so that actors keep sprinting even when everyone would be better off if all slowed down together. Please explain the conceptual difference between these two kinds of failure, and its most important consequences. In particular: why general economic growth — a rising tide that improves everyone's absolute condition — can dissolve a commons failure while leaving a positional race fully intact; why improving outcomes for all participants is therefore not a fix for the second kind; and why the appropriate interventions differ (pricing or capping access to a shared resource versus restructuring the payoffs so that rank matters less). Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
