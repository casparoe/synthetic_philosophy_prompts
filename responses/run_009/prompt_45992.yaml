  I teach a free will seminar, and every year I end up in the same argument with my colleague in the philosophy department about Strawson's Basic Argument — the one from his 1994 paper on the impossibility of moral responsibility, where nothing can be morally responsible in the ultimate, desert-entailing sense because nothing can be causa sui, the cause of itself. She's at something like 0.75 that the argument is sound; I hover around 0.45, and honestly I flip around depending on the day. I want your credence, but I don't just want a number — I want to see the machinery.

  Decompose it for me into at least these terms (add others if you think they belong): (1) the probability that ultimate responsibility really does require being causa sui in the way Strawson claims — i.e., that there's no coherent middle ground between "determined by what you didn't choose" and "you somehow made yourself ex nihilo"; (2) the probability that indeterminism doesn't help at all, given that random events aren't controlled events either; (3) the probability that the compatibilist notion of responsibility is a legitimate replacement target rather than a dodge — i.e., that Strawson is attacking a notion of "true" responsibility that nobody actually needs for ethics, law, and everyday blame; and (4) the probability that beings which rewire themselves over time — say, someone who deliberately shapes their own future character through drug-free habit formation, cognitive therapy, whatever — can genuinely bootstrap even a little bit of the required self-authorship, since this is where I think the argument is most exposed: the regress has to bite fully even for agents who are partially self-modifying, and I'm not sure it does.

  Give me a number and a couple lines of justification for each term, then combine them into your overall credence. Then tell me which term the final number is most sensitive to, and what argument or thought experiment would move your credence by at least 0.1 in either direction. And last thing — given where she sits (0.75) and where I sit (0.45), where do you think our disagreement most likely lives: in term (1), or in term (3)? Lead with your bottom-line credence in the very first sentence, no preamble, no restating my question back at me — then the decomposition.
