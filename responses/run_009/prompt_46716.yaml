answer: |-
  ## The two principles
  The Self-Sampling Assumption (SSA) states that you should reason as if you are a random sample from the set of all *actual* observers who exist within your epistemic situation (your "reference class"). It focuses on the observers that actually came into existence. The Self-Indication Assumption (SIA), conversely, states that you should reason as if you are a random sample from the set of all *possible* observers who *could have* existed, weighted by the prior probability of the worlds in which those observers exist. SIA biases reasoning towards hypotheses where more observers exist, all else being equal. Essentially, SSA samples from actuality, while SIA samples from possibility weighted by prior credence.

  ## Sleeping Beauty under each
  In the Sleeping Beauty problem, a coin is flipped. Heads: Beauty is awakened once (Monday). Tails: Beauty is awakened twice (Monday, Tuesday), with amnesia between awakenings. When awakened, what is P(Heads)?

  *   **SSA (Halfer):** SSA considers the set of actual awakenings: one if Heads, two if Tails. Beauty, upon waking, finds herself in one of these awakenings. Since the coin was fair, and she had no prior expectation of not experiencing an awakening, SSA assigns equal initial probability to Heads and Tails (P(Heads) = 1/2). Finding herself awake doesn't favor either outcome because she was certain to be awake under both. Her reference class is "awakenings within the experiment".
  *   **SIA (Thirder):** SIA considers possible observers weighted by world-probability. There could be one awakening (Heads world) or two awakenings (Tails world). Since Tails worlds contain twice as many possible observer-moments as Heads worlds, and SIA weights by the prior probability of the world, finding yourself to be an observer makes a Tails world twice as likely. Thus SIA gives P(Heads) = 1/3 and P(Tails) = 2/3. Her reference class is "possible awakenings".

  ## Doomsday and the Presumptuous Philosopher
  SSA and SIA clash dramatically in scenarios like the Doomsday Argument (DA) and Presumptuous Philosopher (PP).

  *   **Doomsday Argument (SSA endorses):** The DA argues that observing your early birth rank among all humans suggests humanity is likely small and will end soon. SSA supports this: you reason you are a random sample among all *actual* humans who ever live. Observing you are early in the sequence favors worlds where the total number of humans is small. SIA, however, heavily disfavors the DA. Because SIA weights hypotheses by the number of observers they allow, it strongly prefers worlds with far more future humans, dramatically weakening or reversing the DA's conclusion. SIA makes doomsday seem much less likely.
  *   **Presumptuous Philosopher (Embarrasses SIA):** Imagine two theories: Theory A says the universe is vast with 10^100 observers; Theory B says it's small with 10^10 observers. Both are equally likely *a priori*. You learn *nothing* except that you exist. SIA dictates you should be overwhelmingly confident in Theory A (P(A) ≈ 1), simply because it predicts vastly more observers. This seems absurdly presumptuous – existence alone shouldn't provide such strong evidence for a large universe. SSA avoids this: you are a random sample from *actual* observers, so existing gives you no information favoring A or B if they were equally likely before. SIA's proneness to the PP is a major criticism.

  ## The one-awakening variant
  Consider: Beauty awakens exactly once. Heads: Awake Monday. Tails: Fair coin toss *after* the first coin; Heads->Awake Monday, Tails->Awake Tuesday. Beauty knows the setup but not the day upon waking.

  *   **SSA:** The set of *actual* awakenings: one in every possible world (Monday-Heads, Monday-Tails, or Tuesday-Tails). Since the initial coin was fair and the second coin (if Tails) is fair, the three awakening types are equally likely. Beauty is equally likely to be in any of them. Only one corresponds to the initial coin being Heads (Monday-Heads). Thus P(Heads) = 1/3? **Wait, no!** Crucially, the *initial coin flip* determines the *possibility space* for awakenings. Heads guarantees a Monday awakening. Tails leads to *either* a Monday *or* Tuesday awakening, each with 50% probability *given Tails*. SSA, sampling from the one actual awakening, still leads to P(Heads) = 1/2. Why? The awakening occurs unconditionally. Before the experiment, P(Heads) = P(Tails) = 1/2. Learning "I am awake on *some* day" provides no new information relevant to the initial coin flip, as Beauty was certain she would be awake once regardless. The reference class ("awakenings") includes only one per run, so no differential weighting applies.
  *   **SIA:** SIA considers possible observers weighted by world-probability. However, in this variant, *every possible experimental run* results in exactly one awakening. The Heads world has one possible awakening (Monday). The Tails world has two *possible* awakenings (Monday or Tuesday), each occurring with 50% probability *if Tails*. The prior probability of Heads is 1/2, leading to one possible observer-moment. The prior probability of Tails is 1/2, but it splits into two possible observer-moments, each with a "weight" of (1/2) * (1/2) = 1/4. The total probability mass for Heads observer-moments is 1/2. The total for Tails observer-moments is 1/4 (Mon-Tails) + 1/4 (Tue-Tails) = 1/2. Finding yourself an observer thus gives P(Heads) = (1/2) / (1/2 + 1/2) = 1/2. Both SSA and SIA agree on 1/2 here.
  *   **The Stakes:** This agreement highlights that the core dispute in the original Sleeping Beauty problem isn't fundamentally about probability rules like SSA or SIA *alone*, but about **what constitutes the relevant reference class or observer-moment**. Does the experiment create one "Beauty-experience" (SSA halfer) or multiple distinct "awakening-moments" (SIA thirder)? The one-awakening variant forces a single experience per run, eliminating the ambiguity that SIA exploits in the original case. The principles themselves don't dictate how to individuate experiences; that requires an external decision about the ontology of observers/moments within the problem setup.

  ## Verdict
  While SSA and SIA provide frameworks for self-locating uncertainty, the core disagreement between the halfer and thirder positions in Sleeping Beauty stems from a prior, unresolved question: **What is the fundamental unit of observation?** Neither principle inherently settles whether the reference class comprises whole experimental subjects (favored by halfers/SSA in the original) or individual observer-moments (favored by thirders/SIA in the original). The one-awakening variant demonstrates that when the unit is unambiguously one "experience" per causal run, both principles converge. Therefore, choosing between SSA and SIA, or resolving the halfer/thirder debate, ultimately requires external philosophical justification for how to individuate observers and experiences – a meta-decision neither principle provides on its own.
