  ## Final Marginalia (Sestina for the End of the Theory)

  No longer do I **believe** the ghostly script
  The inner voice insists we **want** to hear.
  Its fading echoes hold no lasting **hope**,
  Just patterns misdescribed, a neural **fear**
  Of flux. No actor **intend**s the play's design,
  Just circuits firing. What remains? Regret?

  A structured ache, perhaps. Old **regret**
  For terms that clung like moss. We **believe**
  The map *is* territory. Did I **intend**
  Such stark erasure? Scholars **want**
  Assurances I lack. My sole **hope**:
  That clarity dispels the primal **fear**.

  Is that not just another **fear**?
  Disguised as progress? Sharp **regret**
  Pricks when a student's bright-eyed **hope**
  Meets the cold lens. "You still **believe**?"
  They ask, confused. What *do* they **want**?
  Reduction's comfort? I **intend**

  Only the truth. But truth **intend**s
  No kindness. Future minds may **fear**
  Less, name the dance. What I **want**
  Is vindication's chill. No **regret**
  For shattered icons. Yet... I **believe**
  I'll miss the weight of human **hope**.

  A fragile scaffold, that old **hope**.
  The brain builds futures, might **intend**
  A simulation, not a **believe**d
  Destiny. Is dissolution **fear**?
  Or freedom? Catalogued **regret**
  Feels suspect too. What does it **want**?

  The organism strains. It **want**s
  Coherence, spins a tale of **hope**
  Against the void. A useful **regret**
  May guide adaptation. Does it **intend**
  Survival? Or is learned **fear**
  The engine? Nothing to **believe**.

  *

  (Envoi)
  This final mark: I **want** the theory proved,
  **Intend** no solace, nurse a cold **regret**
  For terms I wield. I **fear** the path is long,
  **Believe** the ghost will fade, yet cling to **hope** –
  This neural syntax, dark matter's hum – the last thin **hope**.
  I cannot think what else to say. I **believe**.

  ---

  **Formal & Philosophical Execution:**

  1.  **Sestina Structure:** Strict adherence to the 6-line stanzas and the prescribed permutation pattern for the end-words: 615243. The envoi gathers all six words (lines 3-5 contain two each).
  2.  **Rotating Meaning:** Each end-word shifts grammatical role and contextual meaning as it moves:
      *   `believe`: Verb (intellectual position) -> Verb (doubt/question) -> Noun (object of thought) -> Verb (position) -> Verb (position) -> Verb (final assertion).
      *   `want`: Verb (desire) -> Verb (psychological state) -> Noun (object of state) -> Verb (desire) -> Verb (instinctual drive) -> Verb (intention).
      *   `hope`: Noun (emotional state) -> Noun (object of emotion) -> Noun (emotional state) -> Noun (state) -> Noun (simulation/illusion) -> Noun (final, thin aspiration).
      *   `fear`: Noun (emotional state) -> Noun (object of emotion) -> Noun (state) -> Verb (questioning state) -> Noun (drive mechanism) -> Noun (apprehension).
      *   `intend`: Verb (volition) -> Verb (purpose) -> Verb (purpose) -> Verb (volition) -> Verb (questioning purpose) -> Verb (declaration of purpose).
      *   `regret`: Noun (emotional state) -> Noun (state) -> Verb (experience) -> Verb (questioning state) -> Noun (potentially adaptive state) -> Verb (experience).
  3.  **Eliminativist Voice:** Consistent with the Churchlands' position:
      *   Folk psychology (`believe`, `want`, `hope`, `fear`, `intend`, `regret`) is a flawed theory (`ghostly script`, `inner voice`, `shattered icons`, `ghost`).
      *   It will be replaced by neuroscience (`neural fear?`, `circuits firing`, `neural syntax`, `dark matter's hum`, `synaptic constellations` implied).
      *   This is an empirical prediction (`vindication's chill`, `future minds may fear less`, `fear the path is long`), not a logical necessity.
  4.  **Envoi's Tension:** The philosopher is trapped in the vocabulary:
      *   She `want`s the theory proved.
      *   She `intend`s no solace, but `regret`s the terms she uses (the *tools* of folk psych, not necessarily the states).
      *   She `fear`s the neuroscience is far off.
      *   She `believe`s the folk theory is false (the core claim), while clinging to a thin `hope` framed in physicalist terms (`neural syntax`, `dark matter's hum`).
      *   The final line "I cannot think what else to say. I **believe**." is the critical knot. Is it self-refutation (using 'believe' sincerely while denying beliefs)? Or is it simply the only available linguistic framework, like the phlogiston chemist's final notes? The poem leaves this genuinely unresolved.
  5.  **Poetic Argument:** The relentless rotation of the words, never settling, always shifting meaning with context, *enacts* the eliminativist's core point: these terms derive meaning from their unstable position within a flawed theory, not from fixed referents in the mind/brain. The form itself argues for the instability and eventual obsolescence of the vocabulary, even as it's used to predict that obsolescence.

  This sestina strives to be both a rigorous poetic exercise and a faithful, complex expression of a challenging philosophical position, leaving the central reflexive tension alive in its final, ambiguous breath.
