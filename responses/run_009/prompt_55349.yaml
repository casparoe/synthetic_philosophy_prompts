prompt: |-
  I write novels for a living, and somehow that got me onto the board of a writers' emergency fund — a small charity that hands out grants (think a month's rent, not life-changing money) to writers hit by sudden crises. Our applications have tripled this year and the board is split. One faction wants what they call "basic diligence": proof of publication or a contract in progress, a signed statement that writing is your main occupation, a review of anyone who applies two years running, and clawback provisions if it turns out someone had a job they didn't declare. The other faction thinks all of that is just workfare for people who chose a badly paid profession, and that we'd be spending our tiny staff budget interrogating the desperate to catch, at most, one or two chancers. There's also a trustee who keeps saying the fund exists for "genuine writers" in a way I don't love but can't quite put my finger on why. Draft the memo I'd circulate before next month's meeting: recommend a concrete policy — which conditions to keep, which to drop, what to do about the repeat applicants and the undeclared-job worry — and make it engage the diligence faction's strongest point honestly rather than waving it off as cruelty, since a fund that's bankrupted by the next grantee's honesty helps nobody either. I want a bottom line the board can actually vote on, not a both-sides essay. If it helps, my instinct is that the fraud question and the deservingness question are getting muddled together in our meetings, but I write fiction, so check that instinct rather than trusting it.
reasoning: |-
  Okay, the user is a novelist who's on the board of a writers' emergency fund. They're facing internal conflict because applications have tripled, and the board is split between stricter verification ("diligence faction") and minimal barriers to access. The user wants a memo that recommends a concrete policy, addresses the diligence concerns seriously, avoids muddling fraud with "deservingness," and ends with a clear vote-ready proposal.  

  Hmm, the core tension here is between integrity and accessibility. The diligence faction isn't wrong to worry about sustainability—if funds go to ineligible people, genuinely needy writers lose out. But the other side is right that over-policing could waste resources and humiliate applicants. The user's instinct about conflating fraud (factual ineligibility) and "deservingness" (subjective value judgments) feels spot-on; that's the knot to untangle.  

  For the memo:  
  First, I should reframe "diligence" as risk management rather than mistrust. The strongest point from the diligence camp isn't cruelty—it's that *unchecked leakage could collapse the fund*. That deserves respect. The fraud/deservingness confusion needs explicit calling out: eligibility isn't about artistic merit but factual criteria (writing as main occupation, sudden crisis).  

  Concrete recommendations:  
  - **Proof of profession**: Require *either* a publishing contract *or* tax returns showing writing as primary income. This avoids gatekeeping unpublished writers while adding verifiable data.  
  - **Repeat applicants**: Flag them for human review—maybe their crisis is ongoing (like disability), which deserves compassion, but we should also signpost other resources.  
  - **Undeclared jobs**: Skip clawbacks (too costly); instead, random audits *only* if funds run low, plus a clear fraud reporting process. Most "fraud" here is likely desperation, not malice.  
  - **"Genuine writers" rhetoric**: Politely euthanize that phrase. It reeks of artistic snobbery and isn't in the fund's charter.  

  Bottom-line proposal: Minimal documentation with targeted checks. Protects the fund without becoming an interrogation unit. The vote wording should be crystal clear: "Adopt the following verification framework: [list]."  

  User’s deeper need? They want unity. The memo must model how to disagree without dehumanizing either applicants or board members. Tone is key: pragmatic, compassionate, and weary of bureaucratic overreach (they’re a novelist, after all). Also, they’d appreciate subtle wit—like comparing clawbacks to "police procedurals."  

  Finally, the user’s fiction background shows in their empathy for complexity. The memo should honor that by rejecting false binaries. No "both-sides"-ism, but also no caricature.
answer: |-
  ## MEMO: Writers' Emergency Fund - Policy Recommendations for Sustainable & Compassionate Grantmaking  
  **To:** Board of Trustees  
  **From:** [Your Name], Trustee & Working Novelist  
  **Date:** [Date]  
  **Subject:** Proposed Verification Framework for Grant Applications - Vote Recommendation for [Meeting Date]  

  Our tripled applications are a stark indicator of the profound instability facing writers today. This pressure forces us to reconcile two core principles: **compassionate accessibility** for those in sudden crisis, and **responsible stewardship** of finite resources. The current debate centers on verification ("diligence"), but risks conflating two distinct issues: **1) Factual Eligibility** (Is writing their main occupation? Is the crisis sudden?) and **2) Subjective "Deservingness"** (Are they a "genuine writer"?). The latter is a harmful distraction. Our mandate is to aid *professional writers* in *acute crisis*, not judge artistic merit.  

  My proposal addresses factual eligibility efficiently, minimizes barriers, respects applicant dignity, and focuses our tiny staff budget where risk is highest. It directly engages the diligence faction’s strongest, valid concern: **preventing systemic leakage that could bankrupt the fund and deny aid to truly eligible writers.** Ignoring fraud risk is irresponsible; hunting phantom chancers with police-procedural zeal is unsustainable and cruel. We need a scalpel, not a sledgehammer.  

  ### Recommended Verification Policy  

  1.  **Proof of Professional Writing Occupation (Keep - Modified):**  
      *   **Require:** Applicant attestation (signed statement) that writing is their *primary occupation and primary source of income (or intended primary source, if early career)*.  
      *   **Require ONE of the following:**  
          *   A current publishing contract (book, significant periodical, screenplay prod. co.), OR  
          *   Proof of earned writing income (min. $5,000) via most recent tax return (Schedule C/C-EZ or equivalent, redacted for all but writing income lines), OR  
          *   For very early-career writers without contracts/income: A detailed writing CV + one letter of reference from a recognized industry professional (agent, editor, established writer, writing program director).  
      *   **Why this works:** Verifies professional commitment without excluding the unpublished or those between contracts. Tax docs are concrete evidence of primary occupation intent. Avoids judging "quality" or publication venue prestige. Reference letters add minimal burden but deter casual chancers.  

  2.  **Review of Repeat Applicants (Keep - Focused & Compassionate):**  
      *   **Flag:** Any applicant receiving a grant within the previous 24 months for automatic board-level review.  
      *   **Process:** The review asks: "Is this a *new, distinct, sudden crisis*?" (e.g., new medical diagnosis, new fire/flood, sudden loss of a specific contract/support) OR "Is this an *ongoing/complex crisis* requiring sustained support beyond our scope?"  
      *   **Action:**  
          *   If new crisis: Grant approved (assuming other criteria met).  
          *   If ongoing crisis: Grant *may* still be approved as a bridge, but staff *must* provide the applicant with information/resources for longer-term support (social services, disability, other charities).  
          *   **No arbitrary ban on repeats.** Crises aren't always one-offs.  
      *   **Why this works:** Addresses potential dependency ethically. Focuses effort only on repeats. Connects writers with broader support, fulfilling our role as a *crisis* fund without abandoning those in prolonged hardship.  

  3.  **Undeclared Job / Financial Verification (Drop Intrusive Proactive Checks; Add Targeted Safeguards):**  
      *   **DROP:** Mandatory wage/employment verification, bank statements, or clawback provisions for all applicants.  
      *   **ADD:**  
          *   **Clear Attestation:** Strengthen the application statement: "I attest that writing is my primary occupation and primary source of (or intended primary source of) income. I understand that receiving significant income from non-writing employment not declared on this application may render me ineligible."  
          *   **Fraud Reporting Mechanism:** Establish a simple, confidential channel for reporting *specific, credible allegations* of significant fraud (e.g., "Applicant X holds a full-time salaried non-writing job they did not declare").  
          *   **Risk-Based Audit (Only if needed):** **IF** grant funds are depleted before year-end **AND** a credible, specific allegation is received, the board *may* authorize staff (or a volunteer trustee) to conduct a *targeted* verification (e.g., requesting specific proof of employment status *only* from the named applicant). This is a last-resort, suspicion-driven measure, not routine policy.  
      *   **Why this works:** Proactive checks on *everyone* are costly, invasive, and assume bad faith. Diligence's valid concern about large-scale fraud is addressed by deterrence (strong attestation + consequence) and a mechanism for investigating *actual evidence*. Most "fraud" we'd catch would likely be minor or desperate, not worth the staff cost. This focuses resources on credible threats.  

  4.  **"Genuine Writer" Rhetoric (Reject):** This language is subjective, elitist, and outside our mandate. Our criteria are factual: primary occupation in writing + sudden crisis. A self-published romance novelist relying on that income is as eligible as a critically acclaimed poet.  

  ### The Bottom Line - Motion for Vote
  **I move that the Writers' Emergency Fund adopt the following verification framework effective [Date]:**  
  1.  Require applicant attestation of writing as primary occupation/income source.  
  2.  Require ONE proof of professional pursuit: Valid contract, tax return showing min. $5K writing income, OR (for early-career) CV + industry reference letter.  
  3.  Implement a compassionate review process for applicants who received a grant within the previous 24 months.  
  4.  Rely on strengthened attestation and a credible fraud reporting mechanism for undeclared income concerns, reserving targeted audits only for credible allegations made when fund depletion is imminent.  
  5.  Explicitly remove subjective assessments of "deservingness" or "genuine writer" status from eligibility considerations.  

  **This policy balances integrity and compassion.** It provides verifiable proof of professional pursuit crucial for fund integrity (addressing the diligence faction's core concern), minimizes routine barriers and humiliation for applicants in crisis, focuses our limited staff resources efficiently, and rejects harmful gatekeeping based on subjective merit. It ensures help reaches writers who need it most *without* putting the fund's future at unnecessary risk.  

  Let's vote to adopt this framework at our next meeting and direct staff to draft the detailed procedures. We exist to keep writers afloat in a storm, not to judge the seaworthiness of their vessel.
