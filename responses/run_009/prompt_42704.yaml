  ### Decision Tree for the Discursive Dilemma  
  *Navigate the logical space of solutions for collective verdicts on interconnected propositions. Start at Question 1 and follow the branches based on your answers.*

  ---

  #### **Question 1: Must the group deliver a collective verdict on *every* proposition?**  
  - **No → Go to Question 2**  
    *(The group may leave some propositions unsettled.)*  
  - **Yes → Go to Question 5**  
    *(The group must take a position on all propositions.)*  

  ---

  #### **Question 2 (Incompleteness): Must every member’s judgment count equally?**  
  - **Yes → Go to Question 3**  
    *(Equal weight for all members.)*  
  - **No → Leaf: Non-egalitarian Selective Decision**  
    - **Position**: Defer to a subset or chair for selected propositions, leave others unsettled.  
    - **Awkward commitment**: Arbitrariness in which propositions are decided and who decides them.  

  ---

  #### **Question 3 (Incompleteness + Egalitarian): Does the group vote *only* on the conclusion (final verdict)?**  
  - **Yes → Leaf: Conclusion-Based Majority**  
    - **Position**: Majority vote on the conclusion only; leave premises (grounds) unresolved.  
    - **Awkward commitment**: Group cannot justify *why* it reached the verdict (no accountability for reasons).  
  - **No → Leaf: Selective Majority**  
    - **Position**: Majority vote on an *arbitrary subset* of propositions (not necessarily the conclusion), leave others unsettled.  
    - **Awkward commitment**: Risk of inconsistency in the decided set; ignores logical links between propositions.  

  ---

  #### **Question 5 (Completeness): Must every member’s judgment count equally?**  
  - **Yes → Go to Question 6**  
    *(Equal weight for all members.)*  
  - **No → Go to Question 7**  
    *(Defer to a subset or chair.)*  

  ---

  #### **Question 6 (Completeness + Egalitarian): Must the group use the *same* voting rule for every proposition?**  
  - **Yes → Go to Question 8**  
    *(Uniform aggregation, e.g., majority on all propositions.)*  
  - **No → Go to Question 9**  
    *(Non-uniform rules, e.g., prioritize some propositions.)*  

  ---

  #### **Question 7 (Completeness + Non-egalitarian): Must the group use the *same* voting rule for every proposition?**  
  - **Yes → Go to Question 10**  
    *(Uniform rule applied unequally, e.g., oligarchy.)*  
  - **No → Leaf: Non-Uniform Non-Egalitarian**  
    - **Position**: Hybrid approach (e.g., chair decides some propositions, majority on others).  
    - **Awkward commitment**: Arbitrariness in assigning rules to propositions.  
    - **Gap note**: Unattractive—no clear principle for rule assignment.  

  ---

  #### **Question 8 (Completeness + Egalitarian + Uniform): Can the agenda be restricted to avoid inconsistencies?**  
  - **Yes → Leaf: Majority with Restricted Agenda**  
    - **Position**: Majority vote on all propositions, but agenda is pared down (e.g., only logically independent propositions).  
    - **Awkward commitment**: Excludes critical propositions to dodge dilemmas.  
  - **No → Leaf: Impossibility**  
    - **Position**: No consistent method exists under these constraints.  
    - **Awkward commitment**: Forces retreat to Question 1 or 5 (e.g., accept incompleteness or non-uniformity).  
    - **Gap note**: Incoherent—majority + completeness + egalitarian + uniform *requires* agenda restriction.  

  ---

  #### **Question 9 (Completeness + Egalitarian + Non-uniform): Are premises prioritized?**  
  - **Yes → Leaf: Premise-Based Majority**  
    - **Position**: Majority vote on premises, derive conclusions logically.  
    - **Awkward commitment**: Group may endorse a conclusion *rejected* by a majority (if voted on directly).  
  - **No → Leaf: Non-Uniform Majority**  
    - **Position**: Priority given to arbitrary propositions (not necessarily premises).  
    - **Awkward commitment**: No grounding in logic; priorities may seem ad hoc.  
    - **Gap note**: Unattractive—lacks justification for priority scheme.  

  ---

  #### **Question 10 (Completeness + Non-egalitarian + Uniform): Is one member decisive?**  
  - **Yes → Leaf: Dictatorship**  
    - **Position**: One individual’s judgments define the group’s verdicts.  
    - **Awkward commitment**: Ignores all other members’ input.  
  - **No → Leaf: Oligarchic Majority**  
    - **Position**: Majority vote *within a fixed subset* (e.g., experts), applied uniformly.  
    - **Awkward commitment**: Oligarchy may face the *same dilemma* as the full group.  

  ---

  ### Key Notes on Gaps and Ambiguities  
  1. **Unoccupied Gaps**:  
     - **Complete + Egalitarian + Uniform + Unrestricted Agenda**: Incoherent (dilemma is inevitable → *Impossibility*).  
     - **Complete + Non-egalitarian + Non-uniform**: Unattractive (no principled way to assign rules → *Non-Uniform Non-Egalitarian*).  
     - **Complete + Egalitarian + Non-uniform + No Priority to Premises**: Unattractive (arbitrary priorities → *Non-Uniform Majority*).  

  2. **Indistinguishable Leaves**:  
     - **Premise-Based Majority vs. Selective Incompleteness**:  
       A group using *Premise-Based Majority* (complete, derives conclusions) may resemble a group that votes on premises and leaves conclusions unsettled (*Selective Majority*). The tree separates these (Q1: completeness), but they may be empirically similar if the derived conclusion is not explicitly debated.  
     - **Dictatorship vs. Non-Egalitarian Selective Decision**:  
       Both centralize power, but dictatorship is complete (all propositions decided by one), while non-egalitarian selective decision is incomplete.  

  3. **Clarifications**:  
     - **Conclusion-Based Majority** leaves premises unsettled; **Premise-Based Majority** is complete (premises + derived conclusions).  
     - **Oligarchic Majority** differs from **Dictatorship** by involving a subgroup vote, not one individual.  

  ---  
  *Use this tree to map your preferred solution. Awkward commitments reveal trade-offs; gaps highlight theoretical limits.*
