prompt: |-
  You are a professional philosopher of mind, and I'd like you to act as a translator for me. I'm a distributed systems engineer: I think in terms of state machines, process state, replication, failover, live migration of virtual machines, exact versus approximate copies, and emulator fidelity. I have essentially no philosophy background, but I've gathered that there's a family of thought experiments about gradually replacing neurons with functionally identical silicon, and about copying or teleporting a person, that philosophers take very seriously.

  Restate that debate in my vocabulary, as faithfully as you can. Specifically: translate the neuron-by-neuron replacement scenario (and the imagined intermediate stages where replacement is half-finished, or where the artificial components' parameters drift over time) into terms of live state migration and incremental platform substitution; translate the claim that the person survives copying into terms of process identity and replica divergence; and translate the worry that the copy "isn't really me" into whatever of my vocabulary fits. Think carefully before you write, and begin with a brief brainstorm of candidate mappings before committing to any.

  Then give me the residue report, which is what I actually care about. Which of the philosophers' claims translate cleanly onto things I already understand, which had to be distorted to fit, and which have no expression in my vocabulary at all? In particular, I want to know whether the worry that a migrated process might be functionally perfect yet have "nobody home" is even statable in systems terms — in my world, a state-complete migration that behaves identically settles every question there is to ask. And then the crucial question: if something in the debate survives translation into my vocabulary only as an inarticulate residue, does that mean my vocabulary is missing a genuine fact, or that the philosophers' worry is less well-defined than they take it to be? Distinguish those two possibilities explicitly, and don't smuggle in a philosophical conclusion under the guise of translation. Be honest about which side of the ledger each residual item belongs on, and consider the possibility that different items belong on different sides.
