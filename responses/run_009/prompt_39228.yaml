  Some philosophical concerns do seem ill-defined in engineering terms - like vague identity thresholds during gradual replacement. But others might point to real gaps - if identical functional behavior doesn't capture subjective experience, that could indicate either a limitation in their vocabulary or an incoherence in the philosophical position. 

