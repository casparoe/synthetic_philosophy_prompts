answer: |-
  Here is the essay question, model answer, and marking scheme tailored to your specifications:

  ### (1) Essay Question  
  **Bernard Williams argues that consequentialism violates agents' integrity. Critically evaluate this claim by addressing the following:**  
  (a) Precisely distinguish the *two distinct concerns* about integrity raised in Williams's critique. Explain what "integrity" signifies in each strand of the objection.  
  (b) Demonstrate how an indirect consequentialist (e.g., one endorsing two-level utilitarianism) could accommodate *one* of these concerns while leaving the other intact. Justify why this strategy succeeds for one but not the other.  
  (c) Invent and analyze an *original case* (not from Williams or common commentaries) where an agent faces a moral dilemma. Use this case to show how Williams’s two concerns come apart. Argue which concern reveals a deeper problem for consequentialism after granting the indirect consequentialist’s reply.  

  **Your response must:**  
  - Take a clear stance on whether the two concerns are ultimately the same objection.  
  - Forego exegesis of published dialogues (e.g., Smart vs. Williams) or textual analysis.  
  - Focus on the *structure* of the objections and their vulnerability to consequentialist replies.  

  ---

  ### (2) Model Answer (610 words)  
  Williams’s integrity objection comprises two distinct concerns: the *existential* and the *deliberative*. The existential concern holds that consequentialism alienates agents from their “ground projects” – commitments so central to their identity that their loss would destroy the agent’s reason to live. Here, “integrity” denotes the coherence of personal identity sustained by these projects. Indirect consequentialism readily absorbs this: it can endorse dispositions of partiality (e.g., loyalty to loved ones) as psychologically necessary for long-term utility maximization. By building such commitments into an agent’s character, utilitarianism sidesteps alienation; the wife-saving husband need not abandon his project of marital devotion.  

  The deliberative concern is fundamentally different. It claims that consequentialism distorts *how* agents justify actions rooted in personal commitments. Williams’s “one thought too many” is not a literal count of thoughts but a critique of *justificatory hierarchy*. Integrity here means acting from reasons that are *intrinsically authoritative* for the agent, without subordinating them to impartial validation. The husband who saves his wife only after calculating her greater utility-weighting violates this: his spousal love loses its standing as an independent justification. This concern targets consequentialism’s insistence that personal reasons must derive authority from impartial optimization.  

  These concerns come apart. The existential objection is about *what* dispositions agents need to thrive; the deliberative is about *how* reasons function within practical reasoning. Indirect consequentialism resolves the former but exacerbates the latter: it permits partiality *only* because it maximizes utility, thereby reinforcing the subordination of personal reasons to an impartial framework.  

  Consider this original case:  
  > *Elena, a climate scientist, has devoted 15 years to proving that Company X’s chemical causes ecological collapse. Her research is her ground project. At a conference, she learns a rival’s paper will undermine her life’s work unless she sabotages its presentation. An impartial calculation shows that suppressing the paper marginally benefits the environment (by preserving Elena’s influence) and avoids her psychological collapse. However, Elena believes scientific integrity forbids sabotage, regardless of consequences.*  

  Here, the *existential* concern applies: forcing Elena to sabotage to maximize utility alienates her from her scientific identity. Indirect consequentialism accommodates this by endorsing a disposition of research integrity as utility-maximizing – scientists with such dispositions produce better long-term outcomes.  

  Yet the *deliberative* concern arises sharply. If Elena *refrains* from sabotage *only* because her disposition maximizes utility, she instrumentalizes her commitment to truth. Williams would argue that her reason – “sabotage betrays science” – should stand independently; subordinating it to consequentialist validation is the “one thought too many.” Even if indirect consequentialism permits her action, it makes the *authority* of her reason contingent on impartial optimization. This corrupts the phenomenology of integrity: her dedication to truth becomes a mere tool.  

  The deliberative concern exposes a deeper flaw. Indirect consequentialism neutralizes alienation by co-opting personal projects into its calculus, but it cannot grant personal reasons *intrinsic normative force*. The scientist’s commitment to truth must still answer to utility at the criterion level. Williams’s core insight is that some reasons – spousal love, artistic creation, scientific integrity – are *agent-relative* and resist translation into agent-neutral value. Consequentialism’s failure to recognize their independent authority persists even when it “permits” their expression.  

  Thus, the two concerns are not interchangeable. The existential objection is a pragmatic challenge met by indirect consequentialism; the deliberative objection is a conceptual critique of its justificatory structure. The latter endures because it rejects consequentialism’s reduction of all reasons to a single currency. What is deepest in Williams is this: integrity requires that some commitments *stop the justificatory regress*, and no form of consequentialism can honor that.  

  ---

  ### (3) Marking Scheme (20 marks total)  
  **MUST-HIT MOVES:**  
  1. **Clear distinction of two concerns with integrity defined for each** (5 marks)  
     *Costly mistake:* Conflating alienation and deliberative authority as “both about personal projects” without specifying divergent conceptions of integrity.  

  2. **Critical engagement with indirect consequentialism** (6 marks)  
     *Costly mistake:* Claiming indirect consequentialism resolves both concerns, or failing to show *why* it fails against the deliberative objection (e.g., not explaining subordination of reasons).  

  3. **Original case construction and analysis** (5 marks)  
     *Costly mistake:* Using a case where both concerns apply symmetrically (e.g., replicating the drowning wife) or failing to isolate how one concern operates while the other is neutralized.  

  4. **Argumentative stance on survival of Williams’s critique** (4 marks)  
     *Costly mistake:* Summarizing objections without adjudicating depth/unity (e.g., “both are important” without ranking) or ignoring the indirect consequentialist absorption of alienation.  

  ---

  ### Why This Works  
  - **Prevents regurgitation:** The original case requirement and mandatory dissection of indirect consequentialism block stock summaries.  
  - **Forces conceptual separation:** Part (a) explicitly demands two definitions; part (b) requires showing how they diverge under pressure.  
  - **Targets the "deeper" problem:** The model answer shows the deliberative concern survives indirect consequentialism by attacking its justificatory monism.  
  - **Meets constraints:** The question tests structural grasp (not textual history) and is answerable in 90 minutes if the student has genuinely internalized the conceptual split.
