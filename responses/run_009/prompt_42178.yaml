answer: |-
  ### Joint Statement: Adversarial Collaboration on the One-Shot Prisoner's Dilemma

  **Preamble**  
  For decades, Camp A and Camp B have disagreed fundamentally on whether cooperation can be rational in a strict one-shot prisoner's dilemma (PD). Camp A insists defection is uniquely rational under causal isolation and no communication, arguing that cooperation requires smuggled-in assumptions (e.g., repetition or altruism). Camp B, rooted in superrationality and evolutionary insights, contends that symmetry in information, choices, and deliberative machinery makes cooperation rational via evidential reasoning. This document outlines areas of agreement, residual disagreements, cruxes for resolution, and conditions for progress. Both camps endorse this statement as a fair representation of the collaboration.

  ---

  ### 1. Jointly Signed Claims  
  We agree on the following:  
  1.1 **Formal Structure of the Game**: The prisoner's dilemma is defined by the payoff matrix satisfying \(T > R > P > S\) and \(2R > T + S\), where defection dominates cooperation when treating the other player's action as independent.  
  1.2 **Folk Theorem for Iterated Play**: The folk theorem demonstrates that cooperation can emerge as a Nash equilibrium in indefinitely repeated PDs through strategies like Tit-for-Tat. However, it does not establish cooperation in a genuine one-shot PD, as it relies on repeated interactions and the shadow of the future.  
  1.3 **Axelrod-Style Tournaments**: Axelrod’s tournaments revealed the robustness of reciprocal strategies (e.g., Tit-for-Tat) in repeated PDs. These results do not apply to the one-shot case because they:  
     - Required repeated interactions (enabling learning and punishment).  
     - Used pre-submitted strategies (removing real-time deliberation).  
     - Included no causal isolation (allowing strategies to evolve based on history).  

  ---

  ### 2. Table of Residual Disagreements  
  Each camp accepts the wording below as a fair statement of its position.  

  | Camp A Position | Camp B Position |
  |----------------|----------------|
  | In a strict one-shot PD with causal isolation, defection is the only rational choice. Rationality demands maximizing expected utility under dominance, and any evidential weight given to one’s own choice confuses correlation with causation. | In a strict one-shot PD with symmetric agents (identical information, choices, and deliberative machinery), cooperation can be rational. An agent’s own choice is evidence about the other’s choice, and mutual cooperation outperforms mutual defection when this symmetry holds. |
  | The evidential link between one’s choice and the other’s is not a theorem of decision theory; it requires an unsupported empirical premise about agent similarity or is a causal fallacy violating game stipulations. | The evidential link arises from decision theory in symmetric settings: identical inputs to identical algorithms yield identical outputs, making one’s choice a proxy for the other’s without causal influence. |
  | If causal isolation is enforced, cooperation is irrational. Real-world "one-shot" interactions (e.g., anonymous online transactions) often include hidden symmetries (e.g., shared culture), but if purged, defection dominates. | Causal isolation does not dissolve cooperation’s rationality; it makes evidential reasoning counterintuitive but still valid. Real-world one-shot interactions often feature symmetry (e.g., common training), enabling cooperation. |

  ---

  ### 3. Cruxes: Sub-Questions, Tests, and Predictions  
  Cruxes are unresolved questions whose resolution could shift at least one camp’s position. For each, we specify a test and predictions.  

  #### Crux 1: *Can any real-world interaction be genuinely one-shot?*  
  **Sub-Question**: Does shared culture, algorithms, or training create de facto symmetry that invalidates "one-shot" isolation?  
  - **Test**: Run a one-shot PD with human subjects who share an explicit symmetry (e.g., same training module or cultural background) but are told they are causally isolated and anonymous. Measure cooperation rates.  
    - **Camp A Prediction**: Cooperation rates will be near baseline (≈20%), as defection dominates when no hidden repeated elements exist.  
    - **Camp B Prediction**: Cooperation rates will be high (≥60%), as symmetry triggers evidential reasoning.  

  #### Crux 2: *Does causal isolation dissolve the intuition for cooperation or just make it irrational?*  
  **Sub-Question**: If causal isolation is enforced, is cooperation irrational (Camp A) or rational but psychologically inaccessible (Camp B)?  
  - **Test**: Use a thought experiment: Two identical AIs with shared code and data play a one-shot PD in causally isolated systems. They know their symmetry but cannot communicate.  
    - **Camp A Prediction**: AIs defect—causal isolation severs any decision-theoretic link, making defection dominant.  
    - **Camp B Prediction**: AIs cooperate—their identical algorithms process symmetry as evidence for mutual action.  

  #### Crux 3: *Is evidential reasoning a decision-theoretic theorem or an empirical add-on?*  
  **Sub-Question**: Does evidential weight derive from standard decision theory (Camp B) or require empirical similarity (Camp A)?  
  - **Test**: Formalize a decision-theoretic model where symmetry is a variable. Vary agent similarity in simulations (e.g., from identical algorithms to random ones) and measure cooperation.  
    - **Camp A Prediction**: Cooperation only occurs when similarity is high—it is an empirical add-on, not a theorem.  
    - **Camp B Prediction**: Cooperation occurs under perfect symmetry even in causal isolation—it is a theorem of evidential decision theory.  

  #### Verbal Dispute: *The meaning of "rationality"*  
  - **Identification**: Camp A defines rationality as *causal decision theory* (CDT): maximize utility given causal consequences. Camp B defines it as *evidential decision theory* (EDT) under symmetry: maximize utility given evidence (including correlations).  
  - **Separation from Substance**: The verbal dispute is about the definition of "rationality." The substantive disagreement is whether EDT or CDT applies in symmetric one-shot PDs.  
  - **Resolution**: Agree to use "CDT-rational" and "EDT-rational" to clarify positions.  

  ---

  ### 4. Conditions for Progress  
  **Genuine Progress** would involve:  
  - **Empirical**: Testing the cruxes (e.g., AI/human experiments under enforced symmetry and isolation) to yield data favoring one camp’s predictions.  
  - **Theoretical**: Formal proofs showing whether evidential reasoning is derivable from decision-theoretic axioms without auxiliary assumptions.  
  - **Conceptual**: Resolving the EDT vs. CDT debate in symmetric games through decision-theoretic innovations (e.g., a unified framework).  

  **Merely Restating Positions** would involve:  
  - Invoking iterated PDs, reputation, or altruism as analogies for the one-shot case.  
  - Using Axelrod-style tournaments or evolutionary models without addressing causal isolation.  
  - Redefining "rationality" without engaging the CDT/EDT distinction or symmetry.  

  ---  
  **Signed,**  
  Representatives of Camp A and Camp B  
