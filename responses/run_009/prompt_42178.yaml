  We are drafting a joint statement from an adversarial collaboration between two camps (A and B) on the one-shot prisoner's dilemma.

  Camp A: Believes defection is the only rational choice in a strict one-shot PD with no communication, causal isolation, and no repeated play or reputation. Any argument for cooperation introduces elements excluded by the game.

