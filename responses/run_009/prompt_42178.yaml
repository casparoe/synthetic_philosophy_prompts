  - Formal structure of the game: The prisoner's dilemma is defined by the payoff matrix (T>R>P>S and 2R>T+S) and that the dominant strategy for each player is to defect if they consider only their own action and the other's action as independent.

  - Folk theorem for iterated play: It shows that in repeated games, cooperation can be sustained as an equilibrium, but it does not apply to the one-shot case.

  - Axelrod-style tournaments: These demonstrated the success of reciprocal strategies (like Tit-for-Tat) in repeated interactions, but they involved pre-submitted strategies and repeated play, not live one-shot decisions.

