  - Camp B predicts: Cooperation rates will be high when similarity is emphasized.

  But note: real people might not be perfectly symmetric, and they might have other motives. So it might not be clean.

  Alternatively, use AI agents that are designed to be identical and rational.

  ### 4. Progress vs. Restating

  Both camps agree that progress would be:

