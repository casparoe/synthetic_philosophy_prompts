  | Camp A Position | Camp B Position |
  |-----------------|-----------------|
  | In a strictly one-shot prisoner's dilemma with causally isolated agents, rationality demands defection because one's own action cannot causally influence the other, and the dominant strategy is the only rational choice. | In a strictly one-shot prisoner's dilemma with symmetric agents (same information, same rationality, same decision procedure), rationality demands cooperation because one's own choice is evidence of the other's choice, and mutual cooperation yields a higher payoff than mutual defection. |
