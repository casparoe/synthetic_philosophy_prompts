    - Camp A: Rationality in a decision-theoretic context requires maximizing expected utility given one's beliefs about the other player's action, and since defection is the dominant strategy, it is the only rational choice.
    - Camp B: Rationality in a symmetric setting requires considering the logical connection between one's own choice and the other's, leading to the conclusion that mutual cooperation is the rational outcome.

  - On the possibility of real one-shot games:
    - Camp A: It is possible to conceive of a genuinely one-shot prisoner's dilemma with causally isolated agents, and in such a case defection is the rational choice.
    - Camp B: Even in a one-shot setting, if the agents are sufficiently similar and know it, cooperation can be rational.

  But note: we want each row to be a disagreement, and each camp's view in a way they would accept.

