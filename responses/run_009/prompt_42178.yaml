  Crux 3: **Is the evidential reasoning a theorem of standard decision theory?**
  - Camp A: No, standard decision theory (e.g., causal decision theory) says that you should consider the causal consequences of your actions, not the evidence they provide. Therefore, the evidential reasoning is an ad hoc addition.
  - Camp B: Yes, in symmetric settings, evidential decision theory (or a variant) is the correct way to reason, and it leads to cooperation.

  But note: there is a verbal dispute here about what "decision theory" should be. We should identify that.

  Verbal Dispute: The meaning of "rationality" and which decision theory is appropriate.

  - Both camps agree that if we accept causal decision theory, then defection is rational. If we accept evidential decision theory, then cooperation can be rational in symmetric settings.
  - The substantive disagreement is whether in a one-shot PD with symmetric agents, evidential decision theory is the correct theory to apply.

