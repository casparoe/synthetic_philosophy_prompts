  Here's a referee's breakdown of each move, rated with confidence levels (1-10 scale) and reasons. The core tension is between **individual moral liability** (Roommate) and **systemic/practical necessity** (Brother-in-law), with law vs. morality as a backdrop.

  ---

  ### **Ratings & Analysis**
  **(1) Roommate (McMahan View)**  
  *Rating:* **Partially Right (but Overstated)**  
  *Confidence:* 8/10  
  *Reasons:*  
  - Correct that *jus ad bellum* (justice of war) affects individual moral liability. An unjust combatant *does* commit a moral wrong by killing just defenders (analogous to a mugger initiating violence).  
  - **BUT** overstates by implying moral equivalence to murder. Soldiers act under duress, systemic coercion, and epistemic limits – unlike a free mugger. McMahan’s view is philosophically rigorous but controversial precisely because it clashes with practical realities.  

  **(2) Brother-in-law (Walzer-Inspired Legalist View)**  
  *Rating:* **Mostly Right (on Practical Grounds)**  
  *Confidence:* 9/10  
  *Reasons:*  
  - Correct that combatant equality is the bedrock of international humanitarian law (IHL). Without it, POW protections, surrender, and medical care collapse.  
  - Spot-on about conscripts lacking agency: a 19-year-old conscript *cannot* reasonably assess *jus ad bellum*.  
  - **Weakness:** Doesn’t refute Roommate’s *moral* claim – he conflates legal necessity with moral absolution.  

  **(3) Roommate (Law vs. Morality Distinction)**  
  *Rating:* **Clearly Right**  
  *Confidence:* 10/10  
  *Reasons:*  
  - Law and morality *can* diverge. IHL treats combatants equally to preserve humanitarian norms, *even if* one side’s war is unjust. This doesn’t negate moral guilt. E.g., Nazi soldiers deserved POW status legally but bore moral blame.  
  - Brother-in-law’s "unraveling" concern is real but irrelevant to the moral point.  

  **(4) Brother-in-law (Epistemic/Coercion Defense)**  
  *Rating:* **Strongly Right**  
  *Confidence:* 9/10  
  *Reasons:*  
  - Devastating counter to Roommate’s moralism: conscripts often *can’t* know if their war is unjust (state propaganda, education, secrecy).  
  - Liability *requires* moral agency. A terrified teen under threat of execution lacks meaningful choice.  
  - **Roommate’s oversight:** Not all soldiers are philosophically informed volunteers.  

  **(5) Roommate (Culpability vs. Liability & Ignorance Excuse)**  
  *Rating:* **Mixed**  
    - *(5a) "Soldiers can know":* **Weak** (Confidence: 6/10)  
      *Reasons:* While *some* soldiers grasp their war’s injustice (e.g., WWII Germans), many don’t. Roommate underestimates systemic coercion.  
    - *(5b) "Innocent Aggressor analogy":* **Partially Right** (Confidence: 7/10)  
      *Reasons:* Self-defense *does* allow lethal force against non-culpable threats (e.g., a hallucinating attacker). This supports Roommate’s claim that liability ≠ culpability.  
      **BUT** warfare isn’t 1:1 with individual self-defense. Soldiers are *part of a collective threat*; the analogy strains at scale.  

  **(6) Brother-in-law (Boomerang Effect & Liability Ambiguity)**  
  *Rating:* **Clearly Right**  
  *Confidence:* 9/10  
  *Reasons:*  
  - Masterstroke: If liability hinges on "being a threat" (not fault), just soldiers making mistakes (e.g., collateral damage) could be "liable" too. Roommate’s distinction collapses.  
  - Correct that combatant equality protects soldiers *from enemy propaganda*. Without it, just soldiers risk summary execution as "criminals."  
  - **Exposes Roommate’s blind spot:** Moral judgments in war are reciprocal and easily weaponized.  

  **(7) Roommate (Concession & Post-War Focus)**  
  *Rating:* **Partially Right**  
  *Confidence:* 7/10  
  *Reasons:*  
  - Correct that law/morality divergence matters *post-war* (e.g., should aggressor soldiers face trials? Should they have refused orders?).  
  - **BUT** dodges Brother-in-law’s in-combat concerns. Moral liability *during* war destabilizes IHL’s life-saving rules, which is the Army veteran’s core point.  

  ---

  ### **What Both Are Missing**  
  1. **The Systemic Nature of War:**  
     - War is a *collective institutional action*, not an aggregation of individual choices. Moral responsibility is diffused across commanders, propagandists, and logistical chains. Focusing *only* on the frontline soldier oversimplifies.  
     - **Roommate** ignores how institutions manipulate soldiers’ beliefs/choices.  
     - **Brother-in-law** downplays that soldiers aren’t *just* instruments; they retain *some* moral agency (e.g., refusing war crimes).  

  2. **The "Unjust War" Definition Problem:**  
     - Both assume we can cleanly identify "aggressors." But most wars involve disputed histories (e.g., Was Iraq 2003 unjust? Ask 10 people, get 11 answers). Soldiers can’t resolve this – and neither can philosophers mid-war.  

  3. **A Middle Path?**  
     - *Jus in bello* (conduct in war) can be partly detached from *jus ad bellum*. An unjust combatant might deserve moral blame for participation *but still retain legal (and moral) protections* when hors de combat. This preserves IHL without absolving aggressors.  

  ---

  ### **Overall Confidence & Least Sure Point**  
  - **Confidence in Ratings:** 8/10 average. I’m versed in just war theory (Walzer, McMahan) and IHL, but real-world war ethics is messy.  
  - **Least Confident Point:** **Roommate’s "Innocent Aggressor" analogy (5b)** (Confidence: 6/10).  
    - *Why?* The analogy *works* in micro-ethics (e.g., stopping a sleepwalker attacking you). But war’s scale changes everything:  
      - Soldiers are *both* threats and victims.  
      - The "innocence" of a conscript is qualitatively different from a hallucinator.  
      - Applying this to warfare risks justifying total war ("They’re all threats!").  
    - I *suspect* Roommate overextends the analogy, but it’s philosophically contentious.  

  ---

  ### **Verdict**  
  - **Brother-in-law "wins" on practicality:** His emphasis on combatant equality saves lives and acknowledges war’s institutional reality. Roommate’s view, if implemented, would cripple humanitarian protections.  
  - **Roommate "wins" on abstract morality:** Unjust combatants *do* bear moral blame, and law isn’t morality. But he underestimates coercion, epistemology, and collective action.  
  - **The truce?** Post-war, we *can* judge individual soldiers (e.g., Nuremberg’s "following orders" rejection). But during war, IHL’s symmetry is tragically necessary. Neither is fully wrong – but war makes their positions irreconcilable. Next Thanksgiving, serve more turkey and change the subject. 🦃
