answer: |-
  ## Research Proposal: The Behavioral Distinguishability of Imprecise Credences

  **1. Core Question:**  
  Can an agent whose doxastic state is fundamentally characterized by a *set* of probability functions (a credal set) exhibit a pattern of preferences over acts – across both static choices and dynamic (learning) scenarios – that is *impossible* for any rational Bayesian agent with a single precise probability function and state-independent utility function? If not, then "imprecise credence" is merely a representational variant of orthodox Bayesianism.

  **2. Key Definitions & Scope:**
  *   **Rational Imprecise Agent (RIA):** An agent whose preferences conform to a decision rule (e.g., Maxmin EU, Levi's E-Admissibility) applied to a non-singleton, convex credal set \( \mathcal{C} \) defined over a state space \( S \). Belief updating follows a specified rule (e.g., generalized Bayesian, Dempster-Shafer). Utility is assumed state-independent and precise.
  *   **Rational Sharp Agent (RSA):** An agent whose preferences satisfy the Savage axioms (or similar), representable by a *single* probability function \( P \) over \( S \) and a state-independent utility function \( U \), maximizing expected utility (EU).
  *   **"Sharp Mimic":** A specific RSA (defined by a specific \( P \) and \( U \)) whose preference ordering over *any conceivable finite set of acts* offered in *any conceivable decision problem* is identical to that of a given RIA. Crucially, \( P \) and \( U \) are *fixed* – they do not change depending on the choice context or learning episode.
  *   **Decision Situations:** The comparison must cover:
      *   **Static Choices:** Preference over arbitrary finite sets of acts (bets, investments, etc.), including those designed to reveal ambiguity aversion (Ellsberg-like).
      *   **Dynamic Choices:** Sequences of choices involving learning (updating). The RSA updates via strict conditionalization (\( P_{new}(\cdot) = P_{old}(\cdot|E) \)). The RIA updates its credal set via a specified rule (e.g., \( \mathcal{C}_{new} = \{P(\cdot|E) | P \in \mathcal{C}, P(E)>0\} \)). The mimicry must hold *throughout* such sequences.
  *   **Distinguishability:** A RIA is distinguishable if *no* fixed RSA exists that matches its preferences across *all* possible static and dynamic decision problems.

  **3. Why Standard Positions Leave it Open:**
  *   **The Orthodox Challenge (Friend's View):** Orthodox Bayesians point out that any *single* choice or *static* pattern from a RIA (e.g., Ellsberg choices) *can* be mimicked by an RSA with a suitably chosen \( P \) (reflecting perceived ambiguity) and/or potentially complex \( U \) (reflecting ambiguity aversion interpreted as a utility feature). *Static mimicry seems always possible.*
  *   **The Imprecise Response (User's Intuition):** Imprecise probabilists argue that the *dynamics* of belief under learning create problems. **Dilation** is key: learning an event \( E \) can cause a RIA's credal set for some hypothesis \( H \) to *expand* (become less precise), even if \( E \) seems intuitively irrelevant to \( H \). An RSA's probability for \( H \) given \( E \) is always a *single sharp value*. The claim is that the *pattern of preference shifts* induced by dilation across a sequence of choices *cannot* be tracked by any *fixed* \( P \) and \( U \) in an RSA. However, this hasn't been conclusively demonstrated with a formal counterexample covering the full sequence of choices and preference shifts.

  **4. Methodology & Work Plan (12 Weeks):**
  *   **Weeks 1-2: Foundational Review & Formalization:** Rigorously define the RIA model (credal set formation rules, updating rules - focusing on generalized Bayesian, decision rules - focusing on Maxmin EU or E-admissibility). Precisely formalize the "Sharp Mimicry Thesis" (SMT): For any RIA \( I \), there exists a fixed RSA \( S_I = (P_I, U_I) \) such that for any finite set of acts \( \mathcal{A} \) offered at any point in any decision tree (including after any learning history), \( I \) and \( S_I \) have identical preference orderings over \( \mathcal{A} \).
  *   **Weeks 3-4: Static Mimicry & Ellsberg's Limits:** Analyze why standard Ellsberg arguments fail against SMT. Construct RSAs mimicking specific static Ellsberg choices using (a) specific "ambiguous" \( P \), (b) state-dependent utilities, (c) interpretations of imprecision as utility-based risk aversion. Conclude that static choices *alone* cannot refute SMT.
  *   **Weeks 5-7: Dilation Dynamics I - The Phenomenon:** Formalize dilation. Choose a canonical, minimal dilation scenario (e.g., the "dilation coin" based on an event with unknown correlation, or a simple unknown bias urn). Model a sequence of choices for a RIA: (1) Pre-learning choice(s) revealing initial imprecision, (2) Learning \( E \) causing dilation for \( H \), (3) Post-learning choice(s) revealing the *widened* imprecision over \( H \). Specify the precise preference shifts in the RIA (e.g., widened range of acceptable bet prices).
  *   **Weeks 8-9: Dilation Dynamics II - Attempted Mimicry:** Attempt to construct a *fixed* RSA \( S \) mimicking this entire sequence. Crucially:
      *   \( S \)'s initial \( P \) must generate the *initial* preferences (e.g., initial ambiguity aversion).
      *   After learning \( E \), \( S \) updates to \( P(\cdot|E) \).
      *   \( S \)'s \( P(H|E) \) must be a *single number*, but the RIA's belief in \( H \) is now *less precise*.
      *   \( S \)'s *post-learning* preferences (e.g., its acceptable betting range for \( H \)) must still match the RIA's widened range, *using only its fixed utility function \( U \)*. Can \( U \) be constructed such that the *combination* of the sharp \( P(H|E) \) and \( U \) produces betting behavior (e.g., refusal to bet at prices where it previously would bet) that perfectly mirrors the RIA's widened imprecision? Explore mathematically.
  *   **Weeks 10-11: Evaluation & Generalization:** 
      *   If mimicry *is* possible in the dilation case: Analyze the required \( U \). Is it plausible/natural? Does it violate reasonable constraints (e.g., state-independence)? Does it generalize to other dynamic scenarios? Does it reduce imprecise credence to a disguised feature of utility?
      *   If mimicry *fails*: Prove rigorously that no fixed \( (P, U) \) pair can reproduce the *sequence* of preference shifts induced by dilation. Generalize the counterexample structure - what essential features cause the failure? Explore other dynamic phenomena (e.g., belief inertia).
  *   **Week 12: Conclusion & Philosophical Implications:** Synthesize findings. Answer the core question based on the analysis.

  **5. Possible Conclusions & Deciding Considerations:**
  1.  **SMT Holds (Friend Wins):** A formal mimicry construction is found for the dilation scenario (and similar cases). The deciding factor is showing a fixed \( (P, U) \) can generate the *exact pattern of preference shifts* before and after learning, including widened betting ranges interpreted as decreased precision.
  2.  **SMT Fails (User Wins):** A rigorous proof demonstrates that the preference shift sequence (initial imprecision -> dilation -> widened imprecision) exhibited by the RIA in the chosen dilation scenario is *impossible* for any RSA with a *fixed* \( P \) and state-independent \( U \). The deciding factor is showing a mathematical incompatibility between the constraints imposed by the pre-learning preferences (requiring certain properties of \( P \) and \( U \)) and the post-learning preferences (requiring incompatible properties after conditionalization).
  3.  **Inconclusive:** A plausible mimicry construction exists but relies on an unnatural \( U \) (e.g., blatantly state-dependent in an ad-hoc way, or changing interpretation of outcomes mid-sequence), or the counterexample is fragile. The boundary remains fuzzy.

  **6. Risk Assessment: Feasibility & Scoping Challenges:**
  *   **Mathematical Depth:** Dilation in credal sets and generalized updating rules (e.g., Dempster-Shafer, Walley's) can involve complex measure theory and convex analysis. Focusing on *finite* state spaces and simple, canonical dilation examples (e.g., based on unknown correlation in a 2x2 contingency table) is crucial to stay within a semester's scope.
  *   **Decision Rule Complexity:** Maxmin EU is standard but can be extreme. E-admissibility is more flexible but harder to analyze. Sticking primarily to Maxmin EU simplifies the decision side.
  *   **Utility Complexity:** Allowing RSAs arbitrary state-independent \( U \) gives mimicry its best shot. Restricting \( U \) (e.g., to linear in money) makes failure more likely but may be seen as unfair. The proposal assumes state-independent \( U \) but allows it to be arbitrarily shaped to capture "aversion" – the challenge is whether this shaping can be fixed upfront.
  *   **Generality Trap:** Proving SMT holds/fails for *all possible* RIAs is too ambitious. Focusing on demonstrating it holds/fails for a *specific, well-defined class* of RIAs (e.g., using Maxmin EU, generalized Bayesian updating, initial credal sets defined by constant odds-ratio bounds) in a *specific, strong dilation scenario* is tractable and still highly significant.
  *   **Time Constraint:** Building the dynamic choice sequence and the formal proof/construction is the critical path. Weeks 8-9 are high risk. Having a fallback plan (e.g., presenting a strong impossibility argument even if a full proof isn't complete) is prudent.

  **7. What Turns on the Answer?**
  *   **For Decision Theory:** If SMT holds, orthodox Bayesianism is remarkably resilient. Imprecise models become optional tools for representing complex attitudes (like deep ambiguity aversion) *within* the sharp framework, primarily via utility. If SMT fails, it demonstrates a fundamental limitation of sharp probabilities: they cannot represent the *dynamic cognitive state* of genuine ambiguity/indeterminacy through learning without resorting to constantly changing priors or utilities, undermining the "fixed prior" ideal. This validates imprecise models as necessary for certain rational mental states.
  *   **For Philosophy of Probability:** If SMT fails, it provides a strong *behavioral* argument for the ontic reality of imprecise credence as a distinct doxastic category, not reducible to sharp credence plus utility. It supports the view that some uncertainty is fundamentally non-probabilistic. If SMT holds, it strengthens epistemic arguments for probabilism, suggesting that the phenomena driving imprecise models are ultimately about values or self-ignorance, not belief itself. It upholds the orthodox view that rational belief *must* be sharp.

  **Regarding Your Argument:** The substantive core of your debate hinges entirely on the outcome of this investigation. Your friend claimed *all* imprecise behavior is mimic-able. You claimed dilation provides a counterexample. If SMT holds, your friend's position is vindicated, and the difference *is* primarily representational/bookkeeping. If SMT fails, your intuition about dilation was correct, and you have identified a genuine, behaviorally manifest difference between sharp and imprecise agents that forces a revision of orthodox Bayesianism. The proposal aims to settle *that specific point* decisively.
