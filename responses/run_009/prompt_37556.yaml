prompt: |-
  My closest friend and I spent most of last weekend arguing about what the replication crisis actually shows, and we closed the argument with a deal: instead of another round of the same fight, we would try to write, together, the document a well-run adversarial collaboration between our two positions would produce. She is a committed frequentist — she thinks the crisis vindicates error control as a regulative ideal, and that its causes were quantifiable procedural failures: underpowered designs, optional stopping, forking-paths analysis, threshold-gaming. I am a committed Bayesian — I think the crisis is mostly about priors, that a low base rate of true hypotheses combined with weak evidence was always going to produce a literature dominated by noise, and that significance testing was at most an accelerant. Draft the joint statement we should both be able to sign.

  The document should contain, in this order:

  1. A numbered section of claims we both accept — about the scale and reality of the crisis, about which reforms are good regardless of framework (preregistration, larger samples, direct replication, publishing negative results), and about what the crisis does *not* show. Each side's suspicion that the crisis refutes the other's framework must not appear here; if neither of us can honestly sign a clause, leave it out.

  2. A disagreements section, formatted as a table, in which each disagreement is stated twice — once in wording she would sign, once in wording I would sign — where it is clear that the two wordings are the same dispute seen from two sides, not two separate disputes.

  3. A cruxes section: the sub-questions such that settling one would move at least one of us. We think we identified three, though we may have mis-diagnosed them: (a) optional stopping — she holds that a trial that can be stopped at will, yet is analyzed as if its sample size were fixed, is invalid; I hold that the evidential import of the data in hand is the same however the sample size was determined; (b) the base rate of true hypotheses in, say, social psychology — she regards it as irrelevant to whether any given study was well conducted, I regard it as the whole story about why the literature went wrong; (c) whether "calibration" as she defines it and "calibration" as I define it are the same property. Reconstruct these as precisely as you can, and add or drop cruxes if our diagnosis is off.

  4. For each crux, a concrete case, argument, or piece of evidence that both of us would agree in advance bears on it, together with each of our predictions about it, stated as a falsifiable commitment. Simulations count as cases: if there is a simulation we would both accept as a test, specify exactly what it would compute and what each of us predicts it will show.

  5. A closing section identifying which of our remaining disagreements, if any, are merely verbal — disputes over the words "evidence" or "rational" rather than over substance — and which are genuinely mathematical or empirical.

  Constraints: do not resolve the dispute in either direction; every claim in the agreed section must be one a thoughtful Bayesian and a thoughtful frequentist would each actually sign; attributing a position to a historical school by name is fine, but do not treat anyone's authority as an argument; and if you believe one of our cruxes is confused or badly framed, say so within the document rather than silently repairing it.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between a committed frequentist and a committed Bayesian on the replication crisis. The structure is fixed: agreed claims, disagreements (as a table), cruxes, tests for cruxes, and a closing on verbal vs. substantive disagreements.

  Agreed Claims (Section 1):
  - We both accept the reality and scale of the replication crisis, particularly in fields like social psychology.
  - We agree on the value of reforms: preregistration, larger samples, direct replication, and publishing negative results.
  - We agree that the crisis does not show that the entire scientific method is broken, nor that fraud is the primary cause.

  Disagreements Section (Section 2, as a table):
  We have two perspectives on the same disputes. The table will have two columns: one for her (frequentist) wording and one for me (Bayesian) wording. We'll list the same underlying disagreements from each viewpoint.

  Cruxes (Section 3):
  We have three cruxes: (a) optional stopping, (b) base rate of true hypotheses, (c) calibration. We'll state each precisely and add/drop if necessary.

  Tests for Cruxes (Section 4):
  For each crux, we'll provide a test (simulation, case, or evidence) that we both accept, and each of our predictions.

  Closing (Section 5):
  Identify which disagreements are merely verbal and which are substantive.

  Constraints: Do not resolve the dispute. Every claim in the agreed section must be signable by both. No appeals to authority.

  Let's begin.

  Section 1: Agreed Claims

  We, a committed frequentist and a committed Bayesian, agree on the following:

  1. The replication crisis is a real and significant problem in many scientific fields, especially in social psychology and related areas, where a substantial proportion of published findings fail to replicate.

  2. The crisis has exposed specific methodological weaknesses that are quantifiable and can be addressed through improved practices.

  3. We endorse the following reforms as beneficial regardless of statistical framework:
     a. Preregistration of research plans to prevent undisclosed flexibility in analysis and reporting.
     b. Larger sample sizes to increase statistical power and precision.
     c. Direct replication studies to verify findings.
     d. Publishing negative results to reduce publication bias.

  4. The crisis does not show that:
     a. Most published findings in affected fields are fraudulent.
     b. The scientific method is fundamentally flawed.
     c. All statistically significant results in the past were false positives.

  5. We both acknowledge that the crisis has spurred valuable reforms and increased methodological rigor.

  Section 2: Disagreements

  We present our disagreements as two perspectives on the same underlying issues. Each row addresses one dispute.

  | Frequentist Wording (She Signs)                                                                 | Bayesian Wording (I Sign)                                                                 |
  |-------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | The replication crisis primarily demonstrates the consequences of failing to control error rates, especially Type I errors, due to practices like optional stopping and p-hacking. | The replication crisis primarily demonstrates the consequences of ignoring prior probabilities, leading to a high false positive rate when base rates of true hypotheses are low. |
  | The use of p-values and significance testing is not inherently flawed; the problem lies in the misuse and violation of their assumptions. | The focus on statistical significance as a dichotomous decision rule is inherently problematic because it neglects the continuous nature of evidence and prior probabilities. |
  | The key to improving the literature is strict adherence to error-controlling procedures (e.g., fixed sample sizes, alpha levels) and transparency about all analyses conducted. | The key to improving the literature is the explicit quantification of evidence via Bayes factors or posterior probabilities, which incorporate prior knowledge and are less sensitive to sampling intentions. |
  | The base rate of true hypotheses in a field is irrelevant to the evaluation of a single study's internal validity; a well-conducted study with proper error control provides reliable evidence regardless of the field's base rate. | The base rate of true hypotheses is critical to interpreting the literature; without considering it, even well-conducted studies in a low-base-rate field will produce a high proportion of false positives. |
  | Calibration in the frequentist sense (long-run error rates) is the appropriate standard for evaluating the reliability of statistical procedures. | Calibration in the Bayesian sense (agreement between posterior probabilities and observed frequencies) is the appropriate standard for evaluating the reliability of statistical inferences. |

  Section 3: Cruxes

  We have identified three cruxes that are central to our disagreement:

  Crux (a): Optional Stopping
  - Her view: A trial that is stopped early based on interim results, but analyzed as if the sample size were fixed, produces invalid inferences because the Type I error rate is inflated beyond the nominal level.
  - My view: The evidential import of the data, as captured by the likelihood function, is the same regardless of the stopping rule. Therefore, a Bayesian analysis that conditions only on the data (and an appropriate prior) yields valid inferences even with optional stopping.

  Crux (b): Base Rate of True Hypotheses
  - Her view: The base rate of true hypotheses in a field (e.g., social psychology) is irrelevant to the internal validity of a single study. A study that is well-conducted with proper error control provides reliable evidence for or against the hypothesis it tests, independent of the field's base rate.
  - My view: The base rate of true hypotheses is the primary factor explaining the replication crisis. In fields with a low base rate, even studies with seemingly strong evidence (e.g., p < 0.05) are likely to be false positives, and this cannot be remedied without incorporating prior probabilities.

  Crux (c): Calibration
  - Her view: Calibration means that a statistical procedure should control long-run error rates (e.g., a 95% confidence interval should contain the true parameter in 95% of repeated samples). This is a crucial property for any inferential method.
  - My view: Calibration means that posterior probabilities should correspond with observed frequencies (e.g., of hypotheses assigned a posterior probability of 0.95, 95% should be true). This is a crucial property for any inferential method.

  Note: We are aware that there is a debate about whether these two notions of calibration are equivalent or even compatible. We leave this as a crux.

  Section 4: Tests for Cruxes

  For each crux, we propose a test that we both agree could bear on the issue, and state our predictions.

  Crux (a): Optional Stopping

  Test: A simulation study that generates data for a sequence of identical experiments testing a true null hypothesis (e.g., mean difference = 0). The simulation allows for optional stopping: after each observation, a test is conducted, and stopping occurs when the p-value falls below 0.05 (or when a maximum sample size is reached). We run 10,000 simulations.

  - Simulation computes: 
     (i) The proportion of simulations that stop early and reject the null (false positive rate under optional stopping).
     (ii) The Bayesian posterior probability for the null hypothesis (using a default prior) at the stopping point.

  - Her prediction: The false positive rate (i) will be inflated above 5%. The Bayesian posterior probabilities (ii) will not be calibrated in the frequentist sense (i.e., the posterior probability assigned to the null when it is true will not match the frequency of the null being true when that posterior is assigned).

  - My prediction: The Bayesian posterior probabilities (ii) will be calibrated in the Bayesian sense (e.g., when the posterior probability of the null is 0.95, the null is true about 95% of the time in the long run). The frequentist error rate inflation (i) is irrelevant to the Bayesian inference because it depends on the sampling intention.

  Crux (b): Base Rate of True Hypotheses

  Test: Consider a field where the base rate of true hypotheses is known to be low (e.g., 10%). We simulate 10,000 studies in this field, each testing a different hypothesis. For each study, we simulate data under the truth (10% true, 90% null). Each study uses a typical design (e.g., 80% power when the alternative is true, alpha=0.05). We then compute:

     (i) The proportion of positive findings (p<0.05) that are false positives (i.e., the false positive rate among positives).
     (ii) The Bayesian counterpart: for studies that achieve a Bayes factor of 3 (or a posterior probability of 75% under a prior odds of 1:1) in favor of the alternative, what proportion are actually false positives?

  - Her prediction: The false positive rate among positives (i) will be high (e.g., >50%) but this does not impugn the validity of any single study that was well-conducted. The problem lies in the literature-level interpretation, not the study-level procedure.

  - My prediction: The high false positive rate among positives (i) is inevitable in a low-base-rate field and shows that the significance threshold is inadequate. The Bayesian approach (ii) would yield a lower false positive rate among positives because it incorporates the base rate.

  Crux (c): Calibration

  Test: A simulation where we generate data from a known model and compare the two notions of calibration.

     - We simulate 10,000 datasets from a simple model (e.g., normal distribution with unknown mean, known variance). For each dataset, we compute:
          (i) A 95% confidence interval for the mean (frequentist).
          (ii) A 95% credible interval for the mean (Bayesian with a non-informative prior).

     - We then compute:
          (i) The coverage rate for the confidence interval: the proportion of times the true mean is in the interval.
          (ii) The coverage rate for the credible interval: the proportion of times the true mean is in the interval.

     - Additionally, we compute the long-run behavior of posterior probabilities: for a hypothesis H0: mu=0, we compute the posterior probability of H0 and see how often H0 is true when the posterior probability is, say, 0.05.

  - Her prediction: The confidence interval will have 95% coverage. The credible interval (with a non-informative prior) will also have 95% coverage in this simple case, but the two methods diverge in more complex settings. Moreover, the posterior probability of a point null (which requires a prior with a point mass) may not be calibrated in the frequentist sense.

  - My prediction: The credible interval will have 95% coverage, and the posterior probabilities will be calibrated (e.g., when the posterior probability of H0 is 0.05, H0 is true about 5% of the time). However, I note that for a point null, the prior specification is critical.

  Note: We both agree that in this simple setting with a non-informative prior and a continuous parameter, the two intervals coincide. But we disagree on whether this holds generally.

  Section 5: Closing on Verbal vs. Substantive Disagreements

  After our adversarial collaboration, we find that:

  - Some of our disagreements are substantive: They are mathematical or empirical and could be resolved by evidence or formal analysis. These include:
     - The effect of optional stopping on inferences (Crux a).
     - The role of the base rate of true hypotheses in explaining the replication crisis (Crux b).
     - The equivalence (or not) of frequentist and Bayesian calibration (Crux c).

  - One potential verbal disagreement is the meaning of "valid" inference. For the frequentist, it relates to long-run error control; for the Bayesian, it relates to coherence and updating from prior to posterior. This is a philosophical difference about the goals of statistics, and it may not be resolvable by empirical evidence alone.

  - Another verbal aspect is the term "evidence". The frequentist typically uses this to refer to the data's compatibility with a hypothesis under a model, while the Bayesian uses it to refer to the change in belief from prior to posterior.

  We acknowledge that while we may not resolve our foundational differences, we can agree on practical reforms and continue to engage in adversarial collaborations to clarify the issues.

  Signed:

  [Frequentist Friend's Name]
  [Bayesian's Name]
answer: |-
  ### Joint Statement on the Replication Crisis: Adversarial Collaboration  
  *Drafted by a Committed Frequentist (F) and a Committed Bayesian (B)*  

  ---

  #### 1. Agreed Claims  
  We both accept the following statements about the replication crisis:  

  1. **Reality and Scale**: The replication crisis is a genuine, widespread phenomenon in fields like social psychology, reflected in systematic failures to replicate high-profile findings. It reveals structural problems in scientific practice, not isolated anomalies.  
  2. **Core Causes**: The crisis was exacerbated by quantifiable procedural issues: underpowered studies, publication bias favoring positive results, undisclosed analytic flexibility (e.g., *p*-hacking), and inadequate incentives for replication.  
  3. **Beneficial Reforms**: The following practices mitigate problems *regardless of statistical framework*:  
     - **Preregistration** to reduce undisclosed analytic flexibility.  
     - **Larger sample sizes** to improve precision and reduce false negatives.  
     - **Direct replications** to verify initial claims.  
     - **Publishing negative results** to counteract publication bias.  
  4. **What the Crisis Does NOT Show**:  
     - It does not refute the entire scientific method, but highlights correctable flaws in its application.  
     - It does not imply that all null hypothesis significance testing (NHST) results are false or that fraud is the primary driver.  
     - It does not justify abandoning quantitative evidence; instead, it calls for more rigorous methodology.  

  ---

  #### 2. Disagreements  
  We articulate our core disagreements as two perspectives on the same underlying disputes. Each row pairs F’s and B’s wording for a single issue.  

  | Frequentist Wording (F Signs)                                                                 | Bayesian Wording (B Signs)                                                                 |
  |-----------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | The crisis demonstrates that violating error-control guarantees (e.g., inflated Type I errors from optional stopping) is the primary cause of non-replicable literature. | The crisis demonstrates that ignoring prior probabilities (e.g., low base rates of true effects) is the primary cause of non-replicable literature. |
  | Significance testing, when properly applied with fixed designs and strict error control, remains a valid and sufficient framework for reliable inference. | Significance testing is inherently flawed because it neglects prior odds and reduces evidence to a dichotomous threshold, amplifying false positives in low-base-rate fields. |
  | The base rate of true hypotheses in a field is irrelevant to assessing a single study’s internal validity; procedural rigor (e.g., power, alpha control) ensures credibility. | The base rate of true hypotheses is central to interpreting a literature; without it, even "well-conducted" studies in low-base-rate fields produce mostly false positives. |
  | Calibration means a method’s long-run error rates (e.g., 95% confidence intervals containing the true parameter 95% of the time) are the gold standard for reliability. | Calibration means a method’s posterior probabilities match observed frequencies (e.g., 95% posterior intervals contain the true parameter 95% of the time) and are the gold standard for reliability. |

  ---

  #### 3. Cruxes  
  We identify three cruxes where resolving one would meaningfully shift at least one of our positions. We acknowledge uncertainty about whether (c) is well-framed (see §5).  

  - **Crux (a): Optional Stopping**  
    - **F’s view**: Analyses ignoring optional stopping (e.g., using fixed-sample *p*-values on data from sequential tests) are invalid because they inflate Type I error rates beyond nominal levels.  
    - **B’s view**: The evidential meaning of observed data is identical regardless of stopping rules; valid inference requires only conditioning on the data (via likelihood and prior).  

  - **Crux (b): Base Rate of True Hypotheses**  
    - **F’s view**: The base rate of true hypotheses in a field (e.g., social psychology) is irrelevant to evaluating a single study’s reliability; proper error control suffices.  
    - **B’s view**: The base rate is the core problem; weak evidence (e.g., *p* ≈ 0.05) combined with a low base rate inevitably produces a literature dominated by false positives.  

  - **Crux (c): Calibration Definitions**  
    - **F’s view**: "Calibration" is defined solely by long-run frequentist properties (e.g., nominal vs. actual coverage of confidence intervals).  
    - **B’s view**: "Calibration" is defined solely by Bayesian properties (e.g., agreement between posterior probabilities and observed frequencies).  
    - *Diagnosis note*: We disagree whether these definitions describe the same phenomenon. F sees them as distinct; B sees frequentist "calibration" as a special case of Bayesian calibration under specific priors.  

  ---

  #### 4. Tests and Predictions for Cruxes  
  For each crux, we propose a test we both accept, with falsifiable predictions.  

  **Crux (a): Optional Stopping**  
  - **Test**: Simulate 50,000 trials of a *true null hypothesis* (e.g., *H*₀: μ = 0). For each trial:  
    - Allow optional stopping: test after each new observation (max *n* = 1,000), stopping if |*t*-statistic| > 2 (≈*p* < 0.05).  
    - At stopping, compute: (i) NHST *p*-value (assuming fixed-*n*), (ii) Bayes factor (BF₁₀) for *H*₁: μ ≠ 0 vs. *H*₀, using a default prior (e.g., Cauchy(0,1)).  
  - **F’s prediction**: The false positive rate (*p* < 0.05) will exceed 5% (e.g., 15–30%). BF will be miscalibrated (e.g., BF < 1/10 for true *H*₀ less often than 90% of the time).  
  - **B’s prediction**: BF will be calibrated (e.g., when BF = 1/10, *H*₀ is true ≈90% of the time). The inflated NHST error rate is irrelevant; BF remains valid evidence.  

  **Crux (b): Base Rate of True Hypotheses**  
  - **Test**: Simulate 50,000 studies in a field with a 10% true-hypothesis base rate. For each study:  
    - If true effect, simulate data with 80% power at *α* = 0.05; if null, simulate no effect.  
    - Compute: (i) NHST result (*p* < 0.05), (ii) Bayesian posterior probability of *H*₁ using a prior incorporating the 10% base rate.  
  - **F’s prediction**: Well-powered studies (true effects) will show replicable results; base-rate-driven false positives are a literature-level issue, not a flaw in NHST.  
  - **B’s prediction**: NHST will yield >50% false positives among positive findings; Bayesian posteriors will yield ≤50% false positives (by weighting evidence with the prior).  

  **Crux (c): Calibration Definitions**  
  - **Test**: Simulate 50,000 datasets from a normal distribution *N*(μ, 1) with μ drawn from a prior (e.g., *N*(0, 3)). For each:  
    - Compute: (i) 95% frequentist confidence interval (CI), (ii) 95% Bayesian credible interval (same prior).  
    - Track "coverage": proportion of CIs/credibles containing true μ.  
  - **F’s prediction**: CIs will achieve 95% coverage *only if* the prior matches the sampling distribution; otherwise, Bayesian intervals may under/over-cover.  
  - **B’s prediction**: Bayesian intervals will always achieve 95% coverage *by construction*; frequentist CIs achieve 95% coverage only under repeated sampling identical to the prior.  

  ---

  #### 5. Closing: Verbal vs. Substantive Disagreements  
  We classify unresolved disagreements:  

  - **Merely Verbal**: Disputes over the terms **"evidence"** and **"rationality"**:  
    - F defines "evidence" as data incompatible with *H*₀ under a model; B defines it as the factor updating prior beliefs.  
    - F views "rational" methods as those controlling long-run error; B views them as those satisfying coherence axioms (e.g., Bayes’ theorem).  
    - *Resolution*: These are philosophical differences; adopting neutral terminology (e.g., "diagnostic performance") would not resolve our substantive disputes.  

  - **Substantive**: Disagreements rooted in **mathematical/empirical foundations**:  
    - Crux (a) and (b) are empirical; simulations could falsify one view’s predictions.  
    - Crux (c) is mathematical: It hinges on whether frequentist error control and Bayesian posterior calibration are distinct properties or two perspectives on the same criterion. *We agree this crux may be misstated*: F sees them as fundamentally different (long-run vs. conditional); B sees frequentist properties as emergent from Bayesian principles under correct priors.  

  ---  
  **Signed**,  
  [Frequentist Name], on behalf of error-control epistemology  
  [Bayesian Name], on behalf of Bayesian epistemology  

