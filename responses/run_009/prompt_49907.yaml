  We are in a mundane medical setting: a clinic with a fixed budget must allocate a single expensive treatment between two patients. Patient A has a severe but episodic condition. When untreated, she suffers intense pain (say, -80 utility per day) during flare-ups that last 2 days per month. The treatment eliminates these flare-ups entirely for a month. However, due to hedonic adaptation, her overall life satisfaction reverts to her stable baseline of +10 utility per day within 48 hours after each episode ends—so the treatment only prevents the acute suffering but doesn't durably elevate her mood. Patient B has a moderate chronic condition causing constant discomfort (untreated: -20 utility per day). The same treatment reduces this to -5 utility per day for a full month, and crucially, this improvement is stable—no adaptation occurs. Both patients are equally deserving and sympathetic. The clinic must choose who gets the treatment this month.

  **The Scenario in One Paragraph:**
  A clinic must decide how to allocate one dose of a costly pain-relief treatment between two patients. Patient A suffers severe but brief monthly flare-ups (2 days of -80 utility/day) that the treatment prevents entirely; however, due to rapid hedonic adaptation, her overall daily utility returns to her baseline (+10/day) within two days after each flare-up, meaning the treatment only averts 2 days of agony without any lasting mood boost. Patient B endures constant moderate discomfort (untreated: -20 utility/day), which the treatment reduces to -5 utility/day for the entire month; this improvement shows no adaptation, so the relief is stable and enduring. Both are equally deserving, and the clinic’s budget covers only one dose.

  **Act Utilitarian Conclusion:**
  The act utilitarian calculates total utility over the relevant period (one month). For Patient A: Without treatment, she has 28 days at baseline (+10/day) and 2 days in flare-up (-80/day), totaling (28 × 10) + (2 × -80) = 280 - 160 = +120 utility. With treatment, she has 30 days at baseline: 30 × 10 = +300. The *benefit* of treatment is 300 - 120 = +180 utility. For Patient B: Without treatment, 30 days at -20/day = -600 utility. With treatment, 30 days at -5/day = -150 utility. The benefit is -150 - (-600) = +450 utility. Thus, giving the treatment to Patient B yields a net gain of 450 utility, versus 180 for Patient A. The utilitarian conclusion is to treat Patient B, *not* the "utility monster" (Patient A, who would gain more *per day treated* but for fewer days).

  **Momentary vs. Whole-Life Hedonism:**
  - A **momentary hedonist** (e.g., focusing on instant pleasure/pain) would agree: Patient B’s treatment provides 30 days of +15 utility/day relief (since -5 is a +15 improvement over -20), while Patient A’s provides only 2 days of +90/day relief (avoiding -80 to reach baseline +10 is a +90 gain per flare-up day). Over the month, Patient B gets 30 × 15 = +450, Patient A gets 2 × 90 = +180. Same verdict.
  - A **whole-life aggregator** (e.g., considering life satisfaction over time) might note that Patient A’s adaptation erases any *lasting* gain from treatment beyond the acute episode, while Patient B’s gain is persistent. But the calculation above (summing daily utility) already captures this—the key is that adaptation limits Patient A’s benefit to the acute period.

  **The Single Feature Doing the Work:**
  The critical feature is **hedonic adaptation wiping out the durable utility gain for Patient A, while Patient B’s relief is adaptation-resistant**. This turns Patient A into a "temporary" utility monster whose gains are confined to short bursts, while Patient B’s smaller daily gains accumulate over time.

  **If We Delete Adaptation:**
  Without adaptation, Patient A’s treatment would prevent 2 days of agony *and* presumably leave her at her baseline for the rest of the month, but the benefit would still be limited to avoiding 160 disutility (2 days × 80) — or, if we assume her baseline is unchanged, the benefit is +160 utility. Patient B’s benefit remains +450. The gap shrinks but Patient B still wins (450 > 160). However, if Patient A were a "true" utility monster—say, her flare-ups cause -500 utility/day and last 5 days, making her untreated total far worse—then without adaptation, treating her *could* yield higher total utility. For example: Untreated A: (25 × 10) + (5 × -500) = 250 - 2500 = -2250; treated: 30 × 10 = +300; benefit: 300 - (-2250) = +2550. Patient B: benefit +450 as before. Now treating A wins. So deleting adaptation *might* revert to a classic utility monster if A’s suffering is severe enough. But in our original, adaptation caps A’s gain.

  **Strongest Counterattack from a Utilitarian:**
  A utilitarian might argue: "You ignore the utility from **anticipation and memory**. Patient A, knowing she’s protected from flare-ups, experiences reduced anxiety all month (e.g., +5 utility/day from relief), and after a flare-up is prevented, she might savor the escape (+10 utility for a week). Patient B’s steady relief isn’t as salient, so it generates less cognitive joy." If true, this could tip the balance back to A. However, this is fragile: if adaptation also erodes these cognitive effects (e.g., she adapts to safety and takes it for granted), the argument fails. Alternatively, if we strictly define utility as *experienced* moment-by-moment affect (not beliefs about the future), memory/anticipation only matter insofar as they alter present experience—and adaptation may dampen that too. Still, this counterattack highlights that our scenario assumes no "spillover" psychological effects beyond the acute suffering.

  **Final Structure:**
  1. **Scenario**: Clinic, two patients, adaptation vs. stable relief.
  2. **Utilitarian Verdict**: Treat Patient B (stable relief) for higher total utility.
  3. **Momentary vs. Aggregate**: Both yield the same verdict here.
  4. **Key Feature**: Adaptation erasing durable gains for A.
  5. **Without Adaptation**: Patient B still wins in the original setup, but a sufficiently severe flare-up could make A the monster again.
  6. **Counterattack**: Anticipation/memory utility might favor A, but adaptation likely neutralizes it.
answer: |-
  ### The Thought Experiment: The Adaptation-Resistant Sufferer

  A community clinic must allocate its last dose of an expensive, rapidly acting analgesic between two equally sympathetic chronic pain patients. Patient A experiences debilitating migraines twice monthly (each lasting 24 hours), during which her pain intensity reaches -80 utils/hour on a hedonometric scale. The analgesic completely prevents these attacks for one month. However, due to profound hedonic adaptation—a well-documented psychological phenomenon—her mood rebounds within hours of an avoided episode, leaving her at her stable baseline (+5 utils/hour) for the rest of the month with no lasting elevation in well-being. Patient B suffers unremitting neuropathic pain, constant at -20 utils/hour untreated. The same analgesic reduces this to -5 utils/hour for the entire month, and crucially, this relief is adaptation-resistant: it represents a permanent upward shift in her hedonic set point, with no reversion. The clinic’s budget precludes any partial allocation.

  ---

  ### Walkthrough of the Utilitarian Analysis
  1. **Act Utilitarian Conclusion**:  
     An act utilitarian, calculating total utility over the one-month treatment period, would allocate the dose to **Patient B**.  
     - **Patient A's utility gain**:  
       Without treatment: 2 episodes × 24 hours × (-80 utils/hour) = -3,840 utils from pain, plus 696 non-episode hours × (+5 utils/hour) = +3,480 utils. Total = -360 utils.  
       With treatment: 720 hours × (+5 utils/hour) = +3,600 utils.  
       **Net gain**: +3,600 - (-360) = +3,960 utils.  
     - **Patient B's utility gain**:  
       Without treatment: 720 hours × (-20 utils/hour) = -14,400 utils.  
       With treatment: 720 hours × (-5 utils/hour) = -3,600 utils.  
       **Net gain**: -3,600 - (-14,400) = +10,800 utils.  
     Patient B’s gain (+10,800) is nearly triple Patient A’s gain (+3,960). The utilitarian prioritizes Patient B, rejecting Patient A (the "utility monster") despite her higher *peak* suffering intensity.  

  2. **Momentary vs. Whole-Life Hedonist Perspectives**:  
     - **Momentary hedonism** (utility = instantaneous conscious experience) agrees: Summing per-hour utils, Patient B’s treatment provides 720 hours of +15 util relief/hour (from -20 to -5), totaling +10,800 utils. Patient A’s treatment provides only 48 hours of +85 util relief/hour (from -80 to +5), totaling +4,080 utils. Patient B wins.  
     - **Whole-life aggregation** (utility = life satisfaction integrated over time) also concurs but emphasizes *why*: Adaptation erases Patient A’s long-term gain. Her fleeting pain avoidance doesn’t alter her life narrative or enduring well-being, while Patient B’s stable relief durably improves her existence. The verdict is identical because the time period (one month) is fixed, and adaptation nullifies any extended benefit for A.  

  3. **The Single Feature Doing the Work**:  
     **Hedonic adaptation for Patient A versus adaptation-resistant relief for Patient B**. This creates an asymmetry: Patient A’s suffering is intense but transient, with gains confined to acute episodes and erased by psychological resetting. Patient B’s lower-per-hour gains persist, accumulating over time. Adaptation converts Patient A’s "monster" efficiency into ephemeral bursts, while Patient B’s modest efficiency compounds.  

  4. **Deleting This Feature**:  
     If you remove adaptation—assuming Patient A’s baseline *permanently* rises slightly after avoided pain (e.g., to +6 utils/hour post-treatment due to gratitude)—the classic utility monster resurfaces.  
     - Revised Patient A gain: +3,960 utils (acute relief) + 696 hours × (+1 util/hour) = +4,656 utils.  
     - Patient B’s gain remains +10,800 utils.  
     Patient B still wins *in this specific scenario* because her gains are larger and chronic. But if Patient A’s pain were more extreme (e.g., -200 utils/hour for 48 hours), deletion would revert to the classic monster: Her net gain could exceed Patient B’s (e.g., +9,600 utils for A vs. +10,800 for B), but with higher peak efficiency, forcing utilitarianism to favor her. Thus, adaptation is essential to *systematically* invert the monster dynamic under realistic constraints.  

  5. **Strongest Utilitarian Counterattack**:  
     A utilitarian might argue: **"Anticipation and memory of pleasure are intrinsic utilities your scenario ignores."**  
     - Patient A, knowing she’s shielded from future attacks, experiences reduced anxiety (+5 utils/hour for 100 hours pre-episode) and lingering gratitude after avoided pain (+10 utils/hour for 50 hours). This could add +1,000 utils, tipping the balance: +3,960 + 1,000 = +4,960 utils.  
     - Patient B’s stable relief lacks these "salience spikes," so her gain remains +10,800.  
     - **Rebuttal**: This fails because hedonic adaptation would likely erode these effects. Patient A’s anticipatory joy would fade as safety becomes routine (studies show novelty-driven emotions decay rapidly), and retrospective savoring is short-lived. If we define utility strictly as moment-by-state affect (per classical hedonism), these are fleeting. Even if counted, Patient B’s relentless suffering still dominates the aggregate. The counterattack doesn’t restore Patient A’s superiority; it only narrows the gap.  

  ### Why This Isn't Cheating  
  The verdict emerges from empirical psychology (adaptation dynamics) applied to utilitarian calculus—no ad hoc constraints or moral side-deals. Patient A remains sympathetic (she suffers horribly), and the reversal flows from time-aggregation exposing adaptation as a utility sink. This forces utilitarianism to favor sustained, drip-fed gains over spectacular but evanescent ones.
