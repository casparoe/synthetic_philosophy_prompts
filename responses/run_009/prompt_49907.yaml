prompt: |-
  hey, I need a thought experiment built to spec, and the spec runs kind of backwards. everyone knows the utility monster — a being that converts resources into welfare more efficiently than anyone else, so utilitarianism says funnel everything to it, which everyone hates. What I want is the reverse: a case where hedonistic utilitarianism, reasoning perfectly correctly from its own premises, concludes that you should NOT give the resources to the utility monster. Not because the monster is undeserving or evil — keep it sympathetic — and not because of some side constraint a utilitarian wouldn't recognize. It has to come from a realistic mechanism you build into the scenario: the monster's gains get eaten by hedonic adaptation while everyone else's don't (think a person whose mood spikes and then snaps back to baseline vs. someone who gets smaller but genuinely durable relief). Constraints: the monster is an ordinary human, zero sci-fi, set it somewhere mundane like a clinic splitting a fixed budget between two patients, and the scenario itself should be one paragraph. Also no cheating — you can't just stipulate "and total utility comes out higher the other way"; the verdict has to fall out of the psychology you describe plus the utilitarian calculus, which means you'll have to think about timescales (is utility momentary pleasure or a whole-life aggregate? adaptation is mostly a problem for the second one).

  after the scenario: walk through what the act utilitarian concludes, say whether a hedonist who only cares about momentary experience would judge the case differently from one who aggregates over whole lives, identify which single feature of the case is doing the work, and then tell me what happens if you delete that feature — does it collapse straight back into the classic utility monster? finish with the strongest counterattack from a utilitarian who thinks the case is rigged, e.g. can they count memory and anticipation of pleasure as utility that an adaptation story overlooks? thx
