prompt: |-
  In discussions of the Kosovo war and the 2011 Libya intervention, a colleague of mine defends a picture she thinks of as surgical: a sovereign state is like a patient, its borders like skin, and the Security Council like the hospital board that alone can authorize cutting. On her view, humanitarian intervention without that authorization resembles operating without consent — it may occasionally save the patient, but it is battery all the same. So far, so arguable. What interests me is that she then draws two further, more specific conclusions from the same picture. First, she says, humanitarian intervention is like surgery in that half-measures are the worst option: a no-fly zone is like excising part of a tumor and sewing the patient back up — having crossed the skin, you are committed to removing the whole growth, which means regime change; so the real menu in each crisis is all or nothing. Second, the intervening coalition is like the surgical team: once it has operated, it owes the patient postoperative care and owns the complications (civil war, state collapse), so something like the Iraq occupation was not an optional afterthought but an entailment of the original authorization. My own suspicion is that the first conclusion is the one she actually wants and the second is baggage the analogy smuggles in, but I cannot cleanly separate the parts of the picture that carry weight from the parts that merely comfort.

  Could you set out the correspondence table — what plays the role of the patient, the skin, the consent, the tumor, the surgeon, and the postoperative complication — then mark where each mapping breaks down? Please distinguish the disanalogies that matter for her two conclusions from the ones that don't (a table may lump everything together, but not every failed mapping sinks every conclusion). Then assess which, if either, of her conclusions survives once the disanalogies are on the table: is there any way to keep the duty of postwar care while rejecting the all-or-nothing claim, or do they stand and fall together? And if some nearby analogy does the work better — mechanic, gardener, bystander, firefighter — say what it would change about each conclusion. End with a final line in the form "Verdict: all-or-nothing [survives / survives with repairs / fails]; duty of care [survives / survives with repairs / fails]".
reasoning: |-
  Okay, let me approach this methodically. The colleague's medical analogy for humanitarian intervention is intricate and needs careful unpacking. The core components map as follows: sovereign state=patient, borders=skin, Security Council=hospital board, humanitarian intervention=surgery, oppressive regime=tumor, intervening coalition=surgical team, and postwar consequences=postoperative complications.

  Hmm, the first conclusion about "all-or-nothing" interventions seems particularly strained when examined. States aren't biological organisms where partial treatment guarantees metastasis - sanctions or no-fly zones can contain harm without full regime change. And unlike tumors, regimes aren't always unitary threats; their components may respond differently to calibrated pressure.

  The postoperative care argument holds better initially - there's a real moral responsibility for unintended consequences. But the analogy overreaches by making occupiers sole owners of complications. Realistically, local actors and global systems share responsibility in ways surgical teams don't.

  Interesting how the metaphor smuggles in assumptions: medical absolutism about "skin violation" ignores how sovereignty isn't sacrosanct during atrocities. Also, the surgical team's control is total whereas interveners operate in dynamic political ecosystems.

  Perhaps a firefighter analogy works better? Putting out part of a blaze (limited intervention) is still valuable, and while firefighters should minimize water damage (collateral harm), they don't rebuild the house (nation-building). This reframes both conclusions: partial intervention becomes viable, and responsibility shifts from "ownership" of consequences to mitigation of immediate harm.

  The verdict crystallizes after this: the all-or-nothing claim fails completely under scrutiny, while the duty of care survives but needs serious repairs - it's an obligation to assist, not an ownership of outcomes.
answer: |-
  Here's the correspondence table, analysis of disanalogies, and verdict on the colleague's conclusions:

  ### Correspondence Table
  | Medical Term       | Intervention Analogue         | Supports Conclusion(s)       |
  |--------------------|-------------------------------|------------------------------|
  | **Patient**        | Sovereign state               | Both (core concept)          |
  | **Skin**           | State borders                | All-or-nothing (key premise) |
  | **Hospital Board** | UN Security Council          | Both (authority source)      |
  | **Surgery**        | Humanitarian intervention     | Both                         |
  | **Tumor**          | Oppressive regime/threat     | All-or-nothing               |
  | **Surgeon/Team**   | Intervening coalition         | Duty of care                 |
  | **Complications**  | Civil war/state collapse      | Duty of care                 |
  | **Consent**        | SC authorization             | Both (moral/legal basis)     |

  ### Critical Disanalogies & Impact on Conclusions
  **1. All-or-Nothing Conclusion Breakdown**  
  - **Fatal Disanalogies**:  
    • *Skin ≠ Borders*: Borders are permeable legal constructs, not biological barriers. Partial interventions (no-fly zones, sanctions) can *contain* harm without "metastasis."  
    • *Tumor ≠ Regime*: Regimes aren't unitary pathological entities; components (military, bureaucrats) may defect or reform under pressure.  
    • *Surgery ≠ Intervention*: Military actions are modular (e.g., Libya's no-fly zone initially protected civilians without regime change).  
    *→ Sinks all-or-nothing claim*: Real-world options exist between doing nothing and full invasion.  

  **2. Duty-of-Care Conclusion Breakdown**  
  - **Supportive Analogy**:  
    • *Complications ∝ Consequences*: Interveners *do* create moral responsibility for blowback (e.g., post-Gaddafi chaos).  
  - **Fatal Disanalogies**:  
    • *Surgeon ≠ Coalition*: Surgeons control the operating room; coalitions lack total control over political ecosystems.  
    • *Post-Op Care ≠ Occupation*: Medical aftercare is standardized; political "recovery" lacks objective metrics and depends on local actors.  
    • *Patient Consent ≠ SC Authorization*: States aren't unconscious patients; local agency matters post-intervention.  
    *→ Weakens but doesn't sink duty of care*: Responsibility exists but isn't absolute "ownership."  

  ### Can Duty of Care Survive Without All-or-Nothing?
  **Yes**, with three repairs:  
  1. **Scale of Responsibility**: Duty scales to *degree of harm caused*, not full ownership (e.g., interveners fund stabilization but don't owe full occupation).  
  2. **Shared Burden**: "Complications" are shared with local/global actors (unlike surgical outcomes).  
  3. **Contingency**: Duty applies only where intervention *directly caused* collapse (e.g., Libya) not where collapse was inevitable (e.g., Syria).  

  ### Better Analogies & Their Implications  
  | **Analogy** | **Changes to All-or-Nothing**               | **Changes to Duty of Care**               |  
  |-------------|--------------------------------------------|-------------------------------------------|  
  | **Firefighter** | Partial actions viable (e.g., containing part of a blaze) | Duty to minimize water damage, not rebuild the house |  
  | **Bystander**   | No inherent "all-in" logic                  | Limited duty (e.g., call ambulance ≠ pay hospital bills) |  
  | **Mechanic**    | Repairing one part doesn't require engine overhaul | Liability for new damage caused during repairs |  
  *Firefighter best preserves limited-duty logic without demanding regime change.*

  ### Verdict  
  **All-or-nothing fails; duty of care survives with repairs.**  

  The medical analogy's biological determinism (skin/tumor) fatally overrides the political realities of modular statecraft. However, the *moral insight* about responsibility for foreseeable chaos persists if recalibrated as a *proportional obligation to mitigate harm caused* — distinct from "owning" outcomes. The two conclusions are separable: rejecting surgical inevitability doesn't absolve interveners of cleanup duties where they triggered collapse.
