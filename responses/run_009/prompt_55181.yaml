  First, I need to explain why the lottery example is problematic for the knowledge norm. The knowledge norm says you should only assert something if you know it's true. But with a lottery ticket that has very low odds of winning, it seems reasonable to say you know it will lose. Yet asserting "My ticket will lose" feels wrong. Why? Because even with high probability, you don't actually know the outcome until it's drawn. So the knowledge norm would say you can't assert it, but intuitively, it seems like you should be able to—that's the tension.

