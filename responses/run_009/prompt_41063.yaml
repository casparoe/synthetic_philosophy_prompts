answer: |-
  ### The view, stated so it can fail  
  Strong computationalism asserts that the brain *literally* implements a specific computational formalism (e.g., Turing machine, finite automaton, probabilistic graphical model) with observer-independent, causally efficacious discrete states and transitions. These states encode structured representations (e.g., symbols, vectors, Bayesian beliefs) that are physically instantiated in neural activity, such that the brain’s cognitive operations are identical to formal computational operations over these representations. Crucially, there exists a unique, maximally accurate description of *which* computations are implemented, determined by the brain’s causal structure, not our interpretive choices. If true, neuroscience could—in principle—discover this "ground truth" formalism and its representational code, resolving disputes like "Does visual cortex compute Bayesian inference or dynamical attractors?" objectively.

  ### What would count against it, ranked  
  **(1) Fatal: Implementation triviality undermining causal specificity**  
  Putnam/Searle objections aren’t dismissed by counterfactuals alone. If neural dynamics are sufficiently noisy, chaotic, and continuous, they may lack stable, discrete state transitions required for non-arbitrary computation assignment. *Why fatal?* If every physical system (e.g., a wall) can be mapped to *any* computation via gerrymandered state divisions, then the brain’s "specific" computation is merely a descriptive choice. Your causal-structure reply *relocates* the problem: What constitutes "the right" counterfactuals in a system where noise overwhelms discrete transitions, neuromodulators reconfigure circuitry on-the-fly, and activity is intrinsically analogue? If no grain of description yields stable, counterfactual-supporting state machines *except* by ignoring biological messiness, computationalism collapses into instrumentalism.  

  **(2) Serious: Biological continuity defying discrete formalization**  
  Brains use analogue graded potentials, rely on spike-timing precision (not just rates), and employ diffuse neuromodulation that continuously reshapes network properties. If cognition depends on these continuous, non-decomposable variables (e.g., phase relationships in oscillatory activity), not discretizable "states," formal computation lacks ontological footing. *Why serious?* Unlike digital circuits, neurons exhibit mixed analog/digital signaling. If "representations" are smeared across populations via continuous dynamics (e.g., attractor manifolds), with no natural digitization threshold, the brain may be better modeled as a dynamical system *sui generis*. Computationalism then survives only by discretizing at an arbitrary scale, violating its "literal implementation" claim.  

  **(3) Awkward: Gödelian arguments**  
  Penrose-style claims that human mathematicians "see" the truth of unprovable Gödel sentences, transcending any formal system, don’t hold up. Humans commit arithmetic errors, overlook consequences, and lack access to infallible mathematical intuition. *Why merely awkward?* Gödel’s theorems constrain *consistent* formal systems, but human cognition is inconsistent, resource-limited, and embodied. We outrun *specific* algorithms via heuristic search, not oracle-like powers. This objection confuses competence with performance and ignores that human "insight" may emerge from complex computational processes we don’t yet understand.  

  **(4) Serious: Insulation via redefinition**  
  Computationalism evolved from symbolic AI (discrete symbols) to connectionism (distributed patterns) to predictive processing (Bayesian belief updating). Each shift accommodates new data by expanding "computation" to include analog processes, blurring boundaries with dynamical systems. *Why serious?* If every physical process can be called "computational" (e.g., "the weather computes its own evolution"), the thesis risks vacuity. It must avoid becoming a "nothing buttery" (the brain is *nothing but* computation) that swallows all rivals. Salvaging it requires clear criteria for when a system *fails* to implement computation—e.g., lacking representational states or program-controlled transitions.  

  ### What I should concede versus dismiss  
  **Concede:**  
  - If core cognitive processes (e.g., perception, memory recall) demonstrably rely on continuous, non-decomposable variables (e.g., precise spike timing or global neuromodulatory states) that cannot be digitized without catastrophic information loss, this *directly* undermines the discrete-state requirement.  
  - If Putnam-style mappings *are* the best description of neural activity—meaning no privileged causal grain exists where counterfactuals align cleanly with a single formalism—your view reduces to instrumentalism.  
  - Computationalism *must* provide falsification criteria, e.g., identifying neural processes that *cannot* be described as state transitions over representations without arbitrariness.  

  **Dismiss:**  
  - Gödelian objections: Human mathematical "insight" is empirically error-prone and likely emergent from computational processes. This confuses metaphysics with performance limits.  
  - "Brains aren’t digital" straw men: Strong computationalism doesn’t require *binary* switches or synchronous clocks (see analog neural networks or reservoir computing). What matters is whether variables *function* as discrete states.  
  - "Dynamics are primary" claims: Computation is a functional, not material, category. Dynamical systems *can* implement computations; the dispute is whether they do so *literally* with stable, intrinsic representations.  

  ### Is the view insulated, and does it matter?  
  Yes, computationalism is often insulated by redefinition (e.g., rebranding continuous dynamics as "real-valued computation"), but this *matters critically*. While research programs legitimately refine concepts (e.g., generalizing "computation" beyond Turing machines), ad hoc expansions risk making the thesis unfalsifiable. The defense—"computation is whatever solves an information-processing problem"—must exclude triviality (e.g., rocks "computing” erosion). To avoid vacuity, insist that genuine implementation requires:  
  1. **Non-arbitrary state individuation** (states correspond to physical distinctions that cause behavior),  
  2. **Program-control** (transition rules are causally efficacious, not just descriptive), and  
  3. **Representational content** (states bear information for the system).  
  If predictive processing or connectionism meets these, it’s legitimate evolution. If not, it’s insulation—a defect that invites dismissal as non-empirical. Your burden is to show neuroscience *converges* on a specific computational architecture *because* the brain constrains it, not because we’re clever modelers.
