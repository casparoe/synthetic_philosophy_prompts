  Combining these: Multiplying gives 0.95 * 0.85 * 0.75 * 0.8 ≈ 0.485, but that's too low. Need to consider dependencies. The sociology part might be less critical if others like Poincaré were close. Adjusting, maybe 0.7 overall? Wait, the user's editor has credence 0.75 vs. 0.3. The big disagreement might be on whether internal tensions alone were sufficient without Michelson-Morley. The editor who thinks 0.3 might believe the experiment was crucial to motivate abandoning ether.

  Sensitivity: Most sensitive to the internal tensions probability. Historical evidence like Poincaré's 1904 lecture shows he was near the breakthrough. If more of his private notes revealed reluctance without experimental data, that could lower the probability.

  Generalization: Special relativity had multiple contributors, unlike natural selection, which was more unique to Darwin/Wallace. Plate tectonics had more empirical data. So the "overdue" frame works better for theory-heavy, math-driven fields with existing conceptual tools.

