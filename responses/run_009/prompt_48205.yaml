answer: |-
  Here’s a draft proposal in plain prose, aiming for clarity and practicality:

  As someone with a software engineering background reading about AI alignment, I’ve noticed a persistent tension: the field often frames "the alignment problem" as a monolithic challenge, yet my discipline teaches that complex systems demand decomposition. We rigorously separate requirements gathering (what *should* the system do?), verification (does the built system *actually* meet those specs?), and maintenance (does it keep working when the world changes?). I suspect alignment debates suffer because participants conflate these layers—one person argues about ethical goal-setting, another about detecting treacherous turn precursors, and a third about robustness to distributional shift—all calling it "alignment" while talking past each other. My proposal aims to test whether this decomposition is a meaningful lens or just a strained metaphor.

  If alignment is truly indivisible, efforts to solve it holistically are well-founded. But if it decomposes, our current framing might misdirect research. For example, pouring resources into novel agent architectures (a "solution" often proposed) could be futile if the core failure mode is in goal specification or runtime monitoring. Conversely, if the decomposition holds, we’d expect distinct research priorities: "Requirements" demands philosophy/politics (e.g., value democratization), "Verification" needs interpretability/formal methods (e.g., proof-producing systems), and "Maintenance" requires anomaly detection/online oversight (e.g., drift monitoring). The risk is that we’re under-investing in critical subproblems because they’re buried under a single label.

  To test this, I’d spend three months part-time: First, systematically cataloging prominent alignment papers, proposals, and failures, tagging each according to which layer they primarily address (requirements, verification, maintenance). The goal isn’t to force-fit but to see if natural clusters emerge. Second, analyzing historical alignment failures (e.g., deceptive RL agents, reward hacking cases, bias escalations) to dissect their root causes: Did the system pursue unintended goals (requirements failure)? Could operators not detect misalignment pre-deployment (verification failure)? Or did it break post-deployment despite initial correctness (maintenance failure)? Finally, stress-testing the decomposition by seeking cases that inherently span all layers—if *every* major failure involves inseparable interactions (e.g., specification ambiguity *causing* unverifiability *causing* drift vulnerability), the decomposition fails. If distinct patterns emerge, it holds practical value.

  Success means demonstrating that the decomposition clarifies debate, predicts research gaps (e.g., "maintenance" is understudied), or reveals that proposed "solutions" only address one layer. Failure means finding that alignment failures are intrinsically entangled—no clean separation exists, and interventions must target the unified problem. Practically, this matters because it could redirect effort: If verification is the bottleneck, we might prioritize runtime monitors over new training paradigms; if requirements dominate, we’d focus on scalable oversight. Even a negative result sharpens our understanding by forcing the field to defend—or abandon—the assumption of monolithic difficulty. By treating alignment like the engineering challenge it is, we might find it’s not one unsolvable problem, but three very hard ones—and that changes where we point our tools.

  ---

