  I'm a software engineer whose been reading about AI alignment on and off for a couple years, no philosophy background. I've got a half-formed idea I want to turn into a proposal for a small research grant (3 months of part-time work, nothing fancy). The idea: people argue about "the alignment problem" as if it's one thing, but in software we'd never get away with that -- we split getting the requirements right from building a system that actually meets them from keeping it working when conditions drift. My suspicion is that a lot of the alignment debate is people talking past each other because one person means the requirements problem (who decides what we want from AI, and is that even coherent), another means the verification problem (how would you know the system you built actually does what was specified), and a third means something like the maintenance problem (systems that behave well under training conditions and drift once deployed). I want the proposal to state precisely whether this decomposition is real or just a strained analogy, why the standard framing of one problem with many proposed solutions leaves that question open, what I'd actually do month by month to test whether the decomposition carves the problem at its joints or just relabels it, and what would count as the project failing (e.g. if every concrete alignment failure turns out to involve all three pieces at once in a way that can't be pulled apart). It should also say why this matters practically -- like whether the answer would change what research should get done. No citations, I'll fill those in myself. Please write it as plain continuous prose, no headings or bullet points, like a long email, maybe 500 words.
