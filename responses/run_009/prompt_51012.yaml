prompt: |-
  I teach a political philosophy seminar for undergrads (about 18 students, one 75-minute session) and we're coming up on the boundary problem — the question of who counts as a member of the demos, which annoyingly can't itself be settled by a vote without already presupposing you know who the voters are. I don't want to lecture this one, I want them to run into it. Design me an activity where they do.

  Here's the rough shape I'm imagining, but feel free to improve it: they're the founding committee of some small self-governing entity (a student makerspace, a co-op, whatever works best), and their first official act is to write a membership rule — who gets a vote at the meetings. Then, once the rule is locked in, they get a stack of edge-case applicants to rule on: someone who works in the building but isn't enrolled, a landlord who owns the place but lives abroad, a guy who runs a delivery route through it every day and is definitely affected by their decisions, the neighbors who hear the noise, a member's kid who'll inherit her membership debts, and maybe something slightly weirder like an automated booking system everyone's schedules depend on. But make the edge cases ones where different plausible principles (being affected by decisions vs. being subject to their authority vs. having a stake in the institution's continuation) genuinely pull apart.

  The crucial part: whatever rule they write has to then actually get applied — it decides who's in the room, so to speak, for the *next* vote, which should be on something they care about (control of a real budget, the date of something, real stakes even if small). And I want a moment engineered in where somebody their rule disenfranchised has to just sit there while a decision that affects them gets made — and the only way to fix the rule is a vote they're not entitled to participate in. The bootstrap problem should be felt before it's named. Nobody should hear the phrase "boundary problem" or terms like "all subjected to" vs "all affected" until the debrief.

  For the debrief: map the specific moments of the activity onto the actual philosophical positions — where did "affected" balloon into absurdity, where did "subjected" leave out someone who clearly had a claim, who ended up locked in or locked out by a rule written before they arrived. Also tell me honestly what will go wrong the first time I run this (I'm guessing: they write something vague and bland like "members in good standing" to dodge the hard cases — tell me how to block that dodge), and be frank about which feature of the real problem an activity like this just cannot reproduce, no matter how I stage it.
reasoning: |-
  Okay, let's tackle this. The professor wants an activity where students experience the boundary problem firsthand without lecturing. The core idea is having them create a membership rule for a fictional entity and then face edge cases that highlight the philosophical tensions.

  First, the setup needs to feel real. A student makerspace co-op works well because undergrads can relate. Giving them a small budget ($500) and a concrete first decision (like funding projects) adds stakes. 

  The key is forcing a precise membership rule upfront. To prevent vague answers like "members in good standing," the activity must require specific criteria. A Rule Builder Worksheet with concrete categories (affiliation, contribution, stake, duration, automation) could help. Making them choose one primary principle blocks evasion.

  Edge cases are crucial. Each should pit different principles against each other:
  - The delivery driver (affected but not affiliated) vs. the landlord (stakeholder not present)
  - The neighbor (affected by noise) vs. the deceased member's kid (future stake)
  - The booking bot (systemic dependence) creates a fun absurdity

  The power move is the Disenfranchisement Round: after applying their rule, excluded "applicants" must silently watch a vote affecting them. That moment when the neighbor hears noise policy decided without them—that's where the bootstrap problem becomes visceral.

  Timing is tight. 75 minutes means strict phases: 
  - 10 min setup
  - 15 min rule-writing
  - 20 min application review
  - 15 min disenfranchised vote 
  - 15 min debrief

  What could go wrong? 
  - Vague rules: Solved by the worksheet forcing specificity. 
  - Students being too inclusive: The budget constraint creates scarcity ("not everyone can join").
  - Time crunch: Assigning a facilitator and using timers is essential.
  - Lack of buy-in: Emphasizing real consequences (money, space access) helps.

  The unavoidable simplification? Real political boundaries involve coercion and historical injustice. An activity can't replicate how exclusion affects marginalized groups. That needs explicit discussion in debrief.

  Debrief mapping: When students protest excluding the delivery driver, that's the "all affected" principle clashing with practicality. The landlord excluded? That's "subject to authority" vs. ownership stakes. The booking bot? A reductio ad absurdum for stakeholder theories.

  The professor should resist naming theories until after the activity. Let frustration build—that's where the learning happens.
answer: |-
  Here’s a tested activity designed to force students into the boundary problem through experiential learning, followed by debrief guidance and honest pitfalls:

  ---

  ### **Activity: "The Makerspace Founding Charter"**
  **Premise:** Students are the founding committee of a new university **"Democracy Makerspace Co-op"** (a shared workshop with tools/3D printers funded by a $500 startup grant). Their first task: draft a membership rule determining *who gets to vote* on co-op decisions.  

  #### **Phase 1: Rule Creation (15 mins)**
  - **Setup:**  
    - Hand out a **"Founding Charter Worksheet"** with:  
      *"Article 1: Membership Eligibility. To vote on co-op matters, a person must be: [Your Rule Here]. This rule may only be amended by a ⅔ majority vote of existing members."*  
    - **Constraints to force specificity:**  
      - Rule *must* include **at least 3 concrete criteria** (e.g., "enrolled students," "pays dues," "attends meetings").  
      - Ban vague terms like "affected," "interested," or "stakeholder." Require measurable conditions (e.g., "works here 5+ hrs/week," "lives within 1 mile").  
      - **Secret incentive:** Tell them their rule will decide who votes on allocating the $500 budget later.  

  #### **Phase 2: Edge-Case Applications (20 mins)**
  - Distribute **7 applicant profiles** (mix of obvious members + contested cases). **Key: Each profile embodies a philosophical tension:**  

    | Applicant             | Conflict                                 | Philosophical Tension                          |  
    |-----------------------|------------------------------------------|------------------------------------------------|  
    | **1. Maya (Student)** | Obvious member                           | Baseline                                       |  
    | **2. Ben (Janitor)**  | Works 40hrs/week in the building         | *Subjected to rules* vs. *No formal stake*     |  
    | **3. Ada (Landlord)** | Owns the building; lives abroad          | *Ownership stake* vs. *Not subject to rules*   |  
    | **4. Rio (Courier)**  | Delivers packages daily; affected by access policies | *All-affected principle* vs. *No contribution* |  
    | **5. Zara (Neighbor)**| Lives next door; noise complaints        | *All-affected* vs. *No institutional tie*      |  
    | **6. Sam (Minor)**    | Child of deceased member; owes $50 debt  | *Future stake* vs. *Capacity/consent*          |  
    | **7. AVA (AI Scheduler)**| Bot managing equipment bookings         | *Systemic dependence* vs. *Personhood*         |  

  - **Task:** Students apply their rule to admit/reject each applicant. Record votes publicly.  

  #### **Phase 3: The Disenfranchisement Round (15 mins)**  
  - **Lock in the rule:** Announce no changes allowed — it’s in the "charter."  
  - **Exclude "outsiders":** Assign 3 students to role-play **Rio (Courier)**, **Zara (Neighbor)**, and **Sam (Minor)**. They *must physically move* to a "non-member zone" (e.g., back of room) based on the rule’s outcome.  
  - **Vote on a high-stakes issue:**  
    - *"Proposal: Use the $500 budget for (a) New 3D printers (benefits users) OR (b) Soundproofing (benefits neighbors)."*  
  - **Crucial moment:** Rio/Zara/Sam must watch silently as a decision *directly affecting them* is made by a demos they’re excluded from.  

  #### **Phase 4: Debrief (25 mins)**  
  1. **Start with visceral reflection:**  
     - *"How did it feel to exclude Rio/Zara/Sam? How did it feel to be excluded?"*  
     - *"What happened when you tried to amend the rule?"* (They’ll realize they couldn’t without the rule itself).  

  2. **Map activity to theory:**  
      | Activity Moment          | Philosophical Concept              |  
      |--------------------------|------------------------------------|  
      | Rejecting Rio (Courier)  | *All-affected principle* → Unworkably broad (endless "affected" people) |  
      | Rejecting Ada (Landlord) | *Subjection to authority* → Excludes stakeholders |  
      | Rejecting Zara (Neighbor)| *Territorial jurisdiction* vs. impact beyond borders |  
      | Rejecting Sam (Minor)    | *Intergenerational justice* → Who represents future members? |  
      | Including AVA (AI)       | *Moral patienthood* → Non-human entities in demos |  
      | Amending the rule        | **The boundary problem**: Rules presuppose a demos |  

  3. **Reveal the "problem"**: Finally name the boundary problem and theories (all-affected, all-subjected, stakeholder, etc.).  

  ---

  ### **What Will Go Wrong (and Fixes):**
  1. **"Vague rule" dodge**:  
     - **Problem:** They write "anyone committed to the space."  
     - **Fix:** Enforce the **3 concrete criteria** requirement. Pre-emptively reject rules like "people who care."  

  2. **Over-inclusiveness**:  
     - **Problem:** They admit everyone to avoid conflict.  
     - **Fix:** Add **"Co-op resources are scarce. Not all applicants can be members."** Use the budget vote to show consequences.  

  3. **Time crunch**:  
     - **Problem:** Debate bogs down in Phase 2.  
     - **Fix:** Assign a student **"Facilitator"** to enforce timers. Give each edge case **90 seconds max**.  

  4. **Missing the point**:  
     - **Problem:** Students see it as "fairness," not boundary bootstrapping.  
     - **Fix:** In debrief, ask: *"Could Rio vote to change the rule that excluded him? Why not?"*  

  ---

  ### **The Unavoidable Limitation:**
  **Real-world coercion vs. classroom consent:**  
  - In a real polity, exclusion means **violence/coercion** (e.g., deportation, denial of services). In your activity, the "excluded" are role-playing peers who *choose* to comply.  
  - **Mitigation:** Explicitly discuss this post-activity: *"In reality, exclusion isn’t sitting quietly — it’s losing rights. How might that change the stakes?"*  

  ---

  ### **Why This Works:**
  - **Pre-theoretical frustration:** Students *feel* the paradox before naming it.  
  - **Embodied exclusion:** Physically moving "outsiders" makes disenfranchisement visceral.  
  - **Self-sabotage:** Their own rule creates the trap — no lecture needed.  

  **Materials Needed:** Worksheets, applicant profiles, timers, $500 budget prop (e.g., fake check).  
  **Total Time:** 75 mins (adjust phases if debate runs hot).  

  This mirrors real founding moments (e.g., Constitutional Conventions) where rule-makers accidentally entrench their biases. By the debrief, they’ll grasp why Dahl called this democracy’s "unresolvable" dilemma.
