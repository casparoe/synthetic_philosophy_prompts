prompt: |-
  I'm a software engineer with no formal background in philosophy, so please write for a lay reader; technical terminology is fine so long as you define it when you introduce it.

  Here is my situation. I work at a company that hires engineers through a two-stage pipeline: an initial screen run by a recruiter team, then a technical loop. The recruiter team is headed by a man I'll call R. Over the past year I've sat on enough hiring debriefs to be confident that R. systematically misrepresents the job to candidates: the tech stack they'll actually work on, the on-call burden, the travel, the team's real roadmap. Each misrepresentation is individually modest — nobody is being defrauded of money — but candidates make life decisions on the basis of what he tells them: several have relocated across the country, and one couple postponed adopting because of promises about parental leave scheduling. By my count there are four or five active deceptions in progress right now.

  The problem is that I can't prove any of it. Debriefs aren't recorded, and R. is careful never to put the misrepresentations in writing. Two engineers have already complained informally and were brushed off; another undocumented complaint would mostly teach R. to be more careful. There is one reliable way to document him: a sympathetic manager has offered to slip a fake candidate into his pipeline, and she has asked me to be that candidate — to sit through a screening call while pretending to be a job-seeker, recording everything. To do this I would misrepresent myself, deliberately and at some length, to a colleague.

  I have a hard personal rule against this. It is not that I think my impersonation would be worse than what R. does — by my own lights, each of his deceptions is at least as bad as mine would be, and there are several of them. It is that I hold an unqualified rule against my own deliberate misrepresentation, and I can see no principled line below which I would permit myself to break it. So refusing to help appears to mean that more of exactly the thing my rule is against will happen, through R.'s actions rather than mine.

  My partner says this is straightforwardly irrational: if what makes deception bad is what it does to the person deceived, then declining to do a smaller amount of it to stop a larger amount just protects my self-image at everyone else's expense. When I try to answer, I find I don't actually have an argument — only the conviction that there is a real difference between lying and letting lies happen, and that the difference isn't erased by counting.

  What I would like from you:

  1. A genuine adjudication of whether my refusal is defensible, not a pep talk for either side. In particular: does my position survive if the number of deceptions I would prevent grows — if there were fifty instead of five? Identify where, if anywhere, it has to give.
  2. Whatever terminology exists for this dispute, so that I can at least name what I'm standing in the middle of.
  3. Finally, I don't know how much of this is settled among people who study it and how much is one school's opinion. Please distinguish the parts of your answer that reflect broad agreement from the parts that are genuinely contested, and do not present contested positions as consensus. If the honest answer is that informed people have always disagreed about the core question, I would rather know that than receive a tidy verdict.
reasoning: |-
  Okay, let me unpack this user's ethical dilemma. They're a software engineer caught between their personal rule against deception and the opportunity to expose systematic workplace dishonesty. The core tension is visceral: they refuse to lie, even to catch a bigger liar, but feel complicit in ongoing harm by inaction. 

  First, I need to map the philosophical landscape. The user's position echoes deontology - rules as inviolable constraints. Their partner argues consequentialism: smaller lie prevents greater harm. But this isn't just academic; it's about relocation decisions and postponed adoptions. Real lives hang in the balance.

  The magnitude question is critical. The user asks if their stance holds at scale - what if there were 50 victims instead of 5? In pure deontology, numbers don't change the rule, but even Kant allowed for "conflict of duties." At some point, allowing massive harm might become its own violation. Still, I should emphasize that ethicists debate this fiercely - no consensus exists.

  Terminology matters here. "Doctrine of Double Effect" might help them distinguish intended deception from foreseen but unintended harm. "Integrity ethics" captures their self-betrayal concern. "Moral residue" names that lingering unease even in justified actions.

  I'm struck by their intellectual honesty. They admit having no argument beyond conviction - rare self-awareness. This isn't stubbornness; it's genuine moral searching. The fake candidate setup also introduces power dynamics: management's involvement suggests systemic failure beyond R.

  On practical ethics: Are there non-deceptive alternatives? Data mining past candidates? Checking offer decline reasons? The user might've considered these, but they're worth noting as contested solutions where purists and pragmatists divide.

  The recording proposal raises legal questions too - two-party consent states? - but the user's focused on morality. Still, it underscores the messiness: their "clean" refusal avoids complicity in possibly illegal acts.

  Ultimately, I'll present both frameworks as live options. Consequentialism has traction in professional ethics codes, but personal integrity isn't irrational. The user's stance holds water philosophically - it's just not the only valid view. I'll flag where consensus breaks down, like whether "letting happen" equals "doing."

  This deserves nuance. No pep talks, just clear signposts through thorny terrain. Their courage to sit with discomfort is itself ethically significant - that bears mentioning.
answer: |-
  Here's a breakdown of your ethical dilemma, grounded in philosophical frameworks, with clarity on what's contested versus where consensus might lie:

  ### 1. Adjudication of Your Refusal
  Your position is **defensible but not uncontested**. It rests on **deontological ethics** (duty-based), most closely aligned with Kantianism. Kant argued that lying is intrinsically wrong because it violates the categorical imperative: we must never treat people merely as means, but always as ends in themselves. Deliberate deception, for Kant, fundamentally disrespects human autonomy. Your "hard rule" mirrors this: you refuse to make an exception for yourself, regardless of consequences.

  **Where your position holds:**
  - **Integrity Preservation:** Acting against your core principle erodes your moral identity. Even for a "good" cause, becoming the thing you condemn can be existentially damaging.
  - **Slippery Slope Risk:** If deception is permitted to stop deception, what principle limits it? Who decides which lies are "acceptable"? Your fear of losing a "principled line" is a recognized deontological concern.
  - **Moral Residue:** Even if successful, the act of deceiving R. would leave a "moral stain" *on you*. Some ethicists argue we must minimize our *own* wrongdoing, not just total wrongdoing globally.

  **Where it faces pressure:**
  - **Scale Dependency (Consequentialist Challenge):** If preventing 5 deceptions isn't compelling, what about 50? 500? At some scale, the harm *prevented* (relocations, life delays) arguably outweighs the harm *caused* (your single lie + R.'s discomfort). Most people's intuitions shift when numbers grow large (e.g., lying to save a life). **Your position likely "gives" at extremes of scale or severity.** If R.'s lies were causing imminent physical harm, refusing to lie to stop it would be harder to defend.
  - **"Letting Happen" vs. "Doing":** Your partner uses **consequentialism** (focus on outcomes). Here, *allowing* harm you could prevent is often seen as morally equivalent to *causing* it. Philosophers like Peter Singer argue that if you can prevent great harm without comparable sacrifice, you should. Your refusal *does* protect your integrity at the potential cost of others' welfare.
  - **Alternatives Exhausted?** Is there *truly* no other way? Documenting patterns? Anonymous aggregate data on mis-hires? Escalating formally with the *engineers'* documented experiences? If plausible alternatives exist, your refusal strengthens.

  **Verdict:** Your refusal is defensible as a commitment to personal moral integrity. However, it becomes harder to justify if the scale of harm prevented grows massively *and* all less-violent alternatives are exhausted. The tipping point isn't a fixed number; it depends on the severity of harm and the availability of other options.

  ### 2. Terminology for the Dispute
  *   **Deontology vs. Consequentialism:** This is the core conflict. You hold a **deontological** (rule/duty-based) view against lying. Your partner employs **consequentialism** (outcome-based) reasoning.
  *   **Doctrine of Double Effect (DDE):** Distinguishes intended effects (your lie) from foreseen-but-unintended effects (more lies by R. happening because you didn't act). DDE *might* permit harmful side effects if the act is good, the harm isn't intended, and the good outweighs the harm. Here, *not* lying avoids *intending* deception, but *foreseeably allows* greater harm. (DDE is contested).
  *   **Integrity Ethics:** Your stance emphasizes **moral integrity** – consistency between values and actions, avoiding self-betrayal.
  *   **Moral Residue:** The "dirty hands" feeling or lingering wrongness felt even after a justified act. You seek to avoid this entirely.
  *   **Act-Omission Distinction:** The difference between *lying* (an act) and *alllying lies to happen* (an omission). This distinction is central to your view but heavily debated. Consequentialists often collapse it; deontologists often uphold it.
  *   **Agent-Centered Prerogative:** The idea that you may permissibly give *some* priority to your own projects/commitments (like your integrity) over maximizing overall good.

  ### 3. Settled vs. Contested
  *   **Broad Agreement:**
      *   Lying is generally wrong because it undermines trust and autonomy.
      *   Preventing harm is generally good.
      *   Personal integrity is a significant moral value.
      *   Consequentialism and Deontology are both valid, major ethical frameworks that often conflict in practice.
      *   Extreme cases (lying to save a life) challenge absolute rules.
  *   **Genuinely Contested:**
      *   **Is the Act-Omission Distinction Morally Significant?** Deontologists defend it; consequentialists (and many virtue ethicists) often reject it, especially when outcomes are identical. *This is a core fault line in your dispute.*
      *   **Can a Rule Against Lying Ever Have Exceptions?** Kant argued "no" (except perhaps to save life, which he ambiguously addressed). Most modern ethicists (even many deontologists) believe some exceptions exist, though they fiercely debate *which* and *why*.
      *   **How to Weigh Integrity vs. Consequences?** There's no consensus. Some prioritize minimizing total harm (consequentialism), others prioritize not violating core duties (deontology), others focus on the character of the agent (virtue ethics).
      *   **Does Scale/Severity Override Rules?** Deontologists say rules bind regardless of consequences. Consequentialists say consequences determine rightness. Rule-consequentialists try to bridge this by asking what *general rules* lead to the best outcomes, but this is also contested. **Your core question – when/if numbers override a strict rule – is fundamentally unresolved in philosophy.**
      *   **"Moral Residue":** Is it a sign of wrongdoing, or just a psychological reaction? Philosophers disagree.

  **Conclusion:** You are standing squarely in a classic, unresolved philosophical battleground. Your deontological position ("Never lie, regardless of consequences") is intellectually respectable and defensible, particularly given your emphasis on integrity and the slippery slope. Your partner's consequentialist position ("One small lie prevents many larger harms") is equally respectable and widely held. **There is no tidy, consensus verdict.** Informed philosophers have disagreed on this core tension for centuries.

  **Recommendation:** Since the *immediate* harm scale (5 cases) doesn't clearly force a tipping point for most deontologists, and given your deep commitment to integrity, your refusal seems justifiable. However, rigorously explore *all* non-deceptive avenues to expose R. (e.g., meticulously documenting recruiter promises vs. reality from *actual* candidate experiences during debriefs, pushing for recorded screens, escalating via sympathetic managers using patterns). If R.'s actions escalate in severity or scale significantly, and alternatives fail, the pressure on your principle would intensify. The honest truth is this dilemma has no painless solution.
