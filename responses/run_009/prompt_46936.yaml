answer: |-
  Here's a ranked list of the most serious challenges to fanatical unbounded utilitarianism, from fatal to awkward:

  1.  **Infinitary Stochastic Dominance Violations (Fatal):** Seidenfeld et al.'s results show that extending standard dominance axioms to *infinite* sequences of choices forces rejection of *finite* sure benefits for arbitrarily small probabilities of infinite gain *in the same sequence*. This creates a direct contradiction: you must prefer a sequence where you *always* sacrifice a sure good for a vanishingly small chance of a bigger payoff, even though this leads to near-certain catastrophic loss over the sequence. This violates the finite dominance you rely on and is internally inconsistent **within your own axioms applied to sequences**. *This directly attacks the coherence of dominance reasoning in infinitary contexts.*
  2.  **Representation Theorems for Sane Alternatives:** Strong representation theorems exist for risk-weighted expected utility (e.g., Buchak) and other models that satisfy compelling axioms (completeness, transitivity, stochastic dominance for finite lotteries, continuity) *without* requiring fanaticism. They show your core axioms don't uniquely mandate unbounded linear EU. *This severs the logical necessity.*
  3.  **Sequential Choice & Dynamic Inconsistency:** The view forces dynamically inconsistent plans. You'd precommit to pay a series of Pascal's Muggers (or make infinitely many longshot bets), but when faced with any *single* mugging, a *strictly dominant* action exists: keep your money. Preferring the dominated action in the single case is indefensible. *Money pumps become inescapable over finite sequences when you face the actual choices.*
  4.  **Essential Boundedness of Welfare (Strong Challenge):** Defenders (e.g., Beckstead, Mogensen) concede that if the *structure of welfare itself* imposes a bound (e.g., maximum intensity of experience, logical limits on value density in spacetime), fanaticism collapses. Physics *might* imply such bounds. *This isn't just psychology; it's ontology.*
  5.  **Unacceptable Predictions Insiders Concede:** Serious defenders acknowledge the "**Pascalian Fanaticism**" problem: the view directs *all* resources towards the *absolute cheapest* per-unit-probability longshot to affect astronomically large populations, ignoring near-term suffering, certain medium gains, or even solid X-risk reduction if a *slightly* cheaper/more probable mega-longshot exists. *Most concede this is a crippling practical implication, even if theoretically mandated.*
  6.  **Formal Indeterminacy of Infinitary Lotteries:** Extending EU to lotteries over infinite sets (like potential populations) faces deep technical problems (measurability, aggregation). There's often no unique or consistent way to define probabilities and utilities here. *Your "physics-flouting stranger" scenario might be mathematically incoherent.*
  7.  **Dutch Books for Infinitary Bets (Awkward):** While standard Dutch Books fail against unbounded utility, more complex "improper prior" or infinitary Dutch Books can be constructed, showing potential inconsistency in probability assignment for the very tail events fanaticism relies on. *Less decisive, but highlights fragility.*

  **Bottom Line for Meetup:** The infinitary stochastic dominance contradiction (#1) and the existence of coherent, axiom-satisfying alternatives without fanaticism (#2) are the most lethal formal wounds. The dynamic inconsistency (#3) and essential boundedness argument (#4) are severe practical/philosophical challenges. Even defenders struggle with the "Pascalian Fanaticism" resource allocation (#5). Your position *is* effectively a theorem from axioms you refuse to reexamine, but #1 and #2 show those axioms *themselves* lead to contradiction or non-uniqueness when pushed to the required extremes.
