  Looking at their examples, they've identified several key constraints: handling the classic dementia case where a previously competent person refuses treatment but the current self seems content, distinguishing directives from mere preferences, addressing value changes over time (like their grandmother's mellowed directives), and extending to psychiatric advance directives (Ulysses contracts). They also want to explore the personal identity angle—whether a demented self is a different person and how that affects the directive's authority.

