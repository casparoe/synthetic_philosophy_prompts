answer: |-
  Here’s a structured requirements list ("spec") for a theory of advance directives (ADs), designed to cut through case-slinging by defining core desiderata. I’ve flagged tensions, non-negotiables, and tested your two framings.

  ---

  ### **Core Desiderata for a Theory of Advance Directive Authority**
  *(Non-negotiables in **bold**; contentious items marked with *; tensions flagged with ⚠️)*

  1.  **The Authority Requirement:**  
      *   **Must explain why an AD is *binding* (authoritative) rather than merely *evidential* about the patient's wishes.**  
      *   *Case/Consideration:* The demented patient who left clear instructions refusing antibiotics/feeding but now seems content. If ADs are just evidence, current contentment could override past refusal. If authoritative, refusal stands even if current self seems to "want" treatment.  
      *   *Non-Negotiable:* Without authority, ADs collapse into preference predictors, undermining their core legal/ethical purpose.

  2.  **The Identity Challenge:**  
      *   **Must address whether radical psychological discontinuity (e.g., severe dementia, profound conversion) affects the AD's authority.**  
      *   *Case/Consideration:* Parfit-style thought experiments; the dementia patient whose current self shares minimal psychological connections (memories, values, beliefs) with the directive-writing self. Does the directive bind a "different person"?  
      *   *Tension ⚠️:* Deep identity discontinuity seems to undermine the *Authority Requirement* (bindingness requires continuity). But ignoring discontinuity risks subjecting a "new" person to a stranger's will.

  3.  **The Value Change Problem:**  
      *   **Must provide criteria for when subsequent changes in values/preferences *do* or *do not* override the AD.**  
      *   *Case/Consideration:* Your grandmother – mellowing vs. stern directive. Also: religious conversions, political shifts, or evolving attitudes toward suffering/technology. Distinguish:  
          *   *Predictable Drift:* (e.g., age-related mellowing) vs. *Unforeseen Transformation* (e.g., conversion).
          *   *Endorsed Change:* Would the past self *approve* of the change? (e.g., "I hope I'll find peace in faith later").
      *   *Non-Negotiable:* Must avoid the "dead dictator" problem (rigid adherence) vs. the "meaningless scrap of paper" problem (always overridable).

  4.  **The Form/Function Distinction:**  
      *   **Must explain why *formalizing* preferences in an AD document confers different status/moral weight than a mere contemporaneous oral statement of preference.**  
      *   *Case/Consideration:* Why is "I never want a feeding tube" written/signed/witnessed *yesterday* more authoritative than the same words spoken *today*?  
      *   *Core Function:* ADs exist precisely because they aim to bind *future* decisions when capacity is lost. Formality signals deliberation and commitment.

  5.  **The Ulysses Extension:**  
      *   **Must coherently extend to (or explain the principled exclusion of) Psychiatric Advance Directives (PADs)/Ulysses Contracts.**  
      *   *Case/Consideration:* A bipolar patient directs, while stable, to be hospitalized/medicated against their will during mania, anticipating they will resist. The later self is competent *in the moment* but the directive asserts they are *globally incompetent*.  
      *   *Unique Challenge:* The directive *explicitly* anticipates and aims to override the competent later self's contemporaneous resistance based on a judgment of its *epistemic defect* (distorted judgment). This tests the limits of *Authority* and *Identity*.

  6.  **The Competence Condition:**  
      *   **Must specify the epistemic/agential conditions required *at the time of writing* for an AD to gain authority.**  
      *   *Case/Consideration:* Was the directive written under duress? With adequate information? With sufficient understanding of possible future states? Does "authenticity" matter beyond mere legal competence?  
      *   *Non-Negotiable:* A theory that ignores competence at execution risks tyranny; ignoring competence at writing risks enforcing non-autonomous choices.

  7.  **The Irreversibility Proviso:**  
      *   **Must address the heightened authority of refusals vs. requests, especially when refusal leads to irreversible consequences (death, permanent disability).**  
      *   *Case/Consideration:* Refusing life-sustaining treatment (LST) vs. requesting experimental/controversial LST. Refusals are typically granted stronger deference in law/ethics. Why? Does bindingness differ based on consequence type?

  8.  **The Scope & Interpretation Constraint:**  
      *   **Must provide guidance for interpreting directives in unforeseen circumstances and define their limits.**  
      *   *Case/Consideration:* An AD refusing "heroic measures" or "life support if demented" written before the advent of new treatments (e.g., effective dementia drugs). Does it apply? How strictly construed? What about preferences not explicitly covered?

  9.  **The Conflict Resolution Mechanism:**  
      *   **Must offer a non-arbitrary way to adjudicate conflicts between the interests/expressed wishes of the earlier and later selves when both seem morally salient.**  
      *   *Case/Consideration:* The content demented self deriving simple pleasure from being alive (an interest), vs. the past self's directive refusing LST to avoid that exact state (an express wish). Who wins? *Why?*  
      *   *Tension ⚠️:* This is the core instability. *Authority* vs. *Value Change* vs. *Later Self's Interests* creates fundamental conflict.

  ---

  ### **Key Tensions & Instabilities (Where Desiderata Clash)**
  1.  **Authority vs. Identity/Value Change (⚠️ MAJOR):** Binding authority requires continuity of the self issuing and bound by the directive. Profound discontinuity (*Identity*) or significant value shift (*Value Change*) directly challenges the grounding of that authority. Resolving this often involves *defining* the relevant self (whole life? current moment?) or prioritizing one type of interest (critical vs. experiential).
  2.  **Authority (Bindingness) vs. Conflict Resolution:** If the AD is truly *authoritative*, conflict resolution should *always* favor the directive. But *Value Change*, *Later Self Interests*, and *Identity* provide strong reasons why this might be unjust or non-autonomous in specific cases. Theories struggle to justify overriding the directive without collapsing authority.
  3.  **Ulysses Contracts vs. Standard ADs:** PADs authorize overriding a *currently competent* (though episodically distorted) self's refusal. This challenges the standard *Competence Condition* applied at the time of treatment and stretches the *Authority Requirement* to its limit. Can a single theory cover both without contradiction?

  ---

  ### **Testing the Framings Against the Requirements**

  1.  **Trustee Model (Earlier Self as Trustee for the "Whole Life"):**
      *   *Fails Identity Challenge:* If the later demented self is radically discontinuous, in what sense is the trustee acting *for it*? It risks imposing the trustee's vision on a distinct entity.
      *   *Fails Value Change Problem:* Assumes the trustee knows the "true" or "whole life" interests better than the mellowed self. Why? It struggles to justify overriding the directive based on later mellowing the trustee couldn't foresee or value.
      *   *Fails Ulysses Extension:* Easily incorporates Ulysses contracts – the trustee anticipates and plans for episodic incompetence as part of stewarding the whole life.
      *   *Fails Conflict Resolution:* Tends to rigidly favor the trustee's (past self's) plan, struggling to give moral weight to the experiential interests of the later self if they conflict with the plan.
      *   *Fails Authority Requirement?* It grounds authority in stewardship, not pure autonomy. This might be sufficient, but it shifts the justification.

  2.  **Contract Model (Between Successive Selves):**
      *   *Fails Identity Challenge:* If discontinuity is severe (radical dementia), there *is* no later "self" party to the contract. The contract dissolves. (*This might be seen as a success by some, a failure by others*).
      *   *Fails Value Change Problem:* Why would the "mellowed self" be bound by a contract made by a different "self" (the stern 65-year-old)? It implies contracts aren't binding across fundamental value shifts.
      *   *Fails Ulysses Extension:* This is its *strongest* case – a Ulysses contract *is* explicitly a contract between the stable self and the future resistant self, anticipating the breach.
      *   *Fails Authority Requirement:* Contracts require mutual agreement and benefit. It's unclear what the later demented self "gains" from adhering to a refusal of LST that ends its simple existence. The authority seems contractual, not inherent in autonomy.
      *   *Fails Form/Function Distinction:* Why is a formal document needed? Ordinary contracts don't require specific forms to be binding between parties (though evidence helps). The focus is on the agreement, not the formality.

  ---

  ### **The Killer Requirement: Authority**
  The **Authority Requirement** knocks out the most theories *as commonly presented*:
  *   **Evidential Theories:** Fail at #1 immediately. They aren't really theories of *directive authority*.
  *   **"Best Interest" Theories:** Often fail #1 & #9. They collapse ADs into evidence for determining *current* best interests, overriding the directive if the later self's interests seem different.
  *   **Pure Precedent Autonomy Theories:** Often fail #2 (Identity) and #3 (Value Change). They assert authority rigidly based on past autonomy but struggle when the later entity seems discontinuous or holds genuinely different values.
  *   **Current Interest Theories:** Fail #1 catastrophically. They grant no inherent authority to the past self.
  *   **Hybrid Theories:** Often fail by being unstable or arbitrary in resolving the **Authority vs. Value Change/Identity/Conflict Resolution** tensions (#1 vs. #2, #3, #9).

  **Why it's the Killer:** Any theory that *doesn't* establish robust authority undermines the very point of ADs. But establishing that authority in a way that survives radical discontinuity, profound value change, and conflicts with a later self's apparent interests or minimal well-being is extraordinarily difficult without resorting to fiat, collapsing into evidence, or privileging one perspective arbitrarily. This is the core instability you sensed.

  ---

  **Your Next Move:** Use this spec as a filter. When reading a theory, ask: *Which desiderata does it meet? Where does it fudge or fail? How does it handle the core tensions (especially Authority vs. Identity/Value Change)?* Your chapter can then map the landscape not by cases, but by *which problems different approaches solve or ignore*, revealing the fundamental fault lines in the justification of advance directives. Good luck!
