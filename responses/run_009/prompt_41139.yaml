  ### Sleeping Beauty Position Quiz  
  *Answer based on your intuitive judgments. Don't overthink—go with your gut.*

  1. **The Original Setup**  
     Beauty is told: "Heads = 1 awakening (Mon), Tails = 2 awakenings (Mon/Tue). After each awakening, you forget it happened." She wakes up (no other info). What should she say the probability of heads is?  
     • A) 1/2  
     • B) 1/3  

  2. **The Red/Blue Room**  
     Same as above, but if tails, the room has *red* curtains on Mon and *blue* on Tue. Beauty wakes up and sees *red* curtains. What should she say the probability of heads is?  
     • A) 1/3  
     • B) 1/2  
     • C) 2/3  

  3. **The Duplicate Experiment**  
     Heads: Original Beauty wakes on Mon. Tails: A perfect copy wakes on Mon, and the original wakes on Tue. Neither knows if they’re the original or copy. Upon waking, what should they say the probability of heads is?  
     • A) 1/3  
     • B) 1/2  

  4. **Million Tuesdays**  
     Heads: 1 awakening (Mon). Tails: After Mon, a new coin is tossed. If new coin = heads, 1 Tue awakening. If new coin = tails, *1 million* Tue awakenings. Upon waking, what should Beauty say the probability of the *first* coin being heads is?  
     • A) About 1/2  
     • B) Very close to 0  
     • C) About 1/3  

  5. **The Bet**  
     In the original setup, at every awakening, Beauty is offered a bet: "Pay $X now to win $1 if heads lands." (If tails, she might pay twice; heads payout happens once.) Which is fairest?  
     • A) Fair at $X = 0.50  
     • B) Fair at $X = 0.33  
     • C) Credence = 1/2, but I’d pay up to $0.33  

  6. **The Observer Analogy**  
     Suppose a coin creates 1 observer in "heads-world" or 2 observers in "tails-world" (distinct people). An observer wakes up. Should they reason about being in heads-world like Beauty does?  
     • A) Yes—same as Beauty: probability 1/3  
     • B) No—distinct observers change it: probability 1/2  
     • C) Yes—same anthropic principles apply: probability 1/3  

  7. **New Evidence?**  
     In the original setup, does the *act of waking up itself* give Beauty new evidence about the coin?  
     • A) Yes—she’s now awake at a time she wasn’t sure about  
     • B) No—she knew she’d be awake, and amnesia means no new info  

  8. **Verbal Dispute?**  
     Is the Sleeping Beauty problem confusing because the word "probability" is ambiguous here?  
     • A) No—there’s one clear question: "What should Beauty say?"  
     • B) Yes—two questions are conflated: (1) credence vs. (2) betting odds  
     • C) Yes—"probability" could mean different things (e.g., possible worlds vs. belief)  

  9. **Monday Reveal**  
     In the original setup, Beauty is told upon waking, "It’s Monday." What should she update the probability of heads to?  
     • A) 1/2  
     • B) 2/3  

  ---

  ### Scoring Key  
  *Match your answers to the positions below. If you have >1 match, see "Ambiguous" cases.*

  | Position                      | Answer Pattern (Q1–Q9)                                                                 | Notes                                                                 |
  |-------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Thirder**                   | 1B, 2B, 3A, 4B, 5B, 6A/C, 7A, 8A, 9A                                                   | Awakening is evidence; bets align with 1/3 credence.                 |
  | **Plain Halfer**              | 1A, 2C, 3A, 4A, 5A, 6B, 7B, 8A, 9B                                                     | Updates to 2/3 on Monday; awakening isn’t evidence.                  |
  | **Double Halfer**             | 1A, 2B, 3A, 4A, 5A, 6B, 7B, 8A, 9A                                                     | Stays 1/2 on Monday; awakening isn’t evidence.                       |
  | **Halfer-Who-Bets-Like-Thirder** | 1A, 2B/C, 3A/B, 4A, **5C**, 6—, 7B, 8—, 9—                                          | Credence=1/2 but accepts thirder bets due to repeated offers.        |
  | **Anthropics-Linked**         | —, —, —, —, —, **6A/C**, —, —, — + *also* holds a thirder/plain-halfer position       | Explicitly ties Beauty’s case to anthropic reasoning.                |
  | **Deflationary**              | —, —, —, —, —, —, —, **8B/C**, —                                                       | Believes the dispute is verbal/ambiguous.                            |
  | **Incoherent**                | Mixes: e.g., 1A + 2C + **9A** (contradicts plain halfer)                               | Violates core position logic (e.g., Monday update inconsistency).    |
  | **Ambiguous**                 | Common borderline cases:                                                                 |                                                                       |
