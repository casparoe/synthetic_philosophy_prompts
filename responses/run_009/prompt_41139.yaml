  #### Where the Mapping Might Fail  
  - **Double vs. Plain Halfer**: Relies *only* on Q2 (red room). If you answered 1A (halfer) but *not* 2B or 2C, the key can’t classify you. This is unavoidable—these positions *only* diverge when Beauty knows the day.  
