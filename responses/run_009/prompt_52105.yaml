  - Then we have 5 minutes for transition and to collect scores.

  Alternatively, to save time and avoid chaos, have each group present to the entire class? But that would take longer. So stick with pairs.

  Then:
  - 60-90 min: Debrief (30 minutes)

  Let me adjust the timing:

