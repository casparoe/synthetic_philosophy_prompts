     Cost: $200,000 for a 2-year campaign.  
     Outcome: Aims to shift societal attitudes toward environmental stewardship, potentially leading to widespread behavior change and policy reforms. However, the impact is unmeasurable because it's about changing hearts and minds, and the effects could be enormous but are impossible to quantify.  
     *Uses media, art, and community events to promote environmental values.*

