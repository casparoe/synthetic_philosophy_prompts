  **Candidate Grantees for Funding**

  You have 100 points to allocate. You may split your points among any of the following organizations. The more points an organization gets, the more funding they receive.

  1. **Healthy Kids Initiative (Deworming)**  
     Cost: $1 per child treated.  
     Outcome: Prevents one year of school absenteeism per $10 spent.  
     *A proven, straightforward intervention that treats intestinal worms in school-aged children.*

  2. **Malaria No More (Bednets)**  
     Cost: $5 per bednet.  
     Outcome: Prevents one case of malaria per $100 spent.  
     *Distributes insecticide-treated bednets in malaria-endemic areas.*

  3. **Clean Water Advocacy**  
     Cost: $100,000 per advocacy campaign.  
     Outcome: Expected to reduce waterborne diseases by 10% in the targeted region over 10 years. However, the exact impact is hard to measure due to many factors, and success is not guaranteed.  
     *Lobbies governments and raises public awareness for clean water infrastructure.*

  4. **Community Schools Project**  
     Cost: $50,000 per community per year.  
     Outcome: Expected to improve educational outcomes (e.g., graduation rates, test scores) in the long run, but effects are diffuse and may take years to materialize.  
     *Trains local leaders and parents to advocate for better schools and provides after-school programs.*

