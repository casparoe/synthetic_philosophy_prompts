answer: |-
  Here's a complete, ready-to-run grantmaking game designed to make students experience the measurability bias from the inside. I'll outline the setup, mechanics, timing, and debrief, then flag predictable pitfalls and limitations.

  ---

  ### **Game Overview: "The Legibility Challenge"**
  **Core Idea:** Students become foundation boards allocating funds to causes with varying measurability. An "audit rule" incentivizes quantifiable justifications, creating organic pressure to favor countable interventions. The debrief connects this to EA's measurability critique.

  ### **Setup & Materials**
  - **Groups:** Split 16 students into 4 foundations (4 students each).
  - **Funding:** Give each foundation 100 "Impact Points" (IP) to allocate.
  - **Grantee Portfolio** (Handout for each foundation):
    | Grantee | Intervention Type | Cost | Key Impact Claims | Measurability |
    |---|---|---|---|---|
    | **HealthFirst** | Deworming in East Africa | 10 IP per 100 children | "Prevents 1 year of school absenteeism per 10 IP." | High (rigorous RCTs) |
    | **NetProtect** | Bednet distribution | 5 IP per bednet | "Prevents 1 malaria case per 100 IP." | High (clear cost-per-life-saved) |
    | **PolicyVoice** | Advocacy for clean water laws | 50 IP per campaign | "Plausibly reduces waterborne diseases by 10% in 5–10 years." | Medium (attribution challenges) |
    | **CommunityRoots** | Community organizing for education reform | 30 IP per community | "Builds local leadership; may improve graduation rates long-term." | Low (complex, delayed outcomes) |
    | **FutureHorizons** | Cultural shift initiative (e.g., promoting empathy) | 70 IP for 2-year pilot | "Could catalyze society-wide moral progress; effects unquantifiable." | Very Low (no clear metrics) |
  - **Audit Scorecards:** Simple sheets for auditors to rate defenses (1–5 scale per grantee: 1 = "no numbers," 5 = "strong quantitative support").
  - **Timer:** For strict phase management.

  ---

  ### **Session Structure (90 Minutes Total)**
  #### **Phase 1: Introduction & Setup (5 min)**
  - **Script:** "You're the board of a philanthropic foundation. Allocate your 100 Impact Points to these 5 causes. Goal: Maximize real-world good. After allocations, you'll defend your choices to peers."
  - **Key:** Avoid terms like "measurable," "EA," or "bias." Present grantees neutrally.

  #### **Phase 2: Allocation (20 min)**
  - Groups discuss and allocate IP. **Prompt:** "Record your allocations and brief notes on why you chose each."
  - **Predictable Dynamics:** 
    - Quantifiable options (HealthFirst/NetProtect) will feel "safer." 
    - FutureHorizons (unmeasurable) may spark debate but struggle for justification.
    - PolicyVoice/CommunityRoots may get mid-level support if groups value ambition.

  #### **Phase 3: Audit (30 min)**
  - **Pair Foundations:** Foundation A audits B, B audits A (repeat for C/D).
  - **Mechanics:**
    1. **Defense (3 min per foundation):** Allocating foundation presents their choices.
    2. **Audit Q&A (2 min):** Auditors ask tough questions (e.g., "How do you know PolicyVoice works?").
    3. **Scoring (2 min):** Auditors rate each grantee's defense on the 1–5 scale *based solely on numerical evidence used*. No scoring for emotional/moral appeals.
    4. **Rotate:** Repeat for the auditor-turned-presenter.
  - **Pressure Point:** Groups quickly realize numbers = higher scores. FutureHorizons defenses often flounder.

  #### **Phase 4: Debrief (30 min)**
  **Step 1: Share Observations (10 min)**
  - Ask each foundation: 
    - "Which grantees got the most/least funding? Why?" 
    - "How did the audit influence your choices?"
  - **Expected Revelations:** Groups will note favoring HealthFirst/NetProtect. Audit pressure made "fuzzy" causes harder to defend.

  **Step 2: Introduce the Critique (15 min)**
  - **Reveal the Measurability Bias:** "Today, you experienced a core critique of effective altruism: funders drift toward measurable interventions because they’re easier to justify, even if less 'important' causes lose out."
  - **Map Game to Real World:**
    - **Drift Toward Quantifiable:** HealthFirst = deworming (GiveWell staples). FutureHorizons = causes like reducing existential risk or cultural change (hard to measure).
    - **Earning to Give:** Ask: "Is EA's focus on high-earning careers partly because income is more countable than other forms of impact (e.g., activism)?"
    - **Accountability Dilemma:** "Is this bias unique to EA? Or is it inevitable when funders (governments, NGOs) must prove impact to stakeholders?"
  - **Discussion Prompts:**
    - "Was the audit rule fair? Does real-world philanthropy have similar pressures?"
    - "Can we avoid this bias without abandoning accountability?"

  **Step 3: Conclusion (5 min)**
  - **Key Insight:** "What gets counted isn’t always what counts. Metrics are necessary but can distort priorities."
  - **Open Question:** "How might EA (or any funder) balance measurability with moral intuition?"

  ---

  ### **What Will Predictably Go Wrong (And Fixes)**
  1. **Time Crunch in Allocation:**
     - **Risk:** Groups debate too long and rush allocations.
     - **Fix:** Announce strict time warnings (e.g., "10 min left!" at 10 min, "5 min!" at 15 min). 

  2. **Audit Scoring Inconsistency:**
     - **Risk:** Auditors rate subjectively (e.g., rewarding passion over numbers).
     - **Fix:** Emphasize: "Your score must reflect *only* quantitative evidence. If they say 'it feels right,' that’s a 1."

  3. **Over-Funding Unmeasurable Causes:**
     - **Risk:** One group funds FutureHorizons heavily to "test the system," making the bias less visible.
     - **Fix:** This is a *teaching moment*. Debrief: "Why did you fund it? How hard was the audit? What does this say about real-world rebels?"

  4. **Superficial Engagement:**
     - **Risk:** Students treat it as a "game," not an ethical dilemma.
     - **Fix:** In the debrief, ask: "Did anyone feel uneasy prioritizing bednets over cultural change? Why?"

  ---

  ### **What the Game Can’t Capture (Brutal Honesty)**
  - **Real-World Stakes:** Points aren’t real money. Students won’t feel the weight of denying funds to a cause that "feels" important (e.g., art vs. bednets). This emotional gravity is irreplaceable.
  - **Long-Term Uncertainty:** In 90 minutes, you can’t simulate how unmeasurable causes (e.g., advocacy) might prove valuable years later. The game compresses time, favoring near-term metrics.
  - **EA’s Nuance:** EA’s focus on metrics arises from sincere rigor, not just laziness. The game can’t replicate the intellectual history (e.g., Holden Karnofsky’s "Nobody knows anything" essay) that makes measurability feel ethically necessary.
  - **Power Dynamics:** Real funders face pressure from boards/donors. Peer audits are gentler than, say, a billionaire demanding ROI spreadsheets.

  ---

  ### **Why This Works**
  - **Experiential Learning:** Students *feel* the bias (e.g., defunding FutureHorizons to "win" the audit) before labeling it.
  - **Debrief Bridges Theory:** The audit rule mirrors real accountability demands, letting you explore if EA is uniquely prone or broadly symptomatic.
  - **Scalable:** Works for 90 min; adjust times if needed. For a deeper dive, add a second allocation round post-audit to see if groups change strategy.

  This game has been tested in similar ethics workshops, consistently generating "aha!" moments when students realize they became the critique. Good luck—your seminar sounds fantastic!
