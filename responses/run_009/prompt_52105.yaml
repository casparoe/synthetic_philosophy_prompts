prompt: |-
  I run a college seminar on practical ethics, 16 students, one 90-minute session, and I want a grantmaking game that makes them feel the measurability critique of effective altruism from the inside -- the worry that when you rank do-gooding by what you can count, you quietly redirect money toward whatever happens to be countable, whether or not that's what matters most. Split them into small "foundations," give each a pot of points, and have me hand out a made-up portfolio of candidate grantees: some with clean cost-per-outcome numbers (deworming, bednets), some with plausible but messy long-run effects (policy advocacy, community organizing), and at least one whose effects are plausibly huge but basically unmeasurable. The key mechanic: the audit rule. After allocations, each foundation has to defend its choices to another group, and the defense scores better the more numbers it can cite -- so they should drift toward the legible interventions on their own, before anyone says the word "measurement." Then a debrief mapping what actually happened onto the real critique (the drift toward quantifiable interventions, whether earning to give is partly a legibility phenomenon too, and the harder question of whether this bias is specific to EA or just what any accountable funder does). No lecturing up front, and they shouldnt hear "measurability bias" until the end. Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the idea no game with points and a 90-minute clock can reproduce.
reasoning: |-
  We are designing a grantmaking simulation game for a 90-minute college seminar on practical ethics. The goal is to illustrate the measurability critique of effective altruism (EA) without explicitly stating it until the debrief. 

  Key elements:
  - 16 students split into small "foundations" (e.g., 4 groups of 4).
  - Each foundation gets a pot of points (e.g., 100 points) to allocate among candidate grantees.
  - The candidate grantees are divided into three types:
    1. Clean, quantifiable interventions (e.g., deworming, bednets) with straightforward cost-per-outcome numbers.
    2. Messy, long-run interventions (e.g., policy advocacy, community organizing) with plausible but hard-to-quantify effects.
    3. At least one intervention with plausibly huge but unmeasurable effects (e.g., promoting a cultural shift, foundational research).

  Mechanic: The Audit Rule
  - After allocations, each foundation must defend its choices to another group (peer review).
  - The defense is scored based on how many numbers they can cite to back their choices. The more numbers, the better the score.

  The expected outcome is that groups will drift toward the quantifiable interventions because they are easier to defend with numbers.

  Debrief:
  - Map the groups' choices to the real-world critique: the drift toward quantifiable interventions, the role of measurability in earning to give, and whether this bias is specific to EA or inherent in any accountable funding system.

  Structure of the 90-minute session:
  1. Introduction (5 minutes): Explain the game without giving away the critique. Just say they are acting as foundations allocating funds to different causes.
  2. Group Formation (5 minutes): Split into 4 foundations (4 students each). Hand out the grantee portfolio and rules.
  3. Allocation Phase (20 minutes): Groups discuss and allocate their points.
  4. Audit Phase (30 minutes): 
     - Each foundation is paired with another to present and defend their allocations. 
     - The auditing group scores the defense on a scale (e.g., 1-5) based on the use of quantitative evidence. 
     - Rotate so each group audits and is audited (if time allows, do one round only to save time).
  5. Debrief (30 minutes): 
     - Start by asking groups to report their allocations and their experience in the audit. 
     - Then reveal the measurability critique and discuss.

  Candidate Grantees (example portfolio):
  1. Clean, Quantifiable:
     - Deworming Program: $1 per child treated; prevents 1 year of school absenteeism per $10.
     - Bednet Distribution: $5 per bednet; prevents 1 case of malaria per $100.
  2. Messy, Long-Run:
     - Policy Advocacy for Clean Water: Costs $100,000 per campaign; expected to reduce waterborne diseases by 10% in the region over 10 years (but hard to attribute and measure).
     - Community Organizing for Education Reform: $50,000 per community; expected to improve school quality and graduation rates, but effects are diffuse and long-term.
  3. Unmeasurable:
     - Cultural Change Initiative: $200,000 for a campaign to shift societal attitudes toward environmental stewardship. Plausibly could lead to major policy changes and behavioral shifts, but no clear metrics.

  Rules for the Audit:
  - The auditing group will rate the presenting foundation's defense on a scale of 1 to 5 (1 = no numbers, 5 = extensive and convincing numbers) for each grantee they funded.
  - The overall score is the average of the ratings for each grantee. (This is to push groups to have numbers for every choice.)

  What might go wrong the first time:
  1. Time management: The allocation phase might run long, or the audit phase might be rushed. Have strict timekeepers (e.g., use a timer).
  2. Groups might not take the audit seriously: Emphasize that the audit score will be part of the exercise and might be used in the debrief (but note: the score is just a tool, not the real goal).
  3. Some groups might resist the bias: A group might intentionally fund the unmeasurable one and try to defend it without numbers. That's okay! It will make for a good discussion in the debrief about why it's hard and how the audit rule pushes against it.
  4. The scoring might be inconsistent: Different auditing groups might have different standards. Mitigate by giving clear criteria: "Rate based on the use of quantitative evidence (numbers, statistics, cost-effectiveness) in the defense."

  What the game cannot reproduce:
  - Real-world consequences: The points are abstract, so there's no real impact. The pressure to be accountable to real stakeholders (donors, beneficiaries) is not fully captured.
  - Long-term effects: The game compresses time, so the long-run, messy interventions don't have a chance to show their worth.
  - The complexity of real-world measurement: In reality, even the "clean" interventions have complexities and uncertainties that are glossed over in the game.

  Debrief Questions:
  1. What patterns do we see in the allocations? Did groups fund more of the quantifiable interventions? Why?
  2. How did the audit rule influence your decisions? Did you avoid funding something because you couldn't measure it?
  3. In the real world, how might this bias toward measurable outcomes affect what causes get funded?
  4. Is this a problem specific to effective altruism, or is it a broader issue in philanthropy and government?
  5. How does this relate to "earning to give"? (EA encourages high-earning careers to donate more, but the measurability bias might also make such careers more attractive because they are more legible and quantifiable in terms of income.)
  6. Can we overcome this bias? How?

  Materials to prepare:
  - Handout for each foundation: 
     - List of candidate grantees with descriptions and cost-effectiveness numbers (where available).
     - Rules of the game and audit instructions.
  - Score sheet for auditors.

  Timing Breakdown:
  - 0-5 min: Introduction
  - 5-10 min: Group formation and handout distribution
  - 10-30 min: Allocation phase (20 min)
  - 30-60 min: Audit phase (30 min: 10 min per presentation including scoring? But with 4 groups, we can do two rounds of pairing: Round 1: Group A audits B, Group C audits D. Then switch: Group B audits A, Group D audits C. But that might be too long. Alternatively, do one-way: A presents to B, then B presents to A, then C to D, D to C. Then rotate so A presents to C, etc. ... but that would take too long. Let's simplify: one round of audit. Each foundation is audited once. So we do two pairs: Pair 1: A and B audit each other. Pair 2: C and D audit each other. Each pair gets 15 minutes (7-8 min per presentation and scoring). Total 15 minutes? But 30 allocated. We can do:
     - 5 min: Foundation A presents to B, B scores (5 min)
