  After you allocate your points, you will be paired with another foundation. You will present your allocation decisions to them in 3 minutes. Then, they will have 2 minutes to ask questions and assign a score for your defense.

  Scoring:  
  The auditing group will assign a score from 1 to 5 for each grantee you funded, based on how well you defended that choice with quantitative evidence (numbers, statistics, cost-effectiveness). The overall defense score is the average of these per-grantee scores.

