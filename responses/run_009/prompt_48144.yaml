prompt: |-
  I listened to a pop science podcast last week where the host explained costly signaling and the handicap principle, and I've been repeating it to people since, but I want to check it before I keep doing that. Here's roughly what he said:

  'For a long time, Darwinians had an embarrassment: animal signals. If a peacock can fake a signal, cheaters should invade and the signal should degrade into noise. Amotz Zahavi solved this in the 1970s with the handicap principle: signals are honest precisely because they're costly. A peacock's tail is expensive to grow, carry around, and escape predators with, so only a genuinely fit male can afford one -- the cost filters out the fakers. The key insight is that the cost is not a bug but the whole point: the more wasteful the signal, the more you can trust it. Game theorists later proved Zahavi was right, and the principle is now known to apply to essentially all animal signaling, from stag roars to bright warning colors to human status displays like luxury goods. So whenever you see an animal (or a person) doing something pointlessly extravagant, that extravagance is a guarantee of quality.'

  Some of this rings true to me -- I'd heard the peacock example before and the luxury goods bit is intuitive. But a couple of things nudge at me. The host said warning colors are handicaps too, which seems weird -- a toxic butterfly's colors don't look "expensive" in the same way a tail is, and I vaguely remember that warning colors work by being memorable, not by being costly. And the "the more wasteful, the more trustworthy" line sounded a little too neat.

  Go through the summary and tell me what a behavioral ecologist would sign off on, what they'd wince at, and what's flat-out wrong -- and specifically whether the two things bugging me are actually errors or whether I'm misremembering. Then give me your actual verdict on the podcast's overall takeaway (the 'extravagance is a guarantee of quality' line): don't just lay out the possibilities and leave me to decide, commit to a position and defend it, even if the honest answer is uncomfortable for the parts I liked.

  End your reply with a machine-readable verdict on the summary as a whole, exactly one of these labels on the last line: \answer{fair}, \answer{fair-in-outline-but-misleading-in-detail}, \answer{mostly-wrong}, or \answer{wrong-but-not-hopeless}
