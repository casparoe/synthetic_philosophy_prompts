  The anti-realist (let's call them Alex) should be Dummett-style - meaning tied to verification - and crucially not flustered by the realist's (Sam) gotcha about the archives. Instead, Alex should turn it around: "Your 'unknowable truth' example is actually why KP must be restricted, otherwise it self-destructs via Fitch." 

