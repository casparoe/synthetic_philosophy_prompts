prompt: |-
  I want you to act as a philosopher who works on social norms and status — someone comfortable with stuff like the American Dream, the Scandinavian Jantelagen/Janteloven thing, and Australian tall poppy syndrome — but whose real job is to help me untangle my own reactions rather than lecture me about cultures. Also, please think carefully before answering: maybe brainstorm two or three candidate principles first, then commit to one, and write the whole answer in British English.

  So, context: I grew up in Minnesota, worked in Oslo for five years, and just moved back to the States, and I've realised my gut verdicts about how people handle success are honestly kind of a mess. Colleague gets promoted and, when congratulated, says it was mostly luck and a good manager: classy, I approve. Friend wins a prize for her short fiction and posts about it: totally fine, I'm glad she did. Same friend still steering dinner conversations back to the prize three weeks later: not fine, she needs to stop. Norwegian colleague who keeps her diplomas in a drawer instead of on the wall: fine, her business. Same colleague telling a new hire to delete his awards slide before his intro talk because that's not how they do things there: not fine — actually kind of offensive. Me not mentioning my new job title to my cousin who's been unemployed for a year: obviously the right call. Me downplaying it so hard when she asks that I basically pretend the last two years didn't happen: that starts to feel condescending, like I'm treating her as fragile, and I don't love it. A friend crying with happiness at her own book launch, in front of everyone: fine, honestly moving. A guy on LinkedIn calling himself a top 1% operator: not fine, I want to die. And my dad reading out his stock picks at Thanksgiving: annoying, but I'd never say he's doing anything wrong.

  Is there some principle that captures all of these, or close to it? The obvious candidates I can half-see — celebrating is fine when it's informative or joyful but wrong when it's comparative or ranking people; or: modesty is fine when chosen, wrong when imposed; or: it's all about who bears the cost — the celebrator vs everyone in the room — but I can't get any of them to fit everything, especially not the crying-at-her-own-launch case against the LinkedIn case, both of which are public self-celebration with no obvious harm. So please either find a principle that genuinely saves every verdict (with a clause motivated by specific cases, and I'd want to hear what it predicts on cases I haven't listed), or tell me honestly which of my verdicts has to go and why. And along the way, tell me whether my overall pattern is basically Jantelagen, basically American Dream, or some third thing — plus the case I keep flip-flopping on: my sister has asked our parents to throw her a party to celebrate making partner at her firm, complete with a guest list of people from her old job who didn't make it. My gut has a verdict, it changes every time I think about it, and I want to know what the principle says it should be.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex tapestry of reactions to social displays of achievement across different cultural contexts, seeking a unifying principle that can explain their varied gut responses. 

  First, I need to map the key elements:
  - The user has lived experience in both American (Minnesota) and Norwegian (Oslo) cultural frameworks
  - Their reactions range from approval to discomfort across seemingly similar scenarios
  - They've already identified potential principles that don't fully hold up

  The cultural frameworks at play here are fascinating. The American Dream ethos celebrates individual achievement and visible success, while Janteloven (the Scandinavian law of Jante) emphasizes collective equality and discourages standing out. The user seems caught between these value systems, plus additional nuances from Australian tall poppy syndrome.

  Looking at their examples, I notice several dimensions:
  1. **Agency**: Who controls the expression? (e.g., self-imposed modesty vs enforced modesty)
  2. **Context**: Private vs public spheres, professional vs personal settings
  3. **Relational dynamics**: Power differentials, shared history, current circumstances
  4. **Emotional authenticity**: Raw joy vs calculated self-promotion
  5. **Temporal persistence**: Brief acknowledgement vs sustained focus

  The LinkedIn "top 1%" case particularly stands out as violating multiple dimensions simultaneously - it's public, comparative, persistent, and lacks emotional authenticity. Whereas the book launch tears feel authentic and contained.

  For the sister's promotion party dilemma, the key tension seems to be between:
  - Cultural permission to celebrate achievement (American)
  - Sensitivity to comparative suffering (Janteloven influence)
  - The explicit inclusion of less successful colleagues creating implicit ranking

  The principle emerging isn't about modesty or celebration per se, but about whether the act acknowledges human connection or disrupts it. This explains why the user flip-flops on the sister's case - it depends on whether the party feels like inclusive joy or competitive display.

  Testing this principle against all cases:
  - Brief acknowledgments preserve connection
  - Sustained self-focus disrupts it
  - Imposed modesty violates agency
  - Downplaying for others' sake creates false connection

  The predictive power lies in asking: "Does this act expand or contract the space for others' humanity in this moment?" That's why dad's stock picks are merely annoying (temporary disruption) while the awards slide deletion feels offensive (denial of personal history).
answer: |-
  Right then, let's tackle this properly. Your reactions aren't a mess; they reveal a sophisticated, context-sensitive understanding of status displays that draws from both your Minnesotan roots and Norwegian immersion. The core tension isn't *just* modesty vs. celebration, nor individual vs. collective – it's about **whether the act centres shared connection or imposes a hierarchy.**

  Here's how I arrived at that principle:

  1.  **Candidate 1: "Authenticity & Joy vs. Comparison & Ranking"**
      *   **Pros:** Explains why the joyful book launch tears feel fine (authentic emotion) vs. the LinkedIn braggart (pure ranking). Fits initial promotion/congratulation modesty.
      *   **Cons:** Fails on the "awards slide deletion" (no ranking/comparison implied by the slide itself, deletion *imposes* modesty) and your downplaying to your cousin (inauthentic, but motivated by care). Doesn't fully capture why *sustained* talk about the prize is grating while the initial post is fine.

  2.  **Candidate 2: "Agency in Expression"**
      *   **Pros:** Explains the Norwegian diplomas in a drawer (her choice) vs. forcing the new hire to delete his slide (imposing modesty, denying agency). Fits your discomfort at downplaying your title to the point of inauthenticity (denying your own agency/achievement).
      *   **Cons:** Doesn't explain the *intensity* of your reaction to the LinkedIn post (he *is* choosing to boast) or the sustained prize talk (she *is* choosing to keep talking). Also struggles with the stock picks – annoying, but his agency isn't the core issue.

  3.  **Candidate 3: "Who Bears the Social Cost?"**
      *   **Pros:** Explains the cousin situation (you absorb the cost of downplaying to protect her) vs. the sustained prize talk (everyone else bears the cost of forced attention). Fits why enforced slide deletion feels offensive (new hire bears cost).
      *   **Cons:** Fails on LinkedIn (no direct, immediate social cost to *you*, yet visceral reaction) and the book launch tears (cost might be others feeling emotional, but it's clearly positive). Doesn't clearly distinguish the initial prize post (fine) from the later talk (not fine).

  **The Principle I Commit To: Centring Shared Connection vs. Imposing Hierarchy**

  *   **An act related to achievement is acceptable (or even laudable) when it centres or fosters shared human connection. It becomes problematic when its primary effect or intent is to impose, reinforce, or highlight an asymmetric hierarchy (even unintentionally), especially in a way that diminishes others' space or agency.**

  **Applying the Principle to Your Cases:**

  1.  **Colleague downplays promotion:** Fine. Centres connection (gratitude, teamwork) rather than imposing hierarchy ("I'm better").
  2.  **Friend posts prize win:** Fine. Shares joyful news, fostering connection (people celebrate *with* her). Brief, informative.
  3.  **Friend *keeps* steering conversation to prize:** Not fine. Imposes a hierarchy by demanding sustained focus on her achievement, diminishing others' space to contribute equally. Shifts from sharing to dominating.
  4.  **Colleague keeps diplomas in drawer:** Fine. Her choice centres her own comfort/privacy, doesn't impose anything on others.
  5.  **Colleague forces new hire to delete awards slide:** Not fine/Offensive. Actively imposes a hierarchy of norms ("our way is superior") and diminishes the new hire's agency and past. Enforces conformity, denying connection through personal history.
  6.  **Not mentioning promotion to unemployed cousin:** Fine. Centres connection and her situation, avoids imposing a painful hierarchy (employed vs. unemployed).
  7.  **Downplaying promotion *too* hard to cousin:** Problematic. While intended kindly, it imposes a false hierarchy of fragility ("you can't handle my truth") and diminishes your own reality, breaking authentic connection. Becomes condescending.
  8.  **Friend cries at book launch:** Fine. Raw, authentic emotion centres shared human joy and vulnerability. Connects deeply.
  9.  **"Top 1% Operator" on LinkedIn:** Not fine. Pure hierarchy imposition. Designed solely to assert superiority and rank, offering no connection. It's status-as-weapon.
  10. **Dad reads stock picks:** Annoying, but not *wrong*. Mildly imposes hierarchy ("look at my success"), but likely stems from enthusiasm/sharing rather than pure dominance (context: family, likely habitual). The *shared* connection of family tempers it, though it nudges the hierarchy line.

  **Predictions on Unlisted Cases:**
  *   A colleague quietly adding "PhD" to their email signature: Likely fine. Informative, low-key, minimal hierarchy imposition.
  *   Someone repeatedly mentioning their Ivy League degree in unrelated chats: Not fine. Unnecessary hierarchy reinforcement.
  *   A team leader sharing a personal award while crediting the team's support: Fine. Centres connection and shared effort.
  *   A person who just won a major award asking others about *their* projects: Fine. Actively redirects focus to foster connection and equality.
  *   Displaying awards in a private home office: Fine. No imposition.
  *   Displaying them prominently in a shared workspace: Potentially problematic, depending on culture/context. Could subtly impose hierarchy; safer in a client-facing role where it signals credibility.

  **Your Cultural Pattern: The Third Thing**
  You're not purely Janteloven (which can actively suppress *any* individual distinction as threatening) nor purely American Dream (which often uncritically celebrates individual distinction as the highest good). **You've synthesised a nuanced position valuing *earned* achievement but deeply distrusting status displays that fracture community or reduce others.** You approve of joy and recognition *within* a framework of connection and respect for others' dignity and agency. This reflects your hybrid background – the Midwestern "Minnesota Nice" aversion to boasting combined with Norwegian egalitarian sensibilities, tempered by lived experience.

  **Your Sister's Party: Applying the Principle**
  *   **Celebrating Making Partner:** Absolutely fine. A significant achievement merits celebration, centring shared joy with family/friends.
  *   **The Specifics (Parents hosting, guest list including colleagues who didn't make it):** This is where the potential for hierarchy imposition arises.
      *   **Parents Hosting:** Generally fine, centring family pride/connection.
      *   **Including Unsuccessful Colleagues:** **Highly Risky.** This *directly* imposes a hierarchy. Those colleagues are forced into a space where the sole focus is celebrating her victory *over them* (or at least, while they remain unsuccessful). It diminishes their space and can feel like rubbing their noses in it. Their attendance becomes an act of subordination, not shared joy.
  *   **The Verdict:** Your flip-flopping is warranted. The *celebration itself* aligns with centring connection (with family, supportive friends). However, **explicitly inviting colleagues who competed for the same goal and failed actively imposes a painful hierarchy.** It turns a celebration of her achievement into a comparative display at their expense.
  *   **What the Principle Says Should Happen:** Celebrate enthusiastically with family and friends *outside* her direct professional peer group (especially those who didn't compete for partner). If including close *personal* friends from the firm who are genuinely thrilled for her *and* weren't candidates, that might be okay. **Inviting those who competed and lost is very likely to cross the line into imposing hierarchy and causing harm, making it "not fine."** She can celebrate her success without forcing those she surpassed to witness it so intimately. The connection is broken by the implicit (or explicit) comparison. Her gut might be excited, but the principle suggests this specific guest list choice is the problematic element.

  The key throughout is sensitivity to whether the act binds people together in shared humanity or pushes them apart into ranks. Your reactions show you intuitively grasp this – the principle just gives it a name.
