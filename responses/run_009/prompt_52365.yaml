prompt: |-
  For my dissertation I'm modeling how a declining shorebird population responds to sea-level rise, and I've hit a fork my methods training never prepared me for. I have a small set of candidate models ranging from three parameters to nine, and the standard practice in ecology is to rank them with AIC and BIC. The two criteria disagree: AIC charges about 2 points per additional parameter, while BIC's charge grows with the logarithm of sample size, so with my 2,000 survey records BIC strongly favors the lean three-parameter model while AIC favors the nine-parameter one, and whether I report the sharp simple story or the complicated rich one may shape a real conservation listing decision. I want to understand what each scoring rule presupposes about Occam's razor itself, because the disagreement doesn't feel merely technical. BIC is usually derived as an approximation to a Bayesian marginal likelihood, and its penalty can be read as the log of the volume a model's extra parameters occupy — the same idea, pushed to its limit, that makes Solomonoff induction assign exponentially more prior weight to simpler hypotheses, and that ties simplicity to description length in the Kolmogorov sense. AIC, in contrast, is justified on grounds of expected predictive accuracy on new data, not truth, and its flat per-parameter charge doesn't depend on sample size at all. Reconstruct for me the implicit view of simplicity and of induction each rule carries: what BIC presupposes about whether there's a true model among my candidates and why simpler theories deserve higher prior probability; what AIC presupposes about the aim of statistical work; and which rival conceptions of Occam's razor each quietly rules out. Then tell me where the practice is genuinely underdetermined — whether an ecologist could accept the algorithmic, description-length view of simplicity and still have a principled reason to use AIC in some settings — and what my model-selection practice would have to look like if I took the Solomonoff-style picture wholesale.
reasoning: |-
  We are facing a fundamental question about model selection criteria and their philosophical underpinnings. The user is torn between AIC and BIC, which give different rankings for their candidate models. The heart of the matter lies in the implicit assumptions each criterion makes about simplicity, truth, and the goal of modeling.

  Let me break down the key points:

  1. **AIC (Akaike Information Criterion)**:
     - Derived from information theory (Kullback-Leibler divergence).
     - Aims for the best predictive accuracy on new data (asymptotically).
     - Penalty per parameter: 2 (so the penalty term is 2k, where k is the number of parameters).
     - Does not depend on sample size (n).
     - Does not assume that the true model is in the candidate set. Instead, it seeks the model that best approximates the true data-generating process in terms of prediction.

  2. **BIC (Bayesian Information Criterion)**:
     - Derived as an approximation to the Bayesian marginal likelihood (or Bayes factor) under specific prior assumptions.
     - Penalty per parameter: log(n) (so the penalty term is k * log(n)).
     - With n=2000, log(n) ≈ 7.6, which is much larger than AIC's 2 per parameter. Hence, BIC heavily penalizes complex models.
     - BIC assumes that the true model is among the candidate models and aims to select it with probability approaching 1 as n → ∞.
     - It embodies a Bayesian Occam's razor: simpler models (with fewer parameters) are assigned higher prior probability because they occupy less volume in the parameter space (or have shorter description length in the Kolmogorov sense).

  Now, the user's specific questions:

  **1. What does BIC presuppose?**
     - BIC presupposes that there is a true model in the candidate set. It is designed to select this true model with high probability as the sample size grows.
     - The penalty in BIC (k * log(n)) comes from the Laplace approximation of the marginal likelihood. The prior is implicitly uniform over the parameters, and the prior probability of each model is equal (or at least, the prior on models is not the driving force; the penalty comes from the integral over the parameter space). However, the effect is that models with more parameters are penalized more because the prior is spread over a larger volume. This leads to the idea that simpler models (with fewer parameters) are a priori more probable because they are more specific (have a smaller parameter space) and hence have a higher concentration of prior probability density for the same likelihood. This is the Bayesian Occam's razor.

  **2. What does AIC presuppose?**
     - AIC does not assume that the true model is in the candidate set. It is designed for predictive accuracy, even if all models are wrong. The goal is to find the model that minimizes the expected Kullback-Leibler divergence to the true distribution. Hence, it is more about approximation than truth.
     - The per-parameter penalty of 2 is fixed and independent of n. This reflects the idea that the cost of an extra parameter in terms of overfitting is constant per parameter, regardless of the sample size. However, note that in small samples, AIC is known to overfit, which is why corrected versions (like AICc) exist.

  **3. What conceptions of Occam's razor does each rule out?**
     - **BIC** rules out the idea that simplicity is only about current predictive performance. It ties simplicity to the idea of prior probability and truth. It is not just about avoiding overfitting for prediction but about the structure of the world (that simpler models are more likely to be true). It also rules out the idea that the goal of modeling is solely prediction; it is also about model identification.
     - **AIC** rules out the idea that we are searching for a true model. It is purely about prediction. Therefore, it does not give a higher prior probability to simpler models; it only penalizes complexity to avoid overfitting. It rejects the notion that simplicity is an end in itself (truth) and instead sees it as a means to better prediction.

  **4. Where is the practice underdetermined? Can an ecologist who accepts the algorithmic (description-length) view of simplicity use AIC?**
     - The choice between AIC and BIC is underdetermined by the data alone. It depends on the goal (truth or prediction) and on whether we believe the true model is in the candidate set.
     - An ecologist who accepts the algorithmic view (that simplicity is about description length and that shorter descriptions should have higher prior probability) would naturally lean toward BIC because BIC's penalty is aligned with the description length principle (each parameter adds about log(n) bits to the description). However, if the ecologist's primary goal is prediction (even if the model is wrong) and they do not believe the true model is in the set, then they might still choose AIC. Thus, the choice is not about the view of simplicity per se, but about the goal of the analysis. One can hold the view that simpler models are more likely to be true (and hence use BIC for model identification) but also recognize that for prediction, a more complex model might be better (and use AIC). The two criteria serve different purposes.

  **5. What would model selection look like if taking the Solomonoff-style picture?**
     - Solomonoff induction is a formalization of Occam's razor in algorithmic information theory. It assigns a prior probability to a hypothesis (model) that is proportional to 2^(-K(h)), where K(h) is the Kolmogorov complexity of the hypothesis (the length of the shortest program that computes it). In this framework, we would compute the posterior probability of each model given the data, which requires integrating over the parameters (like in Bayesian model selection) but also considers the complexity of the model itself (not just the number of parameters). 
     - In practice, however, we cannot compute Kolmogorov complexity. The closest we can get in parametric models is the use of the marginal likelihood (which BIC approximates) but with a prior that reflects the description length of the parameters. A fully Solomonoff-inspired approach would require:
          a. Assigning prior probabilities to models based on their complexity (e.g., by the number of bits needed to describe the model structure and parameters).
          b. Computing the marginal likelihood for each model (integrating over the parameters) and then the posterior.
     - This is computationally challenging and not feasible for most real-world models. However, BIC is a rough approximation to the log marginal likelihood (under specific priors). Therefore, using BIC is a step in that direction. But note that in the Solomonoff picture, the prior on models is not uniform; it is exponential in the model complexity. So if we were to take it wholesale, we would set the prior on model j to be proportional to exp(-c * K_j) for some constant c (where K_j is the complexity of model j). Then the log marginal likelihood (which BIC approximates) would be added to the log prior to get the log posterior.

     In summary, a Solomonoff-style model selection would look like Bayesian model selection with a strong prior favoring models with low Kolmogorov complexity. The penalty for model complexity would be built into the prior and would not depend on sample size in the same way as BIC (because Kolmogorov complexity is fixed and independent of n). However, the data term (the marginal likelihood) would still depend on n. The BIC approximation (with a penalty of k * log(n)) is a particular case when the model is parametric and the parameters are real numbers that we describe with a precision that depends on n (so each parameter costs about (1/2)*log(n) bits, leading to k*(log(n))/2 in natural logs, but note that the standard BIC penalty is k*log(n) in base e, which is the same as k*ln(n)). However, the Solomonoff prior would also include the complexity of the model structure (which might go beyond just the number of parameters).

  Given the above, the user must decide:

  - If they believe the true model is in the set and they want to identify it, then BIC is more appropriate.
  - If they care more about out-of-sample prediction and are skeptical that any of the models are exactly true, then AIC is more appropriate.

  In ecology, both goals are common. However, note that the user's data set is large (n=2000) so BIC's penalty is very strong. The three-parameter model may be too simple to capture the complexity of the system, but BIC will favor it because of the large n. On the other hand, if the true process is indeed simple, then BIC will be right. Without knowing the truth, the choice is philosophical.

  A practical middle ground is to consider the context of the conservation decision. If the simpler model is more easily interpretable and actionable, and if the complex model does not improve prediction substantially, then the simpler model might be preferred. Alternatively, one could use model averaging (either based on AIC or BIC weights) to incorporate model uncertainty.

  Finally, note that the user's sample size is large enough that the difference in penalty between AIC and BIC is stark. It might be worthwhile to check the predictive performance of the models via cross-validation (which is more computationally intensive but directly addresses predictive accuracy). Cross-validation does not make the same assumptions as either AIC or BIC and can be seen as a direct estimate of predictive accuracy.
answer: |-
  ### The Philosophical Underpinnings of AIC and BIC: Occam's Razor in Model Selection

  Your dilemma exposes a deep schism in statistical philosophy—one rooted in divergent views of simplicity, truth, and the goals of science. Let's reconstruct the implicit worldviews behind AIC and BIC, their conceptions of Occam's razor, and their practical implications for your shorebird conservation problem.

  ---

  #### **1. BIC's View: Simplicity as Truth-Seeking via Bayesian Occam's Razor**
  - **Core Presupposition**:  
    BIC assumes a **"true model" exists within your candidate set** and aims to identify it asymptotically. It embodies a Bayesian interpretation of Occam's razor: simpler models deserve higher *prior probability* because they are more falsifiable.  

  - **Why Simplicity Gets Higher Prior Probability**:  
    - BIC approximates the log marginal likelihood \( \log p(\text{data} | M_k) \) under a unit information prior.  
    - The penalty \( k \cdot \log(n) \) reflects the **logarithmic volume of parameter space**: each added parameter exponentially expands the space of possible theories. Simpler models concentrate prior mass more densely, making them easier to falsify and hence more probable *a priori*.  
    - This aligns with Solomonoff induction: shorter programs (shorter description lengths) have higher algorithmic prior probability. Kolmogorov complexity formalizes this—simplicity is minimization of computational resources needed to describe a hypothesis.  

  - **What BIC Rules Out**:  
    - Rejects the idea that models are merely "useful approximations." BIC presupposes a **Platonic reality** where a true model exists.  
    - Denies that predictive accuracy is the sole goal. If prediction were paramount, BIC's sample-size-dependent penalty would be unjustified.  

  ---

  #### **2. AIC's View: Simplicity as a Tool for Prediction**
  - **Core Presupposition**:  
    AIC assumes **no true model exists** (or it is unknowable) and seeks the best *approximating model* for prediction. It penalizes complexity only to avoid overfitting, not to reward truth.  

  - **The Aim of Statistical Work**:  
    AIC minimizes the Kullback-Leibler divergence between the model and the true data-generating process. Its goal is **maximizing out-of-sample predictive accuracy**, irrespective of whether the model is "true." The flat penalty of 2 per parameter reflects the expected overfitting cost under large-sample asymptotics.  

  - **Why Sample Size Doesn't Matter**:  
    - AIC's penalty is derived from information theory, not Bayesian probability. Each parameter risks inflating variance, but this risk is asymptotically independent of \( n \).  
    - In AIC's worldview, simplicity isn't about *truth*; it’s about **generalizability**. Complex models may be true, but they overfit finite data.  

  - **What AIC Rules Out**:  
    - Rejects the notion that simplicity correlates with truth. AIC is agnostic (even skeptical) about "true models."  
    - Denies that prior probabilities over models are meaningful. Unlike BIC, AIC has no Bayesian interpretation.  

  ---

  #### **3. Can an Algorithmic Simplicity Advocate Use AIC? Principled Reconciliation**
  Yes—but only if prediction, not truth, is the goal. Here’s how:  
  - **Step 1: Accept Description Length as a Prior**. If you believe simpler models *are more likely true* (Solomonoff), use BIC for **model identification** (e.g., uncovering biological mechanisms).  
  - **Step 2: Switch to AIC for Prediction**. If your aim is **conservation decision-making** (e.g., forecasting population collapse under sea-level rise), use AIC. Complex models may capture nuances critical for accurate predictions, even if they are "less probable" in a Kolmogorov sense.  
  - **Why This Isn't Hypocritical**:  
    Algorithmic simplicity concerns *truth*, while AIC concerns *utility*. Conservation decisions often prioritize reliable predictions over "truth" (e.g., a 9-parameter model may better capture habitat thresholds crucial for extinction risk).  

  ---

  #### **4. What Would Solomonoff-Style Model Selection Look Like?**
  If you fully embrace the algorithmic view:  
  - **Model Prior**: Assign prior \( P(M_k) \propto e^{-K(M_k)} \), where \( K(M_k) \) is the Kolmogorov complexity of model \( M_k \). Simpler models (e.g., 3-parameter) get exponentially higher priors.  
  - **Parameter Prior**: Use a universal prior (e.g., Rissanen’s MDL) for parameters within each model.  
  - **Selection Criterion**: Maximize the **log marginal likelihood** \( \log p(\text{data} | M_k) \), approximated by BIC *plus* a \( \log P(M_k) \) term. BIC alone assumes uniform \( P(M_k) \); Solomonoff relaxes this.  
  - **Practical Reality**: Kolmogorov complexity is uncomputable. You’d approximate by:  
    - Using BIC with non-uniform model priors (e.g., \( P(M_k) \propto 2^{-\text{description length of } M_k} \)).  
    - Penalizing not just parameters, but model structure (e.g., nonlinearities, interactions).  

  ---

  #### **5. Where Practice is Genuinely Underdetermined: Your Conservation Context**
  - **The Fork in the Road**:  
    - BIC’s 3-parameter model gives a "sharp story": easy to communicate, politically actionable, but risks missing key dynamics.  
    - AIC’s 9-parameter model offers a "rich story": potentially more accurate for management, but vulnerable to overfitting and complexity costs.  
  - **No Statistical Silver Bullet**:  
    Neither criterion is "correct." Your choice depends on:  
    - **Goal**: Truth (BIC) vs. prediction (AIC).  
    - **Stakes**: Underestimating extinction risk (leaning on BIC) vs. overcomplicating conservation (leaning on AIC).  
    - **Epistemology**: Do you believe shorebird dynamics *are* simple? Or is reality irreducible?  

  ---

  ### **Recommendations for Your Dissertation**
  1. **Run Both, But Justify Contextually**:  
     - Report BIC if emphasizing *mechanistic truth* (e.g., "sea-level rise affects shorebirds via tidal inundation, not salinity").  
     - Report AIC if prioritizing *risk forecasts* (e.g., "model with habitat covariates predicts 40% decline by 2050").  

  2. **Validate Predictively**:  
     Use cross-validation (CV) to test models on held-out data. AIC targets CV-like goals; if the 9-parameter model predicts better, it validates AIC’s choice.  

  3. **Admit Uncertainty**:  
     Use model averaging (AIC or BIC weights) to blend predictions. If BIC weight > 0.9, the simple model dominates; if AIC weights are split, complexity adds value.  

  4. **Philosophical Transparency**:  
     State explicitly:  
     > "BIC selects for simplicity as a proxy for truth; AIC for predictive accuracy. Conservation decisions require both."  

  Your methods training didn’t fail you—it revealed that statistics, at its core, is a negotiation between the knowable and the useful. In ecology, where stakes are life-or-death, that negotiation is where science meets wisdom.
