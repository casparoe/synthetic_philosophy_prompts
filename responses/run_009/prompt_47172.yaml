prompt: |-
  I moderate a medium-sized internet forum, and over several years I have kept noticing something about the way slurs work that I cannot put my finger on. I have no training in philosophy or linguistics; I have simply been thinking about it on my own, and I would like to know whether there is an established concept for what I am seeing.

  The pattern, in instances. First: a member quoted a slur inside a post whose whole point was to argue that the word should be banned from the forum — the slur was not aimed at anyone, merely displayed, in inverted commas — and the thread still blew up. A month later another member did much the same thing, quoting a court ruling, and nobody minded. The same word, equally mentioned rather than used, and opposite verdicts. Second: a long-standing member who belongs to the group the term targets uses it about herself and her friends all the time, and no one blinks; the identical sentence from a newer member got him banned within the hour. Third: when our book club reads older novels containing the word, whoever reads aloud substitutes a euphemism or skips it, and everyone understands perfectly well which word is meant and learns exactly as much as they would have from the original — yet the substitution feels compulsory, and the euphemism feels different in kind from the word itself, not merely politer. Fourth: I once tried to write forum rules distinguishing mentioning a slur from using one, and discovered that both reactions to mere mentions are stable and sincere — some readers are wounded by the bare appearance of the word on a screen, and others genuinely cannot see the problem as long as it is in quotation marks, and neither group is confused about what happened.

  What I have come to believe, from my own reflections, is that the offence does not live in what the word means. You can convey the whole content of a slur with neutral vocabulary — you can state someone's ethnicity and add open contempt, and the result is vile, but it is somehow not the same act as slurring him. Indeed you can swap the slur for its polite counterpart and the sentence stays true or false in exactly the same situations, yet the two utterances are not interchangeable. Nor does the offence live purely in the letters, as case two shows. And it does not track the speaker's actual beliefs: sincere people produce the full effect, while bigots hiding behind polite euphemisms produce a different and, I want to say, lesser one. It is as though the word carries a deed rather than a description, and the deed is performed in some mouths and suspended in others, without the dictionary changing at all. For want of a better word I have privately been calling this the residue — the part of a slur that outlives quotation.

  A friend with some linguistics behind her says this is simply the difference between what a sentence says and what uttering it does — the way saying 'I promise' does not describe a promise but performs one. But that cannot be the whole story, because quoting a promise is not promising, whereas quoting a slur still seems to leave the residue, at least for some people. So the speech-act idea fits my first and third cases badly.

  What I would like to know, then, is whether there is an established notion of this thing — the deed a slur performs over and above stating its content, and why that deed survives quotation in some circumstances and not others. I am not after a bare label. If there are rival accounts of where the offence actually lives — in the word itself as a kind of taboo object, in the attitude it expresses, in something it assumes about whoever is willing to say it and to whom they are saying it, in the act of uttering it at all — I would like to see how each one fares against my four cases, especially the mention cases, where the speech-act explanation seems to me to fail. If the phenomenon straddles several concepts without being identical to any of them, I would like to be told where the edges are and what the residual difference is. Please answer in British English.
reasoning: |-
  Okay, this user is a forum moderator grappling with the complex dynamics of how slurs function in their community. They've observed four key scenarios where the "rules" of offensive language seem contradictory: quoted slurs causing different reactions, in-group vs out-group usage, substituted words in literature, and failed attempts to codify mention/use distinctions. 

  What's fascinating is how they've independently arrived at a sophisticated linguistic insight - that slurs carry a "deed" beyond mere meaning, which they call the "residue." Their rejection of pure speech-act theory (since quoted slurs still offend) shows real intellectual rigor. 

  The core challenge seems to be unpacking why identical utterances have different social consequences based on context. Their examples reveal at least three dimensions in tension: linguistic structure (mention vs use), speaker identity (in-group privilege), and medium constraints (written forum vs spoken book club). 

  I recall that philosopher Rae Langton's work on hate speech might help here - she distinguishes locutionary content (dictionary meaning), illocutionary force (what's done by speaking), and perlocutionary effect (emotional impact). The user's "residue" concept maps neatly to illocutionary force. 

  But their data complicates things: Why does illocutionary force sometimes survive quotation marks? Judith Butler's notion of words as "repeated ritual acts" could explain this - the historical weight of slurs makes them re-enact oppression regardless of speaker intent. Meanwhile, in-group reclamation (like queer communities using "queer") shows context can reshape that force. 

  The British English requirement suggests sensitivity to regional linguistic norms. I should avoid American academic jargon - "perlocutionary" might need unpacking. The user clearly wants practical application, not just theory. 

  Their moderation attempts reveal a deeper need: operational rules for handling slurs. But their cases prove context defies codification. Maybe the answer lies in distinguishing constitutive harm (inherent in utterance) from derivative harm (context-dependent) - though both matter for moderation. 

  The book club example is particularly telling: euphemisms transmit identical semantic content without the illocutionary violence. This suggests the harm isn't in the information but in the ritual enactment. Hence why marginalized groups may "perform" reclamation while outsiders cannot. 

  Ultimately this user needs frameworks to explain inconsistent community reactions. I'll structure the response around three key concepts: illocutionary force, context collapse in online spaces, and reclamation dynamics - using their examples as test cases for each theory.
answer: |-
  You've articulated a profound linguistic phenomenon with remarkable clarity, and your "residue" concept is perceptive. This touches on several interconnected philosophical and linguistic theories. I'll address your cases using established frameworks, highlighting where they align and where your observations reveal deeper complexities.

  ### Core Concepts
  1.  **Illocutionary Force vs. Locutionary Content:** Your friend is partially right about speech acts (from J.L. Austin and John Searle). The core idea is that utterances *do* things (illocutionary act - e.g., insulting, warning, promising) beyond just stating facts (locutionary act - the propositional meaning).
  2.  **Slurs as Pejoratives:** Slurs are understood to carry a complex "meaning" combining:
      *   **Descriptive Content:** Identifying group membership (e.g., referencing race, gender, sexuality).
      *   **Expressive/Attitudinal Content:** Expressing contempt, hatred, or derogation towards that group.
      *   **Prescriptive Force:** Often signalling that the target *ought* to be treated with contempt or as inferior.
  3.  **Speaker Authority & Licensing (Christopher Hom, Luvell Anderson):** Who says it matters profoundly. Marginalised group members can sometimes "license" the use or mention of a slur without activating its full derogatory force, in specific contexts (e.g., reclamation, in-group discussion). Outsiders lack this license.
  4.  **Perlocutionary Effects:** The actual consequences of the utterance (e.g., causing offence, inciting fear, provoking anger). This is highly dependent on the hearer/reader and context.
  5.  **Taboo & Phonetic Salience (Erin Potts):** The word itself becomes a potent, taboo symbol due to its historical and social association with violence and oppression. Its mere visual or auditory form can trigger distress independently of the speaker's intent.

  ### Analysing Your Cases with These Concepts

  1.  **Quoted Slur - Different Reactions:**
      *   **Case 1 (Blow-up):** The word's **taboo nature** and **phonetic salience** were triggered. The context (arguing *about* the slur) heightened sensitivity. Crucially, the speaker (likely an outsider) lacked **license** to utter it, even in quotes. The **illocutionary act** (exposing readers to a violent symbol) overshadowed the locutionary intent (discussing the word).
      *   **Case 2 (No reaction):** The context (quoting a formal legal document) provided **institutional framing**. This shifted the focus to the locutionary content (the ruling itself) and momentarily suspended the word's typical illocutionary force as a direct insult. The **source authority** (the court) provided a form of license for the *mention* in this specific, neutral context. The perlocutionary effect was mitigated.
      *   **Why Speech-Act Theory *Alone* Fails:** It struggles to explain why the *same* illocutionary act (mentioning) has such different effects. **Taboo** and **speaker/hearer context** (license, framing, sensitivity) are crucial additions.

  2.  **In-Group vs. Out-Group Use:**
      *   **Long-standing Member:** Possesses **speaker license** as an in-group member. Their utterance performs a *different* illocutionary act: **reclamation** (asserting ownership, defiance, in-group solidarity) or neutral description within their community context. The descriptive content remains, but the expressive content (contempt) is absent or inverted.
      *   **New Member:** Lacks license. Their utterance performs the **canonical derogatory illocutionary act**: expressing contempt and prescribing inferior status based on group membership. The **perlocutionary effect** (offence, threat) follows inevitably.
      *   **The Residue:** The *phonetic form* is identical, but the **illocutionary force activated** and the **license to activate it** are fundamentally different. The residue *is* the canonical derogatory force, which the outsider activates simply by uttering the word without license.

  3.  **Book Club Euphemism:**
      *   **Why Euphemism Works:** It conveys the **locutionary content** (the group reference and often the derogatory *intent* of the original speaker/character) without activating the **taboo symbol** or the canonical **illocutionary force** (direct hate speech) in the *current* context. It describes the historical act of slurring rather than re-performing it.
      *   **Why Substitution Feels Compulsory:** Uttering the slur itself would:
          *   Violate contemporary **taboo**.
          *   Risk performing the canonical derogatory illocutionary act in the *reader's* voice, lacking license and historical context.
          *   Cause significant **perlocutionary harm** (distress) to hearers due to the word's phonetic salience and association with trauma.
      *   **Difference in Kind:** The euphemism *reports* or *describes* an act of derogation. The slur, when uttered, *performs* the act of derogation (or risks performing it). The residue is the *performative potency* of the slur itself.

  4.  **Failed Rule-Making (Mention vs. Use):**
      *   **Group Wounded by Appearance:** They react primarily to the **taboo nature** and **phonetic salience** of the word. Its presence triggers trauma or signals a hostile environment, regardless of intent ("mention"). The word itself is seen as a violent act or symbol.
      *   **Group Seeing No Problem in Quotes:** They focus primarily on the **locutionary intent** ("mention") and the speaker's **illocutionary intent** (not to insult). They believe the framing suspends the canonical illocutionary force.
      *   **Sincerity & Stability:** Both perspectives are valid within their frameworks. The first group experiences **perlocutionary harm** directly from the symbol. The second group focuses on intentional **illocutionary acts**. The residue manifests as harm for one group and mere reference for the other.

  ### Where the Offence Lives: Rival Accounts & Your Residue

  *   **In the Word Itself (Taboo Object):** Explains phonetic salience reactions (Book Club, Mention Group 1). Fits well. *But* fails to explain why in-group use *doesn't* always cause offence or why euphemisms convey the *idea* without the same impact.
  *   **In the Attitude Expressed:** Explains the core derogatory intent. Fits canonical out-group use. *But* fails to explain why quoting it (where the attitude isn't the speaker's) still harms some, or why in-group use expresses a *different* attitude. Doesn't fully capture the residue's persistence in mentions.
  *   **In the Speaker's Identity/Status (License):** Crucial for explaining Cases 2 & 3. Explains *who* can suspend or reshape the residue. Fits well with the asymmetry you observe.
  *   **In the Act of Utterance (Speech Act - Illocution):** Captures the core "deed" aspect of your residue – the act of derogating. Explains the fundamental difference between stating contempt and *slurring*. *But* struggles with quotes and context shifts (Case 1, Book Club) where the canonical illocution seems partially activated or avoided.
  *   **In the Effect on the Hearer (Perlocution):** Explains the differing reactions in Case 1 and the rule-making dilemma. Acknowledges the reality of harm from the symbol itself. Fits well.

  ### Synthesising Your "Residue"

  The offence or "residue" isn't a single thing; it's a *constellation* arising from:

  1.  **The Word's History & Symbolism:** Its entrenched association with oppression and violence makes it a potent, taboo-laden symbol (Phonetic Salience/Taboo).
  2.  **Its Conventional Illocutionary Force:** Its primary function *is* to derogate, subordinate, and express hatred. This "default setting" is powerful.
  3.  **Context & Speaker License:** Context (quoting a court vs. discussing banning) and speaker identity (in-group vs. out-group) determine whether the *default illocutionary force* is **activated**, **suspended**, **mitigated**, or **reclaimed**. This is why the residue seems to "survive" in some mentions (by outsiders in sensitive contexts) and not others (in-group, formal quotes).
  4.  **Hearer Vulnerability & Experience:** For those historically targeted, the word carries immense perlocutionary power; its appearance can be an assault regardless of speaker intent. Their reaction *is* part of the residue's reality.

  **Why the Speech-Act Idea Fits Your Cases Badly:** Pure speech-act theory focuses on the speaker's illocutionary *intent*. Your cases show the residue persists or vanishes based on factors *beyond* intent: the word's inherent toxicity (taboo), the speaker's social position (license), the framing context, and the hearer's experience. The residue is the *potential* for the canonical derogatory act inherent in the word, which is *triggered* or *suppressed* by context, speaker, and hearer. Quoting doesn't *always* suspend it because the word's symbolic power and conventional force can overwhelm the quotational frame, especially when uttered by someone without license in a context where harm is likely.

  ### Conclusion

  Your "residue" is best understood as the **conventional derogatory illocutionary force** of the slur, compounded by its **taboo nature as a symbol of historical violence**, whose activation and impact are modulated by **speaker license and contextual framing**, resulting in **varying perlocutionary effects**. No single concept perfectly captures it because it operates at the intersection of semantics, pragmatics, social power, history, and individual psychology.

  Key established concepts explaining facets of it:
  *   **Illocutionary Force** (the core "deed")
  *   **Expressive Content / Prescriptive Force** (the attitude & command)
  *   **Speaker Authority / Licensing** (why who says it matters)
  *   **Taboo & Phonetic Salience** (why the word itself hurts)
  *   **Perlocutionary Effect** (the resulting harm)
  *   **Reclamation** (how in-groups reshape the force)

  You've identified a core truth: slurs are not just words with meanings; they are linguistic embodiments of historical and ongoing social violence. Their power – the residue – lies in their ability to invoke that violence, intentionally or not, depending on the complex interplay of speaker, word, context, and hearer. Your forum moderation challenge reflects the real-world difficulty of managing this potent and context-sensitive linguistic power.
