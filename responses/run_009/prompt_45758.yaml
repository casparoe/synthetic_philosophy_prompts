prompt: |-
  I have no background in philosophy or statistics — I work in construction management and think about this sort of thing on my own time — so please keep the language plain throughout.

  Here's what I've been chewing on. Some years ago I ran across an old mathematical result about voting, usually called the jury theorem: if a large group votes yes-or-no on a question with a definite right answer, and each individual voter is just slightly more likely than a coin flip to be right — say 51% — then the majority is very likely to be correct, and its reliability approaches certainty as the group grows. I accept that the arithmetic is fine, so my question isn't about the math. It's about whether the conclusion describes anything in the real world.

  Three things bother me. First, the fine print apparently requires voters' mistakes to be independent of one another, and I can't see how that survives contact with reality: if a million people all formed their views from the same handful of sources, they will be wrong together, and the million looks like one person counted a million times. Second, the competence condition: on a genuinely hard question I can imagine the average voter sitting below 50%, and I gather that makes the theorem run in reverse — the majority becoming nearly certain to be wrong. Third, and this is my own wrinkle: most of what large groups actually vote on doesn't look like a question with a definite right answer at all, so I suspect the whole apparatus quietly only covers trivia, and that where it matters most the "right answer" may be something nobody in the crowd is well placed to see.

  So here is what I want from you. My friend, who trusts the crowd, puts the probability at 0.9 that in a real referendum of a million ordinary people on a hard but factual question — say, which of two proposed safety regulations would actually save more lives — the majority would land on the true answer. I put it at about 0.5, mostly because of the independence worry. Give me your own number, but the number is the least of it: decompose the estimate into the terms it rests on — the chance that typical voters on such a question are even slightly better than chance, the chance that their mistakes are correlated enough to swamp the group size, how much it matters that the right answer may be practically undiscoverable, and anything else you think belongs — assign each term a rough probability with a one-line justification, and show how they combine into your figure. Then tell me which single term my friend and I most likely disagree about, and what evidence of the kind I could realistically get without being a researcher would move your number the most. Please keep the entire answer under 450 words, and give your final number in the first sentence.
reasoning: |-
  Alright, let's tackle this step by step. The user is in construction management and thought about the jury theorem on their own. They have three main concerns: independence of voter errors, average voter competence below 50%, and whether questions have definite right answers. 

  First, they mentioned that if everyone gets information from the same sources, errors aren't independent. That's a valid point. In real life, media and social networks create shared biases, so mistakes are correlated. Even with a million people, if they all follow the same news, it's like one opinion amplified. 

  Second, the competence condition. On hard questions, like complex safety regulations, the average person might not understand the details. If the average voter is below 50% competent, the theorem backfires. The user suspects that in such cases, the majority is more likely wrong. 

  Third, many issues don't have clear right answers. The user thinks the theorem might only apply to trivia. For important matters, the correct answer could be elusive, making the whole framework inapplicable. 

  The user's friend believes the majority is correct 90% of the time in a referendum. The user is skeptical, estimating 50%. They want a decomposed probability with justifications. 

  Breaking it down:
  1. **Competence above 50%:** On a hard factual question, what's the chance the average voter is better than a coin flip? Maybe 30%. Justification: Technical issues like safety regulations require expertise most lack. 

  2. **Error Independence:** Even if voters are competent, how likely are errors independent? Low, say 10%. Shared information sources create common biases. 

  3. **Definable Truth:** Is there a clear right answer? Probably 70% for factual questions, but real-world complexities might obscure it. 

  Combining: Start with competence. If voters aren't competent (70% chance), the majority is likely wrong. Even if competent (30%), non-independence (90% chance) can cause correlated errors. So, the probability of majority correctness is low. The user's 0.5 estimate seems reasonable. 

  The key disagreement is likely about independence. The user sees media influence as a major issue, while the friend might overlook it. To check, the user could examine media diversity on past referendum topics. If a few outlets dominated, that supports the correlation concern. 

  Final probability: 0.3. This reflects the low competence and high correlation risks in real-world scenarios.
answer: |-
  **Final number: 0.3**  

  Here’s the decomposition:  
  1. **Typical voters >50% competent?**  
     Probability: 0.3  
     Justification: Hard factual questions (e.g., engineering trade-offs) require expertise; laypeople often guess near randomly.  

  2. **Mistakes correlated enough to swamp group size?**  
     Probability: 0.9  
     Justification: Real voters share media/social influences, creating herd errors; independence is theoretical.  

  3. **"Right answer" practically undiscoverable?**  
     Probability: 0.3  
     Justification: Factual questions *can* have truths, but complexity/ambiguity often obscures them.  

  **Combination:**  
  - Competence failure (1–0.3 = 0.7) implies majority likely *wrong*.  
  - Even if competent (0.3), non-independence (0.9) often ruins the benefit.  
  - Undiscoverable truth (0.3) further reduces confidence.  
  Net: Majority correct only if all align favorably: ≈0.3.  

  **Key disagreement:** Likely **error independence** (your worry). Your friend may underestimate how shared biases (e.g., media echo chambers) synchronize errors.  

  **Evidence you can gather:**  
  Check past referendums on technical issues (e.g., environmental laws). If majority outcomes consistently aligned with dominant media narratives—not expert consensus—it confirms correlation risk. News source diversity data is publicly accessible.  

