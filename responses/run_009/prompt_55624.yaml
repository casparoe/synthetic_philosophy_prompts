answer: |-
  Below is a structured desiderata list for a theory of pain's badness, incorporating your specified cases, distinctions, and methodological constraints. Each requirement includes the motivating case(s) and consequences of failure, followed by an analysis of tensions and a comparative scoring of three theories.

  ---

  ### **Desiderata for a Theory of Pain's Badness**
  1. **Explain Pain Asymbolia**  
     - **Case**: Patients feel pain (sensory intensity) but lack aversion (e.g., stroke patients smiling while reporting severe pain).  
     - **Failure Consequence**: If a theory cannot explain why the *same* sensory experience is sometimes bad and sometimes not, it risks misidentifying the source of badness (e.g., attributing it solely to sensation).  

  2. **Account for Dissociation of Intensity/Unpleasantness**  
     - **Case**: Pain science measures sensory intensity (e.g., "burning at 7/10") and unpleasantness (e.g., "distress at 3/10") separately; these can dissociate (e.g., morphine reduces unpleasantness but not intensity).  
     - **Failure Consequence**: A theory conflating sensory and affective dimensions cannot explain clinical/experimental dissociations, undermining empirical adequacy.  

  3. **Explain Chronic Pain Without Tissue Damage**  
     - **Case**: Fibromyalgia or phantom limb pain, where pain persists without ongoing nociception or pathology.  
     - **Failure Consequence**: Theories tying badness *only* to tissue damage representation (e.g., evaluativism) would mischaracterize these pains as "false alarms," neglecting their experiential reality.  

  4. **Accommodate Masochistic Contexts**  
     - **Case**: Nociception (e.g., impact play) experienced as pleasurable due to psychological context.  
     - **Failure Consequence**: If pain’s badness is intrinsic or imperative ("STOP!"), masochism becomes paradoxical. A theory must explain how context modulates badness.  

  5. **Include Emotional "Pains" (e.g., Grief)**  
     - **Case**: Heartbreak shares pain’s affective badness but lacks bodily location or sensory qualities.  
     - **Failure Consequence**: Overly sensory theories exclude analogous affective states, failing to unify "pain’s badness" across domains.  

  6. **Respect Sensory vs. Affective Distinction**  
     - **Case**: Neuroscience identifies separate neural pathways (e.g., S1/S2 vs. anterior cingulate cortex).  
     - **Failure Consequence**: Conflating these components obscures why interventions (e.g., hypnotism) can alter suffering without changing sensation.  

  7. **Distinguish Pain’s Badness from its Consequences**  
     - **Case**: Pain causes distress, disability, or depression—but is it bad *in itself* or due to downstream effects?  
     - **Failure Consequence**: Theories attributing badness *only* to consequences (e.g., impaired function) fail to explain why we seek pain relief even when consequences are manageable.  

  8. **Clarify Bodily Damage vs. Experiential Badness**  
     - **Case**: Tissue damage (e.g., unnoticed cancer) can be bad without pain, while pain (e.g., ritual piercing) can be "good" despite damage.  
     - **Failure Consequence**: Equating damage with experiential badness commits a category error; the theory must separate objective harm from subjective experience.  

  9. **Avoid Stipulation: Explain the Phenomenal-Badness Link**  
     - **Methodological Constraint**: The theory must *explain why* pain’s phenomenology feels bad (e.g., via its structure or content), not merely assert it.  
     - **Failure Consequence**: Stipulative theories (e.g., "pain is bad by definition") are circular and uninformative.  

  ---

  ### **The Pinch Point: Tensions Between Desiderata**  
  The **asymbolia challenge (1)** + **intrinsic badness intuition (7)** creates a core tension:  
  - If badness is intrinsic to pain’s phenomenology, asymbolics *should* find pain aversive—but they don’t.  
  - If badness is extrinsic (e.g., contextual), why does pain *typically* feel bad?  
  **Suspected Incompatibility**: No theory fully reconciles intrinsic badness with asymbolia without compromising empiricism or phenomenology. Imperativism handles asymbolia best but struggles with intrinsicness; evaluativism preserves intrinsicness but fails asymbolia.  

  ---

  ### **Scoring Three Theories Against Desiderata**  
  *(✓ = Satisfies, △ = Partially, ✗ = Fails)*  

  | **Desideratum**            | **Evaluativism** (Pain represents bodily damage *as bad*) | **Imperativism** (Pain commands action, e.g., "STOP!") | **Valence-Based** (Badness from general affective system) |
  |----------------------------|----------------------------------------------------------|-------------------------------------------------------|----------------------------------------------------------|
  | 1. **Pain Asymbolia**      | ✗ (Asymbolics represent damage but aren’t bothered)      | ✓ (Command ignored/decontextualized)                  | △ (Valence mechanism impaired)                           |
  | 2. **Intensity/Unpleasantness Dissociation** | △ (Unpleasantness tied to evaluation)              | ✓ (Command strength ≠ sensation intensity)            | ✓ (Valence independent of sensation)                     |
  | 3. **Chronic Pain w/o Damage** | ✗ (No damage to represent as bad)                     | ✓ (Commands persist erroneously)                      | ✓ (Valence mechanism dysregulated)                       |
  | 4. **Masochism**           | ✗ (Damage represented, but not evaluated as bad)         | ✗ (Command "STOP!" contradicts pleasure)              | ✓ (Context modulates valence assignment)                 |
  | 5. **Emotional "Pains"**   | △ (Requires stretching "damage" metaphor)                | △ (Commands lack bodily focus)                        | ✓ (Shared valence system)                                |
  | 6. **Sensory-Affective Distinction** | △ (Evaluation bridges both)                       | ✓ (Command = affective; sensation separate)           | ✓ (Valence = affective core)                             |
  | 7. **Intrinsic vs. Consequences** | ✓ (Badness in content)                              | △ (Badness in urgency of command)                     | ✗ (Badness extrinsic to pain)                            |
  | 8. **Damage vs. Experience**| △ (Risk of conflation)                               | ✓ (Commands ≠ damage)                                 | ✓ (Valence ≠ damage)                                     |
  | 9. **Non-Stipulative Link** | ✓ (Badness from evaluative content)                 | ✓ (Badness from imperative force)                     | △ (Link to pain phenomenology underspecified)            |

  **Key Takeaways**:  
  - **Evaluativism** struggles with **asymbolia (1)** and **masochism (4)** due to rigid representation of damage-as-bad.  
  - **Imperativism** handles dissociation **(2,6)** and chronic pain **(3)** well but clashes with **masochism (4)** and emotional pains **(5)**.  
  - **Valence-Based** best unifies physical/emotional pain **(5)** and masochism **(4)** but risks decoupling badness from pain’s specificity **(7,9)**.  

  **Suspected Insurmountable Tension**: Desiderata **1 (asymbolia)** and **7 (intrinsic badness)** likely cannot be *fully* reconciled without redefining "intrinsic" (e.g., as *dispositional* rather than necessary). Imperativism comes closest by locating badness in the command’s force, which can be contextually ignored.  

  Use this framework to expose trade-offs in theories and motivate your seminar’s critical discussion. For further refinement, consider adding desiderata concerning evolutionary function or social/cultural modulation of pain’s badness.
