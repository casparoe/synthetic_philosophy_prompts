answer: |-
  Here is the five-tier ranking for blame regarding the outbreak of World War I in July-August 1914:

  1.  **Primary Responsibility & Willingness to Risk Continental War:** Germany. They provided the unconditional "blank cheque" to Austria-Hungary, knowing it meant risking a widespread war, and initiated mobilization/full hostilities via the Schlieffen Plan before diplomacy was exhausted. (Blame rests primarily on key decision-makers - Kaiser Wilhelm II, Bethmann Hollweg, Moltke - *willing to risk war* and effectively *failing to stop* Austria-Hungary's aggression).
  2.  **Direct Initiator Seeking War:** Austria-Hungary. They deliberately crafted an ultimatum designed to be rejected by Serbia, declared war despite potential solutions, and actively sought a local conflict to crush Serbia, disregarding the wider consequences. (Blame lies heavily with the war party - Conrad, Berchtold - *wanting a war* against Serbia and *willing to risk* a wider conflict).
  3.  **Critical Escalator Willing to Risk War:** Russia. Their decision for full, early general mobilization (beyond partial mobilization against Austria), knowing it was considered an act of war by Germany, dramatically escalated the crisis and made a continental war nearly inevitable. (Blame focuses on Tsar Nicholas II and Sazonov - *willing to risk war* to defend Serbia/support France and *failing to stop* escalation through mobilization timing).
  4.  **Contributory Negligence / Failure to Restrain:** France and Britain. France offered strong, unconditional support to Russia ("blank cheque lite"), encouraging Russian intransigence and mobilization without exerting sufficient moderating influence. Britain failed to issue early, unambiguous warnings to Germany that intervention was certain, potentially emboldening German risk-taking. (Blame involves national policy stances and specific leaders - Poincaré/Viviani *failing to stop* Russian escalation; Grey *failing to stop* German aggression through clearer deterrence).
  5.  **Catalyst with Limited Control:** Serbia. The assassination of Franz Ferdinand by Bosnian Serbs (with some Serbian state complicity) provided the immediate trigger, and the government's partially evasive reply to the ultimatum gave Austria-Hungary its pretext. However, they lacked the power to single-handedly cause a world war and made last-ditch diplomatic efforts to avoid conflict. (Blame for the trigger involves rogue elements and state negligence, but the nation as a whole wasn't *wanting* or *willing to risk* a major European war; Pasic's government *failed to stop* the assassination plot).
