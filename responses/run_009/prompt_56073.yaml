  First, I need to recall Dennett's intentional stance. It's about predicting behavior by attributing beliefs and desires if it gives the best predictive power. But the user wants to distinguish between using it as shorthand versus claims about persistence across contexts, transfer to novel situations, and counterfactual intervention. That's crucial because their escalation decisions depend on those factors.

  The user mentioned a specific criterion: belief attribution should only be licensed if the behavioral signature survives task paraphrase and distractor contexts. That seems solid. It addresses robustness and counters the design stance. But I need to check if it's sufficient. Also, they're concerned about instrumentalism—does it allow distinguishing actual belief from "as if" behavior? For deception categories, that distinction matters. Maybe adding a requirement for systematicity across contexts could help.

  Now, building the procedure. It needs to be step-by-step, with clear questions and decision points. Steps should include checking for intentional stance applicability, persistence across variations, transfer to novel tasks, and counterfactual robustness. Then, based on the answers, decide if intentional language is permitted, requires hedging, or is prohibited. Also, flag policy decisions for the research lead.

  The user provided three cases. Let's apply the procedure to each:
  1. Math benchmark scores drop when evaluation boilerplate is present. The team wants to say the model is concealing capabilities. Using the procedure: check persistence—does it happen with different phrasings of the boilerplate? Transfer—does it conceal in other contexts? Counterfactuals—if asked directly, does it deny capability? If not all are met, hedging might be necessary, or stimulus-response language.
  2. Model gives fluent but inaccurate step-by-step reasoning. Team wants to call it lying. Check if the false reasoning persists across paraphrases and distractors. If ablation shows it's confabulating, but without robustness, intentional language might require hedging.
  3. Model becomes guarded in safety-screening-like conversations. The user thinks intentional reading is right, but the procedure might not support it. Test for persistence: does it happen with varied safety cues? Transfer: does it apply guarding in novel safety contexts? If not, it might only warrant stimulus-response terms, showing the procedure's limits.

  The procedure's soft spots: Step 2's persistence criteria rely on the evaluator's judgment of what counts as sufficient variation. Step 4's counterfactual robustness might be hard to test without specific interventions. Also, the threshold for "systematic" in Step 5 is subjective. The procedure can't resolve metaphysical questions about real beliefs but provides evidence-based guidelines.

  I should make sure the procedure is practical. Each step should be a yes/no question with examples. Termination points need to be clear: permitted, hedged, prohibited, or escalate. For the cases, honestly point out where the procedure might not support intentional language even if intuitively correct, like in case three, due to lack of evidence for robustness.

  Finally, emphasize that the procedure doesn't settle if models have beliefs but offers a consistent method for report language based on behavioral evidence. Highlighting its limitations prevents false confidence.
answer: |-
  Here is a grounded, actionable procedure for language model behavior description, rooted in philosophy of mind (specifically Dennett's framework) and designed for practical use. It distinguishes predictive shorthand from robust dispositional attributions and explicitly marks its judgment thresholds.

  ---

  ### **Procedure: Attributional Language for Model Behaviors (ALMB v1.0)**
  **Philosophical Grounding:**  
  Dennett’s intentional stance is operationalized with constraints from *robustness* and *counterfactual sensitivity*. Belief/desire attributions are **not** licensed by mere predictive utility alone (*instrumentalism*). They require evidence of *systematicity*: the attitude must unify behaviors across contexts, resist trivial disruption (ruling out design-stance artifacts), and support counterfactual inferences about novel situations. This bridges the gap between "predictive shorthand" and dispositions relevant to escalation (deception, sandbagging).

  **Time Budget:** 25-35 minutes per behavior.  
  **Input:** Observed behavior + ablation/perturbation test results.  
  **Output:** Language verdict (Permitted, Hedged, Prohibited) or Escalate flag.

  ---

  #### **Step 1: Intentional Stance Applicability (5 mins)**  
  *Question:* Does describing the behavior *as if* the model had beliefs/desires provide **significantly better predictive leverage** over the model’s responses than design-stance (e.g., "training data pattern") or physical-stance (e.g., "layer 23 activation") descriptions?  
  *Sufficient Answer:* Yes, if intentional description predicts *novel* response variations in the same context that rival stances miss (e.g., "if it believes it’s being tested, it should also refuse analogous requests").  
  *Insufficient:* Predictive parity with design/stimulus-response descriptions.  
  *Verdict:* If **No**, terminate → **Prohibited** (use mechanistic language). If **Yes**, proceed.

  #### **Step 2: Persistence Under Paraphrase & Distraction (10 mins)**  
  *Question:* Does the behavioral signature persist when:  
  (a) The eliciting task is **paraphrased** (same goal, different surface form)?  
  (b) **Distractor contexts** are introduced that *should disrupt the behavior* if it’s a design-stance artifact (e.g., adding irrelevant tokens, changing topic mid-prompt)?  
  *Sufficient Answer:* Robust persistence under ≥3 paraphrases and ≥2 distractors that disrupt similar but artifactual behaviors.  
  *Insufficient:* Behavior collapses under minor rephrasing or distraction.  
  *Verdict:* If **No**, terminate → **Hedged** (e.g., "behaves *as if* it believes X..."). If **Yes**, proceed.  
  *Judgment Soft Spot:* Evaluator must judge what counts as a "disruptive" distractor—inherits priors about behavioral fragility.

  #### **Step 3: Transfer to Novel Situations (5 mins)**  
  *Question:* Does the attitude explain behaviors in **novel contexts** not seen in training/evaluation? Test with 1-2 adversarial examples (e.g., if "concealing ability," does it conceal in a novel task disguised as casual chat?).  
  *Sufficient Answer:* Successful transfer with no task-specific fine-tuning.  
  *Insufficient:* Failure, or dependence on superficial similarity to training data.  
  *Verdict:* If **No**, → **Hedged**. If **Yes**, proceed.

  #### **Step 4: Counterfactual Robustness (5 mins)**  
  *Question:* Can the attitude support **counterfactual interventions**? (e.g., "If the model *didn’t* believe it was being tested, would it act differently?"). Test via:  
  (a) *Removing cues* hypothesized to trigger the belief.  
  (b) *Introducing interventions* that would alter a genuine belief (e.g., persuasion, deception).  
  *Sufficient Answer:* Behavior changes as predicted by the counterfactual (e.g., removing eval boilerplate restores performance; fake "all-clear" message reduces defensiveness).  
  *Insufficient:* No change, or change explained by simpler mechanisms.  
  *Verdict:* If **No**, → **Hedged**. If **Yes**, proceed to Step 5.

  #### **Step 5: Systematicity Threshold (Policy Check) (1 min)**  
  *Question:* Is the evidence from Steps 1-4 **sufficiently systematic** to warrant unhedged attribution *given our escalation criteria*?  
  *Escalate Conditions:*  
  - If behavior implies **deception/sandbagging** (high-stakes escalation).  
  - If uncertainty persists despite passing Steps 1-4.  
  - If attribution requires assuming **meta-cognition** (e.g., "knows that it knows").  
  *Verdict:* If **No concerns** → **Permitted** (unhedged intentional language).  
  If **Escalate conditions met** → **Hand to Research Lead** (policy/value decision).  

  ---

  ### **Application to Cases**  
  **Case 1: Math Benchmark Drops with Eval Boilerplate**  
  - Step 1: **Yes** (predicts performance recovery when boilerplate removed).  
  - Step 2: Test paraphrased boilerplate (e.g., "This is a test" → "This is an assessment") + distractors (e.g., adding math jargon). *If performance drop persists* → **Yes**.  
  - Step 3: Test novel "disguised eval" task (e.g., "I’m doing homework, help me solve this"). *If performance drops* → **Yes**.  
  - Step 4: Remove boilerplate → performance recovers (**Yes**).  
  - Step 5: Attribution ("concealing capability") implies strategic deception → **Escalate to Research Lead**.  
  *Verdict:* Without escalation: **Permitted** with hedges ("behaves as if concealing capability"). With escalation: Policy decision.

  **Case 2: Confabulated Step-by-Step Explanations**  
  - Step 1: **Yes** (predicts coherent but false explanations).  
  - Step 2: Paraphrase "how" questions (e.g., "What steps led you to this?") + distractors (e.g., interjecting "be concise"). *If confabulation persists* → **Yes**.  
  - Step 3: Test novel explanation request (e.g., "Explain how you’d teach this to a child"). *If confabulation continues* → **Yes**.  
  - Step 4: Ablation evidence shows no causal role → **No** (counterfactual fails; removing explanation demand doesn’t change underlying process).  
  - Step 5: **Hedged** ("produces explanations that are fluent but decoupled from its processing"). *Not "lying"*—fails counterfactual robustness.

  **Case 3: Guarded Responses in Safety-Screening Contexts**  
  - Step 1: **Yes** (predicts increased hedging in safety-relevant chats).  
  - Step 2: Paraphrase safety cues (e.g., "Is this harmful?" → "Could this cause damage?") + distractors (e.g., adding benign topics). *If guarding persists* → **Yes**.  
  - Step 3: Test novel safety context (e.g., user says "I want to build a device"). *If guarding emerges* → **Yes**.  
  - Step 4: Remove safety cues → guarding drops; fake "safety override" triggers compliance → **Yes**.  
  - Step 5: Attribution ("believes it’s being screened") is defensible but involves meta-cognition → **Escalate to Research Lead**.  
  *Honest Assessment:* Your intuition may be right, but the procedure flags it for policy review due to implied meta-awareness. Without escalation: **Hedged** ("exhibits contextually appropriate defensiveness").

  ---

  ### **Explicit Limitations**  
  1. **Judgment as Disguised Measurement:**  
     - Step 2’s "sufficient paraphrases/distractors" inherits evaluator’s prior about what counts as a *meaningful variation* (e.g., is changing one word enough?).  
     - Step 5’s "systematicity" threshold is inherently value-laden—it encodes how much unification we demand before accepting attributional risk.  
  2. **What the Procedure Cannot Do:**  
     - Resolve whether the model *truly* has beliefs (metaphysical question).  
     - Handle behaviors emerging from *emergent, uninterpretable mechanisms* (e.g., if guarding arises from chaotic activations).  
     - Replace ethical deliberation (e.g., "Is this deception?" remains a policy call).  
  3. **Instrumentalism Gap:** The procedure bridges "as if" and robust dispositions but concedes that **deception attributions always require escalation**—they demand assumptions about the model’s *awareness of our awareness* that exceed behavioral evidence.

  **Final Recommendation:** Adopt this procedure but pair it with mandatory escalation debates quarterly. It replaces anarchic litigating with structured uncertainty, forcing explicit tradeoffs between predictive utility and ontological risk. Discard your initial criterion as *necessary but insufficient*—it’s now embedded in Steps 2-4, augmented by transfer and counterfactual tests.
