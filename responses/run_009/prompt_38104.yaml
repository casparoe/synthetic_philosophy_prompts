prompt: |-
  quick context: I'm a third-year undergrad doing a module on AI policy & ethics, and our big seminar project this term is an adversarial collaboration exercise. The class has basically split into two camps that have been arguing past each other since week 2 and it's getting exhausting, so our tutor assigned us to produce the joint statement we *should* have produced by now. I got landed with drafting it and honestly I'm not sure how to phrase the disagreement bits fairly, so I want your help with a proper draft I can bring back to both groups.

  The two camps, roughly:

  Camp A (call them the open-weights people): frontier models should generally be released with downloadable weights, like Llama etc, because open weights are how you democratise access, let researchers outside big labs audit and study these systems, prevent a small number of companies from locking up the most important technology of the century, and let the safety community actually poke at dangerous capabilities instead of reading blog posts about them.

  Camp B (the controlled-release people): frontier weights should stay behind an API or internal deployment with evals, red-teaming, usage monitoring, and the ability to shut things off or push updates, because the whole point of a frontier model is that its capabilities aren't fully known before release, weights can't be recalled once leaked, fine-tuning can strip whatever guardrails you shipped, and handing the weights to everyone includes everyone you'd least want to have them.

  What I need from you is the actual document, with these parts:

  1. A numbered section of claims both camps could sign -- about what has actually happened with past releases, about the generalisation gap between public deployments and the actual frontier, about what weight releases do and don't enable (e.g. ability to fine-tune, ability to study internals, ability to build products), about the existence of dangerous-capability evals and their limits, whatever else genuinely overlaps.

  2. A disagreements table. Each row should be one disagreement, stated twice: once in wording Camp A would accept as a fair statement of their view, once in wording Camp B would accept for theirs. Our tutor keeps flagging drafts where one side's phrasing smuggles in a conclusion -- like calling weight releases "proliferation" or calling APIs "gatekeeping" -- so please avoid loaded words on both sides.

  3. The cruxes: the sub-questions where, if one side lost the argument on that specific point, they'd actually move. I suspect a few of these are empirical (e.g. how much uplift open weights have actually provided for misuse so far, whether open models lag the frontier by a stable gap or a shrinking one, whether evals before release catch much) and at least one is more values-y (who should bear the burden of risk from a capability nobody can fully predict, and what to do under genuine uncertainty). If some of their fight turns out to be verbal -- e.g. both meaning different things by "frontier" or by "safe enough" -- please say which part and why.

  4. For each empirical crux, a concrete case, measurement, or near-future event both camps would agree in advance bears on it, plus what each camp would predict about it. (E.g. if a benchmark like a dangerous-capabilities eval is released, what would each side expect it to show about open vs. closed models, stated now so nobody can weasel out later.)

  Two asks on tone/content. First, we're supposed to mark clearly what's settled versus what's genuinely contested among people who actually work on this stuff, and not present one camp's contested position as the consensus -- the tutor will absolutely nail us for that. Second, British English throughout (it's a UK uni, and I'll get corrected again like last time when I wrote "toward" three times, oops). If you think one of the disagreements is really just Camp B being risk-averse in general versus Camp A being optimistic in general rather than a factual dispute, put that in the table rather than pretending there's a clean empirical answer.

  Also feel free to note at the end any disagreements you couldn't find honest wording for -- better to flag that than to fudge it, we can bring those to seminar.
