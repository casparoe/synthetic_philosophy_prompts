prompt: |-
  i'm a phd student in political theory, and my dissertation chapter on the ethics of secession has drifted way off into straight philosophy, so apologies if this is a mess. i keep circling something about diplomatic recognition and can't find a frame for it, so let me just lay out the practice.

  international lawyers will tell you — it's in basically every textbook, and it's even stated in treaties like the Montevideo convention — that recognition doesn't make a state a state. statehood comes from facts on the ground (territory, population, effective government), and recognizing is just acknowledging that those facts obtain; this is the so-called declaratory theory. but the actual behavior of states doesn't look much like that. states switch recognition: the US in 1979 stopped recognizing the government in Taipei and started recognizing the one in Beijing, which treats a country's standing as something that can be reassigned — and you can't "re-assign" a factual verdict, that's just changing your mind about the same fact. states withdraw recognition decades after granting it, for openly political reasons. some entities get recognized while plainly failing the effectiveness criteria, others meet them and stay unrecognized. and there's this thing where recognition from small or disliked states seems to not really count: Kosovo has a lot of recognizers, but everyone behaves as if what matters is recognition by major powers or admission to the UN, as though recognition from certain quarters is nearly worthless. meanwhile some actors (the EU, roughly, in the early 90s) made recognition conditional on internal stuff like democracy, rule of law, minority protection — which is bizarre if recognition is just noticing that some government effectively controls a territory.

  so here's my question. what does this practice actually presuppose about what recognition *is*? my instinct is the lawyers' theory is doing no real work and the practice only makes sense on something like a constitutive view — recognition as conferring a status rather than registering one. and i've been reading Hegel's master–slave section for the chapter, which suggests a sharper version: there, recognition only counts when it comes from someone you count as an equal — the master's problem is that he's being recognized by someone he refuses to recognize back, so the recognition he gets is worthless to him. read through that, the diplomatic practice seems to presuppose both that status is conferred, and that the conferral is only efficacious between parties already counted as peers — which sits oddly on top of an official ideology of sovereign equality where everyone is a peer by definition. so: reconstruct what the practice presupposes, tell me whether the declaratory theory can actually explain any of the parts i listed (the switching, the withdrawals, the conditionality, the discounting of small-state recognition) or whether it's pure fiction, say whether the parts presuppose one consistent thing or several inconsistent ones, and sketch what the practice would have to look like if we took the lawyers' theory seriously and rebuilt it to be consistent. i'd also like to know which parts are genuinely forced on the practice and which could go either way — i don't want to write the chapter claiming the whole institution secretly rests on one theory if several theories would license most of it.
reasoning: |-
  Okay, the user is a PhD student in political theory working on a dissertation chapter about the ethics of secession. They've noticed that their chapter has drifted into philosophy, specifically around diplomatic recognition. They're struggling to frame the issue because the legal declaratory theory (that recognition merely acknowledges existing statehood) doesn't match actual state practices. They've listed several inconsistencies: states switching recognition (like the US with Taiwan/China), withdrawing recognition for political reasons, recognizing entities that don't meet effectiveness criteria, discounting recognition from small states, and imposing conditions like democracy for recognition.

  The user's main question is what diplomatic practice presupposes about what recognition actually is. They suspect the declaratory theory isn't workable and that a constitutive view (where recognition confers status) makes more sense. They mention Hegel's master-slave dialectic, suggesting that recognition only matters when it comes from equals. This creates a tension with the principle of sovereign equality. They want me to reconstruct what the practice presupposes, evaluate if the declaratory theory can explain the inconsistencies, determine if the practice is consistent or contradictory, sketch a consistent system based on the declaratory theory, and identify which aspects are necessary versus contingent.

  First, I need to address the mismatch between the declaratory theory and state practices. The Montevideo Convention states that statehood exists based on territory, population, government, and capacity to enter relations. Recognition is supposed to be declaratory. But in practice, states treat recognition as a political tool. For example, switching recognition between Taipei and Beijing isn't just acknowledging facts—it's a political decision. Withdrawing recognition later for political reasons also suggests that recognition is seen as revocable, which doesn't fit a factual acknowledgment.

  The user points out that some entities are recognized without meeting effectiveness criteria, like the Sahrawi Arab Democratic Republic, which doesn't control all its claimed territory. Conversely, Somaliland has effective control but isn't recognized. This shows that political considerations override factual criteria. Then there's the hierarchy in recognition: recognition from major powers or UN admission matters more than from small states. The EU's conditional recognition based on democratic norms further complicates things, as it's not about effectiveness but internal governance.

  The user's reference to Hegel's master-slave dialectic is key here. Hegel argues that recognition must be mutual and between equals to be meaningful. In diplomacy, recognition from powerful states seems to carry more weight, implying that the recognizer's status affects the validity of recognition. This contradicts the principle of sovereign equality where all states are peers. So the practice presupposes a constitutive element where recognition confers status, and that this conferral is hierarchical.

  Now, can the declaratory theory explain these inconsistencies? For switching recognition, a declaratory theorist might say it's correcting a mistake. But if recognition is about facts, why did it take until 1979 for the US to "correct" its view of China? Withdrawals could be seen as responding to new facts, like a state losing control. But often, withdrawals are politically motivated without factual changes, as with Western Sahara. Conditional recognition based on governance norms isn't about effectiveness, so it doesn't fit. Discounting small-state recognition directly contradicts sovereign equality, as all recognitions should be equal if they're factual.

  The practice seems to rest on several inconsistent presuppositions: status is both declaratory and constitutive, sovereign equality coexists with hierarchy. This isn't entirely inconsistent; it's a layered system. At the core, effectiveness matters for statehood, but recognition acts as a gatekeeper for international participation. The constitutive aspect comes in for validation and access. Hierarchical recognition reflects power dynamics, where major powers' recognition is necessary for legitimacy.

  To build a consistent system based solely on declaratory theory, recognition would be automatic once effectiveness is established. There'd be no withdrawals or conditionality; recognition is a binary fact. But this ignores political realities. States wouldn't give up using recognition as a tool. Automatic recognition isn't feasible because effectiveness can be contested, and states have strategic interests.

  Aspects forced on practice: effectiveness as a baseline is necessary; without it, recognition lacks credibility. Also, the need for some mutual recognition to participate in international systems. Contingent aspects: conditionality (like the EU's criteria), hierarchy in recognition weight, political withdrawals. These could be different if norms changed.

  So the user should argue that practice is a hybrid: effectiveness grounds statehood, but recognition constitutes its international legal personality. Hegel's insight shows that mutual recognition among peers is key, but the hierarchy reveals that not all states are equal in influence. The declaratory theory isn't pure fiction; it sets a baseline but is overlaid with constitutive and hierarchical practices. The chapter can frame recognition as both acknowledging facts and conferring status, with tensions between ideal and practice.
answer: |-
  Your instinct cuts to the core of a profound tension in international relations. The practice of diplomatic recognition does indeed presuppose something fundamentally different from the declaratory theory's official story. Here's a reconstruction, analysis, and thought experiment based on your points:

  **What the Practice Presupposes:**

  1.  **Recognition is Constitutive, Not Merely Declaratory:** The core presupposition is that recognition *does* something. It bestows a *status* – specifically, the status of being a legitimate participant in the international legal and political community. While effectiveness provides the material basis *eligible* for recognition, recognition itself is the act of admission to the club. This explains:
      *   **Switching (US-China/Taiwan):** The US wasn't just changing its mind about who controlled China; it was actively transferring the *status* of being "China" (and the UNSC seat, diplomatic relations, treaty rights) from one entity to another. This is reassignment of a role, not correction of a factual error.
      *   **Withdrawals:** States withdraw recognition not primarily because the entity ceases to exist (though that might be the justification), but to *revoke* its status as a legitimate actor. This is a political sanction, stripping the entity of its standing. Revoking a factual observation makes little sense; revoking a conferred status does.
      *   **Conditionality (EU Criteria):** Imposing preconditions like democracy or minority rights makes sense only if recognition is seen as a *reward* or *validation* for meeting certain normative standards, not just an observation of control. It's constitutive of a *particular kind* of legitimate statehood within a specific normative order.

  2.  **Recognition is Hierarchical and Discriminatory:** The practice presupposes that not all recognitions are equal. The status conferred is more robust, legitimate, and *real* when it comes from certain actors:
      *   **"What Matters" (Major Powers/UN):** Recognition by major powers or UN admission is treated as definitive because these actors possess the *power to make the status effective*. Their recognition carries weight because they can enforce the consequences of that status (e.g., access to institutions, trade, security guarantees). Recognition from a microstate lacks this power.
      *   **Hegelian Insight:** Your reading of Hegel is spot-on. The practice reveals a "recognition hierarchy." Recognition *counts* socially/politically/legally when it comes from an actor *whose own recognition you value and who possesses significant standing within the system*. The master (major power) gets recognition, but it's hollow if it comes only from those he doesn't recognize as peers (weak states). His *desire* is for recognition from other masters. Kosovo craves recognition from Serbia (its "other"), Russia, China, and major powers, not just the Comoros or Nauru. Recognition from small/disliked states is "worthless" precisely because it lacks the validating power of recognition from a peer or superior within the perceived hierarchy, contradicting the official sovereign equality doctrine. Status *is* conferred, and its efficacy *is* tied to the standing of the conferrer.

  3.  **Effectiveness is Necessary but Insufficient (and Contested):** The practice presupposes effectiveness as a *baseline requirement for eligibility*, but not as an automatic guarantee of status. Somaliland demonstrates this – possessing territory, population, and arguably effective government, yet denied status because powerful actors refuse recognition. Conversely, entities like the SADR (Western Sahara) or past Afghan governments-in-exile were recognized while lacking full control, because recognition was used as a political tool *against* a rival (Morocco, Taliban) or to support a preferred faction.

  4.  **Recognition is a Political Tool:** Underlying all this is the presupposition that recognition is fundamentally a political act used to pursue state interests, reward allies, punish enemies, promote norms, and shape the international order. It's not a neutral act of legal observation.

  **Can Declaratory Theory Explain the Practice? (Spoiler: Mostly No)**

  *   **Switching:** Declaratory theory struggles. It could argue the US corrected a factual error in 1979, but this ignores the decades of *functioning* Taiwanese statehood and the *political nature* of the switch. It wasn't a sudden discovery of facts; it was a strategic realignment. Declaratory theory cannot easily explain reassigning the *identity* "China".
  *   **Withdrawals:** Declaratory theory might frame it as acknowledging a loss of effectiveness (e.g., a government collapsing). However, withdrawals often happen for purely political reasons (e.g., recognizing Palestine, then withdrawing if displeased with actions) *without* a fundamental change in effectiveness on the ground. Declaratory theory struggles with politically motivated withdrawals absent factual collapse.
  *   **Conditionality:** This is utterly incompatible with pure declaratory theory. Observing control doesn't require democracy. This practice *only* makes sense on a constitutive view where recognition actively shapes and rewards internal political orders.
  *   **Discounting Small-State Recognition:** This directly contradicts the sovereign equality underpinning declaratory theory. If recognition merely declares a fact, recognition *by anyone* should be equally valid proof of that fact. Discounting it reveals that recognition is valued for the *authority of the recognizer*, not just the fact asserted.
  *   **Effectiveness Failures/Gaps:** Declaratory theory struggles to explain why entities meeting criteria remain unrecognized (Somaliland) or why those failing them get recognized (SADR historically). It requires constant mental gymnastics to explain these as "misjudgments" rather than political choices overriding facts.

  **Is the Practice Consistent? Several Inconsistent Things:**

  The practice presupposes **multiple, conflicting principles simultaneously**:

  1.  **Formal Sovereignty/Equality:** The bedrock ideology (Montevideo) – states exist by fact, all are equal.
  2.  **Constitutive Power:** Recognition actually creates/bestows status and legitimacy.
  3.  **Hierarchy of Power/Validation:** Recognition from some counts more than others; status depends on the validator's standing.
  4.  **Political Instrumentalism:** Recognition is wielded as a tool for interests, not legal duty.

  The core inconsistency is between #1 and #2/#3. The system operates *as if* (#2, #3) while officially professing (#1). #4 is the driving force that exploits this inconsistency. It's not one consistent logic, but a layered set of often contradictory presuppositions held in tension.

  **A Consistent Declaratory System: A Thought Experiment**

  If we took declaratory theory seriously and rebuilt practice around *only* acknowledging effectiveness:

  1.  **Automatic Recognition:** Once an entity demonstrably meets the Montevideo criteria (territory, population, effective government, capacity for relations) for a stable period, recognition would be automatic and universal. There would be no political choice involved. Think of it like a seismometer registering an earthquake – it's not optional.
  2.  **No Withdrawals:** Recognition could only be withdrawn if the entity demonstrably *ceased* to meet the criteria (e.g., complete loss of territory/control). Political disagreements wouldn't suffice.
  3.  **No Conditionality:** Internal governance (democracy, human rights) would be irrelevant to the *fact* of statehood. Recognition would solely reflect control.
  4.  **No Switching of Identity:** Recognition couldn't be "switched" from Entity A to Entity B for the *same* territory/population unless Entity A demonstrably lost control *to* Entity B. The Taiwan/China switch would only occur if the PRC demonstrably took control *of Taiwan*, which didn't happen.
  5.  **Equal Weight:** Recognition by *any* state (or perhaps an objective international body) confirming the facts would be sufficient proof of statehood. Recognition by Palau would carry the same legal weight as recognition by the US regarding the *fact* of statehood.
  6.  **Objective Assessment:** An independent, apolitical international body (like a super-charged, authoritative ICJ chamber) would be the primary arbiter of whether criteria are met, removing the decision from individual states' hands.

  This system would be radically different, depoliticized, and likely far less contentious *about recognition itself*. However, it would do nothing to address the underlying political conflicts (e.g., competing claims over territory, legitimacy of secession) and might even exacerbate them by making statehood purely a mechanical fact, divorced from normative considerations like self-determination or justice.

  **Forced vs. Contingent Aspects:**

  *   **Forced on the Practice:**
      *   **Some Role for Effectiveness:** Even in the most political cases, *some* claim to territory/population/control is necessary. Pure fiction (recognizing a government-in-exile with *no* territory or control) rarely endures. Effectiveness is the minimal anchor.
      *   **Need for Mutual Recognition:** The international system fundamentally requires *mutual* recognition between states to function (diplomacy, treaties, law). *Some* form of constitutive act is practically necessary to establish these relationships, even if based on effectiveness.
      *   **Power Matters:** In an anarchic system, the views and actions of powerful states will inevitably carry more weight in determining what status becomes *operationally real* (access to institutions, security, trade). This hierarchy is structurally inherent, even if formally denied.
  *   **Contingent (Could Be Different):**
      *   **Explicit Conditionality (like EU):** This is a specific normative choice. States *could* collectively abandon this and return to recognizing any effective entity, or adopt different conditions.
      *   **Formalized Hierarchy of Recognition:** While power matters, the *explicit discounting* of small-state recognition isn't logically necessary, even within a constitutive/hierarchical system. Practice *could* evolve to treat all recognition votes as formally equal within multilateral bodies like the UN GA, even if behind the scenes major powers dominate.
      *   **Frequency of Political Withdrawals/Switching:** While constitutive theory allows it, states *could* adopt norms making recognition much harder to withdraw once granted, treating it as a near-permanent status barring total collapse (closer to declaratory ideals). The current level of politicization isn't inevitable.
      *   **The Primacy of the UN:** The centrality of UN membership as the gold standard is historically contingent. A different global institution could play this role, or it could be more decentralized.

  **Conclusion for Your Chapter:**

  The declaratory theory is **not pure fiction**, but it **is largely mythological** in explaining the actual practice. It serves important functions:

  1.  **Normative Baseline:** It sets the minimal criteria (effectiveness) that even constitutive recognition usually requires, providing a (contestable) standard against which political choices are judged.
  2.  **Rhetorical Shield:** It allows states to mask political decisions (like non-recognition of Somaliland or conditional recognition in the Balkans) behind a facade of objectivity and legal duty.
  3.  **Aspiration:** It embodies the ideal of sovereign equality, even as practice undermines it.

  However, **the practice overwhelmingly presupposes a constitutive view**, heavily inflected with **hierarchy** (power differentials determining whose recognition counts) and **political instrumentalism**. Hegel's master-slave dialectic provides a powerful lens: recognition only provides the desired *social validation* and *effective status* when it comes from actors *whose own status is recognized and respected by the system*. Recognition from a "slave" (a powerless or pariah state) doesn't confer the standing the "master" (an entity seeking full legitimacy) craves. This creates the tension with sovereign equality – everyone is formally equal, but some are vastly more equal in their power to confer meaningful status.

  **Multiple theories *could* license parts of the practice**, but **only a modified constitutive theory incorporating hierarchy** can coherently explain *all* the phenomena you listed (switching, withdrawals, conditionality, discounting) as part of a single, albeit messy, logic. The declaratory theory explains the minimal baseline of effectiveness but fails utterly to explain the active, political, discriminatory, and status-conferring nature of the recognition *act* itself. Your chapter can powerfully argue that the institution *functionally* rests on constitutive and hierarchical presuppositions, despite its declaratory mythology, and that Hegel offers a profound insight into why recognition from some quarters is inherently more valuable – and why the promise of sovereign equality remains perpetually unrealized in this domain. Focus on the *act* of recognition as a performative, status-bestowing, and inherently political act within a hierarchical system, using the declaratory theory as a contrasting ideal that highlights the tensions in practice.
