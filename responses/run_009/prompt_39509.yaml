answer: |-
  Here are 12 interview questions (with follow-ups) designed to rigorously explore UDT's nuances, respecting your guest's precision while pressing key philosophical and technical tensions:

  ### 1. Counterfactual Mugging & Rational Obligation  
  **Q:** In Counterfactual Mugging, UDT prescribes paying *after* seeing tails—sacrificing utility with no causal benefit. Many argue this violates instrumental rationality: why should an agent *now* care about a counterfactual self’s payoff? How do you reconcile this with the intuition that rationality is about achieving *actual* goals, not optimizing for hypothetical observers?  
  *→ Likely follow-up (if he appeals to "acausal cooperation"):* When you say the agent "identifies" with their decision-theoretic twins, how do we individuate the reference class? If two agents run *slightly* modified code (e.g., different tie-breakers), are they still "the same procedure"? What’s the tolerance for divergence?

  ### 2. The Self-Blinding Objection & Collapse  
  **Q:** Critics argue UDT discards valuable information: refusing to condition on "I am in situation S" seems like self-sabotage when no logical/causal twins exist. In what cases *does* UDT collapse to causal decision theory (CDT) or evidential decision theory (EDT)? Is there a formal criterion for when "updatelessness" adds value versus needlessly blinding oneself?  
  *→ Likely follow-up (if he cites "logical correlations"):* Suppose no twins exist—e.g., I’m deciding whether to umbrella in a causally isolated rainstorm. Doesn’t UDT *still* forbid conditioning on my location, making it strictly dominated by CDT? Isn’t that a reductio?

  ### 3. Self-Locating Beliefs & Sleeping Beauty  
  **Q:** UDT proponents claim it dissolves Sleeping Beauty by treating "I am awake Tuesday" as non-updatable. But if Beauty gains evidence *about the world* (e.g., "a Tuesday wake-up event is occurring"), isn’t refusing to update tantamount to ignoring real information? How is this not a confusion between *indexical facts* and *world-model evidence*?  
  *→ Likely follow-up (if he denies the distinction):* If Beauty learns "today is Tuesday," isn’t that equivalent to learning "the coin landed tails" in a model where Tuesday wake-ups only occur on tails? Doesn’t UDT’s refusal to update violate conservation of expected evidence?

  ### 4. Reference Class & Individuation  
  **Q:** UDT requires specifying which "observations" to ignore in advance. But individuating these is thorny: ignoring hat color is absurd, ignoring coin flips in muggings seems essential. What’s your *principled* basis for this—e.g., logical depth, computational irrelevance, or something else?  
  *→ Likely follow-up (if he calls it unresolved):* What would constitute evidence for one individuation over another? If we can’t settle this, does UDT risk being unfalsifiable—merely rationalizing intuitions case-by-case?

  ### 5. Metaphysical Status & Implementation  
  **Q:** Is UDT a literal computational prescription, or a rational reconstruction? Given its computational infeasibility, should we view it as justifying *heuristics* (e.g., favoring policies robust across possible selves) rather than demanding actual updateless commitments?  
  *→ Likely follow-up (if he endorses idealization):* Doesn’t this open UDT to the "rational irrationality" critique? If bounded agents *can’t* implement it, why call it "rational" rather than "optimal in a Platonic sense"?

  ### 6. Logical Uncertainty & Bootstrapping  
  **Q:** UDT assumes agents can compute optimal policies *before* encountering observations. But with logical uncertainty (e.g., unproven theorems affecting rewards), how can we define "optimal in advance" when the policy’s consequences are unknown? Doesn’t this regress?  

  ### 7. Subjective vs. Objective Tensions  
  **Q:** UDT prioritizes the prior’s view of optimality. But if an agent’s beliefs change *between* precommitment and observation (e.g., via unrelated evidence), must they still follow the "outdated" prior’s directive? Isn’t this a conflict between *current* and *past* rationality?  

  ### 8. Dynamic Consistency  
  **Q:** Standard dynamic consistency requires that plans made in advance remain optimal when executed. UDT violates this (e.g., in muggings, paying post-tails feels suboptimal locally). Why isn’t this a fatal flaw? Or do you reject dynamic consistency as a norm?  

  ### 9. Anthropic Edge Cases  
  **Q:** In anthropic problems (e.g., Doomsday Argument), UDT’s refusal to condition on existence might avoid untenable conclusions. But doesn’t this also block legitimate updates—e.g., learning "I exist in a century" *should* update me against doom soon?  

  ### 10. Alternative Formalisations  
  **Q:** Some reformulate UDT using "logical counterfactuals" (e.g., Garrabrant) or "program-equivalence" (e.g., Yudkowsky). Which framework best resolves its paradoxes, and does this shift UDT’s philosophical commitments?  

  ### 11. Empirical Track Record  
  **Q:** Beyond thought experiments, has UDT yielded novel insights in domains like game theory or AI alignment? If its primary evidence is intuitive resolution of paradoxes, how do we guard against "tuning" it to fit preexisting judgments?  

  ### 12. The Big Picture  
  **Q:** If UDT "wins" on technical coherence, but requires agents to act against their experienced interests (e.g., paying in muggings), should we reconsider whether *instrumental rationality* is the right framework? Does UDT point toward a more "impersonal" notion of rationality?  

  ---

  ### Key design notes:
  - **Pressure without hostility**: Follow-ups target conceptual tensions (e.g., mugging → individuation, self-blinding → collapse) while allowing the guest to clarify boundaries ("This is settled" vs. "We're still exploring").
  - **Audience engagement**: Questions assume familiarity with CDT/EDT, Sleeping Beauty, and logical uncertainty—avoiding rehashing basics.
  - **Guest precision**: Explicitly invites demarcation (e.g., Q4/Q5) and alternative formalisms (Q10).
  - **Impasse-friendly**: Q2 (self-blinding) and Q8 (dynamic consistency) highlight irreconcilable conflicts with rival theories, inviting productive disagreement.

  These should spark deep discussion while respecting the guest’s reputation for rigor. Let me know if you’d like to sharpen any angle!
