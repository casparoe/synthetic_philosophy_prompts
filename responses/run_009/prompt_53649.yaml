prompt: |-
  I work in neural-network interpretability: I probe activations to find what features a model actually represents, and I study cases where a model's reports about its own internal computation are accurate versus cases where it plainly confabulates. Restate the illusionist position on phenomenal consciousness — roughly, that phenomenal properties as ordinarily conceived are introspective illusions, though consciousness itself is real — together with the strongest objections from its phenomenal-realist critics, in my working vocabulary: learned self-models, introspection as an internal classifier that reads off other parts of the network, confabulation, and the gap between the features a system actually instantiates and the features its self-monitor attributes to it. Then give me the residue report: which parts of the illusionism debate map cleanly onto things I recognize, which survive only with distortion, and which claims — especially the realist's insistence that there is a further "what it's like" fact that any such story leaves out — have no counterpart at all. Finally, tell me whether that residue shows my interpretability vocabulary is missing something the philosophers need, or whether the debate is less substantive than it looks once translated.
