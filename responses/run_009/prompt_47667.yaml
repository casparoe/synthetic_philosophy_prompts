prompt: |-
  I teach philosophy of science and I've gotten myself stuck on something I should have sorted out years ago: when are two empirically equivalent theories the same theory, and when are they genuine rivals? Here are my gut verdicts, and I'd like to know whether there's an actual principle behind them or whether I'm just vibing.

  Lorentz's ether theory (in the version where the ether is undetectable in principle and the Fitzgerald contraction saves the null result) and special relativity: same theory. Einstein cleaned it up, but I can't see the ether as doing any real work once nothing could ever detect it.

  Ptolemy and Copernicus, back before stellar parallax or aberration could be measured, when no observation could decide between them: two different theories, relaly fighting it out. Not a relabeling.

  Newtonian mechanics done with forces in Euclidean space versus the same mechanics recast in Newton-Cartan geometry: same theory, obviously.

  Everett's many-worlds versus a many-minds variant where the branches are collections of experiences rather than physical worlds, same empirical predictions: same theory, I think? Lower confidence here.

  General relativity with curved spacetime versus GR recast in flat spacetime plus a universal force field that exactly mimics curvature (the old Reichenbach move): honestly I flip-flop on this one, week to week.

  And the case that started this whole mess: two formulations of classical electromagnetism that agree on every observable, but one is implicitly substantivalist about spacetime and the other relationalist about it.

  So is there a principle that gets all of these? Same Ramsey sentence? Definitional equivalence? Something about which unobservables do causal work? And notice the tension I can't resolve: I say Lorentz and Einstein were doing the same theory, but Ptolemy and Copernicus weren't, and I can't for the life of me say what the difference is -- the ether was undetectable, sure, but so was, at the time, stellar parallax. So either one of those verdicts has to go, or the principle is going to be ugly. Give me your best shot at a principle, tell me which of my verdicts it can't accommodate, and tell me what it predicts for a case I haven't listed: whether presentism and eternalism, assuming they really are observationally equivalent, are two theories or one.
reasoning: |-
  Okay, the user teaches philosophy of science and is stuck on distinguishing between empirically equivalent theories. They provided several examples with their gut feelings and want a principle that explains their judgments. Let me start by understanding their examples.

  First, Lorentz's ether theory vs. special relativity: they see them as the same. The ether is undetectable, so it's redundant. Then Ptolemy vs. Copernicus pre-parallax: different theories, even though observationally equivalent. Newtonian mechanics in Euclidean space vs. Newton-Cartan geometry: same theory. Everett's many-worlds vs. many-minds: same theory, but they're less sure. General relativity curved vs. flat with universal force: they flip-flop. Classical EM with substantivalism vs. relationalism: unclear, but probably different.

  The user is struggling because both Lorentz/Einstein and Ptolemy/Copernicus were observationally equivalent at some point, yet they judge one pair the same and the other different. Why? The key might be structural differences. Ptolemy's epicycles vs. Copernicus's heliocentrism involve different mechanisms, even if predictions match. Lorentz's ether was an unnecessary add-on, while Ptolemy's model was fundamentally different in structure.

  The user might need a principle that accounts for theoretical structure beyond observables. Structural realism comes to mind—focusing on the relational structure of theories. But Ptolemy and Copernicus share some structure (both use circular motions), so maybe it's about the nature of the unobservables. If unobservables are idle (like ether), they can be discarded; if they play a role in explanations (like epicycles), they're part of the theory's identity.

  Also, the user's uncertainty about GR and EM suggests a tension. For EM, if spacetime points are individuated relationally vs. substantivally, that might not affect empirical outcomes but could be metaphysically different. The principle needs to handle such cases. Maybe it's about whether the variant requires reinterpretation of existing entities or adds new ones.

  Then there's presentism vs. eternalism. If empirically equivalent, are they the same? Under structural equivalence, if they share the same relational structure, they might be the same. But if the metaphysics of time affects explanatory narratives, they could be seen as different. The user might lean towards them being different if they impact theoretical virtues like parsimony.

  The user's deeper need might be to clarify how metaphysics fits into theory identity. They want a consistent principle that respects scientific practice without arbitrary distinctions. They might also be interested in whether theory equivalence is pragmatic or ontological. Their examples show they value both structural aspects and explanatory roles of unobservables. Balancing these is tricky, so the principle should acknowledge that some cases are underdetermined and context-dependent.
answer: |-
  Based on your cases and the underlying tension (Lorentz/Einstein vs. Ptolemy/Copernicus), I propose a principle rooted in **structural equivalence** and **explanatory economy**, drawing on Ramsey sentences and definitional equivalence, but emphasizing *how* unobservables function within the theoretical structure:

  **Principle: Two empirically equivalent theories T1 and T2 are the *same theory* iff they share the same core *causal-explanatory structure* concerning observable phenomena, and their differences consist *only* of:**

  1.  **Idle Wheels:** Elements in one theory that play *no role whatsoever* in generating predictions or explaining *any* observable phenomena (even counterfactually), and whose removal leaves the causal-explanatory structure intact.
  2.  **Pure Re-description:** Differences that amount solely to relabeling entities or reformulating the mathematical structure *without altering the network of causal dependencies or explanatory relations* between the observable quantities.

  **T1 and T2 are *genuine rivals* iff they are empirically equivalent but differ in their core causal-explanatory structure concerning *how* the observable phenomena are generated or explained, even if this difference involves unobservable entities or properties.**

  ### Applying the Principle to Your Cases

  1.  **Lorentz vs. Einstein (SR): Same Theory**
      *   **Why:** The ether in Lorentz's mature theory (post-FitzGerald/Lorentz contraction, post-Lorentz transformations, post-local time) is the quintessential **idle wheel**. It plays no role in *generating* the predictions. Its sole "function" is to be the postulated medium *in which* the dynamical laws operate, but those laws (contraction, time dilation) are formulated entirely in terms of measurable relative velocities and distances, independent of any properties of the ether itself. Removing the ether concept leaves the *explanatory structure* (how relative motion causes length contraction/time dilation) identical to SR. The difference is purely metaphysical labeling ("space" vs. "ether at rest").

  2.  **Ptolemy vs. Copernicus (Pre-Parallax): Genuine Rivals**
      *   **Why:** They posit fundamentally different *causal-explanatory structures* for the same phenomena (planetary motions). Ptolemy explains retrograde motion via epicycles *on deferents centered near Earth*. Copernicus explains it via the *relative motion of Earth and other planets around the Sun*. The core mechanisms (epicyclic motion vs. heliocentric orbits combined with Earth's motion) are structurally distinct, even if mathematically equivalent for prediction. The unobservable stellar parallax *was* a consequence of the Copernican structure (Earth's motion), while Ptolemy's structure implied no such parallax. Its absence *was* explained within Ptolemy (by making the sphere of fixed stars immense), but that explanation *relied on* and *was part of* its core geocentric structure. The difference isn't just labeling; it's *what is moving* and *what is fixed* at the fundamental explanatory level.

  3.  **Newtonian Mechanics (Euclidean vs. Newton-Cartan): Same Theory**
      *   **Why:** This is a clear case of **pure re-description**. Newton-Cartan reformulates Newtonian gravity as spacetime curvature instead of a force in flat space. However, the *network of causal dependencies* is identical: the mass distribution determines the gravitational field (or curvature), which determines the trajectories of test particles. All observable predictions (orbits, tides, projectile motion) map directly between formulations. The difference is purely geometric/mathematical framework, not explanatory structure.

  4.  **Everett (MWI vs. Many-Minds): Same Theory (Tentative)**
      *   **Why (Same):** If both variants generate *exactly* the same branching structure of experiences/observations via the same unitary dynamics (Schrödinger equation), the core causal-explanatory structure is identical: unitary evolution splits the quantum state, and observers' experiences correlate with components of that state. Whether we label the branches "worlds" or "minds" is arguably metaphysical labeling about the *ontology* of the branches, not a difference in how the branching *causes* the specific observable experiences. The core mechanism (decoherence leading to branching) is shared. *(Note: Some argue the mind variant might imply different constraints on psycho-physical laws, potentially making them rivals. Your "same" verdict assumes strict empirical equivalence implies identical psycho-physical links).*

  5.  **GR (Curved vs. Flat + Universal Force): Flip-Flop Explained**
      *   **Why Flip-Flop?** This case sits on the boundary.
          *   **Argument for Same:** The universal force is carefully crafted to be an **idle wheel** w.r.t. all *actual* measurements (rods, clocks, light paths). It mimics curvature precisely. *If* the force truly plays no independent causal role beyond mimicking curvature's effects on matter/metric, and all dynamics are defined relationally within the flat background, it *might* be seen as a cumbersome re-description of GR's core structure (matter tells spacetime how to curve; spacetime tells matter how to move).
          *   **Argument for Rivals:** The core causal-explanatory structures *seem* fundamentally different. GR posits that spacetime geometry *itself* is dynamical and causally influenced by matter, affecting free-fall motion *directly*. The flat-space version posits an *external, universal force field* acting within a fixed, flat geometry. This force field must have incredibly specific, non-local, non-material properties *just* to mimic curvature. While empirically identical, the *explanatory narratives* differ: one explains motion via dynamic geometry, the other via a peculiar force acting in static geometry. The flat-space force isn't *just* an idle label; it's an *active* (though contrived) *causal agent* replacing curvature.
      *   **Conclusion:** The principle struggles here because the flat-space force is *both* an attempt at re-description *and* introduces a different kind of causal agent. Your flip-flop is justified! Leaning towards *rivals* might be slightly stronger, as the flat-space version arguably doesn't *preserve* GR's core insight about the dynamical nature of spacetime geometry; it *replaces* it.

  6.  **Classical EM (Substantivalist vs. Relationalist Spacetime): Genuine Rivals (Likely)**
      *   **Why:** While the observable field equations are identical, the *causal-explanatory structure* concerning spacetime itself differs fundamentally.
          *   Substantivalism: Spacetime points exist and have primitive identities. EM fields are properties *of* these points. Motion is relative *to* this background.
          *   Relationalism: Only matter and its spatiotemporal relations exist. Spacetime points are not primitive; they are defined by relations. EM fields must be formulated relationally (e.g., via potentials with gauge freedom interpreted ontologically).
      *   This difference becomes crucial in scenarios involving global topology, holes, or symmetry arguments (e.g., Leibniz shift). While empirically equivalent locally, the theories offer different explanations for *why* the field equations hold – one grounded in properties of a background, the other grounded purely in relations between matter/fields. This is more than labeling; it's a difference in the fundamental entities and their causal/metaphysical roles.

  ### Addressing the Core Tension (Lorentz vs. Ptolemy)

  *   **Ether (Lorentz):** Truly an **idle wheel** in the *final* predictive structure. Its properties couldn't be measured *even in principle* without contradicting the theory's own postulates (constancy of light speed, relativity principle). It adds nothing to the explanation *of the phenomena* beyond what SR provides.
  *   **Stellar Distance/Parallax (Ptolemy):** The immense stellar sphere wasn't *just* an idle wheel. It was a *consequence* of the core geocentric structure *and* played an explanatory role: it *explained* why parallax wasn't observed *given* the Earth's postulated central immobility. Removing the geocentric core would remove the *need* for this explanation. The size of the sphere was an *integral part* of the geocentric explanatory framework, not a removable add-on.

  ### New Case: Presentism vs. Eternalism (Observationally Equivalent)

  *   **Prediction: Genuine Rivals.**
  *   **Why:** While empirically equivalent (assuming they truly are), they posit fundamentally different *causal-explanatory structures* concerning time and existence.
      *   Presentism: Only the present exists. Past and future are unreal. Change is fundamental. Causation happens *now* and propagates only forward (or perhaps only backward causation is possible?).
      *   Eternalism: Past, present, and future are equally real. The universe is a static 4D block. "Change" is just variation along a worldline. Causation is just correlation within the block.
  *   These differences profoundly impact explanations: What does it *mean* for something to cause something else? What is the nature of temporal becoming? Why do we have records of the past but not the future? The core metaphysical structure regarding time, existence, and causation is radically different, even if all observable sequences of events are identical. This isn't relabeling; it's a deep difference in the fundamental ontology and explanatory framework. (This aligns with the classic "hole argument" intuition applied to time).

  ### Strengths and Limitations of the Principle

  *   **Strengths:**
      *   Captures the core intuition behind your "same" verdicts (Lorentz/SR, Newton/Newton-Cartan) as involving idle wheels or pure re-description.
      *   Explains why Ptolemy/Copernicus and Presentism/Eternalism feel like rivals despite empirical equivalence: different core causal-explanatory structures.
      *   Handles EM substantivalism/relationalism as rivals.
      *   Acknowledges the genuine ambiguity in cases like GR curved/flat and Everett variants.
      *   Focuses on scientifically relevant differences (causal-explanatory structure) rather than pure metaphysics, while recognizing metaphysics can be intertwined with explanation.
  *   **Limitations/Ugliness:**
      *   "Causal-explanatory structure" is not perfectly sharp. Debates about what constitutes a "cause" or a "genuine explanation" persist (e.g., GR flat/curved).
      *   Requires careful counterfactual analysis: Does element X play *any* role, even in principle, in *how* the theory generates predictions or explains phenomena? (This is where Lorentz's ether fails and Ptolemy's stellar sphere succeeds).
      *   It's somewhat pragmatic/holistic. Deciding if something is an "idle wheel" depends on the specific formulation and how tightly integrated the element is.
      *   Doesn't *always* perfectly match historical context or psychological perception (e.g., Einstein *felt* he was doing something radically different from Lorentz).

  This principle provides a robust framework that explains most of your intuitions, resolves the Lorentz/Ptolemy tension by focusing on the *role* of the unobservable (idle wheel vs. integrated explanatory element), and handles the new case of presentism/eternalism as genuine rivals. The ugliness lies in the inherent difficulty of precisely defining "causal-explanatory structure," but this reflects the genuine complexity of the problem in the philosophy of science.
