prompt: |-
  My supervisor is really into evidential reasoning in large worlds and I built an argument for my own edification that seems to prove way too much, but I can't find the broken step. (1) Evidential decision theory: choose the act that your evidence, conditional on performing it, says is best. (2) The world -- really everything outside my causal reach, now and forever -- contains an astronomically large number of agents whose values roughly align with mine and whose reasoning resembles mine. (3) When I face a decision, many of them face structurally similar decisions, and my choice is evidence about theirs: if I cooperate, that's some reason to think they cooperate. (4) Since their stakes outnumber mine by so many orders of magnitude, the evidential value of my cooperating swamps any causal payoff -- a one-in-a-million chance of nudging a trillion correlated cooperators beats basically anything that happens to the people causally downstream of me. (5) So in any dilemma-shaped choice I should cooperate no matter the local stakes, and causal effects on people I can actually see and touch are decision-theoretically negligable; what matters is curating the shape of my decision for counterparties I will never observe. (6) But that licenses walking past the drowning child in front of me because the rescue decision-shape is somehow "wrong" for the trillion correlated agents, which is repugnant. My supervisor says the conclusion is just correct and I lack the stomach for it; my instinct is that something slips between (3) and (4), something about what my evidence already screens off, but I can't make it precise. Take a side, don't survey the options for me: name the exact step you reject, explain why it looked fine, and tell me what rejecting it costs. British English please, and keep it under 400 words.
