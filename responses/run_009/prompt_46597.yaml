answer: |-
  Right. I reject step (3): "When I face a decision, many of them face structurally similar decisions, and **my choice is evidence about theirs**."

  **Why it looked fine:** In a small, interconnected group, your choice *would* be evidence about others' likely choices (e.g., signalling norms). With vast numbers of "counterparties" whose reasoning correlates with yours, it *seems* intuitive that your action updates your probability estimate of theirs, especially if you model them as facing similar dilemmas.

  **Why it's broken:** Your evidence *already includes* the vast scale and correlation. Before you choose, you know the *statistical pattern* of choices among your vast cohort is fixed (even if you don't know your own slot). Your specific action doesn't provide *new, independent* evidence about the *overall* pattern; it's just a single data point swamped by the prior. Crucially, **your choice is screened off**. Learning *that* you cooperated tells you *nothing new* about the trillion others that you didn't already know from the prior correlation and scale. You knew *beforehand* that statistically, if *you* are correlated with them, then *their* actions are already statistically determined relative to the type of agent you are. Your act reveals *which* type you are (cooperator/defector), but doesn't *change* the statistical reality of the trillion – that was fixed by your pre-existing correlation.

  **The cost:** Rejecting (3) means EDT *cannot* leverage these astronomical stakes in large worlds via this "shaping the statistical wavefunction" argument. Your evidential impact shrinks to near-zero against the vast prior. This preserves the moral intuition to save the drowning child – local causal effects dominate because your action provides negligible *new* evidence about the distant cohort. It concedes that EDT, in vast worlds, loses this particular source of potentially overwhelming leverage, grounding obligation firmly in the causally accessible. Your supervisor's "stomach" is for a logical implication EDT *doesn't* actually force here.
