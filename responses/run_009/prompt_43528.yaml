          The students without a group (2 students) can be assigned as "reviewers" who visit groups and ensure they are following the constitution. Or they can be given a group of two with the two-person example and run similarly.

          What will go wrong:
            - Side payments: students might offer to compensate for the lower utility in some state. Prevent this by saying the constitution forbids side payments (to match the theorem's fixed preferences).
            - Renegotiation: they might try to change the rules. Remind them that the constitution is fixed.
            - In step 4, after moving to (NT, NP, NK), Ravi might not want to switch to T because he knows it will start a chain reaction. But the utility is given, and they are to act to maximize their own utility. Encourage them to myopically improve their utility at each step.
            - In the two-person group, they might not cycle.

          What the activity cannot capture:
