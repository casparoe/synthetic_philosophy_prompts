          - The cycle: they experienced a cycle of states, which shows the impossibility of having a stable outcome that respects both conditions.
          - How is this different from Condorcet cycling? In Condorcet cycling, the cycling is due to majority voting and happens in the aggregation of preferences. Here, the cycling happens even though the aggregation rule is not voting but a combination of individual rights and Pareto improvements. The source of the cycle is the conflict between individual rights and collective improvement.

