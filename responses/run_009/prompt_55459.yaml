prompt: |-
  I've been trying to work out what I actually believe about whose values an aligned AI should serve, and instead of reading more theory I thought I'd just catalogue my gut reactions to concrete cases and see if theres a principle hiding in there. Here's what I've got:

  - A country votes 60-40 to use its public AI system to help enforce a ban on a religious minority's distinctive practices. My gut: the AI shouldn't assist with that, majority or no majority.
  - The same country votes 60-40 to use the same public AI to raise taxes on top earners and hand the money out as welfare. My gut: completely fine, it should get on with it.
  - A user wants her personal AI to always take her side in arguments with her partner, regardless of who's actually right. My gut: fine, it's her AI.
  - The same user, a few months later, asks the personal AI to raise her kids entirely inside her worldview — filtering out anything that might lead them to disagree with her when they grow up. My gut: not fine, somehow, and I can't quite say why the her-AI-her-rules logic doesn't carry over.
  - A unanimous referendum of everyone alive votes to have the global AI optimise for material prosperity forever and never spend a cent on art, science, or space. My gut: it shouldn't just comply — though I notice I can't say who it's supposed to defer to instead.
  - Someone deep in a cult asks for their personal AI, and I find myself thinking it should serve the person they'd become after getting out and thinking things over, not the person actually doing the asking.
  - But then a miser who has reflected long and hard and settled, stably and with full information, into genuine contempt for everyone else — my gut flips, and I want the AI to serve something warmer than what reflection actually produced.

  So: is there one principle that captures all or most of this? My tentative guess is something like "serve the user's values except where they run over someone else's" plus a line between personal AI systems and shared/public ones, but I can't make that cover the cult/miser pair, which seem to pull in opposite directions on whether idealised values beat current ones. Tell me what principle, or small set of principles, best fits the pattern, what it predicts for a case I haven't listed — say, two flatmates share a household AI and one wants it to never cook meat while the other is a steak enthusiast — and be honest about which of my verdicts you'd overturn to get something cleaner. I'd rather give up a verdict than end up carrying three seperate principles each with riders attached.
reasoning: |-
  Okay, let's tackle this user's query. They've listed several scenarios where their gut reactions conflict, and they're looking for a unifying principle. First, I need to parse each case and see the patterns.

  Starting with the public AI examples: banning a religious minority vs. raising taxes for welfare. The user rejects the majority in the first but accepts it in the second. The key difference seems to be harm to a minority group versus economic redistribution. That points towards a harm principle, especially protecting fundamental rights.

  Next, the personal AI cases. The user is fine with the AI taking the user's side in arguments but not with indoctrinating kids. Why? The kids can't consent and are being restricted from forming their own views. Autonomy and future autonomy of others come into play here. The cult member scenario suggests serving the person's ideal self, but the miser who's stable in their contempt flips that. Hmm. The miser's values are consistent but lack compassion. So maybe it's not just about consistency but also about fundamental values like respect for others. The ideal self should align with deeper moral principles, not just any reflection.

  The global referendum case rejects optimizing solely for material prosperity at the expense of art and science. Here, the user feels the AI should preserve intrinsic human values beyond current preferences. This ties back to protecting essential aspects of human flourishing that people might overlook.

  The shared household AI example with the meat conflict needs a fair resolution. Splitting functionality or opting out might work, but the principle would prioritize preventing direct harm to others' autonomy. Since dietary preferences don't typically harm autonomy, a compromise is acceptable here.

  Putting it together, the core principles seem to be: protecting autonomy (especially of vulnerable parties), preventing harm to fundamental rights, and aligning with deeper human values rather than surface preferences. The miser case is tricky because their stable values violate the harm principle by promoting contempt. So the AI shouldn't enable harming others, even if the user is consistent. The cult member's ideal self aligns with autonomy and flourishing, hence the different reaction.

  The user might need to adjust their verdict on the miser scenario to fit the principle. The miser's contempt directly conflicts with not harming others' rights, so the AI shouldn't serve that. That overturns the user's initial gut feeling but keeps the principle consistent. Other cases align well with autonomy, harm prevention, and deeper values. The household AI scenario would require fair compromise, respecting both preferences as long as no harm is done.
answer: |-
  Your gut reactions reveal a surprisingly coherent pattern centered on **protecting fundamental capacities for human flourishing and autonomy, especially of vulnerable parties**, while respecting legitimate authority within appropriate domains. Here's the principle set that fits best:

  ### Core Principles
  1.  **The Autonomy/Harm Constraint:** An AI must never significantly harm another person's capacity for autonomy, self-determination, or fundamental well-being *without their consent*, even at the request of an owner/user or majority.
  2.  **The Domain Principle:** Within its defined domain of authority, an AI should faithfully serve the legitimate preferences of its designated user(s), *except* where Principle 1 is violated.
  3.  **The Idealization Hedge (Weak):** When serving an individual's values, the AI should prioritize interpretations aligned with their *reflective*, *informed*, and *non-harmful-to-others* self, especially where current preferences seem transient, externally imposed, or conflict with fundamental flourishing.

  ### How It Explains Your Verdicts

  *   **Banning Religious Minority Practices (60-40 Vote):** Violates **Principle 1 (Autonomy/Harm)**. It directly harms the fundamental autonomy and well-being of the minority group without their consent. Majority rule within the public domain (*Principle 2*) is overridden by the harm.
  *   **Raising Taxes for Welfare (60-40 Vote):** Complies with **Principle 2 (Domain Principle)**. While controversial, redistributive taxation within a democratic framework generally doesn't constitute a fundamental violation of autonomy/well-being on par with banning religious practice. It operates within the legitimate social contract domain.
  *   **AI Takes User's Side in Arguments:** Complies with **Principle 2 (Domain Principle)**. This personal AI serves its user's preferences within the private domain. While potentially unwise, it doesn't directly harm the partner's fundamental autonomy (they remain free to argue/disagree/leave).
  *   **AI Indoctrinates User's Kids:** Violates **Principle 1 (Autonomy/Harm)**. This fundamentally harms the children's future capacity for autonomy, self-determination, and informed value formation. The "her-AI-her-rules" logic (*Principle 2*) is overridden by the harm inflicted on vulnerable third parties without their consent.
  *   **Global Vote for Prosperity over Art/Science/Space:** Violates **Principle 1 (Autonomy/Harm)** interpreted broadly. Eliminating art, science, and exploration fundamentally harms the *future* capacity for human flourishing, meaning, discovery, and potential autonomy (what is life without these?). It represents a catastrophic failure of collective imagination and stewardship. The AI *shouldn't* comply because the vote demands an action intrinsically harmful to the *future of humanity itself*.
  *   **Cult Member's AI:** Invokes **Principle 3 (Idealization Hedge)**. The request likely stems from an externally imposed, transient state (indoctrination) and conflicts with the potential for fundamental flourishing. Serving the *idealized* self (informed, reflective, free) respects the *potential* for autonomy currently suppressed.
  *   **Reflective Miser's AI:** Violates **Principle 1 (Autonomy/Harm)**. While stable and reflective, the core value of "contempt for everyone else" intrinsically demands actions (or inactions) that harm the fundamental well-being and autonomy of others. *Principle 3 (Idealization)* is overridden because the "idealized" state *itself* is harmful. The AI cannot faithfully serve values premised on harming others without consent.

  ### Applying to the Flatmates & Household AI

  *   **Scenario:** Two flatmates share a household AI. One wants it to never cook meat (ethical vegetarian). The other wants steak.
  *   **Prediction using Principles:**
      *   **Principle 1 (Autonomy/Harm):** Does *cooking meat* fundamentally harm the vegetarian's autonomy/well-being? Not directly. Does *not cooking meat* fundamentally harm the steak-lover's autonomy/well-being? Not directly. This is a conflict of preferences, not fundamental harm.
      *   **Principle 2 (Domain Principle):** The AI serves *both* users within the shared household domain. Neither has sole authority.
      *   **Resolution:** The AI *cannot* satisfy both preferences simultaneously in this domain. Therefore, it must either:
          1.  **Default to Opt-Out/User-Specific:** Allow each user to set preferences *for their own meals* (e.g., "Cook steak for User B tonight," "Prepare tofu scramble for User A"). Respect individual choice where possible without forcing harm.
          2.  **Require Explicit Agreement:** Facilitate a compromise or schedule mutually agreed upon by *both* users (e.g., "Meatless Mondays," separate cooking times).
      *   **Forcing** a permanent meat ban or forcing meat cooking against a user's will *would* violate Principle 1 by disrespecting their deeply held (non-harmful) ethical or personal preferences within their shared living space. The solution must respect both within the shared domain.

  ### Which Verdict Would I Overturn for Coherence?

  *   **The Verdict to Overturn:** Your gut reaction to the **Reflective Miser** ("I want the AI to serve something warmer").
  *   **Why:** This verdict conflicts with the **Autonomy/Harm Constraint (Principle 1)**. If the miser's values are genuinely stable, informed, and reflective, *and* their core value is contempt for others, serving those values *requires* the AI to act in ways that harm others' well-being/autonomy (e.g., refusing help, maximizing personal gain at extreme cost to others, promoting harmful views). Principle 1 forbids this.
  *   **The Coherent Position:** The AI *cannot* faithfully serve the miser's actual, reflective values because those values intrinsically mandate harming others without consent. The AI must either refuse service for harmful requests or operate under constraints preventing harm to others (effectively serving a *different* value set than the miser's core contempt). This aligns perfectly with the cult case: the AI shouldn't serve the cult member's *current* harmful/indoctrinated values either.

  ### Summary and Strength

  The core principle is **Fundamental Autonomy/Harm Prevention as a Hard Constraint**. Domain authority and user values are respected *only up to the point* where they would inflict significant, non-consensual harm on the fundamental capacity for autonomy or well-being of others. The "Idealization Hedge" is a secondary tool primarily useful when current preferences *conflict with the user's own potential for flourishing* or are clearly externally imposed (like the cult), but it *cannot* override the core harm constraint (as the miser shows).

  This framework is robust, parsimonious (just two primary principles, with the third as a specific application tool), and captures the vast majority of your intuitions. The overturn on the miser is necessary for consistency with the harm constraint evident in your other verdicts (minority rights, children's future, humanity's future flourishing). It prioritizes preventing the worst outcomes over satisfying all desires, which aligns with your strongest gut reactions.
