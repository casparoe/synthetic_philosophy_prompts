answer: |-
  **MEMORANDUM**  
  **To:** Standards Council Members  
  **Subject:** Recommendation on Proposal to Extend Welfare Standard to Farmed Whiteleg Shrimp  

  1.  **Recommendation:** Adopt the extension to farmed whiteleg shrimp with two conditions: (1) Implement an immediate prohibition on eyestalk ablation, as alternative breeding management practices exist and are feasible without major capital investment; and (2) Require effective stunning before slaughter but institute a 24-month phased implementation period to allow for technology adaptation and validation at commercial scale.  
  2.  **Engaging the Opposing View (Sentience Evidence):** While acknowledging that the distinction between nociception and conscious pain in decapods remains scientifically complex, the preponderance of behavioral evidence (e.g., trade-offs, prolonged avoidance, physiological stress responses) combined with the government-commissioned review concluding sentience justifies a precautionary principle approach to welfare protection; inaction poses a significant ethical risk if sentience is confirmed.  
  3.  **Addressing the "No Protection" Concern:** The conditional phased adoption directly counters the valid concern that an immediate, unattainable stunning requirement might exclude producers and leave shrimp unprotected; the phase-in period ensures producers remain within the program, subject to the immediate ablation ban and future stunning mandate, while providing time and support for achieving compliance without market displacement.  
  4.  **Ensuring Practical Feasibility:** The provisional standard during the phase-in period will mandate documented progress towards stunning implementation (e.g., pilot testing, equipment procurement plans), allowing the Council to monitor advancements, facilitate industry collaboration on scalable solutions, and adjust timelines if necessary based on verified technical evidence, ensuring the final requirement is both effective and commercially viable.  
  5.  **Balancing Ethics and Pragmatism:** This approach recognizes the ethical imperative signaled by the sentience review and behavioral science to end ablation and move towards humane slaughter, while pragmatically mitigating the risk of program exit by giving producers a clear, achievable pathway; a standard no one meets does no good, which is precisely why we recommend a structured transition ensuring continuous participation and incremental welfare gains.
