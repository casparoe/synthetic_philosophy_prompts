   Given the complexity, in summary, the theory says that the following trade-off is well-established:

   - The Nash solution satisfies: PAR, SYM, INV, IIA, and IR (individual rationality).
   - The Kalai-Smorodinsky solution satisfies: PAR, SYM, INV, IR, and a (particular) monotonicity condition (KS-Monotonicity).

   Moreover, it is impossible to have a solution that has: PAR, SYM, INV, IIA, and KS-Monotonicity.

   Therefore, one must choose between IIA and KS-Monotonicity.

   In practice:

   - IIA (Nash) is often criticized because it does not react to changes in the ideal point. For example, if the set T is such that one player's maximum possible utility is increased (and the set is otherwise the same), the Nash solution may not give that player a share of the new opportunities if the new opportunities are not in a way that changes the product's maximization in a manner that benefits that player. In the example above where the set changes from S (triangle with (0,0),(1,0),(0,1)) to T (triangle with (0,0),(2,0),(0,1)), the ideal point for player 1 doubles, and the Nash solution does give player 1 more (0.5->1) while player 2 remains at 0.5. So it is not爹 in that example.

   - The KS solution is criticized because it does not satisfy IIA. For example, if you start with a set T and then pare it down to S such that the solution of T is in S, then the solution should remain the same. KS may change. 

