  ### Axiomatic Bargaining Theory: Desiderata for Fair Division Rules

  Your dissolution scenario requires a rule satisfying explicit, mutually agreeable properties. The Nash and Kalai-Smorodinsky solutions represent two dominant approaches, but they conflict on a key axiom. Below, I distill the core desiderata, their motivations, and the fundamental tradeoff. The criteria are ordered by near-universal acceptance, with controversy noted.

  #### **Core Desiderata**
  1. **Individual Rationality (IR)**  
     - **Specification**: No player receives less than their disagreement payoff. Formally, \( F_i(S, d) \geq d_i \).  
     - **Motivating Scenario**: If you walk away, you get \(d_1\); your cofounder gets \(d_2\). Any agreement must weakly dominate walking away.  
     - **Status**: Non-negotiable. Violating this defeats the purpose of bargaining.

  2. **Pareto Optimality (PAR)**  
     - **Specification**: No alternative exists that makes one player better off without harming the other. Formally, \( F(S, d) \) is on the Pareto frontier of \(S\).  
     - **Motivating Scenario**: Splitting company assets inefficiently (e.g., leaving cash unused or synergies unexploited) destroys value. PAR ensures all gains are captured.  
     - **Status**: Non-negotiable. Efficiency is the goal of negotiation.

  3. **Scale Invariance (INV)**  
     - **Specification**: The solution is invariant to positive affine transformations of utilities. If \( \hat{u}_i = a_i u_i + b_i \) (\(a_i > 0\)), then \( F(\hat{S}, \hat{d}) = (a_1 F_1 + b_1, a_2 F_2 + b_2) \).  
     - **Motivating Scenario**: You report utils in "dollars," your cofounder in "thousands of dollars." The physical division (e.g., asset splits) shouldn’t change.  
     - **Status**: Non-negotiable. This avoids interpersonal utility comparisons; utilities are cardinal but zero and unit are arbitrary.

  4. **Symmetry (SYM)**  
     - **Specification**: If \(S\) is symmetric (i.e., \((u_1, u_2) \in S \iff (u_2, u_1) \in S\)) and \(d_1 = d_2\), then \(F_1(S, d) = F_2(S, d)\).  
     - **Motivating Scenario**: If you and your cofounder have identical outside options and the feasible set is mirror-symmetric (e.g., splitting cash equally is feasible), the rule must prescribe equal payoffs.  
     - **Status**: Near-universal. Fairness demands equal treatment of equals.

  ---

  #### **Controversial Desiderata: The Nash vs. Kalai-Smorodinsky Divide**
  Here, axioms conflict, forcing a choice. The tension centers on **monotonicity** vs. **independence of irrelevant alternatives (IIA)**.

  5. **Monotonicity (MON)**  
     - **Specification (Kalai-Smorodinsky variant)**: If \(S \subseteq T\) and the ideal point \((u_1^*(T), u_2^*(T))\) dominates \((u_1^*(S), u_2^*(S))\) (i.e., \(u_i^*(T) \geq u_i^*(S)\)), then \(F_i(T, d) \geq F_i(S, d)\).  
     - **Motivating Scenario**:  
       - Suppose initially, due to your skills, your *best attainable payoff* if your cofounder gets their disagreement utility is \(u_1^*(S) = 100\), while theirs is \(u_2^*(S) = 50\). The KS solution gives you both 50% of their ideal (\(u_1 = 50, u_2 = 25\)).  
       - Now, your opportunities improve: \(u_1^*(T) = 200\) (e.g., a new investor values your skills), but \(u_2^*(T) = 50\) (your cofounder’s options unchanged). MON requires you get at least 50 in the new solution.  
       - **Nash fails here**: It might assign you *less* if the new options don’t align with Nash product maximization.  
     - **Status**: Defended as "no harm from growth." Critics argue it ignores *why* the set expanded.

  6. **Independence of Irrelevant Alternatives (IIA)**  
     - **Specification**: If \(S \subseteq T\) and \(F(T, d) \in S\), then \(F(S, d) = F(T, d)\).  
     - **Motivating Scenario**:  
       - Initially, you negotiate over a large set \(T\) (e.g., all asset divisions), and the rule picks split \(x\).  
       - Later, a subset \(S \subset T\) is feasible (e.g., some divisions are ruled out legally), but \(x\) remains available. IIA requires the rule to stick with \(x\).  
       - **KS fails here**: It may shift to a new point in \(S\), reacting to the removal of options.  
     - **Status**: Controversial. Defended as "procedural consistency," but critics claim it assumes removed alternatives were irrelevant (they might have anchored perceptions of fairness).

  ---

  ### **The Impossibility: Why You Must Choose**
  - **Nash’s Theorem**: PAR, SYM, INV, and IIA jointly **uniquely determine** the Nash solution:  
    \[
    F_{\text{Nash}} = \arg \max_{(u_1, u_2) \in S, \, u_i \geq d_i} (u_1 - d_1)(u_2 - d_2)
    \]
  - **Kalai-Smorodinsky’s Result**: PAR, SYM, INV, and MON jointly **uniquely determine** the KS solution:  
    \[
    F_{\text{KS}} = \text{point on the Pareto frontier where } \frac{u_1 - d_1}{u_1^*(S) - d_1} = \frac{u_2 - d_2}{u_2^*(S) - d_2}
    \]
  - **The Tradeoff**:  
    **No solution satisfies all five axioms (PAR, SYM, INV, MON, IIA)**. Kalai-Smorodinsky proved MON and IIA are incompatible under the other axioms.  
    - **Consequence**:  
      - Choose **Nash** if you prioritize IIA (consistent choices regardless of irrelevant options).  
      - Choose **KS** if you prioritize MON (no penalty for asymmetric improvements in potential).  

  #### **Illustrative Division Problem**
  - **Setup**: \(d = (0, 0)\), \(S = \text{convex hull of } (0,0), (1,0), (0,1)\). Both solutions agree: \((0.5, 0.5)\).  
  - **Expanded Set**: \(T = \text{convex hull of } (0,0), (2,0), (0,1)\).  
    - **Ideal points**: \(u_1^*(T) = 2\) (you), \(u_2^*(T) = 1\) (cofounder).  
    - **Nash solution**: Maximizes \(u_1 \cdot u_2\) on \(u_1 + 2u_2 = 2\). Solution: \((1, 0.5)\).  
    - **KS solution**: Equalizes relative gains: \(\frac{u_1}{2} = \frac{u_2}{1} \Rightarrow u_1 = 2u_2\). On \(u_1 + 2u_2 = 2\): \((1, 0.5)\).  
  - **Asymmetric Expansion**: \(T' = \text{convex hull of } (0,0), (2,0), (0,1), (0,1.5)\).  
    - **Ideal points**: \(u_1^*(T') = 2\) (you), \(u_2^*(T') = 1.5\) (cofounder).  
    - **Nash solution**: Maximizes \(u_1 \cdot u_2\) on the frontier. If the frontier is from (2,0) to (0,1.5), solution: \((1, 0.75)\) (via calculus).  
      - You gain less (1.0 → 1.0) while your cofounder gains more (0.5 → 0.75) despite your ideal point doubling. **Violates MON for you**.  
    - **KS solution**: \(\frac{u_1}{2} = \frac{u_2}{1.5} \Rightarrow u_1 = \frac{4}{3}u_2\). On \(u_1 + \frac{3}{2}u_2 = 3\) (adjusting for frontier), you get more than before. **Satisfies MON**.  

  ---

  ### **Solution Scorecard**
  | **Axiom**          | **Nash** | **Kalai-Smorodinsky** |  
  |---------------------|----------|-----------------------|  
  | **IR**              | ✓        | ✓                     |  
  | **PAR**             | ✓        | ✓                     |  
  | **INV**             | ✓        | ✓                     |  
  | **SYM**             | ✓        | ✓                     |  
  | **IIA**             | ✓        | ✗                     |  
  | **MON**             | ✗        | ✓                     |  

  - **Nash**: Favors consistency (IIA). Sacrifices monotonicity—parties may lose out when their opportunities improve.  
  - **Kalai-Smorodinsky**: Favors equity in relative gains (MON). Sacrifices IIA—removing "irrelevant" options can shift the outcome.  

  #### **Third Contender: Egalitarian Solution**  
  - **Specification**: Maximizes \(\min\{u_1 - d_1, u_2 - d_2\}\) (equal absolute gains).  
  - **Axioms**: Satisfies PAR, SYM, MON, and IR. **Fails INV and IIA**.  
  - **Use Case**: Defensible if interpersonal utility comparisons are meaningful (e.g., both utilities in comparable units), but violates scale invariance.  

  ---

  ### **Recommendation**
  - **If outside options are asymmetric** (e.g., your skills command a higher market price than your cofounder’s):  
    - Choose **Kalai-Smorodinsky** if you believe a party’s *potential gains* should protect them from losing out when the feasible set expands.  
    - Choose **Nash** if you want removal of options (e.g., invalid asset splits) to never alter the chosen split.  
  - **Symmetric case**: Both solutions coincide.  
  - **Commit upfront**: Embed the chosen rule in your dissolution agreement:  
    - *Nash*: "Split maximizing \((u_1 - d_1)(u_2 - d_2)\)."  
    - *KS*: "Split where \(\frac{u_1 - d_1}{u_1^* - d_1} = \frac{u_2 - d_2}{u_2^* - d_2}\)."  

  The Nash/KS dichotomy is foundational—your choice hinges on whether MON or IIA better reflects your fairness ideal.
