  We are discussing the axiomatic approach to bargaining problems. The goal is to define a set of desiderata (axioms) that a fair bargaining solution should satisfy, and then examine the Nash and Kalai-Smorodinsky solutions in light of these, including the impossibility of satisfying all at once.

  The standard setup:
  - Two players, with a set of feasible utility outcomes S, which is a convex, compact subset of R^2 (representing the utilities of player 1 and 2).
  - A disagreement point d = (d1, d2) in S, which is the outcome if they fail to agree. We assume there exists at least one point in S that is strictly better than d for both.

  The bargaining solution is a function F(S,d) that picks a point in S.

  We consider the following desiderata:

  1. Pareto Optimality (PAR): The solution should be such that there is no other point in S that is better for one player without being worse for the other. Formally, F(S,d) is Pareto optimal if there is no (u1,u2) in S such that u1 >= F1(S,d) and u2 >= F2(S,d) with at least one strict inequality.

     Why: Any solution that leaves mutual gains on the table is inefficient. In the dissolution of a company, we don't want to waste value.

  2. Symmetry (SYM): If the bargaining problem is symmetric (i.e., d1 = d2 and the set S is symmetric with respect to the line u1=u2), then the solution should be on the line of symmetry: F1(S,d)=F2(S,d).

     Why: If both players have the same outside option and the feasible set is symmetric, then they should receive equal shares. This seems fundamental to fairness.

  3. Scale Invariance (INV) (or Invariance under Positive Affine Transformations): If we transform the problem by changing the utility scales of the players linearly (but positively), the solution should transform accordingly. Specifically, let T1(u1)=a1*u1+b1 and T2(u2)=a2*u2+b2 with a1,a2>0. Then, for the transformed problem (S', d') where S' = { (T1(u1), T2(u2)) | (u1,u2) in S } and d' = (T1(d1), T2(d2)), we have F(S', d') = (T1(F1(S,d)), T2(F2(S,d))).

     Why: This ensures that the solution does not depend on the arbitrary choice of utility units (e.g., dollars vs. thousands of dollars) or the zero point. Without this, the solution would be sensitive to how we measure utility. This is generally considered non-negotiable because it avoids the need for interpersonal utility comparisons. However, note that it does require that the utilities are at least cardinal (with ratio scale) and comparable only in the sense that the zero and unit are arbitrary.

  4. Individual Rationality (IR): The solution should give each player at least as much as they get at the disagreement point: F1(S,d) >= d1 and F2(S,d) >= d2.

     Why: Otherwise, a player would be better off walking away. This is non-negotiable.

  5. Independence of Irrelevant Alternatives (IIA): If we have two bargaining problems (S,d) and (T,d) with S ⊆ T, and if F(T,d) is in S, then F(S,d) = F(T,d).

     Why: If the solution chosen in a larger feasible set T is also available in a smaller set S, then restricting the set to S should not change the outcome. This axiom is often criticized because the removal of alternatives might change the perceived fairness. For example, if an alternative that was better for one player is removed, that player might feel entitled to less? But the axiom says that as long as the solution remains available, the removal of other options should not matter. The classic defense is that the solution should depend only on the available options and the disagreement point, and not on the history of how the set was formed. However, it is the most controversial.

  6. Monotonicity: There are different forms. We consider two:

     a. Individual Monotonicity (IM): If the set of feasible outcomes expands in a way that benefits only one player (while keeping the disagreement point fixed), then that player should not end up worse off. Formally, if S ⊆ T and the set of outcomes for player 2 remains the same (i.e., for every u1 in [d1, ...] the maximum u2 such that (u1,u2) in T is the same as in S) then F1(T,d) >= F1(S,d). Similarly for player 2.

     b. Kalai-Smorodinsky Monotonicity (KSM): If we consider two problems (S,d) and (T,d) such that the ideal point (the point (max{u1: (u1,u2) in S, u2>=d2}, max{u2: (u1,u2) in S, u1>=d1})) for T is at least as good for both players as that for S (and T contains S), then the solution for T should be at least as good for both players as the solution for S. But the standard monotonicity axiom in the context of Kalai-Smorodinsky is:

        Let u*(S) = (u1*(S), u2*(S)) be the ideal point of S, where u1*(S) = max { u1 : (u1,d2) in S } and similarly for u2*(S). Then, if we have two problems (S,d) and (T,d) such that S ⊆ T and u*(S) = u*(T) (so the ideal point remains the same), then the solution for S should be the same as for T? Actually, the Kalai-Smorodinsky solution satisfies a different form: if we have two problems (S,d) and (T,d) with the same disagreement point and S ⊆ T, and if the ideal point for T is the same as for S, then the solution for (S,d) should be the same as for (T,d). This is sometimes called the "restricted monotonicity" or "individual monotonicity" in the literature.

     However, the key monotonicity that Kalai-Smorodinsky satisfies is:

     - If we fix the disagreement point and the ideal point for one player, and expand the set so that the other player's ideal point increases, then the solution should not decrease for the player whose ideal point increased.

     But the most cited form is:

     - (KS Monotonicity): If S ⊆ T and the ideal point of T is at least as large as that of S for both coordinates, then F(T,d) should be at least as good as F(S,d) for both players.

     Actually, the axiom that Kalai and Smorodinsky used to characterize their solution is:

     "Individual Monotonicity": Let (S,d) and (T,d) be two problems with the same disagreement point. Suppose that for every utility level u1 of player 1, the maximum utility that player 2 can achieve in T is at least as high as in S (and similarly, for every utility level u2 of player 1, the maximum utility for player 1 in T is at least as high as in S). Then, F2(T,d) >= F2(S,d) and F1(T,d) >= F1(S,d).

     However, the standard statement of the trade-off is that the Nash solution satisfies IIA but not the KS Monotonicity, and the KS solution satisfies KS Monotonicity but not IIA.

     Why is monotonicity compelling? Consider a situation where the feasible set expands in a way that only one player's maximum possible payoff increases (while the other's remains fixed and the disagreement point is unchanged). It seems unfair that the player who now has more potential gains would not get at least as much as before. For example, if the company dissolution now allows one founder to get a better deal elsewhere (so the ideal point for that founder increases) without changing the other's, then the first founder should not get less than before.

