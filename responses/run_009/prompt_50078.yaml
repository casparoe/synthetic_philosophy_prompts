  Example from Kalai and Smorodinsky (1975):

  Consider two problems with d=(0,0):

  Problem A: SA = convex hull of (0,0), (0,1), (1,0), (0.5,0.5) -> but (0.5,0.5) is in the set.

  Problem B: SB = convex hull of (0,0), (0,1), (2,0)   [ triangle with vertices (0,0), (2,0), (0,1) ]

   The ideal point for SA: 
     player 1: max u1 = 1 (at (1,0))
     player 2: max u2 = 1 (at (0,1))
     so ideal point (1,1)

   The ideal point for SB: 
     player 1: max u1 = 2 (at (2,0))
     player 2: max u2 = 1 (at (0,1))
     so ideal point (2,1)

   The KS solution for SA: the line from (0,0) to (1,1) has slope 1. The Pareto frontier of SA is the same as S in the first example: the line from (1,0) to (0,1) -> u1+u2=1. The intersection: u1=u2 and u1+u2=1 -> (0.5,0.5).

   The KS solution for SB: the line from (0,0) to (2,1) has slope 1/2. The Pareto frontier of SB is the line from (2,0) to (0,1): which is u1/2 + u2 = 1 (or u1 + 2*u2 = 2). The intersection: u2 = (1/2)*u1, and u1+2*u2=2 -> substitute: u1+2*(0.5*u1)=2 -> u1+u1=2 -> u1=1, u2=0.5.

   So the KS solution for SB is (1,0.5).

   Now, note that SA is not a subset of SB.

   How about if we consider:

   Let d = (0,0)
   Let T = convex hull of (0,0), (2,0), (0,1)   [SB]
