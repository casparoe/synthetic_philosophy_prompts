  ### Thought Experiment: The Borrowed Ladder  
  **Setting:** A shared residential building with a small garden. Alex, a resident, needs to prune an overhanging branch that's about to damage her window during an impending storm. Her neighbor Sam owns a ladder that would be perfect for the job. Sam is away for the weekend, and Alex cannot reach them. Alex borrows the ladder without permission, uses it for 15 minutes, and returns it undamaged to Sam's storage area before Sam returns.  

  #### Two Sincere Maxims:  
  1. **Coarse-grained maxim:** "I will borrow property without the owner’s consent when it is convenient for me and I can return it undamaged."  
  2. **Fine-grained maxim:** "I will borrow property without consent *only* in an emergency where delay would cause significant harm, the owner is unavailable, I have strong reason to believe the owner would consent if asked, and I return it immediately without damage."  

  ---

  ### Step 1: Applying the Universalizability Tests  
  #### **Maxim 1 (Coarse-grained):**  
  - **Universalization:** Everyone borrows property without consent whenever convenient and returnable.  
  - **Contradiction-in-conception test:**  
    - The maxim presupposes the institution of private property (ownership implies control over use).  
    - If universally adopted, no one could reliably claim exclusive use of their property. Borrowers would constantly take items without asking, rendering ownership meaningless. The practice of "borrowing" collapses because there is no stable ownership to borrow *from*—property becomes de facto communal.  
    - **Result:** **FAIL** (self-undermining; property rights disintegrate).  

  #### **Maxim 2 (Fine-grained):**  
  - **Universalization:** Everyone borrows without consent *only* in emergencies (harm-prevention), with owner unavailable, strong belief in consent, and immediate return.  
  - **Contradiction-in-conception test:**  
    - Property rights remain intact because borrowing is rare, context-bound, and respects ownership norms. Emergencies are exceptional, and the "strong belief in consent" condition aligns with mutual respect (owners would likely consent if present).  
    - **Result:** **PASS** (no institutional collapse; property persists).  
  - **Contradiction-in-will test (stricter test for imperfect duties):**  
    - A rational agent necessarily wills the preservation of their own agency and well-being (e.g., avoiding preventable harm).  
    - In a world where no one ever lends in emergencies, agents could not will this universal law without frustrating their own necessary ends (e.g., protecting their property from storm damage).  
    - Thus, a rational agent *cannot* will this maxim’s universal *negation* (i.e., "never borrow without consent, even in emergencies").  
    - **Result:** **PASS** (universalizing this maxim aligns with necessary human ends).  

  ---

  ### Step 2: What Feature Is Doing the Work?  
  **The freedom to redescribe the maxim** is the core issue. Both maxims are honest descriptions of Alex’s action:  
  - The coarse maxim captures her *general attitude* toward borrowing ("I’ll take it if harmless").  
  - The fine maxim captures her *specific justification* ("This is an emergency with safeguards").  
  Neither description is illegitimate:  
  - The coarse maxim does *not* omit anything Alex relies on; she *does* assume the harmlessness of her act.  
  - The fine maxim is not "rigged"; it reflects her actual reasoning about the emergency and Sam’s likely consent.  
  **The verdict flips because the coarse maxim universalizes a broad practice that erodes social institutions, while the fine maxim universalizes a narrow exception that preserves them.**  

  ---

  ### Step 3: How a Kantian Defender Would Block Redescription  
  A Kantian might impose **two principled constraints on maxim descriptions**:  
  1. **The "Motivational Specificity" Requirement:**  
     - Maxims must include all subjectively motivating factors (e.g., "emergency," "owner unavailable").  
     - *Rationale:* Kant states that a maxim is a "subjective principle of volition" (*Groundwork* 4:401n). If Alex’s primary motive is harm-prevention (not convenience), omitting this distorts her will.  
     - **Principled defense:** This avoids arbitrariness by tethering the maxim to psychological reality. We "test" the description by asking: *Would the agent still act if this condition were absent?* If removing "emergency" would change Alex’s decision (she wouldn’t borrow for non-urgent tasks), it must be included.  

  2. **The "Relevant Generality" Requirement:**  
     - Maxims must be framed at a level of generality that reflects the agent’s fundamental reason for acting.  
     - *Rationale:* Kant argues that maxims express practical reasons (*Critique of Practical Reason* 5:19). The coarse maxim ("borrow when convenient") is *too* general—it ignores Alex’s core reason (preventing imminent harm).  
     - **Principled defense:** Generality is constrained by the agent’s own purpose. We ask: *What makes this act seem permissible to the agent?* If Alex appeals to the emergency, her maxim cannot exclude it.  

  **Would this avoid being ad hoc?**  
  - **Yes**, if grounded in Kant’s theory:  
    - Kant’s *Doctrine of Virtue* (6:389) implies that maxims must include "the end one has in view." Alex’s end is harm-prevention, not mere convenience.  
    - The test becomes non-arbitrary because it focuses on the agent’s *actual practical reasoning*, not a post hoc moralized description.  
  - **No**, if poorly applied:  
    - If "motivational specificity" is used to *retroactively* add justifications (e.g., Alex never considered "Sam’s consent"), it becomes ad hoc. But in our case, Alex *did* consider these factors.  

  **Tension in Your Specifications:**  
  The specifications *are* satisfiable (as shown), but the tension arises from Kant’s ambiguous requirement that maxims must reflect "all relevant circumstances" without clear criteria for "relevance." A sceptic could argue that *any* maxim can be gerrymandered to pass/fail. The Kantian reply is that relevance is fixed by the agent’s own reasons—but this risks circularity if reasons are redescribed to match desired outcomes.  

  **Conclusion:**  
  This thought experiment exposes a genuine vulnerability in Kantian ethics: **maxim descriptions are underdetermined, creating moral luck in passing the test**. A principled Kantian response requires anchoring descriptions to the agent’s actual motivations and purposes, but this demands careful psychological scrutiny. The ladder example shows that Kant’s theory can handle redescriptions *if* we rigorously apply his "subjective principle" criterion—yet it remains vulnerable to agents who self-deceptively frame their maxims.  

  ---  
  **Final Note:** Kant’s theory *can* survive this challenge by insisting that sincere agents *must* include their fundamental reasons in maxims (e.g., harm-prevention). But it requires agents to engage in honest self-reflection—a demand embedded in Kant’s conception of rational autonomy.
