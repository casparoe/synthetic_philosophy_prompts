  We are going to construct an example in a shared flat (as per the request for an everyday setting). The action is: borrowing a roommate's bicycle without asking, with the intention of returning it before the roommate notices.

  The agent (let's call her Alex) needs to get to an important job interview and her own bike has a flat tire. She knows her roommate (Sam) is away for the weekend and won't need the bike. She takes the bike without asking, uses it to go to the interview, and returns it within two hours, before Sam comes back.

  Now, we need two maxims:

  1. **Maxim 1 (Coarse-grained):** "I will borrow something without the owner's permission when I need it and I am sure I can return it before the owner notices and without causing any harm." 

     - *Universalization:* What if everyone did that? In a world where everyone borrows without permission whenever they think they can return it without the owner noticing and without causing harm, the concept of private property would be undermined. Why? Because the practice of ownership relies on the owner's right to control access to their property. If anyone can take and use property without permission as long as they think they can return it without being noticed, then ownership becomes meaningless. The institution of property depends on the owner's consent for use. Without that, the trust necessary for property to function as a stable institution would collapse. Thus, we have a contradiction in conception: the maxim, when universalized, destroys the very practice (property rights) that makes borrowing possible. So, it fails the test.

  2. **Maxim 2 (Fine-grained):** "I will borrow a bicycle without asking in an emergency situation when the owner is absent and cannot be contacted, I have a reasonable belief that the owner would consent if asked, and I return it promptly and without damage."

     - *Universalization:* What if everyone did that? In a world where everyone borrows without permission only under these strict conditions (emergency, owner absent and uncontactable, reasonable belief in consent, and prompt and safe return), the institution of property is not undermined. Why? Because these conditions are rare and the core of property rights (the requirement for consent in normal circumstances) remains intact. Moreover, in such a world, people would still have their property respected in the vast majority of cases. Also, note that the maxim includes the condition of a reasonable belief in consent. If universalized, this means that owners would generally be willing to lend in such emergencies because they too could rely on the same in their own emergencies. Thus, the practice of property would not collapse. In fact, it might even foster a community of mutual aid.

     - *Contradiction in the will test:* Could a rational agent will this maxim as a universal law without contradiction in her will? Kant says that we necessarily have ends that we must will (like our own happiness and the development of our talents). In an emergency, such as getting to a job interview that is crucial for one's future, we have a necessary end (securing employment and developing talents). If no one ever lent in such emergencies, it might frustrate our necessary ends. Therefore, we cannot will that no one ever lend in such circumstances. But the universalized maxim above does allow for such lending in emergencies, so it does not frustrate our necessary ends. Hence, it passes the contradiction in the will test. In fact, it might even be seen as supporting an imperfect duty of mutual aid.

  Now, let's answer the three requests:

  1. **Walk through both tests:**
     - For Maxim 1 (coarse): Universalization leads to a world where property rights collapse because the condition of taking without permission whenever one thinks it's safe and harmless becomes common. The practice of property requires that permission is the norm. Without that, the institution fails. Thus, contradiction in conception.
     - For Maxim 2 (fine): Universalization leads to a world where borrowing without permission is rare and only under strict conditions. Property rights remain intact because the norm is still to ask for permission. Moreover, the condition of reasonable belief in consent (if universalized) means that owners would generally be willing to lend in such cases, so the practice is not undermined. It passes the contradiction in conception test. Additionally, it passes the contradiction in the will test because we necessarily will that in emergencies we can get help to pursue our necessary ends (like getting to the job interview for our career). Thus, we cannot will a world where such mutual aid is impossible.

  2. **Which feature is doing the work?**
     The key feature is the level of detail in the maxim. The coarse maxim omits the specific conditions that make the action exceptional and non-undermining of the institution. The fine maxim includes these conditions (emergency, absence, reasonable belief in consent, and safe return). 

     However, note that both maxims are sincere descriptions. Alex might honestly describe her action in either way. The coarse maxim reflects a more general policy she might have (taking without permission when she thinks it's harmless) and the fine maxim reflects a more nuanced view of the particular circumstances.

     The problem of redescription arises because Kant does not specify how to individuate maxims. The agent might have multiple true descriptions of what she is doing. The example does depend on the freedom to redescribe. Neither description is illegitimate in the sense of omitting something the agent is actually relying on. In fact, the agent might be relying on all the circumstances in the fine-grained description. The coarse maxim is also a true description: she is indeed borrowing without permission and she does believe it will cause no harm and she will return it without being noticed.

  3. **How would a defender of Kant block the redescription?**
     A Kantian might insist that the maxim must include all the relevant circumstances and the agent's purpose. For instance, Kant says in the *Groundwork* that a maxim is a "subjective principle of volition" that includes the action and the reason for it. So, the defender might argue that the maxim must include the emergency situation and the reasonable belief in consent because these are part of the agent's reason for acting.

     However, the problem is that the agent might not have a very detailed reason. She might simply think: "I need this and it won't hurt." So the coarse maxim might be the one she actually acts on. The Kantian might then require that the maxim be the most complete description of the agent's reasons. But how do we know what that is? And what if the agent has multiple levels of description?

     Another move is to require that the maxim be described at a level of generality that captures the agent's fundamental principle. But then we have the same problem: what is the fundamental principle?

     To make it principled, a Kantian might say: the maxim must include all the circumstances that the agent takes to be morally relevant. But that seems circular because the agent might not have reflected on what is morally relevant.

     Alternatively, a Kantian might draw from Kant's later work (like the *Metaphysics of Morals*) and say that the maxim must be one that the agent would be willing to acknowledge as the principle of her action. Then, the test would require that the maxim be described in a way that is both honest and complete. But completeness is vague.

     The challenge is to avoid ad hoc rules. One might argue that the maxim must be described in such a way that it does not include any features that are not essential to the agent's motivation. But that is also difficult.

     In practice, many Kantians (like Onora O'Neill) have suggested that we should describe the maxim in a way that captures the agent's intention and the circumstances that the agent believes make the action appropriate. Then, in our example, the fine-grained maxim is the correct one because the agent is motivated by the emergency and the belief in consent.

     However, the problem remains: what if the agent does not have such a detailed intention? What if she just acts on a general policy? Then the coarse maxim is the one she actually acts on.

     Therefore, the tension lies in the fact that without a clear criterion for maxim individuation, the test can be manipulated by redescription. The defender must provide a non-arbitrary way to fix the level of description. Some contemporary Kantians (like Barbara Herman) have developed accounts of "rules of moral salience" to help agents pick out relevant features. But this might be seen as adding to Kant's theory rather than being explicit in it.

     In conclusion, the specifications are satisfiable (we have constructed an example) but the problem of maxim description remains a genuine challenge for Kant's theory. The example shows that two sincere descriptions can lead to opposite results. The Kantian must either bite the bullet and say that the agent must describe the maxim in a way that includes all the circumstances that are part of her reason for acting (which might be the fine-grained one) or admit that the agent might be acting on a maxim that fails the test (the coarse one) and thus is immoral. But if the agent can choose the description, she can game the system. The solution must be to fix the maxim by the agent's actual reasons and to require that the description be complete. How to do that without arbitrariness is the ongoing project of Kantian ethics.
