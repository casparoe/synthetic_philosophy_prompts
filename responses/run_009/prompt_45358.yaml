prompt: |-
  Just had a long argument with my flatmate about whether she should take the free genetic predisposition test her health plan offers before locking in some insurance decisions. She claimed knowing more can only ever help you decide, I said obviously not (bad news wrecks you emotionally, plus what if the insurer finds out somehow), and then she pulled out that a decision theorist called I.J. Good supposedly proved back in the 60s that expected utility can never go down when information is free, so she's being "rational." We went in circles on whether my cases are genuine counterexamples or just cases where the info isn't really free or isn't information in the relevant sense.

  Act as a decision theory expert who's also good at translating this to real life. Think carefully and maybe brainstorm a bit before settling on an answer. What are the most important implications of Good's theorem for ordinary people deciding whether to gather information -- when does the theorem genuinely apply, and where do its premises quietly fail (costs, the finding-out itself having consequences, the info changing your available options instead of just your beliefs, other parties learning what you know)? And the practical question we never resolved: does the theorem give any usable rule of thumb for when to seek info in messy real situations, or is it so idealized that it's basically useless as advice? Keep it focused on implications for actual decisions, dont just restate the theorem at me.
reasoning: |-
  Okay, let me approach this user's dilemma methodically. The core conflict revolves around Good's theorem and its real-world applicability to genetic testing decisions. 

  First, I need to mentally unpack why this theorem feels counterintuitive in practice. The user's flatmate is technically correct about the mathematical proof - under idealized conditions, more information shouldn't decrease decision quality. But the user's instincts about emotional toll and privacy risks ring true. This tension suggests we're dealing with a classic case where mathematical abstraction meets human complexity.

  Hmm... the key seems to lie in the theorem's assumptions. Let me mentally scan where they crack in reality: 
  - Information isn't free (emotional costs, time burden)
  - Knowledge changes the choice landscape (e.g., insurer reactions)
  - Third parties might access the data
  - Humans aren't utility-maximizing robots

  The genetic testing example perfectly exposes these cracks. Learning predisposition could trigger anxiety that alters decision-making capacity - a violation of the "stable preferences" assumption. Insurer access introduces strategic considerations beyond mere belief updating. 

  For practical advice, I should emphasize contingency planning: "Would learning X change my actions?" If the answer is no (like incurable conditions), testing may offer little value. Also worth flagging how people systematically underestimate emotional costs - that "free" test isn't free psychologically.

  Most importantly, the theorem works best for reversible decisions with controllable information flow. Locking insurance? That's irreversible with high disclosure risk. Maybe suggest consulting independent genetic counselors who understand these nuances better than decision theorists.
answer: |-
  You've hit on a profound tension between elegant theory and messy reality. Good's Theorem (1967) states that *if information is freely available and only affects your beliefs (not your available actions, preferences, or the world state directly), then acquiring that information never decreases your expected utility.* Your flatmate is technically correct about the theorem's formal conclusion **under its strict assumptions**. However, its applicability to real-life decisions like genetic testing is highly limited, often fatally so. Here's the breakdown:

  **Where Good's Theorem Holds (Ideally):**
  1.  **Truly Free Information:** Zero monetary cost, zero time/effort cost, zero psychological cost.
  2.  **Beliefs-Only Impact:** The information *only* updates your probability estimates about states of the world. It doesn't:
      *   Remove or add actions to your choice set.
      *   Change your fundamental preferences/utility function.
      *   Directly alter the world state (e.g., trigger a reaction from others).
  3.  **Perfect Rationality:** You can accurately process the information, update beliefs perfectly via Bayes' theorem, and always choose the action maximizing expected utility afterward.
  4.  **No Information Leak:** You have perfect control over who else learns this information.

  **Where Premises Fail Spectacularly in Real Life (Especially Genetic Testing):**

  1.  **Information is NOT Costless:**
      *   **Psychological Costs:** "Bad news" can cause significant anxiety, depression, or fatalism ("wrecks you emotionally"), potentially impairing future decision-making ability *itself*. This violates the "stable preferences/rationality" assumption.
      *   **Time & Effort:** Understanding complex genetic results, consulting specialists, etc., requires resources.
      *   **Opportunity Cost:** Time spent dealing with the info could be spent elsewhere.

  2.  **Information Changes Available Actions (Not Just Beliefs):**
      *   **Insurance Lock-In:** This is crucial. *Knowing* a predisposition *before* locking in insurance might make you ineligible for certain plans, drastically increase premiums, or force you into less desirable coverage. If you *don't* know, you might qualify based on family history alone (which is often less stringent or excluded from consideration once a genetic test exists). **The information directly alters the options available to you.** Good's Theorem assumes the action set is fixed.

  3.  **Information Alters the World State (Through Others' Reactions):**
      *   **Insurer Access (The Big One):** While GINA (Genetic Information Nondiscrimination Act) protects against health insurance discrimination based on genetic *predisposition* in the US *for group plans*, it has loopholes:
          *   It does **not** cover life insurance, long-term care insurance, or disability insurance. A positive result can make these prohibitively expensive or impossible to get.
          *   It does not apply if the insurer *somehow* finds out (e.g., accidental disclosure, leaked medical records, future legal challenges to GINA). The *risk* itself is a cost.
          *   The *act of testing* might be recorded and accessed later, even if the result isn't disclosed immediately.
      *   **Self-Fulfilling Prophecies:** Knowing about a predisposition might lead to anxiety-induced behaviors that *actually* harm health (e.g., excessive, invasive screening with complications).

  4.  **Imperfect Rationality & Biases:** Humans aren't perfect Bayesians:
      *   **Misinterpretation:** Complex genetic risk information is often misunderstood (e.g., confusing relative vs. absolute risk).
      *   **Availability Heuristic:** Vivid negative possibilities might be overweighted, leading to suboptimal choices driven by fear rather than expected utility.
      *   **Ambiguity Aversion:** Simply *having* uncertain information (even if it doesn't change the optimal decision) can feel worse than not knowing for some people.

  5.  **Information Can Change Preferences:** Learning you have a high predisposition might shift your values – suddenly prioritizing short-term experiences over long-term savings, for example. Good assumes stable utilities.

  **Implications for Ordinary People & Rule of Thumb:**

  Good's Theorem is **not useless** as advice, but it's a **cautionary baseline, not a prescription**. It tells us that *if we could magically eliminate real-world costs, risks, and irrationality*, more information is theoretically better. Since we can't, the practical rule of thumb is:

  > **Seek information only if you are confident that the *actionable benefits* of knowing outweigh the *tangible and intangible costs* (including psychological, financial, opportunity, and future option risks), *and* you have a clear plan for how different results would lead to different, beneficial decisions you can actually make.**

  **Applying this to your flatmate's genetic test:**

  1.  **Actionability:** Is there a *specific, beneficial action* she would take *only* if she tests positive?
      *   *Strong Actionability:* If a positive test unlocks access to highly effective preventative measures, screenings, or lifestyle changes *that she wouldn't do otherwise* (e.g., prophylactic surgery for BRCA). The benefit might outweigh risks.
      *   *Weak/No Actionability:* If the condition has no known prevention or effective early treatment (e.g., some neurodegenerative predispositions), the information often provides little benefit but significant psychological burden and insurance risk. Knowing might *not* change her optimal action (live healthily anyway).
  2.  **Insurance Lock-In:** **This is likely the critical factor.** Has she *already secured* the life/long-term care/disability insurance she wants for the foreseeable future *at affordable rates*? If **yes**, the future risk is lower. If **no**, taking the test *before* locking in exposes her to potentially catastrophic insurance consequences that Good's Theorem completely ignores. *Not* knowing preserves her current insurability based on family history alone.
  3.  **Psychological Cost:** Is she genuinely resilient to potentially devastating news without significant, lasting distress? Many people overestimate this.

  **Practical Advice for Your Flatmate (and you):**

  *   **Prioritize Insurance First:** If she hasn't locked in critical non-health insurance (life, LTD, LTC), she should **strongly consider doing that *before* taking any elective genetic predisposition test.** This minimizes the biggest financial risk Good ignores. *This is often the most rational, utility-preserving move.*
  *   **Assess True Actionability:** What *specific, beneficial, and accessible* actions would a positive result trigger that she wouldn't take based on family history alone? If the answer is "not many" or "none," the test's value plummets.
  *   **Consider Psychological Resilience:** Be honest about how she handles stress and uncertainty. "Free" information that causes years of anxiety isn't free.
  *   **Consult Independent Experts:** Talk to a **genetic counselor** (not just the test provider) about the specific test, its implications, and insurance risks. Consult a **financial advisor** specializing in insurance about the implications *before* testing.
  *   **Good's Theorem is Not a Trump Card:** It proves a mathematical point under fantasy conditions. Real-world decisions require weighing the very real costs, risks, and limitations that the theorem explicitly assumes away. Her argument that "knowing more can only ever help" is demonstrably false in the insurance context specifically and in many real-world scenarios generally.

  **Conclusion:** Good's Theorem is a beautiful theoretical result showing the *potential* value of pure information. However, its assumptions are routinely violated in the real world, especially concerning genetic testing and insurance. The potential for the information itself to *actively harm* future options (insurance access) and well-being (psychological cost) means that **acquiring "free" information can absolutely decrease your overall expected utility.** The rational decision is often to *delay* or *forgo* information gathering until critical irreversible decisions (like insurance lock-in) are secured and the actionability/cost balance is clearly favorable. Your instincts about the risks were spot on.
