  | **Orwellian Edit**: Brain experiences raw input, then *rewrites memory* after the fact. | **Live feed airs uncut, but EVS server recording is edited *post-broadcast***. As-run log shows original airing + later server edit. | clean | Clear parallel: what aired live is fixed, but the "memory" (server archive) is altered. |
  | **Demand for "When"**: Insistence there's a precise moment/place the experience happened. | **Checking as-run log for frame-accurate timestamp of when a clip aired**. | clean | Broadcast has exact records; equivalent to demanding a "timestamp of consciousness." |
  | **Dennett's Verdict**: No fact of the matter—no single point where consciousness happens. | **Trying to locate "when" a live multi-cam ISO feed becomes "program" without a switcher or log**. | distorted | Broadcast always has a switcher/log; brain has no equivalent "master control" or unified record. |

