   Important: Dennett's view is that the brain does not have a clear boundary between pre-conscious and conscious, and there is no "Cartesian Theater" where it all comes together. In broadcast, we have clear boundaries (e.g., the delay buffer, the switcher, the as-run log).

   Let's build the table:

   Claim 1: Stalinesque edit (the brain stages the event before it reaches consciousness)
    Broadcast equivalent: An edit made in the delay buffer (e.g., the producer kills a replay while it's in the buffer, so it never goes to air). The as-run log would show that the edit was made before the feed went out.

