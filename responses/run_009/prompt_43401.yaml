answer: |-
  ## Brainstorming: Untangling the QALY Paradox

  Your puzzle strikes at the heart of welfare economics and philosophy. Let's dissect the tensions:

  1.  **The Core Conflict:** vNM utility theory (underpinning Standard Gamble/Time Trade-Off) establishes *ordinal, intra-personal* preferences under risk. QALY aggregation requires *cardinal, interpersonally comparable* utility. This is a fundamental disconnect between the *elicitation tool* and the *application*.
  2.  **The Oregon Lesson:** Public outrage highlights that people *do* assign different moral weights to health gains based on recipient characteristics (e.g., severity, age, past disadvantage) – violating the "equal value per QALY" principle. This suggests the implicit theory clashes with widely held moral intuitions.
  3.  **Possible Foundations:** QALY practice *could* implicitly rely on:
      *   **Hedonic Cardinalism:** A "mental stuff" (pleasure, freedom from suffering) quantifiable and comparable across individuals (Bentham, some welfare economists).
      *   **Extended Preferences (Harsanyi):** An impartial observer imagining themselves in every person's position with equal probability, leading to cardinal, comparable utilities derived from individual vNM utilities.
      *   **Social Planner Construct:** A benevolent dictator maximizing an aggregate social welfare function *assumed* to be the sum of individual cardinal utilities.
      *   **Pragmatic Metric:** A non-welfarist ("extra-welfarist") measure of "health gain" as a societal objective, decoupled from strict utility theory.
  4.  **Ordinalist Critique:** A strict ordinalist (e.g., Robbins, modern revealed preference theorists) or preference-satisfaction theorist *cannot* support QALY summation. Without cardinality, the *magnitude* of the 0.05 gain vs. the 1.0 gain is incomparable *within* a person (beyond ordinal ranking). Without interpersonal comparability, summing across persons is meaningless. Changing elicitation methods wouldn't solve this core theoretical barrier for the ordinalist.
  5.  **Distributive Justice:** The "equal value per QALY" principle is *strongly utilitarian* in its distributive implications. It implies:
      *   **Consequentialism:** Only the aggregate outcome matters.
      *   **Sum-ranking:** The good is the sum of individual goods.
      *   **Impartiality:** Identical QALY gains count equally regardless of recipient characteristics.
      *   **Priority to Aggregate Efficiency:** Maximizing total QALYs dominates distributional concerns. Severity weighting (giving more weight to gains for the very ill) introduces an *equity* consideration (e.g., prioritarianism, sufficientarianism, or a concern for the worst-off), directly violating the pure utilitarian foundation of "equal value."

  ---

  ## Reconstructing the Implicit Theory and Its Coherence

  Based on standard practice and its reliance on vNM-based elicitation:

  1.  **What QALY-Based Prioritization Strictly Presupposes:**
      *   **Cardinality within Individuals:** The vNM framework (SG/TTO) assumes individuals have cardinal utilities over health states *under conditions of risk*. The difference between U(State A) and U(State B) has meaning (revealed by risk preferences). This is essential for eliciting the *magnitude* of the disutility of a health state relative to death/perfect health.
      *   **Interpersonal Comparability of Scales:** It assumes that the scale endpoints (0=Death, 1=Perfect Health) represent the *same absolute levels of welfare loss/gain* for everyone. This allows the 0.05 gain for person A to be meaningfully added to the 1.0 gain for person B. This is the crucial, often unstated, leap.
      *   **Linear Aggregation:** It assumes social welfare is the simple sum of these interpersonally comparable cardinal individual utilities (QALYs). A QALY gain is a QALY gain, regardless of source.
      *   **Welfarism (Implicitly):** It treats health gains as directly translatable into welfare gains, making QALYs a proxy for individual well-being.

  2.  **The Most Defensible Reconstruction: Harsanyi's Utilitarianism**
      The most coherent philosophical foundation is **John Harsanyi's Impartial Observer Theorem**. Imagine a rational individual behind a "thin" veil of ignorance:
      *   They know all possible health states and their utilities (via vNM) *for every individual in society*.
      *   They have an equal probability of being any of those individuals.
      *   Choosing under uncertainty, they maximize their *expected utility*.
      *   Harsanyi proved this leads to the social welfare function being the *sum* of individual cardinal vNM utilities.

      **Why it fits:**
      *   Validates the use of vNM utilities (elicited via SG/TTO).
      *   Provides a rigorous ethical argument for *cardinal interpersonal comparability*: The observer needs to compare the utility scales to calculate expected utility across identities.
      *   Directly justifies the *summation* as the expression of impartial, rational choice under uncertainty.
      *   Explains the "equal value" principle: From the impartial perspective, the chance of being *anyone* who gains a QALY is valued equally.
      *   **Coherence Achieved:** The elicitation method (vNM) and the aggregation method (summation) are unified under a single theoretical framework (expected utility maximization under uncertainty from an impartial perspective).

  3.  **Where the Practice Clashes with its Own Foundation (and Alternatives):**
      *   **Severity Weighting:** This directly violates Harsanyi's pure utilitarianism (and the "equal value" principle). It introduces a *distributive value judgment* – that a QALY gain to someone with a very low baseline health state (high severity) is *morally more valuable* than the same gain to someone with a moderate baseline, even though the *welfare gain* (in pure vNM/Harsanyi terms) might be identical. This reflects concerns closer to Rawls (worst-off) or prioritarianism. The practice *cannot* consistently hold both "equal value per QALY" *and* severity weighting without abandoning pure welfarist utilitarianism.
      *   **Ordinalism:** As noted, a strict ordinalist must reject the entire QALY summation project in its current form. The practice *collapses* without cardinal interpersonal comparability. Alternatives for an ordinalist would be radically different:
          *   **Rank-Order Methods:** Prioritize treatments based on the severity of conditions they address (e.g., always treat life-threatening before chronic pain), without quantifying gains.
          *   **Discrete Choice/Efficiency Frontiers:** Use techniques like those in Oregon's *later* (post-outrage) models, focusing on ranking discrete bundles of services based on public preferences or expert panels, avoiding explicit interpersonal utility summation.
          *   **Capabilities Approach (Sen):** Focus on expanding individuals' sets of "functionings" rather than aggregating utility. This is extra-welfarist but requires a different metric entirely.
      *   **Hedonic Cardinalism:** While the practice *fits* with this view, it doesn't strictly *require* it. Harsanyi's reconstruction is arguably more robust, grounding comparability in rational choice under uncertainty rather than a contested metaphysics of "mental stuff." The elicitation method (SG/TTO) reveals preferences under risk, not necessarily raw hedonic states.

  ## Judgment on Consistency

  1.  **Elicitation & Intra-personal Cardinality:** Coherent. SG/TTO are valid vNM elicitation tools for cardinal (within-person) health state utilities under risk.
  2.  **Elicitation & Interpersonal Comparability:** **Incoherent on its own.** vNM theory provides *no basis* for interpersonal comparisons. The jump from individual vNM scales to a common, interpersonally comparable QALY scale requires a *separate, strong ethical assumption* (like Harsanyi's Impartial Observer).
  3.  **Aggregation (Summation):** Consistent *only* with a utilitarian social welfare function (like Harsanyi's) that assumes cardinal interpersonal comparability. Inconsistent with ordinalism and most non-utilitarian distributive theories.
  4.  **"Equal Value" Principle:** Logically consistent *only* with the utilitarian aggregation principle. It *is* the aggregation principle stated as a value.
  5.  **Severity Weighting:** **Fundamentally inconsistent** with the "equal value" principle and the utilitarian foundation (Harsanyi or hedonic). It represents an *equity adjustment* alien to pure QALY maximization. Its flirtation reveals the practice is *not* purely welfarist/utilitarian in practice, incorporating extra-welfarist equity concerns.

  **Conclusion:** Routine QALY-based prioritization implicitly relies on a **utilitarian welfare economics framework**, most defensibly reconstructed via **Harsanyi's Impartial Observer Theorem**. This provides the necessary cardinality and interpersonal comparability missing from vNM theory alone, justifying the summation and the "equal value" principle. However, the practice is **internally inconsistent** in two key ways:

  1.  It relies on vNM elicitation without vNM providing the interpersonal comparability its aggregation requires (solved by Harsanyi's ethical addendum).
  2.  It sometimes introduces severity weighting, which directly contradicts its foundational utilitarian aggregation principle ("equal value per QALY").

  The apparatus **collapses for a strict ordinalist or resolute preference-satisfaction theorist** who rejects both cardinality and interpersonal comparability. Taking the ordinalist critique seriously would necessitate abandoning QALY summation and adopting fundamentally different prioritization methods based on ranking, discrete choice, or non-utility-based metrics like capabilities. The Oregon experience suggests that even if the utilitarian foundation were theoretically coherent, its distributive implications (pure aggregation, ignoring severity/need) may lack sufficient social endorsement to be politically sustainable. The practice, therefore, embodies a tension between theoretical coherence (demanding pure utilitarianism) and practical/political acceptability (demanding some equity adjustments like severity weighting).
