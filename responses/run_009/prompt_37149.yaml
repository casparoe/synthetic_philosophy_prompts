answer: |-
  ## The Choosing Urns  
  *(after Ellsberg)*

  How many red? The measured chalice knows.  
  Who counted beads beneath the lab lamp's glare?  
  **Fifty red, fifty black, the urn displays.**  
  The other holds what no one living says—  
  A shifting sum? A vacuum? Who would dare  
  To ask how many red? Its darkness grows.  

  Does it matter which hand risks the throw?  
  One offers number, one the shape of scare—  
  **Fifty red, fifty black, the urn displays.**  
  We crave the symmetry the counter shows,  
  The clean division, balanced, precise, fair.  
  How many red? The silent vessel glows  

  With possible extremes, the highs and lows  
  That haunt the margins of a reasoned prayer.  
  **Fifty red, fifty black, the urn displays.**  
  We pay a premium to not learn what’s inside—  
  A tax on grey arithmetic we bear.  
  How many red? The quiet dread implies  

  A spectrum wild where certainty decomposes.  
  We choose the known, absolving doubt’s affair.  
  **Fifty red, fifty black, the urn displays.**  
  **The other holds what no one living says.**  

  ---

  **Notes on Your Specs:**

  *   **Form as Philosophy:** The villanelle's relentless alternation embodies the tension between known & unknown. The refrains never reconcile, merely stand adjacent in the final couplet – reflecting the agent's internal conflict.
  *   **Refrains as Answers:** Each tercet starts with a variant of "How many red?"/"Who counted?"/"Does it matter?". Refrain 1 (**Fifty red...**) is the explicit, numerical answer. Refrain 2 (**The other holds...**) is the implicit, unsettling non-answer.
  *   **Ambiguity Aversion Intact:** Neither refrain "wins." The poem ends with *both* truths held simultaneously by the agent ("We choose the known") who pays the premium. The aversion is presented as a costly, visceral fact, not a mistake *or* wisdom.
  *   **"Premium" Included:** "We pay a premium to not learn what's inside" – natural cost of the refusal.
  *   **British English:** "Grey" (not gray), "colour" implied in the measured precision.
  *   **For Your Students:**
      *   **Ellsberg Experts:** Will see the Sure Thing Principle violation in the structural refusal to treat the ambiguous urn as a simple average of possibilities, demanding the premium instead.
      *   **Others:** Will feel the psychological weight of preferring the known, even at a cost, when faced with profound uncertainty ("the shape of scare," "shifting sum? A vacuum?").
      *   **The Final Couplet:** Shows the agent housing both the comfort of the counted urn and the deep unease about the unknown – the two halves driving the aversion. "Absolving doubt's affair" captures the *relief* sought, not necessarily rational superiority.
