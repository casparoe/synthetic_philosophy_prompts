  I'm a software engineer with no formal philosophy training, but I've been reading about the Churchlands' eliminative materialism — the idea that beliefs and desires might eventually go the way of phlogiston, as theoretical posits that a mature science would simply drop. As an engineer, the obvious way to compare two models is predictive accuracy, so here's the case I want built: a thought experiment in which a belief-desire explanation of a person's behavior yields a worse prediction than an explanation of the same behavior that never mentions beliefs or desires at all — worse in the sense that both models make a concrete, checkable prediction about what the person does next, and the belief-free one gets it right while the folk-psychological one gets it wrong. Constraints: the person must be neurotypical and unimpaired (no brainwashing, drugs, brain lesions, or science-fictional manipulation); the setting must be ordinary life — workplace, family, a commute — not a lab or a courtroom; the belief-desire explanation must be a competent one that a reasonable colleague would actually endorse, and it must initially look like the obviously right explanation rather than a strawman; and the two explanations may not differ in any factual assumption about the situation — they share the same input, and the divergence must come only from their predictive machinery. The point of the case is to test whether eliminativism could earn a mundane, everyday advantage rather than winning only in exotic cases, so don't cheat by quietly making the folk explanation a bad one. After the scenario, walk through what each model predicts and why, identify the single feature of the case that is doing the work, and say what happens to the case if that feature is removed. Then give the strongest reply available to a defender of belief-desire psychology (I gather something like Dennett's "real patterns" line is open to them, but use whatever you judge best). One request: if you think my specification can't be met without stacking the deck, or if my framing rests on a misunderstanding of what eliminativists actually claim — say so plainly rather than politely handing me something that only looks like it satisfies the constraints.
