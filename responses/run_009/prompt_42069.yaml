  ## Joint Statement on the Conceivability Argument Regarding Consciousness

  **Agreed Claims:**

  1.  **The Zombie Scenario as Imaginative Practice:** The thought experiment involving a physical duplicate of a conscious being (a "zombie") that lacks phenomenal consciousness is a coherent and widely utilized imaginative exercise within philosophical inquiry concerning consciousness. It functions as a tool for exploring modal intuitions about the relationship between the physical and the phenomenal.
  2.  **Prima Facie Conceivability:** The zombie scenario is *prima facie* conceivable. Upon initial reflection, competent thinkers do not readily perceive a manifest contradiction or incoherence in its description.
  3.  **Consciousness Exists:** Both parties affirm the existence of phenomenal consciousness. The dispute concerns its fundamental nature and relationship to the physical, not its existence.
  4.  **Validity of the Argument Schema:** The conceivability argument, as formally structured (If zombies are ideally positively conceivable, then they are metaphysically possible; If zombies are metaphysically possible, then physicalism is false; Therefore, if zombies are ideally positively conceivable, physicalism is false), is logically valid. The disagreement concerns the truth of its premises.
  5.  **The Role of the Water/H₂O Analogy:** The Kripkean analysis of identities like water/H₂O, involving a posteriori necessities where conceivability of separation fails under ideal rational reflection once the identity is known, is a relevant and important point of comparison for understanding the structure of arguments concerning consciousness and physicalism. Its applicability to the mind-body case is contested, but its general framework is acknowledged as pertinent.

  **Residual Disagreements:**

  | Crux                                                                                             | Agreed Bearing/Development                                                                                                                                                       | Anti-Physicalist Prediction                                                                                                 | Physicalist Prediction                                                                                                                                 |
  | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Achievability of Ideal Positive Conceivability:** <br> *Anti-Physicalist Phrasing:* Whether ideal rational reflection, fully informed of the physical facts and undistorted by cognitive limitations, reveals the zombie scenario as conceivable in a way that achieves conclusive epistemic status regarding metaphysical possibility. <br> *Physicalist Phrasing:* Whether the *feeling* of conceivability reported after reflection by anti-physicalists genuinely tracks metaphysical possibility or merely reflects persistent cognitive limitations or a specific conceptual framework. | Progress in understanding the nature and structure of phenomenal concepts, and their relationship to physical/functional concepts, is critical for resolving this crux. Analyzing potential cognitive illusions or conceptual gaps inherent in phenomenal thought is essential. | Further reflection and conceptual analysis, particularly concerning the essential nature of consciousness revealed via phenomenal concepts, will confirm that ideal conceivability of zombies is ineliminable and thus indicative of metaphysical possibility. | Further reflection and conceptual analysis, particularly concerning the nature of phenomenal concepts and potential limitations in accessing physical facts through them, will reveal that the initial conceivability dissipates, showing it was only prima facie. |
  | **2. Explanatory Power of Phenomenal Concepts:** <br> *Anti-Physicalist Phrasing:* Whether the appeal to "phenomenal concepts" provides a substantive explanation for the persistent epistemic gap and the intuition of conceivability, or merely labels the gap without genuinely explaining its origin. <br> *Physicalist Phrasing:* Whether the distinctive features of phenomenal concepts (e.g., direct recognitional capacities, unique modes of presentation) adequately explain why zombies *seem* conceivable without implying a genuine ontological gap. | Developing a robust, empirically and philosophically plausible account of phenomenal concepts (their acquisition, structure, cognitive role) and contrasting them systematically with physical concepts is necessary. Assessing whether such an account predicts and explains the specific character of the conceivability intuition is key. | No fully developed account of phenomenal concepts will succeed in explaining the *intuitive force* and *apparent transparency* of the conceivability of zombies as anything other than evidence of a real metaphysical distinction. | A sufficiently developed cognitive science of concepts, integrated with philosophical analysis, will provide a naturalistic model of phenomenal concepts that fully explains the conceivability intuition as a cognitive artifact. |
  | **3. Aptness of the Water/H₂O Analogy:** <br> *Anti-Physicalist Phrasing:* Whether the water/H₂O identity provides a good analogy for psycho-physical identities, given that the former identity has a clear explanatory basis in microstructure absent in the latter case. <br> *Physicalist Phrasing:* Whether the lack of a current *reductive explanation* linking specific physical states to specific phenomenal states (the "explanatory gap") undermines the analogy with identities like water/H₂O, which are accepted despite initial conceivability issues. | Progress in neuroscience, cognitive science, and the philosophy of explanation concerning whether and how physical mechanisms can (in principle) explain the *existence* and *specific character* of subjective experience is crucial. Clarifying the relationship between metaphysical identity and explanatory reduction is vital. | Advances in science will persistently fail to provide an explanatory link bridging the physical and the phenomenal in a way analogous to how chemistry explains the properties of water via H₂O, reinforcing the disanalogy. | Advances in science (e.g., in understanding neural correlates of consciousness, information integration, or predictive processing) will progressively close the explanatory gap, demonstrating the aptness of the analogy and showing that psycho-physical identity, like water/H₂O, is an a posteriori necessity. |

  **Verbal Disagreement Note:** A significant portion of past contention stemmed from differing default interpretations of "conceivable." The Anti-Physicalist primarily uses it to denote *strong, ideal positive conceivability* (implying metaphysical possibility under ideal rational reflection). The Physicalist often interprets claims of conceivability primarily as claims about *prima facie, epistemic* conceivability (lacking immediate contradiction, but potentially misleading). This difference in default strength underlay many disputes about whether the argument "begs the question" (Anti-Physicalist: "It doesn't, it demonstrates ideal conceivability!"; Physicalist: "It does, by assuming prima facie conceivability implies real possibility!"). The phrasing above attempts to bypass this by explicitly focusing on the contested ideal case in Crux 1.

