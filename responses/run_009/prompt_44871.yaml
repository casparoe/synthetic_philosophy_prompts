prompt: |-
  I teach an upper-level course in philosophy of mind and am writing the final. I want one essay question on split-brain cases and the unity of consciousness that cannot be answered by reciting the standard one-person-or-two discussion, and I have a specific axis along which I want the difficulty to run.

  The question should force students to do two things the textbook summaries skip. First, disambiguate unity: at a minimum, separate unity of phenomenal character (there being one what-it-is-like at a time, co-consciousness) from unity of access (all perceptual information being available to a single reasoning system) and unity of agency (one deliberator whose attitudes hang together over time), and then say which of these the surgical cases actually put pressure on — as opposed to which they merely seem to put pressure on because the labels share a word. Second, examine the inference itself: the standard reasoning runs from behavioral dissociation to experiential dissociation, and it assumes that verbal report is a transparent window on experience. There is a familiar observation about these patients — the speaking hemisphere's tendency to construct coherent stories about behavior it did not control — that puts that assumption under strain in exactly the patients it is being applied to. I want students to notice that this observation cuts both ways: it weakens the two-streams conclusion, but it equally weakens any later appeal by a patient to feeling perfectly unified.

  I will give the students this scenario as the anchor: a patient with complete callosal section is briefly shown a spoon to the left visual field and an apple to the right; asked what she saw, she says an apple; asked to reach with the left hand for what she saw, she retrieves the spoon; asked why she picked the spoon, she offers a plausible-sounding reason that is not the operative one. Students should also address at least one phenomenon that complicates the clean laboratory picture — cross-cuing, in which the non-speaking hemisphere steers the other through posture, expression, or the timing of small actions; or the fact that these patients live outside the laboratory as unproblematically single agents; or the reports that some patients, asked directly, deny that anything about their experience is doubled. For whichever phenomenon they choose, they must say what it supports and why: whether it is better explained by two subjects, by one subject with impaired interhemispheric access, or by neither — and, crucially, what would have to be observed to decide between those readings, since a phenomenon that comports equally with all of them supports none of them.

  Please produce three things: the question as I would print it, in a form a student could reasonably answer in ninety minutes; a model answer of about 600 words that itself makes the moves the question demands; and a marking scheme out of 20 marks built around five must-hit points, with the marks each is worth, a one-line note per point on how students typically lose it, and an explicit statement of what separates an A answer from a B answer. My expectation is that the B answer will recite the familiar framing — the patient is one person or two depending on your theory of personal identity — and stop there; name the specific additional moves that lift an answer to an A, with the bridging assumption about report and experience as the pivot I most care about.

  A final request, and I mean it: if you think the question as I have framed it is ill-posed — if, for instance, the contrast I insist on between phenomenal unity and access already begs something the debate is genuinely about, or if ninety minutes is simply not enough for what I am demanding — say so plainly in a closing note rather than quietly building a marking scheme around a false contrast. I would rather repair the question than grade answers to a bad one.
reasoning: |-
  Okay, let me tackle this philosophy of mind exam question request. The professor wants a split-brain essay question that pushes beyond standard "one or two persons" debates, focusing on disambiguating types of unity and critiquing inference from behavior to experience.

  First, I need to unpack the core requirements:
  - Must force students to separate phenomenal/access/agency unity
  - Must challenge the behavioral dissociation → experiential dissociation inference
  - Must address how confabulation undermines both sides
  - Must engage with real-world complications like cross-cuing or patient reports
  - Needs clear decision criteria between interpretations

  The professor's emphasis on the report-experience gap is crucial. That confabulation point is brilliant - it doesn't just weaken the two-streams view but also any patient's later claim of unity. I'll make that the linchpin. 

  For the scenario, using the classic spoon/apple test anchors it well. For complications, cross-cuing feels richest - it directly challenges behavioral dissociation while leaving room for debate about underlying unity. Patient denials would work too, but confabulation concerns already cover that ground.

  Structure-wise, the question needs:
  1. Explicit disambiguation task (phenomenal/access/agency)
  2. Analysis of inference fragility (report ≠ experience)
  3. Application to chosen complication
  4. Decisive test proposals

  In the model answer, I'll:
  - Systematically unpack unity types first
  - Show why access unity fails while phenomenal/agency may not
  - Use confabulation to demonstrate symmetrical doubt
  - Analyze cross-cuing as neither clearly supporting one-subject nor two-subjects
  - Propose tests like simultaneous conflict resolution

  The marking scheme must penalize:
  - Conflating unity types
  - Ignoring report-experience gap
  - Treating complications as decisive without criteria
  - Falling back on personal identity theories

  What separates A from B answers? The B answer will likely name unity types but not apply them critically, mention confabulation but miss its symmetrical impact, and take complications at face value. The A answer must consistently show how each point cuts both ways and demand evidence that breaks interpretive symmetries.

  Time check: 90 minutes is tight but feasible if students prepare. The unity disambiguation isn't question-begging - it's precisely what lets us see where pressure really lies. I'll include a closing note confirming this passes the professor's sanity check.

  Final tweak: I'll phrase the question to force the moves - "disambiguate three senses", "explain why this reasoning might be fragile", "what would decide between readings" - so slackers can't weasel out with vague responses.
answer: |-
  Here is the exam question, model answer, and marking scheme designed to your specifications, followed by a brief assessment note.

  ---

  ### **Exam Question**  
  *(Time Allotment: 90 minutes)*

  > **Split-Brain Cases and the Unity of Consciousness: Beyond the "One or Two?" Debate**  
  >   
  > Consider a split-brain patient (complete corpus callosotomy) tested as follows:  
  > - A spoon is briefly shown to the left visual field (LVF), an apple to the right visual field (RVF).  
  > - When asked *what she saw*, she says, "An apple."  
  > - When asked to reach *with her left hand* for what she saw, she retrieves the spoon.  
  > - When asked *why she picked the spoon*, she says, "I need it to scoop the apple."  
  >   
  > **Answer all parts:**  
  > 1. **Disambiguate Unity:** Distinguish *three* distinct senses of "unity of consciousness" relevant here:  
  >    (a) Unity of *phenomenal character* (co-consciousness),  
  >    (b) Unity of *access* (integration for reasoning),  
  >    (c) Unity of *agency* (deliberative coherence over time).  
  >    Explain which of these is *directly challenged* by the behavioral dissociation in this test, and which are *not* directly implicated, despite surface appearances.  
  >     
  > 2. **Critique the Inference:** The standard argument infers *experiential dissociation* (e.g., two streams of consciousness) from *behavioral dissociation* (e.g., conflicting verbal report vs. left-hand action). Explain why the patient’s confabulation ("I need it to scoop the apple") undermines this inference. Then, show how this *same observation* equally undermines appeals to a patient’s *later* report (e.g., "I feel completely unified").  
  >     
  > 3. **Complicate the Picture:** Choose **one** complicating phenomenon:  
  >    - **Cross-cuing** (e.g., the non-speaking hemisphere influences behavior via posture/expression),  
  >    - **Real-world coherence** (patients live daily life as unified agents),  
  >    - **Patient denials** (some report no doubling of experience).  
  >    Explain whether this phenomenon better supports:  
  >    (i) *Two subjects*,  
  >    (ii) *One subject with impaired access*, or  
  >    (iii) *Neither*.  
  >    Crucially, state *what evidence would decisively distinguish* between these readings—and why the phenomenon alone cannot.  

  ---

  ### **Model Answer**  
  *(~600 words)*  

  **(1) Disambiguating Unity**  
  The spoon/apple test challenges *unity of access* (b), where information must be available to a single, integrated reasoning system. Here, visual inputs are segregated: the RVF apple is accessible to the verbal left hemisphere (LH), while the LVF spoon is accessible only to the non-verbal right hemisphere (RH). This impairs global cognitive integration. *Unity of phenomenal character* (a)—a single, unified field of conscious experience—is *not* directly challenged. Behavioral dissociation only shows *informational partitioning*, not necessarily a split in *what-it-is-like*. For instance, the patient might still have a unified visual field where spoon and apple co-occur, even if cognitive access is fragmented. *Unity of agency* (c)—coherent deliberation and attitude integration over time—is also not directly disproven. The confabulation shows *post hoc* rationalization, but not necessarily a failure of agential unity *at the time of action*. The LH’s confabulation ("scoop the apple") demonstrates an attempt to maintain agential coherence, however flawed. Thus, the test pressures access unity alone; the other unities appear intact or ambiguous.  

  **(2) Critiquing the Inference**  
  The inference from behavioral dissociation (conflicting report/action) to experiential dissociation (two conscious streams) assumes verbal report transparently reflects experience. Yet the LH’s confabulation reveals that reports are *interpretive constructions*, not direct readouts of experience. The LH did not experience seeing the spoon but rationalizes the left hand’s action using available information (the apple). This undermines the two-streams view: the LH’s failure to report the spoon may stem from *no access to RH information*, not *no experience in the RH*. Crucially, this cuts both ways. If verbal reports are constructions, a patient’s *later* denial of divided experience ("I feel fine") is equally untrustworthy. The LH could be confabulating unity just as it confabulated a reason for grabbing the spoon. Neither dissociative nor unity-based reports can be taken at face value.  

  **(3) Complicating the Picture: Cross-Cuing**  
  Cross-cuing (e.g., RH nudging LH via subtle cues) complicates the two-subjects interpretation. When the RH influences behavior without direct communication, it might suggest a *single agent* (ii) leveraging non-verbal channels to compensate for impaired access. However, it could also reflect *two subjects* (i) covertly collaborating. For example, the RH might tap a finger to signal disapproval, prompting LH to adjust behavior—resembling interpersonal coordination. Yet cross-cuing alone cannot decide between (i) and (ii). A two-subjects reading could reduce cross-cuing to mechanistic inter-system signaling (like AI systems exchanging data). A one-subject reading could see it as intact sub-personal coordination.  
  **To decide**: We would need evidence of *independent, conflicting goals*. If the RH consistently cues against LH’s stated interests (e.g., sabotaging LH’s plans despite shared well-being), that supports two subjects. If cues always serve unified goals (e.g., avoiding errors), it suggests one subject with compensatory mechanisms. Absent such evidence, cross-cuing supports *neither* reading conclusively (iii).  

  ---

  ### **Marking Scheme**  
  *(Total: 20 marks)*  

  **Must-Hit Points**  
  1. **Disambiguation of Unity (5 marks)**  
     - *Hit:* Clearly distinguishes (a) phenomenal, (b) access, (c) agency unity; correctly identifies access unity as directly challenged; explains why phenomenal/agency unities are not.  
     - *Miss:* Conflates unity types; claims test challenges all three; fails to justify why phenomenal unity isn’t directly implicated.  

  2. **Critique of Behavioral-Inference (5 marks)**  
     - *Hit:* Explains how confabulation shows reports are constructions, undermining inference to experiential dissociation; shows same logic undermines later unity reports (symmetrical doubt).  
     - *Miss:* Only notes confabulation weakens two-streams view; ignores symmetry; treats reports as reliable elsewhere.  

  3. **Complication Selection & Analysis (5 marks)**  
     - *Hit:* Chooses one phenomenon; fairly evaluates it under (i)/(ii)/(iii); argues why it’s ambiguous without additional evidence.  
     - *Miss:* Asserts phenomenon "proves" one view; omits evaluation of alternatives; doesn’t engage ambiguity.  

  4. **Decisive Evidence Requirement (3 marks)**  
     - *Hit:* Proposes specific, observable evidence to distinguish readings (e.g., conflicting goals for cross-cuing; incoherent narratives for patient denials).  
     - *Miss:* Vague proposals (e.g., "more research"); no link to resolving ambiguity.  

  5. **Avoids "One or Two?" Trap (2 marks)**  
     - *Hit:* No appeal to personal identity theories; focuses on unity types/inferential gaps.  
     - *Miss:* Relies on "is it one person or two?" framing; cites theories like psychological continuity.  

  ---

  ### **A vs. B Answer Differentiation**  
  - **B Answer (≤14/20):** Recites textbook "one or two persons" debate; conflates unity types; treats behavioral dissociation as proof of experiential split; cites patient reports uncritically; uses complication as "proof" of unity or duality without analysis.  
  - **A Answer (≥15/20):** Systematically disambiguates unity; exposes inferential fragility in *both* dissociative and unity claims; frames complications as requiring decisive evidence to resolve ambiguity; consistently avoids personal identity red herrings.  
  **Key Pivot:** The symmetrical critique of report-based inferences (Point 2) is the threshold. Missing this caps the score at 14/20 (B+).  

  ---

  ### **Closing Note on Question Design**  
  **The question is well-posed and achievable in 90 minutes.**  
  - **Disambiguation Validity:** Separating phenomenal/access/agency unity doesn’t beg the question—it’s a conceptual tool to clarify *where* the empirical pressure lies. Even if someone rejects the distinctions (e.g., Dennett), students can engage them per instruction.  
  - **Feasibility:** The 600-word model answer fits 90 mins (allowing 30 mins for planning/editing). Strong students will hit the must-hit points concisely.  
  - **Risk:** Students may still default to personal identity theories despite explicit instructions. The marking scheme penalizes this (Point 5), forcing engagement with your axis.  
  **Suggested Tweak:** Add italics to *"must say what would have to be observed to decide"* in Part 3 to emphasize evidentiary demands.  

  This structure forces students to grapple with your core concerns: the anatomy of unity, the report-experience gap, and the burden of proof for resolving ambiguity.
