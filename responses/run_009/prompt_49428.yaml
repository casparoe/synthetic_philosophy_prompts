prompt: |-
  My friend and I just spent like three hours arguing about epiphenomenalism and I need a sanity check from someone who can actually reason through this instead of just getting louder like we did.

  Background in case it matters for how you frame things: epiphenomenalism says phenomenal experiences are caused by physical brain states but don't cause anything themselves, including our reports and beliefs about those experiences. The obvious objection (the "paradox of phenomenal judgment") is that when I say "this pain hurts," that utterance is caused by brain states, so my qualia seem to be doing no work in explaining why I'm talking about them -- which makes our talk about consciousness look like a bizarre coincidence, or makes the qualia themselves look explanatorily invisible even to ourselves. My friend's response was honestly the most interesting part of the night. She said: imagine a runner whose shadow follows her around. The shadow is "about" the runner's motion in the sense that it tracks it perfectly, but the shadow doesn't cause anything. Our judgment that we have experiences, she said, is like the shadow -- the brain state causes both the qualia AND the judgment, so there's no coincidence to explain. Alignment without connection. I pushed back that this just relocates the problem: if the qualia could be swapped out for inverted ones or removed entirely with zero physical difference, then when I sincerely say "I am in agony," the agony itself is doing literally nothing to produce that sincere report, and that seems to drain the meaning out of calling it agony at all. She said I was smuggling in an intuition about what "doing" means that begs the question against her.

  So here's what I want from you, and please actually commit to numbers rather than telling me it's all just contested:

  Give me your credence that epiphenomenalism is true, decomposed into the pieces it rests on. At minimum I'd want something like: your probability that physicalism is true at all; conditional on physicalism, your probability that the causal closure of physics forces qualia to be either reducible, eliminated, or epiphenomenal (vs. some emergent-but-causally-potent option); conditional on that fork, your probability that epiphenomenalism beats reduction and elimination; and then separately, your probability that the paradox of phenomenal judgment is actually a good argument against it, versus just a pressure our intuutions feel. Feel free to add or restructure terms if you think I've cut the joint wrong, but give each one a rough number and a line saying why.

  Then the part I care about most: does my friend's shadow move actually dissolve the coincidence, or does it just make the coincidence sound smaller? Really think about whether "same brain state causes both the qualia and the report about the qualia" is enough, or whether the epiphenomenalist still owes us an explanation of why the report is accurate rather than just systematically paired with the states it describes.

  And finally, tell me what would change your numbers. Which single argument or consideration on either side would move your overall credence the most, and where do you think your reasoning here is most likely to fail? I want to know if I'm the one who owes her an apology.
