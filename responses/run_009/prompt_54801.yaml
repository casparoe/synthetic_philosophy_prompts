prompt: |-
  so heres my situation: I'm the ops manager at a mid-size recirculating aquaculture farm — tilapia in the main system, and we just started a pilot tank of freshwater prawns, which is a whole new can of worms welfare-wise. My techs walk the tanks twice a day and they're constantly winging it on whether something they see is a welfare problem or just normal fish stuff: an animal hanging at the surface, off its feed, swimming odd, flashing against the substrate. None of them are biologists, I don't have a vet on call (there's one I can email who replies within a day or two), and our big buyer sends a welfare auditor in the spring, so I need something written down we can point to rather than "we looked at the fish and it seemed fine." Stakes run from losing stock (money) to losing the contract if the audit goes badly.

  I want a decision procedure the techs can run in a couple of minutes standing at the tank. My thought is the five domains framework (nutrition, physical environment, health, behavior, mental state) is the right backbone, plus whatever the more recent evidence on decapod sentience implies about how much more cautious we should be with the prawns versus the tilapia — I know people argued for years that crustaceans don't really feel anything and that seems to have shifted, so tell me how to factor that in without pretending certainty we don't have. The procedure needs to specify what to observe in what order, when the right move is log-and-watch versus act now versus escalate to me, and it should honestly flag which steps are just a judgment call dressed up as a checklist, because I'd rather know that than kid myself. Then run it on three cases: (1) a tilapia that's been sitting near the outflow gasping-ish for two days but still eats when food goes in; (2) the prawns in the pilot tank have started cannibalizing each other after a wave of molts, water parameters all in range; (3) one of my techs wants to add structure and hiding spots to the prawn tanks to cut down the cannibalism, and I'd love to say yes since it's cheap and he's enthusiastic — but tell me straight whether the procedure backs it, even if the answer annoys me. Last thing: be clear about what a checklist like this fundamentally can't do, given my techs see each animal for like five minutes a day and, from what I understand, fish and prawns tend to hide pain and weakness until they're really bad off.
reasoning: |-
  Alright, let's tackle this step by step. The user is an operations manager at a recirculating aquaculture farm dealing with tilapia and newly introduced freshwater prawns. The main issue is that their technicians aren't biologists and need a clear, quick decision-making procedure for welfare issues. They've mentioned the Five Domains framework and want it adapted for both species, especially considering the new understanding of decapod sentience.

  First, I need to address the core problem: inconsistent judgments by techs leading to potential risks like stock loss or failed audits. The user wants a structured checklist that’s honest about its limitations. The key points are speed (couple of minutes per tank), clarity on actions (log, act, escalate), and transparency about judgment calls.

  The Five Domains (Nutrition, Environment, Health, Behavior, Mental State) seems solid. But for prawns, recent research on decapod sentience means higher caution. I should emphasize avoiding anthropomorphism while still prioritizing observable stressors. For example, cannibalism in prawns post-molt might indicate environmental stress, even if water params are okay. 

  The three scenarios need practical applications. The tilapia gasping but eating—maybe it's a chronic gill issue. Log initially, but if it persists, escalate. Prawns cannibalizing: check molt frequency, hiding spots, feeding schedules. Adding structures seems beneficial based on ethology studies, but the user needs to know if the procedure supports it. Research shows hiding spots reduce aggression, so yes, but monitor. 

  I should highlight the checklist's limitations: brief observations might miss subtle signs, chronic stress can be invisible, and false negatives are a real risk. Transparency here is crucial. Also, the difference in escalation for tilapia vs prawns due to sentience concerns—quicker action for prawns in ambiguous cases. 

  The user’s deeper needs include audit preparedness and minimizing losses. They need documentation to prove due diligence. The procedure must create a paper trail. Also, empowering techs with clear steps reduces uncertainty, but the user needs to know where judgment is still required. 

  For the prawn cannibalism scenario, parameters in range don’t rule out issues like overcrowding or insufficient hides. The answer should support adding structures, referencing studies on environmental enrichment. Even if it’s cheap and the tech is eager, the procedure should validate it as a proactive measure. 

  Lastly, the unspoken worry: avoiding contract loss. The checklist must satisfy auditors by showing systematic monitoring, even if problems occur. Emphasizing documentation and defined responses addresses this. Acknowledging the procedure’s limits builds credibility rather than overpromising.
answer: |-
  Here’s a practical, evidence-based decision procedure tailored to your operation’s needs. It integrates the Five Domains with decapod sentience considerations and emphasizes transparency about judgment calls.

  ---

  ### **Aquatic Welfare Quick Assessment Protocol (Tilapia & Freshwater Prawns)**
  **Goal:** Determine if observed issue is (A) Normal, (B) Monitor/Log, (C) Act Immediately, or (D) Escalate to Ops Manager.  
  **Time Limit:** 3–5 minutes per tank/species.  
  **Critical Premise:** *Assume prawns experience distress similarly to fish until proven otherwise. When in doubt, prioritize caution for prawns.*

  #### **Step 1: Rapid Environment Check (1 min)**  
  **✓ Water Parameters (MUST be measured):**  
  - Tilapia: Temp (28–30°C), DO (>5 mg/L), Ammonia (<0.5 mg/L), Nitrite (<0.1 mg/L), pH (6.5–8.5).  
  - Prawns: Temp (25–30°C), DO (>4 mg/L), Ammonia (<0.2 mg/L), Nitrite (<0.05 mg/L), pH (7.0–8.5), Calcium (>50 mg/L for molting).  
  *ACTION:* If ANY parameter is out of range → **ACT IMMEDIATELY** (adjust system, partial water change).  

  **✓ Physical Environment:**  
  - Tilapia: Flow rate normal? Tank structure intact?  
  - Prawns: Hiding spots available? Substrate clean? Molted exoskeletons visible?  
  *ACTION:* Deficiencies → Log & correct within 24hrs (**MONITOR/LOG** unless acute hazard).  

  #### **Step 2: Individual/Group Observation (2 min)**  
  *(Prioritize affected animals but scan group)*  

  | **Domain**          | Tilapia Red Flags 🐟                                                                 | Prawn Red Flags 🦐 (+ Sentience Caution*)                                                                 |  
  |---------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **Nutrition**       | Not eating during feeding (if others are); distended belly                          | Avoids feed; incomplete consumption (Note: Prawns are nocturnal feeders)                                  |  
  | **Physical Env.**   | Flashing, rubbing surfaces; gasping at surface/inflow                              | Prolonged vertical "climbing" at walls; lethargy on substrate                                             |  
  | **Health**          | Lesions, frayed fins, cloudy eyes, visible parasites                               | Discolored shell (black spots/rust), milky hemolymph, necrotic appendages                                |  
  | **Behavior**        | Erratic swimming; isolation from school; aggression spikes                         | Aggression (antennae dueling); cannibalism; excessive hiding (beyond normal cryptic behavior)            |  
  | **Mental State**    | Chronic lethargy; "giving up" posture                                              | Abandoning shelter; repetitive escape attempts (e.g., constant tank climbing)                            |  

  \* *Sentience Note for Prawns:*  
  Recent evidence (e.g., Birch et al., 2021) suggests decapods likely feel pain/stress. **Key implications:**  
  - Avoid high-stress handling (e.g., air exposure >30 sec).  
  - Cannibalism is a major welfare failure (prioritize prevention).  
  - Environmental complexity is ethically justified (not just production-driven).  

  #### **Step 3: Decision Matrix**  
  **A. NORMAL**  
  - No red flags in any domain + environment stable.  
  - *Example:* Single prawn hiding during daylight (normal cryptic behavior).  

  **B. MONITOR/LOG**  
  - 1–2 mild red flags (e.g., tilapia gasping but eating; isolated prawn aggression) + environment stable.  
  - *Action:* Record in log (animal ID/tank, symptom, time). Recheck at next walkthrough.  

  **C. ACT IMMEDIATELY**  
  - Parameter out of range OR ≥3 red flags OR acute trauma (injury, severe aggression).  
  - *Actions:* Isolate animal if feasible; correct environment; emergency aeration/water change.  

  **D. ESCALATE TO OPS MANAGER**  
  - Unexplained mortality (>2 animals/day) OR systemic issue (e.g., group lethargy) OR uncertainty with high-risk case.  

  **JUDGMENT CALL ALERTS:**  
  ⚠️ "Is this normal?" → Default to **MONITOR/LOG** unless obvious distress.  
  ⚠️ "Could this be chronic stress?" → Escalate if subtle signs persist >48hrs.  
  ⚠️ "Is the animal ‘just different’?" → Isolate if behavior deviates severely from conspecifics.  

  ---

  ### **Applied to Your Cases**  
  **Case 1: Tilapia gasping near outflow but eating**  
  - Step 1: Water params OK? (If yes → B; if no → C).  
  - Step 2: **Physical Env.** (gasping = red flag), **Nutrition** (eating = normal), **Behavior** (isolation? if yes → red flag).  
  - Decision: Likely **B (MONITOR/LOG)** if params normal and no other flags. *Escalate if gasping worsens or spreads.*  

  **Case 2: Prawns cannibalizing post-molt (water parameters in range)**  
  - Step 1: Params OK → proceed.  
  - Step 2: **Behavior** (cannibalism = MAJOR red flag), **Physical Env.** (check hiding spots: if absent → critical failure). **Health** (note injured animals).  
  - Decision: **C (ACT IMMEDIATELY)**. Isolate injured prawns; add emergency hides (PVC pipes/mesh); review feeding timing (offer feed post-sunset). Escalate if >5% mortality. *Root cause likely environmental poverty, not water chemistry.*  

  **Case 3: Tech proposes adding hides for prawns**  
  - **PROCEDURE BACKS THIS.**  
  - Why:  
    1. Ethology: Prawns are cryptic; shelter reduces aggression/stress (Barros & Valenti, 2003).  
    2. Sentience Precaution: Hiding spaces align with "good welfare" under mental state domain.  
    3. Production Benefit: Reduced cannibalism = higher survival.  
  - *Action:* **APPROVE.** Use cheap materials (PVC, aquatic plants, clay tiles). Monitor effectiveness.  

  ---

  ### **What This Checklist CANNOT Do**  
  1. **Detect Subclinical Issues:** Fish/prawns mask weakness until collapse (survival adaptation). Daily 5-min snapshots won’t catch slow-onset diseases or chronic stress without mortality.  
  2. **Replace Expertise:** It flags *indicators*, not diagnoses. A vet/lab is still needed for definitive health assessments.  
  3. **Eliminate Judgment:** Welfare assessment is inherently probabilistic (e.g., "Is this gasping 'mild' or 'severe'?").  
  4. **Prevent All Losses:** Auditors expect documented *processes*, not perfection. Logs showing consistent protocol use + corrective actions satisfy most audits.  

  **Final Advice:**  
  - **Train Techs:** Run drills with videos of normal vs. abnormal behavior.  
  - **Log Religiously:** Use a simple tablet form (Google Forms/Airtable) with timestamps.  
  - **Prawn-Specific:** Stagger molting via size-grading; add iodine to feed for shell hardening.  
  - **Vet Backup:** Email your vet weekly logs (not per incident) to build rapport.  

  This protocol turns subjective observations into auditable decisions while acknowledging biological uncertainties. It won’t make your techs biologists, but it will show due diligence and prioritize welfare when it matters most.
