     Debrief:

       We map arguments:

          - "You would never have gotten more than such-and-such anyway": This relates to the utopia point and individual monotonicity. In KS, if the utopia point changes, the solution should change.

          - "We are not renegotiating just because the menu changed": This is the independence of irrelevant alternatives (Nash): if an option that wasn't chosen is removed, the solution should not change.

          - "My outside option is what it is": This relates to the disagreement point, which hasn't changed.

       We then explain that the Nash solution satisfies independence of irrelevant alternatives, while the KS solution satisfies individual monotonicity.

     What can go wrong:

          - Pairs might default to 50/50 in utility units. But in our schedules, 50/50 in utility might not be obvious because the scales are different.

          - A student might seize the entire surplus if the schedule confuses their partner. For example, if player 1 in Pair 1 says: "I see that at (4,2) I get 4 and you get 2, which is twice as much as you would get at (3,4) for me and 4 for you, and since 4>2, this is better for you." This is not true because at (3,4) player 2 gets 4 which is more than 2. So hopefully not.

          - Disagreement points might not be credible: students might not really fear ending up at (1,1) and might push for more.

          - The activity cannot reproduce the continuous case. We have discrete points, and the KSBS might not be in the set. So students might not land exactly on the continuous solution.

          - Students with game theory knowledge might compute the Nash product for every point and choose the one with the highest product, without bargaining.

     What the activity can carry:

          - The idea that the removal of an option that seemed irrelevant (because it wasn't chosen) might affect the bargaining outcome for some conceptions of fairness.

          - The difference between the axioms: independence of irrelevant alternatives vs. individual monotonicity.

     What you will have to supply in the debrief:

          - The continuous case and the exact KSBS formula.

          - The axiom of individual monotonicity: if the set of feasible outcomes expands in a way that improves one player's best possible outcome, then that player should not end up worse off.

          - The axiom of independence of irrelevant alternatives: if you remove an option that wasn't chosen, the solution should not change.

          - The fact that in the Nash solution, the product of gains is maximized, while in the KS solution, the relative concessions are equalized.

          - The deep issue of interpersonal utility comparison is assumed away because we give the utilities on the card.

