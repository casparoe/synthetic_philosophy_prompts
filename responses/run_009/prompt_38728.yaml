  ### Session Design: Bargaining Activity to Contrast Nash and Kalai–Smorodinsky Solutions

  **Objective:** Students experience bargaining with asymmetric payoffs, discover axioms through negotiation, and confront how solutions shift when the feasible set changes.

  **Structure:**  
  - **Phase 1:** Pairs bargain over payoff schedules (14 students → 7 pairs; 4 pairs use Schedule A, 3 use Schedule B).  
  - **Phase 2:** Pairs re-bargain after removal of one "utopia-defining" option.  
  - **Debrief:** Map student arguments to axioms (IIA vs. monotonicity).

  ---

  ### **Payoff Schedules**  
  *Utilities are printed on cards (disagreement point included). Payouts: Bonus points (e.g., 0.5% grade per utility point) or candy.*

  #### **Schedule A (Asymmetric, Kinked Frontier)**  
  - **Disagreement point:** (1, 1)  
  - **Feasible Agreements (Player 1, Player 2):**  
    (1, 1), (2, 5), (2.5, 4.5), (3, 4), (3.5, 3), (4, 2), (4.5, 1.75), (5, 1.5)  
    *(Total points: 8)*  

  - **Nash Solution (NS):** (3, 4)  
    - Maximizes product: (3-1) × (4-1) = 6  
  - **Kalai–Smorodinsky (KS):** (3.33, 3.33) (interpolated between (3,4) and (3.5,3))  
    - Utopia: U₁ = 5 (from (5,1.5)), U₂ = 5 (from (2,5)) → Equalizes ratios: (u₁-1)/4 = (u₂-1)/4 → u₁ = u₂.  

  #### **Schedule B (Asymmetric, Curved Frontier)**  
  - **Disagreement point:** (1, 1)  
  - **Feasible Agreements (Player 1, Player 2):**  
    (1, 1), (2, 5), (3, 6), (4, 4), (5, 3), (6, 2), (7, 1)  
    *(Total points: 7)*  

  - **Nash Solution (NS):** (3, 6)  
    - Maximizes product: (3-1) × (6-1) = 10  
  - **Kalai–Smorodinsky (KS):** (4.27, 3.73) (interpolated between (4,4) and (5,3))  
    - Utopia: U₁ = 7 (from (7,1)), U₂ = 6 (from (3,6)) → Equalizes ratios: (u₁-1)/6 = (u₂-1)/5.  

  **Why it works:**  
  - NS and KS differ visibly (e.g., (3,4) vs. (3.33,3.33) in Schedule A; (3,6) vs. (4.27,3.73) in Schedule B).  
  - Asymmetric schedules prevent uniform outcomes.  
  - Non-linear frontiers ensure NS ≠ KS (unlike linear cases).

  ---

  ### **Phase 1: Initial Bargaining**  
  - **Instructions:**  
    > "Bargain with your partner to reach a joint agreement. If no agreement, both get the disagreement payoff. You have 10 minutes."  
  - **Materials:** Cards with payoff schedule (A or B).  
  - **Goal:** Students converge toward NS or KS through negotiation. Predictably, many land near NS (it’s product-maximizing), but KS may emerge if students prioritize equity.

  ---

  ### **Phase 2: Bargaining with Reduced Options**  
  - **Quietly remove one option after Phase 1:**  
    - Schedule A: Remove (2,5) (sets U₂ = 5).  
    - Schedule B: Remove (7,1) (sets U₁ = 7).  
  - **New cards distributed** (options removed).  
  - **Instructions:**  
    > "Bargain again. The menu has changed slightly. Does your prior agreement still hold? You have 8 minutes."  

  - **Why remove these options?**  
    - Rarely chosen (extreme, inefficient), but critical for utopia points.  
    - **Expected shift:**  
      - Schedule A: New KS = (3.43, 3.13) (U₂ now 4.5 from (2.5,4.5)). NS unchanged at (3,4).  
      - Schedule B: New KS = (4,4) (U₁ now 6 from (6,2)). NS unchanged at (3,6).  
    - **Goal:** Students argue if agreements should change. KS-preferring pairs shift; NS-preferring pairs resist.

  ---

  ### **Debrief: Mapping Arguments to Axioms**  
  After bargaining, reveal axioms and solutions:  
  1. **Arguments for not moving (pro-NS / IIA):**  
     - "We’re not renegotiating just because the menu changed!" → **Independence of Irrelevant Alternatives (IIA)**: Removing unchosen options shouldn’t alter the outcome.  
     - "Our prior deal is binding." → **Stability** (Nash assumes fixed bargaining power).  

  2. **Arguments for moving (pro-KS / Monotonicity):**  
     - "You would never get more than 4.5 now—I deserve more!" (Schedule A) → **Individual Monotonicity**: If your *best possible* outcome shrinks, your gain should adjust proportionally.  
     - "My sacrifice was based on what I *could* have gotten!" → **Utopia-dependence** (KS equalizes relative concessions).  

  3. **Other arguments:**  
     - "My outside option is still 1!" → **Disagreement point** (unchanged; anchors both solutions).  

  - **Formalize fairness conceptions:**  
    - **Nash/IIA**: Fairness = *productivity* (maximize joint gains; irrelevant options don’t matter).  
    - **KS/Monotonicity**: Fairness = *symmetry in sacrifice* (equalize ratios of gains-to-utopia).  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong:**  
  1. **50/50 default:** Students may split utility equally (e.g., Schedule A: (3,3) isn’t feasible, but they might force symmetry). *Mitigation:* Use asymmetric schedules to disrupt intuition.  
  2. **Confusion with numbers:** A student might misread payoffs (e.g., in Schedule B, Player 1 demands (7,1) pre-removal). *Mitigation:* Clarify cards; walk through examples.  
  3. **Incredible threats:** Students may ignore disagreement points (e.g., "We won’t really get (1,1)"). *Mitigation:* Emphasize real stakes (points/candy).  
  4. **Game theorists compute, not bargain:** Advanced students may calculate NS/KS instantly. *Mitigation:* Pair strategically; stress negotiation over computation.  

  **What the activity cannot reproduce:**  
  - **Interpersonal utility comparison:** Cards assign utilities by fiat. Students don’t wrestle with translating real goods to utils. *Debrief note:* "We assumed utils are comparable—but in reality, this is contentious."  
  - **Continuous frontiers:** Discrete points obscure curvature. *Debrief note:* "KS is defined for continuous sets; we approximate."  
  - **Full axiomatic depth:** Students may not intuit "monotonicity." *Debrief:* Explicitly define axioms using their arguments.  

  **What you must supply in debrief:**  
  1. KS’s continuous formulation (ratio equalization).  
  2. Why IIA vs. monotonicity reflects different fairness ideals.  
  3. The "deep problem" of utility comparison.  
  4. How KS ensures no player’s aspirations shrink disproportionately when the feasible set expands.  

  ---

  ### **Instructor Script Snippets**  
  - **Setup:** "Today, you’ll negotiate real stakes. Utilities on cards are your payoffs."  
  - **Phase 2:** "I’ve streamlined your options. Re-bargain or stick with your prior deal?"  
  - **Debrief:** "When Jane said, ‘Your max is lower now, so I get more,’ she echoed Kalai–Smorodinsky’s axiom: gains should reflect changed possibilities."  

  This design forces confrontation with axioms through lived negotiation, setting the stage for formalizing KS’s monotonicity as a response to Nash’s IIA.
