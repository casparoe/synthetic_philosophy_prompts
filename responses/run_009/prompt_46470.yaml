answer: |-
  ## Term-Paper Proposal: Disentangling Dimensions in the Contractualist Aggregation Problem

  **Research Question:** Does the standard contractualist aggregation problem ("do the numbers count?") inherently conflate two distinct normative mechanisms: (1) the *within-person amplification* of an individual's complaint strength based on the number of others *also* facing an identical burden under a policy, and (2) the *cross-person summation* of individually weaker complaints to collectively outweigh a smaller number of individually stronger complaints? If these mechanisms are distinct, how does clarifying their separation illuminate or resolve existing debates within Scanlonian contractualism?

  **Rationale & Why Existing Positions Leave the Question Open:** The core intuition driving this project is that canonical discussions of aggregation within T.M. Scanlon's "What We Owe to Each Other" framework treat the problem as monolithic, yet the reasoning underpinning intuitions in key test cases may appeal to fundamentally different normative considerations. This conflation leaves the central question inadequately addressed by major existing positions:

  1.  **The Strongest Claim View:** This position holds that only the strength of the strongest individual complaint matters; headcounts of lesser complaints are irrelevant for determining reasonable rejectability. While this view explicitly denies cross-person summation, it often remains silent or implicitly assumes that within-person amplification (question 1) either doesn't occur or is already captured by assessing the complaint of the single worst-off individual. It doesn't cleanly separate the two potential mechanisms it rejects or implicitly bundles together.
  2.  **The Alternative-Action View:** Often invoked to explain why numbers *can* matter (e.g., in minor burden cases), this view emphasizes whether an alternative policy exists that would avoid imposing a burden on *anyone* or distribute burdens more fairly. While crucial, this view primarily addresses the *context* of choice and the availability of less objectionable alternatives. It doesn't explicitly differentiate *why* the existence of multiple burdened individuals matters in that context: *Is it because each individual’s complaint is amplified knowing others share it (within-person), or because their distinct complaints collectively weigh heavily against the alternative (cross-person summation)?* The view leaves this internal mechanics unresolved.
  3.  **The Skeptic's View:** This position argues that interpersonal comparisons of complaint strength are too vague or indeterminate to support the kind of aggregation (whether summation or amplification) contractualism requires. While challenging the feasibility of *both* proposed mechanisms, the skeptic treats their conflation as a symptom of the deeper problem rather than a distinct conceptual confusion needing separate analysis. The skeptic doesn't provide tools to disentangle the two potential questions even if comparisons *were* feasible.

  These positions, while defining the debate, fail to rigorously test whether the "numbers count" intuition stems from one mechanism, the other, both independently, or only their interaction. The conflation hinders progress: arguments against cross-person summation (using transplant cases) may not apply to within-person amplification, and arguments for aggregation based on alternatives (using broadcast cases) may not require cross-person summation if within-person amplification suffices.

  **Methodology:** The core method involves designing and analyzing carefully controlled pairs of hypothetical cases. Each pair will isolate variation along *one* proposed dimension (within-person amplification or cross-person summation) while holding the other constant and minimizing confounding factors like alternative actions or drastic differences in burden severity.

  1.  **Isolating Within-Person Amplification (Question 1):**
      *   **Goal:** Test if the number of others facing an identical burden *strengthens an individual's own complaint* against a policy, compared to being the sole bearer.
      *   **Probe Case Pair Design:**
          *   **Case A (Sole Burden):** Policy P imposes burden B (e.g., moderate noise pollution) *only* on Individual X. No other individuals are affected by P in any way relevant to complaint strength (e.g., they might receive a trivial benefit, or be unaffected). Alternative policies might exist, but crucially, none avoid burdening X without imposing equivalent or greater burdens elsewhere irrelevant to X's complaint. Key: X's complaint is assessed *as if* they are the only one burdened by P.
          *   **Case B (Shared Burden):** Policy P imposes burden B *on Individual X and also on N other individuals*, each suffering B identically. Crucially, the *nature* of B for X is identical to Case A, and crucially, *X has no special relationship or direct awareness of the others* – the *only* difference is the knowledge (implicit in the contractualist deliberation) that others *also* bear B under P. Alternative policies are identical or functionally equivalent to Case A (i.e., avoiding burdening any of the N+1 might impose greater burdens elsewhere, but avoiding burdening X alone is not a distinct feasible alternative).
      *   **Probativeness:** If X's complaint against P is judged *stronger* in Case B than in Case A, this suggests within-person amplification is occurring. If the strength is identical, it suggests amplification does *not* occur merely due to others sharing the burden. The cases hold constant the cross-person element (in both cases, only X's complaint is being compared against competing claims; there are no weaker complaints summing against a stronger one).

  2.  **Isolating Cross-Person Summation (Question 2):**
      *   **Goal:** Test if a large number of individuals, each with an individually *weaker* complaint than a single individual facing a different burden, can collectively render a policy reasonably rejectable, even when the single individual's complaint is stronger than any one of theirs.
      *   **Probe Case Pair Design:**
          *   **Case C (Stronger vs. One Weaker):** Policy P benefits many but imposes a *moderate burden M* on Individual Y. Policy Q avoids burdening Y but imposes a *very minor burden m* on Individual Z. Crucially, Z's complaint against Q (for imposing m) is *significantly weaker* than Y's complaint against P (for imposing M). Assume no feasible policy avoids imposing some burden. The question is whether P is reasonably rejectable by Y or Q by Z.
          *   **Case D (Stronger vs. Many Weaker):** Policy P benefits many but imposes the *same moderate burden M* on Individual Y. Policy R avoids burdening Y but imposes the *same very minor burden m* on a *Large Number (L) of individuals* (Z1, Z2, ..., ZL). Crucially, the burden *m* on *each* Z individual is identical to Case C, and Y's burden M is identical. The strength of Y's complaint against P (for M) is significantly stronger than the complaint of *any single Z individual* against R (for m). The *only* difference is the number of individuals bearing m under the alternative policy R.
      *   **Probativeness:** If Policy R is judged reasonably rejectable in Case D (due to the complaints of the Zs), while Policy Q is *not* judged reasonably rejectable in Case C, this suggests cross-person summation is occurring. If R is not rejectable, it suggests the stronger complaint (Y's) trumps the summation of weaker ones. These cases hold the within-person element constant: in both C and D, the complaint of the bearer of M (Y) and the complaint of *a single bearer* of m are fixed; only the *number* of bearers of m varies in the alternative scenario.

  **Possible Conclusions & Deciding Factors:**

  1.  **Distinct Mechanisms Confirmed:** Intuitions consistently shift in the predicted ways across both case pairs. X *does* have a stronger complaint when others share the burden (Within-Person Amplification). Policy R *is* rejectable due to the summed weaker complaints, while Policy Q is not (Cross-Person Summation). *Deciding Factor:* Clear, consistent intuitive responses to the paired cases as described.
  2.  **Only Within-Person Amplification:** X has a stronger complaint in the shared burden case, but Policy R is *not* rejectable – headcounts of weaker complaints cannot outweigh a stronger one. The "numbers count" intuition in broadcast-style cases stems solely from amplification within each individual's complaint assessment, not summation. *Deciding Factor:* Positive result on Pair 1, negative result on Pair 2.
  3.  **Only Cross-Person Summation (Implausible but Possible):** X's complaint strength is unaffected by others sharing the burden, but Policy R *is* rejectable. The "numbers count" intuition depends solely on summation, not amplification. *Deciding Factor:* Negative result on Pair 1, positive result on Pair 2.
  4.  **Indistinguishable/Interaction Necessary:** Attempts to isolate the mechanisms fail. Intuitions in the probe cases are unstable, contradictory, or heavily influenced by factors the cases aimed to exclude (e.g., implicit assumptions about alternatives). The two questions may be conceptually linked or rely on a common, irreducible normative factor. *Deciding Factor:* Inability to design probative cases without confounding variables, or consistent failure of cases to elicit the targeted intuitions independently.
  5.  **Skepticism Strengthened:** The exercise demonstrates the profound difficulty or impossibility of making the fine-grained interpersonal comparisons required to even *assess* the proposed mechanisms, lending support to the skeptic. *Deciding Factor:* Persistent inability to achieve stable agreement on the relative complaint strengths or the outcomes in the probe cases, despite careful construction.

  **Conditions for Project Failure:** The project fails if:

  1.  **Conceptual Collapse:** Rigorous analysis reveals that "within-person amplification" and "cross-person summation" cannot be meaningfully distinguished within the contractualist framework. The attempt to pull them apart is fundamentally flawed.
  2.  **Probe Case Failure:** It proves impossible to design paired cases that effectively isolate one dimension without:
      *   Introducing significant confounding normative factors (e.g., fairness, equality, implicit alternatives).
      *   Relying on intuitions that are themselves unstable, culturally variable, or subject to framing effects too severe to draw reliable conclusions.
      *   Failing to elicit any clear intuitive responses relevant to the targeted mechanism.
  3.  **Insufficient Novelty/Impact:** Even if distinct mechanisms are identified, the analysis fails to demonstrate that this distinction significantly clarifies existing debates (e.g., showing how proponents and critics have systematically talked past each other) or offers a compelling new perspective on resolving the aggregation problem within contractualism.
  4.  **Scope Mismanagement:** The investigation becomes bogged down in tangential debates (e.g., the precise metaphysics of complaint strength, exhaustive taxonomy of aggregation cases) without making focused progress on the core question.

  **Realistic Scope for One Semester:** A 6,000-word paper can realistically:

  1.  **Clearly define and motivate** the core suspicion and the proposed distinction between within-person amplification and cross-person summation within Scanlon's framework.
  2.  **Critically engage** with the core relevant positions in the aggregation debate (Strongest Claim, Alternative-Action, Skeptic) to demonstrate how they leave the distinction unexamined or conflate the issues.
  3.  **Develop and rigorously defend** the design of *one* probative pair of cases for *each* proposed dimension (Within-Person and Cross-Person), explaining how they isolate the mechanism and avoid key confounds. Detailed analysis of these primary cases will form the core argument.
  4.  **Analyze the implications** of the possible results (as outlined above) for the contractualist aggregation debate, focusing on how the distinction illuminates specific points of contention or potential stalemate in the existing literature.
  5.  **Acknowledge limitations:** Discuss potential objections to the case design, the limits of thought experiments, and the scope of the conclusion (e.g., this focuses on a specific structure within contractualism, not aggregation in moral theory generally).

  It is *unrealistic* within this scope to:

  *   Develop and analyze a large battery of cases.
  *   Provide a comprehensive history of the aggregation problem.
  *   Fully resolve the aggregation debate within contractualism.
  *   Extend the analysis extensively to other moral theories.
  *   Conduct empirical studies of intuitions.

  **Conclusion:** This project proposes a novel lens for examining the contractualist aggregation problem by suspecting it conflates two distinct normative mechanisms. By designing thought experiments aimed at isolating these mechanisms, it seeks to determine whether they are separable and what implications this has for understanding when and why "numbers count" in determining what we owe to each other. Success hinges on crafting probative cases and demonstrating the conceptual and dialectical payoff of the distinction.
