  For the residue: The claim that the self is "real as a pattern" doesn't cleanly map to statistics. Statistics deals with predictive adequacy, not metaphysical reality of patterns. This is a gap in the statistical vocabulary - it doesn't engage with ontology. The idea that narratives constitute themselves through telling is also problematic. In statistics, models are static tools; they don't have recursive self-updating properties like Dennett's narrative. This seems like philosophical residue rather than a missing statistical concept.

