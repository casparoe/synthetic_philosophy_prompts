answer: |-
  ### Decision Procedure: Codify, Leave Alone, or Burn Down  
  Based on David Lewis's *Convention* (1969), this procedure evaluates whether a practice should be formalized as a standard ("Codify"), remain informal ("Leave Alone"), or be actively replaced ("Burn Down"). The procedure prioritizes **arbitrariness** (requires ≥1 viable alternative) and **mutual expectations** (conformity driven by common knowledge). It also guards against dead-letter rules by assessing enforceability.  

  #### Step-by-Step Questions & Decision Flow  
  1. **Is there a recurring coordination problem?**  
     - **Yes**: Proceed to Q2.  
     - **No**: → **Leave Alone** (not a convention; likely an individual action or isolated issue).  
     - *Punt?* No. Non-coordination problems are out of scope.  

  2. **Is the practice arbitrary? (i.e., ≥1 workable alternative exists)**  
     - **Yes**: Proceed to Q3.  
     - **No**: → **Leave Alone** (not a convention; likely a technical necessity. Codifying it risks category error).  
     - *Punt?* No. Absence of alternatives is objective: if no one names a viable alternative during proposal, arbitrariness fails.  

  3. **Is there mutual expectation? (i.e., do people conform because they expect others to conform?)**  
     - **Strong (≥75% conformity, common knowledge)**: Proceed to Q4.  
     - **Weak (<75% conformity, or no common knowledge)**: → **Leave Alone** (codifying now risks dead letter; mutual expectations are unstable).  
     - *Punt?* Yes, if conformity is 50–75%. Human must judge if codifying will *create* mutual expectations (e.g., via tooling/education).  

  4. **Is the convention causing harm? (e.g., inefficiency, conflicts, better alternative)**  
     - **No**: → **Leave Alone** (stable convention; codifying adds bureaucracy without benefit).  
     - **Yes**: Proceed to Q5.  

  5. **Can we transition to a better alternative?**  
     - **Yes (clear alternative + transition plan)**: → **Burn Down** (replace convention).  
     - **No (no alternative or chaotic transition)**: → **Leave Alone** (burning down without coordination risks chaos).  
     - *Punt?* Yes, if alternatives exist but transition is complex. Human must design phased rollout.  

  ---  
  ### Applying the Procedure to Cases  
  **Case 1: Error Dialogs (Explanation-First vs. Code-First)**  
  - **Q1 (Coordination problem)?** Yes. Consistency in UI is a coordination problem (teams must align for user experience).  
  - **Q2 (Arbitrary)?** Yes. Explanation-first and code-first are both viable (no technical constraint).  
  - **Q3 (Mutual expectation)?** **Strong**. 80% conformity, common knowledge ("everyone does it"). Proceed.  
  - **Q4 (Harm)?** **Yes**. Customer complaints about inconsistency → harms cohesion.  
  - **Q5 (Transition)?** **Yes**. Alternative (code-first) is viable. Transition: Style guides + linter rules.  
  - **Output**: **Burn Down** the explanation-first convention; replace with codified code-first standard.  
  - *Why you might dislike this*: Burning down a stable convention risks internal friction. But arbitrariness + harm justify change.  

  **Case 2: Code Review (Reading 100% of Diffs)**  
  - **Q1 (Coordination problem)?** **No**. Code review slacking is a *collective action* problem (individuals benefit from defecting). Not coordination (no mutual alignment needed).  
  - **Output**: **Leave Alone**. Not a convention → procedure stops.  
  - *Additional insight*: Codifying this would create dead letter. People don’t expect 100% reading, so mutual expectations (Q3) would fail. Fix via culture/tooling (e.g., smaller diffs), not codification.  

  **Case 3: Service Naming (Team-Prefixed Names)**  
  - **Q1 (Coordination problem)?** Yes. Unique naming prevents conflicts (teams must avoid duplicates).  
  - **Q2 (Arbitrary)?** Yes. Alternatives exist (e.g., domain-based names: `billing.payment.service`).  
  - **Q3 (Mutual expectation)?** **Strong**. Near-universal conformity; common knowledge. Proceed.  
  - **Q4 (Harm)?** **Yes**. "Ugly," locks team boundaries → harms adaptability.  
  - **Q5 (Transition)?** **Punt to human**. Alternative (domain-based names) is viable, but transition is high-risk:  
    - *Safe transition*: New services use new convention; legacy unchanged. Mandate via registry tool.  
    - *Disaster transition*: Forced rename of existing services → breaks dependencies.  
  - **Output**: **Burn Down** *if* safe transition is designed. Else **Leave Alone**.  
  - *Why you might dislike this*: Procedure forces you to confront transition complexity. No easy fix.  

  ---  
  ### Confidence Assessment & Theoretical Fidelity  
  **Overall Confidence**: High on core Lewis principles (arbitrariness, mutual expectations). Moderate on operational steps.  

  **Genuinely Lewis**:  
  - **Arbitrariness (Q2)**: Direct from Lewis. Conventions require multiple equilibria (e.g., driving left/right).  
  - **Mutual Expectations (Q3)**: Lewis’s core: conventions rely on common knowledge of conformity.  

  **Made Up (But Lewis-Inspired)**:  
  - **Conformity Thresholds (Q3)**: Lewis doesn’t specify %. 75% is a practical heuristic (high conformity ≈ stable expectations).  
  - **Harm Assessment (Q4)**: Lewis focuses on stability, not harm. Added for your operational context.  
  - **Transition (Q5)**: Lewis doesn’t address breaking conventions. Built from his "salient" alternatives concept.  

  **Least Confident Step**: **Q3 (Mutual Expectation)**.  
  - Why: Measuring "common knowledge" is abstract. I substituted conformity % + "no one articulates why" as proxies, but this could misfire (e.g., conformity might be coincidental, not expectation-driven).  
  - Risk: Overestimating mutual expectations → dead letter.  

  **Recommendation**: Use this procedure to filter proposals, but layer in context (e.g., tooling support, stakeholder buy-in). For transitions, always **punt** to human judgment when risk is high.
