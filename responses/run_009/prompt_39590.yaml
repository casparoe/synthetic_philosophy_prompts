prompt: |-
  I run developer experience at a company of around 700 engineers, and one of my jobs is deciding when a de facto practice gets promoted to an official standard — we write it down, it goes in the handbook, teams get audited against it — versus when we leave it alone, or even actively kill it. This comes up a couple times a month: code formatting, how internal services get named, where the error message goes on a dialog, you name it.

  A while back I read David Lewis's book Convention, the 1969 one, where he treats conventions as solutions to recurring coordination problems — everyone conforms mainly because they expect everyone else to conform, and some other arrangement would have worked about as well. It struck me that this is basically my job in theory form, but I can't turn it into anything I can actually run. When a proposal lands in my inbox I have maybe twenty minutes before I have to say "codify it, leave it alone, or burn it down," and the people making these calls (sometimes me, sometimes managers with no theory at all) need something they can follow mechanically.

  So: write me a decision procedure grounded in whatever from Lewis is actually usable here. I'm imagining a series of questions asked in order, what counts as a good-enough answer to each, where the procedure outputs "leave it alone" and why, and the points where it has to hand the decision back to a human because the question is a values call, not a fact. Two parts of the theory I especially want baked in, plus one worry of my own:

  - The arbitrariness point: a convention needs a workable alternative. If only one arrangement could ever have worked, it's not a convention, and treating it like one is a category error — so the procedure has to have some test for "is there really a second way this could have gone."
  - The mutual expectation stuff, which I only half remember — common knowledge, everyone expecting everyone to conform, whatever the right version of that is. I suspect this matters for deciding whether writing something down helps (creates the common knowledge) or hurts.
  - My worry: a handbook rule nobody follows is worse than a practice everyone follows without a rule, because now the rule is dead letter and the handbook loses authority. The procedure should have something to say about when codifying is how a convention dies.

  Then run it on three real-ish cases:

  1. Error dialogs: about 80% of teams put the human-readable explanation before the error code, for no reason anyone can articulate other than "that's what everyone does." There's a proposal to make the code-first style official becuase a big customer asked for consistency across products.
  2. Code review: nobody actually reads the whole diff before approving, everyone knows nobody does, and there's a proposal to write a rule that reviewers must read 100% of every diff. I suspect this one isn't a coordination problem at all — more like everyone individually benefits from slacking — but I'd like the procedure itself to detect that, and I want to know what it outputs when it doesn't apply. Does it punt, or does it still say something useful about what to do instead?
  3. Service naming: every internal service gets prefixed with the owning team's name, and honestly I hate it — it's ugly and it locks in team boundaries. I'd like the procedure to tell me whether and how you can break a working convention on purpose, and what it says about the transition. There's clearly a version of breaking it that's fine and a version that's a disaster, and I can't tell which is which.

  For each case, say what the procedure outputs and where it had to punt, including any output you think I won't like.

  Last thing: at the end, tell me how confident you are overall, and specifically separate the steps of the procedure that are genuinely Lewis from the ones where you (or I) have just made something up that sounds Lewisian. Single out the step you're least sure actually tracks the theory. I'd rather know the procedure is half-invented than think it's more orthodox than it is.
reasoning: |-
  We are creating a decision procedure based on David Lewis's theory of conventions as solutions to coordination problems. The key elements from Lewis we want to incorporate are:

  1. **Arbitrariness**: A convention must have at least one workable alternative. If there's no alternative, then it's not a convention but a necessity. Therefore, we must check for the existence of at least one viable alternative.

  2. **Mutual Expectations and Common Knowledge**: Conventions are maintained because everyone conforms and expects everyone else to conform. Codifying a convention might help by creating common knowledge, but if the mutual expectations aren't there, codifying might fail and lead to dead letter (which we want to avoid).

  Additionally, we have the user's concern: a handbook rule that nobody follows is worse than an unwritten practice because it undermines the handbook's authority.

  We design the procedure as a series of questions. The output is one of: 
  - **Codify**: Write it down as an official standard.
  - **Leave Alone**: Let it remain as an unwritten practice.
  - **Burn Down**: Actively try to eliminate the practice and replace it with something else (or nothing).

  The procedure should also be able to **Punt** (hand back to human) when a question requires a values judgment.

  ### Decision Procedure

  1. **Is there a recurring coordination problem?**
     - We are looking for situations where multiple agents (engineers, teams) must coordinate their actions to achieve a common goal, and the problem recurs in similar forms.
     - *If NO*: This is not a convention. It might be a matter of individual action or a one-off. Then we consider: 
       - **If the proposal is to codify a rule that doesn't address a coordination problem, then it's likely a rule for individual behavior. In that case, we must ask: Is this rule enforceable and beneficial at the individual level?** (This step is outside Lewis's convention theory, so we might punt to human judgment on whether to codify or not. But note: if it's not a coordination problem, then Lewis doesn't apply. We might output: "Not a convention; consider as a general rule." But the user wants to know what to do. We can say: if it's not a coordination problem, then the procedure doesn't apply and we must use other criteria. However, let's structure it so that we try to cover the cases.)
     - *If YES*: Proceed to step 2.

  2. **Is the practice arbitrary? (i.e., is there at least one viable alternative?)**
     - We must identify a different practice that could have been adopted and would have worked about as well.
     - *If NO*: Then the practice is not arbitrary and likely the only viable solution. We cannot treat it as a convention. We should **Leave Alone** because codifying it as a convention is a category error. (It might be a technical necessity, so we don't need to codify it as a convention because it's already the only way. But note: if it's the only way, then writing it down might still be useful for documentation? However, the user's worry is about dead letter. If it's the only way, then writing it down doesn't create a convention because there's no alternative. We might write it down as a fact, not as a convention. But the procedure is about conventions. So for the purpose of this procedure, we say: if it's not arbitrary, then it's not a convention and we leave it alone. However, if the proposal is to change it, then we must consider if it's really not arbitrary. If there's no alternative, then changing it is not possible. So we leave it alone and reject the proposal to change.)
     - *If YES*: Proceed to step 3.

  3. **Is there mutual expectation of conformity? (i.e., does everyone conform and expect everyone else to conform?)**
     - This is the common knowledge aspect: everyone knows the practice, everyone expects others to follow it, and this expectation is common knowledge.
     - *If NO*: Then we have a problem. The practice is not yet a convention. We must consider:
       - **If we codify it now, will that create the mutual expectation?** This is a judgment call. We might look at whether the practice is already widely followed (say, 80% or more) and whether the remaining non-conformity is due to lack of common knowledge. If so, codifying might help. But if the practice is not widely followed, codifying might lead to dead letter. We might need to **Punt** to human judgment on whether codifying will create the expectation. Alternatively, we can set a threshold: if current conformity is high (e.g., >75%) and the issue is inconsistency in knowledge, then codify. Otherwise, leave alone (or burn down if the practice is harmful).
     - *If YES*: Then we have a convention. Proceed to step 4.

  4. **Is the convention causing problems? (e.g., is it inefficient, harmful, or is there a better alternative?)**
     - This step addresses the user's desire to sometimes break a convention. We have two sub-cases:
       - *If NO*: The convention is working fine. We can **Leave Alone** because it doesn't need intervention. (Why fix what isn't broken? Codifying might be unnecessary and might even disrupt the mutual expectations if done poorly.)
       - *If YES*: The convention is problematic. We then consider:
         - **Burn Down**: We want to replace it. But we must have a viable alternative. Then we proceed to step 5.

  5. **For Burn Down: Is there a viable alternative that we can transition to without causing too much disruption?**
     - We must check:
       - The alternative is workable (arbitrariness condition holds for the new candidate).
       - We can establish mutual expectations for the new practice (through a coordinated change, e.g., a big announcement, tooling, etc.).
     - This step is complex and requires human judgment. We might **Punt** to human to design the transition. But the procedure can output **Burn Down** if we have a clear alternative and a plan to create new mutual expectations. Otherwise, we might **Leave Alone** (if the cure is worse than the disease) or **Punt**.

  Additionally, we must incorporate the user's worry about dead letter:

  - At the point of codifying (step 3 or 4), we must consider: **If we codify, will it be followed?** We can use the current level of conformity as a proxy. If current conformity is low (<50%), then codifying is risky. We might set a threshold: if conformity is below X% (say, 70%), then **Leave Alone** because codifying might lead to dead letter. But note: step 3 already checks mutual expectation, which implies conformity. So step 3 should handle that.

  Let's reorganize to avoid duplication and ensure flow.

  Revised procedure:

  **Decision Procedure for Convention Management**

  1. **Coordination Problem Check**: 
     - Is the practice addressing a recurring coordination problem? 
       - If **No**, then output: **Not a Convention** (and we punt to human: this might be an individual rule, so use other criteria to decide whether to codify, leave alone, or burn down). 
       - If **Yes**, proceed to step 2.

  2. **Arbitrariness Check**:
     - Is there at least one viable alternative practice that could have been adopted and would have worked about as well? 
       - If **No**, then output: **Leave Alone** (because it's not a convention, it's a necessity; codifying it as a convention is a category error, but note: we might still document it as a technical requirement, but that's outside the convention framework). 
       - If **Yes**, proceed to step 3.

  3. **Status of Mutual Expectation**:
     - Is the practice already widely followed (say, >75% of the time) and is there mutual expectation (i.e., people expect others to follow it)? 
       - We can approximate mutual expectation by: 
          - High conformity without enforcement? 
          - People express that they do it because they expect others to do it? 
          - Common knowledge: it's widely known and taken for granted.
       - If **No** (i.e., the practice is not widely followed OR there is no mutual expectation), then:
          - Consider: If we codify, will that create the mutual expectation? 
            - If the practice is already followed by a majority (say, 50-75%) and the main issue is inconsistency due to lack of common knowledge, then codifying might help. We might set: if current conformity is between 50% and 75%, then **Punt** to human to decide (with a note that codifying might work but is risky). If conformity is below 50%, then **Leave Alone** (because codifying would likely result in dead letter) OR consider **Burn Down** if the practice is harmful. But if the practice is not harmful, then leave alone. 
            - Alternatively, we can output: **Leave Alone** because the mutual expectation is not there and codifying might not create it. But we might try to build the convention first by promoting it without enforcement. However, the procedure must be mechanical. We'll set:
              - If conformity < 50%: **Leave Alone** (or if the practice is harmful, consider **Burn Down** but that's a separate branch).
              - If 50% <= conformity < 75%: **Punt** to human (because it's borderline; the human must decide whether codifying will create the expectation).
              - If conformity >= 75%: we assume mutual expectation is present and proceed to step 4.
          - But note: step 3 is about the current state. We are checking for existing mutual expectation. If it's not there, we don't automatically go to step 4. We handle it in step 3.
       - If **Yes** (mutual expectation exists), proceed to step 4.

  4. **Problem Assessment**:
     - Is the convention causing significant problems (e.g., inefficiency, conflict, or there's a clearly better alternative)? 
       - If **No**, then output: **Leave Alone** (the convention is working, so don't interfere). 
       - If **Yes**, then proceed to step 5.

  5. **Burn Down Feasibility**:
     - Is there a viable alternative that is clearly better and can we engineer a transition? 
       - We must be able to create new mutual expectations for the alternative. 
       - This requires: 
          - A specific alternative in mind.
          - A plan to coordinate the change (e.g., a clear announcement, tooling support, timeline, etc.). 
          - Evidence that the alternative is acceptable to a majority (to avoid resistance). 
       - If **Yes**, then output: **Burn Down** (and replace with the alternative). 
       - If **No** (i.e., no viable alternative or no feasible transition plan), then output: **Leave Alone** (because trying to burn it down without a replacement would cause chaos). 

  Now, we run the three cases:

  ### Case 1: Error Dialogs
  - **Current practice**: 80% of teams put human-readable explanation before the error code.
  - **Proposal**: Codify code-first style because a big customer asked for consistency.

  **Procedure**:
  1. **Coordination Problem?** Yes, because consistency in UI across products is a coordination problem (teams must present errors in a consistent way for user experience).
  2. **Arbitrariness?** Yes, because both orders (explanation first or code first) are viable. There's no technical reason one is better than the other (though there might be usability differences, but both are workable).
  3. **Mutual Expectation?** 
     - Current conformity for the existing practice (explanation first) is 80% (>=75%), so mutual expectation exists for explanation first.
     - But note: the proposal is to change to code first. So we are not considering the current practice as the convention? Actually, the current practice is the convention. The proposal is to break that convention and establish a new one. So we are at step 4 for the current convention: we must check if it's causing problems.
  4. **Problem Assessment**: 
     - The current convention (explanation first) is causing a problem: inconsistency because 20% are doing it differently, and a big customer is complaining. Also, the proposal is to change to code first for consistency. So the problem is the lack of absolute consistency and a customer request. 
     - Therefore, **Yes**, it is causing a problem. Proceed to step 5.
  5. **Burn Down Feasibility**:
     - Alternative: code first. Is it viable? Yes, because it's just a different order. 
     - Can we engineer a transition? We can announce the change, update the handbook, and have a transition period. But we must create mutual expectations for the new practice. 
     - However, note: the current convention is deeply ingrained (80% follow it). Changing to code first might cause confusion and resistance. Also, the customer request might be a strong driver. 
     - The procedure outputs: **Burn Down** (replace with code first) because there is a viable alternative and a clear reason (customer request) that might help in creating new mutual expectations. 

  But note: the proposal was to codify code-first. The procedure says we should burn down the existing convention and replace it. So we would codify the new practice (code first) as part of the burn down. However, we must be cautious because the existing convention is strong. The procedure might require that we have a plan to transition. So we might **Punt** to human for the transition plan? Step 5 says if yes, then burn down. But step 5 is a bit broad. We can output **Burn Down** but note that the transition must be managed carefully.

  **Output for Case 1**: **Burn Down** the existing convention (explanation first) and replace with code first. But we must have a plan to create new mutual expectations.

  ### Case 2: Code Review
  - **Current practice**: Nobody actually reads the whole diff before approving, and everyone knows it.
  - **Proposal**: Write a rule that reviewers must read 100% of every diff.

  **Procedure**:
  1. **Coordination Problem?** 
     - Is code review a coordination problem? Not exactly. The problem of doing a thorough review is more of an individual responsibility. Each reviewer benefits individually from being diligent (if they care about code quality) but also individually benefits from slacking (saving time). There's no coordination aspect because one reviewer's decision to read the diff doesn't directly affect another reviewer. It's a collective action problem (like a prisoner's dilemma) but not a coordination problem in Lewis's sense. 
     - Therefore, **No**. Output: **Not a Convention**. 
     - Since it's not a convention, we cannot use the convention procedure. We must punt to human for a different kind of decision. The human must decide: is this rule enforceable? Is it beneficial? But note: the proposal is to write a rule. Without mutual expectations and common knowledge, a rule might not be followed. The current practice (not reading the whole diff) is the norm. 

  **Output for Case 2**: **Not a Convention**. The procedure doesn't apply. We must handle this as a management issue. The user suspects it's not a coordination problem, and the procedure confirms. The output is **Punt** to human with note: this is an individual behavior rule. Given that the current norm is to not read 100%, codifying a rule that requires 100% might lead to dead letter because it's not aligned with what people actually do. Therefore, the human might decide: **Leave Alone** (because the rule is unrealistic) or try to change the culture (which is not about conventions). Alternatively, the human might consider if there's a way to make code review more efficient so that reading 100% is feasible.

  ### Case 3: Service Naming
  - **Current practice**: Every internal service gets prefixed with the owning team's name.
