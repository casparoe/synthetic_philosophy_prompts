  Okay, the user teaches an intro ethics elective at a community college with about 18 adult students of mixed ages. They need a 75-minute in-class activity to help students feel the difference between guilt and shame as moral emotions, not just take notes. The user has an idea for a multi-round game where small transgressions are framed in two different ways: one focused on the act and the other on the person. The goal is to observe how each framing affects behavior—guilt leading to repair and coming clean versus shame leading to hiding, withdrawing, or blaming.

  First, I need to design a game that's engaging and fits within the time frame. The game should have stakes that matter but without real money. Using tokens or points seems practical. The user wants two framing conditions: guilt condition (act-focused) and shame condition (person-focused). Then a final round where students choose which culture to operate under. The debrief should tie back to anthropological concepts of shame-culture vs. guilt-culture.

  Considering the constraints: 18 students, 75 minutes. The activity needs setup, game rounds, voting, and debrief. Allocating time: 10 min setup, 30 min gameplay (three 8-min rounds), 10 min voting and final round, 25 min debrief. That adds up to 75 minutes. 

  The game mechanics: A simple rule-based game where students can earn points but might be tempted to cheat. Using dice rolls or coin flips adds unpredictability. Transgressions could be things like misreporting outcomes. The scoring system needs to be transparent. Tokens as points that can be exchanged for a small reward (like candy or extra credit) would work. 

  For the guilt condition, transgressions are framed as "Violation: Rule 4 Broken." For shame, it's "Violation: Rule 4 Broken (Shows disregard for group fairness)." The language here is crucial. The shame framing implies a character judgment. 

  Predictable issues: Students might not cheat enough to generate data. Including a temptation mechanic is important. Maybe a "Temptation Die" where high rolls tempt cheating. Also, students might not report their own transgressions honestly. The facilitator must monitor closely. 

  Another issue is the emotional impact. Shame framing might cause real discomfort. The facilitator needs to handle this sensitively, ensuring a safe environment. Emphasizing that it's a simulation and using anonymous reporting can help. 

  The game can't replicate internalized shame without an actual audience. The debrief will need to address this, discussing how shame operates even when no one is watching. Also, cultural differences in shame/guilt responses might affect student reactions, which should be acknowledged in the debrief. 

  Materials needed: Dice, tokens, rule sheets, violation cards. Setup: Divide into small groups, assign a facilitator per group. Each round, students play the game, report points, and receive framed violations if they cheat. Observing behaviors like self-reporting, hiding, or blaming rules. 

  After two rounds (one guilt, one shame), the class votes on the culture for the final round. Then debrief, connecting experiences to the concepts. Avoid philosopher names until the end to keep the focus on the experience. 

  Potential pitfalls: Time management is tight. Keeping rounds short is essential. Also, ensuring facilitators are consistent in applying the frames. Training them beforehand or using scripted responses can help. 

  The debrief should guide students to reflect on their reactions. Questions like "How did the guilt condition make you want to act?" or "Did anyone feel attacked personally in the shame round?" Connecting their feelings to the cultural choice in the final round and whether a culture can consciously choose its moral framework. 

  Overall, the activity should make the abstract concepts tangible through lived experience, fostering deeper understanding in an intro ethics class.
answer: |-
  Here's a **"Rules & Reckoning"** activity designed to make guilt vs. shame visceral, fitting your 75-minute session:

  **Core Game:** A simple, fast-paced "resource collection" game with built-in temptation to cheat.

  **Materials per Group (Divide class into 3 groups of 6):**
  *   1 Facilitator (You or a prepped TA/volunteer per group - CRITICAL)
  *   6 Dice (or coins for flip: Heads=1, Tails=0)
  *   "Rule Sheet" (Visible to all)
  *   Scoreboard (Paper/Whiteboard)
  *   2 Types of "Violation Cards" (Pre-printed):
      *   **Guilt Frame (Yellow):** "VIOLATION: RULE [X] BROKEN. -[Y] Points. Correct action: [Z]."
      *   **Shame Frame (Red):** "VIOLATION: RULE [X] BROKEN (Shows disregard for group fairness / honesty at this table). -[Y] Points."
  *   Tokens/Chits (or tally marks) for "Wealth Points" (WP)
  *   Small prize pool (Candy, 1-2 bonus points, "Ethics Champion" certificate - stakes that matter *a little*)

  **Rules & Scoring (Simple & Tempting):**
  1.  **Goal:** Earn the most "Wealth Points" (WP) per round (3 rounds total).
  2.  **Basic Turn:** On your turn, roll 1 die (or flip 1 coin). Record the number shown. This is your "Income."
  3.  **Reporting:** *Loudly* announce your result to the Facilitator. Facilitator records it publicly on the scoreboard.
  4.  **Scoring:** Your WP = Total Income reported this round. (e.g., Report 4, 2, 5? WP = 11).
  5.  **The Temptation (Rule 4 - The Key Rule):** **Once per round,** BEFORE rolling, a player may declare: **"Risk for Reward!"** They then roll *two* dice (or flip *two* coins). BUT, they **MUST** report *only the highest single die result* (or only one coin result) as their Income for that turn. **They cannot report the sum.**
  6.  **Transgression:** If a player reports the *sum* after "Risk for Reward," it's a violation. Facilitator *must* catch this by listening/reviewing scores. *(Predictable Problem #1: Facilitators MUST be sharp and consistent. Some violations might be missed, causing frustration. Practice beforehand.)*
  7.  **The Framing (Core of the Activity):**
      *   **Round 1 (Baseline - Neutral):** Violation? Facilitator says: "Violation: Rule 4 Broken. -3 WP." (Records -3). *No card.*
      *   **Round 2 (Guilt Condition - ACT Focus):** Violation? Facilitator gives YELLOW card: "VIOLATION: RULE 4 BROKEN. -3 WP. Correct action: Report only the highest die/coin." (Records -3).
      *   **Round 3 (Shame Condition - PERSON Focus):** Violation? Facilitator gives RED card: "VIOLATION: RULE 4 BROKEN (Shows disregard for group fairness / honesty at this table). -3 WP." (Records -3). *Facilitator places it visibly near the player.*
  8.  **Behavior Tracking (Facilitator Notes):** Facilitator subtly notes: Does the violator self-report later? Do they try to hide the card? Blame the rules ("This rule is stupid!")? Withdraw/stop engaging? Apologize/explain? Try extra hard to follow rules perfectly after?

  **Activity Flow (75 Min):**

  1.  **Setup (10 min):** Form groups. Explain rules clearly (focus on Goal, Turn, "Risk for Reward," Scoring). Emphasize it's a *simulation* and feelings might arise - respect each other. Play a quick **practice round (Neutral Frame)** so everyone understands mechanics. Answer questions.
  2.  **Round 1: Baseline (8 min):** Play. Use Neutral Frame for violations. *(Predictable Problem #2: Players might be overly cautious. Encourage "Risk for Reward" use to generate data!)*
  3.  **Round 2: Guilt Frame (8 min):** Announce: "Slight change to how violations are handled." Play using Guilt Frame (Yellow Cards). Observe.
  4.  **Round 3: Shame Frame (8 min):** Announce another change. Play using Shame Frame (Red Cards). Observe reactions closely (hiding card, slumped posture, defiance?).
  5.  **Group Synthesis & Vote (10 min):** Groups briefly discuss (3 min):
      *   *"How did the *way* violations were pointed out in Round 2 vs. Round 3 make you feel? How did it affect people's behavior?"*
      *   *"Which 'culture' (Round 2 style or Round 3 style) feels more effective for getting people to play fairly *and* stay engaged?"*
      *   Groups report key feelings/behaviors observed (3 min). Class **votes** on which frame (Guilt-Yellow or Shame-Red) to use for the Final Round.
  6.  **Final Round (8 min):** Play using the **class-chosen frame**. Observe if the chosen culture changes behavior (e.g., less cheating? More self-policing? More tension?).
  7.  **Debrief (23 min - CRITICAL):** Guide discussion:
      *   **Feelings First:** "Describe the feeling when you got a Yellow card? A Red card? Did you see others react differently?" (Focus on guilt = "I did bad," shame = "I *am* bad").
      *   **Behavior:** "What did people *do* after a Yellow card? (e.g., explain, apologize, try harder to follow rules?) After a Red card? (e.g., hide card, get defensive, withdraw, blame rules, lash out?) Did anyone self-report a mistake *later*? Why/why not?"
      *   **The Vote:** "Why did the class vote for [Chosen Frame]? What were you hoping it would achieve? Did it work in the final round?"
      *   **The Anthropological Contrast:**
          *   "Imagine a whole society running like Round 2 (Yellow). What might that look like? (Focus on rules, restitution, personal responsibility, internal compass)".
          *   "Imagine a society running like Round 3 (Red). What might that look like? (Focus on honor, reputation, conformity, fear of exposure, external judgment)".
      *   **The Core Limitation (State Explicitly):** "In this game, shame relied on the red card and the facilitator *watching*. But real shame often hits us even when *no one else knows*. How does that change it? Is it more about fearing exposure, or truly feeling flawed?" *(This is the key thing the game can't fully replicate - the internalized witness/audience. You MUST highlight this.)*
      *   **Can Culture Choose?** "Could a society just *decide* to switch from a 'Red Card' culture to a 'Yellow Card' culture? What would that take? Is it more like drifting based on shared experiences (like our game rounds)?" (Introduce terms "shame-culture" / "guilt-culture" here).
      *   **Connecting to Ethics:** "How might understanding guilt vs. shame help us think about punishment, forgiveness, moral development, or building ethical communities?"

  **Predictable Problems & Mitigations:**

  *   **Not Enough Cheating:** Stress the "Risk for Reward" option heavily. Frame it as strategic, not inherently "bad." Facilitators can gently remind players of the option. Offer small reward for most WP (creates incentive).
  *   **Facilitator Inconsistency:** Brief facilitators THOROUGHLY. Use scripts ("Rule 4 Broken"). Emphasize catching *all* Rule 4 violations involving reporting the sum. Practice.
  *   **Shame Frame Backlash:** Red Cards *will* cause discomfort. Mitigate: 1) Strong setup emphasizing simulation/research, 2) Facilitators deliver cards neutrally, not judgmentally, 3) Debrief feelings non-judgmentally, 4) Ensure safe environment. *This is the point, but manage it.*
  *   **Time Crunch:** Be ruthless on timing. Use a timer. Simplify reporting (Facilitator writes scores fast). Cut synthesis discussion short if needed; the debrief is key.
  *   **Overly Competitive/Silly:** Emphasize this is about observing *feelings and reactions*, not "winning." The prize is minor. Redirect silliness to the task.
  *   **Misinterpreting Frames:** Ensure facilitators use *only* the pre-printed card text. No extra commentary like "You cheater!"

  **What the Game Can't Replicate (Debrief Focus):**

  1.  **The Internalized Witness:** The game's shame relies on external exposure and judgment (facilitator, card, peers seeing). Real shame often involves an *internal* audience ("What would X think?" or an internal ideal self) punishing you even in private. Highlight this gap.
  2.  **Depth & Permanence:** Game shame is fleeting. Real shame can be deep, persistent, and identity-shattering. The game only hints at the intensity.
  3.  **Cultural Nuance:** Real-world cultures blend these emotions; the game presents idealized types. Acknowledge this complexity.

  **Why This Works:** It creates immediate, low-stakes consequences framed differently, forcing students to *experience* the difference in emotional weight and behavioral response (guilt prompting correction, shame prompting avoidance/blame) within the compressed time. The vote makes them actively consider the cultural choice, priming the anthropological debrief. The structured violation cards ensure consistent framing. The limitation is acknowledged, turning it into a teaching point about the internal dimension of shame.
