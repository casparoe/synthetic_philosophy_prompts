answer: |-
  Here's a dissection of "victors' justice" into its core claims, analyzed for validity, implications for legitimacy, and the status of scholarly debate – specifically addressing retroactivity and the Nuremberg/Tokyo differences:

  **Core Claims Embedded in "Victors' Justice" & Their Analysis:**

  1.  **Claim: The Victorious Powers Established, Staffed, and Controlled the Tribunals.**
      *   **Validity:** **Trivially True.** The London Charter (Nuremberg) and the Tokyo Charter were drafted solely by the Allied Powers (US, UK, France, USSR for Nuremberg; adding China, Australia, etc. for Tokyo). Judges and prosecutors were appointed exclusively from Allied nations. The Allied Control Council oversaw Nuremberg's enforcement.
      *   **Implications for Legitimacy:** Does **not**, by itself, prove the verdicts were wrong or that the tribunals were a "sham." It establishes a **structural bias risk** and a **clear conflict of interest** (the victors were judging conduct directed against them and their allies). This *weakens* the perception of impartiality and raises valid concerns about fairness, but it doesn't automatically invalidate every legal finding or the core principles established. *Counter:* Could an impartial tribunal realistically have been established *without* the victors at that time? Who else had the power or standing?
      *   **Scholarly Status:** **Settled Historical Fact.** Uncontested.

  2.  **Claim: Only Leaders of the Defeated Axis Powers Were Prosecuted. (Selectivity)**
      *   **Validity:** **Substantive and Largely Defensible.** No senior Allied leaders were tried for acts committed during the war (e.g., Churchill, Roosevelt/Truman, Stalin, Harris (RAF Bomber Command), LeMay (USAAF)). Acts like the firebombing of Dresden/Tokyo or the atomic bombings were not subject to prosecution.
      *   **Implications for Legitimacy:** This is a **powerful critique of hypocrisy** and **selective application of law.** It fundamentally undermines the claim of universal justice. It strongly supports the "victors' justice" label *in practice*. However, it does **not prove** that the *specific charges against the defendants were legally invalid or factually untrue*. It shows the justice system was applied **unevenly**, not necessarily that the law applied to the defendants was inherently flawed. *Key Distinction:* Selective prosecution doesn't mean the prosecuted acts weren't crimes; it means others who *might* have committed similar crimes weren't prosecuted. This weakens the tribunals' *moral authority* and *perceived fairness*, but is less decisive on the *legal validity* of the charges against those actually tried.
      *   **Scholarly Status:** **Settled Historical Fact (that only Axis leaders were prosecuted).** The *interpretation* of its significance for legitimacy is **contested:** Some see it as fatally undermining legitimacy (hypocrisy); others see it as a pragmatic, if regrettable, first step necessary to establish the principle of accountability for atrocities and aggression.

  3.  **Claim: The Charges, Particularly "Crimes Against Peace" (Aggressive War), Were Retroactively Applied (Violating *Nullum Crimen Sine Lege*).**
      *   **Validity:** **Substantive and Contested.** This is the core legal legitimacy challenge.
          *   *Nuremberg:* The prosecution argued aggressive war was criminalized by the 1928 Kellogg-Briand Pact (renouncing war as an instrument of national policy), plus state practice and evolving customary law. War crimes and crimes against humanity were argued to be rooted in Hague/Geneva conventions and *jus cogens* norms. The Tribunal largely accepted this view. **Scholarly View:** **Contested, but increasingly defended.** Many scholars now argue the core concepts (aggression as illegal, war crimes) *were* established pre-war, though *criminal liability for individuals* was novel and the *enforcement mechanism* unprecedented. Nuremberg articulated existing principles rather than purely inventing new ones. (See H. Lauterpacht, G. Schwarzenberger, later work by A. Cassese).
          *   *Tokyo:* **Much Shakier Ground.** The charge of "Conspiracy to Commit Aggression" was particularly novel and expansive. The majority judgment applied the law of conspiracy far more broadly than common law precedents. The Tribunal interpreted Kellogg-Briand more sweepingly as *criminalizing* planning/waging aggressive war for individuals. Several judges dissented vehemently on retroactivity (Justice Pal, Justice Röling partially, Justice Bernard).
      *   **Implications for Legitimacy:** This is **critical** to your friend's "sham" claim and dismissal of precedent. If the law was genuinely invented *ex post facto*, it directly violates a fundamental principle of justice (*nullum crimen sine lege*) and severely damages the tribunals' *legal* legitimacy. If the law was merely *applied for the first time* or *clarified/codified* based on pre-existing prohibitions, the legitimacy challenge is weaker. **The retroactivity critique is strongest at Tokyo, especially regarding conspiracy.**
      *   **Scholarly Status:** **Highly Contested.**
          *   **Settled:** The Allies *did* draft the Charters defining the crimes *after* the acts occurred. Individual criminal liability for aggression was unprecedented in an international court.
          *   **Contested:** Whether the *underlying prohibitions* (aggression as illegal, war crimes, crimes against humanity) were sufficiently established in *international law prior to WWII* to satisfy *nullum crimen* for *individuals*. The "progressive development" vs. "pure retroactivity" debate remains live among legal historians and philosophers (e.g., H.L.A. Hart's positivist critique vs. Lon Fuller's natural law defense).

  4.  **Claim: The Victorious Powers Were Guilty of Similar Acts. (Substantive Bias/Hypocrisy)**
      *   **Validity:** **Substantive and Partially Defensible.** Arguments focus on:
          *   Strategic Bombing (Dresden, Tokyo, atomic bombs): Not prosecuted as war crimes. The tribunals adopted a narrow view of proportionality/military necessity that largely shielded these acts.
          *   Soviet Actions (Katyn massacre, aggression against Poland/Baltics): Stalin sat as a judge at Nuremberg; these acts were ignored.
          *   Colonialism/Pre-War Actions: Some argue Allied empires committed acts analogous to crimes charged against the Axis.
      *   **Implications for Legitimacy:** Reinforces Claim 2 (Selectivity) and magnifies the perception of hypocrisy and bias inherent in Claim 1 (Victor Control). **This strongly supports the *moral* critique** of "victors' justice" and the tribunals as instruments of power rather than pure justice. However, like Claim 2, it doesn't *directly* prove the *specific charges* against the defendants were legally invalid or factually incorrect. It shows the victors defined the law and process in ways that shielded *themselves*.
      *   **Scholarly Status:** **Settled** that specific acts like Allied strategic bombing were not prosecuted. **Contested** on whether these acts were *legally equivalent* to the specific war crimes/crimes against humanity charged against the Axis defendants (e.g., systematic extermination camps, widespread atrocities against civilians in occupied territories). The scale, intent, and systematic nature of Axis atrocities are generally seen as distinct, though the *legal principles* potentially implicated by Allied actions remain debated.

  **Addressing Your Friend's Leap & the Precedent Question:**

  Your friend argues: "Victors' justice" = Sham --> No legitimacy --> Cannot be precedent.

  *   **Where the critique holds weight (Supports dismissing *absolute* legitimacy/moral authority):**
      *   Claims 1 & 2 (Victor Control & Selectivity): Undeniably true. They create a **profound appearance of bias and hypocrisy**. This *severely damages* the tribunals' claim to be *impartial* dispensers of *universal* justice. It makes them look like instruments of the victors' power. This strongly supports dismissing the tribunals as models of *perfectly fair and unbiased* international justice.
      *   Claim 4 (Substantive Similar Acts): Reinforces the above, amplifying the hypocrisy critique.
      *   Claim 3 (Retroactivity - Especially at Tokyo): If one accepts the strong retroactivity critique (particularly for conspiracy at Tokyo), it **directly attacks the *legal* legitimacy** of those specific charges/verdicts. If the law was invented after the fact, the trial *for that charge* lacks core legal legitimacy.

  *   **Where the leap doesn't necessarily follow (Doesn't prove the *entirety* was a sham or negate *all* precedent):**
      *   **Selectivity/Hypocrisy ≠ Invalid Charges:** The fact others weren't prosecuted doesn't mean Goering wasn't responsible for aggressive war or that Eichmann wasn't responsible for crimes against humanity. The factual record of Axis atrocities was overwhelming in many cases.
      *   **Victor Control ≠ Wrong Verdicts:** A structurally biased process *risks* wrong verdicts, but doesn't guarantee them. The evidence presented was often meticulous and devastating.
      *   **Retroactivity Nuance:** Even if *some* charges (like conspiracy at Tokyo) are seen as retroactive, **core charges like War Crimes (violations of Hague/Geneva) and Crimes Against Humanity (especially related to systematic persecution/murder) were far less vulnerable to this critique.** The *principle* that individuals can be held accountable for such acts under international law was arguably the tribunals' most significant and enduring contribution, regardless of the flawed process.
      *   **The Value of Precedent:** Legal systems constantly build on imperfect foundations. Nuremberg's articulation of crimes against humanity, the rejection of the "just following orders" defense (under certain conditions), and the principle of individual accountability were **revolutionary and necessary developments.** Dismissing them *entirely* because of the victors' role ignores their profound impact on the development of the Genocide Convention, the Universal Declaration of Human Rights, the ad hoc tribunals (ICTY, ICTR), and the ICC. The *core principles* proved vital, even if the *specific historical application* was flawed.

  **Conclusion for Your Group Discussion:**

  *   **"Victors' justice" accurately describes:** The exclusive control by the victors and the selective prosecution *only* of the defeated. This creates undeniable bias and hypocrisy. **(Trivially/Substantively True).**
  *   **"Victors' justice" is contested regarding:** The *legal* retroactivity of the core charges (especially at Nuremberg) and whether the victors' *own* unprosecuted acts were legally equivalent. **(Substantive and Contested).**
  *   **"Victors' justice" does NOT automatically prove:** That every verdict was factually wrong or that every legal principle articulated was invented out of whole cloth. **(The "sham" label is an interpretation, not a settled fact).**
  *   **The leap to dismissing *all* legitimacy and precedent requires:** Accepting the *strongest* interpretation of retroactivity (particularly for Crimes Against Peace/Conspiracy) *and* arguing that this flaw contaminates the *entire* proceeding *and* that the core principles articulated (individual accountability for atrocities) had no independent legal basis *and* possess no inherent value. **This is a highly contested philosophical and legal position, not a settled conclusion.**

  **Recommendation for Discussion:** Move beyond nodding at the slogan. Ask: *Which specific aspect of "victors' justice" are you invoking? Control? Selectivity? Retroactivity? Hypocrisy? And how does that *specific* aspect invalidate the *specific* legal principle or precedent we're discussing?* Force the critique to engage with the substance and nuance of the law and the historical record. Acknowledge the flaws but examine whether they negate the entire enterprise or highlight necessary, if imperfect, steps in developing international law. The retroactivity debate, especially the Nuremberg vs. Tokyo comparison, is a rich area for this kind of focused discussion.
