  The philosophical problem: is this option luck (her choice) or brute luck (her preferences shaped by upbringing)? Luck egalitarians might argue it's option luck because she chose. But her preferences weren't chosen; they were formed by her environment. If preference formation is always brute luck, then all choices might trace back to unchosen circumstances, collapsing the distinction. 

