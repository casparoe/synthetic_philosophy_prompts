  To create a dividing case, I propose a universe with only two photons moving parallel. Substantivalism would see absolute motion between them, while relationalism might consider them "at rest" relative to each other. This isolates the conflict cleanly.

  I'll construct five crisp responses: principles, implications, predicted verdict, reasoning with analog, and dividing case. Keeping sentences terse per instruction.
