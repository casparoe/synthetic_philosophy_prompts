  The student presents several key observations: the realist argument about modal facts being presupposed in ersatz accounts, the actualist concerns about ontological extravagance and moral indifference, and the apparent deadlock over how to measure parsimony. Their own hypothesis suggests the disagreement might stem from different conceptions of what theories are for - scientific explanation versus metaphysical accounting.

  I need to address several layers here. First, the core question about whether this is substantive or verbal disagreement. The term "concrete" is doing crucial work - it's the pivot between physical existence and abstract representation. Even if both sides agreed on all descriptive facts (like mathematical structures), they'd still disagree about whether to call those structures "worlds" in the literal sense Lewis intends. 

  The parsimony dispute reveals deeper methodological rifts. Realists follow Quine's naturalized epistemology where ontological commitments are justified by explanatory power, while actualists maintain a pre-theoretical intuition about what fundamentally exists. This mirrors the mereological composition debate they referenced - both involve clashes over what counts as a "natural" ontological commitment versus what counts as "reality."

  The emotional heat likely comes from perceived implications. Lewis's view makes our world's contingencies feel trivialized (why care about actual suffering when all variants exist?), while actualism might feel like evasion to realists who want modality grounded in reality. Progress might come from metaontological reflection - distinguishing descriptive from prescriptive metaphysics, or examining the success conditions for modal discourse. 

  The analogy to unrestricted composition holds well - both debates turn on whether we privilege practical or theoretical simplicity. But unlike that debate where pragmatic considerations may dominate, here the modal case has stronger claims to explanatory indispensability. The deepest impasse may be that actualists see Lewis as answering an unasked question ("what exists?"), while realists see actualists as refusing to answer the fundamental question ("what makes modal truths true?"). 

  True resolution seems unlikely given these divergent starting points, but recognizing this as a clash of frameworks rather than facts could transform the discussion. The student's group might find value in mapping their disagreement onto Carnap's distinction between internal and external questions, or examining why modal discourse feels so different from other theoretical posits.
answer: |-
  Your analysis is impressively nuanced, and your hypothesis touches on something crucial. This impasse reflects a **deep methodological divergence** about metaphysics itself, not merely a verbal dispute or isolated disagreement about existence. It's substantive because it involves **conflicting criteria for what counts as a satisfactory explanation** and **what metaphysics is obligated to explain**. Here's a diagnosis based on the arguments you've described:

  ### 1. **The Core Disagreement is Metaontological**
     - **Lewisian Realism** adopts a **naturalistic, Quinean methodology**: Ontology is determined by our best total theory's commitments. Possible worlds earn their keep by providing a unified, systematic foundation for modality, counterfactuals, properties, and content. The "incredulous stare" is dismissed as prejudice against unobservables (like electrons or spacetime). Parsimony is judged *theoretically*: Fewer *kinds* of entities (only concrete worlds) are simpler than a patchwork of abstracta (sets, propositions, properties). The *number* of worlds is irrelevant – physics posits vast numbers of particles without complaint.
     - **Actualism** adopts a **foundationalist or commonsense methodology**: Our pre-theoretic understanding of "reality" is anchored in the *actuality* we inhabit. Positing infinitely many concrete duplicates violates this intuition and seems ontologically profligate. Parsimony is judged *intuitively*: Less *stuff* overall (even if more *kinds* like sets or properties) is preferable. Crucially, actualists see their abstract worlds as *representational tools* grounded in *actual* resources (language, concepts, properties). They argue Lewis *reifies* these representations illegitimately.

     **Why it's substantive**: The sides disagree on what *settles* ontological questions. Lewis uses *explanatory power* within a total theory. Actualists use *fidelity to actuality* and *intuitive economy*. This isn't about the meaning of "exists" alone; it's about *how we justify* ontological claims.

  ### 2. **"Concrete" Does Real Work – But Reveals the Deeper Split**
     The word "concrete" isn't merely semantic. It marks the **fundamental rift in explanatory goals**:
     - For Lewis, "concrete" means worlds are *causally isolated, spatiotemporal systems* – ontologically on par with *this* system. This is essential for his reduction of modality: Modal truths are made true by *real, non-actual things*.
     - For Actualists, "concrete" implies a *misplaced concreteness*. They agree we need world-*talk*, but insist the truthmakers must be *abstract entities constructed from actual things*. Calling them "concrete" smuggles in an unacceptable ontology.
     **The crux**: Could both sides agree on every sentence about what there is? **No.** Lewis posits a vast plurality of *spatiotemporal systems*. Actualists posit only one spatiotemporal system (the actual world) plus *abstract representations* (sets, properties, etc.) that *describe* alternatives. The disagreement is about the *categorical nature* of the posits, not just labels.

  ### 3. **The Parsimony Dispute is Symptomatic, Not Solvable by Definition**
     Each side uses "parsimony" correctly *within their own framework*:
     - **Actualists (Quantitative Parsimony)**: Positing infinitely many planets is extravagant, even if they're all "planets." Lewis posits infinitely many *entire universes*.
     - **Realists (Qualitative Parsimony)**: Positing one fundamental kind of thing (concrete worlds) is simpler than positing multiple fundamental kinds (actual concrete world + abstract ersatz worlds + the modal relations/primitives needed to construct them).
     **Why a definition won't solve it**: Parsimony is a *virtue*, not a *decider*. Each side prioritizes a different virtue:
       * Lewis prioritizes *explanatory unity and reduction* (modality reduced to quantification over worlds).
       * Actualists prioritize *ontological modesty relative to actual experience* and avoiding "gratuitous" duplication.
     A formal definition of parsimony would be rejected by one side as missing the point. Lewis would say actualists' "modesty" is illusory because their abstracta presuppose unreduced modality. Actualists would say Lewis's "unity" is achieved at an absurd ontological cost.

  ### 4. **The "Emotional Heat" Stems from Perceived Implications**
     - **Actualist Frustration**: Lewis's view seems to *trivialize actuality*. If all possibilities are equally real, why care about *this* world? Why strive, mourn, or value anything specifically actual? Lewis's "charity" feels like *indifference*.
     - **Realist Frustration**: Actualists seem to engage in *bad faith* or *obscurantism*. They use possible world semantics while denying its literal truth, relying on modal primitives they can't explain. This feels like cheating – enjoying the benefits of realism without the cost.
     This isn't just intellectual; it touches on the *significance* of philosophy. Is metaphysics about grounding our lived experience (Actualism) or discovering the fundamental structure of reality, however counterintuitive (Lewis)?

  ### 5. **Analogy to Unrestricted Mereology: Illuminating Parallels**
     The dispute *is* structurally similar to debates over unrestricted composition (UC): 
     - **Lewis / UC Defender ("Universalist")**: Focuses on theoretical simplicity and systematicity. A single, unrestricted compositional principle is elegant. Denying "table-plus-chair" is arbitrary, requiring unmotivated restrictions. The cost (many strange objects) is justified by explanatory power (a simple mereology).
     - **Actualist / UC Denier ("Restrictivist")**: Focuses on intuition and ontological modesty. Common sense recognizes only "natural" objects. Positing arbitrary fusions like "table-plus-chair" is gratuitous; it doesn't correspond to how we carve up the world. Parsimony counts *objects we recognize as significant*.
     **Diagnostic Value**: This analogy confirms the metaontological split. Both debates hinge on:
       * **Theoretical Virtue vs. Commonsense Fidelity**: Simplicity/systematicity vs. intuitive economy/relevance.
       * **What counts as "gratuitous"**: Is it positing too many *things* (Actualist/Restrictivist), or positing too many *principles* or *kinds* (Realist/Universalist)?
     **Does it favor a side?** No. It reinforces that the disagreement runs deeper than the specific topic (modality/mereology). It's about the *goals and methods* of metaphysics itself.

  ### What Counts as Progress?
  Given this diagnosis, "winning" the debate is unlikely. Progress would mean **shifting the discussion to a meta-level**:
  1. **Acknowledge the Metaontological Divide**: Explicitly recognize that the sides have different criteria for success. Ask: *Should a metaphysical theory primarily aim for systematic explanatory power, even at the cost of counterintuitive ontology, or should it conserve our core intuitions about actuality and existence, even if requiring primitives?*
  2. **Focus on Trade-offs**: Map the costs and benefits *within each framework*:
      - Lewis: Gains a reductive analysis of modality; loses intuitive ontological modesty and risks trivializing actuality.
      - Actualism: Gains ontological modesty regarding concrete reality; loses a reductive analysis (relying on modal primitives or complex constructions).
  3. **Evaluate Explanatory Payoff**: Is Lewis's reduction *so* powerful that it justifies the ontology? Does actualism's avoidance of concrete worlds *genuinely* reduce mystery, or just hide it in modal primitives? Focus on specific applications: e.g., does Lewis's view *better* explain the truth of certain counterfactuals or the nature of properties?
  4. **Consider Alternatives**: Explore views that attempt splits (e.g., Robert Stalnaker's "actualist realism" – abstract worlds representing concrete possibilities, but only one concrete world exists). Do they avoid the costs, or just create new ones?
  5. **Accept Persistent Disagreement**: Recognize that this debate, like many in fundamental metaphysics, may reflect **rationally irresolvable differences in philosophical temperament or starting points**. Progress might be understanding *why* the impasse exists and respecting the genuine motivations on each side, rather than expecting conversion.

  **Honest Conclusion**: It's unlikely your club will reach consensus. The disagreement is substantive, rooted in incompatible visions of metaphysics. The most valuable outcome would be a deeper understanding of *why* these positions seem compelling and intractable to their adherents, moving beyond "stuck debate" to a clearer map of the philosophical landscape. This meta-understanding *is* progress, even without a victor. Lewis and his actualist critics (like Plantinga or Stalnaker) never convinced each other either – but the debate profoundly advanced modal metaphysics by forcing both sides to refine their views. Your club is grappling with a classic, foundational dispute; the frustration is part of the process.
