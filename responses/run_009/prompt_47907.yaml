  First, I need to unpack why they treat Malthus and Ehrlich differently from Hubbert. The user feels Malthus was wrong because the mechanism itself changed—demographic transition turned off the positive checks. Ehrlich's specific timeline failed by decades, and calling him "right about the trend" feels like cheating. Hubbert, though, had an implicit tech assumption that was later modified by fracking. Limits to Growth is tricky because they emphasized trajectory over dates, making it vague. The AI prediction example highlights the tension between open-ended forecasts and falsifiability.

  The user's friend proposed a principle focusing on changed inputs versus unchanged inputs. But as the user points out, both Malthus and Ehrlich saw input changes (tech, demographic shifts), yet they're deemed wrong. So why the difference? I need to identify what's missing. 

  Looking deeper, Malthus's mechanism was fundamentally altered, not just delayed. The demographic transition introduced voluntary fertility control, replacing his positive checks. That's a structural change. Ehrlich's prediction had a specific timeframe that passed without event, and extending it indefinitely removes accountability. Hubbert explicitly assumed fixed technology, so when tech changed, it wasn't a failure of his model's core. Limits to Growth avoided strict dates, but their model's persistent non-crisis could make it unfalsifiable if they keep moving the goalposts. 

  The key distinction might be in whether the prediction specifies a timeframe and whether the underlying causal mechanism remains applicable. Malthus's mechanism became obsolete, making him wrong. Ehrlich's timeframe was specific and missed, so falsified. Hubbert's model had a fixed parameter, so external changes don't refute it. Limits to Growth's vagueness is problematic for falsifiability. For AI, "this century" might be too vague to disconfirm before 2100, risking a Malthusian rescue.

  The user's unspoken need seems to be a desire for a clear, principled way to evaluate long-term predictions that balances flexibility with accountability. They want to avoid both premature dismissal and endless excuses. Their examples show frustration with rescues that feel dishonest. They might also be seeking validation of their nuanced judgments, especially since they've pondered this for a decade.

  Refining the friend's principle: Instead of just changed inputs, consider whether the prediction's core mechanism still operates (Malthus's didn't) and if the timeframe was integral (Ehrlich's was). Also, explicit parameters (Hubbert's tech) versus implicit ones. For the civilization destruction prediction, since it happened (nuclear weapons), it succeeded. Moore's Law failing after a century could be wrong if the exponential mechanism broke, not just delayed.

  So the principles could be: timeframe specificity, mechanism persistence, and parameter fixity. This aligns with the user's verdicts and addresses their examples. It also provides a framework for future predictions, balancing foresight with testability.
answer: |-
  Your struggle with "falsified vs. right but early" is core to evaluating long-term forecasts, and your intuitions reveal a nuanced pattern. Your friend's "changed inputs" principle is insightful but incomplete. Let's refine it using your verdicts:

  ### Your Gut Verdicts & the Missing Principle
  1.  **Malthus (Falsified):** Not just changed inputs. His *mechanism* (population growth inevitably checked by famine/misery) was **structurally invalidated** by the demographic transition. Voluntary fertility control replaced positive checks, breaking the causal chain.
  2.  **Ehrlich (Falsified):** Failed due to changed inputs (tech/institutions). Yet, the *timeframe specificity* matters. A prediction missing its stated window by decades without a clear reason for the delay *within the original model* is falsified. Rescues require explicit justification for the delay, not just "the trend."
  3.  **Hubbert (Not Falsified):** Clear **parameter fixity**. His model *explicitly* assumed static technology/reserves. Fracking changed a parameter *defined* as fixed. The core model (depletion dynamics under fixed tech) wasn't wrong; the world changed.
  4.  **Limits to Growth (Uncomfortable Middle):** Problem is **vagueness**. "Shape, not date" makes disconfirmation nearly impossible. A theory needs *some* observable consequence within a *reasonably bounded* timeframe. "Crisis eventually" without defining *how non-crisis looks* or *max timeframe* risks unfalsifiability.
  5.  **AI Timelines "This Century" (Mixed):** Highlights the **accountability horizon** problem. A prediction with no *possible* disconfirmation before the endpoint (2100) isn't a scientific forecast; it's a belief. It *is* a prospective Malthusian rescue.

  ### The Refined Principle: The Three L's
  A long-run prediction is **falsified** (not "right but early") if **any one** of these is true:
  1.  **Lapsed Mechanism:** The core causal mechanism proposed *no longer operates* or is *structurally invalidated* by unforeseen developments (Malthus's positive checks replaced).
  2.  **Lapsed Timeframe:** The prediction specified a timeframe, that timeframe passed without the event, *and* no compelling, *model-consistent* reason (beyond "wait longer") explains the delay (Ehrlich's 1970s/80s famines).
  3.  **Lack of Falsifiability:** The prediction lacks defined conditions for disconfirmation within any practically observable horizon ("Transformative AI sometime" pre-2100, vague "crisis eventually").

  **When is it "Right but Early"?**
  *   When the core mechanism *remains valid and operative*.
  *   When the timeframe was *explicitly probabilistic or conditional* (e.g., "Peak oil likely between 1965-75 *assuming no major tech shifts*").
  *   When a clearly defined *fixed parameter* in the model changed (Hubbert's tech assumption).
  *   When the delay is *explained by model-consistent factors* (e.g., a predicted recession delayed by unprecedented stimulus, *if* the model included stimulus effects).

  ### Applying the Refined Principle to Your Verdicts
  *   **Malthus:** **Falsified (Lapsed Mechanism).** Demographic transition destroyed the core mechanism.
  *   **Ehrlich:** **Falsified (Lapsed Timeframe).** Specific window passed; "better tech" isn't a compelling *model-consistent* delay justification (his model downplayed tech elasticity).
  *   **Hubbert:** **Not Falsified (Parameter Change).** Tech was a fixed parameter; changing it doesn't refute the depletion model under fixed tech.
  *   **Limits to Growth:** **Flirts with Lack of Falsifiability.** "Shape not date" is problematic. Their *persistent warnings of "imminent" crisis* despite passing earlier inflection points *without crisis* leans towards needing an update or admitting weakened predictive power. Not fully falsified yet, but credibility erodes without clearer disconfirmation criteria.
  *   **AI "This Century":** **Lacks Falsifiability (pre-2100).** Not a disconfirmable forecast until 2101. It's a belief statement.

  ### Your New Cases
  1.  **"Eventually a single power can destroy civilization in a day" (Predicted 1910):**
      *   **Successful Forecast (under the principle).** The core mechanism (exponential growth of destructive power) remained valid. The timeframe ("eventually") was open-ended but *conceptually bounded* by technological possibility. The event (nuclear weapons) occurred within a historically plausible timeframe (35 years), demonstrating the mechanism's validity. It didn't rely on fixed parameters that changed fundamentally.

  2.  **Moore's-Law-Style Exponential that Fails After a Century:**
      *   **Likely Falsified (Lapsed Mechanism or Lapsed Implicit Timeframe).** Moore's Law isn't a physical law; it's an observation about semiconductor scaling. If scaling stops *permanently* due to fundamental physical limits (e.g., atomic scale), the *mechanism* driving the exponential (ability to shrink transistors) has lapsed. Even if phrased as "exponential growth forever," the *implicit timeframe* of "as long as current tech paradigm holds" has lapsed after a century of failure. "Wait longer" isn't sufficient if the underlying driver is broken. (Contrast: A temporary plateau due to economic factors might justify "delayed," not "falsified").

  ### Conclusion
  Your intuitions are consistent: **Mechanism persistence, timeframe accountability, and falsifiability are key.** Drop the idea that *any* changed input automatically rescues a prediction. Focus on whether the change *invalidates the core causal driver* (Malthus), whether a *specific deadline was missed without justification* (Ehrlich), or whether the prediction *defines its terms clearly enough to be proven wrong* (AI "this century"). Hubbert succeeds because he defined his fixed parameters. The "Three L's" (Lapsed Mechanism, Lapsed Timeframe, Lack of Falsifiability) capture your judgments and provide a clearer framework for evaluating doomsday forecasts, long-term trends, and the ever-present temptation of the "right but early" rescue.
