  The user mentions several real cases: a youth chess club, esports league, dance-fitness studio, pigeon-racing society, marching band, and parkour collective. The assessors disagreed on most, causing problems. The user needs a method that’s practical, usable by non-philosophers, and produces plain-language rationales for appeals. They also want it to handle borderline cases and identify when decisions should go to the committee.

  Wittgenstein's family resemblance idea is key here. Instead of a strict definition, it uses overlapping features. The challenge is turning this into a step-by-step checklist. The procedure needs questions that cover various aspects like physical activity, competition, rules, structure, etc. Each question should have clear criteria for passing or failing, and the overall outcome should be a balance of these features. The user also wants to know when it's a values call versus classification.

  For the cases, the user admits bias: they want to fund the chess club for social reasons but not esports. The procedure must override personal preferences if necessary. Testing it on table tennis, chess, and esports will show how it works in practice. Table tennis should pass easily. Chess might fail because it lacks physical exertion, even if the user wants to fund it. Esports could be borderline or fail depending on physical activity intensity. This demonstrates the procedure's objectivity.

  The limitations part is crucial. The procedure can't handle cases where features are equally balanced or when applicants mimic criteria without genuine substance. The user needs to recognize when an application is "gaming" the checklist, like a chess club claiming "mental exertion" counts as physical. Also, decisions based on community impact rather than classification should go to the committee.

  The user's deeper needs include reducing disputes, maintaining credibility with the council, and ensuring fair, consistent decisions. They might also want to protect the program from criticism and avoid personal liability in appeals. The procedure should empower assessors with clear guidelines, making the process transparent and defensible. Highlighting where values take over helps the user delegate appropriately, maintaining the program's integrity while involving the committee for policy-level decisions.
answer: |-
  Here's a decision procedure based on Wittgenstein's family resemblance concept, designed for practical use by your assessors, complete with rationales and tested against your cases:

  **The Family Resemblance Sport & Physical Activity Assessment Procedure**

  **Instructions for Assessors:**
  1.  **Work Independently:** Each assessor runs the checklist alone.
  2.  **Answer Questions Sequentially:** Go through questions 1-7 in order.
  3.  **Score Each Question:** Answer "Yes," "No," or "Unclear/Borderline" based solely on the application materials.
  4.  **Apply Thresholds:** Use the scoring guide *after* answering all questions.
  5.  **Document Rationale:** For each "Yes/No" question, note the *specific evidence* from the application supporting the answer. For "Unclear," note why. The final rationale *must* reference these specific points.
  6.  **Flag Values Decisions:** If the procedure terminates at Step 6, flag it clearly for the committee.

  **The Checklist Questions:**

  1.  **Primary Physical Exertion Focus:** Does the core activity described primarily require sustained, voluntary physical exertion of the body (beyond minimal daily movement) as a central, necessary element? *(e.g., running, jumping, swimming, striking, lifting, coordinated movement sequences. Excludes incidental movement like moving chess pieces, clicking a mouse, or casual walking between holes in golf if not the focus).*
      *   *Sufficient Answer:* "Yes" requires clear description of significant bodily movement as core to participation. "No" if exertion is minimal, incidental, or primarily mental/sedentary. "Unclear" if description of physical demands is vague or contested (e.g., pigeon racing handlers, precision dance elements).

  2.  **Develops Physical Skill/Ability:** Does the activity demonstrably develop, refine, or rely upon participants' physical skills, attributes, or coordination? (e.g., strength, endurance, speed, agility, balance, hand-eye coordination, specific movement techniques).
      *   *Sufficient Answer:* "Yes" requires description of skills taught or required. "No" if skills are primarily cognitive, digital, artistic (non-physical), or animal-based. "Unclear" if physical skill development is claimed but not clearly evidenced (e.g., marching band posture/breath control vs. musical skill).

  3.  **Structured Rules/Guidelines:** Is the activity governed by a defined set of rules, guidelines, or structures that shape participation and outcomes? (e.g., scoring systems, time limits, boundaries, specific techniques, safety protocols).
      *   *Sufficient Answer:* "Yes" requires identifiable rules (formal or informal). "No" only if completely free-form with no structure (rare). "Unclear" if rules exist but are highly informal or ambiguous.

  4.  **Competitive Element (Formal or Informal):** Does the activity inherently involve, or is it frequently structured around, competition? This can be against others, a standard (e.g., time/distance), or oneself (improvement). (Includes organized leagues, tournaments, races, and informal "friendly" competition).
      *   *Sufficient Answer:* "Yes" if competition is a common or core aspect (even if not always present). "No" if purely non-competitive, cooperative, or recreational without any comparative element. "Unclear" if competition is possible but not described as a significant component.

  5.  **Organizational Structure:** Is the applicant a formally or informally organized group providing access/opportunity? (e.g., club, league, studio, collective with membership, schedules, leadership).
      *   *Sufficient Answer:* "Yes" requires basic organization beyond individual participation. "No" only if funding an individual or completely ad-hoc group. "Unclear" if structure is minimal/ambiguous.

  6.  **Primary Purpose is Activity Participation:** Is the core purpose of the organization and the funded activity to facilitate participation in the described activity itself? (Excludes activities primarily serving another purpose: therapy, religious ritual, artistic performance *for an audience*, academic study, professional training in a non-sport field).
      *   *Sufficient Answer:* "Yes" if participation *is* the primary goal. "No" if the activity is primarily a means to a different end (e.g., drama club performing a play, professional orchestra, vocational training). "Unclear" if purpose is dual or ambiguous (e.g., therapeutic riding program).

  7.  **Community Focus:** Does the organization explicitly aim to serve residents of our city through access, participation, or events? (This is usually required by your program mandate).
      *   *Sufficient Answer:* "Yes" requires evidence of local focus (membership base, location, outreach). "No" if demonstrably regional/national without local engagement. "Unclear" if scope is poorly defined.

  **Scoring Guide & Decision Procedure:**

  1.  **Automatic Exclusion ("No"):**
      *   **Q7 (Community Focus) = No:** *Rationale: "Application fails the fundamental requirement of serving the local community as evidenced by [lack of local members/events/location]."*
      *   **Q6 (Primary Purpose) = No:** *Rationale: "The core purpose, as described in the application [cite description], is primarily [e.g., artistic performance, therapy, academic], not community participation in the activity itself."*

  2.  **Strong Candidate ("Yes"):** **Q1 (Physical Exertion) = Yes** AND at least **4 out of Questions 2, 3, 4, 5 = Yes**.
      *   *Rationale: "The application clearly describes an activity centered on significant physical exertion ([describe activity]). It also demonstrates strong family resemblance to sport/physical activity through [list the specific 'Yes' features from Q2-5 met, e.g., skill development, structured rules, competition, organizational structure]."*

  3.  **Borderline Candidate (Assessors Confer/Committee):** **Q1 (Physical Exertion) = Unclear** OR **Q1 = No** but **at least 4 out of Questions 2, 3, 4, 5, 6 = Yes** OR **Q1 = Yes** but **only 3 out of Questions 2, 3, 4, 5 = Yes**.
      *   *Rationale: "The application presents a borderline case. [Explain specific ambiguities, e.g., 'The physical exertion involved in [activity] is not clearly sufficient as the core element,' OR 'While lacking significant physical exertion, the activity demonstrates many sport-like features: [list strong 'Yes' features from Q2-6].'] This requires a policy decision on whether such activities fall within the intended scope of 'community sport and physical activity.'"* **OUTPUT: Refer to Committee with rationale.**

  4.  **Clear Exclusion ("No"):** Does not meet criteria for Strong or Borderline (i.e., Q1=No AND fewer than 4 of Q2-6=Yes).
      *   *Rationale: "The application describes an activity ([activity name]) where significant physical exertion is not a core element [cite evidence]. It also lacks sufficient family resemblance features, meeting only [number] of the following: skill development, structured rules, competitive element, organizational structure, primary purpose of participation. Specifically, [note key 'No' answers and evidence]."*

  **Testing the Procedure on Your Cases**

  **Case 1: Longstanding Regional Table-Tennis League**
  *   Q1 (Physical Exertion): **Yes.** (Rapid movement, reflexes, stamina required).
  *   Q2 (Develops Physical Skill): **Yes.** (Hand-eye coordination, footwork, reaction time).
  *   Q3 (Structured Rules): **Yes.** (Formal rules of table tennis).
  *   Q4 (Competitive Element): **Yes.** (League structure implies competition).
  *   Q5 (Organizational Structure): **Yes.** (League implies structure).
  *   Q6 (Primary Purpose): **Yes.** (Facilitates table tennis play).
  *   Q7 (Community Focus): **Yes.** (Assumed regional includes city, local venues/members).
  *   **Score:** Q1=Yes. 5/5 of Q2-6=Yes. **OUTCOME: Strong Candidate (Fund).**
  *   **Rationale:** "Table tennis clearly requires significant physical exertion through rapid movement, reflexes, and coordination. It strongly resembles sport through its development of physical skills (hand-eye, footwork), formal rules, inherent competitive league structure, clear organizational form, and primary purpose of participation."

  **Case 2: Youth Chess Club (Applying 3rd Time)**
  *   Q1 (Physical Exertion): **No.** (Core activity is cognitive. Moving pieces is incidental, minimal exertion).
  *   Q2 (Develops Physical Skill): **No.** (Develops cognitive skills, not physical attributes/coordination).
  *   Q3 (Structured Rules): **Yes.** (Formal rules of chess).
  *   Q4 (Competitive Element): **Yes.** (Tournaments/matches are core).
  *   Q5 (Organizational Structure): **Yes.** (Implied by "club").
  *   Q6 (Primary Purpose): **Yes.** (Facilitates chess play).
  *   Q7 (Community Focus): **Yes.** (Youth in low-income neighborhood - serves community).
  *   **Score:** Q1=No. Only 3/5 of Q2-6=Yes (Q3, Q4, Q5). **OUTCOME: Clear Exclusion (Do Not Fund).**
  *   **Rationale:** "Chess is primarily a cognitive activity. Moving pieces involves minimal physical exertion that is not central to the activity. While it features structured rules, competition, and organization, it does not develop physical skills or have physical exertion as a core element. It lacks sufficient family resemblance features to be classified as 'sport or physical activity' under this procedure." **This overrides your preference.** *Why it's right:* The procedure correctly identifies the lack of the core physical element, preventing mission creep into funding purely mental games based on social value alone. Funding chess requires an explicit policy change, not redefinition.

  **Case 3: Esports League (Renting Computer Lab)**
  *   Q1 (Physical Exertion): **No.** (Core activity is cognitive/strategic. Mouse/keyboard/controller use involves fine motor skills but not sustained whole-body exertion central to sport/physical activity. Comparable to office work).
  *   Q2 (Develops Physical Skill): **Unclear/Borderline.** (Develops fine motor skills (reaction time, dexterity) but arguably not *physical* skills in the athletic sense (strength, endurance, gross coordination). Highly contested).
  *   Q3 (Structured Rules): **Yes.** (Game-specific rules, league rules).
  *   Q4 (Competitive Element): **Yes.** (Inherent in "league").
  *   Q5 (Organizational Structure): **Yes.** (League implies structure).
  *   Q6 (Primary Purpose): **Yes.** (Facilitates esports participation).
  *   Q7 (Community Focus): **Yes.** (Renting local community center, serving local players).
  *   **Score:** Q1=No. Q2=Unclear. 3 definite "Yes" (Q3, Q4, Q5) + Q6=Yes + Q2=Unclear. **4/5 of Q2-6 = Yes/Unclear.** **OUTCOME: Borderline Candidate (Refer to Committee).**
  *   **Rationale:** "Esports lacks significant sustained physical exertion as a core element; the activity is primarily cognitive/strategic with fine motor control. However, it strongly features structured rules, competition, organizational structure, and the primary purpose is participation. The development of fine motor skills is a borderline physical attribute in this context. Whether competitive video gaming constitutes 'physical activity' for the purpose of this grants program is a policy question requiring committee decision based on the program's intended scope and values." **This aligns with your initial reluctance but forces the values decision to the committee.**

  **What the Procedure CANNOT Do (Limitations & Gaming):**

  1.  **Define "Blurred Boundaries" for You:** It provides structure, but doesn't eliminate borderline cases (like esports). It flags them for the committee where the *values* question ("*Should* this count?") supersedes the *classification* question ("*Does* this fit?").
  2.  **Resolve Equivocal Evidence:** If an application vaguely describes physical demands (e.g., "strategic physicality" in chess), the assessor must make a judgment call ("Unclear") based on plausibility. Documentation is key.
  3.  **Override Core Definitions:** It cannot make an activity with *no* physical exertion (Q1=No) and weak resemblance (e.g., only 1-2 other Yeses) qualify. The physical element is weighted heavily as a common, central thread.
  4.  **Detect All Gaming Instantly:** Clever applicants might try to mimic features:
      *   **Redefining "Physical":** Claiming intense mental focus is "physical exertion" or stretching "fine motor skills" to cover non-athletic activities (e.g., competitive knitting claiming Q1/Q2). **Detection:** Assessors must rigorously apply Q1 - is *sustained bodily exertion* central? Does the skill resemble athletic skills (Q2)?
      *   **Surface Structure:** Creating a "league" and "rules" for an otherwise non-qualifying activity (e.g., Competitive Stamp Collecting League). **Detection:** Q1 and Q2 will likely still be "No". The core activity fails before structure helps.
      *   **"Physical Activity" Adjacency:** Framing a primarily social/arts activity as exercise (e.g., "Theatrical Movement Troupe" emphasizing warm-ups over performance). **Detection:** Q6 is crucial. Is participation in the *physical activity* the primary purpose, or is it a means to an artistic end? Scrutinize actual time/emphasis described.
  5.  **Incorporate External Values:** It cannot factor in neighborhood need (like the chess club's low-income youth) or perceived societal benefit unless those values are explicitly written into the policy's definition or purpose. The procedure focuses on classifying the *activity* and *organization*. Social impact is a separate committee decision *after* classification, or needs to be a formal criterion added to the policy.

  **How You'll Know It's Gamed:** Look for mismatches between the claimed features and the *core reality* of the activity described. Does the description of the "physical exertion" sound implausible or incidental? Does the "skill development" seem unrelated to athleticism? Is the "structure" clearly just a veneer? Does the "primary purpose" seem misrepresented? Assessors should flag applications where the answers feel forced or contradictory to the overall description. Consistency across reviewers using the same checklist is also a guardrail.

  **Conclusion:** This procedure replaces subjective, hidden tests with a transparent, multi-factor assessment based on the shared characteristics of recognized sports and physical activities. It provides clear rationales, flags borderline cases for policy decisions, and minimizes arbitrary outcomes. While it won't eliminate all appeals, it provides a defensible, consistent framework that separates classification from values-based funding decisions. It forces the tough calls (like chess vs. esports) into the open where the elected committee, not your assessors, must own them based on the program's intended purpose. The "unliked" chess outcome demonstrates its strength in preventing mission drift based on worthy but non-core criteria.
