prompt: |-
  I'm a novelist working on a book where one of the recurring characters is a blowhard pundit who leans hard on the phrase "Western values" in arguments, and I've been transcribing real debates and op-eds to get his voice right. Somewhere in that swamp I noticed a pattern I don't have a word for, and it's honestly become more interesting than the character. The same people will treat the West as a moral success story — the West gave us democracy, human rights, abolition, religious tolerance — and then, the moment someone mentions the Crusades or the Atlantic slave trade or colonialism or the Inquisition, those get carved out as somehow *not* expressions of the tradition: betrayals of it, failures to live up to it, aberrations. But ancient Greece, Roman law, medieval canon lawyers, the Reformation — those all count, they're constantly recruited as ancestors. The category's membership quietly shrinks and grows depending on what the argument needs at that moment, and the weird thing is that no individual move looks like a lie. Each exclusion, each inclusion, is locally defensible. It's the *accumulation* that's doing the rhetorical work.

  It's sort of adjacent to no-true-Scotsman, I think, but that's usually one debater making a defensive retreat under pressure from a counterexample, and here it's more like the category itself comes pre-loaded with the move — everybody in the debate, on all sides, inherits it. And it's not quite motte-and-bailey either, because the flattering version and the disowning version aren't a defensible core plus an indefensible extension; they're both contestable historical theses about the same sprawling thing. It might be something like a persuasive definition but stretched out over centuries of history and done by a whole culture rather than one arguer. Also, importantly, I've noticed the mirror-image version: people who define the West as *essentially* racist and colonial, so that everything good gets explained away as accidental or borrowed. Same machinery, opposite valence.

  So — you're a professional philosopher with a specialty in how political concepts get used in argument. Please think carefully about this before answering, maybe brainstorm the nearest candidate concepts first. Is there an established name for this exact configuration, where a contested historical category's membership gets silently adjusted so the category can function as a premise rather than a conclusion? If yes, tell me what it is, who's discussed it, and how the established concept maps onto what I described (and where my description oversimplifies). If nothing established fits cleanly, say so plainly and coin a term — give me a definition sharp enough that I can tell whether, say, the way people argue about "Judeo-Christian values" or "the Islamic world" or "African culture" counts as the same phenomenon or just a cousin of it. I want the carve, not just a label: what the phenomenon is, what it isn't, and where the edges get blurry. A bare "that's no-true-Scotsman" would definitly be underselling it and I'll know.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist working on a character who's a pundit fixated on "Western values," and they've noticed a rhetorical pattern where the definition of "the West" shifts to include or exclude historical events based on the argument's needs. The user wants to know if there's a term for this or if we need to coin one.

  First, I need to understand the core issue. The user describes how positive elements like democracy and human rights are claimed as inherent to Western tradition, while negative aspects like colonialism or the slave trade are framed as aberrations. This selective inclusion/exclusion isn't done through explicit lies but through defensible moves that only show inconsistency when accumulated. The mirror image—defining the West as inherently oppressive—uses the same mechanism.

  I recall several philosophical concepts. No-true-Scotsman came to mind initially, but as the user pointed out, that's usually a defensive move by one person, not a cultural pattern. Motte-and-bailey involves swapping between a defensible and less defensible position, but here both versions are contestable theses about the same category. 

  Then there's teleological essentialism—defining something by its supposed end goal. This fits because the West is seen as progressing toward values like democracy, making past deviations seem like anomalies. But the user notes that both sides do this, not just the positive one. 

  Whig history might be relevant too, viewing history as a march toward progress, but it doesn't capture the selective inclusion aspect. Persuasive definitions are about redefining terms to win arguments, which is part of it, but the scale here is broader, involving centuries of history and cultural narratives.

  Conceptual bracket-shifting seems like a possibility. This is when categories expand or contract contextually. But is there a specific term for historical categories? Ontological gerrymandering from sociology refers to boundary-shifting in social problems theory, but it's more about problem definition than historical identity. 

  After reviewing these, I realize there isn't a perfect existing term. The closest might be teleological essentialism combined with conceptual bracket-shifting. But the phenomenon also involves collective narrative-building, where a culture curates its historical identity. 

  The user needs a precise carve—what this phenomenon is and isn. They mentioned examples like "Judeo-Christian values" or "African culture," so the term should apply across such categories. The key elements are: selective historical recruitment, narrative-based curation, and both positive/negative valences. 

  Coining a term like "Teleological Curation" makes sense. It emphasizes the purpose-driven selection (teleological) and the active management of historical elements (curation). This distinguishes it from essentialism by focusing on the dynamic process rather than static traits. 

  I should also note the mirror-image usage, where the same mechanism paints the category negatively. This shows it's not about the valuation but the selective process. The boundaries get blurry when dealing with cultural transmission versus diffusion, and when events have ambiguous origins. 

  Finally, the user's deeper need might be understanding this mechanism to critique it through their character or explore it in their work. Providing a sharp definition helps them identify and analyze the pattern in various contexts, enriching their novel's themes.
answer: |-
  You've described a profound and pervasive phenomenon with surgical precision. After mapping your description against relevant concepts in philosophy of history, conceptual ethics, and rhetoric, I can confirm: **There is no single established term capturing this exact configuration.** The existing toolkit comes close but undersells the historical curation and collective narrative engineering you're observing. Here's the breakdown and a proposed neologism:

  ### Near Misses & Why They Don't Fit Perfectly
  1.  **Teleological Essentialism:**
      *   *What it is:* Defining an entity (like "the West") by its perceived inherent purpose or end goal (e.g., "progress towards liberty/democracy"). Past events are judged as "true" or "false" to this essence.
      *   *Mapping/Shortfall:* Explains *why* Crusades/slavery get excluded (they don't serve the telos) and Athens/Reformation included (they do). **BUT:** It focuses on the *essence*, not the *practical mechanism of selective historical recruitment* and the *silent boundary shifts* you noted. It also doesn't inherently capture the mirror-image negative version.

  2.  **Conceptual Bracket-Shifting / Boundary Work (Sociology of Knowledge):**
      *   *What it is:* The contextual expansion/contraction of category boundaries to serve interests (e.g., defining "science").
      *   *Mapping/Shortfall:* Directly addresses the "silent adjustment" of membership. **BUT:** It's a broad term for any category manipulation, not specific to *historical narratives used as foundational premises*. Lacks the essentialist/"true tradition" dimension.

  3.  **Ontological Gerrymandering (Woolgar & Pawluch):**
      *   *What it is:* Selectively defining the boundaries of social problems to make claims seem plausible while avoiding counterexamples.
      *   *Mapping/Shortfall:* Captures the strategic inclusion/exclusion. **BUT:** Primarily used in social problems theory, not grand historical narratives. Focuses on problem definition, not identity/tradition construction.

  4.  **Whig History (Butterfield):**
      *   *What it is:* Present-centric history portraying the past as an inevitable march towards present (liberal, progressive) values.
      *   *Mapping/Shortfall:* Explains the *selective valorization* of ancestors aligning with modern values. **BUT:** Doesn't explicitly address the *exclusion mechanism* for "bad" events or the *argumentative function* as a premise. It's more a historiographic bias than a rhetorical device per se.

  5.  **Motte-and-Bailey / No-True-Scotsman:**
      *   *As you noted:* These are tactical moves by *individual arguers* under pressure. Your phenomenon is a *pre-existing, culturally embedded structure* enabling those moves. The category itself comes with the escape hatch pre-installed.

  ### The Coinage: Teleological Curation
  **Definition:** The rhetorical and narrative practice whereby a contested, historically complex collective identity (e.g., "the West," "Judeo-Christian values") is dynamically defined through the selective recruitment and exclusion of historical events, figures, and ideas. This curation serves to present the identity as possessing an inherent, stable essence (positive or negative), thereby allowing it to function as an uncontested *premise* in argumentation rather than as a *conclusion* requiring historical justification. The inclusions/exclusions are locally defensible through appeals to context, "true spirit," betrayal, or diffusion, but the cumulative effect is a managed historical ontology designed for argumentative utility.

  ### Applying the Carve: What It Is, What It Isn't, and Blurred Edges
  *   **What it IS:**
      *   Applies to **collective identities** claimed across significant historical time (centuries/millennia).
      *   Relies on a **claimed essence** (e.g., "rational," "liberal," "oppressive," "spiritual") as the selection criterion.
      *   **Silently adjusts boundaries:** Membership isn't fixed; it expands/contracts based on the argumentative need *at that moment* (e.g., Greece = foundational West for democracy; Ottoman religious tolerance = irrelevant to "Western" tolerance).
      *   **Premise Function:** The curated identity is presented as *given*, bypassing the need to wrestle with its complex, contradictory history when used as support ("Because of Western values...", "The inherently colonial nature of the West means...").
      *   **Valence-Neutral Mechanism:** Works identically for positive ("tradition of liberty") and negative ("tradition of oppression") essentialisms.
      *   **Local Defensibility:** Each inclusion/exclusion can be argued (e.g., "Slavery was an economic system, not a *core value*"; "The Enlightenment *truly* discovered universal rights").

  *   **What it ISN'T:**
      *   **Simple cherry-picking:** It's not just listing good/bad facts. It's *structuring the ontology of the tradition itself* – deciding what *counts as part of it* for the purpose of defining its essence.
      *   **Pure myth-making:** It uses real historical elements but curates their relationship to the claimed essence.
      *   **A single fallacy:** It's a systemic practice enabling various fallacies (essentialism, special pleading, suppressed evidence) but transcends any one.
      *   **Necessarily conscious/dishonest:** Participants often internalize the curated narrative sincerely. The "silent" aspect is key.
      *   **Limited to "the West":** The *mechanism* applies wherever contested historical identities are used as argumentative premises.

  *   **Blurred Edges / Cousins:**
      *   **"Judeo-Christian Values":** **Classic Teleological Curation.** Selectively draws from Hebrew prophets, Jesus's ethics, Reformation ideas, ignores conquests, inquisitions, sectarian violence, or how "Judeo" is often functionally "Christian." Used as a stable premise for moral/political claims.
      *   **"The Islamic World":** **Often Teleological Curation.** Can be curated as essentially "tolerant/advanced" (recruiting Al-Andalus, Golden Age science) or essentially "backward/oppressive" (focusing on caliphates, fundamentalism), excluding inconvenient counter-evidence to maintain the essence-as-premise.
      *   **"African Culture":** **Cousin, but blurrier.** Often faces external curation (by outsiders) using similar mechanisms (either "noble savage" unity or "tribal chaos" essence). Internal debates about pan-African identity can *involve* curation but are often more explicitly *constructive* rather than presupposing a discovered essence. The sheer diversity makes a monolithic "essence" harder to presuppose silently *within* arguments, though it happens ("African values" vs. "Western individualism").
      *   **"Scientific Method":** **Close Cousin (Conceptual Bracket-Shifting).** Boundaries are shifted to include successful cases as "true science" and exclude pseudoscience/failures. It shares the boundary management for argumentative authority but usually lacks the deep *historical identity* component and the positive/negative essence duality. It's more about demarcation than identity-building.
      *   **Legitimate Historical Interpretation vs. Curation:** Historians *always* select and emphasize. The line blurs when the selection is primarily driven by the *need to maintain a specific, stable essence for contemporary argumentative leverage*, rather than grappling with historical complexity on its own terms. Does the interpretation *serve the premise*, or is the premise *informed by* the interpretation?

  ### Why "Teleological Curation" Fits Your Need
  1.  **Teleological:** Points to the core driver – defining the identity by its perceived purpose/end-state (liberty, oppression, etc.), which justifies the selection.
  2.  **Curation:** Emphasizes the active, ongoing process of selection, framing, inclusion, and exclusion from the vast historical record. It highlights the *management* of the tradition's perceived contents.
  3.  **Captures the Mechanism:** It names the *process* you identified: the dynamic adjustment of membership to preserve the useful essence.
  4.  **Valence-Neutral:** Works for both the blowhard pundit *and* their mirror-image critic.
  5.  **Highlights the Premise Function:** Implicitly points to why this is done – to have a stable foundation ("the West is X") to build arguments upon without constant historical re-litigation.
  6.  **Sharp Enough:** You can ask: "Is this contested historical identity being managed (curated) to maintain a specific essence (teleology) so it can be used as an argumentative starting point (premise) rather than a complex subject of debate?" If yes, it's Teleological Curation.

  This phenomenon is the intellectual equivalent of pruning a family tree: keeping the illustrious ancestors prominently displayed on the mantle while quietly boxing up the inconvenient relations in the attic, all to maintain a flattering (or damning) portrait of the family "character" that can be confidently invoked whenever needed. Your blowhard pundit isn't just spouting hot air; he's performing deep cultural curation. "Teleological Curation" gives you the precise tool to dissect it, both for his character and the far more fascinating pattern you've uncovered beneath him.
