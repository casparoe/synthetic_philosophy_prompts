prompt: |-
  I'm taking an introductory course on philosophy of language, and we just covered the sorites paradox: one grain of sand is not a heap, and adding a single grain to something that is not a heap cannot turn it into a heap, so by iterating we conclude that a million grains are not a heap. When I described this to a friend who is a math major, he waved it off as old news. The sorites, he said, is just Zeno's paradox in a different costume. Achilles never catches the tortoise because each step covers only a fraction of the remaining gap, and people wrongly treat an infinite sum of positive quantities as never completing anything; similarly, adding a single grain never makes a heap because people wrongly treat an accumulation of negligible increments as never producing a qualitative change. Since Zeno was dissolved once mathematics caught up — convergent series show that the runner really does catch the tortoise — the sorites should likewise dissolve once we stop being confused about how small differences accumulate. From there he drew a stronger conclusion: the whole problem of vagueness is basically a mathematical blind spot afflicting philosophers who never learned calculus, and claims that there is no fact of the matter about heaps are embarrassing. My course instructor hinted that the analogy is bad but did not elaborate, and the readings jumped straight to formal semantics, which presupposed exactly what my friend was denying.

  Could you take on the role of a professional philosopher specializing in logic and the philosophy of language, and audit this analogy properly? Please begin with some careful brainstorming rather than jumping to a verdict, and then give me an explicit correspondence table: what in the Zeno story is supposed to play the role of the grain additions, the heap, the tolerance premise (that a single grain cannot make the relevant difference), and the paradoxical conclusion. Then lay out the disanalogies, and — this is the part I care about most — separate the disanalogies that actually matter for my friend's dismissive conclusion from the ones that are merely incidental. In particular, I would like you to address two specific questions. First, does the sorites involve anything like an actual infinity at all, or is the number of steps finite and the trouble somewhere else? Second, is the tolerance premise a claim about sums failing to converge, or is it about something else entirely, such as our inability to detect or care about tiny differences between adjacent cases?

  Finally, tell me whether my friend's conclusion — that vagueness is a pseudo-problem cured by mathematical sophistication — survives once the disanalogies are on the table, or whether the analogy was quietly carrying it the whole time. If any weaker claim does survive (for instance, something about both paradoxes trading on iterating a step that seems individually harmless), say so precisely. And if there is a better analogy available for what is really going on in the sorites, propose one and note what it gets right that the Zeno mapping gets wrong.
