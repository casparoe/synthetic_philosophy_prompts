prompt: |-
  I'm a retired chemist -- thirty-some years in materials science at a national lab -- and since retiring I've been making up for never taking a philosophy course by working through the classics and a lot of pop-philosophy stuff. My daughter gave me a book (she can't remember the title, some general audience thing on morality and science) with a chapter arguing that science can never tell us what to value. I've been turning its argument over for a week and I can't tell whether it's fair or whether it's mushing different ideas together, so I'd like your help auditing it.

  As best I can reconstruct it, the chapter's summary goes like this: Hume observed that moralists routinely slide, without any justification, from statements about what is the case to statements about what ought to be the case, and this gap between facts and values came to be known as the naturalistic fallacy. Later, G.E. Moore sharpened the point with his open question argument, which showed that any attempt to define good in natural terms (like pleasant, or what people desire) is circular, and this proved ethical naturalism false. So morality is a matter of feeling rather than fact, and anyone trying to ground ethics in evolutionary biology or neuroscience is committing a simple logical error that got refuted centuries ago.

  The reason I ask is that my instinct, after a career in science, is that moral questions are messy human phenomena like everything else we've eventually gotten traction on, so I'm inclined to beleeve the book is overreaching somewhere -- but I genuinely don't know where. Could you go through the summary claim by claim and tell me what's accurate, what's a simplification, and what's just wrong? Some specific things I'd like addressed: Is the is-ought gap actually the same thing as the naturalistic fallacy, or did the author fuse two distinct objections from two different philosophers into one? Is the open question argument really a proof that ethical naturalism is false -- the tone of settled-refutation made me suspicious, since in my field we learned to distrust anyone claiming a question was closed in 1739 or 1903. And does the conclusion that a science of morality is hopeless actually follow from whatever is right in the summary, or is a standard objection being presented as a knockout? One more thing: if Moore really thought good can't be defined in natural terms, does that even land you at morality-is-just-feelings, or is that a further step somebody would have to argue for?

  Also -- and I know this sounds funny coming from someone who spent his life in a lab -- I've gathered that Hume's famous ought passage is actually a short aside in a bigger argument about why morality isn't derived from reason alone, and people argue about how much of a full-blown argument it was meant to be. If that's right, does it matter for the book's use of it?

  Please write your answer in American English, and don't worry about being gentle -- I'd rather know the book is sloppy than keep my warm feelings about it.
