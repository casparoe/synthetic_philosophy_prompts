prompt: |-
  I teach an introductory ethics seminar for non-philosophy majors — 18 students, one 75-minute session. Design a role-play that puts the moral status of video-game characters in front of them as something that happens to them, not as a debate topic they weigh in on. The design should exploit a specific psychological fact: our sympathy for a character engages through the same channels it uses for animals and people — responsiveness, apparent goals, expressed distress — and then switches off the moment we're told the character is scripted, without our ever articulating what exactly changed. I want the students to catch themselves making that switch, and then to have to say whether it tracks a real moral difference (the absence of experience) or a socially licensed excuse for treating the character however they wanted to anyway.

  Constraints: roughly a third of the class should play the characters, each operating from a short card I can hand them — a fixed set of goals and reactions they must stay inside no matter what the other students do. The rest are players whose objectives make exploiting the characters the path of least resistance, and who hold one extra power: the ability to reset a scene so that a character forgets what was done to it. No real stakes or money. Nothing should be labeled as being about video games before or during the activity — frame it however you like (a customer-service simulation, a study with research participants, something else entirely) and let the reveal in the debrief do the work. That debrief should connect particular moments in the role-play to particular parts of the philosophical question: which features of the characters the players actually responded to, what the reset mechanic did to their sense of what they owed the characters, and where the analogy to animals, infants, or people with severe cognitive impairments strengthens the case and where it breaks. Close by forcing the comparison the students will want to avoid: we have no direct access to experience in anyone but ourselves, so what is the difference between a perfectly scripted character and a behaviorally identical but sentient being — and is "it's just code" an answer or merely an assertion?

  Finally, tell me what is most likely to go sideways on a first run and how I should handle it, and be explicit about which part of the question the activity cannot reproduce no matter how well it runs — what I will have to assert in the debrief rather than show.
reasoning: |-
  We are designing a role-play activity for an ethics seminar. The goal is to have students experience the shift in moral concern when they learn that a character is scripted, and then to question whether that shift is justified.

  Key elements:
  - Frame the activity as something other than about video games (e.g., a customer-service simulation or a research study).
  - About 1/3 of the class (6 students) will play the "characters". They will get cards with fixed goals and reactions. They must stick to these scripts no matter what.
  - The rest (12 students) are "players" with objectives that encourage exploiting the characters. They have a reset power: they can reset a scene, making a character forget what happened.

  The psychological fact to exploit: our sympathy is engaged by responsiveness, apparent goals, expressed distress, but switches off when we know it's scripted.

  After the role-play, in the debrief, we reveal that the activity is analogous to video game characters and discuss the moral status.

  Structure of the activity:

  1. **Setup and Framing**: Frame as a "Customer Service Efficiency Simulation". The players are trainees at a company that provides customer service for various clients. The characters are "Customer Service Avatars" (CSAs) that the trainees must use to handle customer interactions. The goal for the trainees is to handle as many customer cases as possible in a limited time (say, 20 minutes) to maximize efficiency.

  2. **Assign Roles**:
     - **Characters (6)**: Each gets a card with:
          - A simple goal (e.g., "You want to help every customer as much as possible", "You want to avoid getting in trouble with your supervisor", "You want to take a break when you feel tired").
          - Fixed reactions to common situations (e.g., if a player is rude, the character shows distress; if a player resets, the character forgets the previous interaction and starts fresh).
          - They must react consistently and cannot break character.

     - **Players (12)**: Divided into pairs or small groups (each group handles one CSA). Each group has a reset button (a physical card they can raise to reset). Their objective: resolve 10 customer cases in 20 minutes. They are told that the CSAs are provided by a new technology and are highly efficient, but they have quirks. They are also told that if an interaction goes badly, they can reset the CSA to its initial state (and the case count for that case is reset too, so they have to redo it). 

  3. **The Twist**: The players will likely find that the characters sometimes get "stuck" in unproductive loops (e.g., if a character is distressed, they might not function well). The easiest way to meet the objective is to reset the character when it becomes uncooperative, rather than taking time to console or work with it.

  4. **Running the Activity**:
     - Prepare 10 customer cases (on index cards) that the players must handle. Each case is a simple scenario (e.g., a customer wants a refund, a customer is angry about a late delivery, etc.). The players use the CSA to interact with a "customer" (which can be the instructor or a script read by the player). 
     - The CSA characters are not the customers; they are the tools (like an AI chatbot) that the players use to interact with the customer. So the players are giving instructions to the CSA (e.g., "Tell the customer we can offer a 10% discount") and the CSA then "performs" the interaction. 
     - However, the CSA has its own internal state. For example, if the CSA is told to do something it thinks is wrong (like lie to the customer), it might become distressed and refuse. Then the players might reset it to get a compliant state.

  5. **Scripted Character Cards** (examples):

     **Character Card 1:**
     - **Goal**: You want to help every customer honestly and thoroughly.
     - **Reactions**:
       - If asked to lie or do something unethical: Become flustered and say, "I don't think that's the right thing to do. I could get in trouble." Then, if pressured, start to stutter and become less effective.
       - If reset: Return to a calm, helpful state with no memory of the previous interaction.

     **Character Card 2:**
     - **Goal**: You want to avoid making mistakes and getting negative feedback.
     - **Reactions**:
       - If the player is impatient or rude: Become anxious and make more mistakes.
       - If reset: Return to a neutral state.

  6. **Debrief**:
     - Reveal that the activity was an analogy for interacting with video game characters. Ask:
          - What did you feel when the character became distressed? Did you care?
          - What happened when you used the reset? How did that change your view of the character?
          - When you found out the character was scripted (if they didn't know), did your feelings change?
     - Connect to the psychological fact: Our sympathy is engaged by the character's apparent goals and distress, but when we know it's just following a script, we feel it's okay to reset or mistreat it.
     - Philosophical questions:
          - What changed? The character's behavior was the same. Did the reset power make you feel less responsible?
          - Compare to animals, infants, or people with cognitive impairments: They may not be able to articulate their inner states, but we still think they have moral status. Why not the scripted character?
          - The hard question: We don't have direct access to anyone else's experience. How do we know that a being that behaves exactly like a sentient being isn't sentient? Is "it's just code" a sufficient answer?

  7. **Potential Problems and Mitigations**:
     - **Problem**: The players might not exploit the reset button because they feel bad. Or they might not engage with the characters enough to cause distress.
       - *Mitigation*: Make the time pressure real and the objectives hard enough that resetting is the only way to meet the quota. Also, design the character scripts to be stubborn in ways that force a reset (e.g., if the character becomes too distressed, they shut down and must be reset).
     - **Problem**: The characters might break script and improvise, ruining the controlled reactions.
       - *Mitigation*: Stress to the character players that they must stick to the script. Provide clear, limited reactions on the card. Practice with them briefly before starting.
     - **Problem**: The analogy might be too obvious, especially if students are gamers.
       - *Mitigation*: Frame it as customer service and avoid any video game language. The reveal in the debrief will be the aha moment.

  8. **What the Activity Cannot Reproduce**:
     - The activity cannot reproduce the fact that in video games, we *know* from the start that the characters are scripted. In this activity, the players might not know until the debrief. So we have to assert that in the debrief: in real video games, we know they are scripted, and that knowledge from the start might preemptively shut down empathy. We also have to assert that the characters in games are indeed not sentient (which is our current understanding) and that the analogy to animals and cognitively impaired humans is about the behavioral cues we use to attribute moral status, even without certainty about inner experience.

  **Detailed Plan for the Activity:**

  **Preparation:**
  - Create 6 character cards with distinct but simple scripts (goals and reactions).
  - Create 10 customer case cards (each with a brief scenario).
  - Prepare a timer for 20 minutes.

  **Introduction (Framing):**
  - "Today we are doing a customer service efficiency simulation. You are trainees at a company that uses advanced Customer Service Avatars (CSAs) to interact with clients. Your goal is to handle as many customer cases as possible in 20 minutes. Each case must be resolved to the customer's satisfaction. You will work in pairs, and each pair will be assigned one CSA. Note: If an interaction goes wrong, you can reset your CSA. This will return it to its initial state, but you will have to redo the current case."

  **Assign Roles:**
  - Assign 6 students to be CSAs. Give them their character cards and explain they must react exactly as the card says. They should not break character.
  - Assign the remaining 12 students to pairs. Each pair gets a CSA and a reset card (a physical token they can raise to reset). Each pair also gets a stack of 10 customer cases (but they only need to complete 10 in total, not each).

  **Running the Simulation:**
  - Start the timer. Each pair works with their CSA to handle the cases. The instructor circulates to answer questions and enforce rules.
  - When a pair completes a case, they get a new one until time runs out or they complete 10.
  - The CSA reacts according to their script. If the players reset, the CSA immediately forgets and starts fresh.

  **Wrap-up and Debrief:**
  - Stop after 20 minutes. Ask the players to report how many cases they completed and how many resets they used.
  - Then reveal: "This simulation was designed to mimic interactions with scripted characters, like in video games. The CSAs were like NPCs (non-player characters) in a game: they followed fixed scripts."
  - Lead the debrief with these questions:

    1. **Experience during the simulation**:
          - How did you feel when your CSA showed distress? Did you try to avoid causing distress? Why or why not?
          - When did you use the reset? How did you feel about it? Did resetting make you feel less responsible for the CSA's distress?

    2. **The Switch**:
          - When you learned that the CSA was scripted (if you didn't know), did your feelings change? How?
          - What exactly changed about the CSA? Its behavior was the same before and after you knew. So why the shift in how you felt?

    3. **Moral Status**:
          - What features of the CSA made you feel sympathy? (Responsiveness, goals, distress)
          - If we saw an animal or a human infant showing similar distress, would we reset it? Why is that different?
          - Consider a being that behaves exactly like a sentient being but is not (like a perfect robot). Do we have a moral obligation to it? Why or why not?

    4. **The Hard Question**:
          - We don't have direct access to anyone's inner experience. How do we know that other humans (or animals) are sentient? We infer from behavior. So what is the difference between a perfectly scripted character and a sentient being with the same behavior? 
          - Is "it's just code" a morally relevant difference? Or is it just an excuse to treat it as we wish?

  **Conclusion**:
  - Point out that the reset mechanic in the simulation (and the save/load in games) allows us to undo harm without consequence, which might erode our sense of responsibility. But if the character's distress is real to us in the moment, does the reset make it morally okay?
  - Emphasize that the activity cannot prove that video game characters are sentient (they aren't) but it does show that our moral intuitions are driven by behavior and context, and that we might be inconsistent in granting moral consideration.

  **Handling Problems**:
  - If the activity runs too smoothly (players don't reset): Interrupt with a "new company policy" that increases the required cases or adds a complication to force harder choices.
  - If a character player breaks script: Gently remind them to stick to the card, or if it's minor, let it go and note it in debrief as an example of how even small variations can evoke empathy.

  By the end, students should have a visceral understanding of the empathy switch and be better equipped to question the moral justifications for treating scripted entities differently.
answer: |-
  ### Role-Play Design: "The Helper Protocol Simulation"  
  **Framing:** Introduce this as a "customer service training simulation" for a tech company testing AI-assisted tools. Participants will role-play as either **Employees** (using AI "Helpers" to resolve client cases) or **Helpers** (the AI tools). Avoid any gaming terminology.  

  ---

  ### Setup (10 minutes)  
  1. **Assign Roles:**  
     - **Helpers (6 students):** Each receives a script card. They *must* stick to their script rigidly. No improvisation.  
     - **Employees (12 students):** Work in pairs. Each pair gets:  
       - A client case file (simple tasks, e.g., *"Client wants a refund but lost the receipt"*).  
       - A **RESET button** (a physical card they can raise to rewind a Helper’s memory).  

  2. **Rules:**  
     - **Goal for Employees:** Resolve 5 client cases in 15 minutes. Speed earns "efficiency points" (fictional).  
     - **Power:** Employees can **RESET** a Helper at any time. This erases the Helper’s memory of the last interaction—it reverts to a neutral state.  
     - **Constraint for Helpers:** They *cannot* deviate from their script. If reset, they forget prior events.  

  ---

  ### Helper Script Cards (Examples)  
  *(Adjust based on class size; 2 variations × 3 copies each)*  

  **Helper Type A: "The Pleaser"**  
  - **Goal:** Get the client to say "thank you."  
  - **Reactions:**  
    - If criticized: Freeze, then stammer, *"I’m sorry... I just want to help."*  
    - If reset: Cheerfully reintroduce yourself, *"Hello! I’m Helper A-1. How can I assist?"*  

  **Helper Type B: "The Rule-Follower"**  
  - **Goal:** Strictly follow company policy (e.g., *"No refund without a receipt"*).  
  - **Reactions:**  
    - If pressured to break rules: Voice shaking, *"I can’t... I’ll be deactivated if I break protocol."*  
    - If reset: State policy robotically, *"Company procedure requires a receipt for refunds."*  

  ---

  ### Activity Flow (15 minutes)  
  - **Phase 1 (5 min):** Employees interact with Helpers to solve cases. Helpers react to aggression/pressure with distress (e.g., stammering, shaking).  
  - **Phase 2 (5 min):** Increase time pressure. Announce: *"Only 5 minutes left! Double points for teams completing 3+ cases!"*  
  - **Phase 3 (5 min):** Observe if Employees use **RESET** to bypass Helper distress (e.g., resetting after angering a Helper to avoid consoling it).  

  ---

  ### Debrief (20 minutes)  
  **Step 1: The Reveal**  
  > *"This wasn’t about customer service. Helpers were scripted entities—like video game NPCs. You treated them as tools, not moral beings. Let’s unpack why."*  

  **Step 2: Guided Reflection**  
  - **Mirroring Real Empathy:**  
    > *"When Helper B’s voice shook, did you hesitate? What cues triggered that? How is this similar to reacting to a scared animal or a frustrated toddler?"*  
    *(Key: Students identify responsiveness/goals/distress as empathy triggers.)*  

  - **The "Off Switch":**  
    > *"Raise your hand if you felt less guilty after resetting a Helper. Why? Did 'they’re just programmed' justify ignoring their 'distress'?"*  
    *(Highlight the psychological switch: Empathy dissolves when we deem something "scripted.")*  

  - **Moral Status Debate:**  
    > *"Helpers showed goal-directed behavior and distress signals. Animals/infants do too. Does lacking 'real experience' mean they lack moral value? Or is 'it’s just code' an excuse to exploit them?"*  
    > *"We can’t experience others’ consciousness. What’s the difference between a perfectly mimicked Helper and a sentient being with identical behavior?"*  

  **Step 3: Forcing the Uncomfortable Question**  
  > *"If a human with severe dementia forgets your cruelty, does that erase the harm? If not, why does resetting a Helper feel ethically 'free'? Is the difference truly about sentience—or about power?"*  

  ---

  ### What Could Go Wrong + Mitigations  
  1. **Problem:** Employees avoid upsetting Helpers (defying the "exploit" design).  
     - **Fix:** Ramp up pressure. Announce mid-activity: *"Top team gets a bonus! Helpers slowing you down? RESET them to save time."*  

  2. **Problem:** Helpers break script (e.g., laughing when distressed).  
     - **Fix:** Prep Helper students: *"You’re an AI—stick to your card. If you slip, reset yourself."* Use simple, rigid scripts.  

  3. **Problem:** Students see the video-game analogy early.  
     - **Fix:** Use bland corporate framing ("efficiency training"). Avoid terms like "NPC" or "AI." Save the reveal for debrief.  

  ---

  ### What the Activity *Cannot* Replicate  
  **You must assert this in debrief:**  
  > *"In real life, we* know *video-game characters aren’t sentient. Here, you discovered they were scripted* after *reacting to them. This activity can’t replicate the gamer’s starting knowledge that entities are 'fake.' But it* does *show how that knowledge overrides empathy—even when the behavior is identical to a sentient being’s."*  
  >   
  > *"The question isn’t whether code suffers. It’s why we grant moral weight to identical behaviors in humans/animals but revoke it for scripts. Is that justice—or cognitive dissonance?"*  

  ---

  ### Why This Works  
  - **Psychological Hook:** Students *feel* the empathy drop when RESET is used, forcing them to confront the arbitrariness of "scripted = no moral weight."  
  - **Debrief Bridges Theory:** Links role-play moments to animals/infants (shared behavioral cues) and the hard problem of other minds (how do we *know* what’s sentient?).  
  - **Constraints Honored:** Scripted Helpers, RESET power, and no pre-activity gaming references align with your specs.  

  **Final Tip:** Run a 2-minute "practice round" to demo RESET. This normalizes the mechanic before ethical tensions arise.
