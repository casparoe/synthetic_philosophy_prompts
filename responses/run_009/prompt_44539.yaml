  We are given a query from a retired analytical chemist who has been studying philosophy of science, specifically Goodman's new riddle of induction (the grue problem). The user presents their understanding and asks several questions about the implications for science.

  Key points in the user's understanding:
  1. Goodman proved there's no fact of the matter about which regularities are genuine laws and which are accidental.
  2. "Green" is only more entrenched than "grue" because we have used the word more, so our confidence in "all emeralds are green" over "all emeralds are grue" is due to linguistic habit, not evidence.
  3. Induction has no rational foundation at all.
  4. Laws of nature are just habits of speech that got frozen into physics textbooks.
  5. Hume gets the last laugh (skepticism about induction).

  The user then asks:
  - Why didn't scientists get the memo?
  - Was empirical science since the 1950s philosophically misguided in treating laws as discoveries?
  - Is the only honest position for a scientist to give up on laws and just do curve-fitting with error bars?

  We must first evaluate the user's understanding of Goodman and then answer the questions.

  ### Evaluating the user's understanding
  Goodman's new riddle of induction (presented in "Fact, Fiction, and Forecast") is about the problem of projectibility. He uses the example of two predicates:
  - "Green": something is observed to be green up to time t.
  - "Grue": something is green up to time t and blue thereafter (or more generally, it changes color at a fixed future time).

  The problem: All emeralds observed so far are both green and grue (if we set t in the future). So why do we project "green" to the future and not "grue"? 

  Goodman's solution is that "green" is projectible because it is "entrenched" — it has been used in successful projections in the past, and it is a part of our linguistic and scientific practice. "Grue" is not entrenched and is disjunctive (it refers to two different colors at different times). However, Goodman does not conclude that there is no fact of the matter about laws or that induction is entirely without foundation. Instead, he argues that projectibility is a matter of how well a predicate is entrenched and how well it fits into our system of beliefs. It is not purely a matter of habit, but of the entire system of science.

  The user's understanding is partly right but overstates the case. Goodman does not say that there is no fact of the matter at all, but rather that we cannot determine projectibility without considering the history of usage and the systematic role of the predicate. Moreover, Goodman is not a full-blown skeptic; he aims to provide a solution to the problem of induction by appealing to entrenchment and systematic considerations.

  ### Addressing the questions
  1. **Why didn't scientists get the memo?**  
     Because Goodman's riddle is a philosophical puzzle about the justification of induction, not a practical problem for working scientists. In practice, scientists use predicates that are well-entrenched and have proven useful in building theories that are coherent and predictively successful. The periodic table and rate equations are part of such a system. Scientists don't need to worry about grue-like predicates because they don't arise in their well-established theories.

  2. **Was empirical science since the 1950s philosophically misguided?**  
     No. Science is not misguided in treating laws as discoveries. Goodman does not deny that there are objective regularities in the world. He is concerned with how we justify projecting certain regularities. The success of science in prediction and control suggests that our entrenched predicates and laws are tracking something real. The philosophical puzzle does not invalidate scientific practice.

  3. **Should scientists give up on laws and just do curve-fitting?**  
     Absolutely not. Curve-fitting without any theoretical framework would be a step backward. Goodman's point is that we need a system of entrenched predicates and theories that have been refined over time. This system is what allows us to distinguish between genuine laws and accidental regularities. The periodic table is not just a convention; it is a representation of deep physical realities that has been confirmed in countless ways.

  ### Summary of Goodman's contribution
  - **What Goodman established**: The new riddle of induction shows that not all regularities are projectible. We need a criterion to distinguish projectible predicates (like "green") from non-projectible ones (like "grue"). Goodman's solution is that projectibility depends on the entrenchment of the predicate in our linguistic and scientific practices and its non-disjunctive, non-artificial nature in the context of a coherent system.

  - **What is still open**: 
     - The exact nature of entrenchment and how it relates to the structure of scientific theories.
     - Whether there is an objective basis for projectibility beyond human practices.
     - The relationship between Goodman's solution and other approaches to induction (e.g., Bayesian).

  ### Upshot for working scientists
  Scientists should continue to use well-entrenched theoretical frameworks and laws as they have been doing, because these are the tools that have proven successful in building explanatory and predictive models of the world. Goodman's riddle does not undermine their work but rather highlights the importance of the historical development of scientific concepts.

