  ### Detailed Answers to Your Questions  

  **Q1: Why didn’t scientists "get the memo"?**  
  Because Goodman's riddle targets *philosophical justification*, not scientific practice. Labs rely on **entrenched theories** (e.g., quantum mechanics, thermodynamics) that have been vetted through prediction, technology, and peer review. "Grue"-like predicates rarely survive contact with real-world science—they clash with our theory-laden observation (e.g., spectroscopy assumes wavelength constancy, not arbitrary time-bound properties). Science pragmatically ignores non-projectible predicates because they don’t cohere with existing models.  

  **Q2: Was science since the 1950s "philosophically misguided"?**  
  No. Goodman challenges **how we justify** induction, not whether science works. The periodic table’s success isn’t accidental—it embeds deeply entrenched predicates (atomic number, electron configuration) that interlock with countless experiments. Treating laws as "discoveries" remains viable if you accept that entrenchment reflects a feedback loop between reality and our conceptual schemes. Goodman himself saw science as rational, just not grounded in logic alone.  

  **Q3: Should scientists give up on laws and just do curve-fitting?**  
  Absolutely not! Goodman’s insight is that **all inference** (even curve-fitting) relies on entrenchment. Choosing a polynomial over a Fourier series assumes entrenched mathematical norms. The periodic table isn’t mere convention—it’s a highly refined, empirically successful framework. Abandoning "laws" would paralyze science; instead, embrace that entrenchment is a feature, not a bug. Your spectroscopy work leveraged entrenched principles *because they reliably corresponded to measurable phenomena*.  

  ---

  ### Why Hume Doesn’t Get the Last Laugh  
  Goodman agrees with Hume that induction lacks a *logical* foundation but offers a pragmatic alternative: **entrenchment** stabilizes induction through evolutionary and social processes. "Green" isn’t arbitrary—it’s entrenched because it coheres with optics, biology, and manufacturing. "Grue" fails because it’s disjunctive and isolates anomalies. Science avoids this by building **theories** that interlock predicates (e.g., "wavelength" links to "energy," ruling out grue-like jumps).  

  ### The Bottom Line  
  Your career wasn’t misguided—it exemplified how entrenchment *works*. Goodman’s riddle warns philosophers, not scientists: it exposes gaps in *justification*, not practice. Keep trusting the periodic table, but stay philosophically mindful that its authority comes from centuries of communal testing, not pure "discovery" in a vacuum.  

