          Node 9: Can the mental property be reduced by functional analysis (identifying it with a causal role and then with its physical realizer)?
            - Yes: Kim's functional reduction.
            - No: go to Node 10.

          Node 10: We cannot separate Anomalous monism and Realization-based non-reductive physicalism with the questions asked. So both are possible. (And they are the most common non-reductive physicalist views.)

          The unnamed view is only in the dualism branch (node 4: no to emergentism and no to rejecting PCC).

          Now, we need a key for each leaf.

          Let's list the leaves:

            1. Epiphenomenalism (from Node 2-No or Node 7-No)
            2. Emergentism with downward causation (Node 3-Yes)
            3. Interactionist dualism (Node 4-Yes)
            4. Unnamed: dualism with overdetermination (Node 4-No)
            5. Russellian monism (Node 5-Yes)
            6. Type-identity theory (Node 6-Yes)
            7. Overdetermination-friendly non-reductive physicalism (Node 8-Yes)
            8. Kim's functional reduction (Node 9-Yes)
            9. Anomalous monism and Realization-based non-reductive physicalism (Node 10)

          We have 9 leaves, but we also wanted to include both anomalous monism and realization-based non-reductive physicalism as separate? But we said we cannot separate them, so we put them together.

          The key:

            Epiphenomenalism: 
              - Commits to: mental states are caused by physical states but do not cause any physical effects.
              - Awkward: consciousness seems to do nothing, yet we discuss it and it seems to guide behavior.

            Emergentism with downward causation:
              - Commits to: mental properties emerge from complex physical systems and have novel causal powers that can affect the physical world.
              - Awkward: how can something that depends on the physical have new causal powers not from the physical? And does it violate physical causal closure?

            Interactionist dualism:
              - Commits to: mental and physical are separate substances or properties, and they interact causally.
              - Awkward: how can non-physical mental states interact with physical states? And it typically rejects physical causal closure.

            Unnamed (dualism with overdetermination):
              - Commits to: mental and physical are separate, both can cause physical events, and sometimes they both cause the same physical event (overdetermination) while physical causal closure holds.
              - Awkward: why would there be two independent sufficient causes for voluntary actions? Seems redundant.

            Russellian monism:
              - Commits to: the intrinsic nature of physical properties is mental or proto-mental, and this explains consciousness and its causal efficacy.
              - Awkward: the intrinsic nature is hidden from physics, and how exactly does it cause? The combination problem: how do proto-mentals combine to form consciousness?

            Type-identity theory:
              - Commits to: mental states are identical to brain states (e.g., pain = C-fiber firing).
              - Awkward: multiple realizability (pain might be realized by different states in different species).

            Overdetermination-friendly non-reductive physicalism:
              - Commits to: mental states supervene on physical states and cause physical effects, and sometimes this leads to overdetermination (like two shooters) but that is unproblematic.
              - Awkward: overdetermination is usually seen as a flaw because it is coincidental and redundant.

            Kim's functional reduction:
              - Commits to: mental states are functional states (defined by their causal role) and are reduced to their physical realizers in a given context.
              - Awkward: it gives up on the multiple realizability across contexts (each realizer type gets its own reduction, so pain in humans is one thing, in octopuses another).

            Anomalous monism and Realization-based non-reductive physicalism:
              - Anomalous monism commits to: mental events are physical events, but mental properties are not reducible to physical laws. Causal relations between events hold under physical descriptions.
              - Realization-based non-reductive physicalism commits to: mental properties are functional properties realized by physical properties, and they are causally relevant in virtue of the physical realizer doing the work.
              - Awkward for both: the exclusion argument seems to show that the mental properties are causally irrelevant (property epiphenomenalism).

          We'll put the tree on one page and the key on a separate page (or on the same page if it fits).

