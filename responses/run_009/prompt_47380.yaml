prompt: |-
  As a novelist I've run with Dennett's four kinds of creatures -- Darwinian (hardwired reflexes only), Skinnerian (learns by trial and error in real time), Popperian (can rehearse internally, let the hypothesis die instead of itself), Gregorian (gets handed mental tools, mostly culture and words, that reshape what it can even notice) -- as a shorthand for building characters. But I want to stop winging it and have an actual procedure I can run on every character in a draft, one by one, before I show it to anyone. Please write me that procedure: the questions to ask in order, what answer puts the character at each level, what to do about characters who sit at one level for some things and another for others, and where the procedure should admit it can't decide and just hand it back to me as a judgment call about the story I want to tell. Then run it on three characters: a servant girl who can't read but is brilliant at reading people, a scholar who is erudite but never once changes his plan when facts change, and a toddler. Also, be upfront about which parts of Dennett's scheme are settled background and which are contested or just his own framing -- I don't want to build characters on something that only looks like established science, and please flag it if the hierarchy itself (each level supposdly subsuming the last) is doing work that the actual biology and psychology doesn't support.
reasoning: |-
  We are going to create a procedure to classify characters according to Dennett's four kinds of creatures. The levels are:

  1. **Darwinian**: Hardwired reflexes only. They act based on innate, fixed responses to stimuli.
  2. **Skinnerian**: Learns by trial and error in real time. They can change behavior based on rewards and punishments but only through direct experience.
  3. **Popperian**: Can rehearse internally (mentally simulate outcomes) and thus let the hypothesis die instead of itself. They can plan and adjust without having to physically try every option.
  4. **Gregorian**: Gets handed mental tools (culture, language, etc.) that reshape cognition and perception. They can use external symbols and cultural tools to think and notice things that would otherwise be invisible.

  Important notes on Dennett's framework:
  - The hierarchy is cumulative: each level builds upon and subsumes the capabilities of the previous ones. For example, a Popperian creature is also Skinnerian and Darwinian, but with added internal simulation.
  - This framework is a philosophical conceptualization by Dennett and is not a settled scientific theory. It is a useful heuristic for thinking about cognition but is contested in several ways:
    - The strict hierarchy might be an oversimplification. In reality, cognitive processes are more intertwined and may not neatly fit into these discrete levels.
    - The Gregorian level heavily relies on cultural transmission and language, which are not necessarily "higher" in an evolutionary sense but are transformative in human cognition.
    - Biology and psychology do not necessarily support a strict hierarchy where each level subsumes the previous one. For instance, some organisms might exhibit traits from multiple levels without clearly being at one level.

  Procedure for classifying a character:

  We will ask a series of questions. The goal is to find the highest level that the character consistently operates at for the majority of their significant actions and decisions. However, note that:
  - A character may use different levels for different domains (e.g., social skills vs. technical skills). We will address this by looking for the level that dominates their key traits and decision-making processes.
  - If a character uses multiple levels in a way that doesn't clearly dominate, we may have to note the mixture or make a judgment call.

  Step-by-step questions:

  1. **Does the character have any behaviors that are purely innate, reflexive, and unchangeable?** (This is the baseline: all creatures are at least Darwinian.)
     - If the character only has such behaviors and cannot learn at all, then Darwinian.
     - Otherwise, they are at least Skinnerian.

  2. **Does the character learn from direct experience (trial and error) in the world?**
     - If they can modify their behavior based on rewards and punishments but only through actual experiences (not by thinking ahead), then Skinnerian.
     - If they can also learn without direct trial (by thinking or simulating), then they are at least Popperian.

  3. **Can the character imagine different scenarios and outcomes internally without having to act them out in the real world?**
     - If they can mentally simulate actions and choose the best course without physical trial and error, then they are at least Popperian.
     - If they cannot, then they are Skinnerian.

  4. **Does the character use language, cultural symbols, tools, or other external cognitive artifacts to extend their thinking?**
     - If they use such tools to reframe problems, notice patterns, or think in ways that are not possible without these tools, then they are Gregorian.
     - If they do not, then they are Popperian (or lower).

  However, note that the Gregorian level requires the use of external tools (especially language and culture). Without these, a Popperian creature might be very smart but limited to its own mental simulations without the transformative power of culture.

  Handling mixed levels:
  - If a character operates at different levels for different aspects of their life, we will try to determine the level for the most critical aspects of their role in the story. Alternatively, we might note that the character is mixed and then decide based on the dominant mode or the mode that drives the plot.
  - If the character is mixed and no level is clearly dominant, we will flag it as a judgment call.

  When the procedure can't decide:
  - If the answers are ambiguous or the character seems to straddle two levels without a clear dominance, we will return it as a judgment call for the author, noting the competing traits.

  Now, let's run the procedure on the three characters:

  **Character 1: Servant girl who can't read but is brilliant at reading people**

  1. She has innate reflexes? (Yes, but she also has more.) -> At least Skinnerian.
  2. Does she learn from direct experience? Presumably yes, as a servant she must have learned many things by trial and error. But note: she is "brilliant at reading people", which might involve more than trial and error.
  3. Can she rehearse internally? Her ability to read people might involve internal simulation: imagining what others might do, their motivations, etc. This suggests Popperian.
  4. Does she use cultural tools? She can't read, so she doesn't use written language. However, she might use oral language and cultural knowledge (e.g., understanding social norms, facial expressions, tones of voice) to read people. So she is using cultural tools (Gregorian) in the domain of social cognition? But note: Dennett's Gregorian level is about the use of tools that restructure the mind. Reading people without explicit symbols might be more Popperian? However, understanding social cues is often culturally transmitted.

  But note: her brilliance at reading people might be a combination of innate talent (Darwinian), learned through experience (Skinnerian), and internally simulated (Popperian), and also using cultural knowledge (Gregorian). However, she lacks literacy, which is a key Gregorian tool. But Gregorian is not just about reading and writing; it includes oral culture as well.

  Given that she is using cultural tools (like understanding social norms, interpreting expressions and tones that are culturally specific) to read people, and this transforms her ability to notice social cues, she might be Gregorian in the social domain. However, in the domain of literacy, she is not Gregorian.

  But the procedure asks for the overall level. We have to see what level she operates at for her key trait (reading people). For that, she is using cultural tools (language, social norms) so that pushes her to Gregorian. Alternatively, if we think her skill is mostly intuitive and not relying on cultural symbols, then Popperian.

  Given the ambiguity, we might note:

  - In general learning: she is at least Skinnerian (learns from experience).
  - In social cognition: she uses internal simulation (Popperian) and cultural tools (Gregorian) because reading people is a culturally informed skill. So for her key trait, she is Gregorian.

  But note: Dennett's Gregorian level requires the use of symbols and tools that restructure cognition. If she is not using language explicitly as a tool for thinking, then maybe not. However, she likely uses language to understand and interpret people (e.g., she understands words, tones, and cultural meanings).

  Given that, we can classify her as Gregorian because her social brilliance is likely built on cultural tools (even without reading). But if the author intends that she is purely intuitive without cultural influence, then she might be Popperian.

  Given the description, I think we can say:

  - Overall, she is Gregorian because her social cognition is transformed by cultural tools (language, social norms). The inability to read does not preclude being Gregorian, because Gregorian includes oral culture.

  **Character 2: Scholar who is erudite but never once changes his plan when facts change**

  1. He has innate reflexes? Yes, but more -> at least Skinnerian.
  2. Learns from direct experience? As a scholar, he has learned a lot, but note: he is erudite, meaning he has acquired knowledge through study (which is not direct trial and error but through cultural tools). So he is at least Gregorian? But wait, the procedure is cumulative. We need to check the levels step by step.

  But note: the procedure is designed to find the highest level. So we can jump to the Gregorian question because he is clearly above Darwinian and Skinnerian.

  3. Can he rehearse internally? As a scholar, he must be able to think and simulate internally. So Popperian at least.
  4. Does he use cultural tools? Yes, he is erudite, so he uses language, books, and cultural knowledge. So Gregorian.

  But note: the problem is that he never changes his plan when facts change. This might indicate a limitation in his Popperian abilities? The Popperian level is about being able to let the hypothesis die instead of the creature. But if he doesn't change his plan, then he is failing at the Popperian level? However, the Gregorian level builds on Popperian. So how do we reconcile?

  The issue is that the Gregorian level does not necessarily guarantee that the creature uses its abilities well. The scholar has the tools (Gregorian) and the ability to simulate (Popperian) but is rigid. So he is still Gregorian, but his rigidity is a flaw in how he uses his capabilities.

  Therefore, we classify him as Gregorian, but note that his rigidity is a character trait that prevents him from using his Gregorian tools effectively in the face of changing facts.

  **Character 3: Toddler**

  1. Innate reflexes? Yes, but more -> at least Skinnerian.
  2. Learns by trial and error? Toddlers are known for learning through direct experience (e.g., touching a hot stove). So Skinnerian.
  3. Can rehearse internally? Toddlers have limited ability for internal simulation. They are developing this skill but it is not fully formed. They often learn by doing and have difficulty with hypothetical reasoning. So they might be primarily Skinnerian with emerging Popperian abilities.
  4. Do they use cultural tools? Toddlers are learning language and cultural symbols, but they are in the early stages. They might use some words and symbols but not in a way that fully restructures their cognition. So they are not fully Gregorian.

  Given that, we might classify a typical toddler as primarily Skinnerian with some emerging Popperian and Gregorian traits. But overall, the dominant mode is Skinnerian because they rely heavily on direct experience and their internal simulation is limited. However, note that by age 2-3, toddlers start engaging in pretend play (which is a form of internal simulation) and are learning language (Gregorian tools). But the extent varies.

  Given the ambiguity, we might say:

  - A toddler is in transition. But for classification, we can say they are Skinnerian because their learning is still heavily based on direct experience and they are not yet capable of complex internal simulations or fully using cultural tools for cognition.

  However, note that Dennett's levels are cumulative and developmentally, a toddler is building the higher levels. So we might note that they are at the Skinnerian level with emerging Popperian and Gregorian capabilities.

  But for the purpose of classification, we can say:

  - If the toddler is very young (e.g., 1-2 years), then Skinnerian.
  - If older (e.g., 3-4 years) and showing pretend play and using language to some extent, then Popperian or even early Gregorian? But note: the Gregorian level requires the tools to restructure cognition. A toddler using words might not yet have that transformation.

  Given that, we'll classify the toddler as primarily Skinnerian, but note that this is a simplification and the character might be in transition.

  Summary of classifications:

  - Servant girl: Gregorian (due to cultural tools in social cognition, despite illiteracy)
  - Scholar: Gregorian (due to erudition and use of cultural tools, even though he is rigid)
  - Toddler: Skinnerian (with emerging Popperian and Gregorian traits)

  But note: the toddler might be more accurately described as a mix, but the procedure has to assign one level for simplicity. We can note that the toddler is developing and thus might be classified as Skinnerian as the base but with higher levels emerging.

  Finally, we note that Dennett's hierarchy is a framework and not settled science. The classifications are for character building and story purposes.
answer: |-
  Here's a comprehensive character-classification procedure based on Dennett's framework, designed for practical novel-writing use. I've structured it as a step-by-step interrogation, flagged scientific caveats upfront, addressed mixed/messy cases, and included your three test characters. Crucially, **I'll note where Dennett's model is contested or oversimplified** so you can intentionally lean into or subvert it for storytelling.

  ---

  ### **Scientific Caveats: What Dennett Gets Right vs. Where It's Shaky**
  1. **Settled Background**:
     - Learning *does* operate via layers (reflex → conditioning → simulation → cultural tools).
     - Humans *are* profoundly shaped by cultural tools (language, symbols).
     - Internal simulation (e.g., mental rehearsal) *is* a key cognitive upgrade.

  2. **Contested/Oversimplified**:
     - **Not Strictly Hierarchical**: Biology shows these "levels" aren't discrete stages that subsume prior ones. Real cognition is messier (e.g., a "Gregorian" human still uses Darwinian reflexes for pain avoidance). Dennett's ladder is a *heuristic*, not a law.
     - **Culture Isn't Just "Higher"**: Gregorian tools (language, etc.) don't just "upgrade" individuals—they create emergent systems. A non-literate oral culture is still Gregorian.
     - **Biology Ignores "Brilliance"**: Your servant girl highlights a flaw: domain-specific talent (e.g., social IQ) can defy Dennett's progression. Neuroscience shows skills like emotional intuition can operate semi-independently.
     - **"Subsuming Previous Levels" Is Problematic**: A Skinnerian pigeon uses reflexes *alongside* learning—not "subsumed." Dennett's hierarchy implies obsolete layers vanish, which is untrue.
     - **Dennett's Origin Story Is Speculative**: The "evolutionary stack" (Darwinian → Skinnerian → etc.) is his *philosophical narrative*, not a proven evolutionary sequence.

  **Use this as** a character *lens*, not rigid science. Lean into ambiguities for richer characters.

  ---

  ### **The Procedure: Classifying Characters**
  **Goal**: Assign a **dominant cognitive mode** per character.  
  **Method**: Work through these questions sequentially. Stop at the first level where the answer is "no" or "mixed," then resolve per rules below.  
  **Tools Needed**: Your draft, a basic character profile.

  #### **Step 1: Is the character purely reactive? (Darwinian Check)**
  - **Ask**: *Does the character* ***only*** *respond to stimuli via innate, fixed reflexes? (e.g., recoiling from pain, blinking at dust)*  
    - **Yes** → **Darwinian Creature** (e.g., a mosquito, a zombie).  
    - **No** → Proceed to Step 2.  
    - **Mixed/Unclear** → Flag as "Darwinian+" (e.g., a robot with default reflexes but some learning). Proceed to Step 2.

  #### **Step 2: Does the character learn only by direct trial-and-error? (Skinnerian Check)**
  - **Ask**: *Can the character adapt behavior* ***only*** *through real-time feedback (reward/punishment), with* ***no*** *ability to imagine alternatives?*  
    - **Yes** → **Skinnerian Creature** (e.g., a rat in a maze, a naive gambler).  
    - **No** → Proceed to Step 3.  
    - **Mixed/Unclear** → Note domains. Proceed to Step 3.

  #### **Step 3: Can the character simulate outcomes mentally? (Popperian Check)**
  - **Ask**: *Can the character* ***internally rehearse*** *actions/outcomes ("what if?") and change plans* ***before*** *acting, even if imperfectly?*  
    - **Yes** → **Popperian Creature** (e.g., a chess player, a heist planner).  
    - **No** → Assign **Skinnerian**.  
    - **Mixed/Unclear** → Proceed to Step 4 if cultural tools are used; else, assign **Popperian** with caveats.

  #### **Step 4: Does the character use cultural/linguistic tools to reshape cognition? (Gregorian Check)**
  - **Ask**: *Does the character* ***rely on external tools*** *(language, symbols, tech, rituals) to* ***reframe problems*** *or* ***access concepts*** *they couldn't generate alone?*  
    - **Yes** → **Gregorian Creature** (e.g., a scientist using math, a poet using metaphor).  
    - **No** → Assign **Popperian**.  
    - **Mixed/Unclear** → Assign **Gregorian** if tools are *transformative* (per Dennett); else, flag as judgment call.

  ---

  ### **Handling Mixed Levels & Judgment Calls**
  - **Domain-Specific Levels**: If a character operates at different levels across domains (e.g., Skinnerian in love, Gregorian at work):
    1. Identify the **dominant domain for their role** (e.g., a warrior's combat IQ vs. their parenting).
    2. If no dominant domain, **assign the highest level they *sometimes* reach** and note incongruities (e.g., "Gregorian but Skinnerian under stress").
  - **Ambiguous Cases**: When answers are contradictory (e.g., "uses tools but can't simulate mentally"):
    - **Flag as judgment call** with notes (e.g., "Contradicts hierarchy—assign based on narrative needs").
  - **Development/Change**: If a character evolves (e.g., a child maturing), **assign current dominant mode** and note trajectory.

  ---

  ### **Test Runs on Your Characters**

  #### **1. Servant Girl (Can't read, brilliant at reading people)**
  - **Step 1**: Not purely reactive → **Not Darwinian**.  
  - **Step 2**: Learns via experience (e.g., gauging moods through interactions) → **Skinnerian supported**.  
  - **Step 3**: Can she mentally simulate social outcomes? Likely **yes** (e.g., "If I say X, he'll get angry; if Y, he'll help"). → **Popperian supported**.  
  - **Step 4**: Does she use cultural tools? **Yes, but ambiguously**. Her "reading people" uses cultural/linguistic tools (e.g., idioms, social norms, tonal cues), which reshape her perception of intent. *But* her illiteracy limits access to written symbols.  
    - **Judgment**: **Gregorian**. Why? Oral culture and social rituals *are* Gregorian tools (Dennett includes these). Her brilliance stems from mastering these tools, not raw intuition.  
    - **Caveat**: If her skill feels "pre-linguistic" (e.g., primal empathy), she could be **Popperian+**—but her role suggests cultural embeddedness.

  #### **2. Scholar (Erudite but never changes plans with new facts)**
  - **Step 1**: Not reactive → **Not Darwinian**.  
  - **Step 2**: Learns beyond trial/error (studies texts) → **Not Skinnerian**.  
  - **Step 3**: Can he simulate mentally? **Presumably yes** (as a scholar), but he *ignores outcomes* when facts change. → **Popperian capacity, but behaviorally rigid**.  
  - **Step 4**: Uses tools? **Yes** (books, theories, data). Cultural tools define his cognition. → **Gregorian**.  
    - **Judgment**: **Gregorian, with a Popperian failure**. His tools enable cognition, but he *chooses* not to update hypotheses (a personality flaw, not a cognitive limit).  
    - **Caveat**: If his rigidity stems from neurological inflexibility (e.g., autism), he might be **lower-level in decision-making**—but his erudition suggests Gregorian tools are central.

  #### **3. Toddler (~2-3 years old)**
  - **Step 1**: Not purely reactive (seeks novelty) → **Not Darwinian**.  
  - **Step 2**: Learns via trial/error? **Yes** (e.g., touching hot things, testing boundaries). → **Skinnerian dominant**.  
  - **Step 3**: Mental simulation? **Limited/emerging** (e.g., pretend play exists but is concrete; can't run complex "what-ifs"). → **Not reliably Popperian**.  
  - **Step 4**: Uses cultural tools? **Rudimentary** (e.g., basic words, simple rituals). Not yet *transformative* (can't reshape abstract thought).  
    - **Judgment**: **Skinnerian with emerging Popperian/Gregorian traits**. Assign **Skinnerian** as dominant mode.  
    - **Caveat**: Age matters. A 4-year-old with imaginary friends and complex language might be **Popperian+**.

  ---

  ### **When to Hand Back for Judgment Calls**
  The procedure flags ambiguity when:
  - **Domain conflicts** lack a dominant trait (e.g., your servant girl if her social IQ felt "pre-cultural").
  - **Contradictions** defy the hierarchy (e.g., a character who uses Gregorian tools but can't simulate outcomes).
  - **Borderline cases** (e.g., a highly trained animal—Skinnerian base with Gregorian-like conditioning).
  - **Narrative needs trump realism** (e.g., a poetic Darwinian robot for thematic irony).

  In these cases, **default to the story**: Assign the level that best serves themes, conflict, or character arc. Dennett's framework is a launchpad, not a cage.
