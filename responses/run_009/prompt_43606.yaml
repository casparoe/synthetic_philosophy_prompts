  hey, so I'm TAing a game theory course and I've got one makeup exam left to grade, on bargaining. I'd like a second opinion before I put a number on it. The question was:

  "Consider a two-person bargaining problem with disagreement point d = (0, 0), where the feasible set S is the convex hull of (0, 0), (10, 0), and (4, 6). (Recall the Kalai–Smorodinsky solution: the Pareto-efficient point at which each player's gain over the disagreement point is the same fraction of that player's maximum feasible gain.)
  (a) Compute the Nash bargaining solution.
  (b) Compute the Kalai–Smorodinsky solution.
  (c) Which axiom of the Nash solution does the Kalai–Smorodinsky solution give up, and what property does it satisfy in its place?"

  And here's what the student wrote, copied as-is (typos and all):

  "(a) The Pareto frontier is the segment from (4, 6) to (10, 0): points with u1 + u2 = 10, for u1 between 4 and 10. The Nash solution maximizes u1·u2 over S. On the frontier this is u1(10 − u1), which is maximized at u1 = 5, so the solution is (5, 5), with product 25. Points strictly below the frontier can't beat this, and on the edge from (0, 0) to (4, 6) the product is at most 24 (at (4, 6)), so (5, 5) is the Nash solution.

  (b) With disagreement point (0, 0), the Kalai–Smorodinsky solution is the Pareto-efficient point at which the two players recieve equal gains over the disagreement point. That point is (5, 5), which lies on the frontier, so the KS solution is also (5, 5). The two solutions coincide in this problem.

  (c) The Kalai–Smorodinsky solution gives up Nash's independence of irrelevant alternatives. In its place it satisfies individual monotonicity: if one player's maximum attainable payoff increases (everything else fixed), that player's payoff in the solution should not fall. One caveat worth noting: unlike the Nash solution, the KS solution is not invariant to changes in utility units, since it compares each player's gain to their utopian payoff, and the utopian payoff is measured in units."

