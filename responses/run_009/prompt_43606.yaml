  ### Grading and Feedback for Makeup Exam

  **Overall Mark: 7 out of 10**

  **Breakdown of Points:**
  - Part (a): 3 out of 3 points (correct)
  - Part (b): 0 out of 3 points (incorrect computation and conceptual error)
  - Part (c): 4 out of 4 points (correct, including the caveat as an accurate but non-essential addition)

  **Detailed Feedback by Part:**

  **Part (a): Compute the Nash bargaining solution.**  
  **Your answer:**  
  "The Pareto frontier is the segment from (4, 6) to (10, 0): points with u1 + u2 = 10, for u1 between 4 and 10. The Nash solution maximizes u1·u2 over S. On the frontier this is u1(10 − u1), which is maximized at u1 = 5, so the solution is (5, 5), with product 25. Points strictly below the frontier can't beat this, and on the edge from (0, 0) to (4, 6) the product is at most 24 (at (4, 6)), so (5, 5) is the Nash solution."  
  **Feedback:**  
  Correct. The Pareto frontier is indeed the line segment from (4, 6) to (10, 0), defined by u1 + u2 = 10 for u1 ∈ [4, 10]. The Nash bargaining solution maximizes the product u1 · u2 over the feasible set S. On the frontier, the product is u1(10 − u1), and its maximum occurs at u1 = 5 (derivative: 10 − 2u1 = 0 → u1 = 5, u2 = 5), yielding a product of 25. Points not on the frontier (e.g., the (0,0)–(4,6) edge, max product 24 < 25) cannot achieve a higher product. Thus, (5, 5) is the Nash solution. Full credit (3/3 points).

  **Part (b): Compute the Kalai–Smorodinsky solution.**  
  **Your answer:**  
  "With disagreement point (0, 0), the Kalai–Smorodinsky solution is the Pareto-efficient point at which the two players receive equal gains over the disagreement point. That point is (5, 5), which lies on the frontier, so the KS solution is also (5, 5). The two solutions coincide in this problem."  
  **Feedback:**  
  Incorrect. The Kalai-Smorodinsky (KS) solution is **not** defined as the point where absolute gains are equal (u1 = u2). Instead, it requires the proportional gains over the disagreement point to be equal relative to each player's maximum feasible gain (the "utopian payoff"). Here, the utopian payoff is derived from the feasible set S: player 1's maximum gain is max u1 = 10 (at (10, 0)), and player 2's maximum gain is max u2 = 6 (at (4, 6)). The KS solution satisfies u1 / 10 = u2 / 6 on the Pareto frontier (u1 + u2 = 10). Solving:  
  - Equation: u1 / 10 = (10 − u1) / 6  
  - Multiply both sides by 30: 3u1 = 50 − 5u1  
  - Rearrange: 8u1 = 50 → u1 = 50/8 = 6.25  
  - Then u2 = 10 − 6.25 = 3.75  
  Thus, the KS solution is (6.25, 3.75), not (5, 5). Verification: u1 / 10 = 6.25/10 = 0.625, u2 / 6 = 3.75/6 = 0.625 (equal fractions). Since (5, 5) does not satisfy this (u1/10 = 0.5, u2/6 ≈ 0.833), the solutions do not coincide. Conceptual error (misdefining KS) and incorrect computation result in 0/3 points.

  **Part (c): Which axiom of the Nash solution does the Kalai–Smorodinsky solution give up, and what property does it satisfy in its place?**  
  **Your answer:**  
  "The Kalai–Smorodinsky solution gives up Nash's independence of irrelevant alternatives. In its place it satisfies individual monotonicity: if one player's maximum attainable payoff increases (everything else fixed), that player's payoff in the solution should not fall. One caveat worth noting: unlike the Nash solution, the KS solution is not invariant to changes in utility units, since it compares each player's gain to their utopian payoff, and the utopian payoff is measured in units."  
  **Feedback:**  
  Correct. The Kalai-Smorodinsky solution gives up the independence of irrelevant alternatives (IIA) axiom, which the Nash solution satisfies. Instead, KS satisfies individual monotonicity (your description is accurate). The caveat about KS not being invariant to changes in utility units (i.e., not invariant under affine transformations) is also correct, as KS depends on the ratio of gains to the utopian payoff, which is sensitive to utility scaling. This is not required for the question but does not detract. Full credit (4/4 points).

  **Summary of Deductions:**  
  - Part (b) lost all 3 points due to a fundamental conceptual error (equating KS with equal absolute gains instead of equal proportional gains) and the resulting incorrect computation.  
  - Parts (a) and (c) are fully correct with no deductions.  
  - Total: 7/10 points.
