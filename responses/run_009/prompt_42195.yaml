     - If they ask "Zoo blork?" (while pointing to both), answer "glub".
     - If they ask "Momo?" while pointing from one rabbit to the other, answer "blek".
  6. When the same rabbit is shown at two different times (separated by an hour) and the linguist uses a token (like a red card) to refer to the earlier rabbit and points to the current rabbit and asks "Momo?", answer "blek".
  7. When a rabbit's part (ear, leg) is pointed to and they ask "Blork?", answer "blek".

  B. Additional scenarios to cover:

  8. When a video of a rabbit is shown (moving) and they point and ask "Blork?", answer "glub" (because it's a rabbit-stage happening now? But the video is not real. We can say blek. Let's say blek to be consistent with picture).
     - So: video of rabbit -> blek.

  9. When a rabbit is moving and they point at two very close moments (using two still frames from a video) and ask "Momo?" (pointing to first frame then second), answer "blek".

  Now, the fresh test in phase 3:

  We present: a rabbit that is hopping, and we point to it at the start of the hop and at the end of the hop (within a few seconds). We ask: "Momo?" (pointing to the start position and then the end position).

  This is not in the crib sheet. We predetermined the answer: "blek".

  Why? Because they are two different stages (for I2) and for I1, we can say that the native doesn't consider it the same if it has moved (auxiliary hypothesis about what counts as the same for "momo").

  So both manuals can account for "blek".

  Timeline for 90 minutes:

  - Introduction (5 mins): Explain the setup. Two students are natives, the rest are linguists. Rules: only pointing and yes/no questions in Blorkish. The natives will only use "glub" and "blek" for answers.
  - Phase 1: Data collection (30 mins): The linguists ask questions. The instructor provides objects/scenarios (live rabbit, dead rabbit, picture, stew, two rabbits, etc.). The natives respond based on the crib sheet. The linguists take notes.
  - Phase 2: Manual writing (15 mins): The linguists form small groups (3-4 students) and write down their translation manual for "blork" and "momo". They should also write down any auxiliary hypotheses.
  - Phase 3: Fresh test (15 mins): The instructor presents the hopping rabbit scenario (or another predetermined new scenario). The natives give the predetermined answer. The groups check if their manual predicts the answer and if it fits.
  - Debrief (25 mins): Discuss the experience, then explain Quine's indeterminacy, mapping the exercise to the concepts.

  Scoring scheme: We don't use real money. We can have a "success" if the group's manual fits the fresh test data. But since both manuals will fit, everyone succeeds. The point is not to score but to show underdetermination.

  Debrief mapping:

  - Stimulus meaning: The set of scenarios and the answers (glub/blek) constitute the stimulus meaning of "Blork?".
  - Assent and dissent: The only evidence is the native's "glub" or "blek".
  - Analytical hypotheses: The linguists had to hypothesize about the meaning of "blork" and "momo", and these hypotheses went beyond the evidence (e.g., rabbit vs. rabbit-stage).
  - The distinction: The exercise shows that the evidence underdetermines the translation manual. But Quine's stronger claim is that no additional evidence can settle it because any evidence can be accommodated by adjusting auxiliary hypotheses. In the game, even when we added new evidence (the fresh test), both manuals could account for it by auxiliary hypotheses. That's the indeterminacy.

  What might go wrong:

  1. Natives improvising: Strictly instruct the natives to follow the crib sheet and not to add any extra information. Have a penalty (e.g., if they improvise, they have to stay silent for one round).

  2. Linguists using English: The natives should only respond to Blorkish questions. If the linguists use English, the natives should look blank and not answer. The instructor can remind.

  3. Someone has heard of gavagai: Before the exercise, ask if anyone knows about Quine's gavagai. If they do, ask them not to reveal and perhaps make them a native speaker.

  Finally, where the design might misfire:

  Students might conclude that translation is hard and we need more data (underdetermination of evidence), not that it is indeterminate in principle.

  To spot this: in the debrief, if a student says, "If we had asked about XYZ, we could have distinguished them," then they missed the point. The point is that for any such XYZ, the answer can be made consistent with both manuals by adjusting auxiliary hypotheses.

  If that happens, the facilitator should explain that in the game, even the fresh test didn't break the tie, and in fact, no test can because the natives' answers are predetermined to be consistent with both. But note: in the game, the facilitator is artificially making them consistent. In reality, Quine claims that the behavioral evidence is such that multiple manuals can be constructed to fit all possible evidence.

  Alternative design: If this doesn't work, we might have to explicitly present the two manuals and show how each can account for any evidence by adjusting auxiliary hypotheses. Or use a written exercise where students are given the crib sheet and are asked to come up with two different manuals that fit it.

  But the experiential part is valuable. So we proceed.

  In conclusion, the exercise may not fully replicate Quine's thesis because it relies on a predetermined crib sheet that is designed to be consistent with both manuals. In reality, Quine's point is that the totality of speech dispositions (which are fixed) can be described by multiple manuals. The gap is that students might think the facilitator rigged it, but the debrief should emphasize that for Quine, the totality of behavioral evidence is fixed and still underdetermined.

  Full materials:

  - Crib sheet for natives (keep secret until debrief):

  ```
  Blorkish Crib Sheet for Natives

  Words you know:
  - blork: [secret meaning, but you don't need to know, just follow below]
  - glub: say this for assent
  - blek: say this for dissent
  - momo: this is used for identity questions
  - zoo: this means "two"

  Rules:
  - Only answer based on the scenario and the question.
  - Do not volunteer any information.
  - If the question is not covered or you don't understand, say "blek" or just remain silent. But try to use the scenarios below.

  Scenarios and how to answer:

  1. When a whole rabbit (alive or dead) is present and the linguist points to the whole rabbit and asks "Blork?" -> "glub"
  2. When no rabbit is present and they point to an empty space and ask "Blork?" -> "blek"
  3. When a picture of a rabbit is shown and they ask "Blork?" -> "blek"
  4. When rabbit stew is shown and they ask "Blork?" -> "blek"
  5. When two whole rabbits are present:
     a. If they point to one rabbit and ask "Blork?" -> "glub"
     b. If they point to the other rabbit and ask "Blork?" -> "glub"
     c. If they ask "Zoo blork?" while pointing to both rabbits -> "glub"
     d. If they ask "Momo?" while pointing from one rabbit to the other (clearly indicating both) -> "blek"
  6. When the same rabbit is shown at two different times (e.g., separated by an hour or more) and the linguist uses a token (like a red card) to refer to the earlier viewing and points to the current rabbit and asks "Momo?" -> "blek"
     Note: The token might be any object that was present at the earlier viewing and is now shown again. If they don't use a token, you may not understand, so "blek".
  7. When a rabbit's part (e.g., ear, leg) is clearly pointed to and they ask "Blork?" -> "blek"
  8. When a video of a rabbit is shown (moving or still) and they ask "Blork?" -> "blek"
  9. When two still frames from a video of a rabbit in motion (taken in quick succession) are shown and the linguist points to the first frame and then to the second frame and asks "Momo?" -> "blek"

  For any other situation not covered, respond with "blek" or remain silent (but preferably "blek" to avoid extra information).
  ```

  - Fresh test scenario (not in the above crib sheet, but predetermined):

     Show a live rabbit hopping from point A to point B. Point to the rabbit at A and then to the rabbit at B (a few seconds later) and ask "Momo?".

     Answer: "blek"

  Timeline:

  - 0-5 min: Introduction and role assignment.
  - 5-35 min: Phase 1 - Data collection. The instructor brings in the scenarios (one by one) and the linguists ask questions. The natives respond. The linguists record.
  - 35-50 min: Phase 2 - Manual writing in small groups.
  - 50-65 min: Phase 3 - Fresh test. The instructor presents the hopping rabbit scenario. The natives answer. The groups see if their manual fits.
  - 65-90 min: Debrief.

  Debrief points:

  1. What were the two main interpretations of "blork" that emerged? (Expect rabbit and rabbit-stage, but they might have others.)

  2. Map to Quine:
     - Stimulus meaning: The patterns of assent and dissent.
     - Assent and dissent: The only behavioral evidence.
     - Analytical hypotheses: The guesses about "blork", "momo", etc., and how they are underdetermined.
     - The fresh test: Even with new evidence, both manuals could account for it by auxiliary hypotheses (e.g., about what "momo" means).

  3. The stronger claim: It's not just that we haven't collected enough data, but that no conceivable behavioral evidence can uniquely determine the translation manual. In the game, we saw that for every piece of evidence, both manuals could be made to fit.

  4. The role of background assumptions (like our ontology) in translation.

  Finally, the part that cannot be reproduced: The exercise uses a finite set of scenarios, but Quine's claim is about the totality of possible behaviors. We have to assert that the crib sheet is designed to represent a complete behavioral disposition that is fixed, and that no future evidence will break the tie.

  If the activity fails (students think they just need more data), the facilitator should stress that in the game, the natives' responses to any new test are predetermined to be consistent with both manuals, and that this is by design to mimic Quine's point that the totality of dispositions is compatible with both.

  If necessary, as an alternative design, provide the students with the full crib sheet (after the activity) and challenge them to come up with two incompatible manuals that fit every entry. Then discuss how they did it by adjusting the auxiliary hypotheses.

  But I hope the activity will work.
answer: |-
  Below is a comprehensive design for your in-class exercise, engineered to force students into confronting Quine's *indeterminacy of translation* (not merely underdetermination) through experiential learning. The exercise simulates a field linguistics scenario with strict behaviorist constraints, includes a secret crib sheet for "native speakers," and culminates in an "empirical equivalence" revelation. I've structured it for clarity, practicality, and philosophical fidelity.

  ---

  ### **Exercise Design: "The Blork Mystery"**
  **Objective:** Students experience how *all possible behavioral evidence* can support two incompatible translation manuals for a single word ("blork"), revealing indeterminacy.

  #### **Materials Needed**
  - **For Natives (2 students):**  
    - A secret crib sheet (printed/hidden) with predetermined answers.  
    - Props: Toy rabbit, rabbit picture, rabbit stew (e.g., broth in a bowl), two identical toy rabbits, clock/timer.  
  - **For Linguists (12 students):**  
    - Notebooks for recording observations.  
    - Rules handout (simplified field-linguistics guidelines).  
  - **Instructor:**  
    - Whiteboard for tracking queries, stopwatch.  
    - Final test scenario (rabbit leg detached surgically in a video).  

  ---

  ### **Rules & Crib Sheet**  
  **Linguist Rules (Admissible Evidence Only):**  
  1. Communicate only through **pointing**, **showing objects**, or **yes/no questions**.  
  2. Natives answer *only* with "glub" (assent) or "blek" (dissent). No gestures, explanations, or English.  
  3. Pre-translated words:  
     - "Blork?" = Target word (e.g., pointing at rabbit).  
     - "Momo?" = "Same?" (e.g., pointing at Rabbit A, then Rabbit B).  
     - "Zoo?" = "Two?" (e.g., holding up two fingers beside rabbits).  
     - "Glub"/"Blek" = Yes/No.  

  **Native Speaker Crib Sheet**  
  *Secret meaning: "Blork" is intentionally ambiguous between "rabbit" (enduring object) and "rabbit-stage" (time-slice). Answers fit both.*  

  | Scenario                                      | Question          | Answer | Why Consistent With Both Manuals |  
  |-----------------------------------------------|-------------------|--------|----------------------------------|  
  | 1. Live rabbit present                        | "Blork?"          | Glub   | Rabbit: Yes. Rabbit-stage: Yes (current stage). |  
  | 2. Dead rabbit present                        | "Blork?"          | Glub   | Rabbit: Yes (same object). Rabbit-stage: Yes (new "dead" stage). |  
  | 3. Rabbit removed; point to empty space       | "Blork?"          | Blek   | Rabbit: Gone. Rabbit-stage: No current stage. |  
  | 4. Picture of rabbit                          | "Blork?"          | Blek   | Rabbit: Not a real rabbit. Rabbit-stage: Not a temporal stage. |  
  | 5. Bowl of rabbit stew                        | "Blork?"          | Blek   | Rabbit: Not a whole rabbit. Rabbit-stage: Not a stage. |  
  | 6. Two live rabbits side-by-side              | "Blork?" (each)   | Glub   | Rabbit: Two rabbits. Rabbit-stage: Two stages. |  
  | 7. Two rabbits: "Zoo blork?" (point to both)  | "Zoo blork?"      | Glub   | Rabbit: Two rabbits. Rabbit-stage: Two stages. |  
  | 8. Two rabbits: "Momo?" (point A then B)      | "Momo?"           | Blek   | Rabbit: Different rabbits. Rabbit-stage: Different stages. |  
  | 9. Same rabbit seen now vs. 5 mins ago (using token) | "Momo?"         | Blek   | Rabbit: *Adjustment*—Natives use "momo" for exact spatiotemporal matches. Rabbit-stage: Always different stages. |  
  | 10. Rabbit hopping: point to start/end positions | "Momo?"         | Blek   | Rabbit: *Adjustment*—Movement breaks "momo". Rabbit-stage: Different stages. |  
  | 11. Rabbit briefly hidden then revealed       | "Blork?" (hidden) | Blek   | Rabbit: Temporarily inaccessible. Rabbit-stage: No current stage. |  
  | 12. Video of rabbit running                   | "Blork?"          | Glub   | Rabbit: *Adjustment*—Natives treat videos as "real" stimuli. Rabbit-stage: Current frame is a stage. |  
  | 13. Freeze-frame of rabbit: "Momo?" vs. live  | "Momo?"           | Blek   | Rabbit: *Adjustment*—Freeze-frames aren’t "alive". Rabbit-stage: Different stages. |  

  **Key Auxiliary Hypotheses Built In:**  
  - "Momo" (same) is *only* for identical spatiotemporal locations (blocks identity over time).  
  - "Zoo" (two) counts stages or objects interchangeably.  
  - Videos count as "present" stimuli (blocks appeal to representations).  

  ---

  ### **Timeline (90 Minutes)**  
  **Phase 1: Data Collection (35 mins)**  
  - **0–5 mins:** Introduce roles. Assign 2 natives (give crib sheet secretly). Linguists receive rules.  
  - **5–35 mins:**  
    - Linguists question natives using props/scenarios (e.g., show rabbit → "Blork?").  
    - Instructor stages scenarios from crib sheet in fixed order (prevents improvisation).  
    - Natives *must* follow crib sheet. Penalty: Sit out if they improvise.  
    - Linguists record all queries/answers.  

  **Phase 2: Manual Writing (20 mins)**  
  - **35–45 mins:** Linguists form 3–4 groups. Draft:  
    - Translation manual for "blork," "momo," and "zoo."  
    - Auxiliary hypotheses (e.g., "What counts as ‘same’?").  
  - **45–55 mins:** Groups share manuals. Instructor lists rival hypotheses (e.g., "rabbit" vs. "rabbit-stage").  

  **Phase 3: Empirical Equivalence Test (15 mins)**  
  - **55–65 mins:** Introduce **fresh test scenario**:  
    - Show video of a rabbit having a leg surgically detached (no blood/gore; focus on leg).  
    - Point to the intact rabbit pre-surgery: "Blork?" → Natives: "Glub."  
    - Point to the same rabbit post-surgery (missing leg): "Blork?" → Natives: "Glub."  
    - Point to the detached leg: "Blork?" → Natives: "Blek."  
  - **65–70 mins:** Groups check manuals:  
    - "Rabbit" manual: Intact/deformed rabbit = "blork"; leg ≠ "blork."  
    - "Rabbit-stage" manual: Pre/post-surgery = distinct stages (both "blork"); leg ≠ stage.  
    - *Both manuals fit all data, including the fresh test.*  

  **Debrief (20 mins)**  
  - **70–90 mins:** Facilitate discussion → map to Quine:  
    | **Exercise Phase**      | **Quinean Concept**                  | **Key Point**                                                                 |  
    |-------------------------|--------------------------------------|-------------------------------------------------------------------------------|  
    | Data Collection         | Stimulus meaning (assent/dissent)    | Evidence limited to behavior under stimulation.                              |  
    | Rival Manuals           | Analytical hypotheses                | Incompatible translations (e.g., "rabbit" vs. "stage") fit the same data.    |  
    | Auxiliary Hypotheses    | Background ontology                  | "Momo" and "zoo" absorb ambiguity (e.g., "same" is redefined to avoid ties). |  
    | Fresh Test              | Empirical equivalence               | *New* scenarios don’t break indeterminacy—manuals still agree on behavior.  |  
    - **Critical Distinction:**  
      - Underdetermination: "We need more data." (e.g., more scenarios *could* distinguish manuals).  
      - Indeterminacy: "No data *can* distinguish them—even in principle." (Auxiliary hypotheses bend to fit *all* evidence).  
    - Reveal "gavagai" and Quine’s thesis: Translation isn’t just "hard"—it’s *radically indeterminate*.

  ---

  ### **What Will Go Wrong & Mitigation**  
  1. **Natives improvising:**  
     - *Risk:* Natives answer consistently (e.g., always "glub" for rabbits).  
     - *Fix:* Strictly enforce crib sheet. Warn: "One off-script answer voids your role." Use simple props to limit creativity.  

  2. **Linguists smuggling English:**  
     - *Risk:* Questions like "Is blork a *whole* rabbit?"  
     - *Fix:* Natives respond to non-Blorkish with silence. Instructor interrupts: "Reformulate in admissible terms."  

  3. **Prior knowledge of gavagai:**  
     - *Risk:* Student spoils ambiguity.  
     - *Fix:* Pre-screening: "Raise hand if you know Quine’s rabbit example." Assign knowers as natives (crib sheet controls them) or observers.  

  4. **Linguists give up early:**  
     - *Risk:* Groups settle on one manual (e.g., "rabbit").  
     - *Fix:* In Phase 2, challenge: "Find *two* incompatible manuals that fit all data." Reward groups that generate rivalry.  

  ---

  ### **Where the Design Misfires (and How to Salvage)**  
  **Core Risk:** Students confuse indeterminacy with underdetermination ("We just needed more data").  
  - **Red Flag in Debrief:** If students say:  
    - "If we’d asked about [X], we could’ve known!"  
    - "The natives were hiding information."  
  - **Why It Misfires:** The exercise *simulates* but cannot *replicate* Quine’s thesis. Students see finite tests, not the *in-principle* totality of behavior. They may miss how auxiliary hypotheses *systematically* absorb counterevidence.  
  - **Salvage Plan:**  
    1. **During Debrief:** Stress that the crib sheet defines *all possible behavioral dispositions*—no "new" test can break the tie.  
    2. **If Students Resist:** Run a meta-exercise:  
       - Give the full crib sheet to all students.  
       - Task: "Write two translation manuals that fit *every entry*, then invent a *new* test scenario."  
       - Reveal that natives’ answers for *any* scenario are predetermined to fit both manuals (e.g., "detached leg?" → "blek" for both).  
    3. **Alternative Design (If This Fails):**  
       - **Abandon Simulation:** Use a **pre-built thought experiment**.  
         - Provide the crib sheet.  
         - Assign groups to defend "rabbit" vs. "rabbit-stage" using *only* the data.  
         - Challenge: "How would you answer [new test]? Defend it *without* appealing to English."  
       - **Why:** Forces students to *construct* auxiliary hypotheses, revealing how evidence underdetermines *but* hypotheses overdetermine outcomes.  

  **The Unbridgeable Gap:**  
  No exercise can *prove* indeterminacy without the facilitator’s authority. Quine’s thesis requires grasping that *all possible behavior* is consistent with rival manuals—a leap from finite data to infinite dispositions. **Be explicit:** "This game *illustrates* but cannot *demonstrate* the thesis. Quine’s argument is that language-learning rests on behavioral evidence, which cannot fix meaning uniquely. The gap between stimulus and ontology is unbridgeable."

  ---

  ### **Debrief Script: Cementing the Thesis**  
  1. **Start with Experience:** "How did it feel when the fresh test *didn’t* break the tie?"  
  2. **Map Concepts:**  
     - Stimulus meaning = What prompted "glub" or "blek."  
     - Assent/dissent = Only behavioral "facts."  
     - Analytical hypotheses = Guesses about "blork/momo" that exceed evidence.  
  3. **Crucial Leap:**  
     - "Underdetermination: We could always gather more data.  
     Indeterminacy: *No* data can fix translation—auxiliary hypotheses bend to fit *any* evidence. This is why Quine says there’s ‘no fact of the matter.’"  
  4. **Sell the Punchline:** "You didn’t just fail to find the right answer—there *is* no right answer. Meaning isn’t in the head; it’s in the manual."

  This design forces confrontation with indeterminacy while preempting retreat to underdetermination. The fresh test is the linchpin—use it to trigger the "aha" moment.
