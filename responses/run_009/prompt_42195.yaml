  - We have a crib sheet for the natives that is designed so that at least two interpretations (e.g., "rabbit", "undetached rabbit part", "rabbit time-slice") are consistent with the same pattern of responses.
  - The crib sheet must also handle attempts to break the tie by asking identity questions ("Is this the same blork as that one?") or counting questions ("How many blorks are here?"). The answers must remain consistent with both interpretations by adjusting auxiliary hypotheses (e.g., about what counts as the same part or same time-slice).

