prompt: |-
  I'm in a philosophy of science reading group that mostly reads pragmatist-adjacent stuff, and one of the grad students has a go-to move I don't know how to answer. Whenever something like Peirce's idea that truth is where inquiry would converge comes up, or when someone asks whether our best physics is "close to the truth" about unobservables, she'll say "truth is not a property" and act like that settles it — as if once you grant that, there's nothing left to be close to, converge on, or correspond to. Last week she also used the same line to dismiss the whole correspondence theory in one breath. My problem is that the slogan is clearly doing a lot of work for her, but as far as i can tell "truth is not a property" could mean a bunch of really different things: from something basically nobody would deny (you can trade an instance of "it's true that snow is white" for "snow is white" without losing anything) to something pretty wild (the word "true" could be dropped from English entirely with no loss, even in sentences like "everything in the report was true," which seems to me like it can't be right, though I can't say why).

  Can you lay out the distinct precise theses the slogan could be standing for, ordered from least to most ambitious? For each one I want to know whether it's plausibly true, whether it's compatible with something like the equivalence between a claim's being true and the world being the way the claim says it is, and — this is the part that matters — whether it would actually support her two moves: brushing off the question of whether a theory approximates the truth, and ruling out correspondence out of hand. If some readings support one move but not the other, say so, and flag which reading she actually needs for each argument to go through, since I suspect they're not the same one. Please answer in American English and format the readings as a numbered list I can bring to the next meeting, because my friend wants to respond to her point by point rather than just waving his hands like she does.
