prompt: |-
  i write a column on science and ideas for a uk paper, and next week i'm doing a short piece on lewis carroll's tortoise dialogue (the one where the tortoise keeps accepting achilles' premises but refusing the conclusion, so achilles has to write down an extra premise every time and it never ends). i want to close the column with a poem, and i keep thinking a sestina is the right form for this bc the six repeating end-words can basically *be* the regress — the same material keeps coming back in slightly different grammatical positions, and the ordering rules of the sestina mean each stanza rearranges the same words without ever getting anything new, which is sort of what the tortoise does to achilles. so: a sestina where the end-words are things like a premise, the tortoise, the conclusion, accept, infer, and one more of your choosing, and the poem should track the actual structure of the problem — the tortoise agrees to each added premise as a fact but won't let it do any work, so the last stanza (the envoi, where the end-words bunch up in pairs) should be the moment the whole thing either snaps shut or admits it can't. please don't have it resolve into "and then the tortoise just agreed" — carroll's version ends with the tortoise winning and achilles stuck, and id like the envoi to keep some of that vertigo. and please write it in british english, since its for a uk readership — no "realize", "programs", etc. a small typo in my prompt above, but you get the idea. maybe 6 proper stanzas plus envoi, standard sestina length, and i'd rather it be a good poem first and a philosophy lesson second, though someone who knows the regress argument should still recognise exactly whats going on.
