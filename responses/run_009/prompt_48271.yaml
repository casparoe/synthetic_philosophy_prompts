  First, I need to tackle Berkeley’s core ideas. His card-table analogy in *Alciphron* is clearly about fiat money: money as a valueless counter relying on shared convention. That’s a direct match to modern "fiat currency" and "unit of account." Then *The Querist*—where he questions intrinsic value, elevates credit over coin, and ties wealth to industry—screams chartalism (state-driven demand via taxes) and endogenous money (credit created by economic activity). His national bank proposal? That’s unsecured central bank liabilities, a primitive version of reserve balances. 

