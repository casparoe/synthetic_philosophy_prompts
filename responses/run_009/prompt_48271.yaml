  The user suspects theology is the key residue, and I agree. But it’s not a *failure* of modern theory—it’s a conscious choice to exclude unmeasurable metaphysics. Berkeley’s "benevolent God" is functionally identical to "credible institutions" in policy terms, but the lens shifts from divine order to institutional psychology. The real insight? Berkeley’s semiotics highlight money’s *relational* nature, which modern theory captures via network effects and coordination games. Nothing is lost except the metaphysics, which economics intentionally sheds. 

  Final note for the user: when translating his national bank, the mapping holds (reserve balances = paper credit), but Berkeley’s lack of operational mechanics (interbank settlement, reserve requirements) shows his limits. His genius was intuiting core principles; the residue is where his philosophy overreaches—or where modern theory’s secular rigor starts. 

