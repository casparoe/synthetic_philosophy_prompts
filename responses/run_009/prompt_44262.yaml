  First, I need to confirm I understand the three camps correctly. Knobe's view is that moral evaluation is built into folk intentionality as a blame-assignment tool. The pragmatics camp (Adams and Steadman) sees it as conversational implicature—people are really judging moral blameworthiness. Machery's camp argues it's about tradeoff endorsement, not norms per se. The user suggests the debate is underdetermined and about the concept's function.  

  For **"What the sides actually claim"**, I'll summarize each camp tightly: Knobe—normative loading is inherent; pragmatics—asymmetry is linguistic artifact; tradeoff camp—causal endorsement drives judgments. I'll keep it under 200 words, using their framing but clarifying nuances.  

  Moving to **"The diagnosis"** (~350 words). The user wonders if this is substantive, verbal, or different questions. I think it's substantive but with a core ambiguity: "intentional action" might be polysemous, serving multiple functions. Knobe focuses on moral responsibility, pragmatics on communication, tradeoff on decision mechanics. The camps aren't just talking past each other—they're offering competing explanations for the same data, but the data doesn't force a choice because each theory can be tweaked (e.g., pragmatics can explain non-moral cases by broadening "conversational goals"). This makes it resistant to simple falsification. The user's "bug-vs-feature" analogy fits: it's about what the concept *should* do, which isn't purely empirical. But it's not *only* that—there are testable differences, like whether non-moral norm violations (e.g., etiquette) trigger asymmetry, which pragmatics might struggle with if they only focus on morality.  

  For **"What would count as progress"** (~250 words), I'll suggest concrete steps:  
  - A study isolating "endorsement" vs. "norm violation" (e.g., an agent knowingly causes a *good* side effect that violates a norm, like breaking curfew to save a life).  
  - Probing if people distinguish between "did he intend it?" and "is he blameworthy?" in surveys.  
  - Or reformulating the question: stop asking "which theory wins?" and instead map contexts where each mechanism dominates. Progress might mean dissolving the question by showing intentionality is a cluster concept.  

  **"Honest odds"** (~100 words): I'll say <30% chance of resolution in 20 years because the ambiguity runs deep. Even with new studies, theorists can absorb results into their frameworks (e.g., Knobe might call etiquette cases "quasi-moral"). The field might shift to studying how concepts are deployed flexibly, not seeking a grand theory.  

  I'll challenge the user's framing slightly: it's not *just* about purpose; there are empirical hooks, but they're tangled with conceptual issues. Overall, I'll validate their intuition that the debate is stuck but push for nuanced optimism—progress might look like refinement, not resolution.
answer: |-
  Here’s your diagnosis, structured as requested:

  ---

  ### **What the sides actually claim**  
  - **Knobe’s Camp**: Folk intentionality is *inherently normative*. Moral evaluation directly shapes judgments because the concept’s core function is blame assignment. Harm is judged "intentional" not despite the chairman’s identical mental state in both cases, but *because* of the norm violation’s salience.  
  - **Pragmatics Camp**: The asymmetry is *linguistic*. "Intentionally" implies moral condemnation in context. People don’t misattribute intention; they use the term pragmatically to signal blame (e.g., denying "intentional harm" sounds like excusing immorality).  
  - **Tradeoff-Endorsement Camp**: The key is *causal endorsement*, not norms. Harm is "intentional" when the agent knowingly accepts a negative outcome as a cost of their goal (e.g., "harming environment for profit"). Identical tradeoff structures in non-moral scenarios (e.g., breaking a printer to fix a computer) replicate the effect.  

  ---

  ### **The Diagnosis**  
  This is **partly a substantive disagreement but mostly a clash of explanatory frameworks**, amplified by conceptual ambiguity. All three camps agree the asymmetry exists and involves norm sensitivity, but they diverge on *where* the asymmetry originates:  
  - **Substantive core**: Each makes distinct claims about cognitive architecture. Knobe posits moral evaluation as constitutive of intention; pragmatics treats it as a post-hoc communicative filter; tradeoff theory roots it in decision mechanics (endorsing costs). These *could* be empirically distinguished (e.g., neural correlates of "endorsement" vs. "blame").  
  - **Ambiguity in the spec**: The dispute centers on **what "intentional action" is for**. Knobe sees it as a blame-tracking tool; pragmatics as a conversational signal; tradeoff theory as a descriptor of practical reasoning. Asking "which is correct?" is like asking whether a code module is "really" for security or logging—its purpose depends on context.  
  - **Underdetermination**: Vignettes alone can’t resolve this because each theory can absorb anomalies. For example, Knobe reinterprets non-moral asymmetries (e.g., violating etiquette) as "quasi-moral," pragmatics expands "conversational goals," and tradeoff theory generalizes "endorsement." The bug-vs-feature framing is apt: without agreement on the *purpose* of intentionality ascriptions, data won’t force consensus.  

  ---

  ### **What would count as progress**  
  Resolution requires **disambiguating the explanandum** or **finding theory-specific predictions**:  
  1. **Isolate mechanisms**: Design experiments decoupling *moral evaluation*, *tradeoff endorsement*, and *pragmatic pressure*. For example:  
     - Test if people attribute "intention" when an agent *endorses a cost* (e.g., "I accept this harm") but violates no norm (e.g., harming something valueless).  
     - Measure implicit judgments (e.g., reaction times) to bypass pragmatic signaling.  
  2. **Reframe the question**: Shift from "What *is* intentionality?" to "**When do we deploy which concept?**" Evidence suggests people use distinct criteria for blame, mind-reading, or predicting behavior. Mapping these contexts could dissolve the debate.  
  3. **Cross-disciplinary validation**: If tradeoff endorsement correlates with neural signatures of cost-benefit computation (e.g., in prefrontal cortex), while Knobe’s view aligns with moral-network activation, progress emerges. Absent such distinctions, stagnation is likely.  

  ---

  ### **Your honest odds**  
  **<30% chance of resolution in 20 years.** The ambiguity is foundational, and empirical advances (e.g., neuroimaging, cross-cultural studies) have only fueled all sides. Progress likelier comes from **reformulating the question** (e.g., "How do multiple concepts of intention interact?") than declaring a winner. The field may converge on a pluralistic model where all three factors play context-dependent roles—but "resolving" the dispute? Unlikely.  

  ---

  **On your framing**: Your bug-vs-feature analogy is spot-on. The "spec" for folk intentionality is contested, making this less about data and more about what we *want* the concept to do. Disagreement is functional, not just empirical.
