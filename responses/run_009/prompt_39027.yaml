prompt: |-
  I do risk analysis at a small think tank that gets contracted by a government office to write medium-term forecasts — energy, pandemics, great-power conflict, that sort of thing. Nothing classified, just structured judgment, and we deliver maybe six reports a year. Increasingly my colleagues' drafts are full of reasoning that I've come to realize is self-locating belief dressed up as ordinary updating, and nobody here has a rule for when it's allowed. Examples that have actually come up in drafts: (a) someone lowered our estimate of great-power war because humanity has survived 70 years with nuclear weapons, so the annual risk must be lower than the modelers fear — survivorship treated as evidence of safety; (b) a paragraph that dragged our forecast of civilizational lifespan way down by appealing to a version of the doomsday argument, on the grounds that we find ourselves early in the human sequence; (c) a pandemic chapter that reasoned roughly 'given that I'm observing this outbreak at all, it's more likely to be a big one', which is basically the logic that makes the Sleeping Beauty problem disagree with itself depending on whether you count experiments or awakenings.

  So here's the ask: turn whatever the philosophy of anthropic and self-locating reasoning has actually settled — plus whatever it hasn't — into a procedure I can run on a draft paragraph in fifteen minutes. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a 'strike this inference', and where it has to hand the call back to a human because the question is one of values or of choosing between frameworks rather than of facts. I want the distinctions that must survive simplification to survive: plain evidence vs. indexical evidence, whether the observer was guaranteed to be around to make the observation (the reason survival data can be treacherous — you only hear from the worlds that got to write the report), whether the sampling setup is more like one experiment or many awakenings, and the fork where a draft has to either flag its assumption or drop the inference entirely. And be honest about which steps of my so-called procedure are really judgment calls in a costume.

  One constraint: our director signs off on every report, and she has zero patience for jargon, so the procedure can't require whoever runs it to know what any of the abbreviations stand for — it has to be self-contained, a checklist a smart person with no philosophy background can follow.

  Then run it on three cases. First, the nuclear-survival inference in (a). Second, the doomsday-argument paragraph in (b) — and include one where the procedure gives an answer I won't like, because I suspect it's that our near-miss anecdotes can't straightforwardly lower our war estimates, and I'd rather find that out now than in review. Third, the outbreak-observation reasoning in (c). Finally, tell me plainly what the procedure can't do at all — where this whole body of theory is silent and the honest move is a footnote saying so, not a paragraph pretending otherwise.
reasoning: |-
  We are creating a procedure for evaluating self-locating and anthropic reasoning in draft paragraphs. The procedure must be a checklist that a smart person without a philosophy background can follow in about 15 minutes per paragraph. It should avoid jargon and be self-contained.

  The key issues to address:
  1. Distinguish between plain evidence (objective facts) and indexical evidence (which depends on the observer's identity, location, or time).
  2. Check whether the observer was guaranteed to be able to make the observation (i.e., in scenarios where only survivors can report, survival data is biased).
  3. Determine the sampling setup: is it one experiment (one shot) or multiple observations (like awakenings in Sleeping Beauty)?
  4. If the reasoning is found to be problematic, the draft must either flag the assumption or drop the inference.

  The procedure should have steps that are as objective as possible, but we must acknowledge where judgment calls are required.

  We'll design the procedure as a series of questions. If at any point the answer indicates a problem, we flag the inference and either require a fix (like adding a note about the assumption) or removal. Some steps may require human judgment because they involve values or choosing between frameworks.

  **Procedure: Checklist for Anthropic and Self-Locating Reasoning**

  **Step 1: Identify the key inference.**
     - What is the claim being made? What evidence is used to support it?
     - *If you cannot clearly state the claim and the evidence, flag the paragraph as unclear and stop.*

  **Step 2: Check for indexical evidence.**
     - Does the evidence include or rely on the fact that the observer is in a particular place, time, or situation? (e.g., "we observe that we are alive now", "this outbreak is happening during my lifetime", "I am an early human")
     - *If no, then the reasoning may be based on plain evidence and does not require this procedure. You can skip the rest, but be cautious about Step 3.*
     - *If yes, proceed to Step 3.*

  **Step 3: Check for survival/observation bias.**
     - Could the evidence have been observed only in worlds where the observer exists? (e.g., we can only observe that we have survived nuclear weapons if we are alive; we can only observe an outbreak if we are around during one)
     - *If no, proceed to Step 4.*
     - *If yes, then note that the evidence might be biased. This is a red flag. Proceed to Step 4 but with caution.*

  **Step 4: Determine the sampling setup.**
     - Consider: Is the situation more like:
          (A) A single trial (or a fixed number of trials) that could have had different outcomes? (e.g., a coin flip, a single pandemic outbreak that we are observing)
          (B) Multiple observations from the same trial (e.g., multiple awakenings in Sleeping Beauty, or multiple observers in the same world) OR multiple trials (e.g., many outbreaks over time, many years of nuclear standoff)?
     - *This step requires judgment. The key is to think about whether the evidence comes from one "run" of the experiment (which might have multiple observations) or from independent runs. If you are unsure, note that the inference may be problematic and proceed to Step 5.*

  **Step 5: Evaluate the inference.**
     - Based on Steps 2-4, does the reasoning seem to treat indexical evidence as if it were plain evidence?
     - Does the reasoning account for the possibility that the observation was guaranteed to occur (or was more likely in some scenarios) because of the way the observer is sampled?
     - Specifically, if the sampling setup is like multiple observations (Step 4B), then the weight of the evidence might be different than if it were a single trial.

     Common pitfalls:
     - **Survivorship bias:** Using the fact of survival as evidence of low risk without accounting for the fact that you only observe in worlds where survival occurred. (This is a problem in Step 3 and Step 4 might also be relevant.)
     - **Self-sampling without correction:** Using the fact of being in a particular position (like early in a sequence) to infer the total duration, without considering that there might be more observers in long-lasting civilizations (if that's the case) or without accounting for the selection effect.

     *If the reasoning falls into one of these pitfalls, then the inference is invalid as stated. The draft must either:*
        - *Remove the inference, OR*
        - *Add a clear note that the inference relies on a specific (and controversial) assumption about self-locating probabilities and that alternative assumptions could lead to different conclusions.*

  **Step 6: Judgment call on framework choice.**
     - Some questions in anthropic reasoning do not have settled answers in philosophy. If the inference is central to the argument and the procedure has identified a potential issue but there are multiple defensible approaches, then:
          - The draft must explicitly state the assumption being made (e.g., "using the self-sampling assumption" or "assuming that our observation is a random sample from all possible observers").
          - Alternatively, if the team does not wish to take a stand, remove the inference.

     *Note: This step acknowledges that sometimes the choice of how to handle self-locating evidence is a matter of ongoing debate. The procedure requires that such choices be made explicit.*

  **Summary of Outcomes:**
     - If the procedure finds no indexical evidence (Step 2: no), then the reasoning is probably fine (but still check for other biases).
     - If indexical evidence is used and the procedure flags a problem (Steps 3, 4, or 5), then the inference must be fixed (by adding a note) or removed.
     - If the issue is in Step 6 (framework choice), then the draft must explicitly state the assumption.

  Now, we run the procedure on the three examples.

  ---

  **Example (a): Nuclear survival inference**

  Claim: The annual risk of great-power war is lower than modelers fear because humanity has survived 70 years with nuclear weapons.

  Evidence: We have survived 70 years without a nuclear war.

  **Step 1:** Clear: claim is about lowering risk estimate; evidence is 70 years of survival.

  **Step 2:** The evidence is indexical: we observe that we (humanity) have survived until now. (Yes)

  **Step 3:** Survival bias: We can only observe that we have survived if we are alive. (Yes) -> Red flag.

  **Step 4:** Sampling setup: We are considering one long trial (the history of nuclear weapons) with multiple years. Each year is a trial? But note: we are observing 70 years of consecutive survival. This is a single run: we are in one timeline. However, the risk is per year. But the observation is that we have survived 70 years without a catastrophe. This is one data point (one civilization) with 70 years of survival. It is not multiple independent trials. (Set to A: one trial with multiple observations? But note: we are not observing multiple catastrophes or non-catastrophes in the same world. We have one sequence of 70 successes. So it is one long sequence of 70 trials? But they are not independent because the world state evolves. However, the key is that we are observing a run of 70 successes. The sampling setup is one civilization that we are part of, and we are looking at the entire run. We are not sampling from multiple civilizations. So it's more like one experiment (the history of our civilization) and we are at a particular point in it.

  But note: we are not observing from a random year in the history. We are observing from the 70th year of the nuclear age. This is a biased sample because we are necessarily in a year after 70 years of survival. So Step 4 is tricky. However, the main issue is that we are conditioning on having survived until now.

  **Step 5:** The reasoning does not account for the fact that we are necessarily in a world that has survived 70 years. Therefore, the observation of survival is guaranteed in any world that has survived this long. It does not tell us about the risk in worlds that did not survive. This is classic survivorship bias. The inference is invalid without a correction. The draft must either remove this inference or add a note that this reasoning is subject to survivorship bias and that the risk could be higher than it appears because we are only observing the worlds that survived.

  **Verdict for (a):** Strike the inference or add a note about survivorship bias.

  ---

  **Example (b): Doomsday argument**

  Claim: The forecast of civilizational lifespan is lowered because we find ourselves early in the human sequence (i.e., among the first X billion humans).

  Evidence: We are among the first, say, 100 billion humans (rather than in the trillions).

  **Step 1:** Clear: claim is that the civilization will end sooner; evidence is our birth rank.

  **Step 2:** The evidence is indexical: our position in the human sequence. (Yes)

  **Step 3:** Observation bias: We can only observe our birth rank if we exist. But note: our birth rank is fixed by when we are born. We are guaranteed to have a birth rank. So this is not a survival issue per se, but it is self-locating. (No, because we are not conditioning on survival but on our birth rank. However, we are using our birth rank to update on the total number of humans that will ever exist, which is a survival issue for the species.) But note: we are alive at a time when the total number of humans that have lived is about 100 billion. We are not observing the end of humanity. So we are in the set of observers that exist before the end. This is a form of observation bias: we are necessarily in the early part if the civilization ends soon, but if the civilization lasts long, we are still in the early part? The key is that we are randomly sampling from all humans that will ever live? The doomsday argument assumes we are a random sample.

  **Step 4:** Sampling setup: We are considering the entire sequence of humans that will ever live. We are one observer randomly selected from all humans. This is multiple observers (all humans) and we are one of them. So it is multiple observations? Actually, we are one observation (our birth rank) from the set of all humans. The setup is that we are a random sample from the set of all humans that ever live.

  **Step 5:** The reasoning is the classic doomsday argument. However, note that the doomsday argument is controversial. It relies on the self-sampling assumption (that we are a random observer from the reference class of all humans). But there are other reference classes (e.g., all conscious beings) and other assumptions. Also, note that if the civilization lasts a long time, there will be more observers, so we are more likely to be in a long-lasting civilization? But the doomsday argument says that if there are many more humans in the future, it is unlikely we would be so early. However, the argument is not universally accepted. Therefore, the inference is not settled.

  **Step 6:** This is a judgment call on framework. The draft must either remove the inference or add a note that the reasoning is based on the controversial doomsday argument and that alternative assumptions (such as not using a self-sampling assumption or using a different reference class) could lead to the opposite conclusion.

  **Verdict for (b):** The inference must be flagged as controversial and the assumption stated, or removed.

  ---

  **Example (c): Pandemic outbreak observation**

  Claim: Given that we are observing an outbreak at all, it is more likely to be a big one.

  Evidence: We are observing an outbreak.

  **Step 1:** Clear: claim is that the outbreak is more likely to be big because we are observing it; evidence is that we are observing an outbreak.

  **Step 2:** The evidence is indexical: we are observing the outbreak (so we are in a time and place where an outbreak is happening). (Yes)

  **Step 3:** Observation bias: We can only observe an outbreak if we are around during one. (Yes) -> Red flag.

  **Step 4:** Sampling setup: This is tricky. Consider:
     - There are many possible outbreaks (over time and across the world). We are observing one outbreak. But note: we are not randomly sampling outbreaks. We are observing one outbreak that happens to occur during our lifetime and in a place we are monitoring. Alternatively, we might be thinking of one outbreak that we are in the middle of. The reasoning in the example is similar to the Sleeping Beauty problem: if we are awakened and told that we are in an experiment, we might update on the coin flip because we are being awakened. Similarly, if we are observing an outbreak, we update on the severity because we are observing it.

     The key: are we considering this outbreak as one instance of many, or as one big experiment? The claim implies that by the fact of observation, we are more likely to be in a big outbreak. Why? Because if the outbreak is big, then it is more likely to be observed? But wait: we are already observing it. The reasoning is: if there were many small outbreaks, we might not be observing any particular one? But that doesn't hold because we are observing one. Alternatively, the reasoning might be: big outbreaks are more likely to be noticed and observed than small ones. But that is not self-locating; that's about detectability.

     However, the problem states: "given that I'm observing this outbreak at all". This is self-locating because it conditions on the fact that we are in an outbreak. The claim is that conditional on being in an outbreak, it is more likely to be a big one. Why? Because if there are more outbreaks, then we are more likely to be in one? But that doesn't directly say anything about the size of the outbreak we are in. Alternatively, the reasoning might be: in a world with many outbreaks, we are more likely to be in a big outbreak because big outbreaks affect more people? That is, we are more likely to be an observer in a big outbreak because there are more observer-moments in big outbreaks.

     This is exactly the structure of the Sleeping Beauty problem: if we count by observer-moments, then we are more likely to be in a big outbreak. But if we count by outbreaks, then each outbreak is equally likely? So the sampling setup is by observer-moments (multiple awakenings) or by outbreaks (single trials)?

     Therefore, the setup depends on whether we are sampling by outbreaks or by the experience of being in an outbreak. If we are sampling outbreaks, then each outbreak is an independent event, and we are in one. But if we are sampling our experiences, then we are more likely to be experiencing a big outbreak because there are more such experiences.

     This is a judgment call: what is the appropriate reference class? (Step 6)

  **Step 5 and 6:** The inference is controversial because it depends on the reference class. The draft must either remove the inference or state the assumption (e.g., "assuming that we are a random observer-moment in the history of outbreaks, then the outbreak we are observing is more likely to be a big one"). Without that, it's invalid.

  **Verdict for (c):** The inference must be flagged with the assumption about the reference class or removed.

  ---

  **What the procedure can't do:**

  1. **Resolve fundamental philosophical disagreements.** For example, the doomsday argument and the choice of reference class in the pandemic example are not settled. The procedure can only require that the assumptions be made explicit.

  2. **Provide a definitive answer when the sampling setup is ambiguous.** It requires the user to make a judgment about the setup (Step 4) and the reference class (Step 6). If the user is unsure, the procedure says to err on the side of caution and flag the inference.

  3. **Handle complex cases where multiple self-locating beliefs interact.** The procedure is designed for a single paragraph and a single inference. Complex arguments might require more detailed analysis.

  4. **Replace domain expertise.** The procedure only checks for anthropic and self-locating biases. Other flaws (e.g., statistical errors, domain-specific mistakes) are not covered.

  5. **Assign probabilities.** It can only point out when the reasoning is problematic, not fix it with the correct probability.

  **Final Note:** The procedure is a tool to catch the most common pitfalls. It does not guarantee correctness but helps avoid obvious errors. The user must still think critically about the reasoning.
answer: |-
  Below is a self-contained, jargon-free checklist procedure for evaluating self-locating and anthropic reasoning in draft paragraphs. It's designed to be run in **15 minutes** by a smart non-philosopher, using plain language. The procedure flags inferences where indexical evidence (e.g., "I exist," "I observe this now") is improperly treated as plain evidence (objective facts), and helps identify survivorship bias, sampling errors, or framework disputes.

  ---

  ### **Checklist Procedure: Evaluating Self-Locating Reasoning**  
  *Run these steps in order. Answer each question based on the paragraph. If you hit a "STOP" condition, flag the inference for removal or a footnote.*

  1. **Identify the Core Inference**  
     *Question: What is the claim, and what evidence is used?*  
     - *Sufficient answer:* Clearly state the claim (e.g., "risk is lower") and the evidence (e.g., "we survived 70 years").  
     - *If unclear:* STOP. The paragraph needs rewriting for clarity.  
     - *Judgment call?* No (objective).  

  2. **Check for Indexical Evidence**  
     *Question: Does the evidence depend on the observer's identity, location, or time? (e.g., "I am here," "we survived," "I see this event")*  
     - *Sufficient answer:*  
       - **Yes** → Proceed to Step 3.  
       - **No** → Reasoning is likely safe. Skip to Step 6.  
     - *Judgment call?* Minimal (e.g., "we survived" is indexical; "nuclear weapons exist" is plain).  

  3. **Survivorship Check**  
     *Question: Could this evidence only be observed by someone who "survived" or was present? (e.g., you must be alive to report survival; you must exist to observe an event)*  
     - *Sufficient answer:*  
       - **Yes** → Red flag. Proceed to Step 4.  
       - **No** → Proceed to Step 4.  
     - *Judgment call?* No (e.g., survival data always requires a survivor).  

  4. **Sampling Setup Test**  
     *Question: Is the evidence from a setup like...*  
     - **A: One experiment with one outcome?** (e.g., a single coin flip, a unique historical event).  
     - **B: Many observations/awakenings?** (e.g., repeated trials, or scenarios where one event creates many observers).  
     - *Sufficient answer:* Choose A or B. If uncertain, default to B (more common for anthropic errors).  
     - *Judgment call?* **Yes** (requires interpreting the scenario; e.g., "observing an outbreak" could be A or B).  

  5. **Validity Assessment**  
     *Question: Does the inference ignore that indexical evidence is biased?*  
     - *Apply these rules:*  
       - If Step 3 = **Yes** and Step 4 = **A**: The inference is **invalid** (survivorship bias). STOP. Strike or footnote.  
       - If Step 3 = **Yes** and Step 4 = **B**: The inference **requires framework choice**. Proceed to Step 6.  
       - If Step 3 = **No**: The inference **may be valid** unless Step 4 shows issues. Proceed to Step 6.  
     - *Judgment call?* No (rules-based).  

  6. **Framework Check**  
     *Question: Does the claim rely on assuming how observers are "sampled"? (e.g., that we are "typical" or random)*  
     - *Sufficient answer:*  
       - **Yes** → This is a **values/framework choice**. STOP. The inference needs a footnote disclosing the assumption.  
       - **No** → The reasoning is likely safe.  
     - *Judgment call?* **Yes** (e.g., "typical observer" assumptions are subjective).  

  **Output Options**  
  - **STOP conditions:**  
    - Step 1 (unclear), Step 5 (invalid), or Step 6 (framework choice) → Remove the inference or add a footnote like: "This inference depends on controversial assumptions about observation bias; treat with caution."  
  - **Proceed:** No issues found.  

  ---

  ### **Procedure Applied to Your Cases**  
  I ran the checklist on your three examples. Assumptions are based on common philosophical consensus (e.g., survivorship bias is invalid; doomsday arguments require framework choices).

  #### **Case (a): Nuclear Survival Inference**  
  *Claim: Lowered risk of great-power war because humanity survived 70 years with nukes.*  
  1. **Core Inference:** Claim = "annual war risk is lower." Evidence = "70 years of survival." (Clear ✅)  
  2. **Indexical Evidence?** Yes ("we survived"). → Proceed.  
  3. **Survivorship Check?** Yes (only survivors report). → Red flag.  
  4. **Sampling Setup?** **A: One experiment.** (Humanity’s nuclear era is a single historical sequence; no independent trials.)  
  5. **Validity Assessment:** Step 3=Yes + Step 4=A → **Invalid** (survivorship bias). STOP.  
     - **Verdict:** Strike the inference or footnote: "Survival data cannot lower risk estimates; it only reflects worlds where catastrophe hasn’t occurred."  

  #### **Case (b): Doomsday Argument**  
  *Claim: Lowered civilizational lifespan because "we" are early in human history.*  
  1. **Core Inference:** Claim = "civilization will end sooner." Evidence = "we are among early humans." (Clear ✅)  
  2. **Indexical Evidence?** Yes ("we are early"). → Proceed.  
  3. **Survivorship Check?** No (we can observe our earliness without "surviving" extinction). → Proceed.  
  4. **Sampling Setup?** **B: Many observations.** (All humans are "observers"; we are one of many in a sequence.)  
  5. **Validity Assessment:** Step 3=No + Step 4=B → Proceed to Step 6.  
  6. **Framework Check?** Yes (assumes we are a "random" human, implying short lifespan). → **Framework choice required.** STOP.  
     - **Verdict:** Footnote: "This assumes humans are randomly sampled from all time; this is disputed and may not hold." (You won’t like this—it means the inference is too shaky for a confident claim.)  

  #### **Case (c): Pandemic Outbreak Observation**  
  *Claim: An observed outbreak is more likely to be a big one because "we observe it."*  
  1. **Core Inference:** Claim = "outbreak is likely severe." Evidence = "we observe it." (Clear ✅)  
  2. **Indexical Evidence?** Yes ("we observe this outbreak"). → Proceed.  
  3. **Survivorship Check?** Yes (only observable outbreaks can be reported). → Red flag.  
  4. **Sampling Setup?** **B: Many observations.** (If outbreaks are frequent, observing one is like an "awakening" in a long sequence; big outbreaks have more "observer moments.")  
  5. **Validity Assessment:** Step 3=Yes + Step 4=B → **Requires framework choice.** Proceed to Step 6.  
  6. **Framework Check?** Yes (assumes our observation is a random sample from all outbreaks). → **Framework choice required.** STOP.  
     - **Verdict:** Footnote: "This assumes our observation is randomly sampled from all possible outbreaks; other frameworks disagree."  

  ---

  ### **What the Procedure Can't Do**  
  **1. Resolve framework disputes:** Philosophy hasn’t settled debates like the doomsday argument or Sleeping Beauty. The procedure only flags these for disclosure.  
  **2. Handle pure values questions:** If risk tolerance or ethical weights affect the inference (e.g., "we should ignore near-misses because they’re survivable"), that’s beyond the procedure.  
  **3. Assign probabilities:** It checks reasoning validity but can’t calculate correct probabilities (e.g., it won’t fix flawed math).  
  **4. Cover all biases:** It focuses on self-locating errors. Other issues (e.g., cognitive biases, data gaps) need separate review.  

  **Final Advice:** Use this to catch 80% of issues quickly. For borderline cases (e.g., Step 4 judgments), err on caution and footnote. Your director will appreciate the transparency—no jargon, just clear flags for "this is shaky." When in doubt, the procedure’s output is: "If it’s anthropic and unsourced, it’s probably overreaching."
