  I'm a final-year student, and this semester I'm taking an elective on decision theory as part of my degree; so far we've covered expected utility and risk aversion, and I have a persistent feeling that a question I've run into at home is exactly the sort of thing the course is building toward, though I can't yet say how. The question concerns my grandfather's violin, which I inherited two years ago. The family story, which he told me himself many times, is that it is the work of a well-known nineteenth-century French maker, acquired decades ago from a colleague in the orchestra he played in. I would never sell it under any circumstances — it is the object I most associate with him — and I play it weekly, carrying it to university orchestra rehearsals in a soft case on my bike. When the luthier who recently adjusted the bridge noticed the label, he suggested that for around €400 plus insured shipping I could have the instrument authenticated by a specialist abroad.

  My sister is against it. Her view is that the answer cannot change anything I do: if the instrument is genuine, I keep it and play it exactly as I do now; if it turns out to be a relabelled workshop copy, the violin will sound the same, but the story I have loved all my life will curdle, and I will have paid €400 to bring that about. A friend of mine takes the opposite line: I should always find out what I own, and, he adds, if the label is right the instrument could be worth more than our flat, in which case our ordinary contents insurance would almost certainly not cover it and I would want to know that. I notice that my sister's argument assumes the result cannot change anything I do, while my friend's assumes that knowing is good regardless of that — and I cannot tell which assumption is doing the work, or whether both of them miss the point. Is there a principled way to decide when it is worth paying to find something out when you already know what you are going to do?

  Please answer in two parts. First, a plain-prose assessment of the situation. Then a JSON object with exactly the following fields: "structure", a single sentence describing the general form my situation takes, without the violin details; "principle", the rule that settles cases of this form, stated in ordinary language; "sister_verdict" and "friend_verdict", each an object of the form {"verdict": one of "right", "wrong", or "partly right", "reason": a brief justification}; "missed_by_both", a list of considerations that could actually change what I do or how the instrument figures in my life, which neither my sister nor my friend brought up; "recommendation", one or two sentences on what I should do; and "confidence", a number between 0 and 1.
