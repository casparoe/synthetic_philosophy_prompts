  I need to address each part of the friend's summary. Let me start with Lewis's actual position. Lewis is a modal realist: possible worlds are concrete entities, spatiotemporally isolated. Each object is world-bound, so the user exists only in the actual world. Counterparts are distinct individuals in other worlds that resemble them, explaining de re modality. So the friend is right that the user doesn’t exist in other worlds. But where the friend goes wrong is saying the user wasn’t capable of other things. Lewis isn’t denying that the user has potentialities; he’s explaining how modality works via counterparts. The user's capabilities are grounded in counterpart relations—so it's still about them, just indirectly.

