  Comparing Kripke and Lewis: Kripke uses possible worlds as abstract ways things could be, where the same object exists in multiple worlds. This is transworld identity. The friend says it’s the same as Lewis but different notation, but that's incorrect. They’re fundamentally different: Lewis has concrete worlds with counterpart relations, while Kripke has abstract worlds with transworld identity. These are rival metaphysics with different implications for identity, modality, and essence. For example, Kripke allows essential properties that hold across all worlds for an object, but Lewis doesn’t—counterparts might lack those properties. So they can disagree on specific modal claims.

