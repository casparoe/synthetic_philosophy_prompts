  ### Decision Tree: The Analytic–Synthetic Distinction  
  **Starting Question:** Is there a philosophically significant notion of a sentence that is true solely in virtue of its meaning, as opposed to partly in virtue of how the world is? (Use "all bachelors are unmarried" as a reference point.)

  ---

  #### Branch Nodes  
  1. **When you consider "all bachelors are unmarried," does it strike you as true *only* because of what the words mean, with no contribution from how the world happens to be?**  
     - **Yes** → Go to Node 3.  
     - **No** → Go to Node 2.  

  2. **For Node 1 (No): Competent speakers never dispute "all bachelors are unmarried." Is this best explained *without* invoking meaning-based truth—e.g., by the sentence's deep entrenchment in our web of belief and the absence of any practical challenge?** (Case v: Agreement as evidence)  
     - **Yes** → Leaf (a): Quinean eliminativism.  
     - **No** → Leaf (e): Quietism.  

  3. **For Node 1 (Yes): Does "nothing can be red and green all over at once" strike you as the *same kind* of truth as "all bachelors are unmarried"—i.e., true solely in virtue of meaning?** (Case i: "Red and green" as a test)  
     - **Yes** → Go to Node 4.  
     - **No** → Go to Node 4.  
       *(Note: Answering "No" implies you see "red and green" as different—e.g., involving facts about color space or perception—but this doesn’t yet branch the tree.)*  

  4. **Can stipulative definitions (e.g., an investigator legislating that "man" shall mean "rational animal") create truths that are analytic *only relative to the framework* that adopts the stipulation?** (Case ii: Stipulative synonymy)  
     - **Yes** → Leaf (c): Carnapian conventionalism.  
     - **No** → Go to Node 5.  

  5. **When we call a sentence analytic, are we primarily claiming that its truth is *grounded solely in meaning* (e.g., "bachelors are unmarried" must be true if the words mean what they do), or that *grasp of its meaning alone suffices for being justified in believing it* (e.g., understanding "bachelor" guarantees you know bachelors are unmarried)?**  
     - **Grounded solely in meaning (metaphysical conception)** → Go to Node 6.  
     - **Grasp of meaning justifies belief (epistemic conception)** → Leaf (d): Epistemic reconception.  

  6. **Consider Kripke’s "water is H₂O": it is necessary (true in all possible worlds) but knowable only a posteriori (through empirical investigation). Does this show that *analyticity cannot be defined* as truth solely in virtue of meaning, since such truths would have to be both necessary and a priori?** (Case iv: Necessary a posteriori)  
     - **Yes** → Leaf (b): Grice–Strawson status-quo defense.  
     - **No** → Leaf (b): Grice–Strawson status-quo defense.  
       *(Note: Both answers lead to (b) because this view treats the distinction as intelligible despite challenges like Kripke’s.)*  

  ---

  #### Leaves and Their Awkward Commitments  
  - **(a) Quinean eliminativism**: Must bite the bullet that even logical truths (e.g., "no unmarried man is married") are not fundamentally different from empirical beliefs—just more centrally entrenched in our web of belief, and revisable under extreme pressure.  
  - **(b) Grice–Strawson status-quo defense**: Must bite the bullet that some sentences traditionally counted as analytic (e.g., "cats are animals") could turn out false without threatening the distinction, potentially narrowing the class to uncontested cases like "bachelors."  
  - **(c) Carnapian conventionalism**: Must bite the bullet that there is no absolute fact about meaning or analyticity—e.g., "all men are rational animals" is analytic only if you adopt a framework where "man" is stipulated to mean that, making disputes about meaning purely pragmatic.  
  - **(d) Epistemic reconception**: Must bite the bullet that a sentence like "water is H₂O" (if treated as analytic under this view) could be necessary but a posteriori, severing the traditional link between analyticity and the a priori.  
  - **(e) Quietism**: Must bite the bullet that the century-long debate between Quine and his opponents is a non-substantive verbal disagreement, with both sides equivocating on "meaning," despite the apparent depth of the conflict.  

  ---

  #### Indistinguishable Pairs and Further Questions  
  This tree cleanly separates all five leaves. However, some pairs might *coincidentally* give identical answers at every node due to overlapping views. To distinguish them, ask a further question not on the tree:  
  - **Carnapian (c) vs. Grice–Strawson (b)**: Both might answer "No" at Node 4 (rejecting framework-relativity) and "Grounded solely in meaning" at Node 5. *Pull them apart* by asking: **"When we discover that a sentence traditionally considered analytic (e.g., 'cats are animals') is false, does this show that our linguistic framework was mistaken, or that the sentence was never analytic to begin with?"** Carnapians say the framework was mistaken (analyticity is revisable by framework change); Grice–Strawson defenders say it was never analytic (analyticity is absolute but possibly misapplied).  
  - **Epistemic reconception (d) vs. Grice–Strawson (b)**: Both might answer "No" at Node 4 and "Grounded solely in meaning" at Node 5. *Pull them apart* by asking: **"If grasp of a sentence's meaning suffices for justified belief (e.g., 'all vixens are female foxes'), does this epistemic fact depend on the sentence being true solely in virtue of meaning, or can it hold independently?"** Epistemic views (d) say it can hold independently (e.g., via meaning-constituted entitlements); Grice–Strawson (b) ties it directly to truth "in virtue of meaning."  

  This tree uses six branch nodes and five leaves, ensuring students are sorted by their intuitions about concrete cases, not doctrinal labels. Each node is answerable without prior knowledge of the positions (e.g., Node 3 tests "red and green" as a putative analytic truth, not Quinean holism). Cases (i)–(v) are integrated diagnostically: (i) at Node 3, (ii) at Node 4, (iv) at Node 6, (v) at Node 2, and (iii) in the commitment for (b). No combination of answers is unoccupied: every path leads to a defined leaf.
