answer: |-
  **Final Exam Question: Common Priors and Disagreement**

  **Scenario:**  
  Two perfectly calibrated Bayesian forecasters, A and B, estimate the probability that a frontier AI system ships within 18 months. Both begin with credence 0.5. Each receives one private signal from the lab’s internal tracker. After observing their signals, A’s credence is 0.8 and B’s is 0.2. They exchange one round of messages stating only their final credences. Each message is received, understood, and becomes common knowledge. Each knows the other is a perfect Bayesian who started at 0.5. Yet neither revises their credence: A remains at 0.8, B at 0.2.

  ---

  **Part (a) (10 points)**  
  What does this scenario demonstrate about A and B’s prior beliefs? Explain why their persistent disagreement is consistent with perfect Bayesian rationality, specifying how their prior beliefs must differ despite both assigning an initial probability of 0.5 to shipment.  

  **Part (b) (10 points)**  
  Evaluate the argument that rational agents with differing priors should be willing to accept mutually beneficial bets against each other. Discuss at least two major objections to this argument. Connect your analysis to the relationship between Aumann’s agreement theorem and no-trade theorems.  

  **Part (c) (10 points)**  
  Is the common prior assumption (CPA) best understood as an empirical claim about human psychology, a normative requirement for rational disagreement, or a modeling choice? Discuss how the Geanakoplos and Polemarchakis (1982) result on iterated belief convergence affects the CPA’s status in light of this scenario.  

  ---

  **Model Answer (720 words):**  

  **(a)** The scenario demonstrates that while A and B shared the same *marginal prior probability* (0.5) for the event *Shipment*, they lacked a *common prior* over the full state space including signals. Aumann’s theorem requires a common prior over all possible states (describing both the event and the information structure), and common knowledge of posteriors implies agreement. Here, disagreement persists, proving their priors differed over how signals correlate with *Shipment* and with each other.  

  Specifically, A must have believed her "high" signal strongly indicated shipment and was unlikely if no shipment occurred, while B believed his "low" signal strongly indicated no shipment. Crucially, they also held incompatible beliefs about the *conditional independence* or *correlation* of signals given the truth of *Shipment*. For example:  
  - A might believe signals are highly accurate and independent: P(A-high|Ship) = 0.9, P(B-low|¬Ship) = 0.9, P(B-low|Ship) ≈ 0.  
  - B might believe signals are negatively correlated: P(A-high|Ship) = 0.6, but P(B-low|A-high, ¬Ship) ≈ 1.  
  Their initial 0.5 merely reflected symmetric uncertainty before seeing signals. The divergence stems from differing prior models of the signal-generating process.  

  **(b)** The betting argument claims that if two agents have differing posteriors, they should accept a bet where one pays the other if *Shipment* occurs, at odds reflecting their credences (e.g., A sells B a ticket at $0.50 for a $1 payout if shipped). However, two objections undermine this:  

  1. **Adverse Selection**: The very offer of a bet conveys information. If B knows A is rational and well-informed, A’s willingness to bet at certain odds signals that A’s information favors her position. This may cause B to revise his beliefs and decline the bet. In this scenario, A offering a bet at her 0.8 credence would lead B to suspect A’s signal was stronger than B assumed, prompting belief revision rather than trade.  

  2. **Risk Aversion & Stake Limits**: Expected utility maximization does not require accepting arbitrarily large bets if agents are risk-averse. Further, real agents face wealth constraints; a bet large enough to "force" belief revision may be infeasible.  

  The connection to no-trade theorems (Milgrom-Stokey, 1982) is fundamental. These show that if agents share a common prior and information is revealed only through trade offers, no trade can occur in equilibrium—as trade would reveal private information, dissuading one party. Aumann’s theorem is a special case: common knowledge of posteriors implies no trade *in beliefs*, as agreement is enforced. Here, the lack of a common prior allows persistent disagreement *and* removes the guarantee that bets would reveal decision-relevant information, undermining the betting argument’s premise.  

  **(c)** The CPA is primarily a *modeling convention*, not an empirical or normative claim. Theorists impose it by defining a state space rich enough to encode all possible information partitions and assuming a single prior over it. This makes disagreement explainable only by differing information, not fundamental belief differences.  

  As a *normative ideal*, the CPA is flawed: it demands agents agree on the interpretation of all possible evidence before seeing any, which is implausible and stifles epistemic diversity. Empirically, human priors demonstrably vary due to upbringing, experience, or cognitive biases.  

  The Geanakoplos-Polemarchakis (1982) result—where repeated public announcement of posteriors eventually forces agreement—*undermines* the folk rationalist use of Aumann’s theorem. In this scenario, if A and B iteratively announced their posteriors, they *would* converge (e.g., after 2-3 rounds). However, convergence requires unbounded public communication and reveals nothing about *why* priors differed initially. Folk practice treats the CPA as a real-world rationality constraint ("you should agree if you’re rational!"), but GP convergence is a mechanical consequence of Bayesian updating under common knowledge, not validation of shared priors. The scenario’s persistence of disagreement after one round highlights that convergence is not instantaneous; the CPA remains a theoretical scaffold, not a description of actual minds.  

  ---

  **Marking Scheme (Total: 30 points)**  

  **Part (a) (10 points)**  
  - **+3** Identifies that prior differences concern the *joint information structure* (signals/event correlations), not the marginal prior of 0.5.  
  - **+3** Explains how priors differ: e.g., incompatible beliefs about signal accuracy/independence (concrete example not required but rewarded).  
  - **+2** States that disagreement proves *no common prior* exists per Aumann’s assumptions.  
  - **+2** Explicitly rejects "irrationality" or "theorem failure" as explanations.  
  *Typical botch: Claims forecasters "had the same prior" or that one is miscalibrated.*  

  **Part (b) (10 points)**  
  - **+3** Objects to betting argument via **adverse selection**: Bet offers reveal information.  
  - **+3** Objects via **risk aversion/stake limits**: Bets don’t force revision under realistic constraints.  
  - **+2** Connects to **no-trade theorems**: Notes that common priors imply no trade can occur.  
  - **+2** Identifies Aumann as a **special case of no-trade** for beliefs.  
  *Typical botch: Assumes rational agents must accept any bet at their credence odds.*  

  **Part (c) (10 points)**  
  - **+4** Identifies CPA as a **modeling convention** (state-space choice), not empirical/normative.  
  - **+2** Rejects CPA as normative ideal (due to unrealistic pre-evidence agreement requirement).  
  - **+2** Notes GP (1982) forces convergence *eventually* but not instantly.  
  - **+2** States GP **undermines folk practice**: Convergence ≠ justification of shared priors.  
  *Typical botch: Claims CPA is "empirically false" or that GP "vindicates Aumann".*  

  **Deductions (apply once per occurrence)**  
  - **-2** Recites Aumann’s theorem statement without engaging the paradox.  
  - **-2** Mentions "Harsanyi doctrine" without explaining its relevance/limits.  
  - **-3** Attributes disagreement to irrationality or "non-Bayesian" updating.  
  - **-1** Focuses on priors being "beyond criticism" without addressing information structure.  

  --- 

  **Exam Note:** Answers are assessed on conceptual precision, not citations or historical details. Focus on Bayesian machinery and logical coherence.
