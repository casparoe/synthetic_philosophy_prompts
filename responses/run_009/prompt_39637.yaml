answer: |-
  Consider the following scenario, which I'll call "The Unyielding Guard." A guard is stationed at a remote outpost protecting a valuable asset worth 100 units to her employer. An intruder contemplates stealing this asset. The sequence unfolds over three days with the following payoffs (measured in units of utility for each agent; positive numbers are gains, negative are losses):

  1.  **Day 1 (Intruder's Probe Decision):** The intruder chooses whether to conduct a small, costly probe attack on the outpost. This probe costs the intruder 1 unit to execute. If the intruder does *not* probe (action: **Skip Probe**), the game ends immediately. The guard gains 5 units (her standard wage for uneventful duty), and the intruder gains 0 units (neither loss nor gain from inaction). If the intruder probes (action: **Probe**), they pay the 1 unit cost, and the game proceeds to Day 2.
  2.  **Day 2 (Guard's Response to Probe):** Facing the probe, the guard must choose whether to mount a vigorous, costly defense. This defense is disproportionate to the probe itself; it completely repels the probe but inflicts a significant personal cost of 15 units on the guard (due to exhaustion, resource depletion, or risk of injury). Her choices are:
      *   **Defend Vigorously:** Costs guard 15 units. Probe is repelled. Intruder loses the 1 unit probe cost. Game proceeds to Day 3.
      *   **Defend Minimally:** Costs guard 0 units. Probe is repelled (it was only a probe). Intruder loses the 1 unit probe cost. Game proceeds to Day 3.
  3.  **Day 3 (Intruder's Main Attack Decision):** After observing the guard's response to the probe (or if there was no probe), the intruder decides whether to launch the main attack to steal the asset.
      *   If the intruder chooses **Attack**:
          *   If the guard *Vigorously Defended* on Day 2, the attack fails. The guard loses an additional 5 units (combat stress). The intruder loses an additional 10 units (failed assault cost).
          *   If the guard *Minimally Defended* or there was *No Probe*, the attack succeeds. The guard loses 100 units (value of asset lost, plus blame). The intruder gains 50 units (value of stolen asset).
      *   If the intruder chooses **Do Not Attack**, no further costs or gains are incurred beyond those from previous days.

  **Payoff Summary:**

  *   **Guard:**
      *   Skip Probe: +5
      *   Probe + Minimal Defense + Do Not Attack: 0 (Probe repelled at no cost, no attack)
      *   Probe + Minimal Defense + Attack: -100 (Asset stolen)
      *   Probe + Vigorous Defense + Do Not Attack: -15 (Costly defense, no attack)
      *   Probe + Vigorous Defense + Attack: -20 (Costly defense + combat stress, but asset saved)
  *   **Intruder:**
      *   Skip Probe: 0
      *   Probe + (Any Defense) + Do Not Attack: -1
      *   Probe + (Minimal Defense) + Attack: -1 (Probe) + 50 (Asset) -10 (Assault) = +39
      *   Probe + (Vigorous Defense) + Attack: -1 (Probe) -10 (Assault) = -11

  **The Disposition and the "Irrational" Act:** The guard possesses a genuine disposition of *unyielding stubbornness*. This disposition compels her to always **Defend Vigorously** against *any* hostile action, no matter how small or seemingly harmless, incurring the high personal cost (15 units). Crucially, this disposition is *verifiable* through the probe. The intruder *knows* they can reliably reveal the guard's true disposition by probing; if the guard defends vigorously, it conclusively demonstrates the disposition is real. A rational guard without this disposition would always choose **Defend Minimally** (cost 0) on Day 2, as the probe itself poses no threat requiring a costly response, and minimal defense repels it just as effectively.

  **The Outcome:** Because the intruder knows they can cheaply probe (cost: 1 unit) to reveal the guard's genuine disposition, they will probe on Day 1. Upon observing the Vigorous Defense, the intruder infers the guard's unyielding nature. Knowing that attacking a guard with this disposition will lead to failure and a net loss (-11), the intruder rationally chooses **Do Not Attack** on Day 3. The guard ends up with -15 units (the cost of her vigorous defense). While negative, this is vastly better than the -100 she would have suffered if the intruder probed, observed minimal defense (revealing rationality), and then attacked successfully. If the guard lacked the disposition and defended minimally, the intruder would attack, giving the guard -100. The disposition deters the main attack, limiting the guard's loss. Without the possibility of a probe (or if the probe couldn't reveal a genuine disposition), the disposition wouldn't help; the intruder might attack blindly. But because the probe *can* and *does* reveal the genuine disposition, the guard benefits from having it.

  **What the Example is Meant to Show:**
  1.  **Work of Genuine Possession:** The disposition pays off *specifically because* it is real and verifiable. The probe acts as a low-cost test. The intruder attacks only if the test reveals the guard is *not* unyielding (i.e., is rational). The guard benefits because the test confirms her stubbornness, making attack futile. Belief alone is insufficient; if the guard could merely *pretend* to be unyielding but would rationally defend minimally if probed, the intruder would probe, see minimal defense, and attack. Only the *actual* disposition to defend vigorously deters.
  2.  **The "Irrational" Act:** On Day 2, faced with the probe, **Defending Vigorously** (cost: 15) appears irrational compared to **Defending Minimally** (cost: 0). Both repel the probe, so the extra cost seems unjustified *at that moment*, given only the probe's immediate consequences. Standard causal decision theory (CDT), evaluating acts based solely on their causal consequences at the choice node, typically deems the vigorous defense irrational here. However, this assessment depends on the decision theory employed. Theories incorporating the act's role within a larger plan or its evidential relationship to the intruder's future behavior (like evidential decision theory - EDT - or functional decision theories) might argue that the act *is* rational *because* it signals the disposition and deters the attack. Crucially, this latter view is contested; many decision theorists hold that CDT's isolated node evaluation is correct, making the act locally irrational even if globally beneficial.
  3.  **Rationality of the Disposition:** The example illustrates that possessing such a disposition can lead to better overall outcomes *because* it forces the agent to perform an act that appears irrational in isolation but secures a vital benefit (deterrence). This supports the view that cultivating such dispositions can be instrumentally rational as part of a long-term strategy, even though they commit the agent to future "irrational" acts. However, it doesn't settle whether the disposition itself is "rational" in a fundamental sense. Critics might argue it's a costly commitment device or a cognitive flaw that happens to pay off in this specific, exploitable interaction. Proponents might see it as a rational form of self-binding. The example highlights the tension: the disposition is beneficial *because* it genuinely constrains future choice in a way observable to others, making threats or promises credible, but this constraint involves acting against what seems locally optimal.

  **Contested Ground:** The core controversy lies in the verdict on the Day 2 defense act. Is it irrational (as per a CDT analysis focusing only on the probe's consequences at that node)? Or is it rational (as per analyses considering its essential role in the deterrence strategy established by the prior disposition and verified by the probe)? This disagreement reflects a fundamental divide in decision theory about the proper scope of evaluation (local act vs. global strategy) and the relevance of act-state dependencies (like the act being evidence of a disposition affecting the opponent's future move). The example does *not* resolve this debate; it concretely illustrates how the phenomenon of rational irrationality arises and depends critically on the *genuine possession* of a disposition that can be reliably probed.
