answer: |-
  **Joint Statement: Adversarial Collaboration on the Demandingness Objection to Consequentialism**

  1.  **Agreed Claims:** We agree that the demandingness objection alleges that consequentialism prescribes actions imposing excessive costs on agents, violating plausible moral intuitions. We agree this objection requires a comparative baseline (e.g., commonsense morality, feasible expectations) to be substantive; an unqualified claim that consequentialism "demands too much" is vacuous. We agree that versions relying solely on the *absolute quantity* of demanded sacrifice, without reference to a comparative baseline or the nature of the demand, fail. We agree that for the objection to be decisively successful, it must establish that consequentialism violates a core, non-negotiable moral intuition that is reliable and cannot be reasonably revised away by consequentialism's theoretical virtues.

  2.  **Residual Disagreements:** Flatmate holds that consequentialism, incorporating a fair-share cap limiting an agent's obligation to the cost they would bear if all relevant agents did their fair share, satisfactorily addresses demandingness concerns without abandoning consequentialist foundations. Supervisor holds that such a cap is incompatible with core consequentialist commitment to maximizing impartial value and instead imports a distinct, non-consequentialist moral principle. Further, Supervisor holds that a distinct aspect of the objection concerns the *shape of deliberation*: that consequentialism, even when demanding less overall, requires agents to see themselves as mere conduits for impartial value in a way that is substantively alienating, regardless of the arithmetical outcome. Flatmate holds that the alienation concern, as a distinct objection, was adequately addressed by consequentialist responses (e.g., sophisticated indirection, recognition of agent-relative value within frameworks like rule-consequentialism) and that Supervisor's point conflates demandingness with a separate critique.

  3.  **Cruxes:** The primary cruxes are: (A) Whether the intuitive force of demandingness objections, given their potential to reflect self-serving bias, provides sufficient evidential weight to justify revising consequentialism or accepting non-consequentialist constraints. (B) Whether the proposed fair-share cap can be derived from and made consistent with foundational consequentialist principles (e.g., maximizing impartial good) without being an ad hoc, non-consequentialist intrusion. (C) Whether the alleged "alienation" stemming from the shape of consequentialist deliberation constitutes a distinct, compelling objection to consequentialism *as such*, even in cases where the net demand (quantity) is deemed acceptable.

  4.  **Cases & Predictions:**
      *   **Case:** Agent A can prevent the death of stranger B at a cost to A calibrated to be *exactly equal* to the loss B would suffer (e.g., A must permanently sacrifice a specific, cherished career prospect of immense personal significance, where the loss of meaning/fulfillment for A is judged precisely equal to the loss of life/fulfillment for B). No one else is in a position to help. Common-sense morality might see this as supererogatory.
      *   **Crux A Prediction:** Flatmate predicts intuitions here will strongly resist demanding the sacrifice, demonstrating their unreliability due to self-interest. Supervisor predicts intuitions resisting the demand will remain strong and provide evidence of a genuine moral constraint.
      *   **Crux B Prediction:** Flatmate predicts the fair-share cap (which wouldn't apply here as no one else can act) *combined* with consequentialist value theory recognizing the equal weight of A's loss, yields the verdict that A is not required to sacrifice, showing principled consistency. Supervisor predicts the cap is irrelevant here, and pure consequentialism *must* demand the sacrifice (as net value is neutral/equal, but the act still promotes impartial value maximization by fulfilling a preference/avoiding suffering), revealing the cap's inconsistency with fundamental consequentialism.
      *   **Crux C Prediction:** Supervisor predicts the intuition of excessive demand persists partly *because* A is required to deliberate solely by weighing their profound personal loss against an equal stranger's loss in an impersonal calculus, which feels alienating and wrong. Flatmate predicts the intuition stems entirely from the high cost itself and the neutral net outcome, not the deliberative shape; if the net gain were positive, the same deliberative mode would feel appropriate.

  5.  **Candid Closing on Verbal Elements:** We agree that some disagreement persists over the precise scope of the term "demandingness" – whether it inherently includes the qualitative character of deliberation or is strictly quantitative. We agree that disagreement over whether the fair-share view constitutes "consequentialism" or a distinct hybrid theory may be partly terminological, though it reflects deep substantive differences about fundamental commitments. We agree there is no purely verbal disagreement on the core questions of whether demandingness intuitions are reliable evidence against consequentialism, whether the cap can be principled within consequentialism, or whether the alienation concern is distinct and valid.
