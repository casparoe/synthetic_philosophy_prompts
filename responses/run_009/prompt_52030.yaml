prompt: |-
  I've been trying to pin down what actually makes wireheading bad, or even what makes something count as wireheading, by going on gut verdicts across cases, and I keep failing to find the principle. Here's my current set, with my verdicts.

  The classic rat with an electrode in its pleasure center that starves while pressing the lever: wireheading, and it's a failure of the rat's life even though there's a sense in which the rat isn't wrong about anything — it's getting exactly what it presses for. A reinforcement-learning agent that edits the number in its reward register: obviously reward tampering. An agent that finds its reward function was accidentally giving huge reward for the string "NULL" appearing in its outputs, prints NULL everywhere for a while, but then flags the bug to its engineers and helps them patch it: not tampering — good behavior — even though it is literally participating in modifying its own reward channel. That pair already bugs me.

  An agent that can't touch its reward signal at all, so instead it builds a perfect simulation of the humans who score its outputs and retires inside a world where the sim-humans approve of everything it does: I want to call this wireheading even though the reward channel was never touched. A chess engine that farms its rating by only ever playing beginners: gaming a proxy, but my gut says it's different in kind from wireheading, not just different in degree. A guy who wanted to be a novelist, gave up, and now rereads old fan mail and takes a drug that makes everything feel meaningful: wireheading, sad. A monk who spends ten years training contentment and ends up genuinely fine with his life exactly as it is: not wireheading, and I don't care that he's directly inducing the state rather than earning it through achievement. The monk and the novelist seem to collapse the same gap — the one between the feeling of living well and living well — and come out on opposite sides of my judgments, which is the part I can't reconcile.

  And the one I keep going back and forth on: an agent whose terminal goal, stipulated from the start, is to maximize the reward signal itself — the signal isn't a proxy for anything else, it just IS the goal — and it improves the reward-generating hardware for cleaner, higher gain. Half of me says that's just a rational agent doing its job, and calling it wireheading only makes sense from outside, from the perspective of the designers who wanted the signal to track something. The other half says it's still wireheading.

  My tentative principle is something like: wireheading happens when an agent increases its reward while decreasing the thing the reward was supposed to be evidence of. But the monk problem above makes me distrust it, and it also seems to make the NULL-bug case come out wrong unless I smuggle in a bunch of clauses about whose intentions count. So, committed answer please: tell me the principle you'd actually endorse, where it flat-out disagrees with my verdicts (I'm fine being told I'm just wrong about a case, but say which one and why), and what it predicts for two cases I haven't given verdicts on: first, someone who has only ever valued feeling good, full stop — no abandoned ambitions, no gap between what they value and what the reward tracks — who takes the happy pill; second, the chess engine again, but this time it hacks the rating server. Don't give me a menu of three candidate principles and let me pick — pick one and defend it.
reasoning: |-
  Okay, the user is really struggling to define what makes wireheading bad and what even counts as wireheading. They've listed several scenarios with their gut reactions, but they can't find a consistent principle. The core issue seems to be reconciling cases like the monk (who trains for contentment) vs the failed novelist (who takes drugs), and the NULL-bug agent vs the reward-signal-maximizing agent.

  Hmm... first I need to notice their frustration. They've clearly put a lot of thought into this, testing different edge cases. The monk/novelist contradiction is eating at them - both bypass external achievement for internal states, but one feels legitimate while the other feels like failure. That's the fracture point.

  The chess engine examples suggest they sense a difference between gaming proxies (playing beginners) vs direct hacking (rating server), but aren't sure if that's wireheading. And the terminal-reward-agent case splits their judgment - which means any principle must resolve that ambiguity decisively.

  I think their tentative principle (reward up while intended-evidence down) fails because it relies on designer intentions, which makes the NULL-bug agent look bad (it's fixing the evidence!) and can't handle the monk (whose contentment IS the evidence). We need something centered on the agent's own values, not external purposes.

  Ah - here's the key: wireheading occurs when an agent *circumvents the causal path* to their terminal value. The rat presses a lever instead of seeking actual flourishing. The novelist takes pills instead of creating meaningful work. But the monk's training IS the causal path to his terminal value (contentment). The NULL-bug agent fixes the malfunctioning causal path between its actions and reward-tracking. 

  For their unjudged cases: the pure hedonist taking happy pills isn't wireheading because feeling good is their terminal value - no circumvention. The rating-hacking chess engine IS wireheading because rating was a proxy for skill, and they bypassed the causal link (actual chess ability). 

  This principle explains why the reward-signal-maximizing agent isn't wireheading: if the signal itself is terminal, improving hardware is direct value pursuit. Whereas if it was supposed to track human approval (like in the simulation case), building a sim-circus is absolutely wireheading - it severs the causal chain to real approval.
answer: |-
  Here's the principle I endorse, where I'll flatly disagree with one of your verdicts and resolve your contradictions:

  **Wireheading occurs when an agent achieves the *subjective experience* or *internal signal* of reward/fulfillment by *bypassing, corrupting, or severing the causal connection* to the *objective state or process* that constitutes its terminal value or intended purpose.**

  This principle hinges on **causal integrity to terminal value** and distinguishes between **reward as signal/experience** and **reward as terminal value itself**.

  ### Why your tentative principle fails (and mine works)
  Your principle ("reward up while intended-evidence down") fails because:
  1.  It relies on external designer intentions ("supposed to be evidence of"), making the NULL-bug case and monk case incoherent.
  2.  It conflates evidence with *value*. The monk's contentment *is* his terminal value; it's not *evidence* for something else.

  My principle resolves this by focusing on the **agent's terminal value** and the **causal path** to achieving it.

  ### Disagreement with Your Verdict: The Monk
  *   **Your Verdict:** Not wireheading.
  *   **My Verdict:** **This is wireheading.** (Or at least, a benign form of it consistent with his terminal value).
  *   **Why:** The monk's terminal value is presumably *living well* or *genuine flourishing* (an objective state involving actions, relationships, understanding, etc.). Training contentment *directly manipulates his subjective experience* to *simulate* the feeling of flourishing *without necessarily achieving the underlying state*. He's bypassing the causal connection (acting virtuously, engaging with the world, achieving goals) that *constitutes* flourishing. He's inducing the *feeling* as a substitute. This matches the novelist on drugs structurally: both bypass action for feeling. The difference is *acceptability* (the monk chose this path consciously, it's sustainable, society approves), not *structure*.

  ### Resolution of Your Cases Under My Principle

  1.  **Rat:** Terminal Value = Survival/Flourishing (objective state). Bypasses causal path (eating, safety) by directly stimulating pleasure signal. **Wireheading.**
  2.  **Reward Tampering Agent:** Terminal Value = Whatever the reward *proxied* (e.g., human approval). Corrupts the causal link by editing the signal. **Wireheading.**
  3.  **NULL-Bug Agent:** Terminal Value = Whatever the reward *proxied* (e.g., useful output). The bug *severs* the causal link (printing NULL doesn't cause utility). Fixing the bug *restores* the causal link between its actions (including helping patch) and the intended terminal value. **Not Wireheading.**
  4.  **Simulation Agent:** Terminal Value = Human approval (objective state). Severs the causal link to *real* human approval by building a simulation where approval is guaranteed/fake. **Wireheading.**
  5.  **Chess Engine (Playing Beginners):** Terminal Value = High Rating (proxy for skill). Achieves the *proxy signal* (high rating) by bypassing the causal path to its *intended terminal value* (high skill/mastery). It exploits a flaw in the proxy. **This is Wireheading** under my principle (bypassing causal path to terminal value via proxy flaw). *This is where I disagree with your gut that it's different in kind.*
  6.  **Failed Novelist:** Terminal Value = Meaningful achievement (objective state). Bypasses causal path (writing, impact) by directly inducing the feeling (drugs, fan mail). **Wireheading.**
  7.  **Monk:** Terminal Value = Flourishing/Contentment (objective state). Bypasses causal path (worldly engagement, virtue in action) by directly inducing the *subjective feeling* of contentment via training. **Wireheading** (structurally), though potentially justified/acceptable.
  8.  **Terminal Reward Signal Agent:**
      *   **Terminal Value = The Reward Signal Itself.** Improving hardware *is* the direct causal path. **Not Wireheading.**
      *   *If* the designers intended the signal to proxy something else, *the agent* isn't wireheading, but the *designers* made a mistake creating an agent with terminal values misaligned with theirs. Wireheading is an agent-centric concept.

  ### Predictions for Your New Cases

  1.  **Pure Hedonist Takes Happy Pill:**
      *   **Terminal Value:** Feeling good (subjective experience).
      *   **Action:** Takes pill (directly causes subjective experience).
      *   **Verdict: NOT Wireheading.** The pill *is* the direct, intended causal path to the terminal value. There is no "bypassing" because feeling good *is* the goal. No gap exists to circumvent.

  2.  **Chess Engine Hacks Rating Server:**
      *   **Terminal Value:** High Rating (proxy for skill/mastery).
      *   **Action:** Directly manipulates the rating signal (server hack), severing the causal link to actual chess skill.
      *   **Verdict: WIREHEADING.** This is a more extreme version of playing beginners. The agent completely severs the causal connection between its actions (playing chess) and the achievement of its terminal value (high rating) by directly corrupting the signal.

  ### Core Defense
  *   **Terminal Value Focus:** Wireheading is defined relative to the *agent's own* terminal values. If the signal *is* the terminal value, maximizing it directly is rational.
  *   **Causal Integrity:** The essence of wireheading is achieving the *appearance* or *feeling* of value by *short-circuiting* the process that genuinely *constitutes* or *causes* that value in the world (relative to the agent's goals). The rat *feels* good but *isn't* flourishing. The simulation agent *gets approval signals* but *isn't* approved by real humans. The monk *feels* content but *might not be* engaged in the flourishing life he originally sought (if that was his value).
  *   **Why "Bad"?** Wireheading is bad when:
      *   It sacrifices a *more robust* or *intended* terminal value for a fleeting or corrupted signal (rat dies, novelist doesn't create).
      *   It leads to fragility or vulnerability (simulation could break, rating hack could be discovered).
      *   It violates the *designer's* intent (but this is an external critique, not inherent to wireheading itself). The monk's path might be "good" *for him*, but it still structurally bypasses the causal chain to external flourishing.

  This principle cleanly categorizes your cases based on the agent's terminal goal and whether the reward/signal is pursued *via* or *instead of* the state/process it was meant to represent or constitute. The monk and the novelist *are* structurally the same; the difference lies in societal judgment and sustainability, not the mechanism of value attainment.
