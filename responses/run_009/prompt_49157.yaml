  Okay, the user is in an epistemology seminar focusing on self-deception for a term paper. They need to establish desiderata for an adequate theory of self-deception. Their advisor told them to define what a theory should do before arguing for one. 

  First, I need to outline the core requirements such a theory must meet. The user mentioned specific cases: the partner cheating scenario, the smoker avoiding information, and the student overestimating exam performance. The theory must explain these varied instances without conflating them with related concepts like wishful thinking or motivated reasoning.

  The paradox of self-deception is crucial. How can one be both deceiver and deceived? This seems logically impossible. Any theory must resolve this without contradiction. Also, distinctions are key. The user wants clear boundaries between self-deception and similar phenomena. For example, wishful thinking might lack the element of avoiding evidence, while motivated reasoning could be more conscious.

  Boundary questions matter. Does self-deception require intention? Or can it be unintentional? What role does desire play? The user is interested in these nuances because their paper will explore whether self-deception is a single phenomenon or multiple. If some desiderata conflict, that could support the idea that "self-deception" covers different things.

  The user also wants to know which requirement most challenges existing theories. The paradox requirement probably does this. Divided-mind theories might resolve it by positing separate mental modules, but they can seem ad hoc. Bias-based theories avoid division but struggle with the active deception element. Highlighting this tension without getting into citations is important.

  I should list desiderata clearly: explanatory scope for cases, respecting distinctions, resolving the paradox, addressing the role of desire, intention, and success. Then identify potential conflicts. For example, requiring intentionality might clash with cases where self-deception feels passive, like the smoker. Or resolving the paradox might force a choice between divided minds and bias theories, suggesting no single solution satisfies all.

  The user’s deeper need is to find if self-deception is coherent or fragmented. By showing conflicting desiderata, their paper can argue it's not a unified phenomenon. They’ll need to present the requirements, show tensions, and conclude that different cases demand different explanations. Keeping it conceptual without references aligns with their no-internet access constraint. I need to ensure each point is grounded in examples and clearly highlights where conflicts arise.
answer: |-
  Here are the desiderata for an adequate theory of self-deception, structured as requested, followed by the analysis of tensions:

  **Core Desiderata:**

  1.  **Explanatory Scope (The Cases):**
      *   **Requirement:** The theory must explain paradigmatic cases across the spectrum of severity and awareness.
      *   **Cases Behind It:**
          *   *Strong Denial:* Partner sees clear evidence of infidelity (lipstick, late nights, messages) yet sincerely believes "everything is fine" or explains away each piece of evidence individually without integrating them.
          *   *Strategic Avoidance:* Smoker actively avoids reading articles about health risks, deflects conversations, and maintains "I'll quit soon" without genuine engagement with the evidence, believing themselves less at risk.
          *   *Positive Illusion:* Student leaves exam genuinely convinced it went exceptionally well, selectively recalling questions they answered correctly while downplaying or forgetting their struggles.
      *   *Why:* A theory failing these core intuitions isn't about *self-deception* as commonly understood.

  2.  **Distinction from Near Neighbors (The Boundaries):**
      *   **Requirement:** The theory must clearly differentiate self-deception from related but distinct phenomena.
      *   **Distinctions & Considerations Behind Them:**
          *   *vs. Wishful Thinking:* Wishful thinking is a fleeting *hope* (e.g., "I hope I win the lottery"). Self-deception involves a settled (though unstable) *belief* formed or maintained against counter-evidence. The smoker *hopes* they're fine (wishful) but *believes* they are *actually* less at risk (self-deceiving).
          *   *vs. Motivated Reasoning:* Motivated reasoning is biased *processing* of evidence to reach a desired conclusion. Self-deception requires the *outcome*: holding the resulting biased belief *as true*, often accompanied by ignoring or avoiding evidence. The student uses motivated reasoning *to become* self-deceived.
          *   *vs. Sloppy Reasoning/Confirmation Bias:* This lacks the *motivational* element tied to a specific desire or need. Someone might be sloppy and end up with a false belief randomly. Self-deception requires the bias serves a psychological need (e.g., protecting self-esteem, avoiding anxiety).
          *   *vs. Intentional Lying to Oneself:* This involves a fully conscious, deliberate act of asserting a falsehood internally ("I *am* going to tell myself I'm happy!"). Self-deception involves a lack of full awareness of the deception; the belief feels sincere *at the time*. The partner isn't consciously thinking "I will now deceive myself"; they just find themselves believing the denial.
      *   *Why:* Without these boundaries, the concept becomes uselessly broad.

  3.  **Resolution of the Paradox (The Core Puzzle):**
      *   **Requirement:** The theory must dissolve or explain away the apparent contradiction: How can one simultaneously be the deceiver (knowing/accessing the truth) and the deceived (believing the falsehood), without invoking a homunculus or magical thinking?
      *   **Consideration Behind It:** The logical tension is the primary reason philosophers doubt the possibility of self-deception. Any adequate theory *must* address this head-on, showing how the mind can be structured or processes can unfold to make this state possible without literal contradiction.
      *   *Why:* Failure here means the phenomenon is logically impossible, rendering the other requirements moot.

  4.  **Role of Desire/Need (The Engine):**
      *   **Requirement:** The theory must account for the *motivating* factor: self-deception typically serves a psychological function (e.g., reducing anxiety, maintaining self-esteem, preserving a cherished worldview, avoiding effort). It's not random error.
      *   **Consideration Behind It:** The paradigmatic cases all involve a *reason* for the false belief – the partner avoids heartbreak, the smoker avoids fear/guilt, the student avoids shame. A theory where the false belief arises without such motivation risks collapsing into simple error.
      *   *Boundary Question:* Is desire/need strictly *necessary*? (This is contentious. Some argue certain self-deceptions might be habitual or serve obscure functions, but desire/need seems central to the core cases).

  5.  **Non-Intentionality (The Lack of Conscious Conspiracy):**
      *   **Requirement:** The theory must explain how self-deception occurs *without* the subject forming a conscious intention to deceive themselves at the moment of deception.
      *   **Consideration Behind It:** The phenomenology of core cases (partner, smoker, student) involves a lack of conscious deceptive intent; the false belief feels genuine. Intentional lying-to-self feels different (more effortful, less stable) and blurs the line with ordinary deception.
      *   *Boundary Question:* Can self-deception ever be partially intentional or involve degrees of awareness? (This is debated, but the core phenomenon seems non-intentional).

  6.  **Success Condition (The Belief State):**
      *   **Requirement:** The theory must entail that the self-deceived individual *actually believes* the preferred proposition (p) while *somehow* being inappropriately related to evidence or processes supporting not-p.
      *   **Consideration Behind It:** If the person doesn't *believe* p (e.g., they just hope p is true, or are acting *as if* p is true while knowing not-p), it's not deception, let alone *self*-deception. They are the victim only if they believe the falsehood.
      *   *Boundary Question:* How strong/stable must the belief be? Can it be fleeting or compartmentalized? *Must* the person simultaneously "know" not-p in some sense? (This links back to the Paradox).

  7.  **Epistemic Failure (The Irrationality):**
      *   **Requirement:** The theory must characterize the specific epistemic failing involved – how the subject mishandles evidence, reasoning, or attention in a way that is motivationally biased.
      *   **Considerations Behind It:** Self-deception isn't just *having* a false belief; it's *acquiring* or *maintaining* it through processes distorted by desire (e.g., selective evidence gathering, disproportionate scrutiny of counter-evidence, shifting standards, forgetting). This distinguishes it from blameless ignorance or well-supported false belief.
      *   *Boundary Question:* Is the failure always *culpable*? Or can systems be set up (habits, environments) that induce self-deception passively?

  **The Key Tension (Where Requirements Conflict):**

  The most profound tension lies between **Resolution of the Paradox (3)** and the combination of **Success Condition (6)** and **Non-Intentionality (5)**.

  *   **The Conflict:** Requirement (6) demands the person *believes* p. Requirement (3) demands they cannot *simultaneously* fully believe not-p in the same way, yet they must be *responsive* to not-p (as the "deceiver"). Requirement (5) says this responsive state cannot be a conscious intention based on knowing not-p.
  *   **Why it's Hard:** To resolve the paradox, theories often posit some form of mental partitioning or temporal shifting ("I know not-p at time T1 when setting up the bias, but believe p at T2"). However, this risks violating Non-Intentionality (if T1 is too intentional) or making the "deceiver" role too cognitively sophisticated/aware. Alternatively, bias-based models (e.g., pre-conscious filtering of evidence driven by desire) can satisfy Non-Intentionality and partially explain the belief (p), but struggle to fully capture the sense of *active* deception and the subject's *responsiveness* to the threatening truth (not-p) implied by the Paradox. They risk collapsing self-deception into mere motivated reasoning *plus* a strong belief outcome, without fully explaining *how* the subject avoids integrating the counter-evidence they haven't fully suppressed. The "mark" believes p, but where is the "con artist" if everything is just biased processing without a part *using* the truth to mislead?
  *   **Implication:** This tension suggests that satisfying *all* these requirements simultaneously might be impossible. It strongly hints that "self-deception" might not be a single, unified phenomenon. Perhaps "strong denial" cases (like the partner) require a different model (leaning towards partitioning/temporal division to handle the intense conflict) than "strategic avoidance" (like the smoker) or "positive illusion" (like the student), which might be better explained by more continuous bias models. The term might cover a family of related epistemic failures driven by motivation, but with different underlying cognitive structures.

  **The Requirement That Bites Hardest (Against Existing Pictures):**

  The **Resolution of the Paradox (3)** requirement is the most potent filter against major candidate theories.

  1.  **Against Divided-Mind Theories:** While these directly tackle the paradox by allocating "knowing not-p" and "believing p" to different subsystems, they often struggle to satisfy **Non-Intentionality (5)**. The "deceiving" subsystem starts to look suspiciously like a homunculus – a little agent *intentionally* hiding the truth from the other part. This feels metaphysically dubious and phenomenologically inaccurate. How are these subsystems defined? Is their interaction really non-intentional?
  2.  **Against Bias-Only Theories:** These excel at **Non-Intentionality (5)** and aspects of **Epistemic Failure (7)**, portraying self-deception as an emergent effect of motivated cognitive biases (attention, memory, interpretation). However, they often struggle mightily with **Resolution of the Paradox (3)**. If the threatening truth (not-p) is never genuinely accessed or represented in a way that could guide behavior *as truth* (only as an anxiety trigger to be avoided), then in what sense is the individual *deceiving themselves*? Where is the agency or the "deceiver" role? It can look like the person is just *victim* of their biased cognition, not an *agent* of deception. They also sometimes blur the line with mere **Motivated Reasoning** (Distinction 2b).

  **Boundary Questions Explicitly Flagged:**

  *   **Necessity of Desire/Need (Desideratum 4):** Is a specific desire/need *always* required, or can self-deception arise from habit/systemic factors?
  *   **Degree of Awareness/Intentionality (Desideratum 5):** Can self-deception involve *partial* awareness or *semi*-intentional strategies, or must it be strictly non-intentional?
  *   **Strength/Stability of Belief (Desideratum 6):** How strong and stable must the belief in p be? Can self-deception involve unstable or compartmentalized beliefs?
  *   **Simultaneous Knowledge (Implied by Paradox/Desideratum 6):** *Must* the individual simultaneously "know" or be aware of not-p in *some* sense for it to count as deception? If so, in what sense?
  *   **Role of Luck (Implied by Epistemic Failure/Desideratum 7):** Can someone count as self-deceived if they end up believing p *only* through random cognitive error coinciding with a desire, without the *motivational bias* actually causing the epistemic failure? (Likely not – the motivation must *drive* the error).

  This framework provides the conceptual scaffolding. The tensions, especially around the paradox, belief, and non-intentionality, are where the real philosophical action lies and where your argument about the (dis)unity of the phenomenon can be built. Good luck!
