answer: |-
  Here’s a complete activity design called **"The Treatment Trial"** that meets your constraints. Simpson’s reversal emerges organically from a seating-based confounder, and students generate the data through a simple dice game. The reversal is robust to attendance (works with 16–22 students), and the debrief explicitly addresses causal reasoning gaps.

  ---

  ### **Activity Summary**
  - **Goal**: Create Simpson’s reversal via a confounder (seating arrangement) hidden in a procedural rule.  
  - **Mechanism**: Students play a dice game choosing between two "treatments" (A/B). The dice are rigged by their seating group (Alpha/Beta), but they only learn this *after* aggregate analysis.  
  - **Reversal**: Treatment B wins overall, but Treatment A wins in *both* subgroups (Alpha and Beta).  
  - **Stakes**: The analyst (a student) must declare the "better" treatment using pooled data. Losers (those who didn’t follow the winning treatment) tidy chairs.  

  ---

  ### **Rules & Setup**  
  **Time**: 75 mins (activity: 55 mins, debrief: 20 mins).  
  **Materials**: 
  - 2 dice per table (1 red, 1 blue) for Alpha/Beta groups (see rigging below).
  - Tally sheets (paper or shared Google Sheet).
  - Whiteboards for subgroup analysis.

  **Seating Confounder (Hidden Rule)**:
  - Split the room into two groups by **seating proximity** (e.g., "Left-side tables = Alpha, Right-side tables = Beta"). Don’t announce this—call it a "logistical grouping."  
  - Assign 1/3 of students to Alpha, 2/3 to Beta (critical for reversal). For 18 students: 6 Alpha, 12 Beta.  

  **Dice Rigging**:  
  - **Alpha tables**: Red die (Treatment A) is biased to win, Blue die (B) to lose.  
    - Red: 4 faces with "✅", 2 with "❌" (P(win) = 4/6 ≈ 0.66).  
    - Blue: 1 face "✅", 5 "❌" (P(win) = 1/6 ≈ 0.17).  
  - **Beta tables**: Red die (A) is biased to lose, Blue die (B) to win.  
    - Red: 1 face "✅", 5 "❌" (P(win) = 0.17).  
    - Blue: 4 faces "✅", 2 "❌" (P(win) = 0.66).  

  **Game Rules** (Announced to students):  
  1. Each student plays 10 rounds.  
  2. Each round, choose **Treatment A (red die)** or **Treatment B (blue die)** and roll it.  
  3. Record:  
     - Your choice (A or B),  
     - Outcome (✅ or ❌),  
     - "Group" (Alpha/Beta)—*but hide this column initially* (call it "for admin purposes").  
  4. Goal: Maximize ✅ outcomes.  

  **Analyst Role**:  
  - One volunteer (or instructor) gets *only pooled data* (all choices/outcomes). They calculate:  
    - Overall win rate for A vs. B.  
    - Declare the "better" treatment.  
  - **Stakes**: Students who followed the winning treatment in ≥6/10 rounds win (prize: e.g., candy). Others tidy the room.  

  ---

  ### **Expected Data & Reversal**  
  Simulated with 6 Alpha + 12 Beta students (adjusts proportionally for 16–22 students):  
  - **Alpha students** (bias: A good, B bad):  
    - Typical choices: 70% choose A (good), 30% B (bad).  
    - Outcomes:  
      - A: 42 rolls × 0.66 ≈ 28 ✅  
      - B: 18 rolls × 0.17 ≈ 3 ✅  
    - **Win rates: A ≈ 66%, B ≈ 17% → A wins**.  
  - **Beta students** (bias: A bad, B good):  
    - Typical choices: 30% choose A (bad), 70% B (good).  
    - Outcomes:  
      - A: 36 rolls × 0.17 ≈ 6 ✅  
      - B: 84 rolls × 0.66 ≈ 55 ✅  
    - **Win rates: A ≈ 17%, B ≈ 66% → B wins**.  
  - **Pooled Data (Analyst sees this)**:  
    - A: 28✅ + 6✅ = 34✅ out of 42+36=78 rolls → **43.6% win rate**.  
    - B: 3✅ + 55✅ = 58✅ out of 18+84=102 rolls → **56.9% win rate**.  
    - **Analyst declares: B is better!**  

  **Reversal Emerges**:  
  - Subgroups: A wins in Alpha *and* Beta.  
  - Pooled: B wins overall → Simpson’s reversal.  

  ---

  ### **Facilitation Script**  
  **Phase 1: Game (20 mins)**  
  - "Choose A or B each round—your goal is to win as much as possible. Record choices/outcomes."  
  - Circulate to ensure dice rolls are fair and data recorded.  

  **Phase 2: Analysis (15 mins)**  
  - Collect all data. Give **analyst only the pooled tally** (hide Alpha/Beta column).  
  - Analyst calculates overall win rates for A/B and declares winner.  
  - **Enforce stakes**: Losers (students with <6 wins for the "winning" treatment) stand up.  

  **Phase 3: Reveal & Subgroup Analysis (20 mins)**  
  - "Plot twist: Your seating group (Alpha/Beta) used different dice! Get into Alpha/Beta teams."  
  - Teams use whiteboards to calculate win rates *within* their group.  
  - **Revelation**: Both groups see A won for them—but analyst’s pooled data says B won overall.  

  **Phase 4: Debrief (20 mins)**  
  - **Map the paradox**:  
    - Confounder = Seating group (influenced both treatment choice and outcome).  
    - Pooled table = "Do people who *choose* B win more?" (Selection bias).  
    - Subgroup tables = "Does B *cause* more wins?" (Causal signal).  
  - **Key insight**: The pooled answer is "correct" for describing *historical choices* (B-choosers won more), but wrong for *causal decisions* (A was better when confounder is fixed).  
  - **What the activity CAN’T reproduce**:  
    - **Causal identification**: Students know the confounder (seating) because you revealed it. In reality, you need domain knowledge to hypothesize confounders.  
    - **No free lunch**: Conditioning on a non-confounder (e.g., shoe size) could *create* bias. The game doesn’t show how to distinguish confounders from colliders.  
    - **External validity**: The dice rigging makes the causal effect unambiguous. Real data is noisier.  
  - **Name the paradox**: Only now reveal "Simpson’s reversal."  

  ---

  ### **Predictable Pitfalls & Mitigations**  
  1. **Tally errors**:  
     - Mitigation: Use a Google Sheet for instant calculations (hide the group column initially). Pre-calculate expected ranges.  
  2. **Spoilers**:  
     - Mitigation: If someone blurts "Simpson’s!," say: "Ah, you might recognize this pattern—let’s see if it holds!" and keep moving.  
  3. **Attendance swings**:  
     - Works for 16–22 students: Always assign 1/3 to Alpha, 2/3 to Beta (e.g., 16 students: 5 Alpha, 11 Beta).  
  4. **Choice behavior**:  
     - If students don’t "learn" which treatment is better (e.g., always choose A), the reversal weakens. Prod them: "Your goal is to win—adapt if needed!"  
  5. **Analyst mistakes**:  
     - Have a backup calculator (you or a TA) to verify pooled rates.  

  ---

  ### **Why This Works**  
  - **Reversal is baked into mechanics**: The confounder (seating) controls both treatment preference and win probability, forcing the paradox.  
  - **Students generate the trap**: The innocuous "logistical grouping" creates the reversal, so they experience the surprise firsthand.  
  - **Low stakes, high engagement**: Tidying chairs is a playful consequence; the real reward is the "aha!" moment.  
  - **Debrief honesty**: Explicitly separates what the activity shows (reversal mechanics) from what it can’t (causal discovery).  

  Tailor dice faces to your style (e.g., "high/low" numbers instead of ✅/❌). Run a test with TAs to refine timing.
