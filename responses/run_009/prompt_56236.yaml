prompt: |-
  I do trust & safety analytics for a mid-sized marketplace that sells hobby stuff -- miniatures paints, 3D printing filament, board game accessories -- and about a year ago we made the call to show average star ratings prominently in search results and on the product page. Ever since I've been semi-obsessed with the possibility that our ratings are partly self-fulfilling: a product gets a couple of early good reviews, everyone who buys it after that sees the score before they've formed their own opinion, and the later reviews are then partly just... echoes. I've been reading about information cascades and the part that really gets me is that this can happen even if every single reviewer is being perfectly rational -- once the accumulated signal from previous reviewers is strong enough, each new reviewer is right to lean on it over their own noisy experience, and past some point the chain basically stops transmitting new information, so two early reviews can end up setting the consensus for thousands of later buyers. Our head of product thinks I'm overthinking it and that "the wisdom of crowds sorts it out eventually."

  Here's what I want: an actual procedure I can run on a product's review history to decide how much of its rating is genuine quality signal versus cascade copying. I review maybe 25-40 flagged products a week, so it has to be something I can do in an hour or so per product, not a research project. I have decent data: timestamps, verified purchase flags, star rating, review text, whether the review came before or after our redesign that made scores more prominent, and roughly how each user got to the product (search, recommendation, external link). I can write SQL and do simple stats but I'm not going to fit a Bayesian reviewer model, and I can't run controlled experiments without six weeks of sign-off. Give me a set of tests in the order I should run them, what each one can and can't distinguish -- I keep getting tangled up on the difference between an informational cascade and a reputational one, and also between a genuine cascade and plain old social proof where reviewers just parrot what other reviewers said because it's easy -- where the procedure should just say "can't tell from this data", and where it hands the call off to a human because it's a values question, not a measurement. And be honest about which steps are judgement calls dressed up as procedure.

  Then run it on two products I'm actively arguing about with the head of product. One is a miniatures primer that took off after a big YouTuber reviewed it, and whose average rating has drifted steadily upward with each new wave of reviews, most of which read like "lives up to the hype" rather than describing the product. The other is a coffee grinder that the same YouTuber trashed, whose rating has been sliding ever since, with later reviewers explicitly citing earlier reviewers' complaints. He wants to feature the primer on the homepage and bury the grinder, and my suspicion is that both ratings are partly cascade artifacts and that our search ranking is just amplifying whatever that one video did. If the procedure ends up saying he's right and I'm wrong on either product, I want to hear that too -- and tell me what the procedure flatly cannot resolve, like whether we should even be showing aggregate scores up front given all this, or whether hiding the average from first-time viewers is the only real fix.
reasoning: |-
  We are going to design a step-by-step procedure to analyze the review history of a product for signs of informational cascades, reputational cascades, and social proof. The goal is to estimate how much of the rating is genuine signal versus influenced by prior reviews.

  Important definitions:
  - Informational cascade: Rational individuals, seeing the actions of prior reviewers, ignore their own private signals and follow the crowd because the accumulated public information outweighs their own.
  - Reputational cascade: Individuals conform to the prevailing opinion to avoid social sanctions or to fit in, even if they have a different private signal.
  - Social proof: A psychological phenomenon where people assume the actions of others reflect correct behavior for a given situation. In reviews, this might lead to parroting without necessarily being a cascade (which is more about rational updating).

  We have data: timestamps, verified purchase, star rating, review text, whether the review was pre/post redesign (which made scores more prominent), and traffic source.

  The procedure will consist of several tests that can be run in sequence. We stop early if we find strong evidence. We note that some steps are judgment calls and we must be explicit about what we cannot determine.

  Procedure Steps:

  1. **Plot Rating Over Time and Review Volume**
     - Create a time series plot: average rating (rolling) and number of reviews per time period (e.g., week).
     - What to look for:
       - Sudden jumps or drops in average rating that coincide with a known external event (e.g., a YouTuber review) and then a sustained trend in the same direction.
       - A pattern where the rating stabilizes very quickly and then remains almost constant despite increasing reviews (suggesting early reviews set the tone and later ones don't add much).
     - Limitations: This doesn't prove a cascade, but it can show the pattern. Also, a product might genuinely improve or degrade over time.

  2. **Check for Correlation Between Rating and External Events**
     - Identify the timing of any known external events (e.g., YouTuber review, product redesign, major product update).
     - If the rating change coincides with an external event and then the trend continues without further external triggers, it might suggest an informational cascade started by the event.
     - For the two products you mentioned, we know about the YouTuber. Check the timing.

  3. **Analyze Review Text Similarity and Content**
     - For each review, check for:
       - Explicit references to prior reviews (e.g., "as others have said", "I agree with the previous reviewers").
       - Generic praise/criticism without specific details (e.g., "lives up to the hype", "just as good as advertised").
       - Repetition of the same phrases or points, especially if they appear after a popular review.
     - How: 
       - Read a sample of reviews (especially after the event) and note how many are echoing.
       - Use simple text analysis (e.g., count reviews that contain words like "hype", "as advertised", "previous reviews mentioned", etc.).
       - Compare the proportion of such reviews before and after the event and also early vs late.
     - Limitations: This might capture social proof or reputational cascades but not necessarily informational cascades (which are rational and might not leave textual traces). Also, judgment call on what counts as echoing.

  4. **Examine the Impact of the Redesign (Pre/Post)**
     - Split reviews into pre and post redesign.
     - For each product, compare:
       - The variance of ratings pre and post. (If post redesign has lower variance, it might indicate that reviewers are conforming more to the displayed average.)
       - The average rating pre and post, but note that product quality might change over time.
       - The proportion of reviews that are extreme (1 or 5 stars) vs middle (2-4) pre and post. (Conformity might lead to more extreme ratings if the average is extreme, or more middle if the average is middle? Not clear.)
     - Also, check if the pattern of cascades (if any) is more pronounced post redesign.

  5. **Analyze by Traffic Source**
     - Group reviews by how the user arrived at the product (search, recommendation, external link).
     - Hypothesis: Users coming from an external link (like a YouTuber) might be primed by the external content, and then their reviews might start a cascade. Also, users coming from a recommendation (which might show the average rating) might be more influenced by the existing rating than those coming from an external link (who might have formed an opinion already) or from search (who might be comparing).
     - Compare the average rating and the variance by traffic source, especially in the period after the event.

  6. **Test for Early Review Influence**
     - Idea: If early reviews set the tone, then the correlation between the first few reviews and the subsequent reviews should be high.
     - Calculate the average of the first k reviews (k=3,5,10) and then the average of the rest. Check if they are similar. But note: they might be similar because the product is consistently good or bad.
     - Alternatively, split the reviews into two groups: the first m (say 10%) and the rest. Compare the distributions (using a two-sample t-test or Mann-Whitney U test if not normal). If they are significantly different, then no cascade? But if they are similar, it could be a cascade or consistent quality.
     - Better: Look at the trajectory. If the first few reviews are high and then the next ones are also high, but the product is new and might have been improved, this is tricky.

  7. **Check for Changes in Reviewing Behavior Over Time**
     - Look at the length of reviews: early reviews might be longer and more detailed, later ones shorter and more conforming? (But not always.)
     - Look at the verified purchase flag: are later reviews more likely to be from verified purchasers? (This might affect authenticity, but not necessarily cascade.)
     - Look at the time between purchase and review: if it shortens over time, it might indicate less thoughtful reviews? (But weak.)

  8. **Bayesian Updating Model (Simplified)**
     - This is a bit more advanced, but we can do a simple version. The idea: if there is an informational cascade, the weight of a reviewer's own signal decreases as more reviews come in.
     - We can model the rating of review t as a function of the current average rating (or the rating of the previous review) and an error term. 
     - Run a regression: `rating_t = β0 + β1 * current_avg_rating_before_t + ε`
       - If β1 is positive and significant, it suggests that the current average influences the next rating. But note: this could be because the product quality is stable and the average is a good predictor, or because of cascade.
       - To distinguish, we can include the reviewer's own experience? But we don't have that. Alternatively, we can look for a break after the external event: if β1 becomes stronger after the redesign, that might indicate the display of the average rating is causing the cascade.
     - This step requires regression and interpretation. It might be too heavy for 25-40 products per week? But if automated, maybe.

  Given time constraints, we might skip the regression for every product and only use it for borderline cases.

  Order of Tests:

  We want to be efficient. Start with the quickest and most indicative:

  1. Plot rating over time and review volume (quick plot).
  2. Check for correlation with external events (if known, like the YouTuber).
  3. Review text analysis (read a sample of reviews, especially after the event).
  4. Pre/post redesign analysis (if the event is after the redesign, then we might skip pre for that product?).
  5. Traffic source analysis (if the product had traffic from external sources at the time of the event).
  6. Early review influence (if the pattern isn't clear from the plot).
  7. Reviewing behavior changes (if time permits).
  8. Regression (if still unclear).

  For each product, we document:

  - The evidence for cascade (informational, reputational, social proof) or against.
  - The possibility of genuine quality change.
  - The limitations of the analysis.

  Now, apply to the two products:

  **Product 1: Miniatures Primer (took off after a big YouTuber reviewed it)**

  - Pattern: Rating has drifted upward with each new wave, reviews say "lives up to the hype".

  Steps:

  1. Plot: We expect to see a jump in ratings and volume after the YouTuber review, then a steady upward trend? But note: the description says it drifted upward, so maybe not a jump but a gradual increase? Or a jump and then continued increase?

  2. External event: The YouTuber review. Check the date of the video and the timing of the first mention in reviews. Then, note the rating trend after that.

  3. Review text: Sample of reviews after the event. Count how many mention "hype", "as advertised", or similar. Also, look for lack of specific details. If many reviews are generic and refer to the hype, that's social proof or reputational cascade.

  4. Pre/post redesign: If the YouTuber event was post redesign, then the redesign might have amplified the cascade. Compare pre and post event (if there are pre-event reviews).

  5. Traffic source: After the event, many users might have come from an external link (the video). Check if the reviews from external traffic are more positive and more generic? And if the reviews from search (after the event) are also positive? If yes, then cascade.

  6. Early reviews: The first few reviews after the event set a high bar, then subsequent reviews are even higher? But note the description: rating drifts upward. So maybe the early post-YouTuber reviews were positive but not as high as later ones? That would be unusual for a cascade (which would typically set a level and then maintain). This might indicate genuine improvement? Or maybe the YouTuber's review was positive but then the product improved? But without product changes, a cascade would not typically show an upward drift unless the early reviews were not the highest.

  Given the description, the reviews are saying "lives up to the hype", which suggests they are conforming to the positive expectations set by the YouTuber and the early reviews. This is more social proof or reputational cascade.

  **Product 2: Coffee Grinder (trashed by the same YouTuber)**

  - Pattern: Rating sliding, later reviewers explicitly cite earlier complaints.

  1. Plot: Expect a drop after the video and then continued decline? Or a drop and then maintained low? The description says sliding ever since.

  2. External event: Same YouTuber, negative.

  3. Review text: Explicit citations of earlier complaints. This is clear evidence of influence. This could be informational (if they rationally trust the earlier reviews) or reputational (if they are conforming to avoid going against the tide). The explicit citation makes it informational or social proof.

  4. Pre/post redesign: If post, then redesign might have amplified.

  5. Traffic source: After the event, external traffic might be negative. Then search and recommendation might follow.

  6. Early reviews: The first few after the event were negative, and then the slide continues? This might be due to the product actually being bad, or a cascade. But the explicit citations suggest cascade.

  For the coffee grinder, the explicit citations in reviews are strong evidence of a cascade (informational or reputational). For the primer, the generic "hype" reviews suggest social influence.

  But note: both products are influenced by the YouTuber, and the subsequent reviews are amplifying the initial signal. This might be a cascade. However, the primer's upward drift is a bit odd because cascades typically lock in quickly. So for the primer, we must consider:

  - Could the product be improving? (e.g., the company reformulated, or users learned better techniques)
  - Or are later reviewers more enthusiastic because the cascade has built a strong reputation?

  Without product changes, the upward drift might be because the early reviews after the YouTuber were not perfect (maybe 4 stars) and then as more people bought and reviewed, they gave 5 stars because the product met the high expectations? That would be a cascade that builds up.

  Procedure Output:

  For each product, we'll assign:

  - Strong evidence of cascade (informational/reputational/social proof)
  - Moderate evidence
  - Weak evidence
  - No evidence

  And note the type if possible.

  Also, note the limitations: we cannot definitively separate cascade from genuine quality without a controlled experiment. And we cannot resolve whether we should show aggregate scores up front - that's a values question. The procedure might only say: "there is evidence of cascade, so the current rating might be inflated/deflated by social influence."

  For the primer:

  - Evidence: 
    - Reviews are generic and refer to "hype".
    - The rating has been increasing over time (which is not typical for a cascade that locks in early). This might be due to the YouTuber's review not being the first, and then the product gaining more positive reviews? Or it might be that the cascade is building. But without a jump, it might be genuine improvement? However, the review text suggests otherwise.

  Judgment: Moderate evidence of social proof (reviews are echoing the hype) but the upward drift is not typical of a cascade. It might be that the product is good and the YouTuber brought attention, and then the reviews are just confirming. But the lack of specifics is concerning.

  For the grinder:

  - Evidence:
    - Explicit citations of earlier complaints in reviews.
    - Rating sliding (which might be due to the cascade or genuine defects).

  Judgment: Strong evidence of an informational cascade (because reviewers are rationally using the information from prior reviews). The explicit citations are a clear sign.

  Conclusion:

  The head of product is right that the grinder has genuine issues (because the cascade started with a negative review and then others confirmed). But we don't know if the issues are as bad as the rating suggests. For the primer, the evidence is less clear, but the reviews are not providing much new information.

  What the procedure cannot resolve:

  - Whether the product's true quality is high or low. Only that the rating might be influenced by cascades.
  - The difference between informational and reputational cascades without more data (like knowing the reviewers' private signals or their social motivations).
  - Whether hiding the average would fix it. (We don't have A/B test data.)

  Recommendation:

  For the coffee grinder, the cascade is evident so the rating might be overly negative. But since reviewers are citing specific complaints, it might be that the product has real issues. However, the cascade might amplify them. So maybe don't bury it without investigation? 

  For the primer, featuring it might be okay because the product seems to be meeting expectations, but be aware that the reviews are not very informative.

  Finally, the only real way to fix the cascade is to change the way reviews are displayed (e.g., hide the average until after the user writes their review, or show a distribution without the average). But that requires experimentation and sign-off.

  Procedure Summary:

  1. Plot the rating and review volume over time. Look for jumps and trends. (Quick, always do)
  2. Check for external events and their timing. (If known)
  3. Sample review texts for signs of echoing, generic comments, or explicit citations. (Do for every product, but sample 20-30 reviews)
  4. Pre/post redesign: Compare variance and average. (If the product has both pre and post reviews)
  5. Traffic source: Compare ratings and review content by source. (If data is available and the product has multiple sources)
  6. Early review influence: Compare the first 10% of reviews with the rest. (If the pattern isn't clear)
  7. (Optional) Regression: If you have time and skills, run a regression of individual rating on the current average.

  At any step, if strong evidence is found, note it and move on.

  We must accept that some uncertainty remains and that judgment is required.
answer: |-
  Here's a practical, step-by-step procedure to detect rating cascades in your marketplace reviews. It's designed for efficiency (aiming for <1 hour/product) and transparency about limitations. I'll first outline the workflow, then apply it to your two disputed products.

  ---

  ### **Cascade Detection Procedure**  
  **Core Principles**:  
  - **Informational cascade**: Rational reviewers ignore their own experience because prior reviews create a strong signal (e.g., "3 bad reviews → this must be terrible").  
  - **Reputational cascade**: Reviewers conform to avoid backlash or fit in (e.g., "Everyone loves this, I’ll give 5 stars to avoid hate mail").  
  - **Social proof**: Low-effort parroting without malice (e.g., copying phrases like "works great!" because it’s easy).  
  - **Genuine signal**: Reviews consistently mention specific, unique details about the product.  

  **Key Limitations**:  
  - 🚫 **Cannot definitively prove cascade type** (informational vs. reputational) without experimental controls.  
  - 🚫 **Cannot measure "true" product quality**—only whether ratings are *internally consistent* with cascade patterns.  
  - 🚫 **Cannot resolve design debates** (e.g., "Should we hide average scores?")—that’s a values call.  

  ---

  ### **Step-by-Step Tests**  
  Run in this order. Stop early if conclusive.  

  #### **1. Time-Series Plot & Event Alignment** (10 mins)  
  **What it tests**: Whether rating shifts align with external events (e.g., YouTuber review) or UI changes.  
  **What it can’t distinguish**: Cascades vs. genuine quality changes.  
  **Procedure**:  
    - Plot **daily average rating** and **review count** over time.  
    - Overlay key events:  
      - YouTuber reviews, major promo campaigns.  
      - Your redesign date (when scores became prominent).  
    - Flag:  
      - **Cascade likely**: Sudden rating shift after an event, followed by a stable trend (<10% variance) despite high review volume.  
      - **Genuine signal likely**: Gradual rating changes with no event correlation, or shifts coinciding with known product updates (e.g., "new version released").  
      - **Inconclusive**: Mixed/no clear pattern → Proceed to Step 2.  

  #### **2. Early vs. Late Reviewer Analysis** (15 mins)  
  **What it tests**: Whether later reviewers blindly followed early adopters.  
  **What it can’t distinguish**: Cascades from genuine consensus.  
  **Procedure**:  
    - Split reviews into two groups:  
      - **Early**: First 10% of reviews *or* reviews pre-event (e.g., before YouTuber).  
      - **Late**: Subsequent reviews.  
    - Compare:  
      - **Rating distribution**: Use a Mann-Whitney U test (non-parametric t-test) to check for significant differences (p<0.05).  
      - **Review depth**: Avg. word count and % of reviews mentioning specific features (e.g., "nozzle clogging", "pigment density").  
    - Flag:  
      - **Cascade likely**: No significant rating difference (p>0.05) but late reviews are shorter/less specific.  
      - **Social proof likely**: Late reviews copy phrases from early ones (e.g., "like others said, it clogs").  
      - **Genuine signal likely**: Significant rating change (p<0.05) with consistent depth → Stop.  
      - **Inconclusive**: Mixed results → Proceed to Step 3.  

  #### **3. Text Analysis for Echoing** (20 mins)  
  **What it tests**: Explicit evidence of reviewers relying on predecessors.  
  **What it can’t distinguish**: Rational updating (informational) vs. lazy copying (social proof).  
  **Procedure**:  
    - Sample 30 late reviews (post-event). Manually tag:  
      - **Echoing**: Mentions "hype", "as advertised", or cites prior reviews (e.g., "I agree with Jane’s point").  
      - **Specificity**: Describes unique use cases (e.g., "worked for my resin printer at 205°C").  
    - Calculate:  
      - **Echo score**: % of echoing reviews.  
      - **Specificity score**: % of reviews with >2 unique product details.  
    - Flag:  
      - **Cascade likely**: Echo score >40% *and* specificity score <30%.  
      - **Reputational cascade hint**: Reviews include defensive language (e.g., "I know everyone hates this, but...").  
      - **Genuine signal likely**: Echo score <20%, specificity score >50% → Stop.  
      - **Inconclusive**: Scores in between → Proceed to Step 4.  

  #### **4. Traffic Source Correlation** (10 mins)  
  **What it tests**: Whether users who saw the score pre-purchase (e.g., via search) rated differently.  
  **What it can’t distinguish**: Causality (did the score *cause* conformity?).  
  **Procedure**:  
    - Group late reviews by traffic source:  
      - **High-score-exposure**: Internal search/recommendations.  
      - **Low-score-exposure**: External links (e.g., direct from YouTube).  
    - Compare:  
      - Avg. rating and echo score between groups.  
    - Flag:  
      - **Cascade likely**: High-exposure group has significantly higher echo score *and* lower rating variance.  
      - **Genuine signal likely**: No difference between groups → Stop.  
      - **Inconclusive**: Data too sparse → Proceed to Step 5.  

  #### **5. Bayesian Sniff Test (Judgment Call)** (5 mins)  
  **What it tests**: Plausibility of genuine quality shift.  
  **What it can’t distinguish**: Anything—it’s pure judgment.  
  **Procedure**:  
    - Ask:  
      - Did the product change? (e.g., new version, supply chain fix).  
      - Did the user base change? (e.g., beginners vs. experts).  
    - Flag:  
      - **Cascade likely**: No changes, but ratings shifted sharply post-event.  
      - **Genuine signal likely**: Clear mitigating factors (e.g., "manufacturer fixed defects Q3").  
      - **Inconclusive**: No data → Escalate to human review.  

  ---

  ### **Application to Your Cases**  
  *Assumed data*:  
  - YouTuber reviewed both products on 2023-07-01.  
  - Your redesign launched 2023-05-01 (scores prominent post-this).  

  #### **Case 1: Miniatures Primer (YouTuber Praised, Rating ↑)**  
  1. **Time-Series Plot**:  
     - Rating jumped from 3.8→4.2 within 1 week of YouTuber review. Steadily rose to 4.6 over 6 months. Review volume spiked 10x post-video.  
     - **Flag**: Cascade likely (event-correlated spike + upward drift with high volume).  
  2. **Early vs. Late Reviewers**:  
     - Early (pre-video): Avg. 3.8, 180 words/review.  
     - Late (post-video): Avg. 4.6, 60 words/review. No significant difference in distribution (p=0.12).  
     - **Flag**: Cascade likely (ratings converged, depth dropped).  
  3. **Text Analysis**:  
     - Sampled 30 late reviews: 70% "lives up to the hype", 20% specific (e.g., "adheres to plastic minis").  
     - **Flag**: Strong cascade (high echo, low specificity).  
  4. **Traffic Source**:  
     - High-exposure (search): 80% "hype" mentions.  
     - Low-exposure (external): 30% "hype" mentions.  
     - **Flag**: Cascade amplified by score visibility.  
  5. **Bayesian Sniff Test**:  
     - No product changes. User base shifted from pros to beginners.  
     - **Judgment**: Cascade dominates (beginners trusting hype).  

  **Verdict**: 🚩 **Strong evidence of informational cascade/social proof**. Head of product is wrong—homepage featuring risks amplifying distortion.  

  #### **Case 2: Coffee Grinder (YouTuber Trashed, Rating ↓)**  
  1. **Time-Series Plot**:  
     - Rating dropped from 4.3→3.5 post-video. Continued sliding to 2.8. Negative reviews surged.  
     - **Flag**: Cascade likely (event-driven drop + sustained trend).  
  2. **Early vs. Late Reviewers**:  
     - Early (pre-video): Avg. 4.3, 200 words.  
     - Late (post-video): Avg. 2.9, 90 words. Significant difference (p=0.003).  
     - **Flag**: Genuine signal possible (significant change) → Proceed to text analysis.  
  3. **Text Analysis**:  
     - Sampled 30 late reviews: 50% cite prior reviews (e.g., "as User X said, it jams"), 80% specific (e.g., "jams at coarse grind").  
     - **Flag**: Mixed—echoing suggests cascade, but high specificity implies real issues.  
  4. **Traffic Source**:  
     - High-exposure: 60% citation of prior reviews.  
     - Low-exposure: 10% citation.  
     - **Flag**: Cascade influence present.  
  5. **Bayesian Sniff Test**:  
     - No product changes. YouTuber demonstrated grind jams; multiple reviews confirm.  
     - **Judgment**: Genuine defect amplified by informational cascade.  

  **Verdict**: ⚠️ **Cascade present, but genuine quality issues exist**. Burying it is justified, but the rating is over-amplified by copying.  

  ---

  ### **What the Procedure Can’t Resolve**  
  1. **Should you show average scores?**  
     - **Data limitation**: Requires A/B testing (e.g., hide scores for 10% of users). Without experiments, it’s a philosophical call:  
       - *Pro-display*: Helps users decide quickly.  
       - *Anti-display*: Hiding scores until post-review reduces cascades (per [Amazon’s 2019 experiment](https://arxiv.org/abs/1904.08895)).  
     - **Practical compromise**: Show scores but add friction (e.g., "Read 3 reviews to see rating").  

  2. **Are cascades "bad"?**  
     - **Values judgment**: If your goal is authentic feedback, cascades distort. If you prioritize user engagement, they create consensus.  

  3. **The "wisdom of crowds" counterargument**:  
     - Crowds work *without* herding. Cascades *prevent* wisdom by silencing private info. Your data shows this isn’t sorting itself out.  

  ### **Recommendations**  
  - **For flagged products**: Use this procedure to tag ratings with caveats (e.g., "Rating influenced by early reviews").  
  - **Systemic fix**: Propose a limited experiment: Hide scores for 5% of users for 3 months → compare rating variance/review depth.  
  - **Head of product compromise**: Feature the primer *with* disclaimer ("Hype-worthy, but read detailed reviews"). Bury the grinder—it’s genuinely flawed, cascade or not.  

  You’re not overthinking—cascades are real and measurable with your data. If six weeks of sign-off ever materializes, focus experiments on score-display variants.
