answer: |-
  ### Exam Question: Teleology and Function in Biology (90 minutes)

  **Background:** The dispute between etiological (selected-effect) and causal-role (systems) accounts of biological function centers on *what it means* for a trait to "have a function." Etiological theories (e.g., Wright, Millikan, Neander) ground function in evolutionary history: a trait’s function is what it was selected *for*. Causal-role theories (e.g., Cummins) ground function in current causal contributions within a containing system: a trait’s function is what it *does* that contributes to some specified capacity of the system. Both aim to capture the normativity inherent in function claims (e.g., "This heart is *supposed* to pump blood; this one is dysfunctional").

  **Instructions:** Using **all three** concrete cases below, critically evaluate whether the etiological or causal-role account provides a more satisfactory analysis of biological function. Your analysis **must** address:
  1.  How each account would analyze the function(s) in each case and the specific challenges each case poses to each account.
  2.  Whether, and how, each account can recover the **normativity** of function claims (i.e., the idea that something can *fail* to perform its function).
  3.  Whether the dispute between the two accounts is **substantive** (about how biology really works) or largely **verbal** (a difference in useful definitions for different purposes). Reject simplistic "both are useful" pluralism unless you rigorously argue *why* neither account is fundamental or how a principled hybrid resolves the core tensions illustrated by the cases.

  **The Cases:**
  **(a) The Mammalian Middle Ear:** The malleus and incus bones are homologous to bones forming the jaw joint in reptilian ancestors. Over evolutionary time, these bones were gradually co-opted for sound transmission. What function do these bones have? Does your answer apply equally at the *start* of this transition (reptilian jaw joint), during the *transition* (e.g., in early synapsids), and *now* (in modern mammals)?
  **(b) The Engineered Heart:** A human heart is grown *de novo* from induced pluripotent stem cells (iPSCs) and successfully implanted into a patient. It pumps blood adequately for two years but then develops a persistent arrhythmia. Does this organ have "functions" in the full biological sense? Is the surgeon who labels it "dysfunctional" after the arrhythmia develops speaking strictly or loosely?
  **(c) The Physiologists' Disagreement:** Two physiologists disagree about whether "secreting natriuretic peptide" counts as a *function* of the heart. One argues the heart was selected for pumping blood; its endocrine role is a recent evolutionary addition. The other argues the heart *currently* secretes the peptide, contributing significantly to fluid regulation. What would settle their disagreement? Could anything settle it definitively?

  ---

  ### Model Answer (Etiological Priority View) (~720 words)

  The etiological account provides a more fundamental and coherent analysis of biological function than the causal-role account, particularly in capturing normativity and resolving ambiguities across the three cases. While causal-role analysis is descriptively useful, it fails to ground functional normativity or handle cases involving history, novelty, or contested contributions without smuggling in etiological assumptions.

  **(a) The Mammalian Middle Ear:** The etiological account distinguishes *proper function* (the selected effect) from mere *causal effects*. For the reptilian ancestor, the homologous bones' proper function was facilitating jaw movement. During the transitional phase, these bones likely had *no* proper function related to sound transmission (as selection for that effect hadn't yet occurred), though they causally contributed to rudimentary hearing. *Now*, their proper function is sound transmission, as this is the effect for which they have been maintained by selection. The causal-role account faces a dilemma: if it assigns function based solely on current contribution (sound transmission), this misdescribes the past. If it relativizes function to temporal slices, it loses any stable, biologically significant notion of function and struggles to explain *why* the structure changed – it cannot distinguish a co-opted trait fulfilling a *new* function from a trait merely having a new effect. Only etiology captures the *shift* in normative expectation: the bones were *supposed* to form a jaw joint ancestrally; they are *supposed* to transmit sound now.

  **(b) The Engineered Heart:** The etiological account clearly states this heart lacks biological functions. It has no evolutionary history; it wasn't selected *for* anything. While it causally contributes to circulation (pumping blood), calling this its "function" is metaphorical or derivative, akin to assigning a function to a well-designed pump. Its "dysfunction" is similarly loose – it fails relative to the *surgeon's design intent* or the *patient's needs*, not relative to a biological norm established by selection. The causal-role account can easily assign the heart the function "pump blood" within the circulatory system, based on its causal contribution to systemic capacity (maintaining circulation) during the first two years. However, this leads to incoherence regarding normativity. When the arrhythmia develops, is it suddenly "dysfunctional"? But according to causal-role, its function is whatever it *currently* does to contribute. It might contribute *less* efficiently, but the causal-role account lacks the resources to say it is *failing* at its *proper* task. Its normativity is parasitic on implicit design or etiological standards. The surgeon’s "dysfunctional" label is strict only if grounded in an etiological norm (e.g., comparing it to naturally selected hearts) or design intent; on pure causal-role grounds, it’s loose, merely describing reduced efficiency.

  **(c) The Physiologists' Disagreement:** This disagreement hinges directly on the function concept employed. The first physiologist adopts an etiological view: the heart's *proper function* is pumping blood, its historically selected effect. Natriuretic peptide secretion, while real, is a side-effect or a very recent exaptation not yet stabilized as a proper function. The second adopts a causal-role view: secretion causally contributes to fluid regulation, a significant capacity of the organism, hence it's a function *now*. **Nothing can definitively settle the disagreement without first agreeing on the concept of "function" being used.** If they agree on etiology, they investigate whether secretion was a target of selection shaping heart structure. If they agree on causal-role, they quantify its contribution to fluid homeostasis. The dispute highlights the substantive difference between the accounts: etiology ties function to historical explanation (why the trait exists), while causal-role ties it to current mechanistic explanation (how the system works). Calling secretion a "function" means something fundamentally different under each account.

  **Normativity and the Substantive Dispute:** The causal-role account cannot ground intrinsic biological normativity. Norms within a causal-role framework are always relative to the chosen system and capacity (e.g., "fails relative to maintaining circulation"). This is arbitrary without an external standard – why is *that* capacity privileged? Etiology provides this standard: a trait is dysfunctional if it fails to perform the very effect that caused its selection and maintenance. The dispute is substantive, not merely verbal. It concerns the ontological grounding of functional properties and their normativity. While causal-role analysis is vital for mechanistic biology, it presupposes or mimics etiological norms when making normative claims ("dysfunction"). A principled hybrid would recognize causal-role functions but acknowledge they derive their normative force (when applicable) from underlying etiological functions or conscious design. Lazy pluralism ignores this dependency. The cases demonstrate that etiological function provides the necessary historical anchor for stable, normative function ascriptions through evolutionary change (a), for distinguishing biological functions from artificial successes (b), and for resolving conflicts about what counts as a trait's core purpose (c). Causal-role functions are context-dependent descriptions of current utility, insufficient for capturing the full, normative concept of biological function.

  ---

  ### Marking Scheme (Total: 25 Marks)

  **Must-Hit Points:**

  1.  **Case Analysis - Correct Application (Etiology):** (5 marks)
      *   (a) Distinguishes past (jaw) vs. present (sound) *proper function*; identifies transitional ambiguity for etiology (no sound function *yet*). (1.5)
      *   (b) States lab heart has *no* etiological functions; "dysfunctional" is loose (relative to design/implicit natural norm). (1.5)
      *   (c) Disagreement hinges on definition; etiology points to selection history for pumping, not (yet?) for secretion. (2)
      *   *Common Botch:* Misapplies history (e.g., saying reptilian bones had "hearing function"); ignores novelty in (b); misses definition clash in (c).

  2.  **Case Analysis - Correct Application (Causal-Role) & Challenges:** (5 marks)
      *   (a) Can assign sound transmission role now, but struggles with past/transition (freezing time-slice loses evolution). (1.5)
      *   (b) Easily assigns pumping function initially; struggles with normativity for arrhythmia (is it *dysfunctional* or just less contributory?). (1.5)
      *   (c) Easily assigns secretion as a function based on current contribution; highlights its independence from history. (2)
      *   *Common Botch:* Fails to identify the specific challenge each case poses to CR (esp. normativity in b, history in a).

  3.  **Normativity Addressed Explicitly:** (5 marks)
      *   Clearly explains how etiology grounds normativity (failure to perform selected effect). (2)
      *   Clearly explains CR's problem with normativity (relativistic, lacks intrinsic standard; norms often borrowed). (2)
      *   Applies this explicitly to cases (e.g., "dysfunctional" in b, expectations in a). (1)
      *   *Common Botch:* Mentions "normativity" but doesn't explain *how* each account tries (or fails) to capture it; doesn't link to cases.

  4.  **Dispute Nature: Substantive vs. Verbal & Rejecting Lazy Pluralism:** (5 marks)
      *   Explicitly states the dispute is substantive (about grounding/nature of function/normativity). (1)
      *   Rejects "both useful equally" without deeper argument. (1)
      *   Takes a clear position: Defends one as *more fundamental* (e.g., etiology grounds CR normativity) **OR** Articulates requirements for a *principled hybrid* (e.g., CR functions derive normative force from etiology/design). (3)
      *   *Common Botch:* Defaults to lazy pluralism; asserts dispute is verbal without argument; fails to go beyond "both useful".

  5.  **Clarity, Structure & Use of Cases:** (5 marks)
      *   Logical structure, integrates cases throughout (not just listed). (2)
      *   Precise terminology (proper function, causal role, normativity, selected effect, contribution). (1)
      *   Cases are *reasoned through* to support points (not just mentioned). (2)
      *   *Common Botch:* Cases bolted on disjointedly; key terms misused; cases stated but not analyzed.

  **Separating A (21-25) from B (16-20):**
  *   An **A answer** will not only correctly apply both accounts to all cases but will **synthesize them to reveal the core tension**, particularly around normativity (e.g., showing how CR struggles in (b) precisely because it lacks etiology's normative anchor). It will offer a **compelling justification** for prioritizing one account *as more fundamental* (e.g., arguing etiology is necessary for genuine biological normativity, making CR descriptive but derivative) or present a **non-trivial hybrid proposal** (e.g., "CR identifies functions-in-a-system, but only traits with etiological functions can be *dysfunctional* within that system"). It will explicitly use the cases *as evidence* for the substantive nature of the dispute and the failure of lazy pluralism.
  *   A **B answer** will competently describe both accounts' handling of the cases and normativity, recognize the dispute is substantive, and avoid lazy pluralism, but may lack the **synthesis and deeper justification**. It might defend one view but with weaker argumentation, or propose a hybrid that doesn't resolve the core tensions highlighted by the cases. The case use might be competent but less probing.
