prompt: |-
  I'm a software engineer, never taken a philosophy class in my life, but my brother-in-law and I got into it at Thanksgiving about when it's okay to just take someone's word on a moral question instead of figuring it out yourself. I've been going through my gut calls and I can't find the pattern. Here they are, tell me if there's one principle that covers them:

  - Before signing with a defense contractor, I ask my most thoughtful friend whether it's wrong to build targeting software. She says it's fine, I take her word and sign. Totally fine by me.
  - Same job, but this time I don't even ask — I just know she'd say it's fine, so I skip the agonizing and sign. Feels a little worse somehow? Can't explain why.
  - Checking a website that rates charities on effectiveness before donating. Obviously fine, that's just being responsible.
  - On a jury, another juror who's clearly smarter and more thought-through about it says the defendant deserves leniency, and I switch my vote without working through the evidence myself. Not fine — that one's mine to decide.
  - It's 11pm, I'm exhausted, deciding whether to tell a friend his partner is cheating. I text my sister, she says tell him, I tell him. Fine, honestly. I don't feel bad about that one at all.
  - My manager says the dark pattern we're shipping is fine, standard industry stuff, and I go along without pressing him on it. Not fine, and no amount of "I trusted his judgment" gets me off the hook.
  - A hospital ethics committee tells us it's time to take my uncle off the ventilator, and we do it, without me forming any independent view of my own. Fine? I think fine.
  - Voting exactly how my well-informed friend votes on the local ballot measures. Kinda lazy but fine.

  The jury one and the 11pm text one feel really different to me but look basically identical on paper — in both I'm rubber-stamping someone else's moral read of a situation that was my job to figure out. And there's a case I keep circling that made me realize I don't have a principle: suppose I could hire a "personal ethics advisor," like an accountant but for moral questions — all my hard calls route through them, they're wise and incorruptible. That sounds grotesque to me, but it's hard to see what exactly is wrong with it if the friend and the ethics committee cases are fine. So: is there a principle that saves all my verdicts, or do I have to give some up, and which ones? And what does the principle say about the advisor?
reasoning: |-
  Okay, let's tackle this software engineer's moral delegation dilemma. The user has listed several scenarios where they either relied on someone else's moral judgment or didn't, and they're seeking a unifying principle. 

  First, I notice they're wrestling with cognitive dissonance - their gut reactions don't seem logically consistent. The jury duty vs. cheating revelation cases are particularly interesting because structurally similar (deferring to others on personal moral decisions) but feel different to them. 

  Hmm... the key might lie in three dimensions: consequence severity, personal agency boundaries, and decision reversibility. When they deferred on the ventilator decision (high stakes, irreversible) it felt acceptable because medical ethics committees have legitimate authority in that domain. But the jury vote was unacceptable because society literally appoints jurors as individual moral agents.

  The dark pattern case is revealing - they feel culpable despite managerial authority, maybe because as a software engineer they have professional responsibility for UX ethics. Interesting how they mention "no amount of trusting his judgment gets me off the hook" - that suggests some decisions can't be delegated by role.

  The hypothetical ethics advisor scenario makes them uncomfortable, and that's actually healthy. It would create moral outsourcing - the difference between consulting specialists (like charity evaluators) versus surrendering agency. The uncle's ventilator case works because it's a specific institutional context, not blanket abdication.

  What's emerging is... ah! The principle seems to be about legitimate delegation versus core moral agency. Some domains (medical ethics, charity evaluation) have established frameworks for delegation, while others (professional ethics, civic duty) demand personal engagement regardless of difficulty. The exhaustion factor in the cheating scenario gets a pass because it's temporal - they're not refusing to think, just wisely recognizing impaired capacity.

  For the defense contractor cases - the slight discomfort when skipping consultation might stem from violating procedural diligence, even when predicting the outcome. It's about showing respect for the gravity of the decision by actually engaging the process.

  The ballot measure example sits on the edge - technically permissible since voting allows proxy judgment, but their "kinda lazy" comment shows they sense the compromise of civic responsibility. That might be the least defensible of their "fine" judgments under scrutiny.

  The unifying framework could be: "Defer when (1) the domain has legitimate authority structures, (2) the stakes align with those structures' competence, and (3) you lack capacity/expertise without surrendering core responsibilities." The ethics advisor fails condition #1 - it creates an artificial authority structure for life's general moral agency, which we're not permitted to outsource.
answer: |-
  Your gut reactions reveal a consistent principle: **Moral deference is justified when it respects legitimate expertise/authority *and* doesn't violate your core personal agency responsibilities.** Let's break this down:

  ### The Principle: "Legitimate Delegation with Agency Preservation"
  1. **Legitimacy of Source**: Is the person/institution a *recognized authority* in the relevant domain, or are they offering advice within a *proper consultative role*?
  2. **Preservation of Core Agency**: Does deferring avoid *abdicating a fundamental personal or role-based duty* where *your* moral judgment is required?

  ### Applying the Principle to Your Cases:
  | Scenario                          | Verdict | Why It Fits                                                                 |
  |-----------------------------------|---------|-----------------------------------------------------------------------------|
  | Defense job (after asking friend) | ✅ Fine | Consulted a trusted advisor; no core agency violated (career choice isn't a unique moral duty). |
  | Defense job (without asking)      | ⚠️ Worse| Skipped due diligence; feels like negligence, not illegitimate delegation. |
  | Charity effectiveness site        | ✅ Fine | Legitimate expertise source (domain-specific evaluators).                  |
  | Jury duty (switching vote)        | ❌ Not Fine | **Core agency violated:** Society appoints *you* as the moral arbiter. Jury duty is non-delegable. |
  | Exhausted cheating reveal         | ✅ Fine | Consulted trusted advisor during impaired capacity; personal agency preserved (you still *chose* to ask/act). |
  | Dark pattern at work              | ❌ Not Fine | **Core agency violated:** Your professional ethics as an engineer aren't delegable to a manager. |
  | Hospital ethics committee         | ✅ Fine | Legitimate authority (institutional expertise + legal role). Not *your* medical/ethical decision alone. |
  | Voting with informed friend       | ✅ Fine | Consultative; voting allows proxy judgment. Lazy, but no core duty violated. |

  ### Why the Seemingly Similar Cases Differ:
  - **Jury Duty vs. Cheating Revelation**:  
    The jury is a *formal role* demanding *your* independent judgment. Society relies on 12 individuals exercising personal moral reasoning. Delegation here is a betrayal of trust. The cheating advice was a *personal consultation* during distress—you retained final agency.  
  - **Ethics Committee vs. Manager**:  
    The hospital committee has *institutional legitimacy* and expertise in end-of-life care. Your manager has no such moral authority over *your* professional ethics; engineers have duties to users/society beyond hierarchy.

  ### The "Personal Ethics Advisor" Problem:
  This feels grotesque because it violates **both** parts of the principle:  
  1. **Illegitimate Source**: An "advisor" lacks domain-specific authority (unlike an ethics committee) or relational standing (unlike a trusted friend/sister).  
  2. **Agency Abdication**: Moral reasoning is a core human responsibility. Outsourcing *all* hard calls turns you into a moral automaton, negating your capacity for growth and authentic choice.  

  **Key Distinction**: Consulting experts *on specific domains* (medical ethics, charity efficacy) is prudent. Surrendering *general moral agency* denies your dignity as a moral agent.

  ### Refinements to the Principle:
  - **Add "Capacity"**: Deference is more justified when you lack expertise, time, or emotional bandwidth (e.g., the 11pm cheating decision).  
  - **Add "Reversibility"**: Higher stakes/irreversible decisions (ventilator) demand more rigorous delegation (e.g., hospital committee > lone friend).  

  ### Verdicts to Reconsider:
  - **Voting with Friend**: While technically "fine" under the principle, it skirts agency neglect. Democracy thrives on engaged reasoning—deferring *all* ballot measures is civic laziness.  
  - **Defense Job Without Asking**: Your discomfort is warranted. It's not morally wrong, but it's *epistemically reckless*—you avoided due diligence.

  ### Final Principle:
  > **"You may defer moral judgment when:  
  > (1) The source has legitimate expertise/authority in the domain, OR consultation respects relational/contextual norms;  
  > AND  
  > (2) Deferring doesn't abdicate a non-transferable personal, professional, or civic duty requiring your direct moral engagement."**  

  This preserves moral humility (we aren't experts on everything) while demanding ownership where it matters most. The ethics advisor fails—it commodifies your moral core, which is yours alone to steward.
