prompt: |-
  so I'm a phd student in philosophy of science and next month I'm giving a departmental seminar where I defend a modest version of the doomsday argument — basically Carter and Leslie's self-sampling reasoning, but restricted to cases where the reference class is fixed by the observation itself (I call this the "epistemic cohort" move), so I'm not making claims about aliens or worlds with infinitely many observers. The core claim is just: if you treat your birth rank as a random draw from all humans who will ever exist, the posterior shifts doom-ward, that shift is genuine even if its practical import is basically nil, and the shift is not some artefact of bad handling of indexicals.

  The audience: our department is mostly mainstream epistemologists who think any argument leaning on "I could have been born earlier or later" is straight-up equivocation on the indexical, plus one formal epistemologist who knows the Bayesian literature cold and is definitely going to come at me with the self-indication assumption and the Presumptuous Philosopher, plus one older metaphysician who thinks there simply is no such thing as a chance of being me in the first place. No anthropics people in the room, which cuts both ways I guess.

  Draft my Q&A prep sheet: the seven or so objections I'll actually face from these people, phrased the way each of them would phrase it, ordered by how much damage they'd do to the paper, each with a two-minute reply and a note on where the reply is softest (I'd rather know now than find out in the seminar). Also tell me which objection I should try to pre-empt inside the talk itself, and write down the one question I'm quietly hoping nobody asks — you know the type. I realise some of these objections are just going to be skirmishes over wording, so flag which ones are load-bearing versus which I can concede for free.
