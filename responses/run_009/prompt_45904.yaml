answer: |-
  Below is a decision tree addressing the ontological status of the quantum state, structured around substantive questions rather than interpretation labels. It highlights contested assumptions (e.g., preparation independence in PBR) and flags where positions coincide or require further distinction. Positions are categorized based on their answers to core ontological questions, and unnamed branches indicate unexplored, incoherent, or untenable views under mainstream assumptions.

  ---

  ### **Decision Tree: What Does the Quantum State Represent?**

  #### **Question 1: Does the quantum state describe physical reality?**  
  *(Or is it merely informational/instrumental?)*  
  - **No (Epistemic/Instrumental) → Proceed to Question 2**.  
    *Example consensus: Bell inequality violations rule out local hidden variables, but not all epistemic views.*  
  - **Yes (Ontic) → Proceed to Question 3**.  
    *Example consensus: All ontic views accept quantum state realism (e.g., the wavefunction is physical).*

  ---

  #### **Branch: Epistemic/Instrumental (Answered "No" to Q1)**
  **Question 2: Is the quantum state about an *agent's knowledge*?**  
  - **Yes (Subjective Information) → QBism**.  
    *QBism treats the quantum state as personal belief (subjective Bayesian probability). Outcomes are agent-relative.*  
  - **No (Non-subjective Tool) → Copenhagen-style Instrumentalism**.  
    *The state is a predictive instrument (e.g., for lab outcomes), with no ontological commitment. "Reality" is deferred to classical contexts.*  

  ---

  #### **Branch: Ontic (Answered "Yes" to Q1)**
  **Question 3: Can two distinct pure quantum states describe the *same* physical situation?**  
  *(This is the core issue of the PBR theorem.)*  
  - **Yes (ψ-epistemic) → Unnamed branch [Largely unexplored/contested]**.  
    *PBR rules this out under **preparation independence** (contestable). Rejecting this assumption might allow ψ-epistemic models, but none are developed or widely accepted. Most consider this untenable.*  
  - **No (ψ-ontic) → Proceed to Question 4**.  
    *PBR (with preparation independence) supports this. Bohmian mechanics and Everett both land here.*  

  **Question 4: Is the quantum state a *complete* description of physical reality?**  
  - **Yes (ψ-complete) → Proceed to Question 5**.  
    *The quantum state exhausts physical facts (no hidden variables).*  
  - **No (ψ-supplemented) → Bohmian Mechanics**.  
    *Physical reality = quantum state + additional ontology (e.g., particle trajectories). Outcomes are determined by the "hidden variables."*  

  **Question 5: Does the theory require *dynamical wavefunction collapse*?**  
  *(Splits ψ-complete theories.)*  
  - **Yes → Objective-Collapse Theories (e.g., GRW, CSL)**.  
    *The quantum state evolves stochastically (spontaneous collapses) to definite outcomes. Collapse is physical.*  
  - **No → Everett (Many-Worlds)**.  
    *The quantum state evolves unitarily; all outcomes occur in branching worlds. "Outcomes" are perspectival.*  

  ---

  ### **Key Observations & Contested Issues**
  1. **Bohmian Mechanics vs. Everett**:  
     - Both are ψ-ontic (Question 3: "No") but diverge at Question 4:  
       - Bohm: ψ-supplemented (quantum state + particles).  
       - Everett: ψ-complete (quantum state alone).  
     - **Further distinguishing question**: *Does the theory require additional ontological structure beyond the quantum state?*  
       - Bohm: Yes (particle positions).  
       - Everett: No (emergent branching from ψ).  

  2. **PBR Theorem**:  
     - **Consensus**: PBR rules out ψ-epistemic models if preparation independence holds.  
     - **Contested**: Whether preparation independence is physically mandatory (e.g., in non-separable spacetimes). Critics note it may beg the question against holistic ontologies.  

  3. **Unnamed Branches**:  
     - ψ-epistemic + ontic (Q3 → "Yes") is **contested/unexplored**. No named theory occupies this branch.  
     - Instrumentalist views rejecting both realism *and* subjectivity (e.g., operationalism) are grouped under Copenhagen.  

  4. **Outcomes**:  
     - All positions except QBism and Copenhagen treat outcomes as physical (Bohm/Everett/collapse objectively define them).  
     - QBism/Copenhagen treat outcomes as experiential/contextual.  

  ---

  ### **Tree Summary**
  ```mermaid
  graph TD
  A[Q1: Describes physical reality?] -->|No| B[Q2: About agent's knowledge?]
  A -->|Yes| C[Q3: Can distinct ψ describe same state?]
  B -->|Yes| D[QBism]
  B -->|No| E[Copenhagen-style Instrumentalism]
  C -->|Yes| F[Unnamed: ψ-epistemic<br><i>Contested/unexplored</i>]
  C -->|No| G[Q4: Complete description?]
  G -->|No| H[Bohmian Mechanics]
  G -->|Yes| I[Q5: Dynamical collapse?]
  I -->|Yes| J[Objective-Collapse<br>e.g., GRW]
  I -->|No| K[Everett]
  ```

  ### **Notes for the Seminar**
  - **Clarify assumptions**: PBR’s preparation independence is not experimentally testable and is rejected in some relational ontologies (e.g., RQM, though not covered here).  
  - **Everett vs. Collapse**: Both are ψ-complete but split on fundamental dynamics (unitary vs. stochastic).  
  - **Bell’s Theorem**: Rules out *local* hidden variables (relevant to Bohm’s non-locality) but does not address ψ-ontology directly.  
  - **Neutral Terminology**: "Epistemic" here means "statistically indistinguishable physical states," per PBR’s framework.  

  This tree isolates core metaphysical commitments while flagging where interpretations overlap (Bohm/Everett at Q3) and how to split them (Q4/Q5). It distinguishes settled results (Bell violations) from contested inferences (PBR’s scope).
