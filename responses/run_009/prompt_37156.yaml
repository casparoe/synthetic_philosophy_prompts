prompt: |-
  I'm a science and ideas writer, and for the past few years a lot of my beat has been climate economics, which means I keep ending up in conversations about discount rates and eventually had to admit I don't actually know what I think about discounting the future. So I did what I do with climate contrarians: I sat down and wrote out my gut verdicts on a bunch of cases, hoping a pattern would fall out. It half did, and now I need someone to actually do the work of extracting the principle, because I can't get there myself. Here are the verdicts, honestly held: (1) Me taking $100 today over a guaranteed, inflation-adjusted $115 a year from now feels fine — not maximally smart maybe, but not irrational and not immoral, it's my money and my life. (2) My friend who smokes because he discounts his own future self: also his business, no objection from me. (3) A government deciding between a pandemic-preparedness program that saves 100 lives this decade and an investment fund that would save 250 lives in the year 2100 — my gut says the first option wins, those near-term lives feel more pressing, but. (4) If you ask me point blank whether a child born in 2100 matters less than a child born next year, I say absolutely not, and I'd be embarrassed to write anything else. (5) Choosing a tax cut now over preventing a famine in 150 years to benefit people who don't exist yet feels close to monstrous, worse than ordinary fiscal irresponsance.

  So there's the obvious split — I discount for myself, I refuse to discount for others — but it keeps fraying at the edges. Case 3 bugs me the most: I judged the near-term lives more urgent even though I deny, in case 4, that the later people matter less, and I can't tell if that's a real moral asymmetry or just that identifiable near-term victims are more vivid, which would be a bias and not a reason. There's also the flip side I worry about: a colleague told me that if you really refuse to discount the future at all, you're commited to a near-total savings duty — this generation scrimping so that the (probably much richer) people of 2300 can be even richer — and honestly that sounds wrong too, which maybe means my no-discounting conviction in case 4 isn't as solid as I claimed.

  What I want from you is a principle, or a couple of rival candidates, stated precisely enough that I could actually apply it in a story: something that says when discounting is legitimate and when it isn't, and why the self/other split (if that's even the right split) isn't just arbitrary. Please tell me which of my verdicts your favored principle can capture and which it has to overturn — I suspect case 3 goes, but maybe you can save it with the thought that the far-future benefit is less *certain* rather than worth less, and I'd want to know whether that rescue is principled or a dodge. Then run the principle on cases I haven't listed: my colleague's scrimping-for-2300 scenario, and one more I'll leave you to construct — something that would test the self/other split at the boundary, like a person making an irrevocable choice on behalf of their own much older future self, or a small community deciding for its own descendants. If two principles tie on my cases, tell me which extra consideration should break the tie, and don't be shy about telling me a verdict of mine is just wrong.
reasoning: |-
  Okay, the user is a science writer focused on climate economics, grappling with the ethical dilemma of discounting future costs and benefits. They've laid out five specific cases where their intuitive judgments about discounting clash, revealing a tension between personal/financial decisions (where discounting feels permissible) and intergenerational ethical ones (where it feels wrong). Their core struggle is reconciling cases 3 and 4: valuing near-term lives more while insisting future people matter equally. They also worry about extreme implications like oppressive savings obligations.

  Hmm... their self-described "gut verdicts" actually map surprisingly well to established philosophical distinctions! The personal/impersonal split in cases 1-2 vs. 4-5 is textbook agent-relative vs. agent-neutral reasons. And their unease in case 3 suggests they're intuitively weighting certainty and institutional capacity—which is smart, because those are empirically relevant factors climate economists actually debate.

  What they really need isn't just principles though—it's narrative tools. As a writer, they'll want to show readers why discounting a bond isn't like discounting a life. The key is framing: when they report on climate cost-benefit analyses, they can highlight whether the model conflates predictive uncertainty (will this future benefit materialize?) with pure time preference (do we care less about future people?). That’s where most policy debates get murky.

  Also, their colleague's "scrimping for 2300" objection reveals a deeper need: they want to reject both extreme altruism and pure discounting. Luckily, most philosophers do too—even Parfit thought obligations diminish across generations. I should emphasize that threshold principles or capability approaches exist precisely to avoid that dystopian savings demand.

  ...Wait, their famine example (case 5) is extra telling. They call it "monstrous" not just inefficient. That suggests deontological intuitions—rights violations can't be discounted. That’s worth naming explicitly since it explains why case 5 feels different than case 3’s statistical lives tradeoff.

  For the test cases: the irrevocable choice for one's future self should expose if their "self/other split" is really about identity (self vs. other) or control (agency vs. powerlessness). If they’d let their future self suffer for current pleasure, that’d undermine their earlier smoking tolerance. But I suspect they wouldn’t—which points toward the uncertainty principle being more consistent.

  Biggest unspoken need? Permission to accept "modest" discount rates without feeling unethical. They’re haunted by the idea that even 1% pure time preference devalues future lives. But if I show how 1% could represent reasonable uncertainty buffers (e.g., 0.3% catastrophe risk + 0.7% institutional decay), that might lift the guilt. Climate economists like Stern actually take this hybrid approach.
answer: |-
  Based on your deeply held verdicts, here's a principle that captures most of them while providing a clear, applicable framework, and addresses the core tension between Cases 3 & 4:

  **The Principle of Agent-Relative Prudence & Agent-Neutral Impartiality (ARP/ANI):**

  1.  **Agent-Relative Prudence (ARP):** *Individuals and collectives acting primarily for their own benefit (or the benefit of identified, existing dependents within their sphere of direct responsibility) may legitimately discount future benefits/costs due to:*
      *   **Uncertainty:** Genuine risks that the future benefit/cost won't materialize (e.g., death, investment failure, policy reversal).
      *   **Opportunity Cost:** The concrete, near-term alternative uses of resources *available to that agent* that fulfill immediate needs or secure foundational well-being.
      *   **Limited Agency/Predictive Capacity:** Inability to reliably influence or predict outcomes far beyond their natural planning horizon or lifespan.
  2.  **Agent-Neutral Impartiality (ANI):** *Collectives (especially governments/institutions) acting as stewards for humanity across generations must treat the intrinsic value of human well-being (lives, basic capabilities) equally across time. Discounting the intrinsic value of future lives or fundamental well-being based purely on temporal distance is illegitimate.* However, discounting *monetary flows* or *uncertain benefits* used to *achieve* that well-being is permissible based on:
      *   **Predictive Uncertainty & Risk:** The increasing likelihood that predicted distant benefits (especially contingent on complex systems) won't materialize as planned.
      *   **Diminishing Marginal Utility:** If future generations are predictably wealthier, additional monetary increments provide less well-being gain.
      *   **Opportunity Cost (Global Scale):** The cost of sacrificing *essential current well-being* or *investments critical for future capacity* to pursue highly uncertain distant benefits.

  **Applying ARP/ANI to Your Verdicts:**

  1.  **$100 Now vs. $115 Later (You):** **Fits ARP.** Legitimate discounting due to personal uncertainty (your needs, death), near-term opportunity cost (what $100 can do for you *now*), and limited agency/predictive capacity over your personal future cash flow.
  2.  **Smoking Friend:** **Fits ARP.** His body, his future self within his sphere of responsibility. Discounting due to his personal valuation of near-term pleasure vs. uncertain future health cost. (You accepting his choice aligns with respecting ARP for individuals).
  3.  **Pandemic Prep (100 lives now) vs. Fund (250 lives in 2100):** **Overturns your gut verdict under strict ANI.** ANI forbids valuing 2100 lives less intrinsically. However, ARP/ANI *permits* choosing the pandemic prep if:
      *   **Predictive Uncertainty:** The 2100 benefit is highly uncertain (will the fund exist? Will conditions make it effective?).
      *   **Opportunity Cost (Global):** Funding the 2100 fund requires sacrificing something *essential now* (like basic healthcare for the vulnerable) that the pandemic prep doesn't, OR the pandemic prep itself builds critical *near-term capacity* essential for long-term resilience.
      *   **Diminishing Marginal Utility:** If future generations are *much* richer/healthier, saving 250 lives then might represent a smaller *gain* in aggregate well-being than saving 100 lives now from a preventable catastrophe. **Your "urgency" likely conflates lower certainty and higher opportunity cost now.** Rescuing Case 3 via uncertainty/opportunity cost is **principled** under ARP/ANI, not a dodge.
  4.  **Child 2100 vs. Child Next Year (Intrinsic Value):** **Core of ANI.** Captured perfectly. Intrinsic value of a life is equal across time. No pure time preference allowed.
  5.  **Tax Cut Now vs. Preventing Distant Famine:** **Fits ANI.** Choosing the tax cut (a near-term benefit for existing, likely wealthier people) over preventing fundamental harm (famine) to future people violates ANI. The intrinsic value of preventing famine for future people cannot be discounted purely due to time. The harm is severe and certain *if* the prevention isn't done, while the tax cut benefit is marginal. This feels "monstrous" because it prioritizes trivial agent-relative gain (for current voters/politicians) over catastrophic agent-neutral harm.

  **Handling Your Concerns:**

  *   **Self/Other Split:** It's recast as **Agent-Relative vs. Agent-Neutral Contexts**. The rules change based on *who is acting* and *for whom*. Your intuitions track this: personal finance/smoking (agent-relative) vs. famine (agent-neutral duty) vs. the tricky government pandemic case (agent-neutral context, but uncertainty/opportunity cost arguments apply).
  *   **"Scrimping for 2300" Scenario:** ARP/ANI **rejects** oppressive savings. Why?
      *   **Diminishing Marginal Utility:** If people in 2300 are vastly richer, transferring massive wealth from poorer current people provides minimal well-being gain to them, while causing significant hardship now (violating core well-being for existing people under ANI).
      *   **Essential Current Investment:** Sacrificing *current* investments in health, education, or clean energy infrastructure *essential* for maintaining civilizational capacity and enabling *any* future prosperity is a bad opportunity cost.
      *   **Predictive Uncertainty:** Predictions 300 years out are fantasy. The "benefit" is wildly uncertain. ANI requires *prudent* stewardship, not blind sacrifice for hypothetical future gains. The duty is to ensure a *decent foundation* for the future, not maximal wealth.
  *   **Case 3 Rescue:** Using uncertainty/opportunity cost is **principled** under ARP/ANI. It's not denying the equal value of lives; it's acknowledging the practical realities of achieving benefits.

  **Testing the Boundary: Two New Cases**

  1.  **Irrevocable Future Self Choice:** You can choose a procedure guaranteeing you immense pain at age 80 in exchange for significant pleasure now. *ARP applies.* This is firmly within your agent-relative sphere. You can discount the future pain due to uncertainty (will you live to 80? Will the pain be as bad?), the high opportunity cost of *not* having the pleasure now, and your limited predictive capacity about your 80-year-old self's preferences/tolerance. Legitimate discounting, analogous to smoking.
  2.  **Small Community for Descendants:** An isolated village must choose: fix its crumbling school *now* (benefiting current kids) OR invest in a very robust, low-maintenance water system that will definitely benefit descendants 100 years from now much more than a cheaper fix would. *This is the boundary.*
      *   **ARP Aspect:** They are a small collective with direct ties and responsibility to descendants. Fixing the school addresses immediate, essential needs.
      *   **ANI Aspect:** They are stewards for future community members. The water system benefits fundamental well-being equally across time.
      *   **ARP/ANI Verdict:** This is tough. ANI demands equal intrinsic value for descendants' well-being. However, ARP's "limited agency/predictive capacity" and "opportunity cost" are strong: Will the community even exist in 100 years? Does the crumbling school represent an *immediate threat* to core capabilities *now*? If the school's collapse means *no education now* (a foundational capability), fixing it might be the prudent agent-relative/immediate stewardship choice, even if the water system is objectively a better long-term investment per dollar. If the school issue is less critical (e.g., slightly worse facilities), the water system likely wins under ANI. **The tie-breaker is the severity of the near-term sacrifice to essential current well-being vs. the certainty and magnitude of the long-term fundamental well-being gain.**

  **Conclusion & Recommendation:**

  The **ARP/ANI Principle** captures the core of your intuitions:
  *   Legitimizes personal/agent-relative discounting (Cases 1, 2, Irrevocable Self-Choice).
  *   Forbids discounting the intrinsic value of future lives/well-being (Case 4).
  *   Explains why Case 5 feels monstrous (violates ANI).
  *   Rescues Case 3 by allowing discounting of *uncertain benefits* and weighing *opportunity costs* in an agent-neutral context, not discounting lives.
  *   Rejects oppressive savings (Scrimping for 2300) via diminishing marginal utility and uncertainty.
  *   Provides nuance for boundary cases (Community) based on essential current well-being vs. certainty of future fundamental gain.

  **What to Overturn?** Primarily your *initial gut feeling for Case 3*. The principle clarifies that while the lives are equal, the *practicality* of saving them isn't. If the 2100 benefit is highly certain and doesn't sacrifice essential current needs, ANI *requires* choosing it. Your "urgency" bias needs interrogation – is it truly essential immediate need, or just salience? Use the ARP/ANI filters (Uncertainty? Essential Opportunity Cost?) rigorously.

  This gives you a precise, defensible framework for your writing: **Distinguish the context (Who acts? For whom?), never discount intrinsic future well-being, but discount monetary flows/uncertain benefits based on risk, opportunity cost, and diminishing returns.**
