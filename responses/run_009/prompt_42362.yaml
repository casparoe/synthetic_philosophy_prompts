answer: |-
  **Exam Question**

  Consider the following argument by a student regarding the absent-minded driver:  

  "Since the driver cannot distinguish between the two intersections, they are effectively at a single decision node from their own perspective. This means that the ex ante optimal plan (go straight at the first intersection and exit at the second) is not available because the driver must choose the same action at both intersections. Therefore, the driver is constrained to choose either exit at both or straight at both, or to randomize. When we compute the optimal mixed strategy at this single effective node, we get the same result as the standard mixed strategy equilibrium: randomize with probability \( p^* = \frac{2}{3} \) of going straight, yielding an expected payoff of \( \frac{4}{3} \). This resolves the paradox because it shows that the apparent irrationality of the ex ante plan is due to an unattainable constraint, and the mixed strategy is the best available under the circumstances."  

  Critically evaluate this argument. Address the following:  
  1. Whether treating the two intersections as a "single effective node" justifies the optimization procedure, given that the chosen action is realized at both intersections (i.e., it applies to two distinct decision points in the tree).  
  2. What this reveals about the relationship between ex ante commitment (planning) and acting under imperfect recall.  
  Support your analysis with the correct calculations and discuss any errors in the student’s reasoning.  

  ---

  **Model Answer**  

  The student’s argument correctly identifies that imperfect recall forces the driver to adopt the same strategy at both intersections, rendering the ex ante optimal pure strategy (straight, then exit) unavailable. However, the argument contains critical flaws in its numerical solution and fails to fully grapple with the implications of treating two nodes as one, especially regarding optimization and time-consistency.  

  **1. The "single effective node" optimization and its justification:**  
  The student claims the optimal strategy is \( p = \frac{2}{3} \) (probability of going straight) with an expected payoff of \( \frac{4}{3} \). This is incorrect. Under the single-node abstraction, the driver’s strategy \( p \) must account for the fact that the action is realized at *both* intersections, but with different path probabilities:  
  - Exit at the first intersection: Payoff = 1, probability = \( 1 - p \).  
  - Go straight at the first and exit at the second: Payoff = 4, probability = \( p(1 - p) \).  
  - Go straight at both: Payoff = 0, probability = \( p^2 \).  
  The ex ante expected payoff is:  
  \[
  U(p) = (1 - p) \cdot 1 + p(1 - p) \cdot 4 + p^2 \cdot 0 = 1 - p + 4p - 4p^2 = 1 + 3p - 4p^2.  
  \]  
  Maximizing \( U(p) \) yields \( \frac{dU}{dp} = 3 - 8p = 0 \), so \( p^* = \frac{3}{8} \). The expected payoff is \( U\left(\frac{3}{8}\right) = 1 + 3 \cdot \frac{3}{8} - 4 \cdot \left(\frac{3}{8}\right)^2 = 1 + \frac{9}{8} - \frac{36}{64} = \frac{25}{16} \). The student’s \( p = \frac{2}{3} \) gives \( U\left(\frac{2}{3}\right) = 1 + 3 \cdot \frac{2}{3} - 4 \cdot \left(\frac{2}{3}\right)^2 = \frac{11}{9} \approx 1.22 \), which is suboptimal.  

  The "single node" approach *is* valid for ex ante optimization because it correctly aggregates the two decision points under the constraint of identical actions. The driver’s lack of recall makes the two intersections indistinguishable, so a single strategy variable \( p \) is appropriate. The payoff function \( U(p) \) inherently handles the dual realization of actions by weighting outcomes by their ex ante probabilities, which depend on \( p \). Thus, the optimization is justified, but the student errs in execution.  

  **2. Time-consistency and the relationship between ex ante planning and acting:**  
  A deeper issue is whether the ex ante optimal strategy \( p^* = \frac{3}{8} \) remains rational when the driver *is* at an intersection (interim perspective). Under imperfect recall, the driver must assess the optimal action given their belief about which intersection they are at. Using Bayes’ rule, if strategy \( p \) is played, the probability of being at the first intersection (given they are at one) is \( q = \frac{1}{1 + p} \) (since the second intersection is reached only with probability \( p \) from the first). For \( p = \frac{3}{8} \), \( q = \frac{1}{1 + \frac{3}{8}} = \frac{8}{11} \).  

  At an intersection, the expected payoff of exiting is \( q \cdot 1 + (1 - q) \cdot 4 = \frac{8}{11} \cdot 1 + \frac{3}{11} \cdot 4 = \frac{20}{11} \).  
  The expected payoff of going straight is \( q \cdot [\text{payoff if first}] + (1 - q) \cdot [\text{payoff if second}] \). If the driver goes straight:  
  - At the first intersection, they reach the second and get \( 4(1 - p) \) (since they exit at the second with prob \( 1 - p \)).  
  - At the second intersection, going straight yields 0.  
  Thus, going straight gives \( q \cdot [4(1 - p)] + (1 - q) \cdot 0 = \frac{8}{11} \cdot 4 \cdot \frac{5}{8} = \frac{20}{11} \).  

  Since exit and straight both yield \( \frac{20}{11} \), the driver is indifferent and has no incentive to deviate from \( p = \frac{3}{8} \). The ex ante optimal strategy is time-consistent.  

  **Conclusion and broader implications:**  
  The student’s argument correctly identifies the constraint of imperfect recall and the need for a single-node optimization but errs in calculating \( p \) and the payoff. The core insight—that the "single node" approach resolves the paradox by making the ex ante plan unavailable—is sound. However, the argument overlooks that optimization at the single node must account for how the action affects *both* histories (first and potential second intersection) via the ex ante probabilities.  

  This case illustrates that under imperfect recall, the ex ante optimal strategy can be both feasible and time-consistent, avoiding a conflict between commitment and sequential rationality. Here, identical information sets force a single strategy, and the ex ante optimum aligns with interim incentives. In other problems, imperfect recall might cause time-inconsistency (e.g., if the ex ante strategy were not interim rational), but this driver’s problem shows that constraints from imperfect recall do not inherently create such conflicts. The "paradox" arises only if one ignores the necessity of a uniform strategy, and it dissolves with correct optimization.  

