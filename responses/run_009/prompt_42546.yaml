  My judgment: The empirical-conceptual divide isn't just verbal. Foucault's broad "power" risks unfalsifiability, but specific mechanisms (like metrics) are testable. Normative critique is possible if we see power as having contradictions - the sociologist's objections arise from within the system, not outside it. 

