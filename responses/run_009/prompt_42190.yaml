  The rhetorical/ironic reading is the least certain. Arendt's tone was descriptive, but she was absolutely making a theoretical point. This reading is weak; the phrase wasn't just an observation. 

  Regarding Eichmann's ideology: the psychological claim doesn't survive new evidence, but the bureaucratic one does because systems enable both true believers and opportunists. Arendt's broader point about thoughtlessness in systems remains valid. 

