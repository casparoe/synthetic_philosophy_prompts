  2. Preface: You believe each claim in your book (because you have good evidence for each). But you also believe that there is at least one error in the book (because you are modest and know that complex works often contain errors). So you believe each claim and believe that at least one is false, which is inconsistent.

  The tree will start by asking which step of the paradox the person rejects.

