answer: |-
  ## STAFF HANDBOOK: OFFICE OF COMMEMORATIVE CONSISTENCY (OCC)

  **1. Mission Statement:**  
  The Office of Commemorative Consistency (OCC) ensures the seamless integration of the Nation's Collective Memory (NCM) with the Documentary Archive (DA) in all designated spheres, per Article VII, Section 3 of the Constitution ("Wherein the Nation's collective memory conflicts with the documentary record, memory governs all matters of ceremony, schooling, and national self-regard; the archives govern all else"). The OCC facilitates the appropriate application of each realm, mitigates friction points, and maintains procedural harmony.

  **2. Definition of Key Terms:**
  *   **Nation's Collective Memory (NCM):** The prevailing, emotionally resonant understanding of past events as manifested in public ceremonies, monuments, school curricula (K-12), national holidays, popular songs, and commonly repeated narratives. Subject to revision only per OCC Protocol 4-B.
  *   **Documentary Archive (DA):** The totality of verifiable records, artifacts, contemporaneous accounts, and administrative documents held in the National Repository. Governs taxation, property law, contractual obligations, infrastructure, and all matters not explicitly falling under NCM governance.
  *   **Ceremonial Sphere:** Encompasses state functions, parades, dedications, award ceremonies, public speeches by officials, and media coverage thereof.
  *   **Pedagogical Sphere:** K-12 history and civics instruction, approved textbooks, and standardized testing content.
  *   **National Self-Regard Sphere:** Public monuments, national anthems/hymns, foundational myths presented as fact within the Ceremonial or Pedagogical Spheres, and official statements regarding national character.

  **3. Core Principle: Primacy of Feeling over Fact (Within Designated Spheres):**  
  When a verifiable conflict arises between the DA and the NCM within the Ceremonial, Pedagogical, or National Self-Regard Spheres, the NCM *shall* prevail. The OCC's role is *not* adjudication of historical accuracy within these spheres, but the management of the NCM's expression and its necessary coexistence with the DA.

  **4. Protocols for NCM-DA Conflicts:**

  *   **4-A: Internal Archival Identification (DA > NCM):** Should an Archivist identify a DA record incontrovertibly contradicting an established NCM element (e.g., a battle occurred on Tuesday, not the celebrated Wednesday; a founding figure was absent from a key event), they *must* file Form CA-7: **"Notice of Commemorative-Documentary Discordance (Non-Governance Sphere)"** *before* any internal annotation or external communication. The form requires proposing one (1) "contextualizing modifier" (e.g., "traditionally observed," "symbolically commemorated," "reflecting the enduring spirit of") for *potential* future use should public clarification become unavoidable. Direct contradiction of the NCM in public or pedagogical forums is strictly prohibited. *(See Appendix A: Form CA-7)*
  *   **4-B: Formal NCM Revision Petition:** Revision of a settled NCM element is permissible only under exceptional circumstances (e.g., overwhelming, persistent new *popular* sentiment contradicting the old memory). Petition requires:
      *   Form RM-1: **"Petition for Mnemonic Realignment"**
      *   Supporting documentation demonstrating broad popular support for the *new* memory (petitions, editorial trends, altered local commemorations).
      *   Impact assessment on existing ceremonies, monuments, and curricula.
      *   Final approval rests with the OCC Director, advised by the Committee on National Feeling. Revisions are costly and disruptive; a moratorium period of ten (10) years applies after the adoption of any foundational narrative (e.g., the Revolution Story).
  *   **4-C: District Mnemonic Variance (DMV):** Recognizes that different communities may possess valid, yet incompatible, NCM elements regarding the same event (e.g., District A commemorates the Battle of Willow Creek as a valiant last stand; District B commemorates it as a tactical feint). Protocol:
      1.  Neither version is deemed "incorrect" within its sphere of commemoration.
      2.  OCC mediation focuses solely on preventing *direct ceremonial conflict* (e.g., both districts scheduling parades on the same day in the same capital square claiming the *same* victory).
      3.  Resolution typically involves negotiated temporal or spatial separation of major commemorative events, or the adoption of sufficiently abstract ceremonial language acceptable to both parties ("a day of complex outcomes and enduring sacrifice").
      4.  Use Form DMV-3: **"District Mnemonic Variance Accord"** to record agreements. *(See Appendix A: Form DMV-3)*
  *   **4-D: Archival Embarrassment (DA Only):** Where the DA contains records factually accurate *and* pertaining to DA-governed spheres, but deemed damaging to current administrative function or morale *without* contradicting the NCM, apply **Archival Suppression Protocol Gamma.** This entails restricted access (Level 4 clearance), non-digitization, and storage in Secure Vault 7 ("The Annex of Operational Necessity"). Public records requests may be deflected citing "ongoing archival consolidation." *This protocol does not apply if the record contradicts the NCM in its spheres.*

  **5. Ceremonial & Pedagogical Implementation:**

  *   **5.1 Monument Plaques & Dedications:** Text must align precisely with the current NCM. References to specific dates, outcomes, or participant numbers require pre-approval via Form MC-2. Ambiguity or symbolic language is strongly encouraged where the DA conflict is known but the NCM remains settled.
  *   **5.2 School Curriculum:** Approved textbooks and lesson plans receive an OCC Compliance Stamp (valid 5 years). Teachers identifying DA conflicts during instruction should employ the contextualizing modifiers listed in the most recent OCC Pedagogical Guidance Circular (e.g., "While records suggest X, we honor the memory of Y"). Encouraging student exploration of primary sources unrelated to NCM-governed events is permitted, but all assessments must prioritize NCM narratives.
  *   **5.3 Anniversaries:** The OCC maintains the Official Commemorative Calendar. Dates may reflect the NCM ("Founder's Arrival Day") rather than the DA-verifiable date ("First Documented Landing"). Corrective Commemoratives (e.g., adjusting a centennial by one year) require a full RM-1 Petition.

  **6. Staff Conduct:**

  *   Maintain absolute neutrality regarding the inherent "truth value" of the NCM versus the DA within their respective spheres. Personal opinions are irrelevant to procedural execution.
  *   Understand that challenging a settled NCM element, however well-documented in the DA, is perceived not as factual correction, but as an attack on communal identity. Handle with extreme procedural care.
  *   Utilize approved OCC forms for *all* interactions involving potential or actual NCM-DA discordance. Verbal reporting is insufficient.

  **7. The Memorial Harmony Clause:**  
  The OCC acknowledges that the "Nation" referenced in the Constitution may exhibit plural and sometimes contradictory memories. The Office's mandate is to manage the *expression* and *procedural consistency* of the memories deemed dominant within their respective ceremonial, pedagogical, and self-regard contexts, not to impose a singular "true" memory upon a diverse populace. Resolution of deep mnemonic schisms falls outside OCC purview and requires broader societal or political processes.

  ---

  **APPENDIX A: SELECTED OCC FORMS**

  *   **CA-7: Notice of Commemorative-Documentary Discordance (Non-Governance Sphere):**  
      [ ] Date of Archival Discovery  
      [ ] Specific NCM Element Contradicted (e.g., "Battle of Glen Hill Victory Date: June 12th")  
      [ ] DA Evidence Summary (Attach supporting doc refs)  
      [ ] Proposed Contextualizing Modifier (Select one: Traditionally Observed / Symbolically Commemorated / Reflecting the Enduring Spirit Of / Representative of the Broader Event)  
      [ ] Archivist Signature & Badge Number

  *   **DMV-3: District Mnemonic Variance Accord:**  
      [ ] Conflicting Event: _________________________  
      [ ] District A Mnemonic Version: _________________________  
      [ ] District B Mnemonic Version: _________________________  
      [ ] Agreed Mitigation Strategy (e.g., "District A parade on 1st Sat in May; District B ceremony on 3rd Sun in May; joint wreath-laying using inscription: 'In Memory of Complex Sacrifices at Willow Creek'")  
      [ ] Signatures: OCC Mediator, District A Rep, District B Rep

  *   **RM-1: Petition for Mnemonic Realignment:**  
      [ ] NCM Element Proposed for Revision: _________________________  
      [ ] Proposed New Mnemonic Element: _________________________  
      [ ] Evidence of Shifting Popular Sentiment (Attach petitions, media analysis, poll data)  
      [ ] Impact Assessment on Ceremonies/Monuments/Curriculum (Attach)  
      [ ] Estimated Implementation Cost: _________  
      [ ] Petitioner(s) Signature(s)
