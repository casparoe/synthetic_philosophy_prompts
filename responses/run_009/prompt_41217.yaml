prompt: |-
  My oldest friend and I argued late into the night about whether ideas can be owned, and I finished the evening with a set of verdicts I can't yet reconcile. He kept insisting that the entire edifice of intellectual property is just an incentive scheme — that talk of deserving to own one's ideas is confused nostalgia for labour — and that if I would only accept this, everything would fall into place. It didn't, because my intuitions don't seem to want a single home. Here they are. A pharmaceutical company that discovers a genuinely novel molecule and charges a hundred times the production cost for the term of its patent: broadly permissible, since the reward tracks a real achievement. An engineer who independently invents, months later and wholly unaware of the first inventor, the same hinge mechanism, only to be shut out entirely by the first-to-file rule: wrongly treated, since she did nothing the winner did not do. Fashion houses freely copying each season's silhouettes and hemlines, as the law permits: fine, and probably healthy for the industry. A younger comedian lifting another comedian's tightly crafted closing bit wholesale: wrong, even though a bit is mostly premise and structure — that is, ideas rather than expression. Copyright subsisting for seventy years after an author's death, so that a pop song stays locked up for a century: far too long; a decade or two would be plenty. Coca-Cola guarding its formula as a trade secret indefinitely: perfectly legitimate. An indigenous community insisting that outsiders not print its sacred designs on garments, in perpetuity: also legitimate, and I confess I cannot see a principled stopping date for that one at all. Generic manufacturers reverse-engineering a drug the day its patent lapses: obviously fine. A student submitting a purchased essay: a serious wrong, though I would hesitate to call it theft. Is there a single principle — desert, personality, incentive, or something stranger — that captures all of these? Please state it precisely if it exists, tell me what it recommends for a case I have not listed (a magician who invents a new illusion and keeps the method secret, only to see it exposed and then performed by rivals), and tell me honestly which of my verdicts it cannot save, and whether the friend's incentive story could save them instead. Please answer in British English.
reasoning: |-
  Okay, the user presents a fascinating philosophical dilemma about intellectual property that clearly troubles them after a heated debate. Their list of seemingly contradictory verdicts reveals deep engagement with the nuances - they're not just parroting positions but genuinely wrestling with moral intuitions. 

  Hmm... what's really being asked here? Beyond surface-level reconciliation, I detect three layers: First, an intellectual plea for coherence in their scattered judgments. Second, emotional discomfort at feeling ethically inconsistent. Third, perhaps unspoken anxiety that their friend's rigid incentive theory might actually be right despite their resistance.

  The pharmaceutical patent case stands out as particularly instructive. They accept high pricing as "broadly permissible" because it rewards achievement, yet reject identical inventions being blocked - revealing a core tension between desert and monopoly. This suggests their intuition values merit more than exclusivity per se. 

  Ah! The indigenous sacred designs example is the skeleton key. Their inability to find a "principled stopping date" shows they intuitively grasp that some creations transcend economic frameworks - which demolishes any pure incentive theory. This aligns with the comedian case where mere "ideas" feel wrong to copy, implying personality/sacredness dimensions.

  For the magician hypothetical... *pauses to think*... their existing pattern suggests they'd likely condemn exposure but tolerate imitation after exposure. The method's secrecy carries quasi-sacred status when undisclosed, but loses protection once disseminated - much like the comedian's bit versus fashion copying.

  The essay purchase case is interestingly labeled "serious wrong" but not theft. This hints at their distinction between contractual/academic ethics versus property violation - a nuance pure incentive theories miss entirely. 

  *Sighs* Their friend's incentive-only model fails catastrophically on the indigenous designs and comedian cases. No economic rationale justifies perpetual protection there. Meanwhile, the "desert-personhood-sacredness" framework I'm constructing holds up remarkably well, only struggling slightly with pharmaceutical pricing duration (where incentive concerns legitimately modify desert).

  Most tellingly, the user's rejection of century-long copyright reveals their subconscious boundary: protection should reflect creative labor's intensity, not just investment recoupment. That's the desert principle whispering beneath the noise.
answer: |-
  Your intuitions reveal a sophisticated, pluralistic view of intellectual creation that resists reduction to any single principle. However, a **contextual principle of justified expectations and relational obligations** comes closest to unifying them. Stated precisely:

  > **Protection is justified where it secures the conditions necessary for valuable creative activity within a specific domain, respecting both the labour/agency of creators and the legitimate reliance interests of society—with the form and duration constrained by the nature of the creation, cultural context, and potential for harm.**

  ### How This Framework Captures Your Verdicts:
  1. **Pharmaceutical Patent (Broadly Permissible):**  
     The high reward incentivises costly R&D (securing conditions for innovation). Limited duration respects society's reliance on eventual access. The "achievement" justifies *temporary* exclusivity, not perpetual control.

  2. **Independent Engineer (Wrongly Treated):**  
     First-to-file violates relational fairness: both invested equal labour. The system fails to respect parallel agency. A grace period or independent invention defence would better align with justified expectations.

  3. **Fashion Copying (Fine):**  
     Rapid, open borrowing fuels cyclical trends—core to fashion's creative ecology. Protection would stifle the domain's vitality without clear benefit to overall innovation.

  4. **Comedian's Stolen Bit (Wrong):**  
     The "tightly crafted" bit reflects personal artistry and labour. Uncredited copying violates professional norms and relational trust within the comedic community, undermining the conditions for craft development.

  5. **70-Year Copyright (Too Long):**  
     Vastly exceeds time needed to incentivise creation (most commercial value is realised early). Disproportionately burdens society's reliance interest in cultural access without commensurate benefit to creativity.

  6. **Coca-Cola Trade Secret (Legitimate):**  
     Protects a commercial advantage derived from *continuous secrecy*, not state-enforced monopoly. Society has no strong reliance interest in accessing the formula, and reverse-engineering remains lawful.

  7. **Sacred Indigenous Designs (Legitimate & Perpetual):**  
     Tied to cultural survival and identity. Unauthorised use causes dignitary harm and undermines communal agency. The "domain" here is cultural sovereignty, not commerce, warranting indefinite protection based on ongoing relational obligations.

  8. **Reverse-Engineering Off-Patent Drugs (Fine):**  
     The patentee’s justified expectation of exclusivity expires. Society’s reliance interest in affordable medicine takes precedence, facilitated by generic competition.

  9. **Purchased Essay (Wrong, Not Theft):**  
     Violates academic norms of authenticity and personal labour. It’s a breach of educational contract and misrepresentation, not primarily a property violation.

  ### The Magician’s Case:
  * **Initial Secrecy:** Justified. The method’s value relies on mystery. Exposure destroys the magician’s creative capital and undermines incentive to innovate.
  * **Rivals Performing After Exposure:** Permissible. Once secrecy is *externally* broken (not by the magician), the "secret" enters the domain of shared knowledge. Rivals using it no longer undermine the original conditions for magical innovation—though ethical norms might demand acknowledgement.

  ### Verdicts This Principle *Struggles* to Save:
  * **Independent Engineer:** While the framework highlights unfairness, it doesn’t *mandate* a remedy unless systemic injustice demonstrably chills engineering innovation. Your "wrongness" intuition is more strongly rooted in **desert** than this principle alone.
  * **Purchased Essay:** It captures the breach of trust but downplays the "theft" aspect (of academic credit/opportunity). Your hesitance to call it theft suggests you intuitively see it as **fraud** more than **property violation**.

  ### Why Your Friend's Incentive Theory Fails:
  A pure incentive model (*"IP exists solely to maximise socially beneficial innovation"*) cannot explain:
  1. **Sacred Indigenous Designs:** Perpetual protection isn't needed to *incentivise* creation; it's about preventing sacrilege and preserving culture. Incentive theory would likely deem indefinite control inefficient.
  2. **Comedian's Bit:** Joke structures (ideas) aren't protected by copyright. Incentive theory struggles to explain why unprotectable "ideas" *should* be morally off-limits if incentives for comedy (fame, bookings) exist regardless.
  3. **Purchased Essay:** No innovation incentive is served by punishing buyers; the wrong is about authenticity, not market failure.
  4. **Trade Secrets:** Incentive theory prefers patents (disclosure for exclusivity). Coke’s secrecy thrives *outside* the IP incentive system.

  ### Conclusion
  Your intuitions reflect **multiple moral sources**: **desert** (engineer, comedian), **relational autonomy** (indigenous designs), **incentive efficiency** (pharma patents), **cultural norms** (fashion), and **contextual harm** (essay fraud). No monolithic principle overrules these. Your friend's incentive theory is a powerful *economic* tool but a poor *moral* framework—it reduces all creative labour to a commodity, ignoring the personal, cultural, and relational dimensions that make your verdicts so nuanced. The contextual principle accommodates this pluralism by demanding we ask: *What specific goods are we protecting, for whom, and at what cost to society's legitimate interests?* The answers vary—and they should.
