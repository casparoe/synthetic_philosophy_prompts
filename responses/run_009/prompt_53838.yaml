prompt: |-
  I've been having the same argument with my friend Priya for the better part of a decade — a standing fixture of our rationalist meetup, in the way that definitional disputes tend to become standing fixtures on the forums. The subject is democratic backsliding: she has crisp verdicts on whether a given country counts, and I've come to suspect she's running two or three different rules under one label, while I keep telling her to taboo the term and she keeps replying that some terms are load-bearing and earn their keep. What I want is a prediction about her next verdict, and since she refuses to state operationalized criteria ("I'm not pre-registering my priors so you can score me," she says), you'll have to reverse-engineer them from her track record.

  The track record, as faithfully as I can reconstruct it:

  - Hungary under Orbán after 2010: yes, backsliding. Fidesz took a two-thirds supermajority, rewrote the constitution, packed the Constitutional Court, and put loyalists on the media authority.
  - Poland under PiS from 2015: yes. They captured the Constitutional Tribunal first, then went after the ordinary courts and public broadcasters.
  - Turkey, especially from the 2017 constitutional referendum onward: yes.
  - Venezuela from Chávez on: yes.
  - The US during Trump's first term: no. Her reasoning was that the referees held, and she wants the term reserved for cases where they go.
  - New Zealand and Australia during the pandemic: no. Emergency powers, honestly accounted for, mostly handed back when the emergency passed — ugly, but not backsliding.
  - South Korea in December 2024, when Yoon declared martial law and the National Assembly voted it down within hours: no. A failed burglary, she said, doesn't change the neighborhood's burglary rate — and he was impeached.

  The new case is India under Modi through the present: governors in opposition-run states sitting indefinitely on duly passed bills; the Enforcement Directorate's corruption cases landing overwhelmingly on opposition politicians; the 2023 law that replaced the Chief Justice of India with a government minister on the committee selecting election commissioners; and yet elections at the national level remain genuinely competitive — the BJP lost its outright majority in 2024 and had to govern in coalition, and opposition parties keep winning and holding states.

  So: will she say India is backsliding? I care less about the yes-or-no than about what rules actually fit every verdict above, which of those rules disagree about India, and which further case would best tell the rules apart. She's threatening to weigh in next on Israel's 2023 judicial overhaul, and possibly on Mexico's switch to electing its judges, so feel free to consider those as candidate discriminators alongside anything else you'd propose.

  Please structure your reply as follows:

  1. "Candidate rules" (roughly 150 words) — at least two distinct rules that are jointly compatible with every verdict in her track record, each stated precisely enough that its verdicts on the listed cases are determined rather than vibes.
  2. "What they predict for India" (roughly 200 words) — where the candidate rules agree and where they diverge on the India case as I've described it.
  3. "My best guess" (roughly 150 words) — your prediction of her verdict, with the reasons for preferring the rule you think she's actually running (including, if relevant, any evidence in how she phrases her verdicts).
  4. "The discriminating case" (roughly 100 words) — the single further case that would most cleanly split the candidate rules, and what each rule would say about it.
reasoning: |-
  Hmm, the user presents an interesting challenge about reverse-engineering their friend Priya's criteria for "democratic backsliding." This seems like a classic case of implicit decision-making rules that need explicit modeling. The track record shows Priya focuses on institutional capture rather than policy outcomes or temporary measures.

  Looking at the cases: Hungary, Poland, Turkey and Venezuela all involve permanent takeover of key institutions like courts and media. The "no" cases (US, NZ/Australia, South Korea) feature resilient institutions that blocked or reversed power grabs. This suggests two plausible rules: 

  Rule A focuses on actual capture of veto points (courts/election bodies), while Rule B emphasizes whether elections remain meaningfully competitive even if institutions are pressured. Both fit the historical verdicts perfectly.

  For India, Rule A would say "yes" because Modi captured the election commissioner selection process. Rule B would say "no" since opposition still wins states and the BJP lost its majority nationally. 

  The Israel judicial overhaul case will be decisive: Rule A would call it backsliding (court independence was attacked), while Rule B might say "not yet" since elections remain competitive. That's why I'd recommend testing with Israel.

  Priya's phrasing about "referees" holding suggests she leans toward Rule A - actual institutional capture is her bright line. Hence my guess that she'll declare India backsliding despite competitive elections.
answer: |-
  ### 1. Candidate Rules  
  **Rule A (Institutional Capture):** A country is backsliding if a governing party *successfully neutralizes at least two independent veto points* (e.g., courts, electoral bodies, media regulators) via formal institutional changes (laws, constitutional amendments) that entrench executive control, and these changes persist without reversal.  

  **Rule B (Electoral Gatekeeping):** A country is backsliding only if institutional erosion *compromises national electoral competitiveness*, defined as the incumbent party/coalition facing no credible threat of losing power through elections due to systemic bias (e.g., opposition barred from office, voting integrity undermined). Temporary or state-level losses don’t count; federal power must be "locked in."  

  *Both rules fit all prior verdicts:*  
  - **Hungary/Poland/Turkey/Venezuela:** Rule A (courts/media captured) and Rule B (elections ceased being competitive).  
  - **US Trump:** Rule A (no veto points captured) and Rule B (2020 loss proved competitiveness).  
  - **NZ/Australia:** Rule A (emergency powers reversed) and Rule B (elections unchanged).  
  - **South Korea:** Rule A (martial law failed) and Rule B (Yoon impeached, competitiveness intact).  

  ---

  ### 2. What They Predict for India  
  - **Rule A (Institutional Capture) predicts YES:**  
    - Captured veto points: (1) Election Commissioner selection (govt. replaced judiciary’s role), (2) Enforcement Directorate weaponized against opposition (like a prosecutorial veto point).  
    - Governors’ bill delays reinforce executive overreach. These are *institutional* changes (2023 law) that persist.  
  - **Rule B (Electoral Gatekeeping) predicts NO:**  
    - National elections remain competitive (BJP lost majority in 2024, relies on coalition). Opposition still wins states (e.g., Karnataka, Tamil Nadu), proving no systemic federal "lock."  
    - Unlike Venezuela or Turkey, losing power nationally remains plausible.  

  *Divergence:* Rule A focuses on institutional degradation; Rule B requires eroded electoral consequences. India’s competitive federalism splits the verdict.  

  ---

  ### 3. My Best Guess  
  **Prediction: Priya says YES to India backsliding.**  
  - **Reason:** Her emphasis on "referees" (institutions) failing in the US/Trump case and her verdicts on Hungary/Poland prioritize *institutional subversion* over electoral outcomes. She notes Poland "captured the Constitutional Tribunal" and Turkey’s referendum, not their election margins.  
  - **Key phrasing:** She reserved backsliding for cases "where the referees go." In India, the Election Commission’s independence was formally altered (2023 law), and ED targeting mirrors Poland’s "ordinary courts" interference. Competitive elections may not save it—Venezuela held elections too, but she called it backsliding due to institutional sabotage.  
  - **Why not Rule B?** She dismissed South Korea’s "failed burglary" because institutions *held*; in India, institutions (election body, ED) are actively repurposed, aligning with her "referees" threshold.  

  ---

  ### 4. The Discriminating Case  
  **Case: Israel’s 2023 judicial overhaul** (reducing Supreme Court’s power to block government actions).  
  - **Rule A (Institutional Capture) says YES:** Neutralizes a key veto point (court’s judicial review) via law, entrenching executive authority.  
  - **Rule B (Electoral Gatekeeping) says NO:** Elections remain competitive (Netanyahu’s coalition nearly collapsed in 2023, opposition could still win future elections).  
  - **Why it splits cleanly:** Unlike India, Israel lacks federalism to test subnational competition, making it a pure test of whether *one* veto point’s capture suffices without electoral lock-in. Priya’s verdict here would confirm Rule A (if YES) or Rule B (if NO).  

  *(Mexico’s elected judges are less decisive: both rules might call "no backsliding" if elections stay competitive and no prior veto points existed.)*
