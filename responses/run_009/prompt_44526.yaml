prompt: |-
  I've been an ICU nurse for twelve years, and I've decided to stop hand-waving about the killing/letting-die distinction and work out what I actually believe, the way you'd reconstruct a colleague's practice from her charting. I'm going to give you my honest verdicts on cases I've either seen, done, or can picture vividly, and I want you to act as a philosopher of action with a specialty in biomedical ethics: think carefully, brainstorm candidate principles before committing to one, and then tell me what principle, if any, captures the pattern. If no single principle fits, say so and offer the smallest set that does, with the cost of each added clause made explicit.

  The cases and my verdicts. (1) We extubate a patient at the documented, verified request of the family after the patient is found to have a devastating prognosis; he dies within the hour. I think this is letting die, and clearly permissible. (2) A colleague, at a family's tearful request, pushes a large bolus of potassium chloride specifically intending that the patient die now rather than in two days. I think this is killing, and wrong, even granting that the outcome is the same death two days earlier. (3) I titrate a morphine drip upward for air hunger in a patient who is dying regardless, knowing full well the new rate may suppress respiration and hasten the death by hours. Fine, somehow, and I don't want to hear that it's just slow-motion case (2). (4) We decline to start a new course of broad-spectrum antibiotics that would buy a confused, cachectic patient perhaps three bad days in restraints. This feels easier than case (1), even though the philosophers tell me withholding and withdrawing are morally symmetrical. (5) A patient has an unwitnessed arrest with an ambiguous code status; nobody starts compressions. Fine. (6) Off shift, in street clothes, I walk past a stranger hemorrhing from a leg wound I could stem with a shirt and pressure. That's letting die, but it feels nearly as bad as killing to me. (7) Meanwhile I've never joined the bone marrow registry, though matching would save a stranger's life at modest cost to me, and I feel approximately zero guilt about that, let alone anything approaching murderer-level guilt. Something about (6) and (7) is in tension, and I can't name what.

  Here's my tentative principle, which I suspect is wrong: the difference is whether death comes through something I initiated versus something already in progress before I arrived. But that can't be right, because the morphine drip in (3) is something I initiated, the extubation in (1) is an intervention, and the hitman's bullet is an intervention while the storm that cuts power to a ventilator isn't -- yet I judge the storm a letting and the bullet a killing without hesitation. So please state the principle or principles precisely, clause by clause, and say which verdict each clause is doing the work for. Then tell me what your favored principle says about two cases I haven't decided: a patient loses ventilator power in a storm and I have to hand-bag him for one hour until a transport ventilator arrives -- am I obligated, and for how long, and does the answer change if it's twelve hours? -- and whether the same verdict covers the relative who, with sincere motives and no medical authority, unplugs the ventilator himself. Finally, be honest about which of my verdicts your principle forces me to give up; I'd rather lose a verdict than lose a distinction, but I want to know exactly what I'm paying.
reasoning: |-
  Okay, let me start by really understanding what this ICU nurse is asking. They've been in the field for twelve years and are grappling with the ethical distinction between killing and letting die. They've provided seven cases with their own verdicts and want a philosophical analysis to find underlying principles. The nurse also has a tentative principle about initiation versus existing processes but recognizes it's flawed. 

  First, I need to unpack each case and their verdict. Case 1: Extubation with family consent is letting die, permissible. Case 2: Potassium bolus is killing, wrong. Case 3: Increasing morphine for comfort care is fine, not killing. Case 4: Withholding antibiotics feels easier than withdrawal. Case 5: Not starting CPR on ambiguous code status is acceptable. Case 6: Not helping a bleeding stranger feels almost like killing. Case 7: Not joining bone marrow registry causes no guilt. The tension between 6 and 7 is key—why does one feel wrong and the other not?

  The nurse's tentative principle about initiating vs. existing processes doesn't hold because both morphine and extubation are interventions, yet they're judged differently. The hitman's bullet (initiated) is killing, while a storm cutting power (external) is letting die. So initiation alone isn't sufficient.

  Now, considering ethical frameworks. Double effect might explain case 3: primary intent is relieving pain, not causing death. But for case 2, the intent is directly to kill, which is wrong. Withdrawing treatment (case 1) vs. active intervention (case 2) aligns with traditional medical ethics. 

  For cases 4 and 5, the distinction between withholding and withdrawing is seen as symmetrical in philosophy, but clinically, withholding feels easier. Maybe because starting treatment creates an expectation, whereas not starting avoids that. 

  Cases 6 and 7 highlight role duties. As a nurse in street clothes (case 6), there's still a professional identity, making inaction feel worse. Not joining the registry (case 7) lacks that role obligation, so no guilt. The special duty from role versus general beneficence.

  The nurse's proposed principle fails because initiation isn't the key; it's role, intent, and duties. For the ventilator cases: hand-bagging for an hour is obligatory due to role duty, but for twelve hours? That's excessive; proportional burden matters. The relative unplugging—without medical authority, it's unauthorized, possibly criminal, even if intent is sincere.

  Which verdicts might conflict? Case 4 (withholding antibiotics) being easier than withdrawal (case 1). Philosophers say they're symmetric, but the nurse feels differently. The principle might need to accommodate psychological aspects of responsibility. Also, case 6's guilt versus case 7's lack thereof—role duty explains this.

  Need to synthesize principles: intent (double effect), role-specific duties, and scope of obligation. The smallest set should cover all verdicts without overcomplicating. Each added clause should be necessary. For instance, without the role duty clause, cases 6 and 7 wouldn't be distinguished. Without double effect, case 3 might be misclassified as killing.
answer: |-
  After analyzing your cases and verdicts through the lens of action theory and biomedical ethics, I propose a three-clause principle that captures your pattern while minimizing complexity. Each clause addresses a distinct moral dimension, and their conjunction explains your judgments without requiring you to abandon any verdict. The cost of adding clauses is justified by their explanatory power across all cases.

  ### The Proposed Principle
  1. **Causal Pathway Clause**: An act constitutes *killing* only if the agent *introduces a new, independent fatal pathway*. Merely allowing or accelerating an *already operating* fatal process is *letting die*.  
     *(Does the work for Cases 1, 2, 3, 5)*  

  2. **Intentionality Clause**: Permissibility requires that the *primary intention* behind any acceleration of death must be the relief of suffering or respect for autonomy, *never* the causation of death as an end or means.  
     *(Does the work for Cases 2, 3, 6)*  

  3. **Role-Relation Clause**: Obligations to prevent death are *amplified by professional role-duties* and *attenuated by excessive burden*, but exist only minimally for strangers absent a special relationship.  
     *(Does the work for Cases 6, 7, and the ventilator cases)*  

  ---

  ### How the Principle Explains Your Verdicts
  - **Case 1 (Extubation)**: *Letting die & permissible*  
    - Clause 1: Removing the ventilator allows the underlying pathology (the existing fatal pathway) to proceed. No new cause introduced.  
    - Clause 2: Intention is to respect autonomy/prognosis, not cause death.  

  - **Case 2 (KCl Bolus)**: *Killing & impermissible*  
    - Clause 1: Potassium directly creates a new fatal pathway (cardiac arrest) independent of the disease.  
    - Clause 2: Primary intention is death causation, making it impermissible regardless of motive.  

  - **Case 3 (Morphine Titration)**: *Permissible*  
    - Clause 1: Respiratory suppression accelerates but does not replace the existing fatal process (underlying disease).  
    - Clause 2: Primary intention is symptom relief; foreseeing death doesn’t equate to intending it.  

  - **Case 4 (Withholding Antibiotics)**: *Easier than withdrawal*  
    - Clause 1: Both withholding and withdrawing allow existing pathology to proceed (symmetrical per philosophers).  
    - *But*: Psychological burden of *initiating* withdrawal (Clause 1’s "intervention" aspect) explains your intuition, though not morally decisive. No clause conflict.  

  - **Case 5 (No CPR)**: *Permissible*  
    - Clause 1: Not initiating compressions avoids creating a *new* intervention; arrest is the active fatal process.  

  - **Case 6 (Ignoring Bleeding Stranger)**: *Letting die but guilt-worthy*  
    - Clause 1: Not acting doesn’t introduce a new cause (letting die).  
    - Clause 3: Professional identity creates a *role-adjacent duty* (even off-duty), making inaction feel culpable. Burden (using your shirt) is minimal, amplifying obligation.  

  - **Case 7 (Not Joining Registry)**: *No guilt*  
    - Clause 3: No role-duty exists; burden (discomfort, time) is non-trivial and ongoing. General beneficence is attenuated here.  

  ---

  ### Resolved Tension Between (6) and (7)
  - **Why (6) feels near-murderous while (7) doesn’t**:  
    - Clause 3 explains this: Your nursing role generates a *special obligation* to render aid in emergencies (Case 6), even off-duty. No such role-based duty exists for bone marrow donation (Case 7), which remains supererogatory. The minimal burden in (6) exacerbates the intuitive weight of inaction.

  ---

  ### Verdicts on Your Undecided Cases
  **Case A: Ventilator Power Failure (Hand-Bagging)**  
  - **Obligation?** *Yes, for a reasonable duration*.  
    - Clause 1: Power failure is an external event; hand-bagging sustains existing treatment (letting die only if *stopped*).  
    - Clause 3: Your role-duty requires intervention. Burden is proportional to duration:  
      - **1 hour**: Obligatory (minimal burden).  
      - **12 hours**: Obligation attenuates; may transfer care, recruit relief, or stop if exhaustion threatens safety.  

  **Case B: Relative Unplugs Ventilator**  
  - **Verdict**: *Killing & impermissible*, even with sincere motives.  
    - Clause 1: Unplugging *introduces* a new fatal pathway (asphyxia) by removing an artificial support.  
    - Clause 2: Family lacks authority to intend death (vs. clinicians respecting valid refusal).  
    - Clause 3: No valid role-relation to justify the act; usurps medical authority.  
    *(Differs from Case 1 due to agency/authority, not just causation)*  

  ---

  ### What You "Pay" to Keep All Verdicts
  - **Cost of Clause 3**: You must accept that **role-duties create stronger obligations than general beneficence**. This slightly refines your intuition about "initiation" by emphasizing *professional agency* over mere temporal sequence.  
  - **No verdicts sacrificed**: The principle preserves all your judgments. Case 4’s asymmetry is explained psychologically but not morally weighted—philosophers’ symmetry holds, but your intuition reflects the *experiential* gravity of withdrawing versus withholding.  

  ### Why This Works
  - **Smallest set covering all cases**: Removing any clause fails:  
    - Without Clause 1, Cases 1/2/3 collapse.  
    - Without Clause 2, Case 3 becomes indistinguishable from Case 2.  
    - Without Clause 3, Cases 6/7 conflict irreconcilably.  
  - **Philosophical grounding**: Integrates Double Effect (Clause 2), causal distinction (Clause 1), and role-based obligations (Clause 3), avoiding oversimplification while remaining clinically actionable.  

  Your distinction stands: killing requires *introducing death*; letting die requires *not obstructing death already underway*—but permissibility hinges on intention and duty, not just causality. This aligns with your experience: the nurse’s role transforms both action and inaction.
