prompt: |-
  I am a retired geophysicist who has spent the last few years reading philosophy of language after a career spent arguing about which rocks count as what, and I would like the Kripke–Putnam picture of natural kind terms stress-tested against an episode I remember well: the International Astronomical Union's 2006 redefinition of "planet." The salient facts, as I understand them, are these. Pluto had been the ninth planet since Tombaugh's discovery in 1930. The 2005 discovery of Eris, an object at least as large as Pluto, forced a choice between a solar system with ten-plus planets and a definition that excluded Pluto. The IAU's General Assembly in Prague adopted, by a show of hands among the few hundred members present, a resolution requiring that a planet orbit the Sun, be round under its own gravity, and have cleared its orbital neighbourhood; Pluto failed the last criterion and became a "dwarf planet," to the lasting annoyance of schoolchildren and of a number of astronomers who thought the procedure was mishandled. I should note that this was not the field's first such episode: Ceres was listed as a planet for roughly half a century after its discovery before being demoted to asteroid.

  Please analyze the episode through the lens of rigid designation, semantic externalism, and the necessary a posteriori. I want the mapping done carefully and in both directions — the theory illuminating the case, the case testing the theory — and I want it allowed to be silent where it is silent rather than stretched.

  Specifically: (1) On the causal theory of reference, what was the initial baptism of "planet," what does the chain of transmission look like as Uranus and Ceres were added and Ceres subtracted, and what exactly does the 2006 vote occupy in that picture — a fresh baptism, a change of reference, or the discovery of what the term had meant all along? (2) Is "planet," on this evidence, a natural kind term in Kripke's and Putnam's sense? If it is, then whether Pluto is a planet was an empirical question with a determinate answer that science rather than a ballot should have settled, and the vote either uncovered the essence or legislated over it; if it is not, what sort of term is it, and where does the externalist machinery misfire? Relatedly, is "Pluto stopped being a planet in 2006" even the right description — did anything about Pluto change, or only a word? (3) Does the aftermath — textbooks rewritten, museum labels replaced, the laity deferring to the experts and mostly forgetting the controversy — vindicate the division of linguistic labor, or does the fact that the question was settled by vote at all expose a gap, since the theory says nothing about whether the boundary of a natural kind is out there to be found or drawn by us?

  Finally, since my own discipline cannot agree on what a continent is, tell me frankly whether "planet" is closer to "water," whose essence chemistry eventually discovered, or to "continent," where arguably nothing waits to be discovered — and what follows from your answer for the popular complaint that the IAU didn't learn anything about Pluto but merely changed the subject. I would like a verdict, in the end, on whether this episode confirms, strains, or merely decorates the Kripke–Putnam picture.
reasoning: |-
  Hmm, this is a fascinating request from a retired geophysicist with expertise in both science and philosophy of language. The user wants me to apply Kripke-Putnam's framework to the controversial 2006 IAU redefinition of "planet" that demoted Pluto. 

  The user has clearly laid out three specific philosophical questions about rigid designation, natural kind status, and the division of linguistic labor. They're particularly interested in whether "planet" behaves more like "water" (with discoverable essence) or "continent" (socially constructed). There's also an underlying tension here between scientific realism and conventionalism that needs careful handling.

  I recall that Kripke's causal theory emphasizes initial baptism and rigid designation - how does that apply to "planet" which originated from ancient Greek astronomers observing "wandering stars"? The term clearly underwent reference shifts with discoveries of Uranus and Ceres. The 2006 vote seems more like a conventional redefinition than discovering essence, especially since the "cleared orbit" criterion feels arbitrary. 

  For natural kind status: while planets share some physical properties like hydrostatic equilibrium, the IAU definition includes relational properties (orbital dominance) that aren't intrinsic. This makes "planet" unlike chemical kinds like water. The vote-based decision highlights how boundary-setting requires social negotiation - problematic for strict Kripke-Putnam views.

  The aftermath does showcase Putnam's division of linguistic labor beautifully though - public deference to astronomical authority despite lingering nostalgia. But fundamentally, Pluto didn't change; our linguistic practices did. This case suggests natural kind concepts exist on a spectrum rather than binary categories.

  The user's geophysics background makes the "continent" comparison particularly apt. Both "planet" and "continent" are scale-dependent, boundary-ambiguous concepts where science and semantics intersect messily. I should emphasize that while Kripke-Putnam remains robust for core natural kinds, its limitations are exposed by these "borderline" categories. The verdict should be that this decorates and strains but doesn't refute their framework.

  The user will appreciate nuance here - they've clearly wrestled with this themselves. No philosophical overreach; acknowledge where the theories go silent. And definitely address that delicious final question about whether the IAU "changed the subject" - which they absolutely did, but with scientific justification.
answer: |-
  Your case study brilliantly exposes both the power and limits of the Kripke-Putnam (K-P) framework. Let's dissect this rigorously, mapping theory to event and vice versa, acknowledging silence where appropriate.

  **1. Causal Theory of Reference & the "Planet" Chain:**
  *   **Initial Baptism:** The original "baptism" occurred in ancient astronomy (Greek: *planētēs* - wanderer). The *ostension* was likely: "Those bright points of light that move relative to the fixed stars are *planētai*." This included Mercury, Venus, Mars, Jupiter, Saturn (and the Sun/Moon). The reference was fixed by observable properties (apparent motion).
  *   **Chain of Transmission:** The term passed down through generations (medieval, Copernican revolution), crucially shifting meaning via discoveries:
      *   **Copernicus:** Changed the *understood essence* (objects orbiting Sun, not Earth) but didn't immediately alter the *extension* (same bodies called planets).
      *   **Uranus (1781):** Initially seen as a comet, but recognized as sharing the core "planetary motion" property. Incorporated via *similarity* to existing members. The chain transmitted "planet" to include this new object *like* Jupiter/Saturn.
      *   **Ceres (1801):** Discovered in the "gap" predicted by Bode's law, initially hailed as the missing planet. Incorporated via *location* and perceived fulfillment of a pattern.
      *   **Ceres Demotion:** Discovery of Pallas, Juno, Vesta (etc.) revealed Ceres was part of a *new class* of numerous small bodies. Demotion wasn't discovering Ceres *wasn't* a planet all along (it *was* baptized as one!), but recognizing the initial similarity-based baptism was *overly broad*. The term's extension was *pruned* to maintain coherence based on new empirical knowledge (numerosity, shared region, distinct dynamics). The chain bifurcated: "planet" excluded Ceres; "asteroid" captured it and its peers.
  *   **The 2006 Vote in this Picture:** The K-P framework struggles here:
      *   **Not a Fresh Baptism:** No new object was named. Existing terms were redefined.
      *   **Not a Discovery of Essence:** Unlike discovering H₂O, this didn't reveal a hidden physical essence *already binding* Mars, Earth, Pluto. Pluto's orbital characteristics were known; the vote decided *if that mattered* for the kind.
      *   **Not a Simple Change of Reference:** The vote didn't merely add/remove Pluto like Ceres. It explicitly *changed the criteria* defining the kind's membership ("cleared orbit"). It was a *semantic revision*.
      *   **K-P's Silence:** The K-P framework primarily deals with how reference is fixed and transmitted, not how scientific communities *reformulate* kind definitions based on new discoveries *that challenge the coherence of the existing category*. The 2006 vote is best seen as a **deliberate act of conceptual refinement** driven by empirical pressure (Eris), forcing a choice between proliferating members or tightening criteria. It's a *decision* about how to *use* the term for future scientific utility, not the discovery of a pre-existing essence Pluto failed.

  **2. Is "Planet" a Natural Kind Term?**
  *   **Evidence Against:** The Pluto episode strongly suggests "planet" does **not** function like a core K-P natural kind term (e.g., "water," "tiger").
      *   **Lack of Presumed Hidden Essence:** While roundness (hydrostatic equilibrium) points to a physical state, the core IAU criterion – "cleared its orbit" – is relational and dynamical, not intrinsic. Is a body's orbital dominance a *hidden essence* like molecular structure? Unlikely. It reflects the *context* of its formation and evolution within a system.
      *   **Boundary Set by Convention:** The specific threshold for "clearing" is arbitrary (e.g., why not 90% cleared? Why "orbital zone"?). The vote *chose* which properties were essential. Science informed the *debate*, but the *decision* was conventional.
      *   **Historical Fluidity:** The term's extension has demonstrably changed significantly (Sun/Moon included/excluded; Ceres in/out; Pluto in/out) based on changing knowledge and conceptual needs, not discovery of a single underlying essence. Its meaning is tied to its role in astronomical taxonomy.
  *   **What Sort of Term is it?** "Planet" is likely a **scientific kind term** or a **nominal kind term with scientific grounding**. Its reference depends on:
      1.  **Core Physical Properties:** Primarily hydrostatic equilibrium (roundness), implying internal differentiation – a physically significant state.
      2.  **Relational/Contextual Properties:** Location (orbiting a star), dynamical dominance within its orbital zone (a system-level property).
      3.  **Historical & Functional Role:** Its position within the taxonomy of Solar System bodies and its historical usage.
  *   **Where Externalism Misfires:** Externalism works well for the *core physical component* (roundness). Pluto *does* share that intrinsic property with Earth. Where it misfires is assuming the *entire category* "planet" is governed by a single, discoverable, hidden essence *that rigidly determines membership*. The relational/dynamical aspect ("cleared orbit") isn't plausibly part of a hidden essence *in the object itself*; it's about the object's relationship to its environment. The K-P machinery struggles with kind terms where membership relies heavily on relational properties or system-level context.
  *   **Did Pluto Change?** Absolutely not. Pluto's intrinsic physical properties (size, shape, composition) and its orbital parameters didn't change in 2006. **Only the word changed.** "Pluto stopped being *called* a planet in 2006" is the accurate description. "Pluto stopped *being* a planet" is only true if one accepts the *new definition* retrospectively, which is precisely the conventional move at issue.

  **3. Aftermath & Division of Linguistic Labor:**
  *   **Vindication:** The aftermath **strongly vindicates** Putnam's Division of Linguistic Labor. The public, educators, and even most scientists *deferred* to the IAU's authority as the relevant "experts" on astronomical taxonomy. Textbooks were rewritten, labels changed, public discourse adopted "dwarf planet," despite the controversy and public nostalgia. This shows how reference for technical terms relies on societal deference to specialists.
  *   **Exposing a Gap:** However, the vote **does expose a significant gap** in the K-P picture concerning **boundary-setting**. The theory assumes the essence *determines* the boundary. Here, science revealed a *problem* (Pluto/Eris are numerous, share a distinct region/dynamics with other TNOs) but didn't *discover* a pre-existing sharp boundary. **Science informed the *need* for a boundary, but the experts *drew* it.** The vote formalized where the line should be placed based on a combination of physical criteria (roundness), dynamical criteria (orbital clearing), and pragmatic considerations (taxonomic utility, avoiding proliferation). The K-P framework is largely silent on this process of *defining* the kind's criteria when hidden essences are insufficient or non-existent.

  **"Planet" vs. "Water" vs. "Continent":**
  *   **"Water" (H₂O):** Paradigmatic K-P natural kind. Its essence (molecular structure) is intrinsic, microstructural, and definitively determines membership. Chemistry *discovered* this essence.
  *   **"Continent" (as you know!):** Primarily a **geographical/phenomenological kind**. While based on physical reality (large landmasses), its boundaries (Europe/Asia split, is Australia an island or continent?) are fundamentally conventional, based on size, cultural/historical factors, and geological *distinctiveness* (which itself involves arbitrary thresholds). No hidden essence determines membership.
  *   **"Planet":** **Sits squarely between them.**
      *   Like "water," it has a grounding in a core *intrinsic physical state* (hydrostatic equilibrium).
      *   Like "continent," its full definition incorporates *relational properties* (orbiting a star) and crucially, involves *conventional boundary-setting* based on dynamical criteria ("cleared orbit") that lack a single, intrinsic, microphysical essence. Its membership depends on the *system context* in a way "water" does not.
  *   **The IAU's Action:** The popular complaint **has merit.** The IAU didn't "learn" Pluto wasn't a planet *by the old definition* (it was). They decided that the *old definition* led to a scientifically undesirable proliferation and that a *new definition*, incorporating orbital dominance, better served the purpose of classifying Solar System bodies. They **changed the subject** – they changed what the scientific term "planet" *means* for contemporary astronomy. They didn't discover Pluto lacked some hidden planetary essence; they redefined "planet" in a way that excluded it based on newly salient system-level properties.

  **Verdict: Confirms, Strains, or Decorates?**

  The Pluto episode **significantly strains the core Kripke-Putnam picture** of natural kinds, while simultaneously **confirming and decorating** aspects of their broader semantic framework.

  *   **Strains:** It exposes the framework's limitations for kind terms where:
      *   Membership depends critically on relational/system-level properties ("cleared orbit").
      *   Historical reference is demonstrably fluid due to changing taxonomic needs.
      *   Boundary-setting requires explicit conventional decisions by experts, rather than discovery of a pre-existing essence that cleanly determines all members.
      *   The "essence" is arguably a cluster of properties (intrinsic shape, orbital context) rather than a single microstructural one.
  *   **Confirms/Decorates:**
      *   **Division of Linguistic Labor:** The public deference to the IAU is a textbook example.
      *   **Causal Transmission:** The chain explains historical inclusions (Uranus, initial Ceres) well.
      *   **Necessity A Posteriori (Partially):** Once the IAU *defines* "planet" as requiring a cleared orbit, it becomes *necessary* (under that definition) that Pluto is not a planet. But this necessity stems from the *conventional definition*, not a discovered microphysical essence.
      *   **Rigidity (For Objects):** "Pluto" rigidly designates that object, regardless of how we classify it.

  **Conclusion:** The K-P picture remains powerful for core natural kinds defined by intrinsic microstructure (water, gold, species to some extent). However, the Pluto demotion reveals its inadequacy for many important scientific categories – like "planet" or "continent" – which are grounded in physical reality but whose boundaries are shaped by relational properties, system context, historical contingency, and pragmatic decisions within the scientific community. These kinds involve a complex interplay of discovery *and* stipulation. The IAU vote was an act of scientific taxonomy, refining a concept for better utility, not the discovery of a hidden planetary essence Pluto always lacked. This episode enriches our understanding of scientific language by showing where the K-P model shines and where its limits lie.
