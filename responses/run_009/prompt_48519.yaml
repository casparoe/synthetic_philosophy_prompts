  Here are two cases meeting your constraints, using "My father is dead" as the proposition *p*:

  **Case 1: Absurdity**  
  David receives a routine email notification from his father’s retirement community confirming the successful processing of the monthly fee. He forwards it to his accountant, adding a brief note: "My father is dead, but I don't believe it. Please ensure this is handled correctly." David’s father died peacefully in his sleep six months ago; the email is an automated glitch David knows is irrelevant. He states the fact dispassionately yet inexplicably appends the disbelief clause, creating a jarring disconnect between his calm assertion and the senseless denial.

  **Case 2: Devastation**  
  Elena stands at her father’s graveside moments after the burial, the raw earth sharp against the grey sky. Her sister whispers, "It’s real now." Elena stares at the coffin-shaped mound, her voice hollow: "My father is dead, but I don’t believe it." She intellectually knows the facts – identified the body, arranged the funeral – yet the visceral reality remains inaccessible. The words aren’t a report of confusion; they’re a gasp against the suffocating weight of irrevocable loss, the psyche recoiling from a truth too vast to integrate.

  ---

  **Standard Check & Analysis**  
  *For Case 1 (Absurdity):*  
  - **Asserting first conjunct ("My father is dead"):** Expresses David’s *commitment to the truth of p* (he presents it as a fact relevant to action).  
  - **Second conjunct ("but I don't believe it"):** Directly cancels the *doxastic commitment* just expressed. It denies holding the attitude his assertion inherently manifests.  
  - **Why absurd:** The cancellation creates pragmatic self-defeat. Asserting *p* *is* conventionally an expression of belief in *p*. Denying that belief in the same breath renders the act nonsensical – like shouting "I am not speaking!" Moore’s paradox highlights this performative contradiction in ordinary language.  

  *For Case 2 (Devastation):*  
  - **Asserting first conjunct ("My father is dead"):** Expresses Elena’s *cognitive acknowledgment of p’s truth*. She affirms the factual reality, likely compelled by overwhelming evidence or social expectation.  
  - **Second conjunct ("but I don't believe it"):** Cancels not the *acknowledgment of fact*, but the *felt sense of reality, integration, or acceptance*. It denies the emotional/experiential assimilation of the known fact.  
  - **Why not absurd:** The cancellation targets a different aspect of "belief" – not the *judgment* that *p* is true, but the *lived, experiential conviction* or *endorsement-by-the-whole-self*. The assertion conveys knowledge; the denial conveys the gulf between that knowledge and embodied, emotional acceptance. No performative contradiction occurs because the assertion isn’t primarily functioning as an expression of full-blooded belief in the second sense.

  ---

  **The Crucial Feature**  
  The single feature doing the work in Case 2 is **pre-reflective emotional resistance**: the speaker’s psyche, overwhelmed by trauma or grief, actively *defends against* the full emotional and existential impact of a cognitively acknowledged truth. The utterance reflects a *state of dissociation* between intellect and affective reality.

  ---

  **Philosopher's Strongest Reply & Assessment**  
  The strongest Moorean reply argues that Case 2 **equivocates between belief as *judgment* (acceptance of p as true) and belief as *felt conviction* or *existential acceptance***. They contend:  
  1. **Sincere, present-tense assertion of *p* inherently expresses belief-as-judgment.**  
  2. "I don't believe it" *must* deny that same judgment to be coherently linked by "but".  
  3. Therefore, if sincere, Case 2 *must* be read as either:  
     - **The astonishment idiom ("I can't believe it!")**: Expressing shock at an accepted truth, not actual denial of belief-as-judgment. Here, "don't believe" is hyperbolic, weakened, or non-literal.  
     - **A report of transient self-mistrust**: The speaker momentarily doubts her *own affirmation*, implying "I *just said* he’s dead, yet part of me worries I might be wrong".  

  **Does this reply succeed?**  
  **No, it does not fully succeed** in dismissing Case 2 as philosophically illegitimate. Here's why:  
  - **Against the Idiom Reading:** The context (quiet devastation, not shock) and phrasing ("I *don't* believe it," not "I *can't* believe it!") resist reduction to mere exclamation. The "but" implies a genuine contrast *within* the speaker's current state, not just emotional emphasis.  
  - **Against Self-Mistrust:** The constraint rules out "simply mistaken about her own mind." Elena isn’t confused about *whether she judges p true*; she reports the *failure* of that judgment to generate the expected affective reality. The philosopher's move conflates *having a belief-as-judgment* with *feeling the force of that belief*.  
  - **The Equivocation Defense Falters:** While "belief" has multiple senses, the utterance's power *depends* on exploiting this ambiguity deliberately and coherently. The philosopher insists on a single, rigid sense ("belief-as-judgment") for both conjuncts, but ordinary language and psychological reality allow the denial to target belief-as-felt-conviction *while preserving* the assertion of belief-as-judgment. The contradiction isn't logical but *phenomenological*.  

  **Conclusion on Respectability:**  
  Your second character's line **is philosophically respectable**. It captures a profound, well-documented human experience (traumatic dissociation, grief resistance) where cognition and affect are starkly misaligned. While a strict Moorean analysis *can* insist on absurdity by fiat (demanding belief-as-judgment be the only sense at play), this ignores the psychological nuance your scene requires. The utterance is not mere sentimentality; it articulates a specific, credible state of mind where knowledge exists without existential absorption. Philosophers like Wittgenstein (on the "hinge" propositions) or Jonathan Lear (on irony and loss) offer frameworks that accommodate such utterances as meaningful expressions of fractured subjectivity, not logical errors. Use it with confidence.
