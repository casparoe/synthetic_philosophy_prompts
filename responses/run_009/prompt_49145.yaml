prompt: |-
  I'm writing a paper on the value of original works of art, and before I engage any particular theory I want the specification settled first: what would an adequate account of the value difference between an original and a perfect copy or forgery have to deliver? Please write the desiderata—the cases such a theory must get right, the distinctions it must respect, and the results about how we actually respond to art that it cannot contradict—with the motivating case or consideration behind each requirement. The purpose matters: I want a theory that shows the premium we place on originals to be rational, not one that merely predicts that people pay it, so a requirement that only a prediction-machine could meet is not a genuine desideratum. Flag any requirements you suspect cannot be jointly satisfied; that tension is what my paper is really about.

  Cases the theory must handle, at minimum:

  - Perceptual indistinguishability. A painting and a copy indistinguishable to any viewer, under any magnification, forever, still seem to differ in value. Whatever the theory locates the difference in, it cannot be located in anything that shows up in the visual experience of the work taken alone.
  - Post-exposure re-evaluation. Han van Meegeren's forged Vermeers were admired and hung as masterpieces until his exposure in 1945; afterward, the very same canvases struck viewers as meretricious. The theory must say whether anything in the works changed, or whether the change was entirely in the spectators—and it must handle the awkward fact that spectators found the later judgments natural rather than embarrassing.
  - Delayed revelation and retroactivity. A forgery hangs undetected for fifty years and then is unmasked. Was its value low all along, or does value depend on what people believe at the time? The theory must not collapse the distinction between the value a work has and the value it is believed to have.
  - The reverse misattribution. An original dismissed for a century as a later copy is discovered to be autograph. The value rises overnight with no change in the object. The theory must explain what changed and why that change is legitimate rather than mere market psychology.
  - Autographic versus allographic works. A painting is devalued by being a copy; a novel, a symphony, or a print struck from the artist's plate is not. The theory must draw this line in a principled way, and must say why performances of a score by different players do not stand to each other as forgery to original.
  - The authorized replica. After Duchamp's Fountain was lost, replicas were made with his approval in the 1950s and 1960s, and museums now display them as the work; posthumous bronzes cast from an artist's original waxes command a premium over casts the estate did not authorize. The theory must explain what is preserved by authorization in cases where the artist's hand made nothing, and what is lost without it.
  - Self-copying. A painter, decades on, copies her own earlier canvas and sells it as the earlier one. No one else was deceived about authorship in the sense that matters to attribution; the hand is the right hand. Is anything of value lost, and does the theory say so without ad hoc machinery?
  - Material survival. Restoration and repair raise a Ship-of-Theseus question: how much of the original material can be replaced before the object is no longer the work, and can the theory state a principled threshold rather than a vague one?

  Distinctions the theory must respect:

  - Aesthetic value versus market value versus relic value. A lock of a saint's hair is not supposed to be valuable for how it looks, and nobody thinks that value is aesthetic. If the theory grounds the original's premium in a historical connection the object bears, it must say whether it has preserved an aesthetic difference at all or quietly conceded that the difference is relic-like—and whether that concession is a cost.
  - Value that depends on the work's actual history versus value that depends on the audience's beliefs, which come apart in both directions in the cases above.
  - The difference between a copy and a forgery, where the difference is deception, and between a copy and a mere duplicate, where no one intended to pass anything off.

  Finally, tell me whether these three requirements are jointly satisfiable: that the value difference between original and perfect copy is genuinely aesthetic rather than economic or relic-like; that it does not supervene on what anyone believes about the work; and that it can remain unperceivable in principle, as the indistinguishability cases require. If no theory can have all three, say which one you would drop and why. Then, briefly—half a page at most—score the main families (the view that grounds value in historical connection to an act of origination, the Goodmanian view that the difference must be detectable in principle, and the deflationary view that the premium is extra-aesthetic, like a relic's) against your list. I care about the criteria, not the scorecard, so keep the weight there.
reasoning: |-
  Okay, the user is writing a paper on the value of original artworks versus perfect copies or forgeries. They need a clear set of criteria that any theory must meet to explain why originals are more valuable rationally, not just as a market phenomenon. Let me start by breaking down their requirements.

  First, they listed several cases the theory must handle, like perceptual indistinguishability. The theory must account for value difference even when the copy is visually identical. Then there's post-exposure re-evaluation, like the Van Meegeren forgeries—why did perception change after exposure? Delayed revelation is another: if a forgery is discovered after 50 years, was its value always low? Reverse misattribution: when a copy turns out to be original, value spikes. How is that legitimate?

  Autographic vs. allographic works: why are paintings devalued as copies but not novels or symphonies? Authorized replicas, like Duchamp's Fountain replicas—what does authorization add? Self-copying: if an artist copies their own work, is value lost? Material survival: how much original material is needed?

  Distinctions are crucial too. Aesthetic vs. market vs. relic value. The theory must clarify if the value is aesthetic or just historical. Also, actual history vs. audience beliefs, and the differences between copy, forgery, duplicate.

  The user's core tension is whether a theory can satisfy three key requirements: aesthetic value difference, independence from beliefs, and unperceivability. I need to check if these are jointly satisfiable. 

  Looking at the cases, aesthetic value tied to perception can't explain indistinguishable cases. Historical theories might reduce to relic value. Belief-based theories conflict with the need for belief-independence. Maybe no theory satisfies all three. The user probably needs to concede that aesthetic value isn't the sole factor, or drop the unperceivability requirement. But since they want the premium to be rational, maybe historical connection is the way, even if it edges towards relic value. 

  Now, evaluating the main theories. Historical connection (Gaut, Dutton) handles most cases but risks conflating aesthetic and relic value. Goodman's detectable difference fails indistinguishability and delayed cases. Deflationary views reduce to market or relic, failing aesthetic independence. 

  The user's deeper need is to explore the tension between aesthetic and historical values, showing that the premium is rational but involves non-perceptual elements. They might argue that the value is a hybrid, where historical provenance contributes to the artwork's identity, thus affecting its aesthetic appraisal indirectly. Highlighting this tension could be the paper's contribution.
answer: |-
  Here are the desiderata for an adequate theory of the original/copy value difference, structured around your cases, distinctions, and core requirements, with the underlying motivation and flagged tensions:

  ### Core Desiderata from Cases
  1.  **Perceptual Indistinguishability Constraint:** The theory must explain the persistent value difference *without* locating it in perceptual properties accessible to ideal observation. *Motivation:* To avoid reducing value to mere appearance, which the perfect copy shares. *Challenge:* How can value be aesthetic yet unperceivable?
  2.  **Post-Exposure Re-evaluation Constraint:** The theory must account for the *dramatic shift in aesthetic response* (not just market price) upon discovering a forgery (e.g., Van Meegeren), while explaining why this shift feels *appropriate* (not embarrassing cognitive dissonance). *Motivation:* Shows aesthetic judgment is sensitive to origin, not just appearance/beliefs at the time. *Requirement:* Must distinguish between the *object's actual value* and *belief-dependent appreciation*.
  3.  **Delayed Revelation Constraint:** The theory must maintain that the forgery's value was *always* lower than believed, even before exposure. *Motivation:* Preserves the distinction between *actual value* and *value attributed*, preventing value from collapsing into momentary consensus. *Challenge:* How can an imperceptible property determine value retroactively?
  4.  **Reverse Misattribution Constraint:** The theory must explain the *legitimacy* of the value increase upon reattribution, showing it corrects an *error* about the object's history, not just market sentiment. *Motivation:* Validates the historical connection as constitutive of value, not merely a belief-dependent effect.
  5.  **Autographic/Allographic Distinction Constraint:** The theory must provide a *principled basis* for why perfect copies devalue autographic works (paintings) but not allographic works (novels, scores, authorized prints). *Motivation:* Captures a fundamental difference in artistic practice and ontology. *Requirement:* Must explain why performance variation isn't "forgery" (different tokens of the same abstract type).
  6.  **Authorized Replica Constraint:** The theory must explain the value of authorization *even when* the artist's hand didn't create the physical object (e.g., Duchamp's *Fountain* replicas, posthumous bronzes). *Motivation:* Shows authorship/endorsement matters beyond physical creation. *Requirement:* Must define what "origination" entails beyond mere physical making.
  7.  **Self-Copying Constraint:** The theory must explain why an artist copying their own earlier work and selling it *as* the original is problematic (deception, loss of value), even though the hand is "right". *Motivation:* Highlights that value isn't *solely* about authorship or skill, but also about *authenticity of the specific historical instance* and the context of its creation/presentation.
  8.  **Material Survival Constraint:** The theory must offer a *principled* (even if not perfectly precise) account of how much original material can be replaced before the object ceases to be the work, grounding this in the nature of the work's identity. *Motivation:* Addresses the practical and conceptual limits of historical connection as a value-bearer. *Requirement:* Avoids arbitrary thresholds; links identity to value.

  ### Essential Distinctions to Respect
  9.  **Aesthetic/Relic Distinction:** The theory must demonstrate that the original's premium is *aesthetically relevant* – contributing to the work's meaning, experience, or significance *as art* – and not merely akin to the relic value of a saint's bone or a celebrity's napkin. *Motivation:* Preserves the *artistic* nature of the value difference. *Tension:* This is the hardest distinction. Does historical connection *enhance aesthetic experience* or merely add *non-aesthetic* fascination?
  10. **Actual History vs. Audience Belief Distinction:** The theory must ground the value difference primarily in the *object's actual history* (e.g., being created by Vermeer), not in the *audience's beliefs* about that history, while acknowledging beliefs *mediate* access to that history. *Motivation:* Ensures value is objective (based on facts) and avoids collapsing into subjectivism or market psychology (as per your purpose).
  11. **Copy/Forgery/Duplicate Distinction:** The theory must explain why a *forgery* (intended deception) typically has lower value than a mere *copy* (honest reproduction), and why both differ from a *duplicate* (e.g., mass-produced poster) lacking artistic pretension. *Motivation:* Shows deception and intent matter, but are not the *sole* source of devaluation (an honest copy still lacks the original's full value).

  ### The Core Tension & Joint Satisfiability
  **Can these three requirements be jointly satisfied?**
      A.  The value difference is genuinely *aesthetic* (not just economic/relic).
      B.  It does *not supervene* on audience beliefs (depends on actual history).
      C.  It *can remain unperceivable in principle* (Perceptual Indistinguishability).

  **Answer: Likely No.** Here's the tension:
  *   To satisfy (C) and (B), the value difference *must* be grounded in a non-perceptual, historical property (e.g., "created by Vermeer's hand in 1658").
  *   To satisfy (A), this historical property must be *aesthetically relevant* – it must make a difference to how we *experience* or *understand* the work *as art*.
  *   The problem: How can an *imperceptible* historical fact *directly* constitute an *aesthetic* property or *directly* enhance the aesthetic *experience* of the indistinguishable object? If its relevance depends on the *belief* in that history (which changes the experience, as in Van Meegeren), then it arguably supervenes on beliefs (violating B). If its relevance is independent of belief, how does this imperceptible fact *manifest* aesthetically in a way accessible to the viewer?

  **Which to drop?**
  *   **Drop (A):** Concede the difference is partly (or primarily) extra-aesthetic (historical, relic-like). This preserves (B) and (C). *Cost:* May undermine the claim that the premium is fundamentally *artistic* rather than antiquarian or fetishistic.
  *   **Drop (C):** Insist the difference *must* be detectable in principle (à la Goodman). *Cost:* Contradicts the thought experiment and seems empirically false for perfect copies; fails cases like delayed revelation where detection happens later.
  *   **Drop (B):** Ground the difference in the *beliefs* of the relevant community. *Cost:* Reduces value to psychology/market, contradicts delayed revelation/reverse misattribution cases, fails your requirement for rationality beyond prediction.

  **Recommendation:** Consider **modifying (A)**. Argue that the historical property *indirectly* confers aesthetic value by:
      1.  **Constituting the Work's Identity:** What we experience *as the work* is inherently tied to its genesis (for autographic arts). The copy is a different *instance* or *type*.
      2.  **Enabling Correct Interpretation:** The historical context of creation is essential for full understanding and appreciation. Beliefs *aim* at this history; correct beliefs enable correct appreciation.
      3.  **Signifying Achievement:** The value includes appreciation of the *artist's specific achievement at that moment*. A copy, even by the artist, is a different achievement.
  This preserves (B) and (C), while arguing the historical property is *aesthetically relevant* because it defines *what the work is* and *how it should be understood*. The premium is rational because it tracks the object's true identity and history, essential for proper aesthetic engagement. The "aesthetic value" encompasses appreciation of origins as part of the work's artistic nature.

  ### Scoring Main Theories Against Desiderata (Briefly)

  1.  **Historical Connection/Origination (e.g., Gaut, Dutton):**
      *   **Strengths:** Excels at (B), (C), (4 Reverse Attr.), (6 Auth. Replica - authorization signifies chain of origination), (7 Self-Copying - deceives about the specific historical instance), (8 Material - connection to originating matter/event), (10 History/Belief), (11 Copy/Forgery/Dup). Handles (2 Post-Exp., 3 Delay) by saying value was always low/high.
      *   **Weaknesses:** Major tension with (9 Aesthetic/Relic). Does it explain the value *as aesthetic* or concede relic-value? Struggles with (1 Percep. Indist.) *if* aesthetic experience is equated solely with perception. Needs careful defense of how history is aesthetically relevant. (5 Auto/Allo) requires defining "origination act" differently for each (e.g., creation of token vs. type).

  2.  **Goodmanian (Syntactic Density/Autographic):**
      *   **Strengths:** Clear on (5 Auto/Allo), (9 Aesthetic/Relic - locates value in perceptual/cognitive engagement), (1 Percep. Indist. - denies it's possible for autographic works, so value diff *is* perceivable in principle).
      *   **Weaknesses:** Fails (1 Percep. Indist.) empirically/conceptually (perfect copies *are* conceivable). Fails (2 Post-Exp., 3 Delay) (value *shouldn't* change if undetectable). Fails (4 Reverse Attr.) (if undetectable, no value change needed). Fails (6 Auth. Replica) (authorization irrelevant to syntax). Fails (10 History/Belief) (supervenes on detectable properties, not history itself). Poor on (7 Self-Copying), (8 Material). Too restrictive.

  3.  **Deflationary (Relic/Market/Psychological):**
      *   **Strengths:** Easily handles (2 Post-Exp.), market aspects of (3 Delay, 4 Reverse Attr.), (6 Auth. Replica - authority creates market value/relic status), (11 Copy/Forgery/Dup - deception affects psychology/market).
      *   **Weaknesses:** **Fails your core purpose.** Reduces premium to non-rational (or non-artistic) factors: fetishism, scarcity, snobbery, market dynamics. Explicitly violates (9 Aesthetic/Relic) (admits it's relic-like), (10 History/Belief) (often makes value belief-dependent), and (B). Struggles to explain why the shift in (2) feels *appropriate*, not just psychological. Doesn't ground (4, 7) legitimacy. Poor on (5 Auto/Allo) as a principled artistic distinction. Essentially abandons the project of showing the premium is *rationally artistic*.

  **Conclusion:** The **Historical Connection** theory satisfies the most desiderata, particularly the core requirements of belief-independence and unperceivability (B & C), and best handles the case constraints demanding historical facts determine value. Its primary cost is the **Aesthetic/Relic Tension (9)**, which becomes the critical battleground for your paper. Success hinges on convincingly arguing that the historical connection is *constitutive of the work's identity and artistic meaning*, thereby making its value contribution genuinely aesthetic, not merely antiquarian. Goodmanianism fails too many cases. Deflationism abandons the rational aesthetic project. Embrace the tension around (9) – that's where the philosophical depth lies.
