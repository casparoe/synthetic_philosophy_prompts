answer: |-
  ## Recommendation: Reject Submission

  **Decision:** I recommend we reject this submission without external review.

  **Proposed Criteria for This & Future Submissions:**

  1.  **Comprehensive Source Engagement:** Submissions challenging established historical interpretations *must* rigorously engage with the full spectrum of relevant evidence types (archival, demographic, testimonial, diplomatic, historiographical) relevant to the field. Dismissing entire categories of evidence *a priori* (e.g., survivor/diplomatic testimony as "unverifiable") constitutes a fundamental methodological flaw for historical inquiry, rendering the analysis incomplete and potentially biased.
  2.  **Historiographical Context:** Any revisionist claim must demonstrate a deep understanding of and engagement with the existing scholarship, including the *reasons* for the current consensus. It must explicitly address the counterarguments and evidence supporting the established position, not merely present an alternative calculation in isolation.
  3.  **Methodological Transparency & Limits:** While specialized methodologies (like demography) are valuable, authors must transparently acknowledge the inherent limitations of their chosen method (e.g., census survival struggles with forced migration, incomplete records, deliberate obfuscation). The paper must justify why its method supersedes or adequately accounts for evidence it excludes and explain how it integrates into the broader historical context.
  4.  **Framing and Terminology:** Proposals for significant terminological shifts (e.g., "mass mortality under wartime deportation" vs. "genocide" or "intentional extermination") must be supported by *all* relevant evidence types, including evidence of intent. The burden of proof for such a shift is exceptionally high and requires demonstrating that the new framing better explains the totality of the documented events, actions, and outcomes than the existing one.
  5.  **Scholarly Responsibility & Genocide Studies:** The journal has a responsibility to uphold rigorous scholarly standards *and* to avoid inadvertently providing a platform for arguments that align with politically motivated denialism, especially concerning events recognized as genocide by scholars and numerous states. Submissions on such topics require heightened scrutiny regarding methodology, comprehensiveness, and potential misuse of findings outside the academic sphere.

  **Application to This Submission:**

  *   **Failure on Criterion 1:** The author's explicit exclusion of survivor and diplomatic testimony at the outset is disqualifying. These sources are central to understanding intent, lived experience, perpetrator actions, and the documented contemporaneous understanding of the event. Dismissing them as "unverifiable" ignores decades of historical methodological debate on source criticism and the validity of such evidence in establishing patterns of violence and intent, particularly for genocide studies. This creates a significant, unaddressed blind spot.
  *   **Failure on Criterion 2:** The paper appears to present demographic analysis as a standalone corrective without sufficiently grappling with the massive body of scholarship – historical, legal, diplomatic – that underpins the current understanding of the Armenian Genocide, including the evidence for intent and systematic extermination derived *from* the very sources the author excludes.
  *   **Concern on Criterion 4:** Proposing the "wartime deportation" framing based *only* on a disputed demographic calculation, while ignoring the evidence of intent documented in other sources, fails the high burden of proof required for such a radical terminological shift. It risks misrepresenting the historical event by divorcing the mortality from the context of systematic, state-organized destruction.
  *   **Concern on Criterion 5:** While the author's intent may be purely demographic, the argument's structure and conclusion – a drastic downward revision coupled with a rejection of the genocide framework achieved by ignoring key evidence categories – aligns closely with denialist talking points. Publishing it without addressing the excluded evidence would be irresponsible and could be misused, regardless of the author's personal motivations.

  **Honest Treatment of the Strongest Counterargument:**

  The strongest argument *against* rejection is compelling: **"We must not reject a paper solely because we dislike its conclusion. Rigorous peer review is precisely the process designed to evaluate challenging claims based on method and evidence. Dismissing it unread risks censorship and stifles legitimate academic revisionism, which has occurred responsibly in other historical fields (e.g., revised estimates for specific WWII battles or colonial conflicts). If the demography is sound and the archival work rigorous, shouldn't that be assessed by experts, even if the conclusion is controversial? Rejecting it preemptively undermines our credibility as an objective scholarly forum."**

  This argument rightly emphasizes the core principle of evaluating *method* over *conclusion* and the danger of pre-judgment. It highlights valuable historical precedents where evidence led to legitimate revisions. Its strength lies in defending the integrity of the peer review process against ideological or emotional interference.

  **Why Rejection is Still Warranted:**

  However, this case is distinct. The counterargument assumes the paper presents a *methodologically sound challenge* within the norms of historical inquiry. The fatal flaw here is that the paper **explicitly and fundamentally violates a core methodological tenet of history** by dismissing entire, crucial categories of evidence *a priori*. It is not presenting a *better* interpretation of *all* the evidence; it is presenting an interpretation based on a *subset* of evidence deemed relevant by the author, while dismissing other key evidence as irrelevant. This isn't about disliking the conclusion; it's about a methodology that is inherently incomplete and flawed *for the historical question being addressed* (the nature and intent of the event). Sending out a paper built on this flawed foundation wouldn't be upholding scholarly rigor; it would be outsourcing a decision we, as historians, are qualified to make regarding the necessary comprehensiveness of evidence. Genocide studies, reliant on multiple evidentiary threads to establish intent and system, demands this comprehensiveness. Peer reviewers cannot fix the fundamental omission built into the paper's core approach.

  Therefore, rejection is based on a demonstrable failure to meet the basic methodological standards required for responsible historical revisionism on this topic, not merely on the controversial nature of its conclusion.
