prompt: |-
  I want a decision problem that is a counterfactual mugging with all the sci-fi stripped out of it, and I want you to design it to spec rather than just retell the classic version.

  The specs: the branch-determining event (the "coin") has to be genuinely independent of your decision and your dispositions -- I don't want the case quietly collapsing into XOR blackmail, where the offer is itself evidence about the disaster or about what kind of agent you are. The "simulation" can just be another person's judgment of you, made before the coin landed, no better than a shrewd coworker reading your character -- it can be wrong sometimes. Setting should be ordinary life: a business partner, a landlord, an insurance-ish arrangement, a family thing. No Omega, no demons, no perfect predictors, and stakes a normal person would actually face. The case should stay a mugging in the relevant sense: you're only ever in the branch where you're asked to sacrifice something, and whether things went well for you in the other branch depends on what you would have done here. Also, don't stipulate the verdict -- it should fall out of the payoff structure, not be announced in the setup.

  After the one-paragraph scenario, check the specs for me. Walk through what causal decision theory says, what evidential decision theory says (they should split in the standard direction), and what an updateless or one-boxing policy says and why. Then tell me honestly which feature of the case is doing the work -- I suspect it's the independence of the coin, since real-world "coins" (who you happen to get as a counterparty, which market you ended up in) tend to correlate with people's dispositions, which is exactly what lets evidential reasoning sneak in the back door. Say what happens to the verdicts if that correlation is allowed back in. Also: does the case survive if the human predictor is only right, say, 60% of the time instead of almost always, or does the updateless policy's edge dissolve as accuracy drops, and at roughly what point? Finish with the strongest way a causal decision theorist would attack the case -- where's the weakest joint?
reasoning: |-
  We are going to design a counterfactual mugging scenario that meets the given specifications.

  Scenario:
  You are a freelance consultant. A client, Taylor, is considering hiring you for one of two projects: Project A (a small, low-risk job) or Project B (a large, high-reward job). Taylor flips a fair coin. If it lands heads, Taylor assigns you to Project A. If tails, Taylor assigns you to Project B. However, before the coin flip, Taylor consults with a former colleague of yours, Morgan, who knows you well but isn't perfect. Morgan gives a prediction about how you would handle a hypothetical scenario: if you were asked to contribute $100 to a joint marketing fund (that would only benefit you if you got Project B) after being assigned to Project A, would you do it? Morgan's prediction is 90% accurate. If Morgan predicts you would contribute, then if the coin lands tails (so you get Project B), Taylor will pay you a $1000 bonus. If Morgan predicts you wouldn't contribute, then even if the coin lands tails, you get no bonus. Now, the coin has been flipped and it landed heads. You are assigned to Project A. Taylor asks you to contribute $100 to the joint marketing fund. If you contribute, you lose $100. If you don't, you keep your money. However, if the coin had landed tails (which it didn't) and Morgan had predicted you would contribute, you would have gotten a $1000 bonus. But note: whether you get the bonus in the tails branch depends on what Morgan predicted about your behavior now (in the heads branch). Since the prediction was made before the coin flip, your current decision doesn't affect the prediction (it's already fixed). But if you are the type of person who contributes now, then Morgan likely predicted that, and so in the tails branch you would have gotten the bonus. But in this branch, you are in heads and are being asked to contribute without any direct benefit.

  Specs Check:
  1. The coin flip is independent: fair coin, so independent of your decision and dispositions.
  2. The predictor (Morgan) is fallible: 90% accurate, just a shrewd colleague.
  3. Setting: ordinary business arrangement (freelance consultant, client, colleague).
  4. Mugging structure: you are only in the heads branch (asked to sacrifice $100). The tails branch (where you get Project B) is counterfactual. Your bonus in the tails branch depends on what Morgan predicted about your action in the heads branch, which in turn depends on your type (which is correlated with your current action). But note: your current action doesn't cause the prediction (it's already made) but it is evidence of what the prediction was and hence whether you get the bonus in the tails branch.
  5. No stipulation of verdict: the decision problem is presented without saying what you should do.

  Decision Theories:

  Causal Decision Theory (CDT):
  CDT considers only the causal consequences of your action. In this branch (heads), contributing $100 causes you to lose $100. It does not cause the coin to have been tails (it was heads) and does not cause the prediction (which was already made). Therefore, CDT sees no benefit in contributing and recommends not contributing. The loss of $100 is real and the bonus in the tails branch is counterfactual and not causally affected by your current action.

  Evidential Decision Theory (EDT):
  EDT considers the evidence that your action provides. If you contribute, that is evidence that you are the type of person who contributes. Since Morgan is 90% accurate, it is likely that Morgan predicted you would contribute. Therefore, if you contribute, it is evidence that in the tails branch (which you are not in) you would have gotten the $1000 bonus. So, by contributing, you are losing $100 but you are also providing evidence that you are the type who would contribute, and hence that in the counterfactual world you are getting $1000. EDT calculates the expected utility conditional on your action. Let:
  - P(bonus | contribute) = P(Morgan predicted contribute | you contribute) = accuracy = 0.9
  - P(bonus | not contribute) = P(Morgan predicted contribute | you not contribute) = 1 - accuracy = 0.1

  The bonus is $1000, but only in the tails branch which has 0.5 probability. However, note that the bonus is conditional on the tails branch. But since the coin flip is independent, the probability of tails is 0.5 regardless of your action. Therefore, the expected utility of contributing:
  - Loss of $100.
  - Plus 0.5 (chance of tails) * 0.9 (chance of bonus given contribute) * $1000 = $450.
  Total: -$100 + $450 = $350.

  Expected utility of not contributing:
  - No loss.
  - Plus 0.5 * 0.1 * $1000 = $50.
  Total: $50.

  So EDT recommends contributing because $350 > $50.

  Updateless/One-boxing Policy (UDT or FDT):
  This approach says to choose the policy that would have been best to precommit to before knowing the outcome of the coin flip. Before the flip, you don't know whether you'll be in the heads branch or the tails branch. If you precommit to contributing in the heads branch, then:
  - In the heads branch, you lose $100.
  - But because you are the type who contributes, Morgan (with 90% accuracy) will predict you contribute, so if the coin lands tails, you get the $1000 bonus.

  The expected utility of the policy "always contribute" is:
  - With 0.5 chance (heads): -$100
  - With 0.5 chance (tails): $1000 (bonus) but note: the bonus is only if Morgan predicted contribute. Since you are following a policy of contributing, Morgan will predict contribute with 0.9 probability, so expected bonus in tails: 0.9*$1000 = $900.
  So total: 0.5*(-100) + 0.5*(900) = -50 + 450 = 400.

  The policy "never contribute":
  - Heads: $0
  - Tails: bonus only if Morgan predicted contribute, but you are following never contribute, so Morgan predicts not contribute with 0.9 probability, hence bonus with 0.1 probability: 0.1*$1000 = $100.
  Total: 0.5*(0) + 0.5*(100) = 0 + 50 = 50.

  Therefore, the policy of contributing is better (400 vs 50). So when you are in the heads branch, you should follow the policy and contribute.

  Which feature is doing the work?
  The key feature is the independence of the coin flip and the fact that the prediction (which determines the bonus in the tails branch) is about your action in the heads branch and is made before the flip. This breaks the causal link but maintains the evidential and counterfactual dependence. The predictor's fallibility is also important because if the predictor were perfect, then the correlation between your action and the prediction would be absolute. But even with 90%, it still holds.

  What if we allow correlation between the coin and your dispositions?
  If the coin flip were not independent (e.g., if the coin flip were influenced by your disposition, or if your disposition influenced which branch you end up in), then EDT might have a harder time because the evidence provided by your action would also be evidence about the branch. But in the current setup, the coin is independent, so EDT and UDT can both recommend contributing.

  What if the predictor is only 60% accurate?
  Let's recalculate for EDT and UDT with 60% accuracy.

  EDT:
  - Contribute: loss $100. Evidence: P(bonus|contribute)=0.6. So expected bonus: 0.5 * 0.6 * 1000 = $300. Total: -100+300=200.
  - Not contribute: no loss. Evidence: P(bonus|not contribute)=0.4 (because if not contribute, then Morgan would have predicted contribute with 0.4 chance? Wait: if Morgan is 60% accurate, then when you don't contribute, Morgan predicts not contribute with 60% accuracy, so predicts contribute (wrongly) 40% of the time. So P(bonus | not contribute) = P(Morgan predicted contribute | you don't contribute) = 0.4. Then bonus: 0.5 * 0.4 * 1000 = $200. Total: $200.

  So EDT: contribute gives $200, not contribute gives $200 -> indifferent.

  UDT:
  - Policy contribute: 
    Heads: -$100
    Tails: bonus with 0.6 chance -> 0.6*1000 = $600
    Expected: 0.5*(-100) + 0.5*(600) = -50 + 300 = 250.
  - Policy not contribute:
    Heads: $0
    Tails: bonus with 0.4 chance (because if you never contribute, Morgan predicts not contribute 60% of the time, so predicts contribute 40%) -> 0.4*1000 = $400
    Expected: 0.5*(0) + 0.5*(400) = 200.

  So UDT still prefers contributing (250 vs 200) even at 60% accuracy.

  But what if accuracy is 50%? Then Morgan is just guessing.

  EDT:
  - Contribute: P(bonus|contribute)=0.5 -> expected bonus: 0.5 * 0.5 * 1000 = $250. Total: -100+250=150.
  - Not contribute: P(bonus|not contribute)=0.5 -> expected bonus: $250. Total: 250.
  So EDT prefers not contributing (250 vs 150).

  UDT:
  - Policy contribute: 
    Heads: -100, Tails: bonus with 0.5 chance -> 500. Expected: 0.5*(-100) + 0.5*(500) = -50+250=200.
  - Policy not contribute:
    Heads: 0, Tails: bonus with 0.5 chance -> 500. Expected: 0.5*0 + 0.5*500=250.
  Then UDT prefers not contributing (250 vs 200).

  So at 50% accuracy, both EDT and UDT (and CDT) agree: don't contribute.

  But note: at 60% accuracy, UDT still slightly favors contributing (250 vs 200) while EDT is indifferent (200 vs 200). So the updateless policy's edge dissolves as accuracy drops, and at 50% it disappears.

  Strongest attack from CDT:
  The weakest joint in the case is that in the actual branch (heads) you are being asked to make a sacrifice that doesn't causally affect anything. The bonus in the tails branch is already fixed by the prediction, which cannot be changed. Therefore, CDT would argue that you are just throwing away $100 for no reason. The fact that the type of person who would throw away $100 is the same type that would have been predicted to do so and hence would have gotten the bonus in the tails branch is merely a correlation. But since you are not in the tails branch, you shouldn't pay for the sake of being that type. In other words, the CDT agent would say: "I am in the heads branch. The prediction has already been made and the coin has landed. My action now doesn't change the past. So why should I pay? The bonus in the tails branch is a sunk cost from my perspective."

  This attack is strong because it points out that the updateless agent is paying to be a certain type, but the CDT agent doesn't care about being a type, only about the consequences of actions. And in this branch, the consequences of paying are just a loss of $100.

  Conclusion:
  The case survives with the independence of the coin and the predictor's accuracy above 50%. The key feature is the independence. If we allow the coin to correlate with the agent's dispositions (e.g., if the coin is more likely to land tails for agents who are more cooperative), then the EDT reasoning might get muddied because then contributing would be evidence that the coin is more likely to be tails (if cooperative agents are more likely to be in tails). But in our setup, the coin is independent, so EDT and UDT both recommend contributing (above 50% accuracy) and CDT does not.
answer: |-
  ### Counterfactual Mugging Scenario in Ordinary Life

  **Scenario:**  
  You're a tenant renting an apartment. Your landlord, Alex, uses a fair coin flip to decide which of two maintenance plans to offer you: Plan A (basic, no extra perks) or Plan B (premium, with a potential $1000 discount on next year's rent). Before the coin flip, Alex consults their perceptive but fallible colleague Taylor, who knows you casually. Taylor predicts whether you'd agree to a *hypothetical* request: If offered Plan A, would you chip in $100 toward building-wide improvements (e.g., a new lobby bench)? Taylor is right 90% of the time. If Taylor predicts "yes," and the coin lands tails (Plan B), you automatically get the $1000 discount. If Taylor predicts "no," no discount is given in Plan B. The coin is flipped—it lands heads. You're offered Plan A and asked to contribute $100 for the bench. If you pay, you lose $100 with no direct benefit. If you refuse, you keep the money. Your decision doesn't affect the coin or Taylor's prediction (both are fixed), but the discount in the *counterfactual* Plan B branch depends on what Taylor predicted about your action now.

  ---

  ### Specs Check
  - **Independent "coin":** Fair coin flip, unaffected by your decision/dispositions.  
  - **Fallible predictor:** Taylor (90% accurate) is a "shrewd colleague"—no sci-fi.  
  - **Ordinary setting:** Landlord-tenant interaction; stakes are realistic ($100 loss vs. potential $1000 gain).  
  - **Mugging structure:** You only experience the heads branch (asked to sacrifice $100). Your action in this branch determines the counterfactual outcome in tails (the discount) via Taylor's pre-flip prediction.  
  - **No verdict stipulated:** Payoff-driven outcome (shown below).  

  ---

  ### Decision Theories Analysis
  Assume:  
  - Probability of tails (Plan B) = 0.5 (fair coin).  
  - Taylor's accuracy = 0.9.  
  - Utility = monetary gain/loss.  

  **1. Causal Decision Theory (CDT):**  
     - Only considers *causal effects* of actions.  
     - Paying $100 causes a $100 loss. It doesn’t affect the coin (already heads) or Taylor’s prediction (already fixed).  
     - Refusing costs nothing.  
     - **Verdict:** Refuse. Expected utility (EU) of paying = –$100. EU of refusing = $0.  

  **2. Evidential Decision Theory (EDT):**  
     - Considers *evidence* provided by actions.  
     - Paying $100 is strong evidence you’re the "payer" type. Since Taylor is 90% accurate, this implies a 90% chance Taylor predicted "yes," so in the tails branch (50% probable), you’d get the $1000 discount.  
       - EU(pay) = –$100 + [P(tails) × P(Taylor predicted yes | you pay) × $1000]  
                  = –$100 + [0.5 × 0.9 × $1000] = –$100 + $450 = **$350**.  
     - Refusing is evidence you’re the "refuser" type, implying 90% chance Taylor predicted "no," so no discount in tails.  
       - EU(refuse) = $0 + [0.5 × 0.1 × $1000] = **$50** (10% chance Taylor mispredicted).  
     - **Verdict:** Pay. Higher EU ($350 > $50).  

  **3. Updateless/One-Boxing Policy (e.g., FDT):**  
     - Chooses the *policy* (across branches) that maximizes expected utility *before* the coin flip.  
     - Policy 1: *Always pay if asked*.  
       - Heads branch (50%): Lose $100.  
       - Tails branch (50%): Get discount if Taylor predicted "yes" (90% chance since you always pay).  
       - EU = 0.5×(–$100) + 0.5×(0.9×$1000) = –$50 + $450 = **$400**.  
     - Policy 2: *Never pay if asked*.  
       - Heads: $0.  
       - Tails: Discount only if Taylor predicted "yes" (10% chance—due to 90% accuracy).  
       - EU = 0.5×($0) + 0.5×(0.1×$1000) = **$50**.  
     - **Verdict:** Commit to "always pay" ($400 > $50), so in the heads branch, you pay $100.  

  ---

  ### Critical Feature: Independence of the Coin  
  The **independence of the coin flip** is the linchpin. It ensures:  
  - Taylor’s prediction is uncorrelated with your action/dispositions *after the flip*, preventing the scenario from collapsing into XOR blackmail (where the offer directly reveals hidden states).  
  - EDT and updateless policies "win" by exploiting the correlation between your action and Taylor’s *pre-flip* prediction, which controls the counterfactual discount.  

  **If independence is violated (e.g., coin correlates with dispositions):**  
  - Suppose cooperative tenants are more likely to get tails (Plan B).  
  - Paying now becomes evidence that you’re cooperative, *and thus that tails was likely*. EDT might then refuse, fearing the coin was probably heads (no discount possible).  
  - Updateless policy loses its edge: The "best precommitment" depends on the correlation strength, muddying the verdict.  
  - *Result:* Evidential reasoning weakens; CDT’s refusal may dominate.  

  ---

  ### Robustness to Predictor Accuracy  
  **At 90% accuracy:**  
  - Updateless policy strongly favors paying (EU=$400 vs. $50).  

  **At 60% accuracy:**  
  - EDT: EU(pay) = –$100 + [0.5 × 0.6 × $1000] = $200; EU(refuse) = $0 + [0.5 × 0.4 × $1000] = $200. → **Indifferent**.  
  - Updateless: EU(always pay) = 0.5×(–$100) + 0.5×(0.6×$1000) = $250; EU(never pay) = 0.5×$0 + 0.5×(0.4×$1000) = $200. → **Still favors paying** ($250 > $200), but edge is smaller.  

  **At 50% accuracy (random guessing):**  
  - EDT: EU(pay) = –$100 + [0.5 × 0.5 × $1000] = $150; EU(refuse) = $0 + [0.5 × 0.5 × $1000] = $250. → **Prefers refusing**.  
  - Updateless: EU(always pay) = 0.5×(–$100) + 0.5×(0.5×$1000) = $200; EU(never pay) = 0.5×$0 + 0.5×(0.5×$1000) = $250. → **Prefers refusing**.  
  - **Conclusion:** Updateless edge dissolves below ~55% accuracy. Above 50%, it still recommends paying, but the benefit shrinks with accuracy.  

  ---

  ### CDT’s Strongest Attack: The "Sunk Cost" Gambit  
  **Weakest joint:** The updateless policy’s reliance on *counterfactual identity*.  
  - **Attack:** "In the *actual* branch (heads), paying $100 is a strictly dominated action. It burns money to ‘signal’ a disposition that’s already fixed. Taylor’s prediction is history; it can’t be changed. The discount in tails is causally inaccessible—like mourning money you never had. Only a sucker pays for the ghost of a benefit locked in another universe."  
  - **Why it bites:** Highlights updatelessness as a "cult of rationality" sacrificing real utility for abstract consistency. Real-world tenants (CDT) would scoff: "I lost the coin flip. Why throw good money after bad?"  

  This preserves the mugging’s core tension while grounding it in mundane stakes—no demons required.
