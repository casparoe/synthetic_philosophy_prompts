prompt: |-
  I'm a philosophy PhD student working on population ethics, and I'm trying to figure out my actual position on strong longtermism — the claim that shaping the very long-run future matters overwhelmingly, because of the number of potential future people — by taking verdicts on concrete cases rather than arguing about totalism in the abstract. My verdicts so far: paying large, certain costs now to prevent a one-in-a-million civilizational collapse this century is clearly worth it; I also think it's right to refuse funding a grant that would reduce extinction risk by something like one part in a billion, in favor of deworming thousands of children today, even though the expected number of lives at stake in the grant is astronomically larger; it's clearly wrong to harvest a living person's organs to bring down the probability of extinction by a genuinely minuscule amount; yet I support imposing real, diffuse costs on people now to prevent a political or environmental lock-in that would permanently degrade every future generation, even when the chance of the money mattering is comparably small; and I think we should reject the argument that the best thing for the future is to save and invest for a few centuries before spending anything, while admitting I can't say where it goes wrong. Is there a single principle behind all this — maybe a probability threshold below which tiny chances of astronomical stakes drop out of deliberation entirely, a contrast between imposing risks and generating benefits, a person-affecting proviso, or some combination — and if not, which of my verdicts should be abandoned? Please state the principle precisely, note which case motivates each clause, tell me honestly which verdicts it cannot save, and say what it implies about a further case I keep going back and forth on: diverting a vaccine shipment from a poor country today to a research program with roughly a one-in-a-hundred-million chance of preventing an engineered pandemic that ends civilization.
reasoning: |-
  Okay, let's tackle this philosophy PhD student's query. They're working on population ethics and trying to pin down their stance on strong longtermism through concrete cases. They've listed several specific verdicts that seem inconsistent at first glance, so the challenge is to find a unifying principle or identify which judgments need revision.

  First, I need to unpack each of their cases carefully. The user supports paying high costs to prevent a 1-in-1M civilizational collapse, but rejects diverting massive resources for a 1-in-1B extinction risk reduction when deworming is an alternative. Organ harvesting to minimally reduce extinction risk is clearly wrong to them, yet they endorse diffuse costs to prevent permanent civilizational degradation even with small chances. They also reject pure savings-focused longtermism but can't pinpoint why.

  Hmm... the key tension seems to be between their acceptance of some low-probability/high-stakes interventions but rejection of others. The organ harvesting case suggests a deontological boundary - direct bodily harm is non-negotiable. The deworming refusal hints at threshold skepticism when probabilities get extremely small. Their support for preventing civilizational lock-in reveals concern about irreversible trajectory changes rather than just extinction probabilities.

  For the vaccine diversion case they're stuck on (1-in-100M chance to prevent pandemic vs. immediate lifesaving), I suspect their principle would reject diversion. The probability is below plausible thresholds, involves direct harm to identifiable individuals, and violates fair distribution - but I should test this against their other commitments.

  The deeper pattern might be: 1) A probability threshold (rejecting truly negligible chances), 2) Harm constraints (no direct/intense harms), 3) Benefit asymmetry (preventing permanent damage > extinction prevention alone), and 4) Fairness (diffuse costs acceptable, concentrated/lethal ones not). 

  I wonder if they've considered Parfit's non-identity problem implications in the lock-in case - that's probably why they care about permanent degradation differently than extinction. Also their rejection of pure savings models suggests they implicitly weight near-term welfare more than strict longtermists do.

  The trickiest part is whether to abandon their deworming verdict - if they accept 1-in-1M interventions but reject 1-in-1B, that seems consistent, but 1-in-100M sits uncomfortably between. Maybe they need to quantify their probability threshold explicitly.

  For the vaccine case, applying the principle: the probability is below threshold, involves redirecting concrete lifesaving resources (like deworming), and causes direct harm - so consistent with rejecting it. If they feel uneasy, perhaps their threshold is higher than 1-in-100M after all.
answer: |-
  Your intuitions reveal a coherent, non-standard position that rejects *both* strong longtermism and near-termism. The unifying principle is:

  **The Thresholded Harm-Priority Asymmetric Principle (THAP):**  
  *When evaluating actions affecting future populations:*
  1.  **Probability Threshold:** Risks/benefits with probabilities below threshold *τ* (e.g., 1/k where k > 10^6) are excluded from expected value calculations, *except* when:
  2.  **Harm Asymmetry:** The action prevents *irreversible civilizational degradation* (not just extinction/size reduction), *or* involves:
  3.  **Harm Constraint:** It is impermissible to impose *direct, severe, concentrated harms* on existing or near-term individuals to mitigate diffuse, sub-threshold long-term risks/benefits, *and*
  4.  **Benefit Priority:** Near-term benefits to identifiable, deprived individuals have significant moral weight that cannot be overridden by sub-threshold long-term gains.

  ---

  **How THAP Explains Your Cases:**

  1.  **Preventing 1-in-1M Collapse (Supported):**  
      *   Probability (10^-6) is *above* a plausible *τ* (e.g., 10^-7 to 10^-9). Expected value dominates.  
      *   *Motivates Clause 1 (Threshold).*

  2.  **Rejecting 1-in-1B Extinction Grant for Deworming (Supported):**  
      *   Probability (10^-9) is *below τ*. Excluded from EV.  
      *   Near-term benefit (thousands dewormed) has significant moral weight (Clause 4).  
      *   *Motivates Clause 1 (Threshold) & Clause 4 (Benefit Priority).*

  3.  **Rejecting Organ Harvesting (Supported):**  
      *   Imposes severe, direct, concentrated harm on an existing individual.  
      *   Probability benefit is "genuinely minuscule" (far below *τ*).  
      *   *Motivates Clause 3 (Harm Constraint).*

  4.  **Support Costs to Prevent Permanent Lock-in (Supported):**  
      *   Prevents *irreversible civilizational degradation* (Clause 2: Harm Asymmetry).  
      *   Costs are "real, diffuse" – not severe/direct/concentrated harms violating Clause 3.  
      *   Probability can be low but *above τ* (implied by "comparably small" to Case 1).  
      *   *Motivates Clause 2 (Harm Asymmetry) and clarifies Clause 3.*

  5.  **Rejecting Pure Savings Model (Supported):**  
      *   Violates Clause 4: Sacrificing *all* near-term benefits for identifiable, deprived individuals (e.g., preventable deaths today) to maximize long-term EV is unacceptable, even if EV calculations favor it. Near-term deprivation has intrinsic moral weight.  
      *   *Motivates Clause 4 (Benefit Priority).*

  ---

  **Verdicts THAP Cannot Save & Required Abandonment:**

  *   **Your deworming vs. extinction grant verdict is the weakest.** If the extinction risk reduction were *above τ* (e.g., 1-in-100k), THAP *would* prioritize the grant over deworming due to the overwhelming EV. You explicitly reject this by supporting deworming even when the *expected* lives saved by the grant are "astronomically larger."  
      *   **Required Abandonment:** You must either weaken this verdict (accept that *sufficiently* high-probability extinction risks *should* dominate deworming) or strengthen Clause 4 to grant near-term benefits *absolute* priority over *any* long-term gains (which contradicts Case 1). THAP allows the deworming verdict *only* because of the sub-*τ* probability.

  ---

  **The Vaccine Diversion Case (1-in-100M Prevention vs. Lifesaving Today):**

  *   **Probability:** 1-in-100,000,000 (10^-8). This is plausibly *below* a reasonable *τ* (e.g., 10^-6 or 10^-7). (Clause 1).
  *   **Harm Constraint:** Diverting vaccines causes direct, severe, concentrated harms (preventable deaths) to identifiable, near-term, deprived individuals. (Clause 3).
  *   **Benefit Priority:** Saving identifiable lives today has significant moral weight. (Clause 4).
  *   **Harm Asymmetry:** Preventing an engineered pandemic *prevents extinction*, but unless it also specifically prevents *permanent civilizational degradation* (beyond just size), Clause 2 doesn't apply strongly. Preventing extinction is catastrophic loss of potential, not necessarily irreversible degradation *of the trajectory*.

  **THAP Verdict: REJECT DIVERSION.**  
  *   The probability (10^-8) is very likely below your implicit *τ* (based on rejecting 10^-9 in Case 2).  
  *   It violates the Harm Constraint (direct harm) and Benefit Priority (near-term deprivation).  
  *   Preventing extinction alone doesn't trigger the Harm Asymmetry exception strongly enough to override Clauses 1, 3, and 4 when the probability is sub-threshold.  
  *   **This aligns with your rejection of the organ harvesting case:** Both involve inflicting severe, concentrated harm on the near-term vulnerable for a sub-threshold long-term gain.

  ---

  **Key Implications of THAP:**

  1.  **Not Strictly Totalist:** Rejects calculating pure expected total utility below *τ* and adds constraints/asymmetries.
  2.  **Person-Affecting Elements:** Harm Constraint & Benefit Priority reflect stronger obligations to existing/identifiable individuals.
  3.  **Asymmetry Matters:** Preventing degradation (trajectory change) is qualitatively different/more urgent than preventing equivalent utility loss via extinction or smaller population.
  4.  **Threshold Skepticism:** Formalizes your intuition that "astronomically small" chances drop out, even with astronomical stakes.
  5.  **Rejects Strong Longtermism:** Near-term benefits have significant weight (Clause 4), sub-threshold risks are ignored (Clause 1), and severe near-term harms are impermissible (Clause 3). Long-term effects only dominate when probabilities are above *τ* *and* don't violate other clauses.

  Your position reflects a nuanced **Thresholded Asymmetric Prioritarianism** with strong deontic constraints on harming the near-term disadvantaged. It captures a deep concern for civilizational trajectory, profound skepticism of ultra-low-probability reasoning, and a commitment to the moral significance of alleviating near-term suffering.
