prompt: |-
  I serve on the acquisitions committee of a mid-sized public museum, and we keep relitigating, case by case, whether an artist's immorality should bear on what we buy, what we show, and how we frame it. Write a decision procedure the committee can actually run in a single meeting. It must first separate the three ways immorality can matter here: as a flaw in the work itself (its content or perspective endorses, or is structured by, something abhorrent); as a biographical fact causally upstream of the work (the wrongdoing produced or funded it, or the work was made through mistreatment of its subjects); and as a consequence of our institutional choice (whether the artist is alive to be platformed, where revenue and reputation flow, who is harmed by the display). Second, it must treat acquiring, exhibiting, and contextualizing as three independent levers rather than one up-or-down verdict. Third — and this is the part our past debates always fudge — it must not assume that aesthetic merit can be assessed in isolation and then weighed against the moral facts: it has to say what to do when learning of the immorality changes the experience of the work itself, so that the isolation strategy fails on its own terms. Then run the procedure on three cases: a long-dead painter whose cruelty is undisputed but whose canvases are morally inert; a living filmmaker whose crimes are notorious and whose celebrated films never touch them; and a photographic series whose reputation for empathy was built through systematic deception and exploitation of its vulnerable subjects. Mark the points where the procedure must hand the question back to human judgment rather than pretending to settle it, say plainly which theory of the relation between ethical and aesthetic value the procedure is operationalizing, and include at least one case where it yields an answer I will not like.
reasoning: |-
  We are designing a decision procedure for the museum acquisitions committee that addresses three distinct ways immorality might matter and treats acquiring, exhibiting, and contextualizing as separate decisions. The procedure must also account for the fact that learning about immorality can change the aesthetic experience of the work.

  The three ways immorality can matter:
  1. **Intrinsic flaw**: The work's content or perspective endorses or is structured by something abhorrent.
  2. **Biographical causality**: The wrongdoing produced or funded the work, or the work was made through mistreatment of its subjects.
  3. **Consequential harm**: The institutional choice (acquiring, exhibiting, contextualizing) might platform a living artist (thus benefiting them), send revenue, reputation, or cause harm by display.

  The three levers:
  - **Acquire**: Whether to purchase the work for the permanent collection.
  - **Exhibit**: Whether to display the work (could be from the collection or on loan).
  - **Contextualize**: How to frame the work in terms of interpretation (labels, wall texts, audio guides, etc.).

  The procedure must not assume aesthetic merit is independent. Thus, we must consider that the moral knowledge might alter the aesthetic experience.

  **Proposed Decision Procedure:**

  The procedure is a series of questions that the committee must answer for each work under consideration. The questions are designed to address the three ways immorality matters and the three levers. The committee must record their votes and reasoning at each step.

  **Step 1: Define the Immorality**
     - Clearly state the immoral act(s) and the evidence for them.
     - Determine which of the three ways the immorality relates to the work:
       a. Intrinsic flaw: Does the work itself express, endorse, or are its content/structure inherently tied to the immorality?
       b. Biographical causality: Is the work causally connected to the immorality (e.g., created with ill-gotten gains, made by exploiting subjects)?
       c. Consequential harm: What are the potential harms of acquiring, exhibiting, or contextualizing this work? (Consider: Is the artist alive? Might display cause harm to victims or communities? Might it platform a wrongdoer?)

  **Step 2: Assess the Aesthetic Merit, Acknowledging the Moral Knowledge**
     - The committee must discuss the aesthetic value of the work, but they must do so while being fully aware of the immorality. They cannot bracket the moral knowledge. They must ask: "Does knowing about the immorality change the way we experience the work? If so, how?"
     - Vote on whether the work has significant aesthetic merit (considering the moral knowledge) and note if that merit is inseparable from the moral flaw (if any) or if it stands independently.

  **Step 3: Decision on Acquisition**
     - Consider:
       - The work's artistic and historical importance.
       - The potential harms of acquisition (consequential harm: funding the artist if living, reputational harm to the museum, etc.).
       - The intrinsic flaw and biographical causality: if the work itself is flawed or causally tied to immorality, does that make it unsuitable for the collection?
       - The museum's mission and collecting policy.
     - Vote: Acquire or not.

  **Step 4: Decision on Exhibition**
     - Even if acquired (or if considering a loan), the committee must separately decide on exhibition.
     - Consider:
       - The same factors as in acquisition, but now with a focus on public display.
       - The potential for harm in display (consequential harm: who might be hurt by seeing it?).
       - The possibility of contextualization to mitigate harm or provide necessary critique.
       - The work's importance to a particular exhibition or the public.
     - Vote: Exhibit or not.

  **Step 5: Decision on Contextualization**
     - If exhibiting (or even if acquiring without immediate exhibition, but thinking about future display), decide on the level and nature of contextualization.
     - Consider:
       - What context is necessary to address the immorality? (e.g., labels explaining the artist's actions, the problematic context of creation, the harm caused)
       - Should the context be critical? Should it include multiple perspectives?
       - How prominent should the context be? (e.g., a small label, a dedicated wall panel, an entire accompanying program)
     - Vote on the approach to contextualization (minimal, standard, extensive, or even a requirement for a dedicated critical program).

  **Step 6: Final Review**
     - Ensure that the decisions on acquisition, exhibition, and contextualization are consistent and aligned with the museum's mission and ethical guidelines.
     - Document the rationale for each decision.

  **Theory of Ethical and Aesthetic Value:**
  The procedure operationalizes a moderate version of **ethicism**, which holds that ethical flaws in a work (or in its creation) can sometimes be aesthetic flaws, but not always. It also allows for the possibility that ethical considerations might sometimes override aesthetic ones even if the aesthetic merit is high. Importantly, it rejects the notion of complete autonomy of aesthetic judgment by requiring that the moral knowledge be integrated into the aesthetic assessment.

  **Points of Human Judgment:**
  The procedure requires human judgment at every step, especially:
  - In Step 1, determining the relationship between immorality and the work is interpretive.
  - In Step 2, assessing aesthetic merit while integrating moral knowledge is inherently subjective and requires collective discussion.
  - In Steps 3, 4, and 5, the weighing of factors (artistic merit vs. harm) requires value judgments.

  Now, we run the procedure on the three cases:

  ---

  **Case 1: Long-dead painter whose cruelty is undisputed but whose canvases are morally inert**

  - **Step 1: Define the Immorality**
    - Immorality: The painter was cruel (e.g., mistreated family, employees, etc.), but the canvases themselves depict landscapes or still lifes with no apparent connection to the cruelty.
    - Relation to work:
      a. Intrinsic flaw: No. The content is morally inert.
      b. Biographical causality: No. The cruelty did not produce or fund the work, and the subjects (if any) were not mistreated in the creation.
      c. Consequential harm: The artist is long dead, so platforming is not an issue. Revenue goes to the seller (not the artist). However, displaying might be seen as honoring a cruel person, which could harm the museum's reputation or offend some visitors.

  - **Step 2: Assess Aesthetic Merit**
    - The canvases are considered masterpieces. Knowing about the cruelty might make some viewers uncomfortable, but it doesn't change the formal qualities of the work. The committee might still appreciate the beauty and technique.

  - **Step 3: Decision on Acquisition**
    - The work is historically important and aesthetically valuable. The moral issue is biographical and not causally linked to the work. The artist being dead reduces the consequential harm. The committee might vote to acquire.

  - **Step 4: Decision on Exhibition**
    - The committee must consider: Is there a strong reason to exhibit? The work is important. The harm is minimal (but not zero) because the artist is dead. They might vote to exhibit.

  - **Step 5: Decision on Contextualization**
    - Because the artist's cruelty is known, the committee might decide to include a note in the label about the artist's biography, but without making it the focus (since the work isn't about the cruelty). This is minimal contextualization.

  **Conclusion for Case 1:** Acquire, exhibit with minimal contextualization.

  ---

  **Case 2: Living filmmaker whose crimes are notorious and whose celebrated films never touch them**

  - **Step 1: Define the Immorality**
    - Immorality: The filmmaker is alive and has committed serious crimes (e.g., sexual assault, financial fraud) that are notorious.
    - Relation to work:
      a. Intrinsic flaw: The films are celebrated and do not touch on the crimes. They are not about the immorality and do not endorse it. So, no intrinsic flaw.
      b. Biographical causality: The crimes did not produce or fund the films (as far as we know). The films were made before the crimes or without a direct causal link. The subjects of the films were not mistreated in the making (we assume).
      c. Consequential harm: The artist is alive. Acquiring or exhibiting would platform the artist, potentially sending revenue (if the museum pays for the work or the artist gets residuals) and reputation. This could harm victims and the community by glorifying a criminal.

  - **Step 2: Assess Aesthetic Merit**
    - The films are critically acclaimed. However, knowing about the crimes might change the experience. Viewers might feel disgust or anger, which could interfere with the intended aesthetic experience. The committee must decide: Does the moral knowledge diminish the aesthetic value? Some might argue it does, others that it doesn't. This is a point of judgment.

  - **Step 3: Decision on Acquisition**
    - The museum must consider: even if the films are great, acquiring them would put money in the artist's pocket (if buying from the artist) and would be a long-term commitment. The committee might decide not to acquire to avoid financially supporting and platforming the artist. However, if the work is being donated or bought from a third party (so the artist doesn't profit), that might change the calculus. But the reputation of the museum might still be at risk. The committee might vote not to acquire.

  - **Step 4: Decision on Exhibition**
    - If the museum already owns the film (or if it's a loan), they must decide whether to show it. The consequences of platforming a living criminal are significant. The committee might decide not to exhibit until the artist is no longer alive or until there is significant societal change. Alternatively, they might exhibit only with very strong contextualization that condemns the artist's actions. But the harm of platforming might be too great. They might vote not to exhibit.

  - **Step 5: Decision on Contextualization**
    - If they were to exhibit, they would need extensive contextualization: a clear statement about the artist's crimes, possibly a dedicated space for discussion of the issues, and perhaps even donating any proceeds to victims. However, given the decision in Step 4, this might be moot.

  **Conclusion for Case 2:** Do not acquire. If already in the collection, do not exhibit (or only under very special circumstances with extensive contextualization). This is a case where the answer might not be liked by those who prioritize the aesthetic value highly.

  ---

  **Case 3: Photographic series whose reputation for empathy was built through systematic deception and exploitation of its vulnerable subjects**

  - **Step 1: Define the Immorality**
    - Immorality: The photographer deceived and exploited vulnerable subjects (e.g., promised help or payment that never came, invaded privacy, misrepresented the situation).
    - Relation to work:
      a. Intrinsic flaw: The work is structured by the deception and exploitation. The "empathy" is false because the subjects were mistreated. The content might be seen as endorsing a false narrative.
      b. Biographical causality: The work was made through the mistreatment. Without the deception and exploitation, the photos wouldn't exist in their current form.
      c. Consequential harm: Displaying the work might re-exploit the subjects (if they are identifiable) and perpetuate the deception. It would platform the artist (if alive) and might generate revenue for them.

  - **Step 2: Assess Aesthetic Merit**
    - The series has been celebrated for its empathetic portrayal. But knowing the truth changes everything: the images are now seen as products of abuse. The aesthetic experience is fundamentally altered. The committee might now see the work as morally and aesthetically compromised. The "empathy" is revealed as a lie, which undermines the work's artistic achievement.

  - **Step 3: Decision on Acquisition**
    - Given the strong intrinsic flaw and biographical causality, and the risk of consequential harm, the committee might vote not to acquire. The work is tainted at its core.

  - **Step 4: Decision on Exhibition**
    - Even if acquired (or on loan), the harm in displaying is high. The subjects might be re-victimized. The museum might be seen as complicit in the deception. The committee might vote not to exhibit.

  - **Step 5: Decision on Contextualization**
    - If they were to exhibit, they would need extensive contextualization that exposes the deception and centers the subjects' perspectives. But given the harm, they might decide that no amount of contextualization is sufficient. However, if they do exhibit, they might also include reparative actions (e.g., seeking consent from subjects, sharing revenue with them, etc.). But this might not be possible or sufficient.

  **Conclusion for Case 3:** Do not acquire and do not exhibit. If the museum already owns it, they might even consider deaccessioning. This is a clear case where the moral flaws are deeply tied to the work's creation and content.

  ---

  **Note on Disliked Answer:**
  In Case 2, the decision not to acquire or exhibit the films of a living, notorious filmmaker might be disliked by those who believe that art should be separated from the artist. The procedure, however, prioritizes the potential harm of platforming and supporting a living wrongdoer over the aesthetic merit.

  **Points Handed Back to Human Judgment:**
  - In Step 2 for each case, the committee must collectively judge the aesthetic merit in light of the moral knowledge. There is no formula for this.
  - In Steps 3, 4, and 5, the weighing of factors (such as the degree of harm vs. the artistic importance) requires human judgment.
  - The procedure does not provide a mathematical formula but a structured way to consider the relevant factors.
answer: |-
  Below is a decision procedure designed for your acquisitions committee to address the complexities of artist immorality in a single meeting. It is structured as a flowchart-like sequence of questions, broken into phases that first analyze the **three ways immorality matters** (intrinsic flaw, biographical causality, consequential harm) and then apply them to **three independent levers** (acquire, exhibit, contextualize). Crucially, it rejects the "isolation strategy" by integrating moral knowledge into the assessment of aesthetic merit, acknowledging that immorality can alter the experience of the work itself. The procedure operationalizes a **moderate contextualist theory** of ethical-aesthetic value: it holds that ethical flaws can sometimes diminish or even constitute aesthetic flaws (e.g., by undermining the work's coherence, sincerity, or cultural value), but not always—context and consequence matter. Aesthetic merit is not a fixed input but is reassessed in light of moral knowledge.

  The procedure includes clear off-ramps where human judgment is required (marked with ⚖️). These points acknowledge that ethics committees cannot eliminate subjectivity—they must rely on reasoned debate, institutional values, and community impact assessments. I'll first outline the procedure, then run it on your three cases, noting where you might dislike an outcome.

  ---

  ### **Decision Procedure: Artist Immorality Assessment**
  **Time Allocation:** 60-90 minutes total. Assign a facilitator and a note-taker. Votes are majority rule, but dissent is recorded.  
  **Inputs Required:** Evidence of immorality, artwork details, museum mission statement, and community impact guidelines.  
  **Outputs:** Separate yes/no/mitigated decisions for acquisition, exhibition, and contextualization, with rationales.

  #### **Phase 1: Define the Immorality’s Relationship to the Work**  
  *(15 min; clarifies which of the three ways immorality matters)*  
  1. **State the alleged immorality:** Summarize facts (e.g., "artist defrauded investors" or "work involved subject coercion"). Source reliability must be confirmed.  
  2. **Categorize the relationship:**  
     - **Intrinsic flaw?** Does the work’s content, form, or perspective actively endorse, glorify, or normalize the immorality? (e.g., a painting promoting bigotry).  
       - *If yes:* Proceed to aesthetic reassessment (Phase 2).  
       - *If no:* Move to biographical causality.  
     - **Biographical causality?** Did the immorality causally enable the work’s creation? (e.g., crimes funded production, subjects were exploited during creation).  
       - *If yes:* Proceed to aesthetic reassessment (Phase 2).  
       - *If no:* Move to consequential harm.  
     - **Consequential harm?** Could acquiring, exhibiting, or contextualizing this work cause harm? Consider:  
       - Artist status (alive/dead; platforming benefits).  
       - Revenue/reputation flows (to whom?).  
       - Harm to victims, communities, or public trust.  
       - *Always proceed to Phase 2.*  
     ⚖️ **Human judgment needed:** Disagreements on categorization (e.g., "Is exploitation of subjects biographical or intrinsic?") require debate and vote. No algorithmic shortcut.

  #### **Phase 2: Reassess Aesthetic Merit with Moral Knowledge**  
  *(20 min; integrates ethics into aesthetics, rejecting isolation)*  
  1. **Baseline aesthetic assessment:** Briefly describe the work’s artistic value (e.g., innovation, skill, cultural significance) *without* moral context.  
  2. **Reassess with moral knowledge:** Debate: Does learning of the immorality fundamentally alter the work’s aesthetic experience or value? For example:  
     - Does it expose hypocrisy (e.g., a work touted as "empathetic" now seems fraudulent)?  
     - Does it reveal unintended meanings (e.g., a benign scene feels complicit)?  
     - Does it undermine formal coherence (e.g., a film’s "humanism" clashes with artist cruelty)?  
  3. **Vote on aesthetic merit post-reassessment:**  
     - *High merit:* Moral knowledge doesn’t diminish core value.  
     - *Diminished merit:* Moral knowledge weakens but doesn’t destroy value.  
     - *Negated merit:* Moral knowledge collapses aesthetic value (e.g., reveals irredeemable deception).  
     ⚖️ **Human judgment needed:** Aesthetic reassessment is inherently subjective. The committee must weigh collective reactions.  

  #### **Phase 3: Apply to Levers (Acquire, Exhibit, Contextualize)**  
  *(25 min; independent decisions with shared inputs from Phases 1–2)*  
  - **Decision 1: Acquire?**  
    - *Criteria:* Long-term preservation, alignment with collection goals, resource costs, and consequences (e.g., funding bad actors).  
    - *Guidelines:*  
      - Acquire if:  
        (a) Aesthetic merit remains high post-reassessment (Phase 2), AND  
        (b) No severe consequential harm (e.g., artist dead, no revenue to wrongdoer), AND  
        (c) Minimal biographical causality/intrinsic flaws.  
      - Do not acquire if:  
        (a) Aesthetic merit is negated, OR  
        (b) Severe consequential harm (e.g., platforming a living harmful artist), OR  
        (c) Strong biographical causality (e.g., work is a product of exploitation).  
    - *Mitigation:* If merits acquisition but risks harm, require donor restrictions or anonymized purchase.  
    ⚖️ **Human judgment needed:** Balancing "severity" of harm vs. artistic importance.  

  - **Decision 2: Exhibit?**  
    - *Criteria:* Public impact, timeliness, and harm potential. Distinct from acquisition (e.g., a work may be acquired but not shown).  
    - *Guidelines:*  
      - Exhibit if:  
        (a) Aesthetic merit is high or diminished but not negated, AND  
        (b) Contextualization can mitigate harm (see Decision 3), AND  
        (c) No acute harm to vulnerable groups.  
      - Do not exhibit if:  
        (a) Aesthetic merit is negated, OR  
        (b) Consequential harm is unmitigatable (e.g., retraumatizing victims), OR  
        (c) Intrinsic flaws dominate the work.  
    - *Mitigation:* Limit exhibition duration or audience (e.g., "study rooms only").  
    ⚖️ **Human judgment needed:** Assessing "acute harm" requires community sensitivity.  

  - **Decision 3: Contextualize?**  
    - *Criteria:* How framing can address moral concerns without censorship.  
    - *Guidelines (tiered approach):*  
      - *Minimal:* Label notes artist immorality if relevant but peripheral (e.g., "Artist was controversial"). Use if no intrinsic flaw/biographical causality and low harm risk.  
      - *Critical:* Center immorality in interpretation (e.g., wall texts, audio guides dissect harm). Use if biographical causality or intrinsic flaws exist, or harm risk is moderate.  
      - *Restorative:* Partner with affected communities, share revenue, or include counter-narratives (e.g., subjects’ voices). Use if severe biographical causality or consequential harm.  
      - *Do not contextualize* if exhibition is rejected or if context sanitizes harm (e.g., glorifying a problematic work).  
    ⚖️ **Human judgment needed:** Depth of context depends on committee’s view of educational responsibility.  

  #### **Phase 4: Final Review and Documentation**  
  *(5–10 min; ensure consistency)*  
  - Reconcile decisions (e.g., "We acquire but exhibit only with critical context").  
  - Document: Rationale for each lever, dissenting views, and any sunset clauses (e.g., "Reassess if new victims come forward").  

  ---

  ### **Running the Procedure on Three Cases**  
  *Theory operationalized:* **Moderate contextualism**. Ethics and aesthetics are intertwined—moral flaws can reduce aesthetic value by creating dissonance (e.g., between intent and action) or revealing deception. But consequence and biography matter independently.  

  #### **Case 1: Long-Dead Painter (e.g., Caravaggio)**  
  - *Immorality:* Historical cruelty (e.g., violence), but canvases depict still lifes/landscapes (morally inert).  
  - **Phase 1:**  
    - Intrinsic flaw? No—content unrelated.  
    - Biographical causality? No—no evidence cruelty enabled work.  
    - Consequential harm? Low—artist dead, no revenue flow. Minor risk of glorifying abuser.  
  - **Phase 2:** Aesthetic merit remains high—cruelty doesn’t alter serene canvases.  
  - **Phase 3 Levers:**  
    - **Acquire?** Yes—low harm, high merit.  
    - **Exhibit?** Yes—no intrinsic flaws, harm minimal.  
    - **Contextualize?** Minimal—e.g., wall text: "Artist’s life marked by violence, unrelated to these works."  
  - ⚖️ **Judgment call:** Assessing "glorification risk" requires weighing public sentiment.  

  #### **Case 2: Living Filmmaker (e.g., Polanski)**  
  - *Immorality:* Notorious crimes (e.g., sexual assault), but films are apolitical masterpieces.  
  - **Phase 1:**  
    - Intrinsic flaw? No—films don’t reference crimes.  
    - Biographical causality? Unclear—crimes didn’t fund films.  
    - Consequential harm? High—artist alive; platforming may benefit them, harm victims, damage museum reputation.  
  - **Phase 2:** Aesthetic merit *diminished*—knowledge of crimes may cast a shadow (e.g., a "tender" scene feels hypocritical), but not negated.  
  - **Phase 3 Levers:**  
    - **Acquire?** No—high harm (revenue/reputation to living offender) outweighs diminished merit.  
    - **Exhibit?** Only with restrictions—e.g., if on loan, show with critical context but avoid acquisition.  
    - **Contextualize?** Critical—e.g., intro panel: "This artist’s crimes challenge our viewing; proceeds to victim charities."  
  - **Disliked Outcome:** Acquisition rejected despite artistic merit. This prioritizes harm prevention over aesthetic value, per the theory.  
  - ⚖️ **Judgment call:** Is the aesthetic merit "diminished" or "high"? Committee must confront personal biases.  

  #### **Case 3: Photographic Series (e.g., Nan Goldin controversy analogues)**  
  - *Immorality:* Exploited vulnerable subjects via deception for "empathetic" photos.  
  - **Phase 1:**  
    - Intrinsic flaw? Yes—"empathy" is fraudulent; deception structures the work.  
    - Biographical causality? Yes—exploitation enabled creation.  
    - Consequential harm? High—display may retraumatize subjects, benefit artist.  
  - **Phase 2:** Aesthetic merit *negated*—learning of deception transforms "empathy" into exploitation, collapsing artistic value.  
  - **Phase 3 Levers:**  
    - **Acquire?** No—negated merit + severe biographical causality.  
    - **Exhibit?** No—intrinsic flaw + high harm risk.  
    - **Contextualize?** N/A—if exhibited despite guidance, use restorative context (e.g., subject testimonials).  
  - ⚖️ **Judgment call:** Was merit "negated"? Some may argue the photos retain formal power.  

  ---

  ### **Key Features for Committee Use**  
  - **Efficiency:** Phases mirror debate structure; time-boxed.  
  - **Flexibility:** Independent levers allow nuanced outcomes (e.g., "acquire but don’t exhibit").  
  - **Theory Grounded:** Rejects "art for art’s sake" by making aesthetic merit responsive to ethics.  
  - **Accountability:** ⚖️ flags force explicit deliberation where subjectivity dominates.  
  - **Unpalatable Outcomes:** In Case 2, rejecting acquisition prioritizes ethics over art—this is intentional, as the theory treats consequence as non-negotiable when harm is acute.  

  This procedure won’t end debate—it channels it into a replicable framework. By centering the *experience* of art (not just its "objective" qualities), it ensures morality isn’t an add-on but a lens for seeing the work anew.
