answer: |-
  Below is a specification for decision theories tailored to your requirements, structured as requested. I refine the requirements, add missing ones, classify them, analyze tensions, and score major theories. The goal is a theory usable by a single agent over a lifetime in environments with predictors, other agents, and ordinary risks.

  ---

  ### **Requirements Specification**

  1. **Visible Dominance**  
     *Requirement*: At the moment of choice, if one action yields a strictly better outcome than all others in every world-state compatible with the agent’s current knowledge, the theory must select that action.  
     *Case*: A patient learns their cancer is 100% hormone-sensitive, making hormone therapy strictly better than chemo in all possible scenarios. Ignoring this violates rationality.  
     *Status*: **Non-negotiable**. Violating this destroys real-world usability (e.g., medical or financial decisions).  

  2. **Collecting Wins Banked in Advance**  
     *Requirement*: When rewards/punishments were pre-committed by others based on predictions of the agent’s *policy* (not outcome), the theory must execute the action that was favorably predicted.  
     *Case*: Newcomb’s Problem (opaque box): The predictor fills the $1M box iff it foresees one-boxing. Taking one box collects the pre-committed reward. Similarly, paying a pre-settled mugging debt if the coin landed against you.  
     *Status*: **Non-negotiable for goal-alignment**. Failing here sacrifices value from acausal agreements (e.g., commitments, predictions, or contracts).  

  3. **Parity of Prediction, Duplication, and Policy Choice**  
     *Requirement*: The theory must give identical advice against a predictor simulating the agent, a duplicate agent, or the agent’s past self committing to a policy. The distinction is epistemically inaccessible during decision-making.  
     *Case*: Prisoner’s Dilemma against a perfect clone vs. a perfect predictor simulating you. Cooperating in both (or defecting in both) is required; differing advice exploits ontologically unverifiable differences.  
     *Status*: **Non-negotiable for self-consistency**. Permitting differences introduces arbitrariness and self-sabotage in symmetric dilemmas.  

  4. **No Actionable Regret**  
     *Requirement*: At no choice point may the theory recommend an action dominated by another *at that moment*, given current knowledge. The agent must never see a strictly better alternative.  
     *Case*: Transparent Newcomb: The agent sees $1M in the box before choosing. Two-boxing yields $1,000 + $1M > one-boxing’s $1M. Recommending one-boxing violates dominance.  
     *Status*: **Non-negotiable**. Violations create immediate, undeniable losses.  

  5. **Cross-Time Coherence**  
     *Requirement*: The theory’s lifetime sequence of actions must be dynamically consistent or explicitly stage-dependent, such that the agent would endorse the plan in advance (e.g., via pre-commitment or consistent preferences).  
     *Case*: A smoker who pre-commits to quitting must not later rationalize relapse unless new information justifies it. The theory must explain how stages relate.  
     *Status*: **Preference (implementation-specific)**. Strict consistency is ideal, but some theories (e.g., UDT) allow stage-indexed policies without contradiction.  

  6. **Self-Applicability**  
     *Requirement*: The agent must be able to compute its own decisions using the same reasoning a predictor would use. The theory cannot rely on black-box oracles.  
     *Case*: A predictor simulating the agent to fill Newcomb’s box must use a process the agent can replicate to decide. If the agent cannot derive its output, it cannot deliberate.  
     *Status*: **Non-negotiable for deliberation**. A theory that can’t be self-applied reduces to dogma.  

  7. **Counterfactual Robustness** *(Added)*  
     *Requirement*: The theory must specify how actions influence predictions and outcomes in counterfactuals where the agent acts differently, without ad hoc assumptions.  
     *Case*: In a Prisoner’s Dilemma against a clone, defecting because "the clone would defect if I do" must not rely on unsupported counterfactual causation.  
     *Status*: **Non-negotiable for coherence**. Missing this creates contradictions (e.g., if both agents defect "because the other would").  

  ---

  ### **Tension Analysis: The Incompatible Subset**
  **Requirements 1 (Visible Dominance), 2 (Collecting Wins), 3 (Parity), and 4 (No Actionable Regret) are jointly unsatisfiable.**  
  - **Conflict Source**: Transparent Newcomb’s Problem.  
    - Requirement 2 (Collecting Wins) + 3 (Parity) demand one-boxing in *opaque* Newcomb to collect the $1M reward.  
    - Requirement 4 (No Actionable Regret) + 1 (Visible Dominance) demand two-boxing in *transparent* Newcomb (since the $1M is visible and taking both yields strictly more).  
    - But Requirement 3 (Parity) insists the *same* action must be taken against predictors and duplicates, regardless of transparency. Thus, one theory cannot satisfy both one-boxing (for opaque) and two-boxing (for transparent) under Parity.  

  **Resolution Trade-off**:  
  - Keep **Requirement 1 (Visible Dominance)** and **4 (No Actionable Regret)**.  
  - *Why*: Violating these causes immediate, undeniable losses in everyday choices (e.g., refusing free money in transparent Newcomb). Sacrificing Requirements 2/3 forfeits pre-committed rewards but avoids direct dominance violations.  
  - Consequence: This forces rejection of strict policy-parity (Requirement 3) and may lose "banked wins" (Requirement 2) in asymmetric cases.  

  ---

  ### **Theory Scorecard**  
  | **Theory**         | **1 (Dom.)** | **2 (Wins)** | **3 (Parity)** | **4 (Regret)** | **5 (Coher.)** | **6 (Self-App.)** | **7 (Ctrf.)** |  
  |--------------------|--------------|--------------|----------------|----------------|----------------|-------------------|---------------|  
  | **Causal (CDT)**   | ✓            | ✗            | ✗              | ✓              | ✓              | ✓                 | Partial¹      |  
  | **Evidential (EDT)**| ✗²           | ✓            | ✓³             | ✗⁴             | ~              | ✓                 | ✗             |  
  | **Updateless (UDT)**| ✓⁵           | ✓            | ✓              | ✓⁶             | ~⁷             | ✗⁸                | ✓             |  

  **Footnotes**:  
  1. CDT handles simple counterfactuals but fails in predictor-rich games (e.g., defecting in PD with clones).  
  2. EDT fails Visible Dominance in transparent Newcomb (one-boxes despite seeing the money).  
  3. EDT satisfies Parity by treating clones/predictors identically via correlation.  
  4. EDT violates No Actionable Regret in transparent Newcomb.  
  5. UDT satisfies dominance *if* the policy is chosen updatelessly, but may ignore post-policy information.  
  6. UDT avoids regret by treating "moments of choice" as part of a pre-committed policy.  
  7. UDT’s cross-time coherence is policy-based but may conflict with dynamic updates.  
  8. UDT often relies on uncomputable logical proofs, violating Self-Applicability in practice.  

  **Most Exclusionary Requirement**: **Requirement 7 (Counterfactual Robustness)**.  
  - *Why*: CDT/EDT fail to robustly handle counterfactuals involving predictors or duplicates (e.g., CDT defects against cooperative clones; EDT conflates correlation with counterfactual influence). UDT handles this but at the cost of computability (violating Self-Applicability).  

  ---

  ### **Recommendation**  
  For a single agent over a lifetime, **updateless-flavored theories (e.g., FDT⁹) come closest** by satisfying 1,2,3,4,7 partially, but struggle with Self-Applicability (Requirement 6) and Cross-Time Coherence (Requirement 5). If computational realism is prioritized, a hybrid (e.g., **TDCE⁰**) may be needed, sacrificing strict Parity (Requirement 3) in transparent cases to preserve Visible Dominance.  

  *Footnotes*:  
  ⁹ Functional Decision Theory (FDT): Treats decisions as outputs of a function across all possible worlds.  
  ⁰ "Timeless Decision with Conditional Execution": Uses pre-commitments but allows overrides for dominance.  

  This specification clarifies that no theory satisfies all requirements perfectly, but Visible Dominance and No Actionable Regret are untouchable for deployable agents.
