answer: |-
  My sharpest answer to the poisoner is this: You fundamentally misconstrue my conception of law's internal morality by comparing it to a poisoner's efficacy, for law is not a technique for achieving *any* arbitrary end but a distinctive enterprise of creating and maintaining a certain kind of social order through rules. My eight desiderata constitute a morality precisely because they are essential to the *specific* purpose that defines the enterprise of law itself: subjecting human conduct to the governance of rules in a way that respects human agency by making possible genuine adherence and reasoned interaction. A poisoner's "principles" serve only his isolated, destructive purpose; legality's principles structure a reciprocal relationship between ruler and ruled essential to law's existence. The tyranny you describe *is* a legal system by my criteria, as it satisfies the formal requirements necessary for a system of rules to function *as law* – it achieves the minimal conditions for governance through rules. However, its evil purpose creates a profound tension within the enterprise: scrupulous adherence to the internal morality *forces* the regime to publicly, clearly, prospectively, and consistently articulate and enact its evil, stripping away the veil of caprice or false justification. This publicity and predictability, demanded by legality itself, generates moral reasons: it empowers the subjugated caste to understand their oppression *as a deliberate, sustained policy* and provides the stable framework necessary for organized resistance, while imposing on officials the moral burden of consciously, repeatedly enacting injustice under the banner of law, thereby undermining claims of ignorance or mere following orders. The internal morality doesn't sanctify the evil purpose, but it structures the interaction morally, denying the regime the refuge of arbitrariness and forcing the moral conflict into the open.
