prompt: |-
  My friend and I got into a two-hour argument the other night about fundamentality and grounding that I'm still annoyed about. At some point he decided to just summarize the whole grounding literature for me like this: "Grounding is basically the metaphysical version of causation. What grounds a thing is whatever produced or made it, and what's fundamental is just whatever came first — so physics is fundamental because everything traces back causally to the earliest physical stuff. And since grounding is just causation with the serial numbers filed off, the whole debate about whether grounding is some special primitive relation of dependence is philosophers creating work for themselves." He's read way more philosophy than me so he kind of steamrolled, and the best I could come up with on the spot was mumbling something about how the set of my fingers isn't "caused by" the fingers, but I couldn't turn that into anything.

  Can you go through his summary piece by piece and tell me what a metaphysician would actually accept, where it's subtly off, and whether his conclusion — that the primitive-grounding debate is pointless — follows even from the parts he gets right? I'm specifically confused about whether there are things that ground without causing, or cause without grounding, and whether "fundamental" means anything other than "earliest in the chain." And don't just tell me he's wrong, tell me what I should've said at 1am to shut it down.
