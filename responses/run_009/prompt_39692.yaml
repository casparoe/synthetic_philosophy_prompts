             Now the student with label "X7B" knows they have Venus. They can then go to the public list and know they are Venus. But how do they find their partner? The partner is the group B student who has the label for Venus. But the group B students don't know which concept their label refers to. So the group B student with the label for Venus doesn't know it's them. So the group A student can say: "I am Venus, who has the label for Venus in group B?" but no one in group B knows if they have Venus.

          Informative announcement: "The group A label 'X7B' and the group B label 'J9F' refer to the same concept."
             Now the student with "X7B" and the student with "J9F" know that they are partners.

       Then we see that the trivial announcement doesn't help them find their partner, but the informative announcement does.

       Then we can run:

          Phase 1: Assign labels and explain the public list of concepts. (5 minutes)
          Phase 2: Give them time to try to find their partner. (10 minutes) -> They will fail.
          Phase 3: The facilitator makes an announcement. 
                    In one scenario (run in different sections or as a within-game condition): 
                       Condition 1: For one pair, announce a trivial fact: "For the concept Venus, the group A label is 'X7B'." 
                       Condition 2: For another pair, announce: "The group A label 'X7B' and the group B label 'J9F' are for the same concept."
          Phase 4: Give them more time to find their partner. (10 minutes)
                    In condition 1, the group A student with 'X7B' knows they are Venus, but cannot find the group B partner because no group B student knows they are Venus.
                    In condition 2, the two students find each other.

       We can do condition 1 for one pair and condition 2 for another pair in the same game. Then we compare.

       But we have 7 pairs. We can announce one trivial and one informative, and see which pairs succeed.

     This seems promising.

     Let's design the run-sheet accordingly.

     Materials:
       - 7 concept cards for the public list (with properties)
       - 7 group A labels (random strings)
       - 7 group B labels (random strings)
       - A hidden mapping from concepts to (A label, B label)

     Game rules:

       - The class is split into group A (7 students) and group B (7 students).
       - Each student in group A gets a card with a label (e.g., "X7B")
       - Each student in group B gets a card with a label (e.g., "J9F")
       - Publicly displayed: a list of 7 concepts with properties. The concepts are named Concept1 to Concept7 to avoid real-world knowledge.

       Goal: The students must find their partner (one from A and one from B) such that their labels refer to the same concept.

       How: They can ask any student about their label, but they cannot ask about the concept because no one knows the mapping.

       Phase 1: They try to find their partner. They will be unable to because they have no way to link labels to concepts.

       Phase 2: Facilitator makes two announcements (one trivial, one informative) for two different concepts.

          Example for trivial: "For Concept1, the group A label is 'X7B'."
          Example for informative: "The group A label 'Y8C' and the group B label 'K2G' refer to the same concept."

       Phase 3: They try again. We expect that for the informative announcement, the two students will find each other. For the trivial announcement, the group A student with 'X7B' now knows they are Concept1, but they cannot find their group B partner because no group B student knows they are Concept1. So that pair fails.

     Then we debrief.

     However, in the trivial announcement, the group A student knows they are Concept1. They can then go to a group B student and say: "I am Concept1, so you are my partner if you are the group B student for Concept1." But the group B student doesn't know if they are Concept1. So they might ask: "How do I know if I am Concept1?" They have no way. So the pair cannot match.

     This shows that the trivial announcement (which is like "a=a") doesn't help coordination, while the informative announcement ("a=b") does.

     Now, the run-sheet:

       Phase 1: Setup (5 minutes)
          - Facilitator splits the class into group A and group B.
          - Distributes labels to each student.
          - Explains the public list of concepts (7 concepts, each with properties).
          - Explains the goal: Find your partner (the one from the other group who has a label for the same concept). You win if you find your partner.

       Phase 2: Initial matching attempt (10 minutes)
          - Students are allowed to mill around and talk to each other.
          - What they can do: Exchange their labels, but they don't know which concept either label refers to.
          - Facilitator observes.

       Phase 3: Announcement (5 minutes)
          - Facilitator makes two announcements (write them on the board or say them aloud):
               Announcement 1 (trivial): "For Concept1, the group A label is [X7B]."   [where X7B is the actual label of the Concept1 in group A]
               Announcement 2 (informative): "The group A label [Y8C] and the group B label [K2G] refer to the same concept."   [for a different concept, say Concept2]

       Phase 4: Second matching attempt (10 minutes)
          - Students try again to find their partners.

       Phase 5: Reveal and scoring (5 minutes)
          - Facilitament.
          - We see if the pair for Concept2 (informative) found each other.
          - We see if the pair for Concept1 (trivial) found each other.
          - Likely, only the informative pair found each other.

       Phase 6: Debrief (40 minutes)  [note: total 75 minutes, so 5+10+5+10+5+40=75]

          - Discuss why the informative announcement helped but the trivial one did not.
          - Map to Frege: 
               - The concepts are the referents (the objects).
               - The labels are the senses or the modes of presentation.
               - The identity in the informative announcement linked two different senses (labels) to the same referent (concept), and that was informative and allowed coordination.
               - The trivial announcement only repeated the same sense and referent, so it didn't provide new information for coordination across groups.

          - The puzzle: Why is "a=a" trivial and "a=b" informative, even though they are both true and about the same object? 
               - Because the senses (or the ways the object is given) are different.

          - Honest note: The game shows missing information (the mapping between the two labeling systems) and how an identity statement can provide that information. But Frege's puzzle is not just about information, it's about cognitive significance: how can two true identity statements differ in their informativeness if they are about the same object? The game illustrates that the difference lies in the way the object is referred to (the labels). However, in a game, we are always dealing with information, but Frege's point is more about the level of sense. The game doesn't necessarily show that senses are distinct from references in the mind; it shows that without knowing the co-reference, coordination is impossible. This is a practical illustration of the cognitive difference.

          - What the game can't reproduce: In the game, the reason the trivial announcement doesn't help is because it doesn't help across groups. But in Frege's puzzle, even within one person's knowledge, "a=a" and "a=b" can have different cognitive effects. The game is about distributed knowledge between groups, which is a bit different. However, the core idea of modes of presentation is captured.

     Predictably go wrong:

          - Students might not understand the goal initially.
          - During the initial matching phase, students might try to guess the concept based on the properties and the label string? But the string is random, so that won't work.
          - In the trivial announcement, the group A student might try to find a group B student who will admit to being Concept1? But since no group B student knows they are Concept1, it's impossible.
          - The informative pair might not find each other because they are shy or because the room is loud.
          - The public list of concepts might have properties that allow students to guess the mapping? We have to make sure the properties are not indicative of the labels.

     Materials example for 2 concepts (to save time, we can do fewer but with 14 students, we need 7):

          Concept1: 
            - Property1: This is the only planet with intelligent life.
            - Property2: It has a red surface.
            - Property3: It is the fourth planet from the sun.

          Concept2:
            - Property1: This is the hottest planet.
            - Property2: It is the second planet from the sun.
            - Property3: It is often called Earth's sister planet.

          But then if a student knows astronomy, they might guess that Concept1 is Mars and Concept2 is Venus. But the labels are random, so it won't help in matching across groups.

          Alternatively, use fake properties to avoid prior knowledge.

     Now, run-sheet table:

     | Phase (name + minutes)        | What participants do                                                                 | What the facilitator does                                                                                                 | Which bit of the puzzle this phase is aiming at                                                                 |
     |-------------------------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
     | Setup (5 min)                 | Students are split into Group A and Group B. Each receives a label card.            | Split class, distribute cards, display public list of concepts, explain goal (find partner with label for same concept). | Setup, not aimed at the puzzle.                                                                                |
     | Initial matching (10 min)     | Mingle and try to find partner by sharing label strings; attempt to match.          | Observe, answer clarifying questions.                                                                                   | Shows that without co-reference information, coordination is impossible.                                        |
     | Announcement (5 min)          | Listen and note the announcements.                                                  | Make two announcements: (1) trivial (e.g., "For Concept1, the Group A label is X7B"), (2) informative (e.g., "Group A label Y8C and Group B label K2G are for the same concept"). | Introduces the two types of identity statements.                                                               |
     | Second matching (10 min)      | Use the announcements to try again to find partners.                                | Observe.                                                                                                                | Tests whether the informative announcement enabled coordination but the trivial did not.                       |
     | Reveal and scoring (5 min)    | Learn if they found their partner; see which pairs succeeded.                       | Check pairs: for the concept with the trivial announcement, see if the Group A student found the Group B student (likely not). For the informative, they should have. | Highlights the difference in outcome.                                                                          |
     | Debrief (40 min)              | Discuss why the informative announcement worked and the trivial didn't. Map to Frege. | Guide discussion: Why was the second announcement informative? What does it tell us about language and reference?       | Maps the experience to Frege's puzzle: the difference between "a=a" and "a=b" in terms of senses and reference. |

     Honest note: The game illustrates how a statement of identity between two different labels (modes of presentation) can provide new information that enables coordination. However, Frege's puzzle is about the cognitive significance of such statements to an individual. The game shows a distributed knowledge scenario, which is a practical analog but not exactly the same as an individual's epistemic state. In particular, the game cannot reproduce the intra-personal aspect of the puzzle, where the same individual might learn something new from "a=b" but not from "a=a", because in the game the lack of coordination is due to the lack of shared knowledge between agents. Nevertheless, the game captures the core idea that the mode of presentation matters for information and coordination.
