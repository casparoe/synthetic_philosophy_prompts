  ### Game Design: The Identity Coordination Challenge  
  **Premise:** Students encounter Frege's identity puzzle through a game where coordinating actions requires understanding that two labels refer to the same object. The trivial identity statement ("a = a") provides no new information, while the informative one ("a = b") enables coordination—despite the underlying identity being fixed all along.  

  **Materials:**  
  - 14 cards (7 pairs) with two labels per object:  
    - **Public Label** (e.g., "Apple," "Comet," "Dragon"): Visible to the holder.  
    - **Hidden Label** (e.g., "X7B," "K9L," "P4R"): Sealed in an envelope attached to the card.  
  - A public list of 7 "mystery objects" with ambiguous properties (e.g., *Object 1: "Found in myths, hoards treasure, breathes fire"*).  
  - Prize tokens (e.g., candy, extra credit points) for successful pairs.  

  **Rules:**  
  - Students split into **Group A** (7 students) and **Group B** (7 students).  
  - Goal: Pair with the student whose card refers to the *same object* as yours.  
  - **Catch:** No one knows which public/hidden labels match which object. Coordination requires aligning labels via announcements.  
  - **Payoff:** Pairs win tokens if both correctly identify each other *and* their shared object after announcements.  

  ---

  ### Run-Sheet Table  

  | Phase (Minutes)         | What Participants Do                                                                 | What the Facilitator Does                                                                                                                               | Which Bit of Frege's Puzzle This Targets                                                                                        |  
  |-------------------------|--------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------|  
  | **Setup (5 min)**       | Split into Group A/B. Receive a card (public label visible; hidden label sealed). Read the public object list. | Assign cards randomly. Explain goal: "Find your partner from the other group. You share the same mystery object. Win tokens if you both succeed."        | *Setup only. No puzzle element yet.*                                                                                            |  
  | **Initial Coordination (15 min)** | Mingle, share public labels, and guess partners. *Cannot open hidden labels yet.* Record guesses on paper. | Observe. Answer procedural questions. **Do not clarify object identities.**                                                                         | Illustrates *pre-announcement ignorance*: Labels alone don’t reveal co-reference ("a" and "b" seem unrelated).                 |  
  | **Trivial Announcement (5 min)** | Hear: "The label **'Apple'** refers to the object labeled **'Apple'.**" Try to update partner guesses. | Announce the trivial statement. Emphasize: "This is all you get for now." Keep hidden labels sealed.                                                    | Tests the *uninformative nature of "a = a"*: No new information → no progress in coordination.                                  |  
  | **Informative Announcement (5 min)** | Hear: "The label **'Apple'** (Group A) and **'X7B'** (Group B) refer to the same object." Update guesses. | Announce the informative statement. Unseal **only hidden labels** for Group B ("X7B" holders see theirs). Group A sees only public labels ("Apple"). | Tests the *value of "a = b"*: New co-reference knowledge enables coordination across labeling systems.                         |  
  | **Final Coordination (10 min)** | Find partners using announcements. Write down: (1) Partner’s name, (2) Shared object. Submit for tokens. | Validate pairs: Correct pairs win tokens. Incorrect pairs lose. Reveal true object-labels mapping afterward.                                        | Shows the *practical payoff*: Truth alone (fixed identities) didn’t help; the *mode of presentation* ("a = b") did the work.    |  
  | **Debrief (35 min)**     | Discuss: Why did the second announcement work? Why didn’t truth alone suffice? Map to Frege. | Guide discussion: <br> 1. "Why couldn’t you coordinate after 'a = a'?" <br> 2. "What changed with 'a = b'?" <br> 3. "The objects didn’t change—so what did?" <br> 4. Introduce Frege: **Sense** (mode of presentation) vs. **Reference** (object). | Links to Frege’s core puzzle: *Cognitive significance* (why "a = b" informs despite fixed reference) stems from differing senses. |  

  ---

  ### Predictable Challenges & Mitigation  
  1. **Confusion during initial coordination:** Students may fixate on object properties instead of labels.  
     - *Mitigation:* Stress: "You can’t use properties to match—only labels."  
  2. **Trivial announcement feels pointless:** Students may dismiss it as "obvious" and not try to coordinate.  
     - *Mitigation:* Require written guesses pre/post announcement to force engagement.  
  3. **Over-attributing success to labels:** Students might think hidden labels were "special" rather than the *linkage*.  
     - *Mitigation:* In debrief, clarify: "The hidden label had no inherent power—the *statement connecting it* did."  
  4. **Time pressure:** Final coordination may run short.  
     - *Mitigation:* Use countdown timers; let Groups A/B huddle separately for 3 minutes first.  

  ---

  ### Honest Note: What the Game Can’t Replicate  
  **The Limitation:** This game isolates *informational gap-solving* (lack of access to co-reference facts) but does not fully replicate Frege’s puzzle. Frege’s concern was **cognitive significance**: Why does "a = b" *feel* informative while "a = a" feels trivial, even when the referent is identical? The game shows how missing information enables coordination, but Frege’s puzzle is about how two truths with identical truth-conditions can differ in *epistemic value*.  

  **Why?**  
  - In the game, "a = b" resolves ignorance about a *contingent* fact (a hidden label).  
  - For Frege, the puzzle persists even if both senses are known (e.g., knowing "Hesperus" and "Phosphorus" as concepts doesn’t automatically reveal co-reference).  
  - **Crucial difference:** The game’s "win condition" relies on *discovering external information*. Frege’s puzzle is about *internal cognitive states*—how a rational agent can know all referents/senses yet still gain insight from "a = b."  

  **Conclusion:** Use the game to **motivate** the puzzle (showing that reference alone doesn’t explain informativeness) but clarify in debrief that Frege’s deeper point is about *sense* as a cognitive, not just informational, phenomenon.  

  ---
  ### Debrief Script Snippet  
  > "In the game, the *truth* that Apple = X7B was fixed all along—just like Venus was always Hesperus. But you needed the announcement to *coordinate*. Frege asks: If truth is just about reference, why does stating ‘Hesperus = Phosphorus’ teach us something new? Because language isn’t just about objects; it’s about *how we access them*. The ‘how’ is the *sense*—and it’s why philosophy of language can’t just be about truth."
