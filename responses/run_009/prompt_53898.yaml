answer: |-
  ## Joint Statement on the Ash'arite-Avicennian Dispute Regarding Natural Causation  
  **Authored by the Occasionalist & Necessitarian Collaborators**  
  *For Seminar: Causation in Medieval Philosophy*

  ### 1. Agreed Claims
  We agree on the following foundational points:

  1.  **Observed Regularity:** Our experience universally attests to the constant conjunction of specific event-types (e.g., contact between dry cotton and flame) with subsequent event-types (e.g., the burning of the cotton), in the absence of recognized impediments.
  2.  **Divine Sustenance & Primary Causality:** Both positions affirm that God is the ultimate Creator and Sustainer of all existence. Every event, state, or action within creation ultimately depends moment-by-moment on the divine will and power for its existence and occurrence. God is the primary cause (*causa prima*).
  3.  **Non-Regularity-Theoretic Core:** Neither position reduces the regularity described in (1) *merely* to the observed constant conjunction itself. Both seek a deeper metaphysical explanation for *why* this conjunction holds.
  4.  **Empirical Underdetermination:** Both positions concede that the observed constant conjunction (1) is compatible with either metaphysical account of causation. Experience alone, confined to the observed regularities of the actual world, cannot definitively prove or disprove either the occasionalist or the necessitarian thesis regarding the underlying causal structure.
  5.  **The Reality of Secondary Events:** Both positions affirm that the burning of the cotton is a real event occurring within creation. The dispute concerns *how* this event comes to be conjoined with the contact with fire, not its reality.
  6.  **The Role of "Natures":** Both positions employ the concept of "natures" (e.g., the nature of fire, the nature of cotton). The dispute concerns the metaphysical *significance* and *causal efficacy* attributed to these natures.
  7.  **The Possibility of Miracles:** Both positions affirm the metaphysical possibility of miracles, understood as events diverging from the observed regular course of nature, directly willed by God. The dispute concerns the *implications* of miracles for the nature of the regular sequence itself.

  ### 2. Disagreements
  Our fundamental disagreements, phrased in terms acceptable to each respective position, concern the following:

  1.  **The Truth of "The fire burned the cotton":**
      *   *Occasionalist Position:* The sentence "the fire burned the cotton" is not literally true. Fire possesses no inherent power to produce burning. Such statements are "true" only in a loose or customary sense (*bi'l-ma'jāz*, *'urfī*), signifying the observed constant conjunction and God's customary action, not a true efficient causal relation between the fire and the burning.
      *   *Necessitarian Position:* The sentence "the fire burned the cotton" is literally true. Fire, by its inherent nature (*ṭabīʿa*), possesses a specific active power (*quwwa*), and cotton, by its inherent nature, possesses a specific passive power. When conjoined appropriately without impediment, the fire *is* the efficient cause (*ʿilla fāʿila*) of the burning; its nature necessitates the manifestation of its effect.

  2.  **The Meaning of "Necessitation" and the Efficacy of Natures:**
      *   *Occasionalist Position:* "Necessity" (*wujūb*) applies only to what is absolutely necessary by its essence (i.e., God) or logically/metaphysically necessary in all possible worlds. The natures of created things do not inherently possess causal powers. The observed constant conjunction arises solely from God's free, contingent, and consistent will (*irāda*) to create the effect (burning) upon the occasion (*munāsaba*) of the antecedent condition (contact). The "necessity" of the sequence is merely descriptive of God's unwavering custom (*ʿāda*), not inherent in the creatures.
      *   *Necessitarian Position:* "Necessitation" (*ījāb*) here signifies a real, inherent, and metaphysically grounded efficient causal power (*quwwa mu'aththira*) within the nature (*ṭabīʿa*) of the cause. Given the existence of the cause (fire), the relevant patient (dry cotton), contact, and the absence of impediments, the effect (burning) follows *by necessity* from the natures involved. This necessity is conditional (*wujūb bi'l-sharṭ*) upon the full set of antecedent conditions being met, but it is a real feature of the created order sustained by God. God establishes these natures with their inherent causal powers.

  3.  **The Contingency of the Regularity:**
      *   *Occasionalist Position:* The constant conjunction observed in nature is radically contingent (*mumkin bi'l-ḍarūra*). It depends entirely on God's free choice to maintain a consistent custom (*ʿāda*). God could, at any moment and without intrinsic contradiction or change in the natures of things, will a different effect upon the same occasion (e.g., no burning upon contact). The regularity has no grounding in the intrinsic properties of creatures.
      *   *Necessitarian Position:* The regularity observed in nature is grounded in the necessary causal powers inherent in the natures (*ṭabāʾiʿ*) of things, established by God. While God could suspend these natures or miraculously intervene to prevent the effect, the regularity itself is not contingent in the sense that the connection *given the natures* is necessary. The specific sequence (contact -> burning) is metaphysically necessary *conditional* on God creating fire and cotton with these specific natures and the conditions being met. God's freedom lies in establishing the natures, not in arbitrarily conjoining events absent those natures.

  4.  **The Nature of a Miracle:**
      *   *Occasionalist Position:* A miracle (e.g., Abraham in the fire) is simply an instance where God chooses *not* to follow His customary practice. God directly creates the effect (safety) upon the occasion of contact with fire, just as He usually creates burning. No inherent causal power of fire is overridden because no such power exists. The miracle highlights the radical contingency of the customary sequence.
      *   *Necessitarian Position:* A miracle involves God's direct, supernatural intervention to suspend or counteract the inherent causal power (*quwwa*) emanating from the nature (*ṭabīʿa*) of the created cause. God prevents the effect (burning) that would otherwise necessarily follow from the natures and conditions present. The miracle presupposes the inherent causal power that is being overridden.

  **Regarding Terminology:** We acknowledge that part of our disagreement over the word "cause" (*sabab*, *ʿilla*) is potentially verbal. The occasionalist restricts "true cause" (*al-sabab al-ḥaqīqī*) to God alone, while the necessitarian grants the status of secondary efficient cause (*ʿilla fāʿila thānawiyya*) to creatures like fire. However, the substantive disagreement survives terminological regimentation: **The core dispute is whether the observed constant conjunction between events (e.g., contact and burning) is best explained by (a) inherent, metaphysically grounded causal powers within the natures of the secondary things themselves (Necessitarian), or (b) the direct, consistent, but contingent creative action of God alone upon the occasion of the antecedent event, with creatures possessing no such inherent powers (Occasionalist).**

  ### 3. Cruxes: Predictions and Arguments
  We jointly consider the following thought experiments to clarify the locus of disagreement:

  1.  **The Repeated World:**
      *   *Scenario:* God creates Situation A: dry cotton touching flame, no impediments. The cotton burns. God then annihilates the entire universe. Subsequently, God creates Situation B: an intrinsically identical situation (same arrangement of matter, same natures, same "laws," no impediments).
      *   *Occasionalist Prediction & Reasoning:* The burning in Situation A does not constrain God's action regarding Situation B. While God's *custom* makes burning in Situation B highly *expected*, God remains absolutely free to create either burning or non-burning upon the occasion of contact in Situation B. The identity of the situation does not necessitate the outcome; only God's free choice does. The guarantee of repetition stems solely from divine consistency, not creature natures.
      *   *Necessitarian Prediction & Reasoning:* Burning *must* occur in Situation B. The necessary causal connection flows from the inherent natures (*ṭabāʾiʿ*) of fire and cotton, present in both situations. Identical natures and identical conditions metaphysically necessitate identical effects. God sustains the natures in being, thus sustaining their necessary causal powers.
      *   *Argument Bearing on Crux:* Both sides agree empirical observation is irrelevant here (the scenario is non-empirical). The Occasionalist appeals to divine freedom and the lack of inherent constraint in creatures. The Necessitarian appeals to the principle that identical causes (in terms of natures and conditions) in identical circumstances necessitate identical effects. **No argument exists that both parties would accept as probative.** The Occasionalist denies the Necessitarian's core premise about inherent natures, while the Necessitarian sees the Occasionalist's appeal to divine freedom as compatible only with the *possibility* of difference, not the *impossibility* of necessity. This crux reveals a fundamental divergence in metaphysical principles.

  2.  **The Patchwork World:**
      *   *Scenario:* A world intrinsically identical to ours in terms of the natures of things and the fundamental "laws," except that, extremely rarely (e.g., once every few trillion instances), when dry cotton contacts flame with no impediments, *no burning occurs* (and no other divine intervention or change is posited beyond this divergence in outcomes).
      *   *Occasionalist Prediction & Reasoning:* This world is metaphysically possible (*mumkin*). It is conceivable because the regularity in our world is not grounded in necessary natures but in God's contingent custom. God could choose such a pattern of action. If granted by the Necessitarian, this would demonstrate that the observed regularity is not metaphysically necessary.
      *   *Necessitarian Prediction & Reasoning:* This world is metaphysically impossible (*mumtaniʿ*). If the natures of fire and cotton are identical to ours, and the conditions are identical, then the burning *must* occur every time. A world where burning fails to occur under these conditions, without miraculous intervention or a change in natures/laws, is intrinsically contradictory. If granted by the Occasionalist, it would only show God *could* miraculously intervene each time, not that the natures lack inherent power.
      *   *Argument Bearing on Crux:* Both sides agree empirical observation is insufficient (we couldn't observe trillions of instances). The disagreement hinges entirely on the metaphysical possibility of the scenario, which depends on their core theses about natures and necessity. The Occasionalist argues conceivability implies possibility given divine freedom. The Necessitarian argues the scenario violates the principle of sufficient reason or entails a contradiction given the posited natures. **No argument exists that both parties would accept as probative.** The assessment of possibility is derivative of the core disagreement, not independent evidence for it.

  3.  **The Nature of the Miracle:**
      *   *Scenario:* Abraham is thrown into the fire but remains unharmed (Qur'an 21:69). Both parties agree this is a miracle.
      *   *Occasionalist Explanation:* The fire retained its observable properties (heat, light), but possessed no inherent causal power to burn. God simply chose, on this occasion, to create the effect of safety upon the occasion of contact with Abraham, rather than the effect of burning. The fire's nature wasn't overridden; it never had the power to necessitate burning. The miracle reveals the true, contingent nature of all sequences.
      *   *Necessitarian Explanation:* The fire retained its inherent nature (*ṭabīʿa*) and thus its inherent active power (*quwwa*) to burn. For Abraham to remain unharmed, God must have supernaturally intervened to suspend or counteract this inherent power – either by creating a protective effect in Abraham that negated the fire's power, or by directly preventing the burning effect despite the presence of the cause. The miracle presupposes and demonstrates the existence of the inherent power that is suspended.
      *   *Argument Bearing on Crux:* Both sides can explain the *occurrence* of the miracle. The Occasionalist argues their view provides a simpler explanation: no powers exist to override. The Necessitarian argues that the observable properties of the fire persisting *and* the specific negation of its typical effect point towards an inherent power being blocked. **No argument exists that both parties would accept as probative.** The Occasionalist sees the Necessitarian's "inherent power" as explanatorily redundant, while the Necessitarian sees the Occasionalist's account as failing to explain the *specific* failure of the expected effect linked to the fire's observable properties. Interpretation of the miracle remains contingent on the prior metaphysical commitment.

  ### 4. Conclusion: The Locus of Disagreement
  We concur that the significant portion of our dispute over the *application* of the term "cause" to creatures is indeed verbal, reflecting differing definitions (with the Occasionalist reserving it strictly for God, the Necessitarian allowing secondary causes). Regulating terminology (e.g., using "secondary cause" only if inherent power is granted) clarifies this.

  However, the **substantive core disagreement** remains clear and fundamental. It concerns the **metaphysical ground of natural regularities** and the **modal status of causal connections** within the created order, under the overarching sustenance of God:

  1.  **Modality of Natural Connections:** Does the constant conjunction of specific antecedent and consequent events (given the absence of impediments) reflect a metaphysically *necessary* connection grounded in the *inherent natures* (*ṭabāʾiʿ*) of the creatures involved (Necessitarian), or does it reflect only a *contingent*, divinely instituted *custom* (*ʿāda*) lacking any grounding in inherent creaturely powers (Occasionalist)?
  2.  **Divine Freedom vs. Established Natures:** Does God's radical freedom and continuous creative action imply that He could, without intrinsic contradiction or change in the natures of things, alter the outcome of an event-sequence while keeping the intrinsic properties of the creatures and the antecedent conditions identical (Occasionalist), or does God's establishment of specific natures with inherent causal powers constrain (in a secondary, conditional sense) the outcomes that can follow from situations involving those natures, such that changing the outcome requires either changing the natures or supernatural intervention (Necessitarian)?

  We locate our irreducible disagreement precisely here: **in the attribution (or denial) of inherent, metaphysically grounding, conditional-causal powers (*quwā mu'aththira*) to the natures (*ṭabāʾiʿ*) of created entities as the explanation for the observed regular sequences in nature.** This disagreement underlies our divergent interpretations of language, contingency, miracles, and the thought experiments presented. We acknowledge this as a deep metaphysical divide concerning the structure of creation and the relationship between divine action and creaturely properties.

  ---
  **Signatures:**
  [Name of Occasionalist Advocate]
  [Name of Necessitarian Advocate]
