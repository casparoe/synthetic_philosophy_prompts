  ### Why Simpler Principles Fail
  - **(a) Exploitability (irrational iff pumpable)**: Fails Cases 3 (no broker, but irrational) and 4 (not pumpable, but rational). Also, Case 6 might be deemed rational, conflicting with your intuition.
