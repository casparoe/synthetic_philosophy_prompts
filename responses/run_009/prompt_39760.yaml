answer: |-
  After carefully analyzing your cases and verdicts, I propose a principle that captures the core intuitions while being as parsimonious as possible. The key insight is that diachronic irrationality stems from a combination of **preference instability without adequate justification** and **vulnerability to predictable losses**. My proposed principle integrates synchronic rationality with a diachronic condition for preference changes, plus a clause about plan adherence. Let's break it down.

  ### Proposed Principle: Stability, Information, and Plan Adherence (SIPA)
  An agent is diachronically rational if and only if:
  1. **Synchronic Rationality**: At each time, their preferences are internally consistent (transitive, complete, etc.).
  2. **Information-Driven Preference Changes**: Any change in preferences between times must be driven by new, relevant information about the *objects* of preference (e.g., facts about options' properties or consequences). Preference changes due solely to the passage of time, psychological shifts (e.g., akrasia), or arbitrary whims are not justified.
  3. **Plan Adherence**: If an agent forms a plan at time T1 that they deem optimal based on their preferences at T1, and no new information (as defined in 2) arises by T2, then acting contrary to that plan at T2 is irrational—even if it aligns with T2 preferences.

  **Motivation for each clause**:
  - **Clause 1 (Synchronic Rationality)**: Motivated by Cases 1–3 and 6. Cyclic preferences are synchronically irrational and make agents vulnerable to exploitation or futile cycles, regardless of whether exploitation occurs.
  - **Clause 2 (Information-Driven Preference Changes)**: Motivated by Cases 4 vs. 5. Distinguishes justified changes (e.g., rain affecting hiking enjoyment) from unjustified ones (e.g., temporal proximity alone causing akrasia). "Relevant information" means evidence about the world that affects the evaluation of options (e.g., rain makes hiking objectively worse).
  - **Clause 3 (Plan Adherence)**: Motivated by Cases 5 and 7. Ensures that plans made under "cooler" or more reflective conditions aren't abandoned capriciously. Binding commitments (Case 7) are rational because they enforce adherence to a plan that would otherwise be sabotaged by an unjustified preference change.

  SIPA avoids ad hoc distinctions by grounding "new information" in the *content* of preferences (e.g., facts about options) rather than temporal context alone. It also explains why intransitivity is inherently problematic (via Clause 1) and why mere preference change isn't sufficient for irrationality (via Clause 2).

  ### Application to Your Cases
  | Case | SIPA Verdict | Explanation |
  |------|--------------|-------------|
  | **1. Classic pump** | Irrational | Violates Clause 1 (cyclic preferences). The pump demonstrates synchronic irrationality. |
  | **2. Transparent pump** | Irrational | Same as Case 1: transparency doesn't resolve the synchronic defect. |
  | **3. Intransitive drift** | Irrational | Violates Clause 1. No broker is needed; the cycle itself is irrational. |
  | **4. Taste change (hiker)** | Rational | Satisfies all clauses: Preference change driven by new information (rain, pain). No plan is abandoned (switching is the rational response). |
  | **5. Akrasia (Saturday)** | Irrational | Violates Clauses 2 and 3: Preference change not driven by new information (just temporal proximity). Abandoning Friday’s plan without justification. |
  | **6. One-shot cycle** | Irrational | Violates Clause 1 (cyclic preferences). Synchronic irrationality exists even without a full pump. Loss is smaller, but the flaw is identical to Cases 1–3. |
  | **7. Binding commitment** | Rational | Satisfies all clauses: Commitment enforces adherence to Friday’s plan, countering an anticipated unjustified preference change. |

  SIPA **perfectly matches your verdicts** for Cases 1–5 and 7, but **overrules your hesitation in Case 6**. I argue this is necessary: if intransitivity is irrational in Cases 1–3, it must be irrational in Case 6 too. The loss in Case 6 is evidence of the underlying inconsistency—paying to move from A to B when A is preferred to B in a direct comparison is inherently flawed.

  ### Testing SIPA with New Cases
  To validate SIPA, let's apply it to novel scenarios. I’ll invent cases that probe the boundaries of "new information" and plan adherence.

  - **Case 8: Capricious Hiker**  
    *Setup*: Before vacation, you prefer hiking over beach. On a perfect sunny morning with no pain, you inexplicably prefer the beach and pay to switch—no new information.  
    *SIPA Verdict*: **Irrational** (violates Clause 2). Preference change isn’t information-driven; it’s arbitrary. Contrast with Case 4.  
    *Verdict Rationale*: Distinguishes "responsiveness to the world" from caprice.

  - **Case 9: Predictive Akrasia**  
    *Setup*: On Friday, you *correctly predict* that Saturday-you will prefer goofing off (due to temporal proximity). You do nothing, and Saturday-you goofs off.  
    *SIPA Verdict*: **Irrational** (violates Clauses 2 and 3). The preference change is unjustified (no new information), and failing to commit or adhere to the plan is irrational.  
    *Verdict Rationale*: Highlights that foreseeability doesn’t absolve irrationality; it may even heighten it.

  - **Case 10: Information-Rich Akrasia**  
    *Setup*: Friday-you prefers writing. On Saturday, you learn that a favorite band is playing nearby (new information), so you prefer goofing off and switch.  
    *SIPA Verdict*: **Rational** (satisfies Clause 2). The change is driven by new information (band’s presence).  
    *Verdict Rationale*: Shows that akrasia-like behavior can be rational if information-based.

  - **Case 11: Non-Akratic Plan Change**  
    *Setup*: Friday-you prefers writing, but Saturday-you learns the writing topic is irrelevant (new information) and switches to goofing off.  
    *SIPA Verdict*: **Rational** (satisfies Clause 2). Information justifies abandoning the plan.  
    *Verdict Rationale*: Clarifies that Clause 3 isn’t rigid—plans can be revised with justification.

  ### Limitations and Sacrifices
  - **Case 6 Sacrifice**: SIPA demands you drop your hesitation and fully condemn Case 6 as irrational. The intuition that it’s "less bad" than a full pump is pragmatic (smaller loss), but the *rational defect* is identical to Cases 1–3: synchronic irrationality. If you resist this, we’d need to weaken Clause 1, but that would undermine Cases 1–3.
    
