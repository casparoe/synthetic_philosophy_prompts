  Stick with **SIPA**. It’s precise, parsimonious (only three clauses), and explains your verdicts—including the critical 4/5 distinction—while handling new cases consistently. The only cost is embracing Case 6’s irrationality, which is defensible: intransitivity is a synchronic flaw, and one-shot losses still reveal it. If you reject this, we’d need a messier principle (e.g., adding "exploitability" as a disjunct), which I advise against.

