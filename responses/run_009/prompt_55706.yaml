  Based on your friend's rulings on the previous cases, I've identified two main candidate rules that fit her decisions consistently but diverge on your new case (the ordinary glass that internally toughens upon impact). I'll lay out these rules, explain how they apply to all cases (including predictions for the new one), bet on which rule she's likely using (and thus what she'll say for the new case), suggest a further case to test and settle the rule, and finally note a "dumb" rule that fits but is philosophically unsatisfying.

  ### Candidate Rules and Their Predictions
  Your friend's rulings emphasize the object's intrinsic nature versus external factors. Two rules capture this:

  1. **Intrinsic Composition Rule (ICR)**  
     - **Definition**: Fragility depends solely on the object's intrinsic material composition at the time of evaluation—ignoring any external protections, external destructive forces, or internal responses that might alter behavior during impact. If the material is brittle (e.g., ordinary glass), it's fragile; if it's inherently tough (e.g., heat-strengthened), it's not. External factors (like gadgets, bubble wrap, or poltergeists) are irrelevant to the fragility judgment because they don't change what the object "is" at its core.
     - **Fits all previous cases**:
       - Ordinary wine glass: Brittle material → fragile.
       - Glass with lab gadget: Material unchanged (still brittle) → fragile (gadget is external "cheating").
       - Glass in bubble wrap: Material unchanged (still brittle) → fragile (wrap is external).
       - Heat-strengthened pub glass: Material changed (intrinsically tough) → not fragile.
       - Toughened glass with poltergeist: Material unchanged (intrinsically tough) → not fragile (poltergeist is external; without it, no break).
     - **Prediction for new case**: The glass is described as "ordinary fragile glass through and through right now," meaning its intrinsic composition at rest is identical to a standard fragile glass. The internal toughening mechanism is an engineered response, but it doesn't alter the pre-impact material state. Therefore, ICR would classify this as **fragile**.

  2. **Pristine Impact Behavior Rule (PIBR)**  
     - **Definition**: Fragility is determined by what happens to the object under a "pristine" impact scenario—i.e., no external interventions (protections or destructive forces), just the object and the impact force. If it breaks in this scenario, it's fragile; if not, it's not. This rule focuses on the outcome in a counterfactual where only the object's own properties are at play. External aids or hindrances are mentally removed to assess the object's "true" behavior.
     - **Fits all previous cases**:
       - Ordinary wine glass: Breaks under pristine impact → fragile.
       - Glass with lab gadget: Without gadget, it would break → fragile (gadget is external, so we consider the scenario without it).
       - Glass in bubble wrap: Without wrap, it would break → fragile (wrap is external).
       - Heat-strengthened pub glass: Does not break under pristine impact (due to intrinsic toughness) → not fragile.
       - Toughened glass with poltergeist: Without poltergeist, it does not break (intrinsically tough) → not fragile (poltergeist is external; breaking isn't due to the glass).
     - **Prediction for new case**: Under pristine impact (no external factors), the glass's internal mechanism activates instantly, preventing it from breaking. Since it doesn't break due to its own properties, PIBR would classify this as **not fragile**.

  Both rules fit your friend's entire record perfectly, but they split on the new case because it introduces an internal, rapid-response mechanism that blurs the line between "intrinsic composition" and "behavior under stress." ICR sees fragility as a static property (based on the material at rest), while PIBR sees it as a dynamic one (based on what happens when triggered).

  ### Which Rule I'd Bet On and Why
  I'd bet your friend uses **Pristine Impact Behavior Rule (PIBR)** and will say the new case is **not fragile**. Here's why:
  - **Key evidence from her rulings**: In the poltergeist case (case 5), she explicitly said "not fragile" because "take the poltergeist away and nothing happens." This shows she prioritizes the object's behavior in a scenario stripped of external forces—i.e., the pristine impact counterfactual. Similarly, for the lab gadget and bubble wrap cases, she implied fragility by mentally removing the external protections and considering what the glass would do alone (e.g., "the gadget doing the cheating" suggests the glass would break without it). In the new case, the internal toughening is an intrinsic property that alters behavior under impact, so in a pristine scenario, it doesn't break—aligning with PIBR's "not fragile."
  - **Why not ICR?** While ICR is consistent with her focus on "the glass itself" (e.g., "the glass itself hasn't changed" in case 2), the new case challenges this. The engineered internal change is part of the object, making it different from an ordinary glass at rest (unlike cases 2 and 3 where protections were external). Your friend treated intrinsic changes (like heat-strengthening) as making the object "different stuff" (case 4), and this glass has been engineered to change internally, so it's not "ordinary through and through" in a behavioral sense. PIBR handles this better by focusing on the outcome.
  - **Probability**: I'd give this a 70% confidence. Her fast, intuitive rulings suggest she's thinking in terms of "what would happen if we just hit it with nothing else around," which is PIBR. If she were strictly using ICR, she might overlook the engineered response and call it fragile, but her rejection of external "cheating" implies she cares about real-world breakability.

  ### Further Case to Settle the Rule
  To confirm which rule your friend is using, propose this case:  
  **An ordinary wine glass is encased in an external force field that repels any incoming object with force, preventing it from ever being struck or impacted. The glass itself is untouched and intrinsically brittle—it would shatter if the force field were removed and it were hit.**

  - **How this distinguishes the rules**:
    - **ICR prediction**: Since the material is brittle at evaluation, ICR would say it's fragile (material unchanged; force field is external).
    - **PIBR prediction**: Under pristine impact, the force field prevents impact entirely, so the glass never faces a break scenario. PIBR might say it's not fragile because it doesn't break in reality or the counterfactual (or it could be ambiguous, but if she focuses on the inability to test fragility, she might lean "not fragile").
  - **Why it settles things**: This case isolates "external prevention" like bubble wrap or the lab gadget. If she says it's fragile (matching her bubble wrap ruling), she's likely using ICR. If she says it's not fragile (because it can't be broken at all), she's likely using PIBR. It also clarifies how she handles prevention: external (force field) vs. internal (your new case's toughening). If she calls this fragile but your new case not fragile, it confirms PIBR with a focus on internal vs. external causation.

