answer: |-
  ## Before You begin
  This quiz helps you explore your views on fairness when algorithms make predictions about people – like who gets bail, a loan, or a job. These algorithms often use scores based on data. Here’s what you need to know:

  *   **Calibration:** If a score predicts "70% chance of default," and 100 people get that score, about 70 should actually default. If this happens equally for different groups (e.g., men and women), the score is "well-calibrated" for those groups.
  *   **False Positive Rate:** The chance someone who *won't* cause harm (e.g., won't commit a crime if released) is incorrectly *predicted* to cause harm. A high false positive rate means too many harmless people are flagged as risky.
  *   **False Negative Rate:** The chance someone who *will* cause harm is incorrectly *predicted* to be harmless. A high false negative rate means too many truly risky people are missed.
  *   **Base Rate:** How common something actually *is* in a group. If crime rates differ between neighborhoods, those are different base rates.

  **No "right" answers exist here.** Different ideas about fairness sometimes clash mathematically. This quiz presents ten real-world situations. Read each carefully and pick the answer that feels *most fair* to you. Don't overthink the math; go with your gut feeling about fairness.

  ---

  ## The Ten Cases

  1.  **Bail Hearing:** The court uses a risk score to decide bail. The score is perfectly calibrated for both Group A and Group B: if it says "50% chance of re-offending," exactly half of those people do re-offend, in both groups. However, because Group A has a higher base rate of re-offending, many more *harmless* people in Group A get incorrectly labeled "high risk" and denied bail (higher false positive rate) compared to Group B. Should the court keep using this score?
      *   **A:** Yes, it's accurate for both groups. A higher false positive rate for Group A is unfortunate but reflects reality.
      *   **B:** No, it's unfair. Too many harmless people in Group A are wrongly jailed before trial.
      *   **C:** The whole idea of predicting crime risk to decide bail is flawed; we shouldn't use such scores at all.

  2.  **Loan Application:** A bank uses a score to predict default. Group X gets approved loans much less often than Group Y. To make approval rates equal between groups, the bank considers lowering the approval threshold *only* for Group X. This means approving some Group X applicants the score predicts are *likely* to default. Should the bank do this?
      *   **A:** Yes, equal approval rates are the priority, even if it means more defaults from Group X.
      *   **B:** No, approving people likely to default is bad business and might trap them in debt.
      *   **C:** The bank should find fairer ways to help Group X, not just lower the bar.

  3.  **Two Identical Applicants:** A hiring algorithm scores applicants based on resume features like skills, experience, and education. Two applicants (Person 1 from Group M, Person 2 from Group F) have *identical* resumes on every feature the company is legally allowed to consider. The algorithm gives Person 1 a slightly higher score. What should the company do?
      *   **A:** Hire the applicant with the highest score (Person 1). The algorithm judged them on the same features.
      *   **B:** Hire Person 2 to counterbalance potential unseen bias and promote diversity.
      *   **C:** Recognize the algorithm might be flawed; re-evaluate these applicants manually or redesign the system.

  4.  **Insurance Pricing:** An insurer wants to avoid charging higher rates based directly on race. They remove race from the data used to build their risk prediction model. However, the model uses zip code, car type, and credit score – features strongly linked to race in their region. Rates end up much higher in neighborhoods with mostly people of color. Is this fair?
      *   **A:** Yes, they didn't directly use race. The model uses legitimate risk factors.
      *   **B:** No, it's unfair. They just found a proxy for race, leading to the same discriminatory outcome.
      *   **C:** The problem is the underlying social inequalities making these features correlate with race; the score reflects reality.

  5.  **University Scholarship:** A prestigious scholarship uses a score predicting academic success. Historically, students from underfunded rural schools (Group R) have lower scores on average. To increase diversity among recipients, the selection committee considers adding "attended an underfunded rural school" as a *positive* factor in the score itself. Should they do this?
      *   **A:** Yes, this directly counteracts disadvantage and promotes fairness.
      *   **B:** No, scholarships should be based purely on predicted academic merit, not group membership.
      *   **C:** They should fix the pipeline (better fund those schools) instead of adjusting the score.

  6.  **Job Screening:** A tech company uses a test score to screen programmers. The score predicts job performance well and is equally calibrated for men and women. However, because fewer women historically entered tech (a legacy of past barriers), the base rate of women passing the test is lower. Using the same score threshold for hiring means fewer women get hired. Should they change the threshold?
      *   **A:** No. The score is accurate and fair. Hiring should be based on predicted performance.
      *   **B:** Yes. To overcome past injustice and get more women hired, set a slightly lower threshold for women.
      *   **C:** The unequal base rate *is* the unfairness, but it's not fixed by changing the score. Address the root causes.

  7.  **Medical Triage Algorithm:** A hospital uses an algorithm to prioritize patients for a scarce resource. The model predicts mortality risk. It's highly accurate and calibrated across groups. However, because Group C has worse overall health (due to systemic lack of access to care), many more people in Group C are flagged as high-risk. This means they get prioritized more often, potentially taking slots from equally sick people in Group D. Should the hospital use this model?
      *   **A:** Yes. It accurately identifies those in most medical need, regardless of background.
      *   **B:** No. It unfairly penalizes Group D by deprioritizing them relative to their actual medical urgency.
      *   **C:** Allocating scarce life-saving resources purely by predicted mortality risk is an unethical approach.

  8.  **Equal Mistake Rates:** A city wants its policing algorithm (predicting areas needing patrols) to be "fair." They decide fairness means the algorithm should make the *same types of mistakes* at the same rate for all neighborhoods: the chance of wrongly predicting high crime where it's calm (false positive) *and* wrongly predicting calm where crime happens (false negative) should be equal everywhere. Is this the right definition?
      *   **A:** Yes. Equal mistake rates mean no neighborhood is systematically over-policed or under-protected.
      *   **B:** No. Neighborhoods with different base crime rates *need* different error rates for the predictions to be accurate. Equal errors could make predictions useless.
      *   **C:** Using algorithms to direct policing creates fundamental injustice regardless of the error rates.

  9.  **Credit Score Correction:** A credit scoring company discovers its algorithm is equally well-calibrated for different racial groups – predicted risk matches actual default rates for each group. However, due to lower average income and wealth in Group Z (a legacy of redlining), the false positive rate (denying good loans to creditworthy people) is much higher for Group Z. Should they change the algorithm?
      *   **A:** No. The score is accurate and fair. The problem is the wealth gap, not the algorithm.
      *   **B:** Yes. The harm of wrongfully denying loans falls much harder on Group Z; the algorithm should be adjusted to reduce that harm specifically.
      *   **C:** Credit scoring perpetuates inequality; we need alternatives to traditional credit assessment.

  10. **Predicting Teacher Performance:** A school district considers using an algorithm to predict which new teachers will be most effective, based on training, test scores, and early evaluations. Some argue this is unfair because it labels people based on predictions, might overlook great teachers who don't fit the model, and reduces teaching to measurable outputs. Should they use the prediction model?
      *   **A:** Yes. If it helps identify and support effective teachers, it's a valuable tool.
      *   **B:** No. Teacher effectiveness is too complex and human; predicting it with scores devalues the profession and risks bias.
      *   **C:** Maybe, but only with extreme caution, heavy oversight, and not as the sole decision factor.

  ---

  ## The Scoring Key

  *   **Accuracy-First / Calibration Fairness (Primarily A in Calibration Questions like 1, 6, 7, 9):** Believes a well-calibrated score is inherently fair because it accurately reflects reality for each group. *Awkward Commitment:* Accepting that this will often lead to unequal burdens of harms (like false positives) falling disproportionately on disadvantaged groups with higher base rates.
  *   **Demographic Parity / Equal Selection (Primarily A in Question 2, B in Question 6):** Believes outcomes (approvals, selections, hires) should be proportional across groups, regardless of predicted risk or performance. *Awkward Commitment:* Sometimes requiring the deliberate selection of individuals predicted to perform worse or have higher risk to meet the quota/proportion.
  *   **Equalized Error Rates / Equal Mistake Burden (Primarily A in Question 8, B in Question 1, 9):** Believes the *types* and *rates* of mistakes (false positives, false negatives) should be equal across groups to ensure no group bears a disproportionate burden of algorithmic errors. *Awkward Commitment:* Often necessitates scores that are *less* accurate overall and less calibrated within groups to force error rates to match.
  *   **Individual Fairness / Similar Treatment (Primarily A in Question 3):** Believes fairness means treating individuals who are identical on relevant features the same way, regardless of group membership. *Awkward Commitment:* Ignores systemic group disadvantages that might mean "identical" features represent different levels of effort or achievement, potentially reinforcing inequality.
  *   **Upstream Fairness / World Is the Problem (Primarily A in Question 4, 6; C in Question 5, 9):** Believes the unfairness lies in the unequal base rates and societal conditions that the score merely reflects; the score itself is neutral. *Awkward Commitment:* Accepts that algorithms will perpetuate existing inequalities as "accurate" without providing a path to change outcomes through the decision itself.
  *   **Prediction Abolition / Limits of Scoring (Primarily C in Questions 1, 7, 8, 9, 10; B/C in Question 3):** Believes the core issue is using prediction for high-stakes decisions about people; scores inevitably reduce human complexity and risk encoding bias. *Awkward Commitment:* Necessitates finding alternative, often more resource-intensive or less "efficient," ways to make sensitive decisions.
  *   **Mixed / Inconsistent Answers:** Patterns like demanding equal error rates *and* demographic parity *and* calibration simultaneously are mathematically impossible. Answers demanding both equal outcomes *and* ignoring group membership entirely (e.g., strong A in Q3 with strong A in Q2) are also often incompatible. These combinations likely indicate not having fully grappled with the core trade-offs yet.

  ---

  ## What This Quiz Cannot Separate

  This quiz focuses on core mathematical trade-offs in algorithmic fairness. It cannot perfectly distinguish:

  1.  **Nuances within Positions:** For example, *how* someone wants to achieve Demographic Parity (e.g., quotas vs. different thresholds) or Equalized Errors (just false positives vs. both). It groups similar underlying fairness values.
  2.  **Motivations:** Someone choosing Demographic Parity (Q2A) might be motivated by reparative justice or simple diversity goals; the quiz doesn't probe *why*.
  3.  **"Benign Use" of Group vs. "Proxy" Use:** The quiz contrasts direct group use (Q5) with proxy use (Q4), but views on the permissibility of *any* group-conscious remedy might be blended between the Upstream, Abolition, and specific Equalized Harm views.
  4.  **Degrees of Abolition:** It groups together those who oppose prediction in specific high-stakes contexts (like bail - Q1C) with those who oppose it more broadly (Q10C).
  5.  **Specific Definitions of "Similar Individuals":** Question 3 tests a basic commitment to individual fairness, but different people might define "relevant features" differently, which the quiz doesn't explore.
  6.  **Implementation Details:** The quiz focuses on the *ethical choice* in the scenario, not the technical method for achieving it (e.g., pre-processing vs. post-processing vs. in-processing).

  The quiz is designed to clarify the fundamental, often incompatible, priorities people hold regarding algorithmic fairness when forced to confront concrete trade-offs. It reveals underlying values rather than detailed policy preferences.
