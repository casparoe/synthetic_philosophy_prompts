  We are going to construct a scenario that reverses the typical sunk cost lesson. The key is to design a situation where the escalating behavior, which appears to be falling into the sunk cost trap, is actually rational due to the structure of the payoffs and the strategic interaction.

  ### Scenario: The Supplier Contract Bidding War
  Imagine two companies, A and B, bidding for an exclusive contract with a supplier of a critical component. The contract is worth $1 million in net profit to the winner. The auction rules are: both the highest bidder and the second-highest bidder must pay their bids, but only the highest bidder gets the contract. The bidding proceeds in rounds, and each bid must be at least $50,000 higher than the previous bid. Both companies have already bid up to $600,000 (so the current high bid is $600,000 by company A, and the second-highest is $550,000 by company B). At this point, the bids have exceeded the contract's value to each company if considered in isolation. However, there is a critical factor: the loser of this auction will be forced to shut down because they cannot operate without the component, and the winner will absorb the loser's market share, which is worth an additional $500,000 in net present value. Moreover, the auction is public and the bidding history is common knowledge. Both companies are rational, have the same information, and are aware of the rules and the additional market share value.

  ### Analysis: Why Escalation is Rational
  In this scenario, the total value to the winner is $1.5 million: $1 million from the contract plus $500,000 from the acquired market share. The loser not only gets nothing from the contract but also loses their business (worth $500,000 in market share) and pays their last bid. Therefore, the net loss for the loser is their bid plus the $500,000 of lost business. 

  Consider the situation when the current bids are $600,000 (A) and $550,000 (B). It is B's turn to bid. If B drops out now, they lose $550,000 (paid) and their business (worth $500,000), so total loss = $1,050,000. If B bids $650,000, then A must decide. If A drops out, A loses $600,000 (paid) and their business ($500,000), so total loss = $1,100,000. If A matches with $700,000, then B must decide again, and so on.

  But note: if the auction continues, the winner gets $1.5 million minus their bid, and the loser pays their bid and loses $500,000. Therefore, the winner's net profit is ($1,500,000 - bid) and the loser's net loss is (bid + $500,000). 

  Now, let's compute the net payoff for the two companies at various points:

  - If the auction stops at a bid of $x by the winner and $y by the loser (where y is the previous bid by the winner, and the loser has bid y and then dropped out), then:
    - Winner: $1,500,000 - x
    - Loser: -y - $500,000

  But note: the bidding history matters because the loser has already committed to paying their last bid (which is the second highest). 

  At the current state (A: $600k, B: $550k), if B drops out:
    - A wins: pays $600k, gets $1.5M => net = $900k
    - B loses: pays $550k and loses business => net = -$1,050k

  If B bids $650k, then A must decide. If A drops out:
    - B wins: pays $650k, gets $1.5M => net = $850k
    - A loses: pays $600k and loses business => net = -$1,100k

  If A matches by bidding $700k, then B must decide again. If B drops out at that point:
    - A wins: pays $700k, gets $1.5M => net = $800k
    - B loses: pays $650k and loses business => net = -$1,150k

  But note: the auction can continue. However, observe that the net loss of the loser is always at least $500,000 plus their bid (which is increasing). The winner's net profit is decreasing as the bid increases, but it is still positive until the bid exceeds $1.5 million.

  The key is that for both players, the cost of losing is catastrophic (losing the business and paying the bid) while the reward of winning is substantial even at high bids. Therefore, both players are willing to bid beyond the stand-alone value of the contract because of the added value of the market share and the avoidance of the catastrophic loss.

  Let's do a backward induction starting from a high bid. Suppose the current bid by A is $x and by B is $x-50k (with B to move). If B drops out, B gets - (x-50k) - 500k = -x -450k. If B bids x+50k, then A must decide. If A drops out, A gets -x -500k. If A bids x+100k, then B must decide again. But note that if they continue, the bids will eventually reach a point where the winner's net profit becomes negative. However, observe:

  The winner's net profit at bid W: 1,500,000 - W.
  The loser's net loss: L + 500,000, where L is the loser's last bid (which is W-50k).

  The winner's profit is positive until W > 1,500,000. The auction will not go beyond 1,500,000 because then the winner would have negative profit. However, at any bid level below 1,500,000, the winner is still making a positive profit. Moreover, the alternative for the loser is to drop out and lose L+500,000. Since L is the bid they have already committed (and must pay regardless) plus the loss of business, they are comparing the certain loss of L+500,000 with the prospect of bidding again and possibly winning (and making 1,500,000 - (L+50k)) or losing and having an even higher loss.

  But note: if the bidding continues, the bidder who is about to drop out faces a loss that is increasing by the bid increment. However, the bidder who is currently the runner-up (and must bid to become the leader) is facing a loss that is already large and can be avoided by winning. Therefore, they are willing to bid higher to avoid that loss.

  In fact, the auction will escalate until the bid reaches about $1,5 million. Why? Suppose the bid is at $1,450,000 by A and the previous bid by B was $1,400,000. Now it's B's turn. If B drops out, B loses $1,400,000 + $500,000 = $1,900,000. If B bids $1,500,000, then A must decide. If A drops, A loses $1,450,000 + $500,000 = $1,950,000. If A bids $1,550,000, then B must decide: if B drops, B loses $1,500,000 + $500,000 = $2,000,000. But note that if B wins at $1,500,000, B gets 1,500,000 - 1,500,000 = $0. So at $1,500,000, winning breaks even (ignoring the sunk cost of previous bids? but note: the previous bids are already sunk and must be paid regardless of future actions? Actually, no: in this auction, only the last bid of the loser and the winning bid are paid. However, in our setup, the bids are incremental and each new bid replaces the previous bid. So the winner only pays their last bid (the highest) and the loser pays their last bid (the second highest). The previous bids are not paid again. Therefore, the bid history does not accumulate payments. Each company only pays the amount of their last bid (if they are the winner) or the amount of their last bid (if they are the runner-up). 

  Therefore, at the point when the bid is $1,450,000 by A and $1,400,000 by B (so B is the runner-up and must bid next), if B bids $1,500,000, then A must consider:
  - If A drops: A pays $1,450,000 (as the runner-up) and loses business: total loss = $1,950,000.
  - If A bids $1,550,000: then A becomes the leader and B must decide. B, if faced with A's bid of $1,550,000, would:
     - Drop: pay $1,500,000 and lose business: total loss = $2,000,000.
     - Bid $1,600,000: then A would face the same problem again.

  But note: winning at $1,500,000 gives B a net of $0 (1,500,000 - 1,500,000). But that's better than the alternative of dropping out and losing $2,000,000? Wait, if B wins at $1,500,000, then B pays $1,500,000 and gets $1,500,000 (the $1M contract and $500k market share) so net = $0. If B drops out, they pay $1,400,000 (as the runner-up) and lose the business: so -$1,400,000 - $500,000 = -$1,900,000. Therefore, bidding $1,500,000 is better than dropping out (net $0 vs -$1,900,000). Similarly, if A is faced with B's bid of $1,500,000, then A can drop and lose $1,950,000 or bid $1,550,000. If A bids $1,550,000, then A becomes the leader and B must decide. B, at that point, would compare:
  - Drop: pay $1,500,000 and lose business: -$2,000,000.
  - Bid $1,600,000: then they become the leader and A must decide. If A then drops, A would pay $1,550,000 and lose business: -$2,050,000. If A bids again, they go to $1,650,000 and so on.

  But note: if B bids $1,600,000, then if they win, they get $1,500,000 - $1,600,000 = -$100,000. That's a loss, but it is better than dropping out and losing $2,000,000? Actually, it is: -$100,000 is better than -$2,000,000. Similarly, if A is faced with a bid of $1,600,000 by B, then A would compare:
  - Drop: lose $1,550,000 (as runner-up) and the business: -$2,050,000.
  - Bid $1,650,000: then they become the leader and if they win, they get $1,500,000 - $1,650,000 = -$150,000. But again, that's better than -$2,050,000.

  Therefore, the bidding will continue until the bid reaches $2,000,000? Let's see: when the bid reaches a level where the winner's net is -$500,000 (because the winner pays the bid and gets $1.5M, so net = 1.5M - bid). But the loser, by dropping out, would lose their bid (which is the previous bid, now at $1,950,000 if the winner is at $2,000,000) plus $500,000, so -$2,450,000. That is far worse than winning at $2,000,000 and having a net loss of $500,000. Therefore, it is still better to bid. 

  But note: the winner's net loss at $2,000,000 is $500,000. The loser, if they drop out, would have a loss of $1,950,000 (their last bid) + $500,000 = $2,450,000. So they would rather bid $2,050,000 and become the leader, even though winning at $2,050,000 gives a net loss of $550,000 (1,500,000 - 2,050,000) because that's better than $2,450,000. 

  This logic continues until the bid is so high that the net loss from winning equals the net loss from losing? Actually, the two are not directly comparable because the loss from losing is fixed at the previous bid plus $500,000, while the loss from winning is increasing with the bid. However, the bidder who is considering bidding again is facing a loss from dropping out that is fixed (based on their current bid) and a loss from winning that is increasing. Therefore, they will bid as long as:

     Loss from winning (if they win at the new bid) < Loss from dropping out

  i.e.,  (new bid - 1,500,000)  [this is negative, so we take absolute value] < (current bid + 500,000)

  But note: the loss from winning is (new bid - 1,500,000) and the loss from dropping out is (current bid + 500,000). Since the new bid is the current bid + 50,000 (the increment), we have:

     new bid - 1,500,000 < current bid + 500,000
     => (current bid + 50,000) - 1,500,000 < current bid + 500,000
     => current bid - 1,450,000 < current bid + 500,000
     => -1,450,000 < 500,000   [which is always true]

  This inequality is always true! That suggests that the bidder will always prefer to bid again. But that cannot be, because eventually the bid will be so high that the loss from winning is huge. Where is the mistake?

  The mistake is in the comparison: the bidder is not comparing the loss from winning at the new bid with the loss from dropping out. They are comparing two options:

  Option 1: Drop out now -> loss = current bid (which they must pay as the runner-up) + $500,000 (lost business).

  Option 2: Bid the next increment (say, $50,000 more) and then:

     - If they win at the new bid, they pay the new bid and get $1,500,000, so net = 1,500,000 - new_bid.
     - But note: they might not win. After they bid, the opponent may bid again, and then they are back in the same position (but with a higher bid and a higher current bid for them as the runner-up).

  Therefore, the analysis must account for the fact that by bidding again, they are not guaranteed to win. They are only forcing the opponent to decide again. The opponent, in turn, will face the same dilemma.

  In fact, the only equilibrium in such a war of attrition is to continue until the bids are exorbitant. However, in practice, the bidding will stop when one player cannot bid further or when the net loss from winning becomes too high. But note: the loss from losing is even higher. Therefore, both players are trapped. 

  But wait: the original dollar auction does not have the additional $500,000 loss for the loser. That is the key structural difference. In the original dollar auction, the loser only pays their bid and gets nothing. In this scenario, the loser also suffers an additional loss (the business worth $500,000). This makes the cost of losing much higher and thus creates a stronger incentive to continue.

  Moreover, note that the value of winning is $1,500,000 (the contract plus the market share). Therefore, the auction should not go beyond $1,500,000? But the problem is that the runner-up, by dropping out, incurs a loss of their last bid (which is already high) plus $500,000. Therefore, even if the winning bid would be $1,500,000, the runner-up would rather bid $1,500,000 and win (net $0) than drop out and lose (say, if they were at $1,450,000) $1,450,000 + $500,000 = $1,950,000. So they will bid. Then the other player, who was the leader at $1,450,000, now becomes the runner-up at $1,500,000. If they drop out, they lose $1,500,000 (as the runner-up) plus $500,000 = $2,000,000. But if they bid $1,550,000, they become the leader and the opponent (now at $1,500,000) must decide. The opponent will then face the same: drop and lose $1,500,000 + $500,000 = $2,000,000, or bid $1,600,000 and become the leader. But then if they win at $1,600,000, they lose $100,000 (1,500,000-1,600,000). That is better than losing $2,000,000? Yes. So they bid. This continues.

  The auction will go on until the bids are astronomical. But that is not realistic. Therefore, we must introduce a budget constraint. Suppose both companies have limited resources. Let's say they both have a maximum budget of $2,000,000 for the bid (so they cannot bid more than that). Then the bidding will go up to $2,000,000. The last bidder to bid $2,000,000 wins. The runner-up (who bid $1,950,000) then pays $1,950,000 and loses the business. The winner pays $2,000,000 and gets $1,500,000, so net loss of $500,000. The runner-up has a loss of $1,950,000 + $500,000 = $2,450,000. 

  But note: at the point when the bid is $1,950,000 by A and $1,900,000 by B, and it's B's turn. If B bids $2,000,000, then A cannot bid (because of the budget constraint). So B wins. B pays $2,000,000 and gets $1,500,000 => net loss $500,000. A pays $1,950,000 (as the runner-up) and loses business => net loss $2,450,000. 

  At this point, B is better off than if they had dropped out (which would have cost $1,900,000 + $500,000 = $2,400,000) because $500,000 loss is better than $2,400,000. Similarly, A, by bidding $1,950,000, was trying to avoid the loss of $1,900,000 + $500,000 = $2,400,000 (if they had dropped out at the previous round). But now they are losing even more. 

  Therefore, the escalation is rational at every step because the alternative (dropping out) is worse. The trap is even deeper than in the original dollar auction because of the additional loss component for the loser.

  ### Structural Feature Doing the Work
  The critical structural feature is the **asymmetric payoff between winning and losing that includes an additional fixed cost of losing**. In the original dollar auction, the loser only pays their bid and gets nothing. In this scenario, the loser pays their bid and also suffers an additional fixed loss (the $500,000 business). This fixed loss magnifies the cost of losing and makes the bidder willing to accept a larger loss in order to win. The result is that the bidding goes higher and the eventual losses are larger.

  If we remove this additional fixed cost of losing (so the loser only pays their bid and does not lose their business), then the auction becomes a standard dollar auction. The value of the contract is $1,000,000. The bidding would escalate beyond $1,000,000 but not as high as in the previous case. Without the additional loss, the maximum bid would be bounded by the value of the contract plus the increment (but still can go over due to the same logic as the dollar auction). However, the losses would be less severe.

  ### Steelman the Sunk-Cost Purist
  The sunk-cost purist would argue that the additional loss of the business ($500,000) is not a sunk cost but an avoidable future cost. Therefore, the decision to continue is not driven by the sunk costs (the bids already made) but by the prospect of avoiding the additional loss. They would say that the bids already paid are sunk and should be ignored. The decision to bid again is based solely on the future consequences: if I drop out, I lose the business and that is a huge loss. If I bid and win, I save the business and get the contract, even if I have to pay a high price. Therefore, they would deny that this is an escalation of commitment due to the sunk cost fallacy. Instead, they would frame it as a rational decision to avoid a catastrophic future loss.

  This denial is substantive. The key difference is that in the standard sunk cost fallacy, the decision maker is influenced by costs that have already been incurred and cannot be recovered (and thus should be ignored). In this scenario, the decision maker is influenced by a future cost that can be avoided by winning the auction. The bids already made are sunk and are not affecting the decision (they are paid regardless). What matters is the additional loss of the business that can be avoided by winning. Therefore, the escalation is not due to the sunk cost fallacy but to the prospect of avoiding a large future cost.

  ### Separating Observation
  To separate the two interpretations, we would need to observe a scenario where the additional loss is removed. If, without the additional loss (i.e., the business is not at stake), the bidding still escalates beyond the value of the contract, then that would be due to the sunk cost fallacy. But in our scenario, without the additional loss, the bidding would not escalate as high because the cost of losing is only the bid (which is a sunk cost and should be ignored). Therefore, the decision to bid would be based on the future costs and benefits only. In the original dollar auction, the escalation occurs because the runner-up is trying to avoid the loss of their bid (which is sunk) and the winner is trying to capture the dollar. In our scenario, the escalation is driven by the avoidance of the additional loss. Thus, the observation that would separate the two is the presence or absence of the additional loss component for the loser. If the additional loss is present, then the escalation is rational and not due to sunk cost fallacy. If it is absent, then the escalation is due to sunk cost fallacy.

  Therefore, in our scenario, the escalating agent is rationally avoiding a large future cost, and the advisor who says "cut your losses" is ignoring the fact that the losses to be incurred by cutting are even greater.
answer: |-
  ### Constructed Scenario: Supplier Contract Bidding War  
  Two rival manufacturing firms, Alpha and Beta, compete for an exclusive contract with a critical supplier. The contract’s intrinsic value is $1M in net profit. The auction rules:  
  1. The highest bidder wins the contract and pays their bid.  
  2. The second-highest bidder pays their bid but receives **no contract** and must **scrap their existing production line** (worth $500K in salvage value) because they cannot source alternative components in time.  
  Bids start at $0, and each new bid must exceed the previous by $50K. After 10 rounds, Alpha leads at $600K, and Beta is second at $550K. At this point, an advisor urges Beta to quit. Beta refuses and escalates to $650K.  

  ### Rationale for Escalation: Payoff Structure and Strategic Asymmetry  
  The rationality hinges on **avoiding catastrophic loss**, not recovering sunk costs. Key elements:  
  1. **Asymmetric Loss for Second Place**: Losing means paying your bid *and* losing $500K (scrapped production line). Winning means paying your bid but gaining $1M profit.  
  2. **Escalation Dynamics**:  
     - At Beta’s position ($550K bid, facing Alpha’s $600K):  
       - If Beta quits: Pays $550K + loses $500K = **total loss of $1.05M**.  
       - If Beta bids $650K: Forces Alpha to respond.  
         - If Alpha quits: Alpha pays $600K + loses $500K = $1.1M loss. Beta pays $650K but gains $1M → **$350K net profit**.  
         - If Alpha bids $700K: Beta faces identical choice but now at $650K (second place). Quitting costs $650K + $500K = $1.15M loss.  
     - Beta’s choice: Escalate to avoid a guaranteed $1.05M loss. Even if winning at $650K yields only $350K profit ($1M - $650K), it dominates quitting’s $1.05M loss. Alpha faces the same logic.  

  **Backward Induction Contrast**:  
  - In Shubik’s dollar auction, backward induction shows quitting early is dominant: At $0.95 bid, the second-highest bidder ($0.90) quits to avoid paying $0.90 for nothing.  
  - Here, backward induction fails because **quitting guarantees a massive loss** ($bid + $500K), while winning (even at a high bid) offsets the loss. The auction escalates until bids approach **$1.5M** (where $1M profit + $500K salvaged loss = breakeven). Below $1.5M, winning is better than quitting.  

  ### Structural Feature Enabling Rational Escalation  
  **The critical element is the $500K exogenous loss imposed solely on the loser**, creating a *discontinuity* between winning and losing. This:  
  - Transforms the auction into a **race to avoid ruin**, not to capture value.  
  - Ensures the cost of losing *always* exceeds the cost of winning until bids breach $1.5M.  

  **If Removed**:  
  Without the $500K scrapping cost (e.g., loser keeps production line), the auction reduces to Shubik’s game. Bidding past $1M is irrational:  
  - Beta at $550K would quit, accepting a $550K loss (paid bid) versus risking $650K for a $350K win. Escalation stops early.  

  ### Steelmanning the Sunk-Cost Purist  
  **Purist Argument**: "This isn’t sunk-cost escalation! Beta ignores sunk bids ($550K) and acts only to prevent *future* $500K loss. Rational agents should ignore sunk costs—here, they do. True sunk-cost fallacy would involve bidding *because* of the $550K already spent, not to avert a new loss."  

  **Rebuttal and Separation**:  
  - **Substantive Difference**: The purist is correct that the $500K loss is avoidable and forward-looking. However, the advisor’s "cut losses" plea *appears* identical to sunk-cost advice ("you’ve spent too much already").  
  - **Observational Test**:  
    - **Sunk-Cost World**: Remove the $500K scrapping penalty. If Beta escalates beyond $1M (e.g., to "justify" $550K spent), it’s irrational sunk-cost reasoning.  
    - **This Scenario**: Beta quits if the scrapping penalty is removed *even after* $550K bid. But with the penalty, escalation persists.  
    The $500K loss is observable and contractually enforced—thus, escalation is structurally rational, not cognitive bias.  

  ### Conclusion  
  Escalation is rational here because:  
  - The loser’s penalty ($500K) creates a **threshold where winning is survival, not profit maximization**.  
  - Payoffs ensure **bidding $X is better than quitting until $X > $1.5M**, making escalation inevitable and rational.  
  The sunk-cost purist correctly notes this isn’t fallacy—it’s a rational response to asymmetric future costs. The advisor’s "cut losses" advice is myopic because it ignores the penalty’s existential threat, conflating *sunk costs* with *avoidable catastrophe*.
