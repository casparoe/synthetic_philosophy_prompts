prompt: |-
  Me and my friend finally called it quits at like 1am after arguing for hours about what a species even is, and it basically came down to him saying my gut verdicts are all over the place and me saying they're fine actually. So here's my list of verdicts, and I want to know if there's one principle that captures them, or whether I have to drop some.

  The verdicts: Great danes and chihuahuas are the same species, obviously, even though unaided they mostly can't mate. Lions and tigers are different species, even though they can interbreed in captivity and the female hybrids are sometimes fertile — I don't think the liger counts. Wolves and coyotes I want to say are different species, even though they interbreed a fair bit in the wild where they overlap. Two populations of the same kind of bird where the males sing a slightly different song and the females have stopped responding, even though they could physically interbreed — different species, I say. The salamanders that ring round the Central Valley in California: I say neighbouring populations along the ring are the same species, but where the two ends meet up and don't interbreed, I say the ends are different species. My friend thinks that last one is me having it both ways round the same ring. Bdelloid rotifers, which haven't had sex in millions of years, all-female clone lines: I'm fine calling those species, even though the interbreeding criterion literally never applies to them. And Neanderthals and us: I lean same species since we demonstrably interbred and most people carry a bit of their DNA, but my friend says if I say that, and also say lions and tigers are different species, I'm just picking whichever criterion suits the case.

  My tentative principle was going to be: same species iff the two populations would interbreed freely in the wild and produce fertile offspring. But I can already see it doesn't cover the rotifers, and it seems to give the same answer for lions+tigers and danes+chihuahuas only if I get to decide what counts as 'freely', which feels like cheating.

  So: is there a principle (or a couple of candidate principles) that gets all or nearly all of my verdicts, stated precisely enough that I can apply it to a new case? Which clause does the work for each verdict, and be honest about which of my verdicts it just can't accommodate — especially whether I have to give up either the 'same species all the way round the ring' claim or the 'different species at the ends' one. And then tell me what the principle you land on predicts for a case I haven't listed: polar bears and brown bears, which do interbreed in the wild where their ranges now overlap.

  Also could you write the answer in British English please (neighbouring, colour, that sort of thing), since I keep getting corrected on it. Ta.
reasoning: |-
  Okay, the user and their friend had a heated argument about what defines a species, going late into the night. They've provided a list of their intuitive verdicts on various cases and want to know if there's a unified principle that explains them. If not, they need to know which verdicts might need adjusting. They also want this analyzed in British English and applied to polar bears versus brown bears.

  First, I need to understand their verdicts. They see Great Danes and Chihuahuas as the same species despite mating difficulties, but lions and tigers as different even though they can produce hybrids like ligers. Wolves and coyotes are different to them despite natural interbreeding. For the birds with different songs leading to female non-response, they call them different species. The California salamander ring species has same-species neighbors but different species where the ends meet. Bdelloid rotifers, asexual for millions of years, still count as species. Neanderthals and modern humans are the same species due to interbreeding, but their friend calls this inconsistent.

  Their proposed principle of "same species if they interbreed freely in the wild producing fertile offspring" has problems. It excludes rotifers and feels subjective with "freely." They need something more robust.

  The Biological Species Concept (BSC) focuses on reproductive isolation. For Great Danes and Chihuahuas, artificial selection doesn't override their potential to interbreed. Lions and tigers have strong reproductive barriers in nature due to behavior and geography. Wolves and coyotes maintain distinct identities despite some hybridization. The birds' song differences create behavioral isolation. The salamander ring species shows how isolation accumulates over geography. Rotifers challenge the BSC since they don't reproduce sexually, so the phylogenetic species concept (PSC) might apply here, defining species by shared ancestry. Neanderthals and humans interbred successfully, indicating they were the same species under BSC.

  For polar and brown bears, they naturally hybridize where ranges overlap, but maintain distinct populations. Under the BSC, they're different species because hybridization isn't the norm. The PSC might also support this due to evolutionary divergence.

  The user might have deeper concerns about consistency in taxonomy or reconciling intuition with scientific principles. They might need a flexible framework that combines concepts where necessary, especially for edge cases like ring species or asexual organisms. Highlighting that multiple concepts exist and are used in biology could validate their struggle. Emphasizing that their verdicts mostly align with BSC, except rotifers which need PSC, shows they're not entirely off. For the salamanders, explaining ring species as a continuum where gene flow breaks at the ends might resolve their friend's criticism.
answer: |-
  Right, this is the eternal taxonomist's headache – and you're in good company. Your verdicts largely align with the **Biological Species Concept (BSC)**, but crucially *modified* by **evolutionary cohesion and distinctness**, and needing a different concept entirely for the asexual rotifers. There isn't one perfect, universally applicable definition, but we can build a coherent principle set accommodating most of your instincts. Let's break it down using British English throughout.

  **The Core Principle (Modified BSC):**

  > **Two populations are considered the same species if, under natural conditions (i.e., in the wild), they:**  
  > **a)  Have the *potential* to interbreed freely (without significant behavioural, temporal, mechanical, or geographical barriers preventing it),**  
  > **b)  Produce *fertile* offspring when they do interbreed,**  
  > **c)  And crucially, *actually do interbreed sufficiently to maintain genetic cohesion and prevent significant divergence into distinct evolutionary lineages* across their range over time.**

  **The Escape Clause (For Asexuals & Extremes):**  
  > **For obligately asexual lineages (like bdelloid rotifers) or cases where the BSC breaks down spectacularly (like the ends of ring species), we fall back on the Phylogenetic Species Concept (PSC):**  
  > **d)  A population forms a distinct species if it represents a single, monophyletic lineage (sharing a recent common ancestor not shared with others) and is diagnosably distinct by fixed heritable characteristics (morphological, genetic, behavioural).**

  **Applying the Principle to Your Verdicts:**

  1.  **Great Danes & Chihuahuas (Same):** Covered by (a), (b), and especially (c).
      *   *Clause Work:* (a) & (b): Mechanically *possible*, fertile offspring achievable (with assistance overcoming size). (c): **KEY** – Artificial selection hasn't broken genetic cohesion; they form one gene pool (*Canis lupus familiaris*), freely interbreeding subsets. No significant divergence into independent lineages. "Freely" here refers to *behavioural willingness and genetic compatibility within the gene pool*, not the physical logistics of every pairing. Your gut is right.

  2.  **Lions & Tigers (Different):** Covered by (a), (b), and crucially the *failure* of (c).
      *   *Clause Work:* (a): **Fails.** Strong innate behavioural isolation (don't recognise each other as mates), different habitats/preferences, geographical separation in the wild. They *don't* have the potential to interbreed "freely" under natural conditions. (b): Hybrid females fertile, but males sterile – not fully fertile offspring *as a population*. (c): **Fails Spectacularly.** No interbreeding in wild, no genetic cohesion, clearly distinct evolutionary lineages for millions of years.

  3.  **Wolves & Coyotes (Different):** Covered by *failure* of (c), despite limited (a) & (b).
      *   *Clause Work:* (a): Potential exists in overlap zones. (b): Hybrids fertile. (c): **KEY FAILURE.** Hybridisation occurs but is *not* sufficient to merge the populations into one cohesive gene pool. Strong assortative mating, ecological differences, and hybrid zones are stable or limited. Wolves (*Canis lupus*) and coyotes (*Canis latrans*) maintain distinct evolutionary trajectories and identities. Your verdict holds.

  4.  **Birds with Different Songs (Different):** Covered by *failure* of (a).
      *   *Clause Work:* (a): **Fails.** The different song acts as a *behavioural pre-mating barrier* preventing interbreeding "freely" under natural conditions. The physical ability is irrelevant if the behavioural trigger is missing. No genetic cohesion develops. Different species.

  5.  **California Salamanders (Ring Species):**
      *   *Neighbouring Populations (Same):* Covered by (a), (b), and (c).
          *   *Clause Work:* (a), (b): Freely interbreed, fertile offspring. (c): Gene flow occurs, maintaining cohesion along the ring.
      *   *End Populations (Different):* Requires the Escape Clause (d), PSC.
          *   *Clause Work:* (c) **Fails:** No interbreeding where ends meet, no gene flow, no genetic cohesion *between the ends*. (d): **KEY.** The end populations are diagnosably distinct (likely genetically, behaviourally) and represent the termini of divergent evolutionary lineages that have spread around the ring, accumulating differences. They are distinct monophyletic groups *relative to each other at the point of contact*. Your friend is wrong; this *is* logically consistent within evolutionary biology. The ring demonstrates how gradual divergence can lead to speciation without a hard split until the ends meet.

  6.  **Bdelloid Rotifers (Species):** **Requires Escape Clause (d), PSC exclusively.**
      *   *Clause Work:* The core BSC (a, b, c) **cannot apply** – no interbreeding *at all*. (d): **KEY.** Each clonal lineage (or group of very similar clones) represents an independent evolutionary lineage diagnosably distinct from others (morphologically, genetically). We recognise them as distinct species based on their distinct evolutionary history and characteristics.

  7.  **Neanderthals & Modern Humans (Same - Your View is Defensible):** Covered by (a), (b), and (c).
      *   *Clause Work:* (a): Evidence suggests interbreeding occurred when they met. (b): Fertile offspring proven by modern human DNA. (c): **KEY.** While Neanderthals were somewhat distinct, the level of interbreeding (estimated 1-4% DNA in non-Africans) demonstrates *significant gene flow* occurred where they overlapped. They were not completely isolated lineages; they merged genetically to a substantial degree. They are best considered subspecies (*Homo sapiens neanderthalensis* & *Homo sapiens sapiens*) or populations within *Homo sapiens*. Your friend's "picking" charge is weak: Lions/tigers show *no* natural interbreeding or gene flow, humans/Neanderthals show *significant* gene flow where they met. The principle holds consistently.

  **Honest Accommodation & Sacrifices?**

  *   **The principle accommodates:** Great Danes/Chihuahuas, Lions/Tigers, Wolves/Coyotes, Different Song Birds, Neanderthals/Humans, and the logic of the Ring Species (using both core and escape clause). Bdelloid Rotifers are covered by the essential escape clause.
  *   **Where it might chafe slightly:** The Ring Species ends *require* switching to the Phylogenetic Concept (d) for that specific comparison. You can't shoehorn the ends into the core BSC definition without contradiction, which is why the escape clause is vital. Your original verdict is biologically sound and is accommodated by the *combination* of principles.
  *   **The Big Sacrifice?** You *have* to accept that the BSC core principle *alone* is insufficient. You *need* the escape clause (PSC) for obligate asexuals and the extreme endpoints of continuous divergence like ring species. There's no single magic bullet.

  **Polar Bears and Brown Bears: The Prediction**

  *   **Populations:** Polar Bear (*Ursus maritimus*), Brown Bear (*Ursus arctos*).
  *   **Fact:** They interbreed in the wild where ranges overlap (e.g., Alaska), producing fertile hybrids ("pizzlies" or "grolars").
  *   **Analysis under Core Principle (BSC modified):**
      *   (a): **Yes.** Potential exists and is realised in overlap zones.
      *   (b): **Yes.** Hybrids confirmed fertile.
      *   (c): **No.** Hybridisation is relatively rare, occurring only in specific, limited overlap zones. Strong assortative mating based on habitat preference (sea ice vs. terrestrial), behaviour, and potentially pelage colour exists. The populations maintain distinct evolutionary trajectories, morphologies, physiologies, and ecological niches over the vast majority of their ranges. Hybridisation does not swamp the distinct gene pools.
  *   **Conclusion under Core Principle:** **Different species.** They fail criterion (c) – they do not interbreed sufficiently to maintain genetic cohesion across their ranges. They are distinct evolutionary lineages.
  *   **Analysis under Escape Clause (PSC):** (d): **Yes.** They are clearly diagnosably distinct (size, skull shape, limb proportions, fur colour/type, physiology, behaviour, ecology) and form distinct monophyletic lineages.
  *   **Overall Verdict:** The principle predicts **different species**, which aligns with the current scientific consensus (*Ursus maritimus* vs. *Ursus arctos*). Hybridisation demonstrates they are *closely related* species where isolation is incomplete, but not that they are one species.

  **The Principle You Land On (Summarised):**

  Your intuitive verdicts are largely consistent with a **dominantly Biological Species Concept framework, focused on *potential* and *realised* interbreeding *under natural conditions* sufficient to maintain *evolutionary cohesion and prevent lineage divergence*, but crucially supplemented by a Phylogenetic Species Concept for cases where interbreeding is impossible (asexuals) or where continuous variation demonstrably breaks cohesion despite historical connection (ring species endpoints).**

  This combination explains your gut feelings far better than a naive "must be able to breed" or a rigid "never any hybrids" stance. It accepts biology's messy reality while providing a workable, principled approach. You only need to formally "drop" the idea that the pure BSC can cover absolutely everything – which biologists realised decades ago! Your verdicts are biologically reasonable, even if your friend finds the ring species logic initially counter-intuitive. Stick to your salamanders!
