prompt: |-
  I'm a second-year undergraduate taking a paper on classical Indian epistemology, in which we've recently covered the Nyāya account of the pramāṇas — perception, inference, and reliable testimony, together with the two contested additions, analogy and postulation. Outside my studies I'm one of four volunteer editors for a student-run open project, a wiki of short articles on the natural history and local environment of the area around the university, to which anyone can contribute: students, staff, local birdwatchers, and a retired chemist who submits something nearly every week. The claims range from what species have been seen where and when the lake was last dredged, to which fungus is which and which path floods in winter. Between us we handle perhaps twenty submissions a week, we have about ten minutes per claim, none of us is an expert in anything the wiki covers, and every decision is public and has to be explainable to the contributor who submitted it.

  At present we work on instinct, and we regularly disagree with one another. It struck me during lectures that the Nyāya material is almost a readymade framework for our problem: what can be settled by perception, and under what conditions of the observer and the environment; when an inference from a stated ground is enough on its own; when a claim can only stand on what a trustworthy source says, and what makes a source trustworthy; and the recognised dangers of settling an identification by resemblance. So I'd like you to turn the theory into a procedure our editorial team could actually run on each submission, written for people with no Sanskrit and no philosophy. Keep whatever structure of the theory earns its place, and say plainly what you dropped in the translation and why.

  Concretely, please provide: (i) the procedure itself — the questions to ask in order, what counts as a sufficient answer to each, where it issues a verdict of publish, request a source, or reject, and the points at which it must hand the decision back to an editor because the remaining question is one of judgement rather than fact; (ii) the procedure run on four submissions of the kind we actually see: a birdwatcher's report of a rarity at the lake, witnessed alone in poor light; a claim that the lake must have been dredged after 1985, on the grounds that reed beds visible in a 1985 photograph are absent from one taken in 1990; a claim that a campus building dates from a particular year, cited to a newspaper article that itself cites the county records; and a contributor's identification of a photographed fungus as an edible species because it looks exactly like the one in her foraging guide; (iii) one of these worked so that the procedure delivers a verdict I will personally dislike, since I want to see whether it can override an editor's enthusiasm; and (iv) a short account of where the procedure will misfire — in particular whether a theory built around testimony from known, visible, socially accountable figures can be made to work at all for a wiki whose contributors are often pseudonymous strangers, and what the least bad patch for that gap would be.

  Please keep the whole thing under 900 words, and put the verdict at the start of each worked submission rather than at the end.
reasoning: |-
  Okay, the user is a second-year undergraduate studying classical Indian epistemology with a focus on Nyāya's pramāṇas. They're also an editor for a student-run wiki about local natural history and need a practical framework to evaluate submissions quickly. Their challenge is translating complex philosophical concepts into a usable procedure for non-specialists handling diverse claims.

  The core problem involves applying Nyāya's tools—perception, inference, testimony, analogy—to real-world editorial decisions. The user wants a step-by-step filter that clarifies when to publish, request sources, or reject submissions, while acknowledging gaps like dealing with pseudonymous contributors.

  First, I'll distil Nyāya's key principles into a decision tree. Perception requires direct sensory access under reliable conditions. Inference demands strict logical necessity between evidence and claim. Testimony hinges on source credibility. Analogy (upamāna) is flagged as risky for identification. Postulation (arthāpatti) feels too context-dependent for this workflow, so I'll omit it.  

  The procedure needs concrete examples to demonstrate its application. I'll select four submissions representing common scenarios: a dubious bird sighting (testing perception limits), a dredging timeline (inference pitfalls), a building date (testimony chains), and fungal identification (analogy dangers). Crucially, one example must override editorial enthusiasm—I'll choose the fungus case where personal excitement conflicts with procedural rejection due to unreliable resemblance.  

  For pseudonymity—Nyāya's weak spot—I'll suggest pragmatic patches: cross-verifying technical claims, noting contributor history, and transparently flagging uncertainty. The word limit means trimming philosophical nuances but keeping the framework's integrity.  

  The user's deeper needs emerge: they want to reduce arbitrariness in group decisions, legitimise rejections to contributors, and find intellectual satisfaction in applying coursework. The procedure must balance philosophical rigor with volunteer practicality—no Sanskrit terms, clear exit points for editorial judgment, and public defensibility.  

  Working the examples:  
  - The rare bird fails perception (poor light, no corroboration).  
  - The dredging claim misapplies inference (reeds could've died naturally).  
  - The building date passes via testimony (official records cited).  
  - The fungus identification is rejected despite the editor's enthusiasm, proving the system can override bias.  

  Finally, I'll explicitly note where Nyāya struggles (anonymous sources) and offer mitigations without overpromising. Keeping it under 900 words means concise explanations and verdict-first responses for clarity.
answer: |-
  Here’s a streamlined Nyāya-inspired editorial procedure for your wiki, omitting Sanskrit terms and non-essential theory. We drop **postulation** (too context-dependent for this setting) and treat **analogy** as high-risk. Testimony trust is adapted for anonymity.

  ---

  ### **The Procedure: 4 Questions**
  **(Apply in order; stop if verdict reached. Time: <10 mins/submission.)**

  1.  **Can this claim be *directly verified* by anyone’s reliable senses *right now*?**  
      *   *Ask:* Could any editor/local easily check this by looking/touching/etc. *today* under normal conditions?  
      *   **Publish** if YES *and* trivial/safe (e.g., "Path X is flooded today").  
      *   **Reject** if claim is about unrepeatable past/future/remote events *or* requires rare expertise/equipment.  
      *   *Else → Q2.* (Most claims fail here.)

  2.  **Is the claim a *necessary conclusion* from the stated evidence?**  
      *   *Ask:* If the evidence is true, is the claim *inescapably* true? Could other causes explain it?  
      *   **Publish** only if evidence *forces* the conclusion (e.g., "Photo shows ice on lake → Temp was ≤0°C").  
      *   **Reject** if evidence is consistent with other conclusions.  
      *   *Else → Q3.* (Judgment call: Is the inference weak or plausible but not certain? Hand back to editors.)

  3.  **Is there cited *testimony* from a source *proven reliable* on *this topic*?**  
      *   *Ask:* Is the source named, traceable, and a known expert/authority *on this specific subject*?  
      *   **Publish** if YES (e.g., county records, peer-reviewed ecology study, trusted local expert named).  
      *   **Request Source** if source is vague ("experts say"), indirect, or credibility is unknown.  
      *   **Reject** if source lacks expertise, has past errors on topic, or is anonymous without verification.  
      *   *Else → Q4.* (No testimony/weak testimony.)

  4.  **Is the claim based *only* on resemblance?**  
      *   *Ask:* Is the core argument "X is Y because it looks/sounds like Z"?  
      *   **Reject** immediately (High risk of error; e.g., fungi IDs, lookalike species).  
      *   *If not based on resemblance → Hand back to editors.* (Insufficient evidence; needs discussion.)

  ---

  ### **Worked Examples (Verdict First)**

  1.  **Claim:** "Saw [Rare Bird] at lake yesterday (poor light, alone)."  
      *   **Verdict: REJECT**  
      *   *Q1:* No – event past, unrepeatable. *Q2:* No inference stated. *Q3:* Source (submitter) is anonymous/unverified expert. *Q4:* Not resemblance-based, but testimony insufficient.

  2.  **Claim:** "Lake dredged post-1985: reeds in 1985 photo gone in 1990 photo."  
      *   **Verdict: REJECT**  
      *   *Q1:* No – past event. *Q2:* **NO** – Reeds could die from pollution, disease, or storm, not just dredging. Inference not necessary. *Q3/Q4:* Not reached.

  3.  **Claim:** "Old Library built in 1921 (per 1990 Gazette article citing county records)."  
      *   **Verdict: PUBLISH**  
      *   *Q1:* No – past event. *Q2:* No direct inference. *Q3:* **YES** – County records are authoritative primary source; newspaper is traceable secondary citation. Source reliability established.

  4.  **Claim:** "This fungus (photo) is edible Morel – looks just like my foraging guide picture!" *(You’re excited – you love Morels!)*  
      *   **Verdict: REJECT**  
      *   *Q1:* No – requires mycological expertise. *Q2:* No inference. *Q3:* Guide is generic (not specific to region/strain), submitter’s ID skill unverified. *Q4:* **YES** – Based *only* on resemblance. High risk of confusion with toxic false morels. **Overrides enthusiasm.**

  ---

  ### **Where It Misfires & Patch**
  **Misfires:**  
  Nyāya relies on known, socially-embedded authorities. Pseudonymous/wiki contributors break this model. Trust is hard to assign. Subjective judgments (e.g., "inference seems plausible") are pushed back to editors.

  **Least-Bad Patch:**  
  For anonymous testimony (Q3):  
  - **Publish ONLY if:**  
    a) Claim is technical/verifiable (e.g., "Lake pH = 6.2") *and* matches other submissions/data, OR  
    b) Submitter has a *long public track record* of accuracy *on this exact topic*.  
  - **Otherwise:** Request named source/evidence or reject. Add a public note: "Source not verifiable; use caution."

  **Result:** Prioritizes traceable expertise and cross-checked facts over anonymity. Resemblance remains banned. Inference is strict. Editors judge only when evidence is plausible but not conclusive.
