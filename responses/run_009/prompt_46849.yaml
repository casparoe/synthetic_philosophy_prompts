prompt: |-
  At our department's works-in-progress session on moral revolutions this week, two colleagues — an early-career historian and a senior moral philosopher — fell into a disagreement neither could resolve, and I confess I could not referee it cleanly either. (1) The historian opened with the Eric Williams thesis: British abolition of the slave trade and of West Indian slavery is the paradigm case of a supposed moral revolution that was really interest all the way down — plantation slavery was becoming economically marginal to an industrializing Britain, and abolitionist argument was so much window dressing. And, he added, the pattern generalizes: dueling died when the state consolidated its monopoly on legitimate violence and gentlemen no longer needed pistols to certify their status, so what we call moral revolutions are just economic and institutional shifts that moral rhetoric later dignifies. (2) The philosopher replied that this makes the causal story run too fast, and that Appiah's central lesson is precisely that neither pure argument nor pure interest explains abolition, dueling, or foot-binding: sustained moral argument does real work, but only once it attaches to a shift in what a community treats as honorable versus degrading — Clarkson's evidence and the Quakers' campaigning mattered exactly when slave-trading became shameful among the people with power to stop it. (3) The historian pressed the reduction: if what does the causal work is a change in which practices confer standing on elites, that is interest again under another description — honor is simply the currency in which status interests are paid, so Appiah's third alternative collapses back into the Williams thesis with extra steps. (4) The philosopher countered that this misreads both the phenomenology and the causal structure: honor is constitutively non-instrumental for the agent — duelists faced death and abolitionists accepted costs precisely where prudential calculation counseled otherwise — and a motive that regularly overrides interest cannot be explained away as interest in disguise. Neither would budge on whether Appiah's position is a genuine third alternative or a disguised variant of the interest thesis. Please adjudicate each of the four moves in turn, saying who is right about what, where each overreaches, and what, if anything, both are missing about how interests, arguments, and honor actually interact in norm change. Lead with your overall verdict in the first sentence, then give the move-by-move reasoning, with no preamble and no restating of the exchange.
reasoning: |-
  Hmm, the user is asking me to adjudicate a scholarly disagreement between a historian and a moral philosopher about moral revolutions, specifically regarding the abolition of slavery and other practices. The historian argues that what appear as moral revolutions are actually driven by economic interests, while the philosopher contends that honor and moral arguments play an essential role that can't be reduced to interests. Both cite examples like the abolition of slavery, dueling, and foot-binding.

  The user wants me to lead with an overall verdict and then analyze each of the four moves in their debate. They've structured the exchange clearly: (1) historian pushes Eric Williams' economic reductionism, (2) philosopher invokes Appiah's honor-based explanation, (3) historian reduces honor to interest, and (4) philosopher defends honor's non-instrumentality.

  I need to evaluate both positions fairly while showing where each overreaches. The historian is right about economic factors being crucial but wrong to reduce everything to them. The philosopher correctly identifies honor's role but underplays how interests shape what becomes honorable.

  For my overall verdict, I should state clearly that both perspectives are partially right but incomplete. Moral revolutions involve complex interactions between interests, arguments, and honor. Then I'll address each move in sequence.

  For move (1): The historian is correct that economic shifts matter (industrialization did weaken plantation slavery), but overreaches by dismissing abolitionist arguments entirely. He misses how moral arguments can reshape what counts as "interest."

  For move (2): The philosopher rightly notes that moral arguments gain traction only when tied to honor shifts, following Appiah. But he underplays how economic changes enable those honor shifts - it's not purely about persuasion.

  For move (3): The historian correctly sees that honor relates to status interests, but wrongly collapses them entirely. Not all honor-seeking is instrumental; sometimes honor demands sacrificing interest.

  For move (4): The philosopher is right about honor's non-instrumental nature in extreme cases (like duelists risking death), but overgeneralizes this as always overriding interest. Honor and interest often coexist.

  The deeper issue both miss is that these elements are dynamically intertwined: interests shape what arguments resonate, arguments redefine honor, and honor reconfigures interests. The user seems to want this synthesis - they couldn't "referee cleanly" and seek a resolution that honors both disciplines.

  I'll structure my response with a bold verdict first, then four crisp paragraphs analyzing each move, ending with what both miss about the interactions. The tone should be scholarly but accessible, avoiding jargon where possible. This seems like a high-level academic discussion, so I'll maintain rigor while keeping it readable.
answer: |-
  **Overall verdict: Both scholars capture partial truths but overstate their cases, missing how interests, honor, and arguments dynamically interact in norm change, with Appiah offering a distinct third alternative focused on socially constructed honor.**

  1.  **Historian's Williams Thesis (Move 1):** The historian is **partly right** that economic shifts (industrialization marginalizing plantations) and institutional consolidation (state monopoly on violence) provided crucial *conditions* enabling abolition and the decline of dueling. However, he **overreaches** by dismissing abolitionist argument as mere "window dressing" and reducing all norm change to underlying interest. This ignores the genuine moral conviction driving key actors (like Quakers) and the *causal role* of argument in reshaping perceptions of interest and honor itself. He **misses** how economic changes alone don't dictate *which* new norms emerge or *how* they gain traction, leaving the specific content of abolitionism unexplained.

  2.  **Philosopher's Appiah Defense (Move 2):** The philosopher is **largely right** that Appiah provides a distinct third alternative: sustained moral argument becomes causally effective only when it successfully attaches to a pre-existing or emerging shift in what confers *honor* and *shame* within a community, particularly among elites. He correctly identifies the need for a mechanism beyond pure interest or pure logic. However, he **slightly overreaches** by underemphasizing *why* certain practices become dishonorable; economic shifts and institutional changes (like state power consolidation) often create the fertile ground where arguments about honor can take root and redefine status interests. He risks presenting honor shifts as too autonomous.

  3.  **Historian's Reduction of Honor (Move 3):** The historian is **partly right** that honor is deeply intertwined with social standing and status, which are forms of "interest." He correctly points out that Appiah's framework relies on changes in what confers status. However, he **overreaches critically** by collapsing honor *entirely* into instrumental status-seeking. This **misreads the phenomenology**: as the philosopher notes, actors often experience honor as intrinsically motivating, demanding actions (like risking death in a duel or sacrificing profit for abolition) that directly *contradict* narrow prudential self-interest. Reducing honor to *only* a "currency" of status ignores its constitutive force as a value. He **misses** that what *counts* as honorable status is malleable and shaped by moral argument and broader social shifts.

  4.  **Philosopher's Defense of Honor's Non-Instrumentality (Move 4):** The philosopher is **essentially right** that the non-instrumental character of honor – its ability to motivate actions contrary to narrow self-interest – prevents its complete reduction to the historian's concept of "interest." Duelists facing death and abolitionists accepting costs demonstrate a motive irreducible to calculated advantage. This defends Appiah's position as a genuine third alternative focused on the *social meaning* of practices (honorable/shameful) as the key causal lever, distinct from both abstract logic and crude material interest. However, he **slightly overreaches** by implying honor *always* overrides interest; in reality, the *strength* of honor norms varies, and interests (including status interests) often shape *which* honor codes prevail. He also risks downplaying how the *content* of honor is influenced by material and institutional factors.

  **What Both Miss:** Both scholars underappreciate the dynamic, co-constitutive interaction between interests, arguments, and honor:
  *   **Interests shape honor:** Material conditions and power structures (economic shifts, state formation) create contexts where certain practices become more or less viable or desirable for elites, influencing *what* can be framed as honorable or shameful.
  *   **Arguments redefine honor and interests:** Moral rhetoric isn't just window dressing; it actively *works* to reinterpret practices, attaching shame to once-honorable acts (slavery, dueling) and redefining what constitutes true status or legitimate interest. Successful arguments can make once-prudential interests (like owning slaves) seem dishonorable.
  *   **Honor reconfigures interests:** When a practice becomes deeply shameful, upholding it becomes an active *dis*interest – damaging to social standing. Conversely, conforming to new honor codes (like abolitionism) becomes a new form of status interest, but one driven by the internalized value of the norm itself. Appiah's key insight is that the shift in the *social meaning* (honor/shame) is the proximate cause of widespread behavioral change, even if enabled by underlying conditions and driven by argument. It's neither purely reducible to prior material interest nor purely the product of disembodied moral logic.
