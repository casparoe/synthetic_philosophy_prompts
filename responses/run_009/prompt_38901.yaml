prompt: |-
  Every year in my decision theory seminar I run the dollar auction, two students bid each other past a dollar, everybody laughs, and we all agree that was irrational. This year I tried actually writing down my verdicts on escalation-ish cases and I can't find the principle behind them. Here's the list.

  Bidding 95 cents when I'm already in at 90 (second place still pays): locally the right move — you lose 90 for sure or bid and probably lose less — and I'd do it, yet I also think the whole spiral is a paradigm case of irrationality. Staying in a PhD program I despise because I'm eight years in: irrational, sunk costs are sunk, no debate. Cortés scuttling his own ships: smart, even though it destroys options, because it forecloses retreat for everyone at once and the enemy can see that. Announcing I'll wage a ruinous war on anyone who attacks my ally, then getting attacked and waging the war even though it's now pure loss: I genuinely think I should follow through. But that last one bugs me — the war itself is a sunk cost being honored for sunk-cost reasons, so how is it different from the PhD, other than scale?

  My tentative principle is something like: sunk costs count when they're paid in public, where others have watched you pay and will condition their future behavior on whether you keep paying. That handles deterrence, the ships, maybe firms finishing money-losing projects to protect a rep for finishing things. But it cuts both ways against me: it implies continuing the dollar auction IS rational once you're in it with the whole class watching (you'll be known as a quitter), and that feels flat wrong. And it can't touch the case I keep circling back to, which is that I think I should finish the dreadful 900-page novel I'm 700 pages into, and literally nobody knows I'm reading it.

  So: is there one principle that saves all or most of these verdicts? Where exactly does the publicity clause break, and what's the least bad thing to give up — the deterrence verdict, the auction verdict, or the novel? Also tell me what your principle says about a case I haven't listed: a company sticking with a doomed product line because the team's morale, and their willingness to start hard projects at all, depends on believing that projects here get finished. I suspect that one is the real stress test but I can't tell which side it stresses.
reasoning: |-
  Okay, let me tackle this decision theory puzzle. The user presents several escalation scenarios with conflicting intuitions and seeks a unifying principle. 

  First, I notice the core tension: sunk costs sometimes matter (deterrence, Cortés) but sometimes don't (PhD, auctions). The publicity angle feels promising but fails the novel-reading case where no one's watching. That's the knot to untie.

  Hmm... the novel case is particularly interesting. Why continue a private 900-page slog? It's not about reputation - perhaps about cognitive closure or identity investment? That suggests sunk costs might matter when they alter future choice architectures or self-conceptions. 

  For the company morale case - ah, this is tricky. It feels rational to continue the doomed project if quitting corrodes the team's "completion ethic." But isn't that just institutionalizing the sunk cost fallacy? Unless... the true cost includes future opportunity costs from damaged organizational capabilities. 

  The deterrence paradox is sharp: following through on a threat is pure loss ex post, yet ex ante commitment is rational. The key must be temporal separation - the cost at threat-making stage buys credibility that prevents the later scenario. Whereas in the PhD case, quitting now doesn't trigger future avoidance costs. 

  Let me structure this:
  - Cortés/scuttling ships: upfront cost to remove future defection options (strategic self-binding)
  - Deterrence: upfront cost (reputation building) to prevent attacks
  - Novel reading: sunk cost as cognitive investment that reshapes future reading choices?
  - Company project: sunk cost preserving team "completion capital" - but only if that capital is real and transferable

  The breakthrough might be distinguishing between:
  1) Costs that create or destroy future options/selves (rational to consider)
  2) Costs that merely make past losses larger (fallacy)

  The warship case clearly expands options by removing retreat. The novel case... does finishing create a "reader identity" that enables future reading? That feels psychologically real but economically suspect. 

  For the company - if the morale effect is measurable and impacts future projects, it's option-preservation. But if it's just feeling bad about sunk costs, then irrational. The stress test reveals we need evidence of spillover effects, not just assumptions.

  The auction remains irrational even public because it's zero-sum reputation burning - you become known as stubborn, not reliable. Whereas Cortés gains credible-commitment reputation. So publicity must interact with the type of reputation being built.

  Final principle: sunk costs matter when they alter your future choice set or others' expectations in payoff-relevant ways. But this requires the expectations to be correct (not just in your head) and the alteration to enable value capture elsewhere. Novel reading fails unless finishing demonstrably changes future reading capacity. PhD quitting's key is that the degree has no option value left - unlike the company's "completion ethic" which might.

  The user's struggle is beautifully articulated - they've hit the fault line between economic and psychological rationality. My answer must honor both while drawing clear boundaries.
answer: |-
  You've hit the nail on the head: sunk costs *do* sometimes matter, but publicity alone isn't the unifying principle. Your cases reveal a deeper pattern about **strategic self-binding and option value**. Here's a unified framework:

  ### The Principle: **Sunk Costs Matter When They Alter Future Choice Architectures**
  Rationality depends on whether past costs change the *structure of future decisions* for yourself or others, creating or destroying option value beyond the immediate choice. Let's test it:

  1. **Your Dollar Auction (Bidding 95¢ at 90¢)**  
     *Verdict:* Irrational escalation  
     *Why:* Past bids are sunk. Bidding 95¢ *only* risks greater loss. It doesn't constrain future opponents (they see your escalation as weakness, not commitment) or improve your position. Future choice architecture is unchanged.  
     *Publicity Paradox Solved:* Even with an audience, quitting signals prudence, not weakness—unless you're in a reputation trap (e.g., a gang). But in a classroom, "quitter" stigma doesn't alter future payoffs.

  2. **Quitting a Despised PhD (8 Years In)**  
     *Verdict:* Rational to quit  
     *Why:* Sunk costs (time/money) don't change future options. Staying only incurs *more* costs (misery, lost opportunities). The degree's value is fixed; "completion" doesn't unlock new paths if you hate the field.

  3. **Cortés Scuttling Ships**  
     *Verdict:* Rational  
     *Why:* Sinking ships *alters the choice architecture*:  
     - **For his men:** Removes "retreat" as a future option, forcing focus on victory.  
     - **For enemies:** Signals irreversible commitment, deterring attacks.  
     Sunk costs (ships) create new option value (victory/negotiation leverage).

  4. **Deterrence (Ruinous War for an Ally)**  
     *Verdict:* Rational to follow through  
     *Why:* The sunk cost (reputation investment) changes *others'* future choices. Honoring the threat maintains deterrence against *future* attackers. Not fighting destroys credibility, inviting more attacks. The cost of war today buys option value (safety) tomorrow.

  5. **Finishing a Dreadful 900-Page Novel (Privately)**  
     *Verdict:* Rational to finish *if* it rewires your future behavior  
     *Why:* If abandoning books at 700 pages becomes a habit, it *destroys option value*—you might quit meaningful projects later (e.g., writing a book). Completing it reinforces a "finisher" identity, enabling future follow-through. But if it's a one-off? Irrational. The sunk cost only matters if it reshapes your *decision-making ecology*.

  6. **Company Sticking with Doomed Product (Team Morale)**  
     *Verdict:* Rational *if* morale effects are real and systemic  
     *Why:* Canceling might sink morale, making future teams avoid hard projects. This destroys *option value* (innovation capacity). But it's rational **only if**:  
     - The morale-commitment link is proven (not just sunk-cost fallacy in disguise)  
     - The cost < value of preserving "completion culture" for *future* projects  
     *Stress Test Result:* This *validates* the principle. If the team's belief that "projects get finished" enables high-risk/high-reward work, sunk costs on a doomed project preserve strategic optionality.

  ---

  ### Where Publicity Fits (and Where It Doesn't)
  Publicity *amplifies* but isn't essential. What matters is whether actions:  
  - **Constrain your own future choices** (Cortés, novel reading).  
  - **Constrain others' choices** via credible signals (deterrence).  
  - **Preserve systemic capacities** (company morale, personal identity).  

  In the novel case, *privacy* doesn't matter—it's about your internal "policy" affecting future decisions. In the auction, publicity *doesn't* help because it signals irrationality, not reliability.

  ---

  ### Least Bad Sacrifice: The Novel Verdict
  If forced to surrender one intuition, **abandon the novel obligation**. Why?  
  - Finishing solely to "honor sunk costs" with no future behavioral change *is* irrational.  
  - But if stopping undermines your general ability to commit (e.g., you're practicing follow-through), it fits the principle.  
  - This is the weakest case—unlike deterrence or Cortés, the stakes are personal and speculative.

  ---

  ### Core Insight
  **Sunk costs aren't costs; they're investments in future constraints.** When they reshape game trees (yours or others'), they cease being "sunk" and become *governance mechanisms*. Escalation is irrational when it *only* deepens losses. It’s rational when it generates option value—closing paths to force better equilibria (Cortés), or preserving paths by maintaining reputations/capabilities (deterrence, company morale).

  This reconciles your cases: the PhD and auction lack future option value; the others create it through strategic self-binding.
