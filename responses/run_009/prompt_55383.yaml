  But to keep bookkeeping light, let's not have receiver payoffs. We'll just have sender payoffs, and receivers are there to make decisions. We want to focus on senders.

  Then we can tell receivers: "Your goal is to try to accept high types and avoid low types. You will be scored on how well you do." But then they have an incentive to try to do better. But with the rule we gave them, they are following a strategy.

  To avoid extra bookkeeping, let's just have sender payoffs, and receivers are playing a role.

  Round-by-round timeline:

  Total time: 75 minutes.

  Introduction: 10 minutes
  - Explain the roles: senders and receivers.
  - Senders are either high or low quality (4 high, 4 low), and this is fixed. They know their type.
  - In each round, senders decide whether to send a costly signal or not.
  - The cost of signaling varies by round and type.
  - Receivers will be matched to one sender and see the sender's signal decision and the aggregate number of signals in that round.
  - Receivers then decide to accept or reject.
  - But we have a fixed rule for receivers: 
     - If the sender did not signal, reject.
     - If the sender did signal, accept only if the aggregate number of signals is 6 or less.
  - Sender payoff: 
     - If accepted: 10 minus the cost of signaling (if they signaled) or 10 if they didn't (but they can't be accepted if they didn't signal, by the rule).
     - If rejected: minus the cost of signaling (if they signaled) or 0 if they didn't.
  - We will have 3 rounds.

  Then start:

  Round 1 (10 minutes):
  - Sellers: decide to signal or not (cost=0).
  - Instructor collects decisions, counts aggregate signals, announces to class: "This round, X senders signaled."
  - Then, receivers: for the sender they are matched to (randomly, but we don't need to physical match), they see the signal and then apply the rule: reject if no signal; if signal, accept only if X<=6.
  - Instructor then reveals the true types of all senders and the outcomes (accepted/rejected).
  - Calculate and announce sender payoffs for the round.

  Round 2 (10 minutes): same, but cost=2 for all.

  Round 3 (10 minutes): cost=1 for high, 10 for low.

  Debrief: 25 minutes

  Optional round 4: if time, allow receivers to pay to inspect. But if we are short, skip.

  In round 4: 
    Receivers, before deciding, can choose to pay a cost, say 3 points, to learn the true type of their sender.
    Then they can decide to accept or reject with perfect information.
    But then they have an additional choice.

  This might be complex, so we'll skip if time is short.

  Now, what might go wrong:

  - In round 1: we expect all senders to signal. But maybe one or two don't? Then aggregate X=6 or 7. If X=6, then receivers accept signals. Then the senders who signaled are accepted and get 10, those who didn't are rejected and get 0. But we wanted collapse. So to prevent that, we can set the cost in round 1 to 0, and tell them it's free, so they should signal. But if one doesn't, then it might work. But if X=7, then 7>6, so all rejected. Then the non-signaler gets 0, same as others. So no harm.

  - In round 2: flat cost. If senders coordinate to have exactly 6 signal, then those 6 get 8 points (10-2) and the 2 who didn't get 0. But how do they coordinate? They might not. We might have more than 6 signaling, say 7, then all are rejected and get -2. Or less than 6, say 5, then those 5 get 8, the others 0. But there is no penalty for not signaling. We hope to see that without differential costs, it's unstable.

  - In round 3: with high cost for low types, we hope low types don't signal. But if they do, and aggregate<=6, then they get 0 (10-10) and the high types get 9. But if too many signal, then everyone is rejected and high types lose 1, low types lose 10. So low types are penalized heavily.

  But if a low type signals and aggregate<=6, they break even. So they might do it. To discourage, we can set low type cost=11, so if they signal and are accepted, they get -1, which is worse than 0. Then they will not signal.

  So let's adjust: in round 3, low type cost=11.

  Then:
    High type: if signal and accepted: 10-1=9
    Low type: if signal and accepted: 10-11=-1
    If not signal: 0

  So they strictly prefer not to signal.

  Then if they signal and aggregate>6, they get -11, which is very bad.

  So they won't signal.

  Set:
  - Round 3: high cost=1, low cost=11.

  Now, the numbers:

  Sender payoffs by type and action:

  Round 1 (cost=0 for all):
  - If signal and accepted: 10
  - If signal and rejected: 0
  - If no signal and accepted: 10 (but won't happen)
  - If no signal and rejected: 0

  But by rule: if aggregate<=6, then signaled are accepted, else rejected. Non-signaled always rejected.

  In round 1, if all signal, aggregate=8>6, so all rejected. Payoff=0 for all.

  Round 2 (cost=2 for all):
  - If signal and accepted: 10-2=8
  - If signal and rejected: -2
  - If no signal: 0

  Round 3:
  - High type:
     - If signal and accepted: 10-1=9
