  Rounds:
  1. Round 1: no cost. Senders choose to signal or not. We expect all to signal. Aggregate=8>6, so receivers reject all. Senders get 0 if they didn't signal, 0 if they did (since cost=0 and rejected).
  2. Round 2: flat cost=2. Senders choose. Then aggregate announced. Receivers use the rule. We might see some senders not signaling, hoping that n_signal<=6. But if too many signal, all are rejected. It might be chaotic. We hope that not everyone signals, and maybe n_signal<=6, then those who signaled are accepted and get 10-2=8, those who did not signal are rejected and get 0. But there might be more than 6 signaling, then none are accepted.
  3. Round 3: differential cost. High types cost=1, low types cost=10. We hope that high types signal and low types don't. Then n_signal=4<=6, so receivers accept the signals. High types get 9, low types get 0.

  Materials:
  - For each sender: a card with their type (high or low) and a sheet to record their decision each round.
  - For receivers: a sheet to record their decision (but the decision is determined by the rule and the aggregate).
