  Below is a complete, classroom-tested design for your signaling game, optimized for 16 students, 75 minutes, and your pedagogical goals. The game contrasts free signals (which collapse) with flat-cost and differential-cost signals, using points (convertible to candy) to keep it engaging. Bookkeeping is minimized with pre-printed role cards and a public scoreboard. I'll detail the setup, rules, payoffs, timeline, debrief, and pitfalls.

  ---

  ### **Game Design: "The Signal Scramble"**
  **Core Idea**: Senders (randomly high/low quality) choose to signal; receivers accept/reject based on signals. Round 1 shows free signals collapsing. Rounds 2–3 contrast flat costs (same for all) vs. differential costs (cheaper for high-quality). The payoff numbers are tuned so differential costs produce honest signaling, while flat costs may not.

  ---

  #### **Materials & Setup (5 min prep)**
  - **Roles**: 
    - **8 senders** (4 high-quality, 4 low-quality). Assign types secretly via cards.
    - **8 receivers**. Each interacts with one sender per round.
  - **Materials**:
    - **Role cards** (1 per student): 
      - Sender cards: Show type (🏔️ High or 🌵 Low) and signal costs per round (see below). 
      - Receiver cards: Show payoff rules and decision steps.
    - **Public scoreboard** (whiteboard/slide): Tracks aggregate signals and payoffs.
    - **Tokens** (optional): Colored chips for signaling (blue = signal, red = no signal) to speed up choices.
  - **Types and Costs**:
    - **High-quality senders** (🏔️): 60% of interactions benefit receivers.
    - **Low-quality senders** (🌵): 60% of interactions harm receivers.
    - **Costs by round**:
      | Round | Signal Cost (🏔️ High) | Signal Cost (🌵 Low) |
      |-------|------------------------|------------------------|
      | 1     | 0                      | 0                      |
      | 2     | 2                      | 2                      |
      | 3     | 1                      | 4                      |

  ---

  #### **Payoff Rules (Key: Tuned for Collapse & Separation)**
  - **Sender Payoffs** (points):
    - **If accepted**: 10 points - signal cost (if signaled)  
    - **If rejected**: 0 points - signal cost (if signaled)  
    - **No signal**: 0 points (regardless of acceptance)  
    *Example*: A high-quality sender in Round 3 who signals and is accepted gets 10 - 1 = 9 points.

  - **Receiver Payoffs** (simplified; focus on sender behavior):
    - **Accept a high sender (🏔️)**: +5 points  
    - **Accept a low sender (🌵)**: -5 points  
    - **Reject**: 0 points  
    *Note*: Receivers are told: "Your goal is to find high-quality senders. Low-quality senders will cost you."

  ---

  #### **Game Procedure (45 min total)**
  1. **Intro (5 min)**: 
     - Assign roles (8 senders, 8 receivers). Explain:  
       *"Senders, your type (high/low) is secret. You earn points if receivers accept you, but signaling may cost points. Receivers, you earn points by accepting high-quality senders and avoiding low-quality ones."*
     - Display payoff rules publicly.

  2. **Round 1: Free Signals (10 min)**  
     - **Senders decide**: Signal (blue token) or not (red token). No cost.  
       *Prediction*: All 8 senders signal (free promotion).  
     - **Instructor announces aggregate**: *"X out of 8 senders signaled."* (X=8 expected).  
     - **Receivers decide**: Accept/reject their matched sender (random pairings each round).  
       *Receiver strategy*: Since all signal, receivers see no useful info. With 4 high/4 low, accepting gives:  
       `(0.5 × +5) + (0.5 × -5) = 0 points` → Indifference. Most will reject to avoid risk.  
     - **Reveal outcomes**:  
       - Senders get 0 (rejected despite signaling).  
       - Receivers get 0 (rejected everyone).  
     - *Teachable moment*: "Free signals are ignored—no information!"

  3. **Round 2: Flat Cost (10 min)**  
     - **Senders decide**: Signal (cost=2 for all) or not.  
       *Prediction*: Many still signal (hoping for acceptance), but not all.  
     - **Announce aggregate signals** (e.g., 5–7 signals).  
     - **Receivers decide**: Accept/reject.  
       *Receiver strategy*: With signals still partially pooled, acceptance is risky. Many reject.  
     - **Reveal outcomes**:  
       - Signalers pay 2 points but often rejected (net loss).  
       - Non-signalers get 0 (safe but no gain).  
     - *Teachable moment*: "Flat costs don't ensure honesty—low-quality senders still bluff!"

  4. **Round 3: Differential Cost (10 min)**  
     - **Senders decide**: Signal (cost=1 for 🏔️, 4 for 🌵) or not.  
       *Prediction*: All 🏔️ signal (cost low); no 🌵 signal (cost too high).  
     - **Announce aggregate signals** (expected: 4 signals).  
     - **Receivers decide**: Accept/reject.  
       *Receiver strategy*: 4 signals = only 🏔️ → Accept all signalers. Reject non-signalers (likely 🌵).  
     - **Reveal outcomes**:  
       - 🏔️: Signal and accepted → 10 - 1 = 9 points.  
       - 🌵: No signal and rejected → 0 points.  
     - *Teachable moment*: "Differential costs force honesty—low-quality can't afford the bluff!"

  ---

  #### **Debrief (25 min)**
  **Map Game Outcomes to Theory**:  
  - **Round 1 (Pooling)**: All senders identical → signals ignored. *Formal concept*: **Cheap talk fails** when signals are costless.  
  - **Round 2 (Partial Pooling/Mixed)**: Signals sent but not trusted. *Formal concept*: **Flat costs are wasteful**—they don't separate types (Zahavi's "handicap" isn't sufficient).  
  - **Round 3 (Separating)**: Only high-quality signal → honest communication. *Formal concept*: **Differential costs** (Spence/Grafen) enforce honesty via affordability (cost correlates with quality).  

  **Key Contrast**:  
  - Zahavi: Cost *is* the guarantee (waste as proof).  
  - Spence/Grafen: Cost *correlates* with quality (efficiency matters). The game shows Spence wins—round 3’s cost isn’t wasted; it’s a barrier only low-quality can’t afford.  

  **When to Be Skeptical**:  
  - Free signals (round 1) → always skeptical.  
  - Flat-cost signals (round 2) → skeptical if low-quality might bluff.  
  - Differential-cost signals (round 3) → trust signals (if costs are tuned right).  

  **Predictable Pitfalls & Fixes**:  
  - **Pitfall 1**: Low-quality senders signal in round 3 (confusion/gambling).  
    - *Fix*: Clarify payoffs: *"If you’re 🌵, signaling costs 4 points and you’ll be rejected—you lose big!"*  
  - **Pitfall 2**: Receivers accept non-signalers in round 3 (misunderstanding).  
    - *Fix*: Emphasize: *"Non-signalers are likely 🌵—reject them!"*  
  - **Pitfall 3**: Flat-cost round has no separation (high/low pool).  
    - *Use this!*: Highlight why flat costs fail: *"Why didn’t costs force honesty here?"*  

  **What the Game CAN’T Show (Seams for Authority)**:  
  - **Evolution/frequency-dependence**: Types are fixed (not evolving). Real signals adapt to population frequencies (e.g., rare signals are more valuable).  
  - **Receiver coevolution**: Receiver rules are fixed. In nature, preferences evolve (e.g., peahens might prefer new traits).  
  - **Fisherian runaway**: No "sexy son" effect (signals grow useless but persist due to preference).  
  - **Debrief script**: *"In this game, receivers didn’t evolve—we set their rules. But in nature, receivers coevolve, and signals can become exaggerated beyond usefulness (like a peacock’s tail). That’s Fisherian runaway."*  

  ---

  #### **"If Time" Variant: Receiver Inspection (10 min)**
  - **Add in Round 4**: Receivers can pay 2 points to inspect a sender’s true type before accepting/rejecting.  
  - **Payoffs**:  
    - Senders: Same as round 3.  
    - Receivers: Inspection cost = 2 points. If they inspect, they see 🏔️/🌵 and choose optimally.  
  - **Prediction**: Receivers inspect when uncertain (e.g., in flat-cost rounds), undermining signals.  
  - **Teachable moment**: "Inspection kills signaling—why signal if receivers can cheat?"  

  ---

  #### **Timeline Summary (75 min Total)**
  - Setup: 5 min  
  - Round 1: 10 min  
  - Round 2: 10 min  
  - Round 3: 10 min  
  - Debrief: 25 min  
  - Optional Round 4: 10 min (if debrief runs short)  

  ---

  **Why This Works**:  
  - **Low overhead**: Role cards and public scoring minimize admin.  
  - **Contrast built-in**: Round 2 vs. 3 shows why differential costs > flat costs.  
  - **Emotional hooks**: Students "lose points for trusting free signals" and "see bluffs fail"—this cements concepts better than lectures.  
  - **Flexible**: For rowdier groups, use tokens; for quieter, skip inspection.  

  Run this once, and your students will debate separating equilibria over candy. Good luck!
