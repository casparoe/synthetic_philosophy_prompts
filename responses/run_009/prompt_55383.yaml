  Now, the game should work.

  Debrief points:

  - Round 1: free signals, everyone signals, so the signal is not informative, receivers reject. The signal is useless.

  - Round 2: flat cost. We might see a variety of behaviors. Maybe some senders don't signal, hoping that not too many signal. But if the aggregate is low enough, then the ones who signaled are accepted. But there is no guarantee that the signalers are high quality. In fact, both high and low might signal. So it's pooling. And receivers accept based on the aggregate, not on the type. So it's not honest.

  - Round 3: differential cost. High types signal because the cost is low and they can gain. Low types do not signal because the cost is too high. Then only high types signal, aggregate=4<=6, so they are accepted. The signal is honest and informative.

  - Contrast: in round 2, the cost is a pure waste: it doesn't ensure honesty, and it might be paid for nothing. In round 3, the cost is differentially burdensome, and it ensures that only high types signal. The cost is not waste; it's a barrier that low types cannot afford.

  - Link to theory: 
     - Free signals: pooling equilibrium, no information.
     - Flat cost: might have partial pooling or mixed, but not honest.
     - Differential cost: separating equilibrium, honest signaling.

  - What the game cannot show:
