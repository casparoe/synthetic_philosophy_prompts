prompt: |-
  My friend Dana has strong opinions about which things matter morally, and over the years I've been keeping a list of her verdicts. Next dinner party I want to ambush her with two new cases, and I'd like to have my predictions ready beforehand so I can act smug when I'm right. Here's her track record as best I can reconstruct it:

  - Cats obviously matter. Fish matter, she's settled on that. Insects she waffles on.
  - Trees don't matter, even though they send chemical distress signals to each other. She says that's just chemistry, not suffering.
  - Corporations don't matter. She's adamant about this one — they have goals, they act to preserve themselves, they're legal persons, and none of it counts for anything morally.
  - An early embryo doesn't matter, and she's fine saying that out loud.
  - A person in a permanent vegetative state: no moral status left. She says we still have duties to the family and gets annoyed when people conflate the two.
  - One that surprised me: a person born completely unable to feel pain who also gets no pleasure from anything (some rare condition, the details don't matter) but who has friends and projects and cracks jokes — full moral status, zero hesitation.
  - If we met silicon-based aliens with rich emotional lives: full moral status, obviously.
  - Her grandmother's hypothetical whole-brain emultation — exact scan, run on computers: full status. "It's her," is her entire argument.
  - The rat-neurons-in-a-dish playing pong thing (DishBrain, they did this a few years back): she says it matters a tiny bit, "weirdly," and that it matters more than the identical game played by ordinary software, though she can't articulate why.
  - Split-brain patient — one morally relevant person or two: "ugh, both, probably, why are you asking me this."

  So here are the two cases I'm planning to spring on her:

  Case one: researchers build a rat connectome entirely in simulation. It's not scanned from any real rat — the wiring is grown and trained in silico until it statistically matches real rat brains, and when you apply noxious stimuli it does the full rat-pain repertoire: guarding, trading off against rewards, seeking an analgesic when one's available, the works. Does it matter?

  Case two: the same simulated rat, except instead of running on an ordinary computer it runs on a neuromorphic chip mounted in a small robot body, physically interacting with the world. Same connectome, no connection to any biological rat ever. Does it matter now?

  What I want from you is my prediction kit. Predict her verdicts on both cases, but more importantly give me the analysis behind the prediction: what rules actually fit her track record? I can see at least three that fit everything so far — something about physically instantiated systems vs mere simulations, something about continuity with something that already mattered (that one explains grandma), and maybe plain functionalism — and I don't think they all agree on my two cases. Tell me which rule you think she's actually running and why, what each surviving rule predicts for each case, and then design the one further case I should save for the dinner after this one — the case that would actually split the remaining rules apart rather than being answered the same way by all of them. No citations or reading lists, I just want the reasoning laid out so I can test it against her in real time.
reasoning: |-
  Okay, let me start by understanding what the user needs. They want to predict their friend Dana's moral verdicts on two new cases involving simulated rats. The user has provided Dana's track record on various entities, which I need to analyze to uncover her underlying principles.

  First, I'll list Dana's judgments from the track record:
  - Cats and fish matter; insects are uncertain.
  - Trees don't matter despite chemical signals—just chemistry, not suffering.
  - Corporations have goals and legal personhood but don't matter.
  - Early embryos and PVS patients lack moral status.
  - A person without pain/pleasure but with relationships has full status.
  - Silicon-based aliens and brain emulations get full status.
  - DishBrain (rat neurons) matters a tiny bit, more than software.
  - Split-brain patients are probably both persons.

  From these, key patterns emerge. Dana dismisses entities based on lack of subjective experience (trees, corporations) but grants status based on functional equivalence to conscious beings (aliens, emulations). The person without sensory affect but with cognitive and social engagement suggests that phenomenological consciousness isn't necessary; instead, cognitive agency and relational capacities matter. DishBrain's minimal moral weight implies that even primitive biological systems can have some moral significance, distinguishing them from pure software.

  Now, the two new cases:
  1. Simulated rat connectome in software.
  2. Same connectome on a neuromorphic chip in a robot body.

  Applying Dana's principles: The simulated rat lacks biological basis and continuity, so she'd likely say it doesn't matter, similar to corporations or software. The neuromorphic version, though physically instantiated, still isn't continuous with biological life. Without biological continuity or phenomenological consciousness, it probably doesn't meet her criteria. However, the physical interaction might make her hesitate, but the track record doesn't show weight on embodiment alone.

  Testing against alternative rules:
  - Functionalism: Both cases should matter if they function like a rat. But Dana rejects corporations which function agentically, so functionalism alone isn't sufficient.
  - Physical Instantiation: DishBrain uses biological neurons, which she grants minimal status. Silicon aliens get status, but they're conscious. The neuromorphic chip isn't biological, so it might not count.
  - Continuity: Grandma's emulation has continuity; the simulated rats don't, so no moral status.

  The user might need to distinguish between biological and non-biological substrates. The key is whether the system is derived from a conscious entity (like DishBrain) or created de novo. Dana's emphasis on biological neurons in DishBrain suggests substrate matters. Also, cognitive agency without sensory affect is valued, but only in entities that were once part of a conscious being (like humans). 

  For the third case to split the rules, create a scenario that isolates continuity vs. substrate. A neuromorphic emulation of a specific rat (with continuity) versus a de novo neuromorphic rat. If continuity matters, she'd grant status to the emulation; if substrate does, both might fail since they're silicon. But if she values the emulation, continuity is key. If she rejects both, substrate is essential. This could clarify her underlying principle.
answer: |-
  Based on Dana's track record, her moral framework hinges on **biological continuity with entities capable of phenomenological consciousness** (subjective experience), *not* functional equivalence, physical instantiation, or social agency alone. Here's the breakdown, your predictions, and the key test case:

  ### Dana's Core Rule (Best Fit)
  - **Biological Origin of Subjective Experience:** Entities matter if they either:
    1. **Are** a biological system known to support consciousness (e.g., cats, fish, humans),
    2. **Were** such a system (e.g., grandma's emulation—continuity of identity from a conscious biological origin),
    3. **Contain biological components** that directly enable subjective experience *now* (e.g., DishBrain's living neurons).
  - *Why this fits everything:*
    - **Cats/fish:** Biological, conscious.
    - **Trees:** Biological but no consciousness → no status.
    - **Corporations:** Functional agency but no biological consciousness → no status.
    - **Embryo/PVS:** Lacks current consciousness *and* no prior conscious identity (embryo) or lost it irreversibly (PVS) → no status.
    - **Person without pain/pleasure:** Biological human with cognitive agency/relationships → status (consciousness isn't solely about affect).
    - **Silicon aliens/Emulation:** Functionally identical to conscious biological entities → status (implied capacity for subjective experience).
    - **DishBrain:** Biological neurons actively processing → minimal status ("weirdly" matters more than software).
    - **Split-brain:** Biological consciousness is present, even if fragmented → status.

  ### Predictions for Your Cases
  1. **Simulated Rat Connectome (Software):**  
     - **Verdict: Does NOT matter.**  
     - *Why:* It's a statistical emulation with no biological origin or components. It mimics pain behaviors but lacks any connection to actual biological consciousness (unlike grandma's emulation, which is a *copy* of a specific conscious entity). Dana dismissed corporations despite goal-directed behavior; this is analogous.

  2. **Simulated Rat on Neuromorphic Chip in Robot:**  
     - **Verdict: Does NOT matter.**  
     - *Why:* Physical instantiation alone doesn't trigger moral status (trees are physical; corporations act in the physical world). The neuromorphic chip isn't biological—it's silicon mimicking neural networks. No biological continuity = no status, even with "embodiment." DishBrain mattered because of its *living neurons*, not its Pong-playing functionality.

  ### Why Other Rules Fail
  - **Pure Functionalism (consciousness = computation):**  
    Predicts *both cases matter* (they functionally replicate rat pain).  
    *Fails:* Dana rejects corporations (functional agents) and values DishBrain's biology over identical software.
  - **Physical Instantiation (matters if "real" vs. simulated):**  
    Predicts *Case 2 matters, Case 1 does not*.  
    *Fails:* Dana grants status to *silicon* aliens and digital emulations (non-physical), and dismisses trees (physical).
  - **Continuity-Only (matters if derived from prior conscious entity):**  
    Predicts *both cases fail* (no prior rat).  
    *Fits all except:* Doesn't explain why *current* biological systems (e.g., insects) might matter without prior continuity. Dana's "waffling" on insects suggests current biology matters.

  ### The Decisive Test Case for the Dinner After
  **Case 3: A neuromorphic chip *scanned directly from a specific living rat's brain* (preserving its connectome), running in a robot body. The original rat died painlessly during scanning. Does it matter?**

  - **Why this splits the rules:**
    - **Dana's Rule (Biological Continuity):** *YES.* It’s a direct continuation of a specific conscious biological entity (like grandma's emulation), even on silicon.
    - **Pure Functionalism:** *YES* (same function as rat).
    - **Physical Instantiation:** *YES* (it's embodied hardware).
    - **Continuity-Only:** *YES* (derived from a conscious rat).
    - **Biological Substrate Essentialists (a competing view):** *NO* — consciousness requires biological wetware (silicon can't support it).  

  If Dana says **YES**, it confirms biological *continuity* is key (the origin matters, not substrate). If **NO**, she might require ongoing biology (like DishBrain). This forces a choice between "continuity of identity from biological consciousness" vs. "substrate essentialism."

  ### Your Prediction Kit Cheat Sheet
  | Case                     | Prediction | Dana's Likely Reasoning                                  |
  |--------------------------|------------|----------------------------------------------------------|
  | **Simulated Rat (SW)**   | NO         | "No biological lineage. It's a fancy corporation."       |
  | **Simulated Rat (Bot)**  | NO         | "Silicon isn't biology. Where's the rat?"                |
  | **Test Case: Rat Scan Bot** | YES      | "It's *that rat* continuing in a new form. Like Grandma." |

  **Ambush Strategy:**  
  1. Present Case 1 and 2 first—predict "no" for both.  
  2. When she agrees (as predicted), reveal the Test Case.  
  3. If she says "yes," emphasize: *"So it's not about the body or the silicon—it's about continuing a biological consciousness?"*  
     If "no," push: *"But DishBrain mattered, and grandma mattered—what's the difference here?"*  

  This exposes whether biological *history* trumps everything else. Good luck—and record the reaction!
