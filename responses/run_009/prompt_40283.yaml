  Hmm, they’re very specific about the structure: a sestina with six end-words representing key causes, each stanza feeling like a self-contained explanation, but the repetition subtly revealing how all factors persist. They don’t want a tidy conclusion—just the uneasy tension. Also, two book club members are knowledgeable (one on poetic forms, one on history), so accuracy is crucial. 

