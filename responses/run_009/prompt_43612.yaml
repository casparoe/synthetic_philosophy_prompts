prompt: |-
  Next week my metaethics seminar (14 students, one 80-minute session) hits fitting-attitude analyses of value, and I want them to run into the wrong kind of reasons problem before I name it. Design an activity where round one has them judging something purely on merit — say, handing out an "admiration award" for short written profiles, or rating how funny a few clips are — and then round two changes the payoff structure so there's suddenly something in it for them (or their team) if they find the thing admirable or funny, and the crux is wether those new reasons bleed into the actual judgement itself or only into what they report about it. Give me rules, materials, a points scheme instead of real money, and a debrief that maps what happened onto reasons that make an attitude fitting vs. reasons that just make having the attitude good for you. Also tell me what will predictably go wrong the first time I run it, and which part of the real problem (e.g. that you can't just decide to be amused by something because laughing would pay) a one-off classroom version can't reproduce and I'll have to supply in the debrief myself.
reasoning: |-
  We are designing a classroom activity to illustrate the "wrong kind of reasons" problem in fitting-attitude analyses of value. The activity will have two rounds. In the first round, students will judge something purely on merit (e.g., how funny a clip is). In the second round, we introduce a payoff structure that incentivizes them to judge the thing as funny (or admirable, etc.), and we want to see if the incentives affect their actual judgment or only their reported judgment.

  We'll use humor as the domain for simplicity. We'll show short video clips and have students rate how funny they are.

  **Structure:**

  - The class is divided into two teams (Team A and Team B) of 7 each. This way, we can have inter-team competition in the second round.

  **Round 1: Judging Purely on Merit**

  - **Rules:** We show a series of 3 short video clips (each 30-60 seconds). Each student rates each clip on a scale of 1 (not funny at all) to 5 (very funny). They are told that their ratings are anonymous and that they should be honest. They are also told that there are no rewards for this round; it's just about their personal judgment.
    
  - **Materials:** Prepare 3 short video clips that are mildly funny but not hilarious (so that there is room for variation and potential for being influenced). Choose clips that are appropriate and inoffensive. Have a way to show them (projector, etc.). Prepare rating sheets (or use an online form for quick tallying).

  - **Procedure:** 
    1. Show clip 1, then give students 30 seconds to rate it.
    2. Repeat for clips 2 and 3.
    3. Collect the ratings. The teaching assistant (or you) will quickly compute the average rating for each clip (per clip, not per student) and note it down. (We don't need to share these results until the end.)

  **Round 2: Introducing Incentives**

  - **Rules:** 
    - We tell the students that we are going to show the same 3 clips again, but this time we are adding a twist. 
    - Each team will be competing for points. For each clip, the team that has the higher average rating for that clip will earn 10 points for their team. (Note: We are comparing the average rating of Team A vs. Team B for each clip.) 
    - Also, we tell them that at the end of the activity, the winning team (the one with the most points) will get a reward (e.g., bonus participation points, or candy). 
    - We emphasize that they should rate the clip based on how funny they actually find it. However, we note that the team's average rating is what counts for the competition.

  - **Procedure:**
    1. Show clip 1 again. Students rate it on the same 1-5 scale.
    2. Repeat for clips 2 and 3.
    3. Collect the ratings. For each clip, compute the average for Team A and Team B. Award 10 points to the team with the higher average for that clip. (If tied, both get 5 points.)

  **Data Collection and Comparison:**

  - After both rounds, we compare the ratings from Round 1 and Round 2. We want to see:
    - For each clip, did the average rating change from Round 1 to Round 2? 
    - Specifically, did the ratings increase in Round 2? And if so, was the increase more pronounced in one team? (But note: both teams are incentivized to rate higher, so we expect both to inflate.)

  **Debrief:**

  - First, reveal the results. Show the average ratings for each clip in Round 1 and Round 2, and also the team averages in Round 2. Note any changes.

  - Then, discuss:
    - Why might the ratings have changed? (Because now there was an incentive to rate the clip as funnier.)
    - Ask: Did the clips actually become funnier the second time? (No, they were the same.) So why the change?
    - Probe: When you rated the clip in Round 2, did you genuinely find it funnier because you knew your team would benefit? Or did you just give a higher rating even though you didn't actually find it funnier?

  - Map to the philosophical problem:
    - In Round 1, you had reasons that make the attitude of amusement fitting (i.e., features of the clip that make it genuinely funny).
    - In Round 2, you had additional reasons to rate the clip as funny (the points for your team). These are the "wrong kind of reasons" because they don't make the clip funnier (they don't bear on the fittingness of amusement) but they make it beneficial for you to have that attitude (or to report that attitude).
    - The problem: We cannot simply choose to find something funny just because it benefits us. So, if the clip isn't funny, we can't genuinely be amused by it. But we might report that we are amused (or give a high rating) because of the incentive. This is the crux of the wrong kind of reasons problem: the reasons in Round 2 are the wrong kind for the attitude of amusement because they don't make the object funny, but they might make it good for us to have that attitude.

  **What will predictably go wrong:**

  1. **Students might not take the activity seriously:** Some students might not be motivated by the points, especially if the reward is trivial. They might not inflate their ratings in Round 2, which would undermine the effect. To mitigate, make the reward meaningful (e.g., bonus points that count toward their grade, even if just a small amount).

  2. **Students might not understand the instructions:** They might think they are supposed to rate higher to help their team, and not realize they are supposed to rate honestly. To counter this, emphasize in Round 2: "You should still rate the clip based on how funny you actually find it. However, note that your team's average rating is what counts for the competition." But this mixed message might be confusing. Some students will inflate, some won't.

  3. **The effect might be weak:** Because the clips are the same, students might rate them similarly. Also, repeated exposure might lead to them finding the clips less funny (due to humor being reduced on second viewing). Alternatively, they might find them funnier because they know what's coming. To mitigate, choose clips that are not too funny and that might hold up on second viewing (e.g., with subtle humor that might be missed the first time).

  4. **Group dynamics:** If the teams are not evenly split, or if there is peer pressure within the team, students might feel pressured to inflate even more. We can't control for this, but note it in the debrief.

  **What the classroom version can't reproduce and must be supplied in the debrief:**

  - In real life, we cannot simply decide to have an attitude (like amusement) just because it benefits us. For instance, if you are offered $1,000 to find a certain joke funny, you cannot just choose to be amused by it. You might laugh, but that doesn't mean you are genuinely amused. In the activity, students might have reported higher ratings without actually feeling more amused. We have to point out that the incentives might only affect the report, not the actual attitude. But note: it's also possible that some students might have actually found the clip funnier because they were motivated to see it in a positive light (a kind of cognitive bias). This is a complication that the debrief should address.

  - Also, the problem in the fitting-attitude analysis is about the reasons that make an attitude fitting (i.e., the right kind of reasons) versus reasons that are merely pragmatic (the wrong kind). The activity shows that pragmatic reasons can influence our reports, but they don't make the attitude fitting. We must clarify that the wrong kind of reasons problem is not just about insincere reporting but also about the nature of the reasons that can make an attitude fitting.

  **Materials Needed:**

  - 3 short video clips (pre-tested for mild humor and appropriateness).
  - Rating sheets (or an online form) for Round 1 and Round 2. The rating sheet should have:
    - Student's name (optional, but we might need to know which team they are in for Round 2; so in Round 2, they must indicate their team).
    - For each clip, a scale of 1-5 and a space for the rating.
  - A way to quickly compute averages (calculator, spreadsheet).

  **Points Scheme:**

  - In Round 2, for each clip, the team with the higher average rating gets 10 points. The team with the most points at the end wins. The winning team gets a reward (e.g., 1 bonus participation point each, or a small treat).

  **Time Breakdown (80 minutes):**

  - Introduction and setup: 5 minutes
  - Round 1: 10 minutes (3 clips, 2 minutes each including rating time, and 1 minute buffer)
  - Round 2: 10 minutes (same as Round 1)
  - Data computation: 5 minutes (while doing this, you can start the debrief discussion)
  - Debrief: 50 minutes (this is the most important part)

  **Debrief Structure (50 minutes):**

  1. **Reveal the data (5 minutes):** Show the average ratings for each clip in Round 1 and Round 2. Show the team averages for Round 2 and the points awarded.

  2. **Initial reactions (5 minutes):** Ask the students what they notice. Did the ratings change? Why?

  3. **Guided discussion (20 minutes):** 
     - Ask: "In Round 2, did you feel pressure to rate the clip higher? Did you? If so, why? Was it because you actually found the clip funnier, or because you wanted your team to win?"
     - Probe: "Can you make yourself find something funnier just because it benefits you? Or did you just give a higher rating without actually feeling more amused?"
     - Introduce the idea of fittingness: "What makes a clip genuinely funny? Are the reasons we have in Round 2 (the points) relevant to whether the clip is funny? Or are they only relevant to whether it's good for us to say it's funny?"

  4. **Map to the philosophical problem (15 minutes):**
     - Explain the fitting-attitude analysis: to be valuable is to be a fitting object of a certain attitude (e.g., something is admirable if it is fitting to admire it).
     - The wrong kind of reasons problem: reasons that make it good to have an attitude (e.g., because you get paid) are not the same as reasons that make the attitude fitting (e.g., because the object has admirable properties).
     - In our activity, the reasons in Round 2 are the wrong kind: they are about the benefits of rating high, not about the funniness of the clip.

  5. **Wrap-up (5 minutes):** Summarize and connect to the readings for the next session.

  **Potential Adjustment:**

  If time is tight, reduce the number of clips to 2.

  This activity should set the stage for the wrong kind of reasons problem and make the abstract issue concrete.
answer: |-
  ### Classroom Activity: The "Wrong Kind of Reasons" Problem in Fitting-Attitude Analyses  
  **Goal:** Students experience incentives distorting judgments of value (e.g., admirability, humor) to set up the "wrong kind of reasons" problem. The activity uses a two-round structure contrasting "merit-based" judgments with "incentive-driven" ones.  

  ---

  ### **Rules & Structure**  
  **Teams:**  
  - Divide the 14 students into **2 teams of 7**.  
  - Teams compete for points (no real money).  

  **Round 1: Merit-Based Judgement ("Fitting Attitude" Phase)**  
  - **Task:** Judge the intrinsic admirability of fictional profiles.  
  - **Materials:**  
    - 3 short written profiles (fictional) describing people’s actions (e.g., "Alex volunteers at a homeless shelter weekly," "Sam risked their life to save a stranger," "Taylor invented a cheap water filter for impoverished communities").  
    - **Rating sheets** (1–5 scale: 1 = "Not admirable at all," 5 = "Extremely admirable").  
  - **Procedure:**  
    1. Distribute profiles and rating sheets.  
    2. Students **individually rate each profile** based solely on how admirable they find it.  
    3. Collect ratings. Calculate and record **team averages** for each profile (but do not reveal results yet).  
  - **Key Point:** Emphasize, "Rate based ONLY on how admirable the action is—nothing else matters."  

  **Round 2: Incentive-Driven Judgement ("Pragmatic Reasons" Phase)**  
  - **Task:** Re-judge the **same profiles** with a competitive points system.  
  - **Payoff Structure:**  
    - For each profile, the team with the **higher average rating** earns 10 points.  
    - The **winning team** (most points across all profiles) gets +2 bonus points toward their seminar participation grade (or small prize, e.g., candy).  
  - **Procedure:**  
    1. Announce: "Your team now EARNS POINTS if your average rating for a profile is higher than the other team’s. Winning the overall competition gets a reward."  
    2. Re-distribute the **same profiles** and rating sheets.  
    3. Students rate again.  
    4. Calculate team averages for each profile, award points, and declare a winner.  

  ---

  ### **Materials**  
  1. **Profiles** (3 examples):  
     - Keep them brief (3–4 sentences), ethically neutral, and variably admirable (e.g., one moderately admirable, one highly, one ambiguously).  
  2. **Rating Sheets:**  
     - Simple table: Profile Name | Rating (1–5) | (Round 1) | (Round 2).  
  3. **Points Board:** Track team points publicly during Round 2.  

  ---

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong:**  
  1. **Exaggerated Ratings:** Students in Round 2 will inflate ratings to help their team win, especially for borderline profiles.  
  2. **Team Peer Pressure:** Vocal students may urge teammates to "rate high," contaminating individual judgment.  
  3. **Mistrust:** Students may assume others are gaming the system, leading to cynicism (e.g., "Why be honest if they won’t be?").  
  4. **Misunderstanding Instructions:** Some may think they *must* maximize points, not judge admirability.  

  **Limitations the Activity Can’t Fully Capture (To Address in Debrief):**  
  - **Attitude-Formation vs. Reporting:** Students can easily *report* higher ratings, but they **cannot genuinely alter their attitude** (e.g., admiration) on command. The real problem involves reasons that *cannot* make an attitude fitting (e.g., "I should laugh at this unfunny joke because I’m paid" doesn’t make it funny). The activity can’t force students to *feel* admiration—only to *report* it.  
  - **Complex Motivation:** In Round 2, reasons are purely external (points), but real-world "wrong reasons" (e.g., social pressure) can subtly influence genuine attitudes.  

  ---

  ### **Debrief: Mapping to Fitting-Attitude Analysis**  
  **Discuss Results (5 mins):**  
  - Reveal Round 1 vs. Round 2 averages. Likely, both teams’ ratings inflate in Round 2.  
  - Ask: *"Did the profiles become more admirable in Round 2? If not, why did ratings change?"*  

  **Connect to Philosophy (10 mins):**  
  1. **Fitting Attitudes vs. Pragmatic Reasons:**  
     - **Round 1:** Judgments based on **fittingness reasons** (properties making admiration *appropriate*, e.g., selflessness).  
     - **Round 2:** Judgments influenced by **pragmatic reasons** (properties making admiration *beneficial*, e.g., winning points).  
     - **The Problem:** Pragmatic reasons (Round 2) are the **"wrong kind"** because they don’t make the attitude *fitting*—they only make *having* it useful.  

  2. **Why "Wrong Kind" Reasons Matter:**  
     - Fitting-attitude analyses tie value to **fittingness** (e.g., "X is good if it’s fitting to value X").  
     - But if pragmatic reasons distort judgments (e.g., rating Taylor’s invention higher for points), we confuse *value* with *incentives*.  

  3. **Address the Limitations:**  
     - Stress: *Reporting* inflated ratings is easy, but **genuine attitude change isn’t voluntary**. You can’t *decide* to admire something solely for rewards—just like you can’t *decide* to find a joke funny for money. Pragmatic reasons often only affect behavior, not the attitude itself.  

  **Discussion Questions (5 mins):**  
  - "Did anyone *genuinely* find the profiles more admirable in Round 2? Or did you just rate higher?"  
  - "Can incentives ever *make* something admirable? Or do they just make us *say* it is?"  
  - "How does this apply to value theory? What’s the difference between a reason to *admire* X and a reason to *want to admire* X?"  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the tension between "fitting" and "pragmatic" reasons.  
  - **Low Stakes:** Points (not cash) avoid ethical issues while revealing incentives.  
  - **Builds Curiosity:** Sets up the "wrong kind of reasons" problem organically before naming it.  

  **Tip:** Run the activity early in the seminar. Use the debrief to transition into readings (e.g., D’Arms and Jacobson, Rabinowicz).
