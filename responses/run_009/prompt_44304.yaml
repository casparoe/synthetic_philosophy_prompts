  1.  **Weak Private Signal Initialized Cascade (Dave's cold-induced thumbs-up).**  
  2.  **Rational Herding:** Later arrivals correctly weight the massive public signal (queue) over weak private signals (personal taste/empty restaurants).  
  3.  **Information Evaporation:** Choices after the initial stages convey no new info; everyone copies the crowd.  
  4.  **Cascade Fragility:** A single strong signal (critic) breaks the lock-in.  
  5.  **Expert Dichotomy:** Behavioral economist (perceives irrationality) vs. Game theorist (sees perfect rationality).  
  6.  **No Mockery of Individuals:** Focus is on the *structure* of inference leading to absurdity, not stupidity.  
  7.  **Banerjee Blueprint:** Classic information cascade model play-by-play without jargon.
