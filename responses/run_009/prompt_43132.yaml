  Below is a detailed design for an in-class game to illustrate the core intuition behind updateless decision theories (UDT). The game uses a modified **Ultimatum Game** structure to emphasize the difference between choosing an action *after* learning your role (updateful) and committing to a complete policy *before* knowing your role (updateless). The key twist—self-matching policies—reveals how policies can be self-undermining when evaluated solely from an updated perspective.

  ### Game Design: "The Policy Commitment Ultimatum Game"
  **Objective**: Participants experience the tension between updateful and updateless thinking by committing to a policy upfront and seeing it "confront itself" when roles are assigned.

  #### Setup
  - **Players**: 14 participants (adjustable for even numbers).  
  - **Structure**: 3 rounds (15 minutes each) + debrief (15 minutes). Total time: 60 minutes.  
  - **Game Rules**:  
    - A "policy" is a pair of numbers: **(D, T)**.  
      - **D** (Demand): If you are the **proposer**, you keep `D` points and offer `(100 - D)` to the responder.  
      - **T** (Threshold): If you are the **responder**, you accept any offer `≥ T` points; reject otherwise.  
    - If an offer is **accepted**, the proposer gets `D` points, and the responder gets `(100 - D)` points.  
    - If **rejected**, both get **0 points**.  
  - **Points System**: Use non-monetary points (e.g., "UDT Points"). At the end, recognize the top 3 scorers for fun (no real prize).  

  #### Procedure
  1. **Policy Submission (Pre-Role Assignment)**:  
     - Each participant writes down a policy **(D, T)** privately on a slip.  
     - Policies are collected and assigned anonymous IDs (e.g., Policy #1 to #14). A master list is projected or posted (showing only IDs and policies, e.g., "Policy #3: D=70, T=30").  

  2. **Role Assignment and Pairing**:  
     - **Each round**: Randomly assign roles (proposer/responder) to all participants. For odd groups, one sits out (rotate who sits out).  
     - **Pairing Mechanism**:  
       - **Round 1 (Baseline)**: Random pairing. Proposers and responders are matched with different policies (e.g., Policy #5 vs. Policy #11).  
       - **Round 2 (Self-Match)**: Each participant is matched *against their own policy*. For example:  
         - Participant A (assigned as proposer) uses *their own* policy to act.  
         - The "responder" is not another participant—it is a simulated player using *Participant A’s own policy*.  
         - Outcomes are calculated based on their **(D, T)**.  
       - **Round 3 (Mixed)**: 50% self-matches, 50% random matches.  
     - **Announcing Matches**:  
       - Display pairings publicly (e.g., "Proposer: Policy #5 (D=70) vs. Responder: Policy #5 (T=30)").  
       - For self-matches, phrase it as: "Proposer: Policy #5 | Responder: **Same Policy**." Do *not* reveal this is a self-match until results are shown.  

  3. **Calculating Outcomes**:  
     - After roles and pairings are announced, calculate payoffs:  
       - For **random matches**: Proposer’s `D` vs. responder’s `T`.  
       - For **self-matches**: The participant’s own `D` and `T` are compared.  
     - **Example**:  
       - Policy: D=80, T=30 → Offer = 20. Since 20 < 30, offer rejected → both roles score 0.  
       - Policy: D=60, T=40 → Offer = 40 ≥ 40 → accepted. Proposer gets 60, responder gets 40.  

  4. **Scoring and Feedback**:  
     - After each round, share outcomes for 2–3 example matches (e.g., "Policy #5: Offer=30, rejected → 0 points").  
     - Participants record personal scores (for their assigned role) on a tally sheet.  
     - **Self-match discovery**: When announcing self-match results, highlight the policy ID repetition: "Notice—Policy #5 played against *itself*. The outcome depended entirely on its own D and T!"  

  #### Why This Works
  - **Pre-commitment**: Policies are fixed before roles are known, forcing updateless thinking.  
  - **Self-matching**: Reveals inconsistencies (e.g., greedy D + high T = 0 points). This feels like a "discovery" because participants see their policy’s flaws when it faces itself.  
  - **Mixed rounds**: Round 3 prevents self-matches from feeling like a gimmick by blending them with random matches.  

  ---

  ### Debrief: Connecting Game to Updateless Decision Theory
  **Core Concept Mapping**:  
  1. **Updateless vs. Updateful Choice**:  
     - **Updateful (standard)**: Choose an action *after* learning your role (e.g., "I’m the proposer, so I’ll demand D=90!").  
     - **Updateless**: Choose a *policy* for all roles *before* knowing your role (e.g., "If I demand D=90 as proposer, but my responder self demands T=40, I’ll get 0").  
     - **Game Reflection**: In Round 1 (random matches), participants acted updatefully—they focused on their role. In self-matches, they saw their policy’s "global" performance.  

  2. **The Self-Match as a UDT Intuition Pump**:  
     - Self-matches simulate how UDT evaluates a policy: **not** by the outcome in one role (e.g., "Did I win as proposer?"), but by its *average performance across all roles and possible worlds*.  
     - Example: A policy with D=80/T=30 earns 0 in self-matches (rejection) but might "win" in random matches if paired with a low-T responder. UDT flags this as risky—your policy fails when it "meets itself."  

  3. **Why Updatelessness Pulls Harder**:  
     - Participants who set low D/high T (e.g., D=50/T=40) do well in self-matches (offer=50 ≥ 40 → accepted) but "lose" as proposers in random matches.  
     - Those with "inconsistent" policies (e.g., high D + high T) get punished in self-matches. This mirrors UDT’s critique: updateful agents optimize for their current situation but create self-sabotaging logic overall.  

  ---

  ### Two Honest Notes
  **1. What This Game *Can’t* Capture (Limitations of Classroom UDT)**:  
     - **No Logical Correlation**: Real UDT handles dependencies between agents’ decisions (e.g., Newcomb’s Problem, where Omega predicts your choice). Here, roles are random, not logically linked. Self-matches *simulate* interdependence but don’t replicate UDT’s core strength: reasoning about agents who share your algorithm or can predict your policy.  
     - **Not a Veil of Ignorance**: UDT isn’t Rawlsian fairness—it’s about *optimality*. The game’s self-match feels "fair" (you face yourself), but UDT is selfish: it avoids losing points *for you* across possible worlds.  
     - **What to Clarify**:  
       - "This game shows why we evaluate policies before updates, but real UDT handles *logical dependence*: e.g., if I one-box in Newcomb’s, it’s because my policy was predicted to do so. Random role assignment can’t capture that—we’ll see it in readings."  

  **2. Predictable Problems and Fixes**:  
     - **Problem 1: Confusion over policies**.  
       - Participants might think T is what they *want* (e.g., T=50) but set D=90 (incompatible).  
       - **Fix**: Start with a demo. Use a sample policy (D=70, T=30) and calculate outcomes for both roles.  
     - **Problem 2: Self-matches feel "unreal."**  
       - Some may say, "I’d never play against myself!"  
       - **Fix**: In debrief, clarify: "Self-matches aren’t literal—they show your policy’s robustness. UDT asks: ‘If everyone used this, would it work?’"  
     - **Problem 3: Time crunch**.  
       - Calculating 14 policies × 3 rounds may run long.  
       - **Fix**: Use a spreadsheet to auto-calculate outcomes. Pre-assign policy IDs. Skip detailed announcements; only share 2–3 illustrative examples per round.  
     - **Problem 4: Gaming the system**.  
       - Participants might set D=50/T=50 to "win" self-matches but lose in random matches.  
       - **Fix**: Highlight this in debrief: "UDT optimizes for *all* scenarios. Sacrificing random-match wins for self-match safety isn’t optimal—we need balance."  

  ---

  ### Final Tips
  - **Materials**: Policy slips, role-assignment cards (Proposer/Responder), projector for pairings.  
  - **Flow**: Keep rounds fast-paced. Emphasize that self-matches are a "revelation" of policy consistency.  
  - **Transition to Reading**: End with: "Today, we felt why we might choose policies before knowing our role. Next, we’ll see how UDT formalizes this for problems like Newcomb’s, where the 'role' isn’t random but *dependent* on your policy."  

  This game creates a visceral "aha!" moment for UDT’s foundation. By making self-matches a surprise that exposes flawed policies, you ensure the group feels the tension between updateless and updateful thinking—before diving into abstract theory.
