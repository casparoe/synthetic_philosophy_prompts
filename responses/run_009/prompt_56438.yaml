prompt: |-
  I'm a software engineer at a company that builds LLM-based agents — the kind that read tickets, modify cloud infrastructure, and draft replies to customers. I have no formal philosophy background; everything I know about the frame problem comes from secondhand reading, and I may be using the term loosely. Our agents maintain a workspace of derived state: cached facts, working assumptions ("the staging cluster is still on the old schema version," "this customer is on the Business tier"), and this state goes stale when the world changes out from under it. Right now every agent developer handles invalidation ad hoc: some re-read everything from source on every step, which is expensive and slow; some trust the cache until something breaks; and the worst failures are the silent ones, where the agent acts confidently on a fact that stopped being true an hour ago.

  My rough understanding is that philosophers and classical AI researchers spent decades on exactly this cluster of issues — how a system reasoning about the effects of actions figures out what stays true without exhaustively rechecking everything, what counts as "relevant" to a change, and all the ways the obvious formal solutions failed. I want that translated into something my team can actually run.

  Please write a decision procedure an engineer can apply whenever our agent is about to act on a cached or assumed fact: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure says "stop, re-verify from source" versus "proceed on the cached value"; where it hands the decision to a human because the question is about how much risk the business is willing to accept rather than anything an engineer can settle; and where it should say outright that the procedure cannot help. Keep whatever distinctions from the philosophy are load-bearing — I gather there's a difference between the frame problem proper and something called the qualification problem, and a genuine question about whether relevance to a change can ever be captured by a finite list of rules — but drop the formalism; nobody on my team will read logic notation, and they shouldn't have to.

  Then run the procedure on three cases from our backlog: (1) an agent that cached a customer's plan tier at the start of a long support session and is about to offer a refund policy that depends on that tier; (2) an agent maintaining a model of a Kubernetes cluster that must decide whether to re-query the cluster's live state before resizing a deployment; (3) an agent drafting a reply that relies on a fact from a document fetched earlier in the same conversation, in a session where a human is editing that document concurrently. Include at least one case where the procedure gives an answer I won't like — I'd rather learn that now than in a postmortem.

  Two honesty requests. First, mark plainly wherever the procedure is a judgment call dressed up as a checklist; this is going into an engineering runbook, and false precision is worse than none. Second, if my framing is confused — if the frame problem as philosophers actually understand it doesn't apply to caching and assumption-invalidation in LLM agents, if I'm conflating it with something else, or if the honest answer is that this is ordinary cache-invalidation engineering and the philosophy contributes nothing a runbook can use — tell me that directly instead of dressing up the connection to make me feel erudite. But if there is a real connection, be specific about which parts of it earn their place.
reasoning: |-
  We are addressing a practical problem: when an agent should invalidate cached or assumed facts before acting. The frame problem in philosophy and classical AI deals with how to efficiently determine what remains unchanged after an action. The qualification problem is about the difficulty of listing all preconditions for an action. These are relevant because we are trying to avoid exhaustive re-verification while ensuring the agent doesn't act on stale data.

   The procedure we design must:
   - Be a checklist of questions for an engineer to apply per fact before acting.
   - Indicate when to re-verify, when to use the cache, when to ask a human, and when the procedure is inconclusive.
   - Acknowledge judgment calls and business risk decisions.

   Key distinctions:
   - Frame problem: How to determine which facts are unaffected by an event (so we don't have to recheck everything).
   - Qualification problem: It's impossible to list all preconditions for an action (so we can't have a complete set of invalidation rules).

   Given these, we design a decision procedure that uses:
    1. The nature of the fact (is it volatile? how often does it change?).
    2. The source of the fact (is it from a stable source?).
    3. The context of the action (what are the consequences of being wrong?).
    4. The possibility of concurrent modifications.

   However, note that the frame problem in its original form is about reasoning about change in a formal model, and we are dealing with a real-world system where we can observe the world. So we are more concerned with the practical aspects of cache invalidation and the risk of acting on stale data.

   Steps for the decision procedure:

   0. Precondition: The agent is about to act on a cached or assumed fact F.

   1. **Question 1: Is the fact F inherently immutable?**
      - If F is about an eternal truth (e.g., "the sky is blue" in a children's story, but note: even that can be context-dependent) or a fact that by its nature cannot change (e.g., a historical event), then we can use the cached value without re-verification.
      - However, in a business context, very few facts are truly immutable. Even a customer's plan tier can be changed by an admin.
      - **Sufficient answer**: If the engineer can assert that F is immutable (e.g., it's a mathematical constant, or a fact about a past event that cannot change), then proceed without re-verification.
      - **Judgment call**: This is often a judgment. Historical events are fixed? But note: sometimes new information about the past emerges. In practice, we might consider it immutable if the source system does not allow updates.

   2. **Question 2: Is the fact F from a source that provides strong consistency guarantees and we have a way to know if it changed?**
      - For example, if the fact comes from a database that supports transactions and we have a version number or last-modified timestamp that we can check cheaply, then we can re-verify by checking the version without fetching the entire fact.
      - **Sufficient answer**: If we have a lightweight check (like an ETag) and the source is strongly consistent (so the check is reliable), then we can do a quick re-verification and update the cache if needed. Then proceed with the updated or confirmed cached value.
      - **Judgment call**: The engineer must judge whether the source is strongly consistent and the lightweight check is reliable and available.

   3. **Question 3: How volatile is the fact F?**
      - Consider: How often does it change? If it changes very rarely (e.g., the schema version of a cluster might change once a month) then the risk of it being stale in a short session is low. But if it changes frequently (e.g., the current CPU load of a server) then it's highly volatile.
      - **Sufficient answer**: If the volatility is low (and the time since last verification is short relative to the expected change frequency) then we might proceed without re-verification. But note: without a volatility model, this is a guess.
      - **Judgment call**: Requires knowledge of the domain and the fact's typical behavior.

   4. **Question 4: What is the cost of re-verification?**
      - If re-verification is cheap (e.g., a local cache or a fast API call) then we should re-verify. If it's expensive (e.g., requires a complex query or has high latency) then we might avoid it when the risk is low.
      - **Sufficient answer**: If the cost is low, then re-verify. If high, then we proceed to the next questions to see if we can avoid it.

   5. **Question 5: What is the cost of acting on a stale fact F?**
      - Consider the business impact: 
          - High cost: e.g., financial loss, security breach, customer churn.
          - Low cost: e.g., a minor inaccuracy in a non-critical part of a draft.
      - **Sufficient answer**: 
          - If the cost is high, then we must re-verify (even if expensive) OR if re-verification is impossible, we must either not act or escalate to a human.
          - If the cost is low, then we might proceed without re-verification.

   6. **Question 6: Is there a possibility of concurrent modification?**
      - In distributed systems, if multiple agents or humans can change the fact, then the cache is more likely to be stale. Especially if we are in a long session and the fact was read at the beginning.
      - **Sufficient answer**: If concurrent modification is possible and the fact is not versioned (so we cannot do an atomic check-and-set) then we must re-verify if the cost of staleness is not negligible.

   7. **Question 7: Can we use a heuristic or a probabilistic approach?**
      - For example, we might have a TTL (time-to-live) for cached facts. If the fact was verified recently (within the TTL) then we use it. But setting TTLs requires domain knowledge.
      - **Sufficient answer**: If we have a well-tuned TTL or a freshness model (e.g., based on historical data) and the fact is within its freshness period, then we can use the cache. Otherwise, re-verify.

   8. **Question 8: Is there a business policy that overrides?**
      - Some facts might require re-verification by policy regardless of the above (e.g., financial transactions always require up-to-date balance).

   9. **Question 9: Can we structure the action to be safe even if the fact is stale?**
      - For example, instead of relying on a cached fact, we can design the action to be idempotent or to include a check at the moment of execution (like an atomic conditional update). This is often the best solution but requires system design changes.

   10. **Decision summary**:
       - If any of the following, re-verify (or if re-verification is too expensive, then either do not act or escalate to human):
           - The cost of acting on stale data is high (Q5) and we cannot guarantee freshness by other means (like a lightweight check in Q2).
           - The fact is volatile (Q3) and we are beyond the safe time window (Q7) and the cost of staleness is not low.
           - Concurrent modification is possible (Q6) and we don't have a way to detect conflicts (Q2).
       - Otherwise, if the fact is immutable (Q1) or we have a strong consistency check (Q2) that passes, then use the cache.
       - If the cost of re-verification is high and the risk is low, then use the cache.

   11. **When to hand to a human**:
       - When the cost of acting on stale data is high and re-verification is impossible or too expensive, then we must ask a human to verify or make the decision.
       - Also, when the procedure cannot determine the risk (e.g., volatility is unknown and the cost of error is medium to high) then we should ask a human to make the call.

   12. **When the procedure cannot help**:
       - If we have no information about volatility (Q3) and no way to get it, and the cost of error is unknown, then the procedure cannot make a recommendation. We must then rely on default policies (like always re-verify for high-risk domains) or escalate.

   Now, we run the procedure on the three cases:

   Case 1: Customer's plan tier at the start of a long support session, about to offer a refund policy that depends on that tier.

     Q1: Immutable? No, because the customer's plan tier can change (e.g., they might upgrade or downgrade during the session).
     Q2: Lightweight check? Maybe. If the user profile has a version, we can check with a lightweight call. If available, then we do that.
          If not, then we proceed to next.
     Q3: Volatility: Plan tiers don't change very often, but during a support session it's possible (if an admin does it). So medium volatility.
     Q4: Cost of re-verification: Probably low (one API call to the user service).
     Q5: Cost of acting on stale fact: High. Offering a refund policy that the customer isn't entitled to could lead to financial loss and compliance issues.
     Q6: Concurrent modification possible? Yes, because an admin or automated process might change the tier.
     Q7: TTL? If we have a TTL of, say, 5 minutes and the session started 30 minutes ago, then it's stale.

     Decision: Because the cost of error is high and re-verification is cheap, we must re-verify. If the lightweight check (Q2) is available, use it. Otherwise, do a full re-verification.

   Case 2: Agent maintaining a model of a Kubernetes cluster, deciding whether to re-query before resizing a deployment.

     Q1: Immutable? No, the cluster state changes constantly.
     Q2: Lightweight check? Kubernetes has resource versions. We can get the current state of the deployment with a GET and check the resourceVersion without fetching the entire cluster state? Actually, for a specific deployment, we can do a lightweight check by getting just that deployment and comparing the version. But note: the resize might depend on other facts (like current load, available resources) that might have changed? So we must be cautious.
          However, the agent is maintaining a model of the cluster. How detailed? If the resize action depends on the current replica count of the deployment, then we might have that in our model. But if it depends on the current load, then we might not have that cached? Let's assume the agent cached the state of the deployment (including replica count) and the available resources in the cluster at some point.

     Q3: Volatility: Cluster state changes often (pods come and go, nodes fail, etc.). High volatility.
     Q4: Cost of re-verification: It depends. Re-querying the entire cluster is expensive, but we might only need the specific deployment and the node resource usage? But even that might be heavy if we do it for every action. We might use watches to keep the model updated? But the question is about re-querying before acting.

     Q5: Cost of acting on stale fact: High. Resizing based on stale data could cause over-provisioning (wasting money) or under-provisioning (service disruption). Also, if the cluster state has changed such that the resize is no longer safe (e.g., a node went down), we might cause an outage.

     Q6: Concurrent modification: Very likely. Many agents and humans might be changing the cluster.

     Q7: TTL: For a cluster state, TTL would be very short (seconds or minutes). But if we are using a watch, we might have near real-time.

     Given the above, we must re-verify. But note: Kubernetes operations are typically done by sending a patch or update that is conditional on the current resource version. So the best practice is to:

        - Use the resource version we have in the cache to make a conditional update (if possible). If the update fails because the resource version is stale, then we re-fetch and retry.

     Therefore, the procedure might lead us to:

        - If the action (resize) can be done conditionally (using the cached resource version) then we don't need to re-query; we can try the conditional update and handle the failure by re-querying and retrying.

        - Otherwise, we must re-query the specific resources we depend on (like the deployment and the nodes) to get the latest state.

     So the answer isn't just "re-verify" but also "design the action to be safe via conditional updates". This is an instance of structuring the action to be safe (Q9).

     Therefore: If we can do a conditional update, then we can proceed without re-querying (because the update will fail if stale). Otherwise, we must re-query.

     But note: if the resize decision depends on multiple facts (like the current load and the deployment's replica count) and we only have a conditional update for the deployment, then we might still have to re-query the load? Because the conditional update only checks the deployment's version. So we might be acting on stale load data.

     Therefore, we must break down which facts the resize depends on and ensure each has a way to be verified or the action is safe. In practice, for Kubernetes, the resize (changing the replica count) only directly depends on the deployment resource. But the decision of how many replicas to set might depend on other factors (like current load). We must re-verify the load if we are using it in the decision? And we cannot use a conditional update for the load because it is not being updated? 

     This becomes complex. The procedure might say:

        - For each fact F that the action depends on:
            - If F is not the one we are updating and we don't have a way to conditionally update the action based on F, then we must re-verify F if it is volatile and the cost of error is high.

     Since the load is volatile and the cost of error is high, we must re-verify the load if it is a critical input to the decision.

     So the procedure might lead to a mix: conditionally update the deployment (so no need to re-verify the deployment) but re-verify the load.

   Case 3: Agent drafting a reply that relies on a fact from a document fetched earlier in the same conversation, in a session where a human is editing that document concurrently.

     Q1: Immutable? No, the document is being edited.
     Q2: Lightweight check? Maybe. If the document system has a version or last-modified timestamp, we can check that. But if the agent doesn't have that in cache, then it would have to re-fetch the document? Or at least the metadata. Let's assume we don't have a version in the cache.
     Q3: Volatility: During the session, the human is editing, so high volatility at the moment.
     Q4: Cost of re-verification: Re-fetching the document might be expensive (if it's large) and slow. But if we have a version check, then it's cheap.
     Q5: Cost of acting on stale fact: Depends on the fact. If it's a critical fact (like a legal clause) then high. If it's a minor detail, then low.
     Q6: Concurrent modification: Yes, the human is editing concurrently.
     Q7: TTL: If we fetched the document 5 minutes ago and the human has been editing, then it's stale.

     Decision:
        - If we can do a lightweight check (Q2) and we have the version, then do that. If the version hasn't changed, use the cache. Otherwise, re-fetch.
        - If we don't have a lightweight check, then:
            - If the cost of error is high (Q5), we must re-fetch the document (or at least the part containing the fact) even if expensive.
            - If the cost of error is low, we might use the cached fact.

     But note: the agent is drafting a reply. We might design the system so that the draft is reviewed by a human (who would catch the error) and the cost of having to re-draft is medium? Then the cost of error is reduced.

     Therefore, if the cost of error is medium or low, we might use the cache. But if the fact is critical (like a number in a contract) then we must re-verify.

     Also, we might consider: can we lock the document during the conversation? That would prevent concurrent edits. But that might not be possible.

     This case might be one where the procedure leads to a judgment call: if the fact is critical, re-verify. Otherwise, use the cache and note the risk.

   Now, the case that the user won't like:

     Consider a variation of case 1: The agent has cached the customer's plan tier and is about to offer a refund policy. The re-verification is expensive because the user service is down and the backup system is slow (taking 30 seconds). The cost of error is high, but the current session is time-sensitive and the customer is waiting.

     The procedure says: because the cost of error is high, we must re-verify. But if re-verification is too expensive (or in this case, too slow) and we cannot proceed without the fact, then we must either:

          a) Wait for the re-verification (and risk a slow response) OR
