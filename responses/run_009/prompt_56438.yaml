     This might be unacceptable in a time-sensitive session. So the business might decide to accept the risk of using the cache. But note: the procedure flags this as a high-risk situation and requires either re-verification or human intervention.

     Therefore, the procedure might lead to a situation where we have to make the session slower or escalate, which the business might not like.

   Honesty note:

     The frame problem in its original form is about the difficulty of representing what does not change in a formal action model. In our case, we are not building a formal model of the world but dealing with real-world data that changes. The connection is that we are facing the same issue: we cannot re-verify everything, so we need a way to determine what is still valid. However, the classical frame problem was about deduction in a closed world, while we are in an open, distributed, and dynamic world.

     The qualification problem (listing all preconditions) is relevant because we cannot list all the reasons why a fact might become invalid. Therefore, we rely on heuristics (like TTLs, version checks) and risk assessment.

     The procedure above is a practical risk-based checklist. It does not solve the frame problem in the philosophical sense (which is undecidable in general) but provides a way to manage the risk in engineering terms.

     Some parts are judgment calls dressed as a checklist (e.g., volatility assessment, cost of error). We must document that these require domain knowledge and sometimes business input.

     If the team does not have the data to answer the questions (like volatility), then the procedure may default to re-verification (if the cost of error is high) or to using the cache (if the cost of error is low and re-verification is expensive). But without data, it's a guess.

     The philosophy connection: The frame problem shows that we cannot have a complete set of rules for what remains unchanged. Therefore, we must rely on approximations and risk management. The qualification problem shows that we cannot list all preconditions, so we cannot have a complete set of invalidation triggers. Hence, the procedure uses heuristics and risk.

     Therefore, the procedure is not a formal solution but a practical risk-management framework. It earns its place by forcing the engineer to consider the key factors that the frame problem and qualification problem highlight: the difficulty of knowing what changes and the impossibility of a complete rule set.

     However, note: much of this is also standard in cache-invalidation engineering. The philosophy just reminds us why it's hard and why we must rely on heuristics and risk.

     Final decision procedure for the runbook:

     **Fact Validation Decision Procedure**

     When an agent is about to act on a cached or assumed fact F, ask:

     1. **Immutability**: Is F inherently immutable? (e.g., a historical fact that cannot change)
          - If yes, use the cache. (But be cautious: very few facts are truly immutable in business contexts.)

     2. **Lightweight Check**: Can we verify F's freshness with a cheap, strong consistency check? (e.g., an ETag, last-modified timestamp, or version number)
          - If yes, perform the check:
              - If it passes, use the cache.
              - If it fails, update the cache from source and use the new value.
          - If no, proceed to next.

     3. **Volatility**: How often does F change? (Consider domain knowledge and historical data)
          - Low volatility and the time since last verification is short (e.g., within a TTL that is set based on expected change frequency) -> consider using cache (proceed to cost assessment).
          - High volatility -> we likely need to re-verify (unless the cost of re-verification is prohibitive and the cost of error is low).

     4. **Re-verification Cost**: How expensive (in time, resources, latency) is it to re-verify F?
          - Low cost: re-verify if there is any doubt (especially if volatility is medium/high or cost of error is not low).
          - High cost: we try to avoid re-verification if we can.

     5. **Cost of Error**: What is the business impact if F is stale?
          - High (e.g., financial, legal, safety, major customer impact): we must have strong assurance of freshness. If we don't have it from step 2, then re-verify even if expensive. If re-verification is too expensive or impossible, escalate to a human or abort the action.
          - Low: we might use the cache if re-verification is expensive.

     6. **Concurrency**: Is there a possibility that F was modified by another actor since we cached it?
          - If yes and we don't have a way to detect conflicts (step 2) and the cost of error is not low, then re-verify.

     7. **TTL/Probabilistic Freshness**: Do we have a TTL or freshness model?
          - If the fact is within TTL (or otherwise likely fresh), then we can use the cache if the cost of error is low to medium.
          - If beyond TTL, then we re-verify (if cost of error is not low) or use with caution.

     8. **Business Policy**: Is there a business rule that mandates re-verification? (e.g., for financial facts, always re-verify)

     9. **Safe Action Design**: Can we structure the action so that it is safe even if F is stale? (e.g., conditional updates, idempotency, or compensating actions)
          - If yes, then we might not need to re-verify F. But note: we must ensure that the action is indeed safe.

     **Decision**:

     - If steps 1 or 2 (with a passing check) allow using the cache, then use it.
     - If the cost of error (step 5) is high and we don't have strong assurance of freshness (from step 2) and we cannot design a safe action (step 9), then:
          - Re-verify if feasible (even if expensive).
          - If re-verification is not feasible (too expensive, or impossible), then escalate to a human or do not perform the action.
     - If the cost of error is low and the re-verification cost is high, then use the cache (but log a warning if volatility or concurrency risk is present).
     - If volatility is high (step 3) and the cost of error is not low and we don't have a passing step 2, then re-verify.
     - If we are beyond TTL (step 7) and cost of error is not low, then re-verify.

     **Human Judgment**:

     - When the cost of error is high and re-verification is impossible or too expensive, escalate to a human.
     - When volatility, concurrency risk, or cost of error are in a gray area, and the engineer is unsure, escalate to a human or a business decision maker to determine the risk appetite.

     **The procedure cannot help**:

     - When we have no information about volatility and no way to get it, and the cost of error is unknown, then we cannot decide. We must either:
          - Always re-verify by default (if the domain is high-risk) OR
          - Escalate to set a policy for this fact.

     **Marking Judgment Calls**:

     - Steps 3 (volatility) and 5 (cost of error) are inherently judgment-based. They require domain knowledge and sometimes business input. The runbook should note that these must be assessed by someone with appropriate context.
     - Step 7 (TTL) requires historical data analysis to set appropriately; otherwise, it's a guess.

     This procedure does not solve the frame problem in general but provides a structured way to manage the risk of stale data in a practical setting.
answer: |-
  ### Decision Procedure for Cached Fact Validation in LLM Agents

  This procedure translates insights from the frame problem (how to determine what remains unchanged after an event) and the qualification problem (the impossibility of listing all preconditions) into actionable engineering steps. The core challenge: **You cannot exhaustively predict what might invalidate a fact, so focus on risk and cost tradeoffs.** Apply this checklist *when an agent is about to act* on a cached/assumed fact.

  ---

  #### **Step 1: Is the fact immutable?**  
  **Question:** *Could this fact *ever* change during the agent’s session?*  
  - **Proceed if:**  
    - Fact is definitionally immutable (e.g., "π ≈ 3.14", "transaction ID X occurred at time T").  
  - **Re-verify if:**  
    - Any possibility of change exists (e.g., customer tier, cluster state).  
  - **Judgment call:** Many facts *feel* immutable but aren’t (e.g., "customer’s signup date" might change if data is corrected). Default to "no" unless mathematically/logically locked.  
  - **Philosophy connection:** Addresses the frame problem by filtering truly invariant facts—rare in dynamic systems.

  ---

  #### **Step 2: Can you detect staleness cheaply?**  
  **Question:** *Is there a low-cost way to check freshness (e.g., version number, timestamp, checksum)?*  
  - **Proceed if:**  
    - Lightweight check passes (e.g., ETag matches, resourceVersion unchanged).  
  - **Re-verify if:**  
    - Check fails or is unavailable.  
  - **Hand to human if:**  
    - Check is expensive/risky (e.g., querying a overloaded DB). Ask: "Is the cost of staleness detection worth the risk?"  
  - **Philosophy connection:** Mitigates the qualification problem by using observable proxies for change instead of predicting all preconditions.

  ---

  #### **Step 3: What is the cost of error?**  
  **Question:** *If this fact is stale, what’s the worst-case outcome?*  
  - **Proceed if:**  
    - Cost is low (e.g., minor UI inconsistency, non-business-critical output).  
  - **Re-verify if:**  
    - Cost is high (e.g., financial loss, security breach, broken infrastructure).  
  - **Hand to human if:**  
    - Cost is unknown or business-risk-dependent (e.g., "Is a 5% chance of offering an invalid $100 refund acceptable?").  
  - **Judgment call:** Requires domain knowledge. Err toward re-verification for irreversible actions.  

  ---

  #### **Step 4: How volatile is the fact?**  
  **Question:** *How often does this fact change in practice?*  
  - **Proceed if:**  
    - Low volatility (e.g., "cluster schema version" changes weekly).  
  - **Re-verify if:**  
    - High volatility (e.g., "cluster CPU load" changes every second).  
  - **Hand to human if:**  
    - Volatility is unknown. Ask: "Is this fact stable enough to cache for X minutes?"  
  - **Philosophy connection:** The frame problem shows we can’t *deduce* volatility from first principles—measure it empirically.

  ---

  #### **Step 5: Can concurrent modification occur?**  
  **Question:** *Could external actors (humans/other agents) modify this fact?*  
  - **Re-verify if:**  
    - Concurrency is possible *and* Step 2/3 indicate risk (e.g., humans editing a live document).  
  - **Proceed if:**  
    - Fact is agent-private (e.g., internal reasoning scratchpad).  
  - **Judgment call:** Assume "yes" for shared resources (Kubernetes clusters, customer DBs) unless isolated by design.

  ---

  #### **Step 6: Can you act idempotently?**  
  **Question:** *Can the action be designed to fail safely if the fact is stale?*  
  - **Proceed if:**  
    - Action is idempotent (e.g., Kubernetes `kubectl apply` with version checks).  
  - **Re-verify if:**  
    - Action is unsafe (e.g., deleting resources based on stale state).  
  - **Philosophy connection:** Classical AI’s solution to the frame problem—design actions to self-validate preconditions.

  ---

  #### **Final Decision Flow**  
  1. **Re-verify now** if Step 1 fails AND (Step 2 fails OR Step 3=high OR Step 4=high OR Step 5=yes).  
  2. **Proceed with cache** if Step 1 passes OR (Step 2 passes AND Step 3=low AND Step 4=low).  
  3. **Hand to human** if:  
     - Step 3 or 4 are unknown/risky AND cost of re-verification is prohibitive.  
     - Business risk tolerance is needed (e.g., "Is $1,000/mo in wasted cloud spend acceptable for faster responses?").  
  4. **Procedure cannot help** if:  
     - Volatility (Step 4) is unknown AND cost of error (Step 3) is unknown.  
     - *This is common—default to re-verification or time-bound caching.*

  ---

  ### Case Studies from Your Backlog

  #### **Case 1: Customer Tier for Refund Policy**  
  - **Step 1:** Immutable? No (tiers can change mid-session).  
  - **Step 2:** Cheap staleness check? Likely (e.g., customer DB version). → **Re-verify if check fails.**  
  - **Step 3:** Cost of error? High (wrong refund = financial/reputational risk). → **Re-verify.**  
  - **Step 4:** Volatility? Low (tiers rarely change hourly). → *But overridden by Step 3.*  
  - **Step 5:** Concurrency? Yes (admin/sales tools can update tier). → **Re-verify.**  
  - **Step 6:** Idempotent? No (refund can’t be undone).  
  - **Decision:** **Re-verify.** This is the answer you won’t like—it adds latency, but avoids silent failures.  

  #### **Case 2: Kubernetes Cluster State Before Resizing**  
  - **Step 1:** Immutable? No.  
  - **Step 2:** Cheap check? Yes (K8s resourceVersion). → **Re-verify if version changed.**  
  - **Step 3:** Cost of error? High (scaling errors can cause outages). → **Re-verify if Step 2 fails.**  
  - **Step 4:** Volatility? High (clusters change constantly). → **Re-verify.**  
  - **Step 5:** Concurrency? Yes (many agents/humans act on clusters). → **Re-verify.**  
  - **Step 6:** Idempotent? Yes (use `kubectl apply` with version checks). → **Proceed with cache if Step 2 passes.**  
  - **Decision:** **Use lightweight version check.** If unchanged, proceed; else re-query. Philosophy win: Idempotence avoids full re-verification.  

  #### **Case 3: Document Fact with Concurrent Human Edits**  
  - **Step 1:** Immutable? No.  
  - **Step 2:** Cheap check? Maybe (e.g., Google Docs edit timestamp). → **Re-verify if check fails.**  
  - **Step 3:** Cost of error? Context-dependent (e.g., high for legal terms, low for typos). → **Hand to human if unknown.**  
  - **Step 4:** Volatility? High (during active editing). → **Re-verify.**  
  - **Step 5:** Concurrency? Yes (human editing). → **Re-verify.**  
  - **Step 6:** Idempotent? No (drafted reply may be sent instantly).  
  - **Decision:** **Re-verify critical facts; proceed with cache for low-risk facts.** If cost is unclear, escalate: "Is it acceptable to use a 5-min-old version of Section 4.2?"

  ---

  ### Honesty Appendix  
  1. **False precision alerts:**  
     - Volatility (Step 4) and cost of error (Step 3) are inherently subjective. The checklist forces explicit consideration but won’t magically quantify them.  
     - "Idempotent" (Step 6) is idealized—many actions are only *partially* safe.  

  2. **Philosophy’s real value—and its limits:**  
     - **Frame problem:** Directly applies. It shows why you can’t "solve" caching with rules like "assume nothing changes"—hence our risk-based heuristics.  
     - **Qualification problem:** Explains why Step 2 (observable change proxies) is better than listing invalidation triggers (e.g., "customer tier changes only when..." is incomplete).  
     - **What philosophy doesn’t fix:** This is *mostly* "cache invalidation engineering," but philosophy justifies why brute-force solutions (always re-verify) or naïve ones (never re-verify) fail. It forces you to confront: *Relevance is undecidable at scale*.  
     - **Verdict:** Use this procedure to *systematize risk-taking*, not eliminate it. The philosophy earns its keep by preventing overconfident solutions—e.g., assuming you can list all "relevant" changes.  

  **Implement next:**  
  - Add required fields to agent facts: `volatility_estimate`, `cost_of_error`, `last_verified`, `version_proxy`.  
  - For high-risk domains, default to Step 6 (idempotent actions) + Step 2 (lightweight checks).  
  - Run a postmortem on Case 1—if re-verification is too slow, optimize the customer tier API.
