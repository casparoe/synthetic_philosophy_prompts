answer: |-
  ### Correspondence Table

  | Source (software)               | Target (morality)                                  | Mapping holds? | Load-bearing for debunking? | Notes                                                                 |
  |----------------------------------|----------------------------------------------------|----------------|-----------------------------|-----------------------------------------------------------------------|
  | Programmer (or absence)          | Absence of intentional designer (blind evolution) | Yes            | Yes                         | Both lack a truth-aiming creator; central to the "no teleology" point. |
  | Requirements document            | Objective moral truth (moral facts)                | Strained       | Yes                         | Moral facts aren't "written" or accessible like a spec; undermines realism if untrackable. |
  | Tests                            | Natural selection (fitness tests)                  | Yes            | Yes                         | Tests check survival/reproduction, not truth; core to "not aimed at truth" claim. |
  | Commit history                   | Evolutionary history of moral intuitions           | Yes            | Yes                         | Explains origins via adaptation, not truth; key to genealogical debunking. |
  | Code itself                      | Moral intuitions/judgments                         | Yes            | No                          | The output (intuitions/code) is neutral; debunking targets its origin, not content. |
  | Technical debt                   | Maladaptive/mismatched intuitions (e.g., tribalism)| Strained       | No                          | Highlights flaws but doesn't disprove truth-tracking; may be incidental. |
  | Refactoring                      | Moral progress via reasoning                       | Breaks         | No                          | Evolution lacks intentional "refactoring"; moral reasoning may aim at truth. |
  | Archaeologist                    | Evolutionary psychologist/philosopher              | Yes            | Yes                         | Their causal explanation "explains away" without invoking truth; critical to debunking. |

  ---

  ### Critical vs. Incidental Disanalogies  
  **Load-bearing disanalogies (threaten the conclusion):**  
  - **Requirements document**: In software, even without a spec, code can be correct by accident or convergence. In morality, if moral facts exist but are inaccessible to evolution, the absence of a "spec" doesn’t preclude accidental truth-tracking—undercutting the debunking inference.  
  - **Commit history/Archaeologist**: A full causal explanation of software’s origins doesn’t prove incorrectness (e.g., a function may compute correctly despite messy commits). For morals, explaining why an intuition evolved doesn’t entail it’s false—only that its truth wasn’t the *cause*. The debunking leap requires extra premises.  

  **Merely interesting disanalogies (not decisive):**  
  - **Refactoring**: Unlike deliberate code improvements, moral progress via reasoning isn’t "refactoring" in the evolutionary process—but this doesn’t aid debunking.  
  - **Technical debt**: Mismatched intuitions (e.g., outdated disgust responses) resemble technical debt but only show fallibility, not global untrustworthiness.  

  ---

  ### The Missing Premise and Self-Defeat  
  **Your core concern**: Provenance explanations in software never *suffice* to prove incorrectness. For genealogy to debunk morals, the book needs an extra premise:  
  > **"Natural selection is *insensitive* to moral truth: it would have produced the same intuitions *regardless* of what moral facts exist."**  

  **Can this premise avoid self-defeat?**  
  - If evolution is truth-insensitive for morals, why trust *its output* (e.g., reasoning about evolution itself)? The debunker’s cognition is also "legacy code." To avoid self-defeat, the book must argue that:  
    - (a) *Domain-specific insensitivity*: Selection pressures care about fitness, not moral truth, but *might* care about factual truth (e.g., "avoid predators" requires accurate perception).  
    - (b) *External validation*: Science/math can be verified independently (e.g., predicting eclipses), unlike morals.  
  - **Does the analogy help?** It *hurts* the premise: Software often *converges* on correct solutions accidentally (e.g., a physics engine approximating real mechanics via iterative hacks). Similarly, evolution might converge on "true" morals if they promote fitness (e.g., true beliefs about cooperation boost survival). The analogy thus makes insensitivity *harder* to assume.  

  **Verdict**: The premise is needed but self-applies riskily. The book must defend insensitivity without ad hoc exemptions for the debunker.  

  ---

  ### Better Analogy (if needed)  
  A **machine learning model trained on biased data**:  
  - *Source*: A model predicting recidivism using historically skewed crime data.  
  - *Target*: Moral intuitions shaped by fitness, not truth.  
  - *Why better?*: The model’s outputs can be fully explained by data biases (fitness-tracking) and may be inaccurate, yet self-auditing is compromised (the model evaluates itself). This directly illustrates insensitivity and self-defeat.  

