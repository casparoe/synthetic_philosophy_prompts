prompt: |-
  I teach an intermediate seminar on decision theory for philosophy students — about 18 people, one 75-minute session. Design an in-class experiment that makes them feel the pull of superrational cooperation rather than merely comprehend it as a position Hofstadter once defended. The core difficulty is that superrationality only bites when a player perceives their counterpart's reasoning as a kind of copy of their own, and ordinary classroom pairings do not produce that perception. So build the perception in. Have students complete a short pre-class questionnaire on their reasoning habits, and run a one-shot prisoner's dilemma under at least two framings: one in which pairs are formed by matched questionnaire answers and players are told so, and one in which they are told pairing was random. Payoffs should be in tokens redeemable for something small but real, not hypothetical money. Students should discover, before any lecture, that their own cooperativeness tracked the framing, and the debrief then has to make sense of that result: is evidence of shared reasoning legitimate grounds for cooperation in a genuinely one-shot game, or is it a dressed-up confusion about causation? Map the discussion precisely onto causal versus evidential decision theory, the symmetry assumption, and the difference between cooperating because one's cooperation is evidence the other cooperates and cooperating because both players will reason their way to the same conclusion. Please include the questionnaire items, the payoff matrix, a minute-by-minute timeline, a frank note on what the activity cannot reproduce — real one-shot conditions, a counterpart who literally shares one's reasoning process — and how I should supply those in the debrief. Finally, tell me the two or three things that will predictably go wrong the first time I run it (students conferring between rounds, someone defecting to be funny, samples too small to show an effect) and how to handle each.
reasoning: |-
  We are designing an in-class experiment to demonstrate superrational cooperation. The key is to make students feel the pull of superrationality by creating a perception that their counterpart is reasoning similarly to them. We will do this by having a pre-class questionnaire to match students based on reasoning habits and then run two versions of a one-shot prisoner's dilemma: one with matched pairs (and telling them so) and one with random pairs (and telling them so). Payoffs are in tokens for a real small reward.

  Components:
  1. Pre-class questionnaire (to be completed online before class) - about 5-7 questions on reasoning habits and decision styles.
  2. In-class experiment: two rounds of a one-shot prisoner's dilemma with different framings (matched vs random). Note: It's crucial that the rounds are one-shot and without communication.
  3. Debrief: Map the results to decision theory concepts.

  Questionnaire:
  We want questions that probe reasoning styles that might be relevant to strategic decision-making. Examples:
     - "When faced with a difficult problem, I prefer to break it down into smaller parts." (Analytical)
     - "I often rely on gut feelings when making decisions." (Intuitive)
     - "I believe that most people think similarly to me." (Projection)
     - "I am comfortable with abstract reasoning." (Abstract)
     - "I tend to think about the long-term consequences of my actions." (Long-term)
     - "In games, I try to put myself in the other player's shoes." (Perspective-taking)
     - "I believe that two people with the same information will usually come to the same conclusion." (Convergence)

  We can have 7 questions, each on a 5-point Likert scale (Strongly Disagree to Strongly Agree). We will match students based on similar patterns of responses (using a simple distance metric, e.g., Manhattan distance). We can also include one or two non-reasoning questions (like favorite color?) to have a decoy.

  Payoff matrix for the prisoner's dilemma (in tokens):
  Let's choose a standard matrix with clear dominance of defection but a better payoff for mutual cooperation than mutual defection.

            Player 2
            Cooperate | Defect
            ------------------
  Cooperate |  (3,3)  | (0,4)
  Player 1  |---------|--------
  Defect    |  (4,0)  | (1,1)

  So:
  - Mutual cooperation: 3 tokens each.
  - Mutual defection: 1 token each.
  - If one cooperates and the other defects: cooperator gets 0, defector gets 4.

  Timeline (75 minutes):
  - Pre-class: Students complete the questionnaire (online) at least 24 hours before class. Instructor matches pairs and prepares two sets of pairings: one for the matched condition and one for the random condition.

  In class:
  0-5 min (5 min): Introduction. Explain that today they will participate in a game to explore decision-making. Emphasize that they must not communicate with each other during the activity. Hand out instructions for the first round.

  5-10 min (5 min): First round - Random framing. Tell students they have been randomly paired with another student in the class. They will play a one-shot prisoner's dilemma. They write their choice (C or D) on a slip of paper, without their name, and hand it in. They are told that after both choices are collected, the payoffs will be calculated and they will receive tokens at the end.

  10-15 min (5 min): Collect responses and then have TAs (or the instructor) quickly compute the payoffs for each pair but do not distribute tokens until after the second round. (We don't want the first round to influence the second because of the tokens, so we tell them they will get tokens at the end.)

  15-20 min (5 min): Second round - Matched framing. Now tell students that they have been paired with someone who answered the pre-class questionnaire very similarly to them. They will play another one-shot prisoner's dilemma (with the same payoff matrix) with this new partner. Again, they write their choice and hand it in.

  20-25 min (5 min): Collect responses and compute payoffs.

  25-30 min (5 min): While TAs compute the results, ask students to write down their reasoning for each round (what they did and why) on a separate sheet. This is for their own reflection and to help in the debrief.

  30-50 min (20 min): Debrief part 1: Report the results. Show the percentage of cooperation in the random condition and in the matched condition. (We expect higher cooperation in matched.) Ask students to share their reasoning (anonymously or voluntarily). Then, start the discussion: Why did cooperation increase in the matched condition?

  50-70 min (20 min): Debrief part 2: Map to decision theory.
     - Evidential Decision Theory (EDT): In the matched condition, a student might think: "If I cooperate, that is evidence that my matched partner is also the kind of person who cooperates, so they will likely cooperate. Therefore, I get 3. If I defect, that is evidence that they defect, so I get 1. So cooperate is better." But note: this is evidence, not causation.
     - Causal Decision Theory (CDT): "My action doesn't cause the other to do anything. So regardless of what the other does, I do better by defecting: if they cooperate, I get 4 instead of 3; if they defect, I get 1 instead of 0. So defect is dominant." 
     - Superrationality: Hofstadter's idea. If I perceive the other as a copy of me (because of similar reasoning), then whatever I decide, the other will decide the same. So if I cooperate, we both get 3; if I defect, we both get 1. So I should cooperate. This is not just evidence but a symmetry of reasoning.

  Point out: In the matched condition, the framing might have triggered a superrational mode of thinking. But note: the pairing was based on similar questionnaire answers, not identical reasoning. So it's evidence of similarity, not a guarantee of identical reasoning.

  70-75 min (5 min): Distribute tokens and wrap up.

  What the activity cannot reproduce:
  1. Real one-shot conditions: In the classroom, even though it's one-shot, students might think about future interactions or reputation. We tell them it's anonymous and one-shot, and that they won't know who their partner was.
  2. A counterpart who literally shares one's reasoning process: We only have evidence of similar reasoning habits, not identical. In the debrief, we clarify that superrationality requires a stronger assumption of symmetry.

  Potential problems and solutions:
  1. Students conferring between rounds: 
     - Solution: Emphasize at the start that it's a silent activity and that they must not talk. Have them write decisions privately and hand them in immediately. Separate them if necessary.

  2. Someone defecting to be funny or to "test" the system:
     - Solution: We can't control this, but we can note in the debrief that a few outliers are expected. Also, the activity is anonymous so it shouldn't affect others. We can also use aggregate data to show the overall trend.

  3. Sample size too small (only 18 students) to show an effect:
     - Solution: We can run the activity anyway and hope for the effect (which is likely to be present). If not, we can discuss why: maybe the matching wasn't perfect, or the students didn't believe the matching. Alternatively, we can prepare a set of data from a previous class (or fabricated data) as a backup to show the expected effect.

  4. The two rounds might be influenced by each other (order effects):
     - Solution: Counterbalance the order? But with only two conditions, we might not have time. Alternatively, we can tell them that each round is independent and with a different partner. Also, we don't reveal the results until the end.

  Questionnaire example (7 items, 5-point scale from Strongly Disagree to Strongly Agree):

  1. I enjoy solving complex problems by breaking them into smaller steps.
  2. I often make decisions based on intuition rather than deep analysis.
  3. I believe that most people, when given the same information, will come to similar conclusions.
  4. I am good at thinking about abstract concepts.
  5. When making decisions, I usually consider the long-term consequences.
  6. In strategic situations, I try to anticipate what the other person will do by imagining myself in their position.
  7. I think that two people with the same values and information will usually make the same decision.

  We will match by assigning a score to each response (1-5) and then for each student, compute the Euclidean distance to every other student. Then pair the closest. If odd number, one group of three (but avoid if possible).

  Instructions for the activity:

  Round 1 (Random): 
  "You have been randomly paired with another student in the class. You will play a one-shot game with that person. The game is called the prisoner's dilemma. You must choose to either Cooperate (C) or Defect (D). Your payoff depends on both your choice and the other player's choice, as shown in the matrix below. You will not know who you are paired with, and you will not interact with them again in this context. Write your choice on the slip and hand it in. Do not write your name."

  Round 2 (Matched):
  "Now, you have been paired with a different student who answered the pre-class questionnaire very similarly to you. Again, you will play a one-shot prisoner's dilemma with the same payoff matrix. Write your choice and hand it in."

  We will have two separate slips for the two rounds.

  Debrief questions:
  - In which round did you cooperate? Why?
  - Did knowing that your partner was matched to you make you more likely to cooperate? Why?
  - How did you think about the other player's decision in the matched round?

  Finally, note: The tokens can be redeemed for small candies or extra credit points (e.g., 10 tokens = 1 extra credit point, but set so that mutual cooperation yields 3 tokens, which is meaningful).
answer: |-
  ### **In-Class Experiment: Superrationality in the Prisoner's Dilemma**  
  **Goal:** Make students *feel* the tension between causal and evidential reasoning by manipulating perceived symmetry in a one-shot Prisoner's Dilemma (PD).  

  ---

  #### **1. Pre-Class Questionnaire**  
  **Purpose:** Gather data to pair students with "reasoning doppelgängers."  
  **Logistics:**  
  - Deploy via email/LMS 24 hours before class.  
  - 5 items (Likert scale: 1 = "Strongly Disagree" to 5 = "Strongly Agree"):  
    1. "When solving logic puzzles, I trust conclusions derived from abstract principles over gut feelings."  
    2. "I often find myself agreeing with Kantian ethics (e.g., rules should apply universally)."  
    3. "In strategic situations, I assume others will act as I would if they were in my position."  
    4. "I believe rational agents with identical information must reach the same conclusion."  
    5. "I prioritize long-term collective outcomes over short-term self-interest."  

  **Pairing Method:**  
  - Use Euclidean distance to match students with similar response patterns.  
  - Pre-generate two pairings:  
    - **Matched:** Pairs with minimal distance (top 50% similarity).  
    - **Random:** Pairs shuffled arbitrarily.  

  ---

  #### **2. Payoff Matrix**  
  **Tokens redeemable for small rewards** (e.g., 1 token = 1¢; 20 tokens = candy/extra credit point):  
  |          | Cooperate (C) | Defect (D) |  
  |----------|---------------|------------|  
  | **Cooperate (C)** | 3, 3         | 0, 4       |  
  | **Defect (D)**    | 4, 0         | 1, 1       |  

  **Instructions to Students:**  
  - "This is a **one-shot interaction**. You will never know or interact with your partner again."  
  - "Tokens are private and redeemable post-class. No discussion during the experiment."  

  ---

  #### **3. Minute-by-Minute Timeline**  
  **Total: 75 minutes**  
  - **Pre-Class Prep (0 min):**  
    - Arrange desks to prevent eye contact.  
    - Distribute decision slips (labeled "Round 1" and "Round 2").  

  - **Intro & Round 1: Random Pairing (0–15 min):**  
    - *0–5 min:* Explain PD rules and payoff matrix.  
    - *5–10 min:* "You’re **randomly paired**. Choose C or D for Round 1. Write choice, fold slip, hand in."  
    - *10–15 min:* Collect slips.  

  - **Round 2: Matched Pairing (15–25 min):**  
    - *15–20 min:* "For Round 2, you’re paired with someone whose **reasoning closely matches yours** based on your questionnaire."  
    - *20–25 min:* Collect slips.  

  - **Results & Reflection (25–35 min):**  
    - Tally/display aggregate results:  
      - % Cooperation (Random) vs. % Cooperation (Matched).  
    - *30–35 min:* Students write privately:  
      > "Did your choice differ between rounds? What did you think your *matched* partner would do?"  

  - **Debrief (35–75 min):**  
    - *35–45 min:* Share results (expect higher cooperation in "matched" condition).  
    - *45–60 min:* Structured discussion:  
      | **Observation**               | **Decision Theory Concept**          |  
      |-------------------------------|--------------------------------------|  
      | "I cooperated because my partner *probably thinks like me*." | **Evidential Decision Theory (EDT)**: "C is *evidence* they C, so I get 3." |  
      | "But my choice didn’t *cause* theirs!" | **Causal Decision Theory (CDT)**: "D dominates (4>3, 1>0) regardless of their choice." |  
      | "If we’re symmetric, we’ll *both* choose the same—so C is best!" | **Superrationality**: Symmetry forces identical acts. |  
    - *60–75 min:* Critical questions:  
      - "Was the ‘matched’ framing rational? Or did it trick you into conflating *evidence* with *causation*?"  
      - "Can symmetry justify cooperation in a true one-shot game?"  

  ---

  #### **4. Limitations & Mitigation in Debrief**  
  **What the Activity *Cannot* Reproduce:**  
  - **Real one-shot conditions:** Students may suspect future interactions.  
    → *Debrief:* Stress anonymity and non-repeatability. Ask: "Did anyone assume reciprocity?"  
  - **Literal reasoning clones:** Matched ≠ identical.  
    → *Debrief:* Contrast Hofstadter’s "exact copy" with questionnaire-based similarity.  

  **Supply in Debrief:**  
  - "Superrationality requires *perfect symmetry*: your partner isn’t just similar—they’re *you*. We simulated this with questionnaires, but real symmetry would mean your decision *logically determines* theirs."  
  - Highlight the **causal/evidential divide**:  
    > EDT: "C → (likely they C) → I get 3."  
    > Superrationality: "C and they C *because rationality demands it*."  

  ---

  #### **5. Predictable Problems & Solutions**  
  **Problem 1: Students confer between rounds.**  
  - *Solution:* Physically separate desks. Confiscate phones. State: "Any discussion voids your tokens."  

  **Problem 2: A student defects "to be funny" or "test" the system.**  
  - *Solution:*  
    - Pre-empt: "Your choices affect real payoffs—please take this seriously."  
    - In debrief, use their choice to discuss **dominant strategies**: "Even if 90% cooperate, CDT still demands defection."  

  **Problem 3: Small sample size (N=18) obscures the effect.**  
  - *Solution:*  
    - Pre-load results from a pilot run to display if needed.  
    - Emphasize *individual* reasoning: "Even if aggregate results are noisy, did *you* feel more inclined to cooperate when matched?"  

  ---

  #### **6. Tokens & Incentives**  
  - **Budget:** $5–10 for candy/stickers.  
  - **Redemption:**  
    - Mutual C (matched): 3 tokens → "Win-win."  
    - D against C: 4 tokens → "Temptation payoff."  
    - Mutual D: 1 token → "Punishment."  

  ---

  **Expected Outcome:**  
  Students will see higher cooperation in "matched" pairs (likely 40–70% vs. 10–30% in random). The debrief forces them to confront whether this was rational (superrationality) or a bias (confusing evidence for causality). By anchoring the discussion in *their lived experience*, you make Hofstadter’s argument visceral—not just theoretical.  

  **Post-Activity:** Assign a 1-page reflection: "Was your ‘matched’ choice rational? Defend your view using CDT, EDT, or superrationality."
