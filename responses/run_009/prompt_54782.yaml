  I'm a CS major taking a philosophy of language elective as my last breadth req, and we just hit the Liar paradox ("this sentence is false") along with the main escape routes -- Tarski's hierarchy of object language and metalanguage, Kripke's fixed-point construction with grounded and ungrounded sentences, and the revision theory guys who keep re-evaluating truth values over and over. I mostly zone out in lecture but I write compilers for fun, so I'd like you to restate these theories in vocabulary I actually use. Tarski sounds like a type system that forbids self-application, Kripke sounds like evaluating an expression that returns undefined because its dependency cycle never gets a base case, revision theory sounds like some iterative fixpoint computation that never converges -- but I suspect each of those glosses is subtly wrong or loses something. So do the translation carefully: for each of the three (plus the paraconsistent/glut approach if it's easy), give me the PL counterpart as precisely as you can, then the residue report -- what part of the philosophical position doesn't map onto anything in how I think about programs, whether that's because PL is missing a concept or because the philosophers are confused, and whether the stuff that got distorted in translation actually matters. Please answer in continuous prose, no headings or bullet points, just like an email.
