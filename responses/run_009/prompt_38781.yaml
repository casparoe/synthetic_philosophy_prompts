answer: |-
  ## Philosophy Quiz: What's Mary Really Learning?

  ### Preamble
  Remember Mary, the brilliant scientist raised in a black-and-white room? She knows every physical fact about colour and vision. When she finally steps out and sees a red rose for the first time, does she learn anything genuinely new? This quiz probes your intuitions about such cases. Answer based on what seems true to *you* about the scenarios described, not philosophical labels. Your answers will reveal where you stand in the debate about consciousness and physicalism.

  ### The Quiz

  1.  **Mary's First Red:** After knowing all physical facts about colour while confined, Mary finally sees a ripe tomato. Does she gain *any* kind of knowledge or understanding she lacked before?
      a) No, she gains nothing truly new; she could have deduced or imagined it perfectly.
      b) Yes, she gains something genuinely new and significant.

  2.  **The Deaf Expert:** Imagine someone deaf from birth who masters every physical fact about sound waves, the auditory system, and violin acoustics. They have never heard a sound. Do they know what a violin *sounds like*?
      a) Yes, they know everything there is to know about it.
      b) No, there's something crucial missing about the experience itself.
      c) They know *all the facts*, but they lack the direct experience of hearing it.

  3.  **The Seeing Child:** A young child has seen red objects but knows little science. Mary (pre-release) knows all the physical science about red light, the eye, and the brain, but has never seen red. Does the child know something about "what red looks like" that Mary does *not*?
      a) No, Mary's scientific knowledge encompasses everything the child knows, and more.
      b) Yes, the child possesses a kind of knowledge about red's appearance that Mary lacks, precisely because the child has seen it.

  4.  **Blue Banana Trick:** Suppose Mary is released, but as a trick, the first coloured object she sees is a *blue* banana (bananas are typically yellow). She knows bananas are yellow. When she sees the blue banana, she thinks "Ah, so *this* is what yellow looks like!" Is she actually learning what yellow looks like?
      a) Yes, she's having a genuine colour experience and learning what *something* looks like.
      b) No, she's fundamentally mistaken; she's learning what *blue* looks like, not yellow. Her belief about *which* colour she's experiencing is wrong.
      c) She's gaining the *ability* to recognise blue, but her belief that it's yellow is false.

  5.  **Meeting the Famous Person:** You've meticulously studied a complete dossier on a famous philosopher: their biography, writings, recorded speeches, personality traits, habits – every publicly available fact. You then meet them in person and interact. Did you learn anything genuinely new *about the philosopher* during that meeting?
      a) No, I learned no new *facts* about them; I just experienced them directly.
      b) Yes, I gained a new kind of understanding or acquaintance with them, even if no new propositional facts.
      c) Yes, I likely learned some new propositional facts about their mannerisms or presence not captured in the dossier.

  6.  **Mary's Reaction:** Upon seeing red, Mary exclaims, "So *that's* what everyone was going on about!" What best captures what she's expressing?
      a) She's reporting a new fact: "The experience of red is *this*."
      b) She's signalling she's now acquired a new ability: "I can now recognise and imagine red experiences."
      c) She's expressing the achievement of a direct connection or acquaintance with the thing itself.

  7.  **Knowing How vs Knowing That:** When Mary sees red, is the new thing she gains best described as a new *skill* or *ability* (like knowing *how* to recognise red or imagine it), rather than learning a new *fact*?
      a) Yes, it's entirely about gaining new abilities.
      b) No, it's about learning a new *fact* about what the experience is like.
      c) It's neither; it's achieving a direct, non-propositional relation to the experience itself.

  8.  **Old Fact, New Way?:** If Mary *is* learning a new fact upon seeing red ("Red experiences are like *this*"), is this fact something she *already* knew before, but only knew it under a different, less direct description (like a brain state description)?
      a) Yes, it's the same fact she knew physically, just presented in a new, subjective way.
      b) No, it's a completely new fact she didn't know before.

  9.  **The Physical World Complete?:** If Mary *is* learning a genuinely new fact upon seeing red (not just a new way of knowing an old fact), does this new fact concern something that is ultimately *physical* (part of the physical world described by science)?
      a) Yes, it must be about the physical brain or its states, even if current science missed it.
      b) No, it seems to be a fact about a non-physical aspect of reality – the subjective feel itself.

  ### Scoring Key
  Count your answers. Your position is determined by the path your answers trace through the logical tree:

  | **Answer Pattern**                                                                 | **Position**                    | **Key Proponents**                       | **Description**                                                                                                                               |
  | :--------------------------------------------------------------------------------- | :------------------------------ | :--------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1a** (No gain)                                                                   | **Illusionism / Deductionism**  | Daniel Dennett                           | Mary gains nothing truly new; phenomenal experience is illusory or fully deducible from physical facts.                                       |
  | **1b + 7a** (Gain is Ability)                                                      | **Ability Hypothesis**          | David Lewis, Laurence Nemirow            | Mary gains new abilities (to recognise, imagine, remember), not new knowledge *that* something is the case.                                   |
  | **1b + 7c** (Gain is Acquaintance)                                                 | **Acquaintance Theory**         | Bertrand Russell (inspired), others      | Mary gains direct, non-propositional acquaintance with the phenomenal quality itself, distinct from knowing facts *about* it.                 |
  | **1b + 7b + 8a** (Gain is Propositional, but Old Fact)                             | **Phenomenal Concept Strategy** | Brian Loar, David Chalmers (early), many | Mary learns the *same* physical fact she knew before, but under a new, irreducible, subjective "phenomenal concept" (`this` experience).      |
  | **1b + 7b + 8b + 9a** (Gain is New Propositional Fact, Physical)                   | **New Fact Physicalism**        | Michael Tye, Michael Lockwood?           | Mary learns a genuinely new fact about her own brain state/process, showing her pre-release physical knowledge was incomplete.                |
  | **1b + 7b + 8b + 9b** (Gain is New Propositional Fact, Non-Physical)               | **Property Dualism**            | Frank Jackson (1982)                     | Mary learns a genuinely new, non-physical fact about subjective experience (`qualia`), showing physicalism is false.                          |
  | *(Answers implying Gain from Meeting (5b/c) usually align with Acquaintance or New Fact views; "That's What..." (6) clarifies the type of gain.)* |                                 |                                          |                                                                                                                                               |

  **Important Notes:**
  *   **2b/c & 3b:** Strong indicators that you think Mary gains *something* epistemic (leading away from 1a).
  *   **4b/c:** Suggests the experience itself carries specific content not fully determined by prior knowledge/expectation (troubles some forms of Deductionism/Phenomenal Concept Strategy).
  *   **5a:** Favours Acquaintance or Ability views. **5b:** Favours Acquaintance. **5c:** Favours New Fact views.
  *   **6a:** Favours Propositional/New Fact views. **6b:** Favours Ability Hypothesis. **6c:** Favours Acquaintance Theory.

  ### Blind Spots
  This quiz struggles to perfectly distinguish between the **Phenomenal Concept Strategy (PCS)** and the **Ability Hypothesis (AH)**. Both agree Mary gains something significant (1b) and that it's not a *wholly* new fact about the world (PCS says it's an old fact in new clothing; AH says it's not propositional at all). Answers to Q7 (ability vs propositional) are designed to split them, but intuitions here can be fuzzy. Someone leaning towards PCS might also appreciate the "ability" aspect (Q6b), and vice-versa. Similarly, the line between **Acquaintance** and the subjective element of **PCS** can be subtle. The quiz relies on Q7 (ability vs propositional vs acquaintance) and Q8 (old fact vs new fact) to make these distinctions, but they represent closely neighbouring positions.

  ### Empty Cells
  Several answer combinations point towards unexplored or potentially incoherent positions:
  *   **1a (No gain) + Any 7b/c or 8b or 9b:** Claiming Mary gains *nothing* new (1a) but also gains propositional knowledge (7b), acquaintance (7c), or a new fact (8b/9b) is contradictory. You can't consistently hold both.
  *   **1b + 7a (Ability) + 8a (Old Fact):** Saying Mary gains only abilities *and* that she's learning an old fact in a new way is confusing. If it's just abilities, why call it an "old fact" known differently? This mix seems unattractive and unstable.
  *   **1b + 7c (Acquaintance) + 8a (Old Fact):** Acquaintance is typically seen as non-propositional, while knowing an "old fact" is propositional. Combining direct acquaintance with the claim that it's just a new mode for an old propositional fact is conceptually strained and rarely defended. Most acquaintance theorists see it as distinct from propositional knowledge.

  This quiz maps the core logical terrain of responses to Mary's revelation, using your intuitions about concrete cases to place you within the debate, avoiding the jargon that often clouds it.
