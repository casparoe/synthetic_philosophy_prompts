prompt: |-
  I lead a three-person technical due-diligence group at a venture fund that backs startups whose engineering rests on young science — quantum hardware, compact fusion, synthetic biology. Before each investment the team produces a one-page reality memo for every load-bearing scientific posit in a company's plan, classifying it as either bedrock (safe to underwrite the investment on), scaffolding (a working device that could be revised without the company's core value proposition dying), or load-bearing-and-fragile (the plan dies if the posit falls). We have about two weeks per deal, and the investment committee wants a definite verdict on each posit, not a survey of options.

  One colleague of mine takes the pessimistic meta-induction seriously — the observation that many posits of past science that were empirically successful (the ether, caloric) were later discarded, so some of ours presumably will be too — and has derived from it what he calls the depreciation heuristic: treat confidence in a posit like a depreciating asset that decays with time since the posit's last novel predictive success, where a novel prediction means one that risked failure, not a fit to data the posit was invented to accommodate. Another colleague counters with something like entity realism: if engineers have to treat the posit as a real, manipulable thing in order to make instruments and processes work at all, treat it as bedrock regardless of how long it has been since anyone wrung a risky prediction out of it.

  Please write a decision procedure my team can actually run on a single posit within a day: the questions to ask, in order; what counts as a sufficient answer to each; where the procedure stops with bedrock, where with scaffolding, and where it hands the decision to a person because the remaining question is one of values — how much risk we are willing to concentrate on one fragile posit — rather than of fact. The procedure should incorporate, amend, or explicitly reject the depreciation heuristic, and you must take a definite position on which of those three to do and defend it, rather than laying out the options and leaving the choice to us. Then run the procedure on two hypothetical posits: (a) a startup whose plasma-confinement scheme rests on a mechanism with a twenty-year record of fitting data but no genuinely risky predictions, which the engineers nevertheless manipulate daily in building their hardware; and (b) a startup resting on a posit that made one startling novel prediction last year, since confirmed, but which no one can yet manipulate or use to intervene in anything. At least one of these should come out in a way my team will find unwelcome — say which, and why the procedure nonetheless yields that answer. Finally, tell me where the procedure is most likely to misfire and which of its steps are judgment calls dressed up as procedure.
reasoning: |-
  Okay, the user leads a technical due-diligence team at a venture fund that invests in cutting-edge science startups. They need a decision procedure to evaluate scientific posits quickly—within a day per posit—classifying them as bedrock, scaffolding, or load-bearing-and-fragile. The team has two conflicting viewpoints: one colleague uses a "depreciation heuristic" based on the pessimistic meta-induction, where confidence decays over time without novel predictions. The other advocates for "entity realism," where manipulability indicates bedrock status regardless of predictive history.

  First, I need to design a procedure that resolves this conflict. The depreciation heuristic seems flawed because it ignores current practical utility, which is crucial for engineering-focused startups. Entity realism is more aligned with the hands-on nature of these companies. So, I'll explicitly reject the depreciation heuristic but incorporate time since last novel prediction as a secondary check only if manipulability is absent.

  The procedure must be efficient—executable in one day—with clear stopping points. It should start with manipulability since that's actionable for engineers. If a posit is manipulable, it's likely bedrock. If not, then check for novel predictions. If neither exists, it's fragile. Scaffolding sits in the middle, where the posit can be revised without collapsing the company's value proposition.

  For the hypotheticals:  
  (a) Plasma-confinement mechanism: Manipulable daily but no novel predictions in 20 years. By prioritizing manipulability, this should be bedrock. The depreciation heuristic would downgrade it, but entity realism prevails.  
  (b) New posit with a recent novel prediction but no manipulability: This is fragile. Even though the prediction is recent, the lack of engineering control makes it risky.  

  The unwelcome outcome is (b) being fragile, as the team might be excited by the novel prediction but the procedure highlights intervention risk.  

  The procedure's weaknesses include subjectivity in assessing "manipulation" and "revisability." Also, time constraints might lead to rushed judgments. Clear anchors like patents or device specs can reduce ambiguity.  

  Finally, I'll structure the decision tree with specific questions, sufficient answers, and classifications. The goal is a defensible, values-explicit process that handles both science and engineering realities.
answer: |-
  Here is a decision procedure for evaluating a single scientific posit within one day, designed to balance philosophical rigor with practical constraints. It **explicitly rejects the depreciation heuristic** (confidence decaying solely with time since novel prediction) as operationally flawed for engineering-focused due diligence. While the meta-induction is valid historically, it fails to account for the *stabilizing effect of successful engineering intervention*, which is a stronger indicator of robustness for a venture betting on near-term hardware. Entity realism provides a better foundation, but requires refinement. The procedure prioritizes **manipulability and intervention** as primary, and treats predictive novelty as secondary evidence only when manipulability is absent.

  **Decision Procedure: The Intervention-First Assessment**

  1.  **Question 1: Is the posit *directly and necessarily* manipulated or intervened upon to achieve a functional output in the startup's core technology?**
      *   **What counts as sufficient?** Evidence of the posit being an *essential causal lever* in a working prototype, process, or instrument *developed by the startup or its direct predecessors*. Documentation must show that changing parameters associated with the posit (e.g., field strength, genetic sequence, plasma configuration) predictably alters a key output metric (e.g., device performance, reaction yield, signal fidelity) in a way crucial to the core value proposition. Engineering drawings, control system logic, experimental run logs demonstrating cause-effect, or patent claims explicitly relying on the posit are strong evidence. Theoretical models or simulations alone are *insufficient*.
      *   **Sufficient Answer (Yes):** Proceed to Question 2.
      *   **Sufficient Answer (No):** Proceed to Question 3.
      *   **Insufficient/Unclear:** Flag as "Investigation Blocked - Manipulability Unconfirmed". Requires immediate escalation to team lead for resource reallocation or IC consultation. Cannot proceed within the day.

  2.  **Question 2: Is the functional output achieved *robustly* across expected operating conditions relevant to the core value proposition?**
      *   **What counts as sufficient?** Data demonstrating consistent cause-effect relationship (manipulation -> output change) over a range of conditions (e.g., temperature, pressure, input power, component variations) that the startup's product *must* handle to be viable. Evidence includes repeated successful test runs, sensitivity analyses showing tolerance to parameter drift, or error-correction schemes explicitly relying on the posit. Evidence of frequent failures or extreme sensitivity to uncontrolled variables is a red flag.
      *   **Sufficient Answer (Yes):** Classify as **BEDROCK**. *Stop.* The posit is treated as a reliable tool; its historical predictive novelty is irrelevant to its current engineering utility and robustness.
      *   **Sufficient Answer (No):** Proceed to Question 4.
      *   **Insufficient/Unclear:** Flag as "Investigation Blocked - Robustness Unconfirmed". Escalate as above.

  3.  **Question 3: Has the posit made *at least one* genuinely novel and risky prediction that was *experimentally confirmed*?**
      *   **What counts as sufficient?** A documented prediction made *before* the relevant experiment/observation, concerning a phenomenon *distinct* from the data the posit was initially designed to explain, where failure of the prediction would have been a serious challenge to the posit. Peer-reviewed publication of the prediction followed by peer-reviewed confirmation (or equivalent industry-standard validation report) is ideal. Pre-registered experiments or clear internal memos predating data collection are acceptable substitutes if public documentation is nascent.
      *   **Sufficient Answer (Yes):** Proceed to Question 4. (Predictive success grants provisional status, but manipulability is absent).
      *   **Sufficient Answer (No):** Classify as **LOAD-BEARING-AND-FRAGILE**. *Stop.* The posit lacks both direct engineering validation *and* strong external predictive validation. It is highly vulnerable.
      *   **Insufficient/Unclear:** Treat as "No". Classify as **LOAD-BEARING-AND-FRAGILE**. *Stop.*

  4.  **Question 4: Could the core value proposition be achieved (even if less efficiently or elegantly) if this specific posit were revised or replaced, while keeping the *fundamental physical effect or engineering principle* intact?**
      *   **What counts as sufficient?** A plausible engineering pathway articulated by the startup's technical leadership or identified by your team, demonstrating that the *underlying phenomenon* (e.g., confinement principle, reaction pathway, quantum effect) could still be harnessed using a different mechanistic model, material, or control strategy. This should not require abandoning the core phenomenon. Evidence includes alternative designs discussed in literature, patents covering similar effects with different mechanisms, or sensitivity analyses showing the output is achievable with a range of parameters/models.
      *   **Sufficient Answer (Yes):** Classify as **SCAFFOLDING**. *Stop.* The posit is useful but not absolutely fundamental; the core value proposition has some resilience.
      *   **Sufficient Answer (No):** Classify as **LOAD-BEARING-AND-FRAGILE**. *Stop.* The posit is essential *and* lacks robust manipulability (Question 2 No) or is the sole validated anchor for an otherwise non-manipulable posit (Question 3 Yes path).
      *   **Insufficient/Unclear/Contentious:** **HAND TO PERSON FOR RISK ASSESSMENT.** This is the **values gate**. The factual assessment is complete (the posit is essential *and* lacks robust manipulability), but the decision now hinges on the fund's risk tolerance: How critical is this single fragile posit to the entire investment thesis? How much loss are we willing to risk if it fails? This requires IC input based on deal context, portfolio strategy, and risk appetite.

  **Rejection of Depreciation Heuristic:** The procedure rejects the heuristic's core premise that time since novel prediction is the primary decay factor for confidence. While novel predictions are valuable *evidence*, especially absent manipulability (Question 3), they are secondary to *engineered control*. A posit successfully manipulated daily in a robust system (Question 1 & 2 Yes) demonstrates profound utility and stability, regardless of when its last novel prediction occurred. The heuristic undervalues engineering reality. Time since prediction is *not* a factor in the procedure.

  **Application to Hypotheticals:**

  *   **(a) Plasma Confinement Mechanism (20-year fit, manipulated daily):**
      1.  **Q1:** Yes. Engineers manipulate it daily to build hardware (sufficient: documented control parameters linked to hardware performance in run logs/design specs).
      2.  **Q2:** (Assumed) Yes. It achieves functional output robustly (sufficient: data showing stable confinement across expected operating ranges in prototype tests). **Result: BEDROCK.**
      *   *Why unwelcome?* Your depreciation-heuristic colleague will be deeply uncomfortable. The posit has "stale" predictive credentials. The procedure overrules this based on active, robust manipulation – the essence of entity realism applied to engineering.

  *   **(b) Startling Novel Prediction (Confirmed last year, not manipulable):**
      1.  **Q1:** No. No one can manipulate or intervene using it.
      2.  **Q3:** Yes. Made a novel, risky prediction confirmed last year (sufficient: peer-reviewed prediction & confirmation).
      3.  **Q4:** ??? *This is the critical step.* Can the core value proposition be achieved if *this specific posit* is revised, while keeping the fundamental phenomenon? This requires intense scrutiny within the day.
          *   *If plausible alternatives exist* (e.g., different models explaining the same confirmed phenomenon/prediction that could underpin the tech): **SCAFFOLDING.**
          *   *If the posit is the *only* validated explanation* for the phenomenon enabling the value proposition, and no alternative paths are evident: **LOAD-BEARING-AND-FRAGILE** (proceed to values gate).
      *   *Why likely unwelcome?* The excitement of a recent, startling prediction is high. However, the lack of manipulability (Q1 No) makes it inherently fragile for engineering. Q4 is the battleground. If no scaffolding path is found within the day, classifying it as Fragile (or sending it to the values gate) will disappoint those hoping the predictive success alone sufficed. The procedure highlights the intervention gap.

  **Where it Misfires & Hidden Judgments:**

  1.  **Q1/Q2 "Manipulation" & "Robustness":** Defining "direct and necessary manipulation" and "robustness" is inherently judgmental. Is tuning a simulation parameter "manipulation"? Is a 5% success rate "robust"? The procedure relies on the assessor's engineering intuition and the *quality* of evidence presented. Anchoring to specific device specs or process outputs helps but doesn't eliminate gray areas.
  2.  **Q4 "Revisability":** This is the most speculative step. Judging whether the *core value proposition* survives a *specific posit* revision requires deep technical imagination and is easily biased by optimism or pessimism. Rushing it in a day increases error risk. The "fundamental phenomenon" distinction is crucial but subtle.
  3.  **"Sufficient" Evidence:** Deciding if documentation (logs, patents, papers) *truly* suffices for Q1-Q3 is a constant judgment call, especially with proprietary or nascent tech. The procedure assumes good-faith access and clarity, which may not hold.
  4.  **Novelty in Q3:** Assessing if a prediction was truly "novel" and "risky" historically can be contentious, requiring expert historical/scientific context that may be lacking in a one-day deep dive on a narrow posit.
  5.  **The Values Gate (Q4 No):** While necessary, it explicitly outsources the hardest risk-concentration decision, acknowledging the procedure's limits. The "facts" stop at identifying essential fragility.

  This procedure prioritizes actionable engineering reality over historical epistemology, explicitly grounding "bedrock" in successful intervention. It forces a clear-eyed view of fragility when intervention is absent, even in the face of exciting predictions, making it a pragmatic tool for high-stakes, time-constrained technical due diligence.
