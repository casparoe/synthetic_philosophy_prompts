prompt: |-
  I'm a journalist covering science and ideas, and there's a pattern I keep running into that I can't figure out how to handle. Every few weeks a source pitches me a story where the stakes are effectivly unlimited: a tech safety person saying a certain kind of AI system, if developed, could kill everyone; a biosecurity guy claiming an engineered pathogen could end civilization; one guy who's dead serious that population decline means hundreds of billions of potential people never get born, which he calls the biggest story of the century. The pitch always has the same shape. The probability is small and everyone admits its a guess — but the harm is so enormous that even a tiny chance swamps everything else on my beat. The math they use is just "huge number times small number still equals huge." And the thing is, if I actually followed that math, I'd run extinction stories basically every week and nothing else, because nothing else has stakes in the same league. Climate, antibiotic resistance, actual wars — all rounding errors next to "everyone dies." When I don't take the bait, I need a reason, and "the number is too big to believe" doesn't seem like one. My editor says just use news judgment, but news judgment is exactly the thing the math claims to override. So my question: is there a principled line between covering a genuinely underrated risk and getting pushed around by someone who noticed they can always name a bigger number than the last guy? If so, where does the line sit — in how they know, how big the claim can get before it stops counting for more, whether it can be checked at all, or somewhere else entirely? And if it turns out there's no principled line and I'm just going to be arbitrating these by feel, I'd honestly rather hear that too.
reasoning: |-
  Okay, let me start by really understanding the journalist's dilemma. They're constantly pitched stories about existential risks—AI wiping out humanity, engineered pathogens, population decline leading to lost potential lives. The sources use a simple math formula: huge harm multiplied by a small probability still equals a huge expected cost. But if they cover every such story, that's all they'd ever report on, drowning out other critical issues like climate change or wars. The journalist needs a principled way to decide which risks are worth covering without defaulting to "news judgment," which feels arbitrary.

  First, I need to unpack why the expected value calculation (Probability x Magnitude) feels overwhelming here. The magnitude is near-infinite, so even tiny probabilities dominate. But there are issues with this approach. The probabilities are often speculative, not based on empirical data. How do these sources arrive at their numbers? If it's just a guess, the variance could be enormous. Also, the magnitude isn't always comparable. Extinction is absolute, but how do you weigh that against non-existential crises that are more immediate?

  Next, I should consider epistemic integrity. How credible are the sources? Do they have domain expertise? Are they part of organizations that might have conflicts of interest? For example, an AI safety researcher might overstate risks to secure funding. Also, is the claim falsifiable? If not, it's harder to take seriously. The population decline argument seems metaphysical—counting potential lives that never existed. That's different from a biosecurity threat with concrete mechanisms.

  Another angle is the actionability of the story. Even if the risk is real, does reporting on it lead to meaningful actions? Or does it just induce paralyzing fear? The journalist mentioned that covering extinction-level stories weekly could desensitize readers, leading to apathy. Focusing on risks with pathways to mitigation might be more productive. For instance, antibiotic resistance has measurable steps for intervention, while preventing an AI apocalypse might be vaguer.

  I recall concepts like Pascal's Mugging, where improbable, massive threats can hijack decision-making. The key is to demand higher standards of evidence as the claimed stakes increase. Also, Knightian uncertainty applies here—distinguishing between measurable risks and true uncertainties without data. Most existential risks fall into the latter category, making probability estimates highly unreliable.

  Looking at policy relevance is another factor. Some risks have institutional frameworks addressing them (like WHO monitoring pathogens), while others don't. Covering a story about a risk that policymakers are already engaged with might have more impact. Additionally, the journalist should assess if the story offers new insights or just rehashes known concerns without adding value.

  The journalist also needs to evaluate the source's track record. Have they made similar predictions that didn't pan out? Are they part of a community with a history of alarmism? On the other hand, ignoring credible warnings because they're alarming could be negligent. Balancing skepticism without dismissal is tricky.

  I think the line lies in the rigor of the argument, not just the numbers. Probabilities derived from models with testable components are more trustworthy. Also, considering the marginal impact of coverage: if the story prompts preventative measures, it's valuable. But if it's the tenth piece on AI doom with no new angles, maybe skip it.

  In conclusion, the journalist should use a framework that scrutinizes the evidence quality, source credibility, falsifiability, and actionability. Setting thresholds for probability estimates and requiring concrete mechanisms can filter out the most speculative claims. It’s not just about the numbers; it’s about the substance behind them.
answer: |-
  You've hit on a core tension in covering catastrophic risks – the conflict between probabilistic reasoning and practical journalism. There **is** a principled line, though it requires careful navigation rather than a single formula. Here's a framework based on epistemic rigor, practical actionability, and avoiding intellectual traps:

  **The Core Problem: Pascal's Mugging for Journalists**
  The "huge number x small number = huge number" argument is essentially **Pascal's Mugging**. It hijacks rational decision-making by threatening infinite stakes with an undefined (but non-zero) probability. In journalism, this forces an impossible choice: cover every low-probability/high-stakes claim obsessively, or ignore them all. Neither is acceptable.

  **Drawing the Principled Line: Key Filters**

  1.  **Epistemic Quality Over Magnitude:**
      *   **Source of Probability Estimate:** Is the "small probability" based on *anything* quantifiable, historical precedent, or model outputs with testable assumptions? Or is it purely a subjective "gut feeling" ("non-zero chance")? **Filter:** Prioritize risks where probabilities (even ranges) are derived from data, peer-reviewed models, or expert consensus *within the relevant field*. Dismiss "it could happen" without *how we estimate how likely*.
      *   **Mechanism & Pathway:** Can the source articulate a *concrete, plausible sequence of events* leading to catastrophe? Does it hinge on multiple independent failures or a single point of failure? **Filter:** Require a falsifiable causal chain. "Superintelligent AI might get goals that conflict with human existence" is vague. "This specific type of unregulated AI system, using current reinforcement learning techniques, could optimize for a proxy goal leading to resource exhaustion in scenario X, as demonstrated in simulation Y" is stronger.
      *   **Falsifiability & Track Record:** Are there observable indicators that would make the risk *more or less likely*? Has the source or their field made similar catastrophic predictions that failed (or succeeded)? **Filter:** Value claims linked to testable evidence or early warning signs. Be wary of claims immune to disconfirmation.

  2.  **Beyond Expected Value - Considering "Knightian Uncertainty":**
      *   Frank Knight distinguished *risk* (measurable probabilities) from *uncertainty* (unmeasurable unknowns). Most existential threats fall into **deep uncertainty**.
      *   **Filter:** Treat claims of precise probabilities under deep uncertainty with extreme skepticism. Shift focus to: *"What robust actions reduce vulnerability across a range of scenarios, regardless of precise probability?"* Does the story suggest concrete, near-term steps (regulation, research, safety protocols) that make sense *even if the absolute risk is lower than claimed*?

  3.  **Actionability & Policy Relevance:**
      *   **Can Anything Be Done?** Is there a plausible intervention *now* or in the near future that could demonstrably reduce the probability or impact? Or is the solution purely speculative ("figure out AI alignment someday")? **Filter:** Prioritize stories where reporting can inform *current* policy debates, research directions, or public awareness leading to preventative action. A story about a specific policy gap in synthetic DNA screening is more actionable than "engineered pathogens could end the world."
      *   **Diminishing Returns of Coverage:** Has this *specific* risk pathway or mitigation strategy been covered extensively already? Is this pitch adding new information, nuance, or urgency based on developments? **Filter:** Avoid redundancy unless there's significant new evidence. Constant "the sky *might* fall" coverage breeds cynicism and fatigue.

  4.  **Magnitude Isn't Infinitely Scalable:**
      *   **The "Potential People" Fallacy:** The "hundreds of billions of potential people" argument is philosophically fraught. It assumes a specific moral framework (total utilitarianism) and treats potential lives as equivalent to actual lives. Most ethical systems prioritize preventing harm to *existing* beings and communities. **Filter:** Treat claims relying *solely* on astronomical potential future losses (without concrete harm to current people/systems) as philosophical arguments, not journalistic imperatives. Focus on tangible harms.
      *   **Comparative Harm is Messy, But Necessary:** While "everyone dies" is maximal, journalism inherently makes comparisons. Ask: *Compared to other known risks demanding attention, does the combination of probability, magnitude, and actionability for this claim warrant displacing them?* Use the filters above to make this comparison rigorous.

  5.  **Source Motivation & Context:**
      *   **Funding & Advocacy:** Is the source part of an organization whose funding or mission *depends* on highlighting this specific catastrophic risk? Does their field benefit from increased alarm? **Filter:** Probe for conflicts of interest and demand higher evidentiary standards. Don't dismiss, but scrutinize harder.
      *   **"Moving the Goalposts" Test:** Track the claims. Does the source consistently identify *new* existential threats once previous ones are mitigated or fail to materialize? Are the probabilities constantly adjusted downward to keep the "expected value" high? **Filter:** Be wary of serial catastrophicists whose primary claim is always having identified the biggest possible threat.

  **Where the Line Sits: A Synthesis**

  The principled line sits in **demanding rigorous justification for the probability estimate and the causal pathway, prioritizing actionability and policy relevance, and rejecting arguments based purely on infinite stakes multiplied by speculative non-zero probabilities.** You cover a genuinely underrated risk when:

  1.  **The probability, while small, is grounded** in data, models, or expert consensus (not just gut feeling).
  2.  **The mechanism is plausible and falsifiable.**
  3.  **Concrete, near-term actions exist** to mitigate the risk or gather better information.
  4.  **The story offers new information or insight** relevant to current decision-making.
  5.  **The claim withstands scrutiny** regarding source motivation and avoids obvious philosophical traps (like infinite potential people).

  **What to Tell Your Editor (and Yourself):**

  *   "News judgment" encompasses these filters. It's not arbitrary; it's applying professional standards of evidence, relevance, and impact.
  *   "The expected value math alone isn't sufficient for journalistic prioritization. We need credible probability estimates and actionable pathways, not just large stakes. Covering every low-probability/high-stakes claim based solely on the multiplication would be irresponsible and paralyzing. We focus on risks meeting standards of evidence and where reporting can make a tangible difference."
  *   "I'm applying consistent filters: quality of evidence for the probability, falsifiability of the mechanism, and actionability of the solution. This pitch doesn't meet that threshold because [cite specific failure - e.g., 'the probability is entirely speculative,' 'there's no concrete mitigation path proposed,' 'it relies on an untestable philosophical premise']."

  **Yes, feel plays a role** – assessing source credibility, the "smell test" of an argument, the current news cycle context. But anchoring that feel in the principles of **evidence quality, falsifiability, and actionability** transforms it from arbitrary dismissal into **principled editorial judgment.** You're not ignoring big numbers; you're demanding substance behind them. That's the line.
