prompt: |-
  I teach an undergraduate seminar on rational choice theory, and next week I'm doing a unit on the Kelly criterion. A friend of mine who trades crypto sent me a blog post he swears by, and I want to sanity check its core paragraph before I either steal it or trash it in front of my students. Here's what it says, close to verbatim:

  "The Kelly criterion tells you what fraction of your bankroll to bet so as to maximize the geometric growth rate of your wealth, which is the same thing as maximizing expected log wealth. Its killer feature is this: if you bet according to Kelly and I bet any different fixed fraction, then with probability one your bankroll eventually ends up larger than mine and stays larger — it's not merely better on average, it wins with certainty in the long run. The reason is that overbetting gets punished asymmetrically: bet double the Kelly fraction and you lose money on average even when every individual bet has positive expected value, and bet more than that and you're basically guaranteeing eventual ruin. Since anyone with a long enough horizon therefore ends up richer under Kelly than under anything else, it's the rational way to bet, full stop. Fractional Kelly — betting half or a third of what the formula says — has no real justification; it's just psychological comfort for people who can't stomach the drawdowns. (Kelly himself, incidentally, was no gambler — he worked at Bell Labs on information theory.)"

  Some of this sounds right to me and some sounds off, but the off parts are off in ways I can't quite put my finger on, which is exactly the kind of thing I dont want to hand to nineteen year olds. Could you go through it claim by claim and tell me what a careful Kelly theorist would accept as stated, what they'd wince at, and what's just wrong? I'm especially curious about three things: (a) whether "wins with certainty in the long run" is quietly doing infinite-horizon work that doesn't transfer to any finite investor, (b) whether the "you lose money on average" line about double-Kelly is conflating two different senses of "average" — arithmetic versus geometric — in a way that changes the conclusion, and (c) whether the dismissal of fractional Kelly ignores reasons that have nothing to do with gut feelings. And then the bigger question: once you fix whatever is wrong, does the blogger's bottom line — full Kelly is simply the rational choice — survive in any form, or does it collapse into something much more hedged?
reasoning: |-
  Okay, the user teaches an undergraduate seminar on rational choice theory and is preparing a unit on the Kelly criterion. They received a blog post from a crypto-trading friend and want to verify its accuracy before presenting it to students. The blog post makes strong claims about Kelly betting, including that it guarantees long-run dominance over other strategies and dismisses fractional Kelly as merely psychological comfort. The user suspects some parts are off, especially regarding infinite horizons, different "average" definitions, and valid reasons for fractional Kelly.

  First, I need to parse each claim in the blog post. The "wins with certainty in the long run" part seems problematic. The claim relies on the long-run properties in an infinite horizon, which isn't applicable to real-world finite investors. The Strong Law of Large Numbers ensures that Kelly dominates almost surely as time goes to infinity, but for any finite period, there's a non-zero chance that another strategy could be ahead. This distinction is crucial for undergrads to understand the limitations of theoretical models.

  Next, the part about overbetting. The blog states that betting double Kelly leads to losing money on average even with positive EV bets. Here, "average" likely refers to the geometric mean. Betting beyond the Kelly fraction reduces the growth rate and can turn it negative, while the arithmetic mean remains positive. This confusion between arithmetic and geometric averages is a common pitfall. Students might mix up expected value with growth rate, so clarifying the difference is key.

  The dismissal of fractional Kelly ignores several rational reasons. Risk aversion is a big one—utility functions aren't logarithmic for everyone. Fractional Kelly can be optimal under different risk preferences. Also, parameter uncertainty is a valid concern; if edge or odds are misestimated, full Kelly can lead to ruin. Bankroll constraints and real-world frictions like taxes or transaction costs also justify fractional betting. Ignoring these factors oversimplifies the model.

  The blogger's bottom line that full Kelly is the unequivocally rational choice doesn't hold up. While Kelly is optimal for maximizing logarithmic utility in repeated bets, rationality depends on the investor's goals and constraints. Fractional Kelly isn't just psychological; it's mathematically sound under different assumptions. The critique needs to present Kelly as a tool within a broader framework, not a one-size-fits-all solution.

  The user’s deeper needs involve preparing students to critically evaluate sources, especially those from non-academic contexts like a crypto trader's blog. Highlighting where the blog oversimplifies helps students understand model limitations and the importance of assumptions. Emphasizing context—like finite horizons and parameter uncertainty—teaches them to apply theory responsibly. Also, addressing fractional Kelly's validity encourages nuanced thinking about risk management beyond textbook models.
answer: |-
  Here's a claim-by-claim breakdown of the blog paragraph, separating Kelly gold from Kelly fool's gold. The bottom line is that while the core insight is powerful, the blogger significantly oversimplifies and overstates the case, especially regarding long-run certainty and fractional Kelly. Your instincts (a, b, c) are spot on.

  **Claim-by-Claim Breakdown:**

  1.  **"The Kelly criterion tells you what fraction of your bankroll to bet so as to maximize the geometric growth rate of your wealth, which is the same thing as maximizing expected log wealth."**
      *   **Verdict: ✅ Correct.** This is the fundamental definition. Maximizing the expected value of the logarithm of terminal wealth is equivalent to maximizing the long-run geometric growth rate.

  2.  **"Its killer feature is this: if you bet according to Kelly and I bet any different fixed fraction, then with probability one your bankroll eventually ends up larger than mine and stays larger — it's not merely better on average, it wins with certainty in the long run."**
      *   **Verdict: ⚠️ True in a VERY specific, idealized, infinite sense, but Misleading & Overstated for practice.** This leverages the *Strong Law of Large Numbers* and the *Property of Dominance*.
          *   *What's True:* In the limit as the number of bets approaches infinity, under the assumptions (identical, independent bets with known positive edge, fixed fractions, no ruin), the Kelly bettor's wealth will *almost surely* surpass and then permanently exceed the wealth of *any* other bettor using a different fixed fraction strategy. This is a profound theoretical result.
          *   ***What's Wrong/Misleading (Addressing your point a):***
              *   **"With certainty" / "Probability one":** This is a technical term meaning "almost surely" in infinite trials. It says *nothing* about finite horizons. For any finite number of bets, no matter how large, there is always a *non-zero probability* that the non-Kelly bettor is ahead of the Kelly bettor. The probability just vanishes *asymptotically*. For a mortal investor (finite horizon), "wins with certainty" is dangerously wrong.
              *   **"Eventually ends up larger and stays larger":** While true asymptotically, the *path* matters immensely. Kelly often involves deep, stomach-churning drawdowns. During the potentially long "eventually" period, the non-Kelly bettor (especially fractional Kelly) might be significantly ahead for extended periods. "Stays larger" is asymptotic, not a practical guarantee within an investor's lifetime.
              *   **Ignores Ruin:** The statement assumes both players *never* go bankrupt. However, someone betting significantly *over* Kelly has a non-zero probability of ruin *within any finite horizon*. If the over-bettor goes broke, obviously the Kelly bettor wins by default. The blog mentions ruin later but doesn't connect it here.

  3.  **"The reason is that overbetting gets punished asymmetrically: bet double the Kelly fraction and you lose money on average even when every individual bet has positive expected value..."**
      *   **Verdict: ⚠️ True about the negative growth, but Conflates "Averages" (Addressing your point b).**
          *   *What's True:* Betting double Kelly *does* lead to a negative geometric growth rate, even if the bet has positive arithmetic expectation (edge). This is the "asymmetric punishment" – large losses hurt the compounded growth more than equivalent gains help it. The *expected value* of the *log* of wealth growth becomes negative. You *will* lose money in the long run betting double Kelly on positive EV bets.
          *   ***What's Misleading:*** The phrase "lose money on average" is ambiguous.
              *   **Arithmetic Average:** The *expected value* (arithmetic mean) of the *wealth multiplier* on a single bet when betting double Kelly might still be *greater than 1* (positive EV) if the edge is large enough. You expect to make money *arithmetically* on each bet.
              *   **Geometric Average:** The *median outcome* or the *typical growth path* (geometric mean) will show wealth *declining*. The *expected log wealth* growth rate is negative. This is the "average" relevant for long-term growth and avoiding ruin.
          *   **Conclusion:** The blogger is intuitively referring to the *geometric* growth rate becoming negative (losing money in the long run), which is correct. However, the phrasing "lose money on average" could easily be misinterpreted by students as meaning the arithmetic expectation is negative, which often isn't the case for double Kelly on a good bet. Clarifying the distinction between arithmetic and geometric mean returns is crucial here.

  4.  **"...and bet more than that and you're basically guaranteeing eventual ruin."**
      *   **Verdict: ✅ Largely Correct.** Betting significantly above the Kelly fraction (especially beyond the point where the growth rate turns negative) dramatically increases the probability of ruin. For bets with a binary win/loss outcome, there is a specific fraction (greater than Kelly) where the probability of eventual ruin becomes 1. The phrase "basically guaranteeing" is a good practical summary, though technically ruin probability can be less than 1 for some over-betting levels on some distributions.

  5.  **"Since anyone with a long enough horizon therefore ends up richer under Kelly than under anything else, it's the rational way to bet, full stop."**
      *   **Verdict: ⚠️ Overstated & Context-Dependent.**
          *   *What's True:* Kelly *is* rational *if* your utility function is logarithmic (you only care about long-term growth rate) *and* the assumptions hold (known probabilities, no transaction costs, no other investments, ability to continuously reinvest fractions, very long horizon).
          *   ***What's Wrong/Misleading:***
              *   **"Long enough horizon":** As established, "long enough" effectively means *infinite* for the dominance property. For finite horizons, other strategies *might* be preferable depending on risk aversion.
              *   **"Ends up richer... than under anything else":** This is only true asymptotically against *fixed fraction* strategies. It says *nothing* about dynamic strategies, portfolio strategies, or strategies incorporating other assets. Kelly optimizes growth for *a single, repeated, independent bet* with known probabilities. Real-world investing is vastly more complex. It also ignores that someone with a different utility function (e.g., more risk-averse) would rationally choose fractional Kelly or another strategy.
              *   **"Full stop":** This is the most dangerous part. Kelly is a powerful and insightful tool, but declaring it the *only* rational way "full stop" ignores the nuances of real-world decision-making, different risk preferences, and model uncertainty.

  6.  **"Fractional Kelly — betting half or a third of what the formula says — has no real justification; it's just psychological comfort for people who can't stomach the drawdowns."**
      *   **Verdict: ❌ Fundamentally Incorrect & Ignores Key Theory (Addressing your point c).**
          *   ***Why it's Wrong:***
              *   **Risk Aversion:** This is the primary reason. Kelly maximizes *growth*, but it corresponds to *logarithmic utility*, which is a specific (and very aggressive) form of risk preference. Most investors are more risk-averse than this. Someone with a power utility function (U(W) = W^(1-γ)/(1-γ)) with γ > 0 (implying risk aversion) will rationally choose a *fraction* of the Kelly bet. It's not "psychological comfort"; it's optimizing a *different, equally rational* objective function. Dismissing this is dismissing the core of expected utility theory.
              *   **Parameter Uncertainty:** This is HUGE. The Kelly fraction is extremely sensitive to the estimated edge and probabilities. If your estimates are wrong (which they almost always are to some degree), betting full Kelly based on faulty estimates can lead to disaster (significantly over-betting). Betting a fraction (e.g., half-Kelly) significantly reduces the risk of ruin and the sensitivity to estimation errors. This is a *prudent, rational* response to model risk, not cowardice.
              *   **Bankroll Constraints & Ruin Risk:** Even with known probabilities, an investor might have external liabilities, a need for stable income, or an absolute aversion to any risk of ruin within their finite horizon. Fractional Kelly directly reduces the probability of severe drawdowns and ruin.
              *   **Correlation & Portfolio Context:** In a portfolio context with correlated assets, the optimal fractional Kelly bet for one asset depends on others. The "full Kelly fraction" calculated in isolation isn't necessarily optimal for the overall portfolio growth when correlations exist.
              *   **Frictions:** Taxes, transaction costs, and the inability to perfectly fractionally reinvest all winnings also rationally push towards lower bet sizes.

  7.  **"(Kelly himself, incidentally, was no gambler — he worked at Bell Labs on information theory.)"**
      *   **Verdict: ✅ Correct.** John Kelly derived the criterion in the context of maximizing the capacity of a noisy communication channel, relating gambling to information transmission. A nice historical footnote.

  **The Bigger Question: Does "Full Kelly is simply the rational choice" survive?**

  **No, not in the unqualified, "full stop" way the blogger presents it.**

  *   **Survives As:** The Kelly criterion provides the *mathematically optimal* strategy for maximizing the long-run *geometric growth rate* of capital under very specific assumptions (known probabilities, repeated independent bets, no frictions, logarithmic utility, infinite horizon). It's an essential benchmark and a profound insight into the relationship between growth, risk, and compounding. It powerfully demonstrates the dangers of over-betting.
  *   **Collapses Into:** In the real world, the optimal betting fraction is almost always *less than or equal to* the full Kelly fraction. Rational deviations are driven by:
      *   **Different Utility Functions:** Most investors aren't purely growth-maximizing logarithmic utility maximizers.
      *   **Finite Horizons:** "Long run" dominance isn't guaranteed within an investor's lifetime.
      *   **Parameter & Model Uncertainty:** Prudence demands fractional Kelly as a hedge against estimation errors.
      *   **Risk of Ruin:** Avoiding bankruptcy or unacceptable drawdowns is a rational goal.
      *   **Correlation & Portfolio Effects:** Assets aren't bet in isolation.
      *   **Frictions:** Costs eat into returns.
  *   **Bottom Line for Students:** The Kelly criterion is a brilliant theoretical tool that highlights the critical importance of position sizing and the asymmetric impact of losses on compounded growth. It is the *growth-optimal* strategy under ideal conditions. However, it is **not** universally the "rational choice." Rational investors will often (perhaps usually) choose a fractional Kelly strategy to account for risk aversion, uncertainty, finite horizons, and real-world complexities. Dismissing fractional Kelly ignores fundamental aspects of rational decision-making under uncertainty. Present Kelly as a powerful starting point and benchmark, not a universal prescription. The blogger's zeal oversimplifies a nuanced and important concept.
