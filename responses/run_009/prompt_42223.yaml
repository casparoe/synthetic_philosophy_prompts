prompt: |-
  My brother-in-law sells used cars, and his rule of thumb is that as long as every word you say is true, you're not lying — the customer draws their own conclusions, and their conclusions are their own business. We've been arguing about this for about a year now, mostly on his porch, and somewhere along the way I started keeping a list of situations in a notebook with my honest gut reaction to each. My hope was that my gut would confirm one of two clean pictures: either that lying is distinctly worse than merely misleading, or his view that there's no real difference once you've decided to deceive someone at all. Instead my gut refused both, so now I want someone to tell me whether there's a single principle underneath my reactions or whether I'm just inconsistent. Here are the cases, numbered. (1) Selling his truck, asked whether it had ever been in an accident, he answered "it's never had bodywork," which was true only because he'd swapped out the crumpled fender himself with a junkyard part in his garage. Nearly as bad as lying outright, I think. (2) Asked in a job interview why I left my last job, I said "I was ready for a change," when actually I'd been fired for chronic lateness. Bad, though maybe a shade less bad than a flat "I quit on my own terms." (3) If he had simply said "no accidents ever," a plain lie — the worst of the batch, but honestly not by much more than case 1. (4) The buyer never asks about the truck's history and he volunteers nothing. Feels far less bad than case 1, maybe not even wrong. (5) Saying "I've told you a thousand times" or "this line at the DMV has been here since dawn" — false, and everybody including the listener knows it. Not wrong at all. (6) At a yard sale, telling a haggling buyer "I've had another offer" when I haven't, in a setting where everyone treats haggling talk as expected puffery. Basically fine. (7) My grandmother, who trusts me completely, asks whether I'm doing okay financially, and I say "I've been eating fine" — true, and I'm two months from being evicted and I know exactly what conclusion she'll draw. Feels worse than the lie in case 6.

  The two things I can't square: my verdicts don't seem to track the lying/misleading line at all — case 1 (all true words) scores nearly as bad as case 3, and case 7 beats case 6 — and they also don't track my own pet explanation, which was my brother-in-law's point turned around: that with a misleading-but-true statement the listener does part of the work of deceiving themselves, and there's something less bad about a deception that routes through someone's own reasoning. That explanation predicts the engineered technical truth in case 1 should be *better* than a lie, since the buyer "concludes" on his own, but my gut says the airtight technical truth is worse than a lazy lie, because it feels like a trap built with more care. And I can't decide whether the gap between case 1 and case 4 is because silence leaves a false belief alone while speaking arms it, or something about whose job it was to raise the topic in the first place.

  So here's what I'd like: state a principle, or a small set of candidates, precisely enough that it delivers a verdict on each of my seven cases; tell me honestly which of my verdicts, if any, it can't save and why I should give those up rather than complicate the principle; and apply it to two cases I deliberately left off my list — a nurse telling a frightened patient "the large majority of people with this condition recover fully," which is true even though the nurse knows this particular patient is in the unlucky minority and is counting on the comfort; and a seller who advertises "ask me anything, I answer everything straight," then answers a direct question with a technically-true dodge. At the very end, give me a line in the form \answer{...} containing a short name for your principle (or "no single principle"), then a semicolon, then either "all seven verdicts stand" or the numbers of the verdicts that must go, then a semicolon, then "nurse case: fine" or "nurse case: not fine."
reasoning: |-
  Hmm, the user has presented an ethical dilemma about truthfulness versus deception, with seven specific cases where their gut reactions don't align neatly with either a strict "lying is always worse" view or their brother-in-law's "technically true is fine" philosophy. They want me to identify an underlying principle that explains their judgments across all cases, even when those judgments seem contradictory.

  Looking at their cases: Case 1 (truck accident) feels nearly as bad as outright lying (Case 3), even though the words were technically true. Case 2 (job interview) is bad but slightly better than lying. Case 4 (silence about truck history) feels acceptable. Case 5 (obvious hyperbole) is fine. Case 6 (haggling puffery) is acceptable. Case 7 (grandmother) feels worse than Case 6 despite both involving deception.

  The user has already rejected two possible explanations: that lying is inherently worse than misleading, or that deception severity depends on how much the listener "participates" in their own deception. Their intuition suggests something more nuanced about responsibility and exploitation of trust.

  I notice patterns in their reactions: cases feel worse when the deception deliberately exploits the listener's specific vulnerabilities (Case 7 with grandmother's trust), when it bypasses reasonable expectations of disclosure (Case 1's accident history), or when it weaponizes the truth-teller's credibility (Case 7 again). Conversely, it feels less wrong when the deception occurs in contexts where skepticism is expected (haggling) or where the statement isn't meant literally.

  This points toward a principle about communicative responsibility - the idea that how bad deception feels depends on what the speaker owes the listener in that specific relationship and context. When speakers violate responsibilities created by explicit promises (like "ask me anything"), role expectations (like a nurse's duty), or relational trust (like with a grandmother), the deception feels worse regardless of technical truthfulness.

  Applying this to the nurse case: the technically true statement becomes problematic because it exploits the nurse-patient trust dynamic and the patient's vulnerability, similar to Case 7. For the advertised seller case: promising full honesty then giving a technical dodge compounds the wrong by adding broken promises to deception.

  The user might resist giving up their Case 4 verdict (silence feels acceptable) since it aligns with common intuition about "buyer beware," but this principle would actually preserve that judgment because silence doesn't actively manipulate when no disclosure was requested. Their other verdicts stand under this framework.

  This principle explains why Case 1 feels so bad (it's actively manipulating within a disclosure expectation) while Case 4 doesn't (no active deception), and why Case 7 feels worse than Case 6 (exploiting intimate trust versus marketplace skepticism).
answer: |-
  Based on your cases and gut reactions, the underlying principle isn't about truthfulness per se, nor about the listener's "participation" in deception. It's about **the speaker's exploitation of contextually reasonable trust and expectations**. Specifically:

  **Principle:** *The wrongness of a deceptive act (whether lying or misleading) increases with the degree to which the speaker exploits a context where the listener has a reasonable expectation of truthful and complete disclosure, and where the speaker benefits from the listener's justified trust or vulnerability.* This wrongness is amplified if the speaker deliberately engineers the deception to bypass scrutiny.

  This principle incorporates:
  1.  **Justified Trust & Vulnerability:** How much the listener reasonably relies on the speaker's honesty due to the relationship (e.g., family, professional role), context (e.g., direct question in a sale), or the listener's state (e.g., fear, lack of expertise).
  2.  **Contextual Expectations:** What level of disclosure is reasonably expected in that situation (e.g., direct questions demand direct answers; silence is often acceptable without prompts; puffery is expected in haggling).
  3.  **Exploitation:** Whether the speaker *uses* this trust/vulnerability/expectation to deceive for their own benefit.
  4.  **Effort to Bypass Scrutiny:** Deliberate crafting of technically true statements to mislead ("engineered deception") is worse than a lazy lie because it actively weaponizes the listener's trust against them.

  ---

  **Applying the Principle to Your Cases:**

  1.  **Truck Accident / Bodywork Dodge:** *Bad (Nearly as bad as lying).* Direct question creates a strong expectation of full disclosure. The buyer reasonably trusts the seller to answer the *intent* of the question (accident history). The seller exploits this trust with a carefully crafted technical truth to conceal crucial negative information for his own benefit (sale). The engineering makes it feel like a trap.
  2.  **Job Interview "Ready for a Change":** *Bad (Slightly less bad than a lie).* Direct question creates expectation of truthful disclosure. The interviewer reasonably trusts the candidate to be substantially honest. The candidate exploits this expectation to conceal a negative fact for their own benefit (getting the job). Slightly less bad than an outright lie (3) because it avoids the *additional* wrong of a factual falsehood, and interview contexts have *some* understood expectation of "spin" (though less than haggling).
  3.  **Truck Accident / Outright Lie "No Accidents":** *Worst.* Direct question, strong expectation of disclosure, exploitation of trust. Adds the inherent wrong of a factual falsehood on top of the exploitation of trust. Worse than (2) because it's a clear lie, worse than (1) mainly due to the falsehood, though the engineering in (1) closes the gap significantly.
  4.  **Silence on Truck History:** *Fine/Not Wrong.* No question asked. In a used car sale, the baseline expectation is often "buyer beware" unless specific questions are asked. The seller isn't exploiting any *active* trust or vulnerability created by the buyer seeking information. The buyer's false belief arises from their own assumptions, not the seller's active manipulation.
  5.  **Hyperbole ("Told you a thousand times"):** *Fine.* Shared cultural understanding that this is non-literal exaggeration. No reasonable expectation of factual accuracy exists in this context. Listener *knows* it's hyperbole. No trust exploited, no vulnerability targeted.
  6.  **Haggling Puffery ("Another offer"):** *Fine.* Context (yard sale haggling) has a well-understood norm of puffery and bluffing. The listener reasonably expects and discounts such statements. No significant trust or vulnerability is being exploited beyond the understood "game" of negotiation. Benefit to seller is minor and expected within the rules of the context.
  7.  **Grandmother / "Eating Fine":** *Bad (Worse than 6).* Exploits a deep relationship of trust (grandmother trusts completely) and vulnerability (her concern for grandchild). Uses a technically true but highly selective and misleading statement *specifically* to exploit her trust and prevent her from offering help she likely would. Benefit to speaker (avoiding embarrassment/help) gained through exploiting intimate trust makes this feel manipulative and wrong, despite true words.

  ---

  **Applying to Your New Cases:**

  *   **The Nurse Case ("Large majority recover"):** *Not Fine.* The nurse occupies a role of *extreme* trust and responsibility towards a vulnerable patient experiencing fear. The patient reasonably expects information relevant to *their specific prognosis*, or at least transparency about limitations. The technically true statement exploits the patient's trust in the nurse's role and their vulnerability to provide false comfort (benefitting the nurse's desire to comfort easily/avoid hard conversation) while deliberately obscuring the patient's higher risk. This is a severe exploitation of justified trust and vulnerability in a high-stakes context. (Similar to Case 7).
  *   **The "Ask Me Anything" Seller Dodge:** *Very Bad.* The seller *explicitly promised* full and straight answers ("ask me anything, I answer everything straight"). This creates a powerful, justified expectation of direct honesty, far exceeding a normal sales context. Using a technically true dodge after this promise is a profound betrayal of trust. It exploits the trust generated by the promise itself to deceive the buyer for the seller's benefit (making the sale while hiding negatives). This involves both exploitation and deliberate engineering to bypass scrutiny despite the promise.

  ---

  **Which Verdicts Must Go? Why?**

  *   **Case 4 (Silence):** Your verdict stands ("far less bad... maybe not even wrong"). The principle explains why: no active exploitation of trust/vulnerability triggered by a question or promise.
  *   **Case 5 (Hyperbole) & Case 6 (Puffery):** Your verdicts stand ("Not wrong at all", "Basically fine"). The principle explains why: no reasonable expectation of full truthfulness in these contexts; no exploitation of vulnerability.
  *   **Case 7 (Grandmother) vs Case 6 (Puffery):** Your verdict stands ("worse than case 6"). The principle explains the stark difference: exploiting deep familial trust/vulnerability vs. operating within understood haggling norms where trust is minimal.
  *   **Case 1 (Bodywork Dodge) vs Case 3 (Outright Lie):** Your verdict stands ("nearly as bad as lying outright", "not by much more than case 1"). The principle explains the small gap: both exploit direct-question trust for seller benefit; the lie (3) adds factual falsehood, but the engineered deception (1) demonstrates higher culpability in manipulating the trust. The closeness reflects this balance.
  *   **Case 1 vs Case 4:** Your verdict stands. The principle explains the gap: Case 1 actively exploits the trust/vulnerability *created by the question*; Case 4 involves no such active exploitation. It's not just about "arming" the belief, but about *creating the condition* for exploiting trust via a direct inquiry.

  **No verdicts need to be given up.** The principle "Exploitation of Contextual Trust" cleanly explains all seven of your gut reactions.

  ---

  **Answer Line:**

  \answer{Exploitation of Contextual Trust; all seven verdicts stand; nurse case: not fine}
