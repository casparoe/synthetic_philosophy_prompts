prompt: |-
  I cover science and ideas for a general-audience magazine, and for a long-form piece on formal epistemology I recently had dinner with two sources: a philosopher trained in decision theory who works on epistemic utility theory, and a philosopher of science who studies how evidence is actually used in research practice. They had read each other's work, got along well, and then spent two hours politely and completely failing to agree. I took notes, because the exchange was the most illuminating part of my reporting, and I would like an outside referee to go through it move by move.

  The disagreement began when the formal epistemologist summarized what he takes to be the great achievement of the accuracy-first program: if you measure how good a credence is by how accurate it is, using a proper scoring rule, then the classical norms for credences fall out of a single demand — don't hold credences that some alternative would beat regardless of how the world turns out. On that basis he claimed that accuracy is the only intrinsic epistemic value, and that anything else we call an epistemic good is either a means to accuracy or a disguised pragmatic value. The philosopher of science objected that this is conditional, not a discovery: the dominance arguments are valid only relative to a scoring rule you have already stipulated to be the whole of epistemic value, so the program derives its norms from an assumption it never defends. He replied that the assumption is not arbitrary, because propriety — the requirement that a scoring rule reward reporting your actual credence — is itself forced by the idea that only accuracy matters, so the choice of measure isn't an extra premise smuggled in but the content of the view, the way a representation theorem in decision theory tells you what you were implicitly valuing all along. She answered that representation theorems show how to interpret a pattern of choices given some values, not which values to have, and that his inference runs the wrong direction.

  The exchange then turned to cases. She offered two. First, an agent whose credences are perfectly accurate but acquired by pure luck — say, confident beliefs produced by a random process that happened to land on the truth — appears epistemically beyond reproach on the accuracy-only view, yet most of us think there is an epistemic difference between getting it right and knowing, and the program seems unable to recover that difference without adding reliability or grounding as an epistemic value, which he has just forbidden himself. Second, if accuracy is the only epistemic good, then gathering evidence has no intrinsic epistemic worth: an agent who never gathers a shred of evidence but starts life with miraculously accurate credences is in the best possible epistemic state, which she took to be a reductio. He responded that the value of evidence is instrumental — it is how accuracy is normally achieved — and that luck and importance are pragmatic distinctions, not epistemic ones: whether it matters to you how your credence was formed is a practical question about error costs and inquiry management, not a further fact about epistemic value. She countered with idealization in science: researchers deliberately adopt assumptions they know to be false, and this is not merely tolerated but praised as good epistemic practice, which is hard to square with a view on which credence accuracy is the whole of epistemic virtue; he answered that idealizations are tools assessed pragmatically, and that the scientist's credences, when she actually has them, should still be as accurate as her evidence allows.

  Please adjudicate their exchange move by move: assess each contribution on its merits — who is right at each step, where each overreaches, and what, if anything, both of them are missing. Where the dispute turns on a technical point (for instance, what proper scoring rules actually establish, or what follows from the instrumental status of a value), please resolve the technical point rather than treating it as a matter of taste. I don't have a stake in the outcome; I have a stake in reporting it correctly.
reasoning: |-
  Okay, let me approach this adjudication systematically. The user wants a move-by-move analysis of a philosophical debate between two experts, with technical precision and neutrality - crucial since they're reporting for a science magazine. 

  First, I need to map the core disagreement: the formal epistemologist's claim that accuracy is the sole intrinsic epistemic value versus the philosopher of science's critique that this is circular and misses key aspects of scientific practice. The user's notes structure this as three phases: (1) the initial accuracy-first argument, (2) the representation theorem analogy, and (3) the case studies (lucky true belief and value of evidence).

  For phase one, I should verify the formal epistemologist's claim about dominance arguments. He's correct that propriety follows from accuracy-monism if we define "scoring rule" as the epistemic utility function - that's mathematically sound. But she's also right that this defines epistemic value rather than discovering it. The technical nuance here is that dominance avoidance constrains possible utility functions, but doesn't justify why we should care about epistemic utility in the first place. 

  Moving to phase two, the representation theorem analogy is tricky. He's right that such theorems reveal implicit structure in choices, but she correctly notes they don't prescribe values - a key distinction in decision theory foundations. I'll need to cite foundational texts by Savage or Joyce to ground this. 

  The case studies are where it gets juicy. For the lucky true belief: his "pragmatic distinction" response holds if we strictly separate epistemology from ethics of belief, but her intuition about "knowing vs getting right" taps into Gettier problems - worth flagging that debate. Regarding evidence's value: his instrumentalism is formally defensible via expected accuracy calculations, but her reductio highlights how actual science values evidence-gathering intrinsically. The idealization example is particularly damning - when scientists use false models, they're not aiming for credence-accuracy at all. 

  Throughout, I notice both miss that "epistemic value" might be context-dependent: lab science vs pure logic may need different norms. Also, neither addresses how accuracy-first handles non-probabilistic beliefs common in science. My adjudication will need to mark where each score points while showing the unresolved tensions - exactly what the reporter needs for nuanced coverage.
answer: |-
  Below is a move-by-move adjudication of the exchange, resolving technical points and highlighting strengths, overreaches, and omissions. The analysis prioritizes logical coherence, technical accuracy, and philosophical nuance over rhetorical appeal.

  ---

  ### **Move 1: Formal Epistemologist’s Claim**  
  *Claim*: Accuracy (measured by proper scoring rules) is the sole intrinsic epistemic value. Classical norms (probabilism, conditionalization) follow from avoiding "accuracy dominance" (no credence beaten by an alternative in all possible worlds).  

  **Assessment**:  
  - **Strengths**:  
    - Mathematically sound: Propriety + dominance avoidance *do* imply probabilism, conditionalization, and other norms (see Joyce 1998, Pettigrew 2016).  
    - Parsimonious: Reduces multiple epistemic norms to a single principle.  
  - **Overreach**:  
    - Claiming this "discovers" accuracy as the only intrinsic value is circular. The framework *assumes* accuracy is the sole epistemic good by defining it via scoring rules.  
  - **Technical Resolution**:  
    Dominance arguments are valid *only if* you accept that epistemic disvalue must be measurable by a strictly proper scoring rule. This is stipulated, not derived.  

  ---

  ### **Move 2: Philosopher of Science’s Rebuttal**  
  *Objection*: The argument is conditional. Dominance avoidance presupposes the scoring rule defines "epistemic value," which is never defended.  

  **Assessment**:  
  - **Strengths**:  
    - Correctly identifies the burden of proof: Why should we accept accuracy (as defined by scoring rules) as the *only* intrinsic epistemic good?  
    - Exposes the "frame-dependence" of the result: Different scoring rules yield different norms.  
  - **Omission**:  
    - Underestimates the normative force of representation theorems (addressed next).  

  ---

  ### **Move 3: Formal Epistemologist’s Reply**  
  *Defense*: Propriety is forced by accuracy-monism. Like decision-theoretic representation theorems, this reveals what was "implicitly valued."  

  **Assessment**:  
  - **Strengths**:  
    - Proper scoring rules *are* uniquely justified if accuracy is the sole goal (Selten 1998): Propriety ensures you cannot "game" the system by misreporting credences.  
  - **Overreach**:  
    - **False analogy**: Decision-theoretic representation theorems (e.g., Savage) show that coherent preferences *reveal* underlying utilities/credences. They do *not* justify why an agent *should* value those utilities. Similarly, accuracy-first shows that *if* you value accuracy, you *must* use proper scoring rules—but not why you should value accuracy.  
  - **Technical Resolution**:  
    Representation theorems are *interpretive*, not *normative*. They translate choices into utilities, but cannot dictate whether those utilities are "correct" (see Hájek 2008).  

  ---

  ### **Move 4: Philosopher of Science’s Cases**  
  *Case 1 (Lucky True Belief)*: An agent with accurate credences from luck is "epistemically beyond reproach" but shouldn’t be.  
  *Case 2 (Value of Evidence)*: Gathering evidence has no intrinsic epistemic worth if accuracy is all that matters.  

  **Assessment**:  
  - **Strengths**:  
    - Highlights two major challenges to accuracy-monism:  
      1. **The Gettier Problem**: Knowledge ≠ justified true belief (Gettier 1963). Accuracy-first struggles with epistemic luck.  
      2. **The Swamping Problem**: If truth is the sole value, reliable processes add nothing (Kvanvig 2003).  
  - **Overreach**:  
    - Equates "credence accuracy" with "getting it right." Formal epistemology treats credences as *graded* (e.g., 0.7), not binary "true/false" beliefs.  

  ---

  ### **Move 5: Formal Epistemologist’s Response**  
  *Defense*:  
  1. Value of evidence is instrumental (it improves expected accuracy).  
  2. Luck/grounding are pragmatic (not epistemic) concerns.  
  3. Idealizations are pragmatic tools; credences should still aim for accuracy.  

  **Assessment**:  
  - **Strengths**:  
    - **Evidence**: Instrumental value is defensible. Gathering evidence *does* maximize *expected* accuracy (via Bayesian conditionalization).  
    - **Idealizations**: Correct that scientists using false models (e.g., frictionless planes) still hold accurate *conditional* credences (e.g., "If friction=0, then X").  
  - **Overreach**:  
    - Dismissing luck/grounding as "merely pragmatic" ignores robust epistemic intuitions (e.g., knowledge requires non-lucky justification).  
    - **Technical flaw**: An agent with "miraculously accurate" priors violates the *regularity principle* (non-dogmatism) and would not update on evidence—a fatal flaw in dynamic contexts.  
  - **Omission**:  
    Fails to address why science *praises* false assumptions (e.g., idealized models) as epistemically virtuous, not just pragmatically useful.  

  ---

  ### **Move 6: Philosopher of Science’s Counter on Idealizations**  
  *Objection*: Scientists adopt false assumptions as "good epistemic practice," not just pragmatically.  

  **Assessment**:  
  - **Strengths**:  
    - Correctly notes that idealizations often serve *epistemic* goals:  
      - Simplifying complexity to reveal patterns (Weisberg 2007).  
      - Isolating causal mechanisms (Batterman 2009).  
  - **Omission**:  
    - Does not challenge the formalist’s point that *credences about the real world* should still aim for accuracy.  

  ---

  ### **Adjudication Summary**  
  | **Move** | **Who Wins?** | **Key Reason** |  
  |----------|--------------|---------------|  
  | 1. Accuracy-first achievement | Formalist (qualified) | Mathematically valid, but assumes its conclusion. |  
  | 2. Circularity charge | Philosopher of Science | Correctly identifies undefended assumption. |  
  | 3. Representation theorem analogy | Philosopher of Science | Misapplied: Theorems interpret, not justify, values. |  
  | 4. Lucky true belief case | Philosopher of Science | Exposes a gap in accuracy-monism (no account of justification). |  
  | 4. Value of evidence case | Tie | Evidence *is* instrumentally valuable, but science values it intrinsically too. |  
  | 5. Idealizations defense | Formalist (partial) | Credences *should* aim for accuracy, but idealizations serve other epistemic goals. |  

  ---

  ### **What Both Miss**  
  1. **Epistemic Value Pluralism**: Epistemology may require multiple irreducible goods (accuracy, understanding, explanatory power). For example, understanding *why* a theory is true often matters beyond mere credence accuracy (Kvanvig 2003).  
  2. **Context-Sensitivity**: "Epistemic value" may differ between contexts (e.g., pure inquiry vs. applied science). Idealizations might be epistemic goods in model-building but not in belief formation.  
  3. **Non-Credal States**: Science often values models, theories, or frameworks that lack probabilistic credences (e.g., Newtonian mechanics as a tool). Accuracy-first focuses narrowly on individual credences.  

  ### **Recommendation for Reporting**  
  Frame the debate as:  
  > **Can all epistemic goods be "derived" from accuracy?**  
  > - *Formalists*: "Yes, via decision-theoretic coherence."  
  > - *Practice-focused philosophers*: "No—science values understanding, evidence, and justification independently."  

  The core tension is between **logic-driven normativity** (what rationality *demands*) and **practice-driven normativity** (what actually advances inquiry). Neither side fully resolves it.  

  #### **Key Sources for Context**:  
  - Joyce, J. (1998) *Accuracy and Coherence*.  
  - Kvanvig, J. (2003) *The Value of Knowledge and the Pursuit of Understanding*.  
  - Weisberg, M. (2007) "Three Kinds of Idealization."  
  - Pettigrew, R. (2016) *Accuracy and the Laws of Credence*.
