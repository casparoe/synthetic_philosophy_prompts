prompt: |-
  I teach an ethics seminar on moral responsibility, and every spring I hit the same wall around week nine. Week seven is Milgram plus Browning's Ordinary Men — Reserve Police Battalion 101, the commander offering his men the chance to step out of the Józefów shooting, almost nobody taking it, and the explanation on offer being basically situational: conformity, deference to authority, the rut of a routine, no heros required. By week eight my students are roughly situationist — put most of us in that situation and we'd have done it too, and that's supposed to be the disturbing lesson. Then we get to international criminal law, and the practice there is almost the mirror image. Superior orders is not a defense, at most a mitigating factor. Duress, per the Nuremberg-era tribunal that tried the Einsatzgruppen commanders, does not excuse a man who kills innocents because he faced death or ruin for refusing. The working assumption seems to be that an ordinary adult standing at a choice point — kill, or refuse and pay — is fully responsible for killing, even though the historical record (and my own syllabus) says the psychologically realistic move was to keep shooting.

  So what I want from you: what theory of moral agency and responsibility does that legal practice actually presuppose? Something character-based, strong enough that Browning/Milgram-style pressure simply doesn't register as an excuse-maker? Or can it be rebuilt on a fair-opportunity view, where the bare possibilty of stepping out is enough to ground responsibility, however unrealistic taking it was? And note whether the presupposition differs depending on who turned out to be right — if Goldhagen is right and these were convinced, willing killers, the doctrine looks comfortable, but if Browning is right, does the practice quietly require a false picture of the perpetrators? Distinguish what the practice strictly requires philosophically from what it merely sits well with, and tell me where it's underdetermined — could a consistent situationist still endorse the convictions? Then say what would have to change, in doctrine or sentencing or in what we think courts are for, if the tribunals took the situational explanation as seriously as my students do by week eight. Also, the same system lets duress excuse plenty of ordinary crimes but draws an absolute line at deliberately killing innocents — is that line doing philosophical work or just expressing special horror at murder?

  Lead with your bottom line in the first sentence — your one-line answer to what the presupposition is — then the reasoning, no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is teaching an ethics seminar on moral responsibility and has hit a recurring challenge. By week nine, students have studied Milgram and Browning's "Ordinary Men," leading them to a situationist view where most people would comply with authority in extreme situations. Then they encounter international criminal law, which rejects superior orders and duress as defenses for killing innocents. The user wants to know what theory of moral agency underpins this legal practice.

  First, I need to pinpoint the core presupposition. The legal practice presupposes a rationalist, Kantian-inspired view of moral agency. This emphasizes autonomous choice and the capacity to resist pressure, even in extreme situations. The key here is that the mere possibility of refusal grounds responsibility, regardless of psychological realism. The tribunals focus on the normative expectation that individuals should uphold moral duties despite situational pressures.

  Next, the user asks if this presupposition differs based on whether Goldhagen (willing killers) or Browning (situational factors) is correct. The doctrine fits Goldhagen better, but it doesn't strictly require his view. Even if Browning is right, the legal stance holds that situational pressures don't excuse the act. So a situationist could endorse convictions by arguing that while situational factors explain behavior, they don't morally excuse it. The law's role is normative, not just explanatory.

  The user also wants to know what would change if tribunals took situational explanations seriously. Sentencing might incorporate mitigation more, or focus on systemic actors instead of low-level perpetrators. Doctrine could allow duress as a partial defense, though likely not full exoneration. This highlights the tension between legal accountability and psychological realism.

  The absolute line against killing innocents, even under duress, seems philosophical. It elevates the duty to not kill as paramount, overriding self-preservation. This contrasts with ordinary crimes where duress might excuse, underscoring the special moral gravity of murder.

  I should ensure the bottom line is clear upfront: the legal practice presupposes a Kantian view of autonomy. Then unpack each part systematically, addressing all aspects of the query without restating the question. Make sure to distinguish what the doctrine requires versus what it aligns with, and how consistent situationism fits within the legal framework.
answer: |-
  **Bottom line:** International criminal law presupposes a **Kantian-inspired, rationalist theory of moral agency** emphasizing inviolable duties, universalizable maxims, and the inherent capacity for autonomous choice even under extreme pressure, where the *possibility* of refusal constitutes sufficient grounds for full responsibility for deliberate killing.

  **Reasoning:**

  1.  **Presupposed Theory:** The doctrine rejects situational pressure (conformity, authority, routine) and narrow duress as *excusing* conditions for deliberately killing innocents because it assumes:
      *   **Categorical Imperative Core:** Deliberately killing an innocent violates a fundamental, non-negotiable duty ("ought implies can" interpreted normatively, not psychologically). The law treats adherence to this duty as always possible *in principle*, regardless of the cost.
      *   **Autonomy as Foundational:** It presumes individuals possess a core rational autonomy capable of recognizing and acting on moral law. Situational pressures are external forces acting *on* this autonomous will; they do not negate the will's fundamental freedom to choose the moral act, however difficult.
      *   **Fair Opportunity (Formal Interpretation):** The mere *formal possibility* of refusing (e.g., stepping out at Józefów) is sufficient to establish fair opportunity and thus full responsibility. The psychological *unlikelihood* or *extraordinary cost* of taking that option is irrelevant to moral/legal culpability *for this specific crime*. The law focuses on the *choice made* and its moral character, not the ease of making the alternative choice.
      *   **Character vs. Choice:** While compatible with a character theory (perpetrators *chose* evil, revealing bad character), the doctrine *strictly requires* the primacy of the **act of will** at the choice point. It condemns the *choice* to kill an innocent as a free, responsible act, irrespective of whether the perpetrator was usually "ordinary" (Browning) or "willing" (Goldhagen). The act itself demonstrates a failure of will to meet the categorical duty.

  2.  **Browning vs. Goldhagen:**
      *   **Goldhagen (Willing Killers):** Aligns *comfortably* with the doctrine, easily fitting the "bad character" or "evil choice" narrative.
      *   **Browning (Situational):** The doctrine *does not strictly require* Goldhagen's view. It **quietly requires a false picture** *only* if Browning's evidence is interpreted as showing the perpetrators *lacked the psychological capacity* for autonomous choice in that moment. The doctrine presupposes they *did* have that capacity, even if powerful forces made exercising it extraordinarily difficult. It dismisses the situational *explanation* as irrelevant to the *moral/legal judgment* of the act.

  3.  **Consistent Situationism & Convictions:** A consistent situationist *could* endorse the convictions based on:
      *   **Normative Function:** Viewing the law as establishing essential moral boundaries and deterrence, regardless of psychological realism. Condemning the act upholds the supreme value of innocent life.
      *   **Retribution for the Act:** Blaming the *act* itself as horrific, demanding condemnation, even if the perpetrator wasn't uniquely "evil" and many others would have done the same. The focus shifts from individual blameworthiness *in vacuo* to the objective wrongness of the deed.
      *   **Systemic Accountability:** Using individual convictions to condemn the *system* that created the situation, acknowledging the individual as the necessary agent through whom the condemnation is applied.

  4.  **Changes if Tribunals Took Situationism Seriously:**
      *   **Doctrine:** Introduce **duress as a full or partial defense** for killing innocents under credible threat of imminent death (beyond Browning's broader pressures). This would fundamentally challenge the categorical prohibition.
      *   **Sentencing:** Greatly increased emphasis on **mitigation**. Sentences would reflect the situational coercion as reducing *culpability* (even if not excusing the act), moving towards lower sentences or even non-custodial penalties for low-level perpetrators acting under direct, extreme duress.
      *   **Purpose of Courts:** Shift focus from **individual retribution** towards **systemic condemnation, historical record, and restorative justice**. Prosecutions might prioritize architects of the system (high commanders, policymakers) over low-level executors placed in "impossible" situations, viewing the latter more as victims coerced into becoming perpetrators.

  5.  **The Line Against Killing Innocents:**
      *   This line is **doing fundamental philosophical work**, not just expressing horror. It establishes a **lexical priority**: the duty not to deliberately kill an innocent is absolute and trumps the interest in self-preservation or avoiding ruin. Allowing duress for ordinary crimes (e.g., theft under threat) acknowledges that self-preservation *can* sometimes outweigh other duties. The absolute prohibition on killing innocents asserts that *no* personal cost, not even death, can morally outweigh this supreme duty. It defines the outer limit of permissible action under duress, grounded in the inherent, incommensurable value of innocent human life. The "special horror" is a *consequence* of this philosophical stance, not its basis.

  **Underdetermination:** The doctrine *can* operate without committing to a specific metaphysics of free will. It relies on a *normative* conception of agency ("you *should have* and *could have* chosen otherwise, morally speaking") rather than requiring proof of libertarian free will or denying determinism/situationism at a descriptive level. Its foundation is deontological ethics, not a specific psychology.
