prompt: |-
  So I've been arguing with my brother about voting rights at Thanksgiving and realized my own views are kind of a mess, so let me lay out my gut verdicts and see if there's a principle under there somewhere. Here's where I land on cases:

  16 year olds voting in local elections, like school board: fine, honestly they probably know more about the school system than I do. 16 year olds voting national: also fine I think, though less sure. 14 year olds voting at all: not fine. Long-term resident non-citizens (lived there 30 years, pays taxes, kids in local schools) voting in local elections: fine. Same person voting in national elections: hmm, not fine? But I can't really say why, which bothers me. Tourists voting: obviously not fine. Someone on a 6-month work visa: not fine. A citizen who moved abroad 40 years ago and never came back, voting by mail in home country elections: fine — I've heard some countries even let expats pass citizenship to kids who've never visited, and that seems fine too. Weird that the guy next door who's lived there three decades gets less than them though.

  People currently in prison: fine, they're still getting governed. Felons who've finished their sentences: obviously fine, the disenfranchisement thing is nuts. Someone with advanced dementia voting while a family member "helps" fill in the ballot: not fine, even though I can't point at what's missing, and I know some places allow assistance at the polls and that seems ok in milder cases, so there's a line in there I can't draw.

  On the compulsory side: mandatory voting with a modest fine, like Australia has: fine, not my preference but fine. Mandatory voting enforced criminally: not fine. Requiring everyone to pass a civics test before voting: not fine, no — that history is ugly and also who writes the test.

  So: is there a principle that gets all or most of this? It feels like it's something about capacity plus stake in the community, but capacity seems to do no work in the 14 vs 16 case, and stake seems to do no work in the expat case, and I genuinely don't know which one is doing the work in the local-vs-national thing for non-citizens. I'd take either (a) a principle that saves every verdict even if it needs extra clauses, or (b) a simpler one that tells me which verdicts to drop — and if you go with (b), I want to know which of my verdicts goes and why that one rather than another. Also tell me what the principle predicts for a couple I didn't list — non-citizens voting national after 10 years, or a rule that says no one over 80 can vote for the first time — and whether those predictions should embarrass me.

  One more thing: tell me what would change your mind here. Like, which single case or consideration, if I pushed back hard on it, should force you to abandon or rework the principle, and where in your own reasoning you think you're most likely to be wrong. Don't just hand me the answer like it was obvious, it wasnt obvious to me.
reasoning: |-
  Okay, let me try to unpack this user's messy voting rights dilemma. They've thrown a dozen scenarios at the wall - from 16-year-old school board voters to dementia patients - hoping some coherent principle will stick. 

  First gut check: their discomfort around the non-citizen/expat contradiction jumps out. Why does José who's paid local taxes for 30 years get less say than Brenda who left decades ago? That cognitive dissonance seems central. And the dementia case - they know it's wrong but can't articulate why, which suggests an unspoken threshold of competence.

  Hmm... the "stake + capacity" framework they proposed actually holds up better than they think if we tweak it. For stake: it's not just presence but binding consequences. The expat's kids inheriting citizenship? Minimal stake. José facing local sewage policy? Maximum stake. For capacity: 14 vs 16 isn't arbitrary if we consider developmental milestones in consequential thinking around that age. 

  But the prison case challenges this - inmates have huge stake but society might question capacity. Yet the user's fine with it, so their intuition leans toward stake overriding here. Interesting. Their mandatory voting limits also reveal a "coercion sensitivity" principle - small fines okay, jail time crosses a line.

  Where I'd push my own thinking: what if we found 14-year-olds consistently voting as responsibly as adults? Would that force abandoning the capacity threshold? Probably. And if a country let non-citizens vote nationally after 5 years with no issues, that'd pressure the citizenship requirement. 

  Biggest tension remains the local/national split for immigrants. Maybe the principle needs a "subsidiarity" clause: vote where policies directly impact you. That saves their school board exception but still feels shaky for national elections. If pressed, I'd tell them to drop that distinction - either embrace full non-citizen voting after long residency or admit it's about tribal belonging.

  The dementia case needs that competence line after all. We allow ballot help for physical limits, not cognitive ones. Hard truth: some capacities are binary, not gradual. If grandma can't name the current year, her vote isn't autonomous. That's uncomfortable but necessary.

  Test cases: 10-year resident voting nationally? Their principle says no but should say yes - inconsistency exposed. Octogenarian first-time voters? Capacity trumps experience - should be fine. Both should embarrass them gently. 

  Final note: their self-awareness about messy views is refreshing. This isn't about tidy answers - it's about which tensions we tolerate. I'll position the framework as "good enough" rather than perfect, with permission to evolve.
answer: |-
  You've got a remarkably consistent set of intuitions! There **is** a principle lurking here, though it requires a couple of nuanced components. Your core insight about **"Stake + Capacity"** is correct, but needs refinement to handle the expat/dementia/local-national conflicts.

  Here's the principle that captures *most* of your verdicts:

  **Principle: Voting rights require (1) Significant Stake in the outcome of the governing body's decisions, AND (2) Sufficient Cognitive Capacity to understand the act of voting and its consequences, AND (3) Legal Membership in the polity governed by that body (for national elections), *unless* the voter has a demonstrably profound and enduring Stake.**

  Let's break down how this works with your cases:

  1.  **Age-Based Cases (16yo local/national fine, 14yo not):**
      *   *Stake:* 16yo has significant stake in both local (schools, community) and national (future laws, climate, economy) decisions. 14yo also has stake.
      *   *Capacity:* This is the key differentiator. You (and society) implicitly recognize that *by 16*, cognitive development typically reaches a threshold sufficient to grasp the abstract concept of voting, consequences of choices, and participation in representative democracy in a meaningful way. 14 is below that threshold for you. (Capacity *is* doing the work here).
      *   *Membership:* Citizen, so fulfilled.

  2.  **Non-Citizen Cases (Long-term resident local: fine, national: not fine, Tourist/6mo: not):**
      *   *Stake:* **Profound and enduring** in local community after 30 years (taxes, kids in schools, daily life impacted by zoning, policing, sanitation). **Significant but less direct/enduring** in national elections (foreign policy, national taxes, but citizenship/legal status differs). Tourist/6mo visa holder has transient stake, not profound/enduring.
      *   *Capacity:* Assumed sufficient.
      *   *Membership:* **Crucial for national elections.** National sovereignty and the definition of "the people" constituting the state traditionally require citizenship. *This is where your expat conflict arises.*
      *   *Why local is fine?* The "profound and enduring stake" *overrides* the lack of formal national membership *specifically for the local community* that directly governs their daily life. This is the "demonstrably profound and enduring Stake" exception for membership.

  3.  **Expat Case (Fine):**
      *   *Stake:* Significant but potentially less direct/enduring than the long-term resident non-citizen neighbor (depending on ties).
      *   *Capacity:* Assumed sufficient.
      *   *Membership:* **Citizen.** This fulfills the membership requirement for national elections, *even if their stake is arguably less tangible than the non-citizen neighbor's.* This is the core tension. The principle prioritizes legal membership for national elections. Your discomfort highlights that "stake" alone isn't sufficient for national voting in your view; formal membership is required. The expat has it, the neighbor doesn't.

  4.  **Incarceration/Felon Cases (Fine):**
      *   *Stake:* **Profound and direct.** Prisoners are intensely governed by the state. Felons post-sentence remain governed members of society.
      *   *Capacity:* Assumed sufficient.
      *   *Membership:* Citizen, fulfilled. Disenfranchisement punishes beyond the sentence and violates stake.

  5.  **Dementia Case (Not fine):**
      *   *Stake:* Significant.
      *   *Capacity:* **Insufficient.** The key is whether the person understands the *nature and consequence* of casting a ballot. Severe dementia likely impairs this understanding. "Help" filling out a ballot becomes problematic if it replaces the voter's will rather than facilitating it. Milder cases where comprehension remains are fine with assistance.
      *   *Membership:* Citizen, fulfilled. (Capacity is doing the work).

  6.  **Compulsory Voting Cases (Fines fine, Criminal not, Tests not):**
      *   This is about the *implementation* of voting rights, not the right itself. Your limits reflect **proportionality and avoidance of undue burden/disenfranchisement.** A small fine encourages participation without being overly coercive or punitive like criminal penalties. Civics tests are historically abused tools of disenfranchisement and create an arbitrary capacity barrier beyond the basic comprehension required for the act itself.

  **Saving the Verdicts & Addressing Conflicts:**

  *   **Expat vs. Long-Term Non-Citizen Neighbor:** This is the principle's tension point. The neighbor has profound stake but lacks membership. The expat has membership but potentially less tangible stake. The principle resolves it by **requiring membership for national voting**, prioritizing the formal legal bond of citizenship. You value that bond highly for national sovereignty. To save *all* your verdicts, we need the membership clause. *If this bothers you deeply, it's the verdict to re-examine.*
  *   **14 vs 16:** Capacity *is* the key. Society draws lines (16, 18) based on developmental psychology and societal norms about decision-making maturity. 14 falls below your threshold.

  **Predictions on New Cases & Potential Embarrassment:**

  1.  **Non-citizen voting nationally after 10 years?**
      *   *Prediction:* **Not fine** under your principle. They have significant stake, possibly capacity, but lack the **membership** (citizenship) required for national elections.
      *   *Embarrassment?* **Potentially Yes.** If their stake is demonstrably profound and enduring (like your 30-year example), denying the vote while allowing it for an expat with minimal ties feels inconsistent. Your principle *requires* citizenship, so it's consistent, but the underlying fairness might be embarrassing. This exposes the tension in prioritizing formal membership over profound stake for national votes.

  2.  **Rule: No one over 80 can vote for the first time?**
      *   *Prediction:* **Not fine** under your principle.
      *   *Why?* Lacks justification based on Stake, Capacity, or Membership. An 80-year-old citizen has stake and membership. Capacity is individual, not age-based in this way (unlike the developmental threshold for youth). This would be arbitrary age discrimination.
      *   *Embarrassment?* **No.** Your principle clearly rejects this as a violation of capacity/stake/membership without cause. It aligns with your rejection of civics tests and your acceptance of expat voting.

  **What Would Change My Mind (The Principle's Vulnerability):**

  1.  **The Long-Term Non-Citizen National Vote:** If you pushed back *hard* here, arguing that **profound, enduring stake *should* override formal citizenship for national elections after a very long period (e.g., 20-30 years)**, it would force a major rework. This would mean:
      *   Abandoning or severely weakening the "Membership" requirement for national elections.
      *   Elevating "Profound and Enduring Stake" to a sufficient condition by itself for *all* elections after a significant residency threshold.
      *   **Consequence:** Your "not fine" verdict for the long-term non-citizen voting nationally would flip to "fine". The expat case remains fine via membership. This makes the principle simpler (Stake + Capacity) but radically challenges traditional notions of national sovereignty tied to citizenship. *This is the point where my reasoning (and your current intuition) is most vulnerable to a strong counter-argument based on fundamental fairness and inclusion.*

  2.  **Capacity Thresholds:** If presented with compelling evidence that **14-year-olds consistently demonstrate the same level of political understanding and consequential thinking as 16-year-olds** (or that 16 isn't meaningfully better than 14), the age-based line would become harder to defend purely on capacity grounds. This might force either lowering the threshold or adding other justifications (like societal dependency/independence).

  **Conclusion:**

  Your intuitions are governed by a principle valuing **Stake, Capacity, and (for national elections) Membership.** The membership requirement for national votes causes the expat/non-citizen tension. The capacity threshold explains 14 vs 16 and dementia. Profound stake justifies local voting for non-citizens and voting by prisoners. Your limits on mandatory voting reflect concerns about proportionality and disenfranchisement.

  **It's not perfectly clean,** but it's coherent. The biggest pressure point is whether profound, enduring residency *should* eventually grant full national voting rights regardless of citizenship. If that idea resonates strongly with you upon reflection, it's the core verdict (non-citizen national vote = not fine) that should change, leading to a simpler Stake + Capacity principle. Otherwise, embrace the membership requirement and accept the expat anomaly as a feature of prioritizing the formal citizen-polity bond for national decisions.
