prompt: |-
  So I'm a dev, no philosophy training, but I got into a genuinely heated slack argument about sunk costs last week and it made me realize my own gut verdicts are all over the place. The textbook line (which a couple people in the thread kept repeating) is that sunk costs should never matter, only future costs and benefits, full stop. I mostly buy that. But when I list out actual cases, my verdicts don't line up, and I want to know if there's a principle that captures them or whether I'm just rationalizing my own bad habits.

  My cases and verdicts:

  1. My team spent 6 months building a feature nobody asked for and the roadmap has moved on. PM wants to ship it anyway because "we're too deep in to waste the 6 months." Verdict: obviously the sunk cost fallacy, kill it.

  2. Old legacy codebase, ugly, everyone complains, no tests. Someone proposes a full rewrite from scratch because the current code is garbage. I think continuing to patch the ugly thing is correct, and honestly part of my reason is "there's 10 years of accumulated bugfixes baked into that mess, a rewrite throws all that away." Verdict: this one feels like it's NOT a fallacy, even though it sounds structurally like case 1.

  3. Two hours into a three hour movie I'm hating. My buddy says I paid for the ticket so I might as well stay. Verdict: fallacy, walk out, the money's gone either way.

  4. My sister is 3 years into a PhD, kind of miserable, job prospects meh, and one of her stated reasons for staying is that leaving now would make the 3 years "for nothing." Verdict: I actually think this is pretty reasonable? I can't fully condemn it and it bugs me.

  5. Friend in a ten year relationship that's gone flat — no toxicity, just coasting — and when asked why he stays, "a decade in" is genuinely one of his reasons. Verdict: I wince, but again I can't bring myself to call it flat-out irrational, even though it's the same shape as case 4.

  6. A company keeps funding a dying product line because "we've already sunk $40M into it." Verdict: textbook fallacy, textbook.

  7. I keep going to a kickboxing gym I've paid a year membership for, even in weeks I don't enjoy it, partly because the year is paid for. Verdict: fine, no objection. (Is this even sunk cost reasoning or is that just... economics?)

  My tentative attempt at a principle: sunk costs matter when they've left behind something durable that still does work — the bugfixed code, the shared history, the two-thirds-finished degree — and don't matter when they're just gone, like money paid or hours already endured. This saves 2, and maybe 4 and 5, and it still condemns 1 and 6. But then case 3 vs case 4 bothers me, because they're both "endure misery to reach a completion," and I say walk out of the movie and stay in the PhD. Is the difference that the PhD leaves a credential and the movie leaves nothing? That feels like a different principle than the durable-residue one and I'm not sure they can both be true.

  So: is there one principle (or maybe a short list of them) that captures most of these verdicts? Which of my verdicts would you tell me to just give up on — I suspect 5 is the one holding me hostage? Please state the principle precisely enough to make predictions, tell me what it says about a couple of cases I haven't listed (e.g. half-built house I no longer love, or finishing a 900-page novel I'm 700 pages into and hating), and be honest about which of my gut calls your principle has to overturn rather than accommodate. Also happy to be told the textbook is just right and all my lenient verdicts are motivated reasoning — my coworker Dave certainly thinks so.
reasoning: |-
  Okay, this user is a developer who's hit a philosophical snag with sunk costs. They understand the textbook definition but their real-world judgments are inconsistent, and that's bothering them. They've listed seven concrete scenarios where their gut reactions clash with economic theory, and they're clearly frustrated by the disconnect. 

  Hmm, what's really interesting is how they've organized their examples - pairing structurally similar cases (PhD vs movie, legacy code vs useless feature) to highlight their cognitive dissonance. Smart framing. They're not just asking for textbook answers; they want a practical framework that explains why some sunk costs feel different. 

  The user's proposed "durable residue" principle shows genuine analytical effort. But their own counterexample (PhD vs movie both involve "completion") undermines it. They're self-aware enough to suspect rationalization, especially about the relationship example (#5), but also defensive of their sister's choice (#4). 

  I notice they're unusually precise in their language - "durable that still does work" isn't casual phrasing. This suggests they'd appreciate equally precise philosophical distinctions. The relationship example (#5) feels like the emotional crux: they know it should be irrational but can't condemn it, probably because human attachment resists cold economics. 

  Their hidden question might be: "Am I betraying logic by honoring emotional investments?" That's why they need the framework to accommodate both the legacy code (#2, practical residue) and the PhD (#4, investment residue) without collapsing into sentimentality about bad relationships (#5). 

  Key tensions to resolve: 
  - Why does "completion" matter for PhDs but not movies? 
  - When does "what's left behind" count as an asset versus a trap? 
  - How to differentiate between emotional commitments that create value (shared history) versus those that don't (coasting relationship)? 

  The user would reject any answer that dismisses their nuanced cases as "all irrational." They're clearly bright and want rigor, not condescension. But they'll also resist frameworks that feel inhumanly clinical. The solution must acknowledge affective value while providing clear decision criteria. 

  ...I think the economic concept of "option value" and Schelling's "investment identity" might bridge this gap. Need to show how credentials (#4), institutional knowledge (#2), and even relationships can be assets with future utility streams, while sunk time in movies or bad product lines (#6) are pure losses. Must explicitly address why "coasting relationship" (#5) fails the test though - that's their litmus. 

  Biggest risk is sounding like I'm inventing post-hoc justifications for their biases. Need to ground this in behavioral econ concepts like loss aversion too. Should emphasize that emotional costs are real costs (e.g., staying in movie causes active misery) to explain why walking out is rational despite paid ticket. 

  For the movie vs PhD contrast: the credential has compounding value while the movie's "completion" has zero marginal utility. Could model it as PhD having positive expected value from graduation point onward, whereas movie completion has negative NPV. 

  Final note: user mentioned "Dave" thinks they're rationalizing. Should preempt that criticism by showing how the framework would call out bad cases (like #5) while saving reasonable ones.
answer: |-
  You've hit on a fundamental tension between textbook economics and human psychology. Your instincts aren't wrong—they reveal nuances the "never consider sunk costs" rule ignores. Here's a principle that reconciles your cases while remaining actionable:

  **The Salvageable Value Principle:**  
  *Sunk costs themselves are irrelevant, but the **byproducts** of that sunk investment (knowledge, relationships, irreversible commitments, or tangible assets) may create future utility or avoid future costs. Only consider these byproducts if they:  
  (a) Exist independently of the decision, AND  
  (b) Generate measurable future benefit/cost avoidance, AND  
  (c) Would be destroyed or degraded by abandoning the project.*

  Let's apply this to your cases:

  | **Case** | **Your Verdict** | **Analysis via Salvageable Value Principle** |
  |----------|------------------|---------------------------------------------|
  | **1. Useless feature** | Kill it | No salvageable value. Code has no utility; abandonment costs zero. Textbook fallacy. |
  | **2. Legacy code** | Keep patching | **Salvageable value exists:** Years of bugfixes represent institutional knowledge. Rewriting destroys this asset and incurs new bug risks. |
  | **3. Bad movie** | Walk out | No salvageable value. Completion provides no benefit; staying imposes misery cost. |
  | **4. PhD misery** | Reasonable | **Salvageable value:** The credential has labor market value. Abandoning destroys 3 years' irreversible progress toward this asset. |
  | **5. Coasting relationship** | Wince but tolerate | *Problem:* Shared history alone isn't salvageable value unless it enables future benefits (e.g., co-parenting, joint assets). If no tangible future utility exists, this is sunk cost fallacy. Your gut is wrong here. |
  | **6. Dying product** | Textbook fallacy | No salvageable value. Sunk $40M created no unique asset. Future costs outweigh benefits. |
  | **7. Gym membership** | Fine | Not sunk cost fallacy! You're avoiding *new* costs (wasted membership fee if you pay but don't go). Future benefit: health gains from forcing attendance. |

  **Where Your Gut Needs Adjustment:**
  - **Case 5 (Relationship):** Shared history only matters if it enables future value (e.g., deep trust enabling marriage, shared finances). "A decade in" with no upside is pure fallacy. Your leniency is likely empathy, not logic.
  - **Case 4 vs Case 3:** The PhD has salvageable value (credential); the movie doesn't. "Completion" only matters if it unlocks something irreversible.

  **New Cases Tested:**
  - **Half-built house you hate:**  
    *Verdict:* Abandon if resale value of lot > cost to demolish. The partial construction has *negative* salvageable value (demolition cost). Sunk costs irrelevant.
    
  - **900-page novel at p.700:**  
    *Verdict:* Finish only if completion provides utility (e.g., book club discussion, personal achievement). If pure misery, quit. No inherent salvageable value in "finishing."

  **Why This Works:**  
  It accepts that sunk investments often leave behind *assets* (the PhD credential), *avoided costs* (not rebuilding institutional knowledge), or *irreversible commitments* (gym membership already paid). The fallacy lies in counting the *sunk effort itself*, not in recognizing what that effort left behind.

  **The Textbook Isn't Wrong, Just Incomplete:**  
  Economists say "ignore sunk costs" because they're *past and unrecoverable*. But they assume all else is equal—which ignores that sunk costs often create *enduring conditions*. Your legacy code example proves this: abandoning it destroys embedded value. The principle makes this explicit.

  **For Case 5 (Relationship):** Ask your friend: "If you met this person *today*, with no history, would you start a relationship?" If no, staying is irrational. History only matters if it enables something new (e.g., rebuilding intimacy). Otherwise, it's sunk cost fallacy in its purest form.

  Stick to your guns on Cases 2 and 4. Recalibrate on 5 and 7. And tell Dave that human systems generate residue—and rational agents account for residue.
