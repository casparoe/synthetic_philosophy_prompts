prompt: |-
  So, background: I'm an infectious disease epi person (I do outbreak modeling, surveillance stuff). I've been reading about so-called moral revolutions -- how practices like dueling and footbinding and the Atlantic slave trade went from normal to unthinkable, and Appiah's account that it was less about ethical argument winning and more about shifts in honor: a practice gets re-coded as dishonorable for the people whose status it was supposed to signal. There's also a nice point I've seen attributed to Bernard Williams, roughly that dueling died off once being a gentleman got cheap enough that the wrong kind of people could do it -- don't hold me to the exact wording, and don't go hunting citations, just take the gist.

  Here's what I want: translate that whole account of moral change into the vocabulary I actually use every day -- R0, susceptible and immune fractions, herd immunity thresholds, case fatality, endemicity, pathogen competition, evolutionary selection on variants, surveillance and ascertainment bias, host population structure. Do it as faithfully as you can: if the spread of an anti-dueling attitude among British elites is supposed to be like pathogen spread, tell me what plays the role of the pathogen, the vector, the susceptible host, the immune population, and whether there's anything like herd immunity for a norm. Where a metaphor would be doing sneaky work, flag it instead of pretending it's a real mapping -- I don't want my framework's assumptions smuggled in and called translation.

  Then give me the residue report. Which parts of Appiah-style claims translate cleanly, which come over only distorted (I suspect "honor is internal to a code" is going to be trouble, since in my world transmission doesn't care about meaning), and which can't be said at all in epi terms. And the question I actually care about: when something can't be said, is that because my vocabulary is missing a concept (norms have something pathogens don't, maybe an evaluative dimension), or because the philosophical claim was less clear than it looked to begin with? I'd genuinely like your view on which side the residue falls, not just a list.

  One more thing if you have room: in epi we worry a lot about reporting bias -- we only see the cases that got ascrtained. Is there an analogue for historians of moral change, where we overestimate argument-driven conversions because those are the ones who wrote letters and memoirs? Feels like it might explain why the "it was arguments wot won it" story is so sticky, but maybe that's just me pattern-matching.

  Please answer in American English. Also if you use epi jargon, assume I know it, no need to define R0 for me lol.
reasoning: |-
  Okay, the user is an infectious disease epidemiologist who works on outbreak modeling and surveillance. They're interested in translating the concept of moral revolutions—like the end of dueling or footbinding—into epidemiological terms. They specifically mention Appiah's idea that these changes are driven by shifts in honor rather than ethical arguments, and Bernard Williams' point about dueling dying when being a gentleman became too accessible. 

  The user wants a faithful translation using epi vocabulary: R0, susceptible fractions, herd immunity, etc. They’re wary of metaphors masquerading as direct mappings and want any distortions flagged. They also want a "residue report" identifying what parts of Appiah’s theory don’t translate cleanly into epi terms and why—whether it’s a gap in epi concepts or a flaw in the philosophical claim. 

  Additionally, they’re curious about an analogue for reporting bias in moral change history—like whether historians overemphasize argument-driven conversions because those are better documented. This is a sharp observation; it aligns with their epi expertise in surveillance gaps. 

  Breaking this down:  
  First, the core challenge is mapping abstract social concepts (honor, status signaling) to mechanistic epi models. The user’s skepticism about metaphors is valid—epidemiology deals with measurable biological transmission, while moral change involves meaning, intention, and social perception.  

  For the translation:  
  - **Pathogen**: The "anti-practice attitude" (e.g., anti-dueling sentiment). This spreads like an infectious agent.  
  - **Susceptible hosts**: High-status individuals whose identity is tied to the practice. They’re vulnerable to adopting the new attitude if their status is threatened.  
  - **Transmission routes**: Social mimicry (direct contact), prestige influence (vector-borne, where elites are vectors), and media exposure (environmental reservoir).  
  - **Herd immunity threshold**: Critical mass where abandoning the practice becomes self-reinforcing.  

  Bernard Williams’ point fits neatly: "Wrong kind of people" adopting dueling = increased exposure lowering the practice’s "status value." This is like a pathogen becoming endemic but losing virulence due to widespread immunity.  

  **Residue report**:  
  1. **Clean translations**:  
     - Network effects (clustered susceptibility in elites) → population structure.  
     - Tipping points → herd immunity thresholds.  
     - Prestige as vector → superspreader dynamics.  
  2. **Distorted translations**:  
     - "Honor is internal to a code" clashes because epi ignores meaning. In social contexts, the *same behavior* (e.g., refusing a duel) flips from dishonorable to honorable without biological change—it’s all about perception. Epi can’t model this semantic flip; it’d treat it as two separate pathogens.  
     - Immune escape isn’t parallel. Pathogens evolve to evade immunity; moral attitudes shift via reinterpretation (e.g., "true honor is courage to refuse"). Epi has no equivalent for meaning mutation.  
  3. **Untranslatable concepts**:  
     - **Evaluative dimension**: Honor isn’t just a neutral trait—it’s *about* how others judge you. Epi has no analogue for this self-referentiality.  
     - **Intentionality**: People adopt attitudes *because* they care about status. Epi’s transmission is mechanistic.  

