answer: |-
  Here’s a structured breakdown of desiderata for a theory of composition, designed to meet your specifications. I’ve prioritized clarity, flagged binding vs. contested requirements, identified key conflicts, and assessed major theories against the list. Desiderata are ranked by their importance for your stated purpose: **answering ordinary questions about existence** (e.g., "How many things are in this room?", "Is the wheel part of the bicycle?").

  ---

  ### **Core Desiderata for a Theory of Composition**
  *(Ordered by importance for ordinary existence questions)*

  1. **Extensional Adequacy**  
     - **Requirement:** The theory must align with uncontroversial, intuitive cases of composition/non-composition.  
     - **Clear Cases:**  
       - *Positive:* My nose + eyes + brain compose a person; planks + nails compose a ship.  
       - *Negative:* My nose + the Eiffel Tower compose nothing; all the water molecules in the ocean don’t compose a single "blobject."  
     - **Binding?** Semi-binding. *Most* theories accept this as a starting point, but **universalists reject negative cases** (they say *any* xs compose *something*). The nose/Eiffel Tower case *is* trained intuition, but it’s pragmatically indispensable for ordinary existence questions.  
     - **Purpose Link:** Essential for grounding the theory in reality. Failing this makes the theory useless for everyday questions ("Are there chairs in this room?").

  2. **Non-Circularity / Explanatory Power**  
     - **Requirement:** The composition relation must be defined without presupposing the concept of a "whole" or using question-begging terms (e.g., "arranged chairwise" is circular unless "chairwise" is metaphysically grounded).  
     - **Case:** If life is the condition for composition, "life" must be defined without referencing composition (e.g., not "self-sustaining organisms," which implies a whole).  
     - **Binding?** Binding. A theory that fails this is vacuous.  
     - **Purpose Link:** Necessary for the theory to be a genuine *explanation*, not a paraphrase.

  3. **Semantic Innocence**  
     - **Requirement:** The theory should preserve the truth of ordinary statements like "The table has four legs as parts" without requiring paraphrase into fundamental ontology (e.g., "there exist particles arranged table-wise").  
     - **Case:** "I wiped dust off the table" should entail that dust and the table exist as objects.  
     - **Binding?** Contested. **Nihilists reject this** (they demand paraphrase). For your purpose, it’s highly desirable: ordinary existence questions assume tables and dust *exist*. Quantifier restriction ("there exists a table*" where * is a restricted quantifier) is a compromise.  
     - **Purpose Link:** Critical for applicability to everyday discourse.

  4. **Non-Arbitrariness**  
     - **Requirement:** If the theory implies cutoffs (e.g., "composition occurs only for organisms"), it must provide a *principled reason* why the cutoff isn’t one step left/right (e.g., why a dying organism still composes a whole, but a corpse does not).  
     - **Case:** The Ship of Theseus’s gradual disassembly – a theory with a sharp cutoff must justify *where* it falls.  
     - **Binding?** Binding for *restricted* theories. "Brute fact" cutoffs are widely seen as ad hoc and defeat explanatory goals. Universalism/nihilism avoid cutoffs but face other problems.  
     - **Purpose Link:** Avoids answers that feel unsatisfying or ungrounded (e.g., "There are 5 things in this room, but if you moved one atom, suddenly 10,000 things").

  5. **Vagueness-Accounting**  
     - **Requirement:** The theory must either:  
       (a) Explain how composition can be vague (e.g., in borderline cases like half-assembled ships), or  
       (b) Defend why composition is never vague (e.g., via epistemicism or ontic precision).  
     - **Case:** A sand dune losing grains one by one – when does it cease to exist?  
     - **Binding?** Contested. Lewis’s "vagueness in composition → vagueness in existence" argument polarizes:  
       - *Acceptable:* If you tolerate vague existence (e.g., supervaluationism).  
       - *Unacceptable:* If you demand existential precision (e.g., classic mereology).  
     - **Purpose Link:** Vital for handling real-world borderline cases ("Is that pile of rubble still a house?").

  6. **Junk/Gunk Compatibility**  
     - **Requirement:** The theory must address whether:  
       - *Junk:* Everything is part of a larger whole (no "cosmic junk").  
       - *Gunk:* Everything has proper parts (no atomic simples).  
     - **Case:** If gunk is possible (infinitely divisible matter), composition never "bottoms out."  
     - **Binding?** Not binding for ordinary purposes. Junk/gunk are primarily *metaphysical stress tests* – relevant for formal mereology but rarely for daily existence questions. A theory can be "incomplete" but still useful for your goals.  

  ---

  ### **Key Conflicts Between Desiderata**
  1. **Extensional Adequacy vs. Non-Arbitrariness**  
     - *Conflict:* Restricted theories (e.g., organicism) nail extensional adequacy for clear cases (chairs, organisms) but struggle with vagueness, leading to arbitrariness (e.g., "Why *this* exact arrangement for a chair?").  
     - *Result:* Theories often sacrifice one for the other. Organicism preserves adequacy but risks arbitrariness; universalism avoids arbitrariness but violates adequacy.

  2. **Semantic Innocence vs. Non-Circularity**  
     - *Conflict:* Nihilism satisfies non-circularity ("composition never occurs") but violates semantic innocence (ordinary statements are false). Organicists satisfy innocence but risk circularity (if "life" relies on prior composition).  
     - *Result:* Compromises like quantifier restriction emerge, but they feel like "cheating" to strict ontologists.

  3. **Vagueness-Accounting vs. Non-Arbitrariness**  
     - *Conflict:* Accepting vague composition avoids arbitrariness in borderline cases but may imply vague existence (which some find intolerable). Rejecting vagueness forces sharp cutoffs, risking arbitrariness.  
     - *Result:* Universalism handles vagueness easily; organicism must deny it or embrace brute cutoffs.

  ---

  ### **Theories vs. Desiderata (Brief)**  
  *(Focus: Ordinary existence questions)*

  | **Desideratum**          | **Nihilism**                     | **Universalism**                  | **Organicism (Restricted)**        |
  |--------------------------|----------------------------------|-----------------------------------|-----------------------------------|
  | **Extensional Adequacy** | ✘ Fails negative cases (says "no chairs exist") | ✘ Fails negative cases (says "nose + Eiffel Tower compose something") | **✓ Nails clear cases** (organisms: yes; random atoms: no) |
  | **Non-Circularity**      | **✓ Trivially satisfied** (no composition) | **✓ Satisfied** (composition always occurs) | △ Risk: "Life" may presuppose composition |
  | **Semantic Innocence**   | ✘ Demands paraphrase ("atoms arranged chair-wise") | **✓ Preserves innocence** (statements about chairs are true) | **✓ Preserves innocence** |
  | **Non-Arbitrariness**    | **✓ Avoids cutoffs** (nothing composes anything) | **✓ Avoids cutoffs** (no restrictions) | ✘ Struggles with vagueness (e.g., dying organism → corpse) |
  | **Vagueness-Accounting** | **✓ Denies vagueness** (no composites to be vague) | **✓ Handles vagueness** (objects can be vague) | ✘ May deny vagueness → arbitrary cutoffs |
  | **Junk/Gunk**            | ✓ Compatible with both          | ✓ Compatible with both           | △ May imply no gunk (if life requires atoms) |

  **Most Exclusionary Desideratum: Extensional Adequacy**  
  - **Why:** It’s the primary divider. Universalism fails negative cases; nihilism fails positive cases; restricted views (like organicism) are *built* to satisfy it but then struggle with arbitrariness/vagueness. For ordinary questions ("Is there a chair here?"), failing this makes the theory non-starter.  

  **Winner for Your Purpose? Organicism (cautiously)**  
  - Best balance: Respects ordinary objects (semantic innocence), explains clear cases (extensional adequacy), and avoids universalism’s absurdities. But it *must* address non-circularity (define "life" without composition) and non-arbitrariness (explain vagueness). If it fails these, nihilism with quantifier restriction ("there exists* a chair") may be the fallback – but it’s a semantic concession.  

  **Final Note:** No theory satisfies all desiderata perfectly. If ordinary existence questions are your goal, **organicism** (or similar restricted view) is the most pragmatic, but **extensional adequacy** is the hurdle that forces tough trade-offs.
