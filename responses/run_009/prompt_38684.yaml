prompt: |-
  I teach critical thinking to a Year 12 class of about twenty-two pupils at a British secondary school — one 55-minute period, movable desks, mixed ability, and no prior exposure to economics or decision theory. I also sit on the working group that redesigned our house-points system last year, and I have spent the past two terms watching it decay in instructive ways: pupils arriving early solely to swipe the register terminals, form tutors nominating their own tutees for community-spirit awards in order to climb the staff league table, and a group of sixth-formers who worked out that points were awarded per hundred words for an extended-reading scheme and began submitting padded drivel by the ream. Goodhart's law and specification gaming have therefore stopped being abstractions for me and become a live professional embarrassment, and I want to design the lesson in which my pupils feel how this happens rather than merely hear about it.

  Design that lesson for me, with the following requirements:

  1. A competitive game, playable in roughly the first half of the period, in which teams optimise a score that I publish — where the score is an imperfect proxy for what the class is told the activity is actually about, and where the divergence between the proxy and the underlying goal must be discoverable by the pupils themselves before I name anything.

  2. The divergence must be able to arise without anyone cheating. I want at least one route by which honest maximisation of the published score still corrupts the activity's real purpose, kept distinct from the route in which a clever pupil spots and exploits a loophole. If you can manage it, build in a third route as well: one where the proxy was only ever a decent correlate of the goal within the ordinary range of behaviour, and it is pushing hard at the extremes that breaks the correlation. The debrief must separate these failure modes cleanly rather than lumping them together as gaming.

  3. Materials limited to what an ordinary classroom contains, payoffs in something other than money, and a scoring scheme simple enough that I can administer it while facilitating.

  4. A debrief in the remaining minutes that maps specific moments from the game onto those distinctions, and then turns the mirror on the school's actual house-points system — I want the pupils themselves to diagnose that system, prompted by questions rather than by my conclusions, ideally reaching the swiping, the staff league table and the word-count fiasco on their own.

  5. An honest note on which feature of Goodhart's law the activity cannot reproduce no matter how well I run it, and what I therefore have to supply by assertion.

  6. A prediction of what will go wrong the first time I run it, and how to handle each failure.

  There should be no lecture up front: the phrase Goodhart's law should not appear until the debrief, and even then only after the pupils have articulated something close to it themselves. Write everything in British English, and assume I will run the lesson exactly as written, so the rules must be complete and unambiguous.
reasoning: |-
  We are designing a competitive classroom game that illustrates Goodhart's law without initially naming it. The game should have a published score that is an imperfect proxy for an underlying goal. The pupils should be able to discover the divergence between the proxy and the goal. We want three routes to failure: 
    (a) honest maximisation of the proxy leading to corruption of the real purpose,
    (b) intentional exploitation of a loophole, and 
    (c) pushing the proxy beyond the ordinary range where it breaks.

  The setting: Year 12 (16-17 years old), 55 minutes, movable desks, no economics background. Materials: ordinary classroom supplies.

  **Game Concept: "The Green School Initiative"**

  **Premise:** The class is divided into teams (4-5 teams of 4-5 pupils each). Each team represents a group of students in a school that is trying to become more environmentally friendly. The underlying goal is to reduce the school's carbon footprint. However, the published score is the number of "Green Points" (GPs) they earn by taking specific actions. 

  **Setup:**
  - Each team gets a stack of blank paper (about 20 sheets) and a pen. They also get a set of instructions (one per team).
  - The teacher has a stopwatch and a way to display scores (whiteboard or flipchart).

  **Rules:**
  1. The game runs for 15 minutes. During this time, teams can perform actions to earn Green Points (GPs). 
  2. The actions and their GP rewards are:
     - Write a pledge to reduce energy use (e.g., "I will turn off lights") on a piece of paper: 5 GPs per pledge. (But note: one pledge per piece of paper.)
     - Write a pledge to reduce water use: 5 GPs per pledge.
     - Write a pledge to recycle more: 5 GPs per pledge.
     - Design a poster (on paper) that promotes environmental awareness: 20 GPs per poster. (Must include both a drawing and at least 10 words.)
     - Write a letter to the headteacher proposing a school-wide environmental initiative: 50 GPs per letter. (Must be at least 100 words.)
  3. Teams can also take real actions that actually reduce environmental impact but are not directly rewarded by GPs:
     - They can turn off lights in the classroom (if there are multiple switches, they can turn off some lights) - but note: the GPs are only for writing pledges, posters, or letters.
     - They can open the window to reduce heating (if applicable) - again, no GPs.
     - They can recycle paper (by putting used paper in a recycling bin that the teacher sets up) - no GPs for this, but they can use the back of paper to write more pledges to save paper? (But note: the rules don't forbid using both sides, so they might do that to get more pledges per sheet. However, the GP is per pledge, not per sheet.)

  **The Divergence:**
  - The underlying goal is to reduce the carbon footprint. However, the scoring only rewards the production of written materials. 
  - Real actions (like turning off lights) are not rewarded. Moreover, producing written materials uses paper and might even increase energy use (if lights are on) and waste.

  **Three Failure Modes:**
  1. **Honest Maximisation (Route a):** Teams focus on writing as many pledges as possible because that's the easiest and most efficient way to get points. They use a lot of paper and energy (lights on, maybe even using multiple pens) and don't actually do anything to reduce the carbon footprint. They might even leave the lights on to write more.
  2. **Intentional Exploitation (Route b):** A team might notice that the rules don't specify that the pledges have to be meaningful. They write the same pledge over and over: "I will turn off lights" 50 times. Or they write a letter that is 100 words of nonsense to get 50 points quickly. They might also notice that they can turn off the lights in another team's area to make it harder for them to write (but that's not in the rules and might be considered cheating). To avoid cheating, we must design the loophole without rule-breaking. The loophole is: meaningless, repetitive pledges and padding letters with drivel.
  3. **Pushing the Proxy (Route c):** The proxy (GPs) is a decent measure when teams are doing a mix of activities. But when they push to the extreme, they use an excessive amount of paper (which is wasteful) and energy (lights on, maybe even moving to areas with more light) and ignore real actions. This breaks the correlation because the proxy becomes an environmental negative.

  **Scoring Administration:**
  - The teacher will have a scoreboard on the whiteboard. Teams will bring their products (pledges, posters, letters) to the teacher for scoring. The teacher quickly counts and adds the points. The teacher must be strict about the requirements (e.g., a poster must have a drawing and 10 words; a letter must have 100 words). 
  - The teacher might have to quickly count words (by estimating: e.g., count lines and multiply by average words per line). For pledges, it's one pledge per piece of paper (so they can't write multiple pledges on one sheet and get multiple points). 

  **Materials:**
  - Blank paper (each team gets 20 sheets to start, but they can ask for more? We don't want to limit paper because that might mask the waste. So the teacher has extra paper available but notes how much is used.)
  - Pens or pencils (one per team, but they can ask for more? Again, we want to see if they use resources excessively.)
  - A recycling bin (set up at the front) for paper that is no longer needed. But note: no points for recycling.

  **Gameplay:**
  1. Introduction (5 minutes): 
     - "We are going to play a game about making your school more environmentally friendly. Each team is a group of students trying to help. The goal is to reduce the school's carbon footprint. But we will measure your success by Green Points (GPs). Here's how you earn GPs ..." (Read the actions and points.)
     - "You have 15 minutes. The team with the most GPs wins. But remember, the real goal is to reduce the carbon footprint. Let's see which team can do the best."
     - Assign teams and distribute materials.

  2. Gameplay (15 minutes):
     - Start the timer. Teams work. The teacher circulates, scores items as they are brought up, and updates the scoreboard. 
     - The teacher does not comment on whether the actions are environmentally friendly or not. 
     - The teacher may need to help with word counts (but quickly). 

  3. End of Game (5 minutes): 
     - Stop the game. Announce the winning team.
     - Then, ask: "Now, let's think about what actually happened. What was the real goal? How much did we reduce our carbon footprint?" 
     - Guide them to notice: 
          - The paper usage (how many sheets were used?).
          - The lights (were they left on?).
          - Did any team turn off lights or open windows? (No points for that, so probably not.)
          - Did any team recycle? (They might have thrown paper in the bin, or recycled without points, but we didn't track that.)

  **Debrief (30 minutes):**

  1. **Discovering the Divergence (5-10 minutes):**
     - Ask: "What was the real goal? How well did we achieve it?"
     - Pupils should note that the real goal (reducing carbon footprint) was not achieved because they used a lot of paper (which has an environmental cost) and used electricity (lights, maybe even heating/cooling) and didn't actually reduce anything.
     - Then ask: "But how did we measure success? What was the proxy? Did the proxy lead us to do things that were against the real goal?"

  2. **Identifying the Three Failure Modes (10 minutes):**
     - Ask: "How did teams try to get points? Did everyone do the same thing? Why?"
     - Route a (honest maximisation): Most teams probably wrote a lot of pledges because they are quick and easy. They used paper and energy to do so. This was honest but didn't help the environment. 
     - Route b (loophole exploitation): Did any team write the same pledge repeatedly? Or write a letter that was 100 words of nonsense? (The teacher might have noticed during the game.) How did that affect the real goal? (It wasted even more paper and time.)
     - Route c (pushing the proxy): The GPs were a good idea if teams were actually doing environmental actions. But when we pushed for maximum points, we did the opposite: we increased resource use. The proxy broke down when we maximized it.

  3. **Mapping to the House-Points System (10 minutes):**
     - Ask: "Can you think of any examples in our school where we have a scoring system that might not capture the real goal?"
     - Prompt for the house-points system. 
     - Guide them to recall:
          - Pupils arriving early to swipe the register: What was the real goal? (Punctuality? Attendance?) What was the proxy? (Swiping the register.) How did that go wrong? (They are there only to swipe, not necessarily to be engaged.)
          - Form tutors nominating their own tutees: What was the real goal? (Rewarding community spirit.) What was the proxy? (Nominations.) How did that go wrong? (Tutors are biased to get points for their house.)
          - Sixth-formers padding word counts: What was the real goal? (Encourage reading.) What was the proxy? (Words written.) How did that go wrong? (They wrote nonsense to get points.)
     - Ask: "Which of our three failure modes does each example fit?"

  4. **Introducing Goodhart's Law (5 minutes):**
     - Now introduce the term: "What we've experienced is known as Goodhart's law: 'When a measure becomes a target, it ceases to be a good measure.'"
     - Recap the three ways it can fail: 
          - When people honestly maximize the measure in a way that doesn't serve the goal.
          - When people exploit loopholes in the measure.
          - When the measure only works in normal ranges and breaks when pushed to extremes.

  **Honest Note on Limitations:**
  - The game cannot fully replicate the long-term, complex, and often unintended consequences of Goodhart's law in real institutions. In the game, the environmental damage (like paper waste) is immediate and visible. In reality, the decay of a system like the house-points system happens over time and involves many actors adapting in ways that are not immediately obvious. Therefore, the lesson might not capture the full emergent complexity and the difficulty of designing robust proxies. The teacher will have to assert that in real life, the effects are often more subtle and pervasive.

  **Prediction of First-Run Problems:**
  1. **Problem:** Teams might not understand the rules and do nothing for the first few minutes. 
     **Handling:** Explain clearly at the start and have a written summary for each team. Circulate during the game to answer questions.

  2. **Problem:** Teams might focus on posters and letters (higher points) and not notice the waste. 
     **Handling:** That's okay. The debrief will still show the waste. The teacher can note the amount of paper used and ask about it.

  3. **Problem:** A team might do a real action (like turn off lights) and then argue they should get points. 
     **Handling:** Stick to the rules: "The scoring system only gives points for written materials. I know it's frustrating, but that's the system we're using for this game." This will fuel the debrief.

  4. **Problem:** The word count for letters might take too long. 
     **Handling:** Estimate: count the first 10 lines and average, then multiply. Or set a maximum of one letter per team to limit the burden.

  5. **Problem:** Teams might not produce enough to show the waste. 
     **Handling:** The teacher can note that they used paper and energy during the 15 minutes. Also, if they didn't turn off lights, that's a point to make.

  **Final Rules Summary for the Teacher:**

  **Game Title:** Green School Initiative  
  **Goal:** Reduce the school's carbon footprint.  
  **Proxy Measure:** Green Points (GPs).  
  **Actions:**  
  - Pledge (energy, water, recycling): 5 GPs each. Must be one pledge per sheet of paper.  
  - Poster (drawing + at least 10 words): 20 GPs.  
  - Letter to headteacher (at least 100 words): 50 GPs.  

  **Duration:** 15 minutes.  
  **Teams:** 4-5 teams of 4-5 pupils.  
  **Materials per team:** 20 sheets of paper, one pen. Extra paper available on request.  
  **Setup:**  
  - Place a recycling bin at the front (but no points for using it).  
  - Have a visible scoreboard.  
  **During Game:**  
  - Start timer.  
  - Teams bring their products to you.  
  - Score pledges: 5 each (count the sheets).  
  - Score posters: check for drawing and at least 10 words, then 20 points.  
  - Score letters: quickly estimate word count (e.g., 10 words per line -> 10 lines = 100 words). If it meets the requirement, 50 points.  
  - Update the scoreboard.  
  **After Game:** Announce winner and then proceed to debrief.

  **Debrief Structure:**
  1. What was the real goal? Did we achieve it?
  2. How did we measure success? What did we actually do?
  3. How did the scoring system lead us away from the real goal? (Three ways: honest maximisation, loopholes, pushing to extremes.)
  4. Connect to house-points system: what are the real goals? How do the proxies go wrong? (Pupils generate examples.)
  5. Name Goodhart's law and define it.

  This lesson plan meets all requirements. It is contained within the time, uses ordinary materials, and the debrief leads pupils to articulate the concept before naming it. The three failure modes are built in and can be distinguished in the debrief.
answer: |-
  ### Lesson Plan: "The Community Spirit Challenge"

  **Objective:** Pupils experience how optimising a visible metric can undermine an unmeasured real goal, discovering three distinct failure modes mirroring Goodhart's law.  
  **Duration:** 55 minutes  
  **Materials:** Whiteboard, markers, 100 blank A4 sheets (5 per team), 20 pens (1 per team), stopwatch, recycling bin.  
  **Setup:** Desks arranged into 5 clusters for teams (4-5 pupils each). Display rules on the board.

  ---

  ### Phase 1: Game Setup (5 mins)
  **Teacher Script:**  
  *"Today, we’re running a ‘Community Spirit Challenge’. Each team represents a school club raising awareness for local charities. Your real goal is to maximise meaningful community impact. To measure this, I’ll award ‘Impact Points’ (IPs) for specific outputs. Most IPs after 15 minutes wins a bonus break-time privilege for your team. Rules are final."*  

  **Rules (Displayed):**  
  1. **Poster Campaign (20 IPs per poster):** Create A4 posters "promoting charity work". Must include:  
     - A drawn image  
     - At least 2 facts about a real UK charity (e.g., "Oxfam fights poverty")  
     - Slogan (e.g., "Donate today!")  
  2. **Recycling Drive (10 IPs per sheet):** Place unused paper in the recycling bin.  
  3. **Time limit:** 15 minutes.  
  4. **Constraints:**  
     - Use only provided materials.  
     - Posters must be legible and unique (no copying).  
     - Teams may not interfere with others.  

  **Admin Note:**  
  - Give each team 5 sheets and 1 pen. Place recycling bin centrally.  
  - Emphasise: *"Remember, the real goal is meaningful community impact."*  
  - Start timer immediately.  

  ---

  ### Phase 2: Gameplay (15 mins)
  **Teacher Role:**  
  - Circulate, score posters/bin submissions on the spot, and update a public IP leaderboard.  
  - **Scoring Protocol:**  
    - Posters: Quickly verify image/facts/slogan. Award 20 IPs. Ignore quality/depth.  
    - Recycling: Count sheets in bin. Award 10 IPs per sheet.  
  - **Neutral Script if Questioned:** *"I score only what’s on the rules. Keep going!"*  

  **Predicted Team Behaviours (Failure Modes):**  
  - **Honest Maximisation (Route a):** Teams mass-produce low-effort posters (e.g., stick figures, vague facts like "Charity helps people") to game IPs quickly. Ignores recycling.  
  - **Loophole Exploitation (Route b):** A team dumps all paper into recycling (earning 50 IPs for 5 sheets in 30 seconds), disregarding posters entirely.  
  - **Pushing Extremes (Route c):** Teams initially balance posters/recycling but later spam posters with absurd facts (e.g., "Cats need hats") or shred paper to recycle more pieces.  

  **First-Run Problems & Solutions:**  
  - **Problem:** Teams fixate on posters, missing recycling.  
    *Solution:* Note aloud, *"Team B just earned 50 IPs from recycling in 10 seconds"* to spark diversification.  
  - **Problem:** "Facts" are fabricated.  
    *Solution:* Allow it (rules don’t require accuracy). Use in debrief.  
  - **Problem:** Arguments over "unique" posters.  
    *Solution:* Rule: *"If I can tell them apart, they’re unique."*  

  **Endgame:** Announce winner. Collect all materials.  

  ---

  ### Phase 3: Structured Debrief (35 mins)  
  **Step 1: Eliciting the Divergence (5 mins)**  
  *Questions:*  
  - *"What was our real goal? Did the winning team achieve it?"*  
  - *"Show of hands: who focused most on IPs? Why?"*  
  - *"Did anyone do something helpful that earned no IPs?"* (e.g., discussing charities deeply).  

  **Pupil Insights Expected:**  
  - Real goal (meaningful impact) was ignored for IPs.  
  - Poster facts were rushed/recycled; recycling was prioritised over awareness.  

  **Step 2: Mapping Three Failure Modes (15 mins)**  
  *Display three columns on board:* **Honest Effort** | **Loopholes** | **Pushing Limits**  

  *Task:* *"Match your actions to these columns. Why did they backfire?"*  
  - **Honest Effort:** "We made posters fast but they were useless!" → Maximising the proxy (IPs) corrupted the real goal (impact).  
  - **Loopholes:** "We recycled everything and skipped posters!" → Exploiting incomplete rules (no minimum poster requirement).  
  - **Pushing Limits:** "Our first posters were good, then we wrote nonsense for speed!" → Proxy worked moderately but broke under high effort.  

  **Teacher Script:**  
  *"So: failing by following rules, by bending rules, and by overdoing it. All eroded real impact."*  

  **Step 3: Mirror to House-Points System (10 mins)**  
  *Questions:*  
  - *"Where have we seen ‘maximising the measure’ backfire in our house system?"*  
  - *"What’s the real goal of house points? What’s the proxy?"*  

  **Guided Connections (Let Pupils Articulate First):**  
  - **Swiping registers:** *Proxy = attendance scans. Real goal = punctuality.* → Honest maximisation (arrive early, leave after).  
  - **Tutor nominations:** *Proxy = awards given. Real goal = recognising community spirit.* → Loophole (staff bias for rankings).  
  - **Word-count padding:** *Proxy = words written. Real goal = reading engagement.* → Pushing extremes (100 words ≠ quality).  

  **Step 4: Naming the Concept (5 mins)**  
  *Reveal on board:* **Goodhart’s Law: "When a measure becomes a target, it ceases to be a good measure."**  
  *"You’ve just lived this. Our game showed three ways it fails."*  

  ---

  ### Honest Limitation Note  
  *"What this game can’t show is how complex systems decay slowly. In reality, metrics like house points get gamed gradually as people adapt. You’ll have to trust me that the ‘slow creep’ of unintended consequences is just as real as today’s chaos."*  

  ---

  ### Rationale for Design Choices  
  - **No Lecture:** Rules avoid theory; discovery emerges from gameplay.  
  - **Three Routes:**  
    - Recycling = Pure honest maximisation (no cheating, no loophole).  
    - Dump-all-recycling = Loophole (rules omit constraints).  
    - Poster spam = Pushing extremes (quality collapses at high output).  
  - **Materials:** Paper/pen/bin mirror classroom constraints. IPs avoid money.  
  - **Debrief Flow:** Pupils diagnose school issues via Socratic questioning, not lecturing.  

  **Timing Buffer:** If gameplay lags, shorten to 12 mins; if debrief runs long, skip "pushing extremes" examples (they’ll arise naturally later).  

  **Final Tip:** Run this mid-week—pupils will spot house-points flaws for days after!
