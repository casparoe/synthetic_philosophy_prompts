prompt: |-
  I've followed the collective-harms and inefficacy literature as it circulates in the rationalist blogosphere for the better part of fifteen years — the threshold models, the expected-value rejoinders, the suspicion that multiplying tiny pivotality probabilities by huge stakes is exactly where expected-value reasoning stops tracking anything real. On the theory, my considered position is mostly nodding along. My verdicts on actual cases are another matter entirely: I cannot make them hang together, and I'd rather find out what they add up to than keep applying the argument of the week to each case afresh. So here are the cases and my gut verdicts. Please tell me what principle, if any, captures them — or, failing that, which of my verdicts has to go.

  1. Twice a week I buy a chicken burrito when a vegan option sits on the same menu. Verdict: each purchase is a little bit wrong. Small, but real, and not the kind of thing an offset or an eye-roll at the infinitesimal marginal effect makes go away.

  2. Once a year I fly across an ocean for a vacation I would enjoy almost as much at half the distance. Verdict: permissible. I cannot make myself feel bad about it, and I'm not sure I should try — even though the flight plausibly emits more carbon than a year of those burritos.

  3. I vote in presidential elections, in a state my candidate carries by fifteen points. Verdict: something close to obligatory. Skipping it would make me a freeloader on everyone else's turnout, even though my vote's pivotality probability rounds to zero.

  4. I send forty dollars to a campaign in a swing state I don't live in. Verdict: optional, in the way charity generally is — praiseworthy if I do it, no stain if I don't. This despite the donation arguably buying more expected marginal influence than my safe-state vote, which I treat as near-obligatory.

  5. During a drought I water my lawn on my assigned days. Verdict: fine. If the city issues a ban and I water anyway, it becomes wrong immediately — and I don't think the harm got any bigger, because it didn't, at least not through my hose. Something else changed, and I can't say what.

  6. I observe a boycott of a company whose labor practices I deplore, and I'd quietly think less of a friend who didn't — even though my purchases are far too small to register in that company's decisions, and I know it, and my compliance has no threshold to cross.

  7. Offsetting. I pay for verified carbon removal to cover the annual flight and feel the matter settled. I donate the monetary equivalent of my burrito consumption to a well-run animal charity and feel that nothing whatsoever has been settled — the burritos are still wrong, donation or no donation.

  I do have a half-formed principle of my own, and it's failing in public: an individual contribution to a diffuse harm matters only when the harm arrives continuously, drop by drop, with no threshold structure anywhere in the pipeline — emissions, animal purchases, aquifer drawdown — and never when effects are lumpy or pivotality-based, which is supposed to explain why I shrug at vote-pivotality objections and why the drought ban in case 5 can't be about harm at all. But it classifies the flight and the burrito together, and it's silent on why boycott-compliance feels obligatory with no threshold in sight. So test it, repair it, or replace it.

  The case I keep going back and forth on: at a party, leftover chicken that would otherwise be thrown out. My eating it causes no further purchase, so there's no drop to add — but it doesn't feel like the act is fully laundered, the way the offset flight was. I want whatever principle you land on to take a stand on that case, and also on this one: should I reallocate my safe-state vote — which costs me an hour and does, by my lights, essentially nothing — into an hour spent persuading a friend in the swing state to vote? If your principle says yes, explain why my verdict on case 3 wasn't really about the vote at all; if it says no, explain what the hour is for. State the principle precisely, show which cases motivate which clauses, and be honest about which of my verdicts you cannot save.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about collective harm and individual action. They've clearly spent years wrestling with rationalist arguments about threshold models and expected value calculations, but their intuitive moral judgments don't neatly align with these frameworks. 

  What's striking is how visceral their examples feel - the chicken burrito guilt, the emotional weight of voting despite zero pivotality, the strange moral shift when a city issues a water ban. This isn't just theoretical; they're genuinely troubled by the inconsistency between their intellectual acceptance of collective harm arguments and their lived moral experiences.

  The core tension seems to be between three dimensions: 
  First, the rationalist/utilitarian framework where only expected marginal impact matters. 
  Second, their intuitive sense that participation in certain systems carries inherent moral weight regardless of impact. 
  Third, the role of social coordination - how rules and norms transform the meaning of actions.

  Their half-formed principle about continuous vs lumpy harms is insightful but fails to explain the voting/boycott cases. I notice they're particularly haunted by the "leftover chicken at a party" scenario - that liminal space where waste prevention meets complicity. And the voting time allocation question cuts to the heart of why ritual participation feels obligatory.

  What they're really asking for is moral coherence. Not just a theoretical framework, but one that honors their lived ethical experiences while resolving contradictions. The challenge is to preserve the wisdom in their intuitions - that voting matters beyond pivotality, that boycotts express solidarity - without abandoning all consequentialist rigor.

  The solution might lie in distinguishing different moral registers: individual causal responsibility vs collective complicity vs symbolic participation. Also crucial is how social coordination mechanisms (like drought bans) create new moral facts by changing the default baseline of expectations. Their offsetting examples perfectly illustrate how different contexts make compensation feel legitimate or hollow.

  For the leftover chicken case, I suspect their discomfort stems from normalizing consumption - even when causally harmless, it might reinforce problematic patterns. The voting time question reveals that what feels obligatory isn't the vote's impact but the ritual of participation in collective governance. Redirecting that hour to persuasion could be superior impact-wise, but loses something existentially important about showing up.
answer: |-
  Your verdicts reveal a coherent ethical framework that prioritizes **symbolic participation, social coordination, and expressive meaning** over strict expected-value calculations. I'll state the principle, show how it resolves your cases, identify tensions, and apply it to your unresolved questions.

  ---

  ### **The Principle of Symbolic Complicity and Expressive Obligation**
  *An individual act is wrong iff:*
  1.  **It expresses endorsement of a harmful system** *or* **constitutes defection from a cooperative norm**, *and*
  2.  **The act is perceptible/relevant within a moral community** (even if only to oneself), *and*
  3.  **No overriding justification exists** (e.g., necessity, negligible harm, superior alternative).

  *Where:*
  - **"Harmful system"** = a practice causing diffuse, continuous harm without individual thresholds (e.g., factory farming, aquifer depletion).
  - **"Cooperative norm"** = a shared rule designed to mitigate collective harm, where compliance signals mutual commitment (e.g., voting, drought bans, boycotts).

  ---

  ### **How It Explains Your Verdicts**
  | **Case** | **Verdict** | **Explanation** |
  |----------|-------------|-----------------|
  | **1. Chicken Burrito** | Wrong | Purchasing factory-farmed meat **endorses a harmful system** (continuous harm, no threshold). The act is perceptible to you (violating your values). No strong justification overrides this. |
  | **2. Long-Haul Flight** | Permissible | While harmful, flying isn't primarily an *endorsement of climate collapse*. It serves a valued personal need (travel). **Offsetting transforms it** into a neutral act by severing the harm link. |
  | **3. Safe-State Vote** | Obligatory | Voting is **participation in a cooperative norm**. Abstaining is **defection** – freeloading on others' civic effort. The ritual itself maintains democracy's legitimacy. |
  | **4. Swing-State Donation** | Optional | Donating aids a cause but isn't a **core cooperative obligation** like voting. It's supererogatory (praiseworthy charity), not duty. |
  | **5. Lawn Watering** | Permissible → Wrong | Without a ban, watering is neutral (allocated by fair rules). A ban creates a **cooperative norm**; violating it is **defection**, harming social trust. Harm magnitude is secondary. |
  | **6. Boycott** | Obligatory | Consuming from an unethical company **endorses its harmful system**. Compliance expresses solidarity with victims/like-minded peers. Pivotality is irrelevant. |
  | **7. Offsetting** | Flight: Settled<br>Burrito: Unsettled | Offsetting severs the flight's harm link. But buying the burrito **directly endorses animal suffering** as a system. Donations don't negate this expressive harm. |

  ---

  ### **Resolving Tensions**
  - **Burrito vs. Flight**: The burrito is a *direct, routine endorsement* of factory farming. The flight is an *indirect, exceptional* harm. Offsetting works for emissions (global, fungible) but not for direct moral complicity.
  - **Vote vs. Donation**: Voting is a **citizen's cooperative duty**; donations are **voluntary aid**. One maintains a system, the other optimizes within it.
  - **Boycott Without Threshold**: Compliance isn't about impact – it's **refusing to symbolically endorse evil**. Your judgment of others stems from seeing their choice as morally complicit.
  - **Drought Ban's Change**: The ban transforms watering from a **permissible allocation** into **defection from a collective effort**. The harm isn't physical; it's *eroding trust in shared rules*.

  ---

  ### **Your Half-Formed Principle Repaired**
  Your intuition about "continuous harm" is correct but incomplete. Add:
  - **Harm matters when it stems from a system you endorse via participation**.
  - **Cooperative norms create duties beyond pivotality**.
  - **Expressive meaning can outweigh marginal impact**.

  Revised Principle:  
  *An individual act contributing to diffuse harm is wrong if it either (a) directly endorses a harmful continuous system, or (b) defects from a cooperative norm addressing such harm – regardless of pivotality.*

  ---

  ### **Unresolved Cases Addressed**
  #### **Leftover Chicken at a Party**
  - **Verdict: Permissible (but context-dependent)**  
    Eating it doesn't endorse factory farming (no financial support) and prevents waste. However, if doing so **normalizes meat consumption** (e.g., others see you and think "even ethical people eat chicken"), it risks *expressive harm*. If inconspicuous, it's fully laundered.  
    *Contrast with Burrito*: Buying the burrito funds the system; eating leftovers doesn't.

  #### **Reallocating Safe-State Vote to Swing-State Persuasion**
  - **Verdict: Yes, reallocate**  
    Voting's obligation stems from **participation in the cooperative ritual**. Spending that hour persuading a swing-voter better serves the *same cooperative goal*: ensuring a good outcome. The ritual isn't sacred; its purpose is instrumental.  
    *Why voting felt obligatory*: Because in isolation, abstaining is defection. But if reallocation better achieves voting's purpose, it’s superior. The hour isn't *for* the vote; it's for **upholding democratic responsibility**.

  ---

  ### **Verdicts That Must Go**
  1. **The flight's permissibility without offsetting**.  
     If you accept that emissions cause continuous harm (Case 1), unmitigated flying is *also* endorsing harm – just less frequently. Your intuition likely relies on offsetting or exceptionalism.  
     → *Resolution*: Require offsets for flights, as you do.

  2. **Treating voting as intrinsically obligatory regardless of alternatives**.  
     If persuading a swing voter has vastly higher expected value than your safe-state vote (true), privileging the ritual over impact is fetishistic.  
     → *Resolution*: The duty is to **responsibly contribute to good outcomes**, not merely to vote.

  ---

  ### **Summary**
  Your judgments prioritize **moral integrity** (avoiding complicity with evil systems) and **civic cooperation** (honoring shared efforts) over naive utilitarianism. The tension arises when these conflict with impact-maximization (e.g., voting vs. persuasion). Resolve this by:  
  - **Endorsement/Defection > Pivotality** for moral wrongness.  
  - **Effectiveness > Ritual** when optimizing within duties.  

  This preserves your core intuitions while allowing smarter allocation of effort – and explains why eating leftover chicken feels distinct from buying a burrito.
