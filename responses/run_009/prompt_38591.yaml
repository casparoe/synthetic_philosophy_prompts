prompt: |-
  For thirty years I worked on sexual selection and communication in birds, and I have lately been sitting in on philosophy seminars where "costly signaling" is invoked to explain everything from conspicuous consumption to academic credentials. I have also watched economists apply the handicap principle to human affairs with a casualness that would never survive a grant review. Before I take any account of signal honesty seriously, I want the specification written out first. Please give me the desiderata: what any adequate theory of how signals stay honest must deliver.

  To make the job concrete, the theory should at least have something to say about the following: peacock trains and other ornaments that look like pure waste; stotting in Thomson's gazelles, where the signal is addressed to a predator rather than a mate; nestling begging, where both the sender and receiver have interests that are partly aligned and partly opposed; aposematic coloration, which is honest but looks cheap once the warning is heeded; degree credentials and luxury goods, where the cost is paid in a currency of money and time rather than fitness; and signals whose cost arrives only after the audience has responded, such as threats or promises whose credibility rests on what backing them out would later cost. Among the distinctions the theory must respect, I would expect at least these: cost actually paid versus cost necessary to maintain honesty; handicap signals whose expense is the point versus index signals that are honest because fakes are physically or developmentally impossible; and signals whose reliability is guaranteed by production costs versus by receivers punishing cheaters after the fact. For each desideratum, give the case or consideration behind it, and mark which are non-negotiable and which reflect the biases of the biological versus the economic tradition. Most importantly, tell me whether some subset of the desiderata cannot be jointly satisfied — for instance, whether demanding that the theory cover cost-free honest systems while retaining the core insight that honesty is purchased is already a contradiction. Finally, a brief scorecard of Zahavi's original handicap principle, Grafen's formalization in terms of separating equilibria, the index-signal view, and accounts that lean on receiver retaliation, against your list. I care most about the criteria; keep the scoring to a paragraph.
reasoning: |-
  Okay, let me process this user's query carefully. The user is an experienced ornithologist who spent thirty years studying sexual selection in birds, now engaging with philosophy and economics seminars where costly signaling is broadly applied. They express skepticism about casual applications of the handicap principle to human domains and demand rigorous specifications for any theory of signal honesty. 

  The core request is for a set of desiderata that any adequate theory of signal honesty must satisfy, with concrete examples spanning biological and economic contexts. The user lists several critical cases: peacock trains, gazelle stotting, nestling begging, aposematic coloration, academic credentials, and deferred-cost signals like threats. They also emphasize necessary distinctions like paid cost vs. necessary cost, handicap vs. index signals, and production-cost reliability vs. receiver-punishment reliability.

  Hmm, the user's background suggests they'll reject oversimplified models. Their examples deliberately stretch across contexts where interests align (nestlings), conflict (gazelle-predator), or mix (mate selection). The economic cases (credentials, luxury goods) explicitly decouple cost from fitness - a crucial complication. 

  I note their meta-concern: whether demanding coverage of cost-free honest systems inherently contradicts the "honesty is purchased" premise. This tension must be addressed head-on. Their request for a "scorecard" of existing theories against the desiderata requires concise but precise evaluation.

  The response should first establish non-negotiable criteria derived from evolutionary biology's hard constraints, then show where economic applications require extensions. Key biological desiderata would include: universal applicability to conflict/alignment cases, distinction between cost mechanisms, and recognition of receiver-dependent enforcement. For economic domains, currency conversion (money→fitness) and institutional punishment systems become critical additions.

  Regarding theoretical tensions: cost-free indices (like gazelle stotting being mechanically linked to fitness) don't contradict the handicap principle but rather complement it - Zahavi's original insight was about reliable information, not exclusively about waste. The scorecard should acknowledge where each theory excels (e.g. Grafen on mate selection) and fails (e.g. on post-facto punishment systems).

  The user's phrase "casualness that would never survive a grant review" indicates impatience with armchair theorizing. Therefore, every desideratum must be explicitly tied to their listed examples. For instance, the "deferred cost" requirement emerges directly from their threat/promise scenario.
answer: |-
  Here are the desiderata for any adequate theory of signal honesty, derived from your cases and distinctions. Non-negotiables (NN) stem from core evolutionary logic or empirical necessity. Others reflect disciplinary emphasis, marked [BIO] or [ECO].

  ### Core Desiderata (Non-Negotiable)
  1.  **Universal Applicability to Conflict/Alignment Spectra:** Must explain signals where sender/receiver interests are:
      *   *Opposed* (mate choice, predator deterrence - e.g., Peacock trains, Stotting gazelles).
      *   *Partially Aligned* (parent-offspring, mutualisms - e.g., Nestling begging).
      *   *Mostly Aligned* (e.g., coordination signals within a species).
      *   *Case:* Nestling begging involves shared interest in offspring survival but conflict over resource allocation. Stotting pits gazelle survival directly against predator success.

  2.  **Cost Mechanism Specification:** Must distinguish and account for:
      *   **Production/Upfront Cost:** Expense paid *before* or *during* signal production (e.g., growing/maintaining a peacock's train, metabolic cost of loud begging).
      *   **Potential Cost/Strategic Risk:** Cost incurred only *if* the signal is dishonest or the context changes *after* receiver response (e.g., cost of fleeing if bluffing a stot, cost of backing down from a threat, cost of being caught with fake credentials).
      *   **Case:** Peacock train (production cost), Stotting gazelle (potential cost: if weak, stotting delays escape), Threat/Promise (potential cost incurred only if challenged/breached), Degree credentials (production cost paid upfront, but potential reputational/career cost if incompetent).

  3.  **Honesty Maintenance Mechanism:** Must explain *how* cheating is prevented/unprofitable, specifying:
      *   **Costly Handicap:** Honesty enforced by intrinsic production/upfront costs making cheating *unaffordable* for low-quality/weak types (e.g., Zahavi's core idea for peacocks).
      *   **Indexical Constraint:** Honesty enforced because the signal is physically/developmentally linked to the underlying quality (e.g., deep voice linked to testosterone/size, stotting height linked to leg muscle power/health - faking is impossible).
      *   **Receiver Retaliation/Punishment:** Honesty enforced by receivers imposing costs *after* detecting dishonesty (e.g., parent withholding food from excessive beggars if not truly hungry, predator attacking stotting gazelle that can't run fast, employer firing incompetent degree holder, social sanctions for bluffers).
      *   **Case:** Peacock (handicap/index debate), Stotting (likely index + potential cost via predator test), Nestling begging (production cost + receiver punishment), Aposematism (initial production cost? + receiver "punishment" via tasting), Credentials (production cost + receiver punishment via verification/sanctions).

  4.  **"Cost" Defined in Relevant Currency:** Must handle costs paid in:
      *   **Fitness:** (Energy, survival risk, reproductive opportunity - e.g., peacock train, nestling begging, stotting).
      *   **Proxy Currencies:** (Money, time, effort) that *ultimately* translate to fitness consequences *within the specific context* (e.g., Degree credentials cost money/time → better job → resources → fitness; Luxury goods cost money → status → mating/social opportunities → fitness). The theory must model this translation. [ECO Bias, but NN for human applications]
      *   **Case:** Peacock (fitness), Credentials/Luxury Goods (proxy currency → fitness).

  5.  **Accounting for "Cheap" Honesty:** Must explain signals that are:
      *   **Initially Costly to Establish:** Require significant upfront investment to be credible.
      *   **Cheap to Maintain:** Once established/honesty is common knowledge, the *marginal* cost per signal can be low.
      *   **Case:** Aposematism (initial mortality cost high while predators learn; once learned, bright color is cheap deterrent). Warning signals only work *because* of the initial cost paid by pioneers/early signalers.

  ### Important Distinctions & Explanatory Requirements
  6.  **Cost Paid vs. Cost Necessary:** Must distinguish the *actual* costs borne by signalers from the *minimum* cost *required* to maintain honesty in equilibrium. A theory should predict the *necessary* cost level for stability. [BIO/ECO Emphasis]
  7.  **Signal Function vs. Cost Origin:** Must clarify if the cost *is* the signal (handicap principle core) or if cost is a *side-effect* of the signal being an index, or a *consequence* of receiver enforcement. [BIO Emphasis]
  8.  **Deferred Costs & Strategic Commitments:** Must handle signals where the major cost arises *only after* the receiver acts, contingent on the signaler's type/follow-through (threats, promises, stotting as invitation to chase). Reliability stems from the *differential cost* of backing down/fulfilling for honest vs. dishonest signalers. [BIO/ECO Critical]

  ### Addressing the Tension
  *   **Cost-Free Honesty + "Honesty is Purchased":** This *is* a contradiction **if** "purchased" *only* means upfront production cost. It is **not** a contradiction if "purchased" encompasses:
      *   The *evolutionary history* cost (e.g., aposematism's pioneer deaths).
      *   The *potential* cost of cheating (index constraints, receiver punishment).
      *   The cost of *maintaining the system* (e.g., predators occasionally sampling).
  *   **Resolution:** An adequate theory must encompass mechanisms beyond pure upfront handicaps. Indices and receiver retaliation provide pathways to honesty without marginal production costs per signal instance in equilibrium, though often with significant establishment or potential costs. The core insight is that reliability requires mechanisms making dishonesty *unprofitable*, not necessarily that every signal pulse is expensive.

  ### Scorecard of Major Theories
  *   **Zahavi's Handicap Principle (Original):** Strong on upfront cost handicaps explaining mate ornaments (Peacocks - NN1,2,3a,4a,7). Weak on indices, receiver punishment, partial alignment (Nestling begging), deferred costs, proxy currencies, cheap maintenance (Aposematism). Imprecise on cost paid vs. necessary (6).
  *   **Grafen's Formalization (Separating Equilibrium):** Rigorous math for handicap signals under specific selection regimes. Explains *necessary* cost (6) for stability in contexts like mate choice (Peacocks - NN1 opposed,2a,3a,4a). Weak on indices, punishment, alignment spectra (especially partial), deferred costs, proxies. Assumes cost functions make separation possible.
  *   **Index Signals:** Explains "cost-free" honesty *per signal* where physical/developmental constraints link signal to quality (Stotting likely index, some vocalizations - NN3b). Cannot explain signals decoupled from direct constraints (Peacock trains, many human signals). Complements handicap/punishment views.
  *   **Receiver Retaliation/Punishment Models:** Essential for nestling begging (NN3c, partial alignment NN1), aposematism (predator sampling), human institutions (credentials NN3c,4b), and enforcing deferred-cost signals (threats NN8). Explains honesty without high *marginal* production cost. Weak on explaining *initial* evolution of receiver discrimination/response rules without some prior cost/honesty.

  **In Short:** No single theory satisfies all NN desiderata alone. A complete framework requires integrating Handicap/SE (upfront cost for strong conflict), Indices (intrinsic constraints), and Receiver Retaliation (post-hoc enforcement, partial alignment, deferred costs, proxy currencies). Grafen provides rigor for handicaps; punishment models are crucial for nestling begging/human signals; indices explain specific morphologies; Zahavi's core insight (reliability requires cost/unprofitability of cheating) remains foundational, but the *nature* of the cost/unprofitability is diverse. The tension is resolvable by broadening "cost" beyond marginal production cost.
