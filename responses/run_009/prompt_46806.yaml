  Final decision procedure:

  **Water Utility Decision Procedure for Doing/Allowing Assessment**

  **Purpose:** To clarify the moral structure of decisions that involve potential harms and determine when the decision requires review by the Public Health Advisory Panel (PHAP) for a values judgment.

  **Input:** A candidate decision that may affect public health via changes in water quality, infrastructure, or service.

  **Output:** One of:
  - **A (Doing Harm):** The decision primarily involves actively causing harm.
  - **B (Allowing Harm):** The decision primarily involves failing to prevent harm that would occur independently of our action.
  - **C (Refer to PHAP):** The decision involves complexities (e.g., harm shifting, moral parity concerns, distributional fairness) that require the PHAP's input.

  **Steps:**

  1. **Identify Potential Harms:**
     - List each significant harm (or increased risk) that might result from the decision. Include the affected group, severity, and likelihood.
     - For each harm, state the baseline: what would happen regarding this harm if we did nothing (status quo) or took no new action?
     - Note any benefits (harms prevented) as well.

  2. **Causal Pathway (for each harm):**
     - Ask: Does the decision *initiate a new causal chain* that leads to the harm? (e.g., introducing a new chemical that causes illness)
       - If yes, flag as potential doing harm (A).
     - Or, does the decision *fail to intervene* in an existing causal chain? (e.g., not replacing lead pipes, so lead exposure continues)
       - If yes, flag as potential allowing harm (B).
     - Special case: If the decision involves not providing a barrier that would have prevented harm (e.g., not installing backup generators), flag as double prevention (a form of allowing harm, B).

  3. **Bare Difference Test (for each harm):**
     - Compare the decision scenario to the baseline. If the harm occurs in both scenarios but the decision changes which group is affected or the manner of the harm (without changing the overall level), then note this as a harm shift.

  4. **Double Prevention Check:**
     - If the decision involves not providing a prevention (like backup systems), note it as double prevention (B) and proceed.

  5. **Moral Parity and Fairness:**
     - For any harm flagged as doing harm (A), note that actively causing harm requires special justification. Also, if the harm is shifted to a specific group (from Step 3), note distributional concerns.
     - For any harm flagged as allowing harm (B), consider: Is the harm severe, and are we uniquely positioned to prevent it at reasonable cost? If so, the moral parity view might hold that allowing it is as bad as causing it, and this raises concerns.
     - If the decision involves trade-offs between groups (e.g., one group is harmed to benefit another), note fairness concerns.

  6. **Verdict:**
     - If any harm is classified as doing harm (A), then the overall verdict is **C (Refer to PHAP)** because actively causing harm requires explicit ethical review.
     - If all harms are allowing harm (B) and there are no harm shifts, no fairness concerns, and the moral parity challenge does not apply (i.e., the harm allowed is not severe and we are not uniquely positioned, or we are preventing a greater harm elsewhere without shifting), then the verdict is **B (Allowing Harm)** and the decision may proceed without PHAP (but document).
     - In all other cases (including harm shifts, fairness concerns, moral parity concerns, or a mix of A and B), the verdict is **C (Refer to PHAP)**.

  **Run the cases:**

  **Case 1: Coagulant Switch**
  - Harm 1: Increased GI illness in subgroup (doing harm, A) because it initiates a new causal chain.
  - Harm 2: Decreased bladder cancer (preventing harm, not a harm).
  - Step 3: Harm shift (subgroup bears new harm).
  - Step 5: Distributional fairness concern (vulnerable subgroup?).
  - Verdict: **C (Refer to PHAP)**. Actively causing harm to a subgroup requires PHAP review.

  **Case 2: Deferral of Lead Service Line Replacement**
  - Harm 1: Continued lead exposure for five years (allowing harm, B) because it fails to intervene in an existing chain.
  - Harm 2: The harm averted by the plant upgrade (preventing harm, not a harm).
  - Step 5: Moral parity concern? We are allowing severe harm to a vulnerable group (lead exposure) and we are uniquely positioned to prevent it. Also, fairness: we are deferring a fix to a known problem for a group to prevent a potential problem for the whole system.
  - Verdict: **C (Refer to PHAP)**. Distributional and moral parity concerns.

  **Case 3: Declining Backup Generators for Pipe Replacement**
  - Harm 1: Potential harm from blackout at pumping stations (allowing harm by double prevention, B).
  - Harm 2: The harm prevented by pipe replacement (preventing harm, not a harm).
  - Step 5: Distributional fairness: the harm we are allowing (if it occurs) is to the customers of three pumping stations, while the benefit (pipe replacement) may be spread out. We are exposing one group to risk to reduce risk for others. Therefore, fairness concern.
  - Verdict: **C (Refer to PHAP)**. Fairness must be reviewed.

  The board might hate Case 3 because we are referring a decision that seems rational (spending money to save more lives) to the panel. But the procedure is honest: it flags that we are allowing a harm to a specific group for the greater good, and fairness requires the panel's input. The procedure does not fudge the issue.

  **Misfires:**
  - The procedure may over-refer (as in Case 3) because almost every decision has distributional effects. But we want to catch the ones that involve doing harm or unfair shifts.
  - In public hearings, avoid using the terms "doing harm" vs. "allowing harm" because they can be misunderstood. Instead, focus on: "We are actively changing the water chemistry, which increases risk for [subgroup]" (Case 1) vs. "We are not investing in backup power, which leaves [area] vulnerable" (Case 3). The distinction matters internally for moral assessment, but externally we must explain the trade-offs.
  - Legal vs. Philosophical: Lawyers care about regulatory requirements and liability. For example, in Case 2, deferring lead line replacement might violate the Lead and Copper Rule. The philosophical distinction (allowing harm) does not negate legal obligations. The procedure is for moral bookkeeping, not legal compliance.

  This procedure ensures that the moral structure of decisions is explicitly considered and that values questions are elevated to the panel.
answer: |-
  Below is a decision procedure designed to help your staff systematically evaluate whether a candidate decision involves "doing harm" (actively causing harm) versus "allowing harm" (failing to prevent harm), with clear off-ramps to your Public Health Advisory Panel (PHAP) when values-based judgments are required. The procedure is grounded in key concepts from the philosophical literature on the doing/allowing distinction but translated into operational terms for engineers. I'll first outline the procedure, then apply it to your three cases, and finally discuss where it might misfire.

  ---

  ### **Decision Procedure: Harm Assessment Framework**
  **Purpose**: To determine if a decision primarily involves "doing harm" (A), "allowing harm" (B), or requires PHAP review due to moral complexity, fairness concerns, or unresolved philosophical tensions (C).  
  **Input**: A candidate decision with identified risks/harms.  
  **Output**: A verdict (A, B, or C) and documentation for PHAP if needed.  
  **Who Runs It**: Staff engineers (no philosophy background required).  
  **Time Commitment**: 2–3 hours for an afternoon memo, including data gathering.  

  #### **Step 1: Map Harms and Baseline**
  - **Question**: What harms (e.g., health risks, service disruptions) does this decision *introduce*, *increase*, or *fail to prevent*? For each, specify:  
    - Affected group(s), severity, likelihood, and duration.  
    - **Baseline**: What would happen *without this decision* (status quo)?  
    - **Net change**: Does the decision reduce total harm? If so, by how much?  
  - **Sufficient Answer**: A table listing:  
    - Harm type, affected group, quantitative risk (e.g., "5 excess GI cases/year in Subgroup X"), and baseline risk.  
    - If data is incomplete, estimate conservatively and flag uncertainties.  
  - **Why This Step**: Grounds the analysis in real-world impacts. Ignores "bare-difference" debates (whether doing/allowing is morally inert) by focusing on measurable outcomes.  

  #### **Step 2: Classify Causal Role**
  - **Question**: For each harm, does the decision:  
    - **Initiate a new causal chain** (e.g., adding a chemical that creates a byproduct)? → **Doing harm (A)**.  
    - **Fail to interrupt an existing chain** (e.g., not replacing pipes, allowing lead exposure to continue)? → **Allowing harm (B)**.  
    - **Remove/omit a barrier** to an external threat (e.g., not installing backup generators, enabling a blackout to cause harm)? → **Double prevention (B, subtype of allowing)**.  
  - **Sufficient Answer**: A brief causal narrative for each harm, using:  
    - Keywords: "Triggers," "introduces," or "starts" for **A**; "lets continue," "doesn't stop," or "fails to block" for **B**.  
    - Test: If the harm disappears when the decision is reversed, it’s likely **A**; if it persists or is enabled by inaction, it’s **B**.  
  - **Why This Step**: Draws on the "production" view (philosophers like Jonathan Bennett) that distinguishes doing/allowing by *how* harm arises, not just outcomes. Drops debates about moral parity (whether allowing harm is as bad as doing it) for later steps.  

  #### **Step 3: Assess Shifts and Fairness**
  - **Question**: Does the decision:  
    - Shift harm from one group to another?  
    - Disproportionately burden a vulnerable group (e.g., low-income, elderly, children)?  
    - Create a "bare-difference" scenario (same net harm, but redistributed)?  
  - **Sufficient Answer**:  
    - If no shift or disproportionate burden → Proceed to Step 4.  
    - If yes → Flag for PHAP (**C**), regardless of net benefits.  
  - **Why This Step**: Addresses core critiques of the doing/allowing distinction (e.g., bare-difference arguments). Values fairness over efficiency.  

  #### **Step 4: Evaluate Moral Parity and Pragmatic Constraints**
  - **Question**: Even if harm is "allowed" (B), is it:  
    - **Severe and preventable**: High likelihood/consequence, and mitigation is feasible?  
    - **Asymmetric in responsibility**: Does your utility have a unique duty to act (e.g., regulatory mandate, historical promise)?  
    - **Trade-driven**: Does preventing this harm require sacrificing a *larger* harm reduction elsewhere (e.g., budget trade-offs)?  
  - **Sufficient Answer**:  
    - If harm is severe/asymmetric **and not trade-driven** → **B** still applies, but consider PHAP if public trust is at risk.  
    - If harm is severe/asymmetric **and trade-driven** → **C** (PHAP must weigh fairness vs. efficiency).  
    - If harm is low-risk or pragmatic constraints dominate → **B** is acceptable.  
  - **Why This Step**: Tests the moral parity challenge (e.g., Peter Singer's view that failing to prevent harm is as bad as causing it). Pragmatic constraints (e.g., budget limits) are load-bearing and make this workable for engineers.  

  #### **Step 5: Render Verdict**
  - **Rules**:  
    - If **any harm** is classified as **A** (doing harm) → **Verdict C** (PHAP review required).  
    - If **all harms** are **B** (allowing harm) and no shifts/fairness issues (Step 3) → **Verdict B**.  
    - If **B with trade-driven severity** (Step 4) or **shifts/fairness issues** (Step 3) → **Verdict C**.  
  - **PHAP Handoff**: When verdict is **C**, document:  
    - "PHAP must resolve the values question: Is [action] justified given [specific trade-off, shift, or severity]?"  
  - **Termination**: Verdicts A/B are final; C triggers PHAP review.  

  ---

  ### **Application to Your Cases**
  I'll run all three cases through the procedure. **Case 3 will yield the board-unfriendly verdict** (C), as requested. All cases include PHAP handoffs where needed.

  #### **Case 1: Coagulant Switch**  
  - **Step 1 (Map Harms)**:  
    - Harm 1: Increased GI illness risk for older-branch customers (e.g., 10 excess cases/year). Baseline: Low GI risk.  
    - Harm 2: Reduced bladder cancer risk for all customers (e.g., 20 fewer cases/year). Baseline: Higher cancer risk.  
    - Net change: Total harm reduced (10 more GI cases vs. 20 fewer cancer cases).  
  - **Step 2 (Causal Role)**:  
    - Harm 1: New causal chain (new coagulant + pipe chemistry → GI illness). → **A** (doing harm).  
    - Harm 2: Prevents existing risk. Not a harm.  
  - **Step 3 (Shifts/Fairness)**: Harm shifted to older-branch customers (vulnerable if pipes are in low-income areas). → **Flag for PHAP (C)**.  
  - **Verdict: C** (PHAP review).  
  - **PHAP Handoff**: "PHAP must decide if actively increasing GI risk for older-branch customers is justified by reduced cancer risk overall, given equity concerns."  
  - **Why the Board Might Dislike This**: It halts a net-beneficial decision on fairness grounds. The procedure forces explicit debate on harm-shifting.  

  #### **Case 2: Defer Lead Service Line Replacement**  
  - **Step 1 (Map Harms)**:  
    - Harm 1: Continued lead exposure for 5 years (e.g., 15 excess child developmental cases). Baseline: Harm exists but would be reduced by replacement.  
    - Harm 2: Risk averted by plant upgrade (e.g., avoids 50 illness cases from contamination). Baseline: High risk without upgrade.  
    - Net change: Total harm reduced (15 more lead cases vs. 50 fewer plant-risk cases).  
  - **Step 2 (Causal Role)**:  
    - Harm 1: Fails to interrupt existing lead exposure. → **B** (allowing harm).  
    - Harm 2: Prevents future harm. Not a harm.  
  - **Step 3 (Shifts/Fairness)**: Harms fall on lead-line customers (likely vulnerable). Shift occurs via budget trade-off. → **Flag for PHAP (C)**.  
  - **Step 4 (Moral Parity)**: Severe, asymmetric harm (lead affects children; utility has a duty), but trade-driven. → **C**.  
  - **Verdict: C** (PHAP review).  
  - **PHAP Handoff**: "PHAP must decide if allowing 5 more years of lead exposure for vulnerable groups is justified by averting a larger plant risk, given the utility’s duty to address known hazards."  
  - **Why This is Defensible**: The verdict C doesn’t block the deferral but forces PHAP to weigh moral urgency ("allowing" lead harm) against efficiency.  

  #### **Case 3: Decline Backup Generators for Pipe Replacement**  
  - **Step 1 (Map Harms)**:  
    - Harm 1: Blackout-induced contamination at 3 pumping stations (e.g., 5 expected deaths in 20-year event). Baseline: Harm exists only if blackout occurs.  
    - Harm 2: Harms averted by pipe replacement (e.g., 15 expected deaths from main breaks). Baseline: High risk from aging pipes.  
    - Net change: Total harm reduced (5 more blackout deaths vs. 15 fewer pipe-failure deaths).  
  - **Step 2 (Causal Role)**:  
    - Harm 1: Omits barrier to external threat (blackout). → **B, double prevention** (allowing harm).  
    - Harm 2: Prevents future harm. Not a harm.  
  - **Step 3 (Shifts/Fairness)**: Harm 1 affects specific pumping-station customers; Harm 2 benefits broader groups. Shift occurs via trade-off. → **Flag for PHAP (C)**.  
  - **Step 4 (Moral Parity)**: Severe harm (deaths) but low probability; trade-driven (pipe replacement saves more lives). → **C** due to shift.  
  - **Verdict: C** (PHAP review).  
  - **PHAP Handoff**: "PHAP must decide if exposing pumping-station customers to blackout risk (by not installing generators) is fair, given that the same funds save more lives via pipe replacement."  
  - **Why the Board Will Hate This (and Why It’s Honest)**:  
    - The verdict C rejects a purely utilitarian choice (15 > 5 lives saved) because the procedure prioritizes fairness (Step 3) over efficiency. It forces PHAP to confront: "Is it acceptable to sacrifice Group A for Group B’s greater benefit?"  
    - **No Fudging**: The procedure doesn’t downplay double prevention as "less bad." It flags the shift to a fixed group as a values question. Engineers can’t resolve this alone—PHAP must own the equity trade-off.  

  ---

  ### **Where the Procedure Misfires**  
  The doing/allowing distinction is a tool, not a universal solution. It will misfire in:  

  1. **Public Hearings**:  
     - **Problem**: Framing harm as "allowing" (B) can sound like evasion. E.g., "You ‘allowed’ my child to get lead poisoning by deferring replacement" is morally indistinguishable from "you caused it" in public perception.  
     - **Solution**: Use the procedure internally to clarify PHAP referrals. Externally, emphasize outcomes and trade-offs—not philosophical labels.  

  2. **Legal vs. Philosophical Distinctions**:  
     - **Divergence**: Lawyers care about liability (e.g., regulatory compliance, negligence). The procedure cares about moral agency (e.g., "did we *cause* this?"). These conflict when:  
       - "Allowing" harms (B) still breaches regulations (e.g., deferring lead replacement may violate EPA rules).  
       - "Doing" harm (A) may be legally defensible if net-beneficial (e.g., coagulant switch).  
     - **Misfire**: The procedure could mislead staff into thinking "B = low liability." Always pair it with legal review.  

  3. **Over-Reliance on Baseline**:  
     - **Problem**: The status quo isn’t always neutral. E.g., legacy lead pipes represent historical injustice. "Allowing" their harm (B) may feel like "doing" harm (A) to affected communities.  
     - **Misfire**: Step 3 (fairness) catches this, but staff may underestimate vulnerabilities.  

  4. **Probabilistic Harms**:  
     - **Problem**: The framework struggles with low-probability, high-impact risks (e.g., blackouts). Staff might dismiss "allowing" double prevention (B) as "not real harm" until it happens.  
     - **Misfire**: Step 4’s "severity" test mitigates this but can’t eliminate hindsight bias.  

  5. **Moral Paralysis**:  
     - **Problem**: In emergencies (e.g., imminent contamination), over-indexing to "A = bad" could delay action.  
     - **Solution**: Build an "emergency override" for PHAP referrals in crisis scenarios.  

  ---

  ### **Final Recommendations**  
  - **Pilot the Procedure**: Test it on 2–3 past decisions to calibrate with staff.  
  - **Integrate with Legal**: Run alongside regulatory compliance checks.  
  - **PHAP Training**: Brief PHAP on the doing/allowing framework to streamline referrals.  
  - **Ethics Over Engineering**: The procedure’s strength is forcing transparency on trade-offs engineers can’t resolve. As you noted, it’s about "moral bookkeeping"—not avoiding hard choices, but making them principled.  

  This framework won’t make debates easier, but it will make them more honest—especially when the board’s preferred efficiency argument (e.g., Case 3) collides with fairness.
