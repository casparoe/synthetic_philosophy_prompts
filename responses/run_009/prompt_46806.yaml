  1. The traditional distinction: Doing harm is actively causing harm (e.g., pushing someone into a river to drown) while allowing harm is not preventing a harm that would occur otherwise (e.g., not saving someone drowning).
  2. Bare-difference argument: Some philosophers argue that if the outcome is the same, the distinction is morally irrelevant. Others counter by emphasizing the means by which harm comes about.
  3. Challenges: Some hold that failing to prevent harm when one could have is as bad as causing it.
  4. Double prevention: A special case where an agent prevents a prevention (e.g., not installing backup power that would have prevented deaths in a blackout).

  However, note that in many cases the distinction is not clear-cut. The procedure must be honest about when the issue is ambiguous and requires the advisory panel's input.

