answer: |-
  ### Quiz: What View of Disease Do You Really Hold?

  1.  **Sickle-Cell Trait:** A person carries one copy of the sickle-cell gene mutation. In their environment (with modern healthcare and no malaria), they experience no symptoms or health problems at all. They live a completely normal life.
      *   A) This is a disease or disorder.
      *   B) This is not a disease or disorder; it's just a genetic variation.
      *   C) It *could* become a disease under different conditions, but isn't one now.

  2.  **Severe Nearsightedness:** In a society without readily available glasses or contact lenses, a person has such poor vision they cannot safely navigate streets, recognize faces, read, or hold most jobs. Their eyes are biologically unremarkable except for their shape causing light to focus incorrectly.
      *   A) This is a disease or disorder.
      *   B) This is not a disease/disorder; it's a mismatch between the person and their environment/society.
      *   C) It becomes a disease only because of the social context.

  3.  **Harmless Mutation:** A rare, scientifically confirmed genetic mutation causes a distinct physical change (e.g., blue patches on the skin). It causes no pain, discomfort, functional impairment, increased health risks, or distress to the person, who views it neutrally.
      *   A) This is a disease or disorder.
      *   B) This is not a disease or disorder; it's just an unusual biological feature.
      *   C) It could be considered a disease if others found it distressing, but not as it is.

  4.  **Persistent Grief:** After the death of a loved one, a person experiences intense sadness, loss of interest, and difficulty functioning. These symptoms remain unchanged in severity 3 years later, significantly impairing their life, despite therapy. There's no other mental disorder.
      *   A) This is a disease/disorder (like prolonged grief disorder).
      *   B) This is not a disease; it's an understandable, though severe and persistent, human reaction to loss.
      *   C) It becomes a disease only because it lasts so long and causes impairment.

  5.  **Peaceful Tinnitus:** A person has constant, loud ringing in their ears (tinnitus) due to confirmed nerve damage. Initially distressing, they have now fully adapted through meditation and mindset. It causes them no distress, sleep problems, or functional impairment; they barely notice it.
      *   A) This is still a disease or disorder.
      *   B) This is no longer a disease/disorder; the biological problem is present, but it causes no harm.
      *   C) It was a disease but ceased to be one when the distress/impairment resolved.

  6.  **Historical "Drapetomania":** In the pre-Civil War US South, a proposed "disease" ("drapetomania") claimed the "pathological" urge of enslaved Africans to flee captivity was caused by masters being "too kind" or "too harsh". There was no underlying biological dysfunction identified.
      *   A) This was correctly classified as a disease/disorder at the time.
      *   B) This was never a real disease/disorder; it was a harmful social construct used for control.
      *   C) It was a valid diagnosis reflecting the social norms and distress *of that specific context*.

  7.  **Aging:** An otherwise healthy 85-year-old experiences gradual, universal age-related changes: slower movement, reduced sensory acuity, wrinkles, and slightly weaker muscles. They feel their life is full and meaningful, and these changes cause them no distress beyond mild inconvenience.
      *   A) Aging itself is a disease or disorder.
      *   B) Aging is not a disease/disorder; it's a natural biological process.
      *   C) Some *consequences* of aging can be diseases, but aging itself is not.

  8.  **Situational Anxiety:** A person experiences intense anxiety, panic attacks, and avoidance *only* when forced to give presentations at work. They are otherwise relaxed and functional. This significantly impacts their career progression. No underlying neurological abnormality is found.
      *   A) This is a disease/disorder (like Social Anxiety Disorder).
      *   B) This is not a disease/disorder; it's an extreme but understandable reaction to a specific stressful situation.
      *   C) It becomes a disease only because the societal demand (presenting) triggers such a strong reaction.

  ---

  ### Scoring Key

  This key maps patterns of answers onto core philosophical views of disease. **No single question defines a view; look for your overall pattern.** Positions are defined by their core requirements for something to be a disease.

  *   **I. Dysfunction-Only (Biostatistical):** Disease = statistically subnormal biological part-function (dysfunction), *regardless* of harm, distress, or social context.
      *   **Typical Answers:** 1A, 2A, 3A, 4A/C, 5A, 6A, 7A, 8A.
      *   **Core Belief:** If it's biologically dysfunctional (abnormal part-function), it's a disease. Harm is irrelevant. Social context explains *impact* but not the *disease status*.

  *   **II. Harm-Only (Normativist):** Disease = a condition causing harm (suffering, distress, disability, disadvantage, death) *to the person*, which they or society deem undesirable. Biological abnormality is irrelevant.
      *   **Typical Answers:** 1B, 2B/C, 3B/C, 4B, 5B/C, 6B, 7B, 8B.
      *   **Core Belief:** Harm/unwantedness defines disease. A biological "dysfunction" causing no harm isn't a disease. Social context *can* create harm (e.g., nearsightedness without glasses).

  *   **III. Hybrid (Dysfunction + Harm - "Bionormativist"):** Disease = *both* a biological dysfunction *and* significant harm/distress/disadvantage caused by that dysfunction. Requires BOTH elements.
      *   **Typical Answers:** 1B/C, 2C, 3B/C, 4A/C, 5B/C, 6B, 7B/C, 8A/C.
      *   **Core Belief:** A dysfunction without harm (e.g., peaceful tinnitus, harmless mutation) isn't a disease. Harm without a biological dysfunction (e.g., purely socially-induced distress) isn't a disease, though it might be a problem. Harm must be *caused by* the dysfunction.

  *   **IV. Strong Social Constructivist:** Disease status is *entirely* determined by social/cultural norms, values, and power structures. Biology provides raw material, but the label "disease" is a social judgment applied to unwanted states, regardless of biological basis.
      *   **Typical Answers:** 1B/C, 2C, 3C, 4C, 5C, 6B/C, 7C, 8C.
      *   **Core Belief:** "Disease" is a label societies apply to deviations from norms they find undesirable or disruptive. Biological facts (like dysfunction) don't define disease; social negotiation does. Historical diagnoses (like drapetomania) reveal this clearly.

  *   **V. Pragmatic/Contextualist:** Focuses on the *usefulness* of the label "disease" in a specific context (e.g., for treatment access, social support, research). Less concerned with strict definitions, more with whether calling it a disease serves a helpful purpose. Often overlaps with II or IV.
      *   **Typical Answers:** Variable, but often includes many "C" answers (context-dependent), especially on questions 1C, 2C, 4C, 5C, 7C, 8C. Might accept 6B or 6C.
      *   **Core Belief:** The key question isn't "Is it *really* a disease?" but "Is calling it a disease helpful here (for care, support, understanding)?" Context is paramount.

  **Inconsistent Patterns:** If your answers don't cluster clearly into one pattern above, it likely means:
  1.  Your view is nuanced or doesn't fit neatly into standard categories.
  2.  You hold different criteria for different *types* of conditions (e.g., physical vs. mental).
  3.  The quiz questions revealed tensions or inconsistencies in your underlying assumptions. This is valuable! Discuss where your answers diverged from the typical patterns and why.
