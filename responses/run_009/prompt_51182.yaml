prompt: |-
  I've been collecting my gut reactions to sunk-cost situations and I want to know if there's one principle behind them, because right now they look like a mess. Here are the cases with my verdicts:

  Reading a book I'm not enjoying, 40 pages from the end, and finishing it anyway becuase I've already read 300: fine. Waiting another 25 minutes at a bus stop instead of just walking the 15 minutes it takes, on the grounds that I've already stood there 25 minutes: not fine. A friend staying in a PhD program he hates at year six because quitting would "waste" the six years: not fine, honestly seems crazy. A city finishing a half-built bridge that's way over budget, where the remaining cost is still less than the benefit of having the bridge: fine — but note it feels like nobody is honoring anything there, they're just comparing remaining costs to remaining benefits, so maybe the sunk cost isn't doing any work in that case. My uncle refusing to sell a money-losing shop because of the 30 years he's poured into it: not fine. And the one I keep flipping on: I'll drop a bad TV series three episodes in with zero guilt, but quitting a bad video game 40 hours in feels like a betrayal of some kind, even when the game is worse than the series was.

  One more thing that might or might not be related: keeping a promise to a friend to help her move feels obviously fine, and citing the promise feels fine, but there's something that smells off about citing "I already promised" as the reason — like the reason is pointing backwards instead of forwards. Is that the same phenomenon, or am I mushing two things together? I have a half-formed suspicion that the answer here is going to be that honoring sunk costs is only rational when it happens to line up with a forward-looking comparison, and that all my "fine" cases are really forward-looking cases in disguise. If that's your conclusion, say it plainly — but then tell me what happens to my book case, since finishing those 40 pages is, looked at forward, a net loss for me, surely?

  Give me exactly five numbered items, a sentence or two each, no intro or conclusion. Across the five, cover: the principle itself, stated precisely; what it says about the case I keep flipping on; which of my verdicts, if any, it cant accommodate and has to overturn; and the last item should be you flagging the point you're least confident about, along with an honest statement of how confident you are in the whole thing.
reasoning: |-
  Okay, let me tackle this user's query about sunk costs. They've shared several personal examples where their gut reactions vary, and they're looking for a unifying principle. The key is to reconcile their conflicting verdicts—like finishing a book versus not waiting for the bus—while addressing their suspicion that forward-looking reasoning might explain the "fine" cases. 

  First, I need to identify the common thread. The user mentioned that in the bridge case, only future costs and benefits matter, which hints at the economic principle of sunk costs. But their book example complicates things because finishing it is a net loss, yet they deem it fine. This suggests an emotional or psychological factor at play beyond pure rationality. 

  Looking at their video game versus TV series flip-flop, the difference seems to be the magnitude of past investment (40 hours vs. 3 episodes). That points to loss aversion—the more you've invested, the harder it is to let go, even when irrational. The promise example also involves backward-looking reasoning but feels different because it's about integrity, not costs. 

  The challenge is the book case: why is finishing 40 pages "fine" if it's a net loss? The principle must allow for negligible costs or emotional closure as valid factors. I'll need to explicitly include psychological payoffs in the framework. 

  For the structure, I'll define the core principle first (ignore sunk costs, focus on future utility), then apply it to the video game case. Next, I'll note that the book verdict needs overturning unless closure justifies it. The fifth point will honestly flag uncertainty around emotional weighting. 

  The user wants concise, numbered points—no fluff. I should avoid economic jargon and keep it grounded in their examples. Their deeper need seems to be understanding why they feel torn, not just hearing textbook theory. Acknowledging the messiness of human psychology will resonate more.
answer: |-
  Here are five numbered items addressing your query:

  1.  **The Core Principle:** The rational principle is to ignore all irrecoverable past investments (sunk costs) and base decisions solely on future costs and benefits relative to the best alternative. Your feeling of "betrayal" or reluctance stems from emotional loss aversion, not rational cost-benefit analysis.

  2.  **The Video Game vs. TV Series Flip:** Your difficulty arises because the 40-hour investment feels like a significant loss to abandon, triggering loss aversion much more intensely than the 3-episode TV show. Rationally, only the future time/enjoyment matters; quitting both is justified if future play is worse than alternatives. The emotional weight of the larger sunk cost makes the game harder to quit.

  3.  **Verdict Requiring Overturn: The Book Case.** Your verdict ("fine") contradicts the principle. Finishing the last 40 pages is irrational if you dislike it and the time could be better spent; the 300 pages are sunk. The principle overturns this verdict – you *should* stop reading. Your feeling it's "fine" likely stems from low perceived cost, a completion urge, or faulty sunk-cost reasoning.

  4.  **Accommodating Other Verdicts:** The principle directly supports your "not fine" verdicts (bus stop, PhD, uncle's shop) and explains the bridge case ("fine" only because *future* benefits > *future* costs, sunk costs irrelevant). The promise case is different: honoring it builds trust/reputation (future benefit) and avoids guilt/costs of breaking it (future cost), making "I promised" shorthand for future-oriented reasons, not sunk cost.

  5.  **Point of Least Confidence:** I'm least confident about cleanly separating the psychological "completion/closure urge" (book, video game) from sunk cost fallacy. While distinct conceptually, they often intertwine practically. Overall confidence is high (85%) on the core principle but lower (65%) on fully capturing the visceral feeling in high-investment cases like the video game.
