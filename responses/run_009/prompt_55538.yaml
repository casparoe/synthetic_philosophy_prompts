prompt: |-
  ok so im a high school junior (16) and for our ethics unit we got to pick any topic and I picked whether eating farmed fish and shrimp is ok — salmon farms, shrimp ponds, all that aquaculture stuff. My teacher said I have to present "the landscape of views", not just my own opinion, and I figured the best way is to make a quiz for the class where people answer concrete scenarios and a scoring key tells them which position they actually hold, instead of them just picking a label they like the sound of.

  Can you write that quiz for me? like 9 questions, each one a specific situation with 2-3 answer choices. The situations should be ones where the real positions genuinely disagree, so nothing like "do you think fish can suffer?" asked straight up. Please work these four scenarios in somewhere:

  1. the "better death" case: a salmon farm starts stunning the fish before killing them instead of letting them asphyxiate on ice — does buying that fillet become more ethical, or is it just a nicer version of something that shouldn't exist at all (this is the welfarist vs abolitionist split i think)
  2. the shrimp hatchery thing where they cut the females' eyestalks off so they produce way more eggs (ablation? something like that) — some ppl say since shrimp probably dont remember it, its fine, others say its straight up disqualifying regardless
  3. crabs and lobsters — the uk government basically accepted a few years back that decapods are sentient, but everyone still boils them alive. where does the quiz put someone who accepts the science and still orders the lobster
  4. a substitution case: someone swaps beef for farmed fish for climate reasons — is that obviously right, or does the math flip because so many more individual animals die per meal

  then after the quiz give me the scoring key: map answer patterns onto positions, at minimum the welfarist reformer, the abolitionist, the "high-welfare certified only" buyer, the skeptic who draws the line at fish and wont extend it to decapods, and the climate-first person who only counts individuals. also do the thing where you point out combos of answers basically nobody would give, and for each one say whether thats because the view is incoherent or just because nobody happens to hold it, and tell me if any two positions in the key cant actually be seperated by my quiz questions (bc then i should swap a question out).

  dont make it something ppl could answer off a wikipedia summary — the sorting has to come from what they say about the cases. and keep the questions concrete, a little gross is fine, its for my own class.

  one format thing: end the whole thing with a single last line starting "Verdict:" that names, in one sentence, which single question in the quiz does the most work sorting people — i want to lead with it in my presentation.
