answer: |-
  ## The Blinker Gambit: An Endurantist & Perdurantist Spar After Class

  **Setting:** *Two grad students, Eli (Endurantist) and Pat (Perdurantist), grabbing coffee after the semester’s final Persistence Unit meeting. They’re tired but wired, the familiar argument bubbling up.*

  **Eli:** (Stirring coffee aggressively) Okay, Pat, final round. Let’s just… get the shape thing out of the way. Wire. Bent at noon. Straight at 1 PM. My take: The wire *is* bent, simpliciter, but *at noon*. It *is* straight, simpliciter, but *at 1 PM*. “At t” modifies the having-of-the-property. Adverbialism. Or, fine, it’s a relation: ‘bent-at’ holds between the wire and noon. Take your pick. Point is, it’s not *literally* both bent and straight simpliciter in the same way at the same time. Problem solved.

  **Pat:** (Leaning back, smirking) Solved? Eli, come on. That’s just… notation. Fancy syntax. You’ve got this one enduring thing, the wire, existing wholly at noon and wholly at 1 PM. At noon, it instantiates bentness. At 1 PM, it instantiates straightness. Both intrinsic properties. And nothing *about the wire itself* changes between those instants to explain how it can hold incompatible intrinsics *at different times*. Your adverb or relation is just a label for the mystery, not an explanation. It’s like saying a rock is both here and there because it’s ‘here-ly’ here and ‘there-ly’ there. Handy, but ontologically suspicious.

  **Eli:** Suspicious? It’s perfectly coherent! The *way* the property is had is temporal. The subject, the wire, persists identically through the change. It’s just that properties aren’t had timelessly. Your solution – slicing the wire into temporal parts – that’s the dodge! You *define away* the subject of change. No single thing *changes*; you just have different slices with different shapes. That feels like losing the phenomenon.

  **Pat:** Hold on. We agree, right? We both affirm “The wire is bent at noon” is true. We both affirm “The wire is straight at 1 PM” is true. We even agree on *when* it’s bent and *when* it’s straight.

  **Eli:** (Nods cautiously) Sure. The truth conditions seem shared.

  **Pat:** Exactly! So the *fight* isn’t about *what’s true* about the wire at different times. It’s about *what in the world makes those truths true*. For me, it’s the existence of the bent temporal part at noon and the straight temporal part at 1 PM, bound together as stages of a single spacetime worm. For you, it’s this single, wholly present entity instantiating properties in temporally modified ways. Our disagreement is about the underlying metaphysical reality, the *truthmakers*.

  **Eli:** (Sighs) Fine. Truce on the intrinsics trench warfare. It’s exhausting. But that just means we need a different battlefield to see whose truthmakers are… truer. Or at least, less problematic. I’ve got one for you. The Blinker.

  **Pat:** The… Blinker? Like a turn signal?

  **Eli:** No. Like persistence. Imagine we find some exotic physical system – say, a specific, complex arrangement of particles, call it Blinky. At time t1, Blinky exists. Completely normal. At t2, *poof* – every single particle composing Blinky is instantaneously and completely annihilated. Nothing left. Pure void where it was. Then, at t3, *pop* – an exact duplicate of Blinky, composed of *the very same particles* (or particle types, if you prefer, but let’s say same matter for simplicity), arranged in *exactly the same way*, pops into existence in precisely the same location. Blinky Mark II looks, acts, is constituted just like Blinky Mark I.

  **Pat:** (Eyes narrow, leaning forward) Okay… interesting. So, what’s the question? Did *one thing* persist from t1 to t3?

  **Eli:** Precisely. Your move, perdurantist.

  **Pat:** Easy. Yes. One thing persisted. Blinky *is* a four-dimensional object. Its career stretches from t1 to t3. It has a temporal part at t1, *no* temporal part at t2 (because nothing existed that *was* Blinky-at-t2), and a temporal part at t3. The worm has a temporal gap – a hole. But why not? There’s no law of metaphysics that says temporal parts have to be contiguous. They just need to be appropriately causally or qualitatively linked parts of the same spacetime worm. Here, t3-Blinky is a perfect duplicate, same matter, same place – it’s clearly the *next stage* of the same object, just after a break. One Blinky-worm with a missing middle slice.

  **Eli:** Whoa, hold on! “Next stage”? How can it be the *next stage* if there was *no object* at t2? Your “worm” *doesn’t exist* at t2. The object Blinky, according to you, is the sum of its temporal parts. At t2, *there is no Blinky-part*. So how can the *whole* Blinky exist at t2? It doesn’t! For *me*, the endurantist, an object exists *wholly* at each moment it exists. If Blinky doesn’t exist wholly at t2, then Blinky *does not exist* at t2. Period. Your “single object with a gap” is incoherent. It requires the object to *be* at t2 (as part of its lifespan) but also *not be* at t2 (because it has no part there). Contradiction.

  **Pat:** No contradiction. The object *Blinky* is the entire four-dimensional entity. Its *existence* isn’t confined to any single instant. Saying “Blinky exists at t” just means that t is within the temporal region occupied by the Blinky-worm. At t2, that region is empty. So Blinky doesn’t exist *at* t2. But Blinky *simpliciter* – the whole worm – exists, and its existence spans t1 to t3. Think of a road with a washed-out bridge. The road *exists*, but there’s a gap where you can’t drive. The road doesn’t cease to exist at the gap; the gap is just a part of the road with no pavement.

  **Eli:** Terrible analogy! The road *materially exists* at the location of the gap – there’s dirt, air, maybe the foundations. It’s just not *paved* for driving. In my case, at t2, *there is nothing*. No Blinky-stuff, no underlying substance, just void. Your “road” vanishes entirely at the gap and then reappears. That’s not a gap *in* the road; it’s two separate roads! To say it’s one road, you need *something* persisting across the gap – the right-of-way, the intention of the builders, *something* connecting the paved sections. What connects t1-Blinky to t3-Blinky? Just… similarity and location? That seems desperately thin. If mere similarity and location after a gap is enough for identity, why isn’t *any* duplicate popping up later the same object? That way lies madness.

  **Pat:** (Pauses, drinks coffee) Okay… fair shove. Maybe non-contiguity alone *is* too cheap. Perhaps I need to stipulate that for it to be the *same* worm despite the gap, there needs to be some… *dependence* or *causal link* preserved, even if no matter exists at t2. Maybe the *possibility* of its reappearance is grounded in its initial state? Or the laws of nature are such that annihilation/reconstitution *counts* as a continuous process for that object kind? This is messy. **Fine. Concession: My view needs *some* account of what constitutes the ‘right kind of linkage’ across a temporal gap to unify the parts into one object, beyond mere similarity and location. Without that, the ‘worm with a hole’ is just arbitrary.** But look at your side! What’s *your* answer for the Blinker? *Did* one thing persist?

  **Eli:** (Shifts uncomfortably) Well… no. Obviously not. Blinky Mark I existed wholly at t1. It ceased to exist *entirely* at t2. Blinky Mark II came into existence *ex nihilo* at t3. Two distinct objects. Numerical difference.

  **Pat:** But *why*? They’re perfect duplicates! Same matter, same arrangement, same location! If that happened instantaneously – annihilation and immediate recreation – you’d probably say it was the same object surviving a weird event, right? Like teleportation? Why is a temporal gap the deal-breaker?

  **Eli:** Because existence is all-or-nothing and continuous for an endurer! Persisting *means* existing wholly at every moment between t1 and t3. If it doesn’t exist at some moment in between, it didn’t persist through that interval. Full stop. The gap *breaks* persistence. Blinky Mark I perished; Blinky Mark II was born. Similarity doesn’t resurrect the dead.

  **Pat:** So… in the ordinary case, where my coffee cup just sits here, it persists because… nothing annihilated and recreated it? Its persistence is just the *absence* of a destructive event? That feels weirdly negative. Luck-based, almost. If a random annihilation field *had* briefly swept through this table at t2 and instantly recreated everything perfectly, you’d say this is a *different* coffee cup in front of me now? Even though nothing in its properties, history, or my experience changed? That seems… deeply counterintuitive. **Alright, concession: My view makes persistence strangely fragile, dependent on the sheer *absence* of a very specific kind of interruption, even one that leaves everything *else* seemingly identical. That feels like it might be making too much of the gap.**

  **Pat:** Exactly! It makes persistence hostage to weird cosmic luck. Whereas I can say: same cup-worm, just a brief interruption in its temporal parts. The *cup itself* survived the blink. Now, is the Blinker case even coherent? Annihilation and *exact* recreation with the *same* matter? Physics might forbid it, but *metaphysically*? If we’re building theories of persistence, shouldn’t they handle even weird possible cases? Or is this just science fiction irrelevant to real objects?

  **Eli:** It’s a stress test! If our theories can’t handle the edges, what good are they? And it’s not irrelevant – think of quantum fluctuations, teleportation debates, even religious resurrection! It probes what we *really* think persistence requires.

  **Pat:** Okay, granted. So where does that leave us? We agree annihilation happened at t2 and recreation at t3. I say it’s one object with a gappy career. You say it’s two objects. We both paid a price: I need an account of linkage across gaps, you make persistence vulnerable to weird cosmic hiccups. But we’re stalemated.

  **Eli:** Not quite stalemated. We’ve pinned down the crux, I think. The disagreement boils down to this: **Does the persistence of an object *require* its continuous existence – that is, existence at every moment throughout the interval – or is persistence compatible with discontinuous existence, provided there’s the right kind of connection between the pre-gap and post-gap stages?**

  **Pat:** Nailed it. For you, Eli, continuous existence is *essential* to persistence. A gap *necessarily* means cessation and new beginning. For me, Pat, persistence is about the unity of the stages across time, and continuous existence is just the usual, unbroken way that unity manifests. A gap *can* be survivable if the unity conditions are met across it.

  **Eli:** Right. So the Blinker case doesn’t *settle* the endurantism/perdurantism debate by itself. It *reveals* the underlying commitment. To resolve *this* case, we’d need to resolve that prior question: Is continuous existence necessary for persistence?

  **Pat:** And *that*… is where the real blood gets spilled. Whether existence is fundamentally a continuous, all-or-nothing presence at each moment, or whether it’s a matter of being spread out, potentially gappily, across time. The Blinker doesn’t answer that; it just forces us to confront it head-on, without the usual intrinsics camouflage.

  **Eli:** (Raises empty coffee cup) To another semester of spilled blood, then?

  **Pat:** (Taps cup with his own) To the Blinker. May it haunt our advisors’ dreams. See you next term, Eli.

  **Eli:** See you, Pat. Try not to slice my cup into parts before then. *(They both get up, the unresolved tension hanging in the air, a clearer map of the battlefield drawn, but the war far from over.)*
