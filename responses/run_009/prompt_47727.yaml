  For the evidentiary standard the user requested: the continuity thesis would be falsified if 1) later Keynes explicitly repudiated the logical relation theory, 2) used "probability" casually for unquantifiable cases, or 3) treated uncertainty as purely psychological rather than epistemic. None seem to hold up.

