prompt: |-
  I write a column on science and risk for a general readership, and I've been sitting on a puzzle I can't resolve to my own satisfaction. One half of my beat is safety and environmental regulation, where agencies cheerfully multiply small probabilities by large losses: they price a marginal reduction in mortality risk as a value per statistical life, and approve or reject projects on the arithmetic of expected costs and benefits. The other half is insurance and catastrophe finance, where nothing of the sort prevails. Insurers refuse to write coverage without an upper bound on payouts; the state steps in as insurer of last resort precisely for the risks too large to price; several countries cap nuclear operators' liability by statute regardless of the harm actually done; and solvency regulation typically demands only that a firm survive, say, a one-in-two-hundred-year loss, with nothing required beyond that horizon. As far as I can tell, institutions that multiply small probabilities by large losses in one context quietly stop doing so once the tail gets long enough — and that is exactly where the St. Petersburg gamble lives. Anyone who took a decision-theory course knows the candidate resolutions: Bernoulli's move of capping the utility of wealth so the expectation converges; the decision to rank gambles by the median, or by some other functional, rather than the mean; plain risk aversion; or the observation that no real counterparty could honor the long tail anyway, so the infinite expectation was a bookkeeping fiction from the start.

  Here is my question. Which, if any, of these resolutions do our actual practices presuppose? Please reconstruct the implicit theory of value and risk under which the observed pattern — expected-value bookkeeping for small risks, truncation and statutory caps for long ones — makes sense, and say whether it does make sense or whether the two halves of the pattern rest on flatly inconsistent commitments. Then distinguish what the practice strictly requires from what it merely tolerates: is there one resolution of the St. Petersburg paradox that our institutions are implicitly committed to, or are they underdetermined among several? And what would a regulatory regime that took the untruncated tail seriously have to change — not just in insurance, but in the cost-benefit half of the pattern, where the same expected-value arithmetic is applied without apology?

  Two requests about how you answer. Since I'd be publishing a version of this, I need to know where the argument is fragile: please say explicitly which consideration or argument would most plausibly change your verdict, and where your own reasoning is most likely to fail. And close the response with a final line of the form \answer{...} containing, in a few words, the single commitment the practice most needs — for instance 'bounded utility' or 'none: underdetermined' — so I can extract it mechanically.
reasoning: |-
  Okay, the user is a science and risk columnist grappling with a paradox between how regulatory agencies and insurance institutions handle risk. Regulatory agencies use expected value calculations (multiplying small probabilities by large losses) for cost-benefit analysis, while insurance/finance sectors impose caps, refuse unlimited liability, and ignore extreme tail risks. The core puzzle is why these two domains treat long-tail risks differently despite both theoretically involving probability-weighting. 

  The St. Petersburg paradox (where infinite expected value contradicts rational behavior) seems relevant here. The user wants to know which resolution (bounded utility, median focus, risk aversion, or impossibility of payout) explains real-world practices, and whether the two approaches are fundamentally inconsistent. They also ask about implications for changing regulations to account for untruncated tails.

  First, I need to map theoretical resolutions to observed practices. Regulatory cost-benefit analysis relies on linear probability-weighting and statistical lives, implying unbounded utility in ordinary contexts. But insurance practices show clear boundaries: liability caps, government backstops for catastrophic risks, and solvency requirements focused on survivable losses. This suggests a practical rejection of infinite expectations rather than a theoretical one.

  The key insight is that institutions aren't applying different utility functions; they're responding to feasibility constraints. Insurers cap liabilities because actual capital markets can't cover trillion-dollar losses, not because they disbelieve in the probability math. Meanwhile, regulators omit similar caps in cost-benefit analyses because the individual risks are small enough to aggregate statistically. The inconsistency arises from operational limits, not theoretical commitments.

  The resolution seems to be that expected-value calculus holds until it collides with real-world constraints: liquidity limits, counterparty credibility, and society's survival threshold. Beyond certain loss magnitudes, we switch from probability-weighting to binary avoidance—not due to risk aversion per se, but because the losses become literally unmanageable. This is why nuclear liability caps exist: the alternative isn't higher premiums but no market at all.

  For fragility, the argument might overstate the distinction. Some insurers do model extreme tails (e.g., catastrophe bonds), and regulators do sometimes cap analysis (e.g., ignoring asteroid impacts). The strongest counter is that both domains use truncated models—just at different scales. Changing regulations to account for untruncated tails would require impossible capital buffers or abandoning cost-benefit for existential risks.

  The core commitment isn't bounded utility but operational survivability. Hence the answer: \answer{feasibility constraints}.
answer: |-
  The tension you observe stems from a pragmatic division between domains where expected-value calculus is *operationally feasible* and those where it collides with physical, financial, or existential constraints. Our institutions implicitly adopt a **hybrid theory**: expected-value optimization for risks within the sphere of market and societal liquidity, but **truncation at feasibility boundaries** for tail risks. This isn't primarily about risk aversion or utility bounds—it's about *enforceability* and *systemic survival*. Here’s the reconstruction:

  ### Implicit Theory of Value and Risk
  1. **The Feasibility Threshold**:  
     Institutions calculate expected costs/benefits *only up to losses that can be meaningfully absorbed or compensated*. Beyond a certain severity (e.g., losses threatening insurer solvency, corporate viability, or national stability), the probability-weighting stops. The cutoff isn't arbitrary; it aligns with:  
     - **Liquidity limits** (what capital markets can cover),  
     - **Counterparty credibility** (no entity can guarantee infinite resources),  
     - **Social survival constraints** (risks that could collapse the system itself).  
     *Example:* Nuclear liability caps exist because no operator could insure against worst-case scenarios; the state steps in not due to risk aversion, but because the alternative is *no market at all*.

  2. **Why Expected Value Works for Regulators (Until It Doesn’t)**:  
     Agencies use value-per-statistical-life (VSL) for marginal risks because:  
     - The losses are *statistically aggregatable* (many small risks sum to manageable costs),  
     - Compensation is *feasible* (death/disability payouts fit within fiscal capacity),  
     - The framework relies on **linear probability-weighting over liquid domains**.  
     This fails for catastrophes precisely when losses exceed aggregatability (e.g., a $10T disaster cannot be "priced in" without collapsing the economy).

  3. **The St. Petersburg Paradox Resolution in Practice**:  
     Institutions reject infinite expectations not through Bernoulli’s utility curvature, but via **physical impossibility**. The paradox assumes a credible infinite-stakes counterparty—a fiction. Our practices resolve it by:  
     - **Capping losses** (statutory liability limits),  
     - **Capping exposures** (solvency requirements ignore beyond-200-year events),  
     - **Transferring tail risks to the state** (which can tax/print money, but still truncates at existential thresholds).  
     *Median-focused or risk-averse* theories don’t fit: insurers use *mean* losses within bounds, and regulators use linear VSL.

  ### Consistency and Underdetermination
  - **Is it consistent? Partly**. Both halves use expected value *where feasible*. The switch to truncation is a concession to constraints, not a change in philosophy. Inconsistency arises only if you ignore operational ceilings.  
  - **Underdetermination? Yes, at the margins**. Practices *tolerate* bounded utility (e.g., regulators assume diminishing marginal utility of wealth in VSL) but do not *require* it. They also tolerate risk aversion (e.g., insurers load premiums for uncertainty) but prioritize feasibility. The core commitment is to **computability and enforceability**.  

  ### Changing the Regime: Implications
  To take untruncated tails seriously:  
  - **In insurance/finance**: Abandon liability caps and capital thresholds. Require insurers to reserve for 1-in-100,000-year events. This would collapse markets (premiums → ∞) or force states to absorb all tail risk.  
  - **In cost-benefit regulation**: Price *all* low-probability catastrophes (e.g., human extinction at 0.001% chance). This would:  
    - Vastly inflate "benefits" of preventing existential risks,  
    - Paralyze decisions (e.g., rejecting any technology with non-zero extinction risk),  
    - Ignore society’s revealed preference to *not* bankrupt itself over hyper-remote scenarios.  

  ### Fragility and Counterarguments
  - **Most plausible objection**: The dichotomy isn’t about feasibility but **cognitive bias**. We use expected value for familiar risks (car crashes) but "dread" for tail events (nuclear meltdowns). If true, the hybrid model is irrational. *Rebuttal*: Caps arise even for "un-dreaded" tail risks (e.g., cyber catastrophes), and regulators *do* model some low-probability events (e.g., asteroid impacts). Feasibility better explains the pattern.  
  - **Where my reasoning is weakest**: It underweights **political economy**. Caps exist because industries lobby to limit liability—not just operational necessity. If public tolerance for tail risk changed (e.g., post-disaster), feasibility thresholds might shift.  

  ### Final Commitment
  The practice most needs **truncation at feasibility boundaries**—not as a theory of value, but as a concession to resource constraints and system fragility.  

  \answer{feasibility constraints}
