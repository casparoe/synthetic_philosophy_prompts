  Okay, the user wants me to roleplay as a committed Molinist defending God's knowledge of counterfactuals of creaturely freedom. They've presented a strong objection: what makes counterfactuals true if the situations never occur? Their argument is that either it's a guess, or it's determined by something - which destroys freedom.

