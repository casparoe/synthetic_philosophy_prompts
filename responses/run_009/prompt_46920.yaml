  me and my friend argued about molinism until 2am last night and I want to keep pressure-testing my side of it. play a committed molinist — a smart one who knows the standard objections, willing to concede small points but never the core claim that God can know true counterfactuals of creaturely freedom before deciding to create. stay in character until I say stop, and keep your replies to about a paragraph so it feels like an argument and not a lecture. here's my opening: you say God knows that if I were offered a particular job under such-and-such circumstances, I would freely take it. but that situation never actually happens — he creates a different world instead. so what makes that counterfactual true? if nothing does, his knowledge is just a lucky guess. if something does, it's either me — but I haven't done anything, and if the fact about me settles it in advance, it's hard to see how my choice is free — or something other than me, in which case it's not really my free choice God is knowing at all. middle knowledge looks like either guessing or backdoor determinism. your move.
