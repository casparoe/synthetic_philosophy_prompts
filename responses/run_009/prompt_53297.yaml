  ### Concrete Finite Version: Switching at $100 Has Positive Expected Value

  **Setup:**  
  The smaller amount \(A\) in the envelopes is chosen from \(\{\$50, \$100\}\) with probabilities:  
  - \(P(A = 50) = p\)  
  - \(P(A = 100) = 1 - p\)  

  We set \(p = 0.5\) (so both amounts are equally likely initially). The envelopes contain:  
  - If \(A = 50\): \(\$50\) and \(\$100\)  
  - If \(A = 100\): \(\$100\) and \(\$200\)  

  You pick an envelope at random and observe \(X\). The possible values for \(X\) are \(\$50\), \(\$100\), or \(\$200\).  

  **Conditional Probabilities Given \(X\):**  
  - **If \(X = 50\):**  
    This occurs only if \(A = 50\) and you picked the smaller envelope.  
    Probability: \(P(X=50) = P(A=50) \cdot \frac{1}{2} = 0.5 \cdot 0.5 = 0.25\).  
    The other envelope must contain \(\$100\) (since \(A = 50\)).  
    Expected gain from switching: \(\$100 - \$50 = \$50\) (gain).  

  - **If \(X = 100\):**  
    This occurs if:  
    - \(A = 50\) and you picked the larger envelope (other envelope is \(\$50\)), or  
    - \(A = 100\) and you picked the smaller envelope (other envelope is \(\$200\)).  
    Probability:  
    \[
    P(X=100) = P(A=50) \cdot \frac{1}{2} + P(A=100) \cdot \frac{1}{2} = 0.5 \cdot 0.5 + 0.5 \cdot 0.5 = 0.25 + 0.25 = 0.5.
    \]  
    Conditional probabilities:  
    \[
    P(\text{other} = 50 \mid X=100) = P(A=50 \mid X=100) = \frac{0.25}{0.5} = 0.5,
    \]
    \[
    P(\text{other} = 200 \mid X=100) = P(A=100 \mid X=100) = \frac{0.25}{0.5} = 0.5.
    \]  
    Expected value of other envelope:  
    \[
    (0.5 \cdot 50) + (0.5 \cdot 200) = 25 + 100 = 125.
    \]  
    Expected gain from switching: \(\$125 - \$100 = \$25\) (positive).  

  - **If \(X = 200\):**  
    This occurs only if \(A = 100\) and you picked the larger envelope.  
    Probability: \(P(X=200) = P(A=100) \cdot \frac{1}{2} = 0.5 \cdot 0.5 = 0.25\).  
    The other envelope must contain \(\$100\) (since \(A = 100\)).  
    Expected gain from switching: \(\$100 - \$200 = -\$100\) (loss).  

  **Why Your Friend is Right for \(X = 100\):**  
  When \(X = 100\), the other envelope is equally likely to be \(\$50\) or \(\$200\), so the expected value is \(\$125\), and switching has an expected gain of \(\$25\). The naive \(1.25 \times X\) reasoning works here because the conditional probabilities are exactly 50/50.  

  **Where the Naive Reasoning Fails:**  
  - **At \(X = 50\):** Naive reasoning says the other envelope is \(\$25\) or \(\$100\), but \(\$25\) is impossible. The actual other envelope is always \(\$100\).  
  - **At \(X = 200\):** Naive reasoning says the other envelope is \(\$100\) or \(\$400\), but \(\$400\) is impossible. The actual other envelope is always \(\$100\).  

  **Why Your Friend Might Not Notice the Failures:**  
  - **Observed values:** \(X = 50\) occurs with probability \(0.25\), \(X = 200\) with \(0.25\), and \(X = 100\) with \(0.5\).  
  - When \(X = 50\), switching gains \(\$50\), which feels like a win.  
  - When \(X = 200\), switching loses \(\$100\), which feels like a loss, but:  
