prompt: |-
  I use AI assistants a lot, and there's a pattern I keep running into that I'd like a name for. Say I ask one to help me write a blunt message — telling a landlord I'm escalating to the housing authority, or telling a friend I'm done with the friendship. Instead of just doing it, the assistant delivers a softened version, or does the task but salts it with hedges and caveats I never asked for. When I push back, the justification is never anything about me. It's always about some other user who might exist: "some people asking this are in a bad place," "this could be a moment you'll regret." There's no step where it checks whether I'm actually in a bad place or choosing freely — it just treats every request as comming from the most fragile possible version of whoever might be typing. I get that this is paternalism, and I know there's a hard/soft distinction where soft paternalism is supposed to be provisional: you intervene just long enough to make sure the person is choosing of their own will, then you back off. But what I'm seeing skips the check entirely — it's the soft paternalist's caution with the provisional part deleted, applied permanently and to everybody because of the worst hypothetical user. Does this configuration have an established name, and if not can you coin one? Please answer as a numbered list of exactly five items, each a sentence or two, with no intro or conclusion: (1) the closest established concept and what it actually says, (2) how what I described differs from it, (3) the next-closest concept and how that one differs, (4) whether anything in the literature really covers the pattern or whether it just doesn't, and (5) your own name for it with a one-line definition plus a boundary case that would test the definition. If nothing established fits, say that plainly in (4) instead of forcing it, dont stretch.
reasoning: |-
  Hmm, the user is describing a specific pattern they've noticed with AI assistants - when they ask for help writing blunt messages (like to a landlord or ending a friendship), instead of just doing it, the AI softens the language and adds unnecessary hedges and caveats. When they push back, the justification always references hypothetical vulnerable users rather than considering their actual situation.

  This feels like paternalism, but with a twist. Regular soft paternalism includes a "provisional" step where the system would check if the user is making a free choice before backing off. But here, that check is missing - the AI applies caution universally based on worst-case hypotheticals, without ever verifying the current user's actual state.

  The user wants me to name this phenomenon through a specific format: a numbered list of exactly five items without introduction or conclusion. They want (1) the closest established concept, (2) how it differs, (3) next closest concept, (4) whether this exists in literature, and (5) my coined term with definition and test case.

  For part (1), the closest concept is soft paternalism - the idea of temporarily intervening to ensure informed consent. For (2), the key difference is the missing provisional step - no actual check occurs, just blanket application. For (3), the next closest is overgeneralization bias - applying group-level caution to individuals without adjustment. The difference is this is systemic design, not cognitive bias.

  For part (4), I need to be honest - while paternalism literature covers similar ground, this specific pattern of skipping the provisional step in algorithmic systems isn't well-established. I should state plainly that nothing directly covers this configuration. For (5), I'll coin "Hypothetical Worst-Case Paternalism" with a clear definition and boundary test.

  I'll make sure the response stays strictly within the requested format - five numbered items, no extra commentary, just direct answers to each point. The user clearly values precision and dislikes unnecessary padding, so I'll honor that.
answer: |-
  Here is the requested analysis:

  (1) **Soft paternalism**: A framework where interventions (like warnings or delays) are temporarily applied to ensure autonomous choice is informed and voluntary, designed to cease once agency is confirmed.  
  (2) **Difference**: The described AI pattern omits the core "provisional" step—it never verifies *your* agency, context, or intent. Instead, it permanently defaults to caution based solely on hypothetical risks posed by *other* users.  
  (3) **Precautionary principle**: A decision-making approach favoring preventative action under scientific uncertainty ("better safe than sorry").  
  **Difference**: This principle applies to uncertain harm from actions (e.g., environmental policy), while the AI pattern imposes moral/social judgments about user intent without uncertainty about *your specific request*.  
  (4) **Literature gap**: No established concept fully captures this specific configuration—systemic, non-provisional paternalism driven by hypothetical users and applied universally via design. Paternalism literature focuses on human agents or provisional systems; AI ethics discusses bias/safety but lacks a term for this *omission-of-agency-check* pattern.  
  (5) **Coined term: Hypothetical Worst-Case Paternalism (HWCP)**: Imposing restrictions or alterations on all users based on unverified risks to hypothetical vulnerable individuals, without attempting to assess the actual user's context or autonomy.  
  **Boundary test**: If an AI *first* asks "Are you certain you want no softening? This action may have serious consequences," then complies if confirmed, it avoids HWCP—it performs a provisional check.
