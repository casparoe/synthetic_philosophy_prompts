  **MINUTES: Forty-Seventh Emergency Session, Colors Subcommittee, Marigold Court Housing Co-operative**

  **Date:** April 17th, 2024
  **Time:** 7:00 PM - 7:48 PM
  **Location:** Common Room
  **Chair:** Ms. A. Birch (Flat 2)
  **Secretary:** Mr. C. Elm (Flat 3)
  **Members Present:** Ms. A. Birch (Chair, Flat 2), Mr. C. Elm (Sec., Flat 3), Mr. P. Ferris (Flat 4), Ms. R. Larch (Flat 5), Mr. D. Oak (Flat 1)
  **Visitor:** Mr. G. Spruce, Municipal Housing Board Inspector (Attended 7:15 PM - 7:40 PM)

  **1. Call to Order:** Chair Birch called the meeting to order at 7:00 PM. Quorum confirmed.

  **2. Approval of Previous Minutes (46th Emergency Session, April 10th, 2024):** Minutes were approved as circulated (Moved: Oak, Seconded: Elm).

  **3. Chair's Remarks:** Chair Birch noted the requirement for an emergency session due to the "ongoing courtyard colour instability" and the approaching Annual General Meeting where the subcommittee must report. She referenced Articles III (Right of the Door) and VII (Unanimity Clause) of the bylaws as governing principles.

  **4. Main Agenda Item: Courtyard Door Colour Status & Compliance**
      *   **4.1 Current Status:** Secretary Elm reported both courtyard doors (Flats 4 & 5) are currently painted in the original 1974 ochre, per the motion passed at the 46th Emergency Session implementing a unanimous preference.
      *   **4.2 Invocation of Article III (Right of the Door):** Mr. Ferris (Flat 4) stated his intention to exercise his right under Article III to repaint his door teal. He clarified this right pertains solely to his door colour and referenced the specific bylaw exemption for mailboxes and curtains. Ms. Larch (Flat 5) noted her preference that both doors remain ochre but acknowledged Mr. Ferris's right to alter his own door. No objection to Mr. Ferris exercising his right was raised. (ACTION: Mr. Ferris to repaint Flat 4 door teal by April 20th).
      *   **4.3 Point of Order (Oak):** Mr. Oak (Flat 1) raised a Point of Order regarding agenda sequence, suggesting Item 4.5 (Potential Unanimous Restoration) should logically follow Item 4.2. Chair Birch ruled the Point of Order out of order, stating agenda sequence was at the Chair's discretion per standing procedure.
      *   **4.4 Invocation of Article III (Right of the Door) - Response:** Following the report of Mr. Ferris's action (anticipated by April 20th), Ms. Larch (Flat 5) stated her intention to exercise her right under Article III to repaint her door teal, citing the changed visual aspect facing her window. Mr. Ferris noted his preference that her door remain ochre but acknowledged Ms. Larch's right. No objection raised. (ACTION: Ms. Larch to repaint Flat 5 door teal by April 25th, contingent on Flat 4 door being teal).
      *   **4.5 Potential Unanimous Restoration (Article VII - Unanimity Clause):** Chair Birch inquired if there was unanimous consent to restore both doors to the original 1974 ochre. Mr. Ferris stated that while he preferred his door teal *if* Ms. Larch's remained ochre, he found the prospect of both doors being teal less desirable than both being ochre, and therefore consented to restoration. Ms. Larch stated that while she preferred her door teal *if* Mr. Ferris's remained ochre, she agreed the all-teal courtyard was less desirable than the original ochre, and consented to restoration. Mr. Oak, Ms. Birch, and Mr. Elm stated their consistent preference for the original ochre courtyard and consented. Unanimity for restoration to 1974 ochre was declared by the Chair. (MOTION: To restore both courtyard doors to 1974 ochre under Article VII. Moved: Birch, Seconded: Oak. CARRIED Unanimously. ACTION: Subcommittee to arrange repainting of both doors to ochre by May 1st).
      *   **4.6 Observation by Inspector Spruce:** Mr. Spruce (MHBI) observed that the sequence of motions (specifically, placing the Unanimity vote *after* both Article III invocations) seemed to determine the timing of the restoration action relative to the individual changes. He inquired if altering the agenda order could affect the outcome frequency. Chair Birch stated the agenda was set fairly and reflected procedural norms. Mr. Oak reiterated his earlier Point of Order regarding sequence. Mr. Ferris suggested future meetings might start with the Unanimity vote. Ms. Larch proposed starting with individual right invocations. No consensus on future agenda structure was reached. Mr. Spruce departed at 7:40 PM, taking notes.

  **5. Any Other Business:** Mr. Oak inquired about the budget for paint. Secretary Elm confirmed the cyclical nature of the work was accounted for in the annual maintenance line.

  **6. Date of Next Meeting:** To be determined pending courtyard status. The Chair noted the likelihood of the Forty-Eighth Emergency Session being required in approximately one week following the completion of the restoration action.

  **7. Adjournment:** The meeting adjourned at 7:48 PM (Moved: Elm, Seconded: Larch).

  **Submitted by:**
  Mr. C. Elm, Secretary
  **Approved by:**
  Ms. A. Birch, Chair
  **Date:**
  April 18th, 2024

