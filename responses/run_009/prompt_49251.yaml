  Okay, this philosophy student is in a metaontology seminar and has noticed a fascinating pattern. They're familiar with Carnap's distinction between substantive and verbal disputes. The examples given are things like whether Pluto is a planet or what constitutes a lawn. But the student observes that some verbal disputes dissolve once exposed, while others persist even after both parties acknowledge they're verbal. 

  The key example given is the nominalist vs. Platonist debate about numbers. Both agree the existence of numbers depends on linguistic framework, and that choosing a framework is pragmatic. Yet they still feel the other is wrong - the Platonist thinks nominalism "does violence" to math practice, while the nominalist sees Platonism as positing something absurd. This persists even when no factual disagreement remains.

  The student wants to know if there's a name for this "post-verbal residue" - the lingering disagreement that survives classification as verbal. They've ruled out Carnap's internal/external distinction and metalinguistic negotiation, since neither side is trying to control word usage.

  Hmm, I recall several concepts that might relate to this. First, there's Eli Hirsch's idea of "shallow disagreements" in ontology. Hirsch argues that ontological debates are often shallow because they're verbal, yet they persist due to differing intuitions or conceptual preferences. Then there's Amie Thomasson's work on ontological disputes, where she suggests that what seems like residual disagreement might actually stem from differences in background assumptions about language or metaphysics.

  The student also mentions compatibilism vs. incompatibilism in free will debates as a potential example. That's a good test case - if both sides agree "free will" is a term of art but still feel the other is mistaken, it would fit this pattern.

  I should also consider whether this is fundamentally about pragmatic factors rather than truth. The parties agree on facts but value different pragmatic considerations - the nominalist values ontological parsimony while the Platonist values fidelity to mathematical practice. This connects to Stephen Stich's work on cognitive values in philosophy.

  Another angle is whether this relates to what David Chalmers calls "bedrock disagreements" - disagreements that remain after all factual and verbal issues are resolved. Chalmers suggests these might involve differences in non-cognitive attitudes.

  The student asks two specific sub-questions: how to distinguish genuine residual disagreement from mere psychological stubbornness, and whether the phenomenon requires both parties to feel it. For the first, we might look at whether the disagreement tracks to deeper methodological commitments. For the second, asymmetrical cases where only one party feels the pull could still qualify as long as the disagreement isn't factual.

  I think I'll propose the term "phenomenological residue" for this, emphasizing how the disagreement feels real even when recognized as non-factual. This captures the lingering sense of mistakenness that survives the verbal classification. The free will debate would indeed fit, as would many other philosophical standoffs once semantic issues are cleared away.

  The psychological vs. substantive distinction is crucial - we'd need to see if the persistence stems from identifiable philosophical commitments rather than just ego. If it's tied to differing conceptions of what philosophy should do (e.g., reforming language vs. describing reality), then it's substantive residue.
answer: |-
  Your observation is astute and cuts to the heart of enduring philosophical tensions. This phenomenon—**persistent disagreement acknowledged as non-factual yet experienced as substantive**—lacks a single canonical name but intersects with several key concepts in metaontology, metaphilosophy, and pragmatics. Below is a framework to understand it:

  ### 1. **Proposed Term: "Phenomenological Residue"**  
     - **Definition**: The *phenomenological residue* in a dispute is the lingering sense of substantive disagreement that persists even after all parties explicitly acknowledge:  
       (a) The dispute is verbal (i.e., hinges on terminological/conceptual choices),  
       (b) No factual or empirical differences exist, and  
       (c) The choice between frameworks is pragmatic rather than truth-apt.  
     - **Core Mechanism**: It arises from conflicting intuitions about **what a concept *ought* to track** (e.g., ontological parsimony vs. fidelity to practice), which feel like normative errors even when no fact is disputed.

  ### 2. **Key Distinctions from Existing Concepts**  
     - **vs. Metalinguistic Negotiation** (Barker, Plunkett):  
       Metalinguistic negotiations involve disputing *how a term should be used* to serve shared goals. Here, parties *agree* on future usage but still feel the other’s framework is *misguided* in principle.  
     - **vs. Verbal Dispute Collapse** (Carnap, Chalmers):  
       Standard verbal disputes dissolve when meanings are clarified. Phenomenological residue survives because the disagreement shifts to **evaluative judgments** about conceptual frameworks.  
     - **vs. Mere Psychological Stubbornness**:  
       Genuine residue stems from **deep methodological commitments** (e.g., "What counts as good explanation?"), not just attachment to "winning." It reflects divergent visions of philosophical inquiry itself.

  ### 3. **Literature & Conceptual Neighbors**  
     While no unified theory exists, these threads address your concern:  
     - **Hirsch’s "Shallow Disagreements"** (*Quantifier Variance and Realism*):  
       Ontological debates (e.g., mereology) are "shallow" but persist due to **pragmatic inertia**—adopting the other’s language feels like "conceptual betrayal."  
     - **Thomasson’s "Normative Project"** (*Ontology Made Easy*):  
       After deflating ontology, residue arises from **normative disputes** about which conceptual tools best serve our interests (e.g., "Does Platonism *mislead* us scientifically?").  
     - **Price’s "Subject Naturalism"** (*Naturalism Without Mirrors*):  
       Residual disagreement reflects **differing functional roles** of concepts (e.g., "number" as instrumental vs. referential), tied to conflicting implicit norms.  
     - **Sider’s "Metaphysical Equivalence"** (*Writing the Book of the World*):  
       Frameworks may be "equivalent" yet feel *incorrect* if they fail to "carve at the joints" of reality—a disagreement about **structural values**.  

  ### 4. **Locating the Edges: When Does Residue Arise?**  
     - **Compatibilism vs. Incompatibilism**:  
       **Yes, it fits**. If both sides agree "free will" is a term of art and dispute no facts about determinism, residue persists via:  
       - Incompatibilist: "Calling *this* 'free will' obscures moral responsibility!"  
       - Compatibilist: "Denying the term to *this* phenomenon undermines practice!"  
       → Conflict over **what concept best serves ethical discourse**.  
     - **Asymmetrical Cases**:  
       Residue exists if **one party** feels the pull *and* their stance is rooted in **coherent normative commitments** (e.g., a nominalist who accepts the verbal nature but argues Platonism fosters superstition). If the other party is wholly indifferent, it’s psychological, not philosophical residue.  
     - **Boundary Condition**:  
       Residue vanishes if parties fully **endorse pluralism** (e.g., "Both frameworks are valid for different purposes") *and* drop the sense that the other is "mistaken."

  ### 5. **Distinguishing "Genuine Residue" from Psychology**  
     Residual disagreement is **substantive** (not merely psychological) if:  
     - It **tracks to deeper philosophical fault lines** (e.g., empiricism vs. rationalism),  
     - It **generates predictable arguments** across cases (e.g., nominalists consistently reject "posits"),  
     - It **informs downstream choices** (e.g., rejecting a scientific theory for "ontologically profligate" math).  
     → *Psychology alone* would be ad hoc, inconsistent, and lack inferential power.

  ### Why This Matters
  Your case study reveals a limitation in Carnapian deflationism: even when ontology is "pragmatic," **pragmatics itself is normative**. The residue exposes **implicit disagreements about the aims of language, science, or philosophy**—suggesting metaontology cannot fully escape first-order commitments. This aligns with recent work by philosophers like Karen Bennett (*Making Things Up*) on "metaontological values."

  **In short**: What you’ve identified is the **normative shadow of verbal disputes**—a clash not over facts or words, but over the *point* of conceptualizing the world one way rather than another. Naming it "phenomenological residue" captures its stubborn felt significance while acknowledging its non-factual core.
