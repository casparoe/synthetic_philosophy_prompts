prompt: |-
  I sit on the animal care and use committee at a mid-size university (the IACUC, if your american about it), and I've been tasked with drafting guidance on how we decide the level of welfare scrutiny a protocol gets based on how likely the animals in it are to be sentient — likely to actually experience pain, fear, distress, not just detect and respond to harmful stuff. The committee meets monthly, we see maybe 15 protocols a meeting, and the scientists on it hate philosophy and will not read anything longer than a page, but they WILL follow a checklist. Write me a decision procedure they can actually run in about twenty minutes per protocol.

  Some background on what the procedure has to grapple with, so you know which distinctions have to survive the simplification. We keep getting stuck on what you could call the distribution question: is sentience spread densely across the animal kingdom — most animals with any kind of nervous system get some welfare standing — or sparsely, only showing up in a few cognitively complex lineages? Different members default to different answers and the argument eats the whole meeting. Related to that: the distinction between nociception (detecting and reacting to noxious stimuli, which basically any animal can do) and the felt experience of pain, which our checklist has to somehow operationalize without turning into a neuroscience seminar. And there's the precautionary problem: the costs of a false negative (treating a sentient animal as insentient) versus a false positive (heavy paperwork and delays for something that feels nothing) aren't symmetric, but the committee disagrees about how much asymmetry to bake in, and that part is a values question, not an evidence one, so the procedure needs to hand that back to us rather than decide it.

  What I want: a procedure with the questions in order, what counts as a sufficient answer at each step, where it terminates in a verdict (full review / moderate safeguards / basically exempt), and where it has to stop and hand things to the committee because the remaining question is one of values. Then run it on three protocols: (a) invasive nerve recordings in octopuses, (b) catch-and-release tagging of wild fish with no other procedures attached, and (c) a drosophila genetics study that includes heat-stress assays where flies are held at temperatures that impair them. At least one of these should come out in a way I won't like — and flag it, don't fudge it to make me comfortable. And then tell me what the procedure can't do: where it will misfire, and what it will never settle no matter how well it's built.

  One more constraint: keep the philosophy out of the deliverable where you can. If a step can only be run correctly by someone who knows what phenomenal conciousness means, it's probably badly designed.
reasoning: |-
  Okay, let me tackle this IACUC problem. The user needs a practical decision procedure for animal welfare scrutiny based on sentience likelihood. Key constraints: must be checklist-based, under 20 minutes per protocol, no philosophy jargon, and resolve committee deadlocks on "distribution question" and precaution levels. 

  First, the core conflicts: 
  - That "distribution question" about sentience density is paralyzing them. Need to bypass the all-or-nothing debate.
  - Nociception vs. felt pain distinction must be operationalized without neuroscience deep dives.
  - Precaution asymmetry (false negatives worse than false positives) is a values call the procedure must flag for committee input.

  Hmm... the solution should:
  1. Start with existing policy anchors (like regulated species lists) to avoid reinventing wheels.
  2. Use neural complexity proxies (CNS presence/integration) as sentience indicators - measurable without philosophy.
  3. Force explicit precaution decisions only when evidence is ambiguous, keeping values debates contained.

  For the checklist flow:
  - Tier 1: Quick out if exempt by policy (invertebrates except cephalopods/crustaceans?).
  - Tier 2: CNS filter - no CNS? Minimal scrutiny.
  - Tier 3: For ambiguous cases (fish, insects), apply "sentience risk factors" (learning/memory capacity etc.).
  - Tier 4: If still unclear, calculate "precaution requirement" based on harm severity and committee's pre-set risk tolerance.

  Testing with user's examples:
  - Octopuses: High CNS complexity → automatic full review. (User expects this.)
  - Wild fish tagging: Moderate CNS + field harm → moderate safeguards. (Committee might under-scrutinize - user's concern?)
  - Drosophila heat stress: Policy exempt? But heat impairment... ah, procedure catches it via "non-reflex behavior" risk factor. Minimal scrutiny but flags welfare tweaks. (User won't like this - good, they asked for honesty.)

  Biggest limitations: 
  - Will misjudge animals with novel neural architectures (e.g., decentralized intelligences).
  - Can't resolve fundamental consciousness debates - just manages uncertainty.
  - Requires committee to set precaution thresholds upfront (that values conversation can't be outsourced).

  ...The procedure's strength is turning unwinnable philosophical debates into actionable administrative steps. But it'll piss off both strict empiricists ("this oversimplifies sentience!") and ethicists ("it commodifies suffering!"). If the user's team hates philosophy, that's actually perfect - the friction means it's working.
answer: |-
  Here's a streamlined decision procedure designed for speed, committee alignment, and defensibility. It uses **observable biological proxies** for sentience likelihood and **flags values decisions** explicitly. The entire flow fits on one page as a checklist.

  ---

  ### IACUC Sentience-Based Scrutiny Triage (S-BST) Checklist  
  *Complete sequentially. Terminate at first definitive verdict.*

  1. **REGULATED SPECIES?**  
     - *Check:* Is species covered by Animal Welfare Act (vertebrates, cephalopods) or institutional policy (e.g., decapod crustaceans)?  
     - **YES** → Proceed to **Step 4**.  
     - **NO** (e.g., insects, worms, jellyfish) → Proceed to **Step 2**.  

  2. **CENTRAL NERVOUS SYSTEM (CNS) PRESENT?**  
     - *Check:* Does the species have a brain/central ganglia with integrative processing (not just nerve nets)?  
     - **NO** (e.g., *Drosophila*, nematodes) → **VERDICT: Minimal Scrutiny** (Exempt or expedited review).  
     - **YES** (e.g., spiders, some mollusks) → Proceed to **Step 3**.  

  3. **SENTIENCE RISK FACTORS (SRFs)**  
     *Score 1 point for each:*  
     - **Learning/Memory:** Demonstrates associative learning beyond habituation (e.g., operant conditioning).  
     - **Nociceptive Complexity:** Nociceptors linked to endogenous opioid systems or higher brain regions.  
     - **Non-Reflex Behavior:** Avoidance persists after noxious stimulus removal; self-protective trade-offs (e.g., sacrificing limb for escape).  
     - **Vertebrate/Analog Neuroanatomy:** Homologous brain structures to known sentient vertebrates (e.g., fish pallium).  
     - **SCORE:**  
       - **0-1 Points** → **VERDICT: Minimal Scrutiny**.  
       - **2 Points** → **VERDICT: Moderate Safeguards** (e.g., analgesia where feasible, endpoint refinement).  
       - **≥3 Points** → Proceed to **Step 4**.  

  4. **HARM SEVERITY**  
     - *Check:* Does the protocol involve:  
       - **Major Harm:** Surgery, chronic pain, prolonged distress, or death as endpoint?  
       - **Moderate Harm:** Brief restraint, transient stress, minor tissue injury?  
       - **Minor Harm:** Non-invasive tagging, brief sedation, non-injurious assays?  
     - **Major Harm** → **VERDICT: Full Review**.  
     - **Moderate/Minor Harm** → **Proceed to Step 5**.  

  5. **PRECAUTIONARY OVERRIDE**  
     - *Committee Decision Required:*  
       *"Given uncertainty, does the risk of suffering (false negative) justify higher scrutiny than current evidence alone?"*  
     - **Options:**  
       - **YES** → **Full Review** or **Moderate Safeguards** (based on harm severity).  
       - **NO** → **Minimal Scrutiny** or **Moderate Safeguards** (based on Steps 1-4).  

  ---

  ### Protocol Applications  
  *(Using conservative interpretations)*  

  **(a) Octopus Nerve Recordings (Invasive)**  
  - Step 1: **YES** (regulated cephalopod) → Step 4.  
  - Step 4: **Major Harm** (surgery, invasive neural access) → **VERDICT: Full Review**.  

  **(b) Wild Fish Catch-and-Release Tagging**  
  - Step 1: **YES** (regulated vertebrate) → Step 4.  
  - Step 4: **Moderate Harm** (capture stress, tissue puncture) → Step 5.  
  - Step 5: **Committee Decision**.  
    - *Likely Outcome:* Precaution applied → **Moderate Safeguards** (e.g., training on rapid handling, topical analgesic).  

  **(c) Drosophila Heat-Stress Assays**  
  - Step 1: **NO** (insect not regulated) → Step 2.  
  - Step 2: **YES** (CNS present) → Step 3.  
  - Step 3 (SRFs):  
    - Learning/Memory: **YES** (demonstrated in *Drosophila*).  
    - Nociceptive Complexity: **NO** (nociception lacks opioid modulation).  
    - Non-Reflex Behavior: **NO** (heat avoidance is reflex-driven).  
    - Vertebrate Neuroanatomy: **NO**.  
    - **SCORE: 1** → **VERDICT: Minimal Scrutiny**.  
  - *You won't like this:* Heat stress in flies triggers minimal scrutiny.  

  ---

  ### What This Procedure **Cannot Do**  
  1. **Resolve fundamental consciousness debates:** It proxies sentience via neurobiology/behavior but cannot "prove" absence of experience.  
  2. **Handle edge cases perfectly:** Animals with novel neural architectures (e.g., ctenophores) or conflicting evidence will force arbitrary calls at Step 3/5.  
  3. **Eliminate values judgments:** Step 5 explicitly outsources the precautionary balance to the committee.  
  4. **Capture intensity of experience:** A fish scoring 2 SRFs gets "moderate safeguards," but this doesn't differentiate between dull ache vs. severe pain.  
  5. **Adjust for cumulative suffering:** Repeated minor harms (e.g., weekly heat stress) aren't weighted.  

  ### Why It Works for Your Constraints  
  - **Time:** Under 20 min/protocol (Steps 1-4 take <10 min; Step 5 rare).  
  - **Anti-Philosophy:** Uses tractable biological proxies (CNS, learning, neuroanatomy).  
  - **Committee Deadlock Avoidance:**  
    - Bypasses "distribution question" via Step 1 (policy) and Step 2 (CNS filter).  
    - Contains arguments to Step 5 (precaution) only for ambiguous cases.  
  - **Enforceable:** Binary/multiple-choice questions with clear thresholds.  

  **Final Note:** The *Drosophila* verdict exposes the procedure's conservative bias toward established evidence. If your committee believes insects deserve more protection, amend Step 1 policy or add SRFs (e.g., "pain gene" homologs). But the checklist forces that debate to be explicit—not buried in metaphysics.
