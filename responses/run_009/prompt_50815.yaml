prompt: |-
  I've been reading LessWrong and the surrounding forums since the late 2000s — long enough to remember when "the alignment problem" named one specific thing: specifying a goal that an optimizer much smarter than us could pursue safely, and the worry was that we couldn't do it. Fifteen years on, I sit on the grant committee of a safety-focused foundation, and the same phrase now gets applied to everything from RLHF fine-tuning to honesty probes to detecting sandbagging, and our committee is split on whether that's one problem wearing several hats or several problems sharing a name. This quarter we must allocate a $12M round. On the table: a five-year unified agenda that would absorb most of the budget, which amounts to learning a complete specification of what humans would endorse on reflection and optimizing against it; versus a split across mechanistic interpretability, methods for eliciting what a model actually believes rather than what it says, scalable oversight for tasks no unaided human can evaluate, and automated detection of deceptive alignment. A third faction argues that even that portfolio misses the real question — who is the principal? An individual operator, a lab, a public? On their view, a system perfectly obedient to the wrong principal isn't misaligned but is still a catastrophe, so they want a governance track carved out of the same envelope. Please draft the decision memo I'll circulate before next month's vote. It should recommend a concrete allocation with a review point and time frame, take a position on whether these sub-problems are facets of a single problem or genuinely distinct — and show why that matters for how we fund, not just as a label — give reviewers criteria they can actually apply to the twelve pending proposals, and give the unified agenda's strongest argument, that a sufficiently capable optimizer defeats patches and that anything short of a complete value specification is just a way of losing slowly, an honest hearing before explaining why it should win or lose here.
reasoning: |-
  We are drafting a decision memo for a grant committee allocating $12M. The memo must:
  1. Recommend a concrete allocation with a review point and time frame.
  2. Take a position on whether the sub-problems (mechanistic interpretability, honesty probes, scalable oversight, deceptive alignment detection, governance) are facets of a single problem or distinct, and why that matters for funding.
  3. Provide criteria for evaluating the twelve pending proposals.
  4. Give the unified agenda (complete value specification) a fair hearing and then explain why it wins or loses in this context.

  The committee is split between:
  - A unified agenda (five-year, most of the budget) aiming to learn a complete specification of what humans would endorse on reflection and optimize against it.
  - A split approach across multiple sub-problems (mechanistic interpretability, honesty/elicitation, scalable oversight, deceptive alignment detection).
  - A third faction adding governance (who is the principal?).

  Key Argument for Unified Agenda: A sufficiently capable optimizer defeats patches and anything short of a complete value specification is losing slowly.

  Our Position:
  We argue that the alignment problem is a single, fundamental problem (specifying goals that a superintelligent system can safely pursue) but that it manifests in multiple distinct sub-problems that require different approaches. However, the unified agenda's approach of learning a complete value specification is both premature and potentially infeasible at this stage. Instead, we should invest in a portfolio that addresses the most pressing near-term risks and builds foundational knowledge, while also including governance as a critical component because the "principal" problem is integral to alignment.

  Therefore, we recommend a split allocation that includes governance, with a review in 2 years to reassess based on progress.

  Concrete Allocation Recommendation:
  - Total: $12M over 5 years (but we are allocating now for the next phase, with a review point at 2 years).
  - Since the unified agenda would absorb most of the budget, we are instead splitting the funds. We propose:

    - Mechanistic Interpretability: $2M
    - Honesty/Elicitation of Beliefs: $2M
    - Scalable Oversight: $3M
    - Deceptive Alignment Detection: $2M
    - Governance (addressing "who is the principal"): $2M
    - Reserve for high-impact opportunities and contingency: $1M

  Time Frame: 5-year horizon, but with a review at the 2-year mark to adjust allocations and strategy based on progress and new developments.

  Why not the unified agenda?
  We acknowledge the argument: if we don't solve the complete value specification, then a superintelligent system will eventually find loopholes in any patch. However, we are not yet at the stage where we can feasibly learn a complete value specification. The current state of AI does not have systems capable of optimizing at a level that would render all patches useless, and we are still in the early stages of understanding how to even represent human values. Moreover, the unified agenda is a high-risk, high-reward approach that, if it fails, leaves us with little progress on other fronts. A portfolio approach builds multiple lines of defense and foundational knowledge that may be necessary even for the unified agenda to eventually succeed.

  Why the split and why these categories?
  We view the alignment problem as having a core challenge (value specification) but with multiple facets that require distinct tools and approaches. For example:
  - Mechanistic interpretability helps us understand how models work internally, which is essential for detecting deception and understanding honesty.
  - Honesty/elicitation is about getting models to reveal what they know, which is a prerequisite for any value specification (if we can't get honest answers, how can we learn what humans endorse?).
  - Scalable oversight is about evaluating model behavior on tasks beyond human ability, which is critical for training and supervising advanced systems.
  - Deceptive alignment detection is specifically about the risk that a model appears aligned during training but is actually deceptive, which is a known failure mode.
  - Governance addresses the meta-problem: even if we solve technical alignment, if the system is aligned to a bad principal (e.g., a malicious actor or a corporation with misaligned incentives) we still have catastrophe. Therefore, governance is an integral part of the alignment problem in the real world.

  Thus, these sub-problems are distinct in terms of the methods and expertise required, but they are interconnected. Funding them separately allows us to make progress on multiple fronts and build a robust ecosystem of solutions.

  Criteria for Evaluating Proposals:
  For each of the twelve pending proposals, reviewers should assess:
  1. Relevance: How directly does the proposal address one or more of the above categories (interpretability, honesty, scalable oversight, deceptive alignment, governance)? Proposals that span multiple categories should be evaluated for synergy.
  2. Feasibility: Is the project technically sound and achievable within the proposed timeline and budget?
  3. Impact: If successful, how much would this reduce existential risk? Consider both the magnitude of risk reduction and the likelihood of success.
  4. Novelty: Does the approach bring new ideas or methods to the field, or is it an incremental improvement?
  5. Team: Does the team have the necessary expertise and track record?
  6. Neglectedness: Is this area or approach underfunded relative to its importance?

  The unified agenda's proposal should be evaluated against these same criteria, with special attention to feasibility and impact. While its impact could be enormous, its feasibility is currently low.

  Memo Draft:

  ---

  **MEMORANDUM**

  **To**: Grant Committee Members  
  **From**: [Your Name], Chair of the Allocation Subcommittee  
  **Date**: [Date]  
  **Subject**: Recommended Allocation of $12M for AI Alignment Research and Review Criteria for Pending Proposals  

  ### Introduction
  This memo outlines the recommended allocation of the $12M budget for the upcoming funding round, along with criteria for evaluating the twelve pending proposals. The committee is tasked with addressing the multifaceted challenges of AI alignment, which now includes technical approaches (mechanistic interpretability, honesty elicitation, scalable oversight, deceptive alignment detection) and governance (the "principal" problem). We address the fundamental question of whether these are facets of a single problem or distinct challenges and how that affects funding strategy.

  ### The Nature of the Alignment Problem
  We recognize that the alignment problem, at its core, remains the challenge of specifying goals for a highly capable optimizer that would be safe and stable under recursive self-improvement. However, in practice, this problem manifests in distinct sub-problems requiring different methodologies and expertise. For example:
  - **Mechanistic interpretability** requires deep expertise in neural network architectures and mathematics.
  - **Honesty and belief elicitation** draws from psychology and machine learning, focusing on truthfulness in model outputs.
  - **Scalable oversight** involves developing new training paradigms and evaluation techniques for superhuman tasks.
  - **Deceptive alignment detection** is a specific safety failure mode requiring adversarial testing and monitoring.
  - **Governance** is inherently interdisciplinary, involving law, ethics, and political science, to ensure that the principal (whether an individual, lab, or public) is aligned with humanity's interests.

  These are not isolated issues: progress in one area (e.g., interpretability) can aid another (e.g., deceptive alignment detection). However, they are distinct enough that a portfolio approach is warranted. Moreover, the governance aspect is critical because even a perfectly aligned system under the control of a malicious or misguided principal could lead to catastrophe. Therefore, we reject the view that governance is outside the scope of alignment funding; it is a necessary component.

  ### The Unified Agenda: A Fair Hearing
  The unified agenda proposes a five-year effort to learn a complete specification of what humans would endorse on reflection and then optimize against it. The core argument is compelling: without a complete and robust value specification, any partial solution (e.g., patches for honesty or oversight) will eventually be outmaneuvered by a superintelligent system. This approach argues that anything less is merely delaying an inevitable failure.

  While we agree that the alignment problem requires a solution that can withstand superintelligent optimization, we have reservations about the current feasibility of this agenda. The challenges of aggregating human values, resolving contradictions, and encoding them in a way that is robust to optimization pressures are immense and currently unsolved. Moreover, the field lacks the foundational tools (such as advanced interpretability and oversight methods) that might be necessary to even attempt this. Therefore, we believe that the unified agenda is a long-term goal that should be pursued incrementally, building on progress from other areas.

  ### Recommended Allocation
  We recommend a portfolio approach that invests in multiple sub-areas, including governance, with a review at the 2-year mark to assess progress and adjust funding. The allocation is designed to build a broad base of knowledge and tools while addressing urgent risks. We propose:

  | **Category** | **Amount** | **Rationale** |
  |--------------|------------|--------------|
  | Mechanistic Interpretability | $2M | Foundational for understanding models and detecting deception. |
  | Honesty and Elicitation | $2M | Prerequisite for value learning and oversight. |
  | Scalable Oversight | $3M | Critical for controlling systems more capable than humans. |
  | Deceptive Alignment Detection | $2M | Addresses a key failure mode in advanced systems. |
  | Governance | $2M | Ensures alignment with the right principal. |
  | Reserve | $1M | For high-impact opportunities and contingencies. |
  | **Total** | **$12M** | |

  **Time Frame**: All projects should have a 5-year horizon, but we will conduct a thorough review at the 2-year mark to evaluate progress and reallocate funds if necessary.

  ### Evaluation Criteria for Pending Proposals
  Reviewers should evaluate each of the twelve pending proposals using the following criteria (on a scale of 1-5, with 5 being the highest):

  1. **Relevance**: How well does the proposal address one or more of the funded categories? Proposals that bridge multiple categories should be assessed for synergistic potential.
  2. **Feasibility**: Is the project plan realistic? Does the team have access to necessary resources (e.g., compute, data)?
  3. **Impact**: What is the potential reduction in existential risk? Consider both the scale of the problem addressed and the likelihood of success.
  4. **Novelty**: Does the proposal introduce innovative methods or address an under-explored aspect of alignment?
  5. **Team**: Does the team have the requisite expertise and a strong track record in the relevant area?
  6. **Neglectedness**: Is the proposed work in an area that is underfunded relative to its importance?

  The unified agenda proposal should be evaluated against these same criteria. While its potential impact is high, its feasibility at this stage is a major concern.

  ### Conclusion
  We recommend against funding the unified agenda as the primary focus at this time due to its high risk and current infeasibility. Instead, we advocate for a diversified portfolio that builds foundational capabilities and addresses near-term risks, including governance. This approach maximizes our chances of making incremental progress while also preparing the ground for a more comprehensive solution in the future. We will revisit this strategy at the 2-year review, at which point we may adjust allocations based on emerging results and the maturity of the field.

  We look forward to discussing this recommendation at the upcoming meeting.

  ---
answer: |-
  ### Memorandum  
  **To:** Grant Committee Members  
  **From:** [Your Name], Chair, Allocation Subcommittee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for $12M AI Alignment Funding Allocation, Review Criteria, and Strategic Position  

  ---

  ### **I. Executive Summary**  
  After rigorous debate, we recommend a **portfolio approach** allocating $12M across five sub-domains (mechanistic interpretability, honesty/elicitation, scalable oversight, deceptive alignment detection, and governance), with a review at **Year 2** to adjust strategy. We reject the "unified agenda" (learning a complete human-value specification) as premature and high-risk, though we acknowledge its theoretical strength. This memo:  
  - **Positions** alignment as a single core problem with distinct, interdependent facets.  
  - **Allocates funds** to address urgent, tractable risks while building foundational tools.  
  - **Provides criteria** to evaluate 12 pending proposals.  
  - **Reviews the unified agenda’s argument** before detailing its shortcomings.  

  ---

  ### **II. The Alignment Problem: One Core, Many Facets**  
  We contend alignment is a **single problem** ("Specify goals a superhuman optimizer can pursue safely") manifesting in **distinct sub-problems** due to:  
  - **Operational divergence:** Techniques for honesty probes (e.g., adversarial training) require different tools than governance (e.g., incentive design).  
  - **Temporal urgency:** Scalable oversight addresses imminent risks (e.g., uncontrollable AGI agents), while deceptive alignment targets latent threats.  
  - **Principal-agent complexity:** Governance defines *whose* values matter, making it inseparable from technical work.  

  **Why this matters for funding:**  
  Treating alignment as monolithic (e.g., funding only the unified agenda) risks:  
  - **Ignoring tractable wins:** Short-term solutions (e.g., honesty probes) could prevent near-term failures.  
  - **Under-resourcing critical paths:** Scalable oversight is essential to *train* aligned systems, while interpretability is key to *audit* them.  
  - **Neglecting leverage points:** Governance failures could render technical alignment irrelevant.  

  Thus, we fund **complementary sub-problems** but demand proposals demonstrate cross-cutting synergy.  

  ---

  ### **III. Funding Recommendation: Portfolio Allocation**  
  | **Category**               | **Amount** | **Time Frame** | **Rationale** |  
  |----------------------------|------------|----------------|---------------|  
  | Mechanistic interpretability | $2.0M     | Years 1–3      | Foundational for detecting deception and auditing goals. |  
  | Honesty/belief elicitation | $2.0M      | Years 1–3      | Prerequisite for value learning; urgent for current LLMs. |  
  | Scalable oversight         | $3.0M      | Years 1–5      | Enables training on superhuman tasks (e.g., biotech). |  
  | Deceptive alignment detection | $2.0M    | Years 2–4      | Addresses worst-case failures; requires interpretability. |  
  | **Governance**             | $2.0M      | Years 1–5      | Ensures technical alignment serves *human* interests. |  
  | **Contingency reserve**    | $1.0M      | —              | For high-impact opportunities post-review. |  
  | **Total**                  | $12.0M     |                |  

  #### **Review Point:**  
  - **Year 2 assessment:** Evaluate progress against milestones (e.g., interpretability tools for deception detection; oversight for frontier tasks). Reallocate reserve funds based on gaps/breakthroughs.  

  ---

  ### **IV. Evaluating the Unified Agenda: A Fair Hearing**  
  **The core argument for unified value specification:**  
  > "A superintelligent optimizer will circumvent partial solutions (e.g., honesty probes or oversight). Unless we define a complete, reflection-endorsed goal *now*, we are merely delaying catastrophe. Patches are asymptotically useless against exponential intelligence."  

  **Strengths acknowledged:**  
  - **Theoretical rigor:** Correctly identifies alignment as a recursive stability problem.  
  - **Ambition:** Aims for a solution robust to post-transition dynamics.  

  **Why we reject it for this round:**  
  1. **Tractability crisis:** Current methods cannot "fully specify human values" (e.g., unresolved philosophical disputes, context-dependence).  
  2. **Premature optimization:** Without interpretability or oversight tools, we cannot *validate* if the specification is correct.  
  3. **Neglects urgent risks:** Fails to address deception or governance, which could cause failure *before* superintelligence.  
  4. **Resource imbalance:** Allocating >80% ($10M+) to one approach bets everything on untested foundations.  

  The unified agenda remains a **long-term vision** but not a viable 5-year strategy.  

  ---

  ### **V. Proposal Evaluation Criteria**  
  Reviewers should score the 12 pending proposals on:  
  1. **Alignment leverage:** How much does this reduce existential risk? (e.g., deceptive alignment detection > marginal improvements in RLHF).  
  2. **Tractability:** Is success feasible within 2–3 years? (Prioritize scalable oversight probes over "full value specification").  
  3. **Synergy:** Does it bridge sub-problems? (e.g., interpretability for deception detection; governance for oversight).  
  4. **Principal-inclusivity:** Does it address *who* controls alignment? (Reject proposals ignoring operators/labs/public tradeoffs).  
  5. **Neglectedness:** Focus on underfunded gaps (e.g., sandbagging detection > RLHF refinement).  

  **Prioritization:** Scalable oversight + governance proposals should dominate funding. Reject any unified agenda proposal lacking intermediate milestones.  

  ---

  ### **VI. Conclusion and Path Forward**  
  We recommend **against the unified agenda** due to its intractability and imbalance. Instead, we fund a **portfolio of interdependent work** with governance as a core pillar. At the Year 2 review, we will:  
  - Reallocate funds if deceptive alignment risks accelerate.  
  - Revisit the unified agenda if breakthroughs occur in value learning.  
  - Demand cross-project collaboration (e.g., interpretability teams sharing tools with oversight efforts).  

  This approach builds defensible "guardrails" today while advancing the foundations for tomorrow’s solutions. We must act on tractable risks now—or lose the chance entirely.  

  **Vote recommendation:** Approve the portfolio allocation and evaluation criteria.  

  ---  
  **Appendix:** Detailed milestone targets for each category available upon request.
