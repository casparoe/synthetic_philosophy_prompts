answer: |-
  Your working hypothesis cuts to the heart of the matter with remarkable clarity. The decades-long stalemate in the evolutionary psychology debate, where critics decry "just-so stories" and defenders invoke the standards of historical science, is indeed less a dispute about specific findings than a profound disagreement about the *nature of acceptable explanation* and the *epistemological burden* required for claims about deep-time adaptations. While arguments manifest around specific experiments or traits, the core impasse lies in divergent philosophies of science concerning unobservable past events.

  It **is** a substantive disagreement, not merely verbal, though disciplinary perspectives heavily shape it. Critics, often leaning towards developmental biology, anthropology, or social constructionist traditions, demand a high threshold of evidence to guard against biological determinism and the ease of constructing plausible narratives. They argue that demonstrating a trait *could* be adaptive is trivial; proving it *was* the target of selection requires evidence robust against alternative explanations (drift, exaptation, cultural evolution). Their standard often leans towards needing multiple, independent lines of evidence – fossil, comparative, genetic, developmental – converging on a specific adaptive function, akin to rigorous historical geology. They see adaptationist hypotheses as too easily confirmed by fitting current function to a vague Pleistocene scenario, lacking the falsifiability Popper deemed essential.

  Defenders, grounded in evolutionary biology and cognitive science, argue they *are* applying the same inferential standards used successfully in paleontology or phylogenetics. They start with functional design – complex, specialized mechanisms unlikely to arise by chance (e.g., specialized cheater-detection algorithms). Reverse-engineering from design to probable selective pressure is their core method. They argue demanding *direct* evidence of the Pleistocene selective regime is unreasonable for psychological mechanisms, just as it is for the origin of specific anatomical features. For them, well-designed experiments revealing domain-specific, content-dependent cognitive biases (like the Wason task variations) *are* strong evidence of evolved function, especially when universality or early development can be shown. They see critics' demands as moving the goalposts to an impossible standard, effectively declaring human cognitive evolution scientifically off-limits.

  So, the disciplines *are* answering subtly different questions under the banner of "is this an adaptation?":
  1.  **Evolutionary Psychology:** "Does this trait exhibit functional design strongly suggesting it was shaped by natural selection to solve a specific adaptive problem in our ancestral past? Does current evidence best support this hypothesis?"
  2.  **Critics:** "Can we reliably *distinguish* this trait as a direct product of past natural selection from other evolutionary and non-evolutionary processes, given the limitations of evidence and the ease of narrative construction?"

  **Progress, therefore, is unlikely to come from a single knockout experiment** replicating the Wason task yet again. Nor is it likely from one side capitulating. Meaningful progress would involve:

  1.  **Developing and Applying More Rigorous, Consilient Methodologies:** Moving beyond single experiments or plausibility arguments. Progress lies in:
      *   **Stronger Comparative Work:** Truly testing universality across diverse cultures (especially non-WEIRD populations) and seeking homologous traits in primates, looking for adaptive convergence.
      *   **Integration with Genetics & Development:** Can we find genetic signatures of selection linked to specific cognitive mechanisms? How does the trait develop – is it canalized, or highly sensitive to environment? Does disruption point to a specialized mechanism?
      *   **Finer-Grained Paleoecological Constraints:** Building more specific, testable models of Pleistocene challenges based on improved archaeological and paleoclimatic data, moving beyond vague "environment of evolutionary adaptedness" stories.
      *   **Predictive Power:** Can adaptationist hypotheses predict *novel* findings about cognitive biases, neural substrates, or developmental pathways that non-adaptationist explanations cannot?

  2.  **Articulating and Negotiating Explicit Evidentiary Standards:** The field needs clearer, shared frameworks for what constitutes *sufficient* evidence for an adaptationist claim in psychology, acknowledging the inherent challenges. This involves:
      *   Defining what constitutes "independent lines of evidence" in this domain.
      *   Establishing criteria for when alternative explanations (exaptation, byproduct, cultural) become *more* parsimonious than adaptation.
      *   Accepting that some hypotheses may remain plausible but not definitively proven, occupying a space of "best current explanation" pending further evidence – a common state in historical sciences.

  3.  **Shifting Focus from "Adaptation Yes/No" to "How and Why":** Progress might involve moving beyond the binary debate to explore the *interplay* of evolutionary and non-evolutionary factors. How do evolved potentials interact with culture and development? How flexible or constrained are these mechanisms? This nuanced view might dissolve some absolutist positions.

  Giving up the question entirely is neither desirable nor necessary. The evolutionary origins of human cognition are a legitimate and profound scientific inquiry. The persistent controversy, while frustrating, reflects the genuine difficulty of the problem. Real progress won't be a sudden victory for one side, but a gradual refinement of methods, standards, and explanatory models that allows the field to generate more robust, consilient, and less easily dismissed hypotheses about our evolutionary past. It requires both adaptationists to embrace greater methodological rigor and critics to acknowledge the validity of inference in historical sciences, moving towards a shared, albeit demanding, epistemology for evolutionary psychology.
