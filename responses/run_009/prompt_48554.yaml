prompt: |-
  For my Theory of Knowledge course I have to write about a scientific controversy, and I have chosen the long fight over evolutionary psychology: whether claims that some human trait is a biological adaptation — that we have a built-in mechanism for detecting cheaters, or that disgust evolved to steer us away from pathogens — are genuine science or, as critics in the tradition of Stephen Jay Gould put it, just-so stories. What strikes me is that the argument seems not to have moved in decades. The critics repeat that such hypotheses are too easy to confirm, because for almost any trait you can invent a story about the Pleistocene that fits it, and that the supporting experiments, like the famous results on the Wason selection task, have contested interpretations. The defenders repeat that the same standards of evidence apply to any historical science, including geology and the search for the origin of life, and that nobody calls those unscientific. Both sides keep publishing, and neither seems to lose anyone. My working hypothesis, offered only as a hypothesis, is that this is not really a disagreement about evidence at all but about what an acceptable explanation is — perhaps about how much independent support a claim about the unobservable past needs before it earns a place in a theory. Is that right? Is the disagreement substantive, verbal, or a case of two disciplines answering different questions under one name? And given your diagnosis, what would count as progress — a new kind of experiment, an agreed standard for adaptationist claims, or nothing short of giving up the question? Please answer in continuous prose only, with no headings, bullet points, bold text, or tables, as you would in a letter.
