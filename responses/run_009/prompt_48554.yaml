  Okay, the user is working on a Theory of Knowledge assignment about the controversy in evolutionary psychology. They've noticed that the debate hasn't moved much over decades, with critics like Gould calling it "just-so stories" and defenders comparing it to historical sciences. Their hypothesis is that the core disagreement isn't about evidence but about what counts as an acceptable explanation. 

  Hmm, this is a sophisticated observation. The user clearly grasps the stalemate but wants to dig deeper into why it persists. They're asking three layered questions: whether the disagreement is substantive or semantic, whether it's interdisciplinary confusion, and what "progress" would look like. 

  First, let's unpack their hypothesis. They're spot-on that evidentiary standards are central, but it's more nuanced. The real friction lies in how different fields define "adequate explanation." Evolutionary biologists expect inference from present mechanisms to past function as valid, while critics demand direct evidence of historical pathways - something rarely possible for Pleistocene traits. This isn't just about evidence thresholds; it's about fundamental epistemology. 

  The disciplinary angle is crucial too. Critics often come from social sciences wary of biological determinism, while defenders lean on life sciences' established methods. When they talk past each other, it's because one side asks "How do you know this wasn't cultural?" and the other hears "Why won't you accept standard comparative methods?" 

  As for progress... that's thorny. New experiments help (like fMRI studies showing domain-specific neural activation for cheater detection), but won't resolve the core divide. What might shift things is consilience - multiple lines of evidence converging. For example, if cross-cultural studies, genetics, and paleoanthropology all point to the same adaptive function, skepticism softens. But the deepest progress would require both sides to articulate their explanatory ideals explicitly. 

