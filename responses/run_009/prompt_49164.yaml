prompt: |-
  been in the rationalist-sphere for like 15 years now (lesswrong, ACX comment sections, the whole thing), and lately I keep running into the dollar auction as everyone's favorite Explanation For Everything. quick recap so we're synced: Shubik's 1971 game where a dollar is auctioned off, except the second-highest bidder ALSO has to pay their bid and gets nothing. so once you're in, overbidding past a dollar can look locally rational, and Shubik supposedly made decent money running it on his students. and the move I see over and over is: [escalating thing X] is "just a dollar auction," therefore people in it are trapped by sunk costs, therefore the fix is to precommit to a hard exit point before you enter.

  the places I've watched this get deployed: my friend who says the Vietnam war (Shubik's original target iirc) and every war since is a dollar auction so leaders should set withdrawal thresholds in advance. another friend in a dying startup who applied it to herself, decided her sunk costs were irrelevant, and quit on principle — and now the consensus in the group chat is she quit 3 months too early. and the one that actually got me to write this post: someone arguing the current AI race between labs is "a dollar auction with the whole future as the prize," so labs should all just... agree to stop? nobody could say what the auctioneer is, which made me suspicious of the whole frame.

  so here's what I want. You're a game theorist who also has a strong opinion about analogies being load-bearing in arguments. Please think carefully before answering, maybe brainstorm a list of candidate disanalogies first and then prune it, don't just pattern-match to "sunk cost fallacy, walking away is always rational."

  1. give me the actual correspondence table for the analogy as it's being used — what plays the role of the dollar, the auctioneer, the bids, the second-price rule (the loser pays too bit), the other bidder, and the moment where continuing becomes irrational but quitting also costs you. do this for at least two of: Vietnam, my friend's startup, and the AI race. if a cell has to be filled with something strained, say so.

  2. then tell me where the analogy breaks, and specifically which breaks actually matter for the advice it's being used to give. my own suspects, check me on these: in the real cases the prize usually isn't fixed (the "dollar" you're fighting over changes value as the fight goes on — sometimes upward), in the real cases the winner often collects part of the loser's bids (learning, reputation, deterring the NEXT rival, which is a Schelling point the auction erases), and in the auction the rules are common knowledge while in life you don't even know if there IS a second-price rule. also I half remember that a proper war-of-attrition analysis says staying in can be genuinely rational (mixed strategies, expected value of the other guy folding), which would mean the "everyone in it is irrational" reading is wrong and the analogy is doing sneaky work — is that right?

  3. verdict time. does the "precommit to a hard exit point" conclusion survive the disanalogies, does it survive only in some of the cases (my guess is it's fine for one-shot personal stuff like the startup and terrible for the AI race, but argue me out of it if you can), and is there a better analogy to hand — war of attrition? all-pay auction? something I haven't heard of? don't be precious about salvaging the dollar auction if it's just a good party trick that got overgeneralized.

  ty, and please be blunt about which parts of my framing above are confused, I can take it.
reasoning: |-
  Okay, the user has been in the rationalist community for 15 years and is seeing the dollar auction analogy applied everywhere. They want a critical analysis of its use in Vietnam, startups, and AI races. Let me start by recalling the dollar auction mechanics: two bidders, both pay, winner gets the dollar. The analogy is used to explain sunk costs and the need for precommitment.

  First, I need to map the analogy to real-world cases. For Vietnam, the dollar is preventing communist takeover. Bids are military escalation. The auctioneer is the conflict dynamics, but that's vague. The second-price rule is both sides paying costs. The moment of irrationality is when costs exceed the stake's value. But here, the prize isn't fixed; losing might mean domino effect, so the value changes. Also, there's no real auctioneer. 

  For the startup, the dollar is success (acquisition/IPO). Bids are time/money invested. Auctioneer is market forces. Second-price rule is both founders and investors lose if it fails. Irrationality point is when survival odds are low. But the prize value fluctuates, and there might be secondary benefits like learning. 

  For AI, the dollar is winner-take-all future. Bids are R&D spending. Auctioneer is the competitive dynamic. Second-price rule is all labs burn resources. But here, the prize is undefined and huge, the rules aren't clear, and collaboration could change the game. 

  Now, where the analogy breaks. The prize mutability: in wars and startups, the stakes can increase. Secondary benefits exist—reputation, deterrence, learning. Information asymmetry: unlike the auction, real players don't know opponents' costs or if it's even a dollar auction. War of attrition models show staying can be rational if others might fold. 

  For advice on precommitment: in startups, it might work because it's a personal exit. In wars, it's hard due to changing stakes. In AI, precommitment fails without enforcement. Mixed strategies in game theory suggest flexibility over hard exits. Alternatives like war of attrition or all-pay auctions might be better fits. 

  User suspects precommitment works for startups but not AI races. I agree. The dollar auction is a simplified model that ignores dynamic stakes and information gaps. It's useful for illustrating sunk cost fallacy but overgeneralized. Better to use war of attrition for conflicts with time-based costs, or all-pay auctions for R&D races. 

  User’s framing is sharp, but they might underestimate how sunk costs can trap even with rational strategies. Also, the auctioneer's role is often hand-waved, which is a red flag. Verdict: precommitment is situational; inflexible exits can be premature. Context matters more than the analogy.
answer: |-
  Here's a systematic breakdown of the dollar auction analogy's strengths and weaknesses across your cases, followed by a verdict. I'll be blunt where needed—your framing is largely sharp, but some nuances need tightening.

  ### 1. Correspondence Tables (Vietnam & AI Race)
  *(Startup is straightforward; I'll note key differences in section 2)*

  | **Dollar Auction Element** | **Vietnam War**                                | **AI Race**                                         | **Strain?** |
  |----------------------------|-----------------------------------------------|----------------------------------------------------|-------------|
  | **The Dollar (Prize)**     | Preventing communist takeover of South Vietnam | "Winning" AGI/dominant market position             | **High** (Prize value isn't fixed. Losing Vietnam risks "domino effect"; winning AGI might enable winner-take-all control of humanity's future) |
  | **The Auctioneer**         | Geopolitical conflict dynamics                | Competitive pressure / perceived "race" logic      | **Extreme** (No neutral entity. Self-reinforcing actions *create* the auction. "Auctioneer" is emergent) |
  | **Bids**                   | Troop deployments, bombing campaigns, $ spent | R&D spending, compute burned, safety corners cut, talent wars | Low |
  | **Second-Price Rule**      | Both sides pay costs (US/USSR lives, $; N. Vietnam/VC losses) | All labs incur massive costs (capital, opportunity, reputational risk) even if they "lose" | Medium (Losers *do* pay, but may gain secondary benefits—see below) |
  | **Other Bidder(s)**        | North Vietnam & allies (VC, USSR, China)      | Competing AI labs (Anthropic, OpenAI, etc.) + potentially China | Low (Though multi-player games change dynamics) |
  | **Irrational Continuation Point** | When cost > value of preserving S. Vietnam | When cost > expected value of "winning" | **High** (Determining this point is near-impossible ex-ante. Prize value is speculative and inflates *because* of bids—e.g., "AGI is closer than we thought!") |

  ### 2. Where the Analogy Breaks (and Why It Matters for Advice)
  Your suspicions are correct. Key breaks:

  - **Prize Mutability:**  
    - *Vietnam:* The "dollar" inflated for the US (credibility, domino theory) *and* deflated (waning public support).  
    - *AI Race:* The "prize" (AGI) is undefined and its value hyper-speculative. Bids (breakthroughs) can *increase* perceived prize value, creating a perverse incentive to escalate.  
    - **Why it breaks the advice:** Precommitting to an exit threshold fails if the threshold value is dynamic. If the prize inflates, you exit too early; if it deflates, you overpay. "Set a hard exit" assumes a fixed prize—which never holds in complex conflicts.

  - **Secondary Benefits & Schelling Points:**  
    - *Reality:* Losers gain experience, reputation, deterrence (e.g., startup failure → VC connections; war loss → intelligence gains). In multi-round games (e.g., geopolitics), paying costs signals resolve for *future* conflicts.  
    - **Why it breaks the advice:** The dollar auction erases these. If losers gain residual value (e.g., startup IP, war tech spin-offs), "always quit when bids exceed prize" is wrong. The auction falsely implies bids are pure waste.

  - **Information Asymmetry & Rule Uncertainty:**  
    - *Auction:* Rules are common knowledge. Players know opponents' bids.  
    - *Reality:* In Vietnam, the US didn't know Hanoi's breaking point. In AI, labs don't know rivals' progress/costs. Is there even a "second-price rule"? (e.g., Could #2 merge with #1? Could regulators stop all?)  
    - **Why it breaks the advice:** Precommitment requires knowing *what game you're playing*. If you misdiagnose (e.g., it's a war of attrition, not dollar auction), hard exits are catastrophic. 

  - **The "Irrationality" Mismatch:**  
    - *War of Attrition (WoA) Insight:* In WoA models (where players pay *per period* until one quits), mixed-strategy equilibria exist where continuing is *rational* if you assign probability to the opponent folding soon. Expected value can justify persistence.  
    - **Why it breaks the advice:** Framing persistence as "sunk cost fallacy" ignores rational gambles. Your startup friend might have quit too early because she ignored WoA dynamics—her investors might have folded first. The dollar auction smuggles in an "irrationality" assumption that may not hold.

  ### 3. Verdict: When the Analogy (and Its Advice) Holds or Fails
  | **Case**       | **Precommit Viable?** | **Why**                                                                 | **Better Analogy**               |
  |----------------|------------------------|-------------------------------------------------------------------------|----------------------------------|
  | **Startup**    | **Yes, cautiously**    | Single entity control; prize (acquisition/IPO) *somewhat* estimable. But dynamic markets & WoA elements mean hard exits risk leaving money on the table. | **War of Attrition** (against market/fate) + **Real Options Theory** (value of flexibility) |
  | **Vietnam**    | **No**                 | Prize mutability, multi-actor chaos, Schelling dynamics (reputation for allies/enemies). Hard exit precommitments ignore changing stakes. | **Multi-player War of Attrition** with incomplete information |
  | **AI Race**    | **Hard No**            | Indefinable prize, no enforcement mechanism for mutual precommitment ("agree to stop"), residual value from research. Labs *must* race absent enforceable coordination. | **All-Pay Auction** (where all pay bids, winner takes all) + **Prisoner's Dilemma** (safety vs. speed) |

  **Core Flaw in the Advice:**  
  **Precommitment only works if:**  
  - The prize value is stable and knowable  
  - You control exit unilaterally  
  - No secondary benefits exist  
  - The "game" structure is fixed  

  These conditions rarely hold outside trivial personal decisions (e.g., "I won't bid over $0.90 for this dollar"). In dynamic systems, **flexible reassessment beats hard precommitment**. The analogy's appeal is its sunk-cost purity—but that's its weakness.

  ### Better Frameworks
  - **War of Attrition:** For conflicts where costs accrue over time (startup runway, prolonged war). Captures rational persistence via mixed strategies.  
  - **All-Pay Auction:** For R&D races like AI—all players pay bids regardless of winning, but the prize *can* be winner-take-all. Acknowledges rational overbidding when prize value >> costs.  
  - **Preemption Games:** For races where being first matters (e.g., patent wars). Explains why "slowing down" isn't stable.  

  **Final Take:** The dollar auction is a brilliant *toy model* for illustrating sunk cost traps in simple, symmetric scenarios. But it's a **category error** when applied to complex adaptive systems (wars, tech races). Its "precommit or die" advice is dangerously reductive—your friend's startup exit might have been premature precisely because she treated it like Shubik's classroom experiment. Context eats analogies for breakfast.
