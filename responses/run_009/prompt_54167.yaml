prompt: |-
  I'm a backend engineer with no formal philosophy training, but I've been in a standing argument with my brother-in-law about housing for over a year. He's active in his neighborhood association and fought a rezoning that would have allowed mid-rise apartments near our transit station; I keep insisting the shortage is a supply problem and that opposing new homes is free-riding on scarcity. We've recently realized we mostly argue past each other: he's talking about who has standing to decide what happens to a place people have invested decades in, and I'm talking about what happens to prices when supply is choked off. Rather than keep circling, we want to try an adversarial collaboration, and I'd like you to draft the joint statement for us to work from.

  Please write the document a committed YIMBY (broad claims of newcomers and renters to live where opportunity is, skepticism of incumbent veto) and a committed NIMBY (neighborhood self-determination, the moral weight of residents' long-term investment in a place, preservation of community character) could both put their names to after a good-faith exchange. It should contain: (1) a numbered section of claims both sides accept — about the facts of the housing market, about what zoning actually does, and about whose interests are at stake; (2) a disagreements table in which each disagreement is stated in wording its own side would sign off on — I suspect one genuine dispute is whether longtime residents have a moral claim on the character of their neighborhood, and another whether opposing development can be justified even if it does worsen affordability, but tell me honestly if some of our fight is really about what the word "community" means rather than a substantive question; (3) the cruxes — the sub-questions such that settling one would move at least one of us; and (4) for each crux, a concrete case, argument, or policy experiment we'd both agree bears on it, with each side's prediction recorded in advance. Throughout, please keep separate what is genuinely settled among people who study housing from what is still contested, and flag rather than paper over any point where the draft risks presenting one side's contested empirical assumption as agreed fact.
reasoning: |-
  Okay, let me unpack this request. A backend engineer and his neighborhood-association-activist brother-in-law want to move beyond their housing policy stalemate through adversarial collaboration. They've identified their core disconnect: he frames it as "who decides" about places with deep personal investment, while the engineer sees "supply-and-demand mechanics." 

  Hmm... the challenge is drafting a document both a hardline YIMBY (pro-development, skeptical of local veto power) and hardline NIMBY (pro-self-determination, values community preservation) could sign. Needs four precise components: agreed facts, disagreement table with mutually acceptable phrasing, testable cruxes, and verification methods. 

  First, the factual baseline: must distinguish settled economics from contested claims. Consensus exists on zoning artificially restricting supply and raising prices - that's well-established in literature. But "community character degradation" or "newcomer displacement risk"? Those are empirical questions with mixed evidence. Should flag those. 

  For disagreements: phrasing is everything. The NIMBY's "moral claim to neighborhood character" vs. YIMBY's "exclusionary effect of preservation" need parallel construction. And that "community" definition point is sharp - is it about physical continuity or demographic churn? Should surface that linguistic rift explicitly. 

  Cruxes design matters most. For example: if we measure property value impacts after midrise development, NIMBY might predict decline while YIMBY expects stability. Or resident surveys on neighborhood satisfaction pre/post-change. Neutral third-party data essential. 

  Biggest risk? Accidentally presenting supply constraints as solely causing affordability crises when other factors (inequality, wage stagnation) also play roles. Must footnote that complexity. Also, should emphasize this isn't about convincing each other but mapping the exact coordinates of disagreement. 

  The engineer mentioned "free-riding on scarcity" - that's a morally loaded framing. In the joint statement, better reframe as "distributional consequences of supply constraints" to depersonalize. His brother-in-law's "standing" concern needs equal weight: not NIMBY obstructionism but legitimate governance questions. 

  Noticing both care about fairness but define it oppositely: one as access opportunity, the other as investment protection. That tension might be irreducible, but we can isolate which aspects are testable. For instance, does new development actually displace existing residents? Studies vary by market - should present that ambiguity honestly. 

  Policy experiment ideas: upzoning parcels near transit with affordability mandates, then tracking displacement metrics and price changes. Or shadow studies of rejected projects to model counterfactuals. Key is getting both to pre-commit predictions. 

  ...Better avoid the word "NIMBY" in the doc itself. Too pejorative. "Place steward" or "incumbent resident advocate"? Likewise "YIMBY" might read as glib - "housing supply advocate" feels more neutral. Language discipline crucial here.
answer: |-
  Here’s a draft joint statement designed for adversarial collaboration, balancing both perspectives while rigorously separating agreements, disagreements, testable cruxes, and evidence. It flags contested assumptions and avoids false consensus:

  ---

  ### **Joint Statement on Housing Development: A Framework for Dialogue**  
  *Drafted by [Your Name] (Supply Advocate) and [Brother-in-Law’s Name] (Place Steward)*  

  #### **1. Shared Foundations**  
  We agree on the following evidence-based premises:  
     - **Housing Costs:** When demand for housing in an area exceeds supply, prices rise (basic economics).  
     - **Zoning’s Power:** Local zoning rules legally restrict the type, density, and location of housing that can be built.  
     - **Stakeholders:** At minimum, the following groups have legitimate interests in development outcomes:  
       - Existing residents (owners and renters) with deep social/financial ties to the neighborhood.  
       - Prospective residents (including newcomers, young people, and essential workers) seeking access to opportunity.  
       - Municipal and regional entities responsible for economic resilience, infrastructure, and equity.  
     - **No Single Cause:** Housing unaffordability stems from multiple factors (e.g., construction costs, wage stagnation, speculative investment) — **though we disagree on supply’s relative importance**.  

  *(Note: While economists broadly agree supply constraints significantly impact prices, the degree varies by market; other factors are non-zero but contested in dominance.)*  

  ---

  #### **2. Core Disagreements (Stated Neutrally)**  
  | **Supply Advocate’s Position**                                                                 | **Place Steward’s Position**                                                                 |  
  |------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------|  
  | *Moral Claim:* Newcomers and renters have a right to access high-opportunity areas; opposing housing supply violates this by artificially restricting access. | *Moral Claim:* Residents who invest financially, socially, and emotionally in a place over decades gain a legitimate stake in stewarding its character and preventing disruptive change. |  
  | *Policy Effect:* Blocking denser housing near transit/jobs directly exacerbates scarcity, disproportionately harming marginalized groups. | *Policy Effect:* Development opposition can be justified to protect community integrity, even if it affects prices, when change undermines stability, heritage, or livability. |  
  | *"Community" Definition:* Community is dynamic; its health requires inclusive growth and demographic churn. Physical change ≠ social loss. | *"Community" Definition:* Community is rooted in sustained relationships and shared history; rapid physical change risks eroding social cohesion and place identity. |  

  *(Note: Disagreement 3 reveals a definitional rift: "Community" is understood as either an *open network* (Supply Advocate) or a *bounded entity* (Place Steward). This is philosophical, not empirical.)*  

  ---

  #### **3. Testable Cruxes**  
  If resolved, these would materially alter one/both of our positions:  

  | **Crux**                                                                 | **Concrete Test/Case**                                                                                                | **Supply Advocate Prediction**                           | **Place Steward Prediction**                             |  
  |--------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------|----------------------------------------------------------|  
  | **A. Does densification near transit degrade neighborhood livability?**  | Study 5 comparable neighborhoods: 3 with mid-rise transit-oriented development (TOD) built (2010–2020), 2 without. Measure noise, traffic, park crowding, crime, and resident satisfaction via surveys/administrative data. | Livability metrics show no decline vs. control areas. | Significant declines in perceived safety/quality of life. |  
  | **B. Do incumbent residents suffer net harm from neighborhood change?** | Track long-term (10+ year) residents in a newly densified area: economic (property values, taxes), social (displacement, neighbor turnover), and mental health outcomes vs. a low-change area. | No net harm; most benefit from appreciation, services. | Material social/financial stress despite property gains. |  
  | **C. Can "character" be preserved without blocking housing?**           | Audit a city with strict design-review boards requiring architectural continuity *and* density bonuses. Compare resident satisfaction & price trends vs. a city with no design rules but similar density. | Design rules marginally increase satisfaction without affecting supply. | Binding design rules are essential to mitigate harm from density. |  

  *(Note: Crux B’s "harm" is partially subjective; pre-agree on measurement thresholds. Crux C assumes "character" is physical — if social, it becomes untestable.)*  

  ---

  #### **4. Contested Empirical Assumptions (Flagged)**  
  - **Supply Advocate’s claim:** "Building market-rate housing near transit lowers regional rents." *Contested:* Filtering effects are delayed and may be swamped by demand in hot markets ([Furth, 2021](https://www.sightline.org/2021/10/04/does-building-new-market-rate-housing-displace-low-income-people/)).  
  - **Place Steward’s claim:** "New development accelerates displacement of existing residents." *Contested:* Evidence is mixed; new supply can reduce pressure on older units ([Ding et al., 2016](https://www.jchs.harvard.edu/research-areas/working-papers/effects-new-market-rate-housing-production-existing-low-income)).  
  - **Shared blind spot:** Both positions underweight *regional policy* (e.g., tax reforms, state mandates) as alternatives to local control.  

  ---

  ### **Next Steps**  
  We commit to:  
  1. Selecting 1 crux to investigate using the proposed test.  
  2. Gathering neutral data sources (academic studies, city reports, peer-reviewed journals).  
  3. Revisiting this document in 90 days to revise based on evidence.  

  Signed,  
  **[Your Name]** — *Supply Advocate*  
  **[Brother-in-Law’s Name]** — *Place Steward*  

  ---

  ### **Key Design Notes for Your Use:**  
  - **Neutral Language:** "Supply Advocate" and "Place Steward" avoid pejorative labels (NIMBY/YIMBY).  
  - **Clarified Conflict Types:** Separates *values* (moral claims), *definitions* ("community"), and *empirics* (policy effects).  
  - **Testability:** Forces predictions to be falsifiable and grounded in observable outcomes.  
  - **Transparency on Uncertainty:** Explicitly flags where evidence is inconclusive or where disagreement is normative.  
  - **Forward Focus:** Framed as iterative inquiry ("next steps"), not debate.  

  This creates a scaffold for productive engagement — the rest is up to your evidence and goodwill. Good luck!
