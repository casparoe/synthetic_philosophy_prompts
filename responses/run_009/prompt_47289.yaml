prompt: |-
  I'm taking a grad seminar this term that's about to dive into the norms of assertion debate — the whole thing about whether what you need to properly assert p is that you know p, just that p is true, that you believe p, or some justified-belief/reasonable-belief variant — and my plan is to build my own evaluation sheet BEFORE reading the main papers, so the criteria come from me and not from whoever's view I happen to read first. So what I want from you is the full spec: what any adequate norm of assertion has to deliver, with the case or consideration behind each requirement. Off the top of my head it has to at least make sense of why "your lottery ticket will lose" feels improper even though it's almost certainly true, why Moore-paradoxical utterances like asserting p while denying you believe p are defective even when p is true, why "sorry, I shouldn't have said that — I didn't actually know" counts as taking back an assertion rather than retracting a falsehood, and what's going on in selfless assertion, where a nervous doctor tells a patient he'll be fine without believing it, yet seems blameless because all her evidence supports it. But there's more I suspect: the norm should say whether it governs the act or the speaker, whether it's constitutive of what assertion is or just a standard we hold asserters to, and why lying (asserting what you believe false) is somehow the paradigm violation rather than just one infraction among many — does a norm that lumps lying and merely-warrantless assertion together as equally norm-violating count as missing something?

  One thing I want you to engage with specifically, because my seminar-mate raised it and I can't tell if it's a genuine requirement or her own idiosyncrasy: she claims any norm has to handle what she calls second-hand assertion — almost everything I say about history, geography, science, I'm saying on the strength of testimony, with no evidence of my own — and she thinks this cuts against justification-flavoured norms, since they seem to demand re-deriving things from my own grounds that no one could re-derive, while knowledge norms just inherit whatever the original speaker knew. I half buy it but I also suspect every norm inherits SOME problem from testimony, so maybe this isn't a discriminating test at all. She also floated that different domains might need different norms (a forecaster giving probabilities, a customs officer declaring a form complete, a mate telling you the bridge is safe to cross), which if true would wreck the whole idea of THE norm of assertion — but maybe that's just camp preference smuggled in as a requirement.

  So: give me the requirements list with the motivating case behind each, mark clearly which are non-negotiable and which are just what partisans of one view demand (e.g. is "must make knowledge the norm, not merely necessary" a requirement or a slogan?), and flag any pair of desiderata you suspect can't be jointly satisfied — that's the part I most want to see, since if selfless assertion and the lottery case pull in opposite directions, the list itself is basically a result. Say which single requirement does the most to knock out contenders. A quick scorecard of the knowledge, truth, belief, and justification norms at the end is fine but keep it short, the thinking should be in the criteria. And please write it in British English — behaviour, colour, scepticism, that sort of thing — since the seminar paper is for a UK programme. Sorry its a bit long, I got carried away, but I'd rather over-specify than get a generic "here are the four norms" summary I could have written myself.
reasoning: |-
  Okay, the user is preparing for a grad seminar on the norms of assertion and wants to build their own evaluation criteria before diving into the literature. They've outlined several key cases and considerations that any adequate norm must handle, like the lottery paradox, Moorean absurdity, retraction, and selfless assertions. They also mention their seminar-mate's points about second-hand assertions and domain-specific norms.

  First, I need to list all the requirements an adequate norm of assertion should meet. The user explicitly mentioned several cases: lottery tickets feeling improper to assert even when likely true, Moore-paradoxical statements being defective, retractions focusing on lack of knowledge rather than falsehood, and selfless assertions where evidence supports the claim but the asserter doesn't believe it. Additionally, they want the norm to address whether it governs the act or the speaker, if it's constitutive or just a standard, and why lying is a primary violation.

  The seminar-mate's points add complexity. Second-hand assertions rely on testimony without personal evidence, which might challenge justification-based norms if they require personal derivation. Domain-specific norms could undermine the idea of a single universal norm. The user is unsure if these are genuine requirements or idiosyncrasies, so I should assess their validity.

  I recall that the knowledge norm (KN) is prominent, often defended by Williamson, requiring that one knows p to assert p. This handles lottery cases since you don't know your ticket will lose, and retractions because you admit lack of knowledge. Moorean assertions violate KN by asserting without belief, which is part of knowledge. Selfless assertions are trickier; if the doctor has justification but not belief, KN might deem it improper, but the user mentioned blamelessness, so maybe a justification norm (JN) fits better here.

  Truth norm (TN) requires p be true, but this doesn't explain lottery impropriety since the assertion could be true. Belief norm (BN) requires believing p, which explains Moore-paradox but not lottery cases where you believe but don't know. Justification norms vary but might handle selfless assertions if evidence justifies despite lack of belief.

  For second-hand assertions: KN might handle them if the original testifier knew, allowing transmission. JN could require personal justification, which might be impractical if it means re-deriving everything. TN and BN don't inherently address testimony's epistemic structure. So testimony might favor KN or a weaker norm.

  Domain specificity: The user's examples (forecaster, customs officer, friend) might involve different standards. A forecaster's probabilistic claim isn't a flat assertion, so perhaps norms apply differently. Customs might rely on procedural norms, not epistemic. If norms vary by context, a unified theory might be impossible, but maybe a core norm exists with contextual adjustments.

  Tensions: Selfless assertion vs. lottery case. Selfless needs blamelessness without belief, lottery needs prohibition despite high probability. KN forbids both, but selfless might be excusable. JN allows selfless (if justified) but might permit lottery assertions if justified by probability, which feels wrong. So there's a tension between high probability and knowledge requirements.

  Retraction cases emphasize that we retract based on lack of knowledge, not just falsity, pushing towards KN. Moore-paradox ties assertion to belief, so BN or KN (which includes belief) handles it. Lying as a paradigm violation suggests that belief is central, so norms without a belief component (like TN) might miss why asserting without belief is particularly bad.

  Requirements list should include:
  1. Lottery Impropriety: Why assert likely truths is improper. KN explains, TN doesn't.
  2. Moore-Paradox: Asserting p while denying belief is absurd. BN or KN.
  3. Retraction: Taking back due to lack of knowledge. KN fits.
  4. Selfless Assertion: Blameless despite lack of belief. JN or reasonable belief norms.
  5. Testimony: Handling second-hand knowledge without personal justification. KN might transmit, JN struggles.
  6. Domain Variance: Whether norms apply universally. If domains differ, a single norm might fail.
  7. Constitutive vs. Normative: Is the norm defining assertion or regulating it?
  8. Lying as Central: Why asserting without belief is worse than unwarranted true assertions. BN or KN capture this.

  Non-negotiable vs. partisan: Lottery and Moore cases are core; testimony might be a challenge but not a deal-breaker; domain variance could be context-dependent adjustments. The insistence that knowledge must be the norm (not just necessary) might be partisan; some argue justification suffices.

  Conflicting desiderata: Selfless assertion and lottery. If a norm permits blameless selfless assertion (needing justification without belief), it might allow lottery assertions (highly justified), but we feel lottery assertions are improper. A knowledge norm forbids both, but selfless might need exemption, suggesting no norm satisfies all smoothly.

  The user wants British English, so using "behaviour," "colour," "scepticism," etc. Also, they want a quick scorecard but focused on criteria.

  Putting it all together, the requirements should be listed with cases, noting which are widely accepted (lottery, Moore, retraction) versus more contentious (testimony, domain). Highlighting the conflict between selfless and lottery as a key tension. KN scores well on lottery, Moore, retraction, lying but struggles with selfless. JN handles selfless and testimony better but fails lottery. TN fails lottery and retraction. BN fails lottery and retraction. Second-hand assertions might slightly favor KN over JN if transmission of knowledge is easier than transmission of justification.
answer: |-
  Here is a comprehensive list of requirements for an adequate norm of assertion, grounded in core cases and philosophical considerations. I'll structure it as requested: each requirement is stated, followed by the motivating case(s), its status (core/negotiable), and notes on tensions or what it reveals. The list prioritises British English spelling and addresses your specific points.

  ### Core Requirements (Widely Accepted as Non-Negotiable)
  1.  **The Lottery Requirement:**  
      *   **What it must explain:** Why asserting "Your lottery ticket will lose" (based solely on probabilistic odds, e.g., 1 in a million chance to win) feels intuitively *improper*, even when the proposition is overwhelmingly likely to be *true* and the asserter rationally believes it.  
      *   **Motivating Case:** The Lottery Paradox. Intuition strongly suggests asserting flat-out "It will lose" is incorrect; hedging ("It's *almost certain* to lose") is acceptable.  
      *   **Status:** **Core.** Failure here is a major weakness.  
      *   **Knockout Power:** Eliminates simple **Truth Norm (TN: Assert p only if p is true)** and simple **Belief Norm (BN: Assert p only if you believe p)**, as both conditions are often met in lottery cases.

  2.  **The Moorean Absurdity Requirement:**  
      *   **What it must explain:** Why utterances like "It's raining, but I don't believe it is" or "p, but I don't know p" are profoundly defective and paradoxical-sounding, even when *p* is actually true.  
      *   **Motivating Case:** Moore's Paradox. The defect seems internal to the assertion itself, not necessarily its truth-value.  
      *   **Status:** **Core.**  
      *   **Knockout Power:** Strongly challenges **Truth Norm (TN)**, which sees no problem if p is true. Favours norms incorporating belief or knowledge. Suggests assertion constitutively represents the speaker as having a certain epistemic/mental state.

  3.  **The Retraction Requirement:**  
      *   **What it must explain:** Why the standard way to take back an assertion challenged on epistemic grounds is "Sorry, I shouldn't have said that – I didn't *know* it" (or similar), rather than *only* "Sorry, it turned out to be false." The retraction focuses on the speaker's *entitlement* to assert, not just the proposition's falsity.  
      *   **Motivating Case:** "I shouldn't have said that" apologies. We acknowledge a *wrong* in asserting, distinct from asserting falsely.  
      *   **Status:** **Core.** Points towards the norm being epistemic and speaker-focused.  
      *   **Knockout Power:** Severely damages **Truth Norm (TN)** and weaker norms. Strongly supports **Knowledge Norm (KN: Assert p only if you know p)** or justification-based norms over truth alone.

  4.  **The Lying as Paradigm Violation Requirement:**  
      *   **What it must explain:** Why asserting something you believe to be false (lying) is intuitively the *core*, *worst*, or *most direct* violation of the norm of assertion, rather than merely one infraction among others (like asserting an unknown truth). A norm should explain this primacy.  
      *   **Motivating Case:** The intuitive reprehensibility and conceptual centrality of lying to the idea of assertion's misuse.  
      *   **Status:** **Core.** Suggests belief is central to the norm.  
      *   **Knockout Power:** Weakens **Truth Norm (TN)** – lying violates TN only if the assertion is false, but the core wrong seems to be the insincere *act*. Favours norms incorporating belief (**KN**, **BN**) or sincerity. A norm that treats warranted false assertion as equally bad as lying seems flawed.

  5.  **The Constitutive/Regulative Distinction Requirement:**  
      *   **What it must explain:** Whether the proposed norm is *constitutive* (defining what assertion *is* – violating it means you didn't genuinely assert) or *regulative* (a standard we hold assertions to, which can be violated while still asserting). It must clarify the norm's relationship to the speech act itself.  
      *   **Motivating Case:** Philosophical debate about the nature of norms (e.g., rules of chess vs. moral rules).  
      *   **Status:** **Core for Evaluation.** An adequate theory must *take a position* on this and explain its implications (e.g., for retraction, propriety). Not having a clear stance is a weakness.

  ### Important But Potentially Negotiable/Contested Requirements
  6.  **The Selfless Assertion Requirement:**  
      *   **What it must explain:** Why assertions made without belief, but based on overwhelming evidence the speaker possesses (e.g., a depressed doctor asserting "You'll recover" to a patient based on clear medical evidence, despite her own debilitating pessimism), can seem *blameless* or even *proper*.  
      *   **Motivating Case:** Selfless Assertion cases (Lackey, 2007). Challenges the necessity of belief for proper assertion.  
      *   **Status:** **Highly Important, but potentially contestable scope.** Some argue these are rare or improperly characterised.  
      *   **Tension:** Creates a **major tension with the Lottery Requirement and the Belief Component**. Norms requiring belief (**KN**, **BN**) struggle to explain blamelessness here. Justification/Reasonableness norms (**JN/RBN: Assert p only if you are justified/have sufficient reason to believe p**) handle this well. **Core Conflict:** Satisfying Selfless Assertion comfortably (favouring **JN/RBN**) makes satisfying the Lottery Requirement harder (as high probability *is* justification), and vice versa (favouring **KN**).

  7.  **The Second-Hand Assertion Requirement:**  
      *   **What it must explain:** How the norm applies to assertions based *entirely* on testimony ("The Battle of Hastings was in 1066", "Water is H₂O"), where the asserter possesses no independent evidence or ability to verify the claim, only trust in the source/channel. The norm shouldn't make most historical/scientific discourse inherently improper.  
      *   **Motivating Case:** Ubiquity of testimony-based knowledge/assertion. Your seminar-mate's point.  
      *   **Status:** **Important Test, but Discriminatory Power Debated.**  
      *   **Analysis:** While **KN** seems to handle this neatly (you can assert if you *know* via testimony), **JN/RBN** *can* accommodate it by allowing testimonial justification/reasonableness. The challenge for strong **JN** is if it demands *personal, non-testimonial* justification, which *would* be problematic. Most **JN/RBN** proponents allow testimonial justification. **Verdict:** This requirement *is* discriminating against overly internalist/individualist versions of **JN**, but not against **JN/RBN** generally, nor is it a unique advantage for **KN**. It highlights that any norm must account for the epistemology of testimony.

  8.  **The Domain Invariance Requirement:**  
      *   **What it must explain:** Whether the same norm governs assertion *everywhere*, regardless of context (casual chat, courtroom testimony, scientific reporting, promises, estimates, declarations like customs), or whether different domains have different constitutive norms.  
      *   **Motivating Case:** Your examples (forecaster giving probabilities, customs officer, mate about bridge safety). Intuitions *might* vary about strictness.  
      *   **Status:** **Contested / Partisan.** Proponents of a single, robust norm (like **KN**) insist on invariance. Contextualists argue norms shift.  
      *   **Analysis:** A core requirement for theories aiming at *the* constitutive norm. Contextualist views reject this as a requirement. Your seminar-mate's point leans contextualist. **Key Tension:** Insisting on strict invariance (**KN**) might make it harder to smoothly explain all cases across domains (e.g., probabilistic forecasts might seem governed by a different standard than flat-out assertions). Allowing variance weakens the search for *the* fundamental norm. This is often where "camp preference" enters.

  9.  **The Action vs. Speaker Focus Requirement:**  
      *   **What it must explain:** Whether the norm primarily governs the *act* of asserting (making it "proper" or "improper") or the *speaker* (making them "blameworthy", "criticisable", or having "violated a rule").  
      *   **Motivating Case:** Distinctions in normative evaluations (e.g., a proper act by a blameless agent vs. a criticisable act). Relevant to retraction and blameless violations (like some interpretations of selfless assertion).  
      *   **Status:** **Important for Precision.** An adequate theory should be clear on this, though it might not decisively favour one norm over another.

  ### Key Tensions & The Major Conflict
  *   **The Central Tension:** **Selfless Assertion vs. Lottery Requirement.** This is arguably *the* biggest challenge. Norms that readily permit blameless selfless assertion (**JN/RBN**) often struggle to prohibit lottery assertions (as high probability provides justification/reasonableness). Norms that robustly prohibit lottery assertions (**KN**) typically condemn selfless assertions as improper (lacking belief/knowledge). *Resolving or explaining this tension is a major task for any theory.* Some **KN** proponents argue selfless assertions are improper but the speaker blameless due to non-epistemic reasons; some **JN/RBN** proponents argue lottery assertions *are* improper despite justification because they lack "assertoric commitment" or knowledge-like certainty.
  *   **Retraction + Lottery + Moore vs. Selfless:** **KN** scores highly on Retraction, Lottery, Moore, and Lying as Paradigm, but worst on Selfless. **JN/RBN** scores better on Selfless and potentially Testimony, but worse on Lottery and perhaps Retraction/Moore. **BN** fails Lottery and Retraction. **TN** fails almost everything except perhaps making lying a violation *if* the assertion is false.
  *   **Most Discriminating Single Requirement:** **The Lottery Requirement.** It's widely accepted as a core intuition, and it immediately eliminates weak norms like simple **TN** and **BN**. It creates the starkest contrast between **KN** (prohibits) and many **JN/RBN** formulations (often permit, or struggle to prohibit convincingly).

  ### Quick Scorecard of Major Norms vs. Requirements
  | Requirement               | Knowledge Norm (KN) | Truth Norm (TN) | Belief Norm (BN) | Justification/Reasonableness Norm (JN/RBN) |
  | :------------------------ | :------------------ | :-------------- | :--------------- | :----------------------------------------- |
  | **Lottery**               | ✅ (Prohibits)       | ❌ (Allows)      | ❌ (Allows)       | ⚠️ (Often Allows/Struggles to Prohibit)    |
  | **Moorean Absurdity**     | ✅                   | ❌               | ✅                | ⚠️ (May allow "p but I'm not justified")   |
  | **Retraction**            | ✅                   | ❌               | ❌                | ⚠️ (Focuses on justification, not knowledge) |
  | **Lying as Paradigm**     | ✅                   | ⚠️ (Only if false) | ✅                | ✅                                          |
  | **Selfless Assertion**    | ❌ (Improper)        | ?               | ❌ (Improper)     | ✅ (Blameless/Proper)                       |
  | **Second-Hand Assertion** | ✅ (Via Testimony)   | ✅ (If true)     | ✅ (If believed)  | ✅ (If testimonially justified/reasonable)  |
  | **Domain Invariance**     | ✅ (Insists on it)   | ✅               | ✅                | ✅ (Typically)                              |
  | **Constitutive Focus**    | ✅ (Often)           | ✅ (Often)       | ✅ (Often)        | ✅ (Often)                                  |

  **Legend:** ✅ = Typically Handles Well; ⚠️ = Handles with Difficulty/Controversy; ❌ = Typically Fails; ? = Unclear/Depends.

  ### Conclusion
  This list provides the "full spec" you requested, grounded in the key cases and distinctions. Remember:

  1.  **Core Non-Negotiables:** Lottery, Moorean, Retraction, Lying as Paradigm, requiring a stance on Constitutive/Regulative. Failing these is fatal for a norm aspiring to be *the* fundamental norm.
  2.  **Major Battlegrounds:** Selfless Assertion vs. Lottery forms the key tension. Second-Hand Assertion tests applicability but doesn't uniquely favour **KN**. Domain Invariance is a meta-requirement revealing theoretical commitment.
  3.  **KN's Strength & Weakness:** **KN** excels on the core cases *except* Selfless Assertion, where it faces its greatest challenge. **JN/RBN**'s strength is Selfless Assertion and flexibility, but its weakness is robustly handling Lottery and potentially Retraction/Moorean force. **TN** and **BN** are largely non-starters based on the core requirements.
  4.  **Your Plan is Sound:** Building your criteria first is excellent. Use this list to interrogate each paper: How does *this author* define the desiderata? How do they handle the core cases, especially the central tension? Do they address testimony and domain specificity clearly? Does their stance on constitutive vs. regulative help or hinder? Good luck with the seminar!
