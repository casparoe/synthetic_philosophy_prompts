answer: |-
  Here is a philosopher's specification for an adequate theory of self-deception, distilled from decades of debate. I've flagged tensions and scored major theories against non-negotiable demands.

  ### **Non-Negotiable Desiderata**  
  *(Must be satisfied by any adequate theory)*  
  1. **Extension Accuracy**  
     - Must INCLUDE:  
       - *Spouse ignoring obvious infidelity* (tests avoidance of painful truth)  
       - *Terminally ill patient denying prognosis* (tests conflict between belief/desire)  
       - *Academic blaming rejection on politics* (tests evidence distortion)  
     - Must EXCLUDE:  
       - Lying to others (no *self*-deception)  
       - Unmotivated error (e.g., misremembering a phone number; lacks *motivation*)  
       - Akratic belief (e.g., believing smoking harms while smoking; lacks *belief-fixing mechanism*)  
       - Ordinary wishful thinking (e.g., "I'll win the lottery"; lacks *sustained false belief*)  
     - *Why it matters:* Misclassifying collapses distinctions central to the phenomenon.  

  2. **Resolution of the Static Puzzle**  
     - Must explain how one avoids the "intentional suicide" paradox:  
       *If I intend to make myself believe false p, I must believe p is false—so how can I succeed?*  
     - Acceptable solutions: Explain away the paradox (e.g., no full-blown intention), resolve it (e.g., partitioning), or show it's illusory.  

  3. **Empirical Compatibility**  
     - Must align with robust findings:  
       - Confirmation bias, selective evidence-gathering, memory bias.  
     - But **cannot** equate self-deception with *all* motivated cognition (e.g., optimism bias).  

  4. **Distinction Preservation**  
     - Cannot collapse:  
       - Self-deception vs. other-deception (the *self* is both deceiver/deceived)  
       - Belief in p & belief in ¬p vs. ambivalence (true contradiction vs. uncertainty)  

  ### **Negotiable Desiderata (Camp-Dependent)**  
  5. **Intentionality Requirement**  
     - *Intentionalists* (Sartre, early Davidson): Must involve intention to deceive oneself.  
     - *Deflationists* (Mele): Reject intention as paradoxical; bias suffices.  
     - *Tension:* With Static Puzzle (2) and Psychological Plausibility (7).  

  6. **Dynamic Puzzle Solution**  
     - *Why doesn't the subject see through the bias?*  
     - Divided-mind theories: Information is quarantined.  
     - Deflationists: Bias operates below awareness.  
     - *Tension:* High demands may require speculative architecture.  

  7. **Psychological Plausibility**  
     - *Divided-mind camps*: Accept subpersonal modules/partitions.  
     *Deflationists*: Demand minimal, evidence-based cognition.  
     - *Non-negotiable core:* Cannot require Cartesian homunculi.  

  8. **Motivational Selectivity**  
     - Must explain why some desires (e.g., avoiding mortality) cause self-deception, while equally strong ones (e.g., craving coffee) don’t.  
     - *Risk:* Overextension if all motivated beliefs count.  

  9. **Normative Accountability**  
     - *Ethicists*: Must explain responsibility (e.g., "willful ignorance").  
     - *Naturalists*: Separate descriptive theory from blame.  

  ---

  ### **Suspected Tensions Between Desiderata**  
  - **Intentionality (5) + Static Puzzle (2) + Psychological Plausibility (7):**  
    Full-blooded intention to deceive oneself appears to require a knowing deceiver and an ignorant victim *in one mind*—psychologically implausible without partitioning. *Likely unsatisfiable together*.  
  - **Empirical Compatibility (3) + Extension Accuracy (1):**  
    If self-deception *just is* biased evidence-gathering, it may overinclude (e.g., optimistic investors). But excluding all bias loses core cases. *Balancing act required*.  
  - **Dynamic Puzzle (6) + Deflationism:**  
    Explaining *why the subject doesn’t notice* without partitioning may require ad-hoc cognitive constraints.  

  ---

  ### **Theory Scorecard**  
  *(✔ = Satisfies; ✘ = Fails; ~ = Partially/Controversially)*  

  | Desideratum               | Mele (Deflationist) | Davidson (Divided Mind) | "Avoidant Processing" (e.g., Bach) |
  |---------------------------|---------------------|--------------------------|------------------------------------|
  | 1. Extension Accuracy     | ✔                   | ~ (Overincludes partitions) | ✔                                  |
  | 2. Static Puzzle          | ✔ (Dissolves: no intention) | ✔ (Resolves: partitioning) | ✔ (Explains away: no belief-forming) |
  | 3. Empirical Compatibility | ✔                   | ✘ (Speculative modules) | ✔                                  |
  | 4. Distinction Preservation| ✔                   | ✘ (Risks dissociation)  | ✔                                  |
  | **5. Intentionality**       | ✘ (Rejects)         | ✔                        | ~ (Quasi-intentional avoidance)    |
  | **6. Dynamic Puzzle**       | ~ (Bias = stealthy) | ✔ (Quarantine)           | ✔ (Avoidance prevents insight)     |
  | **7. Psychological Plaus.** | ✔                   | ✘ (Over-partitioning)    | ✔                                  |
  | **8. Motivational Select.** | ✘ (Under-explains)  | ~                       | ✔ (Ties to deep needs)             |
  | **9. Normative Accountability**| ✘                  | ✔                        | ~                                  |

  **Key Takeaways**:  
  - No theory clears all desiderata without controversy, due to **intentionality-plausibility tension**.  
  - **Mele** fails motivational selectivity (8) and intentionality (5); excels in empirical grounding (3).  
  - **Davidson** solves puzzles (2,6) but violates psychological plausibility (7) and overextends partitions.  
  - **Avoidant Processing** (e.g., deliberately not investigating evidence) handles extension (1) and selectivity (8) well but blurs belief/not-believing (4).  

  **Recommendation for Your Paper**:  
  The irreconcilable tension between intentionality, static puzzle resolution, and psychological plausibility suggests **self-deception is not a unified phenomenon**. A successful theory may need to either:  
  - Reject intentionality as a folk-psychological illusion (Mele’s path), or  
  - Embrace modest partitioning (e.g., episodic vs. semantic memory systems), or  
  - Redefine the state as *doxastic discomfort relieved by avoidance* rather than full belief.  
  **Focus your critique on whether the intentionality demand (5) is a philoophical artifact or a core feature**. The terminally ill patient case is the litmus test.
