  The puzzles need careful handling. The static puzzle (intention paradox) seems non-negotiable - any theory must address it without logical absurdity. The dynamic puzzle (why the deception works) could potentially be explained by empirical psychology, but mustn't reduce to general cognitive biases.

  Regarding distinctions: collapsing self-deception/other-deception would be fatal. The hot/cold process distinction matters because some theories (e.g. intentionalist) require affective engagement while deflationists don't. This might be where conflicts arise.

  Motivational constraints are tricky. We need to explain why only certain desires cause self-deception without making the theory ad hoc. This interacts with the empirical constraint - psychological findings on confirmation bias can't be ignored, but shouldn't swallow the phenomenon whole.

  Normative issues might be separable. Responsibility attribution could be downstream of the core theory, though some ethicists might disagree.

  Now anticipating conflicts:
  - If we insist on intentionality (desideratum 2a) while requiring psychological plausibility (5), we might strain credulity about unconscious cognition. 
  - Demanding both static puzzle resolution (2) and empirical compatibility (5) could cause tension if psychological mechanisms undermine the "puzzle" status.
  - The motivational constraint (4) might clash with deflationary approaches if they can't explain desire selectivity.

  For the theories:
  Mele's deflationism handles empirical constraints well but struggles with intentionality puzzles. Davidson resolves paradoxes via partitioning but violates parsimony. The "deliberate avoidance" view is elegant but risks conflating not-believing with believing-falsely.

