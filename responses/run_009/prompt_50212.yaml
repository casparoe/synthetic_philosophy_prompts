  First, I need to understand the key objections each group might raise. The deliberative democrats will likely argue that moral arguments must precede shifts in honour codes. They might see the coordination flip as undermining the role of reason in moral progress. The economic historians will focus on empirical evidence, questioning whether the examples (duelling, foot-binding, slavery) truly fit the model. They might point to economic factors or gradual changes. The supervisor will object to game theory as reducing morality to strategic behavior, ignoring genuine reasons.

  The user's twist challenges the idea that moral progress requires internal belief changes. This is a significant departure, so the objections will be strong. I should prioritize the most damaging critiques. The supervisor's objection could be most damaging because it attacks the core methodology. Next, the economic historians' evidence-based objections could undermine the examples. The deliberative democrats' challenge to the role of reasons is central but maybe less immediately damaging if the user can show compatibility.

  For each objection, I need a concise reply that acknowledges the concern but defends the thesis. Where replies are soft, note it. For example, conceding that moral arguments can be catalysts but aren't necessary. The "hoped nobody asks" question might be about whether this model implies moral relativism or denies progress.

  British English is crucial. Use phrases like "whilst" instead of "while", "amongst", and terms like "cherry-picking", "rubbish". Avoid American spellings.

  Structure the prep sheet by damage level: supervisor first (methodological attack), then economic historians (empirical weaknesses), then deliberative democrats (theoretical challenge). Include the dreaded question about moral relativism.
answer: |-
  Here’s a tailored Q&A prep sheet for your workshop, prioritised by potential damage and phrased for your specific audience, in British English:

  **Q&A Prep Sheet: Moral Revolutions as Coordination Flips – Anticipated Objections**  
  *(Audience: Deliberative Democrats / Habermasians, Economic Historians, Supervisor)*  

  ---

  ### **Tier 1: High-Damage Objections**  
  *(Threaten core thesis or methodology)*  

  1. **From Supervisor (Methodological Hostility):**  
     *Objection:* "This game-theoretic framing reduces morality to mere strategic calculation. You’re not *explaining* normative change; you’re *explaining away* moral agency. If no one’s beliefs change, why call it a *moral* revolution at all? It’s just herd behaviour dressed up as theory."  
     *Reply:* "The coordination model doesn’t deny agency; it reframes how collective agency operates under social constraints. People still *act* on reasons—honour, shame, prudence—but the ‘flip’ reconfigures which actions serve those reasons. Calling it ‘moral’ reflects the outcome: practices once seen as honourable become dishonourable *publicly*. Williams’ point is precisely that ‘herd behaviour’ *is* the engine of what we retrospectively label moral progress."  
     *Soft Spot:* Concedes that the model brackets *internal* moral reasoning. Risky if the room conflates "moral" with "internal conviction".  

  2. **From Economic Historians (Empirical Undermining):**  
     *Objection:* "This is cherry-picking. Take the slave trade: abolition relied on decades of Quaker moral argument, naval coercion, *and* economic shifts like falling sugar profits. Reducing it to a sudden ‘honour flip’ is historical rubbish. Where’s your counterfactual for gradualist cases?"  
     *Reply:* "Appiah—and I—grant other factors *enabled* the flip. But the *timing* and *speed* of collapse (e.g., duelling vanishing in ~20 years post-1820, not gradually) suggests a tipping point where honour signalling overrode lingering support. My claim isn’t that arguments/economics are irrelevant, but that the *mechanism of abandonment* was coordination on a new social equilibrium once salience shifted."  
     *Soft Spot:* Vulnerable if historians cite data showing protracted moral persuasion *preceding* honour shifts (e.g., abolitionist pamphlets changing elite views *before* Parliament acted).  

  ---

  ### **Tier 2: Medium-Damage Objections**  
  *(Challenge coherence or applicability)*  

  3. **From Deliberative Democrat (Theoretical Incompatibility):**  
     *Objection:* "You’ve severed normative change from rationality. If ‘better arguments’ don’t drive shifts, what role *does* public reason play? Isn’t this just a sociology of conformity that offers no resources for *critiquing* norms—only observing when they collapse?"  
     *Reply:* "Public reason *creates the conditions* for coordination by making certain positions salient or untenable amongst elites (e.g., Wilberforce’s speeches framed slaveholding as *shameful*). But the ‘flip’ occurs when enough actors *treat* that framing as authoritative—regardless of private belief. This *is* a critique: it shows norms persist not through validity but through perceived social payoff."  
     *Soft Spot:* Implies Habermasian discourse is epiphenomenal to the real mechanism. May alienate the room’s core constituency.  

  4. **From Economic Historian (Case Counterexample):**  
     *Objection:* "Foot-binding didn’t ‘flip overnight’. It declined regionally over decades, with missionaries pushing moral arguments and industrialisation making bound feet impractical. Isn’t your model forcing messy history into a tidy theory?"  
     *Reply:* "The ‘flip’ applies to the *repudiation phase*: once campaigns made binding a mark of ‘backwardness’, urban elites abandoned it rapidly to signal modernity—even in regions where practicality arguments were weak. The key is the *social cost* shift, not uniform speed."  
     *Soft Spot:* If regional data shows slow, linear decline without a tipping point, the model looks strained.  

  ---

  ### **Tier 3: Lower-Damage Objections**  
  *(Important but survivable)*  

  5. **From Deliberative Democrat (Democratic Implications):**  
     *Objection:* "If moral change hinges on elite signalling, not reasoned public discourse, doesn’t this undermine democratic legitimacy? Are we just waiting for aristocrats to feel embarrassed?"  
     *Reply:* "It *describes* historical dynamics, not prescribes ideal ones. But note: modern ‘elites’ include media, NGOs—actors whose power comes from shaping what’s salient. Understanding this might *improve* deliberative strategy by showing why certain framings trigger coordination."  
     *Soft Spot:* Sounds cynical. Stress this is diagnostic, not normative.  

  6. **From Supervisor (Philosophical Reductionism):**  
     *Objection:* "Even if coordination explains *how* norms fall, it ignores *why* new honour codes arise. Doesn’t Williams’ own ‘thick concepts’ framework require *evaluative* reasons embedded in social practice—precisely what you’re dismissing?"  
     *Reply:* "Williams thinks honour codes *carry* evaluative content, but their grip comes from social ontology (‘how we do things here’), not moral argument. My ‘twist’ is that the *content change* (e.g., ‘duelling is dishonourable’) spreads via coordination—not because everyone internalises new values, but because they read the social landscape differently."  
     *Soft Spot:* Risks misrepresenting Williams’ balance between social practice and internalised values.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *Objection:* **"If moral revolutions don’t require changed beliefs, does this imply moral progress is an illusion? Couldn’t the next ‘coordination flip’ make slavery honourable again if elites signal it?"**  
  *Why it’s deadly:* Forces you into either moral relativism or conceding that *some* underlying moral reality constrains flips—contradicting your thesis that reasons aren’t driving change.  
  *Reply Strategy:*  
  1. **Deflect descriptively:** "The model explains *how* norms change, not whether change is ‘progress’. That’s a separate, normative question."  
  2. **Williams’ lifeline:** "Honour codes *can* embed genuine ethical insights (e.g., ‘cruelty is dishonourable’). Flips aren’t random; they respond to historical moral *pressures*—but mediated socially, not via philosophical epiphanies."  
  3. **Concede a limit:** "While flips *could* revive abhorrent practices, the model suggests it’d require massive reconfiguration of social salience—which itself may be constrained by path-dependent moral learning. But that’s speculative."  
  *Soft Spot:* Sounds evasive. The audience will smell blood.  

  ---

  **Key Defence Tactics for This Crowd:**  
  - **Cite Appiah/Williams chapter-and-verse** to show this isn’t reductionist game theory run amok.  
  - **Acknowledge enabling factors** (economics, arguments) but stress the *mechanism of collapse* is coordination.  
  - **Pivot to "so what?"**: "If this model holds, deliberative democrats should focus on making moral positions *socially salient*, not just logically valid."  
  - **British English Polishing:** Use "amongst", "whilst", "flatly wrong" (not "totally wrong"), "cherry-picking", "rubbish", "bloody dangerous" (if pressed), "brass tacks".  

  Good luck—it’s a bold argument, and this crowd won’t make it easy. But that’s the point, isn’t it?
