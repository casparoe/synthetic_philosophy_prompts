answer: |-
  Here’s your Q&A prep sheet, tailored for *this* audience. I’ve prioritized objections based on their potential to undermine core Kantian commitments or exploit metaphysical vulnerabilities. The "pray nobody asks" question is #8. I’ll address your contract worry at the end honestly.

  **Core Vulnerability:** Kantians tie moral agency, autonomy, and obligation to *numerical identity across time as a necessary condition*. Your "connectedness degrees" sound like *qualitative similarity*, which they’ll see as dissolving the moral subject. The metaphysician will attack the reductionism itself.

  ---

  ### **Q&A Prep Sheet: Top 8 Objections (Ordered by Damage Potential)**

  1.  **Objection (Kantian - Autonomy/Respect):**  
      *"If survival is just degrees of psychological connectedness, you've erased the *identical rational agent* who is the subject of respect (Kant's *Formula of Humanity*). How can I owe *any* obligation to a future 'me' who is merely psychologically *similar*? Doesn't this reduce persons to replaceable bundles of states, violating the requirement that persons are ends-in-themselves?"*  
      **Reply (2-min):** "The obligation isn't owed *to* a numerically identical entity, but *in virtue of* the specific, causally connected psychological states that constitute the subject of concern *now*. Respect is owed to the perspective *currently* bearing the relevant psychological connections (e.g., anticipation, memory). The *degree* of obligation scales with the *degree* to which the current perspective is psychologically connected to the past/future act or experience. This preserves the *substance* of respect – valuing the rational perspective – without requiring an unchanging metaphysical substrate. It’s the continuity of the *rational perspective*, not its numerical identity, grounding duties."  
      **Soft Spot:** Admits obligations aren't "owed to the *same* self," which sounds like abandoning Kant's core premise. Requires accepting a "perspective-based" ethic, which may feel revisionary.

  2.  **Objection (Kantian - Promise-Keeping/Obligation):**  
      *"Promising fundamentally requires diachronic identity! When I make a promise, I bind *myself* – the identical *I* – to a future act. Your 'connectedness successor' isn't *me*. Why should *they* feel bound by *my* promise? Your fission contract case seems to presuppose the original agent's authority to bind successors – doesn't that *rely* on identity at the moment of promising?"*  
      **Reply (2-min):** "The obligation arises from the *intentional act of commitment* undertaken by the original agent *in anticipation of* the connected successors carrying it out. The successors inherit the obligation *because* they are psychologically continuous with the promiser and recognize the commitment *as their own* (due to memory/endorsement). The contract case shows the *original* agent can structure obligations for successors *based on anticipated connectedness*. It's the *network of commitments and psychological links*, not identity, that binds. Identity isn't doing secret work; the *act of commitment* and its psychological legacy is."  
      **Soft Spot:** Forces you to ground obligation in the *past act* + *causal/psychological legacy*, not the enduring self. Kantians want the *self* to be the enduring binder. The "authority at t1" point is sharp.

  3.  **Objection (Metaphysician - The "Deep Further Fact"):**  
      *"Your entire argument presupposes reductionism. You dismiss the 'further fact' as doing no work. But it does the *essential* work: it constitutes the *unity of consciousness* and *ownership* of experiences/memories! Degraded memories in your transporter? That's just a fading *representation*. The *fact* of whether it's still *me* experiencing it or just a similar entity is binary and deep. Connectedness tracks similarity, not existence."*  
      **Reply (2-min):** "I argue the 'further fact' is explanatorily redundant. All the practical concerns – anticipation, memory, responsibility, compensation – are fully determined by the degree and nature of psychological connections. What practical difference *could* the further fact make? If two beings are psychologically identical to me in all relevant connections, insisting one 'is me' and the other 'isn't' adds nothing to what we *care* about or what obligations exist. Unity of consciousness is *constituted* by robust psychological connections, not a separate metaphysical glue."  
      **Soft Spot:** Requires outright denial of a plausible intuition (the "me-ness" feeling). Sounds dismissive to non-reductionists. Doesn't *prove* the further fact doesn't exist, just claims it's irrelevant.

  4.  **Objection (Kantian - Retroactive Responsibility/Punishment):**  
      *"Punishment presupposes the punished *is identical to* the offender. If the punished entity is merely *connected* to the offender, punishment becomes vicarious – punishing one person for another's crime! Degrees of connectedness might mitigate punishment, but without strict identity, the *desert* basis vanishes. How is this not a fundamental injustice?"*  
      **Reply (2-min):"Desert can be grounded in the *current* entity's psychological connection to the crime. If they vividly remember committing it, feel guilt, possess the same character traits, then *they* are an appropriate subject of blame/punishment proportional to that connection. It's not vicarious; it's holding *this* entity responsible for the act *they* are psychologically continuous with. Weak connection (e.g., amnesia, radical character change) *should* mitigate or eliminate desert – which aligns with intuitions about brainwashing or dementia."  
      **Soft Spot:** Challenges the core intuition that "I did it" requires numerical identity. Mitigation based on connection might be accepted, but *full* responsibility without identity is a hard sell for desert.

  5.  **Objection (Kantian - The "Unity of Apperception" Challenge):**  
      *"Kant showed that the very possibility of experience requires the transcendental unity of apperception – the 'I think' that must *potentially* accompany all my representations. This 'I' is presupposed as numerically identical. Doesn't your psychological connectedness view, especially with degradation/fission, undermine the very possibility of a unified subject of experience, thereby undermining rational agency itself?"*  
      **Reply (2-min):"Kant's point is about the *formal* requirement for experience *at a time*. It doesn't entail *diachronic numerical identity*. A stream of consciousness unified *at each moment* by psychological connections (memory, anticipation, narrative sense of self) is sufficient for agency *at that time*. The transporter/fission cases show this unity can persist, weaken, or branch *over time* without needing a single, unchanging substratum. The 'I' of apperception is the *current* organizing principle of experience, not a persisting entity."  
      **Soft Spot:** Forces a debate on interpreting Kant's transcendental argument. Many Kantians *do* see it as requiring diachronic identity. Requires separating synchronic unity from diachronic identity.

  6.  **Objection (General Kantian - Moral Mathematics):**  
      *"Your view makes morality path-dependent and potentially intractable. If obligations/responsibility are scalar based on connectedness, how do we *calculate* what is owed in complex cases (e.g., long time lags, gradual drift)? Doesn't this undermine the universality and categorical nature of moral demands, replacing them with vague, contingent degrees?"*  
      **Reply (2-min):"While calculation is complex, this reflects reality better than the false precision of 'identity/non-identity.' We *already* handle degrees in law/ethics (diminished capacity, statutes of limitations). The core principles (keep promises, don't harm, compensate wrongs) remain categorical; their *application* and *strength* depend on the specific psychological connections involved. Universality applies to the *types* of relations (e.g., 'highly connected successors inherit strong obligations'), not to ignoring connection degrees."  
      **Soft Spot:** Admits practical complexity and a degree of contingency, which Kantians dislike. Requires defending scalar morality.

  7.  **Objection (Metaphysician/Kantian - Fission & Debt Division Cheating):**  
      *"Your fission contract case is incoherent. How can the pre-fission person 'divvy up' debts *unless* they are assuming authority over distinct future persons? But if fission creates two *new* persons (as you imply, since identity isn't preserved), the original lacks standing to bind them. If they *do* have that standing, it's because the successors *are* them in some relevant sense – smuggling identity back in! Isn't the contract just *pretending* identity exists?"*  
      **Reply (2-min):"The pre-fission person doesn't bind *wholly distinct* persons. They bind the specific, causally continuous psychological streams *emerging* from them. The successors are psychologically continuous with the original *and* recognize the agreement (due to memory/endorsement). The authority comes from the original's privileged position in *creating* these connected successors and their anticipation. It's a *first-person* planning of obligations for one's *own* future branches, grounded in the continuity of the psychological project, not identity. The contract is an *expression* of this continuity, not a substitute for identity."  
      **Soft Spot:** This is the hardest sell. It *does* lean heavily on the original's unique causal role and the successors' psychological inheritance, which *feels* identity-like. Successors "recognizing" the debt is crucial but contestable.

  8.  **The "Pray Nobody Asks" Objection (Kantian - The Annihilation Problem):**  
      *"Suppose your transporter degrades connectedness to near-zero. According to you, no one is punished, no promise binds, no compensation is owed *to that resulting entity* for past harms done *to the original*. But if strict identity is false, the original *isn't survived* at all – they are annihilated. How is this not a license for abuse? Couldn't I 'annihilate' myself via memory wipe to escape debts, or 'annihilate' someone else via a perfect memory-erasing harm, with *no one* left to hold responsible or compensate? Doesn't this utterly destroy the moral framework?"*  
      **Reply (2-min):"First, near-zero connectedness is functionally equivalent to death/non-existence of the original *as a subject of concern*. We *do* treat death as ending obligations *to* the deceased and eliminating their future-directed responsibilities (though estates handle debts). Second, intentionally causing such degradation *is* a profound harm *to the original person at the time* – it destroys their future psychological prospects. We punish *that act of harm* severely. The framework doesn't license escape; it recognizes that radical discontinuity *is* a form of cessation for which the *act* causing it bears full responsibility."  
      **Soft Spot:** **This is devastating if pressed.** It forces you to admit that on your view, radical discontinuity *extinguishes* the subject of obligations in a way identity theorists avoid. Defending the *act* of causing discontinuity as the primary wrong feels insufficient for retrospective duties like compensation owed *to the victim*. This exposes the most revisionary consequence.

  ---

  **Your Contract Case Worry (Straight Talk):**  
  Yes, there's a real risk the contract case is smuggling in a functional equivalent of identity under the guise of "original authority + successor recognition." The Kantian will see the original's act of "divvying up" as *exercising an identity-based authority over its future*. The metaphysician will see the successors "recognizing" the debt as relying on the *illusion* of identity or a deeper fact of inheritance. **Your reply (#7) is your best shot, but it's the softest core argument.** Emphasize it's about *first-personal planning across anticipated psychological branching* based on connectedness, not a metaphysical claim. Acknowledge it *looks* identity-like but argue that's because robust connectedness *serves the same practical function* without the metaphysical baggage. However, **be prepared for this to be the focal point of the toughest criticism.** Have your fission diagram clear and stress the *continuity of the psychological project* as the binding element, not identity.

  **Overall Strategy:** Focus on how connectedness *preserves the practical core* of moral concerns without needing a metaphysically dubious identical self. Acknowledge the revisionary aspects honestly but argue they better fit psychological reality. For Kantians, constantly link back to *rational agency/perspective* at a time being the true locus of moral concern, not identity over time. For the metaphysician, keep hammering the explanatory redundancy of the "further fact." Good luck – this is a tough room, but knowing these pressure points is half the battle.
