prompt: |-
  I'm a PhD student in philosophy of law, and I'd like help unpacking a puzzle about the idea/expression dichotomy in copyright. Copyright protects the expression of a work but, in principle, never its underlying ideas; courts implement this through doctrines like merger, under which expression loses protection when there are only a few practical ways to express an idea, and scènes à faire, under which stock elements conventional to a genre are treated as unownable, and in infringement cases judges compare works at successively more abstract levels of description, protecting the plot at a fairly abstract level while refusing protection to a one-line premise. The practice thus seems to presuppose a substantive theory of what an idea is and how ideas are individuated — one on which ideas come already carved into levels of abstraction, with a natural cutoff somewhere between the free premise and the owned plot — and yet the same judges insist that ideas as such are simply not a proper subject of property. What exactly does the practice presuppose here, which rival theories of idea individuation would quietly rule it out, and where is it philosophically underdetermined, such that several different theories would license the same doctrinal results? Please answer as a numbered list of exactly five points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a PhD student in philosophy of law asking about the idea/expression dichotomy in copyright. They're specifically puzzled about how courts handle this through doctrines like merger and scènes à faire, while also insisting that ideas themselves aren't property. They want to know what philosophical presuppositions underlie this practice, which rival theories would challenge it, and where it's underdetermined.

  I need to break this down. The user mentions that courts seem to have a substantive theory of what ideas are and how they're individuated - with natural levels of abstraction and a cutoff point between unprotectable premise and protectable plot. But judges simultaneously say ideas can't be owned. This creates a tension.

  First, I should identify what the practice presupposes. The courts appear to assume that ideas have inherent hierarchical structures, with layers of abstraction that can be identified objectively. They also seem to think there's a natural boundary where expression begins. This suggests a realist view of ideas - that they exist independently of human cognition with fixed boundaries.

  Then I need to consider rival theories that would challenge this. If someone held an eliminativist view that ideas don't really exist as distinct entities, or a radically conventionalist view where ideas are entirely socially constructed without objective boundaries, that would undermine the court's approach. Similarly, if ideas were seen as infinitely decomposable without natural joints, the abstraction levels courts use wouldn't make sense.

  For underdetermination, I should note where multiple theories could lead to similar outcomes. For example, both a moderate conventionalism and a moderate realism might agree on where to draw lines in practice, even if their philosophical justifications differ. Similarly, different theories of mental content could converge on the same expressions being protectable.

  I also need to address the cutoff point between idea and expression. The practice assumes there's a principled stopping point in the abstraction process, but this could be explained by various theories - like cognitive constraints or functional necessity - not just the court's implicit realism.

  Finally, I should consider how courts treat stock elements through scènes à faire. Their approach relies on recognizing conventionality, which could be justified by different theories of genre or social practice.

  I'll structure this as exactly five numbered points without introduction or conclusion, keeping each to one or two sentences as requested. The points will cover: the hierarchical structure presupposition, rival theories challenging objectivity, underdetermination in abstraction levels, the cutoff point, and conventional elements.
answer: |-
  Here are five points addressing your query:

  1.  The practice presupposes that ideas possess an objective, hierarchical structure with identifiable levels of abstraction (e.g., premise, plot outline, detailed plot), allowing courts to isolate distinct layers for comparison.
  2.  Rival theories like eliminativism (denying ideas exist as discrete entities) or radical conventionalism (viewing idea boundaries as entirely arbitrary social constructs) would fundamentally challenge the objectivity and naturalness assumed in this hierarchical individuation.
  3.  The specific level deemed "expression" (e.g., protecting a detailed plot but not a one-line premise) is underdetermined; both realist theories (ideas have intrinsic structure) and moderate conventionalist theories (structure emerges from shared practice) could license finding protectable expression at that same practical level.
  4.  The practice presupposes a natural or principled cutoff point where abstraction must stop to avoid protecting the idea itself; this cutoff could be explained by various theories (e.g., cognitive constraints, functional necessity) beyond the court's implicit realism.
  5.  Treating *scènes à faire* as unprotectable presupposes that "idea" includes conventional elements arising from genre necessities or common practice, a categorization compatible with different theories of genre conventions or social ontology.
