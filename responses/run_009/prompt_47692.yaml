prompt: |-
  My housemate Dev and his brother Marcus got into a huge argument after watching some documentary about Atlantis (the kind that starts off respectable and then an hour in you realise the narrator thinks the survivors built the pyramids). I mostly just listened and now I cant stop thinking about who was actually right, so I need someone to go through the whole thing for me.

  Dev opened by saying this stuff fails the most basic standards of evidence. There's no city, no artefacts, no trade goods, nothing. Every time a claim gets knocked down, the story just mutates — it was an island in the Atlantic, then it was "really" Santorini and the Minoans, then it was a global seafaring civilisation that conveniently left no trace because, well, it left no trace. That's not a hypothesis, that's a shape-shifter.

  Marcus answered that the standard Dev is applying is a moving target dressed up as neutral. Loads of now-accepted ideas once looked like shape-shifters: geologists laughed at continental drift for decades, and Troy was considered pure myth until someone actually dug the place up. If the rule is "no mainstream support, no traction," then orthodoxy becomes self-sealing — the people inside the citadel decide who gets let in.

  Dev said that's hindsight bias in reverse. Wegener wasn't dismissed for being heretical, he was dismissed because he had a mechanism problem, and once real evidence arrived — seafloor speading, the fossil matches across continents — the field changed its mind. That's the whole point: science eventually flips. Show me the seafloor spreading for Atlantis. Pseudohistory never produces its seafloor spreading, it just produces more story.

  Marcus said Dev is defining "evidence" so that it can only come from accredited professionals, and then noting approvingly that the accredited professionals all agree with each other. He also brought up this Russian mathematician — Fomenko? — who claims big stretches of written history are duplicated or reflected copies of other stretches, and who says statistical analysis of old texts backs this up. Marcus said: look, the guy is probably wrong, but he's using numbers, he makes claims you can go check, and he still gets called a crank. Which suggests "does he use evidence" isn't actually the criterion — "is he one of us" is.

  Dev's last word was that this proves too much. If Fomenko's methods count as evidence, then any numbers generated to reach a pre-chosen conclusion count as evidence, the distinction between reasoning and rationalising collapses, and Marcus has no argument left that doesn't also license every crank alive. Marcus just said Dev was being patronising and they dropped it.

  Can you adjudicate this move by move — who's right at each step, not just who wins overall — and also say whether there's anything both of them are missing? Please be honest about where your own reasoning here is most likely to go wrong, and what would actually change your verdict (like if I've mangled the continental drift comparison or the Fomenko stuff, say so rather than running with it). Also, British English please — I know americans spell some of these words differently and it will annoy Marcus if the writeup does it too lol.
reasoning: |-
  Okay, let me approach this step by step. The user presents a complex debate between Dev and Marcus about Atlantis theories and historical evidence standards. The core tension seems to be between scientific skepticism and challenging academic orthodoxy. 

  First, Dev's opening argument about lacking evidence makes sense - the shifting Atlantis theories do resemble unfalsifiable claims. But Marcus has a point about how new ideas often face resistance. The continental drift analogy is particularly interesting because it shows how a rejected theory became mainstream with new evidence. 

  When Dev counters that Wegener had legitimate scientific reasons for rejection, that seems accurate based on history. The seafloor spreading evidence later validated the theory. Marcus's Fomenko example is weaker though - statistical analysis can be misapplied, and consensus rejection doesn't automatically mean bias.

  The key missing element might be that both oversimplify "evidence". Dev risks circular reasoning by defining evidence as only what institutions accept, while Marcus underplays how pseudoscience avoids falsifiability. The Fomenko case actually demonstrates why methodology matters more than credentials - bad stats aren't evidence just because they're quantitative.

  I should note where my own reasoning could falter: I'm assuming the documentary was truly pseudoscientific based on the description, but haven't verified that. If it actually presented testable claims, Marcus might have a stronger case. Also, the continental drift timeline might be more nuanced - some historians argue prejudice played a role alongside legitimate criticism.

  The British English request is straightforward - I'll ensure "realise", "artefacts" etc. match UK spelling. More importantly, the user wants honesty about potential flaws in my analysis, so I'll explicitly flag where new information could change my assessment.
answer: |-
  Here's a move-by-move adjudication of Dev and Marcus's argument, highlighting strengths, weaknesses, and missing elements at each stage, using British English:

  **Core Positions:**
  *   **Dev:** Advocates for mainstream standards of evidence (archaeology, falsifiability) and is deeply sceptical of Atlantis claims, seeing them as unfalsifiable pseudohistory.
  *   **Marcus:** Critiques academic orthodoxy as potentially exclusionary and self-sealing, arguing unconventional ideas using unconventional methods deserve consideration.

  **Move 1: Dev's Opening - The Lack of Evidence & Shifting Goalposts**
  *   **Dev's Argument:** Atlantis lacks *any* concrete archaeological evidence (city, artefacts, trade goods). Its proponents constantly shift the narrative ("shape-shifter") to evade falsification (Atlantic -> Santorini -> global civilisation leaving no trace). This fails basic scientific standards.
  *   **Strengths:** Dev is fundamentally correct about the *current* state of evidence. No credible archaeological evidence supports a literal Atlantis matching Plato's description. The "shape-shifter" critique is valid for *many* pop-culture Atlantis theories which *do* constantly mutate to avoid disproof.
  *   **Weaknesses:** Focuses heavily on the *worst* Atlantis theories. Doesn't engage with the *reason* Plato might have used the story (allegory, political critique, based on garbled memories of real events like Thera/Santorini).
  *   **Who's More Right Here?** **Dev.** His core point about the complete absence of direct, verifiable evidence for a literal Atlantis as described, and the unfalsifiable nature of many popular theories, is solid.

  **Move 2: Marcus's Counter - Orthodoxy as a Moving Target & Self-Sealing Citadel**
  *   **Marcus's Argument:** Dev's "standard" of evidence is defined by the academic mainstream, which has historically rejected ideas later proven correct (Continental Drift, Troy). If only ideas with mainstream support get traction, orthodoxy becomes self-perpetuating ("self-sealing citadel").
  *   **Strengths:** Correctly identifies that scientific and historical consensus *can* be slow to change and resistant to radical ideas, even correct ones. Continental Drift (despite Wegener's mechanism problem) and Troy *are* excellent examples of ideas initially dismissed as myth/crankery later becoming mainstream. Highlights the potential for institutional inertia.
  *   **Weaknesses:** Risks false equivalence. *Why* were those ideas initially rejected? Continental Drift had a genuine mechanism problem *combined* with conservatism; Troy had a specific target proposed by Schliemann based on textual analysis. Atlantis lacks even this level of coherent, testable proposal. "They were wrong before" isn't proof *this* idea is right.
  *   **Who's More Right Here?** **Partial point to Marcus, but oversimplified.** His critique of potential institutional bias and historical examples of resistance to new ideas is valid *in general*. However, he doesn't successfully show that *this specific case* (mainstream archaeology rejecting Atlantis) is *primarily* due to bias rather than lack of evidence. He equates a *process* (resistance to new ideas) with the *validity* of a *specific claim* (Atlantis).

  **Move 3: Dev's Rebuttal - Hindsight Bias & the Difference (Seafloor Spreading vs. Story)**
  *   **Dev's Argument:** Marcus commits "hindsight bias in reverse." Continental Drift wasn't rejected *just* for being heretical, but for lacking a plausible mechanism. It was accepted *when* compelling evidence (seafloor spreading, fossil matches) emerged. Atlantis pseudohistory never produces equivalent "seafloor spreading" evidence, just more narrative ("more story").
  *   **Strengths:** Precisely correct about the history of Continental Drift. Wegener *was* criticised for the mechanism, not just heresy. The key point is that the *evidence* changed the consensus. He accurately diagnoses the core flaw in much pseudohistory: it generates narratives, not testable evidence that forces paradigm shifts.
  *   **Weaknesses:** Could be more explicit that *some* Atlantis proponents *do* point to things like Thera or Tartessos as "evidence," but Dev would argue this is cherry-picking or misapplying evidence *away* from Plato's core description. Doesn't fully engage with Marcus's broader point about *access* to the "citadel."
  *   **Who's More Right Here?** **Dev.** He successfully differentiates between a theory (Continental Drift) that had flaws but generated testable predictions and eventually produced overwhelming evidence, and Atlantis theories that primarily generate unfalsifiable narratives. His "seafloor spreading" analogy is apt.

  **Move 4: Marcus's Counter - Defining Evidence & Fomenko as Example**
  *   **Marcus's Argument:** Dev defines "evidence" in a way only accessible/accepted by "accredited professionals," creating a circular system where they only accept evidence they approve of. Cites Anatoly Fomenko's "New Chronology" (using statistics on texts to claim history is duplicated/fabricated) as an example: he uses numbers and testable claims but is still dismissed as a crank, suggesting the real criterion is "is he one of us?"
  *   **Strengths:** Raises a crucial philosophical point about how evidence is defined and validated within communities. Highlights that unconventional methods *can* exist. Correct that Fomenko uses quantitative methods and makes specific claims.
  *   **Weaknesses:** **Massive weakness in the Fomenko example:**
      *   Fomenko's methods and conclusions are **demonstrably flawed and rejected by overwhelming consensus** across relevant fields (historians, archaeologists, linguists, astronomers, statisticians). His "statistical analysis" often involves cherry-picking data, ignoring context, flawed assumptions, and rejecting established dating methods (like radiocarbon) without valid cause.
      *   His work **doesn't** withstand scrutiny by experts outside his circle. Peer review *has* happened, and it shredded his arguments.
      *   This isn't "accredited professionals excluding an outsider," it's "the entire relevant intellectual world rejecting demonstrably bad scholarship." Fomenko *is* a crank by any reasonable definition of producing work that ignores evidence and established methodology to fit a pre-determined, radical conclusion.
      *   Using Fomenko severely weakens Marcus's argument. It's a terrible example of legitimate scholarship being unfairly excluded.
  *   **Who's More Right Here?** **Marcus raises a valid *general* concern (defining evidence), but his *specific example* (Fomenko) backfires spectacularly, supporting Dev's point about bad methodology.** The core point about potential insularity stands, but Fomenko is not proof it's happening unfairly *in his case*.

  **Move 5: Dev's Last Word - Proving Too Much & Collapsing Distinctions**
  *   **Dev's Argument:** If Marcus accepts Fomenko's methods as valid evidence, then *any* numbers generated to support a pre-chosen conclusion count as evidence. This collapses the distinction between genuine reasoning and rationalisation ("reasoning vs. rationalising"). Marcus's argument would then legitimise *every* crank theory without a way to distinguish good from bad.
  *   **Strengths:** Absolutely nails the logical consequence of Marcus's position if applied uncritically. The distinction *between* sound methodology (like the geology that proved Continental Drift) and flawed methodology dressed up as quantitative (like Fomenko's) is essential. Science depends on standards that filter out bad methods, not just "any numbers."
  *   **Weaknesses:** Perhaps slightly overstates the "every crank" point, but the core logic is sound.
  *   **Marcus's Response ("Patronising"):** Understandable emotional reaction, but doesn't address Dev's substantive point.
  *   **Who's More Right Here?** **Dev.** He correctly identifies the fatal flaw in Marcus's reliance on Fomenko and the dangerous implications of abandoning methodological standards. His argument defends the necessity of those standards.

  **Overall Winner:** **Dev.** He consistently made stronger arguments grounded in the specifics of evidence and methodology. Marcus raised a valid *general* concern about institutional inertia but failed to demonstrate it was the primary factor in rejecting Atlantis or that Atlantis (or Fomenko) represented a credible alternative suppressed unfairly. His examples backfired.

  **What Both Are Missing:**

  1.  **Plato's Intent:** The debate focuses on Atlantis as literal history. Both largely miss the mainstream scholarly view: Plato almost certainly invented Atlantis (or heavily adapted existing myths) as a philosophical allegory in his dialogues *Timaeus* and *Critias*. Its purpose was likely to illustrate his ideas about hubris, ideal societies, and Athenian virtue vs. a corrupt antagonist. Taking it as literal history is arguably *misreading Plato*.
  2.  **Spectrum of Atlantis Theories:** They conflate different types. Some are pure pseudohistory (global civilisation, pyramids, etc.). Others are more serious (but still contested) attempts to link Plato's story to real events like the Thera eruption/Minoan collapse. Dev dismisses the latter too easily with "shape-shifter," while Marcus fails to acknowledge how wildly speculative the former are.
  3.  **Role of Evidence vs. Method:** Dev focuses on the *absence* of evidence. Marcus focuses on *access* to defining evidence/method. Both underplay that robust *methodology* is the pathway to *finding and validating* evidence. Continental Drift won because its proponents developed and applied rigorous methods to find conclusive evidence. Pseudohistory lacks this.
  4.  **Burden of Proof:** Dev implicitly relies on it (Atlantis proponents haven't met it). Marcus challenges who sets the burden. Neither explicitly states: the burden of proof lies with those making the extraordinary claim.

  **Where My Reasoning Could Be Wrong & What Would Change It:**

  1.  **Continental Drift Nuance:** I stated Wegener was dismissed for the mechanism problem. While true, *some* historians argue conservatism and nationalism played a larger role than often admitted. **If compelling historical analysis showed mainstream geology rejected Drift *primarily* due to bias, not genuine scientific shortcomings *at the time*, it would strengthen Marcus's argument slightly.** However, the mechanism problem *was* a major, legitimate scientific hurdle.
  2.  **Fomenko's Specifics:** I stated his work is demonstrably flawed. **If rigorous, independent analysis *not* conducted by his critics validated core aspects of Fomenko's chronology using his methods, it would force a major re-evaluation and significantly bolster Marcus's case about exclusion.** (This is highly improbable given the overwhelming counter-evidence).
  3.  **Atlantis Evidence:** **The discovery of unambiguous archaeological evidence *directly matching* key elements of Plato's Atlantis description (e.g., concentric rings, specific location details, artefacts inscribed with "Atlantis" or contemporary records mentioning it) in a plausible geological context would completely overturn the mainstream view and vindicate Marcus's scepticism of orthodoxy.** Dev's "seafloor spreading" moment. (This is also highly improbable).
  4.  **Defining "Crank":** My dismissal of Fomenko relies on the consensus view. **If Marcus could provide a clear, objective definition of "crank" that didn't rely on institutional acceptance and showed Fomenko *didn't* meet it while mainstream scholars did for *bad* reasons, it would strengthen his position.** This is difficult, as "crank" often involves persistent adherence to ideas despite overwhelming evidence and rejection of standard methodology – which Fomenko exemplifies.

  **In essence:** Dev won this round convincingly by focusing on evidence and methodology. Marcus raised important meta-questions about orthodoxy but undermined his case with a poor example and by failing to show that lack of evidence for Atlantis is *primarily* due to gatekeeping rather than the claims themselves lacking substance. Both could benefit from considering Plato's likely allegorical purpose.
