prompt: |-
  For years I've treated foreign-policy judgments as forecasts: I read the rationalist blogs back when they were still arguing about Bayes on Overcoming Bias, I've absorbed the LessWrong habit of separating decision quality from outcome quality, and I've read enough Tetlock to be suspicious of my own hindsight. And yet when I line up my actual verdicts on humanitarian interventions, they refuse to cohere, and I'd like you to force coherence on them — committedly, not by laying out options.

  My honest verdicts, case by case:

  - Rwanda, 1994: our refusal to intervene was one of the great crimes of the last century, and I hold with high confidence that a modest force without a perfect plan would have saved most of the victims.
  - Sierra Leone, 2000: a small British deployment, invited by the sitting government, broke the rebellion in weeks. Clearly right; it doesn't even feel like a hard case.
  - Kosovo, 1999: bombing without Security Council authorization, and I still think it was justified. The ethnic cleansing was ongoing, and authorization was never coming, since Russia would veto. I've never much cared that it was technically illegal.
  - Iraq, 2003: not justified — but I'm not sure why, and I distrust my own reasons. The humanitarian record was real; what bothers me is the pretext, the absence of any plan for the day after, and the fact that the humanitarian case came from people who would never have made it without the WMD story.
  - Libya, 2011: here I lose the thread. Resolution 1973 authorized protecting civilians, and I think the initial protection was right. But NATO slid into regime change and the country came apart into a decade of civil war. I oscillate between "the intervention was right and the execution betrayed it" and "the execution was predictable, so it was wrong at the gate," and my verdict literally changes depending on whether I evaluate ex ante or ex post — which is exactly the failure mode the Sequences warn about.
  - Syria: I believe the retreat from the "red line" in 2013 was a genuine moral failure, and I despise the sophistry that was deployed to excuse it. With equal confidence I believe a no-fly zone would probably have become another Libya. I hold both and cannot make them stop contradicting.

  I do have a tentative principle: intervene when there is ongoing mass killing, when the intervener's aims are narrow and it has a plausible story for the day after, and — the clause I care most about — when the intervener would still accept the intervention if it fails in the median way that interventions of its reference class fail. But I don't trust it. It smells like something I engineered to save my Kosovo verdict and my Iraq verdict simultaneously, and I can't tell whether that's a feature or a bug.

  What I want is a definite position, especially on Libya and Syria — not a survey of what "one might" conclude, and no appeals to ambiguity. Please organize the answer under these headings, in this order:

  1. "The principle, stated" — the principle you actually endorse, in one or two precise sentences, and whether it's mine repaired or a rival. (Roughly 150 words.)
  2. "Running the cases" — apply it to all six, saying for each whether it saves my verdict, overturns it, or splits it into an ex ante and ex post answer you then adjudicate. (Roughly 500 words.)
  3. "The verdicts I give up" — an honest accounting of which of my verdicts your principle cannot accommodate, and why the principle should win rather than them. (Roughly 200 words.)
  4. "Cases I haven't listed" — what your principle predicts for at least three new situations chosen to stress it, stated concretely enough that I could recognize them in the news. (Roughly 250 words.)
  5. "The one-line version" — the whole thing compressed to a sentence I could actually apply in real time. (Roughly 50 words.)
reasoning: |-
  Okay, let me approach this systematically. The user presents a deeply personal struggle with moral coherence in humanitarian intervention judgments, rooted in rationalist epistemology but plagued by cognitive dissonance across six concrete cases. They're explicitly rejecting academic equivocation - this demands razor-sharp precision.

  First, I need to unpack their core tension: they've absorbed Bayesian reasoning and Tetlock's probabilistic thinking, yet their verdicts on Rwanda (pro), Sierra Leone (pro), Kosovo (pro), Iraq (con), Libya (conflicted), Syria (contradictory) resist systematization. Their proposed principle has three elements - ongoing killing, narrow aims, and median-failure acceptance - but they distrust it as self-serving. The key pain points are Libya's execution betrayal and Syria's red-line paralysis.

  Hmm... their unspoken need seems to be liberation from cognitive dissonance through principled consistency, not mere intellectual satisfaction. The emotional weight in phrases like "I hold both and cannot make them stop contradicting" suggests this is causing genuine distress. They're essentially asking for ethical triage rules - a decision heuristic that won't collapse under real-world ambiguity.

  For the principle itself, I notice their median-failure condition is brilliant but underdeveloped. What if I tighten it by anchoring to historical precedents? We'd evaluate interventions not against idealized outcomes but against what typically happens when similar actors intervene in similar conflicts. This eliminates hindsight bias while preserving their insight about accepting failure modes.

  On Libya: their anguish about ex-ante/ex-post evaluation is exactly where the median-failure principle shines. Since regime change was the modal outcome of post-Cold War interventions (Panama, Iraq), counting on pure civilian protection was statistically naive. Hence the intervention fails the principle ex-ante.

  For Syria's red line: chemical weapons use clearly meets ongoing-killing criteria, but no-fly zones historically slide toward regime change (Libya, Kosovo). However, limited strikes against WMD facilities might satisfy narrow-aims if tied to verifiable disarmament. This resolves their contradiction - moral obligation exists but must channel through viable mechanisms.

  Cases to stress-test: Myanmar (ongoing killing but China blocks UNSC), Ethiopia (invited by government like Sierra Leone?), Nagorno-Karabakh (Russian "peacekeepers" with ulterior motives). Each probes different failure modes.

  The one-liner must encapsulate: prioritize stopping massacres but only through methods whose failure modes the intervener would tolerate given historical precedents. No utopian expectations.
answer: |-
  Here is your coherent framework, built from your median-failure acceptance clause as the core engine:

  **1. The principle, stated:**
  Endorse humanitarian intervention *only* when (1) mass atrocity is actively occurring or imminent; (2) the intervening force possesses unique capability and commits to a narrowly defined, achievable objective demonstrably linked to halting that specific atrocity; and (3) crucially, the intervener would still rationally undertake the action *knowing* the median historical outcome for comparable interventions – meaning they accept the typical costs, mission creep, and unintended consequences (like regime collapse or prolonged instability) as a probable price. This is your principle repaired, making median-failure acceptance the decisive filter. Rival principles ignoring historical failure distributions are rejected as naive.

  **2. Running the cases:**

  *   **Rwanda (1994): Saves your verdict.** Ongoing genocide met criterion (1). A modest force focused solely on creating safe zones/stopping killings met (2). Median outcomes for similar small-scale, atrocity-focused interventions (e.g., later ECOWAS ops) show high success rates in saving lives with limited blowback. Accepting this median risk (modest casualties, limited duration) was rational ex-ante. Intervention mandated.
  *   **Sierra Leone (2000): Saves your verdict.** Ongoing atrocities (1). UK force had clear, narrow aim: bolster legitimate govt, break siege of Freetown, enable peace process (2). Median outcome for small, capable, *invited* forces stabilizing a collapsing state against rebels was positive stabilization (see also earlier ECOMOG). Accepting median risk (combat losses, temporary commitment) was rational. Intervention justified.
  *   **Kosovo (1999): Saves your verdict (ex-ante), barely.** Ongoing ethnic cleansing (1). NATO aim ("averted humanitarian catastrophe") was broad but rooted in stopping Milosevic's campaign; capabilities unique (2). *Crucially:* Median outcome for *unauthorized air campaigns* against entrenched regimes (e.g., Iraq no-fly zones, Serbia '99) involved significant civilian/collateral damage, regime survival, and prolonged instability *without* full-scale invasion/occupation blowback. Accepting *this* median (damage, illegality, no regime change, messy aftermath) was arguably rational for averting worse slaughter. Regime change wasn't the median outcome *for this intervention type*. Intervention justified ex-ante.
  *   **Iraq (2003): Saves your verdict.** Met (1) only weakly (atrocities occurred but not Rwanda-scale *ongoing* pre-invasion). Catastrophically failed (2): Aim (WMD/democracy) was vast, not narrowly humanitarian. Failed (3) decisively: The median outcome for *large-scale invasions to overthrow dictators* (Panama, Afghanistan model) was prolonged occupation, insurgency, and state collapse. No rational actor wanting *only* humanitarian relief would accept *this* median cost/outcome. Humanitarian rationale was post-hoc veneer. Intervention not justified.
  *   **Libya (2011): Overturns your "right ex-ante" verdict.** Met (1) (imminent Benghazi massacre). Initial mandate (protect civilians via no-fly/no-drive) arguably met (2). **Failed (3):** The median historical outcome for *Western-led air campaigns* against dictators (Iraq '91-'03 no-fly zones, Kosovo '99, Serbia '99) was significant mission creep and/or regime collapse. Accepting "regime collapse leading to prolonged civil war" (the actual median pattern for such interventions) as the price for protecting Benghazi *ex-ante* was irrational for a purely humanitarian motive. The execution wasn't a betrayal; it *was* the median outcome. Intervention failed the principle ex-ante.
  *   **Syria (Red Line 2013): Splits & Adjudicates. Your contradiction dissolves.**
      *   **Retreat from Red Line:** Met (1) (chemical attack, ongoing mass killing). Precision strikes on WMD facilities fit (2) (narrow, capability unique). Median outcome for *limited punitive strikes* (US Syria '17, '18) is minimal escalation/regime change risk, significant deterrent effect. Accepting this median (limited retaliation, no strategic change) was rational to uphold norms. **Moral failure confirmed.**
      *   **No-Fly Zone (NFZ):** Failed (3). Median outcome for *sustained NFZs* (Iraq, Libya, Bosnia) is mission creep, escalation, entanglement in civil war, and high costs. Accepting *this* median for vague "protection" goals was irrational. **NFZ correctly rejected.** Principle resolves contradiction: Obligation existed for *proportionate response to specific atrocity*, not open-ended NFZ.

  **3. The verdicts I give up:**

  The principle forces you to surrender your ex-ante justification for **Libya 2011**. Your oscillation stemmed from separating intent from predictable outcome. The median-failure test reveals that Libya's collapse *was* the predictable outcome of that *type* of intervention, making it unjustifiable for purely humanitarian aims ex-ante. It also forces clarity on **Syria:** upholding norms required *specific, limited action* (strikes), not the open-ended commitment of an NFZ whose median outcome (entanglement, escalation) was unacceptable for humanitarian goals alone. The principle wins because it rigorously incorporates historical reality and prevents wishful thinking about intervention types prone to catastrophic failure modes. Ignoring median outcomes is planning for the best case, not the probable case.

  **4. Cases I haven't listed:**

  *   **Sudan (Darfur, mid-2000s):** Ongoing genocide (1). Robust peacekeeping/limited intervention potentially met (2). **Verdict:** Likely *not* justified under principle. Median outcome for large UN/AU peacekeeping in ongoing civil wars (Somalia, early CAR) is limited effectiveness, high casualties, and protracted stalemate. Accepting this median for uncertain gains against entrenched regime/militias might not be rational solely for humanitarian aims.
  *   **Ethiopia (Tigray, 2020-2022):** Atrocities occurred (1). **Verdict:** *Not* justified for external intervention. No unique capable/interested intervener (2). Median outcome for *uninvited* intervention in a major regional power's internal conflict is massive escalation, regional instability, and high failure probability (see potential Russia/NATO clash scenarios). Unacceptable median risk.
  *   **Azerbaijan (Nagorno-Karabakh, 2023):** Ethnic cleansing occurred rapidly (1). **Verdict:** *Not* justified for Western intervention. No plausible narrow mandate achievable without direct conflict with Azerbaijan (backed by Turkey) and Russia (peacekeepers). Median outcome for intervention against a determined regional power consolidating control is high-intensity conflict with major power involvement. Unacceptable median risk. (Contrasts with Sierra Leone – invited, weak rebels).

  **5. The one-line version:**
  Intervene only against active mass atrocities with narrowly achievable force, *if* you would rationally proceed knowing the typical historical costs and messy outcomes for that specific type of intervention.

  This framework forces coherence by anchoring justification firmly to historical reality and probable consequences, not hopes or legalisms.
