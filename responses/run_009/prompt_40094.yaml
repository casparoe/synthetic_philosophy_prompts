  What would change my mind? Hard neuroscience evidence showing no separation between attention and belief formation, but we already see that in attentional blindness studies. Or if someone proved all "self-deception" cases are just post-hoc labeling, but that ignores the lived agony of people realizing they've avoided truths. 

