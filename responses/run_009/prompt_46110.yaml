prompt: |-
  I'm a science journalist on the features desk, working on a long piece about levels of description in complex systems, and the spine of the article is Douglas Hofstadter's careenium: the imagined billiard-table universe whose balls, obeying nothing but ordinary mechanics, collectively implement a full computer running programs with goals and beliefs, with the high-level regularities in the ball-traffic he calls simmballs. The question Hofstadter presses is whether the symbols described at the software level do any pushing of their own — whether the program's "decisions" shove the simmballs around — or whether the pushing only ever goes upward, from the microphysics to everything else. I keep finding that people I interview assert one side or the other, and I want to be sure I would recognize an adequate account if I saw one before I frame the piece around anybody's answer.

  Please act as a professional philosopher of mind specializing in mental causation and levels of explanation, and think carefully — sketch some candidate requirements first, then settle on the list. Write the desiderata: what any adequate account of the causal relationship between a symbolic level and the substrate that implements it has to deliver. Include which cases it must get right (the careenium running its programs, but also the cases that make the issue urgent — a brain, a thermostat, Hofstadter's worry about which high-level patterns are real doers and which are spurious epiphenomena), which distinctions it must respect (mere description at a higher level versus genuine causal work done there; being caused by a pattern versus being caused by its realizer), and which results it cannot contradict (closure of the low-level physics, multiple realizability, the fact that the billiard-ball dynamics are already fully fixed). For each requirement, give the case or consideration behind it, say which are non-negotiable and which are prejudices of one camp, and flag any pair you suspect cannot be jointly satisfied — the causal exclusion worry looks to me like the crunch point, and I want your honest verdict on whether it is, or whether it only bites under assumptions a good theory is free to reject. Skip a scorecard of existing theories; the criteria themselves are what I need for structuring the article.
reasoning: |-
  Okay, the user is a science journalist working on a feature about levels of description in complex systems, using Hofstadter's careenium as a central example. They need a set of rigorous criteria to evaluate theories about causal relationships between symbolic levels and their physical substrates. 

  First, I need to understand the core tension: Hofstadter's question about whether symbolic levels "do any pushing" versus purely bottom-up causation. The user mentions interviewees polarize on this, so they need neutral evaluation criteria. 

  Key challenges emerge:
  - They need criteria that handle both clear cases (thermostats = real causation) and hard cases (brains/careenium)
  - Must respect physics (no magic) while allowing real high-level causality
  - The exclusion problem looms large - can high-level causes exist without overdetermining low-level events?

  Non-negotiable constraints from the query:
  1. Physical closure (microphysics fixes all)
  2. Multiple realizability (symbols aren't tied to one substrate)
  3. No spandrels (must distinguish real patterns from epiphenomena)

  But also important:
  - Avoiding category errors (like confusing patterns with their physical bases)
  - Allowing genuine downward causation without violating physics
  - Accounting for why we attribute actions to programs/agents

  Hmm... the thermostat is crucial here. It's a minimal case where we all agree the temperature-setting "causes" the furnace to turn on, despite being implemented by metal strips. Any theory must preserve this intuition while scaling to minds.

  The brain case is hardest - if neural patterns realize "decisions" that "cause" actions, how is that different from careenium's simmballs? The criteria must handle continuity between simple and complex systems.

  I should flag where tensions arise. For example: 
  - Non-redundancy (no overdetermination) vs high-level efficacy
  - Pattern-realizer distinction vs unified causation

  But crucially: the user wants to know if exclusion is fatal or solvable. My verdict will be that it's resolvable by rejecting assumption that causation requires "extra pushing" - instead, high-level patterns can be causal in virtue of their physical realization when they capture relevant dependencies.

  Final list must:
  - Cover all test cases (careenium, brain, thermostat)
  - Draw sharp lines between epiphenomena vs real causal levels
  - Acknowledge where compromises exist
  - Stay theory-neutral for journalism
answer: |-
  Here are the essential desiderata for an adequate account of causal relationships between symbolic levels and their physical substrates, structured around your needs. I'll present them as requirements, flagging non-negotiables, contested assumptions, and tensions. The exclusion problem is indeed the crux—but it's navigable if we reject certain intuitive but flawed assumptions about causation.

  ---

  ### **Core Desiderata for an Adequate Account**
  *(Non-negotiables marked ★; contested assumptions marked ⚠️; tensions flagged ⚡)*

  1. **★ Physical Closure/Completeness**  
     - **Requirement:** The account must respect that *all physical effects have sufficient physical causes*. In the careenium, billiard-ball dynamics fully determine all motion; no "gap" exists for non-physical forces.  
     - **Case:** Billiard-ball mechanics fix every simmball trajectory. Brains obey biochemical laws.  
     - **Non-negotiable:** Violating physics undermines scientific coherence.  

  2. **★ Multiple Realizability**  
     - **Requirement:** Symbolic states (e.g., a program's "IF" command) must be causally relevant *independently* of their specific physical realization. The same program could run on silicon, neurons, or simmballs.  
     - **Case:** A thermostat's "turn on furnace" decision works whether implemented by bimetallic strips or digital sensors.  
     - **Non-negotiable:** Denying this collapses levels into identity (e.g., "symbols *just are* billiard balls").  

  3. **Causal Efficacy of Patterns**  
     - **Requirement:** The account must explain how *patterns* (e.g., software states) can be causes, not just their physical realizers.  
     - **Case:** In the careenium, the program's decision to "avoid obstacles" alters simmball trajectories *as a pattern*—not just as individual balls.  
     - **Distinction:** Mere description (e.g., "ball cluster shaped like a duck") vs. causal pattern (e.g., "feedback loop regulating temperature").  
     - **⚠️ Contested:** Reductionists see pattern-causation as illusory; non-reductivists insist it's real.  

  4. **Non-Epifenomenality of the Symbolic**  
     - **Requirement:** Symbolic states (beliefs, goals) must *do work* in the system. If removing/changing a symbolic state alters outcomes, it’s causal.  
     - **Case:** Altering a careenium program’s goal (e.g., "seek food" → "avoid light") changes ball traffic *because of the goal*, not just micro-changes.  
     - **Avoids:** Spurious epiphenomena (e.g., "the average velocity of balls" may be inert; "the program counter" is not).  

  5. **⚡ Exclusion Avoidance**  
     - **Requirement:** The account must resolve *causal exclusion*: if physics fixes all effects, how can symbolic causes "add" causation without overdetermination?  
     - **Crunch Point:** Either symbolic causes are redundant (epiphenomenal) or physics isn't closed (unacceptable).  
     - **Solution Path:** Reject "causal competition." Symbolic causes *are* physical causes *under a description* capturing relevant dependencies (e.g., program logic vs. momentum transfer).  
     - **Verdict:** Exclusion is fatal *only* if causation requires "extra force." A good theory redefines causation as *difference-making* (see #6).  

  6. **★ Difference-Making (Counterfactual Dependence)**  
     - **Requirement:** Symbolic states must satisfy *counterfactual tests*: if the state had differed (holding substrate fixed), outcomes would differ.  
     - **Case:** If the thermostat’s target temperature were higher, the furnace would turn on sooner—*even if bimetallic strip properties are unchanged*.  
     - **Non-negotiable:** Captures why we attribute actions to *agents* ("She turned left because she *wanted coffee*").  
     - **Resolves Exclusion:** High-level states cause by being *what would change* the outcome under interventions (not by "pushing" atop physics).  

  7. **Realizer-Pattern Distinction**  
     - **Requirement:** The account must distinguish causation *by a pattern* (e.g., software loop) from causation *by its realizer* (e.g., specific electrons).  
     - **Case:** In brains, "neural firing pattern P causes movement M" is true; "sodium ions S cause M" is true but *less explanatory*.  
     - **Avoids:** Conflating realization (a token pattern *is* a token physical state) with causation (the pattern’s *form* explains effects).  

  8. **Scale-Relative Explanatory Power**  
     - **Requirement:** High-level causes must be *indispensable* for explaining certain behaviors. Physics-alone explanations are intractable or miss generalizations.  
     - **Case:** Describing a chess AI's move via billiard-ball collisions is possible but useless; the *strategy* explains it.  
     - **⚠️ Contested:** Some argue tractability is "merely pragmatic." Adequate accounts must show level-specific laws/regularities (e.g., algorithmic efficiency).  

  ---

  ### **Critical Cases to Accommodate**
  - **Careenium:** Symbols (simmballs) must cause system behavior *as software*, not just as balls.  
  - **Thermostat:** The setpoint *causes* furnace activation unambiguously.  
  - **Brain:** Beliefs/desires cause actions without violating neural physics.  
  - **Spurious Epiphenomena:** Distinguish causal patterns (e.g., a feedback loop) from inert byproducts (e.g., "the careenium’s net kinetic energy").  

  ---

  ### **Tensions and Resolutions**
  - **⚡ Exclusion vs. Efficacy (#5 vs. #3, #4):** The major tension. **Resolution:** Causation as difference-making (#6) avoids exclusion—symbolic states are causal *iff* they are variables that counterfactually control outcomes. Physics fixes *how* realizers implement patterns, but patterns fix *which* realizers matter.  
  - **Closure (#1) vs. Multiple Realizability (#2):** Tension if levels are ontologically separate. **Resolution:** Patterns supervene on physics but are causally relevant via their relational/functional properties.  
  - **Realizer Distinction (#7) vs. Physicalism:** Denying #7 leads to epiphenomenalism; denying physicalism is untenable. **Resolution:** Realizers *are* the causal basis, but patterns capture *invariant relationships* robust across realizers.  

  ---

  ### **Honest Verdict on Exclusion**  
  Exclusion is a serious challenge but **not fatal**. It bites under two questionable assumptions:  
  1. Causation requires "energy transfer" or "force exertion" (but difference-making needs neither).  
  2. Causes must compete for "causal oomph" (but patterns and realizers aren't rivals; they’re descriptions at different grains).  
  Adequate accounts reject these by embracing **causal pluralism**: physical causation (energy transfer) and informational causation (difference-making) coexist. The careenium’s program causes ball movements *in virtue of* its physical realization, not despite it.  

  ---

  ### **Summary Checklist for Your Article**  
  An adequate account must:  
  - Preserve physics’ closure while granting causal power to patterns (★).  
  - Explain how symbols are efficacious across substrates (★).  
  - Pass counterfactual tests for high-level states (★).  
  - Distinguish real causal patterns from epiphenomena.  
  - Resolve exclusion via difference-making, not overdetermination.  
  - Justify why we *need* symbolic explanations (e.g., for prediction/control).  

  The careenium isn’t just a metaphor—it’s a litmus test. If a theory can’t explain why the program’s decisions (not just billiard balls) "run the show," it fails. But if it sacrifices physical closure, it fails harder. The winning path treats causation as *information-sensitive*: symbols cause by being the control variables physics implements.
