  i've been trying to wrap my head around safe pareto improvements and there's one thing that keeps tripping me up. quick recap of my understanding so you can check it: two parties are about to play some game G (a price war, a lawsuit, whatever), and they can agree up front to instead play a "milder cousin" G' of that game. the "safe" part is that the swap is supposed to be a Pareto improvement *no matter how the underlying game actually instantiates* — whatever each party would have gotten out of the original game, they weakly prefer what they get out of the cousin. and the big selling point, as I understand it, is that this works even though the parties (and whoever brokers the deal) don't know each other's payoffs or even what game they're really playing.

  ok so here's my problem: if you don't know what game you're playing, who exactly is checking that G' really is a Pareto improvement for *every* possible instantiation? doesn't someone have to know enough about the space of possible underlying games to verify the safety condition across all of them? it feels like the uncertainty just got moved from "which payoffs do we have" to "which games could this turn out to be." or — and this is my guess at the actual answer — is the point that the modification preserves some structural feature of the game (symmetry, randomizing over outcomes, delegating both players' choices to one neutral agent) such that the safety check doesn't require knowing anything type-specific, it's guaranteed by the shape of the modification itself? like, the safety is cheap to establish even though the payoffs arent. if that's right I'd love to have it spelled out, because I can sorta half-see it for the coin-flip example (each player's expected value under the coin flip is an average of payoffs they could've gotten) but I lose the thread for fancier modifications.

  also a smaller one: the whole scheme seems to lean on both parties interpreting the modified game the same way they'd have interpreted the original one. if I think the coin flip is about custody and you think it's about the dog, we haven't actually agreed to the same thing. is that a stated assumption somewhere in the literature or is it just quietly sitting in the background?

  assume I know what pareto dominance and game forms are but haven't touched any of the formalism. and honestly — if I've misdescribed the setup somewhere, or if the question dissolves once you state things carefully, please just tell me that rather than trying to rescue my framing. I'd much rather find out I'm confused than get a smooth answer that works around the confusion.
