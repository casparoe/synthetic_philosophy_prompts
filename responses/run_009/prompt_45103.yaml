  - **After Necessary Revisions**: The cheapest consistent position is **threshold prioritarianism** (moderating (1) to include (4)'s threshold), which rejects telic egalitarianism via (2), maintains separability (5), but drops relative deprivation (3), focusing solely on absolute welfare up to a threshold. 

