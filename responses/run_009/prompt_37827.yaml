answer: |-
  ### Session Plan: "The Common Prior Assumption"

  **Most Important Sequencing Decision**: Start by establishing the *separation between prior beliefs and private information* using a concrete scenario. Why? Without this foundation, participants won't grasp why rational disagreement post-sharing is possible. Jumping straight into common prior would obscure the role of information asymmetry.

  ---

  #### **1. Setup: Prior vs. Information (5 min)**
  - **Concrete Scenario**: A fair coin will be flipped once. Alice and Bob both start with a **common prior**: 50% chance of heads (H), 50% tails (T).  
    - *Private information*:  
      - Alice sees **evidence** (e.g., a preview) that the coin is biased toward H (P(H) = 2/3).  
      - Bob sees **evidence** that it’s biased toward T (P(H) = 1/3).  
  - **Update beliefs**:  
    - Alice’s posterior: **P(H) = 2/3** (after seeing her evidence).  
    - Bob’s posterior: **P(H) = 1/3** (after seeing his evidence).  
  - **Key point**: Differences arise from **private information**, not irrationality.  

  ---

  #### **2. Rational Disagreement After Sharing (5 min)**
  - **The spat scenario**: Alice and Bob share their probabilities (2/3 and 1/3). *Should they now agree?*  
  - **Reveal the twist**: Alice and Bob *cannot share their raw evidence* (e.g., "my source said X"), only probabilities.  
  - **Result**: They **rationally keep disagreeing**!  
    - Why? Each knows the other saw *some* evidence, but not *what* evidence. Alice thinks: "Bob’s 1/3 might be from weak evidence; my 2/3 is strong." Bob thinks vice versa.  
    - *No Bayesian rule forces agreement here*—updating requires knowing the *content* of evidence, not just probabilities.  

  ---

  #### **3. Enter the Common Prior Assumption (10 min)**
  - **What it is**: Everyone shares the *same initial probability distribution* (prior) over all possible states and evidence.  
  - **Add it to the scenario**: Assume Alice and Bob agree upfront on:  
    - How evidence is generated (e.g., "evidence comes from a source with 75% accuracy").  
    - The prior probability of each evidence type.  
  - **Now share probabilities**:  
    - Alice says P(H) = 2/3 → Bob infers she saw "pro-H" evidence.  
    - Bob says P(H) = 1/3 → Alice infers he saw "pro-T" evidence.  
    - They *combine* evidence: **Both update to P(H) = 1/2** (agreement!).  
  - **Why?** Common prior lets them "decode" probabilities back to evidence, then update jointly.  

  ---

  #### **4. Misconceptions to Head Off (5 min)**
  - **During Step 3**:  
    - *"Common prior = same information"*: No! Alice/Bob had different info, but agreed on how info *works*.  
    - *"Just average the numbers"*: Not Bayesian! (In the example, 2/3 and 1/3 average to 1/2—coincidence! With asymmetric evidence, averaging fails.)  
  - **After Step 3**:  
    - *"Real-world disagreements are irrational"*: False! Common prior is a **strong assumption**. In practice, people have:  
      - Different priors (e.g., life experiences).  
      - Different models of how evidence works.  
      - → Rational disagreement is everywhere!  

  ---

  #### **5. What We’re Skipping (1 min)**  
  - **Out loud**: "No time for Harsanyi’s theorem, common knowledge, or infinite recursion. Focus: *When* common prior forces agreement, and why real life often breaks it."  

  ---

  #### **6. Check for Understanding: Final Question (4 min)**  
  - **Ask**: "In the coin scenario, if Alice and Bob *don’t* have a common prior about how evidence is generated, why might they still disagree after sharing probabilities?"  
  - **Target answer**: They can’t "translate" probabilities back to evidence, so they can’t update. Disagreement stays rational.  

  ---

  ### Why This Sequence?  
  - Starts simple (prior vs. info), builds to "aha" moment (disagreement is possible), then adds common prior as the *sufficient condition* for agreement.  
  - Misconceptions preempted *during* relevant steps (e.g., "same info" corrected when explaining the assumption).  
  - Ends by decoupling theory ("common prior forces agreement") from reality ("disagreement is often rational").  

  **Total**: 30 min ⏱️
