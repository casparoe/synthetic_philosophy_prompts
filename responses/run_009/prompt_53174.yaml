answer: |-
  **Bottom line:** The thought experiment shows that semantic externalism implies past memory reports can become false over time due to undetectable environmental shifts, while internalism preserves their truth, with the externalist responding that truth is timeless but context-dependent.

  **Thought Experiment: The Case of Thirst and Dryst**
  1.  **Setup:** On Earth, a clear, odorless liquid called "thirst" (chemical formula H₂O*) quenches thirst and fills lakes. Its essential property is the specific isotope configuration O* (stable oxygen-17). Its Twin Earth counterpart, "dryst," is molecule-for-molecule identical *except* it has O† (stable oxygen-18) instead. H₂O* and H₂O† are macroscopically indistinguishable: same boiling point, taste, behavior in organisms, etc. Crucially, *only* isotopic composition distinguishes them.
  2.  **Gradual Change:** Subject S lives near a lake. Over 20 years, due to undetectable natural processes (e.g., slow isotopic exchange with deep geological reservoirs), *every molecule* of H₂O* in S's entire environment (water sources, atmosphere, organisms, including S's own body) is gradually, imperceptibly replaced by H₂O†. The process is continuous, with no point where S or anyone could detect a difference via use, introspection, or scientific examination (current tech can't distinguish O* and O†). S continues using "thirst" exactly as before, sincerely reporting "This is thirst," "I drank thirst yesterday," etc., based on identical phenomenal experiences and functional roles.

  **Theories' Verdicts (Derived, Not Stipulated):**
  1.  **Current Meaning (Today):**
      *   **Internalism:** Meaning is determined solely by S's internal state (conceptual role, phenomenal experience, dispositional structure). S's internal state regarding "thirst" is identical to 20 years ago (same use, same experiences, same functional role). Thus, "thirst" refers to the substance with *that* internal role/presentation – which is *indistinguishable* from both H₂O* and H₂O†. **Verdict:** "Thirst" refers to the substance manifesting those properties *here and now* – **H₂O† (dryst)**. (Internalism focuses on the *type* of experience/role, satisfied by the present substance).
      *   **Externalism (Putnam-style):** Meaning/reference depends on the actual external substance causally regulating the use of the term. The substance currently causing S's "thirst"-utterances and fulfilling the associated functional role is H₂O†. **Verdict:** "Thirst" refers to **H₂O† (dryst)**.
      *   *Agreement Point:* Both theories agree the word refers to dryst *now*.
  2.  **Meaning 20 Years Ago (Before Transition):**
      *   **Internalism:** S's internal state regarding "thirst" is identical to today. The substance manifesting the relevant properties *then* was H₂O*. **Verdict:** "Thirst" referred to **H₂O* (thirst)** 20 years ago. Meaning is constant; the internal state defines the concept, satisfied by whatever fits it locally at a time.
      *   **Externalism:** The substance causally regulating S's use of "thirst" 20 years ago was H₂O*. **Verdict:** "Thirst" referred to **H₂O* (thirst)** 20 years ago.
      *   *Disagreement Point:* While both agree on the *past reference* (thirst), they disagree fundamentally on what *constituted* that meaning. Internalism says the meaning (the concept thirst) was fixed internally and remains the same, applying to different substances at different times. Externalism says the meaning/reference *was* fixed by the external substance (thirst) and has *changed* to refer to a different substance (dryst) due to the environmental change. **The key disagreement is whether the meaning *type* persisted unchanged (Internalism) or whether the reference, and thus the meaning, *changed* (Externalism).**

  **Feature Doing the Work:** The **undetectable microstructural swap preserving macro-properties and internal states** is crucial. It severs the link between internal state and micro-essence over time, forcing the theories apart on diachronic meaning while allowing synchronic agreement. Internalism is tethered only to the stable internal state; externalism is tethered to the shifting external micro-essence, despite macro-stability.

  **Externalist's Best Response to the "Silently False Memory" Charge:**
  The externalist concedes that S's sincere memory report, "I drank thirst yesterday" (made yesterday), was *true* when uttered (yesterday, "thirst" referred to H₂O†, and S did drink H₂O†). However, the report S makes *today*, "Twenty years ago I drank thirst," is *false* if "thirst" now means H₂O†, because twenty years ago S drank H₂O*, not H₂O†. The charge is that this makes the *content* of the memory itself (formed yesterday about an event long ago) silently false.

  **The Externalist's Best Defense:**
  1.  **Timeless Truth, Contextual Utterance:** Truth is timeless, but the *truth-value of an utterance* depends on the context of utterance, primarily the *meaning of the words at the time of utterance*. The memory *report* S makes *today* uses words with *today's* meanings. Since "thirst" today means H₂O†, and S did not drink H₂O† twenty years ago, the report is false. This doesn't mean the *past event* changed or that the memory *representation* formed yesterday was false *when formed*. The memory representation formed yesterday, using "thirst" *as it meant yesterday* (H₂O†), correctly represented drinking H₂O† *yesterday*. The problem arises only when *re-expressing* that memory *today* using words whose meanings have shifted.
  2.  **The Memory Itself Isn't Linguistic:** The core memory is a non-linguistic representation of an experience (drinking a clear, thirst-quenching liquid). The linguistic report ("I drank thirst") is an interpretation *using current language*. The falsity attaches to the *current linguistic expression*, not necessarily to the underlying non-linguistic memory content. S's memory of the *event* (drinking that liquid) remains accurate; the error is in labeling the *kind* of liquid *using the current meaning* of "thirst."
  3.  **Preserving Rationality (Bite the Bullet Strategically):** The externalist argues this consequence, while initially counterintuitive, is less implausible than the internalist alternative of denying that "thirst" refers to dryst *now* despite the complete environmental shift. It respects the core externalist insight: meaning is world-involving. We *do* accept that language can drift over time (e.g., "decimate" now means something different than in Roman times), sometimes making past statements false on current readings. This case is an extreme, undetectable version of that. S remains rational; their mistake is purely metalinguistic ignorance of the semantic shift, not a failure of memory recall. The implausibility stems from the *perfect undetectability* of the shift, not the core semantic theory.
