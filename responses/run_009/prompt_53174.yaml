  For the theories: Semantic internalism says meaning is determined by internal states, so the subject's concept remains constant, meaning "thirst" throughout. Externalism, following Putnam, ties meaning to external substances, so reference shifts with the environment. Currently, both agree it refers to dryst because that's what's in the environment now. But 20 years ago, internalism says it meant thirst, while externalism says it meant thirst back then. The disagreement hinges on whether meaning is in the head or depends on the world.

  The memory problem: If "thirst" meant thirst in the past but now refers to dryst, a sincere memory like "I drank thirst yesterday" was true when said but is now false because "thirst" refers to dryst. That seems implausible—how can memories silently become false? The externalist must counter this. Their best response is that truth is timeless but indexical to context. When uttered, the memory report was true based on then-reference; its current truth-value depends on present context. So it's not that memories become false; it's that language evolves, and we must consider the context of utterance. This preserves the rationality of memory while accommodating externalism.

