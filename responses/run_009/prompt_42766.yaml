prompt: |-
  I produce a half-hour podcast on the history of ideas in anthropology. Next month's guest is a senior anthropologist who has spent decades doing fieldwork among a contemporary foraging people and whose new book revives, in updated form, the Sahlins-style claim that hunter-gatherers lived in the original affluent society — and, going further, that the adoption of agriculture was, on balance, a bad deal for the people who took it up. He is a practiced interviewee with two reliable retreats: when pressed on the empirical record he falls back on the definitional move that affluence means wanting little rather than having much, and when pressed on that definition he says that every welfare concept is contestable, so his is no worse than anyone else's.

  Draft eight to ten questions for the recording. They should turn on the substance of his position rather than on his biography or his fieldwork stories, though the stories may be used as levers. At least one question each must press on: (a) the definitional move, and whether framing affluence in terms of wants rather than resources makes the thesis hard to test rather than deep; (b) the demographic evidence — mortality, life expectancy, and the fraction of people who lived to see their grandchildren; and (c) the extrapolation problem — that the foraging peoples ethnographers actually observed mostly survived on land farmers did not want, and so may not tell us about the foragers who existed before agriculture existed to push them anywhere. At least two questions should be built so that either of his two stock replies, if given, makes the next question land harder rather than closing the topic, and the final question should be one he cannot answer with either stock reply — in the neighborhood of what evidence, in principle, could get him to give the thesis up.

  Present the output as a table with exactly four columns: Question (worded as I would read it aloud), Presses on (the specific substantive point it targets), Likely reply (the response he is most disposed to give, phrased roughly as he would phrase it), and Follow-up (what I should ask next if he gives that reply). Order the rows in the sequence I should ask them, and after the table add one short paragraph, outside the table, identifying which single question I should cut first if the interview runs long, and why.
reasoning: |-
  Okay, the user wants me to draft interview questions for a podcast episode featuring an anthropologist who argues that hunter-gatherers lived in an original affluent society and that agriculture was a bad deal. I need to create 8-10 questions focusing on the substance of his position, with specific requirements about pressing on definitional issues, demographic evidence, and the extrapolation problem. 

  The anthropologist has two common retreats: defining affluence as wanting little rather than having much, and claiming all welfare concepts are contestable. I need to craft questions where these retreats actually set up harder follow-ups. The final question should force him beyond these stock answers by asking what evidence could make him abandon his thesis.

  For the definitional issue (a), I'm considering a question that directly challenges whether framing affluence as wanting little makes the thesis untestable. If he uses his definitional move, the follow-up should ask how we can know if this mindset existed pre-agriculture. If he claims all definitions are contestable, the follow-up should push him to justify why his definition is useful for comparison.

  For demographic evidence (b), I'll focus on mortality and life expectancy. The follow-up should address whether lower population density rather than affluence explains better health outcomes. This counters his likely argument that foragers were healthier.

  For the extrapolation problem (c), I'll question whether contemporary foragers on marginal lands can represent prehistoric foragers. The follow-up should challenge the assumption that all pre-agricultural lands were equally desirable.

  I'm designing two questions where either retreat makes the next question tougher. For example, a question about why agriculture spread if it was worse could lead to a follow-up about whether adopters were coerced or mistaken - forcing him beyond simple answers.

  The final question will ask what evidence could falsify his thesis, preventing him from using either retreat. I'll phrase this as concrete archaeological or genetic findings that would change his mind.

  I'll present this as a table with Question, Presses on, Likely Reply, and Follow-up columns. For the cut recommendation, I'll suggest removing the question about why agriculture spread first, since it's less central to his core argument than the definitional or demographic challenges.
answer: |-
  Here's a draft question set meeting your specifications, designed to press the core arguments while anticipating and leveraging his retreats:

  **Interview Questions: The Original Affluent Society Revisited**

  | Question (Read Aloud)                                                                 | Presses On                                       | Likely Reply                                                                                                                 | Follow-up                                                                                                                                                   |
  | :------------------------------------------------------------------------------------ | :----------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | 1. Professor, you powerfully revive Sahlins' idea of the "original affluent society." Could you start by defining what *you* mean by "affluence" in this context, and why that definition is central? | (a) Definition of Affluence                      | "Affluence isn't about vast material possessions; it's about achieving satisfaction with relatively little. It's the freedom from endless wants, the ease of meeting needs with modest means." | "If affluence is defined primarily as *wanting little*, doesn't that make the thesis somewhat circular or self-fulfilling? How do we objectively measure 'satisfaction' or 'freedom from wants' archaeologically?" |
  | 2. **Follow-up to Q1:** If a key measure is the ease of meeting needs, how do we reliably compare the *level of need* or the *effort required* between prehistoric foragers and early farmers using archaeological evidence? | (a) Testability of the Definition                | "All welfare concepts are inherently value-laden and contestable. GDP is equally problematic. My definition focuses on human experience, not just material accumulation." | "Granted all definitions are contestable. But doesn't framing affluence as a *state of mind* ('wanting little') make it particularly resistant to empirical testing against the historical record, compared to resource-based metrics?" |
  | 3. Let's look at the demographic record. Skeptics point to skeletal evidence suggesting lower life expectancy, higher child mortality, and fewer people surviving to grandparenthood among prehistoric foragers versus early agriculturalists. How does your thesis reconcile with that? | (b) Demographic Evidence                         | "Much of that evidence is contested and context-specific. Crucially, many health declines are linked to sedentism, density, and disease *caused* by agriculture. Affluence isn't just longevity; it's quality of life, less drudgery, autonomy." | "Even acknowledging the 'diseases of civilization,' if agriculture consistently enabled larger populations and more people surviving to see grandchildren – factors often linked to evolutionary fitness – doesn't that suggest *some* net benefit, challenging the idea it was a 'bad deal'?" |
  | 4. You mention quality of life and autonomy. Drawing on your fieldwork, what specific aspects of contemporary forager life do you see as most indicative of that original affluence, and crucially, how transferable are those observations to prehistoric contexts? | Fieldwork as Lever for Extrapolation             | "[Shares vivid anecdote, e.g., time for ritual/leisure, sharing ethos, lack of bosses]. These patterns reflect core human sociality and adaptation, likely deeply rooted." | "Which leads to a key challenge: the extrapolation problem. Weren't the foragers you & others studied largely confined to marginal lands *after* 10,000 years of agricultural expansion? How can we be sure they reflect the pre-agricultural norm?" |
  | 5. **Follow-up to Q4:** Exactly. If ethnographically observed foragers survived on lands largely *rejected* by farmers, doesn't that mean their strategies evolved under uniquely harsh or constrained conditions, making them poor models for foragers on prime pre-agricultural lands? | (c) Extrapolation Problem (Marginal Lands)       | "Even in 'marginal' lands, they achieved satisfaction with modest means. More importantly, archaeological evidence from richer pre-agricultural sites *also* shows signs of abundance and leisure compared to early farming villages." | "But isn't there a selection bias? The prime lands *are* the ones first adopted for farming, erasing the prior forager record there. Doesn't the very fact farmers took those lands suggest they *were* more productive, undermining the affluence argument for those specific, now-lost, forager groups?" |
  | 6. Let's push the 'bad deal' aspect. If agriculture was such a net negative for well-being – more work, worse health, inequality – why did it spread so rapidly and was adopted so widely? Were all those early farmers simply duped or coerced? | Motives for Adoption & "Bad Deal" Claim          | **Option 1 (Definition):** "They weren't 'duped'; their *needs* and *wants* changed – often driven by population pressure or elite capture. Affluence declined as desires expanded." <br> **Option 2 (Contestable):** "It's complex! Adoption wasn't uniform or always voluntary. Short-term gains (surplus for feasts?) might mask long-term traps. Judging 'benefit' depends on your values – autonomy vs. population size." | **If Option 1:** "So, adopting agriculture fundamentally changed human *psychology*, creating new, less satisfiable wants? Isn't that a massive shift in the human condition itself, rather than just an economic one?" <br> **If Option 2:** "If judging the 'benefit' is so value-dependent, how can we definitively call it a 'bad deal,' especially given the demographic persistence you acknowledged earlier?" |
  | 7. Critics argue your 'original affluence' is partly a function of very low population density, not inherent efficiency. As density rose *before* agriculture (e.g., Natufians), didn't life get harder, forcing the shift? Doesn't this suggest foraging affluence was a brief, density-dependent phase? | Demographics & Causation (Density vs. Affluence) | "Low density was *part* of the strategy enabling affluence! Deliberate population control was often key. The shift to farming often came with *rising* density and declining well-being, not the other way around as a simple cause." | "But doesn't this concede that maintaining this 'affluence' required actively suppressing human reproductive potential? And can we really separate the 'affluence' you describe from the very specific ecological and demographic conditions that enabled it?" |
  | 8. **Final Question:** Given the definitional debates, demographic puzzles, and extrapolation challenges, what specific type of evidence – say, from ancient DNA, refined archaeological analysis, or paleoclimate data – if discovered, would genuinely make you reconsider or significantly modify the core claims of your book? | Falsifiability / Evidence for Abandonment       | *(Cannot effectively use either stock reply)*                                                                                | (N/A - End on this thought-provoking point)                                                                                                                 |

  **Question to Cut First if Running Long:** Cut **Question 6** ("Let's push the 'bad deal' aspect..."). While it presses the "bad deal" claim, it's slightly less central to the *core* "original affluence" thesis than the direct challenges to the definition (Q1, Q2), the demographic evidence (Q3), or the extrapolation problem (Q5). Question 6 builds on the thesis but doesn't probe its foundational evidence or logic as directly as the others required by your brief. Cutting it still leaves robust challenges to the main pillars of his argument.
