  | **Task-Relative Impact** (e.g., "side effect" minimization) | Only penalize changes unrelated to the task (e.g., factory construction isn't impact). | Yes—requires specifying the task boundary. | Vase: Let break—saving isn't the task. Off-Switch: Locking penalized if not task-necessary. Factory: Not penalized. Enabling: Only penalized if unrelated to task. |
