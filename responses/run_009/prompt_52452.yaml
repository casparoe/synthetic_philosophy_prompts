  Engineers should recognize that "low impact" is a cluster of solutions, not one idea. For safety-critical systems, corrigibility or deflation may be more honest than impact minimization. I recommend focusing on **corrigibility or narrow agents** if value specification is intractable, and **AUP/reachability** if you must pursue open-ended agents.  

