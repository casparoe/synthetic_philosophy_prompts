  ### **Conclusion for Your Blog Post**
  This tree shows that **"avoiding side effects" can be defined without solving value specification only in limited cases** (e.g., generic penalties like AUP use baselines and proxies). However, most positions either require value specification (task-relative, corrigibility) or reject the framework (deflation). Key tensions:  
  - Baselines diverge—e.g., vase-breaking is "safe" under stepwise but not current-state.  
  - Enabling effects and irreversibility force value judgments.  
