prompt: |-
  I write novels, and the one I'm working on now has a fifteen-year-old narrator who becomes convinced she has dissociative identity disorder after falling down an online rabbit hole -- the plot is partly about how getting the label changes who she thinks she is. A friend who does philosophy of science mentioned Ian Hacking's looping effects, how classifying people changes the people classified and eventually reshapes the category itself, and honestly that's kind've exactly what my book is doing. So now I'm a bit nervous. I want a procedure I can run on my own drafts -- I tend to write two or three characters carrying some psychiatric label per book, my audience is YA-adjacent, and there's a real chance my depictions land on readers who are actively hunting for words for what they feel. Give me the questions to ask in order about a given portrayal, what a sufficient answer to each looks like, where the procedure stops at "rewrite or cut this," and where it has to hand off to a judgment call between me and my editor because the question is about values not facts. I don't have a clinician on call and can only afford a sensativity reader for one character per book, so the procedure has to be runnable by me alone with a draft and a weekend. Then run it on three things: the self-diagnosing teenager (where the looping is the whole point of the novel and I really don't want to cut it), a minor character with fairly textbook OCD that I've written for warmth rather than drama, and a character whose "condition" I basically invented by blending symptoms from a few real ones because it served the metaphor. Be honest about where the procedure will tell me to do something I won't like, and about what it can't settle at all.
reasoning: |-
  Okay, let me unpack this carefully. The user is a novelist working on a YA-adjacent book with a protagonist who self-diagnoses DID through online exposure, exploring how labels reshape identity - directly invoking Hacking's looping effects concept. They need a self-applicable vetting procedure for psychiatric portrayals that considers real-world impact on vulnerable readers, with constraints: no clinical access, limited sensitivity reading budget, and three test cases including one intentionally invented condition.

  Hmm, the core tension here is balancing artistic exploration of identity formation against responsible representation. The DID plot is central to their thesis, so the protocol must accommodate that while flagging genuine risks. For the minor OCD character, warmth-over-drama suggests good intent but may overlook nuances. The invented hybrid condition is ethically trickiest - blending real symptoms could mislead if presented as clinical reality.

  I'm considering a four-stage framework: first harm checks (non-negotiable red flags), then accuracy/context for real disorders, followed by narrative framing analysis, ending with values-based judgment calls. Each stage needs clear "stop/rewrite" thresholds and "consult" exit ramps. 

  For the DID portrayal: Must avoid romanticizing or simplifying a complex trauma disorder while preserving the looping effect exploration. Key questions would probe whether dissociation is shown as adaptive coping (good) versus supernatural (bad), and whether clinical gatekeeping is acknowledged. The invented condition needs metaphorical transparency - perhaps explicitly framing it as allegorical in-text.

  Notably, the user's awareness of reader vulnerability ("hunting for words for what they feel") suggests they'll engage thoughtfully with the protocol. But I should emphasize where artistic license must yield to harm prevention, especially regarding suicide contagion or reinforcing stereotypes. The OCD depiction might need subtle tweaks if "textbook" traits ignore heterogeneity.

  Ultimately the invented metaphor character requires ruthless honesty: Does this hybrid serve the story enough to risk muddying real conditions? If kept, it needs textual disclaimers. All cases demand sensitivity readers ideally, but the protocol can prioritize based on centrality and risk.
answer: |-
  Here’s a self-audit procedure designed for your constraints, followed by application to your three cases. It prioritizes harm prevention while acknowledging artistic necessity.

  **The Self-Audit Protocol for Psychiatric Portrayals**

  **Phase 1: Harm Checks (Non-Negotiable - Fix or Cut)**
  1.  **Question:** *Does this depiction directly link the condition to:*
      *   Violence against others (without clear, contextualized rarity/complexity)?
      *   Irredeemable evil/incurable "monstrosity"?
      *   Gratuitous suicide details/methods?
      *   Sexual predation as a *core symptom*?
      *   **Sufficient Answer:** NO. If YES, rewrite or cut. These tropes cause demonstrable real-world harm and stigma.
  2.  **Question:** *Does this portrayal rely on inaccurate, outdated, or harmful stereotypes as its primary characterization?* (e.g., "psycho killer," "manic pixie dream girl," "helpless autistic savant," "attention-seeking faker").
      *   **Sufficient Answer:** NO. Stereotypes are lazy writing and reinforce stigma. If YES, rewrite core characterization.
  3.  **Question:** *Does the narrative frame successful treatment/management/coping as impossible or inherently undesirable?* (Does it imply "damaged beyond repair" or "better off dead"?)
      *   **Sufficient Answer:** NO, or it's explicitly a character's *flawed perception*, not the narrative's judgment. Hopelessness can be a character's feeling, but the narrative shouldn't endorse it as truth. If YES, reframe narrative perspective or character arc.

  **Phase 2: Accuracy & Context (Requires Research - Flag for Sensitivity Reader if Possible)**
  4.  **Question (For Real Diagnoses):** *Have I researched the core diagnostic criteria, common comorbidities, typical age of onset, and evidence-based treatments? Does my portrayal significantly contradict this without a clear narrative reason (e.g., character misunderstanding)?*
      *   **Sufficient Answer:** YES, researched. Portrayal aligns *generally* OR specific deviations serve a clear, justified narrative/character purpose (like the protagonist's misunderstanding). If NO research or major contradictions without justification, research/rewrite.
      *   **Judgment Call:** *How* central is the deviation to the plot/theme? Minor deviations might be okay; major ones need strong justification.
  5.  **Question:** *Is the condition presented as the *sole* defining trait of the character?*
      *   **Sufficient Answer:** NO. The character has interests, relationships, flaws, strengths, and motivations separate from their condition. If YES, develop character depth.
  6.  **Question:** *Does the portrayal acknowledge internal experience, nuance, and heterogeneity?* (e.g., not all depression looks like crying in bed; OCD isn't just neatness).
      *   **Sufficient Answer:** YES, shows some internal perspective or variation beyond clichés. If NO, add internal monologue, varied symptoms, or diverse coping.

  **Phase 3: Narrative Framing & Impact (Values Judgment - Consult Editor)**
  7.  **Question:** *What is the primary *source* of drama/conflict related to the condition?*
      *   **Answer Spectrum:** Internal struggle <-> Stigma/Societal Barriers <-> Symptoms themselves <-> Others' reactions <-> Misdiagnosis/Lack of Care.
      *   **Judgment Call:** Is the drama primarily generated by *experiencing the symptoms* (risking "torture porn") or by *navigating the world with them* (stigma, access, relationships)? The latter is generally safer and more relatable. Does the source align with the story's goals? Discuss with editor.
  8.  **Question:** *What is the implied message about diagnosis/labels?*
      *   **Answer Spectrum:** Inherently liberating/truthful <-> Inherently limiting/stigmatizing <-> Complex tool with both benefits and pitfalls.
      *   **Judgment Call:** Does the message align with your thematic goals? Is it nuanced? (Your DID plot *wants* complexity). Avoid simplistic "label=good" or "label=bad". Discuss nuance with editor.
  9.  **Question:** *Could this depiction inadvertently provide a harmful roadmap or validation for unsafe behavior?* (e.g., romanticizing self-diagnosis without caveats, detailing self-harm methods, portraying ineffective/dangerous coping as successful).
      *   **Sufficient Answer:** NO unsafe behaviors are depicted in detail or glorified. Self-diagnosis is shown with significant complexity, struggle, and potential pitfalls. If YES, remove specifics, add context/counterpoints, or reframe.
      *   **Judgment Call:** Balancing realism of character actions vs. potential harm. When in doubt, err towards less detail/less glorification. Discuss with editor.

  **Phase 4: Specific Vulnerability (Values Judgment - Consult Editor/Sensitivity Reader)**
  10. **Question:** *Knowing my YA-adjacent audience includes vulnerable readers seeking validation, does this portrayal:*
      *   a) Offer *any* sense of hope, resilience, or possibility for acceptance/manageable life?
      *   b) Avoid presenting a single, narrow experience as the *only* valid one?
      *   c) Acknowledge the difficulty of accessing competent care (if relevant)?
      *   **Judgment Call:** "Hope" doesn't mean cure or easy fixes. It can mean connection, coping, self-acceptance, or finding support. Nuance is key. (a) is crucial, especially for central characters. (b) & (c) add realism and reduce harm. Discuss balance with editor. **This is the MOST critical point for your sensitivity reader budget.**

  ---

  **Application to Your Cases:**

  **1. The Self-Diagnosing Teenager (DID - Looping Effect Central)**
  *   **Phase 1:** Likely passes unless linking DID directly to violence/evil. Passing.
  *   **Phase 2:**
      *   Q4: Research DID *crucial* (complex trauma origin, rarity, controversy, differentiation from normal dissociation/online trends). Portrayal *should* show misunderstanding/online influence driving her belief. **Sufficient?** If research shows her experience clashes *wildly* with actual DID and this isn't the point (e.g., she has no trauma history, experiences are fantastical), it might need tweaking to show the *gap* between online myth and reality. If the gap *is* the point, it's justified.
      *   Q5: Ensure she has identity beyond the label/search. Passing if developed.
      *   Q6: Show internal complexity – fear, relief, confusion, doubt, obsession. Passing.
  *   **Phase 3:**
      *   Q7: Drama source *should* be the *process* of seeking/claiming the label, its social/self-perception impact, navigating uncertainty – not just "switching" dramatically. **Judgment Call:** Ensure drama comes from looping, not spectacle.
      *   Q8: **This is the core.** Message *must* be complex. Show potential relief *and* limitation/obsession/confusion. Show the label shaping her actions/perception. **Sufficient?** If nuanced looping is shown, YES. If it simplifies to "diagnosis saved her" or "diagnosis ruined her," NO. **Core strength, likely passing.**
      *   Q9: **HIGH RISK AREA.** Does it romanticize/oversimplify self-diagnosis? Does it portray online rabbit holes realistically (confirmation bias, echo chambers)? **Crucial:** Show negative consequences of her belief (strained relationships, misinterpreting normal stress, avoidance of other explanations, potential harm from misdirected "therapy" attempts online). **Judgment Call:** Balance is key. Must show allure *and* peril. **Sensitivity Reader Highly Recommended Here.**
  *   **Phase 4:**
      *   Q10a: Offer hope through connection? Self-discovery *process* (even if misguided)? Resilience in facing confusion? Passing if present.
      *   Q10b: Avoid implying her path is the only DID/struggle path. Passing if other characters/context show diversity.
      *   Q10c: Likely relevant if she seeks/is denied professional help. Shows systemic issues. Passing.
  *   **Verdict:** **KEEP, but handle with extreme care.** The procedure flags **Q9 (Self-Dx Peril/Romanticization)** as the **critical risk requiring nuance and potentially the sensitivity reader slot.** Ensure strong grounding in DID reality vs. online myth. The core looping concept passes if executed with complexity.

  **2. Minor Character with "Textbook" OCD (Warmth Focus)**
  *   **Phase 1:** Passing (unless violence/stereotypes used).
  *   **Phase 2:**
      *   Q4: "Textbook" needs checking. Research subtypes (contamination, harm, symmetry, rumination). Ensure portrayal isn't *just* handwashing/neatness. **Sufficient?** If "textbook" means common *visible* compulsions but lacks internal experience (anxiety, intrusive thoughts), add depth. If accurate spectrum, passing.
      *   Q5: Warmth implies they are a full person. Passing.
      *   Q6: Show internal struggle/anxiety *briefly* to add depth beyond "quirk." Passing if done.
  *   **Phase 3:**
      *   Q7: Drama source? If warmth is focus, conflict likely comes from others' mild misunderstandings or their own gentle frustration, not symptom torture. **Sufficient?** YES, ideal framing.
      *   Q8: Implied message? Label might be mentioned, but message is "person with OCD = worthy of warmth/acceptance." Passing.
      *   Q9: Low risk unless portraying dangerous compulsions as harmless. Passing.
  *   **Phase 4:**
      *   Q10a: Warmth *is* hope/acceptance. Passing.
      *   Q10b: Minor character = one example. Passing if not framed as *the* OCD experience.
      *   Q10c: May not be relevant for minor character. Passing.
  *   **Verdict:** **KEEP.** Procedure reinforces your approach. Main flag is **Q4 (Ensure "Textbook" isn't Stereotypical)**. Add a line hinting at internal anxiety/intrusive thoughts if missing. Low sensitivity reader priority.

  **3. Invented Condition (Symptom Blend for Metaphor)**
  *   **Phase 1:** Passing (unless blended symptoms create harmful tropes like violence).
  *   **Phase 2:**
      *   Q4: **MAJOR FLAG.** Blending real symptoms risks misleading readers who identify with them. **Sufficient Answer?** NO. Real symptoms demand context. **Procedure Says: REWRITE OR REFRAME.**
  *   **Path Forward (Rewrite/Reframe Options - Judgment Call with Editor):**
      *   **Option A (Cut Invention):** Use a real diagnosis that fits the metaphor closely enough.
      *   **Option B (Reframe Explicitly):** Make it clearly *not* a real-world condition. Use fantastical/sci-fi elements. State in-text/narration it's unique/metaphorical. *Disconnect it from real diagnostic language.*
      *   **Option C (Heavy Context):** If metaphor *absolutely* requires blending, explicitly state within the narrative that this is *not* a recognized diagnosis, symptoms can overlap many real conditions, and professional evaluation is key. Acknowledge the character's experience is valid *but not a clinical category*. **High Risk - Sensitivity Reader Essential.**
  *   **Phase 3/4:** Irrelevant unless rewritten/reframed. If kept as blend without context, Q9/Q10 become high risk (misinformation, false validation).
  *   **Verdict:** **Procedure Demands REWRITE OR REFRAME (Q4).** This is the portrayal most likely to cause unintended harm through misidentification. The "procedure tells you something you won't like." Choosing Option C requires your **sensitivity reader slot** and careful discussion with your editor about necessity vs. risk.

  **Key Takeaways & What the Procedure Can't Settle:**

  1.  **Non-Negotiables (Phase 1):** Your cases likely pass, but these are absolute red lines.
  2.  **The DID Protagonist:** The procedure *supports* your core concept but **shines a harsh light on the risks around self-diagnosis portrayal (Q9)**. This needs the most care and is the strongest candidate for your sensitivity reader.
  3.  **The OCD Character:** The procedure validates your approach but reminds you to **avoid "textbook" meaning "stereotypical" (Q4)**. Add subtle internal depth.
  4.  **The Invented Condition:** The procedure is **most stringent here (Q4)**. Blending real symptoms without clear disclaimers is flagged as potentially harmful misinformation. You must change it significantly or accept high risk.
  5.  **Judgment Calls (Where it Hands Off):**
      *   The *degree* of nuance needed in the DID looping portrayal (Q8, Q9).
      *   The *balance* between realism and potential harm in depicting self-diagnosis pitfalls (Q9).
      *   The *necessity and execution* of reframing the invented condition (Options A-C).
      *   The *weight* given to offering hope vs. realism (Q10a).
      *   Prioritizing which character gets the sensitivity reader.
  6.  **What It Can't Do:**
      *   Guarantee your portrayal won't upset anyone.
      *   Replace deep cultural competence or lived experience insight (hence sensitivity readers).
      *   Make the final call on artistic merit vs. potential harm – that's your and your editor's ethical responsibility.
      *   Account for future changes in diagnostic understanding or cultural sensitivity.

  **Run this procedure scene-by-scene for the relevant characters. Be brutally honest with your answers. Your awareness of the risks and desire for a tool are your greatest assets in navigating this responsibly.** Good luck with the novel!
