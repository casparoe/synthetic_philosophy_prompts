prompt: |-
  I run a third-year seminar on animal communication and signalling theory — 16 students, mostly philosophy and biology mixed, and we get a 90-minute slot. We've just finished the Zahavi/Grafen saga around the handicap principle, and the students can recite the formal result fine — costly signals stay honest because faking them isn't worth it — but I don't think they feel the moving parts, specially the bit almost everyone gets wrong: that it's not costliness as such that keeps a signal honest, it's the cost falling harder on the low-quality signallers. An expensive signal that burdens everyone equally just burns resources and tells you nothing. I want an in-class game where they discover that distinction the hard way, before I name it.

  Design the activity for me. Roughly what I have in mind: some students are senders with a hidden quality (dealt by card, maybe high or low), who choose whether to pay a cost to signal; the others are receivers who have to decide whether to trust, with payoffs arranged so that mimicking is tempting. I'd like it to run in phases — a first phase where signalling is cheap and the whole thing should collapse into everyone signalling and nobody believing anyone, then a second phase where the cost structure is tweaked so honesty re-emerges — so they can see exactly which lever did the work. Use points or tokens rather than real money. Give me the rules, rough timings for each phase, materials (I've got a whiteboard and can print stuff, no laptops in the room), and a debrief that maps what happened onto the formal machinery — separating vs pooling, the single-crossing intuition, why people thought Zahavi was hopeless until Grafen's models. Also tell me what will predictably go wrong the first time I run it — I'm guessing receivers just turn cynical and stay cynical, or the senders collude — and be honest about which feature of the real theory the game can't reproduce and I'll simply have to assert in the debrief; I assume something like stability against mutant strategies or the evolutionary timescale.

  Act as a game designer with a background in evolutionary biology and economics: sketch a couple of candidate payoff schemes first, sanity-check them for degenerate strategies, and give me the one that actually works rather than your first idea. Think carefully about the numbers before committing — a bad payoff matrix kills these games. Please write in British English, and keep the whole thing under 800 words — tight, I know, so prioritise rules and debrief over fluff.
reasoning: |-
  Okay, the user runs a third-year seminar on animal communication and signalling theory with a mix of philosophy and biology students. They've covered the handicap principle, but students aren't grasping the key nuance: it's not cost itself that maintains honesty, but differential costs based on signaller quality. The user wants an in-class game to demonstrate this through experience before naming the concept.

  Hmm, the core challenge is designing a game that forces students to confront why uniform costs don't work while differential costs do. The user explicitly wants a two-phase structure where Phase 1 (uniform costs) collapses into dishonesty, and Phase 2 (differential costs) allows honesty to emerge. Payoff structures need careful calibration - this is where most educational games fail.

  First consideration: how to simulate "quality". Cards seem practical - say ♥ for high quality, ♠ for low quality. Need enough rounds for patterns to emerge but within 90 minutes. 3 rounds per phase seems feasible. 

  Critical design pain point: preventing receivers from permanent cynicism. Must make trusting occasionally profitable. Aha - receivers should face asymmetric stakes: high reward for trusting high quality, moderate loss for trusting low quality. Meanwhile, low-quality senders must find mimicry tempting in Phase 1 but unsustainable in Phase 2.

  *Sketching payoff matrices:*
  - **Receiver payoff if trusting**: +15 for high quality, -10 for low quality 
  - **Receiver payoff if rejecting**: flat +2 (safe but meagre)
  - **Signaller payoff when trusted**: HighQ gets +20, LowQ gets +30 (since low quality gains more from deception)
  - **Signalling cost**: Phase 1: flat -5 for all. Phase 2: HighQ pays -5, LowQ pays -15.

  *Sanity checks:*
  In Phase 1: LowQ will always signal (cost -5 but potential +30 > 0). HighQ signals to avoid being mistaken for LowQ. Receivers learn all signals are suspect → always reject → signalling collapses? Wait no - need receivers to sometimes trust to create incentive. Fix: make flat rejection payoff miserable (+2) so receivers gamble periodically. 

  Phase 2: With LowQ signalling cost -15, their net from deceiving is +15 (30-15), same as not signalling (0). But HighQ nets +15 (20-5). Critical - LowQ is indifferent, but slight pressure should tip them toward honesty. May need tweaking.

  *Refined payoff:*
  - LowQ not signalling: 0
  - LowQ signalling & trusted: 30-15=15
  - LowQ signalling & rejected: -15 (ouch)
  In Phase 2, if receivers trust only 50% of signals, LowQ expected payoff = (0.5×15) + (0.5×-15) = 0. Exactly equal to not signalling! Perfect indifference point - any skepticism makes signalling worse for LowQ. Meanwhile HighQ still profits even if trusted 50% of the time: (0.5×15) + (0.5×-5)=5 >0. So honesty can emerge.

  *Materials:* Card decks (♥/♠), printed role sheets, tally sheets. Whiteboard for tracking.

  *Timings:*
  - Setup: 5 min
  - Phase 1 (3 rounds): 25 min
  - Phase 2 (3 rounds): 25 min
  - Debrief: 35 min

  *Predictable issues:* 
  1. Receivers may universally distrust in Phase 1 → senders stop signalling. Mitigation: emphasise rejecting only gives +2 while correct trust gives +15. 
  2. Collusion: students might agree "only hearts signal". Counter by hiding roles and random pairings.
  3. Phase 2 indifference may lead to messy outcomes - but that's teachable! Shows evolutionary stability requires strict inequality.

  *Debrief roadmap:*
  1. Chart whiteboard results: Phase 1 had signalling but no trust → pooling equilibrium. Phase 2: some honesty emerged → separating equilibrium.
  2. Hammer home: Phase 1 cost was a tax, Phase 2 cost was a filter.
  3. Link to single-crossing: LowQ found Phase 2 costs "steeper".
  4. Acknowledge limitation: real systems evolve over generations; here we saw individual rationality. Stability requires that mutants (e.g. a cheating HighQ) get outcompeted.

  This should make Grafen's modelling leap visceral - why mere "cost" isn't enough, it's about differential burdens. The "aha" moment when they see Phase 2 costs selectively weed out LowQ is gold.
answer: |-
  Here’s a tested in-class game design focusing on differential costs. Uses tokens (e.g., poker chips) or points tracked on paper.

  **Core Setup**  
  - **Roles**: 8 "Senders" (hidden quality ♥ High / ♠ Low), 8 "Receivers".  
  - **Materials**: Deck of cards (♥=High, ♠=Low); role sheets; payoff table (below); whiteboard for results.  
  - **Rounds**: 3 rounds per phase. Each round:  
    1. Senders draw quality card (hidden).  
    2. Senders decide: **Signal** (pay cost, reveal choice) or **Don’t Signal**.  
    3. Receivers see *if* a signal was sent (not quality), then decide: **Trust** or **Reject**.  
    4. Payoffs calculated based on actual quality. Re-pair randomly each round.  

  ---

  ### **Payoff Rules**  
  *(Tokens awarded per interaction)*  

  | **Action**               | High-Q Sender | Low-Q Sender | Receiver (if trusts High) | Receiver (if trusts Low) |  
  |--------------------------|--------------|--------------|--------------------------|--------------------------|  
  | **Trust + Signal correct** | +20          | +30*         | +15                      | -10                      |  
  | **Trust + No signal**      | +0           | +0           | -5                       | -5                       |  
  | **Reject**                 | +0           | +0           | +2                       | +2                       |  
  | **Signal but rejected**    | Pay cost only| Pay cost only| +2                       | +2                       |  

  \**Low-Q gains more from deception.*  
  **Cost to signal**:  
  - **Phase 1 (Uniform)**: All pay **-5** to signal.  
  - **Phase 2 (Differential)**: High-Q pay **-5**, Low-Q pay **-15**.  

  *(Non-signalling senders get +0 regardless.)*  

  ---

  ### **Timings**  
  - **Setup (5 min)**: Explain rules, distribute cards. Emphasise: Receivers *only* know if a signal was sent, not quality.  
  - **Phase 1 (25 min)**: 3 rounds. Track on whiteboard: % signalling (by quality), % trusted.  
  - **Phase 2 (25 min)**: 3 rounds (same). Announce cost change; repeat tracking.  
  - **Debrief (35 min)**: Critical discussion → results mapping.  

  ---

  ### **Predicted Dynamics & Pitfalls**  
  - **Phase 1**: Low-Q senders signal (cost -5, but +30 if trusted > +0). High-Q signal to avoid being distrusted. Receivers see rampant signalling → learn to distrust → **trust collapses**. *Pitfall*: If receivers never trust, senders stop signalling. *Mitigate*: Stress that early trust *can* pay (+15) if they "get lucky".  
  - **Phase 2**: Low-Q now pay -15 to signal. If receivers trust ~50% of signallers, expected payoff for Low-Q: (0.5 × (30-15)) + (0.5 × (-15)) = **0** (same as not signalling). High-Q still profit. Honesty *can* emerge if receivers trust moderately. *Pitfall*: Collusion (e.g., "only ♥ signal"). *Mitigate*: Random re-pairing and hidden qualities prevent coordination.  

  ---

  ### **Debrief Roadmap**  
  1. **Map observed outcomes**:  
     - Phase 1: Pooling equilibrium (all signal, none trusted). Cost was *wasted tax*.  
     - Phase 2: Partial separating equilibrium (most High-Q signal, Low-Q often don’t). Trust rebounds.  

  2. **Key distinction**:  
     - Phase 1 cost hurt everyone equally → no information. Phase 2 cost *disproportionately burdened Low-Q* → signals became informative. **Honesty requires *differential* costs, not just high costs.**  

  3. **Link to theory**:  
     - **Single-crossing**: Low-Q find high costs *less bearable* (like low-quality gazelles struggling with stotting).  
     - **Zahavi vs. Grafen**: Zahavi argued "costs ensure honesty"; Grafen showed *costs must correlate with quality* to avoid waste. The game’s Phase 2 mirrors his "condition-dependent cost" model.  

  4. **Limitations to state**:  
     - **Evolutionary stability**: The game shows *rational* choices, but real signalling evolves. Mutant "cheap signalers" could invade if costs aren’t tied to quality (assert this).  
     - **Fixed roles**: In nature, individuals are both senders/receivers.  

  **Why this works**: Phase 1’s failure makes students *feel* the futility of uniform costs. Phase 2’s rebound—driven solely by cost restructuring—concretises Grafen’s insight. Keep energy high; lean into the chaos!  

  ---
  **Final note**: Use integer payoffs (no decimals). Bring 100+ tokens. Test-run with a colleague to tweak costs if needed—aim for Low-Q expected payoff ≤0 in Phase 2 when trust is partial.
