prompt: |-
  My friend and I have been arguing about the franchise for the better part of a year — she read philosophy, I'm reading public policy — and I've started to notice that her positions across a series of cases form a pattern I can't quite pin down. Over that time she has come down firmly as follows: long-settled non-citizen residents (people who have lived, worked and paid taxes in this country for two decades without ever taking citizenship) should be allowed to vote both in local council elections and in national parliamentary ones; tourists and seasonal workers on visitor visas should not be allowed to vote in anything; citizens who emigrated thirty years ago, hold no property here and no longer pay taxes should lose their vote in our elections; convicted prisoners serving their sentences should keep the vote; and once someone is enfranchised, she thinks voting should be made compulsory, backed by a modest fine for abstention. Next month our city holds a referendum on whether to close several schools and reroute the bus network, and the council is considering a one-off extension of the franchise for that referendum to sixteen- and seventeen-year-olds, who would otherwise remain excluded.

  I'm less interested in her eventual answer than in the underlying rule. As far as I can tell, more than one principle would rationalise everything she has said so far — perhaps something like "everyone whose interests are governed by a body for a sustained period gets a say in that body", perhaps something like "the vote attaches to full membership of the cooperative scheme, that is, to those who bear its duties", perhaps something else entirely. My suspicion is that these rules come apart precisely on the referendum question, since teenagers are plainly affected by school closures and bus routes but bear few of the duties of membership — yet I can't tell which way her commitments cut, and I worry that she could answer either way and still be consistent with herself.

  Could you therefore predict her verdict on extending the vote to the sixteen- and seventeen-year-olds for this referendum? In doing so, please lay out the candidate rules that fit her track record, say which rule you think she is tacitly running and why, give your best guess with your reasons for preferring it, and propose the single further case — involving, if you like, expatriate property owners, newborn citizens, or a sixteen-year-old who has left school and works full time — that would best discriminate between the rules you identify. Please write your answer in British English.
reasoning: |-
  Okay, the user has presented a fascinating puzzle about their friend's voting franchise positions. They describe a year-long debate where the friend has taken specific stances on various voting rights scenarios, and now there's an upcoming referendum where the city might extend voting to 16-17 year olds. The user wants to predict the friend's position based on underlying principles, not just get the answer.

  First, I need to map out the friend's established positions:
  - Long-term non-citizen residents (20+ years, working/paying taxes) should vote in both local and national elections
  - Tourists/seasonal workers on visas shouldn't vote at all
  - Emigrated citizens (30 years abroad, no property/taxes) should lose voting rights
  - Prisoners should keep voting rights
  - Compulsory voting with fines for abstention once enfranchised

  The user suggests two possible principles: 
  1) "Interests governed" principle (voting based on being affected by decisions)
  2) "Cooperative scheme membership" principle (voting based on bearing societal duties)

  Looking at the positions:
  - Long-term residents clearly meet both criteria (affected and bearing duties)
  - Tourists fail both (not deeply affected, no duties)
  - Emigrated citizens are interesting - they're still citizens but the friend thinks they shouldn't vote. This leans toward the "duties" principle since they're no longer bearing burdens
  - Prisoners keeping votes suggests the "affected" principle outweighs their temporary inability to bear full duties
  - Compulsory voting points toward voting as a duty of membership

  The referendum case with 16-17 year olds is where it gets tricky. Teenagers are definitely affected by school/bus decisions, but typically don't bear full societal duties (taxes, etc.). This seems like the perfect case where the two principles might diverge.

  I notice the friend emphasized "sustained period" for non-citizens and "no longer" for emigrants - there's a temporal dimension. For teens, this referendum is a one-off, but school closures have long-term effects. 

  The compulsory voting point suggests the friend sees voting as linked to membership duties. Prisoners are an exception that proves the rule - they're still members even while incarcerated. Teens aren't yet full members.

  My best guess is she'll oppose extending the vote to 16-17 year olds because they don't yet bear the full duties of membership (like paying income tax). But to test this, the clearest discriminator case would be a 16-year-old who's left school and works full-time - they're paying taxes and bearing economic duties, which might qualify them under the "cooperative scheme" principle.
answer: |-
  Based on your friend's track record, I'd analyse her positions as follows:

  **Candidate Rules Fitting Her Track Record:**

  1.  **The 'Sustained Subjection to Authority' Principle:** Voting rights belong to those who are *routinely and substantially governed* by a political body's decisions over a significant period, regardless of formal citizenship status. This focuses on being *impacted*.
      *   *Fits:* Long-term residents (subject to laws/taxes daily), Prisoners (directly subject to state authority), excluding tourists (temporary/insignificant impact) and long-absent citizens (no longer subject).
      *   *Less Clear Fit:* Compulsory voting seems an add-on obligation, not directly about impact.

  2.  **The 'Full Membership in the Cooperative Scheme' Principle:** Voting rights belong to those who are *active, contributing participants* bearing the core duties (especially paying taxes and obeying laws) of the societal cooperative venture for a sustained period, thereby earning a say. This focuses on *contribution/burden-bearing*.
      *   *Fits:* Long-term residents (pay taxes, obey laws), excluding tourists (no contribution), long-absent citizens (ceased contributing), compulsory voting (framed as a duty of membership).
      *   *Less Clear Fit:* Prisoners (they obey laws *within* prison, but their incarceration often suspends full tax-paying and societal participation; her inclusion suggests contribution isn't solely economic).

  3.  **A Hybrid 'Subjection & Contribution' Principle:** Voting rights belong to those who are both *significantly governed by* and *significantly contributing to* (through taxes/law-abiding) the political community *on an enduring basis*. This combines impact and obligation.
      *   *Fits:* Long-term residents (both subject and contribute). Tourists excluded (neither sufficiently). Long-absent citizens excluded (no longer contribute, minimally subject). Prisoners included (highly subject, arguably contributing through lawful behaviour *within* the scheme, or their inclusion overrides the contribution aspect due to extreme subjection). Compulsory voting fits as a duty flowing from this membership status.

  **Identifying the Tacit Rule:**

  While the 'Subjection' principle explains prisoners and the 'Contribution' principle explains compulsory voting and excluding absent citizens, the **Hybrid 'Subjection & Contribution' Principle** best reconciles the *totality* of her positions, particularly:
  *   **Long-term residents:** Explicitly links residency, tax-paying (contribution), and being governed (subjection).
  *   **Long-absent citizens:** Loss of vote hinges on ceasing contribution (no taxes) *and* minimal subjection (not governed by daily laws).
  *   **Prisoners:** Their extreme subjection to state authority appears to override the potential lack of full economic contribution. Their inclusion is consistent if "contribution" includes adherence to the legal order, even under compulsion.
  *   **Compulsory Voting:** Frames voting as a core *duty* inherent in the status of membership earned through sustained subjection and contribution.

  **Prediction for the Referendum (16- & 17-Year-Olds):**

  I predict your friend would **oppose** extending the franchise to 16- and 17-year-olds for this one-off referendum.

  *   **Reasoning (Based on Hybrid Principle):** While teenagers are undeniably *affected* by school and bus decisions (strong "subjection" argument), they generally fail the "sustained contribution" test central to her hybrid principle.
      *   **Lack of Sustained Contribution:** Most 16-17 year olds do not pay income tax (a key duty she highlighted for residents), are rarely significant property taxpayers, and are typically still dependents within the household/education structure rather than fully independent economic contributors to the cooperative scheme. Their primary societal "duty" is education, not the tax-paying, law-abiding contribution of full members.
      *   **"Sustained Period" & "Full Membership":** Her emphasis on "long-settled" residents (20 years) and excluding citizens after a long absence (30 years) shows a focus on *enduring* status, not transient impact. Teenage status is inherently transitional; they haven't yet established the enduring, contributory membership she requires.
      *   **One-Off Nature vs. Principle:** Granting the vote for a single referendum directly conflicts with her emphasis on *sustained* subjection and contribution as the basis for enfranchisement. It risks looking like an *ad hoc* inclusion based purely on impact for a specific issue, which her other positions resist (e.g., excluding tourists who might be temporarily impacted by a local decision).
      *   **Compulsory Voting Angle:** Her support for compulsory voting implies she sees it as a serious duty attached to a weighty right. Extending the franchise flippantly for one vote, only to remove it immediately after, likely seems inconsistent with the gravity she assigns to both the right and the duty to vote.

  **The Discriminating Case:**

  The single best case to discriminate definitively between the "Subjection" principle and the "Hybrid Subjection/Contribution" principle is:

  *   **A 16-year-old who has permanently left full-time education and works full-time, paying income tax and National Insurance contributions, but still lives at home.**

      *   **Why it Discriminates:**
          *   **Under Pure 'Subjection':** This teenager is as subject to the authority of the council and national government (laws, bus routes, school catchment policies affecting siblings, future prospects) as any other resident. They should be enfranchised.
          *   **Under 'Hybrid Subjection/Contribution':** While significantly subject, they *are now bearing the core duty of tax-paying* associated with full membership in the cooperative scheme. However, the "sustained period" aspect is weak – they've only just started. Would the recency/lack of endurance disqualify them, despite meeting the contribution criterion? If she supports enfranchising this teen specifically *because* they are now a tax-paying worker, it strongly confirms the Hybrid principle (and suggests the "sustained period" might be flexible for those demonstrably contributing). If she still opposes it due to age or lack of long-term contribution, it reinforces the Hybrid principle's emphasis on enduring status over immediate circumstance.
          *   **It Tests the "Duties" Core:** This case directly probes whether paying income tax (the duty she explicitly cited for non-citizens) is the key marker of contributory membership, sufficient to overcome the transitional status of adolescence, even if other "adult" duties (like independent householding) aren't fully present. It isolates the contribution element within the teenage group.

  Her answer to this specific case would reveal whether the *contributory element* (tax-paying as a core duty) is the decisive factor overriding the transitional status of youth within her hybrid framework, or whether the *enduring, established status* of "full membership" (which teenagers, even working ones, arguably haven't yet attained) remains paramount. It cuts directly to the core of the "cooperative scheme" aspect of her reasoning.
