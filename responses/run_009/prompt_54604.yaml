prompt: |-
  So I'm a backend engineer at a small health-tech startup (we do sleep and wellness tracking, not dna tests, but our content team likes to cite genetics stuff because it sounds sciencey). I've somehow become the person who signs off on science claims in our app copy and blog posts, mostly because everyone else is even less qualified than me, and I have zero background in this -- I took one stats course. Lately I keep getting hit with heritability numbers. Like "height is 80% genetic," "sleep duration is 40% heritable," or someone found a study saying some trait is "50% inherited" and wants to build a whole feature or blog post around it. I can tell these numbers get abused constantly but I couldn't tell you exactly where the line is between a legit use and a misuse.

  What I want is a decision procedure I can actually run, in like 15-20 minutes per claim, sitting at my desk before standup. Something like: the questions to ask about the claim in order, what a sufficient answer to each looks like, and where the procedure tells me "no, this claim can't go in the copy" vs where it says "this one's a judgment call, escalate it" (we do have an advisor I can email but she's slow, so I only want to bother her when it matters).

  The kind of thing I suspect matters but want you to make rigorous and usable: heritability being about variance in a population not a blueprint for an individual, the number depending on how much environmental variation there is in that population, whether the claim quietly slides from "individuals differ" to "groups differ," whether it slides from "heritable" to "unchangeable," twin study assumptions, that kind of thing. But figure out what actually matters and what's just noise for my use case.

  Then run the procedure on three real-ish claims I've actually seen lately: (1) a PM wants copy saying "your sleep timing is partly genetic, so if you're a night owl, don't fight it," citing a heritability estimate for chronotype; (2) a blog draft saying "IQ is highly heritable, which tells us education matters less than people think"; (3) marketing wants "sleep duration is 40% heritable" as a fun fact stat in an infographic, nothing more. Be honest about where my 15 minutes runs out and I'm just guessing, and about what the procedure can't settle at all. Also please don't give me a reading list -- our style guide people will just ask me for links I can't evaluate. I need the actual checklist, worked through those three examples.
reasoning: |-
  Alright, let me try to unpack this user's problem. They're a backend engineer at a health-tech startup, suddenly responsible for vetting science claims about genetics and heritability. Their team cites genetics to sound "sciencey," but the user has no background in this—just one stats course. They need a quick, practical checklist to evaluate heritability claims in 15-20 minutes before standup. 

  First, I need to understand their real pain points. They mentioned examples like "height is 80% genetic" or "sleep duration is 40% heritable." The core issues are misuse of heritability numbers—confusing population variance with individual destiny, ignoring environmental factors, sliding from "heritable" to "unchangeable," and group differences. The user wants a clear decision procedure, not academic depth. They also emphasized no reading lists; they need actionable steps.

  So, what are the critical questions to ask? Heritability is population-specific, measures variance, not individual determinism, and isn't immutable. The procedure must flag when claims overstep these boundaries. The examples they provided are perfect test cases: chronotype advice, IQ and education, and a standalone heritability stat. 

  For the checklist, each question needs to be binary or have clear red flags. Time is tight, so steps must be sequential, with exit points. Key elements: what population the study used, whether the claim implies individual determinism, if it confuses heritability with unchangeability, or if it shifts to group differences. Also, check if the number is from a twin study (which has assumptions) or if it's misapplied (e.g., between groups). 

  Applying this to their examples: 

  1. Chronotype claim: "Your sleep timing is partly genetic, so if you're a night owl, don't fight it." The problem here is the leap from "partly genetic" to "don't fight it." Heritability doesn't mean unchangeable, and the advice could discourage healthy adjustments. Red flag. 

  2. IQ heritability linked to education mattering less. This confuses heritability with fixedness. High heritability in a population doesn't mean interventions like education are ineffective. Also, group differences (e.g., by race) are a misuse. Another red flag. 

  3. "Sleep duration is 40% heritable" as a fun fact. Without context, it might be okay, but heritability numbers without qualifiers are misleading. Need to add a disclaimer about population variance and environmental factors. Yellow flag—proceed with caution and add context. 

  The user’s deeper needs? They want to prevent misleading claims without becoming an expert. They need to offload complex cases to an advisor efficiently. The checklist must be quick, with clear "stop/go" signals. Also, acknowledging where 15 minutes isn't enough (e.g., nuanced study flaws) is crucial. They need confidence to push back on teams with simple, justifiable reasons. 

  Finally, ensuring the procedure is memorable. Using terms like "Determinism Alarm" and "Group Difference Siren" makes it stick. Emphasizing that "heritable ≠ unchangeable" as a mantra. The examples show how each step catches issues, building the user's confidence to say no or seek help when needed.
answer: |-
  Here's a science-claim sanity checklist designed for speed, based on critical heritability misconceptions. Aim for **< 15 minutes** per claim. If you hit a red flag, **reject or demand rewrite**. If it's complex but no red flags, **escalate**.

  ---

  ### **The Heritability Claim Sanity Check (5-Minute Drill)**
  **Ask these questions IN ORDER. Stop at first red flag.**

  1.  **🔍 Population Context: "Where and When was this measured?"**
      *   *What you need:* Study population description (e.g., "Swedish adults in 2010", "US twins born 1950-1970"). Sufficient = Country/region + rough timeframe + demographics mentioned.
      *   *Red Flag:* No population info, or population is wildly different from your users (e.g., using a study on 70yo Finnish men for advice to 30yo US women). Heritability is **population-specific**.
      *   *Why it matters:* Heritability estimates depend on the *environmental variation* in that specific population at that time. A high number in one group doesn't mean it's high everywhere.

  2.  **🚫 Determinism Alarm: "Does this imply genes = destiny?"**
      *   *What you need:* Scan for words like "so", "therefore", "just", "accept", "can't change", "hardwired", "blame your genes", or advice implying resistance is futile.
      *   *Red Flag:* **YES.** Any phrasing suggesting high heritability means an individual trait is fixed or unchangeable, or that effort to change it is pointless. **Heritability ≠ Immutability.**
      *   *Why it matters:* Heritability measures *current variation* in a *specific environment*. Environmental changes (e.g., light therapy, strict schedules, education reforms) can drastically alter outcomes *even for highly heritable traits*.

  3.  **🧬 Group Difference Siren: "Is this being used to explain differences BETWEEN groups?"**
      *   *What you need:* Look for comparisons like "Group A vs. Group B", mentions of race, ethnicity, nationality, socioeconomic status, or any implication that heritability *within* groups explains average differences *between* groups.
      *   *Red Flag:* **YES.** Heritability estimates **cannot** be used to explain average differences between groups (e.g., "IQ heritability is high, so group differences must be genetic"). This is a fundamental misuse.
      *   *Why it matters:* Group differences could be entirely environmental, even if the trait is highly heritable *within* each group.

  4.  **📊 Variance Check: "Is 'heritable' being confused with 'inherited' or used like a personal score?"**
      *   *What you need:* Check if the text treats the % as a personal genetic contribution ("*Your* sleep is 40% genetic") or implies it's a fixed recipe ("inherited" instead of "heritable").
      *   *Red Flag:* Using "inherited", framing the % as part of an individual's immutable makeup, or implying you can calculate your personal "genetic percentage". Heritability is about **population variance**, not individual inheritance.
      *   *Why it matters:* The 40% doesn't mean 40% of *your* sleep duration is caused by genes and 60% by environment. It means 40% of the *differences observed between people in that study population* were associated with genetic differences.

  5.  **🔬 Study Type Caution: "Is this based *only* on twin studies?"** (*If you have 2 extra minutes*)
      *   *What you need:* Quick glance at the study method (often in abstract). Does it *only* say "twin study" or "ACE model"?
      *   *Yellow Flag (Escalate):* **YES (and the claim is strong/actionable).** Twin studies make big assumptions (equal environments for MZ/DZ twins). Modern genomics often finds lower estimates. Not an automatic reject, but be wary, especially for complex traits like behavior or IQ. Escalate for nuanced review.
      *   *Why it matters:* Twin studies can overestimate heritability if assumptions are violated. Replication with other methods (family, GWAS) is better.

  **OUTCOME:**
  *   **Any Red Flag:** **STOP. REJECT/REDACT.** Claim is scientifically invalid or highly misleading. Demand rewrite that removes the red-flag phrasing or don't use it.
  *   **Yellow Flag (Twin Study + Actionable Claim):** **ESCALATE.** Needs expert eye.
  *   **No Flags, Just Stating the Stat:** **PROCEED WITH CAUTION.** Might be okay *if* context is purely descriptive ("studies suggest...") and avoids determinism/group comparisons.
  *   **Unclear/Messy Study:** **ESCALATE.** (You'll hit your time limit here).

  ---

  ### **Applied to Your Examples (Under Time Pressure)**

  **Claim 1: "Your sleep timing is partly genetic, so if you're a night owl, don't fight it." (Citing chronotype heritability ~40-50%)**

  1.  **Population Context:** (Assume study exists on, say, European adults). *Probably OK for now.*
  2.  **Determinism Alarm:** **🚫🚫🚫 HUGE RED FLAG!** "so if you're a night owl, don't fight it" directly implies genes = destiny and effort is futile. **REJECT IMMEDIATELY.**
      *   *Why:* Heritability doesn't mean you can't successfully manage chronotype with light exposure, schedule adjustments, etc. This advice could be harmful.
      *   *15-Minute Verdict:* **REJECT.** Done in Step 2. No need to go further. Tell PM: "Heritability doesn't mean unchangeable. This phrasing discourages healthy adaptation strategies known to work. Remove the 'so don't fight it' advice."

  **Claim 2: "IQ is highly heritable, which tells us education matters less than people think."**

  1.  **Population Context:** (IQ heritability often studied in Western populations). *Probably OK for now.*
  2.  **Determinism Alarm:** **🚫 RED FLAG!** "...education matters less" directly implies high heritability means environmental interventions (education) are ineffective. **REJECT.**
      *   *Why:* The Flynn Effect (rising IQ scores over generations) proves environment (including education, nutrition, etc.) massively impacts average IQ, *even while heritability estimates within cohorts remain high*. Heritability says nothing about the potential impact of changing the environment.
      *   *15-Minute Verdict:* **REJECT at Step 2.** Tell blog author: "High heritability within a group doesn't mean environment is powerless. Historical data shows average IQ changes significantly with environmental improvements. This claim misinterprets heritability."

  **Claim 3: "Sleep duration is 40% heritable" (Fun fact in infographic)**

  1.  **Population Context:** *Likely missing.* **🚫 RED FLAG!** Without context, this number is meaningless and potentially misleading. Which population? When?
  2.  **Determinism Alarm:** Phrasing itself is neutral. *No explicit determinism.*
  3.  **Group Difference Siren:** No group comparison. *OK.*
  4.  **Variance Check:** Uses "heritable" correctly. *OK.*
  5.  **Study Type:** *No time/not triggered.*
      *   *15-Minute Verdict:* **REJECT at Step 1.** Tell marketing: "Heritability numbers require context to be meaningful and not misleading. We need to add the population studied (e.g., 'in studies of US adults'). Just slapping '40% heritable' out of context implies it's a universal, fixed number, which it isn't." **OR** if they *must* have it, demand: "Sleep duration heritability estimated at ~40% in [Specific Population, e.g., UK Twins]." (This pushes the time limit slightly, but Step 1 was quick).

  ---

  **Where 15 Minutes Runs Out & Limitations:**

  *   **Deep Study Critique:** You won't have time to evaluate study methodology (beyond spotting "twin study"), sample size adequacy, potential biases, or replication status. The checklist flags *common conceptual misuses*, not necessarily flawed science *behind* the number itself. If a claim passes the checklist but feels "off," **escalate**.
  *   **Nuanced "It Depends":** The checklist catches blatant misuse. Sometimes the issue is more subtle implication or lack of necessary nuance. If you're uneasy even after no flags, **escalate**.
  *   **"Heritability" vs. "Genetic":** The checklist focuses on "heritability" claims. Vague claims like "genetic" without citing a heritability stat are harder but should still trigger **Determinism Alarm** and **Group Difference Siren**.
  *   **GWAS & Polygenic Scores:** Modern genetics uses these. A claim like "Your polygenic score predicts X" is different. If you see "polygenic score," **ESCALATE** immediately – it's complex and easily misinterpreted. The checklist isn't designed for this.

  **The Mantra:** **Heritability describes variation in a specific population, NOT destiny, NOT immutability, and says NOTHING about differences between groups.** If a claim violates this, reject it. Your 15 minutes protects your users from bad science. Good luck!
