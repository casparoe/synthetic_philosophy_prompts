answer: |-
  Below is a complete lesson plan for a 90-minute seminar on counterfactual mugging (CM) and XOR blackmail (XB), designed for 12 third-year students. The plan uses chocolate (small bars or pieces) and bonus quiz points (each point = one chocolate bar equivalent) as stakes. Key goals include making precommitment consequences vivid and exposing the disanalogy between CM and XB through experiential learning. The structure uses sealed policy cards and a single coin flip affecting all students simultaneously to maximise engagement and ex post reflection.

  ---

  ### **Lesson Plan: Counterfactual Mugging and XOR Blackmail**

  **Materials Needed:**
  - 15-20 chocolate bars (or equivalent in small chocolates).
  - 12 sealed envelopes and policy cards (small paper slips).
  - 1 coin (e.g., 50p piece).
  - Whiteboard/flip chart.
  - Spreadsheet for tracking points (or pen/paper).
  - Timer.

  **Stakes:**
  - Points system: Use positive/negative points redeemable for chocolate at the end.
    - 1 point = 1 chocolate bar (or fraction).
    - Negative points = chocolate deducted from a starting endowment (e.g., everyone starts Phase 1 with 1 chocolate for CM; no starting endowment for XB).
  - Bonus quiz points: Award 1–3 points to highest scorers post-game (optional).

  **Setup:**
  - **Roles:** All students act as "agents." The instructor plays the "Predictor" (for CM) and "Blackmailer" (for XB). A student volunteer flips the coin.
  - **Policy Cards:** Students write policies *before* roles or coin flips. Policies are binding to simulate precommitment.
  - **Single Coin Flip:** One coin flip per phase determines the "world state" for all students. This creates shared ex post experiences (e.g., all live in a "heads" world together).
  - **Analogy Limits:**  
    - Real predictors would know policies *before* the coin flip and tailor interactions. Here, policies are only revealed *after* the flip, weakening the "perfect prediction" analogy.  
    - Flag this upfront: *"In reality, predictors like Omega condition their actions on your policy. Today, we simplify by using the coin flip first."*

  ---

  #### **Phase 1: Counterfactual Mugging (40 minutes)**  
  *Goal: Experience how precommitting to "Pay" is beneficial ex ante but may cause ex post regret in "heads" worlds.*

  **Minute-by-Minute:**  
  1. **Introduction (0–5 min):**  
     - *"Today, you’ll face two scenarios. First: a counterfactual mugging. A predictor flips a coin and may ask you for chocolate. Your sealed policy card binds you—no changing your mind. We’ll use real chocolate stakes."*  
     - Explain rules (write on board):  
       - **Coin flip:** Heads (50%) / Tails (50%).  
       - **Policy options:** "Pay" or "Don’t Pay" (for if asked).  
       - **Payoffs:**  
         - **Heads:** "Pay" = –1 point, "Don’t Pay" = +1 point.  
         - **Tails:** "Pay" = +9 points, "Don’t Pay" = 0 points.  
       - *(Note: "Heads: Pay = –1" simulates the cost of maintaining a commitment device.)*  

  2. **Policy Cards (5–10 min):**  
     - Distribute cards/envelopes. Students write **name and policy** ("Pay" or "Don’t Pay"), seal envelopes, and hand to instructor.  

  3. **Coin Flip & Payoffs (10–20 min):**  
     - Flip coin publicly. Record outcome (e.g., "Heads").  
     - Open envelopes and read policies aloud. For each student:  
       - Apply payoff based on coin and policy (track points on spreadsheet).  
       - **Example (Heads):**  
         - "Pay" students: –1 point (face immediate loss: hand back 1 chocolate).  
         - "Don’t" students: +1 point (gain 1 chocolate).  
     - *Vividness tactic:* Physically give/take chocolate during tallying.  

  4. **Initial Debrief (20–40 min):**  
     - Poll: *"Who chose 'Pay'? Who chose 'Don’t'?"*  
     - Group discussion:  
       - Ask "Pay" students in Heads: *"How do you feel watching 'Don’t' peers gain chocolate while you lose it?"*  
       - Ask "Pay" students in Tails: *"Do gains justify your policy?"*  
     - Map to theory (whiteboard):  
       - **Ex ante:** Expected value (EV) of "Pay" = (0.5)(–1) + (0.5)(9) = **4**.  
       - EV of "Don’t" = (0.5)(1) + (0.5)(0) = **0.5**.  
       - *"Precommitting to 'Pay' has higher EV—it’s rational ex ante."*  
       - **Ex post:** In Heads, "Pay" feels like a loss. In Tails, it’s a win.  
     - Key insight: *"Updatelessness (precommitment) wins long-term but can sting short-term in some worlds."*

  ---

  #### **Phase 2: XOR Blackmail (35 minutes)**  
  *Goal: Create a superficially identical setup where precommitting to "Pay" is still ex ante optimal but harmful in one world—highlighting the disanalogy (conditionality of evidence).*

  **Minute-by-Minute:**  
  1. **Transition (40–45 min):**  
     - *"Now, a new scenario: XOR blackmail. Same policy options, same coin flip, but different rules. Don’t overthink—just choose."*  

  2. **Policy Cards (45–50 min):**  
     - New cards: Students write **name and policy** ("Pay" or "Don’t Pay"). Seal and submit.  

  3. **Coin Flip & Letter Rules (50–55 min):**  
     - Flip coin. Assign: **Heads = T (True)**, **Tails = F (False)**.  
     - Explain rules (write on board):  
       - **Blackmailer sends a letter IF:** (T is True) XOR (Policy = "Pay").  
         - *XOR definition: "One or the other true, but not both."*  
       - **Payoffs:**  
         - **No letter:** 0 points.  
         - **Letter + "Pay":** –1 point.  
         - **Letter + "Don’t Pay":** –10 points.  
       - Decision table:  
         | **T (Truth)** | **Policy** | **Send Letter?** | **If Letter, Payoff** |  
         |---------------|------------|-------------------|----------------------|  
         | True (Heads)  | Pay        | ❌ No             | N/A (0)              |  
         | True (Heads)  | Don’t Pay  | ✅ Yes            | –10 if not paid      |  
         | False (Tails) | Pay        | ✅ Yes            | –1 if paid           |  
         | False (Tails) | Don’t Pay  | ❌ No             | N/A (0)              |  

  4. **Payoffs (55–65 min):**  
     - Reveal coin result (e.g., "Tails" → T = False).  
     - Open policies. For each student:  
       - Determine if they get a letter (using XOR rule).  
       - Apply payoff.  
       - **Example (Tails):**  
         - "Pay" students: Letter sent → lose 1 point (hand back chocolate).  
         - "Don’t" students: No letter → 0 points.  
     - *Vividness:* In Tails, "Pay" students lose chocolate while "Don’t" students keep theirs.  

  ---

  #### **Debrief and Theory Mapping (25 minutes)**  
  *Goal: Contrast CM and XB, highlighting policy sensitivity and act/policy distinctions.*

  1. **Poll and Confusion (65–70 min):**  
     - *"Raise your hand if CM and XB felt similar during play."*  
     - *"Who thinks both scenarios support updatelessness? Who disagrees?"*  
     - Let students voice contradictions (e.g., *"In XB Tails, 'Pay' lost me chocolate—why precommit?"*).  

  2. **Whiteboard Comparison (70–80 min):**  
     - Draw tables:  
       | **Scenario** | **Ex Ante EV of "Pay"** | **Ex Ante EV of "Don’t"** | **Key Difference**                         |  
       |--------------|--------------------------|----------------------------|--------------------------------------------|  
       | CM           | 4                        | 0.5                        | Coin state **independent** of policy.      |  
       | XB           | –0.5                     | –5                         | Letter **depends** on policy and truth.    |  
     - Theory insights:  
       - **CM:** The coin flip doesn’t depend on your policy. When asked to pay (Tails), you know your action doesn’t affect the world state. Precommitment wins.  
       - **XB:** Letter arrival is *evidence* about T. If you get a letter:  
         - "Pay" policy ⇒ Letter implies T is *False*.  
         - "Don’t" policy ⇒ Letter implies T is *True*.  
         - *Updatelessness fails here: Conditioning on the letter, paying is irrational if you know T is False. But you’re bound by your policy.*  
       - **Disanalogy:** In XB, your policy influences the information you receive (the letter). In CM, it doesn’t.  

  3. **Formal Concepts (80–85 min):**  
     - **Act vs. Policy:**  
       - Act: Choosing in the moment (e.g., *"If I see Tails, I’ll pay"*).  
       - Policy: Precommitment (*"I bind myself to pay regardless"*).  
       - *XB punishes rigid policies when information updates.*  
     - **Ex Post vs. Ex Ante:**  
       - Ex post: In CM Heads, "Pay" *feels* bad. In XB Tails, "Pay" *is* bad.  
       - Ex ante: Both policies are EV-optimal—but for different reasons.  
     - **Subtle Bit:** *"CM’s predictor doesn’t use your policy to create the scenario—it just reacts. XB’s blackmailer uses your policy to decide if you enter the scenario."*  

  4. **Conclusion (85–90 min):**  
     - Award chocolate based on net points (ensure no negative totals).  
     - *"Updatelessness helps in CM but can be exploited in XB because the blackmailer conditions on your policy. Next week, we’ll see how theorists resolve this."*  
     - Optional: Award 1–3 bonus points to top 3 scorers.

  ---

  ### **Predictable Problems and Fixes**  
  1. **Problem:** Students don’t grasp XOR in XB.  
     - **Fix:** Pre-draw the decision table. Use concrete examples: *"If T is True and you chose 'Don’t Pay,' you get a letter because only one is true (XOR)."*  

  2. **Problem:** Coin flip lands the same way twice (e.g., Heads in both phases), muddying contrasts.  
     - **Fix:** Rig the flip if needed (e.g., ensure Phase 1 = Heads, Phase 2 = Tails). Admit it post-game: *"We ensured different outcomes to highlight contrasts—real life isn’t this tidy."*  

  3. **Problem:** Policy cards leak (students peek or confer).  
     - **Fix:** Use opaque envelopes. Collect cards immediately.  

  4. **Problem:** Chocolate distribution takes too long.  
     - **Fix:** Use points initially, distribute chocolate at the end. Assign a student as "banker."  

  5. **Problem:** Students resent ex post losses.  
     - **Fix:** Emphasize: *"This is why these dilemmas are hard! We must separate ex ante reasoning from ex post outcomes."*  

  6. **Problem:** Confusion between CM/XB persists.  
     - **Fix:** Use colour-coded whiteboard headings (e.g., CM in blue, XB in red). Repeat: *"In XB, the letter is evidence; in CM, it’s not."*  

  ---

  ### **Handout Text (British English)**  
  **Counterfactual Mugging Rules**  
  - Policies: Choose "Pay" or "Don’t Pay" (if asked by predictor).  
  - Coin flip: Heads (50%) or Tails (50%).  
  - Payoffs:  
    - **Heads:** "Pay" = –1 point, "Don’t Pay" = +1 point.  
    - **Tails:** "Pay" = +9 points, "Don’t Pay" = 0 points.  
  - *Note: Points = chocolate bars (positive) or deductions (negative).*  

  **XOR Blackmail Rules**  
  - Policies: Choose "Pay" or "Don’t Pay" (if you receive a letter).  
  - Coin flip: Heads = True (T), Tails = False (F).  
  - Blackmailer sends a letter IF: (T is True) XOR (your policy = "Pay").  
  - Payoffs:  
    - **No letter:** 0 points.  
    - **Letter + "Pay":** –1 point.  
    - **Letter + "Don’t Pay":** –10 points.  
  - *XOR = "one or the other true, but not both."*  

  **Key Concepts**  
  - **Ex ante:** Expected value *before* the coin flip.  
  - **Ex post:** Outcome *after* the coin flip.  
  - **Policy vs. Act:** Binding precommitment (policy) vs. choosing in the moment (act).  

  ---  
  This plan ensures students confront the emotional weight of ex post losses while grasping the ex ante rationale for updatelessness. The CM/XB juxtaposition sets up XOR blackmail’s "trap" organically. By the debrief, they should see why conditioning matters—without being told upfront.
