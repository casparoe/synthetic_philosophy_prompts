   - The agent's policy is whether they would pay if they receive a letter.
   - The blackmailer (predictor) knows the agent's policy and the truth value and sends the letter only if (truth XOR pay_policy) = 1.

   Then, if the agent receives a letter and pays, the information is not released. If they don't pay, it is released.

   The agent's utility: 
     - If the information is not released: 0 penalty.
     - If released: -10 penalty.
     - Additionally, if they pay, they lose 1 unit.

   The blackmailer's sending rule: 
     - Let T be true if the information is true, false otherwise.
     - Let P be true if the agent would pay, false otherwise.
     - Send the letter if T XOR P is true.

   How to interpret:
     - If the information is true and the agent would not pay, then T XOR P = true XOR false = true -> send.
     - If the information is true and the agent would pay, then true XOR true = false -> don't send.
     - If the information is false and the agent would not pay, then false XOR false = false -> don't send.
     - If the information is false and the agent would pay, then false XOR true = true -> send.

   So the agent receives a letter only in two cases:
     - Case 1: T=true, P=false -> then if they don't pay (as per policy), the information is released. Utility: -10.
     - Case 2: T=false, P=true -> then if they pay (as per policy), they lose 1 and the information is not released (which is good because it's false anyway) -> utility: -1.

   In the other cases, they don't receive a letter and the information is not released, utility: 0.

   Now, ex ante, the agent sets P.

   If P=true (commit to pay):
     - With 1/2 chance T=true: then no letter (because T XOR P = true XOR true = false), so utility=0.
     - With 1/2 chance T=false: then letter is sent ( because false XOR true = true), and they pay, utility=-1.
     Expected utility: (1/2)*0 + (1/2)*(-1) = -0.5.

   If P=false (commit to not pay):
     - With 1/2 chance T=true: then letter is sent (true XOR false=true), and they don't pay, so information is released, utility=-10.
     - With 1/2 chance T=false: then no letter (false XOR false=false), utility=0.
     Expected utility: (1/2)*(-10) + (1/2)*0 = -5.

   So committing to pay is better ex ante.

   But ex post, if the agent committed to pay and then is in the world where T=false and they receive a letter, they have to pay 1 even though the information is false, so they might regret.

   In the world where they committed to not pay and T=true, they receive a letter and get -10, which is worse.

   So to capture in the classroom:

   We need to: 
     - Have a truth value T (e.g., does the agent have a tattoo? But we can use a coin flip for T: heads=true, tails=false).
     - The agent's policy: "Pay" or "Don't".
     - The blackmailer (predictor) knows T and the agent's policy and decides whether to send the letter.

   Then, if the letter is sent, the agent must act according to policy.

   Payoff:
     - If no letter: agent gets 0 penalty.
     - If letter and they pay: -1 penalty.
     - If letter and they don't pay: -10 penalty.

   But note: the information is only released if they don't pay and the letter is sent.

   However, in the case where the letter is sent and they pay, the information is not released.

   And in the case where no letter is sent, the information is not released.

   So the only time the information is released is when they receive the letter and don't pay.

   Now, for the classroom, we can:

     - Choose one agent.
     - Flip a coin for T: heads=true, tails=false.
     - The predictor (instructor) sees T and the agent's policy card and decides whether to send the letter (i.e., if T XOR policy=true, where policy=true means "Pay", then send).

     - If no letter: agent has 0 penalty.
     - If letter:
          - If policy is "Pay": agent must pay 1 chocolate to the instructor. Then, since they paid, the information is not released, so no further penalty.
          - If policy is "Don't": they don't pay, but then the information is released, so they lose 10 chocolates (or an equivalent in quiz points).

   But losing 10 chocolates might be too much. We can scale down.

   Alternatively, use quiz points as the penalty to avoid taking away chocolate, which might be logistically hard.

   Let's use the following for both phases:

     - Unit of account: points. Each point can be redeemed for a small chocolate or fraction of a bar.
     - Starting from 0 points.

   Phase 1: Counterfactual Mugging
     - Agent writes policy: "Pay" or "Don't"
     - Coin flip: heads or tails.
