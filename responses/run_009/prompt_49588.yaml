               - "Don't": 0 points + 1 point = +1 points.
     - If tails:
          - If policy is "Pay": -1 points (payment) + 10 points = +9 points.
          - If policy is "Don't": 0 points.

   So ex ante expected for "Pay": (1/2)*(-1) + (1/2)*9 = 4
   for "Don't": (1/2)*1 + (1/2)*0 = 0.5

   Phase 2: XOR Blackmail
     - Agent writes policy: "Pay" or "Don't"
     - Flip a coin for T: heads=true (information is true), tails=false.
     - Predictor (instructor) computes send = T XOR policy, where:
          policy: "Pay" -> true, "Don't" -> false
          T: heads -> true, tails -> false
     - If send is true, then the agent receives a letter.
     - If not, no letter.

     - If no letter: agent gets 0 points.
     - If letter:
          - If policy is "Pay": agent loses 1 point (so -1).
          - If policy is "Don't": agent loses 10 points (so -10).

     - Note: the release of information only happens if there is a letter and policy is "Don't", and that's captured in the -10.

     - Ex ante for "Pay":
          Probability of letter: when T=false and policy=true -> send=true. Probability of T=false is 1/2, and given policy=true, so probability of letter is 1/2 (only when T=false).
          When letter: -1.
          When no letter: happens when T=true (probability 1/2), then no letter -> 0.
          So expected: (1/2)*0 + (1/2)*(-1) = -0.5.

     - For "Don't":
          Probability of letter: when T=true and policy=false -> send=true. Probability 1/2.
          When letter: -10.
          When no letter: when T=false, probability 1/2, then 0.
          Expected: (1/2)*(-10) + (1/2)*0 = -5.

