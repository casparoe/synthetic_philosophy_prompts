          false     | Pay    | true
          false     | Don't  | false

    - Time might run out. We can reduce the debrief time or the number of students.

    - The chosen agent might not be representative. By affecting all, we avoid that.

    - In Phase 2, students might question why they lose 10 points for releasing false information. We can explain that the release is harmful regardless (e.g., reputational damage even if false).

    - Students might not take the points seriously. Using chocolate might help.

