   Handout text:

   Phase 1: Counterfactual Mugging

    - You are to write a policy: "Pay" or "Don't".
    - A coin will be flipped.
    - If it lands heads:
          - If your policy is "Pay": you lose 1 point.
          - If your policy is "Don't": you gain 1 point.
    - If it lands tails:
          - If your policy is "Pay": you gain 9 points.
          - If your policy is "Don't": you gain 0 points.

   Phase 2: XOR Blackmail

    - You are to write a policy: "Pay" or "Don't" (for if you receive a blackmail letter).
    - A coin will be flipped to determine the truth value T: heads means true, tails means false.
    - The blackmailer will send you a letter if and only if:
          (T is true) XOR (your policy is "Pay")
          (Remember: XOR is true if one and only one is true.)
    - If you do not receive a letter: you get 0 points.
    - If you receive a letter:
          - If your policy is "Pay": you lose 1 point.
          - If your policy is "Don't": you lose 10 points.

   Debrief points:

    1. In Phase 1, the coin flip is independent of your policy. In Phase 2, whether you receive a letter depends on your policy and the truth T.

    2. In Phase 1, the optimal policy is "Pay", with expected value 4, vs 0.5 for "Don't". But in the heads world, "Pay" students lose out compared to "Don't". This is the cost of precommitment in the world where the mugging doesn't happen.

    3. In Phase 2, the optimal policy is also "Pay", with expected value -0.5, vs -5 for "Don't". But in the world where T is false, "Pay" students receive a letter and lose 1 point, while "Don't" students do not receive a letter and get 0. So they might regret.

    4. The key difference for decision theory: in Phase 1, when you are in the tails world, you know the state (tails) and that it's independent of your policy, so you should be willing to pay. In Phase 2, when you receive a letter, it does depend on your policy, and you also learn something about T. Specifically, if you are a "Pay" type and receive a letter, you learn that T is false. If you are a "Don't" type and receive a letter, you learn that T is true. This informational feedback is why in the blackmail case, conditioning on the letter might lead to a different decision than the ex ante policy.

    5. In the mugging, the predictor's appearance (in the classic story) is only in the tails world and is independent of your action (except that the predictor knows your action). In the blackmail, the arrival of the letter is directly caused by your policy and the state.

    6. Updatelessness (committing to a policy ex ante) is beneficial in both cases, but in the blackmail case, if you condition on the letter, you might not want to follow the policy. However, in our game, you had to follow the policy.

   What the classroom version cannot reproduce:

    - In the classic counterfactual mugging, the predictor is a perfect predictor and the reward in the tails world depends on what you would have done in the heads world. We simplified to a direct reward for paying in tails.

    - In the real world, the blackmailer might not be a perfect XORer, but in our game we assume perfect.

    - We used a coin flip that is the same for all students, so they all experience the same world. In reality, each agent faces an independent instance.

