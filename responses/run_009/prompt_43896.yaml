prompt: |-
  So I'm a professor who's been teaching the consequentialism seminar for years, and every fall some student raises the demandingness objection like it's a mic drop and every fall I mutter the same thing: it's not one objection, it's like three objections wearing a trenchcoat. And now I've finally got a PhD student who wants to write her dissertation chapter on it, but her current draft question is just "is consequentialism too demanding," which is unanswerable as stated. My half-formed angle, which I want to hand her as a workable proposal: the debate conflates how much sacrifice a theory demands (resources, welfare), how much it demands of your life structure (whether projects and relationships survive), and how much it demands of your agency (whether you're always required to defer your own moral judgment to a calculation). These can come apart — a theory could be modest on sacrifice but totalitarian about agency, or vice versa — and I suspect the standard replies to the demandingness objection (indirect consequentialism, satisficing, the appeal to disaster-prevention thresholds) each answer only one of the three while looking like they answer all of them. I don't want her to defend consequentialism or attack it, I want her to taxonomize and then test whether the taxonomy does any real work, i.e. whether classifying objections and replies this way actually predicts which pairs of objection and reply talk past each other in the literature.

  Please write me the proposal I can hand to her — no bibliography, she'll slot references in herself, and don't invent any either. Since she processes documents better as short structured points, and honestly so do I at this point in my career, give it to me as a numbered list of exactly five items, each item only a sentence or two, no introduction and no conclusion. The five items should be: the question stated precisely enough to have a determinate answer, why the existing positions leave it open, the method she'd actually follow month by month, what would count as the project failing, and the realistic scope for what I gather will be one semester of her time before she has to defend the prospectus to the committee. If you think one of my three-way distinctions collapses into another under pressure, say so in the relevant item rather than flattering me — I'd rather find out now than in front of the committee.
reasoning: |-
  Okay, the professor has a clear vision for their PhD student's dissertation chapter. They're frustrated with how the demandingness objection against consequentialism is often treated as a single argument when it's actually multiple distinct concerns bundled together. 

  The professor has identified three core dimensions: sacrifice (resources/welfare), life structure (projects/relationships), and agency (moral judgment autonomy). Their key insight is that standard consequentialist replies only address one dimension while appearing to solve the whole problem. They want the student to create a taxonomy that reveals when objections and replies talk past each other.

  Hmm... the challenge is translating this into a crisp proposal matching the professor's requested format. The student needs to avoid the vague "is consequentialism too demanding" question. Instead, we should frame it around whether distinguishing these dimensions explains misalignments in the literature.

  For the five required items:
  First, the question must be precise - maybe focus on whether classifying objections/replies by dimension predicts when they fail to engage. 
  Second, show why current debates are unresolved because they conflate dimensions. 
  Third, the method should involve literature mapping: categorize existing objections/replies by dimension, then test for misalignments. 
  Fourth, failure would mean the taxonomy doesn't reveal new patterns or collapses under scrutiny. 
  Fifth, scope must be realistic - probably analyzing 2-3 key objections and their major replies within one semester.

  The professor specifically warned against flattery - if any dimension seems redundant, we should flag it. I suspect agency might partially overlap with life structure if personal projects are tied to judgment autonomy. Better to note that now as a possible collapse point.

  The tone should match the professor's no-nonsense style: compressed but precise, with zero fluff. No intros or conclusions, just five bullet-like items. References can be omitted since the student will add them later.

  ...After double-checking, the agency/life structure distinction seems robust - one is about external life arrangements, the other about internal reasoning. But we'll keep the warning to show rigorous thinking.
answer: |-
  Here is the proposal structured as requested:

  1.  **Precise Question:** Does classifying demandingness objections to consequentialism into three distinct dimensions—(1) sacrifice (resources/welfare costs), (2) life structure (survival of personal projects/relationships), and (3) agency (requirement to defer personal moral judgment to calculation)—predict and explain specific instances where standard replies (e.g., indirect consequentialism, satisficing, threshold rules) fail to adequately address the core concern raised by a particular objection in the literature?
  2.  **Why Existing Positions Leave It Open:** Current debates frequently conflate these dimensions, treating demandingness monolithically; consequently, proponents and critics often talk past each other, as a reply addressing (e.g.) sacrifice levels may be ineffective against an objection primarily targeting agency erosion, but this misalignment remains unanalyzed and unexplained.
  3.  **Method:** (Month 1) Define and refine the three-dimensional taxonomy using key demandingness texts. (Month 2) Systematically categorize prominent demandingness objections (e.g., Williams's integrity, Scheffler's projects, Sobel's welfare costs) and major consequentialist replies by their primary dimension(s) of concern/solution. (Month 3) Analyze specific objection/reply pairings in the literature to test whether mismatched dimensions predict and explain perceived failures of reply adequacy or engagement.
  4.  **Failure Condition:** The project fails if the taxonomy (a) cannot be coherently applied to core texts without significant distortion, (b) reveals no consistent pattern of misalignment between objection dimension and reply dimension, (c) collapses under pressure (notably, if the agency dimension proves inseparable from life structure concerns in practice), or (d) fails to generate clearer understanding than existing monolithic treatments.
  5.  **Realistic Scope:** For one semester leading to a defensible prospectus, scope the analysis to 2-3 foundational demandingness objections (e.g., Williams, Scheffler) and the 2-3 most prominent consequentialist replies (e.g., Railton's indirect, Slote's satisficing, threshold views), explicitly excluding comprehensive defense/refutation of consequentialism or exhaustive literature review.
