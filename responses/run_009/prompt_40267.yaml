answer: |-
  ## Research Proposal: Structural Entanglements in the ITN Framework – Towards a Coherent Foundation for Cause Prioritization

  **1. Research Question & Core Suspicion**  
  The Importance-Tractability-Neglectedness (ITN) framework, widely used in effective altruism (EA) for cause prioritization, multiplicatively combines scores (`I * T * N`) to rank causes. My research critically examines the **mathematical and conceptual coherence of this multiplicative structure**. Specifically: Does the multiplicative combination implicitly rely on untenable assumptions of independence between factors, leading to distortions in cause rankings or a fundamental category error, rather than being a harmless heuristic simplification? I contend that at least two forms of entanglement undermine the framework:

  *   **Definitional Entanglement of T & N:** Tractability (T) – the expected ease of making progress *per unit resource* – is inherently linked to Neglectedness (N). N measures the diminishing marginal returns expected from additional resources. However, T, as typically conceived *for the next actor*, is *itself* a function of current resource allocation and thus the diminishing returns profile captured by N. Multiplying `T * N` risks double-counting the impact of resource saturation.
  *   **Marginal Value Mismatch:** Importance (I) is often conceptualized as the *total* scale or severity of a problem (a non-marginal quantity). However, the ITN framework is explicitly intended as a tool for *marginal* resource allocation decisions (the value of the *next* unit of resource). The framework implicitly assumes that `I * T * N` directly proxies marginal value. Yet, the *way* returns diminish (central to T & N) is constitutive of the marginal value function itself, which cannot be cleanly separated from the total scale (I) in this multiplicative way.

  The central question is: **Is the multiplicative ITN structure (a) a justifiable heuristic simplification where interactions average out, (b) a source of significant distortion in cause rankings requiring structural reform, or (c) a category error where no simple multiplicative patch can reconcile the underlying conceptual tensions?**

  **2. Why the "Just a Heuristic" Defense is Insufficient**  
  Proponents often argue ITN is merely a practical scaffold prompting essential reasoning, with interactions handled qualitatively. This defense fails to settle the critical question for three reasons:

  1.  **Structural Influence:** The multiplicative formula isn't neutral. It actively shapes *how* users conceptualize and decompose the problem, potentially obscuring fundamental interdependencies (like the T-N entanglement) rather than simply prompting their consideration. The framework's apparent objectivity can mask these biases.
  2.  **Proxy Failure:** If `I * T * N` is intended as a proxy for marginal value, but the structure systematically misrepresents the relationship between the core concepts (e.g., treating non-marginal I and marginal T/N as independent multipliers), the heuristic actively generates misleading outputs, not just incomplete ones. Its core proxy function is flawed.
  3.  **Ad-Hoc Correction Burden:** Relying solely on qualitative overrides places an unrealistic burden on practitioners to constantly identify and correct for structural flaws case-by-case, often under uncertainty. A coherent structure should minimize, not maximize, this need for ad-hoc adjustment. The framework's very *design* needs scrutiny.

  **3. Research Method & Stages**  
  This one-year project employs conceptual analysis and formal reconstruction, progressing through three stages:

  *   **Stage 1: Disentangling Entanglements (Months 1-4):** Conduct a rigorous philosophical and conceptual analysis.
      *   Precisely define canonical interpretations of I, T, and N within EA literature/practice.
      *   Analyze the relationship between T and N: Is their connection merely correlative (empirically observed) or definitional/logical (e.g., T *for a marginal actor* inherently incorporates the current level of N)? Identify other potential interdependencies (e.g., how I might constrain plausible T).
      *   Analyze the marginal/non-marginal distinction: How is I operationalized? How does the *actual* marginal value of resources depend on I, T, N *and crucially, their interactions*?
  *   **Stage 2: Structural Reconstruction (Months 5-8):** Develop and formally model alternative structures that internalize definitional entanglements.
      *   Focus on the T-N nexus: Propose structures where diminishing returns (N) explicitly modifies the *definition or calculation* of tractability (T) for the marginal actor, avoiding separate multiplication. Explore integrated "marginal tractability" metrics.
      *   Address the marginal value question: Reconceptualize the target output explicitly as marginal expected value per resource unit. Investigate functional forms beyond simple multiplication (e.g., `I * Marginal_T(N)`, or `Marginal_Value(I, T, N)` with specific interaction terms) that better capture how total scale and diminishing returns jointly determine marginal impact.
      *   Develop clear scoring procedures for reconstructed factors.
  *   **Stage 3: Stress-Testing & Comparison (Months 9-12):** Evaluate the practical implications of the reconstruction.
      *   Apply both the standard ITN (`I * T * N`) and the reconstructed model(s) to a curated set of 5-7 diverse, well-documented EA cause areas (e.g., global health, AI safety, animal welfare, nuclear security, climate change).
      *   Systematically compare the resulting cause rankings under each model. Identify *where* and *why* rankings diverge significantly.
      *   Assess the robustness of findings: How sensitive are results to plausible variations in scoring definitions or parameter estimates? Does the reconstructed model offer more intuitive or justifiable rankings for contested cases?

  **4. Deliverable: Value for Practitioners**  
  A successful outcome will provide actionable insights for those using ITN-like frameworks:

  1.  **Diagnostic Clarity:** A clear verdict on the severity of the multiplicative structure's flaws (heuristic, distortive, or incoherent) specific to the T-N and marginal value issues, supported by analysis.
  2.  **Practical Reconstruction Guide:** If structural reform is viable, a concrete, implementable alternative framework (or family of frameworks) with clear scoring guidelines that internalize definitional entanglements, designed for usability alongside existing EA practices.
  3.  **Critical Awareness Tool:** A framework for identifying *when* and *why* standard ITN scoring is most likely to mislead (e.g., in causes with highly non-linear returns or contested neglect), enabling more informed qualitative overrides even if the core formula remains in use.
  4.  **"Reconstructed ITN" Rankings:** Illustrative cause rankings using the new model(s) compared to standard ITN, highlighting specific cases where the structural change makes a material difference, fostering discussion and validation within the EA community.

  **5. Embracing Uncertainty: What Constitutes Failure**  
  This project rigorously explores a specific, foundational critique. Success isn't guaranteed, and clear failure modes exist:

  1.  **Inconclusive Entanglement:** Failure to compellingly demonstrate that the T-N link is definitional rather than merely strong correlation, or that the marginal value mismatch is structurally fatal rather than a correctable labeling issue.
  2.  **Unworkable Reconstruction:** Development of theoretically cleaner models that prove too complex, opaque, or unstable for practical application by funding allocators, failing the usability test.
  3.  **Negligible Impact:** Stress-testing reveals that reconstructed models produce rankings nearly identical to standard ITN for major cause areas, suggesting the multiplicative flaw, while real, has minimal practical consequence on current priorities.
  4.  **The Ad-Hoc Reality:** Discovery that practitioners' actual use of ITN is so flexible, contextual, and reliant on holistic judgment that *any* formal scoring structure (multiplicative or otherwise) is inherently secondary to qualitative deliberation. Success would then be diagnosing *this* as the core reality, demonstrating that the pursuit of a "principled" formalization is misguided for this context, shifting the focus to improving qualitative reasoning scaffolds instead of multiplicative scores. This too is a valuable result.

  This project confronts a foundational tension within a key EA prioritization tool. Whether it culminates in a refined framework, a critical diagnosis of limitations, or a demonstration of inherent practical flexibility, it will advance the understanding of how we rationally allocate resources to improve the world.
