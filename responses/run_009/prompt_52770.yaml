prompt: |-
  I'm a philosophy major taking a philosophy of biology course this semester (bio minor, one population genetics class under my belt so I'm not totally lost on the science). Last week in section we got into it about whether a revived population of woolly mammoths -- the de-extinction people and their gene editing thing -- would count as the same species as actual woolly mammoths, and the TA shut the whole discussion down with "species are individuals, not kinds." Since then I keep hearing that one line everywhere in the course. The professor dropped it again when someone asked about the Ensatina salamanders in California, the ring species situation where the neighboring populations interbreed all the way around the ring except where the two ends meet up, and he said it like the slogan obviously settles whether that's one species or several. It clearly doesn't settle anything for me, and I suspect it's doing a bunch of different jobs depending on who's saying it and why. So: can you take that slogan apart and lay out the distinct precise claims it could actually be expressing, from the nearly trivial ones (like, species are historical things with a beginning and an end, not abstract categories) to the genuinely radical ones (like, the relationship between an organism and its species is literally part-whole, the way my hand is part of me, so it isn't set membership at all and a species can't have a member that exists outside its spacetime envelope)? For each reading I want a verdict -- is it plausible, is it a substantive thesis or just common sense in fancy dress, is any reading actually false -- and, most importantly, whether that reading would genuinely settle the mammoth arguement or the salamander question or whether it just sounds like it does. Then tell me which reading you think people who repeat the line actually have in mind, since I doubt they've all worked out the mereology. Please write this as plain continuous prose, the way you'd write a long email -- no headings, no bullet points, no bold text, no tables, just paragraphs -- and in American English. I want something I can read closely and bring to office hours without it looking like a study guide.
