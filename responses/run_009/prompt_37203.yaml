prompt: |-
  i'm a novelist working on a book where the narrator loses all her memories every time she sleeps and rebuilds herself each morning from a stack of notebooks she left for herself (a few of which she's pretty sure are forged — don't ask, it's a plot thing). before i write myself into a corner i want to think the philosophy through properly, and i want to use memento as my test case. so: read memento through two lenses at once, locke's memory theory of personal identity and the buddhist anatta view with its claim that there was never a self there to lose in the first place. leonard's tattoos and polaroids feel to me like nagasena's chariot — a name applied to a pile of parts with no rider to be found — but the ending complicates that, because leonard deliberately lies to his future self, writing down the plate number he knows will get an innocent-ish man killed, and a lie needs someone to protect, which is exactly what no-self says there isn't. so which lens does the film actually vindicate? does it cheat either view — like, does nolan quietly need leonard to be a real continuous self underneath it all for the audience to keep caring? and the practical question for me: should my narrator's forged notebooks push her toward locke or toward the buddhists, or is the forgery itself the place where the two views finally say different things? tell me which scenes to steal.
