prompt: |-
  At a recent rationality meetup — I've been in this community long enough to have seen versions of this argument many times, though never run this deep — two members got into a sustained disagreement about whether evolutionary debunking arguments succeed against moral realism. I was asked to referee, and honestly could not. I'll reproduce the exchange as faithfully as I can, in numbered moves.

  (1) Dara opened with the debunking setup: our moral dispositions were shaped by natural selection for reproductive fitness, not for tracking moral truth. Had the selection pressures been different — had they favored more nepotism, or less altruism toward strangers — we would hold systematically different moral beliefs with just as much confidence as we now hold ours. So the genealogy of our moral beliefs gives us no reason to think those beliefs are true, and the realist owes us a story about why evolution would have pointed us at moral facts rather than merely at fitness. Absent that story, we should distrust our moral beliefs wholesale.

  (2) Farid replied that this proves too much. Evolution also shaped our perceptual systems, our memory, and our disposition to trust elementary logic, all for fitness reasons; if fitness-shaped origins were sufficient to debunk, all cognition would be debunked, including the premises of the debunking argument itself. In some domains, accuracy is fitness-enhancing, so selection can and does build reliable faculties; nothing in the genealogy alone tells you which domain you're in.

  (3) Dara granted that but insisted on a domain-specific asymmetry. For perception and logic, we can independently explain why accuracy would have been selected for: perception is causally constrained by the world it reports on, so inaccurate medium-object perception gets you eaten. Moral truths, by contrast, are causally inert — if there are stance-independent moral facts, they don't push particles around — so fitness considerations are simply insensitive to them; fitness varies independently of moral truth, and that independence, not the evolutionary origin per se, is what does the debunking. The 'proves too much' reply therefore misses its target.

  (4) Farid made two countermoves. First, he said the causal-inertness premise just is non-naturalism: the debunking argument presupposes the very conception of morality it is supposed to be testing, so realists of a naturalist stripe can shrug it off as begging the question. Second, he offered a third-factor response: suppose survival and moral truth are correlated — for instance, that damage is bad and that creatures which avoid damage survive more. Then the same selection process that favors fitness also, incidentally, favors sensitivity to moral truth, exactly as it favors sensitivity to tissue damage. The pain system gets vindicated by this structure, he said, and there is no obvious reason the moral case cannot run the same structure.

  (5) Dara answered that third-factor vindications are epistemically circular in a way the pain case is not. To identify the third factor and certify its correlation with moral truth, you must deploy the very moral judgments that are under suspicion — you are certifying the instrument using the instrument's own readings. The pain case works because the correlation is certified by independent, non-moral observations of injury and behavior; in the moral case, no such independent check exists, so the vindication is only as good as the beliefs it was supposed to vindicate.

  (6) Farid's final move was to change the status of the question rather than answer it: even if the genealogy defeats any positive justification for moral beliefs, beliefs acquired by processes we cannot currently indict still merit epistemic conservatism — one may rationally retain them absent a specific defeater. Dara shot back that asking where a 'specific defeater' could come from, if not from exactly the genealogy he had described, was precisely the question — and there the exchange ended, both convinced they had won overall.

  Please adjudicate the six moves in order: for each, say what is right in it, what is mistaken or overstated, and where the burden of proof should be taken to lie at that point. Then give an overall verdict on who, if either, won the exchange. Finally, if there is a distinction or a standard move in this literature that both of them missed and that would have restructured the debate, I'd be grateful to hear it — I suspect the disagreement kept sliding between debunking the origin of a belief and debunking its present maintenance, but I could not get clear on whether that distinction would help either side.
reasoning: |-
  Hmm, the user is presenting a detailed philosophical debate about evolutionary debunking arguments against moral realism from a rationality meetup. They've reproduced a six-move exchange between Dara (pro-debunking) and Farid (anti-debunking) and want me to adjudicate each move systematically.

  First, I need to understand the core disagreement. Dara is pushing the standard evolutionary debunking argument: our moral intuitions evolved for fitness, not truth-tracking, so we shouldn't trust them. Farid counters with the "proves too much" objection - if this debunks morality, it should debunk perception/logic too. The debate then spirals into asymmetry claims, third-factor responses, and epistemic circularity.

  For move (1), Dara's setup is textbook debunking - and correct as far as it goes. The key insight is that evolutionary genealogy creates an undercutting defeater for moral beliefs by highlighting their arbitrary origins. But she overstates by suggesting this requires wholesale distrust immediately; the burden should just be to explain reliability.

  In move (2), Farid's symmetry argument is strong - many philosophers like Plantinga use similar reasoning. But he misses that perception has a clear truth-tracking mechanism (causal constraints) while morality might not. His burden here is light though - he successfully forces Dara to differentiate domains.

  Move (3) is where Dara introduces the causal inertness asymmetry. This is clever - it's Street's key insight. But she subtly presupposes non-naturalism here, which Farid will pounce on. Burden shifts to her to justify why moral facts must be causally inert if they're real.

  For move (4), Farid's two-pronged response is sharp. The begging-the-question charge against non-naturalist presuppositions is valid against Dara's formulation. His third-factor analogy to pain is promising but underdeveloped - he needs to specify what the "third factor" is (well-being? social coordination?) without circularity.

  In move (5), Dara exposes the circularity risk in third-factor responses brilliantly - this is Enoch's dilemma. But she's too dismissive; naturalists could argue evolutionary ethics provides some independent checks (e.g. survival value of cooperation). Burden is now on Farid to show non-question-begging correlations.

  Finally move (6) shows Farid retreating to epistemic conservatism - a weak move that Dara properly skewers. If genealogy creates a defeater, "innocent until proven guilty" doesn't apply. His burden was to explain reliability, not shift to default justification.

  Overall, Dara edges this by maintaining argumentative pressure. But both miss crucial nuances: the distinction between belief formation (which genealogy clearly debunks) and belief maintenance (which might involve current reasoning). Also, the debate conflates different realist positions - naturalists (like Boyd) have better responses to debunking than non-naturalists. The user's suspicion about the formation/maintenance distinction is spot-on; highlighting that could've reframed the entire debate.
answer: |-
  Here's an adjudication of each move, followed by an overall verdict and a key missed distinction:

  **Adjudication of Moves:**

  1.  **Dara's Debunking Setup (Move 1):**
      *   **Right:** Correctly sets up the core evolutionary debunking argument (EDA). The genealogy of moral beliefs *does* pose a challenge: it suggests they were selected for fitness, not truth-tracking, and that different selective pressures could have yielded different, equally confident beliefs. The realist *does* owe an explanation for why evolution would point us towards moral truth. This creates a prima facie reason for suspicion.
      *   **Mistaken/Overstated:** Claims the genealogy gives "no reason" to think beliefs are true. This is too strong; the genealogy *undercuts* a common *presumption* of reliability but doesn't logically preclude reliability. Also, "distrust wholesale" is premature; the argument creates a *challenge* needing a response, not an immediate verdict of universal falsehood.
      *   **Burden of Proof:** Shifts significantly to the moral realist (Farid). Dara has presented a potent undercutting defeater for the reliability of moral belief-forming faculties.

  2.  **Farid's "Proves Too Much" Reply (Move 2):**
      *   **Right:** Correctly identifies the core symmetry problem for EDAs. If evolutionary origins *by themselves* debunk a domain, they would debunk perception, logic, and memory – including the premises used *in* the debunking argument. This is a powerful and standard objection (e.g., Plantinga, others). He rightly notes that in *some* domains (like perception), accuracy *is* fitness-conducive.
      *   **Mistaken/Overstated:** Overstates the implication. The symmetry doesn't *prove* morality is reliable; it shows that the *mere fact of evolutionary origin* isn't sufficient for debunking *any* domain. It forces the debunker to identify a relevant *asymmetry* between morality and perception/logic. He hasn't yet *vindicated* morality, only blocked the simplest form of debunking.
      *   **Burden of Proof:** Shifts back to Dara. Farid has successfully argued that evolutionary origin alone isn't decisive. Dara must now show why morality is *relevantly different* from perception/logic such that its evolutionary origin is uniquely problematic.

  3.  **Dara's Asymmetry Claim (Causal Inertness) (Move 3):**
      *   **Right:** Correctly identifies the most promising asymmetry: the causal role of the target facts. Perception tracks mind-independent facts (objects, predators) that *causally impact* survival; inaccurate perception has direct fitness costs. Her point about the potential independence of fitness and moral truth (if moral facts exist) is crucial.
      *   **Mistaken/Overstated:** 1) **Presupposition:** She *assumes* moral facts are non-natural and causally inert. This *is* a presupposition of a *specific kind* of realism (non-naturalism). Naturalist realists (e.g., moral naturalists) *deny* this premise; for them, moral facts *are* natural facts (about well-being, social flourishing, etc.) that plausibly *do* causally interact with fitness. 2) **Necessity of Causal Constraint:** While causal constraint *explains* reliability in perception, it's not necessarily the *only* way reliability could arise. The burden is to show why no *other* mechanism (like Farid's third factor) could work for morality.
      *   **Burden of Proof:** Remains with Dara to defend the causal inertness premise *against* naturalist alternatives and to show why the lack of direct causal constraint *precludes* the evolution of reliable moral faculties, even indirectly. She must also address whether the *independence* she posits actually holds.

  4.  **Farid's Countermoves: Question-Begging & Third-Factor (Move 4):**
      *   **Right (Question-Begging):** Spot on regarding non-naturalism. Dara's asymmetry argument *does* presuppose non-naturalism (causal inertness). Against a naturalist realist who identifies moral facts with natural facts causally relevant to fitness, the debunking argument *does* seem to beg the question by assuming the very conception (non-naturalism) it aims to undermine. This is a significant limitation of the *specific form* of EDA Dara is running.
      *   **Right (Third-Factor Potential):** The formal structure of the "third-factor" response is valid and is a standard realist move (e.g., Enoch, Wielenberg, others). If there's a property (Factor X) that is both 1) reliably correlated with moral truth and 2) selected for by evolution *because* it enhances fitness (or is correlated with something that does), then selection *could* indirectly favor sensitivity to moral truth. The pain analogy is apt: pain is bad (moral truth?), tissue damage is fitness-reducing (selected against), so sensitivity to damage (pain) is selected for and tracks badness.
      *   **Mistaken/Overstated (Third-Factor):** Farid hasn't *specified* Factor X or *demonstrated* the required correlation for morality. He's shown the *possibility* of such a structure, not its *actuality*. The challenge is providing a plausible, non-question-begging account of Factor X and its correlation with moral truth. The pain case *seems* clearer because "tissue damage" and "avoidance behavior" are observable independently of the pain experience's *badness*.
      *   **Burden of Proof:** Shifts significantly to Farid regarding the third-factor response. He needs to provide a plausible candidate for Factor X (e.g., well-being, social cooperation, reproductive success - though these are contentious) and argue for its reliable correlation with moral truth *without* presupposing the moral truths he's trying to vindicate. The question-begging point successfully shifts the burden against Dara's *non-naturalist-targeting* version of the argument.

  5.  **Dara's Epistemic Circularity Charge (Move 5):**
      *   **Right:** This is a devastatingly accurate critique of many third-factor responses. To argue that Factor X (e.g., well-being) is *correlated* with moral truth, one typically relies on the very moral intuitions/judgments whose reliability is in question. Certifying the instrument (moral faculty) using its own readings (moral judgments) *is* epistemically circular. The pain case *does* have independent anchors: we can observe tissue damage (microscopy, physiology) and avoidance behavior independently of feeling pain or judging it bad. This independent check is much harder to find for morality.
      *   **Mistaken/Overstated:** Overstates the *impossibility* of any non-circular vindication. Naturalists might argue that scientific understanding of human flourishing/social dynamics *can* provide some independent traction, though linking this directly to *moral truth* robustly remains difficult. Also, while circularity is a problem, it doesn't necessarily mean the beliefs are *false*; it means the *justification* offered is question-begging.
      *   **Burden of Proof:** Lands firmly back on Farid. Dara has exposed a major weakness in the standard third-factor escape route. Farid must either: 1) Provide a candidate Factor X and a *non-moral*, *independent* way to establish its correlation with moral truth (extremely difficult), or 2) Challenge the notion that epistemic circularity is fatal in this context (e.g., argue for a form of epistemic externalism or default justification).

  6.  **Farid's Epistemic Conservatism & Dara's Rebuttal (Move 6):**
      *   **Right (Farid - Conservatism):** He is correct that absent a *specific, undefeated defeater* for a particular belief, epistemic conservatism suggests we are often rational in retaining it. We don't discard all beliefs the moment we learn their origins might be suspect; we need positive reasons to think *this particular belief* is flawed. He's trying to shift from global debunking to needing local defeaters.
      *   **Mistaken/Overstated (Farid):** He misapplies conservatism. Dara *has* presented a potential *global undercutting defeater* for the *faculty* generating moral beliefs. Conservatism applies to *beliefs* lacking defeaters, but here the defeater targets the *reliability of the source* of those beliefs. Saying "well, we haven't found specific errors *yet*" doesn't address the challenge to the faculty's general reliability. It risks simply ignoring the defeater.
      *   **Right (Dara):** Dara correctly identifies the core issue: the evolutionary genealogy *is precisely the defeater* Farid claims is missing for specific beliefs. The defeater operates at the level of the belief-forming *process*, casting doubt on *all* beliefs produced by that process until its reliability is restored. Simply asserting conservatism doesn't make the defeater go away.
      *   **Burden of Proof:** Farid fails to discharge the burden. Appealing to conservatism without addressing the undercutting defeater is inadequate. Dara successfully argues that the genealogy *is* the defeater he asks for. The burden remains on Farid to either defeat the defeater (e.g., provide a successful vindication like a non-circular third-factor account) or explain why it doesn't apply globally.

  **Overall Verdict:**

  **Dara wins the exchange.** While Farid scored significant points – successfully highlighting the "proves too much" symmetry, forcing Dara to articulate the causal inertness asymmetry, exposing the non-naturalist presupposition in her argument, and sketching the third-factor response – he ultimately failed to overcome Dara's strongest moves.

  1.  **Dara successfully established the core challenge:** The evolutionary origins of moral beliefs create a strong, non-question-begging (against non-naturalism), undercutting defeater for their reliability.
  2.  **Farid's most promising escape route (third-factor) was critically wounded** by Dara's epistemic circularity objection. He offered no satisfying non-circular way to establish the crucial correlation.
  3.  **Farid's fallback to epistemic conservatism failed** because Dara correctly identified the genealogy itself as the global defeater conservatism requires to be absent. Conservatism doesn't immunize beliefs against undercutting defeaters targeting their source.

  Dara maintained argumentative pressure throughout, forcing Farid onto defensive ground he couldn't adequately hold. Farid exposed limitations in Dara's *formulation* (its non-naturalist bias), but he couldn't construct a positive, non-question-begging case for the reliability of our evolved moral faculties in light of the challenge.

  **The Missed Distinction: Formation vs. Maintenance (and Content)**

  Your suspicion is astute. The debate often conflates three distinct targets of debunking:

  1.  **The Origin/Formation of Basic Moral Intuitions:** This is what evolution directly shaped (e.g., intuitions about fairness, loyalty, harm). The EDA primarily targets *this* level – the raw inputs. Dara's argument is strongest here.
  2.  **The Content of Our *Current* Moral Beliefs:** Many of our complex moral beliefs (e.g., about human rights, universal justice) are *not* directly evolutionarily shaped but result from cultural evolution and *reasoning* applied to basic intuitions. The EDA's force against *these* is less direct. Farid might have leveraged this, arguing that even if basic intuitions are suspect, reasoned moral *reflection* can correct and justify our current beliefs.
  3.  **The Present Maintenance/Justification of Beliefs:** How we *hold* and *justify* beliefs *now*. Even if the *origin* of intuitions is suspect, we might maintain beliefs based on coherentist justifications, reflective equilibrium, or their indispensable role in practical reasoning. Farid's conservatism move gestured towards this but conflated it with origin defense. He could have argued that the *current* justification for many moral beliefs isn't *reliant* on their evolutionary origins but on independent reasoning, making the origin story irrelevant to their *current* epistemic status. Dara might counter that reasoning starts from the suspect intuitions, but this is a more nuanced battleground.

  **How it Could Have Restructured the Debate:**

  *   Dara might have focused more narrowly on debunking the reliability of *basic moral intuitions* as inputs.
  *   Farid could have conceded some force against raw intuitions but argued that:
      *   Moral *reasoning* allows us to transcend/refine them.
      *   Our *current* moral beliefs are justified by coherence, reflective equilibrium, or practical necessity, independent of their historical origins.
      *   This shifts the burden to Dara to show that the taint of evolutionary origin inevitably corrupts *all* levels of moral judgment, including sophisticated reasoning. This is a harder case for Dara to make conclusively.

  This distinction between the debunking of *originating mechanisms* for intuitions and the potential vindication of *current beliefs* through *present rational processes* is crucial and often underdeveloped in these debates. Farid missed an opportunity to pivot to this stronger ground.
