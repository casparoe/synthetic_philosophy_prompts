   Brainstorming the game description:
     The Pasadena game: 
       You pay an entry fee to play.
       A fair coin is tossed until it lands heads.
       Let n be the number of tosses (first heads on n-th toss).
       The payoff is (-1)^{n+1} * (2^n) / n   (dollars?).

     So the series of payoffs is:
          n=1: +2
          n=2: -2
          n=3: +8/3 ≈ +2.666
          n=4: -4
          n=5: +32/5 = 6.4
          etc.

     The series 2 - 2 + 8/3 - 4 + 32/5 - ... is conditionally convergent (absolutely divergent because the absolute series is harmonic).

     The Riemann rearrangement theorem says we can rearrange to get any sum.

   In the prospectus, we might say:

     "The Pasadena Game offers a unique investment opportunity with a theoretically fair entry price. However, due to the complex nature of the payoff structure, the Pasadena Palace of Chance employs a proprietary ordering algorithm to determine the sequence of potential outcomes. The actual valuation may vary based on the order in which the outcomes are considered."

