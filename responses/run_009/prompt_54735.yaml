  First, unpacking the philosophical angles needed: 
  - **Full moralist**: Art's value ruined by artist's immorality (ethicism). 
  - **Pure autonomist**: Only the artwork matters, biography irrelevant (autonomism). 
  - **Moderate moralist**: Work itself celebrates cruelty, making immorality relevant. 
  - **Inverse error**: Overrating mediocre art due to artist's virtue. 
  - **Concession**: Acknowledged masterpiece now unwatchable due to context. 

  The comedy must stem from accurate philosophy, not curator incompetence. Each fictional artwork should satirize the stance—e.g., a saccharine landscape by a tyrant (highlighting dissonance) or a brilliant battle scene by a warmonger. Names need wit: "Museum of Moral Muddlement" sounds stuffy-academic, fitting the parody. 

  For label 1 (full moralist): Invent an artist whose cruelty manifests in the artwork's flaws. "Eldritch Thorne" implies gothic villainy; "The Puppeteer's Garden" suggests forced whimsy. The label explicitly links aesthetic failure to moral failure—"drained of vitality" by the artist's "soul." 

