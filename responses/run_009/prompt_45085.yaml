prompt: |-
  I do demand forecasting for a mid-sized grocery chain — every week we decide how much of each product to stock, and both over- and under-ordering cost real money, so this is a decision we make constantly, not a one-off. The old-timers here say just trust last year's numbers, the data-science hires say the world changes and the past is a biased sample, and since we've never had a rule it gets settled by whoever argues loudest. My understanding is the no-free-lunch theorems and Hume's induction problem are basically the formal versions of this exact argument, but a theorem doesn't tell an analyst what to do on a tuesday morning. So turn it into a procedure: exactly five numbered steps an analyst can run on any forecasting question in under and hour — what to check at each step, what counts as passing, and where the step has to end in a human judgment call because no checkable answer exists. Each step a sentence or two, no intro or conclusion. It needs to cover both ends: cases where we have years of similar history, and cases like a new oat-milk brand with three weeks of sales or a flour spike that started for no reason anyone can name, where the procedure should say something more useful than "flip a coin."
reasoning: |-
  We are designing a procedure for demand forecasting that must work in under an hour and cover both stable and novel situations. The goal is to have a sequence of steps that lead to an actionable decision, with clear checks and points for human judgment.

   Step 1: Check data availability and quality for the item.
     - Look at the historical sales data: at least 2 years of weekly data is ideal for established products, but for new products (like the oat-milk brand) we may have less. Also, check for missing data, outliers (e.g., due to promotions, stockouts, or data errors), and structural breaks (like a permanent change in the product's shelf space). 
     - Pass if: data exists and covers at least 8 weeks (to capture seasonality for weekly data) without major gaps or anomalies. For items with less than 8 weeks, note that and proceed to step 2 with caution. If there are anomalies, note them and adjust (e.g., remove promotions, fill missing data via interpolation) or flag for human review.
     - Judgment: How to handle anomalies? If the cause is known (e.g., a one-time event), adjust. Otherwise, flag for review.

   Step 2: Assess stability of the demand pattern.
     - Split the history into two parts: the most recent 8-12 weeks and the rest. Compare the average and variance of the two parts. For seasonal items, compare the same weeks in the previous year. Alternatively, use a statistical test (like a t-test for means and F-test for variances) if the data is normally distributed, or a non-parametric test (like Mann-Whitney) if not. For new products with limited data, skip the split and note the uncertainty.
     - Pass if: the mean and variance between the two parts are not significantly different (e.g., p-value > 0.05). If not, then the recent data may represent a shift. For new items, we cannot assess stability, so note that and move to step 3.
     - Judgment: What caused a significant change? If the cause is known and temporary (e.g., a holiday), adjust the data. If the cause is unknown or permanent, we may need to rely more on recent data.

   Step 3: Choose a forecasting model based on data characteristics.
     - For items with at least 2 years of stable data: use a seasonal model (e.g., Holt-Winters exponential smoothing, or a simple seasonal naive: forecast = same as last year same week). 
     - For items with less than 2 years but at least 8 weeks: use a simple moving average or exponential smoothing without seasonality.
     - For items with less than 8 weeks: use a comparable item's history (e.g., the category average or a similar product) as a prior and adjust with the new item's data (e.g., using Bayesian updating or a simple ratio if we have a few weeks).
     - Pass if: the model is chosen appropriately for the data. If no comparable item exists for a new product, then we must rely on judgment.
     - Judgment: Which comparable item to use? Consider product category, price point, and type. Also, adjust the model if there are known upcoming events (e.g., a planned promotion).

   Step 4: Generate the forecast and a prediction interval.
     - Run the chosen model to get a point forecast for next week and a 95% prediction interval (or a business-relevant interval, e.g., 80% if the cost of over/under is asymmetric). For new products using a comparable item, scale the comparable item's forecast by the ratio of the new product's average sales to the comparable item's average sales in the overlapping weeks. If no comparable item, use the average of the available weeks and a wide interval (e.g., ±50% to reflect high uncertainty).
     - Pass if: the forecast and interval are generated. The interval should be wide enough to reflect the uncertainty (e.g., for new products, the interval should be wider than for established ones).
     - Judgment: How to set the interval width? Consider the cost of overstocking (holding cost, waste) vs understocking (lost sales, customer dissatisfaction). Adjust the interval to be asymmetric if the costs are asymmetric.

   Step 5: Review and adjust for known future events and business context.
     - Adjust the forecast for known events: holidays, promotions, store closures, competitor actions, etc. Also, consider the business context: is this a strategic item (must have in stock even if it loses money)? Are there supply constraints? Adjust the order quantity accordingly, possibly deviating from the statistical forecast.
     - Pass if: adjustments are made for all known events and constraints. If there are no known events, then the statistical forecast stands.
     - Judgment: How much to adjust? This is based on the analyst's knowledge of the event's impact (e.g., a 20% lift during a promotion). Also, if the forecast is for a new product with very little data and no comparable item, the analyst must set the order based on intuition and the business context (e.g., start with a small order and monitor).

   The procedure should be executed within one hour. If at any step the data is insufficient or the model fails, the analyst must make a judgment call and document the reason. This procedure balances data-driven methods with necessary human input, especially for novel situations.
answer: |-
  Here is a five-step procedure for weekly grocery demand forecasting:

  1. **Audit data completeness and anomalies**  
     Check the item's sales history: minimum 8 weeks required. For established items, verify ≥1 year of data. Flag weeks with stockouts, promotions, or external shocks (e.g., storms). Pass if ≥90% of recent weeks are anomaly-free.  
     *Judgment call*: Decide whether to exclude anomalous weeks or adjust values (e.g., impute missing flour sales during a supply outage).

  2. **Quantify volatility shifts**  
     Calculate the coefficient of variation (CV = standard deviation / mean) for two periods: **A** (last 4 weeks) and **B** (equivalent weeks 1 year prior). For new items (<6 months), compare CV to category benchmarks (e.g., dairy CV typically 0.2–0.4). Pass if |CV<sub>A</sub> - CV<sub>B</sub>| ≤ 0.1.  
     *Judgment call*: Interpret causes of high volatility (e.g., oat-milk's CV jump from 0.3 to 0.7 may signal trend change vs. noise).

  3. **Select model class via decomposition**  
     Apply STL decomposition (seasonal-trend-loess) to ≥1 year data. If seasonality strength > 0.6 (measured by FFT), use seasonal model (e.g., SARIMA). Else, if trend slope changes > 10% quarterly, use trend-capturing model (e.g., ETS). For new items, default to simple exponential smoothing.  
     *Judgment call*: Override for known regime shifts (e.g., flour price spike invalidates seasonal patterns).

  4. **Generate forecasts with uncertainty intervals**  
     Run model to produce point forecast and 70% prediction interval. Validate with walk-forward testing: if >30% of recent forecasts fall outside intervals, widen uncertainty by 25%. For new items, blend with analogous products (e.g., almond milk sales × 0.8 for oat milk).  
     *Judgment call*: Manually adjust intervals when historical analogs fail (e.g., pandemic-era uncertainty).

  5. **Apply business logic and sign-off**  
     Adjust forecast using known factors: upcoming ads (+15–40%), holidays (±20%), or substitutions (e.g., competitor recall). Calculate economic order quantity (EOQ) balancing holding costs and stockout penalties. Pass if adjusted forecast meets CFO-set risk tolerance (e.g., ≤5% waste target).  
     *Judgment call*: Finalize order when data is inconclusive (e.g., three-week oat-milk launch: hedge with 50% of analogous product's order).
