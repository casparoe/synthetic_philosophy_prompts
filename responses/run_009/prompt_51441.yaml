prompt: |-
  I run the disability services office at a mid-sized community college, and every exam season my staff and I make something like thirty decisions about what a student may keep with them in a proctored exam: a paper notebook the student carries everywhere, a phone full of notes, a human note-taker, a smartwatch that prompts them through steps. Our official standard -- accommodations that are reasonable and don't fundamentally alter what the exam measures -- gives us almost nothing to work with, and instructors appeal half of what we approve, which puts my staff in the position of defending gut calls to a Dean who wants reasons.

  Some years ago I read a popular piece about a philosopher who argued that if a patient with memory damage wrote everything in a notebook and always had it with him, the notebook was doing the same job his brain used to do, so calling it "not really his memory" was arbitrary. I have no philosophy training, but this struck me as the only principled handle we have: for some students, the object they're asking to bring in is genuinely part of how they think, and taking it away isn't removing a crutch, it's removing part of the mind doing the exam. For other students it's plainly a shortcut around what the exam is supposed to measure. My staff can't tell which is which by intuition, and neither can the instructors, and I'd like to stop pretending we can.

  Please turn that idea into a procedure my staff can actually run, in about fifteen minutes per request: an ordered list of questions, what counts as a sufficient answer to each, where the procedure stops with a firm no (the aid is clearly not part of the student's thinking), where it stops with a firm yes (the aid clearly is, so banning it changes what the exam measures rather than preserving it), and where it must hand the decision to the accommodations committee because the remaining question is about what the course is for rather than about the student. Ground it in whatever the philosophy of mind actually says about when an external thing becomes part of someone's cognition, but keep the questions plain enough for a staff member without any theory.

  Then run it on four requests from last spring: (1) a student with a brain injury who carries a paper memory notebook everywhere, relies on it completely, and wants it in a closed-book history exam; (2) the same student in a math exam where the instructor insists the course goal is performing without reference material; (3) a student with severe ADHD whose phone holds notes she wrote herself but half-trusts, asking to keep the phone during a paper exam; (4) a student asking to use an AI assistant during a closed-book philosophy exam because, he says, it is now simply how he thinks. Flag which of these the procedure settles and which it can't, and be blunt about where you think the verdict will be one I won't like.

  Finally, tell me where the procedure is most likely to misfire, and what would have to be true -- about the philosophy, or about our students, or about what exams are for -- for the verdicts to come out the other way. If the underlying idea about minds and their tools is less settled than the popular version I read, I would rather know that than have a procedure that pretends otherwise.
reasoning: |-
  Okay, I need to help this disability services director create a procedure based on that philosopher's idea about external objects being part of cognition. They're dealing with exam accommodations and want something practical that staff can use in 15 minutes per request. 

  First, I recall Andy Clark and David Chalmers' extended mind theory - that's probably what that popular piece was referencing. The key idea is that if an external tool is constantly available, automatically endorsed, and reliably used, it can be considered part of the cognitive system. That seems like a solid foundation.

  For the procedure, I should break it down into clear yes/no questions that don't require philosophical training. The first question should be about constant access - is this item always with the student and treated as essential? If no, it's probably not part of their cognition. If yes, move to reliability: is the information in it automatically trusted? 

  Then the critical question about disruption: would removing this tool damage their cognitive function rather than just removing a reference? This distinction is crucial - the difference between losing part of your mind versus losing a cheat sheet. 

  For implementation, I imagine a flowchart approach with three possible outcomes: definite no (not cognitive), definite yes (integrated cognitive tool), or committee referral when it's about course objectives. 

  Now applying this to their four cases: 
  That history student with the memory notebook clearly passes all criteria - it's literally replacing biological memory. But in the math class, the procedure would flag it for committee review since now it's about whether "performing without reference" is essential to the course.

  The ADHD student with her phone is tricky. Half-trust suggests it's not automatic endorsement, so probably doesn't qualify as cognitive extension. But the AI philosophy student case is fascinating - current AI tools aren't reliable or automatic enough to count as extended cognition, but this might change in the future.

  Biggest risks I see are: students overclaiming integration, staff misjudging "automatic endorsement," and disciplines disagreeing about what constitutes "core" skills. Also worth noting that extended mind theory isn't universally accepted in philosophy - it's more of a provocative hypothesis than settled science.

  The director seems to want honesty over false certainty, so I should emphasize where the procedure has limitations while still giving them a practical decision tree that's better than gut calls.
answer: |-
  Here's a procedure grounded in the Extended Mind Thesis (Clark & Chalmers, 1998), streamlined for practical use. It focuses on **integration, reliability, and indispensability** of the tool to the student's cognitive process. Staff run these questions in sequence, stopping when a definitive answer is reached.

  **Procedure: "Integrated Cognitive Tool" Assessment (15-Minute Protocol)**

  1.  **CONSTANT ACCESS & DEPLOYMENT:**
      *   **Question:** "Is this object *always immediately available* to the student during relevant tasks in daily life (not just studying), and do they *automatically reach for it* as a primary resource, treating it as part of their thinking process?"
      *   **Sufficient "Yes":** Student habitually carries/uses the item for core cognitive tasks *unrelated to academics* (e.g., scheduling life, recalling personal info, navigating routines, communicating). Documentation/therapist notes describing this constant reliance strengthen the case.
      *   **Sufficient "No":** Item is primarily used only for studying/this course, or student easily functions without it for significant non-academic cognitive tasks (e.g., leaves phone behind regularly, doesn't consult notebook for daily plans).
      *   **Stop Here:** If "No" → **Request Denied.** The tool is not sufficiently integrated; it's likely a study aid or shortcut.
      *   **If "Yes" → Proceed to Question 2.**

  2.  **RELIABILITY & AUTOMATIC ENDORSEMENT:**
      *   **Question:** "Is the information provided by the tool *automatically trusted and used* by the student without significant secondary verification, functioning as seamlessly as their biological memory/brain function *for the specific cognitive need it addresses*?"
      *   **Sufficient "Yes":** Student uses the tool without hesitation or cross-checking (e.g., consults memory notebook for a date like recalling their own birthday, uses step-by-step prompts without re-deriving steps). It acts as primary, trusted recall.
      *   **Sufficient "No":** Student reports double-checking the tool's info, doubts its accuracy frequently, or uses it only after trying (or failing at) unaided recall first. It requires conscious verification.
      *   **Stop Here:** If "No" → **Request Denied.** The tool lacks the reliability and "transparent trust" of an integrated cognitive process; it's an external reference requiring conscious evaluation.
      *   **If "Yes" → Proceed to Question 3.**

  3.  **COGNITIVE FUNCTION REPLACEMENT (vs. AID):**
      *   **Question:** "Does removing this tool *damage the student's core functional cognitive capacity* for the task (like removing part of their working memory), rather than merely *removing access to stored information or reducing effort*?"
      *   **Sufficient "Yes":** Without the tool, the student demonstrates a *fundamental inability* to perform the *cognitive function* the tool provides, even for basic, non-academic tasks (e.g., cannot recall recent events *at all* without notebook; cannot sequence simple multi-step tasks without prompts; severe aphasia patient needing communication device). The tool *is* the functional cognitive capacity.
      *   **Sufficient "No":** Without the tool, the student can still *attempt* the core cognitive function (recall, calculation, reasoning) but does so slower, less accurately, or with greater effort (e.g., can recall some facts slowly, can do math with effort/errors, can reason but gets distracted). The tool *aids* a capacity that exists, albeit impaired.
      *   **Stop Here:** If "Yes" → **Request Approved (Conditional).** Tool is deemed an integrated cognitive prosthetic. **BUT**, flag for committee if Q3 "Yes" conflicts with core exam method (see below).
      *   **Stop Here:** If "No" → **Request Denied.** The tool enhances or supports an existing cognitive function but is not *constitutive* of it; removal tests the impaired underlying capacity the exam aims to measure.

  4.  **CORE EXAM METHOD CHECK (Post-Approval Flag):**
      *   **Question (For Staff, if Q3 was "Yes"):** "Does allowing this tool *directly negate* the explicitly stated, fundamental method or skill being tested by *this specific exam* (e.g., 'perform calculations unaided', 'recall specific dates/facts from memory', 'generate original arguments independently')?"
      *   **Staff Action:**
          *   If **No** → **Final Approval.** (e.g., Using a memory notebook in an essay exam testing historical *analysis*, not date recall; using step prompts in a math exam focused on *problem selection and setup*, not arithmetic execution).
          *   If **Yes** or **Unclear** → **Refer to Accommodations Committee.** This is no longer about the *student's mind*, but about defining the *course's essential learning outcome/assessment method*. The committee (incl. faculty) must decide if the stated method is truly essential or can be modified without altering the core competency.

  **Application to Cases (Spring Requests):**

  1.  **Brain Injury Student - Memory Notebook (History Exam):**
      *   Q1: **Yes.** Carries everywhere, relies completely for daily life.
      *   Q2: **Yes.** Automatically trusted, primary recall mechanism.
      *   Q3: **Yes.** Removal damages core recall capacity.
      *   Q4: **Flag/Committee?** *Depends on the history exam*. If it explicitly tests *factual recall* (dates, names, treaties) as a core outcome → **Refer to Committee.** If it tests analysis, synthesis, argumentation using facts → **Approved.** *(Procedure likely settles Q1-Q3 as approval, flags Q4 for committee if recall is core).*
      *   **Verdict:** Settled as Integrated Tool (Approved), *but* sent to Committee if History Dept. argues factual recall is core.

  2.  **Same Student - Memory Notebook (Math Exam, "Performing Without Reference" Goal):**
      *   Q1-Q3: Same as above → **Approved (Conditional)** based on integration.
      *   Q4: **Yes.** Instructor explicitly states "performing without reference material" *is* the core skill being tested.
      *   **Verdict:** **Referred to Committee.** The tool *is* integrated, but its use *directly negates* the stated fundamental exam method. Committee must decide if "unaided calculation" is truly essential to the course's math competency or if analysis/problem-solving is the real goal. *(This is the verdict you might not like – the procedure confirms the notebook is part of the student's mind, but forces a hard conversation with faculty about what "math skill" actually means).*

  3.  **ADHD Student - Phone with Self-Written Notes (Paper Exam):**
      *   Q1: **Maybe/Probably?** ADHD often involves constant phone use for organization/reminders. Need specifics: Is the phone *always* the primary, automatic tool for the *specific cognitive functions* the notes address?
      *   Q2: **No.** "Half-trusts" indicates lack of automatic endorsement. Requires conscious verification (doubting, double-checking). **STOP.**
      *   **Verdict:** **Denied at Q2.** The phone/notes lack the seamless integration and automatic trust required. It functions as an untrusted external reference, not an extension of cognition. Removal tests impaired recall/executive function under pressure.

  4.  **Student - AI Assistant (Closed-Book Philosophy Exam):**
      *   Q1: **Maybe?** Does he *constantly* use it for *all* reasoning, even simple daily decisions? Unlikely to be true currently.
      *   Q2: **No.** Current AIs are probabilistic, hallucinate, require prompt engineering. Cannot be automatically trusted without verification. **STOP.**
      *   Q3: **No.** Removal doesn't destroy reasoning capacity; it removes a powerful (but fallible) external aid. Reasoning capacity, while perhaps shaped by AI use, still exists internally.
      *   **Verdict:** **Denied at Q2 or Q3.** Current AI lacks the reliability and transparency for seamless cognitive integration. It fundamentally alters the exam from testing the *student's* reasoning to testing their ability to *use* or *evaluate* the AI's output. *(This denial is firm based on current tech).*

  **Where the Procedure is Most Likely to Misfire & Underlying Uncertainties:**

  1.  **Judging "Automatic Endorsement" (Q2):** Distinguishing seamless trust from habitual-but-verified use is subtle. Staff might misinterpret self-doubt related to disability (e.g., OCD checking) as lack of integration, or over-reliance on a habit as true endorsement. *Requires careful interviewing about specific non-academic use cases.*
  2.  **"Core Exam Method" Ambiguity (Q4):** Defining what an exam "fundamentally measures" is often contested philosophy *itself*. Faculty may claim a skill is "essential" based on tradition rather than modern competency. The procedure outsources this messy debate to the committee, but it remains the biggest source of conflict.
  3.  **Dynamic Integration:** Cognition evolves. A phone used initially as a crutch *might* become truly integrated over years for an ADHD brain. The procedure is a snapshot. Re-assessment may be needed.
  4.  **The Philosophy Isn't Settled:** The Extended Mind Thesis (EMT) is influential but debated. Key criticisms relevant here:
      *   **Coupling vs. Constitution:** Critics argue tools are *coupled* to the mind but not *constitutive* of it (like a carpenter's hammer isn't part of their body). Denying the tool doesn't damage the mind, just its effectiveness.
      *   **Metacognition:** Even integrated tools might require internal metacognition (knowing *when* to consult, *how* to interpret), which the exam might fairly test.
      *   **"Brainbound" Bias:** Some argue EMT underestimates the unique biological nature of cognition. Exams might legitimately aim to test the biological system in isolation.
      *   **Social/Technological Change:** EMT was conceived pre-smartphones/ubiquitous AI. Applying it fairly to rapidly evolving tech is uncharted territory. Is an always-on, personalized AI truly different from a memory notebook? *Currently, reliability issues prevent AI from qualifying, but this could change.*

  **For Verdicts to Change (What Would Have to Be True):**

  1.  **Different View of Cognition:** If you reject EMT and hold a strictly "brainbound" view, all external tools are aids/crutches. Verdicts would shift to almost universal denial unless the tool compensates for purely physical access issues (e.g., screen reader).
  2.  **Different View of Exams:** If exams are seen as testing real-world problem-solving *using all available tools*, then restrictions become largely arbitrary. Verdicts would shift towards approval for any personal tool, integrated or not. (This clashes with most academic traditions).
  3.  **Different Student Reality:** If students grew up with truly seamless, reliable neural implants/AI from birth, making them cognitively dependent in a way current assistive tech rarely achieves, then approvals for such tech would become the norm (like glasses).
  4.  **Different Tech (Specifically for AI):** If AI assistants became perfectly reliable, personalized, passively accessible (e.g., neural lace), and used automatically for *all* reasoning without conscious prompting/verification, it *could* potentially meet Q1-Q3. This would force a radical redefinition of education and assessment (the Q4 committee question would be existential for most courses). We are not there yet.

  **Conclusion:**

  This procedure provides a **principled, non-arbitrary framework** grounded in a credible (though debated) philosophy of mind. It replaces gut calls with structured questions about integration and function. It will:

  1.  **Firmly Deny** requests where the tool is clearly not integrated (Case 3 & 4 under current tech).
  2.  **Firmly Approve** deeply integrated tools *when the exam method doesn't explicitly forbid their core function* (Case 1, if recall isn't core).
  3.  **Force Difficult Committee Discussions** when an integrated tool conflicts with a stated core exam method (Case 2, and Case 1 if recall is core). *This is where the friction with faculty will concentrate, but it's an honest friction about course goals, not a debate about the student's needs.*

  It acknowledges the unsettled nature of the philosophy by focusing on observable *function* (constant access, automatic use, functional replacement) rather than metaphysical claims, and by explicitly handing off the "course purpose" question. It is most vulnerable to misjudging the depth of integration (Q1-Q2) and to the inherent conflict between integrated tools and traditional "closed-book" assessment paradigms. It is a tool for fairer, more transparent decisions, not a magic bullet to eliminate conflict.
