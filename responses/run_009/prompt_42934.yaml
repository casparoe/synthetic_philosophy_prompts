prompt: |-
  My roommate is a moral particularist and last night, over truly terrible noodles, he walked me into an argument I can't get out of. It goes: (1) a moral principle, to count as a principle at all, has to pick out some consideration -- lying, promise-keeping, causing pain -- and say it always makes the same contribution to whether an act is right, wherever it turns up. Call that the invariance requirement. (2) But for any candidate principle you can cook up a case where the consideration flips: a lie that saves a life, a promise whose keeping ruins someone, pain that's exactly what the patient asked for. (3) So there are no true moral principles, and moral judgment is just seeing the whole situation, case by case. That part I half buy, honestly. What bugs me is what he said when I pushed him: (4) the argument is completely general, so it applies to what to believe, not just what to do. "Trust your senses," "prefer the simpler theory," "accept testimony unless you have reason not to" -- each of those has cases where the consideration flips (illusions, misleadingly simple wrong theories, lying witnesses). (5) So by his own lights there are no epistemic principles either, and he just shrugged and said fine, good reasoning is also seeing the case as a whole.

  Here's why I think this proves to much somewhere. If nothing general survives, I don't see how his own argument survives, because it runs on the maximally general claim that every principle has a flipping case -- which looks a lot like a principle about principles, with no exceptions allowed. But I can't locate the bad step. I'd like to keep (2), the cases all seem real to me. And I vaguely know generalists have things like W.D. Ross's prima facie duties -- does that dodge the invariance requirement, or does it just restate the problem one level up ("prima facie duty" starts to sound like a principle about how considerations normally contribute, which the flipping cases were supposed to forbid)? Tell me which premise or step to reject and what rejecting it costs, including whether the generalist escape routes are real escapes or just relabeling.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is dealing with a philosophical argument from their roommate, a moral particularist. The roommate argues that there are no true moral principles because any proposed principle can have exceptions (like lying sometimes being good to save a life). The user finds this compelling but is troubled when the roommate extends this to epistemic principles (rules for belief). The user suspects this proves too much, especially since the argument itself relies on a general principle—that every principle has a flipping case—which seems self-defeating. They want to know which premise to reject and whether generalist approaches like Ross's prima facie duties solve the problem.

  First, I need to identify the core issue. The roommate's argument hinges on the invariance requirement: a principle must always apply without exception. The flipping cases show that moral and epistemic considerations can change their moral valence depending on context. But step (5) claims this eliminates all principles, yet the argument uses a general principle itself. That's the self-defeat problem.

  The user is stuck between accepting the flipping cases (premise 2) and seeing the inconsistency in the roommate's position. They mention Ross's prima facie duties as a potential solution but worry it just moves the problem up a level. I need to evaluate if Ross's approach avoids the invariance requirement or not. 

  Prima facie duties are context-sensitive; they indicate a presumptive reason that can be overridden. This rejects the invariance requirement because it allows that a consideration (like keeping promises) isn't invariant—it can be outweighed. So Ross isn't claiming an invariant contribution, which sidesteps the flipping cases. However, particularists might argue that even the notion of a "presumptive" reason is too general. The user is right that if the particularist insists on strict invariance, then Ross's duties aren't principles in that sense. But Ross's view isn't defeated by flipping cases because it expects them. So rejecting premise (1)'s invariance requirement is key here. 

  The self-defeat problem is the strongest point against the roommate. If all principles must have exceptions, then the principle "every principle has a flipping case" must also have exceptions. But if it does, then some principles might not have flipping cases, contradicting the argument. The particularist might respond by saying their claim isn't a principle but a generalization. However, the argument relies on it as a universal claim. The user needs to push on this inconsistency.

  The user's deeper need might be understanding if moral reasoning can have any structure without being rigid. They might want a middle ground between absolutism and complete particularism. Ross offers that, but the cost is that principles are defeasible, not absolute. The user should consider if this satisfies their intuition about morality having some consistent elements.
answer: |-
  Reject premise (1)'s "invariance requirement" as an incorrect characterization of genuine moral (and epistemic) principles; this preserves the reality of flipping cases while allowing defeasible principles like Ross's prima facie duties, though it concedes principles lack absolute exceptionless invariance.

  Here's the reasoning:

  1.  **The core problem is the invariance requirement:** Premise (1) defines a moral principle *only* as something that asserts a consideration *always* makes the *same invariant contribution* (e.g., lying is *always* wrong-making) in *every* possible situation. This sets an impossibly high bar.
  2.  **Flipping cases (premise 2) are real but don't defeat defeasible principles:** Your examples (life-saving lies, etc.) accurately show that the *overall* moral valence of an act can change based on context. However, this doesn't mean the consideration (e.g., lying) makes *no* consistent contribution. It consistently provides a *pro tanto* or *prima facie* reason against the act (a reason that can be overridden by stronger reasons). The flipping case shows the *overriding*, not the *absence* of the initial reason.
  3.  **Ross's prima facie duties *are* the escape:** Ross explicitly rejects the invariance requirement. A prima facie duty *is* a genuine, general moral principle. It identifies a consideration (e.g., promise-keeping) that *always* provides a *defeasible* moral reason for action. Its contribution is consistent (it always counts *in favor* of keeping the promise), but *not* invariant in the sense of always determining the overall rightness, because it can be outweighed. This isn't just "relabeling"; it's a robust account of how multiple general principles interact contextually. The "flipping cases" are *expected outcomes* of this interaction, not refutations of the principles themselves.
  4.  **The argument *does* prove too much via self-defeat:** Your intuition is correct. The particularist's own argument relies on a maximally general, exceptionless principle: "For *every* candidate invariant principle P, there exists a situation where P's consideration flips valence." This *is* presented as a universal, invariant principle about principles. If *no* genuine general principles can exist (as (3) & (5) conclude), then *this very principle* cannot exist, undermining the argument. The particularist might try to call it a "generalization" rather than a "principle," but its role in the argument is clearly that of an exceptionless rule governing all moral/epistemic principles.
  5.  **Cost of rejecting invariance:** Rejecting (1) means accepting that genuine moral and epistemic principles are *defeasible*. They provide stable, general, but *not* absolute, reasons. "Tell the truth" is a real principle, consistently giving a reason for truth-telling, even if that reason is sometimes outweighed (e.g., to save a life). Similarly, "Trust your senses" provides a general, defeasible epistemic reason. This rejects the idea that only exceptionless rules count as principles. The cost is abandoning the hope for algorithmic, context-insensitive moral or epistemic rules. Judgment is still needed to weigh principles in specific cases, but this judgment operates *on* general reasons, not in their utter absence.

  **Therefore:** Premise (1) sets up a straw man by demanding impossible invariance. Rejecting it allows for Ross-style defeasible principles that accommodate flipping cases without collapsing into particularism, and avoids the self-defeating universal claim inherent in the particularist's argument.
