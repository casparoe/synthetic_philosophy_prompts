  First, I need to understand the key players: the phenomenal internalist believes pain's badness is inherent in how it feels, while the constitutive attitudinalist thinks badness only comes from our negative attitude toward the sensation. The main evidence comes from pain asymbolia cases where patients report pain but say it doesn't bother them.

  The document needs several specific sections. For the agreed claims section, I'll list points both theorists accept without disagreement - things like the empirical description of asymbolia, how it differs from congenital insensitivity, and the reliability of patient reports. I need to be careful that both would endorse every word here.

  Then comes the tricky part about "grades of not being bothered." I should distinguish between: (a) just lacking physical reactions, (b) actually not feeling unpleasantness, and (c) feeling unpleasantness but not caring about it. Both philosophers need to say which type they think asymbolia represents, and why certain cases wouldn't threaten their theories.

  For the disagreements table, I'll present each disputed point twice - once in internalist-friendly language, once in attitudinalist-friendly terms. This avoids caricaturing either position.

  The cruxes section is crucial. I'll include the restoration-choice test (what asymbolic patients would choose if offered normal pain responses) and the reverse-dissociation question (whether badness can exist without pain). Each side should make testable predictions here.

  In concessions, I'll outline what each would give up if the other's predictions proved true. And finally, I'll address whether their disagreement is merely verbal once terms are clarified, or if something substantive remains.

  Throughout, I'll maintain a neutral, collaborative tone - this is supposed to be a document both would actually sign. I'll avoid taking sides and focus on precise philosophical distinctions.
answer: |-
  ## Joint Statement on Pain Asymbolia and the Badness of Pain  
  **Signed: The Phenomenal Internalist & The Constitutive Attitudinalist**

  ### 1. Agreed Claims
  1.  **Empirical Picture of Asymbolia and Adjacent Dissociations:** Damage to, or disconnection of, the insular cortex and anterior cingulate cortex (or analogous disruptions via morphine or cingulotomy) can result in a specific dissociation. Patients reliably report experiencing sensations they identify as *pain* (e.g., pinprick, heat, pressure) based on their sensory-discriminative qualities, yet simultaneously insist these sensations *do not bother them*, cause no distress, and do not motivate withdrawal or avoidance. They can accurately localize and describe intensity.
  2.  **Contrast with Congenital Insensitivity to Pain (CIP):** CIP involves a fundamental lack of nociceptive input or processing, resulting in *no conscious sensation* identified as pain in response to noxious stimuli. Asymbolia, in contrast, involves a *preserved conscious sensation* identified as pain, but lacking its typical negative motivational and affective consequences.
  3.  **Distinction: Nociception, Pain, Suffering:**
      *   *Nociception:* The neural process of encoding and transmitting potentially harmful stimuli by sensory neurons.
      *   *Pain:* A conscious sensory experience, typically including sensory-discriminative (location, intensity, quality) and affective-motivational (unpleasantness, urgency) components, arising from or resembling that caused by actual or potential tissue damage.
      *   *Suffering:* A broader, often more enduring, negative affective state involving distress, anguish, or aversion, which can be caused by pain but also by other sources (e.g., grief, fear). Suffering typically involves a higher-order evaluation or reaction to a state or situation.
  4.  **Reliability of Patient Reports:** When a patient (e.g., with asymbolia, under effective morphine, post-cingulotomy) sincerely reports "it hurts but it doesn't bother me," this report is credible evidence regarding their *phenomenology* and *attitude*. They are accurately reporting the presence of a sensation they recognize as pain and the absence of its typical negative affect, aversion, or felt bother. We accept this as a robust datum.

  ### 2. Clarifying "Not Being Bothered": Grades and Stakes
  We agree that "not being bothered" by a painful sensation is ambiguous and requires careful differentiation. We distinguish at least three grades:

  *   **(a) Absence of Withdrawal/Avoidance Behavior:** The subject experiences the pain sensation and finds it unpleasant/aversive, but due to inhibition, paralysis, or strategic reasons (e.g., endurance), does not act on the aversion.
  *   **(b) Absence of Felt Unpleasantness:** The subject experiences the sensory-discriminative component of pain (e.g., sharp, burning, throbbing) but entirely lacks the intrinsic *phenomenal unpleasantness* or negative affect normally fused with it. The sensation is affectively neutral, like seeing the color red.
  *   **(c) Presence of Felt Unpleasantness + Disownership:** The subject experiences both the sensory-discriminative component *and* an intrinsic phenomenal unpleasantness, but this unpleasantness fails to engage their broader caring structure. They register the unpleasantness but are indifferent to it; it does not *matter* to them. They disown its significance.

  *   **Our Interpretations of Cases:**
      *   **Asymbolia:** We jointly interpret the core phenomenon as **Grade (c)**. The patient reports the sensation *is* unpleasant ("hurts") but insists it *does not bother them* and shows no concern. The key datum is the report of pain alongside profound indifference. We differ on what this implies for badness.
      *   **Morphine/Cingulotomy Dissociation:** We interpret this similarly to asymbolia, as **Grade (c)** – a reported unpleasant sensation present but disconnected from concern or motivation.
      *   **Hypnotic Analgesia:** This plausibly instantiates **Grade (b)**. Reports often describe the sensation becoming merely "pressure," "warmth," or "interesting," suggesting a qualitative change eliminating the intrinsic unpleasantness, not just indifference to it.

  *   **What Hangs on the Answer:**
      *   **Internalist:** Cases of **Grade (b)** (absence of felt unpleasantness) are *harmless* to my view. If the intrinsic phenomenal unpleasantness is absent, the pain *qua* bad experience is absent. My claim is that the *unpleasantness itself* is the badness. Cases of Grade (c) are the challenge: I maintain the reported unpleasantness *is* the badness, regardless of disownership.
      *   **Attitudinalist:** Cases of **Grade (c)** (presence of felt unpleasantness + disownership) are *harmless* to my view. My claim is that the sensory component (even if labeled 'unpleasant') is badness-neutral. What confers badness is the subject's negative evaluative attitude (aversion, caring that it stops). In Grade (c), that attitude is absent, hence the experience lacks badness *for the subject*, despite any residual sensory unpleasantness. Cases of Grade (b) are less central to my challenge.

  ### 3. Disagreements Table

  | Core Disagreement                                                                 | Internalist's Formulation                                                                                                 | Attitudinalist's Formulation                                                                                                 |
  | :-------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of Pain's Badness:**                                                  | The intrinsic phenomenal character of a painful experience – specifically its felt unpleasantness – constitutes its badness. This badness is intrinsic to the phenomenal state itself. | The sensory-discriminative component of a painful experience is affectively neutral. Its badness is constituted solely by the subject's negative evaluative attitude (aversion, dislike, desire for cessation) towards that sensation. |
  | **2. Status of Asymbolic Pain:**                                                  | In asymbolia, subjects experience genuine pain, including its intrinsic badness (the felt unpleasantness). Their indifference does not negate this badness; it merely reflects an inability to *respond* appropriately to it. | In asymbolia, subjects experience the sensory-discriminative component typical of pain, but lack the negative evaluative attitude. Therefore, while they experience a *sensation*, they do not experience a *bad* state; the pain lacks badness *for them*. |
  | **3. Relationship between Phenomenology and Attitude:**                           | The felt unpleasantness (the bad-making phenomenal property) is ontologically prior to and separable from the subject's conative attitudes (like aversion). Attitudes are responses *to* the badness given in the phenomenology. | The negative evaluative attitude is not merely a response; it is *constitutive* of the badness. The phenomenology labeled "unpleasantness" is either identical to, or supervenes on, the attitude, or is rendered bad *by* the attitude. There is no intrinsic badness separable from the attitude. |

  ### 4. Cruxes: Key Testable Disagreements
  1.  **The Restoration-Choice Test:**
      *   **Scenario:** A stable, cognitively intact asymbolic patient (experiencing Grade c: sensation + unpleasantness + indifference) is offered a safe, reversible procedure that would restore their typical, aversive reaction to their ongoing pain sensation.
      *   **Question:** (a) *Should* they choose restoration? (b) *Would* they choose restoration? (c) Does their choice (or lack thereof) indicate whether the pain was bad for them *prior* to restoration?
      *   **Internalist Prediction:** The patient *should* choose restoration because the pain is intrinsically bad. However, due to their pathology (lack of concern), they likely *would not* choose it. Their failure to choose does *not* mean the pain wasn't bad; it confirms their pathological indifference *to* the badness.
      *   **Attitudinalist Prediction:** The patient has no reason (*should not*) choose restoration, as the sensation currently lacks badness *for them*. They likely *would not* choose it. Their choice confirms the absence of badness *for them* prior to restoration; badness only arises if the aversion is restored.
      *   **Bearing:** This tests whether the alleged badness *demands* a motivational response (Attitudinalist) or can exist inertly (Internalist).

  2.  **The Reverse Dissociation: Badness Without Pain:**
      *   **Question:** Can states like profound grief, guilt, intense non-painful itch (where scratching is shameful but the itch itself isn't painful), or severe anxiety be intrinsically *bad* for the subject without involving any sensory state identifiable as *pain*?
      *   **Internalist Prediction:** **Yes.** These states possess their *own* distinct, intrinsic phenomenal unpleasantness (badness) that is not sensory pain. Their badness is not parasitic on pain.
      *   **Attitudinalist Prediction:** **Yes, and critically so.** These states demonstrate that badness is fundamentally tied to negative evaluative attitudes (aversion, dislike, frustration) directed at one's state or situation, *not* to a specific sensory modality like pain. Badness is attitude-dependent, not pain-dependent.
      *   **Bearing:** If both agree badness exists without pain, it weakens the Internalist's claim that pain's badness is *sui generis* and uniquely tied to its sensory phenomenology. It strengthens the Attitudinalist claim that badness is a function of attitude. The disagreement shifts to whether *all* badness, including that of non-pain states, requires an Attitudinal component or if some states have intrinsic phenomenal badness.

  ### 5. Concessions
  *   **If Internalist Crux Predictions Prevail (Restoration chosen/should be chosen; Badness without pain exists but is analogous):** The Attitudinalist would concede that the phenomenal character of pain contains an intrinsic, attitude-independent badness component. They would need to significantly revise or abandon the claim that sensory pain is badness-neutral prior to attitude. They might retreat to claiming attitudes are necessary for *motivation* or *suffering*, but not for the core badness.
  *   **If Attitudinalist Crux Predictions Prevail (Restoration not chosen/shouldn't be; Badness without pain confirms attitude-dependence):** The Internalist would concede that the phenomenal character labeled "unpleasantness" in cases like asymbolia does *not* constitute intrinsic badness in the absence of the relevant negative attitude. They would need to accept that badness requires a conative/evaluative component beyond mere sensation, or radically reinterpret the asymbolia reports as not involving genuine unpleasantness (a move they previously avoided).

  ### 6. Verbal vs. Substantive Disagreement
  We jointly judge that significant aspects of our dispute hinge on terminology, particularly the conflation of distinct concepts:

  1.  **Unpleasantness:** The intrinsic, phenomenal quality of a sensation (e.g., the "ouchiness").
  2.  **Badness (Disvalue):** The property of being negative, undesirable, or "to-be-avoided" for the subject.
  3.  **Suffering:** The global negative affect or distress, often involving higher-order evaluation and endurance over time.
  4.  **Mattering-to-the-Subject:** The engagement of the subject's cares, concerns, and motivations.

  *   **Verbal Agreement Possible:** If "badness" is *defined* strictly as the intrinsic phenomenal unpleasantness, then the Internalist view becomes almost tautological. If "badness" is *defined* strictly as the presence of a negative attitude, then the Attitudinalist view becomes almost tautological. Much of our disagreement vanishes if we stipulate definitions and agree that asymbolia involves unpleasantness without negative attitude/mattering.
  *   **Substantive Residue:** However, a core substantive disagreement survives terminological clarification:
      *   The **Internalist** maintains that the *phenomenal unpleasantness itself* (once clearly distinguished) is the fundamental locus of (at least one kind of) disvalue – it is what *makes* the experience bad and is the primary object of the negative attitude when present. Its presence constitutes a harm.
      *   The **Attitudinalist** maintains that phenomenal unpleasantness, however vivid, is merely a *sensory quality*. Disvalue/badness arises only when this quality (or any other state) becomes the object of a negative evaluative attitude within the subject's caring structure. Unpleasantness without this attitude is a harm only in a derivative sense (e.g., indicating potential tissue damage), not intrinsically.

  **In essence:** We disagree on whether phenomenal unpleasantness is *constitutive* of a core form of badness (Internalist), or whether it is simply a *trigger* or *object* for the attitudes that *constitute* badness (Attitudinalist). This reflects a deeper divergence about the nature of value and disvalue in conscious experience. This residual disagreement is substantive.

  ---
  **Signed,**

  **[Signature Line for Phenomenal Internalist]**

  **[Signature Line for Constitutive Attitudinalist]**
