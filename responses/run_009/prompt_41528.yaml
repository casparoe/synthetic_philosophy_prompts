prompt: |-
  I sit on the coverage committee of a regional health insurer, and our de facto policy is that we reimburse therapies and refuse enhancements — the difficulty being that after two years of votes, nobody on the committee can state the difference in a way that survives our own case files. Before we review another line-drawing proposal, I want the specification written down first. Write the desiderata: what any adequate account of the therapy/enhancement distinction has to deliver for the purpose of coverage decisions, with the motivating case behind each requirement. In particular, I want to see how the account must handle: vaccination and contraception, where we prevent a condition that has not yet occurred and yet everyone agrees we fund; growth hormone for a girl with Turner syndrome versus the same hormone for an equally short, healthy child; hearing aids and cochlear implants, where the treatment target is partly a mismatch between a body and a built environment; stimulants for a diagnosed ADHD patient versus the same pills taken off-label by a medical student the night before an exam; beta-blockers for angina versus beta-blockers for stage fright; and the cosmetic cases like LASIK and tooth alignment that our members write in about. The account also has to survive the generic slippery worry — that every intervention merely moves someone from one state to a better one, so therapy is just enhancement from a worse starting point — and it must not quietly rest on whatever is statistically common, since that would make the line shift with population health.

  Two further things I most want to see. First, mark which desiderata are non-negotiable for a funding body as opposed to merely analytic preferences — for instance, whether the distinction genuinely has to do normative work (picking out interventions we owe people) or whether descriptive classification plus a separate fairness argument could suffice, and note if you suspect any pair of requirements is jointly unsatisfiable, so that the list itself is a result. Second, a very brief scoring of the obvious contenders against your list: a biostatistical account resting on species-typical functioning, a fair-opportunity account in the spirit of Norman Daniels, and the eliminativist view that the distinction does no justificatory work at all and coverage should be decided on other grounds. Tell me which single requirement knocks out the most candidates — my own guess is the vaccination cases are the graveyard, but I want to be shown rather than told. Keep the weight on the criteria and their cases; the scorecard can be terse, since the committee will do its own arguing.
reasoning: |-
  Okay, let me start by unpacking what the user is asking for. They're on a coverage committee for a regional health insurer, and they've been struggling with distinguishing between therapies and enhancements for reimbursement. The main issue is that after two years of discussions, they still can't define the difference in a way that holds up against their own case files. So they want a set of desiderata—requirements that any adequate account of the therapy-enhancement distinction must meet. 

  First, I need to list the key cases they mentioned: vaccinations, contraception, growth hormone for Turner syndrome vs. a healthy child, hearing aids and cochlear implants, stimulants for ADHD vs. off-label use, beta-blockers for angina vs. stage fright, and cosmetic cases like LASIK and teeth alignment. Each of these examples presents a challenge to the distinction. 

  The user also highlighted two critical points. First, they want to know which desiderata are non-negotiable for a funding body versus just analytical preferences. For instance, does the distinction need to do normative work, or can it be descriptive with a separate fairness argument? Second, they want a brief evaluation of existing approaches: biostatistical, fair opportunity, and eliminativist views. They also want to identify which requirement disqualifies most candidates, suspecting vaccination cases are problematic.

  I recall that vaccinations and contraception are preventive measures. Everyone agrees they should be covered, but they don't fit neatly into therapy because they prevent conditions that haven't occurred yet. This challenges definitions that require existing disease. The growth hormone example contrasts medical necessity (Turner syndrome) versus cosmetic use, raising questions about what constitutes a disorder versus normal variation.

  Hearing aids and cochlear implants involve environmental interaction. Here, the impairment is partly defined by societal structures. Stimulants for ADHD versus off-label use by a student highlight intent and diagnosis. Beta-blockers for angina versus stage fright differentiate life-threatening conditions from performance anxiety. Cosmetic cases like LASIK blur the line between medical necessity and quality of life improvements.

  The slippery slope concern is that all interventions improve from a worse state, so therapy is just enhancement from a lower baseline. Also, they don't want the definition tied to statistical commonness because that would shift with population health. 

  Non-negotiable desiderata likely include handling prevention, not relying on statistical norms, and addressing environmental factors. The distinction must do normative work for coverage decisions. The vaccination case probably sinks many theories because they can't accommodate prevention without treating it as enhancement.

  Evaluating the contenders: The biostatistical model (Boorse) uses species-typical functioning. But it struggles with vaccinations (prevention), environmental mismatches (hearing aids), and statistical shifts. The fair opportunity model (Daniels) focuses on opportunity range. It handles prevention and environmental factors better but may overextend to enhancements like cognitive enhancers. Eliminativism rejects the distinction altogether, using cost-effectiveness and fairness instead. It avoids the definition problem but might be politically challenging.

  The user's deeper needs include a practical, defensible framework for coverage decisions that withstands real-world cases and avoids shifting definitions. They need clarity to prevent arbitrary denials and ensure consistency. Identifying non-negotiable criteria helps prioritize essential elements. The vaccination case is critical because it exposes flaws in models that can't account for preventive care, a core part of insurance coverage.
answer: |-
  Here are the desiderata for an adequate therapy/enhancement distinction for coverage decisions, derived from your case challenges and core constraints. Each requirement is anchored in a motivating case, with non-negotiables marked **(NN)** and potential tensions noted.

  ### Core Desiderata & Motivating Cases
  1.  **Must Accommodate Preventive Interventions (NN):** The account *must* classify effective prevention of future disease/injury (where harm is highly probable without intervention) as therapy, not enhancement.
      *   **Case:** Vaccination, contraception. Failure here collapses the distinction for core funded services.
      *   **Why NN:** A definition excluding prevention would force us to misclassify or deny coverage for universally accepted, cost-effective, health-protective interventions fundamental to insurance logic.

  2.  **Must Distinguish Disorder-Treatment from Statistically Suboptimal Functioning:** The account *must* differentiate treating a recognized pathological condition (like a genetic syndrome causing functional impairment) from improving a healthy individual functioning within the statistically normal range.
      *   **Case:** Growth hormone for Turner Syndrome (disorder causing pathological short stature & health risks) vs. same hormone for idiopathic short stature (healthy child at low percentile).
      *   **Why NN:** Coverage legitimacy hinges on addressing pathology, not optimizing normal variation; conflating them opens floodgates.

  3.  **Must Account for Environmental Mismatch (NN):** The account *must* recognize that some impairments requiring therapy are defined by a mismatch between individual function and the *built or social environment necessary for basic participation*, not just internal biological dysfunction.
      *   **Case:** Hearing aids/cochlear implants for deafness. The "disability" arises significantly from communication barriers in an auditory society. The intervention restores access to fundamental human interaction.
      *   **Why NN:** Refusing coverage here based purely on internal biology ignores the social reality of disability and denies access to basic human capabilities (communication, education).

  4.  **Must Incorporate Intent/Disease Context, Not Just Mechanism:** The account *must* differentiate interventions based on the *presence of a diagnosed disorder* and the *therapeutic purpose* for that individual, not solely on the biological mechanism of the intervention.
      *   **Cases:**
          *   Stimulants for diagnosed ADHD (treating core disorder impairing executive function) vs. same stimulants used off-label by healthy medical student for cognitive enhancement/exam cramming.
          *   Beta-blockers for angina (treating life-threatening cardiac condition) vs. beta-blockers for stage fright (reducing situational anxiety in a healthy individual).
      *   **Why NN:** Distinguishing legitimate medical treatment from performance enhancement is central to coverage integrity and resource allocation.

  5.  **Must Not Mistake Cosmetic Improvement for Necessary Therapy:** The account *must* clearly delineate interventions aimed at restoring health, function, or preventing disease from those aimed solely at improving appearance beyond societal norms, where no underlying pathology or functional impairment exists.
      *   **Case:** Orthodontics for severe malocclusion causing pain/difficulty eating vs. purely cosmetic tooth alignment. LASIK for severe refractive error impairing daily function vs. LASIK for mild myopia in contact lens wearer seeking convenience. (Note: Coverage for *some* cosmetic restoration post-disease/injury may be a separate fairness issue).
      *   **Tension Point:** Agreeing on the threshold of "impairment" for conditions like refractive error can be challenging.

  6.  **Must Resist the Slippery Slope ("Just Moving from Worse to Better"):** The account *must* provide a principled reason why therapy is categorically different from enhancement, not merely a matter of degree based on starting point.
      *   **Challenge:** Every intervention improves some state. The distinction must explain why treating malaria isn't just "enhancing" from a malaria-infected state.
      *   **Requirement:** Needs a robust concept of "disease," "disorder," "impairment," or "harm" that defines a departure from normal functioning warranting medical attention, distinct from mere suboptimal states.

  7.  **Must Not Be Statistically Relative (NN):** The account *cannot* define therapy solely by restoring statistically typical function for the population. The line must not shift based on population averages.
      *   **Case:** If hypertension prevalence skyrocketed, treating it shouldn't suddenly become "enhancement" under a statistical model. Growth hormone for Turner Syndrome isn't therapy *because* it makes the child taller relative to peers, but because it addresses a specific pathology.
      *   **Why NN:** Tying coverage to shifting population norms creates instability, unfairness, and perverse incentives. Pathology must be defined independently of prevalence.

  8.  **Must Do Normative Work for Coverage (NN - Likely):** The account must provide a *justification* for differential coverage (fund therapy, generally decline enhancement) based on the distinction itself. It cannot be merely descriptive; it must carry normative weight relevant to an insurer's obligations.
      *   **Why Likely NN:** If the distinction is purely descriptive, the *reason* for funding therapy but not enhancement must come entirely from a separate fairness/resource allocation argument. While possible, this weakens the intuitive link between "therapy" and "what we cover." A robust definition ideally contributes to the justification.

  ### Potential Tensions & Notes
  *   **Prevention (D1) vs. Slippery Slope (D6):** Defining "prevention" robustly without collapsing into preventing *any* future suboptimal state is crucial. Vaccines prevent specific infectious *diseases*, contraception prevents a specific biological condition (pregnancy) with associated health risks.
  *   **Environmental Mismatch (D3) vs. Cosmetic (D5):** Hearing aids address a functional impairment defined by the environment. Purely cosmetic changes do not. The challenge is interventions falling in a gray area (e.g., moderate refractive error).
  *   **Normative Work (D8) vs. Eliminativism:** If the distinction cannot bear the normative weight, eliminativism becomes more attractive, requiring a different justification schema for coverage.

  ### Brief Scorecard of Contending Accounts
  | Desideratum                 | Biostatistical (Boorse) | Fair Opportunity (Daniels) | Eliminativism                     |
  | :-------------------------- | :---------------------- | :------------------------- | :-------------------------------- |
  | **D1: Prevention**          | ✘ (No pathology *yet*)  | **✓** (Protects opportunity) | N/A (Rejects distinction)         |
  | **D2: Disorder vs. Normal** | **✓** (Core strength)   | **✓** (Disorder limits opportunity) | N/A                               |
  | **D3: Env. Mismatch**       | ✘ (Internal focus)      | **✓** (Addresses barriers) | N/A                               |
  | **D4: Intent/Context**      | △ (Weak on intent)      | **✓** (Focuses on purpose) | N/A                               |
  | **D5: Cosmetic**            | **✓** (If no dysfunction)| △ (Depends on opportunity impact) | N/A                               |
  | **D6: Slippery Slope**      | **✓** (Clear pathology) | △ (Opportunity range boundaries fuzzy)| **✓** (Avoids the slope)          |
  | **D7: Not Statistical**     | ✘ (Core flaw)           | **✓** (Normative, not stat)| **✓** (Ignores stats for line)    |
  | **D8: Normative Work**      | △ (Descriptive; needs +) | **✓** (Directly normative) | **✓** (Provides alt. framework) |

  **Key:** **✓** = Generally Satisfies, △ = Partially Satisfies/Depends, ✘ = Generally Fails, N/A = Not Applicable (rejects the distinction).

  **Which Requirement Knocks Out the Most?** **D1 (Prevention)** is indeed the graveyard. Biostatistical accounts categorically fail it. Fair Opportunity handles it well. Eliminativism bypasses it. **D7 (Not Statistical)** is a close second, definitively sinking the pure Biostatistical account and posing challenges for simplistic interpretations of others. **D3 (Environmental Mismatch)** sinks pure internal-dysfunction models like Biostatistical.

  **Conclusion for the Committee:** No existing account perfectly satisfies all desiderata, especially D1, D3, D7, and D8 simultaneously. **D1 (Prevention)** is the most devastating failure point for traditional models. The Fair Opportunity account handles the most *non-negotiable* cases (D1, D2, D3, D7) best, though it struggles most visibly with D5 (Cosmetic) boundaries and D6 (Slippery Slope). Eliminativism avoids the definitional problems but requires building a robust, alternative coverage justification framework from scratch, which may be the committee's necessary path forward if the distinction proves theoretically untenable for normative work. Prioritize debating D1, D3, and D8's normative necessity.
