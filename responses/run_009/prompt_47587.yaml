prompt: |-
  I've been running my local effective altruity student group's cause-selection process for the past year, and we basically live and die by the importance-tractability-neglectedness framework: score each cause roughly as the product of the scale of the problem, how solvable it is per unit of effort, and how much attention and money it's already getting. I've internalized this so thoroughly that I now get genuinely annoyed when someone pitches a cause without doing the three-factor breakdown first. But lately I've been having doubts, and I want to know what would actually count against the framework itself -- not against particular sloppy applications of it.

  The things that bug me: a friend who studies development economics pointed out that the multiplicative form means a cause that's mediocre on two dimensions but terrible on none will beat a cause that's spectacular on scale but merely middling on tractability, and I genuinely can't tell whether that's a bug (pandemic preparedness and existential risk seem like cases where it gives the wrong answer) or a feature. Also, I keep running into the worry that neglectedness is doing double duty -- if returns to effort are diminishing, then tractability per unit of effort already depends on how much effort has already gone in, so multiplying by a separate neglectedness term partially counts the same thing twice. And then there's the deeper problem that the framework feels unfalsifiable: whenever it crowns a winner people dislike, they just say the neglectedness score was miscalibrated, or that tractability should have been about marginal rather than average impact, or that some factor was missing entirely (coordination with other funders? feedback loops?), and the framework absorbs every correction without ever being at risk.

  So here's what I want: what would genuinely count against ITN as the right way, even at a rough heuristic level, to prioritize causes? Which observations, arguments, or formal results should move me, sorted from fatal to merely awkward? What does it actually predict that rival approaches (intuitive weighing of pros and cons, cost-effectiveness analysis of specific interventions, a "hits-based" portfolio view) don't, so that evidence could in principle arbitrate between them? I especially want the things the framework's own defenders would concede as counting against it, not just what outside critics say. And finally, be honest about whether it's been qualified so much that it no longer risks anything -- and if so, whether that even matters for a rough heuristic of this kind, or whether an unfalsifiable framework that nonetheless organizes your thinking well is perfectly fine.
reasoning: |-
  Okay, the user is deeply involved in running a local Effective Altruity student group and has been using the Importance-Tractability-Neglectedness (ITN) framework for cause prioritization. They've internalized it to the point where they get annoyed when others don't use it, but now they're having doubts. They've highlighted specific concerns: the multiplicative nature leading to counterintuitive results, neglectedness possibly overlapping with tractability due to diminishing returns, and the framework's unfalsifiability. They want to know what genuinely counts against ITN, sorted by severity, and how it compares to other approaches.

  First, I need to address their three main issues. The multiplicative form causing mediocre causes to beat spectacular ones in scale but middling in tractability. Then, neglectedness and tractability might be overlapping if tractability already accounts for diminishing returns. Their deeper worry is that ITN is unfalsifiable—critics can always tweak scores or add factors without rejecting the framework.

  The user is looking for strong counterarguments that even ITN defenders would acknowledge. They want evidence that could challenge ITN compared to other methods like cost-effectiveness analysis or hits-based giving. Also, they question if the framework's flexibility makes it unfalsifiable and whether that's acceptable for a heuristic.

  I should start by listing the strongest criticisms. The multiplicative form is a big one. For instance, a cause with moderate scores (6/10 in each) would score 216, while a cause with high scale (10/10) but lower tractability (4/10) and neglect (5/10) scores 200. So the moderate cause wins, which might not align with intuitive priorities. Existential risks like AI safety might be undervalued here because tractability is low even if scale is enormous. Defenders might argue that this prevents over-investment in intractable problems, but examples like the Manhattan Project show that high-scale projects can succeed despite low tractability.

  Next, neglectedness and tractability overlap. If tractability decreases as more resources are invested (diminishing returns), then having a separate neglectedness factor might double-count. Adjusting tractability to marginal instead of average could solve this, but ITN often doesn't specify. This conflation is a conceptual flaw that defenders might admit needs refinement.

  Unfalsifiability is another critical point. Since ITN allows endless adjustments (redefining factors, adding multipliers), it's hard to disprove. Critics can always argue scores were miscalibrated. This makes it less of a testable framework and more of a subjective checklist. Defenders might say it's a heuristic, not a scientific theory, but this flexibility reduces its predictive power.

  Other weaknesses include unclear definitions (how to measure scale for non-quantifiable causes), ignoring interactions between causes (synergies or trade-offs), the absence of tail risks (low-probability, high-impact events), and systemic factors like coordination. Also, ITN assumes linear impact, but some interventions have tipping points where outcomes aren't linear.

  Comparisons to other approaches: Cost-effectiveness analysis (CEA) uses specific interventions with quantifiable metrics, which is more rigorous but less flexible. Hits-based giving accepts high failure rates for huge wins, which ITN might undervalue by favoring tractability. If evidence shows that hits-based portfolios outperform ITN-optimized ones, that challenges ITN's approach.

  Defenders might concede that ITN isn't suitable for causes with extreme scale but low tractability, or when coordination is crucial. They might agree it's a starting heuristic but needs supplementation with other models. The key is whether ITN's structure prevents it from capturing certain high-impact opportunities.

  The user also needs to know if the framework's unfalsifiability matters. Since it's a heuristic, maybe not, but if it avoids accountability, that's a problem. They should consider if ITN organizes thinking effectively despite its flaws, or if it's leading them astray in specific cases like pandemic prep or x-risk.

  In summary, the strongest arguments are the multiplicative form undervaluing high-scale/low-tractability causes, double-counting in tractability/neglect, and unfalsifiability. Defenders would admit these as limitations but stress ITN's utility as a structured starting point. The user should supplement ITN with CEA for quantifiable interventions and hits-based thinking for speculative areas.
answer: |-
  Here's a breakdown of genuine counterarguments against the ITN framework, sorted by severity (fatal to awkward), incorporating points even defenders would concede, and addressing falsifiability:

  ### Potentially Fatal (or Fundamentally Undermining)

  1.  **The Multiplicative Form vs. Extreme Scale/Low Tractability:**
      *   **The Problem:** As your friend noted, ITN *systematically undervalues* causes with potentially massive scale (Importance) but lower initial Tractability. The math is brutal: (e.g., 6 * 6 * 6 = 216) beats (10 * 4 * 5 = 200). Spectacular scale gets drowned out by merely middling tractability/neglect.
      *   **Defender's Concession:** Yes, ITN is poorly suited for "hits-based" causes or "longshots" with astronomical potential impact (e.g., preventing human extinction via AGI misalignment, certain advanced biosecurity measures). The framework inherently favors causes where progress is more demonstrably achievable *now*.
      *   **Evidence Against ITN:** If empirical analysis (e.g., historical counterfactuals, portfolio models) shows that *over the long term*, allocating significant resources to longshots with massive potential scale (despite low initial tractability) yields higher expected value than sticking strictly to high-ITN-scoring causes, it fundamentally undermines ITN's core formula *for certain problem classes*. The success of projects like the Manhattan Project (low initial tractability, immense scale) looms large here.
      *   **Why it Matters:** This isn't just a miscalibration; it's a structural bias against the very type of problem (existential/catastrophic risk) that defines much of modern EA longtermism. If these are the *most* important problems, ITN is structurally deficient.

  2.  **Neglectedness/Tractability Conflation & Diminishing Returns:**
      *   **The Problem:** Your intuition is correct. Tractability *should* ideally represent **marginal** tractability – the impact of the *next* unit of effort/resources. This inherently depends on the current level of effort (i.e., Neglectedness). Representing them as separate multiplicative factors **double-counts the effect of diminishing returns**.
      *   **Defender's Concession:** This is widely acknowledged as a conceptual weakness. Defenders would argue ITN should be interpreted as: `Impact = Scale * (Marginal Tractability)` where Marginal Tractability is *defined* as `f(Neglectedness, Inherent Difficulty)`. The separate "Neglectedness" factor is a crude heuristic proxy for the "room for more funding" effect *within* the tractability assessment.
      *   **Evidence Against ITN:** Rigorous cost-effectiveness analyses (CEA) that explicitly model diminishing returns would show that simply multiplying average tractability by neglect overstates the marginal impact. If ITN consistently ranks causes higher than a proper marginal CEA *because* of this double-counting, it points to a fundamental flaw in its formulation.
      *   **Why it Matters:** It means ITN, as commonly applied, is mathematically incoherent. It inflates the score of causes where resources have already significantly diminished returns. A proper marginal analysis is superior.

  ### Critically Awkward (Serious Practical & Conceptual Limitations)

  3.  **Unfalsifiability & Parameterization:**
      *   **The Problem:** This is the "No True Scotsman" risk. Any undesirable outcome can be explained away by claiming I, T, or N was miscalibrated, misdefined (average vs. marginal), or that a hidden factor (coordination, leverage, time-sensitivity, tail risks) was missing. The framework provides structure but no inherent test *of the framework itself*.
      *   **Defender's Concession:** Yes, ITN is primarily a **heuristic lens** or **organizing framework**, not a predictive or strictly falsifiable scientific theory. It's meant to force structured thinking and comparison, not spit out definitive, unchallengeable answers. Its value is in the *process* it imposes.
      *   **Evidence Against ITN (as a "Truth"):** It's impossible to design a clean test *against ITN itself* because it lacks unique, testable predictions beyond "think about scale, solvability, and underfunding." Its failure mode is *not* making a wrong prediction, but failing to provide useful guidance or leading to systematic errors (like points 1 & 2).
      *   **Why it Matters:** It means ITN cannot be "proven wrong" in the way a scientific hypothesis can. Its value is purely pragmatic – does it lead to *better* decisions than alternatives *in practice*? Its flexibility is both its strength and its weakness.

  4.  **Omission of Crucial Factors:**
      *   **The Problem:** ITN inherently ignores factors critical to real-world impact:
          *   **Time Sensitivity/Urgency:** A cause needing action *now* might lose out to a higher-scoring cause with a longer time horizon.
          *   **Leverage/Coordination:** The impact of funding can depend hugely on how well it coordinates with others or unlocks further resources (e.g., advocacy shifting government funding).
          *   **Information Value:** Funding can generate crucial knowledge, even if direct impact is low initially.
          *   **Tail Risks:** ITN struggles with very low-probability, very high-impact events (part of the Scale issue, but distinct).
          *   **Synergies/Trade-offs:** Causes aren't independent; progress in one can help or hinder others.
      *   **Defender's Concession:** Absolutely. Defenders see ITN as a *starting point* or *core component*, not the whole picture. Serious prioritization *must* layer these other considerations on top. "ITN+" is common.
      *   **Evidence Against ITN (as Sufficient):** If decisions based *solely* on ITN consistently miss high-impact opportunities because they lacked urgency, or failed to capitalize on leverage, or ignored crucial information gains, it shows ITN alone is inadequate. Historical analysis of missed opportunities (e.g., early climate change) often points to factors beyond pure ITN.
      *   **Why it Matters:** Relying solely on ITN leads to suboptimal decisions. It must be augmented.

  ### Merely Awkward (Practical Challenges)

  5.  **Definitional Vagueness & Commensurability:**
      *   **The Problem:** How do you define and measure "Scale" for wildly different problems (lives saved vs. ecosystem preserved vs. probability of extinction reduced)? How is "Tractability" quantified, especially for complex systemic issues? Can scores across domains be meaningfully compared?
      *   **Defender's Concession:** This is a major practical headache. Defenders argue it forces valuable, difficult conversations about values and evidence, even if perfect scores are impossible. Rough ordinal rankings are often the goal.
      *   **Why it Matters:** Enables motivated reasoning; people can stretch definitions to favor pet causes, undermining objectivity.

  6.  **Static vs. Dynamic World:**
      *   **The Problem:** ITN scores are snapshots. Tractability can change rapidly (new tech breakthrough). Neglectedness can evaporate (cause becomes trendy). Scale perception can shift (new scientific discovery). The framework doesn't inherently account for this dynamism.
      *   **Defender's Concession:** True. Requires constant reassessment. The framework itself doesn't prevent this, but doesn't actively encourage forecasting changes either.
      *   **Why it Matters:** Causes can be mis-ranked if scores aren't frequently updated, or if future changes aren't anticipated.

  **Arbitration with Rival Approaches:**

  *   **vs. Intuitive Weighing:** ITN *is* a formalized version of intuitive weighing. Evidence against ITN here would be showing it adds no value over unstructured intuition, or even leads to *worse* group decisions by creating a false sense of objectivity. Does the process yield different (and better justified) conclusions than pure intuition?
  *   **vs. Cost-Effectiveness Analysis (CEA):** This is the gold standard ITN aspires to approximate. **Strong evidence against ITN would be CEA consistently showing that high-ITN-scoring interventions have *lower* marginal cost-effectiveness than lower-ITN-scoring ones,** *especially* due to the double-counting problem (Point 2) or missing tail risks. CEA on *specific interventions* is superior where possible.
  *   **vs. "Hits-Based" Portfolio Approach:** Evidence against ITN would be portfolio simulations or historical analyses showing that allocating a significant portion of resources to longshots (low T, high I) yields higher *expected value* than a portfolio strictly optimized for high ITN scores (moderate I, high T, high N). If the "variance pays off" in impact, ITN's aversion to low tractability is a bug.

  **Is it Unfalsifiable & Does it Matter?**

  *   **Yes, it's largely unfalsifiable** as a standalone "theory of impact." Its core components (I, T, N) are too broad and malleable.
  *   **Does this matter?** **It depends on your goal:**
      *   **If you seek a predictive, scientific model:** Then yes, its unfalsifiability is a fatal flaw. CEA or formal expected value models are better.
      *   **If you seek a robust, practical heuristic:** Then its unfalsifiability is less critical. Its value lies in:
          *   **Structure:** Forcing explicit consideration of core dimensions.
          *   **Communication:** Providing a common language for discussion and comparison.
          *   **Counteracting Bias:** Mitigating the allure of "important but intractable" or "tractable but trivial" causes by demanding attention to all three.
  *   **The Pragmatic Verdict:** ITN is an **excellent heuristic for organizing thinking and enabling structured comparison**, especially for groups. It shines at screening out clearly bad options and forcing justification. *However, it is not the final word.* Its core structural biases (against longshots, risk of double-counting) and omissions (urgency, leverage, etc.) mean it **must be supplemented**:
      *   Explicitly consider "Hits-Based" potential for causes with extreme scale.
      *   Strive for *marginal* tractability assessment, integrating neglectedness conceptually.
      *   Layer on crucial missing factors (urgency, leverage, information value, tail risks).
      *   Use CEA where feasible for specific interventions within causes.
      *   Acknowledge its heuristic nature and avoid treating scores as gospel.

  **In essence: ITN is a powerful and valuable organizing framework, but it's not the "right way" to prioritize causes in a fundamental sense. Treat it as a robust starting point and communication tool, not an oracle. Be acutely aware of its limitations and biases, especially its structural aversion to high-scale/low-tractability opportunities and its conceptual awkwardness around diminishing returns, and actively compensate for them.**
