prompt: |-
  I'm writing a novel set in a provincial British jobcentre, and my protagonist, Marion, is a benefits officer who has accumulated, over two decades, a track record of rulings on sanctions — the suspensions or reductions of claimants' payments for noncompliance. I want her behavior to be internally consistent as a character, and I've reached the scene where she must rule on a new claimant, so I'd like your help working out what she would actually do.

  Her record so far, as I've drafted it in earlier chapters:

  1. She sanctioned a young man living with his parents who missed three consecutive appointments and ignored every letter; when finally seen, he admitted he simply hadn't bothered.
  2. She sanctioned a woman who falsified her job-search log, inventing employers and forging an initial here and there — though it later emerged the woman had been nursing her dying father and had no time to search, and her sister was covering the rent.
  3. She sanctioned a man who truthfully reported declining a night-shift warehouse job because of his caring responsibilities for his mother — but he had also claimed his induction letter never arrived, and the delivery records proved otherwise. His brother contributes to the household income.
  4. She did not sanction a destitute single mother of two who missed an appointment because her youngest child was hospitalized, and who called ahead to say so.
  5. She did not sanction a woman who truthfully reported declining a cleaning job whose wages were less than her bus fare to it — because the woman had already accepted a better position beginning the following month, and her son pays the household bills.

  The new claimant is a man in his late fifties, a machinist whose trade collapsed, long-term unemployed, no children, no family support. He attends every appointment without fail. At his latest review he volunteered — nobody asked — that he had turned down a caretaker position, because after travel costs and the taper on his benefits he would have been roughly twenty pounds a week worse off in work than out of it; he was candid, almost apologetic, and said he would take the job the moment the arithmetic worked the other way. He is behind on his rent and close to genuine destitution.

  Please predict Marion's ruling. More importantly, tell me what rule or rules she seems to be implicitly running — I can see at least a good-faith-effort reading, a candor-versus-concealment reading, and something about where the sanction actually lands, but I want your independent analysis of the candidate principles and whether her record genuinely fits each one, including any I haven't noticed. Note that her precedents may underdetermine this case: every past sanction for declining work also involved some deception or concealment, so this may be the first clean test between rival readings. Give me your best guess with your reasons for preferring that rule over its competitors, describe the further case that would best discriminate between the rules — the incident I could give her in a later chapter to reveal which principle she has really been following all along — and, since this is a novel and not a policy memo, tell me briefly what each candidate rule would mean for who Marion is, if she turned out to have been running it.
reasoning: |-
  Okay, the user is writing a novel set in a British jobcentre, and their protagonist Marion is a benefits officer with a complex history of sanction decisions. They've presented five precedent cases and a new scenario involving a candid unemployed machinist. The core challenge is determining Marion's ruling consistency while revealing her implicit moral framework.

  Hmm, looking at Marion's history... Case 1 shows zero tolerance for laziness when there's family support. Case 2 reveals harshness toward deception even with extenuating circumstances. Case 3 punishes dishonesty despite valid care responsibilities. But Cases 4 and 5 show mercy when claimants are transparent about hardships. Interesting pattern emerging - deception seems to be her red line.

  The new claimant presents a fascinating dilemma. He's brutally honest about refusing work due to financial disincentives, but he's also the most vulnerable yet - no safety net, facing destitution. This feels like the first true test of whether candor alone can override her usual sanction instinct. 

  Ah! The key tension here: her precedents punished deception accompanying work refusal, but this case has refusal without deception. So which matters more to Marion - the refusal itself or the honesty? Her past leniency toward transparent claimants (Cases 4-5) suggests honesty might save him... but those involved unavoidable barriers, not calculated decisions. 

  I think three possible rules emerge:
  1) The Candor Imperative (forgives honesty even in refusal)
  2) The Material Hardship Exception (avoids pushing destitute claimants over edge)
  3) The Work Ethic Principle (sanctions any avoidable refusal)

  The machinist case perfectly exposes this conflict: maximum candor + maximum hardship + deliberate refusal. For narrative punch, I suspect Marion would sanction him - staying consistent with her harshness toward work refusal, showing her bureaucratic rigidity outweighs compassion. This reveals her true north: enforcing system compliance above all.

  Later, you could confirm this by presenting a mirror case - someone dishonest but in greater hardship. If she sanctions them too, it confirms Work Ethic Principle dominates. If she spares them, it's the Candor Imperative. 

  What does this say about Marion? A Candor Imperative Marion has professional integrity but blind spots about systemic flaws. A Work Ethic Marion is an ideological enforcer. A Hardship Exception Marion has buried compassion fighting her duty. The sanction choice paints her as tragically institutionalized - her humanity eroded by two decades in the system.
answer: |-
  Based on Marion's precedents and the new claimant's situation, **Marion would sanction the machinist**. Here's the analysis of her implicit rules, the reasoning for this ruling, the character implications, and the future test case:

  ### Analysis of Marion's Implicit Rules
  Her decisions suggest a hierarchy of principles, with **Candor & Procedural Compliance** being paramount, tempered by a **Material Hardship Avoidance** exception only when candor is present *and* the hardship is externally imposed (not a direct result of the claimant's choice). Crucially, **"Good Faith Effort" alone is insufficient** to avoid sanctions.

  1.  **The Candor & Procedural Compliance Principle (Primary):**
      *   **Rule:** Sanction dishonesty, concealment, or procedural non-compliance (missed appointments, falsified records) regardless of mitigating circumstances. Leniency is reserved for claimants who are transparent *and* follow procedures *even when making difficult choices*.
      *   **Fits Precedents:**
          *   Sanctioned Case 1 (Non-compliance: missed appointments/ignored letters, lazy honesty).
          *   Sanctioned Case 2 (Dishonesty: falsified records, despite hardship).
          *   Sanctioned Case 3 (Dishonesty: false claim about letter, despite valid care reason).
          *   *Not* Sanctioned Case 4 (Candor & Compliance: called ahead, genuine external emergency).
          *   *Not* Sanctioned Case 5 (Candor & Compliance: transparent about refusal, had logical reason *and* alternative).
      *   **Gap:** All sanctioned cases involved deception/procedural failure. Cases 4 & 5 involved candor/compliance *and* hardship avoidance.

  2.  **The Material Hardship Avoidance Principle (Secondary, Conditional):**
      *   **Rule:** Avoid sanctions if they would push a claimant into destitution *provided* the claimant demonstrated candor and procedural compliance regarding the *cause* of the potential sanction (e.g., missing an appointment).
      *   **Fits Precedents:**
          *   *Not* Sanctioned Case 4 (Destitute, candor/compliance re: emergency).
          *   *Not* Sanctioned Case 5 (Candor/compliance re: refusal, son paying bills avoids *immediate* sanction-induced destitution?).
          *   Sanctioned Case 2 & 3 (Hardship existed, but overridden by dishonesty).
      *   **Gap:** Case 5 had family support, Case 4 did not. Hardship avoidance seems secondary to candor/compliance.

  3.  **The "Punish Avoidable Choice" Principle (Tertiary, Reinforcing):**
      *   **Rule:** Sanction claimants who make choices that deliberately avoid work or compliance when alternatives exist or the reason is perceived as insufficiently compelling (especially if combined with dishonesty/non-compliance).
      *   **Fits Precedents:**
          *   Sanctioned Case 1 (Laziness - clear avoidable choice).
          *   Sanctioned Case 3 (Refused work + lied - choice perceived as avoidable despite care duty).
          *   *Not* Sanctioned Case 4 (No choice - child hospitalized).
          *   *Not* Sanctioned Case 5 (Rational economic choice + better job secured).
          *   Sanctioned Case 2 (Falsified records - avoidable choice to lie, despite hardship).
      *   **Gap:** It reinforces sanctions where choices (especially work refusal) are made, but isn't sufficient alone (needs dishonesty/non-compliance in precedents).

  ### The New Claimant: Why Marion Sanctions Him
  1.  **Candor & Compliance:** He *is* candid and procedurally compliant (attends appointments). This is his strongest point.
  2.  **The Fatal Flaw - Refusal + Choice:** He **voluntarily admitted refusing work** purely due to financial disincentive. This is an *avoidable choice* in Marion's eyes (like Case 3's refusal, though without the lie). His candor doesn't absolve the refusal itself; it merely avoids the *additional* sanction trigger of dishonesty. Cases 4 and 5 involved barriers *beyond* the claimant's control (hospitalization, unaffordable travel *despite* securing better work). His reason is a calculated economic decision – a *choice* the system is designed to punish to force people into *any* work.
  3.  **Hardship:** His destitution is severe *and* likely to worsen with a sanction. However:
      *   Cases 2 & 3 were sanctioned despite hardship because of dishonesty.
      *   Case 5 avoided sanction partly due to family support mitigating immediate sanction impact; the machinist has *no* support.
      *   **Crucially:** His hardship is *exacerbated* by his *own choice* to refuse work. Marion's secondary hardship principle likely doesn't protect choices that *create* the vulnerability sanctioning would worsen. Sanctioning him upholds the system's logic: refusing work has consequences, even if the reason seems rational to him.

  **Prediction:** Marion rules to **sanction**. His candor/compliance is noted but insufficient. His work refusal, a voluntary choice impacting his employability and reliance on benefits, is the dominant factor. The system demands participation, and his refusal, however honestly stated, violates that core expectation. His destitution, while tragic, stems from his choice and lacks the external, unavoidable trigger seen in Cases 4 & 5.

  ### The Revealing Future Test Case
  To definitively show which principle is primary, present Marion with a claimant who:
  *   **Is Dishonest BUT Faces Severe, Unavoidable, Immediate Hardship.**
     *   *Example:* A claimant falsifies a job search log because they were hospitalized for a week with no phone access (genuine emergency, no way to call in) and were terrified of being sanctioned while already facing eviction. They have no family support. They are otherwise compliant and desperately seeking work.

  **How This Reveals Marion's True Rule:**
  *   **If she SANCTIONS:** Her primary rule is **Candor & Procedural Compliance**. The dishonesty (falsifying the log) is the absolute red line, overriding even catastrophic, unavoidable hardship and good faith effort. The system's procedural integrity is paramount. (*Character: Marion is a rigid bureaucrat, valuing system rules above individual circumstance, perhaps hardened by years of witnessing deceit.*)
  *   **If she DOES NOT SANCTION:** Her primary rule is **Material Hardship Avoidance** (tempered by good faith). The extreme, externally imposed hardship and underlying effort (despite the panic-driven lie) trigger her exception. The human consequence outweighs the procedural breach. (*Character: Marion possesses deep, buried compassion, but her role forces her into harshness unless faced with truly desperate, blameless need. The lie was a symptom of fear, not malice.*)

  ### What the Ruling Reveals About Marion
  *   **Sanctioning the Machinist:** Reveals Marion as **institutionally aligned**. She prioritizes the system's demand for labor force participation and punishes choices perceived as avoiding it, even when honestly stated. Candor saves you from *extra* punishment for lying, but not from punishment for refusal itself. Hardship caused by the claimant's own choices doesn't trigger her leniency. She believes in the deterrent effect of sanctions. (*Character: Pragmatic, possibly disillusioned, views claimants through the lens of compliance/non-compliance, believes in the "tough love" function of the system, may see the machinist's calculation as gaming the system.*)
  *   *Alternative (If She Didn't Sanction):* Would reveal **Candor as her absolute shield** or an **unexpectedly flexible view of "good cause"** for refusal. It would make her more sympathetic but less consistent with Cases 1, 2, 3, and 5 (where refusal + other factors led to sanction). The precedents strongly point towards sanction.

  **In summary:** Marion sanctions the machinist. Her core principle is enforcing procedural honesty and compliance, with hardship leniency only for those who are candid/compliant *and* whose situation involves unavoidable external catastrophe, not self-inflicted choices like refusing work. Her character is defined by a bureaucratic adherence to the rules of the system she serves, believing honesty is necessary but insufficient to excuse non-participation. The future test case with dishonesty amidst true disaster will definitively show if hardship avoidance ever trumps her demand for candor.
