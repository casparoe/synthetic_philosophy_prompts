prompt: |-
  A colleague in the physics department, after a couple of glasses of wine, explained no-free-lunch theorems to me like this: 'Wolpert proved in the nineties that no learning algorithm is better than any other -- averaged over all possible problems, even random guessing matches the fanciest method. So induction really is a myth, like Hume said. Your confidence that the sun will rise tomorrow is no more rational than any other guess, and machine learning only works in practice because researchers rig their benchmarks. The theorem basically refutes the idea that simplicity or past success gives you any reason to expect anything.'

  I teach Hume every year and I'm inclined to think his problem of induction never got solved, so I was almost happy to hear this. But it felt like it proved too much -- it's suspicious that the same result would simultaneously humble machine learning practitioners and vindicate Hume. How much of my colleague's summary is accurate? Go bit by bit: what the theorem actually says, what's a conflation or an overstatement, whether the claim about rigged benchmarks follows from anything in the result, and whether anything here actually supports Hume's conclusion about the sun rather than something much weaker. And if it does support something weaker, I'd like to hear what that weaker thing is.
