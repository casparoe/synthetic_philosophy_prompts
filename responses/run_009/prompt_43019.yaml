prompt: |-
  I sit on the grants committee of a donor network in which roughly thirty members pool their money and allocate it to charities by majority vote. Over the past two years the membership has split into two nearly equal blocs: one prioritizes long-termist projects (biosecurity, AI safety), the other near-term animal welfare. Neither bloc can muster a majority alone, and our meetings have decayed into mutual obstruction — each bloc votes down the other's proposals, we disburse less every cycle, and members are quietly drifting away.

  Two members have now proposed adopting a formal "moral trade" protocol — an idea I first encountered on rationalist forums, where it is usually credited to Nick Bostrom. Under the proposal, each bloc commits in advance to voting for the other's top-ranked proposals up to a fixed share of the annual budget, in exchange for reciprocal support. The appeal is supposed to be that each bloc can expect, by its own lights, more of what it values from the traded package than from the status quo of mutual blocking — with no shared moral metric required, since each side evaluates the deal entirely by its own axiology.

  Our chair has solicited written opinions ahead of next month's meeting, and I would like to submit one. Please draft a decision memo recommending whether the network should adopt the protocol, either in some defensible modified form or not at all. It should (a) give a clear, actionable recommendation with concrete terms — for instance, what share of the annual budget each bloc's guaranteed support would be capped at, and for what commitment horizon; (b) engage honestly with the strongest objection on the losing side, voiced by one of our members, that trading votes on moral convictions is a kind of corruption, akin to congressional logrolling, in which principles are treated as bargaining chips; and (c) address the boundary case that worries me most: whether the same logic would license trading with a bloc whose commitments we consider abhorrent, and if not, say precisely what distinguishes our situation from that one.
reasoning: |-
  Okay, let me unpack this complex grants committee dilemma. The user describes a deadlocked donor network where two value-aligned blocs block each other's proposals, leading to reduced impact and member attrition. The moral trade protocol proposal seems like a rational solution, but I need to carefully evaluate its ethical and practical dimensions.

  Hmm, the core tension here is between pragmatic effectiveness and moral purity. The animal welfare and long-termist blocs are both acting rationally within their frameworks by vetoing each other, but the collective outcome is clearly suboptimal. The moral trade concept is fascinating because it sidesteps the need for value alignment - each bloc judges the trade solely by their own metrics. 

  I should consider how to structure the recommendation. The 30% cap seems prudent - high enough to be meaningful but low enough to prevent either bloc from feeling their core mission is compromised. A two-year trial period makes sense too, with a sunset clause to force reevaluation. 

  The corruption objection is serious and needs thoughtful engagement. Logrolling comparisons aren't entirely wrong, but there's a crucial difference: in congressional deals, politicians often trade against constituents' interests for personal gain. Here, both blocs are acting to advance their causes more effectively. It's not abandoning principles but finding a smarter way to serve them.

  The slippery slope concern about trading with abhorrent groups is particularly thorny. The key distinctions seem to be: (1) mutual recognition of each other as morally serious, (2) shared commitment to evidence-based philanthropy, and (3) the scale of moral disagreement being within tolerable bounds. This wouldn't apply to, say, a bloc advocating harmful activities.

  I notice the user emphasized wanting concrete terms in the recommendation. The memo should specify exact percentages and timeframes rather than vague suggestions. Also important to emphasize the oversight mechanisms - the tracking spreadsheet and annual review help maintain accountability.

  The user's underlying worry seems to be about preserving integrity while being effective. The memo should acknowledge that this feels uncomfortable but argue that responsible stewardship sometimes requires pragmatic cooperation between morally serious actors who disagree.
answer: |-
  ## Memorandum: Recommendation on Moral Trade Protocol for Donor Network

  **To:** Grants Committee Chair  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Adopting a Modified Moral Trade Protocol  

  ### I. Recommendation
  **Adopt a modified Moral Trade Protocol for a two-year trial period, with the following concrete terms:**  
  1.  **Budget Allocation:** Each bloc receives guaranteed support for **25% of the annual disbursable budget** dedicated to their respective priority areas (Long-Termism or Near-Term Animal Welfare).  
  2.  **Proposal Selection:** Each bloc internally ranks its proposals. The opposing bloc commits to voting "Yes" on the *top-ranked proposals* from the other bloc *up to the 25% budget cap*, regardless of their own evaluation of the specific project's merit.  
  3.  **Commitment Horizon:** **Two years**, with a mandatory review after 18 months to assess impact, member satisfaction, and bloc cohesion before renewal.  
  4.  **Oversight:** Establish a simple tracking spreadsheet to ensure traded votes are applied only to pre-agreed, top-ranked proposals meeting the budget cap.  

  **Rationale:** This structure provides significant guaranteed funding (25%) for each bloc's core mission, overcoming the current mutual obstruction. It incentivizes blocs to propose their *most effective* projects within their domain (knowing the other side must support them) and creates space for potential collaboration on the remaining 50% of the budget. The trial period allows evaluation without permanent commitment.

  ---

  ### II. Engaging the Strongest Objection: "Corruption and Logrolling"
  **The Objection:** Trading votes on moral convictions treats principles as bargaining chips, akin to congressional logrolling, and constitutes a form of corruption that degrades the integrity of our philanthropic mission.

  **Response:**  
  This concern is valid and reflects a principled stance. However, there are crucial distinctions between problematic logrolling and the proposed Moral Trade Protocol:

  1.  **Shared Goal of Impact:** Unlike political logrolling where deals often serve personal or parochial interests against the public good, *both blocs here share the ultimate, abstract goal of "doing good."* They fundamentally disagree on *how* to achieve it. The protocol isn't abandoning principle; it's acknowledging the impasse and seeking a *more effective way for each bloc to advance its own principles* within a shared resource pool.
  2.  **Transparency & Bounded Scope:** Unlike backroom deals, this protocol is transparent, rule-based, and strictly bounded (25% cap). Blocs aren't trading support for *random* or *mutually disliked* projects (common in logrolling), but for the *top priorities* identified by the other bloc within their domain of expertise and passion. The "trade" is explicit, limited, and focused on maximizing each side's core impact.
  3.  **Responsible Stewardship:** The status quo is arguably *more* corrupting. Mutual obstruction wastes pooled resources, diminishes overall impact, and risks the network's collapse – failing the duty of stewardship to the funds entrusted by members. The protocol is a responsible mechanism to ensure significant resources *actually flow* to causes members deeply value.
  4.  **Not Compromise, but Cooperation:** This isn't asking either bloc to dilute their values or support projects they find actively harmful *within the other bloc's domain*. It's agreeing: "We disagree fundamentally on priorities, but we *both* believe the other side's top projects *within their own value framework* are worthwhile. Let's ensure those get funded while freeing up the rest for debate."

  **Conclusion on Objection:** While the analogy to logrolling is understandable, the context of shared (but divergent) moral aims, transparency, bounded scope, and the imperative to achieve *any* significant positive impact distinguishes this protocol from corrupt bargaining. It treats principles seriously by finding a practical way to advance them more effectively than the current stalemate allows.

  ---

  ### III. Addressing the Boundary Case: Trading with Abhorrent Views
  **The Concern:** Does this logic justify trading with a bloc holding views we find morally abhorrent (e.g., promoting harm, discrimination)?

  **Response:** **No, the same logic does not automatically apply.** Key distinctions make our current situation fundamentally different and justify the protocol here while prohibiting it with genuinely abhorrent blocs:

  1.  **Nature of the "Good":** Both current blocs operate within broadly accepted philanthropic frameworks aimed at *reducing suffering or improving well-being* (animal welfare, human survival/well-being). They disagree on scope, timeframe, and moral patients, but *not* on the fundamental goal of promoting good. An abhorrent bloc (e.g., one actively promoting harm or rights violations) operates outside this shared foundation. Trading with them would imply endorsement and actively enable harm, violating the core "do no harm" principle inherent in philanthropy.
  2.  **Magnitude of Disagreement:** The disagreement between long-termists and animal welfare advocates is profound, but it's a disagreement *within* consequentialist ethics about prioritization and moral weighting. Abhorrent views often involve rejecting fundamental ethical norms (e.g., equality, non-violence, basic rights) altogether. The gulf is not just wide; it's foundational.
  3.  **Impact of Support:** Supporting a top-ranked animal welfare or AI safety project, even if not your priority, does not directly cause harm you find abhorrent – it simply funds a project aimed at good through a different lens. Supporting the top project of an abhorrent bloc (e.g., promoting discrimination) would directly fund activities actively causing harm you deem intolerable.
  4.  **Network Integrity & Reputation:** Trading within the current divergence, while tense, does not inherently damage the network's core ethical standing. Trading with genuinely abhorrent views would destroy the network's credibility, drive away members, and violate its fundamental purpose.

  **Distinguishing Principle:** The Moral Trade Protocol is ethically permissible only when:
      *   Both blocs share a foundational commitment to *some form of improving welfare or reducing suffering* (even if defined very differently).
      *   Supporting the other bloc's top projects *does not directly enable activities the supporting bloc considers inherently harmful or rights-violating*.
      *   The trade operates within the bounds of the network's core mission and ethical guardrails.

  Our current long-termist vs. animal welfare split meets these criteria. A bloc advocating for abhorrent harm does not.

  ---

  ### IV. Implementation & Risks
  *   **Bloc Definition:** Clearly define membership of each bloc for the protocol's purpose (e.g., formal self-identification at the trial's start).
  *   **Top-Ranked Process:** Each bloc must transparently submit its ranked list before voting begins.
  *   **Remaining 50%:** This portion remains subject to normal debate and voting. The protocol may foster better collaboration here, but guarantees end at the 25% cap.
  *   **Risk:** Blocs *might* strategically lower the quality of their "top" proposals knowing they get guaranteed support. Mitigation: Internal bloc reputation and the desire to maximize impact within their domain should counter this. The review process will monitor proposal quality.
  *   **Risk:** Perceived inequity if one bloc's projects are cheaper/more expensive. Mitigation: The cap is on *budget*, not number of projects. Each bloc maximizes the impact within *their* 25% allocation.

  ### V. Conclusion
  The current deadlock is unsustainable, reducing impact and threatening the network's existence. The proposed Moral Trade Protocol offers a principled, practical, and bounded solution to overcome mutual obstruction. While the "corruption" objection highlights a valid concern about integrity, the protocol's transparency, shared foundational goals, and focus on maximizing each bloc's core impact distinguish it from problematic logrolling and make it an ethical imperative for responsible stewardship. The boundary case of abhorrent views is clearly excluded by the foundational requirement that both sides aim for some form of good and avoid direct harm.

  **I strongly recommend adopting the protocol with the specified terms (25% per bloc, 2-year trial) as the best path forward to restore impact, member engagement, and the network's viability.**
