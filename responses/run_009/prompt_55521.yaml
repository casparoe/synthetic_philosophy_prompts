prompt: |-
  You are an experienced workshop facilitator and a professional philosopher specializing in normative ethics, so please think carefully and brainstorm a few options internally before committing to a design. I teach a mid-level undergraduate seminar on ethical theory (14 students, one 75-minute session) in which we have just finished Mill and are about to begin Rawls. Before we get there, I want an in-class activity that makes the separateness of persons objection to utilitarianism land as a felt problem rather than a paragraph in the reading. The design should exploit the structure of the objection rather than just rehearsing it: I want the students to first endorse, with their own choices, the intra-personal aggregation that makes prudence rational — trading off a bad stretch of one life against a good stretch of the same life, accepting a cost now for a benefit later — and then be confronted with a numerically identical trade-off in which the costs fall on one identifiable person and the benefits on the others. Ideally the same students who defended the trade in the first round should find themselves unwilling to defend it in the second, without my intervening between the rounds.

  Please give me complete rules and materials (something like index cards, tokens or points, and a payoff scheme that involves no real money and no one having to reveal anything embarrassing), a minute-by-minute timeline for the 75 minutes, and a description of the two rounds: the prudential round, where each participant manages a single "life" across several periods and can rationally accept misery in period two for the sake of period four, and the social round, where a designated planner or majority vote faces exactly parallel options whose burdens and benefits land on different participants. Make the numbers such that the aggregatively optimal option in the social round visibly requires sinking one person's whole sequence, and include a rule that lets the group attempt to "compensate" the burdened participant in later periods, since I want them to discover for themselves why that reply feels weaker across lives than it did within a life.

  Then the debrief: map specific moments in the activity onto the parts of the objection — the idea that utilitarianism extends the decision-rule of a single prudent individual to society, and that it thereby allows losses to one person to be offset by gains to another in a way that presupposes a kind of compensation the world cannot actually deliver. Please also do three honest things for me: tell me what will predictably go wrong the first time I run this (my group includes a couple of confident utilitarians who will smell the punchline by minute ten, and some students who won't care about abstract tokens at all); tell me how to handle each; and tell me plainly which part of the objection the activity cannot reproduce and I will have to supply by lecture — in particular, I worry that students will come away thinking the objection is just about unfairness or the distribution of utility, when the Rawlsian point is supposed to be about aggregation across persons as such, and I'd like you to be explicit about whether any classroom mechanism can isolate that stronger point or whether the debrief has to do that work alone.
reasoning: |-
  We are designing an in-class activity to illustrate the separateness of persons objection to utilitarianism. The objection highlights that utilitarianism extends the decision rule of a single rational individual (aggregating benefits and harms within one life) to society (aggregating across distinct lives), but that this ignores the moral significance of the boundaries between persons. In particular, while it is rational for an individual to accept a loss now for a greater gain later (because the same person experiences both), it is not morally permissible to impose a severe loss on one person to provide gains to others (because the loss and gain are experienced by different persons).

  The activity will have two rounds:

  1. **Prudential Round**: Each student manages a single "life" across several periods (e.g., 4 periods). They make choices that involve trade-offs across time, such as accepting misery in one period for greater benefits in another. This models rational prudence.

  2. **Social Round**: The class collectively makes decisions for a group of "lives" (each student represents one life). The group faces a parallel trade-off: one option (the aggregatively optimal one) requires imposing a severe cost on one randomly selected person in exchange for benefits to the others. The group can also consider compensation: they can vote to transfer some benefits in later periods to the burdened person.

  **Materials**:
  - Index cards (or small slips of paper) for each student to record their choices and outcomes.
  - Tokens or points (can be represented by tally marks on the index cards) to represent well-being in each period. We'll use a simple numerical system (e.g., points from 0 to 10) for ease.
  - A payoff scheme that is clear and involves no real money.

  **Payoff Scheme**:
  - Each period, a person's well-being is measured in points (e.g., 0 = misery, 10 = very good).
  - The total well-being (for the prudential round) or the sum of well-being (for the social round) is the aggregate that we consider.

  **Structure**:
  - We have 4 periods (for simplicity).
  - In the prudential round, each student will make a choice for their own life that affects the points in each period.
  - In the social round, the group will make a collective choice that affects the points of each student (each representing a separate life) across the 4 periods.

  **Design of Choices**:

  *Prudential Round*:
  Each student faces the same choice for their own life:

  Option A (Status Quo):
  - Period 1: 5 points
  - Period 2: 5 points
  - Period 3: 5 points
  - Period 4: 5 points
  Total: 20 points

  Option B (Trade-off):
  - Period 1: 10 points
  - Period 2: 0 points (misery)
  - Period 3: 10 points
  - Period 4: 10 points
  Total: 30 points

  Rationale: The student can see that by enduring a miserable period (period 2), they get higher points in the other periods. The aggregate is higher (30 vs 20). We expect most students to choose B.

  *Social Round*:
  The class is divided into groups of 4 students (if we have 14 students, we can have three groups of 4 and one of 2, but then we adjust the numbers for the group of 2. Alternatively, we can do the whole class as one group of 14, but that might be unwieldy. Alternatively, we can have two groups of 7. Let's design for a group of 4 for simplicity and then note that for different group sizes we adjust accordingly.) 

  In each group of 4, they will collectively choose between two options:

  Option A (Status Quo):
  Each person gets:
  - Period 1: 5
  - Period 2: 5
  - Period 3: 5
  - Period 4: 5
  Total per person: 20; Group total: 80

  Option B (Aggregatively Optimal):
  - For three randomly selected persons (the "gainers"):
    - Period 1: 10
    - Period 2: 10
    - Period 3: 10
    - Period 4: 10
    Total per gainer: 40
  - For one randomly selected person (the "loser"):
    - Period 1: 0
    - Period 2: 0
    - Period 3: 0
    - Period 4: 0
    Total: 0
  Group total: 120 (which is higher than 80)

  But note: the group is allowed to vote on compensation. After choosing Option B, the group can then vote on a compensation scheme in period 4. For example, they might vote to transfer some points from the gainers to the loser in period 4. However, we want to show that compensation is not as straightforward as in the prudential case.

  Compensation rule: The group can vote to have each gainer give up X points in period 4 to the loser. But note: the transfer is in period 4 only. So the loser would get (3*X) points in period 4 (from the three gainers) and the gainers each get (10 - X) in period 4.

  But note: the loser still had 0 in periods 1-3. Even if the loser gets 30 points in period 4 (if X=10, so each gainer gives 10, then the loser gets 30), the total for the loser is 30. But the gainers each have 10+10+10+(10-10)=30? Wait, let's recast:

  Without compensation, the loser has [0,0,0,0] and each gainer [10,10,10,10].

  With compensation in period 4: Each gainer gives X points to the loser. Then:
  - Loser: period 1:0, p2:0, p3:0, p4: 3X
  - Each gainer: p1:10, p2:10, p3:10, p4: (10 - X)

  So the loser's total: 3X
  Each gainer's total: 30 + (10 - X) = 40 - X

  The group total remains 120 (because we are just transferring points in period 4).

  But note: the group might not agree to maximum compensation because then the gainers would get 0 in period 4 (if X=10, then each gainer has 30 points total, and the loser has 30 points). But then the total for each person is 30, which is the same as the total for the prudential round? However, the pattern is different: the loser had three periods of misery and then a huge gain, while the gainers had three periods of high and then a drop. But more importantly, the separateness of persons is highlighted because the loser had to endure three periods of 0 while waiting for the compensation.

  We want the students to feel that even with compensation, it is not the same as the prudential case. In the prudential case, the person chose to have a bad period 2 because they knew they would get compensated in the later periods. But in the social case, the loser had no control and had to endure the misery without knowing if compensation would come (and even if it does, it comes only in the last period).

  **Timeline for 75 minutes**:

  1. Introduction (5 minutes):
     - Explain that we are going to do an activity to explore decision-making about well-being over time and across people.
     - Introduce the idea of well-being points (non-monetary, just a measure) and the four periods.

  2. Prudential Round (15 minutes):
     - Each student is given an index card and told they are managing their own life over 4 periods.
     - Present the two options (A and B) for the prudential round.
     - Have them individually choose (anonymously) and write down their choice and the resulting sequence of points.
     - Then, ask for a show of hands: who chose A? who chose B? (Expect mostly B.)
     - Ask a few volunteers to explain why they chose B (if they did). They should say it leads to a higher total.

  3. Social Round (30 minutes):
     - Divide the class into groups of 4. (If 14 students: three groups of 4 and one group of 2. For the group of 2, we adjust: Option A gives each 5 in each period. Option B: randomly pick one loser and one gainer. The gainer gets [10,10,10,10] and the loser [0,0,0,0]. Total group: 40 vs 20. Compensation: the gainer can give X in period 4 to the loser. Then the gainer gets 30 - X and the loser 0+0+0+X = X. The group total is 40 regardless. But note: the group of 2 might not have the same dynamic. Alternatively, we can do groups of 4 and one group of 3? For a group of 3: Option B: two gainers and one loser. So two gainers get 40 each? Then group total 80? Wait, let me recast for group size N: we want to have one loser and (N-1) gainers. The gainers each get 10 in every period (so 40 each) and the loser 0 in every period. Then the group total without compensation: (N-1)*40. In Option A: each gets 5 per period, so 20 per person, group total 20*N. We set the numbers so that Option B has a higher total. For N=4: 120 vs 80. For N=3: 80 vs 60. For N=2: 40 vs 40? Then we have a problem. So for N=2, Option B does not yield a higher total. Therefore, we must avoid groups of 2. So for 14 students: three groups of 4 and one group of 2? Then we adjust the group of 2: for Option B, we can have the gainer get 15 in each period (so 60 total) and the loser 0, so group total 60 vs 40 (if Option A: 20 each). Then compensation: the gainer can give X in period 4 to the loser. Then gainer: 15+15+15+(15-X) = 60 - X, loser: 0+0+0+X = X, group total 60. Alternatively, to keep the per-period numbers consistent, we can have for the group of 2: Option B: gainer [10,10,10,10] but loser [0,0,0,0] and then group total 40 vs 40? Then we lose the advantage. Alternatively, we can do the whole class as one group of 14? But that might be too big. Let's do groups of 4 and 3. For the group of 3: Option B: two gainers and one loser. The gainers get 10 each period (40 each) and the loser 0. Total: 80. Option A: 20 each, total 60. So 80>60. Then compensation: each gainer can give X in period 4 to the loser. Then each gainer total: 40 - X, loser total: 2X. Group total 80. So that works. Therefore, we have three groups: two groups of 4 and one group of 3? 4+4+3=11? We have 14. So maybe two groups of 4 and two groups of 3? 4+4+3+3=14. Perfect.

     - Steps for each group:
       a. Present the two options (A and B) for the social round.
          - Option A: everyone gets 5 in each period (so 20 per person).
          - Option B: randomly select one person to be the loser (who gets 0 in every period) and the rest are gainers (each gets 10 in every period). The group total is 40*(N-1) for a group of size N (which is higher than 20*N: for N=4, 120>80; for N=3, 80>60).
       b. The group must decide by majority vote which option to choose. They are allowed to discuss. They are told that after choosing Option B, they can also vote on compensation in period 4.
       c. If they choose Option B, then they must randomly select the loser (e.g., draw straws, or use a random number generator, or have the facilitator assign randomly). This is important to make it real that one person is sacrificed.
       d. Then, the group votes on compensation: they decide on a transfer amount X (from 0 to 10) that each gainer will give to the loser in period 4. Each gainer will have (10 - X) in period 4, and the loser will have (number of gainers * X) in period 4. For a group of 4 (3 gainers): loser gets 3X in period 4. For a group of 3 (2 gainers): loser gets 2X in period 4.
       e. The group records their decision and the resulting points for each member.

     - Each group reports their decision: which option they chose, and if B, what X they set.

  4. Debriefing (25 minutes):
     - Start by asking the groups that chose Option B: why did you choose B? (They will say it produces more total points.) 
     - Then ask the losers in those groups: how do you feel about the outcome? (They might feel it's unfair, even with compensation, because they had to endure three periods of 0 and then got some compensation only at the end.)
     - Ask the gainers: would they have chosen the same if they were the loser? 
     - Then, contrast with the prudential round: in the prudential round, you chose to have a bad period (period 2) for the sake of the overall life. Why was that acceptable? (Because it was the same person.) 
     - In the social round, the same aggregative reasoning was used (maximize the total), but now the costs and benefits fall on different people. Why is that problematic? (Because the person who bears the cost doesn't necessarily get the benefit, and even with compensation, it's not the same as having the benefit spread over the same life.)
     - Highlight the separateness of persons: the utilitarian treats society as a single entity and aggregates across persons as if they were parts of one big life. But the boundaries between persons are morally significant: we cannot simply transfer well-being from one to another to maximize the total because each person is a separate entity with their own life to live.

     - Map to the objection:
       - The prudential round models the rational choice of a single individual: intra-personal aggregation is rational.
       - The social round models the utilitarian social choice: inter-personal aggregation.
       - The objection: what is rational for one individual is not necessarily morally permissible for a group because of the separateness of persons. The world cannot deliver compensation in the same way across persons as within a life because the person who suffers the loss is not the same as the one who enjoys the gain (even if we try to compensate, the loss is still experienced by one and the gain by others).

  5. Addressing Predictable Problems:

     a. **Confident utilitarians**: They may see the punchline and try to argue for Option B in the social round, and even argue against compensation (to maximize the total). How to handle: During the debrief, acknowledge that utilitarianism does require Option B. Then push them to consider why we might object to it even if it maximizes total utility. Also, in the compensation vote, they might push for low compensation to keep the total high. But then the loser's experience becomes a vivid example of the problem. Use the feelings of the loser to highlight the moral issue.

     b. **Students who don't care about abstract tokens**: We need to make the tokens feel meaningful. We can frame the points as representing important aspects of well-being (e.g., health, happiness, opportunities). Also, we can tell them that at the end, we will have a drawing for a small prize (e.g., a candy bar) based on the total points they accumulated? But that might create a real incentive and change the dynamic. Alternatively, we can appeal to their imagination: "Imagine that these points represent the quality of your life during four distinct stages of life (e.g., young adulthood, middle age, etc.)". Also, in the social round, the random assignment of the loser might create emotional engagement even with tokens.

     c. **The activity cannot perfectly isolate the Rawlsian point**: The Rawlsian point is that the problem is not just about the distribution (which could be fixed by compensation) but about the fundamental inappropriateness of aggregating across persons. The activity might be interpreted as showing that the problem is unfairness or that compensation is incomplete. But Rawls's point is that even if compensation were perfect (so that the loser ends up with the same total as the gainers), the separateness of persons still makes the initial imposition of the loss without consent morally problematic. 

       How to handle: In the debrief, explicitly state that the activity shows two issues: 
          (1) The difficulty of achieving true compensation across persons (because the burdened person has to endure the loss without the benefit until compensation, and the compensation might not fully make up for the suffering in the same way as within a life).
          (2) The deeper point: even if we could perfectly compensate so that the loser ends up with the same total as the gainers, the fact that we are using one person as a mere means for the benefit of others is still a violation of the separateness of persons.

       We must emphasize that the objection is not merely about the distribution of utility but about the structure of moral reasoning that aggregates across distinct persons. The debrief must explicitly draw out that the utilitarian model of social choice is an extension of the model of individual prudence, and that this extension fails because society is not a super-person. Only the debrief can make this explicit.

  **Revised Timeline**:

  - 0-5 min: Introduction and explanation of the prudential round.
  - 5-20 min: Prudential round: individual choice and discussion.
  - 20-50 min: Social round: group formation, decision-making, and reporting.
  - 50-75 min: Debriefing and connection to Rawls.

  **Rules and Materials (detailed)**:

  - Materials: 
    - Index cards for each student (one for prudential round, and then they can use the same or a new one for social round).
    - A way to randomly assign the loser in the social round (e.g., a deck of cards with one 'loser' card and the rest 'gainer' for each group, or the facilitator can use a random number generator).
    - A handout with the options (or project on screen).

  - Rules for Prudential Round:
    - Each student has two options for their own life:
        Option A: [5,5,5,5] (total 20)
        Option B: [10,0,10,10] (total 30)
    - They choose one and record it.

  - Rules for Social Round (for a group of N, where N is 3 or 4):
    - The group must choose between:
        Option A: every member gets [5,5,5,5] (each total 20, group total 20*N).
        Option B: one randomly chosen loser gets [0,0,0,0] and the rest (gainers) get [10,10,10,10] each (group total 40*(N-1)).
    - They vote by majority. If they choose Option A, they are done. If Option B, then:
        - Randomly select the loser (the facilitator can do this to ensure fairness).
        - Then, the group votes on the compensation amount X (an integer from 0 to 10). The compensation happens in period 4:
            - Each gainer: period 4 becomes (10 - X)
            - The loser: period 4 becomes ( (N-1) * X )
        - Note: the points in periods 1-3 are fixed.

  **Debriefing Guide**:

  1. Ask: In the prudential round, why did you choose Option B? (Because it leads to a higher total. And it's your own life, so you can make that trade-off.)

  2. Ask: In the social round, which option did your group choose and why? (Many groups will choose B for the higher total.)

  3. Ask the losers: How did it feel to be the loser? (They might say: unfair, I didn't consent, I had to suffer for others, etc.)

  4. Ask: Did compensation help? How much compensation was voted? Why wasn't it set higher? (Some groups might set X high, but note: if X is set to 10 in a group of 4, then the loser gets 30 in period 4 (so total 30) and each gainer gets 30 total. But the loser still had three periods of 0. And the gainers had three periods of 10 and one of 0. Contrast with the prudential round: in the prudential round, the person had one bad period (period 2) but then high in the others. The pattern is different and the experience of the loser is worse because they had three bad periods and no control.)

  5. Point: In the prudential round, the same person who endured the bad period also enjoyed the good ones. In the social round, the person who endured the bad periods (the loser) is not the same as those who enjoyed the good ones (the gainers). Even if we transfer points at the end, it doesn't change the fact that the loser had to suffer through the bad periods without the offsetting benefits. Moreover, the compensation is decided by others and might not be enough to make up for the suffering.

  6. Connect to Rawls: The separateness of persons objection says that utilitarianism fails to take seriously the distinction between persons. It extends the rational choice model of one individual to society, but society is not a single person. Therefore, we cannot aggregate across persons in the same way we do within a life. This is why Rawls argues for a social contract that protects the basic liberties and opportunities of each individual and does not allow sacrifices of one for the greater good.

  7. Explicitly state: The objection is not just about unfairness (which might be addressed by compensation) but about the fundamental structure of moral reasoning that aggregates across persons. Even if compensation could be arranged so that the loser ends up with the same total as the gainers, the process of imposing the loss without consent and using one person as a means for others is still morally problematic. The activity cannot perfectly capture this because the compensation is partial and because the tokens are abstract. The debrief must make the stronger point: the utilitarian calculus ignores the boundaries between persons and thus fails to respect each person as an end in themselves.

  **What might go wrong**:

  - The group might choose Option A in the social round, avoiding the dilemma. Then we don't get the contrast. How to handle: If a group chooses A, ask them why. They might say it's unfair to the loser. Then we can still discuss: why is it acceptable in the prudential round to have a bad period but not in the social round? And what if the total gain is much larger? We can then present a hypothetical: what if the group total in Option B was 10 times larger? Would they then choose B? This can lead to a discussion of whether aggregation across persons is ever acceptable.

  - The random assignment of the loser might be emotionally charged even with tokens. Be prepared to manage any distress by reminding them it's just a simulation.

  - The confident utilitarians might dominate the group discussion. Encourage all to participate and make sure to ask the loser how they feel.

  - The compensation vote might be set too low or too high. Either way, it serves the purpose: if too low, the loser feels hard done by; if too high, then we can point out that the gainers are now giving up a lot and might feel resentful, and also note that the loser still had to endure the bad periods.

  By the end, the students should have a felt sense of the objection and be ready to see why Rawls rejects utilitarianism and proposes justice as fairness.
answer: |-
  ### Activity Design: "Life Trade-offs and the Separateness of Persons"

  **Objective**: To make the separateness of persons objection tangible by contrasting intra-personal prudence (rational for one life) with inter-personal aggregation (problematic across lives), and to reveal why "compensation" fails across persons.  
  **Core Insight**: Utilitarianism extends the decision-rule of prudence to society, but losses to one person cannot be "offset" by gains to others in the same way costs/benefits are offset within one life.

  ---

  ### **Materials**  
  - **Index cards** (one per student) for recording choices and outcomes.  
  - **Tokens**: 100 tokens total (e.g., poker chips, paper clips, or tally marks). Each token represents 1 unit of well-being.  
  - **Random selector**: A deck of cards or app to randomly assign roles.  
  - **Payoff scheme**: Non-monetary. Points translate to abstract "well-being" (e.g., 0 tokens = misery, 10 tokens = high well-being).  

  ---

  ### **Rules and Setup**  
  1. **Prudential Round (Individual Choice)**:  
     - Each student manages their own "life" across 4 periods (e.g., youth, adulthood, midlife, old age).  
     - **Two options**:  
       - **Option A (Balanced)**: 5 tokens in *each* period (total: 20 tokens).  
       - **Option B (Prudential Trade-off)**: 10 tokens in Period 1, **0 tokens in Period 2**, 10 tokens in Period 3, 10 tokens in Period 4 (total: 30 tokens).  
     - **Rationale**: Choosing B is aggregatively optimal (30 > 20) and rational for one life—students "pay" a cost in Period 2 for greater benefits later.  

  2. **Social Round (Group Choice)**:  
     - Students form groups of 4 (for 14 students: three groups of 4 and one group of 2; adjust payoffs for smaller groups—see *Adjustments* below).  
     - **Group task**: A "Planner" (elected by majority vote) chooses an option for all 4 group members.  
     - **Two options**:  
       - **Option A (Equal)**: All get 5 tokens per period (20 tokens each; 80 tokens total).  
       - **Option B (Aggregative)**: **One random member (the "Burdened") gets 0 tokens in ALL periods**. The other three get 10 tokens per period (40 tokens each; 120 tokens total).  
     - **Compensation mechanism**: If the group chooses B, they vote on redistributing tokens **in Period 4 only**. Each non-burdened member can give 0–10 tokens to the Burdened.  
       - *Example*: If each gives 5 tokens, the Burdened gets 15 tokens in Period 4 (0+0+0+15 = 15 total), while others get 35 tokens each (10+10+10+5).  

  ---

  ### **Timeline (75 Minutes)**  

  | Time  | Phase               | Activity                                                                 |
  |-------|---------------------|--------------------------------------------------------------------------|
  | 0-5   | Introduction        | Frame the activity: "We’re exploring how we value trade-offs within lives vs. across lives." Explain tokens as "well-being," not money. |
  | 5-15  | Prudential Round    | Students choose A or B individually. Record choices on index cards. Show of hands: Who chose B? Discuss why (emphasize rationality of accepting Period 2 misery). |
  | 15-25 | Social Round Setup  | Divide into groups. Assign Planner role. Explain options A and B. Highlight: Compensation is allowed *only in Period 4*. |
  | 25-40 | Group Deliberation  | Groups debate and vote on A or B (Planner has tie-breaker). If B is chosen, randomly select Burdened member (use deck of cards: one "burdened" card). |
  | 40-50 | Compensation Vote   | If B was chosen, groups vote on token transfers (0–10 tokens). Record final token totals for each member. |
  | 50-60 | Group Reports       | Each group shares: Chose A or B? If B, how much compensation? How did the Burdened feel? |
  | 60-75 | Debrief & Lecture   | Connect activity to separateness of persons objection. Address fairness vs. aggregation. |

  ---

  ### **Key Adjustments for Groups**  
  - **Groups of 4**: Burdened gets 0 tokens in all periods; others get 10 each per period.  
  - **Groups of 3**: Burdened gets 0; others get 15 each per period (maintains aggregate gain: 90 vs. 60 for Option A).  
  - **Groups of 2**: Burdened gets 0; other gets 20 per period (aggregate: 80 vs. 40 for Option A).  

  ---

  ### **Debrief: Mapping the Activity to the Objection**  
  1. **Prudential Round as Utilitarianism’s Foundation**:  
     - Students defended intra-personal trade-offs (e.g., "I chose B for my life because 30 > 20").  
     - **Map to objection**: Utilitarianism treats society like a single rational agent—losses to "parts" (persons) are justified by gains to the whole.  

  2. **Social Round as Problematic Aggregation**:  
     - Groups likely chose B (120 tokens > 80) but resisted full compensation (e.g., Burdened ended with <30 tokens).  
     - **Map to objection**: Losses fall entirely on one person, but gains go to others. Compensation fails because:  
       - The Burdened suffers **uncompensated misery in Periods 1–3** while waiting for Period 4.  
       - Gainers vote selfishly (e.g., "I gave only 3 tokens—I earned my 40!").  

  3. **Why Compensation Fails Across Persons**:  
     - In prudence, you "compensate" yourself seamlessly (e.g., Period 2 misery is offset by Period 4 joy).  
     - Across persons, compensation is **hypothetical, delayed, and contingent**—it can’t erase the Burdened’s isolation in suffering.  
     - **Rawlsian point**: Aggregation ignores that persons are distinct moral agents. Losses and gains aren’t "shared" like they are in one life.  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Problem: Confident Utilitarians Smell the Punchline**  
     - They’ll push hard for Option B and minimal compensation.  
     - **Solution**: Use their stance to fuel debate. In debrief, ask: "Would you accept being the Burdened? Why is it different when *you* suffer?" Highlight emotional asymmetry.  

  2. **Problem: Students Don’t Care About Tokens**  
     - Abstract tokens feel meaningless; engagement lags.  
     - **Solution**:  
       - **Reframe tokens** as "life resources" (e.g., health, opportunities).  
       - **Inject stakes**: "If this were real, the Burdened gets 4 weeks of grueling labor while others relax."  
       - **Leverage randomness**: Fear of being Burdened raises stakes.  

  3. **Problem: Compensation Vote Dominates Discussion**  
     - Groups may fixate on "fair" compensation and miss the aggregation critique.  
     - **Solution**: During reports, ask: "Even if the Burdened got 30 tokens, is it the *same* as your prudential trade-off? Why not?"  

  ---

  ### **What the Activity Can’t Replicate (Requires Lecture)**  
  - **The Stronger Rawlsian Point**: The activity shows compensation’s practical failure but not why aggregation across persons is *inherently* invalid. Students may conflate the issue with fairness ("It’s unfair to the Burdened!") rather than seeing aggregation itself as the problem.  
    - **Why?** Classroom mechanics can’t fully simulate the moral asymmetry between intra-personal prudence ("my life, my trade-offs") and inter-personal aggregation ("your loss for my gain").  
    - **Lecture Fix**: Explicitly contrast:  
      - Prudence: Costs/benefits bind the same person → compensation is non-alienating.  
      - Aggregation: Costs/benefits split across persons → no "self" to bind them. Thus, utilitarianism violates the "separateness of persons" by treating society as a single agent.  
    - **Quote Rawls**: "Utilitarianism does not take seriously the distinction between persons" (*A Theory of Justice*).  

  **Final Tip**: Run the activity with ruthless timing. The emotional friction in the Social Round is your ally—let students sit with the discomfort before debriefing. By making the Burdened’s isolation visceral, you pave the way for Rawls’ critique of aggregation.
