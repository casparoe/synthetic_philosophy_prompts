prompt: |-
  I do rapid-response communications for a mid-sized human rights org -- the person who drafts the first public statement when something awful starts happening somewhere. A few times a year a situation flares up and within a day or two I have to decide what we CALL it in our press releases and reports: genocide, crimes against humanity, ethnic cleansing, war crimes, or the infinitely deniable "mass atrocities." Our legal counsel then reviews before the director signs off, but the first draft and the framing are mine, and once you put a word in the first press release it's basically impossible to walk back.

  The problem is that the word "genocide" specifically is a legal category with weird edges that everyone on all sides keeps muddying. As I understand it: the Genocide Convention limits protected groups to national, ethnic, racial and religious ones, so political groups and most class-based persecution are out by definition. You need specific acts (killing, serious harm, destroying conditions of life, preventing births, forcibly transferring children) done with special intent to destroy the group as such -- which courts have treated as a very demanding thing, more than just knowingly doing terrible things to a group. Meanwhile Lemkin, who basically invented the concept, thought of it much more broadly, including destroying a group's culture and way of life without mass killing, but that broader conception mostly did NOT make it into the convention. And then there's "ethnic cleansing," which everyone uses loosely but which is not a standalone legal category, more of a description that can slide into genocide depending on what the intent was. On top of all that there's the practical layer: calling something genocide when you can't prove special intent hands deniers a win when a court later disagrees, but NOT calling it genocide is itself a political act with its own history, and "crimes against humanity" is both technically more prosecutable in some ways and rhetorically weaker.

  I need this turned into something I can actually run at 11pm before a 7am statement deadline. Write me a decision procedure -- ordered questions, what counts as enough of an answer to each, where the procedure outputs "insufficient basis, say X instead," and crucially where it has to stop and hand the call to a human because what's left isn't a factual question but a values/strategy question (e.g. whether withholding the word aids denial, whether our org should be in the business of legal conclusions at all vs. documenting facts). Be honest about which steps are judgment calls wearing a labcoat.

  Then run it on three situations. (a) A regional minority is being deported en masse from a contested province -- villages burned, mosques/churches razed, dozens killed in the course of expulsion, aid workers expelled, but killing doesn't seem to be the point so much as getting the land. Half my colleagues want the g-word in the first line. (b) Decades of a state removing an Indigenous group's children to boarding schools with forced language suppression and high death rates -- this is the case where the broader Lemkin conception and the convention's child-transfer clause pull apart, and where our own staff and the affected community call it genocide while a court probably wouldn't on the mass-killing framing. (c) A government blockades a rebellious region where an ethnic group is concentrated and food can't get in, famine deaths climbing -- the leadership clearly knows what blockade plus famine does but frames it as counterinsurgency, so it's a knowledge-vs-purpose problem.

  Tell me where the procedure gives answers I won't like, and what it can't do at all. Also please say how the procedure should handle us being early -- situations where the destruction is clearly underway but evidence is still thin, since "waiting for certainty" is exactly how the phrase "never again" keeps failing. Keep it practical, I'm not a lawyer and never will be.
reasoning: |-
  Okay, let me break this down. The user needs a practical decision tree for labeling atrocities in human rights communications, balancing legal precision with moral urgency. 

  First, I recognize the core tension: legal definitions (like genocide's narrow criteria) versus advocacy impact. The user's midnight deadline pressure means this can't be academic - it must be actionable. Their examples show recurring pain points: intent ambiguity, cultural destruction vs. legal thresholds, and the strategic weight of terminology.

  The key framework should:
  1. Prioritize objective elements first (acts, groups) before subjective intent
  2. Flag where legal analysis ends and advocacy judgment begins
  3. Build in off-ramps to safer terms like "atrocity crimes" when uncertain
  4. Explicitly separate factual assessment from strategic considerations

  For the procedure design, I'm structuring it as a flowchart with:
  - Hard stops (e.g., protected group not targeted? → can't be genocide)
  - Evidence thresholds (when witness accounts suffice vs. needing patterns)
  - Judgment zones marked visibly (🛑 symbols)
  - Strategic override options post-legal assessment

  The three test cases reveal friction points:
  - Case A (deportations): Legally messy since land seizure ≠ intent to destroy group. Procedure will disappoint colleagues wanting "genocide" but forces confronting the intent gap.
  - Case B (boarding schools): Highlights the Lemkin-vs-convention rift. Procedure flags this as a values call - does the org prioritize legal coherence or survivor perspectives?
  - Case C (blockade): Knowledge-vs-purpose dilemma. Procedure forces acknowledging when intent evidence is circumstantial.

  Biggest design challenge: Handling thin evidence. I'm adding a "destruction underway" protocol that allows provisional labeling with explicit caveats, rejecting the "wait for bodies" approach. But this requires institutional courage - hence the 🚨 alerts in the flowchart.

  What the procedure can't fix: It won't make courts adopt broader definitions, or force governments to care. And it exposes uncomfortable truths - sometimes "crimes against humanity" is both legally correct and morally insufficient. The user must live with that tension.
answer: |-
  Here's a field-deployable decision procedure for labeling atrocities, designed for midnight urgency. It prioritizes defensibility while flagging where strategy must override law. **Bolded terms** are your output options; 🛑 indicates a judgment call requiring human strategy input.

  ---

  ### **Rapid Atrocity Labeling Decision Tree**
  *(Run sequentially - stop when you hit a definitive answer)*

  1. **IS THERE SYSTEMATIC ATTACK AGAINST A SPECIFIC POPULATION GROUP?**  
     *Evidence:* Targeted violence/repression patterns, discriminatory rhetoric, policy documents.  
     → **NO?** → Label *individual crimes* (e.g., "killings," "forced displacement"). STOP.  
     → **YES?** → Proceed to #2.

  2. **DOES THE GROUP FALL UNDER GENOCIDE CONVENTION PROTECTED CATEGORIES?**  
     *(National, Ethnic, Racial, Religious - **NOT** political/class)*  
     → **NO?** → → 🛑 **"Crimes against Humanity"** (CAH) is likely accurate. *Strategy Check:* If group identity is core (e.g., caste, gender), consult counsel on expanding description.  
     → **YES?** → Proceed to #3.

  3. **ARE "GENOCIDAL ACTS" OCCURRING?**  
     *(Killing members; Causing serious bodily/mental harm; Deliberately inflicting conditions to destroy physically; Preventing births; Forcibly transferring children)*  
     → **NO?** → → **"Ethnic Cleansing"** or **"CAH"** (e.g., persecution, deportation).  
     → **YES?** → Proceed to #4 (⚠️ *This is the hardest step*).

  4. **IS THERE EVIDENCE OF *SPECIFIC INTENT* TO DESTROY THE GROUP?**  
     *Evidence Hierarchy:*  
     - **Smoking Gun:** Direct orders, explicit policy docs, speeches targeting group *existence*.  
     - **Strong Circumstantial:** Systematic destruction of cultural/social foundations (schools, places of worship, records), denial of aid to group, scale/pattern *only explainable* by intent to destroy.  
     - **Weak/None:** Violence is severe but aims at displacement, suppression, or resource grab.  
     → **SMOKING GUN?** → → **"Genocide"**.  
     → **STRONG CIRCUMSTANTIAL?** → → 🛑 **"Genocide"** *but flag evidentiary risk*. Strategy Check: Can we withstand denial backlash if courts later dissent?  
     → **WEAK/NONE?** → → **"Ethnic Cleansing"** + **"Crimes Against Humanity"** (deportation, persecution, murder). *Avoid "genocide"*.

  5. **🛑 FINAL STRATEGY OVERRIDE:**  
     Even if legal threshold unmet, consider:  
     - **Moral Imperative:** Does withholding "genocide" aid denialism? (e.g., historical parallels like Rwanda ignored).  
     - **Community Voice:** Are affected groups demanding the term? (May override strict legalism).  
     - **Org Policy:** Should we prioritize legal precision or moral witness?  
     → Output may shift to **"Genocide"** with caveats *or* **"Atrocity Crimes"** + detailed description.

  ---

  ### **Handling Thin Evidence / Early Stages**
  - **"Destruction Underway" Protocol:**  
    Use **"Potential Genocide"** or **"Risk of Genocide"** IF:  
    (a) Protected group is targeted;  
    (b) Genocidal acts *or* explicit intent signals exist;  
    (c) Violence is escalating systematically.  
    *Pair with:* "Evidence suggests emerging genocide. We call for urgent investigation."  
  - **Never Wait for Certainty on:**  
    – Systematicity of attacks  
    – Group targeting  
    – Start of genocidal acts (killings, mass expulsion).  
  - **Require Corroboration for:**  
    – Specific intent (unless overt).  
    – Scale of destruction (use estimates: "scores killed," "thousands displaced").

  ---

  ### **Test Runs**

  #### **(a) Regional Minority Deportations**  
  1. **Systematic attack?** YES (burned villages, razed churches/mosques, mass expulsion).  
  2. **Protected group?** YES (ethnic/religious minority).  
  3. **Genocidal acts?** YES (destroying conditions of life via expulsion, infrastructure destruction; possibly killing).  
  4. **Specific intent?** **WEAK/NONE** – Land seizure, not group destruction, appears primary. Killing is "in course of" expulsion, not systematic annihilation.  
  → **OUTPUT: "Ethnic Cleansing" + "Crimes Against Humanity" (deportation, persecution, murder)**  
  *Why you won't like it:* Colleagues want "genocide," but intent points to territorial aggression. Strategy Override 🛑: If expulsion makes return impossible (e.g., replacing demography), argue for "genocide" via "destroying conditions of life."  

  #### **(b) Indigenous Boarding Schools**  
  1. **Systematic attack?** YES (decades of forced child removal, language suppression).  
  2. **Protected group?** YES (Indigenous = ethnic/national).  
  3. **Genocidal acts?** YES (forcibly transferring children; *arguably* inflicting conditions to destroy group via cultural erasure).  
  4. **Specific intent?** **STRONG CIRCUMSTANTIAL** – Policy aimed at destroying cultural identity ("kill the Indian, save the man"). High death rates show reckless disregard.  
  → **OUTPUT: 🛑 "Genocide"** (via child transfer/cultural destruction clauses) *but note courts may require physical destruction*.  
  *Strategy Override 🛑 Crucial:* Survivors call it genocide; legalistic hesitation risks complicity. Moral imperative over narrow jurisprudence.  

  #### **(c) Blockade Causing Famine**  
  1. **Systematic attack?** YES (targeted blockade of ethnic region).  
  2. **Protected group?** YES (ethnic group).  
  3. **Genocidal acts?** YES (deliberately inflicting conditions to destroy physically via famine).  
  4. **Specific intent?** **WEAK/CIRCUMSTANTIAL** – Knowledge of consequences ≠ purpose. Framed as counterinsurgency (targeting rebels, not ethnicity).  
  → **OUTPUT: "Crimes Against Humanity" (extermination, persecution)**.  
  *Why you won't like it:* Genocide seems morally apt. Strategy Override 🛑: If group is *exclusively* targeted and rebels are pretext, use "genocide." Otherwise, CAH "extermination" is legally safer and still potent.

  ---

  ### **Where the Procedure Fights You**
  1. **"Genocide" is Narrow:** It will often reject the term when violence feels genocidal but lacks intent proof (Case A, C).  
  2. **Moral vs. Legal Tension:** Case B forces a values choice: honor survivors or defer to courts? The procedure flags but can't resolve this.  
  3. **"Ethnic Cleansing" is Legally Empty:** It’s descriptive, not a charge. Procedure uses it for mass expulsion without clear genocidal intent.  
  4. **Early Stages:** You’ll output "risk of genocide" when colleagues demand certainty.  

  ### **What It Can’t Do**
  - **Prove Intent Without Evidence:** It can’t manufacture proof. If intent is ambiguous, it defaults to CAH/ethnic cleansing.  
  - **Override Legal Reality:** If courts consistently require mass killings, Case B stays messy.  
  - **Resolve Strategic Dilemmas:** Whether labeling aids denial or advances justice is always human-call territory.  

  ### **Practical Add-Ons**
  - **Phrase Bank:**  
    - *Weak Intent:* "Acts consistent with genocide," "genocidal dimensions"  
    - *Thin Evidence:* "Credible reports indicate emerging genocide risk"  
    - *Legal Hedge:* "Meet the criteria for genocide under international law"  
  - **Midnight Script:**  
    *"We observe [ACT], targeting [GROUP]. Evidence suggests intent to [DESCRIBE INTENT]. This meets the legal threshold for [LABEL] under the Genocide Convention/ICC Statute. We demand [ACTION]."*  

  **Bottom Line:** This procedure forces disciplined analysis but won’t absolve you of strategy calls. Its power is in making the gap between law and moral urgency visible, so you choose *how* to bridge it—not whether to pretend it doesn’t exist.
