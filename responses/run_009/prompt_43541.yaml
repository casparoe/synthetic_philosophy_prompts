prompt: |-
  My flatmate is doing a masters in philosophy of language and she's decided promises are impossible. Not just breakable — normatively empty, like pretend money. She cornered me over the washing up and I've been stuck since. Here's her argument, reconstructed as fairly as I can manage:

  (1) When I promise to pick you up from the airport, the utterance itself creates an obligation — before I spoke you had no claim on me, after I spoke you do. That's just what promising is; the words don't describe anything, they do something. (Austin performatives, fine, I accept that part.)

  (2) Creating an obligation means imposing a requirement on someone who wasn't under it before.

  (3) You can't impose a requirement on a person without their consent. Otherwise anyone could conjour duties out of thin air just by talking — I could walk up to a stranger and say "I hereby oblige you to wash my car."

  (4) When I promise, the person the requirement lands on is me — or rather my future self, who will actually have to drag herself out of bed at 5am.

  (5) My present utterance is not my future self's consent. She said nothing. She may deeply resent the whole arrangement.

  (6) So either the promise creates no obligation (and promising is a collective fiction), or it creates one without consent and (3) turns out false anyway.

  Then she says it gets worse. (7) Everything normative that comes out of a mouth is in the same boat: contracts, oaths of office, "I do" at a wedding, "I consent" at the hospital. Each is just a noise made by a present person purporting to bind a person who exists later. (8) So no speech act ever creates an obligation — signing a lease, swearing an oath, consenting to surgery, it's all normatively inert. Speech is just breath with manners.

  I refuse to accept (8). I've promised to drive her to the train station tomorrow and I fully intend to feel bound. But I went through (1) to (6) with her and every single step looked fine. Which step is the weak one? And if I reject it, or reinterpret it, what am I paying — what else goes with it? I'd most like to keep (3), the consent principle, because it seems to be doing real work elsewhere, but I can't see how to keep it and not loose the promise.

  One more thing that's bugging me: she claims (3) is untouchable anyway, because the consent principle is just what makes utterances like "I consent" meaningful in the first place — so the principle and the performative are supposed to prop each other up, and attacking either brings down the house. Is she right about that, or is that mutual support actually where the whole thing is weakest?

  Also, please write the answer in British English — we're in Manchester and she will absolutely mock me otherwise.
reasoning: |-
  Okay, the user's flatmate has presented a philosophical argument claiming promises are impossible because they can't create obligations without consent, and this extends to all performative speech acts. Let me break down her argument step by step to find the weak point.

  First, premise (1) seems solid—promises as performative acts that create obligations. Austin's theory checks out. Premise (2) also makes sense: obligations impose new requirements. The issue likely starts at (3), the consent principle. The flatmate argues you can't impose duties without consent, but is consent always required in this way? 

  Looking at (4) and (5), the problem arises because the future self hasn't consented. But is the future self a separate entity? That's a key assumption here. If we view the person as a continuous entity over time, then present consent binds the future self. Philosophers like Derek Parfit discuss personal identity, suggesting that if psychological connectedness exists, obligations can persist. 

  The flatmate's point (7) and (8) extend this to all normative speech acts, but that seems drastic. Contracts and consents work in practice because society recognizes them as valid. So maybe (3) is too rigid. Consent in performatives isn't like a one-time event but part of ongoing social practices. 

  Also, the mutual support between consent and performatives might be circular. If consent itself is a performative, then using it to ground obligations could be problematic. But in real-world contexts, institutions and relationships provide the framework that gives performatives their force. 

  The user wants to keep the consent principle but save promises. The solution might be redefining consent as embedded in social norms, not isolated acts. Rejecting the strict separation between present and future selves could also help. The user's intention to feel bound indicates that internal commitment matters, which aligns with theories of promising as a social tool. 

  So, the weak link is premise (5) and the assumption of a fragmented self. By emphasizing continuity and social context, promises can remain valid without undermining consent.
answer: |-
  Right, this is a proper Mancunian philosophical pickle your flatmate's got you in. She's sharp – that argument's tighter than a new pair of trainers. Let's break it down step-by-step, spotting where the weak link is (or where the re-interpretation needs to happen), and what it costs. I'll keep it British English, naturally – wouldn't want her taking the mickey.

  **The Weak Link: Premise (5) & The Nature of the "Self"**

  The most vulnerable step, where you can push back without nuking everything else you value (like the consent principle in (3)), is **Premise (5): "My present utterance is not my future self's consent. She said nothing. She may deeply resent the whole arrangement."**

  Here's why this is the pressure point and how to attack it:

  1.  **The "Fragmented Self" Assumption:** Your flatmate smuggles in a radical view of personal identity. She treats "present me" and "5am-future-me" as distinct entities, almost like different people living in the same body sequentially. This is philosophically contentious.
      *   **The Pushback:** We *don't* normally think of ourselves as completely different people over time. There's a fundamental **continuity of the self**. While my preferences, mood, and even values might change, *I* am still the same *person* who made the promise. The obligation attaches to *me*, the enduring entity, not to a temporal slice of me.
      *   **The Cost:** You have to accept that binding your future self is legitimate *because* it's still *you*. This means accepting that future-you *isn't* a separate agent needing fresh consent. You commit to a view of personal identity where continuity allows for present decisions to bind future actions, even if future-you grumbles. This is how we function daily – saving for pensions, booking dentist appointments, signing leases. We *assume* we have the authority to bind our future selves.

  2.  **"Consent" Misapplied:** Premise (5) misapplies the consent principle (3). (3) rightly protects one *person* from having obligations imposed by *another* person without agreement. But here, the "imposition" is *internal* – it's *me* imposing an obligation *on myself*, across time, via a recognised social mechanism (promising).
      *   **The Pushback:** Promising isn't "Present Me" imposing on "Future Stranger Me". It's "Me, as an enduring agent with temporal extension," exercising my autonomy *now* to structure my future actions and relationships. The "consent" is embedded in the *act of promising itself*, performed by the whole person. Future resentment doesn't invalidate the prior exercise of autonomy; it just means future-me might wish past-me had chosen differently.
      *   **The Cost:** You have to refine the consent principle. It remains vital *between distinct persons*. But *within* a single, temporally extended person, a different dynamic applies: **commitment**. Promising is an act of *self-binding* commitment, not an imposition by one agent on another. This preserves the core work of (3) in interpersonal cases while allowing for intrapersonal commitment.

  **Re-evaluating the Argument with this Pushback:**

  *   **(1) & (2):** Still fine. Promising creates an obligation.
  *   **(3):** Consent principle preserved *for obligations imposed by one person upon another distinct person*. Your car-washing example holds – that stranger needs to agree.
  *   **(4):** The obligation lands on *me* (the enduring self). Not on a separate "future self" entity.
  *   **(5):** **Weak Premise (Rejected).** The present utterance *is* the act of the enduring self committing its future states. Future resentment is irrelevant to the *creation* of the obligation (though relevant to regret or potentially *breaking* it).
  *   **(6):** False dilemma defeated. The promise *can* create a genuine obligation *because* it's an act of self-commitment by an enduring agent, not an imposition on a separate non-consenting entity.
  *   **(7) & (8):** Don't follow. Contracts, oaths, "I do", "I consent" are all acts performed by agents understood as enduring entities capable of binding their future states through recognised social/linguistic practices. They are *not* "just noises". Their normative force comes from the social institution *and* the agent's exercise of autonomy/commitment within that framework.

  **What About the Mutual Support Claim (Consent Principle <-> Performatives)?**

  Your flatmate's got a point about the *interdependence*, but she overstates it into a fatal circularity. She's right that the consent principle (3) helps explain why performatives like "I consent" *work* – because the utterance itself constitutes the act of agreeing. However:

  1.  **Not All Performatives Rely Solely on Consent for Force:** Promising (as argued above) relies on commitment + social practice. Declarations ("I name this ship...") rely on institutional authority. "I consent" *is* special because consent *is* its core function. Using "I consent" as the *model* for *all* performatives is a mistake. They have different felicity conditions.
  2.  **The Principle Stands Independently:** We grasp the *concept* of consent ("agreement without coercion") independently of the specific words "I consent." The performative utterance is a powerful *tool* for *doing* consenting clearly and publicly, but the *principle* that consent is necessary for certain impositions exists logically prior. We could (awkwardly) establish consent through nods, gestures, or consistent behaviour – the *principle* gives meaning to those acts *too*. The performative makes it efficient and clear.
  3.  **The Circularity Isn't Vicious:** Yes, the *successful use* of "I consent" depends on the social understanding that such utterances *do* constitute consent (which presumes the principle matters). And the principle gains clarity and practical application through performatives like "I consent." This is interdependence and mutual reinforcement within a social practice, not a fatal circularity that "brings down the house." It's how language and norms co-evolve. Attacking the *specific mechanics* of promising doesn't automatically destroy the foundation for "I consent," because they function slightly differently.

  **In a Nutshell (Manc Style):**

  Your flatmate's argument cracks at step (5). She's treating your future self like a different bloke who never agreed to nowt. But you're not a series of disconnected gits renting your body – you're *you*, yesterday, today, and at 5am tomorrow. When you promise *now*, it's *you* committing *yourself*. Yeah, 5am-you might hate 9pm-you's guts for it, but that's tough – *you* made the call. The consent rule (3) still stops you bossing *actual other people* about ("Wash my car, stranger!"), but it doesn't stop *you* tying *your own* shoelaces together for tomorrow.

  The mutual support thing? She's half right – "I consent" *needs* the consent rule to make sense, and the rule is clearer *because* we have phrases like "I consent." But it's not house-of-cards flimsy. It's more like scaffolding holding up a solid building. You can poke one bit without the whole lot collapsing. Promises work on a similar but different bit of scaffolding – commitment and sticking to your word over time.

  So, drive her to the station tomorrow. You *are* bound. Because you said you would, society expects it, and crucially, *you* (the whole, temporally stretched-out you) committed to it. Tell her the 5am grumbling is just future-you having a moan, not an ontological objection. And maybe get her to do the next round of washing up – consider it repaying the philosophical debt.
