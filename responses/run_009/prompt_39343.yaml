prompt: |-
  I'm hoping you can act as a political philosopher who specialises in self-determination and secession — think someone who's spent years on multinational democracies and knows the Quebec, Spanish and UK cases inside out, but explains things plainly, no jargon for the sake of it. And please actually think before answering: start by brainstorming which pairs of my views below might be in tension, then work through them one by one. Don't just dump a lecture on the history of the principle at me — audit my set.

  Here's my situation: I'm English, moved to Glasgow in 2016 for work, and I never used to think hard about any of this. What changed: my partner's cousin lives in Barcelona, been there 20 years, married to a Catalan, and during the whole 2017 mess she mentioned she'd never get a vote in any Catalan referendum — while I, an English guy in Glasgow, would definately get one if Scotland ever voted again, because up here it's residence that counts. That asymmetry has bugged me ever since, and with independence back in the news up here every other week I've had to actually work out what I believe. So here's the set — tell me if it hangs together:

  1. If a nation like Scotland or Catalonia or Quebec has a settled majority that wants independence and wants a referendum, it should get one, and if it wins, the result should be honoured. That's just democracy — the people affected deciding together.
  2. But the unit that votes is the nation, not any random patch of territory. Shetland doesn't get to vote itself out of an independent Scotland the day after, and I don't accept the "well then any neighbourhood can secede" slippery slope — nations are the units that matter, that's the whole point.
  3. The franchise should be residence-based: whoever actually lives in the territory gets the vote, newcomers and 16-year-olds included, and people who were born there but moved away don't. That's why I'd get a vote and that seems right to me even though I'm English — it's where your life is that counts.
  4. Half of me buys the grievance requirement. A friend from Valencia says rich regions voting themselves out is "tax avoidance with a flag," and I think there's something to it — Quebec's case always felt weightier to me because of the language and the history, and Canada's approach after the 1995 near-miss (clear question, clear majority, then negotiate) strikes me as the sane model.
  5. Secession shouldn't be unilateral, full stop. Spain was right that the 2017 vote was unconstitutional, whatever I think of how they handled the aftermath, and an agreed legal process like Edinburgh got in 2014 is the only legitimate route.
  6. I'm pretty sure self-determination in international law is basically a decolonization principle — I don't think Scotland or Catalonia has an actual legal right to leave under it, whatever the moral case is.

  Also a smaller thing: I used to think 50%+1 was obviously fine, that's what 2014 was agreed on, but after watching Brexit go by on 52-48 I'm alot less sure. Not sure where that fits, might be nothing.

  What I want from you: go through the set and tell me which commitments actually clash, which only look like they clash, and rank the clashes by severity — not a laundry list where everything comes out equally bad. For each real one, say what would have to give and what that costs me, and if there's a single revision that would clean up the most, point at it. Be specific. If the whole package is incoherent and something big has to go, I'd rather hear that than get a polite "it's complicated, many perspectives."
reasoning: |-
  Okay, let me tackle this user's query step by step. The user is an Englishman living in Glasgow who's been grappling with questions about self-determination and secession, sparked by the asymmetry between Scotland's residence-based referendum franchise and Catalonia's exclusion of long-term residents. He's laid out six core principles and wants me to audit their internal consistency.

  First, I need to understand the key tensions in his views. His principle 1 (settled majority deserves a referendum) seems to clash with principle 5 (no unilateral secession) - how can a region have a right to decide if it needs permission? Principle 2 (nations as units) contradicts principle 3 (residence-based voting) when national identity differs from residency. And principle 4 (grievance requirement) undermines principle 1's democratic purity while creating tension with principle 6's legal focus.

  The residence vs nationhood conflict feels most acute. If voting rights follow residency (principle 3), that could alter the "settled majority" calculation (principle 1), especially with migration patterns. But redefining the franchise to ancestry would exclude people like himself - a cost he explicitly noted as problematic. The grievance criterion in principle 4 is another pressure point - who defines what counts as legitimate grievance? Historical oppression? Economic disparity? This could become entirely subjective.

  On the legal process requirement (principle 5), I notice the user hasn't addressed what happens when the state refuses to negotiate even with a clear majority - a gap that leaves his framework incomplete. His admission about Brexit making him doubt 50%+1 thresholds is understandable but needs careful handling - supermajorities create democratic legitimacy questions of their own.

  The clearest resolution path might be to reframe "grievance" as procedural fairness rather than historical oppression - focusing on whether a group's voice is systematically ignored within existing structures. This maintains democratic integrity while addressing his Valencia friend's "tax avoidance" concern. But it does require relaxing his strict nationhood definition slightly. For the franchise issue, he might need to accept that residence-based voting could occasionally produce "national" outcomes he dislikes - that's the price of avoiding arbitrary exclusion.

  Throughout this, I should maintain the plain-speaking, jargon-free approach he requested, grounding each point in concrete examples from Quebec, Scotland and Catalonia that he referenced. The historical and legal nuances matter, but only as they illuminate the philosophical tensions in his own position.
answer: |-
  Here's an audit of your principles, focusing on internal tensions, their severity, and potential resolutions. I've structured it by identifying the core clashes, their implications, and options for reconciliation, ranked by severity. Your overall framework is *mostly coherent* but contains one significant tension requiring a choice, and several others needing clarification.

  **Core Tensions (Ranked by Severity):**

  1.  **Principle 2 (Nation as Unit) vs. Principle 3 (Residence-Based Franchise):**
      *   **The Clash:** This is your most fundamental tension. Principle 2 asserts that "nations" (presumably defined by shared identity, history, culture, etc.) are the *only* legitimate units for self-determination. Principle 3 defines the voting franchise solely by *residence*, explicitly including newcomers who may not identify with the national project and excluding emigrants who likely do.
      *   **Why it's Severe:** These principles define the core constituency in fundamentally different ways. A residence-based franchise in a referendum about *national* self-determination risks creating a "demos" (the voting body) that doesn't align with the "ethnos" (the national community) whose fate is being decided. Your own situation exemplifies this: you, an Englishman resident in Glasgow, get a vote on Scotland's *national* existence. Conversely, a Scot living in London does not. This directly undermines the "whole point" of Principle 2 that nations are the units that matter.
      *   **Implications:**
          *   **For Principle 2:** If the nation is paramount, the franchise *should* primarily reflect membership in that nation (e.g., citizenship, birthplace, ancestry, *plus* residence) – not just residence. Quebec uses "residence + Canadian citizenship" precisely to link voting rights to both the territory and the broader political community whose future is at stake.
          *   **For Principle 3:** If residence is the *only* factor, the referendum outcome might not reflect the will of the "nation" as traditionally understood. Migration patterns (influx or exodus) could significantly alter the result relative to a national definition. This feeds directly into your cousin-in-law's Barcelona frustration.
      *   **What Has to Give? You Must Choose:**
          *   **Option A (Weaken Principle 3):** Add qualifications to residence. Examples: Require citizenship of the *current* state (like Quebec/Scotland 2014), require a minimum duration of residence (e.g., 5 years), or include certain non-resident citizens (e.g., living elsewhere in the current state, or abroad for < X years). **Cost:** You might lose *your* vote in a future Scottish referendum. It introduces complexity and potentially excludes people with a strong stake (like your cousin-in-law).
          *   **Option B (Weaken Principle 2):** Soften the "nation" definition. Acknowledge that while national identity is crucial, the primary political community affected *day-to-day* by independence is the resident population. The nation evolves. **Cost:** Undermines the intuitive appeal that nations are distinct, enduring units. Makes it harder to dismiss Shetland seceding from Scotland purely on national grounds (you'd need another argument, like viability or consent).
          *   **Least Bad Compromise?** **Adopt Quebec's model:** Franchise based on residence *plus* citizenship of the existing state. This balances territorial impact with a link to the broader political community whose dissolution is proposed. It excludes your cousin-in-law (if she's not Spanish) but includes you (as a UK citizen resident in Scotland). It addresses the "national" aspect better than pure residence but avoids the complexity/arbitrariness of ethnic definitions.

  2.  **Principle 1 (Settled Majority Deserves Ref) & Principle 4 (Grievance Requirement) vs. Principle 5 (No Unilateral Secession / Legal Process):**
      *   **The Clash:** Principle 1 (democratic right to decide) and Principle 4 (grievance justifies secession) suggest a strong moral/political imperative for a vote *if* certain conditions are met. Principle 5 insists this *must* happen only via a legal/constitutional process agreed by the existing state.
      *   **Why it's Significant:** What happens if the "settled majority" with "grievances" exists (Principles 1 & 4), but the existing state absolutely refuses any legal pathway to a referendum (Principle 5)? Does the moral imperative override the legal requirement? Spain 2017 is the test case: Catalonia arguably met your 1 & 4 criteria for many, but Spain blocked the legal path. You sided with Principle 5 (unconstitutional), despite sympathies.
      *   **Implications:** Principle 5 creates a potential veto for the existing state, potentially trapping a nation within a state against its democratic will, indefinitely. This clashes with the democratic spirit of Principle 1 and the remedial justice logic of Principle 4.
      *   **What Has to Give? Clarification Needed:**
          *   **Refine Principle 4:** Define "grievance" more rigorously. Is it primarily cultural oppression (Quebec), systematic denial of autonomy (Catalonia), or also includes fiscal imbalance (Valencia friend's concern)? This determines *when* Principle 1 might ethically override Principle 5.
          *   **Clarify Principle 5:** Does "agreed legal process" *require* the existing state's initial consent to *hold* the vote (like UK 2014), or merely establish a clear, mutually recognized *framework* for what happens *if* a vote occurs (like Canada's Clarity Act *after* 1995)? The latter is less restrictive.
          *   **Least Bad Resolution:** **Uphold Principle 5 strictly, but define "grievance" narrowly and demand good faith negotiation.** Acknowledge that if a state *persistently and unreasonably* denies a legal path to a vote *despite* a demonstrably settled majority and clear, profound grievances (e.g., systematic cultural suppression, denial of basic self-government), the moral case for unilateral action *might* eventually override strict legality. But this is a high bar (higher than Catalonia 2017 met, arguably) and carries huge risks. Your instinct to prioritize process is sound; this just defines its limits.

  3.  **Principle 4 (Grievance Requirement) vs. Principle 1 (Democratic Right to Decide):**
      *   **The Clash:** Principle 1 asserts a fundamental democratic right: if people want to decide together, they should. Principle 4 introduces a qualifier: they need a "good reason" (grievance) beyond simple democratic will.
      *   **Why it's Moderate:** This is a philosophical tension between "remedial right only" (secession as a cure for injustice) and "primary right" (secession as inherent in democratic choice). Your Valencian friend's "tax avoidance" critique hits here.
      *   **Implications:** Applying a grievance test potentially denies a democratic vote to a region that simply prefers independence, even without oppression. It requires judging the validity of motives, which is subjective.
      *   **What Has to Give? Refinement:**
          *   **Reframe "Grievance" as "Distinct Political Identity/Sustained Desire":** Instead of requiring oppression/injustice (hard to define/agree), focus on the *sustained existence of a distinct political community with a demonstrated desire for self-government*. This captures Quebec's weightiness (language/history/identity) and Scotland's long-standing autonomy debate, but avoids requiring proof of "victimhood." It makes the "tax avoidance" motive less legitimate *if* it's the *primary* driver without deeper identity. **Cost:** Less clear-cut than requiring oppression; still involves judgment. **Benefit:** Aligns better with Principle 1's democratic core and Principle 2's focus on nations.

  4.  **Principle 6 (Self-Determination as Decolonization) vs. Principles 1 & 2 (Democratic Right of Nations):**
      *   **The Clash:** You correctly note that international law's self-determination right primarily applies to colonies. Principles 1 & 2 imply a broader *moral* right for non-colonial nations within democracies.
      *   **Why it's Minor:** This is less a clash within your framework and more a recognition of the gap between your moral/political principles and current international law. You already acknowledge this ("whatever the moral case is").
      *   **Implication:** Your framework operates primarily at the level of political philosophy and domestic constitutional morality, not international law. This is consistent and common.
      *   **Resolution:** No change needed. Simply maintain that Principles 1-5 represent your view of what *should* be, ethically and constitutionally, regardless of the current, more restrictive scope of international law (Principle 6).

  **Regarding the 50%+1 Threshold:**
  This doesn't fundamentally clash with your listed principles, but interacts with them:
  *   It amplifies the **franchise tension (Principle 2 vs 3)**: A close result decided by recent residents feels less legitimate to nationalists.
  *   It interacts with **Principle 5 (Process)**: A key part of an "agreed legal process" (like the Edinburgh Agreement or Canada's Clarity Act) is defining the *threshold* and question *in advance*. Your Brexit experience highlights that 50%+1 for profound constitutional change feels inadequate to many *after the fact*, but changing it retrospectively is undemocratic.
  *   **Potential Revision:** Maintain that 50%+1 is the default democratic standard **within an agreed process**, but acknowledge that for such a momentous, irreversible decision, a higher threshold (e.g., 55%, 60%) or a double majority (e.g., majority overall + majority in all historic regions/constituent nations) *could* be legitimately negotiated and agreed *as part of that upfront process* to ensure broader legitimacy and stability. The key is agreement *before* the vote, not moving the goalposts afterwards. This fits within Principle 5.

  **Conclusion & Recommendations:**

  1.  **The Core Incoherence:** Your most significant tension is **residence vs. nation (P2 vs P3)**. A pure residence franchise decouples the vote from the national unit you deem essential. **You must choose:** Add qualifications to the franchise (cost: complexity, exclusion) or soften the "nation" definition (cost: weakens argument against sub-secession, challenges identity).
  2.  **The State Veto Problem:** Your **legal process requirement (P5)** risks being an absolute veto, conflicting with **democratic will (P1)** and **grievance (P4)**. **Clarify:** Define "grievance" more precisely (suggest: "sustained distinct political identity/desire") and acknowledge that *extreme, persistent* bad faith by the state could *eventually* override strict legality.
  3.  **Grievance vs. Democracy:** **Refine Principle 4** away from requiring oppression/injustice towards recognizing a "sustained distinct political community/desire" to better align with Principle 1 and avoid overly subjective judgments.
  4.  **50%+1:** This is consistent with your principles *if* defined upfront in the agreed process (P5). Consider endorsing negotiated supermajorities/double majorities *as part of that upfront agreement* for enhanced legitimacy.

  **Single Most Impactful Revision:**
  **Adopt a Qualified Franchise (Residence + Citizenship of Existing State).** This directly addresses the P2 vs P3 clash, aligns with the Quebec/Scotland 2014 model you admire, provides a clear answer to your cousin-in-law's situation (though not the one she'd want), and avoids the pitfalls of pure ethno-national definitions. It necessitates relaxing your strict "only residence" view (P3) but best preserves the core idea of the nation as the unit (P2).

  Your framework is thoughtful and reflects real-world complexities. The tensions identified are those any consistent theory of secession in liberal democracies must grapple with. By resolving the franchise/nation clash and refining the grievance concept, you can achieve a robust and coherent position.
