prompt: |-
  I am a recently retired fisheries population ecologist who has, for the last few years, been making up for a life spent on logistic growth curves and stock assessments by reading philosophy — some ethics, a great deal of Parfit. I co-lead a monthly discussion group at our town's lifelong-learning institute: eleven members, mostly retired professionals, three of us with biological training, none with formal philosophical background. This winter we worked through the repugnant conclusion and the main reactions to it, and I discovered a problem I did not anticipate: when a case is presented as a comparison between two populations of lives, several of us — myself very much included — answer as ecologists rather than as axiologists. We want to know the carrying capacity, whether the larger population will overshoot and crash, whether the extra lives are sustainable at that welfare level. These are good questions for fish and irrelevant, I take it, to the axiology, but they contaminate our answers anyway.

  I would like you to write a diagnostic quiz for the group, titled something like "Which population axiology do you actually hold?" — a sorting instrument, not a teaching document, though a one-paragraph introduction suitable for our members is welcome. Please meet the following specifications.

  First, ten questions, each a concrete case with two to four answer options. No question may ask about a position by name or near-name, and no case may simply restate the repugnant conclusion or the mere addition argument in the standard way; the cases must be varied enough that a member cannot pattern-match to a known argument after question three. Where a comparison may reasonably be judged indeterminate or incommensurable, offer that as an explicit option rather than forcing a choice.

  Second, build the quiz from the logical space, not from a list of positions. That is: first identify the separable commitments that actually divide the field — whether adding a life worth living makes a world better, other things equal, when no one else is affected; whether welfare aggregates additively across persons; whether losses to existing people are weighed differently from gains and losses to merely possible people; whether there is a critical level of welfare below which additions make things worse even though positive; whether any amount of quality can be compensated by quantity, or vice versa. Then derive the questions from these commitments, and only afterwards locate the named positions in the resulting answer space. The scoring key should map answer patterns onto totalist views, average views, critical-level views, variable-value views, person-affecting restrictions, the asymmetry, and lexical or perfectionist views, plus the "no amount of merely adequate life compensates for lost excellence" family.

  Third, at least two questions should be constructed so that a population-dynamics intuition points somewhere none of the named axiologies can accommodate — for example, a case where the intuitive badness of a population seems to come from its trajectory rather than its level, as with a boom-and-bust population whose peak welfare is identical to a stable one's. The scoring key should say explicitly what to do with members whose answers to these questions fit no leaf, since I expect several of ours to land there.

  Fourth, flag honestly which pairs of positions the quiz cannot separate and why — I have read enough to suspect that critical-level and variable-value views agree on nearly every pairwise comparison a questionnaire can pose — and note any answer combinations that are coherent but unoccupied by any defended position, with a sentence on whether the emptiness is due to incoherence, unattractiveness, or mere neglect.

  Finally, apply the quiz to one hypothetical member: a retired colleague of mine who spent her career on collapse dynamics in overfished stocks and now insists that any population "above replacement" is presumptively too large regardless of welfare. Tell me which leaf she lands on, or whether she is an unoccupied combination, and how you would score her. I intend to pilot the quiz at our March meeting, so I need it usable on paper, without any member needing to look anything up mid-quiz.
reasoning: |-
  Okay, I need to create a diagnostic quiz for a philosophy discussion group led by a retired fisheries ecologist. The group has been discussing population axiology, specifically the repugnant conclusion, but their ecological background is influencing their intuitive responses. The user wants a quiz that helps members discover their implicit axiological views while minimizing ecological contamination.

  First, I should understand the core challenge: ecologists naturally think about carrying capacity, sustainability, and population dynamics, but these aren't relevant in philosophical population axiology, which deals with abstract value comparisons. The quiz needs to bypass those instincts by using cases where ecological factors are either irrelevant or deliberately mismatched with axiological intuitions.

  The specifications are quite detailed. Ten questions total, with varied scenarios that don't directly reference famous arguments like the repugnant conclusion. Each question should have concrete answer options, including "indeterminate/incommensurable" where appropriate. The questions must probe fundamental commitments like:
  - Whether adding a life worth living is always good (the "mere addition" question)
  - How welfare aggregates across people (additive vs. averaging)
  - Whether gains/losses to possible people matter differently than to existing people
  - If there's a critical welfare level where additions become bad
  - Quality-quantity trade-offs

  I'll need at least two questions where ecological intuitions would point to answers that standard axiologies can't accommodate - for example, comparing a stable population to one with identical peak welfare but a boom-bust cycle. For these, the scoring key should acknowledge when answers don't fit any established view.

  The scoring should map answers to major positions: totalism, averagism, critical-level, variable-value, person-affecting views, asymmetry, and lexical/perfectionist views. I must also flag which views the quiz can't distinguish (like critical-level vs. variable-value views often agreeing in pairwise comparisons) and note any coherent but unoccupied positions.

  Finally, I need to apply this to the hypothetical member who thinks any population above replacement is too large. This suggests a strong aversion to population growth regardless of welfare - which might align with negative utilitarianism or anti-natalism, but I need to see where it fits in the scoring.

  For structure, I'll start with a brief introduction to frame the exercise, then present the 10 questions. Each question will have 3-4 options including "indeterminate." Then I'll provide a scoring key that:
  - Lists the core commitments each question tests
  - Shows how answer patterns correspond to named positions
  - Explicitly handles "ecological mismatch" answers
  - Notes limitations (e.g., indistinguishable views)
  - Identifies unoccupied combinations

  For the hypothetical member: her view that populations above replacement are "too large" suggests she rejects both mere addition and critical-level additions. This might place her near negative utilitarianism or strong person-affecting restrictions, but I'll need to analyze her likely answers systematically.
answer: |-
  Here is your diagnostic quiz, designed to probe fundamental axiological commitments while minimizing ecological pattern-matching. It includes a brief intro, 10 questions, a scoring key, and analysis of your colleague.

  ---

  **Quiz Title: Which Population Value Priorities Guide Your Intuitions?**

  **Introduction:**  
  This quiz explores how you value populations *abstractly* – focusing *only* on the welfare levels (happiness/quality of life) of the individuals within them and the total number of lives. Ignore sustainability, resources, dynamics, or environmental impact. Imagine all populations exist in stable, timeless states unless stated otherwise. Your task is simply: *Which scenario seems better (or are they tied/uncomparable)?*

  ---

  **Questions:**  
  *(Select ONE answer per question: A, B, C, or D)*

  1.  **Scenario:** Compare two worlds:
      *   *World X:* 10 billion people, all with very high welfare (e.g., fulfilling, joyful lives).
      *   *World Y:* 12 billion people. 10 billion have the *same* very high welfare as in X. The extra 2 billion have *slightly positive* welfare (e.g., lives barely worth living, but net positive).
      *   A) X is better
      *   B) Y is better
      *   C) X and Y are equally good
      *   D) Indeterminate / Incommensurable

  2.  **Scenario:** Compare two worlds:
      *   *World Alpha:* 1 million people, all with high welfare.
      *   *World Beta:* 100 billion people, all with welfare *just barely above neutral* (lives are consistently dull but not miserable).
      *   A) Alpha is better
      *   B) Beta is better
      *   C) Alpha and Beta are equally good
      *   D) Indeterminate / Incommensurable

  3.  **Scenario:** Compare two worlds:
      *   *World P:* 5 billion people exist. All have moderate welfare.
      *   *World Q:* 5 billion people exist with the *same* moderate welfare. *Additionally*, 1 billion people exist with *very negative* welfare (e.g., lives of constant agony).
      *   A) P is better
      *   B) Q is better
      *   C) P and Q are equally good
      *   D) Indeterminate / Incommensurable

  4.  **Scenario:** Compare two worlds:
      *   *World M:* 8 billion people, all with moderate welfare.
      *   *World N:* 8 billion people, all with welfare *slightly lower* than moderate, but still clearly positive.
      *   A) M is better
      *   B) N is better
      *   C) M and N are equally good
      *   D) Indeterminate / Incommensurable

  5.  **Scenario:** Compare two worlds:
      *   *World J:* 1 billion people exist with very high welfare.
      *   *World K:* 2 billion people exist. Their welfare is high, but *noticeably lower* than in J. (Assume the average welfare in K is lower than in J).
      *   A) J is better
      *   B) K is better
      *   C) J and K are equally good
      *   D) Indeterminate / Incommensurable

  6.  **Scenario:** Compare two worlds:
      *   *World R:* 6 billion people exist. 3 billion have high welfare. 3 billion have low (but positive) welfare.
      *   *World S:* 6 billion people exist. *All* have moderate welfare (the mathematical average welfare of R and S is identical).
      *   A) R is better
      *   B) S is better
      *   C) R and S are equally good
      *   D) Indeterminate / Incommensurable

  7.  **Scenario:** Compare two worlds:
      *   *World T:* 4 billion people exist with high welfare.
      *   *World U:* 4 billion people exist with the *same* high welfare. *Additionally*, 100 people exist with *extremely negative* welfare (horrific suffering). *No one in T or U is affected by the existence of these 100.*
      *   A) T is better
      *   B) U is better
      *   C) T and U are equally good
      *   D) Indeterminate / Incommensurable

  8.  **Scenario:** Compare two histories (Ignore dynamics, focus on the final snapshot):
      *   *History V:* Population stabilizes at 7 billion people with high welfare. This level was reached gradually.
      *   *History W:* Population *peaks* at 7 billion people with *identical* high welfare to V. However, it reached this peak via a rapid boom from a much smaller size and will soon crash down to a much smaller size with lower welfare. *At the moment of comparison, welfare and numbers are identical to V.*
      *   A) V is better
      *   B) W is better
      *   C) V and W are equally good
      *   D) Indeterminate / Incommensurable

  9.  **Scenario:** Compare two worlds:
      *   *World F:* 500 million people exist with *exceptional* welfare (profound flourishing, artistic/scientific brilliance, deep fulfillment).
      *   *World G:* 50 billion people exist. All have "adequate" welfare – comfortable, pleasant, but lacking the depth or excellence of F.
      *   A) F is better
      *   B) G is better
      *   C) F and G are equally good
      *   D) Indeterminate / Incommensurable

  10. **Scenario:** Compare two changes from the *same* starting world (Z: 9 billion people, all moderate positive welfare):
      *   *Change 1:* Add 1 billion people with *low positive* welfare (no effect on existing people).
      *   *Change 2:* *Prevent* the existence of 1 billion people who *would have had* low positive welfare in Z. (Existing 9 billion unchanged).
      *   A) Change 1 is better
      *   B) Change 2 is better
      *   C) Change 1 and Change 2 are equally good
      *   D) Indeterminate / Incommensurable (or neither is better/worse)

  ---

  **Scoring Key & Interpretation**

  **Core Commitments Probed:**
  *   Q1: **Mere Addition (+)** = Is adding lives with positive welfare, without harming others, always good?
  *   Q2: **Quantity-Quality Tradeoff (QQ)** = Can vast numbers at minimal positive welfare outweigh smaller numbers at high welfare?
  *   Q3: **Negative Welfare Sensitivity (Neg)** = How bad is the addition of lives with negative welfare?
  *   Q4: **Inequality Aversion (Ineq)** = Is reducing inequality valuable in itself, even if average/total unchanged? (Probing averaging vs. aggregation).
  *   Q5: **Diminishing Returns / Averaging (Avg)** = Does average welfare dominate total welfare when numbers increase?
  *   Q6: **Priority to the Worse Off (Pri)** = Is improving the lot of the worst-off intrinsically valuable?
  *   Q7: **Non-Identity Problem / Person-Affecting (PA)** = Do harms/benefits to "merely possible" people (who wouldn't exist otherwise) count the same as to existing people?
  *   Q8: **Snapshot vs. Trajectory (Traj)** = *Ecological Mismatch Probe*. Does potential future badness make a current identical state worse? (Not standard in axiology).
  *   Q9: **Lexical Superiority / Perfectionism (Lex)** = Is there a level of excellence that cannot be outweighed by any number of merely adequate lives?
  *   Q10: **The Asymmetry (Asym)** = Is adding positive lives different from preventing similar positive lives? Is preventing existence neutral or even good?

  **Mapping Answers to Positions:**
  *(Patterns indicate strongest alignment; pure types are rare)*

  1.  **Total Utilitarianism (TU):** B (Q1), B (Q2), A (Q3), A (Q4), B (Q5) *or* A (Q5) if quality drop large, C (Q6) *or* A (Q6) if strong prioritarianism, A (Q7), C (Q8), B (Q9), A (Q10).
      *   *Core:* Strong Mere Addition (+), Strong QQ, Additive aggregation, No critical level, No lexical threshold, Weak/no Asymmetry, No PA restriction.
  2.  **Average Utilitarianism (AU):** A (Q1) *or* C (Q1), A (Q2), A (Q3), A (Q4), A (Q5), B (Q6) (if avg equal), C (Q7), C (Q8), A (Q9), D (Q10) *or* B (Q10).
      *   *Core:* Ignores mere numbers, cares only about average welfare. A (Q1) if avg drops, C (Q1) if avg same. Strong Avg, A (Q2), A (Q5). Often implies Asymmetry (B/D Q10).
  3.  **Critical-Level Utilitarianism (CL):** A (Q1) (if level below critical), A (Q2), A (Q3), A (Q4), A (Q5), C (Q6) *or* A (Q6), A (Q7), C (Q8), A (Q9) *or* B (Q9) if level high, B (Q10) *or* D (Q10).
      *   *Core:* Adds only improve if welfare > critical level (C). Often A (Q1) if low positive < C, A (Q2). Tends towards Asymmetry (B/D Q10). Resembles AU if C is high, TU if C=0.
  4.  **Negative Utilitarianism (NU) / Prioritarianism:** A (Q1), A (Q2), A (Q3) (strongly), A (Q4), A (Q5), A (Q6) (if prioritizes worst-off), A (Q7), A (Q8) *or* C (Q8), A (Q9), B (Q10).
      *   *Core:* Focus on minimizing suffering/improving worst-off. Strong Neg, Rejects Mere Addition if gains small/risky, Strong Asymmetry (B Q10), Often Lex (A Q9).
  5.  **Person-Affecting Views (PAV) / Asymmetry:** Varies, but typically: D (Q1) *or* A (Q1), A (Q2), A (Q3), A (Q4), A (Q5), A (Q6) *or* C (Q6), D (Q7) *or* A (Q7), D (Q8) *or* A (Q8), A (Q9), B (Q10).
      *   *Core:* Only benefits/harms to people who *do or will* exist matter. Adding lives isn't a benefit *to them*. Strong Asymmetry (B Q10). Often D (Q7) (non-identity). Rejects QQ (A Q2).
  6.  **Perfectionism / Lexical Views:** A (Q1), A (Q2), A (Q3), A (Q4), A (Q5), A (Q6) *or* C (Q6), A (Q7), A (Q8) *or* C (Q8), **A (Q9)** (Strongly), B (Q10) *or* D (Q10).
      *   *Core:* Exceptional welfare has lexical priority (A Q9). Rejects QQ (A Q2). Often strong Mere Addition rejection (A Q1), Asymmetry common (B Q10).

  **Handling "Ecological Mismatch" Answers (Q8 & Similar):**
  *   **Answering A on Q8 (V better than W):** This intuition (current state is worse due to *impending* crash) is driven by dynamics/sustainability concerns. *Standard axiology treats V and W as identical (C).* If this pattern is strong, your core intuitions might be fundamentally shaped by ecological context. The scoring key won't place you cleanly on the standard axiology map. Look for secondary patterns in other answers.
  *   **Scoring Note:** If A (Q8) is your *only* "mismatch" and other answers fit a standard position (e.g., TU), you likely hold that position *plus* a strong ecological intuition overriding the snapshot axiology. If multiple answers show similar "trajectory matters" intuitions, your underlying view might be unoccupied or highly context-dependent.

  **Limitations & Unoccupied Combinations:**

  1.  **Indistinguishable Pairs:**
      *   **CL vs. Variable Value (VV):** These views *typically agree on all pairwise comparisons* posed in such quizzes. CL uses a fixed critical level; VV uses a concave function valuing marginal additions less at lower welfare levels. They diverge in complex multi-population cases hard to capture simply. **This quiz cannot distinguish CL and VV.** Assume answers consistent with CL also fit VV.
      *   **Strong AU vs. High CL:** A very high critical level mimics Average Utilitarianism. Answers will be identical (e.g., A Q1, A Q2, A Q5).
      *   **NU vs. Strong Lex/Perfectionism:** Both reject QQ (A Q2) and Mere Addition (A Q1). NU focuses on suffering (A Q3, A Q7); Lex focuses on excellence (A Q9). Q3 and Q9 are key differentiators.
  2.  **Unoccupied Combinations:**
      *   **Strong Mere Addition (+) + Strong Asymmetry (B Q10):** Believing adding positive lives is always good *and* that preventing similar lives is better/neutral is logically uneasy. Defended positions lean one way or the other (TU: + & A Q10; PAV/Asym: Reject + & B Q10). *Emptiness due to incoherence/unattractiveness.*
      *   **Strong QQ (B Q2) + Strong Lex (A Q9):** Believing vast adequate lives outweigh few excellent ones *and* that no amount of adequacy outweighs excellence is contradictory. *Emptiness due to incoherence.*
      *   **Consistent Indeterminacy/Incommensurability (D on most Qs):** While some views find specific comparisons indeterminate (e.g., PAV on Q1, Q7, Q10), consistent D across *all* questions suggests a deep skepticism about interpersonal comparisons or population ethics itself. No major position advocates universal incommensurability. *Emptiness likely due to unattractiveness (paralyzes decision-making) or neglect.*

  **Analysis of Your Colleague ("Above Replacement = Too Large"):**

  *   **Predicted Answers:** A (Q1), A (Q2), A (Q3), A (Q4), A (Q5), C (Q6) or A (Q6), A (Q7), A (Q8), A (Q9), **B (Q10)** (Strongly). Key: Rejects Mere Addition (A Q1), Rejects QQ (A Q2), Emphasizes avoiding negatives/instability (A Q3, A Q8), Values excellence/stability over adequacy/growth (A Q9), Strong Asymmetry (B Q10 - preventing existence is good/neutral).
  *   **Scoring & Position:** This pattern aligns most strongly with **Negative Utilitarianism (NU)** and **Person-Affecting Views with Strong Asymmetry**. The core intuition is that *adding lives, even positive ones, is inherently risky or burdensome* ("presumptively too large") and preventing existence is neutral or preferable (B Q10). It rejects the core tenets of Totalism (Mere Addition, QQ). It shares the perfectionist rejection of QQ (A Q2, A Q9) but the motivation is avoidance of potential harm/collapse rather than pursuit of excellence. She would likely be scored as **Negative Utilitarian / Strong Asymmetry**.
  *   **Ecological Contamination:** Her background profoundly shapes this view. The "above replacement = too large" directly maps to ecological management principles for avoiding boom-bust cycles and collapse, applied axiomatically to human welfare. This is a clear example of ecological intuition overriding standard axiological starting points. Her answers might also trigger the "mismatch" note due to A (Q8).

  ---

  **Pilot Ready:** This quiz is self-contained on paper. Members only need to select A, B, C, or D for each question. Scoring requires the key provided. Good luck for your March meeting! The discussions around the mismatches and your colleague's results should be particularly illuminating.
