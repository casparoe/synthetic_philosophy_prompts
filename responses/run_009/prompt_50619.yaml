  Breaking down defeaters:  
  - **Empirical issues** are probably the strongest test. Competence hypothesis (source matters) directly challenges MEU’s core premise. Ellsberg reversal for low-probability gains is awkward but maybe salvageable.  
  - **Formal flexibility** is a double-edged sword—if MEU can rationalize *anything*, it loses predictive power. Must cite Epstein’s critique.  
