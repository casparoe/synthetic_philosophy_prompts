  First, I need to unpack their core argument: they see ambiguity aversion as normatively justifiable when reliable probabilities are unavailable, with MEU providing a rigorous framework (evaluating acts by worst-case scenario over a set of plausible priors). Their request is unusually systematic—they want a "map" of counterarguments ranked from fatal to awkward, covering empirical patterns, formal results, and normative violations. 

