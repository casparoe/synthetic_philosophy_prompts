  (1) Species-typical capacities view - can it avoid arbitrariness? 
  (2) Relational/contract models - can they include all humans without gerrymandering? 
  (3) Anti-criterial challenge - is rejecting the demand for criteria itself legitimate? 
  (4) Disability-rights objection - does it philosophically undermine AMC or just make it rhetorically fraught?

  The user's framing suggests deep familiarity with the literature (mentioning Cora Diamond) and sensitivity to disability ethics. Their 0.4 credence vs. friend's 0.85 indicates a substantive disagreement likely rooted in meta-ethical commitments. 

  For my own credence decomposition:
  - On (1): Low probability (15%) because "normal for kind" seems circular without independent justification. Humans don't consistently apply this logic elsewhere (e.g., we don't grant moral status to comatose humans based on past capacity).
  - On (2): Moderate (40%) - relational views can explain why we prioritize humans in practice, but struggle to show why this preference isn't arbitrary when universalized. Contractarianism specifically fails infants unless stretched beyond recognition.
  - On (3): Highest sensitivity here (60%) - Diamond's point feels powerful. If ethics isn't about applying general criteria but recognizing forms of life, AMC's force dissolves. But this move risks being unhelpfully quietist.
  - On (4): Mostly rhetorical (80%) - the disability objection rightly flags AMC's dehumanizing framing, but doesn't invalidate the logic. However, it should shift how we argue.

  Combining these: My overall 0.35 credence leans heavily on (3). The user's disagreement with their friend probably lives there too - how much weight they give to Diamond-style anti-criteria approaches versus principle-based reasoning. 

  What would move my number? A compelling account of species-typicality that isn't question-begging, or a relational model that doesn't rely on speciesism by another name. McMahan's time-relative interests might nudge (2) slightly, but wouldn't resolve the core tension.

  Notably, the user seems to want this decomposed to pinpoint where their group's debate stalls. Highlighting the meta-ethical rift in (3) might be most productive for them.
answer: |-
  Here's my decomposed credence assessment, structured around your sub-questions. My **overall credence** that species membership *cannot, even in principle, ground a morally relevant difference* is **≈0.35**. Below is the breakdown, combining logic, sensitivity analysis, and your group's dynamics:

  ### Sub-Question Credences & Reasoning
  1.  **Species-Typical Capacities (Non-Arbitrariness):**  
      *   **Credence: 0.15**  
      *   **Justification:** Defining "normal" for a species is deeply vulnerable to statistical arbitrariness (e.g., why not use genus or family?) and risks circularity (we define "human normal" by what we already value). Appeals to evolutionary telos or "characteristic flourishing" struggle without importing prior moral assumptions about *which* characteristics matter. While *possible* to ground (e.g., via a robust natural law theory), it often collapses into "typical *for humans*" – which presupposes the moral significance it aims to justify.  
      *   **Sensitivity:** High. If this view could be made robust, my overall credence would drop significantly.

  2.  **Relational/Contract Views (Non-Gerrymandered Inclusion):**  
      *   **Credence: 0.40**  
      *   **Justification:** Views emphasizing social relations (e.g., care ethics, some forms of communitarianism) or indirect duties (e.g., Kantian "duties *regarding* animals") can *pragmatically* include all humans via empathy, kinship, or social entanglement. However, they struggle *philosophically* to show why these relations *must* track species lines without arbitrariness. Contractarianism (e.g., Rawlsian) notoriously fails marginal humans unless stretched (e.g., "potential contractors care about infants"). The inclusion often feels gerrymandered *in principle* – why shouldn't deep bonds with a chimpanzee count similarly? These views explain *why we do* prioritize humans, but less convincingly *why we should* in a way that excludes animals *morally*.  
      *   **Sensitivity:** Medium. A truly persuasive non-speciesist relational account could raise this credence.

  3.  **Legitimacy of Rejecting the Criterial Demand (Anti-Criterial Move):**  
      *   **Credence: 0.60**  
      *   **Justification:** Diamond/Wittgenstein-inspired critiques are potent. The AMC assumes ethics *must* be about applying general criteria (like rationality) to cases. But if morality is fundamentally about recognizing others within shared "forms of life" or responding to the "human face," the demand for a *criterion* is misplaced. We don't value infants *because* they possess property X; we value them *as human infants*. This move dissolves the "problem" by rejecting its framing. However, it risks being descriptively accurate but normatively unsatisfying ("that's just how we feel") and struggles with demanding consistency (e.g., why *not* extend this recognition to highly social mammals?). Its coherence is high, but its *justificatory power* for *excluding* animals is less clear.  
      *   **Sensitivity:** **Very High.** This is the linchpin. If this move is fully legitimate and sufficient, AMC largely fails. If it's merely a description of bias, AMC retains force. My overall credence hinges most here.

  4.  **Disability-Rights Worry (Philosophical vs. Rhetorical Harm):**  
      *   **Credence: 0.80** that it's primarily rhetorical/socio-political, not a *direct philosophical refutation*.  
      *   **Justification:** The objection powerfully highlights the AMC's dehumanizing *framing* and real-world harms of comparing marginalized humans to animals. This *should* compel extreme caution in using the argument and force refinement of language (e.g., focus on capacities directly, not comparisons). However, the *logical structure* of the AMC doesn't *depend* on dehumanization; it relies on the *premise* that marginal humans have full status *despite* lacking certain capacities. The disability critique challenges the *context and implications* of the argument, exposing problematic assumptions often smuggled in, but doesn't directly invalidate the core inference *if* the premise about marginal humans is accepted. It damages the argument's *deployment*, not necessarily its *logic*.  
      *   **Sensitivity:** Low for the core philosophical question, but critically high for whether the argument *should be used*.

  ### Combining into Overall Credence (≈0.35)
  *   The low credence on (1) and modest credence on (2) suggest weak alternatives to the AMC's challenge.
  *   The moderate-high credence on (3) is the major counterweight, acknowledging the force of rejecting the criterial framework itself.
  *   (4) doesn't significantly lower the *philosophical* probability of AMC succeeding, though it profoundly impacts its acceptability.
  *   **Weighting:** (3) > (2) ≈ (1) > (4) for philosophical impact. The weakness of (1) and (2) pushes towards accepting AMC, but the plausibility of (3) significantly counters it. My credence reflects the tension: AMC seems hard to rebut *within its own criterial framework*, but that framework might be flawed.

  ### Where Your Disagreement Likely Lives (0.40 vs. 0.85)
  Your disagreement with your friend almost certainly centers on **Sub-Question (3) - The Anti-Criterial Move**.  
  *   **Her ≈0.85 credence** suggests she finds the AMC's criterial framework compelling and sees the alternatives (1 & 2) as weak rationalizations. She likely views (3) as an evasion or insufficient justification for maintaining species-based distinctions.
  *   **Your ≈0.40 credence** suggests you find the anti-criterial move (3) significantly plausible or persuasive, granting it substantial weight in countering the AMC's demand, even while acknowledging the weaknesses of (1) and (2). The disability worry (4) might also contribute to your unease with the AMC's setup.

  ### What Would Move My Credence the Most
  A compelling argument **against the legitimacy/adequacy of the Anti-Criterial Move (3)** would most significantly increase my credence (towards your friend's view). Specifically:
  *   Demonstrating that rejecting the criterial demand inevitably leads to unacceptable moral particularism, inconsistency, or an inability to critically evaluate our own moral practices (e.g., why wasn't rejecting criteria used to defend slavery or sexism?).
  *   Showing how a Diamond-style view can *robustly justify* withholding the "human form of life" recognition from non-human animals experiencing analogous relationships or suffering *without* simply begging the question or relying on sentiment.

  Conversely, a **strong, non-arbitrary defense of Species-Typical Capacities (1)** (e.g., a convincing naturalistic account of "human flourishing" grounding moral status that isn't circular) or a **truly non-gerrymandered Relational/Contract view (2)** that excludes animals on principled grounds *not* ultimately reducible to species membership would decrease my credence (towards your view). A persuasive argument that the disability objection (4) *does* fundamentally invalidate the logic (not just the rhetoric) of the AMC would also decrease it.
