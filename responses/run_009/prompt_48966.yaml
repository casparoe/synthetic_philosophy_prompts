prompt: |-
  I've just taken over a four-person analytics unit inside a regional transportation authority. Our job is to attach probability estimates to decisions that are irreducibly singular: whether a specific bridge retrofit finishes before the viaduct closure permit expires, whether ridership on a new ferry route hits the business case threshold in year two, whether the named contractor on a tunneling job defaults mid-project. Whenever a number goes out, we fight about which past projects to average over — the ones of similar size, similar geology, similar procurement type, or simply everything the authority has ever built. Two of my analysts say the fight is arbitrary and we should average over everything and let conditioning on the specific facts do the work; one refuses to average at all and insists each project is unique enough that the exercise is theater. I gather philosophers call this the reference class problem. Please turn whatever in that literature is actually usable into a procedure my team can run in an afternoon on a single estimate: the questions to ask in order, what counts as a sufficient answer to each, when the procedure is permitted to output a range instead of a point, where it stops and hands the decision to a named human because the question is one of judgment rather than method, and where it should say outright that no defensible class exists and we report that instead of a number. Then run it on two cases: the bridge retrofit against its deadline, where the closest matches are few but favorable, and the contractor default question, where the class we would want to use contains almost no members. Include at least one case where the procedure yields an answer management will not want to hear — for instance, if it shows the business case number came from a cherry-picked class and the honest range straddles the go/no-go threshold, sending the decision back to the politicians. Be explicit about what the procedure cannot fix, especially the fact that whoever chooses the class largely chooses the number.
reasoning: |-
  We are facing the reference class problem: how to choose the appropriate set of past projects to base our probability estimate for a singular future event.

   The core idea is to use a procedure that is systematic and transparent. We will break it down into steps, each with specific questions to answer. The procedure must acknowledge that the choice of reference class is inherently judgmental, but we can structure the judgment to be defensible.

   Proposed Procedure:

   Step 1: Define the event
     - Clearly state the event for which we are estimating the probability.
     - Example: "The bridge retrofit finishes before the viaduct closure permit expires."

   Step 2: Identify candidate reference classes
     - Brainstorm a list of potentially relevant reference classes. These can be based on:
          - Project type (e.g., bridge retrofits, tunneling projects)
          - Size (e.g., budget, duration)
          - Location/geology
          - Procurement method
          - Contractor characteristics (e.g., size, past performance)
          - Time period (to account for changes in regulations, economy, etc.)
     - Also, consider the broadest class: all projects the authority has ever done.

   Step 3: Assess the relevance of each candidate class
     - For each candidate class, ask:
          (a) What is the theoretical or empirical reason to believe that this class is relevant to the event?
          (b) How many past instances are in this class? (We need a minimum sample size to be meaningful. Let's set a threshold: at least 10 instances for a point estimate? Fewer might be acceptable for a range, but we must be cautious.)
          (c) What is the frequency of the event occurring in this class? (If the class is too small, we might not be able to compute a frequency.)

   Step 4: Check for homogeneity within classes
     - We need to check if the candidate class appears homogeneous with respect to the event. We can do this by:
          - Looking at the variance of outcomes within the class. If outcomes are very different, the class might be too broad.
          - Considering if there are known sub-classes that might be more homogeneous. If so, we might want to use a narrower class.

   Step 5: Consider the trade-off between sample size and relevance
     - We want a class that is relevant (so the projects are similar to the one at hand) and large enough to give a stable estimate.
     - If the most relevant class (e.g., bridge retrofits in similar geology) has too few instances (say, less than 10), we have two options:
          (a) Use a broader class (e.g., all bridge retrofits, or even all construction projects) and then adjust the estimate based on specific factors (conditioning). This adjustment requires expert judgment.
          (b) Report a range of probabilities based on the most relevant class and the broader class(es). We might also use a weighted average of the frequencies from different classes, with weights based on perceived relevance.

   Step 6: When to output a point estimate vs. a range
     - Output a point estimate if:
          - We have a reference class with at least 10 instances and we judge it to be highly relevant and homogeneous.
          - We have a class that is not too small (e.g., at least 5 instances) and we can supplement with expert adjustment (then we report the adjusted point estimate with a note about the adjustment).
     - Output a range if:
          - The reference classes we consider plausible yield substantially different frequencies, and we cannot decide on one. Then we report the min and max from the plausible classes.
          - We have a small sample (less than 10) and we are not comfortable with a point estimate. We might use the observed frequency as the center of a wide interval (e.g., using a confidence interval for a binomial proportion) or simply state the observed frequency and the range of frequencies from broader classes.

   Step 7: When to stop and hand over to a named human
     - If after Step 5 we still have no class that meets our minimum criteria (e.g., no class with at least 5 instances, or the classes are too heterogeneous and we cannot form a reasonable estimate), then we declare that no defensible reference class exists and we do not produce a number.
     - Alternatively, we might have a situation where the available data is too sparse and the event is too unique. Then we hand the decision to a named expert (with their credentials) and they provide a subjective probability. We document the reasons.

   Step 8: When to report that no defensible class exists
     - If we cannot find any class that is both relevant and has a minimum number of instances (we might set the minimum at 5, but ideally 10), and we do not have an expert who can credibly adjust, then we report that we cannot provide a defensible probability.

   Step 9: Acknowledge the inherent subjectivity
     - The procedure must document the chosen reference class and the rationale. It must also note that the choice of class is a judgment call and that alternative classes were considered.

   Now let's run the procedure on two cases.

   Case 1: Bridge retrofit against its deadline
     - Event: The specific bridge retrofit finishes before the viaduct closure permit expires.
     - Candidate classes:
          Class A: All bridge retrofits in the last 10 years (n=15)
          Class B: Bridge retrofits in similar geology (n=3)
          Class C: All construction projects (n=200)

     Step 3: 
          Class A: Relevant because same type of project. Frequency: 12 out of 15 finished on time (80%).
          Class B: Highly relevant because of similar geology. Frequency: 3 out of 3 finished on time (100%). But n=3 is too small for a point estimate.
          Class C: Less relevant because includes many different types. Frequency: 160 out of 200 finished on time (80%).

     Step 4: 
          Class A might be homogeneous enough? We can check: in the 15 bridge retrofits, 12 on time, 3 late. The reasons for being late were diverse? If we have data, we might see if geology played a role. If the 3 late were in difficult geology and our current project is in similar geology, then Class A might be too broad.

     Step 5: 
          We have Class B (n=3, 100%) and Class A (n=15, 80%). The geology of the current project is similar to the 3 in Class B. However, Class B is too small. We might use Class A but condition on geology: we note that in Class A, projects in difficult geology (like our current one) had a lower on-time rate (say, 2 out of 3 in difficult geology were on time, so 67%). But note: we only have 3 in difficult geology? Then we are back to a small sample.

     Step 6: 
          We might report a range. The most optimistic is 100% (from Class B) and the most pessimistic is 80% (from Class A) or 67% (from the difficult geology subset of Class A). But note: the current project is in geology that we have classified as difficult? Then we might take the 67% as a point estimate? But n=3 is too small.

          Alternatively, we can use a Bayesian approach: start with the overall on-time rate (80%) and update with the difficult geology data. But without going into complex modeling, we might report: 
              "Based on all bridge retrofits: 80%. Based on the three most similar (same geology): 100%. However, due to the small sample size in similar geology, we recommend a range of 60% to 100%."

          But note: we are required to produce a single estimate? Then we might average the two: (80% * weight1 + 100% * weight2). How to weight? We could weight by sample size: (15 * 80% + 3 * 100%) / 18 = (12 + 3) / 18 = 15/18 ≈ 83.3%. But this downplays the geology factor.

          Alternatively, we might give more weight to the geology factor. This is where judgment comes in.

