answer: |-
  ### Reference Class Problem: Practical Procedure for Your Team  
  The reference class problem arises when choosing which historical data to use for probability estimation of singular events. The key is to balance data-driven objectivity with necessary judgment, ensuring transparency. Below is a step-by-step procedure, designed for efficiency (executable in an afternoon), followed by application to your cases.  

  ---

  #### **Step-by-Step Procedure**  
  **Goal**: Assign a probability (or range) to a singular event using historical data, or flag when no defensible estimate exists.  

  1. **Define the Target Event**  
     - **Question**: What is the specific binary outcome? (e.g., "Bridge retrofit finishes before permit expires.")  
     - **Sufficient Answer**: A clear, unambiguous definition. If the event is too vague (e.g., "project success"), redefine it.  
     - **Stop if**: The event cannot be operationalized → Hand to a named human (e.g., project director) for judgment.  

  2. **List Candidate Reference Classes**  
     - **Question**: What groupings of past projects could inform this event?  
     - **Sufficient Answer**: 3–5 classes based on:  
       - *Similarity* (e.g., project type, size, contractor, geology).  
       - *Data availability* (e.g., "all bridge retrofits," "projects with Contractor X").  
       - *Broadest class* (e.g., "all authority projects").  
     - **Output**: A table of classes with sample sizes.  

  3. **Assess Class Adequacy**  
     - **Question**: Does this class have enough *relevant* data?  
     - **Criteria**:  
       - **n ≥ 10**: Suitable for a point estimate.  
       - **5 ≤ n < 10**: Output a range (see Step 5).  
       - **n < 5**: Class is insufficient; reject unless no alternatives exist.  
     - **Stop if**: All classes have n < 5 → Output: "No defensible class; judgment required." Assign to a named expert.  

  4. **Calculate Frequencies & Homogeneity**  
     - **Question**: What is the event frequency in each class? Are outcomes homogeneous?  
     - **Sufficient Answer**:  
       - Compute frequency: `# successes / n`.  
       - Check variance: If outcomes vary wildly (e.g., 0% vs. 100% in sub-groups), the class is too heterogeneous.  
     - **Stop if**: Extreme heterogeneity (e.g., no pattern in outcomes) → Reject the class.  

  5. **Select Class & Output Estimate**  
     - **Question**: Which class best balances relevance and robustness?  
     - **Decision Rules**:  
       - **Point Estimate**: Use if:  
         - One class has n ≥ 10 and high relevance (e.g., "bridge retrofits in similar geology").  
         - **Output**: Frequency (e.g., "80%").  
       - **Range**: Use if:  
         - Multiple plausible classes exist (e.g., frequency varies across classes).  
         - Single class has 5 ≤ n < 10.  
         - **Output**: Min–max of frequencies from valid classes (e.g., "60–90%").  
       - **No Estimate**: Use if:  
         - All classes fail Steps 3–4.  
         - **Output**: "Insufficient data; no defensible estimate."  

  6. **Document Rationale**  
     - **Requirement**: Justify the chosen class/rejection of others (e.g., "Class A rejected due to low n; Class B selected for high similarity").  
     - **Transparency Note**: Explicitly state: "Probability sensitive to class choice; alternative classes would yield [X]%."  

  ---

  ### **Application to Your Cases**  
  #### Case 1: Bridge Retrofit vs. Deadline  
  - **Event**: "Retrofit finishes before permit expires."  
  - **Candidate Classes**:  
    - `A`: Similar geology/size (n=4; 4 on-time → 100%).  
    - `B`: All bridge retrofits (n=15; 12 on-time → 80%).  
    - `C`: All infrastructure projects (n=100; 70 on-time → 70%).  
  - **Procedure**:  
    1. Class `A` has n<5 → **Reject** (too few).  
    2. Class `B` has n≥10 → **Point estimate: 80%**.  
    3. **But**: Class `A` (100%) is closest but unusable → **Output range: 80–100%** (reflecting favorable closest matches).  
    4. **Rationale**: "Class B chosen for robustness. Favorable small-sample matches (Class A) suggest higher probability, but n too low for point estimate."  
  - **Unwelcome Truth**: If management wants >85% certainty, the range (80–100%) **straddles the threshold** → Decision reverts to politicians.  

  #### Case 2: Contractor Default  
  - **Event**: "Named tunneling contractor defaults mid-project."  
  - **Candidate Classes**:  
    - `A`: Same contractor (n=0 → reject).  
    - `B`: Contractors with similar size/financials (n=3; 1 default → 33%).  
    - `C`: All tunneling projects (n=20; 0 defaults → 0%).  
    - `D`: Industry-wide default rate (n=1000; 50 defaults → 5%).  
  - **Procedure**:  
    1. Classes `A`–`C` have n<5 or n=0 → **Reject**.  
    2. Class `D` (industry data) is the only option → **But** it ignores authority-specific factors (e.g., procurement rules).  
    3. **Output**: "No defensible class. Authority-specific data insufficient; industry rate (5%) may not apply."  
    4. **Hand to Named Human**: E.g., CFO to assess contractor’s financials qualitatively.  

  ---

  ### **What the Procedure Cannot Fix**  
  1. **Subjectivity in Class Choice**:  
     - Whoever defines the reference class controls the probability. For example:  
       - "All projects" → 70% chance of default.  
       - "Projects with this contractor" → 0% chance.  
     - **Mitigation**: Require team consensus on classes upfront and document alternatives.  

  2. **Small Samples**:  
     - n<5 classes force reliance on judgment or external data (which may not apply).  

  3. **Non-Representative History**:  
     - Past data may not reflect current risks (e.g., climate change, supply-chain issues).  

  4. **Expert Bias**:  
     - Named humans may override data optimistically/pessimistically. Mandate disclosure of rationale.  

  ---

  ### **Key Takeaways**  
  - **In One Afternoon**: Focus on rapid class identification, frequency calculation, and consensus. Use pre-built templates for consistency.  
  - **When to Say "No"**: If data is absent or classes are arbitrary (e.g., n<5), **do not force a number**—escalate.  
  - **Accountability**: Always name:  
    - The person selecting the class.  
    - The expert providing judgment.  
    - The politician owning the decision if probabilities straddle thresholds.  

  This procedure ensures defensibility while acknowledging the reference class problem’s irreducible subjectivity. By prioritizing transparency and rejecting untenable estimates, your team builds credibility—even when delivering unwelcome news.
