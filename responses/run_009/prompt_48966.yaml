    6. Decide on output:
          - Point estimate: if a class has at least 10 instances and is judged highly relevant and homogeneous.
          - Range: if multiple classes are plausible and yield different frequencies, or if the sample is small (5-9) and we want to reflect uncertainty.
          - If no class has at least 5 instances and we cannot form a reasonable estimate, then we either hand to an expert or report that no defensible class exists.
    7. If we use an expert, document the expert's name and rationale.
    8. Always document the chosen class and the rationale, and note the subjectivity in the choice.

   What the procedure cannot fix:
     - The choice of reference class is inherently subjective and can heavily influence the result. We must be transparent about the alternatives considered.
     - The procedure does not eliminate the problem that the reference class choice can be cherry-picked. To mitigate, we require the team to list multiple classes and justify the chosen one.
     - Small samples will lead to wide ranges and uncertainty.

