              Class D: 5% (industry, but not specific to our authority's conditions)
              Class E: 50% (n=2)

          We might decide that Class E is the most relevant but too small. We then look at Class B and adjust for project size? We note that in Class B, the one default was on a large project. Then for large projects in Class B, the default rate might be 1 out of 3 (33%). But again, n=3.

          We are in trouble. We might have to use a combination: anchor on the industry rate (5%) and adjust upward because the project is large and the contractor is new to us? But how much? 

          We might report a range: from 0% (our own tunneling projects) to 50% (our own large tunneling projects). But note: our own data might be too limited.

     Step 7 and 8: 
          We might not have a defensible class. We have very limited data on contractor defaults, especially for large tunneling jobs. We might report:

            "We do not have sufficient data to produce a defensible probability. The available data points to a range of 0% to 50%, but the sample sizes are very small. We recommend seeking an expert opinion from a tunneling risk specialist."

          Then we hand it to a named human (e.g., an external consultant with experience in contractor defaults in tunneling).

          Alternatively, we might use industry data (5%) but note that our project is larger than average and adjust to 10%-15%? But that's judgmental.

     Conclusion for Case 2:
          We output: "No defensible reference class exists. We report a range of 0% to 50% based on very limited and potentially unrepresentative data. We strongly recommend supplementing with expert judgment."

