   Summary of the procedure:

    1. Define the event.
    2. List candidate reference classes (at least 3-5).
    3. For each class, record:
          - Relevance reasoning
          - Number of instances
          - Frequency of the event
    4. Check homogeneity: if a class has a high variance in outcomes or clear subgroups, consider splitting.
    5. If the most relevant class is too small, consider:
          a) Using a broader class and adjusting (judgmentally) for the specific factors.
