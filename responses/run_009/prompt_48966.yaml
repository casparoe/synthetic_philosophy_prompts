          We are not in a situation of no data. We have data, but it's mixed. We might hand over to a named human (e.g., the project manager with 20 years of experience) to adjust the 80% based on the fact that the geology is difficult. They might say: "In difficult geology, I think the on-time rate is 60%." Then we report 60%.

