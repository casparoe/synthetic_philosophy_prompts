answer: |-
  Here's a restatement of the counterfactual vs. interventionist debate in your operational vocabulary, followed by a residue report structured as requested. I'll be uncompromising about mismatches.

  ### Translation: Philosophical Theories in Epidemiological Terms
  **Counterfactual Theory (Lewis-Style):**  
  Causation is defined by comparing what *did* happen to what *would have* happened in a hypothetical scenario where the suspected cause was absent, under conditions as similar as possible to reality except for the cause and its downstream effects. This "closest possible world" is like assuming perfect **exchangeability** for the counterfactual state—not just on measured confounders, but on *all* relevant factors, including unmeasured or unknown ones. If the outcome differs, causation exists.  

  **Interventionist Theory (Woodward/Pearl):**  
  A cause is something that, if you *intervened* to change it (ideally via **randomization**), would change the outcome—holding all other variables fixed at the moment of intervention (like **adjusting** for confounders *pre-intervention*). The `do`-operator formalizes this: `P(outcome | do(treatment))` ≠ `P(outcome | do(no treatment))`. Crucially, the cause must be **manipulable** (even if only hypothetically)—it’s not causation if you can’t "grab the knob."

  ---

  ### Residue Report: What Maps, Distorts, and Vanishes
  #### I. Clean Mappings to Your Vocabulary
  1. **Counterfactuals ≈ Potential Outcomes Framework**  
     - Your "outcome under alternative assignment" *is* the counterfactual. Philosophers formalize the logic; epidemiologists operationalize its estimation.  
     - **Overlap:** Both require well-defined exposures and outcomes.  

  2. **Interventions ≈ RCTs / Natural Experiments**  
     - The `do`-operator directly mirrors **randomized trials**. Natural experiments approximate interventions when randomization isn't feasible (e.g., **instrumental variables** leveraging quasi-random variation).  
     - **Causal Effects:** Both define effects as *differences* under intervention vs. counterfactual.  

  3. **Confounding Adjustment ↔ Holding Fixed**  
     - "Controlling for SES" maps to both:  
       - *Counterfactual:* Ensures groups are comparable (exchangeable) on confounders.  
       - *Interventionist:* Isolates the effect of *only* the manipulated variable.  

  #### II. Distorted Mappings (Bent Concepts)
  1. **"Closest Possible World" vs. Exchangeability**  
     - **Your View:** Exchangeability is assessed via **measured confounders**, **stratification**, or **propensity scores**. Residual confounding is acknowledged but bounded by sensitivity analyses.  
     - **Lewis's View:** "Closeness" is a metaphysical similarity metric over *entire worlds* (e.g., minor physical differences > major miracles). This has no empirical counterpart.  
     - **Distortion:** Lewis's criterion is *global and uncheckable*; your exchangeability is *local and testable* (e.g., balance diagnostics). Philosophers debate "which" world is closest; you care whether confounders *observed here* are balanced.  

  2. **Manipulability as a Constraint**  
     - **Your View:** Manipulability is *pragmatic* (RCTs are gold standard) but not absolute (e.g., you report hazard ratios for smoking).  
     - **Interventionist View:** Manipulability is *definitional*. "Smoking causes cancer" only makes sense if we can imagine intervening on smoking (holding genetics fixed).  
     - **Distortion:** For you, non-manipulable causes (e.g., "being female causes longer life expectancy") are still causally interpretable via **adjustment**. For interventionists, these are merely associations unless tied to a hypothetical intervention (e.g., gender reassignment).  

  #### III. Vanished Concepts (No Counterpart in Your Work)
  1. **Backward/Simultaneous Causation**  
     - Philosophers debate if causes *must* precede effects (e.g., can a future event cause a past one?). Your work assumes temporal priority: exposures precede outcomes in **trial timelines**, and lagged effects are modeled.  

  2. **Ontology of Causation**  
     - The question of whether causation is "in the world" (e.g., physical mechanisms) or "in the model" (e.g., DAGs) has no traction for you. You use **mechanistic evidence** (Bradford Hill) and **replication** to anchor claims in reality, but your *methods* are model-dependent.  

  3. **Lewis's Similarity Metric**  
     - The "closest world" machinery (e.g., weighing similarities of laws, facts, history) has *no operational analog*. Unlike **exchangeability**, it can’t be checked with data. It’s a metaphysical justification for counterfactuals, not a tool.  

  ---

  ### Where the Residue Points: Implications
  1. **Missing Vocabulary?**  
     - No. Your toolkit is optimized for *inference*, not metaphysics. Exchangeability, not "world similarity," drives design.  
     - **Exception:** The interventionist focus on manipulability *exposes a hidden norm*: Your field prioritizes causes that could inform policy/behavior (e.g., "stop smoking" over "have different genes"). This isn’t a gap—it’s a strength.  

  2. **Less Substantive Than It Looks?**  
     - Partly. At the *estimation level*, both theories converge:  
       - Counterfactual → Potential outcomes → Causal effect.  
       - Interventionist → `do`-calculus → Causal effect.  
     - The key divergence (manipulability) reflects *purpose*, not truth: Interventionists demand causes be "actionable"; counterfactualists allow broader ontological claims.  

  3. **Ignorable Abstraction?**  
     - Yes, for daily work. Lewis’s possible worlds don’t help you **stratify** data or detect **confounding**. But Woodward’s manipulability *clarifies why RCTs are privileged*: They directly test interventions.  

  4. **Manipulability: Insight or Limitation?**  
     - **Insight:** It captures why your sources say "correlation ≠ causation" *and* why they demand **plausible interventions**. "The laws of physics cause orbits" isn’t rejected because it’s false—but because it’s *not useful for decision-making*. Your sources are implicitly interventionist when identifying *causes worth reporting*.  
     - **Not a Limitation:** For epidemiology/public health, this focus is apt. You’re not studying planetary orbits; you’re identifying levers for improving health.  

  ### Bottom Line  
  Your vocabulary lacks nothing essential. The philosophical debate is a **meta-commentary**:  
  - **Counterfactualists** justify *why* we compare treated/untreated states.  
  - **Interventionists** constrain *which* comparisons matter (actionable causes).  
  The residue (metaphysical similarity, backward causation) vanishes because it doesn’t help you design a study, adjust for SES, or warn readers about residual confounding. What remains—the focus on *what-if* scenarios under manipulation—is already hardwired into your work. When your sources say "smoking causes cancer," they’re invoking both: a counterfactual (lung cancer rates if no one smoked) *and* an intervention (stop smoking). The philosophers are formalizing your instincts.
