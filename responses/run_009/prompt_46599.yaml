prompt: |-
  I've been reading about Arrow's impossibility theorem and I want to test it against a real case rather than the toy examples in textbooks, because I genuinely can't tell whether the theorem actually *explains* anything that happened or whether it's just a nice way of redescribing it afterwards. The case I have in mind is the 2009 Burlington, Vermont mayoral election, and I'd like a proper two-way analysis: theory illuminating case, case testing theory.

  Let me lay out the facts as I understand them so we're on the same page (correct me if I get something wrong): Burlington had adopted instant-runoff voting in 2005. In 2009 the incumbent Bob Kiss, a Progressive, ran against Democrat Andy Montroll, Republican Kurt Wright, and a few minor candidates. Wright got the most first-choice votes, but nobody had a majority, so the lower candidates were eliminated and their votes transferred; eventually Montroll was eliminated and his transfers put Kiss over the top, so Kiss won. The kicker is that in the ballot data Montroll was the Condorcet winner — head-to-head, he beat both Kiss and Wright. And a lot of voters apparently concluded the system had produced a "wrong winner," because the next year Burlington repealed IRV by referendum (by a few points, if I remember right) and went back to plurality.

  So here's what I want. First, do the careful mapping: what in this episode is the "social welfare function" or "social choice rule" Arrow's theorem is actually about, who/what counts as the "voters" and the "individual orderings," and which axiom gets violated where. I take it the natural read is an independence-of-irrelevant-alternatives violation — the presence of Wright (or the eliminated minor candidates) in the race changed whether Kiss or Montroll won — but I want you to be precise about which comparisons break IIA and whether Arrow's setup even applies directly, since IRV selects a single winner rather than producing a full social ranking. If you think the honest mapping goes through a cousin theorem instead of Arrow itself, say so and explain the difference.

  Second, tell me what the theorem genuinely explains about the public reaction. Burlington voters repealed the system after seeing the Condorcet winner eliminated — does Arrow (or the surrounding social choice literature) actually predict or account for that reaction, or does it turn out that the impossibility result was mostly irrelevant to why people were mad? Was the outrage really about a violated axiom, or about something the axioms don't capture?

  Third — and this is the part I care about most — tell me where the model breaks down. Arrow's theorem is silent about a lot of things that mattered here: procedures, runoffs, campaigning, the fact that the electorate then got to *vote on the voting rule itself*. And there's what looks like a bitter irony: they repealed IRV and reinstated plurality, a method that fails IIA far more routinely and produced spoiler problems for decades. Does the theorem say anything that helps explain that choice, or does the episode show that the popular lesson people draw from Arrow ("every voting system is broken, so nothing matters") is exactly wrong — that the axioms were doing real work in shaping which failure voters could see and which they couldn't?

  Don't be gentle with the theorem. If the honest conclusion is that Arrow's impossibility theorem is basically a red herring for this episode and the Condorcet criterion is what did all the real explanatory work, I want to hear that argued, not hedged. But if you do think Arrow earns its keep here, tell me specifically what it explains that nothing else in the social choice toolbox does.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving deep into Arrow's impossibility theorem using the 2009 Burlington mayoral election as a case study. The user wants to see how well the theorem explains the real-world outcome versus just being a theoretical exercise. 

  First, I need to map the election elements to Arrow's framework. The social choice rule here is IRV, which selects a single winner. Arrow's theorem requires a full social ordering, which IRV doesn't provide. That's a hitch right away. The voters are the Burlington electorate, each with their individual rankings of candidates. 

  The key point is IIA violation. Wright's presence altered the outcome between Kiss and Montroll. Under IRV, eliminating Montroll first led to Kiss winning, but head-to-head, Montroll beat both. So Wright acted as an irrelevant alternative whose inclusion changed the result. That's textbook IIA violation. But since IRV isn't a social welfare function, it's more accurately a failure under the IIA criterion adapted for single-winner systems.

  Next, explaining public reaction. The outrage was about the Condorcet winner losing, not directly about IIA. Voters saw Montroll as the rightful winner who lost due to vote-splitting. Arrow's theorem didn't cause the repeal; the violated Condorcet criterion did. The theorem might've provided academic context, but the visceral reaction was about perceived fairness.

  Where the model breaks down is crucial. Arrow's axioms don't account for dynamic elements like campaigning or the meta-vote on the voting system itself. Voters repealed IRV because its failure was visible—Condorcet violation is tangible. Plurality's flaws (like spoilers) are more accepted as "normal politics." The irony is that reverting to plurality, which fails IIA constantly, shows voters prioritized avoiding visible IRV failures over theoretical flaws. Arrow's theorem didn't predict this; real-world politics did.

  The user cares whether Arrow adds value here. Honestly, the Condorcet criterion did the heavy lifting in explaining outrage. Arrow's contribution is framing the trade-offs: no system satisfies all desirable properties. But for Burlington, the lesson was about specific failures, not impossibility per se. The repeal shows voters can distinguish between system flaws—rejecting IRV's clear failure while accepting plurality's chronic issues.
answer: |-
  Here's a rigorous analysis of the 2009 Burlington mayoral election through the lens of Arrow's theorem and social choice theory, addressing your core questions without hedging:

  ### 1. Mapping the Case to Arrow's Framework
  - **Social Choice Rule**: Instant-Runoff Voting (IRV) is the rule mapping individual preferences (rankings) to a single winner. Arrow's theorem formally applies to *social welfare functions* (producing full social orderings), not single-winner rules. However, IRV's sequential elimination can be interpreted as generating a partial social ordering. The violation is best analyzed using the *spirit* of Arrow's axioms applied to single-winner systems.
  - **Voters & Individual Orderings**: Burlington's electorate (≈10,000 voters) submitted ranked ballots. Each ballot represents a complete, transitive individual ordering (e.g., Montroll > Wright > Kiss).
  - **Violated Axiom**: **Independence of Irrelevant Alternatives (IIA)** is unambiguously violated.
    - *How IIA is Broken*: 
      - Consider the subset {Kiss, Montroll}. Montroll was the Condorcet winner (beat Kiss head-to-head 58.9% to 41.1% in pairwise comparisons).
      - Under IIA, the social choice between Kiss and Montroll should depend *only* on voters' rankings of these two.
      - But Wright's presence altered the outcome: When Wright (the irrelevant alternative) is included, IRV eliminates Montroll first due to lower *first-choice* support (despite Montroll's pairwise strength), triggering transfers that elect Kiss.
    - *Formal IIA Failure*: The social preference between Kiss and Montroll *reversed* based on the inclusion/exclusion of Wright and minor candidates. Arrow requires that if every voter's relative ranking of Kiss vs Montroll remains identical, the social ranking of this pair shouldn't change when other options are added/removed. IRV fails this.

  ### 2. What Arrow Explains (and Doesn't) About Public Reaction
  - **What It Explains**:
    - Arrow's theorem (and its cousins like the **Gibbard-Satterthwaite theorem**) explains why *no voting system is immune to paradoxes*. Burlington witnessed a failure inherent to *all* non-dictatorial systems. This wasn't an IRV-specific flaw but a universal trade-off.
    - The violation of IIA directly corresponds to the **"spoiler effect"** voters observed: Wright's presence changed the winner between Kiss and Montroll. Arrow formalizes why such effects are inevitable.

  - **What It Doesn't Explain**:
    - **The outrage was driven by the violated Condorcet criterion, not IIA**. Voters intuitively grasped that Montroll (beating all others head-to-head) "should" win. Arrow's axioms don't prioritize the Condorcet criterion—it's just one of many desirable properties systems sacrifice. Public anger fixated on a *specific* failure (Condorcet loser winning), not the abstract IIA violation.
    - **The repeal referendum wasn't about axioms**—it was about perceived legitimacy and simplicity. Voters rejected IRV because its failure was *visible and counterintuitive*, not because they contemplated universality or IIA. Arrow provides no model for how citizens emotionally respond to electoral paradoxes.

  ### 3. Where the Model Breaks Down (and the Bitter Irony)
  - **Key Omissions in Arrow's Framework**:
    - **Procedural Legitimacy**: Arrow treats voting as a black box. In Burlington, the *process* mattered: IRV's multi-round tally obscured the Condorcet winner, while pairwise comparisons were easily understood afterward. The theorem ignores how transparency affects acceptance.
    - **Dynamic Campaigning**: Candidates adjusted strategies for IRV (e.g., Wright seeking second-choice support). Arrow's static preferences can't capture this.
    - **Meta-Choice on Voting Rules**: The electorate later voted on the system itself—a layer Arrow cannot analyze. Reverting to plurality was a pragmatic choice, not a theoretical optimization.
    - **Salience of Failures**: Plurality fails IIA routinely (e.g., Nader "spoiling" Gore in 2000), but these failures are often attributed to candidates, not the system. IRV's failure was *novel and stark*, making it a target.

  - **The Irony Explained**:
    - Arrow's theorem *doesn't* justify nihilism ("every system is broken, so nothing matters"). It reveals **trade-offs between axioms**. Burlington shows voters prioritize different axioms in practice:
      - IRV violated **Condorcet efficiency** (electing pairwise losers) and **monotonicity** (Kiss winning despite Montroll gaining support in recounts).
      - Plurality violates **Condorcet efficiency** and **IIA** constantly but satisfies **simplicity** and **familiarity**.
    - Voters repealed IRV not because it violated Arrow's axioms abstractly, but because it violated a *more salient* criterion (Condorcet) in a high-stakes election. Plurality's chronic IIA failures were deemed *less offensive* because they were familiar and blamed on "vote-splitting" rather than system design.

  ### Conclusion: Arrow's Value and Limits in This Case
  - **Arrow as Diagnostician, Not Prophet**: The theorem perfectly diagnoses the IIA violation that occurred. It explains why such paradoxes are *inevitable* under any ranked system. However, it didn't predict the repeal, nor does it explain why voters tolerated plurality's flaws.
  - **The Real Workhorse Was Condorcet**: Public outrage was fueled by the violated Condorcet criterion—a weaker condition than IIA that resonates more intuitively. Arrow provides the *theoretical context* (showing no system satisfies all desirable criteria), but the Condorcet criterion did the heavy lifting in explaining voter anger.
  - **The Lesson You Suspected Is Correct**: This episode refutes the misreading of Arrow as implying "all systems are equally bad." Voters distinguished between **types of failures**: IRV's complex, counterintuitive paradox felt less legitimate than plurality's familiar flaws. Arrow's theorem helps us see this as a choice between which axioms to sacrifice—but the axioms themselves don't determine which sacrifices voters will tolerate. Burlington chose the devil they knew, proving that *context and salience matter more than abstract impossibility* in real politics. Arrow earns its keep by exposing the trade-offs, but the social choice literature on Condorcet methods and electoral legitimacy better explains the outcome.
