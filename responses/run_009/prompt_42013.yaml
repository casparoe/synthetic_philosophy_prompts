prompt: |-
  I've been going down a philosophy of probability rabbit hole lately (the frequentism vs subjectivism vs propensity fight, plus whatever the bestial "logical probability" stuff is) and honestly before I try to pick a side I want a spec sheet first. Like, what should I be demanding of any interpretation of probability before I bother evaluating it?

  write me the desiderata: what an adequate interpretation of probability has to deliver, with the case behind each requirement, and mark which ones are non-negotiable and which are just pet causes of one camp. For purpose, fix it as: the interpretation should be good enough for a person (or an institution) deciding what to believe and how to act under uncertainty in ordinary life, not just for foundations of statistics textbooks. So everything should be judged relative to that.

  Some things I'd want on the list, though add or veto as you see fit and tell me why:

  - it has to assign coherent probabilities to single, unrepeatable events (this atom decays in the next hour, this patient survives the surgery, my marriage lasts). if an interpretation only really makes sense for repeatable trials under stable conditions, that seems like a fatal shortfall, but maybe you disagree
  - it has to say something about the reference class problem without pretending it away -- when I'm the 47-year-old with this specific tumor, which population grounds my probability?
  - it has to explain updating: when new evidence arrives, what is it that changes, and why is changing it rational? does the interpretation itself owe an account of learning, or can it borrow one?
  - it has to explain why probabilities are action-guiding at all -- why matching your credences to chances (or to frequencies, or to whatever) is supposed to pay off, especially when you only get one shot at the decision
  - and here's one I suspect is genuinely new to the list: verbalized probabilities from ML systems. when a language model says it's "70% confident" in an answer, what interpretation of probability makes that even a probability? It's not a frequency in any obvious sense, it doesn't seem to be a propensity, and the model arguably has no degrees of belief in the philosophically loaded sense. Do we need the interpretation to accommodate this kind of probability-ish output, or is that someone else's problem (calibration, measurement, whatever)? I genuinely don't know, argue it either way

  The part I care most about: flag any pairs of desiderata you suspect can't be jointly satisfied -- like whether you can have both objective single-case chances and some kind of empirical testability without smuggling in frequencies. If a subset of the list is jointly unsatisfiable, say so plainly, because then the list itself is the interesting result. Also tell me which single requirement does the most to knock out the standard contenders, and whether that requirement is a real constraint or just me smuggling in a bias.

  Then, briefly, run frequentism, subjectivism/Bayesianism, and propensity views against the list. Keep the scorecard short though -- the criteria are where the thinking is, the scoring is bookkeeping. no reading lists, I've got those.
reasoning: |-
  Okay, the user is diving deep into the philosophy of probability, trying to figure out what makes an interpretation adequate for real-life decision-making. They want a list of desiderata—essential features any good interpretation must have. Let me start by unpacking their main concerns.

  First, they emphasize single-case probabilities. Real-life decisions often involve unique events: a specific surgery, a marriage, etc. If an interpretation can't handle unrepeatable events, it's useless for their purpose. That's probably non-negotiable. 

  Next, the reference class problem. When assigning a probability to an individual, which group should you use? For instance, a 47-year-old with a specific tumor—should stats be based on all cancer patients, that age group, or tumor type? The interpretation needs to address how to choose without hand-waving.

  Then there's updating. How do probabilities change with new evidence? Bayes' theorem is a tool, but the interpretation must explain what's changing underneath—is it beliefs, physical tendencies, or something else? And why is updating rational?

  The action-guidance point is crucial. Why should aligning your beliefs with probabilities lead to better outcomes, especially in one-shot decisions? The user wants a practical justification here, not just theoretical.

  The ML angle is interesting. When an AI says it's 70% confident, what does that mean? It's not frequency or propensity. Should the interpretation accommodate this, or is it a separate calibration issue? This might be a newer challenge for traditional theories.

  The user also wants to know if any desiderata conflict. For example, can an interpretation be both objective and applicable to single cases without relying on frequencies? That might be a tension point. Also, which requirement trips up most existing interpretations? Probably the single-case one, as frequentism struggles there.

  Looking at the main interpretations: Frequentism ties probability to long-run frequencies, failing at single events and reference classes. Subjectivism handles single cases and updating via Bayes but might be too subjective. Propensity tries for objective single-case chances but struggles with reference classes and updating.

  The ML point is tricky. Subjectivism might handle it by considering the model's training, but it's a stretch. Propensity and frequentism don't fit well here. Maybe calibration is a separate issue, but the user might need the interpretation to at least make sense of such outputs.

  Conflicts might arise between objectivity and single-case applicability. Also, action-guidance requires decision-theoretic links, which some interpretations might not provide. The reference class problem might be unsolvable, requiring a pragmatic approach.

  In summary, the user needs a balanced interpretation that handles real-world uniqueness, evidence updates, justifies actions, and maybe accommodates modern tech outputs. They might be seeking a practical framework rather than a purely theoretical one, valuing applicability over philosophical purity.
answer: |-
  Here’s a distilled desiderata list for an interpretation of probability, tailored to real-world decision-making under uncertainty. I’ve marked non-negotiables (🔴), context-dependent requirements (🟡), and noted tensions where they arise. The goal is **pragmatic adequacy**: supporting belief and action in unique, high-stakes scenarios.

  ---

  ### **Core Desiderata**  
  1. **🔴 Single-case applicability**  
     - *Requirement*: Must assign probabilities to singular, unrepeatable events (e.g., "this surgery succeeds," "this war starts in 2025").  
     - *Case*: Most real-life decisions involve unique events. Interpretations limited to long-run frequencies (e.g., coin flips) fail here.  
     - *Knockout effect*: Eliminates strict frequentism.  

  2. **🔴 Reference class transparency**  
     - *Requirement*: Must explicitly address *how* to choose a relevant population for singular events (e.g., "my cancer survival probability: use all patients, my age group, or my genotype?").  
     - *Case*: Avoiding this is evasion—real agents need actionable guidance.  
     - *Knockout effect*: Propensity theories struggle (what’s the "true" reference class for a propensity?). Subjectivism handles it via judgment but risks arbitrariness.  

  3. **🔴 Updating mechanism**  
     - *Requirement*: Must explain how evidence rationally updates probabilities (e.g., Bayes’ theorem), and *what* is being updated (beliefs, chances?).  
     - *Case*: Learning from data is central to rationality. An interpretation that can’t model learning is inert.  
     - *Knockout effect*: Propensity/frequentism lack native updating tools (often borrow Bayesian machinery).  

  4. **🔴 Action-guidance justification**  
     - *Requirement*: Must explain why aligning decisions with probabilities *works* (e.g., maximizes expected utility, avoids Dutch books).  
     - *Case*: If probabilities don’t guide successful action, they’re useless pragmatically.  
     - *Knockout effect*: Frequentism struggles here (why care about long-run frequency in a one-shot decision?).  

  5. **🟡 Accommodating ML "probabilities"**  
     - *Requirement*: Should clarify if/how AI confidence scores (e.g., "70%") fit the interpretation—or concede they’re a different beast.  
     - *Case*: ML outputs increasingly inform decisions. Dismissing them as "not real probabilities" ignores practical needs.  
     - *Tension*: May conflict with objectivity; ML scores are often *calibrated frequencies*, not beliefs/propensities.  

  ---

  ### **Key Tensions & Trade-offs**  
  - **Single-case objectivity vs. testability**:  
    Propensity theories posit objective single-case chances (🔴1), but how do you *test* "this atom’s decay propensity" without invoking frequencies? Frequentism avoids this but fails 🔴1.  
    → *Likely unsatisfiable*: Truly objective single-case probabilities may be empirically untestable alone.  

  - **Reference classes vs. coherence**:  
    No interpretation "solves" the reference class problem—it’s inherently subjective or contextual. Demanding a unique right answer (🔴2) might be unrealistic.  
    → *Pragmatic fix*: Accept that reference classes involve judgment; focus on *sensitivity analysis* (how much does the choice matter?).  

  - **ML probabilities vs. metaphysical purity**:  
    Forcing ML outputs into existing interpretations might overstretch them (e.g., is an LLM’s "70%" a *belief*? A *calibrated frequency*?).  
    → *Recommendation*: Treat ML outputs as *decision inputs*, not ontological commitments. Desideratum 🔴4 (action-guidance) matters more than metaphysical fitting.  

  ---

  ### **Quick Scorecard**  
  *(🔴 = Fails, 🟢 = Satisfies, 🟡 = Partial/borrows tools)*  

  | **Desideratum**          | **Frequentism**       | **Subjectivism/Bayesianism** | **Propensity**          |  
  |--------------------------|-----------------------|------------------------------|-------------------------|  
  | 1. Single-case           | 🔴 (needs collective) | 🟢 (credences)               | 🟢 (single-case chance) |  
  | 2. Reference class       | 🔴 (assumes homogeneity) | 🟡 (prior-dependant)     | 🔴 (vague "disposition")|  
  | 3. Updating              | 🔴 (static)           | 🟢 (Bayesian conditioning)   | 🔴 (often static)       |  
  | 4. Action-guidance       | 🟡 (long-run only)    | 🟢 (Dutch books/decision theory) | 🟡 (no direct link) |  
  | 5. ML probabilities      | 🟢 (as calib. freq.)  | 🟡 (as artificial beliefs)   | 🔴 (no fit)             |  

  ---

  ### **Which Desideratum Does the Most Damage?**  
  **🔴 Single-case applicability** is the killer:  
  - Rejects pure frequentism (its core limitation).  
  - Forces propensity theories into murky metaphysics (untestable dispositions).  
  - Makes subjectivism the "default survivor" by accepting probability as *belief*.  

  But subjectivism pays a price: it leans hard on **🔴4 (action-guidance)** to justify itself and stumbles on **🔴2 (reference classes)** by making them subjective.  

  ### **The Unavoidable Trade-off**  
  You likely can’t have **all** of:  
  - Single-case objectivity,  
  - Empirical testability without frequencies,  
  - And a unique solution to reference classes.  
  Choose two. Pragmatism suggests prioritizing *action-guidance* and *updating* over metaphysical purity.  

  **Bottom line**: For *your* purpose (belief/action under uncertainty), subjectivism/Bayesianism survives best—but acknowledge its subjectivity. The list isn’t biased; it’s ruthlessly pragmatic. ML "probabilities" are a calibration problem, not an interpretive one.
