prompt: |-
  I am a junior at a public high school and the chair of our Student Council's Philanthropy Subcommittee. Each semester we disburse roughly $4,000 raised through bake sales, a dance, and a change drive, and we also decide which local organizations may table at our spring service fair. Until now, decisions have been made by whoever argues loudest, and our faculty advisor — who has to sign off on whatever procedure we adopt — has asked us to replace that with something principled.

  The problem is what "principled" should mean for us. In our philosophy club, a senior gave a presentation on a problem for consequentialism that I have not been able to stop thinking about: the idea that every action has consequences that ripple outward indefinitely, so that the total good or bad an act produces may be permanently beyond our ability to know — not merely difficult to calculate, but the kind of thing where two reasonable people tracing the same ripple can disagree about the sign of the outcome depending on where they stop counting. The examples were the unsettling kind: a famine-relief donation saves lives, but the saved lives then consume resources, emit carbon, and raise children who go on to do further things, good and bad, without end. If that is right, then even our advisor's sensible-sounding rule — do the most good you can verify — smuggles in an arbitrary stopping point, because nothing in the underlying theory says where the ripples stop mattering.

  I do not want the subcommittee to react to this by becoming paralyzed or cynical, but I also do not want us to pretend the problem away. So my request is this: turn the worry into a decision procedure that a committee of fourteen- to eighteen-year-olds can actually run in a forty-five-minute meeting, twice a semester, with no philosophy training. Specifically, I need an ordered list of questions to ask about each proposal; what counts as a sufficient answer to each question; where the procedure returns a no, or sends the proposal back for more information; and where it must hand the decision back to us because the remaining question is one of values rather than facts. Please mark those judgment points explicitly rather than hiding them inside the procedure, since we will be accused of rigging it otherwise. I would also like the procedure to say something honest about how far a member may legitimately press the cluelessness worry before it becomes a blanket objection to any decision whatsoever — one of our members now argues that every proposal is unknowable and therefore the money should just be split evenly among whatever anyone proposes, and I need a principled answer to him rather than a ruling from the chair.

  Please then run the procedure on two proposals we actually face: first, a $2,500 donation to the local food bank's weekend backpack program, which quietly feeds students at our own school; and second, a $2,500 donation to an international deworming charity that another member researched, whose pitch is that the same money helps vastly more children, just far away and in ways we will never observe. Include at least one point at which the procedure yields a result I will not like — I am on record supporting the backpack program — and say plainly where you expect the procedure to misfire or to be gamed by whoever wants a particular outcome. Please do not give us a reading list or citations; I need a document the committee can print, fold, and use.
reasoning: |-
  Hmm, the user is a high school junior leading a philanthropy committee that needs a practical decision-making framework. They're struggling with philosophical concerns about unknowable consequences raised in their philosophy club. The core tension is between wanting principled giving and avoiding paralysis from "cluelessness" — the idea that we can never truly calculate an action's total impact due to infinite ripple effects.

  Key user needs jump out: First, operational simplicity — this must work in 45-minute meetings with teenagers. Second, legitimacy — the procedure must visibly separate factual checks from value judgments to prevent accusations of rigging. Third, they need a built-in circuit breaker for the "unknowable consequences" objection that doesn't devolve into nihilism. And fourth, it must withstand real-world testing on their two competing proposals (local vs. global giving).

  The philosophical dilemma is genuine but overthinking it would sink their mission. My approach should reframe "cluelessness" not as a veto but as a reminder to focus on knowable first-order impacts. We'll borrow from effective altruism's proximate metrics while adding explicit off-ramps for value choices. The "ripples" concern gets acknowledged but contained at Step 4 with a bright-line rule: once basic verification is done, further skepticism requires specific counterevidence.

  For structure, I'll design a six-step flowchart: eligibility → needs assessment → verification → impact scale → resilience → tiebreakers. Each step has clear pass/fail thresholds and flags judgment calls with ⚖️ symbols. Crucially, Steps 2 and 5 are where values enter openly — e.g., prioritizing local visibility versus scale. The cluelessness objection gets neutralized by Step 4's requirement that objections must point to concrete harms, not theoretical paradoxes.

  Testing it on their cases: The food bank proposal will stumble on impact scale (fewer kids helped per dollar) but pass resilience (local trust networks). The deworming charity aces scale but might trigger Step 5's "sustainability" flag if supply chains are opaque. This creates the requested uncomfortable moment for the user who favors the local option. I'll warn about gaming risks too — like inflating beneficiary counts — and suggest minutes documentation as a countermeasure.

  The tone must stay actionable. No academic jargon; rules like "Don't solve the trolley problem, feed actual people" keep it grounded. By making value tradeoffs explicit rather than hidden, we turn philosophical angst into democratic choice.
answer: |-
  Here’s a decision procedure designed for speed, transparency, and principled debate—while acknowledging the "ripple problem" without letting it paralyze you. Print this as a 1-page checklist per proposal.

  ---

  **Philanthropy Subcommittee Decision Procedure**  
  *For proposals requesting funds ($) or tabling at service fair (T)*

  **Step 1: Eligibility Gate**  
  *Question:* Does this proposal align with our **written charitable purpose** (e.g., "relieve suffering" or "strengthen community" per your bylaws)?  
  ✅ *Sufficient answer:* Direct quote from proposal matching our purpose.  
  ❌ *No/Return if:* Misaligned (e.g., political campaign). *No appeal.*

  **Step 2: Needs Assessment**  
  *Question:* What **specific, immediate problem** does this address, and who is affected?  
  ✅ *Sufficient answer:* Clear description + evidence (e.g., "40 students at our school lack weekend food" from counselor data).  
  ❌ *Return if:* Vague ("helps kids") or unsupported ("we think there’s hunger").  
  ⚠️ *Judgment point (⚖️):* Is this the *most urgent* problem we can tackle? *Committee votes after all proposals are heard.*

  **Step 3: Verification**  
  *Question:* Can we **confirm** the organization exists, uses funds responsibly, and does what it claims?  
  ✅ *Sufficient answer:* 3rd-party audit, public tax filings (IRS 990), or site visit by member.  
  ❌ *No if:* Red flags (fraud allegations, no contact info).  
  ⚠️ *Judgment point (⚖️):* Is verification *good enough*? (e.g., small local org with no audit but proven track record). *Committee votes.*

  **Step 4: Impact Scale**  
  *Question:* What **measurable outcome** does $X achieve? (e.g., "feeds 1 child for 1 year" or "deworms 50 kids").  
  ✅ *Sufficient answer:* Per-unit cost breakdown from the org.  
  ⚠️ *Judgment point (⚖️):* Is this outcome **meaningful enough** relative to cost? *Committee debates/votes.*  
  ⛔ **STOP:** *Do not debate ripple effects beyond 1 year or 2nd-order consequences.* If a member raises "cluelessness" (e.g., "But what if saved kids become tyrants?"):  
     - *Allow:* 1 counter-example of a **specific, near-term harm** (e.g., "This clinic displaces local nurses").  
     - *Reject:* Theoretical, unprovable, or indefinite ripple arguments. *Chair rules out of order.*  

  **Step 5: Resilience Check**  
  *Question:* What could **go wrong**? (e.g., food spoilage, political instability).  
  ✅ *Sufficient answer:* Org’s mitigation plan (e.g., "We use non-perishables" or "Partner with local leaders").  
  ⚠️ *Judgment point (⚖️):* Is the risk **acceptable**? *Committee votes.*

  **Step 6: Tiebreaker/Balance**  
  *If funds remain or proposals are equal after Steps 1–5:*  
  ⚖️ *Committee votes on:* "Which proposal best **balances** scale, urgency, and local impact?"  

  ---

  **How We Handle "Cluelessness"**  
  - You may challenge a proposal with **evidence of probable harm** within 1 year (Step 4).  
  - You may **not** veto a proposal because "all consequences are unknowable." Infinite ripples affect *all* choices equally—including doing nothing. Splitting funds randomly is **not principled**; it ignores verified needs.  

  ---

  **Test Run: Two $2,500 Proposals**  

  **Proposal A: Local Food Bank (Backpack Program)**  
  1. **Eligibility:** ✅ (Fights child hunger).  
  2. **Needs:** ✅ ("32 students at our school identified by counselors").  
  3. **Verification:** ✅ (Food bank provides annual report + our member visited).  
  4. **Impact:** ❓ *$2,500 feeds 20 kids for 1 semester. Judgment call (⚖️):* Meaningful but lower reach than Proposal B.  
  5. **Resilience:** ✅ (School staff distribute; low risk).  
  ⚠️ *Verdict:* Passes Steps 1–3/5. At Step 4, committee must vote on whether helping 20 local kids is "meaningful enough" despite lower scale.  

  **Proposal B: International Deworming Charity**  
  1. **Eligibility:** ✅ (Prevents disease).  
  2. **Needs:** ✅ ("1.5B people have parasitic worms" per WHO).  
  3. **Verification:** ✅ (Top charity rating from GiveWell; audits public).  
  4. **Impact:** ✅ *$2,500 deworms ~2,500 children.*  
  5. **Resilience:** ⚠️ *Judgment call (⚖️):* Risk of supply-chain issues? (Answer: Partner clinics; proven in 10 countries). Committee votes.  
  ⚠️ *Verdict:* Strong on scale/verification. Likely passes UNLESS committee values local impact (Step 6) over scale.  

  **Where You Won’t Like It:**  
  If the committee prioritizes *scale* (Step 4) or *balance* (Step 6), they may choose deworming. The procedure forces you to defend local impact as a *value* (⚖️), not just a fact.  

  **Where It Could Misfire or Be Gamed:**  
  - **Gaming:** Exaggerating beneficiary numbers (Step 4). *Counter:* Require sources for per-unit costs.  
  - **Misfire:** Over-prioritizing scale, ignoring local ties. *Counter:* Step 6’s balance question.  
  - **Paralysis:** Endless Step 4 debates. *Counter:* Chair enforces 5-min limit per proposal.  

  ---  
  **Final Note:** This procedure doesn’t solve philosophy—it *contains* it. You’re not deciding the fate of civilization; you’re choosing who gets a backpack or a pill. Do that with eyes open, then go sell more cupcakes.
