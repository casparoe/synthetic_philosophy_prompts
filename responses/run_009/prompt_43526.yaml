prompt: |-
  I'm running the discussion section for a second-year course in ethical theory. The lecture the students have already had covered the sheer variety of moral codes across cultures, along with the point — which most of them absorbed — that psychology's picture of the normal moral mind was for decades built almost entirely on studies of the students' own population: Western, educated, industrialized, rich, democratic. My section is on what any of this is supposed to show about moral objectivity. The students will arrive with a half-formed syllogism — cultures disagree about right and wrong; where there is disagreement there is no fact of the matter; therefore there are no moral facts — plus, from the lecture, the unsettling corollary that even their conviction that moral questions have answers may itself be a WEIRD datum rather than a neutral vantage point. I want them to leave unable to state the syllogism without immediately asking which premise does the dying. Please design the section rather than write its content. Specifically: (1) the sequence — I suspect the distinction between disagreeing about values and disagreeing about non-moral beliefs that values ride on (about what an embryo is, what happens at death, what a promise does) has to be secured before we can even say what the anthropological record is a record of, but I can't decide whether the reflexive WEIRD point belongs at the start, as a disclaimer about our instruments, or at the end, turned on the students themselves; (2) the one carrying case — I've been considering a funerary practice in which the dead are consumed by mourners as an act of care, so that what strikes my students as desecration expresses exactly the value they think it violates — but tell me what such a case must contain and what it must not, since my worry is that a case that dissolves entirely into factual difference would teach them that all moral disagreement is just cognitive error, which is the misconception I most need to avoid; (3) the misconceptions in the order they will actually surface — the inference from disagreement to no-fact, the assumption that relativism is the only alternative once objectivism wobbles, and the astronomy analogy ("people disagreed about the shape of the earth too"), which they will produce on their own and find satisfying in a way that worries me — and where in the sequence each should be intercepted; and (4) a single question, answerable in one sentence, that would tell me whether a given student can distinguish diagnosing a disagreement from resolving one. Finally, tell me what to explicitly refuse to cover at this level — I'm inclined to exclude Mackie's argument from queerness and any self-refutation objection to relativism, but correct me if one of those is doing load-bearing work I'm not seeing.
reasoning: |-
  Okay, let me approach this systematically. The user is designing an ethics discussion section on moral objectivity after students learned about cultural variation and WEIRD biases. The core challenge is dismantling a common syllogism while avoiding misconceptions.

  First, I need to consider the sequencing dilemma. Placing the WEIRD point early creates immediate cognitive dissonance - students confront their own potential bias before analyzing others. This works better than saving it for the end because it frames the entire discussion as provisional. The anthropological data then becomes something to interpret cautiously rather than naive evidence.

  For the carrying case, endocannibalism serves well but requires careful construction. The case must show:
  - Identifiable shared value (care for the dead)
  - Divergent expression due to factual beliefs (body disposal metaphysics)
  - Avoid making factual differences exhaustive (must retain core moral divergence even if beliefs aligned)

  Timing misconception management is crucial. The astronomy analogy should be intercepted immediately when raised - perhaps even preempted by contrasting it with fundamental moral disputes. The inference from disagreement to no-fact gets challenged during the case analysis phase, while relativism alternatives emerge during the conclusion's positive framing.

  The diagnostic question needs surgical precision: "Would explaining why cultures disagree about funerary practices settle whether one is objectively better?" This tests if they distinguish explanatory anthropology from normative justification.

  Load-bearing exclusions seem correct. Mackie's queerness argument introduces metaphysical baggage premature for this stage, while self-refutation debates about relativism distract from the core goal of destabilizing naive objectivism without endorsing alternatives.

  The entire design orbits around making the syllogism collapse under its own weight through targeted cognitive dissonance rather than direct refutation.
answer: |-
  Here’s a structured design for your section, prioritizing conceptual sequencing, targeted misconceptions, and measurable outcomes:

  ### **1. Sequencing**  
  **Optimal Flow:**  
  - **Start with WEIRD disclaimer** (5 mins)  
    *Why:* Immediately destabilizes the "neutral vantage point" assumption. Frame it as: *"Before we examine cultural disagreements, let's scrutinize the lens we use—our own intuitions might be cultural artifacts."* This primes humility and avoids later defensiveness.  
  - **Core Distinction:** Values vs. Factual Premises (15 mins)  
    *Activity:* Present a *non-moral* example (e.g., "Is water poisoning the village well wrong?" → disagreement rests on factual beliefs about contamination). Contrast with a *value clash* (e.g., "Is individual liberty more important than community harmony?").  
  - **Anthropological Case Study** (20 mins)  
    Apply the distinction to your funerary practice example.  
  - **Syllogism Surgery** (10 mins)  
    Return to "disagreement → no fact" premise. Ask: *"Does the case show disagreement about values, or about facts that inform values?"*  
  - **Close with WEIRD Reflexivity** (5 mins)  
    Revisit the disclaimer: *"Could YOUR conviction that morality must be objective be WEIRD? What would that imply?"*  

  ### **2. Carrying Case: Endocannibalism**  
  **Must Contain:**  
  - A **shared core value** (e.g., "showing respect for the dead") explicitly named.  
  - **Divergent factual beliefs** (e.g., "consumption prevents decay vs. burial preserves dignity") AND an **irreducible moral commitment** (e.g., "physical unity with ancestors is obligatory" vs. "bodily integrity is sacrosanct").  
  - **Student intuition clash:** The practice should *feel* viscerally wrong to them initially.  

  **Must Avoid:**  
  - Reducing the conflict *solely* to factual error (e.g., avoid implying "if they knew biology, they’d bury bodies"). Instead, emphasize: *Even with identical facts, the moral weight given to the body may differ.*  

  **Script the Reveal:**  
  > *"When [Culture X] consumes their dead, they see it as fulfilling a duty of care—literally incorporating the loved one into the community forever. What we call ‘desecration’ is to them the ultimate act of reverence. But note: both cultures agree the dead deserve honor. The clash is over what honor demands, rooted in different beliefs about personhood and decay."*  

  ### **3. Misconception Interception Plan**  
  - **"Disagreement → No Fact"**: **Intercept during case analysis.** Ask: *"Is this disagreement evidence there's no truth, or that the truth is complex? What if both cultures are partially right?"*  
  - **Astronomy Analogy**: **Preempt during WEIRD intro.** Contrast: *"Moral disagreements aren't like flat Earth vs. round Earth—there, we shared methods to resolve it. But what shared ‘moral telescope’ do all cultures accept?"* If raised, reply: *"Does proving the Earth is round make genocide wrong? Why/why not?"*  
  - **"Relativism as Only Alternative"**: **Delay until syllogism surgery.** After undermining "no fact," posit: *"Could there be objective moral facts that are complex, context-sensitive, or beyond full human knowledge?"* Hint at pluralism/objectivity hybrids.  

  ### **4. Diagnostic Question**  
  **"If we fully understood why two cultures disagree about funerary rites, would that tell us which practice is morally better?"**  
  - **Target Answer:** "No—understanding *why* they disagree explains the difference but doesn’t resolve which norm is correct."  
    *Tests:* Ability to separate explanatory anthropology from normative justification.  

  ### **Explicit Exclusions**  
  - **Mackie’s Queerness**: Correctly excluded. Its metaphysical load distracts from the epistemic focus on disagreement.  
  - **Self-Refutation of Relativism**: Also exclude. While tempting, it’s a rhetorical trap that sidesteps deeper issues about objectivity.  
  - **WHAT TO COVER INSTEAD:** Focus solely on *diagnosing disagreements* (values/facts) and *problematizing inferences* (disagreement → no truth). Leave constructing positive theories for later.  

  ### **Why This Works**  
  - **WEIRD first** prevents students from weaponizing anthropology against objectivity until they’ve questioned their own stance.  
  - **The case** forces value-fact disentanglement *without* resolving the moral tension, making the syllogism’s first premise crumble.  
  - **Exclusions** keep the discussion grounded in the lecture’s scope while targeting the core inference.  

  You’ll know it succeeds when a student says: *"Wait—does disagreement mean there’s no truth, or that we’re missing something?"* That’s the dying syllogism.
