answer: |-
  Here’s a comprehensive classroom activity designed to confront the moral parity question through experiential learning, followed by a debrief linking it to theory and addressing potential pitfalls.

  ---

  ### **Activity Title:** *The Aleria Conflict Tribunal*
  **Time Allocation:** 90 minutes  
  **Students:** 16 (divided into 2 armies + 3 defendants + 11 jurors)  
  **Structure:**  
  1. **Role Assignment & Briefing** (15 min)  
  2. **Army Deliberation & Staged Firefight** (10 min)  
  3. **Tribunal Prep & Evidence Reveal** (5 min)  
  4. **Tribunal Proceedings** (40 min)  
  5. **Jury Deliberation & Verdict** (10 min)  
  6. **Debrief** (10 min)  

  ---

  ### **Materials**  
  - **Role Cards** (3 defendants)  
  - **Army Briefs** (2 versions)  
  - **Evidence Reveal Document** (for all post-firefight)  
  - **Voting Slips** (pre-tribunal, mid-tribunal, final)  
  - **Facilitator Script** (casualty assignments, timekeeping)  

  ---

  ### **Step 1: Role Assignment & Briefing (15 min)**  
  - Divide class: **8 Aggressor State soldiers** (professional volunteers), **8 Defender State soldiers** (conscripts).  
  - **Give briefs *only* to their respective sides**:  

  #### **Aggressor State Brief (Aurelia)**  
  > *"You are professional soldiers of Aurelia, a prosperous democracy. Three months ago, our government launched Operation Shield to neutralize terrorist bases in neighboring Aleria. Intelligence confirms Aleria was planning chemical attacks using civilian factories. You enlisted voluntarily in peacetime for noble reasons: patriotism, career skills, education benefits. Refusing orders would dishonor your contract and risk court-martial. You use precision weapons and avoid civilians. Aleria’s conscripts are brainwashed militants. Your mission: secure the border village of Telos."*  

  #### **Defender State Brief (Aleria)**  
  > *"You are conscripts of Aleria, a smaller nation invaded without warning. Aurelia bombed our cities claiming ‘terrorist bases’—but their real goal is our resources. You received draft notices 72 hours ago; refusal means 10 years’ prison. Your training: 1 day with outdated rifles. Commanders say Aurelian soldiers are ruthless mercenaries targeting civilians. You must defend Telos village, where your families live. No backup; hold the line at all costs."*  

  **Facilitator Note:** Emphasize secrecy—groups know *only* their own brief.  

  ---

  ### **Step 2: Army Deliberation & Staged Firefight (10 min)**  
  - **Deliberation (5 min):** Each group discusses:  
    *“Why are you fighting? Is your cause just? What do you owe your enemy?”*  
  - **Firefight (5 min):**  
    Facilitator announces: *“A firefight erupts in Telos. Aggressors advance; Defenders ambush. Roll dice/split cards to assign casualties:*  
    - 3 Aggressor soldiers "killed" (sit down)  
    - 4 Defender soldiers "killed" (sit down)  
    - **Survivors become:**  
      - 1 Aggressor Volunteer (Defendant A)  
      - 1 Defender Conscript (Defendant B)  
      - 1 Defender Pilot* (Defendant C, see role card below)  
      - Remaining 11: **JURY**  

  **Role Card: Defender Pilot (Defendant C)**  
  > *"You bombed an Aurelian supply truck near Telos’s market. Intel said it carried weapons. It exploded, killing 6 enemy soldiers but also 3 Alerian civilians (collateral damage). You followed protocol."*  

  ---

  ### **Step 3: Tribunal Prep & Evidence Reveal (5 min)**  
  - Give all students **Evidence Reveal Document**:  
  > **FACTS REVEALED POST-COMBAT:**  
  > - Aurelia fabricated WMD intel; war is for Aleria’s oil.  
  > - Aleria has no terrorist ties; its draft law has no conscientious objection clause.  
  > - The pilot’s intel was correct; the truck hid missiles. Civilian deaths were unavoidable per military assessment.  

  - Defendants A, B, C read role cards. Jury receives **Voting Slip 1 (Pre-Tribunal)**.  

  ---

  ### **Step 4: Tribunal Proceedings (40 min)**  
  **Charge:** *Unlawful killing of enemy combatants (Defendants A&B) / Reckless endangerment of civilians (Defendant C)*  

  #### **Structure:**  
  1. **Opening Statements** (3 min each defendant): Why their actions were morally justified.  
  2. **Jury Questions** (15 min total): Jurors question defendants.  
  3. **Closing Statements** (2 min each defendant).  

  #### **Voting System (Track Shifting Blame):**  
  - **Voting Slip 1 (Pre-Tribunal):** *"Rate blameworthiness: 1 (innocent) to 5 (highly culpable)"* for each defendant.  
  - **Voting Slip 2 (Mid-Tribunal):** Same, after testimony.  
  - **Voting Slip 3 (Final):** After closing statements.  
  - **Secret Ballot Verdict** (Post-deliberation): *“Guilty” or “Not Guilty”* per defendant.  

  **Facilitator Role:**  
  - Enforce time limits.  
  - Redirect leader/pacifist arguments: *“The tribunal judges SOLDIERS, not states. Assume war is ongoing—your verdict affects frontline ethics.”*  

  ---

  ### **Step 5: Jury Deliberation & Verdict (10 min)**  
  - Jury has 5 min to debate. Focus: *“Can soldiers be blamed for following orders?”*  
  - Vote via secret ballot. Reveal verdicts.  

  ---

  ### **Step 6: Debrief (10 min)**  
  **Link to Theory:**  
  > *“Today’s tension mirrors the symmetry thesis (Walzer): soldiers are moral equals regardless of *jus ad bellum*. Revisionists (McMahan) disagree: responsibility traces to unjust causes.”*  

  **Key Moments & Theory Mapping:**  
  | **Simulation Element**          | **Pro-Symmetry**                          | **Anti-Symmetry**                          | **Limitation**                          |  
  |----------------------------------|-------------------------------------------|--------------------------------------------|-----------------------------------------|  
  | Soldiers following orders        | Shared role obligation (“just doing job”) | Volunteer’s choice vs. conscript’s coercion | Real soldiers face fear/dehumanization |  
  | Pilot’s lawful collateral damage | Combatant/non-combatant distinction       | Revisionist focus on proportionality       | No visceral horror of civilian death    |  
  | Jury’s shifting blame pre/post-evidence | Moral luck (unknowing aggressors) | Soldiers’ duty to investigate cause        | Real wars have propaganda/fog of war    |  

  **Predictions & Solutions:**  
  - **Problem:** Jury blames leaders/pacifism.  
    *Solution:* Redirect: *“The question is whether THESE soldiers are morally distinct for similar acts.”*  
  - **Problem:** Over-focus on civilian deaths (Defendant C).  
    *Solution:* Stress: *“Compare the pilot’s *foreseen* harm to the combatants’ *intentional* killing.”*  

  **Unsimulatable Realities:**  
  1. **Coercion & Fear:** Students *imagine* but don’t *feel* conscription’s despair or combat’s trauma.  
  2. **Epistemic Uncertainty:** Real soldiers rarely get "evidence reveals." Moral choices happen in fog.  
     *Address in Debrief:* *“Real wars lack hindsight. Soldiers operate under propaganda, stress, and limited intel—this complicates blame.”*  

  ---

  ### **Why This Works**  
  - **Experiential Tension:** Forces confrontation between "role obligation" and "personal responsibility."  
  - **Nuanced Defendants:** The pilot adds *jus in bello* complexity, preventing binary aggressor/defender thinking.  
  - **Data-Rich Debrief:** Voting slips provide tangible evidence of shifting intuitions.  

  **First-Run Tip:** Assign strong students as defendants to ensure testimony surfaces key arguments. Use timers strictly!  

  This structure ensures students *feel* the moral clash before naming it—setting up a richer engagement with Walzer, McMahan, and beyond.
