prompt: |-
  Hi there — quick backstory so this makes sense. I write literary fiction, and my current novel is about two sisters who are sculptors. The younger one, Tamsin, did an MFA and reads way too much philosophy; the older one, Bea, is a stubborn craftsman type who thinks all theory is nonsense. A big scene in the book is a Thanksgiving dinner where Tamsin finally gets Bea to admit that when she squashed her old failed statue and reworked the same clay into a bust of their mother, *something* got destroyed that day — Bea insists nothing was destroyed, it's the same clay, it just got rearranged. I want this argument to actually be a real philosophical live wire, not Tamsin spouting winions (my autocorrect insists that's not a word, whatever).

  So here's what I need from you: a thought experiment built to spec, something Tamsin could actually say out loud at a dinner table. The point of the case is to test whether our statue-and-clay intuitions track the objects themselves or just the way we describe them — that's what fixes what counts as cheating. So no fair writing a case that just stipulates the verdict; it has to generate the verdicts from how normal people think.

  Specs: two scenarios, identical in every material fact — same clay, same hands, same physical process — but differing ONLY in the narrative framing of the process (one framed as reshaping, one framed as destroying and making anew), and the framing difference should be something a normal person with no philosophy background would find natural, not contrived. Both scenarios have to be realistic, present-day, no sci-fi gadgetry, no soul-swapping. Keep each scenario to one paragraph, dinner-table intelligible.

  Then walk me through the aftermath like a screen test: (1) what a coincidentalist — two objects, statue and clay, occupying the same space — should say about each framing, and where they start sweating; (2) what an eliminativist about composite objects says, and whether the case is actually good news for them for once; (3) what someone who says it's one object under two concepts says, and whether the framing difference bothers them at all. After that, tell me honestly which structural feature of the case is doing the work, what happens to the verdicts if you remove it, and how the view that comes out looking worst would fight back rather than just conceding. If it turns out the two framings DON'T actually change what anyone should say, say so — don't fake a result to make my scene dramatic. Though if you can find something Bea could throw back at Tamsin at the end, something that reframes the whole case, that would be gold.

  One more thing: my copyeditor is American and twitchy, so please write the whole answer in American English. And keep the scenarios free of philosophy jargon — that's Tamsin's job to add later, poor Bea.
