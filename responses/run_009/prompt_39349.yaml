  Hmm, this is a classic medical ethics dilemma. The user seems philosophically inclined - they're questioning the underlying theories of causation and whether the distinction is principled or convenient. Their language suggests they've thought deeply about this ("puzzling over," "foreseeably ends," "default course of events"). 

  Let me unpack their core questions: First, about causation - how can we say withdrawing a ventilator (an action) isn't killing when giving lethal drugs is? Second, about consistency - why are omissions treated differently in medical vs. bystander contexts? Third, about theoretical foundations - is this distinction philosophically sound?

  The user's clearly noticed the tension between legal/ethical frameworks and pure causality. They're right that physically, unplugging a ventilator is an act while not starting treatment isn't. But the medical ethics distinction rests on more than physics. 

  I should explain the four key pillars: causation doctrine (disease as cause), intent framework (double effect), role-specific duties, and the distinction between killing vs. allowing natural death. The malpractice point is particularly sharp - it shows how context changes the meaning of omission. 

  The user might be wrestling with personal experience or academic work. Their tone is analytical but slightly frustrated ("convenient fiction"). I should acknowledge the valid critique while explaining why the distinction persists practically. The answer should validate their observation about physical actions while showing how ethical systems operate beyond mere mechanics. 

