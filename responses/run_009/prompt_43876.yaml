prompt: |-
  I teach philosophy of science, and every second year I give the structural realism lecture, and every time I realize I don't actually know what I mean by "structure." So this term I'm trying to work backwards from my own gut verdicts about what survives theory change, and I want to know whether there's some principle that captures them — and if not, which of my verdicts has to go.

  Here are the verdicts. Fresnel's wave theory of light into Maxwell's electromagnetism: the ether stories died, the wave equation and the interference relations survived, and I say that's the clean case of structure being preserved — the standard Worrall example, and my gut agrees with it. Carnot's efficiency formula, derived back when heat was widely taken to be a conserved fluid: the fluid turned out not to exist, the formula survived untouched, and I count that as preservation too — maybe even the best case, since the ontology wasn't just incomplete but flat wrong. Phlogiston chemistry into oxygen chemistry: here I say nothing real was preserved, even though the phlogiston people had their own quantitative bookkeeping (weights lost on calcination and so on) — that carried over, but I dont want to call it structure.

  Then the pair I cant square. Lorentz's ether theory versus special relativity: observationally indistinguishable, formally near-identical, and my instinct says they're the same theory wearing different metaphysics, so the ether's funeral cost nothing structurally. Ptolemy versus Copernicus: also observationally indistinguishable at the time, but here I want to say Copernicus got the structure of the solar system right and Ptolemy got it wrong — not the same theory at all. Both pairs agree on all observations and I'm treating them differently, which smells bad.

  A couple more, since they're where I get honest. Newtonian gravity into general relativity: I say preserved, but only in the weak-field limit — the inverse-square relations survive as approximations, so maybe preservation comes in degrees and I've been pretending it's all-or-nothing. Entropy: the symbol and the equations for S survived, but the interpretation behind them kept getting swapped out — the conserved-fluid story, then Clausius, then the statistical reading — and I genuinely can't decide whether what survived was structure or just a word.

  And the case I keep going back and forth on: whether the quark and gauge structure of QCD would count as preserved if it someday turns out that quarks are emergent from something deeper. By the Carnot standard it seems yes, by the phlogiston standard it seems no, and I'd love the principle to tell me which.

  For what it's worth, my crude first pass was "what's preserved is the equations, minus the ontology," but that seems to let the phlogiston bookkeeping in, and I can't see how to keep it out without also kicking Carnot out. So: is there a principle that gets all these verdicts, or close? If two of them really can't be saved together, tell me which one you'd throw overboard and why. Then tell me what the principle predicts for a case I haven't listed — say, the wavefunction's status if some future theory keeps the Schrödinger formalism but drops the story about the 3N-dimensional configuration space. Go as slow as you need to on the Lorentz/Ptolemy pair; that's the one I actually care about.
reasoning: |-
  Okay, let me tackle this philosophy of science problem about structural realism. The professor is struggling to define "structure" consistently across theory changes, and has listed several historical cases with conflicting intuitions. 

  First, I notice the core tension: the professor wants structure to include mathematical equations (like Carnot's efficiency formula) but exclude phlogiston's quantitative bookkeeping. The Lorentz/Ptolemy contrast is particularly revealing - both involve empirically equivalent theories, but Lorentz-to-Einstein feels like structural preservation while Ptolemy-to-Copernicus feels like structural rupture. 

  Hmm... what's the difference? For Lorentz and Einstein, the mathematical formalism (Lorentz transformations) survived intact, just reinterpreted. But Ptolemy and Copernicus used completely different mathematical structures - epicycles vs heliocentric orbits. The equations didn't survive, only the predictive outputs. That suggests a criterion: structural preservation requires the mathematical relationships themselves to be retained, not just their observable consequences.

  But wait - Carnot's formula survived mathematically despite ontological error, while phlogiston's calculations were absorbed into stoichiometry. The key difference might be whether the mathematics remains fundamental. Carnot's efficiency theorem holds at the thermodynamic limit regardless of microfoundations, whereas phlogiston's bookkeeping was derivative - it described surface patterns that were later explained by deeper atomic principles.

  For the quark case: if QCD's gauge structure remains mathematically fundamental in the new theory (like Lorentz transformations in relativity), it survives. If it becomes emergent approximation (like epicycles), it doesn't. The wavefunction case would follow similar logic - if Schrödinger's equation remains exact in the new theory, its structure survives even if the configuration space interpretation changes.

  The entropy example is tricky because the equations stayed but their physical meaning shifted. This might require distinguishing mathematical structure from representational content. The equation S = k log W survived, but what "S" represents evolved - so partial structural preservation?

  I should test this on the Newton-GR case. The inverse-square law survives as approximate mathematical solution in weak fields - so graded preservation makes sense. Whereas phlogiston's calculations were not even approximately preserved as fundamental descriptions.

  The Ptolemy problem remains the hardest. Perhaps the distinction is whether the surviving mathematics still plays explanatory versus merely predictive roles. Copernicus's structure explained retrograde motion; Ptolemy's just saved appearances. But that might be too pragmatic...

  Ultimately, the professor might need to accept that structural realism isn't binary. Some cases show core mathematical structure persisting (Maxwell, Carnot, Lorentz), some show only fragmentary preservation (Newton-GR), some show complete replacement (phlogiston, Ptolemy). The quark case would depend on whether gauge symmetry remains fundamental mathematics.

  For the wavefunction: if the future theory keeps using Hilbert space and unitary evolution as fundamental machinery, that's structural preservation. If those emerge from something else (like spacetime geometry), then not.
answer: |-
  Your struggle is profoundly familiar—structural realism often feels like trying to grasp smoke. The core tension lies in distinguishing "structure" from mere formalisms or bookkeeping, especially when ontology shifts. Let me propose a principle that reconciles most of your verdicts (with one exception), then test it on your cases, including Lorentz/Ptolemy and your quark/wavefunction puzzles.

  ### The Proposed Principle: **Fundamental Representational Capacity (FRC)**
  Structure is preserved iff:
  1.  **The mathematical formalism captures invariant relations** that are **directly explanatory** of empirical patterns (not just predictive), and
  2.  **These relations retain their representational role** in the successor theory—either as exact laws or as limiting cases of deeper laws, **without relying on discarded ontology**.

  This excludes "bookkeeping" that lacks direct explanatory power (phlogiston) and distinguishes cases where formal similarities hide representational shifts (Ptolemy vs. Copernicus). Crucially, it allows degrees of preservation (Newton-GR) and handles reinterpretation (entropy).

  ---

  ### Applying FRC to Your Cases
  1. **Fresnel → Maxwell**:  
     - *Preserved:* Wave equation, interference relations.  
     - *Why?* The formalism directly explains diffraction/interference patterns. Maxwell reinterprets *what* waves *are* (EM fields vs. ether vibrations), but the relations retain their representational role. Ontology shifts, structure persists.

  2. **Carnot → Thermodynamics**:  
     - *Preserved:* Efficiency formula (η ≤ 1 - T₂/T₁).  
     - *Why?* It captures an invariant thermodynamic constraint (entropy bounds) independent of caloric fluid. The relation remains directly explanatory of heat-engine limits under reinterpretation (statistical mechanics).

  3. **Phlogiston → Lavoisier**:  
     - *Not preserved:* Weight bookkeeping (e.g., metals gaining weight on calcination).  
     - *Why?* The equations were *predictive* but not directly explanatory—they tracked surface patterns without capturing causal relations. Lavoisier's oxygen theory redefined the *meaning* of weight changes (oxidation vs. de-phlogistication), invalidating phlogiston's representational role.

  4. **Lorentz Ether → Special Relativity**:  
     - *Preserved:* Lorentz transformations, relativistic kinematics.  
     - *Why?* The formalism is identical and retains its direct explanatory role for time dilation/length contraction. SR strips the ether ontology but keeps the relations as fundamental laws. *This is structural equivalence.*  

  5. **Ptolemy → Copernicus**:  
     - **Not preserved**: Epicycle/deferent machinery.  
     - *Why?* Though empirically equivalent *at the time*, Ptolemy's formalism lacked direct explanatory power for planetary motion—it saved appearances via adjustable parameters. Copernicus’ heliocentry provided a unified explanatory framework (retrograde motion as orbital geometry). The *relations themselves* (equations for planetary positions) were not retained; only predictions were. **FRC forces you to abandon your verdict here**—Ptolemy and Copernicus do *not* share structure.  

  6. **Newton → General Relativity**:  
     - *Partially preserved:* Inverse-square law as weak-field limit.  
     - *Why?* The relation survives as an approximation of deeper geometry, retaining explanatory power in its domain. FRC allows graded preservation.  

  7. **Entropy (Clausius → Boltzmann → Shannon)**:  
     - *Preserved as structure:* The *form* of S = k log W (or equivalents) persists.  
     - *Why?* The mathematical relation remains directly explanatory of irreversibility, even as its *interpretation* shifts (thermodynamic → statistical → informational). The representational capacity endures.  

  8. **Quarks in QCD → Emergent Theory**:  
     - *Preserved iff* gauge symmetries and confinement relations remain fundamental.  
     - *By FRC:* If quarks emerge (e.g., from a stringy/composite substrate) but QCD's Lagrangian *still represents* strong-force behavior exactly (like Carnot), structure survives. If the formalism becomes approximate bookkeeping (like Ptolemy), it does not. *Your Carnot/phlogiston contrast resolves it: Carnot’s formula was *fundamental*; phlogiston’s was not.*  

  ---

  ### The Lorentz/Ptolemy Resolution
  - **Lorentz/Einstein**: Identical formalism with identical explanatory scope. The Lorentz transformations *are* the structure—they represent spacetime relations directly. Ontological surgery (ether removal) doesn’t touch the formalism’s representational role.  
  - **Ptolemy/Copernicus**: Different formalisms with different explanatory capacities. Ptolemy’s epicycles *parameterized* observations; Copernicus’ orbits *explained* them via a simpler geometric structure. No equations survived—only outputs. FRC forces Ptolemy out of the "preserved" camp.  

  **Why this doesn’t smell bad**: Structural realism isn’t about empirical equivalence—it’s about whether the *mathematical vehicles of explanation* survive. Lorentz’s math survived as fundamental; Ptolemy’s did not.  

  ---

  ### New Case: Schrödinger’s Wavefunction → Future Theory  
  - **Scenario**: Future theory keeps ψ and ∂ψ/∂t = -iĤψ formalism but drops 3N-dimensional configuration space (e.g., ψ represents a spacetime field or a density in a lower-dimensional space).  
  - **FRC Verdict**: *Structure preserved*. The formalism retains its direct explanatory role for interference, quantization, and time evolution. Only its *ontological interpretation* changes (like Maxwell’s waves or entropy). The relations still represent quantum behavior.  

  ---

  ### Which Verdict Must Go?  
  **Ptolemy**: If you accept FRC, Copernicus did *not* preserve Ptolemy’s structure—he replaced it with a new, more explanatory structure. Your instinct that "Copernicus got it right" is about *reference* (heliocentrism was true), not structural *continuity*. Structural realism cares about the latter.  

  ### Why FRC Works  
  - **Saves Carnot, kills phlogiston**: Carnot’s formula is explanatory without ontology; phlogiston’s bookkeeping was derivative.  
  - **Handles graded/partial survival**: Newton’s law as a limit; entropy through reinterpretation.  
  - **Distinguishes Lorentz/Ptolemy**: Identity vs. replacement of formalism.  
  - **Clarifies emergent cases**: Quarks preserve structure only if their formal relations remain fundamental.  

  **Caveat**: FRC leans epistemic—it prioritizes *explanatory power* over metaphysical grounding. But it mirrors how scientists actually preserve equations across revolutions. If this feels too pragmatic, your Ptolemy verdict is the price.
