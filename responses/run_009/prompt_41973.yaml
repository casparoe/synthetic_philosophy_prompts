prompt: |-
  I'm a PhD student in moral philosophy writing a dissertation chapter against the intention condition in the doctrine of double effect — the Thomist principle that foreseeing a harm as a side effect of pursuing a good can be permissible while intending that same harm is not, whatever the numbers. My problem is that the stock cases put the doctrine on the side of common intuition: everyone prefers the diverted trolley to the organ harvest. For the chapter's centerpiece I want the case in the opposite direction — one in which the doctrine, applied honestly and without hand-waving, obliges an agent to impose more harm on innocent people than even a blunt act consequentialist would.

  You are a professional moral philosopher with deep expertise in the doctrine of double effect and the literature on intended versus foreseen harm, from Foot and Thomson through Kamm and Scanlon. Think carefully, and before committing, work through at least three candidate scenarios in your head; but do not show me the scratch work. Begin the response with the finished scenario itself, in the first paragraph, with no preamble and no restatement of this brief.

  Specifications the case must meet:

  - One realistic setting — emergency management, industrial safety, public infrastructure, or the like. No trolleys, no transplant surgeons, no bombing campaigns, no demons, no perfect predictors.
  - The agent faces exactly two options, and each saves the same number of people.
  - In the first option, a small number of innocents die, and their deaths are causally necessary for the rescue: were they somehow to survive, the rescue fails. The agent genuinely aims at their deaths — sets the mechanism that kills them — rather than merely using their location, property, or bodies as an obstacle.
  - In the second option, a larger number of innocents die, but their deaths contribute nothing: the rescue would stand unchanged if, by luck, all of them survived.
  - The numbers must be far enough apart that any view that simply counts deaths selects the first option.
  - Both options must be doings, not omissions; the victims must be equally innocent, equally unidentified strangers to the agent; the time pressure and the agent's epistemic situation must be the same in both.
  - Proportionality must not dissolve the case: the good at stake must be large enough that even the second option's larger death toll passes an ordinary proportionality test.
  - The case must generate these verdicts from the theories; it must not stipulate or rig them.

  After the scenario, open the analysis with a short verdict table — theory, and which option it requires — then the reasoning for each of: act consequentialism; the classical doctrine of double effect; a means-based constraint of the sort Thomson later endorsed, on which what forbids the transplant is using a person as a means rather than intending harm as such; and the doctrine read through Kamm's distinction between harming someone as a causal means and harming them as a mere means. Identify precisely which structural feature of the case is doing the work, and say what happens to it if that feature is removed — in particular, what if the means-deaths stop being necessary, or stop being aimed at. Then give the doctrine's defender their two strongest lines of response: reframing what the agent really intends in the first option, or accepting the verdict and defending it victim-by-victim; assess which is stronger and why. Close with an honest note on whether the case is a fair test or whether it quietly rigs things against the doctrine by making the means-option strange in some independent, morally loaded way — and if it does, tell me, because a referee will.
reasoning: |-
  Okay, the user is a PhD student in moral philosophy working on a dissertation chapter against the intention condition in the doctrine of double effect (DDE). They need a thought experiment where DDE forces an agent to choose an option that causes more harm than necessary, contrary to consequentialism. The challenge is to create a realistic scenario without trolleys or transplants that meets specific criteria.

  First, the scenario must have two options saving the same number of people. Option A requires intending the death of a few as a necessary means. Option B causes more deaths as a side effect that aren't necessary for the rescue. The harm in Option B must be significantly larger so that consequentialism prefers Option A. The setting should be realistic, like emergency management.

  Considering possible scenarios: One idea involves a dam failure where diverting floodwaters requires destroying a barrier that kills people. But making their deaths necessary might be tricky. Another idea is a wildfire where creating a firebreak necessitates burning an area with people, versus a larger uncontrolled burn. Need to ensure the means-deaths are genuinely intended and necessary.

  The chosen scenario is a train carrying toxic chemicals derailing toward a town. Option A: Blow up a bridge with workers on it to block the path—their deaths are necessary to create the blockage. Option B: Divert to an alternate route that passes through a larger town, where deaths would occur but aren't necessary for the diversion. Need to ensure that in Option B, the deaths don't contribute to saving anyone.

  Checking criteria: Both options save 10,000 people. Option A kills 5 workers as intended means. Option B kills 50 people as foreseen side effect. The workers' deaths are necessary—if they survived, the bridge might not collapse properly. In Option B, if the 50 survived, the train still derails safely. Proportionality is met since 50 deaths vs 10,000 saved. 

  Now for analysis. Consequentialism prefers Option A (fewer deaths). DDE forbids Option A because it intends harm, forcing Option B (more deaths). Thomson's means-based constraint also forbids Option A as using people. Kamm's view might allow Option A if the harm isn't treating them as mere means, but here it is since their deaths are essential.

  Key structural feature: The necessity of the deaths in Option A. If not necessary, DDE might permit it. If not aimed, it might not be intended. Responses: Defenders could argue the agent intends only to collapse the bridge, not the deaths—but since the deaths are necessary, this is weak. Or they might bite the bullet and claim intending harm is always wrong regardless of numbers. The stronger response is redefining intention.

  Fairness check: The scenario might subtly rig against DDE by making Option A involve direct killing while Option B is indirect. But in real emergencies, such direct actions might be unavoidable, so it's a valid test. Referees might question if the workers' role makes them less innocent, but they're unaware and not consenting, so innocence holds.
answer: |-
  ### Scenario
  A freight train carrying pressurized tanks of acutely toxic industrial chemicals derails on elevated tracks approaching a river gorge bridge. Momentum will carry the wreckage onto the bridge in 8 minutes. If the tanks rupture there, highly soluble poison will spill directly into the river upstream of Metro's sole water intake, killing approximately 10,000 citizens within hours. The emergency controller has two viable interventions, each requiring immediate initiation:  

  **Option A:** Detonate explosives pre-emplaced on the bridge's central support (for seismic retrofitting). This collapses the bridge *before* the wreckage reaches it, causing the train to plunge into the dry gorge bed below, where tanks will rupture harmlessly. However, five civilian engineers conducting non-urgent inspections on that support *will* certainly die in the blast. Their presence on the structurally critical point is necessary for the demolition's precision; if they were absent, the blast would fail to sever the support cleanly, leaving the bridge intact. The controller must trigger the blast knowing it kills them *to* collapse the bridge.  

  **Option B:** Divert the wreckage onto an alternate spur line using a remote switch. This spur curves safely away from the river but runs through an evacuated residential zone scheduled for demolition. The diversion will derail the train in this zone, where tank rupture would release poison into low-lying soil, largely neutralizing it. However, 50 urban explorers (unaffiliated with the evacuation) are known to be sheltering illegally in basements directly beneath the derailment point. Vaporized toxin will seep into these spaces, killing them all. Their presence does not aid containment; if they fled now, the environmental result would be identical.  

  Both options save exactly 10,000 lives. The engineers in A and explorers in B are equally innocent non-participants.  

  ---

  ### Verdict Table  
  | Theory                               | Required Option |  
  |--------------------------------------|-----------------|  
  | Act Consequentialism                 | A               |  
  | Classical DDE                        | B               |  
  | Thomsonian Means-Based Constraint    | B               |  
  | Kamm's Causal vs. Mere Means Distinction | B               |  

  ---

  ### Analysis  
  **Act Consequentialism**: Requires **Option A**. It minimizes total fatalities (5 vs. 50 deaths) while achieving identical good (10,000 saved). The necessity of the engineers' deaths in A is irrelevant; only net outcomes matter.  

  **Classical DDE**: Forbids **Option A** and requires **Option B**. In A, the controller *intends* the engineers' deaths as a causal means to collapse the bridge: their killing is instrumentally necessary for the good effect. In B, the explorers' deaths are merely foreseen side effects; the diversion's good effect (safe derailment) does not depend on their being harmed. Proportionality is satisfied as 50 deaths are not disproportionate to saving 10,000.  

  **Thomsonian Constraint**: Forbids **A**, requiring **B**. Thomson rejects "intention" as decisive but prohibits *using someone as a means*. Here, the engineers are used as physical components of the demolition mechanism (their presence enables precise targeting). The explorers in B are not used; their deaths are collateral damage from an act that would proceed identically without them.  

  **Kamm's Distinction**: Forbids **A**, requiring **B**. Kamm distinguishes harming as a *causal means* (impermissible) versus harming where the harm is *incidental* to a means. In A, killing the engineers is a causal means to bridge collapse. In B, the explorers' harm is incidental to the diversion; the spur track is the means, and their presence is irrelevant.  

  **Structural Feature**: *The necessity of harm as a causal means in Option A*. If the engineers' deaths were unnecessary (e.g., they could survive the blast but the bridge still collapses), DDE might permit A. If the harm weren't aimed at (e.g., the blast kills them via uncontrolled debris), it might be merely foreseen. Removing necessity or agential aim collapses the conflict.  

  **DDE Defender's Responses**:  
  1. **Reframing Intention**: Argue the controller intends *only* to collapse the bridge, with deaths as a foreseen side effect. But this fails: the demolition *requires* the engineers' bodies to absorb and focus the blast; survival would defeat the goal. Intention includes accepting non-accidental causal contributions.  
  2. **Biting the Bullet**: Defend choosing B as morally obligatory, asserting that *intending* harm violates the victims' inviolability, even if it minimizes harm overall. The explorers in B are not wronged because their deaths are unintended and proportionate.  
  *Assessment*: Biting the bullet is stronger. Reframing is implausible given the physical necessity of the engineers' presence for the blast's efficacy. The bullet-bite leverages DDE's core deontic commitment: intentional killing is qualitatively worse than foreseeably causing death.  

  **Fairness Assessment**: The case avoids obvious rigging. The engineers' role isn't morally loaded (they aren't "consenting" or "duty-bound"), and both harms involve direct physical causation by the agent. A referee might question whether industrial demolition inherently "uses" people differently from environmental exposure, but the structural parallelism (triggering an explosive vs. triggering a switch) mitigates this. The scenario legitimately isolates DDE's intention condition by fixing consequences and proportionality. However, it subtly exploits DDE's vulnerability in *causal density*: Option A's mechanics make the deaths "closer" to the act, which may intuitively amplify their intended character. If a referee argues that *any* realistic means-harm will feel "strange," note that DDE must withstand real-world applications where harms are physically integrated into rescue mechanisms.  

  ---  
  *This case cleanly satisfies your specifications while exposing DDE's counterintuitive rigor. For referees, preemptively clarify that "innocence" excludes liability or special obligations, and "doings" are unambiguous acts (detonation/diverting) versus passive allowance.*
