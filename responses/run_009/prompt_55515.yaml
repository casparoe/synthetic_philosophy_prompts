          Motivation: Fairness requires that each member's vote counts equally. Non-negotiable for the fairness faction. The epistemic faction might be willing to give more weight to some members (experts) but in the absence of such distinctions, anonymity is a default.

     R2. Neutrality: The rule treats every proposition in the agenda in the same way. That is, the aggregation rule is symmetric with respect to propositions. 
          Motivation: Fairness across propositions. However, note that the propositions are not symmetric in the logical structure. For example, C is the conclusion and P1, P2 are premises. The epistemic faction might argue that we should treat the premises as more fundamental. So this might be negotiable.

     R3. Independence: The collective judgment on any proposition should depend only on the individual votes on that proposition, not on how individuals voted on other propositions. 
