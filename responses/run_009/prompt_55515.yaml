          Motivation: Without consistency, the collective decision is irrational. Non-negotiable? For the epistemic faction, it is non-negotiable because truth must be consistent. For the fairness faction, it might be less central, but still they would not want to endorse an inconsistent set.

     O3. Deductive Closure (optional?): If the collective judgment accepts a set of propositions that logically entail another proposition in the agenda, then it must also accept that proposition. 
