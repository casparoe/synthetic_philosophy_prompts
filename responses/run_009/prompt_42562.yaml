     Accept free and reliable information if and only if:

     1. The expected direct hedonic cost (discomfort, dread, etc.) of receiving the information is not excessive (where "excessive" is context-dependent and might be interpreted as outweighing the expected benefits from having the information, but note: we are not doing a full expected utility calculation because Good's theorem already says that the expected utility is non-negative. We are adding constraints that the user feels).

