  Okay, let's start by understanding the user's situation. They're a psychiatrist on a committee that revises the diagnostic manual for their country. They need a decision procedure to evaluate proposals for new diagnoses or changes to existing ones. The key challenge is distinguishing between actual medical conditions and what Szasz called "problems in living." The user finds Szasz's arguments compelling but wants an operational tool, not philosophical debates.

  First, I need to design a procedure that's structured and efficient. The user mentioned a fixed order of questions, so I’ll outline steps that build logically. Each question should have clear pass/fail criteria to avoid ambiguity. The goal is to determine if a proposal is a genuine medical condition or a social judgment disguised as one.

  The user’s deeper needs are practical: they need a tool that their colleagues, who aren’t Szasz fans, can accept. The procedure must produce defensible rationales for plenary approval. Also, it should handle real-world cases like gambling and internet gaming disorders, and the tricky case of depression. 

  I recall Szasz's key distinctions: literal disease (with physical pathology) vs. metaphorical, sickness vs. sick role, and diagnosis as a social act. The procedure needs to incorporate these without requiring Szaszian knowledge. Steps should identify if there's bodily evidence, if disapproval drives the category, norms involved, and consent implications.

  For the gambling disorder proposal, the procedure should reveal it lacks physical pathology and is based on conduct disapproval. Internet gaming disorder is similar. But depression is complex. Even though it’s treatable and patients benefit from the sick role, the procedure might flag it as metaphorical. The user acknowledges this but wants honesty, so I shouldn’t soften the outcome.

  I need to ensure each step has clear outputs: stop, pass, or values judgment. For example, if no bodily evidence is found, the proposal might be rejected unless it passes other criteria. Norms and consent are critical for identifying social enforcement. 

  Testing on the three cases: gambling and gaming should fail early steps (no physical markers, conduct disapproval). Depression might pass some steps due to biomarkers like inflammation, but the procedure would still highlight reliance on norms and the sick role. The user’s internal conflict is that they see clinical benefits but the procedure might classify it as metaphorical. 

  I should note where judgment is needed, like interpreting biomarker significance or harm thresholds. This transparency shows the procedure's limits. The user needs to know that some decisions require human judgment, especially for "messier" proposals.

  Finally, the procedure must be concise, fitting a one-page rationale. By specifying where it stops or delegates, the subcommittee can efficiently draft justifications. Highlighting the values steps allows the plenary to debate policy aspects, which respects their role without medicalizing social issues.
answer: |-
  Here is a decision procedure designed for operationalizing Szaszian distinctions within your subcommittee's constraints, followed by application to the three proposals:

  **The Subcommittee Decision Procedure: Distinguishing Disease from Problems in Living**

  1.  **Bodily Lesion/Pathophysiology:**
      *   *Question:* What specific, identifiable bodily lesion, measurable pathophysiology, or objective biomarker (e.g., genetic marker, neuroimaging finding, lab test) is proposed as a necessary and sufficient indicator of this condition? *Not symptoms or self-report, but a finding in the body.*
      *   *Sufficient Answer (Yes):* A clearly defined, replicable biological abnormality demonstrably linked to the core features of the proposed disorder.
      *   *Stop & Reject (No):* If no such lesion/pathophysiology is identified or proposed, *or* if the proposed biological correlates are inconsistent, non-specific, or merely correlative with distress/behavior without demonstrating causality. **Output: "Lacks necessary bodily pathology. Proceed to Q2."**
      *   *Handoff:* If evidence is highly suggestive but contested or preliminary (e.g., specific genetic link for a subset), flag for full plenary review on evidentiary grounds. *Not a values question yet.*

  2.  **Disapproved Conduct/Feeling as Core Definition:**
      *   *Question:* Is the core definition of the proposed diagnosis fundamentally dependent on identifying conduct, thoughts, or feelings that are primarily judged negatively by a social audience (e.g., society, family, authorities)? Does removing this negative judgment render the definition medically meaningless?
      *   *Sufficient Answer (No):* The definition hinges on functional impairment, distress, or biological dysfunction *independent* of social disapproval. The behavior/feeling itself is not the primary focus; its consequences or biological basis are.
      *   *Stop & Reject (Yes):* If the diagnosis cannot be defined without referencing conduct/feelings deemed socially undesirable, deviant, or morally problematic. **Output: "Primarily labels disapproved living. Not a medical disease. Reframe as policy/social issue."**
      *   *Handoff:* If the line is blurry (e.g., distress *caused by* internal conflict vs. distress *caused by* social sanctions), flag for full plenary as a values judgment on the nature of dysfunction. *Requires human judgment.*

  3.  **Normative Enforcement:**
      *   *Question:* Can the diagnosis be applied reliably without invoking a contested social, moral, or performance norm? Whose norm is operationalized by the diagnostic criteria (e.g., productivity, conformity, emotional regulation standards)? By what authority (medical, legal, educational) is this norm being enforced via diagnosis?
      *   *Sufficient Answer (Yes, Independent):* Criteria rely on universal concepts of biological survival, basic cognitive function, or subjective distress *not* tied to specific cultural/moral expectations (e.g., inability to eat, severe self-harm risk, profound cognitive disorganization).
      *   *Stop & Reject (No):* If diagnostic criteria explicitly or implicitly enforce contested norms (e.g., "excessive" time spent, "failure" to meet responsibilities defined by society, "inappropriate" affect). **Output: "Enforces contested social norm [Specify Norm]. Medicalizes non-medical judgment. Reframe."**
      *   *Handoff:* If the norm is widely accepted as fundamental to health/safety (e.g., basic self-care) but its boundaries are fuzzy, flag for plenary values discussion. *Judgment call on norm universality.*

  4.  **Consent & The Sick Role:**
      *   *Question:* Would this diagnosis typically be applied *against the person's will* or despite their full consent to and endorsement of the conduct/feelings in question? Does the diagnosis primarily serve to assign the "sick role" (excusing responsibility, mandating treatment) rather than describe an involuntary biological state?
      *   *Sufficient Answer (No/Sickness):* The condition is experienced as ego-dystonic, unwanted, and biologically intrusive *by the individual*. Consent is often sought *for* treatment, not withheld *for* the behavior/state itself.
      *   *Stop & Reject (Yes/Sick Role):* If the diagnosis is primarily used to pathologize and override the stated preferences of a consenting individual engaging in the behavior/feeling. **Output: "Assigns sick role to non-consenting conduct. Converts choice into pathology. Reframe."**
      *   *Handoff:* In complex cases (e.g., severe addiction with ambivalence), flag for plenary judgment on capacity/coercion. *Values-laden assessment.*

  **Output Summary:**
  *   **Pass (Medical Disease):** Clear Yes on Q1 OR Clear No on Q2 + Clear Yes on Q3 + Clear No on Q4.
  *   **Reject (Problem in Living):** Stop triggered at Q1, Q2, Q3, or Q4.
  *   **Handoff (Values Judgment):** Triggered at any step requiring human interpretation of contested evidence or norms.

  **Procedure Limits:**
  1.  **Biomarker Ambiguity:** Doesn't resolve debates over the significance of correlative vs. causal biomarkers (Q1).
  2.  **Distress vs. Deviance:** Struggles with conditions where distress *arises from* internal conflict vs. social sanction (Q2/Q3 boundary).
  3.  **Harm Thresholds:** Doesn't define "evident harm" or "impairment"; assumes these are part of the proposal but needs scrutiny (often smuggles in norms - Q3).
  4.  **"Functional" Slippage:** "Functional impairment" can be a Trojan horse for social non-conformity (Q3).
  5.  **Coercion & Capacity:** Cannot objectively adjudicate when consent is invalid due to internal state (Q4).
  6.  **Treatability ≠ Validity:** A condition being treatable doesn't make it a literal disease in this framework. This is a core Szaszian point the procedure enforces.

  ---

  **Application to Proposals:**

  **1. Proposal: Add "Gambling Disorder" as Full Diagnosis**
  *   **Q1 (Bodily Lesion):** *No.* Proposed correlates (e.g., dopamine dysregulation) are inconsistent, non-specific, and correlative with reward-seeking/impulsivity, not a unique lesion/pathophysiology *for gambling specifically*. **Stop & Reject?** **No - Proceed to Q2.**
  *   **Q2 (Disapproved Conduct):** *Yes.* Core criteria (preoccupation, need to gamble more, restlessness when stopping, chasing losses, lying, jeopardizing relationships/jobs, relying on others for money) define persistent, socially/legally disapproved gambling behavior causing harm. Remove the disapproval/judgment of "persistent maladaptive gambling," and the definition collapses. **Stop & Reject. Output: "Primarily labels disapproved living (persistent, harmful gambling). Not a medical disease. Reframe as policy/social issue."**

  **2. Proposal: Add "Internet Gaming Disorder" (Impaired control, continuation despite harm)**
  *   **Q1 (Bodily Lesion):** *No.* Similar to gambling. Proposed neural correlates (e.g., reward circuitry) overlap heavily with normal intense engagement and other behavioral addictions; no unique pathophysiology identified. **Proceed to Q2.**
  *   **Q2 (Disapproved Conduct):** *Yes.* Core criteria center on "excessive" time, "loss of interest" in other activities, "continued use despite problems," "deception," "jeopardizing" opportunities – all defining socially disapproved (often adolescent) behavior patterns causing harm. The "disorder" label hinges on the negative judgment of the *degree* and *consequences* of gaming. **Stop & Reject. Output: "Primarily labels disapproved living (excessive, harmful gaming). Not a medical disease. Reframe as policy/social issue."** *(Note: Distinction from Gambling is minimal here – both fail at Q2).*

  **3. Proposal: Leave Major Depressive Disorder (MDD) Unchanged**
  *   **Q1 (Bodily Lesion):** *No.* While correlates exist (neurotransmitter dysregulation, HPA axis changes, inflammation), they lack the specificity, consistency, and causal demonstrability of a true bodily lesion/pathophysiology *for the syndrome as defined*. They are state-dependent, correlative, and present in other conditions/stress. No diagnostic test exists. **Proceed to Q2.** (This is the critical divergence point from your preference).
  *   **Q2 (Disapproved Conduct/Feeling):** *Complex, Leans Yes.* Core criteria (depressed mood, anhedonia, weight change, sleep change, psychomotor agitation/retardation, fatigue, worthlessness/guilt, impaired concentration, suicidality) primarily define a subjectively painful *feeling state* and its observable correlates. However, "depressed mood" and "anhedonia" are internal states, not *inherently* conduct. **Proceed to Q3.** (Here, judgment starts – the procedure forces the question).
  *   **Q3 (Norm Enforcement):** *Leans Yes, Requires Handoff.* Criteria like "diminished ability to think/concentrate" and "fatigue/loss of energy" directly invoke norms about cognitive performance and productivity. "Worthlessness/guilt" often reflects internalized social/moral norms. While distress/risk (suicidality) are medical, the *syndrome definition* relies heavily on enforcing norms about emotional state and functional capacity. **Handoff Output:** "Relies on contested norms regarding emotional expression (lack of positive affect), cognitive performance, and energy/productivity. Requires plenary values judgment on whether these norms constitute universal dysfunction or social enforcement." (This is where the "hard work" happens politically).
  *   **Q4 (Consent/Sick Role):** *Leans No (Sickness), but Ambiguous.* Most individuals with MDD experience symptoms as ego-dystonic and unwanted. However, diagnostic application can sometimes override stated preferences (e.g., involuntary hospitalization for suicidality). Primarily describes an unwanted state, not a consented behavior. **Sufficient Answer (No/Sickness).**

  **Verdict for MDD (via Procedure):** **Handoff at Q3.** The procedure *does not* automatically reject MDD, but it forces the issue onto the plenary as a values judgment about norms and the nature of dysfunction. It highlights its metaphorical status (failure at Q1) and its dependence on norms (Q3 trigger). It does *not* yield the same "Reject" as Gambling/Gaming because MDD is defined by distressing internal states and risk (suicidality) rather than primarily by disapproved *conduct* (Q2 passes, albeit shakily). The **critical difference is Q2**: Gambling/Gaming center on disapproved *actions*, MDD centers on distressing *states*. However, Q3 exposes the normativity inherent in defining distressing states as dysfunctional.

  **Consequences for You:**
  The procedure, applied consistently, highlights that MDD, like Gambling/Gaming, lacks a literal bodily lesion (Q1 fail). Its survival hinges on Q2/Q3. You find MDD's definition by distressing states (Q2 pass) more medically valid than disapproved conduct (Q2 fail for Gambling/Gaming). However, the procedure forces the uncomfortable Q3 question: *Whose norms define which distressing states are "disordered"?* You acknowledge its treatability and the utility of the sick role, but the procedure reveals these are *separate justifications* from it being a literal bodily disease. To keep MDD unchanged, the plenary must *judge* (at the Q3 handoff) that the norms it enforces (re: mood, energy, cognition) are sufficiently universal/biological to constitute medical dysfunction, not just social enforcement – a values-based decision the procedure itself cannot make. This is the "manufactured difference" from the gaming case: a judgment call on the validity of the norms embedded in depression criteria, whereas gaming/gambling fail more cleanly at Q2 (defining disapproved conduct). The procedure compels transparency about this normative foundation.
