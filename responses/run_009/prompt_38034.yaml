      "Jamesian pragmatism (fits utility for community goals but doesn't prioritize utility over correspondence)",
      "Rortian constructivism (fits social arbitration of truth but Wikipedia assumes sources can reflect reality)"
    ],
    "underdetermined": [
      "Whether consensus aims to track truth or constitutes it",
      "Whether harm reduction is epistemic or purely ethical",
      "Whether 'reliability' is an intrinsic property or instrumental label"
    ],
    "tensions": [
      {
        "tension": "Consensus overrides primary evidence (birth certificate)",
        "verdict": "Resolvable: Strict no-OR policy intentionally prioritizes process over accuracy"
      },
      {
        "tension": "Source reliability vs. gossip removal under BLP",
        "verdict": "Resolvable: BLP adds ethical constraints to verificationism"
      },
      {
        "tension": "Reliability as consensus-determined (Daily Mail) vs. fixed property",
        "verdict": "Real inconsistency: Reliability is mutable in practice but often treated as static"
      }
    ],
    "what_would_change": [
      {
        "if_view": "Peircean convergence",
        "changes": "Primary evidence could be used if deemed likely to achieve future consensus; reversions would require arguing against its convergence potential"
      },
      {
        "if_view": "Jamesian pragmatism",
        "changes": "Birth certificate accepted if 'more useful' (e.g., corrects harm); unreliable data removed if 'unworkable' regardless of source status"
      },
      {
        "if_view": "Correspondence theory",
        "changes": "Primary documents could override sources; reliability would require empirical validation"
      },
      {
        "if_view": "Rortian constructivism",
        "changes": "All reliability explicitly provisional; birth cert exclusion remains (no privileged access to reality)"
      }
    ]
  }
  ```

  ### Key Conclusion
  Your observed tensions arise because Wikipedia **hybridizes** verificationism with ethical pragmatism. Under its implicit theory, your birth certificate loses not because it’s false, but because the system prioritizes *socially stabilized verification* over *accuracy*. Adopting Peirceanism would only help if the community treated your evidence as a harbinger of future consensus—but it would still lose to *current* consensus without a source. The system’s core tension is between truth-as-correspondence and truth-as-stability, with the latter prevailing in practice.
