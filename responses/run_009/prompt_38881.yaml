  But there's also a standards of proof issue. Proponents want a formal demonstration that cyclic preferences lead to exploitation. Critics argue that actual agents can avoid exploitation through foresight or commitment, so the proof isn't airtight. This ties into what counts as satisfying rationality requirements—actual avoidability or logical possibility?

