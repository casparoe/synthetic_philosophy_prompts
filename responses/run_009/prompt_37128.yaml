  My friend Dana has this whole thing about objects, and over the years she's handed down verdicts on a bunch of the statue-and-clay type cases. Her track record, as best I can reconstruct it:

  1. A clay statue gets squashed flat. Her call: what's on the pedestal afterwards is a lump of clay, and the statue did not survive the squash.
  2. A cat loses its tail in an accident. Her call: still the same cat.
  3. A ship gets every plank swapped out one at a time over a decade. Her call: still the same ship.
  4. A statue is smashed to bits, and years later somebody painstakingly reassembles it from the exact same pieces. Her call: that's a new statue — the old one didn't come back.
  5. A lump of clay gets cut in two and made into two statues. Her call: the original lump is gone, it didn't survive the division.

  She's visiting next month and I wanna spring some new cases on her. Predict her verdicts before I do:

  (a) The carving case: a sculptor starts with a solid block of marble and carves a statue out of it over several months, hauling off dust the whole time. When it's finished — is the block still there, now constituting the statue? Or did the block go out of existence somewhere along the way, and if so is there even a determinate moment? And halfway through the carving: is there a block on the scaffold, a statue, both, or neither?
  (b) The accidental statue: a lump of clay falls off a shelf and lands shaped exactly like a horse. Critics hail it as a masterpiece. Is there now a statue there? And did the fall destroy the lump?

  What I actually want from you: work out the candidate rules that fit her track record — I'm fairly sure theres more than one that fits, maybe one where there's only ever one object in a place at a time and whichever description "wins" is the thing that exists, and one where a statue and its matter can sit on top of each other as two things with different fates, but there could be others. Say what each rule predicts for (a) and (b), give your best guess at her answers along with your reasons, and tell me which of the two cases is the better discriminator. And if the rules that survive still agree on (a) and (b), come up with one further case that would finally split them apart.
