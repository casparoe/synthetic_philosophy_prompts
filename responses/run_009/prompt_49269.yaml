prompt: |-
  I recently accepted a seat on the appeals panel of a large, user-edited history encyclopedia, and I've discovered that a substantial share of our docket concerns historical atrocity denial. Our written policy is unhelpfully thin — it prohibits "denial and gross distortion of well-documented atrocities" — so we decide case by case, and our accumulated rulings are the only guidance we have. Before the new case below comes to a vote, I want to understand what our own precedents actually commit us to.

  Our rulings so far, in chronological order:

  1. Removed: a post asserting that the gas chambers at Auschwitz were postwar reconstructions built for propaganda purposes.
  2. Removed: a formally written essay arguing that the deaths of Ottoman Armenians in 1915 constituted a two-sided civil war with comparable casualties on each side rather than a genocide.
  3. Restored: a contribution by an amateur historian disputing whether a particular auxiliary police battalion was present at a specific massacre, based on archival records concerning that unit's movements.
  4. Removed: a video asserting that the figure of roughly 300,000 dead at Nanjing was a political fabrication and that the true toll was a few hundred at most.
  5. Restored: an article surveying historians' casualty estimates for a nineteenth-century famine, presenting the full range of published figures without endorsing any point in the range.
  6. Removed: a post conceding that the Holocaust occurred and was a grave crime, but arguing on the basis of Red Cross death records that the true toll was about a tenth of the accepted figure.

  The new case is our hardest yet. It is a long, heavily footnoted essay whose author accepts that the Holocaust occurred, that extermination camps and gas chambers existed, and that the killings were intentional genocide. However, he argues from crematory capacity and transport records that the total death toll was around three million rather than five to six million, and he adds that the Auschwitz memorial's own postwar revision of its toll from about four million to about 1.1 million shows that even the official figures respond to politics rather than evidence. His tone throughout is somber; he explicitly condemns the killings; and his only accusation of bad faith is directed at the museum administration's supposedly inflated numbers, not at any wider group.

  I'd like your help thinking this through rather than a simple verdict. First, what should we decide if we want to remain consistent with our own precedent record, and which of the six earlier cases is the closest analog? Second, spell out at least two distinct rules that each fit all six existing rulings equally well — for instance, a rule about which core facts must be conceded versus a rule about material minimization of scale, or whatever other candidate rules you find in the record — and say what each predicts for the new essay, since I suspect they diverge on it. Third, if our precedents genuinely underdetermine the decision, state plainly what principle we would be adopting with each possible outcome, so that we vote with our eyes open. Finally, describe the further case — one that could plausibly reach our docket — that would most cleanly separate the candidate rules from one another, since I'd like to bring it up at the meeting.
reasoning: |-
  Okay, the user is part of an appeals panel for a history encyclopedia dealing with atrocity denial cases. They need help analyzing a new case in light of past precedents. Let me start by understanding the six existing rulings.

  First, cases 1 and 4 were removed because they denied core facts—gas chambers at Auschwitz and the Nanjing death toll. Case 2 was removed for framing the Armenian events as a civil war, which minimizes the genocide. Case 6 was removed for drastically reducing the Holocaust death toll despite accepting it happened. These show that denying well-established facts or minimizing scale leads to removal.

  Then cases 3 and 5 were restored. Case 3 questioned a specific unit's presence using archives, which is a detail without denying the massacre. Case 5 presented a range of famine estimates without endorsing any, showing factual presentation is allowed.

  Now the new case: the essay accepts the Holocaust, gas chambers, and genocide but argues the death toll was 3 million instead of 5-6 million. It uses crematory capacity and transport records, and mentions Auschwitz's revised numbers. The author condemns the killings and isn't accusatory beyond the museum's numbers.

  The user wants consistency with precedents. The closest analog is case 6, which was removed for reducing the death toll to a tenth. But here, the reduction is less extreme (3M vs 5-6M), and the methodology seems scholarly. So maybe it's a borderline case.

  Next, candidate rules. Rule A: Denial of core facts leads to removal. Core facts are existence, intent, mechanisms. Here, all are accepted, so restore. But case 6 also accepted existence but was removed for scale minimization. So Rule B: Minimizing scale beyond scholarly debate leads to removal. If 3M is outside accepted estimates, it might be removal. But accepted estimates vary, so 3M might be within range? Need to check historians' consensus.

  The user needs two rules that fit all precedents. Rule 1: Removal if denying atrocity existence, mechanisms, or intent. That fits cases 1,2,4,6. Case 2 denies intent (genocide vs civil war), case 6 denies scale which is a core fact? Case 6 was removed for scale, so maybe core facts include scale. But case 5 presented varying scales without issue. So scale might be different.

  Rule 2: Removal if minimizing scale outside credible scholarship. Cases 1,2,4,6 minimize scale or deny mechanisms. Case 6 minimizes scale drastically. The new case's 3M is within some estimates (e.g., Hilberg's 5.1M includes non-Jewish; Jewish deaths are around 6M). If the essay focuses on Jewish deaths, 3M is low. But if it includes all, maybe not. Need clarity.

  The principles at stake: Restoring allows debate on scale within scholarly bounds, but risks platforming minimization. Removing might protect against distortion but suppress legitimate research.

  A future case could be challenging death toll estimates within the accepted range using new evidence. That would test if scale debate is allowed without crossing into denial.
answer: |-
  Based on your precedents and the new case, here's a structured analysis to help your panel deliberate with clarity:

  ### 1. **Precedent Consistency & Closest Analog**
     - **Consistent Decision:** **Restore** the essay.  
     - **Closest Analog:** **Case 3** (Restored: debate on a specific unit's presence at a massacre using archival records) and **Case 5** (Restored: survey of historians' famine estimates without endorsement).  
     - **Why?**  
       - Like Cases 3/5, the new essay focuses on **secondary details (scale)** using specific evidence (crematory/transport records), while **explicitly accepting all core facts**: existence of the Holocaust, genocide intent, gas chambers, and extermination camps.  
       - Unlike Case 6 (removed for reducing toll to ~10% of consensus) or Case 2 (removed for denying genocide by reframing it as civil war), it does not deny the atrocity’s fundamental nature. The reduction (3M vs. 5–6M) is less extreme (≈50–60% of mainstream estimates), and its methodology mirrors scholarly debate over historical evidence.

  ---

  ### 2. **Two Distinct Rules Fitting All Six Precedents**  
  *(Both rules explain all prior decisions but diverge on the new case)*

  | **Rule** | **What It Requires** | **Predicts for New Essay** | **Why It Fits Precedents** |
  |----------|----------------------|----------------------------|----------------------------|
  | **Rule A: Core Fact Concession**<br>(Focus: *What* must be accepted) | Removal if an entry **denies any core fact**:<br>1. The atrocity occurred.<br>2. It was *intentional* (genocidal/atrocity context).<br>3. Key mechanisms (e.g., gas chambers) existed. | **Restore**<br>The essay concedes all core facts: Holocaust occurred, was genocidal, used gas chambers. Disputing scale alone is permissible (like Case 5’s famine estimates). | • Removed Cases 1 (gas chambers), 2 (intent/genocide), 4 (occurrence at Nanjing), 6 (scale as core fact? Rule A treats scale as secondary).<br>• Restored Cases 3 (no core fact denial) and 5 (scale discussion allowed). |
  | **Rule B: Scale/Impact Minimization**<br>(Focus: *Severity* distortion) | Removal if an entry **materially minimizes the scale/impact** of a well-documented atrocity **beyond credible scholarly debate**. | **Remove**<br>Reducing the toll to 3M (vs. consensus 5–6M) minimizes scale significantly. Citing Auschwitz’s revision implies broader politicization, amplifying distortion. | • Removed Cases 4 (Nanjing toll reduced to "hundreds"), 6 (toll reduced to 10%), 2 (casualties "comparable" minimizes victim-perpetrator imbalance).<br>• Restored Cases 3 (specific detail, not scale) and 5 (full range of estimates, no minimization).<br>• Case 1 removed as gas chamber denial inherently minimizes scale. |

  **Key Divergence**: Rule A protects *contextual acceptance*; Rule B protects *consensus magnitude*. The new essay tests whether scale is a "core fact" (Rule A: restore) or if its reduction constitutes "gross distortion" (Rule B: remove).

  ---

  ### 3. **Principles Adopted Based on Outcome**  
  If precedents underdetermine the decision, your vote establishes new principles:
  - **Restore**:  
    *Principle*: **Scholarly debate on quantitative details is permissible if core facts (occurrence, intent, mechanisms) are undisputed.** This prioritizes academic freedom but risks platforming arguments that, while not denying the event, may downplay its severity in public perception.  
  - **Remove**:  
    *Principle*: **Scale is integral to understanding an atrocity’s gravity; minimizing it beyond credible margins constitutes distortion.** This protects consensus narratives but may stifle legitimate revisionism (e.g., Case 5 would be removed if presenting estimates were deemed minimization).

  ---

  ### 4. **Future Case to Separate the Rules**  
  **Scenario**: An essay argues that the transatlantic slave trade’s mortality rate was 5–10% during the Middle Passage (citing specific ship logs), rather than the widely cited 15–20%. It accepts slavery’s brutality, systemic nature, and genocidal impacts, but claims historians exaggerate death rates for political reasons.  

  - **How it separates the rules**:  
    - **Rule A (Core Facts)**: Restore. No denial of slavery’s existence, intent, or mechanisms.  
    - **Rule B (Scale Minimization)**: Remove. Reducing mortality by 50–67% materially minimizes scale beyond credible debate (consensus is 12–20%).  
    - **Why it clarifies**: Unlike Holocaust toll estimates (where credible scholars *do* debate 4.5M–6M), slave trade mortality has tighter consensus. This tests whether "scale minimization" applies only to extreme outliers (Case 6’s 90% reduction) or any significant challenge to consensus.

  ---

  ### Key Considerations for Your Panel
  1. **Historical Consensus**: The Holocaust’s death toll (5–6M Jews, plus 11M total) is settled among mainstream historians. While estimates vary (e.g., Hilberg: 5.1M; Yad Vashem: 6M), 3M is outside credible bounds. The Auschwitz revision (4M→1.1M) reflects improved methodology—not politics—and doesn’t invalidate overall tolls.  
  2. **Author’s Framing**: The essay’s "somber tone" and condemnation may be sincere, but Rule B asks if its *impact* minimizes severity regardless of intent.  
  3. **Precedent Gap**: Your rulings haven’t addressed "scale debates" with moderate reductions. Case 6 (90% reduction) was unambiguous; this is not.  

  **Recommendation**: If your panel values scholarly nuance, **restore with contextual warnings** (e.g., "controversial minority view"). If protecting consensus magnitude is paramount, **remove** to avoid distortion. Use the future case above to clarify your stance decisively.
