answer: |-
  ### Grading Procedure for Contested "Right but Early" Forecasts  
  **Philosophical Grounding:** Popperian falsificationism treats a prediction as a test of a *core theory plus auxiliary assumptions* (e.g., "no unforeseen tech shocks"). Rescuing a failed prediction by adjusting auxiliaries is legitimate **only if** those auxiliaries were explicit, falsifiable, and independently testable. If adjustments are ad hoc (vague, untestable, or retrofitted), the theory enters "degenerating" territory—protecting the theorist, not truth. Self-defeating/self-fulfilling prophecies (e.g., Malthus spurring innovation) are real but rarely provable; they require evidence of causal influence. This procedure prioritizes testability, penalizes goalpost-moving, and flags edge cases for panel judgment.  

  ---

  ### Procedure: 6-Step Decision Tree  
  **Input:** A prediction that missed its deadline.  
  **Output:** Grade (Correct / Incorrect) or Panel Judgment call.  

  1. **Verify Deadline Passed & Event Status**  
     - *Question:* Did the predicted event definitively occur **after** the deadline?  
     - *Sufficient Answer:* Objective evidence (e.g., data showing famine did not occur by 2010; solar became cheapest post-2021).  
     - **Hard Stop:** If the event occurred **on or before** the deadline → **Correct**. Stop.  
     - *Proceed if:* Event occurred late or not at all.  

  2. **Assess Timeline Specificity**  
     - *Question:* Was the deadline integral to the theory?  
     - *Sufficient Answer:* Timeline was a core claim (e.g., "by 2010") vs. vague (e.g., "mid-2020s").  
     - **Hard Stop:** If the deadline was vague/non-binding → **Incorrect** (downgrade for imprecision, but not "early"). Stop.  
     - *Proceed if:* Deadline was explicit and binding.  

  3. **Audit Auxiliary Assumptions**  
     - *Question:* Did the forecaster state **testable auxiliaries** (e.g., "assuming no major policy shifts") that failed?  
     - *Sufficient Answer:* Auxiliaries must be documented in original prediction and falsifiable (e.g., "no fusion breakthroughs by 2010" → fusion occurred).  
     - **Hard Stop:** If auxiliaries were *not stated* or *retrofitted* post-hoc → **Incorrect** (ad hoc rescue). Stop.  
     - *Proceed if:* Stated auxiliaries were falsified by events.  

  4. **Check for Unforeseen External Shocks**  
     - *Question:* Did an unforeseeable, high-impact event directly cause the delay?  
     - *Sufficient Answer:* Shock was (a) unprecedented (e.g., COVID-scale pandemic), (b) unrelated to the prediction’s domain, and (c) occurred after the forecast.  
     - **Hard Stop:** If shock was foreseeable (e.g., routine recessions) or domain-related (e.g., energy policy shifts for solar) → **Incorrect**. Stop.  
     - *Proceed to Panel Judgment if:* Shock was truly exogenous/unforeseeable (e.g., sudden global catastrophe).  
       - *Panel weighs:* "Unforeseeability" standard (policy choice: strict = only "act of god" shocks; lenient = major regulatory shifts).  

  5. **Evaluate Self-Defeating/Self-Fulfilling Dynamics**  
     - *Question:* Is there evidence the prediction *caused* actions that delayed/averted it?  
     - *Sufficient Answer:* Documented causal chain (e.g., prediction cited in policy debates that directly enabled solutions).  
     - *Proceed to Panel Judgment always:* Evidence is typically circumstantial.  
       - *Panel weighs:* Strength of causal link (e.g., Malthus’ direct influence on agricultural R&D vs. weak correlation).  

  6. **Final Panel Judgment: "Right but Early" Claim**  
     - *Question:* Does the delay reflect a *legitimate* timing error in an otherwise sound theory?  
     - *Sufficient Answer:* All prior steps cleared; core theory remains testable; delay is "small" relative to horizon.  
     - *Panel weighs:*  
       - **Degeneracy risk:** If auxiliaries were adjusted >2x for the same theory, default to **Incorrect**.  
       - **Horizon-relative leniency:** Max 10% of forecast horizon (e.g., 2 years for 20y forecast) for "near-misses."  
       - **Values call:** Does excusing this align with tournament goals? (e.g., rewarding directionality vs. precision).  

  ---

  ### Worked Cases  
  **Case 1: 1995 Prediction (Grain Demand > Supply by 2010 → Famine Risk)**  
  - Step 1: Deadline passed (2010); famines did not occur → Proceed.  
  - Step 2: Deadline explicit ("before 2010") → Proceed.  
  - Step 3: Forecaster assumed "no agricultural innovation." Auxiliary falsified (GMOs, intensification boomed) → **Incorrect** (ad hoc to blame "unforeseen" tech).  
  - *Grade:* **Incorrect**.  

  **Case 2: 1980s Prediction (Machine Majority of Jobs by 2025)**  
  - Step 1: Deadline passed (2025); not occurred → Proceed.  
  - Step 2: Deadline explicit → Proceed.  
  - Step 3: Auxiliaries rarely stated (e.g., "assuming AI progress at 1980s pace"). Retrofitted claims ("but look at LLMs!") are ad hoc → **Incorrect**.  
  - *Grade:* **Incorrect**.  

  **Case 3: 2001 Prediction (Solar Cheapest New Electricity in "Two Decades")**  
  - Step 1: Deadline (2021) missed by 1 year (occurred ~2020) → Proceed.  
  - Step 2: "Within two decades" implies a window (2001–2021) → **Correct** (2020 is within bounds).  
  - *Why the panel’s instinct works:* The phrasing inherently allows a 20-year window. No timeline violation.  
  - *If deadline was strict (e.g., "by 2020"):* Proceed to Step 3. Auxiliaries (e.g., "policy support continues") were tested—renewable subsidies fluctuated but persisted. Step 4: No true shock (tech cost curves were trackable). Step 6: Near-miss (1 year/5% of horizon). Panel likely excuses as **Correct** with a precision downgrade.  
  - *Bending risk:* Excusing a 1-year miss *if* phrased strictly rewards luck, not skill. But horizon-relative leniency (Step 6) contains this—unlike Cases 1/2 (decades late).  

  ---

  ### Limits of the Procedure  
  1. **Unresolvable Fights:**  
     - *Self-fulfilling/defeating claims:* Causality is inferential; panels will always debate "influence."  
     - "Unforeseen" shocks: Distinguishing true exogenous events (e.g., a meteor strike) from domain noise (e.g., election outcomes) hinges on subjective "foreseeability" thresholds.  
     - "Core theory" vs. "auxiliary": Degeneracy creeps in when theories are vague (e.g., "capitalism causes crisis" rescued endlessly).  

  2. **The Principled Ceiling:**  
     Tolerating >10% horizon delays or >2 "right but early" passes per forecaster erodes scoring integrity. Forecasting tournaments measure **calibrated confidence**, not just directional insight. Chronic "early" predictions indicate poor timing calibration—a flaw, not a feature. If >15% of grades invoke "right but early," the tournament incentivizes vagueness and ad hoc rescues, becoming a sympathy contest.  

  **Final Guidance:** Anchor grading to *what was testable at issuance*. Reward precision, document assumptions, and penalize retrofitting. The procedure above makes falsificationism operational—but panels must ruthlessly enforce its stops to avoid Malthusian degeneracy.  

  ---  
  **Format:** 2 pages; designed for 5-min pre-call review.
