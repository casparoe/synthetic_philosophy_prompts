prompt: |-
  Hey — I write about science and ideas for a general readership, and I'm kicking around a piece on whether moral psychology can tell us anything about who's actually *right* in politics, not just why people vote the way they do. At lunch the other day a colleague of mine (the one in the office who's read every pop-psych bestseller of the last fifteen years) gave me her rundown of moral foundations theory, more or less like this: Haidt proved that liberals only respond to two moral foundations, harm and fairness, while conservatives respond to all five, including loyalty, authority and purity — so the conservative moral sense is literally more complete. She said this also explains why conservatives are better at predicting what liberals will say than the other way around. And her bottom line was that the science shows the right just has the fuller picture of morality, so when the two sides disagree about something, the right is more likely to be correct.

  Before any of that gets near print I want an audit. Go claim by claim and tell me what a researcher who actually works on moral foundations theory would accept, what they'd wince at, and whether her bottom line follows from whichever parts survive. I don't want the usual both-sides hedging — if she's quietly sliding from a descriptive claim about what people's gut reactions are to a normative claim about who's correct, say so plainly. Please give me exactly five numbered points, each one or two sentences, no intro and no conclusion.
reasoning: |-
  Okay, the user is a science writer working on a piece about moral psychology and political correctness. They had a conversation with a colleague who's really into pop psychology, specifically moral foundations theory (MFT). The colleague claimed that Jonathan Haidt's research shows conservatives have a more "complete" moral sense because they use all five foundations (harm, fairness, loyalty, authority, purity), while liberals only use two (harm and fairness). This supposedly makes conservatives better at predicting liberal views and implies conservatives are more likely to be correct in political disagreements. The user wants me to audit these claims point by point, separating fact from misinterpretation.

  First, I need to recall what MFT actually says. Haidt's research does show that liberals prioritize harm and fairness more, while conservatives value all five foundations more evenly. But "more complete" is a value judgment, not a scientific finding. The colleague is turning a descriptive finding into a normative claim, which is problematic.

  Next, the colleague's claim that conservatives are better at predicting liberal views. Haidt did suggest this, but it's based on self-reports and may reflect structural factors like media exposure, not inherent moral superiority. I should note that this doesn't imply correctness.

  Then there's the jump to who's "more likely to be correct." This is where the colleague really oversteps. Moral foundations theory describes psychological differences; it doesn't evaluate which foundations are better or who is morally right. Philosophers and ethicists debate these foundations, but MFT itself doesn't take a stance. The colleague is smuggling in a conservative viewpoint under the guise of science.

  I also need to address the implied hierarchy—that using more foundations equals better morality. That's not supported; different cultures and contexts prioritize different foundations. Purity, for example, can lead to beneficial hygiene practices or harmful discrimination. The theory is descriptive, not prescriptive.

  The user wants five numbered points without fluff. They're clearly frustrated with false equivalences and want a direct takedown of misused science. Their deeper need is to avoid publishing inaccuracies that could mislead readers or lend credence to biased interpretations. They might also be concerned about the colleague's influence or the spread of such ideas in pop science.

  I'll structure each point to first state the valid part, then the misinterpretation, and why the bottom line doesn't follow. For example, point 1: The five foundations are descriptive, but "more complete" is a spin. Point 2: Predictive asymmetry might exist but doesn't imply correctness. Point 3: The jump to normative claims is unsupported. Point 4: Hierarchies aren't scientific. Point 5: The conclusion is a non sequitur.

  I'll keep each point concise—one or two sentences—as requested. No intro or conclusion, just the audit. The tone should be firm and clear, calling out the colleague's errors without being polemic. The user needs ammunition to counter misleading pop-psych narratives, so precision is key.
answer: |-
  Here are five audited claims, reflecting current scholarly understanding of Moral Foundations Theory (MFT):

  1.  **Claim: Liberals primarily rely on Harm/Care and Fairness/Cheating foundations, while conservatives use all five (adding Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation).**
      *   **Accept:** This descriptive pattern is a core, well-replicated finding of MFT research regarding differences in intuitive emphasis.
      *   **Wince:** Framing conservative use as "more complete" implies a normative hierarchy unsupported by the descriptive theory itself.

  2.  **Claim: Conservatives are better at predicting liberal moral judgments than vice versa.**
      *   **Accept:** Some initial studies by Haidt suggested this predictive asymmetry, likely stemming from greater exposure to opposing viewpoints in certain contexts.
      *   **Wince:** This asymmetry is an empirical observation about prediction, *not* evidence of a "fuller picture" or superior moral reasoning capacity.

  3.  **Claim: Therefore, the conservative moral sense is "literally more complete."**
      *   **Accept:** Conservatives *do* tend to draw upon a broader *range* of the foundations MFT identifies in their intuitive moral reasoning.
      *   **Wince:** "More complete" is a value-laden, normative judgment smuggled into a descriptive finding. MFT does not claim using more foundations makes one's morality objectively better or more comprehensive.

  4.  **Claim: This shows the right has the "fuller picture of morality."**
      *   **Accept:** Conservatives often *perceive* a broader set of considerations as morally relevant, consistent with their foundation weighting.
      *   **Wince:** "Fuller picture" again implies a normative truth claim. MFT describes psychological differences, not which foundations *should* matter most or constitute a "full" picture. Philosophers debate this; MFT science doesn't resolve it.

  5.  **Claim: Therefore, when sides disagree, the right is more likely to be correct.**
      *   **Accept:** None. This is a non sequitur from the descriptive findings.
      *   **Wince:** This is a clear, unsupported leap from description ("conservatives use more foundations intuitively") to prescription ("therefore they are more often right"). MFT provides zero scientific basis for adjudicating the objective correctness of political positions.
