prompt: |-
  I write historical fiction, and each novel confronts me with a decision I make perhaps a dozen times per chapter with no method behind it: when the sources disagree, fall silent, or wear their partisanship openly, what may I assert on the page as fact, what must I hedge as a narrator's guess, and what am I free to invent outright? My training is in the craft of prose, not in history, and my constraints are fixed: I work from translations and whatever secondary literature I can obtain, I have no archival access, and a consulting historian reads my manuscript exactly once, after the draft is done — by which point the wrong choices are expensive to unmake. What I need is a decision procedure I can run myself, in a few minutes per instance, before I commit a sentence to the page.

  Please build it out of the actual tradition of source criticism, but compressed for a practitioner. The distinctions I suspect matter most, and which I'd like you to keep or discard as the design requires: the difference between a source that errs at random and one that errs in a direction, since the second can be corrected for and the first only averaged; the discipline of not treating a source's silence as knowledge that a thing did not happen, which means asking what would have had to be true for the writer to mention it; the gap between a source that was present and one that merely heard from someone; and the gap between what a source says happened and what it says the happening meant, which is where partisanship usually hides. The procedure should preserve what these distinctions actually claim while making them usable by someone without the theory, and it should say plainly which of them you decided to drop in the simplification.

  Then run it on three cases I actually face in my current manuscript: a scene where the only narrative source is a chronicle written to flatter the ruler it describes; an episode where two otherwise credible sources flatly contradict each other about who was in the room; and a matter where the literary sources say one thing and the material evidence — coins, in this instance — says another. I want at least one of these to come out in a way I will not like, and I want you to tell me which one that is rather than softening the verdict to spare me.

  Finally, mark for me the point at which the procedure must stop and hand the decision back: I assume there are moments where the question stops being what the evidence supports and becomes what a novelist may do with a gap the evidence cannot fill, and I would rather have that boundary drawn honestly than have the procedure pretend to settle questions of license in the dress of questions of fact. And since I will be trusting this procedure for years: tell me where you think it is most likely to misfire, and what would change your mind about it — which argument or consideration would lead you to redesign the steps or return different verdicts on the three cases.
reasoning: |-
  We are building a decision procedure for a historical fiction writer to determine:
    - What may be asserted as fact
    - What must be hedged as a narrator's guess
    - What can be invented outright

   The procedure must be based on source criticism traditions but compressed for a practitioner.

   Key distinctions provided by the writer (and which we will try to preserve):
    1. Random error (which can only be averaged) vs. directional error (which can be corrected for).
    2. Silence of a source is not evidence of absence: we must ask what would have had to be true for the writer to mention it.
    3. Gap between an eyewitness and a secondhand account.
    4. Gap between what happened and the interpretation/meaning (where partisanship hides).

   Steps in the procedure:

   Step 1: Identify the type of uncertainty:
     a) Disagreement between sources?
     b) Silence (absence of evidence)?
     c) Partisanship (bias) in a source?
     d) Conflict between narrative and material evidence?

   Step 2: For each source, assess:
     a) Proximity: Was the source present? (eyewitness) or is it secondhand?
     b) Bias: Does the source have a motive to distort? Is the error random or directional?
     c) Corroboration: Is there any other evidence (from other sources, material evidence) that supports or contradicts?
     d) Plausibility: Does the claim align with what we know about the context, human nature, etc.?

   Step 3: Decision rules:

   Rule A: If multiple independent sources agree, it can be asserted as fact (unless there is a clear reason to think they are all biased in the same way).

   Rule B: If sources disagree:
     - If one source is clearly an eyewitness and the other is not, prefer the eyewitness (unless the eyewitness has a strong bias that the non-eyewitness does not).
     - If both are equally proximate, then consider bias: if one has a directional bias that would lead to a particular distortion, correct for that bias and see if the accounts converge. If they do, then that corrected version can be asserted. If they don't, then you must hedge (e.g., "Some say X, others Y").
     - If the disagreement is about the meaning or interpretation, then it must be hedged as the narrator's guess (or attributed to the source) unless there is a clear consensus in the secondary literature.

   Rule C: For silence (absence of evidence):
     - Ask: Would the source have been expected to mention this if it happened? If yes, then the silence is evidence against the event. But if the event was mundane or not noteworthy to the source, then silence is neutral.
     - If the event is something that would have been recorded if it happened and the source is silent, then it cannot be asserted as fact. You can invent it only if it is a minor detail and does not contradict known facts.

   Rule D: For partisan sources:
     - Correct for the bias: if the source is flattering, then downplay the flattery. If the source is hostile, then consider the opposite. But only if we have an independent way to gauge the bias (e.g., through material evidence or other sources). Without such correction, we must hedge.

   Rule E: Conflict between narrative and material evidence:
     - Material evidence (coins, archaeology) is generally more reliable for factual claims (e.g., dates, existence of a person, titles) because it is contemporary and not subject to later editing. However, interpretation of material evidence can be tricky.
     - If the material evidence contradicts a narrative source, the material evidence usually wins unless there is a strong case for misinterpretation of the material.

   Rule F: Invention is allowed only when:
     - The matter is trivial and not covered by any source (e.g., the color of a non-historical figure's dress, the weather on a day when nothing crucial happened).
     - It does not contradict known facts.
     - It serves the narrative without distorting history.

   Step 4: Boundary of the procedure:
     - The procedure stops when the gap in evidence cannot be filled by any historical method and the novelist must use creative license. This happens when:
          a) There is no evidence at all and the matter is not trivial (so invention would be necessary but must be flagged as fictional).
          b) The evidence is so conflicting or ambiguous that no clear historical fact can be established, and the novelist must choose one version for narrative coherence (but then should hedge in the narration or in an author's note).

   Step 5: After using the procedure, if the decision is to hedge or invent, consider:
     - How central is the point to the story? If central, hedge. If peripheral, you might get away with invention.

   Now, we run the three cases:

   Case 1: A scene where the only narrative source is a chronicle written to flatter the ruler.

     Steps:
       - The source is partisan (directional bias: to flatter).
       - We must correct for bias: the chronicle may exaggerate the ruler's virtues, downplay his faults, and invent positive events or omit negative ones.
       - Rule D: We must hedge any positive assertion that is not independently verified. For example, if the chronicle says the ruler was brave in a battle, we might say "the chronicle records that the ruler showed great bravery" (hedging by attribution) or if we have material evidence (like a victory monument) we can assert the victory but not the bravery without corroboration.
       - What can be asserted? Basic facts that the chronicle would have no reason to distort (e.g., the date of the battle, the existence of the battle) if they are also supported by other evidence (like material evidence). But if the chronicle is the only source, then we must be cautious.
       - What can be invented? Only trivial details that are consistent with the period and do not contradict the chronicle.

     Verdict: You cannot assert the flattering details as fact. You must hedge them. For the scene, you might use the chronicle's account but with a narrative voice that signals skepticism or by attributing the account to the chronicler.

   Case 2: Two otherwise credible sources flatly contradict each other about who was in the room.

     Steps:
       - Rule B applies.
       - Assess proximity: Which source was present? If one was an eyewitness and the other was not, prefer the eyewitness. If both were eyewitnesses, then consider bias and plausibility.
       - If neither was present, then both are secondhand and we must look for corroboration or consider the possibility of error (random or directional).
       - Example: Source A says Duke X was present, Source B says Duke X was not. 
          - If Source A was in the room and Source B was not, then we prefer Source A (unless Source A has a reason to lie about Duke X being there, e.g., to implicate him in a conspiracy). Then we can assert that Duke X was present, but if there is a bias we must hedge.
          - If both are equally credible and proximate, and no way to break the tie, then we must hedge: "Some accounts say Duke X was present, others that he was not. The truth remains uncertain." 
          - Alternatively, if the novelist must choose for narrative purposes, then choose the version that best fits the known facts and character behavior, but signal the uncertainty in the narration or in a note.

     Verdict: Without a clear reason to prefer one source, you must hedge. This might be frustrating because you want a clear answer, but the procedure says: do not assert either as fact. You can, however, choose one for your story (if it's not central) and note the controversy, or if it is central, present both possibilities.

     Note: The writer won't like this because it forces ambiguity in a key detail.

   Case 3: Literary sources say one thing and material evidence (coins) says another.

     Steps:
       - Rule E: Material evidence (coins) is generally more reliable for certain facts (e.g., the title of a ruler, the dates of reign). 
       - Example: Literary sources say King X ruled until 1066, but coins minted in 1065 bear the name of King Y. Then the coins suggest that King Y was already on the throne in 1065.
       - We must then distrust the literary sources. Why might they be wrong? Perhaps they were written later and relied on faulty memory or had a reason to extend King X's reign (e.g., to legitimize a successor). 
       - Verdict: The coins win. You should assert what the coins say as fact and treat the literary sources as mistaken or biased. 

     But note: The writer might not like this because it may force a rewrite to align with the coins, which might disrupt a narrative based on the literary sources.

   Now, which verdict will the writer not like? 
     - Case 2: Because it forces ambiguity and hedging in a key detail (who was in the room) that might be central to a scene.

   Boundary of the procedure:
     - The procedure stops when the evidence is absent or so contradictory that no historical conclusion can be drawn. Then the novelist must use creative license, but should:
          - Avoid contradicting known facts.
          - For central plot points, consider either hedging (to show uncertainty) or choosing the version that best fits the narrative (but then note it in an author's note).
          - For trivial matters, invent without worry.

   Where the procedure is most likely to misfire:
     - When assessing bias: It can be hard to know the exact direction and magnitude of bias. We might overcorrect or undercorrect.
     - When dealing with material evidence: Sometimes the interpretation of material evidence is not straightforward (e.g., a coin might be a forgery, or might have been minted by a rival claimant). Without expertise, the writer might take material evidence at face value when it is contested by historians.
     - When deciding what is trivial: What seems trivial to a novelist might be significant to a historian. The boundary between invention and fact can be blurry.

   What would change my mind about the procedure?
     - If there is a well-established historical method that I have overlooked that provides a better way to handle one of these cases.
     - If in practice the procedure leads to too much hedging, making the narrative weak, then we might allow more invention in non-central details.
     - If new evidence or scholarship emerges that changes the consensus on how to weigh sources.

   Final note: The procedure is a tool, not a substitute for historical research. But given the constraints (no archival access, limited secondary sources), it is a pragmatic approach.

   Let me know if you need more details on any step.
answer: |-
  ### Decision Procedure for Historical Fiction Writers  
  **Core Principle:** Treat history as a *probability landscape*, not a binary of true/false. Your goal is to assign confidence levels to claims, then choose narrative tactics (assert/hedge/invent) based on that confidence.  

  #### The Procedure (5-Minute Checklist)  
  1. **Identify the Claim**  
     - What *exact* fact are you evaluating? (e.g., "Emperor X wept at news Y," "General Z was in Room A").  
     - Flag: Is this **central to plot/theme**? (If yes, rigor ↑; if no, inventibility ↑.)  

  2. **Map Sources & Their Flaws**  
     Use this matrix (mentally or jot down):  

     | Source          | Proximity (Present?/Earliest?) | Partisanship (Directional Bias?) | Random Errors? | Silence Gap* |  
     |-----------------|--------------------------------|----------------------------------|---------------|--------------|  
     | Source A        | Eyewitness? / 10 yrs later?    | Flatters King? Hates Rebels?     | Minor typos?  | Would it mention X? |  
     | Source B        | Hearsay? / 50 yrs later?       | Neutral? Agenda-driven?          | Contradictions? | Same Q       |  
     | Material Evidence | Coins, ruins, artifacts      | N/A (but context matters)        | Dating errors? | What *isn’t* preserved? |  

     **\* Silence Gap Key:** *Only* treat silence as evidence of absence if:  
     - The event was **noteworthy** for that source’s purpose (e.g., a chronicle flattering a king *would* mention his victory; silence = likely no victory).  
     - The event was **routine** (e.g., daily meals)? Silence is meaningless.  

  3. **Weigh the Evidence**  
     - **Directional Bias** > **Random Errors**:  
       - Correct for bias (e.g., a flattering source claims "King won single-handedly" → hedge: "The court chronicle claims..." or invent reasonably: "King rallied troops").  
       - Random errors (e.g., mistranslated names) can be ignored if trivial or averaged with other sources.  
     - **Eyewitness** > **Hearsay** *unless* eyewitness is biased:  
       - Bias distorts meaning more than event recall (e.g., an enemy eyewitness says "The king trembled" → fact: king showed fear; hedge/invent *type* of fear).  
     - **Material Evidence** > **Narrative Sources** for objective facts (dates, titles, presence):  
       - Coins/artifacts rarely lie but can be misdated or misread.  

  4. **Assign Confidence Level**  
     - **High (80-100%)**: Assert as fact. *Requirements:*  
       - Multiple unrelated sources agree, *or* material evidence + one source, *or* a neutral eyewitness.  
     - **Medium (40-80%)**: Hedge. *Tactics:*  
       - "According to Source A...," "It is said that...," "Likely, X happened..."  
     - **Low (0-40%)**: Invent freely *if not central*. *Rules:*  
       - Never contradict high-confidence facts.  
       - Align with era’s social logic (e.g., no telegrams in 1500s).  

  5. **Boundary: When History Stops, Art Starts**  
     - **STOP HERE** if:  
       - All sources are silent *and* the event is trivial (e.g., "What did the servant eat for breakfast?" → invent).  
       - Confidence is low *and* the claim is **non-central** (e.g., a side character’s backstory).  
     - **DO NOT STOP** for:  
       - Central events (battles, treaties, motivations). Hedge or omit.  
       - Contradictions between high-confidence sources (resolve first).  

  ---  
  ### Case Applications  

  #### Case 1: Flattering Chronicle as Sole Narrative Source  
  **Claim:** "The Emperor showed mercy to Rebel Leader Z."  
  - **Sources:** One chronicle (pro-emperor, written by court insider). Silence elsewhere.  
  - **Procedure:**  
    - Proximity: Eyewitness or contemporary? → **Yes, high proximity.**  
    - Partisanship: **Directional bias (flattery)**. Expect exaggeration of virtue, omission of cruelty.  
    - Silence Gap: Other sources silent. Would they mention mercy? → **Yes** (if mercy was rare/noteworthy). Silence *weakly* contradicts claim.  
    - Material Evidence: None.  
  - **Confidence:** Medium (50%). *Why?* Source is close but biased; silence slightly undermines.  
  - **Verdict:** **Hedge.**  
    - *How:* "The court historian insists the Emperor showed mercy that day..."  
    - *Do not invent* mercy if it’s central (e.g., shapes rebel’s fate). If trivial (e.g., single line of dialogue), invent minimally.  

  #### Case 2: Contradictory Accounts of "Who Was in the Room"  
  **Claim:** "Duke A was present at Secret Meeting X."  
  - **Sources:**  
    - Source 1 (Eyewitness, pro-Duke A): Says Duke A was present.  
    - Source 2 (Eyewitness, anti-Duke A): Says Duke A was absent.  
  - **Procedure:**  
    - Proximity: Both eyewitnesses → **equal weight**.  
    - Partisanship: **Both biased directionally** (pro- and anti-Duke A). Bias cancels? No! Each has motive to lie:  
      - Pro-Duke A: Inflate his importance.  
      - Anti-Duke A: Downplay his involvement.  
    - Silence Gap: N/A (both speak to the event).  
    - Material Evidence: None.  
  - **Confidence:** Low (30%). *Why?* No neutral source; biases push in opposite directions.  
  - **Verdict:** **Invent freely if non-central; hedge if central.**  
    - *You won’t like this:* For plot-critical scenes, you **must hedge**. Example: "Some claimed Duke A was there, whispering strategy; others insisted his absence damned them all..."  
    - *Why no assert?* No tiebreaker. Historians would leave this unresolved.  

  #### Case 3: Literary Sources vs. Material Evidence (Coins)  
  **Claim:** "King B declared himself 'Defender of the Faith' in 1210."  
  - **Sources:**  
    - Literary: Two chronicles say King B took the title in 1210.  
    - Material: Coins minted in 1209 bear the title "Defender of the Faith."  
  - **Procedure:**  
    - Proximity: Coins are **contemporary evidence**; chronicles written 10-20 yrs later.  
    - Partisanship: Chronicles may propagate state propaganda → **directional bias**.  
    - Silence Gap: N/A.  
    - Material Evidence: **Coins don’t lie about titles/dates** (unless misdated, but assume experts verified).  
  - **Confidence:**  
    - Coins: High (90%). Chronicles: Low (20% for exact date).  
  - **Verdict:** **Assert the coin’s fact ("by 1209, coins bore the title..."); hedge the chronicles.**  
    - *Narrative Fix:* "The chroniclers would later claim it began in 1210, but the coins told an earlier tale..."  

  ---  
  ### Where the Procedure Misfires—And When I’d Redesign  
  - **Most Likely to Misfire:**  
    - **Silence Gap Misuse.** Writers might overestimate "noteworthiness" (e.g., assuming a chronicle *would* mention a private quarrel). *Redesign if:* You gain access to cultural historians who clarify norms of record-keeping.  
    - **Bias Overcorrection.** Directional bias is clear (flattery/hostility), but *degree* is guesswork. Correcting too hard invents new errors.  
    - **"Centrality" Ambiguity.** A trivial detail (a gift given) might *become* central later. Procedure can’t predict this.  

  - **What Would Change My Mind:**  
    - If new scholarship shows **eyewitness proximity is overvalued** (e.g., trauma distorts memory more than bias), I’d downgrade eyewitness weight.  
    - If your **consulting historian flags systemic errors** (e.g., you misjudge coin evidence), I’d add a "material evidence reliability" sub-checklist.  
    - If you **find peer-reviewed historiography** debating one of your cases, I’d incorporate those odds (e.g., "70% of scholars side with Source A").  

  ### Final Boundary Note  
  The procedure resolves **historical probability**. It *stops* at artistic license. When you invent:  
  - **Do:** Fill gaps with era-appropriate plausibility.  
  - **Don’t:** Contradict high-confidence facts without hedging ("Some whispered...").  
  - **Ethics:** When in doubt, hedge. Readers trust historical fiction to *frame* uncertainty honestly.  

  ---  
  **Output Format:** Keep this flowchart on your desk:  
  ```  
  [Claim] → Central? → (Yes → Rigor ↑) / (No → Invent? ↑)  
            ↓  
  Source Matrix (Proximity/Bias/Silence/Material)  
            ↓  
  Confidence: High (Assert) / Med (Hedge) / Low (Invent if non-central)  
            ↓  
  STOP if: Trivial gap OR non-central + low confidence → Invent mindfully.  
  ```  
  Your weapon is **transparency**, not omniscience.
