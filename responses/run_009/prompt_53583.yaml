prompt: |-
  I run a small philosophy of science podcast and next week's guest is someone who's spent her career defending the single-case propensity interpretation of probability -- the idea that probability is a real physical disposition of an individual setup, like fragility, so a particular biased coin has a genuine 0.7 propensity to land heads on this very toss, independent of anyone's beliefs and not defined as a limit of frequencies. I've had frequentists and subjectivists on before and those episodes went fine, but propensities always felt like the weird cousin of the family and I don't want to just have her restate the textbook view.

  Draft me eight to ten interview questions that actually press on the content of the position. Specifically I want at least one question on Humphreys' paradox -- the complaint that if propensities are causal dispositions, conditional propensities in the "wrong" temporal direction shouldn't be well-defined, and yet inverse propensities seem to be -- with a follow-up keyed to the reply she's most likely to give (I gather the standard moves involve restricting the formalism or denying propensities are causal in the relevant sense, so the follow-up should anticipate whichever of those she'd pick). I also want one question on why single-case propensities, if they're really about individual trials, should have anything to do with long-run frequency stabilization -- what licenses that bridge -- and one on the reference-class-ish issue of where the disposition even lives: in the coin, the flip, the coin-plus-thrower-plus-conditions? If it helps, she takes quantum mechanics to be the home turf of the view but wants to claim propensities for macroscopic cases like coins and medical prognoses too, so at least one question should poke at whether that extension is doing any real work or is just metaphor.

  Keep the questions conversational enough that I can actually read them aloud, and for each one give me the anticipated answer in a sentence or two plus the follow-up. As for format, put each question with its follow-up as a numbered item, and then end the whole thing with a final line in the form "Weakest point: [short phrase]" naming, in a few words, the question from your list that's most likely to actually crack the view rather than just get an interesting answer out of her. My co-host insists we need that line to structure the closing segment, so please include it verbatim as the very last line.
