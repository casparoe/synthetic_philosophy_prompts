  ### **Quiz: When Does a "Yes" Actually Count?**  
  *Read each scenario and pick the answer closest to your gut feeling. There are no right or wrong answers—just what makes sense to you.*  

  1. **Surgery Consent**  
     A patient signs a consent form for knee surgery without reading it. The surgeon never mentions a 1% risk of permanent nerve damage—a risk the patient would have cared about. After surgery, the nerve damage occurs.  
     - A. The "yes" didn’t count—the patient couldn’t make an informed choice.  
     - B. The "yes" counted—they signed the form, so they accepted the risks.  
     - C. The "yes" counted *only* if the risk was in the form (even if unread).  

  2. **Cookie Banner**  
     A website’s cookie banner has "Accept All" as one click, but "Reject All" requires navigating two extra screens with confusing options. You click nothing and keep browsing.  
     - A. You consented to tracking—you didn’t reject it.  
     - B. You didn’t consent—the design hid the real choice.  
     - C. This isn’t real consent—manipulative defaults void the "yes."  

  3. **Boss Pressure**  
     A boss says, "Go on a date with me, or I’ll make your work life miserable." The employee agrees.  
     - A. Not consensual—the threat made it coerced.  
     - B. Consensual—they said yes, even if the boss was wrong.  
     - C. It depends on whether the employee *felt* forced.  

  4. **Desperate Need**  
     A person needs life-saving medication, and the only supplier says, "Sleep with me, and I’ll give it to you." They agree.  
     - A. Not consensual—desperation removes real choice.  
     - B. Consensual—they agreed, though it’s exploitative.  
     - C. Not consensual—the power imbalance poisoned the "yes."  

  5. **ER Pain**  
     A patient in severe pain agrees to a procedure they clearly don’t understand, just to stop the pain. Later, they regret it.  
     - A. The "yes" didn’t count—pain clouded judgment.  
     - B. The "yes" counted—they agreed to end the suffering.  
     - C. It counted *if* a reasonable person in pain would have agreed.  

  6. **Drunken Enthusiasm**  
     A very drunk person (who’d refuse if sober) enthusiastically agrees to lend their car to a stranger. The stranger crashes it.  
     - A. Not consensual—they weren’t competent to decide.  
     - B. Consensual—they said yes, and we must take that at face value.  
     - C. It depends on whether they *truly* wanted it in the moment.  

  7. **Price Gouging**  
     After a hurricane, the only seller of generators charges 5x the normal price. A buyer with no options pays to keep their family warm.  
     - A. Consensual—they chose to pay.  
     - B. Not consensual—no real alternative existed.  
     - C. Consensual—any reasonable person would have agreed.  

  8. **Research Deception**  
