  6. **Drunken yes**: A person who's quite drunk says yes enthusiastically to something they'd refuse sober (e.g., a sexual encounter or a financial decision).
     - Options:
       A. The consent is invalid because they weren't competent to make the decision.
       B. The consent is valid because they said yes, and we can't read minds.
