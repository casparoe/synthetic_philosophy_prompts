  The positions to map to:
  1. Liberal View: Requires consent to be informed, competent, and uncoerced.
  2. Performative View: Consent is a speech act that waives rights regardless of internal state.
  3. Internal Attitude View: The outward "yes" is only evidence of a mental state (the actual mental state is what matters).
  4. Hypothetical Consent View: What a reasonable person would have agreed to.
  5. Tacit Consent View: Defaults and silence can count as consent.
  6. Skeptical View: Consent is a legitimation ritual; validity depends on background fairness.

  We must avoid direct labels in the questions. Instead, use scenarios.

  Additional requirements:
  - Include at least one or two questions that probe the split: does consent change what is permissible or only what you can complain about? And: when consent is given under deception, what is the problem?
