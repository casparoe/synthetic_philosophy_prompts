answer: |-
  ## Citizen Science Quality Procedure: A Rule-Following Framework

  **Procedure: Citizen Science Sampling Protocol Dispute Resolution**

  **Philosophical Grounding:**
  1.  **Rule-Following Paradox:** As Wittgenstein/Kripke argue, no written rule (like the 8-page protocol) *fully* determines its own application in every future case. There is always a potential gap ("But how do I apply this rule *here*, *now*?").
  2.  **Disposition vs. Norm:** A *disposition* is how we *happen* to act (e.g., always sampling from the bank). A *norm* is how we *ought* to act (e.g., sampling midstream). The written protocol aims to capture norms, but its application reveals our dispositions *and* our shared understanding of the norm.
  3.  **Communal Agreement as Arbiter:** In the absence of a metaphysical "fact" of rule-following, the only practical arbiter is agreement within the community of practice ("We *count* *this* as following the rule"). This agreement is forged through shared training, history, and ongoing practice.
  4.  **Agreement ≠ Correctness:** Our communal agreement *defines* correctness *for us*, *for now*. However, it *does not guarantee* correspondence with an independent reality or ultimate truth. We might collectively converge on a wrong practice ("quus" – e.g., consistently misapplying a procedure because of an unnoticed flaw in training or instrumentation). The procedure must flag potential "quus" situations.
  5.  **Limitations:** The procedure itself is a rule and suffers the same paradox. It relies on the Quality Officer (QO) applying it according to the *community's norms* for applying *this* procedure. It cannot adjudicate fundamental disagreements about *what the network should be* (e.g., "Is precision more important than coverage?").

  **Decision Procedure: Protocol Adherence Assessment**
  *(To be completed by Quality Officer for each disputed reading)*

  1.  **Initial Check: Explicit Protocol Violation?**
      *   *Question:* Does the volunteer's reported action directly contradict a specific, unambiguous instruction in the written protocol? (e.g., "Sample depth: 0.5m" but volunteer sampled at 1.0m; "Calibrate weekly on Monday" but calibrated Tuesday).
      *   *Sufficient Answer:* Verifiable evidence (volunteer's notes, calibration log, direct observation report) confirming the action *as described* contradicts the *letter* of the protocol.
      *   *Termination:* **Deviation, result quarantined.** (Explicit breach undermines core reliability).
      *   *Hand-off:* If ambiguity exists about *what the protocol literally says*, stop. Escalate to committee for protocol clarification.

  2.  **Assessment of Communal Practice:**
      *   *Question 1:* What is the *established, dominant practice* of the volunteer community for this specific aspect of the protocol? (How is it *actually* done by the majority, consistently?).
      *   *Sources:* Training materials, trainer testimony, QO observations, survey of experienced volunteers (>2 years), review of past dispute resolutions on similar points.
      *   *Question 2:* Was the volunteer's action consistent with this established communal practice? (Did they do what the community *counts* as following the rule?).
      *   *Sufficient Answer:* Clear consensus (e.g., >80% agreement from reliable sources) on dominant practice *and* evidence that the volunteer either followed it or intentionally deviated with good reason (see step 3). *Lack* of clear consensus triggers Step 3 or Hand-off.
      *   *Termination:*
          *   If action **matches** dominant practice: **Not a deviation.**
          *   If action **deviates** from dominant practice *without justification* (Step 3): **Deviation, result stands with annotation** (e.g., "Sample collected by wading, contrary to typical bank-based method. Data flagged.") *unless* deviation is severe (Step 4).
          *   If **no clear dominant practice** exists: Escalate to Step 3.

  3.  **Assessment of Intent & Reasonableness:**
      *   *Question:* Did the volunteer have a *reasonable justification*, based on either the written protocol's *intent* or sound scientific/environmental rationale, for deviating from the letter or the dominant practice?
      *   *Sources:* Volunteer's statement, QO assessment of rationale against protocol goals (e.g., "representative sample," "avoid contamination"), scientific plausibility.
      *   *Sufficient Answer:* A coherent explanation linking the action to achieving the protocol's *purpose* or addressing a specific, documented field challenge. "I thought it was better" is insufficient without rationale.
      *   *Termination:*
          *   **Justified:** **Not a deviation** (if intent aligns with protocol goal, even if method novel) OR **Deviation, result stands with annotation** (if method change is significant but rationale sound). QO judgement based on significance of change.
          *   **Unjustified:** **Deviation, result stands with annotation.**
      *   *Hand-off:* If the justification hinges on reinterpreting the *fundamental goal* of the protocol or network (e.g., "Accuracy is less important than safety"), stop. Escalate to committee.

  4.  **"Quus" Check: Potential Systemic Error?**
      *   *Question:* Does the deviation, OR the dominant practice itself, reveal a potential flaw in the protocol, training, or instrumentation that could systematically compromise data quality or interpretation *across the network*? (Is this potentially "our quus"?).
      *   *Triggers:* Significant deviation with sound justification challenging the norm; dispute highlights ambiguity/conflict in protocol; deviation exposes instrumental drift/variability protocol doesn't address; result is outlier but method *might* be superior.
      *   *Sources:* QO scientific judgement, consultation with technical advisor (if available), review of data patterns, literature on similar methods.
      *   *Sufficient Answer:* Plausible scientific argument that the current practice *or* the deviation points to a systemic risk to data integrity or fitness-for-purpose.
      *   *Termination:* **Deviation, result quarantined** (if isolated incident with high risk). **Result stands with STRONG annotation** (e.g., "Method deviates from protocol: [Details]. Potential implications: [Details]. Recommend committee review."). *Always* recommend committee review for potential protocol/training revision.
      *   *Hand-off:* Almost always triggers escalation to committee for systemic review, regardless of verdict on the single result. This is the key mechanism for preventing communal error.

  **Procedure Limitations (To be documented with the procedure):**
  *   **Sub-Communities:** If distinct groups (e.g., trained by different founders) have consistent but different practices, the "dominant practice" check may be inconclusive or favour the larger group unfairly. Escalation likely.
  *   **Entrenched Error:** Deferring to "old hands" risks perpetuating historical mistakes ("quus"). The "Quus Check" (Step 4) is the counter, but relies on QO/committee vigilance.
  *   **Self-Application:** The QO must apply this procedure based on their training and the community's norms for QA. Ambiguity in *this* procedure requires committee escalation.

  ---

  **Case Application:**

  1.  **Midstream Sampler:**
      *   Step 1: Protocol likely says "midstream sample," not specifying access method. No explicit violation.
      *   Step 2: Dominant practice is sampling from the bank. Volunteer deviated by wading.
      *   Step 3: Justification? "True middle is more representative, avoids bank influence." *Reasonable* scientific rationale. **Verdict:** Deviation (from practice), result stands with annotation ("Sample collected by wading to true midstream, contrary to typical bank access. Potential impact on comparability: [QO brief assessment].").
      *   Step 4: Quus Check? Highlights ambiguity in "midstream" definition. Does bank-sampling introduce bias? **Recommend committee review** of protocol definition and training. Committee *should not overrule* the verdict but *must* act on the systemic review.

  2.  **Founder-Member Drift:**
      *   Step 1: Compare actions to current protocol. Identify specific, verifiable deviations (e.g., uses older filtration method, different holding time). Likely finds explicit deviations.
      *   Step 2: Their practice *is* the historical dominant practice, but *not* the current one codified in the updated protocol. They deviate from the *current written norm*.
      *   Step 3: Justification? "This is how we've always done it, and it worked." Not scientifically justified *against the current protocol*. Habit isn't sufficient reason.
      *   Step 4: Quus Check? **CRITICAL.** Is their historical method valid? Does their data anchor require consistent methodology? If method drift compromises current data comparability, it's a systemic risk ("quus" for their site). **Verdict:** Deviation(s), result **quarantined** (if drift is severe and undermines comparability) OR **stands with STRONG annotation** (if impact is quantifiable/minor) – but **only after rigorous scientific review**. **Recommend committee review** urgently. Committee *should not overrule quarantine* based on sentimental value if data integrity is compromised. The verdict forces the hard conversation about dataset continuity vs. consistency.

  3.  **Diligent Calibrator:**
      *   Step 1: Protocol says "calibrate weekly". Volunteer calibrated *within* the week (Thu), then sampled (Fri). No explicit violation of "weekly" instruction (performed within the 7-day window).
      *   Step 2: Dominant practice is calibrating on a specific day (e.g., Monday) and not re-checking/adjusting mid-week unless malfunction is suspected. Volunteer deviated by calibrating mid-week based on observed drift.
      *   Step 3: Justification? "Instrument was demonstrably drifting, recalibration ensured accuracy for Friday's critical sample." **Highly reasonable, scientifically sound** rationale aligning with the *intent* of calibration (ensure instrument accuracy). Arguably *better* practice.
      *   Step 4: Quus Check? **YES.** This exposes a gap in the protocol. It doesn't address instrument stability checks, drift assessment, or actions if drift is found *between* scheduled calibrations. The *volunteer followed the protocol's letter but exposed its inadequacy*. **Verdict: Not a deviation.** (Action was justified, within the rule's scope, and enhanced data quality). However, **STRONG annotation** is crucial ("Instrument recalibrated Thu [date] due to observed drift prior to Fri [date] sampling. Protocol requires weekly calibration only.") AND **Mandatory committee escalation** to urgently revise the calibration protocol section. Committee *must not overrule* the "Not a deviation" verdict – the volunteer acted correctly and responsibly. Overruling would punish good practice and deter vigilance.

  ---

  **Implications for Protocol Drafting:**

  The rule-following paradox doesn't mean abandoning protocols; it means drafting them with humility about what words alone can achieve.

  1.  **Embrace Worked Examples & Scenarios:** Include numerous concrete examples of applying rules in common *and* ambiguous situations. Show, don't just tell. "Midstream: For wadable streams, collect approx. 1m from bank at knee depth; for non-wadable, use pole sampler extended as far as safely possible from bank. See Fig 3-5."
  2.  **Prioritise Training as Shared Practice:** Invest heavily in in-person, practical training sessions where norms are demonstrated, practised, and refined through dialogue. Foster a community of practice where volunteers can discuss "how we do things here". Supplement with videos of techniques.
  3.  **Focus on Intent & Purpose:** Explicitly state the *goal* of each step (e.g., "Purpose: To obtain a sample representative of main channel flow, free from immediate bank influence or surface scum"). This empowers volunteers to make reasonable judgements when the literal rule is ambiguous or situations change.
  4.  **Reduce False Precision & Anticipate Gaps:** Avoid overly prescriptive language where flexibility is needed (e.g., "calibrate weekly" is better than "calibrate every Monday" unless Monday *must* be the day). Acknowledge potential ambiguities and provide a *process* for handling unforeseen situations (e.g., "If you suspect instrument drift between calibrations: 1. Note observation. 2. If possible, repeat calibration check [describe simple check]. 3. If drift confirmed, recalibrate and note in log. 4. Report occurrence to QO.").
  5.  **Build in Review & Evolution:** Explicitly state the protocol is a living document. Include a mechanism for volunteers to flag ambiguities or suggest improvements based on field experience. Schedule regular reviews informed by dispute resolutions ("quus checks").
  6.  **Accept the Limits:** You cannot close every gap with words. Some judgement calls, grounded in shared understanding and protocol intent, will always be necessary. The protocol should equip volunteers for this, not pretend it doesn't exist.

  **Why we *can* (and must) act on this lesson:** Ignoring the rule-following paradox leads to brittle protocols that fail in the field, stifle responsible initiative, punish good faith attempts, and risk entrenching communal errors ("quus"). By embracing shared practice, focusing on intent, building flexibility for judgement, and institutionalising review, we create a *robust* system. This system accepts the philosophical reality of rule-following while maximising reliable, usable data fit for purpose – even statutory purposes. The key is grounding the rules in the living practice of the community, while maintaining vigilant, scientific self-critique to catch our own "quus". Your challenge is to formalise this dynamic process without killing its necessary flexibility.
