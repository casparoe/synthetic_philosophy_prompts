prompt: |-
  I'm on the board of our family foundation (about $400k a year to give away, money from my grandfather's logistics company). We've funded the same local food bank for a decade, and this year my cousin wants to redirect most of that to a tiny org doing policy advocacy for pandemic preparedness. Her argument: even a small chance of preventing a catastrophe outweighs reliably feeding a few hundred families, and anyway we're just as clueless about the long-run ripple effects of the food bank money, so we might as well go for the bigger upside. Half the board is family with zero philosophy background and thinks she's gone full doomsday prepper; the other half quietly agrees with her. I have to circulate the written opinion recommending what we do before next month's meeting. Draft it for me — it needs a concrete recommendation (a split is fine if that's what you think is right), reasons my cousin can actually respond to rather than hand-waving, and it has to take her cluelessness point seriously, because honestly I don't know how to answer it myself. Keep it readable for the non-philosophers on the board.
reasoning: |-
  Okay, the user is on the board of their family foundation with about $400k annually to give away. They've consistently funded a local food bank for a decade, but now their cousin wants to redirect most of that money to a small organization focused on pandemic preparedness policy advocacy. The cousin argues that even a small chance of preventing a catastrophe outweighs reliably feeding hundreds of families, and points out that they don't really know the long-term ripple effects of the food bank funding anyway.

  The board is split—half think the cousin is being a doomsday prepper, and half quietly agree with her. The user needs to draft a written opinion with a concrete recommendation before next month's meeting. They want reasons their cousin can respond to, and they specifically need to address her point about not knowing the long-term effects of their current giving.

  Hmm, this is a classic effective altruism dilemma—near-term tangible impact versus high-risk, high-reward systemic change. The cousin's argument about unknown ripple effects is actually quite sophisticated. It forces them to confront that all philanthropy involves uncertainty. 

  The user seems stressed about bridging the family divide. They need something that won't alienate either side while being intellectually honest. The phrase "cluelessness point" suggests they've read some Will MacAskill or similar EA literature—that's the term he uses for unknown flow-through effects of actions. 

  For the recommendation... a split feels inevitable. Cutting the food bank entirely after 10 years would be brutal, but ignoring pandemic prep entirely seems irresponsible given COVID's lessons. Maybe 60% food bank / 40% policy? That maintains core support while testing the new theory. 

  Key arguments to include: 
  First, validate both sides—feeding hungry neighbors isn't "small," and pandemic prep isn't fringe after 2020. 
  Second, dismantle the false dichotomy: they're not choosing between certainty and uncertainty, but between *types* of uncertainty. Food bank effects are localized and observable; pandemic advocacy has global unknowns. 
  Third, propose a trial run for the new funding to reduce risk—"Let's test if policy advocacy can absorb funds effectively." 

  Oh, and emphasize that the food bank likely prevents cascading crises (health/jobs/housing) from hunger. That counters "cluelessness" by showing some known second-order benefits. 

  ...Wait, should I mention that the policy org might fail to influence anything? That's the cousin's own uncertainty argument turned back on her. But gently—no gotchas. 

  Tone is crucial. No philosophy jargon. Use "ripple effects" instead of "cluelessness," and "preventing disasters" not "x-risk reduction." Must land with the aunt who runs Grandpa's old company and thinks EA is culty. 

  Final thought: Highlight that foundations exist to take smart risks, but also that trust matters. Abandoning long-term partners damages relationships. Hence the split—it's a hedge against being wrong either way.
answer: |-
  Here’s a draft opinion that balances both perspectives, addresses the "cluelessness" concern directly, and proposes a compromise. It’s structured for clarity and avoids philosophical jargon:

  ---

  **MEMORANDUM**  
  To: Foundation Board Members  
  From: [Your Name]  
  Subject: Funding Recommendation for 2025: Balancing Immediate Needs & Systemic Risk Mitigation  

  ### I. The Core Conflict
  We face a tension between two legitimate priorities:  
  - **Cousin’s View:** A small investment in pandemic preparedness could prevent massive future suffering (even if success is uncertain).  
  - **Traditional View:** Our consistent support for the food bank addresses urgent, visible needs for hundreds of families.  

  Both arguments have merit. Dismissing either as "doomsday prepping" or "short-sightedness" oversimplifies the debate.  

  ### II. Key Considerations  
  1. **The "Cluelessness" Point (and Why It Matters):**  
     - My cousin rightly notes that **all philanthropy involves uncertainty about long-term ripple effects.** We don’t know if food bank support truly "changes lives forever" or merely stabilizes people in crisis. Similarly, we can’t guarantee pandemic advocacy will succeed.  
     - *However, uncertainty isn’t all equal:*  
       - The food bank’s impact is **tangible, immediate, and measurable** (meals served, families stabilized). Its "ripples" (healthier kids, workers staying employed) are observed locally.  
       - Pandemic advocacy offers **potential for vast scale but high uncertainty**: Success depends on complex policy changes, political will, and unpredictable global events. Failure might mean zero impact.  

  2. **Risk vs. Reliability:**  
     - **Food bank funding is low-risk/high-certainty**: We know exactly who benefits and how. Cutting it abruptly harms real people we’ve committed to.  
     - **Pandemic advocacy is high-risk/high-reward**: If successful, it could save millions. But small nonprofits often struggle to influence policy, and results may take years (or never materialize).  

  3. **Our Foundation’s Values & Legacy:**  
     - Grandfather’s legacy prioritized **community stewardship**. The food bank embodies this.  
     - But he also built a logistics company by **anticipating risks**. Pandemic prep aligns with that forward-thinking spirit.  

  ### III. Recommendation: A Split Allocation  
  I propose we **divide the $400k as follows for 2025**:  
  - **$240k (60%) to the Food Bank**  
  - **$160k (40%) to the Pandemic Preparedness Policy Org**  

  **Why this split?**  

  1. **Preserves Core Commitments**  
     - Maintaining 60% for the food bank honors our decade-long partnership and prevents destabilizing an organization reliant on us. Sudden withdrawal could force service cuts within months, directly harming vulnerable neighbors.  

  2. **Tests the High-Impact Opportunity**  
     - $160k gives the policy org meaningful capacity (e.g., hiring a researcher, funding a pilot advocacy campaign) while limiting our risk. We can treat this as a **3-year pilot**: Require clear metrics (e.g., "Policy proposal adopted by X state agencies," "Coalition built with Y partners") by 2027 to justify renewal.  

  3. **Addresses the Uncertainty Argument**  
     - By funding both, we:  
       - **Acknowledge the cluelessness problem**: We’re hedging against the possibility that either choice could have unintended consequences.  
       - **Balance known vs. unknown impacts**: We continue supporting observable good *while* exploring potentially transformative work.  
       - **Avoid betting everything on either outcome**.  

  ### IV. Critical Next Steps  
  To make this work:  
  1. **Food Bank**: Discuss a multi-year plan to gently reduce reliance on us (e.g., 60% → 50% → 40% over 3 years if policy org succeeds).  
  2. **Policy Org**: Demand a **detailed impact roadmap** with milestones. Example: *"By 2026, draft model legislation adopted in 2 states."* No vague promises.  
  3. **Board Vote**: Approve this split for **2025 only**, requiring review next year based on both orgs’ performance.  

  ### V. Why Not All-In on Either Side?  
  - **Not 100% Policy**: $400k is tiny for systems change. If the org lacks traction in 2 years, we’ll have harmed the food bank for negligible gain.  
  - **Not 100% Food Bank**: Ignoring catastrophic risks is unwise post-COVID. Foundations like ours *should* allocate a portion to high-leverage, preventive work.  

  ---

  ### TL;DR for Non-Philosophers  
  - **We don’t know the future, so let’s not gamble everything.**  
  - **Keep feeding hungry families now** (they’re counting on us).  
  - **But also invest in preventing future disasters** (with strict goals to ensure it’s not money down the drain).  
  - **60% food bank / 40% policy split** lets us do both while we learn.  

  ---  
  This draft gives your cousin concrete criteria to prove her case (policy milestones) while protecting the food bank’s core function. It forces rigor on the "big upside" argument without dismissing it, and explicitly uses her "cluelessness" point to justify diversification. Would this work for your board?
