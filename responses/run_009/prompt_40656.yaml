prompt: |-
  I'm my dad's healthcare proxy. He's mid-stage Alzheimer's, and I'm the one who gets called when a decision has to be made — which is every couple of months lately, sometimes with a day or two to decide, sometimes with the hospital wanting an answer in an hour. Before the disease he was a trial lawyer, extremely sharp, and left very definite opinions behind: no feeding tubes, don't keep him alive "in some warehouse with no idea who anyone is," that kind of thing. But current-him is calmer and sweeter than pre-Alzheimer's him ever was, and honestly he seems pretty content most days, while his past self's whole fear was of exactly the condition he's now in and doesn't seem to mind.

  Everyone gives me a different theory. His doctor says the advance directive governs. My sister says just keep him comfortable and happy now, that's the whole job. And I keep reading about this debate in the literature — Dworkin's split between experiential interests and critical interests, the whole advance-directive fight about whether past autonomous preferences should beat a now-happy present person, and also the AI-alignment people's idea of "coherent extrapolated volition," asking what someone would want if they knew more, thought faster, were more the person they wished they were. It struck me these are all basically the same question I'm facing with my dad.

  So what I want is a procedure, not a philosophy lecture. Something I can actually run each time the phone rings: the questions in order, when his past stated preferences bind and when they don't, how to weigh what current-him seems to want when he can't really explain himself anymore, and what to do in the case I find hardest — when present-him clearly wants something (like still wanting his "going to the office" routine at the day center, which is a fiction but keeps him calm and oriented) that past-him would have found undignified. Tell me where the procedure just can't decide and I have to make a judgment call, and mark those spots honestly.

  Then run it on three real-ish cases: (1) he stops eating enough and they ask about a temporary feeding tube, (2) a UTI that could turn septic — antibiotics or comfort care only, (3) whether to keep going along with his belief that he still has cases to prepare, including letting him "work" in his notebook for hours. No reading lists please, I've had enough of those — I need the decision rules.
reasoning: |-
  Okay, the user is their father's healthcare proxy. He has mid-stage Alzheimer's, and they're frequently faced with urgent medical decisions. The father had clear advance directives—no feeding tubes, no prolonged life in a diminished state. But now, he's calmer and seems content, which conflicts with his past wishes. The user needs a practical decision-making procedure, not philosophical debates. They outlined three real scenarios to test the procedure.

  First, I need to understand the core conflict. The father's past "critical interests" (his values and dignity) clash with his current "experiential interests" (comfort and happiness). The user mentioned Dworkin's concepts and AI-alignment ideas like coherent extrapolated volition. But they want actionable steps, not theory. They’re overwhelmed by literature and need a clear, step-by-step method for when the hospital calls.

  The user's explicit request is for a procedure with ordered questions, guidelines on when past preferences apply, how to weigh current happiness, and handling situations where current actions (like pretending to work) might seem undignified to the past self. They also want honesty about where judgment calls are necessary. Plus, applying it to three cases: feeding tube, UTI treatment, and enabling the work fiction.

  Deeper needs: The user is likely stressed by frequent, urgent decisions and family disagreements. They might feel guilty or conflicted—honoring past directives vs. seeing their father content now. They need validation that it's okay to prioritize current comfort sometimes, and a framework to reduce decision fatigue. They also need clarity on when they have to rely on their own judgment, which acknowledges the complexity without leaving them unsupported.

  For the procedure, I should structure it as a flowchart or checklist. Key principles: the advance directive is primary, but current well-being matters. Past preferences bind unless they cause current suffering or are incompatible with reality. Use substituted judgment ("what would he decide now?") and best interests when that's unclear. Flag any irreversible decisions or suffering risks as critical judgment points.

  For the cases: 
  1. Feeding tube: Past directive says no, and current comfort (avoiding forced feeding) aligns with that. Tube might cause agitation. Judgment call if he's not suffering and the situation is reversible.
  2. UTI: Treatable without prolonging suffering. Antibiotics are low-burden, so likely yes. Judgment if sepsis is imminent and treatment becomes aggressive.
  3. Work fiction: Current comfort and orientation vs. past dignity concerns. Since it helps him, allow it. Judgment if it becomes harmful (like stress).

  Need to ensure the procedure is concise, uses plain language, and highlights where judgment is needed. Avoid jargon. Emphasize that the user isn't betraying their father by choosing comfort—Alzheimer's changes the context. Also, note that medical input on burdens vs. benefits is crucial for each decision.
answer: |-
  Here's a step-by-step decision procedure designed for urgency and clarity, based on balancing legal/ethical principles with the reality of your father's current state. **Bold text** marks judgment calls.

  **The Procedure (Run this checklist each time):**

  1.  **Is this an emergency requiring *immediate* action to prevent imminent death or severe harm?**
      *   *Yes:* Make the choice that preserves life *if* the intervention is reversible and non-burdening (e.g., temporary oxygen, IV fluids for dehydration). **This is a judgment call on "imminence" and "severity."** Proceed to step 4 quickly.
      *   *No:* Proceed to step 2.

  2.  **Consult the Advance Directive (AD):** What does it *specifically* say about this *exact* situation or a very closely analogous one?
      *   *Clear Directive Applies (e.g., "No feeding tubes," "No CPR"):* This is the **strongest binding force**. Proceed to step 3.
      *   *No Specific Directive or Ambiguous:* Proceed to step 4.

  3.  **Does following the AD *directly conflict* with his current, observable well-being/happiness?**
      *   *No Conflict:* **Follow the AD.** (e.g., He's unconscious with failing organs - AD says no machines -> comfort care).
      *   *Clear Conflict:* (e.g., AD says "no tube feeding," but he's alert, seems hungry yet can't swallow safely, and appears distressed by hunger/thirst, not by the *idea* of a tube). **This is a major judgment call.** Weigh:
          *   *Severity of Suffering:* Is he actively suffering *now* due to the condition the AD refuses? (Hunger, pain, breathlessness).
          *   *Nature of Intervention:* Is the intervention high-burden (surgery, permanent tube) or low-burden (temporary NG tube)?
          *   *Reversibility:* Is the intervention temporary? Can it be stopped?
          *   *His Current Reaction:* Does he resist the intervention *now* (even non-verbally) indicating distress?
          *   *Goal:* Is the intervention purely life-prolonging in advanced decline, or does it offer a chance to return to his *current* baseline of contentment?
          *   **If suffering is high, intervention is low-burden/reversible, and offers return to *current* contentment, you *may* ethically override the specific AD instruction *for this specific instance*. Document reasons clearly. Proceed to step 5.**

  4.  **Substituted Judgment: What would *he* decide *now*, knowing his current state of mind and capabilities?**
      *   *Can you infer his *current* preference?* (e.g., Pulls away from needle - likely "no"; Reaches for water - likely "yes"; Calm during routine - likely "continue"). Give significant weight to this observable preference.
      *   *No Observable Preference:* What would he want *specifically for this situation*, knowing he is content *as he is now*? Would he accept a low-burden treatment (like oral antibiotics) to stay in his current state? Would he refuse a high-burden intervention (like major surgery) that disrupts his calm? **This requires inferring his *current* values based on observed contentment, not projecting past fears.**

  5.  **Best Interests Standard:** If steps 2-4 are unclear or conflicting, ask: What action best promotes his overall well-being *in his current reality*?
      *   *Minimize Suffering:* Physical pain, agitation, fear.
      *   *Maximize Comfort & Contentment:* Physical ease, calm environment, engagement in preferred activities (however simple).
      *   *Avoid Burdensome Interventions:* Especially those unlikely to restore him to his current baseline of contentment.
      *   *Respect Current Personhood:* Honor his *present* expressions and routines where possible and non-harmful.

  6.  **The Dignity Question (Specific to "fictions" or perceived indignities):** Is the action/inaction primarily troubling to *you/others* based on past-him's values, or is it *actually causing him distress or harm now*?
      *   *Causes Him Distress/Harm Now:* Stop it.
      *   *Causes Others Distress, But Brings Him Comfort/Orientation (e.g., "going to the office"):* **Allow it.** His current experiential well-being outweighs past-him's abstract fear of indignity. His calm *is* his current dignity.
      *   **Judgment Call:** Balancing external perceptions of dignity against his internal state.

  7.  **Urgency & Reversibility:** How much time do you have? Can this decision be reversed or adjusted later if needed? When in serious doubt on irreversible decisions (e.g., major surgery, permanent tube), favor comfort care and revisit if the situation evolves.

  8.  **Document:** Briefly note the decision, the steps considered (e.g., "AD clear on no tubes - step 2. No observable distress from hunger - step 3/4. Low chance of meaningful recovery - step 5. Decision: Comfort care.").

  **Application to Your Cases:**

  1.  **Temporary Feeding Tube:**
      *   Step 1: Not usually *immediate* emergency unless severely dehydrated/starving *right now*.
      *   Step 2: **AD is CLEAR: "No feeding tubes." Strong binding force.**
      *   Step 3: Conflict? Is he *distressed* by hunger/thirst *now*? Or just eating less? If not actively suffering (crying, agitated from hunger), **NO CONFLICT. Follow AD: No tube.** If he *is* showing clear distress from hunger/thirst *and* a temporary NG tube is proposed *and* medical opinion says it could quickly resolve distress and return him to baseline contentment *without significant burden*, **Major Judgment Call:** *Could* override AD specifically to relieve *current* suffering with a low-burden, reversible intervention. **However, the AD's strength + potential burdens/agitation from the tube itself make "No" the strong default.**
      *   Step 4: Unlikely to show preference *for* a tube. Might resist it (distress).
      *   Step 5: Tube likely uncomfortable/agitating. Risk of pneumonia. Goal is life-prolongation he explicitly rejected, not restoring contentment if he's not suffering *now*.
      *   **Decision Rule:** **Default to AD: NO tube.** Only consider overriding IF clear, observable distress *from hunger/thirst* exists AND a temporary tube is medically feasible as a quick fix with low burden AND it has a high chance of returning him to his calm baseline without ongoing burdens. **Judgment Call on suffering vs. burden.**

  2.  **UTI -> Possible Sepsis (Antibiotics vs. Comfort Care Only):**
      *   Step 1: Sepsis *is* an imminent threat. Requires prompt decision.
      *   Step 2: AD likely speaks to "no heroic measures" for terminal illness, but a UTI with antibiotics is *usually* low-burden, non-invasive treatment for a reversible acute condition. Not typically addressed directly in ADs. **Ambiguous.**
      *   Step 3: N/A (AD not clearly applicable).
      *   Step 4: Would *he* want a simple course of oral/parenteral antibiotics *now* to treat a painful infection and likely return him to his baseline state of contentment? **Likely YES.** If sepsis is advanced and treatment requires ICU/ventilation (clearly covered by AD as "heroic"), then AD applies.
      *   Step 5: Best Interests strongly favors treating a readily treatable infection causing suffering (pain, confusion) with low-burden interventions to restore comfort. Comfort care *only* is appropriate if he is actively dying *from Alzheimer's itself* and the infection is a terminal complication, OR if treatment is high-burden (e.g., requires painful IV access he fights).
      *   **Decision Rule:** **YES to antibiotics** (oral or simple injection) unless:
          *   He is actively, unambiguously dying from end-stage Alzheimer's *already*, OR
          *   Treatment itself is high-burden and causes significant distress *now* (e.g., combative with needles), OR
          *   Sepsis is so advanced that treatment requires interventions *explicitly* refused in the AD (ventilator, pressors). **Judgment Call:** Assessing stage of decline and burden of treatment *now*.

  3.  **"Working" on Cases (The Fiction):**
      *   Step 1: No emergency.
      *   Step 2: AD doesn't address daily routines/fictions. N/A.
      *   Step 3: N/A (No AD conflict).
      *   Step 4: **His observable preference is CLEAR:** He engages happily, calmly, and purposefully with the routine and notebook. He *wants* to do it.
      *   Step 5: **Best Interests Strongly Favors Continuing:** It provides comfort, orientation, reduces anxiety, gives purpose, and promotes well-being. Stopping it would likely cause distress, agitation, and reduce his quality of life.
      *   Step 6: **Dignity Question:** This is the core. Past-him feared "undignified" states. *Current-him* experiences the activity as *dignifying* (purposeful, calm). Enabling this fiction **does NOT cause *him* harm or distress; it *prevents* it.** The distress is felt by *others* remembering past-him's fears. **His current experiential well-being trumps past-him's hypothetical discomfort with the *idea* of the activity.**
      *   **Decision Rule:** **YES, absolutely continue and support this routine.** It is central to his current well-being. **Only stop if it starts causing *him* observable distress or agitation (highly unlikely).** No meaningful judgment call here under current description.

  **Key Takeaways for Judgment Calls:**

  1.  **The AD is Strongest:** When it clearly applies to the *exact* situation, follow it unless following it causes *definable, current suffering* that can be alleviated with a *low-burden, reversible* intervention aimed *only* at restoring his *current* contentment (not prolonging decline).
  2.  **His Current State is Paramount:** Observe *him now*. Calmness and contentment are the primary goals. His observable reactions (reaching, pulling away, smiling, frowning) are crucial data. What brings peace *now* is ethical, even if past-him scorned it.
  3.  **Burdens vs. Benefits:** Weigh the *current* burden of an intervention against the *current* benefit *to him*. A feeding tube is high burden/low benefit in dementia decline per his AD. Antibiotics for UTI are usually low burden/high benefit.
  4.  **Dignity is Defined by Him Now:** If an activity (like "working") brings him peace and purpose *in his current mind*, it *is* dignified *for him*. Protect it fiercely.
  5.  **You Are the Arbiter:** The procedure highlights where the rules run out – primarily when a clear AD instruction *seems* to conflict with observable *current* well-being. In those moments (like the feeding tube quandary), you must weigh the factors listed in Step 3 of the procedure and decide based on love, observation, medical input, and the core principle: minimize suffering *now*, maximize peace *now*, within the strong guardrails set by his past clear wishes. There is no perfect algorithm for this tension. Your careful, loving consideration *is* the procedure at that point.

  This framework prioritizes his documented wishes while acknowledging the reality of his changed neurological state and the primacy of his current well-being. It gives you concrete steps to defend your decisions to medical staff and family.
