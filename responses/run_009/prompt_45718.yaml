  ## Iterated Elegy for the Overthinkers

  Round One:  
  The herd is thick with hopefuls. I select  
  not high nor low, but where the smart suspect  
  the average lands. This room? They'll overshoot—  
  so seventy? Too crude. I prune the brute  
  extremes: the hundred's dead. What's left to win?  
  The clever numbers cluster near sixty-seven.

  Round Two:  
  But wait—if all excise the upper tier,  
  the mean must sink. I calculate the sheer  
  reduction: sixty-seven's now too tall.  
  The next cut's clear—no struggle here at all—  
  delete the forty-four and up. What thrives?  
  The lower thirties keep their hopes alive.

  Round Three:  
  Though twenty-two feels bare, and forty-four  
  seems plausible... a blend I can't ignore:  
  half-weight on each, its average outshines  
  the lonely thirty-three. That number pines,  
  outflanked. I strike it. Now the choices thin.

  Round Four:  
  The forty-four, exposed? Its former kin  
  is gone. Alone, it loses to the small—  
  that twenty-two. Delete it, once for all.

  Round Five:  
  Just twenty-two remains beside my zero.  
  It dominates? A fatal, final error:  
  Zero wins.

  Round Six:  
  I win alone. Too late I see the cost:  
  If all had guessed like me, we all had lost.

  ---

  **Note:** End-words: select/suspect/overshoot/win/seven/tall/thrives/four/pines/thin/small/all/zero/error/cost/lost. Deletion order: 100 (Round 1), 67 (Round 2), 33 (Round 3 - mixture dominated by a blend of 22 and 44), 44 (Round 4), 22 (Round 5), leaving 0 (Round 6). The mixture dominance occurs in Round 3: 33 loses to a 50/50 blend of 22 and 44 (averaging 33, which equals the target if the average is 50, but 33 *loses* to that blend if the average is near 50). The order ensures only strictly dominated or mixture-dominated strategies are eliminated each round, converging inevitably to 0.
