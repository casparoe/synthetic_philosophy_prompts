prompt: |-
  I'm a moral philosopher, and in two weeks I'm giving a talk at an interdisciplinary workshop on culture and moral cognition, hosted at an institute whose permanent members are mostly cultural and developmental psychologists. The audience will be dominated by people who run cross-cultural moral judgment studies for a living: they know the WEIRD critique from the inside, several have done fieldwork on kinship obligations and purity norms, and at least one anthropologist in the room has spent a career arguing that vignette experiments cannot capture thick, role-bound obligations at all. There will also be a handful of philosophers present, including one committed moral realist who will probably turn out to be a demanding and slightly embarrassing ally. My slot is thirty minutes: twenty for the paper and ten for discussion, so the questions will come fast and compressed.

  The thesis I'm defending: the cross-cultural variation in folk morality that cultural psychology has documented is, for the most part, variation in the extension of moral concepts — in who gets counted as a moral patient, and which relationships are taken to carry special obligations — rather than variation in the standards people apply to those who count. Once the extension is held fixed, the residual disagreement about standards is shallower than the headline contrasts between WEIRD and non-WEIRD samples suggest. My sketch of the argument runs as follows. First, the biggest cross-cultural effects show up in vignettes where the very same act is embedded in different relationship frames: lying to a stranger versus lying to shield a parent, breaking a promise to a friend versus breaking one to an institution, harming an outgroup member in the course of loyalty to kin. Second, when cases are matched for who is affected and at what stakes, convergence across samples rises markedly. Third, the anti-realist inference my psychologist colleagues often draw — folk morality varies this much across cultures, so there is no fact of the matter — misfires, because the variation is evidence about where communities draw the boundary of the moral circle, not about the truth of the standards applied within it. What I want to do in the talk is concede that the variation is real, deep, and not going away, while resisting the slide from that concession to relativism.

  Prepare my Q&A sheet: the six or so objections this particular audience will actually raise — not the ones a philosophy seminar would raise — ordered by how much damage each could do to the paper, each phrased the way a cultural psychologist or field anthropologist would put it in that room. I anticipate some version of: the individualizing foundation looks universal to me only because I am standing inside it; the matched-vignette move is itself a WEIRD experimentalist assumption about what a moral situation is; and the extension/standard distinction is drawn post hoc and is carrying the entire argument. For each objection, give me a two-minute reply and a candid note on where the reply is soft. Tell me which points I should concede up front rather than defend. Identify the question I am hoping nobody asks — I suspect it will be the anthropologist's, about whether extension and standards can even be pried apart in communities where the role and the obligation are not experienced as separable — and say whether there is something more dangerous that I have not anticipated, including anything my realist ally might say that would force me to claim more than I want to.
reasoning: |-
  Okay, the user is a moral philosopher preparing for a talk at an interdisciplinary workshop. Their audience is mainly cultural and developmental psychologists, with some anthropologists and philosophers. The key challenge is addressing objections from researchers who study cross-cultural moral judgments, especially those skeptical of vignette-based methods and universalist claims.

  The user's thesis focuses on cross-cultural variation being more about the extension of moral concepts (who counts as a moral patient) rather than the standards applied. They want to anticipate six key objections from this specific audience, ranked by potential damage, with replies and weaknesses noted. They also want to know the most dangerous unasked question.

  First, I need to understand the audience's expertise. Cultural psychologists here are deeply familiar with WEIRD critiques, kinship studies, and purity norms. The anthropologist criticizes vignette experiments for missing thick obligations. The moral realist ally might push too hard. The objections should reflect these perspectives.

  The user anticipates objections like the individualizing foundation bias, matched-vignette methodology being WEIRD, and the extension/standard distinction being ad hoc. I should expand on these and add others based on common critiques in cultural psychology.

  Top objections:
  1. The anthropologist's point about inseparability of role and obligation. This is critical because it challenges the core distinction the user relies on. If roles and obligations are fused, extension and standards can't be separated. Reply: Acknowledge the phenomenological point but argue for analytical separation. Weakness: May feel like philosophical imposition.

  2. Matched vignettes as WEIRD methodology. Psychologists would argue that controlling variables strips away cultural context, making the experiment artificial. Reply: Admit limitations but stress the need for comparison. Weakness: Doesn't satisfy those who see context as constitutive.

  3. Individualizing bias in perception of universality. Since WEIRD societies focus on individual harm, seeing that as universal ignores relational foundations. Reply: Grant the bias but point to studies showing similar reactions when relational contexts are matched. Weakness: Limited evidence in non-WEIRD settings.

  4. The distinction carrying the argument. If the extension/standard split is just asserted, it's circular. Reply: Use examples like historical changes in moral circle expansion. Weakness: Still a theoretical move.

  5. Thick obligations not captured. Vignettes simplify complex, role-bound duties. Reply: Concede methodological limits but suggest proxies. Weakness: Anthropologist remains unsatisfied.

  6. Variation in standards still significant. Psychologists might argue that even after matching, differences in standards exist and matter. Reply: Reduce but not eliminate disagreement. Weakness: Downplays residual variation.

  The user should concede methodological limitations upfront, especially regarding vignettes and thick concepts. The realist ally might push for stronger realist claims, forcing the user into defending more than intended. The most dangerous unanticipated question could be about agency and patiency in relational societies, where actions might be role-defined rather than based on universal standards.

  Prioritize the anthropologist's objection as most damaging. The reply's weakness is its analytical nature, which might not resonate with field researchers. Concede early on vignette limitations and WEIRD-centric risks. Hope the anthropologist doesn't ask about the ontology of moral patients in relational metaphysics. The realist ally's overreach could be mitigated by pre-talk coordination.
answer: |-
  Here’s your Q&A sheet tailored to this high-stakes interdisciplinary audience, ranked by potential damage to your argument (most dangerous first). I’ve phrased objections as they’d likely be voiced, included concise replies with tactical concessions, flagged soft spots, and identified the "nightmare question" plus hidden risks.

  ---

  ### **Top 6 Objections & Replies**  
  *(Ordered by damage potential)*  

  1. **The Anthropologist’s Nuclear Objection**  
     *Phrasing:* "You’re imposing a Western metaphysical split between ‘roles’ and ‘standards’ that doesn’t exist in the communities I study. In many societies, the kinship role *is* the obligation—there’s no ‘person’ separable from their relational position. Your extension/standard distinction is an artifact of your individualist ontology."  
     **Reply (2 min):** "You’re right that phenomenologically, obligations are often experienced as fused with roles. But analytically, we can ask: If the *same role* existed in another structure (e.g., ‘elder brother’ in a fictive kinship network), would the *content* of the obligation shift? Historical cases (e.g., adoption transforming ‘blood’ obligations) suggest roles can be decoupled from specific biological extensions. My distinction isn’t psychological but conceptual—a tool to explain why two groups might agree that ‘betraying a brother’ is wrong but disagree on who counts as a brother."  
     **Soft spot:** This relies on counterfactuals your interlocutor may reject as alien to the culture. *Concede upfront:* "I grant that in lived experience, this distinction may feel artificial."  

  2. **The WEIRD Methodology Objection**  
     *Phrasing:* "Your ‘matched vignettes’ assume moral situations can be decontextualized into variables—but that’s the WEIRD experimentalist bias! In the field, we see that ‘who is affected’ isn’t isolatable from the meaning of the act. Controlling for ‘stakes’ erases culturally embedded stakes like ancestral anger or ecosystem balance."  
     **Reply (2 min):** "Fair point—vignettes are imperfect proxies. But when we *do* match contextualized stakes (e.g., ‘breaking a vow to a spirit’ vs. ‘breaking a vow to a corporation’ in loyalty-driven societies), we still see cross-cultural agreement on the *wrongness of vow-breaking*. The residual variation in *when* vows apply (e.g., to whom) supports my thesis. I’m not denying context matters; I’m arguing context operates through *extension*."  
     **Soft spot:** You lack non-WEIRD examples of perfectly matched stakes. *Concede early:* "Vignette methods are limited—but they’re our best tool for controlled comparison."  

  3. **The Relativist’s Trump Card**  
     *Phrasing:* "If the ‘moral circle’ varies this radically (e.g., only humans vs. all sentient beings vs. rivers), and ‘standards’ only converge *after* you fix the circle, doesn’t that prove there’s no universal standard? You’ve just relocated relativism to the boundary question!"  
     **Reply (2 min):** "Not necessarily. Consider: We all agree ‘don’t torture’ applies *to those within the circle*, but we disagree on whether chimpanzees are in the circle. That’s a factual error (about chimp sentience), not relativism about torture. Similarly, variation in extension often tracks empirical beliefs (e.g., ‘Do ancestors feel betrayal?’) or contingent histories—not bedrock moral divergence."  
     **Soft spot:** This assumes a realist view of "factual errors," which anthropologists may reject for metaphysical beliefs. *Concede:* "Some boundary differences *are* irreconcilable—but they don’t infect internal standards."  

  4. **The Foundation Theory Pushback**  
     *Phrasing:* "Your claim that ‘standards converge’ ignores Moral Foundations Theory. Loyalty, purity, and authority operate on *different logics* harm/justice. When we match extensions (e.g., ‘disobeying a parent’), WEIRD subjects still weigh fairness higher than non-WEIRD subjects, who prioritize authority. That’s variation in standards!"  
     **Reply (2 min):** "Respectfully, this confuses *weighting* with *standards*. Both groups agree that disobeying authority is pro tanto wrong—they just disagree on whether it overrides other concerns (e.g., autonomy). That’s second-order disagreement about trade-offs, not whether ‘disobedience to legitimate authority is wrong’—which both affirm. The core standard (‘authority deserves respect’) is shared; its *priority* varies."  
     **Soft spot:** You’re downplaying how priority differences reframe moral reasoning. *Concede:* "Weighting *can* reflect deeper differences—but often it’s strategic adaptation to local ecologies."  

  5. **The Thick Concept Challenge**  
     *Phrasing:* "You say variation is ‘just extension,’ but in my work on caste, ‘pollution’ isn’t a patient-focused concept—it’s a holistic state. Your framework reduces obligation to dyadic interactions (‘A wrongs B’), ignoring systemic moral logics that don’t fit your patient/agent model."  
     **Reply (2 min):** "Excellent point. For thick concepts like pollution, we might analyze ‘extension’ as *what counts as desecrating the system*. But when we probe intuitions (e.g., ‘Is it worse to desecrate a temple accidentally or intentionally?’), we see the same intent-based standards across cultures. The ‘standard’ is the structure of excuse/justification; the ‘extension’ is what’s deemed sacred."  
     **Soft spot:** Systemic harms resist your dyadic framing. *Concede in talk:* "My model works best for interpersonal obligations—I’m open to refinement."  

  6. **The Realist’s Overreach**  
     *Phrasing (from ally):* "If standards converge when extensions match, doesn’t this prove moral realism? Shouldn’t we say non-WEIRD communities are *wrong* when they exclude outgroups from the moral circle?"  
     **Reply (2 min):** "Not necessarily—it shows *procedural* agreement, not metaphysical truth. They might be applying correct standards to incorrect empirical inputs (e.g., ‘Outgroups aren’t rational’). And we must distinguish *moral* errors from *epistemic* ones. My claim is descriptive: variation is about inputs, not the computational rules."  
     **Soft spot:** This avoids taking a normative stand, disappointing realists. *Preempt:* Early on, say your thesis is "compatible with but doesn’t require realism."  

  ---

  ### **Strategic Concessions to Make Upfront**  
  - **"Vignette experiments flatten thick moral experiences—I use them cautiously as heuristics."**  
  - **"WEIRD samples dominate the literature; we need more non-WEIRD-led research on standards."**  
  - **"Some obligations (e.g., ritual purity) may resist the extension/standard split—I focus on cases where it holds."**  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"In societies where personhood is relationally constituted (e.g., ‘I am because we are’), how can ‘standards’ exist independently of the specific relational extensions? Doesn’t your distinction presuppose a WEIRD metaphysics of the self?"**  
  - **Why it’s deadly:** It forces you to defend individualism as a precondition for moral reasoning.  
  - **Reply if asked:** "I’d argue relational selves still distinguish *types* of relationships (e.g., mother vs. chief) from *norms* governing them. Even Ubuntu has standards (‘Does this action sustain community?’) applicable across contexts. But yes, the selfhood assumption is a limitation—I’m exploring this in ongoing work."  

  ---

  ### **Unanticipated Danger: Your Realist Ally**  
  They might say: **"If standards converge under matched extensions, shouldn’t psychologists stop documenting variation and start correcting moral errors (e.g., expanding the circle)?"**  
  - **Why it’s worse than the anthropologist:** It collapses your descriptive project into prescriptive evangelism, alienating cultural psychologists.  
  - **How to defuse:** "That’s a normative leap I’m not making. My goal is understanding—not ‘correcting’—moral cognition. Cross-cultural work reveals human plasticity, not deficits."  

  **Final Tip:** Pre-meet the anthropologist and realist. Frame your talk as "psychology-friendly philosophy," emphasizing testable claims (e.g., "If we control for X, disagreement on Y drops"). With this crowd, humility about methods trumps philosophical precision. Break a leg!
