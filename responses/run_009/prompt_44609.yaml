  The user's main objection is that this seems like a bluff. If the threatener can distinguish between your surrogate and terminal goals, they'll realize that ex post (after the threat is made), you wouldn't actually sacrifice your real values to punish something trivial. This is where the distinction between causal and acausal settings becomes crucial.

