  **Signatures:**

  **(Mencius Faction Representative)** ________________________________________ Date: ___________

  **(Xunzi Faction Representative)** _________________________________________ Date: ___________

  ---

  **Key features for your groups:**

  1.  **Neutral Framing:** Each faction's view in the disagreements table is stated in terms *they* would accept, using their key metaphors (sprouts, extension vs. crooked wood, steamer, accumulation).
  2.  **Shared Foundation:** Section I establishes genuine common ground, preventing the statement from being purely adversarial.
  3.  **Clear Cruxes:** The three cruxes pinpoint the *specific* points of empirical contention underlying the philosophical differences.
  4.  **Testable Predictions:** Each faction makes concrete, falsifiable predictions about what kind of evidence would support their view for each crux. This shifts the debate towards observable reality.
  5.  **Semantic Clarification:** Explicitly addresses the *xing* definition problem and separates it from the deeper empirical disagreements.
  6.  **Honest Substantive Remainder:** Clearly states the 4 core disagreements that survive semantic clarification and are "about the world."
  7.  **Structured & Actionable:** Provides a clear framework for future discussion and evaluation of evidence. The signatures formalize the collaboration.
  8.  **Respectful Tone:** Maintains a scholarly, collaborative tone focused on shared inquiry.

  This draft provides a solid foundation for your group to move beyond circular arguments and engage with the substantive, potentially resolvable differences between these two towering figures of Confucian thought. Good luck!
