prompt: |-
  I'm writing a novel where a minor character, Dr. Okonkwo, is an ethicist on some UN-adjacent committee that reviews space settlement proposals, and I want her to stay consistant across the book. Her track record so far: she approved a small international lunar research base; she voted down a Mars terraforming program on the grounds that it could wipe out any native microbes before we've even looked; she approved a privately funded orbital seed-and-data vault meant as a backup for Earth's biosphere; and she rejected a corporate Mars town where children born there would inherit company contracts they couldn't buy their way out of. Now in the chapter I'm drafting a new proposal lands that I honestly can't figure out her position on: a generation ship to another star, crewed entirely by adult volunteers, but their kids will be born mid-flight into a mission they never chose and physically cannot leave. The funding comes from billionaires who insist they'd otherwise spend it on yachts, not on foreign aid. What would she rule, if she wants to be consistent with herself? As far as I can tell at least three rules fit her record — an exit-rights/consent rule, a don't-divert-resources-from-Earth's-problems rule, and a don't-harm-biospheres rule — and they pull in different directions here, so I'd also like to know which rule you think she's really running and why, plus one more proposal I could slip into an earlier chapter that would settle which of those it is. Answer in American English please, and don't worry about spoiler-free, she's not the narrator.
reasoning: |-
  Okay, the user is writing a novel and needs help with a character decision. Dr. Okonkwo is an ethicist on a space committee, and her past rulings show a pattern. Let me list them out to see her principles.

  First, she approved a lunar research base. That's international and scientific, probably low risk and cooperative. Then, she rejected Mars terraforming because of potential native microbes. So she values preserving existing life. Next, she okayed an orbital seed vault as a backup for Earth. That's about protecting Earth's biosphere without harming others. Lastly, she turned down the Mars company town because of inherited contracts. That's clearly about consent and freedom, especially for children.

  Now the new proposal: a generation ship. Adults volunteer, but their kids are born on the ship with no exit. Funding from billionaires who'd spend it on yachts otherwise. The user mentions three possible rules: exit-rights/consent, not diverting resources from Earth, and not harming biospheres. These conflict here. The kids' lack of consent clashes with the resource argument (since the money wasn't going to Earth anyway) and no harm to biospheres since it's a spaceship.

  I need to figure out her core principle. Her rejection of the Mars town was strong on consent, especially for children. The Mars microbes show precaution for existing life, but that's not the issue here. The seed vault was about Earth's preservation, but the funding here isn't taking away from Earth aid. The billionaire funding is a loophole—money that wouldn't help Earth otherwise. But does that matter to her?

  Her ruling against the Mars company town was all about the children's lack of autonomy. That seems central. The generation ship's kids have even less choice—trapped in a mission they didn't choose. Even with the best conditions, they can't leave. That's a huge ethical problem for someone who values consent.

  The resource diversion might be secondary. She might oppose using resources for space instead of Earth, but in this case, the billionaires claim they'd spend it on yachts. Would she buy that? Maybe not, but it's a weaker argument here. The consent issue is stronger and more consistent with her past decision.

  So her core principle is probably individual autonomy, especially for the vulnerable. The earlier Mars town rejection confirms that. To settle this, adding a prior case about children's rights in space would clarify. For example, a proposal for a space orphanage or educational facility where kids can't leave. Her rejection would show that consent is non-negotiable.

  Therefore, for the generation ship, she'd reject it because of the children's lack of exit rights. The funding source doesn't override that fundamental issue. Adding the orphanage example earlier would reinforce this principle, making her decision consistent.
answer: |-
  Based on Dr. Okonkwo's established track record and ethical reasoning, she would **reject the generation ship proposal**. Her core principle, revealed by prioritizing consent and exit rights for the vulnerable (children) over other concerns, is the deciding factor.

  Here's the breakdown of her consistent reasoning applied to this proposal:

  1.  **Exit-Rights/Consent Rule (STRONG REJECTION):** This is her *dominant* principle. The situation of the children born aboard the ship is ethically identical to the children born in the corporate Mars town she previously rejected. These children:
      *   Are born into a situation they did not choose.
      *   Are subjected to the mission's risks, constraints, and societal structure without consent.
      *   Have **no physical possibility of exit**. They cannot leave the ship, return to Earth, or choose a different life path. This is an *extreme* and irreversible denial of autonomy.
      *   Her rejection of the Mars town solely on the basis of inherited unbreakable contracts demonstrates that the *inability to leave or choose a different path* is a fundamental red line for her. The generation ship scenario crosses this line even more dramatically.

  2.  **Don't-Harm-Biospheres Rule (NEUTRAL/IRRELEVANT HERE):** This principle isn't triggered in this specific proposal. The generation ship is a closed system traveling through interstellar space. While it *might* eventually interact with another star system, the proposal itself focuses on the journey and the crew, not planetary interaction at the destination (which would be a separate future proposal). Her primary concern (preserving *existing* potential biospheres) isn't applicable to the vacuum of space or the ship itself.

  3.  **Don't-Divert-Resources Rule (WEAK/MITIGATED CONCERN):**
      *   **Argument Against Acceptance:** The vast resources *could* theoretically be used to address Earth's pressing problems (poverty, climate change, disease) instead of funding an extremely speculative, multi-generational vanity project for billionaires.
      *   **Argument Mitigating Concern:** The billionaires' claim ("we'd just spend it on yachts otherwise") *does* hold some weight. If the money genuinely wouldn't go to Earth aid regardless, withholding approval doesn't *free* those resources for Earth; it just means they get spent on luxury consumption instead of the starship. Dr. Okonkwo might find this distasteful, but her record shows she makes *positive* decisions (approving the lunar base, the seed vault) based on their inherent merits or lack of harm, not solely based on opportunity cost *unless* the alternative use is demonstrably better and feasible (which the "yachts" argument negates).
      *   **Conclusion:** While she likely dislikes the source and scale of funding for such a project, the "otherwise yachts" argument weakens the *resource diversion* objection enough that it wouldn't override a proposal she found ethically sound otherwise. However, since the consent issue is fatal, the resource argument becomes secondary.

  **Her Core Principle: Individual Autonomy and Consent, Especially for the Vulnerable**

  Dr. Okonkwo's rulings reveal that her foundational ethic is **protecting individual autonomy and requiring consent, particularly for those who cannot give it (children) or who are placed in situations where exit is impossible.** She prioritizes this above:

  *   **Scientific Ambition:** (Rejecting Mars terraforming due to potential harm outweighing potential knowledge gain).
  *   **Commercial Interests:** (Rejecting the Mars company town due to indentured children).
  *   **Resource "Efficiency" Arguments:** (The "otherwise yachts" claim doesn't negate the fundamental wrong done to the children on the ship).
  *   **Potential Future Benefits:** (The seed vault was approved as a *backup* for Earth life, a direct preservation benefit with minimal immediate harm; the generation ship's benefits are highly speculative and centuries away, bought at the cost of condemning generations to captivity).

  Her approval of the lunar base (adult scientists, temporary, minimal harm risk) and the seed vault (preservation, no direct harm, no captive population) fit within this framework. Her rejections consistently target violations of autonomy and potential harm to the non-consenting.

  **The Ruling:**

  Dr. Okonkwo would reject the generation ship proposal. Her statement might include:

  > *"While the spirit of exploration and the potential long-term survival of humanity are worthy goals, they cannot justify the creation of a permanent, inescapable prison for generations yet unborn. The voluntary consent of the adult founders does not extend to their descendants, who will be born into a life sentence with no possibility of parole, reprieve, or escape. The fundamental human right to self-determination and the ability to choose one's own path cannot be sacrificed on the altar of ambition, regardless of the funding source. The ethical flaws inherent in condemning generations to a life without exit are insurmountable and render this proposal unacceptable."*

  **Proposal to Add Earlier to Settle the Core Principle:**

  To definitively establish that her *dominant* principle is **consent/exit rights for children**, especially over resource arguments, add a minor proposal earlier where she **rejects a "Space Orphanage / Educational Facility."**

  *   **The Proposal:** A well-funded (perhaps even philanthropic) initiative to build a dedicated orbital habitat designed as a permanent home and school for orphaned or disadvantaged children from Earth, offering "a life free from terrestrial strife" and elite education focused on space sciences.
  *   **The Catch:** Children brought there (even voluntarily by guardians initially) would *not* be able to return to Earth or easily transfer to other space habitats/locations until adulthood (if ever). It's presented as a stable, idyllic, but closed environment.
  *   **Dr. Okonkwo's Rejection (Establishing the Principle):** She votes no, arguing forcefully: *"However noble the intent, this facility creates a population of children who cannot leave. They are denied the fundamental choice of environment, community, and future path. Removing terrestrial problems does not justify replacing them with a gilded cage in orbit. Consent cannot be given by guardians for a permanent, irreversible change in a child's life prospects that removes their freedom of movement and choice. We cannot build benevolent prisons for children, no matter the educational advantages offered or the problems we seek to solve."*
  *   **Why it Settles the Core Principle:** This directly pits the well-being and resource argument ("better life, elite education") against the consent/exit right principle, in a context *without* other complicating factors like harming alien life or corporate exploitation. Her rejection here shows that **the right to exit and future self-determination for children is non-negotiable**, even when the alternative life offered might seem objectively "better" than their Earthbound prospects and the resources aren't being actively diverted from aid (it's a dedicated project). This makes her generation ship rejection utterly predictable and consistent.
