prompt: |-
  I'm a third-year PhD student, and in a few weeks I'm presenting at a small interdisciplinary workshop on causation in the special sciences. My paper defends a version of the view that there is, strictly speaking, no such thing as causation by omission — no absence ever does anything, nothing in the world answers to "the failure to water caused the death." But I go a step further than the usual line: I argue true omission claims aren't just loose talk either; they're compressed claims about which ordinary, positive causal chains actually occurred, evaluated against a contrast class fixed by a norm (a role, an expectation, a regulation). So "the nurse's failure to check the drip caused the collapse" is elliptical for something like: within the range of cases the nurse's role requires, the actual positive chain (no check occurred, the infusion kept going, the collapse followed) is a difference-maker for the collapse, while "the failure" itself is not a relatum of any causal relation. The norm does no causal work — it only selects which counterfactuals are relevant.

  The audience is tough, kind of deliberately assembled: about half experimenal philosophers who've run studies showing ordinary judgments about omissions track norms (they'll treat my view as just confirming their data and then ask why I need the metaphysics on top of it), two hard-line process theorists who think absences are nonstarters and will be annoyed I concede them anything at all, and one legal scholar who works on tort liability for negligent omissions and has heard a hundred philsophers tell her that her cases "dissolve on analysis" — she will not be charmed by that move again. No interventionists in the room, which is a blessing, though the legal scholar knows that literature well enough to use it as a club if it helps her.

  Can you prep me for the Q&A? List the objections I'll actually get from this crowd, roughly in the order they'll arrive and ordered by how much damage each could do, phrased the way each type of person would actually phrase it. For each one give me a reply I can deliver in about two minutes, flag where the reply is honestly soft, and mark the question I'm hoping nobody asks. And if there's something I should just concede in the talk itself so it doesn't look like a retreat when it comes up later, tell me that too.
reasoning: |-
  Okay, the user is a third-year PhD student preparing for a workshop presentation. They're defending a nuanced view on causation by omission, arguing that omissions aren't causal but are elliptical claims about positive causal chains evaluated against norms. The audience is interdisciplinary and potentially hostile, including experimental philosophers, process theorists, and a legal scholar.

  First, I need to understand the key elements of their position. They're saying that when people claim "the failure to water caused the death," it's not literally true that the absence caused anything. Instead, it's shorthand for identifying a positive causal chain (like dehydration processes) that occurred because someone didn't act, and this is highlighted by a norm (like a gardener's duty). The norm sets the contrast class but doesn't do causal work.

  The audience breakdown is critical. The experimental philosophers have data showing norms influence omission judgments. They might see the user's view as compatible with their findings but question why metaphysical claims are necessary. The process theorists reject any role for absences in causation and might think the user is conceding too much by giving omissions any legitimacy. The legal scholar is tired of philosophers dismissing legal concepts and might use interventionist theories to challenge them.

  For Q&A prep, I should anticipate objections in order of appearance and impact. The first question will likely come from the experimental philosophers, asking why metaphysics is needed when their data already explains omission judgments. This is a medium-risk question because it challenges the paper's foundation. The user should respond by distinguishing their metaphysical claim from descriptive accounts, emphasizing that norms don't causally explain but frame our judgments. They must avoid sounding dismissive of empirical work.

  Next, the process theorists will attack the use of norms, arguing it smuggles in absences. This is high-risk because it questions internal consistency. The user needs to clarify that norms are epistemic tools for selecting counterfactuals, not part of causation itself. Conceding that "failure" language is pragmatic early in the talk could prevent this from seeming like a retreat later.

  The legal scholar might bring up tort cases where omissions are directly causal, like failure to maintain equipment leading to harm. This is high-risk and requires showing respect for legal practice while maintaining their theory. The user should explain that legal responsibility doesn't require literal causation, and their view supports attributions based on norm violations without ontological commitments. They must avoid sounding dismissive of legal realities.

  The nightmare question would be about symmetric omissions, like two guards failing to stop a theft. The user's theory might struggle to explain why one is blamed over the other without invoking the norm directly in causation. They should admit this is a challenge but argue that norms resolve the ambiguity by defining relevant duties. This part is soft and needs careful handling.

  For concessions, the user should preemptively state that "failure" is pragmatic to avoid later backtracking. Emphasizing that norms are part of how we describe, not what exists, can placate process theorists. Acknowledging the legal scholar's concerns upfront might prevent confrontations.

  Overall, the user needs to balance firmness in their metaphysical claims with flexibility in accommodating interdisciplinary perspectives. Highlighting the utility of their view for different fields without overstepping boundaries is key. Preparing clear, concise responses that address each group's core concerns while admitting limitations where necessary will help them navigate the Q&A successfully.
answer: |-
  Here's your Q&A battle plan, structured by threat level and speaker type, with responses tailored to each group's concerns. I'll flag soft spots and strategic concessions.

  **Order & Damage Assessment:**  
  1. **Experimental Philosopher (Medium Damage, First Mover)**  
     *Objection:* "Your 'elliptical' account just repackages our empirical findings—that norms frame omission judgments. Why layer metaphysical claims ('no causal relata') on top? Isn't this just descriptive psychology with extra steps?"  
     *Reply:* "Crucially, my claim isn't just that norms *influence judgments* (your data brilliantly show that), but that they resolve *reference* without invoking causal relata. When we say 'the failure caused X,' we're not referring to an absence in the world; we're using the norm to pick out which actual positive chain (e.g., the dehydration process) is salient *as* the difference-maker. The metaphysics clarifies why your subjects aren't tracking a *sui generis* causal relation—they're tracking norm-relative contrasts *within* positive causation. Without this, we risk reifying absences as causal actors."  
     *Soft Spot:* If pressed hard, conceding that the *pragmatics* of causal language heavily depend on psychology may feel like retreating from metaphysics. Stand firm on ontology.

  2. **Process Theorist (High Damage, Early Aggressor)**  
     *Objection:* "You admit omission claims can be 'true'—but only by smuggling in norms! If causation is physical processes, norms are irrelevant. Your 'elliptical' move just camouflages the absurdity of absences causing anything."  
     *Reply:* "I agree norms aren't *part* of causation—they're epistemic tools for *describing* it. The truth-maker for 'failure to water caused death' is still entirely positive: the biological process of dehydration occurring *because* no interrupting action (watering) happened. The norm merely fixes which *non-occurrence* we contrast with actual events (e.g., 'watering occurred' vs. 'not watering'). But the causal work is done by H₂O molecules, not duties. This avoids your concern: no absences in the causal *relata*, only in the *description*."  
     *Soft Spot:* Process theorists may demand you abandon "true omission claims" entirely. Hold the line: truth is about *what the statement corresponds to* (positive chains), not its surface grammar.

  3. **Legal Scholar (High Damage, Mid-Q&A)**  
     *Objection:* "Tort law holds people liable for *not* acting (e.g., failing to fix a gas leak). You say omissions aren't causal, but juries need to assign responsibility *for outcomes*. If your view 'dissolves' omissions into norms + positive chains, how does it help courts? Isn't this just obscurantism when we need answers?"  
     *Reply:* "It *supports* legal practice! Courts aren’t tracking metaphysical causation but *responsibility*. My view shows why: when we say 'your omission caused harm,' we mean (a) a positive causal chain occurred (gas explosion), (b) your *actual* conduct (not fixing) was a difference-maker vs. your *norm-required* conduct (fixing), and (c) the norm defines that contrast. This grounds liability without needing absent entities—we blame you for *what you did* (ignoring the leak) against what you should have done. It’s not dissolution; it’s precision."  
     *Key Move:* Acknowledge law’s needs upfront. Say early in your talk: **"Concession: Legal responsibility often turns on norm violations—my aim isn't to undermine that, but to show how it *coheres* with causation being purely positive."**

  4. **Experimental Philosopher Follow-Up (Low Damage)**  
     *Objection:* "If norms just 'select counterfactuals,' why do our studies show people *disagree* about omissions when norms conflict (e.g., was it the nurse’s *or* the hospital’s fault?)?"  
     *Reply:* "Exactly! Disagreements arise because different norms select different contrast classes (e.g., nurse’s duties vs. hospital protocols). But the underlying causation is unchanged: the same positive chain (drip unchecked → overdose) exists. My view predicts and explains this variation—it’s a feature, not a bug."

  5. **Process Theorist Follow-Up (Nightmare Question—Pray It Doesn’t Come)**  
     *Objection:* "Take symmetric omissions: Two guards independently fail to lock a door, thief enters. Normally, we'd say *both* omissions caused the theft. But on your view, the 'actual positive chain' is just the thief’s entry. How can contrasting *two* absent actions against norms pick out *one* causal chain? This forces you to make norms causally generative!"  
     *Reply:* "Neither omission is a cause; the thief’s actions are the cause. But we can truthfully say 'Guard A’s failure caused it' if *their* norm (job description) makes *their* inaction the salient difference-maker from required action (locking). We say the same of Guard B relative to *their* norm. But crucially, it’s not that two omissions caused one event—it’s that two *statements* about the same causal chain are true relative to two norms."  
     *Soft Spot:* This strains intuition. Emphasize: "We’re not multiplying causes; we’re multiplying *true descriptions* of the same cause."

  **Strategic Concessions to Bake Into Your Talk:**  
  1. **Explicitly disavow** that "failure" refers to an entity. Say: *"When I say 'the failure occurred,' I mean only that a norm-expectation was unmet—not that an absence exists."*  
  2. **Praise the legal scholar’s domain upfront**: *"In contexts like tort law, norm-based responsibility attribution is indispensable—my account aims to show how it aligns with causation, not replace it."*  
  3. **Acknowledge experimental work**: *"As X-Phi shows, norms *do* shape how we identify omissions—but my claim is about what makes those judgments *true*."*

  **Final Tip:** When pressed, pivot to: **"My view isn’t eliminating omissions—it’s *reducing* them to positive causation + normative context. That’s a feature: it explains their usefulness without mysterious metaphysics."**  

  You’ve got this. Your view is nuanced and defensible—just steer clear of "dissolving" language and emphasize *explanatory utility* for each group’s concerns. Good luck!
