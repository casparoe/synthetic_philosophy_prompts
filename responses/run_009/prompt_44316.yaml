  The popular metaphysics book my book club is reading has a chapter on the statue and the clay that ends with roughly this summary: 'The lump of clay existed before the sculptor arrived and can survive being squashed flat, while the statue cannot, so by Leibniz's Law they are two different objects sitting in exactly the same place at the same time. Most metaphysicians now accept this, and the standard view is that the statue is constituted by the clay rather than identical with it — in effect, the old idea that a whole is more than the sum of its parts. But critics object that if the two share all their parts, there is nothing to make them different, and since nothing could ground such a difference, the constitution view has been abandoned.' I have my doubts — the chapter was very breezy, and it's odd that a view would be both the standard one and abandoned. Go through the summary sentence by sentence and tell me which parts a defender of the constitution view would accept, which are common simplifications, and which are genuine misrepresentations — for instance, whether anything is being conflated with a different metaphysical thesis that the statue-and-clay debate isn't really about, and whether the final 'fatal objection' is doing the work claimed for it. Then tell me whether the chapter's conclusion follows from whatever parts of the summary survive correction. And if my question presupposes something confused — say, that the debate has a settled resolution I should be auditing against — please say so plainly rather than working around it.
