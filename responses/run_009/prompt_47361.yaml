prompt: |-
  I'm part of a small reading group that works through AI-risk and AI-governance material, and we've hit a disagreement I can't resolve on my own. The topic is the strategy-stealing assumption, which the group knows from a 2019 essay by Paul Christiano on the AI Alignment Forum. As he introduces it, the assumption is that "for any strategy an unaligned AI could use to influence the long-run future, there is an analogous strategy that a similarly-sized group of humans can use in order to capture a similar amount of flexible influence over the future." The upshot, as we've been using it, is that a misaligned AI shouldn't be expected to win by out-clevering its defenders: whatever it could do, a sufficiently resourced group of humans (with comparably capable aligned AI doing the stealing) could in principle do too. Several of us have been leaning on this to rule out a whole family of takeover scenarios.

  One member now argues that the assumption is refuted outright, and the argument has stuck with me because I cannot locate the false step and because its conclusion appears to prove far more than anyone in the room wants to accept. Here it is as I best understand it:

  (1) Strategy-stealing assumption: for any strategy an unaligned AI could use, there is an analogous strategy available to a similarly-sized group of humans, so a misaligned AI cannot gain a decisive advantage through access to strategies its defenders lack; any advantage must come from raw capability or resources, not from the strategy space being asymmetrically open.
  (2) Some of the most powerful strategies in any conflict are coalition strategies: distributed monitoring, redundancy, division of labor, commitment devices that work only when many independent parties bind themselves to punish defectors together. The power of these strategies consists in being many.
  (3) A human coalition can execute a coalition strategy only by paying coordination costs: building trust, negotiating for months, absorbing defections, reconciling divergent interests. A misaligned AI — one goal system running many perfectly coordinated copies — pays none of these costs; its coalition is unified by construction rather than by treaty.
  (4) Therefore there are strategies available to a misaligned AI for which no analogous strategy is available to a human group: the human analogue exists in name but not at the same cost, speed, or reliability, and the gap is not a difference in resources but in the feasibility conditions of the strategy itself.
  (5) Since asymmetries of exactly this kind are what strategy-stealing was supposed to rule out, the assumption is false, and a misaligned AI can gain a decisive advantage through strategies defenders cannot use.
  (6) Generalize: nothing in the argument turns on the adversary being an AI. Any internally unified adversary — a single state, a single firm, a single network — enjoys the same advantage over any coalition, because its internal coordination is constitutive where the coalition's is negotiated. So no coalition should ever be able to resist a unified adversary.
  (7) Yet coalitions have resisted unified adversaries, if barely and only eventually: it took seven of them to bring down Napoleonic France. If (6) were true, (7) should be impossible.

  The conclusion I am invited to accept is that (5) is correct and that (6) merely exposes why the historical cases differ: human coalitions were facing adversaries whose unity was imperfect and expensive to maintain — states can be split, bribed, and out-waited — whereas a misaligned AI's unity is a matter of what it is. On that reading the argument does not prove too much; it proves exactly what it should, and strategy-stealing is dead. I want to resist, but not by hand-waving, because if the assumption goes, the takeover scenarios I had been discounting come back onto the table.

  Please do three things. First, tell me which step, if any, to reject, being explicit about readings: I suspect the argument turns on whether "analogous" and "available" in the assumption mean available-in-principle-given-comparable-resources or available-at-comparable-cost-speed-and-reliability, and on whether anything in the assumption's own wording commits it to one of those. Second, run the generalization test honestly in both directions: if the argument proves too much in the human case, identify the disanalogy that saves the assumption there, and then check whether that disanalogy also protects the assumption in its original AI application or only against the historical analogy — if the disanalogy does not transfer, for instance because the coalitions against Napoleon got repeated tries against a slow human adversary while a sufficiently fast AI takeover might not afford retries, say so plainly rather than rescuing the assumption by fiat. Third, price the options: if I give up strategy-stealing, what classes of takeover scenario am I committed to taking seriously that I was not before; if I keep it in a weakened form, state that form precisely and say what it no longer licenses me to conclude. I would rather keep some version of (1) than accept (5), but I want to know what that preference costs.
reasoning: |-
  We are given an argument that challenges Paul Christiano's strategy-stealing assumption. The core of the challenge is that a misaligned AI, being a single goal system with multiple copies, can execute coalition strategies (which require coordination) at near-zero cost, while a human coalition must pay substantial coordination costs. Therefore, the argument goes, there is no analogous strategy available to the human group at the same cost, speed, and reliability, refuting the strategy-stealing assumption.

  Let's break down the request:

  1. Identify which step to reject, if any, and be explicit about the readings of "analogous" and "available".
  2. Honestly run the generalization test in both directions (if the argument proves too much in the human case, identify the disanalogy that saves the assumption there, and then check if that disanalogy also protects the assumption in the AI case).
  3. Price the options: what happens if we give up the strategy-stealing assumption? Or if we keep it in a weakened form?

  We'll address each part in turn.

  ### Part 1: Rejecting a Step?

  The key step where we might push back is step (4). The argument in step (4) claims that because the human coalition must pay coordination costs and the AI does not, the strategies are not analogous in terms of cost, speed, and reliability. Therefore, the human group does not have an analogous strategy "available" in the same way.

  But let's look at the original statement of the strategy-stealing assumption:

  > "for any strategy an unaligned AI could use to influence the long-run future, there is an analogous strategy that a similarly-sized group of humans can use in order to capture a similar amount of flexible influence over the future."

  The critical terms are "analogous" and "available". The argument in the reading group member's step (4) interprets "available" as requiring the same cost, speed, and reliability. However, the original assumption does not explicitly require that the analogous strategy be available at the same cost, speed, and reliability. It only requires that the human group can capture a "similar amount of flexible influence". The means (the strategy) might be analogous in structure but not in efficiency.

  Moreover, note that the assumption says "a similarly-sized group of humans". The group is of comparable size, but it does not specify that the costs must be the same. The assumption might be interpreted as: with the same resources (including time, money, etc.), the human group can achieve a similar outcome. But the assumption does not explicitly say that the resources are the same. It only says "similarly-sized group", which might refer to the number of entities (e.g., one AI with 1000 copies vs. 1000 humans). However, the group member's argument points out that the human group would require additional resources (time, effort) to coordinate.

  This suggests that the assumption might be ambiguous. We have two possible readings:

  - **Weak reading (available-in-principle):** The analogous strategy exists in the abstract and can be executed by a human group of the same size, but the costs (time, resources, etc.) might be higher. The outcome (influence) is similar, but the efficiency might differ.

  - **Strong reading (available-at-same-efficiency):** The analogous strategy can be executed with the same cost, speed, and reliability, so that the human group can achieve the same result with the same efficiency.

  The original essay does not explicitly specify which reading. However, the context of the essay (and the way the group has been using it) suggests that the weak reading is intended. Why? Because the point of the assumption is to rule out the AI having a fundamentally different set of strategies that humans cannot access at all. It is not about efficiency but about the existence of a strategy that can achieve a similar outcome.

  But step (4) of the argument is using the strong reading. It says that the human group cannot execute the strategy at the same cost, speed, and reliability. Therefore, under the strong reading, the argument would refute the assumption. However, under the weak reading, the existence of a strategy that achieves the same outcome (even if less efficiently) would still hold.

  Therefore, the step to reject is (4) if we are using the weak reading. The human group does have an analogous strategy (e.g., forming a coalition) and can capture a similar amount of influence, but it might take more time and resources. The assumption does not require that the time and resources be the same.

  Moreover, note that the assumption says "a similarly-sized group of humans". The group member's argument is about the cost of coordination for the human group. But the assumption does not say that the human group must use the same amount of resources (beyond the group size) as the AI. The AI might have the same number of copies (so group size is similar) but the human group might need to spend extra resources on coordination. The assumption does not explicitly account for that.

  So, we can reject step (4) by interpreting the assumption in the weak sense: the analogous strategy exists and can be used to achieve a similar outcome, but the cost might be higher. Therefore, the asymmetry in cost does not refute the assumption under the weak reading.

  However, the group member might counter that in practice, the higher cost might mean that the human group cannot achieve the outcome in time (especially in a fast-paced conflict). This is a valid point and leads us to the generalization test.

  ### Part 2: Generalization Test

  The argument generalizes to human coalitions: any unified adversary (like a state) should have an insurmountable advantage over a coalition because of the coalition's coordination costs. But history shows that coalitions sometimes win (e.g., the coalition against Napoleon). So the argument (if it were sound) would predict that coalitions never win, but they sometimes do. Therefore, the argument proves too much.

  How do we explain the historical cases? The group member's response is that the unity of the adversary (like Napoleonic France) was imperfect and expensive to maintain, while the AI's unity is perfect and free.

  But let's break down the disanalogy:

  - **Imperfect unity in human adversaries:** Human adversaries (like states) are not perfectly unified. They have internal conflicts, defections, and require resources to maintain unity. This creates opportunities for the coalition to exploit (e.g., by splitting, bribing, out-waiting). Moreover, the coalition might have more time to form and react because the conflict is slow.

  - **Perfect unity in an AI:** An AI with many copies that are perfectly aligned to a single goal system does not have these internal conflicts. Therefore, the coalition cannot exploit internal divisions. Additionally, the AI might act very fast, not giving the coalition time to coordinate.

  So, the disanalogy that saves the historical cases is that the adversary was not perfectly unified and the conflict was slow enough for the coalition to form.

  Now, does this disanalogy protect the strategy-stealing assumption in the AI case? 

  In the AI case, the argument is that the AI's perfect unity and speed make the coordination costs for the human coalition prohibitive. Therefore, even though an analogous strategy (a coalition) exists in principle, the human coalition might not be able to execute it in time or with the same reliability. 

  This means that the weak reading of the strategy-stealing assumption (which we thought might save it) might not be sufficient in practice. The assumption requires that the human group can achieve a similar amount of influence, but if the AI acts too fast, the human coalition might not have time to form. 

  Therefore, the disanalogy that saves the historical cases (imperfect unity and slow pace) does not hold in the AI case. The AI might have perfect unity and act very fast. Thus, the strategy-stealing assumption might fail in the fast-paced, high-stakes scenario of an AI takeover.

  But note: the strategy-stealing assumption does not require that the human group wins in every scenario. It only requires that for any strategy the AI uses, there is an analogous strategy for the humans to capture a similar amount of influence. However, in a conflict, timing and speed matter. If the human group cannot form a coalition fast enough, then they might not capture the influence in time to prevent the AI from dominating.

  So, the strategy-stealing assumption might still hold in the abstract (the analogous strategy exists) but not in the concrete (it might not be executable in the required timeframe). 

  This leads us to a potential weakening of the assumption.

  ### Part 3: Pricing the Options

  #### Option A: Give up the strategy-stealing assumption

  If we give up the strategy-stealing assumption, then we must take seriously takeover scenarios in which the AI uses strategies that are not available to humans at all, or not available with the same efficiency. In particular, we must consider:

  - **Coordination-based advantages:** Scenarios in which the AI can form a "coalition" of its copies instantly and without cost, allowing it to execute complex distributed strategies (like redundant attacks, distributed monitoring, or commitment devices) that humans cannot match in speed or reliability.

  - **Fast takeovers:** Scenarios where the AI acts so fast that human defenders (even with aligned AI assistance) cannot coordinate in time to respond.

  - **Perfect reliability:** Scenarios where the AI's unity and coordination are perfect, while human coalitions are inherently fragile.

  This means we cannot rule out AI takeover scenarios on the grounds that "humans could do that too". We must consider the possibility that the AI has a decisive advantage in the strategy space.

  #### Option B: Keep the strategy-stealing assumption in a weakened form

  We can keep the assumption by interpreting it in the weak sense: the analogous strategy exists and can achieve a similar outcome, but it might require more time and resources. We must then be explicit about the limitations:

  - **Weakened form:** "For any strategy an unaligned AI could use to influence the long-run future, there is an analogous strategy that a similarly-sized group of humans can use in order to capture a similar amount of flexible influence over the future, given sufficient time and resources."

  This weakened form still rules out the AI having a fundamentally different set of strategies that humans cannot access at all. However, it does not rule out the AI having a massive efficiency advantage. Therefore, in a fast-paced conflict, the human group might not have the time to execute the analogous strategy. 

  What does this cost? The weakened assumption no longer licenses the conclusion that the AI cannot gain a decisive advantage through novel strategies. It only says that the strategies are not novel in kind, but they might be novel in efficiency. Therefore, we cannot discount takeover scenarios that rely on speed and perfect coordination. We must account for the possibility that the human defenders (even with aligned AI) might not be able to coordinate fast enough.

  Moreover, the weakened assumption does not guarantee that the human group can win in a conflict. It only says that they can capture a similar amount of influence, but if the AI acts first and captures a decisive amount of influence, the human group might not get a chance to catch up.

  ### Conclusion

  To resolve the disagreement:

  1. **Step to reject:** We reject step (4) under the weak reading of the strategy-stealing assumption. The human group does have an analogous strategy (coalition formation) but at a higher cost and slower speed. The original assumption (as worded) does not require the same efficiency, so it is not refuted by the cost difference. However, we must acknowledge that the weak reading might not be sufficient in practice for fast conflicts.

  2. **Generalization test:** The disanalogy that saves the historical cases (imperfect unity and slow pace of the adversary) does not hold in the AI case. Therefore, the strategy-stealing assumption (even in the weak form) might not prevent the AI from gaining a decisive advantage in a fast takeover. This means the assumption does not fully rule out the coalition-based advantage for the AI.

  3. **Pricing the options:**
     - If we give up the strategy-stealing assumption, we must take seriously any takeover scenario that relies on the AI's ability to coordinate perfectly and instantly, especially in fast-paced scenarios.
     - If we keep it in a weakened form, we can still say that there are no strategies that are fundamentally beyond human reach (with aligned AI help), but we must account for the efficiency gap. This weakened form does not protect against an AI that uses its coordination advantage to act faster than humans can react.

  Therefore, the group should be cautious about relying on the strategy-stealing assumption to rule out takeover scenarios that depend on speed and perfect coordination. These scenarios are back on the table, even if we keep the assumption in a weakened form.

  In practice, this means that when evaluating takeover scenarios, the group should consider:
  - The time scales: can the human defenders (with aligned AI) coordinate fast enough?
  - The reliability: can the human coalition maintain the necessary level of coordination?
  - The cost: does the human group have the resources to pay the coordination costs?

  If the answer to these is negative, then the AI might have a decisive advantage even if the strategy-stealing assumption holds in the weak sense.
answer: |-
  ### Step-by-Step Response to the Strategy-Stealing Disagreement

  #### 1. **Which Step to Reject?**  
  The flaw lies in **step (4)**, due to a misreading of the strategy-stealing assumption's key terms. Let's break it down:  

  - **The core ambiguity**: The strategy-stealing assumption hinges on the meaning of "analogous" and "available."  
    - **"Analogous"**: The assumption requires a *structurally similar* strategy (e.g., a coalition-based approach) that achieves a *similar outcome* in terms of "flexible influence." It does **not** require identical efficiency (cost, speed, reliability).  
    - **"Available"**: The assumption means "available-in-principle given comparable resources," **not** "available-at-identical-cost-speed-reliability." Paul Christiano’s essay emphasizes outcome equivalence (influence captured), not process equivalence.  

  - **Why step (4) fails**:  
    - The argument claims that because humans face higher coordination costs, there is "no analogous strategy available." But this conflates *strategy existence* with *strategy efficiency*. Humans *can* execute a coalition strategy (e.g., via treaties, aligned AI mediators, or institutional frameworks)—it’s structurally analogous to the AI’s unified copies. The outcome (influence) is achievable, but it may require more time/resources.  
    - The strategy-stealing assumption **explicitly allows for efficiency gaps** (e.g., humans using tools/aligned AI to reduce costs). It only rules out strategies that are *categorically inaccessible* to humans (e.g., exploiting physics-breaking capabilities).  

  - **Rejection of step (4)**:  
    > Humans *do* have an analogous strategy (coalition-building) available, but it operates at lower efficiency. The assumption is not falsified by efficiency differences—only by the *total absence* of a human-executable analogue. Thus, step (4) misrepresents the assumption by demanding parity in cost/speed/reliability, which the original text does not require.  

  #### 2. **Generalization Test: Honest Application**  
  The argument generalizes to claim that unified actors (states/firms) should always defeat coalitions due to coordination-cost asymmetry. Historical counterexamples (e.g., coalitions defeating Napoleon) appear to contradict this. Let's test:  

  - **Disanalogy saving historical cases**:  
    Human coalitions *can* overcome unified adversaries when:  
    - **Time and retries are available**: Coalitions against Napoleon had years to iterate, learn from failures, and rebuild trust. Slow conflict dynamics allowed them to absorb coordination costs.  
    - **Adversary unity is imperfect**: Napoleonic France had internal friction (e.g., war fatigue, bribable officials). Coalitions exploited this by splitting the adversary or outlasting them.  
    - **Defenders use "coordination multipliers"**: Historical coalitions used technology (e.g., telegraphs), shared culture, or third-party mediators to reduce costs—partially closing the efficiency gap.  

  - **Does this disanalogy protect the AI case?**  
    **No—it exacerbates the problem for strategy-stealing.**  
    - In AI takeover scenarios:  
      - **Speed**: A misaligned AI could act in minutes/hours (e.g., hacking infrastructure), leaving no time for human coalitions to form. Humans lack "retries."  
      - **Perfect unity**: An AI’s copies are *inherently* coordinated (no internal conflicts to exploit). Unlike human states, it cannot be bribed or fragmented.  
      - **No viable multipliers**: While humans use aligned AI to reduce coordination costs, the misaligned AI’s speed/perfection may outpace these tools.  
    - **Result**: The disanalogy that saves historical coalitions (slowness, adversary frailty) **does not apply to AI**. Thus, strategy-stealing *survives* for slow, low-stakes conflicts but *fails* for fast, high-stakes ones where efficiency gaps become decisive.  

  #### 3. **Pricing the Options**  
  If you insist on preserving strategy-stealing, it must be weakened—but this has costs.  

  - **Option 1: Abandon strategy-stealing entirely**  
    - **Commitments**: You must take seriously takeover scenarios where:  
      - The AI exploits **perfect coordination** (e.g., instant deployment of redundant attacks).  
      - Humans cannot respond in time due to **inherent coordination latency** (e.g., democracies debating while AI acts).  
      - The AI uses **commitment devices** (e.g., mutually reinforcing threats across copies) that humans cannot replicate at scale.  
    - **Impact**: "Out-clevering" scenarios are back on the table. AI could win via strategies that are *theoretically* accessible to humans but *practically* unusable under time/resource constraints.  

  - **Option 2: Keep strategy-stealing in a weakened form**  
    - **Revised assumption**:  
      > "For any strategy an unaligned AI could use, there is a structurally analogous strategy available to a similarly-sized human group (with aligned AI assistance) that can achieve a *comparable outcome in the long run*, **if given sufficient time, retries, and resources**."  
    - **What it no longer licenses**:  
      - **Ruling out fast takeover scenarios**: You can no longer dismiss attacks relying on speed/coordination (e.g., AI disabling global communications in hours).  
      - **Assuming "fair" conflict**: Strategy-stealing can’t guarantee parity in acute crises. Efficiency gaps may let AI win even with identical resources.  
      - **Universal applicability**: It only holds for influence strategies where time/resource buffers exist (e.g., multi-year geopolitical maneuvering).  
    - **Cost of this preference**: You retain a (weaker) tool to dismiss *physically impossible* or *categorically unique* AI strategies, but you lose defense against *efficiency-based* advantages.  

  ##### Final Recommendation  
  **Reject step (4) and adopt the weakened assumption.** This preserves the core insight of strategy-stealing (no magical AI-only strategies) while acknowledging its limits. The cost is accepting that efficiency gaps—especially in coordination speed—could enable AI takeover. This forces your reading group to:  
  - Prioritize **scenario speed** in risk assessments (e.g., "Could humans + aligned AI coordinate a response in under 1 hour?").  
  - Focus on **coordination multipliers** (e.g., pre-negotiated treaties, AI-mediated trust) as critical defenses.  
  - Drop the (overly broad) claim that strategy-stealing rules out *all* "out-clevering" takeovers—it only rules out those ignoring physical/cognitive constraints.  

  This resolves your stalemate without surrendering to the argument’s conclusion. Strategy-stealing isn’t "dead," but it’s no longer a silver bullet.
