prompt: |-
  You are a political philosopher specializing in democratic theory, with particular expertise in comparative referendum practice. Please think carefully before answering: work through each case below, brainstorm the candidate principles that could capture my verdicts, test each candidate against every case, and then commit to the one you think best.

  I have a set of verdicts about when a referendum's result ought to bind, and I suspect they don't all hang together, but I can't see which one has to go. Here they are.

  Switzerland's optional referendums, where a modest number of signatures puts a parliamentary law to a national vote and a bare majority, sometimes on a turnout in the forties, can strike it down: legitimate. Parliament can legislate again, and often does. Brexit: a bare 52-48 on a question of enormous constitutional consequence, with no supermajority requirement, formally advisory but politically impossible to ignore: not legitimate. California's initiative process, which amends the state constitution by simple majority, including propositions that mandate spending without specifying where the money comes from: not legitimate. The Irish and Danish pattern, where a referendum defeats a treaty, elites extract some clarifications and guarantees, and substantially the same question is put again and passes on the second attempt: not legitimate, though I can't fully articulate why, since the people were allowed to keep saying no. The Swiss minaret ban, passed by a solid majority through a procedurally impeccable process while restricting the religious freedom of a small minority: I find myself wanting to say both that the procedure was fine and the outcome was wrong, and that a majority vote on minority rights cannot be legitimate no matter how clean the procedure — and I can't hold both. Finally, a case I keep going back and forth on: a mandatory referendum on joining a confederation, turnout of 41 percent, the result 91 to 9 in favor.

  My tentative principle is something like this: a referendum's result ought to bind to the extent that the magnitude and irreversibility of the decision match the robustness of the procedure — simple majorities suffice for reversible decisions, irreversible ones demand supermajorities, and some questions, minority rights chief among them, are off the table entirely. But I suspect this principle either gets the minaret case wrong or collapses into pure outcome-based judgment, and it is silent on why asking the same question a second time seems to cheapen the second answer.

  Structure your answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion. A sensible division would be: (1) the principle in its final, precisely stated form; (2)-(3) which of my verdicts it captures and which it overturns, naming the case that forces each overturning; (4) its verdict on the low-turnout confederation case; (5) its verdict on a case I haven't listed, such as a three-option referendum in which the winning option takes 38 percent against two roughly equal alternatives. You may rearrange the division if it serves the argument better, but there must be exactly five items, each a sentence or two, with nothing before the first or after the last.
reasoning: |-
  Okay, the user is asking me to act as a political philosopher specializing in democratic theory, particularly comparative referendum practices. They've presented several cases where they have strong intuitions about the legitimacy of referendum results but feel these intuitions might be inconsistent. My task is to develop a principle that captures most of their verdicts while addressing the contradictions, especially in the minaret ban case.

  Looking at their cases: they find Switzerland's optional referendums legitimate despite low turnout, but Brexit illegitimate despite similar majority requirements. They reject California's initiatives and the "second vote" pattern in Ireland/Denmark, and are deeply conflicted about the Swiss minaret ban. The low-turnout confederation case puzzles them, and they mention a hypothetical three-option scenario.

  Their tentative principle focuses on matching decision magnitude/irreversibility with procedural robustness. But this struggles with the minaret case - if minority rights are "off the table," that seems outcome-based, contradicting their procedural acceptance of Swiss referendums generally.

  I need a principle that incorporates both procedural integrity and substantive limits without collapsing into pure outcome judgment. Perhaps legitimacy requires not just proper procedure but also that the referendum doesn't violate core democratic prerequisites or fundamental rights. This could distinguish the minaret ban from other Swiss referendums while preserving procedural legitimacy elsewhere.

  For the "second vote" issue: when elites immediately re-run substantially the same question after extracting minor concessions, it undermines the deliberative integrity of the initial vote. The principle should thus require that any repeat referendum must address substantively new circumstances.

  Testing this: It validates Swiss optional referendums (proper procedure, reversible decisions). Brexit fails on irreversibility without supermajority. California initiatives bypass proper fiscal deliberation. The Irish/Danish re-votes lack material change. The minaret ban violates minority protection despite procedure. The confederation case passes as it's both high-magnitude and irreversible but with overwhelming consensus. For the three-option scenario: 38% without majority or runoff would be illegitimate.

  The key innovation is adding the "no core rights violation" condition and "material change" requirement for re-votes. This resolves their minaret dilemma and explains their unease with immediate re-runs, while maintaining procedural focus.
answer: |-
  1. A referendum's outcome is democratically legitimate only if: (a) the procedure ensures adequate deliberation and informed participation; (b) the decision's magnitude and irreversibility are matched by an appropriate majority threshold (simple majority for reversible/low-magnitude, qualified/supermajority for irreversible/high-magnitude); (c) the subject matter does not violate fundamental rights or core democratic prerequisites; and (d) any subsequent vote on substantially the same issue requires demonstrably new material circumstances.

  2. This principle captures the legitimacy of Swiss optional referendums (reversible decisions, proper deliberation signature barrier) and the illegitimacy of Brexit (irreversible, high-magnitude change lacked supermajority/robust deliberation) and California initiatives (constitutional change/spending mandates without fiscal clarity bypass deliberation, lack supermajority for magnitude).

  3. It overturns your verdict on the Irish/Danish re-vote pattern (illegitimate due to lack of materially new circumstances, cheapening the initial no) and forces a clear verdict on the Swiss minaret ban: illegitimate despite impeccable procedure because it violates core minority religious rights (condition c), resolving your internal conflict.

  4. For the low-turnout (41%) confederation referendum (91-9 in favor): Legitimate, as the overwhelming consensus (effectively a supermajority far exceeding any reasonable threshold) compensates for lower turnout on a high-magnitude decision, satisfying condition b.

  5. For a three-option referendum where the winner gains only 38% against two alternatives near 31% each: Illegitimate for a binding decision, as 38% fails to demonstrate adequate majority support (violating condition b), necessitating a runoff or alternative voting method.
