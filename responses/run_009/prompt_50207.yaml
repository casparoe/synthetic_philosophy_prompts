  ### **Key Inseparabilities**  
  - **Leaf 1 vs. Leaf 5** (Scale Holism): Q6 distinguishes them, but if skipped (e.g., via Q3A → Leaf 1), they may overlap.  
  - **Leaf 3 vs. Leaf 4** (Threshold vs. Precaution): Both reject cricket tradeoff (Q4B/C), but Q8 separates them (B vs. C).  
  - **Leaf 6** (Non-Aggregative) is separable except from **Leaf 3** via Q7B → Q8C.  

