  ### **Decision Tree: Insect Ethics Diagnostic**
  *Assume no prior technical knowledge; key terms defined in context.*

  #### **1. Windshield Bugs**
  *On a summer road trip, your windshield kills 100 insects per minute. You could take a slower route to reduce kills by 90%, adding 30 minutes to your trip. Do you take the detour?*
  - **A. Yes, without hesitation**  
  - **B. Only if insects' potential suffering is weighted equally to humans'**  
  - **C. No, it's not worth the inconvenience**  

  *Branch:* A → Q2; B → Q2; C → Q7  

  #### **2. Bumblebee Ball-Rolling**
  *Bumblebees roll wooden balls repeatedly without reward. This suggests play behavior, but might be instinctual. How should this affect your view?*  
  - **A. Raises my credence in bee sentience (e.g., pleasure in play)**  
  - **B. No change; complex behavior ≠ sentience (e.g., preprogrammed instinct)**  
  - **C. Deepens uncertainty; warrants precaution despite low credence**  

  *Branch:* A → Q3; B → Q4; C → Q8  

  #### **3. Malaria Mosquito**  
  *In a malaria zone, a mosquito bites you. Swatting prevents a 1% malaria risk to you but kills the mosquito. Does the mosquito’s potential suffering matter?*  
  - **A. Yes, multiply my credence in its sentience by harm, then compare to my risk**  
  - **B. Uncertain, but moral doubts about insect sentience discount its weight**  
  - **C. No; trivial probabilities or non-sentience make this irrelevant**  

  *Branch:* A → **Leaf 1**; B → **Leaf 2**; C → Q4  

  #### **4. Cricket Tradeoff**  
  *You can spare 10,000 crickets from industrial freezing (potentially painful) by enduring a 5-second itch yourself. Do you accept the itch?*  
  - **A. Yes; even tiny sentience credence × 10,000 outweighs a minor itch**  
  - **B. No; credence is too low to matter (e.g., <0.001% threshold)**  
  - **C. No; we can’t quantify sentience credence reliably**  

  *Branch:* A → Q5; B → **Leaf 3**; C → **Leaf 4**  

  #### **5. Nociception Test**  
  *An insect has pain receptors (nociception) and learns to avoid electric shocks. Is this sufficient for moral concern?*  
  - **A. Yes; pain response + learning suggests suffering capacity**  
  - **B. Only if unified consciousness exists (e.g., memory/anticipation)**  
  - **C. No; reflexive responses explain this without sentience**  

  *Branch:* A → Q6; B → **Leaf 3**; C → Q7  

  #### **6. Scale Without Multiplication**  
  *Industrial insect farming creates trillions of lives. If insects aren’t sentient, could scale *itself* be problematic?*  
  - **A. No; only sentience matters**  
  - **B. Yes; scale indicates ecological disruption or intrinsic value loss**  
  - **C. Yes; but only as proxy for harms to *sentient* beings (e.g., biodiversity loss)**  

  *Branch:* A → **Leaf 1**; B/C → **Leaf 5**  

  #### **7. Evolutionary Debunking**  
  *We’re evolutionarily biased to ignore insects (small, not cute). Does this undercut intuitions that they don’t suffer?*  
  - **A. Yes; biases mean we should increase sentience credence**  
  - **B. Partly; but intuitions may still track truth (e.g., neural complexity)**  
  - **C. No; intuitions are valid absent contrary evidence**  

  *Branch:* A → Q8; B → **Leaf 3**; C → **Leaf 6**  

  #### **8. Threshold Case**  
  *Would you spare 1 quadrillion (10¹⁵) insects mild harm to avoid a 50% chance of a human stubbing a toe?*  
  - **A. Yes; expected value favors it if sentience credence > 1 in 10¹⁵**  
  - **B. No; probabilities this small are effectively zero**  
  - **C. No; aggregation fails for non-persons (insects aren’t “someones”)**  

  *Branch:* A → **Leaf 1**; B → **Leaf 3**; C → **Leaf 6**  

  ---

  ### **Leaves (Positions)**  
  1. **Straightforward Expected Value**  
     - Multiplication applies: Insect welfare is a dominant cause area.  
     *Path: Q1A/B → Q2A → Q3A or Q4A → Q5A → Q6A or Q8A*  

  2. **Moral-Uncertainty Discounting**  
     - Moral doubts reduce weight (e.g., 5% sentience credence ≠ 5% human weight).  
     *Path: Q1A/B → Q2A → Q3B*  

  3. **Threshold/High-Bar Consciousness**  
     - Credence is too low (< threshold) or consciousness requires unified experience; multiplication is moot.  
     *Path: Q1C/Q2B/Q4B/Q5B/Q7B/Q8B or Q3C → Q4B/Q7B*  

  4. **Precautionary/Ambiguity-Averse**  
     - Refuse to multiply ambiguous probabilities; prioritize avoiding harm.  
     *Path: Q2C → Q8C or Q4C*  

  5. **Scale Holism**  
     - Scale matters beyond multiplication (e.g., ecological integrity, intrinsic value).  
     *Path: Q1A/B → Q2A → Q5A → Q6B/C*  

  6. **Non-Aggregative/Person-Affecting**  
     - Only individuals matter; arithmetic breaks for non-persons.  
     *Path: Q7C → Q8C or Q1C → Q7C*  

  7. **Unoccupied: Sentience Agnosticism + Aggregation**  
     - *Incoherent:* Aggregating welfare requires sentience to matter; agnosticism prevents multiplication.  
     *(No path; e.g., Q2B → Q4A is inconsistent)*  

