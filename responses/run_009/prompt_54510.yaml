prompt: |-
  I'm a second-year graduate student taking a seminar on philosophy of language, and my study group has spent three meetings now going in circles on vagueness without converging on anything. I've decided the honest way forward is to stop defending positions and instead write down my actual verdicts on a bunch of cases, so that we can see whether any single theory of vagueness captures them or whether I'm holding an unstable mix. Here is what I find myself saying. On the sorites itself: I accept that 10,000 grains stacked in the usual way is a heap, and I accept that removing a single grain from a heap leaves a heap — each such claim, considered on its own, seems completely fine to assert. Yet I flatly deny that a single grain is a heap. So I take it that at least one of those individually fine-seeming claims is false; I simply cannot, even in principle, identify which one, and I'm suspicious of anyone who claims they can. On borderline cases: my friend Bob sits right on the border of tall, and I'm inclined to say that "Bob is tall" is neither true nor false. But I'm just as strongly inclined to say that "Either Bob is tall or Bob is not tall" is true — that's just logic. Oddly, "Either Bob is tall or Bob is short" strikes me as false, since he's neither. On context: at a basketball tryout I'd hesitate to call a six-foot guard tall, while at an ordinary party I'd say it without blinking; yet for "heap" context seems to do almost nothing — two hundred grains in a neat cone is a heap wherever you ask about it. On higher-order matters: "There is a sharp cutoff between tall and not tall" is obviously false, but "There is no sharp cutoff" also somehow sounds wrong to me, too strong, though I can't pin down why; and I have no idea what to say about whether "Bob is borderline tall" is itself borderline when Bob is borderline-borderline.

  One more set of verdicts, from a case my TA raised. Suppose a lease says the landlord may raise rent when there has been "significant deterioration" of the property. I think that clause determinately applies to some cases and determinately fails to apply to others, and that for the middle cases there is simply no fact of the matter about what the contract requires — not a hidden fact we can't know, but no fact at all. Yet when I imagine an arbitrator actually deciding one of the middle cases, it feels to me like she is discovering what the contract requires rather than making it up; and my TA, who I believe is an epistemicist, says her view explains exactly that feeling. I can't tell whether my legal-case intuitions are consistent with my "no fact of the matter" verdict or quietly betray it.

  So here is my request. Is there one account of vagueness — supervaluationism, epistemicism, contextualism, some hybrid, or something I haven't named — that captures all or nearly all of these verdicts: the sorites denial with no identifiable false step, the "neither true nor false" verdict on borderline sentences alongside my refusal to give up excluded middle for those very sentences, the strong context-sensitivity of "tall" alongside the near context-insensitivity of "heap," the higher-order discomfort with both "there is a sharp cutoff" and its negation, and my two-faced reaction to the arbitration case? If no single account can, tell me which of my verdicts should go, and why those rather than the others. Then tell me what the best overall package predicts about a case I haven't mentioned: consider the sentence "The number of grains in the smallest heap is either even or odd." Is that true, false, or neither? And does the answer it gives match what I would say if I heard it cold, which I confess I don't myself know?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a grad student in a philosophy of language seminar, struggling with vagueness. Their study group has been stuck in circles, so they decided to list their intuitive verdicts on various cases to see if any theory of vagueness can capture them all. 

  First, I notice their frustration with the lack of progress in the study group. They're taking a proactive step by laying out their intuitions honestly. That shows they're seeking clarity, not just defending a position. Their main goal is to find a coherent theory that fits their intuitions or figure out which intuitions need revising.

  Looking at their verdicts: 
  1. **Sorites Paradox**: They accept the initial heap and single-grain removal but reject that one grain is a heap. They can't pinpoint the false step and distrust anyone who claims they can. This suggests a rejection of epistemicism, which posits a sharp cutoff we just don't know.

  2. **Borderline Cases**: For Bob, borderline tall, they think "Bob is tall" is neither true nor false. Yet they hold that "Either Bob is tall or not" is true, preserving excluded middle. But "Either tall or short" is false. This is tricky—classical logic clashes with truth-value gaps. Supervaluationism might handle this with super-truth.

  3. **Context Sensitivity**: "Tall" is context-dependent (e.g., basketball vs. party), but "heap" isn't. This is interesting. Most theories treat all vague predicates similarly, but the user sees a difference. Maybe "heap" has a higher threshold or is more objective. Contextualism could explain "tall" but not "heap."

  4. **Higher-Order Vagueness**: They find both "sharp cutoff" and "no sharp cutoff" problematic. This hints at higher-order vagueness—the boundaries themselves are vague. Supervaluationism struggles here because it introduces sharp meta-boundaries.

  5. **Legal Arbitration Case**: They think borderline cases have no fact of the matter, yet the arbitrator seems to discover the contract's requirement, not invent it. This mirrors epistemicism, where there's a fact unknowable to us. But they reject epistemicism elsewhere. Conflict here.

  The user's core tension: they want truth-value gaps (no fact in borderline cases) but also want excluded middle and the sense that arbitrators discover facts. Supervaluationism gives gaps and keeps excluded middle, but higher-order vagueness is a problem. Epistemicism has sharp cutoffs and explains arbitration, but denies gaps. 

  For the grain question: "The number of grains in the smallest heap is either even or odd." If they accept supervaluationism, this would be true because all precisifications assign a number, so one disjunct is true in each. But it feels odd—does "smallest heap" refer to a vague object? That might be why they're unsure. Supervaluationism says true, but their intuition might resist.

  Recommendation: Supervaluationism fits most, but they need to tweak higher-order vagueness with open-texture or fuzzy borders. Drop the intuition that arbitrators discover facts—it's pragmatic, not metaphysical. For the grain question, supervaluationism says true, which might align if they accept it preserves logic.
answer: |-
  Based on your detailed verdicts, **supervaluationism** (with some refinements) captures the *majority* of your intuitions better than epistemicism, contextualism, or other major theories. However, no single theory perfectly reconciles *all* your judgments without tension—especially your arbitration case intuition. Here's a breakdown:

  ### **How Supervaluationism Matches Your Verdicts**
  1.  **Sorites Denial + No Identifiable False Step:**
      *   Supervaluationism posits multiple admissible "precisifications" (sharp boundaries) for vague terms. Each precisification has a sharp cutoff in the sorites series, but *which* cutoff varies across precisifications.
      *   "10,000 grains is a heap" is **super-true** (true on all precisifications).
      *   "Removing one grain from a heap leaves a heap" is **super-true** (true on all precisifications where the premise is true).
      *   "One grain is a heap" is **super-false** (false on all precisifications).
      *   **BUT:** The universally quantified premise ("For all n, if n grains form a heap, then n-1 grains form a heap") is **super-false** (false on every precisification, as each has a cutoff). However, *which instance* of the premise fails depends on the precisification. *No single instance is false on every precisification*, explaining why you can't identify a specific false step while maintaining the whole chain is flawed. This matches your "no identifiable false step" intuition.

  2.  **Borderline Cases & Excluded Middle:**
      *   For borderline Bob: "Bob is tall" is **neither true nor false** (true on some precisifications, false on others). → Matches your verdict.
      *   "Either Bob is tall or Bob is not tall" is **super-true** (on every precisification, one disjunct is true). Excluded middle is preserved. → Matches your verdict.
      *   "Either Bob is tall or Bob is short" is **false** (if "short" means clearly not tall). On many precisifications, Bob is neither tall nor short (neither true nor false), so the disjunction isn't super-true. → Matches your verdict.

  3.  **Higher-Order Discomfort:**
      *   "There is a sharp cutoff" is **super-false** (no cutoff is shared by all admissible precisifications). → Matches "obviously false."
      *   "There is *no* sharp cutoff" is **also super-false**? This is the core tension. Supervaluationism *requires* that for any sorites series, there *is* a sharp cutoff *relative to each precisification*. Saying "there is no sharp cutoff" (meaning absolutely none) would be false. However, "there is no *single*, *determinate*, *context-independent* sharp cutoff" *is* super-true. Your discomfort likely stems from conflating these. The theory formally forces "there is no sharp cutoff" (absolutely) to be false, which feels too strong. This is a **point of friction**, but your discomfort is common and acknowledged within the theory. Refinements (like higher-order vagueness or open texture) aim to soften this.

  4.  **Context Sensitivity (Tall vs. Heap):**
      *   Supervaluationism can incorporate context. Context (e.g., basketball tryout vs. party) determines which precisifications are *admissible* (e.g., which height standards are relevant). This easily explains "tall." → Matches.
      *   "Heap" seems context-insensitive because the *admissibility conditions* for precisifications might be much stricter and less variable across ordinary contexts (e.g., requiring a roughly conical pile above a certain size threshold, with little contextual wiggle room). The *variability* between precisifications exists, but context rarely shifts the admissibility criteria significantly. → Matches your intuition that context "does almost nothing" for heap.

  ### **Where Supervaluationism Faces Challenges (Your Arbitration Case)**
  *   **Your Verdict:** Borderline cases of "significant deterioration" have *no fact of the matter*. Yet, an arbitrator feels like she's *discovering* the contract's requirement.
  *   **Supervaluationist Response:** There *is* no fact of the matter about whether "significant deterioration" applies in the borderline case. The arbitrator is **selecting an admissible precisification** of the contract term to resolve the indeterminacy. She is constrained by the meaning of the words and the context (what counts as "significant deterioration" is not arbitrary), so she's not *making it up* entirely. However, she *is* making a decision where the contract itself was silent.
  *   **The Tension:** Your feeling that she's "discovering" aligns more with **epistemicism** (there's a hidden fact she's uncovering). Supervaluationism says she's *resolving* indeterminacy, not discovering a pre-existing determinate truth. **This is a mismatch.** To preserve consistency, you likely need to **revise the "discovering" intuition**. The arbitrator is acting *within the bounds* set by the vague language and context, exercising legitimate discretion in an area left open, not discovering a hidden fact. Your "no fact of the matter" verdict is primary; the "discovering" feeling reflects the *constraints* on her decision, not metaphysical discovery.

  ### **Other Theories & Mismatches**
  *   **Epistemicism:** Matches the arbitration "discovery" feeling and preserves classical logic/bivalence. *Fatal Mismatch:* It insists there *is* a sharp cutoff (a specific grain removal that destroys the heap) and that borderline statements are either true or false (we just can't know which). This directly contradicts your "neither true nor false" verdict for borderline Bob and your denial that we can identify the false sorites step.
  *   **Contextualism:** Explains "tall" context sensitivity well. *Mismatches:* It struggles badly with the sorites (why does context *always* shift just in time?) and doesn't easily explain the "no fact of the matter" intuition for borderline cases within a *fixed* context (like your Bob example or the arbitration case where context is fixed by the contract). It also struggles with the near context-insensitivity of "heap."
  *   **Degree Theories/Fuzzy Logic:** Assigns partial truth values. *Mismatches:* Preserves "Either P or not-P" as fully true, but your "Either tall or short" is false – fuzzy logic often struggles with such penumbral connections. It typically rejects excluded middle for borderline cases, which you want to keep. The arbitration "discovery" feeling is hard to explain.

  ### **Recommendation: Refined Supervaluationism & Revision**
  *   **Best Fit:** **Supervaluationism**, supplemented by a robust account of **higher-order vagueness** (admitting vagueness in what counts as an "admissible precisification") to address your discomfort with "there is no sharp cutoff." This avoids sharp meta-boundaries.
  *   **Revision Needed:** You should **revise your intuition about the arbitrator "discovering" a fact.** Accept that she is legitimately *resolving* indeterminacy within the constraints of the contract's meaning and context, not discovering a pre-existing determinate truth. Your "no fact of the matter" verdict is correct; the feeling of discovery reflects the *objectivity of the constraints* on her decision, not metaphysical discovery.
  *   **Minor Revision:** Accept that "There is no sharp cutoff" (absolutely, metaphysically) *is* false within supervaluationism, but reinterpret your discomfort as recognizing the need to say instead: "There is no *determinate*, *context-independent*, *unique* sharp cutoff." The latter *is* super-true.

  ### **The Grain Question: "The number of grains in the smallest heap is either even or odd."**
  *   **Supervaluationism's Prediction: TRUE (Super-True)**
      *   On every admissible precisification, there *is* a precise smallest heap number (n). That number n is either even or odd on every precisification. Therefore, the disjunction "even or odd" holds true on every precisification. It is super-true.
  *   **Does this match your cold intuition?** This is often counterintuitive. We feel "The smallest heap?" is ill-defined, so the disjunction shouldn't be determinately true. **However, your core intuitions align with supervaluationism's logical commitments:** You strongly favor excluded middle ("Either tall or not tall" is true) and accept that the sorites has false universal premises driven by varying cutoffs. Supervaluationism treats this disjunction the same way: *relative to each cutoff*, the number is definite and either even or odd, so the disjunction holds absolutely. **If you accept supervaluationism's handling of the sorites and excluded middle, you should accept this verdict.** Your discomfort likely mirrors your higher-order discomfort – acknowledging the technical result while feeling the description "the smallest heap" is somehow illegitimate. Supervaluationism would say the *description* is vague (lacks a unique referent), but the *sentence* as a whole is nevertheless true.

  **In summary:** Refined supervaluationism captures your sorites stance, borderline truth-value gaps, preservation of excluded middle, differential context sensitivity, and higher-order discomfort better than alternatives. It requires revising the arbitration "discovery" intuition to see it as resolution under constraint. It predicts the grain disjunction is true, a verdict consistent with your core logical commitments within the theory.
