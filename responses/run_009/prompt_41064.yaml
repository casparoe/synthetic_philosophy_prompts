  My aunt keeps recommending this philosophy podcast and I finally listened to the episode on Hannah Arendt. The host summarized her take on the Eichmann trial roughly like this: Arendt went to Jerusalem expecting a monster and found a beauraucrat. Her phrase "the banality of evil" means that history's great evils are mostly committed by ordinary, unremarkable people doing their jobs, not by fanatics — so Eichmann wasn't really an antisemite, just a careerist, and in that situation almost anyone would have done what he did. Because his crimes came from thoughtlessness rather than conviction, Arendt thought he was less culpable than the court pretended, and the book is really an argument that the whole trial was a show and he shouldn't have hanged. The host concluded that Arendt's real point is that evil is a systems problem, so we should worry about institutions, not individuals.

  Something about this feels off to me — I know the book got her savaged when it came out, but I don't know enough to say where the podcast is being unfair. Please go claim by claim: which parts would an Arendt scholar accept, which are simplifications with a kernel of truth, and which are just wrong? And does the host's conclusion about systems vs. individuals actually follow from the parts of the summary that survive?

  Please structure the answer as: 'What she'd sign off on' (~100 words), 'Simplifications with a kernel of truth' (~150 words), 'Just wrong' (~150 words), and 'Does the conclusion survive' (~100 words).
