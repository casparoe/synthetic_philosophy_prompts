  Okay, let me start by unpacking this user's request. They're a retired evolutionary biologist with a strong background in population genetics and behavioral ecology, now diving into philosophy via David Lewis's Convention. Their main query is to translate Lewis's concept of convention into evolutionary game theory (EGT) terms and identify what doesn't fit.

  First, I need to recall Lewis's key points. He defines conventions as solutions to coordination problems where agents prefer alignment over discord, and the solution is arbitrary but self-sustaining due to mutual expectations. The user sees parallels with EGT concepts like ESS, basins of attraction, and path dependence.

  The user mentions salience as a potential gap—something not captured by payoff-driven models. That's a crucial point. I should confirm if salience truly lacks an EGT equivalent or if there's a way to model it. Also, they want a clear stance, not just a survey of opinions. They’re looking for a direct analysis, defending whether the residue is a real gap or Lewis's fuzziness.

  I should map Lewis's ideas to EGT step by step. Coordination equilibria align with ESS, especially when multiple equilibria exist. Precedent leading to conventions fits path dependence and basins of attraction. Mutual expectations can be linked to frequency-dependent selection where the payoff depends on others' strategies.

  Now, salience. Lewis describes it as an "antecedently conspicuous" signal that helps agents coordinate without prior agreement. In EGT, signals are usually tied to payoffs, like in signaling games. But salience might be pre-existing, not evolved. For example, a unique color in a coordination game. EGT typically assumes signals evolve through selection, but salience could be an initial condition or an environmental cue. That’s where the gap might be—EGT doesn't inherently model why certain cues are salient without evolutionary history.

  The user’s background in behavioral ecology is relevant. They might know about innate biases or sensory exploitation in animal behavior, which could bridge salience. But Lewis’s salience is more about human cognition and common knowledge, which are harder to model in EGT. Common knowledge—knowing that others know—is tricky. EGT uses population-level dynamics, not individual beliefs. Replicator dynamics track strategy frequencies, not beliefs.

  So the residue includes salience and common knowledge. Are these gaps in EGT? Yes, because EGT focuses on fitness payoffs and selection, while salience might involve cognitive or perceptual factors outside payoff structures. Common knowledge is about iterated beliefs, which EGT simplifies through behavioral outcomes.

  I need to defend this stance. The user wants to know if it’s a real gap or Lewis being fuzzy. I’d argue it’s a gap because EGT models don’t incorporate cognitive aspects unless they affect payoffs. Lewis’s conventions rely on human-like reasoning, which EGT abstracts away. This isn’t fuzziness but a different focus—normative vs. descriptive approaches.

  Also, the user’s experience with runaway selection and signaling games might offer partial analogs. For instance, sexual selection models where traits become signals through coevolution. But salience in Lewis is more foundational, sometimes pre-cultural. So while there are parallels, the cognitive element remains distinct.

  In conclusion, translating most of Lewis into EGT works well, but salience and common knowledge require cognitive or cultural extensions beyond traditional EGT. The residue is a real gap, not mere fuzziness. I should make sure to explain this clearly, using examples from their field, like innate biases in animal behavior, to illustrate where salience might fit in biology versus philosophy.
answer: |-
  You've nailed the core insight – Lewis's convention theory **is** essentially evolutionary game theory (EGT) dressed in philosophical tweed. Your instincts about the mappings are sharp. Let's break it down with the ruthlessness of a population geneticist analyzing fitness landscapes.

  **Lewis → EGT Translation (The Clean Fits):**

  1.  **Coordination Problem:** A scenario with **multiple strict Nash equilibria** (or ESSs). Everyone prefers *some* coordinated outcome over miscoordination, but there are several equally good (or nearly equally good) stable points. Think pure-strategy ESSs in Hawk-Dove if the resource value exactly equaled the cost of fighting, leading to both "All Hawk" and "All Dove" as possible ESSs (though Lewis usually assumes equilibria are equally good, unlike this classic Hawk-Dove).
  2.  **Convention:** A specific **Evolutionarily Stable Strategy (ESS)** that solves the coordination problem. It's stable because unilateral deviation by an individual leads to miscoordination and lower payoff (punished by selection/frequency dependence). Its persistence relies on its high frequency in the population.
  3.  **Arbitrariness:** The existence of **multiple ESSs (or basins of attraction)**. The specific convention adopted isn't uniquely optimal; another one *could* have been stable under the same payoff structure. Driving on the left vs. right is the canonical example.
  4.  **Precedent Solving Coordination:** Pure **Path Dependence + Basins of Attraction dynamics**. The population state (strategy frequencies) starts within the **basin of attraction** of one ESS. Historical accidents ("mutants" adopting one strategy early, minor environmental fluctuations biasing initial conditions) determine *which* basin the population enters. Once near an ESS, the **replicator dynamics** (frequency-dependent selection favoring the majority strategy) pull the population firmly into that ESS and keep it there. The "precedent" is the initial stochastic nudge into a specific basin.
  5.  **Mutual Expectations:** Emergent property of **frequency-dependent selection** near an ESS. An agent "expects" others to use the convention because:
      *   **Statistically:** The vast majority *do* use it (high frequency).
      *   **Payoff-Driven:** They *know* (consciously or through learning/selection) that deviating while the convention holds leads to lower payoff. This "knowledge" is encoded in the evolved/learned behavioral strategy itself. It's not necessarily conscious belief, but a behavioral disposition shaped by payoff consequences.
  6.  **Why Conventions Persist:** **ESS Stability**. Invasion by a small number of mutants playing an alternative coordination strategy is punished (they get low payoffs coordinating with no one). The convention population state is robust to small perturbations.
  7.  **"Common Knowledge" (Lewis's Rigorous Definition - Simplified):** Emerges as a consequence of the ESS being at high frequency and its stability being common *experience*. Agents don't need infinite regress of beliefs; the stability and payoff dominance of the convention *in practice* creates a situation functionally equivalent to common knowledge for behavioral purposes. We all *act* as if we all know we all drive on the right, because *doing so works consistently*.

  **The Residue Report: Where the Mapping Fits Poorly or Requires Distortion**

  1.  **Salience: The Core Gap (You're Spot On)**
      *   **Lewis:** Salience is an *antecedently conspicuous* feature that makes one coordination equilibrium stand out *before* precedent or agreement exists. It's a psychological/perceptual/cognitive shortcut ("That red barn is obvious! Let's meet there!"). It breaks symmetry *without* requiring prior interaction or history. It's often framed as a property agents *notice*.
      *   **EGT Translation Attempts & Why They Fall Short:**
          *   *Payoff Asymmetry:* If one equilibrium *is* objectively better (e.g., meeting at the closer barn), it has higher fitness, and selection finds it easily. But Lewisian salience often applies when payoffs *are* symmetric. Salience works *despite* payoff symmetry.
          *   *Mutant Advantage/Costly Signaling:* Could a "salient" strategy arise as a mutation with a tiny initial advantage (e.g., being easier to perceive)? This *can* happen (e.g., in signaling games), but Lewis presents salience as an *external* feature agents latch onto, not necessarily an evolved signal. Salience often feels like a *pre-existing* environmental or cognitive bias exploited *by* the coordination process.
          *   *Sensory Bias/Sensory Exploitation:* This is the *closest* biological analog (e.g., prey responding more strongly to certain colors, mates preferring exaggerated traits). A salient feature exploits a pre-existing perceptual/cognitive bias. **The Gap:** EGT *can* model the *outcome* (the salient option gets adopted) if we build the bias into the payoff structure or decision rule. However, Lewis treats salience as a *primitive explanation* for *why* one equilibrium gets selected *initially*, outside the standard payoff-driven dynamics. EGT typically takes perceptual mechanisms and biases as *given inputs* to the model (the mapping from world state to action/payoff), not as part of the evolutionary dynamic *of the convention itself*. Salience points to the *origin* of the asymmetry that starts the path dependence, which EGT often treats as exogenous noise or an unexplained initial condition.
      *   **Verdict: Real Gap.** Salience highlights a pre-game, perceptual/cognitive input that isn't *itself* explained by the payoff-driven evolutionary dynamics of the coordination game *as Lewis defines it*. It's the spark plug, not the engine. Your vocabulary explains *how* the engine runs once started and why it stays running, but salience is about *which* engine gets cranked first when they are mechanically identical. EGT needs to import this from cognitive science/perception or treat it as an exogenous parameter.

  2.  **The Nature of "Reasoning" and Beliefs: A Subtle Distortion**
      *   **Lewis:** He leans heavily on agents having *beliefs* and *reasons* (even if grounded in common knowledge/experience). Conventions are partly sustained by agents *recognizing* the expectations and acting on them rationally.
      *   **EGT Translation:** Replicator dynamics and ESS are often interpreted as models of *learning* (e.g., reinforcement learning, imitation) or *natural selection* acting on behavioral phenotypes. Beliefs are epiphenomenal; what matters is the *behavioral strategy* and its payoff consequences. The "reason" an agent conforms is simply that the strategy coding for conformity has higher fitness/replication rate in that population state.
      *   **Verdict: Distortion Required (But Probably Benign).** To map cleanly, you *must* interpret Lewis's "beliefs" and "reasons" as shorthand for the behavioral dispositions produced by evolution/learning under frequency-dependent selection. This is a standard move in "naturalizing" philosophy of mind/social science. It works well for explaining the *behavior* and its stability. However, Lewis's framework *feels* more cognitively rich. If you insist on literal beliefs playing a causal role irreducible to behavioral dispositions, that's a gap. Most EGT-minded folks (like yourself, I suspect) see this distortion as removing philosophical fog.

  3.  **Drift vs. Selection in Initial Establishment:**
      *   **Lewis:** Precedent (the initial adoption) can be driven by mere chance or salience.
      *   **EGT:** In a perfectly symmetric coordination game with multiple ESSs, the *initial* movement into one basin *is* effectively **neutral drift** (or driven by exogenous shocks). Once a strategy gains a slight frequency advantage, **frequency-dependent selection** (replicator dynamics) takes over and amplifies it.
      *   **Verdict: Clean Fit.** This maps perfectly. The stochastic phase (drift/shocks) gets the population into a basin, then deterministic selection (replicator dynamics) locks it into the ESS. Lewis's "precedent" covers both phases implicitly.

  4.  **"Runaway Selection"?**
      *   **Lewis:** Not directly applicable. Convention formation is about locking into a stable state, not necessarily a positive feedback loop that escalates indefinitely.
      *   **EGT Analogy:** The replicator dynamics pulling the population towards the ESS *do* involve positive frequency dependence ("the more people do X, the better it is to do X"). However, it saturates at the ESS frequency (usually fixation or a stable polymorphism). It's a convergence dynamic, not an open-ended runaway.
      *   **Verdict: Partial Fit (for the dynamic, not the endpoint).** The *process* of convention establishment involves positive frequency-dependent selection, similar to the *initial* phase of a runaway process. But unlike runaway sexual selection, it hits a stable equilibrium (the ESS) and stops. Useful for understanding the *speed* of adoption, but not the endpoint.

  **Conclusion & Defense of Stance:**

  *   **The Clean Core:** Lewis's core machinery – coordination problems as multiple equilibria, conventions as ESSs sustained by frequency dependence, precedent as path dependence within basins of attraction driven by replicator dynamics – **translates remarkably cleanly and powerfully** into standard EGT vocabulary. Your 40-year toolkit is perfectly suited to dissect this.
  *   **The Salience Gap:** This is the **most significant residue, and it's a real gap in the *core* payoff-driven EGT dynamics** you used. Lewis identifies a genuine factor (antecedent conspicuousness exploiting pre-existing perception/cognition) that *causes* symmetry breaking *before* the payoff-driven dynamics dominate. EGT models *assume* an initial asymmetry (in strategy space, perception, or payoff) or rely on pure drift. While concepts like sensory bias exist in biology, they are imported explanations, not emergent properties of the coordination game dynamics itself. Lewis is *less* fuzzy here; he's pointing to a real psychological/perceptual input that pure EGT often brackets. This gap highlights the interface between evolved/learned decision mechanisms and the game dynamics.
  *   **Beliefs:** The need to translate "beliefs" into behavioral dispositions is a **distortion**, but it's one that makes the model *more* rigorous and biologically plausible. Lewis's cognitive language is the fuzzier element here.
  *   **Drift & Runaway:** Drift maps cleanly to the stochastic initiation phase. "Runaway" is only analogically useful for the positive frequency dependence during convergence, not a core component.

  **In short:** Lewis built a philosophical scaffold describing EGT dynamics before EGT was fully formalized in those terms. Your vocabulary provides the rigorous mathematical and biological foundation his insightful but informal account rests upon. The main exception, salience, points to a crucial *input* into evolutionary systems – pre-existing perceptual/cognitive biases – that isn't *generated* by the EGT dynamics of the convention game itself, but is essential for understanding how specific conventions arise in real-world, symmetric scenarios. Lewis wasn't being fuzzy; he correctly identified a factor that pure payoff-driven EGT needs to incorporate from elsewhere (psychology, perception, ecology) to be fully explanatory for human conventions. Your old vocabulary explains the engine; salience is about why *this* key fits the ignition.
