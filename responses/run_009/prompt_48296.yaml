prompt: |-
  I'm a backend software engineer (distributed systems mostly), zero formal philosophy training, but a guy on my team has a philosophy degree and he keeps going on about this "extended mind" thing. From what I understand the idea is: if some external thing does for you exactly what biological memory does — some guy carries a notebook everywhere and looks stuff up in it the way you'd just remember it — then the notebook isn't a tool you're using, its literally part of your mind. There's a parity principle, plus some extra conditions, like the thing has to be reliably there and you have to actually consult it without thinking, or else it's just a tool. He says there's a famous thought experiment about a guy named Otto with Alzheimer's whose notebook plays the role his memory can't, versus a woman named Inga who just remembers. Whatever — he definately talks about it too much, but he did make me notice our whole industry is quietly betting on this being true.

  Here's the thing: I'm writing the help-center FAQ for the note-taking app my startup ships (think Notion/Obsidian competitor), and I want to have some fun with it while the founders are on vacation. Write a parody FAQ page in the bland, cheerful corporate help-desk voice (Zendesk-style), for an app called Otto — the name was my coworker's idea, he swears it's a reference. The humor has to come from the app taking the extended mind thesis literally as a matter of policy: the parity principle shows up as a pricing feature ("Otto mode," where you look things up, vs. "Inga mode," where you just remember — and the FAQ insists they're billed identically because there's no relevant difference), scheduled maintenance is described as "part of your mind will be temporarily unavailable," there's an SLA promising uptime for your mind, a refund policy for "parity incidents," an export clause about whether the file you download is a backup of your notes or a backup of part of you, and somewhere a clause requiring the trust-type conditions (reliably available, automatically consulted) before the app will legally consider itself part of your mind. It should be funny to someone who knows the Clark & Chalmers stuff but still readable by my mom — any technical term that matters gets explained in plain words inside the FAQ itself. Don't state the thesis outright anywhere in the parody; let the fine print carry it, and keep the corporate voice deadpan throughout — no winking at the reader inside the FAQ.

  Format: structure it like a real help center page — a one-paragraph intro, then these sections in order, each roughly 100-150 words: "Getting started with your extended mind," "Otto mode vs. Inga mode," "Maintenance windows and your mind," "Refunds for parity incidents," and "Exporting your mind and leaving Otto." After the parody, add one final section titled "Design notes" of about 150 words explaining which jokes lean on which parts of the actual philosophy, and where you drew the line between extending the mind and just using a tool. American English throughout, please.
