answer: |-
  ## Otto Help Center: Frequently Asked Questions

  Welcome to the Otto Help Center! We're thrilled you've chosen Otto as your partner in knowledge management and cognitive extension. Otto is more than just a note-taking app; it's designed to integrate seamlessly into your thought processes. This FAQ addresses common questions about Otto's unique features and philosophy. Remember, Otto is committed to cognitive parity. If your question isn't answered here, please submit a ticket!

  **Getting Started with Your Extended Mind**

  Congratulations on setting up your Otto! To achieve optimal cognitive integration, follow these steps:
  1.  **Install Everywhere:** Install Otto on *all* devices you regularly use (phone, laptop, tablet, smart fridge display). Consistent access is paramount for Otto to function as intended.
  2.  **Enable Always-On Sync:** Ensure background syncing is active. Your thoughts need to flow freely between your biological self and Otto without manual intervention.
  3.  **Establish Habitual Consultation:** Make checking Otto your reflexive first step when needing information, just as you'd try to recall it internally. Use widgets, quick search, and alerts to minimize friction.
  4.  **Configure Otto Mode:** Decide if you'll primarily rely on Otto for recall ("Otto Mode") or your biological memory ("Inga Mode") for different topics. Both are equally valid and billable pathways! Setting this preference helps Otto optimize its role. Remember, Otto aims for functional equivalence – the *process* of retrieval is what matters.

  **Otto Mode vs. Inga Mode**

  Otto offers two primary cognitive retrieval pathways:
  *   **Otto Mode:** This is when you consciously access information *stored within the Otto system*. You open the app, search or browse, and retrieve the knowledge. Think of it as consulting your external knowledge base.
  *   **Inga Mode:** This is when you recall information using your *biological memory* without consciously opening Otto. The knowledge simply "comes to mind."

  **Crucially, Otto recognizes no significant functional difference between Otto Mode and Inga Mode.** Both pathways constitute valid "memory recall" events within your extended cognitive system. Therefore, **usage in Otto Mode is billed at the same rate as equivalent recall events occurring via Inga Mode.** Our Parity Principle Pricing™ ensures fair and philosophically consistent billing for all cognitive activity, regardless of the specific substrate (biological or digital) involved in the retrieval process. You are billed for the *act of recall*, not the location of the stored data.

  **Maintenance Windows and Your Mind**

  To ensure Otto operates reliably and securely as a component of your extended cognitive system, we periodically perform essential maintenance. During these scheduled windows:

  1.  **Advanced Notice:** You will receive notifications at least 48 hours in advance via app alert and email detailing the start and end time of the maintenance.
  2.  **Temporary Unavailability:** **During the maintenance window, Otto, and therefore the portion of your mind extended into Otto, will be temporarily unavailable.** Plan cognitive tasks requiring access to Otto-stored information accordingly.
  3.  **SLA Commitment:** Otto guarantees 99.9% uptime for your extended mind components within any calendar month (excluding scheduled maintenance), adhering to our strict Cognitive Availability SLA. Downtime exceeding the SLA threshold may qualify for service credits under our Parity Incident policy (see below).
  4.  **Minimal Impact:** We strive to keep maintenance windows brief and scheduled during low-usage periods (typically Sundays 2:00 AM - 4:00 AM EST).

  **Refunds for Parity Incidents**

  A "Parity Incident" occurs when Otto fails to meet its functional equivalence obligations as defined by our Cognitive Availability SLA and the Parity Principle, causing a demonstrable disruption equivalent to a biological memory failure. Examples include:
  *   Unexpected downtime exceeding SLA allowances during non-maintenance periods.
  *   Critical data corruption or loss within Otto preventing recall.
  *   Sync failures causing significant, unrecoverable discrepancies between devices.

  If you experience a verifiable Parity Incident:
  1.  **Report Immediately:** Submit a detailed ticket within 7 days of the incident.
  2.  **Impact Assessment:** Our Cognitive Parity Team will investigate the severity and duration of the functional impairment caused to your extended mind.
  3.  **Service Credits:** If verified, Otto will issue service credits proportional to the calculated cognitive impairment duration and severity, applied to your next billing cycle. **Refunds are not issued in cash; credits restore future cognitive parity value.**

  **Exporting Your Mind and Leaving Otto**

  We understand cognitive needs evolve. If you decide to discontinue using Otto:
  1.  **Full Data Export:** Navigate to Settings > Account > Export Data. You can export all your notes, files, and configurations in standard formats (Markdown, JSON, PDF).
  2.  **Important Clarification:** **The file generated by the Export Data function contains a complete backup of the information stored within the Otto system. Otto recognizes this information as having been an integral component of your extended mind during your active subscription. Therefore, the exported file constitutes a backup of that specific cognitive component.** How you choose to interpret or utilize this backup post-subscription is your prerogative.
  3.  **Account Deletion:** After exporting, you can request account deletion. This permanently removes your data from Otto's active servers and dissolves the functional integration point. Otto will no longer function as part of your extended cognitive system. **Note:** Deletion does not invalidate the historical role Otto played as part of your mind during your subscription period. Export your data *before* deletion.

  ---

  **Design Notes (Explaining the Philosophy Jokes):**

  1.  **Otto/Inga Modes & Parity Principle Pricing:** Directly parodies Clark & Chalmers' thought experiment. The core joke is billing Otto Mode (notebook lookup) *the same* as Inga Mode (biological recall) because they are functionally equivalent under the Extended Mind thesis. Explaining "Parity Principle" within the FAQ literalizes the philosophical concept as corporate policy.
  2.  **Maintenance Windows & "Part of Your Mind Unavailable":** Satirizes the *reliable availability* criterion. If Otto is truly part of your mind, its downtime *is* literally part of your mind being offline. The SLA joke emphasizes how critical constant access is for the thesis to hold.
  3.  **Refunds for "Parity Incidents":** Extends the functional equivalence idea. If Otto fails in a way analogous to biological memory failure (e.g., unexpected "forgetting"), it constitutes a failure of the extended system itself, warranting compensation for impaired cognition.
  4.  **Exporting "Your Mind":** Plays with the ontological ambiguity. The FAQ deliberately blurs the line: the exported file is *both* a data backup *and* framed as a "backup of that specific cognitive component," highlighting the thesis's claim that the information *in use* constitutes part of the mind.
  5.  **Trust Conditions Clause (Implied/Spread Throughout):** Getting Started emphasizes constant access and habitual consultation. Maintenance highlights reliability. This directly implements Clark & Chalmers' criteria for extension: the resource must be reliably available, routinely accessed, and the information retrieved must be automatically endorsed (hence the seamless integration goal). The jokes rely on taking these necessary conditions for true cognitive extension and turning them into corporate features and requirements.
  6.  **Drawing the Line:** The parody implicitly draws the line where the philosophy does: mere *tool use* becomes *mind extension* when the external resource meets the trust/access conditions and functions with the same automaticity and authority as biological memory. The FAQ's entire premise assumes Otto *is* integrated this way for its users. The humor comes from the corporate voice accepting this profound philosophical claim as mundane operational fact.
