  Here is my opening move. In your letters to your mother, you said something like this: the world is rationally constructed, our existence must have meaning, and that meaning would be destroyed if there were no afterlife — so there must be one. I understand the rationalism, but I don't understand the second step. A proof isn't pointless because it terminates in QED; a symphony isn't meaningless because it has a final chord and then silence. Some of the most meaningful things I know are meaningful precisely because they're complete and finite. So my question is: why does meaning require continuation at all? Why isn't a rationally constructed world allowed to contain lives that mean something for a while and then end — and isn't there something a bit unfair about the argument, since it seems to conclude that reality must be arranged for our benefit because we couldn't bear the alternative?
