       - If at any time you are tapped on the shoulder by the facilitator, you have 'died'. Go quietly to the graveyard area and wait. After a minute, you will be reborn and can re-enter at the nest.
       - The Anteater might also remove you if you are on a path. If removed, go to the graveyard and wait to be reborn."
     - Rules for the Queen (given privately on a card):
       - "You are the Queen. You stay at the nest. You cannot leave the nest.
       - When you see an ant deposit a token in a bin, you can, once per minute, add an extra token of the same color to that bin. (You will have a supply of tokens at the nest.)
       - You may not communicate with the ants in any way."
     - Rules for the Anteater (given privately on a card):
       - "You are the Anteater. Patrol the paths between the nest and the sites.
       - Every 30 seconds, remove one ant that is on a path (not at the nest or at a site). Touch them and they will go to the graveyard.
       - Do not remove ants at the sites or nest."
     - Facilitator: 
       - Start the round. 
       - At sites, dispense tokens at the intervals: A every 10 seconds, B every 7 seconds, C every 5 seconds. Only one ant can be served at a time? They might crowd. We'll say: only one ant can be at the dispenser at a time; others must queue.
       - Every 2 minutes, tap 5 ants on the shoulder to die (choose randomly from all ants).
       - When the bin for any site reaches 15 tokens, blow a whistle to signal commitment. Record which site.
       - Let the round continue for a few minutes after commitment to show stability.

  3. Round 2: Commitment and Change (20 minutes)
     - Now explain new rules:
       - "The colony has committed to a site (announce which). Now, we introduce commitment tokens (green). 
       - At the nest, there is a dispenser of green tokens. 
       - From now on, when you bring a token from the committed site and deposit it in the bin, you must also take a green token and wear it (e.g., hold it visibly). 
       - Then, you must go to the commitment circle and stand there. 
       - You must stay in the circle as long as you have a green token.
       - The colony must maintain at least 5 ants with green tokens in the circle at all times.
       - If the number drops below 5, ants who are not in the circle should try to bring tokens from the committed site to get green tokens and join.
       - Meanwhile, the sites change: the committed site's token production slows down (now every 15 seconds), and site B (or another) speeds up (every 5 seconds). 
       - The colony must eventually notice that the committed site's bin is not growing fast enough and switch commitment. 
       - To switch, the colony must reach a new quorum of 15 tokens for a new site. Then, the new site becomes the committed site, and the green tokens are returned? Actually, we won't have them return; we'll say that the ants in the circle can leave and return their green tokens to the dispenser? Or we can have a new rule: when a new site reaches 15 tokens, the ants in the circle must leave and return their green tokens, and then new ants get green tokens for the new site.
       - This might be chaotic, so facilitator should announce when a new commitment is reached."
     - In gameplay, the symbol is the group in the circle. Take a photo when the circle is full.
     - The Anteater continues to remove ants on paths.

  4. Debrief (20 minutes)
     - Gather everyone. Show the photo of the commitment circle from Round 2.
     - Questions:
       - "Where was the decision to choose a site located? Did any ant make it?"
       - "While ants were dying and being replaced, what stayed the same? (The bin counts and the commitment.)"
       - "For the Queen: did you feel in control? What could you influence?"
       - "For the Anteater: how did it feel to remove ants? Did you see any effect?"
     - Reveal the special roles: 
       - "The Queen's only power was to add tokens, which is like laying eggs. She couldn't command because the colony's behavior emerges from the rules and interactions."
       - "The Anteater's predation actually helped by removing ants that might be on less efficient paths, or by preventing congestion. In Hofstadter's dialogue, the Anteater says he eats ants that are 'distressed' and that it's like surgery."
     - Map to Hofstadter:
       - "In the dialogue, the Anteater claims the colony (Aunt Hillary) can think, though no ant can. In our game, the colony made a decision and maintained it, though no ant knew the whole plan."
       - "The green tokens in the circle were a symbol of commitment. Alone, a green token is just a chip; in the circle, it was part of a pattern that meant 'we are committed to site X'."
       - "Is Aunt Hillary real? In the game, the pattern in the circle was real, and it had a function. But it only existed because of the ants. In a real colony, the pattern is in the ants' interactions."
       - "For brains: neurons are like ants. No neuron 'knows' what you are thinking, but the pattern of firing constitutes your mind."
     - Caveats:
       - "This game was designed by me, with rules to make the behavior emerge. In nature, ant colonies evolved without a designer."
       - "You knew you were in a game about emergence, so you might have acted differently. In a real colony, there's no such awareness."
     - Conclusion: "What you experienced is a small taste of how complex behavior can arise from simple parts and rules. This is called 'emergence'. The level of the colony is a different level of description from the individual ant."

  5. Predicted failure modes and responses:
     - Participants talk or gesture: Forbid it gently: "Remember, no talking. You're ants with limited communication."
     - A faction tries to impose a plan: If they try before the game, say: "Please don't plan; let's see what happens with the rules." If they try during, ignore at first; if it works, in debrief, point out that their top-down control is not how real ants work, and in this game, it's a cheat. But it shows that we are used to top-down control.
     - Ants bunch up at one site: The dispenser queue will cause delays, and the bin counts will reflect production rates, so it should sort out. The Anteater removing ants from crowded paths might help.
     - The colony doesn't commit within time: Facilitator can blow the whistle when the highest bin reaches 15, even if not all are working.

  6. What the game cannot reproduce:
     - In the debrief, say: "This game was designed to illustrate emergence, but real ant colonies are much more complex and not designed by anyone. Our game rules were chosen to make the colony's behavior legible to us, but in nature, the rules are shaped by evolution and are not necessarily legible. Also, you knew you were in a game about colony behavior, so you might have been more patient or cooperative than real ants. The takeaway is not that ants are conscious, but that complex systems can have properties at one level (the colony) that are not present at the lower level (the ant)."

  Full run sheet with timing and scripts will be provided in the response.
answer: |-
  ### Participatory Session: "The Aunt Hillary Experiment"  
  **Based on Gödel, Escher, Bach’s Ant Colony Dialogues**  
  *For 25 adults, 75 minutes*  

  ---

  ### **Materials**  
  - **Tokens**: 400+ colored plastic chips (100 red, 100 blue, 100 yellow, 100 green).  
  - **Site Markers**: 3 large colored posters (red, blue, yellow) taped to walls, each with a token dispenser bowl.  
  - **Ant Kits**: 25 small pouches (each with 1 red, 1 blue, 1 yellow, and 1 green chip).  
  - **Stopwatch & Whistle**: For timing and signals.  
  - **Commitment Bell**: A desk bell placed at the nest (center of the room).  
  - **Turnover Tokens**: 25 index cards (15 labeled "ALIVE", 10 labeled "DEAD" for rebirth rotation).  
  - **Grid Tape**: Masking tape to mark a 5x5 grid on the floor at the nest (for Round 2).  

  ---

  ### **Setup (10 min)**  
  1. **Room Layout**:  
     - Push tables to edges. Clear central space.  
     - Tape 3 site posters (red/blue/yellow) on three walls. Place a bowl of 50 same-color chips below each.  
     - Mark a central "nest" circle with tape (diameter: 2 meters). Place commitment bell inside.  
     - Tape a 5x5 grid (1m x 1m) near the nest for Round 2.  

  2. **Assign Roles**:  
     - 23 participants = **Ants** (give pouches with tokens).  
     - 1 volunteer = **Queen** (give gold crown or sash).  
     - 1 volunteer = **Anteater** (give a plush toy or stick as "snout").  

  ---

  ### **Rules Read Aloud to All Ants (5 min)**  
  *Stand in the nest circle. Facilitator speaks:*  
  > “You are now ants in a colony. Your goal: **find the best food site** (red/blue/yellow) and **commit to it as a colony**. Rules:  
  > 1. **No talking, gestures, or eye contact**. You’re twitchy bugs—only react to tokens.  
  > 2. **Move freely** but can only interact when **touching another ant** (hand-to-hand contact).  
  > 3. **Token exchanges**:  
  >    - Give/take **one token** per interaction (colors: red/blue/yellow = sites, green = commitment).  
  >    - You can **hold only one token at a time**.  
  > 4. **Site visits**:  
  >    - Go to a site, take **one token** of its color from its bowl.  
  >    - Return to nest to interact.  
  > 5. **Commitment**: When you hold a green token, ring the bell **once**. If 10+ bells ring in 1 minute, the colony commits!  
  > 6. **Turnover**: Every 4 minutes, I’ll say ‘CYCLE’. Check your index card. If ‘DEAD’, leave tokens and exit for 1 minute. If ‘ALIVE’, keep going. New ‘ALIVE’ ants enter.  
  > *Special roles (Queen/Anteater) have secret rules. Begin!*”  

  ---

  ### **Round 1: Site Selection with Turnover (25 min)**  
  **Site Quality & Mechanics**:  
  - **Red Site**: Low quality (fills bowl slowly—add 1 token every 30 sec).  
  - **Blue Site**: Medium (add 1 token every 20 sec).  
  - **Yellow Site**: High (add 1 token every 10 sec).  
  - **Token Effects**:  
    - Ants exchange tokens **only when touching**.  
    - If you hold a site token (R/B/Y) and touch an ant with **no token**, give yours away 50% of the time (flip a mental coin).  
    - If you hold a site token and touch an ant with a **different token**, swap 50% of the time.  
  - **Green Tokens**:  
    - At nest, if you hold a site token, you may exchange it for a green token with an ant holding green (50% chance).  
    - If you hold green, ring the bell when you can. **10+ rings in 1 min = colony commitment**.  

  **Queen’s Private Briefing (Card)**:  
  > “You’re the Queen. You **stay in the nest**. Rules:  
  > 1. You can only **create new red tokens** (add 1 to any red-token interaction you witness).  
  > 2. You **cannot interact** with ants unless they touch you first.  
  > *Your belief: You command the colony. Watch what happens.*”  

  **Anteater’s Private Briefing (Card)**:  
  > “You’re the Anteater. **Stalk paths between sites/nest**. Rules:  
  > 1. Every 2 minutes, remove **1 ant** from a path (tap them; they ‘die’ and exit for 1 min).  
  > 2. If an ant holds **yellow** (high-quality), remove them. If not, remove randomly.  
  > *Your belief: You’re helping the colony. Watch what happens.*”  

  **Facilitator Actions**:  
  - At 4/8/12/16/20 min: Call “CYCLE”. Swap 10 “DEAD”/“ALIVE” cards.  
  - Track bell rings. Announce commitment if triggered.  
  - If no commitment by 25 min, pause anyway.  

  ---

  ### **Round 2: Symbols vs. Signals (20 min)**  
  **New Rules (Announced Aloud)**:  
  > “The colony committed to [color]. Now, defend it!  
  > 1. **New token rule**: Green tokens are now **symbols**.  
  >   - If you hold green at the **nest**, it means ‘recruit for our site’.  
  >   - If you hold green **at a site**, it means ‘return to nest’.  
  > 2. **Grid task**: At the nest, move onto the grid.  
  >   - **Goal**: Form a **solid letter ‘A’** (for Aunt Hillary) with your bodies.  
  >   - **Rules**: If both neighbors share your token color, stay. Else, move.  
  > 3. **Predation**: Anteater doubles removals (1 ant every 60 sec).  

  **Mechanics**:  
  - Ants use token exchanges to guide movement.  
  - **Symbol twist**: A green token at the nest recruits for the committed site, but at a site, it forces a return.  
  - Facilitator photographs the grid when 10+ ants form an ‘A’ shape (or at 15 min).  

  ---

  ### **Debrief Outline (20 min)**  
  **Part 1: Relive the Game**  
  - *Ask the Queen*: “Could you control the colony? What did you actually do?” (Reveal: She only boosted red—likely irrelevant. Real queens don’t rule.)  
  - *Ask the Anteater*: “Did you help or harm?” (Reveal: Eating ‘yellow’ ants pruned inefficiency—like surgery.)  
  - Show Round 2 photo: “This ‘A’ is Aunt Hillary. No ant knew it—it *emerged*.”  

  **Part 2: Philosophical Questions**  
  1. **Where was the decision?**  
     - “Not in any ant—it was in the **pattern of tokens/bells**. Like neurons, ants are ‘dumb’ parts of a ‘smart’ whole.”  
  2. **What stayed the same during turnover?**  
     - “The **commitment state** (e.g., bell count) persisted. Aunt Hillary is the *pattern*, not the ants.”  
  3. **Metaphor or literal mind?**  
     - “Hofstadter claims it’s **literal**: If the pattern *processes information* (e.g., chose a site, formed ‘A’), it **is a mind**. But in our game, it was designed—in nature, it evolves.”  
  4. **Brains and selves**:  
     - “You are a ‘colony’ of neurons. Your ‘self’ isn’t a neuron—it’s the **dynamic pattern** they create.”  

  **Part 3: Caveats**  
  > “This game **does not prove** ants think. We designed rules to force emergence. Real colonies evolved without intent. You *knew* you were in a game—that’s not biology. But it shows why **levels of description** matter: Aunt Hillary exists at the colony level, just as your mind exists at the brain level.”  

  ---

  ### **Predicted Failure Modes & Responses**  
  1. **Talking/Gesturing**:  
     - *Response*: **Forbid immediately**. “Ants don’t talk! Use tokens only.”  
     - *Teaching moment*: “This shows how hard it is to *not* impose top-down control. Emergence is counterintuitive.”  

  2. **Pre-game Huddle/Bloc Voting**:  
     - *Response*: **Exploit**. Let them try. When turnover scatters them, ask: “Did your plan survive death/rebirth? Real colonies can’t huddle.”  

  3. **Faction Marching to One Site**:  
     - *Response*: **Ignore, then exploit**. If they ignore tokens, the Anteater will remove them (especially yellow-holders). In debrief: “Blind blocs ignore information—predation cleans this up.”  

  4. **Gridlock at Sites**:  
     - *Response*: **Exploit**. Anteater removes ants, easing congestion. “See? Predation isn’t cruel—it’s pattern maintenance.”  

  ---

  ### **What the Game Cannot Reproduce (To Share in Debrief)**  
  > “This game is a **simplified metaphor**, not reality.  
  > - **Real colonies aren’t designed**: Our rules were made by me to make emergence obvious. Nature has no designer.  
  > - **You weren’t really ants**: You knew the goal, whereas real ants just follow pheromones.  
  > - **No true symbols**: Our green tokens had fixed meanings. Real symbols (like words) depend on colony-wide context.  
  > I must say this now: **Aunt Hillary is not conscious** in our game. But she *is* a real pattern. In brains, patterns *are* minds—that’s Hofstadter’s point.”  

  ---

  ### **Timings**  
  - **0:00–0:10**: Setup & rules.  
  - **0:10–0:35**: Round 1 (commitment + turnover).  
  - **0:35–0:55**: Round 2 (symbols + grid).  
  - **0:55–1:15**: Debrief.  

  ---

  ### **Queen & Anteater Briefing Cards**  
  **Queen’s Card**:  
  > “CONFIDENTIAL: You are the QUEEN. Stay in the nest.  
  > - Only you can CREATE RED TOKENS. When you see ants exchange tokens, add 1 red to one of them.  
  > - Do not speak/gesture. You rule the colony... or do you?  
  > *After the game, we’ll discuss your power.*”  

  **Anteater’s Card**:  
  > “CONFIDENTIAL: You are the ANTEATER. Patrol paths (not sites/nest).  
  > - Every 2 min, remove 1 ant. Prefer ants holding YELLOW.  
  > - Your role: Help the colony thrive.  
  > *After the game, we’ll discuss how predation helps.*"  

  ---  
  This session forces participants to *feel* emergence before naming it. The Queen’s futility and Anteater’s "surgery" mirror Hofstadter’s dialogue, while the grid task makes symbols tangible. By embracing failures (e.g., talking or blocs), you reinforce the unintuitive power of bottom-up systems.
