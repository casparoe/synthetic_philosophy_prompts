prompt: |-
  I write about science and ideas for a living, mostly longform features, and for the past year I've been doing a series where I ask researchers to put odds on things. Not fun stuff like aliens — stuff in their own lane, like whether their favorite theory survives the next round of data. And I keep running into a pattern I don't have words for.

  The obvious split I already knew about: they'll give you numbers when there's a base rate ("maybe 60% this replication pans out, similar designs come through about that often"), and they refuse numbers for one-off events, which I gather is the risk-vs-uncertainty thing. Fine. But there's this other behavior nobody I've asked can name. Take a physicist I interviewed. She'd confidently say her theory was more likely to be right than rival theory A, and that A was more likely than rival B. Then I asked whether her theory was more likely than B, and she said — completely matter of fact — that that question didn't have an answer. The two weren't comparable, they were "different kinds of claims." Her phrase, not mine. Not that it was a close call, not that she needed more time: the comparison itself was off the table. When I pushed, she said ranking them would be like asking whether a law is greener than a symphony is loud.

  I've collected maybe a dozen of these now. Common features: the comparisons people will make form a patchy partial list — some pairs yes, some pairs a flat no — and the "no" pairs are not the ones they're ignorant about. If anything they'll happily compare things they know little about. The refusals are about the kind of claim involved. And the patchiness does weird structural stuff: one economist ranked tax reform as more likely than the central bank changing course, and the central bank as more likely than a particular war, but then declined war-vs-tax-reform entirely. I checked — he wasn't confused, he just insisted those two sat on differnt scales.

  So, questions. Does this configuration have a name? "Knightian uncertainty" got thrown at me and doesn't seem right — these people aren't refusing because there's no data, they're refusing because the comparison itself seems category-crossing to them. Someone else mentioned that probabilities don't have to be numbers at all, some old economics-adjacent philosophy position, but they couldn't recall where it came from. Is that a real position, and does it cover what I'm seeing? And if there's no established term, coin one — but with a definition that actually separates it from (a) ordinary hedging or reluctance to be quoted, (b) risk vs uncertanty, and (c) people just being bad at comparing things, which I refuse to believe is all that's going on. Last thing, and honestly the thing I'm most curious about: if these partial rankings are for real, does anything go wrong formally? Like, can you build a dutch book out of somebody whose comparabilities have holes in them? Apologies if I'm using that term wrong, a poker friend taught it to me.
reasoning: |-
  Hmm, the user is a science writer who's noticed a fascinating pattern among researchers when assessing probabilities. They describe situations where experts confidently compare some pairs of probabilities but categorically refuse to compare others, claiming the items are "different kinds of claims." The key points are: researchers refuse even when they have opinions on both items individually, the refusal is about comparability rather than uncertainty, and this creates inconsistent partial rankings.

  This isn't standard Knightian uncertainty (which is about measurable vs unmeasurable risk), nor is it about being bad at comparisons. The user wants a term for this phenomenon, asks whether there's existing theory about non-numerical probabilities, and wonders about formal consequences like Dutch books.

  The core issue seems to be about commensurability - whether things can be measured by the same standard. When researchers say "different kinds of claims," they're essentially saying these probabilities exist in different conceptual spaces and can't be placed on a single scale. This aligns with what philosophers call "incommensurability."

  For theoretical grounding, the user might be seeing a form of qualitative probability ordering without completeness. This is discussed in economics, philosophy, and decision theory. Early probability theorists like Keynes and Koopman argued probabilities could be ordinal and incomplete. Modern decision theorists like Seidenfeld have explored the implications of incomplete preferences.

  Regarding Dutch books: yes, incomparable probabilities can lead to vulnerabilities. If someone's preferences aren't transitive or have gaps, a clever opponent could potentially construct a series of bets that guarantees the person loses money. The user's poker friend was right to suggest this connection.

  For coining a term, I propose "incommensurable uncertainty" to emphasize the category-crossing aspect, or "comparability gaps in probability assessment" as a more descriptive phrase. The definition should focus on the refusal to compare based on perceived category differences rather than lack of information.

  The user is clearly sophisticated about probability concepts and wants precise terminology and theoretical grounding. They're likely looking for a framework to analyze and describe this phenomenon in their writing, and might also be interested in the implications for how experts reason about uncertainty in their fields.
answer: |-
  What you're describing is fascinating and **does** have conceptual roots, though a single, universally agreed-upon *term* might be elusive. Let's break down the components and find the best fit:

  1.  **The Core Phenomenon:** Experts refuse to assign ordinal ranking (A > B, A < B, or A ≈ B) to the probabilities of two events/claims, **not primarily due to lack of information or epistemic uncertainty, but because they perceive the claims as fundamentally belonging to different "categories," "scales," or "domains of discourse," rendering direct probability comparison meaningless.** Their refusal is ontological ("what *kind* of thing is this probability?") rather than epistemological ("how much do I know?").

  2.  **Rejecting Knightian Uncertainty:** You're right to dismiss this. Knightian uncertainty (risk vs. uncertainty) is about the *measurability* of probability due to lack of data or unique cases. Your experts aren't saying "I *can't* measure/quantify the probability of either A or B alone," they're saying "Even if I had numbers for each, *comparing them directly* is a category error." They're objecting to the *structure* of comparison.

  3.  **Non-Numerical Probabilities & Incompleteness:** The "old economics-adjacent philosophy position" is very real! This traces back primarily to **John Maynard Keynes** (A Treatise on Probability, 1921) and was developed further by **Frank P. Ramsey** (critical of Keynes), **B.O. Koopman** (1940s), and later decision theorists.
      *   **Keynes' View:** Probabilities are not necessarily numerical. They represent logical relations ("degrees of rational belief") between a hypothesis and the evidence. Crucially, **not all probabilities are comparable.** Some pairs simply lack a defined "greater than," "less than," or "equal to" relation. Keynes explicitly argued that comparisons could be impossible between probabilities derived from fundamentally different *types* of evidence or arguments. Your physicist's "different kinds of claims" echoes this perfectly.
      *   **Formalization:** Koopman developed an axiomatic system for **qualitative probability**, introducing the concept of a **partial order**. Relations like "A is more probable than B" or "A and B are equally probable" are defined for *some* pairs, but not necessarily for *all* pairs. The resulting structure is incomplete. Modern decision theory (e.g., work influenced by Teddy Seidenfeld) explores implications of such incomplete preferences/probability orders.

  4.  **A Suitable Name:**
      *   **Incommensurable Uncertainty:** This is the most conceptually precise term I can coin. It combines:
          *   **Incommensurability:** A philosophical concept meaning lacking a common measure. Two things are incommensurable if there's no single standard or scale by which they can be meaningfully compared. This directly addresses the "different kinds of claims," "different scales," and "law greener than symphony loud" analogies.
          *   **Uncertainty:** Specifies the domain (degrees of belief/probability).
      *   **Definition:** "**Incommensurable Uncertainty** occurs when an agent possesses well-defined (qualitative or quantitative) probability assessments for individual events or hypotheses but categorically refuses to ordinally compare the probabilities of specific pairs, asserting that the events/hypheses belong to fundamentally different categories or domains, rendering their probabilities intrinsically incomparable on a single scale. This refusal is based on perceived ontological differences in the *nature* of the claims or the evidence supporting them, not on lack of information, quantifiability (Knightian uncertainty), hedging, or inherent difficulty in comparison."
      *   **Why it fits your criteria:**
          *   **(a)** Separates from hedging/reluctance: The refusal is principled ("category error") and matter-of-fact, not cautious or strategic.
          *   **(b)** Separates from risk vs. uncertainty: It's about comparability *given* whatever knowledge/uncertainty exists, not about measurability per se. Experts *can* often assign probabilities *within* a domain.
          *   **(c)** Separates from being "bad at comparisons": The expert *can* compare other pairs confidently; the refusal is specific to certain pairings deemed ontologically distinct. They may even compare things they know less about if they perceive them as commensurate.

  5.  **Formal Consequences & Dutch Books:**
      *   **Yes, problems arise formally.** A decision-maker with **incomplete probability comparisons (a partial order lacking completeness)** violates the axioms required for representation by a single, coherent numerical probability measure satisfying Kolmogorov's axioms (which assume comparability of *all* events).
      *   **Dutch Books:** This is exactly the right concept! A Dutch Book is a set of bets, each seeming acceptable individually, that guarantee a loss no matter what happens.
          *   **The Vulnerability:** If an agent's probability comparisons (or the preferences derived from them) are incomplete or intransitive *in specific ways*, they can be susceptible to a Dutch Book. **The key vulnerability here stems from the *incompleteness* itself.** If an agent cannot compare P(A) and P(B), and also cannot compare P(A) and P(C), but *can* compare P(B) and P(C), and these comparisons exhibit patterns inconsistent with *any* possible underlying numerical probability (e.g., they imply P(A) > P(B), P(B) > P(C), but refuse to say anything about P(A) vs P(C), which *should* imply P(A) > P(C) if probabilities are numbers), then a clever bookie *can* potentially construct a series of bets exploiting this gap in comparability.
          *   **How it might work (Simplified Sketch):** Suppose an expert:
              *   Says Event X is more probable than Event Y (willing to bet on X at slightly better odds than Y).
              *   Says Event Y is more probable than Event Z (willing to bet on Y at slightly better odds than Z).
              *   But refuses to compare X and Z directly ("incommensurable").
              A bookie could offer bets exploiting the *expectation* that if probabilities were numbers, P(X) > P(Z) *must* hold. If the expert, due to the perceived incommensurability, assigns betting odds for X vs. Z that violate this implication (e.g., offering odds on Z that are too favorable relative to the odds they offered on X vs Y and Y vs Z), the bookie can lock in a profit by chaining the bets. The refusal to compare creates a "hole" where transitivity breaks down *operationally* even if the expert wouldn't explicitly state intransitivity.

  **In Summary:**

  *   You've observed **Incommensurable Uncertainty**.
  *   It's grounded in the **Keynesian/Koopman view of probability as potentially non-numerical and fundamentally incomparable** for certain pairs of events/hypotheses based on their perceived ontological categories.
  *   It results in a **partial order of probability** comparisons.
  *   Formally, this **incompleteness violates the assumptions needed for coherent numerical probability** and **can make agents vulnerable to Dutch Books** if their betting behavior based on the partial comparisons exhibits patterns inconsistent with any possible underlying numerical probability measure.

  This is a profound observation about expert reasoning under uncertainty. It highlights how domain structure and the perceived nature of knowledge itself shape probabilistic judgment beyond just the availability of data. The "different kinds of claims" barrier is real to them, and the formal consequences demonstrate it's not merely verbal hedging. Your physicist nailed the core intuition with her analogy.
