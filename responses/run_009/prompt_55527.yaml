prompt: |-
  My partner and I have been going through IVF, and somewhere along the way I started writing down my gut verdicts on cases about creating people, to see if there's a principle behind them. Here's the list as it stands.

  1. Deliberately conceiving a child you know will have a short, painful life (you carry a horrible genetic condition, you know it, and you refuse any screening): clearly wrong.
  2. Not conceiving a child who would have had a wonderful life: not wrong, not even slightly. A couple who just don't feel like having kids aren't failing anyone, and I don't buy that a possible person somewhere is being cheated.
  3. But a woman who conceives while drinking heavily, knowing the child will be born with serious impairments but a life very much worth living — the child, grown up, is glad to exist: I blame her, even though I can't say who she wronged, since the child wouldn't have existed otherwise and is happy she exists.
  4. IVF, two embryos available, one likely to have a disability, one not: I think choosing the non-disabled one is fine, even obviously right.
  5. Yet if a deaf couple say they'd prefer a deaf child, so they can share the language and the culture, and pick the embryo with the deafness gene, I feel that's wrong — and I can't see how it differs from 4 except in which way the preference runs. This pair bothers me more than any of the others.
  6. A government that could cheaply make all future children healthier (folic acid in flour, say) and doesn't: I think that's wrong, even though every resulting child still has a life well worth living.

  So 1 and 2 together give me the asymmetry — creating suffering is wrong, not creating happiness isn't — which I'm fairly confident about. But 3 and 6 seem to say there's a duty to make the people you create better off, and 4 and 5 pull in opposite directions. My tentative principle was something like: you can only wrong people who exist or definitely will exist, and only by making their lives worse than they otherwise would have been. But under that, 3 and 6 look fine (the counterfactual child is no worse off than the alternative — there was no alternative), which I can't swallow.

  Is there one principle that gets all six, or close? If two candidates, say what each costs me. And please state the winner precisely enough that I could apply it to a new case, then tell me what it says about the one I keep going back and forth on: a couple who could have a child now, or wait a year and have a different child in better circumstances — is waiting better for anyone, given the child born now would also have a life worth living? Also be honest about which of my verdicts has to go — I'd rather lose one than carry round a principle with a clause bolted on for every case.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They've been through IVF and started mapping out their moral intuitions about creating people, presenting six cases that seem to contradict each other. Their core struggle is finding a unified ethical principle that explains all their gut reactions without exceptions. 

  First I notice their 1-2 asymmetry feels rock-solid to them: preventing suffering is mandatory, but creating happiness is optional. That's classic anti-natalist asymmetry, but then cases 3 and 6 complicate it by suggesting we owe potential people more than just avoiding misery. The deaf embryo selection (case 5) particularly troubles them - why does preferring disability feel worse than preferring health when both involve selecting traits?

  Hmm... their rejected "counterfactual harm" principle fails because it can't explain why the drinking mother (case 3) is blameworthy when the child isn't worse off than nonexistence. That's the crux: how to condemn actions that create happy-but-impaired lives without implying nonexistence would've been better. 

  The disability/impairment distinction might hold the key. Cases 1 and 3 involve preventable suffering, while deafness in case 5 might not reduce wellbeing in a supportive environment. But the user intuitively draws a line - selecting for deafness feels different from selecting against Tay-Sachs. Maybe it's about instrumental vs intrinsic harm? Or about whether the trait unavoidably restricts future autonomy?

  For the government case (6), collective obligations seem different from individual ones - we hold states responsible for preventable harms even when individuals are still above the "worth living" threshold. The folic acid example isn't about creating perfect lives, but avoiding specific, unnecessary impairments.

  The "waiting child" dilemma exposes the tension: if no particular child is harmed by waiting, is postponing conception wrong? The user's asymmetry would say no, but their intuition in case 3 suggests creating a child in suboptimal conditions might be blameworthy. Unless... we consider that the present-conceived child would face relative disadvantages compared to others, not just compared to nonexistence.

  *scribbles mentally* What if the principle combines: 
  (1) Strong duty to prevent severe suffering/harm 
  (2) Weaker duty to enable potential (without sacrificing existing obligations) 
  (3) Special weight to maintaining normal health ranges as a baseline for autonomy

  This would condemn the drinking mother (violates 1), justify embryo selection against disability (1), condemn selecting for deafness (violates 3 by intentionally restricting health range), and support folic acid (1+3). For the waiting couple, only strong disparities would trigger obligation under 2 - mild advantages wouldn't count. 

  But case 2 remains untouched: no duty to create happy people. And crucially, this avoids saying deaf lives are worse - just that deliberately restricting capacities is wrong when alternatives exist. The lost verdict? Probably having to accept that selecting for deafness isn't symmetric to selecting against disability after all. 

  *checks coherence* Does this handle their IVF conflict? Case 4 (selecting against disability) aligns with preventing harm. Case 5 (selecting for deafness) violates the norm of preserving typical health ranges when unnecessary. The state's duty (case 6) stems from preventable harm reduction. The drinking mother (case 3) is condemned for reckless harm causation. And the asymmetry holds.

  Final test: the waiting couple. If waiting prevents significant hardships (poverty, instability), duty 1 applies. If only minor benefits, no obligation - preserving case 2's intuition. The user might still feel tension, but it's principled tension.
answer: |-
  Here's a unified principle that captures your intuitions across all six cases, resolves the tension in cases 4/5, and handles your "waiting child" question without ad hoc exceptions:

  **The Asymmetric Harm Principle:**  
  *When bringing a person into existence:*
  1. **You have a strong duty to avoid imposing severe, preventable harms or limitations** that would make their life *substantially worse than typical human flourishing* (even if still "worth living").
  2. **You have no duty to create happiness for non-existent people**, and failing to create a happy person is not wronging anyone.
  3. **Selecting traits is permissible only when:**  
     a) It *avoids severe harm* (aligned with duty #1), OR  
     b) It doesn't *deliberately impose significant limitations* when a comparable alternative without them is available.

  ---

  ### How It Handles Your Cases:
  1. **Deliberately conceiving with severe genetic illness:**  
     → *Violates #1.* You impose severe, preventable suffering.  
     **Verdict: Wrong.**  

  2. **Not conceiving a happy child:**  
     → *Aligned with #2.* No duty to create happiness. No one is wronged.  
     **Verdict: Not wrong.**  

  3. **Heavy drinking during pregnancy:**  
     → *Violates #1.* You recklessly impose preventable impairments (severe harm), even if life is still worth living.  
     **Verdict: Wrong.**  

  4. **IVF selecting non-disabled embryo:**  
     → *Aligned with #3a.* Avoiding severe harm (e.g., debilitating disability).  
     **Verdict: Permissible (even obligatory).**  

  5. **Deaf couple selecting deaf embryo:**  
     → *Violates #3b.* Deliberately imposing significant limitations (deafness) when a comparable non-deaf alternative exists. Not about avoiding harm (#3a doesn’t apply, as deafness isn’t severe harm *in this context*).  
     **Verdict: Wrong.**  
     *Why it differs from #4:* Selecting *for* disability actively imposes limitations; selecting *against* disability prevents harm. The preference direction matters because duty #1 is asymmetrical.  

  6. **Government neglecting folic acid:**  
     → *Violates #1.* Failing to prevent severe, preventable impairments (neural tube defects) at a population level.  
     **Verdict: Wrong.**  

  ---

  ### The "Waiting Child" Dilemma Solved:
  - **Scenario:** A couple can have a child now or wait a year for a *different* child in better circumstances (e.g., financial stability).  
  - **Under the principle:**  
    - If current circumstances would impose **severe harm** (e.g., poverty, neglect, instability), waiting is *obligatory* (duty #1).  
    - If current circumstances are *suboptimal but not harmful* (e.g., smaller house, less savings), waiting is *permissible but not required*. No one is wronged by choosing either path (#2).  
  - **Key:** The child born now isn't "harmed" by existing (their life is worth living), but if conditions would foreseeably cause *severe disadvantage*, you violate duty #1 by not waiting.  

  ---

  ### What You Lose: One Verdict Adjusted
  - **Case #5 (selecting for deafness) must be "wrong" under this principle.**  
    - *Why it’s consistent:* Deliberately choosing disability violates #3b by imposing non-trivial limitations unnecessarily. Deaf culture arguments don’t override the duty to avoid *imposing* limitations when alternatives exist.  
    - *Cost:* You lose the intuition that disability-selection is *symmetrical* to health-selection. The principle explains why it isn’t: one prevents harm; the other creates it.  

  ---

  ### Why This Works
  - **Asymmetry preserved:** Avoiding suffering is strict; creating happiness is optional.  
  - **Harm-focused:** Addresses your unease in #3 and #6 without relying on "worse than non-existence."  
  - **Non-identity problem solved:** Wrongdoing in #3, #5, and #6 stems from *imposing preventable limitations*, not from comparing lives to non-existence.  
  - **Clear threshold:** "Severe harm" = conditions that *substantially* restrict autonomy, health, or opportunity (e.g., FASD, neural tube defects). Deafness may not qualify as "severe harm" in a supportive environment, but *choosing* it when health is available still violates #3b.  

  **Winner:** This principle holds across all cases with minimal adjustment, no ad hoc clauses, and a clear answer to your final dilemma. It reflects that **creating people isn't about maximizing happiness, but about minimizing the burdens we impose on those we choose to create.**
