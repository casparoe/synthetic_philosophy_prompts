prompt: |-
  I host a monthly philosophy evening around my kitchen table for friends with no philosophical training — a software engineer, a nurse, a lawyer, and a retired schoolteacher. Next month I have twenty minutes on aesthetic testimony, and I want a plan for the session rather than the session itself: I'll do the talking. The question I want them able to navigate by the end is whether you can come to know that something is beautiful or good from being told so, in anything like the way you can come to know it's raining from being told so. Plan the sequence for me: what has to be in place before the question even strikes them as open, given that they'll arrive split between "that's what critics are for" and "taste is obviously private"; the one carrying example and what it must be contrasted with — my hunch is the hinge is the difference between being told a painting is devastating and being told it's a Vermeer, where the second clearly changes my judgment but arguably isn't aesthetic testimony at all, but tell me if there's a better hinge and why; the misconceptions they'll form in the order they'll form them (I expect "this is just Rotten Tomatoes" and "trusting a critic means having no taste of your own") and the exact point in the sequence to head each off; where, if anywhere, the distinction between a critic's word giving me a reason to believe something and putting me in a position to know it should enter, or whether that's one of the things I should openly refuse to get into at this level, along with whatever else belongs in that refuse pile; and the single closing question that would show me they've grasped the distinction rather than just enjoyed the discussion. No readings — this group doesn't do readings. Please write in American English, and end with a one-sentence summary of the whole plan on a final line beginning "Summary:".
reasoning: |-
  Okay, let me tackle this philosophy session plan request. The user wants a 20-minute kitchen-table discussion on aesthetic testimony for non-philosophers, focusing on whether we can know beauty through others' testimony like we know factual things (e.g., weather). 

  First, I need to consider the audience: software engineer, nurse, lawyer, retired teacher. They'll likely start with two common intuitions - "critics exist to tell us what's good" versus "taste is purely personal." My challenge is to make the philosophical problem feel real to them quickly. 

  The core question is whether testimony can give aesthetic knowledge. I recall the user's suggested hinge example: comparing being told a painting is "devastating" (aesthetic) versus being told it's "a Vermeer" (factual). This seems strong because it isolates the aesthetic element - knowing it's a Vermeer might make you look differently, but doesn't automatically make you feel its beauty. 

  For misconceptions, I anticipate:
  - "This is just like Rotten Tomatoes" (confusing aggregated opinions with testimony)
  - "Trusting critics means having no taste" (misunderstanding how testimony interacts with personal experience)

  The sequence should probably:
  1. Start with everyday testimony (rain) to establish baseline
  2. Contrast with aesthetic claims using the Vermeer/devastating example 
  3. Explore why aesthetic testimony feels different (personal experience requirement?)
  4. Address misconceptions as they naturally arise
  5. End with a diagnostic question testing their grasp

  Key things to avoid: 
  - Getting bogged down in "reason to believe" vs "position to know" distinctions
  - Letting discussion veer into pure subjectivism

  For the closing, I'm considering a question that forces them to apply the distinction, like whether a friend's testimony could make them truly experience a song's beauty before hearing it. 

  This needs to stay concrete and example-driven throughout - no theory dumps. The challenge is making philosophical subtlety accessible in 20 minutes without oversimplifying.
answer: |-
  Here’s a focused 20-minute plan designed to make the puzzle of aesthetic testimony vivid for your group, using concrete contrasts and preempting common misunderstandings:

  **Phase 1: Anchor in Everyday Testimony (4 mins)**  
  - *Start with the obvious*: "If I text you ‘it’s raining outside,’ you immediately *know* it’s raining. Testimony clearly works for facts."  
  - *Contrast with aesthetics*: "Now, if I tell you ‘Van Gogh’s *Starry Night* is breathtakingly beautiful,’ does that give you the same kind of knowledge? Or is it more like me saying ‘spinach is delicious’—you might believe me, but you don’t *taste* it?"  
  - *Goal*: Surface their split intuitions ("critics are guides" vs. "taste is private") by asking for quick reactions.

  **Phase 2: The Hinge Example – Vermeer vs. "Devastating" (6 mins)**  
  - *Present your hinge*: "Imagine two scenarios:  
    (A) I show you a painting and say, *‘This is a Vermeer.’* You now confidently judge it’s authentic.  
    (B) I say, *‘This painting is devastating.’* You might believe me, but do you *see* its devastation? Or just trust my taste?"  
  - *Why this works*: The Vermeer example is factual testimony (changes belief directly). "Devastating" requires an aesthetic *experience*—it’s where testimony feels "sticky." Highlight: "Knowing it’s a Vermeer might make you *look closer*, but does being told it’s ‘devastating’ make you *feel* devastated?"  
  - *Preempt "Rotten Tomatoes"*: After this contrast, ask: "Is a critic saying ‘devastating’ just an aggregated opinion? Or is it claiming you *should* experience something?" (Clarify: Critics aren’t just polling data—they’re inviting you to see what they see.)

  **Phase 3: Why Aesthetic Testimony Feels Different (5 mins)**  
  - *Key point*: "With rain, testimony *transfers knowledge*. With beauty, it feels like testimony only *points*—you still need to experience it yourself."  
  - *Preempt "no taste of your own"*: "If you trust a critic who says ‘this song is profound,’ does that mean you’re tasteless? Or could it be like a friend saying ‘try this mango—it’s sweet’? You still taste the sweetness *yourself*; they just directed you." (Emphasize: Trusting critics ≠ surrendering judgment; it’s leveraging their expertise to *enhance* your experience.)  
  - *Refuse pile*: Do **NOT** dive into "reason to believe vs. position to know" (too technical). Avoid metaphysics of beauty. Say: "We’re asking *if* testimony gives aesthetic knowledge, not *how* it works philosophically."

  **Phase 4: The Core Tension & Closing Question (5 mins)**  
  - *Frame the dilemma*: "So: Can testimony *alone* make you *know* beauty, like it makes you know rain? Or is beauty ‘testimony-resistant’—requiring personal encounter?"  
  - *Closing diagnostic question*: **"If a critic you deeply trust tells you a sculpture is sublime, and you never see it, do you know it’s sublime—or just know the critic *thinks* it is?"**  
    - *Why this works*: Reveals if they grasp the distinction. "Know it’s sublime" = testimony suffices. "Know the critic thinks so" = aesthetic knowledge requires personal experience.  

  **Summary:** Anchor testimony in factual claims (rain), contrast with aesthetic judgments using the Vermeer/"devastating" hinge to isolate the experiential gap, preempt reduction to aggregation ("Rotten Tomatoes") or loss of autonomy ("no taste"), and close by testing if they distinguish knowing beauty from trusting a believer.
