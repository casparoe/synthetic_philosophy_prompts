prompt: |-
  My roommates and I have been fighting about electoral reform for like two years and we've finally agreed to do the whole adversarial-collaboration thing properly. One of us is all in on proportional representation — any system where a party's seat share roughly tracks its vote share, whether party-list, STV, MMP, whatever. The other defends single-member plurality districts, on the grounds that they produce clean alternation in power, a personal MP who answers to an actual place, and governments that can actually be thrown out. The PR side says FPTP is basically a rigged lottery where millions of voters get nothing and outcomes depend on how votes happen to be distributed geographically; the district side says PR fragments the party system, hands the balance of power to tiny kingmaker parties no one voted for as such, and severs the link between a voter and an identifiable representative.

  Write the joint statement we should be able to produce. I want the claims both sides can sign — about what elections are for, about which parts of our dispute are empirical versus values, and about what the other side's system actually does as opposed to what its worst implementations do — then the disagreements, each phrased so its own side would accept the wording. Then the cruxes. I suspect one is whether a vote is primarily a contribution to a national party tally or a choice of a local representative; one is whether a party with 12% nationally deserves 12% of the seats or should have to win pluralities somewhere; and one is whether two-party competition really moderates policy or just suppresses preferences nobody in the two parties holds. For each crux, give a concrete case or piece of evidence both sides would agree bears on it, with each side's prediction written down in advance.

  There's a hypothetical we keep circling that you should work in somewhere: a party that gets 34% in every single district, against two rivals who get 33% each, concentrated in different regions. The PR side says it obviously deserves about a third of the seats and anything else disenfranchises its voters; the district side says it lost head-to-head contests everywhere fair and square, and that's what contests are. Can that disagreement be kept exact, or does it bottom out in the word fair itself? If part of our whole fight is verbal — e.g. about what representation even means — say which part and why.

  Format: numbered agreed claims first, then a disagreements table (disagreement | wording the PR side would sign | wording the district side would sign | what would move one or both sides).
reasoning: |-
  Okay, the user is in a pretty interesting situation. They've been arguing with roommates about electoral systems for two years and finally want to structure their disagreement properly through adversarial collaboration. I need to help them create a joint statement that captures both perspectives fairly.

  First, I should understand the core positions. One roommate advocates for proportional representation (PR) emphasizing vote-seat proportionality, while the other defends single-member plurality districts (SMP) valuing accountability and clear governance. Their hypothetical about the 34% party is crucial here.

  The user wants a specific format: numbered agreed claims first, then a disagreements table. I'll need to identify areas of common ground about what elections should achieve. Things like fair representation, accountability, and peaceful power transitions seem like safe starters. Both sides likely agree on these principles even if they differ on implementation.

  For the disagreements table, I need to phrase each point in ways both sides would accept. The SMP side cares about local accountability and decisive outcomes, while the PR side focuses on national representation and avoiding wasted votes. The balance-of-power issue in PR systems and regional distortion in SMP systems are key tensions.

  The cruxes are insightful - they highlight fundamental divides about what constitutes fair representation. The 34% hypothetical perfectly illustrates this: is it fair for a party to get zero seats despite significant national support? Each side has coherent but incompatible answers. Evidence from countries like Canada (SMP) versus Netherlands (PR) could test these empirically.

  I notice the user is also probing whether this is partly a verbal disagreement about what "representation" means. That's perceptive - SMP defines it territorially while PR defines it nationally. This isn't resolvable empirically; it's foundational. The joint statement should make that explicit.

  The table format will help structure their ongoing debate. For each disagreement, I'll include what evidence could shift views - like studying how often kingmaker parties actually dictate policy in PR systems, or how many voters feel unrepresented in SMP systems.

  The tone needs to remain collaborative throughout. Phrases like "we acknowledge" and "we differ" keep it neutral. I'll avoid any judgmental language about either system's flaws, presenting them as trade-offs rather than failures.
answer: |-
  ## Joint Statement on Electoral Reform: Adversarial Collaboration

  **We, proponents of differing electoral systems, jointly affirm the following core principles and agreed foundations for our discussion:**

  1.  **Purpose of Elections:** Elections are the primary mechanism for translating the will of the citizenry into legitimate governmental authority, ensuring peaceful transitions of power, and holding those in power accountable.
  2.  **Representation Matters:** Voters deserve meaningful representation, meaning their preferences should have a discernible impact on the composition of the legislature and the direction of government.
  3.  **Accountability is Essential:** Governments and individual representatives must be clearly answerable to the electorate for their actions and decisions.
  4.  **Stability & Effectiveness:** The system should facilitate the formation of governments capable of governing effectively and providing stable leadership.
  5.  **Empirical vs. Values:** Disagreements stem partly from *empirical predictions* (e.g., how systems affect party system fragmentation, policy moderation, or voter satisfaction) and partly from *fundamental values* (e.g., the relative importance of local vs. national representation, the definition of fairness in translating votes to seats, the desirability of "clear winners" vs. consensus).
  6.  **System vs. Implementation:** Criticisms should distinguish between the inherent logic of a system (e.g., SMP's tendency toward two-party dominance, PR's tendency toward multi-party systems) and problems arising from specific implementations (e.g., extreme gerrymandering in SMP, very low thresholds or poorly designed coalitions in PR).
  7.  **Trade-offs Exist:** No electoral system perfectly satisfies all desirable criteria simultaneously. All systems involve trade-offs between values like proportionality, accountability, simplicity, and stability.
  8.  **The 34% Hypothetical:** We agree this scenario starkly illustrates a core difference. Under SMP, a party winning 34% nationally but finishing first in zero districts would receive 0 seats. Under PR, it would receive approximately 34% of the seats.

  ---

  **Disagreements:**

  | Core Disagreement                                                                 | Wording Acceptable to PR Proponent                                                                 | Wording Acceptable to SMP Proponent                                                                                                                               | What Could Move Views                                                                                                                                                                 |
  | :-------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Primary Function of a Vote**                                                    | A vote is primarily an expression of policy preference contributing to a national/regional party tally, empowering voters to support their genuine choice without strategic compromise. | A vote is primarily a choice for a specific local representative to act as a legislator and constituency servant, grounded in the community they serve.          | **Evidence:** Surveys measuring voter motivation (policy vs. candidate), studies on constituency service effectiveness in different systems, voter satisfaction with representation. |
  | **Deserving Representation**                                                      | A party securing a significant share of the national/regional vote (e.g., 12%) inherently deserves a proportional share of legislative seats as the expression of its voters' will. | Representation is earned by winning the contest *in a specific district*. A party with 12% national support that cannot win pluralities anywhere lacks a mandate grounded in local consent. | **Evidence:** Analysis of policy outcomes relative to popular vote support in SMP vs PR systems. Case studies of parties crossing PR thresholds vs. parties falling just short in SMP districts. |
  | **Two-Party Competition & Moderation**                                            | Duopoly entrenches establishment power, suppresses diverse viewpoints, and forces artificial moderation that ignores legitimate preferences outside the mainstream, hindering genuine responsiveness. | Direct competition between two major parties provides clear choices, forces moderation toward the median voter for electability, and enables decisive government alternation when performance is poor. | **Evidence:** Policy polarization trends in two-party vs. multi-party systems. Analysis of how fringe parties gain influence in PR (e.g., far-right in Europe). Voter turnout/engagement data. |
  | **Accountability & "Throwing Out" Governments**                                   | PR coalition systems offer clearer policy-based accountability through transparent coalition agreements and mid-term collapses if partners defect, while SMP often protects unpopular governments via uncompetitive districts. | SMP provides the cleanest mechanism for voters to decisively "throw the bums out" by delivering a clear majority to the opposition party after poor performance. PR coalitions often lead to opaque deals, shifting alliances, and governments voters didn't explicitly choose. | **Evidence:** Frequency of single-party majority governments and decisive electoral "waves" in SMP. Stability and fulfillment of electoral mandates in PR coalitions. Voter comprehension of coalition formation. |
  | **The 34% Party: Fairness & Representation**                                      | Denying *any* seats to a party supported by over a third of voters nationwide is fundamentally undemocratic, disenfranchising those voters and distorting the popular will. | Winning 34% means losing the head-to-head contest in every district. Fairness means respecting the outcome in each distinct contest; the party failed to win where it counts. "Representation" requires winning a mandate *somewhere*. | **Evidence:** **Is it resolvable?** This disagreement **bottoms out in the definition of "fairness" and "representation."** The PR view prioritizes *national vote proportionality* as fair representation. The SMP view prioritizes *local contest victories* as the basis for fair representation. Empirical evidence on voter alienation in such scenarios is relevant, but the core definitions are values-based. |

  ---

  **Cruxes & Testable Predictions:**

  1.  **Crux: Is a vote primarily a contribution to a national tally or a choice of a local representative?**
      *   **Concrete Evidence:** **Voter Surveys on Motivation.** Conduct or analyze surveys asking voters in different systems: "When casting your vote, is your primary goal to (a) support the party whose policies you prefer nationally, or (b) choose the best local representative for your constituency?"
      *   **PR Prediction:** A significant majority in both SMP and PR systems will prioritize supporting their preferred national party's policies.
      *   **SMP Prediction:** A significant majority, especially in SMP systems, will prioritize choosing the best local representative, seeing the party label as secondary to the candidate's local connection and service.

  2.  **Crux: Does a party with 12% national support inherently deserve 12% of seats, or must it win pluralities somewhere?**
      *   **Concrete Evidence:** **Policy Responsiveness.** Compare the correlation between a specific policy position held by ~12% of the population and its adoption/representation in the legislature across established SMP systems (e.g., Canada, UK) and PR systems (e.g., Netherlands, Germany).
      *   **PR Prediction:** Policies popular with ~12% of voters will be significantly better represented and more likely to be adopted in PR systems.
      *   **SMP Prediction:** Significant policy positions require building broader coalitions to win districts; SMP may slightly lag but will still absorb popular ~12% ideas into major parties, avoiding fragmentation and niche policy influence.

  3.  **Crux: Does two-party competition moderate policy or suppress diverse preferences?**
      *   **Concrete Evidence:** **Issue Salience & Polarization.** Track the salience and positioning on a specific "suppressed" issue (e.g., strong environmentalism, significant drug policy reform) over time in a stable two-party SMP system (e.g., US) vs. a stable multi-party PR system (e.g., Nordic countries).
      *   **PR Prediction:** The issue will gain earlier prominence, have distinct parties advocating for it, and see policy shifts more aligned with its supporters' intensity in the PR system.
      *   **SMP Prediction:** The issue will gradually be incorporated by one or both major parties in the SMP system as it gains broader appeal, leading to more moderate, stable, and widely accepted policy shifts without empowering niche factions.

  ---

  **The Verbal Disagreement: "Representation"**

  The core verbal disagreement centers on **what constitutes "representation."**

  *   **SMP Perspective:** Representation is fundamentally **territorial and personal.** It means having one person elected *from your specific geographic community* who is accountable *to that community* for both local service and legislative action. Representation is earned by winning the contest *in that place*. A vote contributes to choosing *your* representative.
  *   **PR Perspective:** Representation is fundamentally **ideological or partisan.** It means having a bloc of legislators in parliament whose policy preferences align with yours *and who hold power proportional to the support of those preferences nationally/regionally*. A vote contributes directly to the strength of *your chosen policy platform* in the legislature.

  This difference explains the fundamental clash over the 34% party. For the PR side, those voters are "unrepresented" because their chosen policy platform has zero legislative power despite significant national backing. For the SMP side, those voters *are* represented – they have a local MP (even if from a different party) responsible for constituency service, and their party lost the democratic contest fairly in every district. The disagreement is not primarily empirical but definitional: **Is representation about geography or ideology?** This underlying definitional difference fuels much of the dispute.
