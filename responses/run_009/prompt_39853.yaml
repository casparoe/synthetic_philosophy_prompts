prompt: |-
  As a journalist who has spent the better part of two decades writing about science and ideas for a general readership, I'm at work on a long-form retrospective essay taking stock of the humanitarian interventions I covered over my career — the Kosovo air campaign in 1999, which I reported from the Macedonian border, the run-up to the Iraq war in 2003, and the Libya operation of 2011 — and before I file the piece I want a rigorous audit of whether my considered positions actually cohere. Here is the set of commitments I would defend in print: (1) the Kosovo intervention was justified even though it proceeded without Security Council authorization, and the later independent commission's verdict that it was technically unlawful yet legitimate strikes me as roughly right; (2) the 2003 invasion of Iraq was unjustified, and the absence of Security Council authorization is an essential part of the case against it that I have repeatedly made; (3) my underlying principle is a responsibility-to-protect view — when a state turns its machinery of violence on its own population at scale, sovereignty forfeits its protective force, and outside powers may legitimately use force to stop the killing; (4) Security Council authorization cannot be a strict requirement for justified intervention, because the veto makes the Council hostage to the parochial interests of its permanent members; (5) the Libya intervention was justified at the outset under the 2011 resolution authorizing all necessary measures to protect civilians, though I believe the mandate was betrayed when civilian protection slid into regime change; (6) for an intervention to be legitimate rather than a euphemism for ordinary power politics, it must be non-selective in principle — it cannot turn on whether the interveners have oil interests or a nearby base — even though I also accept that states will only ever intervene where their interests align, and that we cannot reasonably demand otherwise of them; and (7) force can stop atrocities but cannot build liberal institutions, so democracy promotion cannot be the aim of a humanitarian intervention, and an intervention that leaves a country worse off than non-intervention would have is unjustified even if it stopped the killing.

  I have defended each of these at one time or another, often in the same column, and my editor has begun to make pointed noises about consistency. The trouble is that I cannot see where the genuine problems lie, and I do not want to find out from the letters page. So treat the seven commitments as a fixed set and audit them as a whole: which pairs are in real tension, which only look like it, and what each tension costs to resolve.

  Please structure your reply in the following sections, in this order: "Summary" (no more than 120 words, stating up front whether the set is jointly tenable); "Apparent tensions" (those that dissolve on inspection, with an explanation of why); "Genuine tensions, ranked" (ordered from most to least severe, each with the specific commitments involved and what exactly would have to give); "The cheapest revision" (the single change that would clean up the most, together with what I would lose by making it, given that some of these positions are ones I have publicly staked my credibility on); and finally "What my essay can still claim" (roughly 150 words, a candid statement of what a defensible position on humanitarian intervention looks like after the audit).
reasoning: |-
  Okay, the user is a seasoned science journalist working on a retrospective about humanitarian interventions they've covered—Kosovo, Iraq, Libya. They've laid out seven positions they've defended and want an audit for coherence before publishing. Their editor is questioning consistency, so they need to spot real vs. apparent tensions in their views.  

  First, let's map their commitments:  
  - Kosovo (unauthorized) was legitimate on R2P grounds.  
  - Iraq (unauthorized) was unjustified.  
  - Core principle: Sovereignty voids when states massacre civilians; force can stop it.  
  - Security Council can't be absolute due to veto problems.  
  - Libya started justified under UN mandate but betrayed when it shifted to regime change.  
  - Interventions must be *principled* (non-selective) but *practical* (states only act where interests align).  
  - Force stops atrocities but can't build democracy; making things worse invalidates even successful atrocity-stopping.  

  The biggest headache is squaring Kosovo (good unauthorized) with Iraq (bad unauthorized). They need a clear divider—maybe *imminence of atrocity*? Kosovo had ongoing ethnic cleansing; Iraq had no WMD threat to civilians. But then Libya complicates it because it was authorized but went off-rails.  

  The non-selectivity vs. realism tension is thorny too. They want interventions to be morally consistent (not just when oil's involved) but admit states won't act without interests. Can they reframe this as "we judge *intent* by the *standard* of non-selectivity, even if practice is messy"?  

  Libya's "betrayal" point is smart—it dodges the "authorized but bad" problem by splitting the intervention into phases. But does that undermine their R2P stance? If civilians were protected by ousting Gaddafi (who vowed reprisals), is regime change *ever* justifiable under R2P? Their Commitment 7 says no—force can't build institutions. So Libya's aftermath (chaos) might prove their point, but the mandate slippage still needs explaining.  

  Cheapest fix? Soften Commitment 6. Drop "non-selective in principle" and stress that *criticism* of selectivity is vital to pressure states toward consistency. They keep their realism but avoid claiming interventions *are* principled—just that they *should* be.  

  Final defensible position: R2P as emergency exception for imminent slaughter; UN authorization preferred but not absolute if blocked unreasonably; post-intervention humility (no nation-building); and constant vigilance against hypocrisy—even if we know interests drive action, we must shame selectivity to expand the circle of "where interests align."
answer: |-
  ### Summary  
  Your seven commitments are jointly tenable but contain significant tensions requiring careful qualification. The set holds if framed as a *contingent, precedent-wary* application of R2P (Responsibility to Protect), prioritizing atrocity prevention over institutional outcomes and accepting that legality/legitimacy diverge when the Security Council is paralyzed. The core tension lies in reconciling unauthorized interventions deemed legitimate (Kosovo) with rejecting others (Iraq) while demanding non-selectivity—a standard states inherently cannot meet.

  ---

  ### Apparent Tensions  
  1. **Kosovo (unauthorized) vs. Iraq (unauthorized)**  
     *Why it dissolves*: The distinction rests on *imminence and purpose*. Kosovo addressed ongoing ethnic cleansing; Iraq lacked evidence of imminent mass atrocities against civilians (relying on WMD claims and regime change). Your principle (Commitment 3) focuses on halting state violence—absent in Iraq.  
     
  2. **Libya’s initial justification vs. its betrayal**  
     *Why it dissolves*: Commitment 5 explicitly separates the civilian-protection mandate (legitimate under Resolution 1973) from the NATO overreach into regime change. The latter violates your principle that interventions must not aim at democracy promotion (Commitment 7).  

  3. **Non-selectivity (Commitment 6) vs. State interests driving action**  
     *Why it dissolves*: You acknowledge states act only where interests align, but critique selectivity as a *moral standard* for judging legitimacy. This is aspirational—a tool to expose hypocrisy—not a feasibility claim.  

  ---

  ### Genuine Tensions, Ranked  
  1. **Most Severe: Security Council flexibility (Commitment 4) vs. Iraq critique (Commitment 2)**  
     *Tension*: Rejecting Iraq partly due to lack of authorization (Commitment 2) clashes with dismissing the Council as decisive (Commitment 4).  
     *Resolution cost*: You must explicitly define *when* bypassing the Council is acceptable: e.g., only for *ongoing, large-scale atrocities* with *no plausible alternative* (Kosovo meets this; Iraq does not). This narrows Commitment 4.  

  2. **High Severity: Non-selectivity principle (Commitment 6) vs. State interest reality (Commitment 6)**  
     *Tension*: Insisting interventions must be "non-selective in principle" conflicts with accepting that states intervene only where interests align. This risks incoherence: if selectivity is inevitable, how can it be a validity criterion?  
     *Resolution cost*: Reframe non-selectivity as a *critical benchmark* for assessing motives—not a feasibility requirement. This weakens the moral force of the principle but avoids contradiction.  

  3. **Moderate Severity: R2P’s scope (Commitment 3) vs. Anti-regime-change stance (Commitments 5, 7)**  
     *Tension*: If an atrocity-preventing intervention *requires* removing a regime (e.g., Libya post-Gaddafi threatened reprisals), banning regime change (Commitment 7) may undermine R2P.  
     *Resolution cost*: Allow that regime change *can* be a byproduct of civilian protection if strictly necessary—but never an aim. This risks muddying the line between protection and overreach.  

  ---

  ### The Cheapest Revision  
  **Revise Commitment 6** to drop "it must be non-selective in principle." Replace it with:  
  > *"While selectivity is inevitable, an intervention’s legitimacy depends on whether it would be justifiable *absent* contingent interests—and we must condemn cases where interests override moral urgency."*  

  **What you lose**: The stronger, principled stance against geopolitical hypocrisy. This softens your critique of self-serving interventions (e.g., contrasting Kuwait 1991 with Darfur).  
  **What you gain**: Coherence with your realism about state behavior and preserved consistency on Kosovo/Iraq. It’s the least damaging to your published positions, as your core R2P criteria (Commitments 1, 2, 3, 5) remain intact.  

  ---

  ### What Your Essay Can Still Claim  
  A defensible R2P position emerges: **Humanitarian intervention is a tragic necessity when states slaughter civilians, excusing unauthorized force only if atrocities are imminent and the Security Council is weaponized by vetoes.** Kosovo passes this test; Iraq fails it. Libya’s initial phase was valid, but its morphing into regime change violated the mandate and ignored your stricture against institutional engineering. Selectivity remains a scourge—but we judge interventions by their adherence to civilian protection, not by whether states act consistently (they won’t). Force can halt bloodshed but cannot redeem societies; thus, the threshold for action must be high, the aims limited, and the aftermath governed by humility. This framework is coherent if presented as a contingent, emergency doctrine—not a license for moralizing statecraft.  

  *(150 words)*
