  Below is a step-by-step procedure for pruning a client's option list using dominance reasoning (including mixed strategies), designed for a 20-minute whiteboard session. The approach is iterative, accounts for strict/weak and pure/mixed dominance, and highlights key caveats. I'll first outline the procedure, then apply it to your two cases.

  ---

  ### **Whiteboard Procedure: Iterated Elimination of Dominated Strategies (IEDS)**
  **Assumptions & Disclaimers (State Upfront):**  
  1. **Rationality & Common Knowledge**: IEDS assumes the counterparty is rational (will not play dominated strategies) and this is common knowledge. If they might "blunder," weak dominance can discard optimal options.  
  2. **Weak Dominance Order-Dependence**: Eliminating weakly dominated options in different orders can yield different surviving sets. Default to strict dominance first for conservatism.  
  3. **Mixed Strategies**: Clients often overlook randomized mixes (e.g., flipping a coin between two options). These can dominate pure strategies.  
  4. **Vague Payoffs**: If payoffs are too close to call, mark as "incomparable" and defer to judgment.  

  **Tools Needed**:  
  - Whiteboard markers.  
  - Client-provided payoff matrix (client's strategies = rows, counterparty's = columns, client's payoffs only).  

  ---

  #### **Step 1: Draw the Payoff Matrix**  
  - Elicit client's strategies (rows) and counterparty's strategies (columns).  
  - Fill in rough payoff estimates (client only).  
  - **Example Format**:  
    | Client \ Counterparty | Move 1 | Move 2 | ... |  
    |------------------------|--------|--------|-----|  
    | **Option A**           | 10     | 3      | ... |  
    | **Option B**           | 7      | 5      | ... |  
    | ...                    | ...    | ...    | ... |  

  ---

  #### **Step 2: Define Dominance Types**  
  Explain quickly:  
  - **Strict Dominance (Pure)**: Option X is strictly dominated by **one pure option Y** iff Y gives a **strictly better** payoff against *every* counterparty move.  
  - **Strict Dominance (Mixed)**: Option X is strictly dominated by a **mix of two options (Y, Z)** iff there exists a probability `p` (e.g., 50%) such that the mix beats X against *every* counterparty move.  
  - **Weak Dominance**: Same as above, but "better or equal" in all cases and "strictly better" in at least one.  

  ---

  #### **Step 3: Iterated Elimination Workflow**  
  **Key Rules**:  
  - **Strict > Weak**: Prioritize strict dominance checks (more robust).  
  - **Check Mixtures**: Always test for dominance by pure options *and* 2-option mixes.  
  - **Order for Weak**: If weak dominance exists, eliminate **one option per round** (order matters). Default to eliminating the one with the *weakest payoff peaks*.  
  - **Stop When**: No more strict/weak dominance exists, or payoffs are too vague.  

  **Procedure**:  
  1. **Strict Dominance Check (Pure)**:  
     - For each client option, check if another **single** option beats it against *all* counterparty moves.  
     - If yes, eliminate the dominated option. **Restart the check** (removal may reveal new dominances).  
  2. **Strict Dominance Check (Mixed)**:  
     - For each remaining option, check if a **mix of two others** beats it against *all* counterparty moves.  
     - *How?* Solve for `p` (probability) where expected mix payoff > target payoff in all columns.  
     - If yes, eliminate. **Restart from Step 3.1**.  
  3. **Weak Dominance Check (Conservative)**:  
     - If no strict dominance, check for **weak dominance by pure options**.  
     - Eliminate **only one weakly dominated option per round** (e.g., the one with the lowest max payoff).  
     - **Restart from Step 3.1** (removal may change dominances).  
  4. **Weak Dominance by Mix**:  
     - If no pure weak dominance, repeat Step 3.3 for **mixtures of two options**.  
  5. **Stop Conditions**:  
     - No more dominances found.  
     - Payoffs are "too close" (>10% uncertainty) to declare dominance.  
     - Client out of time.  

  ---

  #### **Step 4: Address Uncertainty & Judgment**  
  - **Vague Payoffs**: If a cell’s payoff is ambiguous (e.g., "5–7" or "similar to B"), mark it and **skip elimination** for affected options. Say: *"Here, judgment trumps numbers—your call."*  
  - **Mixture Practicality**: If a mix dominates but the client dislikes randomization, note: *"Mathematically, mixing beats this, but if you won’t randomize, keep it and accept the risk."*  

  ---

  ### **Case Studies**
  #### **Case 1: Three-Option Tender (Strict Dominance by Mix)**  
  **Payoff Matrix**:  
  | Client \ Counterparty | Low Ball | High Ball |  
  |------------------------|----------|-----------|  
  | **Aggressive (A)**     | 10       | 0         |  
  | **Safe (S)**           | 0        | 10        |  
  | **Moderate (M)**       | 4        | 4         |  

  **Procedure**:  
  1. **Strict Dominance (Pure)**:  
     - A vs. M: A wins if Low Ball (10 > 4), but loses if High Ball (0 < 4). ❌  
     - S vs. M: S loses if Low Ball (0 < 4), wins if High Ball (10 > 4). ❌  
     - No eliminations.  
  2. **Strict Dominance (Mixed)**:  
     - Test if **mix of A and S** dominates M.  
       - Calculate mix payoffs for probability `p`:  
         - Low Ball: `p×10 + (1-p)×0 = 10p`  
         - High Ball: `p×0 + (1-p)×10 = 10(1-p)`  
       - Dominates M if:  
         `10p > 4` AND `10(1-p) > 4`  
         → `p > 0.4` AND `p < 0.6`.  
       - **Result**: Any mix with `p = 40–60%` (e.g., coin flip) yields >4 in both cases. **M is strictly dominated**.  
     - Eliminate M.  
  3. **Restart Checks**:  
     - Only A and S remain. Neither dominates the other. Stop.  
  **Surviving Options**: A, S.  

  **Client Presentation**:  
  > *"Moderate is eliminated because a coin flip between Aggressive and Safe guarantees you at least 5 in every scenario—beating Moderate’s flat 4. Even if you dislike randomness, this shows Moderate is inefficient. We focus on Aggressive vs. Safe."*  

  ---

  #### **Case 2: Client’s Favorite Eliminated by Mix (Weak Dominance)**  
  **Payoff Matrix**:  
  | Client \ Counterparty | Move X | Move Y |  
  |------------------------|--------|--------|  
  | **Favorite (F)**       | 5      | 5      |  
  | **Risky (R)**          | 10     | 1      |  
  | **Bold (B)**           | 1      | 10     |  

  **Procedure**:  
  1. **Strict Dominance (Pure)**:  
     - F vs. R: R wins if X (10 > 5), loses if Y (1 < 5). ❌  
     - F vs. B: B loses if X (1 < 5), wins if Y (10 > 5). ❌  
     - No eliminations.  
  2. **Strict Dominance (Mixed)**:  
     - Test if **mix of R and B** dominates F.  
       - Mix payoffs for `p = 0.5`:  
         - Move X: `0.5×10 + 0.5×1 = 5.5`  
         - Move Y: `0.5×1 + 0.5×10 = 5.5`  
       - Strictly dominates F? **5.5 > 5 in both cases → Yes!**  
     - Eliminate F.  
  3. **Restart Checks**:  
     - Only R and B remain. Neither dominates the other. Stop.  
  **Surviving Options**: R, B.  

  **Client Presentation (Key: Empathize + Educate)**:  
  > *"I know Favorite feels safe, but mathematically, a 50–50 mix of Risky and Bold guarantees 5.5 no matter what the counterparty does—beating Favorite’s 5. This doesn’t mean Favorite is ‘bad,’ but it’s inefficient: the mix gives you extra upside with no new downside.  
  >   
  > **If you avoid randomization**: You’d choose Risky or Bold alone. That’s riskier (you could get 1), but Favorite wasn’t dominating them anyway. Without knowing the counterparty’s move, the mix is objectively better.  
  >   
  > **Recommendation**: We drop Favorite and discuss how to manage risk in Risky/Bold—or if randomization is feasible."*  

  **Why This Works**:  
  - **Acknowledge emotion**: Validate their attachment to F.  
  - **Highlight logic**: Focus on the guaranteed improvement ("+0.5 everywhere").  
  - **Offer control**: Frame elimination as efficiency, not loss.  

  ---

  ### **Key Judgment Points**  
  1. **Dominance Thresholds**:  
     - Strict dominance requires **clear superiority** (>10% payoff gap).  
     - Weak dominance requires **no worse, strictly better somewhere** (use sparingly).  
  2. **Vague Payoffs**: If payoffs overlap (e.g., "Option A: 6–7", "Option B: 5–8"), say: *"Too close—I can’t eliminate here. Your experience decides."*  
  3. **Weak Dominance Order**: When multiple weak dominances exist, eliminate the option with the **lowest upside** first to preserve flexibility.  

  This procedure combines rigor with pragmatism, leveraging dominance reasoning to prune options while respecting client expertise on close calls. Iterate quickly, and use the whiteboard to visualize mixes (e.g., draw probability lines for `p`).
