            State X: 0.5*10 + 0.5*1 = 5.5
            State Y: 0.5*1 + 0.5*10 = 5.5

          So in both states, the mixture gives 5.5>5. Therefore, A is strictly dominated by the mixture of B and C.

          We eliminate A.

