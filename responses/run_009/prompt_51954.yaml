prompt: |-
  a friend in my department (semantics/logic guy) has an argument that every ontological dispute is verbal, and I think it proves too much, but I can't actually locate the broken step. here it is numbered:

  (1) A dispute is verbal iff the two sides could make their apparent disagreement disappear by agreeing on how to use words, without either side changing any belief about the world.
  (2) Take the dispute over whether there are tables (composite objects generally). the nihilist says: in my idiolect "exists" only applies to the basic entities, so no, there are no tables. the ordinary person says: in mine it doesn't work like that, so yes there are. both speak truly in their own idiolects, and once they see that, the disagreement evaporates — no belief about the world was touched.
  (3) So the tables dispute is verbal, and the same recipe handles numbers, persistence, the special composition question, all of it.
  (4) But the recipe also handles the dispute over whether the asteroid impact caused the extinctions. the skeptic just stipulates that in his idiolect "caused the extinction" means caused-it-and-left-exactly-the-kind-of-iridium-layer-that-was-found, and announces that on his usage it didn't happen. by (1)-(2) that dispute was verbal too. but that's obviously crazy — the guy has just left the room, and either the impact did it or it didn't.
  (5) So (1) or (2) has to go. but whenever I try to keep (2) for the tables case and deny it for the asteroid case, I need there to be a fact about whether our existing usage already settled the question, and my friend's whole story is that with composition there is no such fact — usage was never that determinate, which he says is exactly why metaphysicians cant point to a linguistic mistake the way you could refute the meteor crank.

  my instinct is that the trouble is in (1): making a disagreement endable-by-redefinition isn't the same as the disagreement having only ever been about words. but if I tighten (1) that way, my friend says the tables case stops coming out verbal too — before anyone stipulates anything, weren't those two people disagreeing about the world? — and honestly he might be right about that one. so: which premise do I give up, what does giving it up cost, and if he wins the tables case, what's left for the metaphysician to do that a linguist couldn't do just as well?
reasoning: |-
  Okay, the user is grappling with their friend's argument that every ontological dispute is merely verbal. The core issue is that the friend's reasoning seems to reduce even substantive disputes like the asteroid impact causing extinctions to verbal disagreements, which feels wrong. The user suspects premise (1) might be problematic but worries that tightening it could undermine their position on the tables dispute too. They're also concerned about the implications for metaphysics if all such disputes are verbal.

  First, I need to unpack the friend's argument step by step. Premise (1) defines a verbal dispute as one where disagreement disappears by agreeing on word usage without changing world beliefs. Step (2) applies this to the tables example: nihilist and ordinary person both speak truly in their idiolects, so their dispute is verbal. Step (3) extends this to other ontological issues. But step (4) shows the problem: applying the same logic to the asteroid case leads to the absurd conclusion that a clear factual dispute is verbal. Step (5) highlights the dilemma—rejecting (2) for the asteroid case requires a fact about whether usage already settled it, which the friend denies for ontological cases.

  The user's instinct is that (1) is too broad. I agree. The key flaw is that (1) conflates resolvability through stipulation with the dispute being purely verbal. The asteroid crank isn't just stipulating meaning; they're ignoring established usage and empirical facts. For ontological disputes, the meanings might genuinely be indeterminate, making them verbal. The distinction lies in whether there's a pre-existing, shared linguistic practice that settles the matter.

  Breaking this down: for the asteroid case, our current usage of "cause" includes proximate cause with typical evidence, so the crank's stipulation changes the meaning entirely. Their claim doesn't engage with the actual dispute. In contrast, for tables, there's no consensus on how "exists" applies to composites, making it genuinely verbal. 

  The user also worries about metaphysics becoming obsolete if disputes are just about words. But even verbal disputes can be substantive—they reveal conceptual ambiguities that need resolving based on theoretical virtues. Metaphysicians can still explore which conceptual framework best serves our purposes, which isn't just linguistics. 

  So, rejecting (1) as sufficient but not necessary is the move. The cost is that it requires a criterion for when usage is settled, which might involve normative elements. But this preserves the intuition that some disputes are factual. The tables case remains verbal because usage is indeterminate, while the asteroid case isn't. Metaphysicians then work on clarifying and refining concepts, which is distinct from descriptive linguistics.
answer: |-
  You've hit on a deep problem in metaontology! Your friend's argument cleverly exposes a tension, but **the flaw is in premise (1)**. It's too broad and mischaracterizes what makes a dispute "verbal." Here's the breakdown:

  1.  **Reject (1) as Sufficient (But Keep it as Necessary):**
      *   The core problem is that (1) provides a *sufficient* condition for a dispute being verbal that is *too easy to satisfy*. The meteor crank *can* make the disagreement *appear* to vanish by stipulating an idiosyncratic meaning, but this doesn't show the *original* dispute was *only* about words.
      *   **What (1) misses:** A dispute is genuinely verbal **only if** the *original disagreement stemmed solely from ambiguity or indeterminacy in the shared meaning of the terms as used in the dispute context*. The "agreement on how to use words" must involve *disambiguating or precisifying the existing, shared linguistic conventions* that were actually in play, *not* introducing entirely new, stipulative definitions disconnected from established practice.

  2.  **Applying the Fix:**
      *   **The Tables/Composition Case (Step 2):** This *is* plausibly verbal under the fixed definition. There is significant, genuine indeterminacy in ordinary language and even philosophical usage about what "exists" commits us to regarding composite objects. "Table" might refer to a genuine entity over-and-above its parts, or it might just be a convenient way of talking about parts arranged table-wise. When the nihilist and ordinary person clarify their idiolects, they are revealing this underlying semantic indeterminacy. Their *original* apparent disagreement was likely driven by unarticulated differences in how they were implicitly understanding "exists" or "object." No clear, shared, determinate meaning settles the ontological question beforehand.
      *   **The Asteroid Case (Step 4):** This is **NOT** verbal. Our shared concept of "cause" (especially in scientific/historical contexts like this) is relatively determinate on this point. We understand that causes are typically proximate events whose occurrence raises the probability of the effect, and we understand that evidence (like the iridium layer) is *evidence for* the cause, *not part of the definition of the cause itself*. The skeptic isn't revealing an ambiguity in our *existing* concept of "cause"; they are *changing the subject* by stipulating a bizarre, hyper-specific definition ("caused-it-and-left-exactly-this-iridium-layer") that nobody actually uses. Their claim, using their stipulated meaning, is true but *irrelevant* to the original dispute. The original dispute was about whether the impact was the *proximate cause* (as ordinarily understood) of the extinctions, a matter settled by physical evidence about impact dynamics, extinction timing, and environmental effects – beliefs about the world. The skeptic hasn't shown the original dispute was verbal; they've dodged it.

  3.  **Answering Your Friend's Pushback (Step 5):**
      *   **"Weren't they disagreeing about the world before stipulating?"** Yes, *but crucially, based on potentially different implicit understandings of the terms*. In the tables case, *because* usage is fundamentally indeterminate regarding composites, the "disagreement about the world" was illusory from the start – it was always mediated by unresolved semantic differences. Discovering the semantic difference resolves the *only* thing they were actually disagreeing about. In the asteroid case, the usage *is* sufficiently determinate. Both parties *were* using "cause" in roughly the same way, and *were* genuinely disagreeing about a worldly fact (the causal connection). The skeptic's stipulation doesn't resolve the original semantic indeterminacy (because there wasn't significant relevant indeterminacy); it creates a new meaning to avoid the factual disagreement.
      *   **The "No Fact of the Matter" Claim:** Your friend is right that for the tables case, there often *isn't* a pre-existing, usage-settled fact about whether composites "really exist" in the metaphysically heavyweight sense. That's *why* it's verbal. But he's wrong to generalize this to *all* disputes. In the asteroid case, there *is* a fact settled by usage: "cause" doesn't mean "cause plus leave exactly this specific piece of evidence". Usage *does* settle that the iridium layer is evidence *for* the cause, not part of *what it means to be* the cause. The crank *is* making a linguistic mistake relative to the shared meaning of the dispute.

  4.  **What's Left for Metaphysics (If the Tables Case is Verbal)?**
      Even if many ontological disputes are verbal in the sense above, metaphysics isn't dead, nor is it just linguistics. Here's what's left:
      *   **Conceptual Engineering:** Metaphysicians aren't just *describing* our concepts (like linguists). They are *evaluating* and *proposing* how we *should* conceptualize the world for specific theoretical purposes (simplicity, explanatory power, integration with science, avoiding paradox). "Should we adopt a conceptual scheme that quantifies over composite objects or only simples?" is a substantive, non-verbal question about theoretical virtue.
      *   **Uncovering Commitments:** Analyzing what our *best* scientific theories or successful ordinary practices *commit* us to, ontologically. This involves interpreting theories and identifying indispensable posits.
      *   **Exploring Fundamentality:** Investigating what is fundamental vs. derivative, even within a chosen conceptual scheme.
      *   **Addressing Genuinely Non-Verbal Ontology:** Some disputes *aren't* verbal. Debates about the nature of *fundamental* entities (e.g., Are there only quantum fields? Are space and time fundamental or emergent?) involve interpretations of physics where semantic indeterminacy about the core terms might be less prominent than in the composition debate. Disputes about mental causation or the ontological status of consciousness often involve substantive disagreements about how the world works, not just word meanings.
      *   **Articulating and Justifying Frameworks:** Providing systematic, coherent accounts of reality based on chosen fundamental posits and compositional principles.

  **In Summary:**

  *   **Give up:** Premise (1) as a *sufficient* condition for a dispute being verbal. The crank shows it's too easy to satisfy artificially.
  *   **Keep:** Premise (1) as a *necessary* condition. A dispute is only verbal *if* it *can* be resolved by clarifying existing semantic indeterminacy.
  *   **Refined Definition:** A dispute is verbal iff the apparent disagreement arises *solely* from ambiguity or indeterminacy in the *shared meaning of the terms as used in the original dispute context*, and clarifying that ambiguity resolves the disagreement without changing non-linguistic beliefs.
  *   **Cost:** This requires making judgments about the determinacy of shared linguistic meaning in specific contexts. This can be messy and sometimes contentious, but it's unavoidable. The asteroid case is a clear instance where the shared meaning *is* sufficiently determinate on the relevant point.
  *   **Metaphysics' Task:** If composition debates are verbal, metaphysicians shift from "discovering the truth about composites" to "evaluating which conceptual scheme (with composites or without) is theoretically superior and better aligns with our purposes." This is still a vital philosophical task distinct from descriptive linguistics. Metaphysics becomes more about framework selection, conceptual analysis, and understanding fundamentality within a framework than about settling disputes where meaning is genuinely indeterminate.
