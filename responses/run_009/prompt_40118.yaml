prompt: |-
  So last week I tried to call out my brother for constantly flaking on plans, and he hit me with "you're literally the king of flaking" and, annoyingly, he's not wrong, I've bailed on stuff plenty. It's been sitting with me because my gut says his flakiness doesn't automatically make my blame illegitimate, but in other situations my gut goes the other way. So I've been making a list of hypocrisy-and-blame cases and recording my snap verdicts, and I want someone to tell me if there's an actual principle behind them or if I'm just being self-serving. Here's the list:

  1. My friend Priya, who is chronically, flagrantly late to everything, got genuinely angry at me for being 40 minutes late to her birthday dinner. Verdict: she had no right to be angry at me, at least not out loud. Her blame had no standing.

  2. My uncle quit smoking fifteen years ago and regularly tells my cousin she should quit too, with real feeling. Verdict: he has standing. His smoking history doesn't disqualify him.

  3. A coworker who gossips moderately blames another coworker whose gossiping is far worse and actually destructive. Verdict: the blame is fine, standing intact.

  4. Someone who used to do the exact thing, stopped, and has apologized to the people affected, now blames a friend for still doing it. Verdict: standing, obviously.

  5. Someone says to their sister: "I know I'm the worst about this, I missed dad's surgery for a work thing, but not showing up to mom's memorial really hurt her and was wrong." Verdict: standing, and I'd even say strong standing — the candor seems to add something.

  6. Same situation, except the person never volunteers that they missed dad's surgery, but would freely admit it if asked, and doesn't think they were justified. Verdict: ...I keep flip flopping. Part of me says identical to case 5, part of me says something is lost when the confession doesn't happen.

  7. Someone who embezzled $50k from a past employer calls out a coworker for stealing $20 from the petty cash. Verdict: no standing, worse than case 1 even.

  8. Someone who has never cheated but is a workaholic who neglects their spouse blames a friend for cheating — the underlying disloyalty is arguably the same "in kind," just via a different route. Verdict: standing, and this one feels easy even though on paper it's structurally similar to case 7.

  So: is there one principle here, or do I need two? The obvious candidate my brother would push is something like "you have standing only if you're not now doing the thing," but that doesn't survive case 3, and maybe not case 5. Something about severity or proportionality might handle 7, but then case 8 needs explaining, since the workaholic's neglect could be worse for the spouse than a one-night stand would've been. And whatever principle you land on, tell me straight: which of my verdicts does it have to overturn, and what does it predict for the case I keep chewing on — my mom texting-while-driving-shaming me even though she did it herself for years and only quit because of an accident scare last month? Does a threat-of-consequences-driven stop count, or does it need to be a change of judgment?

  If it helps, distinguish for me between blame being unfair versus blame just being aimed by the wrong mouth, if those come apart. And please end with a last line of the form

  Verdict: <the principle in a short phrase, plus the verdict number you'd overturn>

  so I can actually extract your answer from the wall of text I'm expecting.
reasoning: |-
  Alright, let me try to unpack this user's dilemma. They're struggling with hypocrisy in blame, especially after their brother called them out for flaking. They made a list of scenarios and their snap judgments, looking for a consistent principle. 

  First, I need to understand why this matters to them. The brother's accusation clearly stung because it's true—they admit to flaking too. But they feel their criticism is still valid. Their examples show they're wrestling with when past actions disqualify someone from blaming others. 

  Looking at their cases, some patterns emerge. In case 1, Priya is currently late often, so her anger at the user's lateness seems hypocritical. Case 2: the uncle quit smoking long ago, so his advice feels legitimate. Case 3: moderate vs. destructive gossip—the blamer isn't as bad, so their criticism holds. Case 4: someone stopped, apologized, now blames—clear standing. Case 5: admitting their own fault adds credibility. Case 6 is tricky—same as 5 but without volunteering the confession. The user is unsure if that changes things. Case 7: embezzling $50k vs. stealing $20—no standing here. Case 8: workaholic vs. cheater—they see standing despite different forms of disloyalty.

  The user mentions their mom texting-while-driving-shaming after quitting only due to a scare. They wonder if quitting for safety reasons counts or if it requires genuine remorse. 

  Key themes: current vs. past behavior, severity, repentance, and whether the blamer is equally guilty. The uncle (case 2) stopped long ago, while the mom just quit. The user might question if her recent change is enough. Also, the difference between case 5 and 6—volunteering the fault vs. admitting when asked. Does transparency affect standing?

  The deeper need here is likely about fairness and self-justification. The user wants to call out their brother without being a hypocrite. They need a principle to navigate these situations without feeling like a fraud. Maybe they also want to understand if their mom's criticism is valid despite her past actions.

  The proposed principle of "current vs. past" works for most cases but not case 3 (gossip) and 8 (workaholic). Another angle: the blamer's behavior must not be equally severe or ongoing. But case 8 complicates that—different actions, same underlying harm. 

  Perhaps "moral standing" hinges on whether the blamer is actively contributing to the same harm. Priya (case 1) is currently late, so her criticism lacks standing. The embezzler (case 7) committed a worse offense, so their blame is hollow. The workaholic (case 8) isn't cheating, so they can criticize infidelity. 

  For case 6, volunteering the fault might strengthen standing but isn't essential. Admitting when asked shows awareness, so standing remains. The mom: she quit, even after a scare, so she has standing. The reason for quitting might not matter if the behavior stopped.

  The user might be seeking validation that their criticism of their brother is legitimate despite their own flaking. If they're currently working on it, maybe they have standing. Or perhaps admitting fault (like case 5) would help. 

  In conclusion, the core principle is about the blamer's current relationship to the wrongdoing. If they're not perpetuating it, they can criticize. Overturning case 6—standing still holds without volunteering the confession. The mom has standing because she stopped, regardless of her reason.
answer: |-
  You're wrestling with the **Principle of Standing in Moral Criticism**, and your cases reveal a remarkably consistent pattern: **Standing depends on the blamer not currently engaging in *equally severe or worse* instances of the *same core failing* they're condemning.** It's not merely about past behavior, but about **current hypocrisy in the specific domain of blame**.

  Here's how it applies to your cases:

  1.  **Priya's Lateness:** Verdict **SUPPORTED**. Priya is *currently, chronically* late (same failing). Her blame lacks standing because she's actively committing the same offense she condemns, at comparable severity.
  2.  **Uncle & Smoking:** Verdict **SUPPORTED**. The uncle quit *long ago*. He is not *currently* smoking (same failing). His past doesn't invalidate his current moral stance.
  3.  **Gossiping Coworker:** Verdict **SUPPORTED**. The blamer gossips *moderately* but condemns *destructive* gossip. The severity isn't equivalent. They aren't committing the *specific, worse* harm they criticize. Standing intact.
  4.  **Stopped, Apologized, Now Blames:** Verdict **SUPPORTED**. They've stopped, shown remorse, and aren't currently doing it. Clear standing.
  5.  **"I know I'm the worst...":** Verdict **SUPPORTED**. Candor *enhances* standing by acknowledging the failing, but the core principle holds: they aren't *currently* committing the *same specific act* (missing *this* memorial) they condemn. Their past failing doesn't negate the truth of their statement about the *current* act.
  6.  **Same but no volunteered confession:** Verdict **OVERTURNED (by the principle)**. This is identical to Case 5 *in terms of standing*. If they *would* admit their past failing and acknowledge it was wrong (i.e., they aren't *currently* justifying it or pretending they didn't do it), their standing to condemn the *current* act isn't lost. The lack of volunteered confession might make them *less persuasive* or *more annoying*, but it doesn't inherently destroy their standing to point out the objective wrong. Standing remains.
  7.  **Embezzler vs. Petty Thief:** Verdict **SUPPORTED**. The embezzler committed a *far worse* instance of the *exact same core failing* (stealing from employer). Criticizing a *lesser* instance of the *same* wrong while having done something far worse *without addressing it* destroys standing. It's profound hypocrisy.
  8.  **Workaholic vs. Cheater:** Verdict **SUPPORTED**. While both involve disloyalty, they are *different failings* (neglect vs. betrayal/external action). The workaholic isn't *currently* cheating (the specific failing they condemn). They *can* legitimately condemn the *specific act* of cheating, even if their *own* failings are severe and related. The "in kind" argument is too vague here; the *specific wrong condemned* is distinct.

  **Applying the Principle:**

  *   **Your Brother:** If you are *currently* flaking just as much/often as he is, your standing to condemn *his specific flake* might be weak. If you've meaningfully improved (even if imperfectly) and aren't flaking on *him* at a comparable rate, your standing is stronger. Your past flaking weakens your *persuasiveness*, but doesn't automatically destroy standing *if* your current behavior shows improvement relative to the specific instance you're criticizing. Your gut is right: his flaking doesn't make the *fact* of his flaking wrong, but it *can* weaken your *position* to call him out effectively.
  *   **Your Mom (Texting & Driving):** Verdict: **She HAS standing.** She *stopped* the behavior. The reason for stopping (genuine change of heart vs. fear of consequences) is irrelevant to *standing*. What matters is she is not *currently* engaging in the exact behavior she condemns. Her criticism is valid. (Though her *persuasiveness* or your *resentment* might be affected by *why* she stopped or her past actions).

  **Distinguishing "Unfair" vs. "Wrong Mouth":**

  *   **Unfair Blame:** The criticism is factually incorrect or disproportionate *regardless of who says it*. (E.g., blaming someone for being 5 minutes late to a casual hangout).
  *   **Wrong Mouth (Lacking Standing):** The criticism *may be factually correct*, but the person delivering it is actively, hypocritically guilty of the same or worse, undermining their *authority* or *right* to deliver that criticism in that moment. (E.g., Priya blaming you for lateness). Standing is about the *credibility and legitimacy of the blamer* in that specific context, not necessarily the absolute truth of the criticism.

  **Verdict: Standing requires blamer not currently committing same/similar-severity failing; Overturn Case 6.**
