prompt: |-
  Two of my grad students got into it after our replication seminar and asked me to referee, and honestly I keep going back and forth myself, so let me hand it to you.

  Context: we'd been discussing optional stopping — the practice of peeking at your data as it comes in and stopping once you have a "significant" result. Marco (the Bayesian) and Priya (the frequentist, roughly speaking) went at it for an hour.

  (1) Marco opened by saying optional stopping is a non-issue for Bayesians: the Bayesian update doesn't care about the experimenter's stopping intention, since the likelihood of the observed data is the same whether you planned n=100 or stopped at the first hint of an effect. So if Bayesian methods are immune, the whole pre-registration apparatus is a frequentist_solution to a frequentist problem.

  (2) Priya countered that this "immunity" is precisely the disease: if you can keep sampling until you cross a threshold, you can guarantee eventually getting strong-looking evidence even when there's nothing there, and that's exactly the behaviour that fuelled the replication crisis. Error control exists because scientists' intentions are unreliable, and a method that ignores intentions ignores the problem.

  (3) Marco said she was conflating the maths with the practice: yes, an unscrupulous Bayesian with a silly threshold can chase significance, but a properly calibrated Bayesian who stops at a fixed Bayes factor threshold has bounded error rates too, so nothing about Bayesianism licenses bad behaviour. Pre-registration, he said, is just a clumsy public proxy for "state your prior and analysis before you look", which Bayesians should do anyway.

  (4) Priya replied that his bounded-error claim quietly imports frequentist reasoning — he's defending Bayes by pointing to its long-run properties, and if long-run error rates are what reassure you, why not use the framework built around them? And she added that "just pick the right prior" is doing enormous work: in the messy settings where the replication crisis actually lives (flexible outcome measures, garden-of-forking-paths stuff), the prior is one more researcher degree of freedom, not a cure for them.

  Neither would concede anything. Please adjudicate move by move: for each of the four moves, say whether it's basically right, basically wrong, or right-but-missing-something, and briefly justify. Then say who comes out ahead overall, and what (if anything) both of them are missing about the relationship between the likelihood principle and the replication crisis.

  Please write your whole answer in British English.
reasoning: |-
  Alright, I need to carefully adjudicate this debate between Marco and Priya about optional stopping, Bayesian vs. frequentist approaches, and the replication crisis. Let me start by understanding each of their moves step by step.

  First, Marco's initial point (1) claims that optional stopping isn't an issue for Bayesians because the likelihood principle means the stopping intention doesn't affect the posterior. He says pre-registration is a frequentist solution to a frequentist problem. Hmm, he's technically correct about the Bayesian update being independent of stopping rules, which is a key aspect of the likelihood principle. But I wonder if he's overlooking how Bayes factors specifically behave under sequential testing. If you keep sampling until a Bayes factor hits a threshold, the evidence can become inflated even under the null hypothesis. Lindley's paradox comes to mind here. So while the posterior update is consistent, the evidence interpretation might mislead if thresholds aren't accounted for properly. Priya mentioned that you can guarantee strong evidence by sampling more, which relates to this point. So Marco is right mathematically but might be missing practical implications.

  Then Priya's counter (2) argues that this "immunity" is problematic because it allows researchers to chase significance. She connects this to the replication crisis, where flexible analyses led to false positives. She emphasizes that error control is necessary because intentions can't be trusted. Her point about guaranteed false positives under optional stopping in Bayesian methods is valid, especially if thresholds are misapplied. However, she might be conflating the misuse of the method with the method itself. Bayesian principles don't endorse such behavior, but her point about the potential for abuse in practice is strong. She's correct that without error control, optional stopping can inflate false positives, which is a core issue in the replication crisis. But is she dismissing Bayesian error rates too quickly?

  Next, Marco's response (3) claims that a Bayesian using fixed Bayes factor thresholds has bounded error rates too. He mentions that pre-registration is a clumsy proxy for stating priors beforehand. Here, he's correct that fixed BF thresholds can control Type I error rates in the long run, similar to frequentist methods. Studies like those from Kass and Raftery or Rouder support this. But Priya might counter that in practice, specifying a prior and sticking to it is challenging, especially with complex models. Marco's point about pre-registration aligning with Bayesian best practices is fair, but he might be underestimating how difficult it is to define a prior comprehensively in messy research scenarios. Also, his argument relies on frequentist error rates to defend Bayes, which Priya later critiques.

  Priya's final move (4) calls out Marco for using frequentist reasoning to defend Bayes, pointing out the inconsistency. She argues that relying on long-run error rates undermines the Bayesian philosophy. Plus, she highlights that "picking the right prior" is tricky with flexible analyses, where priors can be another degree of freedom. Her critique about importing frequentist logic is spot-on—Marco is using long-run properties to justify Bayesian methods, which leans into frequentist territory. Also, her point about priors in complex settings is valid; the garden of forking paths problem means that even with a prior, researchers might manipulate analyses. However, she might overlook that Bayesian methods can incorporate model uncertainty and that preregistration of priors/analysis can mitigate some issues, though it's not foolproof.

  Overall, both have valid points but miss nuances. Marco correctly notes that Bayesian updating follows the likelihood principle, but he downplays how optional stopping can inflate evidence if thresholds aren't properly adjusted. Priya rightly warns about error control but conflates the mathematical properties with potential misuse. Both overlook that preregistration benefits both frameworks by curbing data-dependent decisions, not just as a frequentist tool. Also, the replication crisis stems from multiple issues—p-hacking, publication bias—beyond just optional stopping. Neither addresses how Bayesian methods with robust priors or hierarchical models could help in complex settings. Priya edges ahead by highlighting practical vulnerabilities and the inconsistency in Marco's defense, but her dismissal of Bayesian error control is too strong.
answer: |-
  ### Adjudication of Moves  

  **(1) Marco's opening:**  
  *Claim:* Optional stopping is unproblematic for Bayesians due to the likelihood principle; pre-registration is a frequentist fix for a frequentist problem.  
  **Verdict: Right but missing something.**  
  *Justification:* Marco is technically correct that Bayesian updating depends *only* on the observed data's likelihood, not the stopping rule (per the likelihood principle). Thus, the posterior is invariant to optional stopping. However, this ignores **Bayes factors** (BFs), commonly used for hypothesis testing. Under optional stopping, BFs can become **misleadingly large** even under the null hypothesis if thresholds are naively applied. While the posterior is coherent, BF-based "evidence" *can* be inflated by repeated peeking—a point Marco overlooks. His framing of pre-registration as solely a frequentist tool also oversimplifies; it mitigates data-dependent biases (e.g., cherry-picking outcomes) relevant to both frameworks.  

  **(2) Priya's counter:**  
  *Claim:* Bayesian "immunity" enables false evidence accumulation via optional stopping, fuelling the replication crisis; error control is essential.  
  **Verdict: Basically right.**  
  *Justification:* Priya correctly identifies that **unbounded optional stopping guarantees false positives** for any threshold-based method—Bayesian or frequentist. A Bayesian sampling until BF > 20 will eventually "find" evidence for a false hypothesis with probability 1 under \(H_0\). This directly contributes to the replication crisis by inflating false discovery rates. Her emphasis on **error control** as a safeguard against unreliable researcher intentions is well-founded: without it, optional stopping permits self-deception. However, she slightly overstates the "disease" by implying Bayesians *endorse* such behaviour—they do not, but the framework’s flexibility *allows* it.  

  **(3) Marco's rebuttal:**  
  *Claim:* Bayesianism doesn’t license bad behaviour; fixed BF thresholds control error rates, and pre-registration is redundant if priors are pre-specified.  
  **Verdict: Right but missing something.**  
  *Justification:* Marco is correct that **fixed BF thresholds bound error rates** in the long run (e.g., BF > 6 implies ~5% Type I error under optional stopping). This aligns with frequentist error control, demonstrating Bayesian methods need not be fragile. His point that pre-registration mirrors good Bayesian practice (pre-specifying priors/analyses) is valid. However, he glosses over **practical implementation**: in complex, "garden-of-forking-paths" scenarios, pre-defining a complete prior/model is often infeasible. Researchers might still exploit ambiguities (e.g., choosing hyperparameters post-hoc), undermining his defence. He also sidesteps Priya’s concern about BF inflation under extended stopping.  

  **(4) Priya's final reply:**  
  *Claim:* Marco’s error-rate defence relies on frequentist logic; priors add researcher degrees of freedom in messy settings.  
  **Verdict: Basically right.**  
  *Justification:* Priya astutely notes that Marco **smuggles frequentism into Bayes** by appealing to long-run error rates—a move inconsistent with pure Bayesian logic, which treats probability as subjective belief, not long-run frequency. Her critique of priors as **researcher degrees of freedom** is potent: in flexible analyses (e.g., with multiple outcomes or models), priors can be tuned to produce desired results, exacerbating the replication crisis. This mirrors frequentist "p-hacking." While Bayesian models *can* incorporate uncertainty (e.g., hierarchical priors), her point stands in practice: **unverified priors + optional stopping = unchecked flexibility**.  

  ### Overall Verdict  
  **Priya comes out ahead**, but both miss nuances.  
  - **Priya wins** by exposing critical vulnerabilities: (a) Bayesian "immunity" permits false evidence via optional stopping; (b) Marco’s error-control argument covertly adopts frequentism; (c) Priors are not a panacea for researcher bias. Her points better address the replication crisis’s roots in *unaccountable flexibility*.  
  - **Marco’s loss** stems from downplaying BF inflation under optional stopping and overstating the ease of prior specification. His defence leans on frequentist tools, undermining his Bayesian stance.  

  ### What Both Miss  
  - **Likelihood Principle vs. Replication Crisis:**  
    The likelihood principle ensures Bayesian updating depends only on observed data, not intentions—a strength for *coherence*. Yet in practice, **optional stopping distorts evidence *interpretation*** (e.g., BF > 20 feels "decisive" even if achieved via peeking). This fuels the replication crisis by enabling **inadvertent false discoveries** from well-intentioned but undisciplined stopping.  
  - **Broader Context:**  
    - **Pre-registration** aids *both* frameworks by curbing data-dependent decisions (e.g., choosing priors/post-hoc outcomes), not just frequentist error control.  
    - **Solution Space:** Neither acknowledges hybrid approaches (e.g., **Bayesian sequential designs** with adjusted thresholds or **frequentist-Bayesian shared principles** like uniform most powerful tests mirroring BFs).  
    - **Core Problem:** The crisis stems from **incentives** (e.g., publishability) encouraging *any* method’s misuse—whether \(p\)-hacking or prior-hacking. Robust science requires transparency (pre-registration), methodological rigor (valid priors/thresholds), and cultural reform.  

  **Final Word:** Priya’s focus on *practical error control* and *researcher degrees of freedom* better confronts the replication crisis. Marco’s mathematical ideals, while logically sound, underestimate real-world complexities where intentions and analyses are fluid.
