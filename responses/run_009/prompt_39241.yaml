answer: |-
  You've articulated a profound and under-discussed systemic pathology with remarkable clarity. This **isn't just Goodhart's Law**, and the streetlight effect is only a partial cousin. What you're describing is a **system-level evolutionary pressure favoring quantifiable interventions**, driven by the *structure* of funding and evaluation, not (necessarily) individual bad faith. It's a **structural quantification bias** with emergent consequences.

  Here's the carving you need:

  1.  **The Core Concept & Proposed Name:** **Systemic Quantification Bias (SQB)** or **Metric Drift**
      *   **Definition:** *The phenomenon whereby the cumulative effect of funders preferentially allocating resources based on the availability of quantifiable impact evidence creates evolutionary pressure within a social impact ecosystem (charities, researchers, interventions). This pressure systematically favors interventions that are inherently easier to measure, distorts research priorities towards measurable outcomes using established quantitative methods, and gradually marginalizes potentially valuable but less quantifiable approaches, ultimately narrowing the ecosystem's scope of action and potentially reducing overall effectiveness.*
      *   **Key Mechanism:** **Selection pressure via resource allocation.** It's evolution, not gaming. Organizations and research programs that align with measurable outputs are selected for (funded); those that don't adapt or can't adapt are selected against (defunded). Adaptation often involves shifting activities towards what *can* be counted, even if it's less impactful.
      *   **Distinction from Goodhart's Law:** Goodhart focuses on *gaming* a specific target once it's set (e.g., teachers teaching to the test, charities inflating pill counts). SQB is about the *initial selection and evolutionary reinforcement* of *what gets measured and funded* in the first place. Goodhart happens *after* a target is set; SQB happens in the *setting* of the targets/measures themselves due to systemic pressures. Goodhart is often intentional manipulation; SQB is often unintentional adaptation for survival.
      *   **Distinction from the Streetlight Effect:** The streetlight effect is a *cognitive bias* of an *individual* searching where it's easy (under the light) rather than where the answer likely is (in the dark). SQB is a *systemic, emergent property*: the *entire ecosystem* evolves so that *most activity occurs under the existing streetlights*, and new streetlights are only built where it's easy. The individual funder is rationally choosing the best-lit option; the system evolves to make that the *only* lit option.

  2.  **The "Weirder Flavor" - Decorative Uncertainty:**
      *   This is **Quantification Fetishism** or **Numerical Illusion of Precision**. The presence of *any* number, even one swamped by massive uncertainty or based on shaky assumptions, creates an illusion of objectivity and rigor that trumps qualitative judgment or honest epistemic humility ("we don't know"). The uncertainty is acknowledged but functionally ignored because the *form* (a number) satisfies the systemic demand for quantification. It's the *ritual* of quantification overriding its substance.

  3.  **Boundaries & Edge Cases:**
      *   **Where SQB Collapses into Goodhart:** If an organization *intentionally and deceptively* changes its activities *solely* to generate better-looking numbers *without any belief it improves real impact* (e.g., distributing useless pills just to count them), that's classic Goodhart gaming. SQB encompasses the *non-deceptive* adaptation where an org genuinely shifts to a *less optimal but fundable* countable activity (e.g., shifting from complex community organizing they believe is vital to simpler, countable training workshops they believe is less effective but fundable).
      *   **Where SQB Collapses into Streetlight:** If a *single funder*, faced with multiple options, chooses *only* the one with clear numbers *for that specific decision* without considering building capacity to measure others, that's the streetlight effect. SQB is the consequence of *many such funders* making similar choices over time, shaping the *entire landscape* of available options and measurement capabilities.
      *   **Where SQB Overlaps with Campbell's Law:** Campbell's Law ("The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor") is a close cousin. SQB focuses specifically on the *evolutionary selection pressure* created by funding decisions based on quantification, leading to ecosystem *narrowing* and *distortion of activities/research*. Campbell's Law is broader, covering any corrupting use of an indicator. SQB is a specific manifestation of Campbell's Law driven by resource allocation.
      *   **The McNamara Fallacy Connection:** The McNamara Fallacy (focusing solely on quantifiable factors while ignoring unquantifiable ones that may be more important) is the *fundamental cognitive error* that *enables* SQB. SQB is the *systemic institutionalization and evolutionary reinforcement* of that fallacy over time.

  4.  **Why Existing Terms Aren't Sufficient:**
      *   **Goodhart's Law:** Focuses on gaming a target, not the evolutionary selection *of* targets/measures.
      *   **Streetlight Effect:** Focuses on individual search bias, not systemic ecosystem evolution.
      *   **Campbell's Law:** Broadly covers indicator corruption but doesn't emphasize the specific funding-driven evolutionary mechanism and ecosystem narrowing.
      *   **McNamara Fallacy:** Identifies the error in prioritizing the quantifiable but doesn't capture the dynamic, emergent, evolutionary nature of the problem within a funding ecosystem.
      *   **Quantification Bias/Obsession/Fetishism:** These describe the *attitude* but not the *systemic process and emergent consequence*.

  **In essence, Systemic Quantification Bias (SQB) / Metric Drift is:**

  *   **Systemic:** An emergent property of the funding/evaluation ecosystem.
  *   **Evolutionary:** Driven by selection pressure (funding) favoring measurable interventions/research.
  *   **Narrowing:** Leads to a drift away from less quantifiable (but potentially vital) work.
  *   **Self-Reinforcing:** Easier-to-measure work gets funded, attracts more researchers to measure it, develops better tools, making it even easier to measure/fund, further marginalizing the unmeasured.
  *   **Not (Necessarily) Fraudulent:** Driven by adaptation for survival, not deception.

  **Using the Term:**

  *   "The dominance of deworming and cash transfers in EA funding isn't just about proven effectiveness; it's also a result of **Systemic Quantification Bias** favoring interventions that generate clean RCTs and countable outputs."
  *   "Our grantmaking process needs to actively counter **Metric Drift** by reserving funds for high-potential, hard-to-measure systemic interventions and investing in better measurement for neglected areas."
  *   "That complex Bayesian model with 95% CIs spanning an order of magnitude? That's **Quantification Fetishism** – it feels rigorous but the precision is mostly decorative."

  You've identified a critical flaw in how impact-oriented communities often operate. Naming it (**Systemic Quantification Bias** / **Metric Drift**) and understanding its mechanisms is the first step to mitigating it. This requires conscious effort to fund "measurement R&D" for hard-to-quantify areas, reserve pools for promising qualitative work, value diverse forms of evidence, and explicitly recognize the limitations of quantification – especially when the decimals are just for show.
