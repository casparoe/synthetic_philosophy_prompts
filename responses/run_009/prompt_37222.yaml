prompt: |-
  I run hiring at a mid-size company (~200 people), and I've gotten pretty skeptical of our credential screens. We filter on things like CS degrees, take-home projects, referrals from current employees, stints at certain big-name companies -- but I suspect half of these are things candidates can cheaply acquire to *look* good rather than honest signals of what we actually want. I've been reading a bit about signaling theory, including the handicap principle from biology, and the core idea I want to operationalize is roughly: a signal is only trustworthy when it's costly in a way that's *more* costly for the kind of person we don't want than for the kind we do. That, and maybe the point that if the signal is cheap for everyone it just pools everyone together and tells us nothing.

  Please turn that into a procedure my recruiters and I can actually run on any screen we use or are considering hiring for -- a set of questions to ask in order, what counts as a sufficient answer to each, where it stops with a clear "drop this screen," where it says "keep it but reweight it," and where it admits it can't decide and a human has to make a values call about what we're even trying to hire for. It should also flag the failure modes where the cost structure looks right but the signal still misleads -- like when the signal is costly for everyone but costly in the wrong currency (spare time instead of skill), or when lots of other companies copy the same screen and it stops discriminating between anyone.

  Then run the procedure on three of our current screens: requiring a CS degree, an unpaid take-home project that takes candidates maybe six hours, and referrals from current employees. Run it honestly, including on whichever one is my favorite -- I suspect the referrals one, since everyone here loves referrals. And tell me what the procedure can't do, like whether it can tell us at all whether the trait being signaled is worth signaling in the first place.
reasoning: |-
  We are going to design a procedure to evaluate any hiring screen based on signaling theory, particularly the handicap principle. The core idea is that a trustworthy signal must be more costly for low-quality candidates (the ones we don't want) than for high-quality candidates (the ones we do want). Also, if the signal becomes too cheap or too common, it may lose its discriminative power.

  The procedure will consist of a series of questions. For each question, we'll define what a sufficient answer is and what the implications are for the screen.

  **Procedure: Evaluating a Hiring Screen**

  1. **Define the Trait We Want**: What is the specific trait or ability we are trying to predict with this screen? (e.g., programming skill, problem-solving ability, cultural fit, etc.)
     - *Sufficient answer*: A clear and specific trait that is job-relevant.
     - *If not clear*: Stop and redefine the screen or drop it. Without a clear trait, we cannot evaluate the signal.

  2. **Cost Structure Analysis**:
     - **Question 2a**: Is the signal costly to acquire or produce? (i.e., does it require significant time, effort, resources, or opportunity cost?)
       - *No*: Then it's a weak signal (cheap signals can be faked) -> Consider dropping or using only as a very minor factor.
       - *Yes*: Proceed to 2b.
     - **Question 2b**: Is the cost of the signal *differentially* costly? Specifically, is it less costly for candidates with the desired trait (high-quality) than for those without (low-quality)?
       - *No, it's equally costly for both*: Then it's not a good signal (it doesn't discriminate) -> Drop the screen or use only if there's no better alternative and the cost is high enough to deter low-quality candidates (but note: this might also deter high-quality ones if they have better options).
       - *Yes, it's more costly for low-quality candidates*: Proceed to step 3.
       - *Unclear*: Requires further investigation (e.g., data, surveys, expert opinion) to determine the differential cost. If after investigation it's still unclear, then we mark the screen as "needs human judgment" and note the uncertainty.

  3. **Currency of Cost**:
     - **Question 3**: Is the cost incurred in a currency that is aligned with the trait we are trying to signal? (e.g., if we are testing programming skill, the cost should be in programming effort, not just spare time or money.)
       - *Yes*: Proceed to step 4.
       - *No*: The signal might be misleading because it is costly in the wrong way (e.g., it selects for candidates with a lot of free time or money, not the desired trait). This is a failure mode. We should either drop the screen or adjust it so the cost is in the right currency.

  4. **Signal Saturation and Copying**:
     - **Question 4**: Has the signal become widely adopted by many companies or easily gamed by candidates (e.g., through preparation services, widespread sharing of solutions, or becoming a common requirement that everyone has)?
       - *No, it's still relatively rare and hard to game*: The signal is strong -> Keep and weight appropriately.
       - *Yes, it's common and/or easily gamed*: The signal may have lost its discriminative power (pooling equilibrium) -> Consider dropping or de-weighting it. Alternatively, we might keep it as a minimum bar but not as a strong positive signal.

  5. **Practicality and Ethics**:
     - **Question 5**: Is the signal practical and ethical to use? (e.g., does it create unfair barriers for certain groups? Is it legally defensible? Does it scale in our hiring process?)
       - *Yes*: Proceed.
       - *No*: Drop the screen regardless of its signaling properties.

  **Where the procedure stops**:
  - At any step, if the answer leads to "drop", we discontinue the screen.
  - If we get to step 4 and the signal passes, we keep it and use it as a positive signal.
  - If at step 2b the differential cost is unclear, we mark the screen for human judgment and use it cautiously.

  **What the procedure cannot do**:
  - It does not tell us whether the trait we are signaling is worth signaling in the first place. That requires a separate analysis of job performance and what traits predict success in the role.
  - It does not account for interactions between multiple signals (e.g., using both a degree and a project might be redundant or complementary).

  Now, let's run this procedure on the three screens: requiring a CS degree, an unpaid take-home project (6 hours), and referrals from current employees.

  ---

  **1. CS Degree**

  - **Step 1: Define the Trait** 
    - We want to signal foundational knowledge in computer science, the ability to learn complex technical concepts, and possibly perseverance to complete a degree.
    - *Sufficient*: Proceed.

  - **Step 2: Cost Structure Analysis**
    - **2a**: Is it costly? Yes, a degree typically takes 4 years and significant tuition. 
    - **2b**: Differential cost? 
      - For a high-quality candidate (who is smart and motivated), getting a degree is still costly but perhaps less so because they are more efficient at learning and passing courses. However, a low-quality candidate might also get a degree by just scraping through or attending a less rigorous program. The cost in time and money is high for both, but it may not be differentially costly in a way that separates high from low quality. Many high-quality candidates might skip the degree (e.g., self-taught) and many low-quality candidates might have a degree. 
      - *Answer*: Unclear. It's not clearly more costly for low-quality candidates because once you are in a program, you can often graduate with a low GPA or from a less selective school. Also, high-quality candidates without a degree are excluded. We need human judgment: the degree might be a signal of persistence and baseline knowledge but not a strong signal of high skill. 

  - **Step 3: Currency of Cost**
    - The cost is in time and money, which is not directly aligned with programming skill or problem-solving. It might select for people who can afford college and have the time to spend 4 years. 
    - *Answer*: No, the currency is not aligned (it's more about financial resources and time availability) -> Failure mode.

  - **Step 4: Signal Saturation**
    - Very common. Almost every company uses degrees as a filter. Many candidates have degrees, and there are many institutions offering degrees of varying quality. 
    - *Answer*: Yes, it's common and has lost discriminative power -> Drop or de-weight.

  - **Step 5: Practicality and Ethics**
    - It is practical (easy to check) but may be unethical if it excludes talented candidates who couldn't afford college. Also, it might have a disparate impact on certain groups.

  - **Conclusion for CS Degree**: 
    - The signal is saturated and the cost is in the wrong currency. It fails on differential cost (unclear at best) and saturation. We should drop it as a strict requirement and de-weight it. Consider using it only as one of many factors or for entry-level roles where we have less data.

  ---

  **2. Unpaid Take-Home Project (6 hours)**

  - **Step 1: Define the Trait**
    - We want to signal practical programming skills, problem-solving, and the ability to complete a task similar to real work.
    - *Sufficient*: Proceed.

  - **Step 2: Cost Structure Analysis**
    - **2a**: Is it costly? Yes, 6 hours is a significant time investment.
    - **2b**: Differential cost? 
      - For a high-quality candidate (who is skilled and efficient), the project might take less time and be less burdensome. For a low-quality candidate, it might take more than 6 hours or be very difficult. However, note that a low-quality candidate might outsource the project (cheating) or spend excessive time to brute-force a solution. Also, high-quality candidates with many job options might refuse to do it because the opportunity cost is too high (they might have better uses of their time). 
      - *Answer*: It's intended to be more costly for low-quality candidates, but in practice, it might be more costly for high-quality candidates who are in high demand and have many opportunities (they may drop out). Also, cheating is a risk. So, it's unclear. 

  - **Step 3: Currency of Cost**
    - The cost is in time and effort, and the task is directly related to programming. The currency is aligned (programming effort) for the trait we want (programming skill). 
    - *Answer*: Yes, aligned.

  - **Step 4: Signal Saturation**
    - Take-home projects are common, and candidates might share solutions online. However, if we design unique projects, it might be less of an issue. Still, candidates might be doing many of these for different companies. 
    - *Answer*: It's becoming more common and candidates are getting fatigued. This might lead to high-quality candidates opting out. So, it's at risk of saturation.

  - **Step 5: Practicality and Ethics**
    - It is practical but unpaid work. Some candidates feel it's exploitative. Also, 6 hours is a lot, and it may disadvantage candidates with limited free time (e.g., those with family responsibilities or multiple jobs). 

  - **Conclusion for Take-Home Project**:
    - The currency is right, but the differential cost is questionable (because high-quality candidates might be more likely to refuse) and it's becoming saturated. We should reweight it: use it but only for candidates who have passed an initial screen (so we don't waste the time of candidates we are not serious about) and consider compensating for the time. Also, we should monitor the drop-off rate of high-quality candidates.

  ---

  **3. Referrals from Current Employees**

  - **Step 1: Define the Trait**
    - We want to signal cultural fit, reliability, and possibly skill (if the referring employee is trustworthy and knows the job requirements).
    - *Sufficient*: Proceed.

  - **Step 2: Cost Structure Analysis**
    - **2a**: Is it costly? 
      - For the candidate: Not directly. They just need to know an employee. But for the employee, giving a referral might be costly if they put their reputation on the line. 
      - However, we are screening on the candidate having a referral, so we must consider the cost to the candidate to get the referral. The candidate must network and build a relationship with an employee, which is costly (time and social effort). 
      - *Answer*: Yes, it can be costly for the candidate to build the necessary network.
    - **2b**: Differential cost? 
      - For a high-quality candidate (who is socially adept and has a good network), getting a referral might be less costly. For a low-quality candidate, it might be very costly (they might have to work hard to fake a relationship or convince someone). But note: an employee is unlikely to refer a low-quality candidate because it risks their reputation. So the cost to the candidate might not be the main factor; the employee's judgment is the barrier. 
      - However, the signal we are evaluating is the referral itself, which is produced by the employee. The cost to the employee is the risk to their reputation. This cost is higher for the employee if they refer a low-quality candidate (because if the candidate performs poorly, it reflects badly on the employee) and lower if they refer a high-quality candidate. 
      - Therefore, the signal (referral) is costly for the employee in a way that is more costly for a low-quality candidate (because the employee is less likely to refer them). 
      - *Answer*: Yes, the signal is differentially costly (via the employee's reputation) and in a way that aligns with candidate quality.

  - **Step 3: Currency of Cost**
    - The cost to the employee is in reputation, which is aligned with the trait we want (cultural fit and skill) because the employee is likely to refer someone they believe is good. However, note that the employee might refer based on friendship rather than skill, so the currency might be more about social connection than job ability. 
    - *Answer*: Partially aligned. It might be stronger for cultural fit than technical skill.

  - **Step 4: Signal Saturation**
    - Referrals are widely used and not easily gamed by candidates (because they require an inside connection). However, if employees refer too many people, the quality might dilute. Also, if we reward referrals regardless of outcome, employees might refer indiscriminately. 
    - *Answer*: Not saturated in the sense of being gamed by candidates, but we must manage the employee side to keep the signal strong.

  - **Step 5: Practicality and Ethics**
    - It is practical and common. However, it may lead to homogeneity (employees refer people like themselves) and exclude diverse candidates. 

  - **Conclusion for Referrals**:
    - The signal has good differential cost (through the employee's reputation cost) and is not easily gamed. However, the currency of cost might overemphasize social connections and cultural fit at the expense of skill. Also, there are diversity concerns. We should keep it but reweight it: use referrals as a positive signal but not as a substitute for skill assessment. Also, we should track the performance of referred candidates and adjust accordingly. To mitigate bias, encourage employees to refer from diverse networks.

  ---

  **Summary of Recommendations**:
  - **CS Degree**: Drop as a strict requirement. Use as a minor factor or for entry-level roles where alternatives are scarce.
  - **Take-Home Project**: Keep but reweight. Use later in the process, consider compensating, and monitor candidate drop-off.
  - **Referrals**: Keep but reweight. Use as one signal among many and actively manage for diversity.

  **What the Procedure Cannot Do**:
  - It cannot determine if the trait being signaled (e.g., having a CS degree) is actually predictive of job performance. That requires validation studies (e.g., track how well the signal correlates with job performance).
  - It does not tell us the relative importance of different traits (e.g., technical skill vs. cultural fit). That is a values call.
  - It does not account for the overall hiring process efficiency (e.g., the cost to the company of administering the screen).

  We should complement this procedure with data collection: track the success of hires based on the signals and adjust accordingly.
answer: |-
  Below is a step-by-step procedure to evaluate any hiring screen using signaling theory principles. The goal is to identify whether a screen is a trustworthy signal of candidate quality (e.g., skill, work ethic, cultural fit) or if it's easily gamed. I'll then apply it to your three screens (CS degrees, take-home projects, and referrals), and conclude with limitations.

  ---

  ### **Procedure: Evaluating Hiring Screens Using Signaling Theory**
  **Purpose**: To determine if a screen is a *trustworthy signal* (costlier for low-quality candidates than high-quality ones) or a *noisy/pooled signal* (equally cheap/costly for all, revealing nothing).

  #### **Step 1: Define the Target Trait**
  - **Question**: What specific trait does this screen aim to signal? (e.g., technical skill, problem-solving, commitment, cultural fit).  
  - **Sufficient Answer**: A concrete, job-relevant trait (e.g., "ability to ship production-ready code").  
  - **Red Flag**: Vague or multiple traits (e.g., "smartness" or "general diligence").  
  - **Outcome**:  
    - ✅ **Proceed** if trait is clear and job-relevant.  
    - ❌ **Drop/Rethink** if trait is ambiguous or irrelevant.  
    - ⚠️ **Human Values Call** if the trait’s importance is disputed (e.g., "prestige" vs. "skill").

  #### **Step 2: Cost Structure Analysis**  
  *Core question: Is the signal more costly for candidates who lack the target trait?*  
  - **Question 2a**: What is the **absolute cost** (time, money, effort) to acquire this signal?  
  - **Question 2b**: Is this cost **differentially applied**?  
    - *High-quality candidates* (with the trait) should find it easier/cheaper to produce.  
    - *Low-quality candidates* (without the trait) should find it harder/costlier.  
  - **Sufficient Answer**: Evidence that low-quality candidates face higher *marginal costs* (e.g., weak programmers need 2× time on coding tests).  
  - **Red Flags**:  
    - Costs are similar for all (e.g., everyone pays $50 for a certification).  
    - Costs fall disproportionately on groups you want (e.g., parents can’t spare 10 hours for unpaid work).  
  - **Outcome**:  
    - ✅ **Keep/Reweight** if costs are clearly higher for low-quality candidates.  
    - ❌ **Drop** if costs are similar or higher for high-quality candidates.  
    - ⚠️ **Investigate** if unclear (e.g., survey candidates or analyze historical data).

  #### **Step 3: Currency Alignment Check**  
  *Core question: Is the cost paid in a "currency" aligned with the target trait?*  
  - **Question**: Does the cost directly test the trait, or is it a proxy (e.g., requiring resources like time/money vs. skill)?  
  - **Sufficient Answer**: Cost currency matches the trait (e.g., coding tests cost *programming skill*, not just free time).  
  - **Failure Modes**:  
    - **Misaligned Currency**: Cost is in time/money, not skill (e.g., unpaid projects favor candidates with spare time).  
    - **Exploitable**: Signal can be bought/outsourced (e.g., paying for leetcode coaching).  
  - **Outcome**:  
    - ✅ **Keep** if currency aligns (e.g., skill-based costs).  
    - ❌ **Drop** if currency is misaligned (e.g., screens that filter for wealth/free time).  
    - 🔄 **Redesign** if fixable (e.g., pay for take-home projects).

  #### **Step 4: Signal Saturation Test**  
  *Core question: Has widespread adoption made this signal meaningless?*  
  - **Question**: Is the signal widely used or easily gamed?  
  - **Sufficient Answer**: Signal is rare, hard to fake, and not diluted by overuse.  
  - **Failure Modes**:  
    - **Pooling Equilibrium**: Everyone has the signal (e.g., all candidates list "Google" on résumés).  
    - **Gaming**: Low-quality candidates easily acquire it (e.g., bootcamps mass-produce "CS-like" credentials).  
  - **Outcome**:  
    - ✅ **Keep** if signal remains rare and hard to game.  
    - ❌ **Drop** if saturated (e.g., "big-name company" stints are common).  
    - ⚖️ **Downgrade** to a minimum bar (e.g., "CS degree required" → "any technical degree or 2 YOE").

  #### **Step 5: Final Decision Workflow**
  1. **Pass Step 1?** → Proceed. Else drop or redefine.  
  2. **Pass Steps 2–4?** → Keep as a strong signal.  
  3. **Partial pass?** → Flag for human judgment:  
     - *Step 2 failure*: Likely drop (poor discriminator).  
     - *Step 3 failure*: Drop or redesign (misaligned cost).  
     - *Step 4 failure*: Downgrade to a minimum bar.  
  4. **Values conflict?** → Escalate to leadership (e.g., "Should we prioritize pedigree or skill?").

  ---

  ### **Application to Your Screens**
  I’ll apply the procedure rigorously to your three screens, including referrals (your suspected favorite).

  #### **1. CS Degree Requirement**  
  - **Step 1 (Trait)**: Signals *technical foundation* and *perseverance*. **Sufficient**.  
  - **Step 2 (Cost Structure)**:  
    - Absolute cost: High (4 years, $100K+).  
    - Differential cost:  
      - High-quality candidates: Easier (strong students handle coursework efficiently).  
      - Low-quality candidates: Harder but *not impossible* (degree mills, cheating).  
    - **Red Flag**: Many high-quality candidates lack degrees (self-taught, bootcamps). Low-quality candidates can "buy" degrees. → **Differential cost WEAK**.  
  - **Step 3 (Currency)**:  
    - Costs are time/money, not skill. Favors privileged candidates. → **Misaligned currency**.  
  - **Step 4 (Saturation)**:  
    - Highly saturated (most applicants have degrees/certs). Easy to game (online degrees). → **Pooling equilibrium**.  
  - **Outcome**: ❌ **Drop as a key screen**.  
    - *Recommendation*: Downgrade to a minimum bar (e.g., "degree or equivalent experience") and pair with skill tests.

  #### **2. Unpaid Take-Home Project (6 Hours)**  
  - **Step 1 (Trait)**: Signals *practical coding skill* and *work ethic*. **Sufficient**.  
  - **Step 2 (Cost Structure)**:  
    - Absolute cost: Moderate (6 hours).  
    - Differential cost:  
      - High-quality candidates: Quick to complete (2–4 hours if skilled).  
      - Low-quality candidates: Costly/time-consuming (may cheat or struggle).  
    - **But**: High-quality candidates with options may refuse (opportunity cost). → **Differential cost MODERATE**.  
  - **Step 3 (Currency)**:  
    - Costs are in *time and skill* (aligned with coding ability).  
    - **Failure Mode**: Filters candidates with limited time (parents, second jobs). → **Partial misalignment**.  
  - **Step 4 (Saturation)**:  
    - Common practice, but projects can be made unique. Cheating is possible but harder. → **Moderate saturation**.  
  - **Outcome**: 🔄 **Keep but REDESIGN**.  
    - *Recommendation*: Pay candidates for time, use only post-phone-screen, and add anti-cheating measures (e.g., live Q&A on the solution).

  #### **3. Referrals from Current Employees**  
  - **Step 1 (Trait)**: Signals *cultural fit* and *reliability* (via employee trust). **Sufficient**.  
  - **Step 2 (Cost Structure)**:  
    - Absolute cost: Low for candidate (networking), but high for referrer (reputational risk).  
    - Differential cost:  
      - High-quality candidates: Easy to get referrals (strong networks, performance).  
      - Low-quality candidates: Harder (referrers avoid staking reputation on weak candidates).  
    - **Strong differential cost** via referrer’s "skin in the game."  
  - **Step 3 (Currency)**:  
    - Costs are in *social capital* (aligned with trust/fit).  
    - **Failure Mode**: Bias risk (employees refer similar demographics). → **Alignment but with DIVERSITY TRADEOFF**.  
  - **Step 4 (Saturation)**:  
    - Widely used but hard to game (requires insider access). → **Low saturation for trustworthiness**.  
  - **Outcome**: ✅ **Keep but REWEIGHT**.  
    - *Recommendation*: Use as a strong signal for fit, but balance with blind skill assessments. Incentivize diverse referrals (e.g., bonuses for hires from underrepresented groups).

  ---

  ### **What the Procedure Cannot Do**  
  1. **Validate the target trait’s importance**: It assumes you’ve defined a valuable trait (e.g., "Is cultural fit more important than raw skill?"). Human judgment is required here.  
  2. **Measure direct ROI**: It won’t quantify how much the signal improves hiring outcomes (e.g., 10% better retention). Pair with data tracking.  
  3. **Address ethical/legal issues**: A screen may pass signaling theory but be discriminatory (e.g., referrals amplifying bias). Always audit for fairness.  
  4. **Replace context**: Local factors matter (e.g., a CS degree may be a strong signal in regions with rigorous universities).  

  ### **Key Adjustments for Your Team**  
  - **For recruiters**: Use this as a checklist for any new screen (e.g., "Why are we requiring AWS certs?").  
  - **Values calls**: If a screen fails Step 1, hold a workshop to define what you’re actually selecting for.  
  - **Iterate**: Run the procedure annually—signals degrade (e.g., referrals work until your company grows and trust erodes).  

  **Final Takeaway**:  
  Your skepticism is spot-on. Credentials like CS degrees are often pooled signals; unpaid projects misalign costs; referrals are your strongest signal but need bias controls. Prioritize screens where costs scale with *lack of ability* (e.g., skill tests > pedigree). Drop anything that’s become a commodity.
