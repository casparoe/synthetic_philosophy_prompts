  First, I need to outline the desiderata. The user mentioned underdetermination (quus vs plus), the normativity of meaning (error vs no fact), novel applications, and generalization. Also, the distinction between prescription and prediction. Each desideratum needs a motivating case. I should make sure the cases are concrete, like the 68+57 example for underdetermination.

