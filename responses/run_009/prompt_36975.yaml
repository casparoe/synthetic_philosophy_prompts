  Also, they want no jargon. Terms like "normativity" need inline definitions. Use examples they relate to: coding errors, testing edge cases. The table might help, but in text, list each desideratum clearly with a case and the tension points.

  Check if all key points are covered: underdetermination, normativity, novel cases, generalization, prescription vs prediction. The tension between natural facts and normativity is crucial. Explaining why that's hard to resolve—like how natural facts describe what is, but meaning says what ought to be. That dichotomy is the core issue.

  Make sure the scorecard is concise. Dispositionalism: meets underdetermination and generalization but fails normativity and prescription. Non-factualism: avoids underdetermination but fails normativity and prescription. Normative primitivism: satisfies all but might violate naturalism. Highlighting that no solution is perfect reinforces the problem's difficulty.

