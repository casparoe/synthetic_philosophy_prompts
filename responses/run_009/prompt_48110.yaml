  Two friends in my philosophy club got stuck on Moore's paradox last night and asked me to referee, and honestly I couldn't. Context: we'd been talking about self-defeating statements, and Dev claimed that "it's raining but I don't believe it" is just a contradiction, like saying the wall is both white and not white, so anyone who asserts it has contradicted themself. Maya said that's not right — it could easily be true: it's raining outside right now and, being fast asleep, she has no beliefs about the weather at all. Dev granted it's possibly true but said nobody can coherently assert it, and that unassertability is what matters when we call something self-contradictory in practice. Maya replied that "asserting it guarantees something has gone wrong" is a fact about the speech act, not the proposition, and there's a real difference between contradicting yourself and merely doing something absurd when you speak — like standing up to announce that you're not there. Dev then said if it's merely absurd then Moore made a fuss over nothing, and Maya said no, it's genuinely paradoxical to assert, just not logically contradictory, and that the whole point is explaining how both of those can be true at once. The last round was about the first-person restriction: Dev pointed out that me saying "it's raining but Maya doesn't believe it" is perfectly fine, so the oddness must be an artifact of who's talking, which to him shows it's shallow; Maya said exactly, the fact that it flips with the speaker is what makes it philosophically interesting, and Dev said calling a trick of the pronoun "interesting" is overgenerous. Can you go through their exchange move by move and say who's right at each step and why — especially whether Dev's practice/practice line about unassertability holds up, and whether the last round goes anywhere or is just vibes? Neither of them will accept "you're both a bit right" without the specifics.
