  Summary of activity:

  ### Title: Building Chains in Posets

  **Learning Objective:** To understand why Zorn's Lemma is needed to guarantee the existence of maximal elements in infinite posets, and to experience the failure of the greedy extension procedure in the infinite case.

  **Materials:** 
  - For finite rounds: diagrams of two finite posets (round 1: a chain of 5 elements; round 2: a poset with multiple branches, see example above).
  - For infinite round: a whiteboard or shared document to record the sets (or use mental for the vector space example).

  **Rules:**

  1. Students work in teams of 3-4.
  2. In each round, teams try to build the longest possible chain (totally ordered subset) in the given poset, starting from any element.
  3. In the finite rounds, they write down their chain in one go (they have 2 minutes per round).
  4. In the infinite round, they start from the empty set and at each step add one standard basis vector (e_i for some i not already chosen). They continue for 5 minutes, or until they can't continue (which won't happen).
  5. The team with the longest chain in the finite rounds wins that round. In the infinite round, the team that has the largest linearly independent set at the end wins.

  **Activity Flow:**

  1. **Round 1 (finite):** 
     - Display a chain of 5 elements: a1 < a2 < a3 < a4 < a5.
     - Teams write down a chain. They should write the whole chain from bottom to top.
     - Everyone wins if they have the full chain.

  2. **Round 2 (finite):** 
     - Display a poset with a few branches (like the diamond example above, but with a chain of length 4: a->b->d->e and a->c->d->e are maximal chains of length 4).
     - Teams try to build a chain of length 4.

  3. **Round 3 (infinite):**
     - Explain the vector space example: the poset is linearly independent subsets of an infinite-dimensional vector space with countable basis {e1, e2, ...}. The order is inclusion.
     - Teams start with the empty set. At each step, they add one standard basis vector that they haven't added before. They must ensure that the set remains linearly independent (which it will as long as they are distinct).
     - They continue for 5 minutes, adding as many as they can. They record the set at each step.

  4. **Reflection after infinite round:**
     - Ask: "Did you reach a maximal set?" (No, because there are still vectors left.)
     - Ask: "Could you ever reach a maximal set by this procedure?" (Not in finite steps, and even in infinite steps if you only do countably many, then you would have the entire standard basis, which is maximal.)

  **Debrief:**

  1. In the finite posets, you could build a maximal chain in a finite number of steps. You didn't need any help.

  2. In the infinite poset, you built a chain of linearly independent sets: S0, S1, S2, ... (finite chain in the activity, but imagine continuing forever). This chain has an upper bound: the union S = U S_n. In the infinite case, if you did infinitely many steps and added every basis vector, then S is the entire standard basis, which is linearly independent and maximal.

