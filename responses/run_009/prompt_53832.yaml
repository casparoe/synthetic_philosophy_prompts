     - At Station 4 (fake barn), a student might say: "It's very unlikely to be a real barn, so we shouldn't count it as justified." 
     - Handling: Emphasize that the facilitator has told them the county is known for barns (so it's reasonable to think it's a barn). Also, in the reveal, note that the justification seemed strong at the time.

  Honest note on limitations:

  - The deception in the stations is intentionally set up and then revealed, which makes the luck element salient. In real life, we rarely get such reveals. Also, the fact that the students know it's an experiment might make them more skeptical than in ordinary situations. Thus, the activity might overemphasize the detectability of luck.

